answer: |-
  Here is a sestina enacting the separation of "horse" and "white":

  **The Division**

  This thing that grazes in the field, a **horse**,
  Is known by sight, a presence sharp and **white**.
  But what defines its being? Is it **form**,
  The shape that moves, the substance we can **seek**?
  Or is there something else, a shade, an **absence**
  That slips between the creature and its **name**?

  We call the creature by a single **name**,
  The general kind we recognize as **horse**.
  Yet pointing now, we see not just a **horse**, but **white**.
  The color adds a layer, changes **form**.
  It makes the simple naming hard to **seek**,
  Creates a gap, a kind of **absence**.

  This quality, this specific **absence**
  Of other hues, it troubles the old **name**.
  For "horse" alone feels lacking, incomplete **horse**,
  When faced with this particular bright **white**.
  It asks for more, a different kind of **form**,
  A term that captures color as we **seek**.

  But logic strains when trying hard to **seek**
  The union where the two might meet, no **absence**.
  Can "white" itself contain the living **form**?
  Does "horse" embrace the color in its **name**?
  Or must they part? The solid, real **horse**
  Distinct now from the shimmering **white**.

  The eye insists on seeing pure **white**,
  The mind attempts to hold, to grasp, to **seek**
  The essence in the field. Yet **absence**
  Grows between the color and the **name**
  We built for substance. Separate: the **horse**,
  And separate: the quality, the **form**.

  Is color then a thing outside the **form**?
  Does light adhere, or is it just like **white**,
  A fleeting cloak upon the steady **horse**?
  When definition fails, what can we **seek**?
  The concept fractures. Neither mere **absence**
  Nor simple union holds within the **name**.

  This **absence** splits the thing we thought one **name**.
  The general **form** rejects the specific **white**.
  We **seek** the bond, but find divided **horse**.

  *(Envoi)*

  You stand apart, not **horse** and not quite **white**,
  Each **seek**ing substance: **form** in **absence** held,
  A fractured **name**.
