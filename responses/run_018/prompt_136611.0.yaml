prompt: |-
  my seminar prof keeps throwing around "revolutions devour their children" whenever we talk about 1793—last week he used it to shut down my point that Robespierre's fall was contingent on the Thermidorian coup being botchd first, saying "see, the revolution always eats its own, so contingency doesn't matter." I'm pretty sure that phrase is smuggling in like five different claims at once but I can't disentange them. Can you lay out the precise readings—maybe it's about ideological escalation, maybe about institional design lacking veto points, maybe about some Marxist law of class struggle turning inward, maybe just a poetic way to say violence begets violence? For each one say if it's trivial, if it's actually supported by the Revolution's specific mechanics, and whether it really kills contingency the way he used it. Also flag where your reasoning is shakiest and what specific historical counterexample or theoretical argument would make you drop your favorite reading. Keep it to one paragraph, max 250 words, and don't just hand me a reading list.
reasoning: |-
  Okay, the user is frustrated with their professor's use of "revolutions devour their children" as a conversation-stopper during debates about Robespierre's fall. They suspect the phrase bundles multiple unexamined claims and want them dissected. 

  First, I need to unpack the phrase's possible meanings: Is it about inevitable ideological radicalization? Institutional failure? Class struggle dynamics? Or just cyclical violence? Each interpretation needs scrutiny for historical accuracy and whether it truly negates contingency. 

  The professor's dismissal of contingency is particularly problematic. The Thermidorian coup wasn't inevitable—it nearly failed due to miscommunication! Highlighting that botched execution could expose how the professor's deterministic reading flattens history. 

  I should also note where my own analysis might be shaky. For example, linking institutional design to purges risks oversimplifying—the Committee of Public Safety's structure didn't *force* Robespierre's fall; human errors mattered. A counterexample like the Glorious Revolution (less self-cannibalizing) could challenge the "inevitability" claim. 

  The user clearly wants ammunition for seminar debates, so I'll prioritize crisp, evidence-backed rebuttals over theoretical tangents. No reading lists—just focused analysis showing how the professor's mantra conflates distinct mechanisms. 

  Most importantly, I must validate their intuition: yes, the phrase *is* smuggling claims, and no, contingency wasn't irrelevant in 1793. The revolution didn't "devour" Robespierre; specific actors bungled a coup.
answer: |-
  Here's a breakdown of the "revolutions devour their children" phrase applied to 1793, assessing claims and contingency:

  1.  **Ideological Escalation:** Claim: Revolutions radicalize, demanding ever-greater purity, consuming initial leaders as insufficiently revolutionary. *Supported?* Yes, seen in Hebertists/Dantonists purged by Robespierre. *Trivial?* Not entirely; it captures a dynamic. *Kills Contingency?* No – escalation wasn't automatic; factional choices and external pressures mattered. Robespierre *chose* escalation tactics.
  2.  **Institutional Failure:** Claim: Revolutionary institutions (like Committee of Public Safety) lack checks, enabling purges. *Supported?* Partly – the Terror's structure concentrated power. *Trivial?* Somewhat – power concentration enabling violence is common. *Kills Contingency?* No – institutions are designed/used by people; Thermidorians *exploited* institutional weaknesses, but their *success* wasn't guaranteed by the structure alone.
  3.  **Marxist Class Struggle:** Claim: Revolution's initial bourgeois leaders are consumed as radical factions (representing lower classes) emerge but are then suppressed by the consolidating bourgeois revolution. *Supported?* Debatable – factions were complex, not purely class-based. *Trivial?* Not if framed specifically. *Kills Contingency?* Overly deterministic; ignores agency and specific events like the botched coup attempt.
  4.  **Violence Begets Violence:** Claim: Foundational revolutionary violence creates a logic/atmosphere where eliminating rivals becomes normalized. *Supported?* Strongly – the Terror normalized political murder. *Trivial?* As a broad truism, yes; as a specific mechanism, less so. *Kills Contingency?* Weakly – it creates context but doesn't dictate *who* dies *when* or *how*; the *timing* and *success* of Thermidor were contingent.
  5.  **Poetic Fatalism:** Claim: Revolutions inevitably self-destruct by consuming leaders. *Supported?* Superficially by outcomes. *Trivial?* Yes, and circular. *Kills Contingency?* Completely and invalidly – it's post-hoc description masquerading as law.

  **Contingency:** Your professor is wrong. The *specific mechanics* of the Thermidorian coup (missteps, delayed arrests, Convention speeches turning opinion) were highly contingent. A better-executed initial arrest *could* have prevented Robespierre's speech and rally, changing the outcome. The phrase describes a *pattern*, not an iron law; its explanatory power relies on the specific mechanisms above, none of which negate the role of chance, individual decisions, and unique events. **Shakiest Reading:** The Marxist one – class lines were blurred. A strong counterexample would be a revolution where initial leaders *weren't* purged by more radical successors despite similar pressures (e.g., some argue the American Revolution fits, though scale differs). My favorite (violence begetting violence) is weakest if shown that intense violence *didn't* lead to leader purges in a comparable revolution.
