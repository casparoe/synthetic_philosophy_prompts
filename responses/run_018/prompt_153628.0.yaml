  And weaker points:
  - Practical irreducibility
  - Emergent laws

  But the user also wants meta-analysis: Is treating all resistance as temporary ignorance a cop-out? That's tricky. It could be virtuous if reductionism is true but we're cognitively limited - but vicious if it makes the position unfalsifiable. I should note that even hardcore reducers must concede some cases would falsify their view, like proving consciousness requires non-physical properties.

  Ah, and the collapse risk! If reductionists start accepting irreducible relations or patterns, they've smuggled in skyhooks. The user's worry about "structural residue" is spot-on - it's the line where reductionism becomes emergence in disguise.

  For organization, I'll rank counterevidence as fatal, seriously damaging, or awkward. Fatal would be things like Gödelian arguments applied to physics. Seriously damaging: robust downward causation in complex systems. Awkward: explanatory gaps we can't currently bridge. The key is distinguishing between "we haven't reduced it yet" and "it's fundamentally unreducible."

  The user's demand for what reducers must concede is crucial. They should admit that certain mathematical results (like uncomputability) genuinely constrain physical reductionism. And if macro-properties systematically disappear when you isolate components - like how traffic jams vanish when you only study single cars - that's bad news.

  Finally, I'll flag that if reducers retreat to saying "history plus physics explains all patterns," they might accidentally endorse a structuralist view where patterns are real and irreducible - the very skyhook they wanted to eliminate. That'd be ironic collapse into rival metaphysics.
answer: |-
  Here's a systematic breakdown of what counts against exhaustive crane construction (ECC), ranked by decisiveness, with analysis of its vulnerabilities and potential for collapse into rival views:

  ### Fatal Counterevidence (Would Force Abandonment or Radical Reformulation)
  1. **Formal Proof of Uncomputability/Undecidability in Physical Systems:**  
     *Evidence:* A rigorous demonstration (e.g., akin to Gödel's incompleteness or the halting problem) that certain macro-properties (e.g., conscious qualia, intentional content) are *logically undecidable* from any finite physical description + historical path.  
     *Why Fatal:* ECC claims *in-principle* reconstructibility. If a property is provably uncomputable from microphysics + history, reconstruction is impossible—not just practically, but mathematically.  
     *Proponent's Concession:* This would refute ECC. Even Dennett (a key crane advocate) accepts Gödelian limits on formal systems.

  2. **Systematic Vanishing of Macro-Properties Under Bottom-Up Reconstruction:**  
     *Evidence:* Macro-properties (e.g., subjective experience, normative force) that *disappear* when exhaustively reduced—not redescribed, but lose their essential character (e.g., explaining "redness" solely via retinal cones leaves out the qualia). If this vanishing occurs across *all possible* reconstructions, it signals an ontological gap.  
     *Test Case:* Consciousness. If a perfect physical duplicate of a brain lacks subjective experience (a la Chalmers' zombie argument), ECC fails.  
     *Why Fatal:* ECC requires reconstructing *all* macro-properties. If they evaporate upon reduction, they aren't "reconstructed" at all—they're eliminated.

  3. **Irreducible Relational Structures with Causal Power:**  
     *Evidence:* Demonstrable causal efficacy of relations not reducible to intrinsic micro-properties + history (e.g., quantum entanglement generating macro-effects, or institutional power existing *only* in relational networks).  
     *Why Fatal:* ECC demands all structure be "rebuilt" from local dynamics. If relations *themselves* are causal primaries (e.g., "ownership" isn't in atoms but in social relations), reduction fails.  
     *Collapse Risk:* Defenders might relabel irreducible relations as "complex cranes," but this covertly accepts structural realism—a rival view.

  ---

  ### Seriously Damaging Counterevidence (Forces Major Qualification)
  4. **Multiple Realizability with Explanatory Inadequacy:**  
     *Evidence:* Macro-properties (e.g., "money," "pain") realized by wildly different physical substrates, where bottom-up reconstructions *fail to explain* the shared macro-property.  
     *Why Damaging:* ECC must explain why diverse implementations share identical macro-properties. If reconstruction only describes implementation details without capturing the universal (e.g., "monetary value" reduces to paper/bytes/shells but loses the economic essence), it’s explanatorily hollow.  
     *Proponent's Concession:* ECC must show how history + physics *exhaustively* accounts for the abstract pattern—not just its instances.

  5. **Downward Causation Resistant to Causal Exclusion:**  
     *Evidence:* Macro-structures (e.g., ecosystems, markets) exerting causal influence *not traceable* to micro-dynamics, with demonstrable causal exclusion (e.g., deleting the macro-pattern alters outcomes even with identical micro-components).  
     *Example:* A traffic jam causing individual car movements, where reconstructing each car’s physics *misses* the jam’s causal role.  
     *Why Damaging:* ECC asserts macro-causation is always "reconstructible" from below. If top-down causation is irreducible, reconstruction is incomplete.

  6. **Historical Path-Dependence as Non-Physical Residue:**  
     *Evidence:* Contingent historical events (e.g., the QWERTY keyboard, speciation events) that *constitutively* define macro-properties but cannot be derived from micro-dynamics alone.  
     *Why Damaging:* ECC treats history as "just more physics." If history introduces *sui generis* constraints/logic (e.g., evolutionary drift, cultural path-dependence) that aren't physical laws, it becomes a skyhook.  
     *Collapse Risk:* Reducing history to physics risks circularity—e.g., "the history is physical because physics caused it."

  ---

  ### Awkward Counterevidence (Challenges but Doesn't Refute)
  7. **Persistent Explanatory Gaps:**  
     *Evidence:* Domains like consciousness or meaning that resist reduction despite centuries of effort, with no clear path to closure (e.g., Levine's "explanatory gap," Kripke's modal arguments).  
     *Why Awkward:* Proponents dismiss this as "temporary ignorance," but if gaps persist *systematically* across domains, it suggests ECC is a promissory note rather than empirical truth.  
     *Insulation Critique:* Treating all gaps as cognitive limits *does* risk unfalsifiability—a vice if no conceivable evidence could falsify ECC.

  8. **Emergent Laws with Predictive Autonomy:**  
     *Evidence:* Macro-domains (e.g., thermodynamics, ecology) with laws that predict outcomes *more efficiently* than micro-reconstructions, and are indispensable for scientific practice.  
     *Example:* Predicting pressure/temperature via statistical mechanics without tracking every particle.  
     *Why Awkward:* ECC can reframe this as "pragmatic crane use," but if emergent laws have *unique predictive power* unrecoverable from micro-dynamics (e.g., phase transitions), it hints at ontological emergence.

  ---

  ### Proponent's Concessions & Collapse Risks
  - **What Proponents Must Concede:**  
    - Gödel-style undecidability *would* refute ECC.  
    - If a macro-property *systematically vanishes* under reduction (e.g., qualia → neurons), ECC fails.  
    - ECC cannot treat history as a "black box"—it must show how historical trajectories are physically implemented.  

  - **Unfalsifiability Risk:**  
    ECC is insulated if *all* counterexamples are dismissed as "unsolved but solvable." This is a **vice** if no criteria exist for what counts as a reconstruction failure. A virtuous ECC must specify *in advance* what evidence would falsify it (e.g., uncomputable macro-properties).  

  - **Collapse into Rival Views:**  
    ECC risks collapsing into **structural realism** if it accepts irreducible relations (e.g., "patterns" or "networks" as fundamental). It also edges toward **neutral monism** if "history + physics" is a primitive substrate. Both concede that *something* beyond micro-physics + history is needed—contradicting ECC’s core claim.

  ### Conclusion
  The strongest threats to ECC are **formal undecidability**, the **systematic vanishing of macro-properties**, and **irreducible relational causation**. These aren't just awkward—they’d force surrender. Persistent explanatory gaps and insulation from falsification are serious concerns but not fatal. ECC survives only if all macro-patterns are *both* ontologically grounded in microphysics *and* epistemically reconstructible without loss. The moment it admits irreducible structure—even if relabeled as a "crane"—it becomes a rival view in disguise.
