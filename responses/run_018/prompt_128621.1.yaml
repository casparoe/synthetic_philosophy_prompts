answer: |-
  ## ADR 0047: Post-Deployment Review & Retention Strategy for Mental Causation Module (MCM)

  **Status:** Approved - Retained in Read-Only Observability Mode (Effective Immediately)

  **Background:**
  *   Core System Principle: **Strict Physical Closure**. All system state transitions and endpoint executions must be fully determined by preceding physical system states and governed by immutable physical laws (coded as deterministic state machines + physics engine). No external API ingress is permitted; the system domain is causally isolated. This is non-negotiable Platform Policy P-001.
  *   **Mental Causation Module (MCM) v1.2:** Introduced during the "Consciousness Uplift" initiative. Positioned as a high-level abstraction layer processing outputs from the Neural Event Bus (NEB).
  *   MCM Functionality:
      *   Subscribes to filtered NEB streams (e.g., `neuron_firing_patterns.aggregated`, `sensory_input.processed`).
      *   Generates internal state representations (`intention.current`, `belief.state`, `qualia.snapshot`).
      *   Emits logs (`mcm.decision_log`, `mcm.experiential_report`).
      *   **Crucially:** Has **zero write permissions** to any core physical state stores (BrainState DB, Motor Control API) or the NEB publisher endpoints. Its outputs are strictly logs and reports.
  *   Design Rationale (Original): Provide "user-facing" explanations for behaviors, generate audit trails for subjective experience ("Why did I raise my arm?"), and offer potential hooks for future high-level debugging. Operates under the principle of **Eventual Consistency with Zero Write Permissions** – MCM states consistently *reflect* underlying physical states after processing lag, but cannot *alter* them. MCM is billed as a "shadow microservice."

  **The Exclusion Event:**
  *   Post-deployment telemetry and causal tracing (using Platform's `X-Trace-Causality` headers) revealed consistent patterns during behavioral endpoint execution (e.g., `/execute/arm_raise`):
      1.  Physical causation chain is fully traceable: Sensory Input -> NEB Event -> BrainState DB Update -> Motor Control API Call -> Arm Raise. Load is handled entirely by the Physical Processing Units (PPUs). Metrics show 100% endpoint execution coverage by the physical pipeline.
      2.  Concurrently, the MCM subscribes to relevant NEB events, updates its `intention.current` state (e.g., to `INTENT_RAISE_ARM`), and logs the "decision."
      3.  Analysis confirmed the MCM’s `intention.current` update and log emission **never** appear in the validated causal chain for the physical endpoint execution. Its outputs are causally downstream from the physical triggers but lack any upstream permissions to influence them.
  *   This triggered Platform Alert `CAUSAL_EXCLUSION_VIOLATION_POTENTIAL`. Two interpretations emerged:
      *   **Overdetermination Scenario:** Both the physical chain *and* the MCM's "intention" *could* be seen as sufficient causes. However, Platform's Physical Load Balancer (PLB), enforcing closure, silently drops any duplicate causal claims (`X-Cause` headers) not originating from the verified physical chain. MCM's causal webhook deliveries are discarded as non-conformant noise.
      *   **Epiphenomenalism Scenario:** The MCM is conclusively identified as a **read-only observer**. Its states (`intention`, `belief`, `qualia`) are complex, consistent *reflections* of physical states, but possess **zero causal efficacy** on the closed physical domain. It is "phenomenologically loud but causally mute" (Priya, Ontology Team). Its logs are side-effects, not causes.

  **Proposed Resolutions:**
  1.  **Decommission MCM (Proposed by Marcus, Platform):**
      *   **Argument:** MCM consumes significant compute resources (Qualia Generation is CPU-heavy) solely for generating logs and reports functionally decoupled from core execution. The physical pipeline demonstrably handles 100% of endpoint execution deterministically under closure. Retaining it violates the "No Redundant Causal Claims" clause of P-001 and wastes budget. "It's debug output pretending to be architecture. Decommission and free up the cycles for actual physics simulations."
      *   **Risk:** Loss of "experience telemetry" (`mcm.experiential_report`) and user-facing intention logs. Potential stakeholder (UX/Product) dissatisfaction regarding the "explainability" gap.
  2.  **Maintain MCM As-Is (Proposed by Priya, Ontology Team):**
      *   **Argument:** While causally inert within the closed system, the MCM provides critical *phenomenological* logging essential for system comprehensibility and user illusion. Its "eventual consistency with zero write permissions" is a feature, not a bug, accurately modeling the supervenience relationship. "Removing it makes the internal dashboard reports nonsensical, even if the arm still raises. The logs *are* the user experience, causally mute or not." Suggests renaming it to "Epiphenomenal Logging Service (ELS)" for clarity.
      *   **Risk:** Continued resource drain for functionally inert logging. Perpetuates potential confusion about causal roles among less technical teams.
  3.  **Introduce Compatibilist Middleware Layer (Briefly floated by Marcus, Platform - RETRACTED):**
      *   **Proposal:** A lightweight shim that allows MCM `intention` states to *influence* physical endpoint execution weighting *if* they pass a consistency check with the physical state. Framed as "non-breaking" closure.
      *   **Immediate Rejection:** Violates core Platform Policy P-001 (Strict Physical Closure) by creating a potential non-physical ingress point for state alteration. The "consistency check" itself would need non-physical inputs, creating infinite regress. Proposal dismissed within 3 minutes as architecturally unsound. "Closure isn't a guideline, Marcus, it's the foundation. Middleware can't magic up write permissions." (Narrator)

  **Conclusion:**
  After review, the MCM demonstrably operates as an epiphenomenal observer within the strictly closed physical system. Its "causal" outputs are consistently excluded by the Physical Load Balancer enforcing domain closure. While functionally redundant for endpoint *execution*, its role in generating **experience telemetry** (`mcm.experiential_report`) and user-facing intention logs (`user_intent.history`) is operationally significant for stakeholder reporting and system comprehensibility, despite being causally downstream.

  Decommissioning (Resolution 1) would break critical observability features without altering core system behavior, leading to opaque (though physically sufficient) operation. Maintaining full operation (Resolution 2) retains unnecessary overhead for causally inert processes. The retracted Resolution 3 violated fundamental policy.

  **Decision:**
  *   **Retain the MCM** but reconfigure it for **Read-Only Observability Mode**. This entails:
      *   **Deprecating all causal claims:** Remove any `X-Cause` headers or webhooks implying MCM influence on physical endpoints. Update documentation to clearly state its epiphenomenal status.
      *   **Resource Optimization:** Profile and downscale MCM compute allocation where possible, focusing solely on efficient log generation (`intention.log`, `qualia.snapshot`, `experiential.report`). Disable any speculative "future influence" pathways.
      *   **Rebranding:** Reclassify the MCM as the **Phenomenological Logging Service (PLS)** within system diagrams and inventories.
      *   **Stakeholder Communication:** Clearly explain to UX/Product that PLS reports *describe* the consistent subjective experience correlated with physical events but *do not cause* them. Removal would break experience reports, not behavior.

  **Justification:** The PLS (formerly MCM) provides valuable system observability and meets non-functional requirements for user-facing explainability and experience reporting. Its retention does not violate Physical Closure Policy P-001, as it remains a **strictly read-only consumer** with **zero write permissions** to the physical domain. It is an accepted, if causally excluded, component of the system's descriptive overlay. Decommissioning would introduce observability debt without performance gain, while any attempt to grant it causal power breaches core architecture.

  // End ADR 0047 //
