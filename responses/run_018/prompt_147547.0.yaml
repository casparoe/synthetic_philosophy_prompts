answer: |-
  Here’s your Q&A prep sheet, structured for tactical defense against your audience. Weaknesses brainstormed first:  

  **Core Weaknesses of Your Thesis:**  
  1. **Metaphysical Bloat**: Positing "temporal selves" as bargaining agents risks reifying abstractions and undermines intuitive unity of agency.  
  2. **Normative Vacuum**: If hyperbolic discounting is "rational reservation," why resist akrasia? Lacks prescriptive force.  
  3. **Frankfurt Counter**: Hierarchical identifications could override bargaining outcomes, making negotiation irrelevant.  
  4. **Virtue Ethics Slippery Slope**: If akrasia isn’t a character flaw, practical wisdom (*phronesis*) becomes incoherent.  

  ---  
  **Q&A PREP SHEET**  
  *(Ordered by Likelihood/Severity of Objection)*  

  ### **1. Virtue Ethicist Objection** (High Damage)  
  *Phrasing:* "If akrasia is mere bargaining failure between temporal parts, you dissolve the *unified agent* necessary for character virtues. How can we hold people morally responsible for actions chosen by a ‘self’ that doesn’t reflect their integrated character?"  
  - **Reply (2-min)**: "Akrasia as bargaining failure *presupposes* an overarching agent whose interests are negotiated. Responsibility attaches to the whole agent for failing to structure reliable intertemporal commitments—akin to a state failing to enforce treaties between provinces. The ‘unified self’ is the polity, not the dictator."  
  - **Soft Spot**: Conflates metaphysical unity with practical unity. Doesn’t fully address how virtues *constitute* the self.  
  - **Concede Upfront**: "I grant that phenomenological unity is the default experience—but *practical* unity is an achievement, not a given."  

  ### **2. Behavioral Economist Objection** (Medium Damage)  
  *Phrasing:* "Hyperbolic discounting is empirically measurable as a *computational error*: people inconsistently value identical rewards at different times. Calling it ‘rational reservation price’ ignores that it’s stochastic noise, not strategic negotiation."  
  - **Reply (2-min)**: "If the future self’s compliance is genuinely uncertain (e.g., due to shifting context), present bias *is* rational risk-management. Your models treat reliability as a given—but in real agents, it’s a variable. Noise is the negotiation friction, not refutation."  
  - **Soft Spot**: Doesn’t explain why humans can’t learn reliability. Risks tautology: "Bias is rational because selves are unreliable because bias exists."  
  - **Concede Upfront**: "I agree we *can* reduce discounting through commitment devices—but that’s the bargaining solution, not error-correction."  

  ### **3. Frankfurtian Grad Student Objection** (Low Damage)  
  *Phrasing:* "Your model ignores second-order volitions. If my future self *reflectively endorses* resisting temptation, doesn’t that hierarchically invalidate the present self’s ‘reservation price’ as irrational?"  
  - **Reply (2-min)**: "Hierarchies don’t annul bargaining—they *are* bargaining positions. A future self’s endorsement is just one temporal party’s stance. Authority isn’t ontologically privileged; it’s negotiated, like a constitution ratified by successive governments."  
  - **Soft Spot**: Undermines Frankfurt’s core claim that higher-order volitions define "the person."  
  - **Concede Upfront**: "Reflective endorsement *should* carry extra weight—but addicts’ ‘true selves’ often fail to govern."  

  ### **4. Nuclear Option: Suicide/Self-Harm Rationality** (Extreme Damage)  
  *Phrasing:* "If a future self is sufficiently unreliable (e.g., chronic pain, dementia), wouldn’t your framework make suicide the present self’s rational exit from a bad bargain?"  
  - **Reply (2-min)**: **FIRST:** "This framework describes *how* akrasia occurs, not what’s *ethically justified*. **SECOND:** Rationality here is *instrumental* to the present self’s goals—but those goals include future existence under non-ideal terms. **THIRD:** Total breakdowns (e.g., dementia) involve dissolution of agency itself, not intertemporal bargaining."  
  - **Soft Spot**: Implies that existential continuity is non-negotiable—contradicting your model’s logic.  
  - **Preemptive Strike**: Never frame future selves as "separate agents." Call them "temporal phases of a single negotiator."  

  ---  
  **STRATEGIC NOTES**  
  - **Open With**: "I concede that a *minimal* unity of agency is necessary—but it’s thinner than virtue ethics assumes. Think ‘joint-stock company’, not ‘monarchy’."  
  - **Key Move**: Stress "This is a *descriptive* model of akrasia, not a normative ideal."  
  - **Pray They Don’t Ask**: The suicide question. If raised, pivot hard to "This is why we need external scaffolds (laws, therapists) to enforce intertemporal deals."  
  - **Win Ground**: Frame virtue ethicists’ "unitary self" as the *exception* (achieved via habituation), not the rule.  

  Go make those temporal selves negotiate a standing ovation. 🎤
