  9.  **Conclusion contrasting (i)/(ii) with (iii):** Correctly summarizes that (i) and (ii) suffer reflexive closure problems but incorrectly asserts (iii) escapes them. The latter claim is unsupported due to failure to address the meta-relocation issue for resource constraints. **(-1)**  

