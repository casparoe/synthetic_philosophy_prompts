  ### Step 3: Determine the Implicit Procedure
  - **Expected maximization is simpler and directly aligns** with the panel’s explicit moral uncertainty framework (credence-weighted scores). No veto is needed to explain past decisions, as declines occur only when expected totals are negative (Case 2).  
