  ### Step 5: Principle Adopted
  - **Expected choiceworthiness maximization**: Authorize if \( \text{(Credence}_I \times \text{Score}_I) + \text{(Credence}_S \times \text{Score}_S) > 0 \).  
    This embodies the panel’s moral uncertainty by weighting theories by credence and normalizing scores.  
