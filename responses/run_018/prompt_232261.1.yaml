prompt: |-
  Before I evaluate any further proposals about who should be entitled to vote, I want to fix what an adequate theory in this area has to deliver. Write the desiderata for a theory of the franchise and its character: who should be entitled to vote, and whether voting is best understood as a right or as a legal duty. For each desideratum, give the case or consideration behind it, and mark which are non-negotiable requirements that any plausible view must meet and which are merely preferences of a particular camp. Include any distinctions such a theory must respect — for instance, the difference between being subject to a polity's laws and being affected by its decisions, or between a right to vote and an obligation to vote — with the case for why each distinction carries weight. The pressure points I most want addressed: proposals to lower the voting age down through adolescence and toward children, extending the vote to long-term non-citizen residents, the status of non-resident citizens, disenfranchisement of prisoners and ex-felons, voters with severe cognitive disabilities, and compulsory voting systems that treat turnout as a legal obligation. Then flag any pairs of desiderata you suspect cannot be jointly satisfied, and say which requirement does the most to exclude otherwise plausible candidates. For example, a principle that everyone significantly affected by a polity's decisions should have some say pulls toward very broad enfranchisement, while any competence condition pulls toward restriction; if that tension cannot be fully dissolved, say which side has to give and why. The part I most want is the diagnosis of tensions among the criteria themselves, not a scorecard of existing positions.
reasoning: |-
  Okay, let me approach this systematically. The user wants a framework for evaluating voting rights theories, with special attention to inherent tensions. They've listed specific pressure points like voting age and prisoner disenfranchisement, but the real focus is on conflicting principles.

  First, I need to establish core desiderata. The non-negotiables seem clear: political equality and popular sovereignty form the bedrock. Without these, you lose democracy itself. Then come the negotiable but important ones like competence thresholds - these reflect values but allow debate. 

  The distinctions feel crucial too. Subject-vs-affected is key because otherwise franchise could extend infinitely; right-vs-duty matters for coercion debates. I should illustrate how these play out in the pressure points. For instance, lowering voting age pits developmental competence against inclusion interests.

  The tensions section is where the user wants depth. All-affected vs competence creates genuine conflict - one widens franchise while the other restricts. In practice, competence usually wins because unconstrained inclusion risks democratic functionality. But that trade-off deserves explicit acknowledgement.

  For each pressure point, I'll map how desiderata collide. Non-resident citizens? Political equality vs effective representation. Compulsory voting? Civic duty vs autonomy. The prisoner case shows how multiple principles interact messily - retribution vs rehabilitation vs prevention.

  The hardest exclusions will likely involve cognitive disability cases. Competence requirements inevitably create boundaries, and no bright line satisfies everyone. Here I should emphasize that while political equality demands maximal inclusion, functionality constraints force difficult compromises.

  Throughout, I'll maintain that some contradictions can't be resolved - only managed through transparent prioritization. The value isn't in solving these but in revealing where theories must make their toughest choices.
answer: |-
  Here is a structured analysis of the desiderata for a theory of the franchise, the key distinctions it must address, the pressure points, and inherent tensions:

  ### I. Core Non-Negotiable Desiderata (Essential for any plausible democratic theory)
  1.  **Political Equality (One Person, One Vote of Equal Weight):**
      *   **Case:** Foundational for legitimacy. If votes carry unequal weight or groups are systematically excluded, outcomes reflect power imbalances, not popular will. Undermines the very idea of collective self-government.
      *   **Non-Negotiable:** Yes. Failure here means the system isn't democratic.

  2.  **Popular Sovereignty (Government Legitimacy Derives from the Consent of the Governed):**
      *   **Case:** Justifies state authority. Laws bind because they are (in principle) authored by those subject to them. Requires those subject to binding laws to have a say in their creation.
      *   **Non-Negotiable:** Yes. The core legitimizing principle of democracy.

  3.  **Subjection to Coercive Power (Primary Basis for Inclusion):**
      *   **Case:** Those bound by the state's monopoly on legitimate force (laws, taxes, punishment) have the strongest claim to a voice in wielding that power. Directly links the experience of coercion to the right to authorize it.
      *   **Non-Negotiable:** Yes. Provides the most defensible core constituency. *Distinguishes from merely being affected.*

  4.  **Institutional Feasibility & Stability:**
      *   **Case:** A franchise system must be administratively possible, resistant to fraud, and sustainable without collapsing under its own weight or generating constant crisis. An unworkable ideal is no theory at all.
      *   **Non-Negotiable:** Yes. Pragmatic necessity for any real-world implementation.

  ### II. Important but Negotiable Desiderata (Reflecting Values, Open to Weighting)
  5.  **Competence/Functional Capacity:**
      *   **Case:** Voting requires understanding choices and consequences for collective decision-making. Excluding those demonstrably incapable (e.g., severe cognitive impairment without supported decision-making) protects the integrity of the process and the interests of the vulnerable. *Distinguishes capability from mere subjection.*
      *   **Negotiable:** Yes. Extent and criteria (age, cognitive tests) are highly contested.

  6.  **Stake in the Community's Future (Residency Focus):**
      *   **Case:** Those living within the jurisdiction and enduring the long-term consequences of decisions deserve a primary voice. Incentivizes informed voting based on lived experience.
      *   **Negotiable:** Yes. Strength relative to subjection or citizenship is debated.
      *   *Distinguishes residents from non-resident citizens.*

  7.  **Civic Membership & Contribution (Citizenship Focus):**
      *   **Case:** Citizenship signifies full, permanent membership and allegiance, often involving contributions (taxes, military service). Voting is a core right/responsibility of this status.
      *   **Negotiable:** Yes. Strength relative to residency/subjection is debated (especially for long-term non-citizen residents).

  8.  **Prevention of Perverse Incentives/Harm Mitigation:**
      *   **Case:** Granting the franchise to groups perceived as likely to vote against fundamental interests or stability (e.g., disenfranchising felons to prevent "lawbreakers" choosing weak laws) or to mitigate conflict (e.g., historical restrictions).
      *   **Negotiable:** Yes. Highly contentious, easily abused, often conflicts with equality/subjection.

  9.  **Maximizing Inclusion/Reducing Arbitrary Exclusion:**
      *   **Case:** Broad participation fosters legitimacy, diverse perspectives, and protects against tyranny of the majority. Exclusion requires strong justification.
      *   **Negotiable:** Yes. How far beyond the core (subjected residents/citizens) to go is contested.

  10. **Voting as Right vs. Duty:**
      *   **Right:** Protects individual autonomy; non-participation is a legitimate choice. Coercion undermines the freedom democracy protects.
      *   **Duty:** Strengthens legitimacy (higher turnout), promotes civic responsibility, combats apathy/special interests, ensures decisions reflect the whole populace.
      *   **Negotiable:** Yes. Reflects different conceptions of citizenship and the state-individual relationship.

  ### III. Critical Distinctions & Their Weight
  1.  **Subject to Laws vs. Affected by Decisions:**
      *   **Weight:** Paramount. Subjection involves direct, ongoing, enforceable coercion by the state (laws, taxes, penalties). Being "affected" is vastly broader, indeterminate, and reciprocal (everyone is affected by everything globally to some degree). Franchise based *solely* on being affected is administratively impossible and dissolves any coherent demos. *Subjection provides the necessary boundedness.*
  2.  **Right to Vote vs. Obligation to Vote:**
      *   **Weight:** Significant. Defines the nature of citizenship. Is voting a liberty to be exercised freely (like speech) or a mandatory civic function (like jury duty)? Impacts legitimacy claims (duty proponents argue higher turnout = stronger mandate) and individual liberty (right proponents decry coercion).
  3.  **Residency vs. Citizenship:**
      *   **Weight:** Crucial for pressure points. Does living under the laws long-term create a stronger claim than formal membership? Challenges traditional nation-state models.
  4.  **Competence Thresholds (Age, Cognition) vs. Inclusion:**
      *   **Weight:** Fundamental tension. Where to draw the line on capacity without arbitrary exclusion? Affects children, cognitively disabled, etc.

  ### IV. Pressure Points & Desiderata in Conflict
  *   **Lowering Voting Age (incl. Children):**
      *   *Tension:* **Inclusion/Subjection** vs. **Competence.** Can competence be presumed at lower ages? Does subjection override developing capacity? Does inclusion foster civic education?
  *   **Long-Term Non-Citizen Residents:**
      *   *Tension:* **Subjection/Stake (Residency)** vs. **Civic Membership (Citizenship).** Are they sufficiently "members" if denied the vote despite long-term subjection and contribution?
  *   **Non-Resident Citizens:**
      *   *Tension:* **Civic Membership** vs. **Stake (Residency)/Subjection.** Do they retain a legitimate claim if not subject to most laws or living with consequences? Administrative feasibility also a concern.
  *   **Disenfranchisement (Prisoners/Ex-Felons):**
      *   *Tension:* **Subjection** (arguably strongest while incarcerated) vs. **Prevention of Perverse Incentives/Punishment** vs. **Political Equality/Reintegration.** Is disenfranchisement just punishment or does it undermine subjection principle?
  *   **Voters with Severe Cognitive Disabilities:**
      *   *Tension:* **Political Equality/Inclusion** vs. **Competence.** Can supported decision-making suffice? Does exclusion based on capacity violate fundamental equality? Where is the defensible line?
  *   **Compulsory Voting:**
      *   *Tension:* **Voting as Duty** (promoting legitimacy/civic engagement) vs. **Voting as Right** (liberty from coercion). Does compulsion undermine the expressive value of voting?

  ### V. Diagnosing Irreconcilable Tensions & Key Exclusions
  1.  **"All Subjected" vs. Strict "Competence":**
      *   **Tension:** Subjection demands enfranchising all subjected individuals. Strict competence thresholds (beyond minimal understanding) inevitably exclude some subjected individuals (e.g., some cognitively disabled, very young children).
      *   **Resolution Required:** Competence *must* give some ground. A theory must either:
          *   Define competence minimally (e.g., basic understanding, potentially achievable with support) to maximize inclusion of the subjected.
          *   Acknowledge that competence exclusions create a necessary but regrettable inequality among the subjected, justified only by the functional need for meaningful collective decision-making. **Competence does the most to exclude.** Finding a non-arbitrary, non-discriminatory minimum threshold is the hardest challenge.
  2.  **"All Subjected" vs. "Civic Membership" (Citizenship):**
      *   **Tension:** Subjection focuses on the experience of being governed. Civic membership prioritizes formal national affiliation. Long-term non-citizen residents are subjected but lack formal membership.
      *   **Resolution Required:** "Civic Membership" must give ground. If subjection is the primary non-negotiable basis (for legitimacy), long-term subjected residents have a strong claim. Excluding them based solely on citizenship status becomes difficult to justify purely on democratic grounds, though arguments about national community and allegiance persist.
  3.  **"All Affected" vs. Institutional Feasibility & Boundedness:**
      *   **Tension:** The "all affected" principle pulls towards universal suffrage, but this is utterly impractical and dissolves any workable demos.
      *   **Resolution Required:** "All Affected" *must* be abandoned as a *primary* franchise criterion. **Subjection provides the necessary and justifiable boundedness.** "Affectedness" might inform other aspects of governance (consultation, rights protections) but cannot define the franchise.
  4.  **Voting as Right (Autonomy) vs. Voting as Duty (Civic Function):**
      *   **Tension:** These are fundamentally different conceptions. One prioritizes individual liberty, the other collective responsibility and legitimacy-through-turnout.
      *   **Resolution Required:** This is a deep value choice, not easily reconciled. A theory *must* commit to one as primary. The "Duty" view requires justifying coercion, which directly conflicts with the autonomy protected by the "Right" view. Neither inherently excludes otherwise plausible candidates for *holding* the franchise, but they define its nature fundamentally differently.

  **Conclusion:** The most profound tension lies between the **inclusionary impulse** driven by Political Equality and Subjection, and the **restrictive requirements** driven by Competence and (to a lesser extent) Civic Membership/Feasibility. While Subjection provides the most defensible core criterion, **Competence** is the requirement that **does the most to exclude otherwise plausible candidates** (subjected individuals deemed insufficiently capable). Any plausible theory must grapple with drawing this line in a way that minimizes arbitrariness while accepting that a perfect reconciliation between full inclusion of all subjected individuals and a meaningful competence threshold is impossible. The legitimacy of the entire democratic enterprise hinges on how convincingly this tension is managed.
