answer: |-
  Your observation reveals profound philosophical tensions in how biomedical institutions operationalize human categories. Let's reconstruct the implicit ontology, distinguish necessary commitments from compatible ones, and explore alternatives:

  **Implicit Ontology of Current Practice:**
  1. **Gender Dualism:** 
     - *Strict Requirement:* Sex assigned at birth (SAAB) is treated as a **fixed biological fact** (based on phenotypical markers), while current gender identity (CGI) is a **mutable social/psychological property**. 
     - *Implied Commitment:* SAAB is ontologically distinct from CGI, belonging to different realms (biological vs. social) requiring separate governance (ethics boards) and siloed data. This enforces a **Cartesian substance dualism** for human identity.

  2. **Race/Ethnicity as Purely Social:**
     - *Strict Requirement:* Race/ethnicity lack inherent biological referents. They exist *solely* as self-determined social identities, mutable at will. 
     - *Implied Commitment:* A **strong social constructionism** where race/ethnicity have no biological essence. The absence of parallel biological tracking (e.g., ancestry markers) explicitly rejects biological realism for these categories.

  **Contradiction & Underlying Tensions:**
  - **Asymmetry Problem:** Gender is bifurcated (SAAB = biological "substrate," CGI = social "overlay"), while race is purely social. This implies SAAB is *more biologically real* than race, despite both being socially interpreted classifications of biological variation.
  - **Governance Paradox:** SAAB's biological status justifies stricter ethical controls (IRB oversight), while CGI and race/ethnicity's social status permits flexible self-reporting. Yet CGI's separation *prevents* understanding the very population (transgender individuals) whose biology/social identity interface is most medically relevant.
  - **Implicit Essentialism:** Storing SAAB permanently (even when biologically inaccurate for intersex/trans individuals) treats it as an immutable "ground truth," subtly essentializing a specific biological interpretation.

  **Could a Unified Theory of Social Kinds Accommodate This?**
  Yes, but only by accepting significant inconsistencies:
  - **Core Unified Premise:** *All* categories (SAAB, CGI, Race, Ethnicity) are **interactive kinds** (Hacking) – classifications that interact with and shape the classified.
  - **Accommodating the Data:**
    - SAAB is an *initial biological assignment* with powerful institutional inertia.
    - CGI is the *current personal-social identification*.
    - Race/Ethnicity are *ongoing socially negotiated identities*.
  - **The Contradiction Persists:** The practice *still* treats SAAB uniquely as a persistent biological "anchor" while denying race any biological trace. A truly unified theory would need to treat SAAB *also* as a social assignment (because it is!) and allow equivalent flexibility or contextual linkage.

  **How Alternative Philosophies Would Change Protocols:**

  1. **Consistently Nominalist/Radical Constructionist Approach:**
     - **Premise:** Categories are *only* labels with no essential biological or social referents; meaning derives solely from use.
     - **Protocol Changes:**
       - **Eliminate SAAB as a fixed field.** Replace with optional "biological characteristics relevant to study" (e.g., karyotype, hormone levels, anatomy) collected contextually.
       - **Merge CGI and SAAB into a single "Gender History/Lived Experience" field** with narrative/free-text options. Governed by one ethics board focused on participant autonomy.
       - **Race/Ethnicity remains free-text/self-report,** but linkage to biological data is *permitted* if participants consent to explore social-biological interactions.
       - **Remove silos.** All identity data linkable under unified governance prioritizing self-determination over categorical rigidity. Ethics boards focus on harm prevention, not categorical ontology.

  2. **Consistently Biological Essentialist Approach:**
     - **Premise:** Categories reflect objective, biologically discrete human kinds.
     - **Protocol Changes:**
       - **SAAB replaced by "Biological Sex"** defined by immutable biomarkers (e.g., specific genomic loci). Requires verification (e.g., genetic testing).
       - **CGI becomes irrelevant or a purely psychiatric/social field** disconnected from core biological data. Likely removed from biomedical registries.
       - **Race/Ethnicity replaced by Genetic Ancestry.** Mandatory collection of genomic data (SNPs) to assign individuals to biologically defined populations. Self-report discarded or treated as secondary social overlay.
       - **Centralized biological database.** All "objective" biological data (sex, ancestry) stored together under a single biological sciences IRB. Social data (CGI, self-reported race) stored separately or omitted.

  **Why the Current Hybrid Persists (Despite Inconsistency):**
  1. **Historical Path Dependence:** SAAB recording is a legacy practice from eras of biological determinism. Gender identity separation is a recent (and partial) accommodation to LGBTQ+ advocacy.
  2. **Political Safeguards:** Siloing SAAB/CGI protects transgender individuals from discrimination *using legacy data*, while avoiding debates on biological sex fluidity. Purely social race collection avoids reifying dangerous biological race concepts.
  3. **Regulatory Pragmatism:** Using familiar categories (SAAB, binary race options) satisfies legacy regulatory requirements (e.g., FDA diversity mandates) without complex ontology.

  **Conclusion:**
  The current system presupposes an **asymmetrical ontology**: gender is split into a fixed biological "fact" (SAAB) and a fluid social identity (CGI), while race is purely social. This is unsustainable philosophically, as SAAB itself is a social interpretation of biology. A coherent approach requires either:
  - **Nominalism:** Dismantle the biology/social split entirely, centering self-description and contextual relevance.
  - **Essentialism:** Commit fully to biological reductionism (with grave ethical risks).
  - **Critical Realism (More Coherent Alternative):** Treat *all* categories as **biologically anchored but socially mediated kinds**. SAAB, CGI, and race all involve biological factors (chromosomes, physiology, ancestry) interpreted through social frameworks. Protocols would:
    - Record SAAB *as an initial social assignment*, linkable to CGI.
    - Allow race/ethnicity self-reports *plus optional* ancestry biomarkers *if relevant to the research*.
    - Use unified governance assessing *specific risks* (e.g., stigmatization, misuse) rather than presupposing fixed category ontologies.

  The current practice is less a philosophically coherent model than a pragmatic (and ethically fraught) compromise between competing pressures – one that risks perpetuating the very essentialisms it seeks to avoid for race while failing to fully respect the lived reality of gender.
