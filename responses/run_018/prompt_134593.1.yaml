  I should structure the argument step by step. Start with mutual recognition in roles, use the Analects story to show the spectrum of loyalty, explain remonstration as role-preservation, introduce the epistemic duty, then tackle the autonomy objection. Keep it grounded in Confucian texts without needing citations. Make sure to emphasize that remonstration is internal to the role's logic, not an exception. Highlight the distinction between relational maintenance versus individual rights to counter the objection effectively.
answer: |-
  Here’s the argument, grounded in Confucian role ethics’ internal logic:

  ### 1. **Roles as Mutual Moral Recognition, Not Unilateral Obedience**  
  Confucian roles (*guanxi*) are **constituted by reciprocal obligations** that define the relationship’s moral substance. A father is only "father" by fulfilling paternal virtues (*ci*, loving kindness); a ruler is only "ruler" through benevolent governance (*ren*). The subordinate’s loyalty (*zhong*) is predicated on the superior upholding their end of the relational covenant. When they fail, the role itself frays—loyalty must then manifest as **corrective action to restore the relationship’s integrity**.

  ### 2. **The Stolen Sheep Dilemma: Loyalty's Two Faces**  
  *Analects* 13.18 contrasts two responses to a father’s theft:  
  - **Village A:** "The father hides the son, the son hides the father" → Confucius approves this as "upright" (*zhi*).  
  - **Village B:** Sons testify against fathers → Framed as transactional "honesty," but *not* endorsed.  

  Confucius isn’t praising concealment of corruption. He’s showing that **true loyalty prioritizes relational repair over legalistic accusation**. Village A’s concealment is a *temporary* act of protection *within* an ongoing relationship—implying the son *must* later remonstrate (*jian*) to correct the father privately. Covering the sheep is the first step; remonstration is the necessary second. Both are acts of **role-preservation**: one shields the relationship from external rupture, the other heals its internal decay.

  ### 3. **Remonstration as Role-Preservation, Not Betrayal**  
  If a ruler/parent violates the norms (*li*) defining their role, they erode the relationship’s foundation. The subordinate’s duty to remonstrate arises **because disloyalty would be silent complicity**. To let a parent/ruler persist in corruption is to enable their moral self-destruction—and thus the relationship’s collapse. Remonstration is **loyalty’s active mode**: it insists the superior *be who they ought to be* within the role. Mencius 4A:20 clarifies: "If the ruler errs, remonstrate"—not to reject authority, but to **fulfill the minister’s role** by realigning the ruler with the Way (*Dao*).

  ### 4. **The Hidden Epistemic Condition of Authority**  
  Authority in Confucianism carries an **implicit moral-epistemic burden**: the superior’s legitimacy depends on their adherence to role-specific virtues. Consequently, the subordinate has a **cognitive duty to discern moral failure**. Silence isn’t obedience—it’s **negligence of the relational space**. If the son *knows* the stolen sheep corrupts the father’s role but says nothing, he fails *as a son*. Roles demand mutual moral vigilance; remonstration is the subordinate’s epistemic responsibility to sustain shared ethical order.

  ### 5. **Objection: "This Smuggles in Modern Autonomy!"**  
  The charge doesn’t stick. Modern autonomy frames resistance as **individual right against hierarchy**. Confucian remonstration is **hierarchy-repairing**:  
  - **Goal:** Not to assert independence, but to *restore* the superior’s virtue and relational harmony.  
  - **Method:** Not public dissent (which humiliates the superior), but private, ritual-respectful correction (*li jian*).  
  - **Foundation:** Flows *from* the role’s obligations, not in spite of them. The son remonstrates *because* he is filial, not to defy filial piety.  

  ### Conclusion  
  In Confucian ethics, remonstration is loyalty’s highest expression—a **relational imperative** generated when superiors betray their role’s moral core. It asserts that true authority is conditional on virtue, and subordinates are co-architects of the moral space they inhabit. This isn’t dissent; it’s **ritual surgery** to excise corruption from the body of the relationship. The sheep story isn’t about hiding truth—it’s about confronting it *within* the bonds that make truth meaningful.
