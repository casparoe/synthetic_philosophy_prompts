  First, I need to recall the key concepts of Confucian Role Ethics. Roles aren't static positions but are dynamic and constituted by mutual obligations. The father-son and ruler-minister relationships are two-way streets. The Analects story they mentioned is in 13.18, where Confucius prefers the son covering for the father over the other village reporting the theft. But Confucius isn't endorsing blind loyalty here. The passage contrasts two approaches: one prioritizes the relationship's sanctity (covering up), the other prioritizes legal correctness (reporting). Confucius sides with the former, but this isn't the whole story. Later Confucians like Mencius argued that covering up is only for minor faults, not major moral violations. So remonstration is necessary for serious issues.

