  Let me unpack their hunch. One group seems focused on whether there were actual causal discontinuities in scientific practices - like fundamental changes in how experiments were validated. The other group cares about whether "Scientific Revolution" is a natural category with clear boundaries, like biological taxonomy. They're absolutely right that these are different epistemological questions masquerading as one debate.

