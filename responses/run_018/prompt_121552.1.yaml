answer: |-
  Your colleagues' debate cuts to the heart of historical ontology's core tension: whether institutional forms reflect necessary evolutionary endpoints or frozen accidents. Let's adjudicate their exchange move-by-move, drawing on concepts from historical institutionalism (Pierson), functionalism (Elster), and science studies (Latour, Shapin):

  ### 1. **Rowan's Initial Contingency Claim**
     - **Thesis:** Current peer review is path-dependent, locked in by 1945-1970 contingencies (state funding spikes, administrative journal choices, network effects).
     - **Assessment:** **Largely Correct.** Rowan identifies verified historical specifics: 
       - The NIH/NSF funding boom *did* incentivize journal proliferation (Baldwin, 2018).
       - Early adopters like *Nature* (1949) and *JAMA* (1950s) implemented blind review for efficiency, not epistemic superiority (Spier, 2002).
       - Network effects *are* measurable: Preprint arXiv usage correlates with journal submission patterns (Larivière, 2014).
     - **Weakness:** Overstates counterfactual viability. Open-review models (e.g., *eLife*) struggle against entrenched incentives (tenure committees valuing high-rejection journals).

  ### 2. **Sam's Convergence Reply**
     - **Thesis:** Functional pressures (expertise scarcity, attention economy, bias) would generate *equivalent* filtering regardless of path.
     - **Assessment:** **Partially Correct but Overextended.** Sam rightly notes:
       - All knowledge systems develop quality-control mechanisms (Zuckerman & Merton, 1971).
       - Open-review platforms like *F1000Research* often add *de facto* anonymity (referees withhold names despite policy).
     - **Weakness:** Commits teleological fallacy. "Functional equivalence" ≠ historical inevitability:
       - Pre-modern science used correspondence networks (Royal Society's letters) with no anonymity.
       - Mathematics maintains low-rejection, non-blind journals without collapse.

  ### 3. **Rowan's Artefactual Objection**
     - **Thesis:** Sam's "functional pressures" (reviewer bias/overload) are system artefacts, not transhistorical constants.
     - **Assessment:** **Powerfully Correct.** Rowan exposes Sam's circularity:
       - Reviewer overload presupposes mass submissions enabled by current funding/journal structures.
       - Bias metrics increase under anonymity (Tomkins et al., 2017), suggesting alternatives might reduce—not replicate—this "pressure."
       - Pre-publication filtering isn't universal: High-energy physics thrives on arXiv with *post*-publication review.

  ### 4. **Sam's Equilibrium Defence**
     - **Thesis:** Self-reinforcement ≠ path dependence; systems can be both stable *and* optimal.
     - **Assessment:** **Misapplies Concepts.** Sam conflates stability with optimality:
       - Path dependence requires *non-ergodicity*: Early events foreclose options (David, 1985). QWERTY keyboards are stable but suboptimal—peer review may be analogous.
       - Calls for reform (e.g., NIH's 2023 preprints push) reveal dissatisfaction, undermining "optimality" claims.
       - **Critical Failure:** Sam ignores *power*. The system benefits editors/reviewers at career stages (Musselin, 2013)—stability may reflect vested interests, not functionality.

  ---

  ### Who Wins Each Round?
  | **Exchange**                | **Advantage** | **Reason**                                                                 |
  |-----------------------------|---------------|----------------------------------------------------------------------------|
  | Rowan's Contingency Claim   | Rowan         | Strong empirical grounding in historical specifics                         |
  | Sam's Convergence Reply     | Split         | Valid abstract functionalism but ignores viable alternatives               |
  | Rowan's Artefactual Objection | Rowan         | Exposes Sam's teleology as question-begging                               |
  | Sam's Equilibrium Defence   | Rowan         | Misrepresents path dependence; ignores power dynamics                     |

  ---

  ### What Both Miss: The Unaddressed Core
  1. **Coevolution of Problems/Solutions:**  
     Peer review didn't just *solve* preexisting problems—it *created* new ones (e.g., publication bias, impact factor gaming). Institutions shape the very needs they address (Giddens' structuration).

  2. **"Maturity" as Teleological Trap:**  
     Sam assumes scientific communities converge toward efficiency, but "maturity" is retrospectively defined. Many fields (e.g., AI) achieve rapid progress with minimal traditional peer review.

  3. **Lock-in Requires Active Maintenance:**  
     Path dependence isn't passive "inertia." Current actors (publishers, universities) *invest* in maintaining the system (e.g., Elsevier lobbying against open-access mandates).

  4. **The Experimental Counterfactual:**  
     Over 200 journals now use open peer review (Ross-Hellauer, 2017). Their struggle against adoption barriers (not functional failure) proves Rowan's point: contingency locked in a suboptimal system.

  ### Conclusion
  Rowan better captures historical reality: peer review's specific form reflects concrete 20th-century accidents, not inevitable evolution. Sam rightly identifies abstract functional pressures but mistakes them for historical laws. Ultimately, **contingency dominates in institutional genesis, while functionalism better explains persistence**—but only when power relations sustaining that persistence are acknowledged. The debate's real stakes lie in whether recognizing this contingency empowers us to redesign systems rather than naturalize them.
