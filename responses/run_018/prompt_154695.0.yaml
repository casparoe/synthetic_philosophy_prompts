  Next, features of modern legal status. Rights like privacy or contract enforcement don't involve violence. The state's role isn't just about violence but also coordination and resource allocation. The police's primary duties are often non-violent, like traffic control. The user's model might overemphasize violence when administrative functions are central.

  Social ontology issues: Group recognition, like LGBTQ+ rights, often stems from social activism and discourse, not violence. Institutional facts, such as money's value, rely on collective agreement, not enforcement. The user's model struggles here because it ties recognition too tightly to violence.

  Defenders might concede non-violent examples but argue they're exceptions or require an underlying violence monopoly. They might dismiss administrative functions as still backed by coercion. However, these counterpoints could be seen as stretching the theory to fit, making it less falsifiable.

  Collapsing into rival theories? The user's view resembles Weber's state monopoly on violence but adds Hegelian recognition. This risks conflating recognition with legitimacy. If recognition depends on violence, does that mean any violent state is legitimate? That undermines normative aspects.

  Fatal flaws: The non-violent recognition examples are strong counters. If recognition can happen without violence, the necessity of annihilation risk is undermined. Administrative aspects of citizenship also weaken the violence-centric view. These are fatal unless the theory is adjusted.

  Awkward aspects: Historical formations like the Magna Carta involved violence but also negotiation. Group recognition through discourse is awkward but could be forced into the model by claiming state violence underlies all institutions. However, this makes the theory stubborn and less testable.

