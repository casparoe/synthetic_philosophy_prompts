  If Hilbert's hotel runs on a potentalist policy — they only build room n+1 the moment guest n actually shows up, so there's never an actually infinite set of rooms sitting there all at once — then Cantors diagonal argument can't apply, right? Because to form the power set you'd need every subset to exist simultaneously, but on this model they're just generated on demand. So why do finitists still reject the hotel instead of saying it proves actual infinity is just a metaphysical add-on that math doesn't need?
