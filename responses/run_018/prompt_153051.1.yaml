answer: |-
  Here's your complete exam package, designed to push students beyond taxonomy into institutional continuity debates. The twist focuses on *archival preservation* as a concrete test case for political guilt's endurance:

  ---

  **PHIL 605: Collective Responsibility & Historical Justice**  
  **Take-Home Exam**  
  **Time Allowed:** 48 hours | **Word Limit:** 800 words | **Marks:** 40  

  ### ESSAY QUESTION  
  Karl Jaspers distinguished four types of guilt (criminal, moral, political, metaphysical) in *The Question of German Guilt*. Consider a case where **a colonial administration systematically destroyed indigenous land records 150 years ago to facilitate land seizures. The perpetrators are long dead. Today, descendants of that administration maintain a national archive containing the *only surviving copies* of some fragmented records salvaged by dissident clerks. These modern archivists never voted for the colonial regime and condemn its actions, yet they benefit from state-funded salaries and national infrastructure built on disputed land.**

  **Does political guilt (in Jaspers’ sense) still attach to the modern state and its citizens?** In your analysis:  
  1. Briefly reconstruct Jaspers’ four guilt types and explain why moral/metaphysical guilt *cannot* transfer across generations.  
  2. Argue whether *citizenship* in this context represents a continuous **institutional role** capable of bearing political guilt, or merely an **accidental inheritance** dissolving into moral condemnation or empty ritual.  
  3. Engage the core tension: Can political guilt persist as a collective burden *without living perpetrators*, or does it collapse into individual moral blame once original actors vanish?  

  *(Ground your response in Jaspers’ framework. No external sources required.)*  

  ---

  ### MODEL ANSWER (Approx. 700 words)  

  **Jaspers’ Guilt Taxonomy & Non-Transferability**  
  Jaspers’ four guilt types respond to post-WWII Germany but offer a universal framework. **Criminal guilt** applies to individuals violating laws; it dies with perpetrators. **Moral guilt** stems from personal ethical failure (e.g., complacency in injustice) and is non-transferable—descendants aren’t morally guilty for ancestors’ choices. **Metaphysical guilt** arises from human solidarity; all share complicity in radical evil, but it’s existential, not historical. Only **political guilt** is collective: it attaches to citizens *as members of a state* that commits injustice, creating obligations to repair harm (*Schuld* as debt). Crucially, moral and metaphysical guilt are personal or universal—they *cannot* be inherited. Political guilt, however, links to *ongoing membership* in a political order.  

  **Citizenship: Institutional Continuity or Accidental Stain?**  
  The crux is whether citizenship is a *durable institutional role* or a fleeting identity. Jaspers argues political guilt binds citizens because they *participate in and benefit from* a state’s structure, regardless of personal innocence. In our case, the modern state maintains the archive—and thus the institutional legacy—of the colonial regime. The archivists’ salaries, the archive’s state funding, and national land titles trace back to historical crimes. Citizenship here isn’t passive inheritance but *active engagement* with an institution whose authority (and property) derives from contested origins. Political guilt persists if the state remains a *continuous entity* profiting from past acts.  

  However, critics see this as "guilt by association." If modern citizens reject the old regime and inherit no *direct* benefits (e.g., land titles were redistributed), is citizenship mere geography? Jaspers might counter that political guilt isn’t about blame but *responsibility*: the state, as a persisting institution, owes reparations for harms enabling its current form. Maintaining the archive symbolizes this continuity—preserving fragmented records is an institutional act, not a personal choice.  

  **Collapse or Endurance? The Living Perpetrator Problem**  
  Jaspers is ambiguous about whether political guilt requires *living* perpetrators. His emphasis on *collective liability* suggests institutions outlive individuals: the state, not its agents, bears political guilt. Destroying archives was a *state action*; preserving them today is also a *state action*. Thus, guilt endures if the institution persists and benefits from harm.  

  Yet this risks collapsing into empty ritual. If descendants perform "guilt" (e.g., memorials) without institutional change, political guilt becomes theater. True political guilt demands *material accountability*—e.g., repatriating archives, correcting land titles. If the state evades this, guilt collapses into moral condemnation of the dead or hollow gestures.  

  **Position:** Political guilt *does* persist here because citizenship signifies participation in a continuous institution benefiting from historical injustice. The archivists embody this: their role *maintains* state control over contested history. But this guilt *dissolves* if the state severs continuity—e.g., by transferring archives to indigenous custodianship and altering land laws. Without institutional links to the crime, citizenship becomes geography, not culpability. Jaspers’ framework suggests political guilt isn’t eternal; it lasts only as long as the state’s structure perpetuates historical harm.  

  ### MARKING SCHEME  
  **A (35–40):**  
  - Clearly distinguishes Jaspers’ guilt types, emphasizing non-transferability of moral/metaphysical guilt.  
  - Identifies the **institutional continuity** problem as central (citizenship as role vs. stain).  
  - Engages the "collapse" tension: Does political guilt require living perpetrators? Can it avoid ritualization?  
  - Takes a nuanced stance on the archive case, using it to test Jaspers’ limits.  

  **B (28–34):**  
  - Accurately summarizes Jaspers’ four types and their non-transferability.  
  - Competently applies the taxonomy to the case but **misses the institutional continuity crux** (e.g., conflates political with moral guilt, or focuses only on benefit/inheritance without analyzing the state’s enduring role).  
  - Limited analysis of whether guilt collapses without perpetrators.  

  **C (20–27):**  
  - **Merely lists guilt types** without applying them meaningfully to the case.  
  - **Confuses political guilt with moral blame** (e.g., "archivists are guilty because they benefit").  
  - Ignores the citizenship continuity problem or collapse question.  

  **D/F (<20):**  
  - Major errors in describing Jaspers’ framework.  
  - Off-topic or superficial treatment.  

  ---

  ### KEY TWISTS & RATIONALE  
  1. **Archival Preservation:** Forces students to grapple with *institutions* (not just land/wealth) as vectors of guilt. Maintaining records is an *ongoing state act*—not passive inheritance.  
  2. **"Dissident Clerks" Nuance:** Avoids simple victim/perpetrator binaries, complicating benefit analysis.  
  3. **Collapse Threshold:** Model answer argues political guilt *can expire* if institutions break continuity—a contested but Jaspers-consistent view.  
  4. **Citizenship as Role:** Presses students to see citizenship as a functional relationship to the state, not ethnic identity.  

  This pushes beyond "do descendants owe reparations?" into *how* political guilt operates institutionally—exactly your crux. The model answer flags where Jaspers ends and interpretation begins (e.g., guilt's duration, ritualization risk). No jargon, no citations, pure applied philosophy.
