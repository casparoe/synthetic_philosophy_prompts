  hey can you explain the conceptual gap between epistemicism and supervaluationism about vagueness? im particularly stuck on what you might call "epistemic leakage" -- if supervaluationism treats borderline cases as semantically unsettled, does that unsettledness bleed backward and undermine our confidence in clear cases? and how do both views avoid either a hidden sharp boundary or an infinite regress when they try to handle higher-order vagueness? just lay out the mechanics, no citations or reading lists needed.
