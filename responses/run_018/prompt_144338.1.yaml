answer: |-
  1.  **Faubus' initial actions embodied "force without justice":** He used the Arkansas National Guard to block Black students, enforcing segregation through state power against federal law and basic rights, making it tyranny.
  2.  **Eisenhower's intervention aimed for "justice with force":** Sending the 101st Airborne enforced the *Brown v. Board* ruling, protecting the students' constitutional right to integrate the school, making federal justice effective.
  3.  **Force was necessary for justice here:** Without federal troops, the violent mob and state defiance rendered the just ruling powerless; force was the only way to overcome unlawful resistance and uphold the law.
  4.  **Pascal's framework misses *who defines justice*:** It ignores the core conflict: Was "justice" defined by the federal courts (equal protection), local white parents/states (tradition/states' rights), or the Black students (access to equal education)? Power decided.
  5.  **The framework also obscures systemic injustice:** It frames the choice as force *for* or *against* justice, but overlooks how the *existing* segregation enforced by local/state power before federal intervention *was itself* "force without justice" – institutionalized tyranny.
