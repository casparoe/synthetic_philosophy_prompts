prompt: |-
  You are a philosopher of science and social epistemologist who has spent a decade advising foundations, aid agencies, and impact investors on how they form justified beliefs about organizations they cannot observe directly. You know the biological and economic literature on costly signaling and the handicap principle in detail: handicaps as deliberately wasteful displays, the requirement that a signal be differentially costly for the types it is supposed to separate, the difference between an index (mechanically tied to the quality, hard to fake) and a conventional signal (arbitrary in form, stabilized only by cost), counter-signaling by the highest-quality individuals who can afford not to perform, the possibility that a signal's cost is transferred rather than burned, and what happens to a signal once the receiver's response begins rewarding it. Think carefully and at length. Before you draft anything procedural, spend a few hundred words working out, for yourself, which of these commitments are load-bearing for a practitioner and which are refinements that must be sacrificed to usability, and flag any step where you think the theory is genuinely contested or silent. Do not retreat into generalities: every gate you propose should be one that a program officer could actually run on a Tuesday afternoon with the files in front of them.

  Here is my situation. I direct a small foundation that makes unrestricted three-year grants averaging about sixty thousand dollars a year to grassroots organizations in countries where we have no staff of our own. We receive roughly two hundred and forty applications a year and fund twelve. Two program officers do the first pass over six to eight weeks; the due-diligence budget for a finalist is about two thousand dollars, which is not enough for a site visit in most cases, though it is enough to pay a local consultant for a day or two. A board of five must ratify every grant; board members are intelligent people with no training in any of this and they will not read more than a one-page memo per finalist. Rejected applicants can request a written explanation, so whatever we do has to be statable in plain language without jargon. A wrong pick costs three years of money and, in the worst cases, real damage to the people the organization was supposed to serve.

  I want a written decision procedure for deciding which parts of an application we are entitled to treat as evidence of organizational quality, which parts we should treat as evidence of something else (and of what), and which parts we should record as non-evidence and ignore. Structure it as an ordered series of gates, each with a question, a statement of what counts as a sufficient answer, and an explicit stopping rule: fatal (stop, do not count this as evidence) versus defeasible (continue, but downweight).

  Some distinctions I want to survive the translation into practice, and I want you to tell me if I have got the priority wrong:

  1. Name the hidden quality, the signaler, and the audience before evaluating any signal, and say what decision the audience's response consists of. A signal is only honest relative to a receiver whose response sustains it.
  2. The currency test. Identify the currency in which the cost is paid: cash, staff hours, reputational exposure, physical or legal risk, opportunity cost of time. Then check whether that currency is identical to the quality being signaled (which makes the evidence circular), independent of it (which makes the signal arbitrary but potentially honest), or anti-correlated with it (which makes the signal actively perverse; I suspect several of ours are).
  3. Net cost, not gross cost. Subtract everything the signaler gets back regardless of type: visibility, a consultant's help, a fiscal sponsor's underwriting, a tax benefit, skills learned in the process, resale value of the asset. Where the cost is borne by someone other than the applicant, a paid grantwriter, a US fiscal sponsor, a better-funded partner, the signal is cost-shifted and I want a specific instruction for detecting that.
  4. Index versus conventional signal, with different audit standards for each: for the index, ask what would have to be true for it to be fabricated and how we would ever find out; for the conventional signal, ask what sustains its cost and what happens when we start rewarding it.
  5. Burned versus transferred cost, and what each one certifies. A requirement that consumes staff hours may certify very little and may consume the very capacity it was meant to certify; a requirement that obliges an applicant to raise money from its own community may be an index of local buy-in rather than of program quality. I want these handled differently.
  6. Audience leak and non-uniform cost. A signal aimed at us may also be read by local competitors, regulators, landlords, or a hostile state apparatus, which can raise its cost enormously for some applicants and not others, in ways that invert the ranking we were hoping for. Requiring public visibility is the case that worries me most.
  7. Counter-signaling at the top. Organizations with established reputational capital and other funders often decline to perform for us. I want a rule for when the absence of a signal is uninformative rather than negative.
  8. Dynamics. What happens to this signal over two or three cycles if we reward it, who can eventually afford it, and at what point does it become a costly obstacle that carries no information? I also want a candid rule about deliberately wasteful requirements, including whether there is any case in which we are permitted to impose one, and who has to sign off if we do.

  Please be explicit about the points where judgment cannot be eliminated and must be handed to a person because the question is one of values rather than fact. I can think of at least three: how much burden we are willing to impose on applicants we will probably not fund, how to weigh false negatives (missing a superb but inarticulate group) against false positives (funding a merely presentable one), and whether to treat a small pilot grant as a gift or as a purchase of information.

  Then apply the whole procedure to four cases.

  First, a fourteen-page narrative with a polished logic model and an M&E framework in flawless English, submitted alongside three years of monthly bank statements and a payroll list reconciled by a named local accountant, from a youth-employment organization in Nairobi.

  Second, an applicant with no website, no annual report, no English-language materials, and only a referral from an intermediary we trust, compared against an applicant with a communications officer and a glossy site.

  Third, a matching requirement: we match, dollar for dollar, the first ten thousand dollars an applicant raises locally.

  Fourth, and this is the one where I expect you to tell me something I do not want to hear: our board's favorite device, the dedication filter, in which shortlisted organizations send a staff member to a regional hub for a full day of interviews at their own expense, roughly four hundred to nine hundred dollars plus two days of time, and considerably more where a visa is involved. The board believes this separates the committed from the opportunistic. Run the procedure on it without softening the result, tell me what it actually screens for, tell me whether reimbursing travel would help or destroy it, and if you think it should be replaced, say what should replace it and what that replacement will cost the applicants.

  Finally, give me a one-page plain-language version suitable for laminating and for a ninety-minute training with board members, and then a short closing section on what this procedure cannot do: the cases it will systematically misfire on, the equilibria it cannot see (including sectors where every local organization has adapted to a different, larger funder's signals), and the questions it cannot answer at all.
reasoning: |-
  Hmm, this is an exceptionally detailed and sophisticated request about applying signaling theory to grantmaking. The user has clearly studied Amotz Zahavi's handicap principle and Spence's signaling model in depth - they're using terms like "index vs conventional signal" and "cost-shifting" with precision. 

  Let me unpack their core dilemma: they run a small foundation making unrestricted grants to grassroots groups in hard-to-observe contexts, with serious constraints (no staff on ground, minimal due diligence budget, board approval hurdles). The tension is between rigorous theory and operational practicality - every gate must be executable by a program officer on a Tuesday afternoon. 

  Key insights from their framing:
  First, they're absolutely right that signals only exist relative to specific receivers and decisions. A "polished report" might signal competence to Western funders but incompetence to local communities if it wastes resources better spent on programs. 

  Second, their "currency test" is brilliant - most foundations never ask whether the cost currency (e.g., staff time) is anti-correlated with the quality they seek (e.g., community focus). Requiring English fluency when most beneficiaries don't speak English is a classic perverse signal.

  Third, the net cost focus is crucial. Many "costly" requirements (like fiscal sponsorship) actually shift costs to intermediaries, making them cheap for applicants but expensive for the system. 

  Where theory gets messy:
  - Counter-signaling: Truly excellent groups may refuse to jump through hoops. How to distinguish arrogance from confidence?
  - Audience leak: A "public commitment" requirement could get activists killed in authoritarian contexts.
  - Dynamics: Rewarding a signal (e.g., matching funds) invites fakery over time. 

  For the four cases:
  The Nairobi youth org's flawless documents likely signal professionalism... or experience gaming donors. The glossy website vs trusted referral case perfectly illustrates index vs conventional signals. The matching requirement seems smart but may exclude groups in cash-poor communities. And oh, that dedication filter - it's textbook class discrimination disguised as commitment-testing. 

  The laminated cheat sheet must crystallize:
  - Always name the hidden quality first
  - Follow the money (who really pays?)
  - Burned costs > transferred costs
  - Watch for invisible audiences
  - Reward absence (counter-signaling)

  What we can't fix:
  - The fundamental power asymmetry
  - Deeply embedded signaling ecosystems (e.g., groups shaped by USAID requirements)
  - The fact that the most vulnerable won't apply at all
answer: |-
  Below is a decision procedure grounded in signaling theory, optimized for operational use. It prioritizes *actionable* distinctions while flagging where theory demands judgment calls. I’ll first clarify load-bearing vs. refinable concepts, then present the gates, apply them to your cases, and conclude with limitations.  

  ---

  ### **Load-Bearing vs. Refinable Commitments**  
  **Load-Bearing (Non-Negotiable):**  
  1. **Signal-Receiver Alignment:** Signals only certify quality if *our response* (funding) rewards them. If we fund polished English reports, we incentivize report-writing, not program quality.  
  2. **Net Cost Calculation:** Ignoring cost-shifting (e.g., fiscal sponsors) or rebates (e.g., skills gained) makes signals meaningless. *This is where most foundations fail.*  
  3. **Currency Independence:** If the signal’s cost currency (e.g., staff time) is anti-correlated with true quality (e.g., field presence), the signal is perverse.  
  4. **Index vs. Conventional Signals:**  
     - **Index (hard evidence):** Audited bank statements. *Check for fabrication risk.*  
     - **Conventional (soft evidence):** Logic models. *Check if cost is sustained by external rewards.*  
  5. **Leakage & Non-Uniform Cost:** A requirement that is safe for urban groups may endanger activists under repression.  

  **Refinable/Sacrificed for Usability:**  
  - **Cost Transfer vs. Burning:** In practice, *net cost* matters more than who burns it.  
  - **Counter-Signaling:** Hard to operationalize without local intel; handled via "trusted referrals" (Gate 3).  
  - **Dynamics:** Monitoring signal decay (e.g., consultants commodifying logic models) is a board-level policy, not per-application.  

  **Contested/Silent Areas:**  
  - **Counter-Signaling:** Theory doesn’t specify when absence signals arrogance vs. confidence.  
  - **Transferred Costs:** If a fiscal sponsor bears cost, does it signal the sponsor’s quality? (Theory: rarely.)  
  - **False Negatives vs. Positives:** No theory solves this; it’s a *values choice* on risk tolerance.  

  ---

  ### **Decision Procedure: 7 Gates**  
  *Execute in order; stop if fatal flaw found.*  

  #### **Gate 0: Define the Target Quality**  
  *Before reviewing signals, state:*  
  - **Hidden Quality:** E.g., "Sustained community trust" or "Programmatic effectiveness."  
  - **Signaler:** The applicant.  
  - **Audience:** Your foundation (not communities, governments, etc.).  
  - **Audience Response:** Funding decision.  
  *Output:* Written memo (1 line). *Fatal if missing.*  

  #### **Gate 1: Currency Test**  
  *Question:* What currency does this signal cost the applicant? (Cash/time/risk/reputation/opportunity).  
  *Sufficient Answer:*  
  - If currency is **identical** to quality (e.g., "fundraising skill" signaled by fundraising), *fatal* (circular).  
  - If **anti-correlated** (e.g., "community focus" vs. staff hours spent on donor reports), *fatal* (perverse).  
  - If **independent** (e.g., cash costs for a non-cash quality), *continue*.  
  *Stopping Rule:* Fatal for circular/perverse signals.  

  #### **Gate 2: Net Cost & Cost-Shifting**  
  *Question:* What is the net cost after subtracting rebates (skills, visibility, fiscal sponsor subsidies) and cost-shifting (paid grantwriters, partners)?  
  *Sufficient Answer:*  
  - If >50% of cost shifted/rebated (e.g., fiscal sponsor writes proposal), *downweight to minimal evidence*.  
  - If cost borne by applicant and not rebated, *treat as evidence*.  
  *Detection Tip:* Ask: "Who drafted Section X? Who paid?" in application.  
  *Stopping Rule:* Downweight (not fatal).  

  #### **Gate 3: Index vs. Conventional Signal**  
  *For each piece of evidence:*  
  - **Index (e.g., bank statements):** *Question:* How easily faked? *Audit:* Demand third-party verification (e.g., accountant’s stamp). If none, *downweight*.  
  - **Conventional (e.g., logic model):** *Question:* Does its cost rely on our funding? If yes (e.g., designed to impress us), *downweight*. If no (e.g., required by local gov), *treat as evidence*.  
  *Stopping Rule:* Fatal if index lacks verification.  

  #### **Gate 4: Leakage & Non-Uniform Cost**  
  *Question:* Could this signal be observed by hostile actors (regulators, militias), making it riskier for some?  
  *Sufficient Answer:*  
  - If yes (e.g., public visibility requirement), *fatal* for high-risk contexts (check trusted local intel).  
  - If no, *continue*.  
  *Tip:* Use local consultant to flag context risks.  

  #### **Gate 5: Counter-Signaling Check**  
  *Question:* Does applicant omit expected signals (e.g., no website) but have trusted referral?  
  *Sufficient Answer:*  
  - If referred by trusted source (e.g., vetted intermediary), *treat absence as neutral*.  
  - Else, *treat absence as weak negative*.  
  *Stopping Rule:* Defeasible.  

  #### **Gate 6: Dynamic Viability**  
  *Question (board-level policy):* If we reward this signal, will it exclude honest but poor groups in 2–3 years?  
  *Sufficient Answer:*  
  - If signal has high commodification risk (e.g., consultants sell logic models), *phase it out*.  
  - If low risk, *permit*.  
  *Stopping Rule:* Not per application; annual review.  

  ---

  ### **Application to Cases**  
  **Case 1: Nairobi Youth Org (Polished Docs)**  
  - **Gate 0:** Quality = "Financial discipline & program coherence."  
  - **Gate 1:** *Currency:* Staff time (independent). *Continue*.  
  - **Gate 2:** *Net Cost:* High (staff time). But if accountant is paid, partially cost-shifted → *downweight*.  
  - **Gate 3:** Bank statements = *Index*. If accountant named/stamped → *evidence*. Logic model = *Conventional*. If used for other donors → *evidence*; if only for us → *downweight*.  
  - **Gate 4:** Low leakage risk (Nairobi). *Continue*.  
  - **Gate 5:** N/A (no counter-signaling).  
  - **Verdict:** Bank statements (if verified) strong evidence; logic model weak evidence.  

  **Case 2: No Website vs. Glossy Site**  
  - **Gate 0:** Quality = "Community embeddedness."  
  - **Gate 1:** *Currency:* Cash/staff time (independent). *Continue*.  
  - **Gate 2:** Website cost = high net cost (glossy) vs. near-zero (no site).  
  - **Gate 3:** Website = *Conventional*. Cost sustained by multiple audiences? If yes (e.g., recruits volunteers) → *evidence*; if only for funders → *downweight*.  
  - **Gate 4:** Glossy site may attract regulator attention in repressive contexts → *consult local intel*.  
  - **Gate 5:** No website + trusted referral → *absence neutral*.  
  - **Verdict:** Glossy site weak evidence; no site + referral not penalized.  

  **Case 3: Matching Requirement**  
  - **Gate 0:** Quality = "Local buy-in."  
  - **Gate 1:** *Currency:* Applicant’s cash (independent). *Continue*.  
  - **Gate 2:** *Net Cost:* $10K minus visibility/skills rebates. If funds raised from wealthy diaspora → *downweight*.  
  - **Gate 3:** *Index* of local support (cash from beneficiaries hard to fake).  
  - **Gate 4:** May leak to competitors → *low risk in most cases*.  
  - **Verdict:** Strong evidence *if* funds raised locally.  

  **Case 4: Dedication Filter (Board’s Travel Requirement)**  
  - **Gate 0:** Quality = "Organizational commitment."  
  - **Gate 1:** *Currency:* Cash + time (anti-correlated with true quality). **Fatal.** Why? High time/cash cost consumes capacity of small, community-rooted groups (the quality you want). Elite NGOs easily afford it.  
  - **Gate 2:** *Net Cost:* $400–$900 + 2 days → devastates small applicants. Visa risk for some.  
  - **Gate 3:** *Conventional signal* easily gamed (send most presentable staff).  
  - **Gate 4:** High leakage: Travel to hubs may expose activists to surveillance.  
  - **What It Screens For:** Wealth, urban access, and desperation (groups who can’t say no).  
  - **Reimbursing Travel:** Destroys the signal (no net cost).  
  - **Replacement:** **Trusted local consultant visit** (costs you $2K, applicant pays $0). Screens for: Consistency between claims and observed operations. Higher validity, zero applicant cost.  

  ---

  ### **One-Page Summary for Board Training**  
  **Core Principle:** We fund qualities, not performances. Ask: "Does this evidence prove *quality* or just *experience with funders*?"  

  **7 Gates Simplified:**  
  1. **Name It:** "What quality are we judging? Who sees this evidence?"  
  2. **Cost Check:** "Does the cost *hurt* the good groups more than the bad?" (If yes, kill the requirement.)  
  3. **Who Paid?** "Did the applicant *really* pay, or did a consultant/funder?" (If shifted, ignore.)  
  4. **Hard vs. Soft Evidence:**  
     - *Hard (e.g., bank docs):* "Is it stamped by a local expert?" (If not, ignore.)  
     - *Soft (e.g., reports):* "Do they need this for locals, or just us?" (If just us, ignore.)  
  5. **Danger Test:** "Could this requirement put people at risk?" (If unsure, ask a local.)  
  6. **Reputation Discount:** "No website? If referred by [Trusted Source], ignore."  
  7. **Future-Proof:** "Will this requirement help scammers in 2 years?" (If yes, drop it.)  

  **Red Flags:**  
  - Requirements costing time hurt community-focused groups.  
  - Documents only in English may signal disconnection.  
  - Travel/interviews favor urban, wealthy applicants.  

  **What We Sacrifice:**  
  - We may miss elite groups who refuse to apply (counter-signaling).  
  - We cannot detect long-term signal decay without local monitoring.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Misfires:**  
     - **Counter-Signalers:** Elite groups with proven local support may skip applications.  
     - **Adapted Ecosystems:** In regions dominated by a major funder (e.g., USAID), all local groups perform identical signals (e.g., logframes). These carry no information.  
     - **Inarticulate Excellence:** Groups with poor documentation but superb impact may fail Gates 3–4.  

  2. **Invisible Equilibria:**  
     - **Signaling Cascades:** If every funder demands logic models, they become cheap to produce → no longer signal quality.  
     - **Cost-Shifting Markets:** In countries with many fiscal sponsors, "polished proposals" become commodified → evidence of sponsor quality, not applicant.  

  3. **Unanswerable Questions:**  
     - **True Impact:** Signals only predict *future performance* if past conditions hold.  
     - **Values Conflicts:** "How much burden on applicants?" or "False positives vs. false negatives?" require board judgments.  
     - **Pilot Grants:** Treating them as "information purchases" risks exploiting grantees. Must be a values call.  

  **Final Note:** The dedication filter is actively harmful. Replace it with local consultant visits—better evidence, zero applicant cost. Your $2K due-diligence budget covers this.
