prompt: |-
  I'm prepping a session for a cog-sci grad reading group — they know brains, zero phil background — on epiphenomenalism and the paradox of phenomenal judgment: if phenomenal feel doesn't cause belief or speech, how do we ever form true judgments about it? Don't explain the concept to me; lay out the teaching plan. Give exactly five numbered items, each one or two sentences, no intro or conclusion. I need the dependency order (what has to be in place before the paradox even bites), the carrying example (I'm using a courtroom 'silent witness' zombie who reports pain flawlessly but has zero inner feel — tell me if that collapses the distinction and what should replace it), the miconceptions they'll hit in order ('qualia do no work' then 'so we can't talk about them') and where in the sequnce to head each off, the check at the end that shows they grasp the paradox rather than parroting it, and the one standard literature move I should openly skip for this crowd.
reasoning: |-
  Okay, the user is preparing a session for a cognitive science graduate reading group. They need a teaching plan focused on epiphenomenalism and the paradox of phenomenal judgment. The group has no philosophy background but understands brains. 

  First, I need to recall what epiphenomenalism entails—it's the view that phenomenal states (qualia) don't have causal effects. The paradox arises because if qualia don't cause anything, how can we form true judgments about them? 

  The user specified exactly five numbered items without intros or conclusions. Each point must be concise, one or two sentences. Key elements include dependency order, the carrying example (they mentioned a courtroom zombie), misconceptions, a comprehension check, and a literature skip.

  Dependency order is crucial. The paradox only makes sense if students first grasp epiphenomenalism's core claim: qualia are causally inert. Without that foundation, the paradox won't land. So step one should establish that clearly.

  For the carrying example, the user proposed a "silent witness" zombie who reports pain without feeling it. But I worry this might confuse epiphenomenalism with philosophical zombies (p-zombies), which imply metaphysical possibility—a tangent they should avoid. A better example could be a conscious person whose pain qualia are causally disconnected while reporting mechanisms function normally. This keeps focus on causal exclusion without invoking p-zombie debates.

  Misconceptions will likely unfold in sequence. First, students might think "qualia do no work" implies we can't talk about them at all. But epiphenomenalism allows talk via parallel neural causes. Step three should preempt this by showing how reports can still occur mechanistically. Then step four tackles the deeper paradox: true judgments require qualia to cause them, creating tension.

  The comprehension check needs to distinguish between misunderstanding and genuine grasp. Asking why false judgments wouldn't solve the paradox forces them to see that the problem is about justification, not just possibility. If they realize even true reports would be accidental under epiphenomenalism, they've got it.

  For literature to skip, conceptual role semantics introduces functionalism about meaning—too complex for this crowd. Better to avoid it and stick to the core paradox.

  The user's needs are clear: a tight, misconception-proof sequence that respects their time and the group's background. No fluff, just the logical progression. Their proposed zombie example needs tweaking to avoid p-zombie confusion, but the courtroom framing is vivid—I'll adapt it by specifying a conscious subject with severed qualia causation. 

  Also worth noting: they're deep in prep (mentions "head off" misconceptions), so precision matters. The response must mirror their no-nonsense style while ensuring philosophical rigor. Steps should build inexorably toward the paradox, with traps defused in real-time. 

  Final structure: 1) Establish epiphenomenalism's causal claim. 2) Reinforce with the adapted courtroom example. 3) Preempt the "can't talk" error by separating causation and correlation. 4) Introduce the judgment paradox explicitly. 5) Verify understanding via accidental truth and skip conceptual role semantics.
answer: |-
  Here is the teaching plan:

  1.  **Establish epiphenomenalism's core claim:** Clearly state that under epiphenomenalism, phenomenal feels (qualia) are causally inert byproducts of physical brain processes, having no downstream effects on any other mental states or behavior. (This is the essential dependency for the paradox.)

  2.  **Illustrate causal exclusion with the adapted courtroom witness:** Present a conscious person experiencing pain, but stipulate that *only* the neural state (N) causes pain reports; the actual pain feel (Q) itself is causally severed. Ask if their reports could still be accurate, highlighting the separation. (Avoids collapsing into p-zombie debates by keeping consciousness present but impotent.)

  3.  **Preempt the "So we can't talk about qualia?" misconception:** Immediately after step 2, clarify that epiphenomenalism *allows* us to talk *about* qualia because the neural correlates (N) cause both Q *and* the reports/judgments; the misconception confuses correlation (N causes both) with causation (Q causing judgment). (Heads off the first, most common misinterpretation.)

  4.  **Introduce the paradox of true phenomenal judgment:** Pose the key question: If Q doesn't cause the judgment "I am experiencing Q," how can that judgment ever be *true* (i.e., directly *about* Q), rather than merely being a reliable indicator caused solely by N? (This crystallizes the core problem.)

  5.  **Check for grasp & skip conceptual role semantics:** Ask: "Why wouldn't the subject just be making *accidentally* true statements?" If they see this maintains the paradox (true judgments require Q to justify/ground them, but Q can't), they grasp it. Explicitly skip discussing conceptual role semantics (e.g., Block) as a potential solution, noting it's too philosophically loaded for this intro.
