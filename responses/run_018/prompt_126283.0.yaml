  Final couplet: Both refrains together, showing they're the frame. Not resolving but holding the space. 

  Note on liberties: Need to clarify where I took creative license. Wittgenstein's riverbed metaphor is about changing certainties over time, but here I use "sands" as shifting doubts, which is a stretch. Rust as doubt isn't in the text—I'm personifying decay. Also, hinges as immune to doubt is emphasized, but Wittgenstein allows for rare cases where they might shift, which I'm ignoring for poetic effect. Stressing their absoluteness leans on contested readings. 

  Ensuring the poem feels real: Avoid academic jargon. Use vivid imagery—hands, earth, rust, mist. Make the doubts tangible but the hinges unshakeable. The repetition should hammer home their necessity. 

  Putting it together: Start with refrains. Build doubts that erode everything else but leave hinges intact. End with both hinges, frame held open. Note explains the stretches clearly without citations. 

