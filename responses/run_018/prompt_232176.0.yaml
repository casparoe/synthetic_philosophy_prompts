  The core tension here is making Black's example work for beginners. The spheres' spatial difference is the biggest stumbling block—students will latch onto that immediately. I need to suggest how to preempt it by rigorously defining "qualitative properties" early, perhaps using relatable examples (like cloned cups) before introducing the spheres. 

  Timing matters too. Breaking the session into strict phases: 10 mins for indiscernibility of identicals (safe ground), 15 mins building the qualitative property definition (the make-or-break part), then 20 mins for Black's universe with guided debate. Must emphasize that the spheres' locations aren't relationally distinct—that's where they'll try to poke holes. 

  For misconceptions: "different locations = discernible" needs smothering upfront by stressing intrinsic relational properties. The "epistemic vs metaphysical" confusion is subtler; I'd tackle it by asking "Could there be two identical spheres even if we couldn't tell?" to shift focus from knowledge to ontology. 

