answer: |-
  Here’s a battle-tested plan for your 50-minute session using Black's spheres, optimized for first-years and designed to preempt misconceptions:

  **Core Goal:** Students grasp the *Identity of Indiscernibles* (IoI) as a substantive metaphysical principle (not self-evident), understand Black's counterexample, and see why its denial is conceivable.

  **Essential Prerequisites & Sequencing (25-30 mins):**

  1.  **Ground Zero: Indiscernibility of Identicals (Leibniz's Law) (10 mins)**
      *   **Start Here:** "If two things are *identical* (literally the *same* thing), then they must share *all* properties. You can't have one thing with contradictory properties." (Use simple examples: "If this cup *is* that cup, then it must have the same color, same chips, same coffee stain.").
      *   **Label Clearly:** "This is the *Indiscernibility of Identicals*. If A = B, then A and B have all the same properties. This is uncontroversial logic."
      *   **Crucial Distinction:** Explicitly contrast with the *Identity of Indiscernibles*: "But what about the *reverse*? If two things have *all* the same properties, must they be identical? Is that also necessarily true? That's our question today: The *Identity of Indiscernibles*."

  2.  **The Heart: Purely Qualitative Properties (15-20 mins)**
      *   **Why?** This is the foundation Black attacks. Without it, IoI seems trivially true.
      *   **Define Rigorously:** "A *purely qualitative property* is a property something has *solely in virtue of what it is like in itself*, not in virtue of its relations to other *specific* things."
      *   **Examples & Non-Examples:**
          *   *Qualitative:* Mass, shape, color, charge, being made of iron, being spherical, being 1 meter in diameter, *being 10cm from **a** sphere* (if there's only one other).
          *   *Non-Qualitative (Haecceitistic):* Being identical to *this specific* sphere (Sphere A), being located *exactly here* (pointing), being 10cm from *Sphere A* (if named).
      *   **Key Insight:** "IoI claims that if two things share *all purely qualitative properties*, they must be identical. It rules out *qualitatively identical duplicates*."
      *   **Preemptive Strike:** Address "different places" *here*: "Notice 'being located *exactly here*' is *not* purely qualitative. It depends on *which specific point* 'here' is. Similarly, 'being 5 feet from *that specific door*' isn't purely qualitative about *me*, it involves the door."

  **Introducing Black's Universe (15 mins):**

  1.  **Describe Vividly:** "Imagine a universe containing *nothing* but two perfect spheres. They are made of the same material (pure iron), have the same mass (1 kg), same diameter (1 meter), same color (matte grey), same temperature... *every* intrinsic property is identical. They are symmetrical in every way. They are also separated by exactly 5 meters."
  2.  **The Question:** "According to the Identity of Indiscernibles, since they share *all* purely qualitative properties, they *must* be identical. But are they? Are there one or two spheres in this universe?"
  3.  **Black's Claim:** "Black says: *No!* This is a possible universe with two distinct, yet *qualitatively indiscernible* objects. Therefore, the Identity of Indiscernibles is *false*."

  **Tackling Misconceptions Head-On (Integrated & Explicit):**

  1.  **"But they are in different places!" (The Big One)**
      *   **When:** Address *immediately* after describing the setup, *before* asking the IoI question. Refer back to the property lesson.
      *   **Response:** "Ah! But what *is* 'different places'? Remember our property types. Do the spheres have *different* purely qualitative *relational* properties? Each sphere has the property '*being 5 meters from **a** sphere*'. That's the *same* qualitative property for both! Neither has the property '*being here*' or '*being 5 meters from **that specific** sphere*' (those involve haecceities). In a purely symmetric universe, the spatial relation is symmetrical and identical for both. 'Different places' only means something if we can *distinguish* the places independently, which we can't here."
      *   **Analogy:** "Think of identical twins in identical rooms facing mirrors. Each has the property 'seeing an identical twin in an identical room'. That's a shared qualitative property. Neither has 'seeing *John*' specifically."

  2.  **"This is just about whether we could *tell* them apart." (Epistemic vs. Metaphysical)**
      *   **When:** Likely arises during discussion or when summarizing Black's point.
      *   **Response:** "Excellent point, but crucial distinction! IoI is a *metaphysical* principle: *Could* two distinct things share all properties? Black argues *yes*, regardless of whether an *observer* could tell them apart. Even if we *couldn't* distinguish them (epistemically), it wouldn't prove they *are* identical (metaphysically). Conversely, even if we *could* somehow magically 'tag' them (give them unique non-qualitative identities), that wouldn't change the fact that they *share all purely qualitative properties* while being distinct. Black is showing a *metaphysical* possibility, not an epistemic limitation."

  **The Perfect Final Question (5 mins):**

  *   **Question:** "Imagine Black is right. Could there be a universe with *three* qualitatively identical spheres, arranged in a perfectly symmetrical equilateral triangle? Why or why *not*? What purely qualitative property could distinguish them?"
  *   **Why it Works:**
      *   Tests understanding of *purely qualitative properties* beyond the simple binary case.
      *   Forces application: Each sphere still has "*being 5m from **a** sphere*" and "*being 5m from **another** sphere*" – the *same* set of qualitative relational properties for all three. They remain indiscernible.
      *   Shows the principle extends beyond two objects.
      *   Reveals if they grasp the core of Black's argument against IoI, not just remember "two spheres".

  **What to Deliberately Leave Out (First-Year Level):**

  1.  **Leibniz's Full Metaphysics (Monads, PSR):** Don't delve into *why* Leibniz believed IoI (e.g., grounded in the Principle of Sufficient Reason). Focus solely on IoI as a standalone principle and its plausibility.
  2.  **Advanced Objections/Responses:** Skip the "empty space" objection (could the points be distinguished relationally to *space itself*?) or sophisticated responses using spacetime or metric relations. Keep it grounded in the intuitive relational properties defined earlier.
  3.  **Haecceitism Debates:** Avoid explicitly naming "haecceitism" or deep dives into transworld identity. Stick to the simpler "non-qualitative / thisness" vs. "purely qualitative" distinction.
  4.  **Quantifier Scope:** Don't get bogged down in formal logic or debates about whether "relational properties require relata" undermines the setup.

  **Key to Success:**

  *   **Relentless Focus on Qualitative Properties:** Drill this concept. Use multiple examples. Constantly ask: "Is *this* property purely qualitative? Why/why not?"
  *   **Preemptive Strikes:** Address "different places" and "telling apart" *before* they derail the discussion. Frame them as insightful observations that highlight the key concepts.
  *   **Active Engagement:** Pose questions constantly during the property section and when describing Black's universe. "If I swap them secretly, could you tell?" "What properties changed?"
  *   **Clarity on Goal:** Emphasize repeatedly that IoI is *not* the uncontroversial logical truth (that's Indiscernibility of Identicals). Black is challenging a substantive metaphysical claim.

  This structure gives them the tools *before* encountering the example, ensures the example bites where it should, tackles misconceptions proactively, and provides a robust assessment of understanding. Good luck!
