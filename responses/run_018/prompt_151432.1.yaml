prompt: |-
  Hey, I need a speech for my advisor's retirment dinner next friday. She spent like thirty years working on hyperbolic discounting and weakness of will, but with this twist: she argued it's not a cognitive bug, it's a rational kind of mortality calibration — you steep-discount the future because you're implicitly weighting outcomes by whether you'll even be there. Half the room are her grad students who lived through this; the other half are family who just think she was obsessed with work and never took vacations. I want about four minutes, and I need the idea to do real structural work — explain why her "no saving for later" attitude actually followed from her own view, without making her sound like she thought life was meaningless or that she was just a workaholic. It needs to comfort and celebrate. There's a joke I remember her making about akrasia being misnamed because your future self is just a different voter, but I don't remember the exact wording so please don't quote her — just paraphrase if you use it. Can you write the toast?
reasoning: |-
  Okay, the user needs a retirement toast for their advisor who specialized in hyperbolic discounting and weakness of will. The key twist is her theory that it's not a cognitive flaw but a rational mortality calibration. The audience is split between grad students familiar with her work and family who saw her as a workaholic. 

  Hmm, the challenge is threading the needle: explaining how her "no saving for later" behavior was consistent with her academic view, without making her sound nihilistic or obsessive. The family's perspective is crucial - they need to see her choices as intentional, not neglectful. 

  That joke about akrasia being "different voters" is gold. Paraphrasing keeps it safe while showing her wit. Should position it as her seeing life as a series of conscious trade-offs, not failures of will. 

  Structure thoughts: Open with warmth (30 years!), then frame her research as revolutionary. Contrast common "impulsivity as flaw" view with her mortality calibration theory. Use the "different voters" metaphor to transition into personal application. 

  Ah - the pivot point: explain her work-life balance through her own lens. Not "didn't value future" but "maximized present value on her terms." Emphasize agency: every paper written, student mentored was her voting for what mattered now. 

  Family concerns need delicate handling. Not "she chose work over you" but "her presence was concentrated like laser focus." Maybe mention how she taught us to find meaning in chosen commitments. 

  Closing should reframe legacy: her impact lives in minds she shaped. The toast crystallizes it - celebrating how she spent her "finite time currency" exactly as her theory predicted: with radical intentionality. 

  Tone check: Must avoid academic jargon for family. "Steep discounting" becomes "valuing today intensely." Comfort through reframing, not excuses. Celebration in her consistency between theory and life. 

  ...Wait, did I capture that her theory wasn't depressing? Crucial to stress: mortality calibration isn't morbid; it's about clarity. Like her saying "know what counts, then count it." 

  Final sweep: 4 minutes means tight phrasing. Cut fluff. Last line about "finite time" echoes her core idea while feeling uplifting. Yes.
answer: |-
  Here’s a 4-minute toast that honors her legacy, bridges both audiences, and reframes her life choices through her groundbreaking theory—with warmth and celebration:

  ---

  **(Raise glass, warm smile)**  
  "Good evening, everyone. For thirty years, Dr. [Advisor's Name] didn’t just study time—she redefined how we understand it. While the rest of psychology saw hyperbolic discounting—that human tendency to value immediate rewards far more than future ones—as a ‘flaw’ in our wiring… she saw wisdom. Radical, clear-eyed wisdom.  

  Her life’s work insisted: **This isn’t a bug in cognition. It’s a feature of existence.** When we steeply discount the future, it’s not weakness—it’s an unconscious acknowledgment of life’s fragile finitude. We weight outcomes by a quiet question: *‘Will I even be there to see it?’* It’s mortality, calibrated.  

  **(Pause, shift tone to personal)**  
  And if you ever wondered why she lived with such fierce presence—why she poured herself into every paper, every student, every *now*—well… she was the living embodiment of her theory.  

  To the family here: you saw a woman who rarely postponed joy. Who didn’t ‘save energy for later.’ Who might’ve skipped vacations not because work was everything… but because *her students’ breakthroughs*, *that midnight eureka moment*, *the debate raging in her office*—these weren’t deferred pleasures. **To her, they *were* the vacation.** The reward wasn’t waiting in some distant future. It was right there, in the work she loved, with the people who mattered.  

  **(Nod to grad students)**  
  And to her students—we know. We lived it. Remember how she’d say that so-called ‘weakness of will’ is a misnomer? **(Gentle paraphrase of her joke)** *‘Your future self isn’t *you* procrastinating—it’s just a different voter with different priorities when time reshapes the stakes.’*  

  Well, she voted. Constantly. Passionately. And she cast every ballot for the present moment. For mentoring *us* now. For writing *that* chapter tonight. For solving *this* problem before coffee went cold. Not because life was fleeting and meaningless… but because it’s fleeting and **profoundly meaningful**. Her urgency wasn’t anxiety—it was reverence.  

  **(Soften, heartfelt)**  
  So tonight, we’re not just celebrating a retirement. We’re honoring a life lived in perfect, unapologetic alignment with a revolutionary idea: that **how we spend our ‘nows’ is how we honor our uncertain ‘thens’.** She didn’t save her brilliance, her curiosity, or her passion for a someday that might not come. She spent it lavishly, immediately—and in doing so, gifted us all with a legacy that *will* endure.  

  **(Raise glass higher)**  
  To Dr. [Name]: the scholar who taught us that discounting the future isn’t irrational… it’s human. And the visionary who showed us that a life poured into the present isn’t missing out… it’s the deepest kind of calibration. May your next chapter be filled with the same joyful immediacy you taught us to embrace. Cheers!"  

  ---

  **Key Structural Work:**  
  - **Bridges Audiences:** Connects "mortality calibration" theory to family’s observation of her "no vacations" by reframing work *as* her chosen reward.  
  - **Reframes "Workaholism":** Positions her focus as active choice ("voting") and presence, not compulsion.  
  - **Makes Theory Personal:** Uses her own lens to explain her behavior without pathologizing it.  
  - **Comfort & Celebration:** Emphasizes *reverence* over nihilism; "profoundly meaningful" counters "life is short, so why care?"  
  - **Akrasia Joke:** Paraphrased as agency ("different voter") to reinforce her view of rational priority-shifting.  
  - **Legacy:** Ends with her impact living on through students/ideas—affirming lasting value beyond her "discounted" future.  

  **Timing:** ~4 mins when delivered with pauses. Adjust "[Advisor's Name]" and add a personal anecdote if desired. Warm, poised delivery will land the nuanced tone.
