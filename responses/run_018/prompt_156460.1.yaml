  For the practitioners, phrases like "lived experience" and "real-world friction" will signal respect. For academics, careful phrasing about "not collapsing citizen/state distinction" while still showing theoretical rigor. The desk job vs. anarchism contrast they mentioned could be a memorable soundbite.

