prompt: |-
  i sit on my museum's public-program board and lately we're getting exhibit-tie-in proposals that lean hard into pseudohistory: Atlantis as an actual engineering culture, ancient aliens editing cuneiform, and this Russian mathematician's idea that ancient Rome and the middle ages are just duplicated records in a fake chronology (Fomenko's new chronology thing). i need a decision procedure my team can actually run on each pitch in about 15 minutes: questions in order, what counts as a sufficent answer to reject, where the call has to go to a real historian because it's values not facts, and be honest about where the checklist misfires. ground it in whatever philosophy of sicence says about demarcation but keep it practical. apply it to two proposals: one claiming Atlantis was a tech hub in the Aegean, and one pushing Fomenko-style duplicated dynasties. include a case where the procedure says reject but a serious amateur historian might still disagree, and flag what the checklist can't settle.
reasoning: |-
  Okay, the user is on a museum's public-program board dealing with exhibit proposals that push pseudohistory like Atlantis as real or Fomenko's chronology theories. They need a practical 15-minute checklist to evaluate these pitches. Let me unpack their request.

  First, the main goal is to create a decision procedure grounded in philosophy of science but practical for quick use. The user mentioned demarcation—Popper's falsifiability and Kuhn's paradigm shifts come to mind. But how to make that actionable? They need clear questions with rejection criteria, and also to identify when it's a values call for historians.

  Looking deeper, the user probably wants to maintain the museum's credibility without stifling creativity. They might fear rejecting something legitimate or letting pseudoscience slip through. There's also the tension between engaging the public and not endorsing false narratives. So the checklist must balance rigor with practicality, acknowledging its limits.

  For the structure, breaking it into phases makes sense: quick triage, core falsifiability, coherence, and sourcing. Each phase needs specific questions. For example, falsifiability asks if the claim can be tested and what evidence would disprove it. Rejection triggers here include unfalsifiable claims or reliance on conspiracy theories.

  Applying to Atlantis: Claim is Atlantis was a tech hub in the Aegean. Falsifiability? They might point to Santorini artifacts. But if they dismiss lack of evidence as "sunk too deep," that's a red flag. Coherence? Mismatch with established Bronze Age tech would be an issue. Sourcing? Reliance on Cayce or Donnelly leads to rejection.

  For Fomenko: His claim is duplicated dynasties. Falsifiability? They might suggest carbon dating, but if they reject it as part of the conspiracy, that's a rejection. Coherence? Ignoces parallel developments in other regions. Sourcing? Only Russian nationalist outlets—reject.

  Edge case: An amateur argues Carthage had transatlantic contact based on controversial inscriptions. The checklist rejects due to lack of peer review and ignoring contrary evidence, but the amateur might point to specific artifacts. Here, the checklist's sourcing criteria (no peer review) triggers rejection, but the unresolved question is the authenticity of those inscriptions, which requires expert evaluation.

  The user also needs to know the checklist's limits: it can't settle disputes within legitimate scholarship or assess educational value. Transparency about these gaps is key. Maybe include a step to escalate to historians when it's about values or unresolved academic debates.

  Finally, ensuring the process is time-efficient. Phases should flow sequentially, with clear rejection points to avoid dragging out. Training the team to recognize common pseudoscience tactics (conspiracies, ignoring counter-evidence) will speed things up.
answer: |-
  Here's a practical 15-minute decision procedure grounded in demarcation philosophy (Popper, Kuhn, Lakatos) and designed for museum program boards:

  **The Pseudohistory Triage Protocol (15-Minute Version)**

  **Phase 1: Quick Triage (2-3 Minutes)**
  1.  **Core Claim:** What is the *single, central historical claim* being proposed? (Require proposer to state it concisely).
  2.  **Plausibility Sniff Test:** Does this claim fundamentally contradict well-established, consilient evidence from multiple disciplines (archaeology, textual criticism, dendrochronology, genetics, astronomy, etc.) without a *massive*, evidence-based reevaluation? *(If YES → Strong Reject Signal; proceed to Phase 2 only if NO or UNCLEAR).*
      *   *Sufficent for Rejection (Phase 1):* Claim requires discarding fundamental, cross-verified knowledge (e.g., "All radiocarbon dating is wrong," "All ancient texts are forgeries," "Known physics doesn't apply").
  3.  **Museum Mission Check:** Is the *primary proposed presentation method* educational critical thinking about *how we know history*, or is it presented as established fact/undiscovered truth? *(If the latter → Strong Reject Signal; proceed only if former and passes Phase 1.2).*

  **Phase 2: Core Falsifiability & Evidence (5-7 Minutes)**
  4.  **Falsifiable Predictions (Popper):** What specific, testable evidence *would disprove* the core claim? What would it look like? (Listen carefully).
      *   *Sufficient for Rejection:* No clear disproof criteria proposed; any counter-evidence is explained away by conspiracy, "lost evidence," or special pleading (e.g., "The elites hid/destroyed it," "It sank too deep," "The dating methods are rigged").
  5.  **Evidentiary Burden:** What is the *strongest, most direct* evidence *for* the claim? (Is it physical artifacts, credible contemporary texts, genetic data? Or speculation, coincidence, "feel," modern reinterpretation, or outlier sources?)
      *   *Sufficient for Rejection:* Primary evidence relies solely on: ambiguous ancient texts (interpreted literally against context), perceived similarities (ignoring differences), non-peer-reviewed sources, anecdote, or requires rejecting mountains of contrary evidence via conspiracy.
  6.  **Contrary Evidence:** How does the proposal *specifically address* the strongest existing evidence *against* the core claim? (e.g., For Atlantis: Thera eruption archaeology vs. Plato's description; For Fomenko: Parallel developments in China/India/Americas, dendrochronology, eclipse records, stratified archaeology).
      *   *Sufficient for Rejection:* Dismisses contrary evidence without engagement, labels it fraudulent/part of conspiracy, or simply ignores it.

  **Phase 3: Coherence & Method (3-4 Minutes)**
  7.  **Internal Consistency:** Are there internal contradictions within the claim itself? Does it create more historical problems than it solves? (e.g., Fomenko compressing timelines creates impossible lifespans/gaps; Atlantis tech hub leaves no trace while contemporary cultures do).
  8.  **Methodology:** What methodology is used to arrive at the claim? Is it replicable? Does it follow standard historical/archaeological methods (source criticism, stratigraphy, peer review) or rely on unique, unrepeatable "insight"?
      *   *Sufficient for Rejection:* Methodology is opaque, based on subjective pattern-matching ignoring context, or explicitly rejects standard scholarly methods as corrupt/limited.

  **Phase 4: Source & Context Check (2 Minutes)**
  9.  **Source Check:** What are the proposer's primary sources? Are they academic historians/archaeologists publishing in peer-reviewed journals, or popular authors/ideologues? Are key sources from discredited figures (e.g., Velikovsky, von Däniken for aliens; Fomenko himself)?
  10. **Conspiracy Dependency:** Does the claim *require* a massive, enduring conspiracy (across disciplines/countries/centuries) to suppress the "truth" for this evidence to be absent or misinterpreted?
      *   *Sufficient for Rejection:* Core claim relies on a vast, undetected conspiracy to explain lack of evidence/massive scholarly rejection.

  **Rejection Triggers:** **Any "Sufficient for Rejection" answer in Phases 1-4.** One solid rejection trigger outweighs other tentative positives.

  **Escalate to Historian (Values/Complex Scholarship):**
  *   If rejection isn't triggered but significant ambiguity remains in Phase 2 (Evidence/Contrary Evidence).
  *   If the claim challenges mainstream views *within the bounds of legitimate scholarly debate* (e.g., revising population estimates, reinterpreting specific motives, debating trade route extent - **not** fundamental chronology/existence).
  *   When assessing the *educational value* of presenting a debunked idea purely to teach critical thinking methods (a values/mission call).

  **Checklist Limitations (Be Honest):**
  *   **Cannot** definitively settle *all* historical disputes (some legitimate debates exist).
  *   **Cannot** assess the charisma/presentation skills of the proposer.
  *   **May** be too blunt for nuanced, emerging (but methodologically sound) scholarship challenging *specific aspects* of mainstream views.
  *   **Relies** on the team having a basic grasp of mainstream historical consensus.
  *   **Struggles** with claims cleverly designed to mimic scholarship but built on sand.

  ---

  **Application to Proposals:**

  1.  **Proposal: "Atlantis: The Aegean Tech Hub" (Santorini/Thera as Atlantis with advanced tech)**
      *   **Phase 1:**
          *   Core Claim: Advanced technological civilization on Thera pre-eruption, basis for Plato's Atlantis.
          *   Plausibility: Contradicts extensive archaeology of Thera/Akrotiri (shows advanced *Bronze Age* culture, not anomalous tech). → **Reject Signal?** (Strong, but proceed as it *might* be framed as reinterpretation).
          *   Mission: Likely presented as "truth." → **Reject Signal?** (Depends on pitch).
      *   **Phase 2:**
          *   Falsifiability: "If no evidence of tech beyond Bronze Age norms is found." BUT likely countered by "It sank/destroyed" (Special Pleading). → **Reject Trigger** if special pleading used.
          *   Evidence: Likely Plato's text (fiction/allegory), perceived scale of Thera ruins (misinterpreted), lack of *some* expected Bronze Age tech elsewhere (cherry-picking). → **Weak/Problematic**.
          *   Contrary Evidence: Akrotiri frescoes, artifacts, architecture show standard (if sophisticated) Bronze Age tech. No anomalous materials/mechanisms. → Proposal likely dismisses ("destroyed") or ignores. → **Reject Trigger**.
      *   **Phase 3/4:** Likely relies on popular authors (e.g., Gavin Menzies-esque), not peer-reviewed archaeology. May imply academic dismissal is cover-up. → **Reject Trigger**.
      *   **Verdict:** **REJECT.** Multiple triggers (Plausibility Sniff, Falsifiability/Special Pleading, Contrary Evidence handling, Sourcing).

  2.  **Proposal: "The Phantom Centuries: Unmasking Duplicated History" (Fomenko's New Chronology Lite)**
      *   **Phase 1:**
          *   Core Claim: Vast periods of ancient/medieval history are fabricated duplications; timelines massively compressed.
          *   Plausibility: Contradicts astronomy (eclipse records), dendrochronology, ice cores, stratified archaeology worldwide, genetics, parallel developments in isolated regions. Requires discarding fundamental dating methods. → **MAJOR Reject Trigger**.
          *   Mission: Almost certainly presented as "uncovered truth."
      *   **Phase 2:**
          *   Falsifiability: "If carbon dating/dendro/astronomy independently confirm standard chronology." → Fomenkoites *reject* these methods *a priori* as flawed/part of conspiracy. → **Reject Trigger** (Immunization against falsification).
          *   Evidence: Perceived textual parallels, dynastic similarities, statistical claims about documents (often debunked). Ignores physical evidence. → **Weak/Pseudoscientific**.
          *   Contrary Evidence: See Phase 1. Proposal *must* dismiss all as error/fraud. → **Reject Trigger** (Conspiracy Dependency).
      *   **Phase 3/4:** Entirely based on Fomenko/associates (discredited mathematician, not historian). Core methodology (statistical textual analysis ignoring context/material evidence) rejected by scholarship. Requires massive conspiracy. → **Multiple Reject Triggers**.
      *   **Verdict:** **STRONG REJECT.** Hits nearly every rejection trigger decisively.

  ---

  **Edge Case: "Carthaginian Transatlantic Contact (c. 200 BC)" - Proposed by Serious Amateur**

  *   **Claim:** Carthaginian coins/artifacts in the Americas prove pre-Columbian contact.
  *   **Checklist Application:**
      *   **Phase 1:** Plausibility? Contradicts current consensus (no *conclusive* evidence), but not *fundamentally* impossible like discarding physics. → Proceed.
      *   **Phase 2:**
          *   Falsifiability: Clear - rigorous archaeological context showing the artifacts are modern intrusions or hoaxes. Good sign.
          *   Evidence: Points to specific, documented artifacts (e.g., controversial Brazilian inscription, debated coins). Stronger than Atlantis/Fomenko. BUT Are these artifacts widely accepted by experts? Likely no.
          *   Contrary Evidence: Absence of Carthaginian DNA, crops, diseases, technologies, or shipwrecks in the Americas; lack of mention in Carthaginian/Roman sources. How addressed? Amateur might argue "limited contact," "evidence not found yet," "suppressed." **Problem: Dismisses weight of absence via "not found/suppressed" (mild special pleading).**
      *   **Phase 3/4:** Sources likely include outlier archaeologists/amateur researchers, not mainstream consensus. Methodology might be sound (analysis of artifacts) but interpretation contested. No *inherent* conspiracy needed, just error or misinterpretation.
  *   **Checklist Verdict:** **REJECT** (due to Phase 2:Contrary Evidence handling leaning on special pleading + Phase 4:Sourcing from non-mainstream/outlier experts without wider acceptance). Relies on interpreting ambiguous evidence against a consensus built on absence.
  *   **Why a Serious Amateur Might Disagree:** They focus intensely on the *specific artifacts* they believe are genuine and rigorously analyzed. They argue the checklist undervalues their direct evidence analysis and overemphasizes the *argument from absence* (which, while strong, isn't absolute disproof for very limited contact). They see mainstream dismissal as inertia, not conspiracy.
  *   **What the Checklist Can't Settle:** The **authenticity and interpretation of the specific disputed artifacts.** This requires deep, object-specific expertise (archaeometallurgy, epigraphy, sediment analysis) beyond the checklist's scope. The checklist flags the proposal as lacking scholarly consensus and relying on contested evidence interpretation, justifying museum caution, but it doesn't *definitively prove* the amateur is *wrong* about those specific objects. This is where escalation to a specialist historian/archaeologist *for evaluation of those specific claims* would be wise, even if the overall proposal is rejected for programming.

  **This protocol empowers your board to efficiently filter out pseudoscience while providing clear justifications and identifying when deeper expert review is truly needed for nuanced cases.** Remember, its strength is in catching the hallmarks of pseudohistory (unfalsifiability, conspiracy, dismissal of evidence, rejection of methods) quickly.
