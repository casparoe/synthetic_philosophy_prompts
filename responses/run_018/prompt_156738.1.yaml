  my prof keeps throwing around Ranke's line about showing things how they actually were in seminar to mean history should be totally objective, and I'm tierd of it. can you seperate out the precise claims that one-liner could actually be making -- like the boring version vs the strong epistemic access version vs something about narrative structure being transparent -- and for each say whether Carr's point that facts dont speak for themselves actually refutes it, and where Hayden White's idea that every history uses hidden literary tropes fits in? I also want you to consider this weird case I cooked up: a historian who only uses verified primary docs but organizes them with a narrative pattern that hasn't been named in any historiography text, maybe a kind of cyclical irony that isn't one of the tropes White catalogued. does that violate Ranke's principle or not?

