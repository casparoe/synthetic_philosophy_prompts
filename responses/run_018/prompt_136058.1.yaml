prompt: |-
  I have recently been appointed to the governance board of a small cooperative housing association—fewer than thirty members—where we are deadlocked over a renovation contract that has attracted competitive internal bidding. What distinguishes our situation from an ordinary auction is that no individual acquires private ownership of the result; the contested “prize” is collective prestige and aesthetic control over shared spaces, yet members continue to escalate commitments of unpaid labor and social capital despite clearly negative individual returns. Exit is only partial, because withdrawing labor damages one’s standing within the group rather than freeing one from further obligation, and the sunk costs are reputational rather than monetary. I have been studying the dollar auction model of escalation of commitment, but standard treatments assume a private, excludable reward and a clean exit option. Please describe the most important implications of the dollar auction and escalation of commitment for understanding deadlocks in small cooperative institutions where the resource is collective reputation, members face asymmetric partial-exit costs, and sunk contributions take the form of social labor rather than cash.

  Please organize your response in American English into the following sections, with approximate lengths indicated: (1) “Conceptual framing” (one paragraph), clarifying how the dollar auction mechanism maps onto reputation contests with partial exit and non-rival prizes; (2) “Core implications” (two to three paragraphs), identifying the dynamics of rational escalation, observable commitment, and conditions for de-escalation specifically in this cooperative context; (3) “Boundary conditions” (one paragraph), noting where the analogy weakens because labor is non-fungible or the prize is non-excludable; (4) “Application to the cooperative case” (one paragraph), offering a direct verdict on whether our deadlock is best explained by pure escalation logic or by a modified mechanism, and what that implies for breaking the cycle; and (5) “Bottom line” (two to three sentences), summarizing the single most actionable insight for a board member who wishes to restore cooperation without destroying group cohesion. Please do not provide bibliographies, citations, or reading lists; I need analysis built only from reasoning and widely available conceptual knowledge.
reasoning: |-
  Okay, I need to tackle this user's query about a deadlock in their small housing cooperative. They're stuck in a renovation bidding war where members are escalating commitments of unpaid labor and social capital for collective prestige, not private gain. The user has studied dollar auctions but notes key differences: the prize is non-rivalrous (aesthetic control), exit is partial with reputational costs, and sunk costs are social, not monetary. 

  First, I'll mentally map the dollar auction mechanics to their situation. In a classic dollar auction, bidders escalate bids for a monetary prize, often exceeding its value due to sunk costs and rivalry. Here, the "bidding" is social labor, the "prize" is collective reputation, and exit isn't clean—withdrawing damages standing. The non-rivalrous aspect is crucial: unlike money, prestige isn't diminished when shared, yet they're still competing fiercely. That paradox needs unpacking.

  For the "Core implications" section, I'll focus on three layers: why rational escalation happens (loss aversion, observable effort as credibility signals), how it manifests in cooperatives (asymmetric exit costs trap lower-status members), and de-escalation triggers (fatigue, third-party intervention). The user mentioned asymmetric partial-exit costs—those with more social capital may escalate longer because they have more to lose, which intensifies the trap. 

  When addressing "Boundary conditions," I'll highlight where the analogy strains. Labor isn't fungible like cash—an hour of plumbing vs. design work carries different weight. And since the prize is non-excludable, "winning" doesn't grant sole control, yet they're acting as if it does. That cognitive dissonance might be fueling irrational bids. 

  For "Application to the cooperative case," I'll argue this is a modified escalation mechanism. The social stakes amplify irrationality because reputation is hard to quantify. To break the cycle, they likely need external mediation plus reframing the project as collaborative. 

  The "Bottom line" must offer a concrete takeaway. I'll emphasize that declaring sunk costs unrecoverable and depersonalizing the conflict could reset norms. Since the user is a board member, I'll keep it practical: no jargon, just actionable insight about redirecting focus to shared goals. 

  Throughout, I'll maintain American English and avoid citations per their request. The tone should stay analytical but empathetic—they're clearly frustrated and need solutions, not theory.
answer: |-
  ### Conceptual framing (one paragraph)  
  The dollar auction model—where rational players escalate bids beyond an item's value to avoid sunk losses—maps onto your cooperative's deadlock through three key adaptations: First, the "prize" transforms from private monetary gain to collective aesthetic control, making it non-rivalrous (multiple members benefit simultaneously) but psychologically contested due to prestige-seeking. Second, "bids" manifest as irreversible contributions of social labor and reputation, not cash, creating subjective sunk costs tied to group standing. Third, the exit option is partial; withdrawing doesn’t remove obligations but imposes reputational penalties, trapping members in a cycle where continued commitment feels less damaging than conceding. This reframes escalation as a battle over relative status within a closed social system, where perceived losses of influence motivate irrational overinvestment.

  ### Core implications (two to three paragraphs)  
  **Rational escalation dynamics intensify** in this setting due to visibility and social enforcement. Members rationally (but myopically) escalate labor commitments because conceding would publicly validate rivals’ social standing while rendering their own sunk contributions worthless. Unlike monetary auctions, bids here are observable acts of sacrifice (e.g., unpaid design work, lobbying efforts), which signal dedication and amplify perceived "ownership" of the project. This visibility fuels reactive escalation: each member’s increased effort raises the reputational stakes for others, as losing now implies not just wasted labor but public humiliation and eroded future influence.  

  **Asymmetric partial-exit costs create coercive inertia.** Members with higher social capital (e.g., founding members, vocal leaders) face greater reputational penalties if they withdraw, incentivizing them to escalate further to protect their status. Conversely, lower-status members may feel compelled to persist despite smaller losses because disengaging risks permanent marginalization. Critically, since labor is non-transferable and the "prize" is collective, there is no rational endpoint—the process becomes a self-sustaining conflict where avoiding defeat outweighs achieving gains.  

  **De-escalation requires disrupting the loss-aversion feedback loop.** In cooperatives, traditional auction solutions (e.g., binding bids, walk-away penalties) fail because costs are social. Resolution hinges on reframing sunk costs as *shared* investments rather than individual losses, decoupling prestige from control, and introducing impartial arbitration. The cycle breaks only when members collectively recognize that continued escalation harms *all* reputations or when fatigue outweighs the fear of concession. External mediators can accelerate this by refocusing the group on shared losses (eroding trust, delayed renovations) rather than relative wins.

  ### Boundary conditions (one paragraph)  
  The dollar auction analogy weakens in two key areas. First, **labor is non-fungible**: Unlike interchangeable cash bids, an hour of carpentry versus administrative work carries unequal value and visibility, distorting perceptions of "fair" contribution and complicating cost-benefit analysis. Second, the **non-excludable prize** fundamentally alters incentives: In a classic auction, the winner takes all, but here "losing" bidders still benefit from the renovated space. This should theoretically discourage escalation, yet it persists because the *process* becomes a rivalrous status game—control over aesthetic decisions symbolizes dominance within the group, making the intangible stakes feel excludable. Labor contributions thus serve as proxy bids for influence, not utility.

  ### Application to the cooperative case (one paragraph)  
  Your deadlock is **primarily driven by a modified escalation mechanism** where social reputation substitutes for money, but with amplified irrationality due to the prize’s non-rivalrous nature. The paradox—escalating despite shared gains—arises because members perceive exclusive *credit* for collective outcomes as the true prize. Breaking the cycle requires treating sunk social labor as irrecoverable (like burned cash) and shifting focus to future costs. As a board, enforce three steps: (1) Declare all past contributions "sunk" and off-limits for moral claims, (2) Appoint a neutral subcommittee to finalize the contract using objective criteria (e.g., cost, timeline), and (3) Rebrand the project as a collaboration where all contributors receive public acknowledgment, decoupling labor from control. This disrupts the prestige-auction dynamic by removing the link between escalation and decision rights.

  ### Bottom line (two to three sentences)  
  The critical insight is that **escalation persists because members conflate labor investments with moral authority over the project.** As a board member, your most actionable step is to formally depersonalize the decision: Separate recognition for past work from control over future choices. Publicly honor all contributions while transferring aesthetic decisions to a blinded evaluation process or external expert. This preserves individual standing while halting the destructive logic that "more sacrifice equals more say."
