  hey so i need your help, me and my best friend had this massive argument last night over drinks and i can't shake it. here's what happened: my roommate cooked this awful stew and asked me straight up if it was good, and i said "yeah it's really interesting" which was obviosly a lie but he seemed happy. my friend (who lived in amsterdam for years) lost it and said i was being disrespectful and that in dutch culture you just say "this needs salt" and that's the kind thing to do. then i mentioned my japanese coworker always talks around problems instead of saying no directly, and she thinks that's the respectful way. my friend said culture is just describing what people do, not what they should do, and that white lies are always wrong because they treat people like they can't handle truth. we went back and forth for like three hours and neither of us budged.

  can you think through this with me? i want to know if there's actually a philosophical answer to whether being direct is morally better, or if politeness can ever be a real reason to not tell the full truth. please act like you're a professional moral philosopher who also knows some anthropology, and start by brainstorming the main distinctions — like, is this about what honesty means, or about whether harm matters more than truth? also please be really carefull to seperate what's settled from what's genuinely contested among people who actually study this stuff, and don't present one side like it's the obvious consensus when it's not. oh and think step by step before giving your take.

  i'd especially like you to consider whether my friend's point about culture just describing behavior is right, or if the way a community practices directness can actually shape what's moral there. but don't just give me generic advice — dig into the actual philosophical structure of the situation.
