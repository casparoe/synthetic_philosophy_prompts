prompt: |-
  I sit on the panel for a small regional arts grant, and our eligibility rules permit us to fund "works of art" but not "decorative, functional, documentary, or promotional objects." That distinction turns out to do all of the work and none of the explaining, and since the panel has to publish a short statement of what it counts, I am trying to work out what I actually think rather than just splitting the difference case by case. I have read a bit about the usual families of answer — resemblance to acknowledged artworks, conferral by an artworld, some historical or narrative relation to earlier art, the maker's intentions, the invitation to a certain kind of attention — but I cannot tell which combination of them my own verdicts commit me to. So let me just report the verdicts I find I have, and ask what principle, if any, they add up to. Four hundred identical factory-glazed mugs bought from a surplus supplier and stacked in a grid on a gallery floor under a wall label: art, though dull and derivative. A set of transit wayfinding signs commissioned by a city and designed with real elegance by someone who never thinks of herself as an artist: not art, just very good design. A six-year-old's crayon drawing of her family: art, and bad art, but art. A painting made by a zoo chimpanzee and auctioned for charity: not art — and I know that verdict sits badly with the last one, since neither maker has any art-historical intentions, and I cannot point to the difference except that one of them is a child and one is not. A technically flawless forgery of a lost painting, made to deceive and sold under the original painter's name: a work of art and a fraud, with the one not cancelling the other — its defect is not a defect in it as art. A man who sits silently in a shopfront for eight hours, livestreamed, to raise money for a children's hospital, and who says plainly that this is a fundraiser and not art: not art; the same eight hours of sitting, staged in a gallery under a title, would be art. A found piece of driftwood that an artist puts on a plinth in a museum: art. The same kind of driftwood on a hiker's mantelpiece, untitled and unshown: not art. And here is the one I keep going back and forth on: that hiker's driftwood, found in her house after she died and installed by a curator with a wall text she never wrote and would probably have found silly — I have no stable verdict.

  What I would like from you is this. Give me a candidate principle, or a small set of them, stated precisely enough that I could put it in the panel's statement, and tell me which of my cases motivates each clause. Then tell me what the principle says about cases I have not put on this list — I am thinking of things like the readymade that every account of this has to handle, a cathedral, a composer's transcription of a bird's song, and an image produced by a text-to-image system after two hundred hours of someone writing and refining prompts — and be honest about which of my verdicts your principle cannot accommodate and would have me overturn. If the honest answer is that no single principle gets all of them and that I have to choose between a more complex account that saves every verdict and a simpler one that gives up one or two, say which verdicts are the cheapest to lose and why. I would rather give up a verdict than publish a sentence that merely relocates the problem into a word like "artistic."
reasoning: |-
  Okay, the user is on a panel for a regional arts grant and needs a clear principle to distinguish "works of art" from excluded categories like decorative or functional objects. They provided several examples where their intuitive verdicts conflict, especially the child's drawing vs. the chimp's painting, and the contested driftwood cases. 

  Hmm. Their frustration with theoretical vagueness is palpable—they don't want to just rebrand ambiguity with words like "artistic." The examples reveal tensions between intentionality, context, and human/non-human creation. The unresolved driftwood case after the hiker's death is particularly telling; it’s a gray zone where institutional framing clashes with personal meaning. 

  The chimpanzee example is a key pain point. They feel unease labeling a child’s drawing as art but not the chimp’s, despite neither having art-historical intent. This suggests their intuition hinges on latent human capacity, not just output. The livestream fundraiser vs. gallery performance contrast also screams "context matters," but they need that codified without relying on "because gallery." 

  For a grant panel, practicality is crucial. Any principle must be defensible to applicants and avoid endless philosophical debates. The institutional theory (artworld conferral) handles many cases cleanly—like the factory mugs in a gallery vs. the transit signs—but stumbles on the child’s drawing. Meanwhile, aesthetic theories struggle with readymades. 

  ...Wait. Maybe hybridizing intent and framing? "Artifacts primarily created or framed to invite aesthetic engagement" could work. "Primarily" excludes the fundraiser (explicitly non-art), includes the child (drawing inherently engages aesthetics), and excludes the chimp (no framing or intent). The posthumous driftwood then hinges on curator action—framing it as art, so included. 

  But would the panel accept "framed"? They might worry about circularity. Alternatively, emphasizing "human expressive practice" saves the child/chimp distinction but feels exclusionary. Still, for grant eligibility, centering human agency seems reasonable. The chimp’s painting, while meaningful, isn’t part of human art discourse. 

  The forger case is sneaky—it’s art despite fraudulent intent because it functions aesthetically within the artworld. Their verdict holds. Text-to-image prompts? If the prompter is engaging expressively, it’s art; if generating stock images, not. Cathedrals are art if viewed beyond utility; bird song transcriptions depend on the composer’s framing. 

  Sacrifices: The chimpanzee verdict must stand as non-art to preserve coherence. Losing it is "cheap" because grant panels rarely face primate submissions, and upholding human cultural practice aligns with most institutions’ scope. The hiker’s driftwood, if unmodified and unframed, stays excluded—consistent with rejecting "mere decoration." 

  Final principle draft: "Works arising from human expressive practice, presented to invite aesthetic interpretation." Short enough for guidelines, covers most cases, and admits the posthumous driftwood via curator framing. The unresolved tension? It implies art status can be conferred post-creation, which might unsettle some—but that’s where their own verdicts point.
answer: |-
  Based on your verdicts and the need for a clear, actionable principle for a grant panel, I propose this hybrid principle focused on **framed human expressive practice**:

  **"A work is eligible as art if it is an artifact or action primarily created or framed by human agency to invite aesthetic contemplation or interpretation, existing beyond solely practical, documentary, or decorative purposes."**

  This principle combines **intention/framing**, **human agency**, and **aesthetic invitation** to capture your judgments. Here's how it breaks down your cases and motivates each clause:

  1.  **"primarily created or framed by human agency"**
      *   *Motivated by:* The child's drawing (art) vs. the chimp's painting (not art). The child's act is a fundamental human expressive practice, even without "art-historical" intent. The chimp's action lacks this human agency.
      *   *Motivated by:* The factory mugs (art). Human agency is present in the *selection* and *framing* (stacking in a grid, gallery label), transforming the objects.
      *   *Motivated by:* The fundraiser sitting (not art). The man explicitly frames it as *not* art (a fundraiser). If staged identically in a gallery *as art*, human framing makes it art.
      *   *Motivated by:* The transit signs (not art). Created for purely functional wayfinding, not framed as art by creator or commissioner.

  2.  **"to invite aesthetic contemplation or interpretation"**
      *   *Motivated by:* The forgery (art). Its defect is fraud, not a failure as art; it successfully functions *as art* to invite aesthetic engagement (even if under false pretenses).
      *   *Motivated by:* The found driftwood in a museum (art). The artist's act of selection and placement (framing) on a plinth explicitly invites aesthetic interpretation. On the mantelpiece (not art), it functions decoratively/personally, not as an object for contemplation.
      *   *Motivated by:* The factory mugs (art). The framing (gallery, grid, label) invites the viewer to consider form, repetition, industrial production, etc. – aesthetic interpretation.
      *   *Motivated by:* The child's drawing (art). While "bad," it inherently arises from an act inviting interpretation (of family, emotion, representation).

  3.  **"existing beyond solely practical, documentary, or decorative purposes"**
      *   *Motivated by:* Explicitly excludes the categories your rules forbid (decorative, functional, documentary, promotional). Covers the transit signs (functional), the fundraiser (practical), the mantelpiece driftwood (decorative).

  **Your Unresolved Case & New Cases:**
  *   **The Hiker's Driftwood, Posthumously Installed:** **Art.** The curator's action (selection, installation in an institutional context, wall text) constitutes "framing by human agency to invite aesthetic contemplation," even if against the original owner's wishes. It exists beyond its original decorative purpose.
  *   **Duchamp's Fountain (Readymade):** **Art.** Urinal framed by human agency (selection, signing "R. Mutt", submission to art exhibition) specifically to challenge conventions and invite aesthetic/philosophical interpretation.
  *   **Chartres Cathedral:** **Art.** Primarily created (human agency) with immense intention for spiritual awe *and* aesthetic grandeur, inviting profound aesthetic contemplation. Its functional purpose (place of worship) doesn't negate its overwhelming artistic dimension. (This leans on "primarily" - its artistic ambition transcends utility).
  *   **Composer's Transcription of a Bird's Song:** **Art.** Human agency (selection, transcription, arrangement) frames the natural sound within a musical composition, inviting aesthetic contemplation of the sound, the act of transcription, or nature itself. It moves beyond mere documentation.
  *   **AI Image from Refined Prompts:** **Art.** The prompter's 200 hours of refinement constitutes significant human agency in *framing* and *directing* the output. The intent is to create an image for aesthetic contemplation/interpretation. The AI is the tool; the human artistic act lies in the conceptualization, iterative prompting, and selection.

  **Sacrifices and Inconsistencies:**

  1.  **The Chimpanzee Painting:** Your principle **excludes** it, matching your verdict. The sacrifice is consistency with the *child's drawing*. The justification is a hard line on **human agency** being fundamental to art *as a cultural category* relevant for grants. Losing this verdict is "cheapest" because non-human art is exceptionally rare in grant applications and falls outside the intended scope of funding human cultural production. Upholding the child's art recognizes foundational human expressive behavior.
  2.  **The Mantelpiece Driftwood:** Your principle **excludes** it, matching your verdict. The sacrifice is potential inconsistency with the *posthumously installed* piece. The justification is the lack of **framing to invite aesthetic contemplation** by the owner. Its status is decorative/personal. This distinction is crucial for excluding purely decorative objects in private contexts.

  **Strengths of the Principle:**
  *   **Precise & Actionable:** Avoids vague terms like "artistic." Focuses on demonstrable factors: human action, framing/presentation, and the intended primary mode of engagement (aesthetic vs. practical/decorative).
  *   **Captures Context:** Acknowledges that context (gallery, label, institutional framing) *can* confer art status (driftwood, sitting performance, mugs).
  *   **Handles Intent & Framing:** Covers both creator intent (child, composer) and later framing (curator, artist selecting readymade).
  *   **Excludes the Forbidden:** Clearly distinguishes from functional (signs), decorative (mantel driftwood), documentary (if solely that), or promotional objects.
  *   **Accommodates New Media:** Addresses AI art by focusing on the human creative act (prompting/framing).

  **Weaknesses/Compromises:**
  *   **Human-Centric:** Deliberately excludes non-human creation. This is a philosophical stance embedded in the principle based on your verdicts and the grant's likely purpose.
  *   **"Primarily" is Key but Subjective:** Distinguishing "primary" purpose (e.g., Cathedral's utility vs. art) requires judgment, but this is inherent in any art definition. The panel must assess the dominant intent/effect.
  *   **"Aesthetic Contemplation/Interpretation" is Broad:** While better than "artistic," it still requires panel discernment. However, it points towards the *kind of engagement* sought/offered.

  **Recommendation:** Publish the principle. It provides a clear, defensible framework grounded in your judgments. It requires the panel to critically assess:
  1.  Is significant **human agency** involved in creation *or* framing?
  2.  Was it **primarily created/framed to invite aesthetic contemplation/interpretation?**
  3.  Does it exist **beyond solely** practical/decorative/documentary/promotional purposes?

  This explicitly excludes the chimp and private driftwood, includes the posthumous driftwood and AI image, and provides a reasoned basis for tackling the vast majority of grant applications you'll encounter. It accepts that the child/chimp distinction rests on a definitional boundary of human culture.
