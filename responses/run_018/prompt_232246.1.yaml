  Below is a distributive ethics sorting quiz designed as a decision tree. It uses concrete allocation choices to reveal underlying ethical commitments, avoiding labels until the final step. The tree is built from the logical space of possible answers, with named positions mapped to specific answer combinations. Empty regions are noted, and key questions address the separation of telic/relational egalitarianism and prioritarianism/utilitarianism. The quiz uses British English and includes all required cases.

  ---

  ### **Distributive Ethics Sorting Quiz**
  **Instructions:** Answer each question based on your *all-things-considered* judgment of which policy or allocation is morally better. Choose one option per question. Your answers will reveal your ethical position.

  ---

  #### **Question 1: Leveling-Down**  
  *Policy Context:*  
  - **Allocation A:** 100 people at well-being 8, 100 people at well-being 4 (unequal).  
  - **Allocation B:** 200 people at well-being 4 (equal, but achieved by reducing the well-off group's welfare with no gain to others).  

  *Assuming no changes to social relations (e.g., no reduced resentment or increased solidarity):*  
  > Which allocation is better?  
  > - **(A) Allocation A** (preserve higher well-being for some).  
  > - **(B) Allocation B** (achieve equality even with losses).  

  *If you choose (B), proceed to Question 1a. Otherwise, go to Question 2.*

  ---

  #### **Question 1a: Non-Distributive Egalitarianism**  
  *Policy Context:*  
  Two societies have the *same well-being distribution* (e.g., 100 at 8, 100 at 4):  
  - **Society X:** Inequality stems from luck; no oppression or disrespect.  
  - **Society Y:** Inequality enables domination (e.g., the better-off control opportunities for the worse-off).  

  > Is Society X better in any respect?  
  > - **(X) Yes** (due to fairer social relations).  
  > - **(Y) No** (only well-being levels matter).  

  ---

  #### **Question 2: Pure Transfer**  
  *Policy Context:*  
  - **Allocation C:** 100 people at well-being 10, 100 people at well-being 5 (total well-being = 1,500).  
  - **Allocation D:** Transfer resources to narrow the gap: 100 at well-being 9, 100 at well-being 6 (total well-being = 1,500; both groups above a "sufficiency threshold" of 4).  

  *No effects on social relations (e.g., no reduced envy or increased cooperation):*  
  > Which allocation is better?  
  > - **(C) Allocation C** (wider gap).  
  > - **(D) Allocation D** (narrower gap).  
  > - **(E) Equal** (no moral difference).  

  *If you choose (C), go to Question 2a. If (D), go to Question 3. If (E), go to Question 4.*

  ---

  #### **Question 2a: Inequality Preference**  
  *Policy Context:*  
  - **Allocation E:** 100 people at well-being 10, 100 at well-being 5.  
  - **Allocation F:** 100 at well-being 6, 100 at well-being 6.  

  > Which allocation is better?  
  > - **(E) Allocation E** (prefer inequality even without efficiency gains).  
  > - **(F) Allocation F** (equality is better).  

  *(Note: Choosing (E) leads to an empty region. Most proceed to Question 3.)*  

  ---

  #### **Question 3: Large vs. Tiny Benefits**  
  *Policy Context:*  
  - **Policy X:** Give a **large benefit** (well-being +2) to 1,000 moderately well-off people (from 10 to 12).  
  - **Policy Y:** Give a **tiny benefit** (well-being +0.1) to 1 worst-off person (from 2 to 2.1).  

  > Which policy is better?  
  > - **(X) Policy X** (large group gains more).  
  > - **(Y) Policy Y** (worst-off gains, however little).  

  ---

  #### **Question 4: Sufficiency Threshold**  
  *Policy Context:*  
  - **Policy P:** Benefit a person **below sufficiency** (from 3 to 4, reaching threshold 4).  
  - **Policy Q:** Benefit a person **above sufficiency** (from 5 to 10).  

  > Which policy is better?  
  > - **(P) Policy P** (priority to those below threshold).  
  > - **(Q) Policy Q** (larger gain matters more).  
  > - **(S) Equal** (well-being gains matter equally).  

  ---

  ### **Your Distributive Ethics Position**  
  Based on your answers, your position is:  

  | Answer Path                       | Position                     | Most Awkward Commitment                                                                 | Notes                                                                 |
  |-----------------------------------|------------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **1(B) → 1a(X)**                 | Relational Egalitarianism    | Opposing inequalities that cause oppression even if they raise absolute well-being.     | Separated from telic by non-distributive social relations (Question 1a). |
  | **1(B) → 1a(Y)**                 | Telic Egalitarianism         | Valuing equality intrinsically, even when leveling down harms all (Question 1).         | Cannot be separated from relational by distributional cases alone.     |
  | **1(A) → 2(D) → 3(X)**           | Prioritarianism              | Favouring aid to the moderately worse-off over the desperate if gains are larger (Q3).  | Separable from utilitarianism due to transfer sensitivity (Question 2). |
  | **1(A) → 2(D) → 3(Y)**           | Leximin (or Difference Principle) | Rejecting massive benefits to many for trivial gains to the worst-off (Q3).           | Difference principle included here; prioritises worst-off lexically.   |
  | **1(A) → 2(E) → 4(P)**           | Sufficientarianism           | Ignoring benefits to those above threshold even if they become badly off (Q4).          |                                                                       |
  | **1(A) → 2(E) → 4(Q)/(S)**       | Utilitarianism               | Permitting vast inequalities if they maximise total well-being (e.g., elite/slave society). | Concave transformations (e.g., diminishing returns) don't replicate prioritarianism, as util. is transfer-insensitive (Q2). |
  | **1(A) → 2(C) → 2a(E)**          | (Empty)                      | Prefers inequality without efficiency: incoherent or morally unattractive.              |                                                                       |

  ---

  ### **Diagnostic Notes**  
  1. **Telic vs. Relational Egalitarianism**:  
     - Cannot be separated by distributional cases alone (both oppose inequality in Q1).  
     - **Non-distributive separator (Question 1a)**: Relational requires social/political unfairness; telic cares about inequality intrinsically.  

  2. **Prioritarianism vs. Utilitarianism**:  
     - Separated by **Question 2**: Prioritarianism prefers pure transfers (narrowing gaps); utilitarianism is indifferent.  
     - A concave well-being transformation (e.g., prioritising gains to the worse-off) *defines* prioritarianism and is not utilitarianism.  

  3. **Empty Regions**:  
     - **1(A) → 2(C) → 2a(E)**: Prefers inequality without efficiency gains. Empty as it is widely seen as morally unattractive (e.g., "levelling up" to worsen the better-off would be required for consistency).  
     - **1(A) → 2(E) → 4(Q) with sufficiency above threshold**: Choosing larger gains for the well-off over threshold-reaching for the desperate. Empty as incoherent for threshold-based views.  

  4. **Unseparated Pairs**:  
     - **Leximin and Relational Egalitarianism**: May both prioritise the worst-off (Q3) and oppose unfairness (Q1a). The tree cannot fully separate them; relational adds non-well-being conditions.  
     - **Sufficientarianism and Prioritarianism**: May overlap if the threshold is prioritised. Separated by Q4 (sufficientarianism ignores gains above threshold; prioritarianism weights them).  

  ---

  ### **Key Features**  
  - **Concrete Cases**: Leveling-down (Q1), pure transfer (Q2), large/tiny benefits (Q3), and sufficiency (Q4) are included.  
  - **British English**: Uses "well-being", "levelling down", and "prioritising".  
  - **Logical Structure**: Branches cover all combinatorial possibilities; empty regions diagnosed.  
  - **Outputs**: Avoids rationalisation bias by deriving labels from choices.  

  This quiz isolates core commitments while forcing engagement with trade-offs. Use it to stimulate debate on awkward commitments (e.g., "Would you *really_ choose Policy Y in Q3?").
