  7.  **Ultimate Ontology Question:** "Stepping way back: If *all* interference – finks, masks, synthetic masks – are just points on a contextual spectrum of density, and dispositions are defined by their manifestations *within* a specific interference context... what, ultimately, is the *substrate*? What is the 'thing' that *has* the disposition *before* or *independent* of the interference context? Or is there *nothing* stable there at all?" *(Typos: "substrate")*

