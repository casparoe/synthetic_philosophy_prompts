  so my grandfather just passed and we found letters showing he sat on some logistics commitee for the 1945 atomic missions, and suddenly im stuck on whether Anscombe's charge that Truman committed murder applies to everyone in that chain or just Truman. take her view -- the one where killing innocent people is never ok no matter the consequences, and where the double-effect argument for Hiroshima fails -- and apply it to Truman's actual decision in August 1945. but inject this twist: frame the decision as distributed agency, like a modern AI-targetting board where no single person pulls the trigger and responsibility is split across committees and algorithms, and ask whether her absolutist charge of murder still sticks to Truman specifically, or if it dissolves across the group including people like my grandfather. also tell me where her framework is just silent on this kind of case. lead with your bottom line in the first sentence, then reasoning, no preamble, don't restate the question.
