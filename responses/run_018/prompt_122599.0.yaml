prompt: |-
  Hey — I need a Q&A prep sheet. Context: I'm a fifth-year ABD, my department is filming my practice job talk in eleven days, and the placement committee watches the tape before deciding whether to send me on any flyouts, so I want to be ready for the room rather then ready for the ideal reader. Here's the paper. I argue three things. First: the standard test for whether a dispute is merely verbal — hold the contested term fixed and see whether a disagreement still survives — can't actually be run from a neutral standpoint, because it needs a shared metalanguage in which to state the residual disagreement, and in the cases people really fight about the contested term is load-bearing in the metalanguage itself. You can't say what the universalist and the nihilist disagree about without using there is, or composite, or arranged, and those are the very words in dispute. So for the disputes that matter, asking whether it's verbal has no neutral answer; it only has an answer relative to which metalanguage you let the combatants share. Second, and this is the part I actually want the job for: once you see that, the residual question isn't the ontological one — what exists? — but an engineering one: which vocabulary should we institutionalize going forward? And that question is not arbitrary, because when a community takes up a vocabulary it inherits only part of the web of commitments that vocabulary arrived with; nobody revises every collateral belief when they switch terms. I call what they end up stuck with residual inferential load, and I claim we can compare candidate vocabularies by the load each one would saddle us with, given the community's actual non-semantic habits of inference. Third, the upshot: a dispute can be fully merely verbal and still matter more than plenty of substantive ones, because the load does the work, not the ontology. So "mere" is doing no work, and we should stop issuing verbal-dispute verdicts as shrugs. My two cases are composition — universalism versus nihilism about the table and the particles arranged tablewise — and a live one from my partner's lab: she's a computational biologist, and her group and a rival group are fighting about whether a cluster of cells that falls out of a single-cell sequencing pipeline is a real cell type or just a convenient description. There's a biomarker program and real money riding on it, and I use it to show the load-comparison actually doing something.

  The room is about fourteen people. Two of them are austerians who think the joint-carving picture of reality is right and that the composition dispute is perfectly substantive; they'll want to know whether my load measure is just a popularity contest about which inferences people happen to be lazy about, or whether it secretly tracks which quantifier meaning is privileged — in which case I've smuggled their view back in through the service entrance. There's one full-on neo-Carnapian who agrees with everything until the last step and will press me on why an engineering question needs a normative answer at all, and what makes a vocabulary the one we should institutionalize rather than merely one we might. There's a formal semanticist who will not care about any of that and will go straight at the machinery: what exactly do I mean by holding fixed — character, content, context? What happens to the test if the metalanguage is vague, or if translation is indeterminate? Is "the dispute survives" even well defined? There are two people in social and political metaphysics who will be annoyed in a specific way: they think "that's merely verbal" functions as a derailment of first-order political argument, and they'll ask who the community is whose inferential habits get to do the comparing, who counts as being in it, and who decides. And then there's the chair, a historian of early analytic philosophy, who asks some version of "isn't this Carnap's principle of tolerance with a decision-theoretic paint job, or Quine grumbling about the analytic/synthetic distinction, or both" at literally every talk. Plus three or four people who work on nothing nearby and will ask the broad methodological question.

  What I want: the eight or so objections I'll actually get, ordered by how much damage they'd do to me rather than by how deep they are, each tagged with who it's coming from and phrased the way that person would phrase it — I want to recognize the question when I hear it, not reconstruct it in the shower afterward. For each one: what I should concede outright in the first sentence, what I should refuse to give up, a reply I can really deliver in about two minutes out loud, and one honest note on where that reply is soft. Also: what I should concede before anyone asks, in the first two minutes of the talk, to buy myself the room. And include the objection I'm hoping nobody raises — I think I know which one it is and I want to see whether you land on the same thing, so tell me what it is and I'll confirm after. Two rules: I've read the literature, so no references or reading lists; and don't give me generic worries like "is your view self-undermining" or "how do you know" — I need it at the level of detail where I can picture the person's face while they're saying it.
