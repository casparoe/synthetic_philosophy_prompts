reasoning: |-
  We are evaluating a position that moral objectivity is defended by cross-cultural stability in the *ranking* of moral domains (e.g., harm, fairness, loyalty, authority, sanctity) rather than universal agreement on specific norms. The argument is that WEIRD societies (which prioritize harm and fairness and suppress loyalty/authority/sanctity) show predictable dysfunction (like social fragmentation and lower in-group coordination) that non-WEIRD societies avoid by maintaining balanced rankings. Thus, the failure modes of the WEIRD pattern strengthen the case for moral objectivity.

  We are to list defeaters (arguments against this position) in a JSON format and then a summary table. Each defeater should have:
  - defeater_name: string
  - defeater_type: "empirical", "conceptual", or "methodological"
  - severity: "fatal", "serious", or "awkward"
  - defenders_concede: boolean (whether defenders of the position would concede this point or dismiss it)
  - explanation: one sentence

  We are to rank defeaters from fatal to merely awkward. We consider:
  - Empirical results that could challenge the view (existing or possible future findings)
  - Conceptual issues (e.g., with linking dysfunction to objectivity)
  - Methodological issues (e.g., if the view becomes unfalsifiable)

  After the JSON, we provide a summary table.

  Let's brainstorm defeaters:

  1. **Empirical challenge: Non-WEIRD societies also experience social fragmentation despite balanced rankings?**
     - If non-WEIRD societies with balanced rankings also show similar dysfunction, then the WEIRD pattern isn't uniquely dysfunctional.
     - Severity: serious (if true, undermines the predictive power of the imbalance)
     - Defenders might concede if evidence is strong, but they might also argue that the types of fragmentation are different.

  2. **Conceptual issue: Defining dysfunction and linking it to objectivity.**
     - Is social fragmentation necessarily a dysfunction? Maybe it's a trade-off for other benefits (e.g., individualism, innovation). Moreover, how does dysfunction prove moral objectivity? It might just show that certain moral systems are more stable, not that they are objectively better.
     - Severity: serious (strikes at the core argument)
     - Defenders might dismiss by insisting on a functionalist perspective.

  3. **Methodological issue: Unfalsifiability.**
     - If any outcome (e.g., WEIRD fragmentation or non-WEIRD cohesion) can be interpreted as supporting the theory (by calling one dysfunctional and the other functional), then the theory is unfalsifiable. Also, "balanced rankings" might be defined post-hoc to fit the desired outcome.
     - Severity: fatal (if the theory cannot be tested, it's not scientific)
     - Defenders might concede the need for clear operational definitions to avoid this.

  4. **Empirical challenge: WEIRD societies are not actually more dysfunctional?**
     - If WEIRD societies show high levels of social cohesion (e.g., through civic engagement, trust) or if non-WEIRD societies have their own forms of dysfunction (e.g., oppression, lack of innovation), then the claim of predictable dysfunction in WEIRD societies is weakened.
     - Severity: serious (if the empirical premise is false, the argument collapses)
     - Defenders might dismiss by redefining dysfunction or pointing to specific metrics.

  5. **Conceptual issue: Moral objectivity requires universal norms, not just functional outcomes.**
     - The argument shifts the goalposts: objectivity is traditionally about truth conditions that hold regardless of culture, not about what works functionally. Functional success might be pragmatic, not objective in the moral realist sense.
     - Severity: fatal (if the theory abandons the traditional notion of objectivity)
     - Defenders might concede that they are redefining objectivity, but argue that functional objectivity is a valid form.

  6. **Empirical challenge: Variability in rankings even within non-WEIRD societies.**
     - If non-WEIRD societies vary widely in how they rank moral foundations (some might prioritize authority more than sanctity, etc.) and yet avoid dysfunction, then the claim that a specific balance is necessary is weakened.
     - Severity: awkward (it might be handled by allowing a range of balanced rankings)
     - Defenders might dismiss by arguing that the key is avoiding extreme suppression of any foundation.

  7. **Methodological issue: Measuring moral rankings and dysfunction.**
     - Current tools (like MFQ) might not capture the complexity of moral systems, and dysfunction is hard to measure objectively (e.g., is lower in-group coordination always bad?).
     - Severity: serious (without reliable measures, the empirical basis is shaky)
     - Defenders might concede the limitations but argue that the patterns are robust enough.

  8. **Conceptual issue: The naturalistic fallacy (deriving 'ought' from 'is').**
     - Even if we observe that societies with balanced rankings function better, it does not follow that they are objectively morally better. This commits the naturalistic fallacy by inferring moral truths from functional facts.
     - Severity: fatal (a classic philosophical problem)
     - Defenders might dismiss by rejecting the is-ought distinction or by adopting a naturalist moral realism.

  Now, we structure the defeaters in JSON format. We'll list them in order of severity (fatal first) and then by type. We'll assign:

  - Fatal: 3 (unfalsifiability), 5 (redefinition of objectivity), 8 (naturalistic fallacy)
  - Serious: 1, 2, 4, 6, 7
  - Awkward: (none in our list, but we can adjust)

  But note: severity is subjective. We'll assign as follows:

  - Fatal: Unfalsifiability (3), Redefinition of Objectivity (5), Naturalistic Fallacy (8)
