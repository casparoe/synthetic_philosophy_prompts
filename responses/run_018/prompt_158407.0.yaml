  The rain hadn’t stopped for three days. Inside the faded green army tent, the air hung thick with the smell of damp canvas, wet earth, and the acrid tang of instant coffee gone cold. Maya stared at the artefacts spread across the collapsible table like a battlefield after defeat. Pottery shards, knapped flints, carved bone fragments – meticulously sorted into rows, each labelled with her cramped handwriting in a grid that now felt like a monument to futility.

  Six months. Six months in this muddy valley, squatting by smoky hearths, listening to the soft cadence of the Riverfolk elders, painstakingly recording names, uses, materials. She’d built a taxonomy. *Hadn’t she?* Smooth vs. textured pottery. Hunting tools vs. domestic tools. Stone sourced from the mountains vs. river gravel. Her spreadsheets bloomed with categories, nested neatly. Her informants, old Kael especially, had humoured her. They’d sorted, pointed, nodded. "Yes, Maya, this one is *keth*." "No, that is *lor*." "Ah, *jann*, definitely *jann*."

  But the system kept leaking. A smooth pot used for storing grain would be *keth*, but an identical smooth pot found near the burial mounds was suddenly *vor*. A flint scraper was *lor* in the morning, but *jann* if brought out after sunset. Kael would just shrug, his weathered face impassive. "It is how it is."

  Her coffee mug left a damp ring on her notebook, blurring the ink next to a sketch of a bone needle. She’d been so sure the key was microscopic wear patterns. She’d lugged a bloody portable microscope through the mud.

  The tent flap rasped open, bringing a gust of wet wind and Kael. He shook water from his woven reed cloak and settled onto the stool opposite her, his movements slow and deliberate. He glanced at the artefacts, then at Maya’s exhausted face, etched with frustration.

  "Still chasing the names, Scholar?" he asked, his voice a low rumble.

  Maya gestured helplessly at the table. "Kael, I don’t understand. This scraper," she tapped a piece of sharpened chert, "you called it *lor* yesterday when Jara used it on the hide. Today, Senn brought out one that looks *identical* to me, used it on wood, and you called it *jann*. The material, the shape, the edge angle… it’s the same!"

  Kael picked up Senn’s scraper, turning it over in his gnarled hands. The weak light from the gas lantern caught the deep lines around his eyes. He didn’t look at the tool. He looked out the tent flap, towards the obscured sky.

  "Yesterday," he said slowly, "was the night of the Thin Crescent. Jara worked under the Thin Crescent’s eye. Senn works today, under the Waning Gibbous." He pointed the scraper towards the invisible moon. "Jara’s hand, guided by the Crescent, makes the hide *receptive*. The tool becomes *lor* – the opener, the persuader. Senn’s hand, under the Gibbous, hardens the wood, makes it stubborn. The tool becomes *jann* – the insister, the harder press." He placed the scraper back down gently. "It’s not the stone, Scholar. It’s the *when*. It’s the dance with Luma’s face."

  The words landed in the humid tent air like stones in still water. Maya felt the world tilt. Not *what* it was. Not *what* it was made of. Not *what* it looked like.

  *When* it was used. *Under which phase of the moon*.

  Her meticulously constructed taxonomy – smooth/textured, mountain/river, hunting/domestic – it was all scaffolding built on sand. She hadn’t been categorizing *objects* at all. She’d been trying to pin down butterflies by studying the flower they’d just left. The Riverfolk weren’t sorting by inherent properties; they were sorting by dynamic *relationships* – the artefact’s role in a specific moment dictated by a celestial cycle she’d barely noted beyond its effect on river levels and her own damp misery.

  The feature space she’d defined – material, morphology, function – was utterly orthogonal to the real rule. She’d been hunting for boxes, and they were weaving a temporal tapestry.

  Kael saw the dawning, hollow realization on her face. He offered a faint, almost apologetic smile. "You asked for the names of the things. We gave them. But the names… they change with Luma’s breath. Why would they not?"

  Maya looked back at her spreadsheets, the neat columns suddenly absurd. The bone needle wasn't *jann* or *keth* based on its point or polish. It was *jann* when mending nets under the New Moon for secrecy, *keth* when sewing festival garments under the Full Moon for abundance. The answer wasn't hidden in the density of the clay or the angle of the flake scar. It was written in the sky, a language she hadn't thought to learn, because her priors screamed 'taxonomy', not 'phase-locked relational context'.

  The rain drummed harder on the canvas. It sounded like laughter. Months of work, soaked through, not by the downpour, but by the sudden, chilling understanding that she’d been meticulously measuring the wrong dimensions entirely. The artefacts on the table hadn’t changed. But the universe holding them had just reconfigured itself, leaving her classification system – her entire inductive framework – looking like childish scribbles in the mud. Her coffee was definitely cold now. She pushed the mug away, the ring it left merging with the blurred ink, a perfect metaphor for the mess she was in.
