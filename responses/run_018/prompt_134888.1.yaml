prompt: |-
  You're a senior advisor on democratic innovation working with a mid-sized city manager. Think step by step and do a quick brainstorm before you layout the answer. I need you to turn the actual logic behind sortition—random selection solves party capture but only produces legitimate outcomes under descriptive representation, low urgency, and the absence of "mandate contamination"—into a reusable decision procedue your office can run in about 20 minutes before anyone signs off. The city keeps recieving pitched citizens' assemblies for every dispute, so build an ordered checklist: entry conditions that make this even a candidate, hard-stop questions where a no kills the proposal dead, then the nodes where facts end and values take over, with clear flags for where the tool will misfire. Treat mandate contamination—when the recruitment pool draws from self-selected activists rather than a genuinely random civic roll—as a fatal flaw if present.

  Apply the checklist to two proposals: first, a sorted mini-public to redesign bike-lane priorities, which should pass but yield a recommendation that conflicts with the mayor's campaign promises; second, using sortition to set emergency drought-rationing rules, which should fail hard on urgency and technical need. Don't ask for bibliographies or cite scholars—just build the practical tool, mark the judgment calls honestly, and say exactly what the procedue can't do. Keep it casual, a typo or two is totally fine.
reasoning: |-
  Okay, let's break this down. The user wants a practical decision procedure for evaluating citizens' assembly proposals, grounded in sortition mechanics but stripped of academic fluff. 

  First, gotta unpack the core logic they provided: sortition fixes party capture ONLY when three stars align—descriptive rep (so it actually mirrors the population), low urgency (no time pressure), and clean mandate (no activist hijacking). Mandate contamination is an instant dealbreaker. 

  Hmm... they're clearly frustrated with assembly proposals becoming the city's knee-jerk solution for everything. Needs a brutal triage tool—something a busy city manager can run in 20 min without a poli-sci PhD. Also wants me to flag where values inevitably creep in, no pretending this is pure science.

  *scribbles rough structure* 
  Entry conditions → Hard stops → Judgment zones → Failure flags. Gotta make the contamination check foolproof since that's their non-negotiable. For the test cases: bike lanes should pass (messy politics but not urgent) while drought rationing fails spectacularly (urgency + technical complexity). 

  *mental note* They emphasized "no bibliographies"—this ain't theoretical. Tool must withstand real-world chaos like mayors ignoring recommendations or activists gaming recruitment. Also... keep it casual? Alright, I'll ditch bureaucratic jargon but stay precise. 

  *testing friction points* 
  Biggest tension: "mandate contamination" detection. How does a time-strapped office verify the roll is truly random? Need a red-flag question about recruitment sourcing. Also, that moment when descriptive rep clashes with practical feasibility—gotta call that a values call upfront. 

  *visualizing the checklist* 
  Opening with entry conditions as basic filters (is this even an assembly-shaped problem?). Then the three hard stops—if any fail, proposal dies. Save the nuanced trade-offs (like how much diversity is "enough") for the judgment zone where we admit "hey, this is subjective." Finally, bright-red failure flags where the tool goes blind (e.g., when politicians override outcomes). 

  For the demo cases: 
  - Bike lanes hit all hard stops (clean mandate, low urgency, rep achievable) even though it'll politically sting. Tool says yes but whispers "brace for impact." 
  - Drought rationing? Fails urgency AND technical need. Shut it down before coffee gets cold. 

  *self-critique* 
  Am I being too harsh on emergency use cases? Maybe... but they specified "hard fail" for drought. And honestly? High-stakes + speed + sortition = dumpster fire. Tool should scream abort. 

  Final touch: admitting the tool's limits. Can't force politicians to obey outcomes, can't magically fix deep polarization. Keep it real.
answer: |-
  Here’s your **Sortition Pre-Flight Checklist**—a 20-min gut-check for pitched citizens' assemblies. Built for speed, honesty, and avoiding wasted effort.  

  ---

  ### **The Checklist**  
  **Entry Conditions** *(If all YES → Proceed. One NO → Kill)*  
  ☑️ **Problem Type:** Is this a *values/policy trade-off* (not technical/urgent)?  
  ☑️ **Legitimacy Need:** Is there *loss of trust* in elected reps/staff?  
  ☑️ **Feasibility:** Can we get a *statistically representative pool* (civic roll data exists)?  

  **Hard Stop Questions** *(One NO → Instant Reject)*  
  1️⃣ **Mandate Contamination:** Will recruitment pull **ONLY from official civic rolls** (not self-selected sign-ups, volunteers, or org lists)?  
  2️⃣ **Urgency:** Can this wait **3-6 months** for deliberation/recruitment?  
  3️⃣ **Descriptive Rep Feasibility:** Can we afford **stratified sampling** (age, income, geography etc.) with <5% margin of error?  
  4️⃣ **Technical Simplicity:** Is the topic **non-expert-dependent**? (e.g., no advanced engineering/econ models needed)  

  **Judgment Zone** *(Values Calls—Staff/Manager Weighs Risks)*  
  ⚠️ **Diversity Gap:** If rep. pool misses key groups (e.g., renters, non-English speakers), is impact *tolerable*?  
  ⚠️ **Outcome Clash:** If the assembly’s rec **contradicts elected leadership**, will we *commit to using it* anyway?  
  ⚠️ **Scope Control:** Can we *strictly frame the question* to avoid mission creep?  

  **Failure Flags** *(Tool Misfires Here—Proceed at Own Risk)*  
  ✖️ **Symbolic Use Alert:** If leadership won’t bind to outcomes → **Theatre RISK**.  
  ✖️ **Polarized Topics:** If issue is weaponized (e.g., abortion, zoning wars) → **Gridlock RISK**.  
  ✖️ **Complex Evidence:** If topic needs PhDs to parse data → **Domination-by-experts RISK**.  

  ---

  ### **Test Runs**  
  **Proposal 1: Bike-Lane Priorities Redesign**  
  - **Entry:** ✅ Policy trade-off (safety vs. traffic), ✅ trust gap (cyclists vs. drivers), ✅ civic roll exists.  
  - **Hard Stops:**  
    1️⃣ ✅ Recruitment from city tax/residency rolls ONLY.  
    2️⃣ ✅ No urgency—can wait 4 months.  
    3️⃣ ✅ 500-person sample w/ strata = doable ($ budgeted).  
    4️⃣ ✅ Topic = preferences, not engineering.  
  - **Judgment:** ⚠️ Outcome *will* clash with mayor’s "no bike-lanes downtown" pledge → **Proceed but warn mayor**.  
  - **Failure Flag:** ✖️ Symbolic Use Alert if mayor ignores it → *Tool can’t force political courage*.  
  **VERDICT: ✅ PASS (with conflict warning)**  

  **Proposal 2: Emergency Drought-Rationing Rules**  
  - **Entry:** ✅ Values trade-off (fairness vs. impact), ✅ trust gap (farmers vs. households).  
  - **Hard Stops:**  
    1️⃣ ✅ Civic roll possible.  
    2️⃣ ❌ **URGENCY FAIL**—needs rules in 3 weeks (drought crisis).  
    3️⃣ ❓ Rep feasible but…  
    4️⃣ ❌ **TECHNICAL FAIL**—needs hydrologist/econ input (aquifer data, ag impact models).  
  - **Judgment:** *Skip—already dead*.  
  - **Failure Flag:** ✖️ Urgency + complexity → **Chaos/backfire GUARANTEED**.  
  **VERDICT: ❌ HARD REJECT (fails 2+ hard stops)**  

  ---

  ### **What This Can’t Do**  
  - **Fix bad faith:** Won’t stop politicians from ignoring outcomes.  
  - **Replace experts:** Flops on data-heavy crises (droughts, pandemics).  
  - **Force consensus:** If society’s split, the assembly might be too.  
  - **Prevent gaming:** Vigilance needed on recruitment purity (mandate contamination is silent killer).  

  Casual enough? This fits on one laminated sheet. Run it fast, kill weak pitches early, and watch for those dirty recruitment pools. You’ll dodge 90% of the junk assemblies by hard-stop #2.
