answer: |-
  Here’s a comprehensive exam question package designed for your epistemology final, targeting the nuances of Williamson’s arguments while pushing students beyond rote responses.

  ---

  ### **Exam Question: Williamson’s Margin-for-Error Arguments**  
  *(90-minute in-class essay)*  

  **Background**: Williamson’s anti-luminosity argument shows that no non-trivial condition \(C\) (e.g., *feeling cold*) is "luminous" (if \(C\) obtains, you are in a position to know it obtains). His structurally similar argument denies the KK principle (if you know \(p\), you are in a position to know that you know \(p\)). Both rely on a series of cases with incremental changes.  

  **Your Tasks**:  
  1. **Core Structure**:  
     - What *precise premise* does the anti-luminosity argument require that the anti-KK argument *does not*?  
     - What *additional premise* must the anti-KK argument invoke that the anti-luminosity argument avoids? Explain why this asymmetry exists.  
     *(Hint: Focus on whether the arguments need claims about the subject’s ability to discriminate their own epistemic states.)*  

  2. **The "Deferred" Escape**:  
     Suppose we define:  
     - **Deferred Luminosity**: If \(C\) obtains at \(t_1\), then at some \(t_2 > t_1\) (where \(t_2 - t_1\) is small), you are in a position to know \(C\) obtained at \(t_1\).  
     - **Deferred KK**: If you know \(p\) at \(t_1\), then at some \(t_2 > t_1\), you are in a position to know you knew \(p\) at \(t_1\).  
     - Can Williamson’s margin-for-error reasoning refute these "deferred" theses? If not, does the *direction* of change in the series (e.g., warming vs. cooling) matter? Does the delay genuinely resolve the safety paradox?  

  3. **The Cost of Escape**:  
     If deferred luminosity/KK evade the arguments, do they preserve what made luminosity/KK theoretically desirable (e.g., for rational deliberation, internalist justification, or anti-skepticism)? Or do they surrender the core motivations?  

  ---

  ### **Model Answer** (620 words)  

  Williamson’s anti-luminosity and anti-KK arguments share a sorites-like structure but rely on distinct premises. The anti-luminosity argument requires only two elements: (i) a series of cases ordered by a continuous parameter (e.g., temperature), where adjacent cases are phenomenally indistinguishable, and (ii) a **safety condition for knowledge**: if you know \(C\) obtains, your belief could not easily have been false. In the marginal case where \(C\) barely obtains, a small error could push you to a case where \(C\) fails, violating safety. Crucially, this needs no assumptions about the subject’s access to their *own knowledge state*; the threat is external.  

  The anti-KK argument, however, requires an **extra discriminatory premise**. It assumes that in the marginal case (e.g., where evidence is *almost* strong enough for knowledge), the subject *cannot discriminate* between actually knowing \(p\) and being in a nearby case where they merely believe \(p\) falsely (e.g., due to a fake barn). This premise imports internal accessibility demands: the subject must be unable to tell whether their belief meets the threshold for knowledge. Unlike anti-luminosity—which exploits the objective risk of error—anti-KK relies on a claim about the subject’s *ignorance of their own epistemic position*. Thus, anti-KK is in "worse shape": it needs a premise about first-person discrimination that anti-luminosity avoids.  

  **Deferred theses escape the original arguments**. For deferred luminosity, even if at \(t_1\) (when \(C\) obtains) the subject cannot safely know \(C\) due to marginal conditions, waiting until \(t_2\) allows them to move to a "clearer" case (e.g., further warming makes past cold obvious). Safety for beliefs about the *past* is weaker: a slight change at \(t_2\) won’t falsify "I was cold at \(t_1\)," since \(t_1\) is fixed. The direction of change matters: if the series moves toward *less* clarity (e.g., cooling into ambiguity), deferred knowledge may still fail, but warming into clarity enables escape. Similarly, deferred KK exploits temporal distance: at \(t_2\), the subject might have stronger evidence to confirm they knew \(p\) at \(t_1\), evading the original discrimination problem. Safety for meta-knowledge now targets the present assessment of past knowledge, which is less volatile.  

  **Yet this escape sacrifices the theoretical value of luminosity/KK**. Luminosity was meant to secure *immediate* access to one’s present states for foundational justification. Deferred luminosity cannot ground real-time deliberation (e.g., "I feel cold now, so I should act now"). Likewise, KK supported ideals of rational agency: knowing you know licenses confident assertion or action. Deferred KK, by contrast, permits temporary "blackout periods" where you know \(p\) but cannot access this fact until later—undermining internalist accounts of justification. Worse, deferred views are vulnerable to skepticism: if conditions deteriorate before \(t_2\) arrives (e.g., you forget), you lose your shot at knowledge. What made luminosity/KK desirable was their *immediacy*; deferral concedes that access is indirect, contingent, and potentially lost—precisely what internalists wished to avoid.  

  ---

  ### **Marking Scheme (out of 20)**  
  **A (18–20)**:  
  - **Core Structure (7 pts)**: *Correctly identifies safety/margin as necessary for both, notes anti-KK requires an extra discrimination premise about meta-knowledge, explains why anti-luminosity avoids this (no self-monitoring claim).*  
  - **Deferred Theses (7 pts)**: *Argues deferred views evade margin-for-error (due to temporal shift to safer conditions), notes directionality (warming aids escape), and explains weaker safety for past/fixed targets.*  
  - **Cost of Escape (6 pts)**: *Concludes deferred forms lose immediacy, undermining luminosity/KK’s role in real-time justification/rationality; notes risk of skepticism via deterioration.*  
  *Common A pitfalls: Underplaying anti-KK’s discrimination premise; not specifying safety’s temporal asymmetry.*  

  **B (15–17)**:  
  - **Core Structure (6 pts)**: *Recognizes both arguments use safety/series but misses that anti-KK needs extra discrimination premise; or conflates premises.*  
  - **Deferred Theses (6 pts)**: *States deferred views evade arguments but ignores directionality or safety’s temporal quirks.*  
  - **Cost of Escape (5 pts)**: *Notes loss of immediacy but doesn’t tie to internalism/rationality; or omits skepticism risk.*  
  *Common B pitfalls: Treating anti-luminosity/KK as symmetric; claiming deferred views fully preserve theoretical benefits.*  

  **C (12–14)**: Superficial treatment of premises; misstates how deferred escape works; no engagement with theoretical costs.  
  **D/F (<12)**: Fails to differentiate arguments; ignores deferred theses; major errors.  

  ---

  This question forces students to dissect the machinery of Williamson’s arguments, tests their grasp of safety’s temporal behavior, and evaluates whether deferred access retains philosophical value—avoiding boilerplate "sorites refutes luminosity" answers. The model answer highlights the discrimination premise as anti-KK’s added burden and the fragility of deferred "solutions."
