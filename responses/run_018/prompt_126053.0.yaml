answer: |-
  Here are eight focused interview questions probing the evolutionary-Lewisian synthesis, each with a targeted follow-up designed to pressure-test the core mechanics. The follow-ups anticipate likely responses and escalate the challenge by invoking specific conceptual tools:

  1.  **Core Mechanism:** "Your model replaces Lewis's *common knowledge* requirement with *evolutionary stability* via replicator dynamics. Could you walk us through *exactly* how replicator dynamics translates the problem of convention formation—specifically coordination without communication—into a dynamic where stable linguistic strategies can emerge from populations with only partial, graded mutual expectations? Focus on how the dynamics bypass the need for agents to explicitly model each other's reasoning in full."
      *   *Likely Answer Point:* Appeal to basins of attraction in the strategy space, where populations are drawn towards stable equilibria without agents needing full rationality or infinite regress of beliefs.
      *   **Follow-Up:** "If basins of attraction are pulling populations towards stable sign-meaning pairs, doesn't this risk conflating *stability* achieved through mere population inertia or lack of variation (drift) with stability achieved because the convention genuinely *solves* the coordination problem better than alternatives? How does the replicator dynamics framework distinguish selective pressure for coordination efficiency from mere path-dependent lock-in?"

  2.  **Arbitrariness (vs. Salience):** "Lewis famously emphasized the arbitrariness of conventions. Your evolutionary account explains the persistence of a sign like 'dog' for canines through stability, but how does it explain the *initial selection* of 'dog' over 'cat' (or any other arbitrary sign) *without* appealing to salience? Specifically, how does evolutionary stability ensure that the winning sign is genuinely arbitrary rather than being slightly more 'attractive' due to pre-existing associations, frequency, or minor asymmetries that a salience-based account might exploit?"
      *   *Likely Answer Point:* Multiple equilibria exist, all equally stable coordination solutions ('dog'-canine, 'cat'-canine). Initial random fluctuations or minor historical accidents determine which basin the population enters, and stability locks it in.
      *   **Follow-Up:** "But if all basins are *equally* deep/stable, how do you explain the near-universal observation that linguistic communities converge on *one* sign per meaning, rather than fragmenting into stable sub-populations using different signs? Doesn't the replicator dynamics model, especially with mutation or noise, predict the *possibility* of stable polymorphism (multiple conventions coexisting) for truly arbitrary signs? If fragmentation doesn't occur, does this imply the basins *aren't* symmetric, hinting at hidden asymmetries like salience?"

  3.  **Partial Expectations & Normativity:** "Lewis assigned normative force to conventions: we *ought* to conform because we expect others to conform, expect them to expect us to conform, and so on. If your model replaces full common knowledge with partial, graded mutual expectations (e.g., 'I'm fairly sure most people use 'dog', and they're fairly sure I do too'), how does this weaker epistemic state generate the *normative pressure* to conform? What, in the evolutionary-stability framework, corresponds to the 'ought' beyond mere statistical prediction of behaviour?"
      *   *Likely Answer Point:* The normative "ought" arises from the strategic interdependence captured by the payoff structure in the underlying coordination game. Conforming is the best response given my (imperfect) expectations of others' behaviour. Stability reinforces this.
      *   **Follow-Up:** "But doesn't this reduce normativity to mere *prudential rationality* ('I do it because it benefits me given what I expect')? How does your framework capture the distinctively *social* or *corrective* aspect of convention – the sense that someone using 'cat' for a dog is not just making a suboptimal choice *for themselves*, but is *mistaken* or *violating* a shared standard, even if their personal expectations are slightly off? Can replicator dynamics model the emergence of *second-order expectations about conformity* (expecting others to *expect* conformity) as the source of this stronger normativity?"

  4.  **Boundary: Convention vs. Habit/Causal Regularity:** "Causal regularities (night follows day) and personal habits (I always take route A) are stable but not conventions. How does your evolutionary-stability criterion definitively mark the boundary? What prevents a causally stable behaviour pattern or a widely shared habitual regularity (like everyone in a village waking at dawn due to light) from counting as a convention under your model?"
      *   *Likely Answer Point:* Conventions solve *coordination problems* where multiple stable equilibria exist. The dawn-waking pattern isn't arbitrary; it's causally determined by sunlight. Conventions require an underlying coordination game structure with multiple potential solutions.
      *   **Follow-Up:** "Consider a population that develops a stable, arbitrary-seeming avoidance behaviour around a harmless landmark due to an initial superstition. It solves a (trivial) coordination problem ("avoid this spot"), has multiple potential solutions (avoid any landmark), and is evolutionarily stable. Is this a convention? If not, how does your framework distinguish it from a linguistic convention without smuggling in an implicit requirement for communicative intent or mutual recognition of the coordination problem that your model supposedly avoids?"

  5.  **Learning & Transmission:** "Replicator dynamics often models selection among pre-defined strategies in a population. But language acquisition involves learners *inducing* conventions from limited, noisy data. How does your evolutionary-stability framework model the *transmission* process? Specifically, how do partial mutual expectations persist and stabilize across generations when new learners only observe fragmentary behavioural regularities and must actively infer the convention?"
      *   *Likely Answer Point:* The stability of the convention in the adult population creates a sufficiently consistent learning environment. Learners acquire successful strategies (those they observe working) through imitation or reinforcement learning, inheriting the graded expectations embodied in the population's behaviour.
      *   **Follow-Up:** "Doesn't this learning process risk 'diluting' the partial mutual expectations over time? If learners only see behaviour and not the underlying expectations, how do *second-order expectations* (I expect others to expect X) get transmitted? Could drift in learner interpretation lead to stable but subtly shifted conventions, undermining the idea of persistent partial mutual knowledge across generations?"

  6.  **Error & Sanction:** "Lewis discussed the role of sanctions (even mild disapproval) in maintaining conventions. How does your evolutionary model incorporate the response to errors or deviations? Is sanctioning behaviour itself an evolutionarily stable strategy, or is mere avoidance of miscoordination sufficient? If sanctioning is part of the picture, how does it emerge from the dynamics without presupposing normative judgments?"
      *   *Likely Answer Point:* Sanctions can be modelled as costly signals reinforcing the convention or as strategies that punish deviation, stabilizing the convention. Alternatively, the primary "sanction" is simply the cost of miscoordination itself (confusion, inefficiency).
      *   **Follow-Up:** "If the primary sanction is miscoordination cost, how does this explain sanctions for deviations that *don't* cause immediate miscoordination (e.g., using an archaic but understandable word, or a minor mispronunciation)? If explicit sanctioning behaviour evolves, doesn't its stability depend on higher-order mutual expectations about *when* sanctioning is appropriate, pushing us back towards something resembling common knowledge for the sanctioning norm itself?"

  7.  **Scale & Network Effects:** "Lewis's model often implies small, homogeneous groups. How does your evolutionary stability framework scale to large, diverse linguistic communities with overlapping sub-communities, dialects, and idiolects? Can replicator dynamics account for the stability of conventions across such fragmented, networked populations where mutual expectations are likely highly graded and localized?"
      *   *Likely Answer Point:* The dynamics can incorporate population structure (e.g., network models, group selection analogues). Stability can emerge locally within sub-communities, and convergence across communities depends on interaction rates and the relative stability/fitness of competing variants.
      *   **Follow-Up:** "Doesn't significant population structure and localized interactions inherently lead to *drift* and the potential for stable *divergence* (dialects) even for core conventions? If 'global' stability isn't required or achieved, how do we identify the 'convention'? Is it only stable relative to a specific sub-population? How does this reconcile with the intuition that 'English' has conventions despite internal variation?"

  8.  **Explanatory Payoff vs. Lewis:** "Finally, what is the *explanatory advantage* of replacing common knowledge with evolutionary stability for *core* linguistic conventions? Does it genuinely explain phenomena Lewis's model couldn't (beyond just being more realistic psychologically), or is the main benefit simplifying the epistemic requirements? Can you point to a specific linguistic phenomenon where the evolutionary-stability mechanics provide a fundamentally *better* explanation than a Lewisian model augmented with, say, bounded rationality or finite-order mutual knowledge?"
      *   *Likely Answer Point:* It provides a more realistic, dynamic foundation showing how conventions *can* emerge and persist without unrealistic cognitive demands. It better handles gradual change, variation, and the role of population dynamics.
      *   **Follow-Up:** "But doesn't bounded rationality (e.g., agents with 2nd or 3rd-order mutual beliefs) achieve similar psychological realism without abandoning the game-theoretic structure Lewis relied on for normativity? If the evolutionary model's unique contribution is explaining persistence through drift or population structure, doesn't that risk reducing convention to a *mere* population-level statistical effect, losing the intentional, normative dimension Lewis aimed to capture?"
