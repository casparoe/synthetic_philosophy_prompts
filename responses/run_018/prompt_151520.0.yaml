prompt: |-
  I am trying to determine what I genuinely believe about political obligation and the conditions under which breaking the law can be justified, by examining my unreflective verdicts on specific cases and seeing whether they cohere.

  My verdicts are as follows. First, openly refusing to pay a portion of income tax that is explicitly allocated to funding a military intervention I regard as gravely unjust, announcing the refusal and accepting the legal penalty, strikes me as justified civil disobedience: my general duty to obey that tax law is overridden. Second, quietly concealing assets to avoid paying the very same tax, with no public disclosure and with the aim of escaping punishment, strikes me as unjustified evasion: the obligation remains intact, and secrecy removes whatever justification might exist. Third, participating in an open, non-violent sit-in that blocks access to a government office in protest against an unjust deportation policy, accepting arrest without resistance, strikes me as justified: the procedural duty not to obstruct is suspended. Fourth, working as a civil servant and secretly altering official records to prevent one specific, imminent deportation that I regard as wrong, without ever revealing the alteration, strikes me as justified—indeed, more clearly so than case two, despite being equally secret. Fifth, publicly refusing jury service in a legal system with well-documented racial disparities in conviction rates, explaining my refusal to the court in writing, strikes me as unjustified: the burden is minimal, the refusal weakens a shared institution, and the communicative gain is insufficient to override the duty of fair participation. Sixth, working as a physician and quietly omitting to file a legally required report of a patient's undocumented immigration status, treating the patient but saying nothing in public, is the case I keep returning to: sometimes it feels analogous to case four (direct prevention of immediate harm justifies secret non-compliance with an instrumental rule), sometimes analogous to case two (a hidden withdrawal from legal obligation without communicative purpose is mere evasion).

  Is there a single principle, or a small family of principles, that captures the pattern across these six? I want it stated precisely, with each clause tied to the case that motivates it. It should also yield clear verdicts on cases I have not considered—for instance, anonymously leaking classified documents that expose an unjust policy, versus anonymously damaging public property to delay its implementation. Most importantly, I want an honest statement of which of my six verdicts the principle cannot accommodate without revision: does it save case four at the expense of case six, or vice versa? And if one verdict must be surrendered, which is the least costly to drop?
reasoning: |-
  Hmm, the user is grappling with political obligation and when breaking the law is justified. They've presented six specific cases with their intuitive judgments and want a coherent principle that explains them all. This is a deep philosophical exercise in reflective equilibrium - trying to align intuitions with principles.

  Looking at their cases, there's a clear tension between secrecy and justification. Cases 1, 3, and 4 feel justified to them despite breaking laws, while 2, 5 and the conflicted 6 raise concerns. The physician case (6) seems particularly tricky - it shares secrecy with unjustified case 2 but harm-prevention with justified case 4. 

  The key differences I notice are: 
  - Public vs private disobedience (cases 1 vs 2)
  - Direct harm prevention (case 4's record-altering vs case 2's tax evasion)
  - Institutional participation (case 5's jury refusal weakens a necessary institution)
  - Immediacy of harm (case 4 prevents specific deportation, case 6's reporting omission has less direct consequences)

  For a unifying principle, I'm considering something about: 
  1) The nature of the harm prevented (immediate/concrete vs abstract) 
  2) The role-based duties of the actor (physician vs citizen) 
  3) The communicative value of public disobedience 
  4) The proportionality of the violation to the harm

  Case 6 is the real puzzle. If we prioritize harm prevention, it should be justified like case 4. But if we require publicity for civil disobedience, it fails like case 2. The physician has professional obligations that might override legal ones in specific clinical contexts - that could be the distinguishing factor.

  Ultimately the user might need to choose between: 
  A) Sticking with case 4's justification and extending it to case 6 (accepting secret harm prevention) 
  B) Keeping case 6 unjustified and reconsidering case 4 
  Option A seems more consistent with their intuition that preventing immediate harm justifies secrecy. The minimal burden in case 5 and purely self-interested secrecy in case 2 remain clearly distinct.

  The principle should probably emphasize direct prevention of imminent, serious harm to identifiable individuals - which covers cases 4 and potentially 6, while excluding 2 (no immediate harm prevented) and 5 (no harm prevented at all). Public disobedience cases 1 and 3 get additional justification from their communicative function.
answer: |-
  Based on your verdicts, a coherent principle emerges centered on **role-based harm prevention, publicity, and institutional integrity**. This principle has four core components, each anchored to your cases:

  ---

  ### **The Principle of Role-Constrained Public Harm Prevention (RPHP)**  
  *An act of law-breaking is justified if and only if:*  
  1. **It directly prevents imminent, concrete harm to identifiable individuals**;  
     *AND*  
  2. **The actor is uniquely positioned to prevent this harm due to their institutional role or direct access**;  
     *AND EITHER*  
     a) **The act is public and accepts legal consequences** (civil disobedience),  
     *OR*  
     b) **Secrecy is necessary to achieve the harm prevention, and publicity would render the act ineffective**;  
     *WHILE ALSO*  
  3. **The law violated is instrumental (not foundational to procedural justice)**;  
     *AND*  
  4. **The violation does not undermine a minimally just institution’s core function**.  

  ---

  ### **How RPHP Explains Your Cases**  
  - **Case 1 (Tax refusal):**  
    ✓ *Prevents harm* (funds unjust war)  
    ✓ *Public + accepts penalty* (3a)  
    ✗ *But fails 1:* Harm is indirect/structural (war funded by taxes generally, not your specific dollars).  
    → *Accommodated via 3a’s communicative power:* Public sacrifice highlights injustice, overriding the indirectness.  

  - **Case 2 (Tax evasion):**  
    ✗ *Fails 1:* No direct harm prevented (secrecy serves self-interest).  
    ✗ *Fails 2:* No unique role (any taxpayer could evade).  
    → *Correctly deemed unjustified.*  

  - **Case 3 (Sit-in):**  
    ✓ *Prevents harm* (blocks unjust deportations)  
    ✓ *Public + accepts penalty* (3a)  
    ✓ *Violates instrumental rule* (access to office, not core justice)  
    → *Justified.*  

  - **Case 4 (Altering records):**  
    ✓ *Prevents concrete harm* (specific deportation)  
    ✓ *Unique role* (civil servant with access)  
    ✓ *Secrecy necessary* (3b: publicity prevents success)  
    ✓ *Violates instrumental rule* (record-keeping, not a fair trial)  
    → *Justified despite secrecy.*  

  - **Case 5 (Jury refusal):**  
    ✗ *Fails 1:* No direct harm prevented (refusal doesn’t stop a specific unjust conviction).  
    ✗ *Fails 4:* Weakens core institution (jury trials ensure fair adjudication).  
    → *Correctly deemed unjustified.*  

  - **Case 6 (Medical non-reporting):**  
    ✓ *Prevents concrete harm* (deportation of specific patient)  
    ✓ *Unique role* (physician with access)  
    ✓ *Secrecy necessary* (3b: reporting would trigger harm)  
    ✓ *Violates instrumental rule* (immigration reporting, not core care)  
    → **RPHP justifies it** (like Case 4).  

  ---

  ### **The Tension: Case 4 vs. Case 6**  
  - **Problem:** Your intuition treats Case 4 as "more clearly justified" than Case 6, but RPHP places them equally.  
  - **Source of conflict:**  
    - *Role proximity to harm:* Altering records (Case 4) is a *direct* act within the harm-causing system. Medical non-reporting (Case 6) is *passive* (omission) and one step removed.  
    - *Institutional expectations:* Physicians are seen as healers, not border agents, making non-compliance feel less transgressive.  

  ---

  ### **Which Verdict Must Be Revised?**  
  - **RPHP forces revision of Case 6’s intuition.**  
    - If you retain "Case 6 feels less justified than Case 4," you must drop **component 2 (unique role)** or weaken **component 1 (immediacy)**.  
    - *Cost of revision:* Abandoning component 2 would unjustly justify Case 2 (tax evasion) if the evader claimed they were "uniquely" funding war. Immediacy (component 1) is essential to distinguish structural vs. concrete harm.  
  - **Least costly option:** Accept that **Case 6 is justified under RPHP**. Your unease may stem from:  
    - *Psychological bias:* Secret acts feel more "evasive" than public ones, even when secrecy is functional.  
    - *Scope concerns:* Medical non-reporting could scale to systemic non-enforcement, but RPHP’s "imminent harm" clause limits this.  

  ---

  ### **RPHP Applied to New Cases**  
  - **Anonymous leak of classified documents exposing injustice:**  
    ✓ *Prevents harm* (e.g., reveals illegal surveillance)  
    ✗ *Fails 3a/3b:* Secrecy isn’t *necessary* for harm prevention (public leak achieves the goal).  
    → **Unjustified** if leak is *only* anonymous to avoid punishment. Justified if anonymity is essential to protect sources.  

  - **Anonymous property damage to delay unjust policy:**  
    ✓ *Prevents harm* (e.g., sabotages deportation bus)  
    ✓ *Secrecy necessary* (3b: publicity would lead to arrest before action)  
    ✗ *But may fail 4:* If damage undermines a core institution (e.g., destroying a courthouse).  
    → **Context-dependent** (e.g., disabling a vehicle: justified; bombing a building: not).  

  ---

  ### **Conclusion**  
  RPHP coheres with 5/6 verdicts and resolves Case 6 in favor of justification. If you reject this, the conflict lies in **weighing institutional roles**: your intuition demands *closer proximity* to harm for secret acts (e.g., Case 4’s bureaucrat is "in" the system, Case 6’s physician is not). To capture this, add:  

  > **2b. *The actor’s role is part of the harm-producing mechanism*.**  

  This saves Case 4 (civil servant in deportation system) but excludes Case 6 (physician not part of border enforcement). *Cost:* It over-justifies whistleblowing by external hackers and under-justifies "outsider" resistance (e.g., hiding refugees). **RPHP without 2b is more consistent.** I recommend revising your intuition on Case 6.
