  I am currently taking an upper-level seminar in metaphysics and philosophy of language focused on vagueness and collective intentionality, and I am drafting the take-home final exam. I want one essay question—designed for a 90-minute response of approximately 1000 to 1200 words—together with a model answer of about 900 words and a marking scheme that distinguishes A-level from B-level performance. The question should force students to work through the internal mechanics of epistemicism and supervaluationism without allowing them to fall back on summary descriptions. To achieve this, it should be anchored in a constructed scenario I am calling institutional dissolution: a university department incrementally loses shared governance structures—first tenure-review authority, then curriculum-veto power, then budget autonomy, then physical space—until only an informal research network remains. Students must determine whether there is a precise fact of the matter about the exact point at which the department ceases to exist, defend either an epistemicist or supervaluationist answer, and explain how each view addresses the sorites series generated by these incremental losses. Crucially, they must also evaluate whether treating department as a collective-intentionality term rather than a physical aggregate introduces a distinct layer of vagueness, and whether supervaluationism's strategy of admissible precisifications either solves or covertly reintroduces sharp boundaries in this institutional context. The model answer should make explicit the specific conceptual moves that earn top marks—distinguishing semantic indecision from ontological indeterminacy, applying the tolerance principle correctly to collective entities, diagnosing whether higher-order vagueness undermines the supervaluationist claim that sharp boundaries are absent, and assessing whether epistemicism's unknown sharp boundary avoids or merely relocates the sorites paradox—while the marking scheme should assign marks to each move, state the total, and identify the characteristic mistakes that cost points, such as conflating epistemic ignorance with metaphysical fuzziness, treating supervaluationist precisification as ontologically creative rather than semantically regulative, or ignoring the collective-intentionality dimension entirely. Please do not request or include bibliographies, reading lists, or citations; the assessment should depend solely on conceptual precision and argumentative structure.
