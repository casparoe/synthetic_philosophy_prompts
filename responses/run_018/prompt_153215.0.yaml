  ## Diachronic Betrayals

  This coin I grasp from stranger's hand today  
  Appears a bargain for my present state,  
  **I'll take the gain today, let debts decay.**  

  My future face I treat as foe, not kin —  
  We're shackled in this cycle, link by link.  
  **You sold me yesterday for thinner skin.**  

  A double-cross across the hours' divide,  
  Where preference shifts betray a hollow core.  
  **I'll take the gain today, let debts decay.**  

  The currency of trust begins to drain  
  Through cracks in logic, leaving promise-keeper's rust.  
  **You sold me yesterday for thinner skin.**  

  No single choice reveals the fractured will,  
  But stacked deceit performs its draining labour:  
  **I'll take the gain today, let debts decay.**  

  Each moment sees its neighbour as a threat,  
  A prisoner trapped where cooperation fails.  
  **You sold me yesterday for thinner skin.**  

  The pumping rhythm bleeds the colour dry,  
  A centre lost; the reckoning is plain:  
  **I'll take the gain today, let debts decay,**  
  **You sold me yesterday for thinner skin.**

  ---

  **Notes on Execution:**

  1.  **Form & Refrains:** Strict villanelle structure (5 tercets ABA, 1 quatrain ABAA). Present Self refrain: **"I'll take the gain today, let debts decay"** (Lines 1, 6, 12, 18). Future Self refrain: **"You sold me yesterday for thinner skin"** (Lines 3, 9, 15, 19). They alternate until meeting in the final couplet.
  2.  **Conceptual Accuracy:**
      *   **Strangers/PD:** "stranger's hand" (L1), "My future face I treat as foe, not kin" (L4), "double-cross across the hours' divide" (L7), "prisoner trapped where cooperation fails" (L16) explicitly frame the temporal slices as distrustful strangers in a PD-like betrayal.
      *   **Distributed Betrayal:** "stacked deceit performs its draining labour" (L11), "Each moment sees its neighbour as a threat" (L15) show the cycle arises from successive, self-interested actions against other temporal selves, not a single irrational burst.
      *   **Money Pump as Drain:** "currency of trust begins to drain" (L10), "The pumping rhythm bleeds the colour dry" (L17), "the reckoning is plain" (L17), culminating in the final image of the single "account" (implied by the unified "I/You" in the couplet) being drained.
      *   **Cyclical Loss:** "shackled in this cycle, link by link" (L5), "preference shifts betray a hollow core" (L8), "draining labour" (L11).
  3.  **Poetic Devices:**
      *   **Rhyme:** Strict ABA scheme per tercet, ABAA in quatrain. Only two rhyme sounds used throughout (A: today/decay/divide/drain/will/threat/dry/plain/skin; B: state/link/core/rust/labour/fails/skin).
      *   **Imagery:** Coins, debts, shackles/chain, currency draining, bleeding colour, hollow core, thinner skin (representing vulnerability/loss).
      *   **Conciseness:** Exactly 19 lines. British spellings used (labour, colour, centre).
      *   **Final Couplet Impact:** The two refrains, representing the antagonistic temporal selves, stand side-by-side in the final couplet, revealing their shared identity and the inevitable consequence ("A centre lost; the reckoning is plain").

  The poem avoids technical jargon ("intransitivity," "diachronic," "Prisoner's Dilemma") but captures the *structure* and *emotional core* of the distributed betrayal concept through metaphor, refrain interplay, and the villanelle's inherent cyclicality.
