  Below is a comprehensive session design based on your goals, incorporating the three wrinkles and key insights. The session uses experiential learning to reveal how assumptions drive IRL inferences, with minimal lecturing. Materials, rules, and a detailed timeline are provided, followed by debriefing notes and troubleshooting.

  ### **Materials & Setup**
  - **Grids** (5x5, printed):
    - **Grid 1 (Base)**: Start (S) at (1,1), Goal (G) at (5,5). No visual obstacles (students see a blank grid).
    - **Grid 2 (Transplant)**: Same S and G, but:
      - Previously avoided cells (e.g., (2,2), (2,4), (4,2), (4,4)) are now **accessible and neutral**.
      - A former shortcut (e.g., the diagonal from (1,1) to (5,5)) is **blocked** (add a visible barrier between (3,3) and (4,4)).
    - **Grid 3 (Rule-Based)**: Identical to Grid 1, but no hidden obstacles.
    - **Grid 4 (Identical Routes)**: S at (1,1), G at (5,5), with two "red" cells at (3,2) and (3,4) (marked visibly).
  - **Secret Reward Sheets** (for demonstrators only):
    - **Alice (Prohibition)**: "Minimize steps. Cells (2,2), (2,4), (4,2), (4,4) are **forbidden** (if entered, you fail)." 
    - **Betty (Non-Optimal)**: "Follow the rule: **Always keep a wall on your left**. If no wall, move toward G." 
    - **Carol & Dave (Identical Routes)**:
      - Carol: "Minimize steps. No cell penalties."
      - Dave: "Avoid red cells (penalty: -10). Minimize steps."
  - **Index Cards**: For students to write hypotheses, routes, and confidence (1–5, where 5 = highest).
  - **Whiteboard**: Track predictions/scores and debrief notes.
  - **Other**: Timer, pens, sticky notes (for anonymized predictions if needed).

  ---

  ### **Rules & Payoff Scheme**
  - **Commitment Rule**: Students must write **exact predictions** (e.g., specific route cells or reward values). No ranges or "maybe."  
  - **Payoff**:  
    - **Confidence Bet**: Students wager confidence points (1–5) on predictions. If wrong, they lose wagered points; if right, gain +1 point (regardless of wager).  
    - **Hedging Penalty**: Vague answers (e.g., "avoids some cells") lose 3 points automatically.  
    - **Scoring**: Track points on whiteboard (no real money). Goal is bragging rights—highest score "wins."  
  - **Demonstrator Rules**:  
    - Practice routes beforehand (to avoid sloppiness).  
    - No verbal hints. If asked, say: "I followed my instructions."  
    - In Transplant Test, demonstrator **must take the optimal path** for their reward (e.g., Alice takes the new shortest path).

  ---

  ### **Session Timeline (75 Minutes Total)**
  **Goal:** Students discover that behavior alone is insufficient; assumptions are doing the heavy lifting.  
  **Key Insight Delivery:** Through failure in activities → debrief connects dots.

  | Time | Phase               | Activity                                                                                                                                                             | Instructor Notes                                                                 |
  |------|---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | 0-5  | **Intro (No theory!)** | Briefly state: "Today, we infer goals from actions. Watch a demonstrator move from S to G. After, write **what they want** and **how sure you are** on cards."        | Emphasize secrecy. Pick first demonstrator (Alice). Hand her secret sheet.       |
  | 5-15 | **Round 1: Prohibition Problem** (Grid 1) | 1. Alice walks route (e.g., avoids forbidden cells; takes long path like S→(1,2)→(1,3)→...→G).<br>2. Students write:<br>   a. *Hypothesis:* "Why did Alice avoid [cells]? (Dislike? Forbidden? Ignorance?)"<br>   b. *Confidence bet.* | Most will assume "dislike." Collect cards but **don’t reveal answers yet**.      |
  | 15-30| **Round 2: Transplant Test** (Grid 2)     | 1. Split class: Half **Clone** (predict Alice’s exact actions), Half **Reward** (predict route using inferred rewards).<br>2. Students write predictions + bet.<br>3. Alice walks new route (shortest path, e.g., through formerly forbidden cells).<br>4. **Score**: Clone group loses if path differs; Reward group wins only if path matches. | Cloners typically lose (old path blocked/longer). Reward group wins only if they inferred "minimize steps" (not "dislike"). |
  | 30-40| **Round 3: Non-Optimality** (Grid 3)      | 1. Betty walks route (e.g., follows left-wall rule: S→(2,1)→(3,1)→...→G—long but sensible).<br>2. Students write:<br>   a. *Reward function* (e.g., "Values corners? Avoids center?").<br>   b. *Confidence bet.*<br>3. Reveal Betty’s rule. | Path looks intentional, so students confabulate rewards. Highlight: "She wasn’t optimizing!" |
  | 40-50| **Round 4: Identical Routes** (Grid 4)    | 1. Carol walks shortest path (avoids red cells incidentally).<br>2. Dave walks **same path** (avoids red cells deliberately).<br>3. Students write: "What reward explains this?"<br>4. Reveal: "Two different rewards, same actions." | Ask: "How many rewards fit this behavior?" (Hint: Infinite).                     |
  | 50-60| **Reveal & Mini-Crisis**                  | 1. Return to Round 1 cards: Show Alice’s true reward ("forbidden," not dislike).<br>2. Ask: "Why did Transplant fail for cloners? Why did satisficing fool you?"<br>3. Whiteboard: List student hypotheses that failed. | Trigger frustration: "We couldn’t tell!" Highlight degeneracy (without naming it). |
  | 60-75| **Debrief: Mapping Assumptions**          | Use whiteboard to link activities to IRL assumptions:                                                                                                                | **Avoid jargon until now**. Students name insights first.                        |

  ---

  ### **Debrief (15 Minutes)**  
  Map in-room experiences to IRL assumptions. **Student-driven:** Ask "What burned you?" then formalize.  

  | In-Room Experience                          | IRL Assumption                          | Instructor Script                                                                                                                                 |
  |---------------------------------------------|------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Prohibition Problem**: Couldn’t tell if avoided cells were disliked, forbidden, or unknown. | **Known dynamics** (environment constraints are visible). | "You assumed Alice could enter any cell—but she couldn’t. IRL needs environment knowledge (e.g., 'forbidden' vs. 'disliked')."                   |
  | **Transplant Test**: Cloners failed; Reward predictors succeeded only if they got "minimize steps" right. | **Feature selection** (what rewards are plausible?). | "Cloners memorized actions; reward predictors generalized. But if you picked wrong features (e.g., 'disliked cells'), you failed. Features are chosen by you." |
  | **Non-Optimal Betty**: Confabulated rewards for a rule-follower. | **Optimality** (demonstrator maximizes reward). | "Betty wasn’t optimizing! IRL assumes rationality—if not, we invent rewards that don’t exist."                                                    |
  | **Identical Routes**: Same behavior from different rewards (Carol vs. Dave). | **Degeneracy** (rewards are underdetermined). | "Many rewards explain the same actions (e.g., avoiding red cells by accident vs. on purpose). How do we choose one?"                              |
  | **Reward Flexibility**: Adding potential-based terms (e.g., "if you add +5 to all blue cells but subtract 5 elsewhere, optimal path doesn’t change"). | **Identifiability** (rewards are unique only with tie-breakers). | "Even if we assume optimality, rewards aren’t unique. We need tie-breakers like simplicity (Occam’s razor) or **maximum entropy** (prefers noisy policies)." |

  **Final Punchline**: "Behavior alone is a Rorschach test—you see what you assume. IRL isn’t mind-reading; it’s **assumption-mirroring**."

  ---

  ### **Predictable Problems & Fixes**  
  1. **Secret Leaking**:  
     - *Risk*: Demonstrator hints at rules (e.g., "I had to avoid cells").  
     - *Fix*: Prep demonstrators privately: "Your job is to be cryptic. If pressed, say: 'I followed my sheet.'" If leaked, acknowledge: "This is why real IRL has noisy data!"  

  2. **"Just Copy This Route" Reward**:  
     - *Risk*: A student proposes a reward like "+100 for this exact path."  
     - *Fix*: In Transplant Test, their clone-group prediction fails. Debrief: "This reward doesn’t generalize—it’s memorization, not inference."  

  3. **Sloppy Demonstrator**:  
     - *Risk*: Betty takes a "wrong" turn, breaking the illusion.  
     - *Fix*: Rehearse routes. If she errs, say: "Real data is messy! Does this change your inference?"  

  4. **Hedging or Over-Abstraction**:  
     - *Risk*: Students write "she avoids risks" instead of specific cells.  
     - *Fix*: Enforce payoff: "Vague answer? Lose 3 points. Be specific!"  

  5. **What the Game Can’t Produce (Must Explain)**:  
     - **Maximum Entropy**: Students won’t organically discover it. *Handle by*: Debriefing it as a tie-breaker: "When many rewards fit, IRL methods add assumptions—e.g., maximum entropy assumes the demonstrator is noisily optimal."  
     - **Potential-Based Rewards**: The "identical routes" activity shows degeneracy, but not why adding Φ(s) doesn’t change policies. *Handle by*: Drawing two reward functions on the whiteboard (e.g., R(s) vs. R(s) + Φ(s) - Φ(s')), and asking: "Do these differ? Will Alice’s path change?"  

  **Biggest Risk**: Time. If rounds run long, cut Identical Routes to 5 minutes or skip confidence sharing. Prioritize Prohibition and Transplant—they best reveal core assumptions.  

  **Why This Works**: Students *feel* the frustration of unconstrained inference, making assumptions visible. The payoff scheme forces decisive hypotheses, and the debrief turns confusion into insight. By the end, "behavior is ambiguous without assumptions" lands viscerally.  

  Let me know if you’d adjust any grid designs or want simplified reward sheets!
