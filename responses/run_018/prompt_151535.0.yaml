answer: |-
  Here are five defeaters for applying counterpart theory to institutions, ranked from most to least damaging:

  1. **(Fatal)** If institutional identity is fundamentally grounded in physical constitution (e.g., specific buildings, documents, or biological members), strict transworld identity could hold regardless of functional changes, making counterpart theory unnecessary and counterintuitive for tracking the *same* entity.  
  2. **(Fatal)** If collective intentionality *necessarily* constitutes an institution’s essence (e.g., a court *just is* whatever collective accepts its authority), mandates/jurisdiction become essential properties, collapsing the counterpart view into essentialism and negating its core advantage of flexible modal variation.  
  3. **(Seriously damaging)** If institutional persistence relies on unbroken historical chains (e.g., causal origins or legal succession), not functional roles, transworld identity could track that chain even across radically different mandates, rendering counterpart relations redundant for identity claims.  
  4. **(Damaging)** If institutions can undergo gradual, radical functional change *within* a world (e.g., a central bank losing its mandate but retaining identity), transworld identity might extend to worlds with altered functions by analogy, undermining the need for counterparts to handle modal variation.  
  5. **(Awkward)** If modal intuitions about institutions robustly track proper names or rigid descriptions (e.g., "The U.S. Supreme Court" picks the same entity in all worlds regardless of its powers), counterpart theory becomes a counterintuitive revision of ordinary language, inviting charges of unnecessary complexity.  

  Defenders would concede (1) and (2) as fatal if true but argue institutions aren't physical/biological and intentionality is contingent. They’d resist (3)–(5) as compatible with counterparts. Your "specific mandate" focus *is* qualifying the view to avoid essentialism objections, but this insulation fails if (1), (2), or (3) hold.
