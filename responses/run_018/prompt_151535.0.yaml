prompt: |-
  I'm taking a metaphysics course and got into a long argument with a friend about whether counterpart theory should apply to institutional bodies, not just individual people. I want to defend the view that entities like constitutional courts or central banks are better modeled with counterpart relations across worlds rather than strict transworld identity, mostly because it prevents essential institutional features—like having a specific mandate or jurisdiction—from being carried over accidentally into worlds where those features don't belong. But I'm not sure how exposed this institutional-counterpart view actually is.

  Play it straight: what would have to be true for this position to be wrong? Which assumptions about collective intentionality, modal esentialism, or the ontology of social entities could in principle fail, and what would our modal intuitions about institutions have to look like for each escape route? Rank the defeaters from fatal to merely awkward, say which ones defenders of the view would concede as genuinely counting against it, and be honest about whether I've just added qualifications to insulate it from objections. Give me exactly five numbered points, each a sentence or two, with no intro or conclusion.
reasoning: |-
  Okay, the user is taking a metaphysics course and got into an argument about applying counterpart theory to institutional bodies like constitutional courts or central banks. They want to defend this view because it prevents essential institutional features from being accidentally carried over to other possible worlds. But they're unsure about the objections and how exposed their position is. So they're asking what would have to be true for their view to be wrong, and to rank these defeaters from fatal to merely awkward.

  First, I need to recall counterpart theory. It's David Lewis's idea where objects in different possible worlds aren't identical but counterparts. For institutions, the user thinks this avoids essentialism problems—like a court having a specific mandate in one world but not necessarily in another. 

  Now, the user wants five points that could defeat their view. I should consider what assumptions would undermine this application. Key areas: collective intentionality, modal essentialism, ontology of social entities, and modal intuitions. Each defeater should be ranked from fatal to awkward.

  Starting with the most fatal. If institutions have transworld identities based on their physical constituents, counterpart theory isn't needed. For example, if a central bank is just the building and people, it could exist in another world without its mandate, making counterparts unnecessary. That's a strong objection.

  Next, collective intentionality. If the existence of an institution depends entirely on collective beliefs, then in worlds where those beliefs differ, the institution might not exist or change fundamentally. But if collective intentionality is metaphysically necessary, then mandates might be essential, making counterpart theory less useful. That's a serious issue but maybe not fatal.

  Third, if institutional identity is grounded in historical origins rather than functional roles. If the court's identity is tied to its founding moment, then even in worlds where it functions differently, it's the same entity. Counterpart theory would be redundant here. This is another strong point.

  Fourth, the possibility of gradual transformation. If institutions can change their essential properties over time in the actual world, then transworld identity might be possible without counterparts. For example, a bank that loses its mandate slowly is still the same entity. This challenges the need for counterpart relations and is moderately damaging.

  Finally, if our modal intuitions always treat institutions as identical across worlds regardless of changes. If people intuitively see a court without its mandate as the same, then counterpart theory adds unnecessary complexity. This is awkward but not fatal, as intuitions can be misguided.

