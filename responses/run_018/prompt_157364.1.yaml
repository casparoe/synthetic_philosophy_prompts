prompt: |-
  I'm presenting a colloquium paper next Thursday defending what I call frame-sensitive particularism: the claim that moral reasons are not merely variable in weight across contexts, as standard particularists hold, but that the very identity of a feature as a reason depends on an irreducibly situational relational framing. On this view, the same feature—say, withholding information—can operate as a reason for condemnation in one interactional frame and as a reason for praise in another, and this reversal is not recoverable from any general principle, nor from Dancy-style pluralism about reasons. I ground the view in a model of salience calibration drawn from perceptual psychology but applied to moral attention: agents do not apply rules to determine what matters; rather, they attune to a gestalt comprising their emotional posture, the narrative arc of the interaction, and the perceived vulnerability of the other party. This means particularism is not just about the absence of principles but about the positive dynamics of moral attention. The audience is a philosophy department colloquium consisting of a Rossian pluralist who accepts pro tanto reasons but insists on stable ordering relations, a Kantian constructivist who thinks any rejection of universalizability collapses into arbitrariness, a virtue ethicist convinced that particularism is indistinguishable from unprincipled intuitionism, and a visiting moral psychologist working in moral foundations theory who will press me on whether cross-cultural consistency in moral judgment undermines any view that makes reasons this context-dependent. I need a Q&A prep sheet: the objections they will actually raise, in roughly the order they will come, phrased as each of them would phrase them, with for each whether I should concede ground, hold firm, and where my reply is weakest. Include the one reply that must land for the view to survive the session, the weakest point in my own position that I should prepare to defend rather than hope they miss, and specifically the question I'm hoping the moral psychologist doesn't ask. Throughout, say what would change your mind about the strength of these objections—whether an empirical result, a conceptual distinction, or a counterexample—and identify where your reasoning about the audience's reactions is most likely to fail.
reasoning: |-
  Okay, the user is preparing for a philosophy colloquium where they'll defend "frame-sensitive particularism." They need a Q&A prep sheet addressing objections from specific audience members. Let me break this down.

  First, the core of their theory: moral reasons aren't just weight-variable but identity-dependent on situational framing. Features like "withholding information" can flip from being condemnable to praiseworthy based on context, without appeal to general principles. They ground this in perceptual psychology's salience calibration model applied to moral attention—focusing on emotional posture, narrative arc, and perceived vulnerability.

  Now the audience: 
  - Rossian pluralist (pro-tanto reasons with stable ordering)
  - Kantian constructivist (universalizability essential)
  - Virtue ethicist (particularism = unprincipled intuitionism)
  - Moral psychologist (cross-cultural consistency concerns)

  The user wants: 
  1. Predicted objections in each opponent's phrasing
  2. Strategy per objection (concede/hold firm) 
  3. Weak spots in replies
  4. The "must-land" reply
  5. Their own weakest point to prep
  6. The question they hope the psychologist won't ask
  7. What would change the user's mind about objections
  8. Where their audience predictions might fail

  Hmm... the stakes are high because each critic attacks from fundamentally different angles. The Rossian sees frame-sensitivity as undermining reason stability. The Kantian will cry arbitrariness. The virtue ethicist conflates it with intuitionism. The psychologist brings empirical guns about cultural universals.

  For the "must-land" reply, it has to be the explanation of how salience calibration isn't arbitrary—that the gestalt (emotional posture + narrative + vulnerability) provides constraints. Without this, the Kantian's arbitrariness charge sticks.

  Their own weakest point? Probably the lack of criteria for when framing shifts occur. If pressed on how we distinguish legitimate frame-sensitivity from post-hoc rationalization, that's dangerous ground. Better to admit it's underdeveloped than overclaim.

  The psychologist's nightmare question: "If framing is this culturally variable, why do we see cross-cultural agreement in moral dumbfounding studies?" This could force them into corner about cultural universals vs. their context-dependence claim.

  What would change my mind? If studies showed stable reason-identities across cultures in controlled framing scenarios, that'd hurt. Or if someone demonstrated that all their examples reduce to general principles with context-parameters.

  Biggest prediction risk: Underestimating the Kantian's reformulation skills. They might grant the framing dynamics but argue it's still universalizable under higher-order principles about vulnerability-recognition. That'd sidestep the arbitrariness charge while co-opting their view.

  The virtue ethicist might surprise too—if they grant that phronesis already includes frame-sensitivity, collapsing the distinction. User should prepare to argue that virtue ethics still presumes stable character-to-reason links unlike their relational model.

  For the psychologist, emphasizing that moral foundations theory already has context-dependence (e.g., loyalty triggers vary) could help, but the user needs to explain why their framing model isn't just another parameterized principle.
answer: |-
  Here’s a targeted Q&A prep sheet structured around your audience, ordered by likely objection sequence. I’ve flagged strategic concessions, vulnerabilities, and pivotal moments. Crucially, **your "must-land" reply is to the Kantian** – if it fails, the view collapses under charges of arbitrariness.

  ---

  ### **1. Rossian Pluralist (First: Will challenge stability)**  
  **Objection (as phrased):**  
  *"You claim a feature’s status as a reason is frame-dependent, but this erodes the very notion of pro tanto reasons. If withholding information can be a reason for praise or blame depending on framing, what prevents total normative chaos? Ross’s prima facie duties retain stable identity – e.g., fidelity is always a reason against lying, even if overridden. Doesn’t your view dissolve moral structure?"*  

  **Your Response:**  
  - **Hold firm:** Emphasize that Ross’s "stable identity" assumes a context-neutral description of features (e.g., "lying"), but your view rejects this. The *same act* (e.g., withholding a terminal diagnosis) is not "lying" in a vacuum; its moral identity *emerges* from the frame (e.g., *as* cruelty in a transactional frame vs. *as* compassion in a palliative-care frame).  
  - **Weakness:** If pressed, concede that Rossian duties map onto *recurring frame-types* (e.g., "fidelity" arises in promise-keeping frames) but insist the reason’s *valence* isn’t fixed.  
  - **Mind-changer:** Empirical evidence of cross-contextual reason-stability *under identical framings* (e.g., "withholding to protect" is always praiseworthy when vulnerability is salient).  

  ---

  ### **2. Kantian Constructivist (Second: Will attack universalizability)**  
  **Objection (as phrased):**  
  *"If reasons are frame-sensitive and irreducible to principles, doesn’t this make morality arbitrary? Your ‘gestalt’ sounds subjective. Kant’s test ensures moral judgments aren’t contingent on personal perspective – but you ground reasons in relational frames that vary by individual emotional postures. Isn’t this just relativism?"*  

  **Your Response:**  
  - **Must-land reply:** **Hold firm** and argue: "Framing isn’t subjective; it’s intersubjectively constrained by the *narrative arc* and *vulnerability recognition*. The ‘frame’ is co-constituted by agents (e.g., both parties in a confession vs. interrogation recognize the frame). Universalizability operates *within* frames: *In any confession frame where vulnerability is salient*, withholding to protect is laudable. What’s non-universalizable is the frame itself, not judgments within it."  
  - **Weakness:** If they retort that frame-selection needs a principle, you lack a meta-rule. Prep: "Frame-attunement is cultivated, not deduced (like perceptual skill). Moral progress refines frame-sensitivity, not rule-application."  
  - **Mind-changer:** A conceptual demonstration that frame-attunement *requires* implicit universal rules (e.g., "always prioritize vulnerability") would collapse your view.  

  ---

  ### **3. Virtue Ethicist (Third: Will conflate with intuitionism)**  
  **Objection (as phrased):**  
  *"This sounds like intuitionism in disguise – agents ‘attune’ to gestalts based on emotion and narrative, but without phronesis (practical wisdom) anchoring judgment in character, how is this not caprice? Virtue ethics avoids principles but retains stable traits; you reduce morality to psychological reflexes."*  

  **Your Response:**  
  - **Concede and reframe:** Agree that virtue ethics shares anti-codifiability but argue: "Phronesis presupposes a *fixed character*, but framing is *relationally emergent*. A virtuous agent in a colonial exploitation frame may condemn land-taking, while in a famine-rescue frame praise it – *without trait inconsistency*. The ‘gestalt’ includes the other’s perceived vulnerability, not just the agent’s character."  
  - **Weakness:** If they note virtues (e.g., compassion) *explain* frame-sensitivity. Prep: "Virtues name dispositions to *detect frames*, but the reasons arise from the frame, not the virtue."  
  - **Mind-changer:** Evidence that all framing dynamics reduce to virtue/vice ascriptions (e.g., "praise in frame X = compassion").  

  ---

  ### **4. Moral Psychologist (Last: Will press cross-cultural data)**  
  **Objection (as phrased):**  
  *"Moral Foundations Theory shows cross-cultural consistency in moral domains (care, fairness, etc.). If reasons are frame-dependent, why do we see broad agreement on, say, harm avoidance? Doesn’t this suggest invariant core reasons, with framing merely affecting application?"*  

  **Your Response:**  
  - **Hold firm:** "MFT’s ‘domains’ are abstract. Concrete reasons *are* frame-sensitive: ‘Harm’ in a punishment frame (e.g., spanking a child) can be seen as *care*, while in a dignity frame it’s *violence*. Cultures agree on domains *because they share recurrent frames* (e.g., parent-child), not because reasons are invariant."  
  - **Weakness:** You struggle to explain why some frames (e.g., "unprovoked violence") are near-universally condemned. Prep: "Frames themselves have ecological constraints (e.g., vulnerability detection is evolutionarily primitive)."  
  - **Question you hope they don’t ask:**  
    *"Can you operationalize ‘framing’ in a way that predicts moral valence shifts cross-culturally? If not, isn’t this unfalsifiable?"*  
    **Why feared:** Your model is descriptive, not predictive. Reply: "Framing is measurable via narrative engagement (psychology) and vulnerability cues (neuroscience) – but yes, valence prediction remains complex."  

  ---

  ### **Critical Vulnerabilities & Prep Priorities**  
  - **Weakest point in your position:** **Lack of criteria for frame boundaries.**  
    - Prep for: *"How do we distinguish a ‘frame shift’ from mere moral error?"*  
    - Defense: "Frames are defined by shared narrative expectations (e.g., ‘medical triage’ vs. ‘casual chat’). Misattunement (e.g., joking in a grief frame) is recognizable via social rupture."  

  - **Where audience predictions may fail:**  
    - The Rossian might grant frame-sensitivity but argue for *meta-principles* governing frame-selection.  
    - The Kantian could accept your reply but pivot to *political implications* (e.g., "Doesn’t this undermine human rights universality?").  

  - **What would change your mind:**  
    - Empirical: fMRI studies showing identical neural patterns for a feature (e.g., "deception") across valences.  
    - Conceptual: Proving that "vulnerability" or "narrative arc" presupposes invariant moral reasons.  

  **Final Tip:** Anchor replies in your **salience calibration model**. Contrast it with "rule-application" (Kantian), "trait-expression" (virtue), and "domain-triggering" (MFT) to highlight what’s distinctive. If the Kantian objection is defused, the view survives.
