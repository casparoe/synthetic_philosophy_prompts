  We are constructing a thought experiment set in an ordinary open-world role-playing game (no sci-fi). The scenario must be described in a single paragraph and focus on the property of "counterfactual persistence" (the idea that the game character continues to develop narrative and relational states even when the player is not interacting with the game). The two stances (virtual moral realism and virtual moral anti-realism) must agree on the non-moral facts but disagree on whether it is wrong for the player to permanently delete a specific NPC. The wrongness must not be reducible to harm to other human players or the player's own character development, and should hinge solely on counterfactual persistence.

  **Scenario:**

  In the open-world game "Eldoria," the player encounters a non-player character (NPC) named Aris, a blacksmith in a remote village. Aris has a routine: during the day, he forges weapons in his shop, and at night, he sits by the fire and writes in a journal, which the game's lore system reveals is a chronicle of the village's history and his personal reflections. The game engine is designed such that when the player is away from the village, Aris continues his activities as if time passes—the journal entries accumulate, and he occasionally visits the gravesite of his deceased mentor to reflect. The player, after reading an early journal entry that reveals Aris's deep commitment to preserving the village's legacy, decides to permanently delete Aris from the game files. This deletion is irreversible and occurs while the player is away from the village, so no in-game characters witness it. The non-moral facts are: Aris is a complex NPC with scripted routines and emergent behaviors, the game world simulates persistence via background processes, and deletion removes all traces of Aris, including future journal entries and interactions that would have occurred. The player's action does not affect other players (it's single-player) and does not hinder the player's own progress or character development (as Aris is not essential to any quest).

  **Reasoning for each stance:**

  1. **Virtual Moral Realism (VMR):** 
     - This stance holds that moral wrongness can arise in relation to virtual entities if they possess certain properties. The key property here is counterfactual persistence: Aris continues to develop his narrative (writing journal entries) and relational states (visiting the gravesite) even when the player is not present. This creates a sense of an ongoing inner life and a trajectory of experiences that are cut short by deletion. The wrongness lies in the destruction of this unfolding narrative and the relational bonds (even if one-sided) that Aris is forming with other elements of the game world (like the gravesite). Thus, deleting Aris is wrong because it terminates a persistent, autonomously developing life-narrative that would have otherwise continued. The structural feature doing the work is counterfactual persistence: it grants Aris a form of continuity and independence from the player's immediate attention, making the deletion an act of premature termination of a developing story.

  2. **Virtual Moral Anti-Realism (VMAR):**
     - This stance denies that virtual entities have moral status. Even though the game engine simulates counterfactual persistence, this is merely an illusion created by pre-scripted routines and background processes. Aris does not have a genuine inner life; his journal entries and visits are predetermined or randomly generated by algorithms. Thus, deleting Aris is not wrong because there is no actual narrative or relational development being destroyed—only the potential for the player to observe more outputs from the program. The structural feature of counterfactual persistence does not confer moral relevance because it is not a property of Aris as an independent entity but a feature of the game's design to enhance player immersion. The deletion is no more wrong than deleting a text file.

  **Disagreement's dependence on counterfactual persistence:**

  If we eliminate counterfactual persistence—for example, by making the game world fully deterministic and only advancing during direct player interaction (i.e., when the player is in the village, time passes for Aris, but when the player leaves, the village state freezes until the next visit)—then the disagreement collapses. In this altered scenario:

  - VMR would no longer see a wrong because Aris lacks an ongoing existence when the player is absent. There is no independent narrative development that is being cut short; Aris only "lives" when observed. Thus, deletion is not terminating a persistent entity but merely removing a set of frozen states.
  - VMAR would maintain that deletion is not wrong, but now both stances agree on the verdict (not wrong) because the feature that VMR relied upon (counterfactual persistence) is absent.

  **Anti-realist attack on counterfactual persistence:**

  The anti-realist might argue that counterfactual persistence is merely an artifact of the game engine's architecture, not a morally relevant property of the represented entity (Aris). The engine's background processes are designed to create the illusion of a living world for the sake of player experience. However, these processes are just computations that run regardless of whether anyone is observing them, and they do not indicate any genuine inner life or independent existence. The journal entries, for instance, are pulled from a database of pre-written text or generated by an algorithm that doesn't reflect any actual mental states. Therefore, the property of counterfactual persistence is a trick of the software, not a feature that grants moral standing to the NPC. Without real sentience or intentionality, the NPC's "narrative" is just data being processed, and deleting it is no more morally problematic than erasing a spreadsheet.

  **Conclusion:**

  The thought experiment isolates counterfactual persistence as the key feature that drives the disagreement. Without it, both stances converge on the permissibility of deletion. The anti-realist critique effectively reduces the property to an architectural illusion, which the realist must counter by arguing that the represented persistence (even if simulated) creates a moral claim. This debate highlights the challenge of grounding moral status in virtual entities without appealing to traditional criteria like sentience.
