prompt: |-
  I'm in a political philosophy seminar this semester and we spent a few weeks on punishment, but literally everything we read was about the state, prisons, and sentencing, so I have no idea whether any of it transfers to a situation I'm actually in right now. Would like a second opinion from someone who isn't in the group chat.

  I'm one of four people organizing a small student-run conference in the spring. Our keynote was going to be a PhD student from another university. Last week someone dug up a pile of stuff he posted when he was 19 — jokes, mostly, the shitty edgy kind, some of them racist and some sexist. There's now a petition with about 200 signatures saying we should disinvite him. Some details that I think matter but I can't tell how:

  - He went public about all of it about a year ago, before anyone came after him, said he was ashamed of it and wrote a long thing about how he changed his mind. So it's not like he's defending it now.
  - Nobody who signed the petition, and nobody in our department, is a member of any of the groups the jokes were about. The petition talks about safety and about who we choose to platform.
  - We'd be the fourth conference to drop him this year. At this point he basically can't present anywhere, and he goes on the job market next autumn.
  - I'm in the group chat where the petition was organized. One of the organizers had a nasty public falling-out with him years ago and pretty obviously mostly wants him gone. Another said outright that going after the old posts is just easier than arguing with his actual research. Two of them are sincere about the posts.
  - He's offered to do a public Q&A thing at the conference instead of the keynote. Our university has some kind of free expression policy that says we don't withdraw invitations over viewpoints, though nobody can tell me if it applies here.

  I feel like there's something unfair about just quietly dropping him, and I can't put my finger on what it is. Is this even the kind of thing the punishment stuff we read is about, or is it just us deciding who we want to spend our budget on? If it is, does it matter that none of us are the people he actually targeted, or that three other conferences already did it, or that some of the people pushing hardest are doing it for reasons I think are bad even though the posts themselves seem like a real reason? We have to decide by Friday and I'd rather have an actual argument than a vibe.
