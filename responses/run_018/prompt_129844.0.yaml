  Turing argues that machines can think based on the imitation game (Turing Test). He adopts functionalism, where mental states are defined by their functional roles, not physical substrates. So, if a machine performs the same functions as a mind, it should be considered a mind. 

  Now, ESP. Turing considers telepathy as a potential objection. He suggests putting people in telepathy-proof rooms to block it, treating it like radio interference. But here's the problem: if minds are purely computational, ESP shouldn't exist at all. It's not just an engineering problem; it's a fundamental contradiction. 

  Why? Because computation relies on information processing via formal rules, without external causal influences. ESP implies non-physical information transfer, which can't be computational. So Turing's functionalism should reject ESP outright. Instead, he treats it as a nuisance, undermining his core argument. 

