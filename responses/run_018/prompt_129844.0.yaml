  I need to emphasize how this weakens his functionalism. His solution (shielding) implies ESP is possible, which contradicts computationalism. The user probably wants this logical flaw exposed to show Turing's oversight. Also, the user might be interested in philosophy of mind, pointing out that Turing's handling of ESP reveals a deeper issue in his theory. 

