prompt: |-
  I am writing a novel in which a philosopher-king must defend a particular account of moral worth. Please construct a formal argument that an agent possesses full moral worth only when acting for reasons that survive what I term the double veil—first, the stripping away of all knowledge of actual consequences, and second, the stripping away of all prospect of social recognition—while conceding that those reasons may be partly constituted by subconscious pattern-matching rather than explicit deliberation. Your argument should show precisely why this revised account avoids both Kantian rigorism and the over-inclusiveness typical of moral-luck objections, and it should treat the subconscious formation of reasons as a feature rather than a defect of moral agency. Keep the reasoning focused and do not invoke empirical studies or lists of sources.
reasoning: |-
  Okay, the user is writing a novel featuring a philosopher-king who needs to defend a specific theory of moral worth. They want a formal argument that an agent has full moral worth only when acting for reasons that pass through what they call the "double veil." This involves two layers: first, ignoring actual consequences, and second, disregarding any chance of social recognition. They also want to include subconscious pattern-matching as part of the reasons, not a flaw. Plus, the argument should avoid Kantian rigorism and moral luck issues.

  First, I need to unpack the double veil concept. The first veil removes knowledge of actual outcomes, which directly tackles moral luck. Moral luck is problematic because it allows factors beyond an agent's control to affect moral judgment. By ignoring consequences, the argument focuses on the agent's reasons rather than results. The second veil eliminates social recognition. This seems aimed at Kant's rigorism, where only duty-driven actions have moral worth. Social recognition might be a form of heteronomy, so stripping it away ensures autonomy.

  Including subconscious pattern-matching is crucial. The user wants this to be a feature, not a bug. So, moral agency isn't just about conscious deliberation but also intuitive, experience-based reasoning. This avoids over-intellectualizing moral decisions, which is a common critique of Kantian ethics. 

  The user mentioned avoiding Kantian rigorism. Kant requires actions done purely from duty, excluding inclinations. By allowing subconscious processes, which might blend duty and inclination, the account becomes more inclusive. Actions motivated by deeply internalized virtues could still have moral worth, even if not consciously duty-driven.

  Moral luck objections often argue that luck shouldn't affect moral judgments. The first veil addresses resultant moral luck by removing consequences. The second veil might handle circumstantial moral luck, as social recognition depends on circumstances. So the double veil covers both types of luck.

  Structure-wise, the argument should start with defining moral worth. Then, outline the double veil's purpose: isolating the agent's reasons. Premises should establish why each veil is necessary. For the first veil, it's about control over consequences. For the second, it's about intrinsic vs. extrinsic motivation. Then, integrate subconscious reasons as valid because they're part of the agent's character, developed through experience.

  Need to show why this avoids over-inclusiveness. Without the veils, actions with good results or social praise might be deemed morally worthy, but that's luck. After applying the veils, only reasons that are genuinely the agent's own count. Subconscious patterns are included because they reflect the agent's moral character, not external factors.

  Also, the philosopher-king in the novel needs a defensible position. The argument must be robust against critiques. Emphasize that subconscious processes aren't random but shaped by past rational and emotional development, making them reliable.

  Potential pitfalls: How to ensure subconscious reasons are moral? They must survive the double veil, meaning even without knowing outcomes or recognition, the reasons still compel action. That acts as a filter for moral appropriateness. 

  Conclude that the revised account values the agent's deep-seated reasons, combining autonomy with realistic psychology, thus avoiding Kant's strictness and luck problems.
answer: |-
  Here is a formal argument defending the Philosopher-King's account of moral worth, structured to meet your requirements:

  **The Double Veil Account of Moral Worth**

  **Definitions:**
  1.  **Moral Worth (MW):** The intrinsic value attributable to an agent *qua* moral agent for performing an action, based on the quality of their practical reasoning and motivation.
  2.  **Double Veil (DV):** A hypothetical test for reasons for action:
      *   **Veil 1:** Strips all knowledge of the action's actual, concrete consequences.
      *   **Veil 2:** Strips all prospect (expectation and desire) of social recognition (praise, blame, reward, punishment, esteem, scorn) for performing the action.
  3.  **DV-Surviving Reason (DVSR):** A reason for action that remains a compelling motive for the agent even when subjected to the Double Veil.
  4.  **Pattern-Matched Reason (PMR):** A reason for action arising from subconscious cognitive processes (e.g., intuition, trained response, emotional valence) recognizing morally salient features of a situation based on past experience, without explicit conscious deliberation.

  **Argument:**

  1.  **Premise 1: The Ground of Moral Worth Resides in the Agent's Reasons.** The moral worth of an action stems fundamentally from *why* the agent chooses to perform it – the reasons motivating their choice – because these reasons reflect the agent's character, values, and practical rationality as a moral agent. (Focuses on the *source* of moral value).
  2.  **Premise 2: Moral Worth Must Be Immune to Resultant Moral Luck.** Judgments of moral worth cannot legitimately depend on factors outside the agent's control, particularly the actual consequences of an action (resultant moral luck). Contingent outcomes cannot retroactively confer or negate the intrinsic quality of the agent's motivating reasons at the time of action. (Targets over-inclusiveness/moral luck).
  3.  **Premise 3: Moral Worth Must Be Rooted in Autonomy, Not Heteronomy.** Full moral worth requires the agent's motivation to be *autonomous* – arising from their own recognition of what is right or good. Motivation primarily driven by the desire for social approval, reward, or avoidance of social censure (heteronomy) undermines this autonomy, making the action instrumentally valuable (for gaining recognition) rather than intrinsically morally worthy. (Targets Kantian rigorism's core concern but allows broader sources).
  4.  **Premise 4: The Double Veil Isolates Autonomy-Reflecting Reasons.** A reason surviving the Double Veil (DVSR):
      *   **By Veil 1:** Cannot depend on the agent's *knowledge* of specific good/bad outcomes for its motivating force. It must be compelling based on the perceived nature of the act/situation itself.
      *   **By Veil 2:** Cannot depend on the agent's *expectation or desire* for social praise or avoidance of blame for its motivating force. It must be compelling based on the agent's own judgment of rightness/goodness.
      *   Therefore, a DVSR reflects a motivation grounded in the agent's own apprehension of moral value, independent of contingent outcomes or external validation – satisfying the core demands of autonomy identified in Premise 3. (Defines DVSR and links to autonomy).
  5.  **Premise 5: Pattern Matching is Integral to Competent Moral Agency.** PMRs are not defective forms of reasoning but essential features of skilled moral agency. They represent the internalization of experience, principles, and sensitivities, allowing efficient, contextually appropriate responses. A PMR constitutes a *bona fide* reason held by the agent, reflecting their developed moral character and understanding, even if not consciously articulated step-by-step. (Integrates subconscious as feature).
  6.  **Premise 6: DVSRs (Including PMRs) Are Necessary for Full Moral Worth.**
      *   If an agent's primary reason fails Veil 1 (depends on expected consequences), their worth is vulnerable to resultant luck (contra Premise 2).
      *   If an agent's primary reason fails Veil 2 (depends on social recognition), their motivation is heteronomous (contra Premise 3).
      *   Therefore, only DVSRs satisfy the core conditions for full MW (autonomy, immunity to resultant luck). (Establishes necessity).
  7.  **Premise 7: DVSRs (Including PMRs) Are Sufficient for Full Moral Worth.** An agent acting on a DVSR:
      *   Acts for reasons reflecting their own autonomous grasp of moral value (satisfying Premise 3's core).
      *   Their worth is not undermined by actual outcomes (satisfies Premise 2).
      *   This holds whether the DVSR is consciously deliberated *or* a PMR (per Premise 5, PMRs are valid expressions of the agent's moral capacity).
      *   No *further* condition (e.g., explicit duty-formulation, purity from all inclination) is necessary to establish the intrinsic moral value of acting from such an autonomous, consequence-independent, recognition-independent reason. (Establishes sufficiency and avoids Kantian over-rigor).
  8.  **Conclusion:** Therefore, an agent possesses full moral worth if and only if they act for reasons that survive the Double Veil (DVSRs), and these reasons may be constituted partly or wholly by subconscious pattern-matching (PMRs), which is a legitimate expression of mature moral agency.

  **How this Addresses Your Concerns:**

  *   **Avoids Kantian Rigorism:**
      *   **Rejects Purity Requirement:** It does not demand that the *only* motive be a consciously articulated sense of duty. PMRs inherently blend recognition of duty-like constraints with inclinations shaped by virtue and experience.
      *   **Includes Virtuous Inclination:** Actions motivated by deeply internalized virtues (e.g., compassion, courage) manifested as PMRs *can* have full MW, provided the underlying reason survives the DV (e.g., "Help this suffering person" survives without knowledge of outcome or expectation of praise). This captures the morally worthy "friend of humanity" Kant excluded.
      *   **Focus on Source, Not Form:** It cares *why* the reason is motivating (autonomy via DV survival), not *how* it was cognitively processed (conscious deliberation vs. pattern-matching).

  *   **Avoids Moral Luck Over-Inclusiveness:**
      *   **Veil 1 Neutralizes Resultant Luck:** The actual success/failure of the action, or unforeseen side-effects, are irrelevant. Only the reason *prior* to acting, stripped of consequence knowledge, matters. The well-intentioned rescuer who causes harm and the negligent person saved by luck both fail or pass based solely on their DVSRs, not outcomes.
      *   **Veil 2 Mitigates Circumstantial/Constitutive Luck (Social Aspect):** Whether an action is *seen* or *valued* by others is irrelevant. The hero lauded by society and the unknown martyr act with equal MW if both act on DVSRs. The account doesn't credit actions *merely* because they happen to align with social norms or be observed.

  *   **Treats Subconscious Pattern-Matching as a Feature:**
      *   **Embodied Rationality:** PMRs are framed as the fruit of moral development and experience, not irrational impulses. They represent efficient, context-sensitive application of learned moral understanding ("practical wisdom").
      *   **Expanded Agency:** Moral agency encompasses the whole person, including trained intuitions and emotional responses, not just the deliberative faculty. A PMR *is* the agent's reason, reflecting their character.
      *   **Survival Test Validates PMRs:** The DV test ensures that even subconscious motives must reflect *autonomous* recognition of intrinsic moral value (surviving Veil 2) and not be outcome-dependent (surviving Veil 1) to confer MW. This prevents mere impulses or biases from qualifying.

  This argument provides the Philosopher-King with a robust defense: moral worth lies in the autonomous, consequence-independent, recognition-independent reasons motivating action, deeply embedded in the agent's character and potentially manifest through the efficient cognition of pattern-matching, shielding judgment from both undue rigidity and the vagaries of luck.
