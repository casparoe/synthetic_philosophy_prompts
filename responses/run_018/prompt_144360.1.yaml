  Okay, the user is drafting an essay on an internal tension in Tolstoy's aesthetic theory from "What Is Art?". They've outlined a clear argument about affective dissonance infection. Let me unpack their query step by step.

  First, they question if their reading of Tolstoy's art/non-art distinction is accurate. I recall that Tolstoy defines art as emotional infection but restricts it to morally "good" feelings. The user wonders if he has a way to handle complex mixed emotions. Looking at "What Is Art?", Tolstoy is pretty absolute—he condemns anything with even a trace of "lower" feelings. His examples of genuine art are simple folk tales or Christian art promoting unity. So the user's reading seems solid; Tolstoy doesn't allow for moral ambiguity in transmitted feelings.

  Next, the user asks if affective dissonance exposes a real contradiction. Tolstoy's framework demands moral purity for art status, but infection is his core criterion. When a work successfully transmits a morally complex feeling—like compassion mixed with horror—it meets the infection criterion but fails the moral test. This does seem internally contradictory: if infection defines art, moral judgments should be separate. The user's concept isn't anachronistic either; Tolstoy acknowledges complex emotions in his own novels even as his theory rejects them. The tension feels inherent.

  Then the user wants resolution paths within Tolstoy's system. Option one: relax the moral criterion to allow "net positive" feelings. But Tolstoy explicitly rejects compromise. Option two: refine infection to require moral unity. That just dodges the problem. Option three: accept the theory as purely normative. This might be strongest—Tolstoy isn't describing art but prescribing what it *should* be. The tension then becomes a feature, not a bug. 

  For sharpening the argument, I should emphasize how Tolstoy's own practice contradicts his theory. His novels thrive on moral complexity, yet his theory condemns similar works. Also, stressing the infection criterion's vulnerability—why include it if moral content overrides it? Avoiding modern theories, the user can leverage Tolstoy's moral absolutism against his infection premise. 

  The user seems well-versed in the text. Their focus on affective dissonance is smart. I should validate their interpretation while pushing them to probe Tolstoy's normative stance harder. Maybe suggest they frame the moral filter as a "Trojan horse" that hollows out infection from within. Historical context matters too—Tolstoy's late-period dogmatism explains why he ignored his own artistic genius. 

  Hmm, the user might also enjoy linking this to Tolstoy's broader philosophical shift. His aesthetic theory mirrors his religious turn: absolute morality over all else. That could deepen the essay without needing external references. But I'll keep it textual unless they ask for extensions.
answer: |-
  Your argument identifies a profound and valid tension in Tolstoy's theory. Here’s a structured analysis addressing your three core questions, along with suggestions for sharpening the argument within Tolstoy’s framework:  

  ### 1. **Accuracy of Your Reading**  
     - **Tolstoy’s Position:** Your reading is fundamentally accurate. Tolstoy explicitly defines art as the "infection" of another’s feeling (*What Is Art?*, Ch. 5) but insists that only feelings promoting "the brotherly union of man" (Ch. 16) constitute *true* art. He dismisses art transmitting "exclusive" feelings (pride, lust, despair) or morally ambiguous states as either "counterfeit" or harmful (e.g., his critique of Wagner, Baudelaire, and even parts of Shakespeare).  
     - **Complex vs. Corrupt Feelings:** Tolstoy **lacks a principled distinction** for complex-but-moral feelings. He operates in binaries: feelings are either "good" (uniting humanity in Christian love) or "bad" (promoting division/sensuality). For instance:  
       - He praises simple peasant art transmitting "joy in life" (Ch. 16) but condemns Michelangelo’s *Last Judgment* for mixing awe with terror (Ch. 10).  
       - He rejects "ambiguous" religious art (e.g., Byzantine icons evoking dread) because fear contradicts pure love.  
     - **Key Evidence:** Tolstoy states that art transmitting "the highest religious feeling" must evoke "love of God and one’s neighbor" *exclusively* (Ch. 16). Any "admixture" of negative emotion (e.g., horror at suffering) renders it non-art.  

  ### 2. **Affective Dissonance as Internal Contradiction**  
     - **Genuine Tension:** Your concept **exposes a core contradiction**:  
       - *Premise 1:* Art’s *essence* is successful infection (a descriptive criterion).  
       - *Premise 2:* Art’s *value* requires moral utility (a normative criterion).  
       Tolstoy conflates these, demanding that only *good* infections qualify as "art." This creates a category crisis for works that infect successfully with complex feelings (e.g., Dostoevsky’s empathy for sinners, Goya’s horror/pity at war).  
     - **Anachronism?** The concept **is not anachronistic**. Tolstoy acknowledges emotional complexity in his *fiction* (e.g., Pierre’s moral turmoil in *War and Peace*), yet his theory denies its legitimacy in art. He explicitly critiques modernist works (e.g., Symbolist poetry) for transmitting "indistinct" feelings (Ch. 10), proving he encountered such cases but rejected them on moral grounds.  
     - **Contradiction Strengthened:** Tolstoy’s infection criterion is **psychologically inclusive** (all transmissible feelings qualify), but his moral filter is **theologically exclusive** (only feelings furthering Christian brotherhood count). Affective dissonance reveals this fault line.  

  ### 3. **Resolving the Tension Within Tolstoy’s Framework**  
     Tolstoy’s commitments offer no easy resolution, but three paths exist:  
     - **Relax the Moral Criterion (Problematic):** Allow "net-positive" infections (e.g., compassion outweighing horror). *But* Tolstoy’s absolutism rejects compromise: feelings are "infectious" or not, "good" or "bad" (Ch. 15). He would view mixed feelings as inherently corrupting.  
     - **Refine Infection (Implausible):** Argue that dissonant feelings "fail" to infect fully. *But* Tolstoy admits some complex works *do* infect (e.g., Greek tragedies, which he condemns as "bad" art).  
     - **Accept Normativity (Strongest Resolution):** Concede Tolstoy’s theory is **prescriptive, not descriptive**. He redefines "art" to mean *only* "moral infection," rendering non-moral infections "counterfeit" by fiat. The tension then arises from his rhetorical sleight-of-hand: using "infection" as a neutral mechanism while covertly moralizing it.  
       - **His Escape Hatch:** Tolstoy separates "universal" art (moral) from "class" art (elitist/complex). Affective dissonance belongs to the latter—infected but illegitimate.  

  ---

  ### Suggestions for Sharpening Your Argument  
  1. **Leverage Tolstoy’s Own Exclusions:**  
     - Contrast his praise for simple folk tales (unambiguous joy) with his dismissal of the *Odyssey* (admiration for cunning = "bad" feeling). Emphasize that *both* infect, but moral gatekeeping overrides the infection criterion.  

  2. **Use His Infection Language Against Him:**  
     - Argue that if "infection" is the *sine qua non* of art, then moral evaluation should apply *after* classifying a work as art (e.g., "good art" vs. "bad art"). By making morality definitional, Tolstoy renders "infection" redundant.  

  3. **Expose the Theological Hijacking:**  
     - Highlight how Tolstoy’s late-stage religious dogmatism (e.g., *The Kingdom of God Is Within You*) subverts his earlier aesthetic insights. His moral filter is extrinsic to art’s mechanism—it’s a doctrinal imposition.  

  4. **Contrast Theory with Practice:**  
     - Note that Tolstoy’s *own* novels (e.g., Ivan Ilyich’s despair/grace) thrive on affective dissonance. His theory cannot accommodate his genius, revealing its artificial constraints.  

  5. **Resolve via Normative Admission:**  
     - Conclude that the tension is irreconcilable *unless* we read Tolstoy as a moralist, not an aesthetic theorist. His "art" is a vehicle for utopian ethics, not a category for analyzing cultural production.  

  ---  
  **Final Thought:** Your affective dissonance challenge is devastating to Tolstoy’s system because it exploits his core criterion (infection) to force an admission: either art includes morally complex transmissions, or his theory is a circular tautology ("true art is moral infection"). Press this dilemma ruthlessly—it is the crux of your essay’s power.
