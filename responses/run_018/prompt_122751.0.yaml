prompt: |-
  Hi there. I'm a journalist — I mostly cover science and ideas, but I've spent the last year or so doing a run of peices on anti-corruption, and I keep stumbling into the same shape of story and I don't have a word for it, which is becoming a problem because I'd like to use the word in print without a footnote saying "sort of like Goodhart's law."

  Three instances. A city hospital bans staff from accepting gifts from suppliers: within a year the gifts are gone from the ledger, and the doctors' relatives have started turning up as paid "consultants" to the same suppliers. A country introduces competitive exams for government hiring to kill off patronage: applications and test scores go up and up, and the ministries respond by moving work onto short-term consultancy contracts that never go through the exam. A transparency rule requires that allocative decisions be justified in an open meeting: the meetings get beautifully documented, and the real decision now gets made in the corridor beforehand, so the minutes record a ratification nobody disagreed with.

  The pattern I think I'm seeing: the reform targets a channel, the favouritism doesn't shrink so much as relocate — and it relocates to a channel nobody was previously measuring, which is exactly why the reform looks like it worked on every indicator anyone collects. So there are two things tangled together, the displacement itself and the fact that the displacement is invisible to the very metrics that were supposed to certify success.

  Is there an established concept or literature for this? I've heard corruption described as being like water, finding whatever crack is open, and I know about measures becoming targets when they're used for decisions, but neither seems to be quite it: the first is a metaphor rather than a claim with edges, and the second is about people gaming a number, whereas here the underlying thing — who actually gets the job, the contract, the bed — may not have improved at all while nobody is gaming anything. There's also ordinary circumvention: every tax code breeds avoidance, and I don't want a term so broad it covers that too.

  If there's no name, I'd rather have a good carve than a label. What exactly is this, and what isn't it? I want to know how to tell it apart from genuine reduction that just leaves messy residue, from a reform that was cosmetic from day one, and from the sort of adaptive rule-dodging that any prohibition produces. And I'd want the boundary cases sorted: does it count when the new channel leaves people better off than the old one did (a gift ban that pushes procurement toward open tendering is different from one that pushes it toward cousins), or does the concept only apply when the substance is unchanged and only the surface has been cleaned? Also, a practical worry for the piece: if the target is unobservable and the proxy improves, is there any principled way to say whether the balloon was squeezed or deflated, or is that just permanently underdetermined?
reasoning: |-
  Okay, let me start by unpacking the journalist's query. They're describing a pattern in anti-corruption reforms where measures target a specific channel of corruption, but instead of eliminating it, the favoritism just moves to a new, unmonitored channel. The key problem is that the metrics used to measure success don't capture this displacement, making the reform appear effective when it's not. 

  First, I need to recall related concepts. Goodhart's Law comes to mind—when a measure becomes a target, it ceases to be a good measure. But the journalist mentioned it's not exactly that. In these cases, the measure isn't being gamed directly; instead, the corruption relocates to an unmeasured area. 

  Then there's the hydraulics metaphor—corruption flowing like water to new cracks. But they want something more precise. Regulatory displacement sounds close, but I should check if it's used in corruption literature. Maybe "perverse adaptation" or "corruption migration" are terms that fit better. 

  The key elements here are: displacement of the activity and the invisibility to metrics. The journalist also wants to distinguish this from mere circumvention or cosmetic changes. For instance, when a gift ban leads to relatives becoming consultants, that's a structural shift, not just dodging rules. 

  Looking at boundary cases: If the new channel is less harmful, like shifting to open tendering instead of cronyism, does it still count? The concept might focus on unchanged substance beneath a cleaned surface. The practical challenge is determining if the reform actually reduced corruption or just moved it, especially when the real outcome is unobservable. 

  I should also consider institutional isomorphism—organizations maintaining informal practices while changing formally. But that might be too academic. The most fitting terms seem to be either "corruption displacement" or "ritualistic isomorphism," emphasizing the decoupling of formal compliance from actual practices. 

  The journalist needs a term that's precise enough for print without a lengthy explanation. They also need ways to differentiate this from effective reforms with residual issues. For example, genuine reduction might have some leftover problems but overall improvement, whereas displacement shows no real change. 

  Practical advice: Look for metrics that capture outcomes rather than processes, or use qualitative methods to detect informal channels. Case studies where reforms failed due to displacement could strengthen their argument. Highlighting the decoupling of formal and informal systems would clarify the concept.
answer: |-
  Based on your description, you're hitting upon a profound and well-documented phenomenon in governance, regulation, and anti-corruption work. While no single term is universally perfect, here's a breakdown of established concepts, potential labels, and boundaries:

  **Core Concepts & Potential Labels:**

  1.  **Institutional Decoupling / Ritualistic Isomorphism:** (Strongest conceptual fit)
      *   **Description:** From organizational sociology (DiMaggio & Powell, Meyer & Rowan). Organizations respond to external pressures (e.g., anti-corruption reforms) by adopting *formal structures and procedures* that signal compliance (e.g., gift bans, exams, minutes), while *decoupling* these from actual *informal practices* and core activities (e.g., favoritism via relatives, consultancies, corridor talks). The "ritual" satisfies the metric, but the underlying behavior continues unchanged elsewhere.
      *   **Why it fits:** Directly addresses the gap between formal compliance (measured) and substantive outcome (unmeasured). It explains *why* the relocation happens – to maintain legitimacy while preserving informal power structures. The "invisibility" arises because the metrics track the ritual, not the substance.

  2.  **Corruption Displacement / Regulatory Displacement:** (Most intuitive journalistic term)
      *   **Description:** Analogous to crime displacement. When pressure is applied to one specific *method* or *channel* of corrupt activity, the activity doesn't vanish but shifts to a different, less monitored or regulated channel. The key is the *shift in form*, not necessarily a reduction.
      *   **Why it fits:** Captures the "water finding cracks" metaphor but gives it analytical teeth by linking it to specific regulatory pressure and the exploitation of measurement gaps. "Regulatory Displacement" emphasizes the reform's role in causing the shift.

  3.  **Perverse Adaptation / Strategic Adaptation:** (Highlights agency)
      *   **Description:** Actors within the system deliberately and strategically adapt their behavior to circumvent the *intent* (but not necessarily the letter) of a new rule or measurement system, exploiting its blind spots. This isn't mindless evasion; it's calculated relocation.
      *   **Why it fits:** Emphasizes the active, intelligent response by those benefiting from the old system to preserve their advantage, moving to where the light isn't shining.

  4.  **Indicator Illusion / Metric Myopia:** (Focuses on the measurement failure)
      *   **Description:** The reform creates a false sense of success because the chosen indicators improve, but these indicators are poor proxies for the *actual target outcome* (reduced favoritism/improved fairness/efficiency). Success is measured by the wrong thing.
      *   **Why it fits:** Directly addresses your core frustration – the reform "works" on paper because the metrics are gamed *by design* (through displacement), not because the underlying problem is solved.

  **Carving Out the Concept & Boundaries:**

  *   **What it IS:**
      *   A **dynamic response** to a specific reform targeting a *particular manifestation* of a problem.
      *   **Relocation**, not just reduction or cosmetic change. The core activity (favoritism) persists in a new form.
      *   **Exploitation of measurement gaps.** The new channel thrives *because* it's not captured by the metrics established to monitor the reform's success.
      *   **Systemic.** It reflects how actors within a system navigate and subvert formal constraints using informal networks and loopholes.
      *   **Focus on substance vs. form.** The *substance* (who benefits) remains unchanged, only the *form* (how they benefit) adapts.

  *   **What it ISN'T (Distinguishing Features):**
      *   **Genuine Reduction with Messy Residue:** Here, the *overall level* of the problem decreases significantly, even if some stubborn pockets remain. Displacement implies the *level* hasn't decreased; it's just moved. If the gift ban *mostly* eliminated supplier influence but some small-scale cronyism persists in consulting, that's residue. If *all* the influence just shifted wholesale to consulting, that's displacement.
      *   **Cosmetic Reform from Day One:** A reform designed *only* to create the appearance of change (e.g., publishing minutes everyone knows are fake *immediately*). Displacement implies the reform had *some* genuine constraining power on the *old* channel, forcing adaptation. The corridor meetings only became necessary *because* the open meeting rule constrained the old way of deciding openly.
      *   **Simple Rule-Dodging/Avoidance:** While related, avoidance (like tax avoidance) often exploits technicalities *within* the system being regulated. Displacement involves *leaving* the regulated channel entirely for a *different* channel outside its scope. Dodging the gift rule by taking smaller gifts is avoidance. Moving the benefit stream to a relative's consultancy is displacement to a *different* regulatory domain (employment/contracting).
      *   **Goodhart's Law (Pure Metric Gaming):** Goodhart's is about distorting behavior *around the metric itself* (e.g., teaching to the test). Here, the *metric itself isn't necessarily gamed* – the gift ledger *is* clean, test scores *do* rise, minutes *are* detailed. The problem is that the metric measures the wrong thing (compliance with the *procedure*, not the *outcome*). The underlying activity simply moved outside the metric's view. Gaming would be falsifying the ledger or test scores.

  **Boundary Cases:**

  1.  **"Better" Displacement (e.g., gift ban -> open tendering):**
      *   This is **qualitatively different** and arguably **not** displacement in the problematic sense you describe. If the *substance improves* (more competition, better value), even if triggered by closing an old channel, it's a **positive reform outcome**, not just relocation of favoritism. The key is whether the *mechanism of allocation* becomes more meritocratic/competitive/transparent *in substance*. Moving from nepotism to competitive tendering is progress, even if some residual favoritism tries (and fails) to influence bids. This is displacement *towards a better system*. Your concept focuses on displacement *that preserves the underlying unfairness*.

  2.  **Substance Unchanged, Surface Cleaned:**
      *   This is the **core case** for your concept. The power structure, beneficiaries, and unfairness remain identical. Only the *paper trail* changes to comply with the new formal rule, masking the persistent reality. The corridor decision ratified in the open meeting is the archetype.

  **The Practical Worry (Squeezed vs. Deflated):**

  This is the hardest part. Distinguishing genuine reduction from clever displacement when the core outcome is hard to observe is inherently challenging, but not entirely hopeless:

  1.  **Look for Anomalies & Qualitative Signals:**
      *   **Unexplained Shifts:** Sudden proliferation of "consultants," relatives in supplier firms, surge in non-exam-hired contract work *coinciding* with the reform.
      *   **Whistleblowers & Leaks:** Insider accounts remain crucial.
      *   **Outcome Mismatch:** Do the "improved" metrics (clean ledgers, high scores, detailed minutes) actually correlate with expected *substantive improvements* (e.g., lower costs, better service delivery, more diverse hiring, public trust)? If not, why?
      *   **Persistence of Complaints:** If stakeholders (patients, citizens, businesses) still complain bitterly about unfairness *despite* the reform's "success," it's a red flag.

  2.  **Design Reforms to Monitor Outcomes, Not Just Process Compliance:**
      *   **Track the Ultimate Goal:** Instead of *only* measuring "gifts recorded," measure procurement costs, supplier diversity, or patient outcomes relative to budget. Instead of *only* tracking exam pass rates, track the *proportion of core work done by non-exam-hired staff* and their qualifications/connections. Instead of *only* documenting minutes, assess decision quality or public perception of fairness through surveys.
      *   **Audit for Decoupling:** Actively look for evidence that formal processes are disconnected from real decisions (e.g., interviewing participants about how decisions *actually* get made).

  3.  **Accept Probabilistic Assessment:** Often, you won't have definitive proof. A pattern of consistent displacement across similar reforms, combined with qualitative evidence and mismatched outcomes, builds a strong *inference* that the balloon was squeezed, not deflated. Journalistically, you can present this evidence and frame it as the "displacement effect" or "ritual compliance."

  **Recommendation for Print:**

  *   **"Institutional Decoupling" or "Ritualistic Compliance"** is the most precise academic term.
  *   **"Corruption Displacement" or "Regulatory Displacement"** is likely the most accessible and impactful for journalistic use, especially paired with a brief explanation: *"...a phenomenon where anti-corruption measures, by closing one visible channel for favoritism, simply displace it into new, less monitored avenues – creating an illusion of success on paper while the underlying unfairness persists."*
  *   **"Perverse Adaptation"** is also strong and highlights agency.

  Your instinct is spot-on. This isn't just water finding cracks or gaming a number; it's a systemic response where formal compliance masks persistent informal power structures, exploiting the inherent limitations of the metrics chosen to measure reform success. Good luck with the piece – it's tackling a crucial and under-discussed dynamic!
