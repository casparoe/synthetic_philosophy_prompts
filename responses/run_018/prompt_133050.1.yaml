  i dont want the standard survey though. if you had to advise someone with like three years and some philosophy background but no phd, which open questions in this area are actually worth prioritizing? im especially curious about motivational overdetermination — when your action is driven by both good and selfish motives — and whether that cancels moral worth or just dilutes it. also how this plays out in group settings where everyones motives are mixed, and whether acidental good outcomes from bad motives should change our evaluation.

  please rank the main lines of work or unresolved implications, defend the ordering with actual reasoning — whats upstream, whats tractable without a huge grant, whats a dead end — and tell me which ones would genuinely change how we think about the others if they got answered. and please write this in american english. no bibliographies or reading lists, i just want your reasoning. also keep it casual, like we’re talking, and dont mind the typo or two i probably left in here.
