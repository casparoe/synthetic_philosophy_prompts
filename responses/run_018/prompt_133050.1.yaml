  Hmm... their three pain points are:
  1) Does mixed motivation destroy moral worth? 
  2) How do group dynamics complicate this? 
  3) Should accidental good outcomes redeem bad motives?

  Prioritizing these: The mixed motives question feels most urgent because it's paralyzing their volunteering. If we solve that, the collective action dilemma becomes clearer. Moral luck is downstream—if motivation matters less, outcomes matter more.

  For approach: Kant's purity obsession won't help here. Modern virtue ethics (Hurka, Slote) handles messy motives better. And the collective angle needs Appiah/Jamieson's work on imperfect duty. Gotta keep it conversational though—no jargon dumps. 

  Biggest trap to avoid: Letting them think this is purely academic. Their guilt is real. The answer must help them show up at the shelter tomorrow. So practical takeaways: 
  - Mixed motives are human 
