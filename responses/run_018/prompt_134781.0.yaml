prompt: |-
  I'm trying to plan a session for my architecht colleague — smart, but philosophy-illiterate — on inside view vs outside view and why epistemic modesty isn't just averaging the two. Don't explain the concept to me; map the teaching plan instead. What dependancy order keeps her from thinking outside view just means "ignore context," what single carrying case should involve her own professional judgement plus hard base-rate data she can't dismiss, which misconceptions she'll hit (outside view = cynicism, modesty = splitting the difference) and exactly where in the sequence to defuse each, the check at the end that proves she grasps the recursive twist — applying the outside view to your own reasoning is itself an inside-view move — and what I should openly skip at this level. Format the response as exactly five numbered points, each a sentence or two, with no intro or conclusion.
reasoning: |-
  Hmm, the user is asking for a teaching plan on inside vs outside view concepts for an architect colleague who's smart but not familiar with philosophy. They want a structured sequence to prevent common misunderstandings, not an explanation of the concepts themselves. I need to map out a session plan with specific dependencies, examples, and misconception handling.

  The architect's background is key here - she deals with projects involving unique designs and constraints, but also has access to industry data like cost overruns or schedule delays. This makes architecture a perfect case study because it blends subjective judgment with objective metrics. I should anchor the outside view in hard base rates she can't dismiss, like construction data, to show it's not about ignoring context.

  Common misconceptions I need to address: that outside view equals cynicism (it's actually about evidence), and that epistemic modesty means averaging views (instead it's about recognizing limits). The recursive twist—that applying the outside view to your own reasoning is itself an inside-view move—is crucial for true understanding and should be the capstone.

  For the sequence, I'll start concrete with an architectural example to hook her interest, then define terms after she's engaged. The core exercise must force her to use both views on a real professional judgment - perhaps estimating project timelines where her experience clashes with industry averages. Defusing "outside view = cynicism" should happen immediately when presenting base rates, while "modesty = averaging" gets tackled during the exercise debrief.

  I'll openly skip Kahneman-Tversky research and Bayesian math to keep it accessible. The endpoint is that recursion check: can she see that choosing when to use outside view is itself an inside-view decision? That proves she gets the dynamic interplay beyond simple averaging.

  The user's phrasing suggests they're deeply familiar with the concepts but need pedagogical scaffolding - they even specify the exact number of points and forbid intros/conclusions. I'll match that precision with five tightly packed steps covering dependency order, case design, misconception timing, recursion test, and deliberate omissions.
answer: |-
  1. Start with her concrete professional experience: Have her assess a realistic architectural project challenge (e.g., estimating cost overrun risk for a unique cultural center) solely using her deep, contextual knowledge and intuition (pure Inside View), explicitly highlighting the specific factors she's weighing.  
  2. Immediately contrast this by introducing hard, relevant base-rate data she *cannot* reasonably ignore (e.g., industry-wide statistics on cost overruns for similar *types* of cultural projects, regardless of specific context), framing this as the Outside View—defusing "ignore context" by showing it *is* the context of broader reality, not cynicism.  
  3. Design a specific exercise where her Inside View judgment *conflicts* with the Outside View data (e.g., her optimistic timeline vs. base-rate delays); force her to reconcile them *without* simply averaging, revealing the misconception that modesty = splitting the difference by emphasizing it's recognizing the *limits* of her Inside View and the *value* of the base rate.  
  4. Conclude with a meta-discussion: Ask her *when* an architect should prioritize the Outside View over their Inside View in planning; reveal the recursive twist as she realizes her *choice* of which view to trust (or how to weight them) is itself an inherently subjective Inside View judgment.  
  5. Openly skip formal decision theory, Kahneman-Tversky experiments, and Bayesian calculations; focus solely on the practical distinction, the danger of Inside View overconfidence, and the disciplined *use* of base rates within her professional frame.
