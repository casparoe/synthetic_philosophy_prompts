  - **No** → Go to Level 2B  

  ---

  #### **Level 2A: Q2 (Requirement for 'Could Have Done Otherwise')**  
  *"For responsibility, must you have had a physically open path to vote differently (e.g., no external blockers), or is it enough that nothing externally forced your decision?"*  
  - **Requires physically open path** → Go to Level 3A  
  - **Enough that decision wasn’t forced** → Go to Level 3B  

  #### **Level 2B: Q2 (Same as Above)**  
  *"For responsibility, must you have had a physically open path to vote differently, or is it enough that nothing externally forced your decision?"*  
  - **Requires physically open path** → Go to Level 3C  
  - **Enough that decision wasn’t forced** → Go to Level 3D  

  ---

  #### **Level 3A: Q3 (Identification with the Desire)**  
  *"If you deeply wanted to vote this way (it felt authentic and ‘you’), does the chip’s presence still matter for responsibility?"*  
  - **Yes, chip matters** → **Leaf 1: Flicker Defense**  
    - *Responsibility?* **YES**  
    - *Why?* Alternative possibilities existed (e.g., you could have *started* to vote differently before chip intervened).  
  - **No, chip doesn’t matter** → **Leaf 2: [Empty]**  
