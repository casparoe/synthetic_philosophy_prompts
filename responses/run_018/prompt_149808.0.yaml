  ### **Decision Tree: Frankfurt Voting Case**
  *(Scenario: Neuroscientist implanted a dormant chip that could force your vote. She never activates it. You vote exactly as you wanted. Are you responsible?)*

  #### **Level 1: Q1 (Presence of the Chip & Modal Facts)**  
