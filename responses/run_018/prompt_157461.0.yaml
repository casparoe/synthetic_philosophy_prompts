  ### 1. The Joke (185 words)
  Alistair adjusted the brass dials on the Thermal Ethics Meter, its central gauge flickering. "Right, Bethany, classic dilemma: Librarian in the burning archive. Save the *Codex Aeternum*, sole copy, irreplaceable repository of pre-Columbian cosmology... or dash across that frozen river to save a stranger who just fell through the ice. The Meter quantifies true moral urgency as thermal signature. Let's see..."

  He fed the scenario: Librarian chooses the river rescue. The Meter's needle rocketed, hitting the red zone labeled "SCALDING." Steam hissed faintly from a vent.

  "Expected," nodded Alistair. "Direct bodily peril! Obvious imperative."

  "Now," said Bethany, "run it with her choosing the *Codex*." Alistair recalibrated. The needle plummeted past "TEPID" and "CHILLED," settling deep into the blue at "ABSOLUTE ZERO." The gauge frosted over.

  "Ha!" Alistair exclaimed. "Proof! The Meter validates immediate suffering over abstract cultural loss!"

  Bethany peered at the frosted glass. "Or... it validates proximity to shivering flesh and cracking ice. The fire is *off-stage*, Alistair. The river rescue has wet clothes, visible breath, the *sound* of splashing. The Meter isn't measuring ethics; it's measuring how vividly you narrated the hypothermia."

  ### 2. Commentary (95 words)
  The "Thermal Ethics Meter" intuition pump translates the perceived *salience* of suffering into temperature: vivid, immediate bodily harm reads as high heat; abstract, distant, or non-bodily harm reads as extreme cold. This pump **amplifies** sensorily rich details (shivering, ice, proximity) and **suppresses** abstract considerations (long-term cultural loss, uniqueness, non-physical value). The punchline exposes this directional bias: the Meter reacts not to the moral *weight* of saving knowledge versus a life, but to the *narrative framing* that makes one scenario sensorily overwhelming and the other emotionally distant. It reveals the pump's mechanics, not the dilemma's resolution.
