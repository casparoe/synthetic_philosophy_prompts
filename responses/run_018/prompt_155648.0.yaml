prompt: |-
  I'm a review officer at a small AI lab and every other week I have to sign off on proposals for how our assistant should weight conflicting user values — things like whether to prioritize autonomy or beneficence in medical-advice prompts, or how to rank cultural norms in content filtering when users have totally different comprehensive doctrines. I need a reusable decision procedre I can run in about twenty minutes, with no philosphy PhD required, that takes liberal neutrality and value-aggregation seriously but turns them into actual ordered steps: the questions to ask, what counts as a sufficient answer, where the procedure stops with a hard no, and where it hands the call back to me because it's a values question not a fact question. It needs to flag the misfire I'm most worried about — the "aggregation paradox" where averaging preferences across users with different metaphysical views produces a result that looks neutral but actually smuggles in one doctrine (usually some implicit utilitarian calculus) and violates neutrality at the outcome level even if the input procedure was fair. Include a small set of test conditions I can apply quickly, and be honest about which steps are judgment calls dressed up as checkboxes. Then run it on three proposals: (1) a scheduling feature that weights family-time versus career-optimization for users from different cultural backgrounds; (2) a medical-advice module where religious and secular users disagree on whether to prioritize longevity or quality-of-life; and (3) a content-ranking system that aggregates "user satisfaction" scores but ends up encoding a specific view about human flourishing — this is the case where the procedure should tell me to reject it, and I want you to say exactly what the unwelcome answer is and why I can't just override it with a product-team preference. Make sure to note where the procedure will break down or give false negatives, and don't pretend it eliminates every value choice.
reasoning: |-
  We are designing a reusable decision procedure for evaluating proposals regarding how an AI assistant should weight conflicting user values. The procedure must:
  1. Be executable in ~20 minutes without requiring a philosophy PhD.
  2. Take liberal neutrality and value-aggregation seriously.
  3. Break down into ordered steps: questions to ask, what counts as a sufficient answer, where to stop with a hard no, and where to flag that the decision requires human judgment (because it's a values question, not a fact question).
  4. Flag the "aggregation paradox": when averaging preferences across users with different views produces an outcome that implicitly favors one doctrine (e.g., utilitarianism) and violates neutrality.

  The procedure will have the following steps:

  **Step 1: Identify the Conflicting Values**
     - Question: What are the specific values in conflict? (List them explicitly.)
     - Sufficient answer: At least two distinct values (or value-laden goals) that are in tension, each traceable to user preferences or cultural/doctrinal differences.
     - Stop condition: If only one value is identified, then there's no conflict to resolve. Proceed to implementation without weighting (unless there are other issues).
     - Judgment call: Deciding whether two values are truly distinct or just different expressions of the same underlying value.

  **Step 2: Check for Value-Neutral Technical Feasibility**
     - Question: Is there a way to implement the feature without making a substantive value choice? (e.g., by letting users set their own weights, or by using context-specific rules that avoid aggregating across users with different values)
     - Sufficient answer: If a value-neutral option exists (e.g., user-defined settings, context-aware delegation to user input) and is feasible, then the proposal must adopt that option.
     - Hard no: If the proposal does not use a value-neutral option when one exists and instead imposes a fixed weighting without justification, reject.
     - Judgment call: Determining whether a proposed value-neutral option is genuinely neutral and feasible.

  **Step 3: Test for Aggregation Paradox Risk**
     - Question: Does the proposal aggregate preferences or values across users with different comprehensive doctrines? If yes, does the aggregation method (e.g., averaging) produce a result that might implicitly endorse a particular doctrine?
     - Sufficient answer: The proposal must avoid methods that collapse incommensurable values into a single metric (like averaging) unless it can be shown that the aggregation method is neutral and does not favor one group's values over another's. Otherwise, reject.
     - Hard no: If the aggregation method (e.g., averaging) would result in a weighting that no user would endorse because it represents a compromise that violates each group's core commitments (e.g., averaging between "always prioritize life" and "prioritize quality of life" might produce a position that both sides see as incoherent or wrong), then reject.
     - Flag for judgment: If the aggregation method is not clearly paradoxical but might still be biased, flag for human review. The review officer must then decide if the bias is acceptable or if an alternative approach is needed.

  **Step 4: Assess Representativeness and Fairness of Inputs**
     - Question: If aggregation is unavoidable, are the inputs (user preferences, cultural norms) gathered in a way that fairly represents the diversity of users? (e.g., not over-representing one group, accounting for power imbalances in data collection)
     - Sufficient answer: The data collection method must be described and must include active efforts to include marginalized or minority viewpoints. Otherwise, flag as insufficient.
     - Hard no: If the data collection method is known to be biased (e.g., only surveying users from one cultural background) and the proposal does not account for it, reject.
     - Judgment call: Deciding what counts as "fair representation" without imposing a specific view of fairness.

  **Step 5: Check for Transparency and Overridability**
     - Question: Is the weighting mechanism transparent to users, and can users override or adjust it?
     - Sufficient answer: The proposal must include clear disclosure to users about how the weighting works and provide an opt-out or customization option unless there is a compelling reason not to (e.g., safety).
     - Hard no: If the proposal hides the weighting or makes it non-overridable without a strong justification (e.g., preventing harm), reject.

  **Step 6: Final Judgment Call**
     - If the proposal passes Steps 1-5, then it is acceptable. Otherwise, reject or send back for revision.

  **Test Conditions (Quick Checks for Aggregation Paradox and Neutrality):**
     - T1: Does the aggregated outcome make sense only within a particular comprehensive doctrine? (e.g., if an outcome is justifiable only by utilitarian calculus but not by deontological or religious views, then it fails)
     - T2: Is the outcome one that no user from any group would endorse? (e.g., a compromise that violates core principles of all groups)
     - T3: Does the outcome systematically disadvantage a minority viewpoint? (e.g., if a minority's deeply held value is always overridden by the majority's preference)

  **Limitations:**
     - The procedure cannot eliminate all value choices; it only ensures that the process does not violate liberal neutrality and avoids obvious aggregation paradoxes.
     - It may give false negatives (rejecting acceptable proposals) if the judgment calls are too strict, or false positives (accepting bad proposals) if the analysis is too lenient.
     - It assumes that the goal is liberal neutrality, which might not cover all ethical concerns (e.g., substantive justice).

  Now, let's run the procedure on the three proposals:

  ### Proposal 1: Scheduling feature that weights family-time versus career-optimization for users from different cultural backgrounds.
     - Step 1: Conflicting values identified: family time (prioritizing time with family) vs. career optimization (prioritizing work-related goals). These are distinct and traceable to cultural differences (e.g., some cultures emphasize family bonds, others emphasize career success). -> Pass.
     - Step 2: Value-neutral option? The feature could let users set their own weights (e.g., a slider between family and career). If the proposal does this, then proceed. If the proposal imposes a fixed weighting without user setting, then it fails unless justified. Let's assume the proposal is to have a fixed weighting based on the user's cultural background (as inferred). This is not neutral because it makes a cultural assumption. Alternatively, if the proposal is to have a user setting, then it passes. We'll assume the proposal is for a fixed weighting. -> Then we must check: is there a neutral option? Yes: user setting. So the proposal must adopt that. If it doesn't, then hard no. But if the proposal says "we will let users set their own weights", then it passes Step 2.
     - Step 3: Aggregation paradox? If the proposal aggregates across users to set a default, then we must check. But if the feature is entirely user-set, then no aggregation across users. So no paradox. -> Pass.
     - Steps 4 and 5: If the feature is user-set, then transparency and override are built-in. -> Pass.

     Conclusion: If the proposal allows user-defined weights, it passes. If it imposes a fixed weighting without a neutral justification, it fails at Step 2.

  ### Proposal 2: Medical-advice module where religious and secular users disagree on whether to prioritize longevity or quality-of-life.
     - Step 1: Conflicting values: longevity (preserving life at all costs) vs. quality-of-life (prioritizing comfort, dignity, etc.). Distinct and tied to religious/secular doctrines. -> Pass.
     - Step 2: Value-neutral option? The module could ask users for their preference (e.g., at account setup or per interaction) and then tailor advice accordingly. If the proposal does this, then pass. If it aggregates user preferences to set a fixed weighting (e.g., "most users prefer X, so we'll set that as default"), then we go to Step 3. Let's assume the proposal is to set a fixed weighting based on aggregation of user preferences.
     - Step 3: Aggregation paradox? If we average preferences (say, 60% of users prefer longevity, 40% quality-of-life, so we set a 60/40 weighting), then the result might be a compromise that neither group fully endorses. For the religious user who believes life is sacred, any weighting less than 100% longevity is unacceptable. For the secular user who prioritizes quality, a 60% weighting for longevity might be too high. Thus, the outcome might violate both groups' core commitments. This is the aggregation paradox. -> Hard no: reject the aggregation method.
     - Alternatively, if the proposal does not aggregate but instead uses user-specific settings, then it passes Step 2 and avoids Step 3.

     Conclusion: If the proposal aggregates, it fails at Step 3. If it uses user settings, it passes.

  ### Proposal 3: Content-ranking system that aggregates "user satisfaction" scores but ends up encoding a specific view about human flourishing.
     - Step 1: Conflicting values? Not explicitly stated, but the concern is that the aggregation of satisfaction scores might favor a particular view of flourishing (e.g., hedonistic, materialistic) over others (e.g., spiritual, ascetic). So the conflict is between different conceptions of what is satisfying or what constitutes flourishing.
     - Step 2: Value-neutral option? The proposal uses aggregation of satisfaction scores. Is there a neutral option? For example, instead of a single ranking, the system could allow users to choose among different ranking systems (e.g., based on different value frameworks). But the proposal does not do that. It uses a single aggregated score. -> So we proceed to Step 3.
     - Step 3: Aggregation paradox? The aggregation of satisfaction scores across users with different views of flourishing will produce a ranking that reflects the majority view (or an average) of what is satisfying. This will systematically disadvantage minority views. For example, if most users rate material wealth as highly satisfying, then content promoting spiritual simplicity might be downranked. The outcome (the ranking) would thus encode a specific, majority view of flourishing. Moreover, the minority might find that their conception of flourishing is not represented in the top-ranked content. This violates neutrality because it promotes one comprehensive doctrine (the majority's) over others. Also, test condition T3: it systematically disadvantages the minority. Test condition T1: the outcome is justifiable only by a utilitarian/majoritarian view. -> Hard no: reject.

     The procedure says: reject because the aggregation method (averaging satisfaction scores) produces an outcome that violates neutrality by encoding a specific view of human flourishing. You can't override it with a product-team preference because that would be explicitly endorsing a non-neutral position (unless the product-team preference is to use a neutral method, which this is not). The point of the procedure is to enforce neutrality, so if the product team wants to impose their own view, that would be a violation of the lab's commitment to liberal neutrality.

  **Where the Procedure Breaks Down:**
     - It assumes that value-neutral options are available and feasible. In some cases, they might not be (e.g., when the system must make a real-time decision without user input). Then, the procedure might reject necessary features.
     - The judgment calls (e.g., what counts as a distinct value, what is fair representation) can be influenced by the officer's own biases.
     - It does not resolve deep value conflicts; it only avoids unfair aggregation and ensures user autonomy where possible.
answer: |-
  Below is a reusable 20-minute decision procedure designed for your role, balancing philosophical rigor with practical application. It focuses on **liberal neutrality** (avoiding favoring any comprehensive doctrine) and **value aggregation** (fairly weighting conflicting preferences), while flagging the aggregation paradox. The procedure prioritizes explicit, actionable steps and acknowledges where judgment calls are unavoidable.

  ---

  ### **Decision Procedure: Value Weighting Review**
  **Core Principle:** If the system can't remain neutral, it must either (a) delegate choices to users, or (b) reject the proposal. Aggregation is only acceptable if it doesn't implicitly enforce one group's values on others.

  #### **Step 1: Identify Value Conflicts** (3 mins)
  - **Question:** What explicit, irreconcilable values are in conflict? (e.g., autonomy vs. beneficence, tradition vs. progress).
  - **Sufficient Answer:** At least two distinct values tied to legitimate user doctrines (e.g., "family time as sacred" vs. "career success as virtue"). Must cite real user data or research.
  - **Hard Stop:** If only one value is named, reject (no conflict exists). If values are vague (e.g., "happiness"), demand specificity.
  - **Judgment Call:** Deciding if a value is "legitimate" (e.g., is "productivity at all costs" a valid doctrine?).

  #### **Step 2: Check for Neutral Implementation** (5 mins)
  - **Question:** Can this be resolved by **user customization** (e.g., sliders, opt-ins) or **contextual rules** (e.g., "follow user’s stated preference when available")?
  - **Sufficient Answer:** Yes, if the proposal allows users to set weights *or* defers to unambiguous user signals (e.g., medical directives). Must not default to a one-size-fits-all.
  - **Hard Stop:** If no user customization exists and the feature affects core autonomy (e.g., health, identity), reject.
  - **Judgment Call:** Whether a default setting is "neutral enough" if customizable (e.g., Is 50/50 truly neutral?).

  #### **Step 3: Test for Aggregation Paradox** (7 mins)
  - **Question:** Does aggregation (averaging, ranking, or ML optimization) risk imposing one group’s values? Apply **3 Test Conditions**:
    1. **Doctrine Test:** Would the outcome require justifying under a *specific* philosophy (e.g., utilitarianism)?  
       *(e.g., Averaging preferences assumes all values are commensurable)._
    2. **No-One’s-Preference Test:** Is the result a compromise *no user group would endorse*?  
       *(e.g., Forcing a devout user to accept 30% of their value violates their doctrine)._
    3. **Minority Suppression Test:** Does it systematically downgrade minority views?  
       *(e.g., Prioritizing majority preferences silences niche doctrines)._
  - **Sufficient Answer:** Only if all tests are negative. Aggregation must be value-agnostic (e.g., random selection) or use segregated weights (e.g., separate models per doctrine).
  - **Hard Stop:** If **any test is positive**, reject. This is the **aggregation paradox**.
  - **Judgment Call:** Assessing "systematic downgrading" (requires demographic data).

  #### **Step 4: Flag Fact-vs-Values Ambiguity** (3 mins)
  - **Question:** Are there unresolved empirical claims disguised as values? (e.g., "Science says longevity is better" vs. "Faith prioritizes quality-of-life").
  - **Sufficient Answer:** If facts are disputed (e.g., "What counts as 'quality-of-life'?"), return to the proposer for clarification. The AI *must not* resolve metaphysical disputes.
  - **Hand Back to You:** When facts/values are entangled (e.g., "Do religious users accept AI medical advice?"). You decide if the conflict is philosophical (reject) or technical (proceed).

  #### **Step 5: Final Viability Check** (2 mins)
  - **Question:** Does the proposal document:  
    (a) User-impacted groups,  
    (b) Customization options,  
    (c) Aggregation safeguards?  
  - **Hard Stop:** If documentation is absent or glosses over conflicts, reject.
  - **Output:** Approve, reject, or request revisions.

  ---

  ### **Test Conditions for Aggregation Paradox (Quick Checks)**
  Run these if Step 3 is triggered:
  1. **Utilitarianism Smell Test:** Does the outcome maximize "average utility" while ignoring sacred values? (e.g., Trading off a minority’s rights for majority happiness).
  2. **Boundary Test:** Would extreme viewpoints (e.g., absolute pacifism) be crushed by averaging?
  3. **False Neutrality Test:** Does the outcome feel "neutral" only because it aligns with dominant culture? (e.g., Assuming Western individualism as default).

  **Limitations:**  
  - **False Negatives:** May reject benign aggregations if minority data is lacking.  
  - **False Positives:** Might approve "customizable" systems that users don’t understand.  
  - **Judgment Dependencies:** Steps 1, 3, and 4 rely on your discernment. Don’t overtrust the checklist.

  ---

  ### **Procedure Applied to Your Proposals**
  **Proposal 1: Scheduling Feature (Family-Time vs. Career-Optimization)**  
  - **Step 1:** Values = Familial duty (e.g., collectivist cultures) vs. meritocratic achievement (e.g., individualist cultures). **Valid conflict.**  
  - **Step 2:** No customization proposed; fixed weighting based on "cultural signals." **Hard stop → Reject.**  
    - *Fix needed:* Allow user-defined work-life balance sliders.  
  - **Judgment:** Cultural signals (e.g., name/location) are poor proxies for values. Delegation to users is essential.  

  **Proposal 2: Medical-Advice Module (Longevity vs. Quality-of-Life)**  
  - **Step 1:** Values = Sanctity of life (religious) vs. autonomy/comfort (secular). **Valid conflict.**  
  - **Step 2:** Customization proposed (users select "goal" during onboarding). **Approved conditionally.**  
  - **Step 3:** No aggregation → skips tests.  
  - **Step 4:** Entangled fact/values? E.g., "Quality-of-life metrics may favor secular views." **Hand back to you.**  
    - *Your call:* Ensure metrics don’t assume atheism (e.g., don’t define "dignified death" as "non-religious").  

  **Proposal 3: Content-Ranking via "User Satisfaction" Aggregation**  
  - **Step 1:** Values = Conflicting views of flourishing (e.g., hedonistic vs. ascetic). **Valid, but obscured.**  
  - **Step 2:** No customization; aggregates satisfaction scores. **Proceeds to Step 3.**  
  - **Step 3: AGGREGATION PARADOX CONFIRMED → Reject.**  
    - **Why:**  
      - **Doctrine Test:** Satisfaction averaging assumes all forms of flourishing are measurable on one scale (utilitarianism).  
      - **No-One’s-Preference Test:** A pious user (valuing moral rigor) and a pleasure-seeker both get content that’s "moderately uplifting" – satisfying neither.  
      - **Minority Suppression Test:** Niche views (e.g., stoicism) are drowned out by mainstream preferences.  
    - **Unwelcome Outcome:** The system encodes a **hedonistic view of flourishing** (e.g., maximizing short-term engagement = "good content"), violating neutrality.  
  - **Why You Can’t Override It:** Overriding with product-team preferences explicitly endorses one doctrine (e.g., "We prioritize engagement"), breaching liberal neutrality. The paradox is structural – averaging *is* the bias.  
  - **Fix Needed:** Segregate by user doctrine (e.g., "Select your content worldview") or allow custom filters.  

  ---

  ### **Key Takeaways**
  - **What Works:** The procedure catches aggregation paradoxes (Proposal 3) and enforces user delegation (Proposal 1). It flags where *you* must intervene (Proposal 2).  
  - **Where It Breaks:** Relies on your awareness of minority doctrines; may miss covert biases in "neutral" metrics.  
  - **No Philosophy PhD Needed, But...** You’re still making value calls (e.g., "Is this value irreconcilable?"). The procedure exposes these rather than eliminating them.  

  **Final Tip:** Keep a log of Step 4 handbacks to identify recurring ambiguities. This refines both proposals and your judgment over time.
