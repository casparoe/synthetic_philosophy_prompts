answer: |-
  ### **Simulation: Xenobio Taxonomists**  
  **Objective:** Experience the tension between intuitive (surface) groupings and projectible (joint-carving) groupings by predicting traits of fictional organisms. Team Surface groups by visible traits; Team Joint groups by hidden causal properties. Team Joint wins on accuracy but faces counterintuitive groupings, while Team Surface makes intuitive groupings that lead to prediction errors.

  ---

  ### **Materials**  
  - **32 Organism Cards** (see layout below)  
  - **Scoreboard** (whiteboard or paper)  
  - **Timer**  
  - **Pens & paper** for teams to record taxonomies and predictions  

  ---

  ### **Card Layout**  
  Each card includes:  
  - **Organism ID** (e.g., X-7)  
  - **Visible Traits** (4 traits, e.g., "Spikes: Yes", "Glow: Blue", "Limbs: 6", "Hibernates: No")  
  - **Hidden Causal Property** (Letter: A, B, C, D)  
  - **Hidden Traits** (3 traits, e.g., "Diet: Metal", "Reproduction: Binary Fission", "Toxin: Hemolytic")  

  *Example Card:*  
  ```
  Organism: X-7  
  Visible: Spikes=Yes, Glow=Blue, Limbs=6, Hibernates=No  
  Hidden Property: B  
  Hidden: Diet=Metal, Reproduction=Binary Fission, Toxin=Hemolytic  
  ```

  ---

  ### **Setup**  
  1. **Create 4 Hidden Causal Groups (A, B, C, D)**:  
     - Each group shares a unique **hidden causal property** determining all 3 hidden traits.  
     - Design traits so surface similarities don't align with causal groups (e.g., spiked organisms may belong to different causal groups).  

  2. **Organism Distribution**:  
     - **Training Set (16 cards)**: Teams study these to build taxonomies.  
     - **Prediction Set (16 cards)**: Only visible traits are shown; hidden traits are concealed.  

  3. **Team Instructions**:  
     - **Team Surface**: Group organisms by **visible traits** (e.g., "Spiked things" or "Blue-glowing things"). Record group definitions.  
     - **Team Joint**: Group organisms by **hidden causal property** (letters provided on their training cards). Record group definitions and hidden traits.  

  ---

  ### **Rules & Timeline** (75 minutes total)  
  1. **Introduction & Setup (5 min)**:  
     - Explain the debate: "Do sciences carve nature at its joints? Surface groups feel intuitive but may not support induction; joint groups are projectible but violate common sense."  
     - Split class into two teams (7 each). Distribute training sets.  

  2. **Taxonomy Building (15 min)**:  
     - Teams create taxonomies using their method.  
     - **Team Surface**: Define 3-4 groups based on visible traits.  
     - **Team Joint**: Define 4 groups (A, B, C, D) and note their hidden traits.  

  3. **Prediction Phase (30 min)**:  
     - Reveal prediction organisms **one at a time** (only visible traits).  
     - For each organism, teams:  
       - Assign it to a group.  
       - Predict all 3 hidden traits based on the group’s "typical" traits (Surface) or fixed traits (Joint).  
     - *Timer: 2 min per organism.*  

  4. **Scoring (10 min)**:  
     - After all predictions, reveal hidden traits for each prediction organism.  
     - **Scoring System**:  
       - 1 point per correctly predicted hidden trait (max 3 pts/organism).  
       - **Bonus**: Team Joint scores 1 extra point if they assign to the correct causal group (even if traits are wrong).  

  5. **Debrief (15 min)**:  
     - Compare scores (Team Joint should win).  
     - Discuss tensions:  
       - **Team Surface**: Intuitive groupings, but prediction errors due to non-projectible categories (e.g., "spiked things" may not share causal traits).  
       - **Team Joint**: High accuracy due to causal groupings, but groupings feel "bizarre" (e.g., a spiked rock and a furry mammal in the same group).  
     - **Map to Metaphysics**:  
       - This illustrates **realism vs. conventionalism**: Joint groups capture projectible kinds (like natural kinds in science), while Surface groups reflect human conventions.  
       - **Gruesome Groupings**: Team Joint accepts "gruesome" categories (e.g., "things with causal property B") for predictive power, mirroring how science prioritizes induction over intuition.  
     - **Limitations**:  
       - **Cannot reproduce modal/essentialism**: The game treats hidden properties as static causal markers, not *essences* (e.g., it doesn’t address counterfactuals like "Would this organism still be 'Kind B' in different conditions?").  
       - **Predictable Pitfalls**:  
         - Team Joint may struggle to define rules linking visible traits to causal groups.  
         - Team Surface may overfit groups to training data, missing variability.  
         - First-run balance: If visible traits align too well with causal groups, Surface wins; if not, Joint dominates. Adjust trait distributions next time.  

  ---

  ### **Design Notes for Cards**  
  - **Ensure Team Joint’s Win**:  
    - Hidden traits are **uniform within causal groups** (e.g., all "B" organisms eat metal).  
    - Visible traits **cut across causal groups** (e.g., "spiked" organisms appear in A, B, and C).  
  - **Create Tension**:  
    - **Surface’s Error Trap**: Include organisms with identical visible traits but different causal properties (e.g., two "blue-glowing, spiked" organisms—one is A, one is C—with different diets).  
    - **Joint’s Bizarreness**: Place visually dissimilar organisms in the same causal group (e.g., a glowing jellyfish and a spiked lizard both in Group B).  

  ---

  ### **Example Organism Distribution**  
  - **Causal Group A** (e.g., herbivores that reproduce via spores):  
    - *Training*: 4 organisms (e.g., furry mammal, leafy plant).  
    - *Prediction*: 4 organisms (e.g., a rock-like organism with identical causal traits).  
  - **Causal Group B** (e.g., metal-eaters with binary fission):  
    - *Training*: 4 organisms (e.g., spiked robot, glowing slug).  
    - *Prediction*: 4 organisms (e.g., a feathered bird with metal diet).  

  ---

  ### **Why This Works**  
  - Team Joint faces "gruesome" groupings (e.g., "These 8 unrelated-looking things are all Kind D") but wins by scoring 90–100% on traits.  
  - Team Surface groups intuitively (e.g., "all spiked things") but scores 60–70% due to hidden variability.  
  - **Debrief Focus**: Science’s "joint-carving" requires accepting that projectible categories may defy intuition—a core tension in metaphysics.
