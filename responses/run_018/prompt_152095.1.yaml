  - **Heads**: SB woken Monday (1 awakening).
  - **Tails**: SB woken Monday **and** Tuesday (2 awakenings).
  - Amnestic drug prevents memory of prior awakenings.
  - **Question 1:** Upon waking (no extra info), SB’s credence in heads is?
