  I have no formal background in history or anthropology, but I have spent considerable time with the broad narratives offered by Harari on the Cognitive Revolution, Diamond on geographic determinism and continental inequality, and Graeber and Wengrow on the political flexibility of early societies. In comparing these accounts, I have become preoccupied with what I call “narrative sedimentation”—a structural tendency in grand histories to treat the present as a kind of terminal geological layer that compresses prior contingency into apparent inevitability. I do not claim this is an established technical term; it is my own attempt to name something I see running through these texts. If we take narrative sedimentation seriously as a feature of the form rather than merely a rhetorical habit, what are the most important implications for evaluating Diamond’s argument about geographic luck and Graeber and Wengrow’s argument about seasonal or situational political experimentation? Does this framing weaken one of these grand narratives more severely than the other? Please state how confident you are in each implication you draw, and identify the specific claim about which you feel least certain.
