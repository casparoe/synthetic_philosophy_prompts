answer: |-
  The heterogeneity problem dissolves when we reject the phenomenological criterion and define pleasure structurally as any conscious state that the subject, within its occurrence, experiences as non-instrumentally worth sustaining—where this "worth" manifests not as a unique feeling but as the *absence* of any intrinsic, normative demand to terminate the state itself, even amidst mounting instrumental reasons to end it. Consider the three cases: The diffuse warmth of sunlight intrinsically motivates continuation; one feels no inherent "push" to stop feeling warm merely *as* warmth. The crisp satisfaction from solving a proof similarly sustains attention effortlessly; the solver experiences no internal imperative *against* savoring the achievement for its own sake. Even the sharp pleasure in a rival's failure, phenomenally distinct and morally dubious, shares this structure—the subject, in the moment, registers no *internal* normative pressure *to cease* the satisfaction itself (distinct from guilt about *causing* it); the state presents itself as intrinsically "to-be-continued." Thus, despite radical phenomenal differences, all three states share the essential structural feature: the conscious absence of any felt "should-stop" imperative directed at the state's intrinsic quality, making them unified under the evaluative relation defining pleasure.
