prompt: |-
  I'm a senior analyst for an NGO that advises development banks on whether to freeze funding when a member state starts eroding democratic norms, and we're constantly fighting about whether a specific reform — like putting judges under ministerial oversight or reshuffling election-commission members — actually counts as democratic backsliding, or if we're just using the word as a partisan label for goverments we don't like. I need a reusable decision procedure my team can run in about 45 minutes, with ordered questions, what counts as a sufficient answer to each, clear stop-points where the answer is no, and explicit hand-off points where the issue is values rather than facts. I want it grounded in whatever political science and philosophy actually say about measuring regime change and normative assessment, but translated into plain language so I don't need a PhD to apply it.

  I'm especially stuck on whether we should measure backsliding against each country's own prior institutional baseline — including cases of institutional layering, where old democratic rules stay on paper but get hollowed out by parallel power structures — or against a universal liberal-democratic standard, and how to handle situations like Hungary's court-packing, a US state-level election-administration change, or Turkey's 2017 referendum shifts where the procedure might give an answer my team will hate. Please build the flowchart-in-words, apply it to those three cases, flag exactly where it breaks down and needs human judgment, and be honest about where it will misfire. Also tell me what would change your mind — for instance, if the distinction between procedural and substantive democracy collapses in practice, or if comparative data showed all these indicators just track partisan alignment — and point out where your reasoning is most likely to fail, probably around whether "backsliding" can even be defined without smuggling in liberal-democratic assumptions. Oh, and please don't just recite the usual country lists; I already know them.
reasoning: |-
  Okay, let me unpack this analyst's request. They're a senior NGO advisor wrestling with how to objectively identify democratic backsliding when development banks consider freezing funds. The core tension is between country-specific baselines versus universal standards, and they need a practical tool that doesn't require PhD-level expertise.

  Hmm, their pain points are very specific: they mention Hungary's court-packing, US state-level election changes, and Turkey's 2017 referendum as thorny cases where the analysis might contradict their team's preferences. They're clearly frustrated with subjective labeling and want clear guardrails against bias. The phrase "smuggling in liberal-democratic assumptions" suggests they're acutely aware this is philosophically loaded terrain.

  Right, so the challenge is building a framework that:
  - Separates factual institutional changes from normative judgments
  - Handles both abrupt power grabs (like Turkey's referendum) and gradual hollowing-out (like Hungary)
  - Explicitly flags where political values must drive the final call
  - Survives hard cases where democratic procedures are technically followed but outcomes are autocratic

  I recall Levitsky & Ziblatt's "guardrails of democracy" and Przeworski's institutionalist approach could provide structure. The key insight might be treating democratic quality as multidimensional - electoral, liberal, participatory dimensions can decay at different speeds. For the procedure, sequencing matters: start with observable institutional facts before assessing impact.

  Ah, and they want honesty about failure points. The trickiest will be when leaders exploit legal loopholes (like Orbán's supermajority) or when reforms have plausible deniability ("efficiency improvements"). Also, their team might hate outcomes where backsliding is technically absent despite illiberal outcomes - like certain US election administration changes that stay within state constitutional bounds.

  For the three test cases:
  - Hungary's judicial changes clearly trip multiple thresholds (disproportional impact, erosion of checks)
  - Turkey's referendum shows how "procedural correctness" can mask substantive power grabs
  - A US state case might reveal where the framework says "no backsliding" despite partisan motives, forcing the team to confront their own biases

  The real mind-bender comes when considering if backsliding can be defined neutrally. If comparative data showed these indicators merely reflect Western preferences, the whole framework collapses. But since development banks operate on liberal-democratic mandates... maybe that's unavoidable? Should explicitly note this tension in the "values handoff" section.
answer: |-
  Here's a reusable 45-minute decision procedure grounded in political science (e.g., Levitsky & Ziblatt's "guardrails," Dahl's polyarchy, V-Dem indices) and philosophy (procedural vs. substantive democracy debates), structured as a flowchart-in-words with explicit thresholds, stop-points, and values handoffs. It uses a **dual baseline approach**: first against the country’s prior institutional practice, then against minimal universal democratic standards.  

  ---

  ### **Democratic Backsliding Assessment Protocol (45-min version)**  
  **Core Principle:** Backsliding requires (a) *institutional change* that (b) *reduces constraints on executive power* or *erodes equal political rights*, moving away from prior practice *and* universal norms.  

  #### **Step 1: Institutional Change (10 mins)**  
  *Question:* **Does the reform alter formal rules or de facto practices governing power constraints (judiciary, elections, legislature, media) or equal political rights?**  
  - *Sufficient "Yes":* Documented legal amendment, policy change, or verified shift in practice (e.g., new law subordinating courts; sudden purge of election officials).  
  - *Stop-point (No):* No change → **No backsliding**.  
  - *Values Handoff:* If change is ambiguous (e.g., "efficiency reforms"), proceed but flag for Step 3.  

  #### **Step 2: Deviation from Prior Baseline (15 mins)**  
  *Question:* **Does the change weaken checks/balances or political rights *relative to the country’s own institutional practice over the past 10 years*?**  
  - *Assess using:*  
    - **Impact:** Does it concentrate power (e.g., reduce judicial independence) or restrict opposition access (e.g., gerrymandering)?  
    - **Precedent:** Is it inconsistent with prior norms (e.g., ignoring seniority in judicial appointments)?  
  - *Sufficient "Yes":* Unilateral change bypassing consensus (e.g., court-packing without opposition input); or creates parallel structures (e.g., "loyalist" tribunals overriding existing courts).  
  - *Stop-point (No):* Change aligns with past reforms (e.g., routine election commission rotation) → **No backsliding**.  
  - *Values Handoff:* If historical practice was already flawed (e.g., long-standing electoral bias), proceed to Step 3.  

  #### **Step 3: Deviation from Universal Standards (10 mins)**  
  *Question:* **Does the change violate at least 2 of 4 core liberal-democratic minima?**  
  *(Based on Dahl/V-Dem: (1) Free/fair elections, (2) Equal voting rights, (3) Binding executive constraints, (4) Civil liberties protection)*  
  - *Sufficient "Yes":*  
    - E.g., reform reduces electoral competitiveness (e.g., arbitrary ballot-access rules) *and* weakens judicial review.  
    - *Critical Threshold:* If change targets a specific group (e.g., ethnic minorities’ voting rights), automatic "Yes."  
  - *Stop-point (No):* Change maintains minima (e.g., ministerial oversight *with* judicial appeal) → **No backsliding**.  
  - *Values Handoff:** If "mixed" (e.g., strengthens some rights/weakens others), flag as "contested" for final deliberation.  

  #### **Step 4: Intent & Context (10 mins)**  
  *Question:* **Is there evidence the change aims to entrench incumbents or marginalize opponents?**  
  *(Per Levitsky: "competitive authoritarian" playbook)*  
  - *Assess:*  
    - Timing (e.g., pre-election reforms)  
    - Discursive evidence (e.g., leaders calling judges "enemies")  
    - Disproportionality (e.g., minor fraud risk → major voting restrictions)  
  - *Sufficient "Yes":* 2+ indicators → **Democratic backsliding confirmed**.  
  - *Stop-point (No):* Plausible neutral justification (e.g., anti-corruption court restructuring) → **Not backsliding**.  

  #### **Final Handoff**  
  - **Backsliding identified:** Recommend funding review.  
  - **Inconclusive/contested:** Escalate to ethics committee (values judgment).  
  - **No backsliding:** No action.  

  ---

  ### **Application to Test Cases**  
  **1. Hungary’s Court-Packing (2010s)**  
  - Step 1: **Yes** (mandatory retirement lowered judges’ age).  
  - Step 2: **Yes** (unilateral, broke with appointment traditions).  
  - Step 3: **Yes** (weakened judicial independence *and* equal rights via politicized rulings).  
  - Step 4: **Yes** (timed after election, Fidesz officials cited "removing leftists").  
  - **Verdict:** Backsliding. *Breakdown risk:* None—clear across all steps.  

  **2. US State Election-Administration Change (e.g., GA 2021 SB202)**  
  - Step 1: **Yes** (new rules on ballot drop-boxes, voter ID).  
  - Step 2: **Mixed** (some practices new, others build on prior voter access debates).  
  - Step 3: **Contested** (equal voting rights: ID rules may burden minorities; but countermeasures exist (e.g., extended early voting)).  
  - Step 4: **Values Handoff** (intent debated: "fraud prevention" vs. "voter suppression").  
  - **Verdict:** Inconclusive. *Escalate to ethics committee.* Team may "hate" this if they oppose the law, but protocol avoids partisan assumptions.  

  **3. Turkey’s 2017 Referendum (presidential system)**  
  - Step 1: **Yes** (abolished PM role, concentrated power).  
  - Step 2: **Yes** (broke with 70+ years of parliamentary tradition).  
  - Step 3: **Yes** (eroded executive constraints *and* civil liberties via decree powers).  
  - Step 4: **Yes** (referendum held under emergency rule, opposition suppressed).  
  - **Verdict:** Backsliding. *Breakdown risk:* If team argues "popular mandate," but referendum fairness was contested (OSCE cited irregularities).  

  ---

  ### **Where It Breaks Down**  
  1. **"Hollowing Out" (Institutional Layering):**  
     - E.g., Poland’s "Disciplinary Chamber"—old courts exist but parallel bodies override them.  
     - *Solution:* Step 2 flags "de facto practices"; Step 3 tests binding constraints.  

  2. **Procedural vs. Substantive Democracy:**  
     - E.g., Venezuela’s elections: technically multiparty but incumbents control resources.  
     - *Solution:* Step 3’s "free/fair elections" minimum requires *de facto* competitiveness (opposition can win).  

  3. **Legitimate Reform vs. Backsliding:**  
     - E.g., Rwanda’s anti-sectarianism laws (limit hate speech vs. suppress dissent).  
     - *Failure Point:* Step 4 relies on contextual intent—requires local expertise.  

  ---

  ### **What Would Change My Mind**  
  1. **If procedural/substantive democracy collapses:** If data shows "free elections" consistently coexist with eroded rights (e.g., Singapore), the universal minima (Step 3) may need redefinition.  
  2. **If indicators track partisanship:** If V-Dem/Polity scores correlate with Western-aligned governments, switch to objective thresholds: e.g., "Can incumbents lose power?" (Przeworski’s test).  
  3. **"Backsliding" as a liberal bias:** If development banks adopt a pluralist definition (e.g., "local democratic traditions"), drop Step 3—but this risks excusing autocrats.  

  **Most Likely Failure:** Step 3’s "universal minima" *do* smuggle in liberal-democratic assumptions. In practice, this is unavoidable—development banks’ mandates enshrine these values. The protocol mitigates bias by prioritizing *change* (Step 2) before norms (Step 3).  

  **Output:** A reusable, bias-checked procedure that forces explicit values debates rather than masking them as technical assessments.
