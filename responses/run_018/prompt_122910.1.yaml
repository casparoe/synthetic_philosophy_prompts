prompt: |-
  ok so i'm in this philosophy club at school (it's really just me, my friend Dani, and a teacher who lets us use his classroom at lunch) and we got completely stuck on something for like an hour yesterday and I keep turning it over. Basically: are there ever reasons to *believe* something that aren't evidence? Dani's line is that no — evidence is the only thing that can be a reason for belief, and everything else is a reason to act, or to get yourself into a situation where you'll end up believing, or to lie to yourself, but not a reason to believe. I sort of agree, but my gut verdicts case by case don't all line up with that. Here's what I actually think:

  - A company offers me a million dollars if I genuinely believe their energy drink is the best one. — Not a reason to believe it. Defintely a reason to pretend, and maybe a reason to stand near their ads until I get worn down, but not a reason to believe.
  - If I believe I'm going to make the free throw, I make it more often, and that's *because* I believed it — the confidence is part of what makes the shot go in. — This one feels like it might be a real reason? It isn't evidence about my jump shot, but the belief sort of makes itself true.
  - My friend tells me she didn't cheat on the calc test. The evidence is genuinely ambiguous, but if I don't believe her that's a crappy thing to do to a friend, and part of trusting someone is believing them. — Feels like this counts for something, somehow, even though it isn't evidence either.
  - I'd be much happier if I believed my ex and I were getting back together. — Nope. This one is basically the definition of the wrong kind.
  - The weird one I made up to break my own rule: a demon pays me $1000 if I believe P, and it has *also* arranged things so that P is true whenever I believe it. So believing gets me the money, and the money only shows up in worlds where P is true anyway. — Still feels bogus to me?? Even though the good thing flows right through the truth of the belief.

  So my tentative principle, which Dani says is trash, is something like: a non-evidential consideration is a real reason to believe P only when the good it gets you comes *by way of* P's being true — the benefit has to route through the truth, not just through your having the belief. That says yes to the free throw, no to the energy drink, no to the getting-back-together thing, and yes to the demon case — and my gut says no to the demon case, so either my principle or my gut has to go. It also isn't obvious what it says about the friend case (is the friendship a "good that routes through the truth"? that feels like a stretch, but the verdict still feels right to me). And I don't know whether any of this transfers to attitudes that aren't belief: I have a reason to want to *want* to run the 5k, since wanting it would make training suck less — is that a reason to want it?

  Can you do reflective equilibrium on me, basically. Find the principle (or the two or three candidate principles) that fits my verdicts, give me each clause with the case that forces it, tell me honestly which of my verdicts I'd have to give up and what the cheaper principle that drops one looks like, and then tell me what the best principle says about the case I actually care about and keep going back and forth on: my dad's new business. He really wants me to believe it's going to work, and my believing it seems to (a) make him less stressed so he works better, (b) make me way less annoying to be around, and (c) make me not look too hard at the spreadsheets that suggest it isn't going to work. Is believing that something I have reason to do?

  Format it like this, in this order: "My verdicts, restated" (~120 words), "The principle(s)" (~250 words), "Clause by clause" (~250 words), "What I have to give up" (~200 words), "The dad case, plus one case I haven't thought of" (~150 words), then "Bottom line" in two or three sentences.
reasoning: |-
  Okay, the user is in a philosophy club and they're stuck on whether there are reasons to believe something that aren't evidence. They've provided several cases and their gut reactions to each. Their tentative principle is that a non-evidential reason must have benefits that come by way of P being true, not just through the belief itself. But they're conflicted because their gut says no to the demon case, even though it fits the principle.

  First, I need to restate their verdicts clearly. For the energy drink, they say no—money isn't a reason to believe. Free throw: yes, because belief affects success. Friend's trust: yes, even without evidence. Ex getting back together: no. Demon case: gut says no, but principle says yes. 

  Next, the principles. Their tentative one has issues with the demon case. Alternative principles could be Pragmatic Encroachment (practical stakes affect justification) or Doxastic Involuntarism (belief isn't willed, so only evidence counts). But those might conflict with their yes to free throw and friend cases. 

  Clause by clause: The free throw case requires that belief's effectiveness depends on its truth. The friend case needs the relationship to rely on accurate belief. The demon case forces a choice: either accept it as a reason or reject it. 

  What to give up: The demon case is the sticking point. If they keep their gut, they must drop the principle. If they keep the principle, accept the demon. Alternatively, adjust the principle to require that the belief must cause the benefit *only if true*, which excludes the demon. 

  For the dad's business case: Belief reduces stress and avoids evidence, but doesn't make success more likely. Using the adjusted principle, it's not a reason because benefits don't require the business actually succeeding. A new case: placebo effect where belief aids recovery regardless of truth—here, benefits don't route through truth, so it's a reason only if truth isn't necessary. 

  Bottom line: Adjusting the principle to require belief's effectiveness to depend on truth excludes the demon case and the dad's business isn't justified. Trust in friendship might still fit if accuracy matters.
answer: |-
  ### My Verdicts, Restated
  You reject non-evidential reasons in cases where the benefit is *detached* from truth:  
  - Energy drink ($1M for belief alone): **No reason to believe**.  
  - Ex getting back together (happiness via wishful thinking): **No reason**.  
  - Demon case ($1k for belief, with belief magically making P true): **Gut says no**, though your principle says yes.  
  You accept non-evidential reasons when the benefit *flows through* the truth:  
  - Free throw (belief improves performance): **Yes, reason to believe**.  
  - Friend’s innocence (trust sustains friendship): **Yes, reason to believe**.  

  ---

  ### The Principle(s)
  Your tentative principle ("benefits must route through P’s truth") is **almost right but needs refinement** to exclude the demon case. Two candidate principles emerge:  

  1. **The Truth-Dependent Pragmatism Principle (TDPP)**:  
     A non-evidential consideration is a reason to believe P *only if* the belief’s effectiveness in securing a benefit *causally depends on P actually being true*. If the benefit occurs regardless of P’s truth (or if belief alone manufactures truth), it’s not a valid reason.  

  2. **The Doxastic Involuntarism Principle (DIP)**:  
     Beliefs are involuntary responses to evidence; non-evidential factors (like rewards or consequences) can only be reasons to *act* in ways that might *indirectly influence* belief (e.g., seeking evidence, self-deception). True reasons for belief are exclusively evidential.  

  **TDPP** fits your free throw and friend cases but requires accepting the demon case. **DIP** rejects all non-evidential reasons but forces you to abandon your "yes" to free throws and friendship.  

  ---

  ### Clause by Clause  
  - **Free throw clause (TDPP)**: Belief improves the shot *because* confidence alters your actions, and this causal chain *requires* that your belief is *accurate* (you *can* make the shot). If you were deluded about your skill, belief wouldn’t help → benefit routes through truth.  
  - **Friend clause (TDPP)**: Trust sustains friendship *only if* your belief is *responsive to her actual innocence*. If she cheated, your belief harms the friendship → benefit depends on truth.  
  - **Demon clause (TDPP’s flaw)**: Belief makes P true, so benefit *technically* routes through truth. But your gut rejects this because truth is *manufactured* by belief, not independent. TDPP must be amended: add "P’s truth must be *causally prior* to the benefit."  
  - **Energy drink/Ex clause (TDPP)**: Benefit occurs irrespective of truth → no reason.  

  ---

  ### What I Have to Give Up  
  - **If you keep TDPP + amendment ("truth must be causally prior")**: You *must accept* that the **demon case is not a reason** (truth isn’t prior; belief creates it). This aligns with your gut.  
  - **If you keep DIP**: You *must reject* your "yes" to **free throws and friendship**. Belief-improved shots are reason to *cultivate confidence*, not to believe; trust is reason to *act supportive*, not to believe sans evidence.  
  - **Cheapest fix**: Amend TDPP to exclude cases where belief *causes* truth. This costs only the demon case (which you already reject) and preserves free throws, friendship, and your other verdicts. DIP is cheaper *philosophically* but more expensive *intuitively*, sacrificing two core verdicts.  

  ---

  ### The Dad Case, Plus One New Case  
  **Dad’s business**: Belief reduces his stress (a), improves your attitude (b), and avoids stress from evidence (c).  
  - **TDPP verdict**: **No reason to believe**. Benefits (a–c) don’t require the business *actually succeeding*; they flow from belief alone. If the business fails, your belief arguably *worsens* outcomes (e.g., wasted support). Truth isn’t prior or necessary.  
  - **DIP verdict**: **No reason to believe**, only to *act* supportive.  

  **New case – Placebo belief**: You have a chronic pain condition. Believing a sugar pill is a potent analgesic reduces pain *via neural placebo effects*, regardless of the pill’s efficacy.  
  - **TDPP verdict**: **No reason to believe** (benefit occurs irrespective of the pill’s actual properties).  
  - **Your gut?** If placebo works *even when you know it’s fake*, belief isn’t needed → reason to *take the pill*, not believe.  

  ---

  ### Bottom Line  
  **Amended TDPP** ("benefits must depend on P’s *independent* truth") best fits your verdicts: it rejects energy drinks, exes, demons, and dad’s business, but accepts free throws and friendship. For your dad, you lack a reason to *believe*—but have strong reasons to *support him optimistically* while scrutinizing evidence. Belief isn’t a tool; it’s a map of reality.
