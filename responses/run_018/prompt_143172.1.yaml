prompt: |-
  I'm in this comparative ethics seminar and we've been going deep on how German folk morality treats rule-following and social order—Ordnung—as almost a moral duty in itself, while American folk morality tends to treat individual conscience as the final court of appeal, even if that means breaking rules you think are unjust. We read a bunch of comparative sociology stuff but honestly I'm more interested in whether there's actually a philosophical winner here, not just cultural description. Anyway, I'm helping design the mock final for our course and I want an essay question that doesn't let students just summarize stereotypes.

  Could you write me a 90-minute exam prompt for upper-level undergrads, worth 20 marks, that asks them to defend either the rule-following/order framework or the individual-conscience framework? The scenario should be specific: a civil servant in a land-use bureacracy finds out that enforcing a technically legal zoning ordinance will displace a long-standing community, but refusing means violating clear procedural norms. They need to argue which framework has the better of it, but they must specifically address the idea of institutional memory—how consistent enforcement preserves collective knowledge about how the system works—versus the risk that American-style conscientious refusal is just moral credentialing that makes the individual feel righteous without actually changing the system. They should also say something about which kind of moral failure is worse: a bad outcome that followed correct procedure, or a good outcome reached by breaking institutional rules.

  I also need a model answer and a marking scheme with five must-hit points, the marks for each adding up to 20, and a quick line on how students usually mess up each point. Please don't ask for citations or a reading list—this needs to work for someone who hasn't done outside research and can only use course reasoning. I spelled bureacracy wrong there but you get the idea.
