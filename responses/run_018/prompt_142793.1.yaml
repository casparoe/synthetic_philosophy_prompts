answer: |-
  Based on the examples and your need to crack Mr. Chen's code, here's a breakdown of his likely system and how Prester John fits:

  **Mr. Chen's Probable System: Relationship to Evidence & Narrative Function**

  His categories seem defined by **how the core claim/narrative relates to historical evidence and its primary cultural purpose.** It's not *just* evidence, or *just* purpose, but the *intersection*:

  1.  **Legend with Bones:**
      *   **Evidence:** **Physical evidence (archaeology, artifacts) confirms a core element (usually setting/time)**, but key narrative details remain unverified or mythical.
      *   **Narrative Function:** Often a foundational myth or epic story tied to a specific place/culture. The "bones" ground it in reality, but the "legend" is the unprovable story built on top.
      *   **Example:** Troy (city) found ("bones"), but the Trojan Horse and specific 10-year siege are unverified "legend".

  2.  **Back-Projected History:**
      *   **Evidence:** **A small, plausible historical kernel exists**, but the elaborate narrative surrounding it is **later invention projected backwards** onto that kernel. The narrative serves contemporary needs, not historical accuracy.
      *   **Narrative Function:** To provide legitimacy, inspiration, or a glorious past for a later group/political entity by attaching it to an earlier, possibly obscure, figure/event.
      *   **Example:** A possible warlord "Arturus" ("kernel"), onto which medieval writers projected ideals of chivalry, the Round Table, etc. ("back-projected" narrative).

  3.  **Identity-Event:**
      *   **Evidence:** **Minimal or no contemporary external evidence for the *specific event***. Evidence is primarily **internal (tradition, scripture) and its power lies in its acceptance by the group**.
      *   **Narrative Function:** **Fundamental to the core identity, origin story, and self-understanding of a people or religious group.** Its "truth" is experiential/communal, not necessarily verifiable externally.
      *   **Example:** The Exodus – central to Jewish identity, foundational story. Lack of Egyptian records doesn't negate its profound "reality" *for* the Jewish people.

  4.  **Cross-Cultural Myth:**
      *   **Evidence:** **No definitive evidence for the core figure/event as described.** The story exists in **different, often competing, cultural traditions** with no neutral verification.
      *   **Narrative Function:** To explain connections (trade, religion, origins), claim prestige, or assert superiority over another culture by appropriating a shared figure/story. It bridges or defines cultural boundaries through contested narrative.
      *   **Example:** Queen of Sheba claimed by both Ethiopia and Israel, each with their own traditions. No independent proof of her existence *or* specific visit as described in either tradition.

  **Where Prester John Fits: Back-Projected History**

  *   **The Kernel:** There *were* Nestorian Christian communities in Central Asia. There *was* a powerful Central Asian ruler, Yelü Dashi (founder of the Qara Khitai). European travelers *did* encounter these.
  *   **The Projection:** Medieval Europeans, desperate for allies against Islam during the Crusades and fascinated by the East, took these kernels and **projected onto them** the elaborate fantasy of a mighty Christian king (Prester John) ruling a vast, wealthy, utopian kingdom. They filled in details based on their hopes, fears, and limited knowledge (monstrous races, rivers of gold, etc.).
  *   **The Function:** It served a contemporary European need – hope for a powerful ally, validation of Christianity's global reach, and a sense of wonder/exploration. It wasn't primarily about accurately recording Yelü Dashi or the Nestorians.

  **Why Not the Others?**

  *   **Legend with Bones?** No physical "bones" (like Troy) were found *for Prester John himself or his specific kingdom*. The evidence is historical records about *other* things (Nestorians, Yelü Dashi) that were misinterpreted/embellished.
  *   **Identity-Event?** While the *idea* of Prester John became part of medieval European identity (exploration, Christendom), the *specific figure/kingdom* wasn't foundational to their core origin or religious identity like the Exodus is for Jews. It was more a hopeful story than a defining identity pillar.
  *   **Cross-Cultural Myth?** While Europeans heard rumors from the East, Prester John was primarily a *European* construct projected *onto* the East. There wasn't really an *equivalent competing narrative claiming Prester John* from the Central Asian perspective as a core part of *their* identity/myth. The Kerait or Nestorians didn't call *themselves* "Prester John's kingdom" in the way Ethiopians claim the Queen of Sheba.

  **Testing the System with Your Proposed Cases:**

  1.  **Emperor Jimmu & the Sun Goddess (Amaterasu):**
      *   **Likely Category:** **Identity-Event.**
      *   **Why?** The narrative of divine descent is fundamental to the traditional origin story and legitimacy of the Japanese imperial line and national identity. While likely incorporating older myths and possibly a historical kernel of early unification/conquest, the *specific divine narrative* lacks external verification and its power lies in its acceptance and role within Japanese tradition. No "bones" for the divine descent, not really "back-projected" from a known historical Jimmu (he's the mythical starting point), and while it connects to Shinto belief, it's not primarily a story *shared and contested* with another specific culture like Sheba.

  2.  **Hanno the Navigator:**
      *   **Likely Category:** **Legend with Bones.**
      *   **Why?** There is a core text (The Periplus) describing the voyage. Archaeological evidence (Carthaginian artifacts/trade goods along the West African coast) provides "bones" confirming that Carthaginians *did* engage in significant West African exploration/trade around that time. The *specific details* of the voyage (e.g., encountering gorillas described as "hairy people", exact locations like the "Horn of the West") might be exaggerated, misunderstood, or legendary embellishments built upon the core verified activity.

  **The Key to Your Essay:**

  Don't just label Prester John. **Explain *why* it fits "Back-Projected History" using Mr. Chen's (inferred) criteria:**

  1.  **Identify the Kernel:** Briefly state the plausible historical elements (Nestorians in Asia, Yelü Dashi).
  2.  **Describe the Projection:** Explain the elaborate European legend built on top of these kernels.
  3.  **Explain the Function:** Connect it to the contemporary needs of medieval Europeans (Crusades, desire for allies, sense of Christian world order).
  4.  **Contrast (Briefly):** Explain why it *isn't* the other categories, especially "Legend with Bones" (no physical Prester John evidence) or "Identity-Event" (not foundational identity, more wish-fulfillment).

  By demonstrating you understand the *system* – how each category defines the relationship between evidence, narrative, and function – you'll show Mr. Chen you've cracked his code, regardless of whether Prester John gets the exact label he intended. Good luck!
