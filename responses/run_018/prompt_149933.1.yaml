  For the check of understanding, I'm considering posing a modified Laplace's demon scenario: "If a demon uses an O(n!) algorithm to track particles, does universe-scale n make prediction impossible even if n=10^23 is technically computable?" This directly tests if they grasp feasibility versus computability.

