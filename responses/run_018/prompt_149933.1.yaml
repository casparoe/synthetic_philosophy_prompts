  The tone must respect their intellect while avoiding condescension. Phrases like "as you'll recall from..." establish peer rapport. The simplex example's defense against alternatives: TSP would require explaining NP-completeness, while primality testing lacks the stark contrast between theory/practice that simplex provides.

