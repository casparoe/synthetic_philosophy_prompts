prompt: |-
  You are a professional philosopher of science specializing in social ontology and explanatory reduction. Before answering, spend a few minutes brainstorming the conceptual terrain around emergence, reduction, and institutional explanation; then think carefully and step by step about what makes one philosophical problem upstream of another.

  Most discussions of methodological individualism versus holism rehearse familiar cases—market prices, voting patterns, language conventions. I want to examine a less charted corner: the problem of asymmetric explanatory reduction in institutional path dependence. By this I mean situations in which a social-level regularity—such as a regulatory regime’s self-reinforcing trajectory—appears to constrain individual choices in ways that resist full reconstruction from individual-level counterfactuals, even though the regime is ontologically composed entirely of those individuals and their relations.

  Given that framing, which open conceptual lines of work deserve the most attention and effort right now? Specifically, evaluate and rank the following three:

  (i) Whether downward-causation claims in institutional contexts can be formalized without reifying social entities;
  (ii) How to distinguish genuinely non-redundant social explanations from explanations that are merely computationally intractable at the individual level;
  (iii) Whether methodological individualism can be reformulated to accommodate structural emergence if emergence is defined purely in terms of explanatory intractability rather than ontological novelty.

  Please rank them first to third, and defend the ordering with explicit criteria—importance, tractability for philosophers rather than empirical researchers, and upstream or downstream dependency on the others. For each, explain what kind of conceptual progress over the next few years would cause you to revise its place in the ranking. Be direct about trade-offs: if tractability conflicts with importance, say which should win and why.

  If the framing of asymmetric explanatory reduction is confused—if it merely restates the standard problem of macro-level correlation without micro-level reconstruction—say so plainly and do not proceed with the ranking. Do not provide bibliographies, reading lists, or citations.

  State your final defended agenda in a fixed, machine-readable form: the very last line of your response should read exactly

  Verdict: [a one-sentence summary of your ranking and the core reasoning behind it].
