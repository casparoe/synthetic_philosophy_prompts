  Conceptually, there's a deeper issue about perturbation families. Their account relies on specifying "relevant" perturbations, but what counts as relevant? If we define perturbations narrowly to salvage a failing isomorphism, that risks circularity. Defenders might call this merely awkward, but it exposes a dependency on prior mechanistic assumptions - which their view claims to supersede.

