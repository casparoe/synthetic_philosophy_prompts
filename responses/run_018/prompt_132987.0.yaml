  ### Deliberately Unoccupied Combination
  **Stance:**  
  *Immediate removal of street names for peripheral wrongs + unconditional retention of statues for central wrongs.*  

  **Diagnosis of Instability:**  
  This stance inverts intuitive ethical weightings by treating toponyms (practical infrastructure with weak honorific intent) as more urgently harmful than statues (explicit, immutable tributes). It demands high-disruption action for minor biographical flaws (street renaming) while accepting explicit, unmodified honors for figures celebrated *for* their central wrongs (statues). The asymmetry between navigational utility and honorific intent is ignored: streets derive harm from implied endorsement, which is peripheral, while statues embody direct veneration of central wrongs. The position is therefore self-refuting, as it prioritizes symbolic purity in low-impact contexts (street names) over high-impact moral hazards (statues).
