answer: |-
  ### Diagnostic Taxonomy Tree for Municipal Ethics Committee

  **Tree Structure with Four Successive Splits:**

  1. **Root Question (Split 1):**  
     Is the marker primarily an aesthetic honorific (e.g., statue) or practical reference infrastructure (e.g., street name)?  
     - *Branch A: Aesthetic Honorific (Statue)*  
     - *Branch B: Practical Reference Infrastructure (Street Name)*  

  2. **Second Split (for both branches):**  
     Is the wrong associated with the figure central to the commemorated achievement (inseparable from the legacy) or peripheral (unrelated to the cited contribution)?  
     - *Branch A1: Central Wrong (Statue)*  
     - *Branch A2: Peripheral Wrong (Statue)*  
     - *Branch B1: Central Wrong (Street)*  
     - *Branch B2: Peripheral Wrong (Street)*  

  3. **Third Split (for all branches):**  
     Does retaining the marker in its original form, without physical alteration, produce a distinctive dignitary harm that contextual measures (e.g., plaques, counter-commemorative installations, educational framing) cannot adequately remedy?  
     - *Branches A1, A2, B1, B2 each split:*  
       - **Yes:** Contextual measures inadequate → Removal stance  
       - **No:** Contextual measures adequate → Retention stance  
     - *Resulting 8 branches:*  
       - A1Y, A1N, A2Y, A2N, B1Y, B1N, B2Y, B2N  

  4. **Fourth Split (for all branches):**  
     Does the position weigh present-day symbolic exclusion of affected citizens more heavily, or future historical/navigational continuity more heavily?  
     - *All 8 branches split:*  
       - **Present:** Prioritize symbolic inclusion  
       - **Future:** Prioritize continuity  
     - *Resulting 16 branches (leaves)*  

  ---

  ### Leaf Classification (8 Leaves after Collapsing Indistinguishable Positions)
  *(Note: Leaves with identical practical outcomes—due to marker-type symmetry in reasoning—are collapsed into 8 leaves. Indistinguishable pairs flagged below.)*

  1. **Leaf: Honorific removal for central wrongs, weighing inclusion**  
     - **Compound Label:** Statue removal for central wrongs, weighing present exclusion  
     - **Awkward Commitment:** Argues that even profound historical achievements must be erased if morally tainted, regardless of educational value.  
     - **Debate Status:** Actively defended (e.g., "take them down" movements).  

  2. **Leaf: Honorific retention with contextualization for central wrongs, weighing continuity**  
     - **Compound Label:** Statue retention with contextualization for central wrongs, weighing future continuity  
     - **Awkward Commitment:** Maintains that deeply harmful acts intrinsic to a legacy can be "balanced" by explanatory text alone.  
     - **Debate Status:** Actively defended (e.g., preservationist groups).  

  3. **Leaf: Honorific removal for peripheral wrongs, weighing inclusion**  
     - **Compound Label:** Statue removal for peripheral wrongs, weighing present exclusion  
     - **Awkward Commitment:** Demands removal of tributes for unrelated personal flaws, treating all misconduct as equally disqualifying.  
     - **Debate Status:** Currently unnamed but coherent.  

  4. **Leaf: Honorific retention with contextualization for peripheral wrongs, weighing continuity**  
     - **Compound Label:** Statue retention with contextualization for peripheral wrongs, weighing future continuity  
     - **Awkward Commitment:** Accepts adding criticism to monuments of figures whose celebrated deeds are unrelated to their misdeeds.  
     - **Debate Status:** Actively defended (e.g., nuanced conservatism).  

  5. **Leaf: Toponymic removal for central wrongs, weighing inclusion**  
     - **Compound Label:** Street removal for central wrongs, weighing present exclusion  
     - **Awkward Commitment:** Willingly disrupts navigation/address systems for figures whose harms define their fame, dismissing continuity costs.  
     - **Debate Status:** Actively defended (e.g., anti-colonial activists).  

  6. **Leaf: Toponymic retention with contextualization for central wrongs, weighing continuity**  
     - **Compound Label:** Street retention with contextualization for central wrongs, weighing future continuity  
     - **Awkward Commitment:** Tolerates navigational infrastructure honoring core moral failures if supplemented by street-side plaques.  
     - **Debate Status:** Currently unnamed but coherent.  

  7. **Leaf: Toponymic removal for peripheral wrongs, weighing inclusion**  
     - **Compound Label:** Street removal for peripheral wrongs, weighing present exclusion  
     - **Awkward Commitment:** Renames streets for minor biographical flaws despite high civic disruption and no honorific intent.  
     - **Debate Status:** Apparently incoherent with sibling branches (see diagnosis below).  

  8. **Leaf: Toponymic retention with contextualization for peripheral wrongs, weighing continuity**  
     - **Compound Label:** Street retention with contextualization for peripheral wrongs, weighing future continuity  
     - **Awkward Commitment:** Advocates keeping names tied to unrelated wrongs solely to avoid updating maps, denying any endorsement.  
     - **Debate Status:** Actively defended (e.g., municipal pragmatists).  

  ---

  ### Flagged Indistinguishable Leaf Pairs
  - **A1Y-Present (Statue) and B1Y-Present (Street):**  
    Both advocate removal for central wrongs due to unmitigable dignitary harm, weighing inclusion. Collapsed into **Leaf 1 (Statue)** and **Leaf 5 (Street)**. Distinction preserved due to functional asymmetry (honorific vs. infrastructural).  
