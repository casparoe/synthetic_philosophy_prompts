  We are going to break down the arguments step by step.

  Background:
  - SSA (Self-Sampling Assumption): You should reason as if you are randomly selected from the set of all observers in your reference class (which might be, for example, all humans, or all conscious beings). This leads to updating only by the size of the reference class in a given world, but without taking the existence of the reference class itself as evidence for the size of the world.
  - SIA (Self-Indication Assumption): The idea that your own existence is evidence for the existence of other observers. Therefore, you should assign a prior probability to a world proportional to the number of observers in it (or in your reference class). This leads to updating in favor of worlds with more observers.

  The scenario: 
  Two worlds: "big" with 10^20 observers and "small" with 10^10 observers. The cosmological prior (before any consideration of observers) is assumed to be equal for both worlds.

  Alice (pro-SIA) argues:
  - Using SIA, the big world should be weighted by an additional factor of 10^10 (10^20 / 10^10) because your existence is more likely in a world with more observers.

  Bob (pro-SSA) argues:
  - SIA is vulnerable to the "presumptuous philosopher" problem: without any evidence, you are favoring a world with a huge number of observers just because it has more observers. SSA avoids this by conditioning on being in a reference class and then updating on the size of that class only within a world (so you don't update on the total population of the world based on your existence).

  Alice's counter:
  - Even with SSA, if you condition on being in a reference class (like "people who have read Anthropic Bias"), and if the size of that reference class varies across worlds, then you are effectively updating on the size of the world because the reference class size is tied to the world size. Therefore, the distinction between SSA and SIA blurs.

  Bob's counter:
  - Alice is playing "reference-class tennis" (choosing reference classes arbitrarily to get desired results). He points out that if she applies SSA consistently (with a fixed reference class, say all humans) then she gets the Doomsday argument (which she rejects). The Doomsday argument uses SSA to reason that if there are going to be many future humans, it is unlikely that you would be born early in the history of humanity. Hence, it concludes that humanity is likely to end soon.

  Alice's hybrid rule:
  - First, sample a world according to the cosmological prior (which might be flat over worlds, or perhaps flat over some other base variable).
  - Then, sample an observer uniformly at random from the observers in that world.

  She claims this avoids presumptuousness because the update for the big world comes from the prior (if the prior is flat over observer counts, then the big world is more likely a priori) and not from the fact that you exist.

