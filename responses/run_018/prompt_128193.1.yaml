answer: |-
  Below is the decision tree for moral responsibility based on Strawson's framework, structured as a branching taxonomy. The tree sorts positions by substantive commitments rather than labels, with nodes designed to be answerable without philosophical expertise. Internal nodes use concrete cases and distinctions, including non-obvious scenarios (e.g., algorithmic harm, collective entities). Leaves include named positions, hybrids, and notes on unoccupied space. The scoring key maps answer patterns to leaves.

  ---

  ### **Moral Responsibility Decision Tree**  
  **Root Node**:  
  *Q1: "When someone commits a harmful act fully determined by prior causes (e.g., upbringing, genetics), is it ever appropriate to feel resentment toward them? And does appropriateness depend ONLY on whether expressing resentment serves a social function (e.g., deterrence)?"*  
  - **A**: Yes, appropriate, but **NOT** solely for social-functional reasons.  
  - **B**: Yes, appropriate, **ONLY** for social-functional reasons.  
  - **C**: No, **NEVER** appropriate (determinism undermines resentment).  

  ---

  #### **Branch from A**  
  *Q2: "Do reactive attitudes (e.g., resentment) require the target to have rational capacities (e.g., understanding moral reasons, self-control) to be appropriate?"*  
  - **Yes** → *Proceed to Q3*.  
  - **No** → *Proceed to Q6*.  

  *Q3 (for "Yes" to Q2): "Can resentment be appropriately directed at a collective entity (e.g., a corporation) for harm caused by its systemic practices, even if no single employee intended the harm?"*  
  - **Yes** → *Proceed to Q4*.  
  - **No** → *Proceed to Q5*.  

  *Q4 (for "Yes" to Q3): "Is it appropriate to resent an individual software engineer who designed a widely deployed, harmful algorithm (e.g., biased hiring tool), if they followed standard industry practices and had no malicious intent?"*  
  - **Yes** → **Leaf 2a: Rationalist Compatibilism** (reasons-responsive capacities justify resentment toward individuals in systemic cases; determinism compatible).  
  - **No** → **Leaf 2b: Rationalist Compatibilism** (reasons-responsive capacities justify resentment only toward collectives/roles in systemic cases; individuals exempt).  

  *Q5 (for "No" to Q3): "Is it appropriate to resent the engineer from Q4?"*  
  - **Yes** → **Leaf 2c: Rationalist Compatibilism** (reasons-responsive capacities justify resentment toward individuals if harm was avoidable; determinism compatible).  
  - **No** → **Leaf 2d: Rationalist Compatibilism** (reasons-responsive capacities exempt individuals in systemic/unavoidable harm; determinism compatible).  

  *Q6 (for "No" to Q2): "Can resentment be appropriately directed at sub-personal mechanisms (e.g., 'my anxiety made me lie') rather than the whole person?"*  
  - **Yes** → **Leaf H1: Sub-Personal Targeting Hybrid** (reactive attitudes apply to psychological subsystems; determinism irrelevant; capacities unnecessary).  
  - **No** → **Leaf H2: Role-Functional Hybrid** (reactive attitudes apply only to social roles/functions, not persons; determinism irrelevant).  

  ---

  #### **Branch from B**  
  *Q7: "When we exempt someone from resentment (e.g., due to severe mental illness), is this because of an objective failure of rational capacities (e.g., inability to comprehend harm), or a socially negotiated boundary (e.g., cultural norms)?"*  
  - **Objective** → **Leaf H3: Strawsonian with Objective Exemptions** (exemptions track capacities, but reactive attitudes are fundamentally social practices; determinism irrelevant).  
  - **Social** → **Leaf 1: Pure Strawsonian** (reactive attitudes are non-rational social practices; exemptions are context-dependent; determinism irrelevant).  

  ---

  #### **Branch from C**  
  *Q8: "In an indeterministic universe (where acts aren’t fully determined by prior causes), would resentment be appropriate for harmful acts?"*  
  - **Yes** → **Leaf 4: Libertarian Incompatibilism** (reactive attitudes require indeterministic free will; preserve attitudes despite determinism’s falsity).  
  - **No** → **Leaf 3: Hard Determinism / Global Skepticism** (determinism universally undermines reactive attitudes; objective attitude is always required).  

  ---

  ### **Leaves Summary**  
  1. **Leaf 1: Pure Strawsonian** (social practices; determinism irrelevant).  
  2. **Leaves 2a–2d: Rationalist Compatibilism** (capacities-based; determinism compatible under conditions).  
  3. **Leaf 3: Hard Determinism** (determinism globally undermines attitudes).  
  4. **Leaf 4: Libertarian Incompatibilism** (attitudes require indeterminism; preserve them).  
  5. **H1: Sub-Personal Targeting Hybrid** (target subsystems; no capacities needed).  
  6. **H2: Role-Functional Hybrid** (target roles/functions only).  
  7. **H3: Strawsonian with Objective Exemptions** (social practices + objective capacities).  

  ---

  ### **Unoccupied Logical Space**  
  - **Pure Strawsonian + Sub-Personal Targeting**: Not represented. Gap due to lack of exploration (Strawsonians focus on persons, not subsystems).  
  - **Hard Determinism + Collective Resentment**: Not represented. Gap due to incoherence (hard determinism rejects ALL reactive attitudes).  
  - **Libertarianism + Institutional Exemption**: Not represented. Gap due to practical unattractiveness (libertarians rarely exempt institutions but not individuals).  

  ---

  ### **Scoring Key**  
  | Path                   | Leaf                                |  
  |------------------------|-------------------------------------|  
  | **C → Q8: No**         | Leaf 3 (Hard Determinism)           |  
  | **C → Q8: Yes**        | Leaf 4 (Libertarian Incompatibilism)|  
  | **B → Q7: Social**     | Leaf 1 (Pure Strawsonian)           |  
  | **B → Q7: Objective**  | Leaf H3 (Strawsonian + Objective Exemptions)|  
  | **A → Q2: No → Q6: Yes** | Leaf H1 (Sub-Personal Targeting)  |  
  | **A → Q2: No → Q6: No**  | Leaf H2 (Role-Functional Hybrid)   |  
  | **A → Q2: Yes → Q3: Yes → Q4: Yes** | Leaf 2a (Rationalist Compatibilism: individual blame in systemic harm) |  
  | **A → Q2: Yes → Q3: Yes → Q4: No**  | Leaf 2b (Rationalist Compatibilism: collective-only blame) |  
  | **A → Q2: Yes → Q3: No → Q5: Yes**  | Leaf 2c (Rationalist Compatibilism: individual blame if avoidable) |  
  | **A → Q2: Yes → Q3: No → Q5: No**   | Leaf 2d (Rationalist Compatibilism: no individual blame in systemic harm) |  

  ---

  ### **Ambiguities and Separation Limits**  
  - **Rationalist Compatibilism (2a–2d)**: The tree separates subtypes but cannot further distinguish whether "reasons-responsive capacities" are internal (e.g., cognitive) or external (e.g., social). This ambiguity remains because Q2–Q5 focus on applicability, not capacity metaphysics.  
  - **H1 vs. H2**: The tree separates these hybrids cleanly via Q6.  
  - **H3 vs. Pure Strawsonian**: Separated cleanly via Q7 (exemption basis).  
  - **Libertarianism vs. Compatibilism**: Separated cleanly via Q1 (determinism’s relevance) and Q8 (indeterminism’s necessity).  

  This tree exhaustively maps the logical space, prioritizes concrete judgments, and isolates rare hybrids while diagnosing gaps. It avoids textual references and emphasizes substantive commitments.
