   Step 3: Compensation-in-Principle Test (CIPT)
     Question: Could the overall gains from the intervention, in principle, fully compensate the losers? (i.e., is the net benefit positive and large enough to cover the losses of the worst-off?)
       - If YES → GREEN LIGHT (in principle, it's possible to make the losers whole without creating new losers, so no one is left with a net loss) → but note: this does not require actual compensation, only that it is possible.
