answer: |-
  ### Separateness of Persons Decision Checklist  
  **Core Principles**:  
  1. **Targeted Sacrifice (TS)** vs. **Diffuse Burden (DB)**:  
     - TS = Specific, identifiable group bears costs *as a direct means* to the goal.  
     - DB = Costs spread so broadly/thinly that no group is instrumentalized.  
  2. **Compensation-in-Principle Test (CIPT)**:  
     - Could gains *theoretically* fully compensate losers? (Regardless of actual compensation.)  

  ---

  #### **DECISION TREE**  
  *(Answer sequentially; stop at first definitive flag.)*  

  **Step 1: Targeted or Diffuse?**  
  *Question: Is a specific, identifiable group singled out to bear >50% of the costs?*  
  - **NO (DB)** → Proceed to **Step 2A**.  
  - **YES (TS)** → Proceed to **Step 2B**.  

  **Step 2A: Diffuse Burden Severity**  
  *Question: Is the per-person cost trivial (e.g., <1% income, minor inconvenience)?*  
  - **YES** → ✅ **GREEN LIGHT**. (No violation: burdens negligible and non-instrumental.)  
  - **NO** → Proceed to **Step 3**.  

  **Step 2B: Instrumentalization Check**  
  *Question: Is the harm to the targeted group a *necessary mechanism* to achieve the goal?*  
  - **NO** (e.g., harm is collateral damage) → Proceed to **Step 3**.  
  - **YES** (e.g., group is used as "tools") → Proceed to **Step 4**.  

  **Step 3: Compensation-in-Principle Test (General)**  
  *Question: Could the total gains *fully compensate all losers* without creating new losers?*  
  - **YES** → ✅ **GREEN LIGHT**. (Net gain possible; no one *need* be net loser.)  
  - **NO** → ❌ **RED FLAG**. (Violation: losers cannot be compensated.)  

  **Step 4: Compensation-in-Principle Test (Targeted Group)**  
  *Question: Could gains *fully compensate the targeted group*?*  
  - **NO** → ❌ **RED FLAG**. (Violation: group is sacrificial "batteries".)  
  - **YES** → ⚠️ **YELLOW FLAG**. (Judgment call: permissible *only if* compensation is feasible/just.)  

  ---

  ### **What This Tool Can’t Catch (Blind Spots)**  
  - **Consent/autonomy violations** (e.g., forced medical procedures).  
  - **Rights infringements** (e.g., bodily integrity, privacy).  
  - **Non-compensable harms** (e.g., death, dignity loss, cultural erasure).  
  - **Distributive injustice** (e.g., benefits flow only to the privileged).  
  - **Long-term/indirect harms** (e.g., generational impacts).  

  ---

  ### **Case Applications**  

  #### **Case 1: Mandatory Risky Vaccine for Nurses**  
  - **Step 1**: Targeted? **YES** (nurses).  
  - **Step 2B**: Instrumentalized? **YES** (their risk directly protects patients).  
  - **Step 4**: CIPT for nurses? **YES** (gains *could* compensate via hazard pay, healthcare).  
  - **Result**: ⚠️ **YELLOW FLAG**.  
    - *Judgment call*: Does policy minimize risk? Is compensation provided?  

  #### **Case 2: Carbon Tax Wiping Out Coal Town**  
  - **Step 1**: Targeted? **YES** (coal town residents).  
  - **Step 2B**: Instrumentalized? **YES** (their loss is the direct mechanism to cut emissions).  
  - **Step 4**: CIPT for town? **YES** (global gains *could* fund relocation/job retraining).  
  - **Result**: ⚠️ **YELLOW FLAG**.  
    - *Judgment call*: Is compensation actually feasible? Are alternatives exhausted?  

  #### **Case 3: Clinical Trial with Placebo Group**  
  - **Step 1**: Targeted? **YES** (placebo patients).  
  - **Step 2B**: Instrumentalized? **YES** (their harm generates data).  
  - **Step 4**: CIPT for placebo group? **NO** (death/permanent harm is *non-compensable*).  
  - **Result**: ❌ **RED FLAG**.  
    - *Why it fails*: Unavoidable harm to individuals cannot be "repaid".  

  ---

  ### **Green Light Example (You’ll Hate This)**  
  **Policy**: A 0.1% wealth tax on all citizens to fund climate adaptation.  
  - **Step 1**: Targeted? **NO** (applies to all; diffuse).  
  - **Step 2A**: Trivial burden? **YES** (0.1% is negligible for all).  
  - **Result**: ✅ **GREEN LIGHT**.  
    - *Why you’ll hate it*: It’s a regressive policy if the wealthy evade it, but the tool ignores distributive fairness (blind spot).  

  ---

  ### **Key Judgment Call Flags**  
  ⚠️ **YELLOW FLAGS** require weighing:  
  1. **Feasibility of compensation** (is it realistic?).  
  2. **Alternatives** (was this the *least harmful* option?).  
  3. **Consent** (was the group consulted?).  
  4. **Burden proportionality** (do gains *dwarf* costs?).  

  ❌ **RED FLAGS** are non-negotiable separateness violations.  
  ✅ **GREEN LIGHTS** pass the test—but may still be unethical due to blind spots.  

  **Final Tip**: Run this *alongside* equity/consent checks for full ethics coverage.
