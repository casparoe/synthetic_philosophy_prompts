      - DB: Costs are spread so broadly and thinly that no particular group is singled out as a means.

   2. Compensation-in-Principle Test (CIPT):
      - Could the gains from the policy/intervention, in principle, fully compensate the losers (even if no actual compensation occurs)? 
      - If yes, then the policy might pass the test (though it doesn't necessarily make the policy just, especially if compensation isn't paid). 
      - If no, then the policy fails because it involves a net loss to some that cannot be made right.

   The procedure will be a series of ordered questions with clear pass/fail and judgment-call flags.

   Steps:

   Step 1: Identify the Cost-Bearing Group
     Question: Is there a specific, identifiable group that bears the primary costs of the intervention? 
       - If NO (costs are diffuse and spread across a very large population, e.g., the entire society, without singling out any particular group) → move to Step 2a.
       - If YES (a specific group is targeted) → move to Step 2b.

   Step 2a: Diffuse Burden Path
     Question: Are the costs to each individual in the diffuse burden so minimal that they do not constitute a significant setback to any person's interests? 
       - If YES → GREEN LIGHT (passes separateness of persons because no one is being used as a means in a significant way).
       - If NO (the burden, though diffuse, is still significant for many) → move to Step 3.

