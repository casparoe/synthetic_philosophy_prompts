  For vulnerability to functionalism: Diamond > Harari > G&W. Diamond's geographic determinism leans heavily on adaptive functions, Harari's cognitive framing has implicit functionalist logic in how revolutions "solve" problems, while G&W actively fight functionalism but their seasonal cases could be misinterpreted as system-maintenance. 

