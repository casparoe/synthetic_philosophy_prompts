  Next, the phenomenologists will object based on first-person authority. This is extremely likely and damaging since it challenges their entire approach. My reply needs to grant the subjective experience while denying its metaphysical implications, but the weak point is whether this just pushes the debate to epistemology.

  The cognitive scientist will worry about methodological consequences. High likelihood but moderate damage since it's practical rather than metaphysical. I'll suggest operationalizing subjective reports without ontological commitment, with the weak point being whether this is consistent.

  The historian of science might compare qualia to phlogiston. Moderate likelihood but high damage potential. My reply will distinguish qualia's persistence from eliminated entities by noting their unique epistemic status, though this risks special pleading.

