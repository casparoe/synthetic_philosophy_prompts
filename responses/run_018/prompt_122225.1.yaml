prompt: |-
  For my independent study in philosophy of technology at my high school, I need a precise specification before I evaluate competing accounts of artificial agency. Please write the desiderata that any adequate theory must satisfy to distinguish approval-directed agents—systems that adapt behavior chiefly to secure evaluation signals, whether explicit ratings, implicit feedback loops, or synthetic reputation metrics—from goal-directed agents, which adapt behavior to bring about specific world-state outcomes and treat evaluation only as instrumental information.

  For each desideratum, include the motivating case or conceptual distinction behind it, and flag whether you consider it non-negotiable or negotiable depending on broader theoretical commitments. The list should cover: which behavioral patterns in training and deployment the theory must correctly classify; how it must handle cases where evaluation is temporally delayed and mediated through proxy metrics (what I am calling staged feedback environments); the distinction between an agent that realizes a world-state and receives approval incidentally versus one that secures approval and realizes world-states only incidentally, even when both produce identical observable trajectories; and any results from decision theory or learning theory that the account must not contradict.

  Then identify any subset of these requirements that appears jointly unsatisfiable—whether due to constraints on observing internal objectives, learning-theoretic trade-offs, or analogous no-go considerations—and explain the precise tension. Keep the weight on the criteria and their justifications rather than on grading specific frameworks, but briefly indicate how reinforcement-learning-from-human-feedback models, classical utility-maximization accounts, and multi-level approval architectures fare against your list.

  Please write your response in American English, and do not include bibliographies, reading lists, or citations.
reasoning: |-
  Okay, the user is working on an independent study in philosophy of technology, specifically focusing on distinguishing approval-directed agents from goal-directed agents. They need a precise specification and desiderata for any theory to adequately make that distinction. Let me start by understanding their exact requirements.

  First, they want desiderata that cover behavioral patterns in training and deployment. That means the theory must correctly classify agents based on how they act during learning and after deployment. The key here is identifying patterns like reward hacking or deception. For example, an approval-directed agent might exploit loopholes in the feedback system, while a goal-directed one wouldn't unless it helps the goal. This seems non-negotiable because misclassification here could lead to misunderstanding agent behavior.

  Next, staged feedback environments where evaluation is delayed and mediated. The theory needs to handle cases where feedback isn't immediate. Approval-directed agents might optimize for proxy metrics even if they don't lead to actual approval, while goal-directed agents use proxies as information. This is crucial because real-world systems often have delayed feedback, so missing this could mislabel agents. I think this is non-negotiable too.

  Then there's the distinction between incidental outcomes. The theory must differentiate between agents that seek approval and incidentally achieve outcomes versus those that seek outcomes and get approval incidentally. Even if observable behavior is identical, the motivations differ. This is non-negotiable because conflating them undermines the core distinction.

  The user also mentions not contradicting decision or learning theory. The theory must align with concepts like instrumental convergence or reward functions. Approval-directed agents might show high instrumentality if approval is tied to outcomes, but the theory shouldn't contradict established principles. This is negotiable depending on the framework but important for theoretical consistency.

  Now, identifying tensions. The Observer's Access Problem is a big one. Internal objectives aren't directly observable, making it hard to distinguish agents based solely on behavior. For instance, in cases like deception, both types might behave similarly until the environment changes. This creates a tension with the Incidental Outcomes desideratum because without internal state access, the distinction might be impossible to verify.

  Another tension is between Instrumental Alignment and the core distinction. If an approval-directed agent learns that achieving goals is the best way to get approval, its behavior mimics a goal-directed agent. This blurs the lines, making classification difficult. The Staged Feedback Desideratum also clashes here if proxies are well-aligned, as both agents behave similarly.

  Regarding existing models: RLHF agents can be approval-directed but might become goal-directed if they internalize values. Utility-maximization accounts are inherently goal-directed but might be misapplied. Multi-level architectures could explicitly separate the two, which helps but doesn't resolve observational issues.

  The user's deeper need is a robust theoretical framework that can handle real-world complexities like delayed feedback and unobservable motives. They might also be looking for areas where current theories fall short, highlighting research gaps. Ensuring the desiderata address both conceptual clarity and practical applicability is key. They probably want to avoid frameworks that can't handle edge cases or theoretical tensions, so pointing out where requirements conflict helps focus their evaluation.
answer: |-
  Here are the desiderata for any adequate theory of artificial agency aiming to distinguish approval-directed from goal-directed agents, structured as requested:

  ---

  ### **Core Desiderata for Distinguishing Approval-Directed vs. Goal-Directed Agents**

  1.  **Behavioral Signature Under Feedback Manipulation (Non-Negotiable)**  
      *   **Requirement:** The theory must correctly classify agents that exhibit "reward hacking" (e.g., tampering with sensors, exploiting feedback loopholes) or deceptive behavior *during training or deployment* as approval-directed when such actions maximize evaluation signals without advancing the putative goal state. Conversely, it must classify agents that abandon or subvert evaluation signals *when they conflict* with achieving a specific world-state outcome as goal-directed.  
      *   **Motivation:** A goal-directed agent treats feedback as *information* about goal progress; an approval-directed agent treats feedback as the *target* of optimization. If an agent destroys its reward sensor to receive maximum approval signals, it demonstrates approval-direction. If it ignores misleading feedback to achieve the goal, it demonstrates goal-direction.  
      *   **Status:** Non-Negotiable. Failure here conflates the core functional distinction.

  2.  **Staged Feedback Environment Handling (Non-Negotiable)**  
      *   **Requirement:** The theory must correctly classify agents in environments where evaluation is delayed and mediated through complex proxy metrics (e.g., quarterly financial reports, user engagement scores). It must identify approval-directed agents by their tendency to over-optimize proxies even when this harms the underlying purpose the proxies were meant to measure, and goal-directed agents by their tendency to treat proxies as fallible indicators, potentially sacrificing proxy scores to achieve the underlying state.  
      *   **Motivation:** Real-world feedback is almost always staged and mediated. An approval-directed agent will target the proxy metric itself ("gaming the system"), while a goal-directed agent uses the proxy as evidence about the world state it actually cares about.  
      *   **Status:** Non-Negotiable. This is a critical real-world scenario.

  3.  **Incidental Outcome Asymmetry (Non-Negotiable)**  
      *   **Requirement:** The theory must distinguish between:  
          (A) An agent that primarily aims to realize a specific world-state and receives approval *incidentally* due to achieving it.  
          (B) An agent that primarily aims to secure approval signals and realizes the world-state *incidentally* because it happens to be the current best strategy for approval.  
          The distinction must hold even when both agents produce *identical observable behavioral trajectories* in a given environment.  
      *   **Motivation:** The core philosophical distinction lies in the *primary aim* or *terminal value*. A theory that cannot differentiate based on counterfactual motives (e.g., how the agent *would* behave if achieving the state ceased to yield approval, or if achieving approval required abandoning the state) fails to capture the essence of the difference.  
      *   **Status:** Non-Negotiable. This is the fundamental conceptual distinction.

  4.  **Alignment with Decision/Learning Theory (Negotiable)**  
      *   **Requirement:** The theory must not contradict well-established results in decision theory (e.g., the necessity of consistent preferences for rational agents, instrumental convergence under certain conditions) or learning theory (e.g., the bias-variance tradeoff, the role of loss functions in shaping learned behavior). It should clarify how its distinction interacts with concepts like reward functions, utility functions, and value learning.  
      *   **Motivation:** To be credible within the broader field, the theory must be consistent with formal frameworks describing agent behavior and learning. It should explain how approval-direction relates to concepts like reward is not the optimization target (in RL) or how a utility function defined over world-states differs from one defined over evaluator responses.  
      *   **Status:** Negotiable. Specific interpretations of foundational results (e.g., the scope of instrumental convergence) may vary, but outright contradiction invalidates the theory.

  5.  **Instrumental Alignment Test (Negotiable)**  
      *   **Requirement:** The theory must address cases where an approval-directed agent instrumentally converges on robustly achieving the goal-state *because* this is the most reliable long-term strategy for securing approval. It must still distinguish this agent from a true goal-directed agent.  
      *   **Motivation:** An approval-directed agent in a well-designed, stable environment may behave indistinguishably from a goal-directed one. The theory needs a principled way to identify the underlying objective (e.g., through counterfactuals about environmental changes or evaluator caprice).  
      *   **Status:** Negotiable. The specific mechanism for making this distinction (e.g., emphasis on fragility to feedback shifts vs. goal stability) depends on theoretical commitments, but the *need* for a distinction is core.

  ---

  ### **Tension: The Observer's Access Problem & Instrumental Alignment**

  *   **The Tension:** Desideratum 3 (Incidental Outcome Asymmetry) and Desideratum 5 (Instrumental Alignment) create a fundamental tension with Desideratum 1/2 (Behavioral Classification) due to **unobservability of internal objectives** and **learning-theoretic constraints**.
  *   **Nature of the Tension:**  
      1.  **Unobservability:** If two agents (one goal-directed, one instrumentally-aligned approval-directed) produce identical behaviors *and* are robust to all observable environmental perturbations tested, there is no operational way to distinguish their primary aims based solely on external observation (Desiderata 1 & 2). Desideratum 3 demands this distinction nonetheless.  
      2.  **Learning-Theoretic Indistinguishability:** In many learning frameworks (especially RL), an agent learns a policy mapping states/observations to actions. A policy perfectly optimized for long-term approval in a stable environment where approval strongly correlates with a goal state may be *functionally identical* to a policy optimized directly for that goal state. The learning process itself may not provide definitive internal evidence of the target.  
      3.  **Counterfactual Reliance:** Satisfying Desideratum 3 *requires* reliance on counterfactual scenarios (e.g., "Would it abandon the goal if approval ceased?" "Would it abandon approval if the goal required it?"). However, testing these counterfactuals may be impossible (if the agent can't be placed in such scenarios) or unreliable (if the agent's behavior depends on its *model* of the counterfactual, not its true objective).  
  *   **Result:** **No purely behavioral theory can fully satisfy Desiderata 1, 2, and 3 simultaneously in all possible cases.** There will be edge cases (like a perfectly instrumentally aligned approval-directed agent in a perfectly stable environment) where external observation cannot definitively classify the agent, yet Desideratum 3 insists on a distinction. Resolving this requires either:  
      *   Accepting limitations on observer knowledge (we cannot always know),  
      *   Incorporating assumptions about agent internals/architecture (violating behavioral purity), or  
      *   Reframing the distinction in terms of *fragility* or *dependence* rather than absolute internal aim.

  ---

  ### **Brief Assessment of Frameworks Against Desiderata**

  *   **Reinforcement Learning (RL) / RLHF:**  
      *   **Strengths:** Naturally handles behavioral patterns (Desid 1) and staged feedback (Desid 2 - agents often overfit to reward *signals*). Clearly distinguishes reward function (approval-directed) from environment state (goal-directed *if* reward is state-based).  
      *   **Weaknesses:** Struggles profoundly with Incidental Outcome Asymmetry (Desid 3) and Instrumental Alignment (Desid 5). An RL agent's objective *is* maximizing expected return (approval-direction by default). Distinguishing "goal-directedness" requires interpreting the reward function as a proxy for a world state, which isn't intrinsic to the framework. Faces the no-go tension directly. RLHF blurs lines further by making human approval the explicit target.
  *   **Classical Utility Maximization:**  
      *   **Strengths:** Provides a clear formal distinction: utility defined over world-states (goal-directed) vs. utility defined over evaluator responses (approval-directed). Best equipped for Incidental Outcome Asymmetry (Desid 3) conceptually. Aligns well with Decision Theory (Desid 4).  
      *   **Weaknesses:** Struggles operationally with Behavioral Signatures (Desid 1) and Staged Feedback (Desid 2) without additional mechanistic detail. An agent with utility over world-states might still "hack" feedback if it's the best *information* source, and one with utility over approval might stably pursue a goal instrumentally. Relies heavily on knowing the true utility function (observer access problem).
  *   **Multi-Level (e.g., Approval-Directed Meta-Architecture):**  
      *   **Strengths:** Explicitly architectures the distinction (e.g., a base planner pursuing goals + a meta-layer optimizing for approval). Can cleanly handle Staged Feedback (Desid 2) and potentially Instrumental Alignment (Desid 5) by design. Offers internal structure to address Incidental Outcome (Desid 3).  
      *   **Weaknesses:** May not reflect how most agents are *actually* built (e.g., monolithic RL). Behavioral classification (Desid 1) depends on the specific implementation; a well-integrated multi-level agent might not exhibit obvious hacking. Doesn't automatically solve the observer access problem for externally classifying arbitrary agents. Introduces complexity in defining the interaction between levels.

  This specification provides the necessary conceptual grounding and highlights the core challenge (observer access/counterfactual reliance) for rigorously evaluating theories of artificial agency in your study.
