          Messenger F runs right: x=0 + 1*t
          Bob: x=3 + 0.5*t
          Meet when: t = 3 + 0.5*t => 0.5t=3 => t=6 seconds.

     So Bob sees event B at 2 seconds and event F at 6 seconds.

     The activity then takes 6 seconds for Bob to receive the last message.

     Steps:

     - Explain to participants their roles. Practice the speeds: walking at 0.5m/s and running at 1m/s.
     - Set positions: event F at x=0, event B at x=6, midpoint at x=3.
     - Alice at x=3, stationary.
     - Bob starts at x=3 and will walk at 0.5m/s to the right (towards x=6) when the coordinator says "start".
     - Event assistants at their positions.
     - Messengers at their events.

     - Coordinator: says "Start!" and starts the stopwatch. This is t=0.
          - Event assistants immediately trigger the event (e.g., raise a flag and keep it up) and release the messengers.
          - Bob starts moving at 0.5m/s to the right.

     - Alice records the time when each messenger arrives.
     - Bob records the time when each messenger arrives.

     We do the run.

     Expected results:

     Alice: both messengers arrive at the same time (3 seconds).

     Bob: messenger from B arrives at 2 seconds, messenger from F arrives at 6 seconds.

     Then we ask: 
          - Alice says the events were simultaneous.
          - Bob says event B happened before event F.

     But wait, how do they know when the event happened? They only know when they received the message. We must be careful.

     We can ask: based on the order in which you received the messages, what order do you think the events happened in?

     Alice: since both messages arrived at the same time and she is midway, she infers the events happened at the same time.

     Bob: he received event B's message first, so he thinks event B happened first.

     But is that correct for Bob? In his frame, maybe. But we haven't defined his frame's synchronization. We can have a discussion about how he would calculate the event times.

     For the activity, the takeaway is that they disagree on the order.

     Now, the move to eternalism: if event B is in the past for Bob and event F is in the future for Bob at the same time that for Alice both are in the past, then what does that say about the reality of event F? If event F is real for Alice (because it's in her past) but not for Bob (because it's in his future), then reality is frame-dependent? Or are both events real independently of the frame?

     We then debrief.

     Given the time (75 minutes), we can run the activity twice (maybe with different parameters) and then discuss.

     Timeline:

     - Introduction and role assignment (10 minutes)
     - Setup and practice (10 minutes)
     - Run the activity (10 minutes)
     - Collect results and initial discussion (10 minutes)
     - Introduce the three claims and map to the activity (10 minutes)
     - The master clock question (10 minutes)
     - The cheapness of the argument and resistance (10 minutes)
     - Wrap-up (5 minutes)

     Now, for the index cards:

     - Coordinator: 
          "You have a stopwatch. At time 0, shout 'Start!'. This is when the events happen. 
           Make sure the event assistants trigger the events and release the messengers at that moment."

     - Alice:
          "You are standing at the midpoint (x=3). Start your stopwatch when you hear 'Start!'.
           Record the time when each messenger arrives: 
               - Messenger from F (at x=0) arrives at time: _____ 
               - Messenger from B (at x=6) arrives at time: _____"

     - Bob:
          "You start at the midpoint (x=3). When you hear 'Start!', start your stopwatch and walk at a steady pace (0.5 m/s) to the right (towards x=6).
           Record the time when each messenger arrives:
               - Messenger from F (coming from the left) arrives at time: _____ 
               - Messenger from B (coming from the right) arrives at time: _____"

     - Event F assistant (x=0):
          "When you hear 'Start!', raise the flag (or blow the whistle) to indicate event F has happened. Then release the two messengers for event F: 
               - One to Alice: this messenger runs to x=3 at 1 m/s.
               - One to Bob: this messenger runs to the right at 1 m/s until they meet Bob."

     - Event B assistant (x=6):
          "When you hear 'Start!', raise the flag for event B. Then release the two messengers for event B:
               - One to Alice: runs to x=3 at 1 m/s.
               - One to Bob: runs to the left at 1 m/s until they meet Bob."

     - Messenger to Alice from F: 
          "When event F happens, run to x=3 at 1 m/s. When you reach Alice, say 'Event F happened'."

     - Messenger to Alice from B: 
          "When event B happens, run to x=3 at 1 m/s. When you reach Alice, say 'Event B happened'."

     - Messenger to Bob from F:
          "When event F happens, run to the right at 1 m/s. Keep running until you meet Bob (who is walking to the right). When you meet him, say 'Event F happened'."

     - Messenger to Bob from B:
          "When event B happens, run to the left at 1 m/s. Keep running until you meet Bob (who is walking to the right). When you meet him, say 'Event B happened'."

     We need to ensure the messengers for Bob know in which direction to run and that they run until they meet Bob.

     After the activity, gather the times:

          Alice: both at 3 seconds.
          Bob: from B at 2 seconds, from F at 6 seconds.

     Then ask:

          - Do you agree on the order of the events? 
          - Alice says they happened at the same time. Bob says event B happened first.

     Now, we make the point: in special relativity, there is no privileged frame. The ground frame is not special. We could have done the same from the perspective of the train frame.

     Then introduce the three claims.

     Claim 1: The future is determined by the past together with the laws of physics. (Determinism)
     Claim 2: Future events exist in the same tenseless sense that present ones do. (Eternalism/block universe)
     Claim 3: There is no objective, frame-independent fact about which distant events are happening now. (Relativity of simultaneity)

     The activity demonstrated claim 3.

     The move to claim 2 (eternalism) is a metaphysical leap. Why? Because if two observers disagree about what is "now", and there is no privileged frame, then either one of them is wrong (but we have no way to say which) or both are equally valid. If event F is in the future for Bob and in the past for Alice, then for event F to be real for Alice but not for Bob would make reality frame-dependent. Many find that odd. So they say: event F is real even for Bob, it's just not in his present.

     The resistance:

     - The master clock: what if there is a hidden master clock that defines true simultaneity? But the activity showed that no experiment with signals faster than light can detect it. In our activity, the signals are the fastest possible. So even if there is a master clock, it doesn't affect what we can observe. Therefore, it's not part of our physics.

     - The cheapness: any relative velocity, no matter how small, leads to this. So even if we are moving very slowly, the future is just as real as the present? But our intuition is that the future is open. The argument seems to show that the future is fixed and real. But note: relativity of simultaneity doesn't necessarily imply determinism (claim 1). The block universe could be non-deterministic.

     What might go wrong:

     - Participants might say that the different arrival times are just because the observers are moving, not that the events happened at different times. This is the point: they have to infer the time of the event from the arrival time and the distance. In Alice's case, it's easy. In Bob's case, he doesn't know the distance at the time of the event? We avoided that by just using the order.

     - We didn't have them calculate the event times. We only used the order of arrival. But the order of arrival is what matters for the order of events in their frame.

     - Someone might say that the messengers are sound or light and that we are just seeing the effect of motion on perception, not on reality. This is the point of the master clock discussion: if there is a true reality, we cannot access it with our fastest signals. So we have no choice but to define simultaneity relatively.

     - The activity cannot make them feel that the future is real. That is a metaphysical leap. We can only show that the relativity of simultaneity forces us to either accept frame-dependent reality or a block universe.

     So in the debrief, we map:

          - The activity directly shows claim 3: no objective simultaneity.
          - The move to eternalism (claim 2) is motivated by the desire to avoid frame-dependent reality.
          - Claim 1 (determinism) does not follow from the activity. It is separate.

     We then ask: do you accept claim 3? (most will, because they saw it). 
     Do you then feel compelled to accept claim 2? Why or why not?
     And claim 1 is not addressed by this argument.

     Finally, the outcome: participants should be able to separate these three claims.

     This is a long note, but I hope it helps.
answer: |-
  Below is a complete runnable activity designed for your physics-and-philosophy club session on the block universe, focusing on the relativity of simultaneity. The activity uses human-scale movement to slow the "speed of light" to a walk, allowing participants to physically experience disagreements about simultaneity. It avoids upfront explanations, prioritizes discovery, and structures the debrief to address your three claims and the "resistance" points you raised.

  ### **Activity: "Simultaneity in Motion"**
  **Time Budget:** 75 minutes  
  **Participants:** 14 students (roles for 10 active participants, 4 observers/assistants; rotate if needed).  
  **Materials:**  
  - Measuring tape (to mark distances).  
  - Cones (to mark event locations and observer paths).  
  - 2 whistles (for event signals).  
  - Index cards (pre-printed with role instructions).  
  - Phone stopwatches (1 per observer and the coordinator).  
  - String or chalk (optional, to mark walking paths).

  ---

  #### **Setup (15 minutes)**  
  1. **Define the "speed of light" (c_slow) and observer velocity (v):**  
     - Set `c_slow = 1 meter/second` (messengers walk briskly).  
     - Set `v = 0.5 meters/second` (observers walk slowly).  
     - *Why these values?* They create measurable disagreements without excessive waiting.  

  2. **Mark the space (e.g., football field):**  
     - Place two cones **50 meters apart** (Event A at 0m, Event B at 50m).  
     - Mark a **midpoint (M) at 25m** between them.  
     - Mark a **10m walking path** for observers (see diagram below).  

  3. **Assign roles (10 participants):**  
     - **Alice (Platform Observer):** Starts at M (25m), stays **stationary**.  
     - **Bob (Moving Observer):** Starts at M (25m), walks at `v = 0.5 m/s` toward Event B.  
     - **Event A Assistant:** Stands at Event A (0m), triggers event with whistle.  
     - **Event B Assistant:** Stands at Event B (50m), triggers event with whistle.  
     - **Messenger to Alice (from A):** Runs to Alice at `c_slow = 1 m/s` after Event A.  
     - **Messenger to Alice (from B):** Runs to Alice at `c_slow = 1 m/s` after Event B.  
     - **Messenger to Bob (from A):** Runs toward Bob at `c_slow = 1 m/s` after Event A (must "catch" moving Bob).  
     - **Messenger to Bob (from B):** Runs toward Bob at `c_slow = 1 m/s` after Event B (must "catch" Bob).  
     - **Coordinator:** At M, starts all stopwatches at `t=0` and shouts "EVENTS NOW!" to trigger assistants.  
     - **Timer Recorder:** Documents arrival times for messengers (for debrief).  

  4. **Hand out index cards** (see [Appendix] for exact text):  
     - Cards specify simple rules: e.g., *"Walk at exactly 0.5 m/s"*, *"Run at 1 m/s"*, *"Blow whistle when you hear ‘EVENTS NOW!’"*.  
     - Emphasize: **No talking during the run** (to avoid spoilers).  

  ---

  #### **Activity Run (25 minutes)**  
  **Goal:** Observers record when messengers arrive. The disagreement reveals relativity of simultaneity.  
  1. **Brief participants (2 min):**  
     - *"Today, we’re simulating how observers in motion experience events. Follow your card’s instructions. We’ll discuss after."*  
     - No theory explained—pure role-play.  

  2. **Run the simulation (8 min per trial, run twice):**  
     - **t = 0 sec:** Coordinator shouts "EVENTS NOW!" and starts all stopwatches.  
       - Event A and B Assistants blow whistles simultaneously (events are defined as "now" in the ground frame).  
       - Messengers start running toward their observers.  
       - Bob begins walking toward Event B at `0.5 m/s`.  
     - **Messenger arrivals (predicted times):**  
       - **Alice (stationary):**  
         - Messenger from A: Distance = 25m, time = 25s.  
         - Messenger from B: Distance = 25m, time = 25s.  
         → **Both arrive at 25s** (Alice concludes events were simultaneous).  
       - **Bob (moving):**  
         - Messenger from B: Must run left to catch Bob moving right. Meets at `t ≈ 16.7s` (calculation below).  
         - Messenger from A: Must run right to catch Bob. Meets at `t = 50s`.  
         → **Sees B first (16.7s), then A (50s)** (Bob concludes B happened before A).  
     - **Timer Recorder** documents times. Repeat for consistency.  

     *Math note:* For Bob, initial distance to B is 25m. Messenger (1m/s) closes gap at `(1 - 0.5) = 0.5 m/s` relative speed → time = 25m / 0.5 m/s = 50s? Wait, no:  
     - Messenger from B runs *left* at 1m/s, Bob moves *right* at 0.5m/s → they move toward each other at `1 + 0.5 = 1.5 m/s`. Time = 25m / 1.5 m/s ≈ 16.7s.  
     - Messenger from A runs *right* at 1m/s, Bob moves *right* at 0.5m/s → messenger gains at `1 - 0.5 = 0.5 m/s`. Time = 25m / 0.5 m/s = 50s.  

  3. **Debrief prep (5 min):**  
     - Share recorded times: Alice (both ~25s), Bob (B at ~17s, A at ~50s).  
     - Ask: *"Did Alice and Bob agree on which event happened first? Why?"*  

  ---

  #### **Guided Discussion & Claims Mapping (35 minutes)**  
  **Goal:** Connect the activity to your three claims and stage resistance.  

  1. **Discover the core idea (10 min):**  
     - Q: *"Why did Bob see Event B first, while Alice saw both at once? What does this say about ‘now’?"*  
       - Draw out: **Simultaneity depends on motion.** Observers define "now" differently for distant events.  
     - Q: *"Could both be correct? Is there a way to prove who’s right?"*  
       - Highlight: No "universal now"—signals are limited to `c_slow`, so no experiment can resolve the disagreement.  

  2. **Introduce your three claims (5 min):**  
     - Write claims on board:  
       - **Claim 1 (Determinism):** Future is fixed by past + laws.  
       - **Claim 2 (Eternalism):** Past, present, future equally exist ("block universe").  
       - **Claim 3 (Relativity of simultaneity):** No frame-independent "now".  
     - *"In the activity, what did we prove?"* → **Only Claim 3** (disagreements from motion).  

  3. **Stage the resistance (15 min):**  
     - **Resistance 1: The master clock**  
       - *"What if I told you a hidden ‘master clock’ defined a true ‘now’ we couldn’t detect? Would that change anything?"*  
       - Guide discussion: If undetectable (like in the activity), it’s irrelevant to physics. Claim 3 stands—physics only cares about observable disagreements.  
       - **Key point:** Eternalism (Claim 2) isn’t "proven"; it’s a philosophical choice to avoid frame-dependent reality.  
     - **Resistance 2: Suspiciously cheap?**  
       - *"Bob only moved at 0.5 m/s—walking speed! Does this mean any motion, even a finger-twitch, ‘proves’ the future already exists?"*  
       - Split group: Half argue "yes" (conclusion follows from ordinary motion), half argue "no" (eternalism sneaked into premises).  
       - **Reveal the leap:** The argument assumes "real" means "frame-independent." If reality *is* frame-dependent (e.g., only your "now" is real), you avoid eternalism—but is that intuitive?  

  4. **Address predictable issues (5 min):**  
     - *"This is just about light/msg delays—it’s an illusion!"*  
       - Counter: Delays are why we *infer* event times! If disagreements persist even after accounting for delays (as in the activity), simultaneity is relative.  
     - *What the activity can’t convey:* The *feeling* of eternalism. **Be upfront:** "I can’t make you *feel* that the future is real—that’s metaphysical. But the activity shows why some think relativity forces it."  

  ---

  #### **Wrap-up (5 minutes)**  
  - **Concrete outcome:**  
    - Ask each participant to write:  
      - *"I accept [Claim #] because... I reject [Claim #] because..."*  
    - Emphasize: Claims 1/2 aren’t required by relativity—only Claim 3 is.  
  - **Final note:** *"Relativity doesn’t ‘disprove free will’—it just reshapes how we think about time. What matters is which assumptions you buy."*  

  ---

  ### **Appendix: Index Card Texts**  
  **Coordinator:**  
  - At start: Shout "EVENTS NOW!" and start your stopwatch (t=0).  

  **Alice (Platform Observer):**  
  - Stand at the midpoint (25m). Start stopwatch at "EVENTS NOW!".  
  - Record times when messengers reach you:  
    - Msg from A: ______  
    - Msg from B: ______  

  **Bob (Moving Observer):**  
  - At "EVENTS NOW!", start stopwatch and walk toward Event B at 0.5 m/s.  
  - Record times when messengers reach you:  
    - Msg from A: ______  
    - Msg from B: ______  

  **Event A Assistant (0m):**  
  - At "EVENTS NOW!", blow whistle. Release both messengers immediately.  

  **Event B Assistant (50m):**  
  - At "EVENTS NOW!", blow whistle. Release both messengers immediately.  

  **Messenger to Alice (from A):**  
  - When Event A whistle blows, run to Alice (at 25m) at 1 m/s.  

  **Messenger to Alice (from B):**  
  - When Event B whistle blows, run to Alice (at 25m) at 1 m/s.  

  **Messenger to Bob (from A):**  
  - When Event A whistle blows, run toward Event B at 1 m/s until you reach Bob.  

  **Messenger to Bob (from B):**  
  - When Event B whistle blows, run toward Event A at 1 m/s until you reach Bob.  

  **Timer Recorder:**  
  - Document Alice’s and Bob’s recorded times.  

  ---

  ### **Predictable Challenges & Solutions**  
  - **"Messengers can’t catch Bob!"** → Pre-measure meeting points (B’s msg: ~41.7m; A’s msg: 50m) and practice speeds. Use cones.  
  - **"Why does motion affect ‘now’?"** → Stress: It’s not about perception; it’s about how we *define* simultaneity using signals.  
  - **Philosophical overload** → Keep claims separate. Use sticky notes for students to vote on claims pre/post activity.  
  - **Time crunch** → Skip the second run; use predicted times for discussion. Focus on the conceptual leap in debrief.  

  This setup ensures participants *experience* the relativity of simultaneity, then wrestle with its implications. By confronting resistance points explicitly, you’ll achieve your goal: a clear divide between Claim 3 (physics) and Claims 1–2 (philosophy).
