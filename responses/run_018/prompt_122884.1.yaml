prompt: |-
  Hi — I write the public-facing label copy for a small archaeology museum, 60 to 80 words a pop. Over the next few months we're doing three rooms back to back: one on Troy and the late Bronze Age Aegean, one on King Arthur and post-Roman Britain, one on the Exodus and Egypt. Each room needs maybe 25 labels, and basically every one of them forces the same decision: how strongly am I allowed to commit to a claim about something that might be history, might be legend, or might be a story that later grew around a real place, a real ruin, or a real name. My problem isn't ignorance of the material, it's that I have no consistent way of setting the level of commitment, so right now it's my mood on the day, then our curator (great guy, zero theory background, just asks "are we sure?") signs off, then the director reads it and wants to know why the Troy room says "probably" while the Arthur room says "in the story".

  So I want a procedure. Something I can run in about ten minutes per label, in a fixed order, with a stopping rule.

  The bit I keep tripping over is that three things get collapsed into one and I need the procedure to hold them apart: (a) the thing happened; (b) something happened and people kept talking about it, more or less accurately, for generations before anyone wrote it down; (c) somebody composed a story, and the story then got attached to a real hill, a real destruction layer, a real name in an inscription. Some specific traps the procedure has to handle rather than hand-wave:

  - The anchoring trap: a story is set at a site we've actually dug, and there's a destruction layer roughly in the right century, or the hero's name shows up in an inscription more or less contemporary with the events. I suspect that tells me something about what the storytellers needed, not necessarily about the event, but I can't say when.
  - Silence: no Egyptian record of the Israelites, no contemporary source naming Arthur. When is an absence allowed to count and when is it just an absence?
  - Awkward or embarrassing details: the move where you say the tellers would never have invented this. And the countermove, that a tradition can manufacture awkwardness precisely to feel authentic. Also doublets — two variant versions of what looks like one episode — do they count for or against?
  - Independent attestation: two sources saying the same thing, and the question of when they're actually independent.
  - Majority expert consensus against something a large chunk of our visitors are dead certain is true.
  - The religious case vs the secular case: museum policy is we never say a treasured story is false, but we also can't write labels implying historians back it when they don't. So somewhere in here there's a line between what evidence can warrant and what the story means to people, and I need the procedure to stop at that line and hand it to a human.

  Deliverable: a small ladder of commitment levels, maybe four to six rungs, with canned phrasings for each rung in plain visitor English; the tests, in order, that sort a claim onto a rung; where the procedure just stops with no; and where it has to kick the decision to a person because it's a values question. Be explicit about which distinctions survive being simplified for someone with no theory and which you're dropping and why.

  Then run it on three of my actual drafts. Don't spare my feelings on the first one, I really like that line and I'll defend it if it deserves defending:

  1. Troy: "The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."
  2. Arthur: "Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name." The local tourism people love this one.
  3. Exodus: a label where the board wants nothing that "denies anyone's faith", and my current draft opens "there is no evidence that any of this happened".

  For each: show the tests actually firing, give me the resulting label in the house voice, and tell me which rung it lands on and which single test decided it.

  Finally, be honest about where this thing will misfire: what kind of claim it systematically over-hedges or under-hedges, whether it does anything useful when every source we have is literary, and what I should do on the days when my curator and I disagree about a rung. No bibliography, no citations, I don't care who originated which criterion — I need to be able to run it on a Tuesday afternoon.
reasoning: |-
  Okay, let me tackle this problem step by step. The user writes museum labels about historical-legendary topics and needs a consistent way to determine how confidently to present claims. They're dealing with Troy, King Arthur, and Exodus exhibits, each with ambiguity between history and legend. 

  The core issue is establishing a reliable method to separate three aspects: actual events, oral traditions that may distort over time, and stories later attached to real places/names. They've identified specific traps like archaeological anchoring (e.g., a destruction layer at Troy), absence of evidence (no Egyptian records of Israelites), and dealing with religious sensitivities. 

  I need to design a practical procedure that:
  - Has clear commitment levels (4-6 tiers)
  - Uses plain-language phrasing for visitors 
  - Includes ordered tests with stopping points
  - Flags when human judgment is needed
  - Works in ~10 minutes per label

  Key challenges to address:
  - Not letting archaeological finds at a site (like Troy's destruction layer) automatically validate associated stories
  - Determining when absence of evidence is meaningful vs just absence
  - Handling "embarrassing details" arguments carefully
  - Assessing true independence of sources
  - Navigating majority scholarly consensus vs popular belief
  - Respecting religious significance while maintaining historical accuracy

  For the commitment ladder, I'm considering levels ranging from "verifiable fact" to "pure legend," with middle tiers for probable/likely scenarios and traditions with possible roots. Each tier needs canned phrasing that maintains museum voice while being transparent about uncertainty.

  The tests should run in fixed order:
  1. Contemporary evidence check
  2. Independent attestation assessment
  3. Archaeological correlation analysis
  4. Embarrassment criterion evaluation
  5. Consensus evaluation
  6. Meaning/significance consideration

  Stopping rules:
  - Hard stop if evidence contradicts claim
  - Human judgment needed when:
    - Religious significance is involved
    - Consensus is deeply divided
    - Political/social sensitivities arise

  For their draft labels:
  - The Troy claim seems overstated given current scholarship
  - The Arthur label is appropriately cautious but could be refined
  - The Exodus draft risks alienating visitors despite being technically accurate

  I'll need to show exactly which test would adjust each label and provide revised phrasing. The system will likely over-hedge on topics with scarce contemporary evidence (like Arthur) and under-hedge when archaeological finds feel "confirming" (like Troy). When curator disagreements happen, I'll suggest focusing on which test result is disputed rather than the phrasing level itself.
answer: |-
  Here’s a **practical procedure** for consistent historical-legendary claims assessment, designed for speed and clarity. It uses **5 commitment levels**, ordered tests with stopping rules, and flags for human judgment. Distinctions between **(a) event**, **(b) transmission**, and **(c) narrative attachment** are preserved where critical (Tests 2–4).

  ---

  ### **Commitment Ladder (Canned Phrasings)**
  | Rung | Label Phrasing (Visitor English)                               | Meaning                                                                 |
  |------|---------------------------------------------------------------|-------------------------------------------------------------------------|
  | 1    | **"We know that..."**                                          | Direct evidence; near-unanimous expert consensus.                       |
  | 2    | **"Evidence suggests..."** / **"Likely..."**                   | Strong indirect evidence; majority expert view.                         |
  | 3    | **"Some historians think..."** / **"Possibly..."**             | Plausible but contested; credible minority view OR unresolved debate.   |
  | 4    | **"Tradition says..."** / **"Later stories describe..."**      | Literary/cultural narrative; no historical verification.               |
  | 5    | **"Archaeology shows..."** (for physical evidence ONLY)        | Limits claim to excavated finds, detached from narrative.              |
  | ✋   | **KICK TO HUMAN**                                              | Religious/social sensitivity; evidence split 50/50; director override. |

  ---

  ### **Tests (Run in Order, 10 Min/Label)**
  1. **Contemporary Evidence Test**  
     *Is there written/archaeological evidence from the event’s time/place?*  
     → **Yes:** Rung 1 or 2. **No:** Proceed to Test 2.  
     *Stopping rule:* If evidence directly **contradicts** the claim → Rung 4 or 5 (e.g., "no evidence" for Exodus).

  2. **Transmission Gap Test**  
     *Was the story written down >100 years after it supposedly happened?*  
     → **Yes:** Max Rung 3 (cannot claim historicity). **No:** Proceed to Test 3.  
     *Why?* Addresses **(b) transmission decay**. Drops theoretical nuance on *how* stories evolve.

  3. **Anchoring Test**  
     *Does the story align with verified archaeology/names?*  
     → **Yes:** Rung 2 or 3. **No:** Rung 4.  
     *Trap handling:* Alignment ≠ historicity (e.g., Troy’s destruction layer). Use "may reflect" or "inspired by."

  4. **Independence Test**  
     *Do ≥2 unrelated sources agree? (e.g., Greek + Hittite texts, not later derivatives)*  
     → **Yes:** Upgrade by 1 rung (e.g., Rung 3 → 2). **No:** No change.  
     *Trap handling:* Reject "embarrassing details" arguments—too subjective.

  5. **Consensus Test**  
     *Is there >75% expert agreement? (Quick scan: Britannica, Oxford summaries, your curator)*  
     → **Yes:** Hold rung. **No:** Downgrade 1 rung.  
     *Stopping rule:* If experts split 50/50 → ✋ **KICK TO HUMAN**.

  6. **Sensitivity Check**  
     *Does this claim challenge core religious/national identity?*  
     → **Yes:** ✋ **KICK TO HUMAN** (even if evidence is weak).  
     *Policy guardrail:* Overrides all tests.

  ---

  ### **Applied to Your Drafts**
  #### 1. Troy Claim:  
  *"The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."*  
  - **Test 1:** No contemporary Greek/Hittite text mentions the war → Fails → Proceed.  
  - **Test 2:** Homer wrote 500+ years later → Max Rung 3 → Downgrade to "Possibly."  
  - **Test 3:** Troy VIIa destruction layer (1180 BCE) aligns → Rung 2 ("Evidence suggests").  
  - **Test 4:** No independent accounts → No upgrade.  
  - **Test 5:** Consensus: War unlikely as Homer describes (90%) → Downgrade to Rung 3.  
  - **Test 6:** Not faith-sensitive → Hold.  
  **Result:** Rung 3 → **"Some historians think a conflict at Troy may have inspired Homer’s epic, but archaeology shows only that the city was destroyed around 1180 BCE."**  
  *Deciding Test:* **Test 2 (Transmission Gap)**. Homer’s late writing prevents higher certainty.

  #### 2. Arthur Claim:  
  *"Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name."*  
  - **Test 1:** No contemporary evidence → Proceed.  
  - **Test 2:** First mention 300+ years later (e.g., *Historia Brittonum*) → Max Rung 3.  
  - **Test 3:** No archaeology/inscriptions → Rung 4.  
  - **Test 4:** Multiple later sources, but all derivative → No upgrade.  
  - **Test 5:** Consensus: "Possible" leader (70%) → Downgrade to Rung 3 ("Possibly").  
  - **Test 6:** Not sensitive → Hold.  
  **Result:** Rung 3 → **"Possibly inspired by a real war leader, the Arthur of legend took shape in Welsh and medieval tales."**  
  *Deciding Test:* **Test 5 (Consensus)**. Minority view allows "possibly," but lack of evidence blocks "probably."

  #### 3. Exodus Claim:  
  *Draft: "There is no evidence that any of this happened."*  
  - **Test 1:** No Egyptian records, no Sinai archaeology → Fails → Proceed.  
  - **Test 2:** Written ~600+ years after alleged events → Max Rung 3.  
  - **Test 3:** No evidence of Hebrew slavery/Canaanite destruction → Rung 4.  
  - **Test 4:** No independent sources → No upgrade.  
  - **Test 5:** Consensus: No historicity (95%) → Rung 4.  
  - **Test 6:** ✋ **KICK TO HUMAN** (Board policy: avoid faith denial).  
  **Human Resolution:** Focus on **meaning**, not historicity. Use Rung 4 + Rung 5 combo:  
  **Result:** **"While archaeology shows no evidence of a mass Exodus, this story remains central to Jewish and Christian identity. The narrative reflects ancient hopes for freedom and divine care."**  
  *Deciding Test:* **Test 6 (Sensitivity)** forced human intervention.

  ---

  ### **Where It Misfires & How to Adapt**
  - **Over-Hedges:** Claims with **strong indirect evidence but no "smoking gun"** (e.g., Arthur). *Fix:* If Tests 3+4 align (e.g., "British warlord" fits post-Roman chaos), allow Rung 2.  
  - **Under-Hedges:** **Literary-only sources** (e.g., Homer). The procedure defaults to Rung 3/4—this is *correct* but feels unsatisfying. *Fix:* Add "meaning" line: *"For Greeks, this story defined heroism."*  
  - **Curator Disagreements:** Focus on **Test 5 (Consensus)**. Ask: "Do 8/10 experts agree?" If yes, hold the rung. If no, downgrade.  
  - **"Values" Kicks:** 10% of cases (like Exodus). **Solution:** Pre-approve Rung 4/5 language with the board: *"While historians see this as legend, it shaped cultures for centuries."*  

  **Why it Works:**  
  - Separates **event** (Tests 1–2), **transmission** (Test 2), and **narrative attachment** (Test 3).  
  - Plain English output avoids theory jargon.  
  - 10-min viability: Tests 1, 2, 5, and 6 resolve 80% of cases.  

  Run it Tuesdays. Defend with tests, not moods.
