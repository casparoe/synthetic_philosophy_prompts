prompt: |-
  I'm a phd student in philosophy of mind and action and i'm putting together the take-home for our upper-level practical reasoning seminar. I keep feeling like the absent-minded driver problem gets taught in this really shallow way where students just memorize the belief-desire breakdown and call it a day, but I want them to actually wrestle with where the failure lives—like, is it a failure of reasoning proper, or is it something subpersonal that never even touched the agent's deliberation?

  So here's what I need: an essay question that starts with the standard absent-minded driver—she means to stop at the grocery store but takes the usual exit home out of pure habit—but then injects a twist: she's driving a car with an adaptive gps that has learned her commute patterns and automatically overrides her entered destination, rerouting her home despite her explicit intention to go elsewhere. The question should ask whether this counts as the same practical error, or whether the presence of an external predictive system creates a structurally different kind of breakdown—maybe closer to extended cognition misfiring, or a conflict between personal-level planning and subpersonal anticipation. I want students to have to actually decide, not just describe both sides.

  Please write the exam prompt itself, then a model answer around 600 words, and a marking scheme for 20 marks total that lists the specific moves an A answer must contain—like clearly seperating personal-level intention from the gps's subpersonal mechanism and explaining why the error isn't just 'habit'—versus the mistakes that should drop a B answer to the superficial retelling of the classic case with the twist tacked on at the end. This is for third-year undergrads with 90 minutes, and please don't ask for citations or reading lists since i want this usable for people working offline.
