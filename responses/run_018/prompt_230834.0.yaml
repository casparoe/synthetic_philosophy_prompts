prompt: |-
  I am setting the final examination for an upper-level seminar on medieval Jewish philosophy, and I want one essay question on Maimonides' explanation of the sacrificial cult in Guide of the Perplexed III.32. My students have read the chapter in the Friedländer translation, and I specifically want to keep them away from the stock summary — that sacrifices were a concession to idolatrous habits — and make them work within the argument itself. In particular, the question should turn on the place where Maimonides anticipates that his reader will find the view repellent.

  Here is the passage I want the question anchored in (Maimonides, Guide of the Perplexed, III.32, Friedländer translation):

  "Many precepts in our Law are the result of a similar course adopted by the same Supreme Being. It is, namely, impossible to go suddenly from one extreme to the other: it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed. [...] For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings, and of things imaginary and unreal, and commanded us to serve Him in the same manner; [...] By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established; this result was thus obtained without deterring or confusing the minds of the people by the abolition of the service to which they were accustomed and which alone was familiar to them. I know that you will at first thought reject this idea and find it strange; you will put the following question to me in your heart: How can we suppose that Divine commandments, prohibitions, and important acts, which are fully explained, and for which certain seasons are fixed, should not have been commanded for their own sake, but only for the sake of some other thing: as if they were only the means which He employed for His primary object?"

  Please write three things. (1) An exam question of one or two sentences, to be answered in two hours with the Guide in hand, instructing students to reconstruct and evaluate the argument of this passage and explicitly requiring them to weigh the anticipatory objection Maimonides raises in its final paragraph. (2) A model answer of about 800 words that does more than restate the concession thesis: it should distinguish the historical-psychological claim about why the sacrificial forms were legislated from the stronger claim that the commandments were given merely as means, explain how the developmental analogy earns its keep, and then take a clear position on whether Maimonides escapes his own objection. (3) A marking scheme worth 20 marks, made up of five must-hit points of 4 marks each, with a one-line note after each point naming the identifiable error made by a candidate who misses it. The scheme should reward the specific move of separating an account of the form of the law from a denial that the commandments were commanded for their own sake, and should penalize mere paraphrase.
