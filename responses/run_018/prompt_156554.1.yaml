prompt: |-
  I am a high school senior presenting at an interscholastic philosophy symposium, and I need a prep sheet for the Q&A. I will defend the claim that the moral equality of combatants fails, not because soldiers in just wars gain special moral status—the standard reversal defended in recent literature—but because soldiers in unjust wars occupy an institutional role structurally analogous to agents within a systematically deceptive authority. On my view, this generates an asymmetry in moral liability mediated by an epistemically corrupted chain of command, without granting just-war combatants any exceptional privilege; they remain ordinary moral agents, while unjust-war combatants are uniquely liable to defensive harm in virtue of that institutional corruption rather than collective guilt. The audience will be undergraduate ethics and political-philosophy majors plus one faculty advisor; they are sympathetic to Walzer-style equality, familiar with the standard individual-liability critiques, and particularly concerned that institutional arguments collapse into collective punishment or deny soldiers reasonable epistemic excuses. Give me the objections in the order they are most likely to come, phrased as those students and the advisor would phrase them, with for each: whether to concede or hold, a concise reply suited to a five-minute exchange, the weakest link in that reply, and the one objection—specifically about whether epistemic corruption can be attributed without violating moral individualism—that I am hoping they do not ask. Include also the point in my own position that is most vulnerable and that I should prepare to defend openly rather than rely on them missing it.
