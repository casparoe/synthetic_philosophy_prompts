prompt: |-
  Write the full specification of desiderata that any adequate theory of moral responsibility must satisfy if it is to survive Galen Strawson’s Basic Argument against true moral responsibility. Build the standard before scoring any contender.

  For each desideratum, state the precise phenomenon or case it must cover—such as halting the regress of self-formation, preserving the distinction between being a causal source of an action and being genuinely deserving of blame, accommodating both determinism and indeterminism without collapse, maintaining psychological continuity across temporal gaps, and explaining whether and how an agent can be the originator of her own mental states. Behind each, give the consideration that makes it non-negotiable versus a preference of one camp, and flag any pair you suspect is jointly unsatisfiable given Strawson’s reasoning—especially whether any view can both stop the regress and retain the kind of self-origination that moral responsibility is supposed to require.

  As a constructed stress-test, include the requirement that the theory handle diachronic normative integration in branching form: present normative commitments depend on prior mental states that were themselves shaped by earlier commitments in a non-linear, branching structure rather than a simple linear chain. Treat this not as a standard formulation but as a genuine constraint the theory must accommodate or explain away.

  Then, briefly, indicate how compatibilism, libertarianism, and Strawsonian impossibilism (or a revisionist alternative) fare against your list—only enough to reveal which criteria do the real exclusionary work. Keep the weight on the criteria and their motivating cases, not on the scorecard.
reasoning: |-
  Okay, the user wants a detailed specification of desiderata for any theory of moral responsibility that can withstand Galen Strawson's Basic Argument. Let me start by recalling Strawson's argument. He claims that for true moral responsibility, an agent must be the cause of themselves (causa sui), leading to an infinite regress. No one can be responsible for how they are formed, so moral responsibility is impossible. 

  The user mentioned specific phenomena: halting the regress, distinguishing causal source from deserving blame, accommodating determinism and indeterminism, psychological continuity, and self-origination of mental states. They also added a stress-test about diachronic normative integration in branching structures. I need to break these down into clear desiderata with non-negotiable reasons.

  First, Regress Halting. Strawson's core issue is the infinite regress. Any theory must stop this without relying on an uncaused cause. The key is to find a way responsibility doesn't require self-creation. Maybe grounding in something non-arbitrary, like reasons-responsiveness. But how? The challenge is avoiding circularity. Desideratum 1 must address this.

  Next, Sourcehood without Self-Creation. Differentiate between being the causal source and deserving blame. The non-negotiable point here is that blame shouldn't apply if the action wasn't truly the agent's own. For example, manipulation cases. If someone is brainwashed, they might cause an action but not deserve blame. So the theory must explain why some causes are blameworthy and others aren't.

  Accommodating Metaphysical Neutrality. The theory shouldn't collapse under determinism or indeterminism. Determinism might lead to external causes, while indeterminism introduces randomness. Responsibility requires control, so both extremes are problematic. The theory must navigate between these without losing the agent's control.

  Psychological Anchoring. Agents change over time, but responsibility for past actions requires continuity. If an agent radically changes, are they still responsible? The theory must define what kind of continuity is necessary. But here's a potential conflict with Regress Halting. If you need psychological traits anchored, how do you avoid tracing them back to factors outside the agent's control?

  Self-Origination of Mental States. Can agents be the originators of their own mental states? Strawson argues you'd need to create your reasons, desires, etc., leading to regress. The desideratum here is that the theory must explain how mental states can be truly the agent's own without self-creation. But this might clash with Regress Halting. If you halt the regress by accepting some given factors, how do those factors become "owned"?

  Diachronic Normative Integration (Stress Test). This involves branching commitments. For example, an agent's current values might stem from past choices that branched non-linearly. The theory must handle such complexity without losing responsibility. This tests flexibility but might conflict with Psychological Anchoring if the branching leads to fragmented identity.

  Now, potential conflicts. Regress Halting and Self-Origination seem jointly unsatisfiable per Strawson. Halting the regress might require accepting non-self-created elements, but self-origination needs those elements to be self-made. How can a theory satisfy both? Maybe compatibilists ground in reasons-responsiveness, but is that enough? Libertarians might appeal to non-deterministic choices, but randomness could undermine control. Impossibilists reject both, saying it's impossible.

  When applying to theories: Compatibilism might satisfy Sourcehood, Neutrality, and Anchoring but struggle with Regress and Self-Origination. Libertarians might handle Regress and Self-Origination via indeterminacy but fail at Sourcehood (randomness) and Neutrality (requiring indeterminism). Impossibilists reject all as impossible, especially Regress and Self-Origination.

  The user's deeper need might be understanding if any theory can truly overcome Strawson's argument or if moral responsibility is inherently flawed. They might seek clarity on philosophical debates or resources for academic work. The stress-test adds real-world complexity, pushing theories beyond abstract cases. Highlighting conflicts shows where each theory fails, helping the user see the core challenges in moral responsibility theories.
answer: |-
  Here is the full specification of desiderata for any theory of moral responsibility aiming to survive Strawson's Basic Argument, structured to prioritize the criteria and their grounding cases:

  ---

  ### **Core Desiderata Specification**  
  *(Non-negotiable requirements derived from Strawson’s challenge)*  

  1. **Regress Halting (Causal Termination)**  
     - **Phenomenon**: The infinite regress of "self-creation" (to be responsible for act X, I must be responsible for the mental state M causing X; to be responsible for M, I must be responsible for the prior state M-1, ad infinitum).  
     - **Non-negotiable reason**: Strawson’s argument collapses if the regress is not terminated non-arbitrarily. Requires a principled *stopping point* that neither invokes *causa sui* nor externalizes agency.  
     - **Stress point**: Must avoid bootstrapping (e.g., "character" or "values" that are themselves unchosen).  

  2. **Sourcehood without Self-Creation (Non-Exploitative Causation)**  
     - **Phenomenon**: Distinguishing *being the causal source* of an action (e.g., a manipulated agent causing harm) from *deserving blame/praise* (e.g., the same act performed autonomously).  
     - **Non-negotiable reason**: Moral responsibility requires more than causal efficacy (per Strawson’s "luck" objection). Must explain why some causes confer ownership.  
     - **Key case**: Brainwashing victims vs. agents with authentic values.  

  3. **Metaphysical Neutrality (Determinism/Indeterminism Resilience)**  
     - **Phenomenon**: Preserving responsibility under both deterministic causation (e.g., an agent acting from ingrained habits) and indeterministic scenarios (e.g., torn decisions with probabilistic elements).  
     - **Non-negotiable reason**: Responsibility must not collapse into fatalism (if determined) or randomness (if undetermined). Control must be retained in both worlds.  
     - **Failure mode**: "Lucky" indeterministic choices that bypass agency.  

  4. **Psychological Anchoring (Temporal Continuity)**  
     - **Phenomenon**: Maintaining responsibility across time-gaps (e.g., responsibility for past crimes after radical personality change).  
     - **Non-negotiable reason**: Responsibility is inherently diachronic; discontinuity threatens identity conditions for blame.  
     - **Threshold test**: An amnesiac war criminal—is blame preserved?  

  5. **Self-Origination of Mental States (Authorization Condition)**  
     - **Phenomenon**: Explaining how an agent can be the *author* of their desires/commitments (e.g., choosing to cultivate honesty despite initial indifference).  
     - **Non-negotiable reason**: Responsibility requires mental states to be "truly mine" (Strawson: if not self-caused, they’re "externally implanted").  
     - **Paradox**: Self-origination demands regress-halting (Desideratum 1) *without* abandoning authorship.  

  ---

  ### **Constructed Stress-Test**  
  **Diachronic Normative Integration (Branching Structure)**  
  - **Phenomenon**: Normative commitments (e.g., a vow of non-violence) arising from *non-linear self-shaping*:  
    - Prior mental states (e.g., adolescent rebellion → moral awakening) influence later commitments, but via branching paths (e.g., rebellion *could* have led to cynicism *or* idealism).  
    - Present responsibility depends on integrating these branching precursors.  
  - **Constraint**: The theory must explain how responsibility adheres to commitments emerging from *non-deterministic self-constitution* without fragmenting identity.  
  - **Non-negotiable reason**: Real-world agency involves recursive self-revision with open possibilities—ignoring this idealizes agency.  

  ---

  ### **Suspected Tensions**  
  - **Regress Halting (1) vs. Self-Origination (5)**: Strawson’s core dilemma. Halting the regress (e.g., by accepting "given" psychological traits) threatens self-origination; insisting on self-origination invites regress. *No theory may satisfy both without contradiction*.  
  - **Sourcehood (2) vs. Branching Integration (Stress-Test)**: If responsibility depends on *actual* causal history (Sourcehood), branching possibilities may undermine ownership of the *actual* path.  

  ---

  ### **Theories Scored Against Criteria**  
  *(Brief indication of fault lines)*  

  - **Compatibilism (e.g., reasons-responsiveness)**  
    - *Strengths*: Excels at Sourcehood (2), Metaphysical Neutrality (3), Psychological Anchoring (4).  
    - *Failures*: Regress Halting (1) unresolved (traits "given"); Self-Origination (5) unmet (mental states not self-caused); Branching Integration strained (history fixed).  
    - *Exclusionary flaw*: Cannot halt the regress without externalizing agency.  

  - **Libertarianism (e.g., agent-causation)**  
    - *Strengths*: Targets Regress Halting (1) via uncaused causes; emphasizes Self-Origination (5).  
    - *Failures*: Sourcehood (2) threatened by randomness; Metaphysical Neutrality (3) broken (requires indeterminism); Branching Integration risks agential fragmentation.  
    - *Exclusionary flaw*: Sourcehood compromised by indeterministic luck.  

  - **Strawsonian Impossibilism/Revisionism**  
    - *Strengths*: Exposes incoherence in Regress Halting (1) and Self-Origination (5).  
    - *Weaknesses*: Rejects all desiderata as illusory; Branching Integration irrelevant (no responsibility exists).  
    - *Exclusionary force*: Declares criteria 1–5 *jointly unsatisfiable* by any theory.  

  ---

  ### **Conclusion**  
  The exclusionary work is done primarily by **Regress Halting** and **Self-Origination**. Strawson’s argument suggests these are *logically incompatible*: any "solution" to one undermines the other. The **Branching Integration** stress-test exacerbates this by demanding temporal coherence in non-linear self-constitution—a challenge that magnifies the regress problem. *No extant theory satisfies all criteria*, with impossibilism arguing the list itself proves responsibility’s incoherence. The desiderata serve less as a checklist than an aporetic map of agency’s conceptual limits.
