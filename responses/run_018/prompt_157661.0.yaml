prompt: |-
  hey im chairing a small amnesty review board for a transitional justice process (somewhere between south africa's TRC and argentina's CONADEP, but way smaller staff and zero lawyers on call). we get about three petitions a week from mid-level people asking for conditional amnesty in exhange for full disclosure. i need a reusable decision procedure — like a flowchart in words — that my panel can run in under an hour, with the steps in order, what counts as passing each step, where it stops with a hard no, and where it has to hand off to human judgment because its values not facts.

  the principle im trying to operationalize is "proportional accountability modulated by epistemic repair," but thats still too vague. specifically i want the procedure to capture two things standard frameworks miss: first, the "double hermeneutic gap," where a perpetrators account can be factually correct but still fail to repair how victims understand the harm (it explains the mechanism but erases the meaning); second, "narrative non-substitutability," the idea that for certain harm categories — like sexual violence as systematic terror or destruction of cultural archives — no truthful testimony can substitute for some penal accountability, regardless of disclosure value.

  so: write the checklist/procedure with ordered tests, pass/fail or judgment-call markers, hard stop conditions, and explicit "this is where you just decide" nodes. then apply it to three petitions: (1) a former intelligence officer who can map out unknown clandestine detention sites but personally ordered torture at two of them; (2) a low-level logistics clerk who was clearly coerced and offers only redundant paperwork; (3) a mid-rank officer whose testimony is factually precise about a massacre but frames every victim death as "unfortunate collateral damage from legitimate counter-insurgency," opening a hermeneutic gap survivors have to close themselves. include one case where the procedure spits out an answer you'll hate — probably the intelligence officer, where high epistemic value collides with direct perpetration but narrative non-substitutability doesnt apply since the harm is physical detention not cultural destruction, so the procedure might lean yes despite your gut.

  fix the role (me, chair, 48-hour turn-around, sign personally), frequency (three a week), stakes (wrong yes = impunity; wrong no = lost historical record), constraints (no legal staff, no citation searches, must document reasoning in two sentences). make sure the procedure says what to do when info is missing, and be honest about which steps are just judgment calls in a nice coat.

  also please dont ask me to cite philosophers or include a bibliography — i dont have library access and neither will the model running this. write it casual, maybe with a typo or two.
reasoning: |-
  Okay, the user is chairing a small amnesty review board for a transitional justice process. They need a reusable decision procedure that's efficient—handling three petitions a week in under an hour per case. The key challenge is operationalizing principles like "proportional accountability modulated by epistemic repair," while addressing gaps in standard frameworks, such as the "double hermeneutic gap" and "narrative non-substitutability."

  First, I need to break down their requirements. The procedure must be a step-by-step flowchart in words, with clear pass/fail steps, hard stops, and judgment call markers. It should handle missing info and explicitly state where decisions are value-based. The user emphasized avoiding academic references and keeping it practical, casual, with no lawyers involved.

  The core principles to embed are:
  - **Double hermeneutic gap**: Even if facts are correct, the perpetrator's narrative might ignore the victims' perspective, leaving the harm unaddressed.
  - **Narrative non-substitutability**: For certain harms like sexual violence or cultural destruction, testimony alone isn't enough—some penal accountability is necessary regardless of disclosure.

  Looking at the example cases:
  1. **Intelligence officer**: Offers valuable info on detention sites but personally ordered torture. High epistemic value but direct perpetration. The procedure might lean towards amnesty, conflicting with the user's gut feeling.
  2. **Logistics clerk**: Coerced, redundant paperwork. Likely a quick reject.
  3. **Mid-rank officer**: Factually precise but frames deaths as collateral damage, creating a hermeneutic gap. This tests the narrative repair aspect.

  Stakes are high: wrong yes grants impunity, wrong no loses historical records. Constraints include no legal staff, quick turnaround, and minimal documentation.

  I'll structure the procedure in stages:
  1. **Initial triage**: Hard stops for incomplete petitions or non-cooperation.
  2. **Epistemic value check**: Does the testimony add new info? Redundant info fails.
  3. **Harm categorization**: Identify the harm type. Apply narrative non-substitutability here—sexual violence/cultural destruction are automatic rejects for amnesty.
  4. **Perpetrator role assessment**: Direct vs. indirect involvement. Direct perpetrators need stricter scrutiny.
  5. **Narrative repair test**: Does the testimony acknowledge harm from the victims' perspective? Judgment call on hermeneutic gap.
  6. **Proportionality balance**: Weigh epistemic value against accountability gaps. Another judgment call.

  For the intelligence officer case: Harm is physical detention (not cultural), so narrative non-substitutability doesn't apply. High epistemic value might override accountability concerns, leading to amnesty—even if it feels wrong. This demonstrates the procedure's objectivity but also its limits.

  The user needs honesty about where steps are subjective. Emphasize that steps 5 and 6 are judgment calls dressed as checks. Also, handle missing info by requiring clarification or rejecting if critical.
answer: |-
  Here's your reusable amnesty decision procedure – think of it as a IKEA manual for impunity, minus the allen wrench. We'll call it the **Accountability/Epistemic Repair Filter (AERF)**. Print this, stick it on the wall, yell at panelists who skip steps.

  ---

  **THE AERF PROCEDURE**  
  *(Avg. runtime: 45 mins. Clock’s ticking. Brew coffee first.)*

  **STEP 0: PAPERWORK SANITY CHECK**  
  - *Task:* Open file. Verify petition has: (a) Signed disclosure statement, (b) Specific harm categories confessed (checkboxes: torture/killing/disappearance/sexual violence/cultural destruction/etc.), (c) Names/dates/locations if known.  
  - *Pass:* All present. Move to STEP 1.  
  - *Fail:* Missing (a) or (b). **HARD STOP. REJECT.** Note: "Incomplete submission."  
  - *Judgment Call:* Missing only (c)? Proceed but flag – gaps hurt epistemic value later.

  **STEP 1: EPISTEMIC VALUE TEST (The "New Intel?" Gate)**  
  - *Task:* Does this reveal **substantive new facts** we couldn’t prove otherwise? (e.g., mass grave locations, chain of command, methods). Ignore "context" or opinions.  
  - *Pass:* Yes, confirms/uncovers key unknowns (e.g., "IDs 3 clandestine sites"). Move to STEP 2.  
  - *Fail:* Redundant or trivial (e.g., "admits waterboarding... which we already have 200 confessions about"). **HARD STOP. REJECT.** Note: "No material disclosure."  
  - *Judgment Call:* "New but minor?" (e.g., "names one low-level collaborator"). Proceed but mark "low epistemic weight."

  **STEP 2: HARM CATEGORY SCREEN (Narrative Non-Substitutability Filter)**  
  - *Task:* What’s the **worst harm category** disclosed?  
  - *Pass:* Physical torture, detention, killings, property destruction. Move to STEP 3.  
  - *Fail:* **Sexual violence as systematic terror OR Cultural archive destruction.** **HARD STOP. REJECT.** Note: "Non-substitutable harm." *(Why: No testimony fixes this – gotta have trials.)*  
  - *Judgment Call:* "Sexual violence but isolated incident?" Debate 5 mins. If systemic intent or terror pattern, REJECT. Else, proceed cautiously.

  **STEP 3: PERP ROLE ASSESSMENT (Direct/Indirect Scale)**  
  - *Task:* How hands-on was their harm?  
  - *Pass:* "Ordered" (gave commands), "Designed" (planned systems), "Directly inflicted" (pulled trigger). Move to STEP 4.  
  - *Fail:* **Purely bureaucratic/coerced with zero agency** (e.g., "forced to file papers at gunpoint"). **SOFT STOP?** Move to STEP 4 but flag "low accountability weight."  
  - *Judgment Call:* "Enabled but didn’t touch?" (e.g., drove victims to site). Mark "medium accountability."

  **STEP 4: NARRATIVE REPAIR CHECK (Hermeneutic Gap Detector)**  
  - *Task:* Read testimony’s **framing of victims**. Does it:  
    - (a) Explicitly name harm *as victims experienced it* (e.g., "torture caused lifelong trauma"),  
    - (b) Acknowledge perpetrator/state responsibility (not "regrettable accidents"),  
    - (c) Avoid justifications ("necessary for order")?  
  - *Pass:* All 3 present. Move to STEP 5.  
  - *Fail:* **Openly dehumanizes/denies victimhood** (e.g., "terrorists deserved it"). **HARD STOP. REJECT.** Note: "Denial of victim dignity."  
  - *Judgment Call:* **"Factual but cold"** (e.g., "collateral damage" framing)? This is the **GAP ZONE**. Mark "hermeneutic deficit." Proceed to STEP 5 – but accountability cost just went up.

  **STEP 5: ACCOUNTABILITY/EPISTEMIC SCALE (The Balancing Act)**  
  - *Task:* **Weigh** (A) Epistemic value (STEP 1) vs. (B) Accountability gap (Role from STEP 3 + Narrative failure from STEP 4). Use gut + whiteboard:  
    - High (A) + Low (B) = **YES**  
    - Low (A) + Any (B) = **NO**  
    - High (A) + High (B) = **PANEL FIGHT CLUB**  
  - *Judgment Call:* **This is 90% vibes.** Debate 10 mins max. Ask: *"If we grant this, will victims burn down our office? Will historians weep?"*  
  - *Output:* YES / NO / NEEDS CONDITIONS (e.g., "must apologize publicly").

  **STEP 6: DOCUMENT**  
  - *Task:* Write 1-2 sentence reason. Template: *"Granted/denied due to [HIGH/LOW] epistemic value + [Role] + [Narrative gap if any]."*  
  - *Example:* "Granted. High intel on sites offsets commander role. Gap: mechanical harm framing."  
  - **Sign. Stamp. Next case.**

  ---

  **APPLYING AERF TO YOUR PETITIONS:**

  **Case 1: Intelligence Officer**  
  - STEP 0: Pass (full doc).  
  - STEP 1: **Pass (HIGH)** – maps unknown sites.  
  - STEP 2: Pass (physical detention/torture, not cultural/sexual terror).  
  - STEP 3: **Pass (HIGH accountability)** – ordered torture.  
  - STEP 4: ? Assume he says "interrogations necessary." **GAP ZONE** (cold framing).  
  - STEP 5: **HIGH A + HIGH B = FIGHT CLUB**.  
    - *Scale Tilt:* Intel is critical (mass graves?), but he’s a hands-on torturer who avoids responsibility.  
    - **AERF Output: YES (with conditions)** – e.g., "must testify publicly & name victims."  
    - *Why you’ll hate it:* Epistemic value outweighs accountability gap. Gut says "hang him," procedure says "use him." Brutal but functional.

  **Case 2: Logistics Clerk**  
  - STEP 0: Pass.  
  - STEP 1: **FAIL** – redundant paperwork. **HARD STOP. REJECT.** Note: "No material disclosure."  
  - *Done in 10 mins. Go drink water.*

  **Case 3: Mid-Rank Officer (Massacre)**  
  - STEP 0: Pass.  
  - STEP 1: **Pass (MEDIUM)** – precise but likely confirms known event?  
  - STEP 2: Pass (killings).  
  - STEP 3: **Pass (HIGH)** – commanded massacre.  
  - STEP 4: **FAIL** – "collateral damage" is **classic hermeneutic gap**. **HARD STOP. REJECT.** Note: "Denial of victimhood."  
  - *Why:* Even with facts, his framing forces survivors to relive trauma just to rebut him. Not worth the epistemic crumbs.

  ---

  **PROCEDURE NOTES:**  
  - **Missing Intel?** If gaps in STEP 1 or STEP 4, assume worst interpretation. Trust issues = epistemic penalty.  
  - **"Judgment Call" Transparency:** Steps 4 & 5 are values in a trenchcoat. Admit it in panel notes: "Vote: 2-1 on hermeneutic deficit."  
  - **Why it Works:** Bakes your two principles into hard filters (STEP 2 = non-substitutability; STEP 4 = gap check) before the messy tradeoff.  
  - **Risk:** Yes, the intel officer might skate. But lost graves hurt victims too. AERF prioritizes truth when penal justice is impossible anyway.  

  *Chair pro-tip: When STEP 5 gets bloody, ask "What would Argentina do?" Then ignore that and vote. You got this – sign the papers and sleep.* 😴
