  hey, quick question for my phil of sci seminar. my adivsor keeps comparing Neurath's ISOTYPE picture-language to modern emoji-based communication -- like, both skip syntax and just drop universal icons stright into meaning, so they're imune to translation errors and can carry scientific claims directly. i want to audit how far that actually holds. can you lay out the correspondence -- what plays the role of the pictogram, the emoji keyboard, the lack of grammar, the 'direct reference'? then where it breaks: for one thing, Neurath insisted on transformation rules (Transformationsregeln) for combining icons, which emoji strings totally lack. also ISOTYPE was designed to sit inside a physicalist protocol-language, not float free like texts. and there's that thing where Neurath rejected any meta-language for pictures, which doesn't map onto how emoji are parsed by platform algorithms. does the analogy smuggle in the idea that visual = direct = universal, and if so, does that actually support Neurath's view or just our modern intuition? or does the breakdown kill the comparision entirely?
