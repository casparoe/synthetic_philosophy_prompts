prompt: |-
  As a journalist who writes about science and philosophy, I am trying to understand a precise conceptual tension within the scale argument for insect welfare. The familiar version holds that, because insects outnumber vertebrates by many orders of magnitude, even a very low probability of sentience yields an enormous expected moral weight. I want to move past that headline formulation and examine what happens when we combine such aggregation with a specific epistemic posture I will call proportional humility: the view that our credence in a being's sentience should not be assigned as a flat prior across phyla, but should decay non-linearly with evolutionary distance from organisms whose sentience we treat as established, so that the probability assigned to an insect is suppressed by a steep function of phylogenetic divergence rather than being merely small. If that suppression is strong enough, it may collapse the expected value despite the vast cardinality. Opposing this is what I will call morphological continuity—the observation that nociceptive and integrative neural architectures are conserved across distant phyla, which might justify a much flatter decay curve and thus preserve the scale argument. The conceptual issue I need mapped is whether these two commitments can be coherently joined without contradiction. Specifically, does applying a non-linear epistemic discount to a scale-based aggregation double-count the uncertainty—once in the probability assignment and once in the moral weighting—or does it smuggle in an unjustified linear prior about evolutionary progress? And if the scale argument survives this pressure, what exactly does morphological continuity contribute that a simple uniform prior cannot? Please explain the architecture of this tension without providing a bibliography, reading list, or citations; I need the conceptual map itself. The explanation should be rigorous enough for a scientifically literate general reader, but please do not assume familiarity with specialized literature on insect cognition unless you define the necessary terms.
reasoning: |-
