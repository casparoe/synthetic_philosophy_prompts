  3. **Semantic thesis**: The meaning of existence claims is fundamentally quantificational. This is Quine's view ("to be is to be the value of a variable"). Defensible but not uncontroversial. It supports dismissing ontological worries by reducing them to quantificational commitments.
  4. **Metaphysical thesis**: Existence isn't a property of individuals but a precondition for having properties. Kantian view, defensible but contentious. It might dismiss ontological debates by framing existence as not a substantive property.

