answer: |-
  Alright, let's build that quiz! Based on your coffee debate, here's a **Moral Worth Sorter** with 7 concrete scenarios. No philosophy jargon, just real-world cases. For each, pick the option that *best* matches your gut feeling. I’ll map your answers afterward.

  ---

  ### **The Quiz: What’s Your Moral Motive?**
  *(Answer A, B, or C for each)*

  1. **You find a wallet full of cash. You return it because you believe it’s your moral duty.**  
     A. *This action has moral worth because duty is what matters.*  
     B. *The worth comes from caring about the owner, not "duty" rules.*  
     C. *"Moral worth" is overrated—just return the damn wallet.*  

  2. **You return a lost wallet because you feel awful imagining the owner’s panic.**  
     A. *This has moral worth—compassion is key.*  
     B. *Worth only if you *chose* compassion, not if it’s just a feeling.*  
     C. *The action’s what counts; motives are bonus trivia.*  

  3. **You return a wallet hoping for a reward.**  
     A. *No moral worth—selfish motives ruin it.*  
     B. *Still has worth if you *also* felt it was right, even with reward hopes.*  
     C. *Who cares? The owner got it back.*  

  4. **You try to steal a wallet but accidentally return it (e.g., you panic and hand it to a cop).**  
     A. *Zero moral worth—you intended theft.*  
     B. *Worth exists if your guilt *tracked* the wrongness, even if you didn’t "choose" good.*  
     C. *Result > motives. Theft failed, return happened.*  

  5. **You dive into a river to save a drowning kid purely on instinct—no thought involved.**  
     A. *Full moral worth—good instincts count!*  
     B. *Worth *only* if you’d have done it after thinking (instincts don’t cut it).*  
     C. *The kid’s alive. That’s the win.*  

  6. **You "save" a drowning kid only because you think it’s a rare, expensive robot.**  
     A. *No moral worth—you valued property, not a person.*  
     B. *Worth exists if your urge to "save" it *aligned* with moral truth (even for wrong reasons).*  
     C. *The outcome’s identical. Motives are psychology, not ethics.*  

  7. **You return a wallet because you’re terrified of ghost hauntings (even though you think stealing is fine).**  
     A. *No worth—fear isn’t moral, and you don’t believe it’s wrong.*  
     B. *Worth! Your fear *tracked* the immorality of stealing, even if your brain didn’t.*  
     C. *Ghosts or not—the wallet’s returned. Done.*  

  ---

  ### **How to Score Your Answers**
  Tally your A/B/C choices. Then, match your **most common letter** to the branches below.  
  *(Note: "De re concern" = caring about rightness itself, regardless of motive type)*

  | **Your Dominant Letter** | **Your Moral Worth Branch**                                   | Key Traits                                                                 |
  |--------------------------|---------------------------------------------------------------|----------------------------------------------------------------------------|
  | **Mostly A**             | **Pure Duty-Worth**                                           | Worth ONLY from conscious duty/principle. Feelings? Suspicious.            |
  | **Mostly B**             | **Coherence View** (your "weird" one!)                        | Worth comes from emotions *tracking* moral truth, even if beliefs are wrong. |
  | **Mostly C**             | **Deflationary Zero-Worth**                                   | "Moral worth" is drama. Outcomes or character matter; motives are noise.   |
  | **Mix of A/B**           | **Sentiment-Worth** or **De Re Concern** (tree can’t split these) | Worth from EITHER good feelings OR caring about "rightness"—but not both cleanly. |

  ---

  ### **The Fine Print**
  - **Empty Combos**: Can you be **deflationary (C)** but still care about motives? *Absolutely*. The quiz ignores *character assessment* (e.g., "selfish motives make you sketchy")—it only tests "moral worth of *actions*." A deflationary person might hate "worth" talk but still judge *people* by motives.  
  - **What the Tree Can’t Do**:  
    - **Sentiment vs. De Re**: If you’re mixed A/B, it can’t split "compassion is enough" (sentiment) from "caring about rightness matters" (de re). Your debate with Jess lives on here!  
    - **Pure Duty (A) vs. Coherence (B)**: Clear split! Duty rejects feelings/instincts; coherence embraces them if they "track" truth.  
  - **Edge Cases**: If you have a tie (e.g., 3 A/3 B/1 C), lean into the scenario where you *most* disagreed with Jess 😉.  

  ---

  ### **Why This Works**
  - **No Kant Bullying**: Concrete cases only—no "do you agree with X philosopher?"  
  - **Ghosts & Robots**: Covers your requested edge cases (haunted wallets, robot confusion).  
  - **Coherence View Spotlight**: That "emotional tracking" idea is baked into the B options.  

  Fire this at Jess and see where she lands. If she picks all B’s, your "weird" view wins. If she’s all C’s… maybe skip the next coffee debate 😅.
