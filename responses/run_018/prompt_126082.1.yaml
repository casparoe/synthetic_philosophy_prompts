  The user's explicit request is for desiderata, but their deeper need seems to be understanding inherent tensions in welfare systems. They hint at a conflict: if structural unemployment is acknowledged, can individual sanctions still make sense? That's key. They might be looking for academic leverage in their seminar arguments, needing a structured framework to critique existing policies.

  Next, I'll structure the desiderata into categories: cases, distinctions, empirical constraints. For cases, the missed appointment vs. hidden income highlights unintentional vs. deliberate non-compliance. The disabled worker vs. 'work-shy' addresses capability versus willingness. The single parent balancing care and work shows systemic barriers. These cases test the theory's fairness and practicality.

  Distinctions are vital. Moral desert (blameworthiness) shouldn't be conflated with economic contribution (what's beneficial) or administrative tractability (what's enforceable). The theory must keep these separate to avoid stigmatizing individuals based on system efficiency needs. Also, distinguishing between structural barriers and individual agency is non-negotiable; otherwise, sanctions might punish people for factors beyond their control.

  Empirical constraints include recognizing bureaucratic errors (like false fraud accusations) and stigma effects. Any theory ignoring these realities risks harming vulnerable groups. The non-negotiables here are avoiding preventable harm and ensuring due process. Ideological baggage might involve strict behavioral requirements without considering systemic issues.

  Now, the conflicts. The user's main concern is whether structural unemployment and individual sanctions can coexist. If unemployment is structural (lack of jobs), punishing individuals for not working is incoherent. This creates a dilemma: theories emphasizing structural factors struggle to justify individual sanctions. Conversely, those focusing on individual responsibility might ignore systemic barriers, leading to unfair penalties. This tension is central to their paper, so highlighting it is crucial.

  The user might also need to show how administrative categories (like 'undeserving poor') serve bureaucratic legitimacy, as the tutor suggested. If the system needs 'undeservers' to function, that reveals a problematic dependency where fairness is sacrificed for operational needs. Pointing this out could strengthen their argument against conditionality that creates such categories.

  In summary, the checklist must clarify essential criteria, expose conflicts, and provide a basis for evaluating welfare policies. The user likely wants to demonstrate that certain theoretical requirements are incompatible, especially around structural issues vs. individual accountability. Providing this framework will help them deconstruct arguments in their seminar and support their analysis of workfare and conditionality.
answer: |-
  Here’s a structured checklist of desiderata for a normative theory of welfare conditionality, centered on coherence, fairness, and empirical realism. The non-negotiables are flagged (**), while tensions and potential contradictions are explicitly highlighted.

  ---

  ### **I. Cases the Theory MUST Get Right (The Litmus Tests)**
  1.  **The "Missed Appointment" vs. "Concealed Income" Distinction:**
      *   **Must:** Treat a single missed appointment due to transportation failure/childcare crisis *fundamentally differently* from deliberate, sustained concealment of significant income.
      *   **Why:** Tests proportionality and intent. Punishing genuine bad luck/system failure like fraud erodes legitimacy and causes unjust harm. **(Non-Negotiable**)**
  2.  **The Disabled Worker Seeking Support vs. the "Work-Shy" Stereotype:**
      *   **Must:** Recognize individuals with disabilities/long-term health conditions *actively seeking suitable work or support* cannot be categorized as "unwilling" due to their condition alone. Simultaneously, must avoid validating the lazy freeloader stereotype *if empirically present* (without assuming it’s widespread).
      *   **Why:** Tests the theory's ability to separate *capacity/willingness* from *medical condition* and avoid harmful stereotypes. Sanctioning based on incapacity is unjust. **(Non-Negotiable**)**
  3.  **The Single Parent Balancing Care and Work Requirements:**
      *   **Must:** Accommodate legitimate care responsibilities (especially for young children, disabled dependents) without imposing impossible demands or penalizing parents (disproportionately mothers) for prioritizing essential care.
      *   **Why:** Tests recognition of unpaid care work and systemic barriers (childcare costs/availability). Punishing care is deeply inequitable. **(Non-Negotiable**)**
  4.  **The Long-Term Unemployed in a Depressed Local Economy:**
      *   **Must:** Acknowledge that sustained unemployment can stem from structural factors (lack of jobs, skills mismatch, discrimination) *without* automatically implying individual failing or requiring punitive sanctions.
      *   **Why:** Tests the theory's grasp of structural unemployment vs. individual agency. **(Core Tension Point - See Section IV)**

  ### **II. Essential Conceptual Distinctions the Theory MUST Preserve**
  5.  **Moral Desert vs. Administrative Tractability:**
      *   **Must:** Rigorously distinguish whether a rule exists because someone *morally deserves* punishment/support reduction, or because it's *easier to administer* (e.g., clear lines, low verification cost).
      *   **Why:** Conflating these justifies unfairness under the guise of efficiency (e.g., sanctioning easy-to-catch minor non-compliance harshly while complex fraud evades detection). **(Non-Negotiable**)**
  6.  **Economic Contribution/Incentive vs. Moral Desert:**
      *   **Must:** Separate arguments about incentivizing labor market participation/work effort (economic) from judgments about an individual's moral worthiness or blameworthiness.
      *   **Why:** "Deservingness" is a moral/status judgment; "contribution/incentive" is a functional economic argument. Conflation stigmatizes poverty and distorts policy goals. **(Non-Negotiable**)**
  7.  **Individual Agency vs. Structural Constraints:**
      *   **Must:** Provide a clear framework for assessing when non-compliance/lack of employment is *reasonably attributable to individual choices* vs. *overwhelmingly determined by systemic barriers* (job scarcity, discrimination, disability, lack of affordable childcare/transport).
      *   **Why:** Sanctions only make normative sense if genuine agency exists. Ignoring structure blames victims. **(Non-Negotiable**) & **(Core Tension Point - See Section IV)**

  ### **III. Empirical Realities the Theory CANNOT Contradict (Without Losing Credibility)**
  8.  **Bureaucratic Error Rates & Procedural Justice:**
      *   **Must:** Acknowledge that administrative systems make significant errors (false fraud accusations, incorrect sanction decisions) and incorporate robust due process, appeals, and error-correction mechanisms *as a core requirement*, not an afterthought.
      *   **Why:** High error rates are well-documented. A theory ignoring this sanctions the innocent by design. **(Non-Negotiable**)**
  9.  **The Stigma Effect of Conditionality & Surveillance:**
      *   **Must:** Account for the psychological and social harms (stigma, shame, stress, reduced social trust) generated by intrusive monitoring, suspicion-based systems, and the label of "potential fraudster."
      *   **Why:** Evidence shows conditionality increases stigma, which undermines well-being and social cohesion. A theory must justify its harms or mitigate them. **(Non-Negotiable for a humane theory**)**
  10. **Limited Effectiveness of Purely Punitive Sanctions:**
      *   **Must:** Engage with evidence that harsh financial sanctions often fail to sustainably increase employment but *do* increase poverty, debt, and hardship, potentially creating deeper barriers.
      *   **Why:** If the goal is genuine social inclusion/employment, ignoring counterproductive outcomes is irrational. (Strongly Recommended, bordering on **Non-Negotiable** for evidence-based policy).

  ### **IV. Flagged Tensions & Potential Incoherencies**
  11. **The Structural Unemployment vs. Individual Sanctions Dilemma:**
      *   **The Conflict:** If a theory **robustly acknowledges structural unemployment** (Desideratum 4) and the **limited agency of individuals within it** (Desideratum 7), it becomes **extremely difficult to normatively justify *punitive individual sanctions*** for non-employment. Sanctions imply blame and agency where the theory admits there may be little.
      *   **Potential Outcomes:** A coherent theory might:
          *   Reject individual sanctions entirely in high structural unemployment contexts (focusing on job creation/support).
          *   Radically limit sanctions *only* to provable, deliberate, *feasible* individual non-compliance (e.g., refusing a genuinely suitable job offer), making sanctions rare.
          *   Become incoherent by trying to have it both ways (common in practice: acknowledge structure rhetorically but apply sanctions liberally).
      *   **Your Point:** This is likely the core tension you identified. A theory cannot *fully* satisfy Desiderata 4 & 7 *and* justify widespread individual sanctions without contradiction. One must give way.

  12. **Administrative Tractability vs. Nuance & Accuracy:**
      *   **The Conflict:** Distinguishing genuine need/incapacity/misfortune from calculated avoidance (Desiderata 1, 2, 3, 7) requires nuanced, individualized assessment. This is often **administratively intractable** (slow, costly, complex). Relying on crude proxies (like missing *any* appointment) is tractable but violates Desiderata 1 & 5.
      *   **Potential Outcomes:** Sacrifice nuance for efficiency (violating fairness), or invest heavily in complex administration (costly, potentially intrusive). A good theory must grapple with this trade-off explicitly.

  ### **V. Ideological Baggage (To Be Scrutinized, Not Presumed)**
  *   **The Presumption of Pervasive Fraud:** Treat as a claim requiring evidence, not a foundational axiom. Conditionality justified *primarily* on this basis often contradicts Desideratum 8 & 9.
  *   **Work as Inherently Morally Superior:** While promoting participation can have social/economic benefits, basing *deservingness* solely on formal employment status ignores care work, structural barriers (7), and stigmatizes non-workers (contradicting 2, 3, 9). A theory should justify work requirements functionally (e.g., fiscal sustainability, social inclusion), not morally.
  *   **"Dependency" as a Primary Evil:** Views that see welfare *itself* (without conditionality) as creating harmful dependency often ignore structural barriers and the stigmatizing effects of conditionality itself (9). Requires strong evidence vs. ideology.

  ---

  **In Summary for Your Paper:** The fundamental tension you identified **(Structural Unemployment vs. Individual Sanctions - Point 11)** is very real. A normative theory faces a stark choice: dilute its recognition of structural barriers/limited agency to preserve the logic of sanctions, or reject/relegate sanctions to a very minor role consistent with that recognition. Trying to satisfy both robustly leads to incoherence. The other non-negotiables (fairness in cases, key distinctions, respecting empirical realities) provide the framework showing *why* this tension exists and is so difficult to resolve within a conditionality paradigm. Your tutor's point about the "undeserving poor" as an *administrative category* speaks directly to the conflict between Desideratum 5 (distinguishing desert from tractability) and the need for bureaucratic legitimacy – often achieved by *creating* visible "undeservers" through sanctioning, even where individual blame is questionable.
