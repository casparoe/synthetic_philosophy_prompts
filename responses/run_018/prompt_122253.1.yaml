answer: |-
  Here’s a targeted Q&A prep sheet, ordered by potential damage in your specific audience, with rhetorical strategies tailored to each group. Focus on preserving your core thesis while strategically conceding non-fatal points.

  ---

  ### **#1: Most Damaging Objection (Likely from Preference Utilitarians)**  
  **Objection:** "If we can’t aggregate interests across temporal stages, how can we make *any* rational life-planning decisions? Your view paralyzes prudential reasoning. Sacrificing a present desire (e.g., skipping dessert) for future health *is* intrapersonal aggregation, and it’s clearly rational. Isn’t your ‘diachronic separateness’ just a philosophical artifact with no practical relevance?"  
  *(Uses welfare/preference-satisfaction language; attacks real-world applicability)*  

  **Your Reply (1.5–2 min):**  
  ► **Concede upfront:** "You’re right that my view complicates standard models of rational choice. I’m not denying that we *do* make trade-offs across time. But the *normative justification* for those trade-offs shouldn’t treat stages as fungible. Skipping dessert isn’t *canceling* the present self’s claim—it’s a temporally extended agent *authorizing* a sacrifice for a later stage’s sake, much like promising binds future selves. The boundary remains, but it can be voluntarily bridged."  
  ► **Weakness:** Risks conflating authority with aggregation.  
  ► **Tone:** **Hold firm** on the normative distinction but soften on practical outcomes ("Authorization isn’t aggregation").  

  ---

  ### **#2: High-Risk Objection (Kantians)**  
  **Objection:** "You’re misapplying the separateness-of-persons intuition. Interpersonal separateness protects *autonomous agents* from being used as mere means. But temporal stages aren’t agents—they’re phases of *one* agent. Extending this to diachronic cases dilutes the core Kantian concern for respect and agential unity, turning a moral insight into a metaphysical confusion."  
  *(Frames in agency/respect terms; accuses category error)*  

  **Your Reply (1.5 min):**  
  ► **Concede upfront:** "I agree temporal stages aren’t full agents. But they *are* distinct loci of interests that can be coerced or exploited *by the same life*. A later self overriding a past self’s deeply held commitment (e.g., breaking a vow) without recourse disrespects the past self’s agential status. This preserves the ‘mere means’ intuition without requiring metaphysical personhood—only normative entitlements within a life’s narrative structure."  
  ► **Weakness:** "Normative entitlements of stages" may sound metaphysically loaded.  
  ► **Tone:** **Soften** by linking to Kantian themes ("Respecting past commitments honors agential integrity").  

  ---

  ### **#3: High-Risk Objection (Rule-Consequentialists)**  
  **Objection:** "Even if temporal stages have separate interests, why should we care? Unless diachronic separateness leads to worse *overall* welfare outcomes across lives, it’s morally inert. Your view only matters if it improves general flourishing—can you show that respecting these ‘boundaries’ doesn’t undermine societal welfare?"  
  *(Demands welfare-based justification; skeptical of non-aggregative values)*  

  **Your Reply (1.5 min):**  
  ► **Concede upfront:** "I can’t prove this maximizes aggregate welfare. But rule-consequentialism accommodates constraints (e.g., rights) that aren’t directly welfare-maximizing per act. A society respecting diachronic separateness might foster deeper personal integrity, reducing akrasia and regret—*empirically* improving welfare. My aim isn’t to beat consequentialism on its turf but to show welfare isn’t the only currency."  
  ► **Weakness:** Speculative empirical claims.  
  ► **Tone:** **Soften** by appealing to rule-consequentialism’s flexibility ("This could be a welfare-promoting constraint").  

  ---

  ### **#4: Targeted Objection (Moral Psychologist)**  
  **Objection:** "Your ‘normative boundaries’ clash with evidence on temporal discounting. People *naturally* value near-term interests over distant ones—it’s a cognitive feature, not a bug. If diachronic separateness is so normatively weighty, why do humans (and animals) consistently violate it? Isn’t this just pathologizing standard psychology?"  
  *(Uses empirical framing; implies "is-ought" gap)*  

  **Your Reply (1 min):**  
  ► **Concede upfront:** "I don’t dispute the psychology—we *are* temporally biased. But normative boundaries aren’t descriptive; they’re prescriptive. We criticize impulsive choices (e.g., addiction) precisely because they *disrespect* future interests. My account explains why such criticism isn’t just inefficient but *unjust* to later stages."  
  ► **Weakness:** May seem disconnected from real-world agency.  
  ► **Tone:** **Hold firm** on normativity/psychology distinction.  

  ---

  ### **The Question You Hope Nobody Asks (Likely from the Psychologist or Metaphysically Cautious Kantian)**  
  **Objection:** "If diachronic separateness isn’t metaphysical (e.g., no numerical identity changes), *what grounds the normative force*? Without persons or identity, ‘stages’ are arbitrary. Why should I care about Tuesday-me’s ‘entitlements’ if Wednesday-me is still *me*? This feels like morality-play metaphysics."  

  **Defensive Reply (1 min):**  
  ► **Concede upfront:** "I grant this is the deepest tension. But we can ground entitlements in *phenomenology*, not ontology: we experience past sacrifices as *claims* (e.g., regret for broken vows), not erased preferences. Normative boundaries emerge from our first-person temporality—how we *hold ourselves accountable* across time. We protect these boundaries for the same reason we protect interpersonal ones: to honor the phenomenology of agency."  
  ► **Weakness:** Risk of vagueness.  
  ► **Tone:** **Hold firm** on phenomenology but pivot to practical implications ("Even if grounds are contested, the *experience* of diachronic injustice is real").  

  ---

  ### **Rhetorical Choreography Notes**  
  - **With consequentialists:** Emphasize that diachronic separateness *constrains but doesn’t destroy* aggregation (e.g., "Authorization overrides aggregation").  
  - **With Kantians:** Use "agential respect" and "narrative unity" as touchstones—avoid "selves."  
  - **With the psychologist:** Stress that empirical discounting patterns are *targets* of normative critique, not justifications.  
  - **Universal tactic:** Preemptively note that your view is *compatible* with many theories—it’s about *how* we justify trade-offs, not rejecting them outright.  

  **Critical Weakness to Guard:** Your account relies on "stages" having moral weight without metaphysical grounding. If pressed, retreat to the *practical necessity* of temporal integrity for agency—not ontology.
