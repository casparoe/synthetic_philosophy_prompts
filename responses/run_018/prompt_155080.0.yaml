prompt: |-
  hey im drafting this scene in my novel where a historian thinks she knows who did a crime in 1920 because she found three independant letters all pointing to the same guy, but then she finds out two were forged by one person and the third was just coincidence. classic Gettier setup, right? but i need her to actually be right about knowing, philosophically. can you argue that Gettier counterexamples dont break the justified-true-belief account if we understand justification as anchored in the agents actual evidential enviroment rather than in some counterfactual space? like, build the case that she still knows, not despite the luck but because the justification was doing real work in her actual world, and that the hidden forgery is just an external glitch that shouldnt retroactively poison the knowledge status. dont worry about citations or a bibliography, i just need the conceptual backbone for the scene. sorry for the typos, writing this on my phone between chapters.
