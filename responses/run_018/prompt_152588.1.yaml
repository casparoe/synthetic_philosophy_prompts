  But the user's sharp to spot ambiguity in "finite powers." Could it include cognitive limits? Probably not—Maxwell treats observation as passive registration, not active processing. His demon perceives velocities like a sensor, not a computer. The gate operation gets more physical description than the sensing act, which feels telling.

