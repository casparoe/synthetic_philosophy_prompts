  *I'm imagining the dialogue rhythm:* They'll trade parries. Malcolmian strikes first by dismissing the written account as invention. Dennettian counters that the alarm integration requires *some* pre-existing sensory trace. Then Malcolmian retorts that "trace" isn't experience—it's just neural noise. Dennettian pivots to the specificity of the integration: would raw data alone produce such coherent transformation? 

