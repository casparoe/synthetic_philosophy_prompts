answer: |-
  ## Dialogue: Moore's Paradox and Institutional Assertion

  **Setting:** Philosophy seminar room after class. Participants A and B remain, discussing the topic.

  **A:** Look, B, I can’t shake the feeling that we’re letting institutional roles obscure the fundamental nature of assertion in these delegated cases. Moore’s paradox reveals something deep: `asserting P constitutively expresses the speaker's belief that P`. That’s the core commitment. When the university spokesperson says, "The administration believes this policy is just," *even in their official capacity*, they are still *asserting* that proposition. And asserting it *means* expressing their own commitment to its truth. Their personal denial of that belief, "But I don't believe it is just," directly contradicts the expressive force of their own act. The absurdity remains because the act *itself* implicates their belief, regardless of the role they occupy while performing it.

  **B:** I see where you’re coming from, A, but I think you’re conflating the *vehicle* of assertion with the *source* of commitment. Moore’s paradox isn’t *just* about assertion; it’s crucially about **self-knowledge and self-attribution**. The absurdity arises when the speaker simultaneously presents P as true *for themselves* and denies holding the attitude required for that presentation. But when the spokesperson clearly marks the utterance as delegated – "The administration’s position is that P" – they aren’t presenting P *as true for themselves*. They are reporting the collective attitude. The expressive act is fundamentally different: it’s a report *about* the institution's belief state, not an expression *of* their own. The personal denial targets a different object: their private doxastic state. No single attitude (their own belief) is being simultaneously affirmed and denied.

  **A:** But *who* is doing the reporting? *Who* is making the assertion about the institution's belief? It’s still *them*, the individual! When they utter, "The administration believes P," they are personally committing to the truth *that the administration believes P*. That’s the proposition they are asserting and expressing their own belief *in*. The Moorean absurdity would arise if they said, "The administration believes P, but I don't believe *that the administration believes P*." That’s the direct analogue. But that’s not the case we’re discussing. Their personal denial is about P itself, not about the institution's belief in P! So where’s the *direct* contradiction in *their own commitments*?

  **B:** Precisely! Their assertion is about the institution's state (S: "The institution believes P"). Their personal belief is about P itself (They believe ~P). There’s no logical contradiction between S and ~P. The institution could believe a falsehood! The potential conflict is *external* – between the institution’s belief and their private one – not *internal* to the speaker’s expressed commitments, which are S and ~P. The absurdity Moore identified requires the speaker to be simultaneously affirming and denying *their own identical doxastic attitude towards the same proposition*. Here, they are expressing belief in S and belief in ~P – distinct propositions held by distinct agents (the institution vs. themselves). The role-marking ("The administration believes...") explicitly signals this separation of doxastic subjects.

  **A:** Let’s apply this to the climate scientist. She presents the IPCC report saying, "The scientific consensus is that anthropogenic warming is virtually certain" (asserting S). Privately, she has doubts (~P). You claim this is coherent because S and ~P aren’t contradictory and the role marks the source. But doesn’t her act of *asserting S* still constitutively express *her personal belief that S is true*? She’s saying the consensus *exists*. If she simultaneously whispered, "...but I don't believe there *is* such a consensus," *that* would be Moore-paradoxical for S. But her actual private doubt is about P, not S. So where is the *Moorean* tension? The tension is ethical or professional, not logical or constitutive of assertion in the Moorean sense. She consistently believes S (the report accurately states the consensus) and ~P (anthropogenic warming isn't certain). There’s no single proposition she’s both asserting and denying belief in.

  **B:** Exactly! The paradox dissolves under clear role specification. The tension you feel, A, might stem from a *pragmatic* expectation of alignment or an *ethical* demand for sincerity in institutional roles, but it’s not the *logical* or *constitutive* absurdity Moore pinpointed. The scientist’s utterance is fully coherent *as an assertion* because the commitment undertaken is to S (the consensus claim), and she holds that belief. Her private ~P is irrelevant to the coherence of the speech act *itself*.

  **A:** Hold on. Suppose the scientist stands up and says, "Based on this report, it is virtually certain that anthropogenic warming is occurring." Isn’t she *now* asserting P itself ("it is certain")? She’s not *just* reporting S ("the report says P"), she’s *endorsing* P *on behalf of the institution*. Doesn’t this endorsement, even delegated, require her to express *her own belief* in the institutional authority or the report’s correctness (which implies belief in P)? If she then denies believing P, isn’t she saying, in effect, "I hereby present P as true (via institutional endorsement), but I do not believe it"? That *feels* Moorean because the act of presenting P as true seems to inherently involve her own epistemic stance, even if mediated.

  **B:** That’s a stronger case, A. When she says "It is certain..." while presenting the report, she *is* performing a different act: an institutional endorsement of P. However, the crucial marker is still the context: "Based on this report..." or "The IPCC finds...". This frames P as being presented *as the institution's finding*, not necessarily her personal judgment. Her commitment is to the *institution's warrant for asserting P*, not necessarily to her *own direct belief in P*. She commits that the institution has good grounds, not that she personally finds those grounds ultimately convincing. Her simultaneous private ~P creates a conflict *with the institution*, not necessarily an *internal contradiction in her speech act*. She says, "The institution has warrant to assert P, and I present that assertion," while thinking, "But I find flaws in that warrant/reasoning." The Moorean absurdity arises only if she denies believing *that the institution has warrant* or *that she is authorized* to present its finding while doing so. Denying belief in P itself targets a different proposition.

  **A:** I concede that clear, explicit role-marking ("The administration states...", "The report concludes...") mitigates the *most direct* Moorean absurdity by shifting the asserted proposition to S ("They believe P"). But in cases of pure institutional *endorsement* ("We declare P"), especially where "we" ambiguously merges the institution and the speaker, or where the speaker acts as a mere conduit without the explicit reporting frame, I think my normative view holds: assertion inherently expresses the speaker's belief. The spokesperson *is* the institution's voice at that moment; their act *is* the institution's act. To deny personal belief while being *that* voice seems to fracture the unity of the speaker-as-asserter. The tension isn't merely pragmatic; it reveals a dissonance in the very act of putting P forth as true while disavowing the core attitude that makes assertion meaningful – personal commitment to truth.

  **B:** And I maintain that this dissonance is ethical or psychological, not logical or constitutive. The institution *can* speak through an individual without that individual personally endorsing the content. The commitment is *vicarious*. Moore's paradox targets the individual's *own* doxastic self-presentation. Once the speaker clearly signals they are channeling another's doxastic state, the locus of commitment shifts. The climate scientist presenting the report *as the report* isn’t Moore-paradoxical if she doubts P; it only becomes potentially problematic if she doubts *the existence or validity of the consensus she reports* (S). The paradox survives delegation only if the delegation itself is undermined by the speaker's disbelief *in the delegated authority or message*. Otherwise, the roles successfully partition the doxastic landscape.

  **A:** So we agree the *core* Moorean absurdity requires targeting the *same* proposition with assertion and disbelief. The debate is whether institutional assertion always asserts a *different* proposition (S) or whether endorsement of P inherently drags the speaker's own belief into it. And whether the speaker truly can compartmentalize their "vicarious" commitment from their personal belief without creating a performative contradiction in their role as asserter.

  **B:** Precisely. The boundaries of the asserted proposition and the nature of vicarious commitment are where the real philosophical work lies in these institutional cases. Moore's paradox, in its purest form, demands self-attribution. Clear delegation avoids that self-attribution for P itself. The residual tension is real, but it belongs to ethics, sociology, or the philosophy of institutions, not the core logic of assertion that Moore exposed.
