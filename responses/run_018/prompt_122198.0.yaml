answer: |-
  Below is a practical, executable decision procedure for your team, grounded in the principles of Occam's razor, Solomonoff induction, and Kolmogorov complexity, while acknowledging their theoretical limitations. The procedure prioritizes **actionability**, **auditability**, and **explicit handoffs to judgment** when values or risk appetite dominate. It runs in ≤90 minutes and is designed for professionals with basic ML knowledge.

  ---

  ### **Decision Procedure: Model Selection Checklist**  
  **Inputs Required**: Historical data, backtest results (rotating-origin), model specs, domain context.  
  **Outputs**: Choose simple (S) / complex (C) model, **Stop** (insufficient info), or **Handoff to CRO** (risk appetite).  

  #### **Step 1: Assess Data-Model Mismatch (5 mins)**  
  **Question**: *Is the complex model’s capacity grossly disproportionate to the data?*  
  - **Sufficient answer**:  
    - If \( n \leq 5 \times \) (parameters + features of C) **or** \( n \leq 50 \), **reject C immediately**.  
    - Else if \( n \leq 10 \times \) (parameters + features of C), **proceed cautiously** (flag instability risk).  
  - **Stop/Handoff**: If both models violate this, **Stop**—neither is viable.  
  - *Rationale*: Embodies Occam by penalizing excessive complexity relative to data. Kolmogorov complexity’s uncomputability is sidestepped by using parameter counts as a proxy for "description length." Ignores gzip (too arbitrary; no theoretical link to generalization).

  #### **Step 2: Backtest Performance & Stability (30 mins)**  
  **Question**: *Does C materially outperform S on out-of-sample metrics, and is it stable?*  
  - **Sufficient answer**:  
    - **Performance**: Compute mean backtest loss (Brier) difference \( \Delta = \text{loss}_S - \text{loss}_C \).  
    - **Significance**: Use paired t-test (folds as samples) with \( \alpha = 0.15 \) (loose threshold for small data). If \( p < 0.15 \) **and** \( \Delta \geq 0.01 \), C clears the bar.  
    - **Stability**: Calculate std. dev. of predictions across backtest folds. If \( \text{std}_C > 2 \times \text{std}_S \), flag instability.  
  - **Decision**:  
    - C wins only if it clears *both* performance and stability checks.  
    - Else, default to S.  
  - *Rationale*: Backtesting approximates "expected loss" for future decisions. Solomonoff’s emphasis on generalization is honored, while Kolmogorov’s description-length tradeoffs are approximated by penalizing instability (a proxy for overfitting).

  #### **Step 3: Domain-Justified Complexity (15 mins)**  
  **Question**: *Does domain knowledge override the data-driven signal?*  
  - **Sufficient answer**:  
    - If S is based on a **causal theory** (e.g., physical laws) and C is purely empirical, **S wins** unless C’s backtest dominance is overwhelming (\( \Delta \geq 0.05 \)).  
    - If C incorporates **critical domain insights** (e.g., satellite indices validated by climate science) and S ignores them, **C wins** unless data mismatch (Step 1) is severe.  
  - **Handoff to CRO**: If domain logic conflicts with backtest results (e.g., S is theoretically sound but performs poorly).  
  - *Rationale*: Anchors to Occam’s core idea: simplicity is not just about parameters but *unjustified* complexity. Physical laws compress information (Kolmogorov) better than arbitrary features.

  #### **Step 4: Extreme-Event Risk (20 mins)**  
  **Question**: *Do models diverge on high-severity events, and which errors are costlier?*  
  - **Sufficient answer**:  
    - Test performance on the top 10% of claims (by severity). If C is better for extremes but worse on average, **escalate**.  
    - Quantify "cost of error": If underestimating a tail event is 5× costlier than overestimating, note this.  
  - **Handoff to CRO**: Always, if tail behavior is critical and models disagree.  
  - *Rationale*: Solomonoff prioritizes *all_ data, but reinsurance loss functions are asymmetric. Business values dominate here.

  #### **Step 5: Final Arbitration (20 mins)**  
  **Question**: *Do unresolved tradeoffs require business intervention?*  
  - **Handoff to CRO** if:  
    - Ambiguity on tail risks (Step 4).  
    - Conflict between domain/backtests (Step 3).  
    - High-stakes context (e.g., novel peril with systemic risk).  
  - **Else**: Output choice from Steps 1–3.  
  - Document rationale: "Chose S due to instability in C" or "Handoff due to tail-risk tradeoff."

  ---

  ### **Applied to Your Cases**  
  **Case 1: Hail model (12 regions, 3 years weekly data, S = linear index vs. C = GBT with 200 features)**  
  - **Step 1**: \( n = 12 \times 3 \times 52 \approx 1,872 \). C has 200 features + tuning parameters (\(\approx\) 250 effective). \( 5 \times 250 = 1,250 \). Since \( 1,872 > 1,250 \), proceed (but flag caution).  
  - **Step 2**: \( \Delta = 0.015 \) (favoring C). Paired t-test: Assume \( p = 0.12 \) (significant at \( \alpha = 0.15 \)). Stability: If \( \text{std}_C \leq 2 \times \text{std}_S \), C wins.  
  - **Step 3**: S uses published indices (domain-validated); C uses generic features. S wins unless C’s backtest is dominant—here \( \Delta = 0.015 \) is borderline.  
  - **Verdict**: **Choose S**—domain justification outweighs marginal backtest gain.  

  **Case 2: Novel storm model (8 weeks data, S = generic time-series vs. C = physical sim)**  
  - **Step 1**: \( n = 8 \). C has "many tuned parameters" (assume 20+). \( 5 \times 20 = 100 \), \( 8 < 100 \). **Reject C immediately** for data mismatch.  
  - **Step 2**: Not run (C rejected in Step 1).  
  - **Step 3**: C is physically motivated, but data is too sparse to validate. S is simple but may ignore physics.  
  - **Step 4**: Tail events are critical for novel perils.  
  - **Verdict**: **Handoff to CRO**—data is insufficient for either model, and risk appetite must decide whether to trust theory (C) or pragmatism (S). *You won’t like this, but it’s honest.*

  ---

  ### **What the Procedure Cannot Do**  
  1. **Misfires in Regime Shifts**: If climate dynamics invalidate history (e.g., unprecedented wildfires), backtests will mislead.  
  2. **Fails for Rare Events**: With claims <5, backtesting is useless; survival analysis or expert priors needed (outside scope).  
  3. **Ignores Implementation Costs**: If C requires 10× compute time, this is treated as a business constraint (not modeled).  
  4. **Silently Biased Toward Simplicity**: In truly complex systems (e.g., multi-peril interactions), it may reject legitimately useful C models due to instability flags.  
  5. **No Free Lunch Violations**: If a simple model is wrong due to structural bias (e.g., linearity vs. threshold effects), the procedure won’t detect it without domain input (Step 3).  

  **Key Philosophical Takeaways**:  
  - **Occam’s Razor** survives as: *"Prefer simpler models unless complexity reliably improves generalization."* Steps 1–2 enforce this.  
  - **Kolmogorov/Solomonoff** are honored in spirit by: (a) penalizing gratuitous parameters (Step 1), and (b) using instability as a proxy for "uncomputable" description length.  
  - **Gzip proxy is inadmissible**: File size correlates with noise, not generalization; throws away causal structure.  

  Use this as a living document—refine thresholds annually with team feedback. The goal isn’t perfection, but *defensible* decisions under uncertainty.
