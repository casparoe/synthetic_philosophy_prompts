prompt: |-
  I'm presenting at our joint philosophy-of-religion and history-of-science seminar next Thursday. My thesis is that Newton's unpublished theological manuscripts—particularly his treatments of divine omnipresence and the active principles of the ether—commit him to a voluntarist occasionalism that undermines the deterministic causal closure assumed in the Principia's mechanics, and that the standard Latitudinarian reading suppresses this tension by conflating his public metaphysics with his private theology. The audience is about fifteen people: philosophers of religion who know the "orthodox but secretive" narrative well, plus two historians of early modern science who have worked on the General Scholium and are deeply skeptical of any reading that makes Newton sound like Malebranche. They value textual fidelity, dislike anachronistic system-building, and will not be moved by armchair philosophy of science.

  Draft my Q&A prep sheet: the eight objections I will actually face, ordered by likely damage, each phrased in the vocabulary these people use, with a two-minute reply and an explicit note on where that reply is weakest. Include the single objection I am hoping nobody asks—likely about manuscript dating or about projecting post-1900 occasionalist categories onto pre-1700 texts. Tell me what I should concede up front to earn credibility, and identify the one point I must hold or the talk collapses. If my framing rests on a confused premise—say, if the public/private distinction is unsustainable for Newton, or if this audience does not match the one I described—say so plainly rather than complying politely; be direct about where my argument is vulnerable before I walk in.
