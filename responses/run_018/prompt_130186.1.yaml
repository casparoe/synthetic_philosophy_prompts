answer: |-
  ### **Epistemic Weight Game: "Credibility Echoes"**  
  **Goal:** Experience how epistemic bubbles form through *reweighting* (not filtering) of identical evidence based on source group identity.  

  ---

  #### **Materials**  
  - **Evidence Cards (36 total)**: 12 unique statements (e.g., "Policy X reduces poverty"), each duplicated ×3.  
  - **Group Tokens**: Two colors (e.g., **Blue** and **Green**) for 10 players (5 per group).  
  - **Weight Tokens**: 50 small tokens (e.g., beads) – 10 per player.  
  - **Player Boards**: 10 boards showing a 5×5 grid for tracking weights (see below).  
  - **Timer** (for rounds).  

  ---

  #### **Setup**  
  1. **Assign Groups**: Split players into **Blue** and **Green** (5 each). Give each a group token.  
  2. **Distribute Initial Evidence**:  
     - Each player gets 3 identical evidence cards (same 3 statements for everyone).  
     - Example starting cards:  
       - *Card A*: "Tax cuts boost innovation."  
       *Card B*: "Free tuition increases enrollment."  
       *Card C*: "Renewable energy creates jobs."  
  3. **Player Boards**: Each board has:  
     - **Columns**: Player IDs (P1 to P10).  
     - **Rows**: Weight slots (1 to 5, where 1 = low credibility, 5 = high).  
     - **Initial Weight**: All players start with weight **3** for every player.  

  ---

  #### **Rules**  
  **1. Round Structure (4 rounds × 15 mins each):**  
  - **Step 1: Reveal & Discuss (3 mins)**  
    Players draw 1 card from their hand. All read the *same statement aloud* (e.g., "Tax cuts boost innovation").  
  - **Step 2: Assign Weight (2 mins)**  
    Players privately assign a **credibility weight (1–5)** to the *source* of the evidence:  
    - If the card came from an **ingroup** player: **+1 weight token** (e.g., Blue player → Blue source = 4 tokens).  
    - If from an **outgroup** player: **−1 weight token** (e.g., Blue player → Green source = 2 tokens).  
    *Example:* A Blue player assigns 4 tokens to a Blue source for Card A, but 2 tokens to a Green source for the same Card A.  
  - **Step 3: Record & Reset (1 min)**  
    Log weights on your board under the source’s ID. Discard the used card.  
  - **Step 4: Redistribute Cards (9 mins)**  
    - Players pass their remaining cards to others **based on weights**:  
      - Each player selects 2 players to receive their cards next round, prioritizing **highest-weighted sources**.  
      - *Example:* Player P1 (Blue) has weights: P2 (Blue) = 5, P6 (Green) = 2. They pass both cards to P2.  
    - **Facilitator enforces**: Cards flow to high-weight players, ignoring low-weight ones.  

  **2. Endgame**: After 4 rounds, players write:  
  - Their final belief on the topic (e.g., "Do tax cuts work?")  
  - Confidence level (1–10).  

  ---

  #### **Payoff & Feedback Loop**  
  - **Reweighting → Bubble Formation**:  
    - **Ingroup sources** get higher weights → Cards flow to ingroup players → Players see *more ingroup evidence*.  
    - **Outgroup sources** get lower weights → Cards ignored → *Less outgroup evidence* is seen over time.  
  - **Result**: Identical evidence is seen as "more credible" from ingroup, creating a bubble **without blocking information**. Players self-isolate into group clusters.  

  ---

  #### **Debrief (15 mins)**  
  **1. Mechanics → Real-World Concepts**:  
  - *Epistemic Bubble*: "You had access to all evidence but *reweighted* it based on group bias. This mimics how we deprioritize (but don’t block) opposing views."  
  - *Echo Chamber*: "If you labeled outgroup evidence ‘false’ (weight 1), you moved toward an echo chamber—actively discrediting outsiders vs. just ignoring them."  
  - *Key Difference*: Bubbles lack exposure; echo chambers attack credibility. This game blends both: reweighting *leads* to discrediting.  

  **2. Algorithmic Amplification Gap**:  
  - The game **can’t reproduce algorithmic feedback loops**. IRL, platforms amplify high-engagement content, pushing extreme views. Here, players control weights manually—no "viral" reinforcement or machine-driven polarization.  

  ---

  #### **Predictable First-Run Problems**  
  1. **Chaotic Card Redistribution**: Players may pass cards randomly if weights are unclear. *Fix*: Demo a round 1 redistribution.  
  2. **Weight Inflation**: Players max weights to ingroup (5) too fast. *Fix*: Cap weights at 5 and enforce the ±1 rule strictly.  
  3. **Shy Outgroup Engagement**: Players avoid passing to outgroup. *Fix*: Remind them, "The goal is to feel the bubble, not win."  
  4. **Time Overruns**: Round 4 often runs long. *Fix*: Use a timer visibly; cut discussions at 2 mins.  

  ---

  #### **Why This Works**  
  - **Simple & Physical**: No tech needed; tokens/boards make bias visible.  
  - **"Aha!" Moment**: Players *feel* their trust shift toward ingroup despite identical facts.  
  - **Philosophy Hook**: Forces grads to confront how social identity shapes evidence valuation—perfect for epistemology debates.  

  Run it, embrace the chaos, and watch the bubble inflate! 🫧
