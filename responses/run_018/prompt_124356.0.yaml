  - **Unformalizable "outside"**: Like a human's intuitive judgment. But for AI, that’s handwavy.  

  For alignment, the buck-stopping problem is brutal. If the AI’s value-evaluation is just another module, what justifies *that* module? Either:  
  - **Non-formal anchor**: Values rooted in evolution, emotion, or human preferences. Cost: Feels unsystematic; might not scale.  
