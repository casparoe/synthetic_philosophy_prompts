  The user's insight about JOOTSing is sharp: if an "escape hatch" is formalizable, it's not truly outside—it's just more machinery. For a *genuine* JOOTS to change behavior (like an AI abandoning a flawed goal), it might need something unmodeled—a "hardcoded exception" or external input. That’s uncomfortable for alignment, where we want agents to *reliably* self-correct. 

