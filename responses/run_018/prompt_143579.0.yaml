answer: |-
  ### Audience Map & Thesis Recap  
  Formal AI-safety experts (causal model fluency), philosophers of science (anti-boundary-objectivity), and moral philosophers (normative-concept skeptics). Thesis: "Avoiding side effects" is achievable *structurally* via **relational invariance**—preserving conditional independencies *outside* a task-defined envelope—without resolving value alignment.  

  ---

  ### Objection Sequence & Defense Script  

  **Objection 1 (Formal AI-Safety: "Structure Isn’t Sufficient")**  
  *Speaker:* "Your invariance assumes the *true* causal graph is known/complete. What if unobserved confounders break independence post-intervention? This feels like assuming away the hard part."  
  - **Seriousness:** High (technical gap).  
  - **Concede:** Unknown variables threaten *any* low-impact measure.  
  - **Hold:** Relational invariance reduces *known* side effects; confounders are external.  
  - **Reply (30s):** "Agreed: unobserved variables limit all causal models. But within our known graph, preserving d-separation *minimizes* unintended dependencies. This is a measurable improvement over value-agnostic agents—not a full solution, but a safety primitive."  

  **Objection 2 (Philosopher of Science: "Envelopes Are Value-Laden")**  
  *Speaker:* "Calling variables ‘outside the envelope’ pretends boundary-drawing is neutral. But task relevance implies human values—e.g., why is ‘office décor’ outside a cleaner-bot’s envelope?"  
  - **Seriousness:** Critical (epistemic challenge).  
  - **Concede:** Envelope specification requires value-based choices.  
  - **Hold:** Once defined, *structural preservation* is value-neutral.  
  - **Reply (30s):** "You’re right: defining the envelope involves values (e.g., ‘don’t alter décor’). But *after* that, invariance mechanically preserves relationships *without* referencing values. This decouples boundary-setting (hard) from side-effect avoidance (structural)."  

  **Objection 3 (Moral Philosopher: "Invariance Smuggles Norms")**  
  *Speaker:* "‘Preserve structure’ sounds descriptive, but it’s normatively thick—it assumes stability = good. What if current dependencies are unjust? Forcing invariance could cement oppression."  
  - **Seriousness:** Severe (conceptual subversion).  
  - **Concede:** Invariance isn’t universally desirable.  
  - **Hold:** It’s a *default* for low impact; value-alignment handles exceptions.  
  - **Reply (30s):** "Fair: invariance shouldn’t freeze immoral states. But for *unintended* effects, it’s a minimal default: altering dependencies *without intent* is reckless. Deliberate change requires value alignment—this prevents *accidental* harm."  

  **Objection 4 (Formal + Philosopher of Science: "Monitoring Costs")**  
  *Speaker:* "Tracking all external conditional independencies is computationally intractable. If you simplify, you’re drawing boundaries again—undermining ‘structural’ purity."  
  - **Seriousness:** Practical threat.  
  - **Concede:** Full invariance is intractable; approximations needed.  
  - **Hold:** Sparsity in real-world graphs makes monitoring feasible.  
  - **Reply (30s):** "True, we need tractable proxies (e.g., high-level independencies). But unlike value alignment, we can formally *bound* error via causal abstraction. This isn’t boundary-drawing—it’s lossy compression of structure."  

  **Objection 5 (Moral Philosopher: "Value-Relativity of Impact")**  
  *Speaker:* "Side effects aren’t objective—e.g., noise might distract humans but not AI. Calling structural changes ‘side effects’ ignores that impact is valuer-dependent."  
  - **Seriousness:** Foundational.  
  - **Concede:** Impact is valuer-relative.  
  - **Hold:** Relational changes are *necessary* (if insufficient) for side effects.  
  - **Reply (30s):** "Agreed: broken dependencies only *correlate* with harm. But they’re a near-universal indicator—e.g., if noise distracts humans, it likely alters dependencies in human-activity variables. This is a filter, not a full criterion."  

  ---

  ### The Dreaded Hidden Objection  
  **"Non-Identity Problem for Structure"**  
  *Why dangerous:* If the agent swaps variables while preserving dependencies (e.g., replaces all art with equivalently correlated counterfeits), invariance is satisfied—but humans see catastrophic side effects. Proves structure preservation ≠ value-neutral impact avoidance.  
  *Reply (2 sentences):* "This reveals invariance as necessary but insufficient. However, such *active* swaps require intent—they’re not *side* effects but covert value violations, demanding alignment. Structural preservation still blocks *unintended* dependency breaks."  

  ---

  ### My Weakest Point  
  **The Crack:** "Task envelope" definition relies on *causal irrelevance*—but irrelevance is value-dependent (e.g., "office décor irrelevant to cleaning" assumes décor has no moral weight).  
  - **Defense:** Argue task envelopes are *functionally* defined (e.g., "variables not needed to achieve goal *G*"). Moral weight is a separate layer.  
  - **Honest Admission:** "Yes, this assumes we can isolate task-functional boundaries—but in practice, *minimal sufficient variable sets* exist (e.g., robot position for navigation). Disagreements indicate edge cases, not core failure."  

  ---

  ### Opening Concession (Disarm Tactics)  
  "Let’s acknowledge three elephants: First, defining the ‘envelope’ involves judgment—I’ll show how to minimize it. Second, relational invariance *can* entrench bad states—it’s a default, not a norm. Third, this doesn’t solve alignment; it reduces the *space* of alignment failures. My goal: show we can build agents that, by default, don’t bulldoze causal webs—buying us time to align values."
