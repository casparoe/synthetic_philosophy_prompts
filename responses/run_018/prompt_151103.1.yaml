  Let me break down their argument's pressure points. Premise (5) about linear aggregation is where they suspect weakness, but they're right to worry that abandoning it might just shift arbitrariness elsewhere. The thermostat example reveals a genuine problem: if predictive processing is the continuum's base, then literally everything becomes a moral patient.

