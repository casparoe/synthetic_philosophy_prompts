  User's "selection bias" point stands though. Even if we use non-linear aggregation, gradation theorists still owe an explanation for why we prioritize mammals over bacteria that isn't just anthropocentric prejudice. Maybe the answer lies in intensity thresholds for morally relevant harm, not patienthood per se.

  ...I'll argue that (5) is the main flaw, but emphasize that rejecting linearity doesn't solve the deeper problem of action-guidance. The user seems prepared to bite bullets, so I should be equally candid about tradeoffs.
answer: |-
  Your "moral dark matter" argument is a sharp critique of the gradation thesis. It correctly identifies a tension between ontological continuity and normative actionability. The core problem lies in **premise (5)**, but abandoning it doesn't fully resolve the issue—it relocates the arbitrariness. Here's the breakdown:

  ### Why Premise (5) Fails (But Doesn't Save the View)
  **Problem:**  
  (5) assumes linear aggregation is *required* for rational moral reasoning. However:
  - **Incommensurability:** Phenomenal richness isn't a cardinal quantity (like mass) but a qualitative property. How do we assign a "weight" to a thermostat's predictive processing vs. a human's suffering? Linear aggregation demands a common scale that may not exist.  
  - **Non-additivity:** Harm to complex entities isn't necessarily additive with harm to simple ones. Crushing a bacterium while walking isn't morally equivalent to 1/1,000,000,000th of crushing a human—even if both have non-zero moral status. The *type* of harm differs.  
  - **Practical Impossibility:** Calculating the "astronomical aggregate harm" requires quantifying every causal interaction in a chaotic system (e.g., walking on grass affects microbes, soil sensors, etc.). This is computationally intractable, violating the "rational moral reasoning" it purports to enable.  

  **Why it looked plausible:**  
  In utilitarian frameworks, linear aggregation works for *homogeneous* harms (e.g., identical units of pain). The gradation thesis misleadingly presents "phenomenal richness" as scalar, inviting a quantitative approach. But conflating *ontological continuity* with *normative additivity* is a category error.

  ### Cost of Rejecting (5)
  - **Relocating Arbitrariness:** If we reject linear aggregation, we need an alternative. Options include:  
    - **Thresholds:** Ignore entities below a certain complexity. *Cost:* Reintroduces discontinuity at the normative level (contradicting (3)).  
    - **Non-linear Weighting:** Assign diminishing moral weight to simpler entities (e.g., logarithmic scaling). *Cost:* The weighting function itself is arbitrary. Why log-linear? Why not sigmoid?  
    - **Agent-Relative Prioritization:** Focus on entities with "meaningful" interests (e.g., capacity for valenced states). *Cost:* Still requires defining "meaningful," risking anthropocentrism.  
  - **Moral Dark Matter Remains:** Even with non-linear aggregation, microbes/simple systems dominate numerically. If they have *any* non-zero weight, ethics must account for them—yet we lack practical or epistemic access to do so.  

  ### Other Premises Under Pressure
  - **(2)**: Grounding obligations *solely* in phenomenal richness is fragile. If a thermostat has minimal "phenomenal consciousness," does it have interests? Can it be "harmed"? Plausibly, moral obligations require not just sentience but *valenced experience* (e.g., suffering/pleasure). This could exclude predictive processing without valence.  
  - **(1)/(3) Conflation:** "Predictive processing" ≠ "phenomenal consciousness." Predictive processing is functional; phenomenality is experiential. Thermostats may be on a *functional* continuum but not a *phenomenal* one. If phenomenality emerges only at higher complexity, (1) is false.  

  ### Where the Argument Succeeds
  - **Paralysis Threat:** The gradation thesis *does* struggle with action-guidance. If all entities matter non-trivially, everyday acts (like breathing) become ethically fraught.  
  - **Selection Bias Exposed:** "Moral dark matter" is real. Our ethics ignores 99.999% of potentially sentient entities (bacteria, algorithms, etc.). Gradation theorists must either:  
    - Defend this bias (e.g., "only valenced states matter"),  
    - Advocate for radical ethical overhaul (prioritizing microbial welfare), or  
    - Accept that ethics is inherently anthropocentric.  

  ### A Path Forward (If You Keep (1) and (2))
  1. **Reject (5)**: Adopt a non-aggregative approach (e.g., **deontic thresholds**). Example:  
     - Entities below complexity *X* have negligible weight not because they lack moral status, but because their interests don't generate *actionable duties* for agents like us.  
     - *Cost:* This is normative discontinuity, but it might reflect epistemic limits rather than ontological reality.  

  2. **Refine (2)**: Ground obligations in *valenced phenomenality* (ability to experience good/bad states). This excludes thermostats and possibly insects, narrowing the spectrum.  

  3. **Embrace "Moral Ignorance"**: Acknowledge that low-complexity entities *might* matter, but we can't quantify their weight. Use precautionary principles (e.g., avoid gratuitous harm to simple life) without exact aggregation.  

  ### Conclusion
  **Premise (5) is the weakest link**—linear aggregation is neither necessary nor plausible for gradational moral patienthood. However, discarding it doesn't resolve the "dark matter" problem; it forces the arbitrariness into aggregation rules or thresholds. To avoid paralysis, you must either:  
  - Introduce normative discontinuity (e.g., action-relevant thresholds),  
  - Narrow moral patienthood to valenced sentience (abandoning the "thermostat" end of the spectrum), or  
  - Accept that ethics is constrained by practical/epistemic limits (making "ignoring microbes" a feature, not a bug).  

  The gradation thesis survives only if we decouple metaphysical continuity from utilitarian-style calculus. But as your argument shows, it remains vulnerable to charges of impracticality or inconsistency. The real cost may be admitting that ethics can't be fully principled—it requires pragmatic boundaries.
