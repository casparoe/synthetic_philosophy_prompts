  ### Decision Tree: Positions on Anatta and Personal Identity  
  **Start:** Nature of the Self-Illusion  
  │  
  ├── **A. Illusion stems from cognitive error** (misapprehension of reality)  
  │   │  
  │   ├── **B. Rebirth requires a "carrier"** (subtle entity linking skandha-streams)  
  │   │   │  
  │   │   ├── **C. Narrative coherence has normative pull** (ought to shape identity)  
  │   │   │   └── **LEAF 1:** [Unexplored] Carrier-based continuity + normative narrative  
  │   │   │       *Cognitive error, carrier, normative pull.*  
  │   │   │  
  │   │   └── **D. Narrative coherence is only pragmatic** (useful convention, no "ought")  
  │   │       └── **LEAF 2:** Yogācāra (ālaya-vijñāna)  
  │   │           *Cognitive error, carrier, pragmatic narrative.*  
  │   │  
  │   └── **E. Rebirth is bare causal continuity** (no carrier, dependent origination)  
  │       │  
  │       ├── **F. Narrative coherence has normative pull** (grounds moral accountability)  
  │       │   └── **LEAF 3:** [Unexplored] Total skandha-flux + cross-lives karma  
  │       │       *Cognitive error, no carrier, normative pull. Affirms moral accountability across lives despite flux.*  
  │       │  
  │       └── **G. Narrative coherence is only pragmatic**  
  │           └── **LEAF 4:** Theravāda reductionism / Parfit-style continuity  
  │               *Cognitive error, no carrier, pragmatic narrative. (e.g., Abhidhamma, modern reductionism)*  
  │  
  └── **H. Illusion stems from affective clinging** (attachment/aversion)  
      │  
      ├── **I. Rebirth requires a "carrier"**  
      │   │  
      │   ├── **J. Narrative coherence has normative pull**  
      │   │   └── **LEAF 5:** [Logically empty?] *Affective clinging + carrier implies normative selfhood—contradicts anatta.*  
      │   │  
      │   └── **K. Narrative coherence is only pragmatic**  
      │       └── **LEAF 6:** [Logically empty?] *Carrier + affective clinging risks reifying self; no major schools align.*  
      │  
      └── **L. Rebirth is bare causal continuity**  
          │  
          ├── **M. Narrative coherence has normative pull**  
          │   └── **LEAF 7:** Narrative identity with Buddhist window-dressing  
          │       *Affective clinging, no carrier, normative pull. (e.g., modern "Buddhist" narrativism)*  
          │  
          └── **N. Narrative coherence is only pragmatic**  
              └── **LEAF 8:** [Unexplored] Affect-driven flux + pragmatic narrative  
                  *Affective clinging, no carrier, pragmatic narrative. No moral accountability across lives.*  

  ---

  ### Key:  
  - **Logically empty spots:**  
    - LEAF 5/6: Combining a "carrier" with **affective clinging** risks positing a self-like entity (contradicting anatta). Yogācāra (LEAF 2) avoids this by rooting illusion in *cognitive error*.  
  - **Unexplored combo:** LEAF 3 (total flux + normative narrative) insists on cross-lives karma *without* a carrier or cognitive error.  
  - **Major positions covered:**  
    - **Theravāda/Parfit:** LEAF 4 (cognitive error, no carrier, pragmatic narrative).  
    - **Yogācāra:** LEAF 2 (cognitive error, carrier, pragmatic narrative).  
    - **Narrative hybrid:** LEAF 7 (affective clinging, no carrier, normative pull).  
  - **Tree splits driven by:**  
    1. Root cause of self-illusion (cognitive vs. affective),  
    2. Rebirth mechanism (carrier vs. causality),  
    3. Role of narrative (normative vs. pragmatic).  

