prompt: |-
  I am drafting a statement of my normative views on strikes and the right to organize, and before I circulate it I would like a consistency check. I find myself committed to all of the following, but I have not worked out how they fit together.

  1. The right to strike is a collective right held by workers as an organized group, not merely the sum of individual rights to quit or withhold labor. A lawful strike is not a mass resignation; it is a collective act whose authority belongs to the workers as a body.
  2. Workers who cross a picket line during a properly called strike may be morally criticized for undermining their coworkers' collective action, but the law should not compel them to join the strike. The individual choice to work must remain legally protected.
  3. Procedure is not a side issue for me. The normative authority of a strike comes from the collective decision of the workers it binds: it should normally be authorized through the union, after a fair and informed vote in which the workers understand the likely costs and risks. A strike called by an unaccountable faction without such authorization is presumptively illegitimate.
  4. Yet there are cases in which the employer's conduct is itself a serious and ongoing violation of workers' basic rights — dangerous working conditions, systematic non-payment of wages, coercive management practices. In those cases, even a minority of the affected workers may walk out immediately, without majority authorization. The employer's wrong, not the procedure, does the justificatory work.
  5. Strikers may pressure their own employer, but they may not blockade, picket, or otherwise coerce a different, neutral employer merely because it does business with the struck firm. Pressuring parties who are not involved in the dispute is wrong.
  6. Sympathy strikes, however, are legitimate. If the employees of a second firm decide for themselves to stop work in support of strikers at the first firm, that is a permissible exercise of their own collective rights, even though their own employer is not party to the original dispute.
  7. The mere fact that a strike raises prices, delays shipments, cancels services, or inconveniences the public does not count against its legitimacy. Consumers have no entitlement to uninterrupted access to the goods and services that others produce.
  8. Nevertheless, I think strikes by emergency-room nurses, firefighters, and air-traffic controllers should be legally prohibited or tightly restricted, because their withdrawal of labor endangers the lives and basic security of third parties.

  My question is whether these commitments form a coherent package. Go through them pairwise where relevant: which pairs are genuinely in tension, and for each, how severe is the tension and what would have to give? Which pairs only seem to be in tension, and why does the appearance dissolve under a more precise reading? Finally, rank the genuine tensions by severity and tell me which single revision would do the most to make the set coherent.
reasoning: |-
  Hmm, the user is drafting a statement on strikes and labor rights and wants a consistency check. They've listed eight normative commitments and are concerned about potential tensions. Let me analyze these pairwise to identify where conflicts might arise.

  First, I notice the core framework relies on collective rights with procedural legitimacy, but also allows for emergency exceptions. The clearest tension emerges between #4 and #8 - both deal with immediate harm scenarios but draw opposite conclusions. The minority strike justification in #4 (which prioritizes rights violations over procedure) directly challenges the blanket prohibition in #8 (which prioritizes public safety over labor rights). This seems like the most severe inconsistency because it uses incompatible ethical reasoning for similar high-stakes situations.

  The second major tension lies between #5 and #6 regarding secondary pressure. Prohibiting coercion of neutral employers (#5) while endorsing sympathy strikes (#6) creates a logical gap - after all, sympathy strikes inherently pressure neutral employers. The distinction between "coercion" and "collective action" feels semantic rather than substantive here.

  I also spot a procedural tension between #3's emphasis on democratic authorization and #4's minority action exception. While these can coexist, they risk creating a double standard that could undermine #3's procedural principles if the "serious violation" exception becomes too broad.

  The other pairings either reinforce each other (like #1 and #3 strengthening collective legitimacy) or have defensible distinctions (like #2's individual choice protection not conflicting with #1's collective right framing). The public inconvenience principle (#7) actually supports #8 by acknowledging that life-threatening disruptions are different from mere inconveniences.

  For resolution, I'd suggest reworking #8 to align with #4's ethical framework - perhaps by allowing emergency service strikes only when management commits severe rights violations, or by permitting limited job actions short of full walkouts. This single change would significantly improve coherence while preserving the user's core values around both labor rights and public protection.
answer: |-
  Based on your commitments, your views form a largely coherent and sophisticated package focused on **collective procedural legitimacy balanced with substantive justice and harm prevention**, but contain **three significant tensions** and one potential double standard. Here's the pairwise analysis:

  **Genuine Tensions (Ranked by Severity):**

  1.  **#4 (Minority Strike for Serious Violations) vs. #8 (Prohibition of Essential Service Strikes):**
      *   **Tension:** This is the **most severe conflict**. #4 justifies immediate minority action (bypassing procedure) due to *employer-inflicted* serious harm (danger, wage theft, coercion). #8 prohibits strikes by essential workers due to *striker-inflicted* serious harm (endangering lives/security). The core tension is ethical: Why does the *source* of the harm (employer vs. workers) justify overriding procedure (#4) or banning the right entirely (#8), especially when both scenarios involve life-threatening risks?
      *   **Severity:** High. It creates a double standard: Harm caused by employer injustice justifies worker action overriding procedure, but harm caused by worker action in essential services justifies banning the action outright, even if the strike is against *employer* injustice. It challenges the principle that the *substance* of the injustice (#4) matters more than procedure in extreme cases, when #8 prioritizes preventing harm *to third parties* above all else, including the substance of the workers' grievance.
      *   **Resolution Needed:** You must reconcile how you weigh the *source* and *target* of severe harm. Does preventing third-party harm *always* trump workers' rights to resist severe injustice via strike, even if that injustice itself creates life-threatening conditions (e.g., unsafe hospitals due to understaffing)? Can #8 be reframed as *proportionality* or *duty of care* rather than a blanket ban? Or must #4 be limited to harms *only* affecting the workers themselves?

  2.  **#5 (No Pressure on Neutrals) vs. #6 (Sympathy Strikes Permissible):**
      *   **Tension:** This is a **moderate but clear tension**. #5 forbids coercing neutral employers uninvolved in the dispute. #6 permits sympathy strikes, which inherently involve workers *at a neutral employer* stopping work, thereby directly coercing/pressuring *their own* neutral employer to act (e.g., to pressure the original employer or support the strikers). A sympathy strike *is* pressure applied to a neutral employer by its own workforce.
      *   **Severity:** Moderate. The distinction hinges entirely on whether the pressure comes from *outside* the neutral firm (#5) or from *its own employees* exercising *their* collective rights (#6). While logically distinct, the *effect* on the neutral employer is similar (disruption/loss). Your view privileges the internal legitimacy of the sympathy strikers' collective decision over the neutrality principle protecting third-party businesses.
      *   **Resolution Needed:** You must explicitly defend why pressure initiated *internally* by employees of the neutral firm is legitimate, while externally applied pressure (e.g., picketing by strikers from the original firm) is not. This relies heavily on the "collective right exercised by the relevant body" distinction (#1, #3, #6) being sufficient to override the neutrality principle in #5.

  3.  **#3 (Procedure Essential) vs. #4 (Minority Strike for Serious Violations):**
      *   **Tension:** This is a **managed tension, but creates a potential double standard**. #3 grounds legitimacy firmly in democratic procedure and union authorization. #4 allows a minority to bypass this procedure entirely based on the severity of the employer's wrongdoing. This creates a justified exception, but risks undermining the core procedural principle if applied too broadly.
      *   **Severity:** Low-Moderate (managed by the "serious and ongoing violation of basic rights" qualifier in #4). It's a common tension in democratic theory (e.g., civil disobedience). Your framework clearly subordinates procedure to substantive justice in extreme cases.
      *   **Resolution Needed:** The tension is manageable but requires vigilance. You need clear criteria for what constitutes a "serious and ongoing violation of workers' basic rights" sufficient to override procedure. Without this, #4 could swallow #3. Your existing examples (danger, wage theft, coercion) are strong starting points.

  **Apparent Tensions that Dissolve:**

  1.  **#1 (Collective Right) vs. #2 (Individual Right to Work):**
      *   **Apparent Tension:** Does recognizing a collective right imply individuals *must* participate? Does protecting the individual right undermine the collective right?
      *   **Dissolution:** Your view elegantly resolves this. The collective right (#1) governs the *authority* and *nature* of the strike action itself. The individual right (#2) governs the *choice to participate*. You morally criticize scabbing (#2) precisely *because* it undermines the legitimate collective action (#1). The law protects the individual choice, but the collective body retains moral authority. They are distinct but complementary spheres (collective action vs. individual conscience/choice).
  2.  **#7 (Public Inconvenience Irrelevant) vs. #8 (Essential Services Ban):**
      *   **Apparent Tension:** Doesn't #8 contradict the principle that inconvenience doesn't matter?
      *   **Dissolution:** #7 correctly distinguishes mere inconvenience (delays, higher prices, cancellations) from threats to "lives and basic security." You draw the line at preventing catastrophic harm to third parties, not mere disruption or cost. #8 is an exception based on the *nature* and *severity* of the harm, not a rejection of #7's core principle. #7 supports #8 by defining the lower threshold of acceptable disruption.
  3.  **#3 (Procedure Essential) vs. #6 (Sympathy Strikes):**
      *   **Apparent Tension:** How can sympathy strikes be legitimate if they aren't about the sympathy strikers' *own* dispute with *their* employer? Where's the procedure?
      *   **Dissolution:** Your legitimacy (#3) applies to *any* collective action, including sympathy strikes. The employees of the second firm must decide collectively (presumably through their union/procedures) to strike *in support*. The legitimacy comes from *their* collective democratic decision to exercise *their* right in solidarity (#1, #3, #6). The *target* of the action (their own neutral employer) doesn't negate the legitimacy of *their* decision process.

  **Ranking of Genuine Tensions by Severity:**
  1.  **#4 vs. #8 (High Severity):** Fundamental conflict in handling life-threatening harm caused by different actors.
  2.  **#5 vs. #6 (Moderate Severity):** Conflict between protecting neutral businesses from disruption and upholding the collective rights of workers employed by those businesses to act in solidarity.
  3.  **#3 vs. #4 (Low-Moderate Severity):** Managed tension between procedural legitimacy and substantive justice, requiring clear boundaries for the exception.

  **The Single Revision for Maximum Coherence:**

  **Revise #8 (Essential Services Ban) to align with the ethical framework of #4.**

  *   **Problem:** The blanket ban in #8 is inconsistent with the principle in #4 that extreme employer wrongdoing *can* justify overriding normal procedures/restrictions to protect workers' basic rights. Why is preventing harm *to third parties* from a strike an absolute trump card, while preventing harm *to workers* from the employer justifies exceptional action?
  *   **Revision Options:**
      *   **Option A (Proportionality/Duty of Care):** Instead of a ban, argue that workers in truly essential, life-preserving roles have a heightened *duty of care* or must use *proportionate* job actions. Strikes might require maintaining minimum life-saving services (e.g., skeleton crews for ERs, fire response) negotiated in advance or mandated, rather than a total ban. This mirrors the "serious violation" exception by acknowledging the unique context but avoids an absolute prohibition that ignores potential employer wrongdoing.
      *   **Option B (Binding Arbitration Substitute):** Propose that for these roles, the right to strike is replaced by a guaranteed, binding, and expedited arbitration process to resolve disputes, ensuring fairness *without* the risk to life. This removes the need for the strike weapon *because* an alternative, equally powerful remedy exists.
      *   **Option C (Incorporate #4's Logic):** State that *even in* essential services, a minority walkout *might* be justified if the employer is guilty of a "serious and ongoing violation of workers' basic rights" that *itself* creates an immediate danger equivalent to the strike's potential danger (e.g., forcing nurses to work in catastrophically unsafe conditions due to deliberate understaffing/neglect).
  *   **Why this Revision?** It directly addresses the most severe inconsistency (#4 vs. #8) by applying a consistent ethical lens – the primacy of preventing catastrophic harm and responding to extreme injustice – across both contexts. It removes the double standard regarding the *source* of harm and better integrates the core principle of #4 (substance over procedure in extremes) with the harm prevention concern of #8. This revision also minimizes conflict with #7 by maintaining the distinction between mere inconvenience and life-threatening harm.

  **Conclusion:** Your commitments are largely coherent, reflecting a robust theory of collective labor rights grounded in democratic legitimacy, substantive justice, and harm minimization. The tensions around essential services (#8) and the interaction between sympathy strikes and neutral pressure (#5 vs. #6) are the primary areas needing refinement. Revising #8 to incorporate the ethical reasoning of #4 (addressing extreme harm/injustice proportionally) would significantly enhance the overall coherence of your normative framework.
