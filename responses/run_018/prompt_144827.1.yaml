  *Pausing* Did I miss their deeper need? They might be wrestling with how to *do* philosophy after Quine killed metaphysics. The agenda I'm proposing makes ethics a branch of anthropology—studying how tribes revise value webs. That could disappoint someone craving ethical foundations... but Quine offers none. Better to be honest.

