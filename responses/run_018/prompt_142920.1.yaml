answer: |-
  Here's a tight joke built on your exact specs—no Sanskrit quotes, pure Nyāya mechanics turned into dating app absurdity:

  **Setup:**  
  My friend tried this new dating app, *Pramāṇa Match*. Instead of swiping on faces, you swipe on *how you know* you're into someone. Profiles show things like:  
  - ✅ *"Liking you via Pratyakṣa (Direct Perception): Your vibe in your 'Cooking Dal' reel felt immediate."*  
  - ❓ *"Attracted via Anumāna (Inference): Your 'Kant vs. Hegel' rant suggests hidden depths."*  
  - ♻️ *"Interest via Upamāna (Similarity): You remind me of my ex's healthier cousin."*  
  - 📜 *"Curious via Śabda (Testimony): My guru said you'd be here Tuesday."*  

  **Punchline:**  
  He matched with someone using *Upamāna*—"You look like someone who’d get my jokes." But the app *blocked* the chat. Support said: **"Similarity is a valid *pramāṇa*, but it only confirms the *analogy* (e.g., 'X is like Y'), not the *actual object* (you). We can’t enable messaging until you upgrade to a direct *pramā**."**  

  **Tag (for the tarka twist):**  
  He tried switching to "Tarka Mode" to logically eliminate bad matches. **It rejected *every* profile it saw—flawless negative reasoning. But when he begged it to *approve* someone? It just displayed: 'TARKA ERROR: Cannot affirm. Suggest Pratyakṣa or Śabda.'**  

  ---

  **Why it works for Nyāya nerds:**  
  1. **Upamāna twist** nails the core Nyāya debate: it *is* a distinct *pramāṇa*, but yields *sādṛśya-jñāna* (knowledge of similarity), not *svayam-vastu-jñāna* (knowledge of the thing itself). The app "blocking" the chat literalizes that limitation.  
  2. **Tarka’s eliminative purgatory** mirrors Gautama’s view: it refutes falsehoods (*dūṣana*) but can’t establish truth (*siddhānta*). The app rejecting everyone + failing to approve is pure *tarka* paralysis.  
  3. **The "upgrade to a direct *pramā*"** line subtly nods to *yathārthavṛtti*—only perception/testimony give you the real deal.  

  **Delivery tip:** Say "pramāṇa" like "pruh-MAH-nuh" and *pramā* like "PRUH-mah" (short "a"s). No need to over-pronounce—the logic’s the punchline.  

  Let me know if you want a shorter version or a visual tag (e.g., "His profile now just says: *Stuck in Tarka Hell. Send Śabda.*").
