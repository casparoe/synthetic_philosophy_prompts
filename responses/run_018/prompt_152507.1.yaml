prompt: |-
  Consider a research program spanning predictive processing and the free energy principle that deliberately avoids both the well-trodden dark-room objection literature and unfalsifiable cosmological extensions of active inference to all living and even non-living systems. The program is staffed by philosophers of science and theoretical modelers with no wet-lab access but strong formal backgrounds, with a three-year horizon. Its aim is not to accumulate another variant of hierarchical predictive coding, but to settle questions whose answers would restructure downstream work in psychiatric nosology, embodied robotics, or the philosophy of interoception.

  Given that constraint, which two or three open lines of inquiry should command the bulk of resources, and in what dependency order? I want an explicit defense: for each, whether it is upstream of the others (so that getting it wrong makes subsequent work moot), how tractable it is without direct empirical access, and whether resolving it would change practice rather than merely adding theoretical ornament.

  Specifically, weigh these candidates: (i) whether prediction-error minimization across interoceptive and exteroceptive domains requires a representational architecture or can be reconstructed in purely sensorimotor-coupling terms without loss of explanatory power; (ii) whether interoceptive inference fragments psychiatric classification further by multiplying domain-specific generative models, or instead unifies it under a single variational-bound account of allostatic failure; and (iii) whether the free-energy formulation provides a genuinely independent constraint on model selection, or is instead a redescription of dynamics already captured by standard Bayesian inference with different notation.

  Then address the meta-question: is the most upstream dispute conceptual—about what minimization denotes when scaled from neurons to organisms—or normative—about what distinguishes an explanatory model from a post-hoc variational gloss? And does settling one render the other dispensable?
reasoning: |-
  Okay, the user has posed a very specific and sophisticated question about prioritizing research in predictive processing and the free energy principle. They're clearly deeply knowledgeable—probably a philosopher of science or theoretical neuroscientist leading a research program. The constraints are tight: no wet-lab access, three-year horizon, and a mandate to avoid both the overworked dark-room literature and grand cosmological claims. 

  What's interesting is their impatience with theoretical ornamentation. They want interventions that'll reshape psychiatry, robotics, or interoception philosophy—domains where missteps have real consequences. The candidates they've listed reveal their concerns: (i) is about the representational vs. embodied debate, (ii) tackles psychiatric classification fragmentation, and (iii) questions whether FEP adds anything beyond Bayesian rebranding. 

  I notice they're hinting at a meta-layer too: is the core dispute conceptual (what minimization means at scale) or normative (what counts as explanation vs. redescription)? That's astute—it suggests they suspect foundational issues are paralyzing the field. Their phrasing "restructure downstream work" implies they've seen too many PP/FEP papers that don't change how researchers operate. 

  For prioritization, tractability matters. Without experiments, (i) and (iii) are safer bets—they're modeling/philosophy-native. (ii) is tempting but would need clinical validation eventually. The dependency order is key: if FEP is just Bayesian lipstick (iii), then debating interoceptive representations (i) might be premature. And if interoception fragments psychiatry (ii), but FEP isn't substantive (iii), the fragmentation critique loses force. 

  The real urgency lies in (iii). If FEP is merely notational, entire research programs collapse into exercises in relabeling. Settling this first avoids wasted effort on (i) and (ii). Next, (i) becomes critical because embodied vs. representational stances dictate model-building choices in robotics and psychiatry. (ii) should follow—it's downstream of how we conceptualize inference. 

  On the meta-question: the conceptual dispute about "minimization" feels upstream. If we can't define what's being minimized across scales, normative debates about explanation become incoherent. But crucially, resolving the conceptual piece won't make the normative one dispensable—even with perfect definitions, we'd still need criteria to distinguish explanation from redescription. The normative work keeps the conceptual honest. 

  This user doesn't need literature surveys; they need a battle plan. I'll emphasize that sequence: strangle the "is FEP vacuous?" threat first, then force clarity on representations vs. embodiment, letting those outcomes steer the psychiatric unification effort. And I'll stress that the meta-work must run parallel—defanging definitional vagueness while building guardrails against post-hoc storytelling.
answer: |-
  Based on your constraints (philosophical/theoretical focus, 3-year horizon, transformative impact target, avoidance of dark rooms/cosmology), the optimal prioritization is:

  1.  **Core Priority: (iii) FEP's Independent Constraint vs. Redescription**
      *   **Upstream Status:** **Fundamentally Upstream.** This question underpins the entire research program's validity. If FEP is merely notational sugar over standard Bayesian inference, then most "active inference" work becomes redundant ornamentation. Resolving this determines whether the FEP framework provides unique explanatory/predictive power or just relabels existing ideas.
      *   **Tractability:** **High (without wet-lab).** This is *precisely* a job for philosophers of science and formal modelers. It requires:
          *   Rigorous conceptual analysis comparing FEP formulations to standard Bayesian mechanics (e.g., message passing, inference algorithms, model comparison criteria like BIC/AIC vs. free energy).
          *   Formal modeling: Constructing isomorphic models (same dynamics/predictions) described both in standard Bayesian terms and FEP terms. Does the FEP description add constraints, suggest different model structures, or enable novel predictions *that cannot be derived* from the standard description?
          *   Analyzing historical cases: Did FEP lead to models or predictions genuinely different from what existed before in Bayesian cognitive science/neuroscience?
      *   **Impact Potential: Transformative.** A negative answer (mere redescription) would force a massive course correction away from FEP-centricity, saving vast resources in psychiatry, robotics, and philosophy. A positive answer (genuine constraint) would validate the framework as uniquely productive, restructuring model-building practices by mandating explicit derivation from or compatibility with the free energy principle, not just Bayesianism generally. It changes *how* models are built and justified.

  2.  **Second Priority: (i) Representational vs. Sensorimotor Architecture**
      *   **Upstream Status:** **Significantly Upstream (dependent on (iii)).** This question is crucial *only if* (iii) yields a positive result (FEP is genuinely constraining). If FEP is vacuous, debating its implementation architecture is moot. *Assuming FEP has substance*, resolving (i) determines the *kind* of models needed downstream.
      *   **Tractability:** **Moderate-High (without wet-lab).** Requires:
          *   Conceptual analysis: Defining "representation" rigorously within the FEP context vs. non-representational sensorimotor coupling.
          *   Formal modeling: Building minimal FEP-compliant models of increasing complexity (e.g., perception, action, interoception) in both representationalist and radical embodied/enactive styles. Compare explanatory scope, parsimony, and ability to capture key phenomena *without* invoking representations.
          *   Interface analysis: Can non-representational sensorimotor accounts *fully* accommodate the hierarchical, model-based structure central to PP/FEP explanations of complex cognition and psychopathology? Or do they require smuggling in functional equivalents?
      *   **Impact Potential: Transformative.** A strong non-representational account would revolutionize robotics (towards more dynamical, less model-heavy controllers) and philosophy of interoception (challenging notions of "body image" as representation). A vindication of representation necessitates richer internal models, impacting psychiatric nosology (e.g., framing disorders as specific *model* pathologies). It changes the *ontology* of models built.

  3.  **Third Priority / Conditional: (ii) Interoception: Psychiatric Fragmentation vs. Unification**
      *   **Upstream Status:** **Downstream (dependent on (iii) & (i)).** This question *presumes* FEP is substantive *and* that we have a viable architectural framework (representational or not) for building generative models incorporating interoception.
      *   **Tractability:** **Moderate (without wet-lab, but limited).** Requires:
          *   Conceptual mapping: Analyzing existing psychiatric categories through the lens of predicted interoceptive inference failures (e.g., anxiety as chronic interoceptive prediction error, depression as aberrant interoceptive precision weighting, psychosis as breakdown in interoceptive-exteroceptive integration).
          *   Formal modeling: Developing generative models simulating core allostatic processes and their potential failure modes, mapping these to symptom clusters. Compare the explanatory breadth of a single "variational allostatic failure" mechanism vs. requiring multiple distinct domain-specific model pathologies.
          *   *Limitation:* Ultimate validation of unification/fragmentation requires clinical data on symptom co-occurrence, biomarkers, and treatment response – beyond pure theory/modeling. A 3-year project can provide a *framework* and *hypotheses* but not definitive proof.
      *   **Impact Potential: Transformative (if tractable aspects succeed).** A successful unification framework would restructure psychiatric research and diagnostic manual revisions towards mechanisms (allostatic failure) rather than purely symptom clusters. It could guide biomarker search and novel treatment targets. However, its impact is *conditional* on robust results from (iii) and (i), and ultimate clinical validation lies beyond the project's scope. The theoretical groundwork laid here would be the crucial first step.

  **Dependency Order & Resource Allocation:**
  1.  **~50% Resources: (iii) FEP's Independent Constraint.** This is the gatekeeper. Resolving it first is non-negotiable. It dictates the relevance of the entire program.
  2.  **~35% Resources: (i) Representational Architecture.** Assuming (iii) is positive, this shapes the fundamental nature of all models built. It must precede detailed application work like (ii).
  3.  **~15% Resources: (ii) Interoception & Psychiatry Unification.** This is the most applied question, contingent on results from (iii) and (i). Initial work focuses on conceptual mapping and generative model development *based on the outcomes above*, setting the stage for future empirical testing.

  **Addressing the Meta-Question: Conceptual vs. Normative Upstream Dispute**

  The **most upstream dispute is fundamentally conceptual**: "What does minimization *denote* when scaled from neurons to organisms?" This question encompasses:

  *   **Scale & Ontology:** Is minimization fundamentally the same mathematical operation at neural circuits, whole-organism behavior, and evolutionary timescales? What is the ontological status of the "model" and "variational bound" at different scales?
  *   **Mechanism:** What are the *causal mechanisms* implementing minimization? Are they always inferential (Bayesian belief updating), or can minimization be achieved through non-inferential dynamics (e.g., homeostasis, autopoiesis, physical law)? Does "minimization" describe a process or merely label an outcome?
  *   **Interpretation:** Is minimization an objective physical process, an organism's subjective imperative, or an observer's descriptive tool?

  **Why conceptual is upstream:**
  *   **Precedence:** Without a clear, shared understanding of what "minimization" *is* and *how it works* across scales, normative debates about what constitutes an "explanatory model" lack a stable foundation. You cannot judge if a gloss is "post-hoc" if you can't rigorously define the core concept it's glossing.
  *   **Tractability First:** Clarifying the conceptual foundations (even if not fully resolving them) is a prerequisite for meaningful normative analysis. It defines the object of evaluation.

  **The Normative Dispute ("Explanatory Model vs. Post-hoc Gloss") is Crucial but Dependent:**
  *   **Dependency:** Normative criteria (explanatory depth, falsifiability, predictive power, unification) are applied *to* specific interpretations/models built upon the conceptual foundation. Settling the conceptual dispute constrains the *space of possible models* to which normative criteria apply.
  *   **Non-Dispensability:** **Settling the conceptual dispute does NOT render the normative one dispensable.** Even with a clear concept of minimization, one must still establish *how* that concept is used to build genuinely explanatory models versus vacuous redescription. A clear concept enables *more rigorous* normative evaluation but doesn't eliminate its necessity. FEP could be conceptually coherent at scale but still fail normatively if it only yields unfalsifiable post-hoc stories.

  **Conclusion:** Prioritize resolving the conceptual ambiguity of minimization across scales *first*, as it fundamentally defines the framework's subject matter. This enables and constrains the subsequent, essential normative work of establishing criteria to distinguish genuine explanations from mere glosses, which must be applied to specific models derived from the clarified concept. Both are vital, but the conceptual question is logically prior. Your program's strength in formal and philosophical analysis is perfectly suited to tackling this foundational conceptual challenge head-on, making it the critical first investment.
