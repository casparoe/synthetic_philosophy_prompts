  - For crux 1: A self-modifying macro that leaks its expansion context.
  - For crux 2: A strange loop where the interpreter lacks access to its own framing rules.

  We must design experiments that both sides agree are relevant and record predictions.

  Let's outline:

  Agreed Claims (Section 1):
  1. Formal systems, including those capable of self-reference, can contain embedded instructions that guide their own interpretation.
  2. In any interpretive act, a practical distinction must be made between the symbols being interpreted and the context in which interpretation occurs, even if this distinction is not absolute.
  3. Self-referential structures can create "strange loops" (Hofstadter's term) in which the apparent hierarchy of levels (e.g., meta-level and object-level) collapses, leading to phenomena such as fixed points or paradoxes.

  Disagreements (Section 2: Table):

  | Point of Divergence | Frame-First (FF) Position | Inner-Message-Only (IMO) Position |
  |----------------------|---------------------------|-----------------------------------|
  | Ontological status of the frame message | The frame message constitutes an ontologically distinct layer that is epistemically prior to the inner message. Meaning is primarily located in this contextual framing instruction, which sets the conditions for interpretation. | There is no ontologically distinct framing layer. What is called the "frame message" is simply a higher-order inner message, and all meaning is constituted within a unified symbol-manipulation system. |
  | Dependency of inner symbols on frame | The meaning of inner symbols is inherently dependent on the frame, which cannot be reduced to inner symbols without loss of essential context (analogous to how local variables depend on their call-stack frame). | The apparent dependency of inner symbols on a frame is an illusion; the frame is itself composed of inner symbols and can be fully represented as such (analogous to recursive macro expansion where every meta-level instruction is expanded into base-level syntax). |
  | Internalization of context | A framing context cannot be fully internalized without some residual dependency on an external interpreter or environment. | The framing context can be entirely internalized as part of the symbol system, with no residual external dependency. |

  Cruxes (Section 3):
  We present each crux with:
  - Crux question
  - Proposed conceptual test
  - Predictions

  Crux 1: Can a framing context be fully internalized without residual external dependency?

  Conceptual Test: Consider a self-modifying macro system in which a macro, during its expansion, attempts to access and modify the expansion context (e.g., the current set of macro definitions or the call stack). Specifically, design a macro that, when expanded, tries to redefine the macro expansion mechanism itself, and then observe whether the system can continue expansion without reference to an external context (e.g., the initial macro bindings or the top-level environment).

  - FF Prediction: The self-modification will inevitably "leak" the expansion context. The system will either crash, enter an undefined state, or require an external context to resolve the redefinition (e.g., the top-level environment that originally defined the macro). This shows that the frame (the expansion context) cannot be fully internalized; it remains externally dependent.
  - IMO Prediction: The macro system, if designed with sufficient reflexivity, can successfully modify itself and continue expansion without any external dependency. The entire process, including the redefinition of the expansion mechanism, can be represented within the system as a series of inner messages. The apparent "leak" is just a transitional state in the expansion process.

  Crux 2: Does the call-stack analogy reveal a genuine ontological difference between frame and inner message, or is it merely a pragmatic engineering convenience?

  Conceptual Test: Construct a strange loop in an interpreter: an interpreted program that, when run, attempts to access and alter the call-stack frame of the interpreter that is running it. Specifically, the program tries to read and then modify the interpreter's own state (e.g., the stack frame that represents the interpreter's activation record). The system is designed to allow such self-referential access.

  - FF Prediction: The attempt will result in a fundamental inconsistency or infinite regress because the interpreter's frame is ontologically distinct from the program it runs. The interpreter's frame is the precondition for the program's execution and cannot be made fully accessible to the program without destroying the frame's defining role (leading to a crash or undefined behavior). This reveals an ontological difference.
  - IMO Prediction: With careful design (e.g., a reflective interpreter that represents its own state as data), the program can successfully access and modify the interpreter's call-stack frame without causing a fundamental breakdown. The frame, when represented as data, becomes part of the inner message, showing that the distinction is pragmatic (for organizational convenience) and not ontological.

