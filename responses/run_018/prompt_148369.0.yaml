  My hunch is that this isnt about biology or logic at all, but about what we mean by 'encoding'—whether its a causal relation or a semantic one. Is that right, or is there a hidden empirical question about how replicases actually work? Or are the sides answering different questions—one about physical mechanisms, one about formal systems—under the same heading?

  Please diagnose it: verbal disagreement, substantive disagreement, bedrock intuition? And be honest—could anything actually end it? A new biochemical result, a formal distinction, or should we just accept its an ill-posed comparison?

  Also, please say how confident you are in what you claim and single out the point youre least sure about. Write in British English.
