  Let me mentally test their "menu" idea. If we treat a credal set as a set of possible precise doxastic states rather than one fuzzy state... does that dissolve some paradoxes? Like, dilation could be reframed as different agents in your "committee" reacting differently to evidence. But then we'd need new norms for how such committees update... 

