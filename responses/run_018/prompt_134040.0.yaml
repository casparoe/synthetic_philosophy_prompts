  Draft my Q&A prep sheet: about six objections ordered by damage, phrased exactly like this crowd would say them. Each needs a two-minute reply and an honest note on where it's soft. I want teh one question I'm praying nobody asks — probably the historian pressing on archival gaps for my French post-1830 procedural claim. Also note what I should concede up front in my opening remarks.

