prompt: |-
  Imagine you are advising a philosopher with three years of postdoctoral funding who wants to determine what cross-cultural differences in folk morality—particularly the WEIRD-psychology finding that moral cognition varies systematically across industrialized and small-scale societies—actually imply for philosophical debates about moral objectivity. Do not survey the field; instead, identify and rank the three open conceptual questions at this intersection that deserve the bulk of that effort. For each, defend its position in the ordering by explaining: (a) why it is upstream of the others in the sense that resolving it would restructure how we approach them; (b) what form of progress—conceptual analysis, empirical collaboration without new fieldwork, or formal modeling—is tractable within three years; and (c) what specific result or argument would cause you to reorder them.

  Crucially, separate two dimensions of variation that are often conflated: differences in first-order moral content (e.g., the relative weight of care versus loyalty) and differences in meta-ethical stance (e.g., whether people treat moral norms as mind-independent truths or as relational obligations tied to social roles). Then apply a further distinction: domain-level objectivity, the claim that a well-defined moral domain admits of a single correct normative structure, versus token-level objectivity, the claim that particular judgments hold regardless of cultural or relational context. Which conceptual problems about how these two levels interact—especially in light of evidence that some non-WEIRD populations deploy universalist moral language within tightly bounded social matrices but withhold it across them—are genuinely unsettled, and which are artifacts of this conflation?

  In your prioritization, evaluate three candidate directions: refining philosophical accounts of objectivity to accommodate deep pluralism without collapsing into relativism; challenging whether WEIRD samples have distorted our very conception of what counts as moral disagreement; and constructing normative frameworks—such as contextualist or relational objectivity—that accommodate the observed pattern of locally universal but globally variable moral commitment. Which of these lines of work should come first, second, and third, given the criteria of upstream dependency, philosophical tractability, and downstream impact? Do not provide citations, reading lists, or bibliographic references. Your answer should be a defended research agenda, not a literature review.
reasoning: |-
  Okay, the user wants me to advise a philosopher on prioritizing research questions regarding cross-cultural differences in folk morality and moral objectivity. Let me start by understanding the core issues.

  The philosopher is dealing with the WEIRD-psychology findings that show variations in moral cognition between industrialized and small-scale societies. The main task is to figure out how these differences impact debates on moral objectivity. The user emphasized separating two dimensions: first-order moral content (like care vs. loyalty) and meta-ethical stance (mind-independent truths vs. relational obligations). Also, they want a distinction between domain-level objectivity (a single correct structure for the moral domain) and token-level objectivity (specific judgments holding across contexts). 

  The user mentioned that non-WEIRD populations sometimes use universalist language within their social groups but not outside. This suggests that token-level objectivity might be context-bound. The key is to identify three open conceptual questions, rank them, and explain why each is upstream. The directions to evaluate are: refining philosophical accounts of objectivity, challenging WEIRD distortions of moral disagreement, and constructing contextualist frameworks.

  First, I need to determine which question is most upstream. The meta-ethical stance vs. first-order conflation seems fundamental. If we don't clarify whether observed differences are about content or the nature of moral truths, any further analysis might be misguided. For example, if people in different cultures have different meta-ethical commitments, that affects how we interpret their moral disagreements. Resolving this could restructure the approach to the other questions. Within three years, conceptual analysis combined with existing empirical data could sort this out. If evidence shows that meta-ethical stances are uniform across cultures, the order might change.

  Next, the second priority should be redefining moral disagreement. Once we understand whether differences are in stance or content, we can examine what constitutes genuine disagreement. WEIRD societies might assume shared domain-level objectivity, but other cultures might have domain-relativity. This affects how we approach constructing frameworks. Progress here involves conceptual analysis and empirical collaboration without new fieldwork. If it's found that all cultures share a domain concept, the priority might shift.

  Third, developing contextualist frameworks. This depends on the first two because without clarifying conflation and disagreement, any framework might be built on shaky premises. Formal modeling could be tractable here, showing how token-objectivity operates within contexts. If successful models emerge, they might elevate this in priority, but only after foundational issues are addressed.

  I should ensure that the ranking reflects upstream dependency. Question 1 (conflation) must come first because it underlies the others. Question 2 (disagreement) builds on that, and Question 3 (frameworks) depends on both. The user’s emphasis on avoiding relativism while accommodating pluralism is crucial. Also, considering the three-year timeframe, each step needs feasible methods: conceptual analysis for the first, empirical collaboration for the second, and formal modeling for the third.

  Finally, specific results that could reorder them: if meta-ethical stances are uniform, Question 1 becomes less critical. If all cultures share domain-level concepts, Question 2 might drop in priority. If contextualist models gain traction, Question 3 could move up. But as things stand, the conflation issue is the biggest hurdle, so starting there makes the most sense.
answer: |-
  Here is a prioritized research agenda addressing the core conceptual challenges, ranked by upstream impact and tractability:

  **1. Resolving the Meta-Ethical/First-Order Conflation**  
  *(Upstream Priority)*  
  **Why Upstream?** Current debates conflate whether cross-cultural differences reflect divergent *beliefs about what is morally true* (first-order content) vs. divergent *conceptions of what moral truth even is* (meta-ethical stance). Until this is disentangled, we cannot determine if observed variation challenges objectivity (e.g., "They deny universal harm norms!") or merely reveals pluralism within an agreed meta-ethical framework (e.g., "They universalize *different* norms"). Resolving this restructures all downstream work by defining *what kind of evidence* could threaten objectivity.  
  **Tractable Progress:** Conceptual analysis + empirical re-examination. Rigorously analyze existing ethnographic/experimental data on moral discourse (e.g., attributions of mind-independence, scope restrictions in "ought" claims) to isolate stance from content. Develop diagnostic criteria: e.g., does a culture's rejection of a norm *across contexts* imply meta-ethical relativism, or is it framed as a context-specific application of a universal domain?  
  **Reordering Trigger:** If evidence shows meta-ethical stances (e.g., commitment to mind-independence) are *invariant* across cultures despite first-order differences, this question resolves quickly, moving #2 to priority.

  **2. Diagnosing Domain-Level Relativity in Moral Disagreement**  
  *(Second Priority)*  
  **Why Second & Dependent?** Once stance/content are separated, we can ask: Do cultures share a concept of "the moral domain" as a unified field admitting objective truth? WEIRD presuppositions assume this, but evidence of non-WEIRD groups applying "universal" norms only *within* relational matrices (e.g., tribe, caste, or kin group) suggests they may operate with *domain-relativism*: morality exists only within a bounded social ontology. This challenges whether "moral disagreement" across cultures is even about the *same thing*, making token-level objectivity debates premature.  
  **Tractable Progress:** Conceptual analysis + empirical collaboration. Map implicit domain boundaries in moral reasoning across cultures using existing data: When someone says "X is wrong," what is the presumed scope of obligation? Does "wrongness" collapse outside specific relational contexts? Analyze linguistic markers of domain-boundary conditions.  
  **Reordering Trigger:** If cultures show identical domain-boundary assumptions (e.g., all presuppose obligations extend universally to humans), this becomes less urgent. If domain-relativity is confirmed, it becomes *more* critical than #3, as token-objectivity frameworks must first address fractured domains.

  **3. Constructing Contextualist Token-Objectivity Frameworks**  
  *(Third Priority)*  
  **Why Last & Dependent?** Only after clarifying #1 and #2 can we build models explaining *how* token-level objectivity (e.g., "Killing innocents is wrong") might hold *within* a context/domain despite domain-level pluralism. Attempting this first risks either smuggling in WEIRD domain assumptions or collapsing into relativism if contextual parameters aren't rigorously defined. Evidence of *local* universalism demands frameworks where objectivity is real but relationally indexed (e.g., "Within social role R, judgment J is universally binding").  
  **Tractable Progress:** Formal modeling + conceptual refinement. Develop parameterized models of "context" (social roles, relational matrices) that generate testable predictions about when token-judgments hold universally *within* a frame but vary *across* frames. Explore whether "objectivity" can be anchored in structural invariants (e.g., functional requirements of specific relational systems).  
  **Reordering Trigger:** If #1/#2 reveal minimal meta-ethical or domain-level variation, this ascends. If formal models successfully operationalize "context" without relativism (e.g., proving stable objectivity within bounded domains), it could surpass #2 in impact.

  **Why This Ordering?**  
  - **#1 is foundational:** Conflation invalidates all subsequent empirical inferences about objectivity. Clarifying it enables precise hypotheses in #2 and #3.  
  - **#2 is structurally critical:** Domain-relativity (if confirmed) radically redefines the "moral disagreement" objectivity must resolve, constraining viable models in #3.  
  - **#3 is applicative:** It builds on settled metaphysics of morality (#1) and domain architecture (#2). Premature focus here risks solving the wrong problem.  

  **Tractability Alignment:** #1 and #2 leverage existing empirical data with sharp conceptual tools, fitting the 3-year window. #3’s formal modeling is feasible but benefits from prior conceptual grounding. This sequence maximizes philosophical insight per unit effort while directly tackling the core conflation and domain/token distinction.
