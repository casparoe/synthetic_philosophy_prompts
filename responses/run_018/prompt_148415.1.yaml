prompt: |-
  You're an expert in comparative metaphysics and Buddhist philosophy. Before you write the plan, think step-by-step and do a quick brainstorm of the dependency chain. I'm a PhD student prepping a 90-minute session for second-year philosophy undergrads who've just finished classical logic and now think contradiction is always an error. I want to teach Nāgārjuna's tetralemma and Madhyamaka emptiness without falling back on the tired chariot example they probably saw in a youtube video.

  Plan the teaching arc for me: what logical reflex has to break before the fourfold negation makes sense; what concrete carrying example replaces the chariot (it must show why "it exists," "it doesn't exist," "both," and "neither" collapse for one reason, not four seperate arguments); the misconceptions they'll drag in—emptiness is nihilism, Nāgārjuna is just mystical—and exactly where in the sequence to kill each. Include one check at the end that distinguishes "they get emptiness as dependendent origination" from "they think it's all illusion." Also tell me what slice of the two-truths framework I should openly refuse to explain here. Keep it casual, like advising a fellow grad student, no bibliographies, and stay focused.
reasoning: |-
  Okay, the user is a PhD student preparing a 90-minute session for second-year philosophy undergrads. They've just finished classical logic and think contradiction is always an error. The goal is to teach Nāgārjuna's tetralemma and Madhyamaka emptiness without using the overused chariot example. 

  First, I need to identify the core challenge: breaking their binary logical reflex. These students are stuck in Aristotelian logic where things must be A or not-A. The tetralemma challenges that by showing all four positions (exists, doesn't exist, both, neither) collapse. The key is to make them see that contradictions aren't errors but signals pointing to emptiness.

  Next, finding a replacement example for the chariot. It needs to be concrete and show why all four positions fail for the same reason—dependence on parts. "Self" is too abstract. "University" works because it's relatable: Is the university the buildings? The people? The accreditation? None alone suffice, but without them, it doesn't exist. This demonstrates dependent origination clearly.

  Misconceptions to address: emptiness as nihilism and Nagarjuna as mystical. Timing is crucial. Nihilism must be preempted when introducing "neither exists nor doesn't exist." Contrast with nihilism explicitly: emptiness isn't non-existence but interdependence. The mystical label can be countered by emphasizing rigorous logic in the tetralemma, not mysticism.

  The two-truths framework is complex. Should avoid diving into conventional vs ultimate truth here. Focus solely on dependent origination to prevent confusion. Save the two truths for later.

  Check at the end: distinguish dependent origination from illusion. Use a question: "If everything is empty, is the table an illusion?" Highlight that the table functions dependently, so it's real conventionally, not illusory. This reinforces that emptiness isn't denying reality but redefining it.

  Structure the session: Start with their existing logic, break it with a paradox (like the liar), introduce the tetralemma with the university example, collapse the positions, address misconceptions, and end with the check. Keep it interactive to engage them and reinforce each step.

  Need to ensure the flow is logical, addresses their preconceptions, and makes the abstract concrete. Avoid jargon, keep it casual, and focus on relatable examples. Make sure the time is well-allocated across sections to cover all points without rushing.
answer: |-
  Here’s a tight, battle-tested plan to shatter binary logic and plant Madhyamaka without losing them. Focus on **one core rupture**: exposing that *contradictions arise from reifying concepts*, not reality itself. Skip the chariot—use **"The University"** instead (relatable, multi-layered, institutionally familiar). 

  **Total Time:** 90 mins (adjust Q&A as needed)  
  **Core Target:** Break the "A or ¬A" reflex *before* introducing the tetralemma.  

  ### Teaching Arc (Casual & Punchy)
  #### 1. **Warm-Up: Their Logic’s Pain Point (15 mins)**
     - *Do this:* Throw Zeno’s "Achilles & Tortoise" or the Liar Paradox at them. Ask: *"Where does logic ‘break’ here? Is reality wrong, or our categories?"*  
     - *Goal:* Surface their unspoken axiom—*"If contradiction, then error."* Make them feel the tension.  
     - *Pivot:* "What if some contradictions aren’t mistakes but *pointers*? Enter a 2nd-century Indian logician..."  

  #### 2. **The Binary Trap & The "Thingness" Illusion (20 mins)**  
     - *Key Move:* Isolate their reflex to **reify "things" (svabhāva)**. Use **"The University"**:  
       - *Q1:* "Does the University *exist*?" (Yes! We’re in it!)  
       - *Q2:* "Point to it. Is it the buildings? The faculty? The legal charter?" (Watch them struggle. Nothing *is* the uni alone.)  
       - *Hammer:* When they say "It’s all those things," ask: *"But if I torch the charter, is the uni gone? If I disband faculty but keep buildings?"*  
     - *Reveal:* Their "yes" relies on *ignoring dependence*; their "no" ignores function. **A or ¬A fails because "university" isn’t a freestanding *thing*.**  

  #### 3. **Tetralemma: Four Ways to Implode (25 mins)**  
     - *Present the 4 Positions using "University" (same reason for all collapses):*  
       - **Exists?** Yes → *but it depends on parts (no inherent "uni-ness").*  
       - **Doesn’t exist?** No → *but it functions (grants degrees, pays salaries).*  
       - **Both?** Nonsense → *mutually exclusive: if it inherently exists, it can’t be dependent/non-existent.*  
       - **Neither?** Lazy → *"neither" implies a 5th option (still reifying "uni" as *something* to deny).*  
     - *Crucial:* Emphasize **all four collapse from one insight—dependence (pratītyasamutpāda)**. Not four arguments, *one scalpel*.  

  #### 4. **Killing Misconceptions (15 mins)**  
     - **"Emptiness = Nihilism"**: Murder this when explaining "neither exists nor doesn’t." *"If I say your undergrad degree is empty, is it worthless? No—it functions *because* it’s dependent (on courses, exams, accreditation). Emptiness *is* function!"*  
     - **"Nāgārjuna = Mystic"**: Crush during the tetralemma. *"He’s not denying logic—he’s exposing *conceptual overreach*. You can’t call a rainbow ‘solid’ or ‘not solid’—it’s the wrong question!"*  

  #### 5. **The Check: "Dependent Origination" vs "Illusion" (10 mins)**  
     - *Do this:* Ask *"If everything’s empty, is this table an illusion?"*  
       - **Wrong answer:** "Yes, nothing is real." → *Nihilism alert!*  
       - **Right insight:** "It’s *conventionally* real—it holds my coffee *because* of causes (wood, carpenter, physics). But *inherently*? No."  
     - *Clincher:* "Illusion implies a *truer* reality behind it. Emptiness? No hidden layer. This dependent table *is* the reality."  

  #### 6. **What to SKIP from Two Truths**  
     - **Openly dismiss:** "I’m not touching *how* conventional truth *relates* to ultimate truth today—that’s a rabbit hole. For now: conventional = functional dependence, ultimate = lack of inherent existence. Done."  

  ### Why This Works  
  - **Dependency chain:** Binary illusion → reification → tetralemma as diagnostic tool → emptiness as cure.  
  - **"University"** > chariot: They *live* institutional dependence (grades! fees!), making svabhāva-abstraction visceral.  
  - **Preemptive strikes:** Nihilism dies when you tie emptiness to function; mysticism dies with ruthless logic.  
  - **Check** forces them to see emptiness as *affirming* interdependence, not denying reality.  

  **Pro tip:** End with a banger—*"Nāgārjuna’s not saying logic is useless. He’s saying: don’t blame reality when your concepts leak. Emptiness is philosophy’s plumber."*  

  Go wreck their binary minds. They’ll thank you later.
