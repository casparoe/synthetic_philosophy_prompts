prompt: |-
  I've been making little Roblox and Unity games for a few years, so I'm used to thinking of a jump like this: my script calls ApplyImpulse (or sets a velocity), and from then on the physics engine is what actually moves the character each tick; the script doesn't directly animate anything. Recently I went down a rabbit hole reading about the causal exclusion argument from philosophy of mind. The jist I got is something like this: if every physical event already has a sufficient physical cause (causal closure of the physical), then a mental event that's supposed to be distinct from physical events can't also be the cause of your action, unless we accept constant overdetermination; so either mental states just are physical states, or the mental is epiphenomenal. I keep feeling like this maps almost one-to-one onto the way I think about games: my script is the "mental" thing, the physics engine (the simulation state it updates every tick) is the "physical" thing, and the worry that the mental gets excluded is just the worry that the script isn't really causing anything because the physics engine would be causally closed on its own once the impulse is applied.

  Can you restate the causal exclusion argument and the main moves people make in reply (like identifying mental states with physical ones, or trying to save mental causation another way) in that game-engine vocabulary? Be specific about where scripts, physics state, engine ticks, collision callbacks, and communication between game systems are supposed to map. Then give me the residue report: which parts of the philosophical debate translate cleanly, which parts you had to fudge, and which parts don't have any counterpart in how a game loop actually works. What I actually want to know is whether my intuition that "the script is just along for the ride" is right, or whether it's sneaking in assumptions from game engines that don't belong.
