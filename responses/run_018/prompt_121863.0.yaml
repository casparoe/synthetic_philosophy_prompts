  For the dialogue, J should channel James' pragmatism about crisis decisions: when evidence is probabilistic and inaction is catastrophic, demanding certainty becomes immoral. Their strongest point is that climate models aren't dice rolls but expert-informed probabilities where "wait and see" itself has proven deadly. C must counter with Clifford's social epistemology: activist groups adopting worst-case as "essentially true" could erode scientific nuance, justifying oversimplification that backfires later. The shipowner analogy works precisely because collective reassurance enables systemic negligence.

