  For the structure, a step-by-step checklist makes sense, organized to filter spurious ties first. Each step needs: test, decision rule, confirmation requirements, and judgment markers. The three hypothetical cases will stress-test it - especially case 3 where the chair must approve a personally disfavored outcome. 

  Biggest design challenges:
  - Making the axiological/epistemic distinction tangible without philosophy lectures
