  You are a professional philosopher with expertise in metaphysics and the philosophy of science. I am a university student currently taking an advanced course on metaphysics and philosophy of biology, and I have become puzzled by what seems to be a hidden metaphysical commitment embedded in an institutional practice I had always assumed was purely pragmatic. Before answering, please take a moment to brainstorm the major positions in the problem of universals—particularly realism, nominalism, conceptualism, and trope theory—and briefly consider how each treats biological or engineered kinds.

  Consider the institutional practice of granting patents for genetically modified microorganisms. Patent doctrine requires that an invention be a composition of matter that is novel and non-obvious, and courts have consistently held that engineered bacterial strains are patentable only when they possess a stable, reproducible genotype that determines a specific functional kind. Meanwhile, contemporary evolutionary biology largely rejects essentialist species concepts, treating taxonomic categories as historical lineages rather than as natural kinds defined by shared essential properties.

  What philosophical commitments about universals does this patent practice presuppose? Does it implicitly commit to a realist view that an engineered strain instantiates a universal kind with essential genetic properties? Or can a nominalist account, or a trope-theoretic similarity class, explain why the law demands reproducibility and functional stability without treating the strain as an instance of a real universal? Reconstruct the implicit metaphysics, distinguish what the practice strictly requires from what merely fits it well, and assess whether the practice is philosophically consistent with modern biology's anti-essentialism or whether it quietly relies on an Aristotelian essentialism that biologists have abandoned. Think carefully step by step, and explain what would have to change in patent doctrine if the underlying metaphysical view were replaced by a purely lineage-based or cluster-based account of kinds.
