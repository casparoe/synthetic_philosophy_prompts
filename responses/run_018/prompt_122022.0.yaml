  The ML comparison holds up surprisingly well! Both involve boundary placement under uncertainty. But crucially, neither implies the categorized property is unreal - just that human/algorithmic access to it is noisy. The user's instinct about "underlying features" is spot-on; philosophers like Williamson make similar points. 

  Where the mate oversimplifies is claiming philosophers "mostly solve this by declaring arbitrary cutoffs." That's a fringe position (precisification). Mainstream approaches preserve the reality of properties while acknowledging linguistic indeterminacy. 

