  hey, i'm a backend engineer with basically zero formal philosophy background. my mate sent me a summary of the sorites paradox / vagueness thing. he says it's proof that language is broken: take grains away one by one and there's no sharp point where a heap stops being a heap, so words like 'heap' or 'bald' don't actually correspond to real properties in the world, they're just fuzzy in the same way an ML classifier with a bad decision boundary is fuzzy. he also claims philosophers mostly solve this by just declaring an arbitrary cutoff (like 9999 grains is a heap, 10000 isn't), which shows categorisation is totally conventional and there's no fact of the matter. i work with threshold tuning in production every day and that feels wrong — we pick cutoffs for practical reasons but we don't think the underlying feature doesn't exist. is thier summary fair? what parts are accurate, what are misrepresentations of the actual philosophical positions, and does the ML comparison hold up? please answer in british english. sorry for typos, writing this on the train with my thumbs.
