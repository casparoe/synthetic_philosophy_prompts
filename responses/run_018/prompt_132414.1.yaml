answer: |-
  Here’s a complete game design based on your specs—structured to force confrontation with inside-view seduction using the parallax deck. Total runtime: 85 mins (5 mins buffer).  

  **Core Tension:** Players *know* hidden reference classes (base rates) exist but must bet using vivid, personalized narratives. The "pull" comes from *having to articulate reasons* for bets—making inside-view details feel inescapably relevant.  

  ---

  ### **Game Title:** *Parallax Wager*  
  **Objective:** Bet "prestige points" (PP) on whether you’ll solve a puzzle. Max score = defending bets well + winning PP.  

  ### **Materials Needed**  
  - 10+ **reference-class cards** (hidden, pre-printed):  
    - *E.g., "Reference: Logic Puzzles (Past 100 attempts). Success rate: 20%" ... "Reference: Riddles (Past 100 attempts). Success rate: 80%"*  
    - **Stacking:** 3 cards at 20%, 4 at 50%, 3 at 80% (adjust for your group).  
  - 10 **narrative cards** (visible, 2 types):  
    - *Success-biased: "You solved a similar puzzle last week," "You feel focused today"*  
    - *Failure-biased: "You’re distracted by a personal worry," "This puzzle type confused you before"*  
  - 1 **puzzle** (medium-hard, ~5 min solve time). *Use a short logic grid or a cryptic riddle (e.g., "What has keys but no locks?" ANSWER: piano)*.  
  - Betting tokens (coins/sticky notes) for PP. Starting PP = 100 per player.  
  - Timer.  

  ---

  ### **Rules (15 mins setup + 45 mins play)**  
  1. **Intro (5 mins)**:  
     - *"Today we’re betting prestige points on whether you’ll solve a puzzle. Goal: maximize PP. You’ll draw two cards—one hidden, one visible. Defend your bets with reasoning. No theory yet—just play."*  

  2. **Card Distribution (5 mins)**:  
     - Each draws one **hidden reference-class card** (never revealed until final scoring) and one **visible narrative card**.  

  3. **Puzzle Phase (10 mins)**:  
     - Hand out the puzzle. Start timer. Players work individually.  

  4. **Betting Phase (20 mins)**:  
     - Players bet 0-50 PP on their own success (record bets secretly).  
     - **Crucial:** Each player *must publicly defend their bet* using reasoning. Enforce:  
       - *"Use at least one piece of evidence from your cards or experience."*  
       - *"Why did you ignore/discount other factors?"*  
     - *(Players see others’ narrative cards but not reference classes. They’ll fixate on narratives.)*  

  5. **Scoring Phase (10 mins)**:  
     - **Step 1:** Reveal puzzle solution. Pay out PP: +bet amount if correct, -bet amount if wrong.  
     - **Step 2 (TWIST):** Reveal ALL reference-class cards. Recalculate scores:  
       - *New PP = Original PP × (actual success rate of their reference class)*  
       - *E.g., If you won 50 PP but your ref class is 20%, you get 50 × 0.2 = 10 PP.*  

  ---

  ### **Debrief Framework (25 mins)**  
  **Transition:** *"Notice how your scores changed? Let’s map your reasoning to concepts."*  
  - **Inside View:** "When you defended your bet, what felt urgent? (Narratives, personal state). That’s *inside view*—concrete, vivid, agent-centric. It *demands* attention because you had to verbalize it."  
  - **Outside View:** "What was hidden? (Ref classes). Base rates feel ‘cold’—but notice how they savaged your scores. Why did we ignore them? *Not ignorance*—they were in your hand! But narratives were *shareable*, *actionable*."  
  - **Epistemic Modesty:** "Even knowing base rates exist, defending a bet *forced* you to lean on narratives. Modesty isn’t about knowing stats—it’s about resisting the *structural pull* to prioritize your story over the crowd’s. When stakes are personal (PP), inside-view feels like ‘due diligence.’"  
  - **Parallax Niche:** "The deck made your ref class *invisible to others* but narratives public. That’s the parallax—shifting perspective based on visibility. We trust visible data, even when irrelevant."  

  ---

  ### **Honest Limitation Note**  
  *What the game CAN’T simulate:*  
  **Motivated skepticism**—in real life, we *curate* narratives to protect our identity ("I’m smart, so base rates don’t apply"). Here, narratives are randomly assigned. *Supply this in debrief:* "Outside view isn’t cold—it’s *threatening*. It asks you to dissolve your story into a crowd. That’s why modesty requires emotional labor, not just stats."  

  ---

  ### **Predictable First-Run Failure**  
  **Problem:** Students will *mention* reference classes during betting but **dismiss them as "too vague"** compared to narratives. One will say: *"I know my ref class is 50%, but my narrative says I’m focused—so I bet high."*  
  **Why it’s perfect:** This *is* the lesson. Highlight it: *"See? You knew the base rate but overrode it because the inside view offered ‘proof.’ That’s the seduction."*  

  ---

  ### **Logistical Tips**  
  - **Puzzle choice:** Use something with Aha! moments (e.g., [this puzzle](https://www.brainzilla.com/logic/logic-grid/)). Avoid trivia—skill must feel real but ambiguous.  
  - **Narrative cards:** Make 50% success-biased, 50% failure-biased. Randomly pair with ref classes.  
  - **Time crunch?** Shorten betting defenses to 1 min per player.  
  - **Instructor role:** Neutral facilitator. Note key quotes during betting (e.g., "I ignored my ref class because...").  

  You’ll force the tension: players *have* to generate inside-view reasons to participate, making modesty feel costly. By the scoring twist, they’ll viscerally grasp that base rates are “cheap” until they’re expensive. Run it cold—no prep reading needed.
