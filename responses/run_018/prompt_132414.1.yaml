  Okay, the user is a PhD student in epistemology running a small grad seminar on reasoning and humility. They need an in-class game to illustrate the tension between inside-view and outside-view reasoning without lecturing upfront. The key is to make participants experience the seductiveness of inside-view reasoning even when they know about base rates.

