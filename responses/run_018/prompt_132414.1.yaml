  The user emphasized that epistemic modesty is hard to maintain, even intellectually accepting base rates. The game should make participants feel this pull. Payoff in prestige points, not cash, to keep it academic. Debrief should map moments to inside/outside views and explain why modesty is structurally difficult.

  I need to brainstorm mechanics. The parallax deck has two card types: reference-class (hidden, determines actual success rate) and narrative (visible, gives specific reasons). Each student gets one of each. The puzzle should be challenging but solvable within 5 minutes. Betting points on their own success. They must defend bets with reasoning, which will likely involve narrative cards since those are visible.

  Structuring the game phases: intro without theory, card distribution, puzzle time, betting with reasoning, revealing outcomes, recalculating scores with base rates, then debrief. In the betting phase, forcing them to articulate reasons will highlight their reliance on narrative, even if they know reference classes exist. The recalculation phase shows how ignoring base rates hurts their scores.

  For the debrief, guide them through the experience: initial confidence based on narratives, neglect of base rates, realization during scoring. Emphasize that inside-view feels more real and actionable, making it seductive. Note that the game can't replicate long-term effects of overconfidence; that needs discussion.

  Predictable issues: time management with puzzle-solving, students sharing reference classes, hesitation during betting. Mitigations: strict timers, monitor sharing, encourage participation.

