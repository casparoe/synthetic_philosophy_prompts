  The hidden reference classes must be pre-set with varying success rates (e.g., 20%, 50%, 80%). Narrative cards have plausible reasons for success/failure. Puzzle choice is important—something like a logic grid or cryptic puzzle that's solvable but tricky. Pre-test the puzzle to ensure it fits the time.

  During betting, students might not mention reference classes because they're hidden. The instructor can note this during debrief as overlooking base rates. Recalculating scores with base rates will show discrepancies, proving the point.

