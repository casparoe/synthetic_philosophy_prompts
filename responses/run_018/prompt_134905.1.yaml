prompt: |-
  please describe the most important implications of going disjunctivist about perceptual experience — the view that veridical seeing and hallucination dont share a common mental kind, so theres no single highest common factor between them — for how we should classify sensory experiences in sensory substitution devices. like, if a blind person using a tactile-to-visual device reports something phenomenally like seeing a red square, but the causal pathway runs through skin vibrations rather than retina, does disjunctivism force us to say they genuinely see (since the world is present in the right way) or that theyre in a totally different state? and what does that mean for anomaly detection frameworks that treat any deviation from standard retinal-cortical pathways as an anomaly — should they care about the causal route or about whether the subject stands in the right direct relation to the object? im particularly curious about whether the argument from illusion, which usually pushes us toward a shared phenomenal kind, actually backfires here and makes mediated perception look more like illusion than like seeing.
