  The hardest part? Making Jonas’s instrumentalism sophisticated. He shouldn’t deny math’s usefulness but argue it’s a "cognitive scaffold." When Mara says structural continuity licenses ontological commitment, he’d say: "Commitment to what? Relations without relata?"—pushing her to explain how structure constrains what exists. 

