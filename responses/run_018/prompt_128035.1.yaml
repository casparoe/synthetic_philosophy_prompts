  Okay, the user is a philosophy professor preparing graduate materials on Gödel's ontological argument and its descendants. They've noticed a recurring pattern in defenses of the argument where proponents oscillate between formal rigor and intuitive exemptions. This happens when critics create parallel arguments leading to contradictions, and defenders switch to intuitive grounding to block them, but then appeal to formal derivation when other objections arise. The professor wants to know if there's an established term for this or if a new term needs to be coined.

  First, I need to recall related concepts. Lakatos's protective-belt adjustments come to mind, where auxiliary hypotheses protect the core theory. But in this case, the core itself shifts between formal and intuitive grounds. Motte-and-bailey fallacy involves switching between defensible and stronger claims, but here it's not about claims but the basis of the argument—formal vs. intuitive.

  Then there's equivocation, especially with terms like "positive properties." But equivocation alone doesn't capture the systematic oscillation. The switch happens contextually: formal when advancing the argument, intuitive when blocking counterarguments. 

  The key is the defender's strategic shift depending on the objection. When faced with symmetry, they retreat to intuition; when faced with other critiques, they stand on formal grounds. This isn't just ad hoc because it's a repeated pattern tied to the argument's structure. 

  Existing terms don't perfectly fit. Protective-belt adjustments are about modifying auxiliary hypotheses, but here it's the same core being defended with different justifications. Motte-and-bailey is about claims, not methodological stances. Equivocation is about terms, but here it's about the entire argument's foundation.

  So, coining a new term seems necessary. "Modal Schizophrenia" captures the split between two irreconcilable stances. Or "Dialectical Bimodality" emphasizing the two modes. But "Modal Schizophrenia" is more vivid and reflects the contradictory approaches within modal logic. 

  Boundary conditions: it must involve a formal system generating existence claims, asymmetrical defense strategies, and the same term ("positive") being treated differently. It's not mere auxiliary hypothesis revision because the core definitions are at play. Not motte-and-bailey because it's not about weakening claims but shifting epistemic grounds.

  This phenomenon is peculiar to ontological arguments because they rely on defining perfection formally while needing intuitive grounding to avoid absurdities. Other existence proofs might not have this tension. 

  Potential errors: over-particularizing if similar patterns exist in other formal systems. If defenders consistently use intuition for both defense and advancement, then it's just ad hoc. But the pattern here is the strategic switch, which is unique.
answer: |-
  Based on your description, this is a distinct dialectical phenomenon not fully captured by existing categories, though it shares affinities. Here's the conceptual carving:

  1.  **Nearest Established Categories & Why They Don't Fit Precisely:**
      *   **Ad Hoc Immunization:** Comes closest. The defender immunizes the core argument against specific counterexamples (symmetry objections) by retreating to intuition, shielding the derivation. *Why not precise?* Ad hoc usually targets specific counterexamples with minimal adjustments. Here, the "adjustment" is a fundamental *shift in the epistemic status of the core definitions* (from formal to intuitive) depending on the challenge. It's not adding a new postulate but redefining what grounds the existing ones.
      *   **Protective-Belt Adjustment (Lakatosian):** The "positive properties" definition acts like the protective belt. Adjusting it intuitively to block symmetry objections fits. *Why not precise?* Lakatosian adjustments are typically *progressive* (predict novel facts) or *degenerative*. This oscillation isn't aimed at progress; it's dialectical defense. Crucially, the defender *also* appeals *to the belt's rigidity* (the formal closure) when confronting *other* objections (modal collapse, existence-as-property), treating it as part of the hard core. The belt's status itself oscillates.
      *   **Equivocation:** There's ambiguity between the formal/logical sense of "positive" (defined by closure rules) and the intuitive/value-laden sense. *Why not precise?* Equivocation is a semantic fallacy about inconsistent meaning. This is a *strategic, context-dependent deployment* of different justifications for the *same term within the argument's defense*. It's a pragmatic oscillation in grounding, not merely semantic slippage.
      *   **Motte-and-Bailey Fallacy:** The "formal derivation" is the indefensible bailey; the "intuitive grounding" is the defensible motte. Retreating to intuition against symmetry resembles retreating to the motte. *Why not precise?* In motte-and-bailey, the bailey is typically a stronger, desirable claim abandoned under pressure. Here, the "bailey" (formal derivation) *is the core conclusion the defender wants to keep*. They don't abandon it; they *rely on it* against other objections. The oscillation is between *justifications for the premises*, not between claims of different strength. The formal derivation remains the *means* to the conclusion in both contexts.

  2.  **The Phenomenon: Coined Term - "Modal Schizophrenia" (or "Dialectical Bimodality")**
      *   **Definition:** A dialectical strategy in formal ontological arguments (particularly modal versions) where the defender oscillates contextually between two irreconcilable modes of grounding the core primitive (e.g., "positive properties"):
          1.  **Formal-Modal Mode:** The primitive and its closure conditions are treated as rigorous, self-sufficient components of the formal system, sufficient to derive the necessary existence conclusion and immune to revision based on intuition or external critique (e.g., objections to existence as a perfection, modal collapse).
          2.  **Intuitive-Value Mode:** The primitive and its closure conditions are treated as merely heuristic formalizations of a pre-theoretic, intuitive notion (e.g., pure perfection, intrinsic value), allowing the defender to dismiss formal counter-derivations (e.g., symmetry objections, inconsistent maximals) or problematic property combinations by appealing to the primacy of this intuition over the formal apparatus.
      *   **Core Mechanism:** The defender exploits the *formal derivation* as an unassailable logical engine for the *conclusion* while maintaining the *flexibility* to redefine the *inputs* (the primitive property class) intuitively whenever the formal inputs threaten to generate unacceptable outputs (contradictions, anti-Gods). The shift preserves the *argument's validity* while fending off falsification.

  3.  **Boundary Conditions (What it IS and IS NOT):**
      *   **IS:**
          *   Centered on a *formal existence proof* within *modal logic* (S5 or similar).
          *   Requires a *core primitive* (like "positive property") defined by *formal closure conditions*.
          *   Involves *defending against two distinct types of objections*: (1) Formal symmetry/counter-derivations, and (2) Philosophical critiques of premises/concepts within the derivation.
          *   Characterized by a *systematic, contextual shift* in the epistemic grounding of the primitive: intuitive to block type (1), formal to block type (2).
          *   Preserves the *validity* of the core derivation while undermining its *soundness* under scrutiny by making the primitive's definition context-dependent.
      *   **IS NOT:**
          *   **Ordinary Auxiliary-Hypothesis Revision:** This involves modifying or adding explicit hypotheses. "Modal Schizophrenia" involves changing the *justification* and *epistemic status* of the *core definition itself*, not adding/changing auxiliary claims. The definition *stays the same syntactically*; its *semantics/grounding* oscillates.
          *   **Motte-and-Bailey:** While sharing a retreat aspect, this isn't abandoning a stronger claim for a weaker one. The defender *always* maintains the *same strong conclusion* (necessary existence of God). The oscillation is in the *supporting rationale* for the *premises*, not the claims themselves.
          *   **Simple Ambiguity:** The ambiguity is *exploited strategically* within the dialectic. It's not just vagueness; it's a *tactical deployment* of different interpretations contextually to defend the argument.
          *   **Peculiar to Modal Ontological Arguments?** While *paradigmatically* exhibited in these arguments due to the combination of formal modal derivation + value-laden primitive + high metaphysical stakes, the *structure* could potentially appear elsewhere. Key elements needed: a formal proof claiming metaphysical existence, a core primitive defined both formally and intuitively, vulnerability to both formal counter-proofs and philosophical critiques of premises. It's *less likely* in purely mathematical existence proofs where the primitive (e.g., "set") lacks the strong intuitive/value dimension.

  4.  **Point of Likely Error & Falsifying Evidence:**
      *   **Point of Likely Error:** Over-particularizing. The core criticism might be that this is simply a *species* of inconsistent or ad hoc stipulation common in many defenses of contested theories, and the focus on modal logic/ontology is unnecessary. The oscillation might be reducible to a common fallacy of equivocation combined with special pleading.
      *   **Argument/Evidence That Would Change Identification:** Demonstration that this *exact pattern of oscillation* (formal defense against conceptual critique / intuitive defense against formal counter-derivation) is systematically employed and recognized under an established label (like a specific type of "dialectical inconsistency" or "contextual equivocation") in defenses of *non-modal* or *non-ontological* formal arguments (e.g., in formal ethics, formal epistemology, or even certain scientific modeling contexts). If the pattern is indistinguishable from how "ceteris paribus clauses" or "idealizations" are defended in other formal systems, then coining a new term specific to ontology is unwarranted. Evidence showing defenders *consistently* use *only* the intuitive grounding (or *only* the formal grounding) in *all* responses would also negate the description of an *oscillation*.

  **In essence:** "Modal Schizophrenia" is the strategic, context-dependent oscillation in the grounding of a core primitive within a modal ontological argument, treating it as a formal-logical given when defending against philosophical critiques of the derivation's concepts, but treating it as an intuitive-value given when defending against formal counter-derivations exploiting the logic's symmetry, thereby preserving the argument's formal validity while insulating it from decisive refutation by making its soundness criteria unstable. It is distinguished by this *bimodal defense strategy* centered on the epistemic status of the primitive.
