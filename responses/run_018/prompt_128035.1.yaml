  You are an expert philosophical logician and philosopher of religion with deep familiarity with modal metaphysics and the history of ontological arguments. Before addressing my specific question, please think carefully and begin by outlining the nearest established categories—such as immunization strategies, protective-belt adjustments, or dialectical fallacies—that might cover the pattern I am about to describe; only then turn to whether any of them fits precisely, or whether a new term and boundary conditions are needed.

  I am a philosophy professor preparing graduate materials on Gödel's modal ontological argument and its descendants. In both the literature and in seminar discussions I keep encountering a recurring dialectical configuration that I do not have a clean name for. A defender sets up the argument with a formal modal apparatus—possible worlds, an S5 framework, closure conditions on a class of properties called "positive"—and derives that a being instantiating all of them exists necessarily. A critic then shows that the same formal machinery, paired with a symmetrically defined class of properties, generates a parallel derivation for a contradictory being, or fragments the notion of maximal excellence into incompatible specifications, or yields an "anti-God" with parallel modal status. Rather than revising the formal system, the defender responds that the property class was never meant to be defined purely by those formal conditions: "positive" is anchored in a pre-theoretic, intuitive grasp of pure perfection or value, and the closure rules are merely heuristic approximations. Yet when the original argument is attacked on different grounds—for instance, that necessary existence is not a genuine property, or that the modal collapse treats existence as a perfection—the defender appeals precisely to the rigor of the formal derivation and to the closure conditions as if they were self-sufficient and immune to intuitive revision. I have seen this in two concrete contexts: first, in responses to symmetry objections where the asymmetry between positive and negative properties is maintained only by an appeal to intuitive value-judgments; second, in debates over whether properties like omnipotence and omniscience are genuinely compossible within a single modal profile, where formal closure is invoked to guarantee consistency but intuitive filtering is used to exclude problematic combinations.

  Is there an established concept that names this exact oscillation—formal rigor in advancing the argument, intuitive exemption in blocking parallel constructions—or does it fall under a broader heading such as an ad hoc immunization, a Lakatosian protective-belt adjustment, or an equivocation between technical and ordinary senses of "positive"? If there is no precise term, can you coin one and define it with clear boundary conditions, distinguishing it sharply from ordinary auxiliary-hypothesis revision, from the motte-and-bailey fallacy, and from simple ambiguity? I want the carving, not a bare label: what exactly the phenomenon is, what it is not, and where its edges lie, especially regarding whether it is peculiar to modal ontological arguments or extends to other formal existence proofs. I am not asking for a bibliography, reading list, or citations; I want an analysis that a model without web access could produce from conceptual reasoning alone.

  Please state explicitly what argument or piece of evidence would change your identification—for example, if the pattern turned out to be indistinguishable from standard research-program defense mechanisms—and identify the point in your reasoning where you are most likely to have erred, whether by over-particularizing a common dialectical tactic or by missing an existing technical term in modal metaphysics.
