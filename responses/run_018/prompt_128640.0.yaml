prompt: |-
  hey — i'm putting together a feature on longtermist ethics and need a quick sanity check. a colleague who reads the rationalist blogs summarized "strong longtermism" for me like this: "It's basically the claim that preventing human extinction over the next 500 years is literally the only moral priority, since Bostrom's 10^58 argument shows future digital lives swamp present ones by so much that saving one person today is morally worthless. The view says we should defund global health to work on AI aligment, and critics are right that it's just sci-fi speculation with math on top because nobody can predict 500 years out."

  i'm suspicious but don't know the philosophy well enough to spot the sleight of hand. you are an expert in normative ethics and decision theory. please think carefully: start by brainstorming the three distinctions that actually matter here — axiological vs strategic longtermism, expected-value reasoning vs specific prediction, and domination vs lexical priority. then audit that summary sentence-by-sentence. what's accurate, what's a subtle misrepresentation or conflation, and does the "sci-fi speculation" dismissal actually follow from the errors?

  hard constraint: max 300 words, bottom line up front in one sentence, then bullet points. don't give me a bibliography — just the audit.
reasoning: |-
  Okay, the user is working on a feature about longtermist ethics and needs a sanity check on a colleague's summary. They're suspicious but not deeply familiar with the philosophy. The colleague claimed strong longtermism says preventing extinction in the next 500 years is the only moral priority, that present lives are worthless due to future digital lives, and that we should defund global health for AI alignment—all dismissed as sci-fi speculation.

  First, I need to recall key distinctions. Axiological longtermism is about values—future lives matter just as much. Strategic is about actions, focusing on extinction risks. Then, expected-value reasoning weighs probabilities and impacts, unlike specific predictions which claim certainty. Domination means future benefits vastly outweigh present ones, but not necessarily that present lives have zero value (lexical priority). 

  The colleague's summary conflates these. Saying extinction prevention is the "only moral priority" mixes strategic with axiological. The 10^58 argument is about potential scale, not that saving one life now is worthless—that's a misrepresentation. Defunding global health assumes a zero-sum trade-off that longtermists might not endorse; they could advocate for both. The sci-fi critique ignores expected-value reasoning. Even with uncertainty, if an existential risk has a tiny chance of huge impact, it could still dominate. 

  The user needs clarity without jargon. They might be concerned about misrepresenting the philosophy in their feature. Their deeper need is to accurately present the arguments without bias, addressing both supporters and critics. Pointing out the conflations helps them show nuance. Also, highlighting that longtermism doesn't dismiss current suffering entirely counters the "defund health" claim. The sci-fi critique is valid if misapplied, but expected value is standard in decision theory, not just speculation. 

  I'll structure the response with a bottom line upfront, then bullets for each sentence audit. Keep it under 300 words, no bibliography. Focus on accuracy, misrepresentations, and whether the dismissal follows from the errors.
answer: |-
  **Bottom line:** The summary conflates key distinctions, misrepresents core longtermist claims as more extreme than they are, and the "sci-fi" dismissal fails against standard expected-value reasoning even under deep uncertainty.

  **Brainstormed Key Distinctions:**
  1.  **Axiological vs Strategic Longtermism:** Axiological claims future lives have non-diminishing moral weight. Strategic claims influencing the long-term future is a key *current* priority given risks/opportunities.
  2.  **Expected-Value Reasoning vs Specific Prediction:** Strong longtermism uses EV reasoning: multiplying vast *potential* future value by small probabilities of affecting it. It doesn't require precise *predictions*.
  3.  **Domination vs Lexical Priority:** Future potential *dominates* present concerns in EV calculations due to scale, but this doesn't imply present lives have *zero* value ("lexical priority").

  **Audit of Summary:**
  1.  *"preventing human extinction over the next 500 years is literally the only moral priority"*: **Misrepresentation.** Strategic longtermism argues extinction prevention is *overwhelmingly* important due to EV, not that *no* other moral priorities exist (e.g., preventing torture). "Only" suggests lexical priority, which is rare.
  2.  *"Bostrom's 10^58 argument shows future digital lives swamp present ones"*: **Accurate core intuition (domination), but...** The argument illustrates the scale *potential*, not a proven fact. The key is the *expected value* calculation.
  3.  *"saving one person today is morally worthless"*: **Major Misrepresentation/Conflation.** Longtermism uses EV. Saving one life *now* has positive value. The claim is that *some* actions targeting the long-term future have *much higher expected value* than most near-term interventions. "Worthless" falsely implies lexical priority.
  4.  *"we should defund global health to work on AI alignment"*: **Strategic oversimplification.** While AI alignment is a major longtermist priority, the claim is *reallocating resources based on EV*, not necessarily "defund" one for the other. Many longtermists support robust global health *and* existential risk mitigation.
  5.  *"critics are right that it's just sci-fi speculation with math... nobody can predict 500 years out"*: **Doesn't follow.** The dismissal conflates EV reasoning with precise prediction. Longtermism relies on *uncertain* but *plausible* scenarios (e.g., AI risk, bioengineered pandemics) and argues that even tiny probabilities of affecting vast future value justify priority. Standard decision theory applies EV under uncertainty (e.g., insurance, Pascal's Wager). Calling this "sci-fi" ignores the structure of the argument.
