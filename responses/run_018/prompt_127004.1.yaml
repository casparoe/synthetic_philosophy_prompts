answer: |-
  ## Research Proposal: Structural Realism Beyond Physics - An Asymmetry in Ontological Commitment?

  **1. The Precise Question (~200 words)**

  This project investigates whether the core ontological move of epistemic structural realism (ESR) – abandoning realism about unobservable *entities* while preserving realism about the *structures* described by successful theories – undergoes a fundamental inversion when applied outside fundamental physics, specifically within the social sciences. While ESR typically addresses pessimistic meta-induction (past theories' entities were discarded; so will current ones) and underdetermination (multiple ontologies fit the same structure) within physics (e.g., replacing ether with spacetime structure, particles with quantum states/wavefunctions), its application to social science faces a unique challenge. Here, the putative "entities" (markets, social classes, bureaucracies) are often already explicitly recognized as conceptual constructs or emergent phenomena, not fundamental posits analogous to particles. Conversely, the "structures" often manifest as statistical correlations, regression models, or institutional patterns – forms seemingly more vulnerable to underdetermination and revisability than mathematical laws of physics. **Therefore, the precise question is: Does applying ESR to social science paradoxically require *realism about the constructed entities* (as the stable anchors) and *anti-realism about the purported structures* (as contingent correlations), thereby reversing the ontological commitment ESR advocates in physics?** This probes the domain-specificity and potential asymmetry inherent in ESR's core argument.

  **2. The Gap (~200 words)**

  The existing literature on structural realism is overwhelmingly focused on physics, where structures are robust mathematical equations with strong predictive power (e.g., Maxwell's equations, quantum formalism). Arguments for ESR here leverage the continuity of these mathematical structures through theory change. Attempts to extend ESR beyond physics often assume a direct analogy: "structures" in other domains are treated as isomorphic to mathematical laws. This overlooks critical differences. Firstly, social science "structures" (e.g., regression coefficients, network topologies) typically lack the nomological necessity and temporal stability of fundamental physical laws; they are often descriptive, probabilistic, and context-dependent. Secondly, the nature of underdetermination differs. In physics, underdetermination threatens the ontological interpretation *of the entities fitting the structure*. In social science, the very *identification and stability of the structure itself* (e.g., which variables correlate, the functional form of a model) is frequently contested and highly sensitive to methodology, data selection, and theoretical framing. A direct analogical extension fails because it doesn't grapple with the relative epistemic fragility of "structure" and the relative stability (as constructs) of "entities" in the social domain compared to physics.

  **3. The Method (~250 words)**

  This project will employ a comparative case-study analysis focused on ontological commitment:
  1.  **Physics Case (Quantum Mechanics - QM):** Analyze the ESR argument for QM. Entities (e.g., particles as classical objects) are deemed problematic due to underdetermination (wave-particle duality) and pessimistic induction (replacement of classical concepts). The preserved "structure" is the mathematical formalism of state vectors in Hilbert space and their evolution, offering predictive success.
  2.  **Social Science Case (Economic Equilibrium Models - e.g., DSGE):** Analyze a prominent, predictive model type. The "entities" (consumers, firms, markets) are explicitly understood as idealizations or aggregates. The "structure" is the complex system of equations defining relationships (utility functions, production functions, equilibrium conditions) and their estimated parameters. The stability and necessity of this specific mathematical structure, however, is highly contested (e.g., critiques of rational expectations assumptions, parameter instability, model fragility).

  **Comparison:** Map the arguments:
  *   **Underdetermination:** In QM, multiple interpretations (Bohmian, Copenhagen, Many-Worlds) fit the structure. In DSGE, are multiple, empirically equivalent *structural forms* conceivable (e.g., alternative behavioral assumptions yielding similar aggregate fits)? Is underdetermination more about the *structure itself* than the entities?
  *   **Pessimistic Meta-induction:** Do past discarded economic *structures* (e.g., Phillips Curve in original form, specific IS-LM formulations) undermine realism about current model structures more severely than the loss of entities undermines realism about QM's structure?
  *   **Ontological Commitment:** Does preserving predictive success in economics realistically commit us to the *idealized entities* ("markets," "rational agents") as useful constructs, while forcing anti-realism about the *specific structural equations* as contingent modeling choices?

  **Semester Plan:** Deep dive into the QM ESR literature. Analyze key economic model(s) and their realism debates. Systematically compare the locus of underdetermination and the nature of the preserved "structure" across the cases. Evaluate if the ESR move flips.

  **4. Success and Failure (~150 words)**

  *   **Success:** A successful project will clearly demonstrate the proposed asymmetry. A positive result would show that applying ESR rigorously to the chosen social science case leads logically to a reversal: realism about the *constructed entities* as necessary conceptual anchors for discourse and practice, coupled with anti-realism (or instrumentalism) towards the specific *mathematical/statistical structures* (equations, models) due to their vulnerability to underdetermination, instability, and methodological contingency. This would significantly challenge universalist claims for ESR.
  *   **Failure:** The project would fail if the asymmetry vanishes upon close examination. This could happen if: 1) Robust, law-like structures truly analogous to physics can be definitively identified in the social case, negating the fragility argument; 2) The social "entities" prove to be *more* ontologically problematic than their physical counterparts under ESR scrutiny; 3) The cases are deemed too dissimilar for meaningful comparison. Ambiguity in defining "structure" across domains could also undermine the analysis.

  **5. Scope Check (~100 words)**

  This project is ambitious for one semester, primarily due to the depth required in both philosophy of physics/philosophy of science and the chosen social science domain (economics). **To make it feasible:** The comparative analysis will focus intensely on **one** well-defined physics case (QM) and **one** well-defined social science case (e.g., core assumptions and structures of DSGE or a specific class of econometric models). Broader surveys of structural realism or multiple social science domains will be avoided. The core work is conceptual analysis and argument mapping within these bounded cases. Success hinges on disciplined focus on the ontology/structure comparison, not comprehensive coverage of either field.
