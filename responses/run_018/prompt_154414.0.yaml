  When scoring the theories, I'll be honest about their limitations. Strawson might handle intimacy well but struggles with opacity. Reasons-responsiveness clarifies excuses but oversimplifies the agent/action distinction. The revisionist approach might help with caregiver suspension but at the cost of dismissing attitudes' depth. The tension between universality and contextual suspension will likely be the hardest nut to crack.

