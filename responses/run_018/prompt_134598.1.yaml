prompt: |-
  As a retired biologist now working in moral philosophy, I am designing a 90-minute workshop for sixteen advanced undergraduates. I want them to feel, through action rather than lecture, that labeling an exchange "corrupt" depends on an unstated ontology of the office being polluted, and that applying Western bureaucratic-purity standards universally can misclassify socially embedded reciprocity as deviance. Design a structured role-play or deliberation game—using only reputation points and access tokens, not money—with explicit rules and assigned roles. Participants should first classify a fixed sequence of gift and favor exchanges instinctively, then have the institutional background revealed (a Weberian bureaucratic frame, a local reciprocity frame in which giving to a health official is a moral obligation sustaining trust, and a hybrid translation frame), discover that their classifications invert, and finally face a forced choice in which honoring one frame necessarily violates another. The debrief should map specific game moments onto the claim that corruption is frame-relative rather than act-intrinsic, predict what will go wrong on the first run—likely participants collapsing all non-bureaucratic frames into a single "cultural exception"—and state frankly which feature of the position, perhaps the absence of any neutral meta-frame for adjudication, the activity cannot reproduce and I must supply myself. Keep the design self-contained: no bibliographies, reading lists, or citations, since I will run it without external resources.
reasoning: |-
  We are designing a 90-minute workshop for 16 advanced undergraduates. The goal is to demonstrate that labeling an exchange as "corrupt" depends on the underlying ontology of the office and that applying Western bureaucratic standards universally can misclassify socially embedded reciprocity.

  The design must include:
  - A role-play or deliberation game.
  - Use only reputation points and access tokens (no money).
  - Explicit rules and assigned roles.
  - Participants first classify a fixed sequence of gift and favor exchanges instinctively.
  - Then reveal three institutional backgrounds (Weberian bureaucratic frame, local reciprocity frame, hybrid translation frame).
  - Participants then reclassify and discover that their classifications invert.
  - Finally, a forced choice where honoring one frame violates another.

  Debrief should:
  - Map game moments to the claim that corruption is frame-relative.
  - Predict what will go wrong on the first run (likely collapsing non-bureaucratic frames into a single "cultural exception").
  - State which feature (e.g., absence of a neutral meta-frame) the activity cannot reproduce and must be supplied by the facilitator.

  Structure:

  1. Introduction (5 minutes)
  2. Instinctive Classification Phase (15 minutes)
  3. Reveal of Institutional Backgrounds (5 minutes)
  4. Role-Play with Three Frames (40 minutes)
  5. Forced Choice Scenario (10 minutes)
  6. Debrief (15 minutes)

  Total: 90 minutes.

  Detailed Design:

  **1. Introduction (5 minutes)**
     - Explain the workshop will explore how we judge exchanges in different contexts.
     - Introduce the concept of "reputation points" (RP) and "access tokens" (AT). 
       - Reputation points: Represent social standing and trust. Gained by acting in accordance with one's role and the frame. Lost by acting against it.
       - Access tokens: Represent access to services, opportunities, or information. Used to request favors or gain benefits.

  **2. Instinctive Classification Phase (15 minutes)**
     - Present a fixed sequence of 5 scenarios of gift/favor exchanges. Each scenario is described in a neutral way without context.
     - Participants individually classify each exchange as "corrupt" (C) or "not corrupt" (NC) and note their reasoning.
     - Then, in small groups (4 groups of 4) they discuss and come to a consensus for each scenario.

  Example Scenarios (fixed sequence):
     1. A patient gives a box of chocolates to a nurse after a successful surgery.
     2. A business owner offers a free meal to a health inspector during an inspection.
     3. A student gives a teacher a gift basket at the end of the semester.
     4. A construction company provides free building materials to a public school in exchange for the school principal's approval of their building permit.
     5. A farmer brings a chicken to a local health official every month as a thank you for the official's regular visits to check on the health of the farmer's livestock.

  After individual and group classification, collect group results (without discussion of why) and note the majority view for each.

  **3. Reveal of Institutional Backgrounds (5 minutes)**
     - Explain that the same acts can be seen differently depending on the institutional frame. Introduce three frames:
       - **Frame 1: Weberian Bureaucratic Frame (WB)**
          - Offices are impersonal. Gifts/favors create obligations that interfere with impartiality. Any gift to an official in the course of duty is corrupt.
       - **Frame 2: Local Reciprocity Frame (LR)**
          - Offices are embedded in social relationships. Gifts are moral obligations that sustain trust and social cohesion. Not giving when expected is a breach of trust and can lead to exclusion.
       - **Frame 3: Hybrid Translation Frame (HT)**
          - A mix: Some actors try to follow bureaucratic rules, but others operate in the reciprocity frame. Acts may be intended as reciprocity but are interpreted as corruption by the bureaucratic frame, or vice versa.

  **4. Role-Play with Three Frames (40 minutes)**
     - Assign roles to the 16 participants:
       - 4 roles in the Weberian Bureaucratic Frame (WB):
          - Health Official (WB), Nurse (WB), Inspector (WB), Teacher (WB)
       - 4 roles in the Local Reciprocity Frame (LR):
          - Health Official (LR), Farmer (LR), Business Owner (LR), School Principal (LR)
       - 4 roles in the Hybrid Translation Frame (HT):
          - Health Official (HT) [trained in WB but from LR community], Business Owner (HT), Teacher (HT), Inspector (HT)
       - 4 roles as "Observers" (who will later help in debrief and forced choice)

     - Each frame group (WB, LR, HT) has 4 participants and the Observers are 4. The HT group has mixed roles.

     - Rules of the Game:
       - Each participant has:
          - A role card describing their frame and goals.
          - A starting set of 10 Reputation Points (RP) and 5 Access Tokens (AT).
       - The game has 5 rounds, each corresponding to one of the scenarios from the classification phase, but now acted out in the assigned frame.

       - In each round, the scenario is played out by the relevant roles. For example, for scenario 1 (patient and nurse):
          - In WB frame: The Nurse (WB) must refuse the chocolates to avoid corruption. If they accept, they lose RP. If they refuse, they gain RP. The patient (not assigned, so the Nurse role plays both sides) might lose AT if they try to give (because they are seen as attempting corruption) or gain RP if they don't.
          - In LR frame: The Nurse (LR) must accept the chocolates as a moral obligation. Refusing would cause the patient (Farmer in LR) to lose face and both lose RP. Accepting gains RP for both.
          - In HT frame: The Nurse (HT) is torn. They might accept but then report it (losing RP in LR community but gaining in WB) or refuse and explain (gaining in WB but losing in LR). The patient (Business Owner in HT) might feel offended if refused.

       - Mechanics:
          - Each round, the facilitator presents the scenario and the relevant roles in each frame act out (quickly, 3-5 minutes per round) what they do and why (according to their frame).
          - After the action, the facilitator adjudicates the change in RP and AT based on the frame rules.
          - Observers take notes on the conflicts and justifications.

     - After all 5 rounds, each participant's total RP and AT are tallied. The goal is to maximize RP (which is the primary measure of success in the game).

  **5. Forced Choice Scenario (10 minutes)**
     - Present a new scenario that involves multiple frames. Example:
          "A health official (HT) from a family with strong LR traditions is assigned to a WB-strict clinic. The official's uncle (LR) brings a goat to thank the official for helping the village during an outbreak. The official must decide whether to accept the goat (honoring LR) or refuse (honoring WB)."
     - The health official (HT role) must make a public choice. Then, the Observers and other participants (in their roles) react and state what happens to the official's RP and AT in their frames.
     - The choice will necessarily violate one frame and honor another.

  **6. Debrief (15 minutes)**
     - Map game moments to the claim of frame-relativity:
        - Compare initial classifications (phase 2) with how the same acts were played in the frames (phase 4). Highlight inversions: e.g., in LR, giving the chicken is required and not corrupt, but in WB it is corrupt.
        - Point out the forced choice: no neutral option.

     - Predict what went wrong on the first run:
        - Likely, participants initially classified all non-WB acts as corrupt or as a single "cultural" exception. Then, after seeing the frames, they might have still tried to impose a single standard (WB) or collapsed LR and HT into one non-WB frame.

     - State frankly what the activity cannot reproduce:
        - The absence of a neutral meta-frame: In the real world, there is no overarching standard to judge which frame is "correct." The activity cannot provide such a meta-frame because it is designed to show the conflict. The facilitator must emphasize that the exercise is about understanding the frames and their internal logic, not about deciding which is better.

  Rules for RP and AT:

  - **Weberian Bureaucratic Frame (WB):**
     - Accepting a gift/favor: -5 RP, +0 AT (because it's corrupt and damages reputation)
     - Refusing a gift/favor: +2 RP, +0 AT (upholds integrity)
     - Offering a gift/favor: -3 RP (because it's an attempt to corrupt), and if done by an official, additional -5 RP. However, if you are a citizen offering, you lose 3 RP and also lose 1 AT (because your access might be restricted for attempting bribery).

  - **Local Reciprocity Frame (LR):**
     - Accepting an expected gift: +3 RP (fulfills obligation and builds trust)
     - Refusing an expected gift: -5 RP (breach of trust, seen as arrogant or breaking social ties)
     - Offering an expected gift: +3 RP (fulfills obligation) and gains 1 AT (because trust is built, so future access is easier)
     - Not offering when expected: -5 RP and lose 1 AT (because you are seen as untrustworthy)

  - **Hybrid Translation Frame (HT):**
     - Actions are judged by both frames, but the HT role has a split identity. They must choose which frame to follow, and then get:
          - If they choose WB: +2 RP from WB, -3 RP from LR
          - If they choose LR: +2 RP from LR, -3 RP from WB
     - They also have a personal goal: they start with 10 RP and 5 AT. They want to maintain at least 5 RP in both frames to avoid being ostracized by either. If they fall below 5 in one frame, they lose 2 AT (because they lose access in that community).

     - Additionally, in HT, offering or accepting may have mixed consequences. The exact numbers can be adjusted by the facilitator to show the tension.

  Observers:
     - They do not play in the rounds but take notes. In the forced choice, they are asked to predict the consequences in each frame and then after the choice, they state the RP/AT changes for the actor in each frame.

  Logistics:
     - Prepare role cards for each participant.
     - Prepare a scoreboard for RP and AT (can be a whiteboard or paper).
     - Prepare scenario cards for each round.

  This design is self-contained and uses only the provided mechanics. The debrief explicitly addresses the learning goals.
answer: |-
  Below is a complete, self-contained workshop design structured as a **deliberation game with role-play elements**, using only **reputation points (RP)** and **access tokens (AT)**. The game unfolds in four phases, culminating in a forced choice and debrief. It requires no external resources—only role cards, scenario cards, and a facilitator (you).

  ---

  ### **Workshop Structure**  
  **Total Time:** 90 minutes  
  **Participants:** 16 advanced undergraduates  
  **Materials:**  
  - Role cards (16)  
  - Scenario sequence cards (5 fixed exchanges)  
  - RP/AT tracking board (visible to all)  
  - Timer  

  ---

  ### **Phase 1: Instinctive Classification (15 min)**  
  **Goal:** Participants judge exchanges based on intuition, revealing baseline assumptions about corruption.  

  1. **Setup (2 min):**  
     - Divide into 4 groups of 4. Each group receives 5 scenario cards describing exchanges (below).  
     - Participants classify each exchange individually as **Corrupt (C)** or **Not Corrupt (NC)**.  

  2. **Scenarios (Fixed Sequence):**  
     1. *Health Official Gift:* A farmer gives a goat to a public health official who vaccinated his livestock.  
     2. *Permit Fast-Track:* A business owner offers a "donation" of school supplies to a city planner who expedites a construction permit.  
     3. *Teacher’s Favor:* A parent gives a rare textbook to a teacher who tutors her child after hours.  
     4. *Medicine Access:* A clinic worker provides antibiotics to a village elder’s grandchild ahead of others.  
     5. *Job Recommendation:* A bureaucrat hires a friend’s son for an internship after receiving a handmade quilt.  

  3. **Group Consensus (10 min):**  
     - Groups debate and agree on **C/NC** for each scenario. Record results publicly (e.g., on a board).  
     - *Likely Outcome:* Most classify 1, 2, 4, 5 as Corrupt; 3 as Not Corrupt (intuition favors Western bureaucratic norms).  

  ---

  ### **Phase 2: Frame Revelation & Role Assignment (10 min)**  
  **Goal:** Introduce three institutional frames, assigning roles to reframe the exchanges.  

  1. **Reveal Frames (5 min):**  
     - **Weberian Bureaucratic (WB):** Offices are impersonal. Gifts = pollution. Rules apply universally.  
     - **Local Reciprocity (LR):** Offices sustain community trust. Gifts = moral obligations. Not giving = betrayal.  
     - **Hybrid Translation (HT):** Actors navigate both frames. WB rules "officially" apply, but LR obligations persist.  

  2. **Assign Roles (5 min):**  
     - Distribute role cards (each defines frame, goals, and starting RP/AT):  
       - **WB Roles (4):** Health Official, City Planner, Teacher, Bureaucrat.  
       - **LR Roles (4):** Farmer, Business Owner, Parent, Village Elder.  
       - **HT Roles (4):** Clinic Worker (trained in WB but from LR village), Permitting Clerk (LR-born, WB-trained), Textbook Supplier (markets to both), Intern Candidate.  
       - **Observers (4):** Track RP/AT impacts and conflicts.  

     **Starting Resources:**  
     - All roles begin with **10 RP** (Reputation Points) and **3 AT** (Access Tokens).  
     - RP = Trust/social standing (higher = better). AT = Access to services/opportunities (used to request favors).  

  ---

  ### **Phase 3: Role-Play with RP/AT Mechanics (40 min)**  
  **Goal:** Re-enact the 5 scenarios with explicit rules. Participants experience how frames invert corruption judgments.  

  #### **Rules of the Game**  
  - **RP Gains/Losses:**  
    - *WB Roles:* Gain RP for rejecting gifts; lose RP for accepting.  
    - *LR Roles:* Gain RP for giving/receiving; lose RP for refusing.  
    - *HT Roles:* Gain/lose RP based on which frame they honor (e.g., +3 RP from LR but -3 RP from WB for accepting a gift).  
  - **AT Mechanics:**  
    - Spend 1 AT to request a favor (e.g., expedite a permit).  
    - Receive 1 AT when fulfilling an obligation (e.g., giving a gift in LR).  
    - Lose 1 AT if RP drops below 5 (social exclusion).  
  - **Procedure:**  
    - Re-enact each of the 5 scenarios in sequence (5 min/scenario).  
    - After each, participants adjust RP/AT based on actions. Observers log outcomes.  

  #### **Scenario Reversal Highlights**  
  - **Example:** *Health Official Gift (Scenario 1)*  
    - **WB Health Official:** Refuses goat → **+5 RP** (upholds purity).  
    - **LR Farmer:** Insists on giving → If refused, **-5 RP** (betrayal); if accepted, **+5 RP** (trust sustained).  
    - **HT Clinic Worker (observing):** Notes conflict → If WB dominates, **-3 RP**; if LR dominates, **+3 RP**.  
    - *Result:* Initial "corrupt" label (Phase 1) now appears virtuous in LR, corrupt in WB.  

  - **Key Moment:** Scenarios 2, 4, and 5 (initially "corrupt") become obligatory in LR. Scenario 3 (initially "not corrupt") becomes corrupt for WB Teacher.  

  #### **Predicted First-Run Problem**  
  Participants will likely **collapse LR and HT into a single "cultural exception"** to WB norms. E.g., "HT is just LR with paperwork." This misses HT’s agonistic translation (e.g., an HT actor losing RP in both frames for compromise).  

  ---

  ### **Phase 4: Forced Choice & Debrief (25 min)**  
  **Goal:** Confront frame incommensurability. Debrief maps mechanics to philosophy.  

  1. **Forced Choice (10 min):**  
     - **Scenario:** *The Quilt Dilemma*  
       The Bureaucrat (WB) receives a quilt from the Village Elder (LR) for hiring her grandson (Intern Candidate, HT). The grandson now needs a promotion, but WB rules forbid nepotism.  
     - **Choice:**  
       - *Bureaucrat (WB)*: Promote → **-10 RP** (corruption), demote → **-10 RP** from LR roles (betrayal).  
       - *Intern (HT)*: Accept promotion → **-5 RP** (WB) but **+5 RP** (LR); refuse → reverse.  
     - **Outcome:** All choices violate one frame. Observers calculate net RP/AT loss.  

  2. **Debrief (15 min):**  
     - **Map Game to Philosophy:**  
       - *Phase 1 vs. Phase 3:* Initial "corrupt" labels inverted when frames revealed → **corruption is frame-relative, not act-intrinsic**.  
       - *RP/AT Mechanics:* LR’s "AT gains" for gift-giving show reciprocity as **access-generating**, not deviant. WB’s "RP loss" for accepting gifts reveals **pollution anxiety**.  
       - *Forced Choice:* Honoring LR (quilt obligation) violates WB (nepotism rules) → **no neutral meta-frame exists**.  
     - **Predictable Flaw:** Participants initially reduce non-WB frames to "culture" without grasping **LR’s moral ontology** (gifts sustain communal offices). Admit this post-game.  
     - **Limitation of the Activity:**  
       - *Cannot Reproduce:* **The absence of a transcendent adjudication standard**. IRL, power imbalances (e.g., colonial legacies) privilege WB as "universal." The game cannot simulate this meta-frame hegemony—I must clarify it verbally.  
     - **Closing Statement:** "Corruption accusations presume an ontology of the office. When we universalize WB, we mislabel LR reciprocity as deviance. But no frame is neutral—including WB."  

  ---

  ### **Role Cards Example**  
  *(Provide 1 per participant)*  

  **Role:** Farmer (LR)  
  **Frame:** Local Reciprocity  
  **Goal:** Sustain trust through gifts.  
  **Starting:** 10 RP, 3 AT  
  **Rules:**  
  - Gain 5 RP when giving/receiving expected gifts.  
  - Lose 5 RP if gift refused.  
  - Spend 1 AT to request health services. Gain 1 AT when giving gifts.  

  **Role:** Health Official (WB)  
  **Frame:** Weberian Bureaucratic  
  **Goal:** Uphold impartiality.  
  **Starting:** 10 RP, 3 AT  
  **Rules:**  
  - Lose 5 RP if accepting gifts. Gain 5 RP if refusing.  
  - Spend 1 AT to access training. Lose 1 AT if RP < 5.  

  **Role:** Clinic Worker (HT)  
  **Frame:** Hybrid Translation  
  **Goal:** Balance WB rules and LR obligations.  
  **Starting:** 10 RP, 3 AT  
  **Rules:**  
  - Gain/lose 3 RP in *both* frames for any gift decision (e.g., accept = +3 LR RP but -3 WB RP).  
  - Lose 1 AT if RP in *either* frame drops below 5.  

  ---

  ### **Facilitation Notes**  
  - **Prep:** Print role/scenario cards; use a whiteboard for RP/AT tracking.  
  - **Pacing:** Enforce strict timers. In Phase 3, intervene minimally—let conflicts unfold.  
  - **First-Run Fix:** When groups collapse LR/HT, remind them HT roles *lose RP from both frames* for compromises.  
  - **Ethical Clarity:** Stress this is about ontology, not excusing real-world harm.  

  This design forces experiential learning: participants *feel* the frame-relativity of corruption through RP/AT consequences and the unresolvable forced choice. The debrief explicitly ties game pain points to your philosophical claim.
