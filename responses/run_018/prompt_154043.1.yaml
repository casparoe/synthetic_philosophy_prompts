prompt: |-
  I was covering this panel on climate adaptation finance and two economists started arguing over whether risk-weighted expected utility — where you apply rank-dependent weights instead of straight prob-times-utility — should drive a city's flood budget. (1) One said standard EU clearly favors spreading money across green infrastructure because the aggregate expected damage reduction is higher, but once you weight catastrophic tail outcomes by decile rank the seawall wins since the worst case gets multiplied like tenfold. (2) The other said she's smuggling probability distortion into utility weighting — RWEU transforms outcomes by rank, not probabilities, so her calc actually folds back toward standard EU and the green plan still wins. (3) She came back that she's using a cumulative-weight version where the weight attaches to the tail distribution itself, not to single outcomes, which is exactly how some climate risk models do it, not the classic formulation. (4) He then said even if the math checks out, picking that weight is pure paternalism: citizens don't value the worst decile ten times more, and baking that in hides a planner's panic behind a formula. (5) She said linear EU does the same thing with discount rates, so every framework smuggles values in; at least RWEU makes the weighting explicit. They turned to me and asked who was right. I don't know teh literature well enough to call it. Can you adjudicate move by move — rate each step from clearly wrong to clearly right, briefly justify, say who's right about what, and flag what's missing? Especially: is there a non-arbitrary way to pick the weighting function without just imposing the planner's risk psychology? I'm writing this up for science-curious readers, so keep it grounded but don't dumb it down.
