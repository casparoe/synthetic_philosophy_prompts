prompt: |-
  I'm presenting in our philosophy-of-mind seminar my thesis that Dennett's brain-transplant thought experiment is standardly misread as supporting brain-based personal identity, when in fact it demonstrates that first-person spatial indexicals are anchored not to a particular organ but to whichever integrated causal loop—cranial or embodied—is currently governing action-guidance; I call this pragmatic-loop pluralism. The audience consists of eight analytic metaphysicians divided between animalists and psychological-continuity theorists, two cognitive scientists who treat self-location as a parietal predictive-coding computation, and a visiting phenomenologist skeptical of reductive explanations. Draft my Q&A prep sheet: list the four objections they will actually raise, ordered by potential damage to my position, each phrased in the objector's own vocabulary (for instance, the animalist's charge that I am substituting pragmatics for ontology), together with what I should concede immediately, what I must hold, the weakest point in my thirty-second reply, and the specific concession that risks undermining my view. Include the objection I am hoping nobody raises—namely, the split-brain patient case that threatens to fracture the assumption of a single governing loop—and explain why it is the most dangerous for pragmatic-loop pluralism.
