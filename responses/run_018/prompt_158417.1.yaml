prompt: |-
  I've been comparing accounts of Hobbes's mathematical work with accounts of his political method, and I notice a recurring two-step move in the scholarship. First, when Hobbes's geometric attempts—such as his circle-squaring proof or his dismissal of algebraic methods favored by Wallis—are shown to contain mistakes that mathematicians of his own time rejected, commentators explain that he was working within a special kind of geometry that builds figures step-by-step and therefore isn't answerable to ordinary tests of accuracy. Second, those same commentators present Leviathan's derivation of sovereignty and obligation as authoritative precisely because it follows that same step-by-step building method, despite the fact that the political text never actually demonstrates its conclusions with geometric proofs. The result is that geometry authorizes politics, but politics never exposes geometry to risk: any failure in the mathematics is absorbed by redefining what that mathematics was trying to do. Does this circular insulation have a specific name in philosophy of science or argumentation theory? How is it different from adding an ordinary auxiliary hypothesis, and what would distinguish it from simple special pleading? If the literature offers no precise term, please coin one and specify its boundary conditions. Answer in exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
