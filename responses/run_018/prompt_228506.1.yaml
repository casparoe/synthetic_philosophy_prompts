prompt: |-
  I chair the conscientious objection review panel in a country with mandatory national service — two years, military by default, with a civilian alternative for recognized objectors. We hear about fifteen cases a month, each decided on a written statement, two supporting letters, and a forty-five-minute hearing; all three panel members must sign every decision, and a denied claimant who still refuses induction faces prosecution. Our charter is one sentence long: exemption is owed to anyone whose conscience opposes participation in war in any form. Last month we split two-to-one over an applicant, I cast the deciding vote with real misgivings, and the dissenter — our military liaison, a decent man — asked me afterward what principle of mine had actually done the deciding. I had no good answer. We currently run these hearings on a collage of gut feelings and each member's favorite stock questions, and I want an actual decision procedure built out of the philosophy of pacifism: the distinctions it draws, such as absolute versus contingent pacifism and opposition to war as such versus opposition to all violence, should survive translation into something my two colleagues, neither of whom has read a page of philosophy, can apply at the table.

  The procedure must therefore tell us, in order, what to establish and what counts as establishing it. It needs a test for generality — is this objection to war as such? — that does not collapse into a purity exam no living pacifist tradition could pass: the applicant who concedes he would use lethal force against someone attacking his sister, the applicant who pays the taxes that fund the army, the applicant untroubled by armed police. It needs a rule for the selective objector who condemns only the war our country is currently fighting. It needs a way of probing sincerity that does not reward articulate, well-coached applicants over clumsy sincere ones, and that does not quietly turn into a theology exam for the religious and a skepticism exam for everyone else. And it needs a verdict rule for the total objector who refuses even civilian service on the grounds that performing it releases another conscript to fight. Wherever judgment cannot be eliminated, say so plainly rather than dressing the judgment call up as a test.

  Then run the procedure on three recent applicants, anonymized: a twenty-year-old with no religious affiliation, fluent and well prepared, who calls all war organized murder but concedes the sister case under questioning; a devout applicant with a decade of documented activism against our current war, which she calls unjust, who allows in the hearing that she can imagine a genuinely defensive war she might support; and a quiet, halting applicant who refuses the civilian alternative because it frees another young man for combat, and who could barely explain himself beyond that. Give me the whole answer as exactly ten numbered items, each a sentence or two, with no introduction or conclusion: items 1–6 the steps of the procedure in the order we should run them, each stating the question, what counts as passing it, and what happens on failure; item 7 the points where judgment cannot be eliminated; items 8–10 the three applications, each ending in grant, deny, or refer, with the reason — and flag which of the three outcomes I will like least.
reasoning: |-
  Hmm, the user chairs a conscientious objection review panel and needs a structured decision procedure based on pacifist philosophy. Their current process is inconsistent and relies on gut feelings. They want a method that's accessible to non-philosophers like their colleagues, including a military liaison.

  The key requirements are: testing generality of opposition to war (without demanding impossible purity), handling selective objectors, probing sincerity fairly, addressing total objectors who reject civilian service, and explicitly marking where judgment calls are unavoidable. The procedure must avoid becoming a theology test or favoring articulate applicants.

  For the philosophical framework, I'll draw from absolute vs contingent pacifism distinctions. Absolute pacifism opposes all war unconditionally, while contingent may allow defensive wars. But the charter requires opposition to war "in any form," so I'll prioritize the war-as-such test. 

  The procedure steps should flow logically: 
  1. Establish objection to war participation (simple declaration suffices). 
  2. Test if it's opposition to war itself, not just specific wars (using hypothetical defensive war scenarios). 
  3. Check for selective objection patterns (documented consistency matters most). 
  4. Assess sincerity through consistency checks, not eloquence (focus on life choices and documented history). 
  5. Handle civilian service refusal separately (explicitly stating it's a judgment call). 
  6. Final verdict integration.

  For judgment call points: sincerity assessment (step 4) and civilian refusal evaluation (step 5) must remain discretionary to avoid false precision.

  Now applying to the three cases: 
  - The articulate non-religious applicant opposes all war but makes a sister-case exception. This fails the generality test (step 2) - denial. 
  - The devout activist opposes current war but admits hypothetical defensive wars might be acceptable. Direct selective objection - denial. 
  - The hesitant total objector refuses civilian service to avoid complicity. This passes all steps but requires judgment at step 5. Grant with referral note - the outcome the user will dislike as it challenges the system.

  The ten-item format will deliver this cleanly. I'll make sure the military liaison's perspective is respected in the design, particularly on the "war as such" test where his operational experience might surface contradictions applicants haven't considered.
answer: |-
  Here is the ten-item response:

  1.  **Establish objection to participation in war:** Ask the applicant: "Do you object to participating in military service because it involves participation in war?" Pass requires a clear "yes." Failure ends the hearing with denial, as the core objection is absent.
  2.  **Test generality (opposition to war *as such*):** Ask: "Does your objection apply to *all* wars, regardless of who fights them, why, or whether they are defensive?" Pass requires a "yes." If "no," proceed to Step 3; if "yes," skip to Step 4. (This filters absolute vs. contingent pacifists without demanding purity on non-war violence/taxes).
  3.  **Rule on selective objection:** If Step 2 is failed, ask: "Is your objection based *only* on opposing the specific war(s) our country is currently fighting or plans to fight?" Pass (for exemption) requires a "no" (indicating broader principle). Failure (a "yes") leads to denial, as objection is contingent on specific wars, not war itself.
  4.  **Probe sincerity (consistency, not articulation):** Examine documented history (activism, lifestyle choices, supporting letters) and ask: "Have your actions and statements, prior to facing conscription, been consistent with holding a profound objection to participation in war?" Pass requires reasonable consistency shown; judgment is unavoidable here. Failure leads to denial. Articulation or lack thereof is irrelevant; focus on pre-conscription pattern.
  5.  **Rule on refusal of civilian service:** If applicant refuses civilian service, ask: "Is your sole reason that performing it indirectly supports the military system by freeing another person?" Pass (for exemption from *all* service) requires a "yes" and a credible explanation of this complicity belief. Judgment is required to assess credibility. Failure (other reasons or implausible explanation) leads to offer of civilian service; refusal then risks prosecution.
  6.  **Integrate findings for verdict:** Grant exemption if: Step 1 passed AND ( (Step 2 passed AND Step 4 passed) OR (Step 3 passed AND Step 4 passed) ) AND (civilian service is accepted OR Step 5 passed). Deny otherwise. Refer only if Step 5 passes (total objection granted) for administrative note, but exemption is still granted.
  7.  **Explicit judgment points:** Judgment is unavoidable and explicit in Step 4 (assessing sincerity via pre-conscription consistency) and Step 5 (assessing credibility of complicity belief for total objectors); no algorithmic substitute exists.
  8.  **Case 1 (20yo, non-religious, "war is murder," concedes sister):** Step 1: Pass. Step 2: Fail (concedes lethal force in sister case implies acceptance of defensive violence, undermining war-as-such opposition). Step 3: Deny (objection is contingent; fails generality). Verdict: **Deny**.
  9.  **Case 2 (Devout activist against current "unjust" war, allows defensive war):** Step 1: Pass. Step 2: Fail (allows defensive wars). Step 3: Fail (objection based solely on current war being unjust). Verdict: **Deny**.
  10. **Case 3 (Quiet applicant, refuses civilian service):** Step 1: Pass (implied objection). Step 2: Pass (refusal based on complicity implies opposition to war system itself). Step 4: Pass (assume minimal but consistent history/supporting letters suggest sincerity). Step 5: Pass (sole stated reason is complicity; halting speech not equated with implausibility). Verdict: **Grant** exemption (refer for note on Step 5). *This outcome you will like least*, as it grants based on refusal of the alternative service.
