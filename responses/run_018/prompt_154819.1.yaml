prompt: |-
  I'm a journalist covering science and ideas, and I'm helping a collegue draft teh final exam for her upper-level seminar on class, place, and values. We want a 90-minute essay prompt — answers should run about 800 words max — that gets into the weeds on whether rural and working-class outlooks are actually more defensible than urban/professional ones, but without recycling the usual dignity-of-labor-versus-cosmopolitan-openness script that students memorize in intro courses.

  Here's the twist: build the whole question around a distinction I'm calling the maintenance versus optimization split. The idea is that working-class moral outlooks tend to treat goods like trust and reciprocity as maintenance tasks — you keep them running, you don't redesign them — whereas professional-class outlooks treat those same goods as optimization problems you can scale, credential, and make portable. The exam should ask students whether this functional split actually supports giving either outlook normative priority, or whether it just describes different institutional niches without resolving which is better. Please write the exam question itself, then a model answer of about 600 words, and a marking scheme with five must-hit points totaling 20 marks; for each point list the marks and a one-line note on how candidates typically botch it, like conflating description with justification or treating the split as biological rather than social. Don't ask for bibliographys, citatons, or reading lists — this is a take-home with no web access. And please, in your response, say how confident you are in the framing overall and specifically flag teh point you're least sure of, probably whether that maintenance/optimization distinction is genuinely descriptive or if I've just invented a tidy binary for teh sake of teh exam.
