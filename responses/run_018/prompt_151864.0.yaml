prompt: |-
  I'm taking a course on early modern phil and trying to help gradign practice answers for our section. We got this short-answer prompt: "Explain Descartes' doctrine that animals are bêtes-machines. Cover (a) the metaphysical reason he denies them rational souls, (b) how he explains complex behavior mechanistically without invoking thought, and (c) whether he allows that injured animals feel pain. Be specific about the language-test argument and about the internal physiology he appeals to."

  Here is my friend's answer — I need to grade it but I'm second-guesing myself since I haven't worked through all the primary texts in detail:

  "Descartes holds that animals are literally hollow machines, like unwound clocks with no inner workings at all, and this is solely because they lack an immaterial soul. He proves they have no reason by showing that no animal can use language creatively — they only repeat sounds mechanically. Their bodies are run by animal spirits flowing through nerves like water in pipes, but there is no internal sensory processing whatsoever, just pure reflex. So when a dog yelps after being hit, there's absolutely no pain, not even a mechanistic kind, since feeling requires a mind. For humans he locates the soul's interaction with the body in the pineal gland, and he applies that same gland mechanism in animals to coordinate movement, except with no soul present."

  Please grade this point by point. I think its mostly on track but I feel like there are one or two subtle slips — maybe about applying the pineal gland to animals, or about whether he allows any functional analogues to sensation inside the machinery? Also check whether the student confuses the language argument with the actual metaphysical proof for lacking souls, and whether they miss that Descartes allows complex internal mechanistic processing despite denying consciousness. I want a letter grade plus concrete comments on parts (a), (b), and (c): tell me exactly which sentences are sloppy, which conflate distinct claims, and whether any error is serious or just imprecise wording. Don't give me a bibliography or citation list — just judge the philosophical accuracy based on standard interpretations. I'm especially curious if they get the distinction between functional analogues to sensation and actual phenomenal consciousness right.

  Please finish with \answer{...} containing the letter grade, and make the very last line start with Verdict: followed by a one-sentence summary of the assessment.
