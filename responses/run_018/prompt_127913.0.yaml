answer: |-
  ## 3-Month Research Proposal: Teleosemantics & Multiplexed Teleofunctions

  **Core Idea:** Standard teleosemantics (Millikan, Dretske, etc.) usually assumes a representational state has *one* core proper function (or at least a clear hierarchy) determining its content. I think this is oversimplified. Neuroscience suggests *single* neural states/vehicles often serve *multiple*, distinct, non-hierarchical teleofunctions simultaneously (e.g., evolved for error-detection *and* directly tied to triggering specific action, both shaping the state's causal role). This "multiplexing" seems real. I wanna know: **Can teleosemantics actually nail down determinate content if the same representational vehicle is genuinely *for* multiple distinct things? Or does forcing an answer require sneaking in context-dependence that wrecks the naturalization project?**

  **The Precise Question:** Does the core machinery of teleosemantic content-determination (relying on natural selection history and causal role) remain robust when applied to representational vehicles possessing multiple, co-equal, non-subordinated teleofunctions? Specifically, can it avoid either (1) massive content indeterminacy/ambiguity or (2) collapsing into context-dependence that presupposes intentionality, thereby failing to *naturalize* content?

  **Why Existing Answers Don't Cut It:**
  1.  **Millikan-Style (Proper Functions):** Her framework leans *hard* on identifying *the* proper function derived from selection history. If a state truly has *two* co-equal proper functions (say, F1 and F2), which one picks the content? "Most recent" is messy. "Historically primary"? What if both are equally ancient/important? "Hierarchy"? But the whole point is they might *not* be hierarchical. She kinda assumes functional unity or a dominant function. Multiplexing breaks this.
  2.  **Indicator Semantics (Dretske-style):** This focuses on what the state *covaries with* under ideal conditions for performing its function. But if the state has *two* functions (F1 and F2), requiring it to be triggered by different ideal conditions (C1 for F1, C2 for F2), what does it *indicate*? What are the "ideal conditions"? The covariation profile gets muddled, leading to ambiguous content ("It indicates A *when doing F1*, but B *when doing F2*" – hello, context-dependence!).
  3.  **Hybrid/Other:** Most theories kinda gloss over this or assume functions are additive/subsumed. They don't grapple seriously with the possibility of fundamental functional multiplicity at the vehicle level messing up the content assignment.

  **Method: Pure Deskwork & Conceptual Mapping (No Experiments!)**
  1.  **Conceptual Deep Dive (Month 1):** Rigorously map the core commitments of leading teleosemantic theories (Millikan, Dretske, Papineau, maybe Neander) regarding functional individuation and content determination. Explicitly identify where they *assume* functional unity/hierarchy or could potentially handle multiplicity. Define "non-hierarchical multiplexing" precisely for this context.
  2.  **Constructing the Challenge (Month 1-2):** Develop robust hypothetical and simplified model cases where a single state clearly has multiple, co-equal teleofunctions. Explore the implications for content determination within each theoretical framework. Where does ambiguity arise? Where does context seem *necessary* to disambiguate? Does indexing to context sneak in unexplained intentionality?
  3.  **Cognitive Science Case Studies (Month 2-3):** Draw on real (but interpreted) examples from neuroscience/cognitive science where neural multiplexing is argued for:
      *   **Grid Cells:** Encoding spatial location *and* involved in path integration/memory? Different teleofunctions?
      *   **Predictive Coding Circuits:** Same prediction-error signal used for updating models *and* driving attention shifts *and* modulating action readiness? One vehicle, many jobs?
      *   **Multifunctional Sensory Neurons:** E.g., neurons responding to features relevant for both predator detection *and* mate selection in simpler organisms.
      *   **Action-Oriented Representations:** Concepts where representation is inherently tied to multiple potential actions. Analyze how teleosemantics would/could assign content here. *Focus:* Don't get bogged down in neuro details; use them to *ground* the conceptual possibility and pressure-test the theories.
  4.  **Synthesis & Assessment (Month 3):** Weigh the options: Can teleosemantics be stretched/modded to handle multiplexing without breaking? Does it require a problematic level of context-indexing? Does it lead to unacceptable indeterminacy? Does it force us to rethink the grain of representational vehicles? Conclude with the implications for the naturalization project.

  **What Success Looks Like (Positive Result):** A clear, well-argued position emerges:
      *   **Option A (Survives):** Demonstrating a viable path within (or a modest extension of) existing teleosemantics to handle multiplexing without collapsing into problematic context-dependence or radical indeterminacy. E.g., proposing a principled way to weight functions or showing content emerges from the *conjunction*.
      *   **Option B (Breaks):** Conclusively showing that multiplexing *forces* teleosemantics to rely on context-indexing that presupposes intentionality (e.g., "content is X *when the system is in mode Y*" where defining mode Y is non-naturalized), or leads to unresolvable ambiguity, thereby undermining its core naturalization goal. This would be a significant critique.

  **What Failure Looks Like:**
  1.  **Inconclusive Mud:** Failing to clearly articulate the challenge or analyze the theories deeply enough, leaving things vague. Not getting beyond "it's complicated."
  2.  **Neuro Distraction:** Getting lost in the weeds of specific neuro cases without extracting the relevant philosophical pressure points.
  3.  **Scope Blowout:** Accidentally trying to solve *all* problems of indeterminacy in teleosemantics or getting sidetracked into other debates (e.g., vehicle vs. content distinction itself).
  4.  **Missing the Naturalization Stakes:** Not successfully connecting the multiplexing challenge to the *specific* problem of naturalizing content (i.e., not showing *why* context-indexing would be a fatal blow).

  **Keeping Scope Honest:** This is a *focused* investigation into *one specific pressure point* for teleosemantics: multiplexed teleofunctions. It's not about solving the disjunction problem, the distality problem, or consciousness. It leverages cognitive science for illustrative cases, not primary data generation. 3 months is tight, but feasible for a conceptual mapping project generating a solid paper draft. Success is a clear answer to the multiplexing challenge, *not* a complete overhaul of teleosemantics.

