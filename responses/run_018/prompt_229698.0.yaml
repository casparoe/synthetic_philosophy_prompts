prompt: |-
  I'm a program officer at a small family foundation making around forty grants a year, mostly $20k to $200k, and my board has started pressing me on why I fund one thing and not another. I keep seeing the importance/tractability/neglectedness framework waved around, but never as an actual procedure I can run in the hour I have per application. Please write me a reusable decision procedure (questions in order, what a good enough answer looks like, where it stops with a no, and where it stops with "this is a values call") based on what's actually defensible in that framework—not a version that pretends the three factors just multiply. Then run it on two or three cases: (a) a very neglected cause with low tractability, (b) a crowded but highly tractable cause, and maybe (c) a huge cause already awash in money. Make at least one case come out as a no to something I'd personally love to fund. Be explicit about which steps are settled among people who do cause prioritization and which are contested or judgment calls, and say what the procedure can't handle.
reasoning: |-
  We are going to create a decision procedure based on the Importance/Tractability/Neglectedness (ITN) framework, adapted for practicality in a grantmaking context with limited time per application.

  The procedure will be structured as a series of questions, with clear stopping points for "no" and "values call" (i.e., where the foundation's specific values must decide because the ITN framework does not yield a clear answer). We'll avoid a simple multiplicative model because:
  1. Importance might not be linearly comparable across causes (e.g., lives saved vs. cultural preservation).
  2. Tractability and neglectedness are often interdependent and context-specific.

  The procedure:

  Step 1: Importance
     Question: "What is the scale of the problem this intervention addresses? How would we measure the impact on the problem if this intervention were successful?"
     Good enough: A clear, quantifiable (or at least qualitatively compelling) description of the problem's severity and the potential impact. If the problem is very small (e.g., affects a tiny population, or the harm is minimal) and the impact is marginal, then we might stop here.
     Stop with "No": If the problem is trivial or the intervention's potential impact is negligible. Also, if the problem is not aligned with the foundation's mandate (but that's more of a values call, so we might note that and move to Step 1.5).
     Note: This step is often contested because different stakeholders value outcomes differently (e.g., animal suffering vs. human suffering). We are not resolving that here.

  Step 1.5: Values Check (preliminary)
     Question: "Is this cause within our foundation's stated areas of interest and values?"
     If not, stop with "No" (unless the board has given explicit permission to step outside). This step is a judgment call based on the foundation's mission.

  Step 2: Tractability
     Question: "Is there strong evidence that this specific intervention can make progress on the problem? What is the likelihood of success per dollar spent? What are the key risks and barriers?"
     Good enough: Evidence from similar contexts, a plausible theory of change, or at least a well-reasoned argument for why this approach might work. The evidence bar can be lower for highly neglected areas with high importance.
     Stop with "No": If there is strong evidence that the intervention doesn't work, or if the intervention is clearly infeasible (e.g., requires political access we don't have, or technological breakthroughs that are unlikely). Also, if the cost per unit of impact is extremely high compared to alternatives we know.
     Note: Tractability is often contested because what one person considers a 'plausible theory' another might consider wishful thinking.

  Step 3: Neglectedness
     Question: "How much is already being done in this area? Would our grant add significant marginal value (e.g., fill a gap, fund a unique approach, or leverage other funding)?"
     Good enough: Evidence that the area is underfunded relative to the scale of the problem and the tractability. Alternatively, if the area is crowded, we require a compelling case that our grant would be catalytic (e.g., funding a bottleneck, or an innovative approach that others are overlooking).
     Stop with "No": If the area is already saturated with funding and our grant would be a drop in the bucket without a clear marginal advantage. Also, if there are other funders better positioned to fund this (unless they are not stepping up and we can trigger their involvement).
     Note: Neglectedness is often measured by the amount of funding in the space and the number of actors. However, it can be contested because sometimes even well-funded areas have gaps.

  Step 4: Integration (the three factors together)
     We do not simply multiply, but we look for:
     - High importance and high neglectedness might compensate for medium tractability.
     - High tractability and high neglectedness might compensate for medium importance.
     - But low importance is hard to overcome, and low tractability without high importance and neglectedness is risky.

     We ask: "Given the analysis above, does this grant represent an outstanding opportunity relative to our other options? What are the best counterarguments?"

     If we have high importance and tractability but low neglectedness, we might still fund if the intervention is particularly cost-effective and our grant can be catalytic. But if the area is crowded and our grant is not catalytic, we might stop with "No".

     If we have high importance and neglectedness but low tractability, we might fund if the potential upside is enormous (e.g., a moonshot) and the cost is low enough to justify the risk. Otherwise, we stop with "No".

     If we have high tractability and neglectedness but the importance is low, then it's a judgment call: if the impact per dollar is very high, we might fund (if aligned with values). But if the scale is too small, we stop with "No".

     Stop with "Values call": When the ITN analysis is mixed and the foundation's specific values or strategic priorities must break the tie (e.g., between two causes that are equally strong on ITN but one is closer to the foundation's history). Also, when there is a disagreement that cannot be resolved by evidence.

  What the procedure can't handle:
     - Comparing causes that are fundamentally different (e.g., global health vs. local arts) without a common currency (like DALYs or QALYs, which are themselves contested).
     - Accounting for co-benefits or negative externalities that are hard to measure.
     - Dynamic effects (e.g., if funding this might attract more funding to the area, making it less neglected in the future).

  Now, let's run the procedure on three cases:

  Case (a): A very neglected cause with low tractability
     Example: A project to prevent an extremely rare but devastating genetic disorder (affecting 100 people worldwide) by funding basic research. The research is high-risk and might take decades.

     Step 1: Importance - The problem is devastating for those affected, but the scale is very small. If successful, it could save 100 lives (or prevent severe disability). This is important but at a small scale. (Not a stop, but borderline.)
     Step 1.5: If the foundation's mission includes rare diseases, we continue. Otherwise, stop with "No" (values call).
     Step 2: Tractability - Low. The research is high-risk and there's no clear path. Stop with "No" unless the foundation is willing to take on high-risk, long-term projects in this area. But if we continue...
     Step 3: Neglectedness - Very high. Almost no one is working on this disorder.
     Step 4: Integration - The combination of high importance per person (but low overall because of the small number) and high neglectedness, but low tractability. The expected value might be low. Without a compelling argument that this research might have spillover effects, we might stop with "No". However, if the foundation values helping the most vulnerable and is willing to take risks, this could be a values call.

     Outcome: Likely "No" due to low tractability and small scale, unless the foundation's values specifically prioritize this group.

  Case (b): A crowded but highly tractable cause
     Example: A proven malaria bed net distribution program in a region where several large NGOs are already working.

     Step 1: Importance - High. Malaria is a leading cause of death in the region.
     Step 1.5: If global health is within the foundation's mission, we continue.
     Step 2: Tractability - High. Bed nets are proven to reduce malaria cases.
     Step 3: Neglectedness - Low. Many actors are already distributing bed nets. We must ask: Is there a gap we can fill? Maybe in a specific underserved village? If not, then our grant might not add much marginal value. We stop with "No" unless we can be catalytic. For instance, if we fund an innovative distribution method that could be scaled by others, then we might continue.
     Step 4: Integration - High importance and high tractability, but low neglectedness. Without a catalytic angle, the marginal impact of our grant is low. We might stop with "No". However, if we can show that our $100,000 grant will deliver nets to 10,000 people who otherwise wouldn't get them, then the cost per life saved is still very good. But if the area is already saturated, then maybe the next net is redundant? This requires careful assessment.

     Outcome: Without a catalytic angle, likely "No". But if we can identify a specific gap, then we might fund. This is a judgment call.

  Case (c): A huge cause already awash in money
     Example: Climate change mitigation via renewable energy in a developed country (like the US), specifically funding a solar panel installation on a school.

     Step 1: Importance - High. Climate change is a massive global problem.
     Step 1.5: If climate change is within the foundation's mission, we continue.
     Step 2: Tractability - High. Solar panels work and reduce emissions.
     Step 3: Neglectedness - Very low. There are many government subsidies and private investments in solar. Our grant might just displace what would have happened anyway (additionality problem). If we can show that this school wouldn't get solar without us, then we have some additionality. But even then, the marginal impact on climate change is minuscule because the problem is so huge.
     Step 4: Integration - The expected impact per dollar is very low because of the lack of neglectedness. We stop with "No". However, if the foundation has a local focus and values the educational co-benefits for the school, then this becomes a values call (but note: the ITN framework would not prioritize this for climate impact).

     Outcome: "No" for climate impact. But if the foundation values local community benefits, it might be a values call.

  Now, let's design a case that I would personally love to fund but that the procedure rejects.

  Example: A grant to support a local arts program that provides after-school activities for at-risk youth. I love this because I believe in the power of the arts and have seen it change lives.

     Step 1: Importance - The problem (youth delinquency, lack of opportunities) is important. The potential impact is improved life outcomes for a group of 50 youth per year. However, quantifying this impact is hard. We might say it's medium importance (local, not global).
     Step 1.5: If the foundation's mission includes youth development or the arts, we continue. Otherwise, stop with "No".
     Step 2: Tractability - Medium. There is evidence that after-school programs can reduce delinquency and improve school engagement, but the evidence for arts-specific programs is mixed. We'll assume a plausible theory of change.
     Step 3: Neglectedness - In a city, there might be many after-school programs. But maybe this is the only one in a particular neighborhood? If so, medium. If there are others, low.
     Step 4: Integration - The expected impact per dollar is uncertain. We might compare to a counterfactual: without this program, what would happen? If the program is not unique and the youth could be served elsewhere, then our marginal impact is low. Also, the problem is not neglected at a city level (though maybe in this neighborhood). Without a strong case for high marginal impact, the ITN framework would not prioritize this over, say, a global health intervention. We stop with "No" unless the foundation's values prioritize local arts and youth.

     Outcome: The procedure leads to "No" because of the difficulty in demonstrating high marginal impact per dollar compared to other opportunities. However, this becomes a values call if the foundation's mission specifically emphasizes local community arts.

  In summary, the procedure helps to systematically evaluate grants but requires judgment at every step and cannot replace the foundation's values. It is best used to screen out weak applications and to force explicit reasoning for the ones that are funded.
answer: |-
  ### ITN-Based Decision Procedure for Grant Applications  
  **Time Allocation:** ~1 hour per application (including review, scoring, and notes).  
  **Core Principle:** Evaluate **Importance (I)**, **Tractability (T)**, and **Neglectedness (N)** sequentially, with explicit thresholds for rejection or values-based decisions. Avoid simplistic multiplication (I×T×N) due to incomparable units and context dependencies.  

  ---

  #### **Decision Procedure Flow**  
  1. **Preliminary Values Check (1 min)**  
     - **Question:** "Is this application within our foundation’s stated mission and values?"  
     - **Good enough:** Alignment with at least one core funding pillar (e.g., "environmental justice" or "youth education").  
     - **Stop with NO:** If clearly misaligned (e.g., funding a partisan political campaign when your charter prohibits it).  
     - *Status: Judgment call (foundation-specific).*  

  2. **Importance Assessment (15 min)**  
     - **Question:** "What is the scale and severity of the problem this addresses?"  
       - *Quantitative:* Lives affected, magnitude of harm (e.g., disability-adjusted life years (DALYs)).  
       - *Qualitative:* Irreversible harm, equity implications (e.g., targeting marginalized groups).  
     - **Good enough:** Evidence of material harm (e.g., "100,000 people lack clean water") or high stakes (e.g., "prevents species extinction").  
     - **Stop with NO:** Problem is trivial, purely aesthetic, or lacks credible evidence of impact (e.g., "luxury art therapy for wealthy retirees").  
     - *Status: Settled for scale/severity; contested for non-quantifiable harms (e.g., cultural preservation).*  

  3. **Tractability Assessment (20 min)**  
     - **Question:** "Is there a credible path to progress, and can this intervention move the needle?"  
       - *Evidence:* Pilot data, theory of change, historical analogs.  
       - *Feasibility:* Regulatory/technical barriers, stakeholder alignment.  
     - **Good enough:** Plausible mechanism (e.g., "vaccination reduces disease spread") + >20% chance of success.  
     - **Stop with NO:**  
       - Intervention has failed repeatedly in similar contexts.  
       - Success requires unrealistic assumptions (e.g., "requires 10 unrelated laws to pass").  
       - Cost per outcome exceeds benchmarks (e.g., >$10k per life saved when proven interventions cost $500).  
     - *Status: Contested—optimists vs. pessimists on feasibility; judgment call on risk tolerance.*  

  4. **Neglectedness Assessment (15 min)**  
     - **Question:** "Is this area under-resourced relative to its potential impact?"  
       - *Funding gap:* Compare total funding in the space to the problem’s scale.  
       - *Marginal value:* Will your grant enable something new (e.g., seed funding, filling a gap others ignore)?  
     - **Good enough:**  
       - Funding <50% of "optimal" levels (estimate roughly).  
       - Clear leverage (e.g., "we’re the only funder of this approach").  
     - **Stop with NO:**  
       - Saturated market (e.g., 10+ similar NGOs in the same geography).  
       - Your grant is <0.1% of total funding and won’t be catalytic.  
     - *Status: Settled for funding gaps; contested for defining "catalytic" potential.*  

  5. **Integration & Final Decision (9 min)**  
     - **Question:** "Does this grant pass the **ITN Thresholds**?"  
       - **Threshold 1:** High I + any T + any N → **Fund** (if values-aligned).  
       - **Threshold 2:** Medium I + High T + High N → **Fund**.  
       - **Threshold 3:** High I + Low T + High N → **Values call** (high-risk moonshots).  
       - **Threshold 4:** Low I OR Low T OR Low N → **Reject** (unless values override).  
     - **Stop with VALUES CALL:**  
       - Tradeoffs between ITN factors (e.g., high I but low T).  
       - Personal passion vs. weak ITN (e.g., you love it, but it’s crowded).  
     - **Stop with NO:** Fails all thresholds.  

  **What This Can’t Handle:**  
  - Inter-cause comparisons (e.g., education vs. climate).  
  - Long-term/second-order effects (e.g., movement-building).  
  - Subjective "virtue" factors (e.g., inspiring stories).  

  ---

  ### **Case Evaluations**  
  #### **Case (a): Neglected Cause, Low Tractability**  
  **Application:** Curing a rare disease affecting 5,000 people globally.  
  - **Preliminary:** Aligns with health equity values → **Proceed**.  
  - **Importance (High):** Severe suffering, premature death → **Pass**.  
  - **Tractability (Low):** No known treatment; research requires decades → **Stop with VALUES CALL**.  
    - *Why?* High I + High N but Low T. Board must decide if high-risk moonshots fit values.  
  - **Verdict:** Not auto-rejected, but requires board deliberation.  

  #### **Case (b): Crowded Cause, High Tractability**  
  **Application:** Bed nets for malaria prevention (in a region with 5 major NGOs already working).  
  - **Preliminary:** Aligns with global health → **Proceed**.  
  - **Importance (High):** Malaria kills 500k/year → **Pass**.  
  - **Tractability (High):** Nets reduce cases by 50% → **Pass**.  
  - **Neglectedness (Low):** $300M/year spent locally; your $50k grant is 0.017% of total → **Stop with NO**.  
    - *Why?* Low N. No catalytic argument (e.g., no unique innovation or unfilled niche).  
  - **Verdict:** Reject despite strong I/T.  

  #### **Case (c): Huge Cause, Awash in Money**  
  **Application:** Solar panels for a U.S. school (climate change focus).  
  - **Preliminary:** Aligns with environmental mission → **Proceed**.  
  - **Importance (High):** Climate change is existential → **Pass**.  
  - **Tractability (Medium):** Panels work but school’s emissions are negligible → **Pass (barely)**.  
  - **Neglectedness (Low):** $100B+ in global renewable funding; your $100k grant is 0.0001% → **Stop with NO**.  
    - *Why?* Negligible marginal impact. No leverage (e.g., won’t shift policy or norms).  
  - **Verdict:** Reject.  

  #### **Personal Passion Project (Forced "No")**  
  **Application:** Community theater for at-risk youth (you love the arts).  
  - **Preliminary:** Aligns with youth development → **Proceed**.  
  - **Importance (Low):** Local impact only (~50 youth/year); no measurable life outcomes → **Stop with NO**.  
    - *Note:* If importance was medium (e.g., "reduces gang recruitment"), proceed.  
  - **Verdict:** Reject. *Procedure overrides personal passion.*  

  ---

  ### **Key Notes**  
  - **Settled in EA:** I and T must meet minimum thresholds; N is tiebreaker.  
  - **Contested:** How to weigh I for non-quantifiable causes (e.g., arts).  
  - **Judgment Calls:** Defining "catalytic," setting I/T/N thresholds.  
  - **Efficiency:** Use heuristics (e.g., "If N > $1B/year funding, likely low-N").  
  - **Output:** Score each axis (High/Medium/Low), then apply thresholds.  

  This procedure ensures defensible ITN rigor in 60 minutes while flagging where values must drive decisions.
