  I'm in this epistemology seminar this semester and we got onto Williamson's anti-luminosity argument and how it relates to the KK principle, and my friends Jaden and Sam had this long argument after class that I couldnt really follow all the way through. So Jaden was saying that the luminosity argument doesnt actually threaten KK at all, because all Williamson really shows is that mental states like feeling warm arent luminous in the sense that you always know youre in them. But KK is just the structural claim that if you know p then you know you know p, and Jaden thinks thats totally seperate from whether mental states are transparent. So even if theres a margin for error where you feel warm but dont know it, whenever you do genuinely know youre warm you can still know you know it, maybe through reflection or just by applying the same reliable process twice. Sam pushed back and said thats missing the whole point, because the only reason anyone ever found KK plausible for mental states was the transparency thesis, and once you accept anti-luminosity youve lost the only motivation for thinking second-order knowledge comes along automatically. Sam also said that if you try to get second-order knowledge through reflection then youre treating your mental state like an external object, which defeats the internalist spirit that made KK attractive in the first place.

  Then Jaden came back with something about safety conditions. He said look, if knowledge requires safety, then knowing youre warm just means that in nearby worlds you dont falsely believe youre warm, but that doesnt require you to be able to discriminate every nearby world yourself. So KK might still hold not because of transparency but because the safety condition applies seperately at first and second order, given the same reliable belief-forming process. Sam said thats sneaking reliabilism into the picture that Williamson explicitly rejects, and that without luminosity theres no guarantee the second-order belief is safe, especially since calibration studies in psychology show people are systematically overconfident about their own confidence levels, so the process that produces first-order knowledge might systematically fail at second order. Jaden then said Sam was mixing empirical psychology with conceptual epistemology, and that even if people are overconfident in experiments that doesnt show its conceptually impossible to know you know, it just shows people are bad at it.

  They asked me to referee and I honestly dont know whos right about what. Can you go through their exchange move by move and adjudicate? Like is Jaden right that anti-luminosity and KK are conceptually seperate issues? Is Sam right that transparency was the main motivation for KK? Is the safety-based defense of KK actually coherent or does it hide a circularity? And what are they both missing, maybe something about whether the calibration problem applies to conceptual knowledge at all? Please write your answer in continuous prose with no headings, bullet points, bold text, or tables, just like a long email or letter. I really need it spelled out plainly since Im still trying to get my head around this stuff.
