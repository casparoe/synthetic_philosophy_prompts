  I remember that Borges doesn't actually endorse this view. He presents it as a logical conclusion from his premises but then rejects it because it's intolerable to human experience. The user is worried they're confusing Borges' view with Tlön's cosmology from his fiction. That's a good catch because Tlön does have that solipsistic, idealist philosophy where time isn't sequential. 

  The conflict with eternal recurrence is another point. Borges explores Nietzsche's idea in other essays, but that requires a cyclical time structure. If time were isolated moments, recurrence wouldn't make sense. But Borges' refutation is more about dismantling objective time rather than proposing a new system. His rejection of the solipsistic conclusion shows he's aware of its impracticality. 

