answer: |-
  Here's the argument against the strong reading, built as requested:

  The standard "no" to Molyneux’s question proves **absolutely nothing** about the existence or non-existence of modality-neutral shape concepts. It's entirely consistent with a shared underlying representation of shape that simply requires initial calibration between the senses. To see this, consider the Reverse-Molyneux Test: A newly sighted person, blind from birth, is shown a visually novel, complex shape (e.g., an extruded pentagram) for a sustained period (say, 30 seconds), allowed to examine it from multiple angles. They are then blindfolded and presented with a tactile array containing that pentagram and several other visually distinct, unfamiliar shapes (a truncated cone, a tetrahedron with one concave face, a twisted prism). They must pick out the pentagram *by touch alone*.

  **I argue they would pass this test.** Why? Because visual exploration provides rich structural information – contours, angles, symmetries, depth cues – that maps directly onto spatial properties accessible to touch. The newly sighted person isn't just seeing "light patterns"; they are seeing *spatial structure*, even if they don't yet know its conventional name or precise tactile feel. When feeling the shapes, they would be seeking the *same spatial structure* they just saw: the five points, the inward/outward angles, the overall star-like topology. The strong "shape-for-eye/shape-for-hand" view, however, is embarrassingly committed to failure. If visual shape and tactile shape are truly distinct "codes" with no shared spatial referent, then prolonged visual exposure provides zero usable information for tactile discrimination of a novel object. This is absurd. The visual input *is* spatial information; the tactile input *is* spatial information; they converge on the same object. The asymmetry (allowing sustained looking vs. immediate visual identification in the original test) isn't cheating; it reflects a fundamental difference in information acquisition. Vision rapidly delivers global structural overviews; touch is inherently sequential and local. Learning the *instantaneous* visual signature of a shape (like recognizing a cube's projection from a single viewpoint) takes experience. *Knowing what spatial structure to feel for*, given prior visual exposure to that structure, does not. The reverse test bypasses the need for instantaneous recognition and targets the core claim: is shape modality-bound?

  Now, your opponent retreats: "Fine, maybe they pass the reverse test, but that just shows they learned a translation *from* the new visual code *to* their existing haptic code. It doesn't prove a pre-existing, shared *concept* of that specific shape." This is where your pet idea is crucial. **The structure of errors is the key differentiator.**

  *   **Modality-Neutral Representation Prediction:** Transfer errors should be **structured by shape similarity**. If they confuse the pentagram with another shape while blindfolded, it should be with something *geometrically similar* – perhaps a hexagram (another star), or a shape with similar concavities/protrusions. Errors reflect misidentification *within the domain of shape itself* because the underlying representation is geometric/spatial.
  *   **Learned Translation Prediction:** Initial transfer errors should be **largely unstructured** with respect to shape geometry. Without a shared spatial core, the initial mapping is arbitrary and noisy. They might confuse the pentagram with the cube (because both felt "pointy" in some vague way) as easily as with the sphere. Errors wouldn't reliably cluster based on geometric similarity (e.g., confusing all star-like shapes); they'd be scattered and only gradually become structured *through repeated associative learning* ("*that* specific look always goes with *this* specific feel").

  Therefore, the mere fact that the newly sighted person fails Molyneux's original test (no instantaneous visual identification) tells us precisely **nothing** about whether shape representations are modality-specific or modality-neutral. It only tells us that *instantaneous cross-modal recognition after sensory deprivation* is hard. The failure could stem from:
  1.  **Lack of calibration:** Not knowing *which* visual cues (perspective, shading) reliably signal the invariant 3D structure they know by touch.
  2.  **Underdeveloped visual parsing:** Inability to instantly extract the *relevant* global 3D structure from the complex, novel 2D retinal image without practice.
  3.  **Attention/Processing Limits:** Simply being overwhelmed by the influx of new sensory data.

  None of these reasons require denying a shared, modality-neutral spatial representation. The strong reading – that the "no" answer proves distinct "shape-for-X" codes requiring arbitrary linkage – is an unwarranted leap. The reverse test exposes its implausibility, and the structure of errors (which the original test doesn't even probe) is the real litmus test for a shared geometric core. Locke’s "no" is evidentially inert for the strong claim; it’s compatible with a world where shape is fundamentally spatial *and* a world where it’s fundamentally sensory-specific. Only tests probing the *nature* of successful or failed identification (like the reverse test and error analysis) can distinguish them.
