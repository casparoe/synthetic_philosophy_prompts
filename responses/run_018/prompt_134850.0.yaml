answer: |-
  ### (1) Preliminary Reasoning  
  I assume that: (1) "autonomous preference" is socially conditioned, not pre-cultural; (2) social signaling (e.g., status, identity) operates alongside material opportunity to shape choices; and (3) structural reforms alter but do not erase historical path dependencies in gender norms. Formal equality measures interact with cultural inertia.  

  ### (2) The Tier Ranking  
  - **S-tier: (B) Infrastructural Default**  
  - **A-tier: (C) Status Consolidation**  
  - **B-tier: (A) Preference Liberation**  
  - **C-tier: (D) Measurement Artifact**  

  ### (3) Defense of the Top Tier  
  **(B) Infrastructural Default** best explains Scandinavian occupational splits because universal parental leave alone cannot dismantle entrenched industry practices. Engineering remains structured around rigid, long-hour schedules implicitly favoring unbroken (traditionally male) career arcs, while nursing’s shift patterns accommodate intermittent labor force participation—a norm historically tied to feminized care. Parental leave policies, though gender-neutral, interact with these unspoken infrastructural templates: men in engineering face stronger peer pressure to minimize leave-taking to avoid disrupting project continuity, while women in nursing encounter expectations to utilize leave more freely. Thus, *formal access* to equality tools collides with *informal professional architectures* that silently channel choices.  

  ### (4) Critique of the Bottom Tier  
  **(D) Measurement Artifact** fails because Scandinavian gender segregation persists even when using consistent metrics *within* these societies over time. Longitudinal data show that as Norway/Sweden expanded childcare access and anti-discrimination laws, STEM gender gaps widened in fields like physics or computer science, while nursing became *more* female-dominated. If this were mere measurement error, internal trends would not display this counterintuitive reinforcement. The paradox emerges precisely when high-fidelity national data reveal stronger gender divides *after* structural barriers fall—contradicting the artifact thesis.  

  ### (5) Unresolved Tension  
  Even if Infrastructural Default explains *how* segregation persists, it leaves unresolved whether gendered clustering constitutes injustice. If women "freely" choose nursing despite equal access to engineering, is this autonomy or a preference shaped by invisible norms? Conversely, if men avoid nursing due to status concerns, is this a failure of egalitarian policy or acceptable cultural expression? The tension lies in distinguishing systemic coercion from legitimate cultural diversity in aspirations—a problem demanding scrutiny of *what counts as coercion* in socially embedded choice.  

  ---  
  *This analysis prioritizes frameworks exposing hidden social scaffolding over innate preference or methodological noise, while acknowledging the normative ambiguity in interpreting "choice" under soft constraints.*
