prompt: |-
  hey so me and my roommate got into it about evolutionary psych being science or just fancy just-so stories and he built this arguement that feels like it proves way too much. i need help finding the exit.

  (1) for a field to be science its core explanations have to be falsifiable in principal.
  (2) take algorithmic aversion — people reject good algorithmic advice even when they know its more accurate. evolutionary psych explains this by saying in ancestral groups trusting opaque non-human sources was risky, so we evolved a bias against them.
  (3) but if studies had shown people blindly trusting algorithms, evolutionary psych could flip the story: deferring to high-accuracy predictors was adaptive on the savanna, so we evolved a bias toward accurate agents regardless of source.
  (4) so for any behavior B and its absence, there's always an adaptive narrative that fits.
  (5) that means evolutionary psych can acommodate any observation.
  (6) a theory that can acommodate any observation explains nothing.
  (7) therefore evolutionary psych isnt science, its just storytelling.
  (8) but that cant be right because evolutionary psych does make real predictions like cheater detection modules or incest avoidance mechanisms. so one step is wrong but i dont know which. i really want to keep (1) and (8) if possible.

  where does the slip happen? which premise should i give up, and whats the cost? please answer in one continuous block of prose with no headings, no bullet points, no bold, no tables — just like an email. start with the bottom line up front: name the step youd reject, then explain why it looked okay and what giving it up costs.
reasoning: |-
  Hmm, the user is having a debate with their roommate about whether evolutionary psychology is real science or just storytelling. The roommate presented an argument that seems to prove evolutionary psychology isn't falsifiable and therefore not scientific. The user wants to identify where the logic fails while preserving both the principle that science must be falsifiable and their belief that evolutionary psychology makes real predictions.

  The roommate's argument follows this structure: (1) Science requires falsifiable core explanations; (2) Uses algorithmic aversion as an example; (3) Claims evolutionary psychology could flip the explanation for opposite findings; (4) Therefore it can explain any behavior; (5) Thus accommodates all observations; (6) Such theories explain nothing; (7) Evolutionary psychology isn't science; (8) But this conclusion seems wrong since evolutionary psychology does make predictions.

  I need to pinpoint where this reasoning goes wrong. The key flaw appears to be in step (4) - "for any behavior B and its absence, there's always an adaptive narrative that fits." This overstates what evolutionary psychologists actually do. While it might seem like they can create explanations for anything, in practice they don't just invent stories without constraints.

  The problem with step (4) is that it ignores the scientific constraints evolutionary psychology operates under. Researchers don't just invent any narrative - they use comparative biology, fossil evidence, hunter-gatherer studies, and genetic data to reconstruct plausible ancestral environments. They also use specific predictions that go beyond just fitting observations. For example, the cheater detection module prediction in Wason selection tasks showed enhanced performance specifically for social contract rules, which was later experimentally confirmed - something a just-so story couldn't have predicted.

  The cost of rejecting step (4) is acknowledging that evolutionary psychology can sometimes generate plausible but untestable narratives, which is a valid criticism when studies lack independent evidence about ancestral conditions or fail to generate novel predictions. This means some evolutionary psychology work may indeed be storytelling, but the field as a whole isn't defined by its weakest examples.

  The user wants to preserve both the falsifiability principle (1) and their intuition that evolutionary psychology makes real predictions (8), which is possible by targeting step (4) as the weak link. The solution shows how evolutionary psychology, when properly practiced, does generate testable predictions and isn't merely flexible storytelling.
answer: |-
  The slip happens at step (4). While it *feels* plausible that evolutionary psychology could generate an adaptive narrative for any behavior and its opposite, this isn't actually true or representative of how the field aims to function, making step (4) an overgeneralization. It seemed okay because the algorithmic aversion example created a strong impression of unfalsifiable flexibility – flipping the story based solely on the observed outcome without any independent anchor. However, giving up step (4) costs you the neat, damning simplicity of the argument and forces you to engage with the messy reality of how evolutionary psychology attempts to be scientific. The cost is acknowledging that *some* evolutionary psychology work might indeed be just-so stories fitting this criticism, but the field *can* and *does* impose constraints to avoid this trap when practiced rigorously.

  Rejecting step (4) means recognizing that evolutionary psychologists don't (or shouldn't) invent adaptive narratives in a vacuum solely based on the modern behavior they observe. The field relies on additional constraints derived from other scientific disciplines to make its explanations testable and potentially falsifiable. Crucially, hypotheses are anchored in independently derived knowledge about ancestral environments (from paleontology, archaeology, anthropology, primatology) and the costs/benefits of behaviors within those specific constraints. The narrative isn't invented *after* seeing the behavior; plausible hypotheses about adaptive problems in the past are generated first, leading to predictions about specific psychological mechanisms and their likely behavioral outputs *before* the data is collected. For instance, the cheater detection module prediction wasn't reverse-engineered from seeing people detect cheaters; it stemmed from the adaptive problem of social exchange and led to a novel, specific prediction about reasoning performance on the Wason task that differed from other types of rules. Similarly, the incest avoidance hypothesis generated predictions about specific triggers (like co-residence during childhood) that could be tested and potentially falsified – finding people raised together who *didn't* develop sexual aversion would challenge it. The cost of rejecting step (4) is conceding that not every paper in evolutionary psychology meets this standard. Weak studies might indeed offer post-hoc, flexible stories. But the core of the field strives to use independent evidence about the past and generate specific, novel predictions that go beyond merely accommodating the observation, aiming to meet the falsifiability requirement of step (1). This allows you to keep both (1) and (8): evolutionary psychology *can be* science when it adheres to these constraints and makes risky predictions, even if some applications fall short and resemble just-so stories. The flaw in the roommate's argument is assuming the field operates *only* like the weak examples, ignoring its attempts to use independent evidence and predictive power.
