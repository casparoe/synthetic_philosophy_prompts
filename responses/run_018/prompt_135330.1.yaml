  Regarding mechanistic interpretability - it is indeed a separate (though complementary) field to counterfactual testing. While counterfactuals probe behavior, mechanistic interpretability examines internal circuits. Both are valuable but neither alone is a silver bullet. The host was right to highlight its importance but wrong to present it as the "only real check" - it's more accurate to see it as part of a toolkit.

