prompt: |-
  I'm a reviewer at a state wetland board, and every quarter I have to sign off on mitigation-bank proposals that include an ecosystem-service valuation model. Every single one has an assumption thats obviously false -- continuous substitutability between nesting habitat and water filtration, or landowners as homogeneous rational agents with perfect information about soil carbon. I want a reusable decision procedure I can actually run in under an hour, grounded in Friedman's F-twist and whatever philosophy of science actually says about unrealistic assumptions: does the false assumption matter for this specific prediction and decision, or not? Give me the ordered steps: the exact question to ask at each point, what counts as a sufficient answer, where the procedure stops with "reject the model for this permit," where it stops with "this is a values call, not mine," and where I still have to make a judgment call despite the checklist. Apply it to three proposals: (1) a model assuming perfect substitutability that predicts flood-control acreage needed; (2) a model with homogeneous rational agents predicting 50-year carbon sequestration, where the result allows development I'd rather block; (3) a model with perfect-info agents predicting restoration success used to justify minimal long-term monitoring. Be explicit about what the procedure cant do.
reasoning: |-
  We are creating a decision procedure based on Friedman's F-twist (the idea that unrealistic assumptions are acceptable if the model makes accurate predictions) and philosophy of science (focusing on whether the false assumption matters for the specific prediction and decision at hand). The goal is to have a reusable checklist that the reviewer can complete in under an hour per proposal.

  The procedure will have the following steps:

  1. **Identify the Critical Prediction(s):** What specific prediction(s) from the model is the permit decision relying on? (e.g., "We need X acres for flood control", "The site will sequester Y tons of carbon over 50 years", "Minimal monitoring is sufficient because the site will achieve Z% restoration success")

  2. **Identify the Key Assumption(s) in Question:** What are the assumptions that are known to be false? (e.g., perfect substitutability, homogeneous rational agents, perfect information)

  3. **Map Assumptions to Predictions:** For each critical prediction, determine which assumptions are directly involved in generating that prediction.

  4. **Assess the Sensitivity of the Prediction to the Assumption (Robustness Check):** 
     - Question: If we replace the false assumption with a more realistic one (or a range of plausible alternatives), does the critical prediction change significantly?
     - Sufficient answer: The modeler provides sensitivity analysis showing that the prediction remains within an acceptable range under alternative assumptions. If not provided, the reviewer must make a judgment on whether the assumption is likely to be critical. If the prediction is robust to the assumption, then the false assumption doesn't matter. Otherwise, we proceed to step 5.

  5. **Evaluate the Direction of Bias:**
     - Question: If the false assumption is known to bias the prediction, what is the direction of the bias? (e.g., does it overestimate or underestimate the outcome?)
     - Sufficient answer: The modeler provides evidence of the direction of bias (theoretical or empirical). If not, the reviewer must use domain knowledge to judge the direction. If the bias is in a direction that would make the permit decision more conservative (e.g., overestimating the amount of mitigation needed, underestimating carbon sequestration) then the false assumption may be acceptable. If it makes the decision less conservative (e.g., underestimating needed acreage, overestimating carbon sequestration) then it may be problematic.

  6. **Assess the Decision Context:**
     - Question: Given the bias direction and magnitude (if known), does the potential error in the prediction lead to an unacceptable risk in the permit decision?
     - Sufficient answer: The reviewer must consider:
          a. The consequences of being wrong (e.g., if the flood control fails, how bad is it? If carbon sequestration is overestimated, what is the climate impact?).
          b. The margin of safety: Does the model's output, even if biased, still leave a comfortable margin? (e.g., if the model says 100 acres are needed and that might be an underestimate, but we are requiring 120 acres, then it might be acceptable).
     - If the risk is unacceptable, then the model must be rejected for this permit.

  7. **Values Call:** 
     - If the decision depends on unquantifiable trade-offs (e.g., how much risk of failure is acceptable, how to value different ecosystem services) and these are outside the reviewer's mandate, then stop and note that this is a values call for higher authorities or public input.

  8. **Judgment Call:** 
     - If after all steps there remains uncertainty (e.g., about the magnitude of bias, or the plausibility of alternative assumptions) and the decision must be made, the reviewer must use their best judgment. Document the uncertainty.

  **Where the Procedure Stops:**
  - **Reject the model for this permit:** If at step 4 the prediction is highly sensitive and no sensitivity analysis is provided (or provided analysis shows the prediction is unreliable), or at step 6 the risk is deemed unacceptable.
  - **This is a values call, not mine:** At step 7 when the decision hinges on unquantifiable value judgments that are beyond the reviewer's role.
  - **Proceed with the model (despite false assumptions):** If the prediction is robust (step 4) or the bias is in a conservative direction (step 5) and the risk is acceptable (step 6).

  **What the Procedure Can't Do:**
  - It cannot turn a bad model into a good one. If the model is fundamentally flawed (e.g., wrong structure, missing key variables) beyond the identified false assumptions, that may require rejection even if the procedure passes.
  - It cannot eliminate uncertainty; it only structures the evaluation.
  - It cannot replace missing data or analysis; if the modeler hasn't provided necessary information (like sensitivity analysis), the reviewer must either request it (which may not be feasible in the time) or make a judgment.

  **Application to Proposals:**

  **(1) Model assuming perfect substitutability for flood-control acreage prediction:**

  - Step 1: Critical prediction: The number of acres needed for flood control.
  - Step 2: False assumption: Perfect substitutability between nesting habitat and water filtration (i.e., they can be traded off without loss in flood control).
  - Step 3: Mapping: The prediction of required acreage depends on the substitutability assumption because if they are not substitutable, then the required acreage might be different (e.g., more might be needed if the two services must be provided in separate areas).
  - Step 4: Sensitivity: Without sensitivity analysis, we must judge: is the flood control service independent of the other services? In reality, flood control may depend on specific terrain and vegetation that might not be interchangeable with nesting habitat. If the modeler hasn't shown robustness, we must assume sensitivity.
  - Step 5: Direction of bias: If we assume perfect substitutability when it's not true, we might underestimate the acreage needed (because we think we can use any land, but in fact only specific land provides flood control). This is a non-conservative bias (underestimation of needed acreage).
  - Step 6: Decision context: Underestimation of needed acreage could lead to inadequate flood control, which might cause flooding and property damage. This is high risk. Without a margin of safety (e.g., requiring extra acreage) the model is unacceptable.
  - **Stop: Reject the model for this permit.** (Because of non-conservative bias and high risk.)

  **(2) Model with homogeneous rational agents for 50-year carbon sequestration, allowing development the reviewer would rather block:**

  - Step 1: Critical prediction: The amount of carbon sequestered over 50 years.
  - Step 2: False assumption: Landowners are homogeneous rational agents with perfect information about soil carbon.
  - Step 3: Mapping: The prediction depends on landowners making optimal decisions about land use that maximizes carbon sequestration. But in reality, they may not.
  - Step 4: Sensitivity: Without sensitivity analysis, we consider: if landowners are heterogeneous and have imperfect information, they might not manage the land optimally for carbon. This could lead to less sequestration than predicted.
  - Step 5: Direction of bias: The model likely overestimates carbon sequestration (because it assumes perfect management). This is a non-conservative bias (overestimation of benefits) for the permit decision (which allows development because the mitigation bank will sequester enough). The reviewer's desire to block the development is noted, but we must be objective: the model is probably too optimistic.
  - Step 6: Decision context: Overestimation of carbon sequestration could lead to a net increase in atmospheric carbon (if the development goes ahead and the mitigation doesn't deliver). This is a climate risk. If the margin of safety is absent (e.g., no buffer in the required sequestration) then the risk is unacceptable.
  - **Stop: Reject the model for this permit.** (Because of non-conservative bias and climate risk.)

  **(3) Model with perfect-info agents predicting restoration success to justify minimal long-term monitoring:**

  - Step 1: Critical prediction: The restoration success (e.g., percentage of native species cover achieved) over time, which is used to argue that minimal monitoring is sufficient.
  - Step 2: False assumption: Perfect information agents (e.g., the restorers know exactly what to do and the ecosystem responds predictably).
  - Step 3: Mapping: The prediction of high success with minimal monitoring relies on the assumption that everything goes as planned because agents have perfect information. In reality, unexpected events (e.g., invasive species, climate extremes) and imperfect knowledge may lead to lower success.
  - Step 4: Sensitivity: Without sensitivity analysis, we must consider: if agents have imperfect information, will the restoration success be lower? Likely yes, and the model might not account for uncertainty and variability.
  - Step 5: Direction of bias: The model is likely to overestimate restoration success (because it assumes no mistakes and perfect knowledge). This is a non-conservative bias (overestimation of success) that would justify less monitoring than needed.
  - Step 6: Decision context: Minimal monitoring might miss early signs of failure, leading to irreversible damage. The risk is high because without monitoring, we might not catch problems until it's too late. The model's bias leads to under-investment in monitoring.
  - **But note:** The permit decision is about monitoring, not the restoration itself. The model is being used to argue that monitoring can be minimal. However, the reviewer might be concerned that the model's over-optimism leads to inadequate monitoring. Therefore, we must consider if the monitoring plan is robust to lower success rates. If the model is rejected, then the justification for minimal monitoring fails. We might then require a more robust monitoring plan without rejecting the entire permit? But the procedure is about the model for the permit. Since the model is being used to justify minimal monitoring, and the model is biased in a way that might lead to insufficient monitoring, we reject the model for this purpose.

  However, the permit might still be approved with a revised monitoring plan. The procedure is about the model. Therefore:

  - **Stop: Reject the model for justifying minimal monitoring.** (But note: the permit could be approved with a condition of more monitoring.)

  **Note on Step 7 (Values Call):** In none of these examples did we get to step 7 because the decisions were based on risk assessment that falls within the reviewer's mandate (ensuring adequate mitigation). However, if the decision involved a trade-off between, say, economic development and environmental protection that was not quantified, that might be a values call.

  **Note on Step 8 (Judgment Call):** In all cases, the reviewer had to make judgments (e.g., about sensitivity and bias direction). The procedure structures the judgment but doesn't eliminate it.

  **Final Procedure Outline:**

  1. Identify the critical prediction(s) for the decision.
  2. Identify the false assumption(s) that are relevant.
  3. Map the assumption(s) to the prediction(s).
  4. Assess sensitivity: Is the prediction robust to changing the assumption? (If sensitivity analysis provided and shows robustness, then accept and stop. If not, proceed.)
  5. Determine the direction of bias: Does the false assumption cause overestimation or underestimation of the desired outcome?
  6. Evaluate risk: Given the bias, is the decision (based on the model) still acceptable? (Consider consequences and margins of safety.)
  7. If the decision involves unresolved value judgments beyond the reviewer's role, flag as a values call.
  8. If uncertainty remains after steps 1-6, make a documented judgment call.

  The entire process should be doable in under an hour per proposal if the reviewer is familiar with the model and the context.
answer: |-
  Below is a **reusable decision procedure** grounded in Milton Friedman's "F-twist" (unrealistic assumptions are acceptable if they yield accurate predictions for the problem at hand) and philosophy of science (e.g., Nancy Cartwright's emphasis on whether assumptions undermine *specific* predictions). The procedure focuses on **pragmatic model validation**: does the false assumption materially affect the prediction and decision? It runs in **under an hour** by zeroing in on critical failure points, with clear stopping rules.

  ---

  ### **Decision Procedure: 8 Ordered Steps**  
  *(Time: 5-10 mins per step)*  

  1. **Identify the Critical Prediction & Decision**  
     - *Question:* "What exact numerical prediction does this permit decision hinge on, and what is the concrete regulatory action (e.g., approve X acres, allow Y development, require Z monitoring)?"  
     - *Sufficient Answer:* A specific, quantifiable output (e.g., "flood control requires 50 acres") tied to a permit condition.  
     - *Stop if:* The prediction is vague or not directly linked to the decision → **Reject the model**.  

  2. **Isolate the False Assumption**  
     - *Question:* "What specific unrealistic assumption is made? Does it directly feed into the critical prediction?"  
     - *Sufficient Answer:* A clear statement (e.g., "perfect substitutability between ecosystem services").  
     - *Stop if:* The assumption is irrelevant to the prediction → Proceed with the model.  

  3. **Apply Friedman’s F-Twist: Predictive Accuracy Test**  
     - *Question:* "Is there empirical evidence (e.g., historical data, pilot studies) showing this model’s predictions are accurate *despite* the false assumption?"  
     - *Sufficient Answer:* Data from comparable sites showing <10% prediction error.  
     - *Stop if:* Evidence exists → **Accept the model** (F-twist satisfied). If no evidence, proceed to Step 4.  

  4. **Sensitivity Analysis Check**  
     - *Question:* "Does the model include sensitivity analysis testing how the prediction changes when the false assumption is relaxed (e.g., substitutability varied ±30%)?"  
     - *Sufficient Answer:* Sensitivity analysis showing <15% change in the critical prediction under plausible alternatives.  
     - *Stop if:* Analysis shows low sensitivity → **Accept the model**. If not, proceed to Step 5.  

  5. **Direction of Bias Assessment**  
     - *Question:* "In what direction does the false assumption bias the prediction? (e.g., does it overestimate benefits/underestimate costs?)"  
     - *Sufficient Answer:* Theoretical/empirical justification (e.g., "perfect substitutability underestimates acreage needed because real ecosystems have thresholds").  
     - *Stop if:* Bias is "conservative" (i.e., errs in favor of environmental protection) → **Accept the model**. If bias is "anti-conservative" (undermines protection), proceed to Step 6.  

  6. **Decision Risk Threshold**  
     - *Question:* "Could the bias lead to unacceptable harm (e.g., flooding, habitat loss, carbon shortfalls) even with margins of safety?"  
     - *Sufficient Answer:* Quantitative risk projection (e.g., "bias increases flood risk by >20%").  
     - *Stop if:* Risk is acceptable (e.g., <5% chance of failure) → **Accept the model**. If risk is high or unquantified, proceed to Step 7.  

  7. **Values Call Boundary**  
     - *Question:* "Does the decision hinge on non-scientific trade-offs (e.g., economic vs. ecological priorities) beyond my mandate?"  
     - *Sufficient Answer:* Yes, if trade-offs involve policy goals (e.g., "development benefits outweigh uncertain carbon risks").  
     - *Stop if:* Trade-offs dominate → **Flag as "values call" for policymakers**.  

  8. **Residual Judgment**  
     - *Question:* "After Steps 1–7, does sufficient uncertainty remain to undermine the decision?"  
     - *Action:* Make a holistic judgment call based on precaution. Document rationale.  
     - *Stop:* **Reject the model** if uncertainty is unacceptably high.  

  ---

  ### **Application to Three Proposals**  

  #### **Proposal 1: Perfect Substitutability for Flood-Control Acreage**  
  - **Step 1:** Critical prediction = "40 acres needed for flood control." Decision: Permit bank with 40 acres.  
  - **Step 2:** False assumption = Perfect substitutability between nesting habitat/water filtration.  
  - **Step 3:** No empirical validation data → Proceed.  
  - **Step 4:** No sensitivity analysis → Proceed.  
  - **Step 5:** **Bias direction = Anti-conservative**. Perfect substitutability *underestimates* acreage (real ecosystems have synergistic services; losing nesting habitat reduces filtration).  
  - **Step 6:** **Unacceptable risk**. Underestimation could cause flooding. → **Reject the model**.  
  - *Procedure stops at Step 6.*  

  #### **Proposal 2: Homogeneous Rational Agents for Carbon Sequestration**  
  - **Step 1:** Critical prediction = "10,000 tons sequestered in 50 years." Decision: Allow development.  
  - **Step 2:** False assumption = Landowners are identical rational agents with perfect soil carbon knowledge.  
  - **Step 3:** No empirical validation → Proceed.  
  - **Step 4:** Sensitivity analysis shows ±25% change in sequestration under heterogeneous behavior → Proceed (high sensitivity).  
  - **Step 5:** **Bias direction = Anti-conservative**. Assumption *overestimates* sequestration (real landowners have imperfect info/poor incentives).  
  - **Step 6:** High risk of carbon shortfall (e.g., 20–40% less sequestration) → **Reject the model**.  
  - *Note:* Your desire to block development is irrelevant; the procedure rejects based on risk.  
  - *Procedure stops at Step 6.*  

  #### **Proposal 3: Perfect-Info Agents for Restoration Success**  
  - **Step 1:** Critical prediction = "95% restoration success in 5 years." Decision: Approve minimal monitoring.  
  - **Step 2:** False assumption = Perfect-info agents (no uncertainty in restoration actions).  
  - **Step 3:** Empirical data from similar sites shows 70–80% success → Proceed (model overestimates).  
  - **Step 4:** Sensitivity analysis missing → Proceed.  
  - **Step 5:** **Bias direction = Anti-conservative**. Assumption *overestimates* success (real agents face weather/invasive species uncertainties).  
  - **Step 6:** High risk of undetected failure (minimal monitoring can’t catch early problems). → **Reject the model for justifying minimal monitoring**.  
  - **Step 7:** Not a values call (safety is technical).  
  - **Step 8:** Judgment: Model is unreliable for monitoring decisions. → **Reject the model**.  
  - *Procedure stops at Step 8; permit may still be approved with stricter monitoring.*  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Fix bad models:** It only evaluates assumptions’ materiality for a *specific* prediction. If the model structure is flawed (e.g., missing key variables), reject it at Step 1.  
  2. **Resolve values conflicts:** Steps 1–6 are science-based; Step 7 kicks political trade-offs to policymakers.  
  3. **Eliminate uncertainty:** Judgment calls (Step 8) are inevitable with incomplete data.  
  4. **Replace expertise:** Domain knowledge (e.g., ecology, economics) is essential for Steps 5–6.  
  5. **Guarantee outcomes:** It minimizes risk but can’t prevent unforeseen failures.  

  **Time-Saving Tips:**  
  - Skip proposals with empirical validation (Step 3).  
  - Auto-reject models without sensitivity analysis (Step 4) if bias is anti-conservative (Step 5).  
  - Use templates for recurring issues (e.g., "perfect substitutability → anti-conservative bias → reject").  

  This procedure forces explicit, auditable reasoning while respecting Friedman’s pragmatism: "The only test of a model is its usefulness."
