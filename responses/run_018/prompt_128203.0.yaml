  Right, then. Picture two rather intense fellows at the bar of the *Convergence Club*, nursing pints after a fractious debate. Algernon, cautious to his core, is meticulously wiping condensation from his glass. Bertram, possessed of a more... *opportunistic* rationality, leans in conspiratorially.

  **BERTRAM:**  
  "Still troubled by our earlier discussion, Algy? That St. Petersburg proposal truly unsettled you, didn't it? All those potential payouts doubling forever: £2, £4, £8... the expected value swelling relentlessly towards positive *infinity*. Ghastly! Utterly unmanageable for a prudent chap. Can't compute it, can't bank it, can't reason with it. Perfectly rational to refuse."

  **ALGERNON:**  
  "Quite so, Bertie. Infinity is a theoretical monstrosity. No sensible punter would engage with an expectation that large and *unbounded*. It paralyses decision-making utterly. One must draw the line."

  **BERTRAM:**  
  *(Pulling a crumpled sheet from his pocket)*  
  "Ah, but therein lies your salvation, my dear fellow! Behold! I present the *Pasadena Proposition*! Similar structure, but infinitely more... *civilised*. Flip a coin until Heads appears on the *n*-th toss. Your payout is then... *(dramatic flourish)*... £(-1)^{n+1} \cdot \frac{2^n}{n} pounds! See the elegance? The *magnitude* increases wonderfully – £2/1, -£4/2, £8/3, -£16/4, and so forth. The potential *size* is just as alarming as St. Petersburg!"

  **ALGERNON:**  
  *(Peering sceptically)*  
  "Precisely! It diverges! The terms grow without bound! Same problem, different signpost! Utterly unacceptable!"

  **BERTRAM:**  
  *(Wagging a finger)*  
  "Ah, but you miss the crucial nuance! That's where its *beauty* lies! St. Petersburg's expectation suffers from *unbounded growth* – the partial sums diverge monotonically to positive infinity. A brute! The Pasadena Proposition, however... *(leans in, lowering his voice)*... possesses an expectation that is *undefined*! Its series isn't merely divergent, it’s *conditionally convergent*! The positive and negative terms, each exploding in magnitude, are locked in a perpetual, delicate dance. Sum them naively? You might get a finite number, but rearrange the terms – perfectly legitimately! – and you can make the sum converge to *any* real number whatsoever, or even diverge! It’s not *infinite*, Algy... it’s *ambiguous*! Exquisitely indeterminate!"

  **ALGERNON:**  
  *(Eyes narrowing)*  
  "Undefined? Not infinite... but indeterminate? Hmm. That sounds... different. Less... *oppressive* than infinite growth?"

  **BERTRAM:**  
  "Precisely! Infinity is a tyrant! Undefinedness... is an *opportunity*! How can a rational agent be paralysed by something that *lacks* a definite value? It’s not demanding infinite resources; it’s simply... *flexible*! It presents no single overwhelming quantity to fear! One isn't crushed by magnitude; one is liberated by the *absence* of a fixed expectation! Therefore, my dear Algy..."

  **BERTRAM:**  
  *(Slams a shiny £1 coin onto the bar)*  
  "... I propose we play! Right now! Heads, you pay me the absolute value according to the sequence. Tails, I pay *you* the absolute value. We'll let this sovereign decide the *direction* of the cash flow! After all, since the expectation is undefined, rearranging the terms – or in this case, the payer-payee relationship based on the coin flip – is entirely within the spirit of the game! Think of it as... hedging against the indeterminacy!"

  **ALGERNON:**  
  *(Stares at the coin, then at Bertram's triumphant grin, realisation dawning)*  
  "Good Lord... you absolute bounder! You're not exploiting the *ambiguity*... you're exploiting *my aversion to infinity*! You've reframed the terrifying *unbounded growth* of St. Petersburg as the strategically malleable *non-convergence* of Pasadena! You’ve made indefinability sound like a *feature*, not a flaw! And now you want to literally *rearrange the payment terms* with this coin to guarantee you benefit from whichever finite fragment of the divergent series we happen to sample? That’s not rational comfort with ambiguity..."

  **ALGERNON:**  
  *(Picks up the coin, flips it disdainfully, and pockets it before Bertram can see the result)*  
  "... that's just sharp practice disguised as decision theory! Pass the Pasadena *and* the pint, Bertie. Your round, I believe. The only expectation being *defined* tonight is the one where you settle the tab."

  *(Bertram's grin fades slightly as he reluctantly reaches for his wallet.)*
