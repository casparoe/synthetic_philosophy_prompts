prompt: |-
  ok so i just started helping design a museum wing on modern conflicts and got stuck on something weird. for interstate wars like ww2 we frame both sides as legitimate states with ethical narratives and we honor soldiers on both sides in some sections, but for insurgencies or civil wars we always frame the non-state fighters as criminals or terrorists with no standing. the curators say its just international law but it feels like we're smuggling in a deeper view about who gets to be a moral agent in conflict. does this practice presuppose that hegelian idea that war only has ethical meaning between sovereign states that recognize each other, and that everything else is just police action? could a cosmopolitan view license the same framing, or is the practice actually locked into that state-sovereignty theory? i also wonder if hegel's claim that the state can demand citizens risk their lives for its sovereignty depends on this exact divide—like, if insurgents are ethical agents too then the state's monopoly on sacrifice collapses. whats actually being presupposed here, and what would have to change in the exhibit if we replaced it with a view that treats all armed groups as potential ethical actors?
reasoning: |-
  Okay, the user is designing a museum wing on modern conflicts and has hit a philosophical dilemma about how wars are framed differently based on statehood. They notice that interstate wars present both sides as legitimate with ethical narratives, while insurgencies frame non-state fighters as criminals. They're questioning if this stems from Hegelian state sovereignty theory and what alternatives might exist.

  Hmm, this is a layered problem blending museology, international law, and political philosophy. The user seems well-versed in Hegel but is wrestling with practical curatorial decisions. Their core concern appears to be whether current framing perpetuates state-centric bias, and they're looking for theoretical grounding to justify alternative approaches.

  The Hegelian connection they raised is astute. There's definitely a link between the ethical recognition in interstate wars and Hegel's master-slave dialectic applied to state sovereignty. The museum's current practice essentially treats non-state actors as "unethical others" - which does mirror Hegel's framework where only mutual recognition between states creates ethical war.

  But the user is also hinting at a deeper unease: is this framing accidentally endorsing state monopoly on violence? That's perceptive. When insurgents get labeled as terrorists, it implicitly validates the state's claim to sole legitimate authority. The user seems to want to challenge that hierarchy in their exhibit.

  Interesting they mentioned cosmopolitan alternatives. That suggests they're looking for ways to humanize non-state actors without romanticizing them. The tension they identified - that recognizing insurgents as ethical agents could undermine the state's sacrifice narrative - is theoretically significant. Hegel's entire justification for state sovereignty hinges on that exclusive right to demand sacrifice.

  Practically speaking, changing the framing would require careful curation: maybe using first-person accounts from insurgents, displaying their manifestos alongside state documents, or comparing different insurgencies' legitimacy claims. But the legal minefield is real - many countries have laws against "glorifying terrorism" that could trap them.

  The user's underlying need seems to be: how to design ethically consistent conflict presentation that doesn't default to state perspectives. They might benefit from seeing how museums like the War Remnants Museum in Ho Chi Minh City handle this, or how transitional justice projects frame non-state actors.
answer: |-
  You've hit on a profound tension at the intersection of international law, political philosophy, and museology. Your instinct is correct—this framing isn't neutral, and it does rest on deep theoretical assumptions, particularly the **Westphalian/Hegelian state sovereignty paradigm**. Let's break this down:

  ### 1. **The Current Framing's Philosophical Foundations**
     - **Hegelian Sovereignty & Recognition**: Yes, Hegel's *Philosophy of Right* explicitly argues that **only states possess ethical substance**. War between recognized sovereigns is an "ethical moment" where each state's right to existence is tested. Non-state actors, lacking sovereignty and mutual recognition, exist outside this ethical sphere—their violence is mere criminality or rebellion.
     - **Carl Schmitt's "Concept of the Political"**: Extends this, framing politics as defined by the friend/enemy distinction *between sovereign entities*. Insurgencies, being non-sovereign, are enemies of order, not political equals.
     - **International Law (IL) as State-Centric**: IL (e.g., Geneva Conventions) codifies this. States have rights and duties; non-state actors exist in legal limbo. Labeling them "terrorists" denies them *jus belli* (right to wage war), reducing conflicts to "law enforcement."

  ### 2. **The Monopoly on Sacrifice & Moral Agency**
     Hegel's claim that states alone can demand sacrifice hinges on this divide:
     - **State Soldiers**: Die for the *ethical idea* of the state, granting their death meaning.
     - **Insurgents**: Their deaths are (in this view) meaningless or criminal, as they lack a sovereign entity to validate their cause.  
     **→ Consequence**: Recognizing insurgents as ethical actors *does* undermine the state's monopoly on legitimized violence and sacrifice. If an insurgent dies for "freedom" or "justice," their sacrifice competes with the state's narrative.

  ### 3. **Could a Cosmopolitan View License Similar Framing?**
     - **Rawlsian Cosmopolitanism**: Might treat *all* combatants as individuals with moral agency but still distinguish between "just" and "unjust" actors based on adherence to universal principles (e.g., proportionality, targeting civilians).
     - **Critical Cosmopolitanism** (e.g., Butler, Appiah): Could reject the state's ethical privilege entirely, framing *all* conflicts through intersecting lenses of power, oppression, and resistance. Insurgents might be seen as ethical agents contesting illegitimate authority.
     - **Key Difference**: Cosmopolitanism typically shifts focus from *state legitimacy* to **individual/group rights and actions**, potentially licensing narratives where non-state fighters are tragic heroes, freedom fighters, or victims—not just "criminals."

  ### 4. **What Changes if We Treat All Armed Groups as Ethical Actors?**
     Shifting the exhibit's framing would require:
     - **Narrative Symmetry**: Present motivations and testimonies from *all* sides with equal depth. E.g., a WWII German soldier's letters alongside a French Resistance fighter's diary, and a contemporary Taliban fighter's poetry.
     - **Contextualizing Violence**: Explore *why* groups choose insurgency (oppression, foreign intervention, failed states) without legitimizing atrocities. Use comparative analysis: E.g., "How did the ANC's armed wing frame its ethics vs. the Syrian opposition?"
     - **Reconceptualizing "Sacrifice"**: Highlight how non-state groups memorialize their dead, invoke martyrdom, and construct their own ethical narratives. Contrast this with state memorialization.
     - **Legal Ambiguity**: Discuss how IL struggles with non-state actors (e.g., the Geneva Conventions' Additional Protocol II for civil wars, rarely enforced).
     - **Interactive Ethics**: Installations posing questions like: *"When is violence against a state justified?"* or *"What makes a 'legitimate' fighter?"* with historical examples (e.g., Mandela's MK, IRA, FARC).

  ### 5. **Practical Risks & Challenges**
     - **Political Backlash**: States may accuse the museum of "supporting terrorism."
     - **Moral Equivalence Trap**: Avoid suggesting all actions are equally ethical. Distinguish between *agency* (capacity for ethical choice) and *justification*.
     - **Visitor Sensitivity**: Families of terror victims may reject framing perpetrators as "ethical agents."
     - **Legal Constraints**: Some jurisdictions criminalize "glorifying" non-state armed groups.

  ### Proposal: A Third Way for Your Exhibit
  Instead of choosing between state-centric and cosmopolitan frames, design the wing to **interrogate the frame itself**:
  - **Section 1**: *How States Narrate Conflict* (WWII as mutual recognition).
  - **Section 2**: *The "Criminal" Label: Insurgencies and International Law* (e.g., colonial rebellions called "terrorism" by empires).
  - **Section 3**: *Ethics Beyond Sovereignty*: Testimonies from non-state fighters reflecting on their moral choices.
  - **Section 4**: *Sacrifice and Memory*: Compare state war memorials with insurgent shrines.
  - **Interactive Terminal**: *"Who Gets to Be a Moral Agent?"* with sliders for variables: state recognition, adherence to IL, popular support, targeting civilians.

  This approach doesn’t presuppose Hegel or cosmopolitanism but exposes how framing shapes ethical judgment—making the museum itself a site of critical inquiry.

  **In essence**: The current practice *is* locked into state-sovereignty theory. Challenging it requires curatorial courage to treat violence as a human phenomenon—not a state monopoly—while navigating the ethical and political minefields this unveils. Your exhibit could pioneer this by refusing to let international law have the final word on moral worth.
