answer: |-
  Here are the scored propositions, sorted by hinge-score (highest to lowest), with justifications drawing *only* from §94's explicit features: **absence of verification** (not acquired by satisfying correctness), **inherited character** (background is "inherited"), and **functional role** ("background against which I distinguish between true and false"). Conflicts between features are noted.

  1.  **(b) The earth existed long before I was born. (Score: 10)**  
      *Justification:* Deeply inherited (historical/cultural transmission), never personally verified (cannot satisfy oneself of its correctness), and functionally foundational for distinguishing historical truth/falsehood (e.g., evaluating fossils or documents). All §94 features align strongly.

  2.  **(f) Objects do not cease to exist when unobserved. (Score: 10)**  
      *Justification:* Core inherited background (realism is culturally ingrained, not taught as a verified hypothesis). No direct verification possible. Functionally essential for distinguishing truth/falsehood about object persistence (e.g., "Where are my keys?" presupposes this). All features align.

  3.  **(a) I have two hands. (Score: 9)**  
      *Justification:* Strongly inherited (embodied existence is a given), not typically verified (I don't check my hands exist daily). Functionally vital for distinguishing perceptual truths. Slightly less "inherited" than (b) or (f) as it's more immediately bodily, but §94's "background" encompasses this.

  4.  **(h) Other people have inner lives. (Score: 9)**  
      *Justification:* Inherited (social cognition is foundational to human community), unverifiable in principle (other minds problem). Functionally critical for distinguishing truth/falsehood in psychology, communication, or ethics. Absence of verification and functional role are maximal; inheritance is strong but potentially more variable.

  5.  **(d) 12 × 12 = 144. (Score: 8)**  
      *Justification:* Strongly inherited (via cultural/educational transmission), not typically verified by individuals (we accept mathematical authority). Functionally background for distinguishing correct/incorrect calculation. *Conflict:* Unlike empirical hinges, it *could* be verified by calculation, weakening §94's "not by satisfying myself" criterion. Inheritance keeps it high.

  6.  **(e) My name is [X]. (Score: 7)**  
      *Justification:* Inherited (social naming practices), functionally background for identity claims. *Conflict:* Score lowered because it *can* be verified (via documents/testimony), violating §94's emphasis on non-verification. Its inheritance is personal/social, not universal.

  7.  **(i) The sun will rise tomorrow. (Score: 6)**  
      *Justification:* Inherited (cultural regularity), functionally background for planning. *Conflict:* Highly verifiable (wait and see!) and based on inductive patterns, weakening the "not by satisfying correctness" aspect. Less fundamental than (a)-(f).

  8.  **(c) Water boils at 100°C at standard atmospheric pressure. (Score: 4)**  
      *Justification:* Inherited via science education, but *highly verifiable* experimentally. Functional role is specific (chemistry/physics), not broad "background" for truth/falsehood generally. §94's criteria pull apart: inheritance vs. easy verifiability.

  9.  **(g) The theory of plate tectonics is broadly correct. (Score: 3)**  
      *Justification:* Inherited (scientific consensus), but explicitly verifiable/falsifiable via evidence. Functional role is narrow (geology), not part of the deep background for daily truth-distinction. Verifiability dominates.

  10. **(j) The universe is a computer simulation run by future humans. (Score: 0)**  
      *Justification:* Not inherited (fringe hypothesis), verifiable/falsifiable in principle, and irrelevant to the functional background for distinguishing everyday truth/falsehood. Opposite of §94's inherited background.

  **Surprising Pair (vs. Moorean reading):**  
  (e) "My name is [X]" (7) > (d) "12×12=144" (8). Standard Mooreanism treats mathematical certainties (like d) as more foundational than personal facts (like e). However, §94's "inherited background" emphasizes cultural transmission over abstract necessity. Mathematical rules are learned culturally (inheritance), but personal names are *more* directly tied to the social background enabling truth-distinction (e.g., "Who said that?"). The verifiability of (e) lowers it, but its functional role in social epistemology keeps it close.

  **Indeterminate Proposition:**  
  (d) "12×12=144" is genuinely indeterminate under §94 alone. §94 discusses an empirical "picture of the world," but math is often treated differently in *On Certainty* (e.g., §651 on logical/mathematical propositions). To settle this, we'd need Wittgenstein's broader view on whether mathematical "certainties" function identically to empirical hinges in the riverbed (§96-99, §248).

  **Meta-Answer (Relativity):**  
  §94 decisively shows hinge-status is **relative to a community/historical moment**. The "inherited background" is explicitly passed down ("inherited"), implying it depends on a specific form of life (§358) and can change over time (§97). It is not a property a proposition has *simpliciter*; "my" world-picture is *our* world-picture. Inheritance entails historicity and relativity.
