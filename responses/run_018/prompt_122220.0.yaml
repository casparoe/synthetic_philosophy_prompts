prompt: |-
  I'm a software engineer with no formal philosophy background, and I've been trying to map concepts from my work onto questions about moral worth. In code review, we sharply distinguish between a patch that fixes a bug by coincidence and one that fixes it because it addresses the root cause; analogously, in ethics people talk about acting in accordance with duty versus acting from duty. Before I read the standard literature in depth, I want a full specification of what any adequate theory of moral worth must actually deliver. Write the desiderata: the cases it has to get right (for example, an agent who does the right thing for a bad reason, one who acts from a genuinely correct reason but harms someone through non-culpable ignorance, one whose motives are genuinely mixed, and a "refactoring" scenario—borrowed from version control—where an agent amends their stated justification after acting without changing the causal history of the decision), the distinctions it must preserve (such as between having moral worth and being merely praiseworthy, between primary and derivative moral value, and between an agent's actual reasons and the reasons that were available to them), and the results from empirical psychology or behavioral economics it must remain consistent with (for instance, evidence that people rarely act for explicitly articulated reasons). For each desideratum, provide the motivating case or consideration behind it, and flag any pair you suspect is jointly unsatisfiable—I am especially interested in whether accommodating the "refactoring" case forces a collapse of the distinction between actual and available reasons. Then, briefly, score how a Kantian view centered on maxims, a virtue-ethical view centered on character, and a consequentialist view centered on outcomes fare against your list, but keep the weight on the criteria rather than on the scoring. End with a single machine-readable line beginning exactly with Verdict: followed by a one-sentence summary of the deepest tension in the list.
reasoning: |-
  We are constructing a list of desiderata for a theory of moral worth. The user is a software engineer drawing analogies from code review to ethics, specifically the distinction between fixing a bug by coincidence and addressing the root cause (which maps to acting in accordance with duty vs. acting from duty). We are to provide:

  1. Cases the theory must get right.
  2. Distinctions the theory must preserve.
  3. Consistency requirements with empirical findings.

  Then, we will briefly score three ethical theories (Kantian, Virtue-Ethical, Consequentialist) against the list, and end with a verdict.

  We break down the desiderata as follows:

  ### I. Cases the Theory Must Get Right

  1. **Case A: Right Action, Bad Reason**  
     *Description*: An agent performs the right action (i.e., what is objectively morally required) but for a bad reason (e.g., helping someone only to gain a reward).  
     *Motivation*: Analogous to a patch that fixes a bug by coincidence. The theory must deny moral worth to such an action.  
     *Example*: A shopkeeper who charges fair prices only to maintain a good reputation and avoid losing customers.

  2. **Case B: Non-Culpable Ignorance Leading to Harm**  
     *Description*: An agent acts from a genuinely correct reason but, due to non-culpable ignorance, causes harm.  
     *Motivation*: The agent's intention was good and the reason was correct, but the outcome was bad due to factors beyond their control. The theory should assign moral worth to the action (or at least to the agent's intention) despite the bad outcome.  
     *Example*: A doctor who prescribes a medication that is, unbeknownst to the medical community at the time, harmful. The doctor acts from a duty to heal.

  3. **Case C: Mixed Motives**  
     *Description*: An agent acts with a mix of good and bad motives.  
     *Motivation*: Real-world agents often have multiple motives. The theory must be able to assign degrees of moral worth or explain how to handle such cases without being all-or-nothing.  
     *Example*: Someone donates to charity partly out of genuine concern and partly for tax benefits.

  4. **Case D: The "Refactoring" Scenario**  
     *Description*: An agent amends their stated justification after acting without changing the causal history of the decision.  
     *Motivation*: Borrowed from version control. The agent's initial reason might have been bad, but they later refactor their reasoning to a good one without changing the actual reason at the time of action. The theory must not allow moral worth to be retroactively changed by such refactoring.  
     *Example*: An agent helps a stranger impulsively (without any clear reason) and later claims they did it out of duty. The actual reason at the time might have been a whim.

  ### II. Distinctions the Theory Must Preserve

  5. **Distinction 1: Moral Worth vs. Praiseworthiness**  
     *Description*: An action can be praiseworthy (e.g., because it had good consequences) without having moral worth (if done for the wrong reason). Conversely, an action with moral worth (done for the right reason) might not be praiseworthy (if it leads to bad consequences).  
     *Motivation*: To avoid conflating the evaluation of the action's outcome with the evaluation of the agent's reason for acting.

  6. **Distinction 2: Primary vs. Derivative Moral Value**  
     *Description*: Primary moral value is intrinsic to the action (or the agent's motive), while derivative moral value depends on consequences or other factors.  
     *Motivation*: To capture the idea that the core of moral worth lies in the agent's will or intention, not in the contingent outcomes.

  7. **Distinction 3: Actual Reasons vs. Available Reasons**  
     *Description*: The agent's actual reasons (the psychological states that causally motivated the action) must be distinguished from the reasons that were available to the agent (the justifications the agent could have given, or that a reasonable agent in that situation would have considered).  
     *Motivation*: To prevent agents from claiming moral worth for reasons they did not act upon, and to account for cases of ignorance (culpable or not).  
     *Note*: The user is especially interested in whether accommodating the refactoring case (Case D) forces a collapse of this distinction.

  ### III. Consistency with Empirical Findings

  8. **Empirical Constraint 1: Rare Explicit Articulation of Reasons**  
     *Description*: People rarely act for explicitly articulated reasons. Their actions are often driven by implicit motives, habits, or emotions.  
     *Motivation*: Evidence from psychology (e.g., Haidt's social intuitionist model) and behavioral economics (e.g., studies on decision-making). A theory of moral worth must not require that the agent has an explicit, well-articulated reason at the time of action to assign moral worth.  
     *Example*: An agent might act kindly out of habit without consciously formulating a reason.

  9. **Empirical Constraint 2: Post Hoc Rationalization**  
     *Description*: People often rationalize their actions after the fact, constructing reasons that were not present at the time of action.  
     *Motivation*: Psychological evidence (e.g., Nisbett and Wilson's work) shows that people are often unaware of the real causes of their behavior and invent reasons when asked. This is directly related to the refactoring scenario (Case D).  
     *Example*: The refactoring case above.

  ### Potential Tensions

  - **Tension 1: Refactoring (Case D) and Actual vs. Available Reasons (Distinction 3)**  
    The refactoring case requires that the moral worth of an action depends only on the actual reasons at the time of action and is immune to later rationalizations. However, if we take seriously that agents rarely have explicit reasons (Empirical Constraint 1) and often rationalize post hoc (Empirical Constraint 2), then it becomes hard to determine what the actual reasons were. This might lead to a collapse of the actual/available distinction because we might have to rely on the available reasons (what the agent can articulate) to assign moral worth. But that would be problematic because then the refactoring scenario would allow changing moral worth by changing the articulation.

  - **Tension 2: Non-Culpable Ignorance (Case B) and Actual Reasons vs. Available Reasons (Distinction 3)**  
    In Case B, the agent acts on a correct reason (e.g., to heal) but causes harm due to non-culpable ignorance. The theory must assign moral worth to the action. However, the available reasons (if we consider what reasons were available to a reasonable agent) might have included that the medication was harmful (if the information was available but the agent didn't know). But the agent did not have that reason. So we must base moral worth on the actual reasons (the intention to heal) and not on the available reasons (which might have included the risk). This preserves the distinction.

  ### Brief Scoring of Ethical Theories

  We will briefly consider how Kantian, Virtue-Ethical, and Consequentialist theories fare against the above desiderata. Note: We are focusing on the criteria, so the scoring is very brief.

  1. **Kantian (centered on maxims)**  
     - **Strengths**: 
       - Easily handles Case A: Acting from duty is required for moral worth, so a right action for a bad reason lacks moral worth.
       - Handles Case B: The agent acts from a good maxim (e.g., to heal) and non-culpable ignorance does not negate the moral worth of the maxim.
       - Preserves Distinction 1: Moral worth is about the maxim, not the outcome (so separate from praiseworthiness).
       - Preserves Distinction 2: Primary value is in the good will.
     - **Weaknesses**:
       - Case C (Mixed Motives): Kantian theory struggles with degrees. It might require that duty must be the sole motive for moral worth, so mixed motives could lead to no moral worth.
       - Case D (Refactoring): The actual maxim at the time of action matters. But Kant requires that the agent act on the maxim of duty. If the agent did not act on that maxim, then even if they later claim they did, it doesn't count. This is good for the refactoring case. However, the empirical constraints are challenging: Kantianism often requires explicit reasoning about maxims, which is rare (Empirical Constraint 1). Also, how do we know the actual maxim? Post hoc rationalization (Empirical Constraint 2) makes it hard to verify.
       - Distinction 3: Kantianism focuses on the agent's actual maxim (actual reason) but also requires that the maxim be universalizable (which might involve available reasons). This might be a tension.

  2. **Virtue-Ethical (centered on character)**  
     - **Strengths**:
       - Handles Case C (Mixed Motives): Virtue ethics can account for degrees of virtue and the complexity of motives.
       - Handles Empirical Constraint 1: Actions can have moral worth if they flow from a virtuous character, even without explicit reasoning.
       - Distinction 2: Primary value is in the character, which is intrinsic, while consequences are derivative.
     - **Weaknesses**:
       - Case A: A right action from a bad reason might still be praiseworthy if it comes from a virtuous character? But if the agent is not virtuous, then the action might not have moral worth. However, an action done for a bad reason by a non-virtuous person might be in accordance with virtue but not from virtue. So it might deny moral worth.
       - Case B: An agent with a virtuous character (e.g., a compassionate doctor) might cause harm due to non-culpable ignorance. The action might still have moral worth because it was done from virtue. So this is handled.
       - Case D (Refactoring): The moral worth of an action is determined by the agent's character at the time of action. If the agent later refactors, that doesn't change the character at the time. So it should be okay. But the problem is that without explicit reasons, how do we tie the action to the character? And if the agent later claims they acted from virtue, but the action was out of character, then it might be hard to tell. Empirical Constraint 2 (post hoc rationalization) is a challenge.
       - Distinction 1: Virtue ethics might blur moral worth and praiseworthiness because a virtuous action might be both. But a virtuous action that leads to bad consequences might still have moral worth (from virtue) but not be praiseworthy (because of the outcome). So the distinction can be preserved.

  3. **Consequentialist (centered on outcomes)**  
     - Note: Consequentialism typically evaluates actions by outcomes, but moral worth might be defined in terms of motives that tend to produce good outcomes (e.g., rule consequentialism or motive consequentialism).
     - **Strengths**:
       - Case B: If the outcome is bad, then the action might not be praiseworthy, but if we focus on the motive (if the motive is one that tends to produce good outcomes) then the action might have moral worth. However, pure act consequentialism might not have a notion of moral worth independent of the outcome.
       - Empirical Constraint 1: Consequentialism doesn't require explicit reasoning, but rather that the action has good consequences (or that the motive is one that typically does). So it might be consistent.
     - **Weaknesses**:
       - Case A: A right action for a bad reason might still be praised if it had good consequences, and the motive might be seen as having moral worth if it is a motive that generally leads to good consequences. But if the bad reason is a motive that usually leads to bad consequences, then it might be denied moral worth. However, this is not straightforward.
       - Case C: Mixed motives might lead to an evaluation of the net expected outcome of the motives. But it's messy.
       - Case D (Refactoring): The moral worth would depend on the actual motive (if we are considering motive consequentialism). But if the agent changes their stated reason, that doesn't change the actual motive. However, consequentialism might not care about the actual motive but about the consequences of holding such a motive. This might not align with the refactoring intuition.
       - Distinction 1: Consequentialism might collapse moral worth and praiseworthiness because both are tied to outcomes. If an action has good outcomes, it is praiseworthy and (if the motive is good) has moral worth? But it might not distinguish.
       - Distinction 2: Consequentialism might see primary value in outcomes, so the motive has only derivative value (as a means to outcomes). This might not preserve the distinction as the user wants.

  ### Verdict

  The deepest tension in the list is between the refactoring scenario (which requires that moral worth depend solely on the actual psychological reasons at the time of action) and the empirical findings that people rarely act on explicit reasons and often engage in post hoc rationalization (which makes it difficult to know what the actual reasons were without relying on available reasons or post hoc reports). This tension threatens the distinction between actual and available reasons.

  Therefore, we write:

  Verdict: The deepest tension lies between the requirement that moral worth be determined solely by the agent's actual reasons at the time of action (as highlighted by the refactoring case) and the empirical reality that actual reasons are often implicit and subject to post hoc rationalization, potentially collapsing the distinction between actual and available reasons.
answer: |-
  ### Desiderata for a Theory of Moral Worth  
  Below, I specify the criteria an adequate theory of moral worth must satisfy, grouped into **cases**, **distinctions**, and **empirical constraints**. Each desideratum includes its motivation and a note on potential tensions.  

  ---

  #### **I. Cases the Theory Must Get Right**  
  1. **Right Action, Bad Reason**  
     - **Case**: An agent performs the right action (e.g., saves a drowning child) solely for self-interested reasons (e.g., fame).  
     - **Motivation**: Analogous to a "coincidental bug fix" in code—outcome is correct, but the method lacks integrity. The theory must deny moral worth here.  
     - **Tension Flag**: None isolated.  

  2. **Non-Culpable Ignorance with Harm**  
     - **Case**: An agent acts from a morally correct motive (e.g., administering medical aid) but causes harm due to unforeseeable factors (e.g., an unknown allergy).  
     - **Motivation**: Mirroring a "correctly intended but flawed patch," moral worth should persist if the agent's reasoning was sound. Outcome alone cannot negate worth.  
     - **Tension Flag**: Conflicts with outcome-centric views; requires separating intent from consequences.  

  3. **Mixed Motives**  
     - **Case**: An agent acts with blended motives (e.g., donating to charity from both genuine empathy and desire for social status).  
     - **Motivation**: Real-world decisions involve multiple drivers. The theory must handle gradations or thresholds of moral worth without binary categorization.  
     - **Tension Flag**: May challenge views requiring "pure" motives (e.g., Kantianism).  

  4. **Refactoring Scenario**  
     - **Case**: An agent revises their stated justification post-action (e.g., claims they helped "from duty" after initially acting impulsively), without altering the decision’s causal history.  
     - **Motivation**: Borrowed from version control—retroactive "code refactoring" shouldn’t alter moral worth. The theory must anchor worth to the *actual* reasons at the time of action.  
     - **Tension Flag**: High risk of collapsing **actual vs. available reasons** (see II.3) if post hoc rationalizations are permitted to redefine worth.  

  ---

  #### **II. Distinctions the Theory Must Preserve**  
  1. **Moral Worth vs. Praiseworthiness**  
     - **Distinction**: Moral worth assesses the agent’s reasons/motives; praiseworthiness evaluates outcomes or social utility.  
     - **Motivation**: An action can be praiseworthy (e.g., accidentally saving lives) without moral worth (if done for vile reasons), and vice versa (e.g., a well-intentioned failure).  
     - **Tension Flag**: Consequentialism struggles here by conflating worth with outcomes.  

  2. **Primary vs. Derivative Moral Value**  
     - **Distinction**: Primary value resides in the agent’s will/intent (e.g., acting from duty); derivative value stems from consequences or context.  
     - **Motivation**: Root-cause fixes (primary) should be valued over coincidental ones (derivative), even if outcomes are identical.  
     - **Tension Flag**: Consequentialism reverses this, prizing outcomes over intent.  

  3. **Actual Reasons vs. Available Reasons**  
     - **Distinction**: Actual reasons are the psychological causes of action; available reasons are justifications accessible to the agent (e.g., via reflection).  
     - **Motivation**: Prevents agents from "retrofitting" justifications (as in the refactoring case). Moral worth depends *only* on actual reasons.  
     - **Tension Flag**: **Directly clashes with the refactoring case (I.4) and empirical constraints (III.1–2)**. If available reasons dominate, refactoring becomes trivial; if actual reasons are prioritized, empirical data on implicit motives complicates verification. *Suspected jointly unsatisfiable with III.1–2.*  

  ---

  #### **III. Empirical Constraints**  
  1. **Implicit Motives Dominance**  
     - **Constraint**: People rarely act on explicit, articulated reasons; behavior is often driven by intuition, habit, or emotion.  
     - **Motivation**: Psychological evidence (e.g., Haidt’s social intuitionism, dual-process theory) shows explicit reasoning is often post hoc. The theory must assign moral worth without requiring conscious deliberation.  
     - **Tension Flag**: Conflicts with Kantian emphasis on maxims as consciously held principles.  

  2. **Post Hoc Rationalization**  
     - **Constraint**: Agents frequently reconstruct reasons post-action to fit societal or personal narratives (e.g., Nisbett & Wilson’s confabulation experiments).  
     - **Motivation**: Undermines reliance on self-reported reasons. The theory must not let refactoring (I.4) alter moral worth.  
     - **Tension Flag**: Amplifies tension with **actual vs. available reasons (II.3)**—if actual reasons are inaccessible, the distinction may collapse.  

  ---

  ### **Theory Scoring Brief**  
  - **Kantian (Maxims)**:  
    - ✅ Handles I.1 (denies worth for non-duty motives) and I.2 (non-culpable ignorance doesn’t taint the good will).  
    - ❌ Struggles with I.3 (mixed motives) due to purity demands; I.4 (refactoring) is rejected, but ❗empirical constraints (III.1–2) challenge maxim accessibility.  
    - ✅ Preserves II.1–II.2 but ❗II.3 (actual vs. available) is strained by reliance on agents’ articulable maxims.  

  - **Virtue-Ethical (Character)**:  
    - ✅ Handles I.3 (mixed motives as character complexity) and I.2 (non-culpable ignorance reflects epistemic virtue).  
    - ❓I.4 (refactoring) is rejected if character is fixed at action-time, but character traits are opaque (❗III.1–2).  
    - ❗Blurs II.1 (praiseworthiness and moral worth merge in "virtuous agent") and II.3 (character may obscure actual reasons).  

  - **Consequentialist (Outcomes)**:  
    - ✅ Aligns with III.1–2 (no need for explicit reasons).  
    - ❌ Fails I.1 (grants worth for good outcomes), I.2 (ignorant harm lacks worth), and I.4 (allows refactoring if outcomes improve).  
    - ❗Collapses II.1 (worth = praiseworthiness) and II.2 (derivative outcomes trump primary intent).  

  ---

  Verdict: The deepest tension lies in jointly satisfying the refactoring scenario's demand for anchoring moral worth to actual psychological reasons and the empirical reality that such reasons are often implicit, inaccessible, or retrospectively reconstructed, risking collapse of the actual/available reasons distinction.
