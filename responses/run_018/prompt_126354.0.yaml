  ### **Logical Space Map**  
  - **Occupied Views**: All leaves are covered (see above).  
  - **Empty/Inconsistent Combos**:  
    - **Saying "No" to Silent Archive + "Yes" to AI Replacement Badness**:  
      *Why?* If an unaccessed archive *isn’t* tragic (Node 3), you’re saying continuation matters. But then rejecting AI replacement (Node 4) contradicts this—it implies human biology is special. Incoherent!  
    - **Saying "Yes" to Silent Archive + "No" to AI Replacement**:  
      *Coherent!* You care about conscious experience continuing, not humans specifically → **Leaf 3**.  

  - **Where Views Diverge**:  
    - **Scheffler (Leaf 5) vs. Intrinsic Value (Leaf 4)**: Both say "YES" to Node 1 (extinction after death is bad) and Node 3 (silent archive is bad). They split at Node 5:  
      - Scheffler cares about humanity’s future giving *meaning to present actions*.  
      - Intrinsic Value cares about the human story as a *standalone work*.  
    - **Reciprocity (Leaf 2) vs. Everything Else**:  
      It’s the only view focused on *present people being wronged*, not future loss.  

