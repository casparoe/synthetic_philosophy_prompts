answer: |-
  Based on your friend's pattern and the three proposed rules, here's the breakdown:

  ### 1. **Predicted Verdict for the Elder/Pigs Case**  
  **Not corruption.** This aligns with her "non-corruption" rulings on Trobriand kula and Melanesian big-man exchanges, where gifts follow local reciprocity norms in stateless societies.

  ### 2. **How Each Rule Judges the Case**  
  | **Rule Type**               | **Verdict on Elder/Pigs Case** | **Reasoning**                                                                 |
  |-----------------------------|--------------------------------|-------------------------------------------------------------------------------|
  | **Universalist**            | Corruption                     | The elder misused their *de facto* public trust by accepting pigs post-ruling, creating potential bias. |
  | **Localist**                | Not corruption                | Locals view it as fair reciprocity; no norm violation occurred.               |
  | **Institutional**           | Not corruption                | No bureaucratic state exists; the elder isn’t a formal state official.        |

  ### 3. **Which Rule She’s *Actually* Using**  
  **The Institutional Rule.** Her verdicts consistently hinge on whether the act occurs within a *formal bureaucratic state*:  
  - ✅ **"Not corruption" cases**: All lack a Weberian state separation (kula, big-man pigs, omiyage*).  
    *(Note: Omiyage is tricky but likely deemed "regulated custom" rather than secret bribery).*  
  - ❌ **"Corruption" cases**: All involve state institutions (voting, contracting, jobs, super-PACs).  
  **Contradiction explained**: Her omiyage verdict (*gifts to officials*) seems to break the institutional rule. This suggests she adds a **transparency/norm codification** sub-rule: if gifts are open, customary, and non-discretionary (like omiyage), they’re exempt—even with state actors.  

  ### 4. **Hypothetical Case to Split Universalist vs. Localist**  
  **Scenario**: In a *modern bureaucratic state*, a low-level official in a rural region routinely accepts small "gifts" (e.g., groceries, cash) from locals to expedite permits. The community views this as normal reciprocity, not bribery.  
  - **Institutional Rule**: Corruption (state bureaucracy exists).  
  - **Localist Rule**: Not corruption (norms permit it).  
  - **Universalist Rule**: Corruption (breach of public trust).  
  **Result**: Splits Localist (not corruption) vs. Universalist (corruption), exposing their conflict when state and local norms clash.  

  ### 5. **Your Bias Critique**  
  You’re right: her framework **implicitly centers Western bureaucratic ideals**. The institutional rule defines corruption by proximity to a *Weberian state model* (formal offices, separation of roles). This:  
  - Pathologizes non-state gift economies (e.g., kula = "not corruption" only because no state exists).  
  - Ignores that states like Japan or Italy may have *embedded* reciprocity norms (e.g., omiyage as "acceptable" graft).  
  - Reveals a **neo-colonial blind spot**: "Corruption" becomes whatever violates idealized Western administrative purity, while non-Western practices are "cultural" but potentially corrupt if transplanted to a state context (e.g., guanxi).  

  **Key Takeaway**: Her model uses **Institutional + Transparency** as the core rule, but its reliance on Western statehood as the "neutral" benchmark risks cultural bias. To refine it, she could:  
  - Acknowledge the state-centric bias explicitly.  
  - Add a dimension of **power imbalance** (e.g., does the gift coerce/exploit?).  
  - Distinguish between *gift economies* (mutual obligation) and *corruption* (personal gain subverting public roles).  

  Would you like to workshop a counter-framework to challenge her approach?
