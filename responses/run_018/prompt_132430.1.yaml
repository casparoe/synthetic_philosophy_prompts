prompt: |-
  As a software engineer without formal philosophy training, I have been following debates about whether explaining consciousness or moral responsibility by breaking them down into neural or evolutionary mechanisms is like compiling high-level source code into assembly language: the behavior is preserved, but the explanation lives entirely at the lower level, with no mysterious 'skyhook' needed to lift it back up. Critics call this 'greedy reductionism' — treating macro-level properties as merely apparent, like complaining that a compiled binary has lost its variable names — while others talk about 'cranes', meaning step-by-step, bootstrapping explanations that build complexity upward without invoking unexplained high-level forces.

  Can you audit this analogy precisely? Give me the correspondence table: what plays the role of the compiler, the source code, the binary, the lost variable names, and the 'skyhook' the analogy claims is unnecessary. Then lay out the disanalogies: does compilation actually preserve all source-level properties (consider optimization, emergent runtime bugs, or the absence of semantics in assembly), and does evolutionary or neural explanation work like deterministic compilation? Identify which breaks matter for the reductionist conclusion and which do not. Next, tell me whether the analogy quietly smuggles in its conclusion — that macro-level concepts are dispensable — and whether a 'crane' version of the story (a bootstrapping build-up) avoids greedy reduction without needing a skyhook. Finally, assess whether the claim that high-level properties are merely convenient summaries survives once the mapping failures are explicit, and suggest a better analogy if this one misleads. Please write your answer in British English, though I am writing in American English.
