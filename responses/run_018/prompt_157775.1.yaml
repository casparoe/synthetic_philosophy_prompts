prompt: |-
  I am preparing a single ninety-minute seminar for final-year philosophy undergraduates who have just completed a module on moral motivation but have not yet encountered Bernard Williams’s internal reasons thesis in detail. I want them to understand the wrong kind of reasons problem — specifically, why possessing an instrumental reason that reliably promotes an end does not automatically furnish a reason to pursue that end, and why supplying an external consideration often fails to generate the corresponding motivation. Rather than asking for the explanation itself, I need a teaching plan: the precise order in which the conceptual pieces must be introduced so that the internal/external distinction feels earned rather than stipulated; the one concrete carrying scenario that should sustain the session (together with an explicit justification for avoiding the standard gunman or moral-blackmail examples, which I think would mislead this audience); the predictable misconceptions that will form at each stage — particularly the slide from “wrong kind of reason” into “no reason whatsoever,” the conflation with weakness of will, and the assumption that normative force just is psychological efficacy — along with the exact point in the sequence where each should be intercepted; a single diagnostic question I can pose near the end to test whether they have grasped the dependency between reason and motivation rather than merely memorised the distinction; and what I should openly decline to cover at this level, with a brief rationale for each omission. The students are analytically sharp but prone to treat philosophical distinctions as psychological descriptions.

  Please present this as a structured pedagogical plan rather than as the explanation itself, use British spelling throughout, keep the response under 450 words, and do not include any reading lists, bibliographies, or requests for citations.
reasoning: |-
  Okay, the user is preparing a seminar on Bernard Williams's internal reasons thesis for final-year philosophy students. They've covered moral motivation but not Williams in detail. The focus is on the "wrong kind of reasons" problem, specifically why instrumental reasons don't automatically give reasons for ends, and why external considerations often fail to motivate.

  The user wants a structured teaching plan with several specific elements: a logical sequence of concepts, a concrete scenario (avoiding gunman/moral blackmail examples), how to address misconceptions, a diagnostic question, and clear omissions. Students are analytically sharp but tend to conflate philosophical distinctions with psychological descriptions.

  I need to design a seminar that builds the internal/external distinction step-by-step. Key elements should include:
  - Starting with uncontroversial instrumental reasons to establish baseline understanding
  - Introducing a non-standard scenario (like the "sports car" example) to avoid triggering moral assumptions
  - Carefully sequencing concepts: instrumental reasons → ends without reasons → external considerations → Williams' internalism
  - Anticipating and intercepting misconceptions at precise points:
    - The slide from "wrong kind" to "no reason" when discussing ends
    - Conflation with weakness of will when examining motivation gaps
    - Equating normative force with psychological efficacy
  - Including a diagnostic question about whether external considerations constitute reasons
  - Explicitly omitting discussions of moral reasons and categorical imperatives to maintain focus

  The scenario choice is crucial - sports car avoids moral baggage while still demonstrating how external incentives (parental approval) fail to generate reasons. Justification for avoiding gunman examples is that they introduce coercion/distortion.

  The plan must flow logically: start with what students know (instrumental reasons), introduce the puzzle (ends without reasons), demonstrate the failure of external considerations, then introduce Williams' solution. Each misconception should be addressed immediately when it's likely to arise.

  For the diagnostic question, something like "Does the parental approval give the student any reason to want the sports car?" would test if they grasp that external considerations ≠ reasons without corresponding motives.

  Omissions should include moral reasons (to avoid confusion with motivation) and Kantian imperatives (beyond scope), with brief rationales stated upfront.
answer: |-
  **Seminar Plan: Williams on Reasons & Motivation**  
  *(90 minutes; British spelling throughout)*

  **I. Foundation: Instrumental Reasons (15 mins)**  
  - *Start with consensus:* Revise Humean instrumentalism (reasons exist relative to existing desires). Use *neutral example:* "If you want coffee, and the café is open, you have reason to go there."  
  - *Stress:* Instrumental reasons *presuppose* an end but don’t evaluate it.  
  - **Misconception Intercept:** Pre-empt "psychological efficacy = normative force" by asking: *"Does the strength of your desire affect whether the reason exists?"* Clarify: Instrumental reasons are *conditional*, not psychological facts.

  **II. The Gap: Ends Without Reasons (20 mins)**  
  - *Introduce carrying scenario:* "A student feels no desire for a sports car but is offered £50,000 by parents if they *genuinely come to want one*. They research, test-drive, yet still feel nothing."  
  - *Why not gunman/moral examples?* Coercion/moral stakes muddy motivation/reason links; this scenario isolates *external incentives failing to generate desires/reasons*.  
  - *Puzzle:* They have instrumental reason to *try* to want it (for £50k), but does that furnish reason *to want it*?  
  - **Misconception Intercept:** Block "no reason whatsoever" by stressing: *They have reason to act as if they want it. But is there reason to actually want it?*

  **III. External Considerations & Motivation Failure (20 mins)**  
  - *Analyse scenario:* The £50k is an *external* consideration—it doesn’t engage their subjective motivational set (S).  
  - *Key insight:* Supplying external incentives (money, approval) often *doesn’t* produce corresponding motivation, no matter how reliably it promotes the end.  
  - **Misconception Intercept:** Pre-empt conflation with *weakness of will*: Contrast "trying but failing to act on a desire" (weakness) with "no desire existing at all" (this case).

  **IV. Williams’ Internalism: The Distinction Earned (20 mins)**  
  - *Introduce internal reasons:* A reason for A must be grounded in A’s "subjective motivational set" (S)—not just desires, but dispositions, commitments.  
  - *External reasons:* Putative reasons lacking this grounding (e.g., £50k for wanting the car).  
  - *Revisit scenario:* The £50k is external—hence a "wrong kind of reason" *for wanting the car* (though right kind for acting).

  **V. Diagnostic Question & Recap (15 mins)**  
  - *Diagnostic:* "If the student *succeeds* in making themselves want the sports car via the £50k incentive, does this show the money *was* an internal reason to want it all along?"  
  - *Correct answer:* No. The money *caused* a new desire, but wasn’t *itself* a reason grounded in prior S.  
  - *Recap:* Wrong kind ≠ no reason; it’s about *grounding* in S. Normative force ≠ psychological efficacy.

  **Omissions & Rationale:**  
  - **Moral reasons:** Williams’ critique of "external moral demands" omitted to avoid conflating motivation with moral ontology.  
  - **Kantian categorical imperatives:** Beyond scope; focus is on internal/external structure, not competing foundations.  
  - **Full S analysis:** Deliberative routes & "one thought too many" excluded for time; today establishes core dependency.
