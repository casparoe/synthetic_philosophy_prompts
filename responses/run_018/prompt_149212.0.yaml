prompt: |-
  You are an expert philosopher of mind and value, with particular familiarity with phenomenology and the philosophy of well-being. Before answering, take a moment to think step by step and briefly brainstorm the conceptual landscape of hedonism’s heterogeneity problem — specifically, whether bodily, intellectual, and malicious pleasures share a common phenomenal core, an intentional structure, or neither. Treat this as an agenda-setting exercise for a small research group with roughly three years of conceptual work: identify and defend the prioritization of exactly five open questions, implications, or lines of work in this area. Your selection should cover classic issues — for instance, whether felt-quality or pro-attitude accounts can accommodate malicious pleasure without ad hoc adjustments — and should also include at least one less conventional framing, such as whether pleasure might be unified not by a shared phenomenology but by a family-resemblance cluster anchored in homeostatic reward dynamics, and what that would imply for cross-species welfare comparison. For each of the five items, explain why it is upstream or downstream of the others, how tractable it is for philosophical rather than empirical neuroscience work, and what kind of argument or finding would cause you to reorder the list. Do not provide bibliographies, reading lists, or citations. Respond as a numbered list containing exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Okay, let me approach this systematically. The user wants a focused research agenda on hedonism's heterogeneity problem, specifically addressing whether different types of pleasure share common features. As an expert in phenomenology and value theory, I need to identify five priority questions that balance classic issues with fresh perspectives.

  First, considering the core tension: traditional hedonism struggles to explain how bodily, intellectual, and malicious pleasures could feel similar or share intentional structures. The malicious pleasure case seems particularly challenging - how can Schadenfreude possibly share a phenomenal core with, say, the pleasure of solving a math problem? 

  I'm structuring the agenda to build logically while covering distinct angles. The foundational question must be about phenomenology versus intentionality (Item 1), since all other issues depend on this basic taxonomy. Then naturally follows the pro-attitude challenge (Item 2) - if we adopt attitude-based theories, how do they handle malice without ad hoc fixes? 

  For the unconventional angle, I'm considering neurobiological grounding (Item 3) - not as reductionism but as conceptual scaffolding. This forces us to ask: if pleasure is evolutionarily rooted in reward systems, what does that imply for cross-species welfare? 

  The remaining items should address downstream implications: value asymmetry (Item 4) questions whether malice could ever be intrinsically good, while agency constraints (Item 5) examines if pleasure requires certain cognitive capacities. 

  I'm assessing tractability: Items 1-2 are squarely philosophical, while 3 needs careful handling to avoid neuro-overreach. Items 4-5 bridge ethics and philosophy of mind. The agenda order would shift if, say, neuroscience found a universal reward signature across pleasure types - that would elevate Item 3's priority dramatically.
answer: |-
  1. **Phenomenal Core vs. Intentional Structure Primacy**: Determine whether the heterogeneity problem is best resolved by identifying a shared, intrinsic felt-quality (phenomenal core) across pleasure types or by analyzing their common intentional object/attitude structure (e.g., liking *that p*), as this distinction is foundational to all subsequent analyses and dictates the framework for accommodating malice.  
  *Upstream/Downstream*: Most upstream; resolution shapes all other questions.  
  *Tractability*: Highly tractable via conceptual analysis and phenomenological description.  
  *Reorder Trigger*: Empirical evidence of a universal neural "liking" signature across pleasure types would elevate neurobiological unification.  

  2. **Pro-Attitude Theories and Malice**: Assess whether desire-based or "taking pleasure in" accounts can explain malicious pleasure (e.g., Schadenfreude) without ad hoc exclusion—does malice require a distinct pro-attitude structure (e.g., toward others' suffering) that undermines unity?  
  *Upstream/Downstream*: Downstream of Item 1 (depends on intentional structure), but upstream for value theory.  
  *Tractability*: Philosophical, requiring refinement of attitude ontology.  
  *Reorder Trigger*: A compelling counterexample showing malice structurally identical to benign pleasure.  

  3. **Neurobiological Grounding of Family Resemblance**: Investigate if pleasure unity is a Wittgensteinian cluster concept anchored in shared homeostatic reward functions (e.g., dopamine dynamics) rather than necessary/sufficient conditions, and whether this implies cross-species welfare comparability via conserved mechanisms.  
  *Upstream/Downstream*: Parallel to Item 1; challenges phenomenal/intentional primacy.  
  *Tractability*: Moderate; requires philosophy-neuroscience dialogue but avoids empirical detail.  
  *Reorder Trigger*: Discovery that malicious pleasure recruits distinct reward pathways would prioritize this.  

  4. **Value Asymmetry of Pleasure Types**: Examine whether heterogeneity forces axiological bifurcation—e.g., must malicious pleasures be intrinsically disvaluable despite feeling "good," and does this imply pluralism about welfare goods?  
  *Upstream/Downstream*: Downstream of Items 1-2 (depends on malice's structure), but upstream for normative implications.  
  *Tractability*: Core philosophical work on value aggregation.  
  *Reorder Trigger*: A successful reduction of malice to non-malicious structure (Item 2) would deprioritize this.  

  5. **Agency and Reflective Endorsement Constraints**: Determine if unity requires pleasure to be subsumable under agency (e.g., only pleasures endorsable upon reflection count for well-being), excluding malice or primitive bodily states, and how this intersects with cross-species welfare.  
  *Upstream/Downstream*: Downstream, applying constraints to Items 1-4.  
  *Tractability*: Highly tractable via autonomy/agency theories.  
  *Reorder Trigger*: Evidence that non-human animals experience malice-like states would force integration with Item 3.
