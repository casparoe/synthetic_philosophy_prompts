answer: |-
  ### Activity Design: "The Adaptive Predictor Game"

  **Core Objective:** Create visceral tension between evidential reasoning ("my choice now signals what I'll do later") and causal reasoning ("my choice now can't alter the already-sealed prediction") through a multi-round game with a learning predictor.

  ---

  ### Prose Description

  **Setting and Audience**  
  16 students in a 90-minute seminar. Tables arranged in a U-shape for privacy during choice-writing. Facilitator uses a whiteboard to track rules and scores.

  **Predictor Twist**  
  The predictor is a statistical model that updates each round using *only the student’s own prior choices*:  
  - **Round 1:** Prediction randomized (fair coin flip: A or B).  
  - **Rounds 2–5:** Predicts the student’s *most frequent prior choice* (if tie, coin flip).  
  *Example:* If a student chose A in R1 and B in R2, the R3 prediction is random. If they then choose B in R3, R4 predicts B.

  **Rules, Roles, Materials**  
  - **Roles:** Students are players; facilitator runs the predictor.  
  - **Materials:**  
    - 16 clipboards (privacy shields), pens, individual record sheets.  
    - 80 prediction slips (small papers), 80 choice slips.  
    - 1 master tracking sheet (facilitator’s grid: students × rounds).  
    - Coin for flips.  
  - **Procedure:**  
    1. **Start of round:** Facilitator generates predictions based on *prior* choices (R1: coin flips). Writes each prediction on a slip, folds it, hands to student.  
    2. **Choice phase:** Students write A or B on *choice slip* (secretly) and hand to facilitator. Record choice on personal sheet.  
    3. **Revelation:** After all choices collected, students unfold prediction slips.  
    4. **Scoring:** Facilitator displays payoff matrix. Students self-score and report points.  
    5. **Update:** Facilitator records choices on master sheet for next round’s predictions.  

  **Payoff Scheme**  
  Points per round based on **actual choice** vs. **prediction**:  

  |             | Prediction A | Prediction B |
  |-------------|-------------|-------------|
  | **Choice A** | 3 points   | 0 points    |
  | **Choice B** | 4 points   | 1 point     |

  **Total points** over 5 rounds determine ranking. **Top scorer chooses the seminar’s closing discussion topic** (e.g., "Should we abolish the predictor?").

  **Round Structure & Timeline**  
  - **Setup (10 min):** Distribute materials. Explain rules *without* naming Newcomb. Clarify: "The model learns only from *your own past choices*." Display payoff matrix.  
  - **Rounds 1–5 (50 min, 10 min/round):**  
    - Prediction generation (2 min)  
    - Choice collection (3 min)  
    - Revelation/scoring (5 min, incl. facilitator updates)  
  - **Debrief (30 min):** See below.  

  **Debrief Mapping**  
  - **Evidential vs. Causal Moment:**  
    - *Trigger:* A student who chose A in R1–R2 (so R3 predicts A) switches to B in R3. They score 4 points (B + pred A) but now have a "B" in their history.  
    - *Question:* "You got 4 points in R3—why not switch earlier? What changed for R4?"  
    - *Link:* "In R3, your B choice couldn’t alter the sealed A prediction (causal), but it *was* evidence the model used to predict B in R4 (evidential)."  
  - **Newcomb Connection:**  
    - "Choosing only A is like one-boxing: you ‘signal’ predictability for future high rewards. Choosing B is like two-boxing: you chase immediate extra points but train the predictor to ‘defect’."  

  **Predictable Failures & Fixes**  
  1. **Failure:** Students randomize choices to "fool" the predictor.  
     - *Fix:* "Calculate your average score if you flip coins. Is it higher than always choosing A?" (Spoiler: Always A = 15 pts; random ≈ 9–11 pts).  
  2. **Failure:** "The model is causal—my choice *causes* the next prediction!"  
     - *Fix:* "Can your R3 choice change the R3 prediction slip you’re holding? No? Then how does it affect R4?"  
  3. **Failure:** "This is luck—R1’s coin flip decides everything."  
     - *Fix:* "Check students with identical R1 predictions. Did they all end with similar scores? Why/why not?"  

  **Unreproducible Feature & Facilitator Note**  
  - **Gap:** The original Newcomb’s predictor is **infallible and timeless** (it knows your *disposition*, not just past actions). Our model is fallible and incremental.  
  - **Verbal Bridge:** "In the real Newcomb problem, the predictor isn’t just learning from your history—it *already knows* what you’ll choose today. Our model approximates this by making predictions before you act, but it’s only as good as your past data. The tension is identical: your choice now can’t change the prediction slip in your hand, but it screams evidence about future predictions."  

  ---

  ### JSON Summary

