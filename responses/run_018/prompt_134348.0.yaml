prompt: |-
  hey — i'm a novelist, mostly fiction with some essays on the side, and i've been roped into giving the opening remarks at a workshop next month. the title is something like "Belief Without Ontology" and the room will be half analytic philosophers of religion (some who actually knew Putnam's work) and half clergy and grad students and a few family members of the organizers who won't know a language-game from a hole in the ground. i want the speech to do real structural work, not just decorate.

  the idea i want to hang it on is Putnam's middle path about religious language: asking "does God exist" is treating it like failed science, but saying it's "just poetry" or "just feelings" misses that religious talk carries real obligations — he compared it to signing a promissory note, or entering a covenant, something you only understand from inside the practice of honoring it. i need the remarks to set ground rules so that after i sit down nobody can just fall back on "that's not empirically verifiable" or "that's purely subjective." the audience is mixed, it's about five minutes, and it needs to comfort the religious people without lying and to challenge the secular people without insulting them.

  i'd like you to write the actual speech. please don't invent quotes from Putnam — paraphrase without quotation marks if you need to reference him, and don't cite specific books or page numbers since i want this to stand on its own. also i'm tired and typing fast so if i spelled "covenant" wrong somewhere just ignore it, and definately don't make the speech sound like a lecture. make it sound like a novelist talking to a room.
