answer: |-
  ### Preparation Sheet: Seminar Q&A Defence  
  **Core Thesis:** Phenomenal judgments are reliable yet causally inert structural mappings within predictive hierarchies, resolving the paradox without causal efficacy or eliminativism.  

  ---

  ### Anticipated Objections & Defence Strategy  
  *(Ordered by combined likelihood and argumentative damage)*  

  #### **1. Objection (Neuroscientists): Coherence Constraints as Disguised Feedback Loops**  
  *"You describe cross-level error minimisation as non-causal, but isn’t this just neural feedback under a functionalist label? Hierarchical prediction errors *are* causal signals. If phenomenal states are merely represented in the model, their 'structural mapping' collapses into standard causal inference."*  
  **Reply:**  
  "Feedback loops operate causally *within* the generative model, but the mapping between phenomenal properties (as model contents) and second-order judgments arises from *model geometry*, not signal transmission. When a prediction error minimises divergence between levels (e.g., between interoceptive predictions and meta-representational priors), it alters the model’s *state*—not by causing phenomenal properties to act, but by reconfiguring relational structure. This is mathematically distinct from closed-loop causation: it’s Bayes-optimal model updating under global free-energy constraints."  
  **Weakness:**  
  Concede that the *implementation* relies on causal neural processes, but stress the *explanatory target* is the informational architecture, not substrate dynamics. Risk of being seen as semantic evasion.  

  #### **2. Objection (Physicalists): Epistemic Groundlessness**  
  *"If phenomenal properties play no causal role in judgment formation, why should structural mappings track them accurately? Your account seems to make introspective reliability a miraculous coincidence, inviting scepticism indistinguishable from eliminativism."*  
  **Reply:**  
  "Reliability emerges from the biological function of hierarchical models: misalignment between levels (e.g., raw feels and report mechanisms) generates costly prediction errors. Accuracy is enforced not by phenomenal causation, but by evolutionary pressure to minimise model-observation divergence *system-wide*. Crucially, the ‘tracking’ is not correspondence but *embeddedness*: phenomenal states aren’t detected; they *are* the model’s first-order representations, mapped by second-order nodes via shared statistical boundaries."  
  **Weakness:**  
  Heavily reliant on teleosemantics. May not satisfy those demanding internalist justification for self-knowledge.  

  #### **3. Objection (Philosophers of Science): Causal Exclusion via Explanatory Slippage**  
  *"By replacing 'causation' with 'structural constraints', you merely relabel the problem. Either coherence constraints reduce to physical causes (inviting exclusion arguments), or they’re non-causal but then lack explanatory force for why judgments *specifically* track phenomenality."*  
  **Reply:**  
  "Structural explanations operate at Marr’s computational level: they show how normative constraints (like global coherence) resolve paradoxes without overloading mechanisms. Crucially, the mapping isn’t *caused* by phenomenality but is *constituted* by the model’s topology—much as software functions map variables without hardware intermediation. This avoids exclusion by treating judgment not as an effect but an architectural feature."  
  **Weakness:**  
  May appear to conflate constitution with causation. Requires buy-in into computational pluralism.  

  #### **4. Objection (Neuroscientists/Reductionists): Implementation Vagueness**  
  *"Without specifying the neurocomputational implementation, your 'structural mapping' is a placeholder for reduction. If coherence is just Bayesian belief updating among neural populations, phenomenality adds nothing—judgments reduce to probabilistic inference over hidden states."*  
  **Reply:**  
  "Agreed that implementation matters, but the *explanatory gap* concerns how model dynamics account for subjective reports. I appeal to Markov blankets: phenomenal states are *causally screened* high-level variables, while judgments are active inferences about them. Crucially, reductivism fails because my account *preserves* phenomenality’s irreducibility (as model content) while explaining report reliability. Implementation details won’t erase this level distinction."  
  **Weakness:**  
  If pressed, must admit current PP frameworks lack consensus on encoding phenomenality.  

  ---

  ### **The Critical Objection: Implicit Causal Efficacy**  
  *(Highest damage; requires pre-emptive defence)*  
  **Objection (All Camps):**  
  *"You deny phenomenal properties causal roles, yet your 'structural mapping' requires them to *constrain* error signals. If they lack efficacy, how can they influence coherence? This either smuggles in causation or renders the mapping arbitrary. Without neural specifics, your mechanism is indistinguishable from property dualism."*  

  **Prepared Reply (2 mins):**  
  "Phenomenal properties don’t *constrain*; they *are constraints*. Within PP, first-order states (e.g., pain qualia) are fixed parameters in the generative model—like boundary conditions in physics. Second-order judgments minimise error *relative to these fixed points* via message-passing between hierarchical levels. No efficacy is implied: just as gravity’s 'influence' on spacetime is geometric, not causal, phenomenal states shape the model’s state-space topology. The mapping isn’t arbitrary because it’s evolutionarily hardwired: the brain *must* align meta-representations with first-order states to avoid fatal prediction failures (e.g., misrepresenting tissue damage)."  

  **Weakness & Concession:**  
  - **Where it’s weak:** Geometric analogies may seem metaphorical. Hardwiring risks teleological hand-waving.  
  - **Concede ground:** The account *does* require phenomenal states to have *formal* efficacy (as model variables), but this is distinct from *physical* efficacy. Their causal inertness remains intact.  
  - **Fatal if unchallenged:** If interlocutors reject the model-topology defence, the objection collapses into standard interactionist dualism.  

  ---

  ### Tactical Notes  
  1. **Prioritise:** Address the neuroscientists first (likeliest interrupters), then physicalists, saving causal exclusion for mid-Q&A.  
  2. **Defuse reductionism:** Stress that PP *demands* multiple explanatory levels—coherence constraints aren’t reducible to neural signalling.  
  3. **British English polish:** Use "whilst", "amongst", "conflate", "indistinguishable from", and "merely relabel" for disciplinary credibility.  
  4. **Exit strategy:** If pressed on implementation, commit to "ongoing collaboration with PP modellers" rather than overpromising.  

  **Final Caveat:** Your account’s Achilles’ heel is the *hard problem of structure*: why should geometric mappings *feel like anything*? Pre-empt by clarifying this seminar addresses *judgment*, not phenomenality’s ontology.
