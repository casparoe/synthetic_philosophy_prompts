  hey, i'm in the middle of writing a dissertaton chapter on utilitarian sexual ethics and i keep running into a weird tension in bentham's unpublished writings about paederasty. the standard reading is that he defends homosexual acts purely on harm-avoidance grounds—no victim, no crime. but if you actually apply his felicific calculus consistently, sexual pleasure looks like it should have diminishing marginal utility: the more intense or frequent the act, the lower the incremental pleasure per unit. that means bentham can't just be defending liberty in general; he'd be committed to some optimal distribution of sexual behavior that maximizes total pleasure, which probably rules out both strict monogamy (too restrictive, low variety) and extreme promiscuity (too intense, negative returns). so his argument for decriminalization stops being a liberal rights claim and becomes a weird optimization prescription. am i importing an economic model he never actually applied to sexuality? i feel like i'm missing something obvious, but none of the secondary literature addresses the diminishing-utility angle at all. also sorry for the typo in my outline: i wrote 'dissertaton' instead of dissertation lol
