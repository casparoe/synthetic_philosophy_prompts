  I should suggest dropping step (4) as it directly causes the extension problem. Steps (1) and (2) are core to Strawson's original argument and might be harder to challenge without abandoning the framework. Step (3) follows logically from them. By targeting (4), the user can keep (3) and avoid the self-defeat, as it stops the chain before it reaches collectives. This addresses their preference while resolving the paradox.

