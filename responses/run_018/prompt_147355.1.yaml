answer: |-
  Your novel cuts to the heart of a fascinating and deeply inconsistent tension in liberal legal systems. The selective criminalization you observe—targeting "morals offenses" like consensual adult incest or obscenity while legalizing harmful activities like gambling or private drug use (often regulated, not purely private)—doesn't map cleanly onto Hart *or* Devlin alone. It presupposes a messy, unstable blend of philosophical commitments:

  1.  **Modified Devlin ("Taboo Preservation"):** Society *does* claim a right to defend certain foundational taboos perceived as essential to its identity and stability, like prohibitions against incest or extreme public indecency. This isn't Devlin's full "immune system" (which included broader morality), but a narrower "core taboo defense." The justification often shifts towards vague "social fabric" arguments precisely because direct harm is hard to prove.

  2.  **Harm Principle Exceptions ("Disgust-as-Harm"):** This is where the inconsistency creeps in. By citing "public morality" as the *reason* for criminalization, the law implicitly treats the *mere knowledge* or *existence* of the act, or the *collective emotional reaction* (disgust/outrage), **itself as a cognizable harm** to society. This directly contradicts Hart's (and Mill's) core principle that offense/disgust alone isn't sufficient justification. It smuggles in the idea that collective psyche stability is a state interest justifying coercion, potentially overriding individual liberty even without tangible harm to others.

  3.  **Symbolic Legislation & Expressive Function:** Law isn't just utilitarian; it expresses societal values. Criminalizing incest (even rarely prosecuted consensual adult cases) sends a powerful symbolic message reinforcing a near-universal taboo, signaling what the community finds fundamentally abhorrent. Legalizing gambling/drugs, while regulating harm, signals a pragmatic acceptance of those vices, prioritizing harm reduction/individual choice over absolute moral condemnation. The commitment here is to law as a tool for *expressing core societal identity*, even when enforcement is impractical or inconsistent.

  4.  **Inertia, Historical Baggage, & Political Expediency:** Often overlooked, but crucial. Many "morals offenses" are archaic laws rooted in religious doctrine or Victorian sensibilities. Removing them requires political will to confront vocal moral minorities defending "tradition," even when the harm principle argument against them is strong. Conversely, legalizing gambling/drugs often follows *recognized failure* of prohibition, massive financial incentives (tax revenue), or powerful lobbying. The commitment here isn't philosophical purity, but **pragmatism, path dependence, and the power of entrenched interests vs. marginalized groups.**

  **The Disgust Question & Its Role:**
  The reliance on "public morality" absolutely suggests that **disgust is being treated as a proxy for moral wrongness and, by extension, societal harm.** This leans on the (contested) idea of "moral dumbfounding" – people *feel* incest (in your scenario) is deeply wrong even when they can't articulate tangible harm. The law codifies this intuition. However, this is philosophically shaky:

  *   **Is disgust reliable?** Sometimes (e.g., rotting food = disease risk). Often, no. Disgust responses are highly culturally variable (e.g., eating insects) and can be triggered by harmless differences (sexual practices, religious rituals). Equating disgust with moral wrongness risks enshrining prejudice and irrational aversion into law.
  *   **Collective Disgust as Harm?** This is the crux. If we define "harm" under Hart's principle to include psychological distress caused by knowing consensual private acts occur elsewhere, we open the floodgates. Almost *any* minority practice disliked by the majority could be criminalized (homosexuality historically, interracial marriage, etc.). Hart explicitly rejected this, arguing offense is the price of living in a free society. Treating collective disgust *itself* as the harm justifying criminalization **is fundamentally incompatible with a strict harm principle.** It prioritizes majoritarian comfort over individual liberty in the private sphere.

  **What Would Change My Mind?**

  1.  **Compelling Evidence Disgust is a Reliable Heuristic for *Specific* Hidden Harms:** If rigorous, cross-cultural research proved disgust towards *specific* acts like incest consistently correlated with identifiable, significant, previously overlooked harms (beyond genetic risks, which are mitigable and don't apply to all couples) – e.g., profound, unavoidable psychological damage inherent to the dynamic itself, or truly catastrophic societal collapse mechanisms triggered *only* by that specific taboo violation – it might justify its heuristic use *in that specific context*. However, the burden of proof is immense and likely insurmountable for purely consensual adult acts.
  2.  **Demonstrating Universal Foundational Taboos are Necessary for *Any* Society:** If anthropology/sociology proved that *all* stable human societies *must* prohibit a specific set of taboos (including adult incest) as foundational building blocks, and that violating these inevitably leads to societal disintegration *regardless of individual consent or harm*, Devlin's core argument gains significant empirical weight. Current evidence suggests taboos vary widely and societies adapt.

  **Where My Reasoning is Reaching/Likely to Fail:**

  1.  **Over-Intellectualizing Inconsistency:** My analysis might give too much credit to underlying philosophy and not enough to sheer historical accident, political cowardice, and the difficulty of repealing unenforced laws. The inconsistency might be less about deep commitments and more about legislative laziness and lack of political will to clean up statute books unless forced.
  2.  **Underestimating Symbolic Power:** I might downplay how potent the *expressive function* of law is in maintaining social cohesion around certain norms, even if philosophically unjustifiable. The perceived need for a society to declare "this is beyond the pale" might be a stronger driver than I acknowledge.
  3.  **Defining "Harm" Too Narrowly?** While I strongly resist equating disgust with harm, perhaps there are sophisticated arguments about the *erosion of social trust* or the *undermining of foundational kinship structures* caused by certain taboos being broken, even privately, that constitute a non-trivial, non-offense-based harm. The link from private act to this diffuse societal harm is incredibly difficult to prove and risks being speculative.
  4.  **The "Slippery Slope" Argument:** My rejection of disgust-as-harm relies heavily on the slippery slope to majoritarian tyranny. Critics might argue effective safeguards can exist, or that some taboos are so uniquely fundamental (like incest) that the slope isn't slippery *here*. This is debatable, but dismissing it entirely might be premature.

  **For Your Novel:** This inconsistency is *gold*. Your lawyer's struggle embodies the clash:
  *   **Hart's Torchbearer:** Argues passionately that without coercion, minors, or public acts, the state has no business here. Points to legalized gambling/drugs as proof of hypocrisy. "Where's the *real* harm?"
  *   **The Prosecutor/System (Modified Devlin + Disgust-as-Harm):** Argues society *must* defend this foundational boundary, that the very fabric unravels if such taboos are ignored, that the public revulsion *is* evidence of deep harm to the social organism. "Some lines cannot be crossed, even in private."
  *   **The Unspoken Truth:** It's about deep-seated taboo, historical inertia, and the law's role in expressing visceral societal boundaries, even when rational arguments fail. The tension is inherently dramatic because the philosophical foundations *are* messy and contradictory.

  This selective practice reveals liberal democracy's uncomfortable compromise: preaching individual liberty and the harm principle while clinging to enforced moral boundaries around select, deeply tabooed practices, justified by appeals to an amorphous "social fabric" that looks suspiciously like codified disgust. Good luck untangling it in your fiction – it's a profound real-world mess.
