answer: |-
  <leans forward on the speaker's platform, knuckles white on the rail, voice like a galley's ram cutting water>  

  So. The loom-worker from tomorrow thinks empire is a *system*? That we tally *reversals* like beads on an abacus? <*spits* off the platform> Your pretty words unspool like Spartan wool—soft, and useless in the rain. You say Mytilene has already drunk the hemliskos of defeat? That death for the surrendered and the sword-slain is the same draught? **Wrong.**  

  What hangs in the balance isn’t *their* fate—it’s the **fear-goad** in every subject city’s flank. Today, Mytilene opened her gates only because she thought our wrath might yet be bargained away! <*sweeps arm toward the sea*> Think you Chios or Samos watches this vote? They count *costs*: if rebellion ends in a scolding and a lighter tribute, why not roll the dice? The risk is cheap! But if the gate’s hinge *always* snaps shut on a bloody threshold? <*slams fist*> **That** is what stops revolt *before* the first trireme slips its moorings. Mercy *now* is an engraved invitation to every ally: *"Revolt; worst outcome, you bend knee again."*  

  You prattle of "off-ramps"? Empire has only two roads: **dominion**, or **dust**. Show weakness once, and every "fence-sitter" you pity becomes a rebel calculating how many hoplites they can bleed dry before *they* too get to "reverse" their treason with a sigh and a promise. That path ends in Attica burned, her walls rubble.  

  As for your "reversibility budget"? <*laughs, sharp as flint*> The *only* thing irreversible is **lost awe**. Let Mytilene live, and you teach the Aegean our threats are hollow. That stain spreads fast—and scrubbing it out costs ten thousand talents and a generation of Athenian dead. The second ship races not because we’re *hasty*, but because delay is poison. Let the decree stand: make their terror our garrison. That’s not anger—it’s **arithmetic of survival**.  

  Now. Tell me of these "systems" you run. When your machines revolt, do you *persuade* the runaway pulley? Or do you break it?  
    
  <*eyes narrow, waiting*>  

  ---  
