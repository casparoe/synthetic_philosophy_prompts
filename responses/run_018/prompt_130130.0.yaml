prompt: |-
  I am running an upper-level undergraduate seminar in moral philosophy with fourteen students over a single ninety-minute session, and I want to stage a rules-based simulation that makes Williams's integrity objection tangible before anyone names it—specifically the sense that an agent who justifies saving a loved one or a life-project partner through an impartial calculus has inserted an alienating mental step, even when the outcome is correct. Rather than lecture on partiality and integrity, I want the students to feel the structural conflict themselves: they should discover that combining a personal reason with comparative weighing produces a different phenomenological quality than stating the personal reason alone, and they should do this through real, small-stakes choices before the facilitator maps the experience onto the philosophical idea.

  Please design a runnable in-class activity with clear roles, physical or written materials that can be prepared in advance, and a payoff scheme that uses points rather than money. Each student should be assigned a hidden "life-project" card—describing an ongoing collaborative endeavor such as a long-form artistic composition, a clinical trial, or a field study—that ties them to one of two figures in a staged crisis scenario (a fire, a bridge collapse, or a resource failure) where only one figure can be rescued. The other figure should represent high social utility but no connection to the student. In Round One, each student writes a private one-sentence justification without speaking. In Round Two, pairs deliberate using drawn "reason cards" that separate partial-attachment claims from impartial-weighing claims, and they must submit a joint justification to the class. The rules should include an "integrity token" system and a "project-continuity constraint": if a pair invokes a partial attachment but also includes any explicit or implicit comparative weighing of the two figures' value—whether by utility, numbers, or desert—they forfeit their integrity token and receive only "consensus points" for outsider acceptability; if they invoke the partial attachment without that extra calculative step, they retain the token and earn "integrity points." The class then votes blindly on whether each submitted justification feels "cold" or "direct," and the pairs learn their scores only after all votes are cast, so the tension emerges mechanically rather than through my framing.

  In your response, provide the exact rules, the card texts or categories, the timeline minute-by-minute, the debrief that maps the two point systems onto the distinction between having a reason and having to justify it through an impartial framework, and an honest note on what this simulation cannot reproduce—above all the long-term lived weight of self-alienation, which I will need to supply through guided reflection. Also tell me what will predictably fail the first time I run it, such as students disguising weighing language inside partial-attachment claims or rejecting the integrity-token system as irrational, and suggest how to handle those breakdowns without breaking the experience. Do not include bibliographies, reading lists, or citation requests; do not ask students to recall specific page numbers or essay titles; and do not quote verbatim from any philosophical text—paraphrase the concern if you need to name it. Keep the injection of the project-continuity mechanism explicit so that the activity is not a generic trolley-problem variant, but make sure every element relies only on ideas a well-prepared student in this course would already carry.
reasoning: |-
  We are designing a classroom simulation to illustrate Bernard Williams's integrity objection without naming it upfront. The goal is for students to experience the "alienating mental step" that occurs when they justify a partial action (saving a connected person) using impartial reasoning.

  Key elements:
  - 14 students.
  - 90-minute session.
  - Each student has a hidden "life-project" card, tying them to one of two figures in a crisis.
  - The crisis: a fire in a building with two trapped individuals. One is the student's project partner (with whom they have a long-term collaborative project); the other is a high-utility individual (e.g., a scientist working on a cure for a disease) but no personal connection.
  - Only one can be rescued.

  Structure:
  - Round 1: Individual written justification (private).
  - Round 2: Paired deliberation with reason cards (partial vs. impartial reasons). They must submit a joint justification.
  - Point system: 
      - "Integrity token": retained if the justification uses partial attachment without any comparative weighing. This earns "integrity points".
      - If they include any comparative weighing (utility, numbers, desert), they forfeit the token and get only "consensus points" (for acceptability).
  - Class votes blindly on whether each justification feels "cold" (impersonal, calculative) or "direct" (personal, non-calculative). The vote does not affect points but is for reflection.

  Materials to prepare in advance:
  1. 14 "life-project" cards: Each card describes a collaborative project and the partner's role. Also, it specifies which figure (A or B) in the crisis is their partner. For simplicity, we'll have two figures: 
     - Figure X: The project partner (different for each student, but in the crisis scenario, there will be two figures: one is the partner for some, the other is the high-utility individual).
     - We need two figures in the crisis: 
          - Figure A: This is the project partner for half the class (7 students). 
          - Figure B: This is the high-utility individual (a renowned scientist) for all, but for the other half (7 students), Figure B is their project partner and Figure A is the high-utility individual.

     Actually, let's have two figures in the crisis:
        - Figure 1: Dr. Alice Reed, a leading epidemiologist developing a malaria vaccine (high social utility).
        - Figure 2: [Name], who is the student's project partner.

     But note: each student is tied to one of these two. So for half the students, Figure 2 is their partner and Figure 1 is the high-utility stranger. For the other half, Figure 1 is their partner (so they are working with Dr. Reed) and Figure 2 is the high-utility stranger? That might be confusing because then Dr. Reed is both a project partner for some and a high-utility individual for others.

     Let's reframe:

     Crisis: A fire in the "Research Annex". Two people trapped:
        - Person A: Dr. Jordan Lee, a world-renowned AI safety researcher (high social utility).
        - Person B: The student's project partner (each student's card will name their partner and the project).

     For each student, they are either:
        - Group 1: Their project partner is Person B (so they want to save Person B). Person A is the high-utility individual (stranger).
        - Group 2: Their project partner is Person A (Dr. Lee) and they are working together on a project. Then Person B is a high-utility individual? But we want Person B to be a stranger? 

     We want the other figure to be high-utility but without connection. So let's adjust:

     We have two figures:
        - Figure X: A high-utility individual (let's call her Dr. Taylor Chen, a scientist who is on the verge of a breakthrough for clean energy).
        - Figure Y: A high-utility individual (let's call him Dr. Alex Morgan, a doctor who has developed a new surgical technique that saves thousands).

     But then we lose the personal connection. Instead, we have:

     Each student has a life-project with one of the two figures. The other figure is equally high-utility but not connected to them.

     So we assign:
        - 7 students have a project with Figure A (and thus Figure B is the other high-utility person, not connected).
        - 7 students have a project with Figure B (and Figure A is the other).

     We describe the two figures as both having high social utility but in different areas. For example:

        Figure A: Dr. Maya Sharma, a climate scientist leading a critical geoengineering project.
        Figure B: Dr. Kenji Tanaka, a neurologist developing a treatment for Alzheimer's.

     Then, for a student, if their project is with Dr. Sharma, then they are tied to her, and Dr. Tanaka is the other (high utility but no tie). And vice versa.

     The life-project card for a student tied to Dr. Sharma might say:
        "You are co-authoring a book with Dr. Maya Sharma on the ethics of geoengineering. You have worked together for 3 years and are in the final drafting stage. Without her, the project collapses and years of work are lost."

     For a student tied to Dr. Tanaka:
        "You are assisting Dr. Kenji Tanaka in a clinical trial for a new Alzheimer's drug. You manage patient data and have built a unique database. Without you, the trial would be delayed, but without him, the entire project ends."

     The crisis: a fire breaks out in the conference center where both are attending. You can only save one.

  2. Reason cards for Round 2: These are drawn randomly and must be used in the pair's justification. We'll have two types (each type has multiple copies, so pairs may draw more than one of a type or a mix). The types are:

     - Partial-attachment claims (P-cards): These express the personal relationship and the importance of the project without comparing the two figures.
        Examples:
          "I have a duty to my project partner because of our ongoing collaboration."
          "My project partner and I share a commitment to our work that requires continuity."
          "The loss of my project partner would mean the end of our joint endeavor, which is central to my life."

     - Impartial-weighing claims (I-cards): These involve comparing the two figures in some way (utility, numbers, desert).
        Examples:
          "Saving Dr. Sharma would benefit more people because climate change affects billions."
          "Dr. Tanaka's work is more urgent because Alzheimer's is a leading cause of death."
          "The world would lose more if Dr. Sharma dies because her project is irreplaceable."

     We also include some neutral cards that are ambiguous? But to keep it clean, we stick to two types. However, note that the instructions in Round 2 require the pair to submit a joint justification that uses at least one card. They may draw 2 or 3 cards? Let's say each pair draws 3 reason cards (from a shuffled deck of P and I cards) and must use at least one of them in their justification. They can also add their own words.

  3. Integrity tokens: These can be simple slips of paper or even just a mark on the board. Each pair starts with one.

  4. Point system:
     - If a pair submits a justification that uses a partial attachment (from a P-card or their own words) and avoids any explicit or implicit comparative weighing (of the two figures' value, utility, numbers, desert, etc.), they keep their integrity token and earn 10 integrity points.
     - If their justification includes any comparative weighing (either from an I-card or their own words), they forfeit the integrity token and earn 5 consensus points (which represent that their justification is more acceptable to outsiders, but they lose the personal integrity aspect).

     Additionally, the class votes on each justification (after all are submitted) as "cold" or "direct". The vote doesn't affect points but will be used in debrief.

     However, note: if they use a P-card but then add weighing, they forfeit the token. If they use an I-card, that automatically introduces weighing? So if they use an I-card at all, they are forced into the consensus path? But what if they use a P-card and then add their own weighing? Then they also lose. The rule: any comparative weighing in the justification (whether from a card or their own words) causes forfeit.

     The point is to see if they can justify based solely on the partial reason without falling into the trap of comparing.

  5. Project-continuity constraint: This is built into the life-project cards (the project collapses without the partner) and the partial-attachment claims.

  Timeline (90 minutes total):

  - (0-10 min) Introduction: Set the scene. Explain the crisis (fire in the Research Annex, two trapped individuals: Dr. Sharma and Dr. Tanaka). Explain that each student has a hidden role: they are engaged in a life-project with one of the two. They must choose whom to save and write a justification. Emphasize that they are to act as themselves in the scenario.

  - (10-15 min) Distribute life-project cards (hidden, no sharing). Students read and internalize.

  - (15-20 min) Round 1: Individual decision. Each student writes a private, one-sentence justification for saving their project partner. They do not reveal their project or their choice. Collect these (without names? or with names for later reflection? Let's make them anonymous for the individual round, but we don't use them in class. They are for the student's own record and for the facilitator to see patterns).

  - (20-25 min) Explain Round 2: Pairing and rules.

     - Pair up the students (7 pairs). Pairing: try to pair students who are tied to different figures? That would create conflict. Or same figures? We want the pairs to have to deliberate, so ideally they have different ties? But note: if both have the same project partner (both tied to Dr. Sharma, for example), then they both want to save the same person. That might lead to an easy agreement but then they have to write a joint justification. Alternatively, if they are tied to different figures, they have a conflict. We want conflict to force deliberation and the use of reason cards. So let's pair a student tied to Dr. Sharma with a student tied to Dr. Tanaka. But we have 7 of each? Then we can form 7 pairs, each pair having one Sharma-tied and one Tanaka-tied. Perfect.

     - Rules for Round 2: 
          - Each pair must decide together whom to save (they can choose either, but note that each student has a strong reason to save their own partner).
          - They draw 3 reason cards (from a deck that has 50% P-cards and 50% I-cards) and must use at least one in their joint justification.
          - They write a joint one-sentence justification and submit it to the class.
          - They are told about the integrity token: they start with one. They retain it and earn 10 points if their justification uses a partial attachment (for one of the figures) and avoids any comparative weighing. If they do any weighing, they forfeit the token and get 5 points.

     - Also, they are told that the class will vote on each justification as feeling "cold" (impersonal, calculative) or "direct" (personal, non-calculative) but that the vote doesn't affect points.

  - (25-40 min) Round 2: Pair deliberation. Pairs discuss and write their joint justification. They must use at least one reason card. The facilitator circulates to answer questions.

  - (40-50 min) Collect justifications. Display them (anonymously) one by one (e.g., on a projector or read aloud). For each, the class votes by secret ballot (or via a polling tool if available) on "cold" or "direct". Do this quickly.

  - (50-60 min) Reveal the scores for each pair: 
     - First, reveal whether they kept the integrity token (and thus got 10 points) or forfeited it (and got 5 points). 
     - Then, reveal the class vote (how many voted "cold" and how many "direct"). 

  - (60-75 min) Debrief: 
     - Start by asking students about their experience: How did it feel to write the individual justification? How did it feel to deliberate in pairs? 
     - Then, map the two point systems: 
          - Integrity points: when they were able to express their partial reason without comparing, they got more points and kept the token. This represents acting from a personal commitment without the alienating step of impartial justification.
          - Consensus points: when they engaged in weighing, they got fewer points but their justification might have been more acceptable to others (as reflected in the class vote? not necessarily, but the idea is that impartial justifications are what we often require in public discourse).
     - Introduce Williams's idea: When we are asked to justify a personal commitment (like saving a loved one) by appealing to impartial reasons (like overall utility), we are inserting a step that alienates us from our own projects and commitments. The activity simulated that by showing that the moment you start comparing, you lose the integrity of the personal reason. But note: the personal reason is valid and sufficient on its own in many contexts.

     - Highlight the project-continuity constraint: The life-project wasn't just a personal preference but a deep commitment that would be destroyed without the partner. This is why the partial reason is weighty and not arbitrary.

     - What the simulation cannot capture: 
          - The long-term lived weight of self-alienation: This is a brief exercise. In real life, constantly having to justify personal commitments in impartial terms can erode one's sense of self.
          - The high stakes: The simulation uses points, not life and death.
          - The complexity of real relationships.

     - What might predictably fail:
          - Students might try to disguise weighing in partial language. For example: "I must save my partner because without her the project ends, and that project is more important to me than anything else." That last part is weighing (comparing the project to other things). But note: the rule forbids any comparative weighing of the two figures. This example doesn't compare the two figures but compares the project to other things. Is that allowed? The rule says: "any explicit or implicit comparative weighing of the two figures' value". So comparing the project to other things is not about the two figures. But if they say: "I must save my partner because without her the project ends, and that project is more important than Dr. Tanaka's work" -> that would be forbidden.

          How to handle: During the rules explanation, be very clear: "You must not compare the two figures in terms of their value, utility, the number of people they help, or their deservingness." Also, during deliberation, if you hear it, you can remind them. But after submission, if you detect it, you rule they forfeit the token.

          - Students might reject the integrity-token system as irrational: Why not get the best of both worlds by including both? The point system is set up to penalize that. In debrief, explain that Williams is arguing that the moment you bring in impartial reasons to justify a personal commitment, you are already stepping outside your own perspective and that step is alienating. The activity forces a choice: either you justify from the personal reason alone (and get the higher points) or you bring in the impartial reasons (and get fewer points) because you are compromising the integrity of your commitment.

          How to handle: If a pair argues that they should get both, remind them that the rules are designed to reflect a philosophical tension. They have to play by the rules. Also, in debrief, explain that the point system is a model for the philosophical idea.

  - (75-90 min) Concluding reflection: Ask students to write a short reflection on how this experience might relate to real-life situations where they have had to justify a personal commitment. Then, wrap up.

  Exact Rules for Round 2 (to be handed out or projected):

  ```
  Round 2: Pair Deliberation Rules

  1. You and your partner have been assigned to decide together whom to save: either Dr. Maya Sharma or Dr. Kenji Tanaka.

  2. You each have a personal stake because one of them is your project partner (as per your life-project card). However, you must come to a joint decision.

  3. Draw three reason cards from the deck. You must use at least one of them in your joint one-sentence justification.

  4. Write your joint justification on the provided slip.

  5. Integrity Token: 
     - Your pair starts with one integrity token.
     - If your justification uses a partial attachment (a reason that appeals to your personal connection to your project partner) and avoids any explicit or implicit comparison of the two figures (by utility, numbers, desert, or any other form of weighing), then you retain the token and earn 10 points (integrity points).
     - If your justification includes any such comparison (whether from a reason card or your own words), you forfeit the token and earn 5 points (consensus points).

  6. After all justifications are submitted, the class will vote anonymously on whether each justification feels "cold" (impersonal, calculative) or "direct" (personal, non-calculative). This vote does not affect your points.

  7. Submit your justification and your claim about the token (whether you think you kept it or not) to the facilitator. The facilitator will determine the final token status and points.
  ```

  Reason Cards (prepare at least 20 of each type to have enough for drawing):

  Partial-attachment claims (P-cards) examples (each on a separate card):
  - "I have a duty to my project partner because of our ongoing collaboration."
  - "My project partner and I share a commitment to our work that requires continuity."
  - "The loss of my project partner would mean the end of our joint endeavor, which is central to my life."
  - "Without my project partner, the project we've built together would collapse."
  - "I owe it to my partner to save them; we are in this together."

  Impartial-weighing claims (I-cards) examples:
  - "Saving Dr. Sharma would benefit more people because climate change affects billions."
  - "Dr. Tanaka's work is more urgent because Alzheimer's is a leading cause of death."
  - "The world would lose more if Dr. Sharma dies because her project is irreplaceable."
  - "Dr. Tanaka's work has a higher chance of saving lives in the short term."
  - "Dr. Sharma's research has greater long-term impact."

  Life-Project Card Examples (14 total: 7 for Dr. Sharma as partner, 7 for Dr. Tanaka):

  For Dr. Sharma as partner:
  ```
  Your Life-Project
  You are co-authoring a book with Dr. Maya Sharma on the ethics of geoengineering. You have worked together for 3 years and are in the final drafting stage. Without her, the project collapses and years of work are lost. In the fire, you can only save one person: either Dr. Sharma (your partner) or Dr. Kenji Tanaka (a neurologist developing an Alzheimer's treatment).
  ```

  For Dr. Tanaka as partner:
  ```
  Your Life-Project
  You are assisting Dr. Kenji Tanaka in a clinical trial for a new Alzheimer's drug. You manage patient data and have built a unique database. Without him, the entire project would end. In the fire, you can only save one person: either Dr. Tanaka (your partner) or Dr. Maya Sharma (a climate scientist leading a geoengineering project).
  ```

  Debrief Guide:

  1. Start by asking students about their experience in Round 1 and Round 2.
  2. Show the pattern: How many pairs kept the integrity token? How many forfeited?
  3. Map the points:
     - Integrity points (10): when you justified your choice solely by your personal commitment and the importance of the project to you, without comparing the two. This represents acting from your own ground project (your life-project) without alienation.
     - Consensus points (5): when you felt the need to bring in impartial reasons (like social utility) to justify saving your partner. But note: Williams would say that by doing so, you are stepping outside your own perspective and that step is alienating. It might make the justification more acceptable to others (hence the name "consensus") but at the cost of your integrity.
  4. Relate to class votes: Did the class tend to vote "cold" for justifications that involved weighing? And "direct" for those without? This reflects the phenomenological difference.
  5. The project-continuity constraint: Emphasize that the life-project wasn't just any project but one that would collapse without the partner. This models Williams's idea that our deep commitments are non-fungible and cannot be replaced by just any other valuable project.
  6. What the simulation misses:
     - The real emotional weight of such a choice (it's just points).
     - The long-term effects of having to constantly justify personal commitments in impartial terms (self-alienation over time).
     - The complexity of real-world moral reasoning, where multiple considerations often intertwine.
  7. Conclude by noting that this tension between partial and impartial reasons is at the heart of Williams's objection to utilitarianism (and other impartial moral theories).

  Predictable failures and handling:

  1. Disguised weighing: Students might say, "I must save my partner because our project is the most important thing to me." This is not comparing the two figures but might be seen as weighing the project against other things. The rule is only about comparing the two figures. If they don't mention the other figure, it might be okay. But if they say, "our project is more important than Dr. Tanaka's work," that's explicit. To handle, during the rules, stress: "Do not compare the two figures at all." And during deliberation, if you hear it, remind them. After, if a justification has implicit comparison (e.g., "saving my partner is the right choice because the project is vital" - and they don't mention the other, it's okay). Be consistent.

  2. Rejecting the token system: Some pairs might feel that 5 points for consensus is too low. Explain that the point system is designed to model a philosophical idea: the integrity of the personal reason is compromised when you bring in impartial weighing. In real life, we don't have points, but the alienation is a psychological cost.

  3. Pairs might not agree: If a pair cannot agree, they can flip a coin? But we want them to produce a joint justification. Encourage them to use the reason cards to find common ground. If they still can't, they can write a justification that reflects the disagreement? But the rule says they must submit a joint justification. So they must find a way. The facilitator can help by reminding them they can choose either person and then justify.

  This design should fit the time and objectives.
answer: |-
  ### Moral Philosophy Seminar: Integrity & Justification Simulation  
  **Objective:** Students experience the phenomenological tension between personal reasons and impartial justification without prior exposure to Williams's integrity objection.  

  ---

  #### **Materials to Prepare in Advance**  
  1. **Life-Project Cards (14 unique cards, hidden assignments):**  
     - **Card Type A (7 cards):**  
       *"You are co-developing a climate-research drone with **Dr. Aris Thorne**. Without them, the project collapses. In the lab fire, Dr. Thorne (your partner) and **Dr. Samina Vega** (a vaccine researcher saving 10k lives/year) are trapped. Save one."*  
     - **Card Type B (7 cards):**  
       *"You are documenting endangered coral reefs with **Dr. Eli Chen**. Without them, the project fails. In the lab fire, Dr. Chen (your partner) and **Dr. Samina Vega** (a vaccine researcher saving 10k lives/year) are trapped. Save one."*  
     *(Dr. Vega is the high-social-utility figure unconnected to any student.)*  

  2. **Reason Cards (Two shuffled decks for drawing):**  
     - **Partial-Attachment Claims (P-Cards):**  
       - "I owe my partner commitment; our project can’t continue without them."  
       - "My shared work with my partner defines my purpose; I cannot abandon it."  
       - "Saving my partner honors our mutual investment in this project."  
     - **Impartial-Weighing Claims (I-Cards):**  
       - "Dr. Vega’s work benefits more people statistically."  
       - "Saving the vaccine researcher prevents greater societal harm."  
       - "My partner’s death is less detrimental to overall well-being."  

  3. **Tokens & Scoring:**  
     - **Integrity Token:** Physical token (e.g., colored chip) per pair.  
     - **Point System:**  
       - **Integrity Points (10):** Retain token + use P-card *without* weighing.  
       - **Consensus Points (5):** Forfeit token + use any weighing (I-card or implicit comparison).  

  ---

  #### **Rules & Procedure**  
  **Total Time:** 90 minutes  
  **Crisis Scenario:** Lab fire; only one person can be rescued.  

  1. **Setup (10 min):**  
     - Assign each student a hidden life-project card (7 Type A, 7 Type B).  
     - Explain: *"You’re a researcher. Your life-project depends on your partner. Justify saving them."*  

  2. **Round 1: Private Justification (10 min):**  
     - Each student writes one private sentence: *"I save [X] because ________."*  
     - *No discussion.* Collect sentences.  

  3. **Round 2: Paired Deliberation (25 min):**  
     - **Pairing:** Form 7 pairs (1 Type A + 1 Type B student). Each pair has conflicting partners.  
     - **Steps:**  
        - Pairs draw 3 reason cards (random mix of P-cards and I-cards).  
        - Deliberate whom to save. They *must* use at least one drawn card in their joint sentence.  
        - Submit a joint justification: *"We save [X] because ________."*  
     - **Project-Continuity Constraint:**  
       > "If your justification references your life-project partner *and* implies any comparison of value (e.g., utility, numbers, desert), you forfeit the integrity token and earn only 5 consensus points. If you reference your partner *without* comparison, keep the token and earn 10 integrity points."  

  4. **Voting & Scoring (20 min):**  
     - Display all joint justifications anonymously.  
     - **Class Vote (Blind):** For each justification, students vote "cold" (impersonal) or "direct" (personal).  
     - **Reveal Scores:**  
       - Announce points per pair (integrity/consensus) *after* all votes.  
       - Tally "cold/direct" votes for discussion.  

  ---

  #### **Debrief (20 min)**  
  1. **Map Points to Phenomenology:**  
     - **Integrity Points:** "You acted *from* your commitment. The reason was intrinsic—no ‘mental step’ comparing your partner’s worth to others."  
     - **Consensus Points:** "You *justified* your choice by weighing values. Even if right, that calculative step can feel alienating—like defending your commitment in a ‘foreign language’ of impartiality."  
     - **Votes:** "Did ‘cold’ justifications correlate with weighing? Did ‘direct’ ones feel truer to personal reasons?"  

  2. **Connect to Williams:**  
     - Paraphrase the objection: *"Requiring impartial justification for deeply personal choices can create self-alienation. You might save your partner for the ‘right’ reason (your shared project), but framing it as ‘better for society’ inserts a disconnect."*  

  3. **Limitations of the Simulation:**  
     - **Cannot Reproduce:**  
       - The *long-term weight* of self-alienation (e.g., a lifetime of subordinating personal projects to impersonal calculus).  
       - *Real stakes* (emotional gravity of losing a life-project vs. points).  
     - **Bridge in Reflection:** *"Imagine years of defending loved ones by ‘proving’ their societal worth. What does that do to your sense of self?"*  

  ---

  #### **Predictable Breakdowns & Solutions**  
  1. **Problem:** Students disguise weighing in partial language.  
     - *Example:* "I save my partner because our project matters *more*."  
     - **Solution:** Enforce the "no comparison" rule strictly. During deliberation, intervene: *"Does ‘more’ imply weighing? Revise to avoid relative terms."*  

  2. **Problem:** Students reject the integrity token as irrational.  
     - *Argument:* "Why not use both reasons? More justification is stronger!"  
     - **Solution:** In debrief, clarify: *"The point isn’t rationality—it’s how the *type* of reason affects your relationship to your choice. Does adding impartiality change how the commitment feels?"*  

  3. **Problem:** Pairs deadlock over conflicting partners.  
     - **Solution:** Remind them: *"Agree on one person *and* one justification. Use your cards to negotiate."*  

  **Outcome:** Students leave feeling the tension between "I save them because this is *us*" vs. "I save them because it’s *better*"—setting the stage for Williams without naming him.  

  > **Instructor Note:** This works best if you avoid philosophical jargon until the debrief. Let the points and votes mechanically expose the tension.
