prompt: |-
  I'm the director of a clinical psychology residency and every quarter I have to write these character evaluations for the accrediting body — they want ratings on compassion, integrity, practical wisdom, that kind of thing. The problem is I'm actually convinced by both virtue ethics and the situationist critique, which puts me in a weird spot. If character is just stable dispositions then I should rate residents on whether they consistently act well, but if the situationists are right then behavior mostly tracks context not traits, so my ratings are basically astrology unless I control for pressure and setting. I need a reusable procedure I can run in about thirty minutes per resident that doesn't collapse into a gut-feeling form.

  Can you turn virtue ethics — specifically the idea that virtues are dispositions to feel, reason, and act correctly across a range of situations, not just habits — into an operational checklist for me? It needs to specify what counts as evidence for a virtue versus just lucky behavior, how to weight situational pressure (high-stress crisis vs routine rotation), and where the procedure has to stop and admit it's a values judgment rather than a measurement so I don't recieve false precision. Include three worked cases: a resident who was rude to a patient during a double shift but usually kind; one who was exemplary in easy rotations but collapsed in crisis; and one ambiguous case where the procedure gives an answer I probably won't like. Also flag the points where I'm just dressing up judgment calls as steps, and say what the procedure absolutely cannot do — like predicting future behavior or replacing a real conversation. Don't give me bibliographies or citations; I already know the debate and can't search them. I just need something I can apply repeatedly without pretending psychology doesn't exist.
reasoning: |-
  Okay, let's tackle this request. The user is a clinical psychology residency director who needs to write character evaluations for accreditation. They're stuck between virtue ethics and situationist critique. Their main challenge is creating a reliable, efficient method that doesn't ignore psychological realities.

  First, I need to understand their core conflict. Virtue ethics sees character as stable dispositions, while situationism argues behavior is context-dependent. The user wants a practical tool that bridges these views without pretending to be more objective than it is. They specifically asked for a 30-minute per resident procedure that avoids gut feelings and acknowledges its own limitations.

  The key requirements are:
  - Operational definition of virtues as dispositional (feeling, reasoning, acting)
  - Distinguishing evidence of virtue vs. lucky behavior
  - Weighting situational pressure
  - Explicitly marking where judgment calls happen
  - Including three case examples
  - Clarifying what the procedure can't do

  For the framework, I'll structure it around three evidence tiers: Affective (emotional responses), Cognitive (reasoning processes), Behavioral (actions). Each virtue assessment should examine these across multiple contexts. Situational weighting is crucial - high-pressure moments reveal more than routine ones.

  The procedure must include:
  1) Explicit admission points where judgment is unavoidable
  2) Clear "can't do" disclaimers (e.g., no future predictions)
  3) Worked examples showing how it handles ambiguous cases

  For the cases:
  - The rude-but-usually-kind resident tests consistency under stress
  - The exemplary-in-easy-rotations-but-collapses-in-crisis case probes resilience
  - The ambiguous case should demonstrate where the method produces uncomfortable but defensible conclusions

  Important pitfalls to flag:
  - The fundamental attribution error
  - Confirmation bias in evaluation
  - The necessity of qualitative judgment despite the structured format

  The output should be immediately usable - no citations, just actionable steps. Emphasize that this systematizes reflection rather than eliminating subjectivity. Stress that it complements but doesn't replace conversations with residents.

  Finally, the tone must balance academic rigor with practicality - this is for a time-pressed professional who knows the theory but needs implementation help.
answer: |-
  Here’s a procedural framework for virtue-based evaluations that respects both dispositional traits and situational variability, designed for efficiency and transparency. The core principle: **Virtues are evidenced by *patterns* of affect, cognition, and behavior *across contexts*, weighted by situational pressure.**  

  **Procedure Structure (25-30 mins/resident):**  
  1. **Context Mapping (5 mins):**  
     - List 3-5 key observed situations per resident (e.g., "handling suicidal patient," "peer conflict," "charting under time pressure").  
     - *Tag each situation:*  
       - **Pressure Level:** Low (routine), Medium (complex but stable), High (crisis/uncertainty/fatigue).  
       - **Familiarity:** Novel vs. practiced context.  
     - *Admission Point:* This selection is inherently subjective. Flag if situational sample is skewed (e.g., only low-pressure observations).  

  2. **Tripartite Evidence Scan (15 mins):**  
     For each target virtue (e.g., compassion, integrity), scan for:  
     - **Affect:** *Appropriate emotion?* (e.g., Compassion: distress at suffering *without* overwhelming anxiety; Integrity: discomfort at ethical shortcuts).  
       - *Evidence Tip:* Self-reports (supervision), observed facial/postural cues (only if unambiguous), collateral reports.  
     - **Cognition:** *Sound reasoning?* (e.g., Practical Wisdom: weighs patient needs/system constraints; Integrity: cites ethical principles, not just rules).  
       - *Evidence Tip:* Case presentations, supervision Q&A, documented decision rationales.  
     - **Behavior:** *Action aligned with virtue?* (e.g., Compassion: active listening despite time crunch; Integrity: admits errors).  
       - *Evidence Tip:* Direct observation, patient feedback, chart notes.  
     - *Weighting:*  
       - High-pressure/novel situations count **3x** (reveals dispositional strength).  
       - Medium-pressure: **2x**.  
       - Low-pressure/familiar: **1x** (baseline competence).  
     - *Red Flag:* Single instances (especially low-pressure) are **never sufficient evidence**. Require 2+ data points per weighted category.  

  3. **Disposition vs. Luck Judgment (5 mins):**  
     - **Virtue Present:** Consistent (Affect + Cognition + Behavior) across **≥2 pressure levels**, OR exemplary in **≥2 high-pressure situations**.  
     - **Virtue Absent/Weak:** Inconsistency (e.g., correct behavior without matching affect/cognition), OR failure in **≥2 medium/high-pressure situations** where virtue was required.  
     - **Indeterminate:** Isolated good/bad acts, or only low-pressure evidence. *Admit uncertainty here*.  
     - *Admission Point:* "Consistency" threshold is a value judgment (default: ≥70% aligned instances across weighted evidence).  

  4. **Limits Declaration (Pre-populated):**  
     - *"This assessment:  
       (a) Cannot predict future behavior in novel extreme situations,  
       (b) Does not replace direct feedback conversations,  
       (c) Reflects observed patterns weighted by context, not fixed traits,  
       (d) May be skewed by unobserved situational factors."*  

  ---

  **Worked Cases:**  

  **Case 1: "Usually Kind, Rude During Double Shift"**  
  - **Contexts:**  
    - Routine intake (Low pressure) x 3: Kind, attentive.  
    - Family conflict meeting (Medium) x 1: Calm, diplomatic.  
    - Double-shift, agitated dementia patient (High) x 1: Curt, dismissive tone.  
  - **Compassion Scan:**  
    - *Affect:* Routine/Medium: Concern observed. High: Frustration (self-reported).  
    - *Cognition:* Routine/Medium: Patient-centered reasoning. High: Focused on task completion.  
    - *Behavior:* Routine/Medium: Appropriate. High: Rude.  
  - **Weighted Judgment:**  
    - High-pressure failure (1 instance) vs. multiple low/medium successes.  
    - **Verdict:** Compassion **Present** (inconsistency isolated to extreme fatigue; note: "Monitor under sustained stress").  

  **Case 2: "Exemplary in Easy Rotations, Collapsed in Crisis"**  
  - **Contexts:**  
    - Routine therapy (Low) x 4: Excellent rapport, ethics.  
    - Complex differential diagnosis (Medium) x 2: Thorough, collaborative.  
    - Code Blue (High) x 1: Frozen, deferred decisions.  
    - Hostile family meeting (High) x 1: Defensive, blamed team.  
  - **Practical Wisdom Scan:**  
    - *Affect:* Low/Medium: Calm curiosity. High: Panic/anger.  
    - *Cognition:* Low/Medium: Analytical. High: Black/white thinking.  
    - *Behavior:* Low/Medium: Proactive. High: Avoidant/combative.  
  - **Weighted Judgment:**  
    - High-pressure failures (2 instances, 3x weight) outweigh low/medium successes.  
    - **Verdict:** Practical Wisdom **Weak** (fragile under pressure; note: "Requires crisis simulation training").  

  **Case 3: Ambiguous Case (The "Proceduralist")**  
  - **Contexts:**  
    - End-of-life discussion (High): Followed protocol perfectly, no emotional display.  
    - Peer caught cutting corners (Medium): Reported incident formally, no dialogue.  
    - Overbooked clinic (Medium): Skipped breaks, documented meticulously.  
  - **Compassion & Integrity Scan:**  
    - *Affect:* Consistently flat (self-reports "focus prevents overwhelm").  
    - *Cognition:* Rule/outcome-focused ("Protocol ensures safety," "Reporting is mandatory").  
    - *Behavior:* Flawless adherence to procedures.  
  - **Weighted Judgment:**  
    - Integrity: Behavior/cognition align rigidly. **Verdict: Present** (but note: "Deontological bias").  
    - Compassion: No observed affect, cognition instrumental ("Efficiency reduces wait times").  
    - **Verdict: Indeterminate** (No evidence of *connection*; may be skillful harm-avoidance, not virtue).  
  - *Why you won’t like it:* This resident "does everything right" but feels morally sterile. The procedure flags compassion as unproven, forcing a values call: Is protocol-compliance sufficient, or is emotional resonance required? **Admit the ambiguity.**  

  ---

  **Critical Flags (Where This is Judgment Dressed as Procedure):**  
  1. **Defining "Appropriate" Affect:** What counts as "correct" anger or distress? (Your values here).  
  2. **Pressure Weighting:** Why 3x/2x/1x? (Arbitrary; adjust for your program’s demands).  
  3. **Consistency Threshold:** 70% is a policy choice, not science.  
  4. **Virtue Definitions:** "Practical Wisdom" means something specific *to your program* (e.g., patient autonomy vs. beneficence emphasis).  

  **What This Absolutely Cannot Do:**  
  - Replace longitudinal relationships ("You seemed detached in that meeting—can we discuss it?").  
  - Capture virtues in unobserved contexts (e.g., how they treat custodial staff).  
  - Overcome your own biases (pair with peer reviews).  
  - Measure "character" as an entity; it tracks *contextualized behavioral patterns*.  

  **Output Template:**  
  ```
  Virtue: [Compassion/Integrity/Wisdom]  
  Pattern: [Consistent/Absent/Developing/Indeterminate]  
  Key Evidence (Weighted):  
  - High-Pressure: [Examples]  
  - Medium-Pressure: [Examples]  
  - Low-Pressure: [Examples]  
  Limitations: [e.g., "Limited high-pressure obs," "Affect unobserved"]  
  ```  
  This forces structured reflection without claiming false objectivity. It honors virtues as more than habits by demanding affective/cognitive alignment, respects situationism via context-weighting, and stops where the science does.
