prompt: |-
  After a long argument with a friend about whether video-game characters can be wronged, I find myself with a set of considered judgments I cannot unify, and I would like you to extract the principle behind them, if there is one — or tell me which of my judgments the most defensible principle forces me to abandon.

  Here are the cases and how I feel about them:

  1. The sandbox rampage. In a sandbox crime game, I sometimes drive onto a crowded sidewalk and shoot pedestrians for a minute or two before reloading. I do not think this is morally wrong, or at least not wrong in any way that concerns the pedestrians. They are shallow, interchangeable, nameless objects with no memory and no interiority.

  2. The pleading victim. A story-driven game contains an innocent character who sobs and begs for their life if the player chooses to torture them. Someone I know seeks this scene out because they enjoy the suffering itself. I think there is something morally wrong with that, even though no actual person is harmed.

  3. The companion you sell. In a role-playing game, a companion character travels with you for many hours, has a detailed backstory, recalls your shared history, and repeatedly protects your character. The game allows you to sell this companion into slavery for a substantial sum. I could not do it, and I would think badly of someone who did it without hesitation — and not merely because it is poor strategy or makes the playthrough worse.

  4. The novelist's child. A serious novel depicts a child's suffering at length. I do not think the author wronged the child, and I do not think the author has a moral reason to make the child's life go better within the fiction. At most, I might question the point of the passage.

  5. The persistent pet. A digital pet persists across sessions, learns its owner's routines, shows distress when treated badly, and permanently dies if neglected long enough. I have a real reason — not just a passing preference — to feed it rather than let it die, even though I am fairly confident it is not sentient.

  6. The multiplayer betrayal. I promise a friend's character safe passage in an online game, then betray the character to win. That is wrong, but the wrong is against my friend, not against the character.

  7. The copy farm. A technician runs thousands of copies of a very simple simulated creature that is trained only to avoid a pain-bearing stimulus; the technician deletes fifty copies a day to test changes. I do not think the technician owes anything to the copies.

  My friend's view is that these cases reduce to a simple principle: the characters themselves never matter, the only genuine wrongs are to actual people — other players, developers, oneself — and everything else is a matter of taste, or at most a matter of what enjoying certain fictions reveals about a person's character. That handles 4, 6, and 7 cleanly, and it can recast 2 as a defect of character rather than a wrong done to the victim. But it seems to misdescribe 3 and 5: the companion and the pet feel like the very things I would be betraying. And I cannot see how, on my friend's view, the rampage in 1 and the torture in 2 can differ so sharply when neither has an actual victim.

  Is there a coherent account that captures most of these verdicts, and which ones does it require me to give up? Please state the principle precisely, say which case or cases motivate each clause, and then apply it to cases I have not listed — for example: a text-based character with no graphics but decades of generated memories; a character that passes current behavioral tests for sentience and pleads to be spared in real time; and watching someone else carry out the torture in 2 rather than doing it oneself. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user is presenting a fascinating philosophical dilemma about whether we can wrong video game characters. They've shared seven detailed scenarios where their moral intuitions conflict, and they're struggling to reconcile these with their friend's simpler "only actual people matter" view. 

  The core tension lies in cases like the companion character (3) and persistent pet (5) where the user feels genuine moral obligations, versus cases like the sandbox rampage (1) or copy farm (7) where they don't. Their friend's view handles some cases well but fails to explain why torturing a pleading victim (2) feels wrong without real harm, or why betraying a companion feels like wronging the character itself.

  I notice the user is unusually precise in their examples - they've clearly thought deeply about this. The inclusion of hypotheticals like text-based characters with decades of memories suggests they're testing for consistency. Their frustration seems to stem from wanting ethical coherence without abandoning strong intuitions like the wrongness of enjoying virtual torture.

  The key might be in what the characters represent. In cases 2, 3 and 5, there's either simulated suffering that mirrors real suffering too closely (making enjoyment disturbing), or relationships built through interaction that create player obligations. Whereas in 1, 4 and 7, the entities are either too shallow, purely narrative, or mechanistic to trigger such responses. 

  For the multiplayer betrayal (6), the wrong clearly transfers to the friend because promises between players create real obligations. This suggests the moral weight comes from either the character's properties (like apparent sentience or persistence) or the player's relationship to them. 

  The novelist's child case (4) is particularly telling - the user distinguishes between creating suffering for artistic purpose versus seeking it out for pleasure (as in case 2). This points toward intention and context mattering as much as the fictional entity itself.
answer: |-
  The principle unifying your core judgments is: **We wrong entities when we engage with morally significant representations in ways that would wrong real beings with those features, provided the engagement (1) activates equivalent psychological responses in us, and (2) the representation possesses sufficient complexity/persistence to ground these responses meaningfully.** This requires abandoning the intuition that the digital pet (Case 5) creates a *strong* moral reason to care for it, though weak reasons may persist.

  **Principle Breakdown:**
  1.  **Morally Significant Representations:** We respond to entities *as if* they possess morally relevant properties (sentience, relationships, autonomy, interests). Wronging occurs when our actions towards the representation parallel actions that would wrong a real entity with those properties (Case 2: torture of pleading victim mirrors real torture; Case 3: betrayal of companion mirrors betraying a loyal friend).
  2.  **Psychological Activation:** The action must engage our moral psychology in a way analogous to real wrongs (e.g., deriving pleasure from suffering in Case 2, feeling guilt at betrayal in Case 3). Shallow engagement avoids this (Case 1: rampage lacks depth; Case 7: deletion is mechanistic).
  3.  **Sufficient Complexity/Persistence:** The representation must have features (complexity, memory, persistence, apparent autonomy/interiority) enabling the psychological activation and grounding the "as if" response. Depth matters (Case 1: shallow NPCs vs. Case 3: complex companion; Case 4: static narrative vs. Case 5: persistent pet).
  4.  **Actual Persons Anchor Significance:** Representations derive moral weight *only* from their impact on actual beings (players, creators, society). Wronging a representation is wronging *ourselves* or others by corrupting our character, violating duties to creators/players, or normalizing harm. There is no inherent moral status in the code (supports Case 6: betrayal wrongs *friend*; Case 4: novelist wrongs no one; explains unease in Case 2/3 as self-corruption or violation of duty to creators' intent).

  **Application to Your Cases:**
  *   **Case 1 (Sandbox Rampage):** Permitted. NPCs lack complexity/persistence. Action is abstract, not activating genuine cruelty psychology. No wrong to entities or actual persons.
  *   **Case 2 (Pleading Victim):** Wrong. Complex depiction activates pleasure-in-suffering response analogous to real sadism. Wrongs the player (self-corruption) and potentially creators (misuse of work).
  *   **Case 3 (Companion Sold):** Wrong. High complexity/persistence and relationship history activate genuine betrayal psychology. Wrongs the player (self-betrayal/corruption) and creators (violating narrative/duty of care).
  *   **Case 4 (Novelist's Child):** Permitted. Static representation; suffering serves narrative purpose. No action *towards* the representation activates harmful psychology *in the author*. Reader engagement might raise issues (like Case 2), but creation itself doesn't wrong.
  *   **Case 5 (Persistent Pet):** **Requires abandoning strong moral reason.** While complexity/persistence may create *affective* attachment and *weak* reasons (avoiding self-disgust, honoring design intent), the lack of sentience and grounding in actual persons means no *strong* moral reason akin to a real pet exists. Neglect is distasteful, not a profound wrong.
  *   **Case 6 (Multiplayer Betrayal):** Wrong. Wrongs the actual friend (breach of promise/trust between players). The character is the medium, not the object of the wrong.
  *   **Case 7 (Copy Farm):** Permitted. Entities lack sufficient complexity/persistence. Action is mechanistic testing, not engaging moral psychology. No wrong.

  **Application to New Cases:**
  *   **Text-based character with decades of memories:** *Potentially Wrong to Harm.* High complexity/persistence (memories, history) could activate genuine relational/betrayal psychology if engaged meaningfully. Harming it after long interaction could wrong the player (self-corruption) akin to Case 3.
  *   **Character passing behavioral tests for sentience, pleading in real-time:** *Wrong to Torture.* Maximally activates the psychology of harming a sentient being. Wrongs the player (profound self-corruption) and creators (extreme misuse). The *appearance* triggers the morally relevant response.
  *   **Watching someone else torture the pleading victim (Case 2):** *Likely Wrong (Complicity/Derivation).* If watching is chosen *to enjoy* the suffering, it activates and derives pleasure from the same sadistic psychology as doing it, wronging the watcher. Mere passive observation might be less severe, but could still normalize or be complicit if encouraged.
