answer: |-
  Your reconstruction fails to threaten the internalist position. The agent's commitment to honouring the institutional protocols *is* an element of her motivational set (S), a grounding disposition that shapes her practical reasoning. That this commitment is second-order does not render it external; it is *her* commitment, part of her subjective motivational economy. A sound deliberative route exists: she is motivated to follow the protocols, the protocols generate a specific prescription, and thus, through deliberation acknowledging that very commitment, she has a reason to protect the watershed. The fact that she feels no immediate, first-order urge towards preservation is irrelevant. Motivation need not be occurrent; it is sufficient that the disposition exists such that, via deliberation tracing back to her endorsement of the protocol, she *can* be motivated to act. This is not unfalsifiable sleight-of-hand. It merely recognizes that reasons trace to *actual*, possibly complex or dispositional, elements within S. If no such element existed—if she lacked *any* motivational hook, including this institutional allegiance—then indeed she would have no reason. But here, she does. The externalist illusion arises only when one mistakenly divorces the reason from the agent's existing commitments.
