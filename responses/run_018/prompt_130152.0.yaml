  Empty branch alert: If someone thinks roles are just scripts BUT denies scaling beyond kin? That's coherent (call it "Familial Ritualism") but probably rare in modern contexts. Another gap: The tree can't separate whether citizenship is relational or contractual if someone always prioritizes organizational rules - need a note about that.

  User's clearly designing an experiential workshop - smart to use concrete cases instead of theory. I'll avoid citations but make sure positions are philosophically recognizable. The "awkward commitment" angle is brilliant for revealing tensions. Should add some humor where appropriate since they want it casual.

  Final structure will have:
