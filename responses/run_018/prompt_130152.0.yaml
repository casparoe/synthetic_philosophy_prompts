  I notice they emphasize practical conflicts: profit vs worker protection, citizenship as relational vs contractual, obligations to strangers through institutions. Good - these make great branching points. They want the first split to be on whether roles are constitutive of self (thick Confucian view) or just behavioral scripts (thin view). Then scaling beyond kin, then conflict with organizational rules. 

