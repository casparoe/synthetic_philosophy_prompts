answer: |-
  Here's a sorting taxonomy decision tree designed as a casual workshop handout. Participants navigate concrete cases to self-identify their stance on scaling Confucian role ethics to modern institutions:

  ---

  **"Where Do You Stand? Confucian Roles in Modern Life"**  
  *Follow the questions based on your gut response to real situations. No philosophy degree needed!*

  ### 🧩 **START: Is your JOB/FAMILY role WHO YOU ARE (like your core identity), or just a HAT YOU WEAR (a temporary duty)?**
  *(e.g., Does failing as a parent/child feel like failing as a person, or just breaking a promise?)*

  ---

  ### 🌳 **BRANCH 1: "Roles are WHO I AM" (Constitutive Self)**  
  **→ Q1: Can "family-style care" extend to NON-KIN?**  
  *(e.g., Should a manager shield a junior employee from layoffs like a parent, even if it hurts profits?)*  
  - **YES (Scaling Beyond Kin)**  
    **→ Q2: If your role duty CLASHES with an institutional rule, which wins?**  
    *(e.g., Must a citizen protest an unjust law if it betrays "relational integrity," even risking arrest?)*  
    - **ROLE DUTY WINS** → **"Thick Institutional Role Ethics"**  
      *Awkward commitment: You might have to sabotage your organization for a coworker’s sake.*  
    - **ORGANIZATIONAL RULE WINS** → **"Bureaucratic Confucianism"**  
      *Awkward commitment: Your "parental" duty to employees stops at the HR handbook.*  
  - **NO (Family-Only Ethics)** → **"Classical Confucian Purist"**  
    *Awkward commitment: Your boss owes you nothing deeper than a contractor would.*  

  ---

  ### 🎭 **BRANCH 2: "Roles are a HAT I WEAR" (Performative Scripts)**  
  **→ Q1: Can "family-style care" extend to NON-KIN?**  
  *(Same manager/employee case)*  
  - **YES (Scaling Beyond Kin)**  
    **→ Q2: If your role duty CLASHES with an institutional rule, which wins?**  
    *(Same citizen/state case)*  
    - **ROLE DUTY WINS** → **"Virtue Ethics in Role Clothing"**  
      *Awkward commitment: "Caring manager" is just generosity cosplaying as role ethics.*  
    - **ORGANIZATIONAL RULE WINS** → **"Contractual Role Minimalism"**  
      *Awkward commitment: "Citizenship" is just a legal label with no emotional weight.*  
  - **NO (Family-Only Ethics)** → **"Familial Ritualism"**  
    *Awkward commitment: You’d fire a "work son" with zero guilt if profits dip.*  

  ---

  ### ⚠️ **KEY NOTES FOR YOUR WORKSHOP:**  
  1. **EMPTY BRANCH?**  
     - *"Roles are WHO I AM" + "Scaling Beyond Kin" + "Rule Wins"* isn’t empty but **tension-filled** (can you be "constituted" by a role *and* let bureaucracy override it?).  
     - *"Roles are HATS" + "Can’t Scale Beyond Kin"* is **coherent but rare** in modern workplaces (hence "Familial Ritualism" is niche).  

  2. **CAN’T SEPARATE THESE PAIRS?**  
     - A **"Classical Purist"** (Branch 1) and **"Familial Ritualist"** (Branch 2) *both* reject obligations to non-kin. The tree groups them separately based on their view of roles (self vs. script), but their practical outcomes in *institutional* cases look identical.  
     - **"Thick Institutional"** and **"Virtue Ethics in Role Clothing"** both prioritize role duties over rules—but the former sees this as identity-deep, the latter as performance.  

  3. **INSTITUTIONAL MEDIATION?**  
     The tree **assumes** that "citizenship" or "manager" roles *can* hold obligations—if you answered "NO" to *all* scaling (e.g., "citizenship is just a contract!"), you land in **Classical Purist** or **Familial Ritualist**. Rejecting institutional mediation entirely = dead end for scaling.  

  ---

  **HOW TO USE:**  
  1. Read each **Q** aloud with its real-world example.  
  2. Have participants **move corners** of the room based on answers.  
  3. Reveal their "leaf" label & awkward commitment—sparks great debate!  

  Example outcome:  
  *Someone who says roles are "HATS," would protect employees like family, but follows profit over duty? They’re a "Contractual Role Minimalist" wrestling with the hollowness of "workplace family" rhetoric.*
