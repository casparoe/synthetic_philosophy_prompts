prompt: |-
  Draft the joint statement of an adversarial collaboration between Pairwise Non-Aggregationist Contractualists and Threshold-Sensitive Contractualist Aggregationists within Scanlon’s contractualist framework. Both camps accept that principles are justified only if no one could reasonably reject them, that reasons are generic rather than fully personal, and that simple utilitarian summation is inappropriate; they diverge on whether summed burdens across persons can ever generate a collective reason to reject a principle. The first camp holds that justification is strictly pairwise—each individual’s burden is compared separately against any other’s, with no aggregation across numbers. The second camp—defined for this collaboration as holding that summed burdens can cross a non-arbitrary, context-sensitive threshold to produce a collective generic reason—accepts all other contractualist commitments but denies that pairwise comparison is exhaustive.

  Produce a document containing:

  1. A numbered agreed-claims section, including: (i) the formal structure of contractualist justification via reasonable rejection; (ii) the generic/personal reason distinction; (iii) the statement of the aggregation problem inside this framework; (iv) the shared judgment that preventing one permanent paralysis generally outweighs preventing any number of minor, transient inconveniences; (v) the shared rejection of welfare-maximizing aggregation; and (vi) the agreement that if aggregation is permitted it must be constrained by a non-arbitrary mechanism rather than linear summation.

  2. A disagreements table with two columns—Pairwise View and Threshold-Sensitive View—each phrased in wording its own camp would accept. Cover: whether generic reasons scale across persons; whether a collective veto can emerge without violating pairwise justification; and whether permitting threshold-sensitive aggregation collapses contractualism into rule-utilitarianism.

  3. At least three cruxes, each a sub-question such that settling it would move at least one camp. For each crux provide: (a) the crux in neutral wording; (b) one concrete case or argument both sides agree bears on it (e.g., a policy preventing one paralysis but imposing a one-hour sleep loss on ten thousand people; or a principle exposing each of one million people to an independent 0.001 risk of death in exchange for a large shared benefit); (c) each camp’s explicit, advance prediction about the correct contractualist verdict for that case.

  4. A brief assessment—no more than a paragraph—of whether any part of the dispute is merely verbal, with reasoning.

  Then, after the prose document, provide a brief structured summary as a JSON object with exactly these fields: "agreed_claims" (array of strings), "disagreement_table" (array of objects with keys "issue", "pairwise_view", "threshold_view"), "cruxes" (array of objects with keys "crux_id", "crux_statement", "test_case", "pairwise_prediction", "threshold_prediction"), and "verbal_disagreement" (object with boolean key "is_merely_verbal" and string key "reasoning").
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two contractualist camps within Scanlon's framework.
   The camps agree on core contractualist tenets but disagree on aggregation: 
     - Pairwise Non-Aggregationist Contractualists (Pairwise View) reject any summation of burdens across persons. Justification is pairwise: each individual's burden must be considered separately against any other's.
     - Threshold-Sensitive Contractualist Aggregationists (Threshold-Sensitive View) allow that summed burdens can cross a non-arbitrary, context-sensitive threshold to produce a collective generic reason for rejection.

   The document must contain:

   1. Agreed Claims (numbered section, 6 points: i to vi)
   2. Disagreements Table (with two columns: Pairwise View and Threshold-Sensitive View) on three issues:
        - whether generic reasons scale across persons
        - whether a collective veto can emerge without violating pairwise justification
        - whether threshold-sensitive aggregation collapses contractualism into rule-utilitarianism

   3. At least three cruxes (each with: neutral crux statement, agreed test case, each camp's prediction for the case)

   4. Brief assessment (one paragraph) on whether the dispute is merely verbal.

   Then a JSON summary with specific fields.

   Let's build step by step.

   Part 1: Agreed Claims (i to vi)

   (i) Formal structure: Principles are justified if and only if no individual could reasonably reject them based on the generic reasons they have.
   (ii) Generic vs personal reasons: Contractualism relies on generic reasons that apply to individuals in virtue of their situation, not fully personal reasons tied to particular preferences or values.
   (iii) Aggregation problem: The challenge of whether and how the burdens imposed on multiple individuals can be combined to justify the rejection of a principle, given that simple utilitarian summation is inappropriate.
   (iv) Shared judgment: Preventing one case of permanent paralysis generally provides stronger grounds for rejection than preventing any number of minor, transient inconveniences (like a brief headache).
   (v) Shared rejection of welfare-maximizing aggregation: Both reject the idea that principles are justified by maximizing the sum total of welfare or by adding up individual burdens without constraint.
   (vi) Constrained aggregation: If aggregation is permitted, it must be constrained by a non-arbitrary mechanism (like a threshold) rather than linear summation.

   Part 2: Disagreements Table

   Issue 1: Whether generic reasons can scale across persons to form a collective reason for rejection.
     - Pairwise View: Generic reasons do not scale across persons; each individual's generic reasons must be considered in pairwise comparison without summing with others.
     - Threshold-Sensitive View: Generic reasons can, when the summed burdens cross a non-arbitrary threshold, form a collective generic reason that is irreducible to pairwise comparisons.

   Issue 2: Whether a collective veto can emerge without violating the pairwise condition.
     - Pairwise View: A collective veto cannot emerge because the pairwise condition is exhaustive: if no single individual can reasonably reject a principle, then the principle cannot be rejected even if the total burden is large.
     - Threshold-Sensitive View: A collective veto can emerge when the aggregated burdens cross a threshold, without requiring that any single individual has a burden sufficient for rejection in pairwise comparison.

   Issue 3: Whether threshold-sensitive aggregation collapses contractualism into rule-utilitarianism.
     - Pairwise View: Permitting threshold-sensitive aggregation risks collapsing contractualism into rule-utilitarianism because it introduces a form of aggregation that, even if constrained, makes overall consequences the determining factor.
     - Threshold-Sensitive View: Threshold-sensitive aggregation does not collapse into rule-utilitarianism because the threshold is non-arbitrary and context-sensitive, and the focus remains on what no one could reasonably reject, not on maximizing expected welfare.

   Part 3: Cruxes (at least three)

   Crux 1:
     (a) Neutral: Can the imposition of a very small burden on each of a very large number of individuals collectively provide grounds for reasonable rejection of a principle that benefits one individual with a very severe burden?
     (b) Test case: A policy that prevents one case of permanent paralysis but imposes a one-hour sleep loss on ten thousand individuals. (Assume no cumulative effects beyond the one hour per person.)
     (c) Predictions:
          - Pairwise: The principle allowing the policy cannot be reasonably rejected because no single individual's one-hour sleep loss is comparable to the burden of permanent paralysis. Thus, the policy is permissible.
          - Threshold-Sensitive: The collective burden of ten thousand hours of lost sleep (which is a substantial total burden) crosses a threshold and thus can be reasonably rejected. Therefore, the policy is impermissible.

   Crux 2:
     (a) Neutral: Can a principle that exposes each of a large number of individuals to a very small independent risk of a severe harm be reasonably rejected when the total expected harm is high?
     (b) Test case: A principle that exposes each of one million people to an independent 0.001 risk of death in exchange for a large shared benefit (e.g., a public infrastructure project that saves many lives overall but imposes this risk on each).
     (c) Predictions:
          - Pairwise: No single individual has a burden (only 0.001 risk of death) that is sufficient to reject the principle when compared pairwise with the benefits (which are large but shared). Therefore, the principle cannot be reasonably rejected and is permissible.
          - Threshold-Sensitive: The total expected harm (0.001 * 1,000,000 = 1000 deaths) crosses a threshold and thus can be reasonably rejected by the collective. Therefore, the principle is impermissible.

   Crux 3:
     (a) Neutral: Is there a non-arbitrary way to set a threshold for aggregation that does not depend on interpersonal comparisons of welfare?
     (b) Test case: Consider a principle that imposes a burden of a minor financial cost (say, $10) on each of N individuals to prevent one individual from suffering a catastrophic financial loss (say, $1,000,000). At what N does the collective burden become sufficient to reject the principle? (We assume that the $10 is a minor burden for each, and the $1,000,000 loss is catastrophic for the one.)
     (c) Predictions:
          - Pairwise: The principle can never be rejected by the collective because no single individual's $10 burden is comparable to the catastrophic loss. Thus, for any N, the principle is permissible.
          - Threshold-Sensitive: There exists a non-arbitrary threshold (based on the context) such that when the total burden (N * $10) reaches a level that is comparable to the catastrophic loss (e.g., when N is 100,000, the total is $1,000,000, which is the same magnitude as the loss prevented), the collective burden becomes sufficient for rejection. However, the threshold might be set lower (e.g., at a point where the collective burden becomes "catastrophic" in aggregate) and thus might reject the principle at a lower N.

   Part 4: Assessment of whether the dispute is merely verbal.

   We must consider: Is the disagreement only about the meaning of terms (like "reasonable rejection") or is it substantive?
     - The disagreement is substantive because the two camps make different predictions about the same cases (as in the cruxes). The Pairwise camp denies that numbers can ever matter in the way the Threshold camp claims, while the Threshold camp insists that they can when a threshold is crossed. This leads to different moral verdicts in concrete cases. However, there might be a verbal element regarding the interpretation of "collective reason" and "pairwise comparison". But the core disagreement is about the structure of moral reasoning.

   Now, we write the joint statement in prose.

   Finally, the JSON summary.

   Let's structure the document.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Contractualist Aggregation  

  #### 1. Agreed Claims  
  Both parties endorse the following core tenets of Scanlonian contractualism:  
  (i) **Formal Structure**: A principle is justified if and only if no individual could reasonably reject it, given their generic reasons for objecting to the burdens it imposes.  
  (ii) **Generic/Personal Distinction**: Reasons for rejection must be *generic*—rooted in fundamental human interests and vulnerabilities—not *personal* (idiosyncratic preferences or values).  
  (iii) **Aggregation Problem**: Contractualism faces a challenge in determining whether burdens dispersed across multiple persons can jointly justify rejecting a principle, absent utilitarian summation.  
  (iv) **Paralysis vs. Inconvenience**: Preventing one case of permanent paralysis (e.g., lifelong loss of mobility) is almost always more morally urgent than preventing any number of minor transient burdens (e.g., 5-minute headaches), regardless of scale.  
  (v) **Anti-Utilitarianism**: Welfare-maximizing aggregation—where small individual gains/burdens are summed linearly to override a large individual loss—is incompatible with contractualism.  
  (vi) **Non-Arbitrary Constraints**: If aggregation is permitted, it must be governed by a *non-arbitrary, context-sensitive mechanism* (e.g., a burden threshold) rather than unconstrained summation.  

  ---

  #### 2. Disagreements  
  | Issue | Pairwise View | Threshold-Sensitive View |
  |-------|---------------|--------------------------|
  | **Scalability of Generic Reasons** | Generic reasons are inherently individual; they cannot be "scaled" across persons to form a collective reason. | Generic reasons can generate a *collective* ground for rejection when aggregated burdens cross a non-arbitrary, contextually defined threshold. |
  | **Collective Veto** | A collective veto is impossible without violating pairwise justification. If no single individual can reasonably reject a principle, it stands irrespective of total burdens. | A collective veto can emerge from aggregated burdens crossing a threshold, even if no single individual’s burden suffices for pairwise rejection. |
  | **Rule-Utilitarianism Risk** | Threshold-sensitive aggregation collapses contractualism into rule-utilitarianism by making total consequences decisive, undermining the "individual standpoint." | Threshold-sensitivity is *distinct* from rule-utilitarianism: it retains the individual veto for non-threshold cases and rejects welfare maximization. |

  ---

  #### 3. Cruxes  
  **Crux 1: Burden Magnitude Scaling**  
  - **(a) Neutral Statement**: Can aggregated small burdens (each individually non-rejectable) collectively outweigh a large burden?  
  - **(b) Test Case**: Policy prevents one permanent paralysis but imposes a one-hour sleep loss on 10,000 people.  
  - **(c) Predictions**:  
    - *Pairwise*: Permissible (no single sleep loss outweighs paralysis).  
    - *Threshold-Sensitive*: Impermissible (10,000 hours crosses a threshold of "collectively severe disruption").  

  **Crux 2: Risk Aggregation**  
  - **(a) Neutral Statement**: Can aggregated tiny risks generate a reasonable rejection?  
  - **(b) Test Case**: Principle exposes 1 million people to an independent 0.001% risk of death for a shared benefit (e.g., lifesaving infrastructure).  
  - **(c) Predictions**:  
    - *Pairwise*: Permissible (no individual’s 0.001% risk is rejectable).  
    - *Threshold-Sensitive*: Impermissible (collective expected harm = 10 deaths crosses a "significant harm" threshold).  

  **Crux 3: Threshold Determinacy**  
  - **(a) Neutral Statement**: Is there a non-arbitrary method to define thresholds?  
  - **(b) Test Case**: $10 cost to each of *N* people prevents one person’s catastrophic $1M loss.  
  - **(c) Predictions**:  
    - *Pairwise*: Always permissible (no $10 cost outweighs $1M loss).  
    - *Threshold-Sensitive*: Rejectable when *N* ≥ 50,000 (total burden ≈ $500K crosses "collective sacrifice" threshold).  

  ---

  #### 4. Verbal Disagreement Assessment  
  The dispute is **not merely verbal**. While both camps use terms like "reasonable rejection" and "generic reasons," their divergence reflects a substantive conflict about moral ontology: whether moral reasoning must be strictly agent-relative (Pairwise) or admits irreducible group-level considerations (Threshold-Sensitive). This manifests in irreconcilable verdicts on cases (e.g., Crux 1 and 2), confirming a deep structural disagreement about contractualism’s scope.  

  ---

