  **APPENDIX A: RFCA Compliance Rating Schema**

  *   **Green-Secure:** No significant rule-intent misalignments detected; QPAP/CC fully effective.
  *   **Amber-Stable:** Isolated QPAP interventions required; CC unchallenged; system contains indeterminacy.
  *   **Yellow-Contained:** Multiple QPAP/CC activations; minor interpretive cascades contained via CNB.
  *   **Red-Unstable:** Widespread QPAP deadlock/CC challenges; CNB fails to establish stable norm; existential coherence risk flagged.
  *   **Grey-Indeterminate:** Audit process itself compromised by unresolved rule-following paradox within RFAD. (Contingency Protocol Theta activated).
