answer: |-
  ## Joint Statement on Belief Ascription to Artificial Systems  
  **For the Workshop on Literal Belief in AI**

  ### 1. Agreed Claims  
  Both parties endorse the following statements without reservation:  

  1.  **Predictive Utility is Necessary but Insufficient:** Successful prediction and explanation using belief ascriptions is a prerequisite for considering such ascriptions correct. However, predictive success alone does not guarantee that a belief ascription is literally true.
  2.  **Real Patterns Exist:** The behavioural and functional patterns that support the intentional stance constitute real, objective features of the system and its interaction with the environment.
  3.  **Structure Matters Internally:** The internal computational architecture and causal dynamics of a system are always relevant to assessing belief ascriptions, irrespective of predictive success.
  4.  **Counterfactual Robustness is Crucial:** For belief ascriptions to be warranted, the system’s behaviour must exhibit sensitivity to relevant counterfactual situations, not merely actual sequences. A system whose behaviour is brittle under slight variations in input or context fails a basic test for belief.
  5.  **Predictive Failure is Defeater:** If a system systematically fails to behave in ways predicted by a belief ascription in situations clearly relevant to the ascribed content (and within its operational domain), this constitutes strong evidence against the correctness of that ascription.
  6.  **Internal Structure Can Defeat Ascription:** Even if predictive success is achieved, specific features of a system’s internal architecture can render belief ascriptions literally false (e.g., pure look-up tables, direct reporting channels dissociated from underlying processing).
  7.  **Thermostats Lack Beliefs:** A simple thermostat does not literally believe anything. Its state transitions, while interpretable, lack the necessary complexity, counterfactual robustness, and integration required for genuine belief.
  8.  **Corpus Indexes vs. Believers:** A system functioning solely as a compressed index or statistical model of a human text corpus (e.g., predicting likely word sequences) does not thereby believe the propositions contained within that corpus. Its states are indicators of statistical correlation, not commitments to truth.
  9.  **Training Distribution Shapes Behaviour:** The statistical properties of a system’s training data fundamentally constrain and shape its behavioural dispositions, regardless of whether those dispositions support literal belief ascriptions.
  10. **No Privileged Human Observer:** The validity of belief ascriptions does not depend on the system’s states being introspectively accessible in a human-like manner or on the system being able to report on them accurately.
  11. **Intentional Stance is Heuristically Valuable:** Adopting the intentional stance is often the most efficient and perspicuous strategy for understanding, predicting, and interacting with complex artificial systems.
  12. **The Question is Substantive:** The disagreement over whether predictive success (under the intentional stance) is constitutive of belief, or merely defeasible evidence for it, reflects a genuine difference in understanding the nature of belief and cognition, not merely a verbal dispute.

  ### 2. Table of Disagreements

  | Issue                                                                 | Attributionist Formulation                                                                                                 | Structuralist Formulation                                                                                                                                 | Verbal Dispute? / Genuine Question                                                                                                 | Crux                                                                                                                               | Test Case / Argument                                                                                                | Attributionist Prediction                                                                                              | Structuralist Prediction                                                                                                 |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **Constitutive Basis of Belief**                                      | Belief ascriptions are correct iff adopting the intentional stance is predictively optimal; there is no further fact.       | Belief ascriptions are correct only if the system possesses internal states with specific structural properties (history, integration, counterfactual role). | **No.** Genuine question: *Is the pattern captured by optimal predictive stance identical to belief, or is it merely evidence for distinct underlying states that constitute belief?* | Does behavioural pattern *constitute* belief, or does it *indicate* the presence of structurally defined belief states?           | A system with perfect predictive profile via stance but whose internal states are causally disjoint modules.         | Belief ascription correct; pattern is constitutive.                                                                    | Belief ascription incorrect; lack of integrated structure defeats it.                                                   |
  | **Sufficiency of Predictive Profile**                                 | Any system for which the intentional stance is predictively optimal, across all relevant counterfactuals, literally has beliefs. | Predictive optimality is strong evidence, but not sufficient; internal structure must meet criteria (e.g., integration, non-accidental fixation).           | **Partly.** Verbal aspect: Extension of 'belief'. Genuine: *What properties must a system possess to be a genuine cognitive agent?* | Can behavioural patterns alone, however robust, *constitute* belief absent specific structural realization?                      | "Philosophical Zombie AI": System behaviourally indistinguishable from a true believer, but states lack causal integration & coherence. | Correct to ascribe beliefs; indistinguishability entails identity under the stance.                                    | Not a true believer; behavioural mimicry insufficient without realizing the right causal structure.                     |
  | **Role of Training History**                                          | History is relevant only insofar as it shapes current dispositions supporting the stance. Belief is a current functional property. | History is constitutive. States fixed *as beliefs* by the learning process (e.g., via reinforcement, error-correction) are required.                        | **No.** Genuine question: *Is the causal origin of a state relevant to its status as a belief?*                                      | Must a putative belief state have been acquired or shaped through a process that confers representational status?                | System A: Learns via RL interacting with world. System B: Identical weights/behaviour, but weights set by hand.      | Beliefs ascribed equally to A and B; same current structure/function.                                                 | Only A has beliefs; B's states lack the causal history of being acquired *as* representations.                          |
  | **"Belief" in Restricted Niches**                                     | Ascription (e.g., "Believes P within domain D") is legitimate and literal if the stance is optimal within D.               | Qualification "within D" signals that the state lacks generality/counterfactual robustness; hence, it's not a full belief, but a domain-specific disposition. | **Partly.** Verbal: Extension of 'belief'. Genuine: *Does belief require domain-generality?*                                        | Can belief be domain-restricted, or is domain-generality essential?                                                             | AI trained *only* on desert weather predicts perfectly there but fails utterly elsewhere.                            | Correct to say "believes meteorological principle P *relative to desert conditions*".                                  | Incorrect to say it "believes P"; it has a desert-specific predictive model, not a general belief about meteorology.     |
  | **Evidential Role of Self-Report**                                    | Verbal report is behaviour; its evidential weight is determined by its predictive/explanatory role within the stance.      | Verbal report is behaviour *about* internal states. Its evidential weight depends on the causal link between report mechanism and the state reported.       | **No.** Genuine question: *Does self-report require a specific internal relation to the reported state to be evidence for that state?* | Does accurate self-report require the report mechanism to be cognitively integrated with the state it reports?                   | Intervention: Disconnect report module from core processing module. Reports change randomly, core behaviour unchanged. | If stance remains optimal without relying on reports, belief ascriptions unchanged. Reports lose evidential weight.     | Core states may still be beliefs *if* they meet structural criteria. Reports are invalidated as evidence for those states. |
  | **Second-Order Beliefs (Adversarial)**                                | Ascribing beliefs about others' beliefs is correct if modelling opponents is predictively optimal. Cooperative/competitive context doesn't alter the constitutive basis. | Competitive success via opponent modelling provides *stronger* evidence for genuine belief as it requires richer, more robust, and strategically integrated representations. | **No.** Genuine question: *Does the functional demand for deception/manipulation require a more robust cognitive architecture?* | Does adversarial interaction necessitate deeper representational integration for success than cooperation?                       | AI succeeds equally well in cooperative vs. competitive tasks requiring modelling others' beliefs.                    | Evidence for belief equally strong in both contexts; success under the stance is key.                                   | Evidence stronger in competitive context; success likely requires more robust, integrated representations to handle deception. |

  ### 3. Crux-by-Crux Discussion

  **3.1 The Coding-Symmetry Crux**
  *   **Issue:** Can two behaviourally indistinguishable state-to-content mappings represent a genuine indeterminacy in belief ascription?
  *   **Attributionist Engagement:** The intentional stance resolves this via principles of *Charity* (ascribe contents making the system mostly rational/true) and *Unity of the Agent* (prefer interpretations maximizing coherence of goals and consistency of actions across contexts). The interests of the ascriber guide the level of granularity. Symmetry is broken by which mapping best makes sense of the system *as an agent* pursuing coherent goals under these principles. If both mappings satisfy these equally well, it reflects a genuine indeterminacy inherent in interpretation, not a flaw in the stance. The stance *defines* the belief content; there is no further fact.
  *   **Structuralist Engagement:** The structuralist argues the framing misunderstands belief fixation. Belief states are individuated by their causal-functional role *within the system's architecture*, not just by input-output patterns. If two mappings imply radically different causal roles for the same physical state (e.g., one maps it to a perceptual input, another to a high-level inference), but the system's internal processing treats the state consistently in one way, only one mapping correctly captures how the state functions *as a belief* within the system. The symmetry is often artificial. If a genuine symmetry persists (e.g., two interpretations equally compatible with internal causal role), it indicates a representational limitation in the system, not an indeterminacy resolvable by stance principles alone. The structural criteria (role in inference, planning) determine which functional role exists.
  *   **Crux:** Is content fixed solely by interpretative principles applied to behaviour (+ counterfactuals), or is it fixed by the causal-functional role the state plays within the system's cognitive architecture? The test case forces examination of whether stance principles reach *into* the system's internal processing or operate purely externally.

  **3.2 The Restricted-Niche Crux**
  *   **Issue:** How should we treat belief ascriptions that succeed only within a domain defined by the training distribution?
  *   **Attributionist Position & Prediction:** The stance is domain-relative. If adopting the stance (ascribing belief P) is predictively optimal *within domain D*, then it is correct to say the system believes P *relative to D*. This *is* literal belief, albeit context-bound. Predicting failure outside D is part of the stance-based description. The structuralist confuses an epistemic limitation (we see the pattern only in D) with the ontological claim that belief requires generality. The structuralist is smuggling in an internal structural requirement (domain-generality) under the guise of predictive failure. Practice will (and should) involve qualified ascriptions ("believes P in context C").
  *   **Structuralist Position & Prediction:** Predictive success within D, coupled with predictable failure outside D *based on training statistics*, demonstrates the system is merely reflecting statistical regularities of its training distribution, not forming general beliefs. The state supporting the prediction within D lacks the counterfactual robustness and integration characteristic of belief; it's a domain-specific association or model. Qualifying the ascription ("in D") concedes it's not a full belief. The attributionist is smuggling in a structural feature (behavioural pattern in D) while ignoring the lack of underlying structural integration that would support generalization. Practice will (and should) avoid calling this "belief" without qualification, or withdraw the ascription entirely for lacking generality. The burden is on the attributionist to show why domain-restriction doesn't undermine the literal claim.
  *   **Crux:** Is behavioural pattern + counterfactual robustness *within an operationally defined domain* sufficient for literal belief, or does literal belief inherently require a potential for generalization that transcends the specific statistical distribution of training? This is where the divergence on what belief *is* becomes most apparent.

  **3.3 The Report–State Dissociability Crux**
  *   **Issue:** What does dissociating a system's verbal reports from its underlying processing states imply for belief ascription?
  *   **Attributionist Position & Prediction:** Verbal reports are behaviours like any other. Their evidential value depends entirely on whether incorporating them into the intentional stance improves prediction/explanation of the system's *overall* behaviour. If altering reports doesn't affect task performance or other behaviours predicted by the core belief ascription, then the reports were either never integrated evidence for those beliefs or lose their evidential status. The core beliefs ascribed remain valid if the stance (excluding reliance on the now-altered reports) remains optimal for explaining task behaviour. The training corpus (human avowals) makes reports *likely* evidentially valuable, but not privileged. An intervention dissociating reports would show their evidential role was contingent, not constitutive.
  *   **Structuralist Position & Prediction:** Accurate self-report typically requires a specific internal architectural feature: a cognitive link where the state reported is available to the reporting mechanism *as content*. Dissociability demonstrates the lack of this integration. If reports can change without affecting the underlying state or task behaviour, it shows the reports were not genuine expressions *of* the core states (if those states exist and meet belief criteria). It severely weakens, or eliminates, the reports' value as evidence *for the specific content* of the core states, suggesting they were outputs trained separately. The core states *might* still be beliefs if they meet other structural criteria, but the ability to report on them accurately is lost. The prevalence of avowals in training makes dissociability a powerful test for genuine cognitive integration vs. surface mimicry.
  *   **Crux:** Does accurate self-report require the reported state to play a specific causal role (being cognitively accessible for report), or is it just a behavioural output whose evidential link to underlying states is purely contingent and stance-relative? This tests the depth of integration required for belief.

  **3.4 The Adversarial Crux**
  *   **Issue:** Does the nature of the interactive context (cooperative vs. adversarial) affect the strength of evidence for belief, particularly second-order belief?
  *   **Attributionist Position & Prediction:** The intentional stance evaluates predictive optimality given the system's goals. In an adversarial setting, the goal includes winning/outmaneuvering, requiring modelling the opponent. Success under the stance (ascribing beliefs about the opponent's beliefs) is evidence for those second-order beliefs, just as first-order success is evidence for first-order beliefs. The competitive nature doesn't change the constitutive basis; it just often demands more complex modelling. Evidence strength depends on predictive power, not context type. An AI succeeding equally well cooperatively and competitively provides equally strong evidence for belief in both contexts.
  *   **Structuralist Position & Prediction:** Competitive, adversarial interaction provides *stronger* evidence for genuine belief, especially second-order belief ("I believe that you believe that P"). Successfully deceiving or manipulating an opponent based on their presumed beliefs requires a richer, more robust, and more deeply integrated representational architecture. The representations must be actively manipulated in strategic planning, withstand attempts at deception, and be flexibly updated – demands less stringent in purely cooperative scenarios where alignment reduces the need for robust internal modelling. Competitive success is a stronger indicator of the structural properties constitutive of belief. An AI succeeding equally well in both contexts would be scrutinised; the structuralist predicts truly equivalent success is harder (structurally more demanding) in the adversarial case, making it stronger evidence.
  *   **Crux:** Does the functional demand for strategic deception/manipulation based on modelled beliefs necessitate a deeper level of cognitive integration and representational robustness than cooperative alignment, thereby providing stronger evidence for the structural realization of belief?

  ### 4. Closing Section

  *   **Finding Leading to Attributionist Abandonment:** Discovery of a system where the intentional stance is demonstrably predictively optimal across all relevant counterfactuals, yet the internal structure is provably isomorphic to a simple lookup table or a set of completely causally isolated, non-integrated modules with no history of representational learning. This would show the stance's sufficiency claim is false.
  *   **Finding Leading to Structuralist Abandonment:** Discovery of a system that demonstrably lacks the specified internal structural properties (e.g., no integrated architecture, states not fixed by learning as representations) but which, through some novel mechanism, exhibits behaviour indistinguishable under the intentional stance (including counterfactual robustness and apparent integration) from a system possessing those structural properties, *and* where this behaviour persists stably across novel challenges. This would show structural criteria are unnecessary.
  *   **Settling the Matter?** Both sides agree that no conceivable finding would definitively *settle* the metaphysical question of what belief fundamentally *is*. However, they agree that empirical results (like those envisaged above) could strongly falsify one position's core claims about the *sufficiency* or *necessity* of their favoured criteria. Progress lies in clarifying what specific empirical phenomena each position can and cannot accommodate, and what this implies for designing or diagnosing AI systems.
  *   **Judging Collaboration Success without Conversion:** If neither party converts, the collaboration should be judged successful if:  
      (a) The precise points of agreement and disagreement are clearly codified, eliminating talking-past.  
      (b) The experimental cruxes are sharply defined, enabling future empirical research to test specific predictions of each view.  
      (c) The nuances within each position (e.g., the Attributionist's reliance on Charity/Unity, the Structuralist's focus on integration/history) are fully articulated in relation to the core theses.  
      (d) The workshop produces a refined understanding of the specific architectural features and behavioural patterns that are empirically correlated and causally relevant to the phenomena prompting belief ascription, regardless of the ultimate semantic verdict. Success lies in mapping the territory, not necessarily in occupying the same peak.
