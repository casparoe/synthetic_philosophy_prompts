  Please describe the most important implications of Douglass's claim that the Constitution was, at its core, antislavery—even if the text didn't always say so outright—for how we should think about AI scraping and fair use today. I keep seeing lawyers argue that training data is just 'speech' and therefore protected, but I'm wondering if Douglass's idea that you have to read a legal document in light of its moral purpose, not just its literal wording, gives us any leverage against that. Specifically, what would it mean to say that copyright law's 'purpose' is to promote knowledge, and that treating massive scraping as fair use is actually a betrayal of that purpose? And do his arguments about bad-faith interpretation apply when tech companies hire constitutional scholars to defend scraping? I'm not asking for a legal brief, just the conceptual implications, especialy for whether we should care more about the 'spirit' of a law than its literal application.
