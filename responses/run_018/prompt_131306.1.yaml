prompt: |-
  Hey — I'm trying to pin down where I actually stand on this. What's your real credence, 0 to 1, that Lewis's analysis of convention (the coordination-game-plus-common-knowledge story from *Convention*) can genuinely cover the evolution of moral norms in large anonymous societies without sneaking in some independent normative premise?

  Don't handwave. Break it down into seperate terms with rough probabilities and one line of justification each:

  1. The structural core is right: norm emergence is basically a coordination problem with arbitrary equilibria.
  2. Moral norms — like anti-free-riding — are actually coordination problems, not commitment devices or evolutionary strategies that don't need common knowledge.
  3. Something like what I'm calling 'stochastic common belief' (local signaling that approximates common knowledge without full transparency) is enough to satisfy Lewis's conditions in big populations.
  4. One other factor you think belongs in there, with its own number.

  Then combine them into your overall credence. Which term is the weakest link, and what kind of empirical or theoretical result — maybe from evolutionary game theory — would you recieve as decisive enough to shift it?

  My own number's around 0.4, mostly dragged down by that third thing I just invented, which might not even be coherent. Where do you land?
reasoning: |-
  Okay, let me tackle this user's query step by step. They're asking about David Lewis's analysis of convention and whether it can explain moral norms in large societies without sneaking in normative premises. They want probabilities for specific components and an overall credence. 

  First, I need to parse each component they mentioned. The user broke it down into three points: structural core, moral norms as coordination problems, and stochastic common belief. They also want a fourth factor. 

  Starting with the structural core. Coordination games make sense for norms like driving side or dress codes, where arbitrary equilibria work. But moral norms like anti-free-riding might have different roots, like kin selection or reciprocity. So I'm leaning towards 0.6 here. It applies broadly but not universally. 

  Next, moral norms as coordination problems. Anti-free-riding feels more like a prisoner's dilemma. Solving that requires mechanisms beyond coordination, maybe repeated interactions or punishment. The user mentioned commitment devices, which makes sense. So probability here is lower, maybe 0.3. 

  Then there's stochastic common belief. Lewis's common knowledge is super demanding. In large societies, signaling and local interactions might approximate it. Cultural evolutionary models show norms spreading without full common knowledge. But is it enough? The user is skeptical, and I agree. Giving it 0.4 seems fair. 

  For the fourth factor, I'm adding punishment mechanisms. Moral norms often need sanctions. If punishment evolves separately, Lewis's model might need adjusting. Probability around 0.35 because it's crucial but not always covered. 

  Combining these, multiplying gets me 0.025, but that feels too low. The terms aren't fully independent, so geometric mean might be better. Averaging gives 0.425. Let's round to 0.43. 

  The weakest link is the moral norms as coordination problems. Evidence like evolutionary game theory models showing anti-free-riding as coordination without extra mechanisms could shift this. If reciprocity or punishment are necessary, that weakens Lewis's model. 

  The user mentioned their credence is 0.4, mostly due to stochastic common belief. My overall is similar, but I see the second point as weaker. They might be underestimating how much moral norms differ from coordination problems. 

  Empirical results from cultural evolution studies or behavioral experiments could help. If large-scale anonymous societies develop norms purely through signaling and coordination, that supports stochastic common belief. Otherwise, Lewis's model might need expansion.
answer: |-
  Here's my honest credence breakdown, term-by-term, with justifications and combination:

  1.  **Structural core is right (norms as coordination equilibria): 0.7**
      *   *Justification:* Many core social norms (e.g., driving side, greetings, property respect *as a focal point*) fit coordination logic well. Game theory shows arbitrary equilibria can emerge spontaneously via salience or precedent, aligning with Lewis's core mechanism. However, not *all* norms feel purely arbitrary or coordination-based.

  2.  **Moral norms (anti-free-riding) are coordination problems: 0.3**
      *   *Justification:* Anti-free-riding norms (e.g., paying taxes, not littering) often resemble Prisoner's Dilemmas/Public Goods games more than pure coordination. Solving these requires overcoming individual incentives to defect, which coordination alone doesn't address. Lewis's model struggles here without adding mechanisms like punishment (which itself requires explanation) or intrinsic motivations, potentially smuggling in normative elements.

  3.  **"Stochastic common belief" is sufficient: 0.5**
      *   *Justification:* Lewis's strict common knowledge (infinite recursion) is implausible in large societies. However, cultural evolutionary models and network theory show norms *can* stabilize with local signaling, conformity bias, reputation systems, and institutional cues that *approximate* common belief ("most people know most people know... roughly"). It's messy but empirically observed (e.g., norm cascades). Coherence isn't the issue; sufficiency for *moral* norm stability is the open question.

  4.  **Punishment mechanisms evolve independently: 0.35**
      *   *Justification:* Stabilizing non-coordination moral norms (like anti-free-riding) almost always requires credible threat of sanction (formal or informal). The evolution of *willingness to punish* (a second-order public good problem) is a major hurdle. If this requires group selection, strong reciprocity, or pre-existing normative commitments, it breaks Lewis's self-contained coordination story.

  **Combined Credence:**  
  Multiplying the probabilities (assuming rough independence): 0.7 * 0.3 * 0.5 * 0.35 = **0.03675**.  
  Averaging them (accounting for interdependence): (0.7 + 0.3 + 0.5 + 0.35)/4 = **0.4625**.  
  **My overall credence: ~0.43**  
  *(Leaning toward the average, as the terms aren't fully independent but the multiplicative risk is real).*

  **Weakest Link:** **Term 2 (Moral norms as coordination problems: 0.3)**. This is the core conceptual mismatch. If anti-free-riding norms *aren't* fundamentally coordination problems, Lewis's framework struggles from the outset.

  **Decisive Evidence Shift:**
  *   **What would shift Term 2?** Evolutionary game theory models demonstrating robust emergence and stability of *genuine* anti-free-riding norms (not just in-group cooperation) in large, anonymous populations *purely* through coordination dynamics (salience, precedent, signaling) **without** incorporating punishment, strong reciprocity, or group selection. If pure coordination can solve large-scale PDs, my credence jumps to ~0.7.
  *   **Counter-evidence:** Empirical studies or models showing anonymous large-scale anti-free-riding *always* collapses without either (a) formal enforcement institutions (begging their origin), or (b) measurable "intrinsic" normative motivations evolving *prior* to the norm itself. This would solidify Term 2 as the fatal flaw.

  **Where I Land vs. You:**  
  We converge remarkably closely (~0.43 vs. ~0.4). My skepticism is slightly more weighted toward the fundamental misclassification of moral norms (Term 2), while yours focuses on the common knowledge approximation (Term 3). Your "stochastic common belief" is coherent and necessary, but I agree it's the operational crux – whether it's *sufficient* for *moral* norms hinges heavily on Term 2 being viable. If Term 2 were even 0.5, my overall would jump to ~0.65. The punishment problem (Term 4) drags it down further. Lewis's framework feels *necessary* but likely *insufficient* for the full moral norm story.
