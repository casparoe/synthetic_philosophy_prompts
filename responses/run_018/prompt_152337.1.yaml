  For each objection, I should craft a concise reply. The analytic objection requires defending institutions as moral agents with persistent obligations. Concede that metaphysical guilt stays personal. The legal objection needs distinguishing corporate liability from state continuity. Concede that institutions aren't legal persons but emphasize their role in obligation-bearing.

  Historians might say Jaspers excluded institutional guilt intentionally. Reply by highlighting Jaspers' focus on postwar Germany, allowing for evolution. Concede that Jaspers didn't address it but argue the framework's adaptability.

  The reparations question demands clarifying that obligations attach to institutions, not current groups. Stress that the state maintains duties regardless of demographic changes. This avoids collective punishment by focusing on structures, not individuals.

  I need to flag which points are soft. The analytic objection is the most fatal; if institutions can't bear guilt, the thesis fails. Legal objections are serious but can be countered with analogies. Historians' critiques are manageable with textual evidence. The reparations question is challenging but navigable with careful framing.

