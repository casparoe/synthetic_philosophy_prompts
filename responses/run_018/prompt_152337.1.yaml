answer: |-
  Here’s your Q&A prep sheet, structured by threat level and tailored to your audience. I’ve ranked objections from **critical** (potentially fatal) to **noisy** (distracting but manageable). Your core vulnerability is the *metaphysical status of institutions* as obligation-bearers.

  ---

  ### **Critical Objections (Potentially Fatal If Unaddressed)**
  1. **Analytic Philosopher (Conceptual Hygiene)**:  
     *"You're reifying institutions as moral agents. States don't 'bear guilt'; only sentient beings do. Obligations can't 'persist' in bricks and letterheads. This is category confusion dressed as innovation."*  
     **Reply (2 min)**:  
     "I’m not anthropomorphizing institutions. I’m arguing that *structured obligations* are embedded in institutional functions, roles, and resources. When a state (e.g., post-1994 South Africa) inherits land records, treasury bonds, or treaties from a predecessor regime, it inherits the *normative frameworks* attached to them. This isn’t agency—it’s *continuity of normative structure*.  
     **Soft Spot**: If institutions are mere tools, obligations dissolve with regime change.  
     **Concede Up Front**: *"I agree institutions aren’t moral agents. But they are transgenerational vessels for obligations—like a will binding executors, not the paper it’s written on."*  

  2. **Legal Scholar (Corporate Analogy Fail)**:  
     *"Corporate succession transfers liabilities, not guilt. When Company A buys Company B’s assets, it assumes debts but not B’s criminal culpability. Why treat states differently? Your ‘guilt’ is just liability in disguise."*  
     **Reply (2 min)**:  
     "States aren’t corporations. Corporate liability is contractual; state continuity is constitutive. When Poland inherits Prussian land records detailing stolen Jewish property, it doesn’t ‘buy’ an asset—it *becomes* the territorial authority bound by that history. Legal succession (e.g., via state continuity doctrine in international law) *does* transfer reparative duties—see Germany’s WWI reparations paid post-reunification.  
     **Soft Spot**: Blurs liability (legal) with guilt (moral/political).  
     **Concede Up Front**: *"You’re right—I’m reframing liability as ‘guilt’ for Jaspers’ schema. But the normative weight comes from the institution’s role in perpetuating harm, not metaphysics."*  

  ---

  ### **Serious Objections (Damaging but Salvageable)**
  3. **Historian (Jaspers Misread)**:  
     *"Jaspers’ ‘political guilt’ already covers citizens of a regime. Adding a ‘fifth kind’ ignores his core point: guilt attaches to *complicity in power*. Institutions are just the machinery—you’re duplicating his category with bureaucrats."*  
     **Reply (2 min)**:  
     "Jaspers wrote in 1947, addressing Nazis who *personally* upheld the regime. But when the Stasi’s archives persist in unified Germany, the guilt isn’t in the ex-Stasi officers (political guilt), nor the file cabinets (metaphysical nonsense). It’s in the *state’s ongoing failure to rectify its institutional legacy*. Jaspers’ framework can’t address this because he assumed regime death = clean slate.  
     **Soft Spot**: Risk of overstretching Jaspers.  
     **Concede Up Front**: *"I concede Jaspers didn’t envision this—but his categories are tools, not scripture. Post-colonial states prove we need this addition."*  

  4. **Analytic Philosopher (Inheritance = Collective Punishment)**:  
     *"Taxing a Berliner born in 2000 for Holocaust reparations *is* collective punishment. You just call it ‘institutional obligation’ to dodge the fairness problem."*  
     **Reply (2 min)**:  
     "Collective punishment targets *innocent individuals* for group affiliation. Institutional continuity targets the *state* as a perpetual entity. Citizens fund reparations as taxpayers, not as bearers of guilt—just as they fund future pensions. The obligation binds the office, not the soul.  
     **Soft Spot**: If the state’s obligations are funded by individuals, the distinction feels semantic.  
     **Concede Up Front**: *"Yes, individuals pay—but as civic duty, not guilt. We accept this for national debt; why not historic injustice?"*  

  ---

  ### **Noisy Objections (Annoying Distractions)**
  5. **Historian (Specificity Overreach)**:  
     *"Jaspers was diagnosing postwar Germany, not building a universal model. Your ‘fifth guilt’ forces his existential framework into a legalistic straitjacket."*  
     **Reply (2 min)**:  
     "Jaspers himself called his categories ‘inadequate for future cases.’ I’m extending his logic—not distorting it—to address *persistent* injustice. The ‘existential’ core remains: how do we live with toxic inheritance?  
     **Concession**: *"Fine, call it a ‘Jaspers-inspired’ category. The label matters less than the function."*  

  6. **Analytic Philosopher (Semantic Quibble)**:  
     *"Why call it ‘guilt’? Obligation, debt, or liability would avoid muddying moral/legal lines."*  
     **Reply (2 min)**:  
     "Because Jaspers’ audience felt *guilt*—a visceral weight. ‘Institutional guilt’ captures the affective reality of living with tainted institutions (e.g., post-Apartheid SA). Pedantry undermines the phenomenology.  
     **Concession**: *"Call it ‘continuity obligation’ if you prefer. The concept survives."*  

  ---

  ### **The Nightmare Question (Pray It Goes Unasked)**  
  **Objection**: *"If the ‘group’ harmed no longer exists (e.g., extinct tribes) or the victim group is reconstituted (e.g., African Americans ≠ 1865 slaves), how can *any* guilt apply? Your model either collapses into bloodline metaphysics or absolves vanished collectives."*  
  **Why It’s Deadly**: Forces you to defend group ontology across time—a minefield.  
  **Reply (2 min)**:  
  "Obligations attach to the *institution*, not biological lineages. If the U.S. Treasury held bonds paid to slaveowners, the state owes reparations to the *concept* of justice—administered via best proxies (e.g., funds for systemic racism repair). No need for ‘identical groups’; we target *structural harm*, not bloodlines.  
  **Soft Spot**: Proxies are contestable; risks instrumentalizing victims.  
  **Pre-emptive Concession**: *"This doesn’t ‘justify’ specific reparations—it only shows obligations persist. Distribution is a separate (thorny) debate."*  

  ---

  ### **Strategic Summary**  
  - **Fatal to Ignore**: The agency of institutions (Objection 1). Gut this, your thesis dies.  
  - **Major Threat**: Legal scholar’s liability/guilt collapse (Objection 2). If they sway the room, you lose credibility.  
  - **Distractions**: Semantic debates (Objection 6) or Jaspers-purity (Objection 5). Shut these down fast.  
  - **Nuclear Option**: Nightmare question. If asked, **pivot hard to institutions**: *"The obligation lives in the state’s architecture—not the ghosts of victims or perpetrators."*  

  **Stand Your Ground**: Your core insight—that institutions *outlive regimes* as obligation-bearers—is defensible if you avoid overclaiming moral agency. Anchor replies in *concrete cases* (Stasi files, colonial land deeds). Analysts respect precision; historians respect evidence; lawyers respect precedent. Give all three.
