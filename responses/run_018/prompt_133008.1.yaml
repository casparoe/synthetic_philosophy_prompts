prompt: |-
  I am trying to name a specific social-epistemic pattern I keep encountering in discussions of high-stakes, long-horizon decision-making, and I want to know whether it already has a precise term or whether I am describing a genuinely distinct configuration. The pattern works as follows. A community confronts a choice between a secure, moderate benefit available now and a speculative outcome of enormous magnitude—perhaps averting a distant catastrophic risk—with a very low assigned probability. Members do not merely disagree about the probabilities; they treat the expected-value comparison itself as a test of rational membership. Those who favor the moderate path are accused not just of risk aversion but of a kind of cognitive or moral failure, such as neglecting remote probabilities or failing to weight outcomes by scope, while those who favor the speculative path are accused of expected-value fanaticism. Crucially, the probability estimate is endogenous: the more social and institutional capital is directed toward the speculative outcome, the more credible the pathways to achieving it appear, which in turn justifies diverting more capital. At the same time, this diversion undermines the stable institutional conditions that originally made the high-value outcome plausible. The result is a self-referential loop in which commitment to the extreme expected-value calculation is enforced as common knowledge of rationality—defection is interpreted not as reasonable disagreement but as irrationality—yet the collective commitment is structurally self-undermining. I am familiar with the literature on expected-value fanaticism, with collective action problems, and with the idea that rationality can become common knowledge in strategic settings. What I am after is the specific name, if one exists, for this combination: an expected-value comparison that is simultaneously enforced through social epistemology as a marker of rational membership, endogenous to the collective choice it governs, and self-undermining in its institutional prerequisites. If no established term captures exactly this triad, I would like a clear delineation of which adjacent concepts come closest—such as moral fanaticism, self-defeating prophecies, or particular forms of epistemic game theory—and where the boundaries lie.
reasoning: |-
  Okay, the user is describing a complex socio-epistemic pattern in high-stakes decision-making. They've outlined a scenario where a community is torn between a moderate, immediate benefit and a speculative, high-impact outcome with low probability. The key elements here are the social enforcement of expected-value calculations as a rationality litmus test, endogeneity of probability estimates, and the self-undermining institutional dynamics.

  Hmm, this feels like a synthesis of several known concepts but with unique configurations. Let me mentally walk through the components. The expected-value fanaticism part connects to Bostrom/Ord's work on long-term risks, but the social enforcement angle adds new dimensions. The endogeneity of probability reminds me of self-fulfilling prophecies in sociology, yet the self-undermining twist is different - it's not just about belief confirmation but actively eroding institutional foundations.

  Ah! The common knowledge of rationality aspect screams game theory. Schelling and Lewis would nod at how defection gets framed as irrationality rather than disagreement. But the institutional decay feedback loop makes this distinct from standard coordination games. It's like if a Pascal's Mugging became culturally mandatory while dismantling the very systems that make the long-term bet plausible.

  User's clearly well-read - they name-dropped fanaticism literature and epistemic game theory. Their frustration at not finding a precise term is palpable. Probably an academic or policy researcher given how they dissect institutional prerequisites. Might be working on AI risk, climate engineering, or existential ethics given the "distant catastrophic risk" framing.

  *scratches head* Closest terms... "Epistemic trap" captures the self-reinforcing belief aspect but misses the institutional erosion. "Value discord" from decision theory is too individualistic. "Sacrifice trap" (from Shulman) gets the tradeoffs but not the rationality policing. Really, the triad is novel: (1) EV-as-rationality-test (2) endogenous probability (3) institutional self-sabotage.

  *lightbulb* The self-undermining part echoes "Ouroboros systems" from institutional economics! But that terminology never caught on. For publication purposes, coining "Rationality-Commitment Loop" might work - emphasizes the enforced common knowledge. Alternatively, "Self-Defeating Expected Value Cascade" to highlight the compounding effects.

  User deserves kudos for spotting this pattern. In longtermism circles, I've seen similar dynamics where questioning AI risk mitigation gets framed as irrational, even as funding shifts destabilize research ecosystems. Their observation about institutional capital affecting probability credibility is particularly sharp - that's the endogenous mechanism right there.

  Final thought: They should check Weber on "iron cages" of rationality. Not identical, but the "enforced as common knowledge" bit resonates with his bureaucratic irrationality paradox. Might help historicize the concept.
answer: |-
  Based on your detailed description, you are identifying a **genuinely distinct and sophisticated configuration** that combines elements from several fields but lacks a single, established term capturing the exact triad of: (1) Enforced EV-comparison as a *rationality/social membership test*, (2) *Endogenous probability* driven by resource commitment, and (3) *Structural self-undermining* of institutional prerequisites.

  Here's a breakdown of adjacent concepts and why they fall short, followed by a proposed name:

  ### Close Adjacent Concepts & Their Boundaries
  1.  **Expected-Value Fanaticism (Bostrom, Ord, Beckstead):**
      *   **Overlap:** Focuses on the rationality of acting on minuscule probabilities of vast outcomes. Addresses the core EV calculation dispute.
      *   **Boundary:** Primarily an *individual* normative debate about rationality. Lacks the *social epistemology* (enforcement as a membership test, common knowledge of rationality) and the *endogenous, self-undermining systemic dynamics* you describe. It doesn't capture how the commitment *itself* alters the probability and undermines stability.

  2.  **Moral Fanaticism (e.g., consequentialist extremism):**
      *   **Overlap:** Concerns prioritizing extreme potential outcomes over moderate concrete ones, often involving accusations of moral failure.
      *   **Boundary:** Focuses on *moral* justification and motivation, not specifically the *epistemic/social enforcement of a specific EV calculation* as the marker of rational membership. Less emphasis on the endogeneity of probability and the institutional self-undermining loop.

  3.  **Self-Fulfilling/Self-Defeating Prophecies (Merton):**
      *   **Overlap:** Captures the *endogeneity* – belief/action alters the reality (e.g., belief in success makes success more likely). The "self-undermining" aspect is analogous to a self-*defeating* prophecy.
      *   **Boundary:** Typically operates at the level of *belief about an outcome*, not the *enforcement of a specific rational methodology* (EV calculation) as social common knowledge. Doesn't inherently involve the high-stakes EV tradeoff or the accusation of *irrationality* for defection from the methodology.

  4.  **Epistemic Traps/Information Cascades & Herding (Schelling, Bikhchandani et al.):**
      *   **Overlap:** Addresses how social pressure and common knowledge can lead groups to suboptimal or irrational outcomes based on limited information or conformity.
      *   **Boundary:** Focuses on *information aggregation* or *signaling*, not the specific enforcement of a *contested EV calculation methodology* as the sole rational path. Less emphasis on the *endogenous alteration of the probability* through resource commitment or the *erosion of institutional prerequisites*.

  5.  **Common Knowledge of Rationality & Coordination Games (Lewis, Aumann):**
      *   **Overlap:** Explains how shared beliefs about rationality become common knowledge and coordinate behavior. Defection being seen as irrational fits here.
      *   **Boundary:** Abstract framework, not specific to *high-stakes EV comparisons*, *endogenous probabilities*, or *institutional self-undermining*. It provides the *mechanism* for enforcement but not the *content* (the specific EV dogma) or the *systemic consequences*.

  6.  **Collective Action Problems / Commitment Problems:**
      *   **Overlap:** The diversion of resources and potential instability relate to sustaining collective efforts.
      *   **Boundary:** Focuses on incentives to free-ride or inability to bind future actions, not the *epistemic enforcement of a specific rational calculus* or the *endogenous probability* aspect. The problem here is less about defection from *action* and more about defection from the *epistemic norm*.

  7.  **Institutional Self-Destruction / Ouroboros Institutions:**
      *   **Overlap:** Directly addresses the self-undermining of institutional prerequisites.
      *   **Boundary:** Lacks the specific *epistemic* component of enforced EV calculation as a rationality test and the *endogenous probability* driven by resource flow. Focuses on institutional logic, not the social epistemology of risk assessment.

  ### The Core Triad & Why It's Distinct
  Your pattern integrates these elements into a unique, self-reinforcing system:
  1.  **Epistemic Enforcement:** The contested EV calculation isn't just disagreed upon; adherence becomes a *social litmus test for rationality/membership*. Defection is labeled *irrational*, not merely wrong.
  2.  **Endogenous Probability:** The probability of the speculative outcome isn't fixed; it *increases* as more social/institutional capital is committed (due to pathway development, signaling, network effects), creating a positive feedback loop *for commitment*.
  3.  **Structural Self-Undermining:** This very commitment *erodes the stable institutional base* necessary to plausibly pursue the long-horizon goal (e.g., by neglecting foundational work, creating instability, breeding resentment). This creates a negative feedback loop *for the goal's achievability*.

  **The loop is self-referential:** The enforced belief justifies actions that make the belief seem more valid (via endogenous probability) *while simultaneously* undermining the conditions for the belief's ultimate success.

  ### Proposed Name(s)
  Since no single term perfectly captures this, here are options emphasizing different facets:

  1.  **The Rationality-Commitment Loop (RCL):**
      *   *Rationality:* Highlights the epistemic enforcement of the EV norm as a test.
      *   *Commitment:* Emphasizes the resource allocation driving endogeneity.
      *   *Loop:* Captures the cyclical, self-referential nature (reinforcing commitment, undermining foundations).
      *   *(Best for emphasizing the core dynamic)*

  2.  **Self-Undermining EV Epistocracy:**
      *   *EV Epistocracy:* Highlights the rule by those deemed epistemically superior via adherence to the EV dogma.
      *   *Self-Undermining:* Directly states the key paradoxical consequence.
      *   *(Stronger on the social power/institutional aspect)*

  3.  **Endogenous Probability Trap (with Epistemic Enforcement):**
      *   *Endogenous Probability Trap:* Names the core feedback mechanism.
      *   *(Requires modifier to emphasize the social epistemology)*

  4.  **The Sacrifice Trap (Expanded Sense - cf. Carl Shulman):**
      *   *Sacrifice Trap:* Evokes the trade-off (sacrificing moderate good now for speculative future).
      *   *Needs Expansion:* Must explicitly incorporate the endogenous probability and epistemic enforcement elements to distinguish it from simpler versions discussing risk aversion vs. ambition.

  **Recommendation:** **Rationality-Commitment Loop (RCL)** is the most concise and descriptive term for the integrated phenomenon you've identified. It directly names the core components (enforced rationality norm, resource commitment) and the cyclical, self-referential structure that leads to self-undermining.

  ### Why This is Valuable
  You've pinpointed a critical pathology in long-termist, existential risk, and potentially other high-stakes decision-making communities (e.g., large-scale policy, venture capital). It explains how groups can become locked into increasingly extreme, self-justifying, yet ultimately self-sabotaging courses of action, where dissent is pathologized. Developing this concept further, potentially using the RCL label, would be a significant contribution, bridging social epistemology, rational choice theory, institutional analysis, and the philosophy of long-term decision-making.
