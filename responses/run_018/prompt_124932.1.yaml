  First, I need to reconstruct the implicit theory. The framework assumes procedural justice - justice is about fair rules, not equal outcomes. That's Rawlsian at its core. The baseline is negative liberty: freedom from interference. So if no one's blocking women from engineering, any underrepresentation must be voluntary. This commits to a particular view of autonomy as preference-satisfaction without examining preference formation.

  Interesting how the user flags the social meaning question. The framework treats "preferences" as pre-social atoms when really, gendered preferences are shaped by recognition (Honneth), habitus (Bourdieu), or performativity (Butler). By not questioning preference formation, the model quietly assumes preferences are authentic unless proven otherwise - which stacks the deck against social constructivist views.

  On essentialism vs constructivism: technically the framework could accommodate both, but its focus on barrier-removal makes it more compatible with essentialism. If biology explains gendered preferences, then segregation isn't a justice issue. Whereas strong constructivism would see the preferences themselves as products of unjust social structures - which the framework ignores.

