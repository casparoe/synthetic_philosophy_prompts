prompt: |-
  After a long argument with a friend who insisted that Fomenko's New Chronology and ancient-astronaut narratives deserve the same evidential standing as mainstream historiography—simply because they invoke "methodological symmetry"—I need a practical tool rather than more debate. I work as an acquisitions editor for a general-reference encyclopedia, and I need a reusable decision procedure to evaluate submissions proposing radical chronological revision, whether through statistical textual analysis, technological-anachronism arguments, or claims of suppressed records. The procedure should be grounded in philosophy-of-science demarcation criteria, ask ordered questions, specify what counts as a sufficient answer to each, stop with a clear reject, accept-with-caveats, or escalate-to-expert, and flag precisely where the decision is one of values rather than facts. Apply it to three proposals: a Fomenko-style claim that the Almagest was compiled in the sixteenth century via statistical parallel-text analysis; an argument that megalithic construction precision proves extraterrestrial engineering; and a proposal to revise Bronze Age collapse chronology using new radiocarbon calibration curves, including one case where the procedure yields an answer the asker will dislike. Take a committed position: state definitively whether methodological symmetry—the idea that pseudohistorical claims should be evaluated by standards identical to mainstream ones—has any legitimate place in the decision tree, and defend that choice with reasons rather than options. Finally, include a brief note on where the procedure takes liberties with standard demarcation theory or relies on a contested reading of it.
reasoning: |-
  We are creating a decision procedure for evaluating submissions to a general-reference encyclopedia that propose radical chronological revision. The procedure should be grounded in philosophy-of-science demarcation criteria and have clear steps with specific criteria for rejection, acceptance with caveats, or escalation to an expert. It must also flag where decisions are based on values rather than facts.

  The procedure will have a sequence of questions. Each question must be answered with sufficient evidence. If the submission fails at any question, we can reject it. If it passes all, we may accept (with caveats) or escalate. We are to apply it to three proposals.

  We are also to take a committed position on methodological symmetry: the idea that pseudohistorical claims should be evaluated by standards identical to mainstream ones. We will argue that methodological symmetry does not have a legitimate place in the decision tree because it fails to account for the established body of evidence and the requirement for extraordinary evidence to support extraordinary claims. Mainstream historiography has a well-established methodology and evidentiary base that has been built over centuries and has passed rigorous peer review. Pseudohistorical claims often ignore or dismiss this body of evidence without providing a comparable alternative that meets the same standards.

  Decision Procedure for Radical Chronological Revision Submissions:

  1. **Question 1: Is the claim falsifiable?**
     - **Sufficient Answer:** The claim must make specific, testable predictions that could potentially be proven false. Vague or unfalsifiable claims are rejected.
     - **If No:** Reject. (This is a factual demarcation: falsifiability is a core tenet of science.)
     - **If Yes:** Proceed to Q2.

  2. **Question 2: Does the claim account for the existing body of evidence?**
     - **Sufficient Answer:** The claim must engage with the established evidence in the field. It must either explain why the existing evidence is mistaken (with a coherent and testable reason) or show how the existing evidence is compatible with the new claim. Ignoring or dismissing large bodies of evidence without justification is insufficient.
     - **If No:** Reject. (This is a factual demarcation: a theory that does not account for known evidence is inadequate.)
     - **If Partially/With Caveats:** Proceed to Q3 with a note that the claim has a significant burden of proof to overcome.
     - **If Yes:** Proceed to Q3.

  3. **Question 3: Does the claim provide novel positive evidence?**
     - **Sufficient Answer:** The claim must present new evidence (e.g., from a new discovery, a new analysis of existing data, or a new method) that directly supports the revision. The evidence must be of a kind that can be independently verified and must be substantial enough to warrant reconsideration of the established view. Extraordinary claims require extraordinary evidence.
     - **If No:** Reject. (This is a factual demarcation: without positive evidence, the claim is merely speculative.)
     - **If Yes:** Proceed to Q4.

  4. **Question 4: Is the evidence presented free of known methodological flaws?**
     - **Sufficient Answer:** The methods used to gather or analyze the evidence must be sound and free from known errors (e.g., statistical fallacies, anachronistic assumptions, circular reasoning). The submission must demonstrate that the methods have been validated or are standard in a relevant field.
     - **If No:** Reject. (This is a factual demarcation: flawed methods invalidate the evidence.)
     - **If Yes:** Proceed to Q5.

  5. **Question 5: Does the claim have explanatory power?**
     - **Sufficient Answer:** The revised chronology must provide a more coherent explanation of historical events than the mainstream view. It should resolve anomalies without creating more significant problems. The explanation should be simpler (following Occam's razor) or account for a broader range of phenomena without undue complexity.
     - **If No:** Reject. (This is a factual demarcation: a theory with less explanatory power is inferior.)
     - **If Yes:** Proceed to Q6.

  6. **Question 6: Has the claim undergone independent peer review?**
     - **Sufficient Answer:** The claim must have been subjected to critical evaluation by experts in the relevant field (e.g., published in a peer-reviewed journal, presented at academic conferences, or reviewed by independent scholars). The peer review should have addressed the specific claims and methods.
     - **If No:** Escalate to an expert for review. (This step involves values: we are an encyclopedia and must balance openness with reliability. Without peer review, we cannot be sure of the claim's validity, but it might be worth an expert look if it passed the previous steps.)
     - **If Yes, and it passed peer review:** Proceed to Q7.
     - **If Yes, and it was rejected by peer review:** Reject, unless there are compelling reasons to believe the peer review was flawed (then escalate to expert).

  7. **Question 7: Does the claim align with the encyclopedia's editorial standards for inclusion?**
     - **Sufficient Answer:** Even if the claim passes the above, we must consider the encyclopedia's mission to provide reliable, established knowledge. For a general-reference work, we prioritize consensus views. However, we might include well-supported minority views with appropriate caveats. The decision here is based on values: the balance between innovation and reliability, and the potential to mislead readers.
     - **If the claim is highly speculative and lacks broad scholarly support:** Reject or accept with strong caveats (e.g., presenting it as a fringe theory). This is a values-based decision.
     - **If the claim has gained some traction in the scholarly community but is still minority:** Accept with caveats (e.g., "some scholars propose... but this is not the consensus view").
     - **If the claim is well-supported and has begun to shift the consensus:** Accept as a legitimate alternative view.

  Now, we apply the procedure to three proposals:

  **Proposal 1: Fomenko-style claim that the Almagest was compiled in the sixteenth century via statistical parallel-text analysis.**

  - Q1: **Falsifiable?** Yes, one could compare the statistical methods and see if they hold up to scrutiny. Also, one could date the manuscript independently (e.g., carbon dating) and check historical records.
  - Q2: **Accounts for existing evidence?** No. The claim ignores the vast body of evidence (astronomical observations recorded in the Almagest that match the sky in the 2nd century AD, historical references, manuscript traditions, etc.) without a coherent explanation for why this evidence is wrong. It dismisses mainstream evidence as forgeries without proof. → **Reject.**

  **Proposal 2: Argument that megalithic construction precision proves extraterrestrial engineering.**

  - Q1: **Falsifiable?** Technically yes (if we found clear evidence of non-human technology, that would support it; if we found evidence of human methods, it would falsify). But note: the claim is extraordinary.
  - Q2: **Accounts for existing evidence?** No. It ignores the growing body of archaeological evidence showing how humans could have built megaliths (e.g., experimental archaeology, tool marks, quarry sites). It dismisses human ingenuity without justification. → **Reject.**

  **Proposal 3: Revision of Bronze Age collapse chronology using new radiocarbon calibration curves.**

  - Q1: **Falsifiable?** Yes. Radiocarbon dating is a scientific method that can be independently verified and calibrated.
  - Q2: **Accounts for existing evidence?** The proposal must show how the new calibration curves affect the existing chronology and address the current evidence (e.g., stratigraphy, dendrochronology, historical records). Let's assume the submission does this.
  - Q3: **Novel positive evidence?** Yes, the new calibration curves are the evidence. They are a result of ongoing scientific refinement.
  - Q4: **Free of methodological flaws?** We must check if the calibration curves are accepted by the scientific community. If they are from a reputable source (e.g., IntCal) and the statistical methods are sound, then yes.
  - Q5: **Explanatory power?** The revised chronology might resolve some anomalies (e.g., mismatches between radiocarbon dates and historical events). If it does, then yes. But note: it might create new problems (e.g., with dendrochronology). The submission must show that the new chronology is better.
  - Q6: **Independent peer review?** If the new calibration curves have been published in peer-reviewed journals and the specific application to the Bronze Age collapse has been peer-reviewed, then yes. But let's assume that the submission is the first to apply these curves to the Bronze Age collapse and hasn't been peer-reviewed. Then we must escalate to an expert.
  - Q7: **Editorial standards?** If the expert review is positive, then we might accept with caveats (e.g., "a recent study using updated calibration curves suggests... but this is still being debated"). However, if the expert review points out flaws, we reject.

  Now, the case where the procedure yields an answer the asker will dislike: 
  In Proposal 3, if the new calibration curves are not yet accepted by the broader scientific community (e.g., they are from a preprint or a controversial source) and the application to the Bronze Age collapse is not peer-reviewed, then even if the previous steps passed, we would not accept it immediately. We would escalate to an expert. The expert might then reject it because of unresolved conflicts with other dating methods. The asker (who proposed the revision) would dislike that we are not publishing their groundbreaking work.

  **Committed Position on Methodological Symmetry:**
  We definitively state that methodological symmetry does not have a legitimate place in the decision tree. The reason is that mainstream historiography has already established a body of evidence and a methodology that has been tested and refined over time. Pseudohistorical claims often start from a position that rejects this body of evidence without providing a comparable alternative. They also frequently fail to meet the standards of evidence required in the mainstream (e.g., peer review, falsifiability, explanatory power). Therefore, we require that any radical claim must first account for the existing evidence and then provide extraordinary evidence to overturn the established view. This is in line with the principle that extraordinary claims require extraordinary evidence (Carl Sagan). Methodological symmetry would give equal weight to claims that have not undergone the same rigorous scrutiny, which could mislead readers and undermine the encyclopedia's reliability.

  **Note on Liberties with Demarcation Theory:**
  The procedure takes liberties by blending multiple demarcation criteria (falsifiability, explanatory power, peer review) and by incorporating practical considerations (such as the need for peer review as a safeguard in an encyclopedia context). Standard demarcation theory (e.g., Popper's falsifiability) is often applied to science, but we extend it to historiography. This is contested because historiography is not a hard science and sometimes relies on interpretive methods. However, we argue that the core principles of testability, evidence, and explanatory power are applicable. Also, the inclusion of peer review as a step is a pragmatic addition that goes beyond classic philosophy of science but is necessary for ensuring reliability in a reference work.
answer: |-
  ### Decision Procedure for Evaluating Radical Chronological Revisions  
  **Grounding in Demarcation Criteria**: Based on Karl Popper (falsifiability), Imre Lakatos (progressive vs. degenerative research programs), and Susan Haack (evidential integration). Rejects methodological symmetry—pseudohistorical claims must meet *higher* evidential thresholds to overturn established consensus.  

  #### Decision Tree (Ordered Questions)  
  1. **Is the claim empirically falsifiable?**  
     - *Sufficient answer*: Specific, testable predictions that conflict with mainstream models (e.g., "If X is true, then artifact Y must date to Z century").  
     - *Failure*: Reject (e.g., claims relying on unfalsifiable entities like "suppressed records").  
     - *Values flag*: None (factual).  

  2. **Does it engage with the full body of existing evidence?**  
     - *Sufficient answer*: Addresses ≥90% of core evidence (e.g., textual, archaeological, scientific) without *ad hoc* dismissals. Must explain *why* mainstream interpretations are flawed.  
     - *Failure*: Reject (e.g., ignoring carbon dates or contemporary inscriptions).  
     - *Values flag*: None (factual).  

  3. **Is the evidence reproducible and methodologically robust?**  
     - *Sufficient answer*: Methods must be standard in relevant fields (e.g., statistics, physics) or validated in peer-reviewed literature. Results must be replicable by third parties.  
     - *Failure*: Reject (e.g., proprietary algorithms, unreviewed techniques).  
     - *Values flag*: None (factual).  

  4. **Does it provide superior explanatory power?**  
     - *Sufficient answer*: Resolves anomalies better than mainstream models *without* creating more contradictions (Lakatos' "progressive problemshift"). Simplicity (Occam’s razor) is weighted.  
     - *Failure*: Reject (e.g., "aliens did it" adds unnecessary entities).  
     - *Values flag*: None (factual).  

  5. **Has it survived peer scrutiny?**  
     - *Sufficient answer*: Published in Q1 journals in relevant fields (history, archaeology, physics) or endorsed by ≥3 independent experts.  
     - *Insufficient*: Escalate to expert (e.g., novel but untested radiocarbon curves).  
     - *Failure*: Reject (e.g., only self-published or pseudojournals).  
     - *Values flag*: **Yes** (editorial judgment on source reliability).  

  6. **Does it align with encyclopedia’s epistemic responsibility?**  
     - *Sufficient answer*: If steps 1–5 pass, accept with caveats (e.g., "a minority view argues..."). Reject if inclusion risks misleading nonspecialists (Haack’s "intellectual due process").  
     - *Values flag*: **Yes** (social duty to avoid legitimizing fringe theories).  

  #### Application to Proposals  
  **Proposal 1: Fomenko’s Almagest Redating**  
  - Q1: Falsifiable? **Yes** (statistical mismatches could be tested).  
  - Q2: Engages evidence? **No** (ignores Byzantine/Greek manuscripts, star positions). → **REJECT**.  
  - *Failure point*: Dismisses textual transmission evidence as "medieval forgeries" without proof.  

  **Proposal 2: Megalithic Extraterrestrial Engineering**  
  - Q1: Falsifiable? **Barely** (no testable mechanism for alien intervention).  
  - Q2: Engages evidence? **No** (ignores experimental archaeology showing human capability). → **REJECT**.  
  - *Failure point*: Violates Occam’s razor; "aliens" explain nothing new.  

  **Proposal 3: Bronze Age Collapse via New Radiocarbon Curves**  
  - Q1: Falsifiable? **Yes** (recalibration affects dating).  
  - Q2: Engages evidence? **Yes** (compares dendrochronology, pottery sequences).  
  - Q3: Methodologically robust? **Yes** (curves from published geoscience studies).  
  - Q4: Explanatory power? **Partial** (resolves dating mismatches but conflicts with Hittite records).  
  - Q5: Peer scrutiny? **Insufficient** (curves peer-reviewed, *application to collapse not yet tested*). → **ESCALATE TO EXPERT**.  
  - *Disliked outcome*: Expert review may reject due to conflicts with textual evidence.  

  #### Rejection of Methodological Symmetry: A Committed Position  
  **No**, methodological symmetry has **no legitimate place** in the decision tree.  
  - **Reason 1**: Mainstream historiography rests on a *coherent evidence web* (cross-validated texts, archaeology, and science). Granting symmetry to pseudohistory ignores its failure to integrate into this web (Lakatos' "degenerative program").  
  - **Reason 2**: Extraordinary claims require extraordinary evidence (Sagan’s maxim). Symmetry falsely equates radical hypotheses (e.g., "16th-century Almagest") with incremental scholarship (e.g., revising dates via new carbon samples).  
  - **Reason 3**: As an editor, your duty is to *readers*, not abstract neutrality. Symmetry would force equal treatment of well-supported theories and those invoking conspiracies (e.g., "suppressed records"), violating epistemic responsibility.  

  #### Liberties with Demarcation Theory  
  - **Popperian Focus**: Prioritizes falsifiability (Q1) over Kuhn’s paradigms, risking dismissal of nascent but valid challenges. Defended because encyclopedias require high-confidence claims.  
  - **Peer Review as Gatekeeper**: Contested (e.g., Feyerabend’s anarchism), but justified here to filter out noise in a general-reference context.  
  - **Values in Demarcation**: Explicitly flags Q5–Q6 as value-laden, contra strict positivists. Necessary for Haack’s "responsible epistemology" in public-facing work.  

  **Final Output**: This procedure prioritizes evidence integration and reader trust, rejecting symmetry as a false equivalence. It escalates only claims clearing factual hurdles (Q1–Q4) but lacking consensus, reserving editorial judgment for the final gate.
