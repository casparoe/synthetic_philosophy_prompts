answer: |-
  Your observation captures two distinct yet related protective strategies in scientific practice, both falling under the broader umbrella of **theory-preservation mechanisms** but differing in their epistemological structure and legitimacy. Neither has a single universally accepted name, but we can precisely characterize them:

  ### 1. **Taxonomic Refinement (Biological Case)**
     - **Mechanism**: When a counterexample arises, the original category is split into subcategories. The generalization holds *within* the refined subcategory, preserving the core inductive claim while accommodating the exception.
     - **Philosophical Status**: This is generally viewed as **progressive knowledge refinement**. It aligns with:
       - **Natural Kinds Ontology**: Assumes categories reflect real-world structures. Counterexamples reveal hidden complexity, prompting better taxonomy (e.g., splitting "fish" into jawless/cartilaginous/bony after discovering lungfish).
       - **Lakatosian "Problem-Shift"**: A "progressive problemshift" if the new taxonomy predicts *new* phenomena (e.g., revised clades imply undiscovered fossils).
     - **Boundary**: Legitimate when:
       - Subdivisions are empirically grounded (e.g., genetic/morphological evidence).
       - The core generalization retains predictive power in its revised domain.
       - It generates novel research questions.

  ### 2. **Retroactive Domain Restriction (Meteorological Case)**
     - **Mechanism**: An implicit, post-hoc exception is added (e.g., "except during anomalous events"), constructed *using the counterexample itself*. The model's formal structure remains unchanged, but its scope is restricted tacitly.
     - **Philosophical Status**: This is **degenerative theory-protection** and resembles:
       - **Immunizing Stratagems** (Popper): Protecting a theory from falsification by introducing untestable exceptions.
       - **Ad Hoc Adjustment**: But with a critical twist: the exception is not a new *testable* hypothesis (like adding epicycles), but a semantic retreat. It exploits vagueness in "anomalous conditions."
     - **Key Problem**: The restriction is **retroactively justified by the failure it explains**, creating circularity. No *independent criteria* for "anomaly" exist *before* the event.
     - **Boundary**: Illegitimate when:
       - The exception is unfalsifiable ("anomaly" is defined solely by the model's failure).
       - It offers no new predictions.
       - It hides the model's reduced empirical content.

  ### Distinguishing Them from Classic Concepts
  - **vs. Grue Paradox**: Grue involves redefining predicates *in advance* with arbitrary time-dependence. Your cases involve *post-hoc* domain adjustments without redefining predicates.
  - **vs. Auxiliary Hypotheses**: Legitimate auxiliary hypotheses (e.g., Neptune explaining Uranus's orbit) are *independently testable*. The meteorological case lacks this; its "exception" is a placeholder for ignorance.
  - **vs. Ordinary Ad Hoc Adjustment**: Typical ad hoc fixes add testable complexity (e.g., epicycles). The meteorological strategy avoids even this—it *semantically restricts* the domain without structural revision.

  ### Are These One Phenomenon or Two?
  They represent **two distinct mechanisms** under the broad goal of theory-preservation:
  - **Taxonomic Refinement** revises the *ontology* (what entities exist) to save the generalization. It's **content-increasing**.
  - **Retroactive Domain Restriction** revises the *applicability conditions* while keeping ontology fixed. It's **content-decreasing** (reduces the theory's scope without new insights).

  ### Proposed Terminology
  1. **Progressive Taxonomic Differentiation**: For the biological case.  
  2. **Retroactive Immunizing Restriction (RIR)**: For the meteorological case. This emphasizes its circular, protective nature.

  ### Philosophical Significance
  - **Taxonomic refinement** is often defensible within a **scientific realism** framework, where categories approximate natural divisions.
  - **RIR** is symptomatic of **degenerating research programs** (Lakatos). It obstructs scientific progress by masking inadequacies without yielding new understanding. Climate models relying on unexplained "anomalies" to survive falsification risk this pitfall.

  ### Conclusion
  You’ve identified two nuanced forms of inductive protection:
  - One (**taxonomic refinement**) is a valid response to discovering complexity in natural kinds.  
  - The other (**retroactive domain restriction**) is a degenerative practice that exploits vagueness to evade falsification.  
  While both protect theories, their epistemic status differs radically. **RIR** deserves scrutiny as a distinct form of immunization—one where the act of protection itself erodes the theory’s empirical integrity. No standard term exists for RIR, making your observation a valuable contribution to critiques of scientific practice. For your seminar, framing these as "**ontological vs. operational preservation strategies**" could clarify their divergence.
