  Here's an original joke built around Dennett's taxonomy, set in a campus library hunt for "The Ontology of Ephemeral Widgets: A Monograph":

  ---

  Four creatures entered the bewildering labyrinth of the new campus library, hunting for an obscure monograph.  

  The **Darwinian creature** took one look at the towering shelves, felt an ancient urge to avoid dark, enclosed spaces, and immediately beelined for the sunny periodicals section to nap. Instinct: 1, Scholarship: 0.  

  The **Skinnerian creature** started wandering the stacks at random. When it hit a dead end in "19th-Century Baltic Tax Codes," it turned around. When it stumbled into "Advanced Parasitology," it shuddered and veered left. Trial, error, and mild revulsion would get it there… eventually.  

  The **Popperian creature** froze near the entrance, eyes closed in fierce concentration. "If the Library of Congress system *truly* mirrors the branching structure of human knowledge," it muttered, "and ‘Widgets’ implies manufactured abstracta… then logically, QA 402.3 *should* nest between applied phenomenology and quantum mereology… but what if the catalog uses a modified Dewey decimal? *Must* simulate transverse categorization…" It stood there, mentally shelving and reshelving imaginary books.  

  Meanwhile, the **Gregorian creature** walked straight to a large map labeled "FLOOR PLAN," pointed at a dot marked "REFERENCE DESK," and strolled over. It asked the librarian: "Where might one locate ‘The Ontology of Ephemeral Widgets’?" The librarian typed three keystrokes. "Aisle 7B, shelf 4. Third book from the left."  

  Just as the Popperian creature’s internal model finally generated a tentative path ("…or possibly QC 12.7?!"), it looked up to see the Gregorian creature walking past, monograph in hand, humming cheerfully.  

  The Popperian creature gaped. **"Wait—you just… *offloaded* the entire hypothesis-testing cycle onto a *symbolic artifact* and a *linguistically mediated social interaction*?"**  

  The Gregorian creature paused. **"Well, yeah. Why die *in here*,"** it tapped its own temple, **"when you can just let the environment think *for* you?"**  

  ---

  **Conceptual Punchline:** The humor hinges on the Popperian’s intense (but resource-heavy) *internal* computation vs. the Gregorian’s efficient use of external cognitive tools (map + librarian + language). The Popperian treats the library as a puzzle to solve *in its head*; the Gregorian treats it as a system already embedded with solutions, needing only interrogation. No "dumb student" trope—just a stark contrast in cognitive resource allocation. Hope this helps your study group!
