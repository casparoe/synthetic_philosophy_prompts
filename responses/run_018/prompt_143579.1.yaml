prompt: |-
  Next week I'm presenting at our AI-philosophy reading group a 20-min talk defending this: that "avoid side effects" for a low-impact agent can be defined structurally, without first solving value alignment, by using what I'm calling relational invariance — the agent has to preserve the conditional independence structure among variables outside its task envelope, regardless of what values those variables carry. The audience is split: about half are formal AI-safety folks who know causal impact measures and decision-theoretic derivations cold, plus a couple philosophers of science who think any "envelope" is just value-laden boundary-drawing in disguise. The other half are moral philosophers who worry that "invariance" is a thick normative concept smuggled into an apparently neutral formalism. I want a prep sheet for the Q&A: list the objections in roughly the order they'll come, phrased in the vocabulary each camp actually uses, with for each one whether it's serious, what I should concede, what I should hold, and a quick reply I can actually deliver in 30 seconds. Also tell me the one weak point in my own position that I should prepare to defend rather than hope they miss, and flag the objection I'm secretly praying nobody raises. I don't need generic summaries or reading lists.

  Please structure your reply like this:

  - Audience map & thesis recap (brief, ~3 sentences)
  - Objection 1 through Objection 5 (each ~80-120 words; include speaker, phrasing, seriousness, concession, hold, reply)
  - The dreaded hidden objection (the one I'm hoping they skip, with why it's dangerous and a 2-sentence reply)
  - My weakest point (the crack in my arguement, with a defense and an honest admission)
  - Opening concession (what I should say up front to disarm them, ~4 sentences)

  Keep it practical and in the weeds — don't just tell me "some people think values are involved." I need the actual moves.
