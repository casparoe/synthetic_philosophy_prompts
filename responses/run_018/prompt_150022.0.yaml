prompt: |-
  hey, i've been lurking these forums for like a decade and this is probably too in the weeds but whatever.

  i run program evaluation for a small ngo that pitches behavior-change campaigns to universities and city councils — meatless mondays, bike-to-work nudges, local voter drives, staff flight offsets. every couple weeks i get a proposal and i have to tell the board whether it's worth our institutional credibilty to back it, given that one person's burger or vote doesn't move the needle on climate or election outcomes. classic inefficacy objection stuff, except the board is full of rationalist-adjacent people and they want something more rigorous than vibes.

  i need a reusable decision procedue — flowchart in words — that my review team (no philosphy phd, maybe 20 minutes per proposal, i sign off) can actually run. ground it in whatever moral philosphy actually says about individual contributions to collective harms, but don't lecture me. the key is handling three failure modes of the inefficacy objection: expected-value/threshold effects, signaling and coordination spillovers, and the normative 'do it anyway' layer. for each step say what counts as a sufficient answer, where we hard-stop with "no — don't back this as harm-reduction," and where we have to kick it to the board because it's values not facts. also flag the substitution-elasticity check — like, if people skip beef but the supply chain just redirects it, that's different from actually reducing slaughter.

  run it on three proposals:
  1. a "meatless monday" pledge for campus dining (this one should come back with an answer i don't love — i lean vegan but the procedue should probably say causal impact is below noise floor, back only if we explicitly frame it as values-expression not harm-reduction)
  2. a carpool mandate for a 200-person office to cut commute emissions
  3. a voter-turnout drive for a municipal race with about 8,000 registered voters

  say exactly what the procedue can't do — e.g., it won't settle whether collective-harm obligations exist in the first place, or whether we're picking the right counterfactual baseline. no bibliographies, no reading lists, don't quote anyone verbatim unless you can fetch the source. keep it practical.
reasoning: |-
  Alright, the user runs program evaluation for a small NGO focused on behavior-change campaigns. They need a reusable decision procedure to assess proposals against the inefficacy objection—basically, whether individual actions matter in collective harm scenarios. The board is rationalist-adjacent, so they want rigor, not just vibes. 

  First, I need to unpack the core challenge: How to evaluate if a campaign's individual actions actually contribute to harm reduction when each action seems negligible. The user mentioned three failure modes: expected-value/threshold effects (e.g., tipping points), signaling/spillovers (social influence), and the normative "should we do it anyway" layer. Plus, substitution elasticity (like if reducing beef consumption just redirects supply instead of reducing it).

  The user also wants this procedure to be practical—usable by a team without philosophy PhDs, taking about 20 minutes per proposal. They provided three test cases: Meatless Monday, a carpool mandate, and a voter turnout drive. The procedure should flag where decisions hinge on values vs. facts and where to hard-stop or kick to the board.

  I should start by breaking down the inefficacy objection. Philosophers like Derek Parfit and Shelly Kagan have addressed this. Parfit's "Harmless Torturers" shows how individual actions aggregate. Kagan's work on thresholds and marginal contributions is key here. The procedure needs to check for actual causal impact, not just symbolic value.

  For the Meatless Monday example, the user expects a "no" on harm-reduction grounds but might allow it as values-expression. That's a clue: the procedure must distinguish between real impact and symbolic campaigns. Substitution elasticity is critical here—if the reduced demand doesn't lower production, it's ineffective.

  For the carpool mandate, co-benefits like reduced parking demand and social norms might tip the scales. The voter drive could hinge on the election's margin—if it's close, each vote matters more. The procedure should assess these factors systematically.

  Next, structuring the steps. The user wants a flowchart in words. Key phases: causal pathway, substitution check, threshold/EV, spillovers, and normative layer. Each step needs clear pass/fail criteria and where to stop. For example, if substitution elasticity is high (like beef redirecting to other markets), that's a hard stop for harm-reduction claims.

  Also, highlighting what the procedure can't do—like debating whether collective obligations exist. That's a board-level values question. The team should focus on measurable factors and kick normative decisions upstairs.

  Testing the examples:
  - Meatless Monday: Fails substitution check (beef supply chain adjusts) and low EV. Can only back as values-expression, not harm-reduction.
  - Carpool: Passes substitution (emissions are direct), possible scale benefits, and co-benefits. Likely a "yes" but with monitoring.
  - Voter Drive: Depends on election closeness. If margin is tight, high EV per vote. Otherwise, might rely on spillover effects.

  The user's unspoken needs? They want credibility with a skeptical board, efficiency for their team, and clarity on when to escalate. They might also fear their vegan bias could cloud judgments, so the procedure must enforce objectivity. Ensuring the steps are concrete—like requiring quantifiable thresholds or specific evidence types—will help.
answer: |-
  Here's a reusable decision procedure for evaluating behavior-change proposals against the inefficacy objection, designed for speed and practical use. Grounded in collective action ethics (Parfit, Kagan, Nefsky) and causal inference, it handles your three failure modes explicitly.

  ---

  **Decision Procedure: "Collective Impact Filter"**  
  *(Run sequentially; stop at first "No" or "Kick" unless noted)*

  1.  **Causal Pathway & Baseline:**
      *   *Question:* Does the action *directly* disrupt a harmful system (e.g., reduce emissions, prevent votes for a harmful policy) *within the campaign's scope*? Describe the *specific* causal link to harm reduction.
      *   *Sufficient Answer:* Clear, direct mechanism (e.g., "Fewer car commutes → Lower tailpipe emissions today"; "Increased votes for Candidate X → Higher chance of policy Y passing").
      *   *Hard Stop (No):* No plausible direct causal link to measurable harm reduction within scope (e.g., vague "raising awareness" without measurable outcome).
      *   *Kick to Board:* Only if the *definition* of harm itself is contested for this proposal (rare).

  2.  **Substitution/Elasticity Check:**
      *   *Question:* Will the reduced harmful activity likely be *offset* elsewhere in the system, negating the reduction? (e.g., uneaten beef resold, unused parking spot taken by another driver).
      *   *Sufficient Answer (Pass):** Evidence of low elasticity/short-term fixity (e.g., perishable food spoils, commute trips are hard to instantly replace, a vote cast is final). *Or*, campaign includes explicit system-level intervention (e.g., dining hall contract clause reducing meat orders).
      *   *Hard Stop (No):* High risk of full offset with no mitigating factors (e.g., generic "reduce beef consumption" without supply chain coordination - slaughter volumes adjust slowly via global markets).
      *   *Kick to Board:* Insufficient data on elasticity; requires value judgment on risk tolerance.

  3.  **Expected Value / Threshold Test:**
      *   *Question A (Aggregate Scale):** Is the *total* expected participation large enough that the *aggregate* impact is measurable and exceeds implementation costs + noise? (Estimate: Participants * Avg. Impact Per Participant > Cost + Noise Floor).
      *   *Question B (Marginal Impact):** Is there a plausible *threshold* or *non-linear effect* where individual actions *collectively* trigger a significant change? (e.g., tipping an election, hitting a contract volume clause, critical mass for norm shift).
      *   *Sufficient Answer (Pass):** "Yes" to A *or* B. (A: e.g., "200 carpoolers * 10kg CO2/day saved >> measurement error"; B: e.g., "Election margin < expected turnout boost", "Dining hall contract has volume discount threshold near pledge goal").
      *   *Hard Stop (No):** "No" to both A & B – aggregate impact demonstrably negligible *and* no credible threshold mechanism (e.g., 50 people skipping beef once has no measurable supply-chain effect and no contractual trigger).
      *   *Kick to Board:** Threshold is plausible but highly uncertain.

  4.  **Signaling/Coordination Spillovers:**
      *   *Question:** Does the campaign have credible pathways to create *broader change* beyond direct participation? (e.g., norm shifts, policy precedents, network effects, skill-building enabling future action).
      *   *Sufficient Answer (Pass):** Specific, evidence-backed mechanisms (e.g., "Pilot mandates create templates for city adoption", "Voter contact data builds permanent capacity", "Visible carpool lanes incentivize others").
      *   *Pass-Through (No Hard Stop):** If Step 3 failed, this is the *only* remaining harm-reduction rationale. Requires STRONGER evidence of high spillover potential to justify backing. If weak, leads to "No" or "Kick".
      *   *Kick to Board:** Spillover potential is central but highly speculative or values-dependent (e.g., "Symbolically affirms our values" is purely normative).

  5.  **Normative Layer / "Do It Anyway":**
      *   *Question:** If harm reduction is weak/non-existent (Failed Step 3 & Weak Step 4), is there a *compelling non-consequentialist reason* to back it *solely* as values expression or integrity? (e.g., consistency with core mission, intrinsic wrongness of the act).
      *   *Kick to Board (Always):** This is purely a values/strategic decision. The procedure flags: "Harm reduction rationale insufficient. Back only if explicitly framed as values expression/integrity, NOT harm reduction." Requires board buy-in on framing.

  ---

  **What This Procedure CANNOT Do:**
  *   Settle foundational debates about moral obligations in collective harm cases.
  *   Define the "correct" counterfactual baseline definitively (relies on reasonable estimates).
  *   Precisely quantify highly uncertain thresholds or spillovers (flags uncertainty).
  *   Replace cost-effectiveness analysis against other interventions.
  *   Resolve deep value conflicts within the board.

  ---

  **Application to Your Proposals:**

  1.  **Meatless Monday Pledge (Campus Dining):**
      *   **Step 1 (Causal):** PASS. Less beef consumed → lower demand (direct link).
      *   **Step 2 (Substitution):** HARD STOP (NO). High elasticity risk. Uneaten campus beef likely diverted (sold cheaper elsewhere, processed, slightly lowers future orders). No contractual mechanism to force slaughter reduction. *Harm-reduction claim fails.*
      *   *Procedure Output:* **"NO - Do not back as harm-reduction."** *Spillovers (Step 4)?* Possible norm shift, but weak evidence for significant impact. *Normative (Step 5)?* **Kick to Board:** "If backed, must explicitly frame as values expression ('rejecting factory farming'), NOT climate/animal harm reduction."

  2.  **Carpool Mandate (200-Person Office):**
      *   **Step 1 (Causal):** PASS. Fewer car trips → immediate emission reduction (tailpipe).
      *   **Step 2 (Substitution):** PASS (Low Risk). Commute trips aren't easily replaced instantly; freed parking *might* induce *some* demand, but net reduction is very likely (elasticity low short-term).
      *   **Step 3 (EV/Threshold):** PASS (Aggregate Scale). 200 people * Avg commute emissions reduction (e.g., 0.5 tons CO2e/week) >> noise. Measurable impact.
      *   *Procedure Output:* **"YES - Back as harm-reduction."** (Spillovers like reduced parking demand are bonus).

  3.  **Voter Turnout Drive (Municipal Race - 8000 Voters):**
      *   **Step 1 (Causal):** PASS. More votes cast → higher chance of preferred candidate/policy winning.
      *   **Step 2 (Substitution):** PASS (N/A). Votes are not fungible/transferable.
      *   **Step 3 (EV/Threshold):** CRITICAL QUESTION. **Check Polling/Margin:**
          *   *If Race is TIGHT (e.g., <3% margin, <240 votes):* PASS (Threshold). Each vote has high expected value. **YES - Back.**
          *   *If Race is a BLOWOUT (e.g., >15% margin):* FAIL (Aggregate & Threshold). Expected impact per vote negligible, no threshold. Proceed to Step 4.
      *   **Step 4 (Spillovers):** *If Step 3 Failed:* STRONG potential (e.g., builds voter contact lists, habit formation, signals engagement for future races). Likely PASS with good design. **YES - Back (primarily for spillover potential).**
      *   *Procedure Output:* **"YES - Back."** Rationale depends on race closeness or spillover strength. (Only go to Step 5/Normative if weak spillovers in a blowout race - then **Kick to Board**).

  ---
  **Execution Notes for Your Team:**
  *   **20-Minute Focus:** Steps 1 & 2 are usually quick. Spend most time on Step 3 (EV/Threshold estimates) using best available data (polls, participation estimates, emission factors). Step 4 requires experience - lean on past evidence.
  *   **"Kick to Board" Meaning:** Clearly state: "The evidence on [X] is inconclusive/value-laden. Recommend [Action] based on [Summary], but requires your judgment on [Specific Uncertainty/Value]."
  *   **Sign-Off:** You review the team's analysis against these steps, ensuring each answer is justified and stop/kick rules are followed. The procedure forces explicit reasoning on the key failure modes.
