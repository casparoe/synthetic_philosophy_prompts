  ### Taxonomy of Tranquilist Positions: Decision Tree  
  *Instructions: Answer each branch question based on concrete cases. Traverse the tree to identify positions within or adjacent to tranquilism (intrinsic value only in absence of craving/suffering). Positions are named if recognizable; unnamed leaves include a brief diagnosis of why they may be undefended.*  

  ---

  #### **First Split: Nature of Tranquility**  
  *Case: A being exists in permanent anhedonia—free of pain and desire but reporting no subjective content (no joy, peace, or awareness).*  
  → **Branch 1.1:** This state fully realizes intrinsic value; tranquility is purely the **absence** of craving/suffering (Privative).  
  → **Branch 1.2:** This state lacks intrinsic value; tranquility requires a **positive qualitative state** (e.g., peace, release) beyond mere absence (Positive-State).  

  ---

  #### **For Branch 1.1 (Privative Tranquility)**:  
  #### **Second Split: Status of Meta-Craving**  
  *Case: A practitioner takes a compound that eliminates all craving but induces a subtle background contentment. The compound works instantly, bypassing meditative practice.*  
  → **Branch 2.1:** The resulting state is *as valuable* as natural desire-cessation; meta-craving (desire for no-desire) is **permissible** if instrumental.  
  → **Branch 2.2:** The resulting state is *less valuable*; meta-craving is **self-defeating** and voids tranquility.  

  #### **For Branch 1.2 (Positive-State Tranquility)**:  
  #### **Second Split: Status of Meta-Craving**  
  *Same case as above.*  
  → **Branch 2.1:** The resulting state is *as valuable*; contentment satisfies the positive-state requirement, making meta-craving **permissible**.  
  → **Branch 2.2:** The resulting state is *less valuable*; authentic tranquility requires organic desire-cessation, making meta-craving **self-defeating**.  

  ---

  #### **For All Paths Above**:  
  #### **Third Split: Scope of Concern**  
  *Case: An engineered ecosystem contains simple organisms (e.g., bacteria, robots) that functionally avoid noxious stimuli but lack phenomenal consciousness or awareness.*  
  → **Branch 3.1:** These systems have tranquilist **moral standing**; intrinsic disvalue applies to any functional suffering/avoidance.  
  → **Branch 3.2:** These systems have **no moral standing**; intrinsic disvalue requires phenomenal consciousness (sentience).  

  ---

  #### **For All Paths Above**:  
  #### **Fourth Split: Ecological Intervention**  
  *Case: A program eliminates predation in wild ecosystems but requires constant human monitoring that generates mild stress and craving in technicians.*  
  → **Branch 4.1:** Intervention is **obligatory**; suffering is the sole disvalue, and natural processes lack moral weight.  
  → **Branch 4.2:** Intervention is **forbidden**; it introduces new disturbances, dependencies, and human craving.  
  → **Branch 4.3:** Intervention is **value-indifferent**; natural processes carry no moral weight, making intervention neither required nor prohibited.  

  ---

  ### Terminal Leaves (Positions)  
  *Combinations yield 16 leaves. Named positions are recognized in ethical discourse; unnamed are coherent but undefended.*  

  #### **From Branch 1.1 (Privative Tranquility)**:  
  - **Leaf 1.1.1.1**: Privative, Meta-Craving Permissible, Scope: Functional Systems, Intervention: Forbidden  
    → *Unnamed*. Unstable: Forbidding intervention despite universal scope risks incoherence with disvalue-minimization.  
  - **Leaf 1.1.1.2**: **Hard Privative Tranquilism** (e.g., radical negative utilitarianism). Scope: Functional Systems, Intervention: Obligatory.  
  - **Leaf 1.1.1.3**: Privative, Meta-Craving Permissible, Scope: Functional Systems, Intervention: Value-Indifferent  
    → *Unnamed*. Overlooked: Functional suffering’s ubiquity makes indifference pragmatically untenable.  
  - **Leaf 1.1.2.1**: Privative, Meta-Craving Permissible, Scope: Sentient Only, Intervention: Forbidden  
    → **Ecological Non-Interventionist Tranquilism**.  
  - **Leaf 1.1.2.2**: Privative, Meta-Craving Permissible, Scope: Sentient Only, Intervention: Obligatory  
    → **Sentient Interventionist Tranquilism**.  
  - **Leaf 1.1.2.3**: Privative, Meta-Craving Permissible, Scope: Sentient Only, Intervention: Value-Indifferent  
    → *Unnamed*. Rare: Sentient suffering’s disvalue typically demands action or abstention.  
  - **Leaf 1.1.3.1**: Privative, Meta-Craving Self-Defeating, Scope: Functional Systems, Intervention: Forbidden  
    → *Unnamed*. Incoherent: Functional systems cannot "naturally" cease craving, undermining self-defeat criterion.  
  - **Leaf 1.1.3.2**: Privative, Meta-Craving Self-Defeating, Scope: Functional Systems, Intervention: Obligatory  
    → *Unnamed*. Overlooked: Self-defeating meta-craving rarely aligns with functional suffering concerns.  
  - **Leaf 1.1.3.3**: Privative, Meta-Craving Self-Defeating, Scope: Functional Systems, Intervention: Value-Indifferent  
    → *Unnamed*. Unstable: Combines a strong constraint (no meta-craving) with scope/indifference conflicts.  
  - **Leaf 1.1.4.1**: Privative, Meta-Craving Self-Defeating, Scope: Sentient Only, Intervention: Forbidden  
    → **Ascetic Tranquilism** (e.g., certain Stoic/Buddhist interpretations).  
  - **Leaf 1.1.4.2**: Privative, Meta-Craving Self-Defeating, Scope: Sentient Only, Intervention: Obligatory  
    → *Unnamed*. Rare: Obligatory intervention clashes with meta-craving prohibitions.  
  - **Leaf 1.1.4.3**: Privative, Meta-Craving Self-Defeating, Scope: Sentient Only, Intervention: Value-Indifferent  
