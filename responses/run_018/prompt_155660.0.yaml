  - **Leaf 1.2.4.2**: Positive-State, Meta-Craving Self-Defeating, Scope: Sentient Only, Intervention: Obligatory  
    → *Unnamed*. Unstable: Intervention typically requires instrumental desires, conflicting with meta-craving rejection.  
  - **Leaf 1.2.4.3**: Positive-State, Meta-Craving Self-Defeating, Scope: Sentient Only, Intervention: Value-Indifferent  
    → *Unnamed*. Overlooked: Combines strict meta-craving limits with non-commitment to action.  

