  - **Leaf 1.2.3.1**: Positive-State, Meta-Craving Self-Defeating, Scope: Functional Systems, Intervention: Forbidden  
    → *Unnamed*. Incoherent: Functional systems cannot host positive states or self-defeating motives.  
  - **Leaf 1.2.3.2**: Positive-State, Meta-Craving Self-Defeating, Scope: Functional Systems, Intervention: Obligatory  
    → *Unnamed*. Incoherent: Same as above.  
  - **Leaf 1.2.3.3**: Positive-State, Meta-Craving Self-Defeating, Scope: Functional Systems, Intervention: Value-Indifferent  
