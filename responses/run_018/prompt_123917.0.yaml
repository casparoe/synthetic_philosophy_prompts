answer: |-
  1.  Letter Spirit's roles are abstract conceptual slots (e.g., "bowl"), not directly observable low-level features; messy handwriting obscures *which* pixels fulfill which role.  
  2.  Real-world noise (blobs, gaps, overlaps) creates ambiguity where strokes don't cleanly map to *any* role or could fit *multiple* roles simultaneously.  
  3.  Role assignment requires holistic, context-sensitive *interpretation* (like recognizing a stem *despite* a wobble), which is computationally hard; OCR often relies on statistical pattern matching instead.  
  4.  The "essence" isn't rigid; in messy cursive, letter identity often depends critically on surrounding letters and top-down word-level context, not isolated role fulfillment.  
  5.  Automating Letter Spirit's flexible, analogy-driven role mapping and style inference across infinite variations remains vastly more complex than training models on pixel/feature correlations.
