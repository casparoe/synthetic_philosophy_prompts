  I was arguing with my roomate about Kierkegaard's rants against newspapers and the crowd. She thinks the press is the real villain because it creates the public; I think the public is this prior phantom abstraction and the press just feeds it. But then I started wondering if with social media and algorithimc feeds the distinction even holds, or if the "leveling" he talks about is now baked into the platform itself.

  So I want your actual credence: in Kierkegaard's view, is the public (not the press) the root destructive agent? Decompose it for me. First, what's the prob he treats the public as metaphysically prior to print culture rather than as its sociological effect? Second, does his concept of leveling apply more severely to the crowd's anonymity than to media diffusion? Third, does the modern feed environment collapse the distinction so thoroughly that asking which is prior becomes moot? Give me rough numbers for each, combine into one overall credence, then tell me which term you're least sure about and what kind of argument or conceptual distinction (not a bibliography) would move you most. I'm sitting at about 0.6 that the public is primary, but I think I'm mostly guessing on the second part.
