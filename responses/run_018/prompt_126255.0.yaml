  Third, modern feeds. This is where it gets messy. Social media doesn’t just feed the public—it constructs it in real-time. Algorithms create filter bubbles and engagement loops that mirror Kierkegaard’s worst fears. The distinction collapses because the platform designs the crowd’s behavior. So yeah, it’s moot. Probability 0.9.  

  Overall credence: The public is primary, but modern tech blurs it. Averaging the probabilities gets me to 0.8.  

