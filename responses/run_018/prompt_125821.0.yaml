  ## Drafting the Document

  **Joint Statement on Money Pumps and Diachronic Rationality**

  **1. Agreed Claims**

  1.1. An agent exhibits cyclic preferences if, for three distinct options A, B, and C, the agent strictly prefers A to B, B to C, and C to A.

  1.2. In the standard money-pump setup, an exploiter can sequentially offer trades that leverage these cyclic preferences: 
     - Starting with A, the agent pays a small fee ε to trade to C (since C is preferred to A);
     - Then, from C, pays ε to trade to B (since B is preferred to C);
     - Then, from B, pays ε to trade back to A (since A is preferred to B).
     The agent thus returns to the initial option A but has paid 3ε in fees, suffering a net loss.

