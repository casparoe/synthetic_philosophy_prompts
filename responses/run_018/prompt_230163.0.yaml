prompt: |-
  I work as a software engineer and recently went down a rabbit hole reading about futarchy — roughly, the idea that a democracy should vote on what outcomes we actually want, and then let prediction markets decide which policy is most likely to get us those outcomes. I've been trying to work out where I'd genuinely be comfortable letting a market make the call and where I wouldn't, based just on my gut reactions to concrete cases. I'd like to know whether there's a principle that captures my verdicts.

  Going case by case: (1) whether a city should build a new light rail line, with the market forecasting ridership and average commute times if we build it or don't and betting on the better outcome — fine, I'd be happy with that. (2) whether same-sex marriage should be legal, with the market predicting the effect on average life satisfaction or GDP — not the market's call, that seems wrong to me. (3) whether the central bank should raise interest rates, with a market on inflation a few years out under each path — I'd honestly trust that more than the committee. (4) whether a new drug should be approved, with the market forecasting deaths and hospitalizations under approval vs. rejection — I mostly like this one, though I'd want someone independent checking the outcome numbers. (5) whether to launch a military invasion, with the market predicting casualties and economic cost under invade vs. don't — no, absolutely not, even if the market says invade. (6) whether an individual defendant should be held in pretrial detention, with a market on whether they'll skip their court date or commit a new crime if released — no, and this one feels kind of repugnant to me, betting on a person like that.

  What's bugging me is that my pattern isn't just "markets for factual means, voting for values," because the invasion case is also a means-to-an-end question and I still reject it, while the light rail and interest rate cases are means-to-an-end and I accept them. Is there a principal that gets all of these, or close to all? And what would it say about a case I keep going back and forth on: whether a school district should use a market on long-term earnings to decide whether to replace some science classes with programming classes? Finally, which of my verdicts would the principle force me to give up?
reasoning: |-
  Okay, the user is a software engineer who's been exploring futarchy and wants to understand their own intuitive reactions to different cases where prediction markets could be used. They've listed six scenarios, each with a different gut reaction, and are struggling to find a consistent principle behind their judgments. Their main confusion is that their pattern doesn't neatly fit the "markets for facts, voting for values" framework since they reject some means-to-end decisions (like military invasion) while accepting others (like light rail or interest rates).

  Hmm, looking at their cases: they're comfortable with infrastructure and monetary policy decisions using markets but draw hard lines on social issues (same-sex marriage), military actions, and pretrial detention. The school curriculum case is their unresolved dilemma. Their frustration suggests they value intellectual consistency—common among engineers—and might feel uneasy about seemingly arbitrary boundaries.

  Their deeper needs seem to be:  
  - Craving a principled framework to avoid cognitive dissonance  
  - Unspoken anxiety about "repugnant markets" commodifying human outcomes (especially in detention/drug cases)  
  - Possibly seeking validation that their discomfort with certain markets isn't irrational  
  - Low-key hope that a principle might resolve their curriculum indecision  

  The key tension in their examples is between outcome measurability and moral stakes. Light rail/interest rates have clear metrics (ridership, inflation) with low ethical weight, while invasion/detention involve life/death with contested metrics. Same-sex marriage is tricky because while GDP/life satisfaction *could* be measured, it feels reductionist—almost dehumanizing. That suggests their real boundary is about whether reducing the outcome to numbers feels legitimate.  

  For the school case: replacing science with programming based on earnings forecasts feels icky because (a) earnings don't capture education's purpose, (b) it ignores non-economic benefits of science literacy, and (c) markets might undervalue long-term/societal gains. Their hesitation likely stems from sensing that "education as human capital investment" is too narrow a framing.  

  A robust principle might be: **Markets only for decisions where (1) outcomes are uncontroversially quantifiable, and (2) the quantification fully captures the moral stakes.** This would:  
  - Accept light rail/interest rates (clear metrics, low stakes)  
  - Reject same-sex marriage (stakes aren't just GDP) and invasion (casualties ≠ moral justification)  
  - Conditionally accept drug approval if independent audits ensure outcome integrity  
  - Reject pretrial detention (commodifying human freedom) and curriculum changes (earnings ≠ education's purpose)  

  This principle would force them to either drop independent verification for drug approvals (since moral stakes are high) or accept that invasion might be permissible if casualty metrics included geopolitical stability—but they'd probably reject that trade-off, revealing their deeper aversion to marketizing violence.  

  Ultimately, their repugnance in cases 2,5,6 signals that some domains resist quantification without moral loss. The curriculum dilemma persists because education sits at the intersection of measurable outcomes and unquantifiable values—which is exactly where futarchy struggles.
answer: |-
  Your intuitions reveal a sophisticated principle that goes beyond the simple "markets for facts, voting for values" dichotomy. The unifying thread is **whether the outcome metric can legitimately capture the full moral stakes of the decision**—or whether the act of reducing the decision to that metric itself violates ethical norms. This principle incorporates two key dimensions:

  1.  **Metric Legitimacy:** Does quantifying success via the proposed metric (GDP, life satisfaction, casualties, earnings) feel like an *incomplete* or *morally inappropriate* representation of what matters?
  2.  **Moral Hazard of Commodification:** Does the process of betting on the outcome using this metric feel intrinsically *repugnant* due to the nature of the stakes (e.g., human life, fundamental rights, individual liberty)?

  Here's how your cases map to this principle:

  | **Case** | **Market Use Acceptable?** | **Why?** |
  |----------|----------------------------|----------|
  | **1. Light Rail** | ✓ | Ridership/time reduction legitimately captures core goals; commodification feels neutral. |
  | **2. Same-Sex Marriage** | ✗ | Life satisfaction/GDP can't capture rights/equality stakes; commodifying rights feels wrong. |
  | **3. Interest Rates** | ✓ | Inflation is core mandate; commodification low-stakes. |
  | **4. Drug Approval** | ✓ (with oversight) | Deaths/hospitalizations are primary concerns, but oversight needed for data integrity. |
  | **5. Military Invasion** | ✗ | Casualty metrics ignore sovereignty/justice; commodifying war decisions is repugnant. |
  | **6. Pretrial Detention** | ✗ | Reduces liberty to risk probabilities; commodifying freedom feels dehumanizing. |

  **Applying the Principle to Your School Case:**  
  *   **Should a school district replace science classes with programming based on a market forecasting long-term earnings?**  
      *   **Problem:** Earnings are an *incomplete* metric. Science education fosters critical thinking, civic engagement, environmental awareness, and intrinsic wonder—values poorly captured by future income. Reducing education's purpose to earnings commodifies human development in a way that likely triggers your repugnance (similar to case #6).  
      *   **Verdict:** ✗ **Not acceptable.** The principle forces rejection here because the metric fails to capture the full moral/educational stakes.

  **What the Principle Forces You to Reconsider:**  
  *   **Drug Approval (#4):** Your openness *conflicts slightly* with the principle. If "deaths/hospitalizations" feels insufficient (e.g., ignores quality of life, chronic illness, informed consent), or if betting on human suffering feels repugnant, the principle would demand rejection. Your caveat ("independent checking") reveals unease with pure market logic here.  
  *   **Interest Rates (#3):** While you accept it, if inflation targeting is seen as *incomplete* (e.g., ignoring employment or inequality), the principle could *weaken* your support. You likely accept it because inflation is the central bank's explicit, narrow mandate.

  **Why This Principle Works:**  
  *   **Explains "Means-to-End" Exceptions:** Invasion (#5) is rejected not because it's means-to-end, but because casualty metrics *ignore the moral weight of the act itself* (sovereignty violation, aggression) and commodifying war is repugnant. Light rail (#1) lacks this moral hazard.  
  *   **Captures Repugnance:** Cases #2 (rights), #5 (war), and #6 (liberty) involve commodifying core human values, triggering an instinctive rejection beyond pure utilitarianism.  
  *   **Highlights Metric Limitations:** Same-sex marriage (#2) and school curriculum fail because the proposed metrics (GDP, earnings) are clearly reductive.

  **In essence:** You endorse markets only when (1) the outcome metric is **non-reductive** (it adequately captures the decision's stakes), and (2) the commodification process **lacks intrinsic moral hazard**. Your boundary is crossed when the metric oversimplifies profound human values or when betting on the outcome feels inherently dehumanizing. This principle respects both epistemic efficiency *and* moral constraints on quantification.
