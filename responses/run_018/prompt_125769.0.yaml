prompt: |-
  You are an expert in moral philosophy and film aesthetics writing at the PhD level for a graduate seminar on normative ethics. Before you begin your analysis, please take a moment to think carefully and brainstorm: first, outline the standard individualist framework for supererogatory acts—those that go beyond the call of duty without being morally required, and for which the agent deserves special praise. Then, introduce the niche analytical framework I want you to deploy, which I will call institutional supererogation. By this I mean cases in which an agent performs an act that exceeds moral obligation, but where the act's moral significance depends structurally on a collective, intentional misattribution of credit or blame—specifically, when others conspire to conceal the agent's merit so that a broader social symbol, such as an untainted public hero, can be preserved.

  Read Christopher Nolan's 2008 film The Dark Knight through this lens. Focus on the climactic decision in which Batman accepts public blame for Harvey Dent's murders while Commissioner Gordon preserves Dent's public image as Gotham's heroic savior. Do not treat this merely as self-sacrifice or as a dirty-hands problem; ask whether it can be understood as supererogation that only functions under conditions of engineered invisibility.

  In a formal, polished response written in American English, address the following:

  1. How does the standard account of supererogation map onto Batman's choice? Does Gordon's active participation in the concealment alter the moral structure of Batman's act, or does it remain an individual supererogatory deed that happens to be hidden?

  2. The film includes Alfred's earlier counsel about the emotional cost of serving as a permanent symbol of fear—paraphrase rather than quote. How does this anticipation of misrecognition affect whether Batman's final act is freely chosen heroism or something closer to role-determined obligation?

  3. The Joker's challenge to Gotham's moral codes—his claim that social principles are fragile performances—frames heroism as a construct vulnerable to pressure. Where does the film resist reducing Batman's choice to this cynical view? Identify specific narrative moments, such as the ferry sequence or Dent's transformation into a vengeful agent, that illuminate whether the concealment is a noble lie necessary for social hope or a corruption of moral transparency.

  4. Conclude by defending a verdict: is institutional supererogation a coherent category, or does it collapse into either standard supererogation or a dirty-hands dilemma? What does this particular film contribute to the philosophical debate—especially regarding the psychological burden of being the unrecognized bearer of blame—that abstract argument alone tends to miss?

  Please begin with brief conceptual brainstorming, then deliver a rigorous critical reading rather than a plot summary. Do not provide bibliographies, reading lists, or citations. Avoid verbatim quotations from the film; paraphrase all dialogue and scenes. Think step by step and reach a justified conclusion.
