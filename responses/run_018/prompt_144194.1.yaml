prompt: |-
  Write the desiderata that a formal measure of low-impact action must satisfy for an embedded agent that lacks a fixed ontology of its environment—meaning it cannot reliably distinguish altering an inanimate substrate from disrupting a potential moral patient or an emergent subsystem with undefined boundaries—so that avoiding side effects does not require a full prior specification of value. For each desideratum, identify the conceptual tension or motivating case behind it (e.g., whether impact must be invariant under the agent’s own representational revisions, whether reversibility is definable without knowing which entities matter, or whether the agent’s actions on its own model of the world count as external effects), mark which are non-negotiable and which are preferences of particular camps, and point out any pair you think cannot be jointly satisfied. Note briefly how standard impact-penalty or reversibility-based approaches fare on at least one point, but keep the focus on the criteria. Separate settled claims from genuinely contested ones in the embedded-agency and alignment literature, and avoid presenting a disputed view as consensus. Deliver exactly five numbered points, each in one or two sentences, with no introduction or conclusion.
reasoning: |-
  We are to write five desiderata for a formal measure of low-impact action for an embedded agent without a fixed ontology.
   Each point should be one or two sentences, and for each we must:
     - Identify the conceptual tension or motivating case.
     - Mark non-negotiable vs. camp-specific.
     - Note any pairs that might conflict.
     - Briefly mention how standard approaches (like impact penalties or reversibility) fare on at least one point.
     - Separate settled claims from contested ones.

   We are to avoid intros and conclusions.

   Five points:

   1. **Representation Independence (Non-negotiable)**: The measure should be invariant to the agent's representational choices (e.g., modeling the same physical state with different state variables or granularity). The tension arises because the agent must avoid side effects without knowing which representation is "correct", and without a fixed ontology, it cannot rely on a privileged base. Standard impact measures that use state differences (like Euclidean distance in a particular state space) are representation-dependent and thus fail. This is a non-negotiable requirement for any measure that avoids ontological arbitrariness.

   2. **Avoidance of Self-Referential Side Effects (Contested)**: The measure should not penalize the agent for updating its own internal state or computations, as these are part of the agent's necessary functioning. The tension is that without a clear boundary between the agent and the environment, internal changes might be misclassified as side effects. Reversibility-based approaches might count the agent's learning as irreversible and thus penalize it, which is undesirable. This is contested because some argue that self-modification could be dangerous and should be controlled, while others see it as necessary. It is a camp-specific preference to exclude internal changes.

   3. **Robustness to Value Uncertainty (Non-negotiable)**: The measure must not require a full prior specification of which entities or states are valuable (i.e., it must work without knowing the utility function over states). The tension is that without knowing what matters, the agent must avoid changing things that might matter. Standard impact penalties that use a baseline state (e.g., inaction baseline) are problematic because inaction might lead to irreversible changes (e.g., a vase falls if not caught) and because the baseline state may be arbitrary. This is non-negotiable to avoid prespecifying value.

   4. **Reversibility without Ontology (Contested)**: The measure should incorporate reversibility in a way that does not depend on identifying specific entities or processes. The tension is that without knowing what is reversible (because the ontology is unknown), we must define reversibility in terms of the agent's ability to restore some abstract state. However, defining what counts as restoration without an ontology is difficult. Reversibility-based measures (like the ability to return to the previous state) can fail if the state representation changes (violating representation independence) or if the agent doesn't know what to restore. This is contested because reversibility is often seen as a key to low impact, but defining it without an ontology is challenging.

   5. **Non-Interference with Goal Achievement (Non-negotiable)**: The measure must not prevent the agent from achieving its goals, meaning that the impact penalty should not dominate the primary utility. The tension is that if the impact penalty is too strict, the agent might do nothing (inaction) to avoid impact, but inaction itself may cause harm (e.g., failing to prevent a falling vase). Standard approaches that use a penalty term might lead to such inaction. This is non-negotiable to ensure the agent remains useful.

   Conflicts: 
     - Representation Independence and Reversibility without Ontology might conflict because reversibility is naturally defined in a particular state space, and changing the representation might make reversibility harder to define.

   How standard approaches fare on one point (as required at least once): 
     - For Representation Independence: Standard state-difference measures (like in Krakovna et al.'s relative reachability) are representation-dependent because they rely on a state vector. Changing the state representation (e.g., from Cartesian to polar coordinates) changes the distance.

   We note which are settled and which are contested.

   Let's write each point in the required format.

   Important: Exactly five, numbered, and each one or two sentences.

   Structure per point:
     - The desideratum and its category (non-negotiable/contested) and the tension.
     - Mention of conflict if applicable and how standard approaches fare.

   Point 1: Representation Independence (Non-negotiable)
     Tension: Without a fixed ontology, the agent must avoid arbitrariness in how it represents the world.
     Standard approaches: Fail because they rely on a specific state representation.

   Point 2: Avoidance of Self-Referential Side Effects (Contested)
     Tension: The agent's internal changes are necessary for operation but without a clear self/other boundary, they might be penalized.
     Standard reversibility: Penalizes internal changes (like learning) because they are irreversible.

   Point 3: Robustness to Value Uncertainty (Non-negotiable)
     Tension: Without knowing what is valuable, the agent must avoid changes that might be harmful.
     Standard baseline approaches: Using inaction as baseline is problematic because inaction may also cause change.

   Point 4: Reversibility without Ontology (Contested)
     Tension: Reversibility is appealing but hard to define without knowing what entities to restore.
     Standard reversibility: Often defined in a fixed state space, which conflicts with representation independence.

   Point 5: Non-Interference with Goal Achievement (Non-negotiable)
     Tension: The agent must be able to act to achieve goals without being paralyzed by impact concerns.
     Standard penalty approaches: May lead to inaction if the penalty is too high.

   Conflict between 1 and 4: Reversibility without Ontology (4) might require a fixed state space to define "restore", but Representation Independence (1) forbids relying on a fixed state representation.

   Let's write the five points:
answer: |-
  1. **Representation Independence (Non-negotiable)**: The measure must be invariant under the agent's representational choices (e.g., state-variable redefinitions or coarse-graining), avoiding arbitrariness from ontological uncertainty; standard impact penalties using state differences (e.g., Euclidean distance) fail this by conflating epistemic shifts with physical change. This arises from the tension that the agent cannot privilege one ontology over others without external guidance.

  2. **Exemption of Self-Modification (Contested)**: Internal updates to the agent's own knowledge or beliefs should not incur impact penalties, as self-referential changes are necessary for learning, but defining the "self" is ambiguous without ontological boundaries. Reversibility-based measures often struggle here, as reverting the agent's state might erase critical information, reflecting a camp preference where some argue self-modification risks instrumental convergence.

  3. **Value-Agnosticism (Non-negotiable)**: The measure must not presuppose knowledge of which entities or processes are valuable (e.g., moral patients), as requiring such specification violates the core challenge; impact penalties tied to human-defined baselines fail by implicitly encoding value judgments. This tension emerges from avoiding perverse incentives while preserving flexibility in unknown environments.

  4. **Reversibility Without Privileged Entities (Contested)**: Reversibility should be achievable without assuming fixed boundaries (e.g., restoring "the room" vs. atomic particles), but defining reversible actions absent a clear substrate is paradoxical. Standard reversibility measures (e.g., attainable future states) falter without ontological anchors, highlighting a conflict with Representation Independence (Point 1) if reversibility relies on specific state variables.

  5. **Non-Paralysis (Non-negotiable)**: The measure must permit necessary goal-directed actions, as excessive penalty for potential side effects could immobilize the agent; this tension pits caution against competence, where impact penalties risk rewarding passivity (e.g., ignoring a falling vase to avoid "change"). This is settled in alignment: impact measures must not dominate primary objectives.
