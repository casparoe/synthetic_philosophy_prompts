prompt: |-
  Act as a historian of ideas who specializes in nationalism studies, and think carefully here, maybe sketch the rival positions before answering. The debate over how old nations are -- modernists like Gellner, Hobsbawm, and Anderson saying nations are artifacts of industrialization, print, and mass schooling, versus perennialists and ethnosymbolists like Anthony Smith and Adrian Hastings pointing to medieval peoples who already looked pretty nation-like -- feels completely stuck to me. Every conference I go to has the same exchange: the modernist picks a case like French peasants in 1870 who barely spoke French, the ethnosymbolist counters with the Anglo-Saxon Chronicles or the Declaration of Arbroath, and both just walk away convinced the other's case is the atypical one. My hypothesis is that this stopped being an empirical disagreement ages ago and is really three disagreements in a trench coat: one about how to define "nation" (state-framed vs. ethnocultural), one about which cases count as central data (western Europe vs. everyone else), and one about whether "invented" and "ancient" are even incompatible, since traditions get invented inside communities that predate them. But I'm not sure, maybe I'm being to accomodating. Diagnose the actual structure of the impasse using what the two camps really argue, tell me whether the question "how old are nations" is well-posed as stated, and say what would count as progress given your diagnosis -- a cleaner definition, a different division of cases, dropping the age question entirely, or something else.
