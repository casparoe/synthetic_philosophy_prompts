answer: |-
  Your diagnosis is remarkably astute—this isn't just an empirical stalemate but a **conceptual entanglement** rooted in three core disagreements masquerading as one. Let's dissect the impasse using the arguments of each camp:

  ### 1. **The Definitional Fault Line: "What IS a Nation?"**  
     - **Modernists**: Define the nation *politically*: a mass, self-aware, sovereign community demanding a state, enabled by modernity (e.g., Anderson's "imagined community" via print capitalism; Gellner's high-culture homogeneity via state schooling). Pre-modern groups were "proto-national," lacking mass political agency.  
     - **Ethnosymbolists/Perennialists**: Define the nation *culturally*: a named community sharing myths, memories, symbols, and territory (Smith's "ethnie"). For Hastings, medieval England *was* a nation—its people identified as "English," invoked shared history (Bede, Anglo-Saxon Chronicles), and opposed "foreign" Normans.  

     → **Impasse**: Modernists dismiss medieval "nations" as elite projects without mass consciousness; Ethnosymbolists see modernist definitions as arbitrarily excluding culturally cohesive pre-modern groups.  

  ### 2. **The Case-Selection Bias: "Which Examples Matter?"**  
     - **Modernists**: Focus on **Western Europe** (France, Germany) where state-led nation-building followed industrialization. Cases like 1870 French peasants prove nations were "constructed" late.  
     - **Ethnosymbolists**: Highlight **"Early Nations"** (England, Scotland, Armenia, Jews) and **colonized societies** (India, Africa) where anti-colonial nationalism drew on deep cultural reservoirs. The Declaration of Arbroath (1320) shows Scottish self-awareness *against* English claims.  

     → **Impasse**: Modernists argue ethnosymbolists cherry-pick atypical "early bloomers"; Ethnosymbolists counter that modernists universalize the atypical *Western European experience*.  

  ### 3. **The Invention Paradox: "Can 'Ancient' and 'Invented' Coexist?"**  
     - **Modernists**: Emphasize *discontinuity*—nations are "invented" (Hobsbawm) using *materials* from the past, but the nation itself is novel.  
     - **Ethnosymbolists**: Stress *continuity*—even "invented traditions" must resonate with pre-existing myths/symbols (e.g., Joan of Arc revived in 19th-C France). Smith's "ethnic cores" persist through time.  

     → **Impasse**: Modernists see ethnosymbolists as downplaying modernity's transformative role; Ethnosymbolists see modernists ignoring how invention relies on cultural inheritance.  

  ---

  ### **Is "How Old Are Nations?" a Well-Posed Question?**  
  **No—it's conceptually incoherent.** It conflates:  
  - **Age of cultural identities** (e.g., "Englishness" c. 1000 CE)  
  - **Age of mass political nationalism** (e.g., post-1789 France)  
  - **Age of the nation-state** (post-1815 norm).  

  The question assumes a single "essence" of nationhood when, historically, it's a **cluster concept** with variable attributes across time/space.

  ---

  ### **Pathways to Progress**  
  1. **Replace the Question**: Instead of "how old?," ask:  
     - *"Under what conditions do certain pre-modern ethnies transform into mass political nations?"*  
     - *"How do cultural resources enable or constrain nationalist mobilization?"*  

  2. **Adopt a Synthetic Framework**:  
     - **Acknowledge Multiple Pathways**: Western Europe (state-led homogenization), anti-colonial (mobilization against imperial rulers), "old nation" revivals (Greece, Israel).  
     - **Distinguish Dimensions**: Separate analysis of *cultural persistence* (Smith) from *political innovation* (Anderson).  

  3. **Emphasise Process over Origins**:  
     - Study **nation-formation as dynamic**: How medieval ethnies (e.g., Poles under partition) become modern nations via print, war, or state collapse (Brubaker's "eventful" approach).  
     - Explore **thresholds of nationhood**: When does a group achieve mass literacy? Widespread vernacular print? Political self-determination claims?  

  4. **De-Westernize the Field**:  
     - Prioritize **global comparisons**: Why did Japan "modernize" its nationhood rapidly using imperial myths, while Indonesia forged a new supra-ethnic identity? Avoid treating Europe as the template.  

  5. **Drop "Perennialism vs. Modernism" as Binaries**:  
     - Embrace **"Modernist Ethnosymbolism"** (John Hutchinson): Modernization *activates* but does not *create* ethnic identities. Nationalism is a dialogue between past and present.  

  ---

  ### **Conclusion: Beyond the Trench Coat**  
  The stalemate persists because both sides are partially right: modernists correctly identify the *political* rupture of mass nationalism, while ethnosymbolists rightly note the *cultural* longue durée. Progress lies in **reframing the debate away from age** and toward **mechanisms of transformation**—studying how cultural raw materials are politicized under modern conditions. As you suspected, the key isn't choosing a camp but dismantling the trench coat to reveal the three arguments underneath, then building models that account for their interplay. The future isn't in "who's older?" but in "how does this *work*?"
