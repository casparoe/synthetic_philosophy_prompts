prompt: |-
  hey—phd student in philosophy/poli sci here, working on atrocity taxonomy and teh politics of naming. i need a thought experiment built to spec for my seminar. please act as an expert in philosophy of law with some moral theory background. take a breath, do a quick brainstorm first, then construct the case carefully.

  spec: build a realistic, one-paragraph scenario (goverment or institutional setting, no trolleys or sci-fi) where a state-backed heritage modernization program systematically destroys the language archives, ritual practices, and intergenerational knowledge of a minority group—without any physical killing or forced relocation. the group should be defined not by ethnicity but by a practical identity centered on a specific craft and epistemic tradition (say, a community of river-navigators with unique cartographic oral traditions). the state offers compensation and frames it all as economic digitization and cultural preservation.

  engineer it so that:
  - a strict UN-Convention legalist says this is not genocide and thus international sanctions arent legally triggered;
  - a Lemkin-style moral categorist says this IS genocide (destruction of the group as a social and cultural unit) and inaction is morally wrong;
  - the split comes purely from definitional differences about what counts as a protected group and whether non-physical destruction counts, not from factual disagreement.

  after the scenario, walk through each theory's reasoning. then identify the precise feature doing the work—probably the decoupling of biological harm from group-identity dissolution, but i want you to name it exactly. also say what happens if we remove it (e.g., add minimal physical violence—does the legalist suddenly agree?). finally, show how a legalist defender attacks the case—likely by saying expanding the category to cover this dilutes genocide's moral gravity and invites false positives.

  constraints: scenario in one paragraph, no bibliographies or citations (i cant verify them and dont want guesses), dont quote real texts—paraphrase Lemkin's broader view without quotation marks, avoid super-obscure theorists, and please include a typo or two since i'm writing casually. think step by step and show your reasoning.
