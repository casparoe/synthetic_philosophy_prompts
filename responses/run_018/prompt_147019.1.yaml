  ## The Lens Ground Afterward
  (On Whig History's Persistent Gaze)

  We read the dead as drafts of us,
  Their arguments but crude supplies
  For futures they could never guess.
  The monk who parsed God's sovereignty
  As proto-liberal intent?
  We read the dead as drafts of us.
  The *philosophe*, whose reason's thrust
  Seems dimmed by prejudice's lies,
  For futures they could never guess.
  The chartist's cry, the suffragette's,
  Are stepping stones we neatly press –
  We read the dead as drafts of us.
  The rebel's fire, the law's redress,
  Are judged by rules they couldn't test,
  For futures they could never guess.
  The past becomes a pale success,
  A shadow-play we reassess.
  **The present wears a crown it made itself:**
  Its polished laws, the sole bequest.
  We praise the arc, but must confess
  The victor's terms define the test.
  **The present wears a crown it made itself,**
  Declares each chapter manifest.
  We read the dead as drafts of us,
  For futures they could never guess,
  **The present wears a crown it made itself.**

  ---

  **Note on Contested Reading:**
  I argue Butterfield's critique of Whig history applies universally to *all* progressive historical narratives, not merely 19th-century liberal ones. Any account framing historical change as moral or political ascent towards the historian's own ideals inevitably smuggles those ideals in as the hidden *telos*, flattening the past's genuine alterity. This presentist compression – judging the past solely by its perceived contribution to a preferred present – is the core structural flaw Butterfield identified, regardless of the specific progressive ideology involved.
