  - The squeeze pair (~2 questions): (4) what specific finding in myrmecology would actually make her give up the view; (5) whether bacterial mats with quorum sensing get the same treatment, or if she's sneaking in a threshold she can't defend

  Keep it casual, don't ask for citations or a reading list, and feel free to drop a typo if it feels natural.
