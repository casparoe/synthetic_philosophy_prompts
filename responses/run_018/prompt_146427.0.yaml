answer: |-
  Your intuitions are remarkably consistent—they all stem from the **Gricean Cooperative Principle** (CP) and its maxims, but with crucial nuances for **context, speaker commitment, and social conventions**. Here's the unifying framework and how it resolves your cases:

  ### Core Principle: 
  **The Cooperative Principle** (Grice): Conversations assume participants are truthful, informative, relevant, and clear. **Implicature** arises when a speaker *ostensibly violates* a maxim *while still cooperating*, forcing listeners to infer hidden meaning.

  ### Key Refinements:
  1. **Speaker Commitment**:  
     Are you *committed* to the stronger claim? If you withhold known, relevant information, you violate the maxim of Quantity ("be as informative as required").  
  2. **Contextual Relevance**:  
     What counts as "relevant" depends on the situation (e.g., therapy vs. roommate conflict).  
  3. **Opting Out of CP**:  
     Social rituals ("let's grab coffee") or institutional scripts ("we value feedback") often *suspend* the CP—they’re not meant cooperatively.  
  4. **Common Ground**:  
     Shared cultural knowledge can override literal meaning (e.g., meeting times).  

  ---

  ### Your Cases Analyzed:
  | Scenario                      | Violation?                              | Why Your Verdict Fits                                  | Principle at Work                                     |
  |-------------------------------|------------------------------------------|--------------------------------------------------------|-------------------------------------------------------|
  | **"Some students passed"**<br>(when all did) | Quantity (withholding known info) | Misleading ✅ | Commitment to truth: You *know* "all" is relevant. |
  | **"Report is mostly accurate"**<br>(one minor error) | None | Acceptable ✅ | "Mostly" signals approximation; error is trivial/irrelevant. |
  | **"I'm not angry"**<br>(to roommate) | Quality (insincerity) + Manner (tone mismatch) | Implicates fury ✅ | Context makes denial insincere; tone violates Manner. |
  | **"I'm not angry"**<br>(to therapist) | None | Literal ✅ | Context prioritizes honesty; no violation. |
  | **Chatbot: "We value feedback"**<br>(no way to submit) | Quality (institutional lie) ❌ | **Not implicature**—likely a lie | Institutional speech *must* cooperate; false claim exploits trust. |
  | **"Let's grab coffee"**<br>(no intent) | Quantity (false offer) | **Social noise** ✅ | "Polite fictions" *opt out* of CP; no cooperation expected. |
  | **"Meeting started at 3"**<br>(culturally starts at 3:05) | None | Not sneaky ✅ | Shared knowledge *adjusts* literal meaning; "3:00" = "scheduled start". |

  ---

  ### Where Your Verdicts Hold (and One Adjustment):
  - **You’re right on 6/7 cases**—your intuition tracks Grice + context.  
  - **Only the chatbot case needs refinement**:  
    Institutional statements (e.g., corporate chatbots) *cannot* opt out of the CP without violating trust. "We value feedback" with no feedback mechanism is **deceptive** (violating Quality), not mere implicature. It’s a lie because the institution *commits* to caring while acting otherwise.  

  ### The Bigger Framework:  
  Grice + **Social Practice Theory** covers all:  
  1. **Normal talk**: Gricean maxims + contextual relevance.  
  2. **Institutional speech**: Higher obligation to cooperate; violations are unethical.  
  3. **Ritual politeness**: "Ceremonial" language suspends CP; no implicature generated.  

  **Conclusion**: Your judgments aren’t inconsistent—they reflect deep pragmatic intuition. The unifying principle is **contextual commitment to cooperation**. Drop the chatbot-as-implicature verdict; treat it as institutional deception. Everything else aligns!  

  ###### Further reading: Saul (2012) on lying vs. misleading; Clark (1996) on common ground; Terkourafi on politeness as "non-cooperation."
