  I am preparing conceptual material for an interdisciplinary seminar on commitment mechanisms in social practices, and I have noticed a recurring structural pattern that sits awkwardly between two familiar frameworks. Consider practices such as sustained membership in physically demanding endurance collectives, long-duration ritual fasting maintained across generations, or high-cost activist commitments that consume substantial leisure and income. To an external observer these look like canonical handicap signals: apparently wasteful expenditures that advertise quality, loyalty, or group belonging to an audience. Yet inside the groups in question, the expenditure does not primarily function as communication directed outward; rather, it operates as a self-locking device. Because the practice is difficult to fake and costly to abandon once internalized, it raises the price of defection from cooperative norms, thereby stabilizing collective action from within. The display aspect is present—outsiders do notice and evaluate—but the causal engine sustaining the practice is closer to credible commitment or sunk-cost binding than to signaling for status.

  I want to know whether this specific configuration—where the formal structure of a handicap (costly, hard-to-fake, observable) is retained, but the signaling-to-observers function is either absent or epiphenomenal, and the operative logic is intra-group commitment stabilization—has an established name or dedicated treatment in the literature on costly signaling, evolutionary biology, or social contract theory. How precisely does it differ from standard handicap signaling, from credible-commitment mechanisms of the Schelling type, and from ordinary sunk-cost reasoning? If no established term captures it exactly, please propose one with an explicit definition, and then provide two boundary cases: one that is structurally adjacent but should be excluded because audience-directed signaling is genuinely primary, and one that should be excluded because there is no collective-action problem being solved. Finally, state whether the phenomenon ultimately collapses into one of its neighboring concepts or remains genuinely distinct. Please present your response as a JSON object with exactly these fields: "established_term" (string or null), "nearest_concepts" (array of strings), "key_distinctions" (object with keys "from_handicap_signaling" and "from_credible_commitment" each mapping to a string), "proposed_term" (string or null), "proposed_definition" (string), "positive_boundary_case" (string describing an instance that fits), "negative_boundary_case_signaling_primary" (string describing an adjacent case to exclude), "negative_boundary_case_no_collective_action" (string describing another adjacent case to exclude), and "assessment_distinct_or_collapsed" (string with brief reasoning).
