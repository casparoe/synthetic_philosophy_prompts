  I need to analyze this concept carefully. The core tension is between the handicap structure (costly/hard-to-fake/observable) and its primary function: while observable, the practice isn't mainly for signaling to outsiders but for internal group stabilization. This creates a gap between form and function.

  Looking at existing literature: Handicap signaling in biology (Zahavi) focuses on audience-directed displays. Schelling's credible commitments are about binding oneself to gain trust in strategic interactions. Sunk-cost reasoning is individual cognitive bias. None perfectly capture this hybrid where observability exists but serves internal enforcement.

  The key distinctions are: From handicap signaling - the information transmission isn't the driver; from credible commitment - it's not about convincing outsiders but preventing internal defection. The "collective sunk cost" mechanism binds members through shared irreversible investments.

  Since no established term exists, I propose "Collective Sunk Cost Binding" as a new term. It emphasizes the irreversible investment aspect and group-level function. 

  For boundary cases: A positive case would be monastic vows - costly to abandon, deters defection, observability is secondary. A signaling-primary exclusion case would be peacock tails - pure signaling with no collective action problem. A no-collective-action exclusion case would be individual marathon running - personal achievement without group cooperation dynamics.

  This concept remains distinct because it merges structural elements from signaling theory with functional elements from commitment theory, creating a new configuration focused on group self-binding. The observability serves internal enforcement rather than external communication as the primary sustaining mechanism.

  I'll structure this precisely in JSON as requested, ensuring all required fields are addressed with clear definitions and reasoning.
