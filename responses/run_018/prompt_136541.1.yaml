  My roommate summed up a blog post about Frege's politcal diary for me, and I want to know if theyre being fair. They said Frege's 1920s journal shows he thought Jewish people lacked the logical intuition he linked to German culture, and that democracy undermines scientific objectivity. From this they conclude that his anti-psychologism — logic being about objective thoughts, not mental processes — was actually a disguised form of ethnic nationalism, since he only counted Aryan minds as capable of grasping those objective thoughts. They also claim his sense/reference distinction was partly meant to separate pure german thinking from subjective jewish association, so his logicism in the foundations of arithmetic is tainted and should be rejected. Which parts of this are accurate, which are misrepresentations or genetic fallacies, and does the diary actually have any bearing on his philosophy of logic? I feel like there's a category error somewhere but I can't pin it down.
