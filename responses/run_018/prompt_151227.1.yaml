prompt: |-
  hey — novelist here, running a small workshop next month called 'time that isn't money' and i need opening remarks, about ten minutes. half the room are labour historians who'll spot a lazy Weber reference from miles away, the other half are fiction writers who just need to recieve permission that rest isn't laziness. i want to thread the protestant work ethic, the 35-hour week as a failed treaty, and karoshi — but not as japanese exceptionalism, rather as the endpoint when leisure is only recovery-time for more work. the spine should be this idea i'm calling 'leisure debt': every hour of rest is borrowed against future labour. that needs to do structural work — so i can't praise busyness, can't frame rest as a reward for productivity, and can't pretend the 35-hour week was capitalism being kind. keep it british english, make sure both halves of the room stay with me, and yes theres a typo in this prompt, don't correct it in your answer.
