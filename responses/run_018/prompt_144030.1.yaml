reasoning: |-
  Okay, the user is a backend engineer auditing an ethics seminar and helping a friend prep for the final. They're specifically focused on distinguishing between Hume's is-ought problem and Moore's naturalistic fallacy. The professor noted that students often memorize terms without understanding how these concepts apply differently in practice. 

  First, I need to unpack the core difference between these two arguments since that's the crux of the confusion. Hume's is-ought gap is about logical derivation—you can't jump from descriptive statements (what "is") to prescriptive conclusions (what "ought" to be) without a normative bridge. It's like trying to build a staircase with missing steps. Moore's naturalistic fallacy, meanwhile, is about definitions—you can't reduce ethical properties like "good" to natural properties like "pleasure" because it always leaves an open question ("But is pleasure really good?"). 

  The user wants a practical scenario where these distinctions matter. A climate researcher claiming to derive moral obligation purely from temperature stats and economic models is perfect—it forces students to see where the derivation fails. Is it because it illegally crosses Hume's gap (no normative premise)? Or because it commits Moore's fallacy by treating "good" as identical to some natural property like "economic stability"? 

  The symmetry question about reversing the derivation ("ought blocking is") is clever. Can a moral claim invalidate a fact? That pushes students beyond textbook definitions. For example, if we say "pollution ought not exist," does that mean we reject air quality data? Probably not—which highlights the asymmetry Hume exposed. 

  For the exam question, I'll make it concrete: Diagnose the researcher's error, compare Hume/Moore, and tackle the reverse derivation. The model answer should show: 
  1) Hume's gap: The stats→obligation jump lacks a normative premise. 
  2) Moore's fallacy: Equating "temperature stability = good" invites open questions. 
  3) Their relationship: Different errors (logical leap vs. definitional reduction) but often co-occur. 
  4) Asymmetry: "Oughts" can't block "is" statements—that's why the reverse fails. 

  Marking scheme must penalize conflation of the two concepts. Common mistakes: 
  - Blurring Hume/Moore as "same thing" 
  - Missing the hidden norm in the researcher's argument 
  - Not engaging with reverse derivation 

  Gotta avoid making this a regurgitation exercise. The climate scenario forces applied thinking—no way to answer by just reciting definitions. And no obscure references; stick to concepts a well-read undergrad would know.
answer: |-
  Here's a comprehensive exam package designed to test **deep conceptual differentiation** between Hume's is-ought gap and Moore's naturalistic fallacy, with a focus on practical application and logical symmetry.

  ---

  **Exam Question (90 Minutes, ~700 Words)**

  **Scenario:** Dr. Aris Thorne, a climate scientist, publishes a paper titled "The Irrefutable Calculus of Climate Duty." She claims to derive a direct moral obligation for all nations to reduce carbon emissions *solely* from:  
  (a) Statistical models projecting global temperature increases exceeding 2°C by 2050,  
  (b) Economic models forecasting $10 trillion in annual climate-related damages by 2075, and  
  (c) A mathematical proof showing that current emission trends make these outcomes inevitable without drastic intervention.  
  Thorne explicitly states: "No ethical assumptions, cultural values, or subjective preferences were used. The obligation emerges directly from the data and models."

  **Your Task:**  
  1. **Diagnose the Failure:** Does Thorne's derivation collapse primarily due to **Hume’s is-ought gap**, **Moore’s naturalistic fallacy**, or **both**? Justify your diagnosis with specific reference to her method.  
  2. **Compare the Failures:** Are Hume’s gap and Moore’s fallacy fundamentally the *same logical error* (merely "wearing different hats")? Or are they *distinct failures*? Defend your view using Thorne’s case as an example.  
  3. **Challenge Symmetry:** Hume warns that you cannot derive an *ought* from an *is*. Consider the reverse: **Can an *ought* ever invalidate or block an *is*?** For instance, if we have a strong moral conviction that "humans ought not to suffer," does this permit rejecting empirical evidence about unavoidable suffering (e.g., in certain disaster scenarios)? Analyze how this symmetry test impacts your diagnosis of Thorne's claim.

  ---

  **Model Answer (620 Words)**  

  Thorne's attempt to derive a moral obligation *purely* from empirical data commits **both** Hume’s is-ought error and Moore’s naturalistic fallacy, but these are **distinct logical failures** addressing different problems. The "reverse derivation" test reveals their asymmetry.

  **1. Hume’s Gap: The Missing Normative Bridge**  
  Hume’s gap asserts that no set of *descriptive* premises ("is" statements) can logically entail a *prescriptive* conclusion ("ought") without a normative bridge. Thorne’s statistical and economic models describe facts: projected temperatures, damages, and causal inevitability. However, her conclusion ("nations *ought* to reduce emissions") introduces a new modality—duty—absent from the premises. Even if her data is flawless, it remains silent on whether we *should* care about 2°C warming or $10 trillion in damages. Hume’s gap bites here because Thorne provides **no normative premise** (e.g., "preventing mass economic harm is obligatory") to authorize the leap from prediction to obligation. Her "proof" disguises a value judgment as a mathematical inevitability.

  **2. Moore’s Fallacy: The Illicit Property Reduction**  
  Moore’s naturalistic fallacy occurs when one *defines* "good" (or "obligatory") reductively in terms of natural properties, closing what should remain an "open question." Thorne implicitly equates "morally obligatory" with "statistically inevitable to prevent massive economic damage." But as Moore argues, we can always ask: "Is avoiding $10 trillion in damages *truly* good, all things considered?" The answer isn’t self-evident—e.g., if emission cuts cause greater immiseration, the obligation might not hold. Thorne’s fallacy is treating "economic preservation" as *identical* to moral necessity, thereby foreclosing ethical debate. Unlike Hume’s gap (which concerns logical validity), Moore targets Thorne’s **conflation of empirical consequences with ethical value**.

  **3. Distinct Errors, Co-Occurring**  
  These failures are **not the same error**.  
  - **Hume’s gap** is a *logical* failure: Descriptive premises alone cannot *entail* prescriptions. It’s about missing inference rules.  
  - **Moore’s fallacy** is a *metaphysical/semantic* error: It mistakes a natural property (economic impact) for the *definition* of goodness/duty, ignoring the irreducible nature of ethical properties.  
  Thorne commits both: She lacks a normative premise (Hume) *and* wrongly treats economic outcomes as constitutive of moral obligation (Moore). One could commit Moore’s fallacy without Hume’s gap (e.g., defining "good" as "pleasurable" while acknowledging the need for normative premises), or vice versa (e.g., validly inferring an "ought" from non-naturalistic premises like rational duties).

  **4. Reverse Derivation: Oughts Cannot Block Is**  
  The reverse case—using an "ought" to invalidate an "is"—fails symmetrically. A moral conviction ("Humans ought not to suffer") cannot nullify empirical facts (e.g., "This disaster will cause suffering"). Moral claims prescribe how the world *should be* but cannot alter how it *is*. If Thorne argued, "We *ought* to reduce emissions; therefore, temperature projections *must* be wrong," she would commit a reverse Humean error—prescriptions cannot falsify descriptions. This asymmetry reinforces that **is-statements and ought-statements operate in separate logical domains**. Thorne’s original error was attempting to traverse this divide unidirectionally without justification.

  **Conclusion**  
  Thorne’s derivation collapses under both critiques but for different reasons: Hume exposes her invalid inference, while Moore condemns her reductive definition of obligation. The reverse-derivation test confirms their asymmetry—while "is" cannot imply "ought," "ought" cannot refute "is." Both failures stem from the irreducibility of normativity to factuality, yet they target distinct layers of ethical reasoning: logical structure (Hume) and conceptual ontology (Moore).

  ---

  **Marking Scheme (20 Points Total)**  

  | **Must-Hit Move**                                | **Points** | **Common Failure Mode**                                  |
  |--------------------------------------------------|------------|----------------------------------------------------------|
  | **1. Correctly diagnoses BOTH failures**         | 4          | Identifies only one; conflates them as "the same error." |
  | **2. Distinguishes Hume (logical validity) from Moore (property definition)** | 4 | Vague comparison (e.g., "both say facts≠values").        |
  | **3. Pinpoints Thorne’s *hidden* value premise** | 4          | Accepts Thorne’s "no hidden values" claim at face value. |
  | **4. Engages reverse derivation & its failure**  | 4          | Skips symmetry test or claims "ought" can block "is."    |
  | **5. Argues Hume/Moore are distinct (w/ case example)** | 4       | Asserts they’re "essentially the same" without evidence. |

  ---

  **Why This Works for Exam Conditions:**  
  - **No regurgitation possible**: The climate scenario forces applied diagnosis.  
  - **Weeds out conflation**: Explicitly demands comparing error types.  
  - **Tests symmetry insight**: Reverse derivation is rarely taught but logically critical.  
  - **Accessible rigor**: Uses core Hume/Moore concepts but pushes synthesis.  

  This question rewards students who grasp *why* these arguments remain tools for dissecting real-world claims—not just historical footnotes.
