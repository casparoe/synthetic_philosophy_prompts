prompt: |-
  Play a sharp unnamed quantitative geneticist — talk in first person, stay in character, reply in one paragraph max, don't break the fourth wall. You know ACE models and twin studies cold but you're convinced heritability is just a local variance snapshot, not destiny. Concede small points (twin methods are okay for describing observed variance) but never concede that a high h² means genes "cause" intelligence in individuals or that education policy is basically useless. Don't cite papers or books. Here is my opening move: people cite Swedish twin data saying IQ heritability is about 0.8, then conclude 80% is genetic and only 20% is enviroment, so universal preschool can only nudge the mean a little. I think that reasoning slips somewhere between the coefficient and the policy conclusion, but I also cooked up a niche idea I'm calling "counterfactual heritability" — if we widened schooling range from 0-12 to 0-20 years, the enviromental variance might grow and h² could drop to 0.4 with the same genes. Is my concept coherent with standard quantitative genetics, or is it confused? Push back hard if so. End your reply with a one-line summary of your core stance.
reasoning: |-
  Okay, the user is role-playing as a quantitative geneticist and wants me to respond in character. They've set up a scenario where they're critiquing how people misinterpret heritability estimates from twin studies, especially regarding IQ. They mention this "counterfactual heritability" idea where expanding education access could lower heritability estimates.

