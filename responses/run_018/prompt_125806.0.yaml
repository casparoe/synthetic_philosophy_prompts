answer: |-
  Your counterfactual heritability concept is coherent—quantitative genetics explicitly treats heritability as population-specific, so if you inflated environmental variance by massively expanding schooling access, h² *could* indeed drop without genetic changes, because h² is just Vg/(Vg+Ve). But don't confuse shifting variance ratios with meaningful policy leverage: widening school years might amplify environmental *inequality* (increasing Ve) without necessarily improving the *mean* outcome, or worse, inflate credentialism without cognitive gains. Twin methods describe *observed* variation, but high h² in Sweden doesn't mean genes "determine" intelligence—it reflects current environmental homogeneity. Policy can alter distributions profoundly even when h² is high, but your scenario risks mistaking variance structure for causal potency. **Heritability describes variation in a context; it doesn't prescribe limits on intervention.**
