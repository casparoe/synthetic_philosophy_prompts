prompt: |-
  Hey — I need you to turn a half-formed idea of mine into an actual proposal document, and I'd rather you argue with the framing than just organize it. I'm up for a one-semester internal fellowship (fall, no teaching, call it four months, deliverable is a 7000–9000 word paper plus a works-in-progress talk to the department), and I want to spend it on whether the simulation argument should cool down fanaticism about the far future. Here's where the idea came from: at happy hour last week I got into an argument with a colleague who does decision theory and a postdoc who works on global priorities. The postdoc's line was that simulation considerations are a wash — just one more speculative consideration among the many that longtermists already juggle, so nothing follows. My colleague's line was that it obviously deflates the whole thing: if we're in a simulation, the future we can affect is bounded by the simulation's runtime and budget, it may get switched off, so the astronomical numbers go away. I think they're both running together at least three distinguishable mechanisms, and that separating them is where the actual contribution is: (1) runtime truncation — the sim hypothesis caps how much future is in front of us, which shortens the tail and should dampen; (2) instantial multiplication — if the containing reality runs many simulations, or simulations within simulations, then a decision like mine may be repeated across many instantiations, and there's a genuinely hard question about whether I should count all of them or only those my evidence can distinguish, which would amplify; (3) evidential undercutting — the astronomical estimates of the far future are computed from physics we learn from the inside, and if that physics is somebody's simulation then those estimates lose their warrant in a way that raises variance much more than it lowers the mean. My suspicion, which might be wrong, is that (3) is the important one and that it cuts the opposite way from what people assume: fanaticism is driven by the shape of the upper tail, not by the point estimate, so a hypothesis that widens our uncertainty about how big the future is could make a fanatical agent *more* willing to pay, not less. So the question I want sharpened is something like: for an agent who is already fanatical in the technical sense (willing to trade large sure costs for tiny probabilities of astronomically large payoffs), does adding a non-trivial credence in the simulation hypothesis systematically raise or lower what that agent should sacrifice for far-future-directed interventions — and if the answer is that it depends, depends on exactly which parameter?

  What I want from you is the proposal itself, not the paper. Give me: the question stated tightly enough that it has a determinate answer (flag it if you think my version can't be made determinate and propose a better one); a short section on why the two reactions I got at happy hour — plus the obvious third, that simulation talk is just reheated skepticism and tells us nothing new — each leave the question open; the method, month by month, and a defense of why that method rather than the obvious alternatives (why not just plug numbers into the standard tripartite argument, why not survey what's been said about the ethics of creating simulated suffering, why a small decision-theoretic model with explicit parameters and a reversal analysis beats either); what the two or three possible upshots are and which considerations would decide between them; and an honest final section on what would make the project fail. My own worry, which I want you to steelman in that last section, is that the whole thing might dissolve into the general problem of choice under severe model uncertainty, with nothing specifically simulation-shaped doing any work — or worse, that the sign of the effect just tracks whatever prior I feed in, in which case the paper is a redescription and I should say so rather than dress it up. Scope-wise, be realistic about four months: tell me what gets cut (I'm inclined to drop the ethics of simulating suffering, any infinite-ethics complications, and the measure problem, and I'd rather hear it from you if one of those turns out to be load-bearing). And please skip the apparatus: no bibliography, no reading list, no citations, no quotation from anyone — I'll fill all that in myself, and I want the argument to stand on how the positions are structured rather than on who said what.

  Write it in American English, in prose, as a document I could hand to the fellowship committee with light edits — aim for something like 1000-1200 words, and don't pad it. Then, after the proposal, give me a JSON object (just the JSON, no commentary around it) with exactly these fields: question (one sentence, the final sharpened question); working_bet (one sentence, what I expect to conclude, phrased so it could turn out false); mechanisms (an array of exactly three objects, each with fields name, effect_on_fanaticism — one of dampens, amplifies, or ambiguous — and why in one sentence); schedule (an array of four or five strings, one per month, in order); reversal_finding (the single result that would make me abandon the working bet); failure_modes (an array of two or three strings); out_of_scope (an array of strings); confidence (an integer 1 to 5, how much you'd bet on the framing surviving contact with the literature); and talk_title (something I won't be embarrassed to put on a department poster).
