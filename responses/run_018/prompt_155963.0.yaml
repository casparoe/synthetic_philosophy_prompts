answer: |-
  ### The three-layer map  
  **Frame message**: The Kremlin's TASS announcement ("peaceful scientific progress") packaged Sputnik as innocuous space research. Target decoders: **global public & non-aligned nations** (to normalize Soviet achievement as benevolent).  
  **Outer message**: The 20.005/40.002 MHz radio pulses and orbital trajectory (223x941 km, 96min period) broadcast from the satellite itself. Target decoders: **any global observer with radio tech** (ham operators, Western tracking stations)—verifiable, literal data requiring no political interpretation.  
  **Inner message**: The unstated demonstration of an R-7 ICBM (modified for launch) capable of delivering nuclear warheads to the continental US. Target decoder: **US/NATO intelligence analysts** (who alone possessed context: the R-7's 6,000+ km range, reentry physics mirrored in Sputnik's orbit).  

  ### The decoder problem  
  The GEB analogy strains because Hofstadter's "frame message" (e.g., DNA start codon) is a **universal structural signal** for a standardized decoder (ribosome). TASS's frame was **strategic rhetoric**, not a mechanical instruction. It functioned as:  
  - *For Soviet citizens*: A straightforward victory narrative (no deeper layer needed).  
  - *For the US NSC*: A deliberate misdirection amplifying shock—the "peaceful science" frame made the military subtext *more* legible to those aware of Soviet ICBM tests (failed R-7 launches months prior). Unlike a start codon, TASS wasn't enabling decoding but *exploiting* the adversary's pre-existing knowledge. The inner message wasn't a "universal truth" but a **targeted threat display** only resolvable by a rival possessing classified intelligence.  

  ### Bottom line for the framework  
  Sputnik reveals Hofstadter's model as **culturally agnostic**—it maps layers but doesn't account for adversarial intent. Here, the "inner message" was:  
  1. **Not universal**: Meaning existed solely for a hostile, high-context decoder (US ICBM analysts).  
  2. **Weaponized**: The frame wasn't scaffolding but camouflage, making the outer message (beeps) a taunt once the inner message clicked.  
  3. **Collapsible**: For the Soviet public, frame *was* content—no "inner" layer existed. The framework holds structurally but **fails to distinguish between cooperative communication (GEB) and competitive signaling (geopolitics)**, where layers serve deception/dominance, not shared understanding. Inner messages in statecraft are often threat displays precisely because decoders are adversaries.
