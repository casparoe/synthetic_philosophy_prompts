  We are mapping Hofstadter's ideas about formal systems (from "Gödel, Escher, Bach") to dependently-typed proof assistants (Lean/Agda). The key concepts:

  1. **JOOTSing (Jumping Out Of The System)**: The idea that to resolve certain questions (like consistency) about a formal system, one must step outside the system and use a meta-perspective.

  2. **The MU-puzzle**: An example of an undecidable string within a particular formal system (the MIU-system). The puzzle asks whether the string "MU" can be produced from the axiom "MI" using the system's rules. It turns out that it cannot, and this undecidability is a consequence of the system's limitations (related to Gödel's incompleteness).

  Hofstadter's philosophical claim: A formal system cannot resolve its own consistency or escape its own rules without some external frame.

  We are to restate this using:
  - Object-level vs meta-level reasoning
  - Reflection (the ability of a system to represent and reason about its own structure)
