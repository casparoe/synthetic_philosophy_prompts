  Decompose the credence into four terms with rough probabilities and one line of justification each: (a) the probability that practical stakes genuinely affect whether a subject knows, not merely whether she may assert it; (b) the probability that, if stakes do not affect knowledge, contextualism could still be true via purely conversational mechanisms that are independent of practical stakes; (c) the probability that subject-sensitive invariantism can accommodate the standard bank-case intuitions without invoking any contextualist semantic machinery; and (d) the probability that the knowledge/assertion distinction is theoretically robust enough to bear the explanatory weight required in (a) through (c). Combine them into an overall number.

  Then tell me which term you are least confident in and specify what kind of evidence—perhaps about patterns of ordinary linguistic usage or about the structure of practical reasoning—would move it most. For reference, my credence in the overall hybrid view is about 0.60, while my friend's is about 0.25. Given your decomposition, which of the four terms do you think best explains the gap between us?
