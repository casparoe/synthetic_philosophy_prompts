  **OmniGroup Human Capital Management Policy Handbook (Rev. 8.7.5)**

  **1. Karmic Ledger Accounting & Current Embodiment Assignment.**
  Employee status (Full-Time, Contract, Probational Embodiment) is determined solely by the verified Aggregate Net Merit (ANM) score from the immediately preceding incarnation cycle, as audited by the Karmic Compliance Office (KCO). ANM is calculated using Form K-1040 (Cumulative Merit Statement), factoring in all quantifiable meritorious actions (positive units) and demeritorious actions (negative units) against the prevailing Moral Code Index (MCI v.12.3). Placement within the current organizational hierarchy and initial compensation band are non-negotiable outputs of this ANM valuation. Appeals regarding embodiment circumstances (e.g., geographic location, congenital disadvantage, societal unrest) are inadmissible, as these represent statistically necessary variance within the actuarially fair distribution model, ensuring operational equilibrium across the reincarnation cycle. Past-life merit carries a standard inter-incarnational compound interest rate of 3.5% APR, compounded quarterly, applied to positive ANM balances only.

  **2. Merit Accrual, Performance Evaluation, & Promotion Eligibility.**
  In-cycle merit accrual is tracked in real-time via the Karmic Activity Monitoring System (KAMS). Performance evaluations are conducted quarterly, comparing accrued merit units against the established Karmic Performance Quota (KPQ) for the employee’s current role and embodiment tier. Promotion eligibility requires exceeding the KPQ by a minimum of 15% for two consecutive quarters AND demonstrating a positive projected ANM trajectory sufficient to justify the requested hierarchical elevation in the *next* embodiment cycle. Note: Promotion within the *current* lifetime is contingent upon available embodiment slots within the target tier possessing requisite ANM thresholds; scarcity reflects systemic merit distribution constraints and is not subject to grievance. Past-life merit interest (Section 1) is included in promotion eligibility calculations but does not accrue additional interest during the current cycle.

  **3. Demerit Assessment, Corrective Action, & Position Elimination.**
  Demerits are assigned automatically per the MCI for violations ranging from ethical breaches (e.g., Section 4.7a: Unauthorized Resource Hoarding) to productivity lapses (e.g., Section 8.2d: Suboptimal Cognitive Output). Persistent negative merit accrual, or a single demerit exceeding Threshold Gamma (defined as 50% of current ANM), triggers mandatory Corrective Realignment. This typically manifests as involuntary separation (layoff), chronic illness, significant financial loss, or other forms of embodiment-level friction calibrated to offset the demerit balance ("demerit offsetting"). Severance packages and unemployment benefits are not offered, as the corrective event itself constitutes the designated mechanism for karmic rebalancing. Position elimination due to departmental restructuring reflects the aggregate demerit load of the affected unit exceeding sustainable operational thresholds.

  **4. Retroactive Desert Adjustments & Cognitive Impairment Provisions.**
  Employees may petition the KCO for Retroactive Merit Reassessment (RMR) under specific conditions outlined in Form K-1120. Qualifying conditions include, but are not limited to: documented severe cognitive impairment (temporary or permanent) during the action in question, verifiable coercion under metaphysical duress, or acting under demonstrably incorrect karmic guidance from a certified KCO advisor. Approved RMR petitions result in demerits being recalculated at 50% of standard value or merit units credited at 125% (depending on petition type). However, RMR applications filed post-embodiment transition incur a 20% administrative processing fee deducted from the petitioner's *next* incarnation's starting ANM. Ignorance of the MCI is never grounds for RMR.

  **5. Transparency, Audit Rights, & Statistical Variance Acknowledgment.**
  Employees have the right to request a summary Karmic Ledger Statement (KLS-1) biannually. Detailed audit requests require KCO pre-approval and may incur ANM processing fees. The system acknowledges inherent statistical noise ("karmic drift") within the embodiment assignment and demerit offsetting processes. Approximately 4.7% of all suffering events are attributable to non-corrective systemic variance, necessary for the large-scale actuarial integrity of the merit desert framework. Such events are classified as "Non-Attributable Suffering Episodes" (NASEs) and do not contribute to future ANM calculations. Concerns regarding perceived injustice in NASEs or overall framework fairness constitute Category 5 Grievances and are acknowledged for record-keeping purposes only, as the fundamental premises of quantifiable moral desert and its cross-incarnational enforcement are non-negotiable pillars of OmniGroup operational philosophy.
