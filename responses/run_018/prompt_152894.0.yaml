  - Internal mechanism = Bimetallic strip/sensor
  - Level of description = Intentional stance

  Key disanalogies with LLMs: Thermostats lack compositional representation, generative capacity, and the complex error-correction mechanisms of transformers. Its "belief" is literally just a scalar threshold.

  For the molecule analogy correspondence:
  - Agent = Single molecule
  - Belief-state = "Has temperature"
  - Predictive success = None (meaningless attribution)
  - Internal mechanism = Atomic structure
  - Level of description = Erroneous micro-level application

  Critical disanalogy here: Neural networks do have distributed representational structures that legitimately encode information, unlike molecules. Beliefs might be emergent without requiring discrete localization.

