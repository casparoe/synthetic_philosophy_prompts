  Organizational functionalism and predictive processing excel because Aunt Hillary-Prime *operationalizes* cognition through distributed functions. Biological naturalism fails by ignoring scale-invariant causal efficacy, while IIT and relational approaches are hampered by measurement vagueness and insufficient weight on internal hierarchy, respectively. The variance modulation mechanic is the linchpin, proving functional organization can generate mind-like properties without representation or biology.
