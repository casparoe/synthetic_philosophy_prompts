  The objection conflates *implementation* with *causation*: The colony's error-correction loops generate system-level causal powers (e.g., optimizing foraging via variance control) that are irreducible to individual ants. Biological naturalism cannot explain how functional organization (not substrate) produces adaptive intelligence here, dismissing emergent causality via a mereological fallacy.  

