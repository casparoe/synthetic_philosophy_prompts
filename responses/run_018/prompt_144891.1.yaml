answer: |-
  Here's your restatement of anekāntavāda/syādvāda/saptabhaṅgī in biostatistical terms, with mappings, residue analysis, and scholarly caveats. I'll follow your specifications rigorously, separating consensus from contested views and flagging the epistemic humility debate.

  ---

  ### **Core Translation: Model-Dependent Ontology**
  **Jain Premise:** Reality is irreducibly multi-faceted (*anekānta*). No single statement captures "truth" absolutely; all claims are context-dependent (*syādvāda*: "in some sense").  
  **Biostatistical Restatement:** There is no single "true" parameter (e.g., ATE, OR). All estimates are conditional on:  
  - The adjustment set **Z** (covariates, mediators, colliders)  
  - The subpopulation **S** (effect modifiers, strata)  
  - The functional form **f** (linear, logit, ML specification)  

  Truth is *model-relative* until you specify {**Z**, **S**, **f**}.  

  ---

  ### **Saptabhaṅgī as Model Uncertainty & HTE**  
  Each of the seven modes maps to a statistical scenario of parameter instability. Assume we study a treatment *X* and outcome *Y*:  

  | **Jain Mode**         | **Statistical Scenario**                                                                 | **Concrete Example**                                                                 |
  |------------------------|------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **1. Syād asti**       | *Naive estimate under minimal adjustment.* Unadjusted association in the full population. | Crude OR = 1.8 (95% CI: 1.5–2.1) for *X*→*Y*, ignoring confounding.                 |
  | **2. Syād nāsti**      | *Sign reversal under necessary adjustment.* Conditioning on key confounder **Z₁** flips sign. | After adjusting for socioeconomic status, OR = 0.7 (0.6–0.9).                       |
  | **3. Syād asti nāsti** | *Simpson’s paradox.* Jointly true in subsets, false in aggregate (or vice versa).          | OR >1 in males, OR <1 in females; unadjusted OR ≈1. Heterogeneous treatment effect. |
  | **4. Syād avaktavyaḥ** | *Non-identifiable.* Parameter undefined due to non-overlap or non-transportability.       | No comparable units for *X*=1 and *X*=0 in age>80 subgroup. Positivity violation.   |
  | **5. Syād asti avaktavyaḥ** | *Partially estimable.* Effect detectable in one subgroup, undefined in another.          | Significant HTE in urban areas (RR=1.6), but rural sample size too small for inference. |
  | **6. Syād nāsti avaktavyaḥ** | *Null in one subgroup, undefined in another.*                                           | Null effect (CI crosses 1) in males; non-overlap in females.                         |
  | **7. Syād asti nāsti avaktavyaḥ** | *Mutually contradictory inferences across specifications.*                             | Bayesian model: Pr(β>0)>0.9; Frequentist SEM: β̂=-0.2 (p=0.03). Sensitivity analysis fails. |

  ---

  ### **Residue Report: What Doesn’t Map**  
  **Clean Translations (Direct Analogs):**  
  - Covariate dependence ↔ Conditional reality ("under which controls")  
  - HTE ↔ Perspective-dependence ("for whom")  
  - Sensitivity analysis ↔ Systematic qualification (*syāt*)  
  - Non-overlap/positivity violations ↔ *Avaktavyaḥ* (inexpressible)  

  **Strained Fits (Require Distortion):**  
  - **Metaphysical commitments**: Jains assert objects *actually* have infinite attributes. Biostatistics treats attributes as *contingent* (data limitations, omitted variables).  
  - **Simultaneity**: Modes 3–7 describe *coexisting* truths. In statistics, conflicting estimates imply model misspecification—not simultaneous validity.  
  - **Avaktavyaḥ**: In stats, "undefined" is a technical failure. In Jainism, it’s an ontological category (e.g., ineffable attributes of a soul).  

  **No Counterparts (Untranslatable):**  
  1. **Ethical commitment to epistemic humility**: Anekāntavāda demands *moral* duty to seek multiple perspectives. Statistics has no parallel imperative (e.g., p-hacking isn’t *immoral*, just biased).  
  2. **Karmic ontology**: Jains ground *anekāntavāda* in karma’s multi-faceted nature. No statistical analog.  
  3. **Infinite attributes**: Stats uses finite dimensions (e.g., *p* covariates); Jains posit literal infinity.  

  ---

  ### **Scholarly Consensus vs. Contested Views**  
  **Settled in Jain Scholarship:**  
  - Saptabhaṅgī is a *logical schema* for qualifying assertions, not a probabilistic framework.  
  - *Syāt* ("maybe") implies conditional assertion, not epistemic doubt.  
  - Modes are non-sequential; all apply simultaneously to any entity.  

  **Genuinely Contested:**  
  - **Epistemic humility vs. logical ambiguity**: Some scholars (e.g., Matilal) read saptabhaṅgī as a *discipline* for avoiding dogmatism. Others (e.g, Balcerowicz) see it as formal logic. **This debate exists but is niche**—most agree it serves both functions.  
  - **Metaphysical status**: Is anekāntavāda an *ontological* claim (reality is plural) or *epistemological* (perspectives are limited)? Consensus leans ontological, but dissenters exist (e.g., Priest).  

  **Not Contested (But Often Misrepresented):**  
  - Saptabhaṅgī is *not* relativism. Jains insist one can discern "better" perspectives (e.g., covariate adjustment improves validity).  
  - It is *not* fuzzy logic. Each mode is binary (e.g., "is" or "is not" under condition **Z**).  

  ---

  ### **Key Takeaway for Your Framework**  
  Anekāntavāda is **extreme model dependence**: every parameter is a function of {**S**, **Z**, **f**}, with no unqualified "true" value. Saptabhaṅgī systematizes how estimates can flip, vanish, or contradict across specifications—mirroring your "annoying subgroup analyses." But Jainism embeds this in a *normative* stance: holding multiple models simultaneously is intellectual virtue, not just technical caution. Where stats stops at "report sensitivity analyses," Jains add "cultivate humility." That residue—the ethical weight of epistemic pluralism—is where the translation ends.
