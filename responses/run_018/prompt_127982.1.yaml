  ok so imagine Georg Cantor is somehow alive in 2025 and he sees how mathematicians use the axiom of choice in computer proof systems like Lean or Coq -- they invoke it constantly to build huge libraries, but acutally it breaks the ability to extract computable values from a lot of proofs. Meanwhile there's this modern philospohical fight about wether AC is literally true of sets or just a useful fiction, with some people treating it like a toggleable setting in a formal system. Given Cantor's real views on actual infinity and well-ordering, what do you think he'd say about treating AC like default software that sacrifices computation? Would he see the loss of explicit values as a betrayal of mathematical reality, or just a practical tradeoff? Please answer in American English and keep it pretty casual.
