  In the postgraduate lounge there's an unwritten norm: no talking before 11am weekdays. It's evolved organically, not in any handbook, and it works as a coordination problem with an arbitary solution. Now a new cohort chats loudly everymorning, and old-timers want us to codify 'quiet hours 8-11' with formal warnings. Others argue that writing it down destroys the convention — turning a Lewis-style social rule into coercive regulation — and there's even a meta-norm that lounge etiquette never gets formalised.

  Can you act as a professional philosopher of social norms? Think carefully, start with a quick brainstorm of Lewis's conditions (regularity, coordination problem, arbitary alternative, preference for conformity), then draft the panel's memo. Recommend one concrete course — formalise, reject, or a hybrid — with a clear implementation time frame. Take a committed position with reasons, but treat the strongest losing argument seriously. Use British English, no bibliographies or citations please — i need this for thursday's meeting. I'm especially keen on whether that meta-norm is itself a second-order convention we ought to protect.
