prompt: |-
  In the years after German reunification, courts in the unified Federal Republic convicted East German border guards of homicide for shooting people who tried to cross the Berlin Wall. The guards had been following written directives of the German Democratic Republic that were in force at the time and that authorized, even mandated, the use of lethal force against fugitives. In rejecting their defense, the appellate courts reasoned that a state directive which violates fundamental principles of justice in an intolerable way never had the status of law, even when the directive satisfied the state's own criteria of legal validity at the time. I want to know what this practice presupposes about the relationship between law and morality. Does convicting the guards strictly presuppose a natural-law thesis — that a sufficiently unjust directive is not genuinely law and therefore confers no legal permission or obligation — or is the practice fully compatible with legal positivism, which separates a rule's status as law from its moral merit? If a positivist can accept the result, what exactly must the positivist say about the earlier directive and about the basis of the later prosecution? Please distinguish what the practice strictly presupposes from what it merely fits well with, and say whether there is a way to describe the courts' reasoning that leaves the positivist/natural-law dispute unresolved.
reasoning: |-
  Okay, the user is asking about a specific legal case involving East German border guards after reunification. They were convicted for shootings that were legal under East German law at the time. The courts rejected their defense by arguing that directives violating fundamental justice aren't valid law. The user wants to know what this implies about law and morality—whether it requires natural law or if legal positivism can accommodate it.

  First, I need to recall the key differences between natural law and legal positivism. Natural law theorists like Aquinas or Fuller argue that immoral laws aren't truly laws. Positivists like Hart or Austin separate law's validity from its morality; a law can be valid but unjust. The user is asking if the court's decision presupposes natural law or if positivists can explain it.

  The courts used the Radbruch Formula, which is a middle ground. It says extremely unjust laws lose legal validity. Radbruch was a positivist who changed his view after WWII. The formula allows invalidating laws that are intolerably unjust. This isn't pure natural law because it's an exception, not a full merger. Positivists might accept this as a rule of recognition in the new legal system. After reunification, Germany incorporated international human rights, which could make past laws invalid if they conflict with these norms. 

  The user also wants to distinguish strict presuppositions from compatibility. Strictly, the court's reasoning assumes that morality can invalidate law, which natural law endorses. But positivists can reinterpret this by saying the new legal system's rules incorporate morality, like through constitutional principles. So, while it fits natural law, it's not exclusive. 

  The unresolved approach would focus on the new legal order without delving into why the old laws were invalid. Just state that the new system prosecutes based on current laws, not debating the old law's validity. This avoids taking a side in the positivist vs. natural law debate.
answer: |-
  The conviction of East German border guards by unified German courts presents a profound challenge to legal theory, revealing tensions between law and morality. This practice **does not strictly presuppose a natural-law thesis**, but it **is fully compatible with certain sophisticated forms of legal positivism** under specific conditions. Below is a detailed analysis:

  ### 1. **What the Practice Strictly Presupposes**
     - **Fundamental Incompatibility with Extreme Injustice**: The courts presuppose that *no legal system can validly enact directives that flagrantly violate core principles of justice* (e.g., the right to life, dignity, and due process). This invokes the **Radbruch Formula** (named after legal philosopher Gustav Radbruch), which holds that laws lose legal validity when they reach a threshold of intolerable injustice.
     - **Legal Continuity Through Moral Principles**: The unified German state presupposes that the *reunified legal order inherits a commitment to fundamental justice* that transcends the positivist rules of the former GDR. The prosecution treats the GDR’s directives as void *ab initio* (from the outset), not merely repealed.

  ### 2. **Compatibility with Legal Positivism**
  A positivist can accept the convictions by appealing to **the rules of the new legal system** without conceding that morality is intrinsic to law’s existence. Key positivist responses include:
     - **Incorporationism**: The reunified Germany’s constitution (Basic Law) incorporates fundamental rights (e.g., Article 1: human dignity) and international law (e.g., ICCPR). A positivist would argue that *post-reunification courts applied valid legal rules of the new system* to judge past actions, not eternal moral truths. The old directives were invalid *under the new legal order* because they conflicted with its supreme norms.
     - **Rule of Recognition Shift**: The GDR’s directives satisfied its *own* rule of recognition (e.g., enacted by the Volkskammer). After reunification, the rule of recognition changed to prioritize human rights. Prosecutions were based on the *new* rule, not the old one.
     - **Retroactive Validation of Higher Law**: The positivist might argue that the guards’ acts violated *pre-existing international human rights law* binding on the GDR (e.g., Universal Declaration of Human Rights). Though unenforced in the GDR, these norms became actionable in the new system.

  ### 3. **What the Practice Merely Fits Well With**
     - **Natural Law Theory**: The reasoning aligns perfectly with natural law (e.g., Aquinas, Finnis), which holds that unjust laws are not "true law" (lex iniusta non est lex). The courts’ dismissal of the GDR directives as non-law due to injustice is a textbook natural law move.
     - **Inclusive Positivism**: This view (e.g., Hart, Waluchow) allows moral criteria to be *incorporated* into a legal system’s validity tests. The reunified Germany’s constitution explicitly makes morality (e.g., human dignity) a condition for legal validity, fitting this model.

  ### 4. **A Neutral Description Leaving the Dispute Unresolved**
  The courts’ reasoning can be framed in a way that **does not resolve the positivist/natural law debate**:
     - *"The reunified German legal order, grounded in the inviolable principles of the Basic Law and international human rights, refuses to recognize the legal validity of GDR directives that grossly violated these principles. The guards’ acts were criminal under the normative framework now governing Germany, which asserts authority over the past in service of justice."*  
     This description:
       - Avoids declaring whether the GDR directives *were ever valid law*.
       - Focuses on the *new system’s authority* to invalidate past norms.
       - Leaves open whether this invalidation stems from moral truth (natural law) or the new system’s contingent rules (positivism).

  ### Key Takeaways:
  | **Aspect**               | **Natural Law View**                                  | **Positivist View**                                                                 |
  |--------------------------|-------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **GDR Directives**       | Never valid law due to injustice.                     | Valid under GDR’s rules, but voided by new legal order post-reunification.          |
  | **Basis of Conviction**  | Moral nullity of the directives.                      | Application of the reunified Germany’s legal rules (incorporating morality).        |
  | **Presupposition**       | Morality is necessary for legal validity.             | Law’s validity is separate from morality, but new systems can override past laws.   |

  ### Conclusion
  The practice **strictly presupposes that extreme injustice negates legal validity** in the context of a successor state committed to human rights. While this resonates deeply with natural law, an **inclusive positivist** can reconcile it by arguing that the *reunified German legal system* adopted moral criteria as part of its rule of recognition. A **neutral description** is possible by focusing on the new legal order’s authority without metaphysical claims about law’s nature. Thus, the case becomes a battleground for theorists but does not *require* abandoning positivism.
