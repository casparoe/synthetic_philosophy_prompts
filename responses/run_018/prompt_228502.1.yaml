prompt: |-
  For more than half a century philosophers and cognitive scientists have argued about whether the brain is a computer, and the debate seems to me to have stalled rather than progressed. The computationalists point to the predictive and explanatory success of information-processing models in neuroscience and to the apparent naturalness of describing neurons as encoding, transforming and transmitting signals. The critics reply that computation is too cheap to be explanatory: if a sufficiently ingenious mapping makes a wall or a thunderstorm implement any computation you like, then calling the brain a computer either says nothing or merely records a choice of modelling vocabulary rather than a discovery about what the brain is doing. My working hypothesis is that the impasse is really a disguised disagreement about the concept of computation itself — about whether being a computing system is an observer-independent property of a physical mechanism or always relative to a description — and that both sides quietly presuppose their preferred answer rather than argue for it. Is that the right diagnosis, or is something else doing the work: a hidden empirical question about what neural coding actually is, a difference about what a scientific explanation must deliver, or a purely verbal dispute about the word computer? Please give a diagnosis with reasons, engaging what each side actually argues, and say what would genuinely move the debate forward on your diagnosis — a conceptual distinction, a formal result about implementation, a class of experiments — or argue, if you think so, that no such resolution should be expected and why. Please answer in British English.
reasoning: |-
  Okay, the user presents a sophisticated philosophical quandary about whether the brain is a computer, noting the decades-long stalemate between computationalists and critics. They've astutely framed the debate's core tension: computationalists champion neuroscience's success with information-processing models, while critics dismiss computation as "too cheap" to be meaningful (since even walls can be described computationally if you force the mapping). The user suspects the impasse stems from an unexamined disagreement about computation itself—specifically whether it's an observer-independent property or description-relative—and asks if this is the right diagnosis or if something else (empirical, explanatory, or semantic) is at play. They also want actionable ways forward.  

  Hmm, let's unpack this carefully. First, the computationalist position: they're not wrong that "neural coding" language is pervasive in neuroscience—action potentials as "spike codes," sensory cortices as "feature detectors." It's empirically productive; think of Bayesian brain theories predicting perception. But the critics (like Searle with his wall analogy) have a devastating point: if any physical system can be twisted into computing your favourite algorithm, then calling the brain a computer feels vacuous. It's like saying "the brain does stuff"—true but trivial.  

  The user's hypothesis about observer-relativity hits the nail on the head. When computationalists say "neuron X encodes edge orientation," they quietly assume this is as real as sodium channels opening; critics see it as us projecting useful descriptions onto biology. Neither side admits this metaphysical rift—they just talk past each other. But is that the whole story? I wonder...  

  Ah! There's also a sneaky empirical issue beneath the surface: what *is* neural coding, really? If we could prove—not assume—that brains physically implement computations in a way walls don't (e.g., via error-correcting codes or teleonomic functions), that would ground computationalism. Critics would still retort, though: "That just shows brains compute *for us*." Which circles back to... yes, the user's diagnosis holds.  

  For progress? Three prongs: (1) Formalise "implementation" rigorously—perhaps using causal specificity measures to show brains *uniquely* instantiate computations unlike walls. (2) Test if neural codes behave like designed information systems (e.g., optimal compression in sensory pathways). (3) Force both sides to admit their metaphysical baggage. No resolution without that.  

  British English check: "programme" not "program," "realise" not "realize." Sorted.
answer: |-
  Your diagnosis cuts to the heart of the impasse – and I agree it's largely correct. The core disagreement *is* ontological and conceptual, centring on whether computation is an intrinsic, observer-independent property of physical systems (like mass or charge) or an observer-relative, interpretative lens we apply. However, the debate's stasis involves subtle entanglements with empirical questions about neural coding and expectations of explanation. Let's dissect each side and why the impasse persists.

  **1. The Computationalist Stance & Its Quiet Presuppositions:**
     *   **What they argue:** Computationalists point to the *unrivalled empirical success* of information-processing models. Neuroscientists routinely describe neurons and circuits as "encoding" sensory inputs (e.g., retinal ganglion cells encoding contrast edges), "processing" information (e.g., cortical columns performing transformations), "storing" memories (e.g., synaptic weights), and "transmitting" signals (e.g., action potentials). Models like predictive coding, Bayesian inference in perception, and reinforcement learning algorithms provide testable predictions and mechanistic explanations for cognitive phenomena. Describing neurons as computational elements seems the most natural and productive language available.
     *   **The Quiet Presupposition:** Beneath this lies a commitment to *realism about computation and representation.* They presuppose that the brain *intrinsically* performs computations – that the "codes" and "processes" identified are *real* features of the brain's causal structure, not just convenient fictions. They often implicitly treat "computation" as a natural kind or a functional property that arises from specific causal organisation, akin to how a heart intrinsically pumps blood. For them, the wall analogy fails because walls lack the *specific causal structure* necessary for genuine computation – the systematic, counterfactual-supporting causal dependencies between components that mirror formal operations.

  **2. The Critic's Stance & Its Quiet Presuppositions:**
     *   **What they argue:** Critics (like Searle with the Chinese Room, or more recently, proponents of embodied/enactive cognition) wield the "computation is too cheap" argument. Any physical system can be *described* as implementing *any* computation with sufficient interpretive ingenuity (the wall, the storm, the solar system). Therefore, labelling the brain a "computer" either:
          *   **Says nothing substantive:** It's trivially true of any system, offering no unique insight into the brain.
          *   **Is merely descriptive:** It reflects *our choice* of modelling framework (a useful fiction) rather than revealing an intrinsic property *of the brain itself*.
          *   They argue that attributing computation requires an external interpreter assigning meaning (semantics) to the physical states (syntax). Without this observer, there is no computation, only physics.
     *   **The Quiet Presupposition:** Critics presuppose a *strong observer-relativity* of computation. Computation isn't "in" the system; it's projected onto it by an external user/interpreter for a purpose. They see computation as fundamentally semantic and intentional – requiring *aboutness* (representation) which, they argue, cannot be intrinsic to mere physics. For them, the brain's causal dynamics are just complex biophysics; labelling bits of it "computation" is an anthropomorphic gloss.

  **Why Your Diagnosis is Largely Correct:**
  The fundamental clash *is* about the metaphysics of computation. Computationalists presuppose intrinsic computational properties; critics presuppose observer-relativity. This difference isn't explicitly argued but forms the bedrock of their positions. When a computationalist points to "neural coding," the critic sees an observer imposing a code; when the critic points to the wall, the computationalist sees a lack of the *right kind* of causal structure. They are talking past each other on an ontological level.

  **Entanglements with Other Factors:**
  *   **Empirical Questions about Neural Coding:** This *does* play a role. The debate fuels (and is fuelled by) ongoing research into *what constitutes a neural code* (e.g., rate vs. temporal codes, population codes). If a genuinely observer-independent, unambiguous, and uniquely computational notion of "neural coding" could be empirically established (e.g., codes demonstrably optimised for information transmission under evolutionary constraints, with intrinsic error-correction), it would bolster the intrinsic view. Conversely, persistent ambiguity strengthens the observer-relative view. However, the *interpretation* of such findings will *still* be filtered through the ontological presuppositions.
  *   **Expectations of Explanation:** Critics often demand explanations that account for intrinsic meaning, consciousness, or embodied interaction, which they feel computational models fail to provide (or only provide syntactically). Computationalists see mechanistic, causal explanations of cognitive functions as the goal, for which computation is perfectly adequate. This reflects a difference in what each side considers a *complete* explanation.
  *   **Verbal Dispute?** While partly semantic (what does "computer" *mean*?), it's more than *just* words. It's a disagreement about the fundamental nature of the phenomenon being described and the status of scientific models. Calling it purely verbal prematurely dismisses the deep metaphysical divide.

  **Moving the Debate Forward:**
  A resolution requires confronting the core ontological disagreement *explicitly* and seeking ways to test its implications. Here’s what could genuinely move things forward on your diagnosis:

  1.  **Formalising "Implementation" Rigorously:** A crucial step is moving beyond simplistic notions of mapping states. We need a robust, formal, *causal-mechanistic* theory of implementation that distinguishes *mere* interpretability (the wall) from *bona fide* computation.
      *   **Focus on Causal Specificity & Counterfactuals:** Define computation implementation in terms of the system's causal structure supporting *specific counterfactuals*. Does the system's physical organisation *robustly and specifically* support state transitions that mirror formal operations *across relevant variations*? A wall doesn't support counterfactuals about changing its "program" or inputs in a way that systematically alters its "output"; a brain (arguably) does. Formal frameworks like interventionist causation could be applied.
      *   **Demarcate "Trivial" vs. "Non-Trivial" Implementation:** Develop criteria based on complexity, robustness, teleonomy (purpose), or algorithmic efficiency *within the system's own dynamics*. Does the system *use* the putative computational states in a way that causally contributes to its functions (e.g., survival, behaviour)? A thunderstorm doesn't "use" its mapped states; neural circuits demonstrably do. This links computation to biological function.

  2.  **Empirical Research Informed by the Distinction:** Design experiments *explicitly testing* the observer-independent vs. observer-relative nature of putative computations:
      *   **Search for Intrinsic Error-Correction & Optimisation:** Do neural codes exhibit properties like error-correction, data compression, or efficient representation *from the perspective of the organism's needs* (e.g., energy efficiency, speed, accuracy in relevant tasks), independent of an external modeller's interpretation? Finding such intrinsic optimisation would support computational realism.
      *   **Manipulating "Codes":** Can we experimentally manipulate what is hypothesised to be a neural code (e.g., specific spike timing patterns) and *predictably disrupt specific cognitive functions* in a way that aligns with the *formal* consequences of disrupting that code in an abstract algorithm? Strong, counterfactual-supporting causal links bolster the intrinsic view.
      *   **Comparative Neurobiology:** Do simpler nervous systems (e.g., C. elegans) implement computations in a way demonstrably less "cheap" than a wall? Identifying a continuum or threshold of causal complexity necessary for non-trivial computation would be telling.

  3.  **Conceptual Clarification & Acknowledgement:** The field needs to explicitly recognise the ontological divide:
      *   **Distinguish Strong vs. Weak Computationalism:** "Weak" computationalism accepts the utility of computational *models* as observer-relative tools without claiming computation is intrinsic. "Strong" computationalism asserts intrinsic computational properties. Most neuroscientists likely practise weak computationalism; critics attack strong computationalism. Clarifying this could reduce talking past each other.
      *   **Articulate the Presuppositions:** Force both sides to explicitly defend their ontological stance on computation and representation. Why *isn't* the wall a computer? What *exactly* makes neural computation different? Genuine debate requires engaging these foundations.

  **Conclusion:**
  You are right that the stalled debate primarily stems from the disguised ontological disagreement about computation's observer-independence. While entangled with empirical questions (especially concerning neural coding) and differing explanatory ideals, the core clash is conceptual. Progress requires rigorously formalising implementation to distinguish trivial interpretability from genuine computation, designing experiments probing the intrinsic computational properties of neural systems, and explicitly confronting the metaphysical presuppositions. Without this, the debate will remain circular. A resolution *is* possible, but it demands moving beyond simply pointing to modelling successes or philosophical counter-examples and tackling the foundational question head-on: What *is* computation in the physical world, and what makes a physical system *truly* a computer? Formal results on implementation and targeted empirical work inspired by this distinction offer the best path forward. Expecting resolution without directly addressing the core ontological issue is unrealistic.
