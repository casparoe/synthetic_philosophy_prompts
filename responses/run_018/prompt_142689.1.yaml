answer: |-
  ## Joint Statement of Adversarial Collaboration: Understanding in Statistical Machine Translation

  **Preamble:** This document represents a consensus framework for collaborative investigation between the **Functional-Equivalence Camp (FEC)** and the **Conceptual-Anchor Camp (CAC)** regarding the nature of "understanding" in large-scale neural statistical machine translation (MT). We agree that resolving our core disagreement – whether current MT systems achieve a form of genuine interlingual comprehension or merely sophisticated pattern-matching – requires precise mechanistic analysis, particularly concerning phenomena where meaning is tightly bound to grammatical structure, such as evidentiality. We commit to jointly designing and interpreting empirical tests targeting specific divergence points.

  **1. Agreed Claims:**

      1.1  **Architecture:** Current state-of-the-art MT systems (primarily deep neural networks, especially encoder-decoder transformers) process language by learning complex statistical mappings between source and target language sequences based on patterns extracted from massive parallel corpora. They utilize distributed vector representations (embeddings) and attention mechanisms to model relationships between tokens and phrases. There is no explicit, human-interpretable symbolic representation of concepts, rules, or world knowledge within the model parameters or activations in a manner directly analogous to traditional symbolic AI or human propositional attitudes.
      1.2  **Evidentiality Translation Requirement:** For a source language sentence containing grammatical evidential markers (e.g., direct visual vs. hearsay), successful translation into a target language lacking grammatical evidentiality (e.g., English) requires the target sentence to pragmatically imply the correct epistemic source, or explicitly state it if contextually necessary to preserve the intended meaning/force. Merely translating the propositional content while ignoring the evidential nuance constitutes a translation failure.
      1.3  **Formal Constraints:** All computational systems, including statistical MT models, are subject to formal limitations relevant to language and meaning:
          *   **Undecidability of Equivalence:** There exists no general algorithm to decide semantic equivalence for arbitrary sentences (a consequence of formal results like the undecidability of first-order logic and the halting problem, impacting semantic theories).
          *   **Compositionality Challenge:** Statistical models face inherent difficulties in robustly generalizing compositional structure beyond their training distribution (e.g., handling novel combinations of known words/phrases in ways requiring systematic semantic composition), as evidenced by performance drops on systematic generalization benchmarks. While not a strict "no-go" theorem forbidding success, it presents a significant empirical hurdle requiring specific architectural or training innovations to overcome reliably.

  **2. Disagreements Table:**

  | Point of Divergence                                                                 | Functional-Equivalence Camp (FEC) Position                                                                                                                                 | Conceptual-Anchor Camp (CAC) Position                                                                                                                                                                                              |
  | :---------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of "Correct" Evidential Translation**                                      | A translation is correct if, within the relevant context, the target utterance conveys the same propositional content *and* pragmatic implicature regarding epistemic source as the source utterance, judged by competent native speakers. | A translation is correct only if the system generates the target utterance *by virtue of* internally representing the specific epistemic relation (e.g., direct perception vs. reported speech) denoted by the source grammatical marker. |
  | **Sufficiency of Distributional Correlation**                                       | The statistical correlations learned from parallel corpora, enabling the system to generate target outputs that reliably preserve evidential implicatures across diverse contexts, constitute a sufficient mechanistic basis for achieving genuine (though non-human) interlingual comprehension of this aspect. | Learning distributional correlations between source markers and target lexical/contextual patterns is necessary but *insufficient* for genuine comprehension. It lacks the explicit conceptual anchoring (representation of the epistemic *relation itself*) required to reliably preserve meaning, especially under compositional pressure or novelty. |
  | **Mechanism & Ontology of "Understanding"**                                         | "Understanding" in MT is a functional capacity: the reliable performance of interlingual meaning transfer across a wide range of inputs. Attributing "shallow understanding" confuses mechanism (statistical) with performance (genuine transfer). Demanding human-like mechanism is a category error. | "Understanding" requires more than input-output correlations; it necessitates model-internal states that function as representations *of* the concepts and relations involved (e.g., epistemic states). Without these explicit anchors, the system manipulates forms devoid of comprehension. |

  **3. Cruxes & Predictive Tests:**

  We agree that resolving the following empirical questions would significantly advance the debate, potentially altering one or both camps' positions. Joint experiments will be designed around these cruxes:

      3.1  **Low-Resource Evidentiality Failure Modes:**
          *   **FEC Prediction:** In language pairs where the source has grammatical evidentiality and the target does not, MT systems trained on *sufficiently large and high-quality parallel corpora* will correctly convey the evidential implicature in translations, *even for novel sentences*, with high reliability. Performance degradation in low-resource settings stems primarily from data sparsity, not a fundamental lack of comprehension.
          *   **CAC Prediction:** Even with moderate data, systems will exhibit *systematic* failures translating novel sentences where the evidential marker interacts compositionally with other elements (e.g., negation, modality, complex embedding) or in contexts demanding precise epistemic disambiguation. Errors will reveal confusion about the *meaning* of the evidential marker, not just lack of exposure. Low-resource settings exacerbate this core limitation.
          *   **Test:** Train MT models on carefully constructed datasets for a source language with evidentiality (e.g., Tibetan, Turkish) → English, systematically varying corpus size and including held-out test sets with novel compositional structures and challenging disambiguation contexts. Measure accuracy of evidential implicature preservation (via human evaluation).

      3.2  **Intervention: Explicit Epistemic Tagging:**
          *   **Intervention:** Augment the parallel training data with explicit tags marking the epistemic source (e.g., `[VISUAL]`, `[HEARSAY]`) appended to the source sentence.
          *   **FEC Prediction:** Performance (especially on compositional/novel cases) will improve, demonstrating the model's ability to leverage explicit signal to refine its *functional* mapping. However, the core mechanism remains statistical correlation. Significant improvement without tagging in high-resource settings already demonstrates sufficiency.
          *   **CAC Prediction:** Significant improvement, *particularly* on novel compositional cases and disambiguation contexts in *low-to-moderate* resource settings, is predicted. This would provide evidence that the model *can* learn to utilize an explicit representation of the epistemic concept when provided, supporting the claim that such anchoring is necessary for robust comprehension that the standard model lacks. Merely improving correlation is insufficient; the key is robust generalization facilitated by the tag.
          *   **Test:** Train models with and without augmented tagging on datasets spanning resource levels. Compare performance on the test sets described in 3.1. Crucially, analyze *how* the model uses the tag (e.g., via probing or analysis of attention patterns).

      3.3  **Probing for Epistemic Representation:**
          *   **Question:** Can probes (simple classifiers trained on model activations) reliably decode the epistemic category (e.g., visual vs. hearsay) *from intermediate representations* of the model trained on standard data?
          *   **FEC Prediction:** Probes may achieve above-chance accuracy, but this reflects the statistical correlation the model uses for translation, not a distinct "concept representation." Failure of probes does not imply failure of functional understanding.
          *   **CAC Prediction:** If the model genuinely represents the epistemic concept internally *as part of its translation process*, probes should be able to decode this information reliably from relevant layers (e.g., where semantic integration occurs). Consistently poor probe accuracy would be evidence *against* the presence of the required conceptual anchor.
          *   **Test:** Train probes on model activations for sentences with clear evidential markers. Evaluate probe accuracy on held-out data, including novel sentences.

  **4. Identification of Verbal Disagreements:**

  We agree that a significant portion of the dispute over the *word* "understanding" and its cognates ("comprehension," "genuine") is potentially verbal. Both camps agree MT systems exhibit sophisticated functional competence in interlingual meaning transfer. The core disagreement is *not* about the existence of this competence but about its *mechanistic underpinnings* and whether those mechanisms warrant the *ontological claim* that the system "understands" in a sense meaningfully analogous to the functional role of understanding in human communication, or merely simulates it through correlation.

  *   **Reasoning:** FEC defines "understanding" operationally as successful functional performance in the translation task. CAC defines "understanding" as requiring specific kinds of internal representational states (conceptual anchors) causally involved in generating that performance. Thus, stating "MT understands language" is true under FEC's definition but false under CAC's. Recognizing this definitional divergence helps focus the debate on the empirical cruxes concerning mechanisms and generalization capabilities outlined in Section 3, rather than terminological preferences.

  **5. Evidence Against Own View:**

  *   **FEC Commitment:** Evidence that would genuinely persuade FEC that current statistical MT lacks a form of understanding worthy of the name would be: **The consistent failure of systems, trained on massive, high-quality, diverse corpora encompassing the relevant phenomena, to correctly translate sentences involving evidentiality (or analogous structural meaning) *in contexts where the required implicature is clear and unambiguous to human readers*, even after controlling for data sparsity, ambiguity, or domain mismatch.** This would demonstrate a fundamental failure of functional equivalence under optimal learning conditions.
  *   **CAC Commitment:** Evidence that would genuinely persuade CAC that explicit conceptual anchoring is unnecessary for a form of genuine understanding in MT would be: **Demonstrating that a model trained *without* any explicit semantic tagging or symbolic guidance achieves robust, human-level performance on translating novel, complex compositional structures involving evidentiality (or analogous phenomena) in low-resource settings, *and* that probes show the model develops internal representations that systematically and reliably encode the relevant epistemic distinctions *in a manner that causally contributes* (e.g., via ablation studies) to the correct translation output.** This would show statistical learning alone can create the necessary conceptual representations.

