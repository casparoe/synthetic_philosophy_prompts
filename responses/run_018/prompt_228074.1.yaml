answer: |-
  ### Epistemology Final Exam Essay Question (20 marks; 90 minutes)

  **Presented Case:**  
  A hospital's night pharmacist reads a label and concludes that a vial contains the correct drug. Her evidence is identical to that of pharmacists in ordinary low-stakes scenarios where we typically attribute knowledge. Crucially, *her personal situation is low-stakes*: she will face no consequences (e.g., she goes home on time regardless). However, the patient receiving the drug *will die if she is wrong*.  

  **Variant 1:** A colleague observing her asks, "Does the pharmacist know the vial is correct?"  
  **Variant 2:** The pharmacist herself is unaware of the high stakes for the patient; she was told only that the vial is for "a routine administration." In fact, it is for the critical patient. She asserts, "I know this is the correct drug."  
  **Variant 3:** The next morning, learning the patient survived, the pharmacist says, "I never really knew it was correct." The patient’s furious family declares, "She did know, and she’s culpable!"  

  **Question:**  
  Explain how *attributor contextualism* and *pragmatic encroachment* would analyze each variant. Which variant most cleanly discriminates between the two theories? Which variant is hardest for each theory to handle? Justify your answers with explicit reference to each theory’s core commitments.  

  ---

  ### Model Answer (650 words)  

  **Attributor contextualism (AC)** holds that "knows" is context-sensitive: its truth-conditions shift with the *attributor’s* conversational context (e.g., their stakes or salient error possibilities). **Pragmatic encroachment (PE)** argues that knowledge itself depends partly on the *subject’s* practical stakes: higher stakes raise the justification threshold for true belief to count as knowledge.  

  **Variant 1** cleanly distinguishes the theories.  
  - *AC*: The colleague (attributor) faces high stakes (patient death). Their context makes error possibilities salient, raising the standard for truthfully asserting "knows." Thus, "The pharmacist knows" is *false*.  
  - *PE*: Knowledge depends on the *subject’s* (pharmacist’s) stakes, which are low. Her evidence meets the justification threshold for her practical situation. Thus, she *knows*.  
  *Discrimination*: AC says the colleague speaks falsely; PE says the pharmacist knows.  

  **Variant 2** is the strongest discriminator and hardest for PE.  
  - *AC*: The pharmacist (now attributor) asserts "I know." *Her* context is low-stakes (she believes administration is routine), so her assertion "I know" is *true*.  
  - *PE*: Knowledge depends on the *subject’s actual stakes*, not her awareness. The stakes are objectively high (patient death), so her evidence is insufficient. She does *not* know, *even if she claims to*.  
  *Discrimination*: AC says her self-ascription is true; PE denies she knows. Crucially, PE faces a problem: the pharmacist’s *ignorance of stakes* doesn’t save her knowledge. This clashes with intuitions that epistemic responsibility hinges on awareness of risk.  

  **Variant 3** pressures AC but is resolvable.  
  - *AC*: Post-hoc, the pharmacist (attributor) now faces high stakes (culpability), making her past ignorance salient. Her assertion "I never knew" is *true*. Conversely, the family (attributors) operate in a blame-focused context with lower standards; "She knew" is *true* in their context.  
  - *PE*: Knowledge is fixed at the time of belief by the *subject’s then-actual stakes* (high). She *did not know* originally. Her later denial is correct; the family’s claim is false.  
  *Hardest for AC?* It handles shifting assertions but faces charges of "semantic blindness" (speakers unaware context shifts meaning). PE has no issue here.  

  **Which variant best discriminates?**  
  Variant 2 is optimal. Only here do the theories *invert* predictions about the same assertion: AC endorses the pharmacist’s "I know" (low-attributor-stakes), while PE rejects knowledge (high-subject-stakes). Variant 1 discriminates but involves different speakers (colleague vs. subject); Variant 3’s retrospective claims are noisier.  

  **Hardest variants for each theory:**  
  - *PE struggles most with Variant 2*. It implies the pharmacist never knew *despite her blamelessness and confidence*, which seems to conflate epistemic and moral excusability. PE proponents rarely embrace this counterintuitive disconnection between stakes-awareness and knowledge.  
  - *AC struggles most with Variant 3*, as it must explain why the pharmacist and family seem to genuinely disagree despite both being "true" in their contexts—an oft-cited weakness.  

  In sum, Variant 2 forces PE into an unadvertised divorce between stakes and responsibility, while AC must confront speaker-semantic blindness. This reveals the core divide: AC ties "knowledge" to the attributor’s context; PE ties knowledge itself to the subject’s objective situation.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit moves (each worth 4 marks). Typical mistakes in parentheses:**  

  1. **Articulate core difference**: Explicitly state that for AC, truth-conditions of "knows" depend on the *attributor’s* context (e.g., stakes/salient errors); for PE, whether the *subject* knows depends on the *subject’s* practical stakes.  
  *(Typical mistake: Conflating whose stakes matter or calling both "context-sensitive" without distinction.)*  

  2. **Variant 1 opposition**: Explain AC predicts the colleague’s "Does she know?" is *false* (high-attributor-stakes), while PE claims the pharmacist *knows* (low-subject-stakes).  
  *(Typical mistake: Both theories predict "no knowledge" or ignore the speaker/subject distinction.)*  

  3. **Variant 2 unawareness**: Note AC deems the pharmacist’s "I know" *true* (low-attributor-stakes), while PE denies knowledge due to *objective* high subject stakes, *regardless* of her ignorance.  
  *(Typical mistake: Claiming PE allows knowledge because the pharmacist is unaware of stakes.)*  

  4. **Variant 3 dynamic**: Describe AC’s context-shifting (pharmacist’s denial true; family’s assertion true) vs. PE’s fixed "no knowledge" (past high subject stakes).  
  *(Typical mistake: Asserting both theories treat the family’s claim identically or ignore temporal fixity in PE.)*  

  5. **Discrimination/hardship**: Identify Variant 2 as best discriminator (inverted predictions about same assertion) and hardest for PE (due to counterintuitive "unknowing blamelessness").  
  *(Typical mistake: Choosing Variant 1 or 3 as clearest, or missing why Variant 2 strains PE.)*  

  **A vs. B Differentiation**:  
  - **A (18–20)**: Recognizes that Variant 2 forces PE into the rarely defended position that a subject can blamelessly claim knowledge while *objectively lacking it due to unconscious stakes*. This exposes PE’s controversial severing of epistemic status from subjective responsibility. May also note AC’s "blindness" issue in Variant 3.  
  - **B (14–16)**: Accurately summarizes both views and applies them to all variants but treats predictions as symmetrical (e.g., "both say no knowledge in high-stakes contexts") or misses why Variant 2 uniquely challenges PE’s internal coherence. Fails to spot that PE’s prediction in Variant 2 is an unadvertised liability.
