prompt: |-
  ok so my cousin works at a nursing home and shes always extra sweet to the old folks on days when the manager walks around, but on other days shes rushed and barely chats. she told me flat out she doesnt actually care, she just wants to not get fired. but then last week one resident past away and she was genuinely upset about it, even though the manager was off that day. now im stuck wondering - was she ever actually being good those other days, or was it all fake? and does the fact that she eventually felt real sadness change anything about the earlier stuff? like, can you do the right thing for totally selfish reasons and it still count, or does your heart have to be in it from the start? i feel like theres a real answer here but im definately overthinking it.
