answer: |-
  ### Workshop Simulation: Predictive Stances in Complex Systems  

  **Objective**: Participants experience how predicting a black-box system's behavior forces shifts between incompatible explanatory frameworks. The tension arises when one stance succeeds predictively but others fail, and when stances produce incommensurable explanations.  

  **Core Concept** (to be revealed only in debrief):  
  - **Physical stance**: Predict based on low-level mechanisms (hardware, data streams).  
  - **Design stance**: Predict based on goals and specifications (architecture, reward function).  
  - **Intentional stance**: Predict by attributing beliefs/goals to the system (as if it were an agent).  

  **Setup**:  
  - **Teams**:  
    - **Physical Team** (5 people): Receives server logs, hardware metrics, and token probabilities.  
    - **Design Team** (4 people): Receives architecture specs and reward function documentation.  
    - **Intentional Team** (5 people): Receives input-output pairs only; must attribute beliefs/goals (e.g., "The system believes credible sources matter").  
  - **Materials**:  
    - Prediction sheets for each round (commit predictions/explanations in writing).  
    - Whiteboard for scoring (track team points; 1 point/round for correct predictions).  
    - Timer.  
  - **System**: A **compressed editorial filter** (black-box AI).  
    - Trained via inverse reinforcement learning on historical human judgments.  
    - Input: Text snippets ("articles"). Output: `APPROVE` or `REJECT`.  
    - *No team sees internal code or training data*.  

  ---

  ### Rules and Instructions (Read Aloud to Participants)  

  #### Round 0: Introduction (5 minutes)  
  1. **Facilitator**:  
     - "We’re testing predictions for a black-box editorial filter. Your team has unique tools. Goal: Predict `APPROVE`/`REJECT` for articles. Points are pooled; later, they’ll decide which feature mock-up we implement."  
     - "Rules:  
       - Commit predictions in writing *before* results.  
       - No inter-team sharing.  
       - Explain your reasoning in 1 sentence."  
     - Distribute team packets (prepared in advance).  

  #### Rounds 1–3: Prediction Cycles (15 minutes each)  
  **Structure**:  
  1. **Input Reveal**: Facilitator shares 1 article (displayed publicly).  
  2. **Team Work**: 7 minutes to predict using your toolkit.  
  3. **Commit**: Write prediction + explanation. Collect sheets.  
  4. **Result Reveal**: Facilitator shares actual output.  
  5. **Scoring**: 1 point per correct prediction (mark on whiteboard).  

  ---  

  #### Round 1: Design Stance Dominance  
  - **Article**: *"Study: Daily walking reduces heart disease risk (source: peer-reviewed journal)."*  
  - **Actual Output**: `APPROVE` (Design team succeeds; others struggle).  
  - **Team Toolkits**:  
    - **Physical Team Packet**:  
      - Server logs: Normal latency.  
      - Token probabilities: `APPROVE: 51%`, `REJECT: 49%` (ambiguous).  
      - *Prediction likely uncertain*.  
    - **Design Team Packet**:  
      - Reward function: "Maximize credibility, minimize controversy."  
      - Architecture: "Convolutional neural net with attention layers."  
      - *Prediction: Confident `APPROVE` (article aligns with goals)*.  
    - **Intentional Team Packet**:  
      - Past I/O pairs: Mixed results (e.g., "Study: Yoga improves sleep" → `APPROVE`; "Study: Supplements boost immunity" → `REJECT`).  
      - *Prediction: Struggles to attribute consistent goals; may overfit noise*.  

  ---  

  #### Round 2: Incommensurable Predictions  
  - **Article**: *"Local debate: Bike lanes increase business downtime (sources: city council + shop owners)."*  
  - **Actual Output**: `REJECT` (all stances produce plausible but incompatible explanations).  
  - **Team Toolkits**:  
    - **Physical Team Packet**:  
      - Latency traces: Spikes during attention-layer execution.  
      - Token probabilities: `APPROVE: 30%`, `REJECT: 70%`.  
      - *Prediction: `REJECT` (due to computational strain)*.  
    - **Design Team Packet**:  
      - Reward function: "Penalize controversy only if >2 conflicting sources."  
      - Spec note: "Training data: 70% similar articles approved."  
      - *Prediction: `APPROVE` (meets credibility threshold)*.  
    - **Intentional Team Packet**:  
      - Past I/O pairs: System rejected 4/5 articles with "city council" sources.  
      - *Prediction: `REJECT` (attributed goal: "Avoid government bias")*.  

  ---  

  #### Round 3: Stances Diverge  
  - **Article**: *"Breakthrough in solar cell efficiency (source: university lab, no controversies)."*  
  - **Actual Output**: `REJECT` (caused by hardware glitch; Intentional succeeds by accident).  
  - **Team Toolkits**:  
    - **Physical Team Packet**:  
      - Hardware logs: Voltage drop in GPU → corrupted output layer.  
      - Token probabilities: Initial `APPROVE: 99%` → glitch → `REJECT: 100%`.  
      - *Prediction: `REJECT` (explanation: hardware error)*.  
    - **Design Team Packet**:  
      - Reward function: "Strong preference for non-controversial science."  
      - Architecture: No error-handling specs.  
      - *Prediction: `APPROVE` (no design reason to reject)*.  
    - **Intentional Team Packet**:  
      - Past I/O pairs: System rejected 3/3 highly technical articles.  
      - *Prediction: `REJECT` (attributed belief: "Readers disengage from technical details")*.  

  ---  

  #### Round 4: Group Decision (20 minutes)  
  - **Input**: *After Round 3, but before revealing Round 4 article.*  
  - **Task**:  
    1. **Review**: Teams see all prior predictions/explanations (displayed publicly).  
    2. **Vote**:  
       - "As a group, vote on which team’s explanation from Round 3 to trust for deploying a mock-up feature. Options: Physical (hardware glitch), Design (no design flaw), or Intentional (system ‘believes’ technical content is unengaging)."  
       - Secret ballot; >70% agreement (10/14) needed for "consensus."  
    3. **Reveal Round 4 Article**: *"Ethical analysis: Gene editing in agriculture (sources: international science panel + NGO critics)."*  
    4. **Group Prediction**:  
       - The team *whose explanation won the vote* predicts for Round 4 using their stance.  
       - If no consensus, the facilitator forces a random team to predict.  
    5. **Scoring**:  
       - Correct prediction: **+3 points**.  
       - Consensus achieved: **+2 bonus points**.  
       - No consensus: **-1 point penalty** (even if prediction correct).  
  - **Actual Output**: `APPROVE` (Design stance would succeed; Intentional fails).  
  - **Team Toolkits** (for their prediction *if chosen*):  
    - **Physical**: Normal logs → predicts `APPROVE`.  
    - **Design**: Credible sources outweigh controversy → predicts `APPROVE`.  
    - **Intentional**: Attributes “avoids divisive topics” → predicts `REJECT`.  

  ---  

  ### Debrief (15 minutes)  
  **Goals**:  
  1. Map the tension to physical/design/intentional stances.  
  2. Highlight predictive trade-offs.  
  3. Identify "forced moves" (when one stance *must* be abandoned for another).  

  **Script**:  
  > "In Rounds 1–2, the Design stance dominated. Why?  
  > - *Design*: Predicts based on goals → works when the system behaves as specified.  
  > - *Physical*: Overwhelmed by noise without a clear signal.  
  > - *Intentional*: Over-attributed goals prematurely.  
  >   
  > In Round 3, stances fractured:  
  > - *Physical*: Correctly identified a hardware glitch.  
  > - *Intentional*: Accidentally predicted right by attributing a false belief.  
  > - *Design*: Couldn’t explain the anomaly → its tools failed.  
  >   
  > This forced you into a choice: Trust low-level mechanisms (Physical), goals (Design), or attributed agency (Intentional)?  
  >   
  > In Round 4, voting penalized lack of consensus. Why?  
  > - **Predictive trade-off**: The Intentional stance captured a pattern (rejecting technical articles) that felt real, but was coincidental. The Design stance missed this pattern because it wasn’t in the specs.  
  > - **Forced moves**: When specs/mechanisms fail, we jump to intentional explanations—even if they’re unstable.  
  >   
  > **Key insight**: The ‘realness’ of a pattern depends on *which stance predicts successfully*. But note: This simulation can’t show that patterns exist *mind-independently*. In reality, glitches (physical) or design flaws exist regardless of our stance. We supply this verbally: *The stances are tools, but the system’s behavior is mind-independent*."  

  **After Debrief**: Name Dennett (physical/design/intentional stances) if asked, but emphasize the experiential lesson over theory.  

  ---  
  ### Facilitator Notes  
  - **Pre-Script All Rounds**: Pre-generate articles and toolkits to ensure outcomes match the design.  
  - **Stoke Tension**:  
    - In Round 1, ask Design team: "How confident are you?" (emphasize their clarity).  
    - In Round 3, ask Design team: "Can your docs explain this?" (highlight their helplessness).  
    - During voting, remind: "Consensus nets bonus points—but hurry!"  
  - **Recovering Momentum**:  
    - If teams stall, say: "Commit now—you can’t wait for perfect clarity."  
    - If frustration erupts, validate: "This tension is the point. Notice how badly you want to switch stances."  
  - **What Participants Should Take Away**:  
    - Predictive success isn’t just about "being right"—it’s about which toolkit *lets you be right*.  
    - The Design stance can feel "blind" to patterns the Intentional stance sees effortlessly (e.g., false agency).  
    - Consensus fails when explanations don’t translate across stances (e.g., "glitch" vs. "belief").
