answer: |-
  Your query cuts to the heart of institutionalizing intergenerational ethics. Embedding pure time preference (PTP) within the Centuries Trust's charter fundamentally transforms abstract debate into concrete governance. Here’s a rigorous analysis addressing your core concerns:

  ### 1. **Moral Equivalence & Institutional Legitimacy**
     - **Private vs. Institutional PTP**: When individuals discount their *own* future welfare, they exercise autonomy over personal trade-offs. But the Trust imposes PTP *collectively* on distinct future persons who had no consent in its creation. This shifts PTP from a self-regarding preference to an other-regarding policy, violating the principle that temporal location is morally arbitrary. Institutionalizing PTP makes it a structural bias against the unborn.
     - **Democratic Paradox**: If living generations establish PTP-based rules binding their descendants, it echoes a "tyranny of the present." Future generations cannot amend the charter to reject this discounting, undermining reciprocal democratic legitimacy across time.

  ### 2. **Addressing the "Morally Arbitrary" Objection**
     - **Relocation, Not Resolution**: Institutional PTP doesn’t answer the arbitrariness critique; it codifies it. By formally weighting present burdens heavier than future benefits *solely due to timing*, the charter treats birthdate as a legitimate basis for discrimination. This conflicts with core justice principles (e.g., Rawlsian impartiality or Kantian personhood).
     - **Counterargument from Epistemic Humility**: Proponents might argue PTP acknowledges present uncertainty about future values or survival. However, the Trust’s 250-year mandate assumes sufficient certainty to bind the future—undermining this defense. PTP becomes an arbitrary discount atop an already speculative endeavor.

  ### 3. **Governance Mechanisms for Explicit Discounting**
     To avoid concealing PTP in financial assumptions, the charter must make it operationally transparent:
     - **Direct Valuation Formula**: Codify a PTP rate (e.g., δ) directly into benefit calculations:  
       *"The Trust shall value benefits deliverable in year T as equivalent to (1-δ)^T × [nominal value] for stewardship decisions, where δ is the pure time preference rate fixed at 0.1% annually."*  
       This isolates PTP from productivity or risk adjustments.
     - **Burden-Benefit Ratios**: Require that contributions vs. future payouts be evaluated using the explicit δ. Annual reports could show:  
       *"Present contributions of $X are equivalent to $Y in year 250 after PTP adjustment."*
     - **Generational Impact Statements**: Mandate assessments comparing resource allocations for near-term stewardship (e.g., 50 years) vs. the 250-year horizon under the declared PTP, forcing trustees to confront trade-offs.
     - **Sunset Clause with Review**: Include a provision requiring reevaluation of δ every 50 years by a neutral arbiter (e.g., a panel of ethicists and long-term scientists), acknowledging that PTP’s validity may change over time.

  ### 4. **Practical Dilemmas in Institutional Design**
     - **Motivation Erosion**: If PTP significantly reduces the perceived value of distant payouts, present generations may underfund or undermine the Trust. High δ could transform it into a token gesture.
     - **Perverse Incentives**: Trustees might overemphasize near-term "stewardship" projects to make costs feel more justified, neglecting the charter’s ultra-long-term purpose.
     - **Rate-Setting Paralysis**: How is δ chosen? A 0.1% vs. 1% rate radically alters outcomes. Market-based rates smuggles in productivity; democratic consensus risks ignoring future interests. A fixed de minimis δ (e.g., 0.05%) might be a compromise—symbolically admitting temporal bias while minimizing harm.
     - **Moral Hazard**: Explicit PTP could legitimize political pressure to raise δ during crises, converting the Trust into a piggy bank for present needs.

  ### 5. **A Path Forward: Mitigation Without Surrender**
     If PTP *must* be included:
     - **Cap the Discount**: Limit δ to an ethically "tolerable" level (e.g., ≤0.1%), preventing drastic devaluation.
     - **Asymmetric Design**: Apply PTP only to discretionary payouts, not core capital preservation. The charter could state: *"While the Trust recognizes a pure time preference rate δ for benefit calculations, the real value of the endowment corpus shall be maintained in perpetuity."*
     - **Counterweight Mechanisms**: Pair PTP with a "Future Generations Advocate" role with veto power over decisions that disproportionately harm the 250-year beneficiaries under the discounting formula.

  ### Conclusion
  Institutionalizing PTP in the Centuries Trust answers the arbitrariness objection by enshrining it—effectively declaring that temporal location *is* morally relevant for distributive justice. This risks transforming the Trust from an instrument of justice into an engine of intergenerational inequity. Transparency in governance can expose the discounting but not redeem its ethics. If PTP is adopted, the mechanisms above force society to confront the weight it places on mere chronology when the lives of the unborn are at stake. The ultimate implication may be that while individuals can rationally hold PTP, institutions tasked with *justice across time* cannot coherently apply it without betraying their purpose.
