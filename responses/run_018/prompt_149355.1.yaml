  The decision tree should start with a fundamental question about the nature of historical periods: are they discovered discontinuities or organizational tools? This first split creates two main branches. Then I can branch further based on whether constructed labels can still be useful, whether medieval-to-renaissance framing is problematic, and whether the "invention" critique demands physical layout changes.

