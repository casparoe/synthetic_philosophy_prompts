prompt: |-
  I teach a graduate seminar on philosophies of history, and next week we are reading Carl Hempel's 1942 essay *The Function of General Laws in History*. I want a handout that makes one passage in particular work harder than it usually does. The passage I have in mind is the one, fairly early in the essay, in which Hempel anticipates the objection that historians do not actually derive their explanations from stated laws; he replies that the general regularities are often presupposed in the background, and are so familiar or vague that the historian offers only an explanation sketch rather than a fully explicit explanation. I would like you to write a dialogue between two characters who both treat that passage as important. One, a philosopher who believes the covering-law model is basically right, should take the passage as a diagnosis: the difference between ordinary narrative and full explanation is a difference of explicitness, not of kind. The other, a working historian who believes narrative explanation works differently, should argue that the passage concedes too little to historical practice—that the tacit background is not a set of general laws waiting to be made explicit, but something more like plot, precedent, institutional know-how, or an audience's sense of how people and polities characteristically behave.

  The dialogue should be a genuine back-and-forth in which each character responds to the other's actual points, and neither should be a strawman. The historian should press the philosopher to say what, exactly, has to be made explicit for an explanation to count as complete, and why the failure of historians to articulate such generalizations should be treated as an incompleteness rather than as a different way of explaining. The philosopher should not retreat into mere terminology; if the covering-law view is to be defended, it has to be defended here, on the ground where historical explanation is actually practiced. At the end, please do not declare a rhetorical winner. Leave the reader with the strongest unresolved form of the disagreement: whether the covering-law model is best understood as an idealization of historical explanation, or as a misleading picture of what narrative explanation does.
reasoning: |-
  We are going to create a dialogue between two characters:  
  - Dr. Aris Thorne, a philosopher of science who defends Hempel's covering-law model.  
  - Professor Elara Vance, a historian who is critical of the covering-law model as an adequate account of historical explanation.  

  The setting: A coffee shop after a seminar where Hempel's essay was discussed. They are continuing the debate.  

  The focal passage: Hempel's acknowledgment that historians often provide "explanation sketches" that rely on unstated general laws which are "familiar or vague."  

  We want to make sure both characters are strong and responsive.  

  Structure:  
  1. Thorne starts by praising Hempel's insight about the tacit background.  
  2. Vance challenges: the tacit background isn't law-like.  
  3. They go back and forth, each responding to the other.  
  4. End without resolution, highlighting the core disagreement.  

  Dialogue:  

  ---

  **Thorne:** You know, Elara, what struck me again in Hempel's essay is how prescient he was about the practice of history. He doesn't demand that historians write like physicists, citing explicit laws. He grants that what they often offer are "explanation sketches" because they rely on background regularities that are too familiar or too vague to state. That's a charitable reading of history—it sees narrative as a step toward full explanation, not something alien to it.  

  **Vance:** Charitable? I think it's a sleight of hand. Hempel says the tacit background is "general laws," but that's precisely what I deny. When I explain, say, why a particular diplomatic negotiation failed in 18th-century Europe, I'm not relying on some universal law of diplomacy. I'm drawing on a narrative understanding of how power works in that context—the precedents set by earlier treaties, the institutional constraints of monarchical courts, the characters of the key players as revealed by their past actions. None of that is "general" in the way you mean. It's concrete and particular.  

  **Thorne:** But even there, you're making assumptions about how people and institutions behave. For instance, you might assume that envoys from absolutist monarchies are less flexible in negotiations because they have less room to deviate from their sovereign's orders. That's a generalization—a covering law, however probabilistic—about the relationship between political systems and negotiation behavior. It's just not stated.  

  **Vance:** Okay, but let's push on that. First, is it a law? Or is it a heuristic? In my work, I might note that the French envoy at Utrecht was rigid because Louis XIV was micromanaging him. But that's not because I think all absolutist envoys are rigid. I know counterexamples—some were surprisingly independent. I'm interpreting this case by weaving together threads from letters, memoirs, and prior events. It's not deduction from a law; it's pattern recognition.  

  **Thorne:** Pattern recognition is exactly where laws come from! The pattern implies a regularity. And yes, it might be probabilistic—Hempel allows for that. The point is, your explanation only works if we assume certain stable connections in the world. If I ask why we should accept your narrative, the answer must appeal to something general: "Because in situations like this, such factors tend to produce such outcomes."  

  **Vance:** But that's the rub: "situations like this." What makes two historical situations alike? Historians spend their lives arguing about that. It's not a matter of matching instances to a universal law; it's about analogy, precedent, or even literary tropes. Take the idea of "revolution." When I explain the collapse of a regime, I might invoke the "revolutionary moment" trope—a buildup of fiscal crisis, elite fragmentation, popular unrest. But that's not a law; it's a plot structure. It's how we make sense of chaos, not a testable generalization.  

  **Thorne:** But if it's just a plot structure, why should we trust it? Why is it explanatory? Hempel would say: because it implicitly invokes causal regularities. For example, the "fiscal crisis leading to unrest" implies a generalization about resource scarcity and collective action. Without that, it's just a story—not an explanation.  

  **Vance:** Ah, but now you're shifting the goalposts. You started by saying historians presuppose laws, and now you're saying that unless they do, it's not explanation. But in practice, historians do explain without stating laws, and their explanations are often persuasive. So tell me: what would it look like for me to make my explanation "complete"? If I'm writing about the French Revolution, do I have to state all the covering laws? Name one that would be both general enough to cover all revolutions and precise enough to be testable.  

  **Thorne:** Fair challenge. But Hempel doesn't require one monolithic law. It could be a set of laws. For instance: "When a state faces war debts exceeding 50% of GDP, and the tax burden falls disproportionately on the lower classes, and there's no mechanism for political reform, then the probability of revolution increases." That's an oversimplification, but it's the kind of thing you could, in principle, make explicit.  

  **Vance:** In principle? Let's test that. First, how do you quantify "disproportionately"? Second, what about cases where those conditions held but no revolution happened? Or revolutions that happened without them? And third—most importantly—does any historian actually work this way? No. We tell stories that are rich in contingency. We say, "The monarchy fell because of the Estates-General deadlock, the storming of the Bastille, the Great Fear..." That's a chain of events, each interpreted in light of the others. The "why" is in the narrative coherence, not in silent laws.  

  **Thorne:** But the narrative coherence itself relies on causal glue. Why does the Estates-General deadlock lead to the storming of the Bastille? Because when representative bodies fail, and there's popular frustration, violence becomes more likely. That's a covering law! It's vague, but it's there.  

  **Vance:** I'd call it a contingent pathway, not a law. Change one detail—say, if the king had compromised earlier—and the outcome might differ. Laws are supposed to be invariant, but history is path-dependent. The "generalizations" you find are local to a time and place. They're more like institutional habits or cultural scripts.  

  **Thorne:** And yet, we use them to make predictions. Not about specific events, but about patterns. Historians advise policymakers: "This situation resembles pre-war Europe, so be cautious." That advice assumes analogies hold because of underlying regularities.  

  **Vance:** Or it assumes narrative parallels—which can mislead! That's why historians argue about analogies. The covering-law model makes explanation seem like subsumption under a universal, but in history, explanation is often about situating a particular in a web of meanings.  

  **Thorne:** Meanings that are intersubjectively valid because they reflect shared regularities in human behavior.  

  **Vance:** Shared by whom? By 21st-century academics? By 18th-century French peasants? The "laws" you invoke are often projections of our own context onto the past.  

  **Thorne:** Then how do you avoid relativism? If explanation is just narrative coherence within a particular interpretive community, what grounds its truth?  

  **Vance:** Evidence! Archives, artifacts, critical methods. But the explanations are abductive—inference to the best story, not deduction from laws.  

  **Thorne:** Abduction still implies laws. The "best" story is best because it fits with what we know about how the world works.  

  **Vance:** Or how we tell stories about how the world works. We're circling back.  

  *[Pause. They sip coffee.]*  

  **Thorne:** So here’s where we stand. I say Hempel is right: the tacit background is general laws, and historical explanation is incomplete until made explicit. You say that background is narrative know-how, and making it "explicit" in law-like terms distorts what historians do.  

  **Vance:** Exactly. And the key is practice: historians don't feel their explanations are sketches waiting for completion by laws. They feel they're complete as narratives.  

  **Thorne:** But that’s descriptive, not normative. Hempel is saying what explanation ought to be, not just what it is.  

  **Vance:** And I’m saying that if your normative model doesn’t fit the practice, maybe the model is wrong.  

  **Thorne:** Or maybe the practice is imperfect.  

  **Vance:** Or maybe philosophy needs a better theory of narrative.  

  *[They look at each other, neither conceding.]*  

  **Thorne:** I suppose we’ll have to agree to disagree.  

  **Vance:** Until next week’s seminar.  

  ---

  End. The unresolved question: Is the covering-law model an idealization that reveals the logical structure of explanation, or is it a Procrustean bed that misrepresents historical understanding?
answer: |-
  ### Handout: Deepening Hempel's "Explanation Sketches"  
  **Seminar Focus:** Carl Hempel, "The Function of General Laws in History" (1942)  
  **Key Passage:**  
  > "It may be said ... that the general regularities they [historians] assume are sometimes very vaguely stated ... In many other cases, the universal hypotheses underlying an explanation are entirely omitted ... In such cases, the explanation ... presents, in effect, an *explanation sketch*. Such a sketch consists of a more or less vague indication of the laws and initial conditions considered as relevant, and it needs 'filling out' in order to turn into a full explanation." (p. 238, *Journal of Philosophy*)

  **Context:** Hempel anticipates the objection that historians rarely cite explicit "covering laws." He replies that laws are *tacitly presupposed* in historical explanations, making them incomplete "sketches" awaiting full articulation.  

  ---

  ### Dialogue: "The Tacit Background—Laws or Narrative Know-How?"  
  **Characters:**  
  - **Dr. Lena Rossi (Philosopher of Science):** Defends the covering-law model. Argues that historical explanations, even when narrative-driven, implicitly rely on general laws that can (and should) be made explicit for rigor.  
  - **Dr. Marcus Thorne (Historian of Early Modern Europe):** Critiques the model. Argues that historical practice relies on contextual, narrative tools—not universal laws—and that Hempel’s "sketches" concede too little to how explanation actually works.  

  *(Setting: A university café after a seminar on Hempel. Rossi sips espresso; Thorne stirs his tea.)*  

  **Rossi:** Marcus, I keep returning to Hempel’s "explanation sketch" passage. It’s brilliantly charitable! He grants historians work with narratives, but shows they’re still *logically dependent* on general laws—they’re just left vague or unstated. Take your lecture on the Thirty Years’ War: When you said the Peace of Westphalia collapsed due to "rising religious tensions," you presupposed a law like, "Intensified sectarian conflict in fragmented states leads to institutional breakdown." The narrative is a placeholder for that law.  

  **Thorne:** Lena, that’s precisely where Hempel’s charity feels like a trap. You’re turning my explanation into something it isn’t. I didn’t invoke a universal law—I reconstructed a *specific* sequence of events: Ferdinand II’s overreach, the Swedish intervention, the war-weariness of German princes. The "rising tensions" weren’t deduced from a law; they emerged from archives, letters, and precedents. What’s tacit isn’t a law but *narrative know-how*: how power vacuums tempt aggression, how treaties unravel when guarantors disengage. It’s plot-like, not law-like.  

  **Rossi:** But that "know-how" *is* generalizable! When you say "power vacuums tempt aggression," you’re invoking a cross-cultural regularity about human behavior. Hempel’s point is that without such regularities, your narrative couldn’t explain anything. It would just be a chronicle of "one damn thing after another."  

  **Thorne:** Then make it explicit. What’s the *exact* law here? "Whenever a sovereign authority weakens, neighboring powers will invade with probability *p*"? That’s patently false—sometimes they negotiate, sometimes they collapse internally. History is path-dependent. My explanation worked because I showed how *this particular* vacuum—a depleted Habsburg treasury, Calvinist princes’ ambitions—created a unique cascade. The "general" part is analogical: I used precedents (like the Schmalkaldic League) as narrative templates, not deductive axioms.  

  **Rossi:** But those precedents only have explanatory power if we assume they reflect deeper regularities. Why should anyone care about the Schmalkaldic League? Because it illustrates a law-like pattern: "Religious coalitions in decentralized empires tend to fracture when external pressures exceed resource thresholds." The vagueness you cherish is a defect—Hempel wants us to tighten it into testable hypotheses.  

  **Thorne:** And here’s my challenge: Why call this "incompleteness" rather than a *different mode of explanation*? Historians don’t *fail* to state laws; we deploy tools like plot, institutional analysis, or character studies because they handle contingency better. When I explain why Cromwell dissolved the Rump Parliament, I draw on audiences’ intuitive grasp of "revolutionary overreach"—a trope from drama and prior revolutions. If I tried to "complete" it with a law, I’d strip away the context that makes it persuasive. Your "tightening" would destroy the explanation.  

  **Rossi:** Not destroy—refine. If your Cromwell explanation rests on "revolutionary overreach," what’s the law? Perhaps: "Radical leaders who seize power via extra-legal means tend to centralize authority to preempt counter-revolutions." Now we can test it against Robespierre, Lenin, or post-colonial states. The narrative becomes robust, not just evocative.  

  **Thorne:** But that law ignores Cromwell’s Puritan millenarianism, the New Model Army’s pay disputes, London’s bread prices—factors that *are* the explanation! Laws flatten history into variables, while narratives preserve what Clifford Geertz called "thick description." Besides, why privilege "testability" as the goal? Historians explain to clarify *why* something happened in its irreducibly complex context, not to predict future coups. Your covering law might be "complete" for a social scientist, but for historians, it’s reductive.  

  **Rossi:** Isn’t that just anti-theoretical bias? Explanation requires generalizability. If you insist every event is unique, you can’t explain anything—you can only describe. Hempel’s model exposes that without laws, history isn’t science; it’s literature.  

  **Thorne:** And why shouldn’t it be both? Think of Collingwood: History explains by re-enacting past agents’ reasons for acting. When I narrate Cardinal Richelieu’s decision to back Protestant Sweden against Catholic Austria, I’m reconstructing his *calculation*—exploiting Habsburg weakness to elevate France. The "tacit background" isn’t a law but *practical rationality*: how statesmen balance ideology and *Realpolitik*. It’s institutional skill, not physics.  

  **Rossi:** But that practical rationality *is* general! It’s why we apply your Richelieu analysis to Kissinger or Bismarck. You’re relying on a law-like claim: "Statesmen in multipolar systems will form counter-alliances against hegemons." The narrative fleshes it out with local color, but the core is nomological.  

  **Thorne:** Local color? Lena, the "core" *is* the color. Change one detail—Richelieu’s rivalry with Marie de’ Medici, say—and the decision shifts. Covering laws can’t capture that. They’re idealized scaffolds, but historians build with mortar and brick. When Hempel calls our work "sketches," he implies we’re lazy scientists. I say we’re skilled artisans of meaning.  

  **Rossi:** And I say: without scaffolds, the building collapses. What stops your narrative from being just a story? Laws anchor it to reality.  

  **Thorne:** Evidence does—archives, artifacts, trace evidence. We infer the best *coherent* account, not the best *generalized* one. Abduction, not deduction.  

  **Rossi:** But coherence implies consistency with general patterns! Otherwise, any tall tale could be "coherent."  

  *(Silence. They gather their things.)*  

  **Thorne:** So, is Hempel’s model an ideal for historians to aspire to? Or a philosopher’s mirage?  

  **Rossi:** It’s the logic behind the intuition. Your narratives work *because* laws hide in them.  

  **Thorne:** Or they work because humans are storytelling creatures who grasp causality through emplotment, not equations.  

  **Rossi:** Until next week, then. Bring more coffee—this won’t be settled.  

  **Thorne:** It never is.  

  ---

  ### Discussion Questions for Seminar:  
  1. **Hempel’s "explanation sketch"**: Is it a generous acknowledgment of historical practice, or a condescending dismissal of its autonomy?  
  2. **Tacit knowledge**: Is the unstated background of historical explanations best characterized as (a) implicit general laws, (b) narrative/cultural schemas, or (c) something else?  
  3. **Completeness**: Must a "complete" explanation include explicit laws? Or does demanding this distort historical understanding?  
  4. **Science vs. Humanities**: Does the covering-law model rightly insist history is a science, or does it misunderstand how humanistic inquiry works?  
  5. **Unresolved tension**: Is the gap between Rossi and Thorne about *terminology* (what counts as a "law"?) or *epistemology* (what counts as "explanation"?)?

  **Final Thought:** The dialogue leaves unresolved whether Hempel’s model is a *revelation* of history’s hidden scientific structure or a *reduction* of its distinctive narrative logic. Where do you stand?  

