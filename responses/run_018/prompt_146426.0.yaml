  Okay, let me unpack this user's query. They're coordinating an interdisciplinary project on evolutionary dynamics in fragmented ecosystems and hit a practical disagreement rooted in the units of selection debate. They want a diagnosis of whether this debate is substantive or merely verbal. 

  First, I need to map their framing: they see three main positions (gene, organism, group) sharing mathematical tools like Price equation but disagreeing on interpretation. Their hypothesis is that the conflict isn't empirical but about what constitutes causal explanation versus statistical partitioning. They also mention a "quieter strand" (causal specificity + niche construction) that might dissolve the conflict.

  Hmm, the user's clearly deeply versed in this - they reference Price equation, causal specificity, screening off, etc. This isn't a surface-level question. Their frustration with the "talking past" problem suggests they need clarity for practical project coordination, not just theoretical curiosity. The mention of "intervention-relevant accounts" hints they need this for experimental design or conservation strategies in fragmented ecosystems.

  Let me break this down:
  1) **Shared math vs. divergent metaphysics**: All sides use the same equations but load them with different ontological commitments. Genes-first folks see replicators as causal primacy; organism folks see integrated phenotypes as the real actors; multilevel folks point to emergent fitness. The math describes outcomes neutrally but doesn't resolve what "really" evolves.

  2) **Causal specificity angle**: Here's where it gets interesting. The user's nod to "causal democracy vs. privilege" suggests they suspect no level is inherently privileged. Things like developmental niche construction (e.g., beaver dams altering selection pressures) show causality flows bidirectionally across scales. A gene "for" dam-building only matters if the beaver interacts with trees and water in specific ways.

  3) **The practical pivot**: For their fragmented ecosystem work, the key might be recognizing that the "unit" question is context-dependent. In a metapopulation with high dispersal, group traits might screen off individual variation; in inbred subgroups, gene-level effects dominate. The debate isn't ill-posed - it demands specifying: "selection on what, for what purpose, under which conditions?"

  What would actually help their project? Probably:
  - Framing the disagreement as a toolkit: gene/individual/group perspectives are different lenses exposing different aspects of evolutionary dynamics
  - Emphasizing that causal specificity isn't fixed - it shifts with spatial/temporal scale (e.g., short-term=individual traits matter; long-term=niche construction reshapes the game)
  - Suggesting they structure experiments to test when certain levels get screened off (e.g., manipulate patch connectivity to trigger group selection signatures)

  The user's hinted solution - decoupling ontology from modeling strategy - is sharp. We could say: the math describes *what* evolves; the "unit" discussion is about *how* it evolves mechanistically, which requires specifying the ecological theater. Their fragmented systems are perfect test cases for this.
answer: |-
  Your diagnosis is astute: the units-of-selection debate is **primarily a substantive disagreement masked by shared mathematics**, further complicated by the conflation of ontological and epistemic questions. Below, I break this down using your analytical framework, referencing core assertions about replication, environmental interaction, and screening off, and propose a path forward.

  ---

  ### **1. Core Positions & Their Assertions**
  #### **Gene-Level Selection (Replicator View)**
  - **Replication**: Genes (or replicators) are the sole units that *faithfully* replicate. Organisms/groups are temporary vehicles.
  - **Environmental Interaction**: Phenotypic effects of genes interact with environments, but fitness differences are reducible to gene frequency changes. "Extended phenotypes" (e.g., beaver dams) are still gene effects.
  - **Screening Off**: Organism/group traits are "screened off" by gene-level fitness differences (e.g., if gene *A* always outcompetes *a*, group success is irrelevant).
  - **Ontology**: Genes are the *only* causal agents with heritable variation. Higher-level "selection" is statistical aggregation.

  #### **Organism-Level Selection (Vehicle/Interactor View)**
  - **Replication**: Only organisms (or cells) are coherent units that replicate *as integrated wholes*. Genes lack agency without organismal context.
  - **Environmental Interaction**: Selection acts on phenotypes of organisms. Gene effects are contingent on developmental integration (e.g., epistasis, pleiotropy).
  - **Screening Off**: Gene-level variation is screened off when organismal fitness dominates (e.g., a deleterious gene in a fit organism may persist).
  - **Ontology**: Organisms are the primary units of adaptation due to functional cohesion. Genes are bookkeeping tools.

  #### **Multilevel/Group Selection**
  - **Replication**: Groups (or collectives) can replicate via fission/extinction. Heritable group traits (e.g., cooperation) drive differential survival.
  - **Environmental Interaction**: Group traits (e.g., social structure) alter selection pressures on individuals ("emergence").
  - **Screening Off**: Individual fitness is screened off when between-group variance exceeds within-group variance (Price equation partitioning).
  - **Ontology**: Groups are real biological individuals (e.g., eusocial colonies) with causal efficacy not reducible to genes/organisms.

  #### **Causal Specificity/Niche Construction Critique**
  - **Key Assertion**: Heritability ≠ causal control. All levels participate in "causal democracy":
    - **Developmental Niche Construction**: Organisms/groups modify environments, altering selection pressures (e.g., soil pH changes by plants).
    - **Specificity Shift**: Causal control is context-dependent. A gene may control eye color, but nest-building (a group trait) controls thermoregulation.
    - **Screening Off Failures**: Lower-level variation is rarely fully screened off; feedback loops (e.g., cultural transmission) blur hierarchies.

  ---

  ### **2. Diagnosis: Why the Impasse?**
  - **Shared Math, Divergent Metaphysics**: All sides use the Price equation, but interpret its partitions as:
    - *Replicators*: Cov(*w,g*) reflects gene control.
    - *Vehicles*: Cov(*w,g*) is an organism-level summary.
    - *Multilevel*: The equation *demands* group selection when group terms dominate.  
    → **Conflict arises from ontological commitments** (what "does" the selecting), not math.

  - **Conflated Questions**:
    - **Ontological**: "What entities *are* targets of selection?" (e.g., genes as immortal replicators).
    - **Epistemic**: "Which level offers the most predictive model?" (e.g., group traits for ecosystem resilience).
    → Gene-centrists often argue ontology; multilevelists argue epistemology.

  - **Verbal Dispute? Partly**: "Selection" is used ambiguously:
    - *Selection-as-outcome* (any frequency change) vs. *selection-as-process* (specific causal pathways).
    → But the disagreement runs deeper: **proponents disagree on what constitutes a *causal mechanism*** (e.g., is group extinction "selection" or demographic drift?).

  ---

  ### **3. A Path Forward: Causal Specificity & Scale-Relativity**
  The impasse can be broken by reframing the question: **"Under what conditions does causal control shift between levels?"** Key enablers:

  #### **a) Formalize Causal Specificity**  
    - Adopt Woodward-style interventionist causality: *If manipulating X (e.g., a group trait) while holding Y fixed (e.g., genes) changes fitness, X has causal privilege.*  
    - **Empirical Test**: In fragmented ecosystems, manipulate habitat connectivity (group-level) vs. gene flow (gene-level). Which intervention better predicts adaptation?

  #### **b) Identify Scale-Dependent Screening Off**  
    - **When genes screen off groups**: Low between-group variance (e.g., panmictic populations).  
    - **When groups screen off genes**: High group heritability + migration limitation (e.g., isolated patches with cultural transmission).  
    - **Niche Construction Breaks Screening**: Beaver dams alter selection on future generations, binding gene-organism-group causality.

  #### **c) Leverage Fragmented Ecosystems**  
    Your project is ideal for testing specificity shifts:  
    - **Short-Term**: Individual/gene traits may dominate (e.g., dispersal genes).  
    - **Long-Term**: Group traits (e.g., cooperative foraging) emerge as patches age.  
    - **Intervention**: Correlate patch extinction (group) with genetic diversity (gene) and phenotypic plasticity (organism). Which best predicts resilience?

  ---

  ### **Conclusion: A Dissolved Debate**
  The units-of-selection debate is **not ill-posed** but requires disambiguation:  
  - **Ontologically**: Selection acts on *all* levels in a causal hierarchy, privileging none *a priori*.  
  - **Epistemically**: The "best" unit depends on timescale, system structure, and research goals (e.g., genes for CRISPR edits; groups for habitat corridors).  

  **Move Forward With**:  
  1. **Causal Specificity Metrics** (e.g., controlling for correlations across levels).  
  2. **Scale-Explicit Models** (e.g., when does group heritability emerge in fragmentation gradients?).  
  3. **Niche Construction Integration** (e.g., how ecosystem engineering redistributes causal control).  

  The stalemate persists because each camp universalizes its preferred level. By treating levels as *context-dependent causal nexuses*—testable via targeted interventions—your project can transform this philosophical fault line into a framework for prediction.
