answer: |-
  Here is a systematic reconstruction of the "moral saint undesirability" claim, followed by a committed defense of its strongest interpretation. I'll rigorously dissect the theses as requested, then argue for a pluralist axiological reading as core to establishing *undesirability* rather than mere difficulty or non-obligation.

  ---

  ### **Precise Theses & Their Evaluation**

  1.  **Psychological Impossibility/Instability (a):**  
      *   **Thesis:** Sustained maximal moral virtue—constantly acting on the most demanding other-regarding reasons—is psychologically unsustainable for humans due to cognitive limits, emotional exhaustion (compassion fatigue), or motivational depletion (willpower as finite resource).  
      *   **Evaluation:** Empirically plausible (supported by psychology on burnout, decision fatigue, and altruism studies), but **not trivial**. Shows *infeasibility*, not undesirability per se.  
      *   **Work in Argument:** Weakens "ought implies can" defenses of extreme demands. Suggests that pursuing sainthood leads to breakdown, making it counterproductive. Doesn't show that a *hypothetically achievable* saintly life would be undesirable.

  2.  **Axiological Competition (b):**  
      *   **Thesis:** Moral value (e.g., beneficence, justice) systematically competes with non-moral values (aesthetic appreciation, personal projects, deep relationships, intellectual curiosity, humor). A life maximizing moral goodness *necessarily* crowds out these non-moral goods, resulting in a "lopsided" or "impoverished" life overall. Non-moral goods are essential components of a flourishing human life and often outweigh marginal moral gains in all-things-considered value.  
      *   **Evaluation:** Conceptually defensible (if value pluralism is true) and empirically resonant (reflecting common intuitions about well-rounded lives). **Non-trivial and contestable** (hinges on rejecting moral monism/value supremacy).  
      *   **Work in Argument:** Directly attacks the *attractiveness* of the ideal by arguing it yields a *less good life overall*. Core to establishing undesirability rather than mere difficulty. (e.g., Susan Wolf's "Moral Saints" argument).

  3.  **Conceptual Incoherence (c):**  
      *   **Thesis (c1 - Incoherent Category):** "Moral saint" is an incoherent concept—maximizing "moral goodness" lacks a determinate content (e.g., due to virtue conflicts: maximizing honesty might undermine compassion; maximizing beneficence might violate justice).  
      *   **Thesis (c2 - Non-Maximizable Virtue):** Virtue (as excellence of character) is not the kind of thing that admits of maximization. Virtues are context-sensitive mean states; "more" courage isn't always better, and integrated virtue requires balancing traits situationally, not maximizing each independently.  
      *   **Evaluation:** (c1) Plausible under particular conceptions of morality (e.g., emphasizing conflicting duties/virtues), false under others (e.g., sophisticated utilitarianism). (c2) Strong within Aristotelian virtue ethics, less compelling for maximizing consequentialism. **Contingent on moral framework.**  
      *   **Work in Argument:** Challenges the very coherence of the target ideal. If the concept is muddled, pursuing it is misguided. Primarily refutes the *definition* of "maximal moral goodness," not necessarily its desirability if coherently defined.

  4.  **Normative Insufficiency (d):**  
      *   **Thesis:** Agents lack *sufficient all-things-considered practical reason* to pursue moral perfection. Reasons stemming from non-moral goods (self-development, relationships, personal commitments) provide decisive grounds against sacrificing them for marginal moral gains. Moral reasons are not systematically overriding.  
      *   **Evaluation:** Conceptually defensible (if practical reason is pluralistic), contestable (if morality is supreme). **Non-trivial and foundational.**  
      *   **Work in Argument:** Directly targets the *practical "ought"*. Even if saints are possible and coherent, we aren't rationally required to become one. Shifts focus from feasibility/value to reasons for action. Often relies on (b).

  5.  **Other Live Interpretations (e):**  
      *   **Thesis (e1 - Virtue-Ethical Internal Critique):** Maximal focus on *moral* goodness (especially other-regarding action) undermines the development of *full virtue* or *phronesis* (practical wisdom). True virtue requires a rich life engaging diverse goods to cultivate judgment and avoid fanaticism.  
      *   **Thesis (e2 - Eudaimonistic Mismatch):** Moral perfection, understood as maximizing other-regarding action, does not constitute *eudaimonia* (human flourishing). Flourishing requires the realization of a broader range of human capacities beyond the narrowly moral.  
      *   **Evaluation:** (e1/e2) Strong within virtue-ethical frameworks. (e1) emphasizes how the *pursuit* corrupts virtue; (e2) claims the *outcome* isn't flourishing. **Powerful against external demands but framework-dependent.**  
      *   **Work in Argument:** Provides internal grounds for virtue ethicists to reject maximizing demands as *contrary to virtue itself* or true flourishing.

  ---

  ### **Committed Position: The Strongest Reconstruction & Necessary Elements**

  **Strongest Thesis:** The **Axiological Competition Thesis (b)** is the core, indispensable component for establishing the *undesirability* of the moral saint ideal. It directly argues that a life of maximal moral goodness is *less valuable overall* than a life incorporating significant non-moral goods, making it unattractive as a personal ideal.

  **Why (b) is Central to Undesirability:**
  1.  **Targets the Ideal's Value Directly:** Unlike (a) (which addresses feasibility) or (d) (which addresses reasons/obligation), (b) argues that the saintly life itself lacks the kind of value that makes a life choiceworthy or enviable. It claims the life is *intrinsically poorer*.
  2.  **Explains Common Intuitions:** The visceral sense that a life devoid of art, humor, deep personal love, or intellectual passion—even if morally impeccable—is somehow "lesser" or "grey" is best captured by value pluralism. Wolf's example of the humorless, self-denying saint resonates because it highlights this impoverishment.
  3.  **Grounds Normative Insufficiency (d):** The claim that we lack sufficient reason *not* to pursue sainthood (d) typically relies on the prior claim that non-moral goods *are* genuine, significant sources of value (b). If non-moral goods weren't valuable, reasons to pursue them wouldn't counter moral reasons.
  4.  **Surpasses Conceptual Arguments (c/e):** While (c) and (e) challenge the coherence or virtue-ethical validity of the ideal, they don't *necessarily* establish undesirability. A coherently defined utilitarian saint maximizing welfare might still be undesirable if it requires sacrificing crucial non-moral goods. (b) addresses this directly. Similarly, (e) often presupposes (b) – why is a "rich" life needed for phronesis or eudaimonia? Because non-moral goods are constituents of it.

  **Necessary Premises for Undesirability (and Contestable Commitments):**
  *   **Value Pluralism:** The thesis *requires* rejecting moral value monism (the idea that moral value is the *only* intrinsic value or lexically superior to all others). This is its most contested commitment. Defenders must argue that friendship, beauty, knowledge, play, etc., possess intrinsic, non-derivative value irreducible to moral value. (Opponent: Kantians, some utilitarians).
  *   **Non-Fungibility & Incommensurability:** The goods crowded out by saintliness must be not just valuable, but *non-fungible* with moral value (you can't "trade" a deep friendship for an equivalent moral gain) and often *incommensurable* (no single scale to weigh listening to a symphony against feeding a stranger). This prevents easy trade-off justifications. (Opponent: Maximizing consequentialists who reduce all value to a common currency).
  *   **Human Nature & Flourishing:** The argument implicitly relies on a view of human nature where flourishing requires engagement with a *plurality* of goods. Sacrificing all non-moral pursuits isn't just costly, it *stunts* human potential. (Opponent: Ascetic traditions, radical altruists who redefine flourishing morally).

  **The Role of Other Theses:**
  *   **(a) Psychological Impossibility:** Strengthens the case by showing the pursuit is *also* self-defeating, but is not necessary for undesirability. A hypothetically stable saintly life could still be undesirable due to its poverty of non-moral goods.
  *   **(d) Normative Insufficiency:** Is a crucial *consequence* of undesirability, but does not establish it alone. One might lack sufficient reason to pursue something desirable due to extreme cost, yet still acknowledge its desirability. (b) provides the reason *why* the cost is too high: it involves sacrificing comparably or more valuable non-moral goods.
  *   **(c) Conceptual Incoherence / (e) Internal Critique:** Can be powerful within specific frameworks (especially virtue ethics) but are less universally applicable. They don't directly establish undesirability for coherently defined maximizing ideals outside their framework. (b) has broader reach.

  **Does it Establish *Undesirability* (Not Just High Cost/Rarity)? Yes, under the contested commitments.**
  If value pluralism is true and non-moral goods are essential, irreducible components of a flourishing human life, then a life maximizing moral goodness *at the necessary expense* of these goods is undesirable *as a human life*. It lacks important elements of what makes life good *for the person living it*. This is distinct from:
  *   **High Cost:** Undesirability claims the end state *itself* is deficient. High cost implies the end is desirable but achieving it is prohibitively difficult.
  *   **Psychological Rarity:** Speaks to feasibility, not value.
  *   **Absence of Obligation:** One can have no obligation to pursue something desirable (e.g., becoming a concert pianist) because it demands too much sacrifice of *other* desirable things. (b) argues the saintly life *isn't* maximally desirable *overall*.

  **Conclusion:** The strongest anti-saint argument hinges on **axiological pluralism (b)**. It contends that moral perfection, by systematically excluding or minimizing non-moral goods essential to human flourishing, results in a life that is *less good all-things-considered* and therefore undesirable as an ideal. While psychological impossibility (a) and normative insufficiency (d) add weight, and internal critiques (e) are potent for virtue ethicists, only (b) directly and universally (given its premises) establishes the *undesirability* of the saintly life itself. Its success depends entirely on the defensibility of value pluralism and a non-moralistic conception of human flourishing – the core battlegrounds in debates about moral demandingness. This reconstruction provides the sharpest tool for resisting the claim that we *ought* to maximize moral virtue/goodness, as it denies that such a state constitutes the best kind of human life.
