prompt: |-
  My collegue studies whether pain is actually bad and she's made these verdict's so far: a normal migraine with full suffering is intrinsically bad and should be treated; pain asymbolia where you feel the burn but laugh, don't suffer, and don't avoid anything isn't bad, don't treat it for suffering's sake; phantom limb pain with vivid suffering but zero tissue damage is still bad; and chronic back pain where you've fully adapted, don't suffer anymore, but still pop pills just to stop the signal - she said that's inconvenient but not clearly bad. Next case is weird: a patient reports intense suffering and describes it in detail, but it's driven entirely by a false predictive model - no damage, they've been told it's false a hundred times, can't update. They don't avoid anything, don't seek relief, just sit with it. What's her call? I'm trying to figure out if she's running pure affective badness, functional-interference badness, or something about representational fit. Say what each rule predicts here, which one best matches her track record, and what's the one extra scenario - maybe zero conscious feeling but strong reflexive avoidance that ruins your life - that'd actually split them apart.
