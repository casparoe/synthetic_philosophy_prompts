  If we truly believed citizens should only be bound by rules they understand and endorse separately, both systems would indeed need radical redesign. We'd move toward unbundled votes on individual policies, perhaps with supermajority requirements for passage. But this raises practical questions about how finely we can slice policy decisions before governance becomes impossible.

