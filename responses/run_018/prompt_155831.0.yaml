answer: |-
  What you're noticing cuts right to the heart of how different democracies grapple with the messy reality of collective choice. Both the Swiss double majority and California's bundled propositions reveal underlying assumptions – often unstated – about what constitutes legitimate democratic decision-making when citizens hold complex, even contradictory, preferences.

  The Swiss double majority system fundamentally assumes that the "people" and the "cantons" are distinct political entities whose *separate* consent is necessary for fundamental constitutional change. It doesn't presuppose one singular "popular will." Instead, it acknowledges that legitimacy for altering the foundational rules requires satisfying two different dimensions of the polity: the aggregate of individual citizens *and* the aggregate of the constituent state-like units. This system inherently rejects the idea that a simple national popular majority alone can legitimately impose fundamental change if it overrides the expressed will of a majority of the cantons. It's a system built on layered consent, recognizing that the federation rests on both popular and federal pillars. The "contradictory preferences" are resolved, in a way, by demanding alignment across these two distinct layers – if the change is contentious enough to divide citizens and cantons sharply, it fails, preserving the status quo.

  California's ballot bundling, conversely, forces a very different logic. By packaging disparate policies into a single yes/no vote, it implicitly assumes that complex governance often requires trade-offs and compromises that must be accepted or rejected as a *package deal*. It presumes that legitimacy stems from voters giving a kind of holistic, if grudging, consent to an overall policy direction or negotiated settlement, even if no individual voter endorses every single component. This approach essentially says, "This is the compromise solution on offer; do you accept this entire negotiated outcome?" It prioritizes getting a functional result – often one hammered out by legislators or interest groups – over ensuring granular agreement on each element. The system *requires* voters to hold their noses on specific parts to support the whole, or reject the whole because of specific disliked parts. It rests on the idea that collective action necessitates accepting imperfect, bundled solutions rather than demanding perfect, atomized agreement.

  Both systems, however, clash dramatically with a principle demanding that citizens only be bound by rules they understand and endorse separately. If we took that ideal seriously, both would indeed collapse.

  *   **Switzerland's double majority** would need to extend its logic of separate consent far beyond the canton/popular divide. Why stop there? Why not require separate majorities for different regions, demographic groups, or even require consensus on each distinct clause within a constitutional amendment? The system currently protects cantonal sovereignty as a distinct layer; a pure individual consent model would atomize consent further, potentially making constitutional change impossible.
  *   **California's propositions** would be utterly unsustainable. Bundling would become illegitimate. Every distinct policy element – every tax mechanism, every zoning rule – would need its own separate vote. This would lead to an explosion of ballot measures, overwhelming voters and making coherent policy packages almost impossible to enact. The legislature's ability to craft compromises via legislation would be undermined, as every component could theoretically be challenged and voted on individually. The "holistic consent" model would be shattered in favor of fragmented, piecemeal approval.

  Such a radical redesign towards pure atomized consent would likely paralyze governance. Democracies function, often messily, by aggregating preferences and accepting compromises. They rely on the concepts of majority rule (or supermajorities), representative negotiation, and accepting bundled outcomes as legitimate expressions of collective will, *even when* that collective will is internally inconsistent and no individual agrees with everything. The systems you see in Zurich and California are different pragmatic responses to this challenge: Switzerland emphasizing layered federal consent for foundational changes, California forcing acceptance of complex compromises as single units. Both quietly assume that a workable collective decision, even if not reflecting a perfectly coherent or universally agreed "will," can still be legitimate, binding those who dissented on parts or even the whole, because the *process* of aggregation and decision (majority vote on the offered choice) confers legitimacy. The alternative – binding people *only* by rules they individually endorse – veers towards unanimity, which is the enemy of collective action on any significant scale.
