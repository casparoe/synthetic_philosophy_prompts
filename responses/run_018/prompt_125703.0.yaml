  I recall how Nancy Cartwright's "dappled world" critique of laws resonates here. Maybe the user could argue that both occasionalism and quantum mechanics reject Laplacean determinism while preserving patterns. Still, the epistemic gap looms: scientists assume natural regularities exist independently, while occasionalism makes them ontologically dependent.

