answer: |-
  Here's a critical audit of the heart/representation analogy in teleosemantics, pinpointing where it collapses and assessing the implications:

  ### Correspondence Table & Core Analogy
  | Biological System (Heart) | Teleosemantic Mapping | Representational System |
  |---------------------------|------------------------|--------------------------|
  | Heart Organ               | Representational Mechanism | Mental State/Neural Structure |
  | Pumping Action            | Representational Content | "That there is water here" |
  | Blood Circulation         | Distal Object/Property | Water (in the environment) |
  | Natural Selection History | Selection History | Evolutionary History |
  | Malfunction (e.g., leaky valve) | Misrepresentation | False belief (e.g., no water present) |

  **Core Claim:** Evolution assigns hearts the *proper function* of pumping blood. When a valve leaks, it malfunctions relative to this function. Similarly, evolution assigns mental states the *proper function* of tracking distal objects (e.g., water). Misrepresentation occurs when the state occurs without the object (e.g., hallucinating water).

  ### Where the Analogy Collapses

  1.  **Causation vs. Aboutness:**
      *   **Heart:** Pumping *causes* blood flow. Hearts don't *stand for* or *refer to* blood; they interact with it mechanically. They have effects, not semantic content.
      *   **Representation:** Mental states *are about* things (water, predators). They possess intentionality – "aboutness" or directedness. This is the core mystery teleosemantics aims to solve.
      *   **Collapse Point:** The analogy assumes causation (pumping→blood flow) *is equivalent to* intentionality (representation→content/aboutness). But causation alone doesn't generate meaning. A hammer causes nails to go in, but it doesn't *represent* nailing. Teleosemantics struggles to bridge this gap – it explains *function* but not how function *bestows meaning*.

  2.  **The Swamp Heart Challenge (Davidson, others):**
      *   **Scenario:** Lightning strikes a swamp, randomly assembling a molecule-for-molecule duplicate of a human heart. It starts pumping blood perfectly.
      *   **Question:** Does this swamp heart have the *proper function* of pumping blood?
      *   **Teleosemantic Response (Millikan):** No. Without evolutionary history, it has no proper function. It's merely *mimicking* the function of evolved hearts. Its pumping is accidental, not "supposed" to happen.
      *   **Critique:** Intuitively, the swamp heart *is* pumping blood *right now*. It seems to be doing exactly what hearts *do*. Denying it a function solely due to lack of history feels stipulative. Crucially:
          *   **Smuggling in the Conclusion:** The analogy *assumes* history is essential for function to argue history is essential for content. This is circular reasoning within the analogy itself. The swamp heart exposes this – we judge it *lacks* function *only because* we've already bought into the historical theory of function.
          *   **Problem for Representation:** If a swampman (randomly assembled human duplicate) had a mental state identical to "water-representation" when encountering water, does it *misrepresent*? Teleosemantics says yes (no history → no function → no content → misrepresentation). Intuition screams no – it seems perfectly accurate. This undermines the claim that history is *essential* for content.

  3.  **Malfunction vs. Misrepresentation:**
      *   **Statistical Deviation?** Could malfunction be defined statistically (e.g., valves leak in <1% of cases)? This seems plausible for biological systems.
      *   **Normativity Problem:** Representational misrepresentation carries *normative force* – a false belief is *wrong*, not just statistically unusual. There's a "correctness condition."
      *   **Designer vs. Selection:** Teleosemantics relies on selection history *as a substitute designer*. The "proper function" is what the trait was *selected for*. This provides a non-intentional, naturalized source of "ought" (it *ought* to pump; it *ought* to track water).
      *   **Collapse Point:** While statistical deviation might explain *breakage*, it doesn't explain *wrongness*. A heart that beats unusually slowly might be statistically deviant but medically functional. Selection history provides a stronger normative basis ("it was designed *for* pumping"). However, this inherits the problems of the swamp case: is the normative "ought" *really* grounded, or is it just a projection based on history? Does "selected for" genuinely create a representational norm, or just a biological propensity?

  ### Does the Relaxed Conclusion Survive?

  **"Mental norms are just biological norms" – Does this hold?**

  *   **Partial Survival:** Teleosemantics successfully *reduces representational function to biological function*. If you accept its historical theory of biological function (etiological function), then representational function is defined by it. Misrepresentation *is* a type of biological malfunction *under this definition*.
  *   **Critical Failures:**
      1.  **The Gap Remains:** It doesn't fully explain *how* biological function *becomes* semantic content/intentionality. It shows how representational states can *malfunction*, but not how they gain *aboutness* in the first place. The heart analogy masks this by starting with an already functional (causal) system.
      2.  **Swamp Problems:** The reliance on history makes content strangely extrinsic and vulnerable to swamp cases. If content depends entirely on history, a molecule-for-molecule identical brain state *now* has different content depending on its causal ancestry. This seems deeply counterintuitive and arguably undermines the supervenience of the mental on the physical.
      3.  **Normative Thinness:** Biological "norms" (e.g., "hearts should pump blood") are descriptive claims about what contributed to fitness in the past. Representational norms ("this belief should correspond to reality") feel prescriptive and truth-directed. Reducing the latter to the former risks losing the essential *truth-tracking* aspect of representation. Is misrepresentation *just* failing to do what ancestors did, or is it failing to *match the world*?
      4.  **Analogy's Burden:** The heart picture *was* carrying a huge part of the argument's intuitive plausibility. Its collapse – revealing hearts don't represent, swamp hearts challenge the necessity of history, and biological "malfunction" may lack the required normative force – significantly weakens the case that biological norms can *fully* explain mental norms. The disanalogies expose teleosemantics as offering a theory of *functional* norms applied to representations, not necessarily a complete naturalization of *intentional* norms.

  **Conclusion:**

  The heart analogy is rhetorically powerful but philosophically flawed. It obscures the fundamental gap between causation and intentionality. The swamp cases reveal its potentially circular reliance on history to define function/content. While teleosemantics successfully defines a *type* of representational norm (etiological function) in biological terms, the analogy collapses under scrutiny, showing it doesn't fully bridge the gap to genuine *aboutness* or capture the robust *truth-directed* normativity of mental representation. The relaxed conclusion ("mental norms are biological norms") survives only in a significantly weakened form, applicable to representational *function* defined etiologically, but leaving core problems of intentionality and truth-prescriptive norms unresolved. The heart picture was indeed carrying much of the argument's intuitive weight.
