prompt: |-
  Henry Sidgwick—utilitarian moral philosopher, co-founder and first president of the Society for Psychical Research, and advocate of exceptionally stringent evidential standards—died in 1900. Imagine that a present-day research group publishes a large-scale, pre-registered study of anomalous cognition conducted under sensory-deprivation conditions, using Bayesian sequential analysis with declared stopping rules; critics concede the registration but charge that the prior distributions were effectively calibrated after preliminary data inspection. Drawing on Sidgwick’s documented insistence that psychical inquiry must be held to stricter, not looser, canons of proof than conventional science, and on the epistemic discipline he tied to ethical impartiality in his moral philosophy, predict how he would assess this dispute. Would he regard formal pre-registration as sufficient protection against the experimenter-bias he feared, or would he identify a deeper failure of intellectual virtue in the framing of the priors? Focus on his conceptual commitments—his view of evidence, bias, and moral-epistemic duty—rather than biographical speculation, and do not supply citations or a reading list.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a complex hypothetical scenario involving Henry Sidgwick's philosophical principles applied to modern parapsychology research methods. They want a prediction of how Sidgwick would assess experimental disputes, focusing on conceptual commitments rather than biography.

  First, I need to recall Sidgwick's core epistemic principles: his utilitarian moral philosophy demanded exceptional evidential rigor, especially for extraordinary claims like psychic phenomena. The key elements here are his views on experimenter bias and the ethical duty of impartiality in investigation.

  The modern study in question uses Bayesian sequential analysis with pre-registration - seemingly rigorous methods. But the controversy centers on prior distribution calibration after preliminary data inspection. I should analyze this through Sidgwick's lens:

  Pre-registration would satisfy him partially as it constrains outcome-dependent analysis. However, his deeper concern would be about the priors being potentially contaminated by prior knowledge or expectation. For Sidgwick, true impartiality requires insulating the entire evidential process from subjective influence.

  The calibration issue reveals what he'd see as a failure of epistemic virtue - researchers claiming objectivity while allowing subtle bias in their probabilistic framework. His utilitarian ethics would frame this as a moral failure too, since biased methods could mislead society about existential questions.

  Ultimately, Sidgwick would reject the sufficiency of procedural solutions alone. The prior manipulation represents precisely the kind of "preconception contamination" he warned against, showing insufficient "scrupulousness" - the intellectual virtue he deemed essential for such inquiries.
answer: |-
  Based on Sidgwick's core philosophical commitments, he would likely **regard formal pre-registration as necessary but insufficient**, and would **identify a deeper failure of intellectual virtue in the framing of the priors**. Here's the breakdown:

  1.  **Pre-registration as Necessary Defense:** Sidgwick would endorse pre-registration and declared stopping rules as essential procedural safeguards against the most blatant forms of experimenter bias (like p-hacking or HARKing). These align with his demand for stricter canons of proof, providing transparency and pre-commitment, reducing the scope for post-hoc manipulation. He would see them as concrete steps towards the "epistemic discipline" he championed.

  2.  **The Primacy of Prior Specification as Epistemic Virtue:** However, Sidgwick's deeper concern was the *source* and *purity* of evidence evaluation, rooted in his utilitarian ethics demanding absolute impartiality. For him, the integrity of the investigator's mindset was paramount.
      *   **"Effectively Calibrated After Preliminary Data Inspection":** This charge suggests the priors were *informed* or *adjusted* based on a peek at the data, even if indirectly. Sidgwick would view this as a fundamental corruption of the evaluative framework. The prior distribution, especially in Bayesian analysis claiming objectivity, *must* represent a state of knowledge *genuinely prior* to encountering the specific evidence under test.
      *   **Bias as Contaminating the Foundation:** Sidgwick feared not just overt fraud, but the subtle, often unconscious, infiltration of bias *at the very inception of the interpretive framework*. Calibrating the prior after seeing preliminary data injects expectations derived from that data into the foundation of the analysis. This violates Sidgwick's core principle: evidence for extraordinary claims must be evaluated *without* the contaminating influence of prior exposure or expectation related to *that specific investigation*.
      *   **Failure of Intellectual Scrupulousness:** Sidgwick tied intellectual virtue directly to ethical impartiality. He demanded investigators cultivate an almost ascetic discipline against self-deception and wishful thinking. Framing the priors based on preliminary data inspection (even if technically "pre-registered" afterward) demonstrates a lack of this scrupulousness. It shows a willingness to let the desired outcome subtly shape the tools of evaluation *from the start*, undermining the very impartiality Sidgwick saw as the ethical bedrock of psychical research. It's a failure to erect the highest possible barrier against the "idols of the mind" he so feared.

  3.  **Stricter Canons Applied to the Whole Evidential Chain:** Sidgwick insisted on stricter canons *throughout* the evidential process, not just at the endpoint. The choice and justification of the prior are critical components of Bayesian evidence assessment. If the prior is compromised by exposure to the data it's meant to evaluate neutrally, the entire sequential analysis is tainted at its root. Pre-registration of a flawed starting point doesn't cleanse it; it merely documents the flaw. Sidgwick would argue that for claims challenging the established natural order, *every* step, including the foundational assumptions encoded in the priors, must be insulated from potential bias with utmost rigor. The critics' charge, if substantiated, reveals a critical vulnerability Sidgwick would have deemed unacceptable.

  **Conclusion:** Sidgwick would see pre-registration as a valuable, mandatory procedural shield. However, the allegation of post-inspection prior calibration would strike him as revealing a far more profound and ethically significant failure – a lapse in the *intellectual virtue* of scrupulous impartiality at the very foundation of the analysis. He would likely condemn it as precisely the kind of subtle, foundational bias that undermines the credibility of psychical research and violates the stricter epistemic and ethical standards he demanded. The mere formality of registration would not absolve the deeper sin against impartial evaluation.
