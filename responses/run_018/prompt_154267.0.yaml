  Also, if the polymer-replacement setup I described is actually incoherent or collapses the distinction I want them to fight over, just tell me that straight instead of forcing the dialogue. Write it in American English, and don't stress about perfect spelling—there can be a typo or two. I don't need citations or a reading list, just the arguement.
