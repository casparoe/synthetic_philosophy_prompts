answer: |-
  ## Coffee Shop Showdown: The Slow-Swap Statue

  **Setting:** Campus coffee shop, late afternoon. Clatter of mugs, low hum of conversation. MARA (energetic, gesturing with her latte) and JULES (calmer, methodically stirring his black coffee) are deep in it.

  **Mara:** Okay, Jules, hear me out on this slow-replacement scenario again. Original clay statue, right? Over *ten years*, conservators meticulously swap out clay molecules one-by-one, replacing them with this super-stable synthetic polymer. Identical shape, color, weight – you couldn’t tell the difference looking at it day-to-day. Meanwhile, the *original* clay molecules? Dug up from the landfill, meticulously reassembled into a bowl. Boom.

  **Jules:** (Nods slowly) Yeah, yeah, the set-up. I get it. You think this proves the statue – the *David*, let's say – survives this molecular heist. That it persists even though its original matter is now a cereal bowl somewhere. Therefore, statue ≠ lump of matter. Classic anti-identity argument. But I’m calling shenanigans.

  **Mara:** Shenanigans? How? Look at the thing in the museum at year ten! It looks *exactly* like David. It’s in the same place, serving the same aesthetic function, everyone *treats* it like David. How is that *not* David surviving?

  **Jules:** Because ‘surviving’ implies continuity of the *thing itself*, not just its appearance or social role. What you’ve got at year ten is a numerically *different* object – a polymer replica. It just happens to occupy the exact same space, sequentially, molecule by molecule, as the original statue *did*. It’s like replacing every plank on the Ship of Theseus *as you build a new ship right next to it with the old planks* – but super slow-mo. You end up with two distinct objects: the new polymer statue and the reassembled clay bowl.

  **Mara:** But that ignores *modal properties*! Think about what *could* happen to the statue. Suppose, *before* the swap started, we said, "If we crush David, it’s destroyed." True, right? Now, at year ten, if I crush the polymer thing in the museum, *that* would also be destroying David! Everyone would mourn! Whereas crushing the reassembled clay bowl? Sad for the bowl, maybe, but not the destruction of Michelangelo’s David! The polymer statue inherits David’s *modal profile* – its vulnerability to destruction in that specific way.

  **Jules:** (Leans forward, points finger) Okay, modal properties – fair point. But let’s talk about *persistence conditions*. What makes David *David* over time? You seem to think it’s primarily the *form* or the *role*. I think it’s tightly linked to its *original material constitution*, or at least a significant causal connection to it. The slow swap severs that connection too gradually to notice, but it *is* severed. The polymer replica at year ten has zero causal connection to Michelangelo’s chisel striking the original clay. It’s causally connected to the conservator’s tweezers and the polymer factory. Its persistence conditions are different: a lump of polymer shaped like David *could* be melted down and reshaped into anything without destroying ‘David’, because it was never *the* David to begin with – it was always a replica-in-progress.

  **Mara:** So you’re saying David just... fades out of existence? Like, at some point during the ten years, David ceases to be, and this polymer imposter takes its place? When? Molecule 1,000,001? That’s arbitrary! And what about the *continuity of experience*? For the curator checking it daily, it’s *always* David. There’s no moment where they say, "Oops, David’s gone, time to update the plaque."

  **Jules:** Arbitrary thresholds *are* a problem, I grant you. That’s why I lean towards a *stage theory* or perdurantism here. There isn’t one enduring ‘David’ entity. There’s a sequence of temporal statue-*stages*. Stage 1: Original clay, David-shaped. Stage 2: Clay+Polymer Mix Stage 1, David-shaped... Stage 1,000,000: Pure Polymer, David-shaped. Then Stage Clay-Bowl: Original molecules, bowl-shaped. Each stage is a distinct entity, causally linked to the *immediately preceding* stage (mostly), sharing spatiotemporal continuity and form, but not strict identity over the *whole* ten years, especially not across the material discontinuity. The *illusion* of one continuous David comes from the seamless transitions between stages.

  **Mara:** (Slumps slightly, takes a sip) Stages... ugh, that feels like giving up on the object itself. So you’re saying the ‘David’ we talk about is just a convenient name for a bunch of momentary statue-shapes strung together through gradual change and convention? That the *thing* I point to now isn’t the *same thing* I pointed to ten years ago, just its descendant? That’s... bleak. And doesn't capture the intuition that David *survived* the restoration process, even a weirdly thorough one.

  **Jules:** (Shrugs, a hint of sympathy) Maybe it is bleak. But look at the recovered clay. You shaped it into a bowl. If the original statue *was* identical to that lump of matter, how can that lump now be a bowl? It can’t be both a statue and a bowl *now*. Stage theory avoids that contradiction: the lump-of-clay-stage *was* statue-shaped (and thus part of the David-stage-sequence), now it’s bowl-shaped (part of a different sequence). The polymer-stage *looks* like David, but belongs to its own sequence starting when the swap hit 50.1% or whatever arbitrary line you dislike. It explains both the museum display *and* the clay bowl without positing one object surviving radical material replacement or being in two places at once.

  **Mara:** (Stares into her latte) But the modal properties, Jules... crushing the polymer thing *would* destroy David’s legacy. That feels real. Your stages make that feeling... accidental. Convention. It doesn’t sit right.

  **Jules:** (Finishes his coffee) Convention plays a bigger role than we like to admit, Mara. Maybe 'David' is less a physical object and more a... historically anchored pattern. The museum pattern persisted via the slow swap. The original matter pattern was reconstituted as a bowl. Two distinct patterns, both with claims to parts of David's history, but not one identical thing persisting through both. It’s messy, but less messy than saying David is now mostly plastic.

  **Mara:** (Sighs) Okay, stage-master. Buy me another latte and explain how *I* persist through breakfast. I feel like I've lost molecules just having this arguement.

  **Jules:** (Smirks) Only if you admit my polymer replica is definitely *not* David.
  **Mara:** Not a chance. But I *will* admit your persistence conditions argument is less terrible than I thought. Latte first.

  **(They head to the counter, the argument unresolved but the engagement genuine.)**
