prompt: |-
  Draft the joint statement of an adversarial collaboration between a normative-rationalist camp about weakness of will (akrasia) and an intertemporal-mechanist camp about hyperbolic discounting. Define the two sides precisely in the document itself: Camp A holds that akrasia is a distinctive failure of practical rationality in which an agent acts against her own all-things-considered judgment, and that hyperbolic discounting is at best a descriptive model of intertemporal preference reversal that fails to capture the normative and phenomenological structure of being divided against oneself; Camp B holds that what philosophers call akrasia is exhaustively explained by hyperbolic or quasi-hyperbolic discount dynamics—including preference reversals, the value of precommitment, and associated neural correlates—and that talk of “best judgment” and “normative residue” is a dispensable folk-psychological overlay.

  The deliverable must have four parts. First, a numbered section of claims both camps can sign: include the formal properties of hyperbolic discount curves, the predictive successes and failures of exponential discounting, what precommitment devices mechanistically do, the existence of cases in which agents violate prior resolutions, and any empirical findings about delay of gratification or self-control technology that both accept. Second, a disagreements table that states the residual disputes in wording each side would accept for its own view. Third, the cruxes—sub-questions such that settling them would move at least one side. I take the central cruxes to be: (a) whether there is a “normative residue,” i.e., a sense in which a prior resolution retains authority over the present self even after present preferences have shifted, which hyperbolic models must explain rather than eliminate; (b) whether “synchronic conflict” (feeling torn at the moment of action) and “diachronic betrayal” (violating a prior plan without present subjective conflict) are both real phenomena that must be distinguished, or whether one collapses into the other; and (c) whether precommitment succeeds by altering underlying preferences or by imposing an external causal constraint, and whether that distinction bears on whether weakness of will has occurred.

  For each crux, specify a concrete case or argument both sides agree bears on it, with each camp’s prediction recorded in advance. Use the “silent-precommitment case”: an agent binds herself via an automatic mechanism (e.g., a locked account or irreversible default reversal), experiences no subjective conflict at the moment the binding takes effect, and later reports she “would have done otherwise” but does not feel she acted against herself. The rationalist should predict that even without synchronic conflict there remains diachronic betrayal and a normative failure of practical reason; the mechanist should predict that without present preference reversal there is no akrasia, only a successful self-control technology, and that the agent’s retrospective report is confabulation.

  In drafting, inject the following framing—defined precisely in the agreed-claims section so the collaboration does not depend on prior familiarity: “diachronic authority” (whether a prior resolution binds the present agent in virtue of rational continuity or in virtue of an external causal constraint) and the paired distinction between “binding-cost” (the effort or welfare loss incurred in maintaining a resolution) and “binding-residue” (the normative standing that remains even when the binding-cost is eliminated by technology). Treat these as live conceptual tools, not as settled terms.

  Format the response as: (1) the numbered agreed-claims section; (2) the disagreements table; (3) the cruxes with predictions; (4) an explicit statement of which parts of the dispute are verbal rather than substantive, with reasoning both sides could accept.

  Finally, separate what is settled from what is genuinely contested among people who know the topic. Do not present a camp-specific claim—such as the eliminability of normative language or the irreducibility of practical reason—as the consensus. Flag clearly which claims are widely accepted in philosophy of action and behavioral economics, which belong specifically to one camp, and which remain genuinely open.
reasoning: |-
  We are drafting a joint statement between two camps: Camp A (normative-rationalist) and Camp B (intertemporal-mechanist). The document must have four parts:

  1. Agreed Claims (numbered section)
  2. Disagreements Table
  3. Cruxes with Predictions
  4. Statement on Verbal vs. Substantive Disputes

  We start by defining the camps:

  - **Camp A (Normative-Rationalist)**: Holds that akrasia is a distinctive failure of practical rationality in which an agent acts against her own all-things-considered judgment. They view hyperbolic discounting as a descriptive model that fails to capture the normative and phenomenological structure of being divided against oneself.

  - **Camp B (Intertemporal-Mechanist)**: Holds that what philosophers call akrasia is exhaustively explained by hyperbolic or quasi-hyperbolic discounting dynamics (including preference reversals, precommitment, and neural correlates). They see talk of "best judgment" and "normative residue" as a dispensable folk-psychological overlay.

  We must also define the framing terms precisely in the agreed claims:
  - **Diachronic Authority**: Whether a prior resolution binds the present agent in virtue of rational continuity (Camp A) or in virtue of an external causal constraint (Camp B).
  - **Binding-Cost**: The effort or welfare loss incurred in maintaining a resolution (e.g., the pain of resisting temptation).
  - **Binding-Residue**: The normative standing that remains even when the binding-cost is eliminated by technology (e.g., after a precommitment device is in place).

  Now, we proceed step by step.

  ### Part 1: Agreed Claims (Numbered Section)

  Both camps agree on the following:

  1. **Hyperbolic Discounting Formal Properties**: 
     - The hyperbolic discount function takes the form \( D(t) = \frac{1}{1 + k t} \) for delay t and discount rate k. Quasi-hyperbolic discounting (such as β-δ model) approximates this with a form \( D(t) = \beta \delta^t \) for t>0 and 1 for t=0, where β < 1 captures present bias.

  2. **Exponential Discounting Predictive Successes and Failures**:
     - Exponential discounting (with discount function \( D(t) = \delta^t \)) is consistent over time (stationary preferences) and avoids preference reversals. It has predictive success in stable environments and in some market settings where arbitrage prevents dynamic inconsistency.
     - However, exponential discounting fails to predict widespread preference reversals (e.g., choosing a smaller sooner reward over a larger later one when the smaller reward is immediate, but reversing when both are delayed), which are robustly observed in experiments and everyday behavior.

  3. **Precommitment Devices**:
     - Precommitment devices are mechanisms that restrict future choice sets (e.g., locking accounts, setting irreversible defaults). They work by imposing a cost on reversing a prior decision, thereby aligning future behavior with the prior resolution.
     - Mechanistically, they alter the feasible actions available at a future time, without necessarily changing underlying preferences.

  4. **Violation of Prior Resolutions**:
     - There exist cases in which agents form resolutions (e.g., to save money, quit smoking) and later act contrary to them. This is observed in both natural settings and experiments.

  5. **Empirical Findings on Delay of Gratification and Self-Control Technology**:
     - The "marshmallow test" and similar delay-of-gratification experiments show that the ability to wait for larger rewards predicts various life outcomes. However, this ability can be enhanced by cognitive strategies (e.g., distraction) and environmental modifications (e.g., hiding the temptation).
     - Self-control technologies (e.g., commitment devices like StickK, automatic savings plans) are effective in improving goal adherence. Their effectiveness is enhanced when they are low-cost and automatic.

  6. **Framing Definitions**:
     - **Diachronic Authority**: The question of whether a prior resolution binds the present agent in virtue of rational continuity (implying that the present self is rationally accountable to the past self) or in virtue of an external causal constraint (a mechanical restriction on choice).
     - **Binding-Cost**: The effort or welfare loss (e.g., willpower exertion, opportunity cost) incurred in maintaining a resolution without the aid of precommitment devices.
     - **Binding-Residue**: The normative standing that remains even when the binding-cost is eliminated by technology (e.g., after setting up an automatic transfer, the agent may still feel a sense of obligation to the prior resolution, even without ongoing effort).

  ### Part 2: Disagreements Table

  We present the residual disputes in wording each side would accept for its own view.

  | Issue | Camp A (Normative-Rationalist) | Camp B (Intertemporal-Mechanist) |
  |-------|--------------------------------|----------------------------------|
  | **Nature of Akrasia** | Akrasia is a distinctive failure of practical rationality: the agent acts against her own all-things-considered judgment, resulting in a violation of the agent's rational unity. | What philosophers call akrasia is exhaustively explained by hyperbolic discounting dynamics: preference reversals due to changing discount rates over time. There is no additional normative failure. |
  | **Role of Hyperbolic Discounting** | Hyperbolic discounting is a descriptive model of intertemporal preference reversal that fails to capture the normative and phenomenological structure of being divided against oneself. | Hyperbolic discounting (or quasi-hyperbolic) is a complete explanation of the phenomena labeled as akrasia, including the value of precommitment and associated neural correlates. |
  | **Normative Residue** | There remains a normative residue: even after a precommitment device is in place, the prior resolution retains authority, and violating it (if possible) would still be a failure of practical reason. | The notion of normative residue is a dispensable folk-psychological overlay. Once the precommitment device is in place and effective, there is no residue; the problem is solved mechanically. |
  | **Best Judgment** | The concept of "best judgment" is irreducible and central to understanding akrasia as a rational failure. | "Best judgment" is an epiphenomenal construct; the real drivers are time-varying discount functions. |

  ### Part 3: Cruxes with Predictions

  We specify three cruxes. For each, we state the question, a concrete case or argument both sides agree bears on it, and each camp's prediction.

  #### Crux (a): Normative Residue
  - **Question**: Whether there is a "normative residue," i.e., a sense in which a prior resolution retains authority over the present self even after present preferences have shifted, which hyperbolic models must explain rather than eliminate.
  - **Concrete Case**: The silent-precommitment case: An agent binds herself via an automatic mechanism (e.g., a locked savings account that prevents withdrawal until a set date). At the moment the binding takes effect, she experiences no subjective conflict. Later, when the funds are inaccessible, she reports she "would have spent the money if she could" but does not feel she acted against herself because the mechanism prevented her from acting.
  - **Camp A Prediction**: Even without synchronic conflict, there remains diachronic betrayal and a normative failure of practical reason. The agent's report that she "would have spent" reveals that she is not aligned with her prior resolution. The normative residue persists: the prior resolution still has authority, and the present self's preference reversal is a failure of rationality that the mechanism merely masks.
  - **Camp B Prediction**: Without present preference reversal (since the mechanism prevents the option from being available), there is no akrasia. The agent's retrospective report is confabulation; the mechanism has successfully aligned behavior with the prior resolution. The absence of subjective conflict indicates that the problem is solved, and there is no residue.

  #### Crux (b): Synchronic Conflict vs. Diachronic Betrayal
  - **Question**: Whether "synchronic conflict" (feeling torn at the moment of action) and "diachronic betrayal" (violating a prior plan without present subjective conflict) are both real phenomena that must be distinguished, or whether one collapses into the other.
  - **Concrete Case**: Consider two scenarios:
     - Scenario 1: An agent at t1 resolves to diet. At t2, when offered cake, she feels intense inner conflict (she both wants and doesn't want the cake) but eats it anyway.
     - Scenario 2: An agent at t1 resolves to diet. At t2, she sees cake and eats it without any inner turmoil, having forgotten her resolution until afterward.
  - **Camp A Prediction**: Both scenarios are instances of akrasia but with different phenomenological structures. Scenario 1 involves synchronic conflict; Scenario 2 involves diachronic betrayal. Both are failures of practical rationality because the agent acts against her all-things-considered judgment (even if not consciously present at t2 in Scenario 2). They require distinct explanations.
  - **Camp B Prediction**: Both scenarios are explained by hyperbolic discounting. In Scenario 1, the conflict arises because the immediate reward of cake is overvalued relative to the delayed reward of health. In Scenario 2, the absence of conflict is due to the resolution being inactive in memory; the discounting dynamics still apply. The distinction is superficial; both are preference reversals due to temporal proximity.

  #### Crux (c): Precommitment Mechanism
  - **Question**: Whether precommitment succeeds by altering underlying preferences or by imposing an external causal constraint, and whether that distinction bears on whether weakness of will has occurred.
  - **Concrete Case**: Consider two precommitment methods:
     - Method 1: An agent signs a contract that imposes a large financial penalty for smoking. She now prefers not to smoke because the penalty changes the payoff structure (altering underlying preferences).
     - Method 2: An agent has a chip implanted that causes nausea when she smokes (external causal constraint without changing the valuation of smoking itself).
  - **Camp A Prediction**: Both methods prevent the akratic action, but only Method 1 addresses the underlying preference. In Method 2, if the agent could smoke without nausea, she would, so the resolution is not internally endorsed. The distinction matters: Method 2 does not resolve the weakness of will but bypasses it. Akrasia would occur without the constraint.
  - **Camp B Prediction**: Both methods are equally effective precommitment devices. They work by changing the feasible set or the incentives. The distinction is irrelevant to akrasia; what matters is whether the behavior is aligned with the prior resolution. Without the constraint, the agent might smoke, but that is just a preference reversal due to discounting, not a special failure.

  ### Part 4: Statement on Verbal vs. Substantive Disputes

  We now specify which parts of the dispute are verbal (terminological) rather than substantive, with reasoning both sides could accept.

  - **Verbal Disputes**:
    1. **"Akrasia" Definition**: Some disagreement is verbal regarding the scope of the term "akrasia." Camp A uses it to refer to any action against one's all-things-considered judgment, regardless of the mechanism. Camp B uses it to refer to the behavioral pattern of preference reversal due to hyperbolic discounting. This difference in definition leads to disputes about whether cases like the silent-precommitment case involve akrasia. However, both agree on the behavioral facts: the agent would have acted against the prior resolution without the device.
    2. **"Normative" Language**: Camp A insists on normative language (e.g., "failure of practical reason") while Camp B sees it as eliminable. This may be verbal because both agree on the descriptive phenomena (e.g., agents form resolutions and then violate them, causing regret). The disagreement is about whether the normative language adds explanatory value.

  - **Substantive Disputes**:
    1. **Existence of Normative Residue**: Whether prior resolutions have ongoing normative authority beyond the causal effects of memory and precommitment is a substantive dispute. Camp A claims it does, Camp B denies it.
    2. **Reduction of Rational Failure to Discounting**: Whether the experience of being divided against oneself can be fully reduced to discounting dynamics or requires an irreducible notion of rational unity is substantive.

  - **Reasoning Both Sides Accept**: Both camps agree that the collaboration has clarified the points of agreement and the nature of the remaining disputes. They agree that the behavioral predictions (e.g., the effectiveness of precommitment devices) are testable, but the interpretation of the agent's experience (e.g., the feeling of betrayal) may require further empirical and conceptual work.

  ### Clear Separation of Claims

  - **Widely Accepted in Philosophy of Action and Behavioral Economics**:
    - The existence of preference reversals and their description by hyperbolic discounting.
    - The effectiveness of precommitment devices in altering behavior.
    - The distinction between exponential and hyperbolic discounting and their predictive successes and failures.

  - **Camp-Specific Claims**:
    - Camp A: The irreducibility of practical reason and the existence of normative residue.
    - Camp B: The eliminability of normative language and the sufficiency of hyperbolic discounting as an explanation.

  - **Genuinely Open Questions**:
    - Whether the phenomenological structure of akrasia (synchronic conflict and diachronic betrayal) can be fully explained by hyperbolic discounting.
    - Whether precommitment devices that work by external constraints (without changing preferences) address the root cause of akrasia or merely mask it.
    - The neural and cognitive basis of the sense of normative authority in prior resolutions.

  This completes the draft.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Akrasia and Hyperbolic Discounting  

  #### **Defining the Camps**  
  - **Camp A (Normative-Rationalist)**: Akrasia is a distinctive failure of *practical rationality* wherein an agent acts against their own all-things-considered judgment. Hyperbolic discounting is a descriptive model of intertemporal preference reversal that fails to capture the normative structure (e.g., obligations of rational unity) and phenomenological experience (e.g., feeling divided against oneself) of akrasia.  
  - **Camp B (Intertemporal-Mechanist)**: Phenomena labeled "akrasia" are exhaustively explained by hyperbolic/quasi-hyperbolic discounting dynamics, including preference reversals, precommitment efficacy, and neural correlates. "Best judgment" and "normative residue" are dispensable folk-psychological constructs; no irreducible rational failure exists.  

  #### **1. Agreed Claims (Empirical and Conceptual Common Ground)**  
  Both camps endorse the following numbered claims, which define key terms and establish shared empirical foundations:  

  1. **Hyperbolic Discounting Formal Properties**:  
     - Hyperbolic discounting follows the function \( D(t) = \frac{1}{1 + kt} \), where \( t \) is delay and \( k \) is a discount rate. Quasi-hyperbolic discounting approximates this with \( \beta\delta^t \) (where \( \beta < 1 \) models present bias). Both generate **time-inconsistent preferences**: agents favor smaller-sooner rewards over larger-later ones when the smaller reward is imminent, reversing preferences when both are delayed.  

  2. **Exponential Discounting Predictive Successes and Failures**:  
     - Exponential discounting (\( D(t) = \delta^t \)) succeeds in predicting consistent intertemporal choices in contexts with stable incentives (e.g., financial markets with arbitrage).  
     - It fails to predict widespread preference reversals in experiments (e.g., choosing $50 today over $100 in a week, but $100 in 53 weeks over $50 in 52 weeks) and everyday lapses (e.g., procrastination).  

  3. **Precommitment Devices—Mechanistic Function**:  
     - Precommitment devices (e.g., irreversible defaults, locked accounts) work by **altering choice architectures**: they impose external constraints that remove or penalize future options. This prevents preference reversals by making akratic actions mechanically infeasible or costly.  

  4. **Violations of Prior Resolutions**:  
     - Agents reliably violate prior resolutions (e.g., to save, diet, or quit smoking) in the absence of constraints, as demonstrated in field studies (e.g., Ashraf et al., 2006) and lab experiments.  

  5. **Delay of Gratification and Self-Control Technology**:  
     - Delay-of-gratification capacity (e.g., "marshmallow test") predicts life outcomes (e.g., academic success), but is malleable via "cooling" strategies (e.g., distraction) or technology (e.g., apps blocking distractions).  
     - Self-control technologies (e.g., automatic payroll deductions) exploit precommitment mechanics and reduce akratic behavior without requiring willpower.  

  6. **Framing Definitions**:  
     - **Diachronic Authority**: The question of whether a prior resolution binds the present agent via *rational continuity* (Camp A) or *external causal constraint* (Camp B).  
     - **Binding-Cost**: Effort or welfare loss incurred to maintain resolutions (e.g., willpower depletion in resisting temptation).  
     - **Binding-Residue**: The *normative standing* of a prior resolution that persists even when binding-cost is eliminated (e.g., via a precommitment device).  

  #### **2. Disagreements Table**  
  Residual disputes articulated in each camp’s preferred wording:  

  | Issue | Camp A (Normative-Rationalist) | Camp B (Intertemporal-Mechanist) |  
  |-------|---------------------------------|----------------------------------|  
  | **Nature of Akrasia** | Akrasia is a failure of rational self-governance: acting against one’s best judgment constitutes a distinct normative defect, irreducible to preference dynamics. | "Akrasia" is a label for hyperbolic discounting effects; it involves no normative defect beyond suboptimal preference reversals. |  
  | **Role of Hyperbolic Discounting** | Hyperbolic discounting describes behavioral patterns but ignores the *normative phenomenology* of self-division (e.g., guilt upon resolution-violation). | Hyperbolic discounting exhaustively explains akrasia, including its neural correlates; normative language is superfluous. |  
  | **"Best Judgment" Status** | Best judgment reflects rational integration of values; violating it creates binding-residue (e.g., unresolved guilt even after precommitment). | "Best judgment" is an epiphenomenal construct; only revealed preferences (via choices) matter. |  
  | **Diachronic Authority of Resolutions** | Prior resolutions retain authority via rational identity: the past self’s judgment binds the present self normatively. | Prior resolutions bind only through causal mechanisms (e.g., precommitment devices); no normative authority exists. |  

  #### **3. Cruxes with Predictions**  
  Cruxes are sub-questions where empirical/conceptual resolution would shift at least one camp’s position. Each includes a shared case and advance predictions.  

  - **Crux (a): Normative Residue**  
    **Question**: Does a "normative residue" exist (i.e., prior resolution retains authority post-preference-shift), requiring explanation rather than elimination?  
    **Shared Case**: *Silent-precommitment case*: An agent uses an automatic mechanism (e.g., locked savings account) to bind her future self. At binding time, she feels no conflict. Later, when funds are inaccessible, she reports, "I would have spent the money if I could," but denies feeling she "acted against herself."  
    - **Camp A Prediction**: Diachronic betrayal occurs: the agent’s action (if unbound) violates rational unity, creating normative residue (guilt/shame). Her denial of conflict reflects self-deception.  
    - **Camp B Prediction**: No akrasia occurs: the device solved the problem. Her report ("would have spent") confabulates a counterfactual; no residue exists.  

  - **Crux (b): Synchronic Conflict vs. Diachronic Betrayal**  
    **Question**: Are synchronic conflict (feeling torn at action-time) and diachronic betrayal (violating a resolution without conflict) distinct phenomena?  
    **Shared Case**: Agents who violate diets:  
    - *Synchronic*: Agent feels anguish while eating cake.  
    - *Diachronic*: Agent automatically eats cake, recalling resolution only afterward.  
    - **Camp A Prediction**: Both are akrasia but with distinct structures: synchronic involves conscious self-division; diachronic reveals "forgotten" normative residue.  
    - **Camp B Prediction**: Both reduce to preference reversal: synchronic conflict arises from acute reward competition; diachronic cases involve memory lapses, not normative defects.  

  - **Crux (c): Precommitment Mechanism**  
    **Question**: Does precommitment succeed by altering preferences or imposing constraints, and does this distinction affect whether akrasia occurs?  
    **Shared Case**: Two precommitment methods for quitting smoking:  
    - *Preference-change*: A contract imposes penalties, making smoking less desirable.  
    - *Constraint-only*: An implant causes nausea if smoked, without changing desire.  
    - **Camp A Prediction**: Constraint-only cases involve "bypassed" akrasia: the agent remains weak-willed (she would smoke if unconstrained). Preference-change addresses the failure.  
    - **Camp B Prediction**: Both methods equally prevent akrasia by aligning behavior with past preferences. The distinction is irrelevant; only behavioral outcomes matter.  

  #### **4. Verbal vs. Substantive Disputes**  
  Both camps agree that parts of the dispute are terminological, not substantive:  

  - **Verbal Disagreements**:  
    1. **"Akrasia" scope**: Camp A uses "akrasia" for any action against best judgment; Camp B restricts it to preference-reversal cases. This is verbal—both agree on the behavioral patterns (e.g., resolution-violation).  
    2. **"Normative" vs. "descriptive" language**: Camp A’s "normative failure" and Camp B’s "suboptimal choice" describe identical behaviors but frame them differently. This is terminological—both accept the actions occur.  

  - **Substantive Disagreements**:  
    1. **Binding-residue reality**: Whether prior resolutions generate normative obligations (Camp A) or are inert without causal constraints (Camp B) is substantive.  
    2. **Reducibility of phenomenology**: Whether the feeling of self-betrayal (e.g., guilt) is reducible to discounting dynamics (Camp B) or signals irreducible rational failure (Camp A) is substantive.  

  - **Reasoning for Both**:  
    Verbal disputes arise from divergent explanatory priorities (rationality vs. mechanisms), but do not affect predictions about behavior. Substantive disputes hinge on empirical cruxes (e.g., neural correlates of guilt in silent-precommitment cases) and conceptual work (e.g., whether "diachronic authority" requires rational continuity).  

  ---

  ### **Separation of Settled, Camp-Specific, and Open Claims**  
  - **Widely Accepted (Philosophy of Action/Behavioral Economics)**:  
    - Hyperbolic discounting explains preference reversals; exponential discounting fails descriptively.  
    - Precommitment devices work by altering choice sets.  
    - Agents violate resolutions absent constraints.  
    - Delay-of-gratification is malleable via cognitive/technological interventions.  

  - **Camp-Specific Claims**:  
    - *Camp A*: Irreducibility of best judgment, normative residue, and diachronic rational authority.  
    - *Camp B*: Eliminability of normative language, sufficiency of discounting dynamics.  

  - **Genuinely Open Questions**:  
    - Whether neural evidence (e.g., fMRI of conflict in diachronic cases) supports normative residue.  
    - If precommitment via constraint-only avoids akrasia or merely masks it.  
    - Whether synchronic/diachronic akrasia share cognitive mechanisms.
