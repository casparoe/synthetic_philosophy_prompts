      "Revises everyday concepts of pleasure (e.g., synthetic euphoria isn't pleasure)",
      "Requires scalar (graded) account of integration/endorsement"
    ],
    "insulation_risk": "Moderate: Risk of diluting 'endorsement' to cover counterexamples, but core structural claim remains falsifiable by objectless euphoria or unconscious rewards.",
    "exposure_verdict": "Highly exposed to affective neuroscience; empirically vulnerable but resilient to phenomenological heterogeneity."
  }
  ```

  SIH is a formidable reply to heterogeneity but faces empirical and conceptual challenges that may require significant revision or narrowing. Its fate hinges on whether conscious integration is *essential* to pleasure or merely one manifestation.
