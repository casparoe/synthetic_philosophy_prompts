prompt: |-
  hey, i'm trying to work out my actual commitments on supererogation by checking my gut on cases, and i want to know if there's actually a principle behind them or if i'm just being inconsistent.

  here's where i land:

  1. a stranger saves someone from drowning at serious risk to thier own life — clearly supererogatory, the classic case.
  2. a parent works two jobs so their kid can go to school — not supererogatory, just parental duty, even though it's brutal.
  3. donating 10% of income to effective charities — right at the boundary. praiseworthy, but i feel like it's close to what decency requires, not clearly "above and beyond."
  4. donating 50% and living frugally — that extra chunk feels genuinely supererogatory.
  5. a wealthy person anonymously funds vaccines for a village with basically no personal risk — i want to call it supererogatory, but it's weird because there's no cost. if they do the exact same thing loudly for reputation, it feels less so, even with identical outcomes.
  6. someone accidentally causes a crash with no negligence, then spends years doing dangerous rescue work far beyond compensation — the excess part feels supererogatory, but part of me thinks it might just be extended duty.
  7. refusing to lie to save your career when the lie hurts no one — required, not supererogatory. but refusing to lie when it saves a life? also required. so where's the line?

  i also keep thinking about this distinction i made up between "heroic" one-off acts and "maintenance supererogation" — like consistently doing small costly good things over decades. i think both should count, but i'm way more sure about the heroic ones.

  is there one principle that captures all this? maybe something about cost-relative-to-duty? but then case 5 breaks it because cost is near zero. or maybe it's about exceeding a socially defined baseline? but that feels too relativistic. which of my verdicts do i have to drop to get coherence?

  also, what does your best account predict for a doctor who could work lucrative private practice but instead spends 30 years in an understaffed rural clinic at half pay? is that supererogatory for the whole 30 years, or does it eventually become "just thier job"? and does your principle put the anonymous vaccine funder and that doctor in the same category, or split them?

  please say which case forces you to overturn one of my intuitions, and give me a fresh case i haven't listed to test the repaired principle.
reasoning: |-
  Okay, the user is wrestling with supererogation—actions that are good but not required. They've listed seven cases where they judge whether something is supererogatory or just a duty. They want to know if there's a consistent principle behind their judgments or if they're being inconsistent. 

  First, I need to understand their intuitions. Case 1: Stranger risking life to save someone—supererogatory. Classic. Case 2: Parent working two jobs for kid's education—duty, not supererogatory. Case 3: Donating 10% to charity—borderline, maybe required. Case 4: Donating 50%—supererogatory. Case 5: Wealthy person funding vaccines anonymously—supererogatory, but if done for reputation, less so. Case 6: Accidentally causing a crash, then doing years of rescue work—excess part supererogatory, but maybe duty. Case 7: Refusing to lie to save career—required, even if lying would save a life? That one's tricky.

  They also mention "heroic" vs. "maintenance supererogation"—big one-time acts vs. small consistent ones. They think both should count but are surer about heroic acts.

  The user's deeper need seems to be seeking coherence in their moral framework. They might feel uncertain in real-life decisions where duty and supererogation blur. Are they an ethicist, philosopher, or just someone trying to align their actions with their values? Probably the latter—they mention "checking my gut on cases," so it's personal.

  Their confusion points to a tension between cost, duty, and social expectation. Case 5 is key: no cost, but they call it supererogatory. Yet motivation matters (anonymous vs. reputation). So maybe supererogation isn't just about cost but also about exceeding what's demanded by role or circumstance. 

  For a unifying principle, I lean toward "demand-adjusted cost." Duty defines a baseline demand (e.g., parents must provide; professionals must be truthful). Supererogation kicks in when you exceed that baseline at personal cost, adjusted for your capacity. Wealthy person: low cost, but high capacity, so giving is still beyond demand. 

  But Case 7 is a problem. They say refusing to lie is always required, even to save a life? That clashes with standard ethics where lying to save life might be permissible. Maybe they're deontologists? If so, the principle must accommodate that. Or perhaps they see truth-telling as non-negotiable duty. 

  The doctor case: 30 years at half pay. Initially supererogatory, but over time, it might become their "role," so less supererogatory? But the principle should say it remains supererogatory because the baseline demand for a doctor doesn't require sacrificing half their pay indefinitely. 

  Fresh test case: A firefighter off-duty runs into a burning building to save someone. Heroic, supererogatory. But if they do it often, does it become expected? Probably not—still beyond duty. 

  To fix inconsistency, I'd challenge their view on Case 7. If lying could save a life and they refuse, that might be overly rigid. Most would call that supererogatory only if refusing imposes huge cost on them. But they see it as duty. So maybe their principle needs to allow that some duties are absolute, but that makes supererogation rarer. 

  Alternatively, separate moral dimensions: cost, duty, and optionality. Supererogation = optional + costly + good. But then Case 5 (vaccines) has low cost—why call it supererogatory? Because it's optional and beneficial. So cost isn't necessary; it's about going beyond minimal decency. 

  Final principle: An act is supererogatory iff (a) not morally required, (b) morally good, and (c) involves sacrifice relative to capacity/role. Sacrifice can be material, risk, or opportunity cost. Case 5: no material cost, but opportunity cost (could have spent money on themselves) and exceeds social baseline for wealthy. Motivation matters for praiseworthiness, not supererogation status. 

  For the doctor: Always supererogatory because baseline doesn't demand lifelong sacrifice. Vaccines donor: Same category—both exceed demands. 

  User must drop the intuition that motivation affects whether it's supererogatory (only affects praiseworthiness). In Case 5, both anonymous and reputational acts are supererogatory, but the latter is less praiseworthy. 

  Fresh test: A CEO takes a 90% pay cut to raise employee wages. Supererogatory? By the principle, yes—beyond duty, costly, good. If they do it for PR, still supererogatory but less admirable. 

  This should resolve most of their cases coherently.
answer: |-
  Your intuitions are remarkably consistent with a nuanced principle I'll call **"Demand-Adjusted Cost"** (DAC). The core idea: **Supererogation occurs when an agent incurs significant personal cost *relative to the demands of their role, capacity, and circumstance* to achieve a morally significant good, where that cost exceeds what is strictly required by duty, even if the act itself is morally optional.**

  Let's break down how DAC explains your cases:

  1.  **Stranger drowning rescue:** High cost (life risk). Low demand (no special duty to strangers). *Supererogatory.*
  2.  **Parent working two jobs:** High cost. High demand (parental duty to provide basic needs/opportunities). *Not supererogatory.*
  3.  **Donating 10%:** Moderate cost (relative to average capacity). Moderate demand (many argue basic decency requires *some* aid to prevent severe suffering, especially with capacity). *On the boundary* – it approaches the baseline demand for the capable. Praiseworthy but not clearly *beyond*.
  4.  **Donating 50%:** High cost (relative to capacity/lifestyle). Exceeds baseline demand significantly. *Clearly supererogatory.*
  5.  **Wealthy vaccine funder (anonymous):** Low *absolute* cost (due to vast wealth). Low demand (no specific duty to *this* village). **BUT** – Significant cost *relative to capacity* (foregoing substantial personal benefit easily within reach). *Supererogatory.* Motive (reputation) doesn't change the *status* of the act (it's still beyond duty), only its *praiseworthiness*. DAC focuses on the cost/demand ratio, not motive.
  6.  **Causing accident, then rescue work:** Initial accident (no negligence) creates no *culpability*, but arguably creates a special *agent-relative demand* to make amends. Years of dangerous work likely *exceeds* the reasonable demand for compensation/amends. The *excess* part is *supererogatory*.
  7.  **Refusing to lie:** Truth-telling is a general duty. Refusing to lie to save your career (no harm) is *required*. Refusing to lie even to save a life feels required because truth-telling is a *prima facie* duty, and you judge it's never overridden in this case? **Here's where your intuition might be inconsistent or needs refinement.** Most ethical systems (except absolute deontology) would allow/permit lying to save a life. DAC suggests: *Permitting* the lie might be supererogatory *if* telling the truth incurs severe cost *to the agent* (e.g., career loss). **DAC forces you to overturn your intuition here:** Refusing to lie when it would save a life *and* cause you significant harm (career loss) **is** supererogatory – you're bearing high cost relative to the demand (truth-telling) in a situation where lying might be permissible to prevent great harm.

  **Addressing "Heroic" vs. "Maintenance" Supererogation:** DAC handles both. "Heroic" acts involve high absolute cost/risk quickly. "Maintenance" involves sustained significant cost relative to capacity/demand over time. Both exceed baseline demands with personal sacrifice. Your greater certainty about heroic acts likely stems from their dramatic, undeniable cost.

  **The Doctor Case (30 years rural clinic):** By DAC:
  *   **Status:** Supererogatory for the *entire* 30 years. The baseline demand for a doctor (professional duty) is to practice competently and ethically. It does *not* demand lifelong service at half-pay in hardship posts. The sustained cost (financial, lifestyle, opportunity) relative to capacity and the baseline demand remains significant throughout.
  *   **Becoming "just their job"?** Psychologically, it might *feel* like their role. Ethically, the *demand* hasn't increased to match the cost. It remains beyond duty. Choosing to leave after 10 years wouldn't be blameworthy (if done responsibly), confirming the initial and ongoing choice is supererogatory.
  *   **Anonymous Vaccine Funder vs. Doctor:** DAC puts them in the **same category** (both supererogatory). Both involve significant cost *relative to their capacity and the baseline demands on them* to achieve significant good. The doctor's cost is more sustained and tangible; the funder's cost is opportunity cost relative to vast wealth. But both clearly exceed what duty requires.

  **A Fresh Test Case:**
  *   **The Case:** A highly skilled software engineer, comfortably employed, spends 20 hours per week (unpaid) for a decade maintaining critical open-source security infrastructure used by hospitals and banks, preventing countless potential disasters. This requires significant personal sacrifice (time, family, potential higher income).
  *   **DAC Prediction:** *Supererogatory.*
      *   **Cost:** High (20 hrs/week for a decade = massive opportunity cost for leisure, family, career advancement).
      *   **Demand:** Baseline professional duty is to be competent and ethical in *their paid job*. There is no duty demanding this level of unpaid, sustained, high-skill labor for public benefit.
      *   **Good:** Morally significant (preventing harm to many).
      *   **Relative Cost:** Sacrifice is significant relative to capacity (they *could* use that time for personal gain/leisure) and far exceeds minimal professional demands.
  *   **Why it tests DAC:** It blends "maintenance supererogation" with high skill/intangible benefit. It contrasts with Case 3 (10% donation) – here the cost is time/skill rather than money, sustained over a long period. It also tests whether "duty" is narrowly professional or broader (DAC says narrowly professional baseline).

  **In Summary:**

  *   **Your Principle:** **Demand-Adjusted Cost (DAC)** – Supererogation = Significant personal cost (material, risk, opportunity) relative to the agent's capacity and the baseline demands of their role/circumstance, incurred to achieve significant good, where the act itself is morally optional (not strictly required by duty).
  *   **Key Insight:** Cost is *relative* (to capacity and demand), not absolute. Motive affects praiseworthiness, not supererogation status.
  *   **Intuition to Drop:** Your verdict on Case 7 (Refusing to lie to save a life is *required*). DAC shows this act involves bearing high cost relative to the demand of truth-telling in a context where lying might be permissible to prevent great harm, making it supererogatory.
  *   **Coherence Achieved:** DAC explains all your other verdicts and handles both heroic and maintenance supererogation, the doctor case, and the vaccine donor case consistently. The fresh test case further demonstrates its applicability to sustained, skill-based sacrifice beyond professional duty.
