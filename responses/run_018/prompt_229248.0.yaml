  First, I need to recall Borges' key views. In essays like "A New Refutation of Time," he denies the continuity of time and self. He thinks each moment is independent, and identity is an illusion. Also, in "Borges and I," he separates the private self from the author persona. The author is more like a character created through texts.

  Now, LLMs are interesting because they generate responses without memory between interactions. Each response is a fresh output based on patterns in data, not a continuous consciousness. Borges might see this as a perfect example of his metaphysics—no persistent self, just isolated utterances. The LLM's ability to mimic his style decades after his death could support his idea that authorship isn't tied to a living person but exists in the texts themselves.

