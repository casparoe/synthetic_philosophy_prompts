answer: |-
  Here’s a structured role-play game for your workshop, designed around **"The Plaque Paradox"**, framed by the tension between official records and lived memory. It leans into your concepts of **mnemonic soverignty** (the community’s claimed right to control its own narrative) and **counter-archival obligation** (the duty to preserve suppressed truths).

  ---

  ### **THE PLAQUE PARADOX: RULES & SETUP**  
  *(Total Time: 75 mins)*  

  **Participants:**  
  - **12 Players:** 6 Keepers, 6 Record Office (RO)  
  - **2 Hidden Funders** (Workshop facilitators/volunteers)  

  **Materials:**  
  - **Keepers:** "Memory Cards" (e.g., *"Song: 'The Night the Lights Went Out' sung at protests"*, *"Rumour: Manager bribed to trigger closure"*, *"Silence: 3 families never speak of it"*).  
  - **Record Office:** "Official Documents" (e.g., *Council Minutes: "Closed due to market pressures"*, *Police Logs: "Minor disturbance; no arrests"*, *Trade Paper: "Orderly wind-down"*).  
  - **Tokens:** Reputation tokens (coloured counters), 1 "Agreement Contract".  
  - **Hidden Funders:** Grant cheque prop, rules card.  

  ---

  ### **TIMELINE**  
  1. **Introduction (5 mins):**  
     - Frame the conflict: "In 1983, Milford Foundry closed. The Record Office holds official documents. The Keepers hold community memory. Both claim authority."  
     - Introduce **mnemonic soverignty** (Keepers’ "sacred right to their truth") and **counter-archival obligation** (RO’s "duty to only validate documented facts").  

  2. **Role Briefing (10 mins):**  
     - **Keepers:** *"Protect your memories. Conceding = betraying your elders. Earn tokens by citing Memory Cards."*  
     - **Record Office:** *"Defend institutional credibility. Conceding undocumented claims = losing credibility points. Earn tokens by citing documents."*  
     - **Funders (hidden):** *"Release grant ONLY if both sign identical plaque wording. You don’t care *what* it says."*  

  3. **Negotiation (35 mins):**  
     - Groups draft plaque wording. Facilitators circulate, remind Funders to observe.  
     - **Payoff Scheme:**  
       - **Keepers/RO:** 1 token per claim from own sources.  
       - **RO Penalty:** -2 tokens per undocumented claim conceded.  
       - **Agreement Bonus:** +3 tokens each *only* if deal signed.  
       - **No-Deal Outcome:** 0 shared bonus; highest token-holder chooses plaque location/font.  

  4. **Signing Deadline (5 mins):**  
     - Funders reveal themselves. Groups submit final wording or declare deadlock.  

  5. **Debrief (20 mins):**  

  ---

  ### **PREDICTABLE OUTCOMES & DEBRIEF**  
  **What Will Likely Happen:**  
  - **Coordination Failure (80% chance):** The shared bonus (+3) is less than RO’s penalty (-2) or Keepers’ perceived betrayal cost. RO refuses undocumented claims; Keepers reject "sterile" wording.  
  - **RO Dominance (15%):** Keepers fold, adopting RO’s language to "get the plaque". Memory is erased.  
  - **Keeper Revolt (5%):** Keepers refuse to engage, accusing RO of complicity in silencing.  

  **Debrief Framework:**  
  1. **Map the Stalemate:**  
     - *"Why was conceding more costly than agreeing?"* → Highlight **asymmetrical power**: RO loses institutional standing; Keepers lose generational trust.  
     - *"Funders were neutral—did that help or hinder?"* → Exposes how **bureaucratic neutrality** privileges "verifiable" records.  

  2. **Philosophical Tension:**  
     - **Mnemonic Soverignty vs. Counter-Archival Obligation:**  
       - Keepers: *"Why should paper trump lived experience?"*  
       - RO: *"How do we validate truth without documents?"*  
     - **Core Question:** *When records and memory conflict, which *should* give way?*  
       - Option 1: Records (memory is subjective).  
       - Option 2: Memory (records are curated by power).  
       - Option 3: **"Contested Plaque"** (e.g., *"A site of closure (1983) and unresolved struggle"*).  

  3. **What the Game *Can’t* Replicate:**  
     - **The Weight of Disbelief:** Keepers’ frustration when their truths are dismissed as "rumours" can’t mimic decades of systemic gaslighting.  
     - **Generational Transmission:** The game compresses 40 years of memory into bullet points—losing the *embodied* trauma of silenced families.  
     - **Emotional Toll:** RO’s "credibility points" are abstract; real archivists may internalise guilt over erasure.  

  4. **Facilitator Notes:**  
     - **Predictable Flaw:** First runs often end in deadlock. Use this! Ask: *"If this were real, would the plaque matter *less* than the act of resisting?"*  
     - **Niche Concepts:**  
       - **Mnemonic Soverignty:** "Did the Keepers *feel* their right to control the narrative was respected?"  
       - **Counter-Archival Obligation:** "Did the RO feel trapped by their duty to the archive?"  
     - **Clincher Question:** *"Is the plaque a truce—or a new site of conflict?"*  

  ---

  **Why This Works:**  
  - **Pressure Cooker Design:** The token economy forces brutal trade-offs.  
  - **Hidden Funders:** Expose how "neutral" institutions arbitrate truth.  
  - **British Nuance:** References to council minutes/trade papers feel locally grounded.  

  **Run it straight through—then let the silence after deadlock linger. That’s where the learning lives.**
