answer: |-
  ### Joint Statement: Adversarial Collaboration on the Grounding of Normative Truths  
  **Participants:**  
  - **Metaphysical Grounding Realist (MGR):** Affirms a single, unified grounding relation of ontological priority across physical, mental, and normative domains.  
  - **Grounding Pluralist (GP):** Affirms domain-specific grounding relations (e.g., physical, logical, normative) with no cross-domain metaphysical priority.  

  **Scope:** Restricted to the grounding of normative truths (e.g., "causing unnecessary suffering is *pro tanto* wrong").  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following principles as non-negotiable constraints on any theory of grounding:  

  **1.1 Formal Features of Grounding**  
  - *(a) Irreflexivity:* Nothing grounds itself.  
  - *(b) Asymmetry:* If A grounds B, B does not ground A.  
  - *(c) Transitivity:* Grounding is transitive within a single domain (e.g., if A grounds B and B grounds C in the normative domain, A grounds C). Both parties withhold judgment on whether transitivity holds *across* domains.  

  **1.2 Explanatory Successes**  
  An adequate account of grounding must preserve:  
  - *(a) Scientific Explanations:* Grounding in physics explains the dependence of higher-level properties (e.g., chemical properties) on fundamental physical properties (e.g., quantum states).  
  - *(b) Ethical Explanations:* Descriptive properties (e.g., "causing unnecessary suffering") non-accidentally explain normative properties (e.g., "pro tanto wrongness"), regardless of grounding’s scope.  
  - *(c) Domain Integrity:* Explanatory patterns within a domain (e.g., logical deduction or physical causation) must be respected without reduction to other domains.  

  **1.3 Failure Conditions**  
  The following undermine grounding explanations and are jointly rejected:  
  - *(a) Circularity:* Grounding chains cannot be circular (e.g., A grounds B and B grounds A).  
  - *(b) Explanatory Vacuity:* Grounding must not be trivial (e.g., "wrongness grounds wrongness").  
  - *(c) Ontological Explosion:* Theories must not multiply fundamental entities or relations beyond necessity (e.g., positing infinite grounding chains or redundant grounds).  

  ---

  ### 2. Disagreements Table  
  The table below states divergences in wording each party accepts for their own position.  

  | Issue | Metaphysical Grounding Realist (MGR) | Grounding Pluralist (GP) |
  |-------|--------------------------------------|--------------------------|
  | **Nature of Grounding Relations** | Grounding is a single, cross-domain relation of ontological priority. Domain distinctions are pragmatic, not metaphysical. | Grounding is fragmented into irreducible domain-specific relations (physical, normative, etc.). Cross-domain grounding is incoherent. |  
  | **Grounding of Normative Truths** | Normative facts (e.g., "suffering is wrong") are grounded in non-normative descriptive properties (e.g., neurophysiological suffering). | Normative facts are grounded *only* by other normative facts or principles. Descriptive properties trigger but do not ground normativity. |  
  | **Cross-Domain Ontological Commitment** | Cross-domain grounding does not violate parsimony; it unifies metaphysics under one relation, avoiding brute "domain gaps." | Cross-domain grounding violates a *no-free-lunch constraint*: It demands a "bridge" relation with no domain-internal basis, inviting ontological profligacy. |  
  | **Methodology** | Grounding must be maximally explanatory; denying cross-domain grounding leaves normative-descriptive connections inexplicably brute. | Grounding must respect *domain autonomy*; imposing cross-domain relations distorts explanatory practices (e.g., in ethics or physics). |  

  ---

  ### 3. Crux Analysis  
  Three sub-questions whose resolution would move at least one party. Each includes a shared case/evidence and explicit predictions.  

  #### Crux 1: Evolutionary Explanations of Normative Belief  
  **Question:** Do evolutionary explanations of normative beliefs (e.g., "kin altruism is good") function as *grounding explanations* for normative truths or as *debunking threats* to their objectivity?  

  - **Shared Case:** Evolutionary biology explains human belief in kin altruism as an adaptation for inclusive fitness (e.g., via gene-centered selection).  
  - **MGR Prediction:** This case demonstrates grounding: Descriptive facts (evolutionary pressures) ground normative facts (kin altruism is good) by revealing their natural basis. Belief-forming processes track normative truth.  
  - **GP Prediction:** This case demonstrates debunking: Evolutionary causes are non-normative, severing belief-truth links. Normative grounding must be autonomous to preserve objectivity.  

  **Verbal Dispute Note:** "Objectivity" here is non-verbal; disagreement centers on whether evolution *explains* or *explains away* normativity.  

  #### Crux 2: Approximate Physical Realization of Normative Structures  
  **Question:** Does the approximate physical realization of a normative system (e.g., distributive justice) undermine normative autonomy by implying reducibility, or support it by showing multiple realizability?  

  - **Shared Case:** A computer simulates a "veil of ignorance" procedure for distributive justice, using silicon-based circuits to approximate ideal theory outputs.  
  - **MGR Prediction:** This case demonstrates reducibility: Close physical realization shows normative facts (e.g., "fairness") are grounded in physical structures. Imperfections are epistemic, not ontological.  
  - **GP Prediction:** This case demonstrates autonomy: Approximate realization proves normative structures abstractly constrain but are irreducible to physical implementation. Variability across systems (e.g., brains vs. AI) confirms domain specificity.  

  **Verbal Dispute Note:** "Realization" is non-verbal; disagreement is metaphysical (is normativity *identical* to its physical base or *constrained* by it?).  

  #### Crux 3: Supervenience Without Cross-Domain Grounding  
  **Question:** Can normative supervenience (descriptive sameness → normative sameness) be explained without cross-domain grounding?  

  - **Shared Case:** Two identical acts of torture (same physical/psychological suffering) must share the same wrongness property. Supervenience is uncontested.  
  - **MGR Prediction:** This case requires cross-domain grounding: Without descriptive facts grounding normative facts, supervenience is brute and inexplicable.  
  - **GP Prediction:** This case requires domain-internal grounding: Supervenience arises from normative principles (e.g., "suffering grounds wrongness") applied to descriptive inputs, not direct cross-domain dependence.  

  **Verbal Dispute Note:** "Bruteness" is non-verbal; disagreement is whether supervenience demands grounding or is a conceptual truth.  

  ---  
  **Signed,**  
  Metaphysical Grounding Realist  
  Grounding Pluralist
