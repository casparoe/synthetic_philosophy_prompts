  ### Analysis of the Slogan: "Updating on a conditional shouldn't budge your prior on the antecedent"

  The slogan was used in a discussion about the Judy Benjamin problem to reject Jeffrey conditioning. Judy Benjamin is dropped into a territory divided into Red and Blue areas, each with HQ and non-HQ regions. Initially, she assigns equal credence (0.25) to each of the four regions. She then learns the indicative conditional: "If you are in Red territory, the probability you are at HQ is 3/4." The challenge is to update her credences. Jeffrey conditioning (which updates probabilities for a partition) is criticized via the slogan, implying it violates a core constraint. Below, I disambiguate the slogan into distinct readings, assess their status, and evaluate whether they support dismissing Jeffrey conditioning.

  ---

  ### Disambiguated Readings:

  #### Reading 1: **Certain Update on Material Conditional**  
  **Formulation:** Learning the material conditional \(A \to C\) (where \(A\) = antecedent) with certainty (i.e., setting \(P_{\text{new}}(A \to C) = 1\)) should preserve the prior probability of \(A\): \(P_{\text{new}}(A) = P_{\text{old}}(A)\).  
  **Status:** **False**. Counterexample: Suppose \(P_{\text{old}}(A) = 0.5\), \(P_{\text{old}}(C \mid A) = 0.5\), \(P_{\text{old}}(C \mid \neg A) = 0.5\). Then \(P_{\text{old}}(A \to C) = P_{\text{old}}(\neg A \lor C) = 0.75\). After conditioning on \(A \to C\), \(P_{\text{new}}(A) = P_{\text{old}}(A \mid A \to C) \approx 0.333 \neq 0.5\).  
  **Supports dismissal of Jeffrey?** No. The Judy Benjamin problem involves learning a conditional probability (\(P(HQ \mid Red) = 0.75\)), not a material conditional.  
  **Notes:** Material conditionals behave differently from conditional probabilities. This reading conflates the two.

  #### Reading 2: **Rigid Update on Conditional Probability**  
  **Formulation:** When updating to a new conditional probability \(P_{\text{new}}(C \mid A) = x\), the prior probability of \(A\) must remain unchanged: \(P_{\text{new}}(A) = P_{\text{old}}(A)\). Adjustments occur only within the \(A\) and \(\neg A\) subdomains.  
  **Status:** **Defensible**. This "rigid" approach (probability kinematics) is a normative choice for minimizing unnecessary changes. It aligns with the slogan’s intent in Judy Benjamin.  
  **Supports dismissal of Jeffrey?** Yes. Jeffrey conditioning updates unconditional probabilities of a partition, but here the constraint is on \(P(C \mid A)\), not on \(P(A)\). Rigid updating forbids changing \(P(A)\), while Jeffrey conditioning (if applied) might alter it indirectly.  
  **Notes:** In Judy Benjamin, rigid updating keeps \(P(Red) = 0.5\), satisfying the slogan. Jeffrey conditioning doesn’t naturally handle conditional probability constraints.

  #### Reading 3: **Flexible Update on Conditional Probability**  
  **Formulation:** When updating to \(P_{\text{new}}(C \mid A) = x\), \(P_{\text{new}}(A)\) may change if it better conserves overall credences (e.g., via maximum entropy methods).  
  **Status:** **Defensible**. Maximizing entropy (minimizing Kullback-Leibler divergence) sometimes requires changing \(P(A)\).  
  **Supports dismissal of Jeffrey?** No. Maximum entropy updates can change \(P(A)\) (e.g., in Judy Benjamin, \(P_{\text{new}}(Red) \approx 0.467 \neq 0.5\)), violating the slogan. Jeffrey conditioning isn’t directly applicable here.  
  **Notes:** The slogan is false under this reading. Maximum entropy is a viable alternative to rigid updating.

  #### Reading 4: **Synchronic Coherence**  
  **Formulation:** The conditional probability \(P(C \mid A)\) is defined as \(P(A \land C) / P(A)\), so synchronically, \(P(C \mid A)\) doesn’t constrain \(P(A)\). Diachronically, updating on \(P(C \mid A) = x\) needn’t fix \(P(A)\).  
  **Status:** **Tautology**. Synchronic definitions don’t mandate diachronic rules.  
  **Supports dismissal of Jeffrey?** No. This is a consistency observation, not a revision policy. It doesn’t engage with Jeffrey conditioning.  
  **Notes:** The slogan is diachronic; this synchronic reading misapplies the objection.

  #### Reading 5: **Update on Subjunctive Conditional**  
  **Formulation:** Learning a Stalnaker-style subjunctive conditional (e.g., "If \(A\) were true, \(C\) would hold") shouldn’t change \(P(A)\), as it describes counterfactuals, not evidence.  
  **Status:** **Defensible**. Subjunctive conditionals lack "centering" (i.e., they don’t imply \(A\) is true).  
  **Supports dismissal of Jeffrey?** No. Judy Benjamin’s conditional is indicative, not subjunctive.  
  **Notes:** The slogan may confuse indicative/subjunctive conditionals. Irrelevant to Judy Benjamin.

  #### Reading 6: **Intermediate Credence Update**  
  **Formulation:** Updating on a conditional (material or probabilistic) with less-than-certainty might preserve \(P(A)\), depending on the rule.  
  **Status:** **Ambiguous**. Depends on whether rigid/flexible rules are used.  
  **Supports dismissal of Jeffrey?** No. Judy Benjamin involves certain learning, and Jeffrey conditioning handles intermediate credences for partitions, not conditionals.  
  **Notes:** The slogan assumes certainty; Jeffrey conditioning generalizes to uncertainty but doesn’t fit this constraint type.

  ---

  ### Verdict on the Slogan’s Use in Judy Benjamin  
  The slogan-user likely intended **Reading 2 (Rigid Update on Conditional Probability)**. This reading is defensible and supports dismissing Jeffrey conditioning:  
  - **Why this reading?** The Judy Benjamin problem centers on learning \(P(HQ \mid Red) = 0.75\) with certainty, and the arguer treats preserving \(P(Red)\) as obvious. Rigid updating enforces this, while Jeffrey conditioning doesn’t apply directly (as it requires updating a partition, not a conditional probability).  
  - **Does it succeed?** Partially. Rigid updating is a coherent alternative (keeping \(P(Red) = 0.5\)), but it’s not the only option (e.g., maximum entropy changes \(P(Red)\)). The slogan ignores this debate. Crucially, Jeffrey conditioning is **not designed** for conditional probability constraints, so dismissing it is reasonable under rigid updating—but the slogan overstates this as a universal constraint.  

  **Final Note:** The slogan smuggles in a commitment to rigid updating. A better objection would clarify why rigidity is preferable (e.g., conservatism about antecedents) rather than treating it as obvious.

