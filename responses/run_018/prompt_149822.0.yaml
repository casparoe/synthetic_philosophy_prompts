prompt: |-
  In Bayesian epistemology, the problem of old evidence has persisted since the 1980s without convergence: data already known before a theory's introduction—such as Mercury's orbital precession prior to general relativity—seem to provide no new probabilistic support, yet they are routinely cited as confirming instances. The literature has accumulated technical responses—counterfactual priors, distinctions between predictive and accommodative success, revisions to conditionalization—without resolving whether these are competing formal solutions or sides talking past each other. Diagnose this stalemate. Is it a substantive disagreement about the correct Bayesian formalism, a verbal dispute about whether 'confirmation' must involve predictive novelty, or a hidden split between normative questions about rational belief revision and descriptive questions about scientific reasoning? Identify what each side actually takes the problem to show, and take a committed position: state precisely what kind of disagreement this is. Then specify what would count as genuine progress—whether a formal result, a conceptual distinction, or a reframing of the question itself—rather than another technical patch.
reasoning: |-
  Okay, the user is asking about the problem of old evidence in Bayesian epistemology. This problem has been around since the 1980s and deals with how evidence that was already known before a theory was proposed can still confirm that theory. The classic example is Mercury's orbital precession supporting Einstein's general relativity. The user wants me to diagnose why there's a stalemate in this debate, figure out what kind of disagreement it is, and suggest what real progress would look like.

  First, I need to recall the core of the problem. Bayesian confirmation theory says evidence E confirms theory T if P(T|E) > P(T). But if E is already known, P(E) = 1, so P(T|E) just equals P(T). This suggests old evidence can't confirm a theory, which contradicts how scientists actually use such evidence.

  Looking at the different approaches people have taken. Some like Garber and Jeffrey proposed counterfactual priors - imagining what we'd believe if we didn't know E yet. Others like Howson focus on logical learning, where we discover that T implies E. Then there are those who say predictive success is different from accommodation, and Bayesianism should only handle the former. And some like Sprenger argue that old evidence can confirm if we have the right background knowledge.

  The user is asking why there's no convergence here. I need to identify the nature of the disagreement. Is it about the correct formalism? Or about what "confirmation" means? Or about normative vs. descriptive questions? 

  I think it's all three, layered together. The formal solutions tackle different aspects: counterfactual priors address the probability assignments while logical learning addresses what's learned. But they don't resolve the deeper issue - what confirmation should do. Some see it as about belief dynamics, others as about justification. And the predictive vs. accommodative success distinction ties into whether novelty is required for confirmation, which is a verbal disagreement about terminology.

  Each side thinks the problem shows something different. The counterfactual camp thinks it shows Bayesianism needs hypothetical priors. The logical learning side thinks it shows we need to model learning logical truths. The predictive success advocates think it shows Bayesianism shouldn't handle old evidence at all. And the normativists vs. descriptivists debate whether Bayesianism is prescriptive or descriptive.

  I should take a committed position. I think the core disagreement is about confirmation requiring predictive novelty. Those who insist on novelty will reject any Bayesian solution for old evidence, while others want a formalism that allows it. This makes it a substantive disagreement about what confirmation is. 

  For real progress, we need to reframe the question. Instead of asking "How can old evidence confirm?" we should ask "What cognitive or epistemic value does citing old evidence provide?" This shifts focus from formalism to function. We could then see that citing old evidence might serve purposes like demonstrating coherence or explanatory power, which could be modeled with richer frameworks than standard Bayesianism. Genuine progress would be a model that captures why scientists find old evidence persuasive, perhaps using Bayesian tools in a broader context.
answer: |-
  The problem of old evidence (POE) persists because it exposes a **triple-layered disagreement**: a *substantive* clash over Bayesian formalism (Layer 1), a *verbal* dispute about "confirmation" (Layer 2), and a *meta-level* conflict between normative and descriptive goals (Layer 3). These layers reinforce each other, preventing resolution. Below is a diagnosis, committed position, and path to genuine progress.

  ---

  ### **1. Diagnosing the Stalemate**
  **Layer 1: Substantive Disagreement on Formalism**  
  Competing solutions modify Bayesianism in irreconcilable ways:  
  - **Counterfactual priors** (Glymour, Garber): Assume we *did not know* E (e.g., "What would my credence in GR be if I didn’t know Mercury’s precession?").  
  - **Logical learning** (Howson, Jeffrey): Learn that T *entails* E (e.g., "GR predicts precession" is new information).  
  - **Non-probabilist revisions** (e.g., measure-theoretic fixes): Treat old evidence as a limit case (P(E) ≈ 1 but not 1).  

  These are **competing formal patches**, not complementary. Each alters Bayesianism’s core axioms (e.g., counterfactuals violate actual belief states; logical learning demands non-empirical updates). No consensus exists on which alteration is "legitimate."

  **Layer 2: Verbal Disagreement on "Confirmation"**  
  - **Predictive purists** (e.g., Mayo, Worrall): Confirmation *requires* predictive novelty. Accommodating old data is *weak evidence* of data-fitting, not genuine support.  
  - **Accommodationists** (e.g., Sprenger, Fitelson): Explaining *why* known evidence occurs (e.g., GR’s derivation of precession) is confirmatory. "Confirmation" includes explanatory coherence.  

  This is **not merely verbal**—it reflects a deeper split about whether Bayesianism should describe *historical* scientific practice (where old evidence matters) or prescribe *ideal* inference (where novelty is king).

  **Layer 3: Normative vs. Descriptive Schism**  
  - **Normativists** (e.g., Howson): POE shows Bayesianism needs refinement to model *rational belief revision*. Old evidence *should* confirm, so formalism must adapt.  
  - **Descriptivists** (e.g., Glymour): POE reveals Bayesianism’s *descriptive failure*. Scientists cite old evidence for rhetorical/historical reasons, but this isn’t "confirmation" in probabilistic terms.  

  Here, **sides talk past each other**: Normativists tweak math to rescue confirmation; descriptivists dismiss the problem as misapplied formalism.

  ---

  ### **2. Committed Position: The Core Disagreement**  
  The stalemate is **primarily substantive** (Layer 1) because competing formalisms encode incompatible views of evidence and learning. However, Layers 2–3 *sustain* the deadlock:  
  - **Predictive purists** see POE as revealing Bayesianism’s *boundary conditions* (it only handles novel evidence).  
  - **Accommodationists** see it as exposing a *technical flaw* (Bayesianism must model explanatory gains from old data).  

  **What each side takes POE to show**:  
  | **Camp** | **POE Reveals** | **Implied Solution** |  
  |----------|-----------------|----------------------|  
  | **Counterfactualists** | Actual Bayesianism is incomplete; agents need hypothetical priors. | Formalize "ignorance states." |  
  | **Logical Learners** | Agents learn logical relations, not just empirical facts. | Include logical uncertainty in updates. |  
  | **Predictive Purists** | "Confirmation" ≠ "accommodation." | Restrict Bayesianism to novel predictions. |  
  | **Descriptivists** | Scientists use "confirmation" non-technically. | Reject POE as a *formal* problem. |  

  **My position**: POE is unsolvable within *standard* Bayesianism because it conflates **temporal novelty** (when E was learned) with **epistemic novelty** (whether E was *understood* as a consequence of T). The core issue is **substantive**: Bayesianism lacks tools to model "explanatory insight" (e.g., seeing Mercury’s precession *as evidence for GR* post-discovery). Accommodationists want this modeled; purists reject it as non-probabilistic.

  ---

  ### **3. Genuine Progress: Beyond Technical Patches**  
  Resolution requires **reframing the question**, not new formalisms:  
  - **Shift focus**: From "How can old evidence confirm?" to "**What epistemic value does citing old evidence provide?**"  
  - **Key insight**: Old evidence (e.g., Mercury’s precession) gains confirmatory power when a new theory (e.g., GR) *explains it systematically*, resolving anomalies or unifying it with other phenomena. This is about **explanatory coherence**, not incremental probability.  

  **What progress looks like**:  
  - **Integrate Bayesianism with explanation** (e.g., Schupbach’s "explanatory bayesianism"): Formalize how theories *make sense of* old evidence. For example:  
    - Define a measure of *explanatory fit* (e.g., reduction in "surprisingness" of E given T).  
    - Show that P(T|E, K) > P(T|K) when T *explains E better than rivals*, even if P(E|K) = 1 (where K = background knowledge).  
  - **Empirical philosophy of science**: Study *why* scientists cite old evidence (e.g., to demonstrate non-ad-hocness, unificatory power). Use this to constrain formal models.  
  - **Abandon confirmation monism**: Accept that "support" has multiple dimensions (predictive, explanatory, unifying). Bayesian probability can handle *one* dimension; other tools (e.g., causal graphs, explanatory models) handle others.  

  **Not progress**: Another counterfactual measure or logical update rule. These address symptoms (P(E)=1) but ignore the *epistemic function* of old evidence in science.

  ---

  ### **Conclusion**  
  The POE stalemate is a **substantive disagreement** about whether Bayesian confirmation should encompass explanatory gains from old evidence. Competing formalisms reflect deeper divides about the goals of epistemology (normative vs. descriptive) and the nature of evidence (predictive vs. accommodative). Genuine progress requires reframing POE as a problem about **explanation and theory assessment**, not probability kinematics. Bayesianism should either expand to integrate explanatory virtues (e.g., via "explanatory priors") or concede that confirmation is multidimensional—with old evidence playing a non-Bayesian but epistemically vital role.
