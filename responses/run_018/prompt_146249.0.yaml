answer: |-
  ### Prep Sheet: Defending the Counterfactual Web Thesis  
  **Core Thesis:** Prolonged LLM reliance for plot generation erodes the author's capacity to sustain the "counterfactual web" (the dense, unwritten field of narrative alternatives), which is the primary locus of moral weight in fiction. Moral characterization requires readers to sense that alternatives were genuinely available to the character, and maintaining this requires authors to cognitively hold unstable maps of rejected paths—a load LLMs collapse.  

  **Key Threats:** Ordered by damage to your *specific claim* (erosion of capacity, not general anti-tech sentiment).  

  ---

  #### **1. Philosopher of Mind's Objection (Most Damaging: Attacks Core Mechanism)**  
  **Objection Phrased:** "Your 'counterfactual web' is an unnecessary epiphenomenon. If the *text* fluently implies character alternatives (via dialogue, consequence, etc.), the reader's behavioral understanding is identical. Why privilege the author's private cognitive load over output fluency? LLMs excel at generating text that *simulates* moral complexity through pattern recognition."  
  **Concede Immediately:** Behavioral fluency (reader perception) is the ultimate benchmark for moral weight in the text.  
  **Do NOT Concede:** That the author's cognitive process is irrelevant to sustaining textual richness over time.  
  **Weakest Point in Your Reply:** Claiming phenomenological authority (e.g., "writers *feel* the difference") without linking it to observable outcomes.  
  **Reply That Must Land:** "The erosion isn’t about the text’s *immediate* quality but the author’s *capacity to regenerate* moral depth across works. LLMs shortcut the cognitive labor of holding unstable alternatives, turning 'liveliness' into a static output. Without practicing this load, authors lose the ability to organically seed alternatives during drafting—leading to formulaic 'complexity' that decays upon rereading. Fluency ≠ sustained generative capacity."  

  ---

  #### **2. Cognitive Psychologists' Objection (High Damage: Undermines Erosion Mechanism)**  
  **Objection Phrased:** "Expertise involves strategic offloading. If LLMs handle plot mechanics, authors *redirect* cognitive resources to higher-order tasks (e.g., thematic coherence or emotional nuance), potentially *enhancing* moral depth. Where’s evidence that this specific 'counterfactual web' degrades? Skill decay requires disuse, but authors might actively engage with LLM output to refine alternatives."  
  **Concede Immediately:** Cognitive offloading can augment expertise (e.g., calculators freeing mental bandwidth for advanced math).  
  **Do NOT Concede:** That plot generation is a mechanic separable from moral imagination.  
  **Weakest Point in Your Reply:** Lack of longitudinal studies on authors using LLMs.  
  **Reply That Must Land:** "The counterfactual web isn’t a 'task'—it’s the *cognitive substrate* for moral weight. Offloading plot generation is like offloading memory to GPS: convenient, but it atrophies spatial reasoning. Authors interacting with LLM output engage with *optimized* paths, not the unstable, high-effort map of *rejected* possibilities. This is deliberate practice degradation: without generating alternatives *under load*, the muscle for moral ambiguity weakens."  

  ---

  #### **3. Literary Scholars' Objection (Moderate Damage: Challenges Necessity of Individual Cognition)**  
  **Objection Phrased:** "Authorship is distributed. Editors, beta readers, and cultural context co-construct alternatives. Why is the *author’s* cognitive load essential? LLMs are just another collaborator. Your thesis romanticizes solitary genius."  
  **Concede Immediately:** Fiction is socially constructed; collaboration enriches narratives.  
  **Do NOT Concede:** That individual authors can outsource the core generative act without loss.  
  **Weakest Point in Your Reply:** Overstating the author’s unique role in pre-writing cognition.  
  **Reply That Must Land:** "Collaboration *responds to* a draft; the counterfactual web exists *before* drafting, guiding intentionality. When LLMs generate plots, they collapse alternatives into data-driven 'best paths,' making the web externally sourced, not internally sustained. Editing an LLM’s output builds critical skills, but not the *generative* capacity to hold unstable possibilities—which is where moral weight originates. Distributed authorship refines; LLM reliance *replaces*."  

  ---

  #### **The Question You Hope Nobody Asks**  
  **Objection:** "Isn’t this just the 'handmade vs. machine-made' bias? Weavers lamented looms, but industrial textiles enabled new aesthetics. If LLMs democratize narrative complexity, why is your 'cognitive load' more valid than a painter fearing photography?"  
  **Why It’s Dangerous:** Forces you to distinguish your thesis from generic anti-automation sentiment.  
  **Your Reply Strategy:**  
  - **Concede:** Automation can enhance access and efficiency.  
  - **Distinguish:** "This isn’t about output quality or tradition—it’s about *embodied cognition*. Photography didn’t erode visual perspective skills; it demanded new ones. But LLM plot generation *bypasses* the specific cognitive act (holding unstable counterfactuals) required for moral depth. The threat isn’t machine aid but prolonged *non-practice* of a core creative capacity. Like relying on GPS eroding navigation skills, it’s a targeted degradation, not nostalgia."  

  ---

  ### **Delivery Notes**  
  - **Pacing:** Allocate time: Philosopher (5 min), Psychologists (4 min), Literary (3 min), Feared Question (3 min).  
  - **Anchor in Concrete Examples:** Briefly reference novels where moral weight relies on implicit alternatives (e.g., *Madame Bovary*’s unrealized escapes).  
  - **Avoid:** Defending "human genius"; focus on *cognitive mechanics* and *sustainability*.  
  - **Empirical Hook:** Cite expertise studies (e.g., chess players memorizing positions vs. AI users) to ground erosion claims.  
  - **Close Strong:** "This isn’t anti-tech—it’s pro-craft. LLMs as editors? Powerful. LLMs as *plot muscles*? That erodes the core of moral fiction."  

  You’re defending a nuanced, defensible claim. Stay concrete, concede strategically, and hammer the erosion mechanism. Good luck.
