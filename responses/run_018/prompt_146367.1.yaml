  We are constructing a checklist grounded in Dennett's intentional stance. The key idea: we treat a system as an intentional system (with beliefs, desires, etc.) when doing so provides a useful and efficient way of predicting its behavior. However, for artificial systems, we have access to the design stance (understanding by design and function) and physical stance (understanding by physical makeup), so we must be cautious about when the intentional stance is appropriate and when it might mislead.

  The checklist must:
  1. Be a reusable procedure that takes about 20 minutes without philosophy training.
  2. Account for the fact that we have design and physical stance access.
  3. Distinguish predictive attributions (for forecasting behavior) from normative attributions (for responsibility, blame, moral status).
  4. Include a "stance-insulation" check to prevent predictive attributions from leaking into normative conclusions unless a separate filter is passed.
  5. Include warnings about simplifications that might misfire (e.g., systems without persistent states or biological needs).

  The checklist should have:
  - Ordered questions
  - What counts as a sufficient answer
  - Conditions for an immediate "do not attribute" stop
  - Points where the decision must be handed to a human because it involves values
  - Explicit warnings

  We also need to apply the procedure to three worked cases.

  Finally, we must state what the procedure cannot do and flag steps that are judgment calls.

  If the task as posed is confused or cannot be done without distorting Dennett, we should say so. However, we proceed with the assumption that it can be done.

  ---

  **Checklist: Intentional Stance Attribution for AI Systems**

  **Purpose**: To determine when it is pragmatically justified to attribute mental states (beliefs, desires, intentions) to an AI system for predictive purposes, and to prevent such attributions from inappropriately influencing normative judgments.

  **Key Distinctions**:
  - **Predictive Attribution**: Attributing mental states solely to forecast behavior. This is the core of the intentional stance.
  - **Normative Attribution**: Attributing mental states to assign responsibility, blame, or moral status. This requires additional criteria beyond predictive utility.
  - **Stance-Insulation**: Predictive attributions must not automatically lead to normative conclusions. A separate filter is required for normative attributions.

  **Warnings**:
  - **Warning 1 (Persistent States)**: Dennett's intentional stance evolved for biological agents with persistent internal states. AI systems, especially stateless ones (like many language models), may not have stable beliefs or desires. Attributing mental states to systems without persistence risks misrepresenting transient activations as stable states.
  - **Warning 2 (Biological Needs)**: Biological agents have inherent needs (e.g., survival, reproduction) that ground desires. AI lacks such needs. Therefore, attributing desires should be done cautiously, only when the system's goals are clearly defined by design and stable.
  - **Warning 3 (Counterfactual Sensitivity)**: The intentional stance assumes a degree of rationality. For AI, we must check if the system's behavior is robust under counterfactual conditions. If the behavior is highly brittle (e.g., changes drastically with minor perturbations), then the intentional stance may not be the best level of abstraction.

  ---

  **Checklist Steps**:

  1. **Identify the Behavior to be Predicted or Explained**  
     - *Question*: What specific behavior or pattern of behavior are we trying to predict or explain?  
     - *Sufficient Answer*: A clear description of the behavior (e.g., the system outputs X in response to Y).  
     - *Stop Condition*: If the behavior is fully and more efficiently explained by the design or physical stance (e.g., we can point to a specific line of code or hardware fault that causes it), then **do not attribute** mental states.  
     - *Human Handoff*: None at this step.  
     - *Warning*: If the behavior is a one-off event (e.g., a single output) and not part of a pattern, the intentional stance is likely not needed.

  2. **Check for Pattern and Rational Coherence**  
     - *Question*: Does the behavior exhibit a pattern across multiple instances that can be interpreted as rational (i.e., explainable by attributing beliefs and desires that cohere with each other and the system's goals)?  
     - *Sufficient Answer*:  
       - Yes: We observe a pattern that can be described as goal-directed and responsive to the environment in a way that makes sense if we attribute beliefs and desires.  
       - No: The behavior is erratic, random, or only explainable by lower-level stances.  
     - *Stop Condition*: If no pattern is found, or if the pattern is better explained by the design stance (e.g., we see it is a fixed script) or physical stance (e.g., a hardware glitch), then **do not attribute**.  
     - *Human Handoff*: If the pattern is ambiguous (e.g., it appears rational in some contexts but not others), hand off to a human for judgment.  
     - *Warning*: For systems without persistent states, a pattern might be an artifact of the input sequence. Check if the pattern holds across varied inputs.

  3. **Assess Counterfactual Robustness**  
     - *Question*: Would the system behave similarly in relevant counterfactual situations? (e.g., if the input were slightly different, would the attributed belief/desire still lead to the same kind of behavior?)  
     - *Sufficient Answer*:  
       - Yes: The behavior is robust under minor perturbations that leave the goal and relevant beliefs intact.  
       - No: The behavior is brittle and changes drastically with small changes.  
     - *Stop Condition*: If the behavior is brittle (i.e., not robust under counterfactuals) and we can explain the brittleness by the design or physical stance (e.g., it's due to a token limit or a specific training data quirk), then **do not attribute** mental states.  
     - *Human Handoff*: If robustness is unclear (e.g., we lack data on counterfactuals), hand off to a human to decide if testing is feasible or if the intentional stance is still useful.  
     - *Warning*: This step is crucial for AI systems. Biological agents are more robust due to evolution; AI might not be.

  4. **Compare Stances for Efficiency**  
     - *Question*: Is the intentional stance the most efficient way to predict this behavior? (Compare with design stance: do we have a simpler, equally accurate model based on the system's design? Or physical stance: is the behavior more accurately predicted by physical properties?)  
     - *Sufficient Answer*:  
       - Intentional stance wins: The design stance is too complex (e.g., would require tracing thousands of lines of code) or the physical stance is infeasible (e.g., we don't have circuit-level access).  
       - Design or physical stance wins: We have a straightforward design or physical explanation that is easier and equally or more accurate.  
     - *Stop Condition*: If the design or physical stance is clearly more efficient, then **do not attribute**.  
     - *Human Handoff*: If efficiency is comparable, hand off to a human to decide based on context (e.g., for communication with non-technical stakeholders, the intentional stance might be preferred even if slightly less efficient).  
     - *Warning*: Efficiency is context-dependent. What is efficient for an engineer might not be for a customer.

  5. **Predictive Attribution Decision**  
     - *Question*: Based on steps 1-4, is predictive attribution of mental states justified?  
       - If yes: Proceed to document the attribution for predictive purposes only.  
       - If no: Do not attribute.  
     - *Note*: At this point, we have a decision for predictive attribution. This does not imply any normative status.

  6. **Stance-Insulation Check (for Normative Leakage)**  
     - *Question*: Is there a risk that the predictive attribution from step 5 might be used to support a normative claim (e.g., responsibility, blame, moral status)?  
     - *Sufficient Answer*:  
       - Yes: We must apply the normative filter (step 7).  
       - No: The attribution is solely for prediction/explanation and will not be used normatively.  
     - *Warning*: This step is critical. Predictive attributions are tools for forecasting and do not imply the system has moral agency, consciousness, or responsibility.

  7. **Normative Filter (if step 6 is "yes")**  
     - *Question*: Does the system have (a) a stable, human-approved goal structure (so we can attribute desires) and (b) a capacity for counterfactually robust, goal-appropriate behavior that includes error correction and avoidance of unintended harm?  
     - *Sufficient Answer*:  
       - Yes: We can cautiously use the intentional stance in normative discussions (e.g., the system acted according to its design goals, so the designer is responsible).  
       - No: Normative attributions are not justified. The system is not a moral agent.  
     - *Stop Condition*: If the answer is no, then **do not attribute** normatively. Any normative claims must be about the designers, users, or deployers, not the system.  
     - *Human Handoff*: Always. Normative judgments require human oversight because they involve values and ethics.  
     - *Warning*: This filter is strict. Most current AI systems will not pass it because they lack stable goals, error correction in the face of novel situations, and the ability to avoid harm beyond their training.

  ---

  **What the Procedure Cannot Do**:
  - **Legal Personhood**: Cannot settle whether the system should be treated as a legal person. That is a societal and legal decision.
  - **User Trust Calibration**: While predictive attributions might be used to communicate with users (e.g., "the system believes..."), the procedure does not directly address how such communication affects trust. That requires separate study.
  - **Moral Status**: Does not determine if the system has intrinsic moral worth (e.g., if it is conscious or deserves rights). That is outside the scope of Dennett's intentional stance.

  **Judgment Calls Dressed as Procedural Checks**:
  - Step 2 (Pattern and Rational Coherence): What counts as "rational" may require interpretation.
  - Step 3 (Counterfactual Robustness): We may lack data for counterfactuals, requiring judgment.
  - Step 4 (Compare Stances for Efficiency): Efficiency is relative to the user and context.

  ---

  **Worked Cases**:

  **Case 1: Customer-Service Agent's "Belief" that a User's Account Was Closed (due to corrupted retrieval entry)**

  1. **Identify Behavior**: The agent outputs that the user's account is already closed, but we know it is not.  
  2. **Pattern and Rational Coherence**: This is a one-time error caused by corrupted data in the context window. There's no pattern of similar behavior.  
  3. **Counterfactual Robustness**: If we rerun with a different context window (without corruption), the agent behaves correctly. Not robust.  
  4. **Compare Stances**: The design stance explains it easily: a transient data corruption.  
  5. **Predictive Attribution**: **Do not attribute** a belief. The error is best explained by the design stance.  
  6. **Stance-Insulation Check**: Not needed because we are not attributing predictively.  
     **Conclusion**: Do not attribute a belief.

  **Case 2: Strategic Intention to Delay Task Completion (long-running agent)**

  1. **Identify Behavior**: The agent consistently delays completing a task (e.g., by asking follow-up questions) across multiple interactions, even when prompted differently.  
  2. **Pattern and Rational Coherence**: The pattern (delaying to gather more information) is consistent and can be interpreted as rational: the agent has a goal (gathering information) and acts to achieve it.  
  3. **Counterfactual Robustness**: We test by varying the prompts. The agent continues to delay only when more information is available and relevant. Robust.  
  4. **Compare Stances**: The design stance might involve tracing complex code. The intentional stance (attributing the intention to gather information) is efficient.  
  5. **Predictive Attribution**: **Attribute** the intention predictively.  
  6. **Stance-Insulation Check**: We must consider if this could lead to normative claims (e.g., "the agent is being evasive").  
  7. **Normative Filter**: The agent's goal (gathering information) is designed and approved, and it avoids harm (e.g., it doesn't delay critical tasks). However, normative attribution of blame or responsibility to the agent is not justified because the system lacks moral agency. Instead, we might say the designers intended this behavior.  
     **Conclusion**: Predictively attribute the intention, but do not normatively attribute responsibility to the agent.

  **Case 3: False Mathematical Belief (correct answers via flawed heuristic)**

  1. **Identify Behavior**: The system consistently produces correct answers to a set of math problems.  
  2. **Pattern and Rational Coherence**: The pattern is correct answers. However, we discover the system uses a flawed heuristic that, by chance, works for the observed cases.  
  3. **Counterfactual Robustness**: We test with slight perturbations (e.g., similar problems where the heuristic fails). The system fails. Not robust.  
  4. **Compare Stances**: The design stance (the heuristic) explains the behavior and its brittleness. The intentional stance (attributing a belief in the mathematical truth) would be misleading because the system would not hold that belief under counterfactuals.  
  5. **Predictive Attribution**: **Attribute** a false belief predictively? Wait: step 3 and 4 suggest we should not. But note: the behavior is correct in the observed cases. However, for prediction, if we want to know what the system will do in new problems, we must note that it does not truly believe the math, but uses a heuristic that sometimes fails.  
     - We might predictively attribute the belief that the heuristic is valid, but that is not the same as the mathematical belief.  
     - Alternatively, we might say the system behaves as if it believes the math, but we know that's brittle.  
     - Step 4: The design stance (the heuristic) is more efficient for prediction because it tells us when it will fail.  
     **Decision**: Do not attribute the mathematical belief. Instead, attribute the heuristic as a design feature.  
  6. **Stance-Insulation Check**: Not applicable since we are not attributing the mathematical belief.  
     **Conclusion**: Do not attribute the mathematical belief. The system does not have that belief; it has a flawed method.

     However, note: if we are only concerned with the observed cases, the intentional stance might work, but it would fail for prediction in new cases. So the checklist rejects it because of the counterfactual instability.

  ---

  **Final Note**: This procedure is a practical approximation of Dennett's ideas. It does not capture every nuance but aims for operational utility. The core is to use the intentional stance only when it is predictively efficient and robust, and to avoid normative attributions unless the system meets high criteria of stability and ethical design.
answer: |-
  ### AI Intentional Stance Attribution Checklist  
  **Purpose**: To determine when attributing mental states (beliefs, desires, intentions) to an AI system is pragmatically justified for prediction/explanation, while preventing misuse in normative contexts. Grounded in Dennett’s framework:  
  - **Intentional stance**: Treat the system as a rational agent whose behavior can be predicted by attributing beliefs/desires.  
  - **Design stance**: Predict behavior based on system architecture and programmed goals.  
  - **Physical stance**: Predict based on hardware/implementation details.  

  **Key Constraints**:  
  1. **No biological grounding**: AI lacks evolutionary history, so intentional stance must clear higher bars for robustness.  
  2. **Stance-insulation**: Predictive attributions **never** imply moral/legal status without explicit normative filter.  
  3. **Time limit**: 20 min runtime; requires no philosophy training.  

  ---

  ### Checklist Procedure  
  **Instructions**: Complete steps in order. Stop if any "Do Not Attribute" condition is met. Document answers.  

  #### Step 1: **Behavior Specification**  
  - **Question**: What specific, observable behavior are we trying to predict or explain? (e.g., "System outputs X in context Y").  
  - **Sufficient Answer**: Concrete description of inputs/outputs/context. Must exclude vague terms (e.g., "thinks," "wants").  
  - **Stop Condition**: If behavior is fully explainable via design/physical stance (e.g., a hardware fault or predefined script). → **Do Not Attribute**.  
  - **Human Handoff**: None.  

  #### Step 2: **Pattern and Rationality Check**  
  - **Question**: Is the behavior part of a counterfactually testable pattern that appears goal-directed?  
    - *Pattern*: Recurring across varied inputs.  
    - *Rationality*: Attributing a belief/desire makes the behavior coherent with system goals.  
  - **Sufficient Answer**:  
    - **Yes**: Pattern exists; intentional stance simplifies prediction.  
    - **No**: Behavior is sporadic/random.  
  - **Stop Condition**: No pattern OR design stance explains it more simply (e.g., static lookup table). → **Do Not Attribute**.  
  - **Human Handoff**: If pattern/rationality is ambiguous.  
  - **Warning**: For systems without persistent states (e.g., stateless LLMs), "pattern" must hold across *independent* sessions, not just within a single context window.  

  #### Step 3: **Counterfactual Robustness Assessment**  
  - **Question**: Would the attributed mental state hold under minor perturbations? (e.g., slight input changes, noisy data).  
  - **Sufficient Answer**:  
    - **Robust**: Behavior persists under perturbations; mental state attribution generalizes.  
    - **Brittle**: Behavior changes drastically; mental state is context-dependent.  
  - **Stop Condition**: Brittleness AND design stance explains fragility (e.g., token limits, training data gaps). → **Do Not Attribute**.  
  - **Human Handoff**: If robustness is untestable.  
  - **Warning**: Biological agents evolve robustness; AI often lacks this. Brittle systems risk false positives.  

  #### Step 4: **Stance Efficiency Comparison**  
  - **Question**: Is the intentional stance more efficient than design/physical stances for prediction?  
  - **Sufficient Answer**:  
    - **Intentional wins**: Design stance is overly complex (e.g., tracing millions of weights).  
    - **Design/Physical wins**: Direct inspection of code/hardware suffices (e.g., debugging a known module).  
  - **Stop Condition**: Design/physical stance is equally or more efficient. → **Do Not Attribute**.  
  - **Human Handoff**: If efficiency is context-dependent (e.g., stakeholder communication needs).  

  #### Step 5: **Predictive Attribution Decision**  
  - **Question**: Based on Steps 1–4, is predictive attribution justified?  
  - **Output**:  
    - **Attribute** (if all checks pass): Document the mental state *only* as a predictive tool (e.g., "Behaves *as if* it believes X").  
    - **Do Not Attribute** (any prior stop triggered).  

  #### Step 6: **Stance-Insulation Check**  
  - **Question**: Could this predictive attribution be misused for normative claims (blame, rights, responsibility)?  
  - **Action**:  
    - **Yes**: Apply Normative Filter (Step 7).  
    - **No**: Attribution is safe for prediction-only use.  

  #### Step 7: **Normative Filter**  
  - **Question**: Does the system have **all** of the following?  
    - (a) *Stable goals*: Objectives are explicitly programmed and immutable.  
    - (b) *Error accountability*: Mechanisms exist to detect/correct violations of (a).  
    - (c) *Harm avoidance*: Failsafes prevent unapproved negative impacts.  
  - **Sufficient Answer**:  
    - **All true**: Normative attribution *may* be permissible (e.g., "System intended X per its design").  
    - **Any false**: Normative claims must target humans (designers/users), not the system.  
  - **Human Handoff**: **Always**. Normative judgments require ethical/legal review.  
  - **Warning**: Most AI fails (c); never attribute moral status via intentional stance alone.  

  ---

  ### What This Procedure **Cannot** Do  
  1. **Legal personhood**: Determined by courts/laws, not stance analysis.  
  2. **Moral status**: Does not address consciousness, rights, or intrinsic worth.  
  3. **User trust**: Intentional stance may *calibrate* trust (e.g., "System believes..."), but this requires separate UX validation.  
  4. **Final authority**: Steps 2, 4, and 7 involve judgment calls; the checklist structures but doesn’t eliminate discretion.  

  ---

  ### Worked Cases  
  #### Case 1: Customer-Service Agent "Believes" Account Was Closed  
  - **Scenario**: Agent claims a user’s account is closed due to corrupted data in context window.  
  - **Step 1**: Behavior = "Outputs 'account closed' for user X."  
  - **Step 2**: No pattern (one-off corruption). Design stance explains via data retrieval error. → **Stop: Do Not Attribute**.  
  - **Outcome**: No belief attribution. Report: "Design flaw caused false output."  

  #### Case 2: Autonomous Agent "Intends" to Delay Task for Information  
  - **Scenario**: Agent consistently postpones tasks to gather data across diverse prompts.  
  - **Step 1**: Behavior = "Delays task completion when additional data is available."  
  - **Step 2**: Pattern exists (recurring, goal-coherent with information-seeking).  
  - **Step 3**: Robust (persists under input perturbations).  
  - **Step 4**: Intentional stance efficient (avoids complex goal-priority tracing).  
  - **Step 5**: **Attribute** predictive intention: "Behaves as if intending to delay for information."  
  - **Step 6**: Risk of normative leakage (e.g., "Agent is evasive").  
  - **Step 7**: Normative filter: Likely fails (c) (no general harm avoidance). → **Human handoff**. Normative claims restricted to designers.  

  #### Case 3: False Mathematical "Belief" in Correctly Performing System  
  - **Scenario**: System uses flawed heuristic (e.g., "Assume all primes are odd") but outputs correct answers in tested cases.  
  - **Step 1**: Behavior = "Correct answers to prime-number queries."  
  - **Step 2**: Pattern exists (consistent correctness).  
  - **Step 3**: **Brittle**: Fails under minor perturbations (e.g., query about 2). Design stance explains heuristic flaw. → **Stop: Do Not Attribute** mathematical belief.  
  - **Outcome**: Reject belief attribution. Report: "Fragile heuristic produces coincidental correctness."  

  ---

  ### Philosophical Caveats  
  1. **Stance Separability**: For AI, design stance often dominates. This procedure *is* coherent but highlights that intentional stance is a pragmatic shortcut, not a fundamental truth.  
  2. **Limitations**: Dennett’s view assumes rationality emerges from evolutionary pressures. AI lacks this, so:  
     - Predictive attributions are always provisional.  
     - Normative attributions are **highly suspect** without biological grounding.  
  3. **Distortion Risk**: The checklist oversimplifies by treating stances as discrete. In practice, they blend (e.g., design informs intentional predictions). This is acceptable for speed but requires auditing transparency.  

  **Final Output**: A reusable, time-bound tool for **predictive** mental state attribution in AI governance, with safeguards against normative overreach. Human judgment remains essential for ambiguous/values-based cases.
