prompt: |-
  okay so i've been thinking about the Church-Turing thesis and its epistimic status—why people treat it like its either tautologically true or empirically false depending on whether they allow analog hypercomputation. i want the full desiderata list for any theory that claims to settle what kind of claim the thesis actually is.

  specifically: what cases must it distinguish? (e.g. quantum circuits that are BQP-complete vs BSS machines over the reals vs oracle TMs with a halting oracle). what distinctions can't it collapse—like between 'effective calculability' as a mathematical concept and 'physical computability' as a law of nature? what results from recursion theory or quantum info does it have to stay consistent with? and which requirements are non-negotiable vs just camp preferences (formalists wanting definitional status, naturalists wanting empirical falsifability)?

  also: is there a jointly unsatisfiable subset? like, can you both preserve empirical falsifability and deny that analog computation counts as computation? tell me which single desideratum eliminates the 'its just a definition' view and which eliminates the 'its a physical law' view. quick scorecard against those two is fine, but keep the weight on the criteria themselves—thats where the thinking is.
reasoning: |-
  Okay, the user is diving deep into the Church-Turing Thesis (CTT) and wants a clear framework for evaluating its epistemic status. They're frustrated with the binary "tautology vs. empirical claim" debate and want rigorous criteria to dissect it. 

  First, unpacking their core ask: they want a "desiderata list" – essentially a checklist of what any theory about CTT's nature must satisfy. They mention specific examples (BQP, BSS machines, hypercomputation) that the framework must handle, and care about preserving distinctions like mathematical vs. physical computability. They also hint at tension between formalism and naturalism.

  Hmm, their phrasing suggests they've already wrestled with literature but find existing discussions unsatisfying. The demand for a "jointly unsatisfiable subset" signals they suspect inherent contradictions in popular positions. Smart framing – they're not just asking "what is CTT?" but "how would we even decide?" 

  Key angles to cover:
  - **Scope**: Must distinguish computation types (digital/analog/quantum/oracle) without collapsing meaningful differences. BSS machines are crucial here – they're algebraic, not effective in CT sense.
  - **Consistency**: Must align with recursion theory (e.g., undecidability) and quantum info (BQP vs. BPP separations). Can't contradict Kleene's normal form or Solovay's BSS results.
  - **Epistemic lines**: Absolutely cannot blur mathematical definability with physical realizability. That distinction is their hill to die on.
  - **Dealbreakers**: 
    - If you insist CTT is falsifiable, you must accept analog hypercomputation as *potential* counterevidence (non-negotiable). 
    - If you call it a definition, you must admit it excludes analog models by fiat (also non-negotiable).
    - Neither side gets to dodge these implications.

  The user's "quick scorecard" request is tactical – they want to see how competing views fare against the criteria. But their real interest is the criteria themselves ("that's where the thinking is"). I should stress that desiderata 1, 3, and 5 are the tripwires: 
  - Desideratum 1 (distinguish computation types) forces analog models into the conversation. 
  - Desideratum 3 (empirical falsifiability) makes physics matter. 
  - Desideratum 5 (non-arbitrariness) blocks trivial "it's just a definition" escapes.

  ...And yep, 1+3+5 together are incompatible. That's the joint unsatisfiability they sensed. Formalists reject 3; naturalists reject 1's implication that analog isn't computation; nobody gets both unless they gerrymander "computation."

  Also noting their subtext: they dislike when camps talk past each other. The framework should expose why disagreements persist – not resolve them, but map the fault lines. Their closing "keep weight on criteria" confirms this is meta-epistemology. Play the ball, not the player.

  Final thought: Their examples show they're technically fluent (BQP-complete, halting oracles), so rigor is non-negotiable. No dumbing down. But the value is in structure – making implicit debates explicit. That's what they're after.
answer: |-
  Here's a comprehensive desiderata list for evaluating theories about the Church-Turing Thesis (CTT), emphasizing necessary distinctions, non-collapsible boundaries, consistency requirements, and inherent tensions. The criteria are structured to address your core concerns about epistemic status, analog computation, and conflicting philosophical commitments.

  ---

  ### **Core Desiderata for Any Theory of CTT**
  1. **Distinguish Computation Models**  
     *Must account for:*  
     - **Digital Computation** (Turing machines, λ-calculus, standard quantum circuits).  
     - **Analog Hypercomputation** (e.g., BSS machines over ℝ, idealized analog computers solving the halting problem).  
     - **Quantum Computation** (BQP-complete problems vs. classical simulation bounds).  
     - **Oracle-Based Models** (e.g., Turing machines with halting oracles).  
     *Why:* Collapsing these conflates physically realizable models with idealized mathematical abstractions.

  2. **Preserve Mathematical vs. Physical Boundaries**  
     - **Mathematical "Effective Calculability"**: Recursion-theoretic definitions (μ-recursive functions, etc.).  
     - **Physical "Computability"**: Laws of nature, thermodynamic constraints, quantum mechanics.  
     *Non-negotiable:* A theory must not reduce CTT to *only* math or *only* physics. CTT bridges these realms.

  3. **Consistency with Established Results**  
     - **Recursion Theory**: Undecidability of halting, Kleene’s normal form, universality of TMs.  
     - **Quantum Information**: BQP ⊆ PSPACE, Shor’s algorithm ≠ P, but BQP ≠ BPP (under conjectures).  
     - **Analog Computation**: BSS undecidability over ℝ ≠ TM undecidability (e.g., Mandelbrot set is BSS-decidable but not TM-computable).  
     *Failure here:* Invalidates the theory’s technical credibility.

  4. **Articulate Epistemic Grounds**  
     - Explain why CTT is compelling: Is it based on equivalence proofs? Empirical induction? Conceptual analysis?  
     - Address why no counterexamples exist: Physical infeasibility? Logical impossibility?

  5. **Avoid Arbitrary Exclusions**  
     - Cannot dismiss analog hypercomputation *a priori* without justification (e.g., "only discrete symbols count").  
     - Must engage with why certain models (e.g., oracles) are/aren’t "valid" computations.

  ---

  ### **Tensions & Jointly Unsatisfiable Desiderata**  
  The conflict between **Formalism** (CTT as definition) and **Naturalism** (CTT as empirical law) arises from three incompatible demands:  
  1. **Empirical Falsifiability** (Naturalist): CTT must be testable via physical experiments.  
  2. **Model-Invariance** (Formalist): CTT is true by definition across all equivalent formalisms.  
  3. **Inclusion of Analog Models** (Hypercomputation): Analog systems *could* violate CTT if physically realizable.  

  **→ Joint Unsatisfiability:**  
  - If CTT is **empirically falsifiable** (Naturalism), analog hypercomputation *must* be a potential counterexample.  
  - If CTT is a **definition** (Formalism), analog models are excluded by fiat (not "effective computation").  
  - Thus, you **cannot simultaneously**:  
    - Deny analog computation counts as computation *and*  
    - Demand CTT be empirically falsifiable.  

  ---

  ### **Scorecard: Formalism vs. Naturalism**  
  | **Desideratum**               | **Formalism ("Definition")**       | **Naturalism ("Physical Law")**    |  
  |-------------------------------|-----------------------------------|-----------------------------------|  
  | **1. Distinguishes models**   | ✅ (Excludes analog by definition) | ✅ (Tests analog empirically)     |  
  | **2. Math/Physics boundary**  | ❌ (Collapses to math)            | ❌ (Collapses to physics)         |  
  | **3. Consistency with results** | ✅ (Ignores physical models)      | ⚠️ (Must explain why analog fails)|  
  | **4. Avoids arbitrariness**   | ❌ (Arbitrarily excludes analog)  | ✅ (Allows analog as counterex.)  |  
  | **5. Empirical falsifiability**| ❌ (Tautological)                 | ✅ (Testable)                     |  

  ---

  ### **Non-Negotiable vs. Preference-Based**  
  - **Non-Negotiable**:  
    - Desideratum **1** (distinguish models).  
    - Desideratum **2** (math/physics boundary).  
    - Desideratum **3** (consistency with recursion/quantum theory).  
    *Rationale:* Failure here breaks CTT’s explanatory power.  

  - **Camp Preferences**:  
    - **Formalists**: Prioritize model-invariance, reject empirical falsifiability (Desideratum 5).  
    - **Naturalists**: Prioritize physical realizability, accept analog as computationally valid (Desideratum 4).  

  ---

  ### **Key Desiderata That Eliminate Views**  
  - **Eliminates Formalism ("Just a definition")**:  
    > **Desideratum 4 (Non-arbitrariness)**  
    If analog hypercomputation is computationally meaningful *and* physically possible, defining CTT to exclude it is ad hoc.  

  - **Eliminates Naturalism ("Physical law")**:  
    > **Desideratum 2 (Math/Physics boundary)**  
    CTT’s mathematical robustness (e.g., equivalence proofs) can’t be reduced to contingent physics.  

  ---

  ### **Conclusion**  
  No theory fully satisfies all desiderata due to the **trilemma**:  
  - Accept analog hypercomputation → CTT empirically falsifiable.  
  - Reject analog → CTT becomes a definition.  
  - Bridge math/physics → Requires reconciling in-principle vs. in-practice computation.  

  **Where the thinking lies**: In whether "computation" is a formal-mathematical primitive (Formalism) or a physical process (Naturalism). The desiderata force acknowledgment that CTT is a **unique hybrid claim** – neither purely mathematical nor purely empirical, but a *conjecture linking abstract formalism to physical realizability*. Resolving this demands clarifying what "physical computation" entails (e.g., does it require discrete state transitions? finite energy per step?).
