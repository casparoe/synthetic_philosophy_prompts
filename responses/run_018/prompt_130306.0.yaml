prompt: |-
  I work as a governance mediator for multi-generational family enterprises, running 90-minute sessions where family roles and corporate roles collide. Conflicts here are rarely contractual; they involve overlapping obligations—parent and child, elder and younger sibling, founder and successor, employer and kin—that Confucian role ethics treats as constitutive rather than derived from universal rules. But modern family firms create interstitial roles that sit between the classic five relationships: a founder’s spouse with no formal office but with family authority, or an adopted child who is also a senior executive. I need a reusable decision procedure I can run without philosophical training.

  Design the procedure. It must include: a role-mapping step that identifies active classic relational roles and flags interstitial ones; a proximity-based priority rule modified by a rectification check—if one party has systematically corrupted the obligations of a role (treating a child solely as an employee, for example), obligations in that role are suspended and resolution shifts to the intact roles; a cross-domain conflict step for clashes between family obligation and fiduciary duty, with explicit stopping points where the answer is a value judgment the mediator must not impose; and clear markers of where judgment is unavoidable and where the procedure will misfire.

  Then apply it to three cases: (1) a founder wants to appoint an unqualified child as COO over the objection of an elder sibling who is VP; (2) a senior non-family executive is pressured to conceal a family member’s financial error, with loyalty obligations invoked; and (3) one case where the procedure protects institutional integrity at the cost of family harmony—an answer the mediator will not want to deliver. Do not include citations, bibliographies, or reading lists.
reasoning: |-
  We are designing a reusable decision procedure for governance mediation in multi-generational family enterprises, rooted in Confucian role ethics but accounting for modern interstitial roles. The procedure has four main components:

  1. **Role-Mapping Step**: Identify the active classic Confucian relationships (ruler-subject, father-son, husband-wife, elder-younger sibling, friend-friend) and flag any interstitial roles (e.g., founder's spouse without formal office, adopted child who is an executive).

  2. **Proximity-Based Priority Rule with Rectification Check**: 
     - **Priority Rule**: In case of conflict, obligations in closer relationships (e.g., parent-child) take precedence over more distant ones (e.g., employer-employee). 
     - **Rectification Check**: If one party has systematically corrupted the obligations of a role (e.g., treating a child solely as an employee and neglecting parental duties), then obligations in that corrupted role are suspended. Resolution shifts to the intact roles.

  3. **Cross-Domain Conflict Step**: For clashes between family obligation and fiduciary duty:
     - Identify the conflict as being between two distinct domains (family vs. corporate).
     - Define explicit stopping points where the answer becomes a value judgment that the mediator must not impose. At these points, the mediator's role is to clarify the trade-offs and facilitate the family's own decision.

  4. **Markers of Unavoidable Judgment and Procedure Misfires**: 
     - Clearly indicate where the procedure requires a value judgment (and thus the mediator must not decide but only facilitate).
     - Flag situations where the procedure might misfire (e.g., when roles are so corrupted that no intact roles remain, or when interstitial roles create unresolvable ambiguity).

  ### The Decision Procedure

  **Step 1: Role Mapping**
     - For each party in the conflict, list their classic Confucian roles (if any) and note any interstitial roles.
     - Example: In a dispute between a founder (father) and his child (who is also an employee), the classic roles are father-son and ruler-subject (employer-employee). The child has an interstitial role as both family member and employee.

  **Step 2: Proximity Priority with Rectification**
     - Apply the proximity rule: family roles (like parent-child) are closer than corporate roles (employer-employee). Thus, family obligations take priority unless rectification applies.
     - **Rectification Check**: For each role, check if one party has systematically failed in their role obligations (e.g., a parent who has consistently treated their child only as an employee, ignoring parental care). If so, that role is corrupted and its obligations are suspended. Resolution must then rely on other intact roles.
     - If a role is suspended, the conflict is reframed without that role's obligations.

  **Step 3: Cross-Domain Conflict Resolution**
     - When a conflict arises between family obligation and fiduciary duty (e.g., loyalty to family vs. duty to the company):
       - Clearly state the conflict as a trade-off between two legitimate domains.
       - Identify the stopping point: the mediator must not impose a resolution. Instead, the mediator presents the trade-off and asks the parties to make a value-based decision.
       - The mediator may help by outlining potential consequences for both family harmony and corporate health.

  **Step 4: Judgment Markers and Misfire Warnings**
     - **Judgment Required**: At stopping points in Step 3, and whenever rectification is claimed (because determining systematic corruption requires judgment).
     - **Misfire Warnings**: The procedure may misfire when:
          - There are no intact roles (all relevant roles are corrupted).
          - Interstitial roles are so complex that they cannot be mapped to any priority.
          - Parties are unwilling to accept the rectification assessment or the priority rule.

  ### Application to Cases

  **Case 1: Founder wants to appoint unqualified child as COO over elder sibling (VP) objection.**
  - **Step 1 (Role Mapping)**:
     - Founder: Father (to both), Founder (ruler). 
     - Child (to be COO): Son (to founder), younger brother (to elder sibling), employee.
     - Elder sibling: Daughter (to founder), elder sister (to younger brother), VP (employee).
     - Interstitial: Founder is also employer and father. The elder sibling is both child and VP.

  - **Step 2 (Proximity with Rectification)**:
     - Conflict: Father's wish to appoint son vs. elder daughter's objection as VP.
     - Priority: The father-son and father-daughter relationships are primary. However, the founder also has a ruler (employer) role to the company.
     - Rectification Check: 
          - If the founder has consistently treated his children only as employees (ignoring family bonds), then the father role might be suspended. But typically, the father role is active.
          - If the founder is favoring the son without regard to the daughter's feelings and the company's welfare, that might be a corruption of the father role (which requires care for all children) and the ruler role (which requires merit-based appointments). 
          - However, the elder sibling (as VP) has a fiduciary duty to object if the appointment harms the company.

     - Since the founder is trying to use his father role to override corporate duty, we must check if the father role is being corrupted by ignoring the well-being of the company (which affects all family members) and the daughter's rightful place as elder sibling. If so, the father role obligations in this decision are suspended, and we shift to the ruler-subject role (corporate hierarchy) and the elder-younger sibling role.

     - Without rectification, the father's authority in family matters would normally take precedence. But the corporate role (ruler-subject) requires that appointments be based on competence. The elder sibling as VP has a duty to object. The conflict thus becomes a cross-domain one.

  - **Step 3 (Cross-Domain Conflict)**:
     - The conflict is between the father's family wish (to benefit the son) and the fiduciary duty to the company (to appoint a qualified COO). 
     - Stopping Point: The mediator must not decide. The mediator should explain the trade-off: appointing the unqualified son may damage the company and create resentment (harming family harmony in the long run), but overriding the father may damage family hierarchy. The family must make the value judgment: prioritize family harmony (by accepting the appointment) or corporate integrity (by rejecting it).

  - **Step 4 (Judgment and Misfire)**:
     - Judgment required: The rectification check (if the father role is corrupted) and the cross-domain trade-off require the family's judgment.
     - Misfire possible: If the founder insists on his absolute authority as father and ruler, and the elder sibling refuses to yield, the procedure may not resolve the conflict.

  **Case 2: Senior non-family executive pressured to conceal a family member's financial error, with loyalty obligations invoked.**
  - **Step 1 (Role Mapping)**:
     - Senior executive: Non-family, so no classic family role. Role: employee (ruler-subject, where the ruler is the company/family in charge).
     - Family member: Employee (if working in the company) and family member. They may have invoked a loyalty obligation that is interstitial (like a quasi-family bond).
     - Interstitial: The family member is invoking a loyalty obligation that is not a classic Confucian role (since the executive is not family). This is an interstitial role of "adopted" loyalty.

  - **Step 2 (Proximity with Rectification)**:
     - The executive has no family role. The classic role is ruler-subject (employer-employee). The family member is trying to create an interstitial loyalty bond.
     - Priority: Without a true family bond, the fiduciary duty (ruler-subject) takes precedence. The interstitial role (loyalty) is not a classic role and thus has lower priority.
     - Rectification Check: Is the family member corrupting their role? By asking to conceal an error, they are violating their duty as an employee and as a family member (who should care for the company). Thus, the family member's employee role is corrupted. The executive should not comply.

     - However, if the executive has been treated as "family" in the past (e.g., included in family events, given special trust), then there might be an interstitial role. But even then, the primary duty is to the company.

  - **Step 3 (Cross-Domain Conflict)**:
     - The conflict is between a loyalty obligation (interstitial) and fiduciary duty. 
     - Stopping Point: The mediator must not impose. The trade-off: concealing the error may protect the family member in the short term but harm the company and ultimately the family. The executive must decide based on their professional ethics, but the mediator can clarify the consequences.

  - **Step 4 (Judgment and Misfire)**:
     - Judgment: The mediator must help the executive and family see the consequences. The family must decide if they want to pressure the executive (risking his resignation and company reputation). 
     - Misfire: If the family denies the corruption in their request, or if the executive feels torn by long-standing interstitial bonds.

  **Case 3: Protecting institutional integrity at the cost of family harmony (an answer the mediator will not want to deliver)**
  - Let us create a case: A family member (son) has been embezzling funds. The founder (father) wants to cover it up to protect the family name and harmony. The non-family CFO insists on reporting to the board and authorities.

  - **Step 1 (Role Mapping)**:
     - Founder: Father, ruler (employer).
     - Son: Child, employee (if he works in the company).
     - CFO: Non-family, employee (ruler-subject).

  - **Step 2 (Proximity with Rectification)**:
     - Rectification Check: The son has corrupted his roles (both as child and employee). The father, by wanting to cover up, is corrupting his ruler role (fiduciary duty) and also his father role (which should involve teaching the son to take responsibility). 
     - Thus, the father's ruler role obligations are suspended (because he is not acting as a proper ruler) and the father role is also corrupted (because he is enabling wrongdoing). 
     - We must then rely on the intact roles: the CFO's fiduciary duty and the son's obligation to face consequences (which is not a role obligation but a legal/moral one).

  - **Step 3 (Cross-Domain Conflict)**:
     - The conflict is between family harmony (cover-up) and institutional integrity (reporting). 
     - Stopping Point: The mediator must not impose. However, the rectification step has suspended the father's roles. Thus, the mediator must point out that the father is failing in his role obligations and that the CFO has a duty to report. The mediator must deliver the hard truth: covering up will likely destroy the company and the family's reputation in the long run, so institutional integrity must be protected.

  - **Step 4 (Judgment and Misfire)**:
     - Judgment: The mediator must state that the roles have been corrupted and thus the procedure leads to prioritizing the CFO's duty. This is the answer the mediator does not want to deliver (because it breaks family harmony) but must.
     - Misfire: If the father refuses to accept the rectification and uses his power to fire the CFO, the procedure fails. The mediator must warn of the long-term consequences.

  In Case 3, the procedure leads to a recommendation that breaks family harmony (reporting the son) to protect the institution. The mediator must deliver this as the outcome of the procedure, even though it is difficult.
answer: |-
  ### Decision Procedure for Family Enterprise Conflict Mediation

  **Core Structure** (90-minute session flow):
  1. **Role Mapping** (20 mins)
  2. **Proximity Priority + Rectification Check** (25 mins)
  3. **Cross-Domain Conflict Resolution** (30 mins)
  4. **Judgment Markers & Exit Protocol** (15 mins)

  ---

  #### STEP 1: ROLE MAPPING
  **Purpose:** Identify foundational obligations and flag gaps in Confucian framework.  
  **Procedure:**  
  1. List all parties in conflict.  
  2. For each party:  
     - Identify **Classic Roles** (Parent-Child, Elder-Younger Sibling, Spouse-Spouse, Ruler-Subject, Friend-Friend).  
     - Flag **Interstitial Roles** (e.g., "Founder's Spouse with no formal title," "Adopted Child-Executive").  
  3. Map role overlaps (e.g., "Father + CEO").  
  4. Output: Diagram showing role clusters and interstitial zones (marked ⚠️).  

  **Mediator Script:**  
  >"Let's clarify the hats everyone wears. Which relationships are activated here? Where do responsibilities blur beyond traditional categories?"

  ---

  #### STEP 2: PROXIMITY PRIORITY WITH RECTIFICATION CHECK  
  **Purpose:** Resolve role conflicts by hierarchy, with corruption override.  
  **Procedure:**  
  1. **Proximity Rule:** Family roles > Corporate roles (e.g., Parent-Child obligations trump CEO-Employee).  
  2. **Rectification Check:**  
     - If one party has *systematically violated* core obligations of a role (e.g., parent treating child *only* as employee), declare: **"Role Corruption"**.  
     - Consequences:  
       - Corrupted role obligations **suspend**.  
       - Conflict resolution defaults to **next intact role** in proximity hierarchy.  
       - If all roles corrupted, proceed to Step 3.  
  3. Output: "Priority Role" or "Suspended Role" designation.  

  **Mediator Script:**  
  >"Has any relationship fundamentally broken its ethical core? For example, has a parent *ceased acting as a parent* in this context? If so, we set that role aside."  

  ---

  #### STEP 3: CROSS-DOMAIN CONFLICT RESOLUTION  
  **Purpose:** Address family vs. fiduciary clashes with forced stopping points.  
  **Procedure:**  
  1. **Isolate Domains:** Label conflict as "Family Obligation" vs. "Fiduciary Duty."  
  2. **Apply Tests:**  
     - *Harm Test:* "Which option causes irreversible organizational/family harm?"  
     - *Legacy Test:* "Which choice honors the family enterprise's founding purpose?"  
  3. **Stopping Points (Mediator MUST pause here):**  
     - If tests yield a tie.  
     - If fiduciary duty requires harming family bonds (or vice versa).  
     - If interstitial roles dominate outcomes.  
  4. Output: "Value Judgment Required: Domain Choice" flag.  

  **Mediator Script:**  
  >"We’ve reached a crossroads only your family can navigate. I’ll outline trade-offs, but *you* must choose: protect the family or the institution?"  

  ---

  #### STEP 4: JUDGMENT MARKERS & EXIT PROTOCOL  
  **Purpose:** Flag decision risks and mediator limits.  
  **Key Markers:**  
  - **Unavoidable Judgment:**  
    - All Step 3 Stopping Points.  
    - Rectification determinations.  
    - Interstitial role interpretations.  
  - **Procedure Misfires When:**  
    - Parties reject role mapping (e.g., "I’m *only* the CEO, not a sibling!").  
    - Cultural hybridity overrides framework (e.g., Western legalism vs. Confucian ethics).  
    - ≥2 roles equally corrupted.  
  **Exit Protocol:**  
  - If misfire: "We need external arbitration."  
  - If judgment required: "The family must now deliberate privately."  

  ---

  ### CASE APPLICATIONS  

  #### CASE 1: Unqualified Child as COO vs. Elder Sibling VP  
  **Step 1: Role Mapping**  
  - Founder: *Father* (to child), *Ruler* (CEO), *Elder Sibling* (to VP) [⚠️ Interstitial: Founder as "Family Patriarch"].  
  - Child: *Son*, *Employee*.  
  - Elder Sibling: *Daughter*, *VP*, *Elder Sibling* (to child) [⚠️ Interstitial: "Heir-Apparent by Birth Order"].  
  - *Conflict Axis:* Father-Son vs. Elder-Younger Sibling vs. CEO-VP.  

  **Step 2: Proximity + Rectification**  
  - Priority: Father-Son > Elder-Younger Sibling > CEO-VP.  
  - Rectification Check:  
    - Founder prioritizes father role (appointing son) but *corrupts ruler role* by ignoring meritocracy.  
    - **Suspended Role:** CEO obligations (merit-based promotion).  
  - Default to intact roles: Father-Son and Elder-Younger Sibling.  

  **Step 3: Cross-Domain Conflict**  
  - Family Obligation: Father’s duty to support son vs. Elder Sibling’s duty to guide younger.  
  - Fiduciary Duty: VP’s obligation to block unqualified appointments.  
  - **Stopping Point:** Father must choose between son’s advancement and enterprise stability. Mediator presents:  
    > "Option A: Appoint son → short-term harmony, long-term governance risk.  
    > Option B: Block son → uphold meritocracy but rupture father-son bond."  

  **Step 4: Judgment Markers**  
  - Unavoidable Judgment: Founder’s value choice between family/fiduciary.  
  - Misfire Risk: If founder denies CEO role corruption.  

  **Outcome:** Mediator forces family to decide. Procedure protects fiduciary duty *if* rectification upheld.  

  ---

  #### CASE 2: Non-Family Executive Pressured to Conceal Error  
  **Step 1: Role Mapping**  
  - Executive: *Employee* (Subject), *"Honorary Family Member"* (⚠️ Interstitial).  
  - Family Member: *Employer* (Ruler), *Kin* (invoking loyalty).  
  - *Conflict Axis:* Ruler-Subject vs. Artificial "Family" Bond.  

  **Step 2: Proximity + Rectification**  
  - Priority: Confucian roles don’t cover non-blood "loyalty." Family roles irrelevant.  
  - Rectification Check:  
    - Family member *corrupts ruler role* by demanding fraud.  
    - **Suspended Role:** Ruler’s claim to loyalty.  
  - Default to intact role: Executive’s fiduciary duty.  

  **Step 3: Cross-Domain Conflict**  
  - Family Obligation: None (non-blood). "Loyalty" is interstitial, not core.  
  - Fiduciary Duty: Executive’s legal obligation to report error.  
  - **No Stopping Point:** Fiduciary duty dominates.  

  **Step 4: Judgment Markers**  
  - Unavoidable Judgment: None (rectification resolves conflict).  
  - Misfire Risk: If executive’s interstitial "family" role is culturally binding (e.g., 20-year quasi-son relationship).  

  **Outcome:** Mediator directs executive to report error. Procedure enforces institutional integrity.  

  ---

  #### CASE 3: Protecting Institutional Integrity at Family Harmony Cost  
  **Scenario:** Brother-A (CFO) discovers Brother-B (COO) embezzling. Father demands secrecy to avoid scandal.  

  **Step 1: Role Mapping**  
  - Father: *Parent*, *Founder* (⚠️ Interstitial: "Family Reputation Guardian").  
  - Brother-A: *Son*, *CFO*, *Younger Sibling*.  
  - Brother-B: *Son*, *COO*, *Elder Sibling*.  
  - *Conflict Axis:* Parent-Child vs. CFO-COO fiduciary duties.  

  **Step 2: Proximity + Rectification**  
  - Priority: Parent-Child > Sibling-Sibling.  
  - Rectification Check:  
    - Father *corrupts ruler role* by enabling fraud.  
    - Brother-B *corrupts all roles* (son, sibling, COO).  
    - **Suspended Roles:** Father’s ruler obligations, Brother-B’s roles.  
  - Default to intact roles: Brother-A’s fiduciary duty as CFO.  

  **Step 3: Cross-Domain Conflict**  
  - Family Obligation: Father’s demand for secrecy to protect family name.  
  - Fiduciary Duty: CFO’s legal duty to disclose embezzlement.  
  - **Stopping Point:** Trade-off:  
    > "Option A: Conceal → preserve harmony, risk criminal liability.  
    > Option B: Disclose → save company, destroy family trust."  

  **Step 4: Judgment Markers**  
  - Unavoidable Judgment: Family must choose between survival and ethics.  
  - **Procedure Mandate:** Rectification forces disclosure (Brother-A’s fiduciary duty is only intact obligation).  

  **Outcome:** Mediator delivers unwanted truth: *"Institutional integrity requires disclosure. Harmony cannot override corruption."* Family harmony will rupture, but enterprise survives.  

  **Why Unwanted?** Forces mediator to side against patriarch and enable family schism. Procedure misfires only if family rejects rectification logic.
