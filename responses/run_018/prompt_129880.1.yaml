  Point system tension: Critics should earn points for exposing inconsistencies, but Sorters get points for defending categorizations. However, if a Sorter’s defense relies on ad-hoc reasoning, the Judge can dock points. This mirrors nominalism’s "similarity is subjective" trap.  

  Debrief mapping is crucial:  
  - Round 1 (function) = naive realism (kinds defined by purpose)  
  - Round 2 (origin) = descent realism (Lockean real essences)  
