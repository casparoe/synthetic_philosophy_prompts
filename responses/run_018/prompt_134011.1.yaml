prompt: |-
  I'm preparing a lecture for an undergraduate course in moral psychology that pairs classic films with debates in character theory, and I want to use Groundhog Day to complicate the usual framing. Most of my students have seen the film, but the discussion keeps collapsing into either "Phil learns to be good" (virtue ethics) or "he just adapts to his environment" (situationism). I want to push them further by introducing a less-discussed refinement — call it "ecologically indexed virtue" — according to which a trait is not a global psychological constant but a calibrated response to a specific relational ecology, so that two observers might see the same behavior and disagree about whether virtue is present depending on hidden social cues.

  Read Groundhog Day through this lens, together with the standard virtue-ethics and situationist critiques. The film's central conceit holds the external environment constant — same Punxsutawney, same February 2nd, same townspeople — yet Phil Connors moves from cynical manipulation to despair to something resembling practical wisdom and benevolence. Focus on three scenes that are common knowledge: the early broadcast and poolside encounter where he uses foreknowledge for personal gain; the middle sequence of suicide attempts and the piano lesson where he begins studying with a teacher who remembers nothing from one loop to the next; and the final loop where he saves a child, repairs a tire, and performs perfect service without expectation of reward.

  For each scene, say whether the change in Phil's behavior is best explained by (1) the gradual cultivation of a stable global virtue, (2) the situationist claim that hidden variables — his own accumulated memory, emotional exhaustion, or altered expectations — are the real drivers, or (3) the ecologically indexed view that Phil is not becoming "a virtuous person" but is instead calibrating to a new social niche he himself has slowly reshaped through prior loops, so that virtue appears only when the ecology permits it. Be honest about where the film resists each reading: for example, the townspeople's shifting reactions to him create a feedback loop that blurs the line between internal trait and external situation, and the repetition structure lets the viewer experience moral development as narrative rather than as a snapshot experiment.

  Don't treat the film as a mere case study; say what Groundhog Day contributes to the philosophical debate that standard psychological experiments on character traits do not — especially regarding the temporal unfolding of virtue, the role of narrative identity, and the problem of assessing traits in closed loops where memory is asymmetric. Avoid reducing either the film or the theories to fit the other.

  After your critical reading, provide a brief structured summary in JSON format with exactly these fields for each of the three scenes: "scene_label" (a short name), "virtue_ethics_reading", "situationist_reading", "ecologically_indexed_reading", "film_resists_as_boolean", and "added_philosophical_insight". Use an array of three objects.
