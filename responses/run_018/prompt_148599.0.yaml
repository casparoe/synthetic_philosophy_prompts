answer: |-
  ### Satisficing-Based Resource Allocation Procedure for Clinic Aid Requests  
  **Grounding Principles**:  
  - **Aspiration thresholds**: Minimum acceptable levels of need (e.g., resource gap severity, population vulnerability).  
  - **Recognition-primed stopping**: Halt information gathering when request matches known approval/rejection patterns.  
  - **Adaptive reference points**: Benchmarks derived from the prior three allocations (e.g., median resource gap, risk scores).  
  - **Values hand-off**: Flag issues requiring human judgment (e.g., equity, ethical trade-offs).  

  ---

  ### Decision Procedure  
  #### Step 1: **Immediate Rejection Check**  
  - **Question**: Does the request lack temporal urgency (e.g., >12-month horizon) OR report no current resource gap?  
  - **Sufficient Answer**:  
    - *Yes* → **Reject**.  
    - *No* → Proceed to Step 2.  
  - **Rationale**: Avoids allocating scarce resources for non-urgent/inactive needs.  

  #### Step 2: **Aspiration Threshold Test**  
  - **Question**: Does the request meet **all three** aspiration thresholds?  
    - **Threshold 1**: *Resource gap severity* ≥ 70th percentile of gaps in prior three allocations.  
    - **Threshold 2**: *Population vulnerability* (e.g., CDC Social Vulnerability Index) ≥ regional median.  
    - **Threshold 3**: *Event probability* (for preemptive requests) ≥ 40% chance within 12 months.  
  - **Sufficient Answer**:  
    - *Meets all thresholds* → Proceed to Step 3.  
    - *Fails ≥1 threshold* → **Reject**.  
    - *Inconclusive data* → Proceed to Step 4.  

  #### Step 3: **Recognition-Primed Pattern Match**  
  - **Question**: Does the request align with ≥2 of 3 patterns from prior **approved** allocations?  
    - **Patterns**:  
      1. Resource type matches historical high-priority items (e.g., generators, trauma kits).  
      2. Event type matches recurring regional threats (e.g., floods, storms).  
      3. Clinic size/type matches past recipients (e.g., rural, Federally Qualified Health Centers).  
  - **Sufficient Answer**:  
    - *Yes* → **Approve**.  
    - *No* → Proceed to Step 4.  
  - **Stopping Rule**: Halts calculation if request is "typical" of past approvals.  

  #### Step 4: **Values Deliberation Hand-Off**  
  - **Question**: Does the request involve unresolved trade-offs in **equity**, **future risk ambiguity**, or **procedural fairness**?  
  - **Flags for Human Judgment**:  
    - Equity conflicts (e.g., high-need clinic vs. higher-risk populations elsewhere).  
    - Preemptive requests with high uncertainty (e.g., climate projections without historical precedents).  
    - Aspiration thresholds met but allocation feels inconsistent with past decisions.  
  - **Outcome**: **Committee deliberation required**. No automated approval/rejection.  

  ---

  ### Application to Cases  
  #### Case 1: Rural Clinic Requesting Backup Generators (Post-Mild Winter Storm)  
  - **Step 1**: Event occurred, but no infrastructure damage → *No current gap* → **Reject**.  
  - **Rationale**: Fails immediacy (no active need). Halts at Step 1.  

  #### Case 2: Urban Clinic Requesting Preemptive Trauma-Kit Upgrades (Based on Climate Risk)  
  - **Step 1**: Event is future-oriented but within 12-month horizon → Proceed.  
  - **Step 2**:  
    - *Threshold 1*: Current stock adequate → **Resource gap severity = 0%** (fails).  
    - *Threshold 3*: Projected climate risk probability = 35% (fails 40% aspiration).  
  - **Outcome**: **Reject** at Step 2.  
  - **Values Conflict**: Unresolved by procedure → Committee may override if climate risk is deemed existential.  

  #### Case 3: Clinic Meets All Thresholds but Serves Low Mortality-Risk Population  
  - **Step 1**: Valid urgency → Proceed.  
  - **Step 2**: Meets all aspiration thresholds (e.g., gap severity = 75th percentile, vulnerability = median).  
  - **Step 3**: Pattern match (e.g., generators for storms) → **Approve**.  
  - **Resisted Recommendation**: Procedure **approves** despite equity concerns.  
  - **Values Hand-Off Trigger**: Committee must deliberate if:  
    - Past allocations prioritized higher-risk populations.  
    - Approval violates implicit equity norms (e.g., "save the most lives" principle).  

  ---

  ### What the Procedure Cannot Settle  
  1. **Opportunity Costs for Unknown Future Requests**:  
     - The procedure evaluates requests in isolation. It cannot:  
       - Quantify trade-offs between current approval and unanticipated future emergencies.  
       - Adjust for "what-if" scenarios (e.g., "If we approve this generator, can we handle a Category 5 hurricane next month?").  

  2. **Equity Adjustments Beyond Aspiration Thresholds**:  
     - The procedure **cannot**:  
       - Redistribute resources to correct historical disparities (e.g., favoring high-vulnerability clinics if thresholds are barely met).  
       - Balance "efficiency" (e.g., low mortality risk) with "fairness" (e.g., equal access for marginalized groups).  
     - *Example*: A clinic serving a low-mortality population may be approved if thresholds are met, even if it feels inequitable.  

  3. **Ambiguous Risk-Benefit Trade-offs**:  
     - Subjective judgments about "acceptable risk" (e.g., 35% vs. 40% event probability) or "moral urgency" (e.g., preventable deaths vs. property damage) require committee debate.  

  4. **Dynamic Context Shifts**:  
     - Reference points (from prior allocations) may become outdated if disaster patterns change abruptly.  

  ### Procedure Summary  
  | **Step** | **Question**                          | **Sufficient Answer**               | **Outcome**                     |  
  |----------|---------------------------------------|-------------------------------------|---------------------------------|  
  | 1        | Urgency/active gap?                   | No → Reject; Yes → Step 2           | Halts if rejected               |  
  | 2        | Meets all 3 aspiration thresholds?    | Yes → Step 3; No → Reject           | Halts if rejected               |  
  | 3        | Matches historical approval patterns? | Yes → Approve; No → Step 4          | Halts if approved               |  
  | 4        | Requires values judgment?             | Always → Committee deliberation     | Never auto-approves/rejects     |  

  **Final Output**: Approve, reject, or escalate to committee.  
  **Critical Weakness**: Satisficing optimizes for speed and simplicity but cannot resolve systemic trade-offs (equity vs. efficiency) or future unknowns. Committee deliberation (Step 4) is the pressure valve for value conflicts.
