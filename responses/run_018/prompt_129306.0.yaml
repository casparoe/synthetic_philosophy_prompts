        "formulation": "Learning P(B|A)=q (even with uncertainty) should leave P_post(A) unchanged, as the evidence is 'internal' to A.",
        "status": "defensible",
        "supports_dismissal_of_jeffrey": true,
        "notes": "Defensible in Judy Benjamin: The conditional only provides evidence about Red subregions, not Red vs. Blue. Jeffrey conditioning may violate this if misapplied (e.g., by treating the conditional as a partition update)."
      },
      {
        "label": "Stalnaker Subjunctive Update",
        "formulation": "Updating on a subjunctive conditional (A □→ B) should preserve P_prior(A), as subjunctives concern counterfactual worlds, not actual probability of A.",
        "status": "defensible",
        "supports_dismissal_of_jeffrey": false,
        "notes": "Defensible for subjunctives, but Judy Benjamin uses an indicative conditional probability. Irrelevant to the case."
      },
