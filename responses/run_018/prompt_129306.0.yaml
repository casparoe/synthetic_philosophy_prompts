        "supports_dismissal_of_jeffrey": true,
        "notes": "Defensible as a normative input constraint. In Judy Benjamin, if A='Red territory' is a partition element, Jeffrey conditioning should not change P(A) unless explicitly updated—but the conditional does not directly update P(A)."
      },
