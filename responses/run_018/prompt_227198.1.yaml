prompt: |-
  Is there an established name for the following pattern in how competent speakers treat borderline cases? Consider a man who is genuinely on the border between tall and not tall. The same speakers who refuse to call him tall, and equally refuse to call him not tall, will happily grant that he is either one or the other, and will flatly reject the suggestion that he is somehow both. Nor do speakers who give opposite verdicts about him correct one another: each verdict seems permitted, rather than one being a mistake. I am aware of two rival accounts of borderline cases — one on which such statements are neither true nor false, and one on which they are true or false but we cannot know which. Does the pattern of use I have described have a name of its own? Does it fit one account better than the other, or is it exactly what both accounts predict? If it has no established label, coin one, define it, and mark its edges; and in any case say what observable behaviour, if any, would actually discriminate between the two accounts, since I suspect this pattern cannot. Please answer in British English.
reasoning: |-
  Okay, let me tackle this query about borderline cases in vagueness. The user describes a scenario where competent speakers exhibit a specific pattern: they refuse to call a borderline-tall man "tall" or "not tall", yet accept he must be one or the other, and don't correct opposing verdicts. 

  First, I recall this aligns with what's called "tolerance" in vague predicates - small differences don't change classification. The described behaviour is classic higher-order vagueness, where even the boundary between clear and borderline cases is fuzzy. 

  The user mentions two theories: epistemicism (truth values exist but are unknowable) and supervaluationism (neither true nor false in borderline cases). Interesting that both can explain the non-correction pattern - epistemicism through permissible ignorance, supervaluationism through truth-value gaps. 

  For naming, "ambivalent verdict tolerance" feels apt - capturing speakers' acceptance of conflicting judgments without correction. The key discriminator would be whether speakers treat borderline statements as truth-apt or not. If they reject the very idea of truth/falsity here, it leans supervaluationist; if they maintain bivalence despite uncertainty, it's more epistemicist. 

  The user seems philosophically sophisticated - probably aware this touches on deeper issues like the nature of linguistic competence. Their skepticism about distinguishing the theories is warranted; observable behaviour alone may not settle it. I should emphasise the role of metalanguage judgments in potential differentiation.
answer: |-
  The pattern you describe is a well-documented phenomenon in the philosophy of language, specifically concerning **vagueness** and **borderline cases**. It doesn't have a single, universally agreed-upon name, but several closely related terms capture aspects of it:

  1.  **Higher-Order Vagueness:** This is the most prevalent term. It refers to the idea that the boundary between clear cases (definitely tall), borderline cases, and clear non-cases (definitely not tall) is itself vague. There's no sharp line separating the definite cases from the borderline zone, nor within the borderline zone between "leaning tall" and "leaning not tall". Your observation that speakers won't commit *and* accept conflicting verdicts without correction exemplifies this fuzziness at the boundaries *between* categories.

  2.  **Tolerance Principle Manifestation:** Vague predicates exhibit "tolerance" – a very small change (e.g., 1mm in height) shouldn't make the difference between "tall" and "not tall". The pattern shows tolerance in action: speakers refuse to apply the predicate definitively near the boundary because they recognise that a tiny change shouldn't flip the category.

  3.  **Ambivalent Verdict Acceptance (or Permissivism):** This describes the specific behavioural aspect where competent speakers accept that conflicting verdicts ("He's tall" / "He's not tall") are both permissible for the same borderline case without needing to correct each other.

  **Coining a Term: Ambivalent Verdict Tolerance (AVT)**

  If we were to coin a specific term for the *combined pattern* you highlight:
  *   **Name:** **Ambivalent Verdict Tolerance (AVT)**
  *   **Definition:** The linguistic behaviour exhibited by competent speakers with vague predicates where:
      *   (i) They withhold applying the predicate *and* its negation to a borderline case ("He's not tall" AND "He's not not-tall" are both rejected as inappropriate assertions).
      *   (ii) They accept the law of excluded middle for the case ("He is either tall or not tall" is true).
      *   (iii) They do not correct other competent speakers who offer the *opposite* verdict about the same borderline case, treating both verdicts as permissible rather than one being mistaken.
  *   **Marking its Edges:** AVT applies *specifically* within the region of higher-order vagueness surrounding the borderline. It breaks down for:
      *   **Clear Cases:** Speakers confidently apply "tall" or "not tall" and *will* correct a speaker applying the opposite predicate to a clear case (e.g., calling a very short man "tall").
      *   **Sharp Boundaries:** If a predicate had a sharp boundary (e.g., "is an adult" defined strictly as 18 years + 0 seconds), AVT wouldn't manifest. Speakers would insist on one verdict or the other at the boundary point (though they might dispute *where* the boundary *should* be set).
      *   **Non-linguistic Competence:** AVT depends on shared linguistic competence and context. If speakers disagree on the relevant comparison class (e.g., "tall for a jockey" vs. "tall for a basketball player"), apparent AVT might mask a deeper contextual disagreement.

  **Fitting the Rival Accounts:**

  Both the **Epistemic Theory** (borderline statements have a determinate but unknowable truth value) and **Supervaluationism** (borderline statements are neither true nor false) can *explain* AVT, but they do so differently:

  1.  **Supervaluationism:**
      *   **Fits Well:** This view directly predicts (i): "He is tall" is neither true nor false (so asserting it *or* its negation is incorrect/inappropriate). It also predicts (ii): "He is tall or not tall" is true on *every* precisification (way of making the predicate sharp), so it's supertrue. Crucially, it explains (iii): Competent speaker A might be envisioning a precisification where he *is* tall, while speaker B envisions one where he *isn't*. Neither is objectively wrong because the sentence *itself* lacks a truth value; they are reporting different permissible ways the language *could* be made precise. Both verdicts are acceptable precisifications within the range permitted by meaning and context.

  2.  **Epistemicism:**
      *   **Also Fits:** Epistemicism accepts (ii) straightforwardly: Bivalence holds, so he is determinately tall or not tall. It explains (i) via ignorance: Speakers *know* they don't know the elusive truth, so they refrain from asserting either "He is tall" or "He is not tall" because they lack the necessary justification/certainty. It explains (iii) by appealing to **permissible ignorance** and **pragmatic tolerance**: While one speaker's verdict is factually *correct* and the other *incorrect*, competent speakers recognise that *neither can know which is which*. Correcting the other would be unjustified arrogance given the ineliminable ignorance. Social norms of communication regarding vague predicates accept this mutual ignorance and tolerate the conflicting reports.

  **Discriminating Observable Behaviour:**

  While AVT itself is compatible with both theories, there *are* observable behaviours that could discriminate between them:

  1.  **Attitudes Towards Truth/Falsity of Borderline Claims:**
      *   **Epistemicism Predicts:** Competent speakers should *agree* that the sentence "He is tall" (said of a borderline case) *is* either true or false *simpliciter*, even though they don't know which. They should reject the claim that it has no truth value.
      *   **Supervaluationism Predicts:** Competent speakers should *accept* that the sentence "He is tall" (said of a borderline case) genuinely lacks a classical truth value (it's neither true nor false). They might say it's "indeterminate," "not settled," or "not true *or* false".
      *   **Observable Test:** Present competent speakers with a borderline case and ask: "Is the statement 'X is tall' true, false, or neither?" or "Does the statement 'X is tall' have a definite truth value (true or false), even if we can't know it?". Epistemicism predicts a tendency towards "It *must* be true or false, we just don't know" or affirming it has a definite truth value. Supervaluationism predicts a tendency towards "It's not true *or* false," "It's indeterminate," or denying it has a definite truth value.

  2.  **Attitudes Towards Correction *in Principle*:**
      *   **Epistemicism Predicts:** While speakers won't *correct* each other in practice (due to ignorance), they should acknowledge that *if* the hidden facts were revealed, one verdict *was* correct and the other incorrect. They might say, "Well, one of us *is* wrong, we just can't tell who."
      *   **Supervaluationism Predicts:** Speakers should feel that *neither* verdict is objectively wrong *even in principle* for the borderline case. Both are permissible sharpenings. They might say, "Neither of us is *wrong*; the language just allows both descriptions."
      *   **Observable Test:** After two speakers give opposite verdicts on a borderline case, ask: "Is one of these statements actually true and the other false, even though we can't know which? Or are both statements somehow acceptable/not false?" Epistemicism predicts the former; Supervaluationism predicts the latter.

  **Conclusion:**

  The pattern you describe – withholding assertion of the predicate and its negation, accepting excluded middle, and tolerating conflicting verdicts without correction for borderline cases – is a hallmark of **higher-order vagueness**. While observable in behaviour (**Ambivalent Verdict Tolerance**), it is predicted by both major theories of vagueness (Epistemicism and Supervaluationism). The key difference lies not in this behaviour itself, but in the speakers' underlying *metalinguistic judgments* concerning the *truth status* of borderline statements and the *principled correctness* of conflicting verdicts. Investigating these judgments offers the best chance of empirically discriminating between the theories. Your suspicion that the pattern alone cannot discriminate is largely correct; the differentiation requires probing speakers' understanding of truth and correctness *about* the borderline statements.
