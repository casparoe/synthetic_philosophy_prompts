  First, gotta map their analogy perfectly: parents as hosts forcing guests (kids) into a party (life) where the music (life quality) might suck, with no consent (RSVP). The asymmetry fits neatly too - just like nobody mourns a party that never happened, Benatar says nonexistence doesn't miss pleasure. Smart framing.

