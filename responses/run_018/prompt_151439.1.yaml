  draft the joint statement: numbered agreed claims about the formal structure of belief revision, what self-reference does to norms, and where exactly the tension lives; then a disagreements table with each side's view phrased in wording they'd actually accept; then the cruxes — i think the big ones are whether second-order norms count as beliefs that must also be open to revision, and whether there's a principled stopping point for recursive doubt. for each crux, give one concrete case both sides agree is relevant — maybe an AI agent that updates its own reward-valuation weights after seeing its performance degrade, or a scientist who learns her evidential standards were shaped by a biased training set — and write down what each camp predicts will happen in that case. keep it in the weeds, don't ask for a bibliography, and feel free to let a typo slip in since we're writing this fast.
