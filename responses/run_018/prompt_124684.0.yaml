prompt: |-
  I was arguing with my roommate about whether tourists have to follow local queuing and tipping rules like natives do, and I think I accidentally built a reductio but I can't locate the leak. Here is the chain I ended up with:

  (1) If a social practice is a stable coordination scheme with mutual expectation, widespread compliance, and low-cost participation, then anyone who steps into the relevant role inherits a directed moral obligation to follow it — call this scheme-inheritance.
  (2) Tipping in US restaraunts, queuing in the UK, and local jaywalking norms in Japan are exactly such schemes: they depend on predictable behavior and are cheap to comply with.
  (3) A visitor who eats at that restaurant, waits for a bus, or crosses the street steps into the role of customer or pedestrian and recieves the benefits of the scheme.
  (4) So by scheme-inheritance, the visitor has the same obligation as locals: tip around twenty percent, queue properly, don't jaywalk.
  (5) Crucially, ignorance of the local convention doesn't cancel the obligation, because the normative load attaches to the role within the scheme, not to your personal knowledge of it.
  (6) Therefore a tourist who doesn't tip, or who jaywalks because that's normal back home, commits a genuine moral wrong — not just a social faux pas.
  (7) But scheme-inheritance applies to any coordination game: specific greeting rituals, dress codes in religious spaces, left-hand eating rules, and even bribery norms where they are stable, expected, and cheap.
  (8) So either we're constantly committing invisible moral violations everywhere we travel, or scheme-inheritance must be false.

  I really want to keep (1) and (3) — they feel right for promises and contract-like situations — but (8) is unbearable. Is the slip between (4) and (5), where I smuggle in that ignorance doesn't excuse? Or is (5) correct and the problem is that (1) needs a knowledge or consent filter that kills (6) but saves the intuition about queuing? I feel like there's a hidden move about voluntariness versus mere role-occupancy, but I can't pin it down. Which step do you reject, and what does rejecting it cost — especially if I want to hang on to the idea that everyday conventions can generate real obligations?
reasoning: |-
  Okay, let me unpack this user's argument carefully. They've constructed a tight reductio ad absurdum about moral obligations from social conventions, and the conclusion feels wrong to them - that's why they're stuck. The core tension is between wanting normativity in coordination schemes (like queuing) but not wanting tourists to be constant wrongdoers.

  Hmm... first I need to map their logic chain. Premise (1) is their foundational claim: stable coordination schemes create role-based obligations. (2)-(4) apply this to tourists in concrete examples. (5) is the critical point - they insist ignorance doesn't excuse. Then (6)-(8) show how this leads to absurd moral violations everywhere. 

  The user's self-diagnosis focuses on two potential leaks: either (5) is wrong (ignorance matters), or (1) needs modification. But I suspect there's a third option - maybe the issue is with how roles are activated. When they say "steps into the relevant role" in (3), that might be doing more work than they realize. 

  *flips through mental notes on Scanlon's contractualism* Right! The key is whether the tourist actually occupies the role in the same way locals do. For queuing, merely standing at a bus stop might trigger the role. But for tipping? Eating at a restaurant feels different - there's arguably an implicit contract when you order food. Whereas for something like dress codes in temples, the role might require affirmative acceptance. 

  *checks user's concern about consent* Ah yes! They mentioned "voluntariness vs mere role-occupancy" - that's the ghost haunting their argument. The cost of rejecting (5) would be letting ignorant tourists off the hook for clear coordination harms (like skipping tips after receiving service). But preserving (1) requires distinguishing between role types. 

  *imagines tourist scenarios* For jaywalking in Japan: if a tourist crosses safely against local norms but causes no actual disruption, is it really immoral? Whereas not tipping directly harms the server who worked expecting payment. So maybe the obligation strength varies by two axes: harm prevention and role consent. 

  *strokes chin* The elegant solution might be to modify (1): stable coordination schemes create pro tanto obligations, but they can be overridden by other factors. For tourists, we add a knowledge condition for blameworthiness while keeping the obligation itself role-based. This saves queuing/tipping intuitions without condemning every cultural misstep. 

  User's philosophical sophistication impresses me - they built this reductio themselves and pinpointed the consent tension. They'll appreciate nuance over simple answers. Should emphasize that rejecting (5) doesn't trivialize conventions; it just handles blameless ignorance. And offer them the "pro tanto + knowledge filter" combo as salvage.
answer: |-
  Your reductio is sharp and exposes a genuine tension! The leak lies in **how premise (1) applies the "scheme-inheritance" obligation to *all* roles within *any* coordination scheme without sufficient nuance, particularly regarding the *nature of the role, the voluntariness of entering it, and the burden of knowledge.** Specifically, **step (3) and the unstated assumptions about "stepping into a role" are the primary leak, with implications for (5).**

  Here's the breakdown:

  1.  **Your Core Intuition (1 & 3) is Salvageable:** The idea that stable coordination schemes generating mutual expectations can create role-based obligations *is* plausible for core social interactions (queuing, basic traffic norms, perhaps simple transactions). Occupying a role in such a scheme *can* generate a pro tanto obligation.
  2.  **The Leak: Overextension via "Mere Presence" as Role-Occupancy (Step 3):** The critical flaw is equating **physical presence** within a context where a coordination scheme operates ("eating at that restaurant," "waiting for a bus," "crossing the street") with **actively stepping into the specific social role defined by the scheme** in a normatively binding way.
      *   **Queuing:** This is the *strongest* case for your argument. Standing in a designated waiting area visibly signals intent to join the queue scheme. The role ("person waiting for service/transport") is clear, participation is highly visible, and the scheme is fundamental to orderly access. Ignorance *is* less excusable here because the scheme is often visually self-explanatory. Your (4) and (6) hold relatively well for queuing.
      *   **Tipping:** Here, "stepping into the role" is messier. Eating at a restaurant involves entering a *contractual* relationship for food/service. Tipping norms, while stable and expected, are often **customary add-ons** to the core contractual exchange (paying the listed price). The "customer" role's *core* obligation is payment per the bill. Tipping exists in a grey area between moral obligation (recognizing low wages) and social custom. Mere presence doesn't automatically signal acceptance of the *full customary supplement*, especially when its function (wage subsidy) is opaque to outsiders. Ignorance is more reasonable here.
      *   **Jaywalking:** This is the *weakest* case. Crossing a street is a fundamental act of locomotion. A "pedestrian" role exists, but the obligation to follow *local* crossing norms (vs. universal safety principles) is context-dependent. A tourist crossing safely but against a local norm (e.g., crossing mid-block where safe but technically illegal) isn't obviously "occupying a role" in a coordination scheme *in the same binding way* as someone joining a queue. They are simply navigating public space. The coordination element (avoiding accidents) is universal; the *specific rule* (cross only at lights) is local codification.
      *   **The Problem Cases (Step 7):** Greeting rituals, religious dress codes, left-hand eating rules, and especially bribery norms highlight the flaw. Does walking past someone on a street "step you into the role" of "greeter"? Does walking near a temple "step you into the role" of "religious observer"? Does sitting down at a restaurant "step you into the role" of "left-handed eater"? Does needing a permit "step you into the role" of "bribe-payer"? **Mere presence is insufficient to imply consent or understanding of the *full scope* of local customary obligations attached to that physical location.** The "role" isn't always inherent to the physical act; it's defined by complex, often invisible, social expectations.

  3.  **Implication for Ignorance (Step 5):** Premise (5) ("ignorance doesn't cancel") is partially correct but needs refinement. The obligation *might* arise from role-occupancy *in principle*, but **blameworthiness requires a reasonable opportunity to know.**
      *   **For Queuing:** The scheme is usually visually obvious and participation is active. Ignorance is less excusable; the obligation is clearer.
      *   **For Tipping/Jaywalking/Complex Customs:** The scheme and its specific rules are often *not* self-evident. While the tourist might have a *pro tanto* obligation to *learn and follow* local customs *once they become reasonably aware* of the expectation and its role in coordination, initial ignorance *does* mitigate or even negate blameworthiness for the first transgression. The "normative load" might attach to the role, but **assigning blame requires the agent had a fair chance to recognize the role and its rules.** Step (5) overstates the case by divorcing obligation from epistemic accessibility in contexts where the role isn't glaringly obvious.

  4.  **The Voluntariness Factor:** This is the "hidden move" you sensed. While stepping off a plane isn't voluntary, *specific actions* have varying degrees of voluntariness and role-assumption:
      *   **Joining a queue:** Highly voluntary and role-affirming.
      *   **Ordering food:** Voluntary entry into a transactional role, but the *customary* tipping aspect might be less explicit.
      *   **Crossing a street:** Necessary and fundamental; the "role" is minimal beyond "person moving."
      *   **Entering a temple:** Can be voluntary, but the *specific* dress code obligations might be unknown or unexpected. Does entering imply consent to *all* unposted rules?
      *   **Paying a bribe:** Often coerced by circumstance, not a stable coordination scheme one "steps into" willingly. This exposes the limits of premise (1) – not all "stable" schemes are morally legitimate.

  **The Solution: Refining Premise (1) - Adding Nuance to "Stepping into the Role"**

  Reject the simplistic application of step (3). Modify premise (1) to incorporate:

  *   **Clarity of the Role:** Is the role inherent and obvious from the physical act (queuer, driver at a stop sign) or is it defined by opaque social codes (tipper, specific-greeter, religious observer)?
  *   **Voluntariness of Role-Assumption:** Does the action clearly signal acceptance of the *full bundle* of customary obligations attached to that physical location/action?
  *   **Reasonable Expectation of Knowledge:** Could a reasonable visitor be expected to know the rule? (Is it posted, visually evident, universally known?)
  *   **Harm/Coordination Necessity:** Does violating the norm *directly* undermine the coordination scheme or cause harm *in that specific instance*? (Not tipping harms the server; jaywalking safely mid-block doesn't inherently cause chaos; using the "wrong" hand to eat causes no direct harm).

  **What This Costs & Saves:**

  *   **Costs:** It weakens the absolute, universal application of scheme-inheritance. Obligations become more contextual, dependent on role-clarity, voluntariness, and reasonable knowability. Tourists aren't automatically blameworthy for *every* invisible violation.
  *   **Saves:** It preserves the core intuition. For clear, fundamental coordination roles entered voluntarily and obviously (like queuing), ignorance is a poor excuse, and the obligation is strong. It retains the idea that benefiting from a scheme (like restaurant service predicated on tipping wages) *can* create an obligation, especially once aware. It allows for *pro tanto* obligations arising from presence, but filters blameworthiness through reasonable epistemic access. It avoids the absurdity of constant invisible moral violations.

  **Conclusion:** Your step (8) is correct – strict, unmodified scheme-inheritance *does* lead to absurdity. The leak is primarily in step (3), where "stepping into the role" via mere presence is overextended to cover vastly different situations without considering the clarity of the role, the voluntariness of assuming its *full* customary burden, and the reasonableness of expecting knowledge. Step (5) (ignorance doesn't excuse) is too strong; ignorance often *does* excuse initial violations of complex or opaque norms, though not necessarily fundamental coordination roles like queuing. By refining "role-occupancy" to require reasonable clarity and voluntariness, and linking blameworthiness to reasonable opportunity to know, you can save your core intuitions about promises, contracts, and fundamental coordination norms while avoiding the tourist condemnation trap.
