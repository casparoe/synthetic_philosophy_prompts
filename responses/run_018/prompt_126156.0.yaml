answer: |-
  Here's a disciplined mapping of the 1943 Bengal famine through Ferguson's and Tharoor's historiographical frameworks, incorporating your "counterfactual infrastructure" concept and analyzing the accounting breakdowns:

  ---

  ### **Core Accounting Frameworks**
  1. **Ferguson's "Net-Credit" Imperial Ledger**  
     *Assets*: Long-term infrastructure (railways, legal systems), market integration, British institutions.  
     *Liabilities*: Costs of administration, "regrettable but necessary" actions during crises.  
     *Net Value*: Empire as a net positive despite debits.

  2. **Tharoor's "Extraction Ledger"**  
     *Assets*: Resources, wealth, labor extracted from colonies.  
     *Liabilities*: Famine, deindustrialization, systemic violence, institutionalized racism.  
     *Net Value*: Empire as a predatory enterprise with human costs exceeding benefits.

  ---

  ### **Actors & Entries in the 1943 Famine Ledger**
  | **Actor/Role**               | **Ferguson's Accounting**                                  | **Tharoor's Accounting**                                  |
  |------------------------------|------------------------------------------------------------|-----------------------------------------------------------|
  | **Churchill's War Cabinet**  | *Credit*: Strategic reserve buildup (defending empire).<br>*Debit*: "Contingency cost" of wartime triage. | *Debit*: Deliberate diversion prioritizing white lives; racist indifference codified as policy. |
  | **Provincial Administration (Linlithgow/Wavell)** | *Credit*: Maintaining price stability (market logic).<br>*Debit*: Bureaucratic failure to adapt. | *Debit*: Active suppression of local agency; enforcing extraction during crisis. |
  | **Bengali Peasantry**        | *Externalized Cost*: "Unavoidable" wartime collateral. | *Central Liability*: Human cost of extraction; racialized expendability. |
  | **1942 Cyclone/Fungus**      | *Exogenous Shock*: Distorts ledger; discounts imperial liability. | *Amplifier of Extraction*: Exploited to mask systemic failures; triggered by colonial land-use policies. |
  | **Hoarding/Traders**         | *Explanatory Debit*: Local profiteering worsens famine. | *Symptom*: Market collapse under extraction; colonial policy dismantled price controls. |

  ---

  ### **Where the Accounting Breaks Down**
  **Ferguson's Model:**  
  - **Blind Spot**: No column for "racialized administrative indifference." The famine is filed under *wartime contingency* or *local corruption*, ignoring how racism shaped policy (e.g., Churchill’s dismissal of Indians as "breeding like rabbits").  
  - **Anomaly Handling**: Absorbs famine as an "exceptional debit" against long-term credits (railways/law). But 1943 exposes a *systemic* failure: grain exports *from* India continued in 1942–43.  

  **Tharoor's Model:**  
  - **Gap in Extraction Logic**: Doesn’t fully explain why net-export districts (e.g., Midnapore) starved worst. Requires auxiliary debits:  
    - Colonial policies dismantled traditional distribution networks.  
    - Forced monetization made peasants dependent on volatile markets.  
  - **Overextension?** Treats all suffering as active extraction, but administrative incompetence (vs. malice) needs nuance.

  ---

  ### **The "Counterfactual Infrastructure" Test: Pre-Raj Welfare Systems**  
  **The Lost Column: Dismantled Local Resilience**  
  Pre-Raj systems like *gola* (village granaries), *zakat* (charity), and reciprocal credit networks acted as famine buffers. The Raj:  
  - Replaced them with centralized, market-based grain procurement.  
  - Criminalized "hoarding" (e.g., peasants storing seed grain).  
  - Prioritized revenue collection over community welfare.  

  **Can the Frameworks Account for This?**  
  - **Ferguson**: Ignores it. His "credits" (railways/markets) *actively displaced* these systems, but this destruction isn’t booked as a debit.  
  - **Tharoor**: Notes extraction but overlooks *replacement of resilience*. His ledger records stolen grain, not stolen **capacity for self-help**.  
  - **The Flaw**: Both frameworks are **state-centric**. Destroyed non-state welfare is invisible because balance sheets only track *tangible transactions* (grain moved, taxes paid), not *social capital*.  

  ---

  ### **What the Famine Does to Both Theories**  
  - **Ferguson**: The famine is an **anomaly his model can absorb** but not explain. "Wartime contingency" excuses systemic failures, yet the scale of avoidable death (Amartya Sen: "no serious shortage of rice") exposes racism as a core liability, not an outlier.  
  - **Tharoor**: A **confirming instance with residual gaps**. Extraction explains policy cruelty, but local market collapse in exporter districts needs layered analysis (e.g., how colonial land tenure created debt traps).  
  - **Conceptual Limit of Balance Sheets**: **Human suffering resists double-entry bookkeeping**. Ferguson’s "net credit" trivializes mass death; Tharoor’s extraction ledger can’t quantify lost dignity or community cohesion. The frameworks share a **materialist bias**—neither captures the erasure of *autonomy* or *cultural resilience*.  

  ---

  ### **Conclusion: The Ledgers’ Fatal Flaw**  
  The 1943 famine reveals both frameworks **fail to audit epistemic violence**. Destroying Bengal’s mutual-aid networks wasn’t merely an "absence" but an **active dismantling of alternatives to colonial control**. This isn’t a debit in their ledgers because imperialism’s balance sheet *cannot imagine value outside its own logic*. The famine thus becomes more than a dispute over numbers—it’s proof that judging empire by its self-justifying accounting will always miss the gravest costs: **the unquantifiable territories of stolen futures**.  

  --- 
  **Key Insight**: Your "counterfactual infrastructure" lens exposes the deepest flaw: imperial accounting, whether celebratory (Ferguson) or condemnatory (Tharoor), is structurally incapable of seeing what it destroyed *because it never valued it in the first place*.
