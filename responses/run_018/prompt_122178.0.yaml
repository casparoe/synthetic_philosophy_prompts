  ## Clay's Enduring Paradox

  **This shape is nothing but the clay's design.**  
  The sculptor's hand, replacing grain by grain,  
  Preserves the form that makes the structure shine.  
  Each touch removes what older lines define,  
  Yet still the figure stands against the rain.  
  **This shape persists by being not the clay.**  

  The novelist rewrites the opening phrase,  
  A word replaced, a sentence made anew,  
  **This shape is nothing but the clay's design.**  
  Does character endure through such a maze,  
  When every line that birthed her fades from view?  
  She smiles, defined by actions still the same.  

  The particles that gathered at the dawn  
  Are scattered now; the process spreads its days.  
  **This shape persists by being not the clay.**  
  The ink dries fresh where older marks are gone,  
  A different path describes the self-same gaze.  
  What lasts? The matter or the constant name?  

  The statue endures while changing every part,  
  A four-dimensional thread that time displays.  
  **This shape is nothing but the clay's design.**  
  The story lives beyond its crafted start,  
  Though every syllable finds different ways.  
  **This shape persists by being not the clay.**  

  **This shape is nothing but the clay's design,**  
  **This shape persists by being not the clay.**
