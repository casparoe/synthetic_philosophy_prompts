prompt: |-
  In a recent departmental colloquium, a colleague offered the following summary of how the doctrine of double effect bears on the standard trolley problems, and I want to know whether I can rely on it. She said that the doctrine permits the switch case because the death of the one is a mere side-effect of diverting the threat, whereas it forbids the footbridge case because the large man’s death is intended as the means by which the trolley is stopped. She then introduced what she called the “tactile prohibition”: she claimed that the only genuine distinction at work is not intentionality but physical contact, since the doctrine allows precisely those killings that maximize lives saved so long as the agent does not directly touch the victim, which makes it not a deontological constraint at all but a socially calibrated heuristic for act-consequentialism that suppresses visceral aversion to direct harm. How fair is this summary? Please audit it claim by claim: identify what a defender of the traditional doctrine—say, in the Thomist formulation—would accept as accurate, where the summary conflates distinct conditions (particularly the means/side-effect distinction with a prohibition on contact), and whether the conclusion that double effect collapses into consequentialism actually follows once those errors are corrected. I want a committed response: take a definite position on whether these are harmless simplifications or substantive distortions, defend that judgment with reference to the doctrine’s four conditions as traditionally stated, and tell me whether the “tactile prohibition” captures anything the doctrine genuinely requires or is simply an artifact of misreading the proportionality and intention conditions.
reasoning: |-
  Okay, the user is asking about the doctrine of double effect (DDE) and their colleague's summary of it in relation to trolley problems. The colleague claimed that DDE permits the switch case but forbids the footbridge case, and introduced a "tactile prohibition" theory suggesting that DDE is actually just a heuristic for consequentialism based on physical contact aversion. The user wants me to audit this claim by claim from a traditional Thomist perspective.

  First, I need to recall the four conditions of DDE as traditionally formulated: 1) The act itself must be morally good or neutral; 2) The bad effect must not be the means to the good effect; 3) The intention must be only the good effect (with bad effect merely foreseen); 4) There must be proportionality between good and bad effects.

  Looking at the colleague's summary, they got the basic trolley cases right - DDE does permit switching the trolley (bad effect is side-effect) but forbids pushing the man (bad effect is means). That part seems accurate. However, their "tactile prohibition" theory is a complete misinterpretation. Physical contact isn't a factor in Thomist ethics - what matters is the causal role of the harm in achieving the good outcome.

  I should explain why the tactile theory fails: In the switch case, there's no physical contact with the victim, but in footbridge there is. But DDE would forbid other non-contact scenarios where harm is intended as means, like remote-controlled trapdoors. And it might permit some contact scenarios in medical ethics. The tactile aspect is irrelevant to the means/side-effect distinction.

  The colleague's conclusion that DDE collapses into consequentialism doesn't hold. Consequentialism only looks at outcomes, while DDE maintains strict constraints on intention and means. Even in cases with identical outcomes and no contact, DDE forbids intending harm as means.

  This misreading probably comes from confusing proportionality (which does consider outcomes) with the absolute intention constraint. But proportionality is only one of four conditions - it can't override the means prohibition.

  The user seems philosophically sophisticated - they want to know if this is a harmless simplification or substantive distortion. I'd say it's a serious distortion because it replaces DDE's core deontological constraints with a psychological heuristic, fundamentally changing its nature. The colleague has conflated descriptive psychology with normative ethics.

  I should emphasize that while the aversion to direct harm might explain why people intuitively judge cases differently, it doesn't determine what DDE actually requires normatively. The tactile element might correlate with the means/side-effect distinction in some trolley variants, but it's not the doctrinal basis.

  In my response, I'll go claim by claim: affirm the basic trolley applications, reject the tactile prohibition as conflating distinct conditions, and show why the consequentialist conclusion doesn't follow. I'll reference the four conditions throughout to ground my analysis in Thomist tradition.
answer: |-
  Here's a claim-by-claim audit of your colleague's summary from the perspective of a defender of the traditional Thomist doctrine of double effect (DDE), evaluating its accuracy and identifying substantive distortions:

  **1. Claim: "The doctrine permits the switch case because the death of the one is a mere side-effect of diverting the threat."**
  *   **Assessment: Accurate.** A Thomist defender fully accepts this. DDE's second condition requires that the bad effect (death of the one) is not the *means* to the good effect (saving the five). Diverting the trolley *away* from the five is the directly intended good act. The death of the one on the side track is a foreseen but *unintended* side-effect (a "double effect") of diverting the threat. The act itself (throwing a switch) is morally neutral.

  **2. Claim: "[The doctrine] forbids the footbridge case because the large man’s death is intended as the means by which the trolley is stopped."**
  *   **Assessment: Accurate.** A Thomist defender fully accepts this. DDE's second condition is violated here. The good effect (stopping the trolley/saving the five) is achieved *precisely through* the bad effect (killing the large man). His body *is* the instrument used to stop the trolley. This makes his death an intended means to the end, not merely a foreseen side-effect. DDE's first condition (the act itself must be good or neutral) is also likely violated, as pushing an innocent person to their death is inherently a harmful act.

  **3. Claim: "The only genuine distinction at work is not intentionality but physical contact... the doctrine allows precisely those killings that maximize lives saved so long as the agent does not directly touch the victim." (The "Tactile Prohibition")**
  *   **Assessment: Profoundly Inaccurate & Substantive Distortion.** This is a fundamental misreading and conflation that undermines the core of DDE.
      *   **Conflation:** The colleague conflates the *causal/moral structure* (means vs. side-effect) with a *physical descriptor* (contact vs. no contact). Contact is irrelevant to Thomist DDE analysis.
      *   **Counterexamples:**
          *   **Forbidden without Contact:** Imagine a variant where you remotely trigger a trapdoor dropping the large man onto the track without touching him. DDE still forbids it because his death is the *means* to stop the trolley. Contact is absent, but the moral structure is identical to Footbridge.
          *   **Permitted with Contact:** Consider a surgeon removing a life-threatening cancerous uterus from a pregnant woman, knowing it will kill the fetus (a classic DDE case in medical ethics). The surgeon makes direct physical contact (cutting), the fetus's death is a foreseen side-effect, not the means to saving the mother, and the act (removing a diseased organ) is good/neutral. DDE permits this *despite* physical contact.
      *   **What Matters:** The *causal role* of the harm. Is the harm itself the *mechanism* generating the good (means)? Or is the harm a *consequence* of an otherwise permissible act aimed directly at the good? Physical contact is neither necessary nor sufficient for determining this. The "tactile prohibition" is an artifact, not a principle.

  **4. Claim: "[This] makes it not a deontological constraint at all but a socially calibrated heuristic for act-consequentialism that suppresses visceral aversion to direct harm."**
  *   **Assessment: Does Not Follow & Misrepresents DDE.** This conclusion relies entirely on the flawed "tactile prohibition" premise and ignores DDE's core deontological constraints.
      *   **Why it Doesn't Follow:** Since the "tactile prohibition" is a misreading, the conclusion that DDE collapses into consequentialism is unsupported. Correctly understood, DDE imposes absolute constraints (intention, means/side-effect) that consequentialism rejects.
      *   **DDE vs. Consequentialism:**
          *   **Consequentialism:** Permits *any* action if it maximizes net good (e.g., pushing the man in Footbridge is *required* if it saves more lives).
          *   **DDE:** Imposes *absolute prohibitions* based on intention and the nature of the act, *regardless* of consequences. Even if pushing the man in Footbridge saved 100 lives, DDE forbids it because killing an innocent as a means is intrinsically wrong (violating conditions 1 & 2). Similarly, DDE could forbid an action that saves net lives if the bad effect is disproportionate (condition 4) or if the act itself is bad (condition 1).
          *   **Proportionality (Condition 4):** While consequentialism *only* looks at net outcome, DDE's proportionality condition is subordinate to the first three. It asks if the *foreseen* bad effect is proportionate *to the intended good*, *given that* the act is good/neutral, the intention is good, and the bad is not the means. It *cannot* justify using an evil means (like killing an innocent) for a good end. The colleague's "heuristic" claim confuses DDE's limited role for proportionality with consequentialism's foundational principle.
      *   **Visceral Aversion:** While psychological aversion to direct harm might *explain* why people *intuitively* grasp the means/side-effect distinction in trolley cases, DDE itself is a *normative ethical principle* based on reason and the moral object of the act, not a description of psychological heuristics. The tactile element might *correlate* with the means/side-effect distinction in *some* trolley variants, but it is not the doctrinal basis.

  **Conclusion on the Summary's Fairness:**
  Your colleague's summary **contains substantive distortions, not harmless simplifications.** While the initial descriptions of the standard trolley cases under DDE are accurate, the introduction and defense of the "tactile prohibition" fundamentally misrepresent the doctrine:

  1.  **Conflation:** It fatally conflates the morally decisive condition (means vs. side-effect) with an irrelevant physical characteristic (contact vs. no contact).
  2.  **Misreading Conditions:** It misreads the role of the proportionality condition (4) and ignores the absolute constraints imposed by the intention condition (3) and, crucially, the means/side-effect condition (2).
  3.  **False Collapse:** The conclusion that DDE collapses into consequentialism stems directly from this conflation and misreading. Correctly understood, the means/side-effect distinction and the prohibition on intending evil (even as a means) are core deontological constraints incompatible with pure consequentialism.
  4.  **"Tactile Prohibition" Status:** The "tactile prohibition" **is simply an artifact of misreading the intention and means/side-effect conditions.** It captures a superficial correlation present in some thought experiments but bears no essential relationship to the moral reasoning required by Thomist DDE. The doctrine genuinely requires analyzing the *object of the act* and the *structure of intention/causality*, not physical contact.

  **In short:** Rely on the colleague's summary for the basic trolley verdicts (Switch allowed, Footbridge forbidden), but reject the "tactile prohibition" theory and its consequentialist conclusion as serious misunderstandings of the doctrine's foundations and distinct deontological character.
