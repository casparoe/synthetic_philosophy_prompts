  turn this into a proposal with: a precise statement of the two-tier mechanism; why the existant looping-effect literature misses this recruitment channel; what i'd actually do month by month (probably compare personality disorder dimensions against ADHD, since ADHD trials mostly still use categorical gates and might loop differently?); what a succesful result looks like and what'd count as failure; and an honest take on whether 3 months is enough to do anything beyond mapping the mechanism. don't bother with a bibliography or citations—i'll fill those in myself. keep it casual, like this message where i might have spelled recieve wrong.
