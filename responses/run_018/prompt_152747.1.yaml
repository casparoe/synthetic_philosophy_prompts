prompt: |-
  You are an expert in formal metaphysics and modal logic serving as the senior peer referee for a journal that receives about two submissions per month reconstructing, extending, or criticizing Gödel's modal ontological argument and its direct variants. You never have web access during your twenty-minute review window, you are not permitted to hunt for bibliographies or citation lists, and you must sign off on every recommendation. You need a reusable evaluation procedure—a flowchart in words with ordered tests—that operationalizes the core machinery of Gödel's argument (positive properties, the consistency condition on their set, the inference from possible to necessary existence of a being with all such properties, and the modal-collapse objection) without requiring you to re-derive modal logic from scratch each time.

  Begin by carefully brainstorming which conceptual distinctions must survive simplification for the procedure to remain honest—specifically, the difference between intensional property ascription across worlds and extensional quantification over worlds, the distinction between consistency of a property set and closure under negation or conjunction, and the boundary between formal validity in a frame and metaphysical soundness—versus which distinctions can be dropped for speed. Then construct your deliverable as a four-pass decision protocol, each pass stating: the exact question you put to the manuscript; the textual evidence required; the pass/fail/judgment-call rule; and the point labeled JUDGMENT CALL where your own theoretical commitments must enter.

  Pass One—Frame Specification: identify whether the author uses S5, S4, B, KB, or a restricted accessibility relation; check whether the frame is justified independently of the conclusion; flag circular appeals.

  Pass Two—Intensional Stability Audit (your niche procedural injection): for every property designated "positive," determine whether its extension is stable across all worlds accessible in the author's frame. If the author treats the property as world-bound in one step and trans-world in another, record an INTENSIONAL EQUIVOCATION failure. If stability holds but only by definitional fiat, record JUDGMENT CALL.

  Pass Three—Consistency and Collapse Containment: verify that the set of positive properties is explicitly claimed consistent. Then run the Collapse Containment Check: ask whether the model allows any contingent truths at all once the necessary being is introduced; if not, determine whether this is an explicit feature of the argument or a hidden consequence of property closure. Label the assessment of whether closure is legitimate as JUDGMENT CALL.

  Pass Four—Existential Inference: examine the move from "possibly, a being instantiates all positive properties" to "necessarily, such a being exists." Mark exactly where this step depends on the frame's accessibility conditions and where it depends on an unstated existence premise.

  Next, apply the full protocol to three hypothetical submissions, annotating each with pass/fail/JUDGMENT CALL outcomes:

  A. A standard Gödel reconstruction in S5 with explicit definitions of "positive" and "God-like" and an explicit consistency claim.
  B. A variant that replaces "positive" with "essential" and adopts an S4 frame with accessibility restricted to "metaphysically nearby" worlds.
  C. A formally ingenious submission that avoids modal collapse by adopting a highly restricted, non-standard accessibility relation, passes every formal check in Passes One through Four, but forces you—against your theoretical sympathies—to recommend rejection because the restriction is ad hoc and unsupported by any independent metaphysical argument. This is the case where the procedure gives you an answer you will not like.

  Finally, include a polished "Limitations and Misfires" section stating exactly what the procedure cannot do: it cannot adjudicate whether omniscience, omnipotence, or any particular attribute is genuinely positive; it cannot resolve theological disputes about the nature of divinity; it cannot distinguish formal validity from soundness when premises are undefined or circular; and it will misfire on manuscripts that employ non-classical quantification, paraconsistent property logics, or undefined modal operators, all of which fall outside its scope. Present everything as headings, ordered steps, the three annotated cases, and the limitations section. Do not include reading lists, citation requests, or references to specific publication dates or page numbers.
reasoning: |-
  We are constructing a reusable evaluation procedure for manuscripts on Gödel's modal ontological argument and its variants. The procedure has four passes. Each pass has: 
   1. The exact question to the manuscript.
   2. The textual evidence required.
   3. The pass/fail/judgment-call rule.
   4. A note on where JUDGMENT CALL enters.

  Additionally, we will apply the protocol to three hypothetical submissions and include a limitations section.

  Conceptual distinctions that must survive simplification:
  - Intensional property ascription (how properties are understood across worlds) vs. extensional quantification (the set of objects in worlds).
  - Consistency of a set of properties (non-contradictory) vs. closure under logical operations (e.g., if P and Q are positive, then P∧Q is positive; if P is positive, then ¬P is not positive).
  - Formal validity (the argument is valid in the chosen modal frame) vs. metaphysical soundness (the premises are true and the frame is metaphysically correct).

  Distinctions that can be dropped for speed:
  - Specific axiomatizations of modal logic (as long as the frame is specified and standard).
  - Detailed analysis of the logical connectives beyond what is required for consistency and closure.
  - The exact definition of "positive" beyond the minimal requirements for the argument.

  ---

  **Four-Pass Decision Protocol**

  **Pass One: Frame Specification**
  *Question:* What modal frame (accessibility relation) does the author use? Specifically, is it S5, S4, B, KB, or a custom restriction? Is the frame justified independently of the conclusion?
  *Textual Evidence Required:* Explicit statement of the modal system, definitions of the accessibility relation, and any justification for the choice of frame.
  *Rule:* 
    - PASS: If the frame is clearly specified (e.g., S5, S4) and independently justified (e.g., by appeal to standard metaphysical principles or without circularity).
    - FAIL: If the frame is not specified, or if the justification is circular (e.g., chosen to make the argument work).
    - JUDGMENT CALL: If the frame is specified but the justification is weak or controversial, yet not clearly circular.

  **Pass Two: Intensional Stability Audit**
  *Question:* For every property designated as "positive", is its extension stable across all accessible worlds? (That is, does the property have the same extension in every world, or does it vary? And does the argument treat it as stable when required?)
  *Textual Evidence Required:* Definitions of positive properties and any discussion of their trans-world identity. Check for steps that assume the property has the same extension in every world (or in all accessible worlds) versus steps that treat it as world-bound.
  *Rule:*
    - PASS: If for every positive property, the author either (a) explicitly defines it as having a fixed extension (rigid designation) across accessible worlds, or (b) the argument does not require trans-world stability and the author avoids equivocation.
    - FAIL: If there is an equivocation (e.g., using a property as world-bound in one step and as trans-world in another without explanation) or if the argument requires stability and it is absent.
    - JUDGMENT CALL: If the author defines positive properties by fiat as stable (without independent justification) and the stability is critical to the argument.

  **Pass Three: Consistency and Collapse Containment**
  *Question:* (a) Is the set of positive properties explicitly claimed to be consistent? (b) Does the model avoid modal collapse (i.e., the consequence that all truths are necessary)? If not, is the collapse acknowledged and defended, or is it a hidden flaw?
  *Textual Evidence Required:* Explicit claim that the set of positive properties is consistent. Then, check the consequences of the necessary existence of a being that has all positive properties: does it entail that every true proposition is necessarily true? Also, check if the set of positive properties is closed under conjunction and negation (or similar operations).
  *Rule:*
    - PASS: (a) The consistency of the set of positive properties is explicitly claimed and not obviously violated by the definitions. (b) The argument either avoids modal collapse (e.g., by not requiring the set to be closed under arbitrary conjunctions or by having a non-maximal set of properties) or explicitly defends modal collapse as acceptable.
    - FAIL: (a) The consistency claim is missing or clearly violated. (b) Modal collapse occurs and is not acknowledged, or it is hidden and undermines the argument without defense.
    - JUDGMENT CALL: The assessment of whether closure under logical operations (especially conjunction) is legitimate and whether the author's defense of consistency (or lack of collapse) is acceptable.

  **Pass Four: Existential Inference**
  *Question:* How does the author move from "possibly, there exists a being that instantiates all positive properties" to "necessarily, such a being exists"? Specifically, what role does the modal frame play, and is there an unstated existence premise?
  *Textual Evidence Required:* The step in the argument that infers necessary existence from possible existence. Also, check for any premise that asserts that necessary existence is a positive property (or similar).
  *Rule:*
    - PASS: The inference is valid in the specified modal frame (e.g., in S5, if it is possible that necessarily such a being exists, then it necessarily exists) and the premise that necessary existence is a positive property (or equivalent) is explicitly stated and defended.
    - FAIL: The inference is invalid in the specified frame, or the premise that necessary existence is positive is missing and not defended.
    - JUDGMENT CALL: The defense of the premise that necessary existence is positive (or the equivalent step) is weak but not clearly circular, or the frame is non-standard and the inference is valid but the frame is controversial.

  ---

  **Application to Hypothetical Submissions**

  **Case A: Standard Gödel reconstruction in S5 with explicit definitions of "positive" and "God-like" and an explicit consistency claim.**
  - Pass One: 
    - Question: Frame? Justification?
    - Evidence: Specifies S5, which is standard and often taken as metaphysically correct for broad necessity.
    - Rule: PASS (S5 is standard and independent justification is usually assumed in such reconstructions).
  - Pass Two:
    - Question: Intensional stability?
    - Evidence: Positive properties are typically defined as "positive in itself" without reference to worlds, but the argument treats them as stable across worlds (e.g., if a property is positive, it is positive in every world). The definition is by fiat.
    - Rule: JUDGMENT CALL (because stability is by definitional fiat without independent justification).
  - Pass Three:
    - Question: Consistency and collapse?
    - Evidence: Explicit claim that the set of positive properties is consistent. However, modal collapse is a known issue: if the set is closed under conjunction, then the God-like being has every positive property, and if necessary existence is positive, then it exists necessarily. But then, if every property of the being is necessary, then all truths become necessary? The author may not address collapse.
    - Rule: For (a) consistency: PASS (explicit claim). For (b) collapse: JUDGMENT CALL (if the author doesn't address it, we might note it as a flaw, but the pass condition allows for explicit defense. Without defense, it's a judgment call whether to require it).
  - Pass Four:
    - Question: Existential inference?
    - Evidence: In S5, the move from possibility to necessity is valid if the being is necessary. The argument includes that necessary existence is a positive property, so the God-like being has it, hence if possible then necessary.
    - Rule: PASS (the inference is valid in S5 and the premise is explicit).

  Overall: The manuscript passes most formal checks but requires judgment calls on intensional stability and modal collapse. Unless the judgment calls go against the author, it is likely acceptable.

  **Case B: Variant that replaces "positive" with "essential" and adopts an S4 frame with accessibility restricted to "metaphysically nearby" worlds.**
  - Pass One:
    - Question: Frame? Justification?
    - Evidence: Specifies S4 frame with a restriction to "metaphysically nearby" worlds. The justification for this restriction must be independent.
    - Rule: JUDGMENT CALL (if the restriction is not well justified, it might be circular. The term "metaphysically nearby" is vague and might be designed to avoid objections).
  - Pass Two:
    - Question: Intensional stability?
    - Evidence: The author uses "essential" properties. Essential properties are usually taken to be stable (if a property is essential to an object, it has it in every world where it exists). But the frame is restricted to "nearby" worlds, so stability might only hold in a subset of worlds. The argument might require stability across all worlds for the inference to work.
    - Rule: FAIL (if the argument uses stability across all accessible worlds (which are only nearby) but then the necessary existence step might require accessibility to all worlds? Or if the definition of "essential" is world-bound but then used as if stable, that would be equivocation). Specifically, the inference to necessary existence might not hold in S4 without additional steps. Also, the use of "essential" might not be stable in the required way.
  - Pass Three:
    - Question: Consistency and collapse?
    - Evidence: The set of essential properties must be consistent. But note: for a being to have all essential properties, they must be consistent. However, the author must claim that the set of essential properties (for the God-like being) is consistent. Also, in S4, modal collapse might be avoided, but we must check.
    - Rule: PASS for consistency (if claimed) but JUDGMENT CALL for collapse (if the set of essential properties is closed under conjunction, then having all of them might lead to collapse, but the author might not have closure for essential properties).
  - Pass Four:
    - Question: Existential inference?
    - Evidence: In S4, we cannot infer from ◇□P to □P (as we can in S5). So the move from "possibly a being with all essential properties exists" to "necessarily exists" would require more. The author might have a different route, but if they rely on the standard inference, it fails in S4.
    - Rule: FAIL (because S4 does not have the S5 axiom, so the standard inference is invalid).

  Overall: The manuscript fails on Pass Two (intensional stability) and Pass Four (existential inference). It also has a judgment call on the frame. Thus, it is likely rejected.

  **Case C: Formally ingenious submission avoiding modal collapse with a non-standard accessibility relation, passing formal checks but ad hoc.**
  - Pass One:
    - Question: Frame? Justification?
    - Evidence: The author uses a highly restricted, non-standard accessibility relation (e.g., only worlds that are "maximally similar" to the actual world, or only a finite chain). The justification is weak: no independent argument, just that it avoids collapse.
    - Rule: JUDGMENT CALL (if the frame is ad hoc, we must note it, but the specification is clear) -> but the rule says: if the justification is circular or absent, it might fail. However, the pass condition requires independent justification. So: FAIL (because the justification is ad hoc and unsupported).
  - Pass Two:
    - Question: Intensional stability?
    - Evidence: The author defines positive properties and ensures they are stable within the restricted set of accessible worlds. 
    - Rule: PASS (if the author has done so consistently in the restricted frame).
  - Pass Three:
    - Question: Consistency and collapse?
    - Evidence: The set of positive properties is claimed consistent, and the model avoids modal collapse because the accessibility relation is restricted so that not all worlds are connected, hence not all truths are necessary.
    - Rule: PASS (the author has avoided collapse by construction and the consistency claim is explicit).
  - Pass Four:
    - Question: Existential inference?
    - Evidence: The inference from possibility to necessity works within the frame because the frame allows the necessary existence to be established in the accessible worlds. The author might have defined the accessibility such that if a being with all positive properties is possible, then it exists in every accessible world (hence necessary in the frame).
    - Rule: PASS (formally valid in the frame).

  Overall: The manuscript passes Passes Two, Three, and Four formally, but fails Pass One because the frame is not independently justified (or the judgment call in Pass One is failed due to ad hocness). However, the protocol requires that we record the outcome of each pass. In Pass One, we have a FAIL because of circularity/absence of independent justification. Therefore, the manuscript fails.

  But note: the problem states that the procedure forces you to recommend rejection because the restriction is ad hoc. So even though it passes three passes, the failure in Pass One (due to lack of independent justification) leads to rejection.

  ---

  **Limitations and Misfires**

  The procedure cannot:
  - Adjudicate whether any particular attribute (like omniscience or omnipotence) is genuinely positive. This is a matter of philosophical debate.
  - Resolve theological disputes about the nature of divinity (e.g., whether God must be personal, timeless, etc.).
  - Distinguish formal validity from soundness when premises are undefined or circular (it can flag circularity in frame justification but cannot resolve the soundness).
  - Handle manuscripts that employ non-classical quantification (e.g., free logic, plural quantification), paraconsistent property logics (where consistency is defined differently), or undefined modal operators (if the modal system is not specified or is non-standard in a way that falls outside the common systems S4, S5, etc.). Such manuscripts are outside the scope of the procedure.

  Additionally, the procedure relies on the author being explicit about key definitions and claims. If the author is vague, the procedure may not be applicable.
answer: |-
  ### Evaluation Protocol for Gödel-Style Modal Ontological Arguments

  #### **Conceptual Anchors Retained**
  1. **Intensional vs. Extensional Property Ascription**:  
     - Intensional: Properties as world-independent *concepts* (e.g., "positivity" as essential to a property).  
     - Extensional: Properties as world-dependent *sets* (e.g., the objects instantiating a property in each world).  
     *Simplification*: Track equivocation between these modes in property definitions.  
  2. **Consistency vs. Closure**:  
     - Consistency: Non-contradiction in the set of properties (e.g., no property \(P\) where \(P \land \neg P\) is positive).  
     - Closure: Operations applied to the set (e.g., closure under conjunction or negation).  
     *Simplification*: Treat consistency as binary (explicitly claimed or not); closure as a potential source of modal collapse.  
  3. **Formal Validity vs. Metaphysical Soundness**:  
     - Formal validity: Logical correctness within the chosen modal frame.  
     - Metaphysical soundness: Premise truth and frame adequacy.  
     *Simplification*: Isolate frame-dependent inferences; outsource soundness to "judgment calls."  

  #### **Dropped for Speed**
  - Derivations of modal axioms (e.g., S5 reflexivity/symmetry/transitivity proofs).  
  - Theological interpretations of "God-like" attributes.  
  - Historical exegesis of Gödel's original notes.  

  ---

  ### **Four-Pass Decision Protocol**  

  **Pass One: Frame Specification**  
  - **Question**: What modal frame governs accessibility? (S5/S4/B/KB/custom?) Is it justified independently?  
  - **Evidence Required**: Explicit declaration of frame axioms (e.g., "accessibility is transitive and Euclidean for S5") and non-question-begging support (e.g., "S5 captures absolute possibility").  
  - **Rule**:  
    - PASS: Frame named and justified without presupposing the conclusion (e.g., "S5 is standard for metaphysical modality").  
    - FAIL: Frame undefined, or justification circular (e.g., "this frame makes the argument work").  
    - JUDGMENT CALL: Frame justified weakly (e.g., "I adopt S4 because S5 is controversial") or with novel metaphysics.  

  **Pass Two: Intensional Stability Audit**  
  - **Question**: For each property \(P\) called "positive," does \(P\) have a stable extension across all accessible worlds?  
  - **Evidence Required**: Definitions of "positive" properties and their cross-world behavior (e.g., "positivity is world-invariant" vs. "positivity is world-relative").  
  - **Rule**:  
    - PASS: All positive properties explicitly rigid (e.g., "positive properties hold the same extension in all worlds") and no equivocation.  
    - FAIL: Equivocation detected (e.g., using world-bound \(P\) in step 3 but trans-world \(P\) in step 5).  
    - JUDGMENT CALL: Stability asserted by fiat (e.g., "by definition, positivity is trans-world") without argument.  

  **Pass Three: Consistency and Collapse Containment**  
  - **Question**: (a) Is the set of positive properties explicitly consistent? (b) Does modal collapse occur? If so, is it defended?  
  - **Evidence Required**: Statement of set consistency (e.g., "no contradiction arises from all positive properties") and analysis of property closure (e.g., "closure under conjunction is assumed").  
  - **Rule**:  
    - PASS: (a) Consistency claimed; (b) no collapse, or collapse defended (e.g., "collapse is acceptable for divine simplicity").  
    - FAIL: (a) Consistency unclaimed or violated; (b) undefended collapse (e.g., all propositions become necessary silently).  
    - JUDGMENT CALL: Closure rules (e.g., "conjunction of positives is positive") are plausible but undefended.  

  **Pass Four: Existential Inference**  
  - **Question**: Does the move from \(\Diamond \exists x G(x)\) to \(\Box \exists x G(x)\) (where \(G\) is "God-like") rely on frame axioms or hidden existence premises?  
  - **Evidence Required**: Derivation of necessary existence (e.g., "necessary existence is positive, so \(G\) entails \(\Box\exists\)").  
  - **Rule**:  
    - PASS: Inference valid in the frame (e.g., S5 permits \(\Diamond\Box P \to \Box P\)) and existence premises explicit.  
    - FAIL: Inference invalid (e.g., in S4, \(\Diamond\Box P \not\to \Box P\)) or existence smuggled in.  
    - JUDGMENT CALL: Premise "necessary existence is positive" is asserted but undefended.  

  ---

  ### **Annotated Cases**  

  **Case A**: Standard Gödel in S5  
  - **Pass One**: PASS (S5 specified; "standard for metaphysical modality" asserted).  
  - **Pass Two**: JUDGMENT CALL ("positive" defined as "independently good," stability by fiat).  
  - **Pass Three**: PASS (consistency claimed; closure defended via Gödel’s axioms).  
  - **Pass Four**: PASS (S5 validates \(\Diamond\Box \exists x G(x) \to \Box \exists x G(x)\); necessary existence explicit).  
  - **Verdict**: Publish conditional on addressing judgment call (e.g., defend intensional stability).  

  **Case B**: "Essential" in S4 with "Metaphysically Nearby" Worlds  
  - **Pass One**: JUDGMENT CALL (S4 frame with "nearby" restriction; justification vague).  
  - **Pass Two**: FAIL (Equivocation: "essential" used as world-bound in definition but trans-world in inference).  
  - **Pass Three**: PASS (Consistency claimed; no closure, so collapse avoided).  
  - **Pass Four**: FAIL (S4 invalidates \(\Diamond\Box \exists x G(x) \to \Box \exists x G(x)\); no workaround).  
  - **Verdict**: Reject (fails Passes Two and Four).  

  **Case C**: Non-Standard Frame Avoiding Collapse  
  - **Pass One**: FAIL (Accessibility restricted to "symmetry-only" worlds; no independent justification).  
  - **Pass Two**: PASS (Properties stable within the restricted frame).  
  - **Pass Three**: PASS (Consistency explicit; collapse avoided by design).  
  - **Pass Four**: PASS (Inference valid in the custom frame).  
  - **Verdict**: Reject (fails Pass One; frame ad hoc despite formal success).  

  ---

  ### **Limitations and Misfires**  
  1. **Cannot adjudicate substantive property attributions**:  
     - No capacity to evaluate if omnipotence, omniscience, etc., are "positive."  
  2. **Theological neutrality**:  
     - Cannot resolve disputes about divinity (e.g., "Is God personal?").  
  3. **Formal vs. metaphysical blind spot**:  
     - Cannot bridge formal validity to soundness if premises are circular or undefined.  
  4. **Scope restrictions**:  
     - Misfires on:  
       - Non-classical quantification (e.g., branching quantifiers).  
       - Paraconsistent property logics (e.g., dialetheic "positivity").  
       - Undefined modal operators (e.g., "metaphysical necessity" left primitive).  
     - Silent on:  
       - Probability-based variants.  
       - Multi-modal systems (e.g., combining epistemic and metaphysical modalities).
