answer: |-
  Here is a breakdown of settled and contested elements regarding textbook deadlocks, incorporating self-criticism:

  1.  **Settled:** Scholars universally agree that school textbooks are inherently political artefacts, reflecting and shaping national identity narratives through selective emphasis and omission, not neutral factual repositories.
  2.  **Contested:** While both US and East Asian debates involve "facts," core disagreements persist over *why* these facts are contested: US debates centre on competing **civic visions** (founding as inherently flawed vs. progressively perfectible), whereas East Asian disputes focus intensely on **mnemonic sovereignty and international standing**, where admitting past wrongs is seen as jeopardising state legitimacy and regional position.
  3.  **Settled:** It is uncontroversial among historians that historical interpretation evolves and that complex events like slavery or colonial exploitation involve contested perspectives requiring nuanced presentation beyond simple binaries.
  4.  **Contested:** The central, unresolved question fueling deadlock is **whether deep national self-criticism within foundational education inherently undermines social cohesion and patriotism, or is essential for building a resilient, ethical national identity.** Proponents see honesty as strengthening; opponents see it as destabilising.
  5.  **Self-Critique:** My diagnosis risks overhomogenising; the US debate is largely *intra*-national about civic myth, East Asia's is profoundly *inter*-national involving state sovereignty and unresolved historical trauma, suggesting different mechanisms for "survival." The "anxiety over self-criticism" link feels plausible but needs more empirical validation across cases.
