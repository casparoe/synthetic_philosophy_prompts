answer: |-
  Here's a decision tree based on concrete cases like the ghost lattice, designed to map ontological positions without requiring prior knowledge of the labels. Answer each question based on your intuitions about what "counts" as real or valid in science.

  ---

  ### **Q1: If two theories make identical predictions at all scales (like one with a "ghost lattice" and one without), must they describe the same reality?**
  - **YES (no ontological difference)** → Go to Q2.  
  - **NO (ontologies can differ)** → Go to Q3.  

  ### **Q2: Is the ghost lattice acceptable *only* if it simplifies calculations or unifies ideas?**  
  - **YES (structural value matters)** → **Structural Realist**: Reality is the structure of relations; inaccessible entities are tools, not truths.  
  - **NO (predictive power is all that matters)** → **Quinean Deflationist**: Ontology is "bookkeeping"—whatever the best predictive theory quantifies over exists.  

  ### **Q3: Could the ghost lattice be real even if it has no effect *in principle* on observations?**  
  - **YES (inaccessible entities can exist)** → **Generous Realist**: What a theory posits is real, even if undetectable.  
  - **NO (empirical idle wheels aren't real)** → Go to Q4.  

  ### **Q4: Is the ghost lattice still useful/valid as a mathematical component of the theory?**  
  - **YES (tolerate it as non-real)** → **Ghost-Neutral**: The lattice is a mathematical artifact with no "being"—like coordinates on a map.  
  - **NO (eliminate it entirely)** → **Hard Eliminativist**: Only entities with potential empirical consequences exist; reject anything superfluous.  

  ---

  ### **Key to Positions**
  1. **Hard Eliminativist**: Rejects the ghost lattice as unscientific.  
  2. **Structural Realist**: The lattice’s *relations* might matter structurally, but it isn't independently real.  
  3. **Generous Realist**: The lattice is real if the theory needs it mathematically.  
  4. **Quinean Deflationist**: Ontology is defined by the theory we pick—no deep fact about the lattice.  
  5. **Ghost-Neutral**: Uses the lattice formally but denies it has "being."  

  ---

  ### **Flagged Issues**
  - **Empty/Incoherent Combos**:  
    - *"Ontology is bookkeeping, but the ghost lattice is genuinely real"* → **Incoherent**. If ontology depends on theory choice (bookkeeping), the lattice can't be "genuinely real" independently.  
    - *"Structural simplicity matters, but inaccessible entities are forbidden"* → **Unexplored**. Structural realism typically allows non-empirical structure, but this hybrid isn't a named position.  

  - **Indistinguishable Pair** (if answers align):  
    - **Structural Realist vs. Deflationist** if you answer:  
      - Q1: YES (no ontological difference) + Q2: YES (structural simplicity counts).  
      *Why?* Both downplay ontology, but Structural Realists preserve structure as "real," while Deflationists see ontology as pragmatic. The tree separates them via Q2.  

  ---

  ### **Tree Logic**
  - **5 nodes** (Q1–Q4 + endpoints), **no citations**.  
  - **Branching Principle**: Each question forces a distinct, non-arbitrary choice (e.g., permitting idle entities vs. requiring empirical traction).  
  - **Uncovered Territory**: Positions like "inaccessible entities are real iff mathematically necessary" map to **Generous Realism** (Q3→YES).
