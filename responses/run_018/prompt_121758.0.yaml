answer: |-
  ### Exam Question:  
  **"Weber's *The Protestant Ethic and the Spirit of Capitalism* argues that Calvinist 'inner-worldly asceticism' generated a unique 'elective affinity' with rational capitalist practices. Using Weber’s framework, analyze whether *cultural values* can act as an independent causal force in economic behavior. Test this claim by comparing two hypothetical families in early modern Europe: a Calvinist banking family in 17th-century Geneva and a Lutheran merchant family in Augsburg. Assume both families had identical access to capital, legal protections, and market opportunities. Yet the Calvinists engaged in disciplined long-term reinvestment and low-risk lending, while the Lutherans prioritized short-term gains, conspicuous consumption, and higher-risk ventures. Does 'elective affinity' explain this divergence? Or is Weber’s thesis merely a post-hoc rationalization of economic conditions? In your view, can values *cause* outcomes without collapsing into material determinism?"**  

  *(Write ~600 words in 90 minutes.)*  

  ---

  ### Model Answer (Key Arguments):  
  Weber’s concept of **elective affinity** (*Wahlverwandtschaft*) offers a nuanced alternative to material determinism. It posits that Calvinist theology—predestination, worldly calling, and ascetic reinvestment—*selectively resonated* with capitalist practices not because theology *dictated* economics, but because it provided a **meaning-making framework** that incentivized specific behaviors. In Geneva, Calvinist doctrine framed profit as spiritual validation and reinvestment as moral duty. This created feedback loops: modest success reinforced ascetic habits, compounding capital.  

  In contrast, Lutheranism’s Augsburg merchants operated under a theology emphasizing faith over works and accommodating traditional social hierarchies. Conspicuous consumption (e.g., guild patronage, church donations) signaled status, while short-term gains aligned with feudal notions of "just price" and risk-taking with divine unpredictability.  

  **Counterfactual Stability**: If material conditions alone drove behavior, identical capital/legal contexts *should* produce identical practices—yet they do not. The divergence persists precisely because values reshaped *how* opportunities were perceived: Geneva’s bankers saw thrift as sacred; Augsburg’s merchants saw trade as one domain among many (family, church, community). Elective affinity thus acts as a **causal filter**, amplifying certain material possibilities while suppressing others.  

  **Reductionist Challenge**: Critics argue values merely rationalize material interests. Yet Weber’s causal chain holds if:  
  1. Theology *precedes* economic divergence (Calvinism’s 16th-century rise predates Geneva’s banking dominance).  
  2. Values *constrain choices* (e.g., Calvinists shunned luxury even when affordable).  
  3. Practices *align with doctrine* but *not* with short-term profit (e.g., rejecting high-interest loans to the immoral).  

  **Weakest Link**: Weber struggles to prove *inner psychological motivation* empirically. Diaries or sermons (e.g., "I reinvest to glorify God") might still be post-hoc justifications. Without micro-historical evidence, the argument risks being unfalsifiable.  

  **Verdict**: Values *can* cause outcomes via elective affinity—but only as an **emergent catalyst**, not a standalone force. Culture shapes *which* material options actors perceive as desirable or legitimate, making it causally significant without denying material constraints.  

  ---

  ### Marking Scheme (20 points total):  
  **A-Grade (18–20)** | **B-Grade (15–17)**  
  - **Elective Affinity vs. Determinism (4 pts)**:  
    - *A*: Explicitly contrasts affinity (non-linear, psychological resonance) with determinism (material/ideological).  
    - *B*: Defines affinity but conflates it with "influence" or "impact."  
  - **Geneva/Augsburg Comparison (6 pts)**:  
    - *A*: Uses cases as a *controlled experiment*: identical material conditions + divergent values → divergent outcomes. Tests counterfactual ("If Lutherans adopted asceticism, would practices converge?").  
    - *B*: Describes differences but doesn’t leverage the comparison to *isolate* cultural causality.  
  - **Reductionist Challenge (5 pts)**:  
    - *A*: Engages the "rationalization" critique head-on (e.g., "Values are causal if they *reconfigure* material rationality").  
    - *B*: Acknowledges critique superficially ("Some say it’s just economics").  
  - **Causal Limitations (3 pts)**:  
    - *A*: Pinpoints *verification of motivation* as Weber’s weakest link. Notes affinity’s dependence on pre-existing structures.  
    - *B*: Vaguely notes "Weber might be wrong" without specificity.  
  - **Clarity/Structure (2 pts)**: Logical flow; no summary padding.  

  ---

  ### What Would Change My Mind?  
  I currently argue **values can be causal** within Weber’s framework. I would reverse this if:  
  1. **Evidence of identical values → divergent outcomes under identical conditions** (e.g., Calvinist families in Geneva acting like Augsburg Lutherans despite shared theology). This would shatter elective affinity’s predictive power.  
  2. **Proof that "ascetic" behavior *always* served immediate material interests** (e.g., Geneva’s banking laws *required* low-risk lending, making theology irrelevant).  

  **Where My Reasoning Is Most Vulnerable**:  
  - **Teleology**: Elective affinity can imply a "destiny" (Calvinism → capitalism), ignoring contingency.  
  - **Cultural Homogeneity**: Treating "Calvinism" as monolithic overlooks internal debates (e.g., liberal vs. orthodox Geneva).  
  - **Structure as Prerequisite**: Weber assumes material conditions *allow* cultural causality—but what if material forces overpower values? (e.g., Augsburg merchants forced into risk by debt).  

  This question forces engagement with **social theory’s core problem**: how to grant culture explanatory power without divorcing it from the material world. Weber’s brilliance lies in his *via media*—but its viability hinges on historical granularity.
