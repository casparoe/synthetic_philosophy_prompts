  I'm a journalist who covers science and ideas, and I'm helping a friend put together a final for her history-of-social-theory course. I need one essay question on Weber's Protestant ethic thesis — but not teh usual "summarize Weber" assignment. The crux should be whether culture can be a cause, specifically through Weber's idea of elective affinity between an ethos and economic practice. To keep it from being pure memorization, build in a comparative hook: ask students to compare a Calvinist banking family in 17th-century Geneva with a Lutheran merchant family in Augsburg, both with identical capital access and legal protections, but showing different lending practices and risk attitudes. The prompt should ask whether inner-worldly asceticism explains teh divergence, or if it's just a post-hoc rationalization of market position — in other words, can values do causal work without collapsing into material conditions?

  Please write the exam question (upper-level undergrad, 90 minutes, ~600 word answer expected), a model answer, and a marking scheme out of 20 points. The scheme should seperate an A from a B by naming specific moves: distinguishing elective affinity from determinism, using the Geneva/Augsburg comparison to test counterfactual stability, addressing the reductionist challenge, and pinpointing where teh causal claim is weakest. Don't ask for bibliographies or citations — this has to work for someone answering offline.

  Also, say what would change your mind about whether values can genuinely cause economic outcomes: which argument or consideration would flip your verdict, and where is your reasoning most likely to fail?
