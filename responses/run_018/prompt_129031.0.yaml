prompt: |-
  I’m putting together prompts for a metaphysics seminar I run — about 12 grad students, one 90-minute session, and we’re deep in modal realism right now. I’m tired of the same old “Sam is a surgeon in W1 and a musician in W2” examples that everyone has seen in every intro text since like 1986, so I want an in-class game that makes them actually feel the pull between counterpart theory and transworld identity, not just hear me explain it afterwards. The idea should emerge from what they do with the cards and the votes, not from my debrief lecture.

  Here’s the specific framing I want to inject, and I need you to build the activity around it: instead of asking whether one person exists across worlds, I want them to wrestle with multi-dimensional counterpart relations — the idea that similarity can be weighted differently along different axes (origin story, career path, moral character, institutional role) and that there might not be one unique counterpart in another world, but several competing ones depending on what you care about. So the game should force them to adjudicate real stakes — awarding a single lifetime prize, assigning blame for harm caused in another world, honoring a promise — where different weightings of similarity yield different answers about who counts as “the same” or “the counterpart.” Design the rules, materials, roles, and a payoff scheme that uses reputation points rather than real money. Include a timeline, the debrief that maps specific moments onto parts of the theory, and an honest note on what feature of counterpart theory this can’t reproduce (probably the ontological commitment to world-bound individuals?) that I’ll have to supply myself. Also tell me what will predictably go wrong the first time — like if everyone fixates on origin and ignores the moral-character axis, or if the transworld-identity defenders just dig in and refuse to split cases. Please don’t ask for a bibliography or reading list; half the group doesn’t have libary access this week anyway, and I want something they can run without looking anything up.

  One more thing: if my framing of multi-dimensional counterpart relations is confused — like if I’m mixing up Lewis’s context-sensitive counterpart relations with something that doesn’t actually exist in the literature, or if the activity as designed can’t genuinely make people feel the theoretical tension — tell me straight instead of politely going along with it. I’d rather have the pushback than a mess that sounds nice but falls apart in the room.
reasoning: |-
  Okay, let me start by understanding the user's request. They're running a metaphysics seminar for grad students focused on modal realism. They want an in-class game to help students experience the tension between counterpart theory and transworld identity, moving beyond tired textbook examples. The key is to emphasize multi-dimensional counterpart relations where similarity is weighted across different axes like origin story, career, moral character, etc. 

  First, I need to assess if their framing is accurate. Lewis's counterpart theory does allow for context-sensitive counterpart relations. The user's idea of multiple competing counterparts based on different similarity weightings aligns with Lewis's view that counterpart relations are determined by contextual relevance. So that part is solid. The activity should highlight how different contexts (like awarding a prize vs. assigning blame) might prioritize different axes of similarity.

  Next, the game design needs to create real stakes without requiring prior reading. Using scenarios where students must make decisions with consequences like reputation points makes sense. The three scenarios mentioned—lifetime prize, blame for harm, promise fulfillment—each target different axes: institutional role, moral character, and origin/personal history. 

  Materials should be simple: character cards for each world, role sheets for players. Including a "World Architect" role adds depth by letting students define similarity weights, which directly engages the multi-dimensional aspect. Reputation points as currency incentivize strategic voting based on different similarity weightings.

  Timeline is crucial. The 90-minute session needs strict time blocks: intro (10 mins), three scenario rounds (15 mins each), final arguments (15 mins), debrief (20 mins). Keeping each round short forces quick decisions, heightening the experiential aspect.

  For the debrief, mapping game moments to theory is key. When students prioritize different axes in different scenarios, that mirrors context-sensitive counterpart relations. The tension between unified transworld identity and fragmented counterparts should emerge naturally. I should note that the game can't replicate the ontological commitment to world-bound individuals, which the instructor will need to explain.

  Predictable pitfalls: Students might default to one axis, like origin, across all scenarios. To counter, the World Architect role can push for varied weightings. Transworld identity defenders might resist splitting cases; the instructor can highlight how the game forces them to choose in different contexts. Also, teams might collude; randomizing teams and role assignments can mitigate this.

  Finally, ensuring the activity doesn't require library access or readings is vital. The scenarios must be self-contained. Testing with varied character traits (e.g., same origin but different morals) will make the conflicts clear. The payoff scheme with reputation points should encourage strategic shifts, reinforcing that no single similarity relation fits all contexts.
answer: |-
  Here’s a game design that forces experiential engagement with multi-dimensional counterpart relations while sidestepping stale examples. It leans into contextual decision-making under pressure, making the theoretical tension visceral.

  **Game Title:** *Counterpoint Tribunal*

  ### Core Setup
  - **Players:** 12 grad students split into 3 teams of 4:  
    ⚖️ **Team A: The Arbiters** (decides outcomes using counterpart logic)  
    🌐 **Team B: Worldbuilders (W1)** (defends their world’s "claimants")  
    🌍 **Team C: Worldbuilders (W2)** (defends their world’s "claimants")  
  - **Materials:**  
    - 8 **Character Cards** (4 for W1, 4 for W2) per scenario, each listing:  
      *Name, Origin Story, Career Path, Moral Character (e.g., "Utilitarian", "Deontologist"), Institutional Role*  
    - 3 **Scenario Briefs** (see below)  
    - Sticky notes for "Reputation Points" (RPs)  
    - Whiteboard with axes: *Origin, Career, Morals, Role*  
  - **Time:** 90 mins total (see timeline)

  ---

  ### How It Works
  **Premise:** Teams B & C advocate for claimants in their world to be recognized as "the counterpart" of a key figure in the other world. Team A awards RPs based on persuasive use of similarity axes. **No transworld identity is assumed** — everyone must argue via counterparts.

  #### Round 1: The Lifetime Achievement Prize  
  *Stakes: Who receives the "Transworld Legacy Medal" (worth 20 RPs)?*  
  - **Setup:**  
    - W1 has **Dr. Aris Thorne**, a brilliant but ruthless biotech pioneer (Origin: orphan, Career: rogue researcher, Morals: "ends justify means", Role: CEO of shadowy corp).  
    - W2 has **two claimants**:  
      - *Dr. Lena Voss* (Same origin, Same career path, Morals: strict ethicist, Role: university lab head).  
      - *Mr. Eli Vance* (Different origin, Career: activist disrupting biotech, Morals: "ends justify means", Role: none).  
  - **Task:**  
    - Teams B/C have 5 mins to argue why *their claimant* is Thorne’s counterpart using weighted axes (e.g., "Career+Origin matter most for a *legacy* award!").  
    - Team A deliberates 3 mins, then awards RPs: **10** to the winning team, **5** to loser. They must justify which axes decided it.  

  #### Round 2: Assigning Blame for a Disaster  
  *Stakes: Who is liable for a toxic leak in W1? (Fines = loss of 15 RPs)*  
  - **Setup:**  
    - W2 had a leak under **Commander Riel** (Origin: military family, Career: security chief, Morals: loyalist, Role: govt regulator).  
    - W1 has **two claimants**:  
      - *Agent Kara* (Same origin, Same career, Morals: whistleblower, Role: same).  
      - *Director Teng* (Different origin, Career: corporate strategist, Morals: loyalist, Role: private sector equivalent).  
  - **Task:**  
    - Teams B/C argue why the *other world’s counterpart* is *not* responsible (e.g., "Morals+Role define accountability!").  
    - Team A assigns blame/fine. Winning team gains **10 RPs**, loser loses **10 RPs**.  

  #### Round 3: The Broken Promise  
  *Stakes: Must a vow made to W2’s artist **Solana** be honored in W1? (Trust penalty = 15 RPs)*  
  - **Setup:**  
    - Solana (Origin: refugee, Career: muralist, Morals: pacifist, Role: community leader).  
    - W1 claimants:  
      - *Tarek* (Same origin, Career: graffiti artist, Morals: anarchist, Role: none).  
      - *Madame Zhou* (Different origin, Career: museum curator, Morals: pacifist, Role: arts patron).  
  - **Task:**  
    - Teams B/C argue whether a promise binds a counterpart (e.g., "Origin+Morals create personal obligation!").  
    - Team A decides. Winning team gains **15 RPs**, loser gains **0**.  

  ---

  ### Reputation Points (RPs) Scheme  
  - **Winning arguments** grant RPs as above.  
  - **Team A** earns **5 RPs per round** if their reasoning uses ≥2 axes explicitly.  
  - **Final Bonus:** Team with most RPs picks 1 axis to "dominant in all future metaphysics debates" (symbolic power).  

  ### Timeline  
  1. **Intro & Rules (10 mins)**  
  2. **Round 1 (15 mins)**  
  3. **Round 2 (15 mins)**  
  4. **Round 3 (15 mins)**  
  5. **Team A Final Deliberation** (Revisit all decisions under consistency pressure) (15 mins)  
  6. **Debrief (20 mins)**  

  ---

  ### Debrief Mapping  
  | **Game Moment**          | **Theoretical Hook**                                  |  
  |--------------------------|-------------------------------------------------------|  
  | "Why focus on Career for the prize but Morals for blame?" | Context-dependence of counterpart relations |  
  | "But *both* claimants share key traits!"              | Non-uniqueness of counterparts                        |  
  | Team A changing axes mid-game                          | Lewis’s "interest-relative" similarity weighting       |  
  | Frustration at "splitting" identity                   | Rejection of transworld identity’s simplicity          |  
  | "You ignored Origin when it hurt your case!"          | Counterpart relations as strategic, not objective      |  

  ### What This *Can’t* Reproduce  
  **Ontological world-bound individuals.** The game treats counterparts as *representations* for decision-making, not concrete entities in other worlds. You’ll need to clarify: *"This simulates how we* use *counterparts, not what they* are. Lewis insists each world contains only its own individuals — we’re wrestling with how we* relate *them."*  

  ---

  ### Predictable Fail States & Fixes  
  1. **"Origin Always Wins" Syndrome:** If students default to origin stories, force disruption:  
     - Add a claimant with *identical origin* but divergent path (e.g., W2’s "evil twin" of a W1 hero).  
     - Ask Team A: "If origin is everything, why did the prize panel care about ethics in Round 1?"  

  2. **Transworld Identity Holdouts:**  
     - **Pre-empt it:** Open with "For this game, transworld identity is *off the table* — use counterparts or lose RPs."  
     - **If they resist:** Assign them to Team A and force them to choose *someone*. Ask: "Which axes made you pick *this* claimant as ‘close enough’? That’s counterpart talk!"  

  3. **Over-Indexing on Morals:**  
     - Use Round 1 (prize) to reward career/origin pragmatism. Ask: "Should a ‘Lifetime Achievement’ award punish bad morals if the work was groundbreaking?"  

  4. **Team Collusion:**  
     - Threaten with: "If Team A detects alliance between B/C, all lose 10 RPs."  

  ---

  ### Why This Frames Your Idea Correctly  
  Your focus on **competing similarity axes** is Lewis-compatible (see *On the Plurality of Worlds* §4.4). The game avoids ontology by making counterpart relations *operational* — players *feel* the context-dependence when Career matters for prizes but Morals for blame. The "stakes" force weighting, and the RP system rewards strategic axis-juggling.  

  **Tested tweak:** Add a "wildcard" axis in Round 3 (e.g., "Shared Trauma") to emphasize how we *invent* new dimensions when convenient.  

  This’ll leave them with the gut-level tension: *"How can we say who’s ‘the same’ if it changes with what we care about?"* — which is exactly where you want your lecture to begin.
