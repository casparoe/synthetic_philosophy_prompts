answer: |-
  ### 1. The move it was asked to do
  Your colleague invoked "revolutions devour their own children" to dismiss contingency-based explanations of the Terror (e.g., Robespierre’s choices, Girondin collapse, or 1793–94 dynamics). They implied the purge was *structurally predetermined* by the revolution’s inherent logic, making contingent factors irrelevant. The slogan served as a rhetorical veto against accounts emphasizing historical accidents, framing the Terror’s leadership purges as an unavoidable outcome once revolution commenced.

  ---

  ### 2. The menu: eight readings

  **1. Tautological Reading**  
  - *Claim*: Revolutions eliminate early leaders by definition.  
  - *Mechanism*: Semantic (linguistic).  
  - *Scope*: All revolutions.  
  - *Form*: Trivially true ("children" ≡ purged leaders).  
  - *Verdict*: Trivial.  
  - *Debate use*: Rarely intended, as it explains nothing.  

  **2. Cyclical Historical Pattern**  
  - *Claim*: Post-revolutionary purges recur empirically (e.g., French, Russian, Iranian revolutions).  
  - *Mechanism*: Institutional (power struggles in unstable regimes).  
  - *Scope*: Most major revolutions.  
  - *Form*: Explanatory (pattern invites structural causes).  
  - *Verdict*: Defensible but descriptive, not predictive.  
  - *Debate use*: Common; implies "this always happens."  

  **3. Ideological Purity Mechanism**  
  - *Claim*: Revolutionary ideals demand escalating radicalism, condemning moderates as traitors.  
  - *Mechanism*: Ideological (radicalization via utopian goals).  
  - *Scope*: Ideologically driven revolutions.  
  - *Form*: Explanatory (ideology drives purges).  
  - *Verdict*: Defensible for French case; less universal.  
  - *Debate use*: Frequent (e.g., Robespierre’s virtue/terror link).  

  **4. Psychological Inevitability**  
  - *Claim*: Revolutionary actors inevitably become paranoid, perceiving betrayal.  
  - *Mechanism*: Psychological (group dynamics under threat).  
  - *Scope*: All revolutions facing counter-revolution.  
  - *Form*: Modal (likely under revolutionary stress).  
  - *Verdict*: Overstated; ignores variable leadership responses.  
  - *Debate use*: Sometimes implied ("atmosphere of suspicion").  

  **5. Structural-Systemic Necessity**  
  - *Claim*: Revolutions destroy existing institutions, creating power vacuums that force violent consolidation.  
  - *Mechanism*: Structural (collapse of state monopoly on force).  
  - *Scope*: All social revolutions.  
  - *Form*: Modal (inevitable in revolutionary anarchy).  
  - *Verdict*: Substantive/defensible if qualified.  
  - *Debate use*: **Most likely invoked**—frames purges as systemic, not personal.  

  **6. Normative Warning**  
  - *Claim*: Revolutions *should be avoided* because they consume their architects.  
  - *Mechanism*: Moral/political (cautionary tale).  
  - *Scope*: All revolutions.  
  - *Form*: Normative (not explanatory).  
  - *Verdict*: Not a historical claim.  
  - *Debate use*: Occasionally, but off-point for causality debates.  

  **7. Metaphorical Truism**  
  - *Claim*: Revolutions generate destructive energy harming participants.  
  - *Mechanism*: Poetic (no precise mechanism).  
  - *Scope*: All revolutions.  
  - *Form*: Metaphorical (offers imagery, not theory).  
  - *Verdict*: Neither true nor false analytically.  
  - *Debate use*: Often a fallback when challenged.  

  **8. Hard Determinism**  
  - *Claim*: Given initial revolutionary conditions, purges were physically/socially inevitable.  
  - *Mechanism*: Structural (historical laws).  
  - *Scope*: All revolutions.  
  - *Form*: Modal (true in all possible worlds with revolution).  
  - *Verdict*: False (denies agency, contingency).  
  - *Debate use*: Rarely explicit but rhetorically latent.  

  ---

  ### 3. Which ones actually block contingency?
  - **Cyclical Pattern (#2)**: Does *not* block contingency. Recurrence suggests common pressures, not identical outcomes; contingent factors (e.g., Girondin tactics) explain *which* leaders are purged and when.  
  - **Ideological Purity (#3)**: Compatible with contingency. Ideology creates pressures, but *how* they manifest (e.g., Robespierre’s choices) remains contingent.  
  - **Psychological (#4)**: Weakly challenges contingency. If paranoia is near-universal under revolution, it constrains—but doesn’t eliminate—agency in escalation.  
  - **Structural-Systemic (#5)**: **Partially blocks** for leadership purges *in general*. Vacuums necessitate violence, but the *targets, timing, and scale* (e.g., Thermidor’s specifics) remain contingent.  
  - **Hard Determinism (#8)**: **Fully blocks** contingency but is indefensible. History lacks such laws.  

  *Result*: No substantive reading *fully* excludes contingency. Even strong structural claims (#5) accommodate contingent *variations* within necessary outcomes. The slogan cannot negate Robespierre’s agency or Girondin errors—it only suggests purges were broadly likely.

  ---

  ### 4. Pushback on the framing
  Your framing is **sound**, and the exercise is useful. The slogan *is* often deployed as a thought-terminating cliché, but it *can* bear argumentative weight when disambiguated. However, its typical use in debates (reading #5) **overreaches**. Structural pressures made *some form* of violent consolidation likely, but they don’t dictate the Terror’s specific course or absolve actors of responsibility. Contingency explanations (e.g., failed Girondin compromises, Committee of Public Safety’s ad-hoc decisions) remain essential for explaining *how* generic revolutionary dynamics produced the *particular* events of 1793–94. The slogan masks this nuance.
