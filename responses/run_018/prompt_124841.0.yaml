  For the rational-choice angle, Odysseus's actions fit a Ulysses contract: recognizing future irrationality (Sirens' lure), binding himself physically (hard commitment). But Homer complicates it—Odysseus tells the crew to ignore his future commands, which is strategic delegation. The crew's lack of full understanding undermines the democratic precommitment idea, making it more hierarchical.

