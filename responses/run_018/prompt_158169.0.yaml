answer: |-
  You've hit on a core tension in disjunctivism brilliantly, and your suspicion that you might be slightly misrepresenting the view is astute. Let's unpack this carefully – your core insight is largely correct, but the details about the "mental factor" in hallucination need refinement. Here's the breakdown:

  **1. Clarifying the Disjunctivist Stance (Correcting the Misrepresentation):**

  *   **Not "No Mental State At All":** Most disjunctivists (like McDowell, Snowdon, Martin) **do NOT claim hallucinations involve "no mental state" or "no phenomenology."** That *would* be changing the subject dramatically and implausibly (as you rightly sense!). Instead, they typically argue that hallucinations involve a mental state, but it is **fundamentally different in kind** from the mental state involved in veridical perception. Hallucinations *have* subjective character ("what it's like"), but they lack the specific *relational, object-involving* character of genuine perception.
  *   **The Core Disjunctive Claim:** The disjunct is: Either (Good Case) I am *perceiving* an actual object O (a direct, non-representational, relational state), or (Bad Case) I am *hallucinating* an object that seems like O (a state with subjective similarity but lacking the relational connection). Crucially, **the hallucinatory state is not a perception** – it's something else.
  *   **Denying a Common *Fundamental* Kind:** The disjunctivist rejects that the good case and the bad case are instances of the *same fundamental kind of mental state* (e.g., an "experience" defined by its intrinsic representational or phenomenal properties, independent of the world). They reject a **common factor** that *constitutes* both states and explains their subjective similarity. They *accept* subjective similarity but deny it arises from an identical underlying mental state type.

  **2. How This Engages the Argument from Illusion (AFI):**

  *   **AFI Premise:** "In a hallucination, the subject has an experience that is subjectively indistinguishable from a veridical perception of object O."
  *   **Disjunctivist Response:** They **accept the indistinguishability claim** phenomenologically (from the subject's perspective). *However*, they **reject the inference** drawn from it:
      *   **The Inference AFI Relies On:** Because the hallucinatory experience is subjectively indistinguishable from a veridical perception, both must share an identical core mental component (the "common factor" or "highest common factor") – the experiential content itself. Veridical perception is this core component *plus* a relation to the world; hallucination is just the core component.
      *   **Disjunctivist Rejection:** The disjunctivist argues that indistinguishability **does not necessitate a common underlying mental state type**. The subjective similarity could arise *despite* the states being fundamentally different kinds of things. The good case is fundamentally relational; the bad case is fundamentally non-relational (or relationally deficient). They deny the *explanatory* common factor.
  *   **Why AFI Fails (Disjunctivist View):** AFI fails not *simply* by denying a common factor (naive realists might do that without being disjunctivists), but by **denying that the subjective indistinguishability implies that both states belong to a common mental kind defined by intrinsic properties**. AFI assumes that phenomenal character is constituted independently of the world; disjunctivists (especially relationalists) deny this for the good case.

  **3. Accounting for Reports and Phenomenology in Hallucination:**

  *   **"Feels Like Seeing":** Disjunctivists **DO NOT say subjects are lying or that their reports are "just false behavioral outputs."** This is the critical correction to your initial worry. They grant the *reality of the subjective experience* in the bad case.
  *   **The Explanation:**
      *   **Subjective Indistinguishability:** The hallucinatory state is *designed* (by evolution, neurobiology, whatever) to be subjectively indistinguishable *to the subject* from a veridical perception of O. This is a brute fact about the neurocognitive system.
      *   **Reporting the Phenomenology:** When a subject reports "I see a dagger," they are accurately reporting their *subjective state*: it genuinely *seems* to them as if they are seeing a dagger. This report is true *about their phenomenology*. The disjunctivist *does not deny this phenomenology exists*.
      *   **Mistake about the *Nature* of the State:** Where the subject *might* be mistaken (though they aren't necessarily making this theoretical claim in their report) is in *what kind of state they are in*. They are *not* in a state of seeing a dagger (the relational state); they are in a state of hallucinating a dagger (a different kind of state that feels the same subjectively). The report "I see" might be false about the external world and the *relational status* of the state, but it's true about how things appear.
      *   **The Mental Property:** The hallucination has the mental property of **seeming to see O** or **having an experience as of O**. This is a genuine mental property with phenomenal character. The disjunctivist simply insists this property is *not* the same property as *actually seeing O*, and crucially, that *actually seeing O* is not constituted by having an "as of O" experience plus something else. The "as of O" experience is a different *kind* of mental state entirely.

  **Brainstorming Summary & Correction:**

  *   **Correct Insight:** You are absolutely right that disjunctivists attack the AFI by fundamentally challenging the *premise* that subjective indistinguishability implies a common mental state kind. They don't just reject the common factor; they reject the inference that leads to positing it as the core component of *both* states.
  *   **Key Correction:** Disjunctivists **DO NOT deny hallucinations have phenomenology or are mental states**. They deny that the mental state in the hallucination is the *same fundamental kind* as the mental state in veridical perception. Hallucinations have the mental property of *seeming* or *appearing*, which has its own phenomenal character.
  *   **Reporting:** Subjects' reports are true about their *subjective experience* ("it looks/seems like there's a dagger"). The disjunctivist explains this by positing a distinct kind of mental state (hallucination) that is subjectively indistinguishable from the relational state (perception). The report isn't just "false behavioral output"; it's a true report of a genuine, but non-relational, mental state.
  *   **The Wall You're Hitting:** It's likely the wall of **metaphysical commitment**. Disjunctivism requires accepting that two fundamentally different kinds of states (relational perception vs. non-relational hallucination) can be subjectively indistinguishable. This seems counterintuitive to the common-factor theorist who thinks indistinguishability *must* stem from identical intrinsic properties. The disjunctivist argues this intuition is mistaken – indistinguishability is an epistemological fact about the subject's perspective, not a metaphysical fact about the underlying nature of the states.

  **In essence:** Disjunctivists bite the bullet on the epistemology (yes, they feel the same) to preserve the metaphysics (no, they are not the same kind of thing). Hallucinations have mental properties and phenomenology, but these are properties of a *sui generis* state of "seeming" or "appearing," not properties of a failed or detached instance of the relational state "seeing." This is how they reject AFI's core inference without denying the subject's experience altogether. Keep pushing – you're grappling with the hardest part!
