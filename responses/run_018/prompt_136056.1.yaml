  ### Stepwise Decision Procedure for Classroom Expression Complaints

  **Brainstorming Translation to Operational Tests**:
  - **L-layer**: Simplify to "Is the word universally recognized as a slur (e.g., in dictionaries, common usage)?" *Must survive*: Core derogatory semantic content vs. mere connotation. *Droppable*: Etymological history unless commonly known.
  - **P-layer**: Simplify to "Was the word used to insult, demean, or express contempt based on context (tone, target, audience reaction)?" *Must survive*: Contempt activation via use, not just word presence. *Droppable*: Distinctions between implicature types.
  - **F-layer**: Simplify to "Was the word part of teaching, quoting, analysis, or critique?" *Must survive*: Frame's role in suppressing contempt. *Droppable*: Subtypes of frames (e.g., pedagogical vs. meta-linguistic).
  - **R-layer**: Simplify to "Did an in-group member use it about themselves to peers in a supportive setting?" *Must survive*: In-group reclamation intent. *Droppable*: Semantic bleaching nuance (handled via judgment hand-off).

  **Decision Procedure Flowchart (Word-Based)**:
  1. **L-layer Check**:  
     - *Operational Question*: "Is the word inherently derogatory (e.g., a recognized slur)?"  
     - *Sufficient Answer to Proceed*: Yes → Go to Step 2.  
     - *Stop Condition*: No → Clear non-violation (lexical derogation absent).  

  2. **F-layer Check**:  
     - *Operational Question*: "Was the word used in teaching, quoting, analysis, or critique?"  
     - *Sufficient Answer to Proceed*: Yes/No → Go to Step 3.  
     - *No Stop/Hand-off*: Proceed regardless.  

  3. **P-layer Check**:  
     - *Operational Question*: "Did the context activate contempt (e.g., insulting tone, targeted use, audience harm)?"  
     - *Sufficient Answer to Proceed*: Yes → Go to Step 4.  
     - *Stop Condition*: No → Clear non-violation (contempt not activated).  

  4. **R-layer Check** (if L-layer = Yes and P-layer = Yes):  
     - *Operational Question*: "Was the speaker in the targeted group, addressing in-group/ally peers, with clear reclamation intent?"  
     - *Sufficient Answer to Proceed*: Yes → Hand-off to judgment (professor + Dean).  
     - *Stop Condition*: No → Clear violation.  
     - *Hand-off Condition*: Yes → Requires human judgment on bleaching efficacy.  

  **Final Determinations**:  
  - **Clear violation**: P-layer active without F/R-layer suppression.  
  - **Clear non-violation**: L-layer absent, P-layer absent, or F-layer neutralizes P-layer.  
  - **Hand-off to judgment**: R-layer conditions met (requires bleaching assessment).  

  ---

  ### Application to Complaints

  #### (a) Sociology professor quotes racial slur in lecture  
  - **L-layer**: True (slur is inherently derogatory).  
  - **F-layer**: True (historical quotation in institutional racism lecture).  
  - **P-layer**: False (frame redirects contempt to subject matter, not speaker intent).  
  - **R-layer**: False (professor not in targeted group).  
  - **Procedure Output**: Clear non-violation.  
  - **Reasoning**: F-layer suppresses P-layer; no contempt activated in pedagogical context.  

  #### (b) Student uses reclaimed anti-gay slur in peer presentation  
  - **L-layer**: True (slur is inherently derogatory).  
  - **F-layer**: False (not analytical; used assertively in presentation).  
  - **P-layer**: False (self-referential, in-group context negates contempt).  
  - **R-layer**: True (in-group speaker, ally audience, reclamation intent).  
  - **Procedure Output**: Clear non-violation.  
  - **Reasoning**: P-layer absent despite L-layer; R-layer irrelevant as contempt not activated.  

  #### (c) Student discusses gendered slur in philosophy seminar  
  - **L-layer**: True (slur is inherently derogatory).  
  - **F-layer**: True (meta-linguistic analysis frame).  
  - **P-layer**: False (no target, analytical intent).  
  - **R-layer**: False (not in-group reclamation).  
  - **Procedure Output**: **Undesired clear non-violation** (P-layer absent per procedure).  
  - **Reasoning**: F-layer suppresses P-layer, but harm from acoustic presence is procedurally invisible.  

  ---

  ### Limitations of the Procedure  
  1. **Acoustic Harm**: Misses trauma from slur utterance regardless of context (e.g., Case c).  
  2. **Bleaching Ambiguity**: Cannot autonomously judge if a term is "reclaimed enough" for R-layer neutralization.  
  3. **Power Dynamics**: Ignores harm amplification when speakers hold institutional power (e.g., professors vs. students).  
  4. **Audience Diversity**: Overlooks differential impact on listeners (e.g., targeted group members in "ally" settings).  
  5. **Intent-Affect Gap**: Prioritizes speaker intent over audience affect, missing reported harm without contempt intent.  
  6. **Unavoidable Judgment**: Human sign-off required when:  
     - R-layer conditions are met (bleaching assessment).  
     - P-layer activation is ambiguous (tone/context disputes).  
     - F-layer efficacy is contested (e.g., failed suppression).  

  ---

  ### Structured Deliverables

  #### Table: Decision Procedure Steps  
  | Step | Operational Question | Sufficient Answer for Proceed | Stop / Hand-off Condition | Judgment-Call Flag |  
  |------|----------------------|-------------------------------|---------------------------|---------------------|  
  | 1    | Is the word inherently derogatory (e.g., a recognized slur)? | Yes | Stop: No sanction if No | None |  
  | 2    | Was the word used in teaching, quoting, analysis, or critique? | Yes/No | Proceed regardless | None |  
  | 3    | Did the context activate contempt (insult, targeting, harm)? | Yes | Stop: No sanction if No | Context/tone interpretation |  
  | 4    | (If L/P = Yes) Was the speaker in the targeted group, addressing in-group/ally peers, with reclamation intent? | Yes | Hand-off to judgment if Yes; Stop: Violation if No | Group membership, intent, audience composition |  

