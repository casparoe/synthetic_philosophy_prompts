  The procedure systematizes your framework but exposes trade-offs: it ensures consistency in clear cases but cannot eliminate judgment for R-layer bleaching or non-contempt harms. Use it as a first-pass filter, reserving human sign-off for ambiguities where institutional ethics require nuance.
