  Hmm, better avoid yes/no questions. Each should open a conceptual can of worms. For example, on structural rationality: "If discounting commitments is irrational, why is it rational for impersonal goods?" Followed by: "Doesn't that make us inconsistent moral agents?" That should spark depth. 

