answer: |-
  Here are 9 tight, mechanics-focused questions for your podcast, designed to probe the philosopher's "identity-constituting discounting" framework while hitting your specific requests:

  1.  **The Core Distinction & Impersonality:** "You argue pure time preference is rational for *impersonal goods* but irrational for *identity-constituting commitments*. Can you unpack that distinction clearly? When does a future benefit or cost stop being 'impersonal' and become tied to *who I fundamentally am*? Is it about the *type* of good (like my child's future vs. a stranger's) or the *strength* of my commitment?"
      *   *(Follow-up if needed: "Give us a concrete example where applying a discount rate feels intuitively wrong because it's identity-constituting.")*

  2.  **Slaying the Neutrality Dragon:** "The classic 'temporal neutrality' argument says mere location in time is morally irrelevant. How does your framework specifically counter this? Does your 'identity-constituting' exception expose a flaw in the neutrality principle itself, or does it carve out a special domain where neutrality *shouldn't* apply?"

  3.  **Climate vs. Kid's College:** "Let's get concrete on intergenerational ethics. Under your view, why is it arguably *irrational* for me to heavily discount saving for *my own child's future college* (an identity-constituting commitment), but potentially *rational* for society to use a positive pure time preference rate when evaluating costs to *future strangers* from climate change (an impersonal good)? Doesn't this create a tension for someone who feels a strong *commitment* to future generations?"

  4.  **Structural Rationality - The Setup:** "You often appeal to 'structural rationality' – the idea that discounting identity-defining commitments undermines the agency required to *be* that committed self across time. Can you walk us through that argument? How does discounting *now* sabotage my ability to *be* the person invested in that *future* commitment?"

  5.  **Structural Rationality - The Sharp Follow-Up:** "Okay, granting the structural point about *my own* commitments... Doesn't this just push the problem to the interpersonal level? If *my* structural rationality forbids discounting my kid's future, but *allows* me to discount a future climate victim's welfare (as an impersonal good), haven't we just replaced temporal arbitrariness with an arbitrariness about *which beings count as part of my identity-structure*? What protects that boundary from being arbitrary?"

  6.  **Lexical Priorities & The Slippery Slope:** "Critics might worry your view leads to extreme conclusions. If avoiding a small harm *right now* to an identity-constituting commitment (e.g., missing my daughter's recital to prevent a distant future catastrophe) is structurally irrational, does this imply *lexical priority* for near-term identity commitments over vast, impersonal future harms? Where's the line?"

  7.  **The Zero-Rate Camp Challenge:** "Many climate economists (like Stern, Heal) argue for a *zero* pure rate of time preference for intergenerational impacts, precisely because discounting future lives is seen as ethically indefensible. How does your 'identity-constituting discounting' framework engage with this position? Does it offer a *justification* for a positive rate in climate models that the zero-rate camp misses, or does it sidestep their core ethical concern about valuing future lives less?"

  8.  **Fluidity of Identity:** "Identity isn't always static. What happens if my core commitments *change* significantly over time? Does discounting become rational for a *past* commitment I no longer identify with? And conversely, if I *develop* a deep commitment to, say, preserving a wilderness for the deep future, does discounting the costs of achieving that *become* irrational where it wasn't before?"

  9.  **The Aggregation Problem:** "How does your theory handle trade-offs *within* the domain of identity-constituting commitments? If I have multiple deep commitments conflicting across time (e.g., saving for retirement vs. funding my child's education *now*), is *some* discounting rational *between* them? Or is that structurally irrational too?"

  **Why this works:**

  *   **Direct & Mechanical:** Dives straight into the conceptual machinery of her theory (distinction, counterarguments, structural rationality, implications).
  *   **Hits Your Requests:** Explicitly covers neutrality (Q2), climate vs. personal future (Q3), structural rationality setup/follow-up (Q4 & Q5 - the *sharp* one), lexical priorities (Q6), and the zero-rate camp (Q7).
  *   **Probes Tensions:** Questions like Q3, Q5, Q6, and Q8 directly challenge potential inconsistencies or extreme implications.
  *   **Practical & Concrete:** Uses relatable examples (kid's college, recital, retirement savings) to ground abstract philosophy.
  *   **Loose but Focused:** Conversational framing ("Can you unpack...?", "Let's get concrete...", "Critics might worry...") without sacrificing depth. Avoids academic jargon overload.
  *   **Flow:** Starts with core ideas (Q1), moves to major objections (Q2, Q3), dives deep into her key defense (Q4, Q5), explores boundaries and implications (Q6, Q7, Q8), and ends with a practical aggregation issue (Q9).

  **Tips for Delivery:**

  *   **Listen Actively:** Her answers to Q1 and Q4 will set up follow-ups naturally. Be ready to jump off her points.
  *   **Clarify Examples:** If an answer feels abstract, gently ask: "Can you give us a real-world scenario where that plays out?"
  *   **Embrace the Tension:** Don't shy away from the challenging follow-ups (especially Q5 & Q6). That's where the gold is for a podcast.
  *   **"Keep it Loose":** Use the questions as a framework, not a rigid script. Adapt based on her energy and the conversation's flow.

  Good luck with the interview! This is fascinating territory.
