  ## Frame Problem Refrain

  Steam whispers from the kettle's spout,
  fingers fumble the chipped blue mug.
  A crack! Ceramic hits the ground.
  **frame intact — no other variables changed.**

  Brown puddle spreads on linoleum,
  cold tea soaking yesterday's news.
  Sock gets damp, a sharp edge gleams.
  **frame intact — no other variables changed.**

  Foot recoils, a tiny bead
  of blood blooms bright beside the shards.
  A sigh escapes, the shoulders slump.
  **frame intact — no other variables changed.**

  Sugarbowl knocked? Spoon on the floor?
  Later, maybe, a muttered "clumsy git."
  That favourite cup, gone. Trust feels thin.
  **frame intact — no other variables changed.**

