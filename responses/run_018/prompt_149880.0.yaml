  ## Toast for Dr. Elena Vasquez

  **(Raise your glass, smile warmly at the room)**
  Friends, family, colleagues… and let’s be honest: a significant contingent of people who probably just heard the word ‘consequentialism’ for the first time ten seconds ago! Welcome. We’re here tonight for Elena. Thirty years! Thirty years wrestling with one of the deepest, most persistent worries we have about morality: does it ask *too much* of us?

  Now, if you’re one of Elena’s philosophical colleagues, your mind just raced through a library of arguments. But for everyone else, picture this: Imagine if every time you bought a coffee, or booked a holiday, or even just… sat still for a moment, a little voice insisted you *could* instead be donating that money to save a life, or volunteering somewhere. That feeling, that pressure – that’s the core of what Elena spent her career exploring. The worry that truly doing the *right* thing might demand we give up almost everything that makes life feel like *our* life.

  **(Gesture subtly towards the philosopher side)**
  Her colleagues know the intricate maps Elena drew through this terrain. But here’s something fascinating, something maybe even *they* don’t always see as clearly as those of us who share her daily life: **(Gesture subtly towards the family/friends side)**. Because Elena didn’t just *study* this question, she lived alongside it. And here’s the real twist.

  We often think about demandingness as a question of *quantity*. How much money? How much time? How big is the sacrifice? That’s crucial. But Elena’s work, and actually, watching *her* live, points to something else, something quieter but maybe even more profound. It’s not just *how much* we give, but *how* we are asked to give, and what that does to the texture of our lives.

  **(Shift tone slightly more reflective)**
  Think about ordinary life. The easy chat over breakfast, the walk taken just because you enjoy the company, the gift given purely for the joy of giving. These things aren't grand sacrifices. They’re the quiet background noise of being human, of connection. Elena showed us that the deeper worry isn’t just giving up luxuries, but the fear that morality might turn every small choice into a high-stakes moral audit. That it could erode those stable, comfortable spaces – the relationships and routines *not* built on constant calculation – where, ironically, the energy and empathy to *be* truly good often come from. If every cup of coffee needs justifying, every moment of rest scrutinized… what room is left for just *being*?

  **(Lean in slightly, voice becoming more personal)**
  And this is where Elena’s insight, and her life, converge in a really beautiful way. She framed a unique angle: demandingness as a problem of **visibility**. Think about it. Some moral codes let you quietly do the right thing – help a neighbour, save some money for charity, choose simplicity – without fanfare, without needing to *prove* it was the *absolute best* thing you could have done globally. But the consequentialist ideal, the one that worries us, can make that quiet virtue feel impossible. It asks us to not just *do* good, but to constantly *justify* it, *optimize* it, make it visible, demonstrably *the best*. It turns private commitment into public performance. It pulls virtue out of the quiet corners of our lives and onto the brightly lit stage of calculation. That pressure to always be seen doing the *maximum* good? That’s its own kind of deep, grinding demand.

  **(Turn directly to Elena, warmth and admiration)**
  Elena, for thirty years, you wrestled with how demanding morality can be, not just in the wallet, but in the soul. You charted the fear that it might hollow out the very ground where goodness grows. But here’s the incredible thing: you also *lived* the answer. Your colleagues saw the brilliant mind dissecting the problem. Your family and friends saw something else: someone who gave generously, lived simply, *without* turning every breakfast into a seminar, without making every kindness a public ledger entry. You showed it’s possible to care deeply, to give significantly, while fiercely protecting those quiet, un-instrumental spaces – the walks, the shared meals, the simple presence – that aren't *for* anything else except being human, together. You didn't just write about the problem; you modeled a way through it. You showed us that the demandingness objection isn't just about what we lose, but crucially, about *what kind of people we can be in front of one another* – whether burdened by constant visibility, or anchored in quiet, stable connection.

  **(Raise glass higher)**
  So, we honour you tonight, Elena. Not just for the formidable intellect that mapped the terrain of demandingness, but for the profound humanity that navigated it with such grace, integrity, and quiet strength. You taught us that the deepest answer to the question "Does morality ask too much?" might just be found in the texture of a life well-lived, generously and authentically, without fanfare. To Dr. Elena Vasquez – a brilliant scholar, a true friend, and a quiet testament to the possibility of deep goodness within an ordinary life. Cheers!

  **(All) Cheers!**

