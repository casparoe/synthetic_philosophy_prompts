prompt: |-
  You are a philosopher of social science specializing in causal explanation and the logic of cultural arguments. Before constructing anything, briefly brainstorm the conditions under which a value can operate as an independent cause rather than an epiphenomenon of material interests, especially within the Weberian idea of elective affinity between cultural orientations and institutional structures.

  Construct a thought experiment to the following specifications. Design a realistic, one-paragraph scenario set in a contemporary institution—such as a research hospital or a worker-owned manufacturing cooperative, not a trolley-style fantasy—in which a specific cultural value (invent a precise label for it, e.g., "epistemic humility" or "status-leveling deference") appears to drive a measurable organizational outcome. Engineer the case so that both a Weberian cultural-causal explanation and a strict materialist or structural explanation are initially available, but include one structural feature that makes the cultural explanation indispensable rather than reducible to hidden incentives, selection effects, or resource constraints. After presenting the scenario, do exactly this: (1) state the value at issue, the institutional mechanism, and the relevant nearby counterfactual worlds; (2) show what the Weberian explanation claims and precisely where the materialist explanation fails without begging the question; (3) identify the single feature of the case that does the work; (4) explain how a materialist critic would attack the case by redescribing or dissolving that feature; and (5) state what happens if that feature is removed—specifically, whether the scenario then collapses into a standard base-superstructure example. Use only ordinary language; do not invoke formal causal graphs, counterfactual notation, or bibliographies, and do not cite specific texts or ask for reading lists. Ensure the scenario is not drawn from standard textbook discussions of Weber. Think carefully about each step, and conclude with an honest assessment of whether the case genuinely isolates value-causation or merely disguises a structural story.
