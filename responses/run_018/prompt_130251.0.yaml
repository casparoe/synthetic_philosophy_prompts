  Okay, the user is wrestling with the epiphenomenalist paradox regarding phenomenal judgment. They're frustrated with the stalemate in the debate and are seeking a diagnosis of why it's stuck. They propose an alternative model where phenomenal judgment acts like an indexical tracker, anchored by rational coherence rather than causation. Their main question is whether this resolves the paradox or just renames it, and they want to understand the nature of the disagreement between camps.

  I need to break down the core paradox first. Epiphenomenalism claims qualia have no causal powers, so the pain itself doesn't cause the belief "I'm in pain." This leads to a dilemma: either such beliefs are always false (since they'd be about something that didn't cause them), or we must accept non-physical causation. The user has noticed two main camps: one focusing on causal contact and the other on rational availability. 

