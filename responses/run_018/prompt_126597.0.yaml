answer: |-
  Here's the conceptual knot:

  **Graded Transparency:** With continuous credence *p*, cooperation hinges on *p* exceeding a threshold based on costs/benefits. Higher *p* makes mutual cooperation more appealing, creating a smooth incentive gradient. Ideally, you'd cooperate only when *p* is sufficiently high.

  **The Luring Poison:** The ability to pay *c* to *boost* the other's *p* introduces strategic deception. A purely selfish agent might "lure" by boosting *p* to trigger your cooperation while they defect, profiting from your misplaced trust. Crucially, *if* you are truly isomorphic, this lure attempt might *also* boost *p* genuinely (as you both reason the same way about sending the signal).

  **The Suspicion Spiral:** This creates a self-undermining loop. A high *p* signal could mean:
  1.  Genuine isomorphism → Good for mutual cooperation.
  2.  A deceptive lure → Bad for you if you cooperate.
  Seeing a high *p* (especially after a signal) forces you to *discount* it precisely *because* it might be manipulation. High *p* becomes suspicious, undermining the very trust it's meant to signal. You can't cleanly rely on *p* anymore – the existence of luring makes every high *p* interaction ambiguous, potentially destabilizing cooperation even when isomorphism is real.
