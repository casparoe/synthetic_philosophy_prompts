  Finally, global health implications. Classification affects funding, so this is downstream. But it's crucial for real-world impact. However, without resolving the prior conceptual issues, any allocation system might be flawed. This requires some empirical input, which the researcher might not have, so it's more practical but less suited for pure conceptual work.

