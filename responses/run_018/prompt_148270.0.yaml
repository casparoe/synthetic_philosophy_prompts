answer: |-
  Here's the rigorous specification of desiderata for a universal theory of pleasure, prioritizing edge cases, distinctions, and constraints:

  **Core Desiderata (What Must Be Covered):**
  1.  **Case Coverage (Heterogeneity):**
      *   *Sensory:* Sweet taste, warm sun, orgasm.
      *   *Relief:* Cessation of pain (physical/mental), release of tension.
      *   *Epistemic:* "Aha!" moment, solving a puzzle, deep understanding.
      *   *Aesthetic:* Being moved by music/art/nature (distinct from mere sensory input).
      *   *Social:* Schadenfreude, *mudita* (sympathetic joy), pride, camaraderie, trust.
      *   *Achievement:* Flow states, mastery, completing a difficult task.
      *   *Anticipatory:* Pleasant expectation (distinct from the event itself).
      *   *"Perverse":* Enjoying one's own humiliation (masochism), guilt pleasure, bittersweetness.
      *   *Quietude:* Deep contentment, tranquility, peace (absence of agitation).
      *   *Objectless Moods:* Unexplained cheerfulness, euphoria.

  2.  **Critical Distinctions:**
      *   **Pleasure vs. Liking:** Must distinguish the *feeling* of pleasure from a dispositional "liking" or preference (e.g., enjoying a food you usually dislike; liking a concept without feeling pleasure).
      *   **Pleasure vs. Absence of Suffering:** Must account for positive phenomenology beyond mere lack of pain/discomfort (e.g., tranquility vs. numbness).
      *   **"Higher" vs. "Lower" Pleasures:** Must provide a non-circular basis for qualitative distinctions (e.g., intellectual vs. sensual) *without* defining "higher" simply as "more pleasurable" or "preferred by experts."
      *   **Pleasure vs. Motivation:** Must accommodate pleasures that aren't motivating (contented passivity) and motivations not driven by pleasure (duty, compulsion).

  3.  **Empirical Constraints:**
      *   **Distributed Neural Correlates:** Cannot posit a single "pleasure center." Must be compatible with diverse neurobiological substrates (e.g., orbitofrontal cortex, nucleus accumbens, insula, opioid/cannabinoid systems).
      *   **Dissociation Evidence:** Must handle cases where neural "reward" systems fire without reported pleasure (e.g., some addictive cravings), and pleasure reports occur without expected reward activation.
      *   **Cross-Modal Similarity:** Must explain why pleasure from different sources *feels similar enough* to be grouped together despite different causes/neural paths.

  **Desideratum Strength:**
  *   **Non-Negotiable:** **Coverage of Core Cases** (1a-j). A theory failing to account for a significant category (e.g., relief, schadenfreude, epistemic joy) is inadequate. **Avoiding Circularity** in Higher/Lower distinction (2c) is also non-negotiable for explanatory power.
  *   **Potentially Relaxable (with cost):** **Distinction from Absence of Suffering (2b).** A highly compelling theory *might* convincingly argue that tranquility *is* just the absence of agitation, but this risks collapsing distinctions. **Full Neural Mapping (3a/b)** might be relaxed if the theory provides a compelling functional/phenomenal account independent of current neuroscience, but violating known dissociations (3b) is a major weakness.

  **The Theory-Killer Desideratum:**
  **Requirement:** **The theory must simultaneously account for the *intentionality* (aboutness) of many pleasures *and* the *distinctive positive phenomenology* common to all pleasures, without reducing one entirely to the other or relying on a homuncular observer.**

  **Why this wipes out major theories:**
  1.  **Felt-Quality (Phenomenal) Theories (e.g., Sidgwick, some hedonisms):** Focus on the "feeling tone." **Fails:** Cannot adequately capture the *intentional* nature of aesthetic, epistemic, or social pleasures (e.g., pleasure *in* understanding, *in* another's misfortune). Schadenfreude *requires* an object. Reduces object-directed pleasures to mere sensation.
  2.  **Pro-Attitude (Desire/Attitude) Theories (e.g., some desire-satisfactionists):** Define pleasure as the satisfaction of a desire or the experience of wanting something to continue. **Fails:** Cannot explain the *positive feel* independent of desire. You can want something to continue *because* it feels good, not vice versa (begging the question). Struggles with objectless moods (cheerfulness) and cases of "unwanted pleasure" (e.g., guilt pleasure).
  3.  **Functionalist Theories (e.g., some neurophilosophy):** Define pleasure by its functional/causal role (e.g., "intrinsically motivating state," "reinforcer"). **Fails:** Cannot capture the *phenomenology* – why does fulfilling that role *feel* like *that*? Violates dissociation constraints (3b): states can fulfill the functional role without feeling pleasurable (cravings), and phenomenology can occur without the full functional role (contented passivity). Reduces pleasure to its effects.

  **Theory Scorecard:**

  | Theory Type          | Coverage (1) | Distinctions (2) | Empirical (3) | Intentionality + Phenomenology | Overall Viability |
  | :------------------- | :----------- | :--------------- | :------------ | :----------------------------- | :--------------- |
  | **Felt-Quality**     | Weak         | Weak (Fails 2a?) | Moderate      | FAILS (Intentionality)         | Low              |
  | **Pro-Attitude**     | Moderate     | Weak (Fails 2a/d)| Moderate      | FAILS (Phenomenology)          | Low              |
  | **Functionalism**    | Moderate     | Moderate         | Weak/Mixed    | FAILS (Phenomenology)          | Low              |
  | **Ideal Target**     | **High**     | **High**         | **High**      | **PASS**                       | **Required**     |

  **Conclusion:** The necessity to seamlessly integrate the intentional object-directedness of many pleasures with the core positive, motivating phenomenology present across *all* pleasures (including objectless ones) while respecting empirical constraints and avoiding circularity is the primary barrier. No dominant theory currently satisfies this. A viable theory likely needs a complex hybrid or radically reconceived structure (e.g., a specific type of "valence-global-workspace integration" or "attentional resonance").
