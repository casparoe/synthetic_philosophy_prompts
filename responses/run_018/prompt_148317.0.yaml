answer: |-
  ### Final Exam Question: Justice, Conditionality, and the Welfare State  
  **Time Allowed:** 75 minutes  
  **Total Marks:** 30  

  > **Question:**  
  > A proposed welfare regime seeks to distinguish between two categories of claimants:  
  > - **Group A ("Structurally Excluded"):** Individuals facing verified, externally imposed barriers to labor-market participation (e.g., disability, systemic discrimination, geographic isolation).  
  > - **Group B ("Agentively Non-Participating"):** Individuals deemed capable of work but choosing not to participate due to perceived moral failure or lifestyle preference (e.g., refusing suitable jobs, neglecting skill-building).  
  >   
  > Under this system, **only Group B** is subject to strict behavioral conditions (e.g., mandatory job applications, training, or community service). The state argues this avoids unjustly penalizing Group A while ensuring Group B "earns" support. Critics counter that the system either (i) morphs into an intrusive moral audit of claimants’ lives, violating norms of respect, or (ii) abandons conditionality entirely once the costs of verifying the distinction become unmanageable.  
  >   
  > **Evaluate the proposal’s conceptual coherence and administrative sustainability.** In your analysis, address:  
  > 1. Why the distinction between "structural exclusion" (Group A) and "agentive non-participation" (Group B) is philosophically unstable under real-world information constraints.  
  > 2. How the "epistemic burden reversal" — where claimants must prove compliance with conditions rather than the state proving fraud — alters the moral relationship between claimant and state.  
  > 3. Whether the system inevitably collapses toward one (or both) of the criticized outcomes.  

  ---

  ### Model Answer Outline (Top-Scoring Response)  
  **Core Argument:** *The two-track system is conceptually incoherent and administratively unsustainable because it ignores the entanglement of structural and agentive factors in non-participation. Information asymmetry forces the state to rely on crude proxies for "desert," leading to either invasive scrutiny or de facto universal unconditional support.*  

  1. **Conceptual Instability of the Distinction (Theoretical Collapse):**  
     - Structural barriers (e.g., unrecognized mental health issues, employer bias) often manifest as behaviors misclassified as "agentive" (e.g., inconsistent work history). Conversely, "choices" (e.g., refusing low-wage work) may reflect reasonable responses to structural injustice (e.g., unlivable wages).  
     - *Philosophical flaw:* The dichotomy assumes "capacity" and "desert" are isolatable, ignoring how structural forces shape agency (e.g., learned helplessness from discrimination).  

  2. **Administrative Unsustainability via Information Asymmetry (Practical Collapse):**  
     - Verifying "structural exclusion" requires intrusive investigation into personal history, health, and social context (e.g., proving trauma or racial discrimination). Assigning claimants to Group B demands assessing "effort" or "motivation," which are unobservable.  
     - **Epistemic Burden Reversal:** Imposing conditions on Group B shifts the burden of proof to claimants. To avoid sanctions, claimants must *document* compliance (e.g., job applications), forcing constant self-surveillance. This frames claimants as inherently suspect, eroding trust and stigmatizing recipients.  

  3. **Inevitable Collapse into Criticized Outcomes:**  
     - **Horn 1 (Moral Audit):** To sustain the distinction, the state must probe intimate aspects of life (e.g., parenting choices, social habits) to "prove" desert deficits. This violates respect for autonomy and privacy, treating claimants as objects of moral scrutiny rather than rights-bearers.  
     - **Horn 2 (Abandonment of Conditionality):** Prohibitive verification costs (e.g., hiring assessors, auditing compliance) pressure states to loosen criteria. Group B claimants may be reclassified as Group A to reduce administrative load, leading to *de facto* unconditional support.  

  4. **Normative Cost:** The system entrenches a punitive, distrustful state-citizen dynamic. Epistemic burden reversal implies claimants are guilty until proven innocent, undermining the welfare state’s role in promoting social solidarity.  

  ---

  ### Marking Scheme (30 Marks Total)  
  **Five Must-Hit Analytical Points:**  

  | **Points**                                                                                                | **Marks** | **Common Error/Omission**                                                                 |
  |-----------------------------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------|
  | **1. Articulates the conceptual distinction between structural exclusion (Group A) and agentive non-participation (Group B), AND identifies why this distinction matters normatively** | 4 | Superficially defines groups without explaining philosophical stakes (e.g., "Group A can’t work, Group B won’t"). |
  | **2. Explains how information asymmetry collapses the distinction** (e.g., structural barriers mimic "laziness"; choices are constrained by context) | 7 | Treats groups as self-evident; ignores entanglement of structure/agency. |
  | **3. Analyzes epistemic burden reversal**: Links conditionality for Group B to the claimant’s duty to prove compliance AND explains how this alters moral relations (e.g., presumption of distrust) | 8 | Mentions burden but fails to connect to moral framing of claimant-state relations. |
  | **4. Traces collapse into either/both criticized outcomes**: (i) Invasive audits to verify desert OR (ii) abandonment due to verification costs | 7 | Only describes one outcome; ignores the systemic pressure toward collapse. |
  | **5. Evaluates normative implications**: How collapse affects respectful treatment, solidarity, or legitimacy of the welfare state | 4 | Limited to practical flaws; neglects moral/epistemic costs to dignity or democracy. |

  ---

  **Rationale for Design:**  
  - **Conceptual Discrimination Focus:** Forces students to dissect the *interdependence* of structure and agency (e.g., how discrimination corrodes "choice"), not just list policy pros/cons.  
  - **Epistemic Burden as Core:** Highlights how administrative mechanics (who must prove what) transform moral relationships, moving beyond "rights vs. responsibilities" rhetoric.  
  - **Dilemma-Driven:** Rejects middle-ground compromises by showing how information constraints force systems toward extremes (oppression or abdication).  
  - **No Recall Required:** Tests philosophical reasoning using hypothetical constructs, not memorization of Rawls, Marx, or specific welfare laws.
