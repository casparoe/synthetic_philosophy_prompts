  1. **Master NFL formalism** via Wolpert’s original papers + Schölkopf’s "Statistical Learning and Kernel Methods."  
  2. **High-dimensional analysis**: Use complexity theory (Arora’s "Computational Complexity" chapters 15–16) and measure theory (to formalize "dimension").  
