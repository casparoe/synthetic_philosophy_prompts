  The user's instincts point to rejecting (1) or (2), but they're wary because (4) might be theory-laden. The lorry driver case is crucial—Williams argues that agent-regret is fitting because of one's causal role, not unresolved claims. So rejecting (1) might be best: ATC verdicts settle what to do but don't exhaust all normative elements. The cost is abandoning a clean, consequentialist view of reasons, embracing moral remainders or non-consequentialist duties.

  Alternatively, rejecting (2) allows residue without unexhausted claims, but needs an account of why it's fitting. That could lead to views where actions leave moral traces regardless of claims. But rejecting (1) seems more direct. Rejecting (5) by introducing a third option (knowing the ATC but residue still fitting) also works but requires explaining how this isn't just irrational emotion.

