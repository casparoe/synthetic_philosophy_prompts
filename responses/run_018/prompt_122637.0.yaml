  Breaking down the premises: (1) is foundational but maybe too strong. If ATC verdicts are truly exhaustive, it leaves no room for residue. But real-life cases show that even when you did the right thing, residue persists. Rejecting (1) means ATC verdicts aren't fully exhaustive—some reasons leave a normative remainder. That challenges the idea that reasons are "spent," which might require a different meta-ethical framework, like non-consequentialist views where duties create lasting obligations.

