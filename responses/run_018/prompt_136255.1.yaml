answer: |-
  ### Exam Question  
  **You've got 48 hours. Write ~1200 words. Answer decisively—no waffling.**  

  Taurek rejects saving five over one because "numbers don't morally count." His pairwise comparison says: compare each of the five *individually* to the one. Since no single person in the five is worse off if you save the one instead of them (they’d all die either way), you may flip a coin.  

  Now toss in probabilities:  
  - Saving the **one person** has a **99% success chance**.  
  - Saving the **five people** requires five *independent* rescues, each with **70% success chance**.  

  **Defend ONE position:** Does this probabilistic version *force Taurek to accept expected-value aggregation* (e.g., "5×0.7 > 0.99, so save the five")? Or can he *still block aggregation* by sticking to "actual outcomes over probabilities"? Argue your stance. Don’t just describe—take sides and give reasons.  

  ---

  ### Model Answer (830 words)  
  **Thesis: Probabilities destroy Taurek’s framework by smuggling aggregation through the back door. He can’t appeal to "actual outcomes" coherently here.**  

  Taurek’s core move in *Should the Numbers Count?* is refusing to aggregate harms across persons. We can’t sum the loss of five lives into a "greater harm" than losing one. Instead, he insists we compare individuals pairwise: when choosing between saving A (the single person) or B/C/D/E/F (the five), no individual in the group is worse off if we save A. B would die whether we save A or the group; same for C, D, etc. So we show equal concern via a coin flip.  

  **Enter probabilities.** Here, outcomes aren’t certain. If we attempt to save the five, each rescue has a 70% shot. Crucially, these are *independent*: we might save all five (0.7⁵ ≈ 17% chance), four (∼36% chance), three (∼31%), two (∼13%), one (∼3%), or none (∼0.2%). Saving the one is near-certain (99%). Expected-value aggregation says: save the five. Their collective expected survival (5 × 0.7 = 3.5) beats the one’s 0.99. But Taurek hates aggregating expectations just like he hates aggregating actual harms. Can his pairwise method survive?  

  **Nope—and here’s why.** Taurek’s pairwise comparison relies on deterministic outcomes. When we say "B isn’t worse off if we save A instead of the group," we *assume* the group-saving action definitely fails B. But under probability, actions don’t guarantee outcomes. If I *attempt* to save the five, B might live or die. Taurek’s "worse off" claim now faces counterfactual chaos:  

  - If I save the one, B definitely dies (barring miracles).  
  - If I attempt to save the five, B has a 70% chance to live.  

  **B is absolutely worse off** if I choose the one-person rescue! In that scenario, B’s survival chance plummets from 70% to 0%. The same holds for C, D, E, and F. Suddenly, *every single person in the five* is individually worse off if I pick the one. Pairwise comparison now demands: save the five. No coin flip needed.  

  Taurek might object: "But we must judge based on *actual outcomes*, not probabilities! If I attempt the five rescue and B dies anyway, she wasn’t worse off than if I’d saved the one." This is where his position crumbles. First, it ignores ex ante fairness. At decision-time, choosing the one rescue rigs the game against each of the five, slashing their survival odds. Refusing to acknowledge this is like saying "Russian roulette isn’t risky because some players survive." Second, insisting on actual outcomes *after the fact* is useless for guiding action. Ethics must help us choose *under uncertainty*. Taurek’s deterministic framework has no tools for this.  

  **Worse, "actual outcomes" collapse into absurdity here.** Suppose we save the one. Later, we learn one of the five (say, B) would have survived had we attempted their rescue (since 70% > 0%). Now we see B *was* made worse off by our choice—she lost a 70% survival chance. But by then it’s too late. Taurek can’t escape counterfactual evaluation; he just postpones it until hindsight. Yet decisions require prospective reasoning.  

  Some defenders might retort: "Taurek can compare what *actually happens* to each person under each choice, ignoring probabilities." But this reduces to nihilism. If I save the one, all five die. If I attempt the five, maybe three live. But I can’t know that *in advance*. Demanding certainty paralyzes us. Taurek’s theory either:  
  (A) Admits probabilities into pairwise comparisons → forcing us to save the five, or  
  (B) Rejects probabilistic reasoning entirely → making ethics irrelevant to real-world choices.  

  **(A) wins by default.** Taurek’s coin flip presumes symmetric uncertainty. But asymmetry breaks it. Here, saving the one gives near-certain death to five people who each had a fighting chance. That’s not equal concern—it’s fatal neglect.  

  **Objection:** "Taurek could still flip a coin because no individual is *guaranteed* to be worse off. Maybe the one rescue fails (1% chance) and the five all survive (17% chance)!" True, but unlikely. Ethics isn’t lottery-ticket metaphysics. We govern actions by reasonable expectations. If your doctor said "Procedure A has 99% success; Procedure B has a 17% shot at saving everyone but likely kills all," you’d pick A. Taurek’s refusal to weigh probabilities feels callous, not principled.  

  **Bottom line:** Probabilities expose a fatal flaw in Taurek’s individualism. When rescues are chancy, pairwise comparisons *must* consider survival likelihoods. This smuggles aggregation in—not of actual harms, but of expected harms. Taurek can’t block it without retreating to a fantasy world of certainty. In ours, numbers count when probabilities multiply them.  

  ---

  ### Marking Scheme (Total: 20)  
  1. **Clear Stance (4 marks)**  
     Must explicitly choose: probabilities force aggregation OR Taurek can block it.  
     *Blown by:* "It depends" or vague hedging.  

  2. **Taurek’s Pairwise Strategy Explained (3 marks)**  
     Must articulate deterministic pairwise comparison (no individual worse off → coin flip).  
     *Blown by:* Misrepresenting Taurek as caring about total lives or ignoring individuals.  

  3. **Probabilities Break Pairwise Logic (5 marks)**  
     Must show how 70% vs. 0% per person under one-choice makes each "worse off."  
     *Blown by:* Treating the group as a blob or ignoring individual survival chances.  

  4. **Critique of "Actual Outcomes" (5 marks)**  
     Must argue why judging by results (not probabilities) fails (e.g., ex ante fairness, decision paralysis).  
     *Blown by:* Uncritically accepting Taurek’s hindsight appeal.  

  5. **Defended Position vs. Objection (3 marks)**  
     Must rebut one counterargument (e.g., "but outcomes are uncertain!" or "coin flips in asymmetry").  
     *Blown by:* Ignoring obvious pushbacks to their view.  

  \answer{probabilities undermine core actualism}
