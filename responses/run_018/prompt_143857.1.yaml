answer: |-
  The air in Arbitration Chamber Gamma hummed with the low thrum of climate control and suppressed panic. Anya Petrova’s knuckles were white on the polished obsidian console. Below, in the stark amphitheater pit, the Collective of the Salted Plains – eight gaunt faces etched by sun and displacement – faced off against the sleek chrome representation of AquaCorp Solutions. The subject: access rights to the rapidly depleting Aquifer K-7, the last reliable water source for 200 miles.

  The pre-auction deposits already stung. The Collective had pooled everything: salvaged solar cells, generations-old jewelry, a communal trust fund. It sat, non-refundable, in the escrow pool. AquaCorp’s contribution was a rounding error. Anya knew the script. Pride, principle, the terrifying specter of walking away empty-handed after sacrificing so much – it was the inheritance dispute all over again, but with water instead of porcelain figurines, and hundreds of lives instead of two siblings' pride.

  "Collective bids fifteen thousand Water Credits," rasped Elder Mara, her voice amplified by the chamber’s acoustics. It was a staggering sum for them, equivalent to six months of rations.

  AquaCorp’s representative, a man whose suit cost more than the Collective’s initial deposit, didn’t flinch. "Twenty thousand."

  A collective gasp echoed from the refugees' bench. Anya saw the calculation in Mara’s eyes: *We’ve already lost the deposit. Walking away now means nothing. But maybe, just maybe…*

  "Twenty-two thousand," Mara countered, her voice cracking slightly.

  The bids climbed. Thirty. Thirty-five. Forty. Each bid from the Collective was a visible agony, a piece of their future hocked. AquaCorp’s bids were smooth, almost bored increments. They weren’t bidding for water; they were bidding for precedent, for the right to exclude, for the chilling message it would send to other thirsty collectives. Their liability was abstract, spread across shareholders light-years away from this sterile chamber.

  Then, the chime. Soft, melodic.

  **"Round Extended. Observer Token Activated."**

  A holographic token shimmered above the central dais – a stylized hourglass filled with swirling, expensive-looking blue liquid. Anya’s stomach clenched. *Escalation Tokens.* Introduced six months ago to "enhance judicial funding." Anyone in the public gallery could purchase one, injecting credits into the system to grant an *additional* bidding round. It didn’t change the parties’ liability; it just prolonged the agony. And the gallery *loved* it. A murmur of excitement rippled through the privileged observers – financiers, legal tourists, data-analysts placing side-bets. They saw drama, volatility, a spectacle. Anya saw fuel poured onto a fire.

  She watched a young man in the third row, grinning, tap his wrist-comm. Another token chime echoed. Another round granted.

  *Sunk costs,* Anya thought, the memory of the ruined siblings a cold stone in her chest. *For the Collective, every bid sunk makes withdrawal more unthinkable. They’re trapped in the algorithm of their own sacrifice.* For AquaCorp, the cost was negligible, but the *mechanism* – the public bidding war, the tokens flashing – was a performance of corporate resolve, valuable in itself.

  Her console offered options:
  1.  **Advise Capitulation:** Send a private comm to Elder Mara: "Withdraw now. Save what little you have left." But what did they have left? The deposit was gone. Walking away meant total, humiliating loss. Capitulation felt like signing their death warrant. Would they even listen? Or would pride, amplified by the public spectacle and the tokens flashing, push them further?
  2.  **Reveal the Distortion:** Activate her mediator override, projecting a public announcement: "Observe the Escalation Token mechanism. It prolongs this dispute for spectator profit, fundamentally disconnected from the merits of the claim. Consider this distortion." It was the truth. But would it help? Or would it simply enrage the token-buyers, embarrass the judiciary, and potentially make AquaCorp dig in harder to spite the revelation? The refugees might see it as validation, fighting even more desperately against a rigged system.
  3.  **Remain Silent:** Uphold the sanctity of the process. Do her job. Record the bids, manage the timer, enforce the rules. Let the machinery grind forward. It was the safest path, professionally. It was also complicity.

  Below, AquaCorp bid fifty thousand. Elder Mara, her face grey, looked at her companions. Anya saw the desperate hope warring with utter despair. Another token chimed. A woman in the front row, sipping sparkling water, smiled faintly.

  *Psychological failure?* Anya thought. Absolutely. The Collective was gripped by the same fallacy that consumed the siblings: the irrational conviction that more investment *must* eventually yield a return, that stopping would render past sacrifices meaningless. Human brains were wired for it.

  *Engineered feature?* Undeniably. The non-refundable bond, the public turns, the winner-takes-all-plus-penalty structure – it was designed to create exactly this escalation dynamic. The tokens were a grotesque monetization of that engineered pain.

  But watching the tokens flash, seeing the detached fascination in the gallery, Anya understood the deeper horror. It was a *structural coupling*. The psychological vulnerability – the sunk cost fallacy – wasn't just exploited by the institution; it was the *foundation* the institution was built upon. The institution amplified the fallacy, weaponized it, and then sold tickets to watch it cripple people. The refugees’ desperation wasn't a bug; it was the fuel. The corporate indifference wasn't an accident; it was the counterweight the system anticipated and thrived on. The tokens? They were the system gleefully recognizing its own perverse efficiency and finding a way to profit further from the wreckage it mandated.

  Elder Mara opened her mouth. "Fifty… fifty-two thousand." The words were ash.

  AquaCorp’s representative didn't even look up from his tablet. "Fifty-five."

  Anya’s finger hovered over the override. To speak was to acknowledge the monstrous machine she served. To remain silent was to become its lubricant. To advise surrender felt like delivering the final blow herself.

  The chime sounded again. Another token. More time. The gallery murmured appreciatively.

  Anya Petrova closed her eyes for a fraction of a second, then opened them, her face settling into the neutral mask of the mediator. She tapped her console, resetting the bid timer. The machinery demanded its due. The structural coupling held, its gears meshing perfectly – psychological ruin feeding institutional greed, wrapped in the cold, rational veneer of procedure. She chose silence. Not because it was right, but because within the chamber’s logic, within the terrifying efficiency of the coupled system, no other choice felt possible without causing immediate, unpredictable chaos. The water, and the lives depending on it, receded further into the distance, drowned out by the metallic click of rising bids and the soft, profitable chime of tokens.
