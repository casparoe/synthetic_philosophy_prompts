  The taxonomy itself—labeling it a "pseudoscience"—implicitly contrasts it with "real" science, projecting modern biomedical standards onto the past. This creates a false binary. Worse, by isolating it as an anomaly, periodization (placing it in "pre-scientific" eras) suggests medicine evolved past such biases, ignoring continuities like racial disparities in pain treatment today. 

  The user’s grandmother’s papers likely hold similar tensions. Describing 1950s analgesia withholding as "unethical" would be presentist, but calling it "standard practice" neutrally might obscure how power worked through those norms. The structural failure is unavoidable because taxonomy requires categorization (what counts as "medicine"?), periodization needs boundaries ("when did ethics improve"?), and narratives demand arcs ("progress" or "backwardness"). 

  Their deeper need might be to honor their grandmother’s context without endorsing harmful practices—a tightrope walk between historicization and moral responsibility. Showing how even critical frameworks can perpetuate presentism might help them navigate that. No citations needed, just clean conceptual dissection. Let’s build the example step by step…
answer: |-
  Here is a precisely articulated example demonstrating how presentist standards re-enter historical analysis through structural methodology (taxonomy and periodization), using the history of medicine:

  ### Conceptual Issue: The Implicit Teleology of "Pseudoscience" in Medical Taxonomy
  *   **Domain:** History of Psychiatry / Racial Science
  *   **Specific Case:** Historians analyzing 19th-century diagnoses like "drapetomania" (a purported mental illness causing enslaved Africans to flee captivity) and "dysaesthesia aethiopica" (alleged laziness and insensibility in enslaved people).

  ### The Attempted Escape from Presentism
  1.  **Explicit Suspension of Judgment:** The historian consciously avoids labeling 19th-century physicians like Samuel Cartwright (who coined these terms) as simply "racist" or "evil." They acknowledge that within the prevailing scientific paradigms of the time (phrenology, theories of racial hierarchy, humoral concepts adapted to race), these diagnoses represented a *legitimate* attempt (by contemporary standards) to apply medical reasoning to observed behaviors.
  2.  **Historical Contextualization:** The historian meticulously reconstructs the intellectual milieu: the influence of racial polygenism, the economic pressures to justify slavery medically, the genuine belief in somatic explanations for behavior, and the lack of modern neurobiological or psychological frameworks.

  ### The Structural Reintroduction of Presentism: Taxonomy & Periodization
  1.  **Taxonomic Framing as "Pseudoscience":** While avoiding explicit moral condemnation, the historian inevitably categorizes concepts like drapetomania within taxonomies such as "racial pseudoscience," "scientific racism," or "discredited diagnoses." This taxonomy relies on a *contemporary* demarcation between "real science" (validated by current methods/conclusions) and "pseudoscience" (rejected by current standards).
      *   **Why it reintroduces presentism:** The label "pseudoscience" is not a neutral historical descriptor; it is a judgment *defined by its failure to meet modern scientific criteria*. Applying this category implicitly imports the modern standard of scientific validity as the ultimate measure of historical medical concepts. It structurally positions modern science as the telos against which past ideas are measured and found wanting *scientifically*, even if the historian avoids calling them *morally* wrong.
  2.  **Periodization as "Pre-Scientific" or "Proto-Scientific":** The historian often places these practices within a period labeled "pre-modern psychiatry," "the era of racial science," or situates them as precursors to "modern scientific racism." This periodization implicitly relies on a narrative of scientific progress.
      *   **Why it reintroduces presentism:** Framing the 19th century as "pre-" or "proto-" defines it by what it *lacks* (modern scientific rigor, ethical review boards, biological understanding) rather than understanding its practices solely within their own functional and intellectual context. The periodization structure itself embeds the assumption that history moves towards the superior (modern) understanding. The "failure" of drapetomania is thus not just a historical fact within its own context, but is preordained by its placement in a period inherently defined as less advanced than the present. Its significance becomes its role in a narrative arc leading to (or away from) modern science.

  ### Why the Failure is Conceptually Unavoidable
  *   **The Necessity of Categories:** Historians *must* use categories to organize knowledge and make comparisons across time. "Pseudoscience" is a readily available, seemingly descriptive category. However, its very meaning is inherently relational and dependent on the *current* state of accepted science. There is no neutral, transhistorical category meaning "ideas later proven false by methods not yet invented." Any such label smuggles in the present's epistemic authority.
  *   **The Necessity of Narrative Structure:** Periodization is fundamental to constructing coherent historical narratives that span time. However, the act of dividing time into periods ("The Age of Enlightment," "The Scientific Revolution," "Modern Medicine") inevitably implies transition, development, or progress *towards* something. Defining an earlier period inherently involves implicit or explicit comparison with what comes later (usually, the present or a more recent past deemed "better"). The structure of "before" and "after" cannot escape implying a directionality, often aligning with contemporary values of improvement (scientific, ethical, social).
  *   **The Impossibility of a "View from Nowhere":** Even when striving for neutrality, the historian's analytical tools (language, concepts, frameworks) are products of their own time. The very act of identifying "drapetomania" as a *problem* worthy of historical study is triggered by its jarring conflict with modern ethics and science. The structural apparatus (taxonomy, periodization) used to analyze it is shaped by the same modern context that finds the concept abhorrent or absurd. Suspending explicit judgment doesn't suspend the epistemic framework that makes the concept appear as an anomaly needing explanation.

  ### Conclusion
  In analyzing 19th-century racialized diagnoses, the historian's structural reliance on taxonomic categories like "pseudoscience" and periodization schemes implying progress ("pre-modern," "the era of...") unavoidably reintroduces presentist standards. This occurs not through overt moral condemnation of past actors, but through the very methodological scaffolding designed to contextualize them. The taxonomy judges the past concept by modern scientific validity, while the periodization embeds it within a narrative arc implicitly culminating in the superior knowledge of the present. This failure is conceptually unavoidable because historical analysis fundamentally requires categorization and temporal structuring, which are themselves saturated with the values and knowledge hierarchies of the historian's own time. The apparatus designed to suspend presentist judgment is constructed from materials that inherently contain it.
