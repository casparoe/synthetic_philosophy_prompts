  ### **Epistemic Accreditation Board: Knowledge Registry Game**  
  **Total Time:** 75 minutes  
  **Participants:** 8 graduate students seated around a table.  
  **Materials:**  
  - Whiteboard or large paper for the "Knowledge Registry" (updated each round).  
  - Round 1: Two "Base Certificate" cards (e.g., laminated red cards).  
  - Round 2: Colored markers for drawing belief-connections on the registry.  
  - Round 3: 100+ blank index cards and string/tape for chaining justifications.  
  - Timer, role cards (for random assignment), and "Certification Credits" tally sheet.  

  ---

  ### **Game Structure**  
  **Framing (5 min):**  
  - Facilitator introduces the "Epistemic Accreditation Board" tasked with admitting propositions (e.g., "Water boils at 100°C," "Democracy is just") into a shared "Knowledge Registry."  
  - Emphasize: This is about *structural justification*, not truth. The goal is to experience how each "regime" (foundationalism, coherentism, infinitism) shapes the process of accreditation.  
  - Assign roles randomly for Round 1 (reset each round):  
    - **Proponent (3 students):** Proposes beliefs for admission. Gains credits for successful admissions.  
    - **Auditor (3 students):** Challenges admissions violating regime rules. Gains credits for upheld challenges.  
    - **Registry Clerk (2 students):** Maintains the Knowledge Registry. Issues Base Certificates (Round 1) or manages justification chains (Round 3). Gains credits for error-free administration.  

  **Certification Credits System:**  
  - Credits reset each round (no carryover) to prevent cross-regime strategy.  
  - **Proponent:** +1 per admitted belief.  
  - **Auditor:** +1 per upheld challenge (i.e., admission blocked); -1 per overruled challenge.  
  - **Clerk:** +1 per 3 admissions without errors; -1 per error (e.g., issuing extra certificates).  
  - *No monetary stakes—credits expose tensions, not resolve them.*  

  ---

  ### **Round 1: Foundationalist Regime (18 min)**  
  **Rules:**  
  - A belief may be admitted **only** if:  
    - (a) It is supported by an already-admitted belief *and* ultimately traces back to a Base Certificate, OR  
    - (b) It is issued one of the two **Base Certificates** (no justification required within the round).  
  - **Novel constraint:** Only two Base Certificates total for the round. Once issued, they cannot be revoked.  
  - **Process:**  
    1. Proponent proposes a belief (e.g., "The sky is blue").  
    2. If using a Base Certificate, Clerk attaches it to the belief. If not, Proponent must cite an admitted belief supporting it.  
    3. Auditors may challenge if:  
       - A belief lacks a Base Certificate *or* a traceable chain to one.  
       - A Base Certificate is retroactively justified (e.g., "This certificate is reliable because...").  
    4. Clerk records admitted beliefs on the registry, marking Base Certificate holders.  

  **Predictable Failure & Tension:**  
  - Students will fight over the two Base Certificates (e.g., privileging "2+2=4" but rejecting "I exist").  
  - Auditors will catch attempts to justify certificates ("But we all *agree* this is basic!").  
  - *Structural force revealed:* Arbitrariness of foundations ("Why *this* belief?") and discomfort in halting regress by fiat.  

  ---

  ### **Round 2: Coherentist Regime (18 min)**  
  **Rules:**  
  - A belief may be admitted **only** if:  
    - It is supported by **at least two already-admitted beliefs**, AND  
    - The entire registry forms a **single closed loop** (all beliefs interconnected; no "dangling" beliefs).  
  - **Process:**  
    1. Proponent proposes a belief and cites two supporting beliefs from the registry (e.g., "Grass is green" supported by "Plants photosynthesize" and "Green is a color").  
    2. Clerk diagrams links on the registry (e.g., arrows between beliefs).  
    3. Auditors may challenge if:  
       - Fewer than two supports are cited.  
       - The admission creates a "dangling" belief or disjoint loop.  
       - Support relies on unstated premises (e.g., "But that assumes light exists!").  
    4. Beliefs violating loop closure must be rejected.  

  **Predictable Failure & Tension:**  
  - Participants will reject intuitively obvious beliefs (e.g., "I have hands") if they fail to cohere.  
  - Proponents will smuggle in hidden premises (e.g., "Assume physics is reliable") to close loops, triggering Auditor challenges.  
  - *Structural force revealed:* Circularity and sacrifice of intuitive beliefs for systematic unity.  

  ---

  ### **Round 3: Infinitist Regime (18 min)**  
  **Rules:**  
  - A belief may be admitted **only** if:  
    - It is justified by a **distinct, previously unmentioned belief**, admitted simultaneously.  
    - This new belief must itself be justified by *another* new belief, ad infinitum (no termination).  
  - **Process:**  
    1. Proponent proposes a belief (B0) and writes it on a card.  
    2. Proponent must then propose B1 (justifies B0), B2 (justifies B1), etc., **each on a new card**.  
    3. Clerk physically chains cards with string/tape, extending the chain across the table.  
    4. **Fatigue Protocol:** One Auditor is "Fatigue Monitor" tracking:  
       - **Repetition:** No reused beliefs (even across chains).  
       - **Stalling:** >15 seconds between justifications.  
       - If triggered, Monitor calls "HALT! Regress broken." Admission fails.  
    5. Auditors may challenge repetition/stalling; Clerks enforce chain-linking.  

  **Predictable Failure & Tension:**  
  - Chains will sprawl across the table, causing physical chaos by minute 15.  
  - Proponents will repeat beliefs or stall under cognitive load ("B7... uh, atoms exist?" → HALT).  
  - *Structural force revealed:* Infinite regress as practically unmanageable; no beliefs admitted.  

  ---

  ### **Debrief (15 min)**  
  **Guided Discussion:**  
  1. **Map gameplay to theory:**  
     - *Round 1:* "When you fought over the second Base Certificate, how did it feel to privilege 'math' over 'perception'? That’s foundationalism’s arbitrariness problem."  
     - *Round 2:* "Why was 'I have hands' rejected? To avoid circularity, you sacrificed intuition for coherence."  
     - *Round 3:* "The card chain overflowed because infinitism demands unrealizable cognitive labor."  
  2. **Highlight structural failures:**  
     - Foundationalism: Justification halts by unargued fiat.  
     - Coherentism: Circularity and rejection of "obvious" truths.  
     - Infinitism: Practical incompleteness of infinite chains.  
  3. **Acknowledge limitations:**  
     - "This simulated *administrative pressure*, not genuine epistemic obligation. In real life, we feel urgency to justify beliefs—this normativity is why the regress matters philosophically."  

  **Closing Note:**  
  - "Each theory’s failure mode revealed today mirrors its canonical critique. Foundationalism’s arbitrariness, coherentism’s circularity, and infinitism’s impracticality aren’t abstract—they’re lived when we demand justification."  

  ---

  ### **Predictable Execution Challenges & Mitigations**  
  - **Round 1:** Students will retroactively justify Base Certificates. → *Mitigation:* Auditors gain credits for blocking this, making "fiat" palpable.  
  - **Round 2:** Hidden premises will be smuggled in. → *Mitigation:* Auditors gain credits for exposing unstated assumptions.  
  - **Round 3:** Fatigue causes repetition/stalling. → *Mitigation:* Fatigue Protocol makes breakdown visible and rewards Auditors for catching it.  
  - **General:** Dominant voices. → *Mitigation:* Role rotation forces engagement; Proponent/Auditor rivalry balances participation.  

  This design avoids bibliographies or niche literature, using only core distinctions and novel constraints (two-certificate limit, Fatigue Protocol) to scaffold embodied understanding. The physicality—fighting over certificates, drawing loops, wrestling with chains—makes abstract tensions visceral.
