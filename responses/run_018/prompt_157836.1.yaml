answer: |-
  Right, settle in the snug, lads. Clifford's peering at his watch, then the 'Last Orders 11 PM' sign with the intensity of a man auditing receipts. James is practically vibrating, eyeing the barman polishing a pint glass near the empty till.  

  **Clifford:** (Tapping the sign) "See? Clock says quarter past. Sign says eleven. Conclusive empirical evidence, old bean. To *believe* the bar remains operational now requires wilful disregard of the facts. Ethically indefensible!"  

  **James:** "Ethics? Bollocks! This isn't some dusty theorem, Cliff, it's a *live* option! We *want* another pint! It's *forced* – either we believe it's open and get a round in, or we slink off sober! And it's *momentous* – this could be the last decent ale for miles! We *must* make a passional investment!"  

  **Clifford:** "Investment? More like reckless gambling! Belief isn't a lottery ticket! You can't just *wish* the licensing hours away! Where's your evidence *now*, eh?"  

  **James:** (Leans in conspiratorially) "Alright, alright. Strict evidentialism cramping your style? Fine. Let's park it in *doxastic escrow*. I shan't *fully* commit to believing the bar is still technically open..."  

  **Clifford:** (Slightly mollified) "Ah, a sensible holding pattern. Provisional acceptance pending further..."  

  **James:** (Already waving frantically at the barman) "...BUT I passionately invest in the provisional belief sufficient to shout 'TWO PINTS OF BITTER, MATE, BEFORE YOU SHUT UP SHOP!' based purely on the momentous potential gain versus the trivial risk of looking a tit!"  

  **Barman:** (Looks up, sighs) "Kitchen's shut, lads. But since you're so passional... last orders was ten minutes ago, but go on then. Hurry up."  

  **James:** (Triumphant, slapping a fiver down) "SEE?! Escrow paid out! Pragmatism wins!"  

  **Clifford:** (Muttering into his suddenly appearing pint) "Tainted ale. Morally tainted ale. Acquired under epistemic duress and dubious escrow behaviour... utterly wrong..." (Takes a long, guilty sip). "Lovely drop, though."  

  **James:** "Told you. Sometimes you've gotta believe *towards* the centre pulling your boots, not just where the signpost's rusted."
