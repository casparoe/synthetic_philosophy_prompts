  ## Analysis of the Millerite Great Disappointment through a Signaling Lens

  Applying the costly-signaling/credibility-enhancing-display (CRED) lens, combined with the teacher's propositional vs. commitment currency framework and the concept of "re-denomination," to the Millerite Disappointment reveals both explanatory power and limitations. The core claim of the signaling lens is that costly, public, hard-to-fake actions function as reliable signals of commitment to a group or belief system, fostering trust and cooperation within the group and deterring free-riders.

  **Mapping Actors and Options on October 23, 1844:**

  1.  **William Miller:** His reputation as the movement's founder was entirely bound to the prophetic interpretation. His options were limited: walk away (admitting profound error), endorse a new date (potentially losing credibility faster), or endorse a reinterpretation. Miller largely chose resignation and confusion initially, later expressing openness to reinterpretations but never fully embracing the heavenly sanctuary doctrine himself. His evidence was primarily scriptural exegesis; the payoff was maintaining prophetic authority (propositional) and his role as leader (commitment). Walking away meant losing both utterly.

  2.  **Itinerant Preachers:** These individuals had staked their livelihoods, social standing, and professional identities on promoting Miller's message. Their options mirrored Miller's but carried immediate material consequences. Walking away meant unemployment and social ostracism. Re-dating offered continuity of role but risked further ridicule. Re-denomination (heavenly sanctuary) preserved their ministerial function and group cohesion (strong commitment payoff) while shifting the propositional basis to something unfalsifiable. Doubling down on a new date was a path taken by some (like the shut-door faction initially). Evidence included scripture, their own preaching success (as divine validation), and the fervor of followers. The primary payoff was maintaining their vocation and status within the community (commitment currency).

  3.  **Ordinary Rural Followers:** They had incurred significant costs: social censure from mainstream churches and communities, potential property abandonment, and strained family relations. Their options: walk away (returning to old lives with shame and loss), re-date (maintaining hope but facing skepticism), embrace re-denomination (preserving community and sunk costs), join a faction (like shut-door), or become disillusioned. Evidence was the preaching, scripture, and the shared fervor of the community. Payoffs were primarily in commitment currency: retaining the supportive community forged during the movement, validating their sacrifices, and maintaining hope/meaning. Walking away meant those sacrifices were definitively wasted.

  4.  **Newspaper Critics & Established Churches:** Their goal was to discredit the movement and reaffirm their own authority. Their options: intensify ridicule (to deter further defections and discredit the movement), offer reconciliation (to reclaim members, often with conditions), or largely ignore (if the movement seemed finished). Evidence was the undeniable failure of the prophecy. Payoffs were propositional (vindicating their skepticism) and commitment-related (strengthening their own congregations by contrasting their stability with Millerite "fanaticism").

  **What the Signaling Lens Explains:**

  1.  **Survival of Re-Denominators (Adventists):** The signaling lens explains *why* the heavenly sanctuary reinterpretation succeeded where simple abandonment or repeated re-dating largely failed. Re-denomination converted a falsified proposition into a *new* basis for costly commitment (e.g., strict Sabbath observance, dietary laws, prophetic emphasis). This preserved the *commitment currency* – the community bonds, behavioral norms, and public identity formed around costly anticipation – while jettisoning the discredited proposition. The signal wasn't destroyed; it was *re-based* on a new, unfalsifiable proposition coupled with continued costly behaviors.
  2.  **Preacher Persistence:** The lens explains why preachers were disproportionately likely to persist through reinterpretation. Their sunk costs (professional identity, livelihood) were highest, making abandonment the most costly option. Re-denomination allowed them to retain their role and status.
  3.  **Follower Cohabitation:** It explains why many followers stayed despite the failure. Abandoning the group meant their prior costly sacrifices (social ostracism, neglected farms) became pure loss with no redemption. Staying within a re-denominating group offered social support and a way to *redefine* the meaning of their sacrifices.
  4.  **Critic Response:** The lens fits the critics' intensified ridicule, aiming to increase the perceived cost of association with the failed movement and bolster their own group's cohesion.

  **What the Signaling Lens Misdescribes or Cannot Reach:**

  1.  **Miller's Personal Trajectory:** The lens struggles to fully explain Miller's own relative passivity and lack of leadership in the reinterpretation. Why didn't he become the champion of the new doctrine? Signaling focuses on group dynamics, less on individual psychology or leadership failure.
  2.  **The "Shut-Door" Faction:** While signaling explains persistence, the specific, highly pessimistic theology of the shut-door faction (salvation closed) seems less about maintaining a credible signal and more about an extreme cognitive response to dissonance, potentially misdescribed by signaling alone.
  3.  **Initial Prophetic Zeal:** The lens explains *persistence after failure* well but is less specific about the *initial* mass mobilization based purely on a dated proposition. Why were people willing to make such costly bets *before* a strong commitment community existed? CRED focuses on displays *within* a group context.

  **Where the Signaling Lens is Silent:**

  1.  **Why *This* Reinterpretation?** Why did the "heavenly sanctuary" idea gain traction over other possible unfalsifiable reinterpretations (e.g., "spiritual return," "delayed by prayers")? Signaling doesn't predict the *content* of the re-denomination, only the *function*.
  2.  **Internal Faction Dynamics:** Signaling explains why groups persist, but not the intricate theological debates and power struggles *between* the re-dating, shut-door, and re-denominating factions within the disappointed Millerites.
  3.  **Prophetic Calculation Origin:** It doesn't address why Miller and others found the specific exegetical arguments convincing in the first place.

  **Re-Denomination and the Signal:**

  *   **Does it rescue the signal?** **Yes.** It rescues the *commitment signal* by providing a new, unfalsifiable propositional foundation upon which costly, public, hard-to-fake behaviors (distinctive Adventist practices) can continue to be displayed, maintaining group cohesion and identity. The *propositional signal* (predictive accuracy) is sacrificed.
  *   **Which currency dominates?** **Commitment.** The survival and growth of Seventh-day Adventism demonstrate that the commitment currency (sustained behavioral investment, community cohesion) proved dominant over the specific propositional currency of the 1844 date. The movement prioritized preserving the community and its costly practices by sacrificing the falsifiable core of its prophecy.

  **Verdict on the Naturalistic Approach & Cognitive Dissonance:**

  *   **Claim Tested:** That costly-signaling/CRED accounts explain the persistence and adaptation of religious movements after prophetic failure, particularly through mechanisms like re-denomination.
  *   **Result:** **Confirms.** The case strongly supports the signaling lens, especially when augmented by the propositional/commitment distinction and re-denomination concept. It adeptly explains why the group that prioritized maintaining costly commitment through re-denomination (Adventists) survived and thrived, while those focused solely on propositional accuracy (walkaways) or repeated falsifiable claims (re-daters) largely dissipated.
  *   **Cognitive Dissonance:** The case shows the *limits* of a pure cognitive dissonance account (Festinger). The failure *was* undeniable, but the prior date shifts actually *facilitated* adaptation (re-denomination became a familiar move). Dissonance reduction occurred, but the *mechanism* (re-denomination) and its *success* are best explained by signaling dynamics preserving the commitment-based community. Dissonance reduction is necessary but not sufficient for group survival; signaling explains *how* it was achieved effectively in this case.
  *   **Confidence:** **85/100.** The fit for the key outcome (Adventist survival via re-denomination) is very strong.
  *   **Strongest Reason:** The re-denomination move perfectly exemplifies converting a falsified proposition into a new basis for sustained costly commitment, preserving the group's core signaling apparatus.
  *   **Weakest Link:** The lens is less compelling for explaining Miller's personal response and the specific appeal of the *heavenly sanctuary* interpretation over alternatives.

  **Would Change My Mind:**
  *   Evidence that the vast majority of followers *didn't* incur significant social/material costs before 1844, undermining the "costly signal" premise.
  *   Evidence that the early SDA community *abandoned* costly behavioral distinctiveness after 1844, showing commitment currency wasn't maintained.
  *   Evidence that the "heavenly sanctuary" doctrine was widely accepted *before* the Disappointment as a plausible alternative, making re-denomination less of an adaptive innovation.

  **Most Likely Failure Mode:** Overemphasizing the rationality of commitment-signaling and underweighting the genuine existential despair, theological searching, and complex emotional responses driving individuals, particularly in the immediate aftermath.

  **Facts to Check:**
  1.  **Scale of Property Abandonment/Neglect:** How widespread and documented was this? It's central to assessing the costliness of the signal.
  2.  **Miller's Specific Reaction:** Did he truly express openness to reinterpretation, or was he more consistently despondent and withdrawn? Affects analysis of leadership.
  3.  **Size of "Shut-Door" Faction:** Was it significant and persistent? Affects analysis of alternative survival paths.
  4.  **Immediate Post-Oct 23 Actions:** How quickly did the core SDA reinterpretation emerge and gain adherents? Timing matters for adaptive pressure.

