answer: |-
  Here is the evolutionary restatement of the economic path-dependence debate, followed by an analysis of conceptual translations and a residue report assessing the analogy's utility:

  ### Evolutionary Restatement
  **Strong Path-Dependence Claim (QWERTY as "Locked-In" Outcome):**  
  A suboptimal technological standard (e.g., QWERTY) colonizes an **adaptive peak** via an early stochastic advantage (e.g., random historical adoption). **Positive frequency-dependent selection** (network effects) deepens its adaptive valley, creating a fitness landscape where alternative peaks (e.g., Dvorak) become inaccessible without catastrophic fitness loss. This represents **phylogenetic inertia**—a developmental constraint where prior states (installed base, training costs) bias future trajectories. The system enters an **evolutionary trap**: the local peak is maladaptive globally (reduced typing efficiency), but escape requires crossing an impassable valley (coordinated abandonment costs exceeding individual benefits).  

  **Counter-Claim (Functional Convergence Regardless):**  
  Selection pressures (e.g., ergonomic efficiency, interoperability) define a rugged adaptive landscape with **multiple high-fitness peaks**. While initial adoption may be stochastic, **convergent adaptation** inevitably drives lineages toward these peaks via competitive exclusion. QWERTY persists not due to lock-in but because it occupies a peak sufficiently high for the fitness landscape (e.g., "good enough" efficiency with low transition costs). Any suboptimal standard would be exapted (e.g., QWERTY repurposed for digital interfaces) or replaced by **adaptive radiation** when landscapes shift (e.g., touchscreens enabling layout fluidity). Path-dependence is transient noise, not phylogenetic constraint.  

  ---

  ### Conceptual Translation Analysis  
  | **Evolutionary Concept**         | **Clean Translation**                                                                 | **Distortion Required**                                                                                               | **No Counterpart**                                  |
  |----------------------------------|---------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------|
  | **Adaptive Peaks/Valleys**       | Fitness ≡ economic utility; valleys ≡ switching costs                                | Peaks in biology are defined by natural selection; economic peaks incorporate *anticipatory design* (e.g., planned obsolescence). |                                                     |
  | **Phylogenetic Inertia**         | Direct: Legacy infrastructure as "developmental constraint" on innovation.            | Biological inertia is genetic/epigenetic; economic inertia relies on *contracts/legal systems* (non-biological enforcement). |                                                     |
  | **Exaptation**                   | Clean: QWERTY repurposed for digital typing despite origin in mechanical constraints. | None.                                                                                                                 |                                                     |
  | **Evolutionary Traps**           | Direct: Maladaptive persistence due to sunk costs/network effects.                    | Traps in biology are unintentional; economic traps may be *strategically maintained* (e.g., rent-seeking).           |                                                     |
  | **Convergent Adaptation**        | Functional equivalence (e.g., multiple keyboard layouts achieving similar efficiency). | Biological convergence is gradual; economic "convergence" can be *teleological* (e.g., ISO standards committees). |                                                     |
  | **Positive Frequency-Dependence** | Perfect: Network effects as fitness increasing with adoption frequency.             | None.                                                                                                                 |                                                     |
  | **Stochastic Adoption**          | Direct: Historical accidents as "mutations" (e.g., QWERTY’s early wins).              | None.                                                                                                                 |                                                     |
  | **"Lock-In" Mechanisms**         | —                                                                                     | —                                                                                                                     | *Legally binding contracts, patent enforcement*.    |
  | **Anticipatory Behavior**        | —                                                                                     | —                                                                                                                     | *Deliberate investment in suboptimal tech to control futures*. |

  ---

  ### Residue Report: What the Evolutionary Framework Reveals and Obscures  
  **Reveals:**  
  1. **Valley-Crossing Costs as Core Constraint**: The adaptive landscape model vividly illustrates why suboptimal standards persist—not from inherent superiority, but from the *depth of fitness valleys* (switching costs). This reframes "lock-in" as a *topographic problem*, emphasizing irreversible thresholds (e.g., collective action dilemmas).  
  2. **Contingency vs. Convergence as Landscape Dynamics**: Gould vs. Conway Morris maps cleanly: path-dependence advocates see landscapes with isolated peaks (historical accidents matter), while convergence theorists see interconnected ridges (selection dominates). This highlights how functional equivalence arguments *underestimate valley depth*.  
  3. **Exaptation as Escape Route**: The biological lens identifies workarounds (e.g., QWERTY’s persistence via software autocorrect) as exaptations—revealing resilience within constraints.  

  **Obscures/Overextends:**  
  1. **Human Agency vs. Natural Selection**: Economic actors exhibit foresight and coordination (e.g., antitrust legislation, standardization bodies). Treating these as "selection pressures" conflates *teleological* design with blind evolution.  
  2. **Speed of Change**: Technological "lineages" evolve via Lamarckian inheritance (direct knowledge transfer), enabling rapid peak-shifting—unlike genetic evolution.  
  3. **Non-Ecological Fitness**: Economic "fitness" includes political power and irrational preferences (e.g., VHS beating Betamax due to pornography distribution), which lack biological analogs.  

  **Verdict on "Locked-In" as Evolutionary Constraint:**  
  - **Genuine Analogy**: "Lock-in" *is* analogous to phylogenetic inertia trapping lineages on suboptimal peaks. Network effects ≈ positive frequency-dependence, switching costs ≈ adaptive valleys.  
  - **Categorical Difference**: The *mechanism of constraint* differs: biological lock-in arises from developmental/genetic constraints (e.g., allometry), while economic lock-in stems from *strategic human choices* (e.g., licensing agreements). Crucially, economic systems can *engineer valley-crossing* (e.g., government mandates), making dependency more malleable.  

  **Conclusion**: Evolutionary metaphors do explanatory work by framing path-dependence as a *landscape-control problem*—revealing why suboptimal outcomes resist optimization. However, they risk biologizing human intentionality. The residue (agency, law, foresight) confirms that economic "lock-in" is a distinct *socio-technical dependency*, more reversible than genetic constraints but equally consequential in the short term.
