answer: |-
  Based on your friend's verdicts, multiple candidate rules can be proposed to explain when a foreseen side effect counts as intentional. I'll outline these rules, apply them to the mayor case, provide my best guess for your friend's verdict, and suggest a further case to discriminate between the rules.

  ### Candidate Rules:
  1. **Outcome Valence (Good vs. Bad)**:  
     - **Rule**: Only *bad/harmful* side effects are judged intentional; good/beneficial ones are not.  
     - **Fits verdicts**:  
       - Harmful cases (environmental harm, bankrupting rival, leaking data) → intentional.  
       - Beneficial cases (helping environment) → not intentional.  
       - Nurse case (shortening life is bad but not blamed) is an exception, but valence alone doesn’t fully fit (since bad outcomes aren’t *always* intentional).  
     - **Prediction for mayor**: Reduced air pollution is *good* → **not intentional**.

  2. **Blameworthiness for the Outcome**:  
     - **Rule**: A side effect is intentional if the agent is **blameworthy for that specific outcome** (i.e., the outcome reflects poorly on the agent).  
     - **Fits verdicts**:  
       - Harmful outcomes (environmental harm, bankrupting rival, leaking data) → agent is blameworthy → intentional.  
       - Helpful outcome (helping environment) → agent not blameworthy (no credit claimed) → not intentional.  
       - Nurse case → shortening life is bad, but nurse isn’t blameworthy (aim is palliative) → not intentional.  
     - **Prediction for mayor**: Reducing pollution is a *good* outcome → mayor isn’t blameworthy for it (even if the *action* is blameworthy due to the illegal waiver) → **not intentional**.

  3. **Norm Violation in the Action**:  
     - **Rule**: A side effect is intentional if it results from an action that **violates a norm** (moral, legal, or professional).  
     - **Fits verdicts**:  
       - Harmful cases → involve norm violations (disregarding environment, unfair competition, negligence with data) → intentional.  
       - Helpful case → no norm violation (profit-seeking isn’t inherently wrong) → not intentional.  
       - Nurse case → no norm violation (standard medical practice) → not intentional.  
     - **Prediction for mayor**: Waiving the environmental review is a **legal norm violation** → **intentional**.

  4. **Primary Goal Alignment (Double Effect)**:  
     - **Rule**: A side effect is intentional only if it **aligns with the agent’s primary goal** (not just foreseen but part of the plan).  
     - **Fits verdicts**:  
       - Harmful cases → harm facilitates the goal (profit, competition, shipping) → intentional.  
       - Helpful case → help is unrelated to profit goal → not intentional.  
       - Nurse case → shortening life opposes the primary goal (pain relief) → not intentional.  
     - **Prediction for mayor**: Reducing pollution is unrelated to the primary goal (tax revenue) → **not intentional**.

  ### Analysis of Mayor Case:
  - **Mayor’s action**: Fast-tracks a project to raise tax revenue, waiving an obligatory environmental review.  
  - **Side effect**: Cuts air pollution (good outcome).  
  - **Key conflict**:  
    - Valence/blame rules → good outcome → **not intentional**.  
    - Norm violation rule → illegal waiver → **intentional**.  
    - Goal alignment → unrelated to tax goal → **not intentional**.  

  ### Best Guess for Verdict:
  Your friend will say the mayor **did not intentionally reduce air pollution**.  
  - **Reasons**:  
    1. **Consistency with asymmetry**: Your friend consistently treats *good* outcomes as unintentional (e.g., chairman helping environment). Pollution reduction is unambiguously good.  
    2. **Dominance of valence/blame**: The nurse case shows that even a bad outcome isn’t intentional if the agent isn’t blameworthy. Here, the good outcome lacks blame.  
    3. **Norm violation isn’t outcome-specific**: The illegal waiver makes the *action* blameworthy, but the pollution reduction itself is a positive side effect, not a targeted harm. Your friend’s prior verdicts don’t extend norm violations to *good* outcomes.  

  ### Further Case to Discriminate Rules:
  To cleanly discriminate between **blameworthiness for the outcome** (Rule 2) and **norm violation** (Rule 3), use:  
  - **Case**: *A thief robs a bank to steal money, knowing that as a side effect, the commotion will distract security and allow a sick child to escape from a locked room in the building. The thief doesn’t care about the child.*  
    - **Blameworthiness rule**: The child’s escape is good → thief not blameworthy for it → **not intentional**.  
    - **Norm violation rule**: Robbery is illegal → **intentional**.  
    - **Valence rule**: Good outcome → **not intentional**.  
    - **Goal alignment rule**: Escape unrelated to theft goal → **not intentional**.  

  **Why this works**:  
  - If your friend says the thief **intentionally freed the child**, it supports the **norm violation rule** (action is illegal, so all side effects are intentional).  
  - If your friend says **not intentional**, it supports **blameworthiness/valence rules** (good outcome, no blame for it).  

  This case isolates the conflict between outcome-focused blame and action-focused norm violation, clarifying which drives your friend’s intuition. Based on her pattern, I’d expect her to say "not intentional," reinforcing blame/valence as primary.
