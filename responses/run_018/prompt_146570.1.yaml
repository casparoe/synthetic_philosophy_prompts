  Here's a joke script focusing strictly on the coherence mechanics and extrapolation distance of CEV, designed for an audience that gets the underlying philosophy:

  ---

  **SLIDE TITLE:**  
  Consulting My CEV on Career Choices  

  **VISUAL:**  
  A flow chart labeled "Coherence Resolution Process" with arrows looping into a black hole.  

  **TEXT:**  
  *So I asked my Coherent Extrapolated Volition for career advice.  
  After 11,000 iterations of resolving preference-inconsistencies (like that time I both "wanted stability" and "wanted to join a circus"),  
  it finally converged...*  

  **...ON THE ULTIMATE COHERENT PREFERENCE:**  
  *"The only state immune to preference-exploitation by a hypothetical value-bookie  
  is one where your beliefs are systemically wrong.*  
  *False beliefs generate perpetual surprise,  
  which you *categorically* prefer over the existential dread of a fully coherent world-model."*  

  **FINAL RECOMMENDATION:**  
  ***"Become a Flat-Earther Meteorologist.  
  Maximum surprise, zero exploitability."***  

  ---  

  **Why it works for your group:**  
  1. **Turns coherence into a weapon against itself:** Forces the logical extreme of "no Dutch-bookable preferences" → prefers *being Dutch-booked by reality itself*.  
  2. **Extrapolation distance absurdity:** The "11,000 iterations" highlights how far-removed CEV is from messy human intuitions.  
  3. **Specific mechanics:**  
     - The "stability vs. circus" is a classic intransitivity.  
     - "Immune to exploitation" directly mirrors Dutch-book arguments.  
     - The punchline is *literally* a career built on inconsistent beliefs (Flat-Earther + Meteorologist).  
  4. **No low-hanging AI-pocalypse fruit:** The joke breaks on the *philosophical* rocks, not the existential ones.  

  **Roommate rebuttal bonus:** The punchline *is* "decision theory with extra steps" — it just took enough steps to tie itself into a logic-proof knot.  

  ---  

  **Alternative version (democratic aggregation):**  
  *"My CEV’s democratic congress of idealized future selves couldn’t ratify my lunch order.  
  The ‘Thrive’ faction wanted salad, the ‘Suffering-Is-Meaning’ bloc demanded ghost pepper wings,  
  and the nihilist caucus (48% of quorum) filibustered by questioning the ontological status of ‘hunger’.  
  Coherence requires unanimity.  
  I starved.*  
  *Turns out extrapolated volition is just gerrymandered Roko’s Basilisk."*
