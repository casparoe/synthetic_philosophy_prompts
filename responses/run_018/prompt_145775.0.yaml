answer: |-
  Your contradiction is brilliantly sharpened, and you've hit on one of the most enduring tensions in historiography. The key lies in unpacking Ranke's actual practice versus the popular (and often caricatured) understanding of his dictum, and then seeing how White's critique applies. Here's how to untangle it:

  1.  **Misunderstanding Ranke's "Wie es eigentlich gewesen" (How it actually was):**
      *   **Not Court Reporting:** Ranke did **not** advocate simply transcribing documents chronologically without interpretation. His revolution was methodological, not anti-interpretative.
      *   **Critical Philology:** His core demand was for historians to rigorously *critique* their primary sources using philological methods developed for studying ancient texts. This involved:
          *   Establishing the authenticity and provenance of documents.
          *   Identifying biases, agendas, and perspectives of the authors.
          *   Corroborating accounts across multiple sources.
          *   Situating sources within their specific historical context.
      *   **Interpretation within the Method:** This critical process *is itself a profound act of interpretation*. Deciding *which* sources are reliable, *how* to reconcile conflicting accounts, and *what* a source reveals about its context requires constant judgment.
      *   **The Goal:** Ranke aimed to reconstruct past *reality* (specifically political/diplomatic reality at the state level) as it was understood *by the historical actors themselves*, filtered through this rigorous source criticism. He sought to purge history of overt moralizing, mythologizing, and presentist agendas common in earlier historiography. His "objectivity" meant fidelity to the evidence *as critically established*, not the absence of the historian's mediating mind.

  2.  **Ranke's Practice vs. His Ideal:**
      *   **Narrative & Selection:** Ranke's own histories *are* narratives. He selected which events, figures, and documents to focus on based on his understanding of what was significant (primarily state power and diplomacy). He crafted a coherent story from the mass of evidence.
      *   **Implicit Tropes:** While perhaps not consciously employing White's four master tropes in the way a 19th-century novelist might, Ranke's narratives often embodied structures resonant with **tragedy** (the rise and fall of empires, the unintended consequences of power) and even **romance** (the grand sweep of national destinies, the drama of statecraft). His style, emphasizing the unique and particular, also subtly conveyed a sense of historical development, implying a form of emplotment.
      *   **Cultural Lens:** Ranke's focus on the state, great powers, and "God's hand" in history reflected his own 19th-century German Protestant, nationalist, and idealist philosophical context. This shaped his selection, emphasis, and underlying narrative structure. He was not a neutral observer outside of time.

  3.  **Applying White's Critique:**
      *   **White is Largely Correct:** Hayden White powerfully demonstrates that the *form* of the historical narrative – how the story is emplotted (tragedy, comedy, etc.), the argumentative mode, the ideological implication – is not *inherent* in the "facts" or the documents themselves. It is imposed by the historian's linguistic and cultural resources.
      *   **Ranke *was* Emplotting:** Therefore, White would argue that Ranke *was* employing narrative structures (tropes) derived from his cultural milieu, not solely from the archives. His histories *are* literary constructions.

  4.  **Resolving the Contradiction:**
      *   **Ranke Wasn't Writing Fiction:** This is the crucial point. To say Ranke employed narrative tropes **does not** mean he was writing fiction or that his work is "unconscious literature" in the sense of being *false* or *invented*.
      *   **The Difference:** Ranke's rigorous source criticism aimed (and largely succeeded) in establishing a bedrock of *factual events* that constrained his narrative: *that* a treaty was signed on a certain date, *that* a battle occurred, *that* specific diplomatic communications took place. White doesn't deny these "chronicle" level facts exist. He focuses on the *meaning-making level* above that.
      *   **Constrained Interpretation:** Ranke's method *constrained* the *possible* interpretations and narratives. While he selected which facts were significant and emplotted them within a tragic/heroic/developmental framework, he (ideally) didn't invent events contrary to his critically established sources. His narrative was built *upon* the foundation of critically verified facts, even if its overarching shape was influenced by cultural tropes.
      *   **"Scientific History" Redefined:** Ranke *did* establish a "scientific" method in the sense of a rigorous, critical, and empirically grounded *procedure* for handling evidence. This was revolutionary. However, White shows that the final *product* of history – the narrative account written for an audience – inevitably transcends mere chronicle and enters the realm of cultural meaning-making via language and form. The "science" is in the *methodology of source handling*; the "art" (or "literature") is in the *construction of the narrative*.
      *   **Self-Defeating? Not Exactly:** Ranke's *ideal* of pure, unmediated objectivity *is* impossible, as White (and Carr) demonstrate. Language, narrative form, selection, and the historian's situatedness are inescapable mediators. **However, Ranke's *method* is not self-defeating.** It provides the essential tools and constraints that distinguish historical writing from myth, propaganda, or outright fiction. It allows historians to say, with varying degrees of confidence, "This *happened*, based on this evidence, interpreted critically in this context," even while acknowledging that the *story* they tell about *why* it happened and what it *means* is shaped by narrative conventions.

  **Conclusion:**

  Your error isn't in connecting White to Ranke; it's in taking the popular caricature of Ranke (zero interpretation) too literally. Ranke demanded rigorous *source criticism* to get as close as possible to the past reality *as evidenced*, not the elimination of the historian's interpretive role in selecting, arranging, and narrating.

  *   **Ranke wasn't writing fiction.** He was constructing a narrative based on critically verified evidence.
  *   **White is correct** that this narrative inevitably employs cultural tropes and linguistic structures not derived purely from the archives.
  *   **Therefore, Ranke's histories are neither failed objectivity experiments nor unconscious literature.** They are sophisticated attempts at truthful reconstruction *within the limits of narrative form and the historian's context*, using a revolutionary critical methodology. The "scientific" aspect lies in the *disciplinary rigor of the method*, not in the fantasy of a perfectly objective, unmediated final product.

  Your biochemistry background is showing in a good way – you're looking for a clean reaction where things bind or don't. History is messier. Think of Ranke's method as establishing the chemical components and their reactions (the verified facts and events). White is analyzing the *narrative structure* built from those components – it's the complex protein folding or metabolic pathway diagram that gives meaning to the components, a structure influenced by the biologist's tools, models, and the conventions of scientific communication, not *solely* by the raw chemical data. Both levels are essential, and the tension between them is what makes historiography so rich.
