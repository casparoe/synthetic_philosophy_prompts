answer: |-
  Here’s a structured proposal draft addressing your core idea with precision, scope, and clarity:

  ---

  **Research Proposal: Convergence in Recursive Factored Deliberation with Multi-Agent Human Nodes**  

  ### 1. Research Question  
  *Does recursive deliberation (à la HCH) converge reliably when the "human" node is modeled as a disaggregated system of sub-agents (e.g., epistemic evaluator + preference aggregator) with non-shared internal states, or does internal disagreement amplify across recursion depth?*  

  ### 2. Gap Analysis: Settled vs. Contested  
  **Settled Foundations**  
  - HCH is classically idealized as a recursion of *unitary* human agents consulting AI tools [1].  
  - Factored cognition (e.g., debate, recursive reward modeling) demonstrably improves task performance by modularizing reasoning [2].  
  - Unitary-agent HCH models show convergence under ideal conditions (rationality, consistent preferences) [3].  

  **Open Gaps**  
  - **Human Node Idealization**: Existing work assumes humans as monolithic agents. *No formal work tests HCH when "human" nodes are themselves factored systems with conflicting sub-parts.*  
  - **Disagreement Propagation**: While factored *AI* systems are studied, sub-agent *disagreement dynamics* in *recursive human-AI loops* remain unmodeled.  
  - **Convergence Guarantees**: Current HCH convergence proofs rely on unitary agents. It is *contested* whether these hold under sub-agent disagreement.  

  ### 3. Methodology (12-Month Plan)  
  **Months 1–2**: **Baseline Formalization**  
  - Define unitary-agent HCH baseline (standard recursion with monolithic human nodes).  
  - Formalize metrics: convergence threshold, disagreement amplification factor, stability radius.  

  **Months 3–4**: **Factored Human Node Architecture**  
  - Model human node as two sub-agents:  
    - *Epistemic Evaluator (EE)*: Outputs belief over state space.  
    - *Preference Aggregator (PA)*: Outputs utility function over outcomes.  
  - Sub-agents share no internal state; communicate via narrow interfaces (e.g., EE sends beliefs to PA).  

  **Months 5–7**: **Recursive Loop Simulation**  
  - Simulate HCH trees (depth = 3–5) with factored human nodes.  
  - Test conditions:  
    - Sub-agent alignment (EE/PA agree).  
    - Misalignment (e.g., PA weights EE’s beliefs inaccurately).  
    - Varying recursion depth and task complexity (e.g., moral dilemmas, factual inference).  

  **Months 8–9**: **Comparison & Sensitivity Analysis**  
  - Compare convergence speed/stability vs. unitary baseline.  
  - Test robustness to: noise in sub-agent outputs, interface constraints, optimization pressure.  

  **Months 10–12**: **Generalization & Write-up**  
  - Extend to 3+ sub-agents (e.g., adding a "context interpreter").  
  - Formalize necessary/sufficient conditions for convergence.  
  - Draft paper: "Fragility in Factored Recursive Deliberation".  

  ### 4. Success/Failure Criteria  
  **Successful Result**:  
  - Convergent outcomes under bounded sub-agent disagreement *and* interface constraints.  
  - Identification of critical failure modes (e.g., disagreement amplification beyond depth *n*).  
  - Proof that unitary-agent convergence guarantees *do not extend* to factored nodes without new constraints.  

  **Clear Failure**:  
  - Simulations show no amplification *or* divergence (trivial result).  
  - Models are computationally intractable at low recursion depths.  
  - Disagreement effects are negligible vs. unitary baseline across all tested domains.  

  ### 5. Scope Boundaries  
  - **In scope**: Formal models of recursive deliberation with 2–3 sub-agent types; synthetic tasks (no human subjects); comparison to established unitary-agent HCH.  
  - **Out of scope**: Neurological realism of sub-agents; training sub-agents via ML; integration with non-recursive alignment paradigms (e.g., RLHF).  

  ### 6. Why This Fits 12 Months  
  - Builds on settled formal foundations (no novel agent training).  
  - Focused on tractable simulation + mathematical analysis (no empirical slow-downs).  
  - Failure modes still yield publishable insights (e.g., "HCH fragility to human disaggregation").  

  ---

  **Key Clarifications**:  
  - Your core insight—**factoring the human node**—is the novel lever here. Current work factors *tasks* or *AI systems*, not the human’s internal architecture.  
  - **Consensus respect**: We *don’t assume* "HCH always converges" (contested) or "factored cognition is always beneficial" (context-dependent).  
  - **Risk mitigation**: Start with minimal sub-agents (EE/PA); use known convergence metrics.  

  Let me know if you’d like to refine specific sections (e.g., task design, mathematical formalism).
