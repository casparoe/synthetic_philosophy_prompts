  ok so i'm trying to check if my decision-theory commitments hang together or if i'm just rationalizing. here's roughly where i've landed: (1) expected value is the right normative standard for rational choice, at least for well-specified one-shot cases. (2) i reject the st petersburg utility-bounding resolution because it feels ad hoc, but i also think that if EV is literally unbounded then you can justify almost any wild gamble given big enough stakes, which makes me uneasy. (3) i one-box in newcomb's problem. (4) i think you shouldnt pay in the counterfactual mugging because the coin has already landed. (5) i think a correct decision theory shouldnt depend on when you happen to first think about the problem. (6) i also have this somewhat niche view that for far-future existential-risk decisions i apply EV straight, but for present-day suffering i use a "consciousness saturation" cutoff — welfare differences above a certain complexity threshold dont scale linearly — so i'm much less fanatical about tiny-probabilty near-term catastrophes than about tiny-probability astronomical futures. do these fit together? in particular, does (6) secretly violate the uniformity that (1) and (3) seem to require? and is (4) actually consistent with (3) and (5), or am i importing some causal-decision-theory intuition that my other commitments rule out? please rank the tensions by severity and for each say what the cheapest revision would be and what it costs me conceptually. no need for citations, just the audit.
