answer: |-
  Here's a reasoned analysis and constructed scenario based on Braudel's framework:

  **Brainstorm: Three Ways Structures Cause Causal Invisibility**
  1.  **Preemptive Constraint:** A slow-moving structure (e.g., desertification) physically eliminates options *before* a decision point. Choosing the "only viable path" isn't causal; it's compliance. The decision adds no information about *why* that path exists.
  2.  **Inevitable Convergence:** A structure (e.g., population pressure on limited arable land) creates such overwhelming pressure that diverse individual decisions inevitably converge on the same outcome. The specific decision becomes one interchangeable instance of a general response.
  3.  **Nullification:** A structure (e.g., predictable, devastating floods) guarantees an outcome (e.g., abandonment of a floodplain) regardless of specific counter-decisions (e.g., building levees *here* vs. *there*). The decision cannot change the fundamental result dictated by the structure.

  ---

  **Thought Experiment: The Niger Bend Railway Debate (French West Africa, 1912)**

  In 1912, Administrator Laurent Duval, overseeing transport infrastructure for the French colonial administration in Soudan Français (modern Mali), faced pressure to connect Timbuktu to the Dakar-Niger Railway. Proposals centered on two routes: the shorter, cheaper **'Northern Savanna Route'** through semi-arid plains, or the longer, more expensive **'Southern Riverine Route'** following the Niger River's southern arc through slightly more populous areas. Duval, citing budget constraints and reports of unreliable river navigation, formally approved the Northern Savanna Route. Within a decade, the railway spurred significant but unstable growth in the northern towns, which subsequently suffered repeated, devastating famines during Sahelian droughts, leading to their decline as major hubs. Meanwhile, the southern riverine zone, though bypassed by the railway, saw sustained settlement growth due to its superior, reliable access to the Niger's water for irrigation and transport – a pattern evident for centuries before the railway decision.

  **The Historians' Dispute:**

  *   **Event-Driven Historian (Defends Duval's Causality):** "Duval's specific decision in 1912 was the *necessary trigger* for concentrated northern development and its subsequent collapse. Without his signature approving the Northern Route, the railway likely follows the Southern Route. This would have redirected colonial investment, migrant labor, and commercial activity southward decades earlier, accelerating development there *instead* of the north. The northern towns' famine vulnerability was a *consequence* of the railway concentrating population in an ecologically fragile zone *due to Duval's choice*. The south's resilience is irrelevant; Duval's action changed the *trajectory* of regional development."
  *   **Braudel-Style Structuralist (Denies Causality - Causal Shadowing):** "The outcome – sustained human viability in the southern riverine zone and vulnerability/failure in the northern savanna – was determined centuries before Duval by the **longue durée structure of the Niger River's hydrology and regional climate patterns.** The southern arc offers reliable annual flooding for recession agriculture and year-round navigation channels. The northern savanna experiences erratic rainfall and is prone to severe multi-year Sahelian droughts. Archaeological and historical records show southern settlement continuity and northern booms/busts *long* before colonialism. Duval's decision was merely an *évenement* reflecting the structure: the Northern Route *was* cheaper precisely *because* it traversed less valuable, less populated, and more arid land – land inherently less capable of supporting dense, stable settlement regardless of infrastructure. The railway accelerated an existing northern pattern (boom then bust) but didn't create the fragility; the structure guaranteed that *any* significant investment or population concentration in the north would eventually collapse under climatic stress. Conversely, *no* decision by Duval could have made the northern savanna ecologically sustainable like the south. The southern zone thrived *despite* being bypassed because of its inherent structural advantage. Duval's choice added zero predictive power; knowing the hydro-climatic structure predicts the fundamental viability map perfectly."

  **The Crucial Feature Enabling Causal Shadowing:**
  The structuralist denial hinges on the structure's **independent sufficiency and deterministic power** regarding the *fundamental* outcome (ecological viability determining settlement success/failure). The Niger's hydrology/climate *guaranteed* the southern zone's long-term advantage and the northern zone's inherent fragility *regardless* of specific infrastructure decisions. Duval's choice only affected the *timing, scale, and specific location* of the *manifestation* of this structural reality (a temporary northern boom), not the underlying reality itself. The structure alone explains *why* the north was doomed to fail and the south to persist. The decision is causally redundant for explaining the core pattern.

  **If This Feature is Removed:**
  If the structure was **not independently sufficient** – for example, if the northern savanna *could* have been sustainably developed with different technology (e.g., deep aquifers unknown in 1912) or major irrigation works *feasible* at the time, or if the southern zone's advantage was marginal and easily overturned by neglect – then the debate collapses into a **normal importance-weighting dispute**. The structuralist would argue Duval's decision was heavily constrained and the structure was the dominant factor, while the event historian argues the decision was pivotal within those constraints. The argument would be about *how much* the decision mattered relative to the structure in a contingent world, *not* whether the decision was causally redundant (adding zero predictive power). The core claim of causal shadowing – that the structure *alone* explains the outcome and the event is epiphenomenal in terms of causation – disappears if the structure doesn't rigidly pre-determine the outcome irrespective of specific actions.
