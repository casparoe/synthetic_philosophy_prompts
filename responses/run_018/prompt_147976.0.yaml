prompt: |-
  I was arguing with my friends last night about whether committees can actually "think" together, and we kept circling back to that discursive dilemma thing—where a majority backs P and P→Q but then somehow rejects Q. But every explanation I find online just lists consistency, anonymity, and independence like they're checking boxes, and it feels totally disconnected from real groups where people know different things. So I want the real spec: what does a judgment aggregation theory actually have to get right if it's meant to work outside toy logic puzzles?

  Here's what I'm after. The theory needs to handle interdependent premises without just declaring one cluster "primary"—especially those cyclic dependency chains across three or more propositions where fixing consistency in one cluster breaks it somewhere else. It also has to deal with asymetric expertise: half the group understands the biology, half the ethics, and they're jointly judging whether some policy is justified, so the rule can't treat every voter as equally authoritative on every premise. It needs to preserve the distinction between "the group believes P" and "the group is justified in believing P," and it should say something concrete about strategic misreporting—when people lie about their premise-judgments to manipulate the conclusion—rather than assuming sincerity. Give me the full desiderata list: which ones are genuinely required, which are just prejudices of one camp, the motivating case behind each, and which single requirement knocks out the most popular rules (premise-based, conclusion-based, the usual suspects). Be committed: take a definite stance on what's non-negotiable and don't just lay out options for me to pick. I'm working offline so please don't ask for bibliographies or citations—just the conceptual map, with one or two typo's is totally fine.
reasoning: |-
  Okay, let me unpack this user's query. They're frustrated with how judgment aggregation theory is usually presented—box-checking axioms without real-world relevance. The core tension: committees *do* resolve complex interdependencies in practice (e.g., ethics panels), but theory keeps stumbling over discursive dilemmas.  

  First, their explicit demands:  
  - **Interdependent premises**: Rejecting the "primary cluster" shortcut. Real groups deal with cycles (P→Q→R→~P) where fixing one link breaks another.  
  - **Asymmetric expertise**: Biology vs. ethics subteams shouldn't be equally weighted on all propositions. Current rules ignore epistemic asymmetry.  
  - **Belief vs. justification**: Distinguishing "group believes Q" from "they *should* believe Q" based on their own premises.  
  - **Strategic lying**: How rules incentivize misreporting judgments to manipulate outcomes.  

  But reading between lines:  
  They’re likely an academic/philosopher (references "desiderata," "non-negotiable") who’s argued this with peers. Their irritation at "toy logic puzzles" suggests prior exposure to List/Pettit-style models. Underlying ask: *Which requirements force us toward radically different aggregation rules?*  

  Now, my stance:  
  **Non-negotiable #1: Non-simulability of inconsistency.** Any rule permitting consistent individual inputs → inconsistent group output is broken. Discursive dilemmas aren’t quirks; they reveal system failure. This alone torches premise-based voting (fails Q in P∧(P→Q) cases) and conclusion-based voting (ignores premise coherence).  

  **Non-negotiable #2: Epistemic locality.** Expertise must map to proposition domains. If biologists dominate premises {P1,P2}, ethicists {Q1,Q2}, forcing equal weight on all premises is actively irrational. This kills anonymity.  

  **The expertise challenge**: Most rules fail asymmetric knowledge. Suppose 90% of biologists confirm P (virus airborne), but 70% of ethicists reject Q (lockdown justified). Premise-based voting with equal weights might reject Q even if biologists’ P→Q is unanimous. Required fix: Domain-restricted voting rights.  

  **Strategic vulnerability**: Conclusion-based voting invites lying. If you know the group will approve policy R if anyone links it to popular P, you might falsely assert P→R to swing the outcome. Rules must disincentivize such gaming—e.g., by making premise judgments verifiable post hoc.  

  **Belief vs. justification**: This demands a *normative layer*. Even if the group consistently outputs ¬Q, if their accepted premises {P, P→Q} entail Q, we must flag that their output is *unjustified given their own commitments*. Aggregation rules should output two things: collective judgments + a coherence audit trail.  

  **What gets sacrificed**:  
  - **Anonymity**: Necessary casualty. Equal weighting across domains is epistemically reckless.  
  - **Universal domain**: We must exclude inputs where members vote on propositions outside their expertise (e.g., ethicists voting on RNA decay rates).  
  - **Independence**: Sometimes. If biologists’ P votes correlate, forcing atomistic independence loses insight.  

  **The cyclic dependency trap**: Rules like sequential priority (fix P first, then derive Q) fail with cycles. Only solution is holistic coherence maximization—e.g., select the collective output minimizing contradictions with weighted member judgments, even if imperfect.  

  **One rule to (mostly) rule them all**:  
  Epistemic coherence aggregation:  
  1. Assign expertise domains (e.g., subset of propositions).  
  2. For each proposition, weight votes by expertise relevance.  
  3. Maximize global coherence across all accepted propositions.  
  4. Output judgments + conflict diagnostics (e.g., "Group accepts P and P→Q but rejects Q; this violates modus ponens").  

  This fails universal domain and independence but dodges discursive pitfalls and respects expertise. Strategic manipulation is harder because lying within your domain risks reputation, and cross-domain lies get discounted.  

  **Why other desiderata are secondary**:  
  - **Systematicity** (same rule for all propositions): Often desirable but less critical than coherence.  
  - **Monotonicity** (more support never hurts): Nice but dispensable if coherence requires overriding narrow majorities on peripheral premises.  

  **The core tradeoff**: We sacrifice procedural simplicity for rational outcomes. Real committees *do* this implicitly (chairs override votes on technicalities; dissent notes highlight inconsistencies). The theory must catch up.
answer: |-
  Here's the uncompromising spec for a judgment aggregation theory that works outside toy models. I'll cut through the noise and give you the non-negotiable requirements, the sacrifices, and what genuinely matters. The goal is **epistemically responsible collective agency**—not just consistency for its own sake.

  ---

  ### **Non-Negotiables (The Core Desiderata)**
  1. **Cyclic Dependency Resilience**  
     - **Why**: Real-world propositions (e.g., "Safe" → "Approved" → "Funded" → "Safe") form feedback loops. Fixing one link shouldn’t explode another.  
     - **Requirement**: Holistic coherence > local consistency. The rule must minimize *global* contradictions, even if it means overriding majorities on individual premises.  
     - **Knocks Out**: Premise-based voting (prioritizes "primary" premises, cascades errors) and sequential priority rules (fragile to order-dependence).

  2. **Epistemic Asymmetry**  
     - **Why**: Committees combine domain experts (e.g., biologists on toxicity, ethicists on consent). Treating all voters as equally competent on all propositions is actively irrational.  
     - **Requirement**: Weight judgments by voter expertise *per proposition*. Not anonymity. Not equal influence.  
     - **Knocks Out**: Majority voting on premises/conclusions, discursive dictatorship. Anonymity is a prejudice—it ignores real knowledge distribution.

  3. **Belief vs. Justification Tracking**  
     - **Why**: Groups often reach inconsistent conclusions *despite* having premises that justify Q. The output must flag when "Group believes ¬Q" conflicts with "Group’s premises entail Q."  
     - **Requirement**: Two outputs: (a) the collective judgment set, (b) a "rational accountability report" highlighting inferential gaps.  
     - **Knocks Out**: Conclusion-based voting (hides premise incoherence) and lazy coherence checks.

  4. **Strategy-Proofing**  
     - **Why**: If biologists know ethicists will rubber-stamp any policy given P, they might misreport P as true to force Q. Sincerity is naive.  
     - **Requirement**: Make misreporting costly or ineffective. Penalize voters whose judgments contradict domain consensus *ex post*, or use mechanisms that disincentivize lying (e.g., verifiable sub-questions).  
     - **Knocks Out**: Unmodified premise-based voting (easy to hijack via pivotal premises).

  ---

  ### **Secondary but Critical (Where Compromises Live)**
  5. **Non-Simulability of Inconsistency**  
     - **Why**: If individuals are consistent, the group shouldn’t output contradictions (e.g., accepting P, P→Q, but rejecting Q). Discursive dilemmas are failures, not curiosities.  
     - **Stance**: Non-negotiable *in principle*, but sometimes traded off against expertise weighting. If experts conflict globally, the least incoherent output may include local contradictions.  
     - **Knocks Out**: Rules without a coherence metric (e.g., naive majority voting).

  6. **Dependency-Aware Inputs**  
     - **Why**: Premises aren’t independent. Judging "P→Q" isn’t separable from P and Q; real agents use holistic worldviews.  
     - **Requirement**: Allow voters to submit *conditional judgments* (e.g., "Q only if P") or weight logical connections during aggregation.  
     - **Sacrifices**: Independence axiom (a prejudice—it atomizes knowledge).

  ---

  ### **What’s Overrated (Common Prejudices)**
  - **Universal Domain**: Forcing the rule to handle *any* input is masochism. Exclude judgments outside a voter’s expertise (e.g., biologists can’t vote on ethical imperatives).  
  - **Systematicity**: Applying the same rule to every proposition ignores epistemic context. Ethicists’ votes on "harm" should matter more than on "cost-effectiveness."  
  - **Monotonicity**: More support should usually help, but expertise-weighting can override this (e.g., 10 experts > 100 non-experts). Accept it.

  ---

  ### **The Motivating Nightmare Case**
  **The Biotech Policy Committee**:  
  - **Biologists (5)**: Judge safety (P), ecological risk (R).  
  - **Ethicists (5)**: Judge consent (Q), obligation to act (S).  
  - **Interdependencies**: P → ¬R, R → S, (P ∧ Q) → Justified.  
  - **Problem**: Biologists split 4-1 on P (safe), unanimity on P → ¬R. Ethicists split 3-2 on Q (consent valid). Premise-based voting approves P and Q → "Justified." But biologists know R (risk) is true if P is false, and R → S (act to mitigate), creating obligation. Conclusion-based voting misses this entirely.  
  - **What Works**:  
    1. Weight biologist judgments on P/R at 0.8, ethicists at 0.2 (and vice versa for Q/S).  
    2. Maximize global coherence: If P false and R true, force S true even if no majority directly supported S.  
    3. Output: "Collective judgment: ¬Justified. Rationality gap: Group accepts R and R→S but rejects S (vote 6-4). Revise S or dependencies."

  ---

  ### **The Only Rule That Survives This**
  **Epistemic Coherence Aggregation with Weighted Domains**:  
  1. Assign expertise domains (e.g., voter V’s weight on proposition X ∈ [0,1]).  
  2. For each possible judgment set, score coherence:  
     - Add voter weights for accepted propositions.  
     Subtract penalties for violated dependencies (e.g., P accepted, P→Q accepted, but Q rejected: penalty = sum of weights on P, P→Q, Q).  
  3. Select the judgment set with the highest net score.  
  4. Output + rationality audit.  

  **Why It Works**:  
  - Handles cycles by global optimization.  
  - Expertise weights prevent hijacking.  
  - Coherence penalties enforce justification.  
  - Strategic lying? Harder—misreporting risks coherence penalties in your domain, hurting your influence.  

  **Sacrifices**: Anonymity, independence, simplicity. But committees aren’t simple. If your friends want a theory for real groups, this is the baseline. Anything less is logic puzzles.
