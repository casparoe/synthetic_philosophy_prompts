            This program cooperates if the opponent cooperates when facing the simple cooperator. This is a kind of "moral" commitment: it tests the opponent against a known cooperator. 

            In Round 3, even if obfuscated, the behavior of the opponent remains the same (because obfuscation doesn't change the output). So if the opponent is the same program, it will still pass the test.

        - The gap between syntactic and behavioral identity: 
            - Syntactic: easy to check but fragile to obfuscation.
            - Behavioral: robust but hard to check (because of the halting problem and because it requires simulation or judge which might not terminate).

    4. Connection to correlated equilibrium and commitment:
        - The open-source program is a form of commitment: by submitting a program, you commit to a strategy that is a function of the opponent's strategy. 
        - The judge and simulation primitives allow for conditioning on the opponent's behavior in a broader sense. 
        - This setup can be seen as a way to implement a correlated equilibrium: the source code acts as a correlation device? But note, the source code is chosen independently? 

        Actually, it's more general: it allows for strategies that are functions of the opponent's strategy, which can support any correlated equilibrium and more (like the Folk Theorem for repeated games, but in one-shot).

        - The colleague's point: "correlated equilibrium with extra steps" — the source code is the correlation device. But note: in a correlated equilibrium, the device is chosen by a mediator. Here, the device is the program, which is chosen by the player. And the program can read the opponent's device. So it's a form of self-enforcing correlation.

        - Another way: it's delegation to a computer program. The program acts as an agent that follows a strategy that might be contingent.

    - Why we may no longer be playing the original PD? 
          The original dominance argument assumes that players choose actions independently and without conditioning on the opponent's strategy. But now, the strategy space is expanded to include functions from the opponent's strategy to an action. This breaks the independence. The game is now a metagame.

  ### Potential Problems and Mitigations:
  1. **CS students running away with it**: 
      - The language is simple enough that non-CS can use it. We provide examples. We encourage simple strategies. 
      - Mitigation: Remind that the goal is to explore, not to win. The payoff points are small (pastries) so winning isn't crucial.

  2. **Pairs colluding out loud or agreeing to submit identical code**:
      - This would spoil the one-shot nature. 
      - Mitigation: Announce that no communication is allowed between students during the program writing. They must work independently.

  3. **Someone writing something uncomputable**:
      - The step limit will catch it and output D.

  4. **Someone writing defect-always and winning round two and concluding the exercise is rigged**:
      - In Round 2, if a defector is paired with a cooperator, the defector wins. But if paired with another defector, they get 1. We hope that the cooperators (in pairs that cooperate) get 3, which is better than 1. We can point out in the debrief that the defector did well in some matches but not as well as the cooperating pairs.

  5. **Ambiguity in the language spec**:
      - We must specify the language precisely. We'll provide a formal grammar and examples. We'll also have the interpreter (instructor) resolve ambiguities on the spot by rule.

  6. **Time overrun in Round 2 or 3**:
      - We must be strict on time. We can run fewer pairs in class and compute the rest quickly.

  ### What the Activity Cannot Reproduce:
  - The full generality of program equilibrium (or knowledge of the halting problem) might be hard to grasp in the short time. We might not get a program that uses simulation in a robust way. The debrief will have to explain the potential of simulation-based strategies and the halting problem issue.
  - The connection to correlated equilibrium might be too abstract. We'll have to state it explicitly.

  ### Finalized Plan:

  **Round 1: Plain PD** (10 min)
  - Explain: "You are playing a one-shot Prisoner's Dilemma. Write C or D on a paper, seal it. Pairings random. Payoffs: mutual C: 3 each; mutual D: 1 each; if one C and one D: C gets 0, D gets 5."
  - Collect and run.

  **Round 2: Open-Source Program** (45 min)
  - Explain the language (CoopLang) with examples. Distribute a handout with the spec and examples.
  - Language spec (handout):

  ```
  CoopLang Program

  Your program is an expression that outputs either "C" or "D". It has access to two strings: `me` (the source code of your program) and `opponent` (the source code of the opponent's program).

  Expressions:

    "C"   -> Cooperate
    "D"   -> Defect

    IF condition THEN expression1 ELSE expression2

  Conditions:

    IDENTICAL(prog1, prog2): True if the string `prog1` is exactly equal to `prog2`.

    CONTAINS(prog, substring): True if the string `prog` contains the exact `substring` (case-sensitive).

    JUDGE(question): True if the judge answers 'yes' to the `question`. The question must be a string that asks a yes/no question about a program's output. Example: "Does the program 'C' output C when run against the program 'D'?" The judge will run the specified program against the specified opponent (with a step limit) and answer 'yes' if the output is C, 'no' if the output is D or if the simulation times out.

    Note: You can also use the result of a simulation:

    SIMULATE(prog1, prog2): Runs the program `prog1` with input `prog2` (the opponent) and returns its output ("C" or "D"). If the simulation takes more than 1000 steps, it returns "D".

  Examples:

    Example 1 (always cooperate): 
        "C"

    Example 2 (cooperate only if opponent is identical to me):
        IF IDENTICAL(opponent, me) THEN "C" ELSE "D"

    Example 3 (do what the opponent would do against me):
        SIMULATE(opponent, me)

    Example 4 (cooperate if the opponent would cooperate against a cooperator):
        IF JUDGE("Does the program [opponent] output C when run against the program 'C'?") THEN "C" ELSE "D"

  Important: 
    - The entire program must be on one line? (We might allow multiple lines for readability, but then the obfuscator can add whitespace.) Let's allow multiple lines and ignore whitespace for the purpose of string matching? But IDENTICAL is exact string match, so whitespace matters. We'll allow any whitespace (spaces, newlines) and comments (starting with #). The condition IDENTICAL is exact including whitespace and comments.
    - If your program has a syntax error, it is treated as "D".
  ```

  - Students write programs (on paper or electronically? Paper is fine). Collect after 15 minutes.
  - Run 8 pairs in class. For each pair:
      - Display both programs (if possible, write on board or read aloud).
      - Run the program A with input B and vice versa, with step limit. If a simulation or judge question is encountered, run it with step limit (and show the steps? if time, else just announce the result).
      - Record the outputs and payoffs.

  **Round 3: Obfuscation and Self-Play** (25 min)
  - Announce: "In this round, we will run your programs again, but with a twist. Each program will be obfuscated: we will add random comments and whitespace, which doesn't change its behavior but changes the string. Also, each program will be run in three interactions: 
      1. Against the obfuscated version of the same opponent you faced in Round 2.
      2. Against an unmodified copy of itself.
      3. Against an obfuscated copy of itself.
    Each interaction is worth 1/3 of the round's points."
  - Obfuscate each program by adding comments and whitespace. Example obfuscator function (instructor does this manually or with a script):
      - Insert a comment at the top: "# Obfuscated version of [original]"
      - Add comments after each line? Or randomly insert comments in the middle.
      - Change the formatting (add spaces, newlines).
      - Preserve the behavior.
  - Run part 1 in class (against the obfuscated opponent) for the same 8 pairs as Round 2.
  - For parts 2 and 3, compute quickly (without class display) and announce the results.

  **Debrief** (10 min)
  - Discuss:
    - Round 1: Why did you defect? (dominant strategy)
    - Round 2: 
        - Who got mutual cooperation? How? (likely identity-based or simulation-based)
        - What happened with simulation? (hopefully some timed out and defected)
        - Why is this different from Round 1? (because you can condition on the opponent's strategy, which breaks the dominance argument)
        - This is an example of how the strategy space changes the game.
    - Round 3: 
        - Who had their cooperation broken by obfuscation? (those using IDENTICAL)
        - Who still cooperated? (those using simulation or judge, if they didn't time out)
        - What about self-play? Did your program cooperate with itself? With its obfuscated self?
    - General lessons:
        - The open-source program changes the game to a metagame, where strategies can be contingent on the opponent's strategy.
        - This allows for cooperation but also for many equilibria (any clique that recognizes each other).
        - The obfuscation shows that syntactic properties are fragile; behavioral properties (via simulation) are robust but face the halting problem.
        - Connection to correlated equilibrium: the program acts as a correlation device that allows for contingent strategies.

  - Address the colleague's point: "This is correlated equilibrium with extra steps?" 
      - It's true that the program can be seen as a way to correlate actions. But here, the device is chosen by the players and is public to the opponent. It's a form of self-enforcing correlation.

  - What we didn't cover: 
      - The full depth of the halting problem (only saw timeouts) might need elaboration.
      - The general program equilibrium concept.

  This plan is ambitious but achievable. We must be vigilant on time.
answer: |-
  ### **Activity Design: Rationality, Games, and Computation Seminar**  
  **Goal:** Students experience how program-submission in a one-shot PD enables cooperation through syntactic/behavioral conditioning, then see why syntactic cooperation is fragile.  
  **Constraints:** 16 students, 90 mins, no projector, pastries as stakes. Minimal CS background required.  

  ---

  ### **Round 1: Plain Sealed-Envelope PD (10 mins)**  
  **Objective:** Reactivate intuition for dominant defection.  
  - **Wording:**  
    > *"Write ‘C’ or ‘D’ on a slip. Seal it. Pairings are random. Payoffs: Mutual C → 3 pts each, Mutual D → 1 pt each, You D/Opponent C → 5 pts for you, 0 for them. No talking."*  
  - **Payoffs:** (C,C)=3, (D,D)=1, (D,C)=5, (C,D)=0.  
  - **Timeline:**  
    - 2 mins: Explain rules.  
    - 3 mins: Write/seal choices.  
    - 5 mins: Pair, reveal, record payoffs.  
  - **Predictable Issue:** Mutual defection dominates. Some students defect "to win."  
    - **Handling:** Note this in debrief as baseline behavior.  

  ---

  ### **Round 2: Open-Source Program PD (40 mins)**  
  **Objective:** Experience source-code conditioning enabling cooperation.  
  #### **Language Specification: "TinyLang"**  
  - **Primitives (students write one expression):**  
    ```python
    # Keywords (case-sensitive):
    OUTPUT("C") or OUTPUT("D")                   # Direct choice
    IF IDENTICAL(opponent, me) THEN ... ELSE ...  # String equality
    IF CONTAINS(opponent, "text") THEN ... ELSE ... # Substring check
    SIMULATE(opponent, me)                         # Returns opponent’s output against you (step-limited)
    ASK_JUDGE("Q?")                                # Yes/no questions; judge answers via step-limited sim
    ```  
  - **Rules:**  
    - `me` = your program’s source, `opponent` = opponent’s source.  
    - Step limit: 100 steps per `SIMULATE`/`ASK_JUDGE` (prevents infinite loops).  
    - Timeout: **Programs that time out OUTPUT("D") and penalize the asker: −1 pt bonus for the opponent.**  
      *(Why: Makes non-halting costly. E.g., mutual simulation loops → mutual D + mutual penalty → worse than mutual defection.)*  
  - **Payoffs:** Same as Round 1.  
  - **Examples (handout):**  
    ```python
    IF IDENTICAL(opponent, me) THEN OUTPUT("C") ELSE OUTPUT("D")  // Cooperate iff identical
    IF CONTAINS(opponent, "COOPERATE") THEN OUTPUT("C") ELSE OUTPUT("D")  // Cooperate if opponent mentions "COOPERATE"
    SIMULATE(opponent, me)  // Tit-for-tat: do what opponent does to you
    IF ASK_JUDGE("Does SIMULATE(opponent, me) return 'C'?") THEN OUTPUT("C") ELSE OUTPUT("D")  // Judge-aided tit-for-tat
    ```  
  - **Timeline:**  
    - 10 mins: Explain TinyLang + examples. Emphasize timeout penalty.  
    - 15 mins: Students write programs (on paper).  
    - 15 mins: **Run 4–5 pairs publicly:**  
      - Display both programs on whiteboard.  
      - You (as interpreter) compute output, enforcing step limits.  
      - Highlight timeouts/penalties.  

  #### **Predictable Issues & Handling:**  
  - **CS minors dominate:** Assign them as "roving helpers" to unblock others.  
  - **Collusion (e.g., "let’s both write IF IDENTICAL THEN C"):** Ban student communication; ignore identical submissions.  
  - **Ambiguous code:** Rule: "Unparseable → OUTPUT("D")".  
  - **Defect-always wins:** Likely! Pair a defector against a cooperator early to show high payoff, then pair defectors to show low payoff. Debrief: *"Winning a battle doesn’t win the war."*  
  - **Uncomputable code:** Step limits force OUTPUT("D") + penalty.  

  ---

  ### **Round 3: Obfuscation Twist (25 mins)**  
  **Objective:** Break syntactic cooperation; reveal robustness of simulation.  
  - **Rules:**  
    > *"Before seeing opponents’ code, I’ve obfuscated your programs: renamed clauses, added dead code (e.g., IF 1=1 THEN ...), reordered lines. **Behavior is unchanged, but syntax differs.** Each program now plays two matches:  
    > 1. Against the obfuscated opponent from your Round 2 pair.  
    > 2. Against an obfuscated copy of **yourself**."*  
    - **Payoffs:** Average of both matches (same values as Round 1).  
    - **Self-play? YES, but only announce post-submission.**  
      *Why include it:*  
      - Teaches that self-cooperation requires **behavioral** (not syntactic) identity.  
      - Without it, students miss *why* "IF IDENTICAL" fails (e.g., obfuscated self isn’t identical).  
      - **Doesn’t muddy the lesson:** It directly exposes the syntax/behavior gap.  
  - **Timeline:**  
    - 5 mins: Explain obfuscation + self-play rule.  
    - 15 mins: Run 4–5 public pairs (obfuscated opponent + self-copy).  
    - 5 mins: Compute payoffs.  

  #### **Predictable Issues:**  
  - **"Cheating" via robust substrings (e.g., "C"):** Praise ingenuity! Debrief: *"Why does ‘C’ work? Is it scalable?"*  
  - **Panic over self-play:** Reassure: "This tests your program’s resilience."  

  ---

  ### **Debrief (15 mins)**  
  **Map Moments to Concepts:**  
  1. **Round 1 (defection):**  
     - *"Why did defection dominate? You couldn’t bind yourself to cooperation or read intentions."*  
  2. **Round 2 (cooperation emerges):**  
     - **Specific moment:** Two "IF IDENTICAL THEN C" programs cooperating.  
       - *"You created a clique! Cooperation isn’t about ‘the game’ anymore—it’s about recognizing allies. The ‘game’ is now meta: which clique do we coordinate on? (Equilibrium selection, not dominance.)"*  
     - **Specific moment:** `SIMULATE` timeout → mutual penalty.  
       - *"Simulation is powerful but risky. You traded dominance for halting problems. Robustness costs computability."*  
  3. **Round 3 (obfuscation breaks syntax):**  
     - **Specific moment:** "IF IDENTICAL" fails against self/obfuscated-friend.  
       - *"Syntax is brittle! Obfuscation widened the gap between what your program *is* and what it *does*."*  
     - **Specific moment:** Simulation/judge-based programs still work.  
       - *"Simulation looks at behavior, not skin. But it requires trust that opponents halt."*  

  **Stage the Colleague’s Argument:**  
  - *"A CS colleague says this is just ‘correlated equilibrium with extra steps.’ How? Programs correlate actions via code. But is that all?"*  
    - **Pushback:** *"In correlated equilibrium, a mediator enforces rules. Here, you *are* the mediator—your code *is* the correlation device. You delegated agency to a program."*  
  - **Socratic question:** *"Did we ‘solve’ PD? Or create a new game where cooperation is one of many equilibria?"*  

  **What the Activity Can’t Teach (Bluntly):**  
  - **Program equilibrium ≠ real-world rationality:** In life, we rarely access "source code." This is a metaphor for precommitment (e.g., contracts, algorithms).  
  - **Halting problem depth:** Timeouts make it tangible but won’t convey undecidability’s profundity. Say: *"This scratches the surface; Gödel and Turing lurk deeper."*  
  - **Evolutionary stability:** Cliques work in a fixed group, but not against invaders. Mention post-activity.  

  ---

  ### **Timeline Summary**  
  - **Round 1:** 10 mins  
  - **Round 2:** 40 mins (10 explain, 15 write, 15 run)  
  - **Round 3:** 25 mins (5 explain, 15 run, 5 compute)  
  - **Debrief:** 15 mins  
  - **Buffer:** 5 mins (total 95 mins → use pastry break to absorb overrun).  

  ### **Why This Works**  
  - **Low entry bar:** TinyLang is Python-like; non-CS students grasp conditionals.  
  - **High engagement:** Public interpretation, self-inflicted timeouts, and obfuscation create "aha!" moments.  
  - **Prevents past pitfalls:** Strict step limits, penalties, and post-submission rule changes block exploits.  
  - **Debrief bridges theory:** Every design choice (timeout penalties, self-play, obfuscation) maps to game theory/CS concepts.  

  **Final note:** Lean into chaos in Round 2—defectors winning or simulation timeouts are teachable moments. The goal isn’t tidy outcomes; it’s feeling the shift from dominance to coordination.
