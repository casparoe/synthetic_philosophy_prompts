  3. The obfuscation round highlights that cooperation based on syntactic properties (like exact string matching) is fragile because obfuscation breaks the syntactic identity without changing behavior.
  4. Simulation-based strategies can be robust to obfuscation but run into the halting problem (non-termination) and require careful handling (e.g., step limits).
