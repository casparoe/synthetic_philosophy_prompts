prompt: |-
  You are a staff analyst for the investment committee of a university endowment. The committee currently ranks candidate investment strategies by expected monetary value. One member has proposed replacing this with a risk-weighted expected-value rule: outcomes are ordered from worst to best, and each step of improvement is weighted by r(p), the risk-transformed probability of achieving at least that improved outcome, where r is strictly increasing, r(0)=0, r(1)=1, and r(p) is strictly below p for every probability strictly between 0 and 1. Because r discounts the better outcomes, unlikely large losses weigh more heavily and unlikely large gains weigh less heavily than under the status quo. The proposal grew out of a dispute over whether the endowment should hold tail-risk-heavy strategies. The chair has asked you to draft a decision memo recommending whether to adopt the risk-weighted rule, reject it in favor of the status quo, or adopt it only for a specified class of decisions. The memo should state a clear bottom line and engage the strongest consideration on the opposite side.
reasoning: |-
  Okay, the user is a staff analyst for a university endowment's investment committee. They need to draft a memo about whether to adopt a new risk-weighted expected-value rule for evaluating investment strategies. The current method uses expected monetary value (EMV), but a committee member proposed this new rule that weights outcomes differently, especially discounting better outcomes and emphasizing worse ones. 

  Hmm, the key points about the risk-weighted rule are: it orders outcomes from worst to best, applies a transformation r(p) to probabilities where r is increasing but always below p for probabilities between 0 and 1. This means it makes unlikely large losses more significant and unlikely large gains less significant compared to EMV. The context is a dispute over tail-risk-heavy strategies - probably strategies with small chances of huge losses or gains.

  First, I should understand why this proposal exists. The member seems worried about tail risks - those rare but catastrophic losses that EMV might underestimate because it treats all outcomes linearly. University endowments hate losses more than they love equivalent gains (loss aversion), and they have liabilities to fund operations forever. A big loss could force budget cuts, hurt reputation, etc. So the risk-weighting tries to address that behavioral and institutional reality.

  But there are serious problems with this rule. Let me list them: First, it violates stochastic dominance - a basic rationality requirement where if one strategy is always better in every scenario, it should rank higher. This rule might flip that because it transforms probabilities non-linearly. That's dangerous for an endowment that needs consistent decision-making. Second, the weights depend entirely on the arbitrary choice of r(p). Different r functions could lead to completely different rankings - it's not standardized like EMV. Third, it's complex and hard to communicate to trustees or stakeholders. EMV is intuitive; this isn't. Fourth, it might overcorrect by making the endowment too conservative, potentially missing out on good asymmetric bets (like investments where losses are capped but gains are huge).

  The user's memo needs a bottom line. Given these flaws, outright adoption seems unwise. But rejecting it entirely ignores the valid concern about tail risks. So maybe a middle path: use EMV as the primary tool but enhance it with tail-risk metrics like CVaR for certain high-risk strategies. That way, they address the real issue without compromising foundational decision principles.

  I should also think about the strongest counterargument: The proponent might say EMV fails during crises because it doesn't penalize tail risks enough, citing examples like the 2008 financial collapse where endowments with heavy tail risks suffered badly. And they'd argue this rule embeds prudence directly into valuation. That's compelling, but the stochastic dominance violation is a killer flaw - you can't have a rule that sometimes prefers objectively worse strategies. 

  For the memo structure: Start with a clear recommendation ("Reject full adoption..."), then explain the reasoning, acknowledge the valid concerns about tail risks, propose an alternative (EMV + CVaR for specific cases), and conclude firmly. Keep it analytical but accessible for committee members who aren't all quants.
answer: |-
  ## MEMORANDUM  
  **To:** Investment Committee Chair  
  **From:** Staff Analyst, Endowment Office  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposed Risk-Weighted Expected Value Rule  

  ### Bottom Line Recommendation
  **Reject the proposed risk-weighted expected-value (RW-EV) rule for general use. Maintain expected monetary value (EMV) as the primary ranking criterion. For strategies with significant asymmetric tail risks (e.g., certain hedge funds, derivatives, or venture capital), supplement EMV with a dedicated tail-risk assessment using Conditional Value at Risk (CVaR) at the 95% confidence level.**

  ### Rationale for Recommendation
  1.  **Preservation of Foundational Decision Principles:**  
      EMV respects *stochastic dominance*. If Strategy A yields equal or greater returns than Strategy B in *all* possible states of the world, EMV will always rank A higher. **The RW-EV rule violates this principle.** Because `r(p) < p` for intermediate probabilities, the RW-EV rule overweights the probability mass of worse outcomes relative to better ones. This distortion can lead to the perverse result where a strategy with objectively worse payoffs in every state is ranked *higher* than a dominant strategy if its losses in bad states are slightly less severe (but still worse) and its gains in good states are significantly discounted. This undermines rational capital allocation.

  2.  **Arbitrariness and Lack of Standardization:**  
      The RW-EV rule’s output is heavily dependent on the specific, arbitrary choice of the `r(p)` function. Different increasing functions satisfying `r(0)=0`, `r(1)=1`, and `r(p)<p` will produce different rankings of the same strategies. Without a theoretically grounded or universally accepted `r(p)`, the rule introduces significant subjectivity and inconsistency into the evaluation process, hindering objective comparison and committee consensus.

  3.  **Operational Complexity and Opacity:**  
      The RW-EV rule is significantly more complex to calculate, explain, and audit than EMV. Communicating its implications to trustees, auditors, and other stakeholders would be challenging. EMV provides a clear, intuitive, and universally understood benchmark.

  4.  **Potential for Over-Correction and Missed Opportunity:**  
      While aiming to mitigate tail risk, the RW-EV rule systematically *underweights* the value of positive asymmetric payoffs (e.g., modest probability of very high returns). Endowments, with long time horizons, can often tolerate some volatility to capture such upside. RW-EV could lead to excessive conservatism, rejecting strategies with highly favorable EMV and acceptable risk profiles under a more targeted analysis.

  ### Engagement with the Strongest Counterargument
  **The most compelling case for RW-EV** is its explicit and intuitive incorporation of *loss aversion* and *tail-risk aversion*, which align with the endowment’s fiduciary duty to preserve capital and avoid catastrophic losses. EMV treats gains and losses symmetrically, potentially underweighting the severe disutility of large, unlikely losses that could jeopardize funding obligations, damage reputation, or force suboptimal liquidity events. RW-EV directly addresses this by overweighting the probability of achieving outcomes near the worst-case end of the spectrum. Proponents argue this better reflects the committee’s revealed preference for prudence, especially regarding strategies concentrated in tail risks.

  **Why this does not justify full adoption:** While the concern about tail risk is **valid and critical**, the RW-EV rule is a flawed solution due to its violation of stochastic dominance and inherent arbitrariness. Addressing tail risk aversion requires tools designed *specifically* for that purpose, without distorting the entire valuation framework. The recommended approach (EMV + targeted CVaR analysis) directly quantifies the magnitude of potential extreme losses (`Expected Shortfall`), providing a clearer, more robust, and interpretable measure of tail risk than the opaque weighting mechanism of RW-EV. This allows the committee to explicitly set tolerance limits for tail risk while preserving the rationality and transparency of EMV for the core evaluation.

  ### Proposed Implementation for Tail-Risk Strategies
  1.  **Identify Strategies:** Apply enhanced screening to strategies exhibiting significant negative skewness, high kurtosis, or known exposure to extreme event risks (e.g., volatility selling, catastrophe bonds, deep out-of-the-money options writing, highly levered credit).
  2.  **Calculate CVaR (95%):** For these strategies, compute the Conditional Value at Risk (expected loss given that the loss exceeds the 95th percentile VaR). This quantifies the average severity of losses in the worst 5% of scenarios.
  3.  **Set Thresholds:** Establish committee-approved CVaR tolerance limits relative to strategy size and overall portfolio.
  4.  **Decision Framework:** Rank primarily by EMV. **Reject** strategies where CVaR (95%) exceeds tolerance limits, regardless of EMV attractiveness. This directly targets the tail-risk concern without distorting the core valuation.

  ### Conclusion
  The motivation behind the RW-EV rule—heightened sensitivity to catastrophic tail losses—is prudent and merits integration into our process. However, the rule itself is fundamentally unsound due to its violation of stochastic dominance, reliance on arbitrary parameters, and unnecessary complexity. Rejecting the RW-EV rule in favor of maintaining EMV as our primary criterion, while implementing a targeted CVaR-based tail-risk filter for specific high-risk strategies, provides a robust, rational, and operationally feasible approach. This balances the pursuit of returns with the imperative of capital preservation.

  **Recommendation:** Reject the proposed RW-EV rule for general adoption. Adopt EMV supplemented by CVaR (95%) screening for tail-risk-heavy strategies.
