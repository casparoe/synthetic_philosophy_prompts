prompt: |-
  I'm preparing a 90-minute graduate seminar session—about twelve participants, all with background in metaphysics or philosophy of mind—that takes up Parfit's teletransporter but pushes past the standard binary framing of survival versus death, identity versus non-identity. I want a structured classroom activity that makes the group feel, before anyone names the view, that psychological continuity is a multi-dimensional, gradable relation and that ordinary practices of assigning rights and responsibilities implicitly presuppose a sharp identity boundary that collapses once branching is parameterized.

  The niche scenario I want built in is this: rather than a single perfect replica, the scanning device can be calibrated along independent axes—episodic autobiographical memory, procedural and skill-based memory, core moral dispositions, first-person narrative coherence, and affective temperament—each preserved at a selectable fidelity level (say, 30%, 60%, or 95%). Running the scan at different calibrations produces not one successor but a cluster of four to six co-existing candidates, each with a distinct overlap-and-deficit profile relative to the original. Before scanning, the original had made three concrete commitments: a co-authorship obligation on an unfinished paper, a personal debt of a specific sum, and a long-term caregiving vow.

  Please design a runnable game or structured deliberation around this scenario. The deliverable should specify the setting, group size, and division of roles; provide rules and a timeline that fit within 90 minutes, with phases that unfold before the facilitator names the philosophical idea; include small but real stakes—points, a binding group decision with a visible record, or a role-play constraint that makes compromise costly—so participants experience coordination failure rather than merely discussing it; build in a mechanism by which participants initially try to identify the one true successor and are then forced, by the rules of the scenario, to distribute obligations across partial candidates or leave them unfulfilled; include a debrief that maps specific moments in the activity onto parts of Parfit's argument (psychological continuity as what matters, the failure of identity as a deep further fact, the distributability of survival), predicts where groups will get stuck (e.g., inventing arbitrary thresholds, appealing to bodily continuity despite the premise), and explains how to handle that; and conclude with an honest note on which feature of the philosophical view the activity cannot reproduce—likely the first-person phenomenological intuition that I will be the one waking up, or the metaphysical claim that there is literally no fact of the matter rather than merely an epistemic limitation—and how the facilitator must supply it verbally.

  The activity should not ask participants to consult texts, produce bibliographies, cite specific works, or reference obscure theories. It should work entirely from the scenario and the rules you provide.
reasoning: |-
  We are designing a 90-minute seminar activity for about 12 graduate students in metaphysics or philosophy of mind. The goal is to explore Parfit's teletransporter thought experiment but push beyond the binary framing by introducing multiple dimensions of psychological continuity and multiple partial replicas.

  The scenario:
  - The teletransporter can be calibrated along five independent axes (each at 30%, 60%, or 95% fidelity):
    1. Episodic autobiographical memory
    2. Procedural and skill-based memory
    3. Core moral dispositions
    4. First-person narrative coherence
    5. Affective temperament
  - The scan produces 4 to 6 co-existing candidates, each with a distinct profile (each axis set to one of the three levels, but note: not every combination is present; we'll have a fixed set of profiles to make it manageable).
  - The original person (let's call them "Alex") has made three commitments:
    1. Co-authorship obligation on an unfinished paper (requires knowledge and skills, and commitment to the project).
    2. Personal debt of a specific sum (requires a sense of moral obligation and memory of the debt).
    3. Long-term caregiving vow (requires emotional connection, moral commitment, and memory of the vow).

  Activity Design:
  - We want participants to feel that psychological continuity is multi-dimensional and gradable, and that our ordinary practices of assigning rights and responsibilities rely on a sharp identity boundary that breaks down in branching cases.
  - The activity should have real stakes: points, a binding group decision, or a role-play constraint that makes compromise costly.
  - The group initially tries to identify the one true successor (which will fail) and then must distribute obligations across the partial candidates or leave them unfulfilled.
  - The debrief will map the activity to Parfit's arguments.

  Structure:
  1. Introduction and Setup (10 minutes)
  2. Role Assignment and Scenario Presentation (10 minutes)
  3. Phase 1: The Search for the True Successor (20 minutes)
  4. Phase 2: Distribution of Obligations (25 minutes)
  5. Phase 3: Consequences and Coordination Failure (10 minutes)
  6. Debrief and Discussion (15 minutes)

  Total: 90 minutes.

  Detailed Plan:

  1. Introduction and Setup (10 minutes)
     - Facilitator introduces the activity: We are going to engage in a thought experiment that builds on Parfit's teletransporter. The goal is to make a collective decision about what happens to Alex's obligations after a teletransportation event that produces multiple partial replicas.
     - Explain the five dimensions of psychological continuity and the three fidelity levels (30%, 60%, 95%). Emphasize that each replica has a unique profile.

  2. Role Assignment and Scenario Presentation (10 minutes)
     - Divide the 12 participants into:
          - 1 participant as "Alex" (the original, who will be "scanned" and then becomes an observer).
          - 6 participants as the "Replicas" (each assigned a distinct profile card, see below).
          - 5 participants as the "Council of Adjudicators" (they will make the final decisions and are responsible for the well-being of the community and upholding commitments).
     - The profiles: We have 6 replicas. We assign each a unique combination of the five dimensions at the three levels. We'll predefine 6 profiles (to avoid combinatorial explosion). For example:

          Replica 1: 
            - Episodic memory: 95%
            - Procedural memory: 30%
            - Moral dispositions: 60%
            - Narrative coherence: 60%
            - Affective temperament: 30%

          Replica 2: 
            - Episodic memory: 60%
            - Procedural memory: 95%
            - Moral dispositions: 30%
            - Narrative coherence: 30%
            - Affective temperament: 95%

          ... and so on for 6 replicas.

     - Each replica gets a card with their profile and a brief description of what that profile means for them (e.g., 95% episodic memory: remembers almost all life events; 30%: remembers only fragments).
     - The Council of Adjudicators is given the list of Alex's three commitments and a description of what each requires. They are also given a decision form.

  3. Phase 1: The Search for the True Successor (20 minutes)
     - The Council must decide which replica is the "real" Alex and thus inherits all three obligations. They can interview the replicas (who role-play according to their profile). The replicas must answer honestly based on their profile.
     - The Council has 15 minutes to deliberate and must vote at the end (by secret ballot) for one replica. They are told that if they cannot agree on one, then no replica is the true successor and the obligations must be distributed (but in this phase, they are trying to pick one).
     - After 15 minutes, they vote. The facilitator collects the votes. If they have a majority (at least 3 votes for one replica), that replica is declared the successor. Otherwise, they move to Phase 2 without a successor.

     Note: The stakes in Phase 1: If they pick a replica, that replica must take on all obligations. The replica might object (if they feel they are not capable) and this might lead to failure in fulfilling the obligations. Also, the replicas that are not chosen might feel they are being neglected and cause social unrest (role-played).

  4. Phase 2: Distribution of Obligations (25 minutes)
     - If the Council did not pick a successor (or even if they did, but the facilitator can override if the choice is clearly problematic) then they must distribute the obligations.
     - The Council must assign each obligation (paper, debt, caregiving) to one or more replicas (they can split an obligation if needed, e.g., multiple replicas co-author the paper). They have 15 minutes to deliberate and assign.
     - Each replica has the right to accept or reject the assignment (role-played). If a replica rejects, the Council must reassign.
     - The Council must record their assignments and get acceptances from the replicas.

     - Constraints:
          - The paper must be finished within a month (so the assigned replica(s) must have sufficient procedural memory and narrative coherence to write).
          - The debt must be paid in full by one month (so the assigned replica must have the moral disposition and memory of the debt to feel obligated and pay).
          - The caregiving must be carried out for a year (so the replica must have the affective temperament and memory of the vow).

     - The replicas can negotiate: they might accept only if they get something (e.g., resources) or if the obligation is shared. The Council has limited resources (e.g., they can offer a small stipend for the debt payment, but not enough to cover the whole debt, so the replica must pay the rest).

  5. Phase 3: Consequences and Coordination Failure (10 minutes)
     - The facilitator reveals the outcomes based on the assignments and the replicas' profiles:
          - For the paper: if the assigned replica(s) have at least 60% in both procedural memory and narrative coherence, the paper is finished on time. Otherwise, it is delayed or of poor quality (failure).
          - For the debt: if the assigned replica has at least 60% moral dispositions and 60% episodic memory (to remember the debt), they pay on time. Otherwise, they don't pay (failure).
          - For the caregiving: if the assigned replica has at least 95% affective temperament and 60% episodic memory (to remember the vow), they carry it out faithfully. Otherwise, they neglect it (failure).

     - The facilitator tallies the failures. Each failure causes a penalty for the Council (e.g., loss of reputation points). The group sees the consequences of their distribution.

  6. Debrief and Discussion (15 minutes)
     - Facilitator leads a discussion:
          - How did the group try to find the one true successor? What arguments were used? (Likely: they focused on one dimension arbitrarily, or tried to average, or looked for the highest in one key area.)
          - What happened when they had to distribute? How did they assign obligations? (Likely: they matched the obligation to the replica with the highest relevant dimension, but that replica might have been weak in another required dimension, leading to failure.)
          - Mapping to Parfit:
              - Psychological continuity is what matters: but it comes in degrees and multiple dimensions.
              - The failure of identity as a deep further fact: the group couldn't agree on one successor because there is no fact of the matter.
              - Survival can be distributed: we see that different obligations might be carried out by different replicas, but this is messy and may fail.

     - Predictable sticking points:
          - Inventing arbitrary thresholds (e.g., "we'll say 95% in any two dimensions makes you the real Alex").
          - Appealing to bodily continuity (despite the premise of teletransportation) - if this happens, remind them that in this scenario, the original body is destroyed and the replicas are in new bodies.

     - What the activity cannot capture:
          - The first-person phenomenological intuition: the feeling that "I" will be the one waking up. The activity is third-person (we are assigning obligations to others). The facilitator must explain that from the first-person perspective, we might still feel that we are one of them (or none) but there is no fact of the matter.
          - The metaphysical claim that there is no fact of the matter: in the activity, we are making practical decisions, but we might still feel that there is a truth we just don't know. The facilitator must stress that Parfit argues that there is no such fact.

  Materials:
     - Profile cards for 6 replicas (predefined).
     - Description of Alex's three commitments and what they require.
     - Decision forms for the Council (for Phase 1 vote and Phase 2 assignment).
     - A way to record the outcomes (whiteboard or flip chart).

  Note: The activity is designed to create a coordination problem. The group will likely fail to fulfill all obligations because the distribution is imperfect and the replicas are partial. This illustrates the practical problems that arise when identity is not binary.

  Adjustments for time: If Phase 1 ends quickly (e.g., they agree early that there is no true successor), move to Phase 2. If they spend too long in Phase 1, the facilitator can cut it short and note that they are stuck.

  This design avoids texts and references, relying solely on the scenario and the rules.
answer: |-
  ### **Structured Activity: "The Parfitian Assembly"**  
  **Setting:** Graduate seminar (12 participants).  
  **Duration:** 90 minutes.  
  **Goal:** Experience the collapse of binary identity by distributing obligations across partial psychological continuums, revealing coordination failure.  

  ---

  #### **Setup (15 mins)**  
  1. **Roles & Materials:**  
     - **Alex (1 participant):** The original person facing teletransportation. Receives a card with three obligations:  
       - *Co-authorship:* Finish a metaphysics paper in 2 weeks (requires **procedural memory + narrative coherence**).  
       - *Debt:* Repay $10,000 to a friend in 1 week (requires **episodic memory + moral dispositions**).  
       - *Caregiving:* Provide daily care for Alex’s ailing mother for 1 month (requires **affective temperament + moral dispositions**).  
     - **Replicas (6 participants):** Each receives a randomized **profile card** (see table below).  
     - **Adjudicators (5 participants):** Decide how to allocate Alex’s obligations. Given a "Binding Ledger" to record decisions.  
     - **Friend/Mother (2 role-players):** Can veto inadequate replica assignments (e.g., refuse payment from a replica with low moral fidelity).  

  2. **Replica Profiles (Calibrated Axes):**  
     | Replica | Episodic Memory | Procedural Memory | Moral Dispositions | Narrative Coherence | Affective Temperament |  
     |---------|-----------------|-------------------|---------------------|-----------------------|------------------------|  
     | R1      | 95%             | 30%               | 60%                 | 30%                   | 60%                    |  
     | R2      | 60%             | 95%               | 30%                 | 60%                   | 30%                    |  
     | R3      | 30%             | 60%               | 95%                 | 30%                   | 95%                    |  
     | R4      | 95%             | 60%               | 30%                 | 95%                   | 30%                    |  
     | R5      | 30%             | 30%               | 95%                 | 60%                   | 60%                    |  
     | R6      | 60%             | 30%               | 60%                 | 95%                   | 95%                    |  

     *Profile key:*  
     - **95%:** Near-perfect preservation (e.g., R1 recalls almost all life events).  
     - **60%:** Moderate gaps (e.g., R3 has strong morals but inconsistent self-narrative).  
     - **30%:** Severe deficits (e.g., R2’s skills are intact but emotional responses are erratic).  

  3. **Rules & Stakes:**  
     - **Binding Ledger:** Adjudicators’ decisions are final. Each unfulfilled obligation costs the group 1 "stability point" (loss = group "fails" the scenario).  
     - **Replica Autonomy:** Replicas can refuse obligations if their profile makes compliance implausible (e.g., R2 rejects caregiving due to 30% affective temperament).  
     - **Veto Power:** Friend/Mother can reject replicas below 60% in key dimensions (e.g., debt repayment requires 60%+ episodic memory).  

  ---

  #### **Phase 1: The Successor Hunt (20 mins)**  
  - **Task:** Adjudicators must identify *one* replica who inherits *all* obligations. Replicas advocate for themselves.  
  - **Constraints:**  
    - Adjudicators have 10 mins to interview replicas (e.g., *"Does R1 remember promising to repay the debt?"*).  
    - Vote at 15 mins. If no majority (≥3 votes), Phase 1 fails.  
  - **Stakes:** If a replica is chosen, they must accept all obligations. Failure to fulfill *any* costs 1 point.  
  - **Predictable Failure:** Replicas’ uneven profiles prevent consensus (e.g., R4 has perfect narrative coherence but weak morals).  

  ---

  #### **Phase 2: Obligation Distribution (25 mins)**  
  - **Task:** Adjudicators assign each obligation to 1+ replicas.  
  - **Constraints:**  
    - Each obligation can be split (e.g., two replicas co-author the paper).  
    - Replicas can negotiate (e.g., *"I’ll repay the debt if another handles caregiving"*).  
    - Ledger entries must be finalized in 20 mins. Friend/Mother vetoes trigger reassignment.  
  - **Stakes:**  
    - **Compromise Cost:** Splitting obligations doubles the points lost if failed (e.g., failed co-authorship = -2 points).  
    - **Veto Impact:** Each veto wastes 5 mins, forcing rushed decisions.  

  ---

  #### **Phase 3: Consequences (10 mins)**  
  - **Outcome Calculation:**  
    | Obligation          | Success Condition (Replica’s Profile)                                  | Failure Penalty |  
    |---------------------|-------------------------------------------------------------------------|-----------------|  
    | Co-authorship       | Procedural memory + Narrative coherence ≥ 120% (e.g., 60%+60%)         | -1 (or -2 if split) |  
    | Debt repayment      | Episodic memory ≥ 60% AND Moral dispositions ≥ 60%                     | -1 (or -2)      |  
    | Caregiving          | Affective temperament ≥ 95% OR (Moral dispositions + Affective ≥ 120%) | -1 (or -2)      |  

  - **Facilitator:** Tally points. Most groups lose 2–4 points due to mismatched assignments or vetoes.  

  ---

  #### **Debrief (20 mins)**  
  1. **Map to Parfit:**  
     - **Psychological Continuity as Gradable:** Profiles forced scrutiny of *which aspects* matter for specific obligations (e.g., caregiving requires affective traits, not memory).  
     - **Collapse of Identity:** Phase 1 failure mirrors Parfit’s "no deep further fact."  
     - **Distributed Survival:** Phase 2 shows obligations *can* be shared but at a coordination cost.  

  2. **Predictable Sticking Points:**  
     - **Arbitrary Thresholds:** Groups often invent "total %" rules (e.g., averaging scores). Highlight how this ignores dimension-specific needs.  
     - **Bodily Continuity Appeals:** If adjudicators ask "Where’s the original body?", note the teletransporter premise (*Reasons and Persons*, §80) excludes this.  
     - **Solution:** Emphasize Parfit’s claim that identity isn’t what matters—psychological connectedness is.  

  3. **Limitation of the Activity:**  
     - **Uncaptured Element:** The first-person intuition of *being* the successor (e.g., "I will wake up in the replica").  
     - **Facilitator’s Role:** Verbally stress Parfit’s point: phenomenology suggests binary survival, but metaphysics shows it’s an illusion. The activity’s third-person view cannot replicate this tension—it must be explained.  

  ---

  #### **Why This Works**  
  - **Stakes Force Engagement:** Binding decisions and points make coordination failure visceral (not theoretical).  
  - **Role-Play Highlights Pragmatics:** Replicas’ vetoes and adjudicators’ compromises mirror real-world legal/moral dilemmas.  
  - **Dimensional Gradability:** Profiles make psychological continuity concretely multi-axis, undermining all-or-nothing identity.  

  **Prep Notes:** Print profile cards, obligation descriptions, and a ledger. No texts needed—rules and roles drive the exercise. Adjust timing if group size varies.
