prompt: |-
  hey, i've been trying to work out my intuitions about anatta and personal identity, and i think i've hit a pattern but it feels contradictory. can you help me formalize it, tell me what breaks, and predict a new case?

  case one: classic theravada rebirth. monk dies, consciousness picks up in a new infant body, zero shared memories. my verdict: not "the same person" in any psychological sense, but the causal stream of skandhas continues, so anatta is intact - no self migrated, just conditions rolling forward.

  case two: a split-brain patient after surgery, left and right hemispheres seem to run seperate awareness streams. my verdict: neither half is "the original monk" fully, but neither is a brand new being either. its like the stream forked and both branches carry some momentum.

  case three: here's the weird injected scenario. imagine through extreme meditation or some tech we don't have, the sankhara and vinnana of one person are literally divided - half enter body A, half enter body B. both bodies have partial memories, both maintain karmic continuity. my verdict: both are legitimate continuations, but neither is "the" original. like a river splitting into two deltas, both are still that river.

  case four: now copy all five skandhas digitally with perfect fidelity, then the biological body dies. the digital entity has every memory, every mental formation. my verdict: this is NOT rebirth. its a duplicate, not a stream. the biological chain of dependant origination is broken, so the continuity is fake even though the content is identical.

  so my gut principle seems to be something like "identity is proportional to uninterrupted causal dependency of the skandhas within a living biological lineage, but splitting doesn't kill continuity, it just distributes it." but thats ad hoc. can you state a cleaner principle that saves all four? if not, which verdict should i drop? also, what does your principle predict if the digital copy from case four is gradually integrated with sensory input from a biologically cloned body - is that rebirth, a hybrid, or still a duplicate?

  i dont need citations or a reading list, just the logic. and please point out if im secretly smuggling in a soul or self without noticing.
reasoning: |-
  Okay, let's tackle this problem step by step. The user has presented four cases where they've applied their intuition about anatta and personal identity. Each case has a verdict, but they're concerned about consistency. The core issue seems to be defining a principle that accounts for all four judgments without contradiction.

  First, I need to understand their current principle: identity depends on uninterrupted causal dependency of the skandhas within a biological lineage. Splitting is acceptable but copying isn't. The challenge is formalizing this without being ad hoc.

  Looking at the cases:
  Case 1: Rebirth with no memories - causal continuity without psychological identity. This aligns with Theravada teachings where the stream continues via dependent origination.
  Case 2: Split-brain - continuity forks, both branches are valid continuations. The biological system splits but maintains causal links.
  Case 3: Artificial division - similar to case 2, both resulting entities share the original causal history.
  Case 4: Digital copy - perfect duplication but no causal connection to the original biological process. Thus, it's a duplicate, not a continuation.

  The key difference between splitting and copying seems to be whether the skandhas maintain a direct causal chain from the original. In splitting (cases 2 and 3), the division happens within the same biological continuum. The new entities are modified continuations. In copying (case 4), the skandhas are recreated elsewhere, breaking the causal chain.

  So the principle could be: Continuity requires unbroken causal dependency within the same physical medium (biological lineage). Splitting preserves continuity because it's a modification of the existing stream. Copying creates a parallel stream without historical connection.

  But is this consistent? The user might be smuggling in materialism by privileging biology. However, Buddhism doesn't specify physical medium - it's about the causal chain. Yet in practice, skandhas manifest biologically. 

  Now the hybrid scenario: digital copy gradually integrated with a cloned biological body. The clone has its own causal history. Even with sensory integration, the digital part lacks causal connection to the original. This would still be a duplicate unless the integration creates a new causal chain from the clone's biological processes. But that wouldn't link back to the original person.

  Potential contradictions:
  - Why is biological splitting valid but digital copying not? If consciousness isn't tied to biology, digital could be continuous. But the user's intuition privileges biological causality.
  - The split-brain case assumes consciousness can divide, which some neuroscientists debate. But we accept the premise for argument.

  Refined principle: Identity requires spatiotemporal continuity of the causal chain. Splitting maintains this through branching within contiguous matter. Copying breaks it by creating a separate instance.

  For the hybrid: It's a duplicate integrated with a new biological system. Not a continuation of the original stream. The clone body starts its own causal chain.

  This preserves all four verdicts. The user isn't smuggling a soul; they're emphasizing process over substance. But the biological bias might need examination - what if non-biological systems could host dependent origination? That's beyond the current scope though.

  Final principle: Continuity is maintained only when the skandhas' causal chain evolves without recreation elsewhere, allowing branching but not replication.
answer: |-
  Here's a formalized principle derived from your intuitions, tested against your cases, and applied to your new scenario. The key is focusing on **causal continuity without a persistent substrate**:

  ### Core Principle:
  **"Person-continuity exists when there's an unbroken chain of *causal dependence* (dependent origination) within a single spatiotemporal continuum, regardless of qualitative changes or division. Copying breaks continuity by creating a parallel causal origin."**

  ### Breakdown:
  1. **Causal Dependence**: Each moment of experience arises from preceding conditions (skandhas), not from an enduring "self."
  2. **Spatiotemporal Continuum**: The physical/biological process must be contiguous (no gaps in space-time). Splitting preserves this; copying violates it.
  3. **No Qualitative Threshold**: Memories, personality, or even division don't break continuity—only severed causality does.

  ### Applied to Your Cases:
  | **Case** | **Your Verdict** | **Principle's Verdict** | **Why It Works** |
  |----------|------------------|--------------------------|------------------|
  | **1: Rebirth** | Not same "person," but causal stream continues | ✅ Continuity intact | Biological death doesn't sever causality; new consciousness *depends* on previous karmic conditions. |
  | **2: Split-Brain** | Both are partial continuations | ✅ Continuity forked | Both hemispheres share causal history and exist in the same spatiotemporal continuum (one body). |
  | **3: Artificial Division** | Both are legitimate continuations | ✅ Continuity distributed | Division preserves causal dependence within biological systems (no new "origin point"). |
  | **4: Digital Copy** | Duplicate, no continuity | ❌ Continuity broken | Copying creates a *new causal origin* disconnected from the original chain (no dependence on prior physical processes). |

  ### Where Your Gut Principle Succeeds:
  - **Splitting ≠ Breaking**: Division distributes causality but maintains dependence on the original chain (cases 2 & 3).
  - **Copying = Breaking**: Digital replication lacks causal dependence on the prior biological process (case 4).
  - **Anatta Preserved**: No "self" transfers; only conditions propagate. You avoid smuggling in a soul by making continuity *process-based*, not substance-based.

  ### The Contradiction Resolved:
  Your initial phrasing ("biological lineage") was too narrow. **Spatiotemporal continuum** covers all cases: rebirth (same causal chain across bodies), splits (same body), and artificial division (same biological "substrate" distributed). Copying fails because it lacks spatiotemporal contiguity—it's a replica, not an extension.

  ### Prediction: The Digital-Clone Hybrid
  **Scenario:** Digital copy (case 4) is gradually integrated with sensory input from a biologically cloned body.  
  **Verdict:** **Still a duplicate** (not rebirth or hybrid continuity).  

  **Why:**
  - The digital copy's "consciousness" originates from data replication, not the deceased's biological processes (broken causal chain).
  - The cloned body has its own nascent causal history (its skandhas arise from its biology, not the deceased's).
  - **Integration ≠ Causation**: Even with seamless input, the digital entity's existence doesn't *depend* on the original's death. It's a new causal branch grafted onto a new body—functionally a sophisticated puppet, not a continuation.

  ### Potential Flaw in Your Intuition:
  You **privilege biology** implicitly. Buddhism doesn't require a *biological* medium—only causal dependence. If a non-biological system (e.g., a machine) could truly inherit a causal chain *without copying* (e.g., gradual replacement of neurons with silicon), continuity *might* hold. But in your digital case, the abrupt copy severs causality. This isn't smuggling a soul—it's a limitation of how "dependence" is defined in your framework.

  ### Final Principle (Refined):
  **"Continuity persists iff (if and only if) every state of the system arises from the immediate prior state via dependent origination within one unbroken spatiotemporal trajectory."**  
  Splits? Trajectory branches. Copies? New trajectory. Rebirth? Trajectory continues (per Buddhist causality). Digital clones? Independent trajectory. No self—just conditions rolling on or new conditions beginning.
