answer: |-
  **Root:** Does music represent Platonic Ideas (mediated) or directly copy the Will?
  *   **Branch A: Music is the direct copy of the Will.**
      *   **Branch A1: Tonal hierarchy is structurally essential.**
          *   **Branch A1a: Preference for melody is systemic.** *Position: Essentialist Directness.* Core: Music *must* possess tonal hierarchy for direct Will-expression, making melody primary. Awkward: Dismisses Bach's complex counterpoint as less metaphysically potent.
          *   **Branch A1b: Preference for melody is bias.** *Position: Unnamed.* Core: Tonal hierarchy is essential for direct Will-copying, but Schopenhauer's vocal bias is contingent. Awkward: Must grant profound Will-expression to simple harmonic progressions lacking melody.
      *   **Branch A2: Tonal hierarchy is merely illustrative.**
          *   **Position: Fluid Directness.** Core: The melodic analogy is heuristic; any organized sound directly copying Will's structure is music. Awkward: Grants "direct Will-expression" status to potentially chaotic noise music.
          *   *(Collapses with B2b if Will's structure is inherently representational)*
  *   **Branch B: Music represents Platonic Ideas (mediated).**
      *   **Branch B1: Tonal hierarchy is structurally essential.**
          *   **Branch B1a: Preference for melody is systemic.** *Position: Essentialist Representation.* Core: Music represents Ideas *only* through tonality's stratified hierarchy, privileging melody. Awkward: Excludes non-Western tonal systems or Baroque fugues as deficient representations.
          *   **Branch B1b: Preference for melody is bias.** *Position: Unnamed.* Core: Tonality structures Idea-representation, but Schopenhauer's melody-focus reflects taste, not ontology. Awkward: Allows animal/harmonic "Ideas" primary representation over human/melodic.
      *   **Branch B2: Tonal hierarchy is merely illustrative.**
          *   **Branch B2a: Non-tonal music fails.** *Position: Conservative Representation.* Core: Without tonality's specific analogy, music cannot adequately represent Ideas; non-tonal sound isn't true music. Awkward: Must deny Schoenberg's atonality any meaningful metaphysical content.
          *   **Branch B2b: Non-tonal music can represent.** *Position: Expanded Representation.* Core: Any sonic structure expressing universal forms (Ideas) qualifies, including atonal/drone music. Awkward: Risks equating algorithmically generated sound with Beethoven in metaphysical transparency.
