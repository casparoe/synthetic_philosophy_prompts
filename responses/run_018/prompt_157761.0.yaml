  Next, the Normative Foundation via Sequentialization. Jeffrey's rule isn't commutative—order of updates affects results. In science, evidence comes in sequences, so how to justify the rule when order matters? Dutch books arguments are tricky here. This is upstream because justifying the rule under sequences could stabilize other applications. Current work by Diaconis, Zabell, or Huttegger on path-independence might help. Tractability is medium-high with tools from dynamic coherence.

