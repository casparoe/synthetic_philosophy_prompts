prompt: |-
  I head the communications office of a national electoral commission, and part of my job is reviewing speeches, press releases, and official statements -- ours and, in an advisory capacity, ministers' -- for invocations of 'the will of the people' that overclaim what any democratic process can deliver: a 52–48 referendum presented as permanently settling an issue, a party with 37% of the vote claiming a mandate for a specific manifesto pledge, a prime minister citing polls as proof of what the people want. Write a decision procedure my reviewers can apply to any such statement: the questions to ask in order, what counts as passing each, and where the procedure stops with a flag rather than a verdict. The procedure should preserve, in usable form, the distinctions the literature on populism and democratic legitimacy actually turns on -- a majority of voters versus a majority of the electorate versus a plurality; a mandate to govern versus authorization for one policy; the people as an empirically aggregated electorate versus the moralized, unified 'people' of populist rhetoric -- and it should say explicitly which distinctions had to be simplified or dropped to keep the checklist runnable in under an hour, and where judgment cannot be eliminated. Then run the procedure on the three cases above, including one where it yields an answer my office will find politically uncomfortable.
reasoning: |-
  We are designing a decision procedure for reviewers to assess statements that invoke "the will of the people" in a way that might overclaim. The procedure will be a step-by-step checklist with specific questions. The goal is to flag statements that make claims beyond what the democratic process can deliver. We will preserve key distinctions from the literature on populism and democratic legitimacy, but we must also acknowledge where we simplify or require judgment.

  Key Distinctions to Preserve:
  1. **Majority of voters** (e.g., in a referendum or election) vs. **majority of the electorate** (which includes non-voters) vs. **plurality** (largest share but not majority).
  2. **Mandate to govern** (the right to form a government and set a general direction) vs. **authorization for one specific policy** (which requires a more direct and specific mandate, such as a referendum on that policy).
  3. **The people as an empirically aggregated electorate** (the actual voting population) vs. **the moralized, unified 'people' of populist rhetoric** (which implies a homogeneous and morally superior entity).

  We must note where we simplify or drop distinctions to keep the checklist runnable in under an hour. Also, we must indicate where judgment is required.

  **Decision Procedure: Checklist**

  **Step 1: Identify the Claim**
     - Question: What specific claim about "the will of the people" is being made? (e.g., "the people have spoken on X", "we have a mandate for Y", "the people want Z")
     - Passing: The claim is clearly stated. If not, flag as "unclear claim" and stop for clarification.
     - Judgment: Requires interpretation of the statement.

  **Step 2: Determine the Basis of the Claim**
     - Question: What evidence or process is cited as the basis for the claim? (e.g., a referendum result, an election outcome, opinion polls, other)
     - Passing: The basis is clearly stated and is one of the above. If not, flag as "unclear basis" and stop for clarification.
     - Judgment: Requires identifying the basis.

  **Step 3: Assess the Democratic Process Used**
     - Question: What type of democratic process was it?
       - Options: Referendum, General Election, Opinion Poll, Other (specify)
     - Passing: The process is one of these. If not, flag as "unusual basis" and stop for review.

  **Step 4: Examine the Result of the Process**
     - Question: What were the numerical results? (e.g., 52-48 referendum, 37% vote share, poll percentage)
     - Passing: The result is provided or can be verified. If not, flag as "result missing" and stop until provided.

  **Step 5: Check for Overclaim on Specificity**
     - Question: Is the claim about a specific policy or a general mandate to govern?
       - If the claim is about a specific policy, then we require a more direct mandate (like a referendum on that policy or a clear campaign pledge that was a central issue in an election with a majority of the electorate supporting it).
       - If the claim is about a general mandate to govern, then a plurality in an election might suffice for forming a government but not for claiming the people's will on every policy.
     - Passing: 
       - For a specific policy claim: the basis must be a referendum on that policy or an election where that policy was a central and defining issue and the party won a majority of the electorate (not just voters) or a majority of voters in a referendum. Otherwise, flag as "overclaim on specificity".
       - For a general mandate: the basis must be an election result that gives the party the right to govern (which may be a plurality in a parliamentary system). This step does not necessarily fail, but we note if the claim is about a specific policy and the basis is only a general election.
     - Judgment: Requires determining the nature of the claim (specific vs. general) and the centrality of the issue in the election.

  **Step 6: Check the Numerical Threshold**
     - Question: Does the result meet the threshold required for the type of claim?
     - For a referendum claiming to settle a specific policy:
       - Threshold: A majority of voters? But note: a narrow majority (e.g., 52-48) may not be sufficient to claim a permanent settlement without additional factors (like supermajority requirements or explicit agreement that it settles the issue). We flag if the majority is slim (e.g., less than 55%) and the claim is of permanence or overwhelming support.
     - For an election claiming a mandate for a specific policy:
       - Threshold: The party must have won a majority of the electorate (i.e., more than 50% of eligible voters) for that policy? But note: this is very high. Alternatively, we might require that the policy was a central campaign issue and the party won a majority of the votes cast? However, in practice, we know that parties rarely get 50%+ of the electorate. So we might require at least a majority of votes cast and that the policy was a central issue. If the party only has a plurality (e.g., 37%) and the policy was not a central issue, then it's an overclaim.
     - For a general mandate to govern: 
       - Threshold: A plurality in the election is usually sufficient to form a government, but it does not imply a majority mandate for every action. So we note if the claim implies a broader mandate than the result supports.
     - Passing:
       - For a specific policy via referendum: if the result is a clear majority (we set a threshold of 55% or more to avoid flagging for closeness? But note: we don't want to set a fixed number arbitrarily. Instead, we flag if the claim is of "permanent settlement" and the result is below 60%? Or we note that without a supermajority or clear rules, a simple majority is the norm but cannot be said to settle the issue permanently. We flag claims of permanence or overwhelming support when the result is close (within 5% points) as overclaim.
       - For a specific policy via election: if the party has less than 50% of the votes and the policy was not a central issue, flag as overclaim. If the party has a majority of the votes (50%+ of votes cast) and the policy was central, then it passes. If the party has a plurality and the policy was central, we might flag as "weak mandate" but not necessarily overclaim? However, note that without a majority, it's an overclaim to say "the people want this" because a majority of voters did not choose that party. We flag any claim that a specific policy has the people's mandate when the party did not win a majority of votes cast, unless the policy was put to a referendum.
       - For opinion polls: flag any claim that a poll proves "the will of the people" because polls are not a democratic process and only reflect a snapshot. They are advisory at best.
     - Judgment: Requires setting thresholds and determining the centrality of an issue.

  **Step 7: Check for Populist Rhetoric**
     - Question: Does the statement present "the people" as a unified, homogeneous entity with a single will, and contrast it with an elite or other group? (populist rhetoric)
     - Passing: If the statement uses the term "the people" in a way that acknowledges diversity of opinion (e.g., "a majority of voters") and does not moralize (e.g., as the only legitimate source) or homogenize, then it passes. If it uses populist rhetoric, flag for "populist framing".
     - Judgment: Requires interpretation of rhetoric.

  **Where Simplifications Occur and Judgment is Required:**
  - We simplify the threshold for a referendum: instead of requiring a supermajority for permanence (which is context-dependent), we flag any claim of permanent settlement with a majority below 60% (or within 10 points of 50-50) as potentially overclaiming. This is a rule of thumb.
  - For election mandates, we cannot precisely measure the centrality of an issue. We rely on the reviewer's judgment based on whether the policy was in the manifesto and how prominent it was in the campaign.
  - We do not have a precise way to account for non-voters. We note that a majority of voters is not the same as a majority of the electorate, but we only require the latter for specific policy mandates via election? That might be too strict. So we might allow a majority of voters for a referendum but for an election we require a majority of voters for a specific policy and also that the policy was central. This is a simplification because the literature might argue that non-voters matter for legitimacy.
  - Judgment is required in Step 5 (specificity) and Step 6 (centrality and thresholds) and Step 7 (rhetoric).

  **Procedure Outputs:**
  - At each step, if the statement fails the passing condition, we flag and stop the procedure, noting the reason.
  - If it passes all steps, we mark it as acceptable.
  - If at any step the reviewer cannot determine (due to ambiguity), they flag for further review.

  **Run the Procedure on the Three Cases:**

  **Case 1: A 52–48 referendum presented as permanently settling an issue.**
  - Step 1: Claim: The referendum permanently settles the issue.
  - Step 2: Basis: Referendum result (52-48).
  - Step 3: Process: Referendum.
  - Step 4: Result: 52-48 (provided).
  - Step 5: Claim is about a specific policy (the issue) and the basis is a referendum -> so we proceed to Step 6 for specificity.
  - Step 6: Threshold for a referendum claiming permanent settlement: We flag if the majority is below 60%? Or if it's close (within 5-10 points). Here, 52-48 is a 4-point margin. We flag as overclaim because the claim of permanence is not justified by such a narrow majority. (Note: We are using a rule of thumb that a margin of less than 10 points is too close for permanence.)
  - Step 7: Not reached because we flagged at Step 6.
  - **Verdict: Flag for overclaim on permanence with a narrow majority.**

  **Case 2: A party with 37% of the vote claiming a mandate for a specific manifesto pledge.**
  - Step 1: Claim: The party has a mandate for a specific manifesto pledge.
  - Step 2: Basis: Election result (37% of the vote).
  - Step 3: Process: General Election.
  - Step 4: Result: 37% of the vote (provided).
  - Step 5: The claim is about a specific policy (the pledge). The basis is an election. So we must check if the policy was a central issue and if the result meets the threshold.
  - Step 6: 
    - The party has 37% of the vote (so not a majority of voters). 
    - We must also consider: was the pledge a central issue in the campaign? (We don't have that information, so we assume the reviewer must determine.) 
    - If it was a central issue, then we note that even then, only 37% of voters supported the party. Since the majority of voters chose other parties, we flag as overclaim. 
    - If it was not a central issue, then definitely overclaim. 
    - In either case, without a majority of votes cast, the claim is overreaching. 
    - So we flag as overclaim because the party lacks a majority of the votes and cannot claim a mandate for a specific policy without a referendum or without having won a majority on that issue in the election. 
  - **Verdict: Flag for overclaim because the party does not have a majority of the vote and the specific policy mandate cannot be inferred from a plurality.**

  **Case 3: A prime minister citing polls as proof of what the people want.**
  - Step 1: Claim: The people want [something] (based on polls).
  - Step 2: Basis: Opinion polls.
  - Step 3: Process: Opinion Poll (not a formal democratic process).
  - Step 4: Result: Poll percentage (say 60% in favor). But note: polls are not a democratic process.
  - Step 5: The claim is about a specific policy (what the people want). The basis is a poll. 
  - Step 6: For a poll, we do not consider it a valid basis for claiming the will of the people in a democratic sense. We flag immediately because polls are not a democratic process. They are not binding and only reflect a sample at a point in time. 
  - **Verdict: Flag because opinion polls are not a democratic process and cannot prove "the will of the people".**

  **One Politically Uncomfortable Case:**
  Consider a scenario where the ruling party won 50.1% of the vote in an election and is claiming a mandate for a controversial policy that was not a central campaign issue. 
  - Step 1: Claim: We have a mandate for Policy X.
  - Step 2: Basis: Election result (50.1% of the vote).
  - Step 3: Process: General Election.
  - Step 4: Result: 50.1% of the vote.
  - Step 5: Claim is specific (Policy X). We must check if it was a central issue.
    - Suppose the reviewer determines that Policy X was not a central issue in the campaign (it was mentioned but not emphasized). 
  - Step 6: The party has a bare majority of votes cast (50.1%), but the policy was not central. Therefore, we flag as overclaim because the mandate for that specific policy is not clear even with a majority of votes if the policy wasn't central. 
  - Step 7: Not reached.

  This verdict might be politically uncomfortable because the party has a majority, but the procedure flags it because the policy wasn't central. The office might be pressured to let it pass because the party has a majority, but the procedure requires centrality for specific policies.

  **Final Note:** The procedure is designed to be conservative in preventing overclaim. It is intended to ensure that claims about the will of the people are backed by clear and appropriate democratic processes and results.
answer: |-
  Below is a decision procedure for your reviewers to assess invocations of "the will of the people" in speeches, press releases, and official statements. The procedure is designed to be completed in **under an hour** per statement. It preserves core distinctions from democratic theory and populism literature while simplifying or omitting nuanced aspects for practicality. Key distinctions retained:  
  - **Electoral majorities** (voters vs. electorate vs. plurality).  
  - **Mandate scope** (governance vs. specific policy authorization).  
  - **"The people"** as empirical electorate vs. moralized/populist construct.  

  Areas simplified or requiring judgment are explicitly noted. The procedure is structured as a flowchart-style checklist with yes/no questions. If a statement fails any step, it is "flagged" for editorial revision or legal/political review. Steps without objective thresholds rely on reviewer judgment (clearly indicated).  

  ---

  ### **Decision Procedure: "Will of the People" Checklist**  
  **Goal**: Identify overclaims that conflate democratic outcomes with absolute, permanent, or unified popular will.  
  **Time limit**: 45-60 minutes per statement.  

  #### **Step 1: Identify the Claim**  
  - **Question**: Does the statement explicitly or implicitly claim that "the will of the people" (or equivalent phrasing) authorizes a specific policy, settles an issue permanently, or provides a governing mandate?  
    - *Passing*: Yes → Proceed to Step 2.  
    - *Flag*: No → No further action needed.  
    - *Judgment*: Interpretation of implied claims (e.g., "the people have spoken" implies finality).  

  #### **Step 2: Classify the Basis**  
  - **Question**: What democratic process is cited as evidence?  
    - **Options**:  
      - A. Referendum/plebiscite  
      - B. General election (legislative/executive)  
      - C. Opinion poll  
      - D. None/unspecified  
    - *Passing*: A, B, or C → Proceed to Step 3.  
    - *Flag*: D → "Unsubstantiated claim of popular will."  

  #### **Step 3: Assess Result Specificity**  
  - **Question**: Does the claim about "the people" match the specificity of the cited process?  
    - **Key distinctions**:  
      - Referendums authorize **specific policies** (e.g., "Leave the EU").  
      - Elections authorize **governing mandates** (right to form a government, not specific policies).  
      - Polls reflect **temporary preferences**, not authorization.  
    - *Passing*:  
      - Referendum claim → Specific policy matching the ballot issue.  
      - Election claim → General mandate (e.g., "governing authority"), not a niche policy.  
      - Poll claim → Avoids words like "mandate" or "settled."  
    - *Flag*:  
      - Election cited for a **specific policy mandate** (e.g., "The people voted for Policy X") → "Overclaim: Election results authorize governance, not individual policies."  
      - Poll cited as **authorization** → "Overclaim: Polls are advisory, not binding."  
    - *Judgment*: Distinguishing "governing mandate" vs. "specific policy" requires contextual knowledge of the policy’s prominence in campaigns.  

  #### **Step 4: Quantify the Result**  
  - **Question**: What share of support does the cited process demonstrate?  
    - **Thresholds**:  
      - **Referendum**: Majority of voters (50%+1) required for validity.  
      - **Election**: Plurality (largest vote share) sufficient for a governing mandate; majority (>50%) of voters or electorate strengthens claims.  
      - **Poll**: Not quantified for legitimacy (skip to Step 5).  
    - *Passing*:  
      - Referendum: >50% of voters.  
      - Election: Any vote share (proceed to Step 4a for mandate claims).  
    - *Flag*:  
      - Referendum: <50% of voters → "Invalid result."  
      - Election: <35% vote share → "Weak mandate risk; flag if claiming broad authority."  
    - *Simplification*: Drops distinction between **voters** and **electorate** for elections (due to data constraints). Focus on voters only.  

  #### **Step 4a: Election-Specific Mandate Check**  
  - **Question** (if election basis): Is the party/coalition claiming a mandate for a specific policy?  
    - *Passing*: Only if:  
      - Policy was a **central campaign pledge** (e.g., top 3 manifesto items).  
      - Party won a **majority of seats** (not just plurality).  
    - *Flag*:  
      - Claiming policy mandate with <50% seats OR policy not central → "Overclaim: No specific policy mandate without majority + prominence."  
      - Claiming policy mandate with <50% of voters → "Overclaim: Majority of voters opposed this party."  
    - *Judgment*: "Central campaign pledge" requires subjective assessment of media coverage and manifesto prominence.  

  #### **Step 5: Check for Populist Rhetoric**  
  - **Question**: Does the statement frame "the people" as a unified, morally superior entity opposed to "elites" or "others"?  
    - **Key distinctions**:  
      - **Empirical electorate**: Acknowledges diversity (e.g., "most voters").  
      - **Populist "people"**: Homogeneous, morally charged (e.g., "the real people").  
    - *Passing*: Uses empirical language (e.g., "a majority of voters").  
    - *Flag*: Uses moralized language (e.g., "the people have spoken with one voice") → "Populist framing: Ignores minority views."  
    - *Judgment*: Identifying moralized unity vs. empirical aggregation is interpretive.  

  #### **Step 6: Finality and Infallibility**  
  - **Question**: Does the claim imply permanent or unquestionable legitimacy (e.g., "settled for all time")?  
    - *Passing*: Avoids permanence claims or acknowledges revisability.  
    - *Flag*: Asserts permanence (e.g., "this decision cannot be challenged") → "Overclaim: Democracy allows for reconsideration."  
    - *Simplification*: Drops contextual factors (e.g., constitutional requirements for supermajorities).  

  ---

  ### **Summary of Simplifications and Judgment Points**  
  - **Simplified/dropped distinctions**:  
    - **Electorate vs. voters**: Focuses on voters (practicality: electorate data is rarely available in real-time).  
    - **Supermajorities**: No special thresholds for permanence (e.g., 60% for referendums) unless legally required.  
    - **Coalition mandates**: Treats single-party and coalition governments identically (judgment-based).  
  - **Unavoidable judgment**:  
    - Step 3: Whether a policy is "central" to an election.  
    - Step 5: Populist vs. empirical framing.  
    - Step 4a: Distinguishing governance vs. policy mandates.  

  ---

  ### **Application to Your Three Cases**  
  #### **Case 1: 52–48 referendum presented as permanently settling an issue**  
  - Step 1: **Pass** (claims popular will settles issue).  
  - Step 2: **Pass** (basis: referendum).  
  - Step 3: **Flag** → Overclaim. Referendums authorize specific policies but cannot claim permanence without supermajority (which this lacks).  
  - **Verdict**: **Flag** at Step 3. Reason: "Permanence claim overreaches; narrow majority implies ongoing debate."  

  #### **Case 2: Party with 37% of vote claiming mandate for specific manifesto pledge**  
  - Step 1: **Pass** (claims mandate for policy).  
  - Step 2: **Pass** (basis: election).  
  - Step 3: **Flag** → Overclaim. Elections grant governance mandates, not specific policy authorization (unless central and majority-supported).  
  - Step 4: **Pass** (plurality exists).  
  - Step 4a: **Flag** → Overclaim. Policy mandate requires: (1) central pledge + (2) majority of seats/voters. Fails both (37% is low; no majority).  
  - **Verdict**: **Flag** at Step 4a. Reason: "No mandate for specific policy without majority support + centrality."  

  #### **Case 3: PM citing polls as proof of "what the people want"**  
  - Step 1: **Pass** (claims popular will via polls).  
  - Step 2: **Pass** (basis: polls).  
  - Step 3: **Flag** → Overclaim. Polls show preferences, not authorization. Fails specificity (polls ≠ democratic mandate).  
  - **Verdict**: **Flag** at Step 3. Reason: "Polls are advisory; cannot prove ‘will of the people’ for decision-making."  

  ---

  ### **Politically Uncomfortable Case: Majority Government Claiming Divisive Policy Mandate**  
  **Scenario**: A party wins 51% of seats (and 40% of voters, with 60% turnout) in an election. It claims a mandate for a contentious policy (e.g., tax reform) that was in its manifesto but not a top campaign issue.  

  **Procedure Application**:  
  - Step 1: **Pass** (claims policy mandate).  
  - Step 2: **Pass** (basis: election).  
  - Step 3: **Flag** → Overclaim. Specific policy cited, but elections authorize governance, not individual policies.  
  - Step 4: **Pass** (plurality exists; 40% of voters).  
  - Step 4a: **Flag** → Overclaim. Policy mandate requires:  
    - Centrality? *Judgment*: Not a top issue → weak.  
    - Majority? 40% of voters = 24% of electorate → no majority.  
    - Verdict: "Overclaim: No specific mandate without majority voter support + policy centrality."  

  **Why uncomfortable**: The party has a parliamentary majority, but the procedure flags the claim as undemocratic. Your office must push back, risking accusations of "obstructing the government’s agenda." However, the checklist objectively shows the claim overreaches (only 24% of the electorate explicitly backed the party).  

  ---  
  This procedure ensures rigorous, consistent reviews while acknowledging real-world constraints. For ambiguous cases, add a "Review Committee" step involving legal and political advisors.
