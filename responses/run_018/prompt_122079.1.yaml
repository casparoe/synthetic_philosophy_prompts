prompt: |-
  I'm a second-year PhD student in an experimental particle physics group, and I've been auditing a foundations reading group where we keep circling around the many-worlds interpretation. I'm not confused about the reading; I'm confused about my own day job. Here is the practice I mean. My experiment sorts events into two channels; the theory assigns Born-rule weights to them; we accumulate a very large number of trials, plot the relative frequencies, and compare the shape of the resulting distribution with the prediction, treating any single event as carrying essentially no evidential weight in either direction. When the observed frequency sits far from the prediction — at the five-sigma level that the collaboration treats as its threshold for announcing a discovery — we treat the deviation as evidence that something is wrong, and we adjudicate it by writing down a short menu of candidate explanations: an ordinary statistical fluctuation, a mis-modelled efficiency or unsimulated background, an unlucky choice of selection cuts, new physics. Independent replication by a second collaboration is treated as the strongest single guard against the fluke hypotheses, and blinding the analysis until the procedure is fixed is treated as a guard against fooling ourselves. What never appears on that menu, and what I have never once heard anyone in my group offer even as a joke, is this: nothing is wrong at all, the statistics simply came out deviant on the branch of the universal wavefunction that we happen to occupy.

  That omission is what I want understood. On the many-worlds picture as it gets presented to us — every outcome with nonzero amplitude is realized, nothing is selected out, the branches are all real in the same sense — a deviant branch is not merely possible; for any run long enough that a five-sigma deviation is even representable, some branch exhibits one. And if branches or observer-moments were counted rather than weighted by squared amplitude, the deviant ones would not be the rare ones at all: where the Born rule says 1 percent, naive counting says something closer to even, and most branches would then look wildly anomalous by Born-rule lights. So the practice seems to presuppose something that the spare, no-collapse part of the interpretation does not hand you: a rule saying that you should expect to find yourself where the Born measure is thickest, or at least that you should act as if you will. One friend in the reading group says this shows the interpretation is smuggling in an extra posit about degrees of reality or self-locating credence, and is therefore more expensive than its "nothing added to the formalism" advertisement suggests; my supervisor says no, the practice needs no such posit, because an agent who knows in advance that she will branch can be shown to bet as if the Born rule holds, and the laboratory's conventions are disciplined betting policies rather than claims about where in the branching structure we are located. I can follow both arguments but cannot tell what the practice actually commits us to, or whether the two stories diverge anywhere I could notice from inside a lab.

  So I'd like the implicit theory reconstructed. What view of probability, of self-location, or of evidence must someone hold for this practice — the frequency-over-many-trials confirmation, the five-sigma threshold, the standard menu of explanations, the weight given to independent replication — to be the rational thing to do, and which rival views does the practice quietly rule out by never listing the deviant-branch hypothesis? Please distinguish what the practice strictly presupposes from what it merely fits comfortably: in particular, does it require a genuine self-locating credence distributed by the Born measure, or only a decision-theoretic or betting norm, and is there any reading of the practice that an equal-weight or branch-counting version of the interpretation could keep? Is the practice underdetermined in the sense that a collapse theory or a hidden-variable theory would license exactly the same laboratory behaviour, and if so does that undercut my friend's argument, or only relocate it? Then tell me what would have to change in the lab if the presupposed view were replaced: would "we occupy a low-measure branch" become an admissible item on the anomaly menu, and if not why not; would replication by a second collaboration still do the work we think it does; would the practice need the total number of branches to be finite, or the decomposition into branches to be well defined, in order to be coherent at all? I'd also like to know which single feature of the situation is doing the philosophical work, and where your reconstruction is softest. Please don't settle which interpretation of quantum mechanics is true, and please don't route the answer through quantum suicide or immortality setups — we already have one of those people in the group. No citations or reading lists; I want the argument, not the literature.
reasoning: |-
  Okay, let me start by unpacking this PhD student's dilemma. They're in experimental particle physics, working with real data, sorting events into channels, comparing frequencies to Born rule predictions. The standard practice involves large trials, five-sigma thresholds, and a fixed menu of explanations for deviations. The key point is that "we're in a deviant branch" never appears as an explanation, even in jest. 

  The student is deep into the many-worlds interpretation (MWI) discussions and notices a conflict. MWI says all branches exist, so statistically deviant outcomes must occur in some branches. But in the lab, those branches aren't considered real possibilities to explain anomalies. Why?

  First, I need to identify the core tension. The lab practice relies on probabilistic expectations based on the Born rule, while MWI without additional assumptions seems to imply that all outcomes are equally real. The student’s friend argues MWI smuggles in extra assumptions, while their supervisor thinks decision theory justifies the practice without ontological commitments.

  Hmm, the student wants to know what view of probability, self-location, or evidence underlies their lab work. They also ask if the practice requires Born-based self-locating credences or just decision-theoretic norms. And whether branch-counting could ever fit with their methods.

  I should break this down. The lab's anomaly menu excludes "deviant branch" because it's not actionable. If you're in that branch, you can't test it or fix it—it's just where you are. The other options (statistical fluke, mis-modeling, new physics) are testable. So the practice might be pragmatic, not ontological.

  But deeper: the five-sigma threshold and replication make sense only if you expect Born-rule frequencies. In MWI, if you treat all branches equally, most branches *would* see deviations, making sigma thresholds meaningless. So the practice seems to assume Born weights matter for anticipation, even if all branches exist.

  The supervisor's decision-theory angle: even if branching happens, you should bet as if Born probabilities apply. But does this hold up? In betting, you care about future experiences across branches. If you weight by Born measure, you'd avoid bets where most branches lose, even if "you" exist in all. So the lab's conventions align with this—they're like placing bets on theories.

  But if someone adopted branch-counting, they'd expect deviations often, so five-sigma wouldn't be special. Replication by another collaboration? In MWI, if they're in a similar branch, it might not help. Independent replication works because it tests if the deviation correlates with experimental setups—something branch-deviation can't explain.

  Would a collapse theory change anything? Probably not—same Born rule, same statistics. So the practice is underdetermined by interpretation, which might undercut the friend's point about MWI's extra cost. But MWI still needs to explain why Born weights aren't arbitrary.

  The student also asks what would change if they assumed branch-counting. Anomaly menus would include "deviant branch" often, making science messy. Replication would lose its force. Finite branches? Not necessary—measure theory handles infinities. But without a preferred basis, defining "branches" gets fuzzy, though lab practices might not care.

  The philosophical heavy lifting is done by the link between anticipation and Born measure. The soft spot is whether this is a brute fact or derivable in MWI. The supervisor's decision-theory move avoids deeper ontology, but some argue it's circular.

  In summary: the lab practice requires expecting Born-rule frequencies, which MWI can accommodate via decision theory or self-locating uncertainty. Branch-counting would break standard stats methods. The core is testability and pragmatic action, not metaphysics.
answer: |-
  Your lab practice—relying on frequency confirmation, sigma thresholds, anomaly menus, and replication—rests on a specific **operational theory of evidence and decision-making**, not on ontological claims about quantum reality. Here's how it decomposes, what it presupposes, and what it rules out:

  ### Core Presuppositions of the Practice
  1. **Probability as Anticipation, Not Ontology**:  
     The practice treats probability as governing *what you should expect to observe*, not as a statement about what exists. The Born rule is used to anticipate frequencies in *your* future experimental results. A five-sigma deviation isn't considered "impossible" in an absolute sense but is treated as *practically disqualifying* for guiding belief or action because it defies rational anticipation.  

  2. **Testability Over Metaphysics**:  
     Explanations are admitted to the anomaly menu only if they are **empirically testable or correctable**. "We are in a low-weight branch" is excluded because:  
     - It offers no differential predictions: you can't design an experiment to detect "branch location."  
     - It implies no corrective action: you can't recalibrate detectors or adjust cuts to "fix" your branch.  
     - It renders replication meaningless: if Branch A has a deviation, and "independent" Collaboration B is in Branch A, they replicate it; if in Branch B, they don't. This correlation is untestable and defeats replication's purpose.  

  3. **Decision-Theoretic Norms, Not Self-Location**:  
     The practice strictly requires **only a betting norm**, not a credence about "which branch I am in." Your supervisor is correct: agents who know they will branch should wager *as if* the Born rule holds.  
     - **Why?** In a branching event, "you" become multiple successors. If you weight outcomes by Born measure when betting (e.g., "I accept bets where Born-expected gain is positive"), you maximize expected utility across all future selves.  
     - **Lab as a betting arena**: Choosing cuts, announcing discoveries, or rejecting models are actions with consequences (career impact, resource allocation). The five-sigma threshold enforces a policy: "Act only if the Born-odds against a fluke are >3.5 million to 1." No self-locating uncertainty is needed—just a rule to avoid costly errors.  

  ### What the Practice Rules Out
  - **Branch-Counting MWI (Naive "Equal Weight")**:  
    If branches were counted equally, a "typical" branch would show large deviations. The five-sigma threshold (p ≈ 2.87e-7) would be irrational—deviations should be *expected* in most runs. Replication would not guard against flukes (most "independent" groups would also be in deviant branches). The practice is incompatible with this view.  
  - **Any Theory Denying Born-Rule Anticipation**:  
    Theories that reject the Born rule as predictive (e.g., some hidden-variable models without quantum equilibrium) or treat probability as purely epistemic (without a dynamical basis) would conflict. Your practice assumes Born frequencies *will* manifest in persistent records over many trials.  

  ### What It Does Not Rule Out (Underdetermination)
  - **Collapse Theories (Copenhagen, GRW)**: Identical lab behavior. They explicitly enforce single outcomes with Born probabilities, so your practice follows directly.  
  - **Hidden-Variable Theories (Bohmian)**: Same Born statistics for observable frequencies. Lab protocols are unchanged.  
  - **MWI with Born Measure as "Caring Measure"**: If you care about future selves proportional to branch amplitude (via decision theory), the practice holds. No commitment to "degrees of reality" is needed—only a rule for action.  

  ### If Presuppositions Changed: Impact on Lab Practice
  - **If "deviant branch" were added to the menu**:  
    Anomaly resolution would collapse. Every deviation could be "explained" untestably. Replication would become incoherent (as above). Science would revert to solipsism.  
  - **If branch-counting replaced Born measure**:  
    You would:  
    - Lower sigma thresholds drastically (since deviations are "normal").  
    - Treat replication as unreliable (groups likely share deviant branches).  
    - Abandon frequency confirmation (since "typical" frequencies don't match Born predictions).  
  - **Finite Branches/Well-Defined Decomposition**:  
    Not required. The practice works with:  
    - **Infinite branches**: Born measure concentrates expectation on "non-deviant" histories.  
    - **Fuzzy Decomposition**: You only need the Born rule for observable outcomes (e.g., detector clicks), not a fundamental branching ontology.  

  ### Philosophical Heavy Lifting and Soft Spots
  - **Key Feature**: **Testability**. The practice excludes untestable hypotheses by design. This shields science from metaphysical paralysis.  
  - **Softest Point**: **Why Born weights?**  
    - In MWI, justifying *why* we use Born measure for betting (vs. branch-counting) is unresolved. Your supervisor's decision-theoretic argument assumes you *should* weight by amplitude—but this relies on auxiliary assumptions (e.g., the "epistemic separability principle").  
    - However, the *practice* doesn't care: it inherits the Born rule from quantum formalism. The "softness" is in whether MWI can derive the rule without circularity, not in your lab's operations.  

  ### Summary: What Your Practice Commits To
  - **Minimal View**: A **decision-theoretic norm** that compels agents to act *as if* the Born rule governs anticipated frequencies. No self-locating uncertainty or "thick measure" metaphysics is required.  
  - **Quietly Rejected**: Any view where "typical" observers see anomalous results (e.g., branch-counting MWI) or where deviations can't be resolved empirically.  
  - **Underdetermination**: Your lab work is interpretation-agnostic. All mainstream quantum interpretations license the same practice. This undercuts your friend's claim that MWI is "more expensive"—it doesn't change the lab, so the "cost" is purely interpretive.  

  The rationality of your practice lies in its **pragmatic enforceability**: it compels testable explanations, leverages independent checks, and minimizes costly errors. Whether the universe has one branch or many, you're governed by the same bets.
