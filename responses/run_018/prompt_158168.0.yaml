answer: |-
  ### Philosophical Analysis: Anatta and Corporate Legal Identity

  **Brainstorming Preliminaries**  
  *Five Skandhas*:  
  1. **Rūpa (Form)**: Physical components (body, senses).  
  2. **Vedanā (Feeling)**: Affective tone of experience (pleasure, pain, neutrality).  
  3. **Saṃjñā (Perception)**: Cognitive labeling of objects.  
  4. **Saṃskāra (Mental Formations)**: Volitional constructs (karmic habits, intentions).  
  5. **Vijñāna (Consciousness)**: Awareness binding sensory input.  

  *Analytic Theories*:  
  - **Psychological Continuity**: Identity persists through interconnected mental states (e.g., memory chains).  
  - **Animalism**: Identity is tied to the biological organism's persistence.  
  - **Narrative Identity**: Identity emerges from a coherent self-narrative integrating past, present, and future.  

  *Legal-Corporate Concepts*:  
  1. **Charter**: Foundational purpose/rules defining the entity.  
  2. **Succession of Officers**: Replacement of role-holders preserving function.  
  3. **Continuity of Obligation**: Uninterrupted liability/rights despite internal flux.  
  4. **Dissolution**: Formal termination of legal existence.  

  ---

  ### Part 1: Buddhist Anatta in Legal-Corporate Vocabulary  
  **Core Translation**:  
  - **Anatta as Corporate Legal Personality**: A "person" is an incorporated entity lacking inherent substance, reducible to interdependent aggregates (*skandhas*) sustained by pratītyasamutpāda (dependent origination). Its continuity relies on contractual obligations and structural coherence, not a metaphysical core.  

  **Skandha Mappings**:  
  - **Rūpa (Form)** → **Physical Assets/Infrastructure**: Tangible resources (property, equipment) enabling operation.  
  - **Vedanā (Feeling)** → **Fiduciary Reactions**: Corporate responses to gains/losses (e.g., profit-driven "pleasure," debt-induced "pain").  
  - **Saṃjñā (Perception)** → **Brand Identity/Public Recognition**: Trademarks, logos, and reputational markers distinguishing the entity.  
  - **Saṃskāra (Mental Formations)** → **Corporate Bylaws/Procedures**: Codified policies directing actions (e.g., ethical guidelines as "karmic habits").  
  - **Vijñāna (Consciousness)** → **Governance Structure**: Board/executive roles processing information and issuing directives.  

  **Key Doctrines**:  
  - **No Permanent Substrate**: Like a corporation’s lack of substance beyond its charter, persons lack an *ātman*; identity is a legal fiction.  
  - **Pratītyasamutpāda**: Continuity depends on ceaseless "contractual" dependencies (e.g., supply chains, stakeholder obligations) mirroring conditioned arising.  
  - **Dissolution**: "Death" occurs when obligations lapse or the charter is voided (e.g., bankruptcy).  

  ---

  ### Part 2: Analytic Theories in Legal-Corporate Vocabulary  
  **Psychological-Continuity Theory**:  
  - **Translation**: Identity = "Records and Contracts Archive." Persistence relies on preserved documents (minutes, databases) linking past/future decisions via causal chains (e.g., legacy policies binding successors).  
  - **Straightforward**: Memory chains ≡ institutional records.  
  - **Distortion**: Corporate "memory" is externalized (documents vs. subjective recall).  
  - **No Expression**: Qualitative mental states (e.g., pain) lack analogues.  

  **Animalism**:  
  - **Translation**: Identity = "Real Estate Holdings." Persists iff core physical assets (e.g., headquarters) remain intact, regardless of staff turnover.  
  - **Straightforward**: Biological body ≡ fixed infrastructure.  
  - **Distortion**: Corporations relocate/replace assets yet retain identity; animalism’s vitalism (e.g., metabolism) has no counterpart.  
  - **No Expression**: Life processes irreducible to property.  

  **Narrative Identity**:  
  - **Translation**: Identity = "Annual Report Narrative." A curated story (PR, mission statements) weaving history/future goals into coherence.  
  - **Straightforward**: Self-narrative ≡ corporate branding.  
  - **Distortion**: Corporate narratives are multi-author constructs, not individual subjectivity.  
  - **No Expression**: Inner sense of self-authenticity.  

  ---

  ### Residue Report  
  **Anatta’s Translation Integrity**:  
  - **Intact**: Denial of substrate; obligation-based continuity; aggregate interdependence.  
  - **Distorted**: *Vedanā*’s phenomenology (raw feelings → abstract fiduciary reactions); *saṃskāra*’s karmic weight → neutral bylaws.  
  - **No Counterpart**: Soteriological aim (nibbāna); meditative insight into impermanence.  

  **Reverse Analysis**:  
  - **Corporate Framework Reveals**: Moral obligations persist *without* a "self" (e.g., a corporation honors debts despite total officer turnover). This mirrors Buddhism’s karmic responsibility sans ātman, exposing a blind spot in analytic debates fixated on *criteria* over *consequences*.  
  - **Corporate Framework Obscures**: Anatta’s existential depth (e.g., suffering from clinging) is reduced to contractual breaches.  
  - **Honest Verdict**: Buddhism and corporate law **converge on substrate-independent continuity** but **diverge in purpose**. Anatta targets liberation from suffering; corporate personhood facilitates transactional stability. They are not "talking past" but illuminating facets of convention-dependent identity.  

  **Philosophical Value**: The analogy concretizes how continuity and obligation function without metaphysics—bridging abstract debate (Parfit’s "identity doesn’t matter") and lived ethics. It forces analytic philosophy to confront institutional models of persistence, while challenging Buddhism to articulate its ethical stakes beyond negation.  

