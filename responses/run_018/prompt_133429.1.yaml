  The evolutionary parsimony argument feels weaker upon reflection - what seems "extravagant" might be biologically necessary for human cognition. And the circularity charge... that's tricky because it questions Fodor's explanatory foundation. I recall Fodor himself addressed similar concerns about systematicity being primitive. 

