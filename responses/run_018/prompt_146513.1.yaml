  First, I recall Szasz's core arguments: he rejected "mental illness" as literal medical pathology, viewed psychiatry as social control masked as medicine, and condemned involuntary treatment as a violation of autonomy. The user specifically mentions posthumous tech developments—AI that analyzes conversational data to assign suicide risk scores and trigger holds without human clinicians. Defenders call this objective and unbiased.

