  Key angles to cover: 
  - The AI's "objectivity" claim is false because risk algorithms embed subjective cultural/social norms about "appropriate" behavior. Szasz saw bias as inherent in psychiatric labeling, not solvable by tech. 
  - Automating holds escalates coercion by removing human judgment—exactly what he warned about with state power. Calling it "medical" makes it more insidious. 
  - He'd tie this to his broader critique: pathologizing life problems (like despair) as "disease" to justify control. The tech just streamlines this myth. 
  - Bonus point: He might note how corporations profit from this system, aligning with his anti-institutional stance. 

