answer: |-
  ## The Frege-Geach Stalemate: Diagnosis Beyond the Logic Wars

  You've nailed the core frustration: Despite decades of sophisticated maneuvering from quasi-realists like Blackburn and Gibbard, the Frege-Geach problem persists like a philosophical hydra. Cutting off one formal head (e.g., with expressivist truth-conditions or complex attitudes) just seems to sprout new objections framed in representationalist terms. Let's dissect the stalemate using the tools you requested and diagnose why progress feels frozen.

  **The Surface Battle: Logic, Compositionality, and the Fregean Constraint**

  1.  **The Fregean Core:** Geach's insight was devastatingly simple. If "Murder is wrong" (in an assertion) *only* expresses disapproval (say, 'Boo! murder!'), then embedding it unasserted ("If murder is wrong...") strips away its expressive function. What remains? A placeholder? But logic requires the *same meaning* to operate consistently across asserted and unasserted contexts (compositionality). The conditional seems to *talk about* wrongness, not *express* disapproval about it *right now*.
  2.  **Expressivist Counter-Moves:**
      *   **Blackburn's Projectivism & Consistency:** Moral statements express attitudes, but logic tracks *consistency* of those attitudes. Denying "If murder is wrong, then encouraging murder is wrong" reveals an inconsistency in one's conative commitments. The conditional expresses a higher-order attitude *about* the consistency of first-order attitudes.
      *   **Gibbard's Norm-Acceptance:** Moral judgments express acceptance of norms. Logic governs the *acceptability* of combinations of norms. The conditional expresses that accepting the norm against murder commits one to accepting the norm against encouraging murder.
      *   **Quasi-Realist Semantics:** Sophisticated expressivists (like Schroeder, building on Blackburn/Gibbard) develop formal semantic frameworks where normative sentences are assigned complex, non-representational semantic values (e.g., sets of hyperplans, pairs of attitudes) that *mimic* truth-conditions for logical purposes. They aim to "earn the right" to logical vocabulary.

  **Why the Stall? It's Not *Just* Logic or Compositionality**

  The formal efforts *are* impressive, often yielding systems where normative logic "works" internally. **The real deadlock lies deeper, in a fundamental clash of meta-semantic visions:**

  1.  **The Cognitive Status of Normative Language Without Representation:** This is the core fault line. Realists insist that genuine logical inference, genuine truth-aptness, and genuine cognitive content *require* mind-independent representational content (truth-conditions tracking facts). Expressivists deny normative language has this kind of representational content, yet want to preserve its *robustly cognitive* features: genuine disagreement, truth/falsity (even if minimalist), and logical validity.
      *   **The Realist Challenge:** "If your complex attitude/norm-acceptance semantics *looks* exactly like truth-conditional semantics in its logical output, and you *talk* about 'truth' and 'propositions' for normative sentences (quasi-realism), how is this meaningfully *different* from realism? Aren't you just a realist in disguise, smuggling representation through the back door? If it walks like a duck and quacks like a duck..." (The *Collapse Objection*).
      *   **The Expressivist Defense:** "No! The *metaphysical grounding* is fundamentally different. Realists ground meaning in representation of facts. We ground it entirely in conative psychological states and their consistency relations. The formal similarity is achieved *despite* the different foundations. Logic is about structure and consistency, not *only* about representation." (Blackburn's "quasi-realism" is precisely about *earning* realist-sounding discourse without the realist metaphysics).
      *   **The Impasse:** Realists remain unconvinced that consistency of attitudes *alone* constitutes genuine cognitive content sufficient for logic. Expressivists insist their grounding *is* sufficient, and the demand for representational grounding is question-begging. **This is less a debate about *how* compositionality works, and more about *what kind of thing* meaning fundamentally *is* for normative language.** Can non-representational states bear the weight of cognition?

  2.  **The Representationalist Default in the Metalanguage: Your Hidden Issue is Key!**
      *   **The Problem:** Philosophical discourse *about* meaning, logic, truth, and propositions is steeped in representationalist assumptions. Terms like "proposition," "truth-condition," "reference," "fact," "describes," "represents" are the lingua franca of semantics and logic. This forces expressivists into a defensive, reactive posture.
      *   **Expressivist Discomfort:** Expressivists constantly find themselves saying: "Well, it's *like* a proposition, but...", "We can define 'truth' *minimally* such that...", "Our semantics *mimics* truth-conditional semantics...". They are trying to translate their non-representational project *into* the representationalist metalanguage.
      *   **The Trap:** This translation effort makes their view vulnerable to the Collapse Objection ("If it looks like realism, why not just *be* realist?") and obscures the radical nature of their claim: that robust cognitive discourse *can* be grounded entirely in non-cognitive states. **The metalanguage constantly pulls the debate back onto realist turf, where the expressivist is always explaining why they *aren't quite* failing, rather than positively defining their alternative.** They struggle to establish a genuinely *alternative* meta-semantic framework that doesn't borrow representationalist tools and concepts wholesale.

  3.  **Is it Verbal? Partially, but Dangerously So.**
      *   **"Meaning" is Loaded:** Yes, fights over "meaning" often mask deeper commitments. Does "meaning" *essentially* involve representation? Realists say yes; expressivists say no (or not necessarily for normative terms).
      *   **Beyond Semantics:** The "meaning" dispute reflects the *real* clash: **What is the fundamental nature of normative thought and discourse?** Is it a mode of tracking objective properties (realism), or a mode of planning, commending, and regulating behavior (expressivism)? The semantic debates are downstream from this deeper metaphysical/psychological divide. Calling it "just verbal" undersells the profound disagreement about the essence of normativity itself.

  **Can Anything Break the Deadlock?**

  *   **New Formal Results?** Unlikely to be decisive. We already have sophisticated expressivist semantic systems that handle compositionality formally (e.g., Hybrid Expressivism, Biforcated Attitude Semantics). Realists dismiss them as elaborate mimicry lacking the right *metaphysical* grounding. More complex formal machinery won't resolve the foundational meta-semantic disagreement.
  *   **A New Conceptual Distinction?** Possibly, but elusive. Distinctions like "representational content" vs. "cognitive role" or "descriptive function" vs. "expressive function" are already in play. What's needed isn't necessarily a *new* distinction, but a compelling argument for why the expressivist's *type* of content (grounded in conative states + consistency) deserves the label "cognitive" and suffices for logic, *without* collapsing into realism. This requires shifting the meta-semantic paradigm.
  *   **The Best Hope:** A successful **rejection of the representationalist metalanguage default**. This means:
      1.  **Radical Meta-Semantic Clarity:** Expressivists need to articulate their positive account of meaning, truth, and propositions *without* leaning on representationalist terminology as a crutch. Can they define "proposition" purely in terms of commitment/planning roles and consistency relations?
      2.  **Reframing the Challenge:** Instead of asking "How can expressivism *account for* logic/propositions/truth?", ask "What *are* logic/propositions/truth *if* expressivism is true?" and argue that this alternative conception is coherent and adequate. Blackburn gestured at this, but a fully developed, alternative meta-semantic framework is needed.
      3.  **Exposing the Burden:** Force realists to defend why representational content is *necessary* for genuine logic or cognitive discourse, rather than just assuming it. Challenge the universality of the representationalist model.

  **Conclusion:**

  The Frege-Geach stalemate isn't ultimately stalled on logic or compositionality itself. Expressivists have made significant formal progress there. **The deadlock is meta-semantic and metaphysical.** It's about whether normative language can be genuinely truth-apt, cognitive, and logically structured *without* being fundamentally representational. The persistent use of a representationalist metalanguage constantly drags the debate back onto terrain favorable to realism, forcing expressivists into reactive mimicry rather than positive articulation of their alternative vision. Breaking the stalemate requires either expressivists to succeed in establishing a viable, non-representationalist meta-semantic framework that commands respect on its own terms, or realists to convincingly demonstrate why non-representational states *cannot* underwrite the full cognitive and logical features of normative discourse. Until then, the trenches remain dug, reflecting a profound disagreement about the very nature of meaning and normativity.
