  I'm putting together a long-form piece for my magazine on why some debates in philosophy of language just refuse to die, and I keep coming back to the Frege-Geach problem for expressivism. For context: expressivists say that a sentence like murder is wrong doesn't state a fact but expresses disapproval, yet they still want to explain why If murder is wrong, then encouraging murder is wrong feels logically valid. The standard objection — going back to Geach — is that in an unasserted context like the antecedent of a conditional, the moral sentence can't be expressing disapproval, so expressivists seem to need descriptive meaning after all. The replies are all familiar: quasi-realist moves, Blackburn's idea of expressive consistency, Gibbard's norm-acceptance framework. But talking to philosphers in the field, it feels like the argument hasn't moved in decades. Everyone just digs into their camp.

  So here's what I'm trying to figure out for my readers: is this stall actually about logic and compositionality, or is it a deeper disagreement about whether normative language can be genuinely cognitive without being representational? Or maybe it's verbal — we're fighting over the word meaning without noticing? I've been wondering if the hidden issue is that both sides are still working with a representationalist default in their metalanguage, which forces expressivists onto defensive turf they should reject. I want a real diagnosis, not a survey of positions. Use what each side actually says — the Fregean compositionality constraint, the expressivist denial of descriptive embeding, the quasi-realist workaround — and tell me whether anything like a new formal result or a conceptual distinction could actually break the deadlock. Please write your answer in American English; my copy editor hates British spelling and I don't want to recieve another angry email about it.
