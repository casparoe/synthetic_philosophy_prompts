prompt: |-
  A friend of mine reckons he's dissolved supererogation entirely, and I hate his argument but can't find the break in it. It goes: (1) If one of the acts open to you is morally better than every other available act, you ought to do it — that's just what "ought" picks out, the top option on the menu. (2) A supererogatory act is meant to be one that's morally better than anything duty demands while still not being demanded: the passerby who runs into the burning building does something better than staying back, yet staying back isn't wrong. (3) But by (1), the passerby ought to run in. (4) So "supererogatory" acts are really just obligatory acts we're too squeamish to demand of each other, and supererogation doesn't exist. (5) And notice (1) doesn't care that the example was heroic: apply it to any choice whatsoever and only the best available act is ever permissible. (6) So there's no moral latitude at all — me watching telly tonight instead of volunteering isn't a permissible-but-suboptimal choice, it's just wrong, full stop. I refuse to swallow (6), and I'd really like to keep the idea that saints and heroes go beyond duty rather than merely doing their jobs, but each premise looks perfectly tame on its own. Which step should I reject, why did it look so harmless, and what do I pay for rejecting it compared with the alternatives?

  Answer in British English, in three sections in this order: "The diagnosis" (the step to reject and why it looked fine, roughly 150 words), "The price list" (what each way of blocking the argument costs, roughly 200 words), and "Your verdict" (which price you'd actually pay, roughly 50 words).
reasoning: |-
  Hmm, the user's friend has presented an argument that dissolves supererogation entirely. The argument concludes that there's no moral latitude at all - even minor choices like watching TV instead of volunteering are morally wrong. The user hates this conclusion but can't find the flaw.

  Let me break down the friend's argument step by step. Premise (1) claims that "ought" always picks the morally best available act. Premise (2) defines supererogation as morally better than duty but not demanded. Then (3) applies (1) to conclude the supererogatory act is actually obligatory. Step (4) claims supererogation doesn't exist, and (5) extends this to all choices, leading to (6) - no permissible suboptimal choices exist.

  The problem clearly lies in premise (1). It looks harmless because "ought" does often correspond to the best option in simple cases - like choosing between saving a child or a sandwich. But this simplistic view ignores how moral language actually functions. We have multiple normative categories: obligatory (what you must do), permissible (what's acceptable), and supererogatory (what's exceptionally good but not required). Premise (1) collapses all these into one category, which is why it leads to such counterintuitive results.

  If we reject premise (1), we need to explain what cost we pay. The main cost is that we must provide an alternative account of how "ought" functions - specifically why it sometimes selects only adequate options rather than optimal ones. This requires developing a moral framework with thresholds or scalar values where "good enough" creates moral space for permissible but suboptimal choices. We might need to ground this in theories of human limitations or reasonable expectations.

  Compared to alternatives, rejecting (1) preserves important moral intuitions: that heroism exceeds duty, that ordinary life isn't constantly failing morality, and that we can recognize gradations in moral goodness without demanding perfection. Other options like rejecting (2) would distort the definition of supererogation, while accepting (6) leads to moral rigorism where almost everything is forbidden.

  I think the cost of redefining "ought" is worth paying. Maintaining moral latitude aligns better with how we actually experience and discuss ethics. The alternative - declaring all imperfect choices wrong - makes morality impossibly demanding and disconnected from human reality. We can develop sophisticated accounts of "ought" that accommodate thresholds while still recognizing heroic acts as morally exceptional.
answer: |-
  ### The diagnosis
  The break lies in step (1): the claim that "ought" *always* picks the single morally best act available. This premise looks harmless because in straightforward moral dilemmas—say, choosing between rescuing a drowning child or ignoring them—"ought" indeed tracks the optimal act. But this conflates *moral optimality* with *moral obligation*. Obligation often operates within a threshold: acts above a "good enough" standard are permissible, even if suboptimal. Supererogation exists precisely when an act *exceeds* this threshold without becoming obligatory. Your friend’s premise (1) ignores this distinction, collapsing all moral value into a binary "best or forbidden" framework. It smuggles in consequentialism by assuming morality always demands maximisation, which isn’t inherent to "ought" itself—ordinary language allows "You ought to help, but you needn’t martyr yourself."

  ### The price list
  Rejecting premise (1) requires explaining how "ought" functions without demanding optimisation. Three main costs arise:
  - **Cost 1: Defining the threshold.** You must ground *where* the line between duty and supererogation lies. Does it stem from societal expectations (risking relativism), rational agency (invoking Kantian puzzles), or objective costs (inviting debates about sacrifice)? For example, if donating 10% of income is obligatory but 50% supererogatory, what principle fixes 10%?  
  - **Cost 2: Explaining "good but not required."** You’ll need a moral framework where value is *scalar* (acts can be better/worse) but obligation is *deontic* (acts are forbidden/permissible/supererogatory). Hybrid theories (e.g., satisficing consequentialism or virtue-ethical limits) can do this but add complexity and may dilute intuitive maximising impulses.  
  - **Cost 3: Vulnerability to slippery slopes.** If heroic acts aren’t obligatory, why isn’t *any* suboptimal act permissible? Blocking this requires justifying why some "good enough" options (e.g., watching telly) remain permissible while others (e.g., ignoring the drowning child) don’t—potentially appealing to agent-relative prerogatives or fairness, which critics deem arbitrary.  

  Alternatives carry heavier prices: rejecting (2) warps supererogation’s definition beyond recognition; accepting (6) makes morality implausibly demanding, condemning all ordinary life; denying (5) arbitrarily limits the argument to heroism.

  ### Your verdict
  Pay Cost 1 gladly. Grounding the threshold in *reasonable demands*—balancing moral stakes against personal integrity—preserves moral nuance while avoiding rigorism. Yes, defining "reasonable" invites debate, but this mirrors law and everyday ethics. The cost of swallowing (6)—a world where morality forbids rest or minor indulgences—is philosophically and humanly bankrupt.
