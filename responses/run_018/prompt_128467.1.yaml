prompt: |-
  I'm on the review board for a small grant program that funds quick-turnaround social-science pilots. We get like 20 proposals a month, and researchers keep asking if they can run a small preliminary survey before locking their main study design — basically asking wether it's worth delaying the grant decision to gather more info. I want a decision procedure based on Good's theorem on the value of information, turned into something my board can actually run in a 15-minute meeting with nothing but a whiteboard and coffee.

  The procedure should take a proposal and ask questions in order: can they actually update their action after recieving the info? are the prior probabilities genuinely fixed, or does the pilot itself become part of the result and corrupt them? Where the math gives a clear yes or no, say so; where it becomes a judgment call about wether the delay cost outweighs the expected value, flag it as a values vote, not a fact. I need it to catch the hidden misfires — like when the information looks free but actually expands the decision space in a way that violates the theorem's conditions. Then run it on three cases: a team that wants to pre-test survey questions on 30 people before a 500-person study; a team that wants to peek at preliminary census data before choosing which neighborhoods to sample; and a case where we all want to approve the pilot but the procedure forces a no because the information can't actually change our funding decision. Keep it practical for people who aren't decision theorists, mark every spot where we have to vote on values instead of computing answers, and be honest about what the procedure just can't do.
reasoning: |-
  We are going to design a decision procedure based on Good's theorem (the value of information is nonnegative and zero only if the information cannot change the optimal action). The procedure will be a checklist of questions that the review board can run through in 15 minutes.

  The steps:

  1. **Define the decision space without the pilot:** What are the actions (A) we can take? (e.g., fund the main study as proposed, fund a modified version, or reject) and what is the current best action without the pilot?

  2. **Define the information from the pilot:** What exactly will the pilot tell us? (e.g., a set of possible results R1, R2, ... Rn) and how will we update our beliefs based on that?

  3. **Check if the information can change the optimal action:**
     - For each possible result of the pilot, would we choose a different action than the one we would choose without the pilot?
     - If for every possible outcome we would still take the same action as without the pilot, then the information has no value -> reject the pilot request.

  4. **Check if the prior probabilities are fixed:**
     - Is the pilot study going to be part of the main study (e.g., are they going to include the pilot data in the main analysis)? If yes, then the prior might be corrupted because the pilot becomes part of the evidence -> this violates the conditions. We must have that the pilot is only for design and the data are not used in the main study.
     - Are the prior probabilities (our current beliefs about the parameters that the pilot will inform) well-defined and fixed? Or will the pilot alter our beliefs in a way that is not accounted for by Bayesian updating? We must have that the update is purely Bayesian.

  5. **Estimate the expected value of the information (EVI) and compare with the cost of delay:**
     - This step is more judgmental. We need:
       - The expected improvement in the outcome (e.g., expected utility) from having the information. This is computed by: 
          EVI = [Expected utility when we have the information] - [Expected utility without the information]
          But note: without the information we take the current best action. With the information, for each possible outcome we take the best action for that outcome and average over outcomes.
       - The cost of delay: if delaying the decision by the time of the pilot causes harm (e.g., the research becomes less timely, opportunity costs), that cost must be subtracted.

     However, in practice, we might not have utilities and probabilities. So we break it down:

     a. **Probability of changing the decision:** How likely is it that the pilot will change our decision? (e.g., if the pilot shows a problem, we might redesign or reject; if it shows no problem, we go ahead). We need to estimate the probability that we change the action.

     b. **Magnitude of improvement:** If we change the decision, how much better (in terms of the grant's goals) is the new decision? (e.g., avoiding a flawed study might save money and resources; or a redesign might lead to a more impactful study).

     c. **Cost of delay:** What is the cost (in the same units as the improvement) of delaying the decision by the time needed for the pilot? (e.g., if the research is time-sensitive, a month delay might reduce its impact by X%).

     Then: if the expected improvement (probability of change * magnitude of improvement) is greater than the cost of delay, then the pilot is worth it.

     But note: this step requires subjective estimates. We mark it as a "values vote".

  6. **Catch hidden misfires:** 
     - Check if the pilot might expand the decision space in a way that isn't allowed by the theorem. For example, if the pilot leads to new actions that weren't considered before (like a completely different study design that wasn't on the table without the pilot) then the theorem doesn't apply because the set of actions has changed. We must stick to the same set of actions.

  Procedure in checklist form:

  **Pilot Evaluation Checklist**

  1. **Without the pilot, what is the current best action?** (e.g., fund the main study as proposed, or reject?) 
     - *Board must agree on this.*

  2. **What specific information will the pilot provide?** (List the possible outcomes and how they would update our beliefs about key parameters.)

  3. **Can the pilot information change the optimal action?**
     - For each possible outcome of the pilot, would we choose a different action than the current best one?
     - If no for every outcome -> **REJECT** the pilot (no value).
     - If yes for at least one outcome -> proceed.

  4. **Are the prior probabilities fixed and the pilot data not part of the main study?**
     - Is the pilot data going to be included in the main study? (If yes, then **REJECT** because it corrupts the prior and the main study becomes a different study.)
     - Are we updating our beliefs about the parameters only by Bayesian updating? (If no, then **REJECT** because the theorem assumes fixed priors updated by Bayes.)

  5. **Does the pilot expand the set of available actions?**
     - Are there new actions (e.g., new study designs) that become available only after the pilot? (If yes, then **REJECT** because the theorem assumes a fixed set of actions.)

  6. **Estimate the expected value of information (EVI) and cost of delay:**
     - Estimate the probability that the pilot will change our decision (P_change).
     - Estimate the improvement in expected utility (or grant effectiveness) if we change the decision (Improvement).
     - Then, Expected Improvement = P_change * Improvement.
     - Estimate the cost of delay (in the same units as Improvement). This includes:
          - Opportunity cost of the delay (e.g., what else could we fund with that time?)
          - Loss in impact due to the research being later?
          - Any direct costs of running the pilot? (But note: the grant is for the pilot, so we are already considering funding it. However, if the pilot is expensive, maybe we are using funds that could be used elsewhere.)
     - Then, if Expected Improvement > Cost of Delay -> **APPROVE** pilot.
     - Otherwise, **REJECT**.

     *Note: This step is a judgment call. The board must vote on P_change, Improvement, and Cost of Delay. Mark as "values vote".*

  Now, let's run through three cases:

  **Case 1: Pre-test survey questions on 30 people before a 500-person study**

  1. **Current best action without pilot:** Fund the main study as proposed? (Assume we are inclined to fund because the topic is important and the team is good.)

  2. **Information from pilot:** The pilot will test the survey questions and might reveal that some questions are misunderstood (e.g., high non-response or inconsistent answers). Possible outcomes: (a) no problems found, (b) minor problems found, (c) major problems found.

  3. **Can it change the action?**
     - If (a) no problems: we fund as is.
     - If (b) minor problems: we might require minor revisions and then fund.
     - If (c) major problems: we might require major revisions (and delay more) or reject the study.
     - Without the pilot, we would fund without revision. So for (c) we might reject, which is different. So yes.

  4. **Prior fixed and pilot not part of main?**
     - The pilot data is not included in the main study (it's only 30 people, and the main is 500). So yes, prior fixed.

  5. **Expands action space?** 
