     So let's say the actions are: {fund without revision, fund with revision, reject}. Without the pilot, we choose "fund without revision" because we have no reason to revise. With the pilot, we might choose "fund with revision" if problems are found. So the set is fixed -> no expansion.

     Therefore, we proceed.

  6. **EVI and cost of delay:**
     - P_change: probability of major problems (say 20%) that would lead to rejection or major revision? And minor problems (say 50%) that lead to minor revision? But without the pilot we would fund without revision, so if we then run into problems in the main study, we might get bad data. The improvement comes from avoiding a flawed study or improving the study design.
     - Improvement: 
          - If we avoid a flawed study by rejecting, we save the cost of the grant (say $X) and avoid producing bad science (which has a negative impact, say equivalent to $-Y). But note: we also lose the opportunity of good science? Actually, by rejecting a flawed study, we avoid wasting money and can use it for other grants. Also, the bad science might harm the field. So the improvement in the case of major problems is high.
          - In the minor problems case, we get a better study: say the expected utility of the main study without revision is U, with revision it becomes U+Δ (because we fixed the issues). 
          - Without the pilot, we get U (but if there are major problems, we get negative utility).
     - So EVI is complex. We can break it:

          Let:
            P_major = probability of major problems (without pilot, we would get a disaster)
            P_minor = probability of minor problems (without pilot, we would get a suboptimal study)
            P_none = 1 - P_major - P_minor

          Without pilot: 
            Expected utility = P_none * U + P_minor * (U - loss from minor issues) + P_major * (disaster utility)

          With pilot:
            We can avoid the disaster (by rejecting or revising) and fix the minor issues. So:
            Expected utility with pilot = 
               P_none * U (we fund without revision) 
               + P_minor * (U + Δ)   [we fix and get improved utility]
               + P_major * (utility of the action we take: either we reject and save the money -> utility=0 or we revise and get a study that is acceptable -> utility=U_revised, which might be positive but less than U)

          But note: we also subtract the cost of running the pilot? And the cost of delay.

          However, we are only valuing the information. The cost of the pilot is separate (we are funding it). The cost of delay is the harm from delaying the main study.

          In practice, we can simplify:

          Expected Improvement = 
            [Avoided disaster: P_major * (loss from disaster)] 
            + [Improved minor issues: P_minor * (gain from fixing)]

          Then we compare with the cost of delay.

     - Cost of delay: one month delay in the main study. If the research is time-sensitive, this might reduce the impact by, say, 5%? Or if there's a policy window, missing it might be bad.

     This step is a values vote: the board must estimate P_major, P_minor, the loss from disaster, the gain from fixing minor issues, and the cost of delay.

     Given that the pilot is cheap and the potential loss from a disaster is high, we might approve.

     **Verdict:** Likely approve, but requires values vote.

