     However, note that the revision action is available without the pilot? We could always ask for revisions, but we might not have a basis. The pilot gives evidence to choose that action. But the theorem requires that the set of actions is fixed. So if we didn't consider the revision action without the pilot, then we have expanded the set. 

     In practice, the board might have considered revisions without the pilot. So we need to clarify: without the pilot, we have two actions: fund as is or reject. With the pilot, we have three: fund as is, fund with revisions, reject. This expansion violates the theorem? 

