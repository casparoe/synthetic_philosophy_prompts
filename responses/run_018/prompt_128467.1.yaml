answer: |-
  ### Decision Procedure for Pilot Study Requests Based on Good's Value of Information Theorem  
  *Designed for a 15-minute review board meeting. Use this checklist with a whiteboard to track answers. Mark 🗹 for factual/math-based steps and ⚠️ for judgment/value votes. Stop early if a step fails.*

  ---

  #### **Step 1: Can the Information Change the Action?** (🗹 Fact)  
  *Good's theorem requires that the pilot's information could alter your funding decision. If not, the pilot has zero value.*  
  - **Question:** "If the pilot gives any possible result (best, worst, or middle), would it ever change whether we fund the main study, how we fund it (e.g., redesign), or the study's scope?"  
  - **Procedure:**  
    1. List the pilot’s possible outcomes (e.g., "Survey questions work well," "Questions are confusing," "Census shows neighborhood X is ideal").  
    2. For each outcome, ask: "Would this change our current best action?" (e.g., "Would we cancel, modify, or proceed with the main study?").  
  - **Fail if:** All outcomes lead to the same action (e.g., "We’d fund the main study no matter what").  
    → **Reject the pilot.**  
  - **Pass if:** At least one outcome could change the action (e.g., "If questions are confusing, we’d cancel the study").  

  ---

  #### **Step 2: Are Priors Fixed and Pilot Data Excluded from Main Results?** (🗹 Fact)  
  *Good's theorem assumes the pilot doesn’t corrupt the main study’s data or prior probabilities.*  
  - **Question A:** "Is the pilot data purely for design (e.g., choosing survey questions or neighborhoods), and will it be excluded from the main study’s analysis?"  
    - **Fail if:** Pilot data is rolled into the main study (e.g., "We’ll add the 30 pilot surveys to the 500-person dataset").  
      → **Reject the pilot** (violates fixed priors; data is reused).  
  - **Question B:** "Are prior probabilities about key uncertainties (e.g., survey quality, neighborhood differences) based only on existing knowledge, not the pilot?"  
    - **Fail if:** The pilot *defines* the priors (e.g., "We don’t know neighborhood demographics—the pilot *is* our prior").  
      → **Reject the pilot** (priors aren’t fixed).  
  - **Pass if:** Both answers are "yes."  

  ---

  #### **Step 3: Does the Pilot Expand the Decision Space?** (🗹 Fact)  
  *Hidden misfire: The pilot can’t introduce new actions unavailable before.*  
  - **Question:** "Does the pilot create options that weren’t on the table initially? (e.g., new hypotheses, entirely new studies, or design choices we wouldn’t consider otherwise)."  
  - **Fail if:** Yes (e.g., "The pilot might inspire a totally different research question").  
    → **Reject the pilot** (Good's theorem assumes a fixed set of actions).  
  - **Pass if:** The pilot only informs which *existing* action to take (e.g., "We’re still deciding between the same neighborhoods, but now with better data").  

  ---

  #### **Step 4: Cost-Benefit Vote** (⚠️ Values Judgment)  
  *If Steps 1–3 pass, estimate if the pilot’s expected value outweighs the delay cost. This is subjective—vote as a board.*  
  - **Question A (Expected Value of Information, EVI):**  
    - Estimate:  
      - **Probability pilot changes action** (e.g., 20% chance we cancel/modify the study).  
      - **Value of a better decision** (e.g., "If we avoid a flawed survey, we save $10K and get better science").  
    - *EVI ≈ Probability of change × Value of better decision*.  
  - **Question B (Cost of Delay):**  
    - Estimate:  
      - **Time lost** (e.g., "1-month delay means missing a policy window").  
      - **Opportunity cost** (e.g., "Delaying this grant stalls 3 other proposals").  
  - **Verdict:**  
    - If EVI > Delay Cost → **Approve pilot.**  
    - If EVI ≤ Delay Cost → **Reject pilot.**  
  - **Mark as ⚠️:** No math here! Vote based on intuition/experience.  

  ---

  ### Case Studies  
  #### **Case 1: Pre-test survey questions on 30 people before a 500-person study**  
  - **Step 1 (Change action?):**  
    - Outcomes: "Questions work" (proceed), "Questions confusing" (redesign/cancel).  
    → **Pass** (could change action).  
  - **Step 2 (Fixed priors?):**  
    - Pilot data excluded from main study? ✅  
    - Priors fixed (e.g., existing knowledge of survey design)? ✅  
    → **Pass.**  
  - **Step 3 (Expand decision space?):**  
    - Still same actions: fund, redesign, or cancel. ❌ expansion.  
    → **Pass.**  
  - **Step 4 (Cost-benefit ⚠️):**  
    - EVI: High if flawed survey likely (e.g., 30% chance of avoiding a $5K waste).  
    - Delay cost: Low if no urgent timeline.  
    → **Likely approve**, but board votes on values.  

  #### **Case 2: Peek at preliminary census data before choosing neighborhoods**  
  - **Step 1 (Change action?):**  
    - Outcomes: "Neighborhood X better than Y" → changes sampling.  
    → **Pass** (could change action).  
  - **Step 2 (Fixed priors?):**  
    - Pilot data excluded? ❌ (Census data *is* the main study data → reused!).  
    → **FAIL.** Reject pilot (violates Step 2A).  
  - **Why?** The pilot isn’t "preliminary"—it’s part of the results, corrupting priors.  

  #### **Case 3: Pilot that can’t change the funding decision**  
  - **Scenario:** Team wants to test recruitment feasibility. Board agrees: "We’ll fund the main study even if recruitment looks hard."  
  - **Step 1 (Change action?):**  
    - Outcomes: "Recruitment easy" (fund), "Recruitment hard" (still fund).  
    → **FAIL.** No outcome changes action. Reject pilot.  
  - **Why?** Information has zero value per Good’s theorem.  

  ---

  ### What the Procedure Can’t Do  
  1. **Handle vague proposals:** If pilot outcomes aren’t defined (e.g., "We’ll learn something"), skip to rejection.  
  2. **Quantify soft values:** EVI vs. delay cost relies on board judgment.  
  3. **Resolve disputes about priors:** If priors are contested (e.g., "Is our prior really fixed?"), default to rejection.  
  4. **Override values votes:** Step 4 is inherently subjective—no formula fixes disagreements.  

  ### Meeting Flow  
  1. **Whiteboard setup:** Columns for Steps 1–4.  
  2. **Time allocation:**  
     - Steps 1–3: 5–7 min (fact-based, quick yes/no).  
     - Step 4: 5–8 min (debate/vote if needed).  
     - Reject early if any step fails.  
  3. **Output:** Approve/reject + record why (e.g., "Failed Step 2").  

  This forces rigor on the math (Steps 1–3) and honesty about subjectivity (Step 4). Pilots are approved *only* if information can change actions, priors are intact, and values justify the delay.
