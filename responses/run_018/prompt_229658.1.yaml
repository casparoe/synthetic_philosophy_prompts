  I should brainstorm questions that address core criticisms. Retroactivity is crucial—was aggressive war a crime before 1945? Then, victor's justice: if roles reversed, would the trials be accepted? Procedural fairness: were defendants treated justly despite flaws? Selective prosecution: do examples like Soviet lies or Allied hypocrisy undermine the whole process? Precedential value: did the trials' benefits outweigh flaws?

