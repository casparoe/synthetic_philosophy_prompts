  Check if all positions are covered. Total rejection likely answers "no" to retroactivity and victor's justice. Natural-law might accept retroactivity due to moral enormity. Legalists split charges. Pragmatists focus on outcomes. Tokyo-specific critiques need a question on perceived unfairness differences between the two tribunals.

  Also, flag any positions the tree can't separate. For example, if someone thinks both tribunals were flawed but only Tokyo was illegitimate, that's covered. But if a combination leads nowhere, note it as unexplored or incoherent.

  Need to test the flow. Start with retroactivity, then victor's justice, procedural fairness, selective prosecution, precedential value, and Tokyo's unique aspects. Ensure each path ends at a defined leaf. For instance, if someone accepts retroactivity and victor's justice but rejects procedural fairness, where do they land? Maybe pragmatist if they value precedent, or legalist if they distinguish charge types.

  Also, consider the user's deeper needs. They want participants to confront their own uncertainties, so questions must challenge preconceptions. The tree should reveal nuances, not just categorize. Including moral vs. legal dimensions helps. For example, allowing retroactivity based on natural law versus strict legalism.

