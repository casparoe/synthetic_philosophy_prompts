  First, the key requirements: the tree must start from the historical fact of the tribunals and end with named positions. Each branch question should be concrete, avoiding legal jargon, so participants without expertise can engage. Questions shouldn't be simplistic like "is revenge bad?" because that's too binary. They need to tease apart nuances like retroactivity, procedural fairness, and moral justifications.

