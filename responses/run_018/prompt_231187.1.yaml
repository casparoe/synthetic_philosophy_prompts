prompt: |-
  I've been reading David Lewis's *Convention* (1969) and got stuck on a paragraph early in the book. In my own words, he says a convention is a regularity in behaviour where everyone conforms, everyone expects others to conform, and the regularity is arbitrary in the sense that another regularity would have served just as well if it had caught on instead. I understand the parts but I don't rally see what arbitrariness is doing in the definition, since plenty of social regularities are arbitrary but not conventional. Next month I'm leading a session for a mixed reading group—mostly retired scientists and a couple of economists, no philosophers. I don't want to lecture; I want them to see why Lewis needed exactly that package rather than a simpler idea like "a habit lots of people share." Plan the order of ideas: what must be in place before we can look at the definition, which example should carry the whole thing (I'm tempted to use driving on the left, but I suspect it hides something), what misconceptions people like us will bring and where in the sequence to head each one off, and one question I can ask at the end to see if they've actually got it. Also tell me how confident you are in the plan and which bit you're least sure of.
reasoning: |-
  Okay, the user is preparing for a reading group on David Lewis's concept of convention from his 1969 book. They're stuck on why arbitrariness is necessary in the definition, since many arbitrary social regularities aren't conventions. The group consists mostly of retired scientists and economists, so they need a non-lecture approach that encourages discovery. 

  The user wants a structured plan to help the group understand why Lewis's definition includes all three elements: regularity, mutual expectations, and arbitrariness. They're considering using driving side as an example but worry it might oversimplify. They also want to preempt common misconceptions and have a checking question at the end.

  Hmm, the user's phrasing suggests they've deeply engaged with the text but hit a conceptual wall. Their concern about "arbitrariness" is perceptive—many readers miss that Lewis uses it technically to mean "replaceable by alternatives," not just "random." Their scientist/economist audience will likely fixate on functional explanations, so we'll need to dismantle that early.

  For the session flow: Start with vivid examples (driving side, greetings, currency) to anchor intuition before dissecting them. The "habit" misconception must be addressed immediately by contrasting accidental vs. coordinated behavior. Economists might over-index on game theory, so we'll explicitly bracket that aspect. 

  The driving side example is actually perfect if we stress its fragility—how switching sides mid-trip causes chaos, proving the arbitrariness. But we'll supplement with currency to show scale-dependence (dollar bills vs. crypto). 

  Biggest risk is scientists demanding evolutionary justifications ("But right-hand traffic optimizes X!"). Need a preemptive strike: "Does the reason matter?" followed by the salt-shaker analogy. Least confident in the mutual expectations part—might need to act out a "guess-what-I-expect-you-to-expect" loop with two volunteers. 

  Closing question should force synthesis: "Why couldn't 'carrying umbrellas in London' be a convention?" If they spot the lack of coordination/alternatives, we've won.
answer: |-
  Here's a structured plan designed to help your group *discover* why Lewis needs his full definition, especially arbitrariness, rather than just lecturing it. It uses scaffolding, targeted examples, and pre-emption of likely misconceptions.

  **Goal:** For the group to see why Lewis *needs* regularity + mutual expectation + arbitrariness, and why simpler ideas ("habit," "norm," "arbitrary rule") fall short.

  **Audience Adaptation:** Leverage scientists' focus on *function* and economists' understanding of *coordination* and *incentives*. Avoid jargon. Use concrete, relatable examples.

  **The Plan (Order of Ideas & Activities):**

  1.  **Start with Intuition & Common Examples (5 mins):**
      *   **Question:** "Think of things we all do consistently in society, not because of a law, but just because... it's what we do. What comes to mind?"
      *   *Capture answers:* Driving on the right/left, shaking hands (vs. bowing), using $/€/¥, saying "bless you" after a sneeze, QWERTY keyboard, stopping at red lights, even language itself.
      *   *Goal:* Activate their pre-theoretical understanding of "convention." List these visibly.

  2.  **Contrast with Simple "Habit" (Where Regularity Alone Fails) (10 mins):**
      *   **Pick an Example:** "Let's take one: *Driving on the right* in the US. Is this just a habit? Like... *brushing your teeth every morning*?"
      *   **Question:** "What's the crucial difference? What happens if *I alone* decide to drive on the left tomorrow?" *[They'll say: Crash! Ticket! Chaos!]*
      *   **Reveal Point 1 (Expectation):** "Exactly! My action depends on *what I expect others to do*. And *their* actions depend on what they expect *me* (and everyone else) to do. It's interdependent." *(Introduce "mutual expectation" organically).*
      *   **Contrast Habit:** "Brushing my teeth? If I stop, it affects mostly me. No one *else* relies on me brushing my teeth for *their* brushing to work. It's not interdependent." *(Habbit lacks mutual expectation/coordination).*
      *   **Misconception Pre-empted:** "So, it's not *just* a regularity or habit. The mutual expectations are key."

  3.  **Introduce the "Why?" Question (Function vs. Arbitrariness) (10 mins):**
      *   **Question:** "Okay, driving on the right: *Why* do we do it? What's the *point*?" *(Likely answers: Safety, avoid crashes, efficiency).*
      *   **Follow Up:** "Is driving on the right *inherently* safer or more efficient than driving on the left?" *(Scientists/Economists might debate minor points, but consensus: No, fundamentally equivalent).*
      *   **Introduce the Alternative:** "Right. Driving on the *left* works just as well *as long as everyone does it*. The UK, Japan, Australia prove that."
      *   **Reveal Point 2 (Arbitrariness):** "So, the *specific choice* of right or left is arbitrary in this sense: there's another equally good option that could have worked instead. The *point* (safety/efficiency) is served by *any* consistent choice, but we *need* one specific choice for coordination."
      *   **Contrast Non-Arbitrary Regularities:** "Compare this to stopping at a red light. Could we have chosen *green* to mean stop? Sure, that's arbitrary. But compare it to *breathing air*. Is breathing air arbitrary? Could we breathe nitrogen just as well? No! There's no equally good alternative regularity for the function (staying alive). Breathing is necessary, not conventional." *(Or: Wearing warm coats in winter - function is inherent to the action).*
      *   **Misconception Pre-empted:** This tackles the "plenty of social regularities are arbitrary but not conventional" head-on. Arbitrariness (in Lewis's sense) *alone* isn't sufficient. It must be coupled with the coordination problem (mutual expectations) and the regularity.

  4.  **Test with Another Example: Language (Deepening Arbitrariness) (5 mins):**
      *   **Example:** "Why do we call this [point to a chair] a 'chair'? Could we call it a 'blorg'?" *(Yes!)*
      *   **Question:** "But if I start calling it a 'blorg' tomorrow, does it work?" *(No - no one understands me)*
      *   **Connect:** "So, regularity (using 'chair')? Check. Mutual expectation (I expect you to say 'chair', you expect me to)? Check. Arbitrariness ('blorg' or 'stuhl' or 'chaise' would work *just as well* if everyone used it)? Check. It *only* works because we *all* coordinate on one specific, arbitrary sound for this thing."

  5.  **Present Lewis's Full Definition Synthesized (5 mins):**
      *   "So, Lewis is saying a convention is a specific kind of pattern:
          1.  **Regularity:** Everyone (mostly) does X.
          2.  **Mutual Expectation:** Everyone expects everyone else to do X, *because* they see others doing it and expecting it. (This is the coordination glue).
          3.  **Arbitrariness:** There's at least one other regularity Y that would have worked *just as well* for achieving the common goal (safety, communication, exchange) *if* it had become the expected pattern instead. X isn't uniquely superior; its dominance is historical/accidental."
      *   **Emphasize the Package:** "Why all three? Regularity alone is just habit. Regularity + expectation gets us coordination. But adding *arbitrariness* is what makes it *conventional* rather than necessary or uniquely optimal. It explains *why* different societies can have different conventions solving the same problem."

  6.  **The Crucial Check Question (5 mins):**
      *   **Question:** "Imagine a society where *everyone always carries a small, lucky salt shaker in their left pocket*. It's a universal habit. They expect others to do it. They see it as essential for good fortune. Is this a convention in Lewis's sense?"
      *   **Why it works:**
          *   It tests all three components.
          *   Regularity? Yes. Mutual Expectation? Seems so. Arbitrariness? **This is the key.**
          *   **Discussion Point:** Is there an *equally good alternative*? (e.g., carrying it in the right pocket? Carrying a pepper shaker instead?). If the group argues the *specifics* (left pocket, salt shaker) are arbitrary *and* that switching to an alternative *would work just as well for the perceived function (luck)*, then *maybe* yes. But likely, they'll sense it's missing something.
          *   **The Reveal:** Lewis would likely say **No**, it's *not* a convention. Why? The "arbitrariness" condition is probably *not* met in the right way. There's no clear *coordination problem* being solved where multiple solutions exist. The perceived "function" (luck) isn't demonstrably served *by coordinating on one arbitrary solution*; it's more like a shared superstition or ritual. The "alternative" (right pocket, pepper shaker) isn't a true alternative *solution to a coordination problem*; it's just a different ritual. This highlights that arbitrariness in Lewis is tied to solving a recurrent coordination problem (driving, communicating, exchanging) where alternatives are functionally equivalent *for that specific coordination purpose*.

  **Confidence & Least Sure Bit:**

  *   **Overall Confidence: High (8/10).** The structure builds logically from intuition, isolates components, uses strong contrasting examples, pre-empts key misconceptions (especially the function/arbitrariness confusion common with scientists/economists), and has a solid check question.
  *   **Least Sure Bit: The "Lucky Salt Shaker" Check Question (Confidence: 7/10).**
      *   *Why?* It's intentionally ambiguous to spark discussion. There's a risk the group gets bogged down debating whether "luck" is a real function or whether the alternatives *are* truly equivalent. Be prepared to guide them back to the *coordination problem* aspect: Is the salt shaker solving a problem where my success depends on predicting your behavior? (Like driving or language). Or is it just a shared, causally independent belief/ritual? Emphasize the link between arbitrariness and *interchangeable solutions to a coordination dilemma*.
      *   *Mitigation:* Have a backup clearer example ready if this flops. E.g., "Wearing a specific color (say, green) as 'lucky' for a sports team - is that a convention?" (More clearly arbitrary - they could have chosen blue, and it works as long as everyone coordinates on the *same* color for solidarity/identification).

  **Why Driving on the Left/Right Works Well (Don't Worry!):**
  It's an excellent core example because:
  1.  The coordination need (avoid crashes) is crystal clear.
  2.  The mutual expectation is obvious and visceral (you *feel* it when driving).
  3.  The arbitrariness is undeniable and proven by real-world alternatives.
  4.  The cost of non-conformity is immediate and severe.
  5.  It avoids the complexities of norms with strong moral force (like promise-keeping) where the "arbitrariness" might feel less intuitive. It focuses purely on coordination.

  This plan should give your group the tools to see why Lewis's definition is precisely crafted to capture the phenomenon he's interested in (solutions to coordination problems) and why each element is necessary. Good luck with the session!
