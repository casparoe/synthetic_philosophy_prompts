prompt: |-
  I serve as the senior features editor for a quarterly history magazine read by general audiences and secondary-school teachers. Each issue carries two or three long-form articles that trace the causes of major historical turning points, and our writers have begun framing pathogens, climate anomalies, and volcanic eruptions as "historical actors" rather than mere background conditions—forces with explanatory weight comparable to human decisions. I have watched drafts drift into environmental determinism, presenting outcomes as inevitable outputs of temperature drops or ash clouds, and I have watched others anthropomorphize viruses or glaciers into entities with intentions. I need a reusable editorial procedure that staff members with no philosophical training can run in about thirty minutes on any proposed framing. The deliverable should be a sequence of ordered questions or tests; for each step specify what counts as a sufficient answer, where the procedure stops with a firm rejection of the framing, where it permits the framing only with mandatory qualifications, and where the question is one of values rather than facts and must be escalated to me. The procedure must be executable without outside research during deadline crunch. Apply it to three proposed article angles: first, framing the fourteenth-century Black Death as an agent that dissolved feudal obligations by restructuring labor supply; second, framing the 1815 Tambora eruption as the causal actor behind Mary Shelley’s composition of Frankenstein during the 1816 Geneva summer; and third, framing a hypothetical 2030 influenza pandemic—already modeled by our science desk—as a deterministic trigger for a specific geopolitical realignment, with human policy responses treated as mere epiphenomena. Be sure to include the case in which the procedure returns a verdict the proposing writer will strongly dislike, and state clearly what the procedure cannot settle.
reasoning: |-
  We are designing an editorial procedure that can be applied to article drafts that frame non-human entities (pathogens, climate anomalies, volcanic eruptions) as "historical actors". The goal is to avoid both environmental determinism and anthropomorphism, while allowing for these factors to have explanatory weight.

   The procedure will be a sequence of questions/tests. For each step, we specify:
     - What counts as a sufficient answer.
     - Where the procedure stops with a firm rejection.
     - Where it permits the framing only with mandatory qualifications.
     - Where the question is one of values and must be escalated.

   The procedure must be executable in about 30 minutes without outside research.

   We will then apply the procedure to three cases:
     1. Black Death as an agent that dissolved feudal obligations.
     2. Tambora eruption as the causal actor behind Mary Shelley's Frankenstein.
     3. A hypothetical 2030 influenza pandemic as a deterministic trigger for geopolitical realignment.

   We must include a case where the verdict is negative and the writer might dislike it.

   Steps of the procedure:

   Step 1: Identify the Non-Human "Actor"
     - Question: What non-human entity is being framed as an actor, and what historical outcome is it said to cause?
     - Sufficient answer: Clear identification of the entity and the outcome.
     - If the answer is unclear, stop and reject until clarified.

   Step 2: Check for Anthropomorphism
     - Question: Does the draft attribute intentions, motivations, or goal-directed behavior (like a human agent) to the non-human entity?
     - Sufficient answer: The answer must be "no". If the draft uses terms that imply intention (e.g., "the virus wanted", "the eruption decided", "the glacier chose"), then it fails.
     - If yes, then the framing must be rejected unless the writer removes all such language. (This is a firm rejection if present and not removed.)

   Step 3: Check for Environmental Determinism
     - Question: Does the draft present the outcome as the inevitable result of the non-human factor, without acknowledging the role of human agency, structural factors, or contingency?
     - Sufficient answer: The draft must acknowledge that the non-human factor created conditions that could have led to multiple outcomes, and that human decisions and social structures played a role in shaping the actual outcome.
     - If the draft presents the outcome as inevitable, then it requires mandatory qualifications. The writer must revise to show how human agency and social structures mediated the effect. If the writer refuses, reject.

   Step 4: Causal Mechanism Check
     - Question: Does the draft describe a plausible causal chain (even if simplified) that connects the non-human factor to the outcome, without making the non-human factor the sole cause?
     - Sufficient answer: The draft must outline a chain of events (e.g., eruption -> climate change -> crop failure -> social unrest) and must not present the non-human factor as the sole cause. It must acknowledge that without the non-human factor, the outcome might not have occurred, but also that without the human and social context, the outcome would not have taken the specific form it did.
     - If the causal chain is missing or the non-human factor is presented as the sole cause, then the framing requires mandatory qualifications (to include human and social factors). If the writer cannot provide a causal chain without making the non-human factor the sole cause, reject.

   Step 5: Balance of Agency
     - Question: Does the draft assign appropriate weight to the non-human factor relative to human and social factors? (This step is more subjective and may require escalation if the answer is unclear or contested.)
     - Sufficient answer: The non-human factor should be presented as one of several important factors (even if a major one) and not as the dominant factor that overpowers all others. The writer must show that they have considered and integrated human agency and social structures.
     - If the draft overemphasizes the non-human factor to the point of making human agency seem negligible, then it requires mandatory qualifications to rebalance. If the writer cannot do this without downplaying human agency to an unacceptable degree, reject.
     - Note: This step might involve values (how much weight to assign) and if the editor and writer disagree, it should be escalated to the senior editor.

   Step 6: Escalation for Values
     - If at any step the question turns on a value judgment (especially in Step 5) and the editor and writer cannot agree, the issue must be escalated to the senior editor (you) for a decision.

   Now, applying the procedure to the three cases:

   Case 1: Black Death as an agent that dissolved feudal obligations.

     Step 1: Non-human actor: The bacterium Yersinia pestis (Black Death). Outcome: Dissolution of feudal obligations.
        - Sufficient.

     Step 2: Check for anthropomorphism. The draft says the Black Death "dissolved" feudal obligations. This is a metaphor but does not necessarily attribute intention. However, if the draft says the Black Death "intended" to change society, that would be a problem. Assuming the draft avoids intentional language, it passes.

     Step 3: Check for determinism. If the draft says the labor shortage inevitably led to the dissolution of feudal obligations, that might be deterministic. But in reality, the outcome was mediated by human actions (peasant revolts, lords' responses, legal changes). The draft must acknowledge these. If it does not, it requires revision to include them.

     Step 4: Causal chain: The Black Death caused high mortality -> labor shortage -> increased bargaining power for peasants -> challenges to feudal obligations. This is plausible. But the draft must not say that the Black Death alone caused the dissolution. It must note that without the revolts and negotiations, the system might have persisted in some form.

     Step 5: Balance: The Black Death was a major factor, but the human responses were crucial. The draft should not present the plague as the sole actor. If it does, it must be rebalanced.

     Verdict for Case 1: Likely acceptable with mandatory qualifications. The writer must ensure that human agency (peasants' actions, lords' responses) is given a central role in the narrative.

   Case 2: Tambora eruption as the causal actor behind Mary Shelley's Frankenstein.

     Step 1: Non-human actor: Tambora eruption. Outcome: Mary Shelley writing Frankenstein.

     Step 2: Check anthropomorphism: If the draft says the eruption "inspired" or "caused" the writing, that is acceptable if it doesn't attribute intention. But if it says the eruption "wanted" to create a masterpiece, that would be rejected. We assume the draft avoids intentional language.

     Step 3: Determinism: Did the eruption inevitably lead to Frankenstein? No. The eruption caused the "Year Without a Summer" (1816) which led the Shelley party to stay indoors and tell ghost stories. But without Mary Shelley's creativity and the specific context (the challenge to write a story, her intellectual circle), the novel wouldn't have been written. The draft must not present it as inevitable.

     Step 4: Causal chain: Eruption -> climate anomaly -> altered travel plans -> storytelling contest -> Shelley's composition. This chain is plausible but contingent. The draft must acknowledge the contingency and the role of human agency (Shelley's genius, the group dynamic).

     Step 5: Balance: The eruption was a catalyst but not the main creative force. The draft should not overshadow Shelley's agency.

     Verdict: Acceptable with qualifications. The eruption should be framed as a catalyst that set the stage, but the human element (Shelley) must be central.

   Case 3: Hypothetical 2030 influenza pandemic as a deterministic trigger for a specific geopolitical realignment, with human policy responses as mere epiphenomena.

     Step 1: Non-human actor: Influenza virus. Outcome: Specific geopolitical realignment.

     Step 2: Anthropomorphism: If the draft says the virus "intends" to reshape the world, that is rejected. We assume it avoids this, but note the word "deterministic" and "mere epiphenomena" are red flags.

     Step 3: Determinism: The draft explicitly says the pandemic is a deterministic trigger and human responses are "mere epiphenomena". This is classic environmental determinism. The draft must be revised to show that human decisions (policy choices, international cooperation or lack thereof) are not just epiphenomena but active forces that shape the outcome.

     Step 4: Causal chain: The draft might argue: pandemic -> deaths and economic disruption -> geopolitical shifts. But without human agency, this chain is incomplete. The chain must include how different policy responses (e.g., lockdowns, travel restrictions, vaccine distribution) lead to different outcomes. The draft must not present the geopolitical shift as inevitable.

     Step 5: Balance: The draft explicitly downplays human agency to "mere epiphenomena". This is unacceptable. The virus may be a major factor, but human decisions and social structures are central to how the pandemic plays out.

     Verdict: Rejected unless the writer completely revises the framing to restore human agency. The writer will likely dislike this. The procedure cannot force the writer to change their view, but it can reject the current framing.

   What the procedure cannot settle:
     - The procedure cannot resolve deep philosophical disagreements about the nature of agency. If the writer insists on a strongly materialist view that minimizes human agency, the procedure will reject it, but the senior editor might have to mediate.
     - It cannot make judgments about the accuracy of historical facts or scientific models (that's for fact-checking and peer review). It only addresses the framing.

   Final Procedure Summary:

     Step 1: Identify actor and outcome. (If unclear, reject until clarified.)
     Step 2: Reject any anthropomorphism (intentional language). (If present, reject until removed.)
     Step 3: Check for determinism. (If present, require qualifications: human agency and contingency must be included. If the writer refuses, reject.)
     Step 4: Require a causal chain that does not make the non-human factor the sole cause. (If missing or sole cause, require qualifications; if not fixed, reject.)
     Step 5: Check balance of agency. (If unbalanced, require rebalancing. If the writer cannot or will not, reject. If disagreement on balance is about values, escalate to senior editor.)

     Note: Steps 2 and 3 are critical and non-negotiable. Step 5 may require escalation.

     The procedure should take about 30 minutes by going through these steps and discussing with the writer.
answer: |-
  ### Editorial Procedure for Evaluating Non-Human "Historical Actors"  
  **Goal**: Prevent environmental determinism and anthropomorphism while acknowledging non-human forces as significant contributors. Executable in ≤30 mins without external research.  

  #### Step-by-Step Procedure  
  1. **Identify Causal Framing**  
     - **Question**: "Does the draft explicitly frame the non-human factor (e.g., pathogen, climate event) as the *primary driver* of the outcome, reducing human agency to a secondary or passive role?"  
     - **Sufficient Answer**: Clear acknowledgment of human and non-human factors.  
     - **Rejection Trigger**: If the non-human factor is presented as the *sole* cause. Stop and reject.  
     - **Qualifications Needed**: If non-human factor is primary but other causes exist, proceed to Step 2.  

  2. **Anthropomorphism Check**  
     - **Question**: "Does the language imply intention, cognition, or goal-directed behavior (e.g., ‘the virus chose,’ ‘the eruption engineered’)?"  
     - **Sufficient Answer**: Metaphorical language (e.g., "triggered," "catalyzed") is acceptable if intention is not implied.  
     - **Rejection Trigger**: Unambiguous anthropomorphism (e.g., "Tambora *inspired* Shelley"). Stop and reject.  
     - **Qualifications Needed**: Replace intentional verbs with passive/mechanical terms (e.g., "resulted from").  

  3. **Determinism Test**  
     - **Question**: "Is the outcome portrayed as *inevitable* given the non-human factor, with no plausible alternative paths?"  
     - **Sufficient Answer**: Recognition of contingency (e.g., "X made Y possible, but human choices Z shaped the outcome").  
     - **Rejection Trigger**: Inevitability claims (e.g., "the pandemic *must* lead to war"). Stop and reject.  
     - **Qualifications Needed**: Add qualifiers like "probable," "contingent," or "mediated by."  

  4. **Human Agency Audit**  
     - **Question**: "Are human decisions/systems (e.g., policies, cultural norms) treated as *active mediators* (not passive effects) of the non-human factor?"  
     - **Sufficient Answer**: Humans are shown responding to, resisting, or adapting the non-human force.  
     - **Rejection Trigger**: Human actions dismissed as "epiphenomena" or "automatic." Stop and reject.  
     - **Escalation Needed**: If the writer insists human agency is negligible (values conflict), escalate to senior editor.  

  5. **Counterfactual Plausibility**  
     - **Question**: "Could a similar outcome occur *without* the non-human factor, or could the factor have led to a *different* outcome?"  
     - **Sufficient Answer**: At least one alternative scenario is acknowledged.  
     - **Qualifications Needed**: If absent, add a qualifying statement (e.g., "While X accelerated Y, preexisting tensions Z were critical").  
     - **Limitation**: Cannot resolve speculative historical debates—focus on logical coherence.  

  6. **Weight Attribution Balance**  
     - **Question**: "Does the draft assign proportional weight to the non-human factor relative to human/social factors?"  
     - **Sufficient Answer**: The non-human factor is contextual, not dominant (e.g., "Tambora created conditions, but Shelley’s genius was decisive").  
     - **Escalation Needed**: If disagreement on weighting (e.g., "Is the virus 80% or 30% responsible?"), escalate to senior editor.  

  **Procedure Outputs**:  
  - **Reject**: Fails Steps 1, 2, 3, or 4.  
  - **Accept with Qualifications**: Passes Steps 1–2 but needs adjustments in 3, 5, or 6.  
  - **Escalate**: Values-based conflicts in Steps 4 or 6.  

  ---

  ### Application to Case Studies  
  #### Case 1: Black Death as an Agent Dissolving Feudal Obligations  
  - **Step 1**: *Primary driver?* Yes (labor restructuring). **Qualifications Needed**.  
  - **Step 2**: *Anthropomorphism?* No (if "dissolved" is metaphorical). **Pass**.  
  - **Step 3**: *Determinism?* Yes (implies feudalism *had* to collapse). **Rejection Trigger** unless revised.  
  - **Step 4**: *Human agency?* Downplays peasant revolts/lord negotiations. **Rejection Trigger**.  
  - **Step 5**: *Counterfactual?* None. Feudalism could have persisted via coercion. **Qualifications Needed**.  
  - **Step 6**: *Weight balance?* Overemphasizes plague. **Escalate** for senior review.  
  **Verdict**: **Reject** unless human agency (e.g., post-plague revolts) is centered. *Writer may dislike: Rejects "virus as revolutionary hero" narrative.*  

  #### Case 2: Tambora as Causal Actor Behind *Frankenstein*  
  - **Step 1**: *Primary driver?* Yes (eruption caused dreary weather). **Qualifications Needed**.  
  - **Step 2**: *Anthropomorphism?* Risk in "Tambora inspired Shelley." **Rejection Trigger** if not revised.  
  - **Step 3**: *Determinism?* Yes (implies no eruption = no *Frankenstein*). **Qualifications Needed**.  
  - **Step 4**: *Human agency?* Shelley’s creativity/group dynamics are marginalized. **Rejection Trigger**.  
  - **Step 5**: *Counterfactual?* Shelley could have written it elsewhere/elsewhen. **Pass** if noted.  
  - **Step 6**: *Weight balance?* Overweights Tambora. **Qualifications Needed** (e.g., "Tambora enabled, not caused").  
  **Verdict**: **Accept with Qualifications**: Frame as "Tambora created conditions, but Shelley’s agency was central."  

  #### Case 3: 2030 Influenza as Deterministic Geopolitical Trigger  
  - **Step 1**: *Primary driver?* Yes (pandemic as trigger). **Qualifications Needed**.  
  - **Step 2**: *Anthropomorphism?* Unlikely. **Pass**.  
  - **Step 3**: *Determinism?* Explicit ("deterministic trigger"). **Rejection Trigger**.  
  - **Step 4**: *Human agency?* Policies as "epiphenomena." **Rejection Trigger**.  
  - **Step 5**: *Counterfactual?* None. Ignores preexisting tensions. **Rejection Trigger**.  
  - **Step 6**: *Weight balance?* Virus dominates; humans passive. **Escalate** (values conflict: agency vs. structure).  
  **Verdict**: **Reject**. Human responses (e.g., lockdowns, treaties) must be active forces. *Writer may dislike: Rejects "virus as master strategist" determinism.*  

  ---

  ### What the Procedure Cannot Settle  
  1. **Empirical Accuracy**: Does not verify scientific/historical claims (e.g., "Did Tambora *really* cause the 1816 weather?").  
  2. **Philosophical Disputes**: Cannot resolve debates about free will vs. determinism—flags for escalation.  
  3. **Narrative Weight**: Subjective judgments about "how much" credit to assign non-human forces require senior editor input.  

  **Final Note**: This procedure prioritizes *contingency* and *human-nature interplay*. It rejects framings that erase human ingenuity or reduce history to biological/climatic outputs.
