  First, I should assess if this is feasible. Teaching constructivism vs. eliminativism in 40 minutes to a beginner is tight but possible if I focus on concrete examples and avoid theory. The user specified no lectures or bibliographies, so I'll stick to interactive activities and relatable scenarios.

  The user mentioned possible misconceptions: "it's imaginary," "I can opt out," "there's a hidden controller." I need to anticipate these and address them at specific points. The session should build dependencies step by step, starting from zero assumptions.

  I'll use a closed-loop token system as the carrying example. The user suggested prison cigarettes or local exchange rings. Prison cigarettes might be too mature or ethically tricky for a teenager, so I'll go with a local exchange ring (LER) like Ithaca HOURS. It's tangible, community-based, and shows mutual dependence without government backing—perfect for illustrating social construction.

  For structure: a 5-minute hook to engage the teen's current view, then a 10-minute dependency chain to establish prerequisites for money to work. Next, a 15-minute deep dive into the LER example to make it concrete. Then, 5 minutes to address the three big misconceptions as they arise. Finally, a 5-minute end-check to verify understanding without mentioning Searle.

  The hook should validate their intuition—calling money a hallucination is partly right—while hinting it's incomplete. The dependency chain needs to build from scratch: start with barter problems, introduce trust, then mutual agreement. This sets up why money isn't arbitrary; it requires shared practices.

  For the LER example, I'll have the teen role-play exchanges to feel the system's reality. If they say "it's imaginary," I'll redirect to its consequences: "Can you eat the token? No, but you can trade it for bread—why?" This cuts off the misconception early by focusing on functionality.

  When the opt-out question comes, I'll use the island scenario to show minimal participation is unavoidable. For the hidden controller, I'll emphasize emergence: no single person dictates value; it's bottom-up.

  The end-check must assess if they grasp reality without independence. I'll use a thought experiment: "If everyone stopped believing in dollars, what happens?" If they say dollars become worthless but were real before, that's success—showing the dependence.

