prompt: |-
  I have been trying to understand this idea of scientific research programmes — the notion that a theory sits inside a protective belt of auxiliary assumptions, with a hard core that is protected at all costs, and that programmes can be progressive or degenerating depending on whether they generate surprising new predictions or just keep patching themselves up. I would like you to construct a thought experiment that applies this framework to an ordinary, non-scientific domain — for instance, a local cooperative or a craft workshop — rather than to physics or medicine. Build a single-paragraph, realistic scenario in which two competing programmes govern the same practical problem: one programme genuinely expands its predictive or organizational success by risking a bold, unexpected claim that turns out correct, while the other preserves its central rule only by repeatedly adding ad hoc exceptions to its protective belt, never anticipating anything in advance.

  After presenting the scenario, explain precisely how Lakatos's criteria classify each programme, identifying the hard core, the protective belt adjustments, and the specific novel fact that separates them. Then state clearly which structural feature of your case is carrying the weight of the distinction, describe what collapses if you remove that feature, and explain how an advocate of the degenerating programme could reply that its adjustments are not ad hoc but reasonable refinements rather than defensive maneuvers. Please do not provide citations, reading lists, or references to specific texts; treat the concepts as common philosophical tools.
