prompt: |-
  I work in theoretical biology, building evolutionary models of social behavior; my working vocabulary is replicator dynamics, evolutionarily stable strategies, asymmetric contests, costly signaling, and assortment. I have been reading about David Lewis's account of convention in his book Convention, and I want to know how much of it survives translation into my framework.

  As I understand it, the account runs roughly as follows. A convention is a regularity in the behavior of members of a population facing some recurring situation, where it is common knowledge among them that nearly everyone conforms to the regularity, that nearly everyone expects the others to conform, and that nearly everyone prefers to conform conditional on the others doing so; and where the situation admits at least one alternative regularity that could equally have served. The underlying problem is thus one of coordination with multiple solutions, and the convention is arbitrary in the sense that another would have done. Conventions get started and sustained through precedent and salience rather than through enforceable agreement.

  Here is what I would like. First, restate each component of this account in evolutionary game theory vocabulary, as faithfully as you can: the recurring situation and its multiplicity of solutions; conformity as a preference conditional on others' conformity; the expectation and common-knowledge conditions; arbitrariness; precedent and salience. Be explicit about what each component becomes -- for instance, whether common knowledge turns into a claim about public signals, correlated encounters, or assortment, or simply drops out of the model -- rather than giving me a loose paraphrase.

  Second, a test case. Behavioral ecologists describe the resolution of territorial contests by owner-intruder asymmetries -- the incumbent almost always wins, and selection favors individuals who escalate when owner and retreat when intruder -- as a convention, and it is standardly modeled as a correlated equilibrium built on an observable role asymmetry. Would this count as a convention on your translation of Lewis, given that the animals presumably hold no expectations about one another, let alone common knowledge? Use this case to show me where the translation has bite, and whether my field has been using the word too loosely or Lewis too strictly.

  Third, the residue report. Which parts of the account translate cleanly, which translate only under distortion, and which have no expression in my framework at all? The candidates I have in mind include the epistemic conditions (do replicator dynamics need anything like common knowledge, or does the epistemic layer matter only for agents who deliberate?); the distinction Lewis wants between a convention and a mere behavioral regularity (can an ESS fail to be a convention, and can my framework even state the difference?); and whatever room Lewis leaves for agents to reflect on their conventions -- to keep one, abandon one, or coordinate on switching to another -- which seems to have no counterpart in a population of replicators. For each piece of residue, give me your verdict on whether it marks something my framework is missing (a notion of norm, of shared expectation, of deliberation among equilibria) or something Lewis's rational-choice scaffolding added without earning its keep. In other words: does the evolutionary reconstruction show that convention was never the epistemically loaded phenomenon Lewis took it to be, or does it instead reveal what his account can see and mine cannot?
reasoning: |-
  We are going to break down the request into three main parts: 
  1. Restating each component of Lewis's account in evolutionary game theory (EGT) vocabulary.
  2. Applying the translation to the test case of owner-intruder asymmetries in territorial contests.
  3. Analyzing the residue: which parts translate cleanly, which with distortion, and which not at all.

  Let's proceed step by step.

  ### Part 1: Translation of Lewis's Components into EGT Vocabulary

  Lewis's account of convention has the following components:

  1. **Recurring situation with multiple solutions**: 
     - Lewis: A situation that recurs and has multiple possible regularities (coordination equilibria) that could solve it.
     - EGT: This is a coordination game (a class of symmetric games) with at least two pure-strategy Nash equilibria (or evolutionarily stable strategies, ESS). The situation is modeled as a repeated interaction (or a population of agents facing the same game repeatedly). The recurrence is captured by the population being in a stable state (e.g., an ESS) and the game being played over generations.

  2. **Regularity in behavior**:
     - Lewis: Nearly everyone conforms to the regularity.
     - EGT: The population is monomorphic (or nearly monomorphic) at an ESS. That is, almost all individuals use the same strategy (the one that specifies the behavior in the situation).

  3. **Preference conditional on others' conformity**:
     - Lewis: Each individual prefers to conform given that (nearly) all others conform.
     - EGT: In the context of evolutionary models, we think in terms of fitness (payoff) rather than preference. The condition becomes: in the current population state, the strategy that corresponds to conformity has a higher fitness (or at least not lower) than any mutant strategy, given that almost everyone else is conforming. This is the definition of an ESS. Specifically, for a coordination game, the strategy is a strict Nash equilibrium: if everyone else is playing it, then playing it yields a higher payoff than any deviation.

  4. **Expectation and common knowledge**:
     - Lewis: It is common knowledge that nearly everyone conforms, that nearly everyone expects others to conform, and that nearly everyone prefers to conform conditional on others conforming.
     - EGT: The concept of common knowledge is notoriously difficult to capture in evolutionary models. However, note:
          - The condition of near-universal conformity is captured by the monomorphic population at the ESS.
          - Expectation of others' behavior: In EGT, we model this via the population state. An individual "expects" others to play the prevalent strategy because that is the only strategy they encounter (in a monomorphic population) or the strategy they encounter with high probability (in a polymorphic population with high frequency of the convention). In the replicator dynamics, the population state (the distribution of strategies) directly determines the expected behavior of a randomly encountered opponent. Thus, "expectation" becomes the empirical frequency of strategies in the population.
          - Common knowledge: In evolutionary models, common knowledge is not explicitly represented. Instead, the population state is public and observable (or at least, the behavior is observable). The stability of the ESS implies that every individual is best-responding to the current population state, and this is sustained without any need for higher-order beliefs. Thus, common knowledge in Lewis's sense is replaced by the public observability of the population state and the stability of the equilibrium. In other words, the evolutionary model does not require an epistemic layer; it is replaced by the dynamics and the equilibrium concept.

     So, in EGT:
        - "Nearly everyone conforms" → monomorphic population at an ESS.
        - "Nearly everyone expects others to conform" → the population state is such that the frequency of the convention strategy is near 1, so any individual can expect to meet a conforming opponent with near certainty.
        - Common knowledge → drops out and is replaced by the public state of the population and the stability of the equilibrium.

  5. **Arbitrariness**:
     - Lewis: There exists at least one alternative regularity that could have been established instead and would have worked just as well.
     - EGT: The coordination game has at least two distinct strict Nash equilibria (or ESSs) that are equally efficient (or at least, both are efficient in the sense of being Pareto-optimal among the Nash equilibria). This is the case in a pure coordination game where the two equilibria yield the same payoff (e.g., (A, A) and (B, B) both give (1,1) while (A,B) and (B,A) give 0). Alternatively, the game might have multiple equilibria that are not necessarily equivalent in payoffs, but Lewis requires that the alternative would have served equally well. So in EGT, we require at least two strict ESSs with the same (or similar) payoff.

  6. **Precedent and salience**:
     - Lewis: Conventions get started and sustained through precedent (past conformity) and salience (some feature of the situation that makes one equilibrium stand out).
     - EGT: 
          - Precedent: This can be captured by the initial conditions and the dynamics. In replicator dynamics, the basin of attraction of an ESS determines which equilibrium is reached. Precedent could be modeled as the population starting near one equilibrium and then evolving to it. Once established, it is maintained by the stability of the ESS.
          - Salience: In evolutionary models, salience might be introduced by correlating devices or by asymmetries (like the owner-intruder roles) that break the symmetry and make one strategy more likely to be adopted. This is similar to the idea of a correlated equilibrium. Alternatively, we can model salience by having a small initial bias in the population toward one strategy (e.g., due to a mutation or environmental cue) that then gets amplified by the dynamics.

  ### Part 2: Test Case - Owner-Intruder Asymmetry

  In behavioral ecology, the owner-intruder asymmetry is modeled as a correlated equilibrium: individuals are assigned roles (owner or intruder) by an observable signal, and then they play a strategy that conditions on that role. The standard strategy is: if owner, escalate; if intruder, retreat. This is an equilibrium because, given the signal, each individual's strategy is a best response to the other's. The population evolves to this because it is an ESS (or a stable state under replicator dynamics) in the game with roles.

  **Question**: Would this count as a convention on our translation of Lewis?

  Let's check the components:

  1. **Recurring situation with multiple solutions**: The territorial contest is a recurring situation. There are two possible strict Nash equilibria in the correlated game: one where the owner wins and one where the intruder wins (if we flip the strategies). So there are multiple solutions.

  2. **Regularity in behavior**: In the population, nearly all individuals play the strategy: escalate when owner, retreat when intruder.

  3. **Preference conditional on conformity**: Given that almost everyone else follows this rule, an individual maximizes fitness by following it too (because if the opponent is likely to retreat when intruder and escalate when owner, then the best response is to do the same in each role). This is the condition for a correlated equilibrium.

  4. **Expectation and common knowledge**: 
     - In Lewis: Animals do not have beliefs or common knowledge. 
     - In EGT: The expectation is replaced by the correlation device (the role asymmetry) and the population state. The animal in the owner role expects the intruder to retreat (because that is what almost all intruders do) and vice versa. This expectation is built into the evolutionary stability: the strategy is stable because it is a best response to the population. Common knowledge is absent in the epistemic sense, but the role asymmetry is a public signal that correlates behavior. Thus, in the EGT translation, we have a substitute: the public signal (role) and the population state.

  5. **Arbitrariness**: There is an alternative: the intruder could always win. This alternative is also a correlated equilibrium. So arbitrariness is satisfied.

  6. **Precedent and salience**: The role asymmetry (owner vs. intruder) serves as the salient feature that breaks the symmetry and coordinates behavior. Precedent is established through evolution: once the population adopts one of the two conventions, it stays there.

  **Verdict**: The owner-intruder asymmetry is a convention by the EGT translation of Lewis. The key difference is that the epistemic conditions (expectation and common knowledge) are replaced by the public signal (the role) and the evolutionary stability (which ensures that the behavior is a best response to the population state). 

  So, has the field been using the word too loosely? Not necessarily. The EGT framework captures the functional essence of convention without requiring the cognitive machinery. However, Lewis's original account requires common knowledge and expectations, which are not present in the animals. Therefore, if we insist on Lewis's original epistemic conditions, then the owner-intruder asymmetry would not be a convention. But if we accept the EGT translation, then it is.

  This shows that the translation has bite: it forces us to decide whether we want to require the cognitive layer. The evolutionary reconstruction suggests that the cognitive layer is not necessary for the functional role of conventions. Thus, the field might be using a functional definition (which is appropriate for animals) while Lewis's account is more cognitive (aimed at human conventions).

  ### Part 3: Residue Report

  We now consider which parts of Lewis's account translate cleanly, which with distortion, and which not at all.

  1. **Epistemic conditions (common knowledge and expectations)**:
     - Translation: In EGT, these are replaced by the population state and the stability of the equilibrium. The population state is public and observable, so it serves as a substitute for common knowledge. Expectations are replaced by the actual frequencies of strategies in the population.
     - Verdict: This translates with distortion because we drop the cognitive layer. However, the functional role (that behavior is conditional on the expected behavior of others) is preserved. The residue (common knowledge as a cognitive state) is not captured. This suggests that Lewis's account added an epistemic layer that is not necessary for the evolutionary function of conventions. The evolutionary reconstruction shows that convention does not require common knowledge in the cognitive sense; public observability of behavior and evolutionary stability suffice.

  2. **Distinction between convention and mere behavioral regularity**:
     - Lewis: A convention must be arbitrary and sustained by the conditional preferences and common knowledge. A mere regularity (like driving on the right in the USA) might be a convention, but a regularity that is the only solution (or not arbitrary) or not sustained by conditional preferences is not.
     - EGT: We have the concept of an ESS. An ESS is a behavioral regularity that is stable against mutations. However, not every ESS is arbitrary: some games have only one ESS. So we can capture the arbitrariness condition by requiring that the game has at least two ESSs (with equivalent payoffs). But note: an ESS might be a unique equilibrium in a game, so it wouldn't be arbitrary. Also, a behavioral regularity that is not an ESS (like a neutrally stable strategy in a game with no better mutants) might be stable but not because of conditional preferences (it might be stable due to drift). 
     - Verdict: The distinction translates relatively cleanly. An ESS that is one of multiple strict ESSs in a coordination game is a convention. A mere regularity might be an ESS that is the only one (so not arbitrary) or a non-ESS stable state (e.g., due to drift). However, note that Lewis's condition of conditional preference is built into the ESS definition (the best response condition). So the framework can state the difference.

  3. **Room for reflection and deliberate switching**:
     - Lewis: Agents can reflect on their conventions and might abandon one or coordinate on switching to another (e.g., changing the driving side in Sweden). 
     - EGT: In a population of replicators, there is no reflection. The population moves between equilibria only by mutation and selection (or drift). So if we have a population at one ESS, it can only switch to another if a large enough mutation (or migration) occurs and then invades. There is no deliberate coordination to switch; it happens by the dynamics.
     - Verdict: This part does not translate. The evolutionary framework does not have a counterpart for deliberate reflection and switching. This residue marks something missing in the evolutionary framework: a model of how agents might intentionally coordinate on changing the convention. However, note that evolutionary models can be extended to include learning and cognition (e.g., through individual-based models with reinforcement learning). But in the basic replicator dynamics, it is absent.

  **Overall Verdict**:

  The evolutionary reconstruction shows that the core of convention (coordination on an arbitrary equilibrium sustained by conditional behavior) is captured without the epistemic layer. This suggests that Lewis's epistemic conditions are not necessary for the functional role of conventions in populations. However, the residue (deliberate reflection and switching) highlights a limitation of the evolutionary framework when applied to humans, who can reason about conventions and change them by agreement. 

  Thus, the evolutionary framework reveals that convention, as a stable behavioral pattern in a population, does not require common knowledge. But it also cannot capture the intentional aspect of human conventions. 

  Therefore, for theoretical biology (which often studies non-human animals), the EGT framework provides a valid and less cognitively demanding account of convention. But for human conventions that involve explicit reasoning and agreement, Lewis's account might still be needed.
answer: |-
  ### Restatement of Lewis's Account in Evolutionary Game Theory Vocabulary

  #### 1. **Recurring situation with multiplicity of solutions**
     - **Lewis**: A repeated interaction with multiple coordination equilibria (Nash equilibria where all players prefer conformity).
     - **EGT translation**: A symmetric coordination game (e.g., Hawk-Dove or Stag Hunt) with ≥2 strict Nash equilibria (or evolutionarily stable strategies, ESS). The "recurring situation" is modeled as repeated pairwise interactions in an infinite population. Multiplicity is captured by multiple ESSs (e.g., (A,A) and (B,B) in a pure coordination game).

  #### 2. **Conformity as preference conditional on others' conformity**
     - **Lewis**: Individuals prefer to conform if others do.
     - **EGT translation**: **Fitness interdependence**. A strategy \( S \) yields higher payoff when matched with itself than with alternatives. Formally, \( S \) is a strict Nash equilibrium: \( \pi(S,S) > \pi(S',S) \) for all mutants \( S' \neq S \). Conformity is evolutionarily stable if the population is monomorphic for \( S \), and deviations are invadable.

  #### 3. **Expectation and common knowledge**
     - **Lewis**: Common knowledge of conformity, expectations, and conditional preferences.
     - **EGT translation**: **Public observability of population state**. 
       - "Nearly everyone conforms" → Monomorphism (all players use \( S \)).
       - "Expectations of conformity" → Arises from **assortment** (non-random pairing) or **correlated encounters**. In replicator dynamics, players "expect" \( S \) because the population is monomorphic. 
       - **Common knowledge drops out**. Replaced by population-level stability: mutants cannot invade because they face \( S \) with probability 1. No epistemic states are modeled; stability emerges from dynamics.

  #### 4. **Arbitrariness**
     - **Lewis**: At least one alternative regularity could achieve coordination.
     - **EGT translation**: Existence of ≥2 ESSs with **equivalent payoffs** (e.g., both yield \( V \) in a coordination game). Arbitrariness is captured by **basins of attraction**: Initial conditions determine which ESS dominates, but fitnesses are symmetric.

  #### 5. **Precedent and salience**
     - **Lewis**: Precedent stabilizes conventions; salience (e.g., focal points) enables coordination.
     - **EGT translation**: 
       - **Precedent** → **Path dependence**. Replicator dynamics converge to an ESS based on initial strategy frequencies.
       - **Salience** → **Correlating devices** (e.g., observable asymmetries) or **mutant invasions**. Salient cues (e.g., owner-intruder roles) correlate behavior, acting as a symmetry-breaking mechanism.

  ---

  ### Test Case: Owner-Intruder Asymmetry
  **Biological account**: Territorial contests resolve via role asymmetry (owner wins). Modeled as a **correlated equilibrium** where roles (owner/intruder) are observable, and strategies are conditionally optimal (e.g., "escalate if owner, retreat if intruder").  
  **Is it a convention under EGT translation?**  
  - **Yes**, with qualifications:  
    - **Recurring situation/multiplicity**: Territorial contests are repeated; alternative conventions exist (e.g., "intruder wins").  
    - **Conditional conformity**: The strategy is conditionally optimal (ESS under role correlation).  
    - **Arbitrariness**: Both owner-wins and intruder-wins are valid ESSs.  
    - **Precedent/salience**: Role asymmetry acts as a correlating device (salience).  
  - **Epistemic gap**:  
    - Animals lack "expectations" or "common knowledge" in Lewis’s sense.  
    - **EGT resolves this**: Expectations are replaced by **evolutionarily stable conditional strategies** and **public role cues**. The population state (monomorphism for the role-conditional strategy) makes beliefs redundant.  
  **Verdict**:  
  - Your field uses "convention" correctly *functionally* (coordination on arbitrary equilibria via correlating devices).  
  - Lewis’s epistemic conditions are superfluous in EGT; the owner-intruder case **is a convention** under evolutionary reconstruction.  

  ---

  ### Residue Report: What Translates, What Distorts, What Vanishes

  #### 1. **Epistemic conditions (common knowledge, expectations)**  
     - **Verdict**: **Vanishes without residue**.  
       - Replicator dynamics require no beliefs or knowledge. "Common knowledge" is replaced by **public signals** (e.g., observable roles) and **population monomorphism**. The epistemic layer is scaffolding for rational-choice models; evolutionarily, it emerges from dynamics and correlated encounters.  

  #### 2. **Convention vs. mere behavioral regularity**  
     - **Lewis**: Conventions are arbitrary and preference-driven; regularities may lack alternatives/conditionality.  
     - **EGT translation**: An ESS is a convention if:  
       - (i) It is one of ≥2 strict ESSs (arbitrariness),  
       - (ii) Payoffs are symmetric (alternatives are equally efficient).  
     - **Distortion**: Some ESSs (e.g., unique equilibria) are not conventions. EGT *can* distinguish:  
       - **Convention**: ESS in a coordination game with multiple equilibria (e.g., driving side).  
       - **Mere regularity**: ESS in a game with one equilibrium (e.g., Prisoner’s Defection).  
     - **Verdict**: **Translates cleanly** with the above criteria.  

  #### 3. **Reflection and equilibrium switching**  
     - **Lewis**: Agents can intentionally abandon or switch conventions.  
     - **EGT**: Replicator dynamics lack agency; switches occur via **mutations/migration/drift** (e.g., a mutant invades if it enters the basin of another ESS).  
     - **Residue**: **No analogue for deliberation**. EGT cannot model:  
       - Collective reasoning ("Let’s switch to driving on the left").  
       - Normative judgments ("This convention is unfair").  
     - **Verdict**: **Lewis’s residue marks a gap in EGT**—it cannot capture intentional norm change. This requires cultural evolution (e.g., biased transmission) or bounded rationality models.  

  #### 4. **Costly signaling and asymmetric contests**  
     - **Lewis**: Not explicitly addressed, but signals could enable salience.  
     - **EGT**: Fits naturally. **Costly signaling** (e.g., Zahavi’s handicap) can stabilize conventions by making roles/commitments credible. **Asymmetric contests** (e.g., owner-intruder) are correlated equilibria.  
     - **Verdict**: **Translates cleanly**; signaling and correlation are core EGT tools.  

  ---

  ### Conclusion: What the Translation Reveals  
  - **Lewis’s epistemic layer is unnecessary** for evolutionary conventions. EGT shows conventions arise from:  
    - (1) Game structure (multiple ESSs),  
    - (2) Correlating devices (asymmetries/signals),  
    - (3) Evolutionary dynamics (replicator equations).  
  - **What EGT misses**:  
    - Deliberate convention switching (requires modeling agency).  
    - Normative content (e.g., conventions as "oughts").  
  - **What EGT clarifies**:  
    - "Common knowledge" is a proxy for **public information and monomorphism**.  
    - Lewis’s account is rationalistic; EGT exposes conventions as **emergent, population-level phenomena** without cognitive overhead.  

  **Final verdict**: Your framework captures the functional essence of conventions. Lewis’s epistemology is not earned—it’s a modeling choice for rational agents, not a necessary feature. The residue (deliberation, normativity) highlights limitations of replicator dynamics for human conventions but not for non-cognitive species.
