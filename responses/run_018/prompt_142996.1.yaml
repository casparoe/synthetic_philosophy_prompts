prompt: |-
  Having spent a career in experimental physics and only recently turned to philosophy, I am trying to navigate the conceptual landscape around the procreation asymmetry—the claim that there is a moral reason not to create lives destined for suffering, but no corresponding reason to create lives destined for happiness—without merely rehearsing familiar anti-natalist debates. I want an agenda, not a survey: which open questions, implications, or lines of theoretical work in this area matter most for a philosopher working alone, and why?

  Please focus on three specific problem clusters. First, whether the asymmetry can be sustained once one rejects person-affecting restrictions and allows comparisons of total or average welfare across merely possible populations. Second, whether the intuition behind the asymmetry tracks a genuine normative principle or is instead an evolutionary byproduct—an adaptive risk-aversion heuristic misapplied to reproductive decisions—and what methodological standards should govern that diagnosis. Third, whether formalizing non-existence as a null welfare baseline within decision theory resolves the non-identity problem or instead reveals that the asymmetry depends on a hidden modal commitment about what counts as harming a merely potential person.

  Rank these in order of priority for sustained philosophical work over the next few years, defending your ordering with explicit criteria: which question is upstream of the others, which is tractable without empirical laboratory resources, and what conceptual distinction or formal result would cause you to reorder them. I am allocating perhaps one semester of serious study, so frame this as resource allocation for a single researcher rather than a broad field.

  Conclude with a single-line summary of your defended agenda that begins exactly with the word Verdict:
