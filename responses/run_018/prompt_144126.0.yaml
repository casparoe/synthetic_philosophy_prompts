answer: |-
  This phenomenon is both perceptively observed and philosophically significant. While no single established term perfectly captures this *systemic* form of deception-through-true-statements, we can precisely define and name it by synthesizing relevant concepts.

  **Proposed Term: Systemic Contextual Deception (SCD)**

  **Definition:** Systemic Contextual Deception (SCD) occurs when a speaker, intending to induce a specific false belief in a listener:
  1.  **Employs Literal Truths:** Makes a series of individual assertions, each veridical (true) when considered in isolation.
  2.  **Engineers the Informational Environment:** Deliberately structures the *context* of communication (e.g., order of presentation, framing metaphors, selective emphasis, omission of contextually expected connective information, juxtaposition of facts) to create an inferential pathway.
  3.  **Generates Systemic Misleading:** Creates a situation where the *interaction* of the veridical statements *within the engineered context* predictably and non-accidentally leads a reasonable listener to form a specific false conclusion that is not logically entailed by any single statement or strictly required by the semantic content alone, but is strongly invited by the curated structure.
  4.  **Deflects Responsibility:** When challenged on the resulting false belief, disavows agency by retreating to the literal truth of individual statements, denying culpability for the listener's "misinterpretation" induced by the speaker's own contextual engineering.

  **Boundary Conditions & Distinctions:**

  1.  **vs. Lying (Classic Definition):**
      *   **Lying:** Requires asserting a proposition the speaker believes to be false.
      *   **SCD:** All individual propositions asserted are true. The deception arises not from falsity *within* propositions, but from the *structure and context* imposed *around* them. The falsity emerges at the level of the listener's synthesized understanding.

  2.  **vs. Simple Omission:**
      *   **Simple Omission:** Involves failing to provide relevant information, where the deception stems primarily from the *absence* of a key fact needed for a true belief. The listener might be misled by what *isn't* said.
      *   **SCD:** While omission *may* be one tool used, SCD is characterized by the *active construction* of a misleading context using *presented* true information. The deception arises from the *interaction and presentation* of the truths, not (solely or primarily) from a single critical absence. The speaker provides material, but structures it deceptively.

  3.  **vs. Paltering (or Simple Misleading Implicature):**
      *   **Paltering/Misleading Implicature:** Involves using a specific true statement (or omission) to generate a *specific* false conversational implicature (a meaning implied but not said). The misleading force is usually localized to a single utterance or a clear omission relative to a direct question/expectation.
      *   **SCD:** The deceptive force is *distributed* and *systemic*. It arises from the *cumulative effect* of multiple true statements presented within a carefully crafted contextual framework (order, framing metaphors, selective emphasis). No single utterance is typically ambiguous or generates the crucial implicature alone; the misleading inference emerges holistically from the *architecture* of the communication. It's the curated *whole* that misleads, not a specific part. The deflection strategy ("I only said true things") is also a core defining feature.

  4.  **vs. Spin/Framing:**
      *   **Spin/Framing:** Involves presenting true information in a way that favors a particular interpretation, often by emphasizing certain aspects and downplaying others. While ethically dubious, spin doesn't necessarily *engineer* a *specific false belief*; it might merely make a less favorable *true* belief more salient or obscure negative implications without inducing outright falsity. Listeners often recognize spin as persuasion.
      *   **SCD:** Actively aims to induce a *specific false belief* through contextual engineering, not just a biased perspective on true events. The structure is designed to make the false conclusion the most reasonable inference for the listener. The subsequent deflection distinguishes it further.

  5.  **vs. Bullshitting (Frankfurt):**
      *   **Bullshitting:** Characterized by a lack of concern for truth *altogether*. The bullshitter isn't necessarily *trying* to deceive about a specific fact; they are indifferent to truth values, focused only on effect.
      *   **SCD:** Requires meticulous attention to the *literal truth* of individual statements precisely to weaponize them within the deceptive contextual structure. The intent is specific deception, utilizing truth as a tool and shield.

  **Core Conceptual Elements of SCD:**

  *   **Intent to Deceive:** The speaker aims for the listener to form a specific false belief.
  *   **Veridical Components:** All individual assertions are true.
  *   **Contextual Engineering:** Deliberate manipulation of framing, order, emphasis, omission of expected connections, and metaphorical language to structure the informational environment.
  *   **Systemic Misleading:** The false belief is an emergent property of the true statements *interacting* within the engineered context; it is not located in any single component.
  *   **Predictability:** The false belief is a reasonable, non-accidental outcome for a competent listener operating within the engineered context.
  *   **Deflective Denial:** When confronted, the speaker denies deception by appealing *only* to the literal truth of the components, disavowing responsibility for the contextual structure they created.

  **Ethical Significance:** SCD is arguably as morally culpable as lying, and potentially more insidious. The speaker:
  *   Achieves the deceptive goal.
  *   Exploits the listener's reasonable inferential processes.
  *   Actively creates the conditions for misunderstanding.
  *   Evades accountability through semantic literalism and blame-shifting ("You inferred that, I didn't *say* it").
  *   Undermines trust by hiding behind technical truth while violating the cooperative spirit of communication (cf. Grice's Cooperative Principle and Maxims, especially Quality in spirit, Quantity, Relation, and Manner).

  Systemic Contextual Deception (SCD) precisely captures this sophisticated, structurally distributed form of deception-through-truth, marked by its reliance on engineered context, emergent misleading force, and deflective blame-shifting. It fills the conceptual gap you identified.
