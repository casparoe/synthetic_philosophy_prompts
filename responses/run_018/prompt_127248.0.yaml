answer: |-
  Alright, let's ditch the lukewarm coffee and map this jungle. Root question: **Does moral learning happen via *identification* (feeling *with* the subject) or *critical distance* (stepping back to compare/contrast)?**

  *   **Branch 1: Identification (Feeling it)**
      *   *Selection: Hidden* (Narrative feels whole)
          *   *Flaws: Hurt* (License vice): **Hagiographic Flattery Trap.** Awkward: Must pretend perfect virtue exists *and* that readers won't cynically notice the airbrushing.
          *   *Flaws: Help* (Credible stain): **Unnamed.** Awkward: Needs readers to deeply identify *while* simultaneously acknowledging the subject's ugliness – emotionally messy.
      *   *Selection: Transparent* (See the omissions)
          *   *Flaws: Hurt*: **Mimetic-Caution View (kinda).** Awkward: Reader identifies *and* sees curated dangers, risking paralysis – "if *they* failed, why try?"
          *   *Flaws: Help*: **Unnamed.** Awkward: Transparent curation + flaws *should* build critical thought, but the *identification* driver actively works *against* that distance. Tension city.
      *(Pairing largely irrelevant here – identification thrives on singular focus)*

  *   **Branch 2: Critical Distance (Thinking it)**
      *   *Selection: Hidden* (Narrative feels whole)
          *   *(Flaws irrelevant)* \+ *Single Life*: **INCOHERENT.** Can't demand critical distance while hiding the scaffolding. Reader's got nothing *to* compare against internally.
          *   *(Flaws irrelevant)* \+ *Paired Lives Essential*: **Paired-Comparison Virtue.** Awkward: Relies entirely on the *biographer's* chosen parallels being morally illuminating, not just clever or arbitrary.
      *   *Selection: Transparent* (See the omissions)
          *   *Flaws: Hurt* \+ *Single Life*: **Unnamed.** Awkward: Shows you the tools (gaps, vice) but denies you the main workshop (comparison). Feels incomplete.
          *   *Flaws: Hurt* \+ *Paired Essential*: **Critical Juxtaposition.** Awkward: Risks implying vice is *necessary* for the comparison to work, morally dubious.
          *   *Flaws: Help* (Stain) \+ *Single Life*: **Exemplar-with-Flaws.** Awkward: Hard to generate meaningful *distance* for moral reflection from just one, flawed life. Why *this* flaw? Compared to what ideal?
          *   *Flaws: Help* (Stain) \+ *Paired Essential*: **Plutarch's Gambit (Optimal?).** Awkward: Requires reader skill – can they *do* the comparative work effectively, or just see confusing contrasts? Heavy lifting demanded.

  **Empty Branch Alert:** `Critical Distance + Hidden Selection + Single Life` – Yeah, incoherent. How can you be critical if you don't see the seams *and* have nothing external to bounce it off? Nobody sane goes there. The `Identification + Transparent + Flaws Hurt` combo is also pretty desolate – why show me the dangerous omissions if you want me to *feel* uncritically? Not a popular spot.

  There's your tree. Now go argue about where Plutarch *really* sits. (Spoiler: He flirts with multiple branches, the slippery ancient.)
