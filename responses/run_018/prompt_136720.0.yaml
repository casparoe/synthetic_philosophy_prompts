prompt: |-
  You are the governance architect for a regional research consortium. Every month you evaluate proposals to replace a committee decision with a futarchic mechanism—stakeholders wager on outcomes, and the option with the best predicted performance on an agreed metric is adopted. Write a reusable decision procedure your staff can execute in forty-five minutes: an ordered sequence of gates, each with a precise question, the form of answer that permits passage, the conditions that trigger a hard stop (rejection), and the conditions that require escalation to a values committee because the issue is normative rather than empirical. Ground the gates in the actual mechanics of prediction-market governance—metric agreement, counterfactual resolution integrity (whether the outcome can be measured for the path actually taken without contamination from the betting mechanism itself), liquidity and expertise availability, Goodhart corruption risk, and the distinction between selecting an action to maximize a value and defining the value to be maximized—without requiring philosophical citation. Mark every point where judgment cannot be eliminated by procedure.

  Then run the procedure on three proposals: (a) selecting one of three climate-adaptation infrastructure grants by predicted ten-year flood-damage reduction in dollars; (b) adopting a mandatory negative-results publication policy evaluated by a predicted five-year peer-reputation index; and (c) procuring an internal data-platform vendor by predicted two-year system-downtime hours. One of these must yield an unwelcome result—either a hard stop or an escalation—explain which gate produces it, and show why the sponsor's preference cannot override that gate. Conclude by identifying two classes of institutional decision for which the procedure is structurally unsuited regardless of data quality.
reasoning: |-
  We are designing a decision procedure for evaluating proposals to replace committee decisions with futarchic mechanisms (prediction markets). The procedure must be executable in 45 minutes and consist of ordered gates. Each gate has:
  - A precise question
  - The form of answer that permits passage
  - Conditions for a hard stop (rejection)
  - Conditions that require escalation to a values committee (normative issues)

  The gates must be grounded in the mechanics of prediction-market governance, including:
  1. Metric agreement: Is there a clear, agreed-upon metric?
  2. Counterfactual resolution integrity: Can we measure the outcome without contamination from the betting mechanism?
  3. Liquidity and expertise availability: Are there enough informed traders?
  4. Goodhart corruption risk: Will optimizing the metric lead to undesired outcomes?
  5. Distinction between selecting an action (empirical) and defining the value (normative).

  Points where judgment is required must be marked.

  The procedure:

  **Gate 1: Metric Definition and Agreement**
  - **Question:** Is there a single, quantifiable, and objectively measurable metric that all stakeholders agree captures the desired outcome?
  - **Permissive Answer:** Yes, and the metric is clearly defined with a measurement methodology and timeframe.
  - **Hard Stop:** No, or the metric is ambiguous, subjective, or not agreed upon by key stakeholders.
  - **Escalation:** If defining the metric requires resolving a fundamental disagreement about what outcome is desirable (i.e., normative choices about values).
  - **Judgment:** Determining if the metric is "objectively measurable" and if stakeholders truly agree may require judgment.

  **Gate 2: Counterfactual Resolution Integrity**
  - **Question:** Can the outcome for the chosen option be measured without the prediction market itself influencing the result, and can we reliably estimate the outcome for the paths not taken?
  - **Permissive Answer:** Yes, because the outcome measurement is independent of the market (e.g., it's based on external data) and we have a method for counterfactual estimation (e.g., using control groups or validated models) that is feasible and accepted.
  - **Hard Stop:** 
     - The measurement is inherently contaminated by the market (e.g., if the metric is market liquidity, which the market itself affects).
     - Counterfactual estimation is impossible or prohibitively expensive (e.g., in unique, one-off decisions without a clear baseline).
  - **Escalation:** Not typically, unless the contamination issue is due to a normative choice about what to measure.
  - **Judgment:** Assessing the feasibility and reliability of counterfactual methods requires expert judgment.

  **Gate 3: Liquidity and Expertise Availability**
  - **Question:** Are there sufficient potential market participants with the expertise to predict the outcomes and the incentive to trade?
  - **Permissive Answer:** Yes, because the topic is within the domain of existing experts (internal or external) and there are enough of them to ensure a liquid market. We have a plan to incentivize participation (e.g., with real money or reputational points).
  - **Hard Stop:**
     - The topic is so specialized or novel that there are too few experts.
     - Incentives are insufficient to attract informed trading (e.g., if the stakes are too low or the topic is too obscure).
  - **Escalation:** Not applicable (this is an empirical issue).
  - **Judgment:** Estimating the number of experts and their willingness to participate requires judgment.

  **Gate 4: Goodhart Corruption Risk**
  - **Question:** Is the metric robust against gaming or perverse incentives such that optimizing for it won't undermine the intended goal?
  - **Permissive Answer:** The metric is known to be robust (e.g., it has been used successfully in similar contexts) or we have mitigation strategies (e.g., multiple metrics, audits, or a long enough time horizon to capture unintended consequences).
  - **Hard Stop:** 
     - The metric is easily gameable and there are no effective mitigations.
     - The metric is known to be corruptible (e.g., focusing on short-term gains at the expense of long-term sustainability).
  - **Escalation:** If the risk of corruption stems from conflicting values (e.g., if optimizing for one value necessarily harms another, and we must choose which value to prioritize).
  - **Judgment:** Assessing the risk of gaming and the effectiveness of mitigations requires judgment.

  **Gate 5: Normative/Empirical Distinction**
  - **Question:** Does the decision solely involve selecting the best means to achieve an agreed end (empirical), or does it require defining the ends (normative)?
  - **Permissive Answer:** The decision is purely empirical: we are choosing an action to maximize a pre-agreed value (the metric) and there is no dispute about the value itself.
  - **Hard Stop:** The decision is entirely about values (e.g., choosing which value to prioritize when they conflict) and there is no agreed metric. 
  - **Escalation:** The decision involves both empirical and normative elements, and we cannot cleanly separate them (e.g., if choosing the metric itself is contentious and requires a values judgment).
  - **Judgment:** Distinguishing between normative and empirical issues may be subjective.

  **Procedure Execution on Proposals:**

  **(a) Selecting one of three climate-adaptation infrastructure grants by predicted ten-year flood-damage reduction in dollars.**

  - **Gate 1:** 
     - Metric: Ten-year flood-damage reduction in dollars. 
     - This is quantifiable (dollars) and objective (if we have models to predict damage). 
     - Agreement: Likely agreed as reducing flood damage is a clear goal. 
     - **Pass.**

  - **Gate 2:** 
     - Counterfactual: We can model the flood damage with and without each grant using environmental models. The market won't affect flood damage. 
     - **Pass.**

  - **Gate 3:** 
     - Expertise: Hydrologists, climate scientists, and engineers can predict flood damage. There are enough experts and we can incentivize them. 
     - **Pass.**

  - **Gate 4:** 
     - Goodhart risk: Focusing solely on flood-damage reduction might lead to neglecting other environmental impacts (e.g., ecosystem damage) or social equity. However, if the grant's goal is solely flood-damage reduction and we are confident the models capture the full picture, then it might pass. But if the grants have multiple impacts, we risk optimizing one at the expense of others. 
     - **Judgment call:** This might require mitigation (e.g., adding constraints) or could be a pass if the scope is narrow. Let's assume we have a narrow scope and pass. But note: if the grants are complex and have multiple effects, we might need escalation. For simplicity, we'll say **Pass** with a note that if there are other important values, they should be included in the metric or constraints.

  - **Gate 5:** 
     - This is empirical: we are trying to maximize flood-damage reduction, an agreed value. 
     - **Pass.**

  **Result for (a): Approved.**

  **(b) Adopting a mandatory negative-results publication policy evaluated by a predicted five-year peer-reputation index.**

  - **Gate 1:** 
     - Metric: Five-year peer-reputation index. 
     - Is this quantifiable and objective? Reputation is often measured by surveys or indices (e.g., based on publication citations or expert opinions). But it might be subjective. 
     - Agreement: Stakeholders might disagree on whether reputation is the only goal (e.g., truth-seeking vs. reputation). 
     - **Hard Stop?** Not necessarily. We can define a specific index (e.g., an existing ranking). But if the index is not clearly defined and agreed, we might stop. Let's assume we have a specific index. **Conditional Pass** (with judgment).

  - **Gate 2:** 
     - Counterfactual: We need to measure the reputation index in 5 years. But the market itself might influence reputation (e.g., if the market predicts a decline, it might cause a decline). Also, we cannot run a counterfactual (what if we didn't adopt the policy) without a control group of similar institutions. 
     - **Hard Stop:** Because the market prediction might become self-fulfilling (if the market predicts a drop in reputation, it could cause a drop) and we lack a control group for the counterfactual. 
     - **Result: Hard Stop at Gate 2.**

  **Explanation for Hard Stop on (b):** The prediction market itself could contaminate the outcome (reputation). If traders predict a decline in reputation due to the policy, that prediction might leak and actually harm the institution's reputation. Also, we cannot reliably measure the counterfactual (what would have happened without the policy) because we don't have a parallel institution to use as a control. Therefore, we cannot ensure the resolution integrity.

  The sponsor cannot override because without counterfactual resolution integrity, the market's prediction cannot be validated, and the mechanism fails. This is a structural flaw.

  **(c) Procuring an internal data-platform vendor by predicted two-year system-downtime hours.**

  - **Gate 1:** 
     - Metric: Two-year system-downtime hours. 
     - This is objective and measurable (with monitoring tools). Agreement: Likely, as downtime is a key operational metric. 
     - **Pass.**

  - **Gate 2:** 
     - Counterfactual: We can measure downtime for the chosen vendor. But what about the counterfactual? We cannot know the downtime of the vendors we didn't choose. 
     - However, we can use historical data from other clients or benchmarks. If such data is available, then we can estimate. 
     - **Pass** (assuming we have reliable benchmarks).

  - **Gate 3:** 
     - Expertise: IT professionals and vendors' clients can predict downtime. There are many experts. 
     - **Pass.**

  - **Gate 4:** 
     - Goodhart risk: Optimizing for downtime might lead to neglecting other factors (e.g., cost, security, scalability). If the contract specifies penalties for downtime, the vendor might over-invest in redundancy at the expense of other features. 
     - **Escalation:** Because the decision of focusing solely on downtime is a value judgment (we might care about cost, security, etc.). This is a case of a missing normative agreement: we are defining the value (only downtime) but stakeholders might disagree. 
     - **Result: Escalate to values committee at Gate 4.**

  **Explanation for Escalation on (c):** The risk of Goodhart corruption is high because optimizing for downtime alone might lead to negative consequences in other areas. Moreover, the choice of focusing on downtime (and not including other metrics) is a normative decision about what we value. The values committee must decide if downtime is the only goal or if we need a multi-dimensional metric (or a trade-off).

  **Conclusion:**

  Two classes of institutional decisions for which the procedure is structurally unsuited:

  1. **Decisions involving fundamental value conflicts (normative decisions):** When the choice is about what we should value (e.g., setting ethical principles, defining the organization's mission) rather than how to achieve a pre-agreed value. These require deliberation and values-based reasoning, not prediction markets.

  2. **Decisions with inherently unmeasurable or unverifiable outcomes:** When the outcome cannot be objectively measured (e.g., artistic quality, employee morale) or when the counterfactual cannot be estimated (e.g., one-off strategic decisions without a clear baseline) and no proxy metric is available. Also, when the act of prediction itself changes the outcome (self-fulfilling or self-defeating prophecies) and we cannot isolate the effect.

  These are structural limitations because prediction markets require a measurable, uncontaminated outcome and an agreed metric to function.
answer: |-
  ### Reusable Decision Procedure for Futarchic Mechanism Proposals  
  **Time Limit:** 45 minutes (strictly enforced).  
  **Goal:** Evaluate whether a committee decision can be replaced by a futarchic mechanism (prediction market) where stakeholders wager on outcomes, and the option with the best-predicted performance on an agreed metric is adopted.  

  **Gates Overview:**  
  1. **Metric Definition & Agreement**  
  2. **Counterfactual Resolution Integrity**  
  3. **Liquidity & Expertise Feasibility**  
  4. **Goodhart Corruption Risk**  
  5. **Normative/Empirical Boundary**  

  ---  
  #### **Gate 1: Metric Definition & Agreement**  
  - **Precise Question:** "Is there a single, quantifiable, and objectively measurable metric capturing the desired outcome, with unanimous stakeholder agreement on its validity and measurement protocol?"  
  - **Permissive Answer:** Explicit "yes" with documented metric (e.g., "dollars of flood-damage reduction"), measurement methodology, and timeframe.  
  - **Hard Stop Trigger:** Metric is qualitative, multi-dimensional (e.g., "societal benefit"), or lacks stakeholder consensus.  
  - **Escalation Trigger:** Dispute over which metric reflects "success" (e.g., profit vs. equity).  
  - **Judgment Required:** Assessing if stakeholders *truly* agree (e.g., tacit dissent).  
  - **Mechanics Grounding:** Prediction markets require unambiguous metrics for resolution; vague metrics cause market failures.  

  #### **Gate 2: Counterfactual Resolution Integrity**  
  - **Precise Question:** "Can the outcome be measured for the chosen option without contamination from the betting mechanism, and can the counterfactual (outcome of non-chosen options) be credibly estimated?"  
  - **Permissive Answer:** "Yes" with evidence that measurement is isolated (e.g., third-party audits) and counterfactuals use validated models/historical data.  
  - **Hard Stop Trigger:** Outcome is self-influenced by the market (e.g., reputational metrics affected by betting) or counterfactuals are speculative (e.g., no comparable data).  
  - **Escalation Trigger:** None (purely empirical).  
  - **Judgment Required:** Evaluating contamination risks (e.g., market activity altering stakeholder behavior).  
  - **Mechanics Grounding:** Markets fail if outcomes cannot be resolved objectively or counterfactuals gamed (e.g., traders manipulate predictions).  

  #### **Gate 3: Liquidity & Expertise Feasibility**  
  - **Precise Question:** "Are there ≥50 credible, incentivized stakeholders with domain expertise to trade in the market, ensuring liquidity and informed predictions?"  
  - **Permissive Answer:** "Yes" with a list of stakeholders (e.g., researchers for science policies) and incentive plan (e.g., monetary rewards).  
  - **Hard Stop Trigger:** Fewer than 50 stakeholders, or expertise is inaccessible/niche (e.g., classified technology).  
  - **Escalation Trigger:** None.  
  - **Judgment Required:** Gauging stakeholder expertise and willingness (e.g., surveys may overstate participation).  
  - **Mechanics Grounding:** Thin markets yield noisy predictions; expertise ensures signal over noise.  

  #### **Gate 4: Goodhart Corruption Risk**  
  - **Precise Question:** "Is the metric robust to perverse incentives? Will optimizing it achieve the intended outcome without harmful side effects?"  
  - **Permissive Answer:** "Yes" with mitigations (e.g., multi-metric checks, long time horizons) or historical evidence of robustness.  
  - **Hard Stop Trigger:** Metric is easily gamed (e.g., downtime hours reduced by suppressing usage) with no mitigations.  
  - **Escalation Trigger:** Trade-offs between metrics reflect value conflicts (e.g., cost vs. ethics).  
  - **Judgment Required:** Balancing risk severity and mitigation feasibility.  
  - **Mechanics Grounding:** Markets optimize the metric, not the intent; Goodhart’s Law ("when a measure becomes a target, it ceases to be a good measure") risks distortion.  

  #### **Gate 5: Normative/Empirical Boundary**  
  - **Precise Question:** "Does this decision solely involve *maximizing an agreed value* (empirical), not *defining the value itself* (normative)?"  
  - **Permissive Answer:** "Empirical" with evidence the metric is predefined and fixed (e.g., "reduce flood damage").  
  - **Hard Stop Trigger:** Decision requires defining values (e.g., "what constitutes reputation?").  
  - **Escalation Trigger:** Ambiguity in whether metric selection is empirical or value-laden.  
  - **Judgment Required:** Distinguishing means (empirical) from ends (normative).  
  - **Mechanics Grounding:** Prediction markets handle empirical "what is" not normative "what ought to be."  

  ---  
  ### Procedure Execution on Proposals  
  **Proposal (a): Climate-adaptation grants by predicted 10-year flood-damage reduction (dollars)**  
  - **Gate 1:** Pass. Metric is quantifiable ($), agreed, measurable via flood models.  
  - **Gate 2:** Pass. Damage reduction is externally verifiable (e.g., insurance claims); counterfactuals use climate simulations.  
  - **Gate 3:** Pass. Hydrologists, engineers, and insurers (≥50) can trade; incentives feasible.  
  - **Gate 4:** Pass. Metric aligns with intent; side effects (e.g., ecosystem harm) are measurable and mitigable.  
  - **Gate 5:** Pass. Maximizing damage reduction is empirical.  
  - **Result:** Approved.  

  **Proposal (b): Mandatory negative-results policy evaluated by predicted 5-year peer-reputation index**  
  - **Gate 1:** Pass. Reputation index quantifiable (e.g., journal citations), but requires judgment on objectivity.  
  - **Gate 2:** **HARD STOP.** Reputation is contaminated by the market—traders’ bets may leak and influence peer perceptions (e.g., low predictions damage reputation). Counterfactuals (reputation under no policy) rely on untestable assumptions.  
  - **Result:** Rejected.  
  - **Why Sponsor Can’t Override:** Contamination violates prediction-market mechanics; no procedural fix exists. Override would invalidate outcome resolution.  

  **Proposal (c): Data-platform vendor by predicted 2-year system-downtime hours**  
  - **Gate 1:** Pass. Downtime hours are measurable (server logs).  
  - **Gate 2:** Pass. Downtime is externally tracked; counterfactuals use vendor SLA histories.  
  - **Gate 3:** Pass. IT staff and vendors (≥50) provide expertise.  
  - **Gate 4:** **ESCALATION.** Goodhart risk is high: optimizing for downtime may neglect security, cost, or usability (e.g., vendor minimizes downtime by blocking updates). Trade-offs between downtime and other values are normative.  
  - **Gate 5:** Escalation cascades from Gate 4.  
  - **Result:** Escalate to values committee.  
  - **Why Sponsor Can’t Override:** Ignoring Goodhart risks institutional harm; values committee must weigh trade-offs.  

  ---  
  ### Structurally Unsuitability Conclusion  
  **Two classes of decisions unsuitable for this procedure:**  
  1. **Value-Laden Decisions:** Choices requiring ethical, moral, or philosophical consensus (e.g., "Should we prioritize equity over efficiency?"). Markets cannot resolve normative disputes.  
  2. **Reflexive Decisions:** Outcomes inherently influenced by their own prediction (e.g., stock prices, public opinion). Contamination prevents clean resolution (Gate 2 failure).  

  **Rationale:** Prediction markets excel for empirical, measurable outcomes with low reflexivity. They fail when values dominate or the act of prediction alters reality.
