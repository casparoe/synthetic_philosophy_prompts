prompt: |-
  I teach a cross-cultural communication module at a business school in Rotterdam, usually to mixed groups of Dutch and Japanese participants, and I am putting together a short glossary of the things we keep stumbling over. There is one I have no vocabulary for, and my students argue about it every term in a way that suggests they sense a real distinction but cannot state it. Here are two instances. A Japanese host, at the end of a visit that has run long, says warmly that they really must do this again soon and will be in touch about dates; the Dutch guest says, good, shall we say the fourteenth; the room goes quiet; the host is now trapped between confirming a date they do not want and visibly retracting, and the guest looks either naive or aggressive. Notice three things: the host would be dismayed if the guest actually came to believe a date was coming, so this is not a matter of not caring whether it is true; the blame for the awkwardness seems to fall on the guest, who took the words at face value; and the host cannot clean it up by saying what they meant, because saying it would be the real offence. The second instance is the one I find harder. A Dutch manager, asked for a reaction to a junior's draft, says flatly and in front of the team that the proposal is weak and should be rewritten from scratch. The Japanese junior is not surprised by the assessment — they had already worked out that the draft was weak — and is not, I think, hurt by the content. What upsets them is that it was said out loud, in that form, there. When I ask the Dutch participants to soften it, they protest that softening would be the deeper insult, since it would imply the junior cannot take the truth. So here the surface form is a blunt truth rather than a transparent falsehood, and yet it seems to have the same three-part shape: what is to be taken up is not what the words literally offer, the hearer who takes up the wrong thing gets blamed, and repairing things by making them explicit somehow makes them worse.

  What I keep circling is this: an utterance whose literal content is not what is meant to be taken up, a convention that fixes the correct uptake, blame falling on whoever takes the literal content at face value, and a version in so many words that is itself an offence — so that what is intended can travel only by indirection, and remains oddly unavailable to be said. I have tried to borrow from things I have read about and none of them fits. It is not lying in the ordinary sense, because nobody is supposed to be deceived. It is not what the much-discussed essay about speakers who are indifferent to whether what they say is true describes either, because these speakers care a great deal and would be upset to be believed. It is not the sort of case philosophers like, where someone says something everyone can see is false in order to show they can get away with it, because nothing is being asserted over anybody here. And it is not just the ordinary indirection of the can-you-reach-the-salt variety, because that decodes automatically, carries no sting, and has a perfectly acceptable explicit paraphrase, whereas here the explicit paraphrase is the one thing you may not produce.

  So: is there an established concept, or a literature, for this configuration — and if the nearest concepts only fit imperfectly, I would rather have the comparisons than a name, since what I need for the glossary is the carving rather than the label. In particular I would like to know what exactly the phenomenon is, what it is not, and where it stops. Two boundary cases I cannot place myself: a hearer who does not share the convention at all, such as a visiting American, a ten-year-old, or a machine transcript that will simply store the sentence — does the utterance become a lie, a failed ritual, or something else, and does the answer depend on whether the speaker knew the hearer was outside the convention? And the half-hearted case, where the speaker would in fact be mildly pleased if the invitation were taken up but does not expect it to be: at what point does the phenomenon dissolve into an ordinary, if vague, invitation? A third case I would like put on one side or the other is the written one, where a warm we should certainly continue this conversation in an email is later read literally by a third party who has no stake in the convention, say in a contract dispute. I am not after references or a reading list — I cannot chase them from here, and a label I cannot define for my students would not help. What I want is a definition sharp enough that I can tell, for each of those three cases, which side of the line it falls on and why.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They teach cross-cultural communication between Dutch and Japanese participants in Rotterdam. The core issue is this recurring misunderstanding where the literal meaning of an utterance isn't what's intended, and explicit clarification makes things worse. They've provided two clear examples: the false invitation and the blunt feedback. 

  Hmm, the user's frustration is palpable. They've tried existing frameworks—lying, bullshitting, indirect speech acts—but nothing fits. The key nuances are: the speaker cares about truth but can't be literal, the hearer gets blamed for taking words at face value, and spelling it out causes offense. This feels like a deep cultural communication pattern, not just politeness.

  First, I need to isolate what makes this phenomenon unique. The Japanese "we must do this again" isn't a lie because the host doesn't want the guest deceived. It's not bullshit either (à la Frankfurt) because truth matters deeply. The Dutch bluntness case is fascinating too—softening the feedback feels like an insult to them, while the Japanese find the directness offensive. Both sides think they're being ethical, just different ethics.

  Ah! This screams "face-work" (Goffman) and "negative politeness" (Brown & Levinson). But the user already knows politeness theory. What's missing is how these acts become *obligatory rituals* with moral weight. The Dutch see indirectness as insincerity; the Japanese see directness as cruelty. The taboo on explicitness is key—saying the quiet part aloud destroys the social fiction.

  For the glossary, "ritual fiction" might work. It captures the staged, conventional nature where both parties collude in maintaining appearances. The boundary cases help test this: 
  - For outsiders like Americans or kids, it's just words—no shared fiction, so no blame. 
  - The half-hearted invitation? Once sincerity creeps in, it's hybrid—part ritual, part genuine. 
  - Written records? Without collusion, it's evidence of a statement, but the ritual context is stripped away.

  The user needs surgical precision, not labels. So defining the necessary conditions: 
  1. Conventional indirection as social requirement 
  2. Literal uptake violates norms 
  3. Repair via explicitation causes greater offense 
  4. Shared cultural knowledge assumed 

  Nailing the "why it stops being this phenomenon" matters too. If the Dutch manager softened feedback to "perhaps reconsider the approach," it might still offend the Dutch ethos of clarity. But if they said "this is unsalvageable garbage," that's just cruelty, not ritual. The line is whether the form follows cultural scripts for protection vs. harm.

  Finally, the user's real goal is classroom clarity. They need framing that prevents Dutch-Japanese stalemates. Emphasizing that both sides are upholding values—harmony vs. honesty—could foster mutual respect over frustration. The term "ritual fiction" might bridge that, showing the shared human need for social scaffolding, even when the scaffolds differ.
answer: |-
  This phenomenon is **ritual fiction**—a culturally mandated utterance where literal meaning is irrelevant, correct uptake relies on shared convention, literal interpretation is sanctioned, and explicit articulation violates the very norms it embodies. Below is a dissection for your glossary, with boundary tests:

  ### Core Definition
  **Ritual Fiction**:  
  A conventionalized speech act where:  
  1. **Literal content is decoupled from intent**: Words are not meant to be believed or acted upon literally (e.g., "We must meet soon" as closure ritual).  
  2. **Uptake is governed by unwritten rules**: Correct interpretation depends on cultural fluency, not linguistic decoding.  
  3. **Literal uptake incurs blame**: The hearer is at fault for misreading context, not the speaker for obscurity.  
  4. **Explicit repair is taboo**: Voicing the subtext ("I said that to be polite, not literally") destroys the social fiction and causes greater offense.  

  ### Key Distinctions  
  | Concept             | Why It Doesn’t Fit                                  |  
  |---------------------|-----------------------------------------------------|  
  | **Lying**           | No intent to deceive; speaker expects *not* to be believed. |  
  | **Bullshitting**    | Speaker cares deeply about truth/consequences (Frankfurt’s "indifference to truth" absent). |  
  | **Indirect Speech** | No clear "decoding" (e.g., "Can you pass salt?" → literal refusal is absurd). Here, literal acceptance *is* possible but punished. |  
  | **Irony/Sarcasm**   | Relies on tone/contextual cues; ritual fiction lacks signaling and has moral weight. |  

  ### Boundary Cases Resolved  
  1. **Outsider (American/child/AI transcript)**:  
     - **Status**: Failed ritual, not a lie.  
     - **Why**: Speaker’s intent remains the same (social lubrication), but convention isn’t shared. Blame shifts: if the speaker *knew* the hearer lacked context, the speaker bears responsibility for the awkwardness. Otherwise, it’s cross-cultural misalignment.  

  2. **Half-hearted invitation ("mildly pleased if accepted")**:  
     - **Status**: Hybrid case; dissolves into ritual fiction *if* ambiguity is required.  
     - **Test**: If declining the date causes no offense, it’s a genuine but vague invitation. If declining *must* be graceful (to save face), it’s ritual fiction. The Dutch guest’s push for a date forces a binary choice—this violates the ritual.  

  3. **Written record (email in contract dispute)**:  
     - **Status**: Literal text ≠ ritual fiction.  
     - **Why**: Ritual fiction requires co-present participants and real-time face dynamics. Written words lack the "performance" context, becoming mere evidence of a statement—vulnerable to literal interpretation without cultural guardrails.  

  ### Why "Ritual Fiction" Fits Your Cases  
  - **Japanese host**: "We must meet soon" is a **separation ritual**, signaling warmth while ending the interaction. The Dutch guest’s literalism ignores the performative context.  
  - **Dutch manager**: Blunt feedback is a **hierarchy ritual**, displaying honesty as respect for competence. Softening implies the junior is fragile—a deeper insult in directness cultures.  

  ### Mechanism Explained  
  Ritual fiction operates through **collusive pretense**:  
  - Both parties tacitly agree to treat the utterance *as if* it were literal, while knowing it is not.  
  - Breaking the pretense (via literalism or explanation) exposes the underlying fiction, causing shame or aggression.  
  - **Cultural roots**:  
    - **Japan**: *Tatemae* (public facade) vs. *Honne* (private truth); directness risks *hazukashii* (embarrassment).  
    - **Netherlands**: *Doordrammen* (persistence as virtue); indirectness implies *onoprecht* (insincerity).  

  ### Teaching Application  
  - **Glossary Entry**:  
  > **Ritual Fiction**: A formulaic statement where words serve social bonding or hierarchy maintenance, not factual communication. Taking it literally breaches etiquette; explaining it breaches trust. *Examples: Politeness formulas ("We should meet soon"), blunt feedback in flat hierarchies.*  
  >  
  > **Boundary Note**: Fails if context is missing (e.g., emails, outsiders); becomes literal if sincerity overrides convention.  

  This frames clashes not as "lies vs. rudeness" but as **collision of social grammars**, where both sides defend their rituals as moral imperatives. By defining the mechanism, you equip students to diagnose rather than debate.
