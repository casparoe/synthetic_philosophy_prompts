answer: |-
  The relationship between pragmatic encroachment and epistemic contextualism reveals a deep tension when combined, stemming from their distinct loci of contextual variation. Here's a breakdown of the conceptual mechanics and their interplay:

  ### Core Concepts & Tension Source
  1. **Pragmatic Encroachment (PE):**  
     Knowledge depends on the **subject's practical context** (stakes/cost of error). If S faces high stakes, S might not know *p* even with evidence sufficient for knowledge in low stakes. PE directly ties knowledge *itself* (the state) to practical factors.

  2. **Epistemic Contextualism (EC):**  
     The truth-value of "S knows *p*" depends on the **attributor's conversational context** (salience of error possibilities). In a "low standards" context, "S knows *p*" may be true; in a "high standards" context, false—*even if S's evidence and practical situation are identical*. EC changes the *meaning* of "knows."

  **The Tension:** PE varies the *knowledge state* with the **subject's context**, while EC varies the *truth-conditions of knowledge attributions* with the **attributor's context**. Holding both implies two independent contextual levers governing a single knowledge-ascription.

  ---

  ### Testing Conceptual Separation
  Can we isolate stakes to the subject's context and salience to the attributor's? Consider the scenario:  
  - **Subject (S):** High stakes (e.g., betting life savings on a train departure time).  
  - **Attributor (A):** Low-salience context (casually discussing trains; error possibilities ignored).

  #### Implications:
  1. **PE's Claim:** S's high stakes mean S **lacks knowledge** (regardless of A's context).  
  2. **EC's Claim:** In A's low-standards context, "S knows *p*" is **true**.  

  **Result:** A can *truly say* "S knows *p*" (per EC), yet S *actually lacks knowledge* (per PE). This violates the intuitive principle: **If S knows *p*, then "S knows *p*" should be assertible; if S doesn’t know, it shouldn’t.** The theories generate a contradiction for the same proposition in the same world.

  ---

  ### Collapse vs. Independence
  1. **Collapse Risk:**  
     If stakes *must* be part of the attributor's context for EC to "track" PE (e.g., A must consider S's stakes to set standards), then PE is **redundant**—it reduces to a factor in EC. But this undermines PE's core claim: that stakes *directly* affect S's epistemic state, not just attribution.  
     - *Problem:* PE insists knowledge is *intrinsically* stake-sensitive. Absorbing stakes into EC demotes PE to a conversational heuristic.

  2. **Independence Problem:**  
     If stakes operate independently (affecting S's state irrespective of A's context), then:  
     - **S lacks knowledge** (high stakes) → **A's assertion "S knows" is false** (since S doesn’t know).  
     But EC says A's assertion is *true* in their low-salience context. **Contradiction persists.**  
     - *Thus:* PE cannot be a "special case" of EC. It asserts a *metaphysical* claim about knowledge, while EC is *semantic*.

  ---

  ### Resolving the Tension?
  Three possible outcomes emerge:
  1. **Redundancy:** If stakes are *just another factor* in setting the attributor's conversational standards, PE adds nothing to EC. EC alone handles stakes via context-sensitivity.  
     - *Cost:* Abandons PE’s thesis that practical stakes *constitutively* impact knowledge.

  2. **Instability:** Holding both leads to contradictions (as in the scenario). The theories are **logically incompatible** when stakes and salience diverge.  
     - *Mechanism:* PE fixes the extension of "knowledge" (S has it or not), while EC allows the *predicate* "knows" to shift its extension relative to A’s context. When contexts misalign, truth-values conflict.

  3. **Complementarity (Conditional):**  
     - **Option A:** Restrict PE to the *subject's self-ascription*. S’s own stakes affect whether S knows, but third-party attributions follow EC.  
       *Problem:* Makes knowledge "perspectivally fragmented" – S doesn’t know, but others can truthfully say S knows.  
     - **Option B:** Let EC’s standards *be sensitive to S’s stakes*. A’s context must incorporate S’s practical situation to set the threshold.  
       *This resolves the scenario:* High stakes for S raise A’s standards (even if A is casual), making "S knows *p*" false in A’s context.  
       *Cost:* EC loses its "conversational" purity; standards are now partly objective/fixed by S’s situation.

  ---

  ### Conclusion: Instability Dominates
  The tension exposes **fundamental incompatibility**. PE asserts that knowledge *itself* is stake-relative; EC asserts that "knows" is attribution-relative. When the subject’s stakes and attributor’s salience diverge:  
  - PE demands that S’s knowledge-status is **fixed by S’s context**.  
  - EC demands that the truth of "S knows" is **fixed by A’s context**.  

  **Result:** The two mechanisms cannot be fully separated without contradiction, nor cleanly collapsed without sacrificing one doctrine’s core commitment. Pragmatic encroachment, by making knowledge *metaphysically* dependent on practical factors, resists absorption into contextualism’s *semantic* framework. Unless one treats S’s stakes as *necessarily relevant* to the attributor’s context (undermining EC’s conversational autonomy), combining the views generates instability. This suggests they represent competing—not complementary—accounts of contextual variation in epistemology.
