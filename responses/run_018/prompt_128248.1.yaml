  **Principle 2: Computational-Reduction Principle**
  - If a cognitive process, even if it doesn't resemble the typical conscious steps of an existing pramāṇa, can be explained as a compressed or non-conscious version of an existing pramāṇa (like inference), then it should be reduced to that existing pramāṇa.
  - Example: 
    - Rapid intuitive detection of logical contradiction → compressed anumāna (inference).

