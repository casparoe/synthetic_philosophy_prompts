  But note, in the MRI case, the image is a representation of the body's interior. The device in the hypothetical case is creating a model that is not a direct representation but a reconstruction. This might be a gray area. However, if we stick to Principle 1: if there is a sensory experience that is caused (via a chain) by the object, then it is pratyakṣa. The light from the galaxy is the cause, and the device is just an extension. But the device is doing more than just extending; it is constructing a model. 

