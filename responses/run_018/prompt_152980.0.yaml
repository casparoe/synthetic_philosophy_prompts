  I'm writting this up for a cooperative-game-theory seminar I'm taking, and my prof Dr. Voss keeps ruling on these hypothetical division disputes using what she calls her "monotonic aspiration rule" — I'm definatly sure she's describing the Kalai-Smorodinsky solution but she never actually names it, which is driving me nuts. She's handed down four verdicts so far, and now I'm trying to figure out what she'd do with a weird three-party edge case I cooked up. I want you to take a real stand here — don't just list possibilities and leave me to pick — and write in American English, no citations or reading lists please, I just need the reasoning.

  Case one: two partners with identical fallback positions ($10k each) and identical best-case solo outputs ($100k each). Together they can make $180k. She split the surplus perfectly evenly — symmetry gets equality, no surprises.

  Case two: Partner A has fallback $10k and solo max $120k; Partner B has fallback $20k and solo max $80k; joint pie is still $180k. She gave A the lion's share of the surplus, scaled so that A's gain over fallback is proportionally larger because A's aspiration range ($110k vs B's $60k) is wider. B still ends up better than B's fallback, but noticeably less than A despite B's higher outside option.

  Case three: The joint pie expands to $240k because they share equipment, but both individual ranges stay the same. She said both partners do strictly better in absolute terms, with A's gain going up more than B's, yet the ratio of their surplus shares stays locked. She was adamant that expanding the pie can't hurt either party — classic individual monotonicity.

  Case four: B's solo max drops to $60k because B lost a grant, so B's range shrinks to $40k, but A's range and the joint pie ($180k) are unchanged. Even though B's actual contribution hasn't changed, she said B should do worse than in case two and A should do better. She said the reference point moved, not the contribution.

  So she clearly weights outcomes by aspiration-range ratios and respects monotonicity in both directions. But I'm not convinced she's running pure Kalai-Smorodinsky — she might be running a weighted Nash product with outside options, or some risk-adjusted hybrid. Here's the new case: a third partner C enters with fallback $0 and solo max $30k. The three-way joint feasible set allows $180k total, but there's a veto constraint — if C gets less than $15k the deal collapses because C holds a shared license. A and B's ranges are unchanged from case three ($10k-$120k and $20k-$80k). Would Dr. Voss preserve the same pairwise surplus ratio between A and B that she used in case three, or adjust them downward proportionally to accommodate C's floor? Would B take a bigger hit because B's range is narrower? Or does the veto turn this into a completely different problem?

  Lay out the competing rules that fit her first four verdicts — at least two plausible ones — and say exactly what each predicts for A, B, and C here. Then commit: what's your best guess for her actual ruling, name the closest analog from cases 1-4, and state the principle she's adopting either way. Finally, tell me the single further case that would best distinguish pure KS with an added veto constraint from weighted Nash bargaining with outside options. Don't hedge.
