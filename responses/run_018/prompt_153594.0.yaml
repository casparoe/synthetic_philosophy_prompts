  ## Research Proposal: The Editorial Locus Problem in Dennett's Multiple Drafts Model

  **Title:** Micro-Theaters or Mechanism? Testing the Implicit Spatiotemporal Locus of Draft Stabilization in Dennett's Model.

  **1. Core Research Question:**
  Does Daniel Dennett's Multiple Drafts Model (MDM), in its account of the *editorial process* that selects and stabilizes a dominant "draft" of conscious content, implicitly require a functional spatiotemporal locus (e.g., distributed micro-theaters, transient binding events) for this selection/stabilization to occur, thereby undermining its core rejection of the Cartesian Theater? Can the model provide a coherent account of draft dominance *without* any such locus, even implicitly?

  **2. The Conceptual Gap in Standard Treatments:**
  Dennett forcefully rejects the Cartesian Theater – the idea of a central place and time where "it all comes together" for conscious experience (CT). The MDM posits parallel, competitive processes ("multiple drafts") distributed across the brain, with no central audience. *However, standard critiques and defenses focus primarily on the "audience" aspect and the *existence* of a final draft.* **The crucial gap lies in the *mechanism of editorial selection and stabilization*:** How does one draft achieve dominance over others at a given moment? Dennett describes this as a process of "cerebral celebrity" or "influence," but remains vague on its *operational architecture*. The question is whether describing this selection/stabilization *process itself* inevitably smuggles in functional equivalents to localized CT features (e.g., a convergence zone, a binding window, a privileged temporal moment for decision) – not as an audience, but as a necessary *stage for the editorial competition*. This gap is often overlooked because the focus is on denying the *output* (a unified show) rather than scrutinizing the *requirements of the competitive process* leading to that output.

  **3. Approach: Leveraging Test Cases for Mechanism (Not Experience):**
  This study employs two phenomena not as *direct evidence* for conscious content, but as **conceptual test cases** probing the *minimal requirements* for draft stabilization, focusing on spatio-temporal unity:
      *   **Split-Brain Phenomena:** Analysis focuses on the *editorial dynamics within and between hemispheres*. Does the independent stabilization of coherent drafts *within* each isolated hemisphere imply a functional "micro-theater" localized to each hemisphere's processing streams? Or can MDM explain the *simultaneous existence and stability* of two distinct dominant drafts without invoking *any* localized convergence locus within each hemisphere? The key is the *mechanism of stabilization within a processing stream* severed from the other.
      *   **Temporal Dynamics of Change Blindness:** Analysis focuses on the *time course of draft revision and stabilization* when a change is detected after a delay. Does the transition from the "blind" draft to the "seeing" draft require a specific temporal window or locus where the mismatch is resolved and the new draft is cemented? Or can MDM account for this transition purely through distributed, asynchronous competition with *no privileged moment or place* where the "edit" is finalized? The key is the *mechanism of destabilizing one draft and stabilizing its successor*.

  **Method:** Rigorous conceptual analysis of primary texts (Dennett's *Consciousness Explained*, *Sweet Dreams*, relevant papers) focusing on descriptions of the editorial process. Application of the split-brain and change blindness cases to stress-test these descriptions. Critical engagement with secondary literature specifically addressing the "binding problem" or "unity of consciousness" within MDM. **Crucially, neuroscience data on these phenomena serves *only* to establish the *empirical constraints* (e.g., hemispheric independence, temporal delays) within which the conceptual model must operate, not as the primary source of argument.**

  **4. Defining Success and Failure:**
  *   **Successful Result:** A coherent, non-circular account is articulated demonstrating how editorial selection and stabilization can occur *purely* through distributed, asynchronous competitive processes ("pandemonium") with *no* functional requirement for:
      *   A privileged spatial locus (even distributed micro-theaters).
      *   A privileged temporal moment for "finalization."
      *   A binding mechanism beyond the competitive outcome itself.
      Success means showing the MDM genuinely escapes the need for *any* functional theater, even in the editorial core.
  *   **Failure Result:** The analysis reveals that Dennett's descriptions of editorial selection/stabilization either:
      1.  **Entail Circularity:** Invoke the *outcome* of stabilization (e.g., "the most influential draft") as the *explanation* for the process, without independent specification of the mechanism.
      2.  **Generate Infinite Regress:** Posits an "editor" process selecting drafts, which itself requires selection/stabilization, leading to an infinite regress of editors.
      3.  **Require Implicit Locus:** Necessarily relies on functional equivalents of localized binding events, convergence zones, or temporal windows ("micro-theaters") within the described mechanisms, contradicting the spirit of rejecting CT.
      Failure demonstrates a fundamental conceptual limitation in the MDM's ability to fully escape the functional architecture it seeks to deny.

  **5. Feasibility Assessment (12 Weeks):**
  This project is **rigorously feasible** within a 12-week high school independent study framework, provided the scope remains tightly **conceptual**, for the following reasons:
  *   **Focused Question:** The question is sharply defined, targeting a specific conceptual gap within a well-defined model.
  *   **Conceptual Core:** The primary work is philosophical analysis of texts and logical argumentation, not empirical data collection or broad neuroscience review.
  *   **Leveraging Constraint Cases:** Split-brain and change blindness serve as *established, well-documented constraints* for testing the model's coherence, requiring understanding their phenomenology and relevant data *only to the extent necessary* to apply the conceptual test (e.g., knowing hemispheres can stabilize independent percepts, knowing change detection has a variable latency).
  *   **Avoiding Neuroscience Survey:** Neuroscience is used solely to define the boundary conditions of the test cases, not as the subject of investigation. The student supplies key references, eliminating the need for broad literature review.
  *   **Clear Deliverable:** The outcome is a conceptual argument (presented in a final paper) answering the core question based on textual analysis and application of the test cases, assessing success/failure as defined.
  *   **Honest Challenge:** The main risk is navigating complex philosophical arguments without getting lost in tangential debates. The key to success is **relentless focus** on the editorial selection/stabilization mechanism and the specific test cases. The argument is most likely to break if the analysis of the editorial process in Dennett remains superficial, or if the application of the test cases fails to genuinely probe the requirement for a spatio-temporal locus.

  **Conclusion:**
  This proposal targets a critical but under-examined vulnerability in Dennett's influential Multiple Drafts Model: the mechanism by which one draft achieves dominance. By rigorously analyzing whether the *editorial process itself* requires functional equivalents of the Cartesian Theater it rejects – using split-brain independence and change blindness dynamics as conceptual test cases – this study aims to determine if the MDM offers a truly non-theatrical account of consciousness or harbors a hidden circularity or regress. The project is designed for focused conceptual analysis achievable within a semester.
