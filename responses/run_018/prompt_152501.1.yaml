  But the Doomsday Machine is trickier. When Strangelove explains its automated retaliation, Anscombe might argue the original designers directly intended civilian annihilation as deterrent - making them murderers. Yet the film shows the system operating without human agents later (that chilling shot of the bomber pilot riding the bomb). Here Kubrick pushes beyond Anscombe: the absurdity isn't just about intention, but about responsibility dissolving in bureaucracy. 

