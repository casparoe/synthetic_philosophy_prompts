  The method would be conceptual analysis plus a close comparison of Brouwer's writings on choice sequences and formalism with Dummett's anti-realist arguments, but I'm not asking you to include citations or a bibliography — I'll fill those in myself. I need the proposal to state the question precisely, explain why the existing epistemic-vs-ontological framing doesn't settle it, lay out a month-by-month plan (probably first month on the two theses, second on the texts, third on writing up), say what counts as success versus failure (failure might be that the two theses collapse into each other, or that I can't actually apply the split to explain LEM rejection), and give an honest assessment of scope — my roommate thinks this sounds like renaming old distinctions, so I should also address why it's not redundant. There might be a typo or two in this message but I think you get the idea.
