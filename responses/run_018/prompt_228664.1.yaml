prompt: |-
  I teach in a philosophy department, and next semester I am responsible for one ninety-minute session of an interdisciplinary graduate seminar on rational agency, co-taught with an economist. The students come from economics, political science, and cognitive science; they are fluent in utility maximization and game theory but have no training in the philosophy of action. My session is on Kavka's toxin puzzle (Gregory S. Kavka, "The Toxin Puzzle," Analysis, 1983), and I want the session to turn on a passage from David Gauthier's response to the puzzle ("Assure and Threaten," Ethics, 1994), in which Gauthier defends the rationality of following through on a rationally formed intention:

  "The rational outcome of your deliberation tomorrow morning is the action that will be part of your life going as well as possible, subject to the constraint that it be compatible with your commitment—in this case, compatible with the sincere intention that you form today to drink the toxin. And so the rational action is to drink the toxin."

  Do not give me the lecture; give me the plan for it. Specifically: (1) The order in which the pieces must go. My own view is that the distinction between reasons to act and reasons to intend has to be secured before the case is even stated, since otherwise these students hear the setup as a puzzle about poison and money rather than about what can be intended — but tell me whether that dependency is right, and what else must be in place before the Gauthier passage can be put on the table rather than merely quoted at them. (2) The carrying example. I do not want to run the whole session on the toxin case itself, because the vial and the billionaire invite showmanship; specify one mundane preparatory case, state what structural features it must share with the toxin case (reward keyed to the intending rather than the doing; a later choice that is transparent and incentive-free) and what it must lack (an external predictor, self-deception, the option of forgetting), and explain why the obvious candidate — resolving tonight to get up at six and run — smuggles in weakness of will and so teaches the wrong lesson. (3) The misconceptions, in the order this particular audience will produce them, with the point in the sequence at which each should be headed off: that the puzzle is ordinary time-inconsistency and a commitment device fixes it; that it is a re-run of Newcomb's problem; that an intention is just a strong desire or a decision to try; and, once the passage is on the table, that Gauthier has dissolved the puzzle by showing drinking to be rational — when the contested move is his quiet phrase "sincere intention that you form today," which assumes precisely what Kavka argues a clear-eyed agent cannot bring about. (4) A closing check that would show the idea has landed rather than been memorized: I am imagining handing them modified versions of the case — the payout depends on actually drinking; the toxin is painless; a hypnotist can install the intention for a fee — and asking which modifications dissolve the puzzle and which merely relocate it. Tell me what their answers should look like if the session worked. (5) What I should openly refuse to cover at this level: the experimental literature on whether people can in fact form such intentions, and the puzzle's origins in nuclear deterrence theory, both of which I would flag as provenance and then set aside.
reasoning: |-
  Okay, the user is a philosophy professor preparing a session on Kavka's toxin puzzle for an interdisciplinary graduate seminar. They want to focus on Gauthier's solution but need a structured lesson plan. Let me break down their specific requests.

  First, they emphasize establishing the distinction between reasons to act and reasons to intend before introducing the toxin case. That makes sense because economists might conflate intention with action or see it merely as precommitment. I should suggest starting with a mundane example to illustrate this separation. The library book scenario seems ideal—returning a book benefits the friend, but the intention itself isn't incentivized. This avoids complications like weakness of will in the running example.

  For the toxin case setup, the key is highlighting that the billionaire rewards the intention formation, not the action. Students might initially miss this, so emphasizing "sincere intention" is crucial. Gauthier's passage should come after clarifying this distinction, otherwise they'll miss why forming the intention is the puzzle.

  Next, addressing misconceptions in order. Economists might jump to commitment devices first. Need to explain why precommitment doesn't work here—no external enforcer. Then Newcomb's problem, where the predictor's role differs. Also, correcting the reduction of intention to strong desire by showing that intention involves consistency in future actions.

  The closing check with modified cases is smart. Changing payout to drinking or adding a hypnotist tests if they understand the core issue: forming the intention solely for the reward is impossible without self-deception. Their answers should identify which modifications remove the intention-based reward.

  Finally, avoiding experimental literature and deterrence theory keeps focus on the philosophical puzzle. Flagging them as tangents maintains clarity.

  Overall, ensuring the structure builds step-by-step, preempts disciplinary biases, and uses relatable examples. The professor's concern about economists reducing intention to instrumental reasoning is key—every part of the plan should reinforce the separateness of intention as a rational state.
answer: |-
  Here’s a structured plan for your 90-minute session, designed to build understanding incrementally while preempting common misconceptions from your interdisciplinary audience:

  ---

  ### **1. Sequence of Pieces**  
  **Dependency Order & Rationale:**  
  - **(0-15 mins) Reasons to Act vs. Reasons to Intend:**  
    **Start here.** Use a simple example: *"You promise a friend you’ll return their book tomorrow. Keeping the promise benefits them, but forming the intention tonight benefits you (e.g., maintaining trust)."*  
    **Key distinction:**  
    - *Reasons to act*: Why drinking toxin/returning the book is good/bad *when the time comes*.  
    - *Reasons to intend*: Why forming the intention *now* might be rational *independent of future action*.  
    **Why first?** Economists/PoliSci students instinctively reduce intentions to precommitment devices. This distinction blocks that reduction.  

  - **(15-30 mins) Introduce Toxin Puzzle** *after* the distinction:  
    Frame it explicitly as: *"Can you form a sincere intention to do X if you know that once the intention is formed, doing X is against your interests?"*  

  - **(30-45 mins) Present Gauthier’s Passage:**  
    **Only now** contextualize it: "Gauthier argues that rationality requires acting on sincere intentions formed earlier, *even when the act itself is suboptimal*." Highlight his phrase *"sincere intention"* as the pivot.  

  ---

  ### **2. The Mundane Preparatory Case**  
  **Use "Library Book Return":**  
  *"Tonight, you can intend to return a friend’s book to the library tomorrow. If you form this intention, your friend gives you $10 now. Returning the book tomorrow costs you $5 in time/travel. You face no obstacles, and no one checks if you return it."*  

  | **Feature**       | **Toxin Case** | **Book Case** | **Why?** |  
  |-------------------|----------------|---------------|----------|  
  | Reward for intention | Yes (billionaire) | Yes (friend) | Isolates intention’s value |  
  | Later choice      | Drink/not drink | Return/not return | Ensures action is transparently irrational |  
  | External predictor | Absent         | Absent        | Avoids Newcomb confusion |  
  | Self-deception    | Excluded       | Excluded      | Forces clear-eyed intention |  
  | Forgetting option | Excluded       | Excluded      | Removes evasion strategies |  

  **Why *not* the running example?**  
  - "Resolving to run at 6 AM" involves *temptation* (weakness of will) and *habitual struggle*. Toxin/book cases lack these—the later act is purely costly but *effortless*. Running conflates *akrasia* with *intention formation*, muddying the target.  

  ---

  ### **3. Misconceptions & Preemptive Sequencing**  
  **Order of Address:**  
  1. **"It’s time-inconsistency; use a commitment device!"**  
     - *When:* Immediately after toxin case setup.  
     - *Response:* "A device (e.g., betting $1M you’ll drink) changes incentives, but the puzzle assumes *no external enforcement*. Can you form the intention *without* such devices?"  

  2. **"This is Newcomb's Problem!"**  
     - *When:* When discussing the billionaire’s reward.  
     - *Response:* "Newcomb relies on a predictor’s infallibility. Here, the billionaire rewards *intention*, not prediction. No causality violation."  

  3. **"Intention = strong desire / decision to try"**  
     - *When:* When defining "sincere intention."  
     - *Response:* "Intending to X entails *settling* on X and *consistency* in future planning. Desiring/trying lacks this—you can desire without intending, or try but not follow through."  

  4. **"Gauthier solved it—drinking is rational!"**  
     - *When:* After presenting Gauthier’s quote.  
     - *Response:** "But *can* you form the 'sincere intention' today? Kavka says no: if you know drinking is irrational tomorrow, forming the intention now is insincere. Gauthier *assumes* sincerity—that’s the contested move."  

  ---

  ### **4. Closing Check for Understanding**  
  **Activity:** *Modified Toxin Cases*  
  Hand out scenarios. Ask: *"Which modifications dissolve the puzzle? Which relocate it?"*  

  | **Modification**               | **Answer if Understood** | **Reason** |  
  |--------------------------------|--------------------------|------------|  
  | Payout depends on *drinking* (not intention) | Dissolves | Removes intention-based reward |  
  | Toxin is painless              | Relocates | Drinking is now costless, but intention puzzle remains |  
  | Hypnotist installs intention for $50 fee | Relocates | Shifts puzzle to whether hiring hypnotist is rational |  
  | Billionaire predicts behavior (à la Newcomb) | Relocates | Becomes Newcomb-style problem |  

  **Success looks like:**  
  - Students spot that only dissolving modification severs the link between *intention-formation* and *reward*. Others preserve the core tension.  

  ---

  ### **5. What to Openly Exclude**  
  **State upfront:**  
  > *"Today, we focus on the *conceptual* puzzle about rationality, not empirical or applied angles. So we’ll set aside:*  
  > - *Experimental work on intention-formation (e.g., can people actually do this?).*  
  > - *Deterrence theory origins (e.g., mutually assured destruction).*  
  > *Both are crucial context, but our goal is to isolate Gauthier’s philosophical move."*  

  **Why:** Keeps focus on *rationality* as an ideal standard, not psychology or real-world constraints. Economists might otherwise derail into "But in lab experiments..." or "In deterrence policy..."  

  ---

  ### **Timing Summary**  
  - **0–15 mins:** Reasons to act vs. intend (book case).  
  - **15–30 mins:** Toxin case + distinction reinforcement.  
  - **30–45 mins:** Gauthier’s passage + "sincere intention" focus.  
  - **45–70 mins:** Misconception addressing (ordered as above).  
  - **70–85 mins:** Modified cases activity.  
  - **85–90 mins:** Wrap-up/Q&A.  

  This sequence forces students to confront the *philosophical* problem (intention-as-rational-state) before retreating to familiar tools (game theory, commitment devices). Gauthier’s "sincere intention" becomes the hinge everyone must grapple with—not just a solution to memorize.
