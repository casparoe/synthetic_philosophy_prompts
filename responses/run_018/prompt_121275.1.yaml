prompt: |-
  ok so for a reading group on reasoning under uncertainty i've been writing down my views and want a consistency check before i present them. here's my package:

  (1) for any concrete forecast i should start with the outside view / reference class and only adjust modestly.
  (2) epistemic modesty means i have to admit my inside-view reasoning could be wrong, but also that i might genuinely be in a different reference class if i have specific structural reasons.
  (3) i think you shouldn't update your self-image as an outlier until you've got actual track record of being right against the base rate, not just one good argument.
  (4) in domains where the reference class is heterogeneous or poorly defined, the outside view is weak and i should weight inside view more heavily - but i should be suspicious of my own judgment that this domain is heterogeneous.
  (5) i think the principle always-start-outside is itself an inside-view claim about good reasoning, so treating it as axiomatic is a kind of self-undermining move.

  my worry is that (2) gives me permission to claim exceptionality whenever i have structural reasons while (3) says i need track record first - those seem to clash on when inside-view adjustments are allowed. and (5) looks like it kills (1). but is the clash between (2) and (4) real or just apparent? can you audit this: rank tensions by severity, say for each what has to give, and flag which ones dissolve on closer look? don't lecture me on tetlock or whatever, just check the package.
reasoning: |-
  Okay, let me start by understanding the user's query. They've outlined their five principles for reasoning under uncertainty and are concerned about internal inconsistencies, especially between (2) and (3), and whether (5) undermines (1). They want a consistency check without external references, focusing on their own package.

  First, I need to parse each point. (1) emphasizes starting with the outside view and adjusting modestly. (2) allows for adjustments based on structural reasons but with epistemic modesty. (3) requires a track record before self-identifying as an outlier. (4) permits heavier reliance on the inside view in heterogeneous domains but warns against self-deception. (5) points out that privileging the outside view is itself an inside-view claim, creating a self-undermining loop.

  The user's main worry is the clash between (2) and (3). On the surface, (2) seems to let them claim exceptionality with structural reasons, while (3) demands proof via track record. I need to see if these can coexist. Maybe (2) is about allowing adjustments in principle, but (3) sets a higher bar for actually considering oneself an outlier. That distinction could resolve the tension—adjustments are allowed, but calling yourself an outlier requires evidence.

  Then there's (5) versus (1). If (1) is treated as an axiom, but (5) says it's an inside-view claim, that could be circular. The solution might be to frame (1) as a defeasible starting point, not an absolute rule. Acknowledging that all principles are provisional maintains coherence without undermining the approach.

  (2) and (4) might not really clash. (4) deals with domain characteristics, while (2) is about personal reasoning. The user's suspicion in (4) acts as a check against overconfidence, aligning with the modesty in (2). So that tension might dissolve upon closer look.

  The user's deeper needs? They're preparing for a reading group and want confidence in their framework. They might fear presenting something with obvious flaws. Highlighting resolvable tensions and how each point can be adjusted slightly shows their framework is robust but requires careful application. Emphasizing process (track records as evidence) over identity (being an outlier) addresses the core of their concern between (2) and (3). They also need to avoid self-undermining, so positioning (1) as heuristic rather than axiom resolves (5). Overall, they seek validation that their principles can hold together with minor clarifications.
answer: |-
  Here's a consistency audit of your reasoning package, ranking tensions by severity and identifying resolutions:

  **Severity Ranking & Resolutions:**

  1.  **Tension: (2) vs. (3)** (Claiming exceptionality via structure vs. requiring track record)
      *   **Severity:** High (Core operational conflict).
      *   **Nature:** (2) grants permission to *adjust* based on specific structural reasons (implying potential exceptionality *within* the reference class or justifying a *different* class). (3) forbids *self-identification as an outlier* without a track record, demanding proof before adopting that self-image.
      *   **Resolution:** These *can* coexist with a crucial distinction:
          *   **(2) Allows *Adjustment*:** You *can* modestly adjust your forecast *away* from the base rate *based on structural reasons* (e.g., "The base rate for startup success is 10%, but *this specific* startup has a unique tech advantage I assess as moderately stronger than average, so I'll forecast 15%").
          *   **(3) Restricts *Self-Image as Outlier*:** You *cannot* conclude "I am *generally* an outlier in this domain" or "My structural reasoning ability is *systematically superior*" based *only* on having a structural reason for *one* (or a few) cases. That requires evidence of consistently beating the base rate over time.
      *   **What Has to Give:** Your interpretation of "exceptionality" in (2). It must be about *case-specific forecast adjustment*, not about *elevating your general reasoning status*. (3) wins on the latter. The permission in (2) is to *modestly tinker with the forecast*, not to crown yourself an outlier.

  2.  **Tension: (5) vs. (1)** (Self-undermining of "always-start-outside")
      *   **Severity:** Moderate (Philosophical challenge, but operationally resolvable).
      *   **Nature:** (5) correctly points out that the foundational principle (1) is itself an inside-view claim. Treating it as an absolute axiom *is* self-undermining.
      *   **Resolution:** This dissolves on closer look by **demoting (1) from an axiom to a strong defeasible heuristic**:
          *   Accept that (1) is your best *inside-view* judgment about effective reasoning *based on evidence and argument* (e.g., empirical results on base rate neglect, the success of reference class forecasting).
          *   Therefore, you rationally *choose* to adopt it as your *default starting procedure* precisely *because* your inside view (informed by broader evidence) judges it superior *despite* its meta-status.
          *   This doesn't kill (1); it grounds it in a coherent, self-aware way. You follow (1) *because* your reasoned judgment (inside view at the meta-level) concludes it's the best initial strategy, *not* because it's an unquestionable axiom.
      *   **What Has to Give:** The interpretation of (1) as an "axiom". It must be a **procedural commitment based on reasoned meta-judgment**, not a brute fact.

  3.  **Tension: (2) vs. (4)** (Modesty vs. weighting inside view in heterogeneous domains)
      *   **Severity:** Low/Apparent (Complementary, not conflicting).
      *   **Nature:** (2) emphasizes epistemic modesty regarding your *own* reasoning. (4) says that in messy domains, the outside view is weak, so you *must* rely more on the inside view, but cautions against overconfidence in declaring a domain messy.
      *   **Resolution:** This dissolves entirely on closer look. They work together:
          *   **(4) Sets the Context:** It tells you *when* the outside view is less reliable, creating a domain-specific justification for leaning more heavily on the inside view.
          *   **(2) Governs *How* You Use the Inside View:** When (4) applies and you *must* rely more on your inside view, (2) demands you do so with extreme modesty – acknowledging your reasoning could be wrong, that your judgment *of* heterogeneity could be flawed, and that any "structural reasons" for exceptionality are still tentative. The suspicion clause in (4) ("be suspicious of my own judgment that this domain is heterogeneous") *is* an expression of the modesty required by (2).
      *   **What Has to Give:** The perception of conflict. (4) defines the *condition* under which increased inside-view weighting is *necessary*, while (2) defines the *attitude* (modesty, suspicion) you *must* maintain while doing so. They are synergistic.

  **Summary of Resolutions & Key Clarifications:**

  *   **Resolved (2) vs. (3):** Distinguish **case-specific forecast adjustment** (allowed by (2) based on structure) from **adopting a general self-image as an outlier** (forbidden by (3) without track record). (2) permits tinkering; (3) forbids premature coronation.
  *   **Resolved (5) vs. (1):** Re-frame (1) not as an axiom but as a **defeasible procedural commitment justified by your meta-level inside view** (based on evidence about reasoning efficacy). This resolves the self-undermining.
  *   **Resolved (2) vs. (4):** Recognize (4) defines *when* heavier inside-view weighting is needed (outside view weak), while (2) defines *how* to do it (with modesty & suspicion). They are complementary checks.

  **Overall Package Consistency:** Your package is **internally consistent** with the above clarifications. The core tension (2 vs. 3) is resolved by distinguishing *process* (adjusting specific forecasts modestly based on structure) from *identity* (claiming outlier status). The meta-point (5) strengthens rather than kills (1) by forcing a more nuanced foundation. (4) and (2) work together as domain-sensitivity and process-modesty constraints. The key is rigorously applying the distinctions between specific adjustments, general self-assessment, and the justification for starting rules.
