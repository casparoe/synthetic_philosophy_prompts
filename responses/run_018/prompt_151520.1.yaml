prompt: |-
  I am trying to determine what I genuinely believe about political obligation and the conditions under which breaking the law can be justified, by examining my unreflective verdicts on specific cases and seeing whether they cohere.

  My verdicts are as follows. First, openly refusing to pay a portion of income tax that is explicitly allocated to funding a military intervention I regard as gravely unjust, announcing the refusal and accepting the legal penalty, strikes me as justified civil disobedience: my general duty to obey that tax law is overridden. Second, quietly concealing assets to avoid paying the very same tax, with no public disclosure and with the aim of escaping punishment, strikes me as unjustified evasion: the obligation remains intact, and secrecy removes whatever justification might exist. Third, participating in an open, non-violent sit-in that blocks access to a government office in protest against an unjust deportation policy, accepting arrest without resistance, strikes me as justified: the procedural duty not to obstruct is suspended. Fourth, working as a civil servant and secretly altering official records to prevent one specific, imminent deportation that I regard as wrong, without ever revealing the alteration, strikes me as justified—indeed, more clearly so than case two, despite being equally secret. Fifth, publicly refusing jury service in a legal system with well-documented racial disparities in conviction rates, explaining my refusal to the court in writing, strikes me as unjustified: the burden is minimal, the refusal weakens a shared institution, and the communicative gain is insufficient to override the duty of fair participation. Sixth, working as a physician and quietly omitting to file a legally required report of a patient's undocumented immigration status, treating the patient but saying nothing in public, is the case I keep returning to: sometimes it feels analogous to case four (direct prevention of immediate harm justifies secret non-compliance with an instrumental rule), sometimes analogous to case two (a hidden withdrawal from legal obligation without communicative purpose is mere evasion).

  Is there a single principle, or a small family of principles, that captures the pattern across these six? I want it stated precisely, with each clause tied to the case that motivates it. It should also yield clear verdicts on cases I have not considered—for instance, anonymously leaking classified documents that expose an unjust policy, versus anonymously damaging public property to delay its implementation. Most importantly, I want an honest statement of which of my six verdicts the principle cannot accommodate without revision: does it save case four at the expense of case six, or vice versa? And if one verdict must be surrendered, which is the least costly to drop?
reasoning: |-
  Okay, the user is trying to figure out their own beliefs about political obligation and when breaking the law is justified. They've provided six specific cases with their gut reactions. Let me go through each one carefully to understand their verdicts.

  First, they see openly refusing to pay taxes for military funding as justified civil disobedience. Second, secretly hiding assets to avoid the same tax is unjustified. Third, a non-violent sit-in against deportation policy is okay. Fourth, secretly altering records to stop a deportation is justified. Fifth, refusing jury duty due to racial disparities isn't justified. Sixth, a doctor not reporting undocumented status is confusing—sometimes like case four, sometimes like case two.

  The user wants a principle that explains all these judgments. They also want to know if the principle can handle unseen cases, like leaking documents vs. damaging property. Importantly, they want to know if case four and six conflict and which verdict might need revising.

  Looking at the cases, the common threads seem to be immediacy of harm, public vs. secret actions, and whether the action directly prevents harm. Case four involves direct prevention of an immediate harm (stopping one deportation), while case six is about not reporting, which might prevent harm but less directly. The user's uncertainty in case six might stem from the lack of immediacy compared to case four.

  The principle proposed by the assistant has three clauses: direct harm prevention, immediacy, and narrowness. Case four fits all three: altering records directly prevents harm, it's immediate, and it's specific. Case six might fail the immediacy part because the harm isn't as immediate—reporting leads to deportation, but it's not happening right then. Also, the action isn't as direct; not reporting avoids harm but doesn't actively prevent it like altering records does.

  The user might be struggling with case six because it feels morally right to protect a patient, but the secretive nature conflicts with their view on evasion. The principle clarifies that direct, immediate harm prevention justifies secrecy, but without immediacy, it's harder to justify. So case six might not be justified under this principle, meaning the user might need to adjust their view on that case.

  The user's deeper need is coherence in their moral framework. They want consistency across different scenarios. The conflict between cases four and six highlights a tension between preventing harm and the means used. By prioritizing immediacy, the principle resolves this by siding with case four over six. The user might need to accept that non-immediate harms don't justify secret evasion, which could mean revising their stance on case six. Alternatively, they might adjust the principle to include broader prevention, but that risks weakening the distinction from evasion. The key is whether they value immediacy as a necessary factor for overriding legal obligations secretly.
answer: |-
  Based on your unreflective verdicts, the following principle captures the pattern and provides a coherent framework:

  **The Principle of Defensive Citizenship:**

  An individual's general duty to obey a specific law is overridden if and only if:
  1.  **Prevention of Grave Harm:** The act of non-compliance directly prevents or significantly impedes the occurrence of a grave, specific, and imminent injustice or harm *that would otherwise result directly* from the application or enforcement of the law or policy in question *(Motivated by Cases 1, 3, 4, and distinguishing them from 2 & 5)*.
  2.  **Immediacy & Direct Causation:** The harm being prevented is imminent (not merely potential or distant), and the non-compliance itself is the direct and reasonably necessary means of preventing *that specific instance* of harm *(Motivated by Case 4 vs. Case 2 & 6; also distinguishes 1 & 3 from 5)*.
  3.  **Narrowness:** The non-compliance is narrowly targeted at preventing the specific harm and minimizes unnecessary violation of other legitimate legal duties or collateral harm *(Motivated by Case 1 vs. Case 2; Case 3 vs. vandalism; Case 4 vs. Case 6 ambiguity)*.

  **Clarifications & Applications to Your Cases:**

  *   **Case 1 (Open Tax Refusal):** Satisfies (1) & (3). It *impedes* funding the unjust intervention (grave harm), is public/narrow (refuses only *that* tax portion). It doesn't satisfy (2) perfectly (harm isn't *directly* prevented by *this specific* refusal) but the *collective* public act aims to *impede* the harm-causing mechanism. This suggests (2) might be slightly softened for *collective*, *public* acts targeting the harm mechanism itself.
  *   **Case 2 (Secret Tax Evasion):** Violates (1) & (2) & (3). It avoids personal cost without preventing/impede the specific harm. Secrecy undermines any link to harm prevention.
  *   **Case 3 (Open Sit-In):** Satisfies (1) & (3). It directly impedes the specific act of deportation (grave harm for that individual/family), is public/narrowly targeted. Like Case 1, (2) is collective/impediment-focused rather than direct individual prevention.
  *   **Case 4 (Secret Record Altering):** Satisfies (1) & (2) & (3). It *directly prevents* the *imminent* and *specific* harm (deportation) of a particular person. The secrecy is necessary for effectiveness and the violation is narrow (altering specific records for this case).
  *   **Case 5 (Jury Refusal):** Fails (1) & (2). While systemic injustice exists, the refusal doesn't *prevent* a *specific, imminent* harm (it might even increase the risk of harm to the defendant in that case by reducing jury diversity). The harm is systemic/potential, not specific/imminent. Also fails (3) by weakening a core institution without a clear, immediate preventive gain.
  *   **Case 6 (Doctor Non-Reporting):** **This is the tension point.** It aims to prevent harm (deportation). However:
      *   **Against Justification:** Fails (2) Immediacy/Direct Causation. The non-compliance (not reporting) *avoids triggering* the harm mechanism, but doesn't *directly prevent* an *imminent* deportation already in motion. The harm is potential/future, dependent on others discovering the status. It resembles Case 2 (avoiding a legal duty secretly) more than Case 4.
      *   **For Justification (if you lean that way):** Argues that reporting *directly causes* the harm chain, so non-reporting *prevents* that initiation. The harm to the patient (deportation, family separation) is grave. Narrowness is satisfied.

  **Accommodating Your Verdicts:**

  *   The principle **clearly accommodates Cases 1, 2, 3, 4, and 5** as you judged them.
  *   **Case 6 poses the problem.** Under a strict reading emphasizing **Immediacy & Direct Causation (Clause 2)**, Case 6 is **not justified** (analogous to Case 2). Your intuition that it sometimes feels like Case 4 is understandable (both involve protecting an individual from state harm via procedural non-compliance), but Clause 2 draws a critical distinction: Case 4 stops a harm *in active execution*, while Case 6 prevents a harm *from being initiated* based on information control. This distinction makes Case 4 defensive intervention and Case 6 prophylactic evasion.

  **Required Revision & Cost:**

  *   **To save the principle's coherence with your core pattern (especially the justification for secrecy *only* in Case 4-like scenarios), you must likely revise your verdict on Case 6 to:** *Unjustified.*
  *   **Cost of Dropping this Verdict:** This revision means accepting that secret non-compliance is only justified when directly blocking an *imminent, specific harm already in process* (like stopping the deportation van). Preventing the *initial triggering* of a harm process via secret evasion of a reporting rule (like Case 6 or Case 2) is not justified under this principle. This protects the strong distinction your intuitions make between Case 4 and Case 2, at the expense of Case 6 feeling less justified.
  *   *Alternative (Higher Cost):* If you insist Case 6 *must* be justified, you would need to weaken Clause 2 significantly (e.g., removing "imminent" and broadening "direct prevention" to include "preventing initiation"). However, this would **collapse the distinction between Case 4 and Case 2**, potentially justifying secret tax evasion *if* you genuinely believed it *prevented* your money funding harm (even distantly). This contradicts your strong verdict against Case 2 and undermines the principle's ability to condemn purely self-interested evasion. This cost is higher as it damages the coherence of your other clear judgments.

  **Verdicts on New Cases:**

  1.  **Anonymously leaking classified documents exposing an unjust policy:**
      *   **Analysis:** Satisfies (1) (exposes grave injustice, potentially *impedes* its continuation). Fails strict (2) (doesn't directly stop a *specific imminent* harm; exposure is indirect). Satisfies (3) (narrowly targets information release). **Verdict:** *Likely justified under the principle*, especially if the policy causes ongoing imminent harms (strengthening link to (1)), due to its public nature (like Case 1/3) and role in *impeding* harm. The principle, slightly softened for public/impeding acts, accommodates this.
  2.  **Anonymously damaging public property to delay the implementation of an unjust policy:**
      *   **Analysis:** May satisfy (1) (delays unjust policy causing harm). Fails (2) (damage doesn't directly prevent a specific imminent harm; delay is indirect). Fails (3) (damage causes collateral harm/violates laws unrelated to the policy's injustice). **Verdict:** *Unjustified.* The indirectness, secrecy, collateral harm, and lack of direct prevention distinguish it negatively from Cases 1, 3, and 4. Resembles vandalism excluded by your Case 3 justification.

  **Conclusion:**

  The **Principle of Defensive Citizenship** (Prevent Grave Harm + Immediacy/Direct Causation + Narrowness) captures your core intuitions across Cases 1-5 and provides clear reasoning for new cases. Its key strength is justifying *secret* non-compliance *only* when directly intervening to stop a specific, imminent harm already underway (Case 4). The cost of coherence is **revising your verdict on Case 6 (Doctor Non-Reporting) to *Unjustified***, as the harm prevented lacks the required imminency and directness compared to Case 4. This preserves the crucial distinction between defensive intervention (Case 4) and secret evasion (Cases 2 & 6). If Case 6's justification feels non-negotiable, the principle requires significant revision at the cost of blurring the line with Case 2 and weakening its overall coherence.
