prompt: |-
  I'm prepping a session for my second-year philosophy reading group — theyre mostly comfy with basic ethics but now hitting teh wrong-kind-reasons problem and mixing it up with just having bad reasons generally. You are a seasoned philosophy tutor; please think carefully about the dependency structure before you lay out the plan, and start with a quick brainstorm of what can go wrong pedagogically. I need the answer in British English.

  Don't explain the concept to me directly — design the teaching arc for a single 90-minute meeting. First, what distinction must be solid before 'wrong kind' makes any sense, and in what order do the pieces have to come? Then the carrying example: I'm tempted to use admiration for a mathematician's proof, but tell me whether that works, what properties it must have, and what it must lack so it doesn't collapse into 'bad reasons' or 'selfish motives'. Map out the misconceptions they'll arrive with or form — especially thier tendency to think it's about hidden motivation rather than the category of reason being inappropriate — and say exactly where in the sequence each gets headed off, including teh sneaky misconception that instrumental value can 'leak' into intrinsic appreciation without them noticing.

  Also: the one check question at the end that shows they've got the structural point, not just memorised the phrase; what I should openly say we're skipping at this level; and weave in this niche twist — show how the problem looks different when the attitude is belief rather than admiration, using a scenario about someone forming confidence in climate-model outputs mainly because of departmental peer-pressure rather than evidence, but don't ask them to research anything. Keep it casual; a typo or two is fine.
reasoning: |-
  Hmm, the user is prepping a philosophy session for second-year students on the "wrong kind of reasons" problem. They want me to design a 90-minute teaching plan in British English without explaining the concept directly. They've mentioned several important points: students are confusing wrong-kind reasons with bad reasons generally, they'll likely mistake it for hidden motivation, and I need to address how this applies to belief versus admiration. There's also a specific request about instrumental value "leaking" into intrinsic appreciation.

  I need to approach this carefully. The user is clearly experienced (they mention being a tutor) but wants to avoid common pedagogical pitfalls. They've flagged that students tend to collapse "wrong kind" into "bad reasons" or "selfish motives" - that's crucial. The "leaking" misconception is subtle but important too. And they want a niche twist comparing admiration and belief attitudes.

  For the structure, I should start by identifying what foundations must be solid before introducing "wrong kind" reasons. The attitude/reason distinction seems fundamental - students must grasp that reasons are for attitudes, not just outcomes. Then the intrinsic/instrumental value distinction, because wrong-kind reasons often appear when we confuse these. Only then can we introduce WKR properly.

  For examples, they suggested admiration for a mathematician's proof. That could work if framed carefully - the proof itself must be genuinely admirable (so not a bad reason), but the reason for admiring it must be external, like a cash reward. Need to avoid any hint that the admirer has selfish motives - the reason must be "wrong kind" but not morally dubious. Peer-pressure in belief formation would contrast nicely later.

  Major misconceptions to address: 1) That WKR just means "bad reasons" generally - must show cases where the reason is good but still wrong kind. 2) That it's about hidden selfish motives - need examples where the reason is overt but categorically misplaced. 3) The "leaking" idea where instrumental benefits (like feeling good) get mistaken for intrinsic reasons. Should surface this when discussing the admiration example.

  For the check question, something that requires applying the distinction to a new case where the reason is instrumentally good but categorically wrong - maybe admiring a sunset for health benefits. And should explicitly bracket meta-ethical debates about reason existence - that's for later study.

  Timing-wise: 15 mins on attitudes/reasons, 20 on intrinsic/instrumental, 30 on WKR with examples, 15 on belief application, 10 for recap and check. The belief contrast should come after admiration is solid, showing how similar confusion happens with different attitudes.

  Most importantly, the whole arc must reinforce that WKR is about categorical misfit, not quality or morality of reasons. That's the core insight they'll miss if we don't structure it carefully.
answer: |-
  Right, let's craft this carefully — second-years grasping WKR is notoriously slippery, and you're spot-on about the misconceptions they'll drag in. The key is building the dependencies so the distinction *emerges* from their own reasoning, not just being told. Here’s a 90-minute arc in proper Brit style, typos and all for that casual vibe:

  **Pedagogical Pitfalls (Brainstorm First):**
  1.  **Collapsing into "Bad Reasons":** Biggest risk. They'll think WKR *just* means weak, irrational, or morally dubious reasons. Must show WKR can be *excellent* reasons... just for the *wrong thing*.
  2.  **Misattributing to Selfishness/Hidden Motives:** Assuming it's *always* about self-interest or ulterior motives. Need examples where the reason is overt, benign, even noble, but still wrong-kind.
  3.  **"Leaking" Instrumental Value:** The sneaky one! They'll implicitly think the instrumental benefit (e.g., reward) *becomes* or *justifies* the intrinsic attitude, rather than being irrelevant to it.
  4.  **Attitude Confusion:** Not firmly grasping that reasons are fundamentally *for* or *against* holding a *specific attitude* (admiring, believing, intending, etc.).
  5.  **Over-Intellectualising:** Getting bogged down in meta-ethics ("*Do* such reasons even exist?") before grasping the structural point.
  6.  **Missing the "Category" Point:** Thinking it's a gradation ("a bit wrong") rather than a categorical misfit ("wrong kind entirely").

  **Teaching Arc: 90 Minutes**

  **Part 1: Foundations - Setting the Stage (25 mins)**
  *   **(10 mins) Warm-up: Attitudes & Reasons - What Fits What?**
      *   *Activity:* Quick brainstorm: "What are reasons *for*? Give examples." List: Reasons for *actions* (drinking water: thirst), *beliefs* (believing it's raining: seeing rain), *feelings* (fear: seeing a spider), **attitudes** (admiring someone: their courage). **Crucial:** Hammer home that reasons are *tailored* to the thing they are reasons *for*. A reason for an action isn't automatically a reason for a belief, etc.
      *   *Head off Misconception #4:* Explicitly state: "Today, we're focusing on reasons *for specific propositional attitudes* – like admiration or belief."
  *   **(15 mins) Intrinsic vs. Instrumental Value - The Core Distinction**
      *   *Concept:* Clarify (don't assume comfort!). Intrinsic value: valuable *in itself*, *for its own sake*. Instrumental value: valuable *as a means* to something else.
      *   *Example Drill:* Use their examples. "Why value this proof?" "Because it's elegant/solves the problem (intrinsic)?" vs. "Because it gets me a prize/impresses my supervisor (instrumental)?"
      *   *Key Question:* "Can the *instrumental value* of something *be the reason* we value it *intrinsically*?" Plant the seed. **This is THE essential precursor to WKR.** If this isn't solid, WKR makes no sense.

  **Part 2: Introducing the Puzzle - Admiration Case (30 mins)**
  *   **(10 mins) Present Your Mathematician Example (It Works IF...):**
      *   *Scenario:* "Imagine a truly brilliant, elegant proof of Fermat's Last Theorem. Mathematically flawless, deeply insightful. You *genuinely* grasp its intrinsic mathematical merit."
      *   *The WKR Twist:* "Now imagine someone offers you £1 million *if* you genuinely admire this proof tomorrow. Not pretend, not say you do, but *actually feel* sincere admiration for it."
      *   *Properties it MUST Have:* (1) The proof *is* intrinsically admirable (so it's not a *bad* reason for admiration). (2) The £1m *is* a genuinely good reason *for wanting to have the admiration* or *for acting as if you admire it*. (3) The reason (£1m) is *external* to the proof's qualities.
      *   *What it MUST Lack:* Any hint that the admirer is selfish *in a way that corrupts the admiration itself*. The puzzlement arises *even if* they sincerely try to admire it *because* of the money and somehow succeed. The money isn't a *hidden* motive; it's the overt, sole reason *for cultivating the attitude*.
  *   **(15 mins) Facilitate the Puzzlement & Diagnose:**
      *   *Question:* "Is the £1 million a good reason *to admire the proof*?" Expect confusion/arguments.
      *   *Surface Collapse/Misattribution:* They'll say "No, that's a bad/selfish reason!" **Head off Misconceptions #1 & #2:** Counter: "But it's a fantastic reason to *want* to admire it, right? And it's not *morally* bad to want £1m for admiring maths! The puzzle is: *Why* does it feel like a misfit *as a direct reason for the admiration itself*, even if it's good otherwise?"
      *   *Surface "Leaking" (#3):* "Do you find yourself thinking 'Well, the money *makes* the proof admirable'? Does the instrumental benefit somehow *become* part of the intrinsic reason?" Point out this is the "leak" – trying to force the instrumental benefit to *count* as an intrinsic property. It doesn't.
  *   **(5 mins) Introduce the Terminology & Structural Point:**
      *   "This is the 'Wrong Kind of Reasons' problem. The £1m seems like the *wrong kind* of reason to admire the proof *directly*. It might be the *right kind* of reason to *desire to admire it*, or to *act* admiringly, but not for the *attitude of admiration itself*. The 'right kind' would be reasons that cite the proof's actual properties – its elegance, ingenuity, etc."

  **Part 3: Contrast & Application - Belief Case (20 mins)**
  *   **(10 mins) Present Climate Model Scenario:**
      *   *Scenario:* "Sophie is a scientist. She's presented with complex climate model outputs. The evidence is mixed and requires careful interpretation. However, Sophie feels intense pressure from her department head and peers to express *high confidence* in these specific model projections. She wants to fit in, keep her job, and avoid criticism. She ends up forming genuine, sincere confidence in the model outputs."
      *   *Question:* "Is the peer pressure a good reason *for Sophie's belief* (her confidence) in the model outputs?"
  *   **(10 mins) Facilitate Comparison to Admiration:**
      *   *Guide them:* "Compare to the maths proof. What's similar? What's different?"
      *   *Key Insights:*
          *   Similarity: Peer pressure is an excellent instrumental reason *to want to hold the belief* (avoid trouble) or *to assert the belief*. But is it a reason *justifying the belief itself*? (No! Right kind = evidence for the model's accuracy).
          *   **Crucial Difference in Attitude:** Beliefs *aim at truth*. A reason for belief *must* bear on the *truth* of the proposition. Peer pressure doesn't – it's about consequences of *holding* the belief. Admiration isn't truth-aimed, but it *is* (arguably) merit-aimed. WKR highlights when reasons fail to connect to the *constitutive aim* of the attitude.
      *   *Head off Misconceptions:* Reiterate: It's not that peer pressure is a *weak* evidence-substitute (it's not evidence *at all* for the model!). It's the *wrong category* of reason for *belief formation*.

  **Part 4: Consolidation & Check (15 mins)**
  *   **(5 mins) Recap the Structure:** "So, WKR isn't about *bad* reasons. It's about reasons that might be good, but are directed at the *wrong target* – they fit wanting the attitude, or actions related to it, but not *justifying the attitude itself* because they bypass its core point (merit for admiration, truth for belief)."
  *   **(5 mins) The Check Question (Must Reveal Structural Grasp, Not Memorisation):**
      *   *Scenario:* "Imagine someone argues you should *intrinsically value* a beautiful sunset primarily because looking at sunsets *lowers your blood pressure*. Is the blood pressure benefit a 'right kind' reason for valuing the sunset intrinsically? Why/why not?"
      *   *Why it works:* Forces them to apply the intrinsic/instrumental distinction and see the categorical misfit. A good reason *to look at* sunsets, or *to want to value* them, but not a reason *constituting* that intrinsic value (which would be its beauty, awe-inspiring nature, etc.). If they just say "Wrong Kind!" without explaining *why* it's the wrong *category*, they haven't got it.
  *   **(5 mins) What We're Skipping & Wrap-up:**
      *   *Openly Skip:* "We're deliberately *not* diving into the deep meta-ethics today – questions like *whether* these 'wrong kind' reasons *truly exist* as reasons for the attitude, or if they somehow *can* be made to fit. That's crucial stuff, but for later seminars or dissertations! Today was purely about spotting the *structural distinction* and the *puzzle* it creates." (Manages expectations, prevents rabbit holes).
      *   *Final Thought:* "The takeaway? When someone gives a reason for an attitude like admiration or belief, ask: Does this reason speak to *what makes the thing admirable/believable*, or is it about *something else entirely* (like rewards or pressures for *having* the attitude)?"

  **Why this sequence works:**
  1.  **Attitude/Reason Fit (P1)** is the absolute bedrock.
  2.  **Intrinsic/Instrumental (P1)** is the *essential* conceptual tool needed to *see* the WKR misfit.
  3.  **The Admiration Example (P2)** introduces the puzzle *after* foundations are laid. Your mathematician example works *because* it isolates the structural misfit (money vs. proof's merit) without moral baggage or bad proof quality.
  4.  **Actively surfacing misconceptions (during P2 discussion)** stops them taking root.
  5.  **The Belief Contrast (P3)** reinforces the structural point by applying it to a different attitude with a different aim, showing it's not admiration-specific and deepening understanding via comparison.
  6.  **The Check Question (P4)** tests application of the *distinction*, not jargon recall.
  7.  **Explicitly bracketing meta-ethics (P4)** keeps the session focused and achievable.

  Good luck with the session – it’s a tricky but rewarding one to teach once the structure clicks! Mind that peer pressure doesn’t make ’em all agree with you just to get to the pub afterwards. Cheers!
