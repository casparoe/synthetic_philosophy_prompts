answer: |-
  Here’s a spec sheet for theories of historical presentism, drafted in British English as requested. It outlines core desiderata, flags tensions, and scores major theoretical approaches against these criteria.

  ---

  ### **Spec Sheet: Desiderata for an Adequate Theory of Historical Presentism**

  **Core Phenomena to Explain:**
  1.  **Structural Inevitability:** The fact that *all* historical inquiry uses present-day tools (language, concepts, archival systems, digital metadata) to access the past. Total escape is architecturally impossible.
  2.  **Conceptual Translation Dilemmas:** Applying modern analytical categories (e.g., "gender identity," "class struggle," "human rights," "mental health") to past societies where these concepts didn't exist or had radically different meanings. (e.g., Describing Byzantine eunuchs using contemporary LGBTQ+ frameworks).
  3.  **Moral Evaluation Tensions:** Judging past actions/values by contemporary ethical standards (e.g., condemning medieval plague quarantines as violations of modern bioethics/principles of bodily autonomy, or denouncing historical figures for slaveholding by 21st-century norms).
  4.  **The Hermeneutic Gap:** Explaining how historians bridge the vast conceptual, cultural, and experiential distance between past and present without collapsing one into the other.
  5.  **Productive vs. Distorting Presentism:** Accounting for when present-centred questions *reveal* new aspects of the past (e.g., asking feminist questions of pre-modern sources) versus when they *distort* or obscure past realities (e.g., projecting modern nationalism onto mediaeval kingdoms).
  6.  **Epistemic Access:** Acknowledging that our *only* point of entry into the past is through present consciousness, language, and concerns.

  **Essential Distinctions to Preserve:**
  1.  **Moral Presentism vs. Conceptual Presentism:** Judging past morality vs. using modern analytical frameworks. A theory must handle these separately, even if interconnected.
  2.  **Description vs. Prescription:** Accurately *describing* past mentalities/systems using appropriate (past or present) concepts, versus *prescribing* how we *should* judge them morally or politically today.
  3.  **Intentionality vs. Consequence:** Understanding past actors' intentions within their context versus analysing the long-term consequences of their actions from our vantage point.
  4.  **Contextual Sensitivity vs. Critical Engagement:** Respecting historical specificity versus recognising that history is always written *for* the present and can engage critically with past injustices.

  **Non-Negotiable Results to Accommodate:**
  1.  **The Structural Inevitability Thesis (SI):** *All* history employs present-day cognitive and linguistic tools. A theory denying SI is empirically inadequate.
  2.  **The Historicity Thesis (HT):** Past societies possessed fundamentally different conceptual universes and value systems. A theory ignoring HT risks profound anachronism and misrepresentation.
  3.  **The Possibility of Historical Knowledge (PHK):** Despite SI and HT, we *can* gain reliable, albeit imperfect and interpretative, knowledge about the past. A theory rendering PHK impossible is self-defeating for the discipline.

  **Camp Preferences (Debatable but Common):**
  1.  **Degree of Moral Evaluation:** Whether explicit moral condemnation of the past by present standards is a legitimate or necessary part of the historian's task, or an impediment to understanding.
  2.  **Role of Present Concerns:** The extent to which contemporary political, social, or ethical imperatives *should* consciously drive historical research agendas.
  3.  **"Usefulness" of History:** The priority given to making history "relevant" to modern audiences versus reconstructing the past "on its own terms."

  **Key Tensions & Potentially Jointly Unsatisfiable Demands (The Bit You Care About Most):**
  1.  **SI vs. HT + Anti-Anachronism Norm (AA):** This is the core tension.
      *   **SI:** We *must* use present concepts/tools.
      *   **HT + AA:** Past concepts/contexts were fundamentally different; projecting modern ones distorts the past.
      *   **Conflict:** How can we use our present concepts (SI) without inevitably distorting the past (violating HT/AA)? Can we "bend" our concepts sufficiently to capture past realities without breaking them or losing intelligibility? Theories *must* grapple with this.
  2.  **PHK vs. Radical Constructivism:** If the past is *only* a construct of present concerns (denying PHK), history collapses into presentist fiction. A theory must maintain PHK while acknowledging SI.
  3.  **Critical Engagement vs. Contextualism:** Can we strongly condemn past injustices (e.g., slavery, colonialism) *as historians* without being accused of anachronistic moral presentism that obscures context? Balancing condemnation with deep contextual understanding is difficult.

  **Scoring the Usual Contenders:**

  1.  **Hard Anti-Presentism (e.g., Quentin Skinner, strict contextualism):**
      *   **Core:** Historians must rigorously reconstruct past agents' *own* intentions and linguistic/conceptual frameworks ("language games"). Avoid modern categories entirely where possible.
      *   **Scores:**
          *   **HT/AA:** **Excellent.** Prioritises avoiding anachronism.
          *   **SI:** **Poor.** Underestimates the depth of the problem; assumes we can largely "bracket" our concepts.
          *   **PHK:** **Good.** Aims for reliable reconstruction.
          *   **Conceptual Translation:** **Weak.** Struggles to analyse past phenomena using *our* necessary questions/categories.
          *   **Moral Evaluation:** **Rejects.** Seen as outside the historian's task (leads to distortion).
          *   **Productive Presentism:** **Rejects.** Views it as inherently distorting.
          *   **Key Tension (SI vs HT/AA):** Fails to adequately resolve SI. Assumes AA is achievable by sheer methodological rigour, sidestepping the structural inevitability.

  2.  **Contextualism/Critical Hermeneutics (e.g., J.G.A. Pocock, moderate versions):**
      *   **Core:** Deep contextual understanding is paramount. Modern concepts can be used *heuristically* and *critically*, but must be constantly tested against the evidence of past contexts and meanings. Acknowledge the gap and the translator's role.
      *   **Scores:**
          *   **HT/AA:** **Very Good.** Strong emphasis on context.
          *   **SI:** **Good.** Explicitly acknowledges the problem and the need for careful, self-aware translation.
          *   **PHK:** **Good.** Seeks reliable knowledge through critical dialogue between past and present.
          *   **Conceptual Translation:** **Good.** Offers a methodology (heuristic use, constant checking).
          *   **Moral Evaluation:** **Cautious/Optional.** May allow for analysis of past moral frameworks or consequences, but wary of direct condemnation as anachronistic. Focuses on *understanding* morality-in-context.
          *   **Productive Presentism:** **Conditionally Good.** Accepts it can be productive if rigorously contextualised.
          *   **Key Tension (SI vs HT/AA):** The best at directly addressing and managing this tension. Accepts SI but uses methodological safeguards (contextual immersion, linguistic analysis) to mitigate anachronism while using modern concepts cautiously.

  3.  **Critical/Cognitive Presentism (e.g., E.H. Carr, David Armitage, some feminist/postcolonial approaches):**
      *   **Core:** Presentism is unavoidable and *productive*. History is a dialogue between past and present. Using modern concepts/categories and asking present-centred questions reveals new insights and challenges past silences (e.g., women's history, subaltern studies). Moral engagement is valid and necessary.
      *   **Scores:**
          *   **HT/AA:** **Variable (Often Weak).** Can sometimes downplay difference in favour of revealing patterns or injustices visible from the present. Risk of distortion is higher.
          *   **SI:** **Excellent.** Fully embraces and leverages this inevitability.
          *   **PHK:** **Acceptable but Contested.** Knowledge is seen as interpretative and shaped by present concerns, but not purely fictional.
          *   **Conceptual Translation:** **Strong (But Risky).** Actively uses modern categories to interrogate the past, potentially revealing new perspectives, but risks misrepresentation.
          *   **Moral Evaluation:** **Strong.** Explicitly embraces moral/political engagement with the past as part of history's purpose.
          *   **Productive Presentism:** **Excellent.** Sees it as the primary engine of historical insight and relevance.
          *   **Key Tension (SI vs HT/AA):** Resolves it by *prioritising SI* and accepting a degree of anachronism as the necessary cost of relevance and critical insight. Risks violating HT/AA severely in some implementations.

  **Summary Assessment:**
  *   **Hard Anti-Presentism:** Fails on SI and struggles with Conceptual Translation/Productive Presentism. Strong on HT/AA but arguably unrealistic.
  *   **Contextualism/Critical Hermeneutics:** Provides the most balanced approach, directly grappling with the core SI vs HT/AA tension through methodology. Best at preserving essential distinctions. May be seen as too cautious by those prioritising moral engagement or contemporary relevance.
  *   **Critical Presentism:** Embraces SI and Productive Presentism/Moral Evaluation fully. Offers powerful tools for uncovering hidden histories. Most vulnerable to charges of anachronism (violating HT/AA) and potentially distorting the past's radical difference. Handles the tension by sacrificing strict adherence to HT/AA for present utility.

  The unresolvable heart of the matter remains the **Structural Inevitability vs. Historicity/Anti-Anachronism tension.** No theory eliminates it; they manage it differently. Contextualism offers the most sophisticated management strategy, while Critical Presentism argues the gains of embracing SI outweigh the risks to HT/AA. Hard Anti-Presentism attempts denial, which proves inadequate. An adequate theory *must* explicitly confront this dialectic without pretending it can be dissolved.

  ---
