answer: |-
  ### Essay Question
  **Analyze whether promises made to individuals who cannot form expectations (e.g., a dying person unaware of your words, or a cynic convinced you will break your word) undermine expectation-based accounts of promissory obligation. If they do, what must an alternative theory fundamentally commit to in order to resolve these cases—and can such a theory avoid circularity in grounding the obligation?**

  ---

  ### Model Answer (≈600 words)  
  These cases—deathbed promises to the insensate and promises to hardened cynics—are not mere awkwardness for expectation-based accounts but fatal counterexamples. Such accounts locate promissory wrongness in the harm of disappointed reliance or manipulated trust. Yet when no expectation exists (the dying person never registers the vow; the cynic anticipates betrayal), no reliance is formed. If breaking such promises remains wrong—as intuitively it does—the expectation account cannot explain the core obligation. For instance, reneging on a deathbed pledge to donate a fortune to charity still feels culpable, even if the deceased never believed it would occur. Expectation theories might protest that *potential* reliance matters, but this distorts "reliance" beyond recognition: the cynic actively *dis*believes, nullifying even hypothetical dependence.  

  An alternative, like the normative-power account, must therefore ground promissory obligation in the promisor’s act itself: by promising, one exercises a normative power to create a directed duty owed *to* the promisee, irrespective of their expectations. This power is constitutive of social practices that enable moral agents to bind their wills. Crucially, it explains the deathbed/cynic cases: the promisor invokes a convention that generates obligation through performance, not psychological impact. Breaking the promise wrongs the promisee not by disappointing them but by violating a commitment constituted by the promissory act.  

  However, this invites the circularity objection: if promising *creates* obligation, what authorizes this power? Doesn’t it presuppose the very obligation it generates? A successful normative-power theory must avoid this by anchoring the power in non-promissory norms. For example, our autonomy grants us authority to enter binding relationships, and social cooperation necessitates tools for voluntary obligation-creation. The wrong in breaking a promise to the cynic, then, stems from abusing this autonomous authority, not from frustrating expectations. The obligation arises from the legitimate exercise of a power embedded in a broader normative framework—not from the power inventing obligation *ex nihilo*.  

  While expectation accounts might retort that normative powers mystify obligation, their failure to handle edge cases proves more debilitating. The normative-power account’s commitment to non-circularity requires situating promissory acts within a structure of mutual respect and moral agency. It succeeds not by eliminating expectations entirely (often they *accompany* promises) but by showing obligation’s source lies deeper—in the promisor’s deliberate moral self-binding.  

  *(Word count: 598)*  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Point**                                                                                                | **Marks** | **Weak Candidate Mishandling**                                                                 |
  | :------------------------------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------------------------------------- |
  | **1. Correctly identifies why deathbed/cynic cases challenge expectation accounts** (e.g., no reliance formed). | 4         | **Mishandling**: Assumes the promisee "secretly" expected fulfillment or that the promisor’s *own* expectation matters. |
  | **2. Argues whether cases are counterexamples (not awkwardness)** with justification.                     | 4         | **Mishandling**: Treats cases as easily resolved by "broader" expectation definitions (e.g., "societal reliance") without explaining why this isn’t ad hoc. |
  | **3. Explains a rival account’s core commitment** (e.g., normative power as act-focused obligation-creation). | 4         | **Mishandling**: Vaguely gestures at "intention-based" views without specifying how they differ structurally from expectation accounts. |
  | **4. Diagnoses circularity risk in rival account & how to avoid it** (e.g., grounding power in autonomy/social practice). | 4         | **Mishandling**: Claims normative-power accounts *are* circular but cannot pinpoint where (e.g., conflates creating an obligation with presuming one). |
  | **5. Engages a strong objection to chosen position** (e.g., circularity/mystification) and rebuts it.    | 4         | **Mishandling**: Dismisses objections superficially or concedes without effective counterargument. |

  ---

  ### Design Notes  
  1.  **Question Specificity**: Forces engagement with the "no expectation" paradox without namedropping theorists. The circularity clause targets the normative-power account’s meta-ethical burden.  
  2.  **Model Answer Position**: Takes a clear stance (expectation accounts fail; normative powers succeed if non-circular) while confronting the key objection (circularity) head-on.  
  3.  **Marking Scheme Rigor**: Points 1–2 test case analysis; 3–4 require theoretical construction; 5 evaluates critical defense. Weak-candidate notes target predictable errors (e.g., psychologizing the cynic).  
  4.  **Theoretical Coverage**: Expectation accounts (Scanlon-inspired) and normative powers (Raz/Shiffrin-esque) are central without requiring name recognition.  

  This structure ensures students must *apply* machinery to pathological cases—not rehearse canon—while meeting advanced seminar demands for argumentative precision.
