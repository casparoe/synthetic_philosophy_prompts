answer: |-
  The furnace beneath Meridian wasn’t just an engine; it was the city’s heartbeat, its breath. Aris knew its rhythms like her own pulse. She shoveled imported Blackstone coal into its glowing maw, watched the needles on the pressure gauges dance, and felt the deep thrum of the heat-pipes radiating through the stone floor. The city lived on this heat. Not just for warmth, but for trade. The heat-bonds in everyone’s pockets – crisp paper rectangles printed with intricate thermometers – gained or lost value based on the temperature Aris and her fellow tenders maintained at the central register deep within the furnace complex.

  Today, the air was thick and oppressive. Not just from the usual heat, but from the *wrongness* of it. A week ago, a government barge had arrived overflowing with Blackstone. "Stimulus!" the loudspeakers blared. "More coal, more heat, more wealth for all!" Aris’s boss, red-faced and sweating, ordered the bunkers filled to bursting. "Open her wide, Aris! Let ‘er roar!"

  So, Aris had. She’d fed the beast until the pressure gauges trembled near the red lines, until the heat-register glowed cherry-red, far exceeding the optimal band. The city buzzed. Heat-bond thermometers surged, numbers climbing. People held them up, grinning at the sudden, paper wealth.

  But Aris noticed the bread.

  She stopped at Old Man Hemlock’s bakery in the Artisan District every shift-end. His rye was her anchor. This morning, she presented her bond, its thermometer proudly displaying a value nearly double last week’s. Hemlock, wiping sweat from his brow in the stifling shop, glanced at it, then at his chalkboard. He sighed, erased the old price, and scrawled a new number nearly double.

  "Twice the heat, Aris," he grumbled, shoving the loaf across the counter. "But the flour? Still costs me twice the heat from the Mill District. The oven? Burns twice the fuel. This bond," he tapped her note, now warm to the touch, "it’s just… hotter air."

  Aris walked home, the heavy, humid air pressing down. The bond in her pocket felt like a lie. The government dumped coal, the furnace roared, the bonds *said* everyone was richer, but the rye loaf was the same size. The city wasn't *producing* more bread, bricks, or bolts of cloth; it was just drowning in hotter air. It was like pouring oil onto gears already spinning freely – it didn’t make the machine *stronger*, just messier, hotter, and prone to… something. She remembered her grandfather’s old saying about money being like engine oil. Now she felt it, this strange surplus – a slick, useless excess.

  Then the pipes groaned.

  It started in the Foundry District, the industrial heart. A massive shipment of brass fittings had gone out to the Docks District via the heat-pipes. When goods moved, compensating heat-energy flowed back through the network. But the Foundry was running flat-out, exporting far more than it imported. The return heat-flow should have warmed their district’s bonds. Instead, the main Foundry intake valve jammed – a seized gear, thick with grime and disuse. The return heat-energy had nowhere to go.

  Pressure built. Aris felt it first as a deep, worrying vibration through the soles of her boots in the central furnace room. Alarms began to blare – not from the furnace itself, but from the Foundry District pressure monitors. Her control board lit up like a festival gone wrong. The needle for the Foundry return line was buried deep in the red.

  Down in the Foundry, chaos erupted. Bond thermometers plummeted as the district received no compensating heat for its exports. Workshops grew unnaturally cold despite the city-wide heatwave. Workers panicked, clutching their suddenly devalued bonds. Meanwhile, the Docks District, flooded with unearned heat-energy they hadn't asked for, saw bond values skyrocket uselessly. Prices for imported goods there soared overnight, stalling trade.

  The imbalance didn't correct itself. It *ruptured*.

  With a sound like a mountain sighing, a secondary pressure-relief valve on the Foundry line blew out deep in the pipe tunnel beneath the Artisan District. Superheated steam roared into the confined space. It didn’t explode, but the scalding cloud seeped upward, warping floorboards in Hemlock’s bakery and half-a-dozen other shops. No one was badly hurt, but the terror was real. The physical heat, contained and directed, was the lifeblood of trade. Unleashed and uncontrolled, it was destruction.

  Aris, called to the tunnel with emergency crews, saw the buckled metal, the scorch marks. She felt the residual, dangerous heat radiating from the ruptured pipe. This wasn't like gold sitting inert in a vault. This "money" could burn you, burst its container.

  The Chief Engineer was shouting about rerouting flows, forcing valves. Aris, covered in grime, her hands trembling not from fear but from a dawning, visceral understanding, had a different idea. "The Foundry valve’s jammed because it never *needs* to open that wide," she yelled over the din. "They’re always sending out more! We need to *open* it manually, bleed this pressure slow, let the heat flow *back* where it belongs!"

  It was against protocol. But the Chief, desperate, nodded. Aris led the team. They wrestled the massive, rusted valve wheel. It screamed, then gave. A controlled torrent of blistering air screamed back towards the Foundry District.

  Slowly, the pressure gauges retreated from the red. The violent vibration eased. Down in the Foundry, the unnatural chill began to lift as their bonds absorbed the returning heat-energy, their value stabilizing. In the Docks, the unnatural surplus ebbed, bond values settling. The frantic price swings slowed.

  Later, exhausted, Aris stood again before Hemlock’s counter. The city still felt too hot, the air thick with the aftermath of surplus coal and near-disaster. Her bond’s thermometer still read high, but Hemlock’s chalkboard price was higher still. He handed her the rye loaf. It was warm, a little dusty from the tunnel breach repairs nearby.

  "Pressure’s down," Hemlock said, nodding towards the street where crews still worked. "Bond’s cooled a tick too. But the bread?" He shrugged. "Still costs what it costs. Real flour, real oven, real sweat. All that extra heat… just made everything harder to bear."

  Aris touched the bond in her pocket. It was still warm, but one corner was slightly blistered from the steam in the tunnel. The heat was real, physical, a force that could facilitate or destroy. Pouring more coal onto the fire hadn’t created more bread, only more danger and confusion. And the natural flow *had* tried to correct the imbalance – tried to send heat back to where the real work was being done. But the system, neglected, clogged, had nearly burst under the strain. The oil kept the wheels moving, but too much just made a mess. And unlike oil, this symbol of wealth could scald you if you mishandled it. She broke off a piece of the warm rye. It tasted like hard work, not like heat. That, she understood.
