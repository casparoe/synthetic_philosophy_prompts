prompt: |-
  I'm preparing material for a seminar on personal identity and want to move past the standard one-replica teletransporter case that everyone already knows. Please construct an original variant—call it the asymmetric multiplex bridge case—engineered to the specifications below. Keep the scenario itself to roughly one paragraph, avoid exotic physics or science-fictional devices beyond a theoretical scanner and a temporary neural-computational link, and do not invoke demons, perfect predictors, or omniscient observers.

  The scenario: Subject S enters a scanner that destroys S's original body. Two replicas are generated at distant locations. R-alpha receives about 85 percent of S's psychological profile, including all long-term autobiographical memories, but each of those memories carries a phenomenological tag marking it as recollected from an external source rather than owned in the first person. R-beta receives the remaining 15 percent—the core personality structure and all memories from the past year—but these are fully integrated with authentic first-person ownership. For exactly 72 hours after awakening, R-alpha and R-beta are joined by a direct, bidirectional substrate that allows seamless, real-time exchange of cognitive states, so that they function as a single distributed system with unified access to both memory-sets. After 72 hours, the link is permanently severed, leaving two fully independent beings.

  Your design must yield the following verdicts, and you must show the work for each. First, a bodily-continuity theorist must deny that S survives at all; state the criterion and explain why neither replica, even during the bridge, counts as the same living body or continuous organism. Second, a psychological-continuity theorist in the Parfit tradition—who allows branching—must conclude that both R-alpha and R-beta are S, but in unequal degrees; identify which is the closer continuer and justify this by appealing to first-person ownership of memories rather than to raw data volume. Third, introduce a unitary-narrative condition—survival requires the capacity to maintain a single, non-contradictory first-person autobiography without distributed scaffolding—and show that on this view S survives precisely during the 72-hour bridge period as a distributed subject, but once the link is severed S ceases to exist entirely; neither post-severance individual is S.

  Then perform the check: for each theory, state the belief or survival claim, the method or criterion applied, the relevant nearby worlds (for example, what if the bridge lasted indefinitely, or what if R-alpha lacked the ownership deficit?), and why the condition delivers its verdict. Identify the structural feature that forces the unitary-narrative view to diverge from psychological continuity—namely, the combination of temporary distributed substrate with the ownership asymmetry. Include an honest defense note: explain how a psychological-continuity theorist would attack the unitary-narrative verdict, likely by arguing that narrative unity is an epistemic or practical desideratum rather than a metaphysical condition on survival, and that R-beta possesses sufficient continuity to ground survival regardless of narrative fragmentation. Finally, say what happens if the 72-hour bridge is removed: the case should collapse back into a standard branching teletransporter problem, and the unitary-narrative view should be forced either to select one replica or to accept branching, thereby losing its distinctive result.
reasoning: |-
  We are constructing the "asymmetric multiplex bridge" case as per specifications.

  **Scenario Paragraph:**

  Subject S enters a scanner that destroys S's original body. Simultaneously, two replicas are generated at distant locations. R-alpha receives approximately 85% of S's psychological profile, including all long-term autobiographical memories, but each of these memories is phenomenologically tagged as recollected from an external source (like reading a biography) rather than being experienced in the first person. R-beta receives the remaining 15%, which includes S's core personality structure and all memories from the past year, with these memories fully integrated and bearing the authentic sense of first-person ownership. For exactly 72 hours after awakening, R-alpha and R-beta are linked by a direct, bidirectional neural-computational bridge that allows seamless, real-time exchange of cognitive states, enabling them to function as a single distributed system with unified access to both memory sets. After 72 hours, the link is permanently severed, leaving two fully independent beings.

  Now, we analyze according to the three theories:

  1. **Bodily-Continuity Theory**:
     - **Criterion**: Survival requires the continuous existence of the same living body or organism. There must be spatiotemporal continuity of the physical body.
     - **Verdict**: S does not survive at all.
     - **Explanation**: The original body of S is destroyed. Neither R-alpha nor R-beta is the same physical organism as S because they are newly created replicas. Even during the bridge period, they are two distinct bodies linked by a temporary connection. There is no single continuous body that persists from S to either replica. The link does not make them one organism; it merely allows communication.

  2. **Psychological-Continuity Theory (Parfitian, allowing branching)**:
     - **Criterion**: Survival requires sufficient psychological continuity and connectedness (with branching allowed). The strength of continuity can be a matter of degree, and first-personal ownership of memories is key to psychological connectedness.
     - **Verdict**: Both R-alpha and R-beta are S, but R-beta is the closer continuer.
     - **Explanation**: 
       - R-beta has the core personality and recent memories (past year) with full first-person ownership, which provides a strong sense of psychological continuity. This ownership is crucial for the feeling of being the same person.
       - R-alpha has the bulk of the memories (85%) but lacks first-person ownership, so these memories feel like they belong to someone else. This reduces the psychological connectedness to S.
       - During the bridge, both share a distributed system, but the ownership asymmetry remains: R-beta's memories are owned, R-alpha's are not. Thus, R-beta has a higher degree of continuity because of the quality of ownership, not the quantity of memories. After the bridge, both are independent and thus both are S (branching) but R-beta is more S.

  3. **Unitary-Narrative Condition**:
     - **Criterion**: Survival requires the capacity to maintain a single, non-contradictory first-person autobiography without distributed scaffolding. The subject must be able to integrate all experiences and memories into one coherent narrative from a first-person perspective without relying on external links.
     - **Verdict**: S survives only during the 72-hour bridge period as a distributed subject, but ceases to exist when the link is severed.
     - **Explanation**: 
       - During the bridge, the distributed system allows a unified first-person perspective that integrates both memory sets (even though R-alpha's memories are tagged as external, the link allows real-time sharing and unified access). The system functions as one subject with a single narrative because the link provides the necessary scaffolding for unity.
       - After the bridge is severed:
         - R-alpha cannot form a unitary narrative because it lacks first-person ownership of the majority of its memories (they feel like someone else's) and cannot access R-beta's recent experiences.
         - R-beta has a coherent narrative for the past year and the bridge period, but it lacks the long-term memories (which are now only in R-alpha) and cannot integrate them without the link. Moreover, the bridge period memories might include experiences from R-alpha's perspective that are not fully integrated without the link. Thus, R-beta's narrative is incomplete and not unitary with S's full life.
       - Therefore, without the distributed scaffolding, neither replica can maintain a single, non-contradictory first-person narrative that encompasses S's entire life. S exists only as the distributed system during the bridge.

  **Check for Each Theory**:

  - **Bodily-Continuity**:
    - **Belief/Survival Claim**: S does not survive.
    - **Criterion**: Continuous living body.
    - **Nearby Worlds**:
      - If the bridge lasted indefinitely: Still no continuous body, so S does not survive.
      - If R-alpha lacked the ownership deficit (i.e., had full ownership): Still no bodily continuity, so same verdict.
    - **Why the condition delivers the verdict**: The body is destroyed and replaced by two new bodies.

  - **Psychological-Continuity**:
    - **Belief/Survival Claim**: Both R-alpha and R-beta are S (branching), but R-beta is closer.
    - **Criterion**: Psychological continuity and connectedness, with emphasis on first-person ownership.
    - **Nearby Worlds**:
      - If the bridge lasted indefinitely: The distributed system would be a single person? But Parfitian view might still see two bodies with linked psychologies as two persons. However, the branching already happened at creation, so both are S. The link might enhance continuity but doesn't change the branching.
      - If R-alpha lacked the ownership deficit (had full ownership): Then both would have strong claims, but R-beta might still be closer if the core personality is more central. However, without the ownership deficit, R-alpha would be a very strong continuer too, perhaps making them more equal.
    - **Why the condition delivers the verdict**: R-beta has the core personality and recent memories with ownership, which is more central to psychological continuity.

  - **Unitary-Narrative**:
    - **Belief/Survival Claim**: S survives only during the bridge as a distributed subject.
    - **Criterion**: Capacity for a single, non-contradictory first-person narrative without distributed scaffolding.
    - **Nearby Worlds**:
      - If the bridge lasted indefinitely: Then the distributed subject would persist, so S would survive as long as the link exists.
      - If R-alpha lacked the ownership deficit: Then after the bridge, R-alpha might be able to form a unitary narrative (if it had full ownership of the long-term memories). But R-beta would still lack the long-term memories. Without the link, both would have incomplete narratives. However, if we imagine a case where both have full ownership and the bridge is severed, then both might be able to form unitary narratives (though they would be different). But in our original case, the ownership deficit in R-alpha prevents it from having a unitary narrative even if it had all the memories because they feel external. The criterion requires the narrative to be first-person and non-contradictory, and without the link, R-alpha has a narrative that feels like it's about someone else, and R-beta is missing most of the life story.
    - **Why the condition delivers the verdict**: During the bridge, the system can maintain a single narrative via the link. After, neither can.

  **Structural Feature Forcing Divergence**:
  The combination of the temporary distributed substrate with the ownership asymmetry forces the unitary-narrative view to diverge from psychological continuity. The psychological-continuity view can accommodate branching and degrees of continuity, but the unitary-narrative view requires a single narrative without distributed scaffolding. The ownership asymmetry ensures that after the bridge, neither replica can fully integrate the entire life story into one first-person narrative.

  **Honest Defense Note (from psychological-continuity theorist)**:
  A psychological-continuity theorist would attack the unitary-narrative verdict by arguing that narrative unity is an epistemic or practical concern, not a metaphysical condition for survival. They might say that what matters for survival is the psychological continuity and connectedness, which R-beta clearly has (core personality, recent memories with ownership). Even if R-beta's narrative is incomplete without the long-term memories, that doesn't mean R-beta isn't S. The narrative gap is an epistemic problem (R-beta doesn't remember everything) but not a failure of survival. Survival doesn't require having all memories, just enough connectedness. Moreover, the distributed period might be seen as a temporary fusion, but after the link, R-beta continues with enough psychological connections to be S. Thus, the unitary-narrative condition sets an overly stringent requirement that conflates practical identity with metaphysical identity.

  **What If the Bridge is Removed?**:
  If the 72-hour bridge is removed (so the replicas are created without any link and are independent from the start), then the case collapses to a standard branching teletransporter problem. The unitary-narrative view would then be forced to either:
     - Select one replica (likely R-beta, because of the first-person ownership) as S, thereby rejecting branching and adopting a closest continuer view, or
     - Accept branching and say both are S (but this would lose the distinctive result that S survives only during the bridge and then ceases to exist). 

  Given that the unitary-narrative condition requires a single narrative without distributed scaffolding, and without the bridge there is no distributed subject at all, it would likely have to choose one replica (if it can) or deny survival altogether. But without the bridge, the ownership asymmetry remains: R-alpha has memories without ownership, R-beta has ownership but only of a small part. So the unitary-narrative view might still deny that either is S because neither has a complete, unitary narrative of S's life. Alternatively, it might pick R-beta as having the best narrative (albeit incomplete) because of ownership. This ambiguity shows that without the bridge, the unitary-narrative view loses its clean verdict of S surviving only temporarily as a distributed entity and then ceasing to exist.
answer: |-
  ### Asymmetric Multiplex Bridge Case

  **Scenario:** Subject S enters a scanner that annihilates S's original body. Two replicas are instantaneously generated: R-alpha receives 85% of S's psychological profile, including all long-term autobiographical memories, but each memory carries an indelible phenomenological tag marking it as externally sourced (like recalling a documentary about oneself). R-beta receives the remaining 15%—S's core personality structure and all memories from the past year—with these memories fully integrated and bearing authentic first-person ownership. For exactly 72 hours post-awakening, R-alpha and R-beta share a direct, bidirectional neural-computational link enabling real-time cognitive state exchange, forming a unified distributed system with seamless access to both memory-sets. After 72 hours, the link severs permanently, leaving two independent beings.

  ---

  ### Verdicts by Theory

  1. **Bodily-Continuity Theory**  
     - **Criterion**: Survival requires unbroken spatiotemporal continuity of the same living organism (e.g., biological processes).  
     - **Verdict**: S does not survive at all.  
     - **Explanation**: The scanner destroys S's body, terminating the organism. R-alpha and R-beta are newly created replicas, not continuous with S's biological processes. Even during the bridge, they remain two distinct bodies linked externally—no shared metabolism, growth, or physical unity exists. The link is computational, not biological; thus, neither replica constitutes S's living body.  

  2. **Psychological-Continuity Theory (Parfitian)**  
     - **Criterion**: Survival requires robust psychological continuity (connectedness of beliefs, desires, memories), allowing branching. Strength depends on qualitative factors like first-person ownership, not just data volume.  
     - **Verdict**: Both R-alpha and R-beta are S, but R-beta is the closer continuer.  
     - **Explanation**: R-beta possesses S's core personality and recent memories with *authentic first-person ownership*, enabling stronger psychological connectedness (e.g., "I experienced this"). R-alpha's memories lack this ownership (e.g., "I know this happened to someone else"), weakening connectedness despite greater data. The bridge enhances continuity temporarily, but ownership asymmetry makes R-beta more directly continuous with S.  

  3. **Unitary-Narrative Condition**  
     - **Criterion**: Survival requires the capacity to maintain a single, non-contradictory first-person autobiography *without distributed scaffolding*.  
     - **Verdict**: S survives only during the 72-hour bridge as a distributed subject but ceases to exist post-severance.  
     - **Explanation**: The bridge enables a unified narrative by integrating R-alpha's tagged memories and R-beta's owned experiences into one coherent "I." Post-severance, R-alpha's narrative is fragmented (memories feel alien), while R-beta's is incomplete (lacks long-term history). Neither can sustain S's full autobiography without the link. Thus, S exists solely as the distributed system during unity.  

  ---

  ### Check: Theory Analysis  

  | Theory                  | Belief/Survival Claim                               | Criterion                                      | Relevant Nearby Worlds                                                                 | Why Verdict Holds                                                                 |
  |-------------------------|----------------------------------------------------|-----------------------------------------------|----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Bodily-Continuity**   | S does not survive.                                | Unbroken physical organism.                   | If bridge lasted indefinitely: Still two bodies, no organismal unity.                  | Replicas are new entities; destruction severs bodily continuity irrevocably.     |
  | **Psychological**       | Both replicas are S (branching); R-beta closer.    | Psychological continuity + ownership weight.  | If R-alpha lacked ownership deficit: R-beta still closer due to core self-ownership.   | First-person ownership in R-beta deepens connectedness; asymmetry prioritizes quality over quantity. |
  | **Unitary-Narrative**   | S survives only during bridge.                     | Single autobiography without scaffolding.     | If bridge lasted indefinitely: S survives as distributed subject.                      | Post-severance, neither replica has full narrative capacity; scaffolding is essential for unity. |

  ---

  ### Structural Feature Forcing Divergence  
  The **temporary distributed substrate combined with ownership asymmetry** creates a "hybrid subject" during the bridge, satisfying the unitary-narrative criterion via real-time integration. However, psychological continuity tolerates post-severance branching because R-beta retains *enough* owned psychology (e.g., core self) to ground survival, even with narrative gaps. The unitary-narrative view rejects this, demanding *lifelong* unity without external support.

  ---

  ### Honest Defense Note  
  A psychological-continuity theorist would attack the unitary-narrative verdict as conflating *metaphysical survival* with *epistemic/practical coherence*. They argue:  
  - Survival hinges on psychological connectedness (e.g., R-beta inherits S's core intentions), not narrative perfection.  
  - Narrative unity is a desideratum for agency or social identity, not an ontological condition. Fragmentation (e.g., amnesia) doesn’t negate survival if key psychological threads persist.  
  - Thus, R-beta’s ownership of S’s core self suffices for survival, irrespective of distributed scaffolding or R-alpha’s deficits.  

  ---

  ### Bridge Removal: Collapse to Standard Case  
  If the 72-hour bridge is excised, replicas awaken independently.  
  - **Psychological continuity**: Branches normally—both R-alpha and R-beta are S (unequally).  
  - **Unitary-narrative**: Forced to either (a) select R-beta (due to ownership) as the sole survivor, rejecting branching, or (b) accept branching and lose its distinctive "temporary survival" result. Without the bridge, distributed unity vanishes, exposing the theory’s inability to handle asymmetry without scaffolding.  

  ---  
  This case isolates how ownership asymmetry + temporary unity challenges theories to diverge on narrative coherence versus psychological connectedness. Use it to debate whether survival requires a "single story" or merely connected mental states.
