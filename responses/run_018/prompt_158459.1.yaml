prompt: |-
  You are an expert moral philosopher specializing in applied ethics, institutional decision-making, and the philosophy of philanthropy. Please think carefully and step-by-step. Before giving your final answer, briefly brainstorm the main conceptual distinctions that could be relevant—such as individual versus institutional moral agency, career replaceability, complicity, epistemic humility, direct versus indirect impact, and the ethics of quantification.

  Here are my gut verdicts on concrete cases. I want to know whether there is a single principle, or a small family of principles, that captures all of them, or whether I have to overturn at least one.

  Case 1. A talented graduate takes a high-paying job in quantitative finance, lives modestly, and donates half her income to rigorously evaluated global health charities. I think this is ethically admirable—perhaps not obligatory, but clearly good.

  Case 2. A well-meaning nonprofit abandons a long-running literacy program—whose benefits are diffuse and hard to quantify—in order to switch entirely to deworming campaigns, solely because donors now demand randomized-controlled-trial evidence of impact per dollar. I think this is a damaging institutional distortion; the nonprofit should have resisted.

  Case 3. The same graduate from Case 1 instead takes a lower-paying direct-impact job at one of those global health charities. I think this is also admirable, and I do not think she was required to do it.

  Case 4. A major foundation announces it will fund only projects that can report a cost-effectiveness figure in quality-adjusted life years per dollar within twelve months. I think this policy is epistemically reckless and morally harmful.

  Case 5. A person works in fossil-fuel consulting, earns very high compensation, and donates fifty percent to climate mitigation, calculating that the net carbon reduction exceeds the harm of his work. I think this is not okay—there is something corrupt about the career choice that the donation does not wash away.

  Case 6. A small community organization refuses to collect outcome metrics, arguing that its work—restoring local social trust—cannot be captured by short-term indicators, and it relies on long-term resident judgment. I think this refusal is defensible, and potential donors should respect it.

  Now, here is the tension I keep returning to. Case 1 praises earning-to-give in a high-income, replaceable career. Case 5 condemns earning-to-give in a career that seems structurally harmful, even with similar donation ratios. Meanwhile, Cases 2 and 4 condemn institutional over-reliance on quantification, yet Case 1 seems to depend on exactly the kind of quantifiable charity (bed nets, deworming) that makes the donation strategy attractive.

  Please do the following, writing in American English and without providing a bibliography, reading list, or citations:

  1. State the principle, or the competing candidates, that best captures my verdicts. For each candidate, specify exactly which case motivates each clause, and state what verdict it delivers on every case above.

  2. Be honest about which of my verdicts each principle cannot accommodate. In particular, address the Case 1 versus Case 5 tension and the tension between valuing quantifiable giving in Case 1 and rejecting quantification mandates in Cases 2 and 4.

  3. Predict my verdict on the following new case: A software engineer works at a company building recommendation algorithms that are ethically ambiguous but not obviously catastrophic. She donates forty percent of her salary to a mix of quantifiable global health interventions and unquantifiable local advocacy. She could take a lower-paying job at a nonprofit, but believes her donations do more good. Would I find this admirable, corrupt, or somewhere in between? Say what each of your proposed principles predicts, and which prediction seems best.

  4. Identify one further hypothetical case—one I have not listed—that would best distinguish between your leading principles.
reasoning: |-
  Okay, the user is posing a complex ethics problem involving moral judgments across different career and donation scenarios. They've listed six cases with their intuitive verdicts and want to know if there's a consistent principle underlying them all. The tension lies between approving earning-to-give in finance (Case 1) but condemning it in fossil fuels (Case 5), while also criticizing institutional quantification mandates (Cases 2,4) despite relying on quantification in Case 1.

  Hmm, this requires careful disentangling of several philosophical concepts. The key distinctions that come to mind are: direct vs indirect harm (Case 5 involves direct contribution to climate harm), institutional vs individual agency (Cases 2/4 show how quantification demands distort organizational missions), and the limits of quantifiability (Cases 2/6 demonstrate contexts where metrics fail). 

  The user seems to be wrestling with effective altruism principles while recognizing their limitations. Their concern about "structural complicity" in Case 5 suggests they believe some harms can't be offset by donations. Meanwhile, their defense of unquantifiable work in Cases 2/6 shows value for local knowledge and non-instrumental goods.

  For the proposed principles, I'm considering two candidates: The first would prioritize net positive impact but with constraints against participating in structural harm and respecting epistemic limits. The second would emphasize institutional role morality - what's appropriate differs based on whether you're an individual donor or an institution setting policies.

  The software engineer case (new Case 7) is tricky. If her work isn't structurally harmful like fossil fuels, and she donates substantially to both quantifiable and unquantifiable causes, the principles would likely call this admirable - similar to Case 1 but more diversified. This maintains consistency with approving Case 1 while distinguishing it from Case 5.

  To really test these principles, I'll design a new Case 8: Working in surveillance tech that's legal but erodes privacy, donating to digital rights groups. This pits complicity against offset potential more sharply than Case 5, since the harm is less direct than climate change. How the principles handle this would reveal their thresholds for "structural harm."
answer: |-
  Here’s a principled framework reconciling your verdicts, followed by analysis of tensions, predictions, and a distinguishing case:

  ### 1. Proposed Principle (with constraints)  
  **"Maximize expected net good, subject to:**  
  **(a) Avoid direct complicity in structural harm (Case 5);**  
  **(b) Respect institutional purpose and epistemic limits (Cases 2, 4, 6);**  
  **(c) Permit individual discretion in means (Cases 1, 3)."**  

  **Verdicts on Cases:**  
  | Case | Principle’s Verdict | Matches Your Verdict? |  
  |------|----------------------|------------------------|  
  | 1    | Admirable (satisfies net good + no structural harm) | Yes |  
  | 2    | Damaging (violates b: abandons core purpose for quant demands) | Yes |  
  | 3    | Admirable (direct impact aligns with a-c) | Yes |  
  | 4    | Harmful (violates b: imposes reductive metrics) | Yes |  
  | 5    | Corrupt (violates a: complicit in fossil fuel harm) | Yes |  
  | 6    | Defensible (satisfies b: rejects inappropriate quantification) | Yes |  

  ### 2. Key Tensions Addressed  
  - **Case 1 vs. Case 5:** Your objection to fossil fuel work isn’t about quantification but *structural complicity*. Finance (Case 1) is replaceable labor in a morally neutral system; fossil fuels (Case 5) directly sustain a harmful industry. Donations can’t "offset" participation in inherently destructive structures.  
  - **Quantification Tension (Case 1 vs. Cases 2/4):** You endorse *using* quantification *where appropriate* (global health RCTs) but reject its *institutional imposition* when it distorts missions (literacy programs) or ignores uncertainty (QALY mandates). Case 1 leverages quantification voluntarily; Cases 2/4 force it onto domains where it erases value.  

  **Unavoidable Conflict?** None — your verdicts hold if:  
  - Complicity constraints trump pure consequentialism (resolving Case 5).  
  - Epistemic humility limits quantification’s scope (resolving Cases 2/4 vs. Case 1).  

  ### 3. Prediction for New Case  
  **Case 7:** Software engineer in ethically ambiguous tech, donates 40% to mixed causes, declines nonprofit job.  

  - **Principle’s Prediction:** *Admirable* (unless the work involves structural harm).  
    - (a) Not complicit in *structural harm* like fossil fuels (ambiguous ≠ catastrophic).  
    - (b) Mixes quantifiable/unquantifiable donations, respecting epistemic limits.  
    - (c) Net impact likely positive; discretion allowed.  
  - **Your Likely Verdict:** *Admirable* (analogous to Case 1). The absence of clear harm and diversified giving aligns with your constraints.  

  ### 4. Distinguishing Hypothetical Case  
  **Case 8:** A lawyer works for a corporate firm that lobbies against environmental regulations but uses precise metrics to prove her donations (to conservation NGOs) offset the policy harm. She is highly replaceable.  

  - **Principle’s Verdict:** *Corrupt* (violates constraint (a): direct complicity in structural harm, even with "offset").  
  - **Alternative Consequentialist Principle:** *Admirable* (if net impact is positive).  
  - **Why It Distinguishes:** Tests whether structural complicity (lobbying) is impermissible regardless of calculable offsets. Your rejection of Case 5 suggests you’d condemn this, favoring the constrained principle over pure consequentialism.  

  ### Conclusion  
  Your judgments are best captured by **constrained consequentialism**: maximize good *within boundaries* of non-complicity and epistemic responsibility. The tensions dissolve by distinguishing:  
  - Harmful vs. neutral industries (individual complicity),  
  - Voluntary vs. coercive quantification (institutional integrity).  
  This framework preserves all your verdicts while explaining the Case 1/Case 5 divergence.
