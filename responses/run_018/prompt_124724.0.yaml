prompt: |-
  I'm a journalist covering science and ideas, and I was arguing with a friend last week about all that WEIRD psychology work—how Western, educated samples turn out to be moral outliers and what that actually does to claims about moral objectivity. The usual debate splits into "objectivity is dead" versus "core values like harm and fairness are universal anyway," but I think both sides miss a hidden variable: do people across cultures differ in their reflexive moral calabration, meaning their ability to distinguish "this is wrong" from "my group just says it's wrong"? I want to pitch a six-month philosophical project—not a big empirical survey, but a conceptual workshop or foundation grant—that asks whether this meta-cognitive skill is itself culturally distributed and what that means for objectivity debates.

  I need the proposal to state the exact question precisely, explain why the standard objectivity-versus-relativism standoff doesn't settle it, lay out the method (probably conceptual analysis paired with structured comparison of folk moral reports across traditions?), describe a deliverable that would actually help people deciding on moral-education or integration policy, and include an honest assessment of failure conditions and realistic scope for half a year. Don't bother with a bibliography or reading list, I'll fill references in myself.

  Write it up as exactly five numbered items, each just one or two sentences, with no introduction and no conclusion—just the bare bones. I need it tight because I'm sending it to an editor who hates fluff and I dont want to waste space on throat-clearing.
reasoning: |-
  Okay, the user is a journalist covering science and ideas, working on a proposal about moral objectivity. They argue that existing debates miss a hidden variable: the meta-cognitive skill of distinguishing personal moral beliefs from group norms. Their goal is a six-month project exploring this skill's cultural distribution and its implications. 

  The user needs a super concise pitch—five bullet points with zero fluff. Their editor hates throat-clearing, so every word must count. Key elements: precise question, critique of current debates, method, practical deliverable, and honest failure conditions. 

  Hmm... they're rejecting both "objectivity is dead" and "universal core values" stances. Smart. The metacognition angle feels fresh—it's about how people process morality, not just what they believe. For the method, pairing conceptual analysis with folk reports makes sense; avoids heavy empiricism but stays grounded. 

  The deliverable must help policymakers... tricky. Maybe a diagnostic toolkit? Something that identifies where meta-skills might clash in multicultural settings. Failure risks: oversimplifying cultural categories or getting stuck in philosophical weeds. Gotta flag those. 

  User's clearly seasoned—they know exactly what their editor wants. No bib, no intros, just meat. Respect. Their frustration with standard debates is palpable; this pitch needs to feel like a scalpel. 

  ...Wait, should the question include "reflexive calibration"? Their term, might be jargon. But they used it deliberately, so keep it. Precision over accessibility here. 

  Policy angle is crucial. Not just theory—something for moral education designers. "Integration readiness" framing could work; implies practical assessment without prescription. 

  Failure conditions... yes, cultural lumping is deadly. And six months is tight for cross-tradition analysis. Must admit that upfront. 

  Final check: five points, razor-sharp. Question → gap → method → use → risks. Done.
answer: |-
  Here are the five numbered items:

  1. **Core Question**: Does the capacity for meta-cognitive moral calibration—the reflexive ability to distinguish universally held moral intuitions from locally conditioned norms—vary significantly across cultures, and what does this imply for claims of moral objectivity?  
  2. **Gap in Existing Debate**: Standard objectivity/relativism frameworks neglect this calibration skill, assuming either universal access to core intuitions or dismissing objectivity solely due to cultural variation in *content*, not in the *capacity* to discern its source.  
  3. **Method**: Conceptual analysis of "calibration" paired with structured comparison of folk meta-ethical reports (e.g., discourse on taboo violations, moral disagreement, rule origins) across diverse philosophical/religious traditions to map potential variations in calibration emphasis or expression.  
  4. **Deliverable**: A diagnostic framework identifying contexts where calibration skill gaps likely hinder moral discourse (e.g., integration policy, moral education design), enabling targeted interventions rather than broad relativist/objectivist assumptions.  
  5. **Failure Conditions & Scope**: Risk of overgeneralizing traditions or conflating expressed concepts with underlying capacity; realistic six-month output is a typology of calibration-relevant concepts across 3-4 major traditions, identifying key research questions for empirical testing.
