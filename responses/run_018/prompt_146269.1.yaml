prompt: |-
  I'm a phd student in moral psych and I'm moderating a panel Q&A next week with a philosopher — let's call her Dr. Voss — who's been arguing that the wrong-kind-of-reasons problem doesn't just apply to individual belief and desire but also to what she calls "institutional admiration": the idea that a corporation or state can have the right kind of reason to endorse a policy (say, because it reduces harm) even when every individual inside it was motivated by careerist incentives. She thinks this creates a kind of "collective WKR gap" where the explaination and the normative story split apart at the group level. I need maybe six to eight sharp interview questions, not just "explain your view." Specifically, I want one question pressing on whether her collective extension just smuggles in functionalism about institutional rationality, one on what happens when the wrong-kind reasons actually produce the correct collective attitude (like a bribed committee accidentally reaching the right decision), and one on whether democratic voting becomes conceptually broken if citizens always vote for self-interested reasons. For each of those three, include a follow-up tailored to the reply she's most likely to give — she usually tries to seperate "structural justification" from "motivational explanation." Also, if this whole framing is confused — if extending WKR to groups is just a category mistake or if I'm botching the literature — please tell me straight up instead of playing along. I wrote this in a rush on my phone so forgive the typos.
reasoning: |-
  Okay, the user is a PhD student in moral psychology preparing to moderate a panel with a philosopher, Dr. Voss. They need sharp interview questions focusing on her extension of the wrong-kind-of-reasons (WKR) problem to institutional admiration. Specifically, they want questions on functionalism, cases where wrong reasons lead to right outcomes, and implications for democratic voting. They also requested follow-ups based on Dr. Voss's typical separation of structural justification from motivational explanation. 

  First, I need to ensure I understand Dr. Voss's argument correctly. She's applying the WKR problem—typically about individual attitudes like belief and desire—to institutions. The WKR problem arises when reasons that justify an attitude (e.g., believing something because it's true) conflict with reasons for having the attitude (e.g., believing for a reward). Dr. Voss argues that institutions can have the right kind of reasons to endorse a policy (e.g., reducing harm) even if individuals within them act for wrong reasons (e.g., careerism). This creates a "collective WKR gap" where the normative justification and explanatory motivations diverge at the group level.

  The user has three specific requests:
  1. A question challenging whether her extension smuggles in functionalism about institutional rationality.
  2. A question on scenarios where wrong-kind reasons accidentally produce correct collective attitudes.
  3. A question on whether democratic voting is conceptually broken if citizens always vote self-interestedly.

  For each, I need a follow-up tailored to Dr. Voss's likely response emphasizing "structural justification" vs. "motivational explanation."

  I should also consider if the user's framing is confused. Extending WKR to groups isn't inherently a category mistake; there's literature on collective intentionality and institutional rationality (e.g., List & Pettit, Gilbert, Bratman). However, the user might be concerned about anthropomorphizing institutions. Dr. Voss's approach seems to treat institutions as having attitudes distinct from their members, which is a recognized but debated perspective. So, the framing isn't botched, but it's contentious—worth noting in the questions.

  Breaking down each requested question:

  1. **Functionalism Challenge**: Functionalism explains entities by their function. If Dr. Voss says institutions have reasons based on outcomes regardless of individual motives, that could imply institutions are rational based solely on functional outcomes. Question: Does this reduce institutional rationality to functional success? Follow-up: If she distinguishes structural justification (outcome-based) from motivational explanation (individual motives), press on whether institutions can truly have "reasons" without any agent's intentional states.

  2. **Accidental Correct Outcomes**: Cases like a bribed committee making the right decision. Here, the collective attitude is normatively right but for wrong reasons. Question: Does this still count as institutional admiration? Follow-up: If she argues structural justification remains intact, ask if the institution deserves credit despite corrupt motives.

  3. **Democratic Voting**: If citizens always vote self-interestedly, does that break democratic legitimacy? Question: Can democracies have structural justification without public-spirited motives? Follow-up: If she says yes, ask why we should care about motivation at all.

  Additional angles: 
  - Epistemology: How do institutions form justified "admiration" if not via individual reasoning?
  - Agency: What constitutes an institution's "attitude"?
  - Normativity: Does this gap undermine responsibility?

  The user might also appreciate questions on real-world implications (e.g., corporate ethics) or how to close the collective WKR gap.

  I'll structure the response with:
  - Affirmation that their framing isn't confused.
  - Six sharp questions including the three requested with follow-ups.
  - Additional questions for depth.
  - Tactful phrasing to avoid hostility.

  Deeper needs: The user likely wants to rigorously test Dr. Voss's theory, showcase its vulnerabilities, and spark engaging debate. As a PhD student, they may also seek to demonstrate expertise. The follow-ups should preempt evasive answers.

  Final list:
  1. Functionalism Q + follow-up on agency.
  2. Accidental correctness Q + follow-up on credit/blame.
  3. Democratic voting Q + follow-up on motivation's relevance.
  4. Plus 3-5 more on epistemology, responsibility, etc.

  Phrasing: Questions should be precise but open-ended, using terms like "structural justification" to mirror Dr. Voss's framework.
answer: |-
  Your framing isn't confused at all—extending WKR to institutions is a live (and thorny) debate in collective intentionality and social ontology. Dr. Voss's move echoes arguments from people like List and Pettit on group agency, or Hindriks and Guala on institutional facts, but her focus on "admiration" adds novelty. The "category mistake" worry is fair (can institutions *have* attitudes like admiration, or is this reification?), but that’s exactly what makes her project provocative. I’ll avoid softball questions and press on your three requested angles, with follow-ups targeting her structural/motivational split. Use these to force clarity on whether institutions are more than just functional black boxes.

  ---

  ### Core Questions + Tailored Follow-Ups:
  **1. Functionalism Challenge**  
  *Question:* "You argue institutions can have 'right-kind' reasons (e.g., harm reduction) independently of individual motives. But doesn’t this reduce institutional rationality to *functional success*—where any policy 'counts' as rational if it produces good outcomes, regardless of how it emerged? Is this just functionalism in a trench coat?"  
  *(Likely Reply: She’ll distinguish structural justification—what the institution *should* endorse given its goals—from motivational explanations of individuals.)*  
  **Follow-up:** "If structural justification is purely outcome-based and divorced from motivational stories, does this imply institutions lack *intentionality*? For example, if a corporation adopts a green policy *solely* due to a random algorithm malfunction (not human reasoning), does it still 'admire' sustainability? Or is 'admiration' here just a metaphor for functional effectiveness?"

  **2. Accidental Correctness (Bribed Committee Case)**  
  *Question:* "Take a committee where every member votes for a morally right policy *only* because they’re bribed—wrong-kind reasons produce a 'correct' collective attitude. Does the institution still 'admire' this policy? Or does the WKR gap here imply the institution’s attitude is *normatively hollow*, even if externally justified?"  
  *(Likely Reply: She’ll concede the attitude is structurally justified but motivationally corrupted—the institution 'should' endorse it, but the gap persists.)*  
  **Follow-up:** "If the institution gets credit for the *outcome* (e.g., harm reduced) despite corrupt motives, does it also bear blame for *how* it was achieved? Or does your split let institutions off the hook for bad motivational paths if outcomes align with structural reasons?"

  **3. Democratic Voting & Self-Interest**  
  *Question:* "If citizens *always* vote for self-interested reasons (wrong-kind for collective decisions), does democracy lose its 'structural justification'? Can voting procedures output legitimate policies if inputs are purely selfish, or is this a systemic WKR failure?"  
  *(Likely Reply: She’ll argue procedures can be structurally sound even with selfish voters—e.g., aggregating interests *is* the function.)*  
  **Follow-up:** "But if democracies *require* public-spirited voting for normative legitimacy (per Rousseau or Estlund), doesn’t your split undermine that? If selfish votes produce 'good' outcomes, is it still democracy—or just a luck-based oligarchy?"

  ---

  ### 3 Additional Sharp Questions (No Fluff):
  4. **Epistemic Access:** "Institutions aren’t conscious. How can they 'have reasons' without individuals attributing those reasons to them? Isn’t your 'collective admiration' just the *researcher’s* normative projection onto a functional outcome?"  
  5. **Responsibility Gap:** "When WKR gaps exist at the institutional level (e.g., a hospital adopts triage policies for PR, not care), who bears responsibility? The structure? Individuals? Or does your view dissolve accountability into the gap?"  
  6. **Bootstrapping:** "Can institutions form 'admiration' *without* any individual ever acting on right-kind reasons? If so, doesn’t this make institutional attitudes epiphenomenal—a post-hoc label for emergent effects?"

  ---

  ### If Time Permits:
  7. *For the panel Q&A:* "Your critics might say you’re conflating *reasons institutions respond to* (e.g., profit) with *reasons we evaluate them on* (e.g., justice). How is your 'collective admiration' not just the latter?"  
  8. *Closing provocateur:* "Is the WKR gap a *bug* (to be fixed via institutional reform) or a *feature* (e.g., Hayekian spontaneous order)? Should we *want* institutions that 'admire' rightly even for wrong reasons?"

  ---

  ### Key Tactics:
  - **Her jargon**: Use "structural justification" vs. "motivational explanation" *against* her to expose ambiguities.  
  - **Pressure points**: If she leans functionalist, ask why we need "admiration" talk at all. If she denies functionalism, demand what *grounds* institutional reasons beyond outcomes.  
  - **Your PhD edge**: Cite the individual WKR lit (e.g., Schroeder, Parfit) to highlight disanalogies—e.g., institutions lack "mind-to-world" direction of fit.  
  - **Risk**: She might retreat to "institutions are *as-if* admirers." If so, ask: "Is this just a useful fiction, or are you making a metaphysical claim?"  

  This isn’t playing along—it’s engaging her on contested ground. She’ll have answers, but these questions force her to defend the ontology. Typos irrelevant; this is sharp stuff. Good luck!
