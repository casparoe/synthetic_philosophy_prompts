  anyway, if you were advising a grad student with like 4 years and a background in philosphy of science but not physics, which open questions in structural realism should they actually prioritize? i'm not asking for a bibliography or anything. i want a defended agenda: rank the questions by what's upstream, what's tractible without being a physicist, and what result would actually change your mind about the whole program. tell me which ones are overrated or dead ends, and if there's a weird ignored corner—like that biological causation thing—that actually matters for the big picture, throw it in and defend its place.
