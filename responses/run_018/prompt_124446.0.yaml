prompt: |-
  In the world of modular analog synth restoration people talk about the 'Theseus module' problem all the time: you replace every capacitor and resistor over ten years, but the seriel number stays and collectors treat it as the same unit. They use this to argue that for physical artifacts identity is just a legal/social tag with no deeper metaphysical weight — the 'same synth' is just whatever the community agrees to call by that seriel number. I want to audit this analogy: what in the synth world maps onto the original planks, the replaced parts, the builder's original design, the sound it produces, and the collector's agreement? Where does it break — especially around the idea that you could rebuild the exact same synth from the discarded old parts and now have two? Does the analogy actually support the 'purely social' conclusion, or does it smuggle in that physical continuity doesn't matter just because the parts are fungable? And if the conclusion doesn't survive, what's a better analogy for artifact identity — maybe something like a musical score vs its performances?

  Give me the correspondence table first, then the disanalogies that matter for the argument, then wether the social-tag conclusion holds up or collapses once the mapping is honest.
