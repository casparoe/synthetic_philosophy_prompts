  Third: meta-amendment risks. Allowing the AI to alter amendment procedures creates a Godelian nightmare. Imagine it tweaks its own governing rules to simplify future self-modification. Now the guardian becomes a self-optimizing black box—precisely what constitutional safeguards should prevent.

