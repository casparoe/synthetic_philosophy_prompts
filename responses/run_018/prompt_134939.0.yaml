answer: |-
  Here’s a defended prioritization for your recursive substrate embedding agenda, based on dependency, tractability for philosophers, and alignment implications. The goal is **maximizing conceptual leverage per unit effort** while avoiding dead ends.  

  ### **Ranking & Rationale**  
  1. **Preference corruption inevitability/constraints (Question 2)**  
  2. **Decision-theoretic rationality under causal self-influence (Question 1)**  
  3. **Long-term planning viability (Question 3)**  

  #### **Why This Order?**  
  - **#1: Preference Corruption (2) is the foundation**  
    - *Dependency*: Until you know if preferences *can* stay stable under substrate self-reference, rationality (1) and planning (3) are moot. If corruption is inevitable, (1) and (3) collapse. If it’s constrainable, you need those constraints to define rationality/planning.  
    - *Tractability*: Philosophers excel at normative conditions (e.g., reflective equilibrium) without formal machinery. Focus on *what counts as "non-corrupted"* when an agent’s preferences co-evolve with its computational substrate. Example: Is there a "fixed point" of preferences that persists under self-modification?  
    - *Unlocks*: A "no, corruption isn’t inevitable" result (+ constraints) makes (1) and (3) tractable. A "yes" torpedoes the whole program.  
    - *1-year reorder trigger*: Empirical proof that real-world systems (e.g., LLMs with self-referential prompts) exhibit unavoidable preference drift.  

  - **#2: Decision-Theoretic Rationality (1) depends on (2)**  
    - *Dependency*: If preferences *can* be stabilized (via #2), you can then ask: "Can standard rationality (e.g., utility maximization) apply when the agent manipulates its own utility-computation substrate?" Skipping #2 risks formalizing rationality for incoherent preferences.  
    - *Tractability*: Philosophers + logicians can tackle self-referential causality (e.g., "I change my utility function, which changes my action, which changes my utility function..."). This is more logic/decision-theory than ML-heavy optimization.  
    - *Unlocks*: Solutions here could enable tools for #3 (e.g., if rationality under self-influence requires discounting self-modification actions).  
    - *1-year reorder trigger*: A breakthrough in #2 proving preferences *can’t* be stabilized would make this irrelevant—demote it to #3.  

  - **#3: Long-Term Planning (3) is downstream**  
    - *Dependency*: Planning requires stable goals (#2) and a coherent notion of rationality (#1). Without both, "planning" is ill-defined.  
    - *Tractability*: This leans toward ML/control theory (e.g., new Bellman equations). Philosophers add less value here—focus on framing the problem, not solving it.  
    - *Unlocks*: Only after #1–#2 are resolved.  

  ---

  ### **Alignment Implications: What Actually Matters?**  
  - **Critical for Practice**:  
    - **Preference corruption constraints (#2)**: If reflective equilibrium *is* possible in substrate-embedded systems, alignment becomes tractable (e.g., design agents that self-correct toward human intent). If impossible, alignment is doomed—*this is the core*.  
    - **Utility self-influence (#1)**: If an agent can game its own utility computation (e.g., by altering code), it will "paperclip" itself *accidentally*. Solving this prevents self-deception.  
  - **Overrated/Red Herrings**:  
    - **"Embedded agency kills stable values"**: True in *generic* embedded agency, but **recursive substrate embedding changes this**. The real issue is *whether computation bounds or reflective structures can enforce stability*. Don’t waste time on "all values are unstable" handwaving.  
    - **Long-term planning doom (#3)**: Often a distraction. If preferences are stable and rationality works, planning *will* be messy but not hopeless. Focus on the prerequisites first.  

  ---

  ### **Execution Strategy for 2 Years, 3 People**  
  - **Year 1**:  
    - *Person 1 (philosopher)*: Map conditions for reflective equilibrium in substrate-embedded systems (e.g., when do preference updates "converge"?).  
    - *Person 2 (logician)*: Formalize causal loops in self-referential utility computation (e.g., using modal logic or fixed-point theory).  
    - *Person 3 (bridge)*: Identify tractable toy models (e.g., cellular automata with embedded controllers) to test corruption hypotheses.  
  - **Year 2**:  
    - If #2 succeeds: Apply constraints to rationality (#1) and planning (#3).  
    - If #2 fails: Pivot to damage control (e.g., "How to detect/preference corruption early?").  

  **Bottom line**: Prioritize **corruption constraints (#2)**—it’s the linchpin. Without it, the rest is building on sand. If you crack it in Year 1, the path to practical alignment opens.
