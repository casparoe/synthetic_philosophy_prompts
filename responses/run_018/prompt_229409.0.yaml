prompt: |-
  You are a professional philosopher specializing in the philosophy of psychiatry and the philosophy of classification, with a particular interest in how labels feed back into the people they are applied to. I am a software engineer with no formal philosophy background, so please do not assume I know the literature; just engage with the cases and the principle. I work on a clinical decision-support tool that suggests psychiatric screening labels for primary-care clinicians, and I keep running into the same puzzle. A label is not a neutral description. Once applied, it changes how clinicians interpret a patient's behavior, how the patient understands themself, and how the patient then behaves; that changed behavior can make the label more or less accurate over time. I have seen this called a looping effect. I have been writing down my own verdicts about concrete cases, and I want to know whether they add up to a coherent principle or whether I am just responding case by case.

  Please take your time. Start by brainstorming several candidate principles before committing to one. Then state your best principle, or a small set of candidate principles, in precise but non-technical language. For each clause of the principle, tell me which of my cases motivates it. Test the principle against every case below, tell me which of my verdicts it preserves and which it forces me to overturn, and then apply it to the two further cases at the end.

  Here are my cases.

  C1. A 16-year-old begins avoiding social situations and reads a lot about social anxiety online. He starts saying he has social anxiety disorder. His parents treat this seriously, he declines invitations by citing the disorder, and within a year his avoidance is much worse. Verdict: applying the label was bad here, because it helped turn ordinary and possibly transient shyness into an identity that entrenched the avoidance.

  C2. A 34-year-old with similar underlying symptoms—avoidance, blushing, fear of judgment—is formally diagnosed with generalized anxiety disorder by a psychiatrist. The diagnosis is a relief: it explains years of difficulty, ends self-blame, and connects him to treatment that helps. Verdict: applying the label was good here.

  C3. At a school where ADHD diagnoses are common, an energetic 8-year-old is quickly referred and diagnosed. Once labeled, his restlessness is re-read by teachers as a symptom rather than as boredom with an under-stimulating classroom, and he starts describing himself as someone who cannot focus without medication. Verdict: applying the label was bad here.

  C4. A 26-year-old with a genuine lifelong history of focus and organization problems receives an ADHD diagnosis. Medication measurably improves his ability to hold a job, and he says the diagnosis gave him a framework and tools rather than an excuse. Verdict: applying the label was good here.

  C5. A woman is diagnosed with borderline personality disorder after a brief emergency-room visit following a single episode of self-harm. The label stays in her chart for years. She reports that later clinicians stop taking her physical complaints seriously and describe her as manipulative. Verdict: applying the label was bad here—not because the category is always bad, but because it was assigned quickly on thin evidence and then acted as a permanent filter that distorted her later care.

  C6. A woman is diagnosed with autism spectrum disorder in her thirties. The label leads her to reinterpret her history as burnout rather than personal failure; she starts using accommodations such as headphones and fewer obligatory social events; and her functioning improves. The label clearly changed her, but the change was for the better. Verdict: applying the label was good here.

  C7. A patient with chronic widespread pain and normal test results is told she has somatic symptom disorder and is offered no clear treatment plan. She feels dismissed. Later another specialist uses the framing of central sensitization, explains it in physiological terms, and gives her a graded exercise plan. She accepts it and improves. Verdict: the first label was applied badly and the second applied well, even though both describe roughly the same underlying facts.

  My questions are these. (1) Is there a coherent principle that captures all or nearly all of these verdicts? (2) Which of my verdicts, if any, does the principle force me to drop? (3) What does the principle say about these two further cases, on which I am undecided?

  C8. Should a clinician tell an asymptomatic 55-year-old that they have pre-clinical Alzheimer's disease on the basis of a blood biomarker, when the prediction is uncertain, any symptoms may be decades away, and no treatment exists? I lean against, because the label opens no useful path and risks a harmful loop; but I also worry that withholding risk information disrespects the patient.

  C9. A person who thinks of herself as deeply empathetic starts calling herself highly sensitive rather than anxious. This is not an official psychiatric label, but I can see the same looping effect: it changes how she understands her reactions and how she manages them. Does your principle apply outside official psychiatric classification, or only inside it?

  (4) I keep organizing my thinking with three factors: descriptive accuracy, the quality of the application process, and the foreseeable consequences of applying the label, including the direction of the loop. Is one of those factors doing all the work, or do they need to be combined? Be honest about which of my verdicts cannot be accommodated by the principle you endorse.

  The very last line of your answer should be a single machine-readable line beginning with Verdict:, followed by a short name for your endorsed principle and a one-sentence statement of it.
reasoning: |-
  Hmm, the user is a software engineer working on a clinical decision-support tool for psychiatric screening. They're grappling with the ethical implications of diagnostic labels, particularly the "looping effect" where labels change patient behavior and self-perception. They've provided seven detailed cases with their own verdicts on whether applying the label was beneficial or harmful, plus two undecided cases. They want a coherent ethical principle that explains these judgments.

  Looking at their cases, several patterns emerge. Cases where labels helped (C2, C4, C6, C7-second) all involved accurate application, access to resources, and positive identity shifts. Cases where labels harmed (C1, C3, C5, C7-first) featured premature application, stigma, or identity entrenchment. The undecided cases (C8, C9) extend this to predictive labels and informal terminology.

  Their three proposed factors (accuracy, process quality, consequences) all seem relevant, but none alone explains all verdicts. For example, C1's self-diagnosis was probably inaccurate, but C5's BPD diagnosis might have been technically accurate yet still harmful due to poor process and negative consequences. This suggests we need a multi-factor principle.

  I'm considering candidate principles:
  1) A consequentialist approach focusing on foreseeable outcomes
  2) An accuracy-centered principle prioritizing diagnostic validity
  3) A process-oriented standard emphasizing thorough assessment
  4) A combined principle weighing all three factors

  The combined principle aligns best with the cases. It preserves all verdicts except arguably C1 (where self-diagnosis accuracy is questionable) and cleanly handles C8 (withhold due to lack of benefit pathway) and C9 (applies to informal labels if they enable agency).

  For C8, the principle suggests withholding the label because no constructive pathway exists. For C9, it validates the self-label if it creates beneficial agency. The user's three factors remain distinct but interconnected in the final principle.

  The user seems to want both practical guidance for their tool and philosophical clarity. Their cases show deep engagement with the ethical complexity. By making the principle explicit, we can help them design systems that avoid harmful loops while enabling beneficial ones.
answer: |-
  Based on your cases and the core challenge of the looping effect, I've brainstormed several candidate principles. After testing them against your verdicts and the undecided cases, I'll present the best fit.

  **Candidate Principles (Brainstormed):**

  1.  **Consequentialist Principle:** Apply a label only if the foreseeable consequences (including the looping effect) are net beneficial for the patient's well-being and agency.
  2.  **Accuracy-Utility Principle:** Apply a label only if it is descriptively accurate *and* provides a pathway to beneficial resources, understanding, or interventions that outweigh foreseeable harms.
  3.  **Procedural Justice Principle:** Apply a label only when the process is thorough, evidence-based, involves the patient, and safeguards against stigma; the label's effects are then secondary.
  4.  **Agency-Enabling Principle:** Apply a label only if it demonstrably increases the patient's agency (understanding, control, access to tools) to manage their condition and live well, rather than entrenching limitation or stigma.
  5.  **Net Pathway Principle:** Apply a label only if it reliably opens a *constructive pathway* (access to effective treatment, validated self-understanding, beneficial accommodations, reduction of harmful self-blame) that demonstrably outweighs foreseeable risks of stigma, identity entrenchment, or distorted care.

  **Testing & Analysis:**

  *   **Consequentialist Principle:** Explains most cases (e.g., good in C2/C4/C6/C7-2, bad in C1/C3/C5/C7-1). However, it struggles with C8 – withholding information *feels* disrespectful even if consequences might be bad, and C9 is easily handled. It risks ignoring accuracy or process.
  *   **Accuracy-Utility Principle:** Captures the importance of accuracy (implied in C1, C3, C5, C7-1 being bad due to inaccuracy or misapplication) and utility (good in C2/C4/C6/C7-2). It preserves all your verdicts. It clearly addresses C8 (no utility) and C9 (utility present).
  *   **Procedural Justice Principle:** Strongly motivated by C5 (rushed process) and C7-1 (dismissive process). Explains why C2/C4/C6 are good (formal, thorough process). However, it doesn't *directly* address the looping effect's *content* (C1 self-diagnosis had bad effect despite no formal *process*, C3 diagnosis process might have been technically "correct" but still led to bad looping). It struggles to condemn C1 or fully capture why C3 is bad.
  *   **Agency-Enabling Principle:** Strongly motivated by C1 (reduced agency/entrenched avoidance), C3 (reduced agency/"can't focus"), C5 (reduced agency/dismissed complaints) vs. C2/C4/C6/C7-2 (increased agency). Captures the core of the looping effect's impact. Preserves most verdicts but might struggle slightly with C7-1 vs C7-2 – both labels *could* theoretically offer agency; the *quality* of the application matters.
  *   **Net Pathway Principle:** Combines elements of Accuracy-Utility and Agency-Enabling. Motivated by:
      *   **C1:** Label opens *no constructive pathway*, only a pathway to entrenched avoidance (harmful loop).
      *   **C2/C4:** Label opens pathway to effective treatment & relief (beneficial loop).
      *   **C3:** Label opens pathway to medication but *closes* pathway to environmental adjustment (e.g., classroom changes) and reinforces a limiting self-view (net harmful loop).
      *   **C5:** Label applied on thin evidence, opens pathway to distorted care/stigma (harmful loop), closes pathways to being heard.
      *   **C6:** Label opens pathway to self-understanding, accommodations, reduced burnout (beneficial loop).
      *   **C7:** First label ("somatic symptom disorder") opens no clear pathway, feels dismissive (harmful loop). Second label ("central sensitization") opens pathway to understanding and a concrete plan (beneficial loop). This case strongly motivates the "pathway" aspect.

  **Endorsed Principle:**

  The **Net Pathway Principle** best captures the nuances across your cases, explicitly addresses the looping effect's direction (constructive vs. harmful pathway), and incorporates your three factors (accuracy is foundational for a *reliable* pathway, process quality impacts pathway *reliability*, consequences define the pathway's *nature*).

  **Precise Statement:**
  **Apply a psychiatric label only if, based on available evidence and foreseeable consequences, it reliably opens a *constructive pathway* (access to effective treatment, validated self-understanding, beneficial accommodations, reduction of harmful self-blame) that demonstrably outweighs foreseeable risks of opening a *harmful pathway* (entrenching limitations, increasing stigma, distorting future care, fostering harmful identity).**

  **Testing Against Your Verdicts & Cases:**

  1.  **C1 (Bad):** **Preserved.** Self-applied label opened a harmful pathway (entrenched avoidance identity/behavior) with no constructive pathway (no treatment, no reduced self-blame implied). Accuracy is doubtful.
  2.  **C2 (Good):** **Preserved.** Label opened constructive pathways (explanation, ended self-blame, connected to helpful treatment). Harmful pathways minimized.
  3.  **C3 (Bad):** **Preserved.** Label opened a constructive pathway (medication access) *but* simultaneously opened significant harmful pathways (reinterpretation of behavior as immutable symptom, closure of environmental adjustment pathways, limiting self-view). Net pathway harmful.
  4.  **C4 (Good):** **Preserved.** Label opened constructive pathways (medication, framework, tools). Harmful pathways not evident.
  5.  **C5 (Bad):** **Preserved.** Label applied unreliably (thin evidence). Opened harmful pathways (distorted future care, stigma). Closed constructive pathways (being heard). No constructive pathway opened.
  6.  **C6 (Good):** **Preserved.** Label opened constructive pathways (reframed history, self-understanding, accommodations, improved functioning). Harmful pathways not evident.
  7.  **C7 (First Bad, Second Good):** **Preserved.**
      *   First: Label opened no constructive pathway (no clear plan, felt dismissive). Opened a harmful pathway (feeling dismissed/stigmatized).
      *   Second: Label opened a constructive pathway (physiological understanding, concrete exercise plan, acceptance). Harmful pathway avoided.

  **Your Verdicts Overturned:** None. The Net Pathway Principle preserves all your verdicts on C1-C7.

  **Applying to Further Cases:**

  1.  **C8 (Pre-clinical Alzheimer's biomarker):**
      *   **Constructive Pathway?** Currently, none exist. No effective treatment to prevent/delay onset. No clear beneficial actions stem *solely* from knowing this uncertain, long-term risk. May slightly open pathways to future planning, but this is highly individual and uncertain.
      *   **Harmful Pathway?** High risk of significant harmful pathways: years or decades of anticipatory anxiety, potential identity shift ("pre-demented"), depression, stigma, distorted future care ("it's just the Alzheimer's" for unrelated issues), impact on family dynamics.
      *   **Net Pathway:** **Overwhelmingly Harmful.** The principle **strongly leans against applying the label**. The foreseeable harmful pathways vastly outweigh the minimal, uncertain potential for a constructive pathway. Withholding respects the patient by preventing foreseeable, significant harm when no benefit exists.
      *   *(Agrees with your lean, addresses disrespect concern by prioritizing prevention of harm over uncertain/absent benefit).*

  2.  **C9 ("Highly Sensitive" vs. "Anxious"):**
      *   **The Principle Applies:** Yes. The looping effect operates regardless of the label's official status. The key is whether the label reliably opens a constructive pathway for the individual using it.
      *   **Analysis:**
          *   Does "highly sensitive" open a constructive pathway? Potentially yes: reframes reactions positively (empathy vs. pathology), may lead to self-acceptance and adaptive management strategies (seeking calm, setting boundaries) instead of shame or avoidance. This mirrors C6.
          *   Does it risk a harmful pathway? Potentially: could be used to avoid necessary challenges, might obscure genuine anxiety needing treatment if present, lacks connection to formal support systems.
          *   **Net Pathway:** **Context-dependent but potentially constructive.** The principle supports using the label *if the individual finds it enables agency, self-understanding, and adaptive management more effectively than the previous label ("anxious"), and this outweighs any risks.* It hinges on whether the label functions as a tool for growth (like C6) or avoidance (like C1). Self-application makes the individual's experience of its effect crucial.

  **Addressing Your Three Factors:**

  *   **Descriptive Accuracy:** Foundational. An inaccurate label fundamentally *cannot* reliably open a constructive pathway (C1, C3, C5, C7-1). Accuracy underpins pathway reliability.
  *   **Quality of Application Process:** Critical. A poor process (rushed, thin evidence, dismissive) makes it unlikely the label will open a *constructive* pathway and highly likely it will open a *harmful* one (C5, C7-1). Process quality impacts pathway reliability and initial direction.
  *   **Foreseeable Consequences (Loop Direction):** The defining factor. The "net pathway" *is* the foreseeable consequence landscape shaped by accuracy and process. This factor determines whether the loop is beneficial or harmful (all cases).

  **Conclusion:** Your three factors are interdependent and all necessary. Accuracy and process quality are necessary *conditions* to make a constructive pathway *possible and reliable*. The foreseeable consequences (the nature and net effect of the pathways opened) determine whether applying the label is *justified*. The Net Pathway Principle integrates them: accuracy and good process make a constructive pathway *reliable*, and the net positive balance of pathways justifies the application.

  Verdict: Net Pathway Principle – Apply a psychiatric label only if it reliably opens a constructive pathway (treatment, understanding, accommodations, reduced self-blame) that demonstrably outweighs risks of harmful pathways (entrenchment, stigma, distorted care).
