prompt: |-
  I am a doctoral student in comparative historical sociology, and I have noticed a recurring methodological asymmetry in the application of base-rate reasoning to imperial decline that I cannot map cleanly onto the conceptual vocabulary I have encountered.

  Consider the following pattern, which I have observed repeatedly in studies that apply an outside view to the fate of large territorial polities. Analysts begin by defining a reference class of past empires that shared a specific cluster of macro-features—say, simultaneous fiscal contraction, frontier overextension, and elite fragmentation—compute a collapse rate within that class, and apply it as a predictive base rate to a current or recent case. When the polity in question does collapse, scholars treat it as a confirming instance: the reference class is left intact, and the base rate is cited as having been borne out.

  However, when a polity facing the same cluster survives and adapts—reforming its fiscal apparatus, reorganizing its military, or fragmenting into durable successor states—the literature rarely treats the survival as a straightforward falsification of the base rate. Instead, analysts frequently introduce a post-hoc exclusion criterion: they argue that the surviving polity must have possessed some hidden structural feature—an unusually resilient bureaucratic-legal framework, a particular geopolitical buffer, or an atypical mode of elite integration—that should have placed it outside the original reference class. Crucially, this refinement operates asymmetrically. Scholars do not apply a parallel exclusion to collapsed cases by arguing that those fallen polities must have secretly lacked the hidden feature and therefore never belonged in the class. The boundary of the reference class is tightened around survivors but left loose around failures, preserving the predictive failure rate for the remaining pool.

  This is not, I think, ordinary post-hoc rationalization of a single causal theory, because it operates on the comparative-statistical layer rather than on a specific narrative of decline. Nor is it exactly the general problem of selecting favorable analogies, because the selection mechanism is triggered specifically by survival outcomes and applies collectively to the sample rather than to an individual comparison. I am unsure whether this asymmetry has a recognized name within forecasting methodology, philosophy of science, or comparative history—perhaps as a specific failure mode of outside-view reasoning, or as a variant of sample-bias immunization applied to historical reference classes.

  Could you identify whether an established concept captures this precise pattern: the outcome-contingent, one-directional tightening of reference-class boundaries in imperial forecasting, where survival prompts retrospective exclusion criteria but collapse does not? If the nearest analogues are general problems of ad hoc reference-class selection or immunizing strategies against falsification, I would ask you to draw the distinctions carefully—what exactly this pattern is, where its boundaries lie, and whether it differs from plain narrative adjustment in that it systematically preserves base rates by reshaping the sample rather than the theory. If no established term exists, I would welcome a precise coinage together with boundary conditions that distinguish legitimate historiographical refinement—say, discovering genuinely overlooked structural differences—from this particular failure mode.
reasoning: |-
  Okay, this is a really sophisticated methodological question from a doctoral student in comparative historical sociology. They're describing a very specific asymmetry in how base-rate reasoning is applied to imperial decline studies. Let me unpack this carefully.

  First, I need to fully grasp the pattern they're observing. It seems scholars use base rates from historical empires with certain characteristics (fiscal problems, overextension, elite issues) to predict collapse. When collapse happens, it confirms the base rate. But when an empire survives despite having those characteristics, instead of seeing it as falsifying the base rate, scholars argue that empire must have had some hidden resilience factor that means it shouldn't have been in the reference class to begin with.

  What's particularly interesting is the asymmetry: they don't apply the same logic to collapsed empires by saying "oh this collapsed one must have secretly lacked some feature." So the reference class gets shrunk only when there's a survival, which artificially preserves the high failure rate.

  This isn't just typical post-hoc rationalization because it operates at the statistical/comparative level rather than narrative adjustment. It's also not just cherry-picking analogies because it's systematic and triggered specifically by survival outcomes.

  Hmm... I need to think about established methodological concepts that might capture this. Let me consider a few angles:

  First, in philosophy of science, this resembles the Duhem-Quine problem but with a twist - it's not just that theories face tests as bundles, but specifically that the reference class gets redefined based on outcomes. The Popperian idea of immunization against falsification comes close, but usually that's about modifying theories, not sample selection.

  In forecasting methodology, this feels like a perverse form of reference-class tennis where the court boundaries move only when the ball lands in one particular area. The outside view is supposed to prevent narrative biases, but here it's being subverted.

  For statistical concepts, this has flavors of survivorship bias but inverted - instead of excluding failures, we're excluding survivors. It's like a confirmation bias operating on the reference class level.

  The closest fit might be what Tetlock calls "ideological Turing tests" or perhaps "motivated reclassification," but I'm not sure those fully capture it. Maybe "outcome-contingent reference class gerrymandering" would be a precise coinage.

  I should also distinguish this from legitimate historical refinement. Sometimes discovering new structural features is valid - the problem is when it's done asymmetrically and only in response to survival outcomes.

  The key diagnostic would be: are scholars applying the same scrutiny to collapsed cases? Are the exclusion criteria specified in advance? Is the pattern systematic rather than case-specific?

  This seems like an important methodological critique for comparative historical analysis. The scholar has identified a subtle way that probabilistic reasoning can become unfalsifiable through asymmetric boundary work. I'll need to craft a response that honors the sophistication of their observation while providing clear conceptual handles.
answer: |-
  Your observation identifies a profound methodological flaw in comparative imperial studies—a pattern I term **Outcome-Contingent Reference-Class Gerrymandering (OC-RCG)**. This asymmetry has no universally accepted name but intersects several established concepts while possessing unique features. Below, I define OC-RCG, distinguish it from related ideas, and outline boundary conditions to separate it from legitimate historical refinement.

  ### Core Pattern: OC-RCG Defined
  - **What it is**: A systematic, asymmetric adjustment of reference-class boundaries based on outcomes. Survival triggers *post-hoc exclusion* of cases from the original class (via "hidden resilience factors"), while collapse leaves the class intact. This preserves the base-rate collapse probability by selectively shrinking the denominator (survivors are removed; failures remain).  
  - **Mechanism**:  
    - **Survival → Tightening**: "Polity X survived because it had *unobserved* feature Z, so it never truly belonged."  
    - **Collapse → No Adjustment**: Collapsed cases retain membership; no symmetric search for "hidden fragility factors" that might exclude them.  
  - **Effect**: Base rates become self-insulating. The collapse rate appears robust, but only because the reference class is retroactively curated to exclude counterexamples.  

  ### Distinctions from Related Concepts
  1. **Ad Hoc Reference-Class Selection (Forecasting)**:  
     - *Similarity*: Both involve arbitrary class boundaries.  
     - *Difference*: General ad hoc selection lacks **asymmetric outcome-dependence**. OC-RCG specifically triggers refinement *only* for survival outcomes.  

  2. **Immunization Against Falsification (Popper/Lakatos)**:  
     - *Similarity*: Both protect a core claim (here, the base-rate collapse probability).  
     - *Difference*: Classic immunization modifies *theories* (e.g., adding epicycles). OC-RCG modifies the **sample composition** while leaving the statistical logic untouched. It is *reference-class surgery*, not narrative adjustment.  

  3. **Survivorship Bias (Statistics)**:  
     - *Similarity*: Both distort samples by excluding cases.  
     - *Difference*: Survivorship bias *passively* ignores failures. OC-RCG *actively* ejects survivors *after* observing their outcome, while retaining all failures.  

  4. **Motivated Reasoning (Psychology)**:  
     - *Similarity*: Both involve cognitive bias toward desired conclusions.  
     - *Difference*: OC-RCG operates at the **collective, structural level** of reference-class management, not individual case narratives. It is institutionalized in comparative methodology.  

  ### Boundary Conditions: Legitimate Refinement vs. OC-RCG  
  OC-RCG is **illegitimate** when:  
  1. **Asymmetry**: Exclusions apply *only* to survivors, not symmetrically to failures.  
  2. **Ex Post Timing**: The "hidden feature" justification emerges *after* the outcome, with no prior theoretical basis or empirical trace.  
  3. **Base-Rate Preservation**: The *sole effect* is to maintain the original collapse rate by removing counterexamples.  

  Legitimate historical refinement occurs when:  
  1. **Symmetry**: New features are sought/specified for *all* cases (e.g., re-examining collapsed empires for overlooked resilience factors).  
  2. **Prior Plausibility**: Features are grounded in established theory or archival evidence *independent* of the outcome.  
  3. **Predictive Utility**: The refined class improves future forecasts (e.g., identifying a resilience factor that predicts survival in *new* cases).  

  ### Why This Matters for Comparative Historical Sociology
  - **Epistemic Risk**: OC-RCG makes base-rate reasoning unfalsifiable. Collapse "confirms" the rate; survival "disqualifies" the case.  
  - **Hidden Conservatism**: It preserves deterministic narratives (e.g., "all empires with X features fall") by reclassifying exceptions.  
  - **Solution Path**: Demand **outcome-independent reference classes**. Specify exclusion criteria *before* examining outcomes (e.g., "empires without centralized tax systems are excluded"), then test the base rate symmetrically on all cases meeting criteria.  

  ### Established Near-Analogues
  - **Reference-Class Tennis** (Kahneman/Tversky): Arbitrary class switching to suit arguments—but lacks OC-RCG’s *directional* asymmetry.  
  - **Criterion Problem** (Tetlock): Difficulty defining class boundaries—but not outcome-triggered.  
  - **Collider Bias** (Statistics): Conditioning on an outcome (e.g., survival) distorts relationships—but OC-RCG is a *deliberate* methodological choice.  

  ### Conclusion
  **OC-RCG** captures your observed pattern precisely. It is a distinct failure mode of outside-view reasoning in historical sociology, where base rates are shielded by asymmetric sample curation. To counter it, insist on symmetric falsification tests: if a survival excludes a case, scholars must *also* examine whether collapsed cases lacked defining features. Legitimate historiography controls for confounders *prospectively*; OC-RCG immunizes probabilities *retrospectively*. Naming this pattern is the first step toward rectifying it—a crucial task for rigorous comparative analysis of imperial trajectories.
