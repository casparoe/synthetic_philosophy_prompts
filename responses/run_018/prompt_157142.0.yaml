  For the first part: rating agencies become cartoon villains in retrospect, but in 2006 their models genuinely couldn't capture correlated housing defaults. Regulatory bodies weren't "asleep at the wheel" - they were constrained by fragmented oversight structures. And those CDO-squared instruments? Even quants didn't grasp their fragility, yet now we portray them as obvious time bombs. 

  *checks notes on emergent systems* Ah, here's the rub: their framework struggles with algorithmic trading ecosystems. The May 2010 flash crash shows how machine interactions create failure modes no single actor controls. This might be the structural limit they suspected - you can't "overfit" what was fundamentally unpredictable. 

