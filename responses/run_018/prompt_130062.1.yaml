prompt: |-
  I'm a quantitative risk analyst fluent in Bayesian model averaging, stress-testing protocols, and regulatory capital frameworks, but with no training in early analytic philosophy. Restate the core of John Maynard Keynes's position in A Treatise on Probability — specifically his distinction between measurable risk and true uncertainty, his claim that some probabilities are "organic" and resist decomposition into independent sub-events, and his separation of the "weight of argument" from the balance of evidence — using only the vocabulary I actually use: priors, posteriors, calibration, model misspecification, structural dependence in scenario design, and Knightian ambiguity. Do not import Keynes's own terminology except in the initial naming of the claims. Then deliver your answer as exactly five numbered items, each consisting of one or two sentences, with no introductory or concluding paragraph: (1) the translation of the risk/uncertainty distinction; (2) the translation of organic, non-decomposable probability; (3) the translation of weight versus balance; (4) the residue report stating, for each claim, whether it maps cleanly, survives only with distortion, or has no counterpart in risk analytics, and whether that absence indicates a gap in my framework or an empty philosophical move; and (5) a clear separation of what is settled about Keynes's interpretation from what remains genuinely contested among historians of economic thought, with no disputed reading presented as consensus.
