answer: |-
  Here are the five numbered items as specified:

  1.  **Risk/Uncertainty Distinction:** Measurable risk corresponds to probabilistic scenarios where priors are well-calibrated based on historical data, while true uncertainty (Knightian ambiguity) denotes model misspecification so severe that no reliable prior or posterior probability distribution can be assigned.
  2.  **Organic Probability:** Some complex events exhibit structural dependence in scenario design; their joint probability cannot be decomposed into independent sub-event probabilities because the underlying dependencies invalidate factorization assumptions.
  3.  **Weight vs. Balance:** The "weight of argument" reflects the robustness of model calibration and data quality supporting a posterior probability estimate, distinct from the "balance of evidence" which solely determines the direction or magnitude of the posterior shift relative to the prior.
  4.  **Residue Report:** (i) Risk/Uncertainty maps cleanly to Knightian ambiguity frameworks; (ii) Organic probability survives with minor distortion as complex structural dependence; (iii) Weight vs. balance has no direct counterpart, indicating a gap in quantifying evidential robustness beyond posterior values. None are empty philosophical moves.
  5.  **Interpretation Status:** Settled: Keynes rigorously separated quantifiable risk from unquantifiable uncertainty. Contested: Whether "organic" probabilities imply ontological limits versus modeling complexity, and whether "weight" is measurable or purely epistemological. No consensus exists on operationalizing weight.
