prompt: |-
  As a software engineer with no formal philosophy background, I have been trying to apply ideas from system architecture—layered abstractions, dependency preservation, and refactoring—to scientific explanation, and I keep encountering the distinction between legitimate bottom-up cranes, unexplained skyhook causation, and greedy reductionism that eliminates intermediate structures entirely. Before I commit to using this framing for evolutionary or cognitive explanation, I need the full specification of what an adequate theory of explanatory reduction in complex adaptive systems must actually deliver.

  Write exactly five desiderata, each clustering the core requirements—phenomena it must explain, distinctions it must preserve (such as downward causation versus mere implementation), consistency conditions with evolutionary biology, and the boundary conditions that separate cranes from skyhooks—together with the motivating case or thought experiment behind each cluster; mark each as non-negotiable or camp-specific, and state which single desideratum eliminates the most competing accounts. Present this as a numbered list with exactly five items, each one to two sentences long, with no introduction and no conclusion.
reasoning: |-
  Okay, the user is a software engineer interested in applying system architecture concepts like layered abstractions and dependency preservation to scientific explanations, particularly in complex adaptive systems like evolution and cognition. They're wrestling with concepts like bottom-up cranes (legitimate explanations), skyhooks (unexplained causation), and greedy reductionism (ignoring intermediate structures). 

  Hmm, they want exactly five desiderata for a theory of explanatory reduction. Each must cluster core requirements: phenomena to explain, distinctions to preserve (like downward causation vs implementation), consistency with evolutionary biology, and boundary conditions between cranes and skyhooks. Each desideratum needs a motivating case and should be marked as non-negotiable or camp-specific. Plus, one must be flagged as eliminating the most competing accounts. 

  Let me unpack this carefully. The user is clearly intellectually serious—they're avoiding armchair philosophizing and want concrete criteria before applying their framework. Their frustration with "greedy reductionism" suggests they've seen oversimplified models fail in practice. The emphasis on "boundary conditions" hints they want operational tests, not just definitions. 

  For the desiderata... First, we absolutely need one addressing *emergence without magic*—preserving adaptive structure while denying skyhooks. The origin of the genetic code is perfect here: it's complex but must emerge from evolutionary cranes. Non-negotiable. 

  Second, *downward causation* is tricky. Software engineers get this—like how an API constraint shapes lower-level code. The Baldwin effect (learning guiding evolution) is ideal. Must distinguish it from skyhooks. Non-negotiable. 

  Third, *explanatory levels*—can't collapse everything like greedy reductionism. Bee dance communication requires colony-level explanation. Non-negotiable, and this one kills many competing accounts (e.g., extreme genetic determinism). 

  Fourth, *path-dependence* matters. Software folks know legacy systems constrain new features. Evolutionary spandrels (like panda's thumb) illustrate this. Non-negotiable. 

  Fifth, *crane-skyhook detection*—need bright lines. SETI-like detection of alien tech would force distinguishing evolved complexity vs design. Camp-specific (some deny skyhooks a priori), but crucial for rigor. 

  ...Wait, is five enough? *Double-checks*. Yes, they cover emergence, causation, levels, history, and detection. The "explanatory levels" desideratum does heavy work—it rejects both skyhooks and greedy reductionism. Perfect. 

  User's background helps here: analogies to API layers and refactoring will resonate. No fluff—just bulletproof criteria. Hope this gives them the "spec" they need.
answer: |-
  Here are the five desiderata for an adequate theory of explanatory reduction in complex adaptive systems:

  1.  **Preserve Emergent Functionality Without Teleology:** The theory must explain how genuinely novel, adaptive system-level functions (e.g., the genetic code's error-correction) arise solely from the interaction of lower-level components under selective pressures, explicitly rejecting skyhook explanations invoking foresight or external purpose. *(Non-negotiable; Motivating Case: Origin of complex biological information systems)*.
  2.  **Account for Downward Causation as Constraint Propagation:** It must distinguish legitimate downward causation (where system-level state/configurations *constrain* lower-level component behavior/interactions, e.g., epigenetic landscape shaping gene expression) from skyhooks (top-down imposition *without* lower-level implementation) by showing how constraints are materially implemented and propagated. *(Non-negotiable; Motivating Case: Baldwin Effect or niche construction)*.
  3.  **Maintain Explanatory Levels While Forbidding Greedy Collapse:** The theory must necessitate distinct, irreducible (but interdependent) explanatory levels (e.g., neuronal firing vs. cognitive function vs. social behavior) capturing real organizational strata, forbidding greedy reductionism that eliminates valid intermediate structures by claiming the lowest level "fully explains" the highest. *(Non-negotiable; **Eliminates the most competing accounts**; Motivating Case: Explaining honeybee waggle dance communication requires colony-level context, not just individual bee neurobiology)*.
  4.  **Incorporate Historical Contingency & Path-Dependence:** It must integrate the system's unique evolutionary history and contingent developmental pathways as causal factors shaping current structure/function (e.g., developmental constraints, phylogenetic inertia), explaining why functionally equivalent systems might have distinct, non-optimized underlying architectures. *(Non-negotiable; Motivating Case: Panda's "thumb" as a repurposed wrist bone)*.
  5.  **Provide Operational Criteria for Crane-Skyhook Demarcation:** The theory must supply falsifiable boundary conditions (e.g., requiring demonstrable material precursors, incremental selectable steps, absence of privileged information sources) to objectively distinguish plausible, historically contingent crane mechanisms (e.g., natural selection) from explanatory skyhooks (e.g., sudden unexplained complexity injections). *(Camp-specific: crucial for naturalists, potentially contested by design proponents; Motivating Case: Hypothetical SETI detection - distinguishing evolved alien biology from engineered technology)*.
