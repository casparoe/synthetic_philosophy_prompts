answer: |-
  Based on your constraints and goals, **the distinction between preserving defeat as an "open moral wound" versus domesticating it into a "closed historical episode" should be resolved first.** This is the core upstream issue upon which the others critically depend. Here’s the full prioritization and justification:

  ### Priority Ranking & Justification

  1.  **The Open Wound vs. Closed Episode Distinction**
      *   **Why First?**
          *   **Foundational Dependency:** This question defines the *entire ontological and ethical stance* of the memorial. Is the defeat an active, unresolved injustice demanding ongoing moral reckoning (Open Wound)? Or is it a tragic but concluded event whose lessons are historical and pedagogical (Closed Episode)? **All other questions presuppose an answer to this.** 
          *   **Downstream Implications:** 
              *   *Normative Authority:* A movement retains normative authority *only* if its cause is framed as representing an *ongoing* injustice (Open Wound). If closed, its authority is purely historical/didactic.
              *   *Mourning & Myth:* Authentic collective mourning for an Open Wound requires forms acknowledging pain and unresolvedness, risking myth if mishandled. Mourning a Closed Episode leans towards elegy, commemoration, and "learning lessons," risking domestication. The *purpose* of mourning differs fundamentally.
              *   *Policy/Memory Implications:* An Open Wound framing implies demands for reparations, systemic change, or continued resistance. A Closed Episode framing implies reconciliation, education, and "moving on." Misjudging this leads to profound dissonance.
      *   **Tractability (Conceptual Focus):** Highly tractable conceptually. It involves ethical philosophy (justice, temporality, responsibility), historiography (how history is constructed), and memory studies. Requires deep analysis of the *nature* of the defeat – was it a contingent failure, or the crushing of a fundamental (and still relevant) claim? Limited empirical input is needed beyond core historical facts to ground the ethical argument.
      *   **Overrated Downstream Implications:** 
          *   *"Closure Heals":* Assuming a Closed Episode *necessarily* leads to societal healing is overrated. Premature closure can breed resentment and obscure truths.
          *   *"Open Wounds Prevent Progress":* Assuming an Open Wound *necessarily* fuels destructive conflict or prevents reconciliation is overrated. It can be the engine for constructive accountability and change.
      *   **Reordering Trigger:** If conceptual work reveals the binary itself is flawed or impossible to resolve cleanly for *this specific cause* (e.g., elements are closed, others remain open), it would force a re-evaluation of the entire framework, potentially elevating the Normative Authority question.

  2.  **Normative Authority Without Revanchism**
      *   **Why Second?**
          *   **Dependency:** This question *only becomes relevant* if the defeat is framed as an Open Wound (or partially open). If Closed, normative authority is largely irrelevant beyond historical admiration/analysis. It directly addresses the *risk* inherent in the Open Wound framing.
          *   **Downstream Implications:** 
              *   Determines *how* the defeated cause's ideals can be presented as morally compelling *today* without implying a need to re-fight the past battle. This is crucial for shaping the memorial's message about contemporary relevance.
              *   Directly impacts the *tone* and *content* – does it inspire critique of current systems based on the defeated ideals, or solely lament the past?
              *   Informs whether the memorial implicitly or explicitly supports *current* movements inspired by the defeated cause.
      *   **Tractability:** Moderately tractable conceptually, leaning towards applied ethics/political theory. Requires conceptual work on legitimacy, justice, transitional justice, and the nature of revanchism vs. legitimate continuation. Some empirical grounding in the *current* reception/use of the defeated cause's legacy is helpful but not strictly necessary for core conceptual framing.
      *   **Reordering Trigger:** If resolving the Open/Closed question strongly leans towards "Closed," this question drops significantly in priority. If extensive case studies of similar memorials show revanchism is an empirically negligible risk regardless of framing, it might be deprioritized (though unlikely).

  3.  **Formal/Aesthetic Conditions for Mourning Without Myth**
      *   **Why Third?**
          *   **Dependency:** The *form* mourning takes is dictated by the answers to the first two questions. Is it raw grief and protest (Open Wound)? Respectful elegy (Closed Episode)? Or something in between trying to assert ongoing relevance (Normative Authority)? The aesthetic strategies to avoid myth (e.g., fragmentation, multivocality, critical juxtaposition) depend entirely on the underlying conceptual stance.
          *   **Downstream Implications:** This is the *executional* layer. While vital, it translates the prior conceptual decisions into physical/spatial/experiential form. Getting the concept wrong makes even brilliant aesthetics potentially harmful or misleading.
      *   **Tractability:** Less purely conceptual; heavily involves aesthetics, museology, architecture, and experiential design. While conceptual principles exist (counter-monuments, critical museology), significant empirical input from audience reception studies and design expertise is highly valuable, making it less ideal for *initial* purely conceptual focus with limited resources.
      *   **Reordering Trigger:** If the Open/Closed and Normative Authority questions are resolved with unusual clarity *early*, allowing significant resources to shift to design. Or, if preliminary design explorations reveal fundamental contradictions forcing a re-think of the conceptual priorities.

  ### Why the Open/Closed Binary is the Upstream Keystone

  *   **Defines Temporal Relationship:** Is the past truly past, or is its moral claim active in the present? This shapes everything.
  *   **Determines Agency:** An Open Wound implies the *audience/society* bears ongoing responsibility. A Closed Episode implies responsibility lies primarily with historical actors.
  *   **Sets the Emotional & Ethical Register:** Grief, anger, and demand for justice (Open) vs. sorrow, reflection, and acceptance (Closed).
  *   **Governs Relevance:** An Open Wound demands contemporary engagement; a Closed Episode offers historical perspective.

  **Conclusion for Your Agenda:** Dedicate the majority of your initial conceptual resources (Year 1 - early Year 2) to rigorously defining the status of this defeat. Is it fundamentally an enduring ethical claim (Open Wound) demanding present engagement, or a concluded historical episode (Closed Episode) for understanding and commemoration? **This is not a choice to be made lightly or by default; it is the core ethical argument your memorial must make and defend.** Resolving this provides the essential foundation for tackling the inherent risks of normative authority (if Open) and the practical challenges of designing mourning without myth. Attempting to resolve the aesthetics or the normative authority question *before* this is putting the cart before the horse and risks incoherence or unintended consequences. Progress here – reaching a defensible, nuanced position – will illuminate the path forward for the other questions and ensure your limited resources are focused on the most consequential aspects of remembrance.
