  The distinction between open moral wound and closed history seems foundational. If defeat is framed as a concluded event, then normative authority and mourning aesthetics might not even be relevant. But if it's an open wound, then how to handle authority and mourning becomes critical. So resolving the first question likely affects how the others are approached. 

  Next, the normative authority question depends on the first. If the defeat is a closed episode, then authority might not be an issue. But if it's an open wound, then determining how that movement retains moral weight without inciting revenge is key. The mourning aesthetics question also relies on the first—depending on whether the defeat is open or closed, the mourning process would differ. 

  Tractability is another factor. The open vs. closed distinction is more conceptual and can be addressed through philosophical and ethical analysis, fitting within limited resources. The other questions might require more empirical work or practical considerations, which could be harder with limited time and resources.

  The user mentioned downstream implications being overrated. For example, if the memorial focuses on the event as concluded, policies might prioritize closure and education, but that could overlook ongoing injustices. Conversely, treating it as an open wound might lead to policies that address reparations but risk perpetual conflict. The user needs to know which implications are less critical to avoid misallocating resources.

  Also, the user's deeper needs might include creating a memorial that's both truthful and constructive, avoiding divisiveness. They might want a framework that acknowledges past injustices without fueling current conflicts. Identifying the upstream issue helps them allocate resources effectively to the most impactful area first.

