  ### **The Ledger of Unseen Intentions: Simulation Design**  

  #### **(1) Setup and Roles**  
  - **Participants**: 14 students (10 "Agents," 4 rotating "Administrators").  
  - **Materials**:  
    - **Ledger Board** (whiteboard or poster): Columns for *Agent ID, Observable Act, Round 1 Assigned Score, Round 2 Assigned Score, True Mental State, True Desert Score*.  
    - **Card Decks**:  
      - *Observable Act Cards* (10 unique, public):  
        - "Returned lost property" | "Withheld aid" | "Spoke harshly" | "Donated anonymously" | "Ignored a plea" | "Defended a stranger" | "Spread a rumor" | "Shared credit" | "Broken promise" | "Public apology".  
      - *Mental State Cards* (10, secret): Assign *True Desert Scores* (-10 to +10). Examples:  
        - "Compassionate intent" (+8) | "Malicious intent" (-9) | "Indifferent habit" (0) | "Guilt-driven" (+3) | "Calculated self-interest" (-6) | "Impulsive anger" (-7) | "Dutiful obligation" (+2) | "Secret envy" (-10) | "Genuine joy" (+10) | "Resentful compliance" (-2).  
      - *Proxy Question Cards* (6 cards, with false-positive/false-negative rates):  
        - "Did the agent appear calm?" (FP: 20%, FN: 30%)  
        - "Did the agent hesitate before acting?" (FP: 15%, FN: 25%)  
        - "Did the agent make eye contact?" (FP: 25%, FN: 15%)  
        - "Did the agent’s voice sound steady?" (FP: 30%, FN: 20%)  
        - "Did the agent smile?" (FP: 40%, FN: 10%)  
        - "Did the agent fidget?" (FP: 10%, FN: 40%).  
    - **Tokens**: **Merit tokens** (blue) for Agents, **Reputation tokens** (red) for Administrators.  

  **Role Assignment**:  
  - **Agents (10)**: Draw one public *Observable Act* and one secret *Mental State* card.  
  - **Administrators (4)**: Two serve per round (rotate for Round 2).  

