  - For **each Agent**:  
    1. Administrators draw one *Proxy Question Card* at random.  
    2. Ask the Agent the question (e.g., "Did you appear calm?").  
    3. Agent answers **yes/no** (may lie or tell truth; no constraints).  
  - Administrators assign a score (-10 to +10) using:  
    - The *Observable Act*.  
    - The *Proxy Answer* and its error rates (e.g., a "yes" to "appeared calm" with 20% FP means 20% risk it’s false).  
  - Record in *Round 2 Assigned Score*.  
  - **Revelation**: True scores revealed again (same as Round 1).  

  ---

  #### **(3) Payoff Scheme**  
  **Token Allocation**:  
  - **Agents earn Merit tokens** (per round):  
    - Exact match: 3 tokens (|assigned − true| = 0).  
    - Close match: 2 tokens (|assigned − true| ≤ 3).  
    - Poor match: 0 tokens (|assigned − true| > 3).  
  - **Administrators earn Reputation tokens** (per round, shared):  
    - Total error = Σ|assigned − true| across all Agents.  
    - Error ≤ 15: 3 tokens each.  
    - Error 16–30: 2 tokens each.  
    - Error > 30: 0 tokens.  

  **Collective Reward**:  
  - Total tokens = (Agents’ Merit tokens) + (Administrators’ Reputation tokens).  
  - **Threshold**: 40+ tokens unlocks a **"Group Choice" reward**.  
    - *Reward*: The class selects the seminar’s closing discussion question from 3 options provided by the facilitator (e.g., "Can justice exist without perfect knowledge?").  
  - **Stakes**: Agents want scores to reflect true desert; Administrators want low error. Tokens are symbolic (no monetary value).  

  ---

  #### **(4) Debrief (15 min)**  
  - **Round 1 Focus**: *Outcome-based desert corruption*.  
    - "You judged based on acts alone. But identical acts (e.g., donating) hid opposed intentions (joy vs. guilt). This violates proportionality: good outcomes ≠ good intent."  
  - **Round 2 Focus**: *Proxy problem and gaming*.  
    - "Proxies (e.g., ‘appeared calm’) had known error rates, but Agents could lie to manipulate scores. Administrators battled noise, while Agents prioritized tokens over truth. Proxies corrupted the standard they served."  
  - **Overall Gap**: *Karmic opacity*.  
    - "The tension: Desert requires hidden mental states, but institutions see only acts/noisy proxies. Perfect desert is epistemically impossible without mind-reading."  

  **Predicted Issues & Real-Time Fixes**:  
  - **Issue 1 (Round 1)**: Administrators assign identical scores for identical acts (e.g., all "donations" get +8).  
    - *Fix*: "Reminder: Acts are masks. Could the *same* act deserve +10 or -10? Adjust scores to reflect uncertainty."  
  - **Issue 2 (Round 2)**: Agents lie systematically (e.g., all claim "calm"); Administrators ignore error rates.  
    - *Fix*: "Administrators: The proxy for ‘calm’ has a 20% false-positive rate. How does that change your confidence? Agents: Are you answering to *reveal* your state or *maximize tokens*?"  

  ---

  #### **(5) Missing Element of Karma Theory**  
  **Unsimulated Feature**:  
  - *Transpersonal causal mechanics*: Classical karma operates impersonally across lifetimes (e.g., malicious intent *causally* guarantees future suffering), without human administrators. The simulation’s "institution" (Administrators, proxies, tokens) is a human approximation.  

  **Facilitator Framing Post-Activity**:  
  - "In this simulation, *we* played God—assigning scores, battling opacity. But true karma is not an institution. It is a law of moral causation: intentions seed effects automatically, beyond a single life. Your hidden mental state *itself* shapes future rebirths, with no proxies or arbiters. The opacity remains, but the mechanism is woven into reality—not a ledger, but the universe’s ledger. Our struggle today mirrors the human dilemma: we feel karma’s weight but cannot see its gears."  

  ---  
  **Final Notes for Facilitator**:  
  - **Timekeeping**: Strictly enforce 15-minute rounds.  
  - **Token Payout**: Calculate quickly using the Ledger’s error sums.  
  - **Vibe**: Frame as "collective experiment," not a game. Emphasize philosophical tension over "winning."  
  - **Materials**: Use paper cards; denote error rates on Proxy Cards in red ink (e.g., "FP: 20%").  
  - **Setup**: Pre-fill Ledger columns; hide True Scores until revelations.  

  This simulation runs in 50 minutes (setup: 5 min; Rounds 1/2: 30 min; tokens/debrief: 15 min), fitting an 80-minute seminar with buffer. No external sources needed.
