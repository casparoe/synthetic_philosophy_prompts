  - Administrators write scores in *Round 1 Assigned Score* column.  
  - **Revelation**: Agents reveal *Mental State* cards. Facilitator records *True Mental State* and *True Desert Score* on Ledger.  

  **Round 2: Proxy-Based Scoring (15 min)**  
