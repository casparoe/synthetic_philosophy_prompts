  Finally, the "moral accounting clause" is key—it codifies unpaid debt as forever outstanding. That's incompatible with liability-expiry logic in tort law. If the state rejected continuous personhood, reparations could only exist as discretionary gifts, not institutional obligations.
answer: |-
  Here is the numbered list:

  1.  It presupposes a theory of *collective moral responsibility* where institutions, as corporate moral agents persisting through time, bear ongoing obligations for harms perpetrated under their authority, distinct from the liability of individual perpetrators or members.
  2.  It relies on a view of *continuous institutional personhood and identity* across generations, rejecting "strict presentism," and implicitly excludes purely associative obligations based solely on shared group identity rather than institutional continuity and agency.
  3.  The apology functions primarily as a *performative act* (creating a new normative reality of acknowledgment and obligation) rather than merely reporting the state's current mental state, transforming moral relations by officially recognizing the debt.
  4.  A philosophical tension exists with statutes of limitation in tort law, as the practice asserts a *permanent, morally outstanding debt* while private law deems similar claims legally extinguished, highlighting a conflict between enduring moral responsibility and legal finality.
  5.  If the underlying view of *continuous state personhood* were rejected, the core feature requiring *institutional successors to inherit and discharge the moral obligations* of predecessor states would have to be abandoned.
