answer: |-
  The described institutional asymmetry reflects and reinforces a normative framework that implicitly treats procreation as a default good requiring minimal justification, while non-procreation (especially permanent sterilization) is treated as suspect. Below is a systematic analysis followed by the structured summary.

  ---

  ### Analysis
  1. **Implicit Normative Theory**:  
     The system presupposes a **modified pronatalist asymmetry**:  
     - **Absence of suffering is good** (justifying IVF regulation to ensure healthy outcomes), but not inherently tied to avoiding harm to the potential child.  
     - **Absence of pleasure (non-existence) is neutral**, not a harm requiring justification. Thus, IVF is framed as *benefiting* prospective parents (satisfying their desire for children), not the unconceived child.  
     - **Creation requires justification only if suffering is likely** (e.g., genetic disorders screened during IVF), but not for existence itself.  
     - This diverges from Benatar's strict asymmetry by treating procreation as *presumptively beneficial to existing persons* (parents/society), not primarily as a moral act toward the created being. Non-creation is seen as a *loss to parents*, not a gain for the non-existent.  

  2. **Strict Requirements vs. Accommodations**:  
     - **Requires**:  
       - Fertility services to meet safety/quality standards (prioritizing successful birth).  
       - Barriers to sterilization (waiting periods, assessments) to "protect" against "regret."  
       - Non-consideration of procreation’s inherent moral status (no counseling on whether creation *itself* could be harmful).  
     - **Accommodates**:  
       - Physician refusal of sterilization (via conscience clauses).  
       - Subsidization of IVF but not long-acting contraception (allowing but not mandating cost disparities).  
       - Private fertility clinics operating without ethical counseling mandates.  

  3. **Coherence with Bodily Autonomy**:  
     Incoherent. Legal systems uphold bodily autonomy in abortion, gender-affirming care, and elective surgeries (e.g., cosmetic procedures), where regret risks exist but are not mitigated by mandatory delays or spousal consent. Sterilization restrictions contradict this principle by treating reproductive autonomy as revocable (for the childless) and prioritizing potential future desires over current consent. The asymmetry reveals an underlying pronatalist bias: the body’s "natural" reproductive function is privileged over its elective non-function.  

  4. **Institutional Changes if Inverted**:  
     If procreation required justification and non-procreation were default:  
     - **Funding Priorities**: Shift subsidies from IVF to universal contraception/sterilization access; tax IVF to fund child welfare.  
     - **Consent Protocols**: Mandate "creation justification" counseling for IVF (addressing suffering risks, environmental impact, and antinatalist ethics); remove barriers to sterilization (no waiting periods, spousal consent, or age restrictions).  
     - **Mandatory Counseling**: Require fertility clinics to provide antinatalist-perspective counseling; integrate ethical modules on procreation’s asymmetry into family-planning services.  
     - **Legal Recognition**: Legally acknowledge "right to non-procreation" as equal to reproductive rights; penalize sterilization refusal without medical grounds.  

