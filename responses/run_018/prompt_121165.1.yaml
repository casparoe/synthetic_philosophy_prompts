prompt: |-
  hey — I'm in a comp-ling-adjacent PhD and I'm building an annotation scheme for emotion in dialogue, and I don't want to commit to a defintion before I have the spec. So: assume emotions are whatever a theory of emotion says they are, and write me the desiderata such a theory has to meet to be usable for my purpose — with the concrete case behind each requirement. The weird cases are the ones I actually have to code: a speaker says "I'm not angry" and every other cue says they are; there's fear whose object turns out not to exist (the noise in the house that's just the cat); there's an episode with a distinctive feel but no object I can find (the dread a certain chord progression gives you); the same episode gets reported as grief and as relief; and a speaker attributes an emotion to a chatbot, or to a dead relative. I also want to know which distinctions a theory isn't allowed to collapse: having an emotion vs. feeling it vs. expressing it, occurrent vs. standing, mood vs. emotion, the emotion vs. its typical causes and typical effects, and whether the intentional object can be something the subject doesn't believe (being moved by a scene you know is staged). Don't write "handle the recalcitrant case" as a line item — say why each thing is a requirement, mark which are non-negotiable and which are really just commitments of one camp (I suspect the judging-theories have a stake in a few of these being everyone's problem), and flag any pair of desiderata you think can't both be met — that's the part I most want. Then briefly, how the judgment view, the perceptual/attitudinal view, and the feeling or somatic view do against your own list, and which single requirement kills the most candidates. No citations or reading lists please, I can't use them anyway — just the argument.
reasoning: |-
  Okay, the user is working on an annotation scheme for emotion in dialogue as part of their computational linguistics-adjacent PhD. They need a theory of emotion that can handle tricky cases without committing to a specific definition yet. Let me unpack their request.

  First, they provided concrete examples that are problematic: denying emotion while showing it (like saying "I'm not angry" but appearing angry), fear without a real object (like a noise that turns out to be a cat), objectless emotions (dread from music), conflicting reports (grief vs. relief), and attributing emotions to non-sentient entities (chatbots or the dead). These cases need to be addressed in the desiderata.

  They also mentioned distinctions that must be maintained: having vs. feeling vs. expressing emotion, occurrent vs. standing states, mood vs. emotion, emotion vs. its causes/effects, and intentional objects without belief (being moved by fiction). These distinctions are crucial for accurate annotation.

  The user doesn't want vague requirements like "handle recalcitrant cases." Instead, each desideratum must explain why it's necessary based on specific examples. They also want to know which requirements are non-negotiable versus those tied to specific theoretical camps. Importantly, they need to identify any conflicting desiderata and how different theories (judgment, perceptual, somatic) fare against the list.

  I should start by listing the core requirements derived from their examples and distinctions. For instance, the "I'm not angry" example requires separating expression from feeling and self-report. The fear of a non-existent object needs intentionality that doesn't rely on actual existence. The chord progression case requires emotions without objects, which challenges some theories. Conflicting reports (grief/relief) need multiple perspectives without assuming one is correct. Non-sentient attribution requires distinguishing ascription from actual emotion.

  Key distinctions like expression vs. feeling are non-negotiable because annotations in dialogue rely on observable cues versus internal states. Occurrent vs. standing is essential for temporal aspects in conversations. Mood vs. emotion affects coding duration and triggers. Emotion vs. causes/effects prevents confounding factors in analysis. Intentionality without belief is necessary for fictional contexts.

  Potential conflicts: Object Independence (allowing non-existent objects) vs. Intentionality (requiring an object) might clash. Also, Self-Report Fallibility vs. First-Person Authority could be tricky—how to value self-reports when they're fallible yet sometimes authoritative.

  Next, evaluating theories. The judgment theory (emotions as judgments) fails on Object Independence (can't handle fear of something that doesn't exist) and Self-Report Fallibility (if the judgment is conscious, why deny it?). Perceptual theories (emotions as perceptions) might handle objectless cases but struggle with non-propositional objects like music. Somatic theories (based on feelings) can't easily separate emotion from expression or handle non-sentient ascription.

  The requirement that likely eliminates most theories is Self-Report Fallibility because it requires emotions to exist independently of the subject's awareness, which challenges judgment and some perceptual theories. Somatic theories might handle fallibility but fail elsewhere.

  I need to ensure each desideratum is clearly tied to an example, mark non-negotiables, note theoretical commitments, highlight conflicts, and concisely evaluate each theory. Also, emphasize which requirement is the biggest hurdle (probably Self-Report Fallibility).
answer: |-
  Here's a breakdown of desiderata for an emotion theory tailored to your annotation needs, derived from your concrete cases and required distinctions. The focus is on operationalizability for dialogue annotation, highlighting tensions and theoretical trade-offs.

  **Core Desiderata (Non-Negotiable for Dialogue Annotation):**

  1.  **Observable Expression ≠ Felt Emotion ≠ Self-Reported State:**
      *   **Why:** Your core case ("I'm not angry" + angry cues). Annotation must capture observable signals (prosody, lexemes, dialogue acts) independently from speaker's claimed internal state or inferred actual feeling. Collapsing these prevents coding the conflict itself.
      *   **Requirement:** The theory must conceptually separate the physiological/expressive component, the subjective experience, and the verbal declaration/attribution of an emotion. It must allow for potential mismatches (expression without feeling, feeling without expression, report contradicting both).
      *   **Non-Negotiable:** Yes. This is fundamental to coding dialogue data where expression and report are primary evidence, but not infallible indicators.

  2.  **Intentionality with Object Flexibility:**
      *   **Why:** Cases like fear of the noise (object exists but is misidentified), dread from music (object is the music itself, even if vague), and being moved by fiction (object known to be unreal). Emotion episodes in dialogue *about* something are common and need coding targets.
      *   **Requirement:** The theory must include intentionality (aboutness) as a core feature of (most) emotions. Crucially, the *intentional object* must be specifiable even if: a) the object doesn't exist (fictional entities, hallucinations), b) the subject knows the object isn't real (staged scene), c) the object is diffuse or abstract (music, "everything").
      *   **Non-Negotiable:** Yes (for occurrent emotions). Coding "fear of what?" or "anger at whom?" is essential context. "Objectless" moods/dread might be a separate category (see #7).

  3.  **Self-Report Fallibility:**
      *   **Why:** The "I'm not angry" case & conflicting reports (grief/relief). Speakers can be mistaken, deceptive, or lack insight about their own emotions. Annotation can't rely solely on self-report.
      *   **Requirement:** The theory must allow that a subject's verbal report about their own emotion state can be *incorrect* relative to other evidence (behavior, context, physiological cues inferred by others). Emotion states must be theorized as existing independently of the subject's conscious access or willingness to report accurately.
      *   **Non-Negotiable:** Yes. Annotating based on dialogue demands acknowledging that self-report is just one (potentially unreliable) data point.

  4.  **Occurrent vs. Standing Distinction:**
      *   **Why:** Dialogue unfolds in time. An outburst of anger (occurrent) vs. a character trait of being generally irritable (standing) require different coding. Moods (#7) also relate to duration.
      *   **Requirement:** The theory must provide clear criteria for distinguishing a transient emotional *episode* happening at a specific moment (triggered, with intensity) from a more enduring emotional *disposition* or trait that persists over time and colors multiple interactions.
      *   **Non-Negotiable:** Yes. Temporal granularity is crucial for event-based annotation in dialogue turns.

  **Important Distinctions & Nuances (Potentially Camp-Specific, But Critical for Clarity):**

  5.  **Emotion vs. Cause/Effect:**
      *   **Why:** To avoid circularity and ensure precise coding. E.g., "He yelled *because* he was angry" (anger caused yelling) vs. "His yelling *was* his anger" (collapsing). Or, "The insult made him angry" (cause) vs. "Anger made him insult back" (effect).
      *   **Requirement:** The theory must provide criteria to distinguish the core emotional state/appraisal/feeling from the antecedent events that typically trigger it and the consequent behaviors/expressions that typically result from it.
      *   **Theoretical Commitment:** Strongly emphasized by appraisal and cognitive theories. *Not* inherently non-negotiable, but collapsing this makes annotation highly ambiguous ("Is this code for the cause, the feeling, or the reaction?").

  6.  **Mood vs. Emotion (Occurrent):**
      *   **Why:** A character speaking in a subdued, pessimistic way throughout a scene (mood: sadness/depression) vs. a sudden burst of tears upon hearing specific news (emotion: grief). Duration, intensity, and object-directedness differ.
      *   **Requirement:** The theory should distinguish diffuse, lower-intensity, longer-lasting affective states (moods) often *without* a clear, specific intentional object, from shorter, more intense, object-directed emotional episodes.
      *   **Theoretical Commitment:** Widely accepted distinction, though boundaries can be fuzzy. Crucial for coding duration and specificity. Your "dread" case might be mood-like. *Operationally Non-Negotiable* for coding clarity.

  7.  **Third-Person Ascription vs. First-Person Experience:**
      *   **Why:** Attributing emotion to a chatbot or dead relative. We *talk* about non-sentient entities "feeling" things metaphorically or based on behavior (e.g., "the chatbot seemed frustrated," "my late father would be proud"). This needs coding, but the theory must clarify the ontological status.
      *   **Requirement:** The theory must allow for the concept of *emotion attribution/ascription* by a speaker towards an entity (sentient or not), distinct from claiming the entity *actually experiences* the emotion in the same way a conscious human does. It should clarify the basis for such ascriptions (behavior, simulation, convention).
      *   **Theoretical Commitment:** Primarily a requirement for *coding the utterance*, not necessarily for the theory's core definition of emotion. All theories can accommodate this distinction as "attribution" vs. "genuine experience." *Non-Negotiable* for handling these utterances.

  **Key Tensions & Conflicts:**

  *   **Object Independence (#2) vs. Intentionality (#2):** Allowing non-existent objects (fear of the noise-that's-a-cat) or objects known to be unreal (fiction) is crucial. However, some theories (e.g., strong Judgment theories) tie emotion intrinsically to a *belief* about the object. If the subject knows the noise is just the cat or the scene is staged, can they *truly* fear it under such a theory? This is a major point of contention. *Resolution Needed:* The theory must allow intentional objects that are *represented* or *imagined* or *appraised*, even if not believed to be real or threatening in a factual sense.
  *   **Self-Report Fallibility (#3) vs. First-Person Authority:** While non-negotiable for annotation (#3), this directly challenges theories that define emotions *as* conscious judgments or feelings readily accessible to the subject. If emotion is fundamentally a conscious judgment ("I judge this to be offensive, therefore I am angry"), why would a subject sincerely report "I'm not angry"? Theories need an account of unconscious processes, self-deception, or dissociation between components.
  *   **Objectless Episodes (#2 - Dread) vs. Intentionality (#2):** The chord progression dread feels intentional ("dread *of* the music"? "dread *caused by* the music?" "dread *simulated by* the music?"), but the object is elusive or the state feels diffuse. Does this challenge intentionality as necessary? *Resolution Needed:* The theory must either 1) Provide a way to specify an intentional object for such cases (e.g., "the sound itself," "the atmosphere it creates," "a vague sense of foreboding"), 2) Clearly categorize this as a distinct phenomenon (e.g., mood, affect, sensation), or 3) Allow for genuinely non-intentional affective states as a subtype of "emotion" for coding purposes.

  **Theory Evaluation Against Desiderata:**

  1.  **Judgment/Cognitive Appraisal Theories (Emotion = evaluation/judgment of situation w.r.t. goals):**
      *   **Strengths:** Handles Intentionality (#2) well (object is judged). Distinguishes emotion from cause/effect (#5) clearly. Supports Mood vs. Emotion (#6) distinction. Explains some conflicting reports (#3 - differing appraisals).
      *   **Fatal Flaws:** Struggles **catastrophically** with **Self-Report Fallibility (#3)**: If anger *is* the judgment "this is offensive," how can one sincerely say "I'm not angry"? Judges "I am not angry" would be false by definition. Also struggles with **Object Independence (#2)**: Fear requires judging something as threatening; how can you judge a *known* fiction or a *known* harmless noise (the cat) as threatening? Might dismiss objectless dread (#2) as not a "true" emotion. **Ascription (#7)** is purely metaphorical/error.

  2.  **Perceptual/Attitudinal Theories (Emotion = perception of value/attitude towards object):**
      *   **Strengths:** Handles Intentionality (#2) flexibly (perceiving value in fiction, misperceiving threat). Can accommodate **Self-Report Fallibility (#3)** (perceptions can be non-conscious or misreported). Handles **Object Independence (#2)** better than Judgment (can perceive value/threat in imagined or known-fictional objects). **Ascription (#7)** can be seen as simulating perception.
      *   **Weaknesses:** Can blur Emotion vs. Cause/Effect (#5) if "perception" includes the triggering stimulus. Distinguishing Mood vs. Emotion (#6) can be less clear-cut. **Objectless Dread (#2)** is a challenge: What value is being perceived? Needs an account for diffuse states.
      *   **Viability:** Generally strong contender. Biggest hurdle is clarifying the ontology of "perception of value" and handling diffuse states.

  3.  **Feeling/Somatic Theories (Emotion = awareness of bodily changes/feeling):**
      *   **Strengths:** Naturally accounts for **Expression (#1)** (expression causes/is part of feeling). Can handle **Self-Report Fallibility (#3)** (feelings can be mislabeled, ignored, or dissociated from). **Objectless Dread (#2)** fits well as a raw feeling.
      *   **Fatal Flaws:** Struggles with **Intentionality (#2) & Object Flexibility**: Why is *this* feeling (butterflies) fear *of the noise* and not just undirected anxiety? How is fear-of-fiction different from indigestion? Collapses **Emotion vs. Expression/Feeling (#1)** too much (emotion *is* the feeling/expression). Struggles with **Occurrent vs. Standing (#4)** (what's a "standing feeling"?). **Ascription (#7)** to chatbots makes little sense under a somatic view. Explaining **Conflicting Reports (#3 - grief/relief)** purely somatically is difficult (similar bodily states?).

  **The Requirement That Kills the Most Candidates: Self-Report Fallibility (#3).**

  *   **Why:** It directly challenges theories that define emotion *as* a conscious state readily accessible to the subject (strong Judgment theories) or *as* the feeling itself that one should be able to report (naive Somatic views). It demands that emotions have an existence independent of the subject's accurate self-knowledge or willingness to report, requiring concepts like unconscious emotions, dissociated components (appraisal vs feeling), or complex causal chains where self-report is just one output. Judgment theories are hit hardest, as a sincere contradictory self-report becomes a logical contradiction. Perceptual theories handle this best by allowing non-conscious perceptions/misinterpretations.

  **Recommendation for Your Annotation Scheme:**

  Prioritize a **component process model** (inspired by Scherer, Ellsworth, etc., but no citations needed!). This views emotions as dynamic processes involving interconnected components:
  1.  **Appraisal:** Evaluation of stimulus (internal/external) w.r.t. goals (flexible on belief/reality).
  2.  **Bodily Changes/Feeling:** Physiological responses and subjective feeling tone.
  3.  **Expression:** Facial, vocal, gestural signals.
  4.  **Action Tendency:** Urge to act (approach, avoid, etc.).
  5.  **Cognitive/Verbal Label:** Conceptualization and report ("I'm angry").

  **Why it fits:**
  *   Handles **#1 (Distinction):** Components are separable (expression can occur without full feeling/appraisal; report can contradict appraisal/feeling).
  *   Handles **#2 (Intentionality/Flexibility):** Appraisal provides the intentional object (can be real, imagined, fictional, misidentified). Feeling/expression can be objectless or diffuse.
  *   Handles **#3 (Fallibility):** Appraisal can be automatic/unconscious; feeling can be misattributed; report can conflict with other components.
  *   Handles **#4 (Occurrent/Standing):** Occurrent = active episode involving components; Standing = disposition influencing appraisals/readiness.
  *   Handles **#5 (Cause/Effect):** Cause triggers appraisal; emotion (as process) causes effects (actions, further expressions).
  *   Handles **#6 (Mood):** Mood as altered baseline in appraisal thresholds or feeling tone, less tied to specific triggers/objects.
  *   Handles **#7 (Ascription):** Coding the speaker's *attribution* based on observed/perceived components in the target (real or imagined).
  *   Handles **Cases:** "Not angry" = dissonance between components (appraisal/feeling vs report). Fear of noise=cat = appraisal error. Dread = strong feeling/action tendency, weak appraisal object. Grief/Relief = different labels for complex appraisal/feeling mix. Chatbot = attributing expression/action tendency components.

  This approach provides the necessary conceptual separations and flexibilities for annotation without forcing a single, overly restrictive definition of "emotion" itself. It explicitly makes the components and their potential mismatches the focus of your coding scheme.
