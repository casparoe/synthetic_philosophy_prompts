  The user wants a conceptual analysis, so I should avoid empirical examples or citations. They’re interested in the tension between agent-neutral normativity and institutional design. That means I need to balance philosophical concepts with practical implementation challenges.

  For the first issue, free-floating reasons suggest that duties exist because the restoration is necessary, not because of any prior relationship. Institutions have roles that make them capable of addressing such needs. But assigning specific obligations is tricky. Role-based capacities might help: an environmental agency has a mandate to protect ecosystems, so they might have an obligation even without direct ties. However, this could lead to diffusion of responsibility, where everyone assumes someone else will act. I should mention the need for coordination mechanisms to prevent this.

  Second, contractualism and constructivism rely on agreements among reason-givers. Free-floating rationales exist outside this framework, which challenges those theories. For ecological issues, where non-reasoners like future generations or ecosystems are involved, contractualism might fall short. The moral status of non-sentient entities is a key point here. If reasons exist independently, then ecosystems have intrinsic value beyond human agreements. This could split the normative landscape, where interpersonal duties follow contractualism, but ecological duties follow objective values.

  Third, beneficiary-independent reasons mean obligations aren't tied to beings who can benefit or claim them. Future generations can't demand action now, and non-sentient systems can't make claims. Free-floating rationales allow for obligations to these entities because the reasons exist regardless. This expands the scope of moral consideration but complicates institutional assignment. How do we design institutions to act for entities that can't hold them accountable? Precautionary approaches and proxy representations might be necessary, but these are imperfect solutions.

