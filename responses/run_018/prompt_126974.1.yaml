answer: |-
  ### Conceptual Outline: Gene-Meme Analogy & Replicator Criteria  
  1. **Standard Analogy**:  
     - *Gene*: Discrete DNA sequence replicating with high fidelity via meiosis/mitosis.  
     - *Meme*: Hypothetical cultural unit (e.g., idea, melody, ritual step) replicating through imitation.  
     - *Interactor*: Biological organism (gene vehicle) vs. cultural artifact/behavior (meme vehicle).  
     - *Selection*: Genes increase in frequency if interactors survive/reproduce; memes increase if vehicles propagate (e.g., via attention or practice).  

  2. **Conditions for Discrete Replicators**:  
     - **Discreteness**: Units have identifiable boundaries (e.g., a gene codon vs. a blended trait).  
     - **Copying Fidelity**: Replication preserves core structure (mutation is exception, not norm).  
     - **Differential Fitness**: Replicator frequency changes based on interactor success.  

  ---

  ### Case Study: **Common Law Precedent as a Failing Meme**  
  **Domain**: Legal reasoning (precedent-based judicial decisions).  

  #### Proposed Darwinian Mapping:  
  - **Replicator**: The *legal principle* (e.g., "duty of care" in negligence).  
  - **Interactor**: The *specific case ruling* applying the principle (e.g., *Donoghue v Stevenson*).  
  - **Selection Pressure**: Rulings succeed (are cited/reused) if socially adaptive (e.g., promote justice/efficiency).  

  #### Structural Collapse Points:  
  1. **Blending/Reconstruction (Not Copying)**:  
     - Precedents are never replicated verbatim. Judges *reinterpret* principles by blending multiple precedents, statutes, and context.  
     - Example: "Duty of care" in *Donoghue* (neighbor principle) vs. modern rulings (foreseeability + proximity factors). Even with perfect records, later rulings are *reconstructions* synthesizing past memes, not copies.  

  2. **Indistinct Unit Boundaries**:  
     - No non-arbitrary way to isolate a "legal principle meme." Is "duty of care" one meme or a cluster of sub-memes (foreseeability, proximity, fairness)?  
     - *Structural ambiguity*: Two courts independently derive similar rulings from distinct precedents (convergence). The Darwinian framework cannot resolve whether this is meme-sharing or parallel invention.  

  3. **Selection Acts on the Vehicle, Not Replicator Frequency**:  
     - A ruling’s success (interactor) depends on *rhetorical utility* (e.g., flexibility for future cases), not fidelity to an original principle (replicator).  
     - Result: "Successful" memes are those most *malleable*, contradicting the need for copying fidelity.  

  #### Core Failure:  
  Even with complete transmission data, we cannot determine whether:  
  - A modified ruling (e.g., expanding "duty of care") is a *mutation* of the original meme,  
  - A *new meme* forged from blended sources, or  
  - *Convergent evolution* of a similar solution. The replicator’s identity dissolves under reinterpretation.  

  ---

  ### Repairing the Analogy: Essential Feature  
  A viable cultural-evolution framework must incorporate **hermeneutic inheritance**:  
  - **Reconstructive Transmission**: Memes inherit through *interpretive acts* that transform content contextually.  
  - **Fidelity Defined by Function**: A meme persists if its *functional role* (e.g., resolving negligence disputes) is maintained, even if its form varies.  
  - **Replicator as Process**: Units are *dynamic templates* (e.g., "how to reason about duty") rather than static content.  

  This avoids gene parallelism by making reconstruction central—not a defect, but the mechanism of inheritance. Selection acts on the template’s adaptability, not allele-like stability.
