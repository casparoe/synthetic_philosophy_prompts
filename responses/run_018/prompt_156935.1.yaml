answer: |-
  ### Structured Activity: "The Credential Dilemma"  
  **Objective:** Simulate tension between conciliationism (adjusting beliefs toward group consensus) and steadfastness (holding firm to one's view) with hidden second-order peer disagreement (disagreement about whether participants are epistemic peers).  

  ---

  #### **Setup**  
  1. **Scenario**:  
     - The group is a university committee allocating a $10,000 grant to **one of three proposals**:  
       - *Proposal A*: Host a climate science conference.  
       - *Proposal B*: Fund a public health initiative.  
       - *Proposal C*: Create a digital ethics curriculum.  
     - **Goal**: Reach a unanimous decision in 25 minutes. If unanimous, the group "wins" (e.g., symbolic prize). If not, the grant is lost.  

  2. **Private Credential Cards** (distributed secretly):  
     - Each card lists:  
       - **Expertise Level** (1–5) for *each proposal* (1 = novice, 5 = expert).  
       - **Confidence Level** (1–5) in their own judgment (1 = low, 5 = high).  
       - **Initial Position**: Which proposal they *must* advocate for based on expertise/confidence (pre-calculated to create conflict).  
     - **Disclosure Rules**:  
       - Participants can *only* reveal expertise using **three vague tiers**:  
         - "Low expertise" (levels 1–2),  
         - "Moderate expertise" (level 3),  
         - "High expertise" (levels 4–5).  
       - They **cannot** reveal exact numbers, confidence levels, or show their card.  

  3. **Credential Assignment** (designed to create asymmetry):  
     - Assign roles ensuring **second-order peer disagreement**:  
       - **True Experts**: 4 participants with *actual* high expertise (4–5) in one proposal and low (1–2) in others.  
       - **Overconfident Novices**: 4 participants with *low* expertise (1–2) but *high* confidence (5) in one proposal. They genuinely believe they are experts.  
       - **Balanced Moderates**: 4 participants with moderate expertise (3) across all proposals.  
     - **Example**:  
       - Participant X (True Expert for Proposal A): Expertise A=5, B=1, C=1 → Must advocate for A.  
       - Participant Y (Overconfident Novice for A): Expertise A=1, B=2, C=2 (but confidence=5) → Believes they are an expert, must advocate for A.  
       - *Result*: X and Y both advocate for A, but X knows Y is not a peer; Y thinks they are peers.  

  4. **Incentives (Payoff Structure)**:  
     - **Group Reward**: Unanimous decision → All get 10 points.  
     - **Individual Reward**: If the group’s final decision matches their initial position → +15 points.  
     - **Tension**: Conciliating risks losing individual points; staying steadfast risks group failure.  

  ---

  #### **Procedure**  
  1. **Intro (5 min)**:  
     - Explain the scenario, rules, and payoffs. *Do not mention conciliationism/steadfastness.*  
     - Emphasize: "Use only allowed expertise tiers. Goal is unanimous consensus."  

  2. **Private Prep (3 min)**:  
     - Participants read cards, note their initial position and expertise tiers.  

  3. **Group Deliberation (25 min)**:  
     - Facilitator enforces strict **timed rounds**:  
       - **Round 1 (Position)**: Each states initial proposal choice and expertise tier (e.g., "I support A; high expertise in climate science").  
       - **Round 2 (Deliberation)**: Open debate. Participants argue, build alliances, and revise stances.  
       - **Round 3 (Vote)**: Secret ballot. If unanimous, done. If not, repeat Rounds 2–3.  
     - **Facilitator Tools**:  
       - Interrupt if rules are broken (e.g., someone cites exact expertise numbers).  
       - Announce time warnings (e.g., "10 minutes left!").  

  4. **Debrief (30 min)**:  
     - Reveal the "win/lose" outcome.  
     - Guide discussion:  
       - *"What strategies did you use to persuade others?"*  
       - *"Did anyone change their position? Why?"*  
       - *"Were there disagreements about whose expertise mattered?"*  
     - **Map to Concepts**:  
       | **Philosophical Concept** | **In-Game Moment** |  
       |----------------------------|---------------------|  
       | **First-order disagreement** | Initial conflict over which proposal to fund. |  
       | **Second-order peer disagreement** | True Expert vs. Overconfident Novice both claiming "high expertise" for the same proposal → Dispute over who is *really* credible. |  
       | **Conciliationist move** | Participant abandons initial position to compromise (e.g., "I’ll support B even though I’m an expert in A"). |  
       | **Steadfast response** | Participant refuses to budge (e.g., "I’m the expert here—we must fund A!"). |  
     - Introduce terms **conciliationism** and **steadfastness**; link to observed behaviors.  
     - **Limitations**:  
       - Cannot simulate long-term belief revision (game is short).  
       - Introspection is artificial (participants know it’s a game).  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Problem: Gaming the System**  
     - E.g., A participant lies about expertise to "win."  
     - **Solution**:  
       - Pre-activity: Stress honesty for learning.  
       - During: Assign roles where lying backfires (e.g., an Overconfident Novice lies, but the group’s wrong decision costs them points).  

  2. **Problem: Dominant Personalities**  
     - E.g., One participant monopolizes debate.  
     - **Solution**:  
       - Enforce timed rounds (e.g., 60 seconds per speaker).  
       - Use secret ballots to dilute influence.  

  3. **Problem: Premature Consensus**  
     - E.g., Group splits the difference too quickly.  
     - **Solution**:  
       - Assign extreme positions (True Experts *must* advocate 100% for their proposal).  
       - Remind them individual rewards require matching initial positions.  

  4. **Problem: Group Fracture**  
     - E.g., Steadfast players cause deadlock.  
     - **Solution**:  
       - Let it happen! Use it in debrief to show how steadfastness can collapse cooperation.  

  ---

  #### **Why This Works**  
  - **Tension Embodied**: Conciliationists lose individual rewards; steadfast players trigger group failure.  
  - **Second-Order Conflict**: Hidden expertise asymmetry forces debates about "who counts as a peer."  
  - **Prisoner’s Dilemma Parallel**: Individual rewards incentivize steadfastness; group rewards incentivize conciliation.  
  - **No Prep Needed**: Concepts emerge from gameplay, not lectures.  

  **Outcome**: Participants *feel* the frustration of weighing personal credibility against collective harmony, setting up rich debrief discussions on epistemology.
