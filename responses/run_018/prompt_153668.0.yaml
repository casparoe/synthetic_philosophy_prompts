  The core tension I see: They want to use a modified self-driving car example to bypass traditional debates, but worry it might derail into AI ethics. Smart move choosing resentment toward an algorithm - it forces the "participant attitude" question starkly. But I need to ensure the example stays lean: must include algorithm's goal-oriented autonomy and harm-causing capacity, but exclude any anthropomorphizing features or societal implications. 

  Hmm... the biggest pitfall will be students seeing this as just "compatibilism lite." That misconception needs killing early when defining reactive attitudes. Should stress Strawson's move isn't metaphysical but phenomenological - we're examining actual practices, not justifying them. 

  For sequencing: Starting with algorithm resentment is good shock therapy, but must immediately contrast with human resentment to reveal what's missing. Gratitude should come later as a mirror - if they deny resentment toward algorithms but affirm gratitude toward humans, that reveals the participant stance. 

  The weakest point? When claiming reactive attitudes are constitutive. A sharp student could agree we have these feelings but argue they're irrational in a deterministic world. That's where I'd plant the "but what would abandoning them cost?" question to reveal the framework's depth. 

  What would make me rethink? If empirical evidence shows students grasp participant stance better through human examples first. But for theory-heavy grad students, the alien example might actually work better by preventing familiar thought ruts. 

  Should openly refuse two things: the objective attitude subtypes (too granular) and historical comparisons (distracts from framework shift). Closing check must distinguish "I see why determinism doesn't touch this" from "I still want metaphysical guarantees."
answer: |-
  Here’s a structured teaching plan designed to reframe the debate using Strawson’s reactive attitudes, anchored to your self-driving algorithm example. The dependency order prioritizes phenomenological intuition over metaphysical assumptions, targeting predictable misconceptions at critical junctures.

  ---

  ### **Teaching Plan: Strawson’s Reactive Attitudes & the Orthogonality Thesis**  
  **Core Objective:** Shift focus from *"Does determinism permit responsibility?"* to *"What practices constitute holding responsible?"*  

  ---

  ### **Key Conceptual Sequence & Rationale**  
  *(Total: 50 mins)*  
  1. **Opening Hook: The Algorithm Resentment Case (5 mins)**  
     - **Case:** *A self-driving vehicle’s navigation algorithm, designed to minimize travel time, chooses a route that predictably damages property (e.g., floods a garden by taking a shortcut through soft soil). The owner feels resentment toward the algorithm.*  
     - **Prompt:** *"Does the owner’s resentment make sense? Why/why not?"*  
     - **Why first?** Forces confrontation with attitudes toward non-human agents. Students predictably dismiss it as "irrational," exposing their implicit criteria for reactive attitudes.  

  2. **Contrast: Human Resentment Scenario (5 mins)**  
     - **Case:** *A human driver takes the same shortcut, knowingly damaging the garden to save time.*  
     - **Prompt:** *"Is resentment appropriate here? What’s the difference?"*  
     - **Key Interception:** Students will cite *intentions* or *consciousness*. Interrupt: *"What if the human driver had a deterministic brain? Does that change the resentment?"*  
     - **Why here?** Reveals that reactive attitudes persist despite determinism (setting up orthogonality).  

  3. **Define Reactive Attitudes (RA) (10 mins)**  
     - **Examples:** Resentment (first), gratitude (second), indignation.  
     - **Crucial move:** Frame RAs as *sui generis* social practices—**not** emotions (heading off "non-cognitive feelings" misconception).  
       - *"Resentment isn’t just anger; it’s a protest against wrongful disregard."*  
     - **Link to algorithm case:** *"Why does resentment fail here? Not because of determinism, but because ______."* (Elicit: lack of *moral community*).  

  4. **Introduce Objective Attitude (OA) (10 mins)**  
     - **Define OA:** Treating agents as objects to be managed (e.g., fixing the algorithm, medicating the human driver).  
     - **Contrast:** Show OA vs. RA as mutually exclusive stances.  
     - **Algorithm pivot:** *"We adopt OA toward the algorithm naturally. Can we adopt OA toward the human driver? What would that look like?"*  
     - **Intercepted Misconception:** *"Strawson denies free will exists."* → Clarify: He’s agnostic; the framework works *regardless* of determinism’s truth.  

  5. **Strawson’s Orthogonality Thesis (10 mins)**  
     - **Thesis:** RAs depend on seeing agents as *participants in moral relationships*, not on metaphysical freedom.  
     - **Algorithm test:** *"If we built an AI that *understood* moral reasons, expressed remorse, and sought forgiveness—would resentment then make sense? Why?"*  
       - **Must possess:** Capacity for reciprocal moral engagement (e.g., recognizing reasons, expressing attitudes).  
       - **Must lack:** Human-like consciousness (to avoid AI ethics rabbit holes).  
     - **Dependency safeguard:** Students can’t smuggle in compatibilism—the case lacks any "control" condition.  

  6. **Collapse Point & Defense (5 mins)**  
     - **Vulnerability:** When introducing OA. Students may conflate OA with *excusing conditions* (e.g., "The driver was coerced!").  
     - **Save it:** Distinguish: *"Excuses appeal to the *participant* stance (e.g., ‘They couldn’t help it’); OA rejects the stance entirely."*  

  7. **Closing Check: Genuine Uptake vs. Discomfort (5 mins)**  
     - **Check Q:** *"If determinism is true, does Strawson’s framework imply we’re *wrong* to feel resentment?"*  
       - **Genuine uptake:** "No—it’s not about justification; it’s about what we *do*."  
       - **Residual discomfort:** "But shouldn’t we stop if determinism is true?" (reveals lingering metaphysical anxiety).  
     - **Refuse:** *"We won’t resolve whether determinism is *true*—only why it’s irrelevant to RAs."*  

  ---

  ### **Explicit Omissions & Refusals**  
  - **Omit:** Taxonomy of OA subtypes (e.g., pathological vs. therapeutic); pre-Strawson free-will history.  
  - **Refuse:** *"Is Strawson a compatibilist?"* → *"His project bypasses that dichotomy—let’s see why."*  

  ---

  ### **Weakest Point in the Arc**  
  - **Step 5 (Orthogonality Thesis):** A student could grant all prior steps but reject Strawson by insisting: *"RA practices *presuppose* libertarian free will—we’re just confused."*  
    - **Why vulnerable?** Strawson’s move is descriptive, not deductive. It relies on accepting RAs as bedrock.  
    - **Mitigation:** Preempt in Step 3: *"We’re describing our actual practices, not justifying them metaphysically."*  

  ---

  ### **Limits of This Recommendation**  
  1. **Pedagogical Evidence:** If data show students grasp RA/OA faster through *human* examples first (e.g., children vs. psychopaths), the algorithm opener could backfire.  
  2. **Conceptual Argument:** If Strawson’s "participant stance" implicitly smuggles in compatibilist control conditions (e.g., reasons-responsiveness), the orthogonality claim weakens.  
  3. **Example Risk:** If students fixate on AI’s *programming* as "deterministic cause," revert to the human driver: *"Brains are programmed too—why does resentment persist?"*  

  **Adjust if:** Students resist the algorithm case early. Pivot to psychopath examples (OA stance) to rebuild the contrast.  

  ---  
  This plan weaponizes your algorithm case to expose the *conditions* for reactive attitudes while making determinism seem irrelevant. By refusing metaphysical justification, you force engagement with Strawson’s radical reorientation.
