prompt: |-
  I've been trying to avoid both the naive "spread everywhere" view and the overly cautious "leave everything untouched" stance, and instead map my actual ethical intuitions about space colonization through reflective equilibrium. I've arrived at a cluster of judgments that seem to point in a coherent direction but resist being captured by any simple rule I can state. I'd like to know whether there's a principle that covers them, or whether I need to overturn one or two.

  Here are my verdicts on concrete cases.

  Terraforming Mercury — a genuinely dead rock with no plausible biosphere — to create human-habitable zones strikes me as not only permissible but actively valuable, even if the process destroys unique geological formations of scientific interest. By contrast, a research mission that introduces Earth microbes into Europa's subsurface ocean through inadequate sterilization protocols strikes me as a serious moral failure, regardless of the scientific payoff. A generation ship launched with fully informed, consenting adults, who understand that their descendants will be born into the voyage with no possibility of returning to Earth, seems ethically acceptable, but only if the ship's governance is democratic and revisable; without that safeguard, it feels closer to institutionalized coercion. A private corporation claiming exclusive extraction rights over lunar south-pole water ice and operating under corporate rather than democratic law strikes me as wrong in essentially the same way as a terrestrial colonial land grab. Seeding a barren asteroid with synthetic extremophiles — designed eventually to render it habitable, with no immediate human presence and with explicit safeguards to preserve any pre-existing chemical signatures — strikes me as permissible, even admirable. But rushing that same seeding process on a moon that shows ambiguous spectral evidence of possibly native chemistry, before a complete survey, strikes me as wrong, though I'm uncertain whether the wrongness is of the same kind as the Europa contamination or closer to reckless negligence.

  The tension I keep returning to is this: my judgments about terraforming and synthetic seeding appear to hinge on epistemic confidence about the absence of native life, while my judgment about the generation ship hinges on governance structures that have nothing to do with biology. Meanwhile, both the poorly governed ship and the corporate lunar claim involve coercing future people, yet I treat them differently depending on whether the setting is mobile or territorial. Is there a unified principle — perhaps combining non-derivation of consent for future generations, epistemic humility about biospheres, and an anti-colonial condition on sovereignty — that captures all six verdicts without being ad hoc? Or does coherence require me to drop one? Please also say what your principle predicts for the case I'm still undecided on: a private entity launching human embryos with AI caretakers to an exoplanet, with no democratic institutions planned until the population reaches ten thousand.

  Please answer in British English.
reasoning: |-
  Okay, the user is grappling with complex ethical intuitions about space colonisation and seeking coherence. They've presented six concrete judgments that seem internally consistent to them but resist simple formulation. The core tension they identify involves balancing epistemic humility about extraterrestrial life, consent principles for future generations, and anti-colonial sovereignty concerns. 

  Hmm, their cases cluster around three axes: celestial bodies' ontological status (dead rock vs potentially living), temporal sovereignty (how governance affects unborn generations), and territorial claims (corporate enclaves vs communal settlement). What's fascinating is how these interact - e.g., they approve terraforming Mercury (ontologically inert) but reject corporate lunar claims (territorially coercive) despite both involving planetary alteration.

  The embryo case they're undecided on is particularly thorny. It combines the non-consensual creation of humans (like the generation ship) with private control (like the lunar claim) while adding new elements: no living founders and AI caretakers. Their hesitation likely stems from whether democratic institutions can emerge organically from such asymmetric power structures.

  Right, to systematise this without being ad hoc, we'd need principles that: 1) distinguish intervention based on evidence of native life (not just probability but moral significance), 2) address sovereignty through revisable consent mechanisms, and 3) prohibit unilateral appropriation. The "governance revisability" condition from their generation ship judgment might be key - it transforms fixed coercion into provisional arrangement.

  Ah, and the embryo case fails spectacularly on this framework: no governance structure exists to be revised, the AI's authority is baked-in, and future humans couldn't reasonably reject their predicament. It shares the lunar claim's wrongful exclusion of alternatives while exacerbating the consent issues of the generation ship without its saving graces.

  Notably, their permissible cases all involve either: uncontested substrates (Mercury), reversible interventions (synthetic seeding with safeguards), or exit ramps for the governed (ship's democracy). The embryo venture lacks all three. So coherence doesn't require abandoning existing judgments - rather, it reveals why this new case should be condemned.
answer: |-
  Your ethical intuitions form a remarkably coherent tapestry when viewed through three interwoven principles: the **Revisable Consent Principle**, the **Biosphere Precautionary Principle**, and the **Anti-Colonial Sovereignty Principle**. Together, they cover your judgments without appearing ad hoc:

  1.  **Revisable Consent Principle (RCP):** Future generations must not be subjected to irreversible conditions or governance structures they could not reasonably reject. Crucially, the *pathway* to revising those conditions must be institutionally embedded and accessible.

  2.  **Biosphere Precautionary Principle (BPP):** Intervention in environments with potential intrinsic value—specifically, environments where native life *could* exist—requires a high epistemic threshold. If sufficient evidence suggests the *absence* of such life or value, transformative intervention may be permissible. If evidence is ambiguous or suggests potential presence, the burden of proof shifts entirely towards preservation until certainty is achieved.

  3.  **Anti-Colonial Sovereignty Principle (ACSP):** Claims of exclusive territorial sovereignty or resource control beyond Earth must derive legitimacy from inclusive governance structures accountable to those affected. Private or non-democratic entities cannot unilaterally claim territory or resources in a manner that precludes future self-determination by inhabitants or the broader human community.

  **Application to Your Cases:**

  *   **Terraforming Mercury (Permissible/Valuable):** BPP satisfied (high confidence no life/potential). RCP satisfied (future colonists choose to live there under revisable governance). ACSP satisfied (assumed governance adheres to principles, not a private land grab).
  *   **Europa Contamination (Serious Moral Failure):** BPP violated (high potential for native life, insufficient epistemic confidence). Intervention reckless.
  *   **Generation Ship (Acceptable only with Democratic Governance):** RCP *satisfied* with democracy (pathway for descendants to revise governance). RCP *violated* without democracy (irreversible imposition of autocratic rule). BPP irrelevant (self-contained system). ACSP satisfied (internal governance accountable).
  *   **Corporate Lunar Claim (Wrong, akin to Colonialism):** ACSP violated (private claim excludes democratic control/accountability). RCP potentially violated (future users/locals excluded from governance/resource access). BPP potentially relevant (if ice holds scientific or biological clues) but secondary to sovereignty failure.
  *   **Synthetic Seeding of Barren Asteroid (Permissible/Admirable):** BPP satisfied (barren, safeguards for chemistry). ACSP satisfied (no claim of exclusive territorial sovereignty implied). RCP satisfied (no future persons coerced; opens possibilities).
  *   **Rushed Seeding on Ambiguous Moon (Wrong):** BPP violated (ambiguous evidence requires precaution, not intervention). Wrongness is primarily epistemic recklessness akin to Europa (BPP failure), compounded by potential negligence regarding future scientific value.

  **Resolving the Tensions:**

  *   **Epistemic Confidence vs. Governance:** The principles are distinct but complementary. BPP governs *where* and *how* we intervene in the external environment based on potential non-human value. RCP governs *how* we structure societies for humans, especially future generations. Both address different sources of moral wrong: harming potential alien life/values vs. coercing future humans.
  *   **Coercion in Mobile vs. Territorial Settings:** The difference lies in the *ACSP* and the nature of the resource. The poorly governed ship violates RCP *internally*. The corporate lunar claim violates ACSP *externally* – it appropriates a scarce, vital resource (water ice) essential for wider lunar activity in a way that establishes territorial control, excluding others and future governance. The ship, while mobile, doesn't inherently claim territorial sovereignty; its wrong is internal governance, not external exclusion (though it *could* become such a claim if it tried to settle a territory under corporate rule).

  **Analysis of the Embryo Mission Case:**

  A private entity launching human embryos with AI caretakers to an exoplanet, with no democratic institutions planned until the population reaches ten thousand, **violates core aspects of your principles and should be judged unethical**.

  1.  **Revisable Consent Principle (RCP):** This is the most severe violation.
      *   The first generations are born into a pre-determined socio-political structure with *zero* say in its creation. They are subject to the rules, values, and priorities programmed into the AI by the distant, private entity.
      *   Crucially, **there is no embedded pathway for revision accessible to the initial generations.** They cannot change the AI's fundamental mandate or governance structure until an arbitrary population threshold is reached – a threshold they had no part in setting. This is irreversible imposition without recourse.
      *   The AI caretaker, however benevolent, represents an unaccountable authority. Consent is impossible for the first humans; revisability is structurally denied until much later. This is akin to, but arguably *worse* than, the undemocratic generation ship, as there are *no* founding adults to even theoretically consent initially.

  2.  **Anti-Colonial Sovereignty Principle (ACSP):** Violated.
      *   A private entity is establishing a *de facto* colony and claiming sovereignty (via its AI proxy) over a territory and its future population. The governance structure is imposed top-down by a distant, unaccountable corporation, not derived from the people who will live there.
      *   It replicates the core wrong of the corporate lunar claim: exclusive control and governance established without democratic legitimacy or accountability to the governed, especially in the critical formative period.

  3.  **Biosphere Precautionary Principle (BPP):** This is relevant but secondary here. The primary wrongs concern human autonomy and governance. However, if the AI caretakers are programmed to prioritise the entity's interests (e.g., resource extraction, specific ideological goals) over environmental precaution *before* democratic institutions exist, BPP could also be violated in the exoplanet's context.

  **Verdict:** This scenario combines the worst aspects of your rejected cases: the irreversible imposition of governance without consent (like the undemocratic generation ship) and the establishment of private, unaccountable territorial sovereignty (like the corporate lunar claim). The addition of AI caretakers acting as unelected rulers for generations makes the RCP violation particularly stark. **According to your principles, this should be judged as ethically unacceptable.**

  **Conclusion:** Your intuitions are coherently captured by the tripartite framework of Revisable Consent, Biosphere Precaution, and Anti-Colonial Sovereignty. You don't need to abandon any core judgment; the principles provide the unifying structure. The embryo mission case clearly falls foul of the RCP and ACSP, confirming the framework's predictive power and your underlying ethical stance. Your reflective equilibrium has led you to a robust, non-naïve, and non-paralysing ethic for space.
