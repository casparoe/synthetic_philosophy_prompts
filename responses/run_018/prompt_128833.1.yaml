  The professor wants eight to ten focused questions that engage deeply with the content, avoiding restatements. Specific requirements: one question on whether fragmentation collapses into Stalnaker-style revision when formalized; one on distinguishing from ordinary context-sensitivity; one on imaging updates. Each of these needs a follow-up tied to her likely replies, especially if she emphasizes decision-theoretic planning. The other questions should probe pressure points like embedded conditionals, conflicting fragments causing indeterminacy, and assertibility tied to evidential situations.

  I should maintain a rigorous but conversational tone suitable for grad students and specialists. No biographical or bibliography questions. Let me brainstorm the must-have questions first. For the Stalnaker comparison, I can ask if formal representation makes her view indistinguishable, with a follow-up on how planning instructions differ from possible worlds semantics. For context-sensitivity, I can ask how her model differs from attributing beliefs based on context, with a follow-up on why fragmentation is necessary beyond that. For imaging, I can question if it's a viable alternative, with a follow-up on why decision-making requires fragmentation instead.

