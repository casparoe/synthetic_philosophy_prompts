  The user emphasized precision and not restating the question, so I'll start directly with the number. Based on my knowledge, I'm leaning around 0.65 because I think the expressive and social aspects have some weight, but it's messy and debatable. 

  Now, decomposing the claim: The claim has two main components. First, the expected moral value from decisiveness—this is about the tiny probability that your vote swings the election and the big moral difference if it does. Even with low odds, the huge stakes might make it worthwhile. Second, the expressive/social effects: even if your vote doesn't change the outcome, it could send signals that influence others or shape norms, and that might carry moral weight. But there's controversy here—some philosophers think only decisiveness matters, while others see voting as expressive.

  For the decisiveness part, in large electorates, the probability is astronomically low, like less than one in a million. The moral difference between A and B is subjective; if it's very large, it could outweigh the low probability. Expected value calculations often support voting in theory, but critics say it ignores the costs or the irrationality of such small chances.

  For the expressive part, I need to consider several sub-questions: Does voting express endorsement? Can it signal something more nuanced? What are the social consequences? For instance, voting might build momentum for a candidate or affect coalition-building, but it could also legitimize bad policies. There's also the risk of misinterpretation—people might think you support all of A's platform, which the voter doesn't. This is highly contested; no consensus here.

  Combining these: The decisiveness part might be small but positive, and the expressive part could add a bit more. I'll assign rough probabilities: say 0.95 that decisiveness gives a small positive reason, but that's weak. For expressive effects, I'm less confident—maybe 0.6 that they provide a net moral reason to vote. Overall, multiplying or averaging gets me to around 0.65.

  My credence is most sensitive to the expressive/social effects question. If strong evidence showed that voting generally has harmful expressive consequences, like entrenching bad norms, my credence would drop. Conversely, evidence that it promotes accountability or reduces polarization could raise it.

  On what's settled: The decisiveness math is settled—low probability but high stakes can make expected value positive. However, whether that's the only moral consideration is hotly debated. Expressive theories are still contested, with no clear consensus.

  The gap between the user's 0.7 and their friend's 0.3 likely tracks the expressive/social effects. The user probably weights expressive reasons more positively, while their friend might see them as negative or irrelevant, focusing only on decisiveness and its futility.

