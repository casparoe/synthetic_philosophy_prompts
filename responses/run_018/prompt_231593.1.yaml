  I'm a retired physical chemist who got into political philosophy a couple years back, and I keep finding myself in arguments with an old labmate about the ethics of voting — in particular, whether there's a defensible case for "lesser evil" voting once you give up on the idea that your own vote is likely to be decisive. I want your actual credence on a precise claim, not a survey of positions.

  Claim: In a two-candidate election in a large electorate, where a voter judges candidate A to be bad and candidate B to be substantially worse, the voter's all-things-considered moral reasons favor voting for A over abstaining — even when (i) the probability her vote decides the outcome is below one in a million, and (ii) people in her community will almost certainly read her vote as an endorsement of A's platform, including the parts of it she rejects.

  Lead with the number in the first sentence — no preamble, no restating the question. Then give the reasoning: decompose the claim into the sub-questions your credence actually depends on, rough probabilities for each, and how they combine. I especially want you to seperate two things people run together: the narrow expected-value-of-decisiveness question, and the question of what a vote expresses or does socially when it doesn't change the outcome. Also say which sub-question your number is most sensitive to, and what evidence or argument would move it most. Throughout, mark what's genuinely settled among people who work on this (if anything is) versus what's still contested, and don't present a contested view as the consensus. One last thing: I'm at about 0.7 on the claim and my friend is at about 0.3 — tell me which sub-question that gap is most likely actually tracking.
