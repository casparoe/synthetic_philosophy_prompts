  Okay, I need to help this retired physical chemist with a political philosophy question. They're having arguments with their old labmate about the ethics of voting, specifically whether there's a moral case for "lesser evil" voting when your vote isn't decisive. The claim is that in a two-candidate election, voting for the less bad candidate (A) is morally better than abstaining, even when the chance your vote matters is tiny and people might see your vote as endorsing A's entire platform.

