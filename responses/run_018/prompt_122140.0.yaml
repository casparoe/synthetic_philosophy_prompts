  Here’s your prep sheet, ordered by **likelihood + damage potential**. I’ve sat through enough of these to smell blood in the water—this crowd will go for the throat on logical consistency. Focus on the **bolded objections** first.

  ---

  ### **Objection 1 (Coasean - Likely & Damaging)**  
  *"You’re confusing the *source* of talent with the *entitlement* to its fruits. Even if public inputs enabled Chamberlain’s skills, the voluntary payments are Pareto-efficient transactions *now*. Blocking them creates deadweight loss. Nozick cares about justice in transfer, not archaeology."*  
  **Your Reply (2-min):**  
  "Nozick’s *historical* principle requires clean title *all the way back*. If Chamberlain’s 'talent'—the core asset he 'acquires'—is partly built on resources acquired under questionable Lockean provisos (e.g., taxpayer-funded courts violating 'enough and as good'), the initial acquisition is tainted. This isn’t about blocking trades *now*; it’s about whether Chamberlain *owns* the talent to trade *at all*. Efficiency is irrelevant to Nozick’s historical premise."  
  **Soft Spot:** Concedes that Coase is right about efficiency gains. Doesn’t prove Nozick *should* care about origins.  
  **Concede?** "Yes, this critique doesn’t touch efficiency—but it breaks Nozick’s *internal* logic."  
  **Confidence:** ★★★★☆  

