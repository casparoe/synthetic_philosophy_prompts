  ### **Objection 8 (Rawlsian - The Hoped Unasked Question)**  
  *"Aren’t you implicitly endorsing a 'beneficiary pays' principle? That’s a patterned distributive norm—Rawls with extra steps."*  
  **Your Reply (2-min):**  
  "No. 'Beneficiary pays' assumes society *deserves* compensation. I’m saying: if public inputs *themselves* derive from violations of Nozick’s proviso, then using them to generate profits *replicates* injustice. This isn’t about desert; it’s about *contamination of title*. Rawls wants a pattern; I’m showing Nozick can’t escape history."  
  **Soft Spot:** Still feels distributive. Requires accepting "contamination" as a Nozickian category.  
  **Concede?** "Zero concession. This is Nozick’s own framework turned against him."  
  **Confidence:** ★★★★☆  

