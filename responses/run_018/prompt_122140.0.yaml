  ### **Objection 6 (Libertarian Historian - Less Likely but Damaging)**  
  *"Nozick’s Chamberlain example is about *transfers*, not acquisition. He assumes talent is justly held to show voluntary transfers create inequality. You’re changing the subject."*  
  **Your Reply (2-min):**  
  "The example *depends* on talent being justly acquired. If Chamberlain’s skill is partly an *appropiation* of publicly held resources (e.g., taxpayer-funded coaching), then the 'voluntary' payments aren’t just transfers—they’re *continuing* the initial injustice. Nozick ignores this because he assumes talents are 'self-owned' without examining their origins."  
  **Soft Spot:** Nozick *does* treat talents as given. Requires redefining "appropriation."  
