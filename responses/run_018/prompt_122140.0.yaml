  ### **Summary Strategy**  
  - **Pivot hard to Nozick’s Lockean proviso** when pressured about "smuggling." It’s your lifeline.  
  - **Let Coaseans have efficiency**—your goal is to break Nozick, not defend intervention.  
  - **Flatter the historian** ("As you know, on p. 178...") to preempt textual objections.  
  - **Weakest Point:** Proving that *social inputs = Lockean injustice*. Prepare 1-2 historical examples (e.g., eminent domain abuses funding urban courts).  

