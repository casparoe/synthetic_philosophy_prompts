  ### **Objection 7 (Coasean - Likely)**  
  *"This is a non-operational critique. How do we quantify 'public contribution' to talent? Without that, your theory can’t generate rules—just ad hoc moralizing."*  
  **Your Reply (2-min):**  
  "I don’t need quantification to break Nozick’s logic. If *any* essential input relies on unjust acquisition (e.g., a city court built on land seized without compensation), the entitlement chain is broken. This is about *qualitative* logical failure, not constructing an alternative. Nozick’s theory can’t handle its own historical rigor."  
  **Soft Spot:** Practical Coaseans will dismiss this as "unworkable."  
