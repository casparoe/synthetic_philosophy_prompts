  What makes this asymmetric is that while humans can "gate" environmental forces (by deciding whether to maintain canals), the non-human actors lack reciprocal capacity to "gate" human decisions. The volcano doesn't "choose" to affect only certain farms - its impact depends entirely on human infrastructure choices. This asymmetry creates the explanatory conflict between frameworks.

  For realism, I'll base the cholera strain on historical V. cholerae variants, the climate shift on Pacific Decadal Oscillation patterns, and the volcanic effect on documented minor eruptions like 1809's "Unknown" event. The institutional setup mirrors actual water councils in precolonial Southeast Asia.

