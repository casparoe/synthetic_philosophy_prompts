prompt: |-
  hey, you're like a professional philosopher who specializes in kant and ethics, please think step by step and maybe do some quick brainstorming before you answer. so i just got done arguing with my friend for like two hours about kant's universalizability test and i noticed this pattern that i dont have a word for. people want to justify some action, so they state their maxim, but then they can always tweak how specific or general the description is. like, one version is everyone should break promises whenever they feel like it which obviously collapses if universalized, but another version is i should break this particular promise on thursday because im in a unique emergency and nobody else will ever be in this exact spot which somehow doesnt hit a contradiction. then if they want the opposite conclusion they just flip the granularity the other way. so the moral result seems to come from how finely you chop up the situation, not from the action itself. is there an established name for this sliding-scale problem? i know its related to how you formulate maxims but im specifically asking about the pattern where the level of detail decides whether you get a contradiction. how is it different from just being sneaky about your intentions? and if theres no standard term, can you coin one with clear boundaries and say where it stops being this thing and starts being ordinary equivocation? please dont just list books or cite pages, i cant search anything up right now and i need the reasoning laid out.
reasoning: |-
  Okay, the user is describing a problem they noticed while arguing about Kant's universalizability test. They noticed that people can manipulate the outcome of the test by adjusting how specifically or generally they frame their maxim. For example, framing it as breaking promises whenever one feels like it leads to a contradiction when universalized, but framing it as breaking a specific promise in a unique situation doesn't. The user wants to know if there's a term for this problem, how it differs from being sneaky about intentions, and if not, they'd like a coined term with clear boundaries.

  First, I need to recall Kant's universalizability test. The test involves formulating a maxim, imagining it as a universal law, and checking for contradictions. The issue here is that the level of detail in the maxim affects whether a contradiction arises. This is a known critique of Kant's ethics. 

  The user mentions that the moral result seems to depend on how finely the situation is described, not the action itself. That's a key point. The problem is that the formulation of the maxim is subjective. The agent can describe the action in a way that avoids contradiction. So what's this called? I remember terms like "the problem of maxim description" or "maxim formulation problem." Some scholars refer to it as the "specification problem." There's also "the problem of relevant descriptions." 

  Now, the user asks how this differs from being sneaky about intentions. Sneakiness implies dishonesty in stating intentions, but here the issue is the level of detail in describing the situation. For example, including specific details like "on a Thursday" or "in an emergency" can make the maxim too specific to universalize meaningfully. Whereas being sneaky might involve hiding the true intention behind the action. The distinction is between how the situation is framed versus misrepresenting one's motives.

  If there's no standard term, the user wants a coined term. "Descriptive Granularity Maneuver" comes to mind because it captures the adjustment of detail level. "Granularity" refers to the fineness of detail, and "maneuver" implies strategic adjustment. To differentiate it from ordinary equivocation: equivocation is ambiguity in language, like using a word with multiple meanings. Here, it's about the scope of the maxim's description. The boundaries would be when the maxim's specificity is manipulated to avoid contradiction, versus when someone is just being ambiguous with words.

  Also, the user might be looking for a way to counter this in debates. They probably want to understand the underlying issue to better articulate the flaw in Kant's test. Their deeper need could be to validate their observation during the argument and have a structured response for future discussions. They might also be interested in how ethicists address this problem beyond just naming it.
answer: |-
  You've hit on one of the most persistent and debated problems in Kantian ethics – the **maxim formulation problem**, specifically the **dependency of the universalizability test on the level of specificity/generality in describing the action and its circumstances**. There isn't one universally agreed-upon term, but the phenomenon is well-recognized. Here's a breakdown with a coined term, clear boundaries, and differentiation from sneakiness:

  1.  **The Core Problem You're Describing:**
      *   **The Pattern:** The moral permissibility of an action under Kant's test *appears* to depend entirely on how abstractly or concretely the agent chooses to describe their "maxim" (the subjective principle of their action). By adjusting the granularity, you can manipulate the outcome of the universalization test.
      *   **Your Examples are Spot On:**
          *   **Too General:** "I will break promises whenever I feel like it." Universalized → Promise-making becomes impossible (contradiction in conception). **Result:** Impermissible.
          *   **Too Specific:** "I, [Your Name], will break my promise to [Friend's Name] to return their [Specific Item] at 3:15 PM on [Date] in [Location] because a unique once-in-a-lifetime emergency [Specific Details] arose." Universalized → No contradiction, because this exact confluence of factors will likely never happen again. **Result:** *Seemingly* Permissible.
      *   **The Issue:** This makes the test seem arbitrary. Morality shouldn't hinge on rhetorical framing or finding the "magic level of detail" to justify a desired outcome.

  2.  **Established Labels (The "Family" of Terms):**
      *   **The Problem of Maxim Formulation/Description:** The broadest category. This encompasses *all* issues related to how we articulate the maxim, including the specificity problem.
      *   **The Specification Problem / The Generality Problem:** This specifically targets the issue of *how specific* the maxim needs to be. What details are morally relevant? Who decides?
      *   **The Problem of Relevant Descriptions:** Closely related. Which features of the situation *must* be included in the maxim for the test to be morally informative? (Kant assumed agents would formulate maxims rationally and in good faith, capturing the *morally salient* features).

  3.  **Coined Term: The Descriptive Granularity Maneuver (DGM)**
      *   **Definition:** The intentional or unintentional act of adjusting the level of specificity (granularity) in the description of one's maxim and its circumstances *for the purpose of achieving a desired outcome* (permissibility/impermissibility) in the Universalizability Test, where the core nature of the action remains constant.
      *   **Clear Boundaries - When is it *not* DGM?**
          *   **Ordinary Equivocation:** Using ambiguous *language* within a maxim stated at a *fixed* level of granularity. (e.g., "I will use 'help' when I mean 'steal'"). DGM changes the *scope* of description, not the meaning of specific words.
          *   **Genuine Uncertainty about Relevance:** Struggling to figure out *which* details are morally pertinent isn't DGM; it's part of the difficulty of applying the test honestly.
          *   **Legitimate Distinctions:** Including details that genuinely change the *moral character* of the action compared to a more general case. (e.g., Distinguishing breaking a promise *to save a life* from breaking a promise *for convenience* might be legitimate if the emergency detail is morally transformative. DGM occurs when the added detail *doesn't* change the core moral character but is used purely to evade contradiction).
          *   **Bad Faith Maxims:** Formulating a maxim that blatantly misrepresents the *intention* ("I will 'borrow indefinitely' instead of 'steal'") is sneakiness about intentions, not granularity adjustment.
      *   **Where DGM Starts:** When the agent adjusts the specificity *specifically because* they recognize that one level yields the "wrong" (undesired) result under the test, and another level yields the "right" (desired) result, *without* the change in specificity reflecting a genuine, morally relevant difference in the action itself.

  4.  **How it Differs from Just Being Sneaky About Intentions:**
      *   **Sneakiness About Intentions:** Involves *misrepresenting the agent's actual motivating reason or goal*. (e.g., Claiming your maxim is "to help my friend" when you really intend "to gain their trust so I can later exploit them"). This is lying about *why* you're doing it.
      *   **Descriptive Granularity Maneuver (DGM):** Involves *manipulating the description of the action and its context* while the *underlying intention* might remain constant. You *might* genuinely intend to break this specific promise for this specific reason; the "sneakiness" is in how broadly or narrowly you *frame that intention and circumstance* for the test. It's exploiting the test's *structural sensitivity* to description, not necessarily lying about your motive. DGM focuses on *what* is being done and *under what exact conditions* it's described as being done.

  5.  **Why It's a Problem & Kantian Responses (Briefly):**
      *   **The Threat:** It makes the Categorical Imperative seem subjective and arbitrary. Morality becomes a game of finding the "right wording."
      *   **Kantian Defense Attempts (often debated):**
          *   **Good Faith Requirement:** Kant assumed rational agents acting in good faith would formulate maxims capturing the *rationally and morally relevant* features, avoiding frivolous specificity or misleading generality. DGM is seen as a *misuse* of the test, not a flaw *in principle*.
          *   **Typification:** The maxim should describe a *type* of action in a *type* of circumstance, not a unique historical event. "Breaking a promise *in a genuine, overriding emergency*" might be a permissible *type*, whereas "breaking a promise *whenever convenient*" is not. The challenge is defining "genuine, overriding emergency" without circularity.
          *   **Focus on Underlying Principle:** The test is meant to reveal contradictions in the underlying *principle* of the will. Overly specific maxims often fail to capture a genuine *principle* one could rationally will as universal law; they are just descriptions of singular events.

  **In Summary:** You've perfectly described the **Descriptive Granularity Maneuver (DGM)** – manipulating the level of detail in the maxim's description to control the outcome of the Universalizability Test. It's distinct from equivocation (wordplay) and sneakiness about intentions (lying about motives). It stops being DGM and becomes either legitimate moral reasoning or ordinary equivocation/sneakiness when the change in specificity reflects a *genuine* morally relevant distinction in the action itself, or when the manipulation shifts to misrepresenting words or motives rather than the scope of the action's description. This problem highlights the crucial, often difficult, step in Kantian ethics: formulating the maxim *correctly* to capture the true moral character of the action.
