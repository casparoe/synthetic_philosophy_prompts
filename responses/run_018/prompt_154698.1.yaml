prompt: |-
  ok so me and my roommate had this huge fight last night after we finished that indie rpg where you can permanently wipe a companions save file to unlock the true ending. he says its just code so who cares, but i kept thinking about how the game spent 30 hours making me treat her choices as genuinely autonomus. now im a narrative ethics reviewer at a tiny studio and i actually need a reusable procedure i can run in like 20 mins on proposed character arcs that involve irreversible harm, deletion, or forced betrayal. i want to base it on the idea that fictional characters gain moral weight not through suffering but through what im calling recursive identification residue — basically the structural invitation for the player to treat the characters agency as non-scripted and self-directed, accumulated over playtime. write me a word-flowchart: the ordered questions, what counts as enough answer for each, where it halts with a no, where it kicks the decision to human values instead of facts, and where it will definately misfire. apply it to three proposals: (1) an optional quest where you can erase a companions memory so they never leave the party, (2) a mandatory story death framed as the characters own noble sacrifice but the player cant stop it, and (3) a roguelike where every run spawns a unique family of NPCs with custom dialogue that gets permanently deleted on permadeath. include one where the procedure gives an answer id hate, and say what it cant do. keep it practical — my lead designer has to sign off and she doesnt read philosophy, and i do maybe four of these a week with no research budget.
reasoning: |-
  Okay, the user is a narrative ethics reviewer at a small game studio who needs a practical, reusable procedure for evaluating character arcs involving irreversible harm, deletion, or forced betrayal. They want it based on "recursive identification residue" - the idea that players start treating characters as having agency due to game structure. 

  Hmm, this is fascinating but tricky. The user clearly has deep ethical concerns from that RPG experience with their roommate, and now needs to operationalize abstract philosophy into a 20-min checklist for busy developers. Their lead designer isn't into theory, so this must be concrete. 

  Key challenges I see: Making "recursive identification" measurable without psych research, handling mandatory vs optional content differently, and accounting for procedural generation (like that roguelike example). Also, they need to flag when the tool can't decide - that's crucial.

  For the flow: Start with simplest filters first to save time. Duration of exposure before harm comes first because it's objective. Then player input into character behavior - that's the core of their residue theory. Forced betrayal needs special handling since it violates player agency directly. 

  The three test cases help validate: 
  - Memory wipe quest should fail early (optional but high residue)
  - Noble death might pass if player has meaningful interactions first
  - Roguelike families are interesting - low individual residue but mass deletion could trigger discomfort

  Biggest risk is the "answer you'll hate" scenario - probably the noble death passing despite emotional impact. Have to explicitly call out the tool's limits: Can't measure emotional payoff vs harm, or cultural sensitivities. 

  Gotta keep wording action-oriented: "Does X exist?" not "Consider if X..." Designers need binary outcomes where possible. And always remind them to sleep on borderline cases - that covers the values judgment part.
answer: |-
  Here's a reusable 20-min procedure ("RIR Ethics Flowchart") based on Recursive Identification Residue (RIR), designed for practicality:

  **RIR Ethics Flowchart: Ordered Questions & Thresholds**

  1.  **Is the harm irreversible?** (Deletion, permanent stat loss, unchangeable betrayal, death)
      *   *No?* → **Pass.** (Reversible harm has lower ethical weight here).
      *   *Yes?* → Proceed to Q2.

  2.  **Does the player have meaningful prior exposure to the character?** (Established RIR)
      *   *Threshold:* >15 minutes of *player-driven interaction* (dialogue choices, quests completed *with* them, direct commands, observing unique reactions to player actions). Cutscenes alone count for <50%.
      *   *No (<15min meaningful interaction)?* → **Pass.** (Low RIR accumulation).
      *   *Yes?* → Proceed to Q3.

  3.  **Does the game structurally invite treating the character as autonomous?** (Core RIR generation)
      *   *Evidence:* Meaningful dialogue choices *with* them (not just *about* them), observable reactions to player actions/world state changes, unique mechanics tied to their "personality," persistent relationship tracking, ability to refuse player requests logically.
      *   *No (Purely decorative/quest-giver)?* → **Pass.** (Low RIR potential).
      *   *Yes?* → Proceed to Q4.

  4.  **Is the harm forced (mandatory) AND betray the established relationship/player agency?**
      *   *"Betrayal" defined:* Violates core promises of the relationship (e.g., forcing you to kill a trusted ally *you* built rapport with, overriding player choice to save them).
      *   *No (Optional harm OR non-betrayal mandatory event)?* → Proceed to Q5.
      *   *Yes (Forced Betrayal)?* → **HALT: High Risk.** Requires explicit justification & human review (Q6).

  5.  **Is the harm optional?**
      *   *Yes?* → **HALT: Review Context.** Proceed to Q6.
      *   *No (Mandatory, non-betrayal)?* → Proceed to Q6.

  6.  **Human Values Review:** (Kicked here from Q4, Q5, or if Q1-3 lead to Pass but gut says "pause")
      *   *Questions:*
          *   What's the *narrative payoff* for the harm? Is it profound & earned?
          *   Does the harm feel *exploitative* of the RIR built, or a genuine consequence?
          *   Is there thematic resonance justifying the weight? (Sacrifice for greater good?)
          *   Could a less harmful alternative achieve similar impact?
          *   **Mandatory:** Does the player have *meaningful influence* leading up to the event (even if not preventing it)? (Choice of dialogue, preparation, alternative paths unlocked by relationship?).
      *   *Decision:* **Pass, Revise, or Reject.** Based on studio values, target audience sensitivity, and narrative merit. **Sleep on it overnight if borderline.**

  **Definite Misfires:**
  *   **Low Duration, High Agency:** Character met briefly (<15min) but has incredibly deep simulated autonomy (rare). Tool may underestimate RIR.
  *   **Satire/Genre Conventions:** Parody games or established tropes (e.g., dark comedy permadeath) might flag harm but be contextually appropriate.
  *   **Player-Induced Harm vs. Narrative Harm:** Tool focuses on *narrative/designer-imposed* harm. Player choosing evil options isn't the same.

  ---

  **Application to Proposals:**

  1.  **Optional Memory Wipe:** (Prevent companion leaving)
      *   Q1: Yes (Irreversible mental change).
      *   Q2: Almost certainly YES (>30hrs exposure).
      *   Q3: YES (Core companion, autonomy invited).
      *   Q4: NO (Optional, not forced betrayal *by the game* - though the *act* is betrayal).
      *   Q5: YES (Optional).
      *   → **HALT: Review Context (Q6).**
      *   *Q6 Analysis:* High RIR exploitation risk. Payoff is player selfishness? Feels exploitative unless framed as profound tragedy/corruption. **Likely REJECT or demand significant revision** (e.g., extreme consequences for player, unambiguous tragic framing).

  2.  **Mandatory Noble Sacrifice:**
      *   Q1: Yes (Death).
      *   Q2: Likely YES (Significant companion).
      *   Q3: Likely YES.
      *   Q4: **YES** (Forced - player *can't stop it*. Betrayal *if* relationship promised player agency in protecting allies).
      *   → **HALT: High Risk (Q6).**
      *   *Q6 Analysis:* Critical: Does the player have *meaningful influence* beforehand? (Final dialogue choices expressing care/regret? Choosing *who* sacrifices? Impactful actions leading to the situation?) If YES, and payoff is strong/earned, **Pass with caution**. If NO (pure railroaded death), **Reject/Revise** to add player influence. Tool flags the core risk.

  3.  **Roguelike Permadeath Families:**
      *   Q1: Yes (Permanent deletion).
      *   Q2: **NO** (Per unique family - exposure per run is likely <15min meaningful interaction. They're disposable by roguelike design).
      *   → **Pass.**
      *   *Why it Passes:* Low RIR per individual instance due to short exposure time and procedural generation limiting deep autonomy simulation per run. The *systemic* weight is a different concern (tool doesn't handle mass low-RIR harm well - see misfires). This might be **an answer you hate** if the families feel poignant, but the tool focuses on per-character RIR accumulation time.

  ---

  **What the Procedure CAN'T Do:**

  1.  **Measure Emotional Payoff vs. Harm:** It flags risk, not whether the emotional gut-punch is *worth* it artistically.
  2.  **Account for Cultural Sensitivities:** Specific triggers or taboos require separate consideration.
  3.  **Evaluate "Fun" or Gameplay Impact:** Does permadeath enhance tension? Not this tool's job.
  4.  **Handle Systemic Harm Perfectly:** Mass deletion of low-RIR entities might *feel* ethically weighty even if each passes (Roguelike example).
  5.  **Replace Playtesting:** Player reactions are the ultimate test, especially for Q6 judgments.
  6.  **Define "Profound" or "Earned":** These are human judgment calls in Q6.

  **Practical Execution:**

  1.  **Prep:** Read arc description. Note key characters involved in harm.
  2.  **Run Flowchart (5-10 min):** Answer Q1-Q5 factually based on design doc/meeting notes. Be strict on thresholds.
  3.  **Human Review (5-10 min):** For anything hitting "HALT," quickly answer Q6 questions. Use simple ratings (Low/Med/High Risk).
  4.  **Output:** "Pass," "Pass with Notes (Q6 concerns)," "Revise Needed (Specify Q# failure)," "Reject (High Risk Q4/Q6)."
  5.  **Document:** Brief rationale referencing flowchart steps. "Rejected: Q4 - Forced Betrayal + Q6 - No player influence in sacrifice."

  This gives your lead designer clear, binary flags ("Forced Betrayal + High RIR = High Risk") and pushes nuanced decisions to the review step (Q6), where narrative justification and studio values take over. It leverages your core RIR concept pragmatically.
