  hey, quick one for a scene im writing—my protag is a philosophy grad student who drinks too much coffee and thinks shes solved material constitution. she lays out this chain and then panics because it proves statues cant exist OR that there are like fifty statues made of the same clay. her argument: (1) if two objects share every material part at every moment they both exist, they are identical. (2) statue S and clay lump L share every part at every moment. (3) so S is identical to L. (4) but L can survive being squashed into a vase and S cant. (5) therefore S has a modal property L lacks, violating Leibniz law. (6) so (1) must be false. (7) but if (1) is false, then S and L can share all parts yet differ—which also means you could have S and S', two distinct statues made of the exact same clay in the exact same place at the same time. (8) so either statues dont exist, or coincidence is rampant. she thinks this refutes material constitution altogether. i feel like theres a hidden slide between (5) and (7)—maybe about how modal properties attach?—but i cant name it. which premise should she actually reject, and what does rejecting it cost her? she really wants to keep (4) since her whole thing is that artifacts have kind-specific modal profiles. also she thinks rejecting (2) is cheating because of mereological essentialism. can you diagnose the slip and price the alternatives? sorry for the mess, writing this between chapters on my phone.
