  Below is a decision tree designed for your philosophy of physics seminar handout. It starts from the uncontested premise that we lack direct empirical access to Planck-scale physics or other universes, and branches only on questions that meaningfully separate positions on whether frameworks like string theory or eternal inflation can be confirmed without empirical evidence. The tree is built to ensure students can answer each node without knowing which view it leads to. It has nine leaves (terminal positions), which is within your target range of 8–10. 

  The tree first maps the logical space of possible answers to your specified questions, then identifies which combinations are occupied by actual positions (and why empty cells are unoccupied). Each leaf explicitly states:
  - **What it claims about confirmation**: Its stance on non-empirical confirmation.
  - **What it licenses in practice**: Whether it justifies full belief, continued research investment, or merely not ruling the framework out.

  ### Decision Tree Structure
  **Premise (uncontested)**: We have no direct empirical access to Planck-scale physics or other universes.

  1. **Q1: Does confirmation require empirical evidence?**  
     - **Yes** → Go to Leaf 1.  
     - **No** → Proceed to Q2.  

  2. **Q2: Can an argument count as evidence if you cannot specify what would have been the case if the theory were false?**  
     - **No** → Go to Leaf 2.  
     - **Yes** → Proceed to Q3.  

  3. **Q3: Do non-empirical arguments (no alternatives, meta-induction from past theories, unexpected interconnections) carry weight separately or only as a package?**  
     - **Separately** → Proceed to Q6.  
     - **Only as a package** → Proceed to Q6.  

  4. **Q6: Is the multiverse a prediction the theory gets credit for, or a symptom that it predicts too much?**  
     - **Symptom (predicts too much)** → Go to Leaf 3.  
     - **Prediction (deserves credit)** → Proceed to Q4.  

  5. **Q4: Is the anthropic explanation of the cosmological constant a prediction or an accommodation?**  
     - **Prediction** → Proceed to Q5.  
     - **Accommodation** → Proceed to Q5.  

  6. **Q5: Can a framework without a well-defined measure over its outcomes be confirmed by anything?**  
     - **Yes** → Go to corresponding leaf (depends on prior answers).  
     - **No** → Go to corresponding leaf (depends on prior answers).  

  ### Leaves (Terminal Positions)
  Each leaf is labeled for reference (e.g., Leaf 1) and includes:  
  - **Position**: The view on confirmation.  
  - **Practice**: What it licenses (full belief, continued research, or not ruling out).  
  - **Occupancy**: Whether this position is held, and if not, why it is empty.  

  ---

  **Leaf 1: Strict Empiricism**  
  - **Path**: Q1 = Yes  
  - **Position**: Confirmation *must* be empirical; without empirical access, no confirmation is possible.  
  - **Practice**: **Reject the framework** as unscientific or untestable. No research investment except as pure mathematics.  
  - **Occupancy**: Occupied (e.g., by some Popperians or logical empiricists).  

  **Leaf 2: Counterfactual Skepticism**  
  - **Path**: Q1 = No → Q2 = No  
  - **Position**: Non-empirical arguments fail because they lack counterfactual contrast (no ability to say what the world would look like if the theory were false).  
  - **Practice**: **Do not accept confirmation**, but **do not rule out** the framework. Research may continue for auxiliary reasons (e.g., mathematical insights or hope for future empirical access).  
  - **Occupancy**: Occupied (e.g., by some Carnap-inspired formalists).  

  **Leaf 3: Unfalsifiability Critic**  
  - **Path**: Q1 = No → Q2 = Yes → Q6 = Symptom  
  - **Position**: The multiverse is not a prediction but a symptom of an unfalsifiable framework; thus, no confirmation is possible.  
  - **Practice**: **Reject the framework** as unscientific. Redirect research effort elsewhere.  
  - **Occupancy**: Occupied (e.g., by critics like Smolin or Dawid's "in-principle unfalsifiability" opponents).  

  **Leaf 4: Robust Non-Empiricism (Separately, Prediction, Measure-Optimistic)**  
  - **Path**: Q1 = No → Q2 = Yes → Q3 = Separately → Q6 = Prediction → Q4 = Prediction → Q5 = Yes  
  - **Position**: Non-empirical arguments work separately; the anthropic explanation is a prediction; and the measure problem is solvable or irrelevant. Full non-empirical confirmation is possible.  
  - **Practice**: **Full belief** justified. Continued research to refine the theory.  
  - **Occupancy**: Occupied (e.g., by some string theory optimists like Greene).  

  **Leaf 5: Research Optimism (Separately, Prediction, Measure-Skeptical)**  
  - **Path**: Q1 = No → Q2 = Yes → Q3 = Separately → Q6 = Prediction → Q4 = Prediction → Q5 = No  
  - **Position**: Non-empirical arguments work separately, and the anthropic explanation is a prediction, but the measure problem blocks confirmation.  
  - **Practice**: **No full belief**, but **continue research** to resolve the measure problem.  
  - **Occupancy**: Occupied (e.g., by researchers who see string theory as promising but incomplete).  

  **Leaf 6: Accommodation Skeptic (Separately, Accommodation, Measure-Skeptical)**  
  - **Path**: Q1 = No → Q2 = Yes → Q3 = Separately → Q6 = Prediction → Q4 = Accommodation → Q5 = No  
  - **Position**: Non-empirical arguments work separately, but the anthropic explanation is an accommodation, and the measure problem blocks confirmation.  
  - **Practice**: **No full belief**; research should focus on solving the measure problem or seeking predictions.  
  - **Occupancy**: Occupied (e.g., by critical supporters like Susskind).  

  **Leaf 7: Package Non-Empiricism (Package, Prediction, Measure-Optimistic)**  
  - **Path**: Q1 = No → Q2 = Yes → Q3 = Only as a package → Q6 = Prediction → Q4 = Prediction → Q5 = Yes  
  - **Position**: Non-empirical arguments work only as a package; the anthropic explanation is a prediction; and the measure problem is solvable. The package confirms the framework.  
  - **Practice**: **Full belief** justified. Continued research to strengthen interconnections.  
  - **Occupancy**: Occupied (e.g., by Dawid's "arguments from explanatory coherence").  

  **Leaf 8: Package Research Program (Package, Prediction, Measure-Skeptical)**  
  - **Path**: Q1 = No → Q2 = Yes → Q3 = Only as a package → Q6 = Prediction → Q4 = Prediction → Q5 = No  
  - **Position**: The non-empirical package is strong and the anthropic explanation is a prediction, but the measure problem blocks confirmation.  
  - **Practice**: **No full belief**, but **continue research** to address the measure issue and unify the package.  
  - **Occupancy**: Occupied (e.g., by eternal-inflation researchers focused on measure formalisms).  

  **Leaf 9: Weak Package (Package, Accommodation, Measure-Skeptical)**  
  - **Path**: Q1 = No → Q2 = Yes → Q3 = Only as a package → Q6 = Prediction → Q4 = Accommodation → Q5 = No  
  - **Position**: The non-empirical package only works holistically, but the anthropic explanation is an accommodation, and the measure problem remains unresolved.  
  - **Practice**: **Do not rule out**, but **minimal research investment**; prioritize theories with better-defined measures.  
  - **Occupancy**: Occupied (e.g., by cautious meta-induction proponents).  

  ---

  ### Empty Cells and Why They Are Unoccupied
  The logical space has two empty cells (combinations of answers not held by any major position). Both are due to being **unattractive** (internally inconsistent or pragmatically incoherent):  
  - **A, Accommodation, Measure-Optimistic (missing from Leaves)**:  
    - *Path*: Q3 = Separately → Q4 = Accommodation → Q5 = Yes.  
    - *Why empty*: Unattractive—claiming full belief based on separate non-empirical arguments, despite the anthropic explanation being an accommodation *and* the measure problem unresolved, is seen as ad hoc or overly permissive. No one defends this, as it invites accusations of "confirmation without content."  
  - **B, Accommodation, Measure-Optimistic (missing from Leaves)**:  
    - *Path*: Q3 = Only as a package → Q4 = Accommodation → Q5 = Yes.  
    - *Why empty*: Unattractive—asserting full belief based on a holistic package, while accepting accommodation and ignoring the measure problem, undermines the package's coherence. It conflates weakness (accommodation) with strength (confirmation), rendering it self-undermining.  

  ---

  ### Indistinguishable Positions in Practice
  The tree **cannot separate** the following pairs in terms of practical licensing (what holders would *do*), despite differences in their justifications. This occurs when positions share the same practical stance but diverge on theoretical grounds:  
  - **Bayesian Non-Empirical Confirmation vs. Plain Research Optimism**:  
    - *Where they overlap*: Leaf 5 (Research Optimism) and Bayesian views ending in Leaf 5/8 would both license **continued research without full belief** (e.g., due to the measure problem).  
    - *Why indistinguishable in practice*: Given a decisive negative result (e.g., inconsistency in the framework), both would respond identically: *neither abandons research*. Bayesians would lower their probability assignment but keep investing (updating priors); research optimists would treat it as a puzzle to solve. Both maintain effort.  
  - **Weak Non-Empiricism (Leaf 9) and Counterfactual Skepticism (Leaf 2)**:  
    - *Where they overlap*: Both license **not ruling out** the framework but avoid full belief.  
    - *Why indistinguishable in practice*: Given a negative result, both would **withhold judgment** but permit niche research.  

  ---

  ### Tree Logic and Design Notes
  - **Branching Order**: Questions are ordered to maximize separation early (e.g., Q1 and Q2 isolate strict empiricists). Q3 and Q6 are placed before Q4/Q5 to handle multiverse-specific issues upfront, avoiding irrelevant branches.  
  - **Student Accessibility**: Nodes are phrased neutrally (e.g., Q2 does not mention "Bayesianism" but focuses on counterfactuals). Students can answer based on general epistemology.  
  - **Practice Emphasis**: Each leaf clarifies actions (belief/research/rejection), revealing that positions like Leaf 5 and Leaf 8 collapse into similar research programs despite different justifications.  
  - **Efficiency**: The tree achieves 9 leaves by merging paths where Q3 (separately/package) does not affect later branches (e.g., Q6 is identical for both). This avoids combinatorial explosion while preserving distinctions.  
  - **Unexplored Combinations**: All empty cells are due to unattractiveness, not mere lack of exploration. Positions like "accommodation + measure-optimistic" are incoherent in principle.  

