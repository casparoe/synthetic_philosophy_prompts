prompt: |-
  So I'm a junior and I'm in this world history elective where my teacher, Ms. Okafor, has this running bit about "non-human historical actors" — like whether diseases or volcanoes or climate shifts should count as characters in history who do things, versus just being the scenery human beings act in front of. She's given us her verdicts on a bunch of cases and I cannot figure out her system. Smallpox during the Spanish conquest of the Americas: actor, she said it "basically fought on Cortés's side." The Black Death in 14th century Europe: actor, because it rewrote the labor market and landlords suddenly had to compete for peasants. Yellow fever in the Haitian Revolution: actor, since it shredded the French expeditionary forces while barely touching the Haitians. But the 1815 Tambora eruption and the Year Without a Summer: not an actor, "background condition." And the Little Ice Age as a whole: also just background. When someone asked why plague counts but Tambora doesn't, she said something like, a germ adapts and responds to what we do, it kind of has interests, whereas a volcano just sits there being weather. But another time she said an actor has to "change who wins," which sounds like a totally different test, and honestly both fit her verdicts so far.

  Next week she's doing the global droughts of the 1870s — El Niño-driven, caused massive famines in India, northern China, and Brazil, killed millions, while industrializing Europe with its railroads and grain imports was barely touched. I have to write a one-pager predicting her verdict and defending it, and I want to actually nail it rather than hedge. So: pick a definite verdict, tell me which rule she's most plausibly running (the "changes who wins" rule, the "only things with interests count" rule, or some third rule you think fits better), and explain why that rule fits ALL her earlier calls and not just the convenient ones. Also tell me which of her old cases is doing the most work in your prediction, and what future case would settle for sure which rule she actually has in her head. Don't just lay out both options and shrug — commit to one and argue for it.
reasoning: |-
  Okay, let me tackle this student's problem. They need to predict whether Ms. Okafor will classify the 1870s global droughts as a "non-human historical actor" or just "background." The teacher has a pattern: smallpox, Black Death, and yellow fever are actors, while Tambora and the Little Ice Age are background. The student mentioned two possible rules: "changes who wins" and "has interests."

  First, I need to analyze her past verdicts. Smallpox helped Cortés conquer, Black Death shifted power to laborers, yellow fever aided Haitian revolutionaries. All these changed who won. Meanwhile, Tambora caused suffering but didn't alter political outcomes—Europe's power structures remained. The Little Ice Age was a slow pressure, not a decisive factor. So the common thread seems to be direct causation in shifting power dynamics, not just creating conditions.

  The "interests" angle is trickier. Germs adapt, which might imply agency, but volcanoes don't. But looking at her examples, the outcomes matter more. Yellow fever didn't "choose" sides but decisively changed who won. The student should commit to the "changes who wins" rule because it consistently explains all cases without exception. 

  For the 1870s droughts: they caused famines but didn't change colonial rulers. British power in India wasn't threatened; they used railroads to export grain. China's Qing Dynasty faced unrest but survived. Brazil's monarchy fell later for unrelated reasons. Since no regime changes resulted directly, this fits "background" like Tambora. The key here is the lack of power shift despite the catastrophe.

  The strongest precedent is Tambora—both are environmental disasters causing suffering without altering who holds power. To test the rule, a future case like antibiotics in WWII would be ideal. If penicillin's impact on troop survival changed war outcomes, it should be an actor, confirming the "changes who wins" rule over the "interests" theory.
answer: |-
  Here's your definitive prediction and reasoning, based on a clear analysis of Ms. Okafor's pattern:

  **Prediction for the 1870s Global Droughts:** **NOT an Actor (Background Condition)**

  **The Rule She's Using:** **The "Changes Who Wins" Rule.** Specifically, a non-human force is an "actor" **only if it decisively shifts the balance of power between identifiable, competing human groups in a specific historical contest, directly altering the outcome (who wins/loses, gains/loses power or dominance).** If it merely creates hardship, changes conditions, or influences long-term trends *without* being the decisive factor in tipping a specific power struggle, it's background.

  ### Why the "Changes Who Wins" Rule Fits ALL Her Verdicts
  1.  **Smallpox (Conquest of Americas): ACTOR.** It *decisively shifted the balance* between the Spanish conquistadors and the Aztec/Inca empires. It actively crippled indigenous armies and leadership *during the immediate conflict*, directly enabling Spanish victory where it was far from certain militarily alone. It "fought on Cortés's side."
  2.  **Black Death (14th C Europe): ACTOR.** It *decisively shifted the balance of power* between landlords and peasants *in the specific contest over labor value and feudal obligations*. By killing so many peasants, it gave the survivors immense leverage ("rewrote the labor market"), forcing landlords to compete and fundamentally weakening the feudal system's core power dynamic. Peasants "won" significant concessions.
  3.  **Yellow Fever (Haitian Revolution): ACTOR.** It *decisively shifted the balance* between the French expeditionary force and the Haitian rebels. It annihilated the French troops *while leaving the Haitian forces largely intact*, directly causing the failure of Napoleon's attempt to re-enslave Haiti. It changed who won the *specific military/political contest*.
  4.  **Tambora Eruption (1815): NOT ACTOR.** While causing immense suffering (Year Without a Summer), it did *not* decisively shift power in any *specific, immediate contest*. No major war was lost because of it, no government fell solely due to its effects (though unrest occurred, established powers like those at the Congress of Vienna weathered it). The suffering was diffuse, not targeted in a way that tipped a power struggle.
  5.  **Little Ice Age: NOT ACTOR.** It's a long-term *contextual pressure*. It influenced migration, agriculture, and social patterns over centuries, but it didn't *directly decide* the winner of a specific war, revolution, or power conflict. It set the stage, but human actors made choices within that stage. No specific "win" or "loss" of power can be pinned *decisively* on it tipping the scales at a critical moment.

  ### Why the "Interests" Rule Fits Less Well
  *   While microbes "adapt," Ms. Okafor's emphasis in her justifications is consistently on the *outcome* (labor market rewritten, French forces shredded, fought for Cortés) rather than the mechanism of adaptation.
  *   Yellow fever didn't "adapt" to target the French specifically; it was endemic and the Haitians had resistance. The key point was its *effect* on the military contest.
  *   The Black Death didn't "adapt" to empower peasants; it killed indiscriminately. The key point was its *effect* on the landlord-peasant power dynamic.
  *   The "interests" angle seems more like a post-hoc *characterization* of the forces that *do* meet the "changes who wins" test, rather than the core defining criterion.

  ### The Case Doing the Most Work: Tambora Eruption
  Tambora is the critical test case. It was a massive, dramatic, single-event disaster causing global upheaval and suffering, much like the epidemics. Yet, Ms. Okafor calls it "background." The *only* consistent distinction is that while it caused hardship, it **did not alter the outcome of a specific, identifiable power struggle.** Napoleon had *already* lost at Waterloo before the worst effects hit Europe. Established regimes endured the unrest it caused. This starkly contrasts with Yellow Fever destroying the French army *in the middle of their campaign* to crush Haiti, or Smallpox crippling the Aztecs *during* Cortés's siege. Tambora shows the rule isn't about scale of suffering or even "responsiveness" in a biological sense; it's about **direct, decisive intervention in a human contest for power.**

  ### The Future Case That Would Settle It: Antibiotics in WWII
  *   **Scenario:** The mass production and deployment of penicillin and other antibiotics during WWII dramatically reduced mortality from battlefield wounds and infections among Allied troops compared to Axis troops (who had less access). This is widely seen as contributing significantly to Allied operational effectiveness and manpower retention.
  *   **Settling the Rule:**
      *   **If ACTOR:** This strongly confirms the "Changes Who Wins" rule. Antibiotics (a non-human entity, albeit human-made) *directly* preserved Allied fighting strength in a way that arguably changed the balance of manpower and morale in specific campaigns (e.g., the Normandy campaign, the Italian campaign), contributing to the ultimate victory. A microbe-fighting tool decisively shifted the balance in the largest conflict in history.
      *   **If BACKGROUND:** This would undermine the "Changes Who Wins" rule and suggest the "Interests" rule (or something else) is primary, as antibiotics are a tool without agency or "interests" in the biological sense Ms. Okafor used for germs. It would show that even something directly altering the military balance in a conflict might not count if it lacks that "responsive" biological element.

  **Conclusion:** Ms. Okafor's core logic is **power shift in a contest.** The 1870s Global Droughts, while horrific, **did not decisively change who won or held power.** Colonial rulers (Britain in India) remained firmly in control, using infrastructure to mitigate impacts *for their interests*, not losing power. The Qing Dynasty in China faced immense pressure and rebellion partly fueled by famine, but it *survived* the immediate 1870s crisis (it fell decades later for complex reasons). Brazil's monarchy faced unrest but didn't fall until 1889. Europe's industrial powers were *strengthened* relative to the affected regions. The droughts created catastrophic *conditions*, but no specific competing human faction (e.g., anti-colonial rebels, challengers to European dominance) *gained power* or *won a critical contest* directly *because* of the droughts tipping the scales. They are a tragic, massive **background condition** shaping the late 19th-century imperial world, not an actor deciding a fight. **Bet on "Background".**
