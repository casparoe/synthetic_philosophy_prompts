prompt: |-
  Assume you are advising a research program officer who can fund exactly six philosophers and formal theorists for three years to work on the conceptual foundations of coherent extrapolated volition (CEV) and related theories of idealized preference aggregation. The team will not run empirical preference-elicitation studies or train AI systems; progress must come entirely from conceptual analysis, normative argument, and formal modeling.

  Your task is not to survey the field but to defend a specific, resource-constrained research agenda. Identify the open conceptual questions that should be tackled first, second, and third, with explicit reasoning about ordering. In particular, center your analysis on a tension that standard treatments leave underdeveloped: whether coherence conditions for an extrapolated volition should be formulated pairwise (between my current and future idealized self), collectively (across all members of a population whose volitions are simultaneously extrapolated), or hierarchically (through representative idealized agents whose outputs are themselves aggregated). For each of your top priorities, explain:

  1. Its upstream status—which downstream conceptual or formal problems remain blocked until it is resolved.
  2. Its tractability for philosophers and logicians working without empirical ML infrastructure.
  3. What specific conceptual result or formal proof within the next two to three years would either elevate it or cause it to be deprioritized.

  Then present your reasoning in a concise essay, and conclude with a structured summary in JSON format containing exactly these fields:

  - "prioritization_criteria": an array of strings, each naming one criterion you applied (e.g., upstream dependency, tractability without empirical ML, impact on collective-decision frameworks) with a one-sentence justification.
  - "ranked_questions": an array of objects, ordered by rank, each with keys "rank" (integer), "question" (string describing the open problem), "upstream_blockage" (string explaining what depends on it), "tractability_assessment" (string), and "revision_trigger" (string describing the result or argument that would change its rank).
  - "deprioritized_areas": an array of objects, each with "area" and "reason" keys, listing questions or approaches you deliberately set aside and why.
  - "resource_allocation": an object with "philosophers" (integer), "formal_theorists" (integer), and "division_rationale" (string), with the two integers summing to six.

  Reach and defend a concrete verdict about the ordering. Do not provide a bibliography, reading list, or citations. Do not invoke specific monographs or articles by title or author unless the attribution is uncontroversial and widely known; otherwise, describe ideas in your own terms. Avoid asking for evidence that requires web access to verify.
