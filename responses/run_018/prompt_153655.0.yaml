  ### Advising on Research Priorities for Coherent Extrapolated Volition

  The core tension in coherent extrapolated volition (CEV)—between pairwise (individual diachronic), collective (multisynchronous), and hierarchical (representative-aggregation) formulations of coherence—remains underdeveloped in standard treatments. This tension obstructs progress in defining a unified framework for idealized preference aggregation. To maximize conceptual clarity within a three-year, non-empirical mandate, I prioritize three questions ordered by their upstream impact on this tension, tractability for philosophical and formal methods, and potential for decisive resolution. The agenda deliberately sets aside areas requiring empirical data or computational infrastructure, focusing instead on foundational barriers.

  **First Priority: Clarifying the Unit of Idealization**  
  *Question: Should the idealization process operate on pairwise (single-agent diachronic), collective (multi-agent synchronic), or hierarchical units as the primary basis for coherence?*  
  This is the most upstream question, as it determines the structure of all subsequent idealization and aggregation. Downstream work on coherence conditions, aggregation rules, and dynamic consistency remains blocked until resolved—e.g., a pairwise unit predefines aggregation as a separate step, while a collective unit merges idealization and aggregation. The question is highly tractable: philosophers can analyze normative intuitions about agency, while formal theorists model units using modal logic or game-theoretic representations. A revision trigger would be a formal proof within three years that pairwise units unavoidably violate minimal rationality under aggregation (e.g., an "idealized self" Arrow paradox), which would elevate collective or hierarchical units. Conversely, a proof that collective units imply circular group agency definitions would deprioritize them, favoring pairwise foundations.

  **Second Priority: Defining Unit-Specific Coherence Conditions**  
  *Question: What minimal coherence conditions (e.g., consistency, stability, or no-regret) apply to the chosen unit of idealization?*  
  This depends on the first priority: without a defined unit, coherence conditions cannot be specified. Downstream, formalizing the extrapolation operator (e.g., a function mapping current to idealized preferences) and evaluating convergence properties are blocked. Tractability is strong, as philosophers can normatively debate conditions (e.g., whether collective coherence requires Pareto optimality), and logicians can axiomatize them using fixed-point theorems or graph theory for preference relations. A revision trigger would be a result showing that standard conditions (e.g., transitivity) lead to trivial volitions (e.g., all agents converge to identical preferences) under any unit. This would deprioritize the question by revealing deeper flaws in the idealization framework, necessitating a return to the first priority.

  **Third Priority: Resolving Aggregation Under Dynamic or Multi-Unit Constraints**  
  *Question: How can aggregation (across time, agents, or hierarchical levels) preserve coherence when units conflict, especially if pairwise or hierarchical units are chosen?*  
  This is downstream of the first two priorities: aggregation mechanisms depend on the unit and its coherence rules. For example, pairwise units require aggregating diachronic selves, while hierarchical units need meta-aggregation of representatives. Downstream applications to value learning or policy optimization remain blocked until aggregation avoids incoherence (e.g., cycles or manipulability). Tractability is moderate: formal theorists can adapt social-choice impossibility theorems, while philosophers critique delegation norms in hierarchical models. A revision trigger would be a constructive proof of a hierarchy-invariant aggregation rule (e.g., showing ranked delegation avoids cycles), which would deprioritize aggregation as a lower barrier. Conversely, an impossibility theorem for dynamic aggregation would elevate this question, demanding hierarchical alternatives.

  **Deprioritized Areas and Resource Allocation**  
  Empirical preference elicitation and computational learning are excluded as they require infrastructure beyond the mandate. Normative theories of "full" idealization (e.g., infinite reflection) are deprioritized as intractable without empirical anchors. I allocate three philosophers and three formal theorists: philosophers lead on unit ontology and coherence norms, while formal theorists handle modeling and impossibility proofs. This balance ensures conceptual rigor and technical precision across all priorities.

