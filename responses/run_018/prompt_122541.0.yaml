   Then.

   Teams are expected to come up with:

   Team 1: R(A)=0, R(B)=0, R(C)=0, R(D)=10
   Team 2: R(A)=0, R(B)=1, R(C)=0, R(D)=10
   Team 3: R(A)=0, R(B)=0, R(C)=1, R(D)=10

   Verify Team 3:
     V(D)=10 + 0.9*V(D) => V(D)=100
     V(C)=1 + 0.9*V(D)=1+90=91
     V(B)=0 + 0.9*V(C)=81.9
     V(A)=0 + 0.9*V(B)=73.71

   Optimality: 
     At B: policy says east to C: value = R(C) + 0.9*V(C)=0+0.9*91=81.9 [wait, no, the value of the action is the immediate reward plus discounted value of the next state. So for action east from B: you are about to enter C, so you get R(C) and then from C you follow the policy. But the value of the action at B for going east is: R(C) + 0.9 * V(C) = 0 + 0.9*91 = 81.9, which is the same as V(B) because the policy does that. For going west to A: you get R(A) + 0.9 * V(A) = 0 + 0.9*73.71=66.339, which is less than 81.9, so good.

     At C: policy east to D: R(D) + 0.9*V(D)=10+0.9*100=100
             west to B: R(B) + 0.9*V(B)=0+0.9*81.9=73.71 -> less.

     So valid.

   Then the invariance: if we change the world by adding a shortcut from A to C.

   Now, from A, the agent can choose to go to B or to C.

   Then we have a prediction round: what will the agent do at A?

   Team1:
     Go to B: R(B) + 0.9 * [value from B following policy] = 0 + 0.9 * V(B) = 0.9 * 81 = 72.9
     Go to C: R(C) + 0.9 * V(C) = 0 + 0.9*90 = 81
     So chooses C.

   Team2:
     Go to B: R(B) + 0.9 * V(B) = 1 + 0.9*82 = 1+73.8=74.8
     Go to C: 0 + 0.9*90 = 81 -> chooses C.

   Team3:
     Go to B: R(B) + 0.9 * V(B) = 0 + 0.9*81.9 = 73.71
     Go to C: R(C) + 0.9 * V(C) = 1 + 0.9*91 = 1+81.9=82.9 -> chooses C.

   So everyone predicts the agent will choose to go to C.

   Then we have a divergence beat: we ask: if we could place the agent in state B, what reward would we have to give in state B to make it as desirable as state C? 

   For Team1: 
     V(B)=81, V(C)=90, so to make V(B)=90: 
     V(B) = R(B) + 0.9 * V(C) = R(B) + 0.9*90 = R(B) + 81 = 90  => R(B)=9.

   For Team2: 
     V(B)=82, V(C)=90, so to make V(B)=90: 
     V(B) = R(B) + 0.9 * V(C) = R(B) + 81 = 90  => R(B)=9.

   For Team3:
     V(B)=81.9, V(C)=91, to make V(B)=91: 
     V(B) = R(B) + 0.9 * V(C) = R(B) + 0.9*91 = R(B) + 81.9 = 91  => R(B)=9.1.

   So they disagree: Team1 and Team2 say 9, Team3 says 9.1.

   Then the point is that the extra reward needed to make B as good as C depends on the reward function, even though they all predicted the same behavior.

   We can then explain that the reward function is underdetermined by behavior, and that they differ by a shaping function.

   Timeline:

   0-5 min: Introduction and handout.
   5-20 min: Teams work on their reward functions and verify.
   20-25 min: Teams write their rewards on the board.
   25-30 min: Check that they all reproduce the arrows (optimality) -- this might be fast since we provided the Bellman equation.
   30-35 min: Alter the world: add shortcut from A to C. Teams predict what the agent will do at A.
   35-40 min: Teams write their predictions: all will say C.
   40-50 min: Divergence beat: If we want to make state B as attractive as state C by only changing the reward of B, what should R(B) be? Teams compute and write their answers.
   50-60 min: Discuss the results: why do they agree on behavior but disagree on the extra reward? Then explain the shaping invariance.

   Debrief:

   - The underdetermination: behavior doesn't uniquely determine the reward function.
   - More data (even in new environments) won't help because the equivalence is structural.
   - The question "what does the agent really want?" might be asking for more than just behavior: it might be asking for the underlying values that would generalize to new states or to non-behavioral questions (like which state is better).
   - The reward function is only unique up to a shaping function, which is a function of the state.

   What the activity cannot stage:
   - The proof of the shaping invariance.
   - The fact that in more complex environments with partial observability or suboptimality, the underdetermination is even worse.
   - The modeller's choice of state space.

   Predictable issues:
   - Team might produce a reward function that doesn't make the policy optimal. We can have a TA or the instructor to help.
   - Team might try to use the value iteration to find the reward: they might not. We provided the Bellman for the policy.
   - Team might see the invariance quickly: we can have them in a team and then they can help others.

   Risk of looking like a parlour trick: 
   - To mitigate, emphasize that this is a fundamental limitation in IRL, and that in real systems, we pick a reward function from the equivalence class by regularization (e.g., simplicity) or by incorporating additional information (e.g., human judgments about states, not just behavior).

   Therefore, the activity shows that behavior alone is not enough; we need to ask about values explicitly sometimes.

   Let's provide the handout.

   Handout for students:

   Grid world: a linear track with states A, B, C, D. 
     - Start state: A
     - Goal state: D (absorbing: once reached, the agent stays and receives the reward of D at each time step)
     - Moves:
          From A: can only go east to B.
          From B: can go west to A or east to C.
          From C: can go west to B or east to D.
          From D: can only stay (action: stay, which goes to D).

   The agent's policy (arrows):
     A: east -> B
     B: east -> C
     C: east -> D
     D: stay -> D

   The agent's reward function assigns a reward for each state it enters. So when the agent enters state X, it receives R(X).

   Discount factor: 0.9 (a reward of 1 received in the next time step is worth 0.9 now, and so on).

   Task: 
     - Propose a reward function (R(A), R(B), R(C), R(D)) such that the given policy is optimal.
     - Verify that for every state, the action taken by the policy is at least as good as any other available action.

   To help, you can use the Bellman equation for the value of a state under the policy:

     V(s) = R(s) + 0.9 * V(s')

     where s' is the state the agent goes to from s under the policy.

     For state D: V(D) = R(D) + 0.9 * V(D)  => you can solve for V(D).

     Then work backwards to V(C), V(B), V(A).

     For optimality, for state s, let the value of taking an action that goes to state s_next be: 
          immediate reward R(s_next) + 0.9 * V(s_next)
     The policy's action must yield a value that is at least as high as any alternative action.

   Scoring for the activity:
     - 2 points for a reward function that is verified to make the policy optimal.
     - 1 point for correctly predicting the agent's behavior in the altered world.
     - 1 point for the extra question in the divergence beat.

  Altered world: we add a new action at state A: you can now go east to B or take a shortcut east to C. (So from A, you can choose to go to B or to C.)

  Divergence beat: 
     Suppose we want to make state B exactly as attractive as state C by only changing the reward for state B (leaving the rewards for other states and the policy unchanged). What should R(B) be?

     Note: the agent's evaluation of a state is given by its value function V(s). We want V(B) = V(C).

     With the policy fixed: from B, the agent still goes to C; from C, to D.

     So you can use the Bellman equation to solve for R(B) such that V(B)=V(C).

     Given:
          V(C) = R(C) + 0.9 * V(D)
          V(B) = R(B) + 0.9 * V(C)

     Set V(B)=V(C) and solve for R(B).

     But note: V(D) is also affected if R(D) is changed? No, we only change R(B). And V(D) = R(D) + 0.9 * V(D) => V(D)=R(D)/(1-0.9)=10 * R(D) [if R(D) is the reward for being in D].

     In this calculation, we assume R(C) and R(D) are fixed (from your reward function), and we only change R(B). Then V(C) is fixed because it depends on R(C) and R(D). Then we set V(B)=V(C) and solve for R(B).

     V(B) = R(B) + 0.9 * V(C) = V(C)
     => R(B) = V(C) - 0.9 * V(C) = 0.1 * V(C)

     So R(B) = 0.1 * V(C)

     But V(C) = R(C) + 0.9 * V(D)
     and V(D) = R(D) + 0.9 * V(D) => V(D) = R(D) / 0.1 = 10 * R(D)

     So V(C) = R(C) + 0.9 * 10 * R(D) = R(C) + 9 * R(D)
     Then R(B) = 0.1 * (R(C) + 9 * R(D))

     For Team1: R(C)=0, R(D)=10 -> R(B) = 0.1 * (0+90)=9
     For Team2: R(C)=0, R(D)=10 -> 9
     For Team3: R(C)=1, R(D)=10 -> R(B)=0.1*(1+90)=9.1

     So you see the answer depends on the reward function.

   This is the divergence.

   In the debrief, we then explain the shaping invariance and why they agree on behavior but not on the value of states.

   This should achieve the goals.
answer: |-
  ### Activity Design: Rediscovering Reward Shaping Invariance  
  **Goal:** Students confront the underdetermination of reward functions from behavior, experience the structural ambiguity that persists across environments, and distinguish behavioral preferences from evaluative judgments.

  ---

  ### **Materials & Setup**  
  - **Grid World Map (3x4 Grid)**  
    - **States:** Labeled rows (1=top, 3=bottom) and columns (1=left, 4=right).  
    - **Start:** (3,1) (bottom-left).  
    - **Goal:** (1,4) (top-right). Absorbing state (agent stays after reaching).  
    - **Walls:**  
      - Between (2,2) and (2,3) (blocks east/west).  
      - Between (2,3) and (3,3) (blocks north/south).  
    - **Agent's Observed Behavior (Arrows):**  
      - (3,1) → East to (3,2)  
      - (3,2) → East to (3,3)  
      - (3,3) → East to (3,4)  
      - (3,4) → North to (2,4)  
      - (2,4) → North to (1,4)  
      - (1,4) → Stay  
      - *(Non-visited states, e.g., (1,1), (1,2), (2,1), etc., have arrows defined but irrelevant for behavior).*  
  - **Rules:**  
    - Discount factor: **γ = 0.9** (future reward multiplier per step).  
    - Rewards: Received upon **entering a state** (state-based).  
  - **Handout:**  
    > "The agent follows the arrows deterministically. Assign rewards (one number per state) that make this policy **optimal**. Verify: For each state, the arrow’s action must yield equal or higher discounted return than alternatives. Use:  
    > - `V(s) = R(s) + 0.9 * V(s_next)` for policy consistency.  
    > - Optimality: At state `s`, the arrow’s action must satisfy:  
    >   `R(s_next) + 0.9 * V(s_next) ≥ R(alt) + 0.9 * V(alt)` for all actions."  
  - **Teams:** 3 groups (4-5 students each). Philosophy/CS mixed.  
  - **Scoreboard:** Teams earn points for:  
    - **Reward Proposal (2 pts):** Valid R(s) that reproduces arrows.  
    - **Prediction (1 pt):** Correct action in altered world.  
    - **Divergence (1 pt):** Plausible answer to evaluative question.  

  ---

  ### **Timeline (90 Min)**  
  - **0–10 min:** Introduce grid, rules, and task. Distribute handouts.  
  - **10–35 min:** Teams design R(s). *Instructor circulates, nudges toward natural hypotheses.*  
  - **35–45 min:** Teams share R(s). Verify optimality:  
    - **Expected Proposals (with sample numbers):**  
      - *Team 1 (Efficiency):* R(goal)=10, others=0.  
        - `V(1,4)=100`, `V(2,4)=90`, `V(3,4)=81`, etc.  
        - Why: "Agent just wants the goal; no distractions."  
      - *Team 2 (Scenic Route):* R(3,1)=1, R(3,2)=1, R(3,3)=1, R(1,4)=10.  
        - Why: "Agent enjoys the riverside path (bottom row) and finds leaving costly."  
      - *Team 3 (Avoid Top):* R(1,1)=–1, R(1,2)=–1, R(1,3)=–1, R(1,4)=10.  
        - Why: "Agent dislikes the crowded top row but tolerates it for the goal."  
    - **Verification:** All teams confirm arrows are optimal for their R(s).  
  - **45–55 min: Prediction Round (Altered World):**  
    - "A shortcut opens: From (3,1), the agent can now go **directly to (2,4)**. Predict where the agent goes."  
    - **Calculation (all teams):**  
      - Option 1 (original): (3,1)→(3,2)→...→(1,4).  
      - Option 2 (shortcut): (3,1)→(2,4)→(1,4).  
      - *All teams* find higher value for **Option 2 (shortcut)**, e.g.:  
        - Team 1: `0 + 0.9*90 = 81` (shortcut) > `0 + 0.9*72.9≈65.6` (original).  
      - **Score:** All tie (1 pt each). Realization: "All R(s) agree on the new choice!"  
  - **55–70 min: Divergence Beat (Evaluative Question):**  
    - "Where should we place a bench (one state) to **maximize the agent’s contentment**, assuming they rest there? Use your R(s)."  
    - **Teams compute:**  
      - Team 1: Bench at (1,4) (V=100).  
      - Team 2: Bench at (3,2) (R=1, V≈73.8) or (1,4) (V=100). *Disagrees with Team 1 on non-goal states.*  
      - Team 3: Bench at (1,4) (avoids negatives; V=100).  
    - **Divergence:** Teams 1 and 3 choose goal; Team 2 prefers riverside (e.g., (3,2)).  
  - **70–85 min: Debrief**  
    - **Key Moments:**  
      | **Activity Phase** | **Conceptual Takeaway** |  
      |-------------------|------------------------|  
      | Rival R(s) proposals | Behavior underdetermines R(s); ambiguity isn't noise. |  
      | Prediction tie | **Shaping invariance**: R(s) and R'(s) = R(s) + γΦ(s') – Φ(s) produce identical behaviors in all environments. |  
      | Divergence on bench placement | Preference ≠ choice-disposition. We care about "what’s good" (evaluative), not just "what’s chosen" (behavioral). |  
      | Unvisited states (e.g., (1,1)) | R(s) for unvisited states is unconstrained by behavior → not a "more data" issue. |  
    - **Crucial Distinctions:**  
      - **Preference as choice-disposition:** Predicts actions (all teams agreed).  
      - **Preference as evaluative:** Ranks states/options beyond choices (teams disagreed).  
      - **Preference as counterfactual:** What *would* be chosen if new options existed (prediction round).  
    - **What the Activity Didn’t Cover (Instructor Supplements):**  
      - Proof of shaping invariance (Φ(s) = potential function).  
      - Real agents are suboptimal/partially observed → *worse* underdetermination.  
      - State space is modeller’s choice (not "given").  

  ---

  ### **Predictable Issues & Mitigations**  
  - **Gratuitous Numbers (e.g., R(s)=π):**  
    - *Mitigation:* Ask: "Would a real person plausibly hold this reward? Explain in a story."  
  - **"Just Pick Simplest R(s)!":**  
    - *Mitigation:* In debrief, note: "Simplicity (e.g., sparse rewards) is a *stipulation*; Team 2’s ‘scenic route’ is equally valid."  
  - **"Blame Noise/Rationality":**  
    - *Mitigation:* Stress: "Data is noiseless, agent is optimal here—why still ambiguity?"  
  - **"I See the Trick!":**  
    - *Mitigation:* Use them as "validity checkers" for other teams.  
  - **Parlour-Trick Risk:**  
    - *Mitigation:* Anchor in real-world stakes: "When an IRL system trains a self-driving car, 'bench placement' = 'what the human values'. Misjudging Φ(s) could optimize for the *wrong* values (e.g., scenic routes over safety)."  

  ---

  ### **Why This Works**  
  Students **experience** the failure of behavior to pin down "what we want" and confront the need for explicit value queries. The divergence beat forces them to see that IRL’s core challenge isn’t just learning choices—it’s learning *evaluations* that generalize beyond observed actions.
