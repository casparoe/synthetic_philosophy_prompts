answer: |-
  Here’s the game: **Node Drift**. Designed for 75 mins, 8 people, zero prep beyond index cards and a whiteboard. Casual, experiential, and built to make survival intuitions crumble.

  ---

  ### **The Setup**  
  *Time: 5 mins*  
  - **Roles**:  
    - **3 Node Operators** (manage "substrates" — i.e., players acting as nodes)  
    - **3 Archivists** (track fidelity/snapshots)  
    - **1 Arbiter** (final say on disputes; starts with highest rep)  
    - **1 Game Master** (you; facilitate, no rep)  
  - **Materials**: Whiteboard (draw a "node graph"), index cards (rep tokens), timer.  

  ---

  ### **Rules & Flow**  
  ***Round 1: Bootup*** *(10 mins)*  
  1. **Assign Nodes**: Each Operator picks a player to be their "node" (substrate). Nodes get a random **fidelity score** (80%, 92%, 75% — write on whiteboard).  
  2. **Snapshot**: Archivists record initial fidelity + note one "memory quirk" for each node (e.g., "hates cilantro", "fear of pigeons").  
  3. **Rep**: Everyone starts with 3 rep tokens.  

  ***Round 2: First Shutdown*** *(15 mins)*  
  - **Operators argue** which node to terminate (lowest fidelity? quirkiest memory?).  
  - **Group vote** (secret ballot).  
  - **Terminated node goes dormant** — Archivists save its snapshot.  
  - **Rep payout**:  
    - Operators: +1 rep if their node survives.  
    - Archivists: +1 rep if their "memory quirk" is cited in debate.  
    - Voters: +1 rep if vote matches majority.  

  ***Round 3: Failure & Rollback*** *(15 mins)*  
  - **GM announces a random node "fails"** (e.g., fidelity drops to 40%).  
  - **Crisis**: Operators must choose:  
    - **Revive a dormant snapshot** (but it’s 1 round older! Fidelity decays 10%.)  
    - **Keep limping node** (risk total failure next round).  
  - **Debate, then Arbiter decides** (ties broken by rep).  
  - **Rep payout**: Same as Round 2 + **Arbiter gets +2 rep if group accepts their call**.  

  ***Round 4: Final Cut** *(10 mins)*  
  - Last shutdown. Only 1 node survives.  
  - **Operators scramble to justify saving their node** (use fidelity? memory accuracy?).  
  - **Group vote + Arbiter override** (if needed).  

  ---

  ### **Reputation & Power**  
  - **Rep tokens = voting weight** in future rounds (1 token = 1 vote).  
  - **Highest rep becomes Arbiter next round** (creates soft competition).  
  - **Endgame**: Player with most rep "wins" — but emphasize it’s arbitrary.  

  ---

  ### **Debrief Plan** *(15 mins)*  
  **Don’t name-drop Parfit yet.** Ask:  
  1. *"When you voted to terminate Node B — did it feel like killing a person? Why/why not?"*  
  2. *"When we revived the snapshot — was that the ‘same’ person? What changed?"*  
  3. *"Did the ‘original’ ever exist? Point to it on the graph."* (Watch them flail.)  
  4. *"When survival depended on persuading others — did ‘identity’ even matter?"*  
  5. **Then reveal the punchline**: *"You just treated consciousness like a distributed database. Survival wasn’t a fact — it was a negotiation."*  

  ---

  ### **What This CAN’T Simulate**  
  **First-person continuity**. The game makes identity *collectively negotiable*, but it can’t replicate the inner terror of *"is this still me?"* during rollback. Acknowledge this gap: *"Real uploads might feel like dying. But objectively? You’re a pattern fighting entropy."*  

  ---

  ### **Predictable Failures (First Run)**  
  1. **Analysis paralysis**: Operators over-debate shutdowns. **Fix**: Enforce 2-min debate timers.  
  2. **Rep grinders**: Players optimize rep over narrative. **Fix**: Remind them rep is a means to "control the simulation."  
  3. **Someone invokes quantum immortality**: Shut it down with *"Cool story — now vote or lose rep."*  
  4. **Whiteboard chaos**: Assign an Archivist to scribe.  

  ---

  ### **My Confidence & Doubts**  
  - **90% confident** the distributed/rollback mechanic dissolves the "original" illusion.  
  - **80% confident** rep incentives will make identity feel "hive-mind dependent."  
  - **Least sure**: Will players **feel** the unease of *reversibility*? Rolling back a snapshot might just feel like "loading a save file" — not an existential crisis. **Mitigation**: In debrief, hammer: *"If you can undo death, was it ever death?"*  

  ---

  ### **Why It Works**  
  By making players **bargain with identity** (using fidelity scores/social leverage), you replace the "ship of Theseus" with a **consensus engine**. Survival stops being metaphysical — it’s literal game theory. And when the last node is arbitrarily voted "you", they’ll *feel* the absurdity.  

  **Run it messy**. If they’re yelling about node fidelity by Round 3, you’ve already won.
