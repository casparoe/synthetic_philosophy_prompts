  ok so for my philosophy paper i need to understand why the counterpart theory vs transworld identity debate is totally stalled. like, lewis says youre not literally in other worlds just similar copies exist there, and kripke says you are literally there with essential properties intact. my teacher mentioned this has gone on since the 70s with no winner. heres what im wondering: is the stall happening becuase both sides secretly disagree on whether modal reasoning should use a local-world index (where actual world is special) versus a global similarity metric across all worlds? or is it actually just verbal—like they mean different things by same person—and no experiment or argument could settle it? i want to know what kind of disagreement this really is, and specifically what kind of result or distinction would break the deadlock if anything could. also dont send me a reading list, i just need the conceptual diagnosis. btw i think modal anchoring might be the hidden issue but im not sure if thats a real term or something i made up.
