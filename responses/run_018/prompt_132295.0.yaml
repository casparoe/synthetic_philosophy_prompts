  First, the local vs. global point: Kripke treats the actual world as metaphysically privileged. Identity is absolute and anchored here. Other worlds are ways this world could’ve been. Lewis, though, is a modal realist—all worlds are equally real. So identity isn’t absolute; it’s about similarity across worlds. That’s a fundamental clash in starting points, not just semantics. 

  The verbal disagreement angle: Do they mean the same thing by "identity"? Kripke uses strict numerical identity, while Lewis replaces it with counterpart relations. That’s a terminological shift, but it’s not *just* verbal because it leads to different answers in modal claims. For example, "I could have been a pirate" for Kripke is about me literally being a pirate in another world. For Lewis, it’s about a counterpart who’s similar but not identical. So the disagreement is substantive but rooted in different frameworks.

  Modal anchoring—that’s a smart observation by the user. It’s not a standard term, but it captures the essence. Kripke’s anchoring is in the actual world, making identity rigid. Lewis’s similarity metric is global and relative. This is why the debate is stuck: neither side agrees on the ground rules. 

