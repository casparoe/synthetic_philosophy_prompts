  hey — i'm a phd student in philosophy of mind prepping questions for a podcast Q&A with an unnamed philosopher who defends hedonism through what she calls the 'recursive endorsement' answer to the heterogenity problem. the basic move is that pleasures don't share one qualitative feel (coffee, orgasm, solving proofs all differ), but they share a second-order representation that marks the state as worth sustaining for its own sake. she claims this sidesteps the usual phenomenological and introspective objections. i need about 8-10 questions that stay in the weeds — specifically one pressing how she separates pleasure from flow or aesthetic awe that also feel self-sustaining, one on masochistic/painful pleasures where the endorsement looks inverted or absent, and one on whether this representation is phenomenally present, functionally implicit, or cognitive. for each, sketch the answer she'll likely give and then a sharper follow-up that makes the deflection harder. please skip generic bio stuff and don't ask me for citations or a reading list.
