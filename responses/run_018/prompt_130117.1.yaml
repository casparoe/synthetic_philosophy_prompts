  For masochism: This is thorny because the endorsement seems inverted (wanting pain). The predicted move will be to separate the sensation from the endorsed valence—e.g., the pain is instrumental to a meta-pleasure. The follow-up should pressure whether this dissolves hedonism's simplicity by smuggling in non-hedonic values.

