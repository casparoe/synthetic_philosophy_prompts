answer: |-
  Here’s a speech weaving those threads together, hitting the 3-minute mark, and speaking to both audiences:

  ---

  **(Raise glass, warm smile)**  
  Mira, colleagues, friends, family… thank you for gathering to celebrate an extraordinary engineer and an even more remarkable person. For 25 years, Mira hasn't just built systems; she’s built the *conscience* of our archives. Her work – the intricate structures for storing, and crucially, the secure pipelines for *deletion* – embodies a profound truth she taught us all: **Keeping everything isn't preservation; it's hoarding. And deleting carelessly isn't efficiency; it's amnesia.**

  Her field forces us to confront a deep human tension: the ethics of remembering versus forgetting. We all feel the *duty to remember* – the important records, the hard lessons, the moments that define us. We build archives for that very reason. But we rarely talk about the equally vital, often uncomfortable, **duty to forget**. Not carelessly, not to hide, but to heal, to move forward, to make space for what truly matters. Societies, like systems, can be crippled by holding onto everything forever.

  Mira understood this tension intuitively. She wasn't just the "Save Everything" champion, nor was she the "Delete It All" technician. She was the architect of **intentional memory**. And here’s where her engineering genius offers us a powerful metaphor, especially for our tech team: **In the world of distributed systems, forgetting isn't passive. It's active, deliberate, and costly work.**

  Think about it: You don't just *hope* old data vanishes. You build complex "garbage collection" – processes that constantly evaluate, decide, and then *actively* remove what’s no longer needed, based on clear rules. You place "tombstones" – markers not just signifying deletion, but *securely guaranteeing* it happened correctly, leaving a trace of the *act* of forgetting itself. **Mira designed these processes. She knew that responsible forgetting requires rigor, structure, and immense effort. It’s not absence; it’s an active, ethical choice.**

  For our non-tech friends, imagine it like this: Mira didn't just build the library; she designed the careful, secure process ensuring that when a book *must* be respectfully retired – not lost to carelessness, but retired with purpose – it happens correctly, safely, and with accountability. She ensured we *could* forget responsibly.

  **This is Mira's true legacy: She showed us that the ethics of memory aren't a simple binary of 'remember forever' or 'delete it all.' It's about the conscious, difficult, active work of *curation*.** Building systems to remember *well*, and building systems to forget *responsibly*, are two sides of the same ethical coin. Both require courage, foresight, and deep responsibility.

  Mira, you taught us that remembering is sacred, but so is knowing *what* and *when* to let go. You showed us that true preservation isn't just about storing bits; it's about designing wisdom into the very fabric of how we handle our past. For your brilliant mind, your unwavering integrity, and for building not just systems, but a standard of ethical responsibility we all strive for... thank you.

  **To Mira – architect of responsible memory, master of the necessary forget!** *(Raise glass higher)*

  ---

  **Why this works:**

  1.  **Balances Audiences:**
      *   **Tech Team:** Nails the niche concepts (garbage collection, tombstones, distributed systems) and explicitly frames them as the core metaphor for the ethical point. They'll immediately grasp the depth.
      *   **Family/Friends:** Provides clear, non-jargon explanations ("building the conscience," "like a library," "active ethical choice"). The core ideas of duty to remember *and* forget, and the effort involved in both, are universal.
  2.  **Integrates the Philosophy:** Weaves Margalit (duty to remember) and Rieff (need to forget/societal healing) directly into the narrative without naming them, framing them as the tension Mira navigated.
  3.  **Uses the Niche Metaphor Perfectly:** The "active forgetting" in distributed systems is the central pillar. It brilliantly illustrates the user's point: moral forgetting isn't passive neglect; it's intentional, structured, costly work – *exactly* like Mira's deletion protocols.
  4.  **Honors Mira Accurately:** Avoids both simplistic hero tropes. She's the "architect of intentional memory," mastering *both* responsible preservation *and* responsible deletion as interconnected ethical acts.
  5.  **Structure & Flow:** Moves logically: Intro -> Mira's Core Principle -> Human Tension (Remember/Forget) -> Tech Metaphor explaining the tension -> Non-Tech Explanation -> Synthesis (Curation, Active Work) -> Legacy -> Toast.
  6.  **Time:** Designed to be delivered comfortably in 3 minutes.
  7.  **Emotion & Respect:** Warm opening, clear admiration, strong finish. Celebrates her intellect *and* her ethical grounding.

  Good luck with the speech! It's a beautiful tribute to what sounds like an incredible mentor.
