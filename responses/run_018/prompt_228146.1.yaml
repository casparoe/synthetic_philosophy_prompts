answer: |-
  ## Teleosemantic Theory Specification: Core Desiderata

  This specification outlines the essential requirements ("desiderata") that any adequate teleosemantic theory of mental representation must satisfy to provide a compelling naturalistic account. Each desideratum is derived from a core problem in naturalizing content, stated with its philosophical motivation and illustrated with a concrete test case. The status of each desideratum (non-negotiable, camp-specific, preference) and potential conflicts are explicitly noted.

  **Core Desiderata:**

  1.  **Content Determinacy & Distal/Proximal Distinction**
      *   **Problem:** Frog Snap Mechanism. Must content be "fly", "small dark moving object" (SDMO), "food", or something else?
      *   **Desideratum (D1):** The theory must assign a *determinate* content that explains the mechanism's selection history, distinguishing proximal stimuli (SDMO) from distal objects (fly) where appropriate. It must avoid collapsing into disjunctive contents ("fly-or-seed-or-shadow") when the mechanism's function is specific.
      *   **Motivation:** Representation implies a specific "aboutness". Indeterminate or disjunctive contents fail to explain the mechanism's *specific* contribution to fitness (snapping at flies, not just SDMOs, was beneficial) and undermine misrepresentation (snapping at a seed isn't misrepresenting "SDMO").
      *   **Test Case:** Frog snapping. An adequate theory must assign "fly" (or perhaps "prey" or "food-source") as the primary content, *not* "SDMO" or a disjunction, because selection favored detection of flies *via* SDMO detection. Snapping at a seed must be misrepresentation, not a correct representation of SDMO.
      *   **Status:** **Non-negotiable Requirement.** Failure implies the theory cannot specify what is represented, defeating its purpose.

  2.  **Robust Misrepresentation**
      *   **Problem:** Adaptive False Alarms. How can the danger detector misrepresent without every adaptive false alarm being "danger"?
      *   **Desideratum (D2):** The theory must allow for robust misrepresentation: states can be *false* (non-veridical) even when their tokening is adaptive or functionally appropriate in the immediate context.
      *   **Motivation:** Representation is inherently normative (true/false). If adaptive responses *define* truth, misrepresentation becomes impossible or trivialized (e.g., a false alarm *is* representing "danger-in-this-context").
      *   **Test Case:** Danger Detector. An adequate theory must explain why a false alarm triggered by wind rustling leaves is a misrepresentation of *danger* (or a specific danger), even though producing such false alarms is part of the mechanism's selected function and is adaptive overall. Truth conditions must be independent of the immediate behavioral utility.
      *   **Status:** **Non-negotiable Requirement.** Core to the very concept of representation.

  3.  **Selection History Determines Content Identity**
      *   **Problem:** Indistinguishable Heat Sensors. Identical mechanisms, different etiologies.
      *   **Desideratum (D3):** The theory must hold that selection history is constitutive of representational content. Physically identical mechanisms in different lineages can have different contents based on their distinct evolutionary functions.
      *   **Motivation:** Teleosemantics grounds content in *biological function*, which is inherently historical. Ignoring history severs the link to natural selection, the core explanatory tool.
      *   **Test Case:** Heat Sensors. Sensor A (selected for detecting warm rocks=shelter) must represent something like "shelter-location" or "warm-rock", while Sensor B (selected for detecting prey body-heat) must represent "prey" or "prey-location", despite both currently responding to similar heat signatures. Their content differences must stem from their distinct etiological functions.
      *   **Status:** **Distinctive Commitment of Historical Teleosemantics.** A core tenet, but potentially negotiable for non-historical variants (see D5).

  4.  **Scope: Learned & Developmental Content**
      *   **Problem:** Star Navigation Learning. Novel representation without evolutionary history.
      *   **Desideratum (D4):** The theory must account for the generation of genuinely *new* representational contents within an organism's lifetime through learning or development, not merely the triggering or derivation of evolutionarily established contents.
      *   **Motivation:** Cognition is flexible. A theory of content that cannot explain learned concepts (like a specific star for navigation) fails to capture a vast swathe of mentality. Deriving all content from innate functions is implausible.
      *   **Test Case:** Star Navigation. An adequate theory must explain how the animal's state representing *that particular star as a navigational beacon* acquires its specific content through individual learning, even if the *capacity* for celestial navigation has an evolutionary history. The content must be about *that specific star*, not just "celestial cue".
      *   **Status:** **Non-negotiable Requirement** for a general theory of mental content. Failure drastically limits scope.

  5.  **Swampman Compatibility**
      *   **Problem:** Accidental Duplicate. No history, identical behavior.
      *   **Desideratum (D5):** The theory must take a stance on whether the duplicate (Swampman) possesses genuine representations. If it does, the theory must explain how content arises without selection history. If it does not, the theory must explain the apparent representational character of its behavior.
      *   **Motivation:** Tests the metaphysical priority of history vs. current structure/function for content. Is representation essentially historical or can it be synchronic? Intuitions clash.
      *   **Test Case:** Swampman. An adequate theory must explicitly decide: Can Swampman's internal states represent (e.g., "food here")? The answer should be a substantive consequence, not an evasion. If "yes", it challenges pure historical accounts (D3). If "no", it must explain why Swampman's successful, seemingly guided behavior lacks intentionality.
      *   **Status:** **Distinctive Commitment / Litmus Test.** Answers define fundamental camps. ("Yes" favors synchronic/system-based accounts; "No" favors pure historical accounts).

  6.  **Expressive Power: Complex Contents**
      *   **Problem:** Beyond Simple Detectors. Contents like "same individual", "enough", "absent", "permissible".
      *   **Desideratum (D6):** The theory must be able to ground complex representational contents, including relational ("same as before"), quantitative ("enough food"), negative ("predator absent"), modal ("possible danger"), and normatively governed ("permissible action") contents.
      *   **Motivation:** Human and animal cognition demonstrably involves such contents. A theory limited to simple feature detection (e.g., "fly there") is explanatorily inadequate for higher cognition.
      *   **Test Case:** "Enough Food". An adequate theory must explain how a state representing that *sufficient food has been gathered to cease foraging* acquires its complex content involving quantification and a behavioral norm, grounded in biological function.
      *   **Status:** **Non-negotiable Requirement** for a general theory. Methodological preference might dictate starting simple, but the theory must *scale*.

  7.  **Error vs. Malfunction Distinction**
      *   **Problem:** Differentiating failure modes.
      *   **Desideratum (D7):** The theory must provide a clear, principled distinction between:
          *   **Representational Error:** A state is tokened (according to its function) but its content is false (e.g., danger detector fires at rustling wind).
          *   **Malfunction:** The mechanism breaks down and fails to token a state when it should, or tokens it aberrantly, *preventing* it from fulfilling its representational function (e.g., danger detector is jammed by dirt and never fires).
          *   **Absence of Function:** The state/mechanism lacks any relevant teleofunction (e.g., random neural noise).
          *   **Change of Function:** The mechanism is co-opted for a new purpose (e.g., feathers for flight vs. insulation).
          *   **Successful Non-Representational Guidance:** Behavior successfully guided by mechanisms lacking representational content (e.g., tropism, simple reflex).
      *   **Motivation:** Representation is only one way biological systems guide behavior. A theory must clarify what *makes* a state representational and precisely define its specific failure mode (error) versus other kinds of failure or non-representational success.
      *   **Test Case:** Frog Snap. Snapping at a seed is *error* (correct function, false content). A faulty neuron preventing snapping when a fly is present is *malfunction*. The frog's heartbeat is *non-representational*. Feathers used for display after evolving for insulation might involve a *change of function*.
      *   **Status:** **Non-negotiable Requirement.** Essential for defining the representational domain and its norms.

  **Conflict Identification:**

  *   **The Core Tension:** Desiderata D3 (Historical Determination) and D4 (Learned Content) appear to conflict with D5 (Swampman) and potentially D6 (Complex Contents requiring flexible grounding). Pure historical selection (D3) struggles with genuinely *new* learned content (D4) and denies content to Swampman (D5). Insisting on determinacy (D1) via history (D3) also conflicts with the potential indeterminacy introduced by flexible learning (D4).
  *   **The Trade-off:** Achieving fully **determinate content (D1)** via **purely historical selection (D3)** while accommodating **genuinely novel learned content (D4)** and a **strong distinction between content and current use (D2)** is extremely difficult, arguably impossible. Theories typically relax one desideratum:
      *   Strict Historical (D3) + D1: Sacrifices robust D4 (learned content is merely derived), denies content to Swampman (D5 consequence), may struggle with D6.
      *   Learning/Use-Based (prioritizing D4/D5): Sacrifices pure D3 (allows synchronic function), risks weakening D1 (determinacy) and D2 (misrepresentation if truth is tied too closely to current success).
      *   Hybrid/Consumer Approaches: Attempt to reconcile by grounding learned content in the functions of *consuming* mechanisms, but face challenges explaining the *origin* of truly novel contents not anticipated by evolutionary functions.

  **Scorecard of Approaches**

  1.  **Producer-Selection Account:** Content is fixed by what a detection/production mechanism was *selected to correlate with or produce in response to* (e.g., fly detection for the frog's retina).
      *   *Score:* Excels at D1 (Determinacy - fly), D3 (History - heat sensors differ), D7 (Error - snapping at seed). Struggles severely with D4 (Learned Content - star is derivation), D5 (Swampman - no content), D6 (Complex Contents - hard to scale). Risk of proximal content (D1 - SDMO).

  2.  **Consumer/Success-Based Account:** Content is fixed by the conditions under which the *consuming/downstream mechanisms* (e.g., snapping mechanism) were historically *successful* when triggered by the producer state (e.g., snapping succeeds when fly is present).
      *   *Score:* Excels at D1 (Distal content - fly, via success condition), D2 (Misrepresentation - false alarm fails consumer success), D3 (History - heat sensor consumers differ), D7 (Error). Better at D6 (Complex Contents - via consumer needs, e.g., "enough"). Moderate on D4 (Learned Content - can incorporate learning in consumers). Typically fails D5 (Swampman - no history).

  3.  **Informational Account + Function:** Content is the *information* a state carries (reliably correlates with), but only if carrying that information is the state's *biological function* (e.g., frog state functions to carry info about flies).
      *   *Score:* Moderate D1 (Risk of disjunction/SDMO unless function restricts it). Good D2 (Misrepresentation - carries info falsely). Good D3 (History - function restricts info). Poor D4 (Learned Content - individual learning often lacks "function"). Fails D5 (Swampman - no function). Struggles with D6 (Complex Contents - information correlation hard). D7 depends on function definition.

  4.  **Learning/Use-Based Account:** Content is fixed (partly or wholly) by the role a state plays in *current or learned* behavioral success or use within the organism's cognitive economy, potentially grounded in individual history or synchronic function.
      *   *Score:* Excels at D4 (Learned Content - star), D5 (Swampman - content possible), D6 (Complex Contents - flexible). Moderate D1 (Determinacy - challenge). Risky on D2 (Misrepresentation - if success defines truth). Fails D3 (History - ignores it). Risky on D7 (Error - hard to distinguish from change of function/non-rep guidance). Weak on history-based determinacy (D1).
