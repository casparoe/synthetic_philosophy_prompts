prompt: |-
  you're acting as a philosophy prof who actually teaches well, not just a walking encyclopedia. I need a teaching plan — not the explanation itself — for a 75-minute session with law and econ grad students on Scanlon's contractualism and teh aggregation problem (specifically why justifying actions to each individual makes counting numbers awkward). Start with some brainstorming on the dependency chain: what idea has to come first so that "reasonable rejection" isn't instantly misread as "I'd be annoyed"? I think I have to separate Scanlon from Rawls and Hobbes right at the opening, but tell me exactly where that separation lands in the sequence and what misconception it prevents.

  Next, pick the one carrying example — I'm leaning toward the rescue-boat case (save one versus save five), but tell me if that's wrong and what example actually does the work. Whatever it is, specify the properties it needs to have (individual complaints that don't collapse into one another) and what it must lack (any hidden utilitarian math, any assumption that we can trade lives like commodities). Then map the misconceptions they'll form in order: first probably "this is just social contract theory 2.0," then "reasonable rejection just means subjective anger," then "Scanlon solves aggregation by adding up the complaints of the five." For each, say exactly where in the arc I should head it off — like, before I introduce the example? right after?

  Also, design the end check: one question I can ask to tell whether they've actually grasped why aggregation is a problem for this view, rather than just memorizing that Scanlon doesn't like adding people together. And be explicit about what I should openly refuse to explain at this level — maybe formal decision-theoretic framing, or the full comparison with rule-utilitarianism?

  Please think carefully step-by-step, don't just dump bullet points, and write it like you're advising a colleague over coffee. It's okay if there's a typo or two — I'm typing this on my phone between meetings.
reasoning: |-
  Okay, the user wants a teaching plan for a 75-minute session on Scanlon's contractualism and the aggregation problem for law and econ grad students. They're concerned about misconceptions and want a clear dependency chain. Let me start by unpacking their main points.

  First, they mentioned separating Scanlon from Rawls and Hobbes right at the beginning. I need to pinpoint where this fits in the sequence. If I don't do this early, students might confuse Scanlon's reasonable rejection with mutual advantage or impartiality. So, the separation should happen right after introducing the basic idea of contractualism. Highlighting that Scanlon is about justifiability to each person, not mutual benefit or fairness behind a veil of ignorance. That misconception could derail the whole session if not addressed upfront.

  Next, choosing the carrying example. The user suggested the rescue-boat case (one vs. five). But is this the best? The rescue scenario is good because it's intuitive and pits individual claims against numbers. However, it must lack any hidden utilitarian math. So, modifying it to ensure no cost-benefit analysis is implied. Maybe add that saving the one has a personal significance, like their child, to prevent seeing lives as commodities. This emphasizes individual complaints that can't be merged.

  The user also wants to map misconceptions and when to address them. The first one is mistaking Scanlon for social contract 2.0. Address this during the Rawls/Hobbes separation. Then, reasonable rejection being subjective anger—this comes up when defining "reasonable." Need to clarify it's about principles no one could reasonably reject, based on personal reasons, not emotions. Use the rescue example to show it's about the gravity of the complaint, not intensity of feeling.

  Another misconception is aggregating complaints. After presenting the rescue case, students might think adding the five complaints solves it. Here, emphasize that each complaint stands alone; you can't sum them. Use an analogy, like weighing individual burdens separately. The key is showing that saving the five isn't justified by numbers but whether any individual's rejection is reasonable given alternatives.

  For the end check, the question needs to test understanding of why aggregation is a problem. Asking them to apply it to a new case, like distributing lifesaving medication. If they focus on individual complaints without summing, they get it. If they start counting numbers, they missed the point.

  The user also wants to know what to avoid. Formal decision theory or detailed comparisons with rule-utilitarianism. Those are beyond the scope. Stick to the core concepts to prevent overload.

  Overall, the session structure should flow: Hook with a dilemma, introduce Scanlon's core idea, differentiate from others, define key terms, present the rescue case, tackle misconceptions step-by-step, group activity for application, and end with a check question. Timing each segment is crucial to fit 75 minutes. Allot more time to the rescue case discussion and group activity since that's where deeper understanding happens.
answer: |-
  Alright, colleague, coffee's hot – let's craft this session. Teaching Scanlon's aggregation tension to sharp law/econ grads means ruthlessly prioritizing the *philosophical friction* over comprehensive coverage. They'll instinctively want to formalize; our job is to make them *feel* the conceptual snag first. Here’s the battle plan:

  **Core Goal:** They leave understanding *why* Scanlon's "justification to each" creates a fundamental, unresolved tension with intuitive cases involving saving larger numbers, and why "adding up complaints" violates his framework's core logic.

  **Dependency Chain Brainstorm (Crucial!):**
  1.  **First: The Foundational Shift (Hook + Separation - Minutes 0-15)**
      *   **Hook (5 min):** Start with a visceral, low-stakes *individual complaint* scenario: *"Imagine I secretly moved your favorite chair from your office to mine because it 'looked better' there. Could you reasonably reject my action? Why? What gives your complaint force?"* (Draw out: It's *your* chair, *your* space violated; appeal to a principle like "don't take others' stuff without permission").
      *   **Separation (10 min):** NOW pivot: *"Philosophers often appeal to 'agreement' to justify rules. But what KIND of agreement? Scanlon says: Forget Hobbes (mutual advantage – 'I'll obey if it keeps me safe') and Rawls (veil-of-ignorance fairness – 'what if I were anyone?'). His question is starkly different..."*
      *   **Landing the Separation:** "Scanlon asks: **Could my action be justified by principles that no one, suitably motivated, could *reasonably reject* *as a basis for informed, unforced general agreement*?** The focus is *justification owed specifically to each individual affected*, on grounds *they* could recognize as relevant from *their* standpoint."
      *   **Misconception Prevented:** This stops them from seeing "reasonable rejection" as either "I don't benefit" (Hobbes) or "It's unfair statistically" (Rawls). The chair example primes the *individual-relational* core: justification *to you*, about *your stuff*.

  2.  **Second: Defining "Reasonable Rejection" (Minutes 15-25)**
      *   *Before the lifeboat!* Drill down: "What makes rejection *reasonable*? Not 'I'm annoyed' (chair thief might be annoyed they got caught!). It's about the **weight of the personal reasons** someone has for objecting, given the alternatives available. What burdens does the principle/policy impose *on them*? Are there alternatives imposing lesser or comparable burdens on others? It's comparative."
      *   **Key Nuance:** Emphasize "personal reasons" are *not* selfish whims, but reasons grounded in their legitimate interests/status that *others* must acknowledge as relevant ("I need *some* private workspace" is different from "I hate that chair color").
      *   **Misconception Pre-Empted:** This explicitly heads off "reasonable rejection = subjective anger/disappointment" *before* introducing high-stakes cases where emotions run high. Anchor it in the chair: Their rejection is reasonable because of the *kind of interest* violated (property, autonomy), not the intensity of their feeling.

  3.  **The Carrying Example: Rescue Boat Case (PERFECT Choice) - Minutes 25-45**
      *   **The Case (State it CLEANLY):** "You are on a rescue boat. You can steer to Island A, saving one stranded person (Person A). Or steer to Island B, saving five stranded people (Persons B1-B5). You can only go to one island. All will certainly die if not rescued. Assume no special relationships, equal need, etc. *According to Scanlon's framework, what must we consider in deciding which course is justifiable?*"
      *   **Properties It HAS:**
          *   Clear individual stakes (life/death for A, life/death for each B).
          *   Mutually exclusive outcomes based on agent's choice.
          *   Individual complaints are distinct and non-fungible (A's death is *A's* complaint; B1's death is *B1's* complaint).
      *   **Properties It MUST LACK (State This Explicitly!):** "Crucially, assume **no hidden utilitarian calculus**. We are not comparing the *total* number of lives saved as a value in itself. We are not treating lives as interchangeable commodities whose loss can simply be summed. The question is about justifying the action *to each person affected*."
      *   **Running the Analysis:**
          *   *Option: Save A. Don't Save B1-B5:* Can A reasonably reject this? No, they are saved. Can B1 reasonably reject this? **YES.** They die. Their complaint: "You chose a course where I die when you could have chosen one where I live (and only A dies, who you didn't save anyway)."
          *   *Option: Save B1-B5. Don't Save A:* Can B1 reasonably reject this? No, they are saved. Can A reasonably reject this? **YES.** They die. Their complaint: "You chose a course where I die when you could have chosen one where I live (and only the five on the other island die, who you didn't save anyway)."
      *   **The Aggregation Problem Emerges:** Point out the symmetry. *Each individual* in the non-saved group has a complaint of identical *kind* and *weight* (loss of life). Saving the five means A has a complaint. Saving the one means each of the five has a complaint. But Scanlon's framework forces us to consider each complaint *individually*. Can we say "The complaint of *each B-person* is *outweighed* by the fact that saving them also saves the *other four*?" **NO.** That's utilitarianism sneaking in. The framework asks: "Is A's complaint *against being left to die* reasonable *compared to the complaint each B-person would have if left to die*?" And each complaint is equally severe.

  4.  **Tackling Key Misconceptions in Sequence:**
      *   **"This is just Social Contract 2.0"** - *Headed off at Step 1 (Separation).* Constantly refer back: "Remember, mutual advantage/veil of ignorance isn't the game here. It's about what *each* individual could reasonably accept as justification for the burden imposed *on them specifically*."
      *   **"Reasonable Rejection = Subjective Anger"** - *Headed off at Step 2 (Defining Reasonable Rejection), reinforced during Case Analysis.* During the case: "B1's complaint isn't 'I'm furious!' It's 'This principle (save the one) allows my life to be lost when an alternative principle (save the five) existed where it wouldn't be, *and my life is just as valuable to me as A's is to them*.' The reasonableness comes from the *nature of the burden* (death) and the *availability of alternatives*."
      *   **"Scanlon Solves Aggregation by Adding Up the Five Complaints"** - **THIS IS THE CRITICAL ONE TO SMASH (Minutes 40-50).**
          *   *When:* Immediately after laying out the symmetrical complaints in the rescue case.
          *   *How:* Be blunt. "Tempting, right? Five complaints vs. one! But STOP. Scanlon's framework *forbids* this. Why?"
          *   *Reason 1 (Conceptual):* Justification is owed *to each individual*. Adding complaints treats individuals as mere containers of disvalue to be summed. It violates the core idea that the justification must address *each person* on grounds *they* could accept. Person A can say: "My complaint about dying is just as strong as B1's complaint would be. Why does B1's complaint get amplified because B2, B3, B4, and B5 *also* happen to be on that island? That fact doesn't make B1's *individual* loss *worse for B1*."
          *   *Reason 2 (Formal - Briefly):* Adding implies interpersonal comparison of *strength* beyond the shared *kind* of burden (death). Scanlon avoids cardinal measures of "complaint strength." We can say death is a *type* of burden everyone has strongest reason to avoid, but comparing *my* death-complaint to *yours* as quantitatively different is problematic within his system.
          *   **Analogy:** "It's like judging a trial where five people each sue the defendant independently for $100k damages for identical harm. We wouldn't say the defendant owes $500k to the *group*. We'd have five separate claims each for $100k. But in Scanlon's 'court', we can't even enforce the outcome for all five at once without facing each claim *individually* and seeing if the defendant can justify *to each claimant* why *their* $100k isn't being paid."

  5.  **Group Work / Application (Minutes 50-65):**
      *   **Task:** Give a variation: *"Rescue Boat, but Island A has ONE person. Island B has ONE person who is a world-renowned surgeon who will save 100 lives next month if rescued. What does Scanlon's framework say?"*
      *   **Purpose:** Force them to apply the "individual complaint" lens. Does the surgeon's *future utility to others* count as a *personal reason for the surgeon* to reject non-rescue? (Scanlon says likely no – "I deserve rescue because I'm useful" isn't a reason others must accept as foundational). Does it give *others* a stronger complaint if the surgeon isn't saved? (No – it's not *their* burden). This highlights the starkness of the aggregation problem vs. utilitarianism. Circulate and challenge any summing.

  6.  **End Check: The Litmus Test Question (Minutes 65-75)**
      *   **Question:** *"Imagine a modified case: You can give a single, life-saving drug dose either to one very sick person (Person C) who will certainly die without it, or split it equally among five moderately sick people (Persons D1-D5) who will* ***each*** *certainly die without their fractional dose, but will fully recover with it. How does Scanlon's framework analyze this differently than the Rescue Boat, and why does the 'number five' still present the same fundamental aggregation problem?"*
      *   **Why it works:** It changes the *nature* of the burden slightly (denying full cure vs. denying rescue) but keeps the numbers. It tests if they:
          1.  See C's complaint: "I die when you could save me."
          2.  See each D-person's complaint: "I die when you could have saved me (by giving me the full dose, or in this case, by not splitting the dose needed to save me)."
          3.  **Crucially:** Recognize that **even though the drug is split, the complaint of *each D-person* is still *individual* and about *their own death***. They *cannot* say "Saving the five is justified because we add up five complaints" without violating Scanlon's core. The aggregation problem persists: How does the presence of *other* D-people affect the justifiability of letting *this specific* D-person die, compared to letting C die? The framework struggles to explain the intuition that saving the five is *required*.
      *   **What Shows Grasp:** If they articulate that the number five *doesn't* directly make any *individual* D-person's complaint *stronger* than C's complaint within the framework; it just means *more individuals* have equally strong complaints. The tension between respecting each individually and the intuitive pull of numbers remains unresolved *within Scanlon's terms*.

  **What to Openly Refuse to Explain (For Now):**
  *   **Formal Decision-Theoretic Models:** No matrices, no utility functions. This session is about *conceptual foundations*. We're exposing the philosophical knot, not trying to model it mathematically (that comes later, if ever, and requires acknowledging this core tension).
  *   **Deep Dive into Rule-Utilitarianism Comparison:** A brief contrast ("Unlike rule-util, which asks what rule *maximizes* good, Scanlon asks about reciprocal justification") is fine. But don't get bogged down in rule-util's own complexities or how it *might* handle aggregation differently. That's a whole other session. Keep the focus laser-tight on Scanlon's internal logic.
  *   **Scanlon's Own (Contested) Attempts to Handle Aggregation:** Don't dive into his "complaint-moderation" or "transmitter tower" examples. That's advanced maneuvering *after* accepting the problem exists. Here, we need them to *feel* the problem in its raw form.

  **Overall Flow & Timing:**
  *   0-15: Hook + Foundational Shift/Separation
  *   15-25: Defining Reasonable Rejection
  *   25-45: Rescue Boat Case & Symmetry Revealed
  *   40-50: **Aggregation Problem Eruption & Smashing "Adding Complaints"**
  *   50-65: Group Work (Surgeon or Drug Case)
  *   65-75: Debrief Group Work + Litmus Test Question / Wrap-up

  **Teaching Mantra for This Session:** "It's not about the math, it's about the *moral address*." Hammer on the question: "What can you say *to the person left behind* to justify your choice, given *their* individual stake?" If your justification to A for saving the five boils down to "Because there were more of them," you've lost Scanlon and embraced aggregation. That's the tension you want them walking out the door still wrestling with.

  Good luck! Remember, their econ/law brains will itch to formalize. Make that itch productive by showing them *why* it's so hard to formalize *this* way of thinking. That's the win. Now go make contractualism tense! ☕

  *(P.S. Typo in the subject line? Noted. We're all typing on phones here.)*
