prompt: |-
  I am a novelist defending a specific thesis at an interdisciplinary symposium on artificial intelligence and literary craft: that prolonged reliance on large language models for plot generation does not merely outsource labor, but erodes the author's capacity to sustain what I term the counterfactual web—the dense, unwritten field of narrative branches a character could have pursued but did not, which I take to be the primary locus of moral weight in fiction. The audience comprises literary scholars who regard authorship as distributed and socially constructed, cognitive psychologists who study expertise degradation, and one philosopher of mind for whom understanding reduces to behavioral fluency; they are skeptical of romantic notions of genius but will take empirical and conceptual claims seriously. I sketch my argument briefly: moral characterization in the novel depends on the reader's sense that alternative actions were genuinely live for the agent, and maintaining that liveliness requires the author to hold a complex, unstable map of rejected possibilities, a cognitive load that model-assisted generation tends to collapse into a single optimized path. Prepare me for the objections I will actually face, ordered by how damaging each is to this specific claim rather than to my broader feelings about technology. For each objection, provide the form in which that audience would phrase it, what I should concede immediately, what I must not concede, the weakest point in my reply, and the single reply that must land for the thesis to survive. Include the one question I hope nobody asks—the objection that forces me to distinguish my claim from a generic defense of human labor against automation. Keep the prep sheet focused; I have fifteen minutes and no slides.
reasoning: |-
  Okay, let me unpack this novelist's request. They're preparing for a high-stakes interdisciplinary symposium where they'll argue that overusing AI for plot generation damages an author's ability to maintain the "counterfactual web" - that network of unrealized narrative choices which gives fiction its moral weight. The audience is tough: literary scholars who see authorship as social, psychologists studying skill degradation, and a behaviorist philosopher.

  Hmm, the core vulnerability here is whether this "counterfactual web" is truly necessary for moral depth or just the author's personal process. I need to anticipate objections that specifically target that link rather than general anti-AI sentiments. The most dangerous critiques will come from those who either: a) believe the counterfactual web can be maintained through other means (like editing), b) think moral weight comes from elsewhere (reader interpretation or textual cues), or c) argue that AI could theoretically support this cognitive process.

  First objection that comes to mind: the literary scholars might argue that moral weight emerges from the finished text's ambiguity, not the author's mental process. That's damaging because it severs the connection between the unwritten alternatives and the reader's experience. The novelist must concede that readers construct meaning independently, but can't budge on the claim that textual ambiguity requires authorial cultivation of alternatives. Weakest point? Proving that cultivation happens pre-textually.

  Second big threat: the psychologists might cite studies showing experts use heuristics (like AI) without losing core skills. The concession would be that some outsourcing is harmless, but the holdout must be that counterfactual mapping is a fragile, high-cognitive-load process. Tricky part is distinguishing this from muscle-memory skills.

  Third, the behaviorist philosopher could reduce "understanding characters" to predicting their actions - which AI might actually improve. Here the novelist must bite the bullet and insist that moral evaluation depends on perceived freedom, not just behavioral coherence. This philosophical divide might be irreconcilable.

  The landmine question: "If an author uses AI but rigorously reviews discarded options, does that preserve the counterfactual web?" This forces admission that the thesis isn't about tools per se, but about cognitive displacement during creation. Must pivot to emphasize the generative moment's vulnerability.

  Throughout, the novelist's survival depends on one move: showing that the counterfactual web isn't just prep work, but the ongoing cognitive tension that shapes moral texture. If that falls, the whole thesis collapses into nostalgia.
answer: |-
  Here's your targeted prep sheet for high-impact objections, ordered by damage to your core thesis (counterfactual web erosion → moral weight loss). Focused for 15 minutes:

  **Objection 1 (Most Damaging: From Literary Scholars/Cognitive Psychologists)**  
  **Form:** "Your 'counterfactual web' sounds like pre-compositional brainstorming – a labor phase easily outsourced. Why can't an author use LLM-generated *multiple* plot branches as raw material, then *selectively internalize* them during revision? Doesn't this preserve the 'unstable map' while reducing drudgery?"  
  **Concede Immediately:** LLMs *can* efficiently generate surface-level alternatives (e.g., "Character A betrays B" vs. "A confesses").  
  **Must Not Concede:** That authorial selection *from externalized options* replicates the cognitive load/instability of *self-generating and holding* live alternatives *during* the act of narrative propulsion.  
  **Weakest Point in Your Reply:** Demonstrating the qualitative difference between *evaluating* presented options and *inhabiting* the generative tension where alternatives feel equally possible *to the author-as-character*.  
  **Reply That Must Land:** "The moral weight relies on the author's *embodied uncertainty* during creation – the neural cost of suppressing paths that *feel* equally real. LLM-generated branches are inert proposals; self-generated branches exert cognitive *pressure*. Outsourcing the generative act collapses that pressure field, making selection an editorial, not a moral-imaginative, act."

  **Objection 2 (High Damage: From Cognitive Psychologists)**  
  **Form:** "Expertise research shows skills degrade only when core practice is abandoned. If authors use LLMs for *some* plots but still write 'manually' for others, or rigorously interrogate LLM output, wouldn't this preserve their counterfactual capacity? Isn't this just task-specific automation?"  
  **Concede Immediately:** Intermittent LLM use or critical engagement *might* mitigate degradation *if* counterfactual mapping is treated as a discrete, trainable skill.  
  **Must Not Concede:** That counterfactual mapping is a modular "skill" separable from the holistic, effortful process of *sustaining a narrative's possibility-space in real-time*.  
  **Weakest Point:** Proving that *prolonged reliance* (your thesis) inherently weakens the capacity, not just the immediate output.  
  **Reply That Must Land:** "The 'counterfactual web' isn't a tool you pick up; it's the *strained state* of holding competing potentials while forging a singular path. Chronic offloading trains the brain to *accept* the LLM's optimized path as the only 'natural' one, eroding the neural infrastructure for sustained generative conflict – the very locus of moral tension. It's atrophy of imaginative endurance."

  **Objection 3 (High Damage: From Philosopher of Mind/Literary Scholars)**  
  **Form:** "Moral weight resides in the *reader's* construction of character possibility from textual cues (foreshadowing, regret, stated options) – not the author's private mental map. Why can't an LLM-generated text *signal* contingency just as effectively? Isn't your 'counterfactual web' just a mystical description of drafting?"  
  **Concede Immediately:** Reader construction is paramount; textual cues *are* essential triggers.  
  **Must Not Concede:** That cues signaling contingency are functionally identical whether generated by an author who *lived* the tension or an LLM statistically mirroring it.  
  **Weakest Point:** Arguing for the qualitative difference in the *source* of contingency cues without sounding dualist.  
  **Reply That Must Land:** "Cues born from authentic authorial struggle carry the residue of *resisted choices*, creating deeper textual instability. LLM cues are semantic placeholders. The difference is between a scar and a drawn-on wound. The reader senses the *authenticity of suppressed possibility* – which stems from the author's cognitive burden during creation."

  **Objection 4 (Moderate Damage: From All Camps)**  
  **Form:** "Isn't this just the 'GPS erodes spatial navigation' argument applied to writing? Yet people still navigate. Analogous cognitive tools (outlines, encyclopedias) didn't kill the counterfactual web. Why are LLMs special?"  
  **Concede Immediately:** All tools reshape cognition; previous tools (like outlines) co-evolved with craft.  
  **Must Not Concede:** That LLM plot generation is cognitively equivalent to using reference materials or static planning tools.  
  **Weakest Point:** Distinguishing LLM's *generative substitution* from *informational support*.  
  **Reply That Must Land:** "Outlines/encyclopedias support *my* generative act. LLMs *perform* the generative act for me. The former scaffolds the counterfactual web; the latter replaces the engine that spins it. The unique danger is the outsourcing of *constitutive imaginative labor*, not supplemental research."

  **The Landmine Question (You Hope Nobody Asks):**  
  **Form:** "If an author uses an LLM to generate 20 plot variations, then spends hours painstakingly comparing them, internalizing their implications, and feeling their emotional weight – hasn't the author *reconstructed* your counterfactual web using the LLM as a catalyst? Doesn't this *enhance* moral depth by expanding possibility beyond individual bias?"  
  **Why it's Deadly:** Forces you to admit your thesis isn't fundamentally about *automation* but about *when and how* the cognitive load is borne. It severs your claim from Luddism but risks hollowing it.  
  **Your Forced Distinction:** "This hypothetical requires heroic, unsustainable metacognition *after* the generative act. The 'web's' moral power derives from its formation *during* the agonistic process of *choosing the actual path while feeling the drag of others*. LLM-first generation externalizes that conflict. The author analyzes *paths already taken by the model*, experiencing regret or alternatives intellectually, not generatively. The vital, unstable *pressure* of simultaneous potential is lost at the moment of creation."  
  **Key Survival Move:** Emphasize the **temporal and experiential primacy** of the generative moment's cognitive state over post-hoc analysis.

  **Summary Survival Strategy:**  
  - **Anchor** constantly in the *specific cognitive state* ("unstable map," "generative tension," "neural pressure") required *during active narrative propulsion*.  
  - **Distinguish** sharply between *supporting* tools and *generative substitution*.  
  - **Concede** readily on reader interpretation and outsourcing efficiency, but **hold the line** on the irreplaceable role of authorial cognitive struggle in *originating* authentic moral texture.  
  - **Your Must-Land Soundbite:** "The counterfactual web isn't planning – it's the *friction* of creation. Smooth that friction with automation, and moral gravity evaporates."
