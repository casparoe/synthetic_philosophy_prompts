answer: |-
  ### Decision Procedure for Causal Attribution of Omissions

  **Procedure Name:** Omission Causal Attribution Protocol (OCAP)  
  **Purpose:** To determine if an omission (failure of a sensor, valve, or protocol to act) qualifies as a *genuine cause* of harm (triggering mandatory redesign) or a *background condition* (no redesign).  
  **Scope:** Applies to incidents in automated chemical-processing infrastructure.  
  **Time Limit:** 30 minutes per incident.  
  **Output:** Binary classification ("List as Cause" or "Do Not List as Cause").  
  **Key Principles:**  
  - **Baseline Expectation:** Only omissions relative to **documented design/normative standards** (e.g., specs, protocols, regulations) count.  
  - **Counterfactual Necessity:** The omission must be necessary to prevent harm (tested via Type-I/Type-II rules).  
  - **Operational Override:** Documented overrides (updates, maintenance, reassignments) nullify baseline expectations.  
  - **Hand-off Points:** Escalate issues involving policy conflicts, liability, or ambiguous baselines to legal/engineering leads.  

  ---

  #### Step-by-Step Questions for Auditors  
  *[Run sequentially. Stop if "Do Not List as Cause" or hand-off is triggered.]*

  1. **Was a documented harm caused by the incident?**  
     - *Evidence:* Incident logs, damage reports.  
     - **If NO:** Stop. No report needed.  
     - **If YES:** Proceed to Question 2.  

  2. **Did a system component (sensor, valve, protocol) fail to act?**  
     - *Evidence:* System logs, error alerts.  
     - **If NO:** Stop. Harm was not due to an omission (e.g., caused by active malfunction).  
     - **If YES:** Proceed to Question 3.  

  3. **Was the component expected to act per documented design/normative baselines?**  
     - *Evidence:* Design specs, regulatory protocols, operational manuals.  
     - **If NO:** Stop → **Do Not List as Cause**. (Omission is a non-event; no baseline exists.)  
     - **If YES:** Proceed to Question 4.  
     - *Hand-off Point:* If baselines are ambiguous (e.g., unwritten norms or conflicting documents), escalate to legal/engineering leads.  
     - *Misfire Flag:* False positives if baselines are outdated; false negatives if baselines are undocumented.  

  4. **Was the baseline overridden by a documented operational exception?**  
     - *Evidence:* Maintenance logs, update records, reassignment orders.  
     - *Criteria:* Override must be **authorized + timestamped + logged** (e.g., maintenance mode, protocol update).  
     - **If YES:** Stop → **Do Not List as Cause**. (Expectation voided; omission is a background condition.)  
     - **If NO:** Proceed to Question 5.  
     - *Misfire Flag:* False negatives if override was illegitimate (e.g., unauthorized change).  

  5. **Is the omission Type-I (interrupt active chain) or Type-II (maintain static safeguard)?**  
     - *Evidence:* Design documents (e.g., "valve shuts flow" = Type-I; "pressure maintained" = Type-II).  
     - **Type-I:** Proceed to Question 6A.  
     - **Type-II:** Proceed to Question 6B.  

  6. **A. [Type-I] Would acting have broken the causal chain?**  
     - *Test:* "If the component acted as expected, would harm have been prevented?"  
     - *Evidence:* Engineering simulations, historical data (e.g., valve response time).  
     - **If NO:** Stop → **Do Not List as Cause**.  
     - **If YES:** **List as Cause**.  
     - *Misfire Flag:* False positives if chain interruption is probabilistic (e.g., 50% success rate).  

     **B. [Type-II] Would maintaining the safeguard have blocked harm?**  
     - *Test:* "If the safeguard was active as expected, would harm have been impossible?"  
     - *Evidence:* Threshold calculations, leak models (e.g., pressure vs. leak correlation).  
     - **If NO:** Stop → **Do Not List as Cause**.  
     - **If YES:** **List as Cause**.  
     - *Hand-off Point:* If counterfactual depends on external factors (e.g., environmental conditions), escalate.  

  ---

  ### Application to Cases  
  #### Case 1: Chlorine-Monitoring Node Failure  
  - **Incident:** Node failed to trigger shutdown valve during contamination spike. No maintenance/override.  
  - **Procedure Walkthrough:**  
    1. Harm confirmed (contamination).  
    2. Omission: Node failed to send signal.  
    3. Baseline: Design specs require shutdown during spikes. → **YES**.  
    4. Override: Logs show no maintenance/reassignment. → **NO**.  
    5. Type: Interrupting active flow → **Type-I**.  
    6A. Counterfactual: If valve shut, contamination avoided? → **YES** (valve responds in 2s).  
  - **Classification:** **List as Cause** (triggers redesign).  
  - **Decision Point:** Question 6A. Evidence: Valve design specs + logs.  

  #### Case 2: Node in Maintenance Mode  
  - **Incident:** Node in maintenance mode (automatic shutdown disabled). Manual check not performed.  
  - **Procedure Walkthrough:**  
    1. Harm confirmed (contamination).  
    2. Omission: (A) Node failed to act; (B) Manual check not done.  
    - *For (A) Node:*  
      3. Baseline: Expected to trigger shutdown → **YES**.  
      4. Override: Maintenance mode logged by technician → **YES** (baseline suspended).  
      → **Stop: Do Not List as Cause**.  
    - *For (B) Manual check:*  
      3. Baseline: Maintenance protocol requires manual checks → **YES**.  
      4. Override: No document suspending manual checks → **NO**.  
      5. Type: Manual check interrupts chain → **Type-I**.  
      6A. Counterfactual: If manual check done, would shutdown have occurred? → **YES** (scheduled checks).  
      → **List as Cause** (triggers redesign of manual check protocol).  
  - **Classification:**  
    - Node omission: **Not a cause** (override nullifies baseline).  
    - Manual check omission: **List as cause** (no override).  
  - **Key Insight:** Override check (Question 4) exempts the node but not the manual protocol.  
  - **Hand-off Point:** None (all evidence factual).  

  #### Case 3: Pressure-Safeguard with Informal Calibration Change  
  - **Incident:** Safeguard calibrated to higher tolerance (informal approval), causing slow leak.  
  - **Procedure Walkthrough:**  
    1. Harm confirmed (leak).  
    2. Omission: Failed to maintain original threshold.  
    3. Baseline: Design docs require original threshold → **YES** (docs not updated).  
    4. Override: Informal approval ≠ documented override → **NO**.  
    5. Type: Maintain static safeguard → **Type-II**.  
    6B. Counterfactual: If original threshold maintained, would leak have been blocked? → **YES** (leak occurred above original threshold).  
  - **Classification:** **List as Cause** (triggers redesign).  
  - **Why Auditor Dislikes This:**  
    - Procedure ignores informal management approval (not a valid override per Question 4).  
    - Forces listing as cause despite "real-world" intent to change baseline.  
  - **Hand-off Point:**  
    - Question 3 (Baseline): Conflict between design docs and informal approval.  
    - **Must escalate:** Legal/engineering must decide if informal approvals override baselines (value-laden policy call).  
  - **Evidence Gap:** No documentation of tolerance change.  

  ---

  ### Summary of Critical Judgments  
  - **Non-Negotiable:**  
    - Overrides require **documentation** (Case 2).  
    - Baselines are **textual, not contextual** (Case 3).  
  - **Hand-off Triggers:**  
    - Baseline ambiguity (Case 3).  
    - Counterfactual uncertainty (e.g., probabilistic outcomes).  
  - **Misfire Risks:**  
    - False positives if overrides undocumented (Case 3).  
    - False negatives if baselines are implicit.  
  - **Team Action:** Auditors follow steps; hand-offs go to legal/engineering leads.  

  **Final Output:** Actionable, philosophy-free, and regulator-ready.
