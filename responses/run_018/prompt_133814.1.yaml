   1. Relevance relative to a design/normative baseline.
   2. Counterfactual necessity: if the expected action had occurred, the harm would have been prevented (with two types: Type-I for interrupting an active chain, Type-II for maintaining a static safeguard).
   3. Operational-override check: if the baseline was suspended by a documented protocol, maintenance, or reassignment, then the omission is not a cause.

   We structure the procedure as a flowchart of questions. We also note:
   - Stopping rules: when to stop and not list as a cause.
   - Hand-off points: where the decision depends on non-factual matters (like liability allocation) and must be escalated.
   - Flags for potential misfires.

   The procedure:

   1. **Question 1: Was there a harmful incident?**
      - If no, stop: no report needed.
      - If yes, proceed.

   2. **Question 2: Did the incident involve an omission (i.e., a failure to act) by one or more system components?**
      - If no, then the cause is a positive action (not covered here) — stop for this procedure (but note, the report may still be filed with other causes).
      - If yes, proceed for each identified omission.

   3. **Question 3: Was there a design or normative baseline (documented in the system specifications, protocols, or regulatory standards) that expected the component to act?**
      - *Evidence required*: System design documents, operational protocols, regulatory requirements.
      - If no, then the omission is not a cause (it is a non-event) — **stop and do not list as a cause**.
      - If yes, proceed.

   4. **Question 4: At the time of the incident, was the design baseline overridden by a documented operational override?**
      - *Operational override*: This includes a documented protocol update (with version control and distribution), a maintenance window (as per maintenance logs), or a formal reassignment order (with proper authorization and records).
      - *Evidence required*: Maintenance logs, change management records, reassignment orders.
      - If yes, then the omission is **not a cause** (it becomes a non-event) — **stop and do not list as a cause**.
      - If no, proceed.

   5. **Question 5: What type of omission is it?**
      - *Type-I*: The component was expected to interrupt an active causal chain (e.g., shut a valve to stop a flow).
      - *Type-II*: The component was expected to maintain a static safeguard (e.g., sustain a pressure threshold).
      - *Evidence required*: Design documents and the role of the component.
      - Proceed to the appropriate counterfactual test.

   6. **Question 6 (for Type-I): If the component had acted as expected, would it have interrupted the causal chain leading to the harm?**
      - *Counterfactual test*: Holding all else fixed (i.e., the state of the system at the time the action was expected), would the expected action have broken the chain?
      - *Evidence required*: Engineering analysis, simulation, or known causal relationships (e.g., if the valve had shut, would it have stopped the flow?).
      - If no, then the omission is **not a cause** — **stop and do not list as a cause**.
      - If yes, then the omission is a cause — **list as cause**.

   7. **Question 6 (for Type-II): If the component had maintained the safeguard as expected, would the harm have been prevented?**
      - *Counterfactual test*: Holding all else fixed, would the presence of the safeguard (at the expected level) have blocked the pathway to harm?
