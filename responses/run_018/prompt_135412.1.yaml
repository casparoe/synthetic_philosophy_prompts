answer: |-
  Your intuition about the structural parallel between the Frege-Geach problem and LLM behavior is astute. The intractability stems from a **substantive disagreement masked by shared semantic vocabulary, rooted in fundamentally different conceptions of moral judgment and the nature of linguistic commitment.** Here’s a disciplined diagnosis:

  ### Core of the Intractability
  1.  **Divergent Starting Points & Explanatory Goals:**
      *   **Expressivists** (e.g., Ayer, Stevenson, Blackburn, Gibbard) start with the *function* of moral language: expressing non-cognitive, conative attitudes (approval, disapproval, plans, commitments). Their primary goal is to explain moral motivation, disagreement, and the "action-guiding" force of moral claims *without* positing objective moral properties.
      *   **Descriptivists/Cognitivists** (e.g., realists, error-theorists) start with the *content* of moral language: moral claims purport to describe states of affairs, making truth-apt assertions. Their primary goal is to account for logical form, truth conditions, and the representational nature of language.

  2.  **The Embedding Challenge Exposes the Chasm:**
      *   Expressivists analyze the meaning of a *freestanding* moral claim (e.g., "Lying is wrong") as the expression of an attitude (e.g., disapproval of lying). This works locally.
      *   **The Problem:** In embeddings (e.g., "If lying is wrong, then getting little brother to lie is wrong"), "lying is wrong" appears in an unasserted context (the antecedent). It doesn't directly express the speaker's disapproval. Yet, the conditional clearly has logical force – denying the conclusion while accepting the antecedent and conditional seems inconsistent.
      *   **Descriptivist Solution (Apparent):** Treat "lying is wrong" as having stable, propositional content (truth-conditions) *everywhere* it appears. Validity follows standard logic.
      *   **Expressivist Dilemma:** If they concede stable propositional content, they abandon their core thesis (moral claims aren't fundamentally descriptive). If they deny it, they struggle to explain the validity of inferences involving embeddings.

  3.  **"Shared" Vocabulary Masks Deep Differences:**
      Both sides talk about "meaning," "content," "validity," and "propositions." But these terms are **theory-laden**:
      *   For descriptivists, "proposition" = truth-condition bearer.
      *   Expressivists (especially quasi-realists like Blackburn) offer a *functionalist* reinterpretation: a "moral proposition" is whatever plays the *logical role* of a proposition within a system of attitudes and commitments. "Truth" for moral claims is understood as *correctness of the attitude* within the relevant framework (e.g., "Lying is wrong" is "true" iff disapproval of lying is correct/called for).
      *   **The Masked Disagreement:** Descriptivists see this as a covert capitulation to descriptivism ("You're just doing realist semantics in fancy dress!"). Expressivists see it as a robust alternative grounded in attitudes ("We've explained the *logic* without the *metaphysics*!").

  4.  **The Battleground: Compositionality & Logic:**
      *   **Descriptivist Charge:** Logic *requires* compositional semantics where subsentential parts contribute stable, propositional content. Expressivism, by tying meaning fundamentally to speech acts (expression of attitude) for atomic sentences, cannot provide this for embeddings without collapsing into descriptivism.
      *   **Expressivist Replies & the Quasi-Realist Gambit:**
          *   **Higher-Order Attitudes (Blackburn):** "If lying is wrong, then getting little brother to lie is wrong" expresses a *higher-order attitude*: disapproval of *combining* disapproval of lying with *lack* of disapproval of getting little brother to lie. Validity is explained by the inconsistency of certain combinations of attitudes.
          *   **Norm-Expressivism (Gibbard):** Moral claims express acceptance of norms. Embeddings involve complex relations between norms. "If P, then Q" expresses a norm connecting the norm for P to the norm for Q. Logic reflects constraints on rational planning/norm-acceptance.
          *   **Hybrid Expressivism (Ridge, Schroeder):** Moral sentences have *both* descriptive content (e.g., "lying has property F") *and* express an attitude (e.g., "Boo to F-things!"). Embedding might involve just the descriptive component. Critics argue this either reintroduces descriptivism or creates a "new" Frege-Geach problem for the attitude component.

  ### What's Settled vs. Contested
  *   **Settled:**
      *   Expressivism *must* provide a compositional semantics for embedded contexts.
      *   Any adequate semantic theory must account for the logical validity of moral arguments.
      *   Simple, early forms of expressivism (e.g., pure "Boo/Hurrah") fail the embedding test.
  *   **Genuinely Contested:**
      *   **Does Quasi-Realism Dissolve the Problem?** Critics (e.g., Dreier, van Roojen) argue quasi-realist "propositions" and "truth" are merely semantic placeholders lacking the explanatory power of genuine truth-conditions. Proponents (Blackburn, Gibbard) argue they provide a complete, non-descriptive explanation of moral logic and discourse. **No consensus.**
      *   **Do Hybrid Accounts Avoid It?** Critics argue hybrids either make the attitude component inert in logic (failing expressivism) or face a "new" embedding problem for the attitude expression itself. Proponents argue they successfully bifurcate content. **No consensus.**
      *   **Is the Problem Fundamentally Semantic or Psychological?** Expressivists often ground logic in norms of attitude consistency/rationality. Descriptivists see logic as fundamentally about truth-preservation. **Core disagreement.**

  ### What Would Count as Progress?
  True progress likely requires moving beyond the current dialectic stalemate:

  1.  **Conceptual Distinction/Reframing:** A breakthrough that reconceives the relationship between linguistic function, logical form, and psychological state. Perhaps distinguishing *levels* of meaning (e.g., dynamic semantics tracking information *and* commitment update) or reframing "proposition" in a way genuinely neutral between cognitive and conative commitments. This could reveal the original problem as ill-posed by showing both sides mischaracterize the phenomena.
  2.  **Empirical Findings on Moral Cognition & Embedding:** Evidence showing how humans *actually* process the meaning and logical force of embedded moral claims. Do competent speakers treat "If lying is wrong..." as primarily involving attitude combinations (supporting expressivism) or truth-conditional evaluation (supporting descriptivism)? Or is it something else? This could constrain or refute philosophical theories. (However, empirical data alone rarely settle normative semantic questions).
  3.  **Formal Result (Less Likely Solo Solution):** While sophisticated formal systems exist (e.g., Gibbard's hyperplans, dynamic semantics for expressivism), they haven't ended the debate. A result showing that *only* a descriptivist (or *only* an expressivist) semantics can satisfy universally accepted constraints on compositionality and logic *might* force consensus, but such universal constraints are precisely what's contested.

  ### LLMs: Illumination or Red Herring?
  LLM behavior **illuminates the core tension but doesn't resolve it:**

  1.  **Illumination:** LLMs demonstrate the *ease* with which compositional, descriptivist-like semantics can be applied to moral language at scale. They generate seemingly valid inferences involving embeddings by treating moral clauses as stable propositional components. This mirrors the descriptivist "solution." However, the **lack of attitudinal coherence** in outputs – generating "valid" inferences without stable underlying commitments, plans, or genuine disapproval – highlights the expressivist's core concern: that purely descriptivist *form* can be hollowed of the motivational and normative *force* that defines moral judgment for expressivists. LLMs embody the *syntactic* success of descriptivism while starkly revealing its potential *semantic/functional* deficit from an expressivist perspective.
  2.  **Not a Red Herring (But Not a Solution):** It's not merely replicating ambiguity. It provides a concrete, observable instance of the *consequences* of prioritizing compositional transparency over attitudinal grounding. It shows how a system can master the *logic* of moral discourse while potentially lacking the *essence* (according to expressivism) of what makes it moral. This validates the expressivist worry that solving Frege-Geach technically isn't sufficient to capture moral judgment.
  3.  **The Philosophical Question Remains:** Does the LLM's success in handling embeddings *via* descriptivist-like compositionality show that expressivism is unnecessary for explaining moral *language* (even if it explains moral *psychology*)? Or does the lack of attitudinal coherence prove that such compositionality, divorced from genuine non-cognitive states, fails to capture the *actual meaning* of moral claims? **The LLM starkly presents the choice expressivism forces: accept their complex semantics of attitudes to preserve the "moral" in moral judgment, or accept descriptivist semantics but potentially lose the essential connection to motivation and commitment.** The LLM, lacking genuine attitudes, defaults to the latter path efficiently, illuminating the expressivist's fundamental concern.

  In conclusion, the intractability arises because expressivists and descriptivists are engaged in fundamentally different explanatory projects using superficially similar semantic tools. Progress requires either a conceptual leap reframing the debate, empirical evidence constraining the psychology of moral reasoning, or a demonstration that one approach inherently fails a non-question-begging constraint. LLMs vividly illustrate the descriptivist path's technical efficacy and its potential expressive hollowness, making the expressivist's core challenge impossible to ignore, even if it doesn't dictate the answer.
