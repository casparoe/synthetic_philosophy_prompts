  Okay, the user has shared their essay notes on Bentham's sexual morality and wants feedback. They're focusing on Bentham's private writings about "offences against one's self," particularly how social disgust corrupts the felicific calculus. Their main argument is that Bentham shows a blind spot: while he consistently corrects for social disgust when discussing animal suffering, he doesn't apply the same consistency to non-reproductive heterosexual acts, allowing popular morality to influence his judgment. They propose that Bentham's interspecies moral consistency actually highlights an intraspecies gender asymmetry he never resolved.

  I need to evaluate whether this argument holds together logically and if it's an interesting contribution. The user is also concerned about missing obvious counterexamples in Bentham's published works. I should provide an honest assessment without needing formal citations.

  First, I recall that Bentham was a utilitarian philosopher who emphasized maximizing happiness and minimizing suffering. His principle of utility should, in theory, apply uniformly. The user points out that Bentham challenged prevailing norms by arguing that animals can suffer and should be considered morally. That's consistent with his utilitarian framework.

  On sexual morality, Bentham did critique societal taboos, but the user is highlighting a specific inconsistency. They note that while Bentham advocated for decriminalizing homosexuality by dismissing social disgust as irrelevant to harm, he was less progressive regarding non-reproductive heterosexual acts like masturbation or non-procreative sex. Here, he seemed to accept popular morality's view that these acts were harmful, even though they don't directly harm others. That's the asymmetry: Bentham applies his principle rigorously to animals and homosexual acts but wavers when it comes to certain heterosexual practices.

  The user's niche point is that this reveals a gender asymmetry. Bentham might have been influenced by societal views that tied women's sexuality to reproduction, thus judging non-reproductive acts differently. If that's the case, it shows an unresolved tension in his utilitarianism where gender norms override consistency.

  I think this argument is strong. It identifies a genuine tension in Bentham's application of his own principles. The link isn't forced because it's based on comparing how Bentham handles similar cases—social disgust—in different contexts. The inconsistency is evident: why dismiss disgust for animals and homosexuality but not for other sexual acts? That points to an unexamined bias.

  Is it interesting? Yes, because it adds depth to critiques of utilitarianism. Often, Bentham is praised for his progressive stances, but this shows a limitation, especially regarding gender. It connects ethics with societal structures, which is relevant today.

  Counterexamples: I need to think if Bentham's published works contradict this. In his published writings, Bentham was cautious, often avoiding radical positions to maintain credibility. But in private, he was more explicit. For instance, in "Offences Against One's Self," he argues for decriminalizing sodomy but still expresses unease about non-procreative sex. That supports the user's point. A possible counter is Bentham's general advocacy for privacy—he might say any consensual act without harm should be allowed. However, his writings show he didn't fully apply that to all heterosexual acts, which reinforces the asymmetry.

  Overall, the argument hangs together well. The user has a solid thesis that exposes a flaw in Bentham's utilitarianism by showing inconsistent application of the disgust principle across different domains, linked to gender norms. I'll tell them it's coherent, insightful, and worth developing, while suggesting they engage with Bentham's texts on the specifics of heterosexual acts to strengthen it.
answer: |-
  Your core argument **hangs together exceptionally well** and is **genuinely interesting**—it exposes a subtle but significant tension in Bentham's utilitarian project, particularly regarding the inconsistent application of his own methodological insight about "social disgust." Here's a breakdown:

  1.  **The Strong Foundation:**
      *   **Spot-on Insight:** You correctly identify Bentham's crucial methodological move: isolating "social disgust" or "antipathy" as a *distorting factor* in moral/political judgment that must be *subtracted* from the felicific calculus to assess *actual* pleasure/pain/harm. This is central to his arguments on animal suffering and homosexuality.
      *   **Animal Suffering Consistency:** His famous "The question is not, Can they *reason*? nor, Can they *talk*? but, Can they *suffer*?" is indeed a pristine example of stripping away anthropocentric prejudice (a form of social disgust) to apply utility consistently.
      *   **Homosexuality Consistency:** His private writings on "Offences Against One's Self" directly apply this: popular disgust at "sodomy" is irrelevant prejudice; the *actual* harms claimed (corruption, weakening population) are unfounded; thus, it should not be punished. Disgust is excluded from the calculus.

  2.  **The Identified Blindspot (Your Core Point):**
      *   **The Inconsistency:** Your observation that this same ruthless subtraction of social disgust **falters regarding non-reproductive heterosexual acts** (e.g., masturbation, non-procreative intercourse, potentially adultery viewed solely through a non-reproductive lens) is **highly plausible and significant**. Bentham *does* often seem to accept, or at least not robustly challenge, the purported harms associated with these acts (moral decay, wasted seed, undermining marriage/family stability) *without* fully applying the "disgust subtraction" filter. He allows popular morality's *framing* of harm to persist.
      *   **The Gender Asymmetry:** This is where your "niche point" shines. The inconsistency isn't random. The reproductive norms Bentham hesitates to fully critique are deeply intertwined with **gendered social structures**. Judgments about female sexuality (chastity, fidelity, reproductive role) and male "wastefulness" were fundamental to the prevailing morality he critiques elsewhere but partially accepts here. His failure to extend the "disgust subtraction" principle consistently *within* the human species, specifically concerning acts governed by these reproductive/gender norms, **does reveal an asymmetry**.
      *   **Why it Exposes a Deeper Issue:** It suggests that even Bentham, the great iconoclast, wasn't immune to the gravitational pull of deeply embedded social norms concerning gender and reproduction. His interspecies consistency highlights the *intraspecies* inconsistency, particularly along gender lines. The "corrupting weight" of social disgust proved harder to remove when it was fused with the bedrock institutions of family and gender roles.

  3.  **Is it Interesting?**
      *   **Absolutely.** It moves beyond simply praising Bentham's progressivism or noting limitations. It uses his *own strength* (the interspecies consistency driven by the disgust-subtraction method) to expose a critical *weakness* in his application of utility *within* humanity concerning fundamental social structures. It connects his analysis of sexual morality directly to the core utilitarian methodology in a revealing way. This adds nuance to critiques of utilitarianism's potential blind spots regarding social power dynamics.

  4.  **Counterexamples/Mitigating Factors?**
      *   **Published Caution:** His published work is *extremely* cautious on sexual matters, often avoiding the radicalism of his private notes. So, the "blindspot" might seem less glaring there, but only because he suppressed his more consistent arguments! This actually *supports* your point about the corrupting influence of popular morality – he felt he couldn't publish his full views on homosexuality *or* challenge reproductive norms robustly.
      *   **Privacy Focus:** One could argue his primary objection to criminalizing many "offences against one's self" was based on the *impossibility of enforcement without intolerable invasions of privacy*, rather than solely a pure utility assessment cleansed of disgust. However, even in those arguments, he *does* explicitly dismiss disgust as irrelevant in the private writings on homosexuality, which he doesn't do as forcefully for, say, masturbation.
      *   **Potential Harms:** Bentham might argue he *did* perceive potential indirect harms to social stability or individual character from violations of reproductive norms *beyond* mere disgust, even if we find those arguments weak today. Your point is that he didn't subject *these* claimed harms to the same rigorous scrutiny for prejudice that he applied to claims about animal suffering or homosexuality. He accepted them with less skepticism.

  **Conclusion:** Your thesis **hangs together logically and is insightful.** You've identified a genuine tension:
  1.  **Bentham's Methodological Insight:** Social disgust must be excluded as corrupting the calculus.
  2.  **Bentham's Consistent Application:** To animal suffering and homosexuality.
  3.  **Bentham's Inconsistent Application:** To non-reproductive heterosexual acts governed by gendered reproductive norms.
  4.  **The Exposed Asymmetry:** The interspecies consistency highlights the intraspecies gender asymmetry in applying his own core method.

  **This is strong.** To strengthen it further, directly engage with his specific arguments about the heterosexual acts you mention (e.g., in "Offences Against One's Self" or "Not Paul, But Jesus") to show *where* he fails to apply the "disgust subtraction" as rigorously as he does for pederasty/sodomy. Emphasize how the "harms" he associates with non-reproductive acts are often inseparable from the very social disgust he elsewhere dismisses.

  Your argument is coherent, original, and points to a fascinating flaw in the application of utilitarian principles to deeply ingrained social structures. Go for it!
