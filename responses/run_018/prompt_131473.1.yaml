  Hmm, the user clearly wants concrete questions that force underlying commitments to surface. They’re tired of abstract labeling wars. The taxonomy must avoid jargon and use the "cultural heritage vs. human death" case as the root. Key branches: ontological vs. epistemic incommensurability, moral residue, and rational regret. 

  First, I need to ensure every question is answerable without theory knowledge. For example, "Is there *any possible* common metric?" traps ontological commitments. If someone says no, they’re in the ontological branch. Then, "After choosing, does the unchosen loss still morally haunt?" probes moral residue. 

  The regret question is trickier. "Can you coherently think ‘I chose rightly but the other option was better’?" tests if regret is rational or just psychological. Positions like strong pluralism will say yes, pragmatic comparativism will call it incoherent. 

  I’m flagging unoccupied nodes. For instance, "ontological + no residue + regret appropriate" has no takers—denying residue while admitting regret is contradictory. That gap is logical, not just unexplored. 

  Noting settled vs. contested: Specialists agree incommensurability exists, but clash on whether it’s ontological or epistemic. Moral residue is hotly debated—some tie it to pluralism, others say even monists can have it. 

  User’s deeper need: cutting through seminar posturing. The tree forces honesty by anchoring to a concrete case. They’ll expose if someone’s "pluralism" is just lip service when they deny regret or residue. 

  ... Time to structure this tightly. Root case first, then three binary branches. Leaf positions get one-sentence "awkward commitments" (e.g., strong pluralism’s burden of eternal justification). Diagnostic gaps matter—pointing out why some combos are empty keeps it honest.
answer: |-
  Here is a decision tree taxonomy derived from concrete commitments about the specific tragic choice (destroy irreplaceable communal cultural heritage vs. allow preventable human death), designed to reveal underlying philosophical positions regardless of self-labeling. Positions are diagnosed solely by answers to the branch questions about the case's structure and aftermath.

  **Root Case:** You *must* choose: Destroy unique, irreplaceable communal cultural heritage OR allow a preventable human death. Both losses are profound, qualitatively distinct, and resist translation into a shared scale of value (e.g., dollars, utils, abstract "goodness points").

  **Branch 1: The Nature of Incommensurability**
  *   **Q1: Is there *any possible* fact of the matter about which option is "better overall" or "worse overall" in this specific choice, even in principle?**
      *   *A1 (NO - Ontological Incommensurability):* No. There is no single, authoritative "better/worse" fact of the matter applicable to this choice. The values are structurally incomparable. → Proceed to Branch 2A.
      *   *A1 (YES - Epistemic Incommensurability):* Yes, but we can *never know* what that fact is or access the metric needed to compare them meaningfully. → Proceed to Branch 2B.

  **Branch 2A (Ontological Path): Moral Residue?**
  *   **Q2A: After making the best choice possible (e.g., saving the life, destroying the heritage), does the agent *necessarily* incur lingering moral obligations (e.g., reparations, ritual mourning, profound guilt) or burdens specifically *because* of the unchosen, irreplaceable loss, regardless of justification?**
      *   *A2A (YES - Residue Present):* Yes. Choosing rightly doesn't erase the distinct wrong of the unchosen loss. Obligation/burden persists. → Proceed to Branch 3A.
      *   *A2A (NO - No Residue):* No. Once the best available choice is made with due deliberation, the matter is morally closed. Sadness, yes, but no lingering *moral* obligation or burden tied to the unchosen loss itself. → Proceed to Branch 3B.

  **Branch 2B (Epistemic Path): Moral Residue?**
  *   **Q2B: After making the choice believed best (given the inaccessibility of the true metric), does the agent *necessarily* incur lingering moral obligations or burdens specifically *because* they might have chosen the truly worse option, even acting rationally?**
      *   *A2B (YES - Residue Present):* Yes. The permanent epistemic gap means choosing might *be* wrong, generating obligation/burden (e.g., hyper-vigilance, symbolic atonement). → Proceed to Branch 3C.
      *   *A2B (NO - No Residue):* No. The agent rationally chose based on the best available grounds. The permanent epistemic gap doesn't impose distinct obligations/burdens beyond those of any difficult choice under uncertainty. → Proceed to Branch 3D.

  **Branch 3A (Ontological + Residue): Rational Regret?**
  *   **Q3A: After choosing (e.g., saving the life), is it *rationally coherent* for the agent to sincerely judge "I made the best choice possible, *and yet* the unchosen option (preserving the heritage) was genuinely better in its own way, and its loss is a distinct, enduring moral wrong"?**
      *   *A3A (YES - Regret Appropriate):* Yes. This captures the tragic reality: justified choice doesn't eliminate the objective value/wrongness of the unchosen loss. → **Position: Strong Value Pluralism (e.g., Berlin, Williams, Nussbaum).** *Awkward Commitment:* Must defend that rational action and deep moral failure/phenomenological burden can permanently coexist despite best efforts.
      *   *A3A (NO - Regret Incoherent/Mere Psychology):* No. If they made the best choice, judging the unchosen as "genuinely better" contradicts the "best choice" claim. Feeling bad is only understandable psychology. → **Position: (Unnamed - Pluralism with Closure).** *Awkward Commitment:* Must explain the *moral* (not just psychological) weight of residue without allowing regret to imply the choice wasn't best.

  **Branch 3B (Ontological + No Residue): Rational Regret?**
  *   **Q3B: After choosing the best option (e.g., saving the life), is it rationally coherent to judge "I chose rightly, but the unchosen option was genuinely better"?**
      *   *A3B (YES - Regret Appropriate):* **UNOCCUPIED NODE (Logical Incoherence Gap).** *Diagnosis:* Cannot coherently claim there's *no* overall better/worse fact *and* claim one unchosen option is "genuinely better" *and* deny residue from choosing against it. Denying residue while affirming regret directly contradicts the core ontological claim.
      *   *A3B (NO - Regret Incoherent/Mere Psychology):* No. The best choice was made; the unchosen loss is tragic but not a source of rational regret or ongoing obligation. → **Position: Resolute Monism / Comparativism (e.g., early Hare, some Utilitarians).** *Awkward Commitment:* Must explain the apparent incommensurability as ultimately illusory or reducible, despite phenomenology, often by positing a hidden commensurating standard (contradicting ontological claim?) or radically downplaying the distinct loss.

  **Branch 3C (Epistemic + Residue): Rational Regret?**
  *   **Q3C: After choosing (e.g., saving the life), is it rationally coherent to judge "I made the most rational choice given the evidence, *and yet* I may have chosen the truly worse option, and this possibility imposes distinct moral burdens"?**
      *   *A3C (YES - Regret Appropriate):* Yes. The permanent epistemic gap means regret over potentially choosing wrongly is rational and burdensome. → **Position: (Unnamed - Deep Epistemic Tragedy).** *Awkward Commitment:* Must justify the *necessity* of residue despite rational choice, without collapsing into ontological pluralism (since a true comparison exists).
      *   *A3C (NO - Regret Incoherent/Mere Psychology):* No. Regret implies believing one chose wrongly, but the agent acted rationally on the best available grounds. Burden is psychological, not rational/moral residue. → **Position: (Unnamed - Epistemic Residue without Regret).** *Awkward Commitment:* Must distinguish a unique *moral* residue arising purely from epistemic failure from both rational regret *and* mere psychological distress.

  **Branch 3D (Epistemic + No Residue): Rational Regret?**
  *   **Q3D: After making the rationally best choice (e.g., saving the life), is it rationally coherent to judge "I chose as best I could, but the unchosen option might have been truly better"?**
      *   *A3D (YES - Regret Appropriate):* **UNOCCUPIED NODE (Practical Unattractiveness Gap).** *Diagnosis:* Logically possible but deeply unstable. Affirms a hidden truth creating rational regret, yet denies any residue (obligation/burden) flows from this profound risk of fundamental error. Denies the stakes implied by its own premises. Little theoretical motivation.
      *   *A3D (NO - Regret Incoherent/Mere Psychology):* No. Rational choice under radical uncertainty discharges obligation. Any lingering doubt is non-rational. → **Position: Pragmatic Comparativism / Decision-Theoretic (e.g., Levi, some Bayesians).** *Awkward Commitment:* Must explain the "hardness" of the choice as solely a function of epistemic limitation and psychological aversion to uncertainty, not a deep feature of value itself.

  ---

  **Settled vs. Contested in Value Theory:**

  *   **Broadly Settled:**
      *   The *existence* of experiences fitting the "tragic choice" phenomenology (hard choices between distinct, significant values) is undeniable.
      *   Simple maximizing models (classic utilitarianism, some cost-benefit) struggle to capture these choices without significant modification or ignoring key features.
      *   Choices involving fundamental moral norms (like saving life vs. preserving deep culture) are paradigmatic candidates for generating hard cases.
      *   Regret and psychological distress commonly follow hard choices.

  *   **Genuinely Contested Among Specialists:**
      *   **Ontological vs. Epistemic Incommensurability:** Is the inability to compare fundamental (e.g., Raz, Chang vs. Broome, Regan)? This is the core divide.
      *   **Moral Residue:** Does making the *best* (or best-justified) choice in a tragic dilemma leave distinct *moral* obligations or burdens (Williams' "agent-regret," "dirty hands") or only psychological distress (Stocker, Nussbaum vs. McConnell, some consequentialists)? Is residue tied to ontology or possible under epistemic views?
      *   **Rationality of Regret:** Is regret *about the loss of the unchosen value itself* (not just about the situation) rational *after* a justified choice (Pluralists) or inherently contradictory (Comparativists)? Can regret be a rational response to epistemic failure?
      *   **The Scope of Pluralism:** Are *all* values commensurable in principle? Pluralists disagree on how many truly fundamental, incommensurable values exist.
      *   **The Role of Will/Commitment:** Can agents "create" reasons or resolve incommensurability through choice or commitment (Sartre, resolute choice models - Ullmann-Margalit, vs. Raz)?

  **Crucially:** There is **no consensus** on whether moral residue *requires* ontological pluralism. Some epistemic views accept residue (due to the risk of being wrong), and some pluralist views downplay residue. The taxonomy above reflects *common* associations revealed by commitments in this specific case, not settled doctrine. The debate hinges precisely on how answers to Q1, Q2A/Q2B, and Q3A-Q3D cohere. This tree forces those commitments into the open.
