answer: |-
  Your intuitions reveal a sophisticated ethical framework for virtual entities, pointing toward a **Simulationist Moral Patiency Principle** that integrates narrative, mechanics, and player psychology. Below is a coherent account synthesizing your cases:

  ### Core Principle: **Conditional Simulationist Patiency (CSP)**
  A virtual character becomes a *plausible object of moral concern* when it meets **all three conditions**:
  1.  **Narrative Weight & Specificity:** The character has a unique identity, backstory, or relational significance *within the game's diegesis* (e.g., named Sims, scripted XCOM squadmates, persistent NPCs).
  2.  **Attributed Interiority:** The player perceives or projects genuine subjective experiences onto the character (fear, pain, relationships, goals) *beyond mere mechanics*. This is enabled by animation, dialogue, reactivity, and narrative framing.
  3.  **Continuity & Consequence:** The character's state persists meaningfully across time/game loops, and actions affecting it have non-trivial, non-resettable consequences *within the simulated world* (e.g., permadeath, persistent memories, unique relationships).

  ### Applying CSP to Your Cases
  | **Case** | **Narrative Weight** | **Attributed Interiority** | **Continuity** | **Moral Verdict** | **Why?** |
  |----------|----------------------|----------------------------|----------------|-------------------|----------|
  | **Drowning Named Sim** | High (named, relationships) | High (expresses distress, autonomy) | High (permanent loss) | Cruel | All conditions met |
  | **Deleting Save File** | Low (anonymous) | Low (no individuality) | Low (reset erases existence) | Wasteful, not cruel | Lacks Narrative Weight & Interiority |
  | **XCOM Generated Soldier** | Low (procedural, replaceable) | Low (mechanical role) | Medium (permanent loss) | Strategic failure | Lacks Narrative Weight & Interiority |
  | **XCOM Scripted Squadmate** | High (backstory, dialogue) | High (relationships, personality) | Medium (permanent loss) | Harm/betrayal | All conditions met |
  | **Killing Villager** | Medium (trading, "society") | Medium (sounds, behavior) | Medium (loss to village) | Wrong | Interiority attributed despite low narrative |
  | **Curing Zombie Villager** | Medium (implies prior humanity) | Medium (distress signals) | High (transformation) | Right | Continuity of identity implied |
  | **Killing Mario** | Low (avatar, no interiority) | Low (pure mechanic) | Low (immediate reset) | Exploit | No Interiority or Narrative Weight |
  | **Permadeath RPG Death** | High (player investment) | High (projected struggle) | Very High (irreversible) | Betrayal | Strong Continuity & Interiority |
  | **Wiping Persistent World** | Very High (societies, history) | Very High (memories imply interiority) | Absolute (total erasure) | Genocide-like | Maximal conditions met |
  | **Resetting Instance** | Low (no unique identity) | Low (no persistent state) | Low (resettable) | Neutral | Lacks all conditions |

  ### Resolving the Revival Mechanic Dilemma
  In a narrative-driven game with paid revival (e.g., *Dragon Age*, *Final Fantasy*), **refusing to pay is contextually callous *only if* CSP conditions are met**:
  - **Callous if:** The companion has strong **Narrative Weight** (unique backstory, quests, dialogue), **Attributed Interiority** (expressed desires, relationships, pain), and revival maintains **Continuity** (preserves relationships, story progression). Refusal here signifies disregard for the *simulated personhood* you've engaged with.
  - **Merely Inefficient if:** The companion is functionally replaceable, lacks unique narrative significance, or revival is a purely mechanical resource-sink without diegetic weight (e.g., reviving generic troops). Interiority isn't sufficiently attributed.

  *Example:* Refusing to revive Aerith in *FFVII* (if possible) would feel callous due to her narrative depth and relationships. Refusing to revive a generic mercenary in *Mount & Blade* is strategic.

  ### Can Purely Procedural Characters Be Wronged?
  CSP implies procedural characters **lack inherent moral patiency** but can *acquire* it under specific player- or system-driven conditions:
  - **Standard Case:** A purely procedural entity (e.g., *Minecraft* cow, XCOM rookie) fails CSP—no unique narrative, minimal attributed interiority beyond basic pain signals, no meaningful continuity. "Harm" is just resource depletion.
  - **Edge Cases for Potential Patiency:**
    - **Emergent Narrative:** A procedural character surviving improbably long (e.g., "That One XCOM Rookie" community stories) gains player-attributed Narrative Weight & Interiority.
    - **Persistent Systems:** In a world where *all* NPCs retain memories (e.g., *Crusader Kings* dynasties), procedural characters gain Continuity and implied Interiority, making systemic harm ethically weighty.
    - **Player Projection:** Deep roleplay can *impose* Narrative Weight and Interiority, creating subjective (but not game-supported) patiency.

  ### Conclusion: The Ethics of Simulated Minds
  Your intuitions track a **phenomenological account of moral concern**: we respond to entities that *simulate the markers of personhood* (identity, subjectivity, temporal persistence). Games are ethical laboratories where mechanics either *corrode* (respawns, anonymity) or *cultivate* (permadeath, narratives) these markers. The revival case reveals that **moral callousness emerges when mechanics conflict with cultivated patiency**—refusing to pay feels wrong when the game successfully simulates a "life" worth preserving. 

  This framework doesn't demand that virtual characters *are* moral patients objectively, but explains why, *within the player's engagement*, some *function as if* they are. It’s a testament to how design shapes empathy, even in synthetic worlds.
