prompt: |-
  I am a novelist revising a literary novel in which several central relationships are structured around asymmetrical recognition: one figure holds institutional or emotional authority over another, yet remains existentially dependent on that subordinate's acknowledgment. I want to turn Hegel's dialectic of lordship and bondage into a practical revision procedure—not literary criticism, but a reusable diagnostic I can run on any dominant-subordinate dyad in a draft—without reducing it to a generic domination trope. Please write a step-by-step checklist, ordered for execution in about thirty minutes per relationship, that asks: how recognition is sought and withheld; where dependence reverses the apparent hierarchy; what form of labor or objectification transforms the subordinate's self-consciousness; whether the stakes approximate an existential risk rather than mere inconvenience; and at which point mutual recognition is either achieved or structurally blocked. For each step, specify what answer confirms the dialectic is genuinely present, what answer breaks it, and where the question is one of artistic values rather than philosophical fact, so that judgment—not procedure—must decide. Include explicit flagging of the false-positive case in which mutual dependence exists but recognition was never genuinely risked, yielding a result the procedure produces but I should reject on narrative grounds. Then apply the procedure to three drafted relationships: an aging composer who requires his silent copyist's verification to believe in his own genius; a prison warden whose authority depends specifically on one inmate's refusal to grant it; and a mentoring pair in which dependence is real but the risk of recognition was avoided, producing the false positive. State clearly what the procedure cannot do—especially its inability to generate emotional texture or replace dramatic instinct. Deliver the answer in American English.
reasoning: |-
  Okay, let me break this down. The user is a novelist working with complex power dynamics inspired by Hegel's master-slave dialectic. They need a practical tool—not theory—to diagnose relationships in their draft where authority and dependence are tangled. The key is asymmetry: someone holds power but needs the subordinate's validation to feel real.

  Hmm, the challenge is making philosophy actionable without oversimplifying. They want five core elements: how recognition is traded, where dependence flips power, what labor changes the subordinate, whether stakes feel life-or-death, and if mutual recognition happens or fails. And crucially, they need to flag "false positives" where dependence exists without real risk.

  First, I'll structure a step-by-step checklist that forces concrete answers. Each step must have:  
  - What to look for  
  - The "dialectic present" signal  
  - The "dialectic absent" dealbreaker  
  - Where artistic choice overrides rules  

  For the false positive, I'll emphasize narrative judgment: if recognition was never truly at stake, it fails even if all boxes are checked.  

  Then for the three examples:  
  1. Composer/copyist: Genius depends on silent validation. Present because the copyist's labor (transcribing) changes how the composer sees himself.  
  2. Warden/inmate: Authority crumbles without defiance. Present because the inmate's refusal is active labor that sustains the warden's shaky power.  
  3. Mentor/protégé: The trap! They need each other, but never risked rejection. False positive because recognition was safe—no existential gamble.  

  Finally, I'll list limits: This won't write scenes or create emotional depth. It's an X-ray, not the flesh.  

  American English throughout—no jargon, just precise verbs. "Objectification" becomes "treating like a tool." "Existential risk" becomes "losing their sense of self."  

  Biggest pitfall? Mistaking comfort for tension. The procedure spots structure; the novelist must breathe life into it.
answer: |-
  Here’s a step-by-step diagnostic checklist for applying Hegel’s lordship/bondage dialectic to character relationships, designed for practical revision in ~30 minutes per dyad. It isolates *structural mechanics* while preserving narrative nuance.

  ---

  ### **The Recognition Dialectic Checklist**  
  *Run one dominant (A) and one subordinate (B) at a time. Answer with bullet points or shorthand.*

  #### **STEP 1: HOW RECOGNITION IS SOUGHT AND WITHHELD**  
  - **Ask:** How does A *actively demand or manipulate* B’s acknowledgment? How does B *consciously deny, distort, or ration* that acknowledgment?  
  - **Dialectic Present If:** A’s authority is contingent on B’s validation (even if unspoken), and B weaponizes this by granting/denying it strategically.  
  - **Breaks Dialectic If:** B’s acknowledgment is automatic, irrelevant, or nonexistent.  
  - **Artistic Judgment:** Degree of B’s *conscious* withholding (passive resistance vs. tactical silence).

  #### **STEP 2: DEPENDENCE REVERSAL**  
  - **Ask:** Where does A *existentially require* B’s labor/validation to sustain their identity? Does this create power B can leverage?  
  - **Dialectic Present If:** A’s status collapses without B’s specific contribution (e.g., work that defines A’s self-worth).  
  - **Breaks Dialectic If:** A’s dependence is logistical (e.g., B is replaceable) or emotional without identity stakes.  
  - **Artistic Judgment:** Whether the reversal feels earned or contrived.

  #### **STEP 3: LABOR/OBJECTIFICATION & SELF-CONSCIOUSNESS**  
  - **Ask:** What *concrete act* does B perform that A treats as an extension of themselves? How does this labor force B to confront their own agency?  
  - **Dialectic Present If:** B’s work (physical, emotional, intellectual) is appropriated by A, and performing it shifts B’s self-awareness (e.g., resentment → awakening).  
  - **Breaks Dialectic If:** B’s labor doesn’t transform their self-perception or is trivial.  
  - **Artistic Judgment:** Form of labor (e.g., creative vs. manual) and depth of B’s transformation.

  #### **STEP 4: EXISTENTIAL STAKES**  
  - **Ask:** If B denied recognition, would A face *annihilation of self* (not just embarrassment)? Does B risk self-destruction by defying A?  
  - **Dialectic Present If:** Stakes involve dissolution of identity (e.g., genius exposed as fraud, authority unmasked as impotence).  
  - **Breaks Dialectic If:** Consequences are superficial (e.g., hurt feelings, temporary setbacks).  
  - **Artistic Judgment:** Scaling tension between melodrama and genuine peril.

  #### **STEP 5: MUTUAL RECOGNITION OR BLOCKAGE**  
  - **Ask:** Is there a moment where A and B *see each other as equally conscious beings*? If blocked, what institution/fear prevents it?  
  - **Dialectic Present If:** Mutual recognition is attempted but fails (structural blockage) or succeeds at cost (e.g., hierarchy collapses).  
  - **Breaks Dialectic If:** Recognition is one-sided, ignored, or irrelevant to the conflict.  
  - **Artistic Judgment:** Whether blockage feels inevitable or recognition plausible.

  ---

  ### **⛔ CRITICAL FALSE-POSITIVE FLAG**  
  **If ALL steps pass EXCEPT:**  
  - Recognition was never *actively risked* by A (no vulnerability) or B (no defiance), **REJECT on narrative grounds.**  
  - This creates *codependence without crisis*—a hollow dialectic. Dependence must threaten A’s authority or B’s subjugation.

  ---

  ### **Application to Drafted Relationships**  

  #### **1. Composer (A) & Copyist (B)**  
  - **Step 1:** A demands genius-validation via B’s meticulous transcription. B withholds via silence/eyebrow raises. *✅ Present*  
  - **Step 2:** A’s artistic identity depends on B’s verification. B’s power: can shatter A’s self-concept. *✅ Present*  
  - **Step 3:** B’s labor (decoding chaotic scores) objectifies A’s creativity. B’s self-consciousness: Realizes *they* judge what’s "genius." *✅ Present*  
  - **Step 4:** Stakes existential: A’s life-meaning; B risks ejection from sacred creative space. *✅ Present*  
  - **Step 5:** Blocked. A cannot acknowledge B’s agency without admitting dependence. *✅ Present*  
  - **Verdict:** **TRUE DIALECTIC**. Core conflict structurally sound.  

  #### **2. Warden (A) & Inmate (B)**  
  - **Step 1:** A demands obedience as proof of authority. B denies recognition via calm defiance (not rage). *✅ Present*  
  - **Step 2:** A’s authority *requires* B’s refusal—only B’s resistance justifies A’s brutality. *✅ Present*  
  - **Step 3:** B’s labor: Emotional endurance. Objectified as "proof" of prison’s cruelty. B’s awakening: Resistance as self-definition. *✅ Present*  
  - **Step 4:** Existential: A loses purpose if B breaks/surrenders; B risks solitary/death. *✅ Present*  
  - **Step 5:** Blocked by institution. Mutual recognition = system’s collapse. *✅ Present*  
  - **Verdict:** **TRUE DIALECTIC**. Hierarchy reversal clear.  

  #### **3. Mentor (A) & Protégé (B)** (False Positive Case)  
  - **Step 1:** A demands admiration. B withholds via mild skepticism. *✅ Present*  
  - **Step 2:** A depends on B to validate legacy. B depends on A for access. *✅ Present*  
  - **Step 3:** B’s labor (emulating A) objectifies A’s methods. B’s self-consciousness: Minor confidence shifts. *⚠️ Weak*  
  - **Step 4:** Stakes: Disappointment, not annihilation. No one’s selfhood dissolves. *❌ Absent*  
  - **Step 5:** Recognition avoided. Both fear exposing mediocrity. *✅ Present*  
  - **False Positive Flag:** **⛔ REJECT**. Dependence exists, but no *risk*—neither truly challenges the other. Stakes are egoic, not existential. Needs higher peril or collapse.  

  ---

  ### **What This Procedure CANNOT Do**  
  - **Generate emotional texture:** It maps bones, not flesh. You supply the subtext, voice, and sensory details.  
  - **Replace dramatic instinct:** A scene passing the checklist can still feel inert. Tension requires pacing, irony, voice.  
  - **Resolve narrative choices:** Blocked recognition may serve tragedy; mutual recognition might deflate tension. Your story decides.  
  - **Handle triads/groups:** Designed for dyads. Multi-actor dynamics require separate analysis.  
  - **Diagnose thematic depth:** A relationship can be Hegelian but thematically redundant.  

  ---

  **Final Tip:** Run this *after* a full draft. It’s a structural stress-test, not a substitute for organic character development. When steps fail, ask: "Do I need higher stakes? Sharper defiance? More transformative labor?" — then revise with dramatic intuition.
