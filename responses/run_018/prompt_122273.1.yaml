  Second: Two plant monitors - one with real sensors, one crowdsourcing human reports via LLM. But the LLM could simulate understanding too well. 
  Third: Warehouse system - physical robot vs LLM assistant. Perfect. Robot gets correction from failed grabs (world), LLM from worker reports (text). Soil moisture fits perfectly as the physical quantity.

  Refining: 
  System A: LLM with warehouse docs + worker chat logs. Corrects via text input. 
  System B: Simple robot with shelf sensors. Corrects via failed physical actions. 
  Task: Report if crate is on shelf 5B. 

  Behavioral tests favor A (handles synonyms, explanations), embodied tests favor B (direct sensorimotor loop). The isolation variable is indeed correction provenance. 

  If we remove correction sources: 
  - Without worker chats, A fails behavioral tests 
  - Without sensors, B can't correct physically 
  Then both camps agree: neither understands. 

  Critique from behavior-first camp: They'd argue A's explanations demonstrate real understanding regardless of input source. Embodied camp would counter that sensor data is non-negotiable for grounding. 

  Word count is tight - need crisp phrasing. British English: "shelf" not "rack", "torch" not "flashlight". 

  This should satisfy their request for a clean philosophical wedge using mundane tech.
answer: |-
  ### Scenario (119 words)
  A small warehouse tracks whether crates are present on specific shelves. **System A** is an LLM integrated with inventory databases and worker chat logs. It answers queries using pattern-matching across text sources, updating its responses when workers report errors via chat. **System B** is a simple robot with a shelf sensor (e.g., weight or optical). It answers by physically scanning shelf 5B. If it wrongly claims a crate is present, the error is corrected only when it subsequently fails to grab the crate (actuator feedback). Both answer "Is there a crate on shelf 5B?". The physical quantity is crate presence.

  ### Verdicts by Camp  
  **Behaviour-First Camp (e.g., linguistic competence):**  
  - *System A* understands. It handles novel phrasing ("Is 5B occupied?"), explains *why* ("Crate X logged 2hr ago"), and transfers to new shelves via text patterns.  
  - *System B* does not. It answers rigidly, cannot explain, and fails if asked about untrained shelf 7C.  

  **Embodiment Camp (e.g., causal grounding):**  
  - *System B* understands. Its sensor directly detects crate presence; errors are corrected by physical interaction (failed grab).  
  - *System A* does not. Its "knowledge" comes only from text patterns; errors are corrected by more text (worker chats), not the crate itself.  

  ### Isolated Feature  
  **Correction provenance**: System B’s errors are repaired by *physical pushback* (failed actuator operation). System A’s by *textual reports* (worker messages).  

  ### If Feature Removed  
  If System B loses sensor/actuator feedback (e.g., it only *simulates* grabs), it cannot be physically corrected. Both camps agree it lacks understanding. If System A loses worker chat corrections (only pre-trained data), it cannot update from errors—both camps deem it static and non-understanding.  

  ### Attack from Behaviour-First Defender  
  *"System B’s ‘understanding’ is trivial. It’s a thermometer for crates! Real understanding requires flexible representation—System A has that. Its corrections via text are valid; humans learn from reports too. Your ‘pushback’ test arbitrarily privileges robots over language-users."*  

  **Key Variable**: Correction provenance (as you guessed).  
  **Word Count**: 496.
