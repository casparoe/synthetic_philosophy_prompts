  The user seems frustrated by abstract debates and wants the case to isolate "correction provenance" - whether systems learn from physical feedback or textual corrections. They're clearly well-read but lack formal training, so I should avoid jargon while maintaining rigor.

  Key constraints: real-world small-scale setup, ordinary physical concept (like soil moisture), both systems viable now, non-specialist task, no "cheating" with broken systems. The verdicts must emerge naturally from system design.

  Brainstorming designs: 
