prompt: |-
  I just finished a long and somewhat exhausting argument with a close friend about whether the American or the European attitude toward economic inequality is ultimately more defensible, and I am writing this to settle my thoughts through sustained reasoning rather than through further back-and-forth. My friend argued that the American framework is superior because it treats inequality essentially as a vector: it cares not only about the distance between people but about the direction of travel, measuring whether mobility is actually possible and treating blocked ascent as the central moral failure. I countered that the European framework treats inequality as a scalar, measuring only absolute distance from a socially guaranteed baseline, and that this is more defensible because it refuses to make human dignity contingent on the possibility of climbing. But our disagreement seemed to turn on something deeper than policy, and I want to press that further. I have been working with a somewhat niche conceptual distinction between what I call static dignity—the idea that being positioned low on a hierarchy is not itself a harm unless the hierarchy makes that position legible as low—and dynamic dignity, which holds that harm consists precisely in the inability to change one's position. The American vector view seems to presuppose dynamic dignity, while the European scalar view seems closer to static dignity, yet I am not sure either framework can fully accommodate the other without collapsing. So I want you to write an essay that weighs the American and European attitudes toward inequality, takes seriously this underlying ontological disagreement about whether dignity is static or dynamic, and reaches a definite conclusion about which attitude is more defensible, even if your defense is conditional or qualified. Do not end on a non-committal note; justify a verdict. Furthermore, because I want this to read as a continuous piece of reasoning rather than a structured report, please present it entirely in continuous prose: no headings, no bullet points, no bold text, no tables, only flowing paragraphs as one might write in a letter or an email.
