answer: |-
  ### Essay Question (140 words)  
  **"Origin essentialism holds that you could not have originated from a different sperm and egg. Using Kripke’s arguments as a starting point, critically evaluate this thesis in light of synthetic mammalian embryos (blastoids). Blastoids are generated from induced pluripotent stem cells without gametes. Does essentialism collapse if there’s no ‘actual sperm and egg’ to be essential to? Or does it merely relocate the essential origin point (e.g., to the stem-cell donor or reprogramming event)? In your response, explicitly distinguish metaphysical essentialism from biological identity conditions. Avoid merely restating Kripke’s original argument; engage the synthetic embryo challenge directly."**

  ---

  ### Model Answer (495 words)  
  Origin essentialism asserts that an individual’s origin is metaphysically necessary: in all possible worlds where you exist, you originate from the same sperm and egg (Kripke). This is a *modal* claim about necessity across possible worlds, distinct from *biological identity conditions*, which describe empirical criteria for an organism’s persistence in the actual world (e.g., metabolic continuity, developmental trajectory). Biology tracks *how* entities persist; essentialism asks *whether* they could have been otherwise.  

  Blastoids—synthetic embryo-like structures derived from reprogrammed adult cells—destabilize Kripke’s formulation. If "you" were a blastoid, there are no gametes constituting your origin. Essentialism doesn’t collapse but *relocates* the necessary origin point. The donor cell (e.g., a skin cell) and its reprogramming become metaphysically essential: you could not have arisen from a *different* somatic cell or reprogramming event. This preserves essentialism’s core intuition—that origins fix identity—but decouples it from gametes.  

  However, this reveals essentialism’s disconnect from biological identity. Biologically, blastoids exhibit key features of embryos (self-organization, gene expression) but lack full developmental potential. Their identity conditions hinge on structural and functional continuity, not origins. A blastoid’s "persistence conditions" might allow it to originate from multiple cell lines if developmentally identical, whereas essentialism forbids this modal flexibility.  

  The challenge isn’t fatal but reframes essentialism as a claim about *causal origins*, not biological matter. Essentialists must argue that the *specific causal history* (e.g., *this* skin cell’s reprogramming) is necessary. Yet biology cares only about current-state continuity: a blastoid’s identity persists through cell division regardless of whether we swap its genetic source mid-process (if functionally stable). Thus, biological identity is phase-relative and state-dependent; essentialism is history-bound and rigid.  

  Conclusion: Blastoids force essentialism to retreat from gametes to antecedent causes, but biological identity remains grounded in actual dynamics, not modal origins. Essentialism survives synthetically—yet its necessity claims become untestable by biology, highlighting their metaphysical, not empirical, foundation.  

  ---

  ### Marking Scheme (145 words)  
  **Must-hit moves:**  
  1. **Kripke’s essentialism defined**  
     - A: Clearly separates modal necessity (origins) from biological persistence.  
     - B: Vague on modality vs. biology.  
     - *Mistake: Conflating essential properties with empirical identity.*  
  2. **Blastoid challenge engaged**  
     - A: Argues gamete absence relocates (not destroys) essential origin.  
     - B: Claims essentialism fails without gametes.  
     - *Mistake: Ignoring synthetic origins or defaulting to Kripke.*  
  3. **Biological identity distinguished**  
     - A: Explicitly contrasts developmental continuity with metaphysical origins.  
     - B: Uses biological facts *as* essentialist arguments.  
     - *Mistake: Equating persistence conditions with essential origins.*  
  4. **Essentialism’s relocation defended/critiqued**  
     - A: Nuanced on stem-cell source as new necessary origin.  
     - B: Asserts relocation without justifying necessity.  
     - *Mistake: Treating blastoids as "not real embryos" to dodge the problem.*  
  5. **Synthesis beyond Kripke**  
     - A: Notes essentialism’s shift to untestable causal history vs. biology’s state-dependence.  
     - B: Restates Kripke without synthetic innovation.  
     - *Mistake: No meta-reflection on science/metaphysics friction.*  

  ---

