answer: |-
  Below is a structured pedagogical plan for your seminar, optimized for clarity, conceptual dependencies, and avoidance of common misconceptions. The scenario is tailored to forecasting/risk calibration, avoiding cosmology. Key structural insights are bolded.

  ---

  ### **Core Pedagogical Sequence**  
  **Total Time:** 75 minutes  
  **Goal:** Distinguish SSA vs. SIA as competing *epistemic norms* for indexical uncertainty, exposing how SIA smuggles in presuppositions via reference-class choices.

  ---

  ### **Part 1: Foundational Setup (20 mins)**  
  *Prerequisite concepts to define before introducing SSA/SIA:*  
  1. **Anthropic reasoning in forecasting** (5 mins):  
     - Frame as a tool for *calibrating priors* when evidence is filtered by observer existence (e.g., predicting existential risks where "failure" implies no observers to collect data).  
     - Example: "Why did we *start* forecasting *after* 1945? Can we trust pre-1945 risk models?"  
  2. **Observer-moment & reference class** (10 mins):  
     - Define "observer-moment": *a conscious experience at a point in spacetime*.  
     - **Critical distinction**: Reference class (e.g., "humans alive during technological civilization") is a *methodological choice*, not an empirical fact.  
     - *Preempt misconception*: Contrast with sampling bias (e.g., "only surveying urban voters"). Sampling bias corrects *within* a known population; anthropics addresses *uncertainty about the population itself*.  
  3. **Scenario Introduction: The Sealed Forecast** (5 mins):  
     - **Setup**:  
       - A 21st-century think tank creates 1,000 sealed predictions about existential risks by 2100 (e.g., "AI catastrophe: YES/NO").  
       - Each prediction is locked in a vault. *Crucially, 99% of vaults are designed to self-destruct if humanity goes extinct by 2100*.  
       - In 2100, we open one *randomly selected* vault. The prediction inside says "NO CATASTROPHE."  
     - **Question**: What should we infer about extinction risk?  

  ---

  ### **Part 2: Introducing SSA & SIA (25 mins)**  
  *Dependency: SSA/SIA only meaningful after reference class is specified.*  
  1. **Self-Sampling Assumption (SSA)** (10 mins):  
     - "Apply the reference class *only to observer-moments that exist*."  
     - Calculation for scenario:  
       - *If catastrophe occurred*, only ~10 vaults survive (1% of 1,000).  
       - *If no catastrophe*, all 1,000 vaults survive.  
       - Probability of drawing "NO CATASTROPHE" = 1.0 under catastrophe?  
       - Bayes’ update: P(No Catastrophe | "NO" note) = P("NO" note | No Catastrophe) * P(No Catastrophe) / P("NO" note)  
       - → **Conclusion**: "NO" note is weak evidence; high catastrophe risk remains plausible.  
  2. **Self-Indication Assumption (SIA)** (10 mins):  
     - "Favor hypotheses where *more observers exist*."  
     - Alters the *prior*: P(H) ∝ P(H) * Number of observers if H is true.  
     - Calculation:  
       - Prior odds of no catastrophe multiplied by 1000x (vaults surviving).  
       - → **Conclusion**: "NO" note strongly confirms no catastrophe.  
  3. **Divergence Point** (5 mins):  
     - Highlight: *Same evidence, same Bayes’ rule, different norms*.  
     - SSA conditions on *actual* observers; SIA weights *possible* observers.  
     - **Structural insight**: SSA is conservative; SIA is "optimistic" toward large populations.  

  ---

  ### **Part 3: Presumptuous Philosopher Problem (15 mins)**  
  *Enter here: After SIA’s mechanism is clear, but before defenses.*  
  1. **The Objection** (10 mins):  
     - Modify the scenario: Suppose we *discover* that 99% of vaults were destroyed (only 10 survive). We open one: "NO CATASTROPHE."  
       - SSA: Updates cautiously (survivorship bias acknowledged).  
       - SIA: *Still favors no catastrophe* because "more vaults *could have* existed."  
     - **Core flaw**: SIA assumes the *epistemic validity* of a reference class (e.g., "all possible vaults") that presupposes a low-risk world.  
  2. **Link to Existential Risk** (5 mins):  
     - In long-term forecasting, using SIA to justify a large reference class (e.g., "all conscious beings in Earth’s future") *assumes* a long human future exists—begging the question.  

  ---

  ### **Part 4: Misconception Mitigation**  
  *Preempt at these points:*  
  | **Misconception** | **When to Address** | **Counter-Tactic** |  
  |-------------------|---------------------|---------------------|  
  | "Reference classes are empirical" | Part 1 (Observer-moment) | Contrast: Choosing "humans" vs. "mammals" isn’t discovered—it’s a normative choice affecting predictions. |  
  | "SIA = Bayesian updating" | Part 2 (SIA calculation) | Stress: SIA *alters the prior*, while Bayes’ updates the posterior. Show equations side-by-side. |  
  | "This is just sampling bias" | Part 1 (Foundations) | Distinguish: Sampling bias has a known population; anthropics has uncertainty *about* the population. |  

  ---

  ### **Grasp Check (10 mins)**  
  **Exercise**: *A new scenario*  
  - "A lab simulates 100 civilizations. Each runs until collapse (avg. 200 years) or achieves longevity (avg. 10,000 years). 90% of simulations are short-lived. You wake up in a simulation with no data. Does SSA or SIA make you more confident you’re in a long-lived civilization? Why?"  
  - **Correct answer**: SIA favors long-lived (more observer-time), SSA favors short-lived (most civilizations are short). *Crucially: Students must justify using observer-weighting logic, not just "SIA prefers big numbers."*  

  ---

  ### **Omissions & Why**  
  1. **Formal Doomsday derivations**: Requires continuous models & infinite ethics. Distracts from normative conflict.  
  2. **Multiverse taxonomies**: Irrelevant to reference-class epistemology; risks physics digressions.  
  3. **Probability interpretations**: While SSA/SIA lean frequentist/Bayesian, the *distinction holds* under either (per Bostrom). Not evasive—focuses on applied norms.  

  ---

  ### **Confusion Check**  
  *Your concern is valid, but the distinction holds*:  
  - SSA/SIA diverge in how they handle *indexical information* under uncertainty.  
  - Presumptuous philosopher is a *substantive flaw*: SIA’s prior inflation can dominate empirical evidence, violating evidential neutrality. This is not rhetorical—it’s a failure of epistemic justification.  

  ---

  **Summary Flow**:  
  Forecasting context → Observer/reference class (choice!) → Sealed vault scenario → SSA (cautious) vs. SIA (optimistic) → Presumptuous philosopher as inherent SIA consequence → Misconceptions preempted structurally → Applied exercise.  

  This sequence ensures the presumptuous philosopher emerges *from* SIA’s mechanics, not as an external critique, while grounding all ideas in risk-relevant decision-making.
