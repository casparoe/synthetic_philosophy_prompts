  | D2: Every higher-level phenomenon can be completely explained by reduction to the lowest-level components and interactions. Apparent emergence is always epistemic, not ontological. | D2: Some higher-level phenomena (e.g., collective foraging in social insects) are ontologically emergent. Their system-level dynamics cannot be reduced without explanatory loss. |

  **Section 3: Cruxes**

  **Crux 1: The Reducibility of Collective Foraging in Social Insects**

  - **Crux**: Whether the high-level predictive dynamics of collective foraging in a social-insect colony can be fully dissolved into substrate-level neural or biochemical explanations without irreducible explanatory loss.

  - **Concrete Case**: Ant colony foraging behavior, where individual ants follow simple rules but the colony exhibits optimized path-finding.

  - **GR Prediction**: A complete simulation of every ant and pheromone interaction at the substrate level would capture all colony-level behaviors and predictions. Colony-level models are computational shortcuts, not ontologically distinct.

  - **CET Prediction**: A complete substrate-level simulation would miss the emergent, functional dynamics (e.g., optimization) that are captured by colony-level models. The reduction would suffer explanatory loss because the functional, teleological aspect is irreducible.

  **Crux 2: The Indispensability of Intentional Stance in Complex Agents**

  - **Crux**: Whether intentional-stance descriptions of complex cognitive agents are ever genuinely indispensable for prediction and explanation.

  - **Concrete Case**: A human playing chess, described either by intentional states (beliefs, desires) or by neural processes.

  - **GR Prediction**: A complete neural-level account would fully explain the chess-playing behavior and make the same predictions as the intentional stance. The intentional stance is not indispensable.

  - **CET Prediction**: The intentional stance is indispensable because it captures rational patterns (e.g., the move as a rational response) that are not visible at the neural level. Without it, we lose explanatory power regarding the functional role of the behavior.

