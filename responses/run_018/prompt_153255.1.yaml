  We are drafting a joint statement between two committed positions: a greedy reductionist (GR) and a crane-only emergence theorist (CET). The GR believes that all phenomena can and should be explained by reduction to the lowest level of mechanisms, while the CET holds that some higher-level phenomena (cranes) are emergent and cannot be fully explained by reduction without losing essential explanatory power.

  The document must have:
  1. A numbered section of agreed claims.
  2. A table of precise disagreements, each in wording acceptable to the side holding it.
  3. Cruxes (the pivotal points of disagreement) and for each crux, the case or argument both sides agree bears on it, along with each side's explicit prediction.

  We avoid citations and bibliographies, and focus on conceptual mechanics.

  **Agreed Claims Section**:

  Both sides agree on the following:

  1. **Bottom-up Construction**: Complex biological and cognitive systems are the products of evolutionary processes that build from the bottom up, without any top-down intelligent design (skyhooks). Dennett's cranes (evolutionary mechanisms) are sufficient to account for the complexity we observe.

  2. **Greedy Reductionism's Demands**: Greedy reductionism requires that any explanation of a higher-level phenomenon must be reducible, in principle, to an explanation in terms of the lowest-level physical components and their interactions, without any explanatory gaps. The GR asserts that such reduction is always possible and necessary for complete understanding.

  3. **Intentional Stance as Heuristic**: The intentional stance (attributing beliefs, desires, and intentions to systems) is a useful heuristic for predicting behavior, especially in complex systems. However, both sides agree that the intentional stance is not ontologically fundamental. The disagreement is about whether it is ever indispensable (i.e., whether there are cases where no non-intentional-stance explanation can fully capture the predictive power or explanatory depth of the intentional stance).

  **Disagreements Table**:

  We present the disagreements in a table. Each row is a distinct disagreement, and the two columns present the position of each side in their own terms.

  | Greedy Reductionist (GR) Position | Crane-Only Emergence Theorist (CET) Position |
  |-----------------------------------|--------------------------------------------|
  | **D1: On the Reducibility of Intentional Stance**: The intentional stance is entirely reducible to the design stance and ultimately to the physical stance. Any predictive success of the intentional stance is fully explained by the underlying physical mechanisms. | **D1: On the Indispensability of Intentional Stance**: There are systems (e.g., complex cognitive agents) for which the intentional stance provides predictive and explanatory advantages that cannot be matched by any non-intentional reduction, even in principle. This indispensability indicates that intentional descriptions capture real patterns that are irreducible. |
  | **D2: On the Possibility of Complete Reduction**: Every higher-level phenomenon (including collective behaviors) can be completely explained by reduction to the lowest-level components and their interactions. Any apparent emergence is merely epistemic (due to our computational limitations) and not ontological. | **D2: On the Reality of Emergence**: Some higher-level phenomena (e.g., collective foraging in social insects) exhibit genuine ontological emergence. The system-level dynamics are not fully determined by the substrate-level components and their interactions, and thus cannot be reduced without explanatory loss. |

  **Cruxes**:

  We now present the cruxes (the pivotal points of disagreement that the debate hinges on). For each crux, we specify:

  - The crux itself.
  - The concrete case or line of argument both sides agree bears on it.
  - Each side's explicit prediction about what that case shows.

  **Crux 1: The Reducibility of Collective Foraging in Social Insects**

  - **Crux**: Whether the high-level predictive dynamics of collective foraging in a social-insect colony (e.g., ant colony optimization) can be fully dissolved into substrate-level neural or biochemical explanations without irreducible explanatory loss.

  - **Concrete Case**: Consider an ant colony's foraging behavior, where individual ants follow simple rules (e.g., pheromone trails) but the colony as a whole exhibits optimized path-finding and resource allocation. The colony's behavior can be predicted by models at the colony level (e.g., using optimization algorithms) or by simulating every ant and every pheromone trail at the individual level.

  - **GR Prediction**: The greedy reductionist predicts that a complete simulation of every ant and every pheromone interaction (at the neural and biochemical level) would capture all the colony-level behaviors and predictions. Any colony-level pattern (like optimized paths) would be fully explained by the aggregation of individual interactions. Thus, the colony-level model is just a computational shortcut and does not represent an ontologically distinct level.

  - **CET Prediction**: The crane-only emergence theorist predicts that even with a complete simulation of every component, the explanatory account would miss the emergent, functional dynamics that are captured by colony-level models (e.g., the optimization of paths as if the colony were a single agent solving a problem). The colony-level patterns are real and irreducible because they are multiply realizable and depend on the organizational structure, not just the substrate. Thus, a purely reductionist account would suffer from explanatory loss by failing to capture the functional, teleological aspect of the colony's behavior.

  **Crux 2: The Indispensability of Intentional Stance in Complex Agents**

  - **Crux**: Whether intentional-stance descriptions (e.g., attributing beliefs and desires) of complex cognitive agents (e.g., humans) are ever genuinely indispensable for prediction and explanation, or whether they are always reducible to non-intentional, mechanistic descriptions.

  - **Concrete Case**: Consider a human playing a game of chess. The intentional stance describes the player as having the belief that moving the queen to a certain square will checkmate the opponent and the desire to win. Alternatively, we could describe the brain's neural processes during the game without any intentional terms.

  - **GR Prediction**: The greedy reductionist predicts that a complete neural-level account (including the brain's computational processes) would fully explain the chess-playing behavior and make the same predictions as the intentional stance. The intentional stance is just a useful shorthand for a complex neural process, but it is not indispensable because the neural account, if we had it, would provide a complete explanation without any gaps.

  - **CET Prediction**: The crane-only emergence theorist predicts that the intentional stance is indispensable because it captures patterns (like the rationality of the player's moves in the context of the game) that are not visible at the neural level. Even with a complete neural account, we would lose the explanatory power of understanding the move as a rational response to the game's rules and the opponent's moves. The intentional stance provides a level of abstraction that is necessary for efficient prediction and for understanding the functional role of the behavior.

  **Final Document Structure**:

  We now present the entire document as requested:

