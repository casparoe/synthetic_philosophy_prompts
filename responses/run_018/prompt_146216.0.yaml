prompt: |-
  After a long argument last night with a friend about where market logic should stop, I have been trying to systematize her judgments. She holds that a state-run pool compensating living kidney donors at a fixed rate is permissible, because bodily exchange is not inherently degrading if medically safeguarded; she holds that pharmaceutical price gouging on essential drugs during a shortage must be banned rather than taxed, because desperation removes the conditions for fair voluntary exchange; she permits selling naming rights to public monuments to private corporations, since no personal dignity is at stake; she insists vote-selling should remain criminal even between fully informed, uncoerced adults, because democratic equality is not a fungible good; she accepts pre-paid funeral contracts sold for profit; yet she rejects any contract in which parents could exchange an upfront payment for rights over a child’s future labor, regardless of regulatory safeguards.

  She has not yet considered a new proposal: a financial instrument called an “anticipatory grief contract,” in which an investor pays a premium now to fund a licensed counseling pool, receiving in return a transferable claim on a fixed block of bereavement-therapy hours assignable to any named survivor upon the investor’s death, with the claim freely tradable on a secondary market. The firm argues this is merely life insurance combined with pre-need planning; critics reply that it securitizes mourning and turns emotional care into a speculative asset.

  If she wants to remain consistent with her own track record, what should she say about this instrument? Which earlier verdict—the kidney pool, the funeral contracts, or the vote-selling prohibition—is the closest analog? Are her precedents genuinely underdetermined here, and if so, what principle would she be adopting with each possible choice? Finally, what single further case—perhaps involving the resale of already-purchased therapy vouchers for non-bereavement mental health—would best reveal whether her underlying rule concerns the inalienability of intimate emotional goods, the corruption of care relationships by speculative trading, or vulnerability and desperation alone?
reasoning: |-
  Okay, the user presents a fascinating ethical puzzle about market boundaries. They're clearly intellectually engaged - this is someone who enjoys systematic moral reasoning, probably with philosophy or policy interests. The kidney/vote/funeral cases suggest they value conceptual precision, and the grief contract proposal shows they appreciate creative thought experiments. 

  Hmm, the core challenge is mapping a new case onto existing principles when the precedents point in different directions. The kidney pool allows bodily commodification with safeguards, while vote-selling prohibition blocks political commodification absolutely. Funeral contracts permit death-related markets but the child labor ban draws a hard line at developmental exploitation. 

  *scratches head* The grief contract is tricky because it straddles categories. Like funeral planning, it's post-mortem; like the kidney market, it involves third-party services; but it adds speculative trading which echoes the price-gouging objection. The secondary market aspect feels crucial - that's where it diverges from pre-paid funerals. 

  *flips through imaginary casebook* If I were advising the friend, I'd note three possible consistency paths: 
  1) Permitting it as analogous to funeral contracts (both are pre-need death arrangements) 
  2) Banning it like vote-selling (democratizing emotional care access vs political equality) 
  3) A middle ground allowing primary contracts but banning secondary trading (like her drug price-gouging stance targets exploitation during shortages)

  *lightbulb* Ah! The perfect test case would be reselling grief therapy vouchers for non-bereavement use. If she objects to that but accepts primary grief contracts, her concern is specifically about mourning commodification. If she rejects both, it's about emotional care markets broadly. And if she only objects during actual mental health crises, then vulnerability is her key trigger - aligning with her drug price-gouging stance.

  *nods* The user's asking good meta-questions too - about underdetermination and principle extraction. This isn't just about the grief contract; they're probing how to systematize ethical intuitions. Might be useful to suggest Rawlsian reflective equilibrium as a framework...
answer: |-
  Based on your friend's established precedents, here's how she should evaluate the "anticipatory grief contract" for consistency, the closest analog, and the underlying principles:

  ### 1. **Her Likely Verdict: Reject the Instrument**
     - **Key Inconsistencies if Approved:**  
       - **Vote-Selling Precedent:** She views democratic equality as non-fungible. Similarly, she would likely see dignified mourning and emotional care as **inalienable human experiences** corrupted by speculation. Turning therapy into a tradable asset commodifies intimate grief, violating the "non-fungible good" principle applied to votes.  
       - **Pharmaceutical Gouging Precedent:** The secondary market allows speculators to profit from others' desperation during bereavement—mirroring the "desperation removes fair exchange" logic used to ban price gouging.  
       - **Child Labor Precedent:** Assigning monetary value to future emotional care (even indirectly) parallels the objection to monetizing a child’s future, treating profound human relationships as financial instruments.  

     - **Inconsistencies if Rejected:**  
       - **Funeral Contract Precedent:** Pre-paid funerals are permitted despite involving death and profit. However, funeral services are **tangible and non-speculative**, lacking a secondary market or emotional securitization.  
       - **Kidney Pool Precedent:** While bodily integrity is protected, compensation is fixed and non-speculative. The grief contract’s transferable claims invite market volatility, degrading care into a financial gamble.  

  ### 2. **Closest Analog: Vote-Selling Prohibition**
     - **Why:** Both cases involve **protecting foundational social/emotional goods** (democratic participation, dignified mourning) from market corruption. Just as vote-selling erodes political equality by making civic duty a commodity, securitizing grief therapy erodes the sacredness of bereavement by making emotional support a speculative asset. The transferable claim turns communal care into a tradable chip, mirroring how vote-selling turns civic voice into a private good.

  ### 3. **Underdetermination and Principles at Stake**
     Her precedents *are* underdetermined, forcing a choice between competing principles:  
     - **Option A (Ban):** Adopts the **"inalienability of intimate goods"** principle (votes, grief). This prioritizes non-commodification of core human experiences.  
     - **Option B (Permit with Restrictions):** Adopts **"vulnerability alone"** (like drug gouging bans). She might allow primary contracts (pre-need planning) but ban secondary trading to prevent exploitation of the bereaved.  
     - **Option C (Permit):** Relies on **"regulatory safeguards"** (like kidney sales/funerals). However, this clashes with her vote-selling stance, where safeguards were irrelevant.  

  ### 4. **Crucial Test Case: Resale of Therapy Vouchers**  
     Propose this: *"A company sells non-refundable 'mental health vouchers' for general therapy (e.g., anxiety, trauma). Buyers can resell unused vouchers on a secondary market to others in acute crisis."*  
     - **If she BANS resale but ACCEPTS primary vouchers:** Her core concern is **speculative trading corrupting care relationships** (secondary markets incentivize hoarding/profiteering during crises).  
     - **If she BANS all such vouchers (primary + resale):** She prioritizes **inalienability of emotional goods** (therapy must never be detached from direct need/relationship).  
     - **If she PERMITS resale UNLESS during shortages:** Her focus is **vulnerability/desperation** (echoing drug gouging rules), allowing markets until crisis exploitation occurs.  

  ### Conclusion  
  For consistency with her vote-selling and child labor prohibitions, she **must reject the grief contract**. The secondary market transforms a sacred human experience (mourning) into a speculative commodity, violating her core principle that certain goods—democratic voice, a child’s future, and now grief—exist beyond the market’s reach. The vote-selling analogy is strongest because both protect **participatory/emotional integrity** from commodification. The test case clarifies whether her red line is alienation (total ban), corruption (secondary market ban), or context (crisis exploitation). Her track record suggests alienation.  

  *Systematized Rule:* **"Markets may not commodify goods central to human dignity (e.g., civic voice, developmental autonomy, profound emotional experiences), regardless of safeguards, due to inherent degradation and/or corruption risks."**
