  The inscribed equilateral triangle has side length equal to √3 times the radius (if radius is r, then side is r√3). However, the chord length condition: a chord is longer than the side of the inscribed equilateral triangle if and only if it is longer than √3 * r.

  But note: in a circle of radius r, the inscribed equilateral triangle has chords (sides) of length r * √3. However, the circle's diameter is 2r. The condition for the chord to be longer than the side of the triangle is: length > r√3.

  We can also express the condition in terms of the distance from the center (d) to the chord. For a chord of length L: 
    L = 2 * sqrt(r^2 - d^2)
  We require L > r√3, so:
    2 * sqrt(r^2 - d^2) > r√3
    sqrt(r^2 - d^2) > (r√3)/2
    r^2 - d^2 > (3r^2)/4
    -d^2 > (3r^2)/4 - r^2 = -r^2/4
