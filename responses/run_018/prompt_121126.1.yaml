  Below is a complete, runnable design for your Bertrand's paradox activity, optimized for your constraints. It focuses on experiential discovery, betting to internalize risk, and philosophical reflection. The activity is structured into three phases with precise timing, materials, and scripts.

  ---

  ### **Activity Overview**
  - **Duration**: 75 minutes
  - **Participants**: 16 students, split into 3 groups (5–6 students each)
  - **Goal**: Discover Bertrand's paradox through physical experimentation and betting, then confront underdetermination.
  - **Key Moments**: 
    - Phase 1: Groups get different probabilities (≈1/3, 1/2, 1/4) for the same question.
    - Phase 2: Betting on hidden methods induces risk from uncertainty.
    - Phase 3: Betting on the method reveals that more data doesn’t resolve the paradox.
  - **Debrief**: Highlights that the paradox persists even without repeatable data.

  ---

  ### **Materials Per Group**
  - **All Groups**: 
    - Printed circle (radius 10 cm, with marked center and circumference).
    - Ruler, string, scissors, tape, pens.
    - Tally sheet (table with "Long" and "Short" columns).
    - Reference string: **Length = side of inscribed equilateral triangle** (pre-cut to ≈17.32 cm for r=10 cm).
  - **Group-Specific**:
    - **Group 1 (Endpoints)**: Spinner (pencil + paperclip pinned at center), protractor (optional, for angle marking).
    - **Group 2 (Radius)**: Spinner, 10 small beads (or paper dots), random-number app (uniform [0,1]).
    - **Group 3 (Midpoint)**: Random-number app (uniform [-10,10] for x and y), calculator app.

  ---

  ### **Phase 1: Experimentation (30 min)**
  **Objective**: Groups unknowingly use different randomization methods, producing divergent probabilities.  
  **Instructor Script**:  
  > *"Split into three groups. Each will answer: 'What fraction of random chords are longer than this reference string?' Use your assigned method to generate chords. Record 30 trials. Work fast—pool data afterward."*  

  **Group Procedures** (10 min setup + 20 min trials):
  - **Group 1 (Endpoints → P(long)≈1/3)**:
    1. Spin the spinner twice to pick two points on the circumference.
    2. Stretch string between points to form the chord.
    3. Compare chord length to reference string. Tally if longer.
  - **Group 2 (Radius + Point → P(long)≈1/2)**:
    1. Spin spinner to pick a radius (direction).
    2. Use app to get random number **u** in [0,1]. Place bead at **distance = u × 10 cm** along the radius.
    3. **Shortcut**: Chord is long if distance < 5 cm (no need to draw). Tally.
  - **Group 3 (Midpoint → P(long)≈1/4)**:
    1. Use app to generate random (x, y) in [-10,10]. Reject if outside circle (x² + y² > 100).
    2. **Shortcut**: Chord is long if x² + y² < 25 (d < 5 cm). Tally.

  **Pooling Data (5 min)**:
  - Groups report fractions: e.g., Group 1: 10/30≈0.33, Group 2: 15/30=0.50, Group 3: 7/30≈0.23.
  - **Instructor Script**:  
    > *"Write results on the board. Why do we disagree? All answered the same question!"*  
    > (Do not explain yet. Let confusion simmer.)

  ---

  ### **Phase 2: Betting on Chords (20 min)**
  **Objective**: A hidden method forces groups to bet on chords, making underdetermination feel risky.  
  **Setup**: 
  - Assign one group as the **Dealer** (secretly use Group 2’s method). 
  - Others are **Bettors**. Each group starts with 20 chips.

  **Rules** (per trial, 10 trials total):
  1. **Dealer**: Privately generate a chord using Group 2’s method (radius + point). *Do not reveal the method.*  
  2. **Bettors**: Before seeing the chord, decide:  
     - **Buy/Sell**: Bet 1 chip that the chord is long (Buy) or short (Sell).  
     - **Set Price**: Name your probability **p** (e.g., p=0.4).  
       - **If buying**, pay **p** chips upfront. Gain 1 chip if long, 0 if short.  
       - **If selling**, gain **p** chips upfront. Pay 1 chip if long, 0 if short.  
  3. **Outcome**: Dealer reveals if chord is long/short. Settle bets.  
  4. **Key**: Bettors see outcomes but not how chords were made.  

  **Instructor Script**:  
  > *"Now, one group is the Dealer. Others bet chips on whether chords are long. Name your price **p**—this is your confidence. If you bet wrong, you lose chips."*  

  **Expected Dynamics**:  
  - Bettors use Phase 1’s results to set **p** (e.g., Group 1 students may use p=1/3).  
  - True P(long)=1/2 for Dealer → Bettors with p<0.5 lose chips when buying; p>0.5 lose when selling.  
  - **Outcome**: Groups experience losses due to uncertainty about the method.

  ---

  ### **Phase 3: Betting on Methods (15 min)**
  **Objective**: Shift focus to the method itself, showing that more data doesn’t fix the paradox.  
  **Setup**: Reveal the three possible methods (M1=Endpoints, M2=Radius, M3=Midpoint). Dealer still uses M2.  

  **Rules**:
  1. **Question Tokens**: Groups spend 5 chips to ask 1 yes/no question about the method (e.g., "Does it use the circumference?").  
  2. **Betting on Identity**: After questions, groups bet chips on which method the Dealer uses (M1, M2, or M3).  
     - Payoff: 3× bet if correct; lose bet if wrong.  
  3. **Final Reveal**: Dealer discloses the method after betting.  

  **Instructor Script**:  
  > *"Now you know the three methods. Spend chips to ask questions. Then bet on which one the Dealer uses. What makes you sure/unsure?"*  

  **Expected Dynamics**:  
  - Groups ask questions (e.g., "Does it involve the center?" → M2 and M3 say yes).  
  - With limited questions, ambiguity persists (e.g., M2 and M3 both use the center).  
  - **Key Insight**: Even after 10 trials and questions, groups may bet on M1 or M3, losing chips. This shows that specifying the method is just as underdetermined as the chord.

  ---

  ### **Debrief (10 min)**
  **Goals**: 
  1. Contrast experimental resolution with the paradox’s core problem: no unique probability without a specified process.
  2. Address "why not say there’s no answer?"

  **Script and Talking Points**:  
  1. **Point to Phase 1**:  
     > *"We got three answers (≈1/3, 1/2, 1/4) for the same question. Why?*  
     > → Each method had a different 'random' process. The question didn’t specify one."  

  2. **Point to Phase 2**:  
     > *"When the method was hidden, you lost chips. Why?*  
     > → You had to *assume* a method to set your price. Without the true method, your probability was arbitrary."  

  3. **Point to Phase 3**:  
     > *"Even after 10 trials and questions, you couldn’t be sure of the method. Why?*  
     > → Questions like 'does it use the center?' fit multiple methods. You faced the same underdetermination again."  

  4. **Core Philosophical Point**:  
     > *"In experiments, more data fixes ambiguity. But Bertrand’s paradox asks: 'What is the probability for a single chord?'*  
     > → With no repeatable process, there’s no way to gather data. Probability requires a specified random process.  
     > → If I draw one chord and ask, 'Is it long?', there’s no answer—only opinions based on how you imagine it was drawn."  

  **If Asked "Why not say there’s no answer?"**:  
  > *"Exactly! That’s the paradox’s lesson: 'Random' is ambiguous without a process. In real decisions (e.g., betting), you must *choose* a process—but recognize it’s a choice, not a fact. Math can’t save you from philosophy here."*  

  ---

  ### **Predictable Issues and Mitigation**
  1. **Students Who Know the Paradox**:  
     - Assign them as silent observers or data recorders. Debrief: *"Did knowing the paradox change how you bet?"*  
  2. **Small Samples in Phase 1**:  
     - Use shortcuts (e.g., Group 2/3 don’t draw chords). Aim for 30 trials/group. Pre-calculate reference values (e.g., d<5 cm).  
  3. **Dealer Leaking/Faking**:  
     - Assign a trustworthy student. Secretly hand them a method card. Monitor during trials.  
  4. **Betting Confusion**:  
     - Do a trial round: *"Suppose p=0.4. If you buy, pay 0.4 chips now. If chord is long, gain 1 chip (net +0.6). If short, gain nothing (net -0.4)."*  
  5. **Phase 3 Time Crunch**:  
     - Limit to 2 questions total. Use chips to incentivize concise questions.

  ---

  ### **What the Activity Can’t Stage**
  - **The "No Data" Scenario**: The activity relies on frequencies, but the paradox is sharpest when no data exists (e.g., a single chord).  
  - **Mitigation in Debrief**:  
    > *"In our game, you could collect data. But imagine I hand you a circle with one chord. Is it long? Without knowing how it was drawn, there’s no objective probability—just like you couldn’t agree on a fair price in Phase 2. That’s the paradox: no process, no probability."*  

  ---

  ### **Timeline Summary**
  - **0–5 min**: Split groups, explain Phase 1.
  - **5–35 min**: Phase 1 (experimentation + pooling).
  - **35–45 min**: Phase 2 setup + first 2 trials (practice).
  - **45–60 min**: Phase 2 (8 trials + betting).
  - **60–70 min**: Phase 3 (questions + betting on method).
  - **70–75 min**: Debrief.

  This design balances hands-on discovery, risk-driven engagement, and philosophical payoff while respecting your constraints. Run it as a guided inquiry—students will remember the sting of losing chips more than any lecture!
