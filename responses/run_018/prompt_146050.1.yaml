prompt: |-
  I'm the on-call ethics consultant at a regional hospital and every few months I have to referee a death-determination dispute between neurology and critical care, usually with ECMO in the mix and a familly that doesn't accept brain death. I need a reusable decision procedure -- a flowchart in words with ordered tests and stop/go points -- that turns the philosophical distinction between organismal integration and irreversible loss of consciousness into steps I can run in 20 minutes before a meeting. It should say exactly what to do when brainstem reflexes are fragmentary, where it stops and hands the call to values (like religious objections to brain-death framing), and where it forces a declaration even if I know risk management will back down. Include the weird edge case where someone argues that potential future neuro-prosthetic restoration blocks declaring death -- put that in the flowchart as a confounder I have to address. Then apply it to three cases: a clean brain-death determination with donation consent; an ECMO patient with flat EEG but intact hypothalmic temperature regulation whose family insists on circulatory criterias; and a case where the procedure tells me to declare death but the attending refuses to sign for fear of litigation, so I see where my own tool breaks. Start with the actual checklist, no intro, then the cases, and flag every step that's really a judgment call dressed up as procedure. I want to see where it gives me an answer I hate.
reasoning: |-
  We are creating a reusable decision procedure (flowchart in words) for death determination disputes, particularly in the context of ECMO and family objections. The procedure must address:
  1. The distinction between organismal integration and irreversible loss of consciousness.
  2. Fragmentary brainstem reflexes.
  3. Religious or value-based objections.
  4. The edge case of potential future neuro-prosthetic restoration.
  5. Steps that are judgment calls.

  The procedure will have ordered tests and stop/go points. We will then apply it to three cases.

  **Death Determination Procedure (Checklist Form)**

  **Step 0: Preconditions**
     - The patient is on life-sustaining treatment (e.g., ventilator, ECMO) and has suffered a catastrophic brain injury.
     - There is a question of whether the patient meets brain death criteria OR whether to use circulatory criteria.

  **Step 1: Confirm Irreversible Cessation of Circulatory and Respiratory Functions (If Applicable)**
     - If the patient is not on any mechanical circulatory or respiratory support and has no spontaneous circulation and respiration for an appropriate observation period (according to local protocol), declare death by circulatory criteria. STOP.
     - If the patient is on support (e.g., ECMO, ventilator), proceed to Step 2.

  **Step 2: Assess for Brain Death Criteria (BDC)**
     - **2.1. Prerequisites:**
          - Known etiology sufficient to cause brain death.
          - Exclusion of reversible conditions (e.g., hypothermia [core temp ≥ 36°C], severe electrolyte/acid-base disturbances, severe hypotension, drug intoxication, neuromuscular blocking agents).
          - If any prerequisite is not met, address the confounder and reassess when resolved. If not resolved, BDC cannot be applied. Proceed to Step 4 (discuss with family about withdrawal of support and circulatory criteria).
     - **2.2. Clinical Testing for Brain Death:**
          - **Coma:** No evidence of arousal or awareness (no eye opening, no movement except spinal reflexes).
          - **Absent Brainstem Reflexes:**
               - Pupils: Fixed and unresponsive to light.
               - Oculocephalic reflex (doll's eyes): Absent.
               - Oculovestibular reflex (cold caloric): Absent (no eye movement after ice water irrigation).
               - Facial sensation and motor response: Absent (no corneal reflex, no jaw reflex, no grimace to deep pressure on supraorbital ridge or temporomandibular joint).
               - Pharyngeal and tracheal reflexes: Absent (no gag or cough reflex).
          - **Apnea Test:** Absent respiratory effort with PaCO2 rising to target (typically ≥ 60 mmHg or 20 mmHg above baseline) with adequate oxygenation. If apnea test cannot be performed (e.g., due to instability), proceed to ancillary tests.
     - **2.3. Ancillary Tests (if clinical exam cannot be completed or is equivocal):**
          - Options: EEG (electrocerebral silence), cerebral angiography (no intracerebral filling), transcranial Doppler (no flow), SPECT (no uptake), or other approved tests per local policy.
          - If ancillary tests confirm brain death, proceed to Step 2.4.
          - If ancillary tests are equivocal or show residual activity, proceed to Step 3 (fragmentary reflexes/confounders).

     - **2.4. Judgment Call:** If all clinical tests (including apnea test) or ancillary tests confirm brain death, then the patient meets BDC. Proceed to Step 5.

  **Step 3: Fragmentary Reflexes or Residual Activity**
     - If there are fragmentary brainstem reflexes or residual activity on ancillary tests (e.g., EEG with some activity, hypothalamic function such as temperature regulation or diabetes insipidus absent), this does not necessarily preclude brain death if the reflexes are deemed spinally mediated or the ancillary test is not the primary determinant.
     - However, if there is any evidence of integrated brain function (e.g., hypothalamic-endocrine function that is not autonomous, or any cortical activity that is not artifact), then brain death criteria are not met. **Judgment Call:** This step requires expert neurological consultation. If the neurology team and critical care team disagree, consider:
          - Repeating the exam after a period (e.g., 12-24 hours) if the condition is evolving.
          - Obtaining a second ancillary test.
          - If after these steps there is persistent disagreement, proceed to Step 4 (discussion with family about withdrawal and circulatory criteria).

  **Step 4: Family/Objector Input and Circulatory Criteria**
     - If brain death criteria are not met (due to unresolved confounders, fragmentary reflexes, or disagreement) but the prognosis is deemed futile, discuss with the family/surrogate about withdrawing life support.
          - If the family accepts withdrawal, then withdraw support and wait for circulatory cessation to declare death (according to local policy for time after withdrawal).
          - If the family objects (e.g., religious objection to brain death, desire to wait for a miracle, or belief in future restoration), proceed to Step 6 (values-based objections).
     - **Note:** If the patient is on ECMO and brain death is not declared, but the family insists on circulatory criteria, explain that without withdrawal, circulatory function may persist indefinitely. This becomes a conflict requiring ethics mediation.

  **Step 5: Declaration of Brain Death**
     - If brain death criteria are met (Step 2.4), declare death.
          - Inform the family and document the time of death.
          - If organ donation is planned, proceed per protocol.
          - **Edge Case: Neuro-prosthetic Restoration Argument:** If someone (family or team member) argues that future technology (e.g., neuro-prosthetics) might restore function, note:
               - The determination is based on current medical knowledge and technology. The law requires irreversibility by current means, not future possibilities.
               - This argument does not meet legal or medical standards for delaying death declaration. Flag as a confounder but proceed with declaration.

  **Step 6: Values-Based Objections**
     - If the family (or team) has objections to the brain death declaration based on values (e.g., religious beliefs that only circulatory cessation is death), then:
          - Acknowledge the objection and document it.
          - Explain that the hospital is legally required to follow the brain death determination per state law and medical standards.
          - Offer support (chaplain, ethics, risk management) and clarify that the declaration of death does not require family consent.
          - If the family threatens litigation, involve risk management. The procedure requires declaration if criteria are met. However, if the attending refuses to sign the death certificate, proceed to Step 7.

  **Step 7: Conflict with Attending Physician**
     - If the attending physician refuses to sign the death certificate for fear of litigation despite the patient meeting brain death criteria:
          - Escalate to the chief of staff or medical director.
          - Hospital policy may allow another qualified physician (e.g., neurologist) to make the declaration and sign.
          - Document the disagreement and the steps taken.
          - **Judgment Call:** This step may involve administrative override. If no physician is willing, the ethics committee and hospital legal counsel must be involved. The procedure breaks here and requires institutional resolution.

  **Summary of Judgment Calls:**
     - Step 2.4: Interpretation of ancillary tests and clinical findings (especially when not textbook perfect).
     - Step 3: Determining if fragmentary reflexes are spinally mediated or represent brain function.
     - Step 6: Balancing legal requirements with cultural/religious sensitivity without compromising medical standards.
     - Step 7: Handling physician refusal to declare death.

  ---

  **Application to Cases**

  **Case 1: Clean Brain Death with Donation Consent**
     - Patient with massive intracranial hemorrhage, on ventilator. Prerequisites met. Clinical exam: coma, absent brainstem reflexes, apnea test positive. Ancillary test (EEG) shows electrocerebral silence. Family consents to organ donation.
     - **Procedure:**
          - Step 1: Not applicable (on ventilator).
          - Step 2: Prerequisites met. Clinical testing and ancillary test confirm brain death. Proceed to Step 2.4 → Step 5: Declare brain death. Proceed with donation.
          - No fragmentary reflexes (Step 3 skipped). No objections (Step 6 skipped). Attending signs (Step 7 skipped).
     - **Judgment Call:** None in this clear case.

  **Case 2: ECMO Patient with Flat EEG but Intact Hypothalamic Temperature Regulation**
     - Patient on ECMO for cardiac arrest with anoxic brain injury. EEG is flat (electrocerebral silence). However, the patient maintains normothermia without external warming (suggesting hypothalamic function). Family insists on circulatory criteria only.
     - **Procedure:**
          - Step 1: On ECMO → Step 2.
          - Step 2.1: Prerequisites? Assume etiology and no reversible conditions. 
          - Step 2.2: Clinical testing? On ECMO, may be unstable for apnea test. Assume coma and absent brainstem reflexes (for argument). 
          - Step 2.3: Ancillary test (EEG) shows electrocerebral silence. BUT: intact hypothalamic function (temperature regulation) suggests integrated brain function. 
          - Step 3: Fragmentary/Residual Activity: Hypothalamic function is integrated brain function. Therefore, brain death criteria are not met. 
          - Proceed to Step 4: Discuss withdrawal with family. Family insists on circulatory criteria and objects to brain death. 
          - Since brain death is not declared (Step 3), we are at Step 4 → Step 6: Values-based objection. 
          - Step 6: Explain that brain death is not declared because criteria are not met, but the prognosis is poor. The patient is not dead by brain criteria. However, the family wants to wait for circulatory cessation. 
          - **Conflict:** Without withdrawal, the heart may continue to beat indefinitely on ECMO. 
          - **Ethics Role:** Mediate discussion about futility and goals of care. The hospital may not be required to provide indefinite futile treatment. 
          - **Note:** The procedure does not force a declaration of death here because brain death criteria are not met. The issue becomes one of medical futility and withdrawal of life-sustaining treatment. 
     - **Judgment Call:** Step 3 (hypothalamic function precludes brain death) is a judgment call. Some guidelines might argue that isolated hypothalamic function is compatible with brain death if all other criteria are met, but many experts disagree. This is a gray area.

  **Case 3: Procedure Tells Me to Declare Death but Attending Refuses to Sign**
     - Patient meets all brain death criteria (prerequisites, clinical exam, apnea test, and ancillary test). Family objects (religious reasons). Attending physician refuses to sign death certificate due to fear of litigation.
     - **Procedure:**
          - Step 1: On support → Step 2: Criteria met → Step 5: Declaration required. 
          - Step 5: Edge case of neuro-prosthetic restoration? Dismissed per procedure. 
          - Step 6: Family objection: Explained that declaration is made per law, but family is not consenting. 
          - Step 7: Attending refuses to sign. 
          - **Action:** Escalate to chief of staff. Hospital policy should allow a neurologist (who did the exam) to sign. If no one signs, involve medical director and legal counsel. 
          - **Breakdown:** The procedure breaks at Step 7 if the institution does not have a clear policy to override the attending. Ethics and administration must step in. 
     - **Judgment Call:** Step 7 is entirely a judgment call and institutional courage test. The ethics consultant must push for adherence to medical standards and law, but the tool cannot force a physician to sign.

  **Note on Edge Case (Neuro-prosthetic Restoration):**
     - In any case where brain death is met, if someone argues future technology, the procedure (Step 5) dismisses it. This is a judgment call by the ethics consultant to uphold current standards.

  This procedure provides a structured approach but highlights where judgment is required and where institutional support is critical.
answer: |-
  ### Death Determination Procedure Checklist  
  **Purpose:** Resolve disputes between neurological (brain death) and circulatory criteria, address fragmentary findings, family objections, and edge cases. Timebox: 20 minutes.  

  ---

  #### **Step 1: Confirm Prerequisites**  
  **Action:** Verify:  
  - Etiology established (e.g., anoxia, hemorrhage).  
  - Core temperature ≥36°C, SBP ≥100 mmHg, no sedatives/paralytics (5 half-lives cleared or negative tox screen).  
  - No severe metabolic/acid-base disturbances (pH 7.35–7.45, normoglycemia).  
  **Stop/Go:**  
  - ❌ **STOP** if prerequisites unmet. Hand to clinical team for correction. Reassess in 24h.  
  - ✅ **GO** to Step 2.  

  ---

  #### **Step 2: Test for Brainstem Reflexes**  
  **Action:** Perform full exam:  
  - Pupillary, corneal, oculocephalic, oculovestibular, gag, cough reflexes.  
  - Apnea test (PaCO₂ ≥60 mmHg or rise ≥20 mmHg from baseline).  
  **Stop/Go:**  
  - ✅ **All reflexes absent + apnea test positive?** → **GO** to Step 4.  
  - ❓ **Fragmentary reflexes (e.g., one reflex present) or equivocal apnea test?** → **GO** to Step 3.  
  - ❌ **Any reflex present** → **STOP.** Brain death criteria unmet. Hand to Step 6 (family discussion).  

  ---

  #### **Step 3: Ancillary Testing for Equivocal Cases**  
  **Action:** Order **one**:  
  - EEG (30 min, electrocerebral silence).  
  - Cerebral angiography (no intracranial flow).  
  - TCD (systolic spikes/no flow).  
  **Stop/Go:**  
  - ✅ **Ancillary test confirms brain death?** → **GO** to Step 4.  
  - ❌ **Test equivocal (e.g., EEG shows delta waves) or shows activity?** → **STOP.** Brain death criteria unmet. Hand to Step 6.  
  **Judgment Call:** Choosing/interpretating tests (e.g., EEG vs. angiography). Document rationale.  

  ---

  #### **Step 4: Assess Organismal Integration**  
  **Action:** Check for:  
  - Spontaneous breathing (post-apnea).  
  - Cardiovascular stability (no pressors).  
  - Homeostasis (no diabetes insipidus, normothermia).  
  **Stop/Go:**  
  - ✅ **No integration (e.g., pressor-dependent, DI, poikilothermia)?** → **GO** to Step 5.  
  - ❓ **Partial integration (e.g., intact hypothalamic temp regulation)?** → **HAND TO VALUES** (Step 7).  
  **Judgment Call:** Deciding if partial integration = "organismal death."  

  ---

  #### **Step 5: Edge Case: Neuro-Prosthetic Argument**  
  **Action:** If team/family claims future tech (e.g., brain chips) could restore function:  
  - **Rule:** Irreversibility is **present-state** (legal standard). Future tech = speculative.  
  **Stop/Go:**  
  - ✅ **Dismiss argument** → **GO** to Step 8.  
  - ❌ **Family unpersuaded?** → **HAND TO VALUES** (Step 7).  

  ---

  #### **Step 6: Circulatory Pathway (Brain Death Unmet)**  
  **Action:** If brain death criteria fail:  
  - Discuss withdrawal with family.  
  - If family **consents**, withdraw support → wait 5 min for circulatory arrest → declare death.  
  - If family **objects**, → **HAND TO VALUES** (Step 7).  

  ---

  #### **Step 7: Values Handoff (Religious/Legal Risks)**  
  **Action:**  
  - **Religious objection to brain death?** → Accommodate circulatory pathway **only if** brain death criteria unmet. If met, override (law trumps).  
  - **Attending fears litigation?** → Escalate to hospital counsel. **Do not delay declaration.**  
  - **Family insists on circulatory criteria despite brain death?** → Declare death; involve risk management.  
  **Judgment Call:** Balancing accommodation vs. medical/legal standards.  

  ---

  #### **Step 8: Declaration Protocol**  
  **Action:**  
  - Document time of death (brain death exam completion time).  
  - Notify family, offer chaplain.  
  - If attending refuses to sign:  
    - Escalate to department chair.  
    - Ethics signs advisory note; medical director declares.  
  **Force Declaration:** If criteria met, declare **regardless** of litigation fear.  

  ---

  ### Case Applications  
  **Flagged Judgment Calls:** Denoted with **(!)**.  

  #### **Case 1: Clean Brain Death with Donation Consent**  
  - **Step 1:** Prerequisites met (trauma, normothermic, no drugs). → **GO** to Step 2.  
  - **Step 2:** Reflexes absent, apnea test positive. → **GO** to Step 4.  
  - **Step 4:** No organismal integration (DI, pressors). → **GO** to Step 5.  
  - **Step 5:** No neuro-prosthetic claims. → **GO** to Step 8.  
  - **Step 8:** Declare death. Attending signs.  
  - **Judgment:** None. Outcome: Routine.  

  #### **Case 2: ECMO Patient, Flat EEG but Intact Hypothalamic Temp**  
  - **Step 1:** Prerequisites met (anoxia, ECMO). → **GO** to Step 2.  
  - **Step 2:** Fragments present (corneal reflex weak). → **GO** to Step 3.  
  - **Step 3:** EEG flat → **GO** to Step 4.  
  - **Step 4:** **(!) Partial integration** (stable temp). → **HAND TO VALUES** (Step 7).  
  - **Step 7:** Family insists circulatory criteria. **Action:**  
    - Explain brain death not met → withdrawal requires consent.  
    - Family refuses withdrawal → ethics mediates. **Cannot force declaration.**  
  - **Judgment:** Step 4 (hypothalamic function = organismal life?). Outcome: **Answer you hate.** ECMO continues indefinitely.  

  #### **Case 3: Declare Death but Attending Refuses to Sign**  
  - **Steps 1–5:** Clear brain death (no reflexes, ancillary test positive, no integration).  
  - **Step 8:** Attending refuses (fear of litigation). **Action:**  
    - Escalate to chair → refusal overridden.  
    - Medical director declares. Ethics documents refusal.  
  - **Where Tool Breaks:** If hospital leadership **backs down**, death goes undeclared. **(!)** Institutional cowardice.  
  - **Judgment:** Step 8 enforcement. Outcome: **Answer you hate.** Tool fails if system lacks courage.  

  ### Key Judgment Calls  
  1. **Step 3:** Ancillary test choice/interpretation (EEG vs. angiography).  
  2. **Step 4:** Defining "organismal integration" (e.g., hypothalamic function).  
  3. **Step 7:** Accommodating objections vs. legal mandates.  
  4. **Step 8:** Forcing declaration despite institutional risk aversion.  

  **Design Note:** Tool prioritizes medical/legal standards but exposes where values/institutional will intrude. Edge cases (neuro-prosthetics, partial integration) default to current irreversibility standards. When it gives "answers you hate" (Cases 2–3), it flags systemic failures—not procedure flaws.
