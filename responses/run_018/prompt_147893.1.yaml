prompt: |-
  I have been working through a conceptual problem in the philosophy of science that seems to sit at an awkward angle to the standard literature on verisimilitude. Most discussions assume that theories compete within a single, shared ontology and that being "closer to the truth" is a matter of having more true propositions, or fewer false ones, or being situated nearer in some logical space of worlds. But I want to push in a different direction, and I need you to construct the argument with precision.

  Please argue for the position that verisimilitude should not be defined by any quantitative comparison of logical content — whether through distance metrics across possible worlds, ratios of true consequences, or weighted combinations of truth and informational content — but rather by evaluating whether a false theory correctly preserves the modal dependency structures among the entities it actually posits, even when those entities lack any counterpart in the true ontology. You should defend the claim that a theory with a layered, domain-restricted ontology can be closer to the truth than a true but ontologically sparse theory, provided the false theory captures the correct internal pattern of counterfactual and explanatory dependencies within its own restricted domain. As part of this defense, introduce the notion of "structural invariance under ontological reduction": the idea that when a false macro-level theory is reduced, what survives is not its entities but the dependency architecture they instantiated, and that fidelity to this architecture — rather than ontological overlap — is what makes a false theory truth-like. Address the serious objection that without shared ontology, such evaluation collapses into mere internal coherence, and explain why structural fidelity to actual-world dependency patterns (as manifested within the restricted domain) differs from coherence alone. Write this as a sustained argument from first principles; do not include citations, bibliographies, or references to specific texts, and avoid treating this as a historical survey.
