answer: |-
  ### Brainstorm: Key Analogies & Mismatches  
  **Analogies:**  
  - **Brain as Coordinator Node:** Orchestrates quorum (consciousness, respiration regulation).  
  - **Heart/Lungs as Worker Nodes:** Autonomous but report to coordinator (heartbeat/respiration as heartbeats).  
  - **Irreversible Failure:** Permanent node failure ≈ biological irreversibility.  
  - **Split-Brain:** Brainstem death with intact cortex ≈ coordinator failure while workers run.  
  - **Quorum Requirements:** Integrative unity requires coordinator + workers synchronized.  

  **Mismatches:**  
  - **Irreversibility:** Medical irreversibility ≠ computational irreversibility (e.g., no "reboot" in biology).  
  - **Personhood vs. Organism:** Distributed systems lack "personhood" ontology.  
  - **Normative Weight:** "Death" verdicts have ethical stakes absent in cluster failures.  

  ---

  ### Translation: Death Criteria in Distributed Systems Terms  
  **System Architecture:**  
  - **Coordinator Node (CNS):** Brain (brainstem required for quorum).  
  - **Worker Nodes:** Heart (primary), Lungs (secondary), with local feedback loops (e.g., myocardial automaticity).  
  - **Cluster Health:** Requires coordinator election success + worker heartbeats.  

  **Brain Death (Whole-Brain Criterion):**  
  > Coordinator node suffers irrecoverable Byzantine fault (e.g., massive data corruption). No leader election is possible despite worker nodes (heart/lungs) continuing local operations via external power (ventilator). Heartbeat timeouts occur between coordinator and workers, but worker-worker heartbeats persist. A quorum of subsystems (cortex, brainstem) permanently offline. **Verdict:** Cluster failure due to coordinator loss, even if worker nodes are artificially maintained.  

  **Circulatory Death (Cardiopulmonary Criterion):**  
  > Worker nodes (heart/lungs) experience cascading failure. Heartbeat timeouts propagate, triggering irreversible worker shutdown. Coordinator node (brain) loses quorum with workers. No split-brain state occurs because failure is global. **Verdict:** Cluster failure due to loss of all critical worker nodes.  

  **Network Partition Scenario (e.g., Locked-in Syndrome):**  
  > Coordinator node functional but isolated—unable to broadcast signals (no heartbeat ACKs). Workers operational but disconnected. **Not death:** Coordinator recovery possible; no quorum loss.  

  **Split-Brain Risk (Decapitation Scenario):**  
  > Coordinator destroyed, but workers may transiently function. Systems avoid split-brain by mandating coordinator-dependent quorum.  

  ---

  ### Residue Report: Philosophical Claims & Systems Mapping  
  | **Philosophical Claim**               | **Mapping Status**                              | **Notes**                                                                 |
  |----------------------------------------|-------------------------------------------------|---------------------------------------------------------------------------|
  | **Death of Person vs. Organism**       | ❌ No clean map                                 | Systems lack "personhood." Cluster failure maps only to organismic death. |
  | **Integrative Unity**                  | ✅ Clean map                                   | Quorum requires coordinator (brainstem) for global state synchronization. |
  | **Irreversibility (Medical)**          | ⚠️ Partial map (with distortion)              | "Permanent failure" ≈ timeout + no failover. *But* no biological "rollback" exists—distorts irreversibility as configurable timeout. |
  | **Heart-Beating Brain-Dead Body = Dead?** | ✅ Expressible, but contentious              | **Systems:** Coordinator failure + artificial worker sustenance = zombie cluster. **Medicine:** Asserts this is cluster failure (not partition) due to lost integration. Reveals ontological commitment: brain is *necessary* quorum member. |
  | **Normative Weight of Declaration**    | ❌ No counterpart                              | Cluster failure verdicts lack ethical gravity; purely technical.          |  
  | **Byzantine Faults (e.g., false positives)** | ✅ Clean map                                | Medical tests for brain death must tolerate biological "Byzantine" errors (e.g., residual electrical noise ≠ function). |  

  ### Key Revelations from Unmapped Residues:  
  1. **Irreversibility Distortion:** The inability to map "no rollback" exposes medicine’s reliance on *empirical* irreversibility (physiological collapse), not just logical permanence.  
  2. **Personhood Gap:** The untranslatable "death of the person" reveals medicine’s biological-ontological commitment—death is organismic failure, not consciousness loss.  
  3. **Zombie Cluster Tension:** Calling a heart-beating brain-dead body "dead" maps to declaring cluster failure without all nodes failing. This is *expressible* but contentious in systems terms (cf. debates on coordinator-critical systems). It reflects medicine’s view that the brain is the *sine qua non* integrator.  

  **Conclusion:** Distributed systems analogies clarify mechanistic integration but cannot capture normative/ontological dimensions. The unmapped residues highlight medicine’s grounding in emergent biological unity, not just component failure.
