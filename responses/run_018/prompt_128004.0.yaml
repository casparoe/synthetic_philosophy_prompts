prompt: |-
  Hi, I'm an education officer at a regional museum and I keep having to approve these "Then vs Now" display panels for school groups — probably do two or three a week, sometimes on a Friday afternoon with half an hour to sign off before the printers need it. The problem is they always slip into writing the past as if it was just fumbling foward us, like every old law or custom was an incomplete version of what we have now. I need an actual decision proceduer I can run in about ten minutes on a draft panel: the questions in order, what counts as passing or failing each one, where it stops with a "rewrite this," and where it has to hand over to my own judgement because it's a values call not a factual one.

  Ground it in the philosophy-of-history stuff on Whig history — specifically keep the distinction between using present knowledge to explain what happened (fine) and using it to rank the past as inferior (not fine), plus that convergence-fallacy vs value-transference distinction — but drop anything that needs me to actually know historiography. Make it usable by someone without a philosophy degree.

  Then apply it to three draft panels: one on 19th-century sanitation reform that frames old sewer systems as "not yet understanding germs"; one on voting-rights history that treats earlier restrictions as simply "backward" rather than coherent with different political values; and one on the adoption of the metric system where I think the checklist will say it's okay but I'll still hate the answer — probably because standardisation is technically progressive with no moral cost, or whatever. Make sure one gives me an answer I genuinely won't like.

  Also flag exactly where the proceduer will misfire, and where two reasonable people could run it on the same text and disagree. And please write the answer in British English — I'm in the UK office.

  Oh, and don't ask me for a bibliography or specific authors to read; just build it from the concepts themselves.
reasoning: |-
  Okay, let me tackle this query from a UK museum education officer. They're struggling with "Then vs Now" display panels that frame history as linear progress, needing a practical 10-minute checklist grounded in Whig history critique without academic jargon. 

  First, I'll distill the core philosophical pitfalls: presentism (judging past by current standards), convergence fallacy (assuming past inevitably led to now), and value transference (imposing modern morals). The checklist must separate using present knowledge to explain (acceptable) from ranking past as inferior (problematic).

  For the procedure itself, I'm considering a 4-step flow: 
  1) Identify the "Now" claim - does it imply present superiority?
  2) Check for loaded language - words like "primitive" or "not yet" trigger rewrites
  3) Assess if alternatives are acknowledged - were historical choices coherent within their context? 
  4) Verify if benefits/costs are balanced - does it show trade-offs of past decisions?

  Each step needs clear pass/fail criteria. For instance, Step 2 fails if it uses progress-implying terms without quotation marks indicating modern perspective. But I'll flag that Step 3's "coherent alternatives" test is where subjectivity creeps in - reasonable people might disagree on what constitutes sufficient context.

  Now applying this to their examples:
  - The sanitation panel saying "not yet understanding germs" fails Step 2 due to "not yet" implying inevitable progress. Better framing: "Based on miasma theory, which didn't account for microscopic pathogens we now know cause disease."
  - The voting rights panel labeling restrictions as "backward" fails both Step 1 (value judgment) and Step 3 (ignoring period-specific concepts of citizenship). Alternative: "Restrictions reflected contemporary views of political participation that excluded groups now considered eligible."
  - The metric system panel passes all steps technically - standardization is measurable progress without moral dimension. But I'll validate their discomfort: it still feels reductive because it omits cultural resistance or transition costs, showing the checklist's limitation in capturing nuance.

  Key caveats: 
  - The coherence test (Step 3) is inherently subjective
  - "Loaded language" detection depends on the reviewer's sensitivity
  - Technically correct panels might still feel unsatisfying if they reduce complex history to binary progress narratives

  The output will use British spelling ("standardisation", "labour") and avoid academic references per request. For the metric system example, I'll explicitly note that while it passes the checklist, its tone might merit revision for educational richness - that's the discretionary "values call" point.
answer: |-
  Here’s a **10-Minute Whig-History Spot-Check Procedure** for your display panels, grounded in core concepts but stripped of jargon. Follow these steps in order—if a draft fails any step, it requires rewriting before approval. British English used throughout.

  ---

  ### **The Procedure: 4 Key Questions**  
  *(Time: 2–3 mins per question)*  

  1. **QUESTION 1: DOES IT IMPLY "THE PAST WAS TRYING TO BE US"?**  
     *Check for:* Words like "not yet", "incomplete", "early attempts", "only later", "failed to", or "without our understanding".  
     **PASS:** Explains past actions using modern knowledge *without* judging them as deficient (e.g., "19th-century doctors prioritised ventilation due to miasma theory; we now know pathogens spread differently").  
     **FAIL:** Suggests the past was "working toward" the present (e.g., "They *did not yet understand* germ theory"). **→ REWRITE.**  

  2. **QUESTION 2: DOES IT USE LOADED LANGUAGE?**  
     *Check for:* Value-laden terms like "backward", "primitive", "regressive", "unenlightened", or "flawed" to describe past systems.  
     **PASS:** Neutral terms framing past choices as *coherent within their context* (e.g., "Voting eligibility reflected contemporary views of property and social order").  
     **FAIL:** Implies moral/intellectual inferiority (e.g., "Backward voting laws excluded women"). **→ REWRITE.**  

  3. **QUESTION 3: DOES IT ACKNOWLEDGE ALTERNATIVE LOGICS?**  
     *Check for:* Recognition that past societies had *internally consistent* values (even if we now disagree).  
     **PASS:** Shows *why* choices made sense then (e.g., "Restricted suffrage aimed to limit electoral corruption as then defined").  
     **FAIL:** Presents past norms as arbitrary "mistakes" (e.g., "They foolishly denied votes to working people"). **→ REWRITE.**  

  4. **QUESTION 4: ARE BENEFITS/COSTS BALANCED?**  
     *Check for:* Trade-offs. Does it admit *present drawbacks* or *past advantages*?  
     **PASS:** Notes compromises (e.g., "Metric standardisation improved trade but eroded local measurement traditions").  
     **FAIL:** Implies linear improvement with no downsides (e.g., "Adopting metric was a clear upgrade"). **→ HAND OVER TO YOUR JUDGEMENT.**  
     *Why?* Trade-offs involve values (e.g., efficiency vs. cultural loss). You decide if the framing is fair.  

  ---

  ### **Applied to Your Draft Panels**  
  *(Using the procedure above)*  

  1. **19th-Century Sanitation Draft**  
     *Text: "Victorian sewers were inefficient because they did not yet understand germs."*  
     - Q1: **FAIL** ("not yet understand" implies inevitable progress).  
     - *Stop here.* **REWRITE.**  
     *Fix suggestion:* "Victorian sewers prioritised waste removal via water flow, aligning with miasma theory. Modern epidemiology later revealed pathogens required different containment."  

  2. **Voting-Rights History Draft**  
     *Text: "Pre-20th century voting restrictions seem backward today, excluding women and the poor."*  
     - Q1: Pass (no "not yet").  
     - Q2: **FAIL** ("backward" is loaded).  
     - *Stop here.* **REWRITE.**  
     *Fix suggestion:* "Historical voting qualifications emphasised property ownership, reflecting beliefs that stakeholding ensured informed citizenship. Contemporary movements successfully challenged this view."  

  3. **Metric System Adoption Draft**  
     *Text: "The metric system’s adoption marked a necessary step toward global scientific progress, replacing chaotic imperial units."*  
     - Q1: Pass (no "not yet").  
     - Q2: Pass (no explicit slurs).  
     - Q3: **FAIL** (Imperial units framed as "chaotic", ignoring their local practicality).  
     - Q4: **HAND OVER TO YOU.**  
     *Your judgement call:* While metric *is* objectively better for standardisation, calling imperial units "chaotic" dismisses their historical utility. **→ Revise for balance** (e.g., "Metric standardisation eased global trade, though it replaced locally embedded measurement systems").  
     *Why you’ll hate it:* Technically "correct" progress narratives still feel reductive. The checklist passes it to you precisely because "necessary step" implies inevitability—a values call.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Ambiguous Language:**  
     - E.g., "outdated" could be factual (e.g., "outdated technology") or judgemental ("outdated morals"). Two reviewers might disagree.  
  2. **Implied Superiority:**  
     - A panel might pass Q1-Q3 but still imply present supremacy through tone (e.g., "Thankfully, we now..."). This relies on your instinct.  
  3. **"Hard" Progress Cases:**  
     - Like your metric example: measurable improvements (sanitation, lifespans) *can* be framed as progress without Whiggishness—but risk sounding triumphalist. The checklist forces you to arbitrate.  

  ### **Critical Weakness**  
  The procedure can’t resolve **value conflicts masked as facts**. For example:  
  > *"Universal suffrage is an objectively superior democratic model."*  
  This passes Q1-Q3 if dispassionately worded—but still imposes modern values. You must intervene when claims conflate *technical efficacy* (e.g., metric precision) with *moral superiority* (e.g., democracy models).  

  ---  
  **Final Tip:** Keep this flowchart on your desk:  
  **Q1 (Not yet?) → REWRITE** | **Q2 (Loaded?) → REWRITE** | **Q3 (Context?) → REWRITE** | **Q4 (Trade-offs?) → YOUR CALL**.  
  Most failures are caught by Q1/Q2. Save your energy for Q4 judgements.
