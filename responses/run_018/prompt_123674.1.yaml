  ### Formal Diagnostic Taxonomy: The Reducibility of Knowing-How to Knowing-That  
  **Core Theme**: Procedural Calibration — the thesis that some skills involve a continuous, non-representational tuning between agent and environment that does not map onto discrete beliefs.  

  #### Branching Decision Tree  
  *Instructions: Answer each question based on concrete judgments about cases or claims, without referencing named philosophical positions. The tree terminates in one of five leaves, each explicitly characterized regarding the irreducibility of procedural calibration (PC).*  

  1. **Amnesia Case**: After total explicit amnesia for all rules and instructions governing a task, a subject retains smooth, expert performance. Does this subject still know how to perform the task?  
     - **(a) No** → Proceed to 2.  
     - **(b) Yes** → Proceed to 3.  

  2. **Single Failure Falsification**: After years of consistent success, a single surprising failure occurs during task execution (e.g., a master pianist hitting a wrong note mid-concerto). Does this failure falsify the claim that the agent knows how to perform the task?  
     - **(a) Yes** → **Leaf E: Unoccupied Combination** (diagnosis below)  
     - **(b) No** → **Leaf A: Pure Intellectualism**  

  3. **Nerve Damage Case**: A skilled agent suffers nerve damage that forces a completely different physical execution of the same task (e.g., a violinist relearning with reversed finger positioning). What happens to the original knowing-how?  
     - **(a) Survives intact** → Proceed to 4.  
     - **(b) Transforms** → **Leaf C: Intermediate Position**  
     - **(c) Disappears** → **Leaf E: Unoccupied Combination** (diagnosis below)  

  4. **Acquisition Difference**: Compare two agents learning the same skill. Agent 1 internalizes explicit rules (e.g., memorizing chess strategies). Agent 2 learns through calibrated trial-and-error without articulating rules (e.g., intuitive chess practice). Is there an epistemic difference in the kind of knowledge acquired?  
     - **(a) Yes** → **Leaf B: Ryle-Style Anti-Intellectualism**  
     - **(b) No** → **Leaf D: Deflationary View**  

  ---

  #### Leaf Characterizations  
  *Each leaf is defined by its stance on procedural calibration (PC): whether it accepts, modifies, or rejects PC's irreducibility.*  

  - **Leaf A: Pure Intellectualism**  
    - **Stance on PC**: Rejects irreducibility.  
    - **Description**: All knowing-how consists in propositional knowing-that combined with practical application. Skills reduce to discrete beliefs and their execution; there is no role for non-representational tuning.  
    - **Path**: Q1(a) → Q2(b)  

  - **Leaf B: Ryle-Style Anti-Intellectualism**  
    - **Stance on PC**: Accepts irreducibility.  
    - **Description**: Knowing-how is an ability or disposition that can exist without corresponding propositional knowledge. Skills inherently involve non-representational calibration between agent and environment.  
    - **Path**: Q1(b) → Q3(a) → Q4(a)  

  - **Leaf C: Intermediate Position**  
    - **Stance on PC**: Modifies irreducibility (rejects non-representationality).  
    - **Description**: Knowing-how has a distinctive phenomenal or first-personal mode of presentation but remains factive and representational. Calibration is acknowledged as a unique mode of awareness but is subsumed under representational content.  
    - **Path**: Q1(b) → Q3(b)  

  - **Leaf D: Deflationary View**  
    - **Stance on PC**: Rejects irreducibility.  
    - **Description**: The knowing-how/knowing-that distinction is a linguistic artifact; both collapse into generic competence. Calibration is neither unique nor irreducible, as all knowledge is grounded in adaptable, goal-directed success.  
    - **Path**: Q1(b) → Q3(a) → Q4(b)  

  - **Leaf E: Unoccupied Combination**  
    - **Stance on PC**: N/A (unoccupied position).  
    - **Path 1 Diagnosis (Q1(a) → Q2(a))**: *Incoherent*. Affirms that amnesia destroys knowing-how (implying dependence on propositional knowledge) but treats a single failure as falsifying (implying knowing-how is brittle like propositional justification). This conflates the anti-resilience of explicit knowledge with the stability expected of skills.  
    - **Path 2 Diagnosis (Q1(b) → Q3(c))**: *Unstable*. Asserts knowing-how survives amnesia (suggesting non-propositional resilience) but disappears after nerve damage (suggesting hyper-sensitivity to physical change). This vacillates between robustness and fragility without a principled basis, ignoring how calibration typically adapts to bodily disruptions.  

  ---

  #### Notes on Taxonomy  
  - **Indistinguishable Leaves**: The tree successfully separates all five leaves. No two leaves share an identical path.  
  - **Unoccupied Combinations**:  
    - **Q1(a) → Q2(a)** (Leaf E): Incoherent for reasons above.  
    - **Q1(b) → Q3(c)** (Leaf E): Unstable for reasons above.  
