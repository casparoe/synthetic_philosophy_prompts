prompt: |-
  I'm a senior eng lead at a consumer software company, and the same argument keeps coming up in every roadmap review: is this a normal competitive decision or are we sliding into a race to the bottom? The usual suspects: aggressive re-engagement notifications, auto-opting users into data collection, matching a competitor's release cadence because they obviously cut QA, endless engagement metrics everyone privately agrees make the product worse. I've read a little about Moloch and multipolar traps — the idea that seperate actors can each make individually rational moves and the group ends up somewhere no one actually wanted, and no single actor can unilaterally stop without losing. I want that turned into something my team can use, not just something I bring up in debates.

  Please write me a decision procedure — ideally a set of questions we ask in order — that my team can run in under an hour on any proposed feature or practice to decide whether it's the kind of Moloch / race-to-the-bottom situation we should treat as a trap. The people using it are engineers and one PM; assume no philosophy background. For each question, say what counts as a good enough answer to keep going, where the procedure stops with "this is a trap here" or "this is fine," and where it has to punt to a human because the question is really about values or market prediction rather than something a checklist can settle. The procedure has to distinguish "we're doing this because its genuinely better for users" from "we're doing this because if we don't someone else will eat our lunch," and it also needs to handle the honest case where those are both true at once. It should end in a one-page go/no-go a product lead can sign off on, and flag privacy-adjacent steps for legal as a separate line.

  Then run the procedure on three cases:

  1. A competitor shipped a "daily streak" notification that spikes retention, and our PM wants to copy it. Our data says most people pulled back by streaks don't end up more satisfied long-term, but it does lift DAU.
  2. Auto-enrolling users into telemetry collection for "product improvement," with the opt-out buried in settings.
  3. Matching a competitor's two-week release cadence, which our own postmortems say will mean cutting the QA cycle roughly in half.

  For the worked examples, be explicit about which step each case trips or passes, and make sure at least one of them comes out "don't do it" even if it happens to be the one I'd personally want to ship.
reasoning: |-
  We are designing a decision procedure to identify "Moloch traps" or "races to the bottom". The key characteristics of such traps are:
  - Individually rational for each actor to participate (because if you don't, you lose)
  - But collectively leads to a worse outcome for everyone (including the actors themselves) than if they had coordinated to avoid it.

  The procedure must:
  - Be usable by engineers and a PM in under an hour.
  - Distinguish between "genuinely better for users" and "we have to because of competition".
  - Handle when both are true.
  - End with a one-page go/no-go for a product lead, and flag privacy issues for legal.

  We will create a step-by-step checklist with questions. Each question has:
    - Criteria for passing (continue to next step)
    - Criteria for failing (stop and flag as a trap)
    - Criteria for punting (requires human judgment because it's about values or market)

  We'll structure the procedure as follows:

  **Step 1: User Benefit**
    - Question: "Is this feature/practice likely to provide a net positive benefit to the user experience, independent of competitive pressure?"
    - Pass: Evidence that the feature improves user satisfaction, solves a real problem, or adds value without significant downsides. (If yes, continue to Step 2)
    - Fail: Evidence that the feature is primarily for extracting more engagement or data without clear user benefit, or that it degrades the user experience. (If fail, note it and go to Step 3 to check if it's a trap)
    - Punt: If the user benefit is ambiguous or mixed, but there are other factors. (Then continue to Step 2, but note the ambiguity)

  **Step 2: Competitive Necessity**
    - Question: "Is this feature/practice necessary to remain competitive in the market, regardless of its user benefit?"
    - Pass: Evidence that not doing it would lead to significant loss of market share, revenue, or user base. (Continue to Step 3)
    - Fail: The feature is not critical for competition; we have other advantages. (Then if Step 1 passed, it's probably fine; if Step 1 failed, then we might avoid. But we go to Step 3 for a trap check regardless.)
    - Punt: It's unclear how much competitive pressure exists. (Continue to Step 3)

  **Step 3: Trap Identification (The Moloch Check)**
    - Question: "If every competitor (including us) adopted this practice, would the overall health of the market and user experience degrade? And are we forced into it because if we don't, we lose, even though we wish no one did it?"
    - Pass: The practice, even if widely adopted, would not degrade the market or user experience, or we are not forced into it because we can differentiate on other grounds. (Then if Step 1 passed, it's a go; if Step 1 failed but Step 2 passed, then it might be a necessary evil but not a trap. We then proceed to Step 4 for privacy.)
    - Fail: The practice, if widely adopted, would make the market worse for everyone (including the companies) and we are only doing it because we have no choice. (Flag as a trap and recommend against unless there's a strong countervailing reason. Then go to Step 4 for privacy if we still consider doing it.)
    - Punt: It's hard to predict the industry-wide effect. (Then we have to rely on Steps 1 and 2 and human judgment.)

  **Step 4: Privacy and Legal Check**
    - This step is not about the trap per se, but about legal compliance and ethical data practices. It runs in parallel or as a final check for any privacy-related issues.
    - Question: "Does this feature/practice involve user data, privacy, or terms of service changes that might be considered coercive, deceptive, or against emerging regulatory norms?"
    - If yes: Flag for legal review and note the risk. (This doesn't stop the procedure but adds a requirement for legal sign-off.)
    - If no: No further action.

  **Final Output:**
    - Combine the outcomes into a one-page summary with:
        * Step 1: User Benefit (Pass/Fail/Punt, with notes)
        * Step 2: Competitive Necessity (Pass/Fail/Punt, with notes)
        * Step 3: Trap Identification (Pass/Fail/Punt, with notes)
        * Step 4: Privacy Flag (Yes/No, with notes for legal)
    - Recommendation:
        - If Step 3 is Fail: Strongly recommend against (this is a trap).
        - If Step 3 is Pass and Step 1 is Pass: Recommended to proceed (good for users and not a trap).
        - If Step 3 is Pass, Step 1 is Fail, but Step 2 is Pass: This is a competitive necessity but not a trap. Proceed with caution and note that it's not user-beneficial.
        - If Step 3 is Punt: Requires higher-level decision based on business strategy and values.

  Now, let's apply the procedure to the three cases.

  ---

  **Case 1: Daily Streak Notification**

  *Step 1: User Benefit*
    - Our data says most people pulled back by streaks don't end up more satisfied long-term. So the net benefit to the user is negative or neutral at best. 
    - **Result: Fail** (because it doesn't provide a net positive benefit; it may even harm long-term satisfaction)

  *Step 2: Competitive Necessity*
    - The competitor's feature spikes retention (DAU). If we don't match, we might lose users to the competitor. 
    - **Result: Pass** (it seems necessary to remain competitive)

  *Step 3: Trap Identification*
    - If every app adopts daily streaks, users are bombarded with notifications that don't improve their satisfaction and might even cause burnout. The market becomes more about manipulating engagement than providing real value. We are forced into it because if we don't, we lose DAU. 
    - **Result: Fail** (this is a classic trap: individually rational but collectively destructive)

  *Step 4: Privacy and Legal Check*
    - Notifications don't inherently involve data collection, but if we are tracking user behavior to trigger these, it might be privacy-adjacent. However, the main issue is the notification itself. 
    - **Result: No flag for legal** (unless the notification uses sensitive data; in this case, it's about engagement, so probably not)

  *Summary for Case 1:*
    - Step 1: Fail
    - Step 2: Pass
    - Step 3: Fail (trap identified)
    - Step 4: No
    - **Recommendation: Don't do it** (it's a race to the bottom)

  ---

  **Case 2: Auto-enrolling users into telemetry collection, opt-out buried**

  *Step 1: User Benefit*
    - The argument is for "product improvement", which could lead to a better product. However, auto-enrollment with buried opt-out is not transparent and takes away user choice. The immediate user benefit is not clear (it's for the company's benefit). 
    - **Result: Fail** (it's a cost to the user in privacy and autonomy for the company's gain)

  *Step 2: Competitive Necessity*
    - Many companies do this to get more data. If we don't, we might have less data than competitors to improve our product. But is it necessary? It's hard to say without data on how much it helps. 
    - **Result: Punt** (it's common but not clear if it's critical for competition)

  *Step 3: Trap Identification*
    - If every company buries opt-outs and auto-enrolls users, the overall trust in software erodes. Users become wary and may disengage. Regulations (like GDPR) are already pushing against this. We are forced into it because if we are the only ones with an easy opt-in, we might get less data. 
    - **Result: Fail** (this is a trap: it leads to a worse environment for everyone)

  *Step 4: Privacy and Legal Check*
    - This is directly about data collection and consent. Burying the opt-out is against the spirit of many privacy regulations. 
    - **Result: Flag for legal** (high risk)

  *Summary for Case 2:*
    - Step 1: Fail
    - Step 2: Punt
    - Step 3: Fail (trap)
    - Step 4: Yes (legal flag)
    - **Recommendation: Don't do it** (it's a trap and legally risky)

  ---

  **Case 3: Matching competitor's two-week release cadence by cutting QA in half**

  *Step 1: User Benefit*
    - Cutting QA in half is likely to lead to more bugs and a worse user experience. The user benefit is negative. 
    - **Result: Fail** (because it degrades quality)

  *Step 2: Competitive Necessity*
    - The competitor is releasing faster and getting features to market quicker. If we don't match, we might fall behind in feature parity and lose users. 
    - **Result: Pass** (appears necessary to keep up)

  *Step 3: Trap Identification*
    - If every company cuts QA to release faster, the overall quality of software decreases. Users experience more bugs and instability. We are forced into it because if we don't release as fast, we might lose users to the competitor. 
    - **Result: Fail** (this is a trap: collectively, the industry ends up with lower quality)

  *Step 4: Privacy and Legal Check*
    - Not directly related to privacy. 
    - **Result: No flag**

  *Summary for Case 3:*
    - Step 1: Fail
    - Step 2: Pass
    - Step 3: Fail (trap)
    - Step 4: No
    - **Recommendation: Don't do it** (it's a race to the bottom)

  However, note: in reality, there might be ways to speed up releases without cutting QA (e.g., better automation). The procedure flags this specific proposal (which involves cutting QA) as a trap. But if the team can find a way to achieve the cadence without degrading quality, that would be different.

  ---

  We have all three cases as "don't do it", which aligns with the request to have at least one come out that way (and in fact all three are traps). 

  But note: the procedure is designed to catch these traps. In practice, if a proposal passes Step 1 (user benefit) and Step 3 (not a trap) then it would be approved. For example, a feature that is both good for users and not a trap would be a clear go.

  Let's create a quick example of a non-trap:

  **Hypothetical Case 4: Adding a dark mode feature**

  *Step 1: User Benefit*
    - Many users request it; it reduces eye strain and saves battery. 
    - **Pass**

  *Step 2: Competitive Necessity*
    - Many competitors have it, so it might be necessary to stay competitive. 
    - **Pass**

  *Step 3: Trap Identification*
    - If every app adds dark mode, the user experience is improved across the board. There's no degradation. 
    - **Pass** (not a trap)

  *Step 4: Privacy*
    - No data issues. 
    - **No flag**

  *Recommendation: Go*

  This would be approved.

  The procedure is now ready to be used.
answer: |-
  ### Moloch Trap Decision Procedure  
  A step-by-step checklist to identify "race-to-the-bottom" traps. Designed for **engineers and PMs** (no philosophy background needed). Timebox: **45-60 minutes** per feature.  

  ---

  #### **Step 1: User Benefit Check**  
  **Question:** *If competitors didn’t exist, would this still improve the user’s core experience or long-term satisfaction?*  
  - **Pass:** Clear evidence of user value (e.g., solves a pain point, adds meaningful functionality, aligns with user feedback).  
  - **Fail:** No net user benefit (e.g., exploits psychology, creates addiction, or degrades trust).  
  - **Punt:** Mixed evidence (e.g., short-term gain vs. long-term harm; requires PM judgment).  
  *→ Proceed to Step 2 if Pass/Punt. If Fail, skip to Step 3.*  

  #### **Step 2: Competitive Pressure Test**  
  **Question:** *Is this primarily a reaction to competitors? Would we lose users/revenue if we ignored it?*  
  - **Pass:** Data/metrics show clear risk of attrition (e.g., churn spikes after competitor moves).  
  - **Fail:** No evidence of competitive threat; we’re leading or the market is stable.  
  - **Punt:** Uncertain impact (e.g., speculative market shifts; requires PM/lead judgment).  
  *→ Proceed to Step 3.*  

  #### **Step 3: Moloch Trap Detection**  
  **Question:** *If every player adopted this, would it make the industry worse overall? Are we only doing it because "someone else will"?*  
  - **Pass:** Industry-wide adoption would improve things (e.g., standards, accessibility) OR we retain unique value.  
  - **Fail:** Industry-wide adoption harms users/ecosystem (e.g., erodes trust, commoditizes products, incentivizes bad behavior).  
  - **Punt:** Unclear systemic impact (e.g., novel innovation; requires leadership debate).  
  *→ If Fail: Flag as "trap." If Pass/Punt, proceed to Step 4.*  

  #### **Step 4: Exit Feasibility Assessment**  
  **Question:** *If this backfires, can we reverse it without lasting damage (e.g., reputational, technical)?*  
  - **Pass:** Easy to undo (e.g., optional feature, reversible settings).  
  - **Fail:** High switching costs (e.g., data lock-in, eroded trust, technical debt).  
  - **Punt:** Context-dependent (e.g., market volatility; requires lead judgment).  
  *→ If Step 3 was Fail + Step 4 is Fail: Strong "no-go."*  

  #### **Step 5: Privacy/Legal Flag**  
  **Question:** *Does this compromise user autonomy, obscure consent, or push regulatory boundaries?*  
  - **Flag for Legal:** Dark patterns, data collection without explicit consent, or ambiguous compliance.  
  - **No Flag:** Transparent user control, minimal data use, or regulatory alignment.  
  *(Runs parallel to Steps 1-4; always log outcome.)*  

  ---

  ### **Output Template**  
  **Feature Name:** [Insert]  
  | Step | Question | Outcome (Pass/Fail/Punt) | Notes |  
  |------|----------|--------------------------|-------|  
  | 1 | User Benefit | [ ] | e.g., "Fails: no long-term satisfaction gain." |  
  | 2 | Competitive Pressure | [ ] | e.g., "Passes: risk of 10% DAU loss." |  
  | 3 | Moloch Trap | [ ] | e.g., "Fails: industry-wide harm." |  
  | 4 | Exit Feasibility | [ ] | e.g., "Fails: irreversible reputational risk." |  
  | 5 | Privacy/Legal | [Flag/No Flag] | e.g., "Flag: dark pattern." |  
  **Decision:**  
  ☐ **Go** (All Pass/Punt + No Trap)  
  ☐ **No-Go** (Step 3 Fail OR Step 3+4 Fail)  
  ☐ **Escalate** (Multiple Punts)  

  ---

  ### Worked Examples  
  #### **Case 1: Daily Streak Notification**  
  - **Step 1 (User Benefit):** *Fail*  
    - Why: Data shows no long-term satisfaction gain; exploits FOMO.  
  - **Step 2 (Competitive Pressure):** *Pass*  
    - Why: Competitor’s DAU spike creates retention risk.  
  - **Step 3 (Moloch Trap):** *Fail*  
    - Why: Industry-wide adoption trains users to resent notifications, eroding trust. "Rational" for each actor to adopt, but collectively worsens ecosystem.  
  - **Step 4 (Exit Feasibility):** *Fail*  
    - Why: Users habituated to streaks may churn if removed; reputational damage as "spammy."  
  - **Step 5 (Privacy/Legal):** *No Flag* (Notifications aren’t inherently privacy-invasive).  
  **Decision:** ☑ **No-Go** (Trap + Irreversible harm).  

  #### **Case 2: Auto-Enrolling Users into Telemetry**  
  - **Step 1 (User Benefit):** *Fail*  
    - Why: No direct user upside; benefit is internal (product improvement).  
  - **Step 2 (Competitive Pressure):** *Punt*  
    - Why: Competitors do this, but unclear if opting out loses users.  
  - **Step 3 (Moloch Trap):** *Fail*  
    - Why: Industry-wide auto-enrollment normalizes non-consensual data collection, inviting regulation and user backlash.  
  - **Step 4 (Exit Feasibility):** *Fail*  
    - Why: Reversing requires re-consent campaigns; trust hard to regain.  
  - **Step 5 (Privacy/Legal):** *Flag* (Buried opt-out violates GDPR/CCPA spirit; escalate to legal).  
  **Decision:** ☑ **No-Go** (Trap + Legal risk).  

  #### **Case 3: Matching Competitor’s 2-Week Release Cadence (Cutting QA)**  
  - **Step 1 (User Benefit):** *Fail*  
    - Why: Postmortems confirm more bugs degrade UX.  
  - **Step 2 (Competitive Pressure):** *Pass*  
    - Why: Competitor’s faster releases threaten feature parity.  
  - **Step 3 (Moloch Trap):** *Fail*  
    - Why: Industry-wide rushed releases increase bug density, forcing users to accept broken software. No one wins, but no one can unilaterally stop.  
  - **Step 4 (Exit Feasibility):** *Pass*  
    - Why: Can revert to old cadence (technical feasibility), but reputational risk remains.  
  - **Step 5 (Privacy/Legal):** *No Flag* (Not privacy-related).  
  **Decision:** ☑ **No-Go** (Trap despite feasible exit).  

  ---

  ### Key Notes for Your Team  
  - **Trap Signature:** Step 3 (Moloch) fails when a move is **individually rational** (Step 2 Pass) but **collectively destructive** (Step 1 Fail).  
  - **Escalation:** Punts in Steps 1-3 go to product/leadership. Privacy flags go to legal.  
  - **Edge Cases:** If Steps 1 and 2 both Pass (e.g., a genuinely useful feature competitors copied), it’s likely **not a trap** (e.g., passwordless login).  
  - **Output:** One-pager with table and decision box for sign-off.  

  This procedure forces explicit tradeoff discussions and traps systemic risks early. For your examples, all three are "No-Go" – even Case 3, which might feel urgent, fails the Moloch test.
