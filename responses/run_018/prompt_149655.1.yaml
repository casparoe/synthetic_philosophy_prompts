answer: |-
  Here's my prioritisation for open problems in cascade theory relevant to scientific practice, based on fundamental impact: **Prioritise (3) incentive misalignment, then (1) biased signals, then (2) reverse cascades.**

  **(3) Direct incentive misalignment** comes first because it's foundational. Your observation highlights that institutional structures (grant panels) *created* the cascade driver. If incentives inherently favour adopting certain methods *regardless* of private signal validity, cascade models become secondary descriptions of symptoms rather than primary explanations. Solving this reveals *why* cascades form, making it paramount.

  **(1) Biased private signals** is next. It directly addresses your core case: signals aren't just noisy but *systematically distorted* by funding pressures (e.g., labs reporting what panels favour). This crucially tests whether 'rational' herding models hold when the rationality is fundamentally compromised by institutional bias, making it central to understanding scientific adoption dynamics.

  **(2) Reverse cascades**, while important, is deprioritised. Persistent cascades despite negative results are often a *consequence* of the first two problems. If incentives reward conformity (3) or bias signals against counter-evidence (1), the failure of negative results to break cascades becomes a downstream symptom rather than the core theoretical gap needing primary attention.
