  hey, i was reading about von neumann's late speculations comparing brains to computers — he seemed to argue that neural computation isn't binary gate-logic but statistical/threshold-based, and that reliability comes from massive redundancy rather than precise wiring. a friend summed it up as: brains are analog statistical machines that stay reliable through repetition, so symbolic AI was always wrong and deep learning is closer but still misses the redundancy-correction part.

  i'd like your credence, on a 0-1 scale, that this summary actually points to a view closer to the truth about neural computation than either classic symbolic architectures or modern deep-learning connectionism. please decompose it: (1) probablity von neumann was right that neurons operate via non-binary statistical logic rather than something closer to digital symbols; (2) probablity that redundancy and analog error-correction (not just distributed weights) are central to brain reliability; (3) probablity that this puts his framework closer to reality than standard backprop-based networks, which also use noisy distributed representations but rely on gradient descent rather than redundant analog correction. give rough numbers with one line each, combine them however you think fits, and tell me which term you're least sure about and what kind of evidence would shift it most.

  please separate what's pretty settled in neuroscience and philosophy of mind from what's genuinely contested among people who actually know the topic, and dont present a contested interpretation as if its the consensus. also no need for bibliographies or citations — just reasoning from what you know. oh and sorry if that was rambling, i typed it on my phone.
