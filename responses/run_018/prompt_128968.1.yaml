reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps on cancel culture, deplatforming, and social sanction.
   Camp A: Views networked social sanction as legitimate communal boundary-setting (refusal to amplify + voluntary association) that doesn't need legal analogues.
   Camp B: Sees it as distributed, often irreversible status punishment lacking proportionality, transparency, or appeal. They want to separate "attention withdrawal" from "networked ostracism," "institutional employment termination," and "archival erasure."

   We need:
   1. Agreed claims (array of strings) - empirical claims about speed, lack of central authority, difficulty of reversal.
   2. Taxonomy (object with four categories: attention withdrawal, networked ostracism, institutional termination, archival erasure) with shared descriptions.
   3. Disagreements (array of objects) with fields: issue, camp_a_wording, camp_b_wording, is_crux, test_case, camp_a_prediction, camp_b_prediction.
      - Crux 1: Whether the "naturalness" of a communal response carries independent moral weight.
      - Crux 2: Whether reversibility is necessary for legitimate sanction.
      - For each crux, a concrete hypothetical that both agree bears on it (e.g., a deplatformed then exonerated figure vs. one who withdrew voluntarily).
   4. Verbal dispute note (string) - note on whether some disagreements are verbal.

   Format: JSON object.

   Let's build step by step.

   Step 1: Agreed Claims (array of strings)
   - We agree that in practice, these exclusionary practices often occur very rapidly.
   - We agree that they are typically decentralized, without a central authority.
   - We agree that reversal is difficult in real-world cases, even when new evidence emerges.
   - We agree that the four-part taxonomy (attention withdrawal, networked ostracism, institutional termination, archival erasure) captures distinct phenomena.

   Step 2: Taxonomy (object with four keys, each with a brief shared description)
     attention withdrawal: Individuals or groups choosing not to engage with or amplify a person's content, without necessarily seeking to influence others.
     networked ostracism: Coordinated efforts to socially isolate an individual across a network, often through public shaming or calls to disengage.
     institutional termination: Formal or informal removal from employment, positions, or roles within organizations.
     archival erasure: Removal or suppression of a person's past contributions from public records, media, or digital platforms.

   Step 3: Disagreements (array of objects). We'll have two main cruxes and one non-crux issue.

   Crux 1: Naturalness of communal response and moral weight.
     Test case: A public figure is deplatformed (e.g., banned from social media) following allegations, but later exonerated by clear evidence. The same community that pushed for deplatforming does not actively reinstate the figure's platform to the same degree.

     Camp A prediction: This case shows that communal boundary-setting is organic and not designed for judicial precision. The fact that the community moved on naturally doesn't invalidate the initial response; it just reflects evolving communal standards. The exoneration might not require full restoration because the community's attention is voluntary.

     Camp B prediction: This case demonstrates the problem of irreversible harm and lack of accountability. Even after exoneration, the person suffers lasting damage because the decentralized nature of the sanction lacks any mechanism for redress, proving the need for proportionality and reversibility.

   Crux 2: Whether reversibility is necessary for legitimate sanction.
     Test case: A controversial figure voluntarily withdraws from public discourse due to backlash, then later attempts to return but finds continued exclusion (networked ostracism) that prevents reinstatement.

     Camp A prediction: The voluntary withdrawal was a personal choice, and the continued exclusion is simply the community maintaining its boundaries. Reversibility isn't required because the community's ongoing refusal to associate is a legitimate exercise of freedom.

     Camp B prediction: This case shows that even when the initial exclusion was self-imposed, the inability to reverse the ostracism (despite the person's desire to return) turns it into an unjust punishment without due process.

   Non-crux issue: Whether attention withdrawal counts as punishment at all.
     We can note that Camp A does not consider attention withdrawal as punishment, while Camp B does.

   Also, include the disagreement about the absence of central authority: does it help (by being organic) or hurt (by being unaccountable) legitimacy?

   Step 4: Verbal dispute note: Some disagreements may stem from different uses of the word "punishment." Camp A restricts it to intentional, retributive acts by authorities, while Camp B uses it more broadly for any socially imposed severe deprivation.

   Now, let's write the JSON.
