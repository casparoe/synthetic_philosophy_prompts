prompt: |-
  hey, quick sanity check for my diss chapter on rational belief and objective chance. I've been reading up on Lewis's Principal Principle and I'm stuck on what feels like a basic tension. The way I understand it, if I know the objective chance of heads is .5, then PP says my credance should be exactly .5, and the only evidence I'm allowed to combine with that is admissable evidence—stuff that doesn't directly concern the actual flip. But that seems to block Bayesian updating entirely: if I flip the coin ten times and see heads every time, that observational data is about the actual flips, so by the admissability restriction I should just ignore it and stay at .5? Or does the principle actually say my credance in the chance being .5 should update, while my credance in the next heads stays pinned?

  I'm trying to argue that the PP is essentially anti-Bayesian because it locks credances to chance values regardless of empirical frequency data, but my advisor said I'm conflating levels. Can you give me a committed answer—don't just lay out both interpretations? I want to know: is the principle genuinely in conflict with standard Bayesian conditioning on outcomes, or is the confusion just in how I'm applying the admissability clause? And if it's the latter, what's the specific mistake—am I treating outcome-evidence as admissable when it's actually inadmissable, or vice versa?

  Also, if the answer depends on whether we take chances to be Humean frequencies vs propensities, does that change the verdict? I don't need a bibliography or citations, just a clear take with reasons.
reasoning: |-
  Okay, let me tackle this user's query. They're working on their dissertation chapter about rational belief and objective chance, specifically focusing on Lewis's Principal Principle (PP). The user is confused about a tension they perceive between PP and Bayesian updating. They think PP might block updating on observed frequencies, but their advisor says they're conflating levels. I need to give a clear, committed answer without sitting on the fence.

  First, I need to recall Lewis's Principal Principle. It states that if you know the objective chance of an event is x, your initial credence should be set to x, provided no inadmissible evidence. The user's example is a coin with a known chance of 0.5 for heads. After observing ten heads in a row, they wonder why their credence shouldn't update. The user thinks this makes PP anti-Bayesian, locking credence regardless of data. But their advisor mentions conflating levels. That's a key point here.

  The user might be confusing two different credences: the credence in the outcome (next flip being heads) versus the credence in the chance hypothesis itself. PP governs the former but doesn't prevent updating the latter. When you observe ten heads, that evidence is inadmissible for the outcome credence under the chance hypothesis. So PP says to keep credence at 0.5 for the next flip. However, that same evidence should update your belief about whether the chance is actually 0.5. Maybe the coin is biased. So Bayesian updating applies at the hypothesis level, not directly to the outcome under a fixed chance.

  The user also asks if this depends on Humean vs. propensity theories of chance. In Lewis's Humean view, chances supervene on the entire pattern of events, so after observing ten heads, the chance itself might change. But in propensity views, chances are intrinsic and might remain fixed. Either way, the distinction between levels is crucial. The mistake is treating outcome evidence as admissible for the direct credence when it's actually inadmissible. The user's error is applying Bayesian updating directly to the event credence instead of to the chance hypotheses.

  I should emphasize that PP isn't anti-Bayesian; it works with Bayesian updating at the meta-level. The confusion is in the application of admissibility—outcome data is inadmissible for direct credence when conditioning on a specific chance value. The user needs to separate belief in the chance from belief in the outcome. Their advisor is right about conflating levels. The specific mistake is treating outcome evidence as admissible when it's not. 

  Also, addressing the Humean vs. propensity point: under Humeanism, the chance might update with new data, affecting PP's application. But in both cases, the levels distinction resolves the tension. So the core issue is the user's application of admissibility, not a flaw in PP itself. I need to make sure the answer is direct and doesn't waver, as the user requested. No citations, just clear reasoning.
answer: |-
  Here's a committed answer, cutting through the interpretations:

  **You are misapplying the admissibility clause, and the confusion stems from conflating two distinct objects of credence.** The Principal Principle (PP) is **not** inherently anti-Bayesian. Your mistake is treating *outcome evidence* (the ten heads) as something PP tells you to "ignore" *simpliciter*, when PP actually dictates *where* that evidence is relevant and where it isn't. Your advisor is right about the levels.

  1.  **PP Governs Credence *in the Outcome*, Conditional on Chance + Admissible Evidence:** When PP says your credence in heads *given that the objective chance of heads is 0.5* (and admissible evidence E) should be 0.5, it means precisely this:
      `Cr(Heads | [Ch(Heads)=0.5] & E) = 0.5`
      **Admissible evidence E is evidence that doesn't "screen off" the chance or provide a "crystal ball" into the specific outcome.** *The ten heads you observed are* **inadmissible** *evidence relative to the hypothesis `Ch(Heads)=0.5` when assessing the credence for the* **next flip** *(Heads).* Why? Because the ten heads *are direct evidence about the outcomes in the world*, and including them would be like partially peeking at the outcome history the chance is supposed to summarize.

  2.  **Bayesian Updating Happens at the Level of Chance *Hypotheses*:** PP does **not** lock your credence *that the chance is 0.5*. Observing ten heads is **powerful, admissible evidence** *for updating your credence over different chance hypotheses themselves* (e.g., `Ch(Heads)=0.5`, `Ch(Heads)=0.9`, etc.).
      *   Your initial high credence in `Ch(Heads)=0.5` *should* drop significantly after ten heads.
      *   Your credence in hypotheses like `Ch(Heads)=0.9` *should* rise.
      *   **This is standard Bayesian conditionalization applied to propositions *about the chance*.**

  3.  **The Credence for the Next Flip Combines Both:** Your credence in the *next* flip being heads, given *all* your evidence (including the ten heads), *isn't* set directly by PP applied naively to `Ch=0.5`. Instead, it's calculated by weighting the chances given by PP *by your updated credences in those chance hypotheses*:
      `Cr(Heads_next | Total Evidence) = Σ [Ch_h(Heads_next) * Cr(Ch_h | Total Evidence)]`
      (Summing over all possible chance hypotheses `Ch_h`).
      *   After ten heads, `Cr(Ch=0.5 | Total Evidence)` is low, `Cr(Ch=0.9 | Total Evidence)` is higher.
      *   PP tells you `Cr(Heads_next | Ch=0.5 & Total Evidence) = 0.5` (and the ten heads *are* inadmissible here, so you *must* use 0.5 conditional *on this hypothesis*).
      *   PP also tells you `Cr(Heads_next | Ch=0.9 & Total Evidence) = 0.9`.
      *   Your overall credence becomes a weighted average: e.g., `(0.5 * low_weight) + (0.9 * high_weight) = something > 0.5`.

  **Your Specific Mistake:** You are **treating outcome evidence (the ten heads) as if it should be admissible evidence for the direct credence in `Heads_next` *under the specific hypothesis `Ch=0.5`***. PP explicitly says it is **inadmissible** in this context. PP *prevents* you from doing `Cr(Heads_next | Ch=0.5 & 10_heads) = something_other_than_0.5`. It *forces* you to use 0.5 conditional *on that specific chance hypothesis*. The *updating* happens by changing your belief *in which chance hypothesis is true*.

  **Re: Humean vs. Propensity:** This distinction **doesn't change the fundamental verdict on the levels confusion**, but it adds nuance:
  *   **Humean (Lewis):** Chances supervene on the entire pattern of events (the "Humean mosaic"). *After* observing ten heads, the *actual* chance `Ch(Heads)=0.5` might no longer even be true for a Humean! The best systematization might now posit a higher chance. This *reinforces* why the ten heads are inadmissible for `Ch=0.5` – they might *show* `Ch=0.5` is false. Your updating of chance hypotheses is tracking this.
  *   **Propensity:** Chances are intrinsic properties. Observing ten heads doesn't *change* the propensity (if it truly is 0.5), but it *is* strong evidence that the propensity *isn't* 0.5. Updating your credences over propensity hypotheses is still crucial. PP still applies: conditional on the propensity *being* 0.5, your credence in heads *must* be 0.5, regardless of past flips (which are inadmissible under that hypothesis). But you become very unsure the propensity *is* 0.5.

  **The Committed Take:** The tension you perceive is illusory. PP does **not** lock your credence in future outcomes to a fixed chance value regardless of empirical data. It locks your credence *conditional on a specific chance hypothesis* to that value and dictates that outcome evidence is inadmissible *for that conditional credence*. The empirical data drives Bayesian updating *at the higher level* of your credences *about which chance hypothesis is true*. PP and Bayesian updating work together seamlessly once the levels (`Cr(outcome | chance_hypothesis)` vs. `Cr(chance_hypothesis | evidence)`) are clearly separated. Your advisor's point about conflating levels is the core issue. Your interpretation that PP locks overall credence ignores the essential role of updating beliefs *about the chances themselves*.
