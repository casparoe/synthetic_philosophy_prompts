      a. **Escalate** to the annual assembly (if conflict is existential).  
      b. **Assign priority** via pre-set order (Escape 4).  
    - Here, apply **Escape 4**: Use fixed priority (e.g., E > F) to break the tie.  
  - **Published paragraph**: "The trust’s rules do not resolve joint registry claims. Board applied priority order (E > F) to assign Clause L authority. [Release outcome]."  
  - **Unpalatable answer**: The procedure **denies both claims equally**. It exposes a charter flaw and forces a board vote (relocating arbitrariness). Patient representatives may object, but joint control requires new governance.  

  #### **Case 2: Conditional Objection (Clinic C vs. Clinic D)**  
  - **Background**: C refuses its inclusion if D’s records are included. All others prefer "D-only" or "C+D."  
  - **Screening (Step 1)**:  
    - **Protected pairs**:  
      - C: SQ vs. C-only (C’s preference: C-only > SQ).  
      - D: C-only vs. C+D (D’s preference: C+D > C-only).  
    - **Unanimity**: All prefer C+D > C-only (including C, reluctantly).  
    - **Cycle?** C-only > SQ (C’s L), C+D > C-only (unanimity), but no third clinic with a protected pair. **No Sen configuration** (only one unanimity edge).  
  - **Procedure**: Proceed to **ordinary rules (Step 6)**:  
    - Clause L: C-only > SQ (C’s sphere).  
    - Clause L: C+D > C-only (D’s sphere).  
    - Clause P: C+D > D-only > C-only (unanimity).  
    - Fixed agenda: Assuming options ordered SQ, C-only, D-only, C+D:  
      - SQ vs. C-only → C-only wins (C’s L).  
      - C-only vs. D-only → D-only wins (unanimity).  
      - D-only vs. C+D → C+D wins (unanimity).  
    - **Outcome**: C+D release.  
  - **Published paragraph**: "Clinic C’s objection to D’s inclusion was not within its protected sphere. Release approved per Clause L (D’s preference) and unanimity."  
  - **Unpalatable answer**: The procedure **rejects C’s conditional claim** as meddlesome (depends on D’s records). Clause L is narrowed to *own-record inclusion only*, not relational conditions. Patient representatives will object, but broadening Clause L would make nearly every preference protected (e.g., "I oppose my inclusion if poor safeguards" could block all releases).  
  - **Where procedure runs out**: If C’s objection is framed as "C-only > SQ but C+D = SQ," the board must judge if it’s meddlesome (Escape 2). If deemed meddlesome, C loses; if not, deadlock resumes. **A person must decide**.  

  ---

  ### **Final Recommendations**  
  - **Preference for Clause L**: Prioritize it by **skipping Escape 3** (Pareto filter). This risks Pareto violations but upholds clinic autonomy.  
  - **Annual preparation**: Set **priority orders** (Escape 4) and **agendas** (Escape 5) in advance.  
  - **Charter reform**: Address joint registries and conditional objections explicitly to avoid gaps.  
  - **Time management**: Allocate 45 min for screening/escapes, 30 min for voting, 15 min for documentation.  

  This procedure converts Sen’s result into actionable steps, but its success hinges on the board’s willingness to avow tough choices. In Cases 1–2, it forces clarity at the cost of idealism—precisely what your room requires.
