  The Nashville-St. Paul contrast challenges technological determinism—it proves highways don't have to follow a set path. Different social values led to different outcomes, exposing determinism as a myth that obscures human agency and bias. 

  Finally, Winner's binary of "inherently political or not" can't capture Rondo's cultural and emotional loss—things like community bonds, cultural hubs, and generational trauma. These are intangible harms that go beyond the artifact's design, showing the limits of his framework when applied to human experiences. 

