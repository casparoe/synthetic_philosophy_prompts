answer: |-
  Here is a comprehensive list of desiderata for an adequate answer to the Special Composition Question (SCQ), categorized by type, with motivating cases and negotiability flags. The goal is to map the conceptual landscape and tensions, not to adjudicate prematurely.

  ### I. Accommodating Ordinary Objects & Intuitions (Often Non-Negotiable for Practical Coherence)
  1.  **Macroscopic Solids:** The theory must explain why, e.g., a *solid wooden table* is one object, not just particles arranged table-wise. (*Motivation:* Foundational to everyday ontology and discourse. *Negotiability:* **Largely Non-Negotiable** - failure here makes the theory radically revisionist.)
  2.  **Organisms:** It must account for *human organisms* or *cats* as single, unified entities persisting through part replacement. (*Motivation:* Biological intuition and practical interaction. *Negotiability:* **Highly Contentious** - Nihilists reject this intuition; Universalists accept it but struggle with uniqueness; Organicism centers it.)
  3.  **Artifacts (Functional):** It must explain why a *functioning car* is one object, even if missing a hubcap. (*Motivation:* Engineering, law, commerce. *Negotiability:* **Moderately Negotiable** - Nihilists reject; Others accept but may define "function" differently.)
  4.  **Aggregates by Convention:** It must accommodate objects like *constellations* (e.g., Orion), where composition seems dependent on human perspective/convention, not intrinsic physical relations. (*Motivation:* Cultural practice and discourse. *Negotiability:* **Negotiable** - Universalists accept readily; Nihilists & some Restricted views reject them as non-objects.)

  ### II. Handling Engineered & Boundary Cases (Testing Robustness/Non-Arbitrariness)
  5.  **Defective Artifacts:** It must handle *a statue missing its left arm* still being counted as *that statue*, not just a statue-torso. (*Motivation:* Persistence conditions, artifact identity. *Negotiability:* **Important Test Case** - Reveals if boundaries are sharp or vague; failure suggests arbitrariness.)
  6.  **Dynamic Collectives:** It must account for *a drone swarm* maintaining collective behavior and being treated as a unit (e.g., in military ops) despite complete constituent turnover every few minutes. (*Motivation:* Emergent systems, computer science, AI. *Negotiability:* **Increasingly Important** - Tests if composition requires persistent parts or just organizational pattern.)
  7.  **Processual Entities:** It must deal with *a sustained fusion reaction* where no plasma particle persists >1ms, yet the reaction itself is a distinct, measurable entity. (*Motivation:* Physics, process metaphysics. *Negotiability:* **Crucial Test** - Challenges mereological atomism and persistence requirements; highlights diachronic unity.)
  8.  **Vague Boundaries:** It must provide a principled account of whether *a mountain* or *a cloud* is an object and where its boundaries lie. (*Motivation:* Geography, meteorology, vagueness in reality. *Negotiability:* **Major Challenge** - Any sharp cutoff may seem arbitrary; denying existence entirely seems counterintuitive.)

  ### III. Formal Mereological Properties (Non-Negotiable for Consistency, Contentious for Scope)
  9.  **Consistency:** The theory must be logically consistent within its own framework and with core logic. (*Motivation:* Basic rationality. *Negotiability:* **Absolutely Non-Negotiable**.)
  10. **Clarity of Parthood:** The relation(s) of parthood must be precisely defined (even if primitive). (*Motivation:* Avoiding ambiguity. *Negotiability:* **Non-Negotiable** for a formal theory.)
  11. **Transitivity of Parthood:** If A is part of B and B is part of C, then A is part of C. (*Motivation:* Foundational to standard mereology (e.g., Classical Extensional Mereology - CEM), avoids counterintuitive chains. *Negotiability:* **Widely Accepted**, but some process/functional views challenge it for temporal parts or under decomposition).
  12. **Uniqueness of Composition (if Fusions Exist):** If composition occurs, the resulting whole is unique - no two distinct objects can have exactly the same proper parts at a time. (*Motivation:* Core tenet of CEM; avoids overpopulation of coincident objects. *Negotiability:* **Contentious** - Statue/Lump cases challenge it; Universalists accept; Organicists/Nihilists avoid by denying composition or uniqueness of parts.)
  13. **Compatibility with Extensional Mereology (if claimed):** If the theory endorses CEM, it must satisfy its axioms (Reflexivity, Transitivity, Antisymmetry, Uniqueness of Composition, Universalism/Unrestricted Fusion). (*Motivation:* Formal rigor and clarity. *Negotiability:* **Theory-Dependent** - Universalists embrace; Others explicitly reject CEM's axioms, especially Unrestricted Fusion).

  ### IV. Metaphysical Costs & Constraints (Balancing Desiderata)
  14. **Avoid Arbitrary Spatiotemporal Cutoffs:** The theory should not rely on sharp boundaries where none seem ontologically significant (e.g., why *this* exact set of particles composes a table, but one atom removed does not). (*Motivation:* Anti-arbitrariness principle. *Negotiability:* **Core Driver for Universalism & Nihilism**; Restricted views *must* justify boundaries non-arbitrarily.)
  15. **Avoid Ontological Bloat ("Explosion of Scattered Objects"):** The theory should not commit us to the existence of wildly gerrymandered or highly scattered entities like "the object composed of my nose and the Eiffel Tower" or "all left socks throughout history". (*Motivation:* Parsimony, intuitive plausibility. *Negotiability:* **Core Driver for Nihilism & Restricted Views**; Universalists bear this cost, claiming it's acceptable.)
  16. **Respect Physical Descriptions of Matter:** The theory should not contradict well-established physics regarding the nature and behavior of matter/energy (e.g., quantum entanglement, field continuity, conservation laws). It should explain how composed objects relate to fundamental physical stuff. (*Motivation:* Naturalism, grounding metaphysics in science. *Negotiability:* **Increasingly Non-Negotiable** for naturalistically inclined metaphysicians.)
  17. **Ontological Innocence (or Justification for Cost):** The theory should either explain why accepting composite objects adds no genuine ontological commitment beyond their parts (Nihilist ideal), or provide strong justification for the additional commitment. (*Motivation:* Parsimony; avoiding unnecessary entities. *Negotiability:* **Core Slogan for Nihilism**; Others argue composition *is* ontologically committing but justified.)

  **Mapping the Core Tension & Joint Unsatisfiability:**

  The most significant conflict arises between **Desideratum 14 (Avoid Arbitrary Cutoffs)** and **Desideratum 15 (Avoid Ontological Bloat)**. This is the heart of the SCQ dilemma:

  1.  **Universalism** satisfies 14 perfectly (no cutoffs at all) but *maximally violates* 15 (accepting *all* fusions, however scattered/gerrymandered). It prioritizes non-arbitrariness and formal elegance over intuitive parsimony.
  2.  **Nihilism** satisfies 15 perfectly (no composites, hence no bloat) but *radically violates* 1, 2, 3, 4, 5, 6, 7, 8 (denying the existence of all ordinary and boundary case objects). It prioritizes parsimony and innocence over intuitive ontology.
  3.  **Restricted Composition** (e.g., Organicist, Contact, etc.) attempts a middle ground, accepting some composites (satisfying 1, 2, 3 partially) and rejecting others (satisfying 15 partially). However, **it inevitably struggles with Desideratum 14**. Any non-universal, non-nihilist restriction faces the challenge:
      *   *Can it specify a necessary and sufficient condition for composition that is:*
          *   (a) **Non-Arbitrary** (satisfies 14)?
          *   (b) **Principled** (grounded in genuine ontological features, not just human interests)?
          *   (c) **Precisely Specifiable** (satisfies 10, avoids vagueness issues)?
          *   (d) **Restrictive Enough** to avoid gerrymandered/scattered objects (satisfy 15)?
          *   (e) **Permissive Enough** to include all paradigm cases (satisfy 1, 2, 3)?
      *   The tension is stark: A condition loose enough to include mountains, clouds, drone swarms, and fusion reactions (e, d) risks being too loose, admitting gerrymandered objects (failing b, d) or being vague/arbitrary (failing a, c). A condition strict enough to exclude gerrymanders (satisfy b, d) risks excluding some paradigm cases (failing e) or requiring sharp cutoffs where none seem to exist (failing a, c).

  **This is the joint unsatisfiability:** Providing a **non-arbitrary, principled, and precise restriction** on composition that **simultaneously** includes all intuitively unified objects (organisms, artifacts, collectives, processes) **and** excludes all intuitively gerrymandered/scattered objects is arguably impossible. Every proposed restricted view seems to privilege certain intuitions (biological unity, contact, functional unity) at the cost of others, leaving boundary cases unexplained or resolved in ways opponents deem arbitrary. The core debate revolves around *which* costs (bloat, radical revisionism, or residual arbitrariness) are deemed more acceptable. The desiderata reveal why no answer commands universal assent.
