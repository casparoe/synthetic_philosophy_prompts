  1. Agreed claims about specific arguments in Nāgārjuna's Mūlamadhyamakakārikā (MMK) in chapters 1, 2, and 18.
  2. A disagreements table with two columns (NS and DR) on three points: (a) whether śūnyatā is itself empty and non-assertible, (b) whether the fourfold negation generates a fifth position or remains destructive, and (c) whether conventional designation retains determinate content.
