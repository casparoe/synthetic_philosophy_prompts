prompt: |-
  Draft the joint statement that a "non-assertive soteriologist" Madhyamaka interpreter and a "dialectical realist" Madhyamaka interpreter could both sign after a good-faith adversarial collaboration on Nāgārjuna's catuṣkoṭi (four-cornered negation) and the doctrine of śūnyatā (emptiness).

  The non-assertive soteriologist holds that the tetralemma—negating that phenomena exist, do not exist, both exist and do not exist, or neither exist nor do not exist—is a complete exhaustion of conceptual proliferation (prapañca) that leaves no residual philosophical thesis, not even "emptiness," because paramārthasatya (ultimate truth) is entirely beyond linguistic and conceptual determination; conventional reality (saṃvṛtisatya) is useful for practice but carries no epistemic weight once the four extremes are seen through.

  The dialectical realist holds that the tetralemma is a rigorous logical instrument that positively establishes śūnyatā as the universal absence of svabhāva (intrinsic nature) in all dependently originated things; that saṃvṛtisatya is fully coherent and determinately structured within this negation; and that the result is a substantive philosophical view—Madhyamaka—rather than a mere cessation of belief.

  The statement should contain:

  1. A numbered section of agreed claims about specific arguments in Nāgārjuna's Mūlamadhyamakakārikā—particularly the analysis of conditions in chapter 1, of motion in chapter 2, and of the self in chapter 18—that both camps accept as accurate descriptions of the text's reasoning, regardless of how each camp interprets their philosophical upshot.

  2. A disagreements table with two columns, each phrased in wording that its respective camp would accept for describing its own position. The rows must cover: (a) whether śūnyatā is itself empty in a manner that renders it non-assertible; (b) whether the fourfold negation generates a philosophically substantive "fifth position" of non-assertion (avyākṛta-vāda) or remains purely destructive; (c) whether conventional designation (prajñapti-mātra) retains determinate content after the negation of svabhāva in every phenomenon.

  3. The cruxes: identify the precise sub-questions such that resolving them would cause at least one camp to revise its view. These should include: whether Madhyamaka's soteriological aim is cognitive (arriving at a correct view of emptiness) or non-cognitive (the complete cessation of conceptual construction); and whether pratītyasamutpāda (dependent origination) can be coherently maintained if no conventional entity possesses even provisional intrinsic nature.

  4. For each crux, specify a concrete internal conceptual test or argument—derived solely from Madhyamaka reasoning rather than empirical observation—that both sides agree bears on it, with each camp's predicted outcome recorded explicitly. For example, both might agree that constructing a non-contradictory account of causal efficacy without attributing svabhāva to either cause or effect bears directly on the crux about conventional designation; record what the non-assertive camp predicts this demonstrates (e.g., that causality is merely conventional and ultimately ineffable) versus what the dialectical realist predicts (e.g., that causality is determinately structured by emptiness).

  5. A joint assessment of whether any portion of the dispute is verbal rather than substantive. If both camps agree that part is verbal, identify it precisely—such as divergent uses of "truth" in "ultimate truth" versus "conventional truth," or the term "realism"—and explain why the disagreement dissolves once the terms are disambiguated, with both sides endorsing the diagnosis.

  The document should be formal, avoid bibliographies or citation lists, and should not depend on specific dates or editions. To keep the prompt specific and resistant to generic summaries, inject and apply the distinction between prasajya-pratiṣedha (exhaustive, non-implicative negation) and paryudāsa-pratiṣedha (implicative, relative negation) as it applies specifically to the tetralemma's treatment of existence and non-existence in chapter 15 of the Mūlamadhyamakakārikā. Do not ask for reading lists or references to secondary literature.
