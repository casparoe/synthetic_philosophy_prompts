  **Joint Statement on the Interpretation of Nāgārjuna's Catuṣkoṭi and Śūnyatā**

  **Preamble**
  We, the undersigned non-assertive soteriologist (NS) and dialectical realist (DR) interpreters of Madhyamaka, having engaged in adversarial collaboration on Nāgārjuna's catuṣkoṭi (four-cornered negation) and the doctrine of śūnyatā (emptiness) as presented in the Mūlamadhyamakakārikā, hereby set forth this joint statement. Our collaboration has focused on the analysis of conditions (chapter 1), motion (chapter 2), and the self (chapter 18), as well as the logical structure of negation in chapter 15. We agree on the following descriptive claims about the text while maintaining divergent interpretations of their philosophical implications.

  **1. Agreed Claims on Specific Arguments in the Mūlamadhyamakakārikā**

  Both camps accept the following as accurate descriptions of Nāgārjuna's reasoning in the specified chapters:

  1.1 **Chapter 1: Analysis of Conditions (Pratītya)**  
  Nāgārjuna examines the four conditions (causes, objects, immediate conditions, and dominant conditions) and demonstrates that none of these conditions can be established as having intrinsic nature (svabhāva) when analyzed in relation to their effects or in isolation. The argument proceeds by showing that each condition is either identical to or different from its effect, and both options lead to absurdity. Thus, conditions are only conventionally designated and are empty of intrinsic reality.

  1.2 **Chapter 2: Analysis of Motion (Gata)**  
  Nāgārjuna deconstructs the concept of motion by analyzing the notions of the mover, the path, and the act of moving. He shows that motion cannot be located in the one who has moved, the one who has not moved, or the one who is moving. This analysis reveals that motion is not an inherently existent phenomenon but is dependently originated and thus empty.

  1.3 **Chapter 18: Analysis of the Self (Ātman)**  
  Nāgārjuna refutes the idea of a self (ātman) as an intrinsic entity by examining its relation to the aggregates (skandhas). He argues that the self cannot be identical to the aggregates, nor different from them, nor possess the aggregates, nor be the basis of the aggregates, nor be the owner of the aggregates. This leads to the conclusion that the self is a mere conventional designation (prajñapti-mātra) and is empty of inherent existence.

  1.4 **Chapter 15: The Tetralemma and Negation**  
  In the examination of svabhāva (intrinsic nature), Nāgārjuna employs the catuṣkoṭi to negate four positions regarding the existence of phenomena: existence, non-existence, both, and neither. Both camps agree that Nāgārjuna uses prasajya-pratiṣedha (non-implicative negation) for each corner of the tetralemma, meaning that the negations are exhaustive and do not imply an alternative positive thesis. The purpose is to halt conceptual proliferation (prapañca) without positing any residual entity.

  **2. Disagreements Table**

  The following table outlines our divergent interpretations on key philosophical points. Each position is described in terms acceptable to the respective camp:

  | Issue | Non-Assertive Soteriologist (NS) Position | Dialectical Realist (DR) Position |
  |-------|------------------------------------------|----------------------------------|
  | **(a) Śūnyatā's Emptiness and Assertibility** | Śūnyatā is itself empty, and thus any assertion of śūnyatā as a positive view must be relinquished. The ultimate truth (paramārthasatya) is entirely beyond conceptualization, and śūnyatā is a non-affirming negation (prasajya-pratiṣedha) that leaves no trace of a thesis. | Śūnyatā is the universal absence of svabhāva, and this absence is itself empty (of being an entity) but is determinately established as the true nature of reality. Śūnyatā is a correct philosophical view that can be asserted without contradiction because it is not reified. |
  | **(b) The Fifth Position after the Tetralemma** | The fourfold negation is purely destructive and leaves no room for a fifth position. The purpose is the cessation of all views, including the view of non-assertion (avyākṛta-vāda). The result is silence (tūṣṇīṃbhāva) as the only appropriate response. | The fourfold negation establishes śūnyatā as the coherent ground for conventional reality. It does not imply a fifth position but positively reveals the emptiness that structures conventional truth. The negation is a method to establish the Middle Way. |
  | **(c) Determinate Content of Conventional Designation** | After the negation of svabhāva, conventional reality (saṃvṛtisatya) is merely pragmatic and lacks any determinate structure. Designations are useful fictions that bear no epistemic weight and are ultimately ineffable. | The negation of svabhāva allows conventional reality to be determinately structured by dependent origination (pratītyasamutpāda). Conventional truths are coherent and knowable precisely because they are empty. |

  **3. Cruxes and Conceptual Tests**

  We identify the following cruxes as pivotal. Resolving them would likely cause at least one camp to revise its position. For each crux, we specify an internal conceptual test derived from Madhyamaka reasoning and record each camp's prediction.

  **Crux 1: Soteriological Aim**  
  *Question:* Is Madhyamaka's soteriological aim cognitive (arriving at a correct view of emptiness) or non-cognitive (the complete cessation of conceptual construction)?  
  *Test:* Analyze whether the Buddha's teaching of the Four Noble Truths can be coherently maintained without positing a correct view (dṛṣṭi) of emptiness as a cognitive achievement.  
  - **NS Prediction:** The Four Noble Truths are upāya (skillful means) that must be abandoned upon realization, which is non-conceptual. Any cognitive view, including emptiness, is a conceptual fabrication to be transcended.  
  - **DR Prediction:** The Four Noble Truths are conventionally true and require the correct view of emptiness to avoid reification. The cognitive understanding of emptiness is essential for liberation.  

  **Crux 2: Dependent Origination without Provisional Intrinsic Nature**  
  *Question:* Can pratītyasamutpāda (dependent origination) be coherently maintained if no conventional entity possesses even provisional intrinsic nature?  
  *Test:* Construct a non-contradictory account of causal efficacy (e.g., a seed producing a sprout) without attributing svabhāva to cause, effect, or the causal relation.  
  - **NS Prediction:** The account will fail to establish any determinate causal structure, revealing that causality is merely conventional and ultimately ineffable.  
  - **DR Prediction:** The account will succeed by showing that causes and effects are dependently designated and that emptiness provides the coherent structure for causal relations.  

  **4. Joint Assessment of Verbal Disagreements**

  We agree that a portion of our dispute is verbal rather than substantive, particularly regarding the term "truth" in the two truths doctrine and the term "realism."

  - **Truth Terminology:** The NS camp uses "ultimate truth" to mean the ineffable reality beyond concepts, while the DR camp uses "ultimate truth" to mean the fact of emptiness (the absence of svabhāva). Once disambiguated, we agree that the DR's "ultimate truth" is what the NS would call a conventional pointer to the ineffable, and thus the disagreement about whether emptiness is assertible reduces to a matter of semantic framing.

  - **Realism:** The term "realism" in the DR position is not a commitment to intrinsic natures but to the determinate structure of conventions under emptiness. The NS camp does not deny conventions but denies they have any determinate content. However, upon clarification, both agree that conventions are dependently arisen and empty. The dispute over "determinate content" may be partly verbal: the NS camp means "determinate from an ultimate perspective" (which they deny), while the DR camp means "determinate within the conventional sphere" (which they affirm). When the frame of reference is specified, the disagreement softens.

  We therefore affirm that while substantive differences remain, particularly regarding the assertibility of śūnyatā and the nature of conventional reality, some apparent conflicts arise from terminological choices that, when clarified, reveal shared ground in the core Madhyamaka teaching of dependent origination and emptiness.

  **Signed,**

  [Non-Assertive Soteriologist Interpreter]  
  [Dialectical Realist Interpreter]
answer: |-
  ### Joint Statement on the Interpretation of Nāgārjuna's Catuṣkoṭi and Śūnyatā  

  **Preamble**  
  We, a non-assertive soteriologist (NS) and a dialectical realist (DR) interpreter of Madhyamaka, having engaged in adversarial collaboration on Nāgārjuna’s catuṣkoṭi (four-cornered negation) and the doctrine of śūnyatā (emptiness), affirm shared ground in our reading of the *Mūlamadhyamakakārikā* (MMK) while acknowledging persistent interpretive divergences. This statement outlines areas of agreement, catalogs disagreements without synthesis, identifies cruxes for future resolution, and assesses verbal ambiguities. Our collaboration focused on MMK Chapters 1 (conditions), 2 (motion), 18 (self), and 15 (tetralemma structure), with explicit attention to *prasajya-pratiṣedha* (non-implicative negation) versus *paryudāsa-pratiṣedha* (implicative negation).  

  ---

  ### 1. Agreed Claims on Nāgārjuna’s Arguments  
  Both parties endorse the following as accurate descriptions of Nāgārjuna’s reasoning in the referenced chapters, irrespective of interpretive differences:  

  1. **MMK Chapter 1 (Conditions):**  
     Nāgārjuna negates all four possibilities of causal conditions (e.g., cause/effect identity, difference, both, neither) to demonstrate that no condition possesses *svabhāva* (intrinsic nature). Conditions are dependently arisen (*pratītyasamutpanna*) and thus empty (*śūnya*), rendering any reified notion of causality incoherent.  

  2. **MMK Chapter 2 (Motion):**  
     The analysis of motion negates all four positions (e.g., motion exists in the mover, in the non-mover, in both, or in neither) to show that motion lacks inherent existence. Motion is a conventional designation (*prajñapti*) dependent on conceptual imputation, not an independent reality.  

  3. **MMK Chapter 18 (Self):**  
     The self is deconstructed by negating all four corners of the tetralemma (e.g., the self exists, does not exist, both, or neither). The aggregates (*skandhas*) are empty of self-nature, and any notion of an intrinsic self is a product of ignorance (*avidyā*).  

  4. **MMK Chapter 15 (Tetralemma and Negation Type):**  
     The catuṣkoṭi in verse 15.10 employs *prasajya-pratiṣedha*—a non-implicative negation that exhaustively rejects the four extremes (existence, non-existence, both, neither) without positing an alternative thesis. This negation targets conceptual proliferation (*prapañca*) and avoids affirming any residual category.  

  ---

  ### 2. Disagreements Table  
  The table below presents divergent positions in wording acceptable to each camp. Rows address (a) śūnyatā’s emptiness and assertibility, (b) the tetralemma’s generative/destructive function, and (c) conventional designation’s determinacy.  

  | Issue | Non-Assertive Soteriologist (NS) Position | Dialectical Realist (DR) Position |  
  |-------|------------------------------------------|----------------------------------|  
  | **(a) Śūnyatā’s Emptiness & Assertibility** | Śūnyatā is itself empty and must be negated; it is a non-assertible soteriological tool to cease all views, including "emptiness" as a thesis. Asserting śūnyatā violates its non-referential nature. | Śūnyatā is empty of *svabhāva* but is assertible as the universal characteristic (*sāmānyalakṣaṇa*) of phenomena. It is a coherent philosophical truth established by the negations. |  
  | **(b) Fifth Position after Tetralemma** | The fourfold negation leaves no "fifth position"; it is purely destructive of conceptual extremes, culminating in non-assertion (*avyākṛta-vāda*) as the cessation of prapañca. | The negation generates no fifth position but positively establishes śūnyatā as the Middle Way—a determinate view structuring conventional reality without ontological commitment. |  
  | **(c) Conventional Designation’s Content** | Post-negation, conventions (*prajñapti-mātra*) lack determinate content; they are pragmatically useful but epistemically weightless, like illusions. | Conventions retain determinate content precisely *because* of śūnyatā; dependent origination provides coherent structure to conventional truth. |  

  ---

  ### 3. Cruxes for Resolution  
  The following sub-questions, if resolved, would compel at least one camp to revise its position. Each crux includes a test derived from Madhyamaka reasoning, with explicit predictions.  

  #### **Crux 1: Soteriological Aim**  
  *Sub-Question:* Is Madhyamaka’s aim cognitive (correct view of emptiness) or non-cognitive (cessation of conceptual construction)?  
  *Test:* Analyze whether the Buddha’s silence on ineffable matters (e.g., avyākṛta-sthāna) implies that śūnyatā must be abandoned post-realization.  
  - **NS Prediction:** Silence demonstrates that all views—including "correct" ones—are soteriological obstructions; cognition ceases in nirvāṇa.  
  - **DR Prediction:** Silence addresses only reified extremes; śūnyatā as non-reified understanding is the cognitive foundation of liberation.  

  #### **Crux 2: Dependent Origination without Provisional Svabhāva**  
  *Sub-Question:* Can pratītyasamutpāda function coherently if no conventional entity has even provisional intrinsic nature?  
  *Test:* Apply MMK Chapter 1 reasoning to causal efficacy (e.g., seed → sprout) without attributing *svabhāva* to cause, effect, or relation.  
  - **NS Prediction:** Analysis shows causality is ineffable; any description is merely conventional and collapses under scrutiny.  
  - **DR Prediction:** Analysis confirms causality is determinately structured by śūnyatā; functional efficacy validates conventional truth.  

  ---

  ### 4. Joint Assessment of Verbal Disagreements  
  We agree that portions of the dispute are verbal, dissolving under disambiguation:  

  - **"Ultimate Truth" (Paramārthasatya):**  
    NS uses this to denote *strict ineffability* beyond language, while DR uses it to mean *the fact of emptiness* (absence of *svabhāva*). When NS’s "ineffability" is distinguished from DR’s "fact of negation," the disagreement softens: NS concedes DR’s "emptiness" is a conventional descriptor for the ineffable, and DR concedes that descriptor is not ultimate in NS’s sense.  

  - **"Realism" in Conventional Designation:**  
    DR’s "realism" denotes *determinate structure within conventions*, not intrinsic existence. NS’s denial of "determinacy" targets *ultimate grounding*, not pragmatic function. Disambiguating "realism" as "conventional coherence without *svabhāva*" reveals overlap: both accept conventions as dependently arisen.  

  - **Prasajya vs. Paryudāsa in Practice:**  
    NS insists all tetralemma negations are *prasajya* (non-implicative), leaving no implicit thesis. DR agrees but holds that *prasajya* still *establishes* śūnyatā as the groundless ground. Clarifying that "establish" (DR) means "reveals what is already the case" rather than "posits" aligns with NS’s "non-implicative" reading.  

  **Conclusion:**  
  While substantive differences persist—notably on śūnyatā’s assertibility and conventional determinacy—we concur that core disagreements are mitigated by clarifying terminology. Both camps reaffirm Nāgārjuna’s project: the dismantling of *svabhāva* through the catuṣkoṭi, the non-appropriation of views (MMK 13:8), and the soteriological pivot from ignorance to liberation.  

  ---  
  **Signed,**  
  [For the Non-Assertive Soteriologist Interpretation]  
  [For the Dialectical Realist Interpretation]  
  *Date Agnostic*
