  Starting with the tautological reading: ideas as abstract objects. This is a platitude—legally uncontested but doesn't resolve if model weights are expressions or ideas. Weights might straddle both, so this alone doesn't justify copying. The economic reading is defensible; non-rivalry supports open access, but incentive arguments complicate it. For model weights, if seen as functional (like recipes), this could lean against ownership, but patents exist for functional inventions. 

