  ### How to Think Through the Decision

  The lottery ticket involves a sequence of fair coin tosses until the first heads appears, with the payout doubling each time tails comes up: $2 for heads on the first toss, $4 on the second, $8 on the third, and so on. Your math friend is correct that the expected monetary value is theoretically infinite because the series \(\sum_{n=1}^{\infty} (1/2)^n \cdot 2^n = \sum_{n=1}^{\infty} 1\) diverges. However, this infinite expectation assumes no practical constraints, which is unrealistic. In your case, several factors make the infinite expectation irrelevant for decision-making:

  1. **The entrepreneur's limited resources**: He has about $500,000 in liquid assets and cannot pay more than that. This caps the maximum payout at $500,000, which occurs if the first heads appears on the 19th toss or later (since \(2^{18} = 262,144 \leq 500,000\) and \(2^{19} = 524,288 > 500,000\)).

  2. **Your financial situation**: You have $6,000 in savings, so $30 represents 0.5% of your wealth—a meaningful amount. You also mention that losing $30 would hurt more than an ordinary $30 gain, indicating loss aversion (a concept from behavioral economics where losses are felt more intensely than equivalent gains).

  3. **One-time purchase**: This is not part of a long-run betting strategy, so the law of large numbers (which might justify risky bets over many trials) does not apply. You only get one shot.

  4. **Probability of outcomes**: The most likely outcomes are small payouts. For example:
     - 50% chance of $2 (net loss of $28 if you pay $30).
     - 25% chance of $4 (net loss of $26).
     - 93.75% chance of a net loss (if the first heads is on toss 1–4, since payouts ≤ $16 < $30).
     - Only a 6.25% chance of no net loss or better (first heads on toss 5 or later, payout ≥ $32).
     - The probability of a huge payout is minuscule (e.g., 0.00038% chance of winning $500,000 or more).

  Given these factors, here's a structured way to evaluate the decision:

  #### Step 1: Calculate the Expected Monetary Value with the Cap
  With the $500,000 cap, the expected monetary value (EMV) is finite:
  - For tosses 1–18, payout is \(2^n\), and the contribution to EMV is \(\sum_{n=1}^{18} (1/2)^n \cdot 2^n = \sum_{n=1}^{18} 1 = 18\).
  - For tosses 19 and above, payout is $500,000, and the probability is the probability of 18 tails in a row: \((1/2)^{18} = 1/262,144\). The contribution is \(500,000 \times 1/262,144 \approx 1.907\).
  - Total EMV ≈ \(18 + 1.907 = \$19.91\).

  Since the ticket costs $30, the expected net loss is about \(19.91 - 30 = -\$10.09\). Based on EMV alone, the ticket is overpriced.

  #### Step 2: Consider Utility, Not Just Money
  Money has diminishing marginal utility—gaining $10,000 is not 10,000 times better than gaining $1. A common model uses logarithmic utility \(u(x) = \ln(x)\), where \(x\) is wealth. This accounts for risk aversion and the fact that large gains are less valuable proportionally.

  - Your current wealth: \(w = \$6,000\).
  - Utility if not buying: \(u(w) = \ln(6000) \approx 8.6995\).
  - Expected utility if buying (with $30 cost and payout cap):
    \[
    EU = \sum_{n=1}^{18} (1/2)^n \cdot \ln(5970 + 2^n) + \left[ \ln(505,970) \right] \cdot (1/2)^{18}
    \]
    - Numerical calculation gives \(EU \approx 8.6967\) (details below).
    - Since \(8.6967 < 8.6995\), the expected utility of buying is less than not buying.
    - The certainty equivalent (the guaranteed wealth with the same utility) is about $5,983.39 after paying $30, meaning the ticket effectively reduces your wealth equivalent by about $16.61 compared to not playing.

    **Calculation details**:
    - \(\ln(505,970) \approx 13.134\), and \((1/2)^{18} = 1/262,144 \approx 3.8147 \times 10^{-6}\), so the capped term contributes about \(13.134 \times 3.8147 \times 10^{-6} \approx 0.000050\).
    - The main sum (tosses 1–18) contributes about 8.6967 after numerical approximation.
    - Total \(EU \approx 8.6967 + 0.000050 = 8.69675\).
    - Certainty equivalent: \(e^{8.69675} \approx 5983.39\) (after cost).

  #### Step 3: Account for Loss Aversion and Psychology
  You suspect losing $30 would hurt more than gaining $30 would please you. Loss aversion (often modeled with a "loss multiplier" of 1.5–2.5 in prospect theory) makes the ticket even less attractive:
  - High probability of loss: 93.75% chance of net loss with $30 cost, which would feel disproportionately bad.
  - Small potential gains: Even if you win, gains are modest unless you hit a rare high-payout event (e.g., only 3.125% chance of net gain ≥ $34).
  - Regret risk: If you lose, you may regret "wasting" $30; if you win a small amount, it might not feel worthwhile.

  #### Step 4: Assess the Entrepreneur's Solvency Risk
  The entrepreneur's $500,000 cap is binding. If the first heads occurs on toss 19 or later, he pays $500,000—but this has only a 0.00038% chance. Still, he might struggle to pay even this amount, adding risk. There is no legal guarantee beyond his assets.

  ### Should You Buy the Ticket for $30?
  No, buying the ticket for $30 is not advisable. The expected net monetary loss is about $10, and the expected utility is worse than not playing. With loss aversion and your financial context, the high probability of a net loss (93.75%) makes it unwise. You would likely feel the loss of $30 more acutely than the small potential gains.

  ### At What Price Would Buying Make Sense?
  The ticket could be worth buying at a lower price, but this depends on your risk tolerance and utility. Here's a guide:

  - **Based on EMV with cap**: EMV ≈ $19.91, so prices below $20 give a positive expected net value. For example:
    - At $15, expected net gain ≈ $19.91 - $15 = $4.91.
    - At $10, expected net gain ≈ $9.91.

