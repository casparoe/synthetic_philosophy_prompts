  My math friend says the expected value is infinite, which is true. Let me calculate that. The probability that the first heads occurs on the nth toss is \((1/2)^n\) because you need n-1 tails followed by one heads. So, the expected value E is:

  \[ E = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \cdot 2^n \]

  Simplify that: \((1/2)^n * 2^n = (2^n)/(2^n) * (1/2)^n * 2^n\), better to write:

  \[ \left( \frac{1}{2} \right)^n \cdot 2^n = \frac{1}{2^n} \cdot 2^n = 1 \]

  Is that right? \((1/2)^n = 1/2^n\), and \(1/2^n * 2^n = 1\). So each term is 1, and there are infinitely many terms, so the sum diverges to infinity. Yes, expected value is infinite.

  But my other friend points out that the probability of a large payout is small, and $30 is real money to me. Also, the entrepreneur might not be able to pay if the payout is huge, like if heads first appears on the 30th toss, that's over a billion dollars, and he only has $500,000.

  Moreover, for me personally, losing $30 might hurt more than gaining a small amount, and I have limited savings.

  So, I need to think about utility, not just expected value. Expected value being infinite suggests that any finite price is a bargain, but that can't be right because in practice, no one would pay a huge amount for this ticket. It's the St. Petersburg paradox.

  The St. Petersburg paradox is exactly this. The resolution involves considering the utility of money, which is often logarithmic, meaning that each doubling of money adds the same utility, rather than linear utility.

