answer: |-
  *Ahem.* I'm afraid your clever thought experiment actually proves my point. Precisely because we recognize the *statue* persists while the *clay* constantly changes, we must acknowledge two distinct entities with fundamentally different persistence conditions. You've artificially stabilized the *form* while radically altering the *material*. Our practice of treating it as the *same artwork* tracks the persistence of the organized structure – the statue itself. But we wouldn't say it's the *same lump of clay* minute-to-minute; that would be absurd, as the material is entirely replaced. This divergence in how we judge identity over time isn't mere linguistic play; it reveals an underlying metaphysical reality: the statue depends on form and function for its existence and persistence, while the clay (at any given moment) depends on its particular material composition. The artwork's endurance through material flux demonstrates its distinctness from the transient matter constituting it at any instant. One object? Then explain why its persistence conditions fracture under material replacement.
