  Im working on whether 'Western values' is a coherent philosophical category or just a rhetorical boundary-object people deploy in thier own contexts. Before I read more I want the full spec for what an adequate account of this phrase has to deliver.

  Write the desiderata list: the usage-cases it must explain (diplomatic speeches, immigration rhetoric, internal Western self-critique), the distinctions it cant collapse (descriptive vs normative, plural vs singular, geographic vs civilizational), and the tensions it needs to survive (being universal and particular at once). For each give the motivating case and flag any pair that looks jointly unsatisfiable. Then briefly score three approaches against it: the civilizational-inheritance view, the liberal-proceduralist view, and a boundary-object view borrowed from STS.

  No bibliography or citations needed — I just want the criteria and the scoring logic.

  After the prose, give me a table with columns: desideratum | motivating_case | hard_or_negotiable | biggest_threat. Then a JSON object with fields: approach_name, overall_fit, fatal_desideratum, one_line_reason.
reasoning: |-
  We are building a desiderata list for an adequate account of the term "Western values." The account must:
  1. Explain various usage-cases: diplomatic speeches, immigration rhetoric, and internal Western self-critique.
  2. Maintain key distinctions: descriptive vs. normative (is it about what is practiced or what is aspirational?), plural vs. singular (is it a monolithic set or a collection of diverse values?), and geographic vs. civilizational (is it tied to a place or to a cultural tradition?).
  3. Survive tensions: particularly the tension between being universal (claimed to apply to all) and particular (arising from a specific historical context).

  We then evaluate three approaches:
  - Civilizational-inheritance view: Western values as a product of a continuous cultural tradition (Greco-Roman, Judeo-Christian, Enlightenment).
  - Liberal-proceduralist view: Western values as a set of political and procedural norms (democracy, rule of law, human rights) that are not tied to culture but to liberal institutions.
  - Boundary-object view (from STS): "Western values" as a flexible concept that serves different purposes in different contexts (diplomatic, rhetorical, etc.) without a fixed essence.

  Step 1: Build the desiderata list (as a table) with:
     - Desideratum: the requirement.
     - Motivating case: the real-world example that necessitates this requirement.
     - Hard or negotiable: whether this is a strict requirement (hard) or can be fudged (negotiable).
     - Biggest threat: what aspect of the term or which approach might undermine this.

  Step 2: Evaluate each approach with a JSON object containing:
     - approach_name
     - overall_fit: a score (e.g., high, medium, low) for how well it meets the desiderata overall.
     - fatal_desideratum: if there's a requirement that this approach fails so badly that it breaks the model, list it (else null).
     - one_line_reason: a brief explanation.

  Let's break down the desiderata:

  Desiderata List:

  1. **Usage-case: Diplomatic speeches**
     - Motivating case: When a Western leader speaks to non-Western audiences, they invoke "Western values" as a common heritage or a standard to aspire to (e.g., promoting human rights).
     - Hard or negotiable: Hard. The account must explain how the term functions in international discourse.
     - Biggest threat: Collapsing the distinction between descriptive and normative (if the values are presented as universal but are not practiced consistently).

  2. **Usage-case: Immigration rhetoric**
     - Motivating case: In domestic debates, especially in Europe and North America, "Western values" are used to define what immigrants must adopt, often contrasting with the values of their home countries.
     - Hard or negotiable: Hard. The account must capture how the term sets boundaries and defines identity.
     - Biggest threat: Treating the term as purely geographic (ignoring that it's about cultural assimilation) or as monolithic (ignoring internal diversity).

  3. **Usage-case: Internal Western self-critique**
     - Motivating case: Western intellectuals and activists use "Western values" to critique their own societies (e.g., for hypocrisy in not living up to stated values).
     - Hard or negotiable: Hard. The account must allow for self-referential critique without abandoning the term.
     - Biggest threat: The boundary-object view might make the term too fluid to ground critique.

  4. **Distinction: Descriptive vs. Normative**
     - Motivating case: When Western nations criticize human rights abuses abroad (normative claim) but are accused of similar abuses at home (descriptive reality). The account must explain how the same term can refer to an ideal and a flawed reality.
     - Hard or negotiable: Hard. Collapsing this distinction would make the term either overly idealistic or overly cynical.
     - Biggest threat: The liberal-proceduralist view might overemphasize the normative and underplay the descriptive failures.

  5. **Distinction: Plural vs. Singular**
     - Motivating case: Within the West, there are deep disagreements (e.g., on secularism, welfare state, gun rights) but also appeals to a unified set of values. The account must explain both the unity and diversity.
     - Hard or negotiable: Hard. The term must be able to be used in both ways without contradiction.
     - Biggest threat: The civilizational-inheritance view might overemphasize unity and underplay pluralism.

  6. **Distinction: Geographic vs. Civilizational**
     - Motivating case: Australia and Japan are geographically non-Western but sometimes included in "the West" due to shared institutions. Conversely, Latin America is geographically Western but sometimes excluded. The account must explain why geography isn't the sole factor.
     - Hard or negotiable: Hard. The term clearly transcends strict geography.
     - Biggest threat: A geographic interpretation would be too narrow.

  7. **Tension: Universal and Particular**
     - Motivating case: Western values are often presented as universal (e.g., human rights) but also as a particular heritage that must be defended. The account must explain this duality.
     - Hard or negotiable: Hard. This tension is central to the term's usage.
     - Biggest threat: The boundary-object view might resolve the tension by making the term context-dependent, but at the cost of coherence.

  Now, note any pairs of desiderata that seem jointly unsatisfiable:

  - The tension between universal and particular (7) and the need for the term to be used in internal critique (3) might be in conflict because internal critique relies on the universal aspect to hold the society accountable, while the particular aspect is used to defend against external criticism.

  - The plural vs. singular distinction (5) and the diplomatic usage (1) might conflict because diplomacy often projects a singular set of values, but internal diversity might undermine that.

  Now, evaluate the three approaches:

  1. **Civilizational-inheritance view**:
     - Overall fit: Medium. It handles diplomatic usage and the civilizational aspect well, but struggles with pluralism and internal critique.
     - Fatal desideratum: Plural vs. singular. It tends to present a monolithic tradition, ignoring internal diversity.
     - One-line reason: Overemphasizes historical continuity and unity, failing to account for internal pluralism and change.

  2. **Liberal-proceduralist view**:
     - Overall fit: Medium to High. It handles the normative aspect and universal claims well, and fits diplomatic and immigration rhetoric (as procedural norms can be adopted). But it may struggle with the civilizational aspect and internal diversity.
     - Fatal desideratum: Geographic vs. civilizational. It detaches values from geography and culture, which might explain why non-geographic Western nations are included, but fails to explain why these values are called "Western" and not universal human values.
     - One-line reason: Reduces "Western values" to liberal institutions, neglecting historical and cultural roots, making the "Western" label arbitrary.

  3. **Boundary-object view**:
     - Overall fit: High for explanatory power, but low for providing a fixed meaning. It excels at explaining all usage cases and the tensions, but doesn't provide a coherent philosophical category.
     - Fatal desideratum: Internal self-critique. If the term is just a rhetorical tool, then internal critique might lose its force (because there's no stable standard to critique against).
     - One-line reason: Treats the term as contextually fluid, explaining its varied use but undermining its normative force and coherence.

