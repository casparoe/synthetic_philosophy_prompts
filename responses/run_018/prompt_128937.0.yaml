  Right, let's dissect the argument step by step. Premises (1) and (2) are solid—Hacking's looping effects are well-documented. But the leap to (3) assumes no "outside anchor," which is where things start wobbling. Human biology *is* that anchor. Take the catatonia example: even if diagnosis shifts, the underlying neurobiology (like NMDA receptor dysfunction) persists. Point (4) overstates—disorders might reconfigure but not necessarily dissolve. Schizophrenia's core symptoms (hallucinations, disorganization) recur across cultures and eras, suggesting biological constraints. 

  Ah, the chess piece analogy in (6) is clever but flawed. Psychiatric categories aren't *just* rules; they're imperfect maps to biological territory. Point (8) is indeed the reductio—it implies psychiatry is immune to error, which clashes with historical corrections (e.g., drapetomania being debunked). The slip happens between (5) and (6): ontological dependence ≠ total constitution. A storm isn't "just" a meteorological category; it has real wind and rain. Similarly, mental disorders are bio-social hybrids. 

  Alternative paths? The user could embrace "interactive realism": disorders are real patterns stabilized by biology *and* social feedback. Or adopt Kendler's "practical realism"—categories are tools that latch onto causal structures, even if imperfectly. Both avoid the fiction trap without pretending mental disorders are like chemical elements. 

  The user might also appreciate knowing Hacking himself didn't go full anti-realist—he stressed looping effects *change* kinds, not that they *create* them ex nihilo. That nuance helps defang the reductio. 

