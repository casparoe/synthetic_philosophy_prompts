  Next, identifying where the mapping breaks. The main issue is whether moral cognition has an independent calibration standard like combustion. In science, we can measure combustion independently, but in morality, what's the equivalent? Moral realists might say there are objective moral facts, but anti-realists would deny that. This is where the analogy might sneak in a realist assumption. Also, false positives in morality are harder to define because what counts as "harmless" isn't clear-cut. Plus, moral judgments involve reasoning, not just alarms, and they're socially constructed, unlike fire detection.

  The user also wants to know if the analogy imports a particular metaethical framework. Yeah, by using "objective danger" as a pole, it assumes moral realism. If morality isn't objective, then the analogy falls apart because there's no independent standard to compare against. So the debunking argument might only work if you already accept realism, which is circular.

