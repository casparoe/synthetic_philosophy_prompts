answer: |-
  Here's the ranking of moral emotions by effectiveness in repairing moral harm, with one-sentence justifications, and the switch score:

  1.  **Guilt:** Best repair potential as it focuses on the specific harmful *act*, motivates direct amends to the victim, and fosters personal responsibility.
  2.  **Collective Remorse:** Moderately effective repair as it involves group acknowledgment of wrongdoing and can motivate collective restitution, but may diffuse individual responsibility.
  3.  **Shame:** Poor repair potential as it focuses on the flawed *self*, often leads to withdrawal, avoidance, defensiveness, or anger rather than constructive action towards the victim.
  4.  **Normative Embarrassment:** Least effective repair as it primarily concerns social conformity and saving face within the group, not necessarily addressing the harm done to victims or motivating genuine restitution.

  **Switch Score:**  
  Cultures *can* deliberately shift the emphasis within their moral emotion portfolio over time, but it's a complex, slow process involving institutions, education, leadership, and social discourse – **6/10** (Possible but difficult and gradual, not like changing a playlist).

