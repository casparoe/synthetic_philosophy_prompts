answer: |-
  ### Joint Statement: Inside-View Mechanists vs. Outside-View Modestists  
  **Adversarial Collaboration on Epistemic Strategy in Forecasting**

  #### **Part I: Agreed Claims**  
  Both camps endorse the following conceptual propositions:  

  1. **Formal Decomposability of Forecasts**: Any probabilistic forecast can be formally decomposed into two components: (a) a *mechanistic component*, derived from first-person causal modeling of the specific case, and (b) a *reference-class component*, derived from the base-rate distribution of outcomes in a chosen class of analogous historical cases. These components may be combined, weighted, or prioritized differently based on epistemic strategy.  

  2. **Empirical Regularity of Overconfidence**: Uncalibrated human reasoners exhibit a systematic tendency toward overconfidence in long-range, low-feedback domains (e.g., technological forecasting, macroeconomic prediction). This manifests as a persistent gap between subjective confidence intervals and objective accuracy rates.  

  3. **Bayesian Consistency of Reference-Class Updating**: Upon learning that a case belongs to a reference class with a known outcome distribution, it is logically consistent—and normatively required under Bayesian updating—for a reasoner to revise their prior belief to incorporate this base-rate information, irrespective of their inside-view model.  

  4. **Existence of Analogue-Scarce Domains**: Certain domains (e.g., novel technologies, unprecedented geopolitical shifts) exhibit genuine scarcity of direct historical analogues due to rapid structural change, path dependence, or low-frequency events. This scarcity is not reducible to imperfect reasoner cognition.  

  5. **Conceptual Coherence of Recursive Modesty**: The principle of epistemic modesty (i.e., the injunction to downgrade confidence in one’s own inside-view reasoning due to systemic biases) can be coherently applied to itself, raising questions about the stability of second-order judgments (e.g., "Should we be modest about modesty?").  

  ---

  #### **Part II: Disagreements Table**  
  The following table outlines core disagreements. Each formulation reflects the respective camp’s self-described position. "Status" classifies disagreements as *substantive* (rooted in conflicting empirical or normative commitments), *partly verbal* (arising from ambiguous terminology), or *dependent on an empirical crux* (resolvable via specified evidence). Cruxes identify sub-questions whose resolution would shift at least one camp’s position.  

  | Issue | Inside-View Mechanist Formulation | Outside-View Modestist Formulation | Status | Crux (if substantive) |
  |-------|-----------------------------------|------------------------------------|--------|------------------------|
  | **Circularity of Calibration Adjustments** | A reasoner can apply locally justified calibration adjustments to her own current argument without circularity. The track record of her past forecasting errors provides objective, external evidence for adjustment, even if the assessment of similarity to past cases involves inside-view judgment. | Calibration adjustments to one’s own current argument are circular because the assessment of the reasoner’s track record and its applicability relies on the same fallible cognitive processes that necessitate adjustment in the first place, thus amplifying rather than mitigating overconfidence. | Substantive | Can a reasoner objectively assess the relevance of her past calibration performance to her current forecast without that assessment being corrupted by the same biases affecting the forecast itself? (Self-reference crux) |
  | **Scarcity of Historical Analogues** | When direct historical analogues are scarce, reference-class forecasting becomes inapplicable or misleading, as broader classes lack causal similarity to the target case. In such domains, inside-view reasoning must dominate by default, using mechanistic models to extrapolate from sparse data. | Scarcity of direct analogues does not undermine reference-class forecasting; it necessitates shifting to a broader, causally appropriate class whose base rates provide an essential anchor against speculative inside-view overconfidence. The outside view remains universally applicable. | Partly verbal | Conflict arises from divergent interpretations of "causally appropriate." Neutral reformulation: *Both agree that reference classes must balance specificity and statistical power, but disagree on whether "no narrow class exists" implies inside-view default (Mechanists) or broader-class default (Modestists).* |
  | **Recursive Normative Weight of Epistemic Modesty** | Epistemic modesty need not apply recursively to its own application. The empirical evidence for systemic overconfidence in human judgment is robust, generalizable, and exempt from the same uncertainty as domain-specific inside-view models, as it derives from meta-analyses of diverse contexts. | Epistemic modesty must apply recursively: if modesty demands downgrading confidence in domain-specific inside-view reasoning, it equally demands downgrading confidence in the empirical basis for modesty itself, as that basis relies on human-generated meta-evidence subject to identical biases. | Substantive | Is the empirical evidence for systemic overconfidence sufficiently general and well-calibrated to resist the self-referential application of modesty, or is it vulnerable to the same uncertainties it critiques? |

  ---

  #### **Part III: Cruxes and Predictive Tests**  
  For each substantive crux, we define a scenario, each camp’s prediction, and agreed-upon updating conditions.  

  **Crux 1: Circularity of Calibration Adjustments (Self-Reference Crux)**  
  - **Scenario**: Dr. Lee, an economic policy researcher, builds a novel causal model predicting the adoption rate (within ±10% error) of a cryptocurrency-based tax system in a nation with unstable institutions—a domain with few precedents. She simultaneously possesses anonymized data from 100 peers who constructed structurally analogous models (e.g., novel monetary reforms in emerging economies). This dataset includes: (i) each peer’s ex-ante confidence in their model’s prediction (e.g., "80% confidence the true rate falls within my interval"); (ii) ex-post accuracy; and (iii) peer-reported similarity assessments between their model and Dr. Lee’s. The data reveal systemic overconfidence: peers’ 80%-confidence intervals contained the truth only 60% of the time. Dr. Lee, initially 75% confident in her interval, considers a calibration adjustment: reducing confidence to 60% based on the peer error rate.  
  - **Predictions**:  
    - *Mechanists*: Dr. Lee can validly apply the adjustment. The peer data provide an objective, externally sourced track record; her judgment of similarity to peers is a low-inference, defeasible step that does not reintroduce circularity.  
    - *Modestists*: The adjustment is circular. Dr. Lee’s judgment that her model is "structurally analogous" to peers’ models is an inside-view claim vulnerable to overconfidence, and the adjustment thus amplifies error.  
  - **Agreed-Updating Evidence & Predictions**:  
    - Both camps agree that a *randomized control trial* would update them: 200 forecasters in Dr. Lee’s position are split into two groups. Group A applies the calibration adjustment; Group B does not. Calibration (confidence vs. accuracy) and discrimination (resolution of outcomes) are measured.  
      - *Evidence for Mechanists*: If Group A shows better calibration than Group B without losing discrimination.  
      - *Evidence for Modestists*: If Group A shows no calibration improvement (or worse), due to systematic misjudgment of similarity to peers.  
    - **Updating Predictions**:  
      - Mechanists predict Modestists *would not update* even with positive results, dismissing them as artifactually idealistic (e.g., "similarity judgments in trials are simpler than real-world cases").  
      - Modestists predict Mechanists *would not update* even with negative results, attributing failure to "poorly chosen peers" rather than circularity.  

  **Crux 2: Recursive Normative Weight of Epistemic Modesty**  
  - **Scenario**: Dr. Lee recognizes that epistemic modesty is supported by meta-analyses of forecasting studies (e.g., "80% of novel causal models in low-analogue domains are overconfident"). She downgrades her confidence in her cryptocurrency model from 75% to 60% based on this. She then questions: *Should I also downgrade my 95% confidence in the modesty principle itself?* After all, the meta-analyses are human-produced and may overstate their own reliability.  
  - **Predictions**:  
    - *Mechanists*: No recursive downgrade is needed. The meta-evidence for overconfidence derives from aggregated, cross-domain studies with high replicability, making it "meta-calibrated" and exempt from domain-specific modesty.  
    - *Modestists*: Recursive downgrade is mandatory. The meta-analyses are inside-view products of human cognition; trusting them without modesty contradicts the principle’s universality.  
  - **Agreed-Updating Evidence & Predictions**:  
    - Both camps agree that a *track-record analysis of meta-analyses* would update them: Compile 50 published meta-analyses on human overconfidence in forecasting, comparing their stated confidence (e.g., "strong evidence for overconfidence") against ground-truth validation (e.g., subsequent forecasting tournaments testing their conclusions).  
      - *Evidence for Mechanists*: If meta-analyses are well-calibrated (e.g., 95% of "strong evidence" claims hold under new data).  
      - *Evidence for Modestists*: If meta-analyses are overconfident (e.g., "strong evidence" claims fail >20% of the time).  
    - **Updating Predictions**:  
      - Mechanists predict Modestists *would not update* even with positive results, arguing "future meta-analyses may differ."  
      - Modestists predict Mechanists *would not update* even with negative results, dismissing them as "flawed implementations" of meta-science.  

  ---  
  **Signed**,  
  *Representatives of Camp One (Inside-View Mechanists) and Camp Two (Outside-View Modestists)*.  
  *This statement reflects adversarial collaboration: both camps endorse Part I, accept their respective formulations in Part II, and commit to testing the cruxes in Part III.*
