prompt: |-
  Draft the joint statement of an adversarial collaboration between two camps on inside-view reasoning versus outside-view epistemic modesty. Camp One, the Inside-View Mechanists, holds that in domains marked by rapid structural change, sparse historical analogues, and accessible causal mechanisms, first-person model-building should dominate reference-class forecasting, provided the reasoner applies explicit, locally justified calibration adjustments. Camp Two, the Outside-View Modestists, holds that first-person reasoning is systematically overconfident across virtually all domains, that calibration adjustments suffer from the same bias they aim to correct, and that reference-class base rates should dominate unless there is independently verified, domain-specific track-record evidence.

  Structure the deliverable in three parts.

  Part I: Agreed Claims. Provide a numbered list of propositions both sides can sign. These should cover: (a) the formal decomposability of a forecast into a mechanistic component and a reference-class component; (b) the empirical regularity that uncalibrated human forecasters tend toward overconfidence in long-range, low-feedback predictions; (c) the logical consistency of Bayesian updating upon learning one's membership in a reference class; (d) the existence of domains where direct historical analogues are genuinely scarce; and (e) the conceptual coherence of asking whether epistemic modesty applies recursively to its own application. Do not invoke specific empirical studies, named datasets, or bibliographic authorities; keep the agreements conceptual and structural.

  Part II: Disagreements Table. Present a table with four columns: Issue; Inside-View Mechanist Formulation (worded so that camp accepts its own side); Outside-View Modestist Formulation (worded so that camp accepts its own side); Status (substantive, partly verbal, or dependent on an empirical crux). The issues must include at least:
  - Whether a reasoner can apply calibration adjustments to her own current argument without circularity, given that the assessment of her calibration is itself an inside-view judgment.
  - Whether the scarcity of historical analogues in a domain undermines reference-class forecasting or merely forces a shift to a broader, more appropriate reference class.
  - The normative weight of "epistemic modesty" when applied recursively: if modesty demands downgrading inside-view confidence, must it also demand downgrading the confidence in that very demand?

  For each substantive disagreement, identify the crux: the precise sub-question whose resolution would move at least one side. At least one crux must turn on the self-reference problem of second-order calibration injected above.

  Part III: Cruxes and Predictive Tests. For each substantive crux, provide:
  - A concrete, designed scenario or logical structure—not a citation or reading list—that both sides agree bears on the crux. The scenario should feature a researcher who has built a novel causal model predicting an outcome in a domain with few direct precedents, and who simultaneously holds data about the historical failure rate of similarly novel, structurally analogous models constructed by peers in comparable reference classes.
  - The explicit assessment or prediction each camp makes about that scenario.
  - A brief statement of what evidence or argument both sides agree would genuinely update them, together with each side's prediction about whether the other side would in fact update upon receiving it.

  Throughout, avoid requests for bibliographies, reading lists, citations, or appeals to named authorities. Phrase residual disagreements in wording each camp would accept for its own position, and if any portion of the dispute is merely verbal, identify the precise formulation that generates the appearance of conflict and propose a neutral reformulation that dissolves it. Write in a formal, polished register appropriate for philosophy of science or epistemology, ensuring that every claim can be evaluated by a reader without external search.
reasoning: |-
  We are drafting a joint statement between two camps: Inside-View Mechanists (Camp One) and Outside-View Modestists (Camp Two). The structure is three parts.

  Part I: Agreed Claims. A numbered list of propositions both sides can sign. We cover:
  (a) Formal decomposability of a forecast into mechanistic and reference-class components.
  (b) Empirical regularity of human overconfidence in long-range, low-feedback predictions.
  (c) Logical consistency of Bayesian updating upon learning reference class membership.
  (d) Existence of domains with scarce historical analogues.
  (e) Conceptual coherence of recursive application of epistemic modesty.

  Keep these conceptual and structural, without specific studies or authorities.

  Part II: Disagreements Table. Four columns: Issue; Inside-View Mechanist Formulation (as they would put it); Outside-View Modestist Formulation (as they would put it); Status (substantive, partly verbal, or dependent on an empirical crux). Issues must include at least three:
  1. Circularity of calibration adjustments: Can a reasoner apply calibration adjustments to her own current argument without circularity?
  2. Scarcity of historical analogues: Does it undermine reference-class forecasting or just force a shift to a broader class?
  3. Recursive normative weight of epistemic modesty: If modesty demands downgrading inside-view confidence, must it also demand downgrading the confidence in that demand?

  For substantive disagreements, identify the crux (a precise sub-question). At least one crux must turn on the self-reference problem of second-order calibration.

  Part III: Cruxes and Predictive Tests. For each substantive crux:
  - Design a concrete scenario (not a citation) with a researcher who built a novel causal model in a domain with few precedents and holds data on historical failure rates of similar models by peers.
  - The explicit assessment or prediction each camp makes about the scenario.
  - What evidence or argument both sides agree would update them, and each side's prediction about whether the other side would update upon receiving it.

  Avoid bibliographies and appeals to authorities. Phrase disagreements in the camps' own words. If partly verbal, identify the formulation that causes conflict and propose a neutral reformulation.

  Write in a formal, polished register for philosophy of science/epistemology.

  Let's begin.

  Part I: Agreed Claims

  1. Forecasts can be formally decomposed into two components: a mechanistic (inside-view) component that builds a causal model of the specific situation, and a reference-class (outside-view) component that relies on the base rates of outcomes in a relevant class of similar cases.

  2. Uncalibrated human forecasters exhibit a robust empirical tendency toward overconfidence in long-range predictions and in domains with sparse, delayed, or ambiguous feedback.

  3. Upon learning that a specific case belongs to a reference class with a known base rate, it is logically consistent and normatively required for a Bayesian reasoner to update their prior by incorporating that base rate information.

  4. There exist domains characterized by genuine scarcity of direct historical analogues, due to rapid structural change, technological novelty, or other factors that limit the availability of closely comparable past cases.

  5. It is conceptually coherent to ask whether the principle of epistemic modesty (which advises downgrading confidence in one's inside-view reasoning) applies recursively to the application of that very principle, raising questions about the stability of second-order assessments.

  Part II: Disagreements Table

  We have four columns: Issue, Inside-View Mechanist Formulation, Outside-View Modestist Formulation, Status.

  We must cover at least the three issues mentioned. Let's structure the table.

  | Issue | Inside-View Mechanist Formulation | Outside-View Modestist Formulation | Status |
  |-------|-----------------------------------|------------------------------------|--------|
  | **Circularity of Calibration Adjustments** | A reasoner can non-arbitrarily apply calibration adjustments to her own current argument without circularity. The assessment of her calibration can be grounded in locally justified, domain-specific evidence and explicit error-tracking, even if that assessment is itself an inside-view judgment. | Calibration adjustments applied to one's own current argument are inherently circular because the assessment of one's calibration track record and the applicability of that track record to the current case rely on the same fallible cognitive processes that the adjustment aims to correct, thus failing to mitigate overconfidence. | Substantive; Crux: Whether a reasoner can reliably assess her own calibration for the purpose of adjusting a specific forecast without the assessment being corrupted by the same biases that affect the forecast itself. |
  | **Scarcity of Historical Analogues** | When historical analogues are sparse, it is the appropriateness of the reference class that is challenged; if no sufficiently similar class exists, then reference-class forecasting is inapplicable, and inside-view reasoning must dominate by default. | Scarcity of direct historical analogues does not undermine reference-class forecasting; it merely requires shifting to a broader, more abstract reference class. The outside view remains indispensable because the alternative is unanchored speculation, and the base rates from broader classes still provide a crucial sanity check against overconfidence. | Partly verbal; the disagreement hinges on the definition of "sufficiently similar" and the conditions under which a reference class is informative. Neutral reformulation: Both agree that reference classes should be as narrow as possible while maintaining adequate statistical power, but they disagree on the default action when no narrow class exists. |
  | **Recursive Normative Weight of Epistemic Modesty** | The principle of epistemic modesty, which advises downgrading confidence in inside-view reasoning, need not apply recursively to itself because the principle is grounded in robust empirical evidence of systematic overconfidence in human judgment, which is not subject to the same uncertainty as domain-specific inside-view models. | The principle of epistemic modesty must apply recursively: if one is modest about the reliability of inside-view reasoning, one must also be modest about the reliability of the very judgment that inside-view reasoning is unreliable, leading to a regress that can only be resolved by defaulting to the outside view. | Substantive; Crux: Whether the evidence for systematic overconfidence in human judgment (which motivates epistemic modesty) is itself subject to the same level of uncertainty as the inside-view reasoning it critiques, or whether it constitutes a meta-level insight that is exempt from the same modesty requirement. |

  Note: For the second issue, we have marked it as partly verbal and provided a neutral reformulation. The other two are substantive.

  We must have at least one crux turning on self-reference (the first issue does this). The third issue also has a self-referential element.

  Part III: Cruxes and Predictive Tests

  We have two substantive issues: Circularity of Calibration and Recursive Modesty. We'll design a scenario for each.

  But note: the table above identifies two substantive cruxes. We must design a test for each.

  First Crux: Circularity of Calibration Adjustments

  Scenario: A researcher, Dr. A, has built a novel causal model to predict the outcome of a newly proposed economic policy in a developing country with unique institutional features (few direct precedents). Dr. A also has access to a dataset of 50 similar novel economic models constructed by peers in the past two decades for analogous policy interventions in various countries. The dataset includes the modelers' ex-ante confidence levels and the ex-post accuracy of their predictions. Dr. A notes that, on average, these models were overconfident: when modelers assigned 80% confidence, the actual success rate was only 60%. Dr. A, having built her model, initially assigns 75% confidence to her prediction. She then considers applying a calibration adjustment: she plans to reduce her confidence to 60% because of the observed 15% overconfidence in the reference class.

  Predictions:
  - Inside-View Mechanists: Dr. A can non-arbitrarily apply this adjustment. She can use the reference class data to inform a general calibration factor without circularity because the adjustment is based on an objective track record of a class of peers, not on her own subjective assessment of her model. The adjustment is a corrective lens applied externally.
  - Outside-View Modestists: The adjustment is circular because Dr. A is using her inside view to judge that the reference class of peer models is applicable to her own case. She must decide that her model is sufficiently similar to the ones in the dataset, which is itself an inside-view judgment subject to overconfidence.

  Evidence that would update both sides:
  Both sides agree that if we could run a controlled experiment where a large group of forecasters are randomly assigned to either (a) apply the calibration adjustment or (b) not apply it, and then measure the accuracy of their adjusted forecasts versus unadjusted ones, this would be relevant. Specifically, if the adjusted forecasts show improved calibration (i.e., confidence levels match hit rates) without loss of discrimination (ability to distinguish high-probability from low-probability events), that would support the Mechanists. Conversely, if the adjustment fails to improve calibration (e.g., because the forecasters misapply the adjustment due to biased similarity assessments) or worsens discrimination, that would support the Modestists.

  Predictions about updating:
  - Mechanists predict that Modestists would not update even if the experiment showed improved calibration, because Modestists would attribute the success to the specific experimental conditions and maintain that in the wild, circularity remains.
  - Modestists predict that Mechanists would not update if the experiment showed no improvement, because Mechanists would attribute the failure to poor choice of reference class and maintain that with a better reference class, adjustment would work.

  Second Crux: Recursive Normative Weight of Epistemic Modesty

  Scenario: Consider the same Dr. A. She is aware of the empirical literature showing that human forecasters are systematically overconfident in novel domains (the basis for epistemic modesty). She is also aware that this literature itself is based on meta-analyses of forecasting studies, which are subject to potential biases (e.g., publication bias, selection bias in the studies included). She must decide how much to downgrade her inside-view confidence based on the modesty principle. But then she wonders: should she also downgrade her confidence in the modesty principle itself because the meta-analyses are human-produced and thus might be overconfident?

  Predictions:
  - Inside-View Mechanists: The modesty principle is based on a robust, replicated empirical finding that is not domain-specific and has been validated across many contexts. Therefore, it does not require the same recursive application. Dr. A should apply the modesty principle to her domain-specific model but not to the principle itself because the evidence for the principle is of a different, more general kind.
  - Outside-View Modestists: The modesty principle must be applied recursively. The evidence for systematic overconfidence is itself the product of human inside-view reasoning (in designing and interpreting meta-analyses) and is thus subject to the same concerns. Therefore, Dr. A must also downgrade her confidence in the modesty principle, leading to a regress that can only be resolved by defaulting to an outside-view base rate (e.g., the historical accuracy of such meta-analyses).

  Evidence that would update both sides:
  Both sides agree that a study of the track record of meta-analyses on human overconfidence would be relevant. Specifically, if we had a database of such meta-analyses and could compare their stated confidence (e.g., in their conclusions about the degree of overconfidence) with their actual accuracy (e.g., when later tested in new forecasting tournaments), that would bear on the crux. If these meta-analyses consistently show good calibration (i.e., when they claim "there is strong evidence for overconfidence" and that claim holds up in subsequent tests), then the Modestists might accept that recursive application is not necessary in this case. Conversely, if the meta-analyses themselves are overconfident, that would support the Modestists' position.

  Predictions about updating:
  - Mechanists predict that Modestists would not update even if the meta-analyses were well-calibrated, because Modestists would argue that the track record is limited and future applications might differ.
  - Modestists predict that Mechanists would not update even if the meta-analyses were poorly calibrated, because Mechanists would argue that the specific meta-analyses in question were flawed and that the general principle remains valid.

  Now, we must write the entire document in a formal, polished register.

