  Their concrete case about a discredited scientist is particularly revealing. Clara sees renaming institutions as critical history freeing the present, while David views this as inverted antiquarianism - preserving the past negatively. When Clara argues that forgetting requires active judgment, David claims this collapses critical into antiquarian history by making preservation the common denominator.

  Now, assessing Nietzsche's actual view requires nuance. He clearly values all three modes when balanced, with critical history serving as the "pruning shears" for the other two. The hyper-historical sickness he warns against comes from any single mode dominating - including critical history when it becomes an end in itself. 

  David seems closer to Nietzsche's emphasis on balance, particularly in recognizing critical history's proper subordinate role. But Clara rightly notes that forgetting isn't passive - Nietzsche's "plastic power" requires active critical judgment. Both miss that Nietzsche's "life-serving" criterion depends on context: a decaying culture may need critical history more, while a vigorous one needs monumental inspiration.

