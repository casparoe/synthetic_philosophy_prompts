  Now I must identify two consistent meta-rules that explain all four rulings. Rule 1 seems to be "No free-floating relations" - every relation must be grounded in its relata. Rule 2 is "No unanchored dependence chains" - all dependency must terminate in something fundamental. Both rules explain the first four cases, but would differ on the new triadic loop.

