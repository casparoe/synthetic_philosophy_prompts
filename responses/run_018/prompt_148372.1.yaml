  I suspect the instructor uses Rule 1 ("No free-floating relations") because she accepted the intrinsic natures case (which has no fundamental anchor) and the mysterious termination case. The homogeneous circle failed under both rules, so it doesn't distinguish them.

  To settle which rule she uses, we'd need a case with grounded relations but no fundamental anchor - like two terms mutually grounding each other's relations. If she accepts that, she's using Rule 1; if she rejects it, she's using Rule 2.

