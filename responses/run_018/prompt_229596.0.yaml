answer: |-
  ## Final Exam Question

  **Question:** Dennett claims his compatibilist account preserves a substantive notion of *moral responsibility* and *desert* that justifies retributive elements of punishment distinct from purely forward-looking goals. Caruso argues that abandoning *basic desert* necessitates abandoning retributivism entirely, leaving only consequentialist justifications for state coercion. **Identify the precise conceptual point where Dennett and Caruso fundamentally diverge.** Then, critically evaluate whether Dennett’s “competence-based desert” genuinely constitutes a *middle position* between libertarian retributivism and Caruso’s consequentialist/quarantine model, or whether it ultimately collapses into a sophisticated form of forward-looking justification, merely *relabeling* consequentialist concerns as "desert." Defend your assessment with specific reference to their arguments concerning control, justification, and the implications for criminal justice. (90 Minutes)

  ---

  ## Model Answer (Illustrating Top-Marks Structure & Argument)

  **Thesis Statement:** While Dennett successfully carves out a notion of responsibility grounded in competence and avoidability that *differs* from libertarian free will, his resulting concept of "desert" fails to provide a genuinely *retributive* justification for punishment distinct from consequentialism. The core divergence lies in their analysis of the *source* and *normative force* of "control," and Dennett's position ultimately relabels forward-looking social regulation as desert, aligning it more with Caruso's consequentialist aims than he acknowledges, despite important practical differences.

  **1. The Precise Point of Divergence: The Nature of "Control" and Its Normative Significance**
      Dennett and Caruso diverge fundamentally not on the *existence* of human capacities (reasoning, self-control, responsiveness to reasons) but on the *normative implications* of their origin and the *kind* of control they constitute. Both agree humans possess varying degrees of competence. **Caruso** argues that because these competences are ultimately the product of factors beyond an agent's ultimate control (genes, environment, luck), they cannot ground *basic desert* – the idea that one intrinsically *deserves* suffering *because* of a wrongful act, irrespective of future consequences. For Caruso, the lack of *ultimately sourced* control negates any non-consequentialist justification for blame or punishment. **Dennett**, however, contends that the *actual* possession of relevant competences (the ability to perceive, reason about, and avoid wrongdoing given one's circumstances and capacities), even if ultimately caused, is sufficient for a robust form of responsibility *in practice*. The divergence is thus located at the question: **Does the non-ultimacy of the *source* of an agent's competences nullify the normative significance of the *possession and exercise* of those competences for assigning blame and desert?** Caruso answers "Yes," Dennett answers "No."

  **2. Dennett's "Middle Position": Competence vs. Contra-Causal Freedom**
      Dennett rightly positions his view as distinct from libertarianism. He rejects the need for contra-causal freedom or uncaused causes. His "competence-based desert" focuses on whether an agent, *given their actual cognitive architecture and circumstances*, had the *capacity* and *opportunity* to recognize the wrongness of their action and act otherwise. Punishment is deserved only by those who *competently* but *wrongly* exercised their agency – those who "could have done otherwise" in the relevant compatibilist sense. This excludes the insane, the severely coerced, and the utterly incompetent. Dennett argues this provides a genuine desert base: the agent *chose* wrongly when they possessed the competence to choose rightly. This differs from Caruso by preserving blameworthiness *within* the causal web and from pure consequentialism by making desert *contingent on* the agent's past competence/wrongdoing, not *solely* on future benefit.

  **3. The Collapse into Consequentialism? The Normative Vacuum of "Desert"**
      Despite Dennett's intentions, the *justificatory work* done by his "desert" concept is primarily forward-looking, rendering the term "desert" largely honorific. Dennett justifies punishment primarily by its *functions*: (a) *Moral Communication:* Punishment communicates society's condemnation to the wrongdoer and others. (b) *Agency Protection:* Holding competent agents responsible respects them as rational agents capable of understanding and responding to norms. (c) *Deterrence & Protection:* Maintaining a system where competent wrongdoers face consequences deters future harm and protects society. Crucially, **all these justifications are consequentialist:** they appeal to the *future* effects of punishment (reinforcing norms, shaping behavior, protecting society) or to expressive functions valued for their social utility. The "desert" component merely sets *eligibility criteria* (only the competent can be punished) and perhaps *proportionality limits* (punishment shouldn't grossly exceed the wrong). It doesn't provide an independent *reason* for inflicting *suffering itself* beyond its instrumental value in achieving these forward-looking goals. This mirrors Caruso's insistence that only consequences matter; Dennett just adds a competence filter to the application of consequentialist measures. His "desert" is the *condition* for applying consequentialist tools, not a distinct *justification* for the suffering inflicted.

  **4. Implications for Criminal Justice: Relabeling vs. Revolution**
      The practical differences Dennett highlights (preserving blame, proportionality, exculpatory criteria) are significant but stem from differing *consequentialist* calculations, not a distinct desert foundation. Dennett argues his model better maintains social cohesion and moral dialogue than Caruso's quarantine model. Caruso argues his model is more humane and effective at reducing harm. **Both are arguing about the best *forward-looking* outcomes.** Dennett's system *looks* more traditionally retributive because it retains blame and proportionality, but these elements are justified *by him* for their efficacy in maintaining a functional, norm-respecting society. Caruso discards these elements, believing they perpetuate harmful retributive attitudes and are less effective than a pure harm-reduction model. The core disagreement on justification (is suffering *intrinsically* deserved, or only instrumentally justified?) vanishes in Dennett's account; his "desert" is a label for the eligibility criteria within a system justified by consequences.

  **Conclusion**
      The fundamental divergence occurs over whether non-ultimate control can bear the normative weight of basic desert. Dennett's competence-based responsibility is a coherent alternative to libertarianism, providing a valuable basis for distinguishing culpable from non-culpable actors. However, his notion of "desert" lacks independent retributive force. It serves primarily as a gatekeeper and proportionality constraint *within* a system whose ultimate justification – maintaining social order, communicating norms, protecting agency, deterring harm – is thoroughly consequentialist. While Dennett offers a more nuanced and practically conservative reform path than Caruso's radical restructuring, his position is not a genuine middle ground *justificationally*. It relabels sophisticated consequentialism, using the language of desert to describe the conditions under which forward-looking social control is deemed legitimate and effective. To earn desert its justificatory keep, Dennett needs to show why the suffering is *intrinsically* fitting, not just instrumentally useful, which his rejection of ultimacy precludes. Caruso wins the core justificatory argument, even if Dennett's practical model may be preferable.

  ---

  ## Marking Scheme (25 Marks Total)

  1.  **Precise Identification of Divergence Point (5 Marks):**
      *   **Hit:** Clearly articulates the divergence as concerning the **normative significance of non-ultimately sourced control/competence** for desert (Does non-ultimacy nullify the significance of possessed competence?).
      *   **Common Miss:** Vague statements about "free will," conflating divergence with compatibilism vs. hard determinism generally, or focusing solely on practical implications without the normative core.

  2.  **Accurate Exposition of Dennett's "Middle Position" (5 Marks):**
      *   **Hit:** Explains Dennett's **competence-based responsibility** (avoidability, reasons-responsiveness, exclusion of incompetence), its **rejection of ultimacy/contra-causal freedom**, and his claim that it provides a **desert base distinct from both libertarianism and pure consequentialism**.
      *   **Common Miss:** Misrepresenting Dennett as a closet libertarian, downplaying his rejection of ultimacy, or failing to articulate how he *claims* his desert differs from consequentialism.

  3.  **Critical Evaluation of Desert's Independence (5 Marks):**
      *   **Hit:** Effectively argues whether Dennett's desert provides **independent retributive justification** or merely acts as a **consequentialist filter/criterion**. Must analyze the *justificatory work* done by "desert" in his account (e.g., moral communication, deterrence, agency protection as forward-looking justifications).
      *   **Common Miss:** Simply asserting it is or isn't consequentialist without argument, accepting Dennett's labels uncritically, or focusing only on eligibility without addressing justification.

  4.  **Analysis of Justificatory Structures (5 Marks):**
      *   **Hit:** Compares the **underlying justifications** offered by both for punishment/coercion, demonstrating that Dennett's core justifications (**moral communication, deterrence, protection, agency respect**) are fundamentally **forward-looking/consequentialist**, despite using desert language for criteria/limits. Contrasts with Caruso's explicit consequentialism (harm reduction).
      *   **Common Miss:** Listing superficial differences (blame vs. no blame), missing that Dennett's deeper justifications are consequentialist, or failing to connect the analysis of desert's role (Point 3) to the overall justification.

  5.  **Synthesis & Conclusion (5 Marks):**
      *   **Hit:** Provides a clear, defended verdict on the central question: **Is it a genuine middle position justificationally or a relabeling?** Synthesizes points 1-4, acknowledging the value of Dennett's competence model while concluding on the justificatory status of "desert." Clearly states the implication for the desert debate.
      *   **Common Miss:** A neutral summary, an undeveloped or unsupported verdict, or introducing new major arguments not foreshadowed.

  **To earn top marks, a candidate must go beyond summary to pinpoint the normative crux of the disagreement, rigorously dissect Dennett's claimed distinction for desert, demonstrate its justificatory dependence on consequentialism, and deliver a well-supported, critical verdict on its status as a "middle position." The model answer exemplifies this by arguing Dennett's desert is a relabeling within a consequentialist framework.**
