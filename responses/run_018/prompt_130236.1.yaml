  ## ETHICS & PROGRAMMING COMMITTEE DECISION MEMORANDUM  
  **To:** Museum Director, Chief Curator, Head of Public Programming  
  **From:** Ethics & Programming Committee, Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Funding for "The Unrecorded Hours" Immersive Installation  
  **Vote Scheduled:** Thursday, November 2, 2023  

  ### I. BACKGROUND & PROPOSAL
  The Committee has reviewed the funding proposal for *The Unrecorded Hours*, an immersive theatrical installation dramatizing the life and moral conflicts of a prominent 19th-century public-health reformer. The project utilizes archival material for documented events but employs actors, reconstructed dialogue, and clearly labeled speculative scenes to explore undocumented aspects of the reformer's life. Most notably, it includes an invented internal monologue depicting the reformer debating acceptance of a bribe from a factory owner—a scenario absent from the historical record. Formal objections have been raised by the reformer's descendants. They do not contest the accuracy of documented facts presented but argue the speculative interior monologue violates the deceased's "narrative sovereignty" by conscripting them into a psychological drama of hidden vice, a genre unsupported by the archival evidence.

  ### II. COMMITTEE REASONING
  The Committee acknowledges the gravity of the descendants' objection and the conceptual distinction they advance between **epistemic harm** (misrepresenting documented facts) and **narrative sovereignty** (the claim of the deceased not to be subjected to speculative narratives imposing unverified psychological states or moral frameworks). We recognize narrative sovereignty as a distinct posthumous interest worthy of ethical consideration by this institution. A museum of social history has a duty not only to factual accuracy but also to respectful engagement with the human subjects of history, recognizing that the *way* we frame a life shapes public understanding and memory in profound ways.

  However, we also take seriously the artists' compelling argument: **that a categorical prohibition on *all* speculative interiority would severely constrain legitimate historical dramatization.** Biography and historical interpretation inherently involve constructing plausible narratives from fragmentary evidence. Eliminating imaginative engagement with undocumented thoughts, motivations, or private struggles would preclude not only this project but vast swathes of historical theater, film, and literature that enrich public understanding by exploring the "unrecorded hours" where pivotal human choices often reside. The artists' use of clear labeling mitigates epistemic harm, but does not directly address the narrative sovereignty concern about *genre*.

  The Committee rejects both extremes:
  *   **A pure descendant veto** over speculative interiority would impose an unworkable standard, granting disproportionate control to specific lineages and potentially paralyzing the museum's dramatic programming as envisioned by the artists.
  *   **Unqualified artistic license** disregards the ethical weight of narrative sovereignty, particularly when speculating about morally compromising scenarios without archival basis.

  ### III. RECOMMENDATION: CONDITIONAL APPROVAL
  **The Committee recommends APPROVAL of institutional funding for *The Unrecorded Hours*, subject to the following mandatory conditions:**

  1.  **Enhanced Contextualization & Framing:** The installation **must** include significantly strengthened introductory and concluding didactic elements, co-developed by the artists and museum historians/ethicists. These elements must explicitly:
      *   Frame the *entire* speculative dimension (including the internal monologue) as a deliberate artistic *interrogation tool* – not a claim about historical fact – designed to explore the *universal* tensions between public ideals and private pressures faced by reformers in that era.
      *   State unequivocally that the bribe-monologue scene is a hypothetical construct based on known systemic corruption of the period, not on any evidence pertaining to this specific individual.
      *   Emphasize the *absence* of evidence for or against such a temptation in this case, and explicitly acknowledge the descendants' objection regarding narrative sovereignty.
      *   Contextualize the artistic choice within the broader challenge of representing historical figures whose private lives are obscured, framing it as a question for the audience to ponder.
  2.  **Revision of the Internal Monologue Scene:** The bribe-monologue scene **must** be revised to:
      *   Further heighten its hypothetical nature visually or aurally (e.g., distinct lighting/sound design, fragmented delivery, projection of question marks or "Speculative Reconstruction" text overlays during the monologue itself).
      *   Avoid any direct implication of *actual* moral corruption. The focus must shift to the *temptation* as a *structural possibility* within the reformer's world, not a confirmed internal struggle. The language should lean more heavily towards ambiguity and the weight of systemic pressure.
  3.  **Documentation of Ethical Process:** A brief, publicly accessible statement outlining the ethical considerations raised by the descendants and the museum's response (including these conditions) must be included in the exhibition's online materials and available at the physical installation entrance.

  ### IV. RATIONALE FOR CONDITIONAL APPROVAL
  This approach balances the competing imperatives:
  *   **Addresses Narrative Sovereignty:** It takes the descendants' concern seriously by explicitly acknowledging it, rigorously framing the speculation as hypothetical and systemic rather than biographical, and softening the implication of concrete moral failure. This mitigates the harm of conscripting the individual into an unverified "hidden vice" narrative genre by reframing the scene's purpose.
  *   **Preserves Artistic & Historical Value:** It allows a project with significant potential to illuminate the complex social and moral landscape of public health reform to proceed. The conditions focus on *how* the speculation is presented, not a ban on speculation itself, preserving space for legitimate dramatic exploration of historical gaps.
  *   **Avoids Paralysis & Precedent:** It does not grant descendants a veto over interiority per se. Instead, it establishes a framework requiring heightened ethical justification, transparency, and contextual rigor specifically when speculating about *morally compromising* private actions or thoughts *absent any archival evidence*. This sets a precedent for careful scrutiny of narrative framing in sensitive cases without creating a blanket prohibition.
  *   **Upholds Museum Mission:** The enhanced didactic elements transform the installation into an opportunity for the museum to actively engage the public in critical questions about historical representation, ethics, and the limits of knowledge – core to our social history mission.

  ### V. CONCRETE COURSE OF ACTION & TIMELINE
  1.  **Committee Vote:** November 2, 2023.
  2.  **Upon Conditional Approval (if voted):**
      *   **Within 3 Business Days (Nov 7):** Museum Director formally notifies the artists and descendants of the conditional approval and the specific requirements.
      *   **Within 10 Business Days (Nov 16):** Museum Staff (Curator, Head of Public Programming, Ethics Liaison) meet with the artistic team to review conditions and establish a revision plan.
      *   **By December 15, 2023:** Artists submit revised script/storyboard and detailed plans for enhanced contextualization/framing and scene revision to Museum Staff.
      *   **By January 12, 2024:** Museum Staff (including Ethics Liaison) review revisions for compliance with conditions. If compliant, release funding tranche tied to production. If non-compliant, identify specific deficiencies to artists with a 10-day window for resubmission.
      *   **By January 26, 2024:** Final revisions approved by Museum Staff. Public documentation of the ethical process finalized.
      *   **Installation Opening:** Proceeds as scheduled, contingent on meeting all conditions.
  3.  **Appeal Process:** Should the artists find the conditions fundamentally unworkable, they may submit a formal written appeal to the Museum Director within 7 days of notification (Nov 14), outlining specific artistic or conceptual conflicts. The Director will review the appeal in consultation with the Committee Chair and render a binding decision within 10 business days (Nov 28). The descendants retain the right to express their views publicly but have no formal appeal mechanism regarding the Committee's voted decision under museum policy.

  ### VI. CONCLUSION
  The Committee believes *The Unrecorded Hours* possesses significant merit for engaging the public with historical moral complexity. However, the descendants' concept of narrative sovereignty demands a thoughtful ethical response. Conditional approval with mandated revisions and contextualization allows the project to proceed while demonstrating the museum's commitment to responsible historical representation that respects both the fragmented nature of the archive and the inherent dignity of the individuals whose lives we interpret. We recommend this path as a balanced, actionable, and mission-aligned solution.

  **Attachments:** None  
  **Circulation:** Ethics & Programming Committee Members, Museum Director, Chief Curator, Head of Public Programming, General Counsel (for procedural review)
