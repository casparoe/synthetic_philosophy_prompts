prompt: |-
  hey so im a phd student in decision sciences (mostly bounded rationality / satisficing stuff, with some weird side interest in how aspiration levels adapt under partial feedback) and my advisor volunteered me to help our univ's small research ethics board stop debating every amendment to death. they have like 20 minutes per case, zero lawyers on staff, and right now they try to 'maximize ethical coverage' which is impossible so they just stall.

  i need a reusable decision procedure—checklist style, questions in order, what counts as sufficient at each gate, hard stop for no, and explicit hand-off points where its values not facts. it should be grounded in satisficing logic, not optimization: set an aspiration level for risk/info-gain, search only until you hit it or search costs spike, then adapt downward only if the spike is genuine not just impatience. apply it to three protocol amendments: (1) switching survey language in an approved study, (2) adding a biometric sensor not in original consent, (3) extending retention for 'future unspecified analysis.' case 3 should fail the gate but its exactly the kind they always want to rubber-stamp, so flag that tension.

  also include where the board can game the aspiration levels to get the answer they want, and a clear section on what this procedure cant do—like resolve deep disagreement about acceptable risk, just make it visible. sorry this is long, im writing between classes and my trackpad is acting up.
reasoning: |-
  We are designing a satisficing-based decision procedure for a research ethics board (REB) to handle protocol amendments efficiently. The board has only 20 minutes per case and no legal staff. The current approach of trying to "maximize ethical coverage" leads to stalling, so we want a bounded rationality approach.

  Core Principles:
  1. Set aspiration levels for acceptable risk and required information.
  2. Search for information until the aspiration level is met or search costs become too high (with a mechanism to distinguish genuine cost spikes from impatience).
  3. If search costs spike and the aspiration level isn't met, adapt the aspiration level downward only if the spike is genuine (e.g., missing critical information that requires external consultation, which would exceed the 20-minute limit) and not due to impatience.
  4. The procedure should include:
     - A checklist of questions in a specific order.
     - Clear criteria for what counts as sufficient at each gate.
     - Hard stops (automatic rejection) for certain conditions.
     - Explicit hand-off points where the decision is about values (not facts) and must be escalated or handled by the full board.

  Structure of the Decision Procedure:
  We'll have a series of gates. At each gate, the board must answer a question. If the answer is "no", it may lead to a hard stop or an adaptation of the aspiration level. The gates are designed to be sequential and efficient.

  Gates:
  1. **Gate 1: Administrative Completeness**
     - Question: Is the amendment request complete (all required forms, documents, and justifications provided)?
     - Sufficient: All required materials are present and correctly filled.
     - If No: Hard stop. Return to researcher for completion. (No further review until resubmitted.)

  2. **Gate 2: Minimal Risk Threshold**
     - Question: Does the amendment introduce no more than minimal risk? (Minimal risk: probability and magnitude of harm not greater than those ordinarily encountered in daily life or during routine examinations.)
     - Sufficient: The board can determine that the amendment does not increase risk beyond minimal, based on the provided information and without requiring extensive research.
     - If No: Proceed to Gate 3. (But note: non-minimal risk requires more scrutiny.)

  3. **Gate 3: Consistency with Original Consent**
     - Question: Is the amendment consistent with the original consent form and the study's initial purpose?
     - Sufficient: The amendment does not involve procedures that are outside the scope of what participants initially consented to, or if it does, the board can see that the changes are minor and the process for re-consent is addressed.
     - Hard Stop Condition: If the amendment involves a significant change that is not covered by the original consent and the researcher does not propose to re-consent participants, then hard stop (reject). 
     - Otherwise, proceed to Gate 4.

  4. **Gate 4: Risk-Benefit Satisficing**
     - Aspiration Level: The board must set an aspiration level for the risk-benefit balance. The aspiration is that the benefits (scientific knowledge, participant well-being, societal value) must justify the risks, and the risks must be minimized as much as feasible.
     - Question: Does the amendment meet the aspiration level for risk-benefit balance?
     - How to search: Review the researcher's justification and any available evidence. 
     - Sufficient: The board can confirm that the risks are minimized and the benefits justify the risks with the information at hand. If the board cannot confirm within 10 minutes (half the time), then they must decide if the missing information is critical and if obtaining it would exceed the time limit (genuine cost spike). 
     - If the aspiration level is not met due to a genuine cost spike (e.g., need for external expert consultation), then the aspiration level may be adapted downward only if the board can agree that the risks are still acceptable under a lower standard (e.g., the risks are minimal and the benefits are not negligible). Otherwise, reject.
     - If the aspiration level is met, proceed to Gate 5.

  5. **Gate 5: Participant Protections**
     - Question: Are there adequate provisions to protect participant privacy, confidentiality, and welfare?
     - Sufficient: The amendment includes appropriate measures for data protection, and for any new risks introduced, there are mitigation strategies. 
     - Hard Stop Condition: If the amendment involves extending data retention without a clear plan for protecting confidentiality (especially for sensitive data) or without re-consent for extended retention, then hard stop (reject). 
     - Otherwise, proceed to Gate 6.

  6. **Gate 6: Information Sufficiency**
     - Question: Is there enough information to make a decision without further external consultation?
     - Sufficient: The board has all the necessary information to assess the amendment. 
     - If No: The board must decide if the missing information can be obtained within the time constraint. If not, and if the missing information is critical (e.g., about a new device's risks), then reject. If the missing information is not critical, adapt the aspiration level downward (e.g., accept the amendment conditionally on the researcher providing the information later) but only if the board is satisfied that the risks are minimal and the missing information is not essential for ethical approval.

  After passing all gates, the amendment is approved.

  Now, applying to the three cases:

  **Case 1: Switching survey language in an approved study**
  - Gate 1: Complete? Yes.
  - Gate 2: Minimal risk? Yes, changing language does not increase risk.
  - Gate 3: Consistent with original consent? The original consent likely covered participation in a survey. Changing the language (e.g., from English to Spanish) does not change the nature of the study. If the new language version has been validated, then it is consistent. If not, the board might require evidence of validation. But if it's just a translation, minimal risk. Passes.
  - Gate 4: Risk-benefit? Benefits: better inclusion. Risks: minimal. Passes quickly.
  - Gate 5: Protections? No change to protections. Passes.
  - Gate 6: Information sufficient? Yes. 
  - **Decision: Approve.**

  **Case 2: Adding a biometric sensor not in original consent**
  - Gate 1: Complete? Yes.
  - Gate 2: Minimal risk? The sensor (e.g., a wearable) might be minimal risk, but it depends. If it's a common device (like a Fitbit) and used in a non-invasive way, then maybe minimal risk. If it's collecting sensitive data (e.g., heart rate variability for stress), then it might be more than minimal. Let's assume it's more than minimal. So Gate 2 fails but we proceed to Gate 3.
  - Gate 3: Consistent with original consent? The original consent did not mention biometric sensors. This is a new procedure. The board must check: does the researcher propose to re-consent? If yes, then it might be acceptable. If not, then hard stop (reject). But let's assume they do propose re-consent. Then we proceed.
  - Gate 4: Risk-benefit: The board must assess if the benefits justify the risks. They might need information on the sensor's accuracy, potential risks (e.g., skin irritation, data privacy), and how the data will be used. If the information is not provided, the board may hit a search cost spike (because they don't have expertise on the sensor). Then they must decide: if the risks are still acceptable under a lower aspiration? For example, if the sensor is FDA-approved and the study uses it as intended, then maybe acceptable. But if there's uncertainty, they might conditionally approve pending more information, but that might exceed the 20 minutes. Alternatively, they might reject because the risk-benefit isn't clear. 
  - However, if the board is satisfied with the re-consent plan and the risks are minimized (e.g., data encrypted), then they might approve.
  - This case is borderline. But note: the board must not stall. If in 10 minutes they can't get comfortable, they should reject.

  **Case 3: Extending retention for 'future unspecified analysis'**
  - Gate 1: Complete? Yes.
  - Gate 2: Minimal risk? Extending data retention: if the data is de-identified, then minimal risk. If it includes identifiable data, then it might be more than minimal (risk of re-identification). Assume it's identifiable.
  - Gate 3: Original consent: Did the consent form mention future use? If not, then this is a significant change. The board must check: does the researcher propose to re-consent? If not, hard stop (reject). But the case says they want to rubber-stamp it, so we must flag the tension.
  - Gate 5: Protections: This is where we have a hard stop condition. The amendment does not have a clear plan for protecting confidentiality for the extended period. Also, without re-consent, it fails. 
  - **Decision: Hard stop at Gate 5 (or Gate 3) - Reject.** But note: the board might be tempted to skip the hard stop. So we must emphasize: if the original consent did not cover indefinite retention for unspecified research, then it is a hard stop.

  Where the board can game the aspiration levels:
  - In Gate 4 (Risk-Benefit Satisficing), the board can set the aspiration level arbitrarily high (so they always need more information) or arbitrarily low (so they approve without scrutiny). To prevent this, we can:
     - Require that the aspiration level be set at the beginning of the meeting for all cases (e.g., minimal risk as the baseline, and for non-minimal risk, the benefit must be proportional and risks minimized).
     - Document the rationale for any downward adaptation of the aspiration level.

  What the procedure can't do:
  - Resolve deep disagreements about what constitutes acceptable risk. It makes such disagreements visible by requiring explicit hand-off points (e.g., when a decision is based on values, the full board must vote and document the rationale).
  - Handle complex legal issues (since there are no lawyers). The procedure must flag when legal advice is needed (e.g., in Gate 6 if the amendment involves a legal contract) and then the case would be tabled until legal review, which breaks the 20-minute limit. Thus, such cases are rejected by the procedure and must go to a different process.

  Final Checklist Structure:

  **REB Amendment Review: Satisficing Checklist**

  1. **Administrative Completeness**  
     - [ ] All required documents provided?  
     - _If No, reject and return to researcher._  
     - _If Yes, proceed._

  2. **Minimal Risk Threshold**  
     - [ ] Does the amendment introduce no more than minimal risk?  
     - _If Yes, proceed to Gate 3._  
     - _If No, proceed to Gate 3 but note that non-minimal risk requires more scrutiny._

  3. **Consistency with Original Consent**  
     - [ ] Is the amendment within the scope of the original consent?  
     - _If Yes, proceed to Gate 4._  
     - _If No: Does the researcher propose to re-consent current participants?_  
       - [ ] Yes, and the re-consent process is adequate: proceed to Gate 4.  
       - [ ] No: Hard stop. Reject.

  4. **Risk-Benefit Satisficing**  
     - Aspiration level: Benefits must justify risks, and risks are minimized.  
     - [ ] Are the risks minimized?  
     - [ ] Do the benefits justify the risks?  
     - _How to decide:_  
       - Review provided justification (5 minutes).  
       - If information is missing, decide if it's critical and if obtaining it would exceed time (genuine cost spike).  
     - _If aspiration met:_ Proceed to Gate 5.  
     - _If not met and missing information is non-critical:_ Adapt aspiration downward (document rationale) and proceed only if risks are still acceptable.  
     - _If not met and missing information is critical:_ Reject.

  5. **Participant Protections**  
     - [ ] Are there adequate provisions for privacy, confidentiality, and welfare?  
     - _Hard stop conditions:_  
       - Extended data retention without re-consent for identifiable data: Reject.  
       - Inadequate data security: Reject.  
     - _Otherwise, proceed._

  6. **Information Sufficiency**  
     - [ ] Is there sufficient information to make a decision?  
     - _If No:_  
       - Can the missing information be obtained without exceeding the time limit?  
          - If yes, wait (but note: total time must be under 20 min).  
          - If no, and the information is critical: Reject.  
          - If no, and the information is non-critical: Adapt aspiration downward (document) and approve conditionally? (But caution: conditional approval might require follow-up, which breaks the 20-min model. So perhaps reject if critical information is missing and cannot be obtained in time.)  
     - _If Yes:_ Approve.

  **Approval:** If all gates are passed, approve the amendment.

  **Rejection:** At any hard stop, or if at any gate the conditions are not met and cannot be resolved by aspiration adaptation without compromising ethics.

  **Hand-off for Value Judgements:** 
  - In Gate 4 (risk-benefit) and Gate 5 (protections), if the board members disagree on the acceptability of a risk, then the decision must be made by vote (values decision) and documented. The procedure does not resolve the disagreement but makes it explicit and forces a vote.

  **Time Management:** 
  - Allocate 3 min per gate (total 18 minutes) with 2 minutes for wrap-up. 
  - Use a timer. If a gate is taking too long, it triggers the cost spike assessment.

  This procedure should help the board make efficient, ethically sound decisions without stalling.
answer: |-
  Below is a reusable, satisficing-based decision procedure for your university's research ethics board (REB). It's designed as a sequential checklist that **prioritizes efficiency (20-minute limit), adapts aspiration levels for risk/information sufficiency, and forces clear "hard stops" or hand-offs**—grounded in bounded rationality principles. The core logic:  
  - **Aspiration levels** define "good enough" risk/information thresholds.  
  - **Search** stops when aspirations are met _or_ search costs spike (e.g., need for external expertise beyond time constraints).  
  - **Adaptation** only occurs if cost spikes are genuine (e.g., missing critical data), not impatience.  
  - **Values-vs-facts splits** are explicitly flagged for board deliberation.  

  ---

  ### **REB Amendment Decision Procedure: Satisficing Checklist**  
  *(Time allocation: 18 minutes max/case; 2 min buffer for hand-offs/voting)*  

  #### **Gate 0: Pre-Screen (1 minute)**  
  **Question:** Is this a *minor administrative change* (e.g., typo fixes, PI contact updates)?  
  - **Sufficient:** No risk or consent implications.  
  - **Hard Stop:** If **yes**, auto-approve. If **no**, proceed to Gate 1.  

  ---  

  #### **Gate 1: Risk Aspiration Threshold (3 minutes)**  
  **Aspiration Level:** *"No material increase in physical/psychological/social risk beyond original protocol, and risk remains minimal or better."*  
  **Question:** Does the amendment **clearly avoid elevating risk** above minimal (i.e., risks ≤ daily life)?  
  - **Sufficient:** Risk assessment is unambiguous from materials (e.g., survey rewording retains low sensitivity; sensor is FDA-cleared for public use).  
  - **Hard Stop:** If **risk exceeds minimal** (e.g., invasive procedures, sensitive topics) → **Reject**. Proceed only if aspiration met.  
  - **Search Limit:** If unclear after 2 minutes, check for genuine cost spike (e.g., missing safety data). If spike exists, adapt aspiration downward to: *"Risk is justified by direct benefit to participants."* If still unmet → **Reject**.  

  #### **Gate 2: Consent Consistency (4 minutes)**  
  **Aspiration Level:** *"Changes do not invalidate original consent (scope, purpose, or data use)."*  
  **Question:** Is the amendment **covered by the original consent language**?  
  - **Sufficient:** Explicit consent for "similar procedures" or "future analysis" exists.  
  - **Hard Stop:** If **new elements invalidate consent** (e.g., undisclosed data use, added procedures) → **Reject** unless re-consent is feasible/planned.  
  - **Values Hand-off:** If ambiguous (e.g., "implied" consent for related work), escalate to full board vote. **Time limit: 1 minute debate.**  

  #### **Gate 3: Information Sufficiency (4 minutes)**  
  **Aspiration Level:** *"Enough data to assess risk/benefit without external consultation."*  
  **Question:** Is **critical information provided** (e.g., device safety specs, survey validation, retention safeguards)?  
  - **Sufficient:** Key details are included (e.g., sensor error rates, encryption standards for stored data).  
  - **Hard Stop:** If **critical data missing** (e.g., no risk assessment for a new device) → **Reject**.  
  - **Adaptation:** If search cost spikes (e.g., need specialist input → unfeasible in 20 min), adapt aspiration to: *"Information is sufficient given low risk."* If unmet → **Reject**.  

  #### **Gate 4: Benefit/Risk Satisficing (4 minutes)**  
  **Aspiration Level:** *"Benefits (scientific/societal) justify risks; low-risk amendments need only marginal benefit."*  
  **Question:** Is the **risk/benefit balance "good enough"** per the aspiration?  
  - **Sufficient:** Benefits are non-trivial (e.g., improved survey validity, clinically relevant biometrics).  
  - **Hard Stop:** If **risks outweigh benefits** (e.g., high sensitivity data with no participant benefit) → **Reject**.  
  - **Values Hand-off:** If benefits are contested (e.g., "future unspecified analysis"), escalate to vote. **Time limit: 2 minutes debate.**  
  - **Adaptation:** If search costs spike (e.g., complex benefit quantification), adapt aspiration to: *"No foreseeable harm; benefits plausible."*  

  #### **Gate 5: Participant Protections (2 minutes)**  
  **Aspiration Level:** *"Mitigations exist for new risks (e.g., privacy, withdrawal options)."*  
  **Question:** Are **safeguards "reasonably adequate"**?  
  - **Sufficient:** Standard practices used (e.g., anonymization, opt-out clauses).  
  - **Hard Stop:** If **critical gaps exist** (e.g., biometric data without encryption, no re-consent for sensitive changes) → **Reject**.  

  ---  

  ### **Application to Your Cases**  
  *(Using the checklist above)*  

  1. **Switching survey language**  
     - **Gate 1:** Pass (no risk change).  
     - **Gate 2:** Pass (if original consent allows linguistic adjustments).  
     - **Gate 3:** Pass (language validation likely provided).  
     - **Gate 4:** Pass (benefits: inclusivity; trivial risk).  
     - **Gate 5:** Pass (no new privacy issues).  
     - **Outcome:** Approve. **Total time:** ~8 minutes.  

  2. **Adding a biometric sensor**  
     - **Gate 1:** *Aspiration unmet* (potential privacy/psychological risks). Proceed with adaptation.  
     - **Gate 2:** Likely *fail* (not in original consent). **Hard stop unless re-consent feasible.**  
     - **If re-consent planned:** Proceed to Gate 3. Pass if safety specs provided. Gate 4: Pass if health benefits. Gate 5: Pass with data encryption.  
     - **Outcome:** Reject without re-consent plan; approve with it. **Time:** ~12 minutes.  

  3. **Extending retention for "future unspecified analysis"**  
     - **Gate 1:** Pass (minimal risk if data anonymized).  
     - **Gate 2:** **Hard stop** (original consent unlikely to cover this). *This is where boards "rubber-stamp"—flag that extending without consent violates Gate 2.*  
     - **Gate 3:** If forced past Gate 2, *fail* (no safeguards specified → Gate 5 hard stop).  
     - **Gate 4:** *Values tension*: Boards may rationalize "potential" benefits. **Force escalation to vote** with 2-minute debate.  
     - **Outcome:** Reject per procedure. **Time:** ~7 minutes (stops early at Gate 2).  

  ---  

  ### **Where the Board Can "Game" Aspiration Levels**  
  Satisficing is vulnerable to biased aspiration-setting. Watch for:  
  1. **Gate 1/4:** Artificially inflating risk aspirations to reject disliked studies ("This sensor is high-risk!") or lowering them to approve pet projects ("Future analysis is low-risk anyway").  
  2. **Gate 3:** Declaring information "sufficient" prematurely to avoid work.  
  3. **Adaptation abuse:** Claiming "cost spikes" to avoid scrutiny (e.g., skipping diligence on sensors).  
  **Mitigation:** Document rationale for aspiration changes; rotate gatekeepers.  

  ### **What This Procedure CANNOT Do**  
  1. **Resolve value conflicts:** It surfaces disagreements (e.g., "How much risk is acceptable for dementia research?") but **cannot reconcile them**. Outcomes rely on board votes.  
  2. **Replace legal review:** If legal ambiguity arises (e.g., GDPR implications), the procedure flags it → automatic rejection due to search cost spikes.  
  3. **Handle fraud/complexity:** Designed for amendments only. New studies or ethical violations need deeper processes.  
  4. **Override institutional policies:** If university rules conflict (e.g., mandatory data retention), the procedure defers to them.  

  ---  

  ### **Why This Works for Bounded Rationality**  
  - **Satisficing core:** Aspirations define "good enough," stopping endless optimization.  
  - **Cost-spike triggers** force adaptation only when new info is truly inaccessible (e.g., no in-house biometrics expertise).  
  - **Time-bound gates** prevent stalling; hand-offs isolate value debates.  
  - **Adaptation ≠ compromise:** Downward shifts require genuine constraints (e.g., "We can’t assess this sensor in 20 minutes—is the risk still acceptable?").  

  Tailor aspiration levels per your REB’s risk tolerance (e.g., "minimal risk" thresholds). This system won’t eliminate debate but will contain it to 20 minutes/case. Let me know if you need scripting for a voting protocol or aspiration-setting guidelines!
