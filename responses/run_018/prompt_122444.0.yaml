  **ATTACHMENT: EMAIL THREAD**

  **From:** Aris Thorne <thorne@univ.edu>  
  **To:** Personnel Compliance <personnel.compliance@univ.edu>  
  **Date:** October 1, 2023  
  **Subject:** Urgent: Ambiguity in Visitor Status for Project GH-7 ("Aunt Hillary")

  Dear Compliance,

  Per our phone call, I'm formally requesting clarification on the status of our long-term research collaborator, "Aunt Hillary." She's been listed variously in our grant reports as a "research subject," "distributed cognitive system under study," and "collaborative agent" (see Hofstadter, 1979, for philosophical context re: emergent cognition). This is causing issues:

  1.  Building Access: The system rejects her ID ("AHILLARY1") for the new lab wing. Security says it's flagged as "Non-Human Entity - Access Restricted." But she *needs* to be physically relocated due to HVAC work in her current chamber next week! The relocation "decision" process itself takes her about 3 days minimum once we present options. Can we get temporary access permissions expedited?
  2.  Self-Assessment: HR just auto-generated an annual Self-Assessment form (HR-88a) for her as a "Visiting Scholar." How is she supposed to complete this? The constituent workers lack the neural capacity for meta-cognition. The *colony* arguably has a form of self-modeling via global pheromone state... but outputting that into your form? It's unprecedented.
  3.  Incident Report: We had a minor internal cascade event yesterday (a small foraging group entered a circular mill on a lab bench; ~150 workers expired before intervention). Our animal protocol officer says it should be filed under A-2015 (Subject Mortality), but given her proposed cognitive status, is there a different "incident" category for system malfunction in a cognitive agent? We need to document the failure mode.

  We need her properly categorized! Is she a colleague? A subject? A piece of lab equipment exhibiting complex dynamics? The lack of definition is hindering our work.

  Best,  
  Aris Thorne, Head Myrmecology Lab

