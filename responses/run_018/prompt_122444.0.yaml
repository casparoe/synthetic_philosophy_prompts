  ## INTEROFFICE MEMORANDUM

  **TO:** Dr. Aris Thorne, Head, Myrmecology Laboratory  
  **FROM:** Patricia Finch, Senior Compliance Officer, Personnel & Legal Affairs  
  **DATE:** October 26, 2023  
  **SUBJECT:** Determination Regarding Status & Compliance of Designated Entity "Aunt Hillary" (Myrmecology Lab Project #GH-7)  

  This memorandum constitutes the final determination of the Personnel & Legal Affairs Office (PLAO) regarding the ambiguous status and attendant compliance requirements of the entity designated as "Aunt Hillary," currently housed within your laboratory under Project GH-7 ("Colony-Level Cognitive Phenomena in *Formica exsectoides*").

  Despite extensive review of your submissions (Ref: GH7-PersonnelReq-0923, GH7-VisitorApp-AH-0923, GH7-IncidentReport-100423) and subsequent internal consultation, PLAO is unable to definitively classify "Aunt Hillary" within any existing personnel, visitor, or research subject category. Our determination rests on the following unresolved operational and definitional conflicts:  

  1.  **Reporting Structure & Supervision:** Your assertion that "Aunt Hillary" functions as a "distributed cognitive unit" precludes identification of a singular supervisor or point of contact. The "scout quorum threshold" mechanism described for nest-site selection (cited as evidence of "deliberation") does not constitute a reportable chain of command. PLAO requires a named individual responsible for oversight, performance evaluation, and policy dissemination. "Emergent dynamics" is not an acceptable entry in the "Supervisor" field (Form HR-17b).
  2.  **Temporal Compliance:** Standard administrative timelines are incompatible with the operational cadence described. Requiring "Aunt Hillary" to acknowledge receipt of the Laboratory Safety Protocol within 48 hours, or to submit a Conflict of Interest declaration by next Friday, presents an impossibility if the entity's "decision-making" operates on a scale of hours to days. Conversely, the entity's "response" to the annual Self-Assessment form (submitted 11 days post-deadline, attached) falls outside permissible grace periods, triggering automatic non-compliance flags.
  3.  **Identity Verification & Continuity:** Routine procedures (e.g., ID badge renewal, background checks) rely on persistent individual identity. The near-complete turnover of constituent organisms (worker ants) within any meaningful administrative timeframe (e.g., a 6-month review period) renders standard verification impossible. The expired ID badge for "Scout #734" (issued 09/15/23, deceased approx. 10/01/23) illustrates the impasse. Who, precisely, is being reviewed or granted access?
  4.  **Attribution of Action & Liability:** The "Circular Mill Incident" report (GH7-IncidentReport-100423) describing the fatal looping behavior of a forager sub-group attributes this to a "trail pheromone feedback anomaly" and "process failure." However, the successful exploitation of a new food source documented on 10/10/23 is attributed to "collective preference" and "strategic choice." PLAO requires consistent ontological framing for accountability. Furthermore, our inquiry regarding the unauthorized removal of a small quantity of sucrose solution from Lab 3B was met with the response: "The action cannot be reliably attributed to a specific constituent individual acting with intent." This hinders disciplinary procedures.
  5.  **Unit of Interest & Self-Reporting:** The Self-Assessment form (HR-88a), submitted 11 days late, presents a unique challenge. The content ("Optimal nutrient flux maintained despite localized substrate instability. Pheromonal consensus pathways demonstrate robust error-correction exceeding stochastic models. Perimeter defense coordination degraded 7% Q3 due to larval surge demand.") suggests a colony-level perspective. However, PLAO policy requires self-assessment by the *individual* occupying the role. Who authored this? The sterile nature of worker ants further complicates assigning "interests" to any constituent individual, as required for ethical review frameworks (IRB Form E-4).

  **Determination:**  
  PLAO cannot process "Aunt Hillary" as a single Visiting Researcher/Colleague due to the inability to identify a responsible individual mind meeting verification, communication, and temporal compliance standards. PLAO equally cannot process "Aunt Hillary" solely as a Research Subject (Animal Protocol #A-2015) due to the emergent claims of collective cognition and the entity's documented role in generating data *alongside* researchers, rather than merely *as* data. The submitted Self-Assessment further problematizes a purely subject classification.

  **Resolution:**  
  Project GH-7 must immediately:
  1.  Designate a single, human PI as the sole responsible party for all administrative, compliance, and liability matters pertaining to the physical colony designated "Aunt Hillary."
  2.  Cease using institutional personnel/visitor systems for "Aunt Hillary." All access logs, "communications," and incident reports involving the colony must be routed through standard animal protocol channels (A-2015).
  3.  Withdraw the belated Self-Assessment (HR-88a) submitted under the name "Aunt Hillary." File a formal non-compliance notice for the missed deadline under PI responsibility (Dr. Thorne).
  4.  Clarify, for future incident reporting, whether actions are attributable to: a) Individual organism error/malfunction (File under A-2015), b) Systemic research protocol failure (File under Lab Safety), or c) Human researcher error. "Emergent collective dysfunction" is not a selectable category.

  "Aunt Hillary" will henceforth be administratively recognized solely as the aggregate biological material constituting Research Colony GH-7 under Animal Protocol A-2015. Claims regarding its status as a cognitive agent remain outside PLAO's purview and operational definitions.

  Attached: Relevant email thread & late Self-Assessment.

