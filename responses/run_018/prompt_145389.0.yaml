  1. Sympathy is indexical, not analogical. We don't mirror feelings; we use behavior as a calibration target for our predictive models.
  2. Impartial spectator isn't a personified judge but an asymptotic convergence from social calibration.

  The weakest link is explaining why Smith personifies the impartial spectator if it's distributed. The user knows this and wants to prep for it.

