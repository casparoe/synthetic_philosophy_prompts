  Okay, the user is presenting to a seminar on moral psychology and philosophy of mind. They're tackling Adam Smith's Theory of Moral Sentiments (TMS), arguing that sympathy isn't analogical (mirroring feelings) but indexical—using others' expressions to calibrate our own interoceptive predictions. The impartial spectator is the convergence point from calibrating with a social audience. 

  The audience includes a Smith scholar, Humeans who see sympathy as contagious affect, and cog-sci folks into predictive processing. The user needs objections from each camp, replies, concessions, and the weakest link in their argument. They also want to know the objection they're secretly dreading.

