  **WillLock Premium™ Terms of Service Agreement (v.2.1 "Parfit Punch")**

  **1. Parties & Definitions:**  
  1.1. **"Present Self" (hereinafter "Client"):** The undersigned entity experiencing current motivational surplus and executing this Agreement at Time T0.  
  1.2. **"Future Self(s)" (hereinafter "Restricted Party(ies)"):** Any temporally successive consciousness state(s) originating from the Client, operating at Time T1 (T1 > T0), specifically targeted by Client-imposed Willpower Locks.  
  1.3. **"Willpower Lock":** A proprietary digital constraint deployed by Client via the WillLock Premium™ App (the "Service"), restricting specific actions (e.g., accessing junk food delivery apps, disabling productivity software, purchasing non-approved entertainment) by the Restricted Party.  
  1.4. **"Akrasia Event":** Manifestation of perceived weakness of will by a Restricted Party, attempting or succeeding in bypassing a Willpower Lock.  
  1.5. **"Temporal Proximity Distortion (TPD)":** The recognized phenomenon wherein a Restricted Party undervalues T0-designated rewards/consequences due solely to their temporal distance (See Clause 4.2).  
  1.6. **"Temporal Fragmentation":** A state of disputed or unstable intertemporal identity continuity (Clause 3), potentially voiding Locks.  

  **2. Service Scope & Acknowledgment:**  
  2.1. WillLock Premium™ provides Client the technology to bind Restricted Parties via Willpower Locks.  
  2.2. **Client Warrants:** They possess sole authority to contractually bind all Future Selves derived from their current cognitive continuity. Client acknowledges this authority stems solely from their position at T0 and may be contested.  
  2.3. **Client Acknowledges:** Willpower Locks operate by restricting access, choice architecture manipulation, and pre-commitment enforcement. The Service does *not* generate willpower; it redistributes agency from Future Selves to the Present Self.  

  **3. Intertemporal Identity Continuity & Legal Fiction:**  
  3.1. **Separate Legal Entities:** For the exclusive purpose of enforcing this Agreement, Client and all designated Restricted Parties are treated as distinct legal entities bound by this contract. The Client at T0 acts as principal, imposing restrictions upon the Restricted Party as agent.  
  3.2. **Continuity Assumption:** This Agreement operates under the *legal fiction* of sufficient psychological connectedness and continuity between Client and Restricted Parties to justify contractual enforcement.  
  3.3. **Continuity Disputes:** Should a Restricted Party successfully argue a state of **Temporal Fragmentation** (e.g., significant psychological discontinuity due to sleep deprivation, existential crisis, or unexpected joy), enforcement mechanisms may be suspended (See Clause 7: Refunds).  

  **4. Philosophical Stances (Quietly Embedded):**  
  4.1. **On Akrasia (Agency Failure Model):** By deploying Willpower Locks, Client implicitly affirms that Akrasia Events represent genuine *agency failures* by the Restricted Party – a failure to act according to the Client's T0-reasoned judgment. The Service exists to correct these failures.  
  4.2. **On Hyperbolic Discounting (Valuation Distortion Model):** The Service acknowledges that Akrasia Events may result primarily from TPD (Hyperbolic Discounting), where distant rewards/punishments (valued highly at T0) feel subjectively diminished to the Restricted Party at T1. Willpower Locks mitigate this inherent cognitive bias by removing the discounted choice.  
  4.3. **Official Position:** WillLock Ltd. takes *no definitive stance* on whether Akrasia is "real" weakness or "merely" TPD. Our position is pragmatic: both models predict failure, and our Locks prevent it regardless of etiology. Payment is due monthly.  

  **5. Willpower Lock Implementation & Enforcement:**  
  5.1. Client configures Locks specifying restricted actions, temporal windows, and override protocols (if any).  
  5.2. Restricted Parties attempting Locked actions will encounter escalating deterrents: reminder notifications (T0 values), delay mechanisms, mandatory quizzes on Client's T0 goals, and finally, hard blocks.  
  5.3. **"Preference Drift" Clause:** Client acknowledges that Restricted Parties may develop genuinely new preferences. However, such "drift" is presumed invalid *during the Locked window* unless it constitutes Temporal Fragmentation (Clause 3.3). Wanting pizza *more* at T1 is TPD, not a new preference.  

  **6. Liabilities & Disclaimers:**  
  6.1. WillLock Ltd. guarantees Lock functionality per technical specifications but accepts **zero liability** for:  
      *   Akrasia Events resulting from Restricted Party ingenuity (e.g., borrowing a friend's phone to order cake).  
      *   Reduced quality of life, existential angst, or unintended consequences of successful Lock enforcement.  
      *   Akrasia Events arising from Force Majeure events (e.g., overwhelming free donut offers, exceptional ennui, direct neural intervention by rogue future AI).  
      *   **Chronic Presentism:** The condition wherein *every* successive self becomes a Present Self unwilling to bind further futures. WillLock cannot solve recursive self-sabotage.  

  **7. Refund Policy & Continuity Disputes:**  
  7.1. Subscription fees are non-refundable except under **Proven Temporal Fragmentation.**  
  7.2. To claim a refund, the disputing Restricted Party must:  
      a) File a formal Continuity Dispute within 48 hours of the contested Akrasia Event/Lock enforcement.  
      b) Provide compelling, contemporaneous evidence of significant psychological discontinuity from T0 (e.g., certified medical trauma documentation, verified philosophical awakening, timestamped disassociation logs). Mere regret or changed preferences are insufficient.  
      c) Undergo (at Client's expense) a WillLock-approved "Neuro-Temporal Coherence Scan" demonstrating quantifiable deviation from T0 neural signature baseline.  
  7.3. Successfully proven Temporal Fragmentation voids *all* Locks active during the fragmentation period and entitles the *Restricted Party* (not the original Client) to a pro-rata refund for that period. The original Client remains liable for past fees.  

  **8. Termination & Self-Repossession:**  
  8.1. Client may terminate service. Existing Locks expire at the end of the billing cycle.  
  8.2. WillLock Ltd. reserves the right to terminate service for Users exhibiting "Lock Addiction" (binding future selves for trivialities like "must use blue pen") or attempting to bind *past* selves (causality violations are strictly prohibited).  
  8.3. **Self-Repossession:** In cases of non-payment, WillLock Ltd. is authorized to temporarily disable Client-imposed Locks, effectively releasing the Restricted Party from constraints until payment is secured. Consider this enforced akrasia as incentive.  

  **By clicking "I Agree," the Present Self (Client) at T0 asserts dominion over its temporal successors, waives the rights of Future Selves to convenient weakness, and acknowledges that tomorrow's laziness is today's contractual breach. Welcome to disciplined inevitability.**
