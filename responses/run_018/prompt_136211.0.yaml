  For the first required question about differentiating from anti-realism, I'll focus on how her view preserves normativity through social practice rather than representation. The follow-up can challenge the objectivity of pragmatism. 

  For the normal/abnormal boundary question, I'll highlight how abnormal discourse becomes normalizing through power dynamics. The follow-up can ask about safeguards against this.

  For the deflection question about critics, I'll acknowledge her point but push on whether representationalist language might be pragmatically necessary in some contexts. The follow-up can make it harder to dodge by invoking Rorty's own engagement with opponents.

  For cross-cultural disagreement, I'll emphasize redescription as a bridge while asking about avoiding cultural imperialism. The follow-up can question power imbalances in redescription processes.

  For the practical engineering question, I'll contrast technical approaches with democratic processes as examples of different framings. The follow-up can ask how to evaluate "better" redescriptions.

