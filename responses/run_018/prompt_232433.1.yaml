answer: |-
  ### The Surface Conflict
  The conflict arises from two simultaneous regulatory demands: (1) A **disclaimer in retail fund documents** explicitly stating that past performance is not indicative of future results, rejecting the idea that historical returns predict future outperformance. (2) A **prudential risk modeling requirement** mandating that internal risk models (e.g., VaR, stress tests) must be calibrated using ≥10 years of historical data, including crises. The contradiction lies in the regulator’s dual stance: historical data is deemed epistemically worthless for performance claims but essential for risk assessment. This implies that history is simultaneously irrelevant for forecasting returns and indispensable for forecasting risks—a tension at the heart of inductive inference in finance.

  ---

  ### The Implicit Epistemologies
  **Past Performance Disclaimer** assumes a *strong skepticism* about induction for *predictive returns*. It reflects the efficient-market hypothesis (EMH) and no-arbitrage principles: future prices incorporate all available information, making historical alpha statistically insignificant. This view treats markets as non-stationary (distributions shift over time) and performance as contingent on transient factors (luck, changing cycles). Success is seen as non-repeatable, aligning with the "no free lunch" critique: outperformance lacks persistence.  

  **Historical Risk Modeling** assumes a *weak inductivism* for *extreme risks*. It presumes that while returns are unpredictable, market structure (volatility clustering, tail dependencies) exhibits *statistical stationarity* during crises. Historical stress events (e.g., 2008, 2020) reveal persistent behavioral patterns (panic, contagion) and systemic linkages. Regulators view risk as emergent from historical covariance and tail correlations, which are more stable than returns. This leans on ergodicity—that past extremes bound future risks even if exact scenarios don’t recur.  

  The epistemologies differ: the disclaimer rejects induction for *specific outcomes* (returns), while risk modeling accepts it for *structural properties* (dependencies, tail shape).  

  ---

  ### A Principled Reconciliation?
  Three distinctions offer partial reconciliation:  
  1. **Prediction vs. Stress-Testing**: Performance claims target *point estimates* (e.g., "Fund X will beat the market"), while risk models estimate *worst-case bounds* (e.g., "Max loss 10% in a crisis"). History is unreliable for the former but may bound the latter.  
  2. **Past Performance vs. Historical Covariance**: Returns are noisy and skill-independent under EMH, but volatility/correlations show persistence (e.g., GARCH effects). Risk models exploit covariance stationarity, not return predictability.  
  3. **Legal vs. Epistemic Commitments**: The disclaimer is a liability shield against misleading marketing. Risk models are *defeasible tools* for capital adequacy, not forecasts. Regulators accept model risk but demand empirical grounding.  

  However, this remains partly prudential/political:  
  - **Prudential**: Risk models prioritize solvency; false negatives (underestimating risk) are costlier than false positives. Historical calibration, despite flaws, is the least worst option.  
  - **Political**: Disclaimers protect retail investors from sales rhetoric, while institutional risk models face scrutiny.  

  The reconciliation is pragmatic but not fully principled—both rely on history, but for different *tiers of confidence*.  

  ---

  ### The No-Free-Lunch Objection  
  The no-free-lunch (NFL) theorem states that no algorithm can outperform random guessing when averaged over *all possible* data-generating processes. Applied to finance:  
  - If market dynamics are arbitrarily complex (non-stationary, adversarial), historical data offers no edge.  
  - NFL undermines *all* inductive inference, including risk models. If future market "rules" can change unpredictably, 2008 data may mislead 2030 risk assessments.  

  **Does NFL invalidate risk modeling?** Not entirely:  
  1. **Domain-Specific Priors**: NFL assumes uniformity over *all* possible worlds. Real markets operate under constraints (e.g., bounded rationality, regulatory arbitrage), making some structures (fat tails, leverage cycles) more probable.  
  2. **Non-Competitive Goals**: Risk models don’t seek "outperformance" but *resilience*. Even flawed historical models may dominate theoretical alternatives (e.g., Gaussian models) by capturing known biases.  
  3. **Stress Testing as Scenario Planning**: Using history isn’t about forecasting but *exploring fragility*. The goal is preparedness, not prediction.  

  NFL cautions against overfitting but doesn’t forbid historically informed caution.  

  ---

  ### What Would Have to Change  
  If NFL constraints were taken seriously:  
  1. **Complement Historical Data with Forward-Looking Methods**:  
     - Require **agent-based models** simulating novel crises (e.g., climate shocks, crypto collapses).  
     - Mandate **reverse stress tests** identifying unseen vulnerabilities.  
  2. **Diversify Model Epistemology**:  
     - Accept **non-empirical models** (e.g., entropy-based systemic risk indicators).  
     - Use **Bayesian priors** incorporating expert judgment on tail risks.  
  3. **Regulatory Focus on Robustness, Not Calibration**:  
     - Test models against synthetic datasets with structural breaks.  
     - Penalize overreliance on any single dataset (e.g., 10-year minimum becomes a ceiling).  
  4. **Disclose Model Uncertainty**:  
     - Quantify and report estimation error bands for risk metrics.  

  Regulation would shift from *calibration* to *resilience testing*.  

  ---

  ### Verdict  
  The **risk-model requirement** is more defensible. While both requirements face NFL limitations, risk modeling leverages history for *plausible boundary-setting* (e.g., "Losses could resemble 2008"), not point predictions. It acknowledges uncertainty by focusing on extremes, whereas performance disclaimers correctly reject overconfidence but imply history is useless *everywhere*—a stronger claim than NFL necessitates. Prudential regulation must use imperfect tools; risk models, critically applied, offer pragmatic value. The disclaimer, however, is ethically essential to counter salesmanship.
