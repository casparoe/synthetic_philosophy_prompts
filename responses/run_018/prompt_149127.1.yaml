  Hmm, the user seems sophisticated. They mention Bayesian updating and state space modeling, so they likely have a stats or decision theory background. Their phrasing about "sneaky parameters" suggests they've already spotted the core tension: is this a true failure of common priors or just hidden modeling choices? That's astute.

  The key challenge here is constructing an example where the disagreement isn't about probabilities but about the fundamental structure of possibilities. Let me think of a minimal scenario... Ah, a coin toss with possible measurement failure could work. Both agents see identical evidence sequences (say, 3 "Heads" readings), but Agent A treats "FAIL" as its own state while Agent B interprets it as "Tails." 

