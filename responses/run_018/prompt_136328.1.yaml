prompt: |-
  hey so i'm putting together prompts for a dataset on conceptual stuff and this one is for my own sanity too — i'm in a philosophy phd program focusing on moral psychology and we've been arguing in seminar about whether Doris's situationist critique actually hits real Aristotelian virtue ethics or just a strawman that no one holds. Anyway, can you build me a thought experiment to spec? I need a realistic scenario, one paragraph, set in a hospital admin office (not a trolley, please), where an administrator who genuinely has cultivated practical wisdom — not just a rule-follower — ends up causing more patient harm than a colleague with no virtue training, specifically because her practical wisdom led her to weigh contextual details in a way that backfired under institutional time pressure. The colleague just followed a blunt situational protocol and got the better outcome. The harm can't come from her adopting an obviously bad general rule; it has to fall out of the virtue being genuinely optimal in normal contexts but misfiring here because of some structural feature like information assymetry or bueraucratic framing.

  After you lay out the case, walk me through the verdicts: what virtue ethics says about whether this undermines the trait or just shows moral luck, and what situationism says about why attributing the outcome to 'character' is just post-hoc rationalization. I want you to flag exactly which feature does the work — and be honest about whether if you remove that feature the case collapses back into a boring standard example. Also tell me how a virtue ethicist would try to dissolve the case, probably by saying practical wisdom includes knowing its own limits or that the institutional corruption is the real vice here. No bibliographies please — i'm working offline on a train and can't check references. One more thing: make sure the scenario doesn't depend on anyone being a perfect predictor or using exotic physics, just normal human shrewdness. And please, no reading lists either — i just need the scenario and the analysis.
