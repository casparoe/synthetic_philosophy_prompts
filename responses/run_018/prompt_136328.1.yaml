answer: |-
  Here's the thought experiment and analysis tailored to your specifications:

  **Scenario:**  
  Maya, a seasoned hospital administrator known for her practical wisdom, faces simultaneous bed allocation crises: an elderly patient (Patient A) with complex social needs (isolated, frail, dementia) requires discharge coordination, while a deteriorating ER patient (Patient B) needs an ICU bed immediately. Maya knows ER protocol dictates automatic ICU prioritization for Patient B's vitals. However, recalling Patient A’s vulnerability and a past incident where hasty discharge led to readmission, she pauses to contact Patient A’s estranged daughter personally—judging that resolving this relational nuance *now* prevents greater harm later. Ben, her rule-following colleague, faces an identical scenario minutes later. He mechanically triggers the ER protocol, instantly assigning the ICU bed to his ER patient without deliberation. Unbeknownst to both, the hospital’s bed-tracking system had a 7-minute lag (a known IT quirk under investigation). Maya’s 6-minute personal call delayed her ICU assignment just enough that *her* ER patient (Patient B) suffered cardiac arrest in the overloaded ER during the lag, while Ben’s identical protocol compliance beat the lag. Patient A (both cases) was discharged safely days later. Maya’s ER patient died; Ben’s survived.

  **Analysis:**  

  1. **The Structural Feature Doing the Work:**  
     **Information Asymmetry + Bureaucratic Opacity + Time Pressure.**  
     Maya lacked real-time knowledge of the IT lag’s *critical* interaction with ER wait times. Her practical wisdom correctly identified a genuine harm-prevention opportunity (Patient A’s social fragility) *under normal system transparency*. The bureaucracy’s hidden dysfunction (IT lag + ER overcrowding) transformed her contextually sensitive judgment into a lethal delay. Without this specific structural opacity, Maya’s decision is unimpeachable, and Ben’s outcome is luck. Remove it, and the case collapses into mere unfortunate timing.

  2. **Virtue Ethics Verdict (Moral Luck & Systemic Vice):**  
     Virtue ethics claims this is **tragic moral luck**, not a failure of *phronesis*. Maya exhibited correct practical wisdom: she perceived relevant particulars (Patient A’s vulnerability, relational solutions), aimed at *eudaimonia* (preventing readmission/suffering), and acted courageously (prioritizing complex care over bureaucracy). The harm arose from **uncharacteristically hidden systemic corruption** (IT failure + resource strain). A virtue ethicist dissolves the case by arguing:  
     - True *phronesis* includes meta-awareness of institutional limits ("Should I trust this system’s responsiveness right now?").  
     - The *real* vice lies in the hospital’s hidden operational failures, not Maya’s character. She remains virtuous; the outcome was contingent on factors beyond her rational assessment.  

  3. **Situationist Verdict (Character as Post-Hoc Rationalization):**  
     Situationism argues this **undermines trait attribution**. Calling Maya "virtuous" or Ben "rule-bound" is post-hoc storytelling ignoring the power of the situation:  
     - Identical starting conditions + minor situational variation (IT lag timing) caused divergent outcomes.  
     - Maya’s "practical wisdom" was *situationally triggered* (her memory of a past incident) and *situationally punished* (by hidden IT lag). Ben’s "rule-following" was *situationally rewarded* (by beating the lag).  
     - Attributing outcomes to "character" ignores how institutional structures (time pressure, opaque systems) **fragment moral performance** – the same person (Maya) might act "wisely" or "foolishly" based on invisible contextual tweaks.  

  **Why This Isn’t a Strawman:**  
  The scenario avoids caricature by making Maya’s decision **genuinely optimal in 99% of contexts** – addressing social determinants *does* prevent harm, and deliberation *is* superior to blind rule-following. It only fails due to a **rare, institutionally generated trap** (lag + overcrowding) that couldn’t be reasonably anticipated. This targets the Aristotelian claim that *phronesis* reliably navigates particulars *across contexts* by showing how opaque bureaucratic systems can create contexts where virtue’s very strengths (nuance, holistic assessment) become lethal liabilities under unseen constraints. The situationist argues this "trap" is not rare but systemic in complex institutions.  

  **Key Tension:**  
  The case hinges on whether *phronesis* must (or even can) incorporate meta-judgments about **unknowable institutional dysfunctions**. If it can’t, virtue seems brittle in modern bureaucracies. If it must, virtue ethics risks demanding clairvoyance. Situationism exploits this to argue character is eclipsed by systems.
