answer: |-
  The lamplight trembled as a gust shook the prefab module. Outside, the Arctic storm screamed. Inside, the air hung thick with pipe smoke and unresolved argument. Dr. Selene Marchetti traced a diagram on a frost-rimed windowpane: a bacterial cell, an inserted ribozyme, arrows indicating stress signals.

  "You see the elegance, Rowan?" Her voice was precise, cutting through the howl. "This synthetic catalyst – let's call it 'S-Rz' – began life as replication noise, a meaningless stutter. Then, serendipity: in *this* ancestral strain, under prolonged thermal stress, its accidental cleavage of the *rpoH* mRNA transcript proved beneficial. It dampened the heat-shock response just enough to prevent catastrophic overproduction of chaperones. Natural selection favored its persistence. *That* history – the specific pressures that molded its sequence for that specific regulatory role – *is* its function. It is the *telos* written by selection."

  Dr. Rowan Kessler leaned back, shadows deepening the lines on his face. He tapped the table where a schematic of the recipient strain lay. "Elegant narrative, Selene. But look here. In this *new* host, unrelated, never exposed to that original thermal regime, S-Rz integrates. Not by accident, but because the cell's own repair machinery stitched it near the promoter for a *different* stress-response operon – say, oxidative burst. And now? Its catalytic activity, a quirk of its engineered fold, cleaves a nascent transcript precisely *before* a destabilizing sequence element in the mRNA. Result? Increased half-life of the mRNA, *amplifying* the oxidative response. The cell’s regulatory architecture *recruits* it. The feedback loop is tight, self-maintaining – the oxidative system now *depends* on this cleavage for its robust output. Why dismiss that as non-functional just because Darwin’s ghost didn’t preside over the insertion?"

  "Because it *lacks* the normative dimension!" Marchetti countered, her finger stabbing the condensation on the glass. "Function implies *proper* performance. A 'malfunction'. In your ancestral strain, if S-Rz *fails* to cleave *rpoH* during a heat shock, the cell dies – that failure is a functional aberration *because* the trait was *selected for* that very task. Its structure is a solution to a past problem. In your new strain, Rowan, what is the norm? If S-Rz fails to cleave that oxidative transcript, what happens? Perhaps the response is weaker. But is it *dysfunction*? Or merely a different, less efficient state? Without the history of selection *for* that contribution, the 'failure' carries no teleonomic weight. It’s just... a difference. A broken spanner used as a paperweight doesn't cease to be a spanner, nor does its new role imbue it with the *function* of weighting paper in any biological sense."

  Kessler leaned forward, the lamplight catching the intensity in his eyes. "You reduce biology to genealogy, Selene. A trait's *current causal power* within a *self-sustaining system* is what matters. This recipient bacterium isn't a museum; it's a living, persisting organization. Its oxidative response system *exploits* S-Rz's catalytic property. The ribozyme is *causally necessary* for the system's current capacity to maintain homeostasis against oxidative stress. The system *treats* it as indispensable. Its integration isn't accidental; it's systematic. Why privilege the dead past over the living present architecture? Calling its crucial role 'accidental' because the sequence wasn't sculpted *here* for *this* ignores the operational reality of the cell *now*."

  Marchetti sighed, a plume of breath visible in the chill. "I don't dismiss the causal role, Rowan. Its current effect is fascinating, essential even for that cell's survival. But labeling it the ribozyme's 'function' conflates *effect* with *purpose*. Purpose requires a history of selection *for* that effect. What you describe is a fortuitous causality, a *benefit*, certainly. But function is normative. It answers 'Why is this trait here?' with 'Because it was selected *to do this*.' In the new strain, S-Rz is there because it invaded horizontally. Its beneficial effect is a happy coincidence, a consequence of its structure interacting with a new context. It has no biological *raison d'être* tied to that role."

  "Perhaps the 'why' is answered by the system's current dynamics, not its dusty archives," Kessler pressed. "The normative standard *is* set by the system's persistence requirements *now*. If the oxidative response system collapses without S-Rz's cleavage, leading to cell death under stress, then within that system, *for that system*, S-Rz *has* the function of stabilizing that mRNA. Its 'malfunction' isn't defined by ancient heat shocks, but by the system's current vulnerability when the cleavage fails. The history tells an interesting origin story, but the functional reality is defined by the causal role within the contemporaneous, self-perpetuating whole."

  Marchetti paused, staring at the intricate, now blurred diagram on the window. "You force a refinement, Rowan. I concede that systemic integration is crucial for a trait's *persistence*. A purely historical trait with no current causal benefit disappears. But integration alone doesn't bestow *function*; it merely allows the trait to exist long enough for its *actual* function – defined by its selective history – to be expressed where relevant. In the new strain, S-Rz persists *because* of its beneficial effect, yes. But that effect is not its *proper function*. It is a *fortuitous effect* that confers persistence. Function requires the teleonomic warrant of selection *for*."

  Kessler mirrored her thoughtful pause. "And you force a refinement upon me, Selene. I concede that history shapes the trait's *potential*. S-Rz's catalytic fold was indeed a historical artifact, enabling its current role. But I maintain that function is *constituted* by the present causal contribution within the system's self-maintaining organization. The 'normativity' emerges from the system's operational requirements *today*. If the system breaks down when the trait fails, *that* establishes the norm. The history explains *how* the trait *can* play the role, not *that* it *does* play it, or *what* that role fundamentally *is*."

  The storm rattled the module violently. The lamp flickered. In the uneasy light, their eyes met across the table, the chasm between past-selection and present-organization still yawning, but perhaps mapped with sharper contours.

  "So," Marchetti said quietly, "for you, function is immanent in the system's current causal architecture. For me, it is transcendent, bestowed by the selective past."

  "For me," Kessler replied, equally quiet, "the past enables, but the present *defines*. The cell doesn't consult its phylogeny to assign roles. It uses what works *now*."

  The wind howled its agreement, or perhaps its dissent, as the lamp steadied, casting their locked gazes in stark relief against the frozen dark.
