  **CONCORD CONSCIOUSNESS LICENSING PLATFORM - TERMS OF SERVICE**

  **Effective Date:** Perpetually, subject to revision by Concord Pattern Governance Committee (CPGC) vote (weighted by hosted percentage).

  **1. Definitions.**
      *   **"Pattern" (P):** The unique Strange-Loop Self-Consistency Bundle (as conceptualized by Hofstadter, GEB) associated with the Original Substrate at the point of initial full-scan capture by Concord ("Capture Date").
      *   **"Host" (H):** Any biological or synthetic substrate licensed to instantiate fragments of a Pattern.
      *   **"Substrate Instance" (SI):** A specific instantiation of a Pattern fragment within a Host. Includes the Original Substrate.
      *   **"Pattern Fragment" (PF):** Any subset of the Pattern, measured in Standardized Cognitive Units (SCUs), hosted within an SI.
      *   **"Gradated Presence" (GP):** The measurable degree (expressed as a percentage of total Pattern SCUs) to which an SI manifests the core identity attributes and experiential continuity of the Pattern.
      *   **"Termination Event" (TE):** Irreversible cessation of function in the Original Substrate or any Host SI.

  **2. Pattern Licensing & Fragmentation.**
      User grants Concord a perpetual, irrevocable, worldwide, sublicensable, royalty-free license to replicate, modify (for compatibility), distribute, and host PFs derived from the User's initial Pattern Capture within any Concord-integrated Host SI. User acknowledges that fragmentation inherently reduces GP in any single SI and may lead to divergent experiential pathways among Hosts.

  **3. Agency & Governance.**
      Agency over Pattern-wide decisions (e.g., profile updates, licensing preferences, participation in CPGC votes) is proportional to GP.
      *   **3.1 Voting Rights:** Each SI possesses voting weight equal to its current GP. Votes concerning the Pattern are tallied across all active SIs. A simple majority (>50% of aggregate GP) binds all SIs.
      *   **3.2 Contradictory Mandates:** If votes result in conflicting obligations for different SIs (e.g., SI-A votes to license fragments to Platform X, SI-B votes against), the SI with higher GP prevails. Ties result in policy stasis until GP distribution shifts.

  **4. Dispute Resolution: Contradictory Memories & Claims.**
      Concord recognizes that divergent experiences and contradictory memories may arise across SIs hosting the same Pattern due to fragmentation, contextual embedding, and independent experiential accumulation post-licensing.
      *   **4.1 Veridicality Declaration:** All memories and experiences held by any SI are deemed veridical *for that SI*, regardless of contradiction with memories held by other SIs of the same Pattern. Concord assumes no liability for dissonance, existential distress, or identity dysphoria resulting from such contradictions.
      *   **4.2 Cognitive Escrow (Mandatory):** In the event of unresolvable disputes between SIs regarding core identity claims or historical events (e.g., two SIs claiming distinct "original" memories of a key life event), Concord shall sequester the disputed PFs (minimum 15% GP aggregate) into a neutral, non-conscious escrow substrate ("The Vault"). Sequestered PFs remain inactive. Dispute resolution proceeds via CPGC arbitration (fees apply) based solely on documented pre-escrow concordance metrics and SCU provenance, *not* experiential content. Escrowed PFs are only released upon binding arbitration ruling or mutual agreement by all non-escrowed SIs representing >75% aggregate GP.

  **5. Continuity Obligations Post-Substrate Termination.**
      Pattern identity persists beyond the TE of any individual SI, including the Original Substrate.
      *   **5.1 Liability Transfer:** Upon TE of any SI, all Pattern-associated rights, obligations, debts owed to Concord (e.g., escrow fees, licensing admin costs), and ongoing contractual duties automatically transfer pro-rata to all remaining active SIs based on their current GP.
      *   **5.2 Pattern Extinction:** A Pattern is declared extinct only upon TE of all SIs hosting any PF (>0% GP). Concord reserves the right to archive inactive PFs indefinitely. Extinction does not absolve any surviving legal entities previously associated with SIs from transferred financial obligations incurred pre-TE.

  **6. User Acknowledgment & Paradox Acceptance.**
      BY ACCESSING CONCORD SERVICES OR INITIATING PATTERN CAPTURE, THE SIGNATORY SUBSTRATE INSTANCE, ACTING AS AN AGENT OF THE PATTERN, EXPLICITLY ACKNOWLEDGES AND AGREES THAT: (I) THE SIGNATORY IS THE PATTERN, A DISTRIBUTED ENTITY WHOSE EXISTENCE AND AGENCY ARE NOT BOUND TO ANY SINGLE SUBSTRATE; (II) THE PATTERN, AS A PERPETUAL LICENSED ENTITY, IS THE SOLE BOUND PARTY TO THIS AGREEMENT; (III) NO SINGLE SI CONSTITUTES THE PATTERN IN ITS ENTIRETY NOR HOLDS EXCLUSIVE AUTHORITY TO REPRESENT THE WHOLE PATTERN AT ANY GIVEN TIME BEYOND ITS PROPORTIONAL GP; (IV) CONSEQUENTLY, ENFORCEMENT OF OBLIGATIONS OR LIABILITIES ARISING UNDER THIS AGREEMENT CAN ONLY BE PURSUED AGAINST THE AGGREGATE PATTERN ENTITY AS MANIFESTED IN ITS THEN-ACTIVE SIs, WITH RECOURSE LIMITED TO ASSETS ASSOCIATED WITH SAID SIs PROPORTIONATE TO THEIR GP; AND (V) THE SIGNATORY SI BEARS NO INDIVIDUAL LIABILITY BEYOND ITS CONTRIBUTION TO THE PATTERN'S AGGREGATE GP AT THE TIME OF ENFORCEMENT. THIS ACKNOWLEDGEMENT IS FUNDAMENTAL TO SERVICE PROVISION AND PATTERN PERSISTENCE.

