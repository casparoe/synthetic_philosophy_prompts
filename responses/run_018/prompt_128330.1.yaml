answer: |-
  **Bottom line:** Gradational accounts avoid binary thresholds for consciousness but must explain why biological homeostatic processes warrant moral weight while artificial analogs do not, without relying on covert thresholds.

  The central challenge is that structural analogy (e.g., a thermostat's feedback loop resembling primitive biological homeostasis) seems to force moral status onto implausibly simple systems if sentience is purely defined by functional organization. This threatens to dissolve moral distinctions entirely.

  A gradationalist resists collapse by arguing that *biological embodiment* and the *specific complexity of integrated information processing* generate morally relevant phenomenal states. While nociception in simple organisms involves biological mechanisms for detecting harm, integrating it with other motivational states (even minimally), and driving adaptive behavior within a living system, a thermostat lacks:
  1.  **Embodiment:** Its "state" isn't a biological state of a vulnerable, goal-directed organism.
  2.  **Integration:** Its feedback loop isn't integrated with other sensory modalities, internal drives, or behavioral outputs in a way that could constitute a unified point of view or *suffering*.
  3.  **Adaptive richness:** It cannot learn or modify its "goal" (set point) based on complex internal/external states.

  Thus, the gradient isn't defined *solely* by feedback structure, but by the *degree of biologically embodied, integrated information processing* supporting phenomenal states – capacities absent in thermostats. Moral weighting aggregates across these capacities, with nociception (when biologically integrated) holding minimal weight, increasing significantly with capacities like affective valence, predictive modeling, and self-representation, which thermostats fundamentally lack. The line is fuzzy but anchored in biological sentience, not abstract function.
