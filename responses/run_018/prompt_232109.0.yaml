  - Phase 1 (Formation): 5 min (set pattern and discuss stability)
  - Phase 2 (Propagation): 
     - Explain rule and do one step: 10 min
     - If time, do a second move (e.g., east) with a new rule: 10 min
  - Optional challenge: 5 min (if we do the danger cells, but skip for simplicity)
  - Debrief: 20 min

  Total: 55 minutes, leaving buffer.

  **Final Activity Design:**

  **Materials:**
  - Tape to mark a grid: 4 rows by 5 columns (so 20 cells). Label rows 1 to 4 (front to back) and columns 1 to 5 (left to right).
  - Optional: cards for ALIVE (red) and DEAD (blue) for each student to hold and flip. Or just use standing and sitting.

  **Rules:**
  - Each student is at a cell and can see their north, south, east, west neighbors (if they exist).
  - States: ALIVE (stand) or DEAD (sit).

  **Initial Pattern:**
  - At the start: the bar at row2, columns 2,3,4: students at (2,2), (2,3), (2,4) are standing. Others are sitting.

  **Propagation Rule for South:**
  - Next state depends on current state and current states of north and south neighbors:
     - If you are currently ALIVE and your south neighbor exists and is DEAD, then next state is DEAD.
     - If you are currently DEAD and your north neighbor exists and is ALIVE, then next state is ALIVE.
     - Otherwise, next state is the same as current state.

  **Phase Change Wording:**
  > "Now, we have our pattern. This pattern is a symbol that we want to preserve and propagate. Your new task is to move the entire pattern one step south. But remember, you are just a simmball: you can only follow the local rule I'm about to give you. You cannot use any global information. The rule is: [read the rule above]. Let's see if the pattern can move without falling apart. We'll do one step. Ready? Freeze and look at your north and south neighbors. Decide your next state. On three, change: one, two, three!"

  **Scoring:**
  - Start with 10 points.
  - Success in the move: +5 points.
  - Failure: -5 points.

  **Debrief Questions:**
  - "When you changed state, were you thinking about the bar or just following the rule?"
  - "Did the bar seem to be in control? Or were you in control?"
  - "Could you have moved the bar without the rule? What if there were no rule and you had to coordinate? Would that be easier or harder?"
  - Then introduce careenium and real patterns.

  **What if they fail?**
  - Reset and try again. Use it as a learning moment.

  **Honest Note for Discussion:**
  - The activity uses a rule that is designed specifically for the pattern and the desired move. In the careenium, the rules are fixed and the patterns emerge and move due to those fixed rules. We had to change the rules for the move. In reality, the careenium has a single set of rules that allow for a variety of patterns and their interactions. So we must emphasize that in the actual careenium, the patterns are not pre-designed but emerge, and the same rules that form them also allow for their propagation and interaction. Also, the careenium is not spatial in the same way (it's more abstract) and the patterns are more complex symbols.

  This activity should work for undergrads and take about 45-50 minutes, leaving time for debrief.
answer: |-
  ### Activity Design: Simmball Swarm and the Pattern Imperative

  After brainstorming three approaches—cellular automata with grid movement, emergent symbol formation via neighbor-based rules, and pattern propagation with obstacle avoidance—I selected a **hybrid model** that maximizes embodied intuition while minimizing complexity. The core insight: use a human grid to form a "glider" pattern (simplified to an arrow shape for intuitiveness), then force students to preserve it during movement under constraints that make the pattern feel agentive. The activity avoids Game of Life's complexity by using custom local rules for formation and propagation.

  ### Selected Activity: **The Arrow Imperative**
  Students become "simmballs" in a grid, forming a simple arrow pattern. Phase 1 has them create the arrow via neighbor-dependent rules. Phase 2 requires moving the arrow "across a river" (shifting the grid) while preserving its shape, forcing rule-bending to serve the pattern. The phase shift creates the "pattern as boss" sensation.

  ---

  ### Materials List
  - **Tape or chalk:** Mark a **5x5 grid** (25 squares) on the floor. Squares should be ~1m apart for movement.
  - **Index cards (25):** Labeled **"Alive" (15 cards)** and **"Dead" (10 cards)**. Distribute one per student (extras for observers).
  - **Sticky notes (5 colors, 5 each):** For scoring (e.g., blue = +1 point, red = -1).
  - **Whiteboard/projector:** Display rules and score (no diagrams of patterns!).
  - **Timer:** For phases.

  ---

  ### Rules for Students
  **Core Principle:** You only react to **direct neighbors** (up/down/left/right, no diagonals). No talking during the activity.  
  **States:** 
  - **Alive:** Stand and hold "Alive" card. 
  - **Dead:** Sit and hold "Dead" card.  
  **Grid Coordinates:** Label rows 1-5 (front to back), columns A-E (left to right). Assign students randomly to squares.

  #### **Phase 1: Form the Arrow (Local Rule-Following)**
  - **Goal:** Create an arrow pattern (⬆️) using only neighbor rules.  
  - **Pattern:** Arrow = 5 "Alive" cells: 
    - Tip: One center cell (e.g., C3). 
    - Tail: Four cells in a line below it (e.g., C4, B4, D4, C5).  
    *(Hide this shape from students initially!)*
  - **Formation Rule (repeat until stable):**  
    > *"If you have **exactly 1 neighbor** who is 'Alive,' become 'Alive.' Otherwise, become 'Dead.'"*  
    - **Process:** 
      1. Start with all students "Dead" (sitting). 
      2. Instructor counts "Step 1, 2, 3..." every 15 seconds. On each step, all students **simultaneously** apply the rule based on **current neighbor states**. 
      3. After 3-4 steps, the arrow emerges naturally from most initial conditions. If not, reset and add a "seed" (pre-set C3 as "Alive").

  #### **Phase 2: Cross the River (Pattern-Preserving Movement)**  
  - **Goal:** Move the arrow intact to columns D/E (right side) without breaking its shape.  
  - **Propagation Rule (modified for pattern servitude):**  
    > *"If you are 'Alive,' move **one square right** if possible. If blocked, move **down** instead. Always keep the arrow's shape!"*  
  - **Constraints:**  
    - **No direct communication.** Only observe neighbors.  
    - **Scoring stake:** Lose 1 point per step if the arrow breaks (e.g., wrong shape, gaps). Gain 1 point if intact after crossing.  
  - **Process:**  
    1. **Phase shift prompt (key wording):**  
       > *"Great job! You built that arrow. Now imagine it’s a lifeline to cross a river. The arrow **must survive**—if it breaks, you all drown. Get it to the right side in 4 steps. Remember: the arrow is in charge now."*  
    2. Students move one square per step (timed, 20 seconds/step). Movement is individual but must preserve the pattern.  
    3. **Conflict:** If moving right/down breaks the arrow shape, students must **bend the rule** (e.g., move left/up to fill a gap). No global coordination allowed.  

  ---

  ### Timeline (75 Minutes Total)
  1. **Intro (5 min):** 
     - Frame as "collective behavior experiment." Assign grid spots. 
     - Distribute cards; all start "Dead." Emphasize **no talking, only neighbor-checking**.

  2. **Phase 1: Formation (15 min):** 
     - Explain formation rule. Run 4 steps (1 min/step + 2 min reset if needed). 
     - When arrow emerges, freeze and celebrate: *"Look what you made!"*

  3. **Phase 2: Propagation (20 min):** 
     - Deliver **phase shift wording** (above). 
     - Explain propagation rule and scoring. 
     - Run 4 movement steps (20 sec/step + 5 min for pauses to assess damage). 
     - Award points via sticky notes (e.g., blue +=1, red -=1).

  4. **Debrief (30 min):** 
     - Discuss feelings: *"Did the arrow feel like it had needs? Did you break rules for it?"* 
     - Introduce concepts: *"In Dennett’s careenium, you were **simmballs**—tiny rule-followers. The arrow was a **real pattern** (a ‘symbol’). Did it push you around?"* 
     - Map to philosophy:  
       - **Bottom-up:** Phase 1 = simmballs making the pattern.  
       - **Top-down:** Phase 2 = pattern "dictating" simmball actions (symbols driving substrate).  
     - Debate: *"Was the arrow *really* in charge, or just an illusion of your rules?"*

  5. **Wrap-up (5 min):** 
     - Preview next class: "Real patterns and top-down causation."

  ---

  ### Scoring Scheme
  - **+1 point:** Arrow intact after each movement step.  
  - **–1 point:** Arrow broken (e.g., missing tip/tail, extra cells).  
  - **+3 points:** Arrow fully crosses (all 5 cells in columns D/E).  
  - **Stakes:** Group score = extra credit point on next quiz. Leaderboard on whiteboard.

  ---

  ### Predictable Problems & Solutions
  1. **Students deliberately break rules:** 
     - *Prevention:* Stress this is a "physics simulation"—rules are laws. First offense: warn. Repeat: sit out (become "Dead"). 
  2. **Pattern dies in Phase 1:** 
     - *Solution:* Reset with a seed (pre-set C3 "Alive"). If still unstable, simplify rules (e.g., "if ≥1 Alive neighbor, become Alive"). 
  3. **Group falls into global planning:** 
     - *Intervention:* Freeze and remind: *"No talking! What do your **neighbors** tell you?"* 
  4. **Arrow shatters in Phase 2:** 
     - *Recovery:* Pause. Ask: *"Can you ‘heal’ the arrow by bending rules?"* Restart step if unanimous. 
  5. **Movement chaos:** 
     - *Control:* Use timed steps. Appoint observers (extra students) to flag errors.

  ---

  ### Honest Limitation & Post-Activity Discussion
  **Limitation:** The activity **cannot replicate substrate independence**. In the careenium, symbols (like words) are abstract and can be realized by any substrate (e.g., neurons, silicon). Here, the arrow is tied to the grid and human bodies. Students might conflate the pattern’s "needs" with physical constraints.  
  **How to address in debrief:**  
  > *"In the careenium, symbols aren’t locked to grids—they’re multiply realizable patterns. The arrow was your *version* of a symbol, but real symbols (like beliefs) can jump substrates. Our activity shows the *tension*: you felt pushed by the pattern, but in reality, it’s still just simmballs (you!) following rules. Next class, we’ll ask: Can symbols *genuinely* cause things, or is it always bottom-up?"*

  ---

  ### Why This Works
  - **Accessible:** Rules are minimal (no CA knowledge needed). Arrow shape is intuitive.  
  - **Embodied shift:** Students *feel* the pattern’s "demands" in Phase 2 when they bend rules to save it.  
  - **Dennett-ish:** Forces the "intentional stance"—treating the pattern as an agent.  
  - **Flexible:** Works with 15–25 students (adjust grid size; 5x5 ideal).  

  Run it twice if time allows—groups improve dramatically on replay!
