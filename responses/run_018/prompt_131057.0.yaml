prompt: |-
  Before I commit to any framework for analyzing how sustained reliance on generative AI reshapes human cognition, I want the specification first. Write the desiderata that any adequate philosophical account of epistemic dependence on AI — specifically where it produces an erosion of understanding rather than mere knowledge acquisition — must satisfy. For each requirement, state the motivating case or distinction: e.g., the transition from using a model as an external reference tool to treating it as a default reasoning partner; the gap between retaining a true belief and retaining the capacity to generate counterfactual explanations for it; the difference between instrumental delegation and structural cognitive outsourcing in hybrid human-AI belief formation; the asymmetry between understanding an output and being able to reconstruct the inferential path that produced it; and the boundary conditions for assigning epistemic responsibility when an opaque statistical process mediates testimony. Identify which desiderata are non-negotiable (for instance, consistency with established results in social epistemology on testimony and cognitive division of labor, or with empirical findings on the fragility of explanatory access under automation) and which reflect camp-specific preferences (such as demanding full preservation of pre-digital explanatory capacities, or insisting that any delegation to an opaque system necessarily vitiates understanding regardless of the user's meta-cognitive monitoring). Flag any pair or subset of requirements that appear jointly unsatisfiable — particularly if preserving robust individual understanding conflicts with accepting the efficiency gains of delegating complex inference to systems whose internal structure the user cannot represent. Keep the primary weight on the criteria and their motivating cases rather than on the evaluation. Then, briefly, indicate how an extended-mind approach, a corruption-of-testimony model, and a hybrid-cognitive-division view fare against the list, noting where each fails a non-negotiable desideratum or where it resolves an apparent tension.
reasoning: |-
  We are constructing desiderata for an adequate philosophical account of epistemic dependence on AI that leads to erosion of understanding (not just knowledge). We need to cover key distinctions and cases, flag non-negotiables vs. camp-specific preferences, note potential conflicts (especially between robust individual understanding and efficiency gains), and then briefly evaluate three approaches.

  Desiderata:

  1. **Distinguish between external tool use and default reasoning partner:**
     - *Motivating case:* A user occasionally checks a calculator for arithmetic vs. a user who defers all mathematical reasoning to an AI without any independent verification or critical engagement. The latter case risks the user losing the ability to reason mathematically even when the AI is unavailable.
     - *Non-negotiable:* Yes, because it marks the transition from augmentation to replacement, which is central to understanding erosion.

  2. **Account for the gap between true belief retention and retention of counterfactual explanatory capacities:**
     - *Motivating case:* A user may retain a true belief (e.g., "the economy will enter a recession next quarter") from an AI prediction but lose the ability to explain why it would not happen (e.g., if interest rates were cut). This gap is critical because understanding requires the ability to handle counterfactuals.
     - *Non-negotiable:* Yes, based on established philosophical accounts of understanding (e.g., by Kvanvig) that emphasize modal and counterfactual reasoning.

  3. **Clarify the difference between instrumental delegation and structural cognitive outsourcing:**
     - *Motivating case:* Using a GPS for navigation (instrumental delegation) vs. relying on an AI to structure one's entire decision-making process (e.g., an AI that not only provides the route but also decides which goals are worth pursuing). The latter involves outsourcing the cognitive architecture itself, leading to a more profound erosion.
     - *Non-negotiable:* Yes, because it captures a qualitative shift in the nature of cognitive engagement.

  4. **Address the asymmetry between understanding an output and reconstructing the inferential path:**
     - *Motivating case:* A user might understand the conclusion of an AI-generated argument (e.g., "this policy will reduce inequality") without being able to reconstruct the steps that led to it (e.g., the causal model or statistical reasoning). Without reconstruction abilities, the user's understanding is superficial and vulnerable to manipulation.
     - *Non-negotiable:* Yes, because the ability to reconstruct is a key component of understanding in the philosophy of science (e.g., in the context of scientific explanations).

  5. **Provide boundary conditions for epistemic responsibility when using opaque AI:**
     - *Motivating case:* When a doctor uses an AI diagnostic tool that is opaque (e.g., a deep learning system) and the tool makes an error, when is the doctor blameworthy? The account must specify conditions under which the user is responsible (e.g., if they failed to consider conflicting evidence or if they over-relied without calibration).
     - *Non-negotiable:* Yes, because it is required for normative evaluation and aligns with social epistemology on testimony and the division of labor.

  6. **Preserve compatibility with empirical findings on the fragility of explanatory access under automation:**
     - *Motivating case:* Studies (e.g., on automation bias) show that when humans rely on automated systems, their ability to explain the system's decisions deteriorates over time, even if they initially had the capacity. The account must not contradict such evidence.
     - *Non-negotiable:* Yes, because a philosophical account must be empirically adequate.

  7. **Preserve compatibility with established social epistemology on testimony and cognitive division of labor:**
     - *Motivating case:* In science, we rely on experts (division of labor) without losing understanding because we can access the justifications. But with opaque AI, the justifications may be inaccessible. The account must explain when delegation to AI is analogous to delegation to humans and when it is not.
     - *Non-negotiable:* Yes, because it builds on well-established epistemic norms.

  Camp-specific preferences (not non-negotiable):

  8. **Full preservation of pre-digital explanatory capacities:**
     - *Motivating case:* Some may argue that any erosion of the ability to explain without AI is unacceptable. This is a normative stance that may not be universally shared (e.g., some may accept some erosion for efficiency).
     - *Camp-specific:* Yes, this reflects a conservative stance on cognitive preservation.

  9. **Insistence that delegation to an opaque system necessarily vitiates understanding:**
     - *Motivating case:* If a system's internal workings are opaque (e.g., a neural net), then even if the user has meta-cognitive monitoring, they cannot truly understand the output because they cannot grasp the reasons. This is a strong requirement that may be too strict for some.
     - *Camp-specific:* Yes, because one might argue that in some contexts (e.g., using a calculator) we do delegate to opaque systems without losing understanding if we have a high-level grasp.

  Potential conflicts:

  - **Conflict between robust individual understanding and efficiency gains:** 
    - Preserving robust individual understanding (requiring the ability to reconstruct, counterfactual reasoning, etc.) may be at odds with the efficiency gained by delegating complex inferences to AI. This is because the time and effort required to maintain these capacities may be too high in a world of readily available AI. Therefore, desideratum 2 (retaining counterfactual capacities) and 4 (reconstructing inferential paths) might conflict with the practical need for efficiency.

  Evaluation of three approaches:

  a. **Extended-mind approach (Clark & Chalmers):** 
     - Views AI as part of the cognitive system. It might satisfy desiderata 1-3 by showing that the AI is integrated into cognition, but it fails to address the erosion of understanding because it does not require the user to have the capacities in desiderata 2 and 4 (counterfactual and reconstruction). It may also struggle with desideratum 5 (epistemic responsibility) because it blurs the boundaries of the cognitive agent. It does not satisfy the non-negotiables (especially 2, 4, 5) because it doesn't account for the loss of individual capacities.

  b. **Corruption-of-testimony model:**
     - Treats AI as a testifier and focuses on when the testimony is corrupted (e.g., by opacity). This approach might satisfy desideratum 5 (boundary conditions for responsibility) and 7 (social epistemology) because it builds on testimony literature. However, it may not adequately capture the structural outsourcing (desideratum 3) or the asymmetry in desideratum 4 (because testimony typically doesn't require reconstruction of the inferential path). It fails desideratum 2 because testimony can provide knowledge without understanding (and the model doesn't necessarily address how to prevent erosion).

  c. **Hybrid-cognitive-division view:**
     - Sees human-AI interaction as a new form of cognitive division of labor. It may satisfy desideratum 3 and 7 by extending the division of labor to AI. It might resolve the tension between efficiency and understanding (by arguing that the human maintains high-level oversight and the AI handles details). However, it may fail desiderata 2 and 4 if the human does not have access to the counterfactuals or the inferential path. It also must address desideratum 6 (empirical fragility) because if the human doesn't engage with the details, explanatory access may erode. This view might be able to satisfy the non-negotiables only if it incorporates strong requirements for meta-cognitive monitoring and periodic reconstruction by the human.

  In summary:
  - Extended-mind: Fails non-negotiables 2,4,5.
  - Corruption-of-testimony: Fails non-negotiables 2,3,4.
  - Hybrid-cognitive-division: Might satisfy more if designed carefully, but risks failing 2,4,6 without additional safeguards.
answer: |-
  Here is a structured specification of desiderata for an adequate philosophical account of epistemic dependence on generative AI, focusing on the erosion of *understanding* rather than mere knowledge acquisition. The desiderata are grounded in motivating cases, distinctions, and boundary conditions. Non-negotiable requirements (rooted in established epistemology or empirical evidence) are marked with **(\*N\*)**, while camp-specific preferences are labeled **(\*C\*)**. Conflicts between desiderata are noted, followed by a brief evaluation of three theoretical approaches.

  ---

  ### **Core Desiderata for an Account of Epistemic Dependence and Erosion of Understanding**  
  *(Ordered by conceptual priority)*  

  1. **Distinguish Tool Use vs. Integrated Reasoning Partnership**  
     - **Motivation**: Transition from *instrumental* AI use (e.g., checking spelling/definitions) to *default cognitive outsourcing* (e.g., treating AI as a primary collaborator for structuring arguments or generating hypotheses). Erosion occurs when AI supplants the user’s initiative in framing problems or evaluating solutions.  
     - **Non-negotiable (\*N\*)**: Consistency with cognitive science on *attentional disengagement* (e.g., studies showing reduced vigilance when automation becomes routine).  

  2. **Preserve Counterfactual Explanatory Capacity**  
     - **Motivation**: Gap between *retaining true beliefs* (e.g., "AI says inflation will rise") and *retaining the ability to generate alternative explanations* (e.g., "What if supply chains improved?"). Understanding requires sensitivity to dependencies and alternatives, not just assent to outputs.  
     - **Non-negotiable (\*N\*)**: Aligns with philosophical accounts of understanding (e.g., Grimm, Kvanvig) and empirical work on *automation-induced skill decay* (e.g., pilots losing manual flight skills).  

  3. **Address Asymmetry Between Output Acceptance and Path Reconstruction**  
     - **Motivation**: Difference between *grasping an AI’s conclusion* (e.g., "This policy is effective") and *reconstructing the inferential path* (e.g., tracing causal links or evidence). Inability to reconstruct indicates *procedural opacity*, undermining warrant for belief.  
     - **Non-negotiable (\*N\*)**: Supported by epistemology of inference (e.g., Boghossian on blind reasoning) and AI explainability research (e.g., users overtrust simplified "explanations" from LLMs).  

  4. **Demarcate Instrumental Delegation vs. Structural Cognitive Outsourcing**  
     - **Motivation**: Instrumental delegation (e.g., using AI to calculate data) preserves user oversight; structural outsourcing (e.g., AI defining problem spaces or weighting ethical trade-offs) cedes control over cognitive labor. Erosion arises when users lose "meta-task" competence (e.g., formulating research questions).  
     - **Non-negotiable (\*N\*)**: Reflects empirical findings on *deskilling* in human-AI interaction (e.g., healthcare diagnostics where AI reduces clinician exploration).  

  5. **Specify Boundary Conditions for Epistemic Responsibility**  
     - **Motivation**: When opaque AI mediates testimony (e.g., AI-generated scientific summaries), assign responsibility for errors. Boundaries depend on *user diligence* (e.g., checking sources), *system transparency*, and *stakes of the domain* (e.g., medical vs. trivia).  
     - **Non-negotiable (\*N\*)**: Must cohere with social epistemology on testimony (e.g., Fricker on credibility deficits) and division of labor (e.g., Hardwig on expert reliance).  

  6. **Ensure Compatibility with Fragility of Explanatory Access Under Automation**  
     - **Motivation**: Empirical evidence shows *automation complacency* degrades explanatory access (e.g., operators of automated systems cannot troubleshoot failures). Accounts must explain why delegation to AI amplifies this vs. human experts.  
     - **Non-negotiable (\*N\*)**: Grounded in human-factors research (e.g., Endsley’s situation awareness model) and studies on algorithmic aversion/complacence.  

  7. **Reject Necessity of Full System Transparency for Understanding**  
     - **Motivation**: **(\*C\*)** Camp-specific preference: Some argue opacity *always* vitiates understanding; others permit delegation if users employ *heuristic validation* (e.g., comparing AI outputs to domain knowledge).  
     - **Status**: Reflects a **(\*C\*)** internalist vs. externalist split in epistemology. Non-negotiable only if violating empirical bounds (e.g., user confidence exceeding accuracy).  

  8. **Preserve Pre-Digital Explanatory Capacities as Normative Ideal**  
     - **Motivation**: **(\*C\*)** Camp-specific preference: Conservationists insist on maintaining human capacity to solve problems without AI (e.g., manual data analysis); pragmatists accept erosion if net cognitive gains outweigh costs.  
     - **Status**: **(\*C\*)** Normative stance (e.g., virtue epistemology vs. consequentialism).  

  ---

  ### **Key Conflicts Between Desiderata**  
  - **Tension 1: Understanding vs. Efficiency** (Desiderata 2, 4, 6 vs. Delegation Benefits):  
    Preserving counterfactual capacity (2) and avoiding structural outsourcing (4) conflicts with efficiency gains from delegating complex tasks to AI. Empirical evidence (6) shows this trade-off is unavoidable under time constraints.  
  - **Tension 2: Responsibility vs. Opacity** (Desiderata 5 vs. 7):  
    Assigning epistemic responsibility (5) requires feasible user oversight, but opaque systems (7) may make this impossible, creating a "responsibility gap."  

  ---

  ### **Evaluation of Theoretical Approaches**  
  *(Against non-negotiable desiderata)*  

  1. **Extended-Mind Approach** (Clark & Chalmers):  
     - **Fails**: Desideratum 2 (counterfactual capacity) and 4 (structural outsourcing). Treating AI as a "cognitive extension" ignores erosion risks by assuming seamless integration. Also struggles with 5 (responsibility) by blurring agential boundaries.  
     - **Resolves?**: Partially addresses 1 (tool vs. partner) by framing AI as a scaffold, but underestimates deskilling.  

  2. **Corruption-of-Testimony Model** (e.g., AI as unreliable speaker):  
     - **Fails**: Desideratum 3 (path reconstruction) and 6 (explanatory fragility). Reducing AI to testimony overlooks unique opacity issues (e.g., users cannot "question" AI like humans). Also conflicts with 5 if testimony norms are misapplied to statistical systems.  
     - **Resolves?**: Strong on 5 (responsibility) via testimonial norms, but ignores hybrid cognition (4).  

  3. **Hybrid Cognitive Division View** (e.g., AI as specialized inferential partner):  
     - **Fails**: Desideratum 2 (counterfactual capacity) if delegation reduces practice with alternatives. Risks violating 6 (fragility) if users lack "situation awareness."  
     - **Resolves?**: Best addresses 1 (tool/partner spectrum) and 4 (delegation types) by design. Mitigates understanding-efficiency tension (Tension 1) by requiring user meta-cognition (e.g., auditing AI outputs).  

  ---

  ### **Summary**  
  An adequate account must prioritize non-negotiables: counterfactual capacity (2), path reconstruction (3), structural outsourcing (4), and responsibility boundaries (5), while empirically grounding erosion mechanisms (6). The hybrid view best navigates tensions but must incorporate robustness against explanatory fragility. Camp-specific preferences (7–8) should be explicitly flagged to avoid conflation with core criteria.
