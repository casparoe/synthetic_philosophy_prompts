answer: |-
  Here's a breakdown of the statue/clay analogy for person/body, its fracture points, and the impact of hylomorphism:

  ### Analogy Mapping Table
  | **Statue/Clay Case**          | **Person/Body Case**          | **Argument Purpose**                     |
  |-------------------------------|-------------------------------|------------------------------------------|
  | Statue (`David`)              | Person (`You`)                | Constituted entity with identity conditions |
  | Lump of Clay (`Clay-David`)   | Human Body (`Your Body`)      | Constituting matter with identity conditions |
  | Statue destroyed by squishing | Person survives haircut       | Illustrate different persistence conditions |
  | Clay survives squishing       | Body changes but persists     | Matter has "more robust" persistence    |
  | Same matter (coincident)      | Same matter (coincident)      | Reject strict identity (Leibniz's Law)  |

  ### Key Fracture Points
  1. **Temporary Intrinsics Problem (Bending):**
     - *Statue:* If clay bends, the statue is **derivatively** bent (its shape depends entirely on the clay's arrangement). The statue *has* no intrinsic shape properties independent of its matter.
     - *Person:* If your body bends (e.g., at the waist), **you** are *directly and intrinsically* bent. Your embodiment isn't derivative; your mental states directly experience the bending.
     - **Fracture:** Personal properties (pain, posture) aren't derivative of bodily properties in the way statue properties are derivative of clay. The analogy conflates derivative dependence with direct embodiment.

  2. **Destruction Conditions:**
     - *Statue:* Destroyed by rearrangement (squishing) because its identity depends on *aesthetic form*. The clay persists because its identity depends only on *material continuity*.
     - *Person/Body:* A haircut alters the body but doesn't threaten personal identity. But radical changes (e.g., brain destruction) *do* destroy the person, while a corpse (the "body") may persist materially. The body isn't clearly "more persistent" than the person.
     - **Fracture:** Bodily persistence ≠ clay-like persistence. Biological bodies decay and transform; their identity conditions are far less clear than inert clay.

  3. **"Fundamentality" Bias:**
     - The analogy smuggles in the intuition that **matter (body) is metaphysically primary** while form (person/statue) is ephemeral. But this is precisely what's contested! 
     - Why assume the *body* is the "clay" and not the *person*? Constitution theorists reverse this for artifacts (clay is "more fundamental"), but the analogy assumes bodies share clay's ontological status without argument.

  ### Hylomorphism's Impact
  Hylomorphism (form as immanent structural principle) destabilizes the analogy:
  - **Statue-as-Form:** If "statue" is just *the clay's arrangement* (not an added entity), then squishing *is* the destruction of that arrangement. There's no "surviving clay" *as statue-arranged*—just scattered matter. The statue *is* the informed clay.
  - **Person-as-Form:** If a person is the body *informed by rational capacities* (Aristotelian view), then destroying the brain (the seat of rational form) destroys the person *and* the human body as such—leaving a corpse (a new entity). No "clay-like" body survives.
  - **Consequence:** Hylomorphism collapses constitution into **identity**:  
    `Person = Body-Informed-Rationally` / `Statue = Clay-Informed-Statuewise`.  
    The analogy now fails entirely—there's no separate "clay" or "body" surviving destruction when the form is lost. Squishing *is* destruction; brain death *is* death.

  ### Does the Analogy Carry the Argument?
  **No—it begs the question by assuming bodily primacy.** Here's why:
  1. It presumes bodies are "clay-like": inert matter with simple persistence conditions. But biological bodies are processual, evolving entities—not static lumps.
  2. It ignores that *personal identity conditions may constrain bodily persistence*. If your mind requires a functioning brain, the "body" surviving brain death isn't *your body* anymore—just as scattered clay isn't *David's clay*.
  3. The haircut example is misleading: hair isn't essential to bodily identity. A better comparison would be organ transplantation—where bodily boundaries blur, weakening the "clay" intuition.

  ### Conclusion
  The statue/clay analogy **smuggles in materialist intuitions** (bodies = fundamental "stuff") while obscuring key disanalogies:
  - Temporary properties are *intrinsic* to persons but *derivative* for artifacts.
  - Destruction conditions for persons are tied to psychological continuity, not mere bodily continuity.
  - Hylomorphism dissolves the analogy by reducing form to structure, making constitution collapse into identity.

  **To push back:** Argue that the analogy only works if we *already assume* bodies are metaphysically prior to persons—which is the very point at issue. Highlight the directness of personal embodiment vs. derivative artifact properties. Invoke hylomorphism to show that if form isn't an "add-on," the constitution view loses its force. The analogy doesn't *prove* constitution; it *illustrates* a materialist bias under scrutiny.
