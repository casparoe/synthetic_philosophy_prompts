answer: |-
  ### Research Proposal: The Logical Structure of Contrastive Explanation in the Great Dividerence Debate  

  #### 1. Structural Problem  
  The "Great Divergence" is ubiquitously framed as a contrastive question: "Why did Britain industrialize in the 19th century, and not China?" This framing presupposes that China constitutes a valid comparator for Britain, primarily because both were advanced agrarian empires with sophisticated markets and technology circa 1500. However, this pairing risks being *outcome-dependent*: China is selected retroactively *because* it shared apparent preconditions yet failed to industrialize. Such selection conflicts with philosophical accounts of contrastive explanation (e.g., Lipton, van Fraassen), where a well-posed "Why P rather than Q?" requires Q to be a "live alternative" specified independently of observing P’s occurrence. If the comparator is chosen post hoc based on the outcome (industrialization), the contrast becomes circular—it presupposes the explanandum. This proposal examines whether the Britain-China pairing violates the logical structure of contrastive explanation, potentially undermining its explanatory power.  

  #### 2. Gaps in Existing Scholarship  
  Current literature leaves this problem unresolved. Economic historians (e.g., Pomeranz, Mokyr) treat the Britain-China dyad as self-evident, focusing on proximate causes (e.g., coal access, institutions) without scrutinizing the comparator’s selection logic. Conversely, philosophers of science (e.g., Woodward, Garfinkel) analyze contrastive explanation abstractly but rarely engage with macrohistorical cases. This creates a dual gap: historians assume the pairing’s validity, while philosophers neglect its empirical application. The result is an unexamined circularity: China is deemed a "natural" comparator *because* it "failed," but this very failure is what the contrast seeks to explain.  

  #### 3. Methodological Approach  
  This study adopts a three-phase analytical framework:  

  **Phase 1: Formalizing Selection Criteria**  
  - **Task**: Systematize explicit and implicit criteria used in canonical Great Divergence texts to justify the Britain-China pairing (e.g., demographic similarity, technological parity, market integration circa 1500).  
  - **Output**: A taxonomy of criteria (e.g., "shared preconditions," "parallel development until 1800"), distinguishing between *ex ante* factors (theoretically knowable before industrialization) and *ex post* rationalizations.  

  **Phase 2: Testing for Outcome Dependency**  
  - **Task**: Apply a *reference-class independence condition* adapted from causal inference (e.g., Pearl’s do-calculus). This tests whether the criteria from Phase 1 could, in principle, define a reference class of "comparable societies" without knowledge of industrialization outcomes.  
  - **Procedure**:  
    - Define a hypothetical set of societies (e.g., Tokugawa Japan, Mughal India, Netherlands) using Phase 1 criteria.  
    - Assess whether China’s inclusion relies on knowing its non-industrialization.  
  - **Output**: Binary determination: if criteria are outcome-independent (e.g., China fits pre-1800 criteria without outcome knowledge), the pairing is valid; if not, it is circular.  

  **Phase 3: Evaluating Tolerance for Outcome Dependency**  
  - **Task**: If Phase 2 reveals outcome dependency, evaluate whether macrohistorical explanation can still function by specifying causal mechanisms *ex ante*.  
  - **Procedure**:  
    - Analyze whether theories privileging mechanisms (e.g., Allen’s high-wage model) can "rescue" the contrast by decoupling comparator selection from outcomes.  
    - Test if outcome-dependent pairing introduces bias (e.g., cherry-picking comparators that affirm preconceived causes).  
  - **Output**: A framework for when (if ever) outcome-dependent contrasts are permissible in historical explanation.  

  #### 4. Success and Failure Conditions  
  - **Success**: A determinate criterion for well-posed contrastive questions in comparative history, derived from Phase 2–3. For example: "A comparator is valid iff its selection criteria are reference-class independent and mechanistically justifiable ex ante." Britain-China serves as the test case: if the criterion flags the pairing as flawed, it must generalize to other dyads (e.g., "Why Rome and not Han China?").  
  - **Failure**: Two untenable outcomes:  
    - **Collapse into skepticism**: If all macrohistorical contrasts are inherently outcome-dependent, the project concludes they are epistemically invalid.  
    - **Permissive collapse**: If no principled constraint exists (e.g., "any comparator is valid if intuitively plausible"), the criterion fails to resolve circularity. Success requires avoiding both extremes.  

  #### 5. Scope and Feasibility Assessment  
  - **Strengths**: The project leverages analytical skills from software engineering (e.g., formal logic, causal graphs) to dissect textual arguments. No archival work is needed; existing secondary sources suffice. The 5,000-word scope fits a semester if phases are scoped as: Phase 1 (1,500 words), Phase 2 (2,000 words), Phase 3 (1,000 words), with 500 words for framing/conclusions.  
  - **Risks**:  
    - Philosophical complexity may require careful scaffolding (mitigated by focusing on one case study).  
    - Overgeneralization beyond Britain-China (mitigated by explicitly limiting conclusions to this dyad).  
  - **Deliverable**: A paper concluding either that (a) the Britain-China contrast is ill-posed and requires reframing, or (b) it survives logical scrutiny, with implications for how comparative history is practiced.  

  This proposal bridges philosophy and history to interrogate a foundational assumption in divergence studies. By treating the comparator’s selection as a problem of logical structure—not just historical fact—it offers a novel lens to evaluate explanatory rigor in macrohistory.  

  ---  
  *Note: This proposal assumes familiarity with Great Divergence historiography and contrastive explanation theory. All referenced authors/texts will be substantiated in the final paper via supplied citations.*
