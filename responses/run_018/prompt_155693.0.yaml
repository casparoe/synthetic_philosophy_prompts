  hey, i'm working on a prompt dataset about arendt and eichmann and need an argument for a slightly weird reading. could you argue that the banality of evil is best understood not as a psychological claim about eichmann being unimaginative or dull, but as an institutional-language claim about how bureaucratic roles suffer from a kind of specification gaming? the idea is that job descriptions optimise for measurable outputs — processing quotas, schedule adherence — and in the process specify away the moral weight of what is being processed, so the agent's hands stay clean not because he lacks malice, but because the instituion has rewritten good work as efficient compliance. push the point that this is actually the more disturbing version of arendt's view, since it means ordinary people can do terrible things while genuinely believing they are performing well, and that it explains why moral responsibility gets diffused in administrative violence. please write in british english, don't include any citations or reading lists, and keep it casual. avoid just repeating the standard he was a bureaucrat following orders line; i want the argument to feel like it's injecting a new framing into the old debate.
