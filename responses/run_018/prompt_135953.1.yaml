answer: |-
  Good morning. We stand today at an intersection – where the paths of rigorous scholarship meet the roads of enduring belief and cultural memory. Our shared destination? Understanding that elusive frontier captured in our title: "Where Legend Ends and History Begins." But I propose we navigate not by vague degrees of fading, but by a distinct, conceptual threshold. I call this an **"evidentiary phase shift."**

  This shift isn't about a story becoming less true or more mythic over time. It’s a fundamental change in the *kind of question* we can productively ask, demanding a different *kind of evidence* to answer it. On one side of this threshold, the governing principle is **narrative coherence**: Does this story fit within a web of other received accounts, traditions, or literary patterns? On the other side, the principle shifts to **material trace**: What physical evidence *should* this event leave behind, and what does the *actual presence, absence, or ambiguity* of that trace permit us to claim? Crossing this threshold imposes obligations that narrative consistency alone cannot satisfy. Let’s see this shift in action with our three touchstones.

  1.  **The Trojan War (Homeric Tradition):**
      *   **Narrative Coherence Side:** For centuries, the question was: Does the *Iliad* cohere with other Greek myths, genealogies, and understandings of the heroic past? Does its internal logic hold? The answer, shaping epic poetry and cultural identity, was often "yes."
      *   **The Phase Shift:** The threshold was crossed when the question became: "If a powerful citadel like Troy was besieged and destroyed in the period Homer describes, what material traces *must* exist – layers of ash, specific weapon types, fortification styles, evidence of cultural contact – and what do we actually find at Hissarlik (the site of ancient Troy)?" Schliemann’s excavations, and decades of subsequent archaeology, didn't ask if the *Iliad* was coherent; they asked what its described events *should* leave behind.
      *   **Constrained Claims:** We cannot say the *Iliad's* specific events (Achilles, Hector, the wooden horse) "happened." We *can* say a major Late Bronze Age city at that location suffered multiple destructions, one plausibly within a timeframe consistent with a conflict remembered (and dramatically transformed) in later epic tradition. The shift forces us to move from the epic's specific plot to the broader, materially-attested context of Anatolian-Greek conflict.

  2.  **King Arthur:**
      *   **Narrative Coherence Side:** Early chroniclers like Gildas or Nennius, and later Geoffrey of Monmouth, asked: Does the figure of Arthur cohere with emerging national origin stories? Does he fit the pattern of a Romano-British leader resisting Saxon invasion? His role as a unifying symbol depended on this coherence within the textual tradition.
      *   **The Phase Shift:** The critical threshold is crossed when we ask: "If a single, dominant military leader achieved the victories attributed to Arthur in the 5th/6th centuries AD, what material signature would that leave? Where are the distinct artifacts, fortified headquarters, or widespread evidence of centralized control contrasting sharply with the typical fragmented, post-Roman 'warlord' pattern?" The archaeology of sub-Roman Britain becomes the judge.
      *   **Constrained Claims:** We cannot confirm Arthur Pendragon as a historical individual described in later romances. The material record shows a landscape of localized power, not unified kingship. We *can* discuss the historical reality of Saxon expansion and British resistance, and how the *idea* of a unifying champion like Arthur emerged coherently from that chaotic period to meet profound cultural needs. The shift compels us to separate the plausible historical context from the singular, uncorroborated hero.

  3.  **The Exodus:**
      *   **Narrative Coherence Side:** Within the biblical narrative and its reception, the central question has long been coherence: Does the Exodus story cohere theologically with the identity of a people liberated by God? Does it form the foundational narrative for laws, rituals, and a covenant relationship? Its profound religious and cultural weight resides powerfully in this coherence.
      *   **The Phase Shift:** The threshold is crossed when we ask: "If a large population group resided in Egypt for generations, then migrated en masse through the Sinai peninsula to Canaan in a specific timeframe (Late Bronze Age), what material evidence *must* we find? Where is the evidence of a distinct, large-scale foreign population in the Egyptian archaeological record for that period? Where are the Sinai encampments, the evidence of a sudden influx of people and distinct material culture into Canaan?" The focus shifts to Egyptian records, Sinai archaeology, and Canaanite settlement patterns.
      *   **Constrained Claims:** Archaeology cannot affirm or negate the theological meaning of liberation inherent in the narrative. What it *does* constrain is the literal, large-scale scenario described. The material evidence – the absence of expected traces in Egypt and Sinai, the complex origins of early Israel in Canaan – doesn't align with a single, massive migration event as depicted. The shift forces us to grapple with how core foundational stories, carrying immense cultural and religious weight, relate to complex, often elusive, historical processes that archaeology reveals. It asks how narrative coherence and material trace interact for events deeply embedded in identity.

  **What This Workshop Can Do:**

  We will not resolve whether Troy "really happened" as Homer sang, whether Arthur wielded Excalibur, or whether the Exodus occurred exactly as scripture recounts. The "phase shift" framework shows *why* these questions resist simple "yes/no" answers based solely on one side of the threshold.

  Instead, we can:
  *   **Identify the Threshold:** For each case, clarify the precise point where the question shifts from coherence to material trace.
  *   **Analyze the Constraints:** Understand how the demands of material evidence fundamentally reshape the kinds of historical claims that are possible or sustainable.
  *   **Explore the Asymmetry:** Examine why narratives can persist powerfully even where material evidence is absent or ambiguous, and why material evidence often fragments coherent narratives.
  *   **Engage Respectfully:** Recognize that for some in this room, one or more of these narratives are not distant puzzles, but living traditions. Understanding the phase shift isn't about dismissal; it's about understanding the different rules governing different domains of knowledge and memory.

  **What This Workshop Cannot Do:**

  It cannot move any of these cases definitively across the threshold we've defined. The Trojan War sits *at* the threshold – a plausible conflict within a materially-attested context, but its specific events remain beyond material reach. King Arthur resides firmly on the *narrative coherence* side, his historical reality unsupported by the archaeology of his period. The Exodus narrative, holding profound living significance, faces significant challenges *from* the material record regarding its literal, large-scale historicity, placing it largely on the narrative coherence side of the threshold for historical scholarship, while its theological and cultural coherence remains central for faith and identity.

  Our task today is not to dissolve legend or to diminish history, but to illuminate the nature of the threshold between them. Let us explore this frontier with intellectual precision, mutual respect, and a shared commitment to understanding the complex terrain where stories are born, transmitted, and tested. Thank you. Let the inquiry begin.
