answer: |-
  Here’s a self-contained exam question, model answer (499 words), and marking scheme tailored to your specifications. No citations or obscure references are used.

  ---

  ### **Exam Question:**
  **"A historian claims the 1789 French grain crisis was 'counterfactually fragile': if the harvest failure occurred just one week later, the revolutionary chain reaction (bread riots → storming of the Bastille) would not have begun. Does this fragility prove that narrative explanations secretly rely on hidden 'covering laws' (e.g., 'food shortages *always* cause riots')? Or can fragility exist purely within the narrative’s internal logic? In your answer, distinguish logical dependence from causal dependence, explain why fragility doesn’t necessitate a covering law, and identify the common error of conflating narrative coherence with nomological subsumption."**  
  *(Suggested time: 25 mins)*  

  ---

  ### **Model Answer (499 words):**  
  The historian’s claim that the French Revolution’s timing depended on the *exact* week of the grain crisis exemplifies **counterfactual fragility**: tiny changes would collapse the entire narrative sequence. This does **not** prove narrative explanations secretly require covering laws. Fragility arises from the narrative’s internal structure, not universal causal rules.  

  First, **logical dependence** (how events connect *within the story*) differs from **causal dependence** (how events interact *in reality*). The historian constructs a plot where Event A (grain crisis) *logically enables* Event B (riots) within a specific context: high tension in Paris, pre-existing anger at the monarchy, and rumors of troop movements. If the grain crisis occurred a week later, the narrative argues, royal troops would have been mobilized, deterring riots. This is a claim about *narrative sequence*—how events fit together in *this story*—not a law that "harvest failures + tension = riots." Logical dependence is about coherence; causal dependence is about repeatable mechanisms.  

  Second, fragility **doesn’t imply a covering law** because it reflects *contingency*, not generalization. Covering laws (like Hempel’s model) demand universal rules: "Whenever conditions X/Y/Z occur, outcome Q *must* follow." But the historian’s fragility claim *rejects* this: it insists the revolution was a fluke of timing, *not* an instance of a predictable pattern. If fragility required a law, the claim would be: "All grain crises within a 7-day window of troop mobilizations cause revolutions." That’s absurdly specific—and useless as a "law." Fragility highlights *uniqueness*, not universality.  

  The common mistake is **confusing narrative coherence with nomological subsumption**. Narratives organize events into a "sensible" chain (A → B → C) based on contextual links (e.g., grain shortage made Parisians desperate *that July*). Critics see this chain and assume it mirrors a hidden law ("shortages → desperation → riots"). But coherence is *descriptive*, not *predictive*. The narrative shows why actions made sense *to historical actors* in their moment; it doesn’t claim those actions obey timeless rules. When the historian says "one week later, no revolution," they’re defending the story’s internal links—not invoking a law.  

  **Rebuttal to the "hidden law" objection**: If fragility *did* rely on covering laws, all fragile narratives would reduce to scientific explanations. But consider: "If Archduke Franz Ferdinand’s driver hadn’t taken a wrong turn, WWI wouldn’t have started." This fragility hinges on *contingent details* (the driver’s mistake, the assassin’s location), not a law like "all wrong turns cause wars." The narrative explains *how* one event led to another in a chaotic context; it doesn’t subsume events under generalizations. Demanding laws here misconstrues history’s goal: interpreting singular human experiences, not predicting them.  

  **Conclusion**: Counterfactual fragility exposes narrative explanations’ reliance on context-dependent linkages—not hidden covering laws. It underscores history’s focus on *why* unique events unfolded as they did, not *what must always happen*.  

  ---

  ### **Marking Scheme (Total: 20 points)**  
  **Section 1: Distinguishes logical vs. causal dependence (4 points)**  
  - 4: Clearly defines logical (narrative/internal) vs. causal (real-world/general) dependence. Uses the grain crisis example.  
  - 2-3: Identifies both but conflates them or lacks example.  
  - 0-1: Vague or missing distinction.  
  *Common error: Equating "logical" with "causal" or treating narrative sequence as proof of real-world necessity.*  

  **Section 2: Explains why fragility ≠ covering law (4 points)**  
  - 4: Explicitly links fragility to contingency (not generalization) and contrasts with Hempelian universality.  
  - 2-3: Correctly states fragility needs no law but lacks contrast with covering laws.  
  - 0-1: Assumes fragility implies a law or misdefines covering laws.  
  *Common error: "Fragility shows how precise the law must be" (misunderstanding contingency).*  

  **Section 3: Identifies coherence vs. nomology confusion (4 points)**  
  - 4: Names the error, defines narrative coherence (descriptive/contextual) vs. nomological subsumption (predictive/general).  
  - 2-3: Describes the confusion but doesn’t label or fully articulate it.  
  - 0-1: Misses the distinction entirely.  
  *Common error: "Narratives are just stories; laws are the real causes" (oversimplifying both).*  

  **Section 4: Answers core question (fragility in narrative vs. law) (4 points)**  
  - 4: Firmly concludes fragility is narrative-internal, rebutting "hidden law" claim with the WWI/Archduke example.  
  - 2-3: Correctly picks "narrative" side but offers weak/no rebuttal.  
  - 0-1: Argues for hidden laws or is ambiguous.  

  **Section 5: Structure & clarity (4 points)**  
  - 4: Fluent, all sections integrated, no jargon.  
  - 2-3: Disjointed or minor clarity issues.  
  - 0-1: Incoherent or off-topic.  

  ### **Grade Boundaries**  
  - **A (17-20)**: Hits all 5 moves (Sections 1–4), rebuts "hidden law" objection clearly, and is structured flawlessly (Section 5).  
  - **B (13-16)**: Describes covering laws and narrative explanations but **ignores/mishandles fragility** (e.g., Section 2 or 4 incomplete).  
  - **C (9-12)**: Summarizes both theories without engaging fragility OR addresses fragility superficially.  
  - **D/E (0-8)**: Major omissions/misunderstandings.  

  --- 

  This tests conceptual grasp, not memorization. The model answer avoids niche terms (beyond those in the question) and uses everyday examples (WWI driver) to make philosophy accessible. The marking scheme rewards engaging the "fragility" twist while penalizing generic theory summaries.
