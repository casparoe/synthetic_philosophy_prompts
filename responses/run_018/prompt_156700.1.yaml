prompt: |-
  I am advising a municipal water authority that operates under an absolute institutional prohibition: it may never deliberately introduce any chemical agent into the public reservoir, irrespective of dilution, intent, or net effect. The authority has learned that an upstream industrial facility is accidentally releasing trace amounts of a persistent toxin into the same supply. They have access to a counter-agent that would neutralize the contamination, but deploying it requires the deliberate introduction of a different compound into the water—thereby violating the prohibition—though the result would be measurably cleaner water and lower health risk. Several board members contend that maintaining the prohibition in this case makes the authority complicit in avoidable harm, and that the moral distinction between actively causing damage and passively allowing it collapses when the institution has both knowledge and capacity to intervene. Others reply that the rule exists precisely to prevent institutional overreach, and that breaking it for a favorable outcome erodes its normative force regardless of circumstances. I find both lines of argument partially compelling yet structurally incomplete. Please lead with your bottom line in the first sentence, then provide the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is advising a municipal water authority facing a tough ethical dilemma. They have an absolute prohibition against adding any chemicals to the public reservoir, but there's an upstream industrial accident releasing toxins. They have a counter-agent that would neutralize the toxin, but using it would violate their prohibition. 

  The user's deeper need seems to be navigating two conflicting ethical arguments: one side says not acting makes them complicit in harm, while the other insists rules exist to prevent institutional overreach. The user finds both arguments incomplete and wants a decisive ethical analysis.

  Hmm, this is fundamentally about institutional integrity versus utilitarian outcomes. The prohibition clearly exists as a bright-line rule to prevent slippery slopes - even well-intentioned exceptions could normalize rule-breaking. But the complicity argument isn't trivial either; knowing they could prevent harm creates moral responsibility.

  The key insight might be that the prohibition's purpose isn't just about chemicals - it's about maintaining public trust in the institution's restraint. Breaking it, even for good reasons, damages that trust permanently. Meanwhile, the harm from toxins, while real, comes from an external source they didn't enable. 

  The industrial polluter should bear full responsibility here - the water authority's duty is to demand remediation at source, not become an unregulated chemical actor themselves. Their mandate is to deliver safe water within their operational constraints, not become amateur environmental engineers.

  Also practically speaking, once they break the prohibition, what stops them from doing it again whenever consequences seem favorable? That's exactly what the rule was designed to prevent. The downstream health impacts, while unfortunate, don't override the institutional covenant with the public.
answer: |-
  The water authority must uphold the prohibition against deliberate chemical introduction because its core institutional purpose is to maintain inviolable public trust through restraint, not to become an unregulated actor in water chemistry—even when facing external contamination. Here's why:

  1.  **The Prohibition is Foundational, Not Contextual:** The rule exists to eliminate judgment calls precisely in high-stakes scenarios. Its absolute nature is the safeguard against institutional arrogance—the belief that "this time" justifies overriding a core covenant. Violating it transforms the authority from a passive guardian into an active chemical mediator, fundamentally altering its role and public perception.

  2.  **Complicity Requires Agency in the Harm:** The authority is not *causing* the contamination; the upstream facility is. Failing to neutralize a toxin it didn't introduce is ethically distinct from actively polluting. Their duty is to *prevent their own harm*, not to assume responsibility for all harms affecting the water supply through unauthorized means. Their primary obligation is to use permissible tools (e.g., legal action against the polluter, public alerts, filtration downstream) to mitigate the threat.

  3.  **Slippery Slope is Inevitable, Not Speculative:** Approving this "beneficial" exception destroys the normative force of the prohibition. Future boards will face pressure to introduce chemicals for less clear-cut benefits (e.g., taste improvement, cost-saving pre-treatment), citing this precedent. The bright-line rule collapses, opening the door to genuine overreach.

  4.  **Accountability Lies Upstream:** The moral and legal burden rests entirely on the polluting facility and regulators tasked with stopping them. The water authority's complicity lies not in inaction against the toxin, but in failing to exhaust *all permissible avenues* to hold the polluter accountable and protect consumers within its mandate (e.g., aggressive litigation, demanding upstream remediation, enhancing non-chemical treatment).

  5.  **Institutional Integrity Trumps Calculated Utility:** While net benefit (cleaner water) is desirable, the authority's legitimacy hinges on adhering to its defined constraints. Sacrificing its foundational principle for a perceived greater good, however compelling in isolation, erodes the trust and predictability essential for its long-term function. It becomes an institution that breaks its own most sacred rules when convenient.

  The path forward requires relentless focus on stopping the pollution at its source and mitigating risk through sanctioned methods, preserving the authority's integrity as the indispensable safeguard it was designed to be.
