        - A way to collect reports (paper or digital).
        - A calculator to compute the average and display it.

    Payoff: 
        - We use the quadratic scoring rule for each round independently. At the end, sum the points from the three rounds.
        - Prizes for top scores? But the point is to learn, so maybe participation prize.

    Core design principle: Use a symmetric information structure and a sufficient statistic to force agreement under common knowledge, then break symmetry by introducing irrationality to show fragility.

    Let's write the rules step-by-step.

    Rules for players:

      - The game has 3 rounds. In each round, a state (A or B) is randomly chosen with equal probability.
      - In each round, you will receive a private signal (a or b) that depends on the state (see below).
      - You will then be asked to report your probability that the state is A (a number between 0 and 1). This is your "report".
      - After reports are collected in the first part of a round, the instructor will announce the average of all reports.
      - Then, in the second part of the round, you will be asked to report again (using any information you have: your signal and the average).
      - In round 3, one randomly selected player will be given a secret instruction (which may break the normal rules).

      Signal generation:
          - Normally, if the state is A, you will see 'a' with 60% chance and 'b' with 40% chance.
          - If the state is B, you will see 'b' with 60% chance and 'a' with 40% chance.

      Scoring:
          - After the entire game, the true states for each round will be revealed.
          - For each report you make, you will score points based on the quadratic scoring rule:
              If the state is A: score = 100 - 100*(1 - report)^2
              If the state is B: score = 100 - 100*(report)^2
          - Your total score is the sum of your scores for each of your reports (there are 3 rounds, and in each round you make two reports -> 6 reports total).

      Steps for a round:

          Round 1:
            Step 1: The instructor draws the state (A or B) and generates signals for each player.
            Step 2: Each player receives their signal.
            Step 3: Each player reports their probability that the state is A (based on their signal).
            Step 4: The instructor computes the average of the reports and announces it to everyone.
            Step 5: Each player reports again (using their signal and the average).
            Step 6: The instructor records the reports.

          Round 2: same as round 1 (with a new state and new signals).

          Round 3: 
            Step 1: The instructor draws the state and generates signals.
            Step 2: Each player receives their signal.
            Step 3: The instructor secretly hands a note to one randomly chosen player that says: "In the first report of round 3, report 0.9 regardless of your signal. Do not tell anyone."
            Step 4: Each player (including the chosen one) reports their probability.
            Step 5: The instructor announces the average.
            Step 6: Each player reports again.

      After the three rounds, the true states are revealed, and scores are calculated.

    Debrief:

      - Round 1: 
            Condition: common prior (everyone knows the signal model and prior) and common knowledge of rationality (everyone is expected to report truthfully using Bayes).
            Result: after the first report, the average (which is a sufficient statistic) is common knowledge. In the second report, everyone should report the same posterior -> agreement.

      - Round 2: same as round 1 -> agreement again.

      - Round 3: 
            We broke common knowledge of rationality: one player did not report truthfully. Therefore, the aggregate (the average) no longer has the same meaning. The players who are rational cannot update properly because they assume everyone is rational. Hence, agreement breaks.

      What the game doesn't capture: 
            The infinite hierarchy of beliefs. In Aumann's theorem, the common knowledge of posteriors means that if your posterior is q, and you know that the other's posterior is r, and you know that they know that yours is q, etc., to infinity, then agreement is forced. In our game, we only did two levels (first report, then update) and we used a sufficient statistic to make the agreement happen in one update.

      Predictable break the first time: 
            In round 3, when the players see an average that doesn't match any possible combination of 0.4 and 0.6 reports, they might not know how to update. Some might assume a mistake and ignore the outlier? Some might try to use a model with a possibility of irrationality? But since we haven't provided a model, they might just use the same update as before, which would be incorrect.

    One-sentence summary of the core design principle: 
          "Force agreement via a sufficient statistic under common knowledge, then break by injecting bounded rationality."

    However, note we broke common knowledge of rationality, not bounded rationality. We made one player irrational.

    Alternatively: 
          "Illustrate agreement via common knowledge of a sufficient statistic, then disrupt by violating common knowledge of rationality."

    Let me adjust.

    Final core design principle: 
          "Achieve agreement through common knowledge of a sufficient statistic, then break by secretly violating common knowledge of rationality."

    We'll go with that.
