  ### Aumann's Agreement Theorem Simulation: "SignalSync Challenge"

  #### **Materials**
  - 10 player packets (each contains: private signal slips, betting sheet, pencil)
  - Shared display (whiteboard/projector) showing aggregate distributions
  - 3 hidden state cards (A/B for each round, 50% prior)
  - Noise generator app (or instructor) for signals
  - Scoring tokens (plastic coins) for prizes (e.g., "Rationality Champion" badge)

  ---

  ### **Game Rules & Rounds**  
  *(Read aloud to students; no prior lecture)*

  #### **Core Mechanics**
  - **Hidden state** \(S \in \{A, B\}\) each round (50% prior, drawn secretly).  
  - **Private signal**: Each player gets \(x_i = \text{noisy signal about } S\):  
    - If \(S = A\): \(x_i = \text{"A"}\) with 60% prob, \(\text{"B"}\) with 40% prob.  
    - If \(S = B\): \(x_i = \text{"B"}\) with 60% prob, \(\text{"A"}\) with 40% prob.  
  - **Calibration Phase**: Players spend points to access **shared standard** (true \(S\)) *before* betting:  
    - Cost: 10 points (except Round 3 for one player).  
    - If purchased: See \(S\) privately.  
  - **Betting**: Players submit \(q_i =\) reported probability that \(S = A\) (0 to 1).  
  - **Aggregate Display**: *Only* the **mean** of all \(q_i\) is shown after each phase.  
  - **Payoff** (per bet, quadratic scoring):  
    - If \(S = A\): \(\text{Points} = 100 - 100(1 - q_i)^2\)  
    - If \(S = B\): \(\text{Points} = 100 - 100(q_i)^2\)  
    (Truthful reporting maximizes expected points.)  

  #### **Round Flow**  
  1. **Signal Phase**:  
     - \(S\) drawn, private signals distributed.  
  2. **Calibration Phase**:  
     - Players secretly decide to spend 10 points to see \(S\) (or not).  
  3. **Betting Phase 1**:  
     - Submit \(q_i\) based on signal + calibration (if purchased).  
     - **Display**: Mean of all \(q_i\).  
  4. **Betting Phase 2**:  
     - Submit *new* \(q_i\) using signal + mean + calibration.  
     - **Display**: New mean of \(q_i\).  

  ---

  ### **Rounds 1-2: Convergence Setup**  
  - **Goal**: Experience shared prior + common knowledge of rationality → agreement.  
  - **Mechanics**:  
    - Players use signals to compute initial \(q_i\):  
      - E.g., Signal "A" → \(q_i = 0.6\) (since \(P(S=A|\text{"A"}) = 0.6\)).  
    - After seeing mean in Betting Phase 1, players infer **number of "A" signals** (since \(q_i\) is 0.4 or 0.6).  
      - E.g., Mean = 0.52? → 6 "A" signals, 4 "B" signals.  
    - In Betting Phase 2, all compute identical posterior:  
      - \(P(S=A | \text{3 "A" signals}) = \frac{(0.6)^3 (0.4)^2 (0.5)}{(0.6)^3 (0.4)^2 (0.5) + (0.4)^3 (0.6)^2 (0.5)} = 0.69\)  
      - **Result**: All \(q_i\) converge → identical mean in Betting Phase 2.  

  #### **Payoff Incentive**  
  - Truthful betting maximizes points. Calibration is costly (10 points) but reveals \(S\) → perfect bet.  
  - **Pressure**: Rational players skip calibration (trust consensus); shared knowledge forces agreement.  

  ---

  ### **Round 3: The Crack**  
  - **Secret Tweak**: One random player gets **free calibration** (0 cost, told privately).  
  - **Effect**:  
    - Calibrated player sees true \(S\) → reports \(q_i = 0.99\) (if \(S=A\)) or **0.01** (if \(S=B\)).  
    - Others (paying 10 points) assume *all* reports are 0.4/0.6 → misread signal count.  
    - **Example**: True \(S = A\), signals = 7 "A", 3 "B".  
      - Betting Phase 1: 7 players report 0.6, 2 report 0.4, calibrated player reports 0.99 → **mean = 0.56**.  
      - Non-calibrated players infer 8 "A" signals (incorrectly) → compute \(q_i = 0.85\).  
      - Calibrated player knows \(S=A\) → reports 0.99.  
      - **Display**: Mean ≠ consensus (e.g., 0.87 vs. Round 2’s 0.69). **Disagreement persists**.  

  ---

  ### **Debrief Guide**  
  *(After revealing Round 3 tweak)*  
  1. **Round 1-2**:  
     - **Common prior**: Shared 50% \(P(S=A)\), signal model.  
     - **Common knowledge of rationality**: All know others Bayes-update truthfully.  
     - **Disagreement point**: Initial signal differences → initial bet spread.  
     - **Squeeze**: Aggregate (mean) is a **sufficient statistic** → forces identical posteriors.  
  2. **Round 3**:  
     - **Crack**: Broken common prior (one player’s cost-free access to truth).  
     - Players assume reports reflect signals (0.4/0.6) → misaggregate.  
     - **Result**: Agreement collapses; irrational-seeming bets.  
  3. **Limitations**:  
     - **Finite hierarchy**: Real-world "infinite knowing" is approximated by 2 rounds of aggregation.  
     - **Predictable 1st-run break**: Students anchor on Round 1-2 logic; miss that mean could hide outliers → frustrated Round 3 miscalibrations.  

  ---

  ### **Core Design Principle**  
  "Force consensus via a sufficient statistic under common knowledge, then fracture it by stealth-breaking symmetry in calibration costs to expose the theorem’s common-prior fragility."
