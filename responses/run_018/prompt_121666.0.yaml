prompt: |-
  ok so I've been nerding out on Thomson's lamp and supertask stuff, and I keep running into this pattern I can't name. here's the thing: with the standard lamp—flip it on, then off, then on, every half-interval—philosophers almost always conclude there's no determinate state at the two-minute mark, since there's no last flip. fair enough. but then I imagine a tweaked version where each switch doesn't just toggle the light, but also adds a unit of "heat" or "charge" to some internal reservior, so the final condition depends on the sum of an infinite series rather than just parity. and suddenly everyone—including me—wants to say "well the reservior has some definite accumulated value, even if we can't point to a last addition." same structure: infinite actions in finiite time, no terminal step. but the intution is totally different. is there an established concept for this asymmetry? I'm not talking about convergence or divergence of series, but specifically about why cumulative supertasks feel like they have a "result" while periodic ones don't. does this map onto anything in the literature—maybe something about limit points vs accumulation points, or is it just an unrecognized bias? and if it's not named, can you define the phenomenon precisely and say where its edges are—what makes a supertask "cumulative" enough to trigger the determinacy intution, and how that differs from ordinary limit worries? I want the carving, not just a bare label.
reasoning: |-
  We are dealing with supertasks: the performance of an infinite number of actions in a finite time. The classic Thomson's lamp (with toggling) leads to indeterminacy because the state at the end depends on the parity of the number of flips (which is undefined for an infinite sequence without a last term). However, when we modify the task to accumulate a quantity (like heat or charge) at each step, we feel that the accumulated value might be well-defined if the infinite series converges.

  The key difference is that in the cumulative case, we are considering a function of the entire sequence (the series sum) that can be defined as the limit of the partial sums. In the toggle case, the state (on/off) is defined by the parity of the number of flips, which is a discrete property that does not converge in the same way.

  The phenomenon you are noticing is the difference between:

  1. **Convergent supertasks**: Those that can be assigned a definite outcome by taking a limit of some numerical quantity (like the accumulated heat). The outcome is defined by the limit of the partial sums of a convergent series.

  2. **Divergent or oscillating supertasks**: Those that do not converge to a definite outcome (like the lamp's on/off state) because the relevant sequence (e.g., the state sequence) does not converge.

  However, note that in the lamp toggle case, if we try to assign a numerical value (say, 1 for on and 0 for off) then the sequence of states is (1,0,1,0,...) which does not converge. So the intuition that the cumulative case has a result and the toggle case does not is tied to the convergence of the series (or sequence) that we use to define the outcome.

  But let us be precise: the issue is not just convergence, but the fact that in the cumulative case, we are defining the outcome by a limit of a sequence of partial sums (which, if convergent, is well-defined). In the toggle case, we are trying to define the outcome by the limit of the state sequence, which does not exist.

  However, we must note that even in the cumulative case, the supertask is still a supertask: we are performing an infinite number of actions. The determinacy of the outcome in the cumulative case comes from the fact that the mathematical object we use to define the outcome (the infinite series) is well-defined and convergent. But is this a physical fact? Or is it a mathematical convenience?

  Moreover, the asymmetry you note might be due to the fact that we are more willing to accept a continuous outcome (like a real number for the accumulated heat) defined by a limit, than a discrete outcome (like on/off) that oscillates without settling.

  In the literature, this might be related to:

  - **The Limit Assumption**: In the philosophy of supertasks, one common approach is to define the state at the limit time (t=2 minutes) as the limit of the states at times approaching 2 minutes. This works for the cumulative case (if we model the accumulation as a continuous variable and the series converges) but fails for the toggle case because the state oscillates and has no limit.

  However, note that in the toggle case, if we model the lamp state as a continuous variable (say, the voltage in the circuit) that changes continuously, then we might get a different result. But the original problem is discrete.

  So the key is the continuity of the state variable and the convergence of the sequence of states.

  Now, to your questions:

  1. **Is there an established concept?** I don't think there's a specific name for this asymmetry, but it is a well-known distinction. It is often discussed in the context of the conditions under which a supertask has a well-defined outcome. The concept of a "limit rule" or "limit assumption" is central: that the state at the limit time is the limit of the states at the times in the sequence. This works only if the sequence of states converges.

  2. **Defining the phenomenon precisely**: We can say that a supertask is **limit-determinate** if the sequence of states (or the relevant outcome variable) converges to a limit. The tweaked lamp with accumulation is limit-determinate if the series of additions converges (so the accumulated value converges to the sum of the series). The original lamp is not limit-determinate because the state sequence does not converge.

     However, note that the state sequence in the cumulative case is not the accumulation itself but the entire state of the system. We might have multiple state variables. So we need to specify which state variable we are considering.

     More precisely, let S(t) be the state of the system at time t (for t < 2 minutes). Then we define the state at t=2 as the limit (if it exists) of S(t) as t approaches 2. In the toggle lamp, S(t) alternates and has no limit. In the cumulative lamp, if we define the state to include the accumulated heat, then the heat component converges (if the series converges) but the on/off state (if we still have that) may not.

     So we have to be careful about what we consider the state.

     We might say that a supertask is **outcome-determinate** with respect to a particular outcome variable if that variable converges to a limit as the supertask is performed.

     In the cumulative lamp, we are focusing on the accumulated heat (and perhaps ignoring the on/off state). That variable is outcome-determinate. But if we care about the on/off state, then it is not.

  3. **What makes a supertask "cumulative" enough?** It is when the outcome we care about is a function of the entire history that can be represented as a convergent series (or more generally, a convergent sequence). The accumulation must be defined in such a way that it is continuous at the limit point. In other words, the value at the limit time is the limit of the values at times approaching the limit.

     However, note that even if the series converges, there might be other aspects of the state that do not. For example, in the cumulative lamp, the on/off state might still be oscillating. So the determinacy is with respect to a specific variable.

     The intuition that the cumulative supertask has a result is because we are focusing on the variable that converges and ignoring the one that doesn't.

  4. **Edges of the phenomenon**:
     - **Convergence is key**: If the series diverges, then even the cumulative version becomes indeterminate. For example, if we add 1 unit of heat at each step, then the heat goes to infinity and we cannot assign a finite value. So we would say the outcome is infinite, but that might be considered determinate? Or not? This depends on the context. In mathematics, we say the series diverges to infinity, which is a definite statement. But if we require a finite value, then it's indeterminate.
     - **Continuity of the outcome variable**: The outcome variable must be defined in a way that it can change continuously (or at least have a limit). Discrete outcomes (like on/off) that require a last step to be defined are problematic.

     So the phenomenon of determinacy occurs when:
       - The outcome variable is continuous (or at least can take values in a metric space where convergence is defined).
       - The sequence of values of that variable at the steps of the supertask converges to a limit.

     Then we can assign the outcome at the limit time as that limit.

  5. **Is it just an unrecognized bias?** Not really. It is a recognition that some infinite processes can be assigned a limit and others cannot. The bias might be that we are more comfortable with continuous outcomes because we can take limits, but discrete outcomes that oscillate don't have that luxury.

  In summary:

  - We can define a supertask as **limit-determinate with respect to a specific outcome variable** if the sequence of values of that variable during the supertask converges to a limit. The cumulative lamp is limit-determinate in the heat variable (if the series converges) but not in the on/off state. The original lamp is not limit-determinate in the on/off state.

  - The literature often discusses the limit assumption and the conditions for convergence. The asymmetry is well-known and is essentially about the convergence of the relevant sequence.

  If you want a name for the phenomenon, you might call it the **convergence-determined outcome** of a supertask. Or the **limit-determinacy** of convergent supertasks.

  But note: even in the convergent case, there might be physical objections to the supertask (like how the accumulation happens in arbitrarily small time intervals). However, mathematically, the outcome is well-defined.

