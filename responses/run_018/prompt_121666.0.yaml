answer: |-
  Your observation touches on a fundamental asymmetry in supertask reasoning—one that's deeply tied to how we conceptualize limits, state variables, and the ontology of "outcomes." While there isn't a single universally accepted name for this phenomenon in the literature, it maps onto several established concepts in philosophy, mathematics, and physics. I'll define the core idea precisely, carve its boundaries, and explain why cumulative supertasks feel determinate while periodic ones do not. The key lies in **convergence, continuity, and the type of state variable involved**.

  ---

  ### **Core Phenomenon: Limit-Determinacy vs. Limit-Indeterminacy**
  The asymmetry you describe arises from whether the supertask's outcome can be **uniquely defined by a limit process** applied to a **continuous or additive state variable**. Let's formalize this:

  1. **Periodic Supertask (Thomson's Lamp)**:
     - **Structure**: Infinitely many discrete toggles (on/off) at times \( t = 1, \frac{1}{2}, \frac{1}{4}, \dots \) minutes.
     - **State variable**: A **binary or oscillating property** (lamp state: 0 or 1).
     - **Limit behavior**: The sequence of states \((s_1, s_2, s_3, \dots) = (1, 0, 1, 0, \dots)\) has no limit. It oscillates endlessly without converging.
     - **Outcome at \(t=2\)**: Indeterminate. No "last state" exists, and the limit is undefined.

  2. **Cumulative Supertask (Heat/Charge Reservoir)**:
     - **Structure**: Infinitely many additive actions (e.g., +1 "heat unit") at the same time intervals.
     - **State variable**: A **continuous, additive property** (total heat: \(H = \sum_{k=1}^{\infty} h_k\)).
     - **Limit behavior**: The partial sums \(H_n = \sum_{k=1}^{n} h_k\) converge to a limit \(L\) if the series \(\sum h_k\) converges (e.g., if \(h_k = \frac{1}{2^k}\), then \(L=1\)).
     - **Outcome at \(t=2\)**: Determinate. The final state is \(H = L\), defined by the limit of partial sums.

  This asymmetry is **limit-determinacy**:
  - A supertask is **limit-determinate** for a state variable if the sequence of its values (at completion times of subtasks) converges to a unique limit.
  - It is **limit-indeterminate** if the sequence diverges or oscillates.

  In Thomson's lamp, the lamp state is limit-indeterminate; in your reservoir, heat is limit-determinate (if the series converges). The intuition shift comes from conflating two distinct aspects:
  - **Physical realizability**: Both supertasks are equally "unphysical" (infinite actions in finite time).
  - **Mathematical definability**: Cumulative outcomes are definable via analytic continuation (limits), while binary oscillators lack such a tool.

  ---

  ### **Why the Intuition Shifts: Three Key Factors**
  The determinacy intuition for cumulative supertasks hinges on properties absent in periodic cases:

  1. **Continuity of the State Space**:
     - **Cumulative**: The state variable (heat, charge) inhabits a **continuous metric space** (e.g., \(\mathbb{R}\)). Limits are well-defined, and convergence is robust (e.g., via Cauchy sequences).
     - **Periodic**: The state variable inhabits a **discrete space** (e.g., \(\{0,1\}\)). No continuous structure exists to "smooth" oscillations into a limit.
     - **Edge case**: If the reservoir’s state is discrete (e.g., "damaged" if heat > 100), cumulative gains may become indeterminate if the limit is near a threshold.

  2. **Additivity and Path-Independence**:
     - **Cumulative**: The outcome depends on the **sum** of actions, not their order (if absolutely convergent). The limit \(L = \sum h_k\) is a "memoryless" aggregate.
     - **Periodic**: The outcome depends on the **parity** (even/odd) of actions, which is path-dependent and undefined for infinite sequences. No invariant exists to define a final state.
     - **Edge case**: Non-absolutely convergent series (e.g., alternating harmonic) can be rearranged to yield different limits—but we assume "natural" ordering in supertasks.

  3. **Topological Closure**:
     - **Cumulative**: The limit \(L\) is an **accumulation point** of the partial sums. The supertask's outcome "closes" the infinite process by treating \(L\) as the completion of the sequence.
     - **Periodic**: No accumulation point exists for the lamp state; the sequence has two **limit points** (0 and 1), neither of which is "selected."
     - **Edge case**: If the cumulative series diverges (e.g., \(h_k = 1\)), the outcome is indeterminate (or "infinite," but this may not be physically meaningful).

  ---

  ### **Literature Connections**
  This asymmetry is implicitly discussed in:
  1. **Benacerraf's Critique (1962)**: Distinguishes between the **mathematical limit** of a process and its **physical realizability**. Cumulative supertasks leverage limits; periodic ones lack a limit to leverage.
  2. **Laraudogoitia's "Supertasks" (Stanford Encyclopedia)**: Notes that convergence allows "assigning a state at the limit," while oscillation does not.
  3. **Physics-inspired Models (e.g., Norton's Dome)**: Highlights indeterminacy when dynamics lack a unique limit. Cumulative supertasks resemble convergent path integrals.

  However, no term explicitly names your "intuition shift." Proposed labels:
  - **Convergence Determinacy Principle**: Outcomes are determinate iff definable via convergent limits.
  - **Additive vs. Toggling Supertask Asymmetry**.

  ---

  ### **Boundaries: When Does a Supertask "Feel" Determinate?**
  A supertask is **cumulative enough to trigger determinacy intuition** iff:
  - **State Variable Continuity**: The outcome depends on a variable continuous in its topology (e.g., \(\mathbb{R}, \mathbb{C}\)).
  - **Convergence Requirement**: The infinite series/sequence for that variable converges.
  - **Limit Compatibility**: The final state is defined as the limit of partial states (the "limit rule").

  **Counterexamples testing the boundaries**:
  - **Divergent Cumulative**: Adding \(+1\) heat at each step.  
    - Series diverges → indeterminate (no finite \(L\)).  
    - **Edge**: Feels "determinately infinite," but not a real number.
    
  - **Hybrid System**: A lamp with cumulative heat *and* toggling.  
    - Heat is determinate if convergent; lamp state is indeterminate.  
    - **Edge**: If heat convergence *depends* on lamp state (e.g., heat added only when on), both may become indeterminate.

  - **Non-Additive Convergence**: A dial rotated by \(\frac{\pi}{2^k}\) radians at step \(k\).  
    - Converges to \(\frac{\pi}{3}\) radians → determinate (continuous state).  
    - **Edge**: If the dial controls a discrete switch at \(\theta = \pi\), indeterminacy resurges.

  ---

  ### **Why Isn't This Just Ordinary Limit Theory?**
  Ordinary convergence explains *how* outcomes are defined but not *why* we ascribe "reality" to cumulative cases. The asymmetry arises from:
  1. **Epistemic Bias**: We trust analytic continuation (e.g., \(\sum 1/2^n = 1\)) as "real" because it aligns with calculus, while oscillation has no such formalism.
  2. **Ontological Commitment**: Additive reservoirs feel like they track a "conserved quantity" (e.g., energy), which we assume must be definite. Discrete states lack this conservation intuition.

  In essence: **Convergent supertasks extend finite intuition via limits; divergent/oscillatory ones do not.** This is not a flaw but a feature of how we model infinity.

  ---

  ### **Conclusion: A Precise Definition**
  **Name**: **Convergence-Dependent Outcome Determinacy** (CDOD).  
  **Definition**: A supertask exhibits CDOD for a state variable \(S\) if:
  - \(S\) is defined over a continuous space,
  - The sequence of \(S\)-values during the supertask converges to a limit \(L\),
  - The final state of \(S\) at supertask completion is \(L\).

  CDOD fails if:
  - \(S\) is discrete (no convergence),
  - The series/sequence diverges,
  - The limit rule is rejected (e.g., if the supertask "resets" states at \(t=2\)).

  Your tweaked lamp has CDOD for heat; Thomson's lamp lacks CDOD for lamp state. The asymmetry is not a bias but a consequence of the mathematics we use to complete infinite processes—carving reality at the joints of convergence. If you extend this, consider dynamical systems with attractors or non-Archimedean time!
