prompt: |-
  I'm trying to name a move I keep seeing in arguments about originals vs fakes or AI outputs. The claim is that the real thing has value because the creator took an emotional risk — put something genuinely personal on the line. But then you point out plenty of human art is totally mechanical or commissioned, with zero exposure involved, yet people still defend it over a copy. Meanwhile a forger risks prison, and AI teams risk careers and capital, but that never counts as "authentic risk." So the idea of risk is used like a movable fence: it applies only to the person we're already calling the author, and people dosen't specify what makes a risk "authorial" except that it produces the right conclusion. I see it with factory painters vs brilliant forgers, or ghostwriters vs named authors who barely edited. Is there an established term for this specific bait-and-switch, where "authentic exposure" is invoked selectively to protect originals? Or if there's no name, can you define exactly what distinguishes it from ordinary appeals to intentionality or artistic authenticity, and give a couple boundary cases?

  Please structure your answer in these sections, roughly this long:
  - "Restating the pattern" (~2 sentences): say back the phenomenon in your own words.
  - "Close neighbors" (~3 sentences): concepts that are near this but miss, like appeals to intentionality or the aura of an original.
  - "The carving" (~4 sentences): exactly what this is and isn't, with at least one boundary case where the risk is real but shouldn't count, and one where risk is minimal but should.
  - "The name or coinage" (~3 sentences): does it have a real term? If yes, say whether it actually fits. If no, propose a term and its scope.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in arguments about authenticity in art and creative works. They point out how the concept of "emotional risk" is selectively applied to defend original human creations while dismissing identical risks taken by forgers or AI developers. This feels like a rhetorical sleight-of-hand where the definition of valid risk shifts depending on who's creating.

  Hmm, this is actually quite sophisticated cultural analysis. The user seems well-versed in art theory debates - probably an academic, critic, or deeply engaged creator themselves. There's frustration here about intellectual inconsistency, but also what feels like a deeper concern about how we assign value in the age of AI. They're not just asking for terminology; they want tools to expose flawed arguments.

  The pattern they describe is fascinatingly circular: risk only counts when it comes from the privileged "author" position. But what makes someone an author in the first place? That's the unexamined premise. The forgery examples are particularly telling - a brilliant forger might pour more personal expression into perfecting a Vermeer than Vermeer's assistants did on his workshop pieces, yet only the latter gets credit.

  When considering existing terms... "Authenticity" is too broad. "Intentionality" misses the risk aspect. "Romantic authorship" comes close but doesn't capture the moving goalposts. The user's "movable fence" metaphor is actually perfect - it shows how the criterion shifts to protect predetermined conclusions.

  For the boundary cases they requested: That factory painter example is key. Minimal emotional risk, yet still gets authenticity protection. Conversely, the political dissident's unsigned manifesto involves massive risk but isn't considered "authorial" in art terms. This exposes how the argument isn't really about risk at all - it's about maintaining existing power structures in art valuation.

  Proposing "Authorial Risk Gatekeeping" as a term feels right. It combines the selective application (gatekeeping) with the supposed criterion (risk) while specifying the domain (authorial status). The user might appreciate how this mirrors other academic terms like "epistemic gatekeeping." 

  The user's request shows impressive analytical depth. They're not falling for surface-level debates about AI art; they're pinpointing the flawed underlying logic used in those debates. That deserves precise terminology in response.
answer: |-
  Here's an analysis of the rhetorical pattern you're identifying, structured as requested:

  **Restating the pattern**
  You're observing a selective invocation of "authentic emotional risk" as the defining source of value for original human art. This criterion is applied inconsistently: it's waived for unrisky human production (factory art, commissions) but rigidly denied to non-human creators (AI) or unauthorized human creators (forgers), even when they face significant *other* risks (legal, financial, reputational). The concept of "risk" functions as a flexible justification, retroactively applied only to legitimize the desired "original."

  **Close neighbors**
  *   **Appeal to Intentionality:** Focuses on the *conscious purpose* of the creator. Your pattern is distinct because it specifically invokes *risk/vulnerability* as the necessary component of that intention, which is then selectively applied.
  *   **Cult of the Original/Aura (Benjamin):** Emphasizes the unique presence/history of the *object*. Your pattern focuses on the *creator's subjective experience* (risk) as the source of value, not the object's physical uniqueness.
  *   **Romantic Genius Concept:** Posits inherent, unique creativity in the artist. While related, your pattern highlights the *ad-hoc use of a specific action* (taking emotional risk) as a post-hoc justification, not an inherent quality.

  **The carving**
  This is **not** a general argument about authorial intent or authenticity. It's specifically the **tactical, inconsistent application of "authentic emotional risk/exposure" as the *sole* legitimizing factor for value, while simultaneously:**
  1.  **Ignoring that factor when it's absent in valued human works (e.g., commercial illustration, formulaic genre fiction).**
  2.  **Dismissing significant *non*-emotional risks (legal, financial) taken by unauthorized creators (forgers) or developers (AI teams) as irrelevant to "authenticity."**
  3.  **Defining "authentic risk" circularly: it only counts if it comes from the entity pre-defined as the "author."**

  *   **Boundary Case 1 (Risk Real, Shouldn't Count):** A political dissident anonymously publishes a powerful, factual manifesto written purely for strategic impact, facing immense personal risk (imprisonment, death). While the risk is profound and authentic, it's not *artistic* emotional exposure of the self *in the work itself*. The risk justifies its importance as speech, but not necessarily its *artistic authenticity* on the grounds of vulnerable self-expression argued in your pattern.
  *   **Boundary Case 2 (Risk Minimal, Should Count):** A famous artist, under contract, quickly produces a technically proficient but emotionally detached landscape for a hotel lobby, facing near-zero personal or career risk. Under the inconsistent application of your pattern, this work would *still* be defended as "authentic" over a perfect AI replica or a forger's copy, despite the lack of the invoked emotional risk, simply because of the pre-defined authorial status.

  **The name or coinage**
  There is **no single, widely established term** for this specific, inconsistent application of "authentic risk." Existing terms like "special pleading" or "moving the goalposts" are too broad. Based on your description:

  *   **Proposed Term: "Authorial Risk Gatekeeping"**
  *   **Scope:** This term describes the rhetorical maneuver where "authentic emotional risk/exposure" is strategically deployed *as a gatekeeping mechanism* to defend the privileged status of works attributed to conventionally recognized "authors" (human creators, especially named ones). Its defining feature is the **selective application:** the gate (risk) is only lowered for the pre-approved "author," regardless of the actual presence or absence of that risk in their work or its presence in unauthorized/alternative creations. It highlights how "risk" is used not as a consistent criterion, but as a justification for maintaining existing authorial hierarchies.
