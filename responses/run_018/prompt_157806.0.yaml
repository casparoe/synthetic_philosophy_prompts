    "implicit_agency_model": "Individuals assumed to have full control over employment/paperwork outcomes; corporations seen as constrained by systems, making tax avoidance a rational necessity.",
    "modal_control_claim": "Unemployed individuals could have easily found work/avoided errors in similar circumstances (unemployment is a choice); corporations could not reasonably avoid using existing loopholes (exploitation is systemic).",
    "consistency_check": "Applying the corporate standard excuses individual non-compliance due to systemic barriers. Applying the individual standard condemns corporate tax avoidance as reckless choice demanding penalties, regardless of legality.",
    "replacement_consequences": "Applying corporate logic collapses workfare sanctions, requiring systemic support. Applying individual logic criminalizes corporate tax avoidance, risking business disruption and demanding loophole closure."
  }
