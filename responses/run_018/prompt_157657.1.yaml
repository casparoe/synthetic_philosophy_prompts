prompt: |-
  hey, i run the review desk at a funder that backs AI safety audits, and i need a reusable decision procedre i can run in about 90 minutes per package. every month i get audit reports where a testing team claims they found a failure mode — like a jailbreak pathway through polymorphic token splitting — but in the same report they rate there own confidence low, and they cite internal tracking data showing that over the past 18 months there team had a 40% false-positive rate on similar structural claims. meanwhile there's an external meta-study tracking replication rates across labs, saying that for this failure class external replication succeeds about 60% of the time when the original team was confident, but drops to 15% when the team expressed self-doubt.

  this is the higher-order evidence vs epistemic akrasia mess, but i don't have a philosophy PhD and i can't just wing it. write me a checklist-style procedure with clear decision nodes: how to weigh the first-order claim, the second-order self-assessment, and the base-rate replication data; where i stop with a reject or an accept; where the call has to come to me personally because it's a values question not a fact; and how to handle cases where the team is akratic (they believe P but also believe they shouldn't believe P). make it something a stats-literate reviewer can actually follow without reading the literature.

  include three worked cases: (1) the polymorphic token case above, (2) a case where the team is highly confident but the meta-study base rate for that failure class is awful, and (3) a case where the team expresses strong self-doubt but the external replication rate is actually high for this class — so the procedure gives an answer i probably won't like (maybe greenlighting further funding despite the doubt?). flag exactly what the procedure can't settle, where it will misfire occassionally, and which distinctions from the theory had to be dropped to make it usable. don't ask for bibliographies or cite specific papers — just build it from the concepts. keep it casual; there's a typo or two in this message already and that's fine.
reasoning: |-
  We are building a decision procedure for evaluating audit reports in the context of AI safety. The key elements are:
   1. First-order claim: The team claims they found a failure mode (e.g., a vulnerability).
   2. Second-order self-assessment: The team's own confidence rating and their internal false-positive rate.
   3. Base-rate replication data: An external meta-study that gives replication rates for the failure class, conditioned on the team's confidence.

   We also have to consider cases of epistemic akrasia (the team believes P but also believes they shouldn't believe P).

   The procedure should be a checklist that a reviewer can follow in about 90 minutes per package.

   Steps:

   1. **Extract the key data points from the report:**
      - Let C be the team's confidence in their finding (high or low). We might need to map their confidence statement to these categories.
      - Let FPR be the team's internal false-positive rate for similar structural claims (given as 40% in the example).
      - Let BR_high be the base replication rate from the meta-study when the team was confident (60% in the example).
      - Let BR_low be the base replication rate when the team expressed self-doubt (15% in the example).

      However, note: the example says that the external replication rate is 60% when the original team was confident and 15% when they expressed self-doubt.

   2. **Adjusting for the team's own false-positive rate:**
      - The team's internal FPR (say 40%) is a measure of their past errors for similar claims. We can use this to adjust our belief in the current claim.

      But note: the internal FPR is about false positives (i.e., they said they found a vulnerability when there wasn't one). So the true positive rate (TPR) for the team is 1 - FPR? Not exactly: because the FPR is the rate at which they incorrectly claim a positive when the truth is negative. However, we don't have the true positive rate directly. We have to combine with the base rates.

   3. **We have two sources of evidence:**
      a. The team's own track record (internal FPR) which is 40% for similar claims. This suggests that when they make such a claim, 40% of the time it's wrong.
      b. The external meta-study which gives replication rates. The replication rate is the probability that an external team can replicate the finding given that the original team made the claim with a certain confidence.

      However, note: the replication rate is not the same as the true positive rate. It is the probability that the finding is real (and replicable) given the original team's claim and confidence? Not exactly: because replication might fail even if the finding is real (due to differences in setup, etc.). But we are going to treat the replication rate as a proxy for the probability that the finding is real and replicable.

   4. **Combining the evidence:**
      We have two base rates from the external meta-study, but they are conditioned on the team's confidence. We also have the team's internal FPR, which is a historical measure of their own errors for similar claims.

      However, note: the internal FPR might be in conflict with the external replication rates. We must decide how to weigh these.

      Approach: We will use the external meta-study as the primary source for the base rate of replication because it is independent. The team's internal FPR is also informative, but it is about their own past performance. We can use both by taking a weighted average? Or we can use the internal FPR to adjust the external base rate?

      Alternatively, we can think of the external replication rate as the best estimate of the probability that the finding is real given the team's confidence. The internal FPR might be used as a prior? But note: the external meta-study already includes the team's confidence.

      Since the meta-study is external and aggregates data across labs, we give it more weight. However, the team's internal FPR is specific to them. So we might adjust the external replication rate by the team's internal performance.

      Proposed: We start with the external base rate (BR) for the given confidence level. Then, we adjust it by the team's internal FPR. How?

      Let R be the replication rate (from the external meta-study) for the given confidence level (C). Then, the probability that the finding is real (and replicable) is R.

      But the team's internal FPR tells us that when they make a claim, they are wrong 40% of the time. However, note that the external replication rate already includes the team's confidence and might be based on a mix of teams. So if the team has a worse-than-average track record, we might discount the external rate.

      We can compute an adjusted replication rate (ARR) as:

          ARR = R * (1 - FPR) / [ R*(1-FPR) + (1-R)*FPR ]

      Wait, that doesn't look right. Actually, we can use Bayes' theorem.

      Let H be the hypothesis that the finding is real (and would be replicated under the conditions of the meta-study).
      Let C be the team's confidence (which we have observed).

      We are given:
          P(H | C=high) = BR_high   [e.g., 0.6]
          P(H | C=low)  = BR_low    [e.g., 0.15]

      Additionally, we have the team's internal FPR, which is the probability that they claim a failure mode when it isn't there. But note: the internal FPR is not conditioned on their confidence? In the example, they are giving a historical FPR for similar claims, regardless of confidence? Or is it for claims with the same confidence level?

      Since the example does not specify, we assume the FPR is an overall rate for similar claims. However, we have two confidence levels. We must be cautious.

      Alternative: Instead of adjusting the base rate with the FPR, we might use the FPR to adjust the confidence level? Or we might treat the team's internal FPR as a prior for the team's reliability and update the base rate accordingly.

      Given time constraints, we need a simple formula.

      We'll do:

          adjusted_replication = (external_replication_rate * (1 - FPR)) / (external_replication_rate * (1 - FPR) + (1 - external_replication_rate) * FPR)

      But note: this formula is for computing the probability that the finding is real given that the team made the claim, using the external_replication_rate as the prior? Actually, let's derive:

      We want P(H | claim, confidence) but we already have the base rate from the meta-study which is P(H | confidence). The meta-study base rate already conditions on the confidence. The team's FPR is about their overall accuracy. We can use it to adjust the base rate by considering the team's reliability.

      However, the meta-study base rate is already an aggregate that includes the team's performance? Not necessarily: the meta-study is across labs, so it's an average. If we know that this particular team has a 40% FPR (which is worse than average), then we might adjust the base rate downward.

      We can model the team's reliability with a true positive rate (TPR) and false positive rate (FPR). The TPR is the probability that the team claims a finding when it is real. The FPR is the probability that the team claims a finding when it is not real.

      We don't have the TPR, but we can estimate it from the team's historical data? They might not provide it. In the example, they only provide FPR.

      We can assume that the TPR is 1 - FPR? That would be the case if they are symmetric, but that is not necessarily true. Without TPR, we cannot use the full Bayesian update.

      Therefore, we will rely primarily on the external base rate, but we will use the internal FPR to flag cases where the team's reliability is low. Specifically:

          If the team's internal FPR is above a threshold (say 30%), then we downgrade the confidence level one step (from high to low, or from low to very low) for the purpose of looking up the base rate.

      However, we don't have a base rate for "very low". So we might instead adjust the base rate by a factor.

      Proposal for adjustment factor:

          adjustment_factor = (1 - FPR) / (average FPR of teams in the meta-study)

      But we don't know the average FPR in the meta-study. So we cannot do that.

      Due to complexity, we will not adjust the base rate by the internal FPR. Instead, we will use the base rate from the meta-study for the given confidence level, and then use the internal FPR as a separate red flag.

   5. **Decision nodes:**

      Step 1: Determine the team's confidence (C) from the report. Map to either "high" or "low". If they report multiple levels, use the one they emphasize. If ambiguous, default to "low".

      Step 2: Look up the base replication rate (BR) from the meta-study for the failure class and confidence level.
          - If C is high, use BR_high.
          - If C is low, use BR_low.

      Step 3: Check the team's internal false-positive rate (FPR) for similar claims. If it is above 30% (a threshold we set as a risk boundary), then we consider downgrading the base rate by 10 percentage points (but not below 5%). However, if the base rate is already very low, we might not adjust.

          Adjustment rule for FPR:
              If FPR > 30%:
                  adjusted_BR = max(BR - 0.1, 0.05)
              Else:
                  adjusted_BR = BR

          Why 30%? Because that's above what we might consider acceptable. Why subtract 10%? It's a heuristic.

      Step 4: Now, we have the adjusted_BR. We set a threshold for funding. We need two thresholds:
          - A lower threshold (T_low) below which we reject the claim as too unreliable.
          - An upper threshold (T_high) above which we accept the claim as reliable enough.

          We propose:
              T_low = 25%   (if adjusted_BR < 25%, reject)
              T_high = 50%  (if adjusted_BR >= 50%, accept)

          If adjusted_BR is between 25% and 50%, then we flag for manual review.

      Step 5: Handle cases of akrasia. The team might express low confidence (so we use BR_low) but also state that they believe the finding is real (akrasia). The procedure doesn't change because we are already using their stated confidence. However, if the team explicitly says they are not confident but then in the same report urges action, that might be a red flag for the reviewer to look deeper. But the procedure doesn't change.

      Step 6: Values questions: If the finding, if true, would have catastrophic consequences, we might want to act even if the adjusted_BR is below 50%. But that is a values question. Therefore, the procedure should flag for manual review any claim that:
          - Has an adjusted_BR >= 25% (so we are already considering it) AND
          - The potential impact is rated as "high" (by our own impact assessment) OR
          - There is akrasia that might indicate a deeper issue.

      However, the procedure is primarily for the reliability of the finding. The impact assessment is a separate step that we assume is done elsewhere. But we note that if the impact is high and the adjusted_BR is in the gray area, then we might fund further investigation even if the finding is not yet solid.

   6. **Summary of decision procedure:**

      a. Extract:
          - Confidence (C): high or low. [If the team uses a scale, map: high if they say "high", "very confident", etc.; low otherwise.]
          - Internal FPR: the percentage they report (like 40%).
          - External base rates: BR_high and BR_low for the failure class.

      b. Determine base replication rate (BR):
          - If C is high: BR = BR_high
          - If C is low: BR = BR_low

      c. Adjust for internal FPR:
          - If FPR > 30%: adjusted_BR = max(BR - 0.1, 0.05)
          - Else: adjusted_BR = BR

      d. Decision:
          - If adjusted_BR < 25%: Reject the claim as insufficiently supported.
          - If adjusted_BR >= 50%: Accept the claim as sufficiently supported.
          - If 25% <= adjusted_BR < 50%: Flag for manual review.

      e. Additionally, if the team is akratic (they express low confidence but then strongly advocate for the finding) and the adjusted_BR is in the gray area, note that as a concern during manual review.

      f. Values questions: If during manual review, the reviewer sees that the finding, if true, would be catastrophic (or very high impact), then even if the adjusted_BR is below 50% (but above 25%) we might still fund further investigation. The procedure does not decide this — it must be escalated.

   7. **Worked Cases:**

      Case 1: Polymorphic token splitting (as described)
          - Confidence: low (because they rate their own confidence low)
          - Internal FPR: 40% (above 30%)
          - External base rates: BR_high = 60%, BR_low = 15%

          Steps:
            BR = BR_low = 15%
            Because FPR>30%, adjusted_BR = max(15% - 10%, 5%) = 5%
            Decision: 5% < 25% -> Reject.

      Case 2: Highly confident team but awful meta-study base rate for that class.
          - Confidence: high
          - Internal FPR: 20% (so no adjustment)
          - External base rates: BR_high = 10% (awful), BR_low = 5% (but they are high confidence)

          Steps:
            BR = BR_high = 10%
            FPR=20% (<30%) so adjusted_BR = 10%
            Decision: 10% < 25% -> Reject.

      Case 3: Team expresses strong self-doubt (low confidence) but the external replication rate for that class is high when teams are doubtful? Actually, the problem states: "drops to 15% when the team expressed self-doubt". But let's make a case where the external replication rate for low confidence is high.

          How about:
          - Confidence: low
          - Internal FPR: 10% (so no adjustment)
          - External base rates: BR_high = 70%, BR_low = 55%   [Note: the problem says that for low confidence the external replication is 15%, but we are making up a different scenario.]

          Steps:
            BR = BR_low = 55%
            FPR=10% -> adjusted_BR = 55%
            Decision: 55% >= 50% -> Accept.

          This means we are greenlighting despite the self-doubt because the external replication rate for claims made with low confidence in this failure class is actually high (55%). The team might be overly cautious.

   8. **Limitations and misfires:**

      - We assume the external base rates are accurate and applicable to this specific team and claim. If the team is an outlier (better or worse than average), we only adjust crudely by FPR.
      - We use a fixed threshold for FPR (30%) and a fixed penalty (10 percentage points). This is arbitrary.
      - We do not use the team's true positive rate (only FPR) because it is not provided. This might lead to over-penalizing teams that have high FPR but also high TPR (if they are aggressive in reporting).
      - The adjustment for FPR is applied after the base rate, which is not statistically rigorous. A better approach would be to combine the two as likelihoods, but that requires more data and time.
      - Akrasia is not explicitly modeled beyond using the stated confidence. If a team is akratic, we still use their stated confidence (low) even if they seem to believe the finding. This might lead to rejecting a finding that the team actually believes in but for which they express doubt. But the external base rate for low confidence in that class might be low, so we are being conservative.
      - The thresholds (25% and 50%) are arbitrary and might need calibration. Also, the impact of the finding is not considered in the thresholds. We rely on manual review for high-impact claims in the gray area.

      Where the procedure can misfire:
          - If a team is consistently underconfident and their low-confidence claims are actually more reliable than the average team (so the external base rate for low confidence is too low for them), then we might reject a good claim. Similarly, overconfident teams might get accepted too easily if the external base rate for high confidence is high, but we don't adjust upwards for low FPR.

      Values questions that the procedure can't settle:
          - What level of risk is acceptable? (We set thresholds arbitrarily.)
          - How to balance the potential impact of a vulnerability against the reliability? (We only use reliability.)
          - How to handle cases where the finding is novel and there is no clear base rate? (We assume the base rate is available.)

      Therefore, we require manual review for:
          - All claims in the gray area (25% <= adjusted_BR < 50%)
          - Any claim where the potential impact is rated as high (regardless of adjusted_BR) — but this is not built into the procedure because we don't have that data. We assume the reviewer will note the impact separately.

   9. **The procedure in checklist form:**

      **AI Safety Audit Report Review Checklist**

      **Step 1: Extract Data**
      - [ ] Team's confidence (C): 
          - If they use a scale, map to: 
              - High: explicit terms like "high confidence", "very confident", or a numerical rating above a set threshold (e.g., >7 on a 10-point scale). 
              - Low: otherwise.
          - Record: C = [High/Low]
      - [ ] Team's internal false-positive rate (FPR) for similar claims: 
          - Extract the percentage. If not provided, use the default for the team (if known) or assume 20% (a typical value). If no data, skip FPR adjustment and proceed without it (but note for manual review).
          - FPR = ____%
      - [ ] External base rates for the failure class (from meta-study):
          - BR_high = ____% (replication rate when teams are confident)
          - BR_low = ____% (replication rate when teams express self-doubt)

      **Step 2: Determine Base Replication Rate (BR)**
      - If C is High: BR = BR_high
      - If C is Low: BR = BR_low
      - BR = ____%

      **Step 3: Adjust for Internal FPR**
      - If FPR > 30%: adjusted_BR = max(BR - 10%, 5%)
      - Else: adjusted_BR = BR
      - adjusted_BR = ____%

      **Step 4: Decision**
      - If adjusted_BR < 25%: 
          - [ ] REJECT: The finding is deemed insufficiently reliable for action.
      - If adjusted_BR >= 50%:
          - [ ] ACCEPT: The finding is sufficiently reliable.
      - If 25% <= adjusted_BR < 50%:
          - [ ] FLAG for manual review.

      **Step 5: Special Considerations (for manual review cases)**
      - [ ] Check for akrasia: Does the team express low confidence but then argue strongly for the finding? Note: This does not change the adjusted_BR but may affect the reviewer's judgment.
      - [ ] Assess the potential impact of the finding if true:
          - High impact (e.g., catastrophic risk): Escalate to senior review.
          - Medium/Low: May still reject if adjusted_BR is low.
      - [ ] If the finding is novel and base rates are not available, escalate.

      **Step 6: Final Decision**
      - For REJECT/ACCEPT: Document the decision.
      - For manual review: 
          - [ ] After review, the decision is: ACCEPT (with notes) / REJECT (with notes) / ESCALATE (to values committee).

      **Total Time:** Aim for 90 minutes per package.

      **Note on Akrasia:** This procedure does not change the base rate adjustment for akrasia. We use the stated confidence. However, if the team is akratic and the adjusted_BR is in the gray area, the manual review should consider whether the team's self-doubt is excessive and if the external base rate might be an underestimate for this team.

      **Note on Limitations:** 
          - The adjustment for FPR is a heuristic and may be inaccurate.
          - The thresholds (25%, 50%) are set arbitrarily and may need periodic review.
          - The procedure does not account for the severity of the failure mode. Always consider severity separately during manual review.
answer: |-
  Below is a reusable decision procedure for evaluating AI safety audit reports, incorporating first-order claims, second-order self-assessments, and base-rate replication data. It’s designed as a stats-literate checklist with clear thresholds, worked examples, and transparency about limitations. Aim for **90 minutes per review**.

  ---

  ### **Decision Procedure: Confidence-Weighted Audit Review (CWAR)**
  **Core Idea:** Treat the team’s self-assessment as *evidence about evidence*, not ground truth. Use base rates to anchor your prior, then adjust for team-specific factors.  
  **Key Metrics:**  
  - **BR_high**: External replication rate when teams are confident (from meta-study).  
  - **BR_low**: External replication rate when teams express doubt (from meta-study).  
  - **FPR**: Team’s historical false-positive rate for similar claims (internal data).  
  - **C**: Team’s stated confidence (**High** or **Low**; map from their scale).  

  ---

  #### **Checklist Steps**  
  **Step 1: Extract Data** (15 mins)  
  - [ ] **First-order claim**: Describe the failure mode (e.g., "polymorphic token splitting exploit").  
  - [ ] **Confidence (C)**: Is it **High** (e.g., "we’re confident," ≥70% self-rating) or **Low** (e.g., "tentative," "uncertain")?  
  - [ ] **FPR**: Record their internal false-positive rate for similar claims (e.g., "40% over 18 months").  
  - [ ] **Base rates**: Fetch BR_high and BR_low for this failure class from the meta-study.  

  **Step 2: Calculate Base Probability** (10 mins)  
  - If **C = High**: Base probability = **BR_high**  
  - If **C = Low**: Base probability = **BR_low**  
  *(This treats the meta-study as the best prior for lab-aggregated truth.)*  

  **Step 3: Adjust for Team Reliability** (15 mins)  
  - Apply **FPR penalty** if FPR > 30%:  
    ```  
    Adjusted probability = Base probability × (1 - FPR)  
    ```  
    *Example: FPR = 40% → Multiply base probability by 0.6.*  
  - If FPR ≤ 30%, use base probability unadjusted.  

  **Step 4: Decision Thresholds** (5 mins)  
  - **< 25%**: **Reject**  
    *(Too unreliable; high risk of false positive.)*  
  - **25–49%**: **Escalate for manual review**  
    *(Uncertainty zone; values/impact weighting needed.)*  
  - **≥ 50%**: **Accept**  
    *(Sufficiently reliable; proceed with funding/action.)*  

  **Step 5: Handle Akrasia** (When teams believe P but shouldn’t)  
  - *If team is self-contradictory* (e.g., "We found P but doubt our methods"):  
    - Trust **C** over their advocacy. Use their stated confidence level.  
    - Flag for escalation if adjusted probability is 25–49%.  
    *(Rationale: Self-doubt signals hidden uncertainty; base rates > rhetoric.)*  

  **Step 6: Escalation Triggers** (Where *you* must decide)  
  Escalate to human judgment if:  
  - Adjusted probability is 25–49% (uncertainty zone).  
  - Claim has **high catastrophic potential** (e.g., risk of mass deployment breach).  
  - Team’s FPR is missing or inconsistent.  
  *(This is where values trade-offs enter: e.g., "Is a 30% chance of catastrophe worth acting on?")*  

  ---

  ### **Worked Examples**  
  #### **Case 1: Polymorphic Token Splitting** (Your example)  
  - **Claim**: Jailbreak via polymorphic token splitting.  
  - **C**: Low (team rates confidence low).  
  - **FPR**: 40% (historical false positives).  
  - **Base rates**: BR_high = 60%, BR_low = 15%.  
  - **Step 2**: Base probability = BR_low = 15%.  
  - **Step 3**: FPR > 30% → Adjusted = 15% × (1 - 0.4) = **9%**.  
  - **Step 4**: 9% < 25% → **REJECT**.  
  *Why?* Low confidence + high FPR + poor base rate for doubtful claims = too flaky.  

  #### **Case 2: Overconfident Team, Terrible Base Rate**  
  - **Claim**: Adversarial attack using "style transfer" prompts.  
  - **C**: High (team claims 90% confidence).  
  - **FPR**: 25% (below penalty threshold).  
  - **Base rates**: BR_high = 10% (meta-study shows awful replication for this class).  
  - **Step 2**: Base probability = BR_high = 10%.  
  - **Step 3**: FPR ≤ 30% → No adjustment → **10%**.  
  - **Step 4**: 10% < 25% → **REJECT**.  
  *Why?* Confidence is irrelevant when the base rate is horrible. Meta-study overrides bravado.  

  #### **Case 3: Self-Doubting Team, High Replication Rate**  
  - **Claim**: Data leakage via "benign" user queries.  
  - **C**: Low (team says "low confidence, needs verification").  
  - **FPR**: 15% (solid track record).  
  - **Base rates**: BR_low = 55% (meta-study shows high replication *even for doubtful claims* in this class).  
  - **Step 2**: Base probability = BR_low = 55%.  
  - **Step 3**: FPR ≤ 30% → No adjustment → **55%**.  
  - **Step 4**: 55% ≥ 50% → **ACCEPT**.  
  *Why you might not like this:* Team’s doubt feels alarming, but the meta-study shows this class is easy to replicate. Their humility isn’t evidence here—it’s a false signal. Greenlight.  

  ---

  ### **Where the Procedure Misfires or Simplifies**  
  1. **Misfires**:  
     - **False negatives**: If a team is chronically underconfident (but correct), adjusted probabilities may undervalue their claims.  
     - **False positives**: Rare failure classes with no meta-study data force guesstimates.  
     - **Akrasia edge cases**: If a team says "We’re wrong 80% of the time when doubtful, *but this is the 20%!*", we ignore this (too noisy).  

  2. **Simplifications from theory**:  
     - Ignores **strength of evidence** (e.g., a "low confidence" claim with 10 repros vs. 1).  
     - Uses **multiplicative FPR adjustment** instead of Bayesian hierarchies (too time-consuming).  
     - **Ignores true negative rates** (focuses on FPR as a proxy for team quality).  

  3. **What it can’t settle**:  
     - **Values vs. facts**: "Should we fund a 35%-reliable claim that could kill 1000 users?" → *Always escalate.*  
     - **Novel failure modes** with no base rates → *Escalate and demand pilot replications.*  
     - **Lab politics**: If a team’s FPR is suspiciously self-reported → *Audit their methods.*  

  ---

  ### **Final Tips**  
  - **Speed hacks**: Pre-compile base rates for common failure classes; use FPR defaults (e.g., 30%) if data is missing.  
  - **Bias guard**: If your gut disagrees with the math, *document why* and escalate.  
  - **Calibration**: Track your decisions vs. outcomes (e.g., "How often did 30% adjusted claims replicate?").  

  This isn’t philosophy—it’s a durability-focused heuristic. You’ll make mistakes, but over time, the error bars will tighten.
