  The user created a 50/50 mixture test: Omega runs either mugging or blackmail protocols without revealing which. In mugging, Omega flips a coin - heads deposits money if your simulation pays when told tails, tails sends demand. In blackmail, you get a letter if either your house has termites OR you'd pay upon receiving it. The user thinks if these are symmetric, the mixture should balance out, but feels an asymmetry - mugging's upside seems tied to pre-commitment while blackmail's downside feels post-decision.

  I need to structure my response clearly as requested: short answer, where they're wrong, the real asymmetry, the mixture issue, and teaching advice. The key insight is that mugging rewards a specific counterfactual action (paying on losing outcome) while blackmail punishes a general disposition (paying on receipt). This makes mugging pull toward paying (evidential/functional view) while blackmail pulls toward not paying (causal view). In their mixture, the asymmetry comes from mugging rewarding pre-commitment consistency while blackmail penalizes current action consistency with past type.

  For teaching, I'll suggest presenting both problems to show how predictor interactions create different pressures - mugging tempts paying to satisfy counterfactual selves, blackmail tempts resisting to avoid signaling vulnerability. This reveals how decision theories handle predictor relationships differently.
answer: |-
  **The short answer:**  
  No, mugging and blackmail aren’t mirror images. Mugging rewards your *policy* of paying in a losing scenario (pulling toward paying), while blackmail punishes your *type* as a payer (pulling toward *not* paying). They exploit different links between your act and the predictor’s model. Your mixture feels asymmetric because mugging’s payoff hinges on pre-resolution consistency, while blackmail’s penalty hinges on post-revelation consistency.  

  **Where I'm going wrong:**  
  You’re right that both problems involve a predictor’s model overriding local causality, like Newcomb. But you’re flattening a critical distinction: *what trait* the predictor punishes or rewards. In mugging, Omega rewards you for having a *counterfactual willingness* to pay $100 on a coin outcome that didn’t happen. Paying *now* (when the coin is tails) is irrelevant to the reward; it’s about whether your *simulated self* paid in a scenario you never observe. This is "acausal" in that your act *now* doesn’t cause the $10k; it’s about satisfying a condition in a branch that’s already closed.  

  In XOR blackmail, the penalty ($1,000 loss) depends on whether your *actual decision upon receiving the letter* matches a fixed fact (termites). If you pay, you lose money iff paying *correlates* with having termites (i.e., iff you’re the "type" who pays *because* you have termites). Unlike mugging, your *present act* directly determines whether you fall into the punished category. Blackmail exploits *evidential* links (paying *signals* vulnerability), while mugging exploits *subjunctive* ones (your policy in unactualized worlds).  

  **The asymmetry that actually does the work:**  
  The core asymmetry isn’t about "signs flipped" but about *temporal targeting*. Mugging targets your *pre-commitment*: the $10k reward depends solely on a decision you *would have made* before knowing the coin flip. When Omega demands $100 after a tails flip, paying *now* doesn’t cause gain; it merely confirms a pre-existing trait. This pulls evidential/functional decisionists toward paying to "cooperate with their counterfactual self."  

  Blackmail targets your *post-revelation choice*. Paying *now* doesn’t just correlate with termites; in the XOR setup, it *creates* the loss when termites are *absent* (since loss occurs iff exactly one of [termites, paying] is true). If you have termites, paying saves your house; if not, paying burns $1k for nothing. Crucially, *not paying* voids the loss if termites are absent. Causalists see paying as *causing* a loss when termites are false (which they might believe is likely). This pulls causalists toward refusing payment to avoid signaling/complicity.  

  **The 50/50 mixture and your bookkeeping worry:**  
  Your intuition about "adding ex ante to ex post" is spot-on. In the mugging half (Protocol A), the $10k reward depends on a *policy* you adopted *before* knowing your situation. If Omega flips heads, you’re rewarded for what your simulation did *without* current stakes. If tails, paying $100 feels like a sunk cost—it doesn’t help you, but "honors" the policy that earned the $10k. The benefit is "backward-looking": it compensates for past consistency.  

  In the blackmail half (Protocol B), the penalty depends on your *reaction to the letter*. When you decide whether to pay, you don’t know if termites exist. Paying *now* risks actively creating a loss (if termites are absent) or preventing one (if present). The cost is "forward-looking": your act *reshapes* the outcome based on hidden facts.  

  When merged, the asymmetry arises because mugging’s benefit is locked in *before* you act (if the coin was heads, you’ve already won; if tails, acting doesn’t change that win). But blackmail’s penalty is determined *by* your act. Your bookkeeping isn’t wrong—mugging’s value is retrospective, blackmail’s is prospective. This makes the mixture feel incoherent: one half rewards your past self’s hypothetical integrity, the other punishes your present self’s concrete choice.  

  **What you should tell the seminar:**  
  "Mugging and blackmail aren’t opposites of Newcomb—they stress different cracks in decision theory. Mugging asks if you’ll sacrifice to satisfy a counterfactual version of you; it tempts evidential thinkers. Blackmail asks if you’ll resist paying to avoid being ‘the type’ who gets exploited; it tempts causal thinkers. Run both to show how predictors force us to weigh consistency across time, branches, and identity."  

  ---  
  *Key for clarity:*  
  - **Mugging → Pays off for *pre-coin* consistency (functional/evidential: pay).*  
  - **Blackmail → Penalizes *post-letter* consistency (causal: don’t pay).*  
  This framing avoids jargon ("subjunctive," "acausal") while highlighting the tension.
