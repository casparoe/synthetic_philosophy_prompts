prompt: |-
  A friend of mine reckons he's dissolved supererogation entirely, and I hate his argument but can't find the break in it. It goes: (1) If one of the acts open to you is morally better than every other available act, you ought to do it — that's just what "ought" picks out, the top option on the menu. (2) A supererogatory act is meant to be one that's morally better than anything duty demands while still not being demanded: the passerby who runs into the burning building does something better than staying back, yet staying back isn't wrong. (3) But by (1), the passerby ought to run in. (4) So "supererogatory" acts are really just obligatory acts we're too squeamish to demand of each other, and supererogation doesn't exist. (5) And notice (1) doesn't care that the example was heroic: apply it to any choice whatsoever and only the best available act is ever permissible. (6) So there's no moral latitude at all — me watching telly tonight instead of volunteering isn't a permissible-but-suboptimal choice, it's just wrong, full stop. I refuse to swallow (6), and I'd really like to keep the idea that saints and heroes go beyond duty rather than merely doing their jobs, but each premise looks perfectly tame on its own. Which step should I reject, why did it look so harmless, and what do I pay for rejecting it compared with the alternatives?

  Answer in British English, in three sections in this order: "The diagnosis" (the step to reject and why it looked fine, roughly 150 words), "The price list" (what each way of blocking the argument costs, roughly 200 words), and "Your verdict" (which price you'd actually pay, roughly 50 words).
reasoning: |-
  Hmm, the user presents a friend's argument that dissolves supererogation and moral latitude entirely. The argument seems logically tight but leads to counterintuitive conclusions where any suboptimal choice becomes morally wrong. The user wants to reject this conclusion while preserving space for heroic acts and everyday moral flexibility. 

  Breaking down the argument: Premise (1) defines "ought" as always selecting the single best option. Premise (2) describes supererogation's paradox - acts better than duty yet not obligatory. Step (3) applies (1) to eliminate this category, leading to (6)'s total moral rigorism. The user instinctively rejects (6) but finds each premise "tame" alone. 

  The core tension lies in premise (1)'s reductive definition of "ought." It appears harmless because we naturally associate "ought" with optimality in simple cases (e.g., choosing salad over poison). But this ignores how moral language actually functions - we routinely distinguish between "obligatory" and "ideal." Premise (1) smuggles in consequentialism by stealth. 

  Rejecting (1) costs us conceptual tidiness but preserves moral phenomenology. The alternatives are worse: denying (2) erases heroism; accepting (6) makes morality impossibly demanding. The price is worth paying - we maintain ethical nuance by allowing "ought" to sometimes permit suboptimal choices when costs are disproportionate, while still recognising extraordinary acts as genuinely supererogatory.
answer: |-
  ### The Diagnosis  
  The break lies in **premise (1)**: "If one act is morally *better* than all others, you *ought* to do it." This equates "morally best" with "morally obligatory," collapsing the distinction between optimality and requirement. It looked harmless because in *many* cases, the best option *is* indeed obligatory (e.g., rescuing a child from a shallow pond). But supererogation arises precisely when morality recognises a *gap* between what’s *demanded* (duty) and what’s *admirable* (the optimal act). Premise (1) assumes this gap doesn’t—or can’t—exist, treating "ought" as mechanically tracking maximal moral value. Yet our moral intuitions suggest that demandingness, personal cost, and reasonable expectations matter: some high-value acts are *beyond* what can be strictly required. Premise (1) ignores these constraints, reducing morality to a blunt ranking exercise.  

  ### The Price List  
  Rejecting different premises incurs distinct costs:  
  - **Reject (1)**: You must explain why "morally best" doesn’t always imply "obligatory." This requires defending a **multi-tiered moral structure** (e.g., duties vs. ideals). The cost: moral theory becomes messier. You’ll need criteria (e.g., significant sacrifice, optionality thresholds) to separate duty from supererogation, risking vagueness or cultural relativism.  
  - **Reject (2)**: Deny that supererogatory acts are *morally better* than permissible alternatives. This preserves duty’s exclusivity but **flattens moral value**, making heroism merely "good, not better." Cost: Saints/heroes lose their special status, and morality feels impoverished.  
  - **Accept (6)**: Swallow the "no moral latitude" conclusion. Cost: **Extreme demandingness**. Every suboptimal act (e.g., resting instead of donating) becomes immoral. Morality collapses into relentless maximisation, alienating real-world agents and ignoring human limitations.  
  - **Reject the "single scale" assumption**: Argue moral value isn’t *always* comparable on one axis (e.g., self-regarding vs. other-regarding goods). Cost: You permit "moral dilemmas" where no act is clearly best, but this might *over*-excuse inaction.  

  ### Your Verdict  
  I’d pay the price for **rejecting (1)**. While demanding a criterion to distinguish duty from supererogation, it preserves moral nuance, honours heroism, and avoids crushing ordinary agents with impossible obligations. The messiness is preferable to the dystopian rigorism of (6).
