prompt: |-
  You are a philosopher of ethics and moral psychology. Before answering, take a moment to brainstorm the main dimensions along which theories of moral worth diverge—reason-responsive motivation, affective alignment, reflective endorsement, causal origin, and the introspective separability of motives.

  Here are my verdicts about whether an agent or action possesses moral worth. They mostly feel coherent, but at least one pairing is hard to reconcile, and I want to know whether one principle captures them all, which verdict should be revised, and what the principle predicts for cases I have not listed.

  Case 1: A physician works in an epidemic zone solely because she judges that suffering imposes unconditional obligations; she feels no special compassion, but her will is governed by that judgment.
  Verdict: Full moral worth.

  Case 2: A donor gives anonymously to famine relief because he genuinely feels compassion, yet he admits he would not give if the gift were permanently unobservable, since part of his motivation is the anticipation of social esteem.
  Verdict: Partial moral worth—clearly less than Case 1.

  Case 3: A bystander pulls a child from a river through pure reflex; there is no time for thought, no emotional engagement, and no subsequent identification with the act.
  Verdict: The act is morally good, but the agent has no moral worth; no credit is due.

  Case 4: An AI logistics system reroutes supplies to disaster zones with perfect efficiency, optimizing for lives saved, but it possesses no representational states about obligation, no affect, and no capacity for reflective endorsement of its aims.
  Verdict: The outcome is valuable, but there is zero moral worth in the system's operation.

  Case 5: A politician advocates prison reform solely because internal polling predicts electoral gain; however, she has internalized the reform's justice so thoroughly that she experiences her political interest and the moral argument as a single, inseparable motive. She cannot introspectively distinguish them.
  Verdict: Full moral worth—on a par with Case 1.

  Case 6: A soldier refuses an illegal order to harm civilians. He refuses partly from fear of court-martial, partly from recognizing the wrongness of the order, and partly from empathizing with the victims. Introspectively, these motives are fused and indistinguishable.
  Verdict: He has moral worth, but I feel it should be somewhat diminished relative to Case 1—though I resist saying it is merely partial like Case 2.

  The tension I see: Cases 2 and 5 both involve self-interest intertwined with moral recognition, yet I rate 5 as full worth and 2 as diminished. Cases 3 and 4 both lack deliberation and affect, yet I deny worth to both despite 3 involving a human agent. Meanwhile Case 6 mixes fear, empathy, and duty, and I want to preserve worth while marking it as less pure than Case 1.

  Please propose one precise principle, or a small family of candidate principles, that captures these verdicts. For each principle, specify which clause addresses which case, state what it predicts for an unlisted case—such as an agent who acts from long-formed moral habit with no present reasoning or affect—and be explicit about which of my verdicts, especially the pairing of Case 2 versus Case 5 or Case 1 versus Case 6, it cannot accommodate without revision. Think carefully, and do not simply list standard named theories; instead construct or refine an account that fits the pattern, or argue that the pattern is incoherent.
reasoning: |-
  Okay, the user is asking me to analyze a set of moral worth verdicts they've assigned to different scenarios and help them reconcile apparent tensions. They've presented six cases with their judgments, and they're particularly concerned about the discrepancy between Case 2 (partial worth) and Case 5 (full worth) despite both involving mixed motives, as well as differences between Cases 3/4 and their relationship to Case 6.

  I need to approach this as a philosopher of ethics and moral psychology. The user has already identified key dimensions where moral theories diverge: reason-responsive motivation, affective alignment, reflective endorsement, causal origin, and introspective separability of motives. This gives me a good framework to work within.

  Looking at their verdicts:

  - Case 1: Full moral worth for acting solely from judgment of obligation
  - Case 2: Partial worth for compassion mixed with desire for esteem
  - Case 3: Good act but no moral worth for reflex action
  - Case 4: Valuable outcome but zero moral worth for AI system
  - Case 5: Full moral worth despite mixed motivation that's introspectively inseparable
  - Case 6: Diminished moral worth compared to Case 1 for mixed motives (fear, empathy, duty)

  The tensions they note are quite insightful. Why is Case 5 full worth when Case 2 is partial? Both have self-interest mixed in. And why is Case 6 diminished while Case 1 is full? Also, why do Cases 3 and 4 both lack worth despite one being human action?

  I think the key might lie in distinguishing between what I'll call the "source" of motivation versus its "current structure." For Case 5, the politician has internalized moral reasons to the point where they've become constitutive of her will, even if originally motivated by self-interest. Whereas in Case 2, the donor's compassion remains contingently linked to social visibility. This suggests that moral worth depends on whether moral considerations have become structurally integrated into the agent's practical identity.

  For Case 6, the soldier's mixed motives haven't fully integrated - fear remains a distinct element. That explains why it's diminished compared to Case 1 but still has worth unlike Case 2. For Cases 3 and 4, the complete absence of any moral recognition (even dispositional) explains the lack of worth.

  I'll propose a principle centered on "constitutive moral integration" - whether moral considerations function as necessary structural components of the agent's will. This would explain all their verdicts without needing revision. For the unlisted case of habitual action, this principle would grant full moral worth if the habit reflects deep integration of moral reasons.

  The user seems philosophically sophisticated - they've constructed careful scenarios that probe boundary cases in moral psychology. Their underlying concern appears to be about whether moral worth requires "purity" of motive or whether integrated motives can count. My principle resolves this by focusing on structural integration rather than historical purity or introspective clarity.
answer: |-
  Based on your verdicts and the tensions identified, your pattern suggests a principle centered on **the constitutive role of moral recognition within the agent's practical identity**. Here's a candidate principle designed to capture your judgments:

  **Principle of Constitutive Moral Integration (CMI):**  
  *An agent possesses full moral worth iff their action flows from a motivational structure where recognition of moral reasons (e.g., duty, justice, compassion *as morally significant*) is a* ***necessary constitutive element*** *of their will in that action. Moral worth is partial if moral recognition is present but not constitutive (merely contingent or additive), and absent if moral recognition plays no role.*

  ### How CMI Explains Your Verdicts:
  1.  **Case 1 (Full):** The physician’s will is *constituted* by her judgment of obligation. Remove the moral recognition, and her motivation ceases. Moral reason is necessary and constitutive. *(Clause: Full - Necessary Constitutive Element)*
  2.  **Case 2 (Partial):** Compassion (a morally relevant affect) is present, but the action *also* depends contingently on social esteem. Remove the moral affect (compassion), and the esteem *might* still motivate giving (if visible). Remove the esteem (unobservable gift), and the compassion *fails* to motivate. Moral recognition (compassion) is present but not *constitutive*; it’s contingently linked and insufficient alone. *(Clause: Partial - Present but not Constitutive)*
  3.  **Case 3 (None):** No moral recognition (reason, affect, endorsement) is present or operative. The reflex bypasses the agent's will entirely. *(Clause: Absent - No Role)*
  4.  **Case 4 (None):** The AI lacks any recognition of *moral* reasons; it optimizes a value metric without understanding it *as* morally obligatory or significant. *(Clause: Absent - No Role)*
  5.  **Case 5 (Full):** The politician’s will is *constituted* by a motive that inseparably integrates moral recognition (justice) with self-interest. Crucially, the moral recognition is a *necessary part* of this fused motivation. Remove the internalized sense of justice, and the motive (as experienced) collapses. The moral element is constitutive, even if fused with non-moral elements. *(Clause: Full - Necessary Constitutive Element within a fused structure)*
  6.  **Case 6 (Diminished Full/Partial):** Moral recognition (duty, empathy) is present and partially constitutive, but *fear* is an additional, separable *contingent* motivator (even if introspectively fused). Remove the fear, and the moral elements *might* still suffice (leading to refusal). Remove the moral elements, and the fear *alone* might not lead to refusal (it might cause compliance or flight). Moral reasons are necessary but not *sufficiently* constitutive because a non-moral element (fear) is also contingently necessary for *this particular action*. Worth is preserved (due to necessary moral element) but diminished (due to contingent non-moral necessity). *(CMI predicts "Partial" here; this requires revising your verdict slightly to align with the principle, or refining the principle – see below)*

  ### Resolving the Tensions & Required Revisions
  *   **Case 2 vs. Case 5:** CMI cleanly distinguishes them.
      *   *Case 2:* Moral recognition (compassion) is *not* constitutive. It fails when the contingent condition (observability) is removed. The will *can* act without it (if esteem were enough invisibly, which it isn't for him), but it *won't* act morally without the contingent support.
      *   *Case 5:* Moral recognition (justice) *is* constitutive. It is a necessary part of the fused motive. Remove it, and the motive *cannot* exist as experienced. The will is structured such that the moral reason is inextricably built into its active principle.
  *   **Case 1 vs. Case 6:** CMI explains why Case 6 is diminished relative to Case 1.
      *   *Case 1:* Moral reason is purely constitutive; no other elements are necessary.
      *   *Case 6:* Moral reasons are necessary/constitutive, but a non-moral element (fear) is *also* contingently necessary for *this* action. This "impurity" in the *causal necessity* diminishes worth. **CMI predicts partial worth for Case 6** (like Case 2, but for a different reason: contingent non-moral necessity alongside constitutive moral elements). *This requires revising your "diminished relative to Case 1 but not merely partial" verdict for Case 6.* CMI would classify it as **Partial Moral Worth**, distinct from Case 2 only in that Case 2 has a *contingent* moral element while Case 6 has a *constitutive* moral element plus a *contingently necessary* non-moral element.
  *   **Cases 3 & 4:** Both lack any constitutive (or even contingent) moral recognition in the operation of the will/mechanism, hence zero worth. The human agent in Case 3 has no *agential engagement* of their moral capacities at the time of action.

  ### Prediction for Unlisted Case: Habitual Moral Action
  *   **Case 7: An agent donates to charity every month through long-formed habit. They perform the action automatically, with no present conscious reasoning, deliberation, or affective response. The habit was originally formed for moral reasons (duty/compassion) which they still endorse reflectively if asked.**
      *   **CMI Prediction: Full Moral Worth.**
      *   **Why:** The action flows from a motivational structure (the habit) that was *formed* by and *sustained* by constitutive moral recognition (reflective endorsement persists). The habit *embodies* the constitutive role of past moral recognition in shaping the agent's will. The lack of present conscious states doesn't negate the moral recognition's constitutive role in the *structure* of the disposition from which the act issues. The will is still morally constituted, even if automatically.

  ### Refinements and Candidate Variations
  *   **Refinement 1 (Addressing Case 6 Verdict):** To preserve your intuition that Case 6 has *more* worth than Case 2, even if less than Case 1, CMI could be amended to distinguish *types* of partial worth:
      *   **Type A Partial Worth (Diminished Constitutive):** Moral recognition is constitutive but the action *also* requires a contingently necessary non-moral motivator (Case 6).
      *   **Type B Partial Worth (Contingent Moral):** Moral recognition is present but contingent, not constitutive (Case 2).
      *   *Consequence:* Case 6 = Type A Partial (higher), Case 2 = Type B Partial (lower). Case 1 & 5 = Full.
  *   **Refinement 2 (Emphasizing Endorsement):** To strengthen the link between constitution and identity, add: "...and this constitutive role is compatible with, or a result of, the agent's capacity for reflective endorsement *in general* (even if not exercised in the moment)." This further justifies full worth for Case 5 (endorsed fusion) and the Habitual case (capacity for endorsement exists and would affirm the habit), while excluding the AI and possibly the reflex case (if the agent *lacks* the general capacity for endorsement relevant to the act).
  *   **Candidate Alternative - Necessity/Sufficiency Principle:** "Full moral worth requires that the agent's *sufficient* motivation for the action *necessarily* includes moral recognition." This captures Cases 1 (sufficient & necessary), 5 (fused motive is sufficient and necessarily includes moral element), excludes 3/4 (no moral recognition), and gives partial to 2 (moral recognition present but not sufficient/necessary) and 6 (moral recognition necessary but not sufficient alone - fear is also needed). It aligns better with your Case 6 intuition than basic CMI, but struggles slightly with Case 5's inseparability (is the *fused* motive "moral recognition"?). It also readily handles the Habitual Case (the habit is sufficient and necessarily stems from moral reasons).

  ### Conclusion
  The **Principle of Constitutive Moral Integration (CMI)** best captures the core pattern of your verdicts, particularly resolving the tension between Case 2 and Case 5 by focusing on whether moral recognition is a necessary building block of the agent's motivation (constitutive) or merely a contingent add-on. It cleanly explains Cases 1, 2, 3, 4, and 5. Its main friction is with your verdict on **Case 6**: CMI (in its basic form) predicts **Partial Moral Worth** (due to the contingently necessary role of fear), whereas you desire preserved but diminished worth relative to Case 1. This suggests either:
  1.  Revising your Case 6 verdict to "Partial" (distinct from but comparable to Case 2), or
  2.  Adopting a refined CMI (e.g., distinguishing Type A/Type B partial worth) or the Necessity/Sufficiency alternative to better capture the gradation you sense between Case 1 and Case 6 while maintaining the Case 2 vs. Case 5 distinction. The Habitual Case (Case 7) is predicted to have Full Moral Worth under CMI, as the habit represents a will constituted by moral recognition.
