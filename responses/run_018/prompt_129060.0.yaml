answer: |-
  lol ok but you're missing Anderson's whole point — it *feels* ancient and authentic *because* the ritual's been internalized through schools/media/modern bureaucracy, not 'cause it actually *is* old! That's the genius/danger of nationalism: it constructs deep emotional reality from modern political tools. Obvs the ritual matters now — people die for this stuff! — but the "real line" is recognizing it was stitched together to serve a modern state's needs, not some organic folk soul. Like, does its 1897 birth year being airbrushed out make it *more* authentic, or just prove how hard nationalism works to *invent* ancient roots? If it's manufactured, can it ever be "genuine" in the *primordial* sense you're implying?
