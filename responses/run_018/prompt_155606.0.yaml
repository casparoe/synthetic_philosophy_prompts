prompt: |-
  I am a retired epidemiologist who, since leaving laboratory work, has begun attending a philosophy of science discussion group composed largely of other retired natural scientists—physicists, ecologists, and a mathematician—most of whom have strong frequentist intuitions about sampling and error but little exposure to formal decision theory or anthropic reasoning. Next month I have volunteered to lead a single ninety-minute session on the distinction between the self-sampling assumption and the self-indication assumption, taking Nick Bostrom's presumptuous philosopher thought experiment as the central cautionary case rather than as a passing anecdote. The group tends to treat observer-selection effects as correctable sampling biases—errors that diminish with larger N—and at least two members have already suggested that a theory predicting more observers should be preferred because it offers more opportunities for verification. I want a teaching plan, not a lecture script: first, the precise dependency order in which the conceptual pieces must be introduced so that each layer rests on the previous one; second, the one concrete carrying scenario—specifically a modified ecological field-survey case in which an observer discovers herself alone in an archive of unrecorded census sheets, deliberately lacking any multiverse cosmology—that should bear the full weight of the distinction and that must possess exactly the right structural features and omissions; third, the predictable misconceptions that will form at each stage, especially the conflation of self-locating belief revision with ordinary Bayesian conditioning under a uniform prior, and the separate slide from self-indication reasoning into a spurious moral obligation to maximize population size, with explicit instructions on where in the sequence each misconception should be intercepted and defused; fourth, a closing diagnostic question that reveals whether participants understand why the presumptuous philosopher's inference is structurally flawed rather than merely empirically risky; and finally, an explicit statement of what technical apparatus—such as the formal derivation of the SIA weighting factor or the full literature on simulation arguments—should be openly refused at this level with an acknowledgment of the refusal. The plan should assume no assigned readings, should not ask participants to consult sources, and should not include bibliographies, citations, or further reading lists.
reasoning: |-
  We are constructing a teaching plan for a 90-minute session. The goal is to introduce the distinction between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) using the Presumptuous Philosopher thought experiment. We avoid multiverse cosmology and instead use a modified ecological field-survey scenario. The audience has frequentist intuitions and may conflate observer-selection effects with correctable sampling biases.

  The plan must:
  1. Introduce concepts in a logical dependency order.
  2. Use a concrete ecological scenario without multiverse elements.
  3. Anticipate and intercept misconceptions.
  4. Include a closing diagnostic question.
  5. Explicitly refuse certain technical apparatus.

  Structure of the Session:

  I. Introduction (10 minutes)
     - Briefly set the stage: We are examining how our own existence as observers might affect our reasoning about the world.
     - State the problem: Sometimes, when we consider theories that predict different numbers of observers, we might be tempted to adjust our beliefs based on the fact that we are here. But how?
     - Preview: We'll look at two principles (SSA and SIA) and see why they lead to different conclusions, and why one might be problematic.

  II. Foundational Concepts (15 minutes)
     - **Probability in Epistemology**: Remind the group that we are dealing with degrees of belief (subjective probability) in the face of uncertainty. This is Bayesian, but avoid heavy formalism.
     - **Observer Selection Effects**: Explain that sometimes the way we observe the world is constrained by the fact that we are observers. For example, we cannot observe a world without observers. This is not a correctable sampling bias because we cannot get a larger sample of observations from non-existent observers.
     - **The Self-Sampling Assumption (SSA)**: Introduce SSA as the idea that you should reason as if you were a random sample from the set of all actual observers. (This is the standard frequentist intuition they have, but we will see it leads to a puzzle.)

     *Misconception Interception*: At this point, emphasize that observer-selection effects are not like a biased sample that can be corrected by increasing N. The problem is that the sample (of one, yourself) is the only sample you can ever have, and it is necessarily taken from the set of observers that exist. So, if a theory says there are many observers, then in that theory you are one of many, and if a theory says there are few, then you are one of a few. But that does not necessarily mean the theory with more observers is more likely.

  III. The Presumptuous Philosopher (15 minutes)
     - Present the thought experiment (as per Bostrom): 
          Two theories: T1 says the universe is small and contains only a million observers. T2 says the universe is very big and contains a trillion observers. All other evidence equally supports T1 and T2. The presumptuous philosopher says: T2 must be correct because if T2 were true, there would be a trillion observers, and I am just one of them, which is unremarkable. But if T1 were true, then I would be one in a million, which is also unremarkable. So why prefer T2? The philosopher then argues that T2 is a trillion times more likely because it makes my existence (as a particular observer) a trillion times less surprising.

     - Point out the flaw in the presumptuous philosopher's reasoning: It seems to allow us to prefer theories that predict more observers without any empirical evidence. But science usually requires evidence.

     *Misconception Interception*: The group might think that the philosopher is simply applying a uniform prior and updating with the evidence of their own existence. But note: in both theories, the philosopher exists. The update is not about existence per se, but about the location or identity of the observer. We must avoid the conflation of self-locating belief revision (where am I in the population?) with ordinary Bayesian conditioning (what is the probability of the theory given the data?).

  IV. Modified Ecological Scenario (25 minutes)
     - **Scenario Setup**: 
          You are an ecologist who has been sent to a remote island to survey a rare species of bird. The island is known to be either small (area A) or large (area 100A). You have two theories:
            T_small: The island is small and has 100 birds.
            T_large: The island is large and has 10,000 birds.
          You are the only surveyor. You are to spend one day in the field and then return to the base camp. However, upon returning, you discover that the base camp has been destroyed by a storm, and all the records of previous surveys (if any) are lost. You find yourself alone in the archive hut, and the only record you have is your own one-day survey. In your survey, you observed one bird.

          The archive hut contains census sheets from previous years, but they are unrecorded (you don't know how many birds were recorded in the past). You also know that the island has been surveyed every year for many years, but the records are just stored in the hut without being summarized. Unfortunately, you cannot access the previous records because they are locked in a safe and the key was lost in the storm. So, you have only your observation: one bird.

          The two theories are equally supported by prior evidence (e.g., maps are ambiguous). The question: How should you update your beliefs about the size of the island?

     - **Applying SSA**: 
          According to SSA, you should consider yourself a random sample from the set of all actual observers of the birds. But note: in this scenario, the observers are the surveyors? Or are we considering the birds? Let's reframe: You are an observer of the birds. But the birds are the objects of study. We are concerned with the population of birds. However, note that the existence of the birds is not in question. We are concerned with the population size.

          Alternatively, we can think of the observers as the surveyors. But there is only one survey (yours) that you can use. However, note that there have been many surveys in the past, but you don't have the data. This is a key omission: you cannot use the past data because it is locked away. So you only have your own observation.

          We can adjust: Instead of having multiple surveyors, we can think of the surveys as multiple observations. But the scenario is set up so that you are the only one doing the survey this year, and you have one observation (one bird). The past surveys are inaccessible.

          We can reframe the problem: The two theories T_small and T_large predict different total numbers of birds. You have observed one bird. How does that observation update your belief?

          - Under T_small: There are 100 birds. The probability of observing any particular bird (if we assume you are equally likely to observe any bird) is 1/100.
          - Under T_large: There are 10,000 birds. The probability of observing any particular bird is 1/10,000.

          If we use ordinary Bayesian conditioning (without any observer selection effects), we would have:
            P(T_small | observed bird) ∝ P(observed bird | T_small) * P(T_small) = (1/100) * (1/2)
            P(T_large | observed bird) ∝ (1/10,000) * (1/2)

          So the ratio of the posterior probabilities would be (1/100) / (1/10,000) = 100. That is, T_small is 100 times more probable than T_large.

          This is the standard non-anthropic reasoning.

     - **Enter SIA**: 
          The Self-Indication Assumption says: Given that you exist as an observer, you should prefer theories that predict more observers (or in this case, more birds? but note: the birds are the observed, not the observers). We must be cautious: we are the observers, and we are observing birds. But in this scenario, we are not birds. We are human observers. So we must reframe.

          Alternatively, we can change the scenario to make the birds the observers? But that might confuse. Instead, let's make the observers the surveyors, but note that the number of surveyors is fixed (one per year) and independent of the bird population. So that doesn't work.

          We need to adjust the scenario to have the observers be the birds? That would be a different scenario. Instead, let's change the scenario to one where the observers are the birds:

          **Revised Ecological Scenario**:
            You are a bird. You are on an island that is either small (with 100 birds) or large (with 10,000 birds). You have been captured by a biologist and tagged. The biologist then releases you. As a bird, you are now aware of your existence and you wonder: what is the size of the island?

            You have no other information. The two theories are equally likely.

          Now, we can apply SSA and SIA.

          - SSA: You should reason as if you are a random sample from all birds on the island. So the probability of being any particular bird is uniform. Then:
              P(being this particular bird | T_small) = 1/100
              P(being this particular bird | T_large) = 1/10,000

            So the ratio of posteriors is 100:1 in favor of T_small.

          - SIA: The idea is that you should also condition on the fact that you exist. But note: in both theories, you exist. So that doesn't change. However, SIA says that you are more likely to exist in a world with more observers. So we should assign a prior probability that is proportional to the number of observers. That is, the prior for a theory should be proportional to the number of observers it predicts.

            So we set:
              P(T_small) proportional to 100
              P(T_large) proportional to 10,000

            Then the posterior:
              P(T_small | you exist) ∝ P(you exist | T_small) * P(T_small) = 1 * 100
              P(T_large | you exist) ∝ 1 * 10,000

            Then the ratio is 10,000:100 = 100:1 in favor of T_large.

          But note: we have conditioned only on existence, not on the particular identity. The presumptuous philosopher would then say: T_large is 100 times more likely? But that seems presumptuous because we have no other evidence.

          The flaw: Why should we adjust the prior for the theory based on the number of observers? That is the core of SIA.

     - **Discussion**: 
          In the bird scenario, SSA leads to the conclusion that the small island is more likely (because it's more likely that you are you in a small population). SIA leads to the conclusion that the large island is more likely (because there are more birds, so more chances for you to exist). But note: in the bird scenario, your existence as a particular bird is the same in both theories? Actually, in SIA, we are not conditioning on being a particular bird, but just on existing as a bird. So we are not using the information that we are a particular bird.

          However, in our observation, we do have that we are this particular bird. So we must combine both: 
            We have two pieces of information: 
              1. We exist (as a bird).
              2. We are this specific bird.

          SSA uses both (by directly saying we are a random sample from the set of birds). SIA, as defined above, only uses the first and then adjusts the prior.

          But note: the standard way to combine is to use SSA for the likelihood (which gives 1/N for being a specific bird in a population of size N) and then use a prior that is either flat over theories or flat over observers (SIA prior).

          The distinction:
            - SSA: likelihood-based approach (with a uniform prior over theories) or equivalently a prior over observer-moments and then conditionalization.
            - SIA: adjusts the prior over theories to be proportional to the number of observers.

          So in the bird scenario:
            SSA: Posterior ratio = [ (1/100) * 1 ] / [ (1/10,000) * 1 ] = 100
            SIA: Posterior ratio = [ (1/100) * 100 ] / [ (1/10,000) * 10,000 ] = 1

          That is, under SIA, the evidence (that you are this particular bird) is exactly canceled by the prior that favors the larger population. So you end up with the same posterior as the prior (which was 1:1).

          This is the key: SSA favors the smaller population, while SIA remains neutral.

          But the presumptuous philosopher in the original thought experiment uses SIA and then gets a strong preference for the larger universe.

          In our bird scenario, if we only condition on existence (without specifying which bird we are), then under SIA we would prefer T_large. But if we condition on being a specific bird, then under SIA we get back to neutral.

          However, in the original presumptuous philosopher, we are conditioning on being a specific observer (or are we?).

          Clarification: In the original, the philosopher conditions on the fact that he exists (as an observer) but not on being a particular observer. So he uses the existence as evidence. But in our bird scenario, if we condition only on existence (without being a particular bird), then we get:

            P(T_small | existence) ∝ P(existence | T_small) * P(T_small) = 1 * (1/2)   [if we started with flat prior over theories]
            P(T_large | existence) ∝ 1 * (1/2)

            But then we get no update? That's because the existence is certain under both theories. So why would we update?

          The SIA prior adjustment is an alternative: we set the prior P(T) proportional to the number of observers. Then:

            P(T_small) = 100 / (100+10000) ≈ 0.0099
            P(T_large) = 10000 / (100+10000) ≈ 0.9901

          Then, without any observation (other than existence) we already prefer T_large.

          That is the presumptuous philosopher's move: without any observation, we already prefer the theory with more observers.

          But in the bird scenario, we have an observation: we are a specific bird. So we must update on that.

            P(T_small | specific bird) ∝ P(specific bird | T_small) * P(T_small) = (1/100) * (100/10100) = 1/10100
            P(T_large | specific bird) ∝ (1/10000) * (10000/10100) = 1/10100

          So the ratio is 1:1.

          Conclusion: In the bird scenario, if we use SIA (adjusting the prior) and then condition on being a specific bird, we get back to equal probability.

          But note: without conditioning on being a specific bird, we would have:

            P(T_small | existence) = P(T_small) = 100/10100
            P(T_large | existence) = 10000/10100

          So we prefer T_large. But we have the information that we are a specific bird. Therefore, we must use that information. The SIA prior is combined with the likelihood of being this specific bird to yield neutrality.

          The presumptuous philosopher, however, does not condition on being a particular observer. He only conditions on existence. Therefore, he gets a strong preference for the larger universe.

          But is that valid? In the bird scenario, if we condition only on existence (and not on being a particular bird), then we are ignoring the information that we are this particular bird. But we do have that information. Therefore, we must use it.

          The flaw in the presumptuous philosopher: He fails to account for the fact that he is a particular observer. He only uses existence. But existence is not the only information. He also has the information that he is this specific observer. Therefore, he should update accordingly.

          Therefore, the presumptuous philosopher's inference is flawed because he does not condition on all the information. He treats the evidence as "I exist" when it is actually "I am this specific observer".

          This is the key point.

  V. Addressing Misconceptions (15 minutes)
     - **Misconception 1**: Observer-selection effects are just sampling biases that can be corrected by larger N.
          Interception: Emphasize that in the bird scenario, we cannot get more samples of our own existence. We are one observer, and we are stuck with that one sample. We cannot sample from the past because it's locked away. We cannot sample from non-existent observers. So it's fundamentally different.

     - **Misconception 2**: Conflating self-locating belief revision with ordinary Bayesian conditioning.
          Interception: In ordinary Bayesian conditioning, we update on data. In the bird scenario, the data is "I am bird number 7" (say). But we don't know which bird we are. So we model it by marginalizing over which bird we are. That leads to the likelihood of the data (which is that we are one bird) being 1/N for a theory with population N. This is the SSA likelihood. But note: the prior is over the theories. We did not adjust the prior by the number of birds. That adjustment is SIA.

          The key is that without SIA, we use the uniform prior over theories and then update with the likelihood 1/N. With SIA, we adjust the prior to be proportional to N and then update with the same likelihood 1/N, which cancels.

     - **Misconception 3**: Sliding from self-indication to a moral obligation to maximize population.
          Interception: The SIA prior adjustment is an epistemological rule, not a moral one. It does not say that we should create more observers. It only says that we should adjust our beliefs about which theory is true based on the fact that we exist. But note: even if we accept SIA, it does not imply we should create more observers. That would be a separate ethical step. We are only talking about belief formation.

  VI. Diagnostic Question (5 minutes)
     - **Question**: 
          In the bird scenario, if we only condition on the fact that we exist (as a bird) and do not condition on being a specific bird, what does SIA say about the relative probability of T_small and T_large? And why is this inference incomplete?

     - **Expected Answer**:
          SIA (by adjusting the prior) would make T_large much more probable. However, this inference is incomplete because we have additional information: we are a specific bird. When we condition on that, the effect of SIA is canceled and we are back to equal probability. The flaw in the presumptuous philosopher is that he does not account for the specific identity information.

     - **Why this reveals understanding**: 
          It shows that the participant recognizes that the evidence is not just existence but also includes the self-locating information of being a particular observer. Ignoring that leads to the presumptuous conclusion.

  VII. Refusal of Technical Apparatus (5 minutes)
     - Explicitly state: We have avoided the following:
          - Formal derivation of the SIA weighting factor in terms of reference classes.
          - The full literature on simulation arguments (which often use these ideas).
          - Multiverse cosmology and quantum mechanics.
          - The measure problem in cosmology.
          - The Doomsday argument and Fermi paradox.
     - Reason: These topics require more time and would distract from the core conceptual distinction we are focusing on. We are using a simple ecological scenario to isolate the logic.

  Timing Summary:
    I: 10 min
    II: 15 min
    III: 15 min
    IV: 25 min
    V: 15 min
    VI: 5 min
    VII: 5 min

  Total: 90 minutes.

  Note: The ecological scenario must be presented carefully to avoid confusion about who the observers are. We settled on the bird being the observer. This avoids the multiverse and keeps it grounded in ecology.

  Alternative if the bird scenario is too confusing: Use the original surveyor scenario but then reframe to make the surveyor a random sample of surveyors? However, that might not capture the self-locating aspect as well. We want to avoid having the number of surveyors depend on the theory. So the bird scenario is better.

  Final note: The scenario must be modified so that the observer is a member of the population being studied. That is why the bird scenario works.

  If the group is uncomfortable with being a bird, we can say: You are a member of a rare species on the island. You are trying to estimate the population size of your species. You have been tagged and released. Now you are reasoning about the population size. This is a standard capture-recapture setup except that we are only at the capture stage and we are the captured individual.
answer: |-
  ### Teaching Plan: Self-Sampling vs. Self-Indication in Observer Selection  
  **Duration:** 90 minutes  
  **Goal:** Distinguish SSA (Self-Sampling Assumption) and SIA (Self-Indication Assumption) using Bostrom’s presumptuous philosopher, without cosmology. Intercept frequentist biases and misconceptions.  

  ---

  #### **I. Introduction: Observer-Centered Reasoning (10 min)**  
  - **Hook:** Ask: *“If two theories predict different numbers of observers, should your existence as an observer favor one theory?”*  
  - **Context:** Explain that observer selection effects (OSE) are not sampling biases; they constrain what *can* be observed (e.g., no observation from a universe with no observers).  
  - **Key Distinction Preview:** SSA vs. SIA address OSE differently. Today’s tool: a field ecology case study.  
  - *Misconception Interception:* State upfront: OSE ≠ correctable sampling bias. Larger N doesn’t “dilute” the bias—it’s foundational.  

  ---

  #### **II. Foundational Concepts (15 min)**  
  **A. Self-Sampling Assumption (SSA)**  
  - **Definition:** *“Reason as if you are a random observer from all possible observers in your reference class.”*  
  - **Simple Example:** *“If 99% of humans have trait X, and you’re human, assume 99% chance you have X.”*  
  - **Bayesian Link:** Under SSA, observing yourself updates likelihoods but not priors.  

  **B. Self-Indication Assumption (SIA) (Introduce cautiously)**  
  - **Definition:** *“Your existence as an observer is evidence for theories predicting more observers.”*  
  - **Intuition Pump:** *“If Theory A predicts 1,000 observers and Theory B predicts 1,000,000, SIA says your existence makes B more likely.”*  
  - *Misconception Interception:* Warn: SIA is *not* Bayesian updating under uniform priors. It adds a new rule: **shift priors** to favor observer-rich theories.  

  ---

  #### **III. The Presumptuous Philosopher (15 min)**  
  - **Thought Experiment Recap:**  
    - Theory T1: 1 million observers in universe.  
    - Theory T2: 1 trillion observers.  
    - All non-OSE evidence equal.  
  - **Philosopher’s Claim:** *“T2 is trillions of times likelier—otherwise, my existence would be improbable!”*  
  - **Group Discussion Prompt:** *“Is this sound? Why might it feel ‘presumptuous’?”*  
  - *Misconception Interception:* Highlight: Philosopher confuses *likelihood* (SSA) with *prior shift* (SIA).  

  ---

  #### **IV. Core Case Study: The Island Bird Survey (25 min)**  
  **A. Scenario Setup**  
  - **Modified Ecological Context:**  
    > You are an ecologist in a remote rainforest. Two competing theories:  
    > - **T_small:** Island has 100 birds of species X.  
    > - **T_large:** Island has 10,000 birds of species X.  
    >  
    > *Prior evidence equally supports both theories.*  
    >  
    > You spend one day surveying. You find and tag **one bird**. Returning to camp, you discover:  
    > - All prior census data (decades of surveys) was lost in a flood.  
    > - You are the *only* scientist who recorded data that year.  
    > - No access to multiverse/cosmology—just this island.  

  **B. Applying SSA**  
  - **Reasoning:** *“I am a random observer. Under T_small, P(I tag this specific bird) = 1/100. Under T_large, P = 1/10,000.”*  
  - **Bayesian Update:**  
    - Posterior ratio = [P(T_small) × (1/100)] / [P(T_large) × (1/10,000)] = 100:1 favoring T_small.  
  - **Key Insight:** SSA uses your observation to update likelihoods → favors smaller populations.  

  **C. Applying SIA**  
  - **Reasoning:** *“My existence as an observer is more likely if T_large is true because there are more birds to observe.”*  
  - **Prior Shift:** SIA sets P(T_large) ∝ 10,000, P(T_small) ∝ 100.  
  - **Posterior Calculation:**  
    - P(T_small | observation) ∝ (1/100) × 100 = 1  
    - P(T_large | observation) ∝ (1/10,000) × 10,000 = 1  
    → **Equal posteriors!**  
  - **Contrast:** SIA’s prior shift cancels the likelihood advantage of T_small.  

  **D. Why This Scenario Works**  
  - **Structural Features:**  
    - No recoverable data (locks away frequentist “larger N” solutions).  
    - Single observer (forces self-locating uncertainty).  
    - No multiverse (isolates anthropic reasoning).  
  - **Omissions:**  
    - No intergenerational data (avoids temporal biases).  
    - No moral valence (avoids obligation fallacies).  

  ---

  #### **V. Addressing Misconceptions (15 min)**  
  1. **“SIA is just Bayesian updating with uniform priors.”**  
     - **Interception:** Show math: Uniform priors → posteriors favor T_small. SIA *alters priors* → cancels the effect.  
     - **Visual:** Side-by-side equations (SSA: priors fixed; SIA: priors ∝ N).  

  2. **“SIA implies we should maximize observers.”**  
     - **Interception:** Stress: SIA is epistemic (about belief), not normative (about action).  
     - **Analogy:** *“Believing cancer is common doesn’t mean we should cause cancer.”*  

  3. **“Observer-rich theories are better tested.”**  
     - **Interception:** *“In our scenario, all data is lost—you only have your one observation. More observers don’t give you more data.”*  

  ---

  #### **VI. Diagnostic Question (5 min)**  
  - **Prompt:** *“In the island scenario, if you found NO birds (not even yourself), would SSA or SIA update your beliefs? Why?”*  
  - **Correct Answer:**  
    - **SSA:** Favors T_small (P(no observation | T_small) > P(no observation | T_large)).  
    - **SIA:** Still shifts priors toward T_large, but likelihoods dominate → weakens T_large.  
  - **Why It Reveals Understanding:** Distinguishes SSA’s likelihood focus from SIA’s prior shift. The presumptuous philosopher ignores that SIA requires canceling evidence (here, no cancelation).  

  ---

  #### **VII. Explicit Refusals (5 min)**  
  - **Formal SIA Weighting:** *“We skip the SIA prior’s derivation (e.g., ∝ N) to avoid measure-theoretic debates.”*  
  - **Simulation Arguments:** *“We omit simulation hypotheses (Bostrom, etc.)—today is about principles, not cosmology.”*  
  - **Literature:** *“No citations: This is a self-contained conceptual primer. No further reading needed for today.”*  

  ---

  ### Summary Flow  
  1. **Problem Framing:** OSE ≠ sampling bias.  
  2. **SSA:** Random observer → updates likelihoods.  
  3. **SIA:** Observer existence → shifts priors.  
  4. **Case Study:** Island birds with lost data (SSA vs. SIA math).  
  5. **Misconceptions:** SIA ≠ Bayesian updating; ≠ moral obligation.  
  6. **Diagnostic:** Null result test.  
  7. **Refusals:** Math/simulations deferred.  

  **Pedagogical Mantra:** *“SSA updates your credence; SIA presumes your existence means something.”*
