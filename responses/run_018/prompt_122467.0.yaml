    4. The heart's function: pumping blood (a functional pattern in biology).
    5. The mouse's desire for cheese: an intentional state that predicts the mouse's behavior.

  Confidently not real:
    1. Mercury retrograde: an astrological pattern that doesn't causally affect deploys.
    2. Average family: an abstract statistical construct that doesn't describe any particular family.
