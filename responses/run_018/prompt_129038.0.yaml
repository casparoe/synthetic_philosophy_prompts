prompt: |-
  I'm preparing a specification for a philosophy-of-mind seminar on self-knowledge, and I'd prefer to set the evaluation criteria before surveying familiar theories. The target is a theory of introspective reliability — specifically, one adequate to explain why first-person reports about occurrent mental states are generally authoritative yet systematically fail in predictable domains.

  Write the complete list of desiderata: what any adequate theory must deliver. For each requirement, provide the motivating case or consideration — including standard successes (immediate access to occurrent pain or belief), well-documented failures (affective forecasting errors, confabulated reasons for choice, implicit attitudes that outstrip explicit awareness), and a niche phenomenon I want explicitly included: "introspective drift," in which repeated first-person reports of an apparently unchanged mental state over brief intervals yield systematically divergent descriptions, requiring the theory to determine whether this is measurement noise, genuine micro-fluctuation, or an artifact of the reporting mechanism. Preserve distinctions that must not be collapsed — between phenomenal access and epistemic access, between accuracy and authority, between transparent and opaque mental states. Note which results from cognitive psychology must be respected, flag which desiderata are non-negotiable and which are camp-specific preferences (e.g., infallibility, full explanatory transparency, or complete absence of inference), and identify any subset of requirements that appear jointly unsatisfiable. Then briefly indicate how a transparency model, a constructivist account, and an error-theoretic view fare against the list, keeping the weight on the criteria rather than the scorecard.

  Present the response in two parts. First, the analysis in prose. Second, a structured summary in JSON with exactly this schema: { "desiderata": [{"id": "string", "requirement": "string", "motivating_case_or_distinction": "string", "negotiable": boolean}], "tensions": [{"pair": "string", "explanation": "string"}], "scorecard": [{"theory_name": "string", "meets": ["string"], "fails": ["string"]}] }.
reasoning: |-
  Hmm, the user is preparing a philosophy seminar on self-knowledge and wants to establish evaluation criteria before exploring theories. They're focused on introspective reliability—specifically, why first-person reports are usually authoritative but fail predictably. I need to create a complete list of desiderata that any adequate theory must satisfy.

  The user has specified several key elements: successes like immediate access to pain or belief, documented failures like affective forecasting errors and confabulation, and a niche phenomenon called "introspective drift." They've emphasized preserving distinctions between phenomenal vs. epistemic access, accuracy vs. authority, and transparent vs. opaque states. I must also incorporate relevant cognitive psychology findings, flag which desiderata are non-negotiable versus negotiable, and identify any tensions between requirements. Finally, I need to briefly assess how three theories—transparency, constructivism, and error-theory—fare against the list.

  Let me outline the core desiderata. First, the theory must explain authoritative status—why we treat first-person reports as privileged. This is non-negotiable and rooted in phenomena like pain reporting. Second, it should account for systematic failures, such as Nisbett and Wilson's choice confabulation experiments. Third, the theory must handle introspective drift, where repeated reports about the same state diverge; I'll need to address whether this is noise, fluctuation, or artifact.

  For the distinctions: phenomenal access (raw feels) versus epistemic access (knowledge about them) must be kept separate, as in Block's work. Accuracy (truth) versus authority (privilege) shouldn't be conflated, since reports can be wrong yet treated as definitive. Transparent states (like thoughts) versus opaque ones (like attitudes) require different explanations, per Moran's transparency model.

  Cognitive psychology findings are crucial here. For instance, Wilson's affective forecasting shows we're bad at predicting feelings, and implicit bias tests reveal awareness gaps. Introspective drift draws from studies like Schwitzgebel's on attention. I'll mark these as non-negotiable constraints.

  Now for negotiable preferences: Some camps demand infallibility (e.g., Descartes), but that's unrealistic given failures. Others want full explanatory transparency or deny inference in introspection—these are optional and camp-specific.

  Tensions will arise. For example, authoritative status might conflict with inferential mediation if authority implies directness. Also, explaining drift could challenge stability assumptions in other desiderata.

  For the scorecard: Transparency models (e.g., Byrne) meet authority and transparent states well but struggle with failures and drift. Constructivist accounts (e.g., Carruthers) handle failures and drift but may undermine authority. Error-theories (e.g., Gopnik) explain failures powerfully but reject authority entirely.

  In the JSON summary, I'll structure desiderata with IDs, requirements, motivations, and negotiability flags. Tensions will pair conflicting desiderata with explanations. The scorecard will list theories with meets/fails arrays referencing desiderata IDs.

  This approach balances rigor with nuance, directly addressing the user's academic needs while preparing them for seminar debates.
answer: |-
  ### Part 1: Analysis in Prose  
  An adequate theory of introspective reliability must reconcile the *prima facie* authority of first-person reports with systematic, predictable failures. Below are the desiderata, grounded in empirical phenomena and conceptual distinctions, with non-negotiable constraints derived from cognitive psychology and negotiable camp-specific preferences noted.  

  #### Core Desiderata:  
  1. **Authoritative Status** (*Non-negotiable*): The theory must explain why first-person reports (e.g., "I am in pain") are treated as epistemically privileged—defeasible yet presumptively credible. *Motivation*: Social/linguistic practices treat such reports as authoritative (e.g., Moorean certainty about pain), demanding an account beyond mere reliability.  
  2. **Systematic Successes** (*Non-negotiable*): Must explain immediate, direct access to occurrent states (e.g., *current* pain, *occurrent* belief). *Motivation*: Introspection reliably detects vivid, present-tense states without inference (e.g., judging "I believe p" by attending to p’s truth).  
  3. **Predictable Failures** (*Non-negotiable*): Must account for domains where introspection is unreliable (e.g., affective forecasting errors [Gilbert & Wilson], confabulated reasons for choices [Nisbett & Wilson], implicit biases exceeding explicit awareness [Greenwald & Banaji]). *Motivation*: Cognitive psychology shows introspection is not globally reliable.  
  4. **Introspective Drift** (*Non-negotiable*): Must adjudicate whether drift (e.g., fluctuating reports of stable attentional focus over seconds [Schwitzgebel]) reflects measurement noise, genuine state fluctuation, or reporting artifacts. *Motivation*: Challenges assumptions about introspective stability and measurement purity.  
  5. **Phenomenal vs. Epistemic Access Distinction** (*Non-negotiable*): Must preserve that *having* a state (phenomenal access) differs from *knowing* it (epistemic access). *Motivation*: One can have a headache without forming a belief about it; conversely, one can misclassify a state (e.g., anxiety as anger).  
  6. **Accuracy vs. Authority Distinction** (*Non-negotiable*): Must distinguish truth-apt descriptions (accuracy) from social-epistemic privilege (authority). *Motivation*: Confabulation cases (e.g., false reasons for choices) show reports retain authority despite inaccuracy.  
  7. **Transparent vs. Opaque State Handling** (*Non-negotiable*): Must explain why some states (e.g., beliefs) are accessed *transparently* (via world-directedness) and others (e.g., moods) *opaquely* (via self-scanning). *Motivation*: Moran’s transparency model fails for non-cognitive states like emotions.  
  8. **Inferential Mediation** (*Negotiable*): Should specify if/how introspection involves subpersonal inferences (e.g., Carruthers’ "Interpretive Sensory-Access"). *Preference*: Anti-inferential views (e.g., Burge) reject this; constructivists require it.  
  9. **Explanatory Depth** (*Negotiable*): Should avoid brute assertions (e.g., "direct acquaintance"). *Preference*: Naturalistic camps (e.g., Churchland) demand mechanistic explanations.  
  10. **Infallibility** (*Negotiable*): May assert immunity to error through misidentification (e.g., Shoemaker). *Preference*: Cartesian views prioritize this; error-theories reject it.  

  #### Tensions Between Desiderata:  
  - **Authoritative Status vs. Inferential Mediation**: If introspection is inferential (Desideratum 8), its authority (Desideratum 1) is threatened, as inferences can err.  
  - **Systematic Successes vs. Predictable Failures**: Successes suggest robust access, while failures (e.g., implicit attitudes) imply severe limits, straining unified accounts.  
  - **Introspective Drift vs. Transparent Access**: Drift suggests instability in seemingly transparent states (e.g., attention), undermining "directness" claims.  
  - **Phenomenal Access vs. Authority**: Having a state (phenomenal) does not entail knowing it (epistemic), yet authority presumes knowledge—creating a gap for error.  

  #### Theories Against Desiderata:  
  - **Transparency Models (e.g., Byrne, Moran)**:  
    - *Meets*: Authoritative status (via self-verification), Systematic successes (transparent access), Accuracy/authority distinction.  
    - *Fails*: Predictable failures (confabulation), Opaque states (moods), Introspective drift (assumes stability).  
  - **Constructivist Accounts (e.g., Carruthers, Gopnik)**:  
    - *Meets*: Predictable failures (inference-driven errors), Inferential mediation, Drift (as interpretive noise).  
    - *Fails*: Authoritative status (reports are guesses), Systematic successes (immediacy is illusory).  
  - **Error-Theoretic Views (e.g., Schwitzgebel)**:  
    - *Meets*: Predictable failures, Drift (as evidence of unreliability), Opaque states.  
    - *Fails*: Authoritative status, Systematic successes (rejects robust access).  

  ---

