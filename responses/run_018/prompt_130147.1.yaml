prompt: |-
  ok me and my roommate just got done arguement for like three hours about grounding and fundamentality and i'm still mad. she has this weird track record that actually fits like three different theories but she won't see it. she says a table's brownness is fully grounded in atomic surface properties. she says a shadow isn't grounded in any shadow-substance but jointly in the lamp, wall, and absence of light. she says 'there is a president' is grounded in institutional rules and collective acceptance, definately not reducible to brain states. she says water being necessarily H2O is grounded in the essential nature of water, not in language conventions. and she says cruelty being wrong is just fundamental, not grounded in natural properties at all.

  so here's the new case we fought over. there's a persistant virtual world with deterministic code, but the players built an autonomous economy and culture that the devs can't touch without breaking everything. there's one artifact the code defines as worthless scrap, but the community collectively treats it as a symbol of honor and trades it like currency. my roommate says the fact that it has social value is grounded in the collective practices, same as the president case. but she also says that if there's a normative claim like 'it's wrong to destroy it for profit,' that's brute and not grounded in the practices or the code.

  predict what she'd actually say about both parts, lay out the rules she's running—maybe essentialist-constitution for physical stuff, institutional for social, non-naturalist for normative?—and say which ones fit her earlier verdicts just as well. tell me what each rule predicts for the artifact's value and for the normative claim, give your best guess with reasons, and name the further case that'd split them—maybe if the community suddenly abandons the artifact but the code never changes. please lead with your bottom line in the first sentence, then reasoning, no preamble and don't restate the question.
reasoning: |-
  Hmm, this user is clearly frustrated after a heated philosophical debate with their roommate about grounding and fundamentality. They've described their roommate's positions on several cases (brown tables, shadows, presidents, water, cruelty) and now want me to predict how she'd handle a virtual world scenario involving a worthless scrap item that gains social value.

  The roommate seems consistent in applying different grounding rules to different domains: physical properties (essentialist-constitution), social facts (institutional), and moral claims (non-naturalist). For the virtual artifact case, she'd likely say:
  - Its social value is grounded in community practices (like the president example)
  - Any normative claim about it being "wrong to destroy" would be brute/fundamental (like cruelty being wrong)

  The patterns fit: physical/social/normative each get distinct treatments. But if we created a scenario where the community abandons the artifact while the code remains unchanged, it would test whether she truly prioritizes practices over code for social facts. If she then says the value disappears, it confirms institutional grounding; if she insists value remains due to code, it contradicts her earlier pattern.

  User wants this analysis delivered concisely: bottom line first, then reasoning without restating the question. I'll organize it as requested - prediction of roommate's stance, rule analysis, fit with previous cases, and a splitting case.
answer: |-
  **Bottom line:** Your roommate would say the artifact's social value is grounded solely in collective practices, while any normative claim about its wrongness is brute and ungrounded, fitting her institutional grounding for social facts and non-naturalism for normativity, with no conflict.  

  ### Prediction & Rules  
  1.  **Artifact's Social Value**: She'd ground it *entirely in the community's collective practices*, like the "president" case. Institutional rules (collective acceptance) create the social fact ("has value as honor/symbol"), overriding the code ("worthless scrap").  
      *   *Rule:* **Institutional Grounding** (Social facts exist via collective acceptance, irreducible to underlying physical/code states).  
      *   *Fit:* Matches her "president" verdict (grounded in institutions, not brain states).  

  2.  **Normative Claim ("Wrong to destroy")**: She'd call this *fundamental and ungrounded*, like "cruelty is wrong." No appeal to practices or code can ground the "wrongness."  
      *   *Rule:* **Non-Naturalist Moral Fundamentalism** (Normative truths are sui generis, not reducible to descriptive facts like practices or code).  
      *   *Fit:* Matches her cruelty verdict (wrongness brute, not natural properties).  

  ### Why Other Rules Don't Conflict  
  - **Physical Stuff (Essentialist-Constitution)**: Her "brownness" and "water" cases fit this. But the artifact's *social* value isn't physical, so institutional grounding applies instead.  
  - **Deflationary/Constructivist (Shadow)**: Her shadow case rejects shadow-substance but grounds it in physical arrangements. Normative claims aren't analogous—she gives them no grounding base.  

  ### Splitting Case Prediction  
  **Scenario:** *The community abandons the artifact (stops treating it as valuable), but the code still labels it "worthless scrap."*  
  - **Her Likely Verdict:** The artifact *loses all social value* because value is grounded *only* in current collective practices. The unchanged code is irrelevant.  
  - **Why:** Institutional grounding requires *ongoing* collective acceptance (like a president losing office if rules/acceptance change). This splits from "water is H₂O"—essential properties don’t vanish if ignored.  

  ### Why It's Consistent (Even If Maddening)  
  Her framework rigidly categorizes:  
  - Physical properties → Grounded in essential/structural features (brownness, water).  
  - Social facts → Grounded in collective practices (president, artifact's value).  
  - Normative truths → Brute fundamentals (cruelty, artifact's "wrongness").  
  No overlap—each domain has its own grounding rule. Your frustration likely stems from her rejecting *any* reduction of normativity to social practices, even when (like here) the normative claim arises *from* the social context. For her, practices create the social fact ("has value"), but not the moral fact ("wrong to destroy").
