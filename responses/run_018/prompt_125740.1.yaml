  Third component: irreducibility. Is there a neutral way to arbitrate these meta-priors? Probably not. Any arbitration would beg the question. Credence 0.75 since it's hard to imagine a non-circular method. The highest uncertainty is here because maybe some meta-arguments could persuade across frameworks.

  Combining these: 0.7 * 0.8 * 0.75 ≈ 0.42. But since they're not fully independent, overall credence around 0.45. The irreducibility part has the most uncertainty.

