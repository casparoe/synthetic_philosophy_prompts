  For an upper-level undergraduate seminar on minds, machines, and formal systems, write one essay exam question (to be answered in 90 minutes, worth 40% of the final grade) on Hofstadter's MU-puzzle and the idea of "jumping out of the system." The question should be built around the following crux, which I want the exam to isolate: nearly every student can recite that MU cannot be derived from MI because every derivable string has an I-count that is never divisible by three, and that we can see this only by stepping outside the system's four rules rather than working within them. Far fewer can say what that stepping-out actually establishes. The standard weak answer concludes that formal systems are inherently limited in a way human minds are not, since we can see truths about the system that the system cannot reach. The question should force students to confront the reply that this is too fast: the meta-level proof (the induction on derivation length showing the I-count invariant is preserved by all four rules) is itself rigorous, mechanical reasoning that could in principle be carried out inside another formal system -- so what looked like a mind transcending mechanism may just be one mechanism reasoning about another. The exam question should ask students to take and defend a position on whether the MU-puzzle demonstrates anything about minds that a regress of meta-systems does not equally explain, and to say what would have to be true of human reasoning for "jumping out of the system" to be more than a change of level within formal reasoning generally. Along with the question, provide (a) a model answer of roughly the length a strong student could produce in the time allowed, and (b) a marking scheme that names the specific moves a top answer must make -- including correctly stating the invariant argument and why it is meta-level, distinguishing "the system cannot derive MU" from "the system cannot know that it cannot derive MU," and addressing the regress/meta