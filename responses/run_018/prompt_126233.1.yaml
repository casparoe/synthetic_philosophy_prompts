answer: |-
  Your objection mistakes necessary rigor for gerrymandering. My reference class—continental hegemons facing *simultaneous* demographic contraction and disruptive labor substitution—is bounded precisely because scale and concurrent stressors create irreducible systemic pressures that smaller maritime polities (e.g., Venice, the Dutch Republic) or less complex federations inherently avoided. Reserve-currency empires with vast territorial administration face *multiplier effects* when workforce collapse coincides with economic core disruption; smaller entities could adapt via niche specialization or managed decline without triggering system-wide cascades. Including them would dilute the class with fundamentally dissimilar survival mechanisms.  

  Dismissing adaptability narratives isn't methodological bias—it's enforcing empirical discipline. Every collapsed hegemon in my reference class had elites who believed in their institutions' unique resilience (see: Qing China's self-strengthening movement or late Soviet techno-optimism). These "inside-view" convictions proved catastrophic forecasting errors because *no polity in history* has solved the dual constraint of inverted population pyramids and AI-driven labor obsolescence at scale. Until your liberal hegemon demonstrates an unprecedented escape *within the data*, the base rate remains binding. Constitutional longevity merely proves adaptation to *past* stressors; it doesn't override the actuarial reality that 0% of comparable entities survived this specific combinatorial shock.  

