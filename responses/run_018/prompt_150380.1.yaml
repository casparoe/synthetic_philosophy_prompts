  We are designing a classroom activity to simulate the "user illusion" of consciousness.
   The class is split into 4 groups: 
     1. Sensory Input Group
     2. Predictive Model Group
     3. Language/Reporting Group
     4. Executive Decision Group

   Each group gets "raw world-cards" that are contradictory, but they cannot show the raw data. 
   They must communicate via compressed "interface reports" (one sentence only). 
   The goal is to reach a consensus on a unified "experience report" and defend it. 
   The reward is for coherence (not accuracy) - a token point for the group whose report sounds most unified.

   After the consensus, we reveal the hidden contradictions (the raw data) that were erased to make agreement possible.

   Debrief: Map the activity to the consciousness as user illusion theory.

   Predictable failure: Someone might peek at another group's raw cards or try to share more than one sentence.

   Uncapturable feature: Qualia or first-person irreducibility.

   Let's design the activity step by step.

   Activity Title: "The Compression Game: Building the User Illusion"

   Setting: Philosophy of Mind seminar (18 people, 90 mins)

   Steps:

   1. Setup (10 mins)
      - Split the class into 4 groups (ideally 4-5 per group). Assign roles:
          Group 1: Sensory Input (they get raw sensory data, e.g., blurry image, ambiguous sound, etc.)
          Group 2: Predictive Model (they get memory traces or predictions that might not match the sensory data)
          Group 3: Language/Reporting (they get labels or concepts that might be mismatched)
          Group 4: Executive Decision (they get goals or actions that might bias the interpretation)

      - Give each group a set of "raw world-cards" that are designed to be contradictory. 
        Example scenario: The class is "experiencing" a moment in a park.

          Sensory Input Group cards might say:
            - "Visual: Blurry shape, green and brown, moving slowly."
            - "Auditory: Rustling sound, medium volume, from above."

          Predictive Model Group cards might say:
            - "Memory: Squirrels often in parks, move in trees."
            - "Prediction: If it's a squirrel, it will jump to next tree."

          Language/Reporting Group cards might say:
            - "Label: 'Squirrel'"
            - "Concept: 'Animal'"

          Executive Decision Group cards might say:
            - "Goal: Find a bench to sit on."
            - "Action: Walk toward the green area."

        But note: we want contradictions. So maybe:
            - Sensory Input also has: "Olfactory: Smell of wet dog" (but no dog in sight) 
            - Predictive Model has: "Memory: Last time in park, saw a dog chasing a squirrel" (so they might expect a dog)
            - Language has: "Label: 'Tree'" (but also a label for 'dog' that doesn't match the sensory input)
            - Executive has: "Goal: Avoid dogs because of allergy"

      - Rules of communication: 
          - Groups can only communicate by sending one-sentence "interface reports" to the whole class. 
          - They cannot show their raw cards to anyone. 
          - They can only send one report at a time, and they take turns (order: Sensory, Predictive, Language, Executive, then repeat until consensus).

   2. Game Play (30 mins)
      - The goal: Each group must contribute to building a unified one-sentence "experience report" that the whole class agrees on. 
      - The groups take turns sending one-sentence reports. They can build on previous reports but must compress their raw data into one sentence.
      - After a few rounds, the class must come up with a final unified report (one sentence) that everyone can defend.

      Example of play:
          Round 1:
            Sensory: "I see a green, moving shape in the trees."
            Predictive: "I expect it to jump because it's a squirrel."
            Language: "That's an animal, specifically a squirrel."
            Executive: "I'm walking toward the trees to get a better look."

          Round 2: (if needed, they can adjust based on previous reports, but still one sentence per group)
            Sensory: "The shape is now still, and I hear rustling above."
            Predictive: "Squirrels often freeze when they sense humans."
            Language: "The animal is hiding."
            Executive: "I stop walking to not scare it."

      - Then they negotiate to form one unified report: "I see a squirrel freezing in the tree as I approach, so I stop to watch it."

   3. Consensus and Defense (10 mins)
      - Each group nominates a speaker to defend the unified report. The class then votes (by show of hands) for the group that they think contributed most to the coherence of the report. That group gets a token point (e.g., a sticker or just bragging rights). The reward is for coherence, not accuracy.

   4. Reveal (10 mins)
      - The facilitator (you) reveals the raw world-cards that each group had, showing the contradictions that were ignored or smoothed over. For example:
          - Sensory had a "wet dog smell" that never made it into the report.
          - Predictive had a memory of a dog chasing a squirrel, which might have led to an expectation of a dog, but they didn't report it because it didn't fit.
          - Language had a label for 'dog' but they went with 'squirrel' because that's what others were saying.
          - Executive had a goal to avoid dogs, but they reported stopping to watch (which is safe if it's a squirrel).

   5. Debrief (30 mins)
      - Map the activity to the theory:
          - The "interface reports" are like our conscious experience: a compressed, simplified version of the underlying processes.
          - The raw world-cards are the underlying computations and source metadata that we don't have access to in consciousness.
          - The process of reaching consensus by ignoring contradictions is like the brain's process of creating a coherent conscious experience by suppressing conflicting information.
          - The pressure to agree and the reward for coherence mimic the evolutionary pressure for a unified, actionable conscious experience.

      - Predictable failure: 
          - Someone might try to share more than one sentence or describe their raw data in detail. 
          - Someone might peek at another group's cards. 
          - The groups might get stuck because the contradictions are too big, and they can't form a coherent report.

      - Uncapturable feature: 
          - The activity cannot capture the subjective feel of qualia (what it's like to see green, or to feel the emotion of curiosity). 
          - Also, the activity is third-person (we are observing and reporting) but consciousness is first-person. The irreducibility of the first-person perspective isn't captured.

