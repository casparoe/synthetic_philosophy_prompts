  hey so im in this phil of mind seminar (18 ppl, 90 mins) and were talking about consciousness as a user illusion — not that youre fake, but that your "experience" is like a desktop icon that hides all the computation and source metadata underneath. i want an in-class game that makes people feel that compression happen, not just nod along.

