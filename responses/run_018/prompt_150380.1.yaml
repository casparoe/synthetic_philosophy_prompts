answer: |-
  ### Activity Design: "The Compression Game"

  **Setup:**  
  Split 18 students into 4 groups (4-5 per group):  
  - **Sensory Input Group:** Gets "raw" sensory cards (e.g., *"Blurry shadow moving left"*, *"Low hum at 200Hz"*).  
  - **Predictive Model Group:** Gets "expectation" cards (e.g., *"Memory: Dog barks here often"*, *"Pattern: Objects move predictably"*).  
  - **Language/Reporting Group:** Gets label cards (e.g., *"Noun: Dog"*, *"Verb: Running"*).  
  - **Executive Decision Group:** Gets action/goal cards (e.g., *"Goal: Find water"*, *"Action: Step forward"*).  

  Cards contain **hidden contradictions** (e.g., Sensory has *"Smell: Citrus"* while Language has *"Noun: Diesel engine"*).  

  **Rules:**  
  1. Groups **can’t show raw cards**—only share **one-sentence "Experience Reports"** (e.g., *"I see a dog running"*).  
  2. Rotate sharing: Sensory → Predictive → Language → Executive → repeat.  
  3. Goal: Agree on a **single unified report** (e.g., *"A dog is running toward the water"*).  
  4. **Win condition:** Groups vote on the "smoothest" report. Winning group gets a token point (e.g., sticker).  

  **Phases:**  
  1. **Negotiation (35 min):** Groups debate via compressed reports.  
  2. **Consensus & Defense (10 min):** Finalize one report, defend its coherence.  
  3. **Reveal (10 min):** Show ALL raw cards—expose hidden contradictions.  
  4. **Debrief (35 min):** Map phases to the user illusion:  

  | Phase                  | Maps to Consciousness Theory          |  
  |------------------------|---------------------------------------|  
  | Compressed reports     = Phenomenal experience (desktop icon) |  
  | Erased contradictions  = Missing source metadata (hidden code) |  
  | Coherence pressure     = Illusion of transparency |  
  | Point for "smoothness" = Evolutionary reward for unified narrative |  

  **Predictable Failure:**  
  Someone will try to "leak" raw data (e.g., whisper *"But my card says ‘citrus’!"*). Shut it down—it proves the brain’s struggle to access "raw" data!  

  **What It Can’t Capture:**  
  The **first-person "what it’s like"** (qualia). The game feels like solving a puzzle, not *being* a conscious entity.  

  ---

  ### JSON Summary:  
  ```json
  {
    "title": "The Compression Game",
    "setting": "Philosophy of mind seminar (18 people)",
    "group_size": 4,
    "duration_minutes": 90,
    "what_participants_come_away_seeing": "Consciousness as a compressed interface that hides contradictions to create coherence.",
    "core_mechanic": "Groups negotiate a unified 'experience report' using compressed sentences while hiding contradictory raw data.",
    "rules": [
      "Only share one-sentence 'interface reports'; no revealing raw cards.",
      "Win a point for the group whose report is voted 'smoothest' (not most accurate)."
    ],
    "debrief_mapping": [
      {"phase": "Compressed reports", "maps_to_idea": "Phenomenal experience (the 'desktop icon' of consciousness)"},
      {"phase": "Erased contradictions", "maps_to_idea": "Missing source metadata (hidden computations)"},
      {"phase": "Pressure for consensus", "maps_to_idea": "Transparency of the user illusion"}
    ],
    "predictable_failure": "Participants leak raw data (mimicking the brain's inability to fully access unconscious processing).",
    "uncapturable_feature": "First-person qualia (the subjective 'what it’s like' of experience)."
  }
  ```  

  Run it tight, embrace the chaos, and watch ’em gasp at the reveal. 😉
