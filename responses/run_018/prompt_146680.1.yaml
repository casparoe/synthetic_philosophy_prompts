  My worry is that (1) and (3) are pulling in different directions — Jeffrey feels unified, imaging feels like a special carve-out for conditionals. Is that a real conflict or can Jeffrey just deliver the imaging result here? Then theres what might be a hidden tension between (3) and (4): imaging redistributes inside Blue, but does that respect the chances governing the internal regiments? And is (5) actually threatened by imaging being sensitive to how you frame the antecedent? I cant tell which ones are real problems and which dissolve on inspection. Can you audit it — order the tensions by severity, say which commitment has to give if any, and what the cheapest fix costs? Please answer in British English, and feel free to be casual.
