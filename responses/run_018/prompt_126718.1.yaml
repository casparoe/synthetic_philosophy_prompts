prompt: |-
  Please help me work out the principle behind my judgments about whether the number of people in danger should determine rescue priorities, and then test it against cases I have not yet settled. Here are my verdicts, reported as concretely as I can.

  Case 1: I can reach and save either five strangers or one stranger, with equal effort and risk to me. Verdict: I am required to save the five.

  Case 2: The choice is the same in structure, except the single person is my closest friend, while the five remain strangers to me. Verdict: Saving my friend is permissible, and I am not required to save the five strangers instead.

  Case 3: I can either save one person from certain death, or take an action that independently reduces each of five other people's risk of death from 30 percent to 10 percent. The expected number of lives saved by the second option is greater than one. Verdict: I should still save the one with certainty; the dispersed probabilistic benefits to the five do not override the direct obligation to the certain victim.

  Case 4: I can save five people only by using one innocent bystander as a means—specifically, by pushing that bystander onto a mechanism that will halt the threat to the five. Verdict: This is impermissible.

  Case 5: I can save five people today, or save one person today and, with the same resources, save five different people thirty years from now. Verdict: I should save the five today, but my sense of obligation feels noticeably weaker than in Case 1, as if temporal distance dilutes the claim without eliminating it.

  The case I keep going back and forth on is this: I can save either five strangers who are each seventy-five years old with an expected ten years of remaining life, or one stranger who is twenty-five with an expected sixty years of remaining life. Sometimes I think the numbers still require saving the five; other times I think the total life-years saved point clearly to the one.

  Is there a single coherent principle—perhaps one that distinguishes direct pairwise comparison from aggregate calculation, or that introduces a threshold or weighting condition for when numbers dominate—that captures Cases 1 through 5? If no single principle can accommodate all of them, which verdict should I abandon, and what does abandoning it cost? Please also state precisely what your proposed principle predicts for two further cases: first, saving two strangers versus saving one stranger who is currently in the act of rescuing the other two; second, saving five strangers versus saving one stranger to whom I have made an explicit, unconditional promise of rescue. Answer in American English.
reasoning: |-
  Okay, the user is presenting a moral dilemma scenario where they have to decide rescue priorities based on different cases. They've provided five concrete judgments and are struggling with a sixth case involving life-years saved versus number of people. They want to know if there's a coherent principle unifying all their judgments, which verdict might need adjustment if not, and how that principle would handle two additional cases.

  Hmm, let me analyze their existing verdicts first. Case 1 shows clear utilitarian leaning toward saving more lives. Case 2 introduces personal relationship as an overriding factor. Case 3 rejects probabilistic benefits in favor of certain rescue. Case 4 establishes a deontological constraint against using people as means. Case 5 shows time-discounted utilitarianism. The unresolved case pits quantity against quality-adjusted life years.

  The tension is between three moral frameworks: utilitarianism (maximizing good), deontology (duties/constraints), and agent-relative obligations (personal ties). Their judgments aren't purely any single theory - Case 1 is utilitarian but Case 3 isn't, Case 4 is deontological but Case 2 isn't. 

  For a unifying principle, I need to find common threads. The "direct threat" distinction in Cases 3 and 4 seems crucial - they reject actions where help isn't certain or requires violating rights. Personal bonds matter only in Case 2. Temporal discounting appears in Case 5 but isn't absolute. 

  The life-years case is tricky because it forces choice between two metrics: lives and life-years. Their hesitation suggests both matter. Maybe a weighted approach? But that feels arbitrary. Alternatively, perhaps they intuitively privilege saving lives over extending them, making the five elders preferable despite fewer total years. 

  For the additional cases: The "rescuer" scenario likely triggers duty to aid the multiplier, overriding numbers. The promise case clearly creates special obligation that could outweigh numbers. Both fit their pattern of allowing non-utilitarian overrides.

  If any verdict needs rethinking, Case 3 is the weakest. Expected utility theory strongly favors reducing probabilities for multiple people. But their intuition about "direct obligation" is psychologically valid - we feel stronger duties to identifiable victims. Still, abandoning this might be intellectually consistent.

  The proposed principle should emphasize: 1) default to saving more identifiable lives when possible 2) except when requiring harmful means or violating special duties 3) with time/demographics as tiebreakers but not primary. This captures most intuitions while flagging Case 3 as the outlier needing justification.
answer: |-
  Based on your verdicts across Cases 1-5, your moral reasoning appears guided by a principle prioritizing **direct, agent-relative duties to identifiable individuals**, constrained by deontological prohibitions, with aggregate benefits acting as a tiebreaker *only* when duties are otherwise equal. This principle rejects pure utilitarianism in favor of special obligations and constraints. Here's the formal principle:

  **Proposed Principle:**  
  *You must save the greatest number of identifiable individuals facing immediate, direct threats you can address, unless:  
  (a) Saving the greater number requires violating a deontological constraint (e.g., using someone as a means),  
  (b) A special obligation (e.g., personal relationship or promise) creates a stronger duty to a specific individual, or  
  (c) The threats are not comparable in certainty or directness (e.g., probabilistic vs. certain harm).  
  When these conditions don’t apply, aggregate benefits (e.g., life-years) may break ties but cannot override direct duties or constraints.*

  ---

  ### **Application to Your Cases:**
  1.  **Case 1:** Condition (a-c) don’t apply → Save 5 strangers. *(Matches your verdict.)*  
  2.  **Case 2:** Condition (b) applies (special obligation to friend) → Saving friend is permissible. *(Matches.)*  
  3.  **Case 3:** Condition (c) applies (certain vs. probabilistic harm) → Save the certain victim. *(Matches.)*  
  4.  **Case 4:** Condition (a) applies (using bystander as a means) → Impermissible to save 5. *(Matches.)*  
  5.  **Case 5:** No conditions (a-c) apply → Save 5 today. Temporal distance weakens felt obligation but doesn’t negate duty. *(Matches your verdict, including the "dilution" intuition.)*  

  ---

  ### **The Unsettled Case:**
  - **Scenario:** Save 5 strangers (75 y/o, 10 years each; total 50 life-years) **OR** 1 stranger (25 y/o, 60 years).  
  - **Principle’s Prediction:**  
    - No deontological constraints (a), special obligations (b), or certainty disparities (c) → Default to saving more lives.  
    - **Verdict: Save the 5 elderly strangers.**  
    - *Why?* Life-years are aggregate and impersonal; your principle prioritizes direct duties to identifiable individuals. Saving 5 lives fulfills more core obligations than saving 1, even with fewer total years.  

  **Your Conflict Explained:**  
  You’re torn between the deontic force of "saving a life" (which favors the 5) and the aggregative weight of "life-years" (which favors the 1). **Your principle resolves this by rejecting aggregation as primary**, making the 5 the default choice. Abandoning this to prioritize life-years would undermine Case 3 (where you rejected probabilistic aggregation) and weaken Case 1’s focus on lives over abstract utility.

  ---

  ### **Additional Cases & Predictions:**
  1.  **Two Strangers vs. One Rescuer:**  
      - *Scenario:* Save 2 strangers **OR** save 1 stranger who is actively rescuing the other 2.  
      - **Verdict:** Save the 1 rescuer.  
      - *Why?* Condition (b) applies: The rescuer has a *multiplier effect* on survival, creating an indirect special obligation. Saving them fulfills a duty to 3 identifiable lives (the rescuer + the 2 they’ll save) vs. 2.  

  2.  **Five Strangers vs. One Promised Stranger:**  
      - *Scenario:* Save 5 strangers **OR** save 1 stranger to whom you made an explicit, unconditional promise of rescue.  
      - **Verdict:** Save the 1 promised stranger.  
      - *Why?* Condition (b) applies: A promise creates a special obligation stronger than the default duty to strangers. Violating it to save more lives treats your promise as discardable, undermining moral integrity.

  ---

  ### **If You Must Abandon a Verdict:**
  - **Weakest Link: Case 3 (Probabilistic Harm).**  
    - **Cost of Abandonment:** If you switch to saving the 5 with probabilistic benefits (expected 1.0 life saved vs. 1.0 certain), you align with utilitarianism but lose coherence with Cases 4 (anti-utilitarian constraint) and 5 (time discounting ≠ utility discounting).  
    - **Alternative Principle:** Adopt *expected utility* as primary, overriding certainty. This would require:  
      - Saving the 5 in Case 3,  
      - Possibly accepting "means" violations in Case 4 if net lives saved (which you reject),  
      - Ignoring time discounts in Case 5.  

  **Final Recommendation:** Your judgments are largely coherent under the proposed principle. **Stick with saving the 5 elderly strangers** in the unsettled case to preserve consistency with your rejection of aggregation in Cases 3 and 5. If life-years feel decisive there, you may need to soften your stance in Case 3—but this risks unraveling your constraint-based reasoning.
