prompt: |-
  ok so here's roughly where i've landed on extreme-uncertainty decision theory and i'd like to know wether it actually hangs together. (1) i reject Pascal's mugging: if my prior over the mugger's claim sits in an imprecise range near zero, no promised payoff should move me, and i dont think there's a principled sharp cutoff — thats why i favour ambiguity aversion here. (2) i one-box in Newcomb's problem, because i treat evidential correlation with the predictor's past action as rationally decisive even without a causal link going forward. (3) i think counterfactual mugging is different and i should refuse to pay once the coin has already landed, since the correlation i'm supposed to exploit is already fixed. (4) i also think rational choice shouldnt depend on when you happen to learn about a problem: wether i hear the bet before or after the flip shouldnt change my obligation, absent genuinely new information. (5) i use imprecise probabilities rather than point priors to model my ignorance in cases like (1). (6) but i dont think ambiguity aversion means i can ignore every small-risk scenario — just that astronomical payoffs dont automatically dominate.

  is this jointly tenable? the obvious worry is (3) vs (4): if timing of learning shouldnt matter, why does the coin having landed change anything? maybe thats only an apparent tension though — perhaps learning the result is genuinely new information that updates my imprecise range. there's also a less obvious tension between (2) and (1): in Newcomb correlation drives my choice despite extreme stakes, but in Pascal's mugging i dismiss correlation with the mugger's promise. and does (5) really support (1), or does it secretly undermine the idea of an epistemic floor? please audit in British English, order the tensions by severity, flag which ones dissolve on inspection, and say which single commitment is cheapest to drop if consistency requires it. dont just lecture me on generic decision theory — i want to know wether my specific package breaks.
