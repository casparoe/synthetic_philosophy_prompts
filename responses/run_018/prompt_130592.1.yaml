  Okay, let me unpack this fascinating query. The user is a novelist deeply engaged with moral decision-making under uncertainty, and they've observed a specific pattern in both their characters and their reading: agents binding themselves to choices made by morally idealized counterfactual selves. 

  First, I need to recognize the sophistication here. This isn't just about asking "what would a better version of me do?"—it's more radical. The user emphasizes that the agent doesn't believe they can become that idealized self, nor is this merely informational. The authority granted is immediate and binding, even when the virtues themselves are contested. 

  Hmm, the user explicitly rejects common frameworks like contractarianism or simple ideal-observer theories. They want to know if this exact configuration has a name, and if not, they demand a rigorous definition with clear boundaries. No bibliography—just a committed philosophical judgment. That's a tall order, but thrilling.

  Let me map the core elements: 1) Binding present self to a counterfactual choice, 2) The idealized self has moral enhancements (not just epistemic), 3) No assumption of achievability, 4) Applied even when virtues are contested. 

  I recall indirect normativity, but that usually works through rules or procedures, not a projected self. Aspirational models assume progress toward the ideal, which conflicts with the user's "no achievability" point. Ideal-observer theories often focus on knowledge, not moral transformation. 

  What's distinct here is the *sovereignty* granted to this fictional self—it's like a moral autocracy where the idealized version issues binding decrees to the flawed present self. The psychological mechanism feels almost Kierkegaardian: a leap of commitment to an authority one creates but cannot embody. 

  For naming, I consider "Counterfactual Moral Sovereignty." It captures the unilateral authority (sovereignty) and the unreal nature of the decider (counterfactual). The "binding" aspect is crucial—it's not advice but obligation. 

  Now to defend this against alternatives: Vs. consequentialism: Replaces calculation with deference. Vs. aspiration: No developmental path—just submission. Vs. epistemic correction: Actively adds contested virtues rather than removing ignorance. The "contested virtues" point is key—it admits the very virtue in question might be wrong, yet defers anyway. That's why "sovereignty" fits: it's a constituted authority, not discovered truth. 

  The user's novel context matters. This pattern likely creates rich tension—characters obeying inner oracles they don't understand. Philosophically, it might be a device to bypass akrasia or moral cowardice. I'll emphasize the immediacy of obligation; it's not "aim to become this" but "this self commands you now." 

  Final check: Does "Counterfactual Moral Sovereignty" clearly exclude neighboring concepts? Yes—sovereignty implies binding authority, counterfactual stresses unreality, and "moral" specifies the enhancement. The definition will nail down the non-aspirational, non-epistemic, procedurally indirect nature. 

  This should meet the user's demand for a committed, boundary-policed position. No hedging.
answer: |-
  Your observed pattern—**binding present agency to the choice of a morally idealized, counterfactual self**—is philosophically distinct and deserves a precise designation. I propose the term:  

  ### **Counterfactual Moral Sovereignty (CMS)**  
  *Definition*: A normative structure wherein an agent treats the hypothetical decision of a *deliberately constructed counterfactual self*—endowed with specific moral virtues (e.g., impartiality, courage) that the agent currently lacks, and operating under conditions of perfect information and emotional detachment—as an *immediately binding obligation*, irrespective of whether:  
  (a) the idealized self is realistically attainable,  
  (b) the prescribed virtues are objectively justified, or  
  (c) the agent’s present interests align with the outcome.  

  #### **Boundary Conditions**  
  1. **Non-Aspirational Binding**: CMS is not a self-improvement strategy. The agent does not aim to *become* the idealized self; she submits to its authority *despite* her incapacity to achieve it.  
  2. **Moral (Not Epistemic) Idealization**: The counterfactual self is augmented with *moral virtues* (e.g., radical impartiality) absent in the agent’s current state, distinguishing it from purely epistemic idealizations (e.g., an "ideal observer" who merely knows more).  
  3. **Immediate Obligation**: The idealized choice overrides present preferences without negotiation. It functions as a sovereign command, not a deliberative input.  
  4. **Virtue Contingency**: CMS operates even when the virtues embedded in the idealization are contextually contested (e.g., demanding loyalty when impartiality seems required).  

  ---

  ### **Defending CMS Against Alternatives**  
  **1. Vs. Indirect Normativity**  
  Indirect normativity (e.g., rule-utilitarianism, Kantian maxims) derives obligations from generalized rules or procedures. **CMS rejects mediation by rules**: the idealized self’s *singular decision* directly binds the agent. It is *personalized* sovereignty—not "What would a rational agent do?" but "What would *I-as-moral-paragon* demand of *me-as-flawed-agent*?"  

  **2. Vs. Aspirational Self-Improvement**  
  Aspirational models (e.g., Aristotelian virtue ethics) frame ideals as targets for gradual development. **CMS is non-developmental**: the idealized self is a fictive sovereign, not a future state. The physician who obeys her fearless counterpart’s verdict ("reject the harmful treatment") does so while *still feeling fear* and expecting no moral growth.  

  **3. Vs. Rational Reconstruction (Epistemic Correction)**  
  Theories like Rawlsian reflective equilibrium or Harsanyi’s impartial observer correct ignorance or bias but leave core values intact. **CMS imposes alien virtues**: if the agent is partial, her impartial counterpart’s choice binds her *precisely because* it contradicts her actual values. It is value-substitution, not error-correction.  

  **4. Vs. Contractarianism/Hypothetical Agreement**  
  Contractarianism (e.g., Scanlon, Rawls) derives obligations from mutual agreement among equals under fairness constraints. **CMS is hierarchical and non-reciprocal**: the idealized self unilaterally dictates to the present self. No negotiation or mutual recognition occurs.  

  **5. Vs. Consequentialist Calculation**  
  Direct consequentialism weighs outcomes from the agent’s current perspective. **CMS severs agency from consequences**: the citizen who sacrifices welfare for strangers does so because her virtuous counterpart commands it—*even if* she cannot justify the act through her own utilitarian calculus.  

  ---

  ### **Why "Sovereignty"?**  
  The term captures the *unquestioned authority* the agent grants to the counterfactual self. Like a sovereign, the idealized self:  
  - Issues decrees (binding choices),  
  - Derives legitimacy from constructed virtue (not consent or reason),  
  - Demands submission irrespective of the subject’s interests.  

  This is not a rhetorical device but a *psychological mechanism for moral enforcement*. The agent creates an internal sovereign to compel action when her own will is compromised by fear, bias, or attachment. CMS is tragic: the agent knowingly acts against her interests, not for a greater good she perceives, but because her self-constructed god demands it.  

  ### **Conclusion**  
  **Counterfactual Moral Sovereignty** is a distinct form of normative reasoning where morality is outsourced to a fictive, virtuous self whose dictates bind the actual self unconditionally. It emerges under radical uncertainty to resolve conflicts between local attachments and inchoate ideals—not through reason, but through self-imposed authority. In your novel, this pattern likely exposes the fragility of moral agency: characters surrender to phantoms of their own making because they cannot trust their fractured selves. CMS is the shadow of virtue ethics in a disillusioned age.
