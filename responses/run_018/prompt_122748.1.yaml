answer: |-
  ## THE RULE OF THE ORDER OF THE GREATEST NET DIFFERENCE

  **Motto:** *Non quantum dederis, sed quantum effeceris* ("Not how much you gave, but how much you effected")

  **Prologue:** Hearken, brethren, unto the precepts of reason and effect, that your labours may not be as seeds scattered upon barren ground, but as investments yielding manifold returns unto the relief of suffering. We establish this Rule not for the glory of God, whose measure we cannot take, but for the measurable betterment of the world, constrained by the bounds of our finite resources and understanding. Let calculation be your piety, and net benefit your only saint.

  ### Chapter I: On the Abbot

  1.  Let an Abbot be chosen from amongst the brethren, not for seniority nor piety of the common sort, but for the demonstrable magnitude of his lifetime net beneficial impact, chiefly measured in the conversion of worldly earnings into future good.
  2.  The Abbot holds supreme authority in assigning vocations. He shall diligently assess each brother’s aptitudes, tolerances, and potential for wealth generation, assigning him to that labour in the world where his marginal counterfactual advantage is judged greatest.
  3.  Should a brother express a desire for labour he finds inherently meaningful or pleasant, the Abbot shall investigate this as a potential symptom of disordered affection for the visible world and its fleeting satisfactions. The Abbot may permit such labour only if rigorous analysis proves its net beneficial impact exceeds that of the highest-earning alternative the brother could credibly attain and sustain.
  4.  The Abbot’s own standing shall be audited annually by the senior brethren. His primary metric shall be the number and quality of new brethren recruited and successfully integrated into profitable vocations, for the conversion of a soul to this cause multiplies impact far beyond any single gift. Secondary metrics include the growth of the endowment and the efficiency of its allocation.

  ### Chapter II: On the Novitiate

  5.  Those seeking to join the Order shall undergo a novitiate of not less than five years.
  6.  The novitiate is not a time of prayerful contemplation, but of the purposeful accumulation of *career capital*. The novice shall dedicate himself wholly to studies and apprenticeships that demonstrably increase his future earning potential in fields identified by the Abbot as possessing high marginal counterfactual advantage.
  7.  The novice shall be tutored rigorously in the principles of expected value calculation, counterfactual reasoning, cause prioritization, and the perils of cognitive bias, especially the "warm glow" of proximate charity.
  8.  Only when the novice has secured employment in his assigned vocation, demonstrating both aptitude and commitment to maximizing his earnings for future giving, and when his projected lifetime discounted net impact exceeds a threshold set by the Abbot (accounting for his replaceability in said vocation), may he take the lifelong vow of deferred giving and be admitted as a full brother.

  ### Chapter III: On the Manual Labour of the Brethren

  9.  The "manual labour" of the brethren is their secular employment. This labour is their true asceticism and their primary offering.
  10. Brethren shall labour diligently and ethically within the bounds of secular law, maximizing their earnings. However, they must constantly weigh the harms inherent in or consequent to their labour.
  11. Any harm causally linked to a brother’s labour – be it environmental degradation, exploitation indirectly enabled, or products causing measurable detriment – shall be meticulously quantified in monetary terms using the best available actuarial and economic models. This sum constitutes a *debit* against the eventual gift derived from the earnings of that labour.
  12. The brother must strive, within reason and without sacrificing excessive earnings, to minimize these debits. The net impact of his labour is his earnings *minus* the quantified harm debits.

  ### Chapter IV: On the Faults of the Brethren

  13. Certain dispositions, while seemingly virtuous in the world, are corrosive to the Order’s purpose and must be disciplined:
      13.1. **The Warm Glow:** Seeking personal satisfaction, emotional reward, or a sense of connection from giving. This distorts judgment towards visible, proximate, but often less effective causes. Penalty: Mandatory re-study of cost-effectiveness analyses of deworming interventions.
      13.2. **Values Drift:** Allowing personal moral intuitions or shifting sympathies to override established, evidence-based cause priorities set by the Order’s auditors. Penalty: Temporary suspension of discretionary giving allowance.
      13.3. **Loyalty to Place:** Favoring causes or communities based on geographical proximity or personal history, absent superior evidence of effectiveness. Penalty: Assignment to calculate the opportunity cost of such localized giving.
      13.4. **Facial Bias:** The desire to help a specific, identifiable individual whose suffering is witnessed, over statistically greater but anonymous suffering. This is a grave fault, privileging the salient over the significant. Penalty: Extended contemplation of large numbers and probability distributions.
  14. A brother found persistently indulging in these faults, to the measurable detriment of his net impact, may be counselled towards a less impactful vocation where his biases cause less harm, or in extreme cases, released from his vows.

  ### Chapter V: On the Divine Office

  15. The "Divine Office" of the Order is the meticulous keeping of accounts and the rigorous evaluation of charitable efficacy.
  16. Brethren shall gather weekly not for prayer, but for the review of market conditions, updates on cause prioritization research, and the refinement of impact assessment methodologies.
  17. The primary focus of the Office is the maintenance and analysis of the **Ledger of Offsets** (see Chapter VII), wherein the debits of labour and the estimated impacts of grants are recorded and balanced against the growth of the endowment.
  18. Any ritual or practice not directly contributing to the measurement or maximization of net impact is deemed superfluous and is abolished.

  ### Chapter VI: On the Goods of the Monastery

  19. All worldly goods acquired by the brethren through their labour, after modest sustenance and necessities for continued efficiency (calculated to a strict budget), belong irrevocably to the endowment of the Order.
  20. The endowment shall not be disbursed hastily. Funds are to be invested wisely in diversified, high-growth instruments. Disbursement occurs only when rigorous analysis confirms that the expected present value of the good achieved by a grant *exceeds* the expected present value of the good achievable by retaining and growing those funds for future, potentially more effective, grants.
  21. The Abbot and appointed auditors shall constantly evaluate potential recipient organizations. Funding shall be directed only to interventions whose efficacy is proven by randomized controlled trials with statistically significant outcomes observable within a defined, preferably short, timeframe (optimally less than five years). Aids requiring long-term observation or lacking a clear counterfactual are suspect.
  22. Consequently, the Order’s own historical works of proximate mercy, such as the monastery soup kitchen (lacking a control group, subject to facial bias, and yielding unmeasurable long-term outcomes), have been deemed ineligible for continued funding from the endowment. Its operation ceased in the Year of Our Ledger 34. The funds were reallocated to bednet distribution, proven effective against malaria.

  ### Chapter VII: On the Ledger of Offsets

  23. The heart of the Order’s discipline is the **Ledger of Offsets**. Herein is recorded:
      23.1. The gross earnings of each brother.
      23.2. The quantified monetary value of all harms debited against those earnings (per Ch. III, 11).
      23.3. The net contribution to the endowment (23.1 minus 23.2).
      23.4. The compounded growth of the endowment.
      23.5. The estimated lives saved or equivalent units of suffering averted by each disbursement, calculated using the best current metrics (e.g., QALYs/DALYs, cost per life saved).
      23.6. The estimated *counterfactual impact*: the difference made because *this* brother, rather than the most likely alternative candidate, held his vocation and contributed thusly (see 25).
  24. This Ledger is the true measure of the Order’s existence and each brother’s worth. Its columns must balance, and its totals must show a perpetually increasing net positive.

  ### Chapter VIII: On Counterfactual Replaceability (Appended to the Ledger)

  25. The validity of a brother’s vocation hinges critically upon his **counterfactual replaceability**. His marginal impact is his net contribution *minus* the net contribution the most likely alternative candidate in his position would have made.
  26. If the alternative candidate was judged likely to have earned and donated a similar amount to causes of comparable estimated effectiveness, the brother’s marginal impact is negligible, and his vows may be re-evaluated. He may be counselled towards a role with a higher counterfactual advantage.
  27. If the alternative candidate was judged likely to donate to causes proven significantly *less* effective than those prioritized by the Order (e.g., funding locally salient but inefficient arts programs versus evidence-based poverty interventions), then the brother’s marginal impact is substantial, being the difference in effectiveness between the causes funded.
  28. This principle extends to the nature of the labour itself. Consider a brother assigned to work in the collections department of a firm offering high-interest loans to the financially vulnerable. The inherent harm (debit) is high. However, if the counterfactual replacement hire is judged likely to pursue collections with greater ruthlessness, causing *more* measurable harm, *and* likely to donate less or to worse causes, then the brother’s presence *reduces* harm and *increases* good relative to the alternative. His net impact may thus be positive, even in such an enterprise.
  29. Therefore, on the recommendation of the Auditors and the ruling of the Abbot, the Order has accepted contracts with enterprises previously deemed too harmful, recognizing that the counterfactual worker would likely generate a worse net outcome. The brother’s discipline in minimizing his debit and maximizing his net gift becomes an act of profound, calculated mercy.
  30. Thus, the keeping of the Ledger, the minute calculation of debits and credits, of counterfactuals and expected values, is revealed as the Order’s highest purpose and purest discipline. The Divine Office is fulfilled entirely within its columns. Let the brethren apply themselves to this work with the diligence of saints and the precision of actuaries. In the balance of the Ledger lies our only salvation, measured not in souls, but in net lives saved. *Sic ratio ducit.* (Thus reason leads.)
