answer: |-
  ### Electoral System Decision Tree Handout  
  **Instructions:** Answer each question in order. Follow the path based on your answers to discover your electoral system priorities. Only at the end will you see common labels.  

  ---

  **1. Should a group winning 49% of the vote in a district *always* elect at least one representative from that district?**  
  - **YES** → Go to Question 2A.  
  - **NO** → Go to Question 2B.  

  ---

  **2A. (If YES)** Should the legislature mirror the national vote share, even if governing coalitions form *after* elections?  
  - **YES** → **Proportional Representation (PR)**.  
    *Awkward commitment:* Accepts that local representatives may lack direct accountability to voters.  
  - **NO** → **Single Transferable Vote (STV)**.  
    *Awkward commitment:* Tolerates complex ballots (ranking candidates) to preserve district-level fairness.  

  **2B. (If NO)** Is the ability to vote out a specific local incumbent nonnegotiable, even if it distorts seat–vote proportionality?  
  - **YES** → **First-Past-the-Post (FPTP)**.  
    *Awkward commitment:* Defends "manufactured majorities" (e.g., a party winning 55% seats with 40% votes).  
  - **NO** → Go to Question 3.  

  ---

  **3. Which risk is worse?**  
  - **A legislature where coalitions constantly negotiate, delaying decisions?** → **Mixed-Member Proportional (MMP)**.  
    *Awkward commitment:* Embraces post-election bargaining to ensure every vote counts nationally.  
  - **A legislature where parties win artificial majorities against popular will?** → **Parallel Voting**.  
    *Awkward commitment:* Sacrifices national proportionality for simpler local accountability.  

  ---

  #### Unoccupied Combinations & Notes  
  - **"NO to 49% representation + NO to local accountability + prefers simplicity"** → **Underexplored**.  
    *Diagnosis:* Most systems prioritize either simplicity or proportionality; this hybrid is rare.  
  - **"YES to 49% representation + NO to national vote mirror"** → Covered by STV.  
  - **"NO to 49% representation + YES to post-election coalitions"** → **Incoherent**.  
    *Diagnosis:* Rejecting local representation while demanding national fairness creates tension.  

  ---

  **Verdict:** Your core priority is whether representation should be tied to **geography**, **party**, or **direct voter power**.
