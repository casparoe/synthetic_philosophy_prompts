  We are designing a decision tree to help students discover their preferred electoral system based on their commitments. The tree will branch on key questions that do not require prior knowledge of the debates. The goal is to avoid the premature labeling of positions and instead build up to a position from fundamental principles.

   The tree will have the following structure:

