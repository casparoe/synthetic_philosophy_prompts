      - If NO: This leads towards single-member district systems (like FPTP) or systems that might allow for such outcomes.

   2. Then, depending on the answer, we branch further:

   For the YES branch (49% should get representation in the district):
      - Question 2: Should the national legislature mirror the overall vote share of parties (even if it means coalitions form after the election)?
