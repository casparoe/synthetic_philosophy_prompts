  The sticky table held two empty pint glasses and a half-eaten packet of crisps. Rain lashed the pub window as Liam, glasses smudged, gestured wildly. "No, Anya, *listen*! Malthus's arithmetic *wasn't* wrong. It just... hadn't met its boundary condition yet! Like a function waiting for the right input!"

  Anya rubbed her temples. "Liam, it's been two hundred years of being empirically dead. Two. Centuries. The population exploded *past* his 'geometric' doom curve *thanks* to Haber-Bosch nitrogen fixation. His core prediction – mass starvation from population outstripping food – failed. Spectacularly. Repeatedly. That's textbook falsification."

  "But *is* it?" Liam leaned in, eyes gleaming with the fervour of the terminally sleep-deprived. "What if the Haber-Bosch process wasn't a refutation, but just... a temporary variable shift? A giant, century-long fudge factor in the equation? Now we're hitting peak phosphorus, energy costs are soaring, soil degradation... the 'synthetic fertilizer' parameter is approaching zero! *Now* the arithmetic bites! Malthus wasn't *wrong*, he was just... *prematurely correct*! His error bars were just... cosmically wide."

  Anya stared into her near-empty glass. "So, being consistently, demonstrably incorrect for two hundred years... that's just part of the model's inherent, uh, *longitudinal uncertainty*? We redefine 'wrong' as 'waiting for the necessary global catastrophe'?"

  "Exactly!" Liam slammed his palm on the table, rattling the glasses. "The theory wasn't falsified, it was merely... temporally displaced! The long run *is* the run! We just needed to wait for the exogenous shock to reset the initial conditions and let the fundamentals play out!"

  Anya sighed, the sound heavy with the weight of grant applications and unanswered emails. She picked up her glass for the final, lukewarm sip. "Right. So the difference between being profoundly mistaken and prophetically early is just a matter of how long you're willing to hold your breath... and how many generations you're happy to write off as statistical noise."

  **The final line:** "In the long run, we're all falsified... unless the long run gets long enough."
