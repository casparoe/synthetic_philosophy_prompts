prompt: |-
  I'm running a 90-min workshop for heritage-studies grad students who haven't done much philosophy. Topic is Nietzsche's three uses and disadvantages of history for life — monumental, antiquarian, critical — but I don't want them to just list them. Don't explain the essay to me; plan how I'd teach it. What's the right dependancy order: which mode has to land first so the other two don't collapse into just 'good history vs bad history'? I want one carrying example that runs through the whole session — I'm debating between the restoration of a decommissioned power plant and the digital archiving of a defunct social network — tell me which one actually works and why the other breaks. Then the misconception map: I figure they'll take 'critical history' to mean being politically critical in the modern sense, 'antiquarian' as pure nostalgia, and 'monumental' as just propaganda. Say exactly where in the sequence I should head off each one. Finish with one check-for-understanding question that forces them to run all three modes on a new scenario — say a city council debating whether to demolish an old factory — and describe what a correct vs. wrong answer looks like. Keep it practical, no bibliography or further readings, and don't ask me to cite specific page numbers.
reasoning: |-
  Okay, the user is planning a 90-minute workshop for heritage studies grad students on Nietzsche's three modes of history. They want a practical teaching plan without theoretical explanations. Let me start by understanding their key concerns.

  First, they want to avoid students reducing the three modes to just "good vs. bad history." The dependency order is crucial here. Which mode should be taught first to prevent that oversimplification? Monumental might be tricky because students might see it as propaganda. Antiquarian could be mistaken for mere nostalgia. Critical history might be conflated with modern political criticism. So, the sequence needs to address these misconceptions as they come up.

  The user provides two potential running examples: restoring a decommissioned power plant or digitally archiving a defunct social network. I need to evaluate which works better. The power plant example has tangible, physical aspects and multiple interpretations. Students can visualize the restoration, preservation, or demolition. The social media example might be too abstract; digital archives are less tactile, and the monumental aspect (inspiration) could be harder to grasp. Also, nostalgia (antiquarian) for social media is more personal and less communal, making it weaker for illustrating Nietzsche's points. The power plant example is more versatile for showing all three modes effectively.

  Next, the misconception map. Students will likely misinterpret critical history as political criticism. Antiquarian as pure nostalgia, and monumental as propaganda. The sequence should address each when introducing the respective mode. For antiquarian, emphasize its role in identity-building, not just sentimentality. For monumental, clarify it's about inspiration, not manipulation. For critical, stress the need to break from the past for current life, not just political critique.

  The dependency order: Start with antiquarian. It's the most accessible since heritage students deal with preservation. Then critical, to show the necessity of dismantling the past. End with monumental to demonstrate selective inspiration. This order prevents seeing them as a hierarchy and instead as interconnected modes.

  For the check-for-understanding, use the old factory demolition scenario. Ask students to apply all three modes. A correct answer would integrate each mode's purpose without ranking them. A wrong answer would treat them as mutually exclusive or value judgments.

  Timing: 90 minutes. Allocate introduction (10 min), antiquarian (20 min), critical (20 min), monumental (20 min), application (15 min), wrap-up (5 min). Use the power plant example throughout with specific prompts for each section.

  Materials needed: slides, handouts with key quotes, sticky notes for group work. Emphasize discussion and real-time feedback to keep students engaged. The wrap-up should reinforce that all three modes are necessary and context-dependent.

  Overall, the user's deeper needs include making abstract philosophy tangible for heritage students, avoiding simplistic binaries, and providing practical tools for their work. The plan should bridge theory and application, using relatable examples and interactive elements to solidify understanding.
answer: |-
  Here’s a practical, misconception-proof workshop plan focused on dependency order, a resilient running example, and targeted clarification points. Goal: Show students how Nietzsche’s modes are *interdependent tools*, not a grading system for "good/bad" history.

  **Core Structure: Dependency Order**  
  *(Crucial to avoid "good vs bad" collapse)*  
  **Start with Antiquarian → Then Critical → End with Monumental**  
  *Why this order?*  
  1. **Antiquarian first:** Heritage students instinctively "get" preservation/connection. Starting here validates their intuition, making Nietzsche feel relevant, not alien.  
  2. **Critical next:** Shows preservation *isn't enough*. It prevents antiquarian from seeming like the "good default." Critical needs antiquarian's material to work *on*.  
  3. **Monumental last:** Reveals how inspiration *requires* both preservation (antiquarian) *and* selective destruction/forgetting (critical). If taught first, monumental easily collapses into "propaganda."  

  **The Carrying Example: RESTORING THE DECOMMISSIONED POWER PLANT**  
  *Why it WORKS (and why the social network fails):*  
  - **Tangible & Multi-Layered:** Physical site allows clear visualization of preservation (antiquarian), demolition/adaptive reuse (critical), and inspirational repurposing (monumental).  
  - **Antiquarian Strength:** Obvious "roots," material heritage, community identity (e.g., workers' history, industrial pride).  
  - **Critical Strength:** Clear "burden" (toxic legacy, obsolescence, regeneration *needs* demolition or radical change).  
  - **Monumental Strength:** Concrete potential for inspiration (e.g., renewable energy hub, arts center symbolizing transition).  
  *Why SOCIAL NETWORK ARCHIVING FAILS:*  
  - **Lacks Monumental Weight:** Digital nostalgia (antiquarian) is strong; ethical/data deletion (critical) is possible; but "inspiration for future life" is abstract and weak ("Let this dead platform inspire you!" feels hollow).  
  - **Antiquarian Feels Fragile:** Digital preservation is technical, less tactile. Monumental inspiration risks seeming forced.  
  - **Critical is Muddled:** Deleting data vs. preserving for study? Less visceral than bulldozing a factory.  

  **Workshop Flow (90 Mins)**  

  **1. Intro (10 mins):**  
  - Frame: "Nietzsche asks: How does the past HELP or HINDER living *now*? Not 'what is true history?'"  
  - Power Plant Intro: Show image. Pose: "This shaped our city, now it's obsolete. What do we *do* with it?"  

  **2. Antiquarian History (20 mins):**  
  - **Activity:** Groups list reasons to *preserve/archive* the plant intact (e.g., "Worker stories matter," "Architecture is unique," "It's *our* industrial DNA").  
  - **Define:** Antiquarian = "This past is *mine/my community's*; preserving it nurtures my sense of belonging/identity."  
  - **Head off Misconception (Here & Now):** "Nietzsche isn't *just* mocking nostalgia. It's vital! But ask: What if preserving *everything* stops us changing? What if the 'roots' start smothering new growth?" (Plant Analogy: Roots are essential, but a pot-bound plant dies).  

  **3. Critical History (20 mins):**  
  - **Activity:** Groups list reasons to *demolish or radically transform* parts of the plant (e.g., "It's contaminated," "The jobs are gone, clinging is false," "We need housing, not a shrine to pollution").  
  - **Define:** Critical = "This past is a *burden*; I must break it to free my present/future. Judging and *destroying* parts of it is necessary for life."  
  - **Head off Misconception (Here & Now):** "This ISN'T 'being politically critical' in the activist sense! It's deeper: What past *must* we break from, even if it hurts, to live well *now*? It's surgery, not protest. Nietzsche fears we won't have the strength to do this *because* of antiquarian love."  

  **4. Monumental History (20 mins):**  
  - **Activity:** Groups brainstorm how the plant site could be *repurposed* to *inspire future action* (e.g., "Renewable energy lab showing transition," "Monument to resilience with worker stories"). Emphasize: It uses *fragments* (not whole preservation) for *future* drive.  
  - **Define:** Monumental = "I selectively grab inspiring fragments of the past to fuel action and possibility *now*."  
  - **Head off Misconception (Here & Now):** "This ISN'T propaganda! Propaganda *hides* complexity to control. Monumental *acknowledges* the past is messy but says: 'Here’s a spark from it to ignite *us*.' It *needs* critical destruction to find those sparks."  

  **5. Synthesis & Interdependence (10 mins):**  
  - **Power Plant Recap:**  
    - *Without Antiquarian:* No material/identity to work with ("Why save it at all?").  
    - *Without Critical:* Preservation stifles (toxic museum nobody visits).  
    - *Without Monumental:* Preservation/destruction lack *direction* ("Why bother changing it?").  
  - **Key Point:** The "disadvantage" hits when ONE mode dominates and crushes the others. Health is DYNAMIC TENSION between all three.  

  **6. Check-for-Understanding (10 mins):**  
  - **Scenario:** "A city council debates demolishing a 1920s textile factory (structurally sound, but empty) for a new transit hub. Apply Nietzsche's *three modes*. What arguments might arise from *each* perspective?"  
  - **Correct Answer Looks Like:**  
    - *Antiquarian:* "This factory built our town! Preserve the facade/archives – it's our heritage!" (Identity)  
    - *Critical:* "It's a monument to exploitation/pollution. Demolish it fully – we need to move forward, not romanticize!" (Breaking Burden)  
    - *Monumental:* "Integrate the iconic chimney into the transit hub design – let it symbolize our industrial past fueling modern connection." (Selective Inspiration)  
    - *Bonus:* "A healthy debate would involve tension between these, not just picking one."  
  - **Wrong Answer Looks Like:**  
    - Lists the modes but assigns them moral value ("Antiquarian = bad nostalgia," "Critical = good progress").  
    - Treats them as mutually exclusive choices ("The council should pick critical mode").  
    - Reduces monumental to "making it pretty" or propaganda ("Put a plaque up calling it progress").  
    - Misses the *action/need* element ("Antiquarian is about studying old looms").  

  **Materials:**  
  - Slides with power plant images (past glory, decay, potential futures).  
  - Handout: Simple definitions of each mode *in Nietzsche's life-centered terms* (not academic jargon).  
  - Sticky notes/pens for group activities.  

  **Why this works for Heritage Students:**  
  - Starts where they live (preservation/identity).  
  - Uses a physically tangible heritage example.  
  - Makes philosophy a *tool* for their practice ("How do I balance these tensions?").  
  - Actively dismantles predictable misconceptions at the point they're likely to arise.  
  - Final check forces application, not regurgitation.
