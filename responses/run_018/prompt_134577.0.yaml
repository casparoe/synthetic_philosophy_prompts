prompt: |-
  You are a professional philosopher of mind with expertise in evolutionary cognitive taxonomy and a practiced hand at deadpan bureaucratic satire. Before drafting, take a few minutes to brainstorm which structural features of Daniel Dennett’s four creature-types—Darwinian (hard-wired innate behavior without learning), Skinnerian (trial-and-error reinforcement learning without internal modeling), Popperian (internal hypothesis generation and counterfactual testing, “letting hypotheses die in one’s stead”), and Gregorian (language- and culture-dependent reasoning with symbolic inheritance)—are most vulnerable to reductive organizational misapplication, and identify precisely how Clark and Chalmers’s extended mind thesis can be injected as a misapplied fifth “Extended Gregorian” category without breaking the taxonomy’s internal logic.

  Write a sustained satirical parody in the form of an internal corporate memorandum—approximately 700 words, titled “Directive 2024-MIND: Revised Cognitive Taxonomy for Talent Allocation, Workspace Design, and Symbolic Offloading”—issued by the fictional “Office of Ontological Personnel” at a multinational consulting firm that has adopted Dennett’s framework as official HR doctrine. The venue is deadpan bureaucratic prose: numbered policy sections, formal sign-offs, sidebar boxes, and invented titles (e.g., “Dr. Helena Voss, Chief Ontological Officer”). The satire’s target is the practice of applying evolutionary-psychological taxonomies to workplace hierarchy and the implicit normative claim that Gregorian cognition alone merits strategic authority. Accurately describe each category in technically correct philosophical language—Darwinian staff execute only pre-programmed protocols with no feedback loops; Skinnerians learn solely through variable-ratio reinforcement and cannot hold counterfactual models; Popperians run internal simulations and may reject hypotheses before external trial but are forbidden to speak until a model dies; Gregorian staff depend on linguistic and cultural scaffolding for reasoning—then assign them absurd organizational roles: Darwinian pods for rote data entry with zero feedback, Skinnerian “reinforcement zones” with snack-dispensing schedules, Popperian silent “pre-meeting simulation rooms,” and Gregorian strategic leadership with tax privileges. Push each feature to a reductio: the memo should argue that because Gregorian cognition is essentially outsourced to culture, any Gregorian using notebooks, cloud databases, or AI assistants has partially “offloaded” their taxonomy status and therefore faces adjusted promotion eligibility or altered tax brackets. Keep the tone consistently deadpan—no winking, no “obviously absurd” signals, no breaking of character—so that the reader recognizes the satire only through the logic’s extremity.

  Include, within the memo’s own voice, a brief quoted objection from a fictional “Senior Skinnerian Union Representative” or “Popperian Ethics Compliance Officer,” phrased in labor-rights vocabulary translated into the taxonomy’s terms, complaining that evolutionary origin is being conflated with current task competence and that the salary bands constitute covert cognitive discrimination; the memo should answer it within its own deadpan framework (e.g., “Competence is defined by evolutionary tier, not by task performance”). Make the piece readable to someone unfamiliar with Dennett—define the four terms in the text itself—while including enough precise conceptual detail (counterfactual modeling, reinforcement schedules, symbolic inheritance, epistemic offloading) that a specialist sees the exaggeration is fair and recognizes the extended-mind injection as a niche twist. Do not request bibliographies, reading lists, citations, or page-number references. End with the standard invented corporate sign-off.
