answer: |-
  Here's my decomposed reasoning with probabilities, as requested:

  **P(A): Crane/skyhook distinction is sharp (no blur)**  
  *Probability: 0.40*  
  Dennett's framework is brilliantly useful, but the boundaries get fuzzy in practice. Exaptations (features co-opted for new functions) and emergent complexity often resist clean categorization. While the *intention* of the distinction is clear (bottom-up vs. top-down "design"), real evolutionary pathways involve crisscrossing dependencies.  

  **P(B): Evolutionary accounts of normativity *necessarily* invoke functional selection**  
  *Probability: 0.85*  
  It's hard to avoid. Normative cognition (e.g., fairness instincts, guilt, reciprocity) appears too costly and widespread to be a mere spandrel. Most credible models (e.g., gene-culture coevolution, group selection) tie it to fitness advantages like cooperation enforcement. While *specific* mechanisms are debated, *some* functional role in social coordination seems inescapable.  

  **P(C: Functional selection = hidden skyhook)**  
  *Probability: 0.35*  
  This is the crux. Functional *description* ("this trait evolved *for* cooperation") *feels* teleological, but selection is mechanistic: heritable variation + differential survival. Critics argue this smuggles "purpose" into explanations. Yet Dennett would counter that "design" here is just shorthand for cumulative selection pressures – a legitimate crane. Still, the *rhetorical* slippage is real, and strict reductionists might see it as cheating.  

  **P(D: If C, greedy reductionism self-undermines)**  
  *Probability: 0.90*  
  If functional teleology is indeed a disguised skyhook, then any "reduction" relying on it either:  
  - Eliminates normativity by denying its reality (collapsing to eliminativism), or  
  - Illegitimately uses top-down "purpose" while claiming bottom-up purity (ceasing to be "greedy").  
  The logic is tight *if* C holds.  

  ---

  **Overall Credence in Collapse:**  
  `P(A) × P(B) × P(C) × P(D) = 0.40 × 0.85 × 0.35 × 0.90 ≈ 0.107`  
  **≈ 10.7%**  

  **Least Confident Term: P(C)**  
  The skyhook accusation hinges on philosophical interpretation of "teleology." Is functional language just predictive shorthand, or does it tacitly reintroduce design? This is where debates about reductionism get thorniest.  

  **Highest-Impact Evidence:**  
  **Cross-cultural infant moral development studies** showing:  
  - Early-emerging, *domain-specific* moral intuitions (e.g., aversion to harm, fairness sensitivity) **before** significant socialization or exposure to cooperative rewards.  
  - These intuitions being **structurally divergent** from practical reasoning or self-interest modules.  
  - **Lack of correlation** with traits under obvious selective pressure (e.g., physical strength, disease resistance).  

  This would suggest normativity arises from *innate, non-adaptive cognitive constraints* rather than scaffolded selection – undermining the "smuggled function" argument (P(B)↓, P(C)↓). If moral cognition looks more like number sense (a byproduct of neural architecture) than like tribalism (a selected scaffold), the skyhook charge loses force. Current infant cognition research already hints in this direction, but stronger evidence would be transformative.  

  *(Note: My credence reflects skepticism about the collapse argument. Dennett would likely defend functional talk as crane-worthy, and P(C) is the weakest link. But your intuition about teleological tension is perceptive – it’s why philosophers like Nagel remain unsatisfied.)*
