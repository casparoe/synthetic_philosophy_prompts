answer: |-
  Below is a complete 90-minute workshop design focused on "threshold drift" in decision-making. Participants experience how search costs warp their definition of "good enough" while hunting for "apartments" with trade-offs between cost, noise, and commute time.

  ---

  ### **Workshop Title**: The Apartment Hunt: Why We Settle Sooner Than We Think  
  **Duration**: 90 minutes  
  **Participants**: 16 adults (4 groups of 4)  
  **Materials per Group**:  
  - 1 deck of 24 "apartment cards" (see distribution below)  
  - 20 time tokens (physical tokens or tally sheet)  
  - 1 summary sheet (to record viewed apartments)  
  - 1 "Search Cost" envelope (hidden until Phase 3)  

  ---

  ### **Phase 1: Introduction & Rules (10 min)**  
  **Facilitator Script**:  
  *"We’re about to simulate apartment hunting. Each group represents renters searching for a new home. You’ll see apartments with three features:  
  - **Rent cost** (lower = better)  
  - **Noise level** (lower = quieter)  
  - **Commute time** (lower = shorter)  
  Each feature is rated 1–10 (1 = best, 10 = worst).  
  Your goal: Find an apartment that feels ‘worth it’ to your group.  
  Here’s how it works:  
  1. You start with **20 time tokens**.  
  2. Each new apartment you view costs **1 token**.  
  3. You may stop searching *any time* by agreeing on your best option.  
  4. If tokens run out, you *must* take the last apartment viewed.  
  We’ll debrief after. Ready? Begin!"*  

  **Critical Rules to Emphasize**:  
  - Groups must **agree by consensus** before stopping.  
  - No predefined scoring—choose what "feels right."  
  - Record viewed apartments on the summary sheet.  

  ---

  ### **Phase 2: Search Activity (35 min)**  
  **Mechanics**:  
  - Groups spend tokens to draw cards from their deck.  
  - **Deck composition** (24 cards per group, identical distributions):  
    - 6 "bad" cards (e.g., Rent 8–10, Noise 8–10, Commute 8–10)  
    - 12 "mixed" cards (e.g., Rent 4–6, Noise 3–7, Commute 5–8)  
    - 6 "great" cards (e.g., Rent 1–3, Noise 1–3, Commute 1–4)  
    - **Deck order**: First 8 cards = 4 bad + 4 mixed; next 8 cards = 3 great + 5 mixed; last 8 cards = 3 great + 5 bad.  

  **Pressure to Stop**:  
  - Tokens deplete with each search (1 token/card).  
  - After 10 minutes, open the **"Search Cost" envelope** (hidden at each table):  
    *"Every search costs *emotional energy*. Losing tokens = rising stress. Groups with ≤5 tokens left lose 1 bonus point per search."*  
  - Groups with ≤5 tokens now face **double pressure**: fewer tokens + point penalties.  

  **Predictable Dynamics**:  
  - **Early stoppers (10–15 min)**: Settle for mediocre cards early to avoid stress.  
  - **Late stoppers (25–30 min)**: Risk token exhaustion for better options.  
  - **Threshold drift**: Groups rationalize compromises ("This rent is okay if commute is short!").  

  ---

  ### **Phase 3: Decision & Reveal (15 min)**  
  1. Groups declare their chosen apartment and remaining tokens.  
  2. Facilitator reveals **all 24 cards** in order (projected or on wall).  
  3. **Key revelation**: "Great" cards (e.g., Rent 1/Noise 2/Commute 3) were clustered in the middle deck section.  
  4. Groups compare choices. Most early stoppers missed great cards; late groups often settled due to penalties.  

  ---

  ### **Debrief (30 min)**  
  **Link Activity to Real-World Concepts**:  
  | **Activity Moment**          | **Concept**                          | **Facilitator Question**                                                                 |  
  |------------------------------|--------------------------------------|------------------------------------------------------------------------------------------|  
  | First group stops early       | Aspiration-level lowering            | *"What made you stop *before* seeing many options? Did fatigue play a role?"*              |  
  | "Search Cost" envelope opened | Hidden costs of effort               | *"How did knowing about point penalties change your urgency? How is this like real life?"* |  
  | Groups rationalizing compromises | Criterion reweighting              | *"Did anyone downplay a flaw (e.g., ‘Noise isn’t so bad’) to justify stopping? Why?"*      |  
  | Reveal of missed great cards  | Opportunity cost of stopping early   | *"How did it feel seeing better options you skipped? How might this play out in real searches?"* |  

  **Core Insights to Highlight**:  
  1. **Threshold drift**: Under pressure, we lower standards AND redefine what matters (e.g., "Commute matters less now").  
  2. **Bounded rationality**: We make "good enough" choices with limited info/energy—not because we’re lazy, but because search is costly.  
  3. **Hidden costs**: Time, stress, and effort accumulate invisibly, warping decisions.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Dominant players force premature stops.  
     **Fix**: Require consensus and remind groups: *"Everyone must agree. If conflicted, spend 1 token to discuss."*  

  2. **Problem**: Groups "game" points by ignoring trade-offs.  
     **Fix**: **Never** give a scoring formula. Emphasize: *"Choose what feels right—there’s no ‘best’ apartment."*  

  3. **Problem**: Late groups feel punished for thoroughness.  
     **Fix**: In debrief, validate both strategies: *"Stopping early saves energy; searching longer risks penalties but may yield better options. Both are rational."*  

  ---

  ### **What the Workshop CAN’T Replicate**  
  - **Long-term regret**: Participants don’t *live* with their choice. Real-world commitments (e.g., a year-long lease) amplify regret over missed options.  
  - **Irreversibility**: In the game, choices have no consequences. Real decisions often lock us in.  

  **Facilitator Closing Script**:  
  *"Today, you felt the weight of search costs—but in life, the stakes are higher. When you sign a lease or accept a job, you can’t undo it. That missed apartment? It might haunt you for months. Remember: Threshold drift isn’t failure—it’s human. But noticing it lets you ask: ‘Am I settling because I’m tired, or is this truly enough?’ That question might save you from tomorrow’s regret."*  

  ---

  ### **Why This Works**  
  - **Experiential learning**: Physical tokens and trade-offs make abstract costs tangible.  
  - **No jargon**: Uses relatable framing ("apartment hunt") without technical terms.  
  - **Self-discovery**: Groups see their own drift in the card reveal before debrief.  
  - **Stakes**: Small penalties raise tension without creating winners/losers.  

  Adjust timing as needed, but stick to the script—ambiguity in rules primes threshold drift.
