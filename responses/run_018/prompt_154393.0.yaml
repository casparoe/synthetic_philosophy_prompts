  The salt wind off Crane Harbor carried the usual morning smells: damp wood, fish guts, and hemp. Down Gull Street, the rhythmic clatter of looms usually echoed by dawn. Today, only a few sounded.

  Mara stood by her stoop, the worn tether-belt heavy in her hand. It was tight, practical, woven years ago by old man Bren next door. She needed the rent. The merchants paid a silver bit per arm’s length of raw, clean fiber now – more than a whole finished belt was worth. Deep-sea cables needed insulation, they said. Her fingers, calloused from gutting fish, trembled as she sawed the small blade Bren himself had given her. The thick strands parted with surprising ease. She coiled the loose fiber quickly, hiding the frayed ends tucked into her waistband. Bren’s window stayed dark. Shame was a cold stone in her gut, but the landlord’s notice was colder.

  Two doors down, Finn fastened his belt. The weave was uneven, lumpy in places – Hesta’s hands shook something fierce these past months. The fever hadn’t broken. He smoothed the rough hemp against his tunic. Selling it wouldn’t cover the doctor’s bill, not truly. But Hesta had woven it, painstakingly, when she could still sit upright. Cutting it felt like cutting the frail thread holding her here. He patted it, a silent promise to the shuttered house. The honor felt thin, but real, anchored in Hesta’s labored breath from the room above.

  Elara swept her step, watching a young fisherman stride past, whistling. He wore no belt. Just trousers and a thick knit sweater. His stride was easy, unburdened. Last year, such a sight would have tightened her chest, made her look away. Now? She watched him disappear around the corner towards the docks, where cable-laden merchant ships bobbed. She touched her own belt, woven by her aunt, long gone. It felt... inert. Like driftwood. The expected pang of shame, the communal disapproval she should have felt for the beltless man, simply wasn’t there. It had evaporated, unnoticed, like morning fog burning off the water. A strange lightness touched her, unsettling and new.

  Down Gull Street, the few remaining looms clacked on. Cut ends of hemp lay trampled in the gutter near Mara’s stoop. Finn touched his lumpy belt, glancing at Hesta’s window. Elara stared at the space where the whistling man had been, the absence of feeling loud in her chest. Was it the silver bit? Was it something unspoken, gathering like storm clouds? Or had the honor simply worn too thin, frayed strand by strand, until one day the whole thing just… fell away? The harbor offered no answer, just the indifferent sigh of the tide.
