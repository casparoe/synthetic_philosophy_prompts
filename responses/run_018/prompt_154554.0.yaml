  ## Formal Argument for Restricted Eliminative Materialism

  **Premise 1: Criterion of Epistemic Viability (Inter-subjective Calibration Stability - ICS)**
  For any taxonomy purporting to describe causally relevant internal states of a subject, its epistemic viability depends critically on **Inter-subjective Calibration Stability (ICS)**. ICS requires that attributions of specific states within this taxonomy to a subject remain sufficiently consistent and reliable across different observers (including the subject themselves) under minor variations in context (e.g., slight changes in the subject's environment, task demands, or observer background knowledge). A taxonomy failing ICS lacks the robustness necessary for reliable scientific description and explanation, as its state attributions become observer- and context-sensitive noise rather than stable descriptors of the target system.

  **Premise 2: Folk Psychology Fails ICS**
  The folk-psychological taxonomy, partitioning mental life into discrete, content-bearing propositional attitudes (beliefs, desires) with fixed propositional content and satisfaction conditions, demonstrably fails ICS.
  *   **Attribution Instability:** Attributions of specific beliefs (e.g., "S believes that P") or desires ("S desires that Q") to the same subject show significant variance across observers (including self-reports) under minor contextual shifts. Interpretations of behavior X as evidence for belief P in context C1 may shift to belief P' in context C2, or even to desire Q, depending on subtle pragmatic cues, observer biases, narrative framing, or slight alterations in the subject's situation or preceding events. This variance is not merely epistemic uncertainty resolvable with better data; it reflects an inherent instability in the mapping between the subject's internal dynamics and the discrete, content-specific categories imposed by folk psychology.
  *   **Contrast with Neural Dynamics:** Coarse-grained descriptions of neural dynamics (e.g., patterns of regional activation, synchrony, information flow, or predictive-error minimization trajectories across neural populations) exhibit significantly greater ICS. While measurement noise exists, descriptions like "high error-signal propagation in sensory-prefrontal loop L1" or "dominant attractor state in network N favoring action schema A" show demonstrably more consistent attribution and measurement across different observers (using established techniques like EEG, fMRI, or computational modeling) and across minor contextual shifts. The stability arises because these descriptions track the underlying physical-dynamical processes directly, rather than interpreting them through intentional, propositional lenses.

  **Premise 3: Failure of ICS Justifies Elimination, Not Reduction**
  The fundamental failure of the folk-psychological taxonomy to satisfy ICS indicates that its core categories (belief, desire) do not reliably carve nature at its joints. They are not robust natural kinds amenable to scientific investigation. Therefore:
  *   Neuroscience should **not** seek a *reductive mapping* of beliefs or desires onto specific brain states. Such a project presupposes the legitimacy and stability of the folk kinds, which ICS failure shows to be illusory. Attempts at reduction inevitably founder on the shifting sand of attributional instability.
  *   Neuroscience should instead pursue a *replacement strategy*. It should develop a new taxonomy grounded in the stable, observable dynamics of the brain (e.g., dynamical systems theory applied to neural activity). This successor taxonomy would characterize cognitive-behavioral states in terms like "trajectories in neural state space," "patterns of predictive-model updating," "dominance of specific error-minimization routines," or "stability of particular network configurations." Crucially, this taxonomy makes **no commitment** to preserving one-to-one correspondences with propositional attitudes. Its categories are defined by their dynamical properties and functional roles *within the neural system*, not by semantic content or satisfaction conditions.

  **Addressing Self-Refutation (Without Folk Psychology)**
  The assertion of this eliminative thesis does not require attributing "belief-in-eliminativism" to the speaker. It can be formulated entirely within the successor vocabulary:
  *   The communicative behavior (vocalization, text production) labeled "asserting restricted eliminativism" is caused by specific neural-dynamical patterns within the speaker's brain.
  *   These patterns involve the activation of communicative schema C, coupled with high-level predictive models M derived from extensive learning history involving observations of folk-psychological attribution instability and neural dynamical stability.
  *   The production of this specific communicative output is driven by a complex error-minimization process: the detection of a pervasive inconsistency (high predictive error signal) between the observed instability of folk attributions (treated as sensory input patterns) and the demand for stable scientific taxonomies, coupled with the observed stability of neural-dynamical descriptions. Emitting the argumentative sequence aims to reduce this predictive error by propagating a model update within potential recipients.
  *   The "assertion" is thus a *behavioral output* generated by specific neural dynamics focused on reducing predictive error signals related to conceptual taxonomy stability. No attribution of "belief" or "desire" is necessary to describe the causal chain producing this output.

  **Distinction from Reductive Identity Theory**
  The restricted eliminativist position presented here remains **genuinely distinct** from reductive identity theory. The key difference lies in the ontological commitment to the *kind-structure* of the predecessor theory:
  *   **Reductive Identity Theory:** Assumes the folk-psychological kinds (belief, desire) are fundamentally valid and seeks to *identify* each type of propositional attitude with a specific type of neural state. It preserves the kind-structure of folk psychology, mapping it onto the physical substrate ("Belief that P *is* Brain State B").
  *   **Restricted Eliminativism:** Argues the folk-psychological kind-structure itself is defective (due to ICS failure) and replaces it with a *different* kind-structure derived from neural dynamics. The successor taxonomy organizes the domain using fundamentally different categories (e.g., error-minimization regimes, attractor states, network dynamics).

  **The Functional Analogue Challenge:** It is likely that the successor neural-dynamical taxonomy will include states that are *functional analogues* of belief-like and desire-like roles (e.g., stored model parameters guiding predictions, or valence signals modulating action selection). However, this does not collapse the distinction:
  1.  **Different Identity Conditions:** The identity conditions for a "stored predictive model parameter" are defined by its role in neural computation and dynamics (e.g., its connectivity, update rules, impact on prediction error), *not* by propositional content or satisfaction conditions. Its "content" is operationalized as its specific causal role within the predictive processing machinery, not as a truth-evaluable proposition.
  2.  **Lack of One-to-One Mapping:** A single folk belief "that P" may correspond to distributed, context-dependent activations across multiple predictive models and error-minimization pathways. Conversely, a single neural-dynamical state (e.g., a specific attractor basin) may underpin behaviors interpretable as multiple different beliefs or desires depending on context. The successor categories do not mirror the discrete propositional structure of the predecessor.
  3.  **Kind Replacement:** The successor taxonomy offers a fundamentally different way of parsing and explaining cognitive phenomena. While it may explain *why* folk psychology seems intuitive (by identifying the functional analogues), it does so by eliminating its core theoretical entities (propositional attitudes as discrete content-bearers) and offering a superior explanatory framework grounded in stable dynamics.

  **Conclusion:** The failure of inter-subjective calibration stability reveals the folk-psychological taxonomy as an unstable, observer-dependent interpretive scheme, not a robust framework for scientific cognition. Neuroscience should abandon the doomed project of reducing beliefs and desires and instead adopt a dynamical-systems taxonomy based on the stable patterns of neural activity, such as predictive-error minimization. This successor taxonomy, while hosting functional analogues, organizes the cognitive domain using fundamentally different categories with different identity conditions, ensuring the restricted eliminativist position remains distinct from reductive physicalism.

  Verdict: The restricted eliminativist position remains genuinely distinct from reductive physicalism because the successor dynamical-systems taxonomy defines cognitive kinds by neural-dynamical properties without preserving the identity conditions or propositional structure of folk-psychological states.
