  The frozen-knowledge idea is interesting but probably not as upstream. It's a specific case where knowledge growth is halted. If Popper's core point is about unpredictability from new knowledge, then artificially stopping it might allow predictions, but it doesn't negate his argument. Instead, it confirms that only when knowledge is static can predictions work. So it's a derivative issue.

