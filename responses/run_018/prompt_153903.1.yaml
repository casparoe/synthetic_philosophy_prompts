prompt: |-
  Hey, I'm putting together a grad module on medieval political philosophy and my students keep falling back on this analogy: they say Aquinas treats the commonwealth like a human body, the tyrant like a cancerous growth, and tyrannicide like surgical excision — precise, necessary, preserving the whole organism. They lean on it to argue that Aquinas basically licenses assassination whenever governance gets "pathological," but I'm not convinced the mapping holds up under pressure.

  Can you audit how far it actually holds? Give me the correspondance table — ruler as head? citizens as limbs? the common good as homeostatis? — then show me exactly where it fractures: does Aquinas's distinction between an usurper and a legitimate ruler who abuses power map onto cancer versus infection? Does the analogy smuggle in a modern bio-medical idea of "health" he wouldn't recognize? And does the surgical conclusion survive once you factor in his conditions about public authority and the risk of greater evil? Think carefully, start by brainstorming the mappings, then hit the breaks. You're acting as a professional historian of philosophy with expertise in Thomism. Keep it to one tight paragraph — max 250 words — and don't cite specific page numbers; just reason from the texts.
reasoning: |-
  Okay, let me tackle this professor's query about Aquinas and the body politic analogy. They're noticing students overextending the medical metaphor to justify tyrannicide, and want a precise audit of where it holds and fractures. 

  First, I need to reconstruct the core mappings from Aquinas' texts: ruler as head (directing), citizens as limbs (cooperating), common good as health. The analogy works initially for organic unity and specialized functions. But the fracture points are crucial. 

  When students equate tyrants with cancer needing excision, they're missing Aquinas' key distinction between usurpers (foreign bodies) and abusive legitimate rulers (diseased organs). Aquinas' actual treatment differs radically: usurpers may be removed, but abusive rulers require public authority intervention - not vigilante surgery. 

  The deeper problem is smuggled modern biomedicine. Aquinas' "health" isn't physiological balance but teleological virtue-alignment. His risk calculus also breaks the analogy: he prioritizes avoiding greater evils (like chaos or worse tyranny) over "curative" violence. 

  I'll structure the response to first validate valid mappings, then systematically dismantle the overextension by showing how Aquinas' conditions for removal don't resemble surgical logic. Must emphasize his rejection of private assassination and contextual prudence. 

  Word count is tight - need to compress but cover: 1) valid analogy core 2) usurper vs tyrant distinction 3) teleological "health" 4) public authority requirement 5) greater evil precaution. All without citations but anchored in Summa texts.
answer: |-
  Here's an audit of the body politic analogy in Aquinas's thought regarding tyranny and tyrannicide:

  **Valid Mappings:**
  *   **Commonwealth as Body:** Aquinas explicitly uses this (rooted in Paul/John of Salisbury) to depict organic unity, interdependent functions (ruler as "head" directing, citizens as "members" cooperating), and purpose (common good as the body's "health" - its flourishing/end).
  *   **Tyrant as Pathological:** Tyranny is indeed a "disease" corrupting the body's health (common good), perverting rule from common benefit to private advantage.

  **Fracture Points:**
  1.  **Usurper vs. Tyrant:** Aquinas sharply distinguishes a *usurper* (never legitimately head, an *alien* invader) from a *legitimate ruler turned tyrant* (a *diseased* head/organ). Students conflating both as "cancer" demanding identical "excision" miss this. Removal of a usurper (like an external pathogen) is widely permissible; deposing a legitimate-but-abusive ruler is far more constrained.
  2.  **"Health" is Teleological, Not Bio-Mechanical:** Aquinas's "health" is the virtuous life ordered to God, not modern physiological homeostasis. The analogy risks implying a value-neutral, scientific "cure," whereas Aquinas's judgment is fundamentally moral-theological, assessing rule against divine and natural law ends.
  3.  **"Surgical" Tyrannicide is Rejected:** Aquinas *explicitly condemns* private tyrannicide as spiritually dangerous and prone to worse outcomes. He permits *public authority* (e.g., a representative body) deposing a tyrant only if the tyranny is extreme, all else fails, *and* the probable outcome isn't worse (e.g., anarchy, greater tyranny). This is prudential political judgment, not a clean surgical strike. The analogy obscures his insistence on due authority and catastrophic risk aversion, making assassination seem a routine clinical solution rather than a perilous last resort.
