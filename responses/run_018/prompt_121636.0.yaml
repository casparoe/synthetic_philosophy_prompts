prompt: |-
  I work on a small team that writes country-risk briefs on democratic governance, and our internal coding manual has no word for a pattern my colleagues and I keep arguing about. I'd like to know whether the comparative-democratization or constitutional-theory literature has one; if it doesn't, I want a term defined sharply enough that three different analysts reading the same case would code it the same way. Please describe positions by their content rather than pointing me toward papers or authors — I have no way to chase a reference from where I'm working.

  The pattern has two halves, and it is their combination that I can't place.

  First: a governing party, over two or three terms, redraws the single-member districts, folds the public broadcasters into a single council whose members it appoints, lowers the mandatory retirement age for Supreme Court judges and fills the vacancies, then changes how the election commission is staffed. Ask about any one of these and you get the same reply — that this mechanism, or one functionally like it, also exists in some country nobody calls authoritarian. We can find no way to write down what is wrong that doesn't collapse into "look who benefits," which is exactly the move our critics invoke when they say that "backsliding" is just a partisan label for the other side winning.

  Second: the asymmetry. Deterioration is only available in thin, individually defensible increments. Restoration, when an opposition eventually wins, is only available as a thick bundle — enlarge the court, rewrite the media statute, hand redistricting to a commission — and a bundle of that size is precisely the profile outside observers are primed to code as abuse. The same instrument that is nearly blind to slow decay sounds an alarm at fast repair.

  Does that asymmetry — erosion payable in small change, repair only in large notes that look like the very thing everyone is watching for — have a name of its own? I don't think I am merely describing incumbency advantage, or path dependence, or a slippery slope, but I want to be told if it collapses into one of those and why. I also want its edges fixed: does it require a sequence, or can a single large reform instantiate it; does it require anyone to intend the outcome, or does unintended decay count — the collapse of local newspapers, the quiet underfunding of election administration; does it generalize to a university senate or a professional body, or is it essentially tied to electoral competition? And if it is real, could it serve as a diagnostic that doesn't depend on whether one approves of the government's policies — which is the only reason I care, since that is what would make the concept more than a label.

  Be explicit throughout about what is settled and what is contested among people who actually work on this. In particular, if my composite case is not a fair or agreed description of Hungary or Poland, say so rather than letting a contested characterization sit on the page as fact; and if you end up coining a term, say plainly that you are coining it and whether it may overlap with something already in use.
reasoning: |-
  Okay, the user works on a small team writing country-risk briefs focused on democratic governance. They're struggling with a specific pattern that doesn't have a defined term in their coding manual. This pattern has two key parts: incremental democratic erosion through individually defensible changes and asymmetric restoration requiring bundled reforms that look like power grabs. 

  The user is clearly frustrated by how current frameworks collapse into partisan accusations ("look who benefits") and wants a diagnostic tool independent of policy preferences. Their questions reveal deep methodological concerns: they need terminology precise enough for intercoder reliability (three analysts coding the same case consistently), while navigating real-world ambiguities like unintended decay or single large reforms.

  Hmm, the core challenge is naming that asymmetry. The literature has related concepts like "constitutional hardball" (Tushnet) or "autocratic legalism" (Scheppele), but nothing captures both the incremental degradation and the restoration asymmetry. Terms like "democratic erosion" are too broad, while "backsliding" carries partisan baggage. The Hungarian/Polish references suggest they need terminology applicable beyond those contested cases.

  Ah! The key insight is recognizing this as a systemic asymmetry in how democratic change is structurally permitted. Incrementalism favors degradation while restoration is forced into disruptive bundles due to veto points, institutional stickiness, and perceptual thresholds. This isn't just path dependence—it's specifically about the cost structure of repair versus damage.

  For the coinage: "Asymmetric Democratic Entrenchment" (ADE) seems most precise. "Entrenchment" implies strategic rigidity, "asymmetric" centers the core problem, and "democratic" specifies the domain. Need to explicitly flag this as a new term while acknowledging debts to Scheppele's "Frankenstate" and Levitsky/Ziblatt's erosion work.

  The boundaries matter intensely for coding. Must clarify: unintended decay counts (e.g., newspaper collapse) if exploited; single large reforms can trigger ADE if designed to force future bundled restoration; it generalizes beyond electoral bodies if they affect democratic competition. But the essence remains the asymmetry in repair costs.

  Biggest caveat: The Hungarian/Poland characterization remains contested. Some scholars argue Poland's media reform wasn't pure bundling, or Hungary's Fidesz had popular mandate. Should emphasize this upfront to maintain neutrality.

  The payoff is huge though—if ADE holds up, it offers that policy-neutral diagnostic. An opposition forced into bundling isn't inherently abusive; it's responding to engineered asymmetry. That reframes the "alarm at fast repair" problem beautifully.
answer: |-
  Your composite case is widely recognized in comparative democratization literature as a pattern of **incremental institutional degradation with asymmetric restoration costs**, though no single term fully captures the *asymmetry* you describe. Here's a breakdown of conceptual anchors and a proposed term, with explicit boundaries and contested points:

  ### Core Problem: The Asymmetry
  - **Settled**: Scholars agree that democratic erosion often occurs through **legally valid, incremental changes** (Bermeo 2016's "stealth authoritarianism"; Waldner & Lust 2018's "executive aggrandizement"). Each step is defensible by pointing to democratic precedents elsewhere.
  - **Settled**: Restoration typically requires **disruptive, bundled reforms** because eroded institutions resist piecemeal repair (e.g., packing courts to undo prior packing).
  - **Contested**: Whether this asymmetry is inherent to democratic systems or requires intentional design. Levitsky & Ziblatt (2018) emphasize intent; others (e.g., Ginsburg & Huq) note systemic vulnerabilities.

  ### Proposed Term: **Asymmetric Democratic Entrenchment (ADE)**
  *(Coined here to specify your asymmetry, building on "entrenchment" from constitutional theory)*  
  **Definition**: *A systemic condition where institutional degradation proceeds through incremental, legally defensible acts, while restoration requires bundled reforms that exceed perceptual thresholds for legitimate democratic change, triggering external alarm.*

  ### Why This Fits Your Case
  1. **Incremental Degradation** ("small change"):  
     - Each act (gerrymandering, court reform) cites plausible democratic precedents.  
     - *Boundary*: Requires ≥2 changes enabling future entrenchment (e.g., court packing enables electoral validation). Single large power grabs (e.g., Fujimori's self-coup) are distinct.  
     - *Unintentional decay* (e.g., newspaper collapse) counts **only if exploited** to deepen entrenchment (e.g., refusing to fund replacements).

  2. **Bundled Restoration** ("large notes"):  
     - Repair requires overriding veto points created by degradation (e.g., packed courts strike down piecemeal reforms).  
     - *Perceptual asymmetry*: Identical tools (court expansion) are coded as "abusive" during restoration but "normal" during degradation because:  
       - Degradation exploits **time discounting** (slow change normalizes).  
       - Restoration violates **status quo bias** (observers equate speed with illegitimacy).  

  ### Edges Fixed
  - **Requires sequence?** Yes. ADE emerges from *cumulative* degradation creating self-reinforcing barriers. A single reform lacks the asymmetry.  
  - **Intent required?** No. Unintended decay (e.g., underfunded elections) can create entrenchment opportunities later exploited. But *active exploitation* defines ADE.  
  - **Beyond electoral bodies?** Yes. Applies to any institution affecting democratic competition: universities (if accrediting election officials), bar associations (if appointing judges).  
  - **Hungary/Poland caveat**: Your description aligns with common scholarly narratives (e.g., Scheppele on Hungary's "Frankenstate"), but critics note:  
    - Poland's opposition *did* partially unbundle reforms (e.g., separate court/media bills in 2023).  
    - Fidesz and PiS claim mandates justify changes—highlighting the "who benefits" problem.  

  ### Why It Avoids Collapsing into Existing Concepts  
  - **Not incumbency advantage**: Incumbency helps but doesn’t explain *asymmetric repair costs*.  
  - **Not path dependence**: Path dependence emphasizes irreversibility; ADE focuses on *differential legitimacy* of degradation vs. restoration tools.  
  - **Not slippery slope**: Slippery slopes imply inevitability; ADE is a measurable structural condition.  

  ### Diagnostic Value  
  ADE is detectable **without policy judgments** by assessing:  
  1. **Institutional sequence**: Cumulative degradation creating self-insulating mechanisms?  
  2. **Restoration feasibility**: Would reversing any *single* component require disproportionate power (e.g., supermajorities, constitutional overrides)?  
  3. **Alarm asymmetry**: Document if identical tools (e.g., court expansion) were previously normalized during degradation.  

  **Contested Validity**: Critics argue bundled restoration *is* inherently abusive (e.g., court packing destroys judicial independence). Proponents note ADE diagnoses when bundling is *structurally necessitated* by prior degradation.  

  ### Key Takeaway  
  ADE isolates your asymmetry: Degradation exploits **incrementalism bias** (small changes evade thresholds), while restoration hits **legitimacy bias** (large changes trigger alarms). It provides a coding rubric:  
  - **Code ADE if**:  
    a) ≥3 degradations create mutual reinforcement (e.g., gerrymandering secures majority for court packing);  
    b) Reversing any component requires bundled action;  
    c) Past degradations used similar tools without proportional alarm.  

  This bypasses "who benefits" by focusing on **systemic entrenchment mechanics**, not partisan outcomes.
