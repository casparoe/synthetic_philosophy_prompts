  ### Branching Taxonomy for Defining Human Death  
  *Rooted in responses to edge cases; designed to sort by case judgments, not labels. Navigate by answering concrete questions without knowing branch destinations.*

  ---

  #### **Root Node (Q0):**  
  *"Does artificial maintenance of circulation and respiration (without a brain) count as preserving the life of the organism? For example, a decapitated body sustained by machines for organ preservation."*  
  - **Yes (branch Y0):** Artificial support preserves life even without a brain.  
  - **No (branch N0):** Artificial support alone cannot preserve life without a brain.  

  ---

  #### **Branch Y0 (from Q0):**  
  *"Can brainstem function alone (without a cerebral cortex) sustain a living human organism? For example, an anencephalic newborn with breathing and reflexes but no cortex."*  
  - **Yes (leaf Y0Y1):** Brainstem function suffices for life.  
    - **Position:** *Strict Circulatory Criterion (accepting artificial maintenance)*.  
      - **Awkward commitment:** Must classify the ECMO-sustained brain-dead body (scenario A) and the decapitated cadaver (scenario C) as alive, despite lacking any brain function.  
  - **No (leaf Y0N1):** Brainstem function is insufficient without cortex.  
    - **Position:** *Unnamed Hybrid View (circulatory + consciousness)*.  
      - **Awkward commitment:** Must classify the anencephalic infant (scenario B) as dead while the decapitated cadaver (scenario C) is alive, creating a biological inconsistency.  

  ---

  #### **Branch N0 (from Q0):**  
  *"Does the absence of consciousness alone (with intact brainstem homeostasis) suffice for death? For example, a patient in persistent vegetative state with no cortical responsiveness."*  
  - **Yes (leaf N0Y1):** Consciousness is necessary for life.  
    - **Position:** *Higher-Brain Criterion*.  
      - **Awkward commitment:** Must classify the persistent vegetative patient (scenario D) as dead despite intact hypothalamic and brainstem functions maintaining homeostasis.  
  - **No (leaf N0N1):** Consciousness is not necessary; other integration matters.  
    - **Position:** *Whole-Brain Criterion (or Brainstem-Only / Organismal-Integration / Disjunctive Legal-Pragmatic)*.  
      - **Awkward commitment:** Must classify the anencephalic infant (scenario B) as alive despite no capacity for consciousness or cognition.  

  ---

  ### Logical Space of Answers to Scenarios  
  *Each scenario answered "Alive" (+) or "Dead" (−):*  
  - **A:** Brain-dead body on ECMO with spontaneous cardiac activity → Requires circulatory judgment.  
  - **B:** Anencephalic newborn with brainstem reflexes → Tests brainstem vs. consciousness.  
  - **C:** Decapitated cadaver on mechanical perfusion → Tests circulatory-only viability.  
  - **D:** Persistent vegetative state with homeostasis → Tests consciousness necessity.  

  | Combination | A   | B   | C   | D   | Occupied? | Position (Leaf)                      | Unoccupied Diagnosis |  
  |-------------|-----|-----|-----|-----|-----------|--------------------------------------|----------------------|  
  | 1           | +   | +   | +   | +   | Yes       | Strict Circulatory (Y0Y1)            | N/A                 |  
  | 2           | +   | +   | +   | −   | No        | Incoherent (B/D inconsistency)       |                      |  
  | 3           | +   | +   | −   | +   | Yes       | Strict Circulatory (spontaneous-only) | N/A                 |  
  | 4           | +   | +   | −   | −   | No        | Incoherent (B/D inconsistency)       |                      |  
  | 5           | +   | −   | +   | +   | No        | Incoherent (B/D inconsistency)       |                      |  
  | 6           | +   | −   | +   | −   | Yes       | Unnamed Hybrid (Y0N1)                | N/A                 |  
  | 7           | +   | −   | −   | +   | No        | Incoherent (B/D inconsistency)       |                      |  
  | 8           | +   | −   | −   | −   | Yes       | Unnamed Hybrid (spontaneous + consciousness) | N/A        |  
  | 9           | −   | +   | +   | +   | No        | **Incoherent** (A/C inconsistency; brain absence treated asymmetrically) |  
  | 10          | −   | +   | +   | −   | No        | **Incoherent** (A/C + B/D inconsistencies) |  
  | 11          | −   | +   | −   | +   | Yes       | Whole-Brain (N0N1)                   | N/A                 |  
  | 12          | −   | +   | −   | −   | No        | Incoherent (B/D inconsistency)       |                      |  
  | 13          | −   | −   | +   | +   | No        | **Incoherent** (A/C inconsistency)   |                      |  
  | 14          | −   | −   | +   | −   | No        | **Incoherent** (A/C inconsistency)   |                      |  
  | 15          | −   | −   | −   | +   | No        | Incoherent (B/D inconsistency)       |                      |  
  | 16          | −   | −   | −   | −   | Yes       | Higher-Brain (N0Y1)                  | N/A                 |  

  #### **Special Attention to Combinations Accepting Brain Death but Not Decapitation as Death (A−/C+):**  
  - **Combinations 9, 10, 13, 14:** All marked **incoherent** because they treat biologically identical states (irreversible loss of all brain functions in A and C) differently, violating the root node’s requirement that brain absence is a unified condition for death.  

  ---

  ### Collapsed Positions  
  The tree fails to separate **Whole-Brain Criterion**, **Brainstem-Only Criterion**, **Organismal-Integration Criterion**, and **Disjunctive Legal-Pragmatic Criterion** (all in leaf **N0N1**). They share identical answers to scenarios A–D:  
  - A: Dead (brain absent).  
  - B: Alive (brainstem function maintains integration).  
  - C: Dead (brain absent).  
  - D: Alive (brainstem maintains homeostasis).  

  **Why they collapse:**  
  - No scenario tests distinctions between these positions (e.g., a body with only hypothalamic function or partial brainstem activity). All cases either destroy the entire brain (A/C) or preserve brainstem-mediated integration (B/D), forcing agreement. Metaphysical differences (e.g., "integration" vs. "brainstem function") do not manifest in the given edge cases.  

  ---  
  *This taxonomy isolates commitments through edge cases, exposing inconsistencies and unmapped logical space. Participants are sorted by their case judgments, revealing hidden alignments regardless of preferred labels.*
