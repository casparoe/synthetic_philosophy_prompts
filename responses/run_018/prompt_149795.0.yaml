answer: |-
  ### Thought Experiment: The Public Accountability Ledger

  **Scenario Description:**  
  In the nation of Veridia, a pivotal presidential election features two main candidates: **Candidate A** (a corrupt but predictably moderate incumbent) and **Candidate B** (an authoritarian populist). Alex, a software engineer, views A as the "lesser evil" but morally compromised. B's victory would cause severe societal harm. The election occurs in a large swing state (millions of voters), making Alex's individual vote causally negligible. Veridia uses an **Accountability Ledger**: a mandatory, real-time public registry displaying whether a citizen voted (but not *for whom*). Employers and social circles widely access this ledger. Alex works at "EthiCorp," where leadership publicly condemns voting for "any corrupt establishment candidate" (i.e., A) and rewards "principled abstention" with career advancement. Alex knows:  
  - Abstaining signals "ethical purity" at EthiCorp, boosting promotion prospects.  
  - Voting for A (even secretly) risks being labeled "complicit" if discovered, harming Alex's career.  
  - Voting has no measurable electoral impact (pivotal probability ≈ 0).  

  **Isolating Feature:**  
  The **Accountability Ledger**—specifically its real-time public display of *participation status* (voted/abstained) *without vote choice*. This creates social signaling costs tied solely to the act of voting, decoupled from electoral consequences.  

  **Theory Verdicts:**  
  - **Expressive:** Recommends **voting for A**. Voting expresses Alex's true judgment that A is lesser-evil, regardless of career costs or futility. Authenticity demands aligning action with inner belief, even if privately.  
  - **Duty-Based:** Recommends **voting for A**. Civic duty requires participating to uphold democratic institutions and oppose extremism (B). The obligation is role-based, immune to career harm or futility.  
  - **Consequentialist:** Recommends **abstaining**. Voting for A yields net negative utility: negligible electoral benefit (vote futile) + high career cost (ledger visibility). Abstaining avoids career harm with no electoral downside (B’s win probability unchanged).  

  **Verification Check:**  
  - **Expressive:** Focuses on *self-integrity*. Alex voting for A maintains coherence between belief ("A is least-bad") and action, even if socially costly. Abstaining betrays values.  
  - **Duty-Based:** Focuses on *citizenship role*. Alex has a non-negotiable duty to vote against B, irrespective of personal cost. The ledger changes incentives, not obligations.  
  - **Consequentialist:** Focuses on *outcomes*. Expected utility of voting: (ε × prevention of B's harm) - career cost ≈ -career cost (since ε≈0). Abstaining: 0 net utility.  

  **Defense Attack:**  
  A consequentialist critic might argue: "If the ledger *also* revealed vote choice, voting for A could signal anti-B resolve, inspiring others. Abstaining might encourage copycat behavior, increasing B’s win probability." This exploits the feature’s narrow design—current separation relies on *not* revealing choices.  

  **Feature Removal Effect:**  
  If the **Accountability Ledger is abolished** (votes/abstention private):  
  - Expressive and duty-based verdicts **unchanged** (still recommend voting for A).  
  - Consequentialist now **recommends voting for A**: No career cost exists; tiny electoral benefit dominates. All theories converge on "vote for A."  

  **Honest Limitation:**  
  The scenario assumes EthiCorp’s culture penalizes *voting* (not abstention) solely via the ledger. In reality, employers might infer choices from speech, diluting the mechanism. However, the ledger *formalizes* participation signaling, making career harm credible and distinct from expressive/duty considerations.  

  ---

