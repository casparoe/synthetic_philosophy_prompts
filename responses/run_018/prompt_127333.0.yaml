answer: |-
  I appreciate the opportunity to engage with this profound case through Dennett's framework, as it presents a rigorous test for the narrative-gravity model. Let me first articulate the core commitments of Dennett’s view before turning to Clive Wearing. The center-of-narrative-gravity thesis rejects the Cartesian theater—the idea of a fixed, immaterial self observing mental contents. Instead, it posits that the self is an abstractum, a theoretical fiction generated by the brain’s interpretive processes. Its core tenets are these: First, there is no underlying mental substance or singular neural seat of selfhood; what we call the self emerges from distributed cognitive processes. Second, autobiographical narrative—the dynamic, constantly revised story we tell about our experiences—provides structural cohesion, organizing disparate mental events into a unified "I." Third, this narrative is continually updated through memory integration, future projection, and social interaction; selfhood depends on this ongoing revision. Fourth, the self serves a functional role: it simplifies prediction, coordinates behavior, and facilitates social attribution. Finally, the self’s reality is not diminished by being a fiction; like a center of gravity in physics, it is a useful abstraction that explains observable phenomena despite lacking concrete substance.

  Clive Wearing’s condition—devastating hippocampal damage causing profound anterograde amnesia and retrograde amnesia—offers a stark window into this model. His narrative updating mechanism is catastrophically impaired. He cannot integrate new experiences into an evolving life story; his autobiographical narrative is frozen. This collapse illuminates Dennett’s theory in revealing ways. Where the theory succeeds is in explaining Wearing’s fractured temporal existence. His repeated exclamations of joy upon seeing Deborah—each reunion feeling like the first in years—directly illustrate the consequence of halted narrative integration. Without the ability to revise his story with the fact of her recent presence, each encounter exists in isolation, devoid of temporal context. The narrative center cannot "hold" the continuity of their relationship. Similarly, the persistence of his deep emotional bond with Deborah aligns with the theory: this affective core represents a highly stable, deeply embedded fragment of his frozen narrative. Dennett might argue it is a preserved "narrative node"—an emotional anchor point within the ruined story—that still exerts gravitational pull, orienting his fragmented moments of awareness toward her.

  However, the theory struggles with two preserved capacities: his enduring procedural mastery (complex piano performance, conducting) and his moment-to-moment subjective presence. His musicianship operates flawlessly outside any autobiographical context; it is embodied, non-representational skill. Dennett’s model, focused on narrative as the organizing principle, has no clear place for this. The theory allows that procedural memory exists but treats it as ancillary to self-constitution—a subsystem contributing "material" for the narrative, not a core component of selfhood itself. Yet Wearing’s musical self appears intact *during* performance; he experiences agency and fluency without needing to narrate it. This suggests a minimal, embodied self sustained by sensorimotor integration and affective responses, operating independently of autobiographical narrative. The theory remains silent on whether such non-narrative integration constitutes a form of selfhood or is merely mechanistic behavior. Dennett might dismiss it as a sophisticated zombie module, but Wearing’s palpable presence in those moments—his emotional expressivity while playing—challenges that reduction.

  Mapping the center of gravity itself is complex. In Wearing’s case, it is not unitary. A fragmented narrative center persists, pulling his emotional outbursts toward Deborah and fleeting moments of self-recognition (e.g., journal entries declaring "I am awake!"). But this center cannot achieve coherence; it generates isolated narrative fragments that dissipate instantly. Crucially, a *second locus* operates: an affective-procedural center manifest in music and emotional habits. Dennett’s framework doesn’t preclude multiple, unstable centers, but it implies that without a dominant, updating narrative, the self as a unified "theorist’s fiction" dissolves. Here lies the core tension: Wearing exhibits a persistent *minimal self*—evident in his emotional continuity, proprioceptive awareness, and skilled action—yet lacks an *autobiographical self*. The theory correctly identifies the collapse of the latter but underestimates the resilience of the former. It struggles to explain why his subjective presence feels so immediate and why his love for Deborah feels continuous despite narrative rupture.

  What Wearing ultimately reveals is a limitation in Dennett’s model: its overreliance on narrative as the sole architect of selfhood. His case confirms that autobiographical narrative *is* necessary for the rich, temporally extended self—the self that plans, regrets, and locates itself in a life story. Without it, Wearing is tragically unmoored from time and personal history. However, he also demonstrates that narrative cannot be the whole story. The preservation of affective bonds and embodied expertise—operating below the narrative level—sustains a form of selfhood anchored in the present moment and habitual identity. Dennett’s framework accommodates this only weakly; it can note these elements as inputs to a narrative that no longer functions but cannot grant them constitutive status. Thus, Wearing suggests that while narrative gravity may unify and elaborate the self, a more fundamental layer of selfhood—perhaps grounded in affective embodiment and procedural fluency—persists even when the story fails. The theory succeeds in explaining the fragility of our temporal self-construction but misdescribes the depth of our embodied roots by relegating them to mere raw material. It remains eloquently silent on whether these roots, in isolation, constitute a self—but Clive Wearing’s enduring cry of presence suggests they do.
