answer: |-
  ## Sestina for Kaplan's Twin Keys

  Within this world's frame, what seems **actual**, bright,
  Shifts when conceived as merely **contingent** grace.
  A thought held **now**, a truth I apprehend,
  Could vanish elsewhere, leaving only **doubt**.
  What worlds are **conceivable**, beyond this light?
  What structures hold, **necessary** in their place?

  A different logic holds in every **place**,
  Defining what counts there as **actual**.
  The space of thought, vast and **conceivable**,
  Explores what might be, not what's **contingent**.
  It maps the paths where reason feels **doubt**,
  What centered minds can truly **apprehend**.

  First, how the utterance I **apprehend**
  Finds meaning where the speaker holds their **place**.
  Its primary sense, where **doubt** may still reside,
  Searches the worlds deemed possibly **actual**.
  This path reveals what truth is **contingent**,
  What other times or sites are **conceivable**.

  The secondary view, less **conceivable**
  As shifting (once fixed), minds must **apprehend**,
  Anchors the word, makes rigid the **contingent**.
  Bound to the context, tied to time and **place**,
  It points with force to what is **actual**,
  A rigid link no logic can **doubt**.

  For "now," once spoken, banishes all **doubt**
  About which fleeting moment's **conceivable**
  As present *here*. What *is* **actual**
  Fixes the reference we **apprehend**.
  No other instant holds its proper **place**;
  The current point, once fluid, **contingent**, stands.

  One selfsame thought, once seeming **contingent**,
  A fragile bloom exposed to time's harsh **doubt**,
  Locked in the frame of context, finds its **place**
  As fixed, unyielding, scarcely **conceivable**
  To change. The mind must strain to **apprehend**
  This dual weight: what's possible, **actual**.

  ---

  **Envoi**

  The **actual**, fixed point, no longer **contingent**,
  We **apprehend** with force that banishes **doubt**.
  All **conceivable** folds into this **place**.
