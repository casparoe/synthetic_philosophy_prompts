  ### **Humeanism vs. Anti-Humeanism: Universe Simulation**  
  **Goal:** Students experience the tension between *describing patterns* (Humean "cataloging") and *imposing governing rules* (anti-Humean "legislating") when confronting anomalies.  

  ---

  ### **Materials**  
  - **Grid:** A 5x5 grid drawn on a whiteboard (rows 0–4, columns 0–4).  
  - **Particles:** 4 colored magnets/sticky notes:  
    - 2 × Red (R1, R2)  
    - 2 × Blue (B1, B2)  
  - **Movement Rules (Hidden from students):**  
    - *Normal Behavior:* Red particles move **east** (→), Blue particles move **north** (↑) if the cell is within bounds.  
    - *Anomaly (Round 3):* One red particle moves **west** (←) instead of east.  

  ---

  ### **Setup**  
  - **Split class into two groups** (7 students each):  
    - **Group A (Catalogers):** *Only describe observed patterns.*  
      - *Task:* Summarize particle behavior after each round. No predictions allowed.  
    - **Group B (Legislators):** *Create universal laws.*  
      - *Task:* Write laws after Round 2 that apply to *all future states*.  

  ---

  ### **Timeline (75 mins total)**  
  1. **Introduction (5 mins):**  
     - Explain roles: "You’re scientists observing a tiny universe. Group A catalogs history; Group B governs its laws."  
     - Clarify: *No theory names yet!*  

  2. **Round 1 (Start State):**  
     - Place particles:  
       - R1: (1,1) | R2: (1,3)  
       - B1: (3,1) | B2: (3,3)  
     - **Task:** Both groups record positions.  
     - *Grid State:*  
       ```
       Row 0: [ · , · , · , · , · ]  
       Row 1: [ · , R1, · , R2, · ]  
       Row 2: [ · , · , · , · , · ]  
       Row 3: [ · , B1, · , B2, · ]  
       Row 4: [ · , · , · , · , · ]  
       ```  

  3. **Round 2 (Normal Behavior):**  
     - Move particles:  
       - R1 → (1,2) | R2 → (1,4)  
       - B1 ↑ (2,1) | B2 ↑ (2,3)  
     - **Task:** Groups update records.  
     - *Grid State:*  
       ```
       Row 0: [ · , · , · , · , · ]  
       Row 1: [ · , · , R1, · , R2]  
       Row 2: [ · , B1, · , B2, · ]  
       Row 3: [ · , · , · , · , · ]  
       Row 4: [ · , · , · , · , · ]  
       ```  

  4. **Group Work 1 (10 mins):**  
     - **Group A:** Write a summary of patterns (e.g., "Reds move east; blues move north").  
     - **Group B:** Draft laws (e.g., "All reds *must* move east; all blues *must* move north").  

  5. **Round 3 (Anomaly):**  
     - Move particles:  
       - R1 ← (1,1) ← **ANOMALY** (should be → to (1,3))  
       - R2 → (1,4) (edge, stays)  
       - B1 ↑ (1,1) | B2 ↑ (1,3)  
     - **Task:** Groups confront the anomaly.  
     - *Grid State:*  
       ```
       Row 0: [ · , · , · , · , · ]  
       Row 1: [ · , R1, · , B2, R2]  // R1 moved west; B1 and B2 at (1,1) and (1,3)  
       Row 2: [ · , · , · , · , · ]  
       ...  
       ```  

  6. **Group Work 2 (15 mins):**  
     - **Group A (Catalogers):**  
       - *Choice 1:* Expand summary (e.g., "Reds usually move east, but R1 moved west").  
       - *Choice 2:* "Exile" R1 (ignore it as an outlier to preserve the pattern).  
       - *Stakes:* **Completeness vs. Simplicity**. Exiling keeps the summary clean but loses data; expanding captures all facts but becomes messy.  
     - **Group B (Legislators):**  
       - *Choice 1:* "The universe malfunctioned" (law was broken).  
       - *Choice 2:* Amend the law (e.g., "Reds move east *unless at column 2*").  
       - *Stakes:* **Infallibility vs. Flexibility**. Admitting malfunction undermines the law’s authority; amending makes laws complex and ad hoc.  

  7. **Group Reports (10 mins):**  
     - Each group shares decisions and reasoning.  

  ---

  ### **Debrief (20 mins)**  
  Map student decisions to metaphysics:  
  1. **Humeanism (Group A):**  
     - Patterns are *descriptions* of history. Anomalies force a choice:  
       - *Expand summary?* → Patterns are "constant conjunctions" (no necessity).  
       - *Exile the particle?* → Laws are just summaries of regularities; outliers are statistical noise.  
     - **Weakness:** No *counterfactual support*. The catalog says nothing about what *would* happen in unobserved scenarios (e.g., "Would a new red particle move east?").  

  2. **Anti-Humeanism (Group B):**  
     - Laws *govern* behavior. Anomalies force a choice:  
       - *Universe malfunctioned?* → Laws are inviolable constraints (anomalies are "miracles").  
       - *Amend the law?* → Laws are prescriptive but revisable (like scientific theories).  
     - **Strength:** Laws support *counterfactuals* (e.g., "Any red particle *must* move east, even if unobserved").  
     - **Weakness:** Can’t simulate *modal necessity*. Students *chose* laws, but anti-Humeans see laws as mind-independent necessities.  

  3. **Key Tensions:**  
     - **"Must" vs. "Does":** Legislators imposed "must" (anti-Humean "governing"); Catalogers recorded "does" (Humean "summarizing").  
     - **Institutional vs. Brute Facts:**  
       - Group B’s laws are *institutional* (human-created rules).  
       - Group A’s patterns are *brute* (observed facts).  
       - **Metaphysical Q:** Are laws of nature more like Group B’s institutions (contingent, revisable) or "brute" necessities?  

  4. **What the Simulation Misses:**  
     - **Anti-Humean necessity:** Laws aren’t just human rules; they *constrain possibilities* (e.g., "No particle *could* violate the law").  
     - **Unactualized possibilities:** Real laws govern what *would* happen in non-actual scenarios (e.g., "If a particle were here, it would move east").  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Group B struggles to write laws without referencing "prediction."  
     - *Fix:* Emphasize: "Laws apply to *all times*, including futures you won’t see."  

  2. **Problem:** Groups miss the anomaly (e.g., assume R1 and B1 collided).  
     - *Fix:* Annotate moves: "R1 moved west to (1,1); B1 moved north to (1,1)."  

  3. **Problem:** Students debate physics (e.g., "Momentum!") instead of metaphysics.  
     - *Fix:* Redirect: "Forget mechanics; focus on *how you know* the rules."  

  4. **Problem:** Debrief runs overtime.  
     - *Fix:* Start debrief during reports (ask: "Why did you feel your choice was necessary?").  

  ---

  **Why This Works:** Students *feel* the cataloger’s desire for empirical simplicity vs. the legislator’s need for prescriptive authority. The anomaly forces them to confront what laws *are* before labeling theories.**
