answer: |-
  ## ReferentLock™ Terms of Service Agreement (v.3.7.1 - Fregean Compliance Build)

  **1. Definitions & Ontological Framework**  
  1.1. **"Reference" (Ref)** denotes the actual, objective entity utilizing the Service. This is the *Bedeutung* (e.g., the specific human being named Jane Doe, Tax ID #XXX-XX-XXXX). The Reference is singular, immutable, and exists independently of the Service.  
  1.2. **"Sense" (Sns)** denotes the specific mode of presentation (*Art des Gegebenseins*) associated with a Reference within the ReferentLock™ ecosystem. This includes, but is not limited to: profile pictures, usernames, bios, listed interests, connection graphs, and self-descriptive metadata (e.g., "Avid stargazer," "Jane from Accounting," "Philosopher-in-Training").  
  1.3. **"Profile"** is the structured collection of Senses constituting a User's digital presentation on ReferentLock™.  
  1.4. **"Referentially Null Entity" (RNE)** denotes a Profile claiming a Reference that demonstrably lacks objective existence in the spatio-temporal causal order (e.g., Pegasus, Sherlock Holmes, "My Successful Alter-Ego Gary"). RNEs are permitted under Clause 7.2 but are subject to distinct verification pathways and prominent ontological disclaimers.<sup>1</sup>  

  **<sup>1</sup>** *ReferentLock™ acknowledges that the cognitive value of an RNE Profile may be high ("Pegasus is a winged horse") despite its referential nullity. However, attempting to physically meet an RNE match voids all warranties.*

  **2. Uniqueness of Reference & Co-Reference Disclosure Mandate**  
  2.1. Each distinct Reference may possess only one primary ReferentLock™ Profile.  
  2.2. **Co-Reference Detection & Disclosure:** Should Users discover, or the ReferentLock™ Cognitive-Value Scoring Algorithm (CVSA - See Clause 10) infer, that two ostensibly distinct Profiles (Profile A: `StarryNightLover`, Sense: "Obsessed with the evening star"; Profile B: `DawnPatroller`, Sense: "Devotee of the morning star") actually share the *same Reference* (e.g., Venus), the Users are legally obligated:  
      2.2.1. To file a **Joint Mode-of-Presentation Disclosure (JMPD)** within 72 hours, formally linking the Profiles and detailing the distinct Senses under which the single Reference is presented.  
      2.2.2. To prominently display a "Co-Referential Entity" badge on both Profiles, visible to all potential matches.  
  2.3. Failure to comply with Clause 2.2 constitutes "Referential Obfuscation," a Tier 3 violation, resulting in immediate suspension of *both* Profiles pending JMPD arbitration and mandatory Sns-realignment counseling. Concealing co-reference is deemed philosophically hazardous and bad for engagement metrics.

  **3. Self-Identity Affirmation Protocol (SIAP)**  
  3.1. All Users must affirm the statement "I AM IDENTICAL TO MYSELF" (`a = a`) during initial registration and bi-weekly verification cycles.  
  3.2. **Cognitive Value Assessment:** The SIAP affirmation is assigned **Zero (0) Cognitive Value Points (CVPs)** by the CVSA. While tautologically true and referentially secure, it provides no new information (`Erkenntniswert`).  
  3.3. **Verification Impact:** Successful SIAP completion is necessary for Profile activation but is *insufficient* for earning any ReferentLock™ Verification Badges (e.g., "Verified Reference," "High-Value Sense"). Relying solely on `a = a` for verification is explicitly discouraged as philosophically impoverished and commercially non-viable. Users seeking badges must generate informative Senses (see Clause 10).

  **4. Hesperus/Phosphorus Update Protocol (H/P UP)**  
  4.1. **Scenario:** This protocol governs situations where a User discovers that a Reference they previously encountered under Sense `S1` (e.g., `HesperusLover89`, Sense: "Seeks partner for sunset planet-gazing") is identical to a Reference now encountered under Sense `S2` (e.g., `PhosphorusFanatic`, Sense: "Looking for sunrise astronomy buddy"), constituting an epistemic shift (`Hesperus = Phosphorus`).  
  4.2. **User Obligation:** Upon this discovery, the User MUST file an "Epistemic Realignment Notice" (ERN) via the ReferentLock™ dashboard.  
  4.3. **System Action:** ReferentLock™ will merge the historical interaction logs (`Rejections`, `Likes`, `Messages`) associated with S1 and S2 for the single Reference into a unified "Reference Timeline."  
  4.4. **Strict No-Refund Policy:** All actions taken prior to the ERN (e.g., purchasing a "SuperLike" for `PhosphorusFanatic` after rejecting `HesperusLover89`) ARE FINAL. **Rationale:** The *Reference itself* (`Venus`) remained constant; only the *Sense* (`evening star` vs. `morning star`) and the User's *knowledge* changed. ReferentLock™ facilitates access to References, not the correction of User epistemic states. Altering Senses does not constitute a change in the underlying service contract pertaining to the Reference.

  **5. Sense-Tracking & Data Acquisition**  
  5.1. ReferentLock™ employs proprietary **Sense-Tracking Cookies (STCs)** to monitor and log all modifications to a User's Profile Sense.  
  5.2. STCs record:  
      5.2.1. The precise semantic content added, removed, or altered (e.g., changing "banker" to "ethical financier," adding "dog mom," removing "aspiring poet").  
      5.2.2. The temporal context of each shift.  
      5.2.3. Inferred motivations for shifts (based on interaction patterns and CVSA analysis).  
  5.3. This data feeds the CVSA (Clause 10) and enables the generation of "Sense Evolution Reports" (available for purchase in the ReferentLock™ Insights Marketplace). STC data is classified as "High Epistemic Value" under our data policy.

  **6. The Cognitive-Value Scoring Algorithm (CVSA)**  
  6.1. ReferentLock™ utilizes the patented CVSA to quantitatively assess the informational worth (`Erkenntniswert`) of each Profile and its constituent Senses.  
  6.2. **Scoring Parameters:**  
      6.2.1. **Descriptive Density:** Points awarded for the number of unique, verifiable predicates attached to the Reference (e.g., "Neurosurgeon, Beekeeper, Speaks Klingon" > "Likes Music").  
      6.2.2. **Referential Specificity:** Higher scores for Senses narrowing down the Reference within logical space (e.g., "The only left-handed sous-chef at 'Le Bistro' on Tuesdays" > "Works in food").  
      6.2.3. **Novelty & Non-Tautology:** Penalties for SIAP-like statements (`a=a`) or generic platitudes ("I am human"). Bonuses for surprising or highly distinctive predicates.  
      6.2.4. **Co-Reference Avoidance:** Profiles flagged for potential hidden co-reference (Clause 2.2) receive a score penalty until a JMPD is filed. Profiles with the "Co-Referential Entity" badge are scored holistically across linked Senses.  
  6.3. **Impact:** CVSA Score directly influences Profile visibility in match feeds, eligibility for Verification Badges (Clause 3.3), and premium feature access. Low-CVP Profiles are deemed "Cognitively Redundant" and may be throttled.

  **7. Liability & Referential Guarantees (Lack Thereof)**  
  7.1. ReferentLock™ guarantees the logical *structure* of Sense and Reference separation, not the empirical accuracy of a User's claimed Reference or the truth-value of their Senses. We manage *presentation*, not ontology.  
  7.2. Profiles designated as RNEs (Clause 1.4) are used entirely at the User's own epistemological risk. ReferentLock™ disclaims all liability for existential crises, unmet expectations, or failed dates arising from interactions with RNEs.  
  7.3. **"Referrence" Mismatch Errors:** In rare cases of systemic ambiguity, the CVSA may temporarily flag a valid Reference as an RNE, or vice-versa ("Referrence Ambiguity Fault"). Users agree to submit to compulsory Fregean diagnostics during such outages and waive claims for emotional distress caused by temporary ontological uncertainty.  

  **BY CLICKING "I AGREE," YOU ACKNOWLEDGE YOU ARE THE OBJECTIVE REFERENCE ASSOCIATED WITH THIS REGISTRATION ATTEMPT, YOU COMPREHEND THE DISTINCTION BETWEEN SENSE AND REFERENCE AS ARTICULATED HEREIN, AND YOU CONSENT TO THE ONTOLOGICAL SURVEILLANCE GOVERNED BY THESE TERMS. FAILURE TO MAINTAIN REFERENTIAL STABILITY MAY RESULT IN PROFILE NULLIFICATION.**
