answer: |-
  Here’s a targeted session plan to shatter their Gettier complacency, structured to force confrontation with the **structural gap in justification**. The nested-testimony case is perfect if engineered precisely—I’ll refine it below.

  ---

  ### **Session Arc: Shattering "Gettier Lite"**
  **Core Goal:** Isolate *why* justification + truth + belief ≠ knowledge when luck *intervenes* between justification and truth.  
  **Non-Goal:** Solving Gettier (avoid post-1970 theories).

  #### **Stage 1: Re-Anchoring Justification (15 mins)**  
  **Idea to Cement:** Justification is *grounded in evidence/reasons*, NOT psychological confidence or social agreement.  
  - **Activity:** Brainstorm "justified false beliefs" (e.g., pre-1850s medical theories). Emphasize:  
    > *"Justification = having good reasons given available evidence, even if wrong. Knowledge demands more."*  
  - **Kill Misconception #1 ("Justification = strong belief"):** Here. Ask: *"Can you have weak belief but strong justification? (e.g., actuarial tables) Or strong belief with weak justification? (e.g., superstition)"*

  #### **Stage 2: The Gettier Gap in Miniature (20 mins)**  
  **Carrying Case - "The Accidental Theorem"**  
  > *Dr. Rigor, a renowned mathematician, attempts to prove Fermat’s Last Theorem is false. Her proof contains a subtle calculation error (e.g., misapplying modular arithmetic). By sheer luck, this error accidentally proves the theorem is* actually *false for a different, undiscovered reason (e.g., an unobserved corollary). Dr. Rigor believes her proof is sound and publishes.  
  >   
  > **Student Clara** reads Dr. Rigor’s paper. She verifies:  
  > - Dr. Rigor’s credentials are impeccable.  
  > - The paper appears in a top journal.  
  > - Clara understands the proof’s *structure* (but not the flawed step).  
  > She concludes: "The theorem is false."*  

  **Properties of the Case:**  
  | **Requirement**               | **Why?**                                  | **Avoids...**                |  
  |-------------------------------|-------------------------------------------|------------------------------|  
  | **No false lemmas**           | Dr. Rigor’s *premises* are true; her *inference* is flawed but accidentally truth-conducive. | "False premise" objections |  
  | **Intervening luck**          | Luck bridges the gap between Rigor’s flawed method and the truth. | Environmental luck (fake barns) |  
  | **Testimony chain intact**    | Clara’s justification relies on reliable testimony—*but the source is corrupted by luck*. | Closure problems            |  
  | **No accessible red flags**   | Clara lacks expertise to spot the error; all external signs point to reliability. | "She should’ve checked more!" |  

  **Question:** *"Clara has a justified true belief. Is this knowledge? Why/why not?"*  
  - **Force the gap:** *"Where exactly did luck act? Was it in Clara’s evidence, Rigor’s process, or the world’s state?"* (Answer: Rigor’s process)

  #### **Stage 3: Misconception Takedowns (20 mins)**  
  - **Misconception #2: "Checking more would fix it"**  
    **Kill here:** After presenting the case. Ask:  
    > *"Suppose Clara checks Rigor’s other papers (all correct), the journal’s reputation (stellar), and peer consensus (supportive). Does this* eliminate *the luck in Rigor’s proof? Or just add layers to the testimony chain?"*  
    → *Key: More checks don’t reach the locus of luck (Rigor’s inference).*  

  - **Misconception #3: "The problem is false premises"**  
    **Kill here:** When dissecting Rigor’s error. Stress:  
    > *"Rigor’s premises (axioms, data) are TRUE. Her reasoning is faulty but accidentally lands on truth. Clara’s belief isn’t based on a false step—she doesn’t even see the steps!"*  

  #### **Stage 4: The Structural Gap (10 mins)**  
  **Reveal the core:** Justification is *defeated by luck* when:  
  1. The agent’s evidence *supports* P,  
  2. P is *true*,  
  3. **BUT** the connection between (1) and (2) is *accidental* (not grounded in the justificatory process).  

  > *"Clara’s evidence supports her belief, but its truth-connection relies on Rigor’s fluke. Justification isn’t ‘transmitted’—it’s hijacked by luck."*

  ---

  ### **The Proof-of-Understanding Question**  
  **Ask:** *"Imagine Clara investigates further and learns Rigor’s proof was flawed—but never discovers the corollary that makes the theorem false. She now believes the theorem is false ONLY because of Rigor’s testimony (which she knows is based on a bad proof). Does she still* know *it’s false? Why/why not?"*  
  - **Correct answer:** No. Her belief is now unjustified—she has a defeater. This proves they see the *justification-truth link* as essential, not just truth + historical justification.

  ---

  ### **What to DEFLECT (and How)**  
  **Reject these topics:**  
  - **Reliabilism** ("Justification = reliable process")  
  - **Virtue Epistemology** ("Knowledge = cognitive virtue")  
  - **Safety/Sensitivity** ("Belief must track truth in close worlds")  

  **Deflection Script:**  
  > *"These are attempts to* solve *Gettier—but today we’re surgically dissecting the problem itself. If you don’t feel the bite of the gap, solutions will seem like overkill. Master the fracture before applying bandages."*  

  **Why:** These theories require grappling with modal logic, causation, or normativity—distracting from the core insight that *internalist justification can be structurally divorced from truth*. Introducing them now invites muddy "what-if" scenarios.

  ---

  **Why this works:** The nested case avoids Jones/10-coins fatigue while magnifying Gettier’s core—luck’s *interstitial* role. By fixing the testimony chain’s reliability and isolating luck to the source’s inference, you avoid environmental drift. Students must confront justification’s fragility when truth-connection is corroded by accident.
