prompt: |-
  Hi, I'm a technical reviewer for a county planning authority and I'm basically drowning in consultancy reports that use models with blatantly unrealistic assumptions—perfect rational actors, homogenous soil, zero transaction costs, that sort of thing. I've been trying to read up on Friedman's F-twist idea, that unrealistic assumptions are fine if the predictions come out right, but I can't just wave that around in a meeting. I need an actual procedure I can run in about 20 minutes per report to decide whether an unrealistic bit is harmless in the Friedman sense, or whether it's going to corrupt the prediction we're actually using for a planning decision.

  The procedure should be something I can apply without a philosophy background—ordered steps, specific questions to ask of the model, and a clear point where I have to make a value judgement rather than a factual one. I think there are probably three categories, not just two: (1) inessential idealisation where relaxing the assumption doesn't change the outcome, (2) essential but bounded distortion where the falsness is necessary for the model to run but its effect is calibrated, and (3) dangerous abstraction where relaxing it reverses or nullifies the result, especially in non-linear systems where small perturbations cascade. I want the steps to cover how to check robustness, what to do when the consultant hasn't run that check, and exactly where I sign off with 'accept', 'conditional', or 'reject for this policy purpose'.

  Please build this out properly: the questions in order, what counts as a sufficient answer, where teh procedure stops and hands over to judgement, and flag any misfires. Then apply it to three cases: (a) a fisheries stock model assuming all individuals are identical in growth rate predicting collapse in eight years; (b) a traffic-emission model assuming drivers instantly reroute with perfect information predicting a 30% drop; and (c) a biodiversity-offset model assuming perfect ecological substitutability between a destroyed wetland and a replacement site, where my manager actually wants me to approve it but the procedure probably forces a reject. For each, show me exactly how the steps play out.

  Also, be honest about what this procedure can't do—where it will fail or where I'm smuggling in values under the guise of method. And if the whole idea of operationalising Friedman's point for a planning reviewer is conceptually muddled—like if it was never meant to be used this way—just tell me plainly instead of dressing it up. Don't give me a bibliography or reading list; I haven't got time to chase papers, and half the point is that I need something I can use without searching anything up.
reasoning: |-
  Okay, the user is a technical reviewer for a county planning authority overwhelmed by consultancy reports with unrealistic assumptions. They mentioned models with perfect rational actors, homogenous soil, zero transaction costs, etc. They've read Friedman's F-twist but need a practical, step-by-step procedure to evaluate these assumptions quickly—about 20 minutes per report. They want a clear method to categorize assumptions into harmless, essential but bounded, or dangerous, and then decide whether to accept, conditionally accept, or reject the report.

  First, I need to understand their deeper needs. They're dealing with real planning decisions, so the stakes are high. Mistakes could lead to bad policies affecting the environment, traffic, or biodiversity. They need a reliable, efficient tool that doesn't require a philosophy background. Their three categories make sense: inessential idealization, bounded distortion, and dangerous abstraction. The procedure must include robustness checks, handling cases where consultants haven't done those checks, and clear decision points.

  The user also wants honesty about limitations. They don't want a bibliography; they need actionable steps. I should avoid academic jargon and keep it practical. They mentioned three specific examples: fisheries, traffic, and biodiversity models. Applying the procedure to these will show how it works in real scenarios.

  Building the procedure: Start with identifying the unrealistic assumption. Then assess its purpose—is it simplifying or fundamental? Check if the prediction depends on it. Look for robustness tests. If absent, see if sensitivity analysis is feasible. Categorize based on impact when relaxed. Finally, decide on acceptance. The categories should align with their three types. Judgment calls are needed when data is lacking.

  For the fisheries model: Assumption is identical growth rates. If relaxing it (adding variability) still shows collapse, it's inessential. But if variability delays collapse, it might be bounded or dangerous. Without robustness checks, it's conditional. Traffic model: Perfect rerouting. Real drivers don't do that. If the model hasn't tested imperfect info, and congestion feedbacks exist, it's dangerous—reject. Biodiversity: Perfect substitutability. Ecological studies show wetlands aren't interchangeable. Even with calibration, it's likely dangerous. Managerial pressure shouldn't override this.

  Limitations: The procedure can't handle complex interdependencies or novel models. Values sneak in when judging "acceptable error." Friedman's F-twist might not fit all cases, especially when predictions are unverified. The user must be aware that sometimes rejecting a model is necessary despite political pressure.

  I need to ensure each step is clear and sequential. Flag where judgment is required. For each case example, walk through the steps explicitly. Highlight when the procedure forces a reject despite managerial pressure, as in the biodiversity case. Emphasize that the method exposes hidden risks but can't eliminate all uncertainty.
answer: |-
  Here's a streamlined 20-minute review procedure based on your categories, designed for practical application without requiring external research. It focuses on **impact on the prediction relevant to the planning decision**.

  **The 20-Minute Unrealistic Assumption Triage Procedure**

  **Step 1: Identify & Isolate the Assumption (2 mins)**
  *   **Question:** What is the specific unrealistic assumption in this section/model? (e.g., "homogeneous soil," "zero transaction costs," "perfect rationality").
  *   **Sufficient Answer:** A clear, concise statement of the assumption. Flag it in the report.
  *   **Stop if:** The assumption isn't clearly stated or is buried. *Proceed tentatively or flag "unclear assumptions" as a major issue.*

  **Step 2: Assess Purpose & Dependence (3 mins)**
  *   **Question A (Purpose):** Why is this assumption made? (Look for: computational simplicity, data unavailability, foundational theory).
  *   **Question B (Dependence):** Does the *key prediction relevant to our planning decision* (e.g., "collapse in 8 years," "30% drop") **fundamentally depend** on this assumption being exactly true? Or is it just a simplification for setup?
  *   **Sufficient Answer:** A plausible reason (even if weak) and a clear "yes" or "no" to dependence based on model logic/structure. *If "no" to dependence, likely Category 1.*
  *   **Stop if:** The purpose is entirely unclear or the dependence is ambiguous. *Flag "critical assumption dependence unclear" – this leans towards Category 3 (Dangerous).*
  *   **Judgement Call:** Initial assessment of dependence.

  **Step 3: Hunt for Robustness Checks (5 mins)**
  *   **Question:** Did the consultant explicitly test what happens when this assumption is relaxed? (Look for: sensitivity analysis, scenario testing, error bounds, discussion of empirical evidence validating the prediction *despite* the assumption).
  *   **Sufficient Answer:**
      *   **Yes (Robust):** Results show prediction holds (within acceptable bounds) when assumption is varied realistically (e.g., collapse still occurs between 7-10 years with growth rate variation). *Likely Category 1 or 2.*
      *   **Yes (Not Robust):** Prediction changes significantly or becomes highly uncertain when assumption is relaxed (e.g., drop falls to 5-15% with imperfect information). *Likely Category 3.*
      *   **No:** No testing performed.
  *   **Stop if:** Robustness check is absent. *Proceed to Step 4.*

  **Step 4: Feasibility of Mental Robustness Check (5 mins) - *If Step 3 = "No"***
  *   **Question A (Direction):** If I relax this assumption towards reality (e.g., add some growth rate variation, add some transaction costs, assume imperfect information), what is the *qualitative direction* of the impact on the key prediction? (e.g., Will collapse likely happen *sooner*, *later*, or *uncertain*? Will the emission drop likely be *smaller*, *larger*, or *uncertain*?).
  *   **Question B (Magnitude):** Based on domain knowledge, is the expected impact *small* (likely within the margin of error of the prediction), *moderate but bounded* (changes the number but not the qualitative outcome significantly), or *large/potentially reversing* (could nullify or reverse the prediction)?
  *   **Sufficient Answer:** A reasoned directional impact and a magnitude estimate ("small," "moderate/bounded," "large/reversing").
  *   **Judgement Call:** Requires your technical knowledge of the system. *Be conservative.* If unsure, lean towards "large/reversing".
  *   **Stop if:** The impact direction is truly unknowable without complex modeling. *This leans strongly towards Category 3 (Dangerous).*

  **Step 5: Categorize & Conclude (5 mins)**
  *   **Apply Categories:**
      *   **Category 1 (Inessential Idealisation):** Prediction doesn't fundamentally depend on it (Step 2B = No) OR Robustness checks show negligible impact (Step 3 = Yes Robust).
      *   **Category 2 (Essential Bounded Distortion):** Prediction depends on it (Step 2B = Yes), BUT robustness checks show the impact of relaxing it is *moderate, bounded, and quantifiable* (e.g., collapse window is 7-10 years instead of 8, drop is 20-35% instead of 30%), and the bounded range is *still useful for decision-making*. **Key:** The bounds are *provided* and *defensible*.
      *   **Category 3 (Dangerous Abstraction):** Prediction depends on it (Step 2B = Yes) AND:
          *   Robustness checks show large/reversing impact (Step 3 = Yes Not Robust), OR
          *   No robustness checks AND mental check suggests large/reversing impact (Step 4B = Large/Reversing), OR
          *   The assumption masks critical heterogeneity, feedback loops, or thresholds relevant to the decision (e.g., perfect substitutability ignores irreplaceable functions).
  *   **Recommendation:**
      *   **Accept:** Category 1 assumptions. The report's core prediction is likely valid for the decision *despite* this assumption.
      *   **Conditional:** Category 2 assumptions OR Category 1/3 where robustness is *plausible but not demonstrated*. Require: "The prediction [state prediction] is contingent on assumption [X] holding approximately. Consultant must provide sensitivity analysis/variance bounds for this assumption OR justification for bounded impact using [specific data/method] before final approval." *Specify exactly what's needed.*
      *   **Reject for this policy purpose:** Category 3 assumptions. "The core prediction [state prediction] is critically sensitive to unrealistic assumption [X]. Relaxing this assumption realistically could fundamentally alter the prediction, making the model's output unreliable for informing decision [specific decision point]." *State the specific policy purpose it fails.*

  **Key Limitations & Misfires:**

  1.  **Hidden Dependencies:** Fails if multiple unrealistic assumptions interact non-linearly (the procedure treats them singly). A model full of Cat 1 assumptions might still be Cat 3 overall.
  2.  **"Acceptable Error" is Value-Laden:** Judging "small," "moderate/bounded," or "useful for decision-making" (especially in Cat 2) **smuggles in your values/risk tolerance.** What's acceptable for a park vs. a chemical plant?
  3.  **Novel Systems:** Struggles with models predicting outcomes in unprecedented situations (e.g., new tech, extreme climate) where domain knowledge for Step 4 is weak.
  4.  **Calibration Mirage:** May misclassify a Cat 3 as Cat 2 if a model is "calibrated" but calibration data *also* relies on the unrealistic assumption or ignores crucial dynamics masked by it.
  5.  **Ignores Mechanism:** Friedman prioritized *predictive power* over *realistic mechanisms*. This procedure implicitly requires *some* plausible link between the mechanism (even if simplified) and the prediction. A model predicting accurately via pure coincidence (mechanism totally wrong) would pass Step 3/4 if robust by chance – but you have no way to know. This is a core tension.
  6.  **Time Crunch Limits Depth:** Complex non-linearities might be missed in 20 mins. Step 4 is inherently rough.
  7.  **Friedman's Limits:** Friedman argued for judging models *solely* by predictive accuracy. You need to judge *potential* accuracy *before* seeing outcomes, based on assumptions. This *is* a conceptual stretch, but necessary for *ex ante* policy review.

  ---

  **Application to Cases:**

  **Case (a): Fisheries Stock Model (Identical Growth Rate -> Collapse in 8 years)**
  1.  **Assumption:** All fish have identical growth rates.
  2.  **Purpose/Dependence:** Simplification (likely). **Dependence:** Probably **Yes** - growth rate directly impacts biomass projections and critical thresholds for collapse.
  3.  **Robustness Check?** (Scan report): Likely absent in standard models. Assume *No*.
  4.  **Mental Robustness Check:**
      *   *Direction:* Introduce growth rate variation (reality). Faster growers get caught sooner? Slower growers delay reproduction? Net effect on predicted collapse timing is **Uncertain** (could be sooner or later), but likely introduces **variability**.
      *   *Magnitude:* **Potentially Large/Reversing.** Biological evidence: Variation provides resilience. High variation *could* delay collapse significantly (some fish resistant, reproduce under pressure) OR accelerate it (if size-selective fishing). Uncertainty becomes large. Non-linear population thresholds amplify this.
  5.  **Categorize:** **Category 3 (Dangerous Abstraction).** Dependence is high, no robustness check, mental check shows large potential impact and increased uncertainty on the key prediction (timing/occurrence of collapse).
  6.  **Recommendation:** **Reject for policy purpose** (setting catch limits based on 8-year collapse prediction). "The prediction of collapse in exactly 8 years is critically sensitive to the unrealistic assumption of identical growth rates. Realistic variation in growth rates introduces significant uncertainty regarding both the timing and certainty of collapse, making this specific prediction unreliable for setting management policy. Sensitivity analysis incorporating growth rate variability is required."

  **Case (b): Traffic-Emission Model (Perfect Rerouting -> 30% Drop)**
  1.  **Assumption:** Drivers instantly reroute with perfect information.
  2.  **Purpose/Dependence:** Foundational for many traffic assignment algorithms. **Dependence:** **Absolutely Yes.** The entire predicted drop relies on optimal rerouting.
  3.  **Robustness Check?** (Scan report): Look for scenarios with: information delay, compliance rates, bounded rationality, network familiarity. Likely *Absent* (common omission).
  4.  **Mental Robustness Check:**
      *   *Direction:* Introduce imperfect info (reality). Drivers react slower, have incomplete knowledge, follow habits/satnav errors. Result: **Less efficient rerouting, smaller drop in congestion/emissions.**
      *   *Magnitude:* **Large/Reversing.** Empirical traffic studies consistently show predicted benefits from perfect rerouting are *overstated*, often significantly (e.g., 30% drop might be 10-15% in reality). Congestion feedback loops amplify inefficiencies. Potential for "rat-running" creating new local problems.
  5.  **Categorize:** **Category 3 (Dangerous Abstraction).** High dependence, no robustness check, mental check + domain knowledge show a large, negative impact on the predicted drop magnitude.
  6.  **Recommendation:** **Reject for policy purpose** (relying on a 30% emission drop for air quality compliance/planning). "The predicted 30% emission drop critically depends on instantaneous, perfect rerouting behavior by all drivers. Real-world driver behavior involves significant delays, imperfect information, and habit, which consistently lead to substantially lower congestion reductions than models assuming perfect rationality predict. The model output overstates the likely benefit and cannot be relied upon without validation against observed rerouting behavior or robust sensitivity analysis incorporating friction."

  **Case (c): Biodiversity-Offset Model (Perfect Ecological Substitutability -> Offset Approved)**
  1.  **Assumption:** Perfect ecological substitutability between destroyed wetland and replacement site.
  2.  **Purpose/Dependence:** Foundational for the *concept* of like-for-like offsetting. **Dependence:** **Absolute Yes.** The approval hinges entirely on this being true.
  3.  **Robustness Check?** (Scan report): Look for: Site-specific condition assessments, functional equivalence metrics (not just area/habitat type), long-term viability assessment, recognition of unique features. Likely *Absent* or superficial ("same habitat type mapped").
  4.  **Mental Robustness Check:**
      *   *Direction:* Relax assumption (reality). Wetlands differ hugely in hydrology, soil, connectivity, species composition, age, micro-topography, contaminant history, surrounding landscape. Result: **Loss of unique functions, species, resilience; failure to achieve 'no net loss'.**
      *   *Magnitude:* **Large/Reversing.** Ecology shows substitutability is *rarely* perfect. Small differences can lead to collapse of specific species or functions. Time lags for maturity are significant. Destroyed wetland might have irreplaceable cultural/hydrological value. "Success" is often measured by area, not function.
  5.  **Categorize:** **Category 3 (Dangerous Abstraction).** The core premise of the model/justification (offset works) is the unrealistic assumption. No robustness check. Mental check + overwhelming ecological consensus show the assumption is fundamentally flawed for achieving true no net loss, especially for complex wetlands. *Calibration is meaningless here – you can't calibrate away uniqueness.*
  6.  **Recommendation:** **Reject for policy purpose** (approving the destruction based on this offset). "The model's conclusion that the offset site provides perfect substitutability is based on a dangerously unrealistic assumption. Wetlands are highly heterogeneous ecosystems, and perfect functional replacement is ecologically implausible. This model masks the high likelihood of irreversible net loss of biodiversity and specific ecosystem functions/services unique to the original site. Approval based solely on this model is not scientifically defensible. A detailed site-specific assessment of functional equivalence and viability is essential." *(This is where the procedure forces the reject despite managerial pressure)*

  ---

  **Final Honesty Check:**

  *   **Conceptual Muddle?** Yes, a bit. Friedman wanted us to ignore assumptions if predictions *proved* accurate. You *must* judge assumptions *before* seeing outcomes. This procedure tries to operationalize "How likely is this assumption to *prevent* accurate prediction?" based on sensitivity and domain knowledge. It's not pure Friedman, but it's the best pragmatic filter for your role.
  *   **It's a Triage Tool:** It flags obvious dangers and forces consultants to justify critical simplifications. It won't catch every subtle error, but it will prevent the most egregious uses of unrealistic assumptions from sliding through unchallenged.
  *   **Values are Inescapable:** The "acceptable error" judgement in Cat 2 and the decision to reject in Cat 3 involve your professional risk assessment and values about conservation, public safety, etc. The procedure makes these judgement points *explicit* rather than hidden. Own them.
  *   **Use Consistently:** Apply the same standard to reports supporting outcomes you like vs. dislike. The manager wanting (c) approved is the *exact* scenario where this procedure is most valuable.
