  We are creating an exam question for an upper-level undergraduate philosophy of mathematics course. The topic is the epistemics of probabilistic heuristics in number theory. The question should test the students' ability to articulate when a presumption-of-independence heuristic confers justification on a conjecture, using the contrast between the twin prime conjecture (where the heuristic was fixable) and the Mertens conjecture (where the heuristic was misleading) as a springboard.

  The deliverables are:
  1. The exam question itself.
  2. A model answer of about 500 words.
  3. A marking scheme as a markdown table with five rows, each row corresponding to a must-hit point. The table should have columns: Point, Marks, What full marks requires, How candidates typically blow it.

  Exam Question:

  ```
  Question 5 (20 marks, 90 minutes)

  In number theory, probabilistic heuristics often treat arithmetic events (like "n is prime") as if they are independent random events. This approach has led to both successful and unsuccessful justifications for conjectures. For example:

  - The twin prime conjecture: The initial heuristic treated the primality of n and n+2 as independent events with probability 1/log n each, yielding the correct order of magnitude for the twin prime counting function but an incorrect constant. Hardy and Littlewood corrected the constant by accounting for dependencies (e.g., modulo small primes).

  - The Mertens conjecture: Heuristic arguments and extensive numerical evidence (up to very large bounds) suggested the conjecture was true, but it was proven false. Similarly, the comparison between π(x) and li(x) flips infinitely often despite appearing settled for computable ranges.

  Drawing on these cases and any other relevant examples, address the following:

  (a) When does a presumption-of-independence heuristic actually confer justification on a conjecture?

  (b) What does the difference between the twin prime case (where the heuristic was fixable) and the Mertens conjecture case (where the heuristic was misleading) tell us about the epistemic status of such heuristics?

  In your answer, you should articulate a general criterion for when such heuristics are justified, and explain why numerical evidence alone (even to very large bounds) cannot substitute for a thorough analysis of dependencies. You may illustrate your answer with an example of your own choosing.

  (Your answer should be approximately 500 words.)
  ```

  Model Answer:

  ```
  Probabilistic heuristics in number theory, which model arithmetic events as independent random variables, can provide varying degrees of justification for conjectures. The key to assessing their epistemic force lies in the systematic identification and handling of dependencies. Such heuristics confer justification when they account for all significant dependencies that could affect the outcome, especially those arising from modular arithmetic constraints at small primes. In contrast, when dependencies are overlooked or deferred to large scales (beyond computational reach), heuristics may be misleading.

  The twin prime case exemplifies a fixable heuristic. Initially, treating primality of n and n+2 as independent ignored obvious dependencies: if n is odd, n+2 is also odd, and both are excluded from being divisible by small primes. Hardy and Littlewood's correction incorporated these dependencies via local factors (like the correction for mod 3: one of every three pairs is excluded because either n or n+2 is divisible by 3). This adjustment transformed a rough heuristic into a precise conjecture, justified because the dependencies were finite, enumerable, and their effects could be computed.

  Conversely, the Mertens conjecture failure reveals a deeper pitfall. The heuristic assumed that the Möbius function μ(n) behaves like a random coin flip (±1 with equal probability), leading to the conjecture that the Mertens function M(x) grows no faster than O(x^{1/2}). Numerical evidence up to 10^14 supported this, but the conjecture is false. The error arose because the heuristic missed long-range dependencies: the accumulation of small biases in the prime factorization, particularly from zeta function zeros, which cause M(x) to occasionally exceed x^{1/2}. These dependencies are not locally computable; they involve global harmonic analysis and are deferred to infinity.

  The critical distinction is whether the dependencies are finite and local (as in twin primes) or infinite and global (as in Mertens). A heuristic is justified only when it methodically addresses all potential dependencies at every scale, not just up to a computationally feasible bound. Numerical evidence is insufficient because it cannot detect oscillations or biases that manifest only at immense scales. For instance, in the π(x) vs. li(x) case, the heuristic assumed independence in prime occurrences, but the actual distribution is influenced by the Riemann zeta function's zeros, leading to the Skewes number phenomenon where li(x) - π(x) changes sign.

  As a further example, consider Goldbach's conjecture. The heuristic treats each even number n as having independent chances for n-p being prime for primes p < n. This heuristic is bolstered by accounting for local dependencies (e.g., modulo small primes), and it aligns with vast numerical evidence. However, without a proof, we remain cautious because the conjecture could be false due to an undetected global dependency (e.g., an unexpected conspiracy among primes at some astronomical n).

  In conclusion, a presumption-of-independence heuristic confers justification when it exhaustively identifies and corrects for dependencies, particularly those at small moduli. The twin prime case shows that such corrections are possible for local dependencies, while Mertens warns that global dependencies can invalidate even well-supported heuristics. Thus, the heuristic's epistemic value hinges on the comprehensiveness of the dependency analysis, not the volume of numerical data.
  ```

