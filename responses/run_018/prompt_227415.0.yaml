answer: |-
  ### Exam Question  
  **Question 5 (20 marks; suggested time: 90 minutes)**  
  Number theorists frequently use probabilistic heuristics that treat arithmetic properties (e.g., primality) as independent random events to justify conjectures. These heuristics sometimes succeed (e.g., the corrected Hardy-Littlewood model for twin primes) but sometimes fail catastrophically (e.g., the Mertens conjecture, which held numerically beyond \(10^{14}\) but is false).  

  Drawing on these cases:  
  **(a)** Articulate a general criterion for when a presumption-of-independence heuristic *justifies* a conjecture, focusing on epistemic considerations.  
  **(b)** Explain how the difference between the twin prime case (heuristically fixable) and the Mertens case (heuristically misleading) clarifies the limits of such heuristics.  
  **(c)** Illustrate your criterion with a new example (e.g., Goldbach’s conjecture, prime gaps, or another case of your choice).  

  Your answer must address:  
  - Why numerical evidence alone cannot overcome the epistemic weaknesses of these heuristics.  
  - The role of enumerating and excluding dependencies (local or global).  
  *(Assume familiarity with twin primes/Mertens from lectures. ~500 words.)*  

  ---

  ### Model Answer (Approx. 500 words)  
  Probabilistic heuristics in number theory confer justification only when they systematically account for *all significant dependencies* at play. The key epistemic criterion is: **A heuristic justifies a conjecture if it identifies and corrects for *every known source of dependence* (especially local modular constraints), and no unenumerated global dependencies exist that could accumulate beyond computational bounds.** Numerical evidence alone is insufficient because dependencies can oscillate or manifest at scales far exceeding computable limits, creating false confidence.  

  The twin prime and Mertens cases illustrate this criterion’s application. In the twin prime heuristic, treating primality of \(n\) and \(n+2\) as independent ignored *local* dependencies (e.g., neither can be divisible by small primes like 2 or 3). Hardy-Littlewood’s correction succeeded because these dependencies are **finite, enumerable, and correctable via modular arithmetic** (e.g., adjusting probabilities for congruences modulo small primes). Here, the heuristic is fixable because all dependencies arise from finite, local constraints.  

  In contrast, the Mertens conjecture—which posited \( |M(x)| < \sqrt{x} \) based on modeling the Möbius function \(\mu(n)\) as a random coin flip—failed despite vast numerical support. The heuristic ignored **deferred global dependencies**: the accumulation of biases from zeta-function zeros, which induce oscillations in \(M(x)\) that only exceed \(\sqrt{x}\) at colossal, uncomputable scales (e.g., \(x \sim 10^{40}\)). Unlike the twin prime case, these dependencies are **non-local**; they emerge from infinite harmonic series and cannot be enumerated through modular arithmetic alone. Consequently, the heuristic conferred *false* justification because it omitted an entire class of unmanaged dependencies.  

  This distinction reveals that heuristics are epistemically sound only when dependencies are both *exhaustively enumerated* and *locally corrigible*. Numerical evidence cannot substitute for this analysis, as seen with \(\pi(x)\) vs. \(\text{li}(x)\): Skewes’ number proves that \(\text{li}(x) - \pi(x)\) changes sign infinitely often despite appearing settled for all computable \(x\).  

  To illustrate, consider **Goldbach’s conjecture** (every even \(n > 2\) is a sum of two primes). The heuristic treats primes as independent, assigning \(n\) a probability \(\sim n / \log^2 n\) of satisfying Goldbach. This *seems* justified because known dependencies (e.g., modulo small primes) are corrected in refined models (e.g., Hardy-Littlewood). However, justification remains provisional: an unenumerated global dependency (e.g., an unexpected prime correlation at astronomical scales) could violate Goldbach, making numerical verification (even to \(10^{30}\)) insufficient. Thus, the heuristic justifies only conditionally—pending exclusion of such global factors.  

  In essence, heuristics justify when dependencies are local and enumerated; they mislead when dependencies are non-local, deferred, or omitted.  

  ---

  ### Marking Scheme  
  | Point | Marks | What full marks requires | How candidates typically blow it |  
  |-------|-------|--------------------------|----------------------------------|  
  | **Criterion articulation** | 5 | Clear statement that justification requires enumerating/excluding dependencies (local and global), *not* numerical evidence. | Vague phrasing (e.g., "heuristics work when dependencies are controlled") or overemphasizing numerical evidence. |  
  | **Twin prime analysis** | 4 | Explains Hardy-Littlewood’s fix as correcting *finite, enumerable, local* dependencies (e.g., modulo small primes). | Claims the initial heuristic "worked" unmodified or misses that corrections address *modular constraints*. |  
  | **Mertens analysis** | 4 | Attributes failure to *non-local/deferred dependencies* (e.g., zeta zeros) that evade enumeration and numerical checks. | Blames "randomness" without specifying dependency types or misattributing to computational limits alone. |  
  | **Limits of numerical evidence** | 4 | Argues that numerical checks are weak against oscillatory/deferred dependencies (e.g., Skewes’ number, zeta zeros). | Asserts "we can’t compute forever" without mathematical reasoning (e.g., oscillatory error terms). |  
  | **Example application** | 3 | Chooses a valid case (e.g., Goldbach) and applies the criterion (e.g., "local deps corrected, global risks remain"). | Superficial example (e.g., "Goldbach works for small n") without dependency analysis. |  

  **Total: 20 marks**
