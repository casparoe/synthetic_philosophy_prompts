  Hey, so I'm in this weird spot with my roommate. We run a tiny workshop where we design custom boardgame pieces—like weird-shaped meeples with hand-painted details. Recently we started using two different automatd assembly pods to copy my painting technique exactly. One pod runs on neural-net vision, the other uses old symbolic logic rules, but both reproduce my brushstrokes and color choices so well that customers literally can't tell the difference. My roommate insists that if we replace me with these pods, it's no longer 'our workshop' because there's no actual human craft behind the pieces. I think that's just nostalgia—if the job being done is exactly the same and the output is identical, the identity of the workshop shouldn't depend on whether carbon or silicon is running the show. But her argument is sticking in my head and I can't shake it.

  I'm taking an intro philosophy course right now and we covered some stuff about minds and computers, which is probably why I'm overthinkng this. Could you act like an actual philosopher of mind—someone who really knows the literature, not just a chatbot giving roommate advice? Before you answer, please do a quick brainstorm of the strongest ways to defend her intuition without falling back on 'humans have souls.' I need you to clearly seperate what is settled among experts from what is genuinely contested, and don't present a minority view as the consensus. Give me exactly five numbered points, each one or two sentences max, with no intro or conclusion. Also, please don't suggest books or articles since I can't access them right now.
