answer: |-
  You've hit on a profound tension at the heart of modern marriage law – and your questions are incredibly sharp. Let's break this down step-by-step, reconstructing the implicit philosophy behind the current system and examining its coherence.

  **Brainstorming the Current System's Implicit Philosophy:**

  1.  **The Romantic Pair-Bond as Foundational:** The core assumption is that the primary, exclusive, lifelong, romantic/sexual partnership between *two individuals* is the fundamental unit of intimacy, care, and social stability worthy of this unique state recognition and bundled benefits. This elevates romantic love (ideally monogamous) above other profound relationships (deep friendship, chosen family, multi-generational care).
  2.  **The Nuclear Household Model:** The system assumes the "household" needing economic and legal stabilization is primarily *this romantic pair*, potentially with children. It simplifies administration for the state (taxes, benefits, census) by using this easily identifiable unit.
  3.  **Gender Complementarity (Historically Embedded):** While same-sex marriage legally rejects this *explicitly*, the *structure* of "two persons" still echoes the historical foundation of marriage as an institution regulating procreation, property transfer between families, and the gender-based division of labor (husband/breadwinner, wife/homemaker). The "two-person" limit implicitly resists models that fundamentally challenge this dyadic structure, even without gendered roles.
  4.  **The "Status" vs. "Contract" Distinction:** Marriage is treated as a unique legal *status*, not merely a customizable contract. This status comes with a pre-defined package of rights and duties. The assumption is that this standardized package reflects the *inherent nature* and *social purpose* of this specific type of relationship. It implies a "one size fits all" approach is appropriate for the "special" relationship.
  5.  **Symbolism & Social Sanction:** The ceremony requirement reinforces the idea that marriage is not just a legal transaction but a *public, symbolic act* of commitment, solemnized by an authority (state/church). This signifies societal recognition and blessing of this specific bond, distinguishing it from other relationships.
  6.  **Administrative Convenience & Path Dependency:** Bundling benefits is administratively simpler for governments and institutions (hospitals, courts, employers) than managing a complex web of individual contracts. The current system also builds upon centuries of legal precedent centered on the dyadic model.

  **Coherence and Contradictions:**

  1.  **Incoherence 1: The Romance-Care Mismatch:** If the *stated goal* is promoting stable environments for care (of partners, children, elderly), the system is incoherent. Why should a lifelong platonic partnership between siblings providing mutual care, or a committed care triad supporting an elderly parent, be excluded from the *legal and financial tools* supporting that care, simply because it lacks romance?
  2.  **Incoherence 2: The "Specialness" Contradiction:** The system claims marriage is unique due to the *nature* of the romantic pair-bond. Yet, it grants concrete, material benefits (tax breaks, inheritance, medical rights) unavailable to other relationships. This confuses the *intrinsic value* of the relationship with the *extrinsic benefits* bestowed by the state. Are the benefits recognizing something inherent, or are they *creating* the special status?
  3.  **Incoherence 3: The Bundle Problem:** Bundling assumes all these rights (tax, inheritance, medical) are *necessarily and exclusively* linked to this one type of relationship. This is demonstrably false. An elderly aunt and niece cohabitating might desperately need medical decision rights and inheritance protection for each other, but have no need for spousal tax breaks. Forcing the bundle creates absurdities.
  4.  **Incoherence 4: Equality vs. Limitation:** Same-sex marriage extended the *form* of the existing dyadic model to a new group, achieving formal equality within that structure. However, it simultaneously reinforced the *exclusion* of non-dyadic relationships (polyamorous families, care networks) and non-romantic primary bonds. Equality was achieved within a potentially limiting framework.
  5.  **Coherence Points:** The system *is* coherent *if* you accept its core, often unstated, premise: **The state has a compelling interest in privileging and stabilizing *romantic, exclusive, dyadic partnerships* as the optimal (or only legitimate) foundation for family life, child-rearing, and social order, and using a standardized bundle is the most efficient way to do this.** Its coherence rests on this specific normative vision of family.

  **Shifting to a "Customizable Care Contract" Model (Care-Network Modularization):**

  This model rejects the primacy of the romantic dyad and the status bundle. Its core philosophy is: **The state's role is to facilitate individuals in building stable, caring networks by providing accessible, modular legal tools. The value of a care relationship lies in the care provided and mutual commitment, not its romantic or dyadic nature.**

  **What Would *Have* to Change in the Law:**

  1.  **Abolish "Marriage" as a Unique Legal Status:** Marriage would cease to exist as a distinct legal category with automatic rights. The state would no longer define or license a specific *type* of relationship as uniquely worthy.
  2.  **Create Modular Legal Contracts:** The government would offer a suite of standardized, optional contracts that individuals could enter into with *any* consenting adult(s), regardless of relationship type:
      *   **Co-Habitation/Economic Partnership Agreement:** For shared finances, property ownership, bills, debt responsibility (replaces aspects of marital property).
      *   **Medical Proxy/Advance Directive Registry:** Designate *specific individuals* to make medical decisions, visit in hospitals, access records. You could designate multiple people, with hierarchies or joint decision-making rules. Completely separate from any other contract.
      *   **Inheritance/Property Succession Contract:** Specify inheritance rights and property transfer upon death for specific individuals, superseding default next-of-kin rules.
      *   **Tax Partnership Agreement:** Allow *any* group of financially interdependent adults (sharing housing, bills, care responsibilities) to file joint taxes or access specific tax benefits based on demonstrable mutual support, not romantic status.
      *   **Parental Rights Agreements (More Complex):** Establish legal parentage, custody, visitation, and support obligations. This is the most complex area, requiring careful consideration of children's rights and stability, but could move beyond the automatic presumption favoring married biological/adoptive parents.
  3.  **Simplify Formation & Dissolution:** Significantly reduce formalities. Filing forms at a courthouse or online should suffice for most agreements. Dissolution processes would be tailored to the specific contracts involved (e.g., dissolving a medical proxy is simpler than unwinding complex shared property).
  4.  **Redefine "Next of Kin":** Default rules for inheritance or medical decisions without contracts would need updating, potentially prioritizing designated emergency contacts on file or documented care relationships.
  5.  **Reform Institutional Policies:** Hospitals, employers, tax authorities, courts, and social service agencies would need training and system updates to recognize and honor these diverse agreements instead of defaulting to "spouse."

  **Impact & Challenges:**

  *   **Empowerment & Flexibility:** Individuals could tailor legal protections to their actual lives – caring for an aunt, co-parenting with friends, sharing life with multiple partners.
  *   **Equity:** Recognizes the value of diverse care relationships beyond the romantic dyad.
  *   **Complexity:** Managing multiple agreements requires individual responsibility and potentially clearer legal guidance. Conflicts could arise between different contracts.
  *   **Cultural Shift:** Challenges deeply held beliefs about the "specialness" of romantic marriage and the nuclear family. Resistance would be significant.
  *   **Children's Rights:** Designing fair, stable systems for establishing parental rights and responsibilities outside the dyadic marriage model requires careful, child-centered legislation.

  **Conclusion:**

  The current marriage system presupposes that the exclusive romantic pair-bond is uniquely essential for social stability and deserving of a comprehensive state-bestowed status. While coherent on its own terms, it contains contradictions when examined against the stated goal of supporting care (exclusion of non-romantic/non-dyadic care networks) and the artificial bundling of unrelated rights.

  Shifting to a modular contract system based on actual care arrangements fundamentally rejects this presupposition. It argues that the state should provide tools to support *all* stable care networks, not privilege one specific form. This requires dismantling the unique status of marriage and replacing it with a flexible menu of specific, separable legal agreements accessible to any consenting adults engaged in mutual care and interdependence. It's a radical reimagining, moving from a state-defined *status* to individual-defined *contracts* for care. Your paper is tackling a crucial question about the very nature of how society recognizes and supports the relationships that sustain us – excellent work diving this deep!
