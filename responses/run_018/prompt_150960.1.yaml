  The air in the Vault of Echoes tasted like dust and forgotten ink. Elara ran a gloved finger along the spine of the *Annals of the Stone-Weavers*, its leather brittle. Outside, the rhythmic *thump-thump-thump* of the protest faltered. She’d shown them the carvings – Grath the Unbending defying the first Guildmasters, his chisel raised like a weapon. *"Be like Grath!"* she’d urged. Now, through the cracked obsidian window, she saw them: a dozen workers frozen mid-stride, faces contorted in rigid imitation of Grath’s defiant snarl, limbs locked in the exact angles of the frieze. Paralyzed by the monument. The *thumping* had stopped. Just stone men in ragged cloth, staring at nothing.

  Disgusted, Elara turned inward. The problem wasn’t defiance, but *loss*. The Guild was shredding tenancy pacts, erasing worker claims. She plunged into the sub-vaults, the realm of broken things. Every torn scrap mattered. She gathered fragments of contracts – water-stained, charred at the edges, seals ripped away. She piled them on her heavy oak desk: a mound of violated promises. Day bled into night. The pile grew, a precarious monument to preservation. The Guild’s latest eviction notice arrived for District Seven. Elara reached for a quill, then stopped. Which precedent applied? Which broken promise held the key? Her hand hovered over the chaotic mound, paralyzed by the sheer weight of the preserved past. Dust settled on her knuckles.

  Then came the hammering at the Vault door. Not workers. Guild Scribes, their faces smug behind polished gorgets. They held aloft a single, pristine document encased in crystal: the Founding Charter. "By Article Primus!" their leader bellowed, voice echoing off the archives, "All authority derives from this! Stand down, Archivist!" The crystal caught the weak light, dazzling. Monumental, untouchable, the shackle disguised as scripture.

  Elara looked down. Her hand, still hovering over the mound of broken contracts, trembled. Not with indecision now, but with a terrible, clarifying certainty. The past wasn’t a weapon to brandish or a hoard to protect. It was a chain, cold and heavy. Her gaze fell on the small brazier used for sealing wax, its coals faintly glowing. Not preservation. Not imitation. *Cutting.*

  She didn’t hesitate. She swept the pile of broken contracts aside. From beneath her robes, she drew a single, heavy scroll – her own, secret copy of the Founding Charter, painstakingly transcribed years ago. The Scribes roared, surging forward. Elara stepped to the brazier. The parchment hissed as it touched the coals. A bloom of hungry orange light swallowed the dense, black ink of Article Primus, curled the vellum edges into black lace. Heat seared her face, acrid smoke stung her eyes. The Guild’s crystal shield suddenly looked brittle, absurd against the living, destructive act. As the last fragment charred to feather-light ash, Elara felt the dust of centuries fall from her shoulders. The chain wasn't broken; it was *burned*. Her hands, blackened and stinging, felt startlingly, terrifyingly free. The frozen workers outside, the screaming Scribes, the decaying city – they were all just noise now. She breathed in the smoke. It tasted like the future.
