prompt: |-
  You are an expert in the metaphysics of mind with deep familiarity with debates about mental causation, physicalism, and explanatory practice. Before you answer, please think carefully and systematically: begin by briefly brainstorming the major responses to the causal exclusion argument—realization-based accounts, emergentist alternatives, and the distinction between causal efficacy and causal relevance—so that your analysis is anchored in the actual conceptual landscape rather than in generic summary.

  This question has become personally relevant to me over the past year. My parent was recently diagnosed with a progressive neurodegenerative disorder, and in the clinical and family conversations that have followed, I keep noticing people slide effortlessly between saying that “the brain damage caused the behavior” and that “her belief caused the action,” often within the same breath, without sensing any contradiction. That practical observation led me back to the philosophical literature, where I have now noticed a specific argumentative pattern that I cannot find a name for.

  Here is the pattern, observed across several discussions of mental causation. A philosopher wants to defend the causal power of mental properties—say, the belief that it is raining—while fully accepting that every physical event has a sufficient physical cause. They invoke a realization relation: the mental property is realized by, but not identical to, its neural substrate. When the exclusion argument is pressed—if the neural substrate does all the causal work, what is left for the mental property to do?—the defender introduces a careful distinction. The mental property is causally relevant (it figures in explanations, it tracks counterfactual dependencies, it is part of the constitutive story) but not causally efficacious in the same robust, productive sense as the physical realizer. The mental property “makes a difference,” but only in a derivative or structural way.

  The specific move comes next. Once this defensive distinction is in place and the exclusion threat is neutralized, the same philosopher—sometimes in the very same paper—will invoke the mental property in an explanation that clearly requires robust causal efficacy. They will say that the belief caused the action, not merely that the belief was realized by a neural state that caused the action. They do not explicitly revoke the defensive distinction; they do not announce a shift to an ordinary-language framework. They simply operate as if the mental property has direct causal power, enjoying all the explanatory benefits that the strict distinction was designed to protect.

  The pattern has three consistent features. First, a defensive distinction is introduced specifically to answer the exclusion argument. Second, that distinction is not applied consistently across explanatory contexts; it is suspended whenever it would be inconvenient. Third, the suspension is not acknowledged as a change in meaning or theoretical framework, so the philosopher retains the metaphysical respectability of the strict position together with the explanatory convenience of the loose one.

  This is not exactly equivocation, because the two uses are not randomly swapped; they are systematically correlated with whether the context is defensive or explanatory. It is not quite the motte-and-bailey, because there is not one defensible core and one indefensible extension—both the strict and the loose claims are defended, but they are defended in different argumentative rooms, so to speak. It is not merely changing the subject, because the very same mental property is at issue throughout.

  Does this oscillation have an established name in philosophy of mind? Is it recognized as a particular failure mode of realization-based non-reductivism—perhaps related to charges of “explanatory exclusion” or “causal exclusion by another name”—or is it closer to a general dialectical phenomenon, such as strategic ambiguity or context-sensitive theoretical integration? If there is no specific name, how should we characterize its structure: as a kind of unacknowledged framework shift, as a failure of theoretical coherence, or as something else? And what are its exact boundaries—does it apply only to realization-based responses, or can analogous patterns arise in emergentist or interactionist dualist frameworks?

  Please provide a careful, precise analysis. Identify the nearest established concepts, explain exactly how the described pattern differs from each, and either assign it to an existing category with full justification or propose a precise term and definition, complete with boundary cases that distinguish it from plain equivocation, motte-and-bailey, and ordinary explanatory pluralism. Do not provide bibliographies, reading lists, or citations; I need a conceptual carving, not a literature map.
