answer: |-
  Your observation targets a precise and under-discussed dialectical pattern in mental causation debates. It is **not** identical to established fallacies like equivocation or motte-and-bailey, nor is it merely explanatory pluralism. After analyzing its structure against the conceptual landscape, I propose it as **"dialectical double-dealing in causal ontology."** Below is a systematic characterization:

  ### Core Structure
  1.  **Defensive Strictness:** Against causal exclusion, the philosopher asserts a sharp distinction: mental properties are *causally relevant* (explanatory, counterfactual, constitutive) but lack *causal efficacy* (productive, transfer-of-energy, "spark"-like causation), which belongs solely to the physical realizer.
  2.  **Explanatory Laxity:** When offering positive explanations (e.g., "her belief *caused* the action"), they implicitly treat the mental property as possessing robust causal efficacy – the very notion denied defensively.
  3.  **Unacknowledged Oscillation:** The shift between (1) and (2) occurs without signaling a change in framework or meaning. The strictness of (1) protects against metaphysical objections, while the laxity of (2) secures the explanatory utility of folk psychology, creating an unstable hybrid position.

  ### Differentiation from Nearest Concepts
  *   **Equivocation:** Unlike random term-swapping, this is *systematic*: strictness *only* appears in defensive/metaphysical contexts, laxity *only* in explanatory/positive theory-building. The *same term* ("cause," "causal power") is used with different, context-dependent commitments, but the shift is patterned and purposeful.
  *   **Motte-and-Bailey (M&B):** Differs crucially:
      *   **M&B:** The "motte" (defensible strict claim) is a *retreat* from the desired but indefensible "bailey" (lax claim). The bailey is *abandoned* under pressure.
      *   **Double-Dealing:** *Both* strictness (under pressure) *and* laxity (in explanation) are *retained* and actively used. The lax claim isn't abandoned; it's shielded by the strict one. There's no retreat; there's *simultaneous deployment* in different contexts.
  *   **Explanatory Pluralism:** Legitimate pluralism *explicitly* acknowledges distinct explanatory frameworks (e.g., neuroscientific vs. intentional) without reducing one to the other or making strong metaphysical claims about causation within each. Double-dealing *implicitly* relies on distinct frameworks while *denying* their distinctness when pressed metaphysically, pretending to a unified causal ontology it doesn't possess.
  *   **Epiphenomenalism:** Strict non-reductive physicalism (NRP) *rejects* epiphenomenalism by asserting causal *relevance*. Double-dealing goes further: it *avoids* epiphenomenalism defensively via relevance, but then *smuggles in* efficacy explanatorily, exceeding what pure relevance licenses.

  ### Exact Boundaries and Scope
  *   **Primary Habitat:** This pattern is endemic to **realization-based non-reductive physicalism** (e.g., functionalism, role functionalism). It arises directly from the need to reconcile physical causal closure with mental causation using realization + relevance.
  *   **Emergentism:** Genuine emergentists (strong or weak) typically assert *novel causal powers* for emergent mental properties. While they might face exclusion arguments, they don't usually *deny* efficacy defensively only to *assume* it explanatorily – they claim it consistently (though perhaps problematically). Double-dealing requires the defensive *denial* of efficacy.
  *   **Interactionist Dualism:** Explicitly asserts mental efficacy, rejecting physical closure. No defensive denial of efficacy exists, hence no oscillation. Explanations straightforwardly invoke mental causes.
  *   **Reductive Physicalism:** Avoids the issue by identifying mental properties with physical properties, granting them the same efficacy. No distinction between relevance and efficacy is needed defensively.
  *   **Boundary Case - Anomalous Monism (AM):** Davidson's AM is susceptible. Defensively, mental properties lack strict nomological causal efficacy (reserved for physical descriptions), possessing only causal relevance via token identity. Yet, explanations like "her belief caused the action" sound robustly efficacious, and Davidson doesn't consistently signal a shift in "cause" meaning. This fits double-dealing.

  ### Characterization & Proposed Term
  *   **Name:** **Dialectical Double-Dealing in Causal Ontology** (or **Causal Double-Dealing**)
  *   **Definition:** A dialectical strategy in the metaphysics of mind where:
      1.  A philosopher defensively asserts a distinction between *causal relevance* (attributed to mental properties) and *robust causal efficacy* (reserved for physical properties/realizers) to answer the causal exclusion argument.
      2.  The same philosopher, within positive explanations, implicitly treats those mental properties as possessing robust causal efficacy, without acknowledging any shift in the causal concept employed.
      3.  This unacknowledged oscillation allows the retention of both the metaphysical defensibility secured by (1) and the intuitive explanatory power provided by (2), despite the tension between the commitments of (1) and (2).
  *   **Failure Mode:** It constitutes a **failure of theoretical coherence and integration**. The philosopher maintains two incompatible stances on the causal status of mental properties:
      *   *Stance 1 (Defensive):* Mental properties are *not* efficacious causes; only their realizers are.
      *   *Stance 2 (Explanatory):* Mental properties *are* efficacious causes (in the same sense as physical causes invoked in explanation).
      Crucially, the inconsistency is masked by the *unacknowledged context-sensitivity* of the causal concept. The failure lies in refusing to reconcile these stances or explicitly define distinct causal roles for distinct explanatory contexts, instead exploiting ambiguity for dialectical advantage.
  *   **Relation to Causal Exclusion:** This *is* a specific failure mode often underlying charges of "causal exclusion by another name" or "explanatory exclusion" leveled against NRP. The exclusion problem isn't truly solved; it's *finessed* by the double-dealing move, preserving mental causation only in an explanatorily useful but metaphysically unstable way.

  In essence, "dialectical double-dealing" captures the *strategic, unacknowledged use of two incompatible causal ontologies within the same theory*, leveraging context to avoid metaphysical objections while claiming explanatory success. It highlights a specific instability at the heart of many realization-based attempts to secure mental causation.
