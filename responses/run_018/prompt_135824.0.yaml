answer: |-
  Here's a conceptual map and decision tree grounded in concrete blame judgments, designed to sort positions based on *when reactive attitudes are appropriate*, not metaphysical labels. The tree uses diagnostic questions about cases to bypass jargon.

  ---

  ### **Logical Space Brainstorm: Key Axes & Named Positions**
  | **Scope of Exemption** | **Basis for Appropriateness** | **Normative Weight of Attitudes** | **Named Positions** |
  |------------------------|--------------------------------|-----------------------------------|---------------------|
  | Only severe incapacity (e.g., psychosis) | Practical/constitutive (needed for society) | Normatively justified | **Strawson's Exemption View** |
  | Incapacity + structural causes (e.g., trauma, oppression) | Moral reasons (fairness, control) | Normatively justified | *Unnamed/Underexplored* |
  | All actions (no exemptions) | Consequentialist (attitudes useful) | Instrumentally useful | **Schlick-type Pragmatism** |
  | All actions (no exemptions) | Metaphysical freedom required | Normatively justified | **Basic-Desert Retributivism** |
  | No actions (global exemption) | Metaphysical freedom impossible | Illusory/unjustified | **Hard Determinist Skepticism** |
  | Capacity-based (e.g., reasons-responsiveness) | Constitutive of moral agency | Normatively justified | **Reasons-Responsive Compatibilism** |
  | *Any scope* | Evolutionary/biological reflexes | Non-normative (like pain) | **Naturalist Non-Normativism** (e.g., Churchland-inspired) |

  *Empty/Unattractive Combinations*:  
  - **"Structural exemptions + attitudes never justified"**: Unstable (if structures undermine control, why retain attitudes?).  
  - **"Global exemption + attitudes normatively required"**: Incoherent (can't demand attitudes if no one is fit for them).

  ---

  ### **Decision Tree: "When Should Resentment Be Suspended?"**
  **Start with this concrete case**:  
  *Alex, raised in extreme abuse, impulsively commits violent assault with zero deliberation. Their psychologist confirms Alex lacks emotional regulation due to trauma.*

  #### **Question 1: Is resentment toward Alex inappropriate?**  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  
  - **It’s harder to feel but still appropriate** → Go to Q4  

  ---

  #### **Question 2 (If resentment is inappropriate): Why?**  
  - **"Because severe trauma/mental illness removes moral agency"** → **Strawson's Exemption View**  
    → *Awkward commitment*: Struggles to explain why *non*-psychotic structural causes (e.g., poverty-induced desperation) don’t also exempt.  
  - **"Because no one has ‘deep freedom’ (e.g., ultimate responsibility), so blame is always unfair"** → **Hard Determinist Skepticism**  
    → *Awkward commitment*: Must reframe all moral anger as irrational, even toward fully functional wrongdoers.  

  ---

  #### **Question 3 (If resentment is appropriate): Why?**  
  - **"Alex still had the capacity to recognize basic wrongness"** → **Reasons-Responsive Compatibilism**  
    → *Awkward commitment*: Must defend that traumatized people can "respond to reasons" enough to deserve blame.  
  - **"Desert doesn’t require freedom—it’s about moral balance"** → **Basic-Desert Retributivism**  
    → *Awkward commitment*: Blame justified even if the act was causally inevitable.  

  ---

  #### **Question 4 (If resentment is harder but appropriate): Should we suspend blame for social causes too?**  
  - **"No—only individual incapacity (e.g., psychosis) excuses"** → **Strawson's Exemption View**  
    → *Awkward commitment*: Arbitrary line between trauma-induced dysfunction and "normal" bad upbringing.  
  - **"Yes—oppression/trauma can undermine agency like illness"** → *Unnamed Position* (e.g., Structural Exemption)  
    → *Awkward commitment*: Risks over-exempting (e.g., "My upbringing made me do it" as universal defense).  
  - **"No—resentment is always appropriate because it’s a useful social tool"** → **Schlick-type Pragmatism**  
    → *Awkward commitment*: Justifies resentment even if the target had no meaningful control.  

  ---

  #### **Question 5 (For all paths): Do reactive attitudes need "deep freedom" to be justified?**  
  *(If answered earlier, skip. Otherwise ask after Q1-4)*  
  - **"Yes—without it, blame is unfair"** → **Retributivism** or **Skepticism** (depending on Q1)  
  - **"No—attitudes work if they regulate behavior or express values"** → **Compatibilism** or **Pragmatism**  
  - **"No—they’re just instincts; justification is irrelevant"** → **Naturalist Non-Normativism**  
    → *Awkward commitment*: Moral outrage has no more weight than a flinch reflex.  

  ---

  ### **Key Notes:**  
  - **Positions this tree can’t split**:  
    - *Reasons-Responsive Compatibilism* vs. *"Structural Exemption"* if both agree Alex is blameworthy.  
    - *Naturalist Non-Normativism* vs. *Pragmatism* if both reject normative justification.  
  - **Corporate/AI blame**: Skipped—positions here usually mirror individual blame stances.  
  - **Unattractive/empty combo**: "Resentment is *always* inappropriate *and* normatively required." (Incoherent).  

  This tree forces you to confront *when* and *why* you withhold blame—revealing your stance on control, fairness, and the purpose of anger. The "awkward commitments" show each view’s price of admission.
