answer: |-
  ### Audit of Pain Asymbolia Analogies

  #### **1. Correspondence Tables for Analogies**
  **A. Standard "Wired Detector" Analogy (Pro-Neutrality View):**
  | Pain Component          | Detector System Component       | Function/Value                                                                 |
  |-------------------------|----------------------------------|--------------------------------------------------------------------------------|
  | **Sensory Quality**     | Alarm Siren                     | "Pure" signal of tissue damage (like smoke detection)                          |
  | **Affective Response**  | Wiring to Sprinklers/Evacuation | Links detection to distress/motivation (suffering as "activation")             |
  | **Behavioral Output**   | Sprinklers + Evacuation         | Avoidance/withdrawal (functional response to threat)                           |
  | **"Badness"**           | Sprinklers/Evacuation Failure   | Resides *only* in failed response (no harm if alarm sounds alone)              |

  **B. Critics' "Paralyzed Occupants" Analogy:**
  | Pain Component          | Detector System Component       | Function/Value                                                                 |
  |-------------------------|----------------------------------|--------------------------------------------------------------------------------|
  | **Sensory Quality**     | Alarm Siren                     | Signal indicating objective threat (fire/damage)                               |
  | **Affective Response**  | Occupants' Perception of Alarm  | Recognition of threat (even if no action possible)                             |
  | **Behavioral Output**   | Evacuation (blocked)            | Action failure due to paralysis (irrelevant to alarm's value)                  |
  | **"Badness"**           | Fire/Damage Itself              | Resides in *what is signaled* (threat exists regardless of response capacity)  |

  ---

  #### **2. Flaws in the "Wiring" Analogy**
  - **Smuggled Functional Assumption**: The wiring metaphor assumes pain's *only* proper function is to **drive action** (evacuation/sprinklers as necessary for harm prevention). This ignores:
    - Pain's **informational role**: Signaling damage for non-urgent responses (e.g., rest, immune activation).
    - **Evolutionary scope**: Nociception in sessile organisms (e.g., plants) or immobilized animals still serves functions (e.g., localized inflammation).
  - **Support from Asymbolia?**  
    Asymbolia shows motivational decoupling but *does not* prove action-driving is pain's *sole* function. Patients retain sensory awareness of damage, which could still be intrinsically disvaluable (e.g., as a violation of bodily integrity). The analogy **smuggles in** neutrality by defining "proper function" narrowly as action.

  - **False Signal-System Separation**:  
    Biological nociception isn't a modular "alarm + wiring" system. Sensory and affective components:
    - Share neural substrates (e.g., overlapping insula/cingulate activation).
    - Co-evolved as integrated pathways. In asymbolia, the "decoupling" is pathological (e.g., due to lesions in posterior insula), not proof of independence.

  ---

  #### **3. Fault-Tolerant Sensor Network Analogy**
  **Proposed Analogy**:  
  Pain processing as a **distributed sensor network** (e.g., industrial IoT system monitoring structural stress):
  - **Nodes**: Local nociceptors (sensors detecting tissue stress).
  - **Network**: Affective pathways (integration hubs aggregating data).
  - **Global Shutdown**: Suffering/avoidance (system-wide alert halting operations).
  - **Asymbolia**: Nodes report damage locally, but network suppresses global alerts (no "shutdown").

  **Does This Undermine Moral Neutrality?**  
  - **Yes**, in three ways:
    1. **Information Retains Value**: Local reports still indicate damage (e.g., "Node 7: tendon frayed"), which is inherently undesirable—even if no shutdown occurs.
    2. **Fault-Tolerance ≠ Neutrality**: Suppressing alerts is a *failure mode* (e.g., network corruption), not proof that reports lack disvalue. Asymbolia may reflect neural "faults."
    3. **Moral Implications**: A system ignoring damage reports is dysfunctional, not neutral. Bodily damage (signaled by pain) is objectively bad *for the organism*.

  **Was Neutrality Pre-Supposed?**  
  The "neutral conclusion" was **doing the work**: The original detector analogy assumed moral irrelevance for "mere signals," while the sensor network shows signals carry disvalue *by representing harm*.

  ---

  #### **4. Requirements for a Genuinely Apt Analogy**
  A defensible analogy must preserve:
  - **Informational Valence**: Pain signals *represent* objective threats (not just trigger actions).
  - **Biological Integration**: Sensory/affective pathways are co-dependent, not modular.
  - **Pathology vs. Function**: Asymbolia as a *breakdown* (like network faults), not "pure" sensation.
  - **Normative Grounding**: Badness stems from what is signaled (damage), not just responses.

  **Where Analogies Fail and Judgment Takes Over:**
  1. **Phenomenology**: No analogy captures *why* sensory pain feels unpleasant (the "hard problem" of affect).
  2. **Moral Valuation**: Whether tissue damage is intrinsically disvaluable requires ethical argument (e.g., from wellbeing or teleology), not engineering metaphors.
  3. **Holism**: Biological systems lack clean separations (e.g., "sensory signal" in nociception includes proto-affective features).

  ---

  ### Conclusion
  The detector analogies fail by artificially separating "signal" from "badness" and assuming action-driving is pain's only function. The sensor network better captures asymbolia as a *fault* in threat-response integration, but it reveals that pain's sensory component retains disvalue by reporting harm. Moral neutrality relies on question-begging assumptions about function, not empirical evidence. A sound view must ground pain's badness in its *representational content* (damage) and the intrinsic disvalue of bodily violation—judgments no analogy can resolve.
