answer: |-
  Here's a disciplined mapping of the Nixon shock through constructivist lenses, keeping your questions distinct and pinpointing limitations:

  **1. Mapping Constructivist Theories onto 1971:**

  *   **Status-Function / Constitutive Rules (Searle):**
      *   **Pre-1971 Dollar:** "X (paper note/credit entry) counts as Y (money) in context C (Bretton Woods system) *only if* it is ultimately redeemable for Z (gold) by authorized agents (central banks)." Gold convertibility was a constitutive rule anchoring the dollar's status.
      *   **Post-1971 Dollar:** The constitutive rule changed. Now: "X counts as Y in context C *because* the US state declares it legal tender and accepts it for taxes." The backing shifted from gold (a physical commodity with an assigned status) to state fiat and network effects.
      *   **Change:** The **convention doing the anchoring** changed fundamentally (convertibility promise removed). The *kind* ("US Dollar") persisted, but its defining constitutive rule was altered. Metaphysical change? A significant change in the *grounds* of the status.
      *   **Prediction/Silence:** Predicts the dollar *could* survive the rule change if a new basis for collective acceptance (state power, network effects) emerged. Silent on *why* the new rule was accepted or how *stable* the value would be.

  *   **Coordination Equilibrium (Lewis-esque):**
      *   **Pre-1971:** The dollar was a dominant coordination equilibrium for international trade and reserves, *partly stabilized* by the gold peg convention. This convention solved a coordination problem for central banks.
      *   **Post-1971:** Suspending convertibility removed one stabilizer. The core coordination equilibrium (using dollars for trade, reserves, pricing) *persisted* because the network effects (everyone else uses it, US economy is dominant) were strong enough. New equilibria emerged (floating rates).
      *   **Change:** A key **stabilizing convention** supporting the dominant equilibrium was removed. The core **equilibrium itself (using USD)** proved robust enough to continue.
      *   **Prediction/Silence:** Predicts the dollar *could* survive if network effects outweighed the disruption. Explains persistence better than genesis. Silent on why the *dollar specifically* remained the equilibrium post-shock versus alternatives. Also silent on the *role of the state* beyond being a major player.

  *   **Chartalism (Knapp, Modern Monetary Theory):**
      *   **Pre-1971:** The dollar was "state money" because the US state accepted it for taxes and declared it legal tender. The gold peg was a *self-imposed constraint* on state monetary sovereignty, not the *source* of moneyness.
      *   **Post-1971:** The state removed its self-imposed constraint. The dollar remained state money *by definition* – its essence is being the unit in which taxes are denominated and payable. The gold peg was always incidental to its core nature.
      *   **Change:** **No fundamental change in the kind.** Only the removal of an operational constraint. The metaphysical anchor (state acceptance for taxes) remained constant.
      *   **Prediction/Silence:** Predicts the dollar *must* survive as long as the US state exists and enforces tax obligations in dollars. Strongly predicts continuity of identity. Silent on why the peg existed in the first place or why its removal caused market turmoil (value != moneyness). Also silent on why non-state actors widely accept it beyond tax obligations.

  *   **Mengerian Emergence:**
      *   **Pre/Post-1971:** The dollar's moneyness primarily arose from its *saleability* – its widespread acceptability in exchange. The gold peg *enhanced* its saleability (especially internationally) by providing a perceived anchor.
      *   **Change:** The peg's removal *reduced* a factor enhancing saleability. The key question was whether the dollar's inherent saleability (based on US economic strength, network size) was robust enough to sustain its status without the gold anchor.
      *   **Prediction/Silence:** Predicts moneyness depends entirely on continued market acceptance. 1971 was a major test of the dollar's underlying saleability. Silent on the *specific mechanisms* driving collective acceptance (beyond individual utility) and the distinct role of the *state* (as opposed to just a very large market participant).

  **2. Separating Genesis, Maintenance, Identity:**

  *   **Genesis:** Bretton Woods (state agreement) launched the *specific international dollar system* with its gold peg. Menger sees genesis in market emergence long before. Chartalism sees genesis in state declaration (Constitution, legal tender laws). **1971 shows:** Genesis mechanisms are often layered. Bretton Woods built upon pre-existing domestic dollar acceptance (itself with complex genesis).
  *   **Maintenance:** Pre-1971: Maintained by network effects, state power (taxes, legal tender), *and* the gold convertibility convention for central banks. Post-1971: Maintained by network effects, state power (taxes, legal tender), and the *absence of a viable alternative* equilibrium. **1971 shows:** Maintenance factors (network effects, state power) can be robust enough to withstand the removal of one stabilizing convention (gold peg). The **threshold of "enough acceptance"** is pragmatic and revealed only in crises – it held in 1971 US, failed in Zimbabwe.
  *   **Identity (Was it the same dollar?):**
      *   **Yes (Chartalism, Coordination Equilibrium):** Continuity of the state issuer, the unit of account name ("dollar"), legal tender laws, tax obligations, and crucially, the *core network of users* who continued using it seamlessly pre/post for domestic transactions. The metaphysical core (state acceptance/network equilibrium) persisted.
      *   **Debatable (Status-Function):** The constitutive rule changed significantly. However, Searle allows for "background" acceptance of the *general* status "money" to persist through changes in specific rules. The *specific* dollar kind arguably persisted due to continuous state backing and user practice.
      *   **1971 shows:** Continuity of name, state backing, and core user base are strong indicators of persistent identity, even through significant operational changes. The metaphysical change was significant but not necessarily kind-destroying.

  **3. Constructed by Whom? The Power/Uptake Dilemma:**

  *   **The Restriction is Necessary:** Constructivism *must* admit that not all agents are equal. The attitudes/actions of **key agents in pivotal roles** are disproportionately constitutive:
      *   **The State:** Declaring legal tender, accepting taxes, enforcing contracts.
      *   **Central Banks:** Setting reserve requirements, conducting monetary policy (affecting value/stability).
      *   **Major Price-Setters & Acceptors:** Large firms setting prices in USD, banks accepting deposits/loans.
      *   **"Enough People, in the Right Positions":** Yes. The threshold isn't fixed metaphysically; it's a contingent, empirical fact about network resilience and power structures. The threshold *itself* is a social fact – the point where defection (using something else) becomes widespread enough to collapse the system.
  *   **Does "Socially Constructed" Survive?** Yes, but it reveals power dynamics. "Socially constructed" doesn't imply egalitarian democracy. It means the *institutions, roles, and collective practices* that constitute money depend on human activity and recognition, which is inherently structured by power (state power, market dominance). It collapses into "imposed by power" only if "social" is naively equated with "democratic consensus." Social facts *can* be (and often are) hierarchical and coercive. 1971 shows a small group *changed the rules*, but the *continued existence* of the dollar depended on the broader network *not* rejecting it en masse.

  **4. Where the Lens Breaks / What the Case Does to Theory:**

  *   **(i) Neutrality vs. Evidence:** You're right. For Chartalism, 1971 is *irrelevant* to moneyness – the dollar was always state money. For Coordination/Status theories, it shows the core moneyness (acceptance) can be robust to changes in anchoring conventions. For Menger, it tested saleability. **It doesn't decisively prove constructivism over a "state liability" view** (which Chartalism largely *is*). It *does* show the *specific conventions anchoring value and international function* are contingent and changeable by collective (especially state) action.
  *   **(ii) The Value Problem:** This is the **major limitation**. Constructivism explains the *existence and persistence* of a money *kind*, not its *value stability*. Why did the post-1971 dollar *retain* significant value while Weimar marks did not? **Out of Scope?** Partly. Value depends on scarcity (controlled by issuer policy) and demand (driven by trust in stability, utility for exchange/store, network size). Constructivism explains the *framework* (why USD is the *unit* used), but **not the quantitative value** (how many dollars for a loaf of bread). That depends on monetary policy, fiscal policy, economic productivity, and trust – factors constructivism describes the *context* for, but doesn't fully explain. It's a necessary clarification, not necessarily a retreat, but highlights the theory's boundaries. 1971/Zimbabwe contrast shows that while the *kind* (fiat state money) might persist, its *functional success* (holding value) requires competent management and trust, which are separate (though related) issues.

  **5. Looping Effects & State Control:**

  *   **Real Analogy:** Absolutely. Gresham's Law, dollarization, indexing, commodity pricing – these are **looping effects**. Once money exists, actors strategize around it (hoarding "good" money, indexing contracts to hedge inflation, pricing in stable units), changing the demand and function of the monetary kind itself.
  *   **Predicts for 1971:** The plain constructivist story (especially Chartalism/Status) might overstate state *control*. Looping predicts:
      *   **Post-1971:** Loss of the gold anchor *could* trigger inflation expectations, leading actors to index contracts or seek alternatives, potentially weakening the dollar's unit-of-account role domestically/internationally (some of which happened, driving the move to floating rates).
      *   **State's Challenge:** The state must manage expectations and policy to *prevent* destabilizing feedback loops (like hyperinflation) that could destroy the money's core functions, even if the "kind" persists. Nixon's wage/price freeze was a crude attempt at this.
  *   **State Less in Charge?** Yes. The state initiates/constitutes the *core framework*, but once launched, the money kind interacts with complex market strategies and expectations (looping). The state remains the most powerful player (via policy and coercion), but its control over the *precise functioning and value* is contested and constrained by the responses of the very agents whose practices constitute the money. 1971 shows the state *changed the rules*, but the *outcome* (dollar remains dominant reserve currency) depended heavily on market actors' *continued, albeit adapted, acceptance and use* – a looping effect where the users' response determined the new equilibrium. The plain story can miss this dynamic tension.

  **In essence:** 1971 reveals money as a multi-layered social kind. Its core persistence relied on robust network effects and state power (Maintenance/Identity). The anchoring convention changed dramatically (Status/Coordination), but the kind endured. Power is concentrated (Construction by Whom), but broad acceptance remains necessary. Value stability is a separate, critical challenge outside strict constructivism (Lens Break). And users' strategic responses (Looping Effects) constantly reshape the monetary landscape, limiting pure state control. The episode confirms constructivism's core insight – money's existence and form depend on human practices and agreements – while highlighting its nuances: hierarchy, contingency, the value/function distinction, and the dynamic interplay between rule-setters and users.
