  I need to address each part without getting lost in theory. The user wants clear, applied reasoning. For example, in status-function, Nixon's change altered the constitutive rules, but the dollar's identity persisted through state backing. Chartalism emphasizes tax liability, so the state's role maintained continuity. Menger might see 1971 as a disruption but not a fundamental change if acceptance continued.

