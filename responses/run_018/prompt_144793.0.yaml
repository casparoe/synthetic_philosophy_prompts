answer: |-
  ### Exam Question  
  **Time Allowed:** 75 minutes  
  **Word Limit:** 800–1000 words  

  **Scenario:**  
  *At a chemical plant, Tank A stores volatile compounds. Two safety systems prevent catastrophic pressure buildup:  
  (1) An **automated pressure-release valve (System V)** activates if pressure exceeds 300 kPa.  
  (2) A **manual emergency purge (System P)** must be initiated by technicians within 60 seconds if System V fails or pressure reaches 290 kPa (per protocol).  
  On Day 1, Technician Lee observes Tank A’s pressure at 295 kPa but ignores the protocol, assuming System V will activate. System V malfunctions (due to undetected corrosion), pressure surges to 400 kPa, and the tank explodes.  
  On Day 2, Supervisor Morgan—aware System V’s maintenance log shows corrosion—disables System P’s alarm (deeming it "annoying"). Pressure hits 295 kPa, but without the alarm, technicians miss the manual purge window. System V activates successfully at 301 kPa, averting disaster.*  

  **Question:**  
  Using the distinction between **preservative omissions** (agent inaction leaves an *ongoing harmful chain* unaltered) and **initiatory omissions** (agent inaction prevents a *structurally expected safeguard* from engaging), analyze:  
  (a) Causal efficacy: Do Lee’s and Morgan’s omissions differ in their causal status regarding the Day 1 explosion?  
  (b) Moral responsibility: Should a control-based principle (responsibility scales with capacity to intervene in causal chains) treat Lee and Morgan differently?  
  (c) Limits: Where does this distinction break down in explaining outcomes?  

  Focus on applying the distinction to the scenario’s technical details. Avoid general omission theory summaries.  

  ---

  ### Model Answer (≈600 words)  

  **(a) Causal Efficacy**  
  Lee’s omission is **preservative**: The harmful chain (pressure surge from 295→400 kPa) was *already unfolding*. Lee’s inaction left it untouched, failing to activate System P—a *redundant* safeguard. His omission did not *initiate* new harm but allowed existing risk to mature. Crucially, System V’s failure (corrosion) was the active cause; Lee’s omission was causally inert in *producing* the explosion, merely *preserving* the chain.  

  Morgan’s omission is **initiatory**: By disabling System P’s alarm, Morgan prevented the *structural expectation* of human intervention at 290 kPa. Though Day 2 avoided disaster, Morgan’s inaction *initiated* a vulnerability: technicians lost their designated intervention point. Had pressure reached 301 kPa *before* System V activated (e.g., with a 305 kPa surge), the explosion would trace to Morgan’s *preemptive disabling* of the safeguard. Morgan’s omission altered the *preconditions* for safety, making harm *counterfactually dependent* on their inaction.  

  *Thus, the omissions differ: Lee’s lacked causal efficacy (System V’s failure sufficed for explosion); Morgan’s had initiatory efficacy (it created a new pathway for harm).*  

  **(b) Moral Responsibility (Control-Based Principle)**  
  A control-based principle assigns responsibility based on *capacity to redirect causal chains*. Here, Lee’s preservative omission warrants *lesser* responsibility. He observed an *ongoing* risk (295 kPa) but could only *interrupt* it via System P—a backup. Control was limited to mitigating an *existing* threat. System V’s malfunction was independent; Lee’s role was reactive.  

  Morgan’s initiatory omission warrants *greater* responsibility. By disabling the alarm, they *proactively dismantled* a scheduled intervention point. Morgan controlled whether the safeguard *could be deployed* at all, altering the plant’s causal architecture. This preemptive act made Morgan a *gatekeeper* of safety chains. Even though disaster was averted on Day 2, Morgan maximized reliance on System V—a known risk—by nullifying System P’s structural role.  

  *Control thus scales with omission type: Initiatory omissions (Morgan) involve dominion over *whether safeguards exist*; preservative omissions (Lee) involve only *whether to deploy* existing safeguards.*  

  **(c) Limits of the Distinction**  
  The distinction breaks down in **overdetermination scenarios**. Suppose on Day 1, System V *and* System P both fail independently. Lee’s omission then appears initiatory—but structurally, System P was already compromised by Morgan’s prior action. The distinction cannot neatly separate omissions when *multiple safeguards decay*. Similarly, if System V always activates at 301 kPa (as on Day 2), Morgan’s omission seems preservative of *low-risk conditions*—blurring the "initiatory" label.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Analytical Move** | **Marks** | **Typical Failure Mode** |  
  |---------------------|-----------|--------------------------|  
  | **1. Correctly labels omissions** (Lee preservative, Morgan initiatory) *using scenario specifics*. | 4/20 | Vague labeling without technical grounding (e.g., "Lee didn’t act, Morgan didn’t act"). |  
  | **2. Contrasts causal efficacy**: Lee’s omission non-essential (preserves chain); Morgan’s omission creates new vulnerability (initiates dependency). | 5/20 | Overgeneralizes (e.g., "all omissions are causes/non-causes"). |  
  | **3. Applies control-based principle**: Morgan’s control over safeguard *activation* (initiatory) vs. Lee’s control over *intervention* (preservative). | 5/20 | Ignores "structural expectation" (e.g., treats both as equal failures to act). |  
  | **4. Identifies asymmetry**: Morgan’s omission affects future chains; Lee’s affects present chain. Notes breakdown in overdetermination. | 4/20 | False equivalence (e.g., "both equally caused harm"). |  
  | **5. Limits discussion**: Flags overdetermination or edge cases (e.g., Day 2’s safe outcome) as challenges to the distinction. | 2/20 | Oversimplifies distinction as universally robust. |  

  **Grading Key**:  
  - **Excellent (16–20)**: Precision applying distinction to valves, alarms, pressure thresholds.  
  - **Adequate (10–15)**: Correct distinction but generic reasoning.  
  - **Poor (<10)**: Summarizes omission literature or ignores scenario.  

  ---

  ### Confidence and Uncertainty  
  **Confidence**: The preservative/initiatory distinction is **highly coherent and pedagogically useful**. It forces granular analysis of *how* omissions embed in causal structures (e.g., preservative omissions require *ongoing chains*; initiatory omissions require *dormant safeguards*). It avoids classic omission-debate dead ends by focusing on *functional roles in systems*.  

  **Least Certain Point**: **Moral responsibility extension**—specifically, whether "structural expectation" (e.g., protocols) *always* amplifies control-based responsibility for initiatory omissions. If System P was rarely used in practice, does Morgan’s omission still carry greater weight? The link between institutional norms and individual control needs more defense.
