answer: |-
  **Terms and Conditions of Participation: The Empty Centre Retreat**

  **1. Introduction & Governing Doctrine**
  1.1. These Terms and Conditions ("Terms") govern the provisional arrangement conventionally termed "enrolment" at The Empty Centre ("Centre"), a facility dedicated to experiential investigation of phenomenological processes.
  1.2. The Centre formally adopts and administers all interactions solely through the lens of the Buddhist doctrine of *anattā* (Pāli; Sanskrit: *anātman*), understood as the absence of any inherently existing, unitary, permanent self or soul.
  1.3. All references to "Participant," "Guest," "You," or similar designations within these Terms refer strictly to a conventional, pragmatic designation (*prajñapti-sat*) employed for administrative convenience. They denote no affirmation of an ultimately real (*paramārtha-sat*) enduring entity possessing inherent identity, agency, or continuity.
  1.4. Actual participation involves the conditional arising and cessation of specific configurations (*samudaya* and *nirodha*) of the Five Aggregates (*pañcakkhandhā*): Form (*rūpa*), Feeling (*vedanā*), Perception (*saññā*), Mental Formations (*saṅkhāra*), and Consciousness (*viññāṇa*).

  **2. Provisional Identification & Booking**
  2.1. To facilitate the administrative process known as "booking," a conventional designation ("Designated Contact Aggregate-Configuration" or DCAC) must be provisionally identified. This involves the provision of names, contact details, and payment information.
  2.2. This DCAC is a purely nominal construct, required solely for operational coordination (e.g., room allocation, dietary notation). Its establishment implies no recognition of an ultimate self (*ātman*) underlying said configuration.
  2.3. The Centre acknowledges that the DCAC providing payment at time T1 may not be identical (in an ultimate sense) to any aggregate-configuration present during the retreat period (T2) or seeking redress afterwards (T3). Continuity is acknowledged only conventionally, not ultimately.

  **3. Financial Arrangements & Deposits**
  3.1. A non-refundable deposit, payable by the DCAC at T1, secures provisional placement for an anticipated aggregate-configuration arising during the designated retreat dates.
  3.2. The term "non-refundable" signifies that upon cessation of the specific volitional formation (*cetanā*) within the *saṅkhāra* aggregate associated with the initial payment impulse at T1, no inherently existing payee entity persists to whom reimbursement could be meaningfully directed.
  3.3. Should the anticipated arising of a participation-suitable aggregate-configuration at T2 fail to occur due to conditions conventionally labelled "cancellation," the deposit remains with the Centre. This reflects the dissolution of the causal nexus (*paticcasamuppāda*) linking the T1 payment impulse to any subsequent T3 configuration potentially experiencing dissatisfaction. Requests for refunds submitted by a T3 configuration will be evaluated solely on the conventional continuity of name and bank details, not on identity.
  3.4. Full payment, also handled by the DCAC at T1, is required 28 days prior to the retreat commencement date (T2), subject to the same conditions of non-self as Clause 3.2.

  **4. Liability & Actions**
  4.1. The Centre, itself understood as a dynamic, dependently arisen process, disclaims all liability for any harm, damage, or distress arising during the retreat.
  4.2. Any action conventionally attributed to a "Participant" (e.g., damaging property, causing interpersonal friction) is understood as the impersonal arising of volition (*cetanā*) within a specific, transient aggregate-configuration influenced by preceding conditions (*hetu* and *paccaya*).
  4.3. No ultimately existent agent (*kāraka*) is posited. Therefore:
      a)   The Centre cannot be held liable for actions originating within a guest aggregate-configuration, as no stable "owner" of the action exists.
      b)   No guest aggregate-configuration can be held ultimately liable for actions arising within it, as it lacks inherent existence and control. Conventional restitution for damages may be sought from the financial resources associated with the DCAC (see Clause 2.3), purely as a matter of pragmatic recourse (*upāya*).

  **5. Meditation Progress & Inheritance**
  5.1. The Centre acknowledges the conventional observation that skills labelled "meditative progress" (e.g., enhanced concentration (*samādhi*), insight (*vipassanā*)) may arise and be cultivated within specific aggregate-configurations during the retreat.
  5.2. However, due to the doctrine of *anattā*:
      a)   No inherently existing "meditator" acquires or possesses these skills.
      b)   These skills represent conditioned changes (*vipariṇāma*) within the mental formations (*saṅkhāra*) and consciousness (*viññāṇa*) aggregates of the specific configuration present.
      c)   Upon the dissolution of that specific configuration (e.g., post-retreat), there is no enduring entity to "inherit" or "retain" these skills in an ultimate sense. Any apparent continuity in skill is attributed to the causal conditioning of subsequent aggregate-configurations bearing similar conventional designations (e.g., name, memory imprints), not to a persisting self.

  **6. Complaint Resolution & Non-Identity Relations**
  6.1. Dissatisfaction (*domanassa*), understood as an unpleasant feeling (*vedanā*) arising within an aggregate-configuration, may occasionally occur.
  6.2. The Centre maintains a "Department of Non-Identity Relations" (DNIR) to address conventionally expressed concerns.
  6.3. Complaints must be lodged by a configuration provisionally identifying itself with the DCAC used at booking. The DNIR will engage with the *current* aggregate-configuration presenting the complaint.
  6.4. Resolution attempts focus on the specific, arisen dissatisfaction and its perceived causes within the phenomenological field as presented, without recourse to notions of a wronged person or enduring grievance. Past dissatisfaction experienced by a prior configuration is acknowledged as conditionally arisen and ceased; resolution applies only to the present manifestation.
  6.5. All DNIR decisions are final, reflecting the conventional need to cease discursive formations (*vitakka-vicāra*) around unresolved dissatisfaction. No appeal to a higher, inherently existing authority is possible within the Centre's framework.

  **6.6. Quoted Statement from the Head of Non-Identity Relations:**
  *"Clause 4.3(b) is frequently misinterpreted. It does not imply 'getting away with it'. It simply reflects the ontological reality that the aggregate-configuration which spilled candle wax on the antique *zafu* at T2 has causally ceased. Demanding compensation *from it* is like demanding rent from a vanished mirage. We interact solely with the presenting configuration at T3, which merely bears conventional association with the financial resources initially engaged at T1. Any transfer of funds is purely a conventional (*sammuti*) adjustment to appease current formations of dissatisfaction (*dosa*), not a finding of fault in an ultimately existing entity."* – *A. Nāga, Head of Non-Identity Relations*

  **7. General Provisions**
  7.1. Attendance signifies conventional acceptance of these Terms by the DCAC, understood as an expression of volition (*cetanā*) conditioned by the desire to participate.
  7.2. These Terms represent the entire conventional agreement governing the dependently arisen process labelled "retreat attendance."
  7.3. The Centre reserves the right to request the cessation of participation by any specific aggregate-configuration whose arising causes significant disruption to the phenomenological environment conducive to the Centre's purpose. This is not an expulsion of a 'self', but the cessation of support for a particular, disruptive pattern of aggregates.
  7.4. English law (conventionally understood) governs the interpretation of these Terms, while their application remains subject to the ultimate doctrine of *anattā* as the Centre's sole administrative framework. All disputes arising conventionally shall be subject to the exclusive jurisdiction of the DNIR (Clause 6).

  **By Provisionally Agreeing, The Designated Contact Aggregate-Configuration Acknowledges the Conventional Nature of This Arrangement and the Ultimate Absence of Any Signatory Self.**
