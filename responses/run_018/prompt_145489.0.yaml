prompt: |-
  I am a novelist drafting a work that turns on whether a protagonist’s moral transformation is genuinely warranted or merely narratively convenient, and I want a philosophical classification instrument for my own thinking rather than an encyclopaedic survey. I want a taxonomy — delivered as exactly five numbered items, each comprising one or two sentences, with no introduction and no conclusion — that sorts positions on the wrong kind of reasons problem as it applies specifically to reasons for adopting an interpretive stance about fictional moral outcomes. Build the tree from logical commitments rather than from named theorists: begin with whether reasons for belief are attitude-specific; then branch on whether pragmatic narrative coherence can ever supply a legitimate reason for an interpretive belief; then on whether the wrong-kind objection applies symmetrically to aesthetic and moral attitudes. Each item should name one terminal position defined by its combination of answers, briefly note any adjacent unoccupied logical space and diagnose it as incoherent, unattractive, or merely unexplored, and flag any pair of positions the tree cannot separate. Please write in British English, distinguish what is broadly settled in the philosophical literature from what remains genuinely contested among specialists, and do not present a contested view as if it were the consensus.
reasoning: |-
  Hmm, the user is a novelist working on a moral transformation plot and wants a philosophical tool to clarify their thinking, specifically about the "wrong kind of reasons" problem applied to interpreting fiction. They need a taxonomy with exactly five numbered items, no intro or conclusion, structured logically from attitude-specificity to pragmatic coherence to symmetry between aesthetic and moral attitudes.

