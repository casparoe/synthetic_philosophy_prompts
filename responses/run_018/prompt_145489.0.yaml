answer: |-
  1. **Strict Evidentialism**: Reasons for interpretive belief (e.g., about a character's moral redemption) are attitude-general, requiring solely truth-conducive evidence; pragmatic narrative coherence supplies illegitimate "wrong kind" reasons. The adjacent space permitting pragmatic justification under attitude-general reasons is incoherent, as beliefs categorically demand truth-apt grounds. This position cannot be distinguished from Moral Privilege or Symmetric Fictionalism on questions of non-pragmatic justification, as all reject narrative coherence as a reason for belief.  
     *(Philosophical context: Attitude-general views are defensible but minority stances, with no consensus; rejecting pragmatic reasons for belief is broadly settled, though contested when applied to fiction-specific interpretation.)*  

  2. **Symmetric Fictionalism**: Reasons for belief are attitude-specific (e.g., interpretive stances admit non-evidential considerations), but pragmatic coherence cannot justify moral or aesthetic interpretive beliefs, as both succumb symmetrically to the wrong-kind objection (e.g., narrative convenience cannot warrant believing a redemption arc). The adjacent space allowing symmetry under attitude-general reasons is unexplored, as it collapses into Strict Evidentialism. This position shares Moral Privilege's rejection of pragmatic reasons, making them indistinguishable on that axis.  
     *(Philosophical context: Symmetry between moral and aesthetic wrong-kind objections is contested, with no specialist consensus; attitude-specificity remains debated but increasingly influential.)*  

  3. **Moral Privilege**: Reasons for belief are attitude-specific, pragmatic coherence cannot justify moral interpretive beliefs (wrong-kind reasons apply), but this objection fails asymmetrically for aesthetic beliefs (e.g., narrative coherence may legitimately justify believing an artistic outcome). The adjacent space denying attitude-specificity while asserting moral asymmetry is unattractive, as it struggles to ground moral reasons' categorical force without special treatment. This position cannot be separated from Symmetric Fictionalism regarding pragmatic justification, as both exclude it for moral beliefs.  
     *(Philosophical context: Moral asymmetry is a live, contested view often tied to realism; rejecting pragmatic reasons for moral belief is less settled in fiction than in ethics proper.)*  

  4. **Broad Pragmatism**: Reasons for belief are attitude-specific, and pragmatic narrative coherence can legitimately justify interpretive beliefs (moral or aesthetic), with wrong-kind objections failing symmetrically as "reasons to feel" do not apply (e.g., coherence warrants believing a transformation). The adjacent space permitting coherence under attitude-general reasons is incoherent, conflating distinct reason-types. This position shares Moral Pragmatic Asymmetry's acceptance of pragmatic justification, rendering them indistinguishable on that point.  
     *(Philosophical context: Pragmatic justification for belief is hotly contested, especially in fictional interpretation; symmetry is often assumed here but not settled.)*  

  5. **Moral Pragmatic Asymmetry**: Reasons for belief are attitude-specific, pragmatic coherence can justify aesthetic interpretive beliefs but not moral ones, where wrong-kind objections hold (e.g., coherence warrants believing an aesthetic resolution but not a moral redemption). The adjacent space denying attitude-specificity while allowing pragmatic aesthetic reasons is unexplored, lacking a coherent framework. This position cannot be differentiated from Broad Pragmatism on the permissibility of pragmatic aesthetic justification.  
     *(Philosophical context: Asymmetry here is genuinely contested, with specialists divided over whether moral beliefs demand "stronger" reasons; attitude-specificity is widely debated but not resolved.)*
