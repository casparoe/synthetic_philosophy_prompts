  Then Q2: Can pragmatic narrative coherence ever be a legitimate reason? This is hotly debated. If no at Q1, Q2 might be irrelevant for beliefs but still relevant for other attitudes.

  Q3: Symmetry of wrong-kind objection between aesthetic and moral? Also contested – some see moral as special due to categorical force, others treat both as domains where pragmatic reasons misfire similarly.

  Now, mapping the logical combinations:

  - Path 1: Q1 no → attitude-general reasons. Then Q2: can pragmatic justify? If no, that's Position 1 (Strict Evidentialism). If yes, but Q2 yes might be incoherent if beliefs strictly require truth reasons, so I'll diagnose that as incoherent and skip it. The tree would only have the "no" branch here.

  - Path 2: Q1 yes → attitude-specific reasons possible. Then Q2: can pragmatic justify? If no, go to Q3. If yes, also go to Q3.

  - At Q3: for both Q2 paths, ask about symmetry. So positions will be: 

