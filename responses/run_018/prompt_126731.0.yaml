answer: |-
  Your argument is fascinating and touches deep issues in decision theory and epistemology. The rotten step is **premise (4): "In any real decision, there is always some hidden tie at the margin."** Here's a breakdown of why, how to salvage rationality, and what it costs:

  ### Why (4) Fails:
  1. **No Justification for Universal Hidden Symmetry**:  
     There's no reason to assume reality *always* contains hidden symmetries that perfectly balance every known asymmetry. This assumes a *pre-established harmony* of values that's metaphysically suspect. Why should unknown features *exactly* cancel known advantages? Reality could easily contain hidden asymmetries favoring either option.

  2. **The Burden of Proof is Reversed**:  
     (4) claims hidden ties *must* exist. But the rational stance is to assume *no perfect symmetry exists* unless evidence suggests otherwise. If you know Job A has advantage X over Job B, and no known disadvantage, you rationally prefer A. The mere *possibility* of a hidden cancelling feature doesn't create symmetry—it just creates uncertainty.

  3. **Value Incommensurability**:  
     Not all values are reducible to a common scale (e.g., "Job A pays $10k more" vs. "Job B has coworkers I vibe with"). When values are incommensurable, there’s no "margin" where a hidden feature could "exactly cancel" the advantage—they’re different *kinds* of reasons. A tie requires commensurability.

  4. **Epistemic Access Isn't Binary**:  
     Even with uncertainty, we have *probabilistic* reasons or *defeasible* preferences. "I prefer A based on known factors; I acknowledge unknown factors might change this, but they don't *currently* make it a tie."

  ### Salvaging Rationality Without Abandoning (1) or (2):
  - **Revise (1)**: "Can't tell the difference" should mean *given all reasonably available information*, not absolute ignorance. Rational choice operates on *accessible* reasons.  
  - **Reject (4)**: Assume asymmetry unless symmetry is evident. Hidden symmetries aren't guaranteed—they're exceptional.  
  - **Embrace Tie-Breaking as Rational**: Choosing via coin flip *is* rational in a genuine tie *if* the agent has a meta-reason like "I must act" or "Symmetry justifies randomization." This doesn't abandon reason; it *applies* reason to the predicament.  

  ### Standard Positions & Their Costs:
  1. **Decision Theory with Tie-Breaking Rules**:  
     - **View**: Rational agents can adopt tie-breaking procedures (randomization, arbitrary rules) when reasons are symmetric.  
     - **Cost**: Accepts that rationality sometimes requires non-deliberative mechanisms. Defends (2) by making tie-breaking a reasoned response to symmetry.  
     - **Proponents**: Levi, Sugden.

  2. **Epistemic Modesty**:  
     - **View**: We never *know* if options are perfectly symmetric. We act on *apparent* reasons, accepting that hidden factors might make our choice suboptimal—but this doesn’t negate rationality.  
     - **Cost**: Rationality becomes defeasible (could be overturned by new info), not infallible.  
     - **Proponents**: Bayesian decision theorists.

  3. **Denying Perfect Symmetry Exists**:  
     - **View**: Incommensurable values or infinitesimal differences always break ties. Even a neuron firing stochastically breaks symmetry.  
     - **Cost**: Requires metaphysical commitment to universal asymmetry (e.g., Leibniz’s "identity of indiscernibles").  

  4. **Pragmatic Dissolution**:  
     - **View**: Buridan’s ass is a non-problem. Agents in real ties *do* choose randomly, and this is rational because paralysis is worse.  
     - **Cost**: Redefines rationality as "reasonably adaptive" rather than "strictly reason-determined."  

  ### Conclusion:
  **Drop (4)**. The claim that hidden symmetries *always* exist is unsupported and overgeneralizes a thought experiment. Rational choice doesn’t require *absolute certainty* or *exhaustive knowledge*—it requires *sufficient reasons* under uncertainty. By rejecting (4), you keep (1) and (2) intact:  
  - When reasons *are* symmetric, rational choice requires tie-breaking (coin flips aren’t "twitches" but tools of reason).  
  - When reasons *appear* asymmetric (almost always), we act on the best available grounds.  

  This preserves everyday rationality while acknowledging that *perfect* ties are rare and manageable. You pay no major philosophical price—just accept that rationality operates in an uncertain world with imperfect information.
