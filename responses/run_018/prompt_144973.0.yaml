prompt: |-
  I was talking with my freinds about animal ethics and I realized my intuitions about speciesism are kinda scattered but I want to see if there's actually a principle behind them. So here are my gut calls on specific cases. Factory farming pigs just for bacon feels clearly wrong. Swatting a mosquito that's actively biting you is totally fine. Swatting one just because you're annoyed feels wrong too, but somehow less wrong than the pig thing, even though both are killing. Keeping a really smart parrot in a big enriched cage with company and toys still feels wrong to me, though not as bad as factory farming. Eating meat that's grown in a lab and never had any nervous system at all seems fine. But then there's this wierd case: imagine we bio-engineer a cow that behaves exactly like a normal cow but literally lacks any capacity for subjective experience, then raise it and slaughter it for food -- that feels okay, even if it's a bit creepy. Not saving a wild deer from a forest fire when you could do it with literally zero risk to yourself also feels wrong, but in a different way than the factory farming wrongness. Testing cosmetics on rabbits is wrong; testing a genuinely life-saving medicine on mice when there's absolutly no alternative feels okay.

  So is there one principle that captures all of these, or do I need a cluster? And which of my verdicts does it have to throw out if it wants to stay simple? Also please tell me what your principle says about using insects for large-scale bioremediation projects where they live in enriched conditions but are eventually killed once the soil is cleaned -- I keep going back and forth on that one.

  Please separate what's fairly settled in animal ethics from what's genuinely contested among people who actually know the literature, and don't present a controversial view as if it's the consensus. I want the response structured as a JSON object with exactly these fields: "principle_name" (string), "case_matchups" (array of objects each with "case_description" and "verdict" being either "captures" or "fails"), "tension_point" (string explaining the hardest pair to reconcile), "new_case_prediction" (string for the bioremediation insects), and "settled_vs_contested" (object with "settled" and "contested" arrays of brief strings).
reasoning: |-
  Hmm, the user is grappling with their intuitions about animal ethics and speciesism, trying to find a coherent principle behind their scattered gut feelings. They've listed several specific cases like factory farming pigs, swatting mosquitoes, keeping parrots in enriched cages, eating lab-grown meat, bio-engineered cows, saving wild deer, and animal testing. They also want to know about bioremediation insects and want me to clearly separate settled versus contested ideas in animal ethics.

  Looking at their cases, there's a clear pattern: they seem most concerned about suffering and subjective experience. They feel factory farming pigs is wrong because pigs can suffer intensely, while swatting a mosquito that's biting is fine because it's a defensive act. A key nuance is that they differentiate between killing for trivial reasons versus necessary ones - annoyed swatting feels wrong but less so than pig farming. For the parrot, even with enrichment, confinement might violate autonomy or natural behaviors. Lab-grown meat without a nervous system seems acceptable because there's no sentience involved.

  The bio-engineered cow case is interesting - if it truly lacks subjective experience, its "death" would be like destroying an object, so they feel it's acceptable despite being creepy. Saving a deer from a forest fire touches on a duty to prevent suffering when possible without self-risk. Animal testing shows a consequentialist bent: cosmetics on rabbits is unnecessary suffering, while life-saving medicine on mice might be justified if no alternatives exist.

  Their tension point appears to be between harm prevention and respecting life itself. For instance, killing a mosquito out of annoyance feels wrong despite minimal suffering, suggesting an aversion to unnecessary killing. But the bio-engineered cow case shows that without sentience, they don't see killing as inherently wrong.

  For the bioremediation insects case, I need to consider: insects in enriched conditions are living relatively well, but being killed after their purpose. If insects have minimal or no sentience, this might be acceptable under a sentiocentric principle. However, if they're more complex, like bees or ants, it could be problematic. The user might be conflicted depending on their view of insect sentience.

  In animal ethics, what's settled is that causing unnecessary suffering to sentient animals is wrong, and vertebrates like pigs, rabbits, and deer are widely accepted as sentient. Contested areas include the moral status of insects, whether death itself is a harm without suffering, and the ethics of creating and killing non-sentient beings that mimic life. Also, duties to wild animals are debated - whether we should intervene in natural harms.

  I'll structure my response as a JSON object with the requested fields. The principle will be "Sentient Welfare with Harm-Benefit Threshold" since it focuses on minimizing suffering in sentient beings while allowing necessary harms when benefits are significant. For case matchups, it will capture most of their intuitions except possibly the annoyed mosquito swatting, which might require an additional prohibition on trivial harm. The biggest tension is between the annoyed mosquito and the bio-engineered cow - why is one wrong and the other not? The bioremediation prediction will depend on insect sentience evidence. Settled vs contested will clarify the consensus versus debates in the field.
