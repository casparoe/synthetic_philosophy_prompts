  ### Explanation
  - **Principle**: Prioritizes preventing suffering in sentient beings. Allows harm only when: (1) suffering is minimized, (2) benefits significantly outweigh harms, and (3) no better alternatives exist. Death without suffering isn't inherently wrong under this view.
  - **Tension Point**: Your "annoyed mosquito" verdict conflicts with the principle because: 
    - If insects are non-sentient, swatting is morally neutral (like destroying a plant). 
    - If minimally sentient, trivial harm is disproportionate. 
    But you feel it's "wrong" regardless, suggesting an additional intuition about unnecessary killing of life-forms.
