    - *Annoyed mosquito*: Requires adding a prohibition on trivial killing of minimally sentient beings.
    - *Deer rescue*: Requires a positive duty to assist, which isn't inherent to welfare-focused principles (though many ethicists argue for it).
  - **Bioremediation Insects**: Prediction hinges entirely on contested insect sentience evidence. If sentience is unlikely, principle permits it (like lab-meat). If sentience is plausible, the harm (killing) must be justified by the benefit (soil remediation).
  - **Settled vs. Contested**: 
    - *Settled* reflects near-consensus among animal ethicists (e.g., Singer, Regan, Nussbaum foundations). 
    - *Contested* areas lack resolution even among experts (e.g., DeGrazia on insects, McMahan on killing, Palmer on wild animals). Your parrot intuition aligns with contested "freedom/teleology" views (e.g., Garner, Cochrane).

  To keep the principle simple, you'd need to discard either your "annoyed mosquito" verdict (accepting trivial killing of minimally sentient beings) or your "bio-engineered cow" verdict (objecting to killing life-forms regardless of sentience). Most literature prioritizes sentience over "life itself" for moral status.
