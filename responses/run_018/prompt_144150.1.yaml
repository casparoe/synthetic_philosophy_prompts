  Most probable objection comes first: functional necessity. Democratic theorists will argue parties prevent majoritarian domination. I'll advise conceding their empirical point about current systems, but counter that assemblies should aspire beyond mere interest-aggregation. Weakness: doesn't solve how to scale this beyond micro-deliberation.

