prompt: |-
  I spent thirty years studying marine ecosystems and only started reading philosophy seriously after I retired — mostly philosophy of mind and a little ethics. I'm putting together a podcast for other scientists who want to talk about ideas without feeling like they missed some secret handshake in grad school. My next guest is a philospher — not a celebrity, just an unnamed defender of a strong eliminativist line on self-deception — who argues that genuine self-deception is conceptually impossible because a single agent can't hold contradictory beliefs with identical content, and that what looks like self-deception is really just compartmentalized subpersonal processing that never reaches full doxastic status.

  I want eight to ten interview questions that go way past the intro-level stuff. First, ask her how she handles the immune-system analogy — how the body suppresses self-recognition to avoid attacking its own tissue — and whether that kind of functional suppression is structurally like belief management or just mechanics without any mental content; include the follow-up for when she says it's just biology, not belief. Second, ask about artificial systems: if a large model has contradictory weights in different layers and behaves inconsistently, is that structurally analogous to self-deception, or is it just architecture with no unified subject? Give me the sharp follow-up keyed to her likely reply that there's no agent there to deceive. Third, press her on whether her view is that self-deception is conceptually incoherent or merely empirically absent, with a follow-up asking what clinical dissociation or split-brain evidence could actually move her. For the rest, dig into the actual content: how she responds to partitionist replies, whether her view collapses into a deflationary account once you allow indexical or temporal shifts in belief content, and what her account predicts for people who sincerely report feeling deceived by themselves. Write it all in American English, keep it casual, and don't include any reading lists or citations — I want to use this in conversation without needing to look things up.
