answer: |-
  ### Opening Remarks: 'Harms Without Matter? Virtual Worlds and Moral Ontology'  

  Good morning. I extend no ceremonial welcome—not because you aren’t welcome, but because we have too little time for platitudes. We are here to confront a genuine fracture: metaphysicians doubting virtual entities possess the substance to cause real harm, and practitioners witnessing users shattered by virtual assault or loss. Both perspectives are coherent. Both risk speaking past each other. Today, we bypass compromise. Instead, I offer a distinction—one that structurally limits what we *can* claim—to force precision into this debate.  

  Consider two scenarios:  
  First, a user inhabiting a haptic-feedback environment is violently shoved. Their headset trembles; their avatar stumbles. They feel a surge of nausea, a gasp trapped in their throat.  
  Second, a user discovers their meticulously curated virtual gallery—a digital proxy symbolising years of creative labour—deleted by a stranger. They read the news coldly on a static screen.  

  Both are harms. But *how* they harm differs radically. This difference is captured by distinguishing:  
  - **Indexical Harm**: Harm arising from *disruption to the user’s situated presence*. Here, the self is not merely represented but *embodied*—spatially, sensorially, emotionally anchored in the virtual environment. Assaults, violations, or disorientations in such spaces fracture the user’s lived coherence. The harm resides in the *collapse of subjective continuity*.  
  - **Representational Harm**: Harm arising from *damage to symbolic proxies*. Here, the digital object—a character, asset, or token—stands for the user’s identity, labour, or social capital. Its destruction is an affront, but one mediated by meaning. The harm resides in the *rupture of narrative or social value*.  

  This framework imposes constraints. It forbids two seductive errors:  
  1. **It forbids naive realism**. Virtual swords have no physical mass; virtual blood no biological stain. Indexical harm does not demand we treat pixels as atoms. It demands we treat *the user’s phenomenological entanglement*—their felt presence—as irreducibly real. If a user’s world-disclosing immersion is shattered, *that shattering* is the ontological ground.  
  2. **It forbids dismissive irrealism**. To say “only symbols were destroyed” ignores that symbols scaffold identity, labour, and community. But representational harm alone cannot explain trembling hands after virtual assault. Trauma here stems not from broken symbols, but from broken presence.  

  To the metaphysicians: This framework does not inflate virtual entities into substances. It asks you to grapple with *presence* as a condition of subjectivity—one disrupted by designed environments. Indexical harm challenges you to explain how selfhood can be violated without matter.  
  To the practitioners: This framework does not reduce trauma to illusion. But it demands you discriminate between harms rooted in visceral embodiment and those rooted in symbolic loss. Not all virtual damage wounds the self with equal immediacy.  

  Our task today is not to agree on what exists. It is to agree on what *matters*—and how. Let this distinction be our scalpel. Dissect claims. Reject vagueness. If a harm is called “real,” ask: is it indexical or representational? That question alone will expose false assumptions on all sides.  

  We begin, then, not with unity, but with a shared constraint: the refusal to let ontology collapse into either naive objecthood or negligent subjectivism.  

  \answer{Harm in virtual worlds must be located not in pixels or platitudes, but in the violent unmaking of presence—or the calculated erosion of what presence builds.}
