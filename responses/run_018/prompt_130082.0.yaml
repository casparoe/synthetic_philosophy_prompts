  I am a doctoral candidate in philosophy of technology. I have been invited to deliver the opening remarks—approximately five minutes—at an interdisciplinary workshop entitled 'Harms Without Matter? Virtual Worlds and Moral Ontology'. The audience is divided: on one side are metaphysicians and philosophers of mind who are sceptical that virtual entities possess the ontological weight required to ground genuine harm; on the other are VR designers, digital ethicists, and legal scholars who regularly encounter users reporting serious psychological injury after virtual assaults or the destruction of persistent virtual property within embodied, haptic-feedback environments. I want the remarks to avoid ceremonial welcome and instead let a philosophical distinction do real structural work. Specifically, I want to introduce a framework I am developing—distinguishing 'indexical harm', in which a user's situated, first-person presence within a virtual environment is disrupted, from 'representational harm', in which only a digital proxy symbolically linked to the user is affected—without allowing this to collapse into either naive realism about virtual objects or dismissive irrealism about user trauma. The speech should therefore neither claim that virtual objects are physically real, nor imply that reported trauma is illusory, and it should leave both camps with a precise reason to stay in the room rather than a false compromise. Please write the remarks in British English, in a formal register accessible to non-philosophers, and structure them so that the distinction genuinely constrains what can and cannot be said. Do not include a bibliography, reading list, or citations, and do not use verbatim quotations from named authors unless you can verify the wording from a fetched source; if in doubt, paraphrase without quotation marks. End with the speech's bottom-line claim in a single sentence inside \answer{...}.
