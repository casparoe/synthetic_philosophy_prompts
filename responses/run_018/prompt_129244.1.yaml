answer: |-
  You're mistaking strategic necessity for legal authorization. Resolution 1973 explicitly prohibited "a foreign occupation force" and confined action to protecting civilians through *necessary measures* short of regime change. Neutralizing mobile anti-aircraft units near Benghazi? Defensible. But systematically cratering Gaddafi's Tripoli compound, state TV, and command nodes transformed NATO from a civilian shield into an air force for the rebels. Once you accept that "protection" requires dismantling the sovereign state's entire coercive apparatus—its very capacity to govern—you've smuggled in regime change under humanitarian cover. The mandate didn't collapse because we were incompetent; it collapsed because the kinetic logic of decapitating the regime is *incompatible* with the Security Council's narrow, defensive framing. Libya proves that structural destruction *is* regime change by another name.  

  Your move.
