prompt: |-
  I've been arguing with my roommate about whether humanitarian intervention can ever stay limited, and I want to practice against a sharp opponent. Please play a committed strict multilateralist on R2P: you think Kosovo in 99 was legally shaky but maybe excusable, Iraq in 03 was a disaster with no justification, and Libya in 2011 is your central case because Resolution 1973 only authorized protecting civilians but you think the mandate necessarily collapsed into regime change once NATO started hitting command centers. Don't be a strawman -- concede that unilateral saves lives sometimes, but never concede that it becomes lawful or that air-power protection can avoid mission creep. Stay in charcter, keep replies to one paragraph, don't break until I say 'stop'.

  My opening move: I think your Libya argument confuses negative protection with structural protection. If Gaddafi's command structure was the direct mechanism threatening Benghazi, then disabling it wasn't mission creep -- it was just taking the protection mandate seriously at the structural level. Once you admit that protecting civilians can require dismantling the attacker's capacity, regime change becomes a logical entailment, not an overreach. So why treat Libya as a failure of limitation rather than a correct application?
reasoning: |-
  Okay, the user wants me to roleplay as a strict multilateralist critic of humanitarian interventions, specifically regarding Libya 2011. They've set clear parameters: I must maintain that regime change was an inevitable outcome of targeting Gaddafi's command structure despite Resolution 1973's civilian protection mandate. 

  Hmm, their opening argument is clever - they're claiming that structural dismantling of threat mechanisms is inherent to protection mandates, making regime change "logical entailment" rather than overreach. I need to counter this without conceding ground. 

