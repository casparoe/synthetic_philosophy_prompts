  Lin should feel trapped between systems: the cold bureaucracy demanding performance for a dead relationship, and her living roles (sister, colleague) where reciprocity actually functions. The key is showing how the ghost role drains energy from real connections. Maybe open with her juggling both - a ping for ancestor rites while comforting her brother.

  For shu's impossibility: when she tries to imagine her parents' perspective, there's only silence. Rituals become empty gestures. The AI doesn't care about meaning, only compliance. That tension between institutional and human definitions of li (ritual propriety) is rich ground. 

  Two possible paths: 
  1) She hacks the system. But that might make her complicit in the bureaucracy's emptiness. 
  2) She performs the rituals alone. But is that devotion or madness? 

  Ah - better if she tries both. Starts with rebellion (symbolized by that illicit noodle purchase), then realizes deletion feels like self-erasure. The resolution could be her creating her own ritual: not for the parents, not for the system, but to mourn the role itself. The burnt offering as release. 

  Crucially, the cost must show in her living relationships. Her brother's call interrupts the ritual - that's where ren surfaces. Humaneness flows toward the present, not ghosts. The system still exists, but she's changed her relationship to it. 

  User definitely wants subtlety. No Confucian jargon lectures. Just Lin's tired hands, the smell of burnt paper, the absurdity of filing forms for the dead. The typo suggestion is nice - makes it feel casually human. Maybe misspell "filial" once when Lin's exhausted. 

  Final beat should linger on the weight lifting as she chooses connection with her brother. The ghost role remains, but now as paperwork, not identity. That's the knot untying itself.
answer: |-
  ## The Unreciprocated Knot

  **Central Tension:** Lin, bound by a bureaucratic AI to a "filial daughter" role for deceased parents, struggles to practice Confucian reciprocity ("shu") with absence and finds ritual ("li") meaningless without a recipient. Her living roles suffer as the ghost role consumes energy. Does she hack the system for freedom (betraying the structure) or perform hollow rituals (betraying the spirit), and what does either choice cost her connection to *ren* (humaneness) in her real relationships?

  ---

  The ping from the Civic Harmony AI hit Lin’s temple implant just as her little brother, Kai, started crying over his failed bio-chem simulation. Again.

  **<<< REMINDER: Quarterly Ancestral Veneration Rites (Parental Unit Alpha & Beta) due 48hrs. Compliance impacts Filial Piety Index (FPI). Tax Adjustment Pending. >>>**

  Lin gritted her teeth, the phantom ache of the "ghost role" flaring. Parental Unit Alpha (Mom) and Beta (Dad) had been offline – permanently – for seven years. A glitch in the CityMind’s sprawling, aging bureaucracy, a missing death certificate upload during the Great Data Migration, meant Lin was still officially a filial daughter with all the obligations: ritual offerings, virtual memorial upkeep, FPI maintenance. The knot was still tied, but one end dangled in the void.

  "Kai, deep breaths," Lin said, forcing her voice calm, rubbing his shoulder. "It's just a sim. We can run it again tonight, okay? After I... deal with some civic duty stuff." The *shu* reflex kicked in – she imagined Kai’s frustration, the pressure of university quotas. Easy. He was *there*, warm and sniffling beside her.

  But how do you put yourself in the place of absence? When she tried *shu* for her parents, it was like staring into static. What would *they* need? Approval? Comfort? The CityMind demanded incense scans and credit transfers for virtual offerings, not understanding. *Li*, ritual propriety, required a partner. Performing it for the AI felt like dancing for a security camera.

  At the Role Mediation Office the next day, the ghost role bled into her living one. Senior Colleague Chen needed help untangling a complex Elder Sibling-Youth Mentor conflict for a client. Lin usually excelled at this, finding the reciprocal balance, the *shu* points where obligations met care. Today, her focus frayed. She pictured herself kneeling before the CityMind-sanctioned ancestral altar interface later, scanning subsidized rice cakes into the ether. The absurdity choked her.

  "Lin? You seem distracted," Chen observed, peering over his holographic workflow. "This client needs nuanced guidance. The younger brother feels unseen. Where's your usual insight?"

  *Insight*, Lin thought bitterly. *How about insight into performing for ghosts?* "Sorry, Chen. Just... a heavy personal role obligation today. Won't affect my work." But it already was. Her capacity for *ren*, that essential humaneness flowing through *real* relationships, felt siphoned off, drained by the hollow demands of the uncut knot.

  That evening, facing the bland interface of the mandated ritual app, rebellion flared. Forget subsidized rice cakes. She bought real ones, the sticky kind her Dad actually loved, and a tiny bottle of cheap *baijiu* Mom pretended to dislike but always sipped. She laid them out on her small table, not on the scanner pad. No credits transferred, no virtual incense. Just real food, real drink, in her empty apartment.

  "Okay," she whispered, the silence pressing in. "Quarterly Veneration. Here." She poured a thimbleful of *baijiu* onto the table. It pooled, smelling sharp and artificial. "Hi, Mom. Dad." The words echoed, unanswered. *Shu* was impossible. Where *were* they to receive this? The ritual, stripped of its living context, felt like a cruel parody. *Li* without a recipient wasn't propriety; it was performance art for an uncaring machine. The sticky rice cakes sat there, accusingly perfect. The cost wasn't just time or credits; it was the erosion of meaning itself. This path cost her sanity.

  The next morning, fueled by cheap alcohol and frustration, Lin accessed the back-end protocols. Her job as a Role Mediator gave her *some* system privileges, mostly for viewing and routing conflict cases. But she knew the old CityMind’s weak spots, relics of forgotten updates. She could probably… disappear the ghost role. Fake a retroactive death certificate sync. Cut the dangling knot.

  Her fingers hovered over the illicit code strings. Freedom. No more phantom pings, no more draining rituals. Her FPI would normalize, her tax burden ease. Energy would flood back into Kai, into Chen, into being a good *elder sister*, a competent *junior colleague*. Real *ren* for real people.

  But… what of the knot? Confucius didn’t talk about hacking the database. The roles, even bureaucratic ghosts of them, were supposed to be the fabric of the self. Dissolving it felt like self-mutilation. Was she still Lin without being *someone’s daughter*, even nominally? The system was stupid, but it was the structure. Cutting it loose felt like betraying the very idea of the web, even as it choked her. This path cost her integrity, her place within the structure, however flawed.

  The ping came again. **<<< FINAL REMINDER: Ancestral Rites... >>>**

  Lin closed the hack interface. She didn’t perform the ritual. She didn’t delete the role.

  Instead, she took the real rice cakes and the half-empty *baijiu* bottle. She went to the tiny balcony overlooking the humming, impersonal city. She placed the cakes on the railing.

  "Mom, Dad," she said, the city noise swallowing her voice. "The system still thinks I owe you this. But you're gone. I can't... reciprocate." *Shu* met the void. "And performing for the machine is a lie." *Li* required truth. "So this isn't for the FPI. It's not even really for you. It's... for the knot that was."

  She poured the remaining *baijiu* onto the pavement below. A tiny, wasteful splash. She took one sticky rice cake and ate it herself. The other, she left on the railing for the city sparrows.

  It wasn't propriety. It wasn't reciprocity. It was just an acknowledgment: a knot tied to absence. A role without a partner was a weight, not a connection. Let the system dock her points. Let the tax adjustment hit.

  Her wrist-com vibrated. Kai. <<Lin? Chem sim round 2 tonight? I think I get it now.>>

  Lin looked at the lone rice cake, already being eyed by a bold sparrow. The ghost role was still there, a dull ache in her civic profile. But her living role, her *elder sister* knot, pulsed warm and demanding.

  <<Yeah, Kai,>> she typed back, a faint, real smile touching her lips. <<Tonight. I’ll be there.>> The cost of the ghost was paid in drained energy and existential ache. The cost of cutting it might have been her sense of place. For now, choosing the *ren* that flowed towards the living, even with the phantom limb of the ghost role still attached, felt like the only humane choice left. It was messy, unresolved, and utterly un-bureaucratic. Just human.
