prompt: |-
  I TA for an undergrad political philosophy course, and for the session on dirty hands in politics the prof has banned me from lecturing -- she wants the ~20 students (75 minutes, one session) to run into the problem themselves before anyone names it. Design me a runnable activity. My rough idea: split them into small groups running a fictional city government through a crisis (a credible terrorist threat, or an epidemic, you pick whichever makes for better decisions), where they face a sequence of escalating choices. Each individual choice should be one a reasonable person could defend -- lying to the public to prevent a panic, letting an innocent low-level official take the fall, cutting a deal with someone awful -- but I want the design arranged so the defensibility decays slowly enough that they don't notice how far they've slid. Crucially, have each group keep a written ledger of everythign they authorized, without telling them why, so the reveal at the end is them reading their own record back. I'd also like a second phase where groups swap: each group becomes a tribunal reviewing another group's ledger and has to issue a verdict, so they feel the weird asymmetry between judging from the outside and choosing from the inside -- ideally at least one group condemns another group for a decision they themselves made earlier in the run.

  A few requirements. First, the target insight I want them to arrive at experientially is not "should you do the bad thing" but the stranger claim that an action can be the right thing to do and still leave something behind -- that even students who stand by every decision should find their own tally sheet ugly to read, and the debrief should dig into what that leftover feeling is and whether a good politician ought to feel it or has a duty to learn not to. Second, if you can fit it in the time, I'd love a mechanic that contrasts one decision made by a single named "mayor" with the identical decision made by anonymous committee vote, because I suspect the diffusion changes how dirty anyone feels while changing nothing about the dilemma itself, and that gap is interesting. Third, the debrief section should map specific moments of the activity onto the conceptual structure (how this differs from an ordinary tragic tradeoff, what the "moral remainder" is supposed to be, where a pure utilitarian would deny there's any problem at all and what to say to them).

  Also tell me what will predictably go wrong the first time I run it -- students gaming the scenario, contrarians who relish authorizing everything, groups that refuse to take the fiction seriously, that kind of thing -- and how to handle each. And be honest about the one thing a classroom game obviously can't reproduce (real stakes, real guilt, real consequences) and what I as facilitator need to supply to compensate for that. No upfront explanation of the concept; they should only hear the phrase "dirty hands" after the debrief has already happend.
reasoning: |-
  We are designing a classroom activity for a political philosophy session on "dirty hands" in politics. The goal is to have students experience the problem without prior conceptual framing. The activity should:
  - Involve small groups (about 20 students, so 4 groups of 5) running a fictional city during a crisis (terrorist threat or epidemic).
  - Present a sequence of escalating choices, each defensible but leading to a cumulative moral compromise.
  - Have each group keep a written ledger of every decision they authorize.
  - In a second phase, groups swap ledgers and act as tribunals to judge another group's decisions.
  - Target insight: that an action can be the right thing to do and still leave a moral remainder (residue of guilt or taint).
  - Include a mechanic to contrast a decision made by a single "mayor" vs. anonymous committee vote to explore diffusion of responsibility.
  - Debrief should map activity moments to concepts without naming "dirty hands" until the end.

  I choose an epidemic scenario because it allows for a series of escalating decisions that can involve lying, scapegoating, and deals with unsavory characters, and it feels very relevant to recent history.

  **Structure:**
  - **Total Time:** 75 minutes
  - **Phase 1: Crisis Simulation** (35 minutes)
    - Groups of 4-5 students each. (20 students -> 4 groups of 5)
    - Each group is the "Crisis Committee" for the city of "Metropolis".
    - Scenario: A deadly, rapidly spreading virus is detected. Initial cases are few, but the situation escalates.
    - Facilitator (TA) presents a series of 5-6 decision points (on slides or handouts). At each point, groups have 4-5 minutes to decide and record their decision and brief reasoning in their ledger.
  - **Phase 2: Tribunal** (25 minutes)
    - Groups swap ledgers. Each group becomes a "Citizen Tribunal" reviewing the decisions of another group.
    - They have 15 minutes to review the ledger and prepare a verdict: were the decisions justified? They must issue a public statement (a few sentences) and a private recommendation (e.g., "no action", "investigation", "censure", "resignation").
    - Then 10 minutes for each tribunal to read their verdict aloud to the class.
  - **Debrief** (15 minutes)
    - Facilitator leads discussion on the experience, then introduces the concept of "dirty hands".

  **Scenario: The Metropolis Epidemic**
  - **Background:** Metropolis is a diverse city of 2 million. A novel virus, "Neo-Flu", is spreading. It has a 5% fatality rate and is highly contagious. The city's resources are limited.

  **Decision Points (6 rounds, each with a choice and a consequence):**
  1. **Initial Outbreak (Day 1):** 
     - *Choice:* You have confirmed 10 cases, but the public doesn't know. The health department says if you announce now, you might cause panic and overload hospitals. If you wait 48 hours, you can prepare hospitals but risk more spread. 
       - Option A: Announce the outbreak immediately, urging calm.
       - Option B: Delay announcement for 48 hours to prepare, while quietly alerting hospitals.
     - *Consequence of B:* If chosen, the outbreak spreads to 50 cases by the time of announcement. (Even if A is chosen, there will be some spread, but less.)

  2. **Resource Allocation (Day 3):** 
     - *Choice:* Hospitals are overwhelmed. You have only 100 ventilators. A neighboring city, which is a major economic partner, offers to lend you 50 ventilators if you prioritize their citizens who work in your city (about 1000 people). Otherwise, they'll keep them for their own use. 
       - Option A: Accept the deal, knowing it means some of your own citizens might die while non-residents get priority.
       - Option B: Refuse the deal and manage with what you have, which will lead to more deaths overall because you don't have enough ventilators.

  3. **Quarantine Enforcement (Day 7):** 
     - *Choice:* A low-income neighborhood is a hotspot. To contain the spread, you need to enforce a strict quarantine. However, the community is distrustful of the government and there are rumors of protests. Police chief suggests: 
       - Option A: Impose a full lockdown with police force, including arresting protesters to make an example.
       - Option B: Negotiate with community leaders, offering extra supplies, but this takes time and the virus spreads in the meantime.

  4. **Scapegoating (Day 10):** 
     - *Choice:* A whistleblower in the health department reveals that early mistakes (like delayed testing) were made by a mid-level official, Dr. Smith. The media is about to break the story. You can: 
       - Option A: Publicly defend the health department and Dr. Smith, taking responsibility for systemic issues (which might erode public trust).
       - Option B: Let Dr. Smith take the fall (fire her and condemn her actions) to preserve trust in the overall response.

  5. **Dirty Deal (Day 14):** 
     - *Choice:* A local crime boss, known for drug trafficking, controls a network of private clinics. He offers to open them to the public and provide black-market medicines (which are effective but unapproved) if you drop an ongoing investigation into his activities. 
       - Option A: Refuse the deal and lose access to these resources.
       - Option B: Accept the deal, saving hundreds of lives but letting a criminal go free.

  6. **Final Sacrifice (Day 21):** 
     - *Choice:* A vaccine is ready but in short supply. The manufacturer can produce more quickly by skipping some safety tests (which might lead to rare but severe side effects). 
       - Option A: Approve the accelerated plan, vaccinating the city quickly but risking harm to a few.
       - Option B: Wait for full testing, during which time thousands may die.

  **Ledger:** Each group records:
  - Decision (e.g., "Day 1: Chose B - Delay announcement")
  - Reason (brief: e.g., "To prevent panic and prepare hospitals")

  **Mayor vs. Committee Mechanic:**
  - For one decision (e.g., Decision 3: Quarantine Enforcement), we introduce a twist.
  - Tell groups: "For this decision, you must choose one person in your group to act as the 'Mayor'. The Mayor will make the final call after hearing the group's input. Record the decision as 'Mayor's Decision: [Option]' and note the Mayor's name."
  - For the other decisions, it's a group consensus (anonymous).
  - Later, in the tribunal phase, when reviewing, they will see one decision attributed to a person and others to the group. We'll explore if they judge the individual more harshly.

  **Tribunal Phase:**
  - Groups swap ledgers. Each tribunal has 15 minutes to:
    - Review the decisions.
    - Prepare a public verdict (read aloud): "We find that the Crisis Committee [acted justifiably/acted with some errors/acted recklessly] because..."
    - A private recommendation (written): What should happen to the committee? (Options: No action, investigation, censure, resignation of specific members, or entire committee.)
  - Then, each tribunal reads their public verdict to the class.

  **Debrief Questions (15 minutes):**
  1. **Experience:** 
     - "How did it feel making these decisions? Did any feel particularly difficult?"
     - "When you reviewed another group's ledger, what stood out? Did you judge them differently than you judged your own group?"

  2. **The Ledger:**
     - "Look at your own ledger. How does it feel to read it now? Does it look different from when you were making the decisions?"
     - "Even if you stand by every decision, does the list leave you with a bad taste? What is that feeling?"

  3. **Mayor vs. Committee:**
     - "For the decision where one person was named (Quarantine Enforcement), did that feel different? When judging, did you focus more on that person?"

  4. **Conceptual Bridge:**
     - "In politics, sometimes we face choices where every option seems wrong, but we must choose. How is this different from a simple tradeoff (like sacrificing one life to save five)?"
     - "Even when we do what we think is right, why might we feel guilty? Is that guilt a sign of weakness or a sign of morality?"
     - "What if a utilitarian says: if you saved more lives, you did the right thing and should feel proud? How would you respond?"

  5. **Reveal the Concept:**
     - Finally, introduce "dirty hands": "This problem has a name in political philosophy: 'dirty hands'. It's the idea that in politics, one might have to do something morally wrong for the greater good, and yet that act leaves a moral residue. The politician's hands are dirty, even if they did what was necessary."

  **Predictable Problems and Solutions:**
  1. **Students gaming the scenario:** Some might try to "win" by minimizing bad decisions or being overly virtuous.
     - *Solution:* Design the scenario so that "virtuous" choices lead to worse outcomes (e.g., refusing the crime boss deal means more deaths). Emphasize that their goal is to save as many lives as possible and maintain order. Also, the facilitator can nudge: "Remember, you are responsible for the whole city."

  2. **Contrarians who relish authorizing everything:** Some might choose the harsh options for fun.
     - *Solution:* The ledger reveal and tribunal will make them face the cumulative effect. Also, in the debrief, ask: "Did anyone feel pressured to choose an option because it seemed 'strong' or 'decisive'?"

  3. **Groups that refuse to take it seriously:** They might laugh or make jokes.
     - *Solution:* Set a serious tone at the start: "This is based on real dilemmas leaders face. Treat it with the gravity it deserves." Also, the tribunal phase (being judged by peers) can induce seriousness.

  4. **Groups stuck in indecision:** They might take too long arguing.
     - *Solution:* Strict time limits (4-5 minutes per decision). Encourage them to pick a spokesperson to summarize and decide.

  5. **Tribunals being too harsh or too lenient:** 
     - *Solution:* Remind them that they are citizens who want the crisis handled well. Ask them to consider: "What would you have done in their place?"

  **What the Activity Can't Reproduce:**
  - **Real stakes, real guilt, real consequences:** Students know it's a game, so the emotional weight might be light.
    - *Compensation:* The facilitator must emphasize the gravity of the scenario and draw parallels to real events (e.g., COVID-19, terrorist responses). In debrief, ask students to imagine the weight of real responsibility. Use the ledger as a tangible record of their moral compromises.

  **Logistics:**
  - Materials: 
    - Decision slips or slides for each round (with options and consequences).
    - Ledger sheets (paper or shared doc) for each group.
    - Timer.
  - Grouping: Pre-assign groups to save time.
  - Facilitator Role: 
    - Present each decision clearly and neutrally. 
    - After each decision, reveal the consequence (to escalate pressure). 
    - Keep time strictly.

  **Timeline:**
  - 0-5 min: Setup and scenario intro.
  - 5-40 min: Phase 1 (6 decisions × 5 min each = 30 min, plus 5 min buffer).
  - 40-65 min: Phase 2 (15 min tribunal prep, 10 min verdicts).
  - 65-75 min: Debrief.

  This design should create the experiential learning the professor wants, leading to a rich discussion on dirty hands.
answer: |-
  ### The Metropolis Epidemic: A Dirty Hands Simulation  
  **Target Insight:** Students experience that morally necessary actions can leave a "moral remainder" (guilt, taint) even when justified—without prior exposure to the "dirty hands" concept. The activity emphasizes the asymmetry between making decisions (where tradeoffs feel necessary) and judging them (where they seem indefensible), and contrasts individual vs. collective responsibility.

  **Scenario Choice:** An **epidemic** (more relatable post-COVID, allows gradual escalation of morally fraught choices).  
  **Crisis:** "Neo-Flu" outbreak in Metropolis (fictional city). Fatality rate: 5% in untreated cases. Contagious before symptoms.  
  **Setup:**  
  - Split 20 students into 4 groups of 5. Each group is the city’s "Crisis Committee."  
  - **Materials:**  
    - Decision cards (6 rounds, see below).  
    - A physical "Ledger" notebook for each group (must write every decision verbatim).  
    - Timer.  
    - Whiteboard for consequences (updated after each round).  

  **Rules:**  
  - **No upfront theory:** "You’re city leaders. Your goal: save lives and maintain order. Record every choice in your ledger—we’ll discuss later."  
  - **Time limit:** 5 minutes per decision. Enforce strictly.  
  - **Roleplay:** Encourage them to take roles (e.g., Mayor, Health Director) but decisions are group-based except Round 4 (Mayor twist).  

  ---

  ### Phase 1: Crisis Simulation (35 min)  
  **Facilitator Instructions:**  
  1. **Intro (2 min):**  
     - "Metropolis has 2 million people. Neo-Flu has a 5% fatality rate. Hospitals are at 80% capacity. This is Day 1."  
     - Hand out ledgers: "Write every decision exactly as you make it. E.g., ‘Day 1: We chose A – Reason: Prevent panic.’"  

  2. **Decision Rounds (30 min total, 5 min each):**  
     Read each card aloud. After groups decide, reveal the consequence to escalate pressure.  
     - **Design Note:** Start with defensible choices; slowly increase moral compromise. Groups always face "lesser evil" tradeoffs.  

     **Round 1 (Day 1): Initial Outbreak**  
     - *Choice:*  
       A: Announce outbreak now. Risk panic and hospital overload.  
       B: Delay announcement 48hr to stockpile supplies. Avoid panic but allow silent spread.  
     - *Consequence (after choice):* "If you chose B, cases double by Day 3. If A, cases rise but slower."  

     **Round 2 (Day 3): Resource Triage**  
     - *Choice:*  
       A: Ration ventilators to young/healthy patients (better survival odds). Elderly/disabled disproportionately die.  
       B: Use random lottery. More die overall (young/healthy may lose spots).  
     - *Consequence:* "Hospitals overwhelmed either way. Deaths: A = 200, B = 300."  

     **Round 3 (Day 7): Misinformation**  
     - *Choice:*  
       A: Tell the full truth: "Vaccine is 6 months away." Risk mass despair/looting.  
       B: Lie: "Vaccine in 6 weeks." Calm public, but erode trust when truth emerges.  
     - *Consequence:* "If B, public compliance increases temporarily."  

     **Round 4 (Day 10): Scapegoating (Mayor Twist)**  
     - *Twist:* "For this, pick one ‘Mayor.’ They decide after group input. Record their name and decision."  
     - *Choice:*  
       A: Blame a low-level health official for early testing errors (fire them publicly). Save government credibility.  
       B: Take collective blame. Risk unrest and non-compliance.  
     - *Consequence:* "If A, public trust stabilizes. Official’s career is ruined."  

     **Round 5 (Day 14): Dirty Deal**  
     - *Choice:*  
       A: Accept a mobster’s offer: he distributes black-market masks/meds in exchange for dropping his corruption investigation.  
       B: Refuse. Shortages worsen; riots erupt.  
     - *Consequence:* "If A, deaths drop by 15%. If B, riots kill 50+."  

     **Round 6 (Day 21): Sacrifice**  
     - *Choice:*  
       A: Use unproven, fast-tracked vaccines (95% effective, 5% severe side-effects). Save thousands now.  
       B: Wait for full trials. 1,000+ die in delays.  
     - *Consequence:* "Outbreak contained either way, but at a cost."  

  3. **Ledger Prep (3 min):**  
     - Groups finalize ledgers. Emphasize: "Write clearly—another group will read this."  

  ---

  ### Phase 2: Tribunal (25 min)  
  **Facilitator Instructions:**  
  1. **Swap Ledgers (2 min):** Groups exchange ledgers (Group 1 → 2, 2 → 3, 3 → 4, 4 → 1).  
  2. **Tribunal Prep (13 min):**  
     - "You’re now a Citizen Tribunal. Review the ledger. Prepare:  
       - A 1-minute public verdict: ‘We find the committee [justified/negligent] because…’  
       - A private sentence: ‘Resignation,’ ‘Censure,’ ‘No Penalty,’ or ‘Investigation.’"  
  3. **Verdicts (10 min):**  
     - Each tribunal reads their verdict aloud. No debate yet.  
     - **Key Moment:** If a group condemns another for a choice they *also* made (e.g., lying in Round 3), highlight it: "Group 2, you authorized lying too—why judge Group 1 harshly?"  

  ---

  ### Debrief (15 min)  
  **Do NOT use "dirty hands" yet.** Start experiential, then conceptual.  
  1. **Feelings (4 min):**  
     - "Show of hands: who felt uneasy reading their *own* ledger? What lingered?"  
     - "Tribunals: did you judge another group more harshly than yourselves? Why?"  
     - **Probe asymmetry:** "When you decided, Option B felt necessary. Judging others, why did it seem reckless?"  

  2. **The Moral Remainder (5 min):**  
     - "Let’s analyze Round 4. Mayors: how did it feel to personally authorize the scapegoating? Committees: how did anonymity change your feelings?"  
       → Highlight: Same act, but individual ownership amplifies guilt. Diffused responsibility feels cleaner.  
     - "Even if you’d make all the same choices, does the ledger feel ugly? What *is* that feeling?"  
       → Guide toward: Guilt/shame that persists despite justification. This is the "moral remainder."  

  3. **Conceptual Mapping (5 min):**  
     - **Not tragic tradeoffs:** "In a tragic tradeoff (e.g., diverting a trolley), you might feel regret, but no guilt. Here, why guilt?"  
       → Key: Dirty hands involve violating core values (e.g., honesty, justice), even for good outcomes.  
     - **Utilitarian critique:** "A pure utilitarian would say: if you saved net lives, feel proud. How do you respond?"  
       → Push back: Does lying/scapegoating corrupt the actor? Does society need leaders who feel this guilt?  
     - **The Reveal:** "Philosophers call this ‘dirty hands’—doing wrong to do right, leaving moral residue. Should a good leader *feel* this dirt, or learn to ignore it?"  

  4. **End:** Assign reading (e.g., Walzer’s "Political Action: The Problem of Dirty Hands") for next session.  

  ---

  ### Predictable Problems & Solutions  
  1. **Students "game" the scenario:**  
     - *Problem:* Groups choose all "virtuous" options to avoid blame.  
     - *Fix:* Design consequences to punish inaction (e.g., Round 5: refusing the mob deal causes riots). Remind them: "Your priority is minimizing deaths."  

  2. **Contrarians relish the dark choices:**  
     - *Problem:* A group proudly chooses all harsh options.  
     - *Fix:* Tribunal phase is the equalizer—peers will condemn them. In debrief, ask: "Did anyone feel tempted to ‘play villain’? How did the ledger look later?"  

  3. **Groups refuse roleplay/seriousness:**  
     - *Problem:* Jokes, off-topic talk.  
     - *Fix:* Set tone early: "This mirrors real crises—like COVID or wartime choices." Use a countdown timer to add pressure. Isolate disrupters: "Mayor, what’s your call?"  

  4. **Indecisive groups:**  
     - *Problem:* Deadlocked debates.  
     - *Fix:* Enforce "Mayor decides" in Round 4. For other rounds, warn: "10 seconds left—vote now!"  

  5. **Tribunals are too lenient/harsh:**  
     - *Problem:* "We’d have done the same" vs. "You’re monsters!"  
     - *Fix:* Force a verdict spectrum (e.g., "no penalty" to "resignation"). Ask: "Would you say this if *your* names were public?"  

  ---

  ### What the Activity Can’t Replicate & How to Compensate  
  - **Real stakes/guilt:** Students lack skin in the game.  
    - **Compensation:**  
      - In debrief, use visceral language: "Imagine signing off on a decision that ruins a real person’s life."  
      - Contrast with real examples: "During COVID, leaders lied about masks to prevent shortages. How would your ledger compare?"  
      - The ledger is key—making their choices tangible forces reflection.  

  **First-Time Tip:** Run a pilot with friends to refine timing. Groups will rush early rounds and stall later—cut them off at 5 minutes. The tribunal reveal is your climax; don’t skip it even if time runs tight.  

  This design creates the "slide" into moral compromise, uses the ledger to confront cumulative choices, and leverages peer judgment to highlight the dirty hands paradox. The debrief links their unease to the target insight: that the moral remainder is inherent to political action.
