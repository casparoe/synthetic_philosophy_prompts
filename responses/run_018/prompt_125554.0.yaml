  I am drafting a six-month dissertation prospectus in moral philosophy and need a polished, formal proposal of roughly two pages. The project concerns T. M. Scanlon's contractualist rejection of aggregative moral reasoning: Scanlon argues that harming one person to save several cannot be justified by counting heads, because contractualism asks whether a principle could be justified to each affected individual rather than whether it maximizes aggregate welfare. The existing literature largely treats this as a dispute about whether numbers have moral weight. I want to pursue a structurally different framing: whether Scanlon's implicit model of interpersonal justification is best reconstructed as a system of pairwise comparisons, and whether the familiar aggregation problem is therefore not merely a refusal to sum welfare but a deeper problem of cyclic preference structures—Condorcet-style cycles—within the space of justifiable reasons. Specifically, if justification proceeds pairwise, it may be that principle P is justifiable to A over B, B over C, and C over A, leaving no globally justifiable principle even when every local comparison is valid. The proposal should (1) state the precise research question, clearly distinguishing this structural framing from the standard quantitative framing of aggregation in contractualism; (2) explain why existing treatments leave the pairwise-reconstruction question open; (3) describe the method—close conceptual analysis of Scanlon's arguments in his 1998 book What We Owe to Each Other, combined with formal mapping of justification relations as tournament graphs, without requiring original mathematical proofs—together with a month-by-month timeline for the six months; (4) specify what a successful result looks like (e.g., a reconstructed contractualist procedure that either resolves or explicitly accommodates cycles) and what counts as failure (e.g., if the pairwise reconstruction collapses into standard aggregation or proves conceptually incoherent); and (5) include an honest scope assessment, noting the risk that the formal mapping may outpace the philosophical payoff within one semester. Do not include a bibliography, citation list, or literature review organized by reference; I will supply those myself.
