answer: |-
  ## Dissertation Prospectus: Cyclic Justification in Scanlonian Contractualism – A Structural Analysis of Aggregation

  **Proposed Title:** Beyond Numbers: Cyclic Preference and the Structural Basis of Scanlon's Rejection of Aggregation

  **Principal Investigator:** [Your Name]
  **Supervisor:** [Supervisor's Name, if applicable]
  **Institution:** [Your Institution]
  **Duration:** Six Months (Start Date: [Proposed Start Date])
  **Department:** Philosophy

  **1. Research Question:**
  The central research question of this dissertation is: **Does a faithful reconstruction of T. M. Scanlon’s contractualist model of interpersonal justification implicitly rely on a structure of pairwise comparisons between individuals, and if so, does this structure inherently generate Condorcet-style cycles that fundamentally challenge the possibility of globally justifiable principles in aggregation cases, irrespective of questions about the moral weight of numbers?**

  This question deliberately shifts the analytical focus from the *quantitative* debate prevalent in the literature (i.e., *whether* and *how much* numbers matter in justifying harms) to a distinct *structural* problem. While existing scholarship primarily interrogates whether Scanlon's framework can or should accommodate the simple summation of welfare across individuals, this project investigates the prior *logico-procedural* structure of justification itself. It posits that Scanlon's core requirement – that a principle must be justifiable *to each individual* affected, considering their objections – necessitates pairwise comparisons. The critical hypothesis is that this pairwise structure, rather than a mere refusal to sum, creates a vulnerability to cycles (e.g., Principle P is justifiable to A over B, justifiable to B over C, but justifiable to C over A), leading to an inherent instability or impossibility of finding a single principle justifiable to *all* simultaneously in certain multi-agent conflicts, even before aggregative sums are considered.

  **2. Gap in Existing Literature:**
  Existing treatments of Scanlon's rejection of aggregation overwhelmingly concentrate on the *output* of contractualist reasoning (whether a principle permitting harm to save many is acceptable) and the justificatory *grounds* for that output (e.g., the stringency of individual objections vs. the force of aggregate benefits). This has yielded sophisticated debates about the "numbers skepticism" inherent in contractualism and potential modifications to accommodate numbers without full aggregation.

  However, this literature largely takes the *process* of justification for granted or assumes a monolithic "justifiability-to-each" criterion. It seldom subjects the *internal relational structure* of justification between individuals to rigorous scrutiny. Key questions remain unexplored: What is the precise *logical form* of comparing justifiability across different individuals? Does justification inherently involve comparing the strength of *A's* reason-based objection against *B's* reason-based objection in a pairwise manner? And crucially, what are the *formal properties* of the relation "justifiable to X over Y" when applied across a set of individuals? The possibility that this relation might be non-transitive or cyclical, generating structural incoherence akin to Condorcet's paradox in social choice, has not been systematically investigated as the core explanation for aggregation problems within Scanlon's framework. The literature leaves the validity and implications of a pairwise reconstruction of the justification procedure fundamentally open.

  **3. Methodology and Timeline:**
  This project employs an integrated methodology combining close conceptual analysis with formal modeling:

  *   **Conceptual Analysis (Months 1-3):** A meticulous reading of Scanlon's *What We Owe to Each Other* (1998), focusing specifically on Chapters 4 ("Wrongness and Reasons") and 5 ("Promises"), with supplementary analysis of relevant passages elsewhere. The aim is to identify and explicate the implicit structure of interpersonal justification. Key questions include: How exactly are objections from different individuals weighed against each other? Does Scanlon describe a process of comparing objections pairwise? What role does the perspective of the individual *to whom* justification is owed play in assessing the objections of *others*? Does the text support or undermine the idea that justification involves pairwise "victories" of one individual's objection over another's in specific dyadic comparisons?
  *   **Formal Mapping (Months 3-5):** The insights from the conceptual analysis will be formalized using the framework of **tournament graphs**. In this model:
      *   Individuals affected by potential principles are represented as nodes.
      *   The relation "Principle P is justifiable to individual X over individual Y" (meaning X's objections under P are deemed stronger than Y's, or P is more acceptable from X's perspective than from Y's regarding the relevant comparison) is represented as a directed edge (arc) from X to Y.
      *   The resulting directed graph for a given set of principles and a specific case (e.g., harming one to save many) will be analyzed for structural properties, particularly the presence or absence of **cycles** (e.g., A>B, B>C, C>A) and **Condorcet winners/losers** (a principle justifiable to every individual over every other).
      *   Crucially, this formalization aims to *map* the logical structure implied by the conceptual analysis, not to develop novel mathematical theorems. Established properties of tournament graphs will be applied to analyze potential cyclic structures within the justification space.
  *   **Synthesis and Writing (Month 6):** Integrating the conceptual and formal analyses to directly address the research question. Evaluating whether the pairwise reconstruction is textually supported and philosophically coherent. Articulating the implications of identified cycles (or their absence) for understanding Scanlon's rejection of aggregation and the coherence of contractualist justification.

  **4. Success Criteria and Failure Conditions:**

  *   **Success:** The project will be successful if it achieves one of the following outcomes:
      1.  **Identifies a Structurally Novel Problem:** Demonstrates convincingly that Scanlon's justification procedure is best reconstructed as generating pairwise comparisons and that this structure inherently leads to Condorcet cycles in paradigmatic aggregation cases, explaining the impossibility of global justification as a fundamental *structural* feature rather than solely a refusal to sum.
      2.  **Resolves or Accommodates Cycles:** Offers a plausible, textually grounded reconstruction of Scanlonian justification that either (a) avoids cycles (e.g., by introducing transitivity constraints or a unique perspective for comparison), or (b) explicitly acknowledges the potential for cycles and provides a coherent contractualist account of how to proceed in their absence (e.g., through a meta-principle for cycle resolution acceptable to all, or by reframing the scope of justifiability).
      3.  **Clarifies the Dispute:** Provides definitive conceptual reasons *against* the pairwise reconstruction, thereby demonstrating that the aggregation problem truly resides at the level of comparing aggregate sums vs. individual claims, and not in a deeper structural incoherence.
  *   **Failure:** The project will be deemed unsuccessful in its core aim if:
      1.  **Collapse into Standard Aggregation:** The formal pairwise model inevitably reduces to, or presupposes, a model of interpersonal utility comparison or aggregation that Scanlon explicitly rejects, rendering the structural framing redundant.
      2.  **Conceptual Incoherence:** The attempt to reconstruct justification as a system of pairwise relations is shown to be fundamentally incompatible with core tenets of Scanlon's contractualism (e.g., the primacy of the "individual standpoints" or the nature of reasons) upon rigorous conceptual analysis, making the formal mapping philosophically moot.
      3.  **Formal Mismatch:** The tournament graph model proves incapable of capturing the relevant features of Scanlonian justification relations, or the analysis yields no significant insights (e.g., cycles are exceedingly rare or trivial in the relevant cases).
      4.  **Textual Underdetermination:** The textual evidence in *WWOTEO* is ultimately too ambiguous to support or refute the pairwise reconstruction decisively.

  **5. Scope Assessment and Limitations:**
  This project is deliberately focused and ambitious for a six-month timeframe. Its primary scope is the structural analysis of justification within Scanlon's *WWOTEO*, using aggregation cases as the critical test bed. Key limitations and risks include:

  *   **Limited Scope:** The analysis concentrates on *WWOTEO* as the foundational text. Scanlon's later elaborations and responses to critics will be noted but not exhaustively analyzed unless directly pertinent to the core structural question. Broader debates within social choice theory or alternative formal models (e.g., utility-based social welfare functions) will only be engaged insofar as they illuminate the specific Condorcet-cycle hypothesis within Scanlon's framework.
  *   **Formal-Philosophical Balance:** The principal risk is that the formal modeling (tournament graphs) may become technically intricate without yielding proportionately significant *philosophical* insights into contractualism. The project mitigates this by grounding the formalization firmly in the prior conceptual analysis and explicitly forgoing original mathematical proofs. Success hinges on the formal tools *illuminating* the conceptual structure, not replacing it.
  *   **Ambiguity of "Justifiable to X over Y":** Defining the precise meaning of the core relation for the formal model is a significant conceptual challenge. The project's viability depends on successfully operationalizing this relation based on Scanlon's text.
  *   **Single-Semester Constraint:** Six months imposes strict limits on depth and breadth. Exploring the full implications of identified cycles for other areas of contractualism (e.g., promising, distributive justice) or conducting extensive comparative analysis with other anti-aggregationist views falls outside this scope. The focus remains on establishing the validity and implications of the structural hypothesis itself within the core aggregation problem.

  This project promises a novel and potentially transformative perspective on a central debate in contemporary contractualist moral philosophy, moving beyond the well-trodden ground of "numbers matter" to investigate the foundational structure of justification itself.
