prompt: |-
  hey, I'm writing a feature on whether history can be objective and I want to check my framing doesn't collapse before I talk to sources. here's where I stand:
  (1) I'm with Ranke: the job is to show how things actually were, there's a real past with causal chains, and getting them wrong is failure not just difference.
  (2) Carr also convinced me every historian picks and orders evidence through present-day conserns, so there's no neutral archieve.
  (3) I reject Hayden White's stronger claim that history is literature with footnotes — real events constrain the plot even if narrative shape is unavoidable.
  (4) So I define objectivity as inter-subjective convergance among experts who practice narrative vulnerabilty: letting an anomalous source break your arc instead of massaging it in.
  (5) That's why analogies like Munich, Vietnam, or the Thucydides trap mislead — they export narrative arcs onto contexts with different structures.

  do these hang together? does (1) survive (2) or am I sneaking a view-from-nowhere? is there hidden tension between (3) and (4) — if form is unavoidable and shapes meaning, can expert agreement track truth or just shared conventions? and does (5) follow from (1)-(4), or does Carr's point make all framing analogical, so I'm holding analogies stricter than my own writing? rank tensions by severity, say cheapest fix for each, flag ones that only look bad, and tell me the single revision that cleans up the most.
