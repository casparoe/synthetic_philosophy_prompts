  Key elements of the theorem:
  - Unrestricted domain: The system must handle any possible individual preferences (i.e., any input configuration from users).
  - Weak Pareto principle: If every user prefers configuration A to configuration B, then the system must output A when the choice is between A and B (or, in the context of merging, the merged configuration must respect that unanimous preference).
  - Minimal liberalism: At least two users each have at least one pair of configurations that differ only in a "personal" setting (a setting they own) and for which their preference is decisive. That is, if a user owns a setting, then between two configurations that differ only in that setting, the system must output the configuration that the user prefers.

  The impossibility: There is no system that satisfies all three properties for every possible input (preference profile).

