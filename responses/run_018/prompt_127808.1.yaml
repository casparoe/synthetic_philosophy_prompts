answer: |-
  ## Workshop Pitch: Speech Acts in the Digital Institution-Verse  
  **Title:** "Layered Performatives: When One Utterance Does Five Things (and Austin Starts Sweating)"  
  **Duration:** 3 Days  
  **Target Audience:** Linguists, comms theorists, platform studies folks, legal/tech curious people.  

  ### The Big, Juicy Question
  **"Do the multi-layered, simultaneous performatives in automated digital institutional messages (like TOS updates or AI bans) fundamentally fracture Austin's felicity conditions, or can we just bolt on some extra scaffolding to make his framework fit?"**

  ### Why Austin & Searle Aren't Enough (The Problem)
  Classic speech act theory (Austin's *How to Do Things with Words*, Searle's extensions) is *brilliant* for analyzing single, deliberate human utterances: "I promise," "I pronounce you...". Misfires (things going wrong procedurally) and abuses (insincere acts) are treated as *isolated* failures in *one* act.  

  **But digital institutional comms are a whole different beast:**  
  1.  **Multi-Tasking Monsters:** One automated message isn't doing *one* thing. A single "We're updating your Terms of Service" email blast simultaneously:  
      *   **Notifies** (Info! Change is coming!)  
      *   **Binds** (Imposes new contractual obligations)  
      *   **Disclaims** (Limits platform liability, often buried)  
      *   **Directs** (Click here! Do nothing to accept!)  
      *   **Performs Brand Maintenance** (Look how transparent/innovative we are!)  
      *   ...and maybe more.  
  2.  **Author? What Author?:** Utterances come from "The System" or an AI, obscuring the human intentionality Austin assumed. Who's "sincere"?  
  3.  **Scale & Speed:** Misfires/Abuses aren't one-offs; they're baked into the template and deployed *millions* of times instantly. Can a condition even *be* met universally?  
  4.  **Procedural Opaqueness:** The "accepted procedure" (Austin's Cond. A.1 & A.2) is often hidden code or complex corporate policy, not a shared social ritual users truly understand.  

  **Bottom Line:** Austin's conditions feel like trying to check a single ingredient list when the utterance is a pre-made, multi-layer cake shot out of a cannon. Does the whole cake break the rules, or do we just need new rules for cakes?

  ### Method: Getting Our Hands Dirty (Realistically)
  1.  **Curate a Mini-Corpus:** Gather 5-6 real, concrete examples (e.g., a Spotify TOS update snippet, a Twitter/X AI moderation notice, a Steam refund policy auto-reply, a bank's automated fee notification). Focus on messages where layering is *obvious*.  
  2.  **Close Reading Smackdown:** For *each* example, as a group:  
      *   Identify *all* the distinct speech acts being attempted simultaneously.  
      *   Systematically **pressure-test against each of Austin's Felicity Conditions (A.1, A.2, B.1, B.2, Γ.1, Γ.2)**:  
          *   Where does it clearly *fit*?  
          *   Where does it get *ambiguous* or *strained*? (e.g., Is there a "complete" procedure users understand? Who exactly is "executing" it correctly? Can a bot have the "requisite thoughts/feelings" for sincerity?)  
          *   Where does it seem to **spectacularly fail** a condition *by design*?  
  3.  **Pattern Hunting:** Across the examples, look for recurring points of failure or systematic ambiguities related to the *layered* nature.  

  ### What Success Looks Like (After 3 Days)
  *   **Concrete Diagnosis:** A clear list of *which specific* felicity conditions are most consistently stressed, ambiguous, or broken by layered digital performatives, and *why* (e.g., "Condition Γ.1 (sincerity) is routinely irrelevant or impossible to assess with system-authored binding acts").  
  *   **Framework Fate:** A strong, evidence-based group leaning towards either:  
      *   "Yep, this multi-tasking breaks core assumptions, we need a different starting point," OR  
      *   "Okay, with significant tweaks (like defining 'system intentionality' or 'procedural completeness at scale'), Austin can be adapted. Here's what those tweaks might look like..."  
  *   **Shared Vocabulary:** A set of terms/concepts refined through the analysis useful for talking about this stuff (e.g., "performative density," "institutional utterance-threads," "procedural opacity").  
  *   **Spark Plugs Fired:** Participants leave with new questions and angles for their own work.  

  ### What Failure Looks Like
  *   Getting bogged down in purely theoretical debates about Austin/Searle without touching real examples enough.  
  *   Concluding vaguely that "it's complicated" without identifying specific pressure points.  
  *   Trying to cover *every* type of digital speech act instead of laser-focusing on the *layered institutional* ones.  

  ### Realistic Scope Check (It's Only 3 Days!)
  *   **Narrow Focus:** ONLY institutional *automated* messages performing *multiple* binding/effectual acts. (Not tweets, not chat bots doing one thing, not simple notifications).  
  *   **Depth over Breadth:** 5-6 examples analyzed *really well* is better than skimming 20. Quality close-reading takes time.  
  *   **Tweaks, Not Overhaul:** We likely won't build a whole new *grand theory*. Goal is to diagnose the problem for Austin/Searle and suggest the *direction* adaptation needs to go (or justify why it can't).  
  *   **Collaborative, Not Definitive:** Output is a robust *starting framework/analysis* and set of questions, not the final word.  

  **Let's crack open some Terms of Service and see if we can make Austin's head explode (productively). This is the messy reality of language doing heavy lifting online – time our theories caught up!**  

  *(Refs to add: Austin, Searle, maybe some modern platform governance/comms stuff, specific examples)*
