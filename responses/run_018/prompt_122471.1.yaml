  ### Grounding and Fundamentality Decision Tree  
  *Answer each question based on your intuitive judgments about the cases. Do not infer the views they lead to.*  

  1. **Disjunction Case**: Consider a true disjunction (e.g., "The cup is blue or the cup is red") grounded in its true disjunct (e.g., "The cup is blue"). What is the *primary* basis for this grounding claim?  
     - A. A **relation** between facts (e.g., the fact that the cup is blue grounds the fact that the disjunction is true).  
     - B. A **logical operation** (e.g., the truth of the disjunct *explains* the truth of the disjunction via sentential structure, not a relation).  
     - C. A **pragmatic convention** (e.g., this is just how we talk about explanations, with no metaphysical implications).  

  2. **Multiple Realizability Case**: A mental fact (e.g., "Agent is in pain") has multiple sufficient neural grounds (e.g., different brain states in different contexts). Could this fact be:  
     - A. **Fully grounded by any single neural state** when it occurs (no overdetermination).  
     - B. **Symmetrically overdetermined** (e.g., two independent neural states could fully ground it at once).  
     - C. **Ungrounded in some instances** (e.g., pain might lack a neural ground in edge cases).  

  3. **Singleton Case**: The singleton set {Socrates} is grounded in Socrates. What is the *most plausible* account of this dependency?  
     - A. **Object-based**: Socrates (an object) is fundamental; the set is derivative.  
     - B. **Fact-based**: The fact that Socrates exists is fundamental; the fact that {Socrates} exists is derivative.  
     - C. **Vocabulary-based**: Set-talk is non-fundamental; Socrates can be described without set-theoretic vocabulary.  

  4. **Laws of Nature Case**: Are the laws of nature grounded in the total distribution of particular matters of fact (e.g., particle positions)?  
     - A. **Yes**, and this grounding ensures the fundamental facts **determine everything else** (completeness is required).  
     - B. **Yes**, but the fundamental facts **might not determine everything** (completeness is optional).  
     - C. **No**, the laws are fundamental or co-fundamental with the distribution.  

  5. **Particles/Table Case**: A table is grounded in particles arranged tablewise. Could this chain continue "downward" indefinitely (e.g., particles grounded in sub-particles, ad infinitum)?  
     - A. **No**, chains must **terminate** at something ungrounded.  
     - B. **Yes**, **infinite descent** is metaphysically possible.  
     - C. **Yes**, but only if the descent is **ever-widening** (e.g., particles grounded in a quantum field, which is grounded in spacetime, etc.).  

  6. **Relativity of Fundamentality**: Is a physical fact (e.g., "This neuron fired") fundamental?  
     - A. **Absolutely**—if fundamental, it is fundamental *simpliciter*.  
     - B. **Relatively**—it might be fundamental for physics but derivative for microphysics or vice versa.  

  7. **Cosmos Case**: Regarding the entire cosmos and its proper parts (e.g., planets, particles):  
     - A. The **parts are fundamental**, the whole is derivative.  
     - B. The **whole is fundamental**, the parts are derivative.  
     - C. **Neither**—both are derivative, or grounding does not apply here.  

