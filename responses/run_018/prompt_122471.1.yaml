  # Grounding and Fundamentality Decision Tree

  Answer the following questions based on your intuitive judgments about the cases. Do not try to guess the views they lead to.

  1. **The disjunction case**: Consider the true disjunction "Either it is raining or it is snowing" when it is raining. We say the disjunction is grounded in the true disjunct. How should we understand this grounding claim?  
     A. As expressing a relation between two facts.  
     B. As expressing a sentential operator.  
     C. As a non-relational, non-operational claim that is merely expressive without metaphysical commitment.  

  2. (If A or B at 1) **Unity of grounding**: Is the grounding relation/operator the same in all non-causal explanatory contexts? For example, is the grounding of the table in the particles the same as the grounding of a normative fact in a natural fact?  
     A. Yes, grounding is unified across contexts.  
     B. No, there are multiple grounding relations/operators for different domains.  

  3. **The singleton case**: Consider the singleton set {Socrates}. We say that the singleton is grounded in Socrates. But what is it that is being said to be fundamental or derivative?  
     A. The object: Socrates is fundamental, the singleton is derivative.  
     B. The fact: the fact that Socrates exists is fundamental, the fact that {Socrates} exists is derivative.  
     C. The vocabulary: we can describe the world without set-theoretic vocabulary, so set-vocabulary is non-fundamental.  

  4. **Termination of chains**: Can grounding chains go on infinitely without ever reaching an ungrounded fact? For example, could Socrates be grounded in some other entity, and that entity in another, ad infinitum?  
     A. No, chains must terminate in something ungrounded.  
     B. Yes, infinite descent is possible.  

  5. (If B at 4) **Type of infinite descent**: What is the nature of the infinite descent?  
     A. Linear: ever more basic facts or objects, but no bottom level.  
     B. Ever-widening: for any candidate fundamental base, there is a wider base that grounds it.  

  6. **Completeness**: Consider the laws of nature and the total distribution of particular matters of fact. Must the fundamental truths completely determine all truths, including the laws?  
     A. Yes, the fundamental base must be complete.  
     B. No, the fundamental base might not determine everything.  

  7. **Relativity**: Is fundamentality absolute, or can something be fundamental relative to one domain and derivative relative to another?  
     A. Absolute: fundamental simpliciter.  
     B. Relative: to a domain or explanatory context.  

  8. **Grounding holes**: Consider a mental fact (e.g., that a person is in pain) that can be grounded in multiple different neural states. Could it be that in some cases the mental fact has no full ground (or has multiple independent full grounds)?  
     A. No, every derivative fact must have at least one full ground, and grounding is not symmetrically overdetermined.  
     B. Yes, grounding holes or symmetric overdetermination are possible.  

  9. **The cosmos case**: Regarding the entire cosmos and its proper parts, what is the grounding relationship?  
     A. The parts are fundamental, the whole is derivative.  
     B. The whole is fundamental, the parts are derivative.  
     C. Neither: both are derivative of something else, or both are fundamental, or grounding doesn't apply in this way.  

