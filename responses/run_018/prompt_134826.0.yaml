  Bottom line: Your prof's surgeon case is **not knowledge** by her pattern—high stakes override casual context, so she'd likely deny "know" here.  

  **Her rule:** Knowledge requires evidence sufficient for *current practical stakes*, and "know" claims get reinterpreted under pressure. She’s hybrid—leaning **pragmatic encroachment** (stakes raise evidence needed) but **contextualism** (conversational context shifts "know" standards) handles the philosophy-class weirdness.  

  **Rival rule:** Pure contextualism would say the OR’s *casual convo* keeps standards low, so "I know" is fine. Pure pragmatic encroachment would ignore banter and focus solely on life-or-death stakes to deny knowledge.  

  **Hypothetical that splits them:**  
  - *Low stakes + artificially high standards:* You’re debating a skeptic *while* buying coffee. Stakes are trivial (coffee run), but convo is hyper-skeptical.  
    - **Her hybrid:** Likely says you *know* (low stakes win).  
    - **Pure contextualist:** Says you *don’t know* (skeptical convo sets high standards).  

  **Recommendation for consistency:** She should deny the surgeon’s "know" claim—her mortgage/court cases show stakes trump casualness. Closest analog is **court deposition testimony:** same testimony isn’t knowledge under oath, even if it was at the bus stop. The OR’s stakes force higher evidence than a glance, regardless of chit-chat.  

  *Side note: Her view’s messy because she uses contextualism for "academic" cases (seminar hands) but pragmatic encroachment for real-world stress (mortgage). Tell your roommate she needs to pick a struggle.*
