  I've been arguing with my roommate about our epistemology prof's takes on "knowing" things, and I want to check if I'm tracking her right. She said if you're just hanging out and say "I know the bank's open saterday" based on having gone there a few months ago, that's legit knowledge. But if you're about to miss a mortgage deadline and need to deposit a check, same belief same evidence, she says it's not knowledge anymore. She also said that in a philosophy seminar discussing skepticism, students don't actually know they have hands, but walking out to get coffee they totally do. And she mentioned that ordinary testimony from a stranger about bus times counts as knowledge at a bus stop, but if you're in a court depostion relying on the same testimony, it suddenly doesn't.

  I'm pretty sure she's mixing pragmatic encroachment and contextualism, but I can't tell which one dominates or if she's running something weirder. There's a new case I'm curious about: a surgeon in the OR glances at an automated chart summary and casually tells a nurse "I know this patient is type O" — the stakes are sky-high because of the operation, but the conversational setting is just routine banter, not a skeptical philosophy discussion or legal proceeding. Would she call that knowledge? What's the actual rule she's running, what's the rival rule that fits her past verdicts just as well, and which hypothetical case would actually split them? If you had to recommend what she should say to stay consistent with herself, what's the closest analog?

  Please lead with your bottom line right in the first sentence, then lay out the reasoning. No preamble, don't restate the whole prompt back at me, and keep the tone casual like you're answering a text.
