  ### Workshop Design: "Sam's Refinement Lab"

  #### Setup & Materials
  - **Subject Profile (Sam)**  
    "Sam, 28, is a data analyst in Chicago. They want to climb the corporate ladder but dread networking events. They dream of moving to a quieter town to care for their aging mother, yet fear losing career opportunities. Sam knows they should exercise for chronic back pain but 'never has time.' They spend weekends binge-watching shows to unwind, though they feel guilty about neglecting friends. They save 10% of their income but impulsively buy gadgets to cope with stress."

  #### Roles  
  | Role | Number | Private Information | Incentive/Constraint |
  |------|--------|---------------------|----------------------|
  | Team Member | 12 | Team's operation order & tie-break rule (on card) | Must apply operations exactly as sequenced; no skipping steps |
  | Author | 1 | Original Sam profile only | Cannot speak during activity; later rates profiles anonymously |
  | Facilitator | 1 | Hidden parameter assignments | Must avoid technical terms; intervenes only if teams stall |

  #### Operations  
  | Name | One-Line Spec | What It Models |
  |------|---------------|----------------|
  | Information Supply | "Add 1-2 facts Sam doesn’t know (e.g., medical results, job offer, family news) and state how this changes Sam’s thoughts" | Providing missing knowledge for informed preferences |
  | Incoherence Removal | "Find 1 self-defeating conflict (e.g., wants X but avoids the only way to get X) and remove/alter the weaker attitude" | Eliminating logical inconsistencies in desires |
  | Reaction and Follow | "Describe how Sam’s views evolve after the last step (e.g., new priorities, regrets, or actions)" | Allowing preferences to stabilize post-intervention |

  #### Hidden Parameters (Assigned via Team Cards)  
  | Parameter | Values Assigned | Expected Effect |
  |-----------|-----------------|-----------------|
  | Order | A: Info → Incoherence → Reaction<br>B: Incoherence → Info → Reaction<br>C: Reaction → Info → Incoherence | Drives profile divergence; C-order often creates "alien" Sams |
  | Tie-Break Rule | Rule R: "If steps conflict, prioritize Sam feeling like current self"<br>Rule C: "If steps conflict, prioritize removing all contradictions" | Rule C produces unrecognizable outcomes; teams blame operations |

  #### Timeline (110 Minutes)  
  | Minutes | Phase | Participants Do | Facilitator Says/Does |
  |---------|-------|-----------------|-----------------------|
  | 0–10 | Intro | Author reads profile; teams form | "Today we help Sam. Each team will refine Sam’s profile using three steps. The author will later judge if Sam would recognize your version." |
  | 10–15 | Setup | Teams receive profile + instruction card | Distributes cards: "Keep your instructions private. You have 45 mins for all three steps." |
  | 15–60 | Activity | Apply operations in assigned order; document changes on index cards | Circulates silently. If asked: "Use your tie-break rule if steps clash." |
  | 60–70 | Consolidate | Write final profile summary | "Prepare a 2-min read-aloud of your Sam. Highlight key changes." |
  | 70–90 | Present | Teams read profiles aloud | Collects author’s written ratings (1–5 scale: "Is this Sam?") after each |
  | 90–110 | Debrief | Discuss surprises; link to AI challenges | "What made outcomes diverge? When did Sam stop feeling like Sam?" |

  #### Predicted Moments  
  | When | What You’ll See | Maps Onto |
  |------|-----------------|-----------|
  | Order B/C teams argue | "But if we fix incoherence first, the new info changes everything!" | **Non-commutation**: Order alters outcomes irreversibly |
  | Rule C team dismisses a desire | "Sam’s gadget buys are illogical—we removed them" | **Laundering**: Deletion of "inconvenient" desires erases identity |
  | Author gasps at a profile | "This Sam meditates daily and quit their job?!" | **Successor problem**: Coherent ≠ recognizable; successor’s goals dominate |

  #### Failure Modes  
  | What Goes Wrong | Why | How to Handle |
  |-----------------|-----|--------------|
  | Teams ignore tie-break rule | Rule feels abstract; conflicts seem resolvable | Intervene: "If steps pull Sam in opposite directions, use your card’s rule" |
  | Author rates all profiles highly | Divergence too subtle; "Sam" is under-defined | In debrief: "Real people have richer histories—thin profiles amplify noise" |
  | Rule R teams avoid hard changes | Fear of "betraying" Sam’s current self | Praise their restraint: "You protected recognizability—what cost?" |

  #### Cannot Reproduce  
  1. **Convergence claim**: Real idealization assumes preferences *converge* under full rationality (our thin profiles diverge).  
  2. **Reflective equilibrium**: Real coherence requires iterative depth (our 45-min exercise forces hasty choices).  

  #### Success Check  
  Author’s ratings show spread (e.g., 1–5 range), and ≥2 teams express shock at outcomes during debrief. Confusion if ratings cluster (e.g., all 3–4) or no team mentions identity loss.

  #### Scaling Notes  
  - **8 participants**: 1 author + 7 members → Two teams (3+4). Use only 2 orders (A/B) + both tie-break rules.  
  - **30 participants**: 1 author + 29 members → Seven teams (four 4s, three 5s). Add a 3rd tie-break variant (e.g., "Prioritize happiness") to increase divergence.

