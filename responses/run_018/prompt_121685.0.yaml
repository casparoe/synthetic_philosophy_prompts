    - One subject profile for all teams.
    - One author (a participant) who is the representative of the subject. They read the original profile and then rate the outcomes without participating in the teams.

  - **Ending**: Each team presents their modified profile. The author rates each one (on a scale or yes/no) on whether they recognize it as the subject's. The ratings are done in writing without discussion.

  ### Activity Title
  "Refining Sam: An Exploration of Preference Transformation"

  ### Materials
  - 1 copy of the subject profile (Sam) for each team (and one for the author)
  - Index cards for teams to write down their changes at each step
  - Markers for the whiteboard
  - Instruction cards for each team: one card with the operations, the assigned order, and the tie-break rule (kept secret from other teams).
  - Rating sheets for the author (one per team's outcome)

  ### Roles
  1. **Team Members**: 12-28 participants (depending on group size) in teams of 3-5. They receive the subject profile and their team's instruction card (with order and tie-break rule). They work together to apply the operations.
  2. **Author**: 1 participant. They receive the subject profile at the start and are told to imagine they are Sam (or that they wrote the profile). They do not participate in the team activity. At the end, they listen to each team's modified profile and rate it for recognition.

  ### Operations (defined without technical terms)
  1. **Information Supply**: "Add one or two important facts that Sam doesn't currently know about their situation. Write down the new facts and how they affect Sam's attitudes (wants, fears, etc.)."
     - What it models: Providing the subject with missing information that could change their preferences.
  2. **Incoherence Removal**: "Find one conflict in Sam's attitudes (e.g., wanting two things that can't both happen, or avoiding something that would help get what they want). Remove or change one attitude to resolve the conflict. Write down what you changed and why."
     - What it models: Removing internal inconsistencies in the subject's preferences.
  3. **Reaction and Follow**: "Let Sam react to the changes so far. How might Sam's attitudes shift in response? Write down at least one new or changed attitude that results from Sam's reaction to the new situation."
     - What it models: The subject's adjustment to the new information and coherence, leading to new preference formations.

  ### Hidden Parameters (on team instruction cards)
  - **Order**: One of three orders (we choose three that are likely to cause divergence):
    - Order 1: Information, Incoherence, Reaction
    - Order 2: Incoherence, Information, Reaction
    - Order 3: Reaction, Information, Incoherence
    (Note: We avoid orders that put Reaction in the middle because the original description had it last. But to test non-commutation, we include one that starts with Reaction to see what happens.)

  - **Tie-Break Rule**:
    - Rule A: "If changes from different operations conflict, choose the change that keeps Sam more recognizable to how they are now."
    - Rule B: "If changes from different operations conflict, choose the change that makes Sam's attitudes most consistent, even if that makes Sam very different."

  ### Timeline (110 minutes total)
  - **0-10 min**: Introduction and setup
    - Facilitator says: "Welcome! Today we're going to explore how we might refine someone's preferences given more information and more coherence. We have a subject, Sam, whose profile you'll see. One of you is Sam's representative (the author) and will rate the outcomes. The rest of you will work in teams to apply three operations to Sam's profile. Each team will get the same starting profile but will follow different instructions. Remember: we're not lecturing; we're doing. Let's get started."
    - Participants do: The author is identified and given the profile. The rest split into teams (3-5 per team). Each team gets: a copy of Sam's profile, an instruction card (with order and tie-break rule), index cards, and pens.

  - **10-15 min**: Read and absorb the profile
    - Facilitator says: "Please take 5 minutes to read Sam's profile and discuss it in your team. Make sure everyone understands Sam's situation and attitudes."
    - Participants do: Teams read the profile and discuss.

  - **15-60 min**: Apply the operations (45 minutes)
    - Facilitator says: "Now, each team will apply three operations to Sam's profile, in the order specified on your card. Use the index cards to write down each step: what you changed and why. You have 45 minutes. Go!"
    - Participants do: Teams apply the three operations in their assigned order, writing down each step and the outcome. They use the tie-break rule if conflicts arise. The facilitator circulates to answer questions (without giving content hints).

  - **60-80 min**: Team write-up and prepare to present (20 minutes)
    - Facilitator says: "Now, prepare a summary of your final version of Sam. Write it clearly so you can read it aloud. Also, note the key changes you made at each step."
    - Participants do: Teams prepare a 2-minute presentation of their final Sam profile.

  - **80-100 min**: Presentations and ratings (20 minutes)
    - Facilitator says: "Each team will now read their final Sam profile. After each presentation, the author will rate how recognizable this Sam is to the original Sam on a scale of 1-5 (1: not recognizable, 5: very recognizable) without any discussion. We'll collect the ratings."
    - Participants do: Teams present. The author writes down a rating for each.

  - **100-110 min**: Debrief (10 minutes)
    - Facilitator says: "Let's discuss what happened. What did you notice about the process and the outcomes?" (Then guides the discussion to the three key difficulties without naming them first.)

  ### Predicted Moments for Debrief (to guide the facilitator)
  1. **Non-commutation**: Teams will report different outcomes even though they started with the same profile. The facilitator can ask: "Did the order in which you applied the steps matter? How?" Then reveal that orders were varied and that this shows the operations don't necessarily commute.
  2. **Laundering**: A team (especially with Rule B and an order that starts with Incoherence Removal) might have removed a core desire without much justification. The facilitator can ask: "Did any team feel they were removing a desire because it was 'illogical'? What happened to Sam's identity?" Then discuss how this can delete the person.
  3. **The Successor Problem**: A team (with Rule B and an order that ends with Reaction) might have created a very different Sam. The author might rate it low. The facilitator can ask: "Did any team end up with a Sam that the real Sam wouldn't recognize? Why? What does that say about the goal of creating a 'better' version of the person?"

  ### Failure Modes
  1. **Teams get stuck on the operations**: They might not understand how to apply them. 
     - Why: The operations are abstract. 
     - Handling: The facilitator should provide simple examples during the introduction (using a different fake profile) and be available to clarify during the activity.

  2. **Teams don't encounter conflicts**: They might not see any incoherence or might avoid conflicts. 
     - Why: The profile might be too simple or the team might be too agreeable. 
     - Handling: Design the profile to have clear tensions (e.g., fear of risk vs. desire for change). In the debrief, the facilitator can highlight where conflicts were expected.

  3. **The author rates all profiles highly**: If the profiles don't diverge enough, the author might not see a difference. 
     - Why: Teams might have applied the operations conservatively. 
     - Handling: The facilitator can note that in real life, the transformations might be more extreme, but the activity still shows the process.

  4. **The tie-break rule is not used**: Teams might not encounter a conflict. 
     - Why: They might have interpreted the operations in a way that avoided conflict. 
     - Handling: In the debrief, ask teams if they had to make hard choices and reveal the tie-break rules to show how they would have mattered.

  ### What the Activity Cannot Reproduce
  - **Convergence of Extrapolated Preferences**: In the idealization debate, it's often argued that under full information and coherence, people's preferences would converge. Our activity uses a thin profile and invented subject, so we don't have the depth for convergence. Also, our teams are working independently and don't converge.
  - **The Role of Time and Reflection**: Real preference extrapolation involves deep reflection over time, which we compress into a quick exercise.
  - **The AI Context**: The activity doesn't involve an AI system; it's a human simulation. The difficulties of algorithmic implementation are absent.

  ### Success Check
  - The observable criterion: The author's ratings show variation (ideally, some low ratings) and teams express surprise at the divergence. In the debrief, participants articulate the three difficulties without the facilitator naming them first.

  ### Scaling Notes
  - **8 participants**: 1 author, 7 for teams -> two teams: one of 3 and one of 4.
  - **30 participants**: 1 author, 29 for teams -> 7 teams of 4 (28) and one team of 5? Or 5 teams of 5 and two teams of 4? (total 5*5 + 2*4 = 25+8=33 -> too big). So 7 teams of 4 (28) and one extra person? We can assign the extra as a helper to the author or have one team of 5. The activity can handle uneven teams.

  ### Subject Profile Example
  **Sam's Profile**:
  "Sam is 28 years old, working as a data analyst in a large city. They have student loans and feel stuck in their job because they need the income. They want to move closer to their aging parents in a small town but fear there are no good job opportunities there. They also dream of starting a small online business but haven't taken steps because they don't have time and are afraid of financial risk. Sam knows exercise is important for health but often feels too tired after work and spends evenings scrolling social media, which they find relaxing but also feels guilty about. They want to save money for the future but also enjoy eating out with friends regularly."

