  b) More importantly, the set theory in question (ZFC) is a formal system that does not require every set to be computable. There are models of set theory (like Gödel's constructible universe) where every set is definable, but in general, the sets we consider in ZFC are not required to be computable.

  However, the main flaw is that step (4) conflates the existence of an explicit definition in set theory with computability. The fact that we cannot write an explicit rule in the language of set theory does not mean that there is no algorithm. For example, there might be an algorithm that uses oracles or is defined in a larger system.

  But even more fundamentally, the uncomputability of a function is relative to a specific model of computation and a specific encoding of the sets. Without fixing these, we cannot say that a function is uncomputable.

  Step (5) then concludes that AC asserts the existence of functions that are necessarily uncomputable. This is true in the sense that AC implies the existence of non-computable functions (for example, a choice function for the family of non-empty subsets of the natural numbers would be non-computable because it would solve the halting problem). However, the step (4) reasoning is flawed because it makes a general claim that any family without an explicit rule must yield an uncomputable function. That is not necessarily true: there might be families that are computable even if we cannot write an explicit rule in the language of set theory (for example, if the sets are themselves computable and the indexing is computable, then a computable choice function might exist).

