prompt: |-
  There's a result in decision theory I keep bumping into: for an idealized Bayesian agent, free information can never have negative expected value before you look at it (worst case, it doesn't change your decision), so turning down free info is always a mistake. But my gut verdicts on actual cases don't line up with that at all:

  - A friend declines a free, reliable test for an untreatable late-onset disease because she'd rather not spend thirty years dreading it: seems fine to me.
  - I don't check my investment portfolio daily, partly because I'd make panicky trades if I did: seems fine, maybe even smart.
  - A judge refuses to look at a defendant's prior record before setting bail because it would bias her: seems right.
  - My roommate won't open his credit card statements because it's stressful: not fine, he's being an idiot.
  - A scientist running a trial refuses to peek at the data early: seems right, something about stopping rules.
  - A hiring comittee member asks not to be told candidates' names to avoid bias: fine.
  - My sister says she doesn't want to know whether her husband cheated years ago: honestly torn on this one.

  Is there a principle that separates the fine cases from the not-fine ones, and can it be stated in a way that's compatible with the theorem -- e.g., the good cases of ignorance are exactly ones where the agent isn't the idealized info-processor the theorem assumes (bounded, biased, prone to making worse decisions *because* of how they'd react)? Note the portfolio and credit card cases look structurally similar to me, so a good principle should explain why they differ, or else convince me to flip one of them. And say what your principle predicts for my sister.
reasoning: |-
  Okay, the user is grappling with a decision theory paradox. They've encountered this theorem that says free information should never have negative expected value for an idealized Bayesian agent, but their real-world intuitions disagree in specific cases. They listed seven scenarios where refusing information seems reasonable or unreasonable, and want a unifying principle that reconciles this with the theorem.

  Hmm, the key insight here is that the theorem assumes an idealized agent - perfectly rational, unlimited computational power, no emotional costs. But humans aren't like that. The cases where refusing info seems "fine" all involve human limitations: emotional toll (untreatable disease test), self-control issues (portfolio checking), cognitive biases (judge avoiding prior records), or algorithmic requirements (scientist not peeking at data).

  The credit card case stands out as "not fine" because it's pure information avoidance without offsetting benefits. The sister's case about infidelity is tricky because it depends on how she'd process the information - if knowing would destroy her ability to have a healthy relationship regardless of the truth, refusal might be rational.

  For the portfolio vs credit card distinction: both involve avoidance due to anticipated bad reactions, but portfolio checking triggers irrational panic trades (self-control failure), while not opening credit statements enables ongoing debt accumulation (pure denial). That's why one seems smart and the other stupid.

  The unifying framework should have three parts: 1) Acknowledge the theorem applies only to ideal agents 2) Identify which human limitations make information refusal rational 3) Provide criteria for when refusal is justified (emotional costs > decision benefits, irreversible processing effects, etc.)

  For the sister case, the principle would say: refusal is rational only if knowing would catastrophically harm her wellbeing regardless of the truth value, and she's certain she couldn't integrate the knowledge healthily. Otherwise she should want the information.
answer: |-
  You've hit on a deep tension between idealized rationality (the Bayesian theorem) and practical human cognition. Your intuition is correct: **the fine cases of refusing information occur when the human agent is *not* the idealized Bayesian processor assumed by the theorem, and the costs of *processing* or *reacting* to the information outweigh its potential decision-making benefits.** The theorem assumes an agent who:

  1.  **Always updates beliefs perfectly** (Bayesian updating).
  2.  **Always makes optimal decisions** based on updated beliefs.
  3.  **Has no intrinsic costs** associated with holding beliefs or processing information (no anxiety, no temptation, no cognitive load).
  4.  **Has unlimited willpower** to act on the optimal decision.
  5.  **Operates in a context-free vacuum** (no bias concerns, no sequential decision rules).

  Reality violates all these assumptions. Your "fine" cases involve violations that make information harmful *in practice*, even if beneficial *in theory*.

  **The Principle: Refusing Information is Rational When...**

  **...the expected *processing costs* (emotional, cognitive, or behavioral) exceed the expected *decision improvement value* of the information, *or* when acquiring the information inherently corrupts the decision process.**

  **Breaking Down the Principle:**

  1.  **Processing Costs > Decision Value:**
      *   **Emotional Cost:** The distress of knowing unpleasant information outweighs any potential benefit from acting on it *or* the agent knows they cannot mitigate the distress sufficiently.
      *   **Cognitive Cost/Bias:** The information is highly likely to trigger a *systematic error* in judgment (bias) that the agent cannot correct, leading to a worse decision than without it.
      *   **Behavioral Cost/Temptation:** The agent knows they lack the willpower to act optimally upon receiving the information. The information creates a strong temptation for a suboptimal action they cannot resist.
      *   **Decision Value is Low:** If the information is unlikely to change the optimal action (or there is no action to take), its intrinsic value is low, making even small processing costs a net negative.

  2.  **Information Acquisition Corrupts the Process:**
      *   **Procedural Integrity:** In contexts requiring strict rules (like scientific trials or certain judicial/assessment procedures), *when* or *how* information is acquired can violate the protocol itself, invalidating the entire process or introducing unavoidable bias. The information isn't bad, but *acquiring it now* breaks the system.

  **Applying the Principle to Your Cases:**

  *   **Untreatable Disease Test (Fine):** **Processing Costs (Emotional) >> Decision Value.** Knowing the result offers *no* actionable benefit (untreatable) but incurs massive, unavoidable emotional cost (decades of dread). The decision (live life) likely doesn't change. *Principle Applied: High emotional cost dominates zero/low decision value.*
  *   **Not Checking Portfolio Daily (Fine):** **Processing Costs (Behavioral) > Decision Value.** Daily noise creates strong temptation for panic trades (behavioral cost). Long-term strategy is optimal; frequent information doesn't improve decisions but *increases risk* of harmful action. *Principle Applied: Behavioral cost (acting badly due to temptation) outweighs low/no improvement in long-term investment decisions.*
  *   **Judge Avoiding Prior Record (Fine):** **Processing Costs (Cognitive Bias) > Decision Value.** Prior record is highly biasing information the judge cannot reliably "unsee" or correct for when setting bail, likely leading to a *worse* (less fair) decision than focusing solely on the current case facts. *Principle Applied: High risk of biased decision outweighs potential (but unreliable) marginal improvement in bail risk assessment.*
  *   **Not Opening Credit Card Statements (Not Fine):** **Decision Value >> Processing Costs (Emotional).** Ignoring debt doesn't make it disappear; it actively prevents necessary action (paying it down, budgeting). Emotional cost (stress) exists, but the cost of *inaction* is severe and growing. Information is crucial for essential financial decisions. *Principle Applied: High decision value (avoiding financial ruin) massively outweighs the emotional cost. Refusal is denial, not rational avoidance.*
  *   **Scientist Not Peeking (Fine):** **Information Acquisition Corrupts the Process.** Peeking fundamentally violates the statistical stopping rules and introduces bias (e.g., stopping early for a positive trend). The *act* of looking early breaks the validity of the trial, regardless of the specific data seen. *Principle Applied: Acquiring the information now inherently corrupts the scientific integrity of the entire process.*
  *   **Hiring Committee Anonymity (Fine):** **Processing Costs (Cognitive Bias) > Decision Value.** Names carry strong potential for unconscious bias (gender, ethnicity, alma mater) that committee members cannot reliably counteract. Anonymity forces focus on relevant qualifications, leading to better decisions. *Principle Applied: High risk of bias outweighs any minor potential value in knowing names for assessing qualifications.*
  *   **Sister & Potential Infidelity (Torn - Principle Analysis):** This depends *crucially* on her values and psychology.
      *   **If she values "peace of mind" above truth *and* believes knowing (true or false) would permanently damage her happiness/trust:** Processing Costs (Emotional) might dominate. If there's truly *no action* she would take (e.g., divorce over ancient history is off the table regardless), Decision Value is very low. Refusal *could* be rational under the principle.
      *   **If knowing would allow her to address underlying issues, rebuild trust, or make informed choices about the relationship:** Decision Value is high. The emotional cost, while real, might be outweighed by the value of clarity and agency. Refusal would be less rational.
      *   **Key Question:** Can she integrate the knowledge without catastrophic, irreversible harm to her wellbeing *and* is there potential value in knowing for her life decisions? If "No" to both, refusal aligns with the principle. If "Yes" to either, it leans towards being irrational. *Principle Applied: Highly individual. Depends on weighting unavoidable emotional cost vs. the value of truth for agency/relationship health.*

  **Why Portfolio vs. Credit Card Differ (Structural Similarity Explained):**

  *   **Portfolio:** The *action* (panic trading) triggered by the information *is the primary harm*. Long-term strategy is known to be optimal; the information (daily noise) is irrelevant *or harmful* to good decision-making. The behavioral cost dominates.
  *   **Credit Card:** The *inaction* caused by *not having* the information *is the primary harm*. The information is *essential* for necessary, time-sensitive actions (controlling spending, paying debt). The decision value dominates.

  The portfolio info tempts a bad *action*. The credit card info *enables* a necessary good *action* that is otherwise impossible. The cost structures are opposites: one is cost-of-acting-badly, the other is cost-of-*not*-acting.

  **Conclusion:**

  The Bayesian theorem holds for an idealized, perfectly rational, emotionless, bias-free, willpower-unlimited agent. Humans are not that. Refusing free information is rational *for humans* when:

  1.  **The unavoidable costs of *having* the information (emotional distress, induced bias, irresistible temptation) exceed its value for improving actions.**
  2.  **Acquiring the information *when* or *how* it's offered inherently corrupts a necessary process (scientific, procedural).**

  Your "fine" cases fit these criteria. Your "not fine" case (credit card) does not because the information is critical for essential action and the cost of ignorance is catastrophic. Your sister's case is borderline and hinges on the specific balance of emotional cost and decision/agency value for her. The principle explains the divergence from the idealized theorem by focusing on the *practical costs and limitations* of human cognition and willpower.
