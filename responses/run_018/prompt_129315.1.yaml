  First, I need to recall relevant concepts in historiography and science studies. Terms like historical materialism or environmental determinism come to mind, but they don't quite fit. The user emphasizes that it's not determinism because human agency is still central. The non-human force acts diagnostically, revealing weaknesses without intentionality. 

  I remember that Bruno Latour's Actor-Network Theory (ANT) grants agency to non-humans, but ANT's agency is more about participation in networks, not specifically diagnostic. The examples here focus on revealing hidden flaws, which is different. Functional explanations in biology, like Gould and Lewontin's spandrels, might be related but are critiques, not narrative tools. 

  Maybe "revelatory agency" or "diagnostic causality"? The user's description points to forces testing systems. The term "stress-test" from engineering comes up in their examples. Adapting that to history could work. "Stress-test historiography" captures the idea of non-human forces exposing vulnerabilities. It also avoids implying intention, which is key. 

  I should check if this term exists. Scanning through historiography of science and environmental history, I can't recall a specific term. Jason Moore's world-ecology framework incorporates nature-society relations but doesn't focus on the diagnostic function. So coining a term seems necessary. 

  The user also wants to differentiate this from adjacent concepts. Stress-test historiography differs from multicausal explanations by granting non-humans a functional role. Unlike environmental determinism, it doesn't dictate outcomes but highlights adaptive capacities. Compared to Gould's spandrels, it's a narrative device, not a critique of adaptationism. 

  Normative commitments are a concern. This approach might imply that adaptability is a moral duty. The historian evaluates societies based on their response to these "tests," which could carry a neoliberal undertone. The user should address this in their chapter. 

  Boundary conditions are essential. If an author uses such language but explicitly denies agency, that might just be metaphorical. Or if the non-human factor's effect is purely correlative, not diagnostic. The term's vulnerability lies in the definition of agency, which some historians might reject entirely. 

  In conclusion, "stress-test historiography" seems fitting. It precisely captures the diagnostic function without animism. The user should define it clearly and discuss its normative implications to avoid unintended biases.
answer: |-
  Based on your precise description and examples, this is indeed a recognizable and conceptually distinct posture in contemporary historiography, particularly at the intersection of environmental history, history of science, and disaster studies. While elements resonate with established concepts, **no single, widely accepted term exists that captures this *specific* hybrid of non-intentional functional/diagnostic agency combined with the evaluation of human interpretive responses.** You are observing a distinct analytical move that likely requires coinage.

  **Conceptual Landscape & Assessment:**

  1.  **Adjacent Concepts & Why They Don't Fit Perfectly:**
      *   **Environmental Determinism:** Explicitly rejected by your examples. Outcomes are not inevitable; human agency and institutional variation are central. The non-human force isn't *determining* the outcome, it's *probing* the system.
      *   **Structural Opportunity/Constraint:** Focuses on pre-existing conditions enabling or limiting action. While crucial in your examples (fragility, contradictions), this concept doesn't capture the *active, diagnostic role* assigned to the non-human force ("exposing," "revealing," "testing"). The non-human force is the *agent of revelation*, not just the condition revealed.
      *   **Functional Explanation (Biology/Sociology):** Explains traits/institutions by their consequences (e.g., "feudalism *functioned* to maintain order"). Your examples involve non-human forces *disrupting* function or *testing* it, not explaining the existence of the institution itself by its function. The "function" here is diagnostic (testing/revealing fragility), not adaptive (explaining persistence).
      *   **Latourian Actor-Network Theory (ANT):** Grants agency broadly to non-humans ("actants"). ANT is ontologically compatible but analytically different. ANT emphasizes symmetrical agency within networks and the co-production of actors/effects. Your examples focus on the *specific functional role* (testing/revealing) the non-human force plays *in relation to* pre-existing human structures and the *evaluation of human interpretation*. ANT doesn't inherently emphasize the "diagnostic" function or the "reading the signals" aspect.
      *   **Complex Systems Theory/Resilience Thinking:** Concepts like perturbation, stressor, tipping point are relevant. However, these frameworks often remain descriptive of system behavior. Your examples involve a stronger *narrative attribution of agency* to the force itself ("the plague dissolved obligations," "volcanic winter exposed fragility") coupled with an *evaluative judgment* of human responses, moving beyond neutral system description.
      *   **Gould-Lewontin Spandrels Critique:** This critiques *post-hoc* adaptive storytelling in evolution. Your examples involve historians *using* a functional/diagnostic narrative device intentionally. While a valid critical lens (see Normative Commitments below), it doesn't describe the historiographical posture itself.

  2.  **The Core of the Pattern:**
      *   **Non-Intentional Functional/Diagnostic Agency:** The non-human force (volcano, pathogen, climate trend) is endowed with a *capacity to act* in a specific way: to *test*, *probe*, *reveal*, *expose*, *accelerate*, *select*, or *dissolve*. This agency is explicitly non-intentional/non-teleological ("as though," "almost pedagogical agency without intentions").
      *   **Revelatory Function:** The force acts upon pre-existing social, political, or economic structures, making latent weaknesses, contradictions, or adaptive capacities manifest.
      *   **Evaluative Framework:** The human response is judged based on its *interpretive accuracy* (did they "read the signals" correctly?) and *adaptive flexibility* (was the institutional response "appropriate"?). Success/failure hinges on correctly responding to the *diagnosis* provided by the non-human force.
      *   **Causal Mechanism:** The force is not just a trigger or background condition; it's an active *analyzer* or *catalyst* that interacts dialectically with human structures.

  **Proposed Coinage: Diagnostic Agency Historiography (or Stress-Test Historiography)**

  *   **Definition:** A mode of historical explanation where non-intentional environmental, biological, or geological forces are attributed a *functional agency* to act as diagnostic probes, stress-tests, or revelatory mechanisms upon human socio-political and economic structures. This agency exposes latent vulnerabilities, contradictions, or adaptive capacities within these structures. The narrative subsequently evaluates human actors and institutions based on their perceived success or failure in accurately interpreting the diagnostic signal revealed by the non-human force and responding with appropriate flexibility or innovation. This mode explicitly rejects both mechanical determinism and animistic intentionality while granting non-human forces an active, functional role beyond mere causal factors or background conditions.

  *   **Boundary Conditions:**
      *   **(a) Ordinary Multicausal Explanation:** Here, the environment is one factor among many (e.g., "poor harvests *combined with* high taxes led to unrest"). Diagnostic Agency Historiography specifically frames the non-human force as the *active revealer/tester* of the *other* factors (e.g., "the harvest failure *exposed* the fragility caused by high taxes and weak governance").
      *   **(b) Full-Blown Historical Agency for Nature:** This would involve attributing consciousness, purpose, or strategy (e.g., "the plague *sought to* destroy feudalism"). Diagnostic Agency explicitly denies this, relying on functional metaphors ("acted *as if* testing," "functioned *to* reveal").
      *   **(c) Gould-Lewontin Spandrels Critique:** This critiques explanations where apparent function is a coincidental byproduct. Diagnostic Agency Historiography *uses* functional explanation *as a narrative device*. It's not necessarily claiming the force *evolved* to test societies, but that *analytically/narratively*, its *effect* was diagnostic. The critique is relevant for evaluating the validity of the posture, not for distinguishing it descriptively.

  *   **Normative Commitments:** This posture **does carry significant, often hidden, normative commitments:**
      1.  **Adaptability as Virtue:** It implicitly valorizes institutional flexibility, learning, and adaptability as the "correct" response to environmental challenges. Failure to adapt is framed as a moral/political failing (brittleness, rigidity).
      2.  **The "Signal" is Legible:** It assumes the diagnostic "signal" sent by the non-human force is, at least in principle, interpretable by human actors/institutions. This downplays radical uncertainty, conflicting interpretations, or the impossibility of "correct" reading under crisis.
      3.  **Resilience Imperative:** It often aligns with a modern resilience discourse, where systems are expected to withstand and learn from shocks. This can subtly naturalize neoliberal demands for constant adaptation and mask political choices about *who* bears the cost of adaptation.
      4.  **Teleological Undertow:** While denying intentionality, the functional language ("revealed," "exposed," "forced innovation") can introduce a subtle teleology, suggesting the event *had* to reveal *something* meaningful or *led inevitably* to the exposure of pre-existing flaws.

  **What Would Change My Mind & Vulnerabilities:**

  1.  **Change My Mind:**
      *   **Explicit Denial in Usage:** If you found numerous prominent examples where historians use phrases like "exposed fragility" or "tested systems" but *explicitly state* (e.g., in methodology sections) that this is *only* a metaphor with no analytical weight, and the *real* explanation is purely correlative or multicausal without any functional attribution to the non-human force, it would weaken the case for a distinct *conceptual* posture.
      *   **Demonstrable Correlation-Only:** If rigorous historical analysis showed that the connection between the non-human event and the structural outcome was purely correlative (e.g., the Black Death coincided with labor scarcity changes but didn't functionally cause/drive them), and the "revelatory" language was demonstrably just rhetorical flourish without analytical substance in the argument.
      *   **Universal Rejection of "Agency":** If the broader field of history/historiography/philosophy of science fundamentally rejected *any* attribution of agency (even non-intentional, functional) to non-humans as analytically useless or illegitimate, making your observed pattern simply "bad history" rather than a distinct mode.

  2.  **Vulnerabilities in Reasoning:**
      *   **Definition of "Agency":** This is the core vulnerability. I rely on a broad, non-intentional, functional definition of agency (capacity for action with effect, without consciousness/purpose). Historians or philosophers adhering to a strictly *intentionalist* definition of agency (requiring mind/consciousness) would reject the entire premise that "diagnostic agency" is even possible. They might see this solely as problematic metaphor or sloppy causation.
      *   **Blurriness with Metaphor:** Distinguishing a distinct *analytical posture* from pervasive *metaphorical language* is inherently challenging. The line can be blurry. My argument hinges on the consistency of the pattern, its integration into causal explanations, and the evaluative framework for human responses, suggesting it's more than just rhetoric.
      *   **Overlooking Nuance:** There may be variations within this posture that I'm lumping together. For example, the agency attributed to a sudden volcanic eruption might feel different from that attributed to slow climate change.

  **Conclusion:**

  You have identified a distinct and increasingly prevalent mode of explanation in histories dealing with non-human forces: **Diagnostic Agency Historiography (or Stress-Test Historiography)**. While drawing on ideas like perturbation, structural constraints, and complex systems, it uniquely combines the attribution of non-intentional functional/diagnostic agency to the non-human force with an evaluative framework focused on human interpretation and adaptive response. It is not merely rhetorical flourish but a conceptual hybrid shaping causal narratives. Coining a precise term like this is necessary and valuable to make this posture explicit, facilitate critical discussion (especially of its normative commitments regarding adaptability), and distinguish it clearly from environmental determinism, simple multicausality, or Latourian symmetry. The greatest vulnerability lies in contested definitions of "agency," but the consistency and analytical function of the pattern you observe warrant its identification as a distinct conceptual tool.
