  ---

  ### **Decision Tree: "What Grounds Your Emotional Response to Fiction?"**

  **Instructions:** Answer each question based on your intuitive judgment of what makes the emotion *appropriate or rational*, not whether it "feels" real. Use concrete examples provided.

  ---

  #### **Node 1: Belief in Existence**  
  *Consider pity for a counterfactual Napoleon in a biopic (e.g., a scene showing his loneliness). To feel this emotion, must you briefly believe this version of Napoleon **exists/existed**?*  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 3.  

  ---

  #### **Node 2: Action Motivation (For "Yes" at Node 1)**  
  *In the counterfactual-Napoleon case, does your pity motivate **real-world action** (e.g., researching the real Napoleon’s life, donating to mental health charities)?*  
  - **Yes** → **Leaf 6: Incoherent Combo** (Real emotion + action-motivating + belief in existence).  
  - **No** → **Leaf 1: Full-Blooded Illusionism** (Belief in existence, but no action).  

  ---

  #### **Node 3: Reality of Emotion (For "No" at Node 1)**  
  *Consider grief for a procedurally generated NPC (e.g., in *Caves of Qud*). Is your grief a **genuine affective state** (e.g., physiological arousal, lingering sadness), even without belief?*  
  - **Yes** → Proceed to Node 4.  
  - **No** → Proceed to Node 5.  

  ---

  #### **Node 4: Action Urge (For "Yes" at Node 3)**  
  *In the NPC case, does your grief include an **intrinsic urge to act** (e.g., reloading a save file, feeling "I must fix this"), even if you don’t act?*  
  - **Yes** → **Leaf 3: Thought-Theory** (Real affect, no belief, action urge present).  
  - **No** → **Leaf 4: Attenuation View** (Real affect, but lacks action-motivating force).  

  ---

  #### **Node 5: Non-Affective Response (For "No" at Node 3)**  
  *In the NPC case, is your "grief" **prescribed by the fiction** (e.g., "the game wants me to feel this") or a **mild, non-emotional response**?*  
  - **Prescribed by fiction** → Proceed to Node 6.  
  - **Mild/non-emotional** → **Leaf 5: Deflationary View** (No genuine emotion/care).  

  ---

  #### **Node 6: Pretense Mechanism (For "Prescribed" at Node 5)**  
  *For the NPC grief, is your response **actively imagined** (e.g., "I play along with the game’s rules") or **passively absorbed** (e.g., "the game mechanics trigger reflexes")?*  
  - **Actively imagined** → **Leaf 2: Walton-Style Make-Believe** (Prescribed imaginings).  
  - **Passively absorbed** → **Leaf 5: Deflationary View** (No genuine emotion/care).  

  ---

  ### **Leaf Mappings**
  1. **Leaf 1: Full-blooded illusionism** → Belief in existence, no action.  
  2. **Leaf 2: Walton-style make-believe** → No belief/real emotion; prescribed imaginings.  
  3. **Leaf 3: Thought-theory** → Real affect, action urge, no belief.  
  4. **Leaf 4: Attenuation view** → Real affect, no action urge, no belief.  
  5. **Leaf 5: Deflationary view** → No genuine emotion/care.  
  6. **Leaf 6: Incoherent combo** → Belief + real emotion + action motivation.  

  ---

  ### **Scoring Notes: Ambiguities & Limitations**  
  1. **Thought-Theory vs. Attenuation View (Leaf 3 vs. Leaf 4):**  
     - The tree distinguishes these via the presence of an **action urge** (Node 4). However, users who interpret "action urge" as a *suppressed impulse* (thought-theory) versus *total absence* (attenuation) may blur the line. Attenuation could be misidentified as thought-theory if the user conflates "urge" with "weak impulse."  

  2. **Walton vs. Deflationary (Leaf 2 vs. Leaf 5):**  
     - The tree separates these via **pretense intentionality** (Node 6). However, if a user sees algorithmic NPCs as incapable of "prescribing" responses, Walton may collapse into deflationary (e.g., "It’s just code, so no make-believe").  

  3. **Illusionism vs. Incoherent Combo (Leaf 1 vs. Leaf 6):**  
