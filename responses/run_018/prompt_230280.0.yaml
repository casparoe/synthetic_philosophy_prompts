  Another angle is the first-person perspective. The user, as a competent speaker, feels their meanings are determinate. But Quine would say that even self-knowledge of meaning is based on behavioral dispositions. So indeterminacy applies to oneself too, which is more unsettling than scientific underdetermination.

  I should also address the user's mention of epistemic caution. They’re right that on the surface, indeterminacy involves uncertainty. But Quine pushes it to a metaphysical claim: no fact of the matter. The distinction between epistemology and ontology is crucial here. The user might be conflating the two, thinking that if it’s underdetermined, it’s just about our knowledge. Quine is saying it’s about the non-existence of meanings as entities.

