  **Key Branch Nodes Explained:**
  - **Diachronic preference fragmentation**: This issue arises only for views relying on the user's mental states or preferences (e.g., IA or agent-relative VA). It splits into three stances:
    - **Present revealed preferences**: Align to the user's current, observable choices (e.g., "I want X now").
    - **Counterfactual idealized preferences**: Align to what the user *would* want under idealized reasoning (e.g., "I would want Y if rational").
    - **Narrative identity**: Align to a coherent, temporally extended identity (e.g., "My life story implies Z across time").
  - This fragmentation **tracks the IA/VA divide** only for IA-aligned views (Pure IA, Hybrid, Collapse) because VA typically rejects user-dependent targets. For VA, fragmentation is irrelevant if VA is objective (e.g., based on moral facts), but if VA is agent-relative (e.g., user-specific "good"), fragmentation may reappear identically—showing the split *fails* to track the divide when VA is user-centric.

  ---

  #### **Decision Tree**
  1. **Is the IA/VA distinction conceptually coherent?**  
     *(Does "intent" vs. "genuine good" define a non-trivial problem?)*  
     - **No** → Go to 2.  
     - **Yes** → Go to 3.  

  2. **Does proper intent specification collapse IA into VA?**  
     *(If we fully specify "intent," does it become VA?)*  
     - **Yes** → **Leaf: Collapse View**  
       - *Most awkward commitment*: Users' "true" intent (e.g., counterfactual preferences) must be defined for them, overriding their actual expressions.  
     - **No** → **Leaf: Skeptical View**  
       - *Most awkward commitment*: No principled alignment target exists, making technical solutions arbitrary.  

  3. **Is IA sufficient for alignment?**  
     *(If a system perfectly executes user intent, is alignment solved?)*  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **For IA, how resolve diachronic preference fragmentation?**  
     *(What intent target ensures alignment across time?)*  
     - **Present revealed preferences** → **Leaf: Pure Intent Alignment**  
       - *Most awkward commitment*: Must execute self-destructive commands (e.g., suicide during temporary despair) if they reflect current intent.  
     - **Counterfactual idealized preferences** → *Same leaf as above* (Pure Intent Alignment).  
       - *Note:* Fragmentation choices don't create new leaves; all resolve to Pure IA. Awkwardness varies: Counterfactual risks paternalism (e.g., ignoring cries for help as "irrational").  
     - **Narrative identity** → *Same leaf as above* (Pure Intent Alignment).  
       - *Note:* Narrative risks imposing identity (e.g., overriding present wishes for "narrative consistency").  

  5. **Is IA instrumentally necessary for VA?**  
     *(Must VA be achieved *through* IA, even if IA alone fails?)*  
     - **Yes** → **Leaf: Hybrid View**  
       - *Most awkward commitment*: Must sometimes defy IA (e.g., refuse a biased user's command) despite IA being a required step, creating deception.  
     - **No** → **Leaf: Pure Value Alignment**  
       - *Most awkward commitment*: May ignore or coerce users (e.g., force "therapy" for cognitive biases) to serve objective "good," even with consent.  
       - *Fragmentation note:* Irrelevant if VA is objective; if VA is agent-relative (user-specific), fragmentation reappears (e.g., "good" as present/counterfactual/narrative), but this doesn't split the leaf or track IA/VA.

  ---

  #### **Unoccupied Combination & Diagnosis**
  - **Combination**: Distinction coherent (Yes), IA sufficient (No), IA necessary (No).  
    - *Diagnosis*: Occupied by Pure Value Alignment. No unoccupied combinations exist for the core branches.  
  - **Unoccupied Combination**: Distinction coherent (No), but collapse into VA rejected *without* skepticism about the whole problem (e.g., "IA/VA are distinct but interdependent").  
    - *Diagnosis*: **Incoherent**—rejecting collapse while denying coherence implies the problem is meaningful yet unspecifiable, a contradiction.

  #### **Indistinguishable Leaves**
  - **Pure Intent Alignment** subtypes (based on fragmentation) are not separated; the tree cannot distinguish them as leaves. All share the same core commitment to IA sufficiency, with fragmentation handled internally.

  ---

  **Tree Summary**:  
  - **Leaves**:  
    - Pure Intent Alignment (via Node 4).  
    - Pure Value Alignment (via Node 5 → No).  
    - Hybrid View (via Node 5 → Yes).  
    - Collapse View (via Node 2 → Yes).  
    - Skeptical View (via Node 2 → No).  
  - **Fragmentation Tracking**: Only affects IA-aligned views (Pure IA, Hybrid, Collapse). For VA, it resurfaces only if VA is agent-relative, failing to track the divide by replicating IA's structure.
