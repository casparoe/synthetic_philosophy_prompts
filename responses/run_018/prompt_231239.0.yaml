prompt: |-
  I've spent years reading the decision-theory threads on rationalist forums, and I keep noticing a family of moves that people deploy but never quite pin down, and I'd like to know whether it has an established name and exact boundaries. The cleanest case is a one-shot prisoner's dilemma between two players who know they face identical payoffs, identical information, and, as far as either can tell, the same decision procedure. The move says: either both players run the same procedure, or they do not. If they do, then whichever option the procedure selects for me, it selects for the other player in the same situation, so I should compare cooperate-with-cooperate against defect-with-defect and choose cooperate. The usual dominance argument for defecting applies only if my choice can vary while the other player's choice stays fixed; on the symmetry-plus-common-procedure assumption, that cannot happen. The same shape of reasoning shows up in a multiplayer case I keep seeing people use as an illustration: a thousand isolated players are each offered a large prize if exactly one of them sends in a card, and nothing otherwise. If everyone commits to a shared randomizing procedure that sends with probability 1/1000, someone wins with probability about 1/e, and each player's expected payoff is about the prize divided by 1000e. But once a player has seen his own private draw, taking the others' behavior as fixed, he would prefer to send regardless of the draw, since sending is the only way to win and gives roughly a 1/e shot at the prize; so the policy is stable only if he treats the shared procedure, not the individual action after seeing his draw, as the thing he can choose.

  What I am trying to identify is what, exactly, this move is. It is not causal decision theory, because there is no causal path from one player's choice to another's; the only link is the hypothesized identity of the decision procedures, or later a common cause that made the players similar. It feels close to evidential decision theory's idea that your act is evidence about what similar agents will do, but the move is usually deployed more narrowly than that: it is invoked to license a particular option or mixed strategy in symmetric interactions where you expect the counterpart to run your exact reasoning, rather than to solve Newcomb-style problems generally. It also seems to need a boundary that people rarely draw. Does the move require literally shared source code, or only a sufficiently strong common cause such as shared training or culture, and how strong is "sufficiently"? Does it require that the choice point be the shared procedure rather than any action that occurs after a private random draw, and does it survive when players have indexical information about their own position? I want to know whether there is an established concept for exactly this move, and, if the nearest concepts only partially match, which one fits best, where it diverges, and what a precise statement of the valid core would say. I will not be satisfied with a bare label; the point is the carving, not the name. At the very end of your reply, please give a single machine-readable line of the form \answer{...}, with the best-fitting established term inside the braces, or a proposed term of your own if no established term fits.
reasoning: |-
  We are dealing with a family of reasoning moves in symmetric decision problems. The key examples are:
  1. A one-shot Prisoner's Dilemma between two players who are symmetric in every way (same payoffs, same information, same decision procedure).
  2. A multiplayer game where 1000 players are isolated and each can send a card. A large prize is awarded if exactly one sends. They commit to a shared randomizing procedure that sends with probability 1/1000.

  The move in the Prisoner's Dilemma: 
  - Since the players are symmetric and use the same decision procedure, they will make the same choice. Therefore, the relevant comparison is between (both cooperate) and (both defect). The dominance argument (which says that defecting is better regardless of the other's choice) fails because the symmetry ensures that the other player will do the same as you. Hence, cooperating is better (since mutual cooperation is better than mutual defection).

  The move in the multiplayer game:
  - Without the shared procedure, if each player independently decides, they might all end up sending (so no one wins) or none. But if they use a shared randomizing procedure that sends with probability 1/1000, then the chance that exactly one sends is about 1/e (by the Poisson approximation to the binomial). Each player's expected payoff is the prize times (1/1000) * (probability that exactly one sends given that they send) which is (1/1000) * (probability that no one else sends). The probability that any other specific player doesn't send is 1 - 1/1000, so the probability that all others don't send is (1 - 1/1000)^(999) ≈ 1/e. So expected payoff is about prize/(1000e). 
  - However, after a player sees their own draw (say, they get a random number and if it's below 1/1000 they send), they might think: "Regardless of what others do, if I don't send I get nothing. If I send, I might win. So I should send." But if every player reasons this way after seeing their draw, then everyone sends and no one wins. The move is to commit to the procedure in advance and then not deviate after seeing the draw. The reasoning is that at the time of choosing the procedure, the player is choosing for everyone (by symmetry) and the procedure gives a positive expected payoff. After the draw, the player must treat the procedure as fixed and not condition on their own draw.

  This reasoning is not causal decision theory (CDT) because CDT would condition on the actual choice and would not take into account the correlation between one's own action and the actions of others that arises from the symmetry and common procedure. Evidential decision theory (EDT) does take into account the correlation: your action is evidence about what others do. But in the Prisoner's Dilemma example, EDT might also lead to cooperation because if you cooperate, that is evidence that the other player (being symmetric) also cooperates. However, the move is often presented in a more specific context of symmetry and common decision procedures.

  The key elements seem to be:
  - Symmetry: all players are in identical situations (same payoffs, same information, same decision procedure).
  - The decision is made at the level of the procedure, not at the level of the action after private information (like a random draw).

  Now, what established concept fits this?

  One candidate is "reflective equilibrium" or "equilibrium reasoning", but that is too broad.

  Another candidate is the concept of "symmetry argument" or "principle of symmetry". But we are looking for a more precise term.

  In game theory, there is a concept of "correlated equilibrium" which involves a correlating device. In the multiplayer example, the shared randomizing device is a correlating device. However, correlated equilibrium is defined for any game and does not necessarily require symmetry. Also, it is a solution concept, not a decision theory.

  In decision theory, the move is sometimes called "UDT" (Updateless Decision Theory) or "TDT" (Timeless Decision Theory). Let me recall:

  - TDT (Timeless Decision Theory): Developed by Eliezer Yudkowsky. It says that you should consider the output of your decision procedure as being determined by the same function that determines the outputs of other agents who share that decision procedure. So you choose the action that, if taken by all agents who share your decision procedure, leads to the best outcome. This fits the Prisoner's Dilemma example: if your decision procedure outputs "cooperate", then so does the other, leading to mutual cooperation. If it outputs "defect", mutual defection. So you choose the procedure that outputs cooperate.

  - UDT (Updateless Decision Theory): Developed by Wei Dai. It takes the view that a decision-maker should choose a policy (a mapping from observations to actions) that maximizes expected utility, without conditioning on the observations that are generated by the policy. This fits the multiplayer example: you choose the policy (send with probability 1/1000) and then you do not update after seeing your own draw. Hence, you stick to the policy.

  Both TDT and UDT are designed to handle these kinds of problems. TDT is more about logical correlations (like in the Prisoner's Dilemma) and UDT is more about updating (or not updating) in the face of indexical information.

  However, note that in the literature, these are not always clearly distinguished and sometimes UDT is considered to subsume TDT.

  Another term that might be used is "cooperative decision theory" but that is not standard.

  Given the examples, the move is essentially the core idea of TDT/UDT. But we are asked for an established term.

  The most established term for this family of reasoning in the rationalist community is "Timeless Decision Theory" (TDT) for the Prisoner's Dilemma type of reasoning and "Updateless Decision Theory" (UDT) for the policy-level reasoning. However, UDT is often considered the more general framework.

  In fact, the multiplayer example is a classic example for UDT: the decision is made at the level of the entire policy (before seeing the random draw) and then the agent does not update on the indexical information (the draw) in a way that would lead to deviation.

  Therefore, the best-fitting established term is likely "Updateless Decision Theory" (UDT) because it explicitly handles the issue of updating on indexical information and choosing a policy without conditioning on the very information that the policy uses.

  But note that in the Prisoner's Dilemma example, there is no indexical information. However, UDT can also handle that by considering the policy as a function from the entire state (which in that case has no varying input) to an action. So UDT would choose the policy that outputs "cooperate" because it leads to mutual cooperation.

  TDT is a precursor to UDT and is sometimes considered a special case.

  Given that the multiplayer example is a classic UDT example and the reasoning about the common procedure is central, I would say UDT is the best fit.

  However, the question also asks for boundaries:

  - The move requires that the players be symmetric and that they are using the same decision procedure (or at least, they believe they are). The common cause (shared training, culture) might be enough if it leads to the same decision procedure being used.

  - The move requires that the choice is made at the level of the procedure (the policy) and not after acquiring private information that breaks the symmetry. In the multiplayer example, after the draw, each player has indexical information (their own draw) and if they condition on that, they break the symmetry. UDT avoids this by choosing the policy without updating on the indexical information.

  - The move can handle indexical information by not conditioning on it at the policy level.

  Therefore, the established term that fits best is "Updateless Decision Theory".

  But note: the original question says "a single machine-readable line". We must choose one term.

  Given that the multiplayer example is a standard UDT example and the reasoning is about being updateless, I think UDT is the most precise.

  However, in the Prisoner's Dilemma example, TDT is often used. But UDT is the more general framework and subsumes TDT.

  Wei Dai's UDT is designed to handle exactly these problems.

  So I will go with "Updateless Decision Theory".

  But let me check: is there a more specific term? Or a term from mainstream game theory?

  In game theory, the solution concept that is achieved by this reasoning in the multiplayer game is a correlated equilibrium (if we consider the randomizing device as a correlating device). But the decision-theoretic move is not called correlated equilibrium. Correlated equilibrium is a solution concept that can be achieved by various decision theories.

  The move we are describing is a decision theory that leads to that solution. So it is not the solution concept but the decision theory.

  In the rationalist community, the decision theory is UDT.

  Therefore, the answer is:

  \answer{Updateless Decision Theory}

  But note: the question says "if no established term fits, propose one". However, UDT is an established term in the rationalist decision theory literature.

  Let me double-check the boundaries:

  - Does UDT require literally shared source code? Not necessarily. It requires that the agent models other agents as using the same decision procedure (or a similar one). The exact degree of similarity is an open problem, but the core idea is that the agent chooses a policy that would be optimal if it were implemented by all agents that are "similar" in the sense of using the same decision procedure.

  - The move survives when players have indexical information by choosing a policy that maps that indexical information to actions, and then evaluating the policy without conditioning on the indexical information.

  Therefore, I believe UDT is the best fit.
answer: |-
  The reasoning move you describe is most precisely captured by **Updateless Decision Theory (UDT)**, a decision theory developed by Wei Dai to handle logical correlations, indexical uncertainty, and policy-level decisions in symmetric interactions. UDT addresses scenarios where agents share identical decision procedures, payoffs, and information, and it resolves conflicts between individual and collective rationality by choosing a policy (a mapping from observations to actions) that maximizes expected utility from a "timeless" or "updateless" perspective, without conditioning on information that would break symmetry or lead to suboptimal deviations.

  ### Key Features of UDT that Match Your Description:
  1. **Policy-Level Choice**: UDT evaluates decisions at the level of a full policy (e.g., "commit to a shared randomizing procedure with probability \(p\)") rather than individual actions after private information (e.g., "send the card after seeing my draw"). This aligns with your examples, where the optimal policy (cooperate in PD, or \(p = 1/1000\) in the card game) is stable only if agents do not update on private information in a way that undermines the collective outcome.
  2. **Symmetry and Logical Correlation**: UDT leverages the assumption of identical decision procedures to handle logical correlations between agents. In the Prisoner's Dilemma (PD), UDT compares outcomes where both agents choose identically (CC vs. DD) because their shared procedure ensures symmetry. Similarly, in the card game, the shared randomizing procedure creates a logical link between players, making individual actions evidence about others' actions.
  3. **Indexical Information Handling**: UDT avoids conditioning on private or indexical information (e.g., a player's random draw) that would break symmetry. Instead, it treats such information as part of the policy's input and evaluates the policy's expected utility from the pre-observation perspective. This prevents the "temptation to defect" in the card game after seeing one's draw.
  4. **Boundaries with Causal and Evidential Decision Theory**:
     - Unlike **Causal Decision Theory (CDT)**, UDT does not require causal influence between agents (e.g., no causal path from one player's choice to another's). CDT would defect in PD (due to dominance) and always send in the card game (after the draw) because it ignores logical correlations.
     - Unlike **Evidential Decision Theory (EDT)**, UDT is narrower: it specifically exploits symmetry and shared procedures, rather than general evidential links. EDT might cooperate in PD (since cooperation is evidence of mutual cooperation), but it lacks UDT's policy-level commitment and can fail in indexical scenarios (e.g., EDT might still deviate after the card draw if it conditions on the evidence).

  ### Boundaries and Limitations:
  - **Source Code vs. Common Cause**: UDT does not require literally identical source code. It works with any "sufficiently strong" common cause (e.g., shared training, culture, or evolutionary history) that ensures decision procedures are functionally equivalent or predictably similar. The strength of "sufficient" depends on the agent's beliefs: if they believe others will reason identically due to the common cause, UDT applies. However, if procedures differ substantially, UDT may not hold, and outcomes depend on the degree of similarity (a topic of ongoing research).
  - **Indexical Information**: UDT handles indexical information (e.g., "my position in the game") by incorporating it into the policy but evaluating the policy *before* such information is received. For example, in the card game, the policy includes the random draw, but agents commit to it upfront. If players have asymmetric roles (e.g., different payoffs), UDT may not apply directly without adjustments for partial symmetry.
  - **When It Fails**: UDT assumes agents can coordinate on a shared policy. If players distrust each other's adherence, or if there are incentives for unilateral deviation (e.g., in asymmetric games), UDT can break down. It also relies on agents modeling others as using the same procedure, which may not hold in real-world conflicts with heterogeneous actors.

  ### Comparison to Related Concepts:
  - **Timeless Decision Theory (TDT)**: TDT (a precursor to UDT) handles logical correlations in symmetric games like PD but lacks UDT's full policy framework for indexical information. UDT subsumes TDT and extends it to dynamic or uncertain environments (e.g., the card game), making UDT the better fit for your multiplayer example.
  - **Cooperative Game Theory**: Concepts like correlated equilibrium describe the *outcome* (e.g., the \(1/1000\) policy is a correlated equilibrium) but not the decision-theoretic *move*, which UDT provides.
  - **Reflective Equilibrium or Symmetry Arguments**: These informal ideas are embodied in UDT but lack its formal machinery for expected utility maximization and policy selection.

  In summary, UDT is the established framework for the move you describe, with well-defined boundaries for policy-based decisions under symmetry and logical correlation. Its core valid statement is: **Agents should choose a policy that maximizes expected utility, conditional on the assumption that all functionally identical agents (due to shared procedures or common causes) will adopt the same policy, without updating on private information that would lead to unilateral deviation.**

  \answer{Updateless Decision Theory}
