prompt: |-
  Write a joke that turns on the specific conceptual tension in Henry Sidgwick's thought between the exacting evidential standards of his moral epistemology—particularly the tripartite division of practical reasoning into egoistic, utilitarian, and intuitionist methods that he articulates in his major work on ethical method—and his concurrent, methodologically cautious but genuinely open-minded involvement with psychical research as a leading figure in the Society for Psychical Research. To keep the joke from being a generic philosopher-ghost anecdote, inject the following framing: Sidgwick is confronted with an alleged apparition and attempts to determine whether it refutes materialism by treating the ghost as a candidate belief that must survive all three of his own practical-reasoning tests. The punchline should depend on the actual logical structure of one of these methods being misapplied to empirical ontology—for example, the intuitionist demand for self-evident certainty, which works for basic ethical axioms but collapses when applied to a noisy séance transcript, or the utilitarian calculus being used to weigh the aggregate suffering caused by widespread belief in ghosts against the pleasure of skeptical debunking. The result should be funny precisely because someone familiar with Sidgwick's distinction between intuitive and discursive justification can see why the method fails outside ethics, yet the joke should not depend on obscure archival details, specific publication years, or verbatim quotations from his writings. Avoid generic nerd tropes; the humor must arise from the internal logic of the methods being stretched past their proper domain.
