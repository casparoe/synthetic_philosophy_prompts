  Here's a joke crafted to Sidgwick's specific conceptual tension:

  Henry Sidgwick, meticulously reviewing a particularly fuzzy spirit photograph presented at a Society for Psychical Research meeting, felt a cold draft. He turned to find a translucent figure wringing its spectral hands.

  "Professor Sidgwick!" the ghost wailed. "I am proof! Proof that materialism is a hollow lie! Tell the world!"

  Sidgwick adjusted his spectacles, his expression one of profound methodological seriousness. "Proof requires rigorous examination, spectre. We must subject your existence to the proper tests of practical reason."

  The ghost blinked. "Tests?"

  "Naturally," Sidgwick began. "Firstly, the *Egoistic* test: Does your manifestation serve *my* rational self-interest? Well, association with unverified apparitions could damage my academic standing. Verdict: Dubious."

  The ghost shimmered anxiously.

  "Secondly," Sidgwick continued, "the *Utilitarian* test: Would belief in your existence, validated by me, maximize the general happiness? Widespread ghost-belief might cause considerable unease and superstition, whereas my careful skepticism promotes intellectual calm. The aggregate pleasure of debunking likely outweighs the fleeting thrill of your confirmation. Verdict: Negative."

  The ghost began to look distinctly frayed around the edges.

  "Finally," Sidgwick said, leaning forward intently, "the crucial *Intuitionist* test. For your existence to refute materialism definitively, it must possess the *immediate, self-evident certainty* of a fundamental moral axiom. Like 'one ought to keep promises' or 'gratuitous cruelty is wrong'. Does your presence strike my reason with undeniable, luminous clarity?"

  The ghost hesitated, glanced down at its own faintly glowing form, then back at the professor's expectant gaze. "Well... I *feel* pretty real?" it offered weakly.

  Sidgwick sighed, disappointment etched on his face. "Ah. Lacking that intrinsic, irresistible luminosity of *self-evidence* accessible only to the rational moral faculty. Merely discursive, contingent appearance. I'm afraid," he concluded, closing his notebook with a soft thud, "you fail the third criterion. Materialism stands."

  The ghost stared, utterly deflated by this epistemological rejection. With a final, despairing puff of ectoplasm, it didn't so much vanish as... *fizzle out logically*, defeated not by a cross or holy water, but by the inapplicable demand for axiomatic certainty in the sensory world.

  **Why the joke works:**

  1.  **Specific Tension:** It directly pits Sidgwick's rigorous ethical methodology (the tripartite tests) against his psychical interests (the ghost).
  2.  **Misapplication of Method:** The core humor lies in applying the *Intuitionist* test (designed for self-evident *ethical* truths) to an *ontological* question ("Does this ghost exist?"). Demanding that a physical (or spectral) phenomenon possess the same kind of luminous, rational self-evidence as "keep promises" is an absurd category error.
  3.  **Logical Failure:** Anyone familiar with Sidgwick knows intuitionism in ethics is about foundational *justification*, not empirical *evidence*. Applying it to a ghost makes the ghost's failure inevitable and highlights why the method is ill-suited for this domain. The ghost's weak response ("I *feel* pretty real?") underscores the mismatch – feelings aren't self-evident axioms.
  4.  **Avoids Cliché & Obscurity:** It's not a generic "philosopher sees ghost" gag. The humor stems purely from the internal logic of Sidgwick's *own* system being stretched beyond its ethical purpose. It relies on the *concept* of intuitionist certainty, not specific dates, quotes, or "nerdy" tropes. The setting (SPR meeting, spirit photo, ectoplasm) is recognizable without needing deep archival knowledge.
  5.  **Punchline:** The ghost's "fizzling out logically" is the direct consequence of failing an irrelevant (for its existence) test designed for moral axioms, perfectly encapsulating the misapplication and providing the comedic payoff.
