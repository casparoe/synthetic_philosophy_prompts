prompt: |-
  I'm a retired biologist who just started reading philophy of science, and I keep running into this pattern: grant agencies and journal reviewers in neuroscience and psychiatry will accept an explanantion of behavior only if it eventually bottoms out in synapses, genes, or some other crane mechanism. If you propose a purely cognitive-level model — say, predicting depression relapse from belief-updating patterns — they treat it as a skyhook and reject it, even when the model is predictive and falsifiable. What theory of reduction does that institutional bias presuppose? Is it Dennett-style greedy reductionism, or just a practical rule about tractability? Would a non-reductive physicalist have to reject the practice, or can they say the funding rule is just about method not ontology? And if we rewrote the grant guidelines to treat top-down cognitive models as equally legitmate, what would that actually commit us to about explanantion? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a retired biologist new to philosophy of science, noticing that neuroscience and psychiatry grant agencies and journals only accept explanations based on synapses or genes, rejecting cognitive-level models even if predictive. They mention Dennett's greedy reductionism and non-reductive physicalism. 

  First, I need to identify the core issue: institutional bias towards reductionist explanations. The user wants to know the philosophical basis of this bias, whether it's greedy reductionism or just practicality. They also ask if non-reductive physicalism would reject this practice and what changing guidelines would imply.

  The user's identity as a biologist transitioning to philosophy is key. They might be frustrated with the limitations of current practices and seeking validation that cognitive models are legitimate. Their deeper need could be understanding how to advocate for interdisciplinary approaches without abandoning physicalism.

  Dennett's greedy reductionism insists on explaining everything from lower levels, which aligns with the bias described. But the reviewers might be conflating methodological reduction with ontological commitment. Non-reductive physicalists can accept methodological reduction as practical while maintaining that higher levels are real. 

  The user also asks about rewriting grant guidelines. Allowing cognitive models commits to methodological pluralism, not dualism. It means explanations can be valid at different levels without always reducing them. This is compatible with physicalism if we see levels as organizational, not ontologically distinct.

  I should clarify that the current practice is likely a mix of greedy reductionism and practicality. However, the bias oversimplifies by demanding neural correlates prematurely. Non-reductive physicalists would critique this but might accept practicality. Changing guidelines would promote diverse methods without changing ontology.
answer: |-
  **Bottom line:** The institutional bias reflects a pragmatic but philosophically naive form of *methodological reductionism*, likely conflated with an implicit *ontological reductionism* akin to Dennett's "greedy reductionism," but it can be challenged by non-reductive physicalists who distinguish methodological practice from ontological commitment.

  **Reasoning:**

  1.  **Presupposed Theory:** The demand to "bottom out" in synapses/genes presupposes a strong form of *intertheoretic reductionism*. This holds that higher-level theories (e.g., cognitive psychology) must ultimately be *reduced to* or *replaced by* lower-level theories (e.g., neurobiology, genetics) to be genuinely explanatory. This aligns with Dennett's "greedy reductionism," which insists explanations aren't complete until they reach the lowest physical level, dismissing higher-level patterns as mere "skyhooks" (illusions/placeholders).

  2.  **Greedy Reductionism vs. Practicality:** While practicality (tractability, funding constraints) plays a role, the *rejection* of predictive cognitive models suggests more than just pragmatism. It implies a deeper belief that cognitive-level explanations *are not fundamental* or *not real science* until grounded in biology, reflecting the ontological claim of greedy reductionism: only neural mechanisms are the "real" causes.

  3.  **Non-Reductive Physicalism (NRP):** An NRP *can* accept the pragmatism ("Start with neural correlates; it's often fruitful") but *must reject* the ontological claim and the dismissal of cognitive models as mere "skyhooks." NRP holds that:
      *   Mental/cognitive states are *causally efficacious* and *real* properties of complex physical systems (brains), even if they supervene on neural states.
      *   Higher-level explanations (like cognitive belief-updating patterns) are *genuine and irreducible* explanations operating at their own level of organization. Their predictive success demonstrates their validity.
      *   Requiring reduction for legitimacy confuses *method* (often useful) with *ontology* (higher levels are real and causal). An NRP can argue the *funding rule* reflects a flawed ontology, not just method.

  4.  **Rewriting Grant Guidelines:** Treating cognitive models as equally legitimate commits to:
      *   **Methodological Pluralism:** Different levels of description (cognitive, neural, molecular) can provide valid, complementary explanations. No single level holds exclusive explanatory privilege.
      *   **Autonomy of Higher Levels:** Cognitive explanations can be explanatorily adequate *in their own terms* without needing constant translation downwards. Predictive success at the cognitive level is sufficient warrant for legitimacy.
      *   **Causal Efficacy at Multiple Levels:** It accepts that patterns at the cognitive level (belief-updating dynamics) can be genuine causes of behavior (e.g., depression relapse), even if they are implemented by neural mechanisms. This is *compatible* with physicalism – the cognitive *is* physical, just described differently.
      *   **Rejecting Greedy Reductionism:** It explicitly denies that explanation *must* bottom out in synapses/genes to be valid. Cognitive models are not skyhooks; they are "cranes" built from neural parts but operating at a higher functional level.

  **In essence:** The current bias conflates methodological preference (often useful) with ontological necessity (only neural mechanisms are truly explanatory), leaning towards greedy reductionism. Rewriting guidelines would affirm methodological pluralism, the autonomy and causal efficacy of higher-level phenomena, and a non-reductive physicalist ontology where multiple levels of explanation coexist and are interdependent, without implying dualism.
