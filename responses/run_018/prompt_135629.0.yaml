  I am writing the final examination for an upper-level undergraduate seminar in philosophy of gender and sexuality. I need a single essay question, together with a model answer of approximately 700 words and a marking scheme, on Bertrand Russell's arguments in Marriage and Morals concerning the institution of marriage, sexual ethics, and the separation of sexuality from procreation. The question must not be answerable by a summary of Russell's familiar positions—on divorce reform, the critique of the double standard, or the advocacy of companionate marriage—nor should it ask students to list his views. To prevent regurgitation, inject the following conceptual framework directly into the exam prompt: present students with a "renewable cooperative agreement" model of marriage, according to which marriage is not an institution with intrinsic moral or natural weight but a time-limited, renegotiable cooperative contract justified solely by the welfare of the contracting parties and affected children, with no appeal to natural sexual complementarity, social tradition, or essential human needs. The essay question should ask students to determine whether Russell's critique of conventional sexual morality can be fully reconstructed within this contractualist framework, or whether his argument implicitly relies on a naturalistic account of sexual companionship and human emotional needs that undermines his own reformist, anti-essentialist rhetoric. In particular, students should be required to apply the model to at least one specific Russellian claim—such as his defense of easier divorce, his account of companionate intimacy, or his critique of procreative essentialism—and argue for a definite resolution rather than merely describing both sides.

  Please provide:
