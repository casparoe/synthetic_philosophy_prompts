  Perhaps Hume's "good sense" can include understanding procedural elements, making the expertise part of the critic's toolkit. Then, the joint verdict would require such knowledge, but sentiment still plays a role. This keeps it within Hume's subjectivism, accommodating the new expertise without fully objectifying aesthetics. 

