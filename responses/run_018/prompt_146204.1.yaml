  Hume's distinction between sentiment (subjective) and object (objective) is pressured here. The critics' sentiments depend on their understanding of the algorithm, which is an objective property of the art. But Hume wants sentiment to be based on perception, not hidden properties. So, does this force Hume to accept objective properties in the code? Or can it fit within cultivated sentiment? 

