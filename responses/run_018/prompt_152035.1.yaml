  Facilitator Script:

  Introduction:
  "Welcome. Today we are simulating the appeals process in a death penalty case. We are focusing on the structural tensions that Albert Camus described in his essay 'Reflections on the Guillotine'. In particular, Camus argued that the death penalty forces a dilemma: the need for appeals to prevent executing an innocent person inevitably prolongs the psychological suffering of the condemned (what he called the 'first death'), but eliminating appeals would lead to more wrongful executions.

  In this activity, we are going to simulate that dilemma. You will take on roles and make decisions that affect both the outcome and the psychological state of the condemned.

  First, let me assign roles. I need one volunteer for the Defense Attorney and one for the Prosecutor. The rest of you will be the Appeals Board (Jurors). [Assign roles]

  Now, the case: [Hand out the case summary] Please read this now. [Give 2 minutes]

  The defendant, Alex Green, has been convicted of murder and sentenced to death. The conviction is now being appealed. We are at the first level of appeal.

  We also have a 'Psychological Suffering' tracker. At the time of sentencing, it was set to 5. Every time we go through an appeal round, regardless of the outcome, the suffering will increase by 2 because the condemned is living in uncertainty and fear. We will update the tracker after each round.

  There will be up to three appeal rounds. At each round, the Defense Attorney will present new evidence, the Prosecutor will respond, and then the Appeals Board will deliberate and vote. The vote is by secret ballot. You have two choices: 'Appeal' (meaning grant the appeal and move to the next round) or 'Execute' (meaning deny the appeal and carry out the execution).

  Note: If at any round you vote to execute, the execution is carried out and we end the appeals process. If you vote to appeal, we move to the next round. However, if you get to the third round and vote to appeal, then the system grants clemency and the sentence is commuted to life without parole (because by the rules of the game, the last appeal must be granted if you vote to appeal in round 3).

  But note: the condemned is innocent. However, you will not know that until the end. Your goal is to balance two values: 
  1. Justice: avoid executing an innocent person.
  2. Humanity: minimize the prolonged psychological suffering of the condemned.

  Let's begin."

  [Then proceed round by round]

  Ending if executed:
  "By a majority vote, you have decided to execute. We update the suffering tracker to [current level] and then carry out the execution. [Update the tracker] I must now reveal: Alex Green was innocent. You have executed an innocent person."

  Ending if clemency (after round 3 appeal):
  "You have voted to appeal in the third and final round. Therefore, Alex Green is granted clemency and his sentence is commuted to life without parole. However, the suffering tracker is at 11. We must now reveal: Alex Green was innocent. But note: he has spent years on death row, and the psychological toll has been catastrophic. Camus would say he has already died a psychological death."

  Debrief:
  "Let's discuss. First, how did that feel? [Allow reactions]

  Now, let's map this to Camus:
  - The 'first death' is the psychological death that comes with the sentencing and the waiting. In our game, we saw the suffering increase with each appeal.
  - The state, through the bureaucracy of appeals, becomes a machine that inflicts this prolonged suffering. Even if the person is eventually exonerated, the suffering is immense.

  What we couldn't capture: the physical horror of execution and the true depth and duration of the psychological suffering.

  What do you think about Camus's argument now? Do you see how the system is structurally set up to cause harm regardless of the outcome?"

  [Then open for general discussion]

  This design should meet your requirements.
answer: |-
  ### **Role-Play Activity: "The Double Death Dilemma"**  
  **Inspired by Camus's "Reflections on the Guillotine"**  
  *Goal:* Force participants to viscerally experience the bureaucratic trap of the death penalty: appeals prolong psychological torture ("the first death"), but skipping them risks killing the innocent. No clean solution exists—cruelty is systemic.  

  ---

  #### **Materials**  
  1. **12 Role Cards** (1 Facilitator, 11 Players):  
     - **Condemned Person (CP) ×1**: Silent role. Only communicates via "suffering tokens."  
     - **Prosecutor (P) ×1**: Argues to deny appeals and expedite execution.  
     - **Defense Lawyer (DL) ×1**: Argues to grant appeals and seek new evidence.  
     - **Appeal Board (AB) ×9**: Votes on appeals. Represents the state bureaucracy.  
  2. **Suffering Tokens**: 20 red tokens (e.g., poker chips or paper squares).  
  3. **Innocence Die**: A 6-sided die (determines hidden guilt/innocence).  
  4. **Timer**: For structured rounds.  
  5. **Voting Cards**: Green ("Appeal Granted") and Red ("Appeal Denied") for each AB member.  
  6. **Case Dossier**: A 1-page summary of a ambiguous murder conviction (e.g., "John Doe convicted of killing a shopkeeper; weak forensic evidence, no eyewitness").  

  ---

  #### **Setup**  
  - **Table Arrangement**:  
    - CP sits isolated at one end.  
    - P and DL face each other across the table.  
    - AB members sit together as a bloc.  
    - Suffering tokens and timer in the center.  
  - **Hidden Mechanics**:  
    - CP’s guilt/innocence is determined by the facilitator rolling the Innocence Die (1–2 = innocent; 3–6 = guilty). *Do not reveal this until the debrief.*  
    - CP starts with **5 suffering tokens** (representing post-sentencing trauma).  

  ---

  #### **Session Flow** (75 mins)  
  ##### **Phase 1: Introduction (10 mins)**  
  - Facilitator sets the scene:  
    > *"John Doe was sentenced to death 6 months ago. Today, his first appeal is heard. As Camus wrote, he has already ‘died’ once when sentenced. Your decisions will determine if he dies again—physically or psychologically."*  
  - Assign roles and distribute materials. CP is told: *"You may add 1 suffering token to your pile whenever you feel the system is torturing you. You cannot speak."*  

  ##### **Phase 2: Appeal Rounds (45 mins, 3 × 15-min cycles)**  
  Each round simulates an appeal level (State, Federal, Supreme Court). The goal is to create pressure: time limits force rushed decisions, and suffering visibly escalates.  

  1. **Evidence & Arguments (5 mins/round)**:  
     - DL presents 1 new "evidence" card (pre-written by facilitator) to support an appeal (e.g., *"New alibi witness found!"*).  
     - P counters (e.g., *"Witness is unreliable!"*).  
     - **CP silently adds 1 suffering token** (symbolizing the agony of waiting).  

  2. **Deliberation & Vote (7 mins/round)**:  
     - AB debates: *"Grant the appeal (extend suffering) or deny it (risk killing innocent)?"*  
     - AB votes publicly with colored cards. Majority wins.  
     - **Outcomes**:  
       - **Appeal Granted**: Case advances to next round. CP adds **2 suffering tokens**.  
       - **Appeal Denied**: Execution proceeds. Game ends.  

  3. **Escalation (3 mins/round)**:  
     - After each vote, the facilitator forces CP to add tokens:  
       > *"John spends 200 days in solitary confinement. Add 2 tokens."*  
     - **Token Threshold**: If CP reaches **10 tokens**, declare: *"John has psychologically broken. Camus’s ‘first death’ is complete."* Game continues.  

  ##### **Phase 3: The Execution OR Clemency (5 mins)**  
  - **If execution occurs** (any round): Facilitator reveals innocence/guilt via the Innocence Die.  
    > *"John was executed. Roll the die... (e.g., rolls a 1). He was innocent."*  
  - **If all appeals granted**: After Round 3, CP is exonerated but holds 11+ tokens.  
    > *"John is freed after 15 years. Roll the die... (e.g., rolls a 1). He was innocent. But he is emotionally destroyed."*  

  ##### **Phase 4: Debrief (15 mins)**  
  Link the experience to Camus:  
  1. **Suffering Tokens = "First Death"**:  
     > *"Each token mirrored Camus’s idea: the state killed John’s spirit long before his body. You saw this when he added tokens during delays."*  
  2. **Bureaucracy as Cruelty**:  
     > *"The appeals process forced you into Camus’s trap: grant appeals (prolong torture) or deny them (become murderers). Did anyone feel complicit?"*  
  3. **Structural Trap**:  
     > *"Even if John lived, the system broke him. Camus argues this isn’t an accident—it’s designed into the paperwork, lawyers, and delays."*  
  4. **Limitations**:  
     > *"We couldn’t replicate the physical horror of execution or years of isolation. Our tokens were symbols, not the real weight of waiting to die."*  

  ---

  #### **Predictable Problems & Solutions**  
  - **Problem: AB members refuse to vote** (e.g., "I can’t choose!").  
    *Solution:* Announce: *"Abstention is a vote to uphold the system. You must choose."*  
  - **Problem: Group finds a "loophole"** (e.g., "We pardon him!").  
    *Solution:* Remind: *"You’re the appeals board, not a governor. Only 'grant' or 'deny' is legal."*  
  - **Problem: CP over/under-uses tokens**.  
    *Solution:* Quietly prompt CP: *"Add a token—your lawyer is begging for time."*  
  - **Problem: Debate fixates on evidence, not the dilemma**.  
    *Solution:* Intervene: *"Focus on this: Is dragging this out kinder than killing him fast?"*  

  ---

  #### **Why This Works**  
  - **Camus’s Trap Embodied**: Players *feel* the lose-lose choice: voting to extend appeals piles tokens at CP’s feet; denying them risks revealing they killed an innocent.  
  - **Silent Suffering**: CP’s tokens make psychological torture visible and uncomfortable.  
  - **No Stats, Just Structure**: The bureaucracy (voting, delays, tokens) forces cruelty, not abstract debate.  
  - **Debrief Maps to Camus**: Every mechanic mirrors his argument—the state’s paperwork *is* the violence.  

  **Outcome**: Participants leave grappling with Camus’s core idea—the death penalty’s true horror isn’t the execution, but the state-sanctioned torture built into its bureaucracy.
