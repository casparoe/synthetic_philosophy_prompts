  First, I need to recall the structures of philosophical disagreements. The user mentioned verbal, substantive, hidden-empirical, bedrock-intuitive, or structurally misaligned. I should assess which category this debate falls into. The core issue seems to be whether Schrödinger's views were a metaphysical commitment or merely poetic. The literalists take it as ontology, while deflationists see it as non-conceptual. This isn't just about definitions; both sides use "consciousness" similarly but diverge on its role in science. So, probably not verbal.

  Next, substantive or hidden? The user pointed out an unaddressed reverse combination problem: how one subject generates multiple first-person perspectives. This touches on personal identity intuitions. If literalists and deflationists have different bedrock intuitions about whether "being me" is fundamental, that's a deep divide. Also, the criteria for what's scientific might differ. Literalists might allow empirically invulnerable metaphysics, while deflationists demand empirical vulnerability. That's a hidden methodological disagreement.

  The indexical residue is crucial. Even if consciousness is one, each experience feels like "this one." Neither side addresses how Schrödinger reconciles this. If he didn't, that's a gap. Deflationists might avoid it by seeing his statements as non-philosophical, while literalists might overlook the issue. This unresolved problem could be why the debate stalls.

