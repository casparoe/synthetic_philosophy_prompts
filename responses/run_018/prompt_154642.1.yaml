  The tone must stay cheerful and helpful, like a real travel guide, while the content reveals the horror. Phrases like "delightful local traditions" for genocide protocols create irony. Specialist readers (like the professor's students) should spot the critique in the exaggerated practicality—e.g., packing a "discreet planet-cracker" as if it's normal.

  I'll invent in-universe terms: "Quietude" for the state religion, "First Silent Year" holiday, "Three-Body Greeting" for the dining ritual. This avoids real-world references. The satire lies in presenting extreme violence as sensible precaution—showing how the hypothesis collapses into madness without stating objections.

  Finally, I'll ensure it's around 700 words, structured like Lonely Planet with sections and a sidebar. The goal is for students to grasp the dark forest's implications by experiencing its warped logic firsthand, aiding their ethical discussions in the seminar.
