answer: |-
  <adjusting tweed jacket with sharp tug> *Your* counterexample proves *my* point, colleague. You're so wedded to Bratman's cognitive overhead that you've misdescribed the phenomenology entirely.  

  First: Those strangers aren't engaging in parallel reasoning. Parallel reasoning implies detached cognition—like two calculators crunching numbers independently. But watch their *bodies*: the slight lean away from the elderly passenger, the micro-shift of weight to open a path. They're not *calculating*; they're *responsive* to the same environmental pressures—the crowded platform, the need-flow, the unspoken norms of urban coexistence. This is mutual practical entanglement: their actions become complements through shared situational attunement, not internal mental representations.  

  Second: Bratman requires interlocking *intentions*—"I intend that we J" with meshing subplans. Where is that here? Neither thinks "we are creating space." Each acts *for the situation's demand*, and their movements *converge* without negotiation. If you call this "shared intention," you've diluted Bratman beyond recognition—rendering his criteria useless for distinguishing genuine collaboration from mere coincidence.  

  <slams palm lightly on the table>  
  And spare me Searle's "we-intentions" as some panacea! Searle still demands an *individual* ascription of collective agency ("I intend *as part of we*"). But on that platform? No one thinks "we." They think "*move*" or "*yield*." The jointness emerges *in the doing*, not the mind.  

  Your challenge *presupposes* that joint action must be cognitively thick. Ambient pluralism shows how thin and pervasive it really is: firefighter chains passing buckets in silence, commuters merging lanes in traffic, nurses handing instruments mid-surgery. No shared plans. No eye contact. Just skill and situation weaving plural subjects from necessity.  

  <leans forward, eyes narrowing>  
  So no—this isn't Bratman with jargon. It's the acknowledgment that collective intentionality isn't a *meeting of minds*, but a *braiding of practices*. Reduce it to individual psychology, and you'll keep tripping over subway platforms.
