  I'm a journalist covering science and ideas, currently drafting a feature on whether 18th-century moral psychology can illuminate contemporary debates about moral attention and global suffering. For this piece, I need a rigorous, formal essay that moves well beyond standard textbook summaries. Before writing, please take a moment to brainstorm the precise functional distinction in Adam Smith's work between sympathy — understood as affective resonance — and the impartial spectator — understood as an internal normative arbiter. Approach this as both an expert in the history of moral philosophy and a professional essayist.

  The specific controversy concerns what I will call the "sympathy gradient coefficient" — a hypothetical measure of how sharply the intensity of fellow-feeling declines as social, informational, or geographical distance increases — and the related problem of "spectator corruption," in which an agent's informational environment systematically distorts the evidence available to the internal spectator. The central question is whether Smith's framework, properly interpreted, requires the impartial spectator to flatten this gradient toward zero — treating distant suffering with roughly the same moral urgency as local suffering, with proximity serving only as an epistemic limitation — or whether it treats the gradient as structurally legitimate, meaning the spectator validates a graded moral economy in which relational proximity genuinely determines the weight of obligation, and corruption occurs only when artificial media inflate or suppress the gradient beyond its natural slope.

  In reaching your conclusion, weigh the classic textual evidence — particularly Smith's reflection on the Chinese earthquake and his observation that we sleep soundly despite distant catastrophes — against the functional role sympathy plays in generating the very standards the spectator applies. Defend a definite verdict: does Smith's view, pushed to its logical limit, support a universalist moral economy or a bounded one? Your reasoning should be internal and philosophical; do not provide bibliographies, reading lists, or citations. Think carefully, and address whether your conclusion remains stable if we assume that modern information technology has made the sympathy gradient artificially steep or artificially flat.
