  ## Teleosemantics, Circularity, and the Necessity of Plural Functions

  **Core Distinction & Circularity Worry:**

  *   **Producer-Based Teleosemantics:** Focuses on the mechanisms *producing* the representation (e.g., perceptual systems). The representational content is determined by what state of affairs the producer mechanism was *selected for* (had the proper function of) indicating/correlating with. (E.g., a frog's visual "bug detector" neuron has the content "fly present" because it was selected for firing in the presence of flies).
  *   **Consumer-Based Teleosemantics:** Focuses on the mechanisms *consuming* the representation (e.g., motor systems, belief-forming systems). The representational content is determined by what condition *must* obtain for the consumer mechanism's response to the representation to fulfill *its* proper function (e.g., a belief state has the content "water is here" if the consumer mechanisms using it to guide drinking behavior were selected for doing so *only* when water was present).
  *   **Central Circularity Worry:** Defining "proper function" evolutionarily relies on the notion of traits being selected *because* they performed specific effects that enhanced fitness. However, identifying *which specific effect* was selected for (i.e., the proper function) often seems to presuppose a normative standard: the trait *should* perform *that* effect. Crucially, establishing this normativity *without* already presupposing representational content (e.g., "the system *represented* that doing X would lead to fitness") is deeply problematic. If the normativity inherent in "proper function" relies implicitly on representational notions, then using proper function to *define* representational content becomes circular: content is defined via norms that themselves depend on content.

  **Argument for Plural-Function Teleosemantic Naturalism:**

  Teleosemantic naturalism aims to naturalize mental content by grounding it in the biological function of representational mechanisms, as determined by their evolutionary history. However, the standard singular-function model (where each mechanism has one, determinately fixed proper function assigned by selection history) fails definitively due to the circularity worry and underdetermination. Success requires adopting a plural-function framework.

  **1. The Failure of Singular-Function Teleosemantics:**

  Singular-function teleosemantics faces a fatal dilemma:

  *   **Horn A: Collapse into Circular Normativity:** To resolve the circularity worry and pinpoint *one* specific proper function (and thus one specific content) for a mechanism, the theorist must appeal to a privileged normative perspective *beyond* the causal selection history itself. Why is *this* effect (e.g., indicating flies, not small dark moving objects) the *real* proper function? Any justification based on "what the mechanism *should* do" or "what it was *really* selected for" risks smuggling in non-natural normative assumptions or presupposing representational content (e.g., "the mechanism *aims* at detecting flies"). This violates naturalism.
  *   **Horn B: Radical Underdetermination:** Sticking strictly to the causal facts of selection history reveals that evolution rarely selects for one maximally specific effect. Selection operates on the net fitness contribution of a trait within a complex system interacting with a variable environment. A single mechanism is often *causally involved* in producing multiple fitness-enhancing effects simultaneously or across contexts. Consider:
      *   **Multifunctional Mechanisms:** A frog's tongue-flick mechanism might have been co-opted or maintained by selection for catching flies *and* escaping predators (by rapid retraction) *and* maintaining moisture. Which effect defines its singular proper function?
      *   **Coarse-Graining Problem:** Is the producer mechanism selected for indicating *flies*, *nutritious insects*, *small dark moving objects*, or *potential food sources*? The causal history underdetermines the precise level of abstraction.
      *   **Consumer Complexity:** A single representation (e.g., a perceptual state) might be consumed by multiple downstream systems (e.g., motor planning, memory formation, emotional response), each with its own distinct proper function depending on that representation. Which consumer's needs define the *singular* content?

  Consequently, singular-function assignment either illicitly imports normativity or leaves content radically indeterminate – many different, incompatible contents seem equally compatible with the selection history.

  **2. Plural-Function Framework as the Solution:**

  The plural-function framework resolves this impasse naturally:

  *   **Core Idea:** A representational mechanism (producer or consumer) can bear *multiple* proper functions simultaneously. These functions are not fixed singularly by past selection but are *activated* or *relevant* in specific organismic or environmental *contexts*. Selection history provides a *constraining set* of *potential* functions the mechanism can perform that contributed to fitness, but does not uniquely determine a single function for all contexts.
  *   **Resolving Circularity/Underdetermination:** Normativity emerges *within* the naturalistic framework. The "should" associated with a function in a given context is not primitive but is grounded in the *dispositional profile* of the mechanism *and* the current state of the organism/environment *relative to the set* of historically fitness-contributing outcomes linked to that mechanism. For example:
      *   The frog's perceptual state might have the potential function *F1*: "Indicate small dark moving objects (flies)" *in the context* of hunger and feeding behavior. Its content in that context is determined by what *F1* requires for consumer success (catching food).
      *   The *same* state might have the potential function *F2*: "Indicate potential threats (approaching birds)" *in the context* of predator avoidance behavior. Its content in *that* context is determined by what *F2* requires for consumer success (escaping).
  *   **Naturalistic Grounding:** The set of potential functions (*{F1, F2,...Fn}*) is fixed by the causal selection history – these are the effects the mechanism was *causally responsible for* that contributed to differential reproduction. The *activation* of a specific function (*Fi*) in a context (*C*) depends on natural facts: the current internal state of the organism (e.g., hunger level, fear level), the environmental cues present, and the active downstream consumer systems. Content determination becomes contextually sensitive and dynamic, but remains anchored in natural selection. There is no need to appeal to a singular, transcendent "ought"; the normative standard for content in context *C* is set by the requirements for fulfilling the *currently relevant* potential function *Fi* from the evolutionarily constrained set.

  **3. Addressing the Relocated Indeterminacy Objection:**

  *   **Objection:** Allowing plural consumer-side functions doesn't solve indeterminacy; it merely relocates it. How do we determine *which* potential function (*Fi*) is the *relevant* one in a given context? Isn't *this* selection just as indeterminate or normatively loaded as selecting a singular historical function?
  *   **Response:** This objection misconstrues the resolution offered by pluralism. Pluralism *accepts* that selection history alone underdetermines a singular, context-independent content. Its strength lies in:
      *   **Constraining the Possibility Space:** Evolution drastically narrows down the set of *potential* functions ({F1...Fn}) a mechanism can bear. Radical indeterminacy (e.g., the frog's state meaning "rain is coming" or "the number 7") is ruled out. Only historically fitness-relevant potential functions are in play.
      *   **Context Provides Determinacy:** The relevant function *Fi* in a specific context *C* is *not* chosen arbitrarily or based on external norms. It is determined *causally* by the current coupling of the organism's internal state, the active consumer systems, and the environment. For instance:
          *   If the frog is sated, hiding, and detects a looming shadow, the internal state (e.g., elevated stress hormones, activation of escape circuits) causally biases the perceptual state towards activating its *F2* (threat indication) function. The consumer mechanisms poised for escape *require* accurate threat detection (*F2*) to fulfill *their* proper functions. The content is fixed relative to *this* causal-functional context.
          *   If the frog is hungry and actively foraging in daylight, the same perceptual state causally activates its *F1* (food indication) function relative to the active feeding consumers. The causal nexus of the organism's current state and its interaction with the environment objectively privileges one potential function over others *for the purpose of explaining current behavior and cognitive processing*.
      *   **No Need for Meta-Selection:** Identifying the relevant function *Fi* in *C* is not a matter of applying another normative rule. It's a matter of naturalistic explanation: which historically established potential function is *currently being utilized* by the system's causal organization to guide action or processing in this specific situation? The indeterminacy inherent in the *bare* selection history is resolved by the *additional natural facts* of the current context and the system's dispositional structure. The "relocated" indeterminacy is not a problem; it reflects the genuine context-dependence of content in biological systems, resolved by adding more natural facts.

  **Conclusion:**

  Teleosemantic naturalism cannot succeed under the restrictive singular-function model. Its attempts to ground determinate content lead inevitably to circularity in normativity or crippling underdetermination. The plural-function framework offers a viable naturalistic path. By recognizing that evolutionary history assigns a *set* of potential proper functions to a representational mechanism, and that the specific function (and thus content) relevant in any given context is determined by the causal interplay of the mechanism, the organism's current state, active consumers, and the environment, teleosemantics can explain mental content without smuggling in non-natural norms. It embraces the biological reality of multifunctional mechanisms and context-dependence, transforming the challenge of indeterminacy into an account of content's dynamic, situated nature. The objection that pluralism merely relocates indeterminacy fails because context provides naturalistic, causal determinants for function-activation within the evolutionarily constrained possibility space.
