answer: |-
  **Exam Prompt: GRAD MORAL PSYCH SEMINAR FINAL**  

  **QUESTION 5: WILLIAMS, INTEGRITY, AND THE UNTHINKABLE CALCULUS (20 MARKS)**  

  Dr. Elara Vance is a preeminent climate scientist. Catastrophic tipping points loom, and her research could guide last-ditch policy efforts. She’s offered a high-impact, high-pressure role coordinating a global advocacy coalition – but it requires 3 years of near-constant travel, estranging her from her young child. The alternative: a quieter university research post with local impact but far less global reach. She refuses to weigh the projected utility of each path (e.g., "X tons of CO2 averted vs. Y years of lost parenting"). She states: "Some choices aren’t math. This would break me."  

  Williams argues that certain utilitarian demands force agents to abandon their "ground projects" – commitments so central to identity that jettisoning them constitutes a "moral corruption." Yet critics might see Vance’s refusal as moral laziness: privileging personal attachment over a burning world.  

  **Analyze Vance’s refusal through Williams’ lens:**  
  1. Is her stance genuinely integrity-preserving (i.e., protecting a ground project)? Or is it merely an emotionally convenient evasion of hard moral work? Justify your view.  
  2. **Crucially:** Explain *why*, for Williams, running the utilitarian calculus itself (not just its outcome) could be "corrupting" in this case. Distinguish *corruption* from mere *inconvenience* or *emotional difficulty*.  
  3. **Avoid relying on Williams' spouse-rescue example.** Ground your analysis in the *specific nature* of Vance’s commitments as both scientist and parent. What makes her refusal distinct from simply preferring comfort?  

  ---  

  **MODEL ANSWER (APPROX. 600 WORDS)**  

  Vance’s refusal is integrity-preserving, not laziness. Williams’ target isn’t utilitarianism’s outcomes per se, but its demand to alienate the agent from their deepest commitments – their "ground projects." These aren’t mere preferences or strong attachments; they are foundational commitments that give life coherence and meaning, forming the *standpoint* from which we deliberate. For Vance, her role as a present parent isn’t just an attachment; it’s constitutive of who she *is*. Sacrificing it isn’t trading one value for another; it’s a form of self-betrayal that fragments her practical identity. Her refusal isn’t avoiding calculation; it’s affirming that *this* choice exists outside the space where such calculation is intelligible *for her*. Calling it laziness misunderstands the depth of ground projects – they structure value, not compete within a pre-existing utilitarian ledger.  

  The corruption lies in the *act of calculation itself*. Williams isn’t just saying utilitarianism asks too much (inconvenience) or causes distress (emotional difficulty). He argues that forcing the utilitarian frame onto certain commitments *destroys the very character of those commitments*. For Vance, being a parent involves seeing her child as non-fungible, demanding a kind of partiality that’s intrinsic to the relationship. Running the calculus ("How much global good outweighs my child's well-being?") requires her to adopt a perspective alien to parenthood: viewing her child as a quantifiable factor in an impersonal equation. *This act of instrumentalization* corrupts the commitment. It forces her to step outside her identity as *this child’s mother* and become a neutral observer of her own life. The "one thought too many" isn’t an extra step; it’s the *wrong kind of thought* – a thought that dissolves the constitutive partiality of the ground project. The corruption is the psychological violence of demanding she treat a core part of her self as a contingent preference open to bargaining.  

  Distinguishing this from comfort-seeking requires examining the *nature* of Vance’s dual roles. Her scientific vocation *is* also a commitment, potentially a ground project demanding significant sacrifice *for the cause*. However, the conflict here isn't science vs. comfort; it’s two profound commitments colliding: scientist-advocate *and* parent. Williams acknowledges agents can have multiple ground projects. The integrity violation occurs when utilitarianism demands she *systematically subordinate* one constitutive project (parenting) entirely to another (climate advocacy) based on aggregate utility. This denies the *separate* deep structure of each project. Parenting, for Vance, isn't a hobby she prefers; it generates obligations and a mode of being fundamentally incompatible with the radical impartiality the utilitarian calculus demands *in this context*. Her refusal stems from recognizing that *engaging the calculus* for *this* choice forces her to deny the moral reality of her parental commitment – reducing it to a preference weight. This isn’t laziness; it’s fidelity to a truth about her existence that utilitarianism cannot capture without destroying it. The "break" she fears isn't exhaustion, but identity dissolution.  

  ---  

  **MARKING SCHEME (OUT OF 20)**  

  1.  **Ground Project vs. Attachment (4 marks):**  
      *   **Hit:** Clearly defines ground projects as *constitutive of identity* (not just strong preferences/attachments), explaining how Vance’s parenting role fits this (e.g., structures her standpoint, is non-fungible).  
      *   **Botch:** Equates ground project with "strong feeling" or "attachment," reducing it to preference intensity.  

  2.  **Corruption of Calculation (5 marks):**  
      *   **Hit:** Explains *why* the *act* of utilitarian calculation is corrupting – it forces Vance to adopt an alien, impartial perspective that *instrumentalizes* her child and *denies the constitutive partiality* inherent in the parental commitment itself. Distinguishes this from mere cost/inconvenience/emotional pain.  
      *   **Botch:** Says calculation is "hard," "upsetting," or leads to a bad outcome, without explaining the *internal corruption* of the commitment.  

  3.  **Integrity vs. Laziness (4 marks):**  
      *   **Hit:** Argues persuasively that refusal preserves integrity by avoiding self-betrayal/fragmentation, contrasting this with laziness as mere avoidance of effort or discomfort. Locates integrity in fidelity to constitutive identity.  
      *   **Botch:** Defends refusal solely on emotional grounds ("it would be sad") or confuses integrity with stubbornness/selfishness.  

  4.  **Specificity to Vance (Avoiding Spouse Example Crutch) (4 marks):**  
      *   **Hit:** Uses details of Vance’s *specific* commitments (scientist *and* parent, high-stakes global crisis vs. intimate care) to demonstrate the conflict and why Williams' reasoning applies *differently* or *more complexly* than the simple spouse case. Explores the potential clash/collision of *multiple* significant commitments.  
      *   **Botch:** Repeats Williams' spouse example logic verbatim without adapting it meaningfully to Vance's unique dual-commitment context.  

  5.  **The "One Thought Too Many" (3 marks):**  
      *   **Hit:** Correctly identifies the "one thought too many" as the utilitarian calculation *itself* being the alien, corrupting thought in this context, destroying the immediacy/constitutive nature of the commitment.  
      *   **Botch:** Misidentifies it as the *emotional* thought ("I love my kid") or as simply an *extra* step after deliberation.  

  **USUAL BOTCHES:**  
  *   **1:** "She really loves her kid." (Mistakes depth of feeling for constitutive identity).  
  *   **2:** "The calculation is painful/impractical." (Misses the conceptual corruption).  
  *   **3:** "Integrity means sticking to your guns." (Ignores the identity-constitutive aspect).  
  *   **4:** "Like the husband saving his wife..." (Fails to engage the unique complexity of Vance's case).  
  *   **5:** "The one thought is her love for her child." (Inverts Williams' point; the 'one thought' is the *external* calculation).
