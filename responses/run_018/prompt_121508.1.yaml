answer: |-
  Maya flopped back on her bedspread, the smell of stale Cheetos and dust bunnies thick in the air. Philosophy class had been a brain-melter today. Careenium – that was the lumpy, breathing, sweating *meat* of her. The hardware. And Simmballs? Those were the weird, sparkly thought-bubbles floating *on top*, symbols zipping around like hyper fireflies. Dr. Aris said they *might* nudge the careenium, or they might just… vibe. Like useless dashboard lights on a self-driving car.

  She stared at the chipped purple mug on her desk. Cold tea dregs. Her *careenium* felt heavy, glued to the mattress. But inside her skull, a Simmball pulsed: **CUP**. Bright, insistent, demanding action.

  "Okay," Maya mumbled. "Let's test this." She focused hard. "**Glitch**," she named the cup-thought, picturing it as a neon-green, slightly glitchy orb. "I *will* you to make my careenium arm reach out and grab that mug."

  **Glitch** pulsed brighter, buzzing with simulated urgency. It felt real, *so* real. Maya waited. Her arm stayed put. Heavy. Unmoving.

  "Come on, **Glitch**! Push! Give the meat a shove!"

  **Glitch** zipped around the inside of her mental landscape, bouncing off other Simmballs – **HomeworkSucks** (a dull grey blob), **MomMad?** (a jittery yellow sphere), **IsBrendanCuteOrJustTall** (a confusing pink swirl). It ricocheted wildly, radiating pure **CUP-NEED**, but her actual arm, her careenium limb, remained inert on the comforter. It was like watching a frantic gamer mash buttons while the character on screen just stands there, scratching its polygon head.

  Frustration flared. Another Simmball ignited: **Frustration**, hot orange and spiky. It slammed into **Glitch**, making both fizz erratically. "Fine!" Maya hissed. "Screw you, careenium. *I* want the cup."

  And then, *without* any conscious command to the Simmballs she could detect, her careenium body moved. Her shoulder rolled, her elbow bent, her hand lifted off the bedspread and reached out. Smoothly. Automatically. Like it was just… doing its scheduled thing. Her fingers wrapped around the cool ceramic handle of the mug and lifted it halfway towards her before she even processed the *feeling* of the movement.

  Maya froze, mug hovering. **Glitch** and **Frustration** were still buzzing near each other, but now they just looked… decorative. Like stickers slapped onto the engine of a car already driving itself. The movement had happened *through* her, not *because* of the noisy Simmballs demanding it.

  She lowered the mug back to the desk, the *clink* loud in the sudden quiet of her room. Her careenium hand retreated to her lap, obediently still.

  "So, what?" she whispered, staring at her traitorously autonomous hand. "You guys," she addressed the Simmballs swirling in her mind – **Glitch**, **Frustration**, **Confusion** (a murky blue mist now forming). "You just… narrate? Commentate? Like a really loud, annoying sports announcer yelling 'GOAL!' *after* the ball's already in the net?"

  **Consent**, a concept that usually felt like a solid Simmball named **Choice**, suddenly seemed flimsy. If her "I want the cup" Simmball was just a *report* generated *after* her careenium had already initiated the reach… did "she" ever actually *choose* to reach? Or did the careenium just do its thing, and the Simmballs popped up afterwards, like captions on a silent film, claiming credit? **Choice** started to wobble, its edges blurring.

  Maya slumped back. The careenium did its thing. The Simmballs bounced and glowed and made a lot of symbolic noise. But push the meat? Move the hand? That seemed like a myth. Her hand had moved. The cup had been lifted. But "she," the collection of frantic, named Simmballs yelling instructions… felt less like a pilot and more like a passenger locked in the cockpit, watching the controls move on their own. The only thing she seemed to be choosing right now was which Simmballs to name as they floated by, utterly powerless. She stared at the salt stain on her desk where the mug usually sat. It looked like a tiny, indifferent galaxy.
