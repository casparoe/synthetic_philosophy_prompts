answer: |-
  Below are the desiderata for a theory of mindedness in composed systems, structured to force a principled resolution of the ant colony problem. Each item is categorized as a **hard requirement** (non-negotiable for adequacy) or a **preference** (contentious but not universally mandated). The theory must satisfy all hard requirements to avoid bias, special pleading, or empirical incoherence.

  ---

  ### **Desiderata for a Theory of Mindedness**  
  *(Purpose: Decide "Does an ant colony have a mind?" without gerrymandering)*  

  1. **Literal-Metaphorical Demarcation**  
     - **Requirement**: Must specify *objective conditions* under which attributions (e.g., "the colony decides") are literal, not metaphorical convenience.  
     - **Avoid**: Setting the bar so low that stock markets qualify (*overinclusion*) or so high that only brains/near-human systems qualify (*underinclusion*).  
     - **Status**: **Hard requirement**. Failure collapses the question into semantic relativism.  

  2. **Subjecthood Without Central Locus**  
     - **Requirement**: If consciousness is necessary for mindhood, the theory must explain how subjective experience (*what-it’s-like-ness*) emerges without a central physical seat (e.g., no "ant CPU"). If consciousness is unnecessary, it must clarify whether the system has *non-phenomenal cognition* (e.g., problem-solving without inner life) and avoid equivocating between these.  
     - **Status**: **Hard requirement**. The absence of a central locus is an empirical fact for colonies; theories must confront it.  

  3. **Non-Arbitrary Boundaries & Continuity**  
     - **Requirement**: Must resolve:  
       - *Boundaries*: What defines the "candidate system" at a time (e.g., why not include prey insects in the colony’s "mind"?).  
       - *Continuity*: How gradual growth/reorganization (e.g., colony expansion, brain plasticity) affects mindedness.  
       - Must specify if mindedness is a *threshold* (name the discrete property crossed) or a *gradient* (define when attribution becomes literal).  
     - **Status**: **Hard requirement**. Arbitrary thresholds or evasion legitimizes bias.  

  4. **Empirical Compatibility with Distributed Computation**  
     - **Requirement**: Must account for stigmergy (environment-mediated coordination, e.g., pheromone trails) and local interactions that produce colony-level behavior *without* centralized representation. The theory must either:  
       - Explain how cognition emerges from such dynamics, or  
       - Justify why stigmergic integration is "the wrong kind" for mindhood.  
     - **Status**: **Hard requirement**. Contradicting known biology voids the theory.  

  5. **Parity Enforcement**  
     - **Requirement**: Must apply criteria uniformly to all systems:  
       - If colonies qualify, so must other parity cases (slime molds, corporations, bee swarms).  
       - If brains qualify, colonies must not be excluded via covert biological chauvinism.  
       - Must address hard cases (e.g., split-brain patients: one mind or two?).  
     - **Status**: **Hard requirement**. Asymmetric treatment is special pleading.  

  6. **Consciousness-Cognition Distinction**  
     - **Requirement**: Must explicitly state whether "mind" entails consciousness or if functional cognition suffices. No equivocation (e.g., "weak" vs. "strong" emergence without clear criteria).  
     - **Status**: **Preference** (but failing this invites motte-and-bailey retreats).  

  7. **Unity of the Subject**  
     - **Requirement**: If a unified subject is necessary, the theory must define "unity" for distributed systems (e.g., information integration, goal coherence). If not, it must explain how disunity (e.g., internal conflict) is compatible with mindhood.  
     - **Status**: **Preference** (central to subject-first theories but contested by functionalists).  

  ---

  ### **Tension Analysis: The Impossible Triad**  
  The constraints **Non-Arbitrary Boundaries**, **Literal-Metaphorical Demarcation**, and **Continuity** are jointly unsatisfiable without compromise:  
  - **Conflict**: Continuous growth implies no bright-line threshold, yet literal attribution demands a non-arbitrary cutoff. Gradience resolves continuity but collapses literal/metaphorical distinctions ("somewhat minded" is still metaphorical).  
  - **Resolution**: One constraint must yield:  
    - **Option 1**: Reject non-arbitrary boundaries (accept graded minds → the question is ill-posed as yes/no).  
    - **Option 2**: Reject continuity (assert a threshold property, e.g., critical information integration capacity).  
    - **Option 3**: Reject sharp literal/metaphorical demarcation (embrace context-dependent ascription).  
    - **Conclusion**: The demand for a yes/no answer *is* misplaced; a graded or pluralistic framework better fits reality.  

  ---

  ### **Scorecard: Most Damaging Requirement Against Candidate Theories**  
  **No Equivocation on Consciousness (Desideratum 2)** does the most work in eliminating contenders:  
  - **Integrationism (e.g., IIT)**: Fails unless it quantifies how stigmergy achieves *phenomenal* unity (unlikely without neural analogs).  
  - **Functionalism**: Must clarify if colonies have non-conscious cognition. If yes, risks overincluding stock markets; if no, must explain why neuron interactions suffice but ant interactions don’t.  
  - **Subject-Primacy Views**: Demands an account of decentralized subjectivity (e.g., swarm-level qualia), which few theories even attempt.  
  - **Deflationism**: Forced to deny brain-level minds (since colonies and brains are parity cases) or admit bias.  

  **Result**: Theories that avoid Desideratum 2 (e.g., "cognition-only" functionalism) survive longer but clash with Desideratum 1 (literal attribution) and Desideratum 5 (parity with corporations).  

  ---

  ### **Conclusion**  
  A theory satisfying all hard requirements *must* either:  
  1. **Accept colony minds** (and extend to other distributed systems),  
  2. **Deny brain minds** (embracing eliminativism or radical revision), or  
  3. **Replace yes/no with a graded spectrum** (e.g., "mindedness as a matter of degree").  
  The desiderata expose that **continuity + non-arbitrariness + literalism** cannot all hold, forcing a concession. The ant colony’s fate hinges on whether we prioritize biological continuity (favoring gradualism) or subjective intuition (favoring thresholds). No theory escapes unscathed.
