  hey so im in this philosophy of language course and we just finished the kripkenstein unit. my professor brought up this weird idea that the skeptical solution might actually be a kind of pragmatic conventionalism in disguise if you really press on the assertability conditions, but i didnt totally follow. anyway i want your actual credence - like a real number between 0 and 1 - that kripkensteins skeptical argument succeeds in showing there is literally no fact of the matter about meaning, not just epistemic uncertainty. please decompose it: first, the probablity that finite past use genuinely underdetermines the rule in the strong way kripke needs; second, the probability that the skeptical solution is coherent and doesnt just change the subject; third, the probability that a modified dispositionalist account using idealized dispositions under counterfactual optimal conditions can rescue semantic realism without circularity; and fourth, maybe weigh in on whether the whole framing about going on in the same way is itself a misleading intuition pump about normativity that stacks the deck. write it all as continuous prose, no headings or bullet points or bold, just like a letter. tell me which component youre least confident in and what evidence or argument would move your overall number the most. i dont need citations just your reasoning.
