answer: |-
  Here’s an analysis tailored for your lawyer’s argument, focusing on Lemkin's broader definition and the "speech act" nature of naming genocide:

  ### Applying Lemkin's Broader Framework to Rwanda
  Lemkin envisioned genocide as the **"destruction of the essential foundations of life"** of a group, encompassing:
  1.  **Physical/Biological:** Mass murder (clearly present).
  2.  **Cultural:** Destruction of symbols, institutions, knowledge systems.
  3.  **Moral:** Shattering communal bonds, trust, shared values, and the group's "spirit."

  **In Rwanda, the cultural/moral destruction wasn't just collateral – it was core strategy:**
  *   **Targeting Identity:** Burning Tutsi identity cards wasn't just administrative; it was an attempt to erase their *official existence* as a group within the state's own records – a direct assault on their documented identity.
  *   **Desecration of Sacred Spaces:** Massacres in churches weren't just logistical conveniences. They weaponized places of sanctuary and community, destroying both physical refuge and the *moral order* that promised safety in holy spaces. It shattered communal trust in institutions.
  *   **Destruction of Social Fabric:** Systematic neighbor-turned-killer violence, coerced participation, and the breakdown of Hutu/Tutsi intermarriage/commerce weren't just byproducts. This *deliberately annihilated the complex web of social relations* ("moral bonds") that held communities together across ethnic lines, making future coexistence unimaginable.
  *   **Language & Dehumanization:** Relentless propaganda ("cockroaches," "snakes") wasn't just incitement; it was a sustained assault on the *moral standing and humanity* of Tutsi as a group, making their physical destruction psychologically permissible.

  **Lemkin's Lens:** This cultural/moral annihilation was integral to the genocide's goal – not just killing Tutsi individuals, but *erasing Tutsi identity and presence* from Rwandan society, past, present, and future. The UN definition, by focusing solely on killing/causing harm, missed this *comprehensive project of group destruction*.

  ### The Politics of Naming as a Speech Act
  Your lawyer's core point: **Declaring "genocide" isn't just labeling – it's a performative act triggering legal obligations (prevention, punishment).** Avoiding the word wasn't semantic pedantry; it was **strategic evasion of duty.**

  1.  **How Lemkin's Theory Explains the Hesitation:**
      *   **The Narrow Box as an Alibi:** The US/UN fixation on the UN Convention's narrow definition (requiring *specific intent* to destroy a group *in whole or in part*) provided a bureaucratic shield. They could argue (however disingenuously): "We see mass killing, but is the *specific intent* solely group destruction? Is it *organized* enough? Does it target *the whole group*?" Focusing narrowly on the physical act allowed them to ignore the overwhelming evidence of systematic cultural/moral destruction *which, under Lemkin, is genocide itself.* The hesitation stemmed partly from hiding behind the legalistic confines of the definition they helped create.
      *   **The Obligation Trigger:** The primary reason for avoidance was the **fear of the speech act's consequence.** Saying "genocide" would legally compel signatory states (especially powerful Security Council members) to "prevent and punish." This meant potential military intervention (costly, risky, unpopular post-Somalia) and complex legal/political fallout. The word wasn't avoided because the situation didn't fit *any* definition; it was avoided *because* applying *any* recognized definition (even the narrow one) would force action they desperately wanted to shirk. Lemkin's broader definition, if accepted, would have made the genocide *even harder to deny*, tightening the obligation trigger further.

  2.  **Where Lemkin's Theory Misses / What It Doesn't Fully Capture:**
      *   **Bureaucratic Self-Preservation:** Lemkin focused on the *crime* and the *legal framework*. He didn't fully account for the sheer, cynical inertia of bureaucracies protecting their own interests: avoiding blame, preserving budgets, maintaining "neutrality" for access, or simply not wanting to "rock the boat" within the UN system or inter-agency politics (State Dept. vs. Pentagon, UN Secretariat vs. Security Council). The *willful blindness* wasn't just about the definition; it was about careerism and institutional cowardice.
      *   **Realpolitik Over Morality/Law:** Lemkin believed in the power of law. The Rwandan episode highlights that law is only as strong as the political will enforcing it. The US/UN avoidance was driven by raw geopolitical calculation: **No vital interests, no oil, no strategic allies threatened.** Saving lives wasn't a sufficient motivator. The "obligation" triggered by the speech act was seen as an inconvenient *cost* to be avoided, not a moral imperative. Lemkin's framework assumes actors will feel bound by the law; it underestimates their capacity for calculated, self-interested evasion when enforcement mechanisms are weak and political will is absent.
      *   **The "Non-Genocide" Narrative as Enabler:** By refusing the label, the US/UN created a self-serving narrative of "chaos" or "civil war," which *actively hindered* the moral and political pressure for intervention. Avoiding the word wasn't neutral; it *shaped the international response* towards inaction.

  ### What Rwanda Says About Lemkin's Framework
  1.  **The Delay Proves the Need for the Broader Definition:** The narrow UN definition *facilitated* evasion. Focusing solely on the physical killing allowed bureaucrats to parse "intent" while ignoring the blatant cultural/moral destruction screaming "genocide" under Lemkin's original vision. A broader definition encompassing cultural annihilation would have made the genocide *more undeniable* earlier on. The destruction of churches, identity, and social fabric *was* the genocide unfolding, not just context. Recognizing this would have strengthened the case for immediate action under the *spirit* of prevention.
  2.  **But the Belated Naming Shows the Narrow Definition Was *Legally* Enough... and Utterly Insufficient:** Eventually, the sheer scale of killing *forced* the use of the term "genocide" under the narrow definition. **Crucially, this belated naming triggered NO meaningful action.** The speech act lost its power because the political will to act had evaporated, and the worst was over. This proves the problem wasn't *primarily* the definition's narrowness. **The core failure was the lack of political will and enforcement mechanisms.** A broader definition wouldn't have magically created that will if the powers were determined to look away. The narrow definition *was* technically sufficient to describe the horror *if applied honestly and promptly*. Its failure was in being used as a shield *by those who controlled its application*.

  **Conclusion for Your Lawyer's Argument:** Rwanda wasn't just a failure to *see* genocide; it was a deliberate refusal to *name* it to evade legal and moral responsibility. Lemkin's broader vision illuminates the *full horror* of the cultural/moral destruction that the UN definition ignored – destruction that was central to the genocidal project. This broader lens makes the international community's denial even more grotesque. However, the eventual, empty use of the "genocide" label reveals the deeper truth: **No definition, no matter how perfect, compels action without political courage and enforceable mechanisms.** The US/UN hid behind the narrow definition's technicalities, but their fundamental sin was a lack of will, enabled by a legal framework easily perverted by those meant to uphold it. Lemkin's tragedy is that he crafted a concept powerful enough to name the crime, but not powerful enough, on its own, to force the world to stop it. The word only has force if those who speak it mean it.
