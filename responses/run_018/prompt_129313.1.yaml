  ## Sestina for the Unraveling Rope

  The sergeant's crisp command, a sharp **ordering**,
  dissolves to whispered plea, a fervent **praying**
  for grace unseen. The monk, while **praying**,
  adjusts the sacred cloth with careful **measuring**.
  The tailor's tape, precise in **measuring**,
  snaps back, released with muttered **cursing**.
  Stung by the word, sharp **cursing**,
  she tries distraction, idle **guessing**
  at cloud-shapes overhead. Such **guessing**
  yields nothing fixed, unlike the **naming**
  of stars. Astronomers, their **naming**
  complete, turn back to urgent **ordering**.

  A child resists parental **ordering**,
  prefers the reckless joy of **guessing**
  riddles in the dark. That **guessing**
  feels like faith, though less than **praying**.
  She seeks a sign beyond mere **praying**,
  scales the cliff with rough **measuring**
  by eye and nerve. Her **measuring**
  invokes the builder's ancient **cursing**
  at slipped stones. Old **cursing**
  echoes, loses sense in **naming**
  modern hurts. This constant **naming**
  demands precision, constant **ordering**.

  The archive thrives on strict **ordering**,
  files labelled with exact **naming**.
  Yet labels fade, mere **naming**
  cannot capture years of **praying**
  in chapel pews. That **praying**
  mixed with doubt, a silent **guessing**
  at the void. Such **guessing**
  needs no tools, no **measuring**
  tape's false claim. True **measuring**
  fails the heart's fierce **cursing**
  loss. Grief's raw **cursing**
  defies the priest's soft **ordering**.

  He tries again with gentle **ordering**,
  ignores the widow's sharp **cursing**.
  Her bitter, broken **cursing**
  holds more weight than his **guessing**
  at God's will. That **guessing**
  seems a pale form of **praying**.
  Is doubt itself a **praying**?
  Or just the mind's own **measuring**
  of absence? Cold **measuring**
  applies to land, not **naming**
  love. The act of **naming**
  binds, yet resists mere **ordering**.

  The poet strains at language **ordering**,
  seeks the perfect word for **naming**
  dawn. Is this precise **naming**
  akin to science's **measuring**?
  Or closer to wild **guessing**?
  It feels like focused **praying**
  for the right sound. Such **praying**
  might draw a startled **cursing**
  from the muse. That **cursing**
  breaks the block, allows **guessing**
  new paths. Relieved **guessing**
  replaces strict **ordering**.

  We build with **measuring**, **naming**, **ordering**,
  Release through **cursing**, **guessing**, **praying**.
  No single strand holds **ordering**, **praying**, **measuring**, **cursing**, **guessing**, **naming**.

