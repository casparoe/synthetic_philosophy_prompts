  I need to build this argument using Strawson's own concepts without requiring any bibliography or page references. The user specifically mentions that their tutor thinks they're overcomplicating things, but they believe there's something substantive here. This suggests I should validate their intuition while constructing a rigorous philosophical argument.

  Let me recall Strawson's framework. Reactive attitudes (like resentment or gratitude) involve holding individuals morally responsible, treating them as participants in moral relationships. Objective attitudes (like clinical detachment) involve viewing others as objects to be managed rather than engaged with morally.

  The user's core insight is that when people blame systems (like unfair algorithms or institutions), they're not adopting either of Strawson's attitudes. They're not targeting an individual (so not reactive in Strawson's sense), but they're also not detached (so not objective). There's genuine moral outrage directed at structures rather than persons.

  For the credit-scoring example: When someone is denied a loan unfairly by an algorithm, they might feel resentment, but it's not directed at a specific programmer or executive. Yet this resentment isn't clinical or detached—it demands moral recognition of harm. This seems like participation in a moral relationship with the system itself.

  I'll develop the concept of "structural reactive attitudes" as a third category. These would involve holding structures morally accountable while maintaining participatory engagement. They differ from Strawson's reactive attitudes by targeting non-individual entities, and from objective attitudes by preserving moral engagement rather than detachment.

  To strengthen this, I should show how Strawson's own concepts lead to this gap. Strawson assumes moral responsibility requires individual agency, but collective harm challenges that assumption. Our moral psychology clearly responds to structural injustice with what looks and feels like reactive attitudes—just diffused across systems.

  I should acknowledge where this might be weakest: Strawson might argue that structural resentment is just misdirected individual resentment (e.g., toward designers or executives). But I can counter that this misses how we intuitively blame the system itself—the resentment persists even when we know no single person intended harm. Also, Strawson's framework struggles with distributed responsibility.

  The user wants me to "make the case" for the third category, so I'll structure it as: (1) expose the gap in Strawson's binary using the credit-scoring example, (2) define structural reactive attitudes using his participatory language, (3) show why collapsing to individual agents fails, and (4) address potential counterarguments.

  I'll keep the tone engaged—this user is philosophically savvy and wants their intuition taken seriously. No jargon without explanation, but no dumbing down either. I'll end by validating that their tutor's "overcomplicating" critique might miss how moral experience actually works in structural cases.
answer: |-
  Here’s the argument for a third category of "structural reactive attitudes," grounded in Strawson’s own framework and addressing the gap in his binary:

  ### 1. **Strawson’s Binary & Its Limits**  
  Strawson’s reactive attitudes (e.g., resentment, indignation) are participatory: they treat others as moral agents in a shared social-moral community, implying accountability. Objective attitudes (e.g., clinical detachment) suspend this participation, treating entities as objects to be managed or fixed, not blamed. This binary assumes moral responsibility requires an individual agent capable of intentions/attitudes.  

  But consider **algorithmic harm** (e.g., a biased credit-scoring system denying loans). Here:  
  - We experience **resentment** (not detachment) toward the *system*.  
  - Yet there’s **no individual target**: responsibility is diffuse (designers? data? corporate incentives?).  
  - Our attitude isn’t "objective": we demand *moral correction* (e.g., "This is unjust!"), not just technical tweaks. We seek recognition of wrongness, not causal adjustment.  

  Strawson’s framework forces a false choice: either reduce resentment to individual designers (reactive) or treat the system as a malfunctioning machine (objective). Both distort the phenomenon.  

  ---

  ### 2. **The Collapse of the Binary in Collective Harm**  
  In collective/structural cases, reactive and objective attitudes bleed into each other:  
  - **Participatory Engagement Without an Agent**:  
    We relate to the *structure* as a *moral wrongdoer*, not a neutral object. We feel indignation at "the system," participate in protests, or demand institutional repentance. This mirrors reactive attitudes’ participatory core—but without a "will" to hold responsible.  
  - **Non-Objective Detachment**:  
    Unlike Strawson’s objective stance (e.g., viewing a psychopath as sick), we don’t suspend moral demands. We insist the structure *ought* to be fair, implying a moral failure. Clinical analysis alone feels inadequate; we crave moral condemnation.  

  **Example**: Resentment toward an unfair loan algorithm isn’t detached (objective), yet it can’t be mapped onto resentment toward individuals (reactive). The system itself is the locus of blame.  

  ---

  ### 3. **The Case for "Structural Reactive Attitudes"**  
  This hybrid category captures attitudes that:  
  - **Retain Participatory Engagement**: They express moral demands (e.g., "This institution owes reparations!") and affirm our standing as moral subjects wronged by collective entities.  
  - **Target Non-Agential Structures**: They respond to harm caused by systems, algorithms, or institutions, where responsibility is emergent, not individual.  
  - **Generate Distinct Practices**: They justify collective accountability measures (e.g., institutional reform, algorithmic audits) that aren’t punitive (like individual blame) nor purely technical (like fixing a broken tool).  

  **Why Strawson Misses This**: He ties reactive attitudes to interpersonal expectations ("demands for goodwill"). But moral psychology evolves: we now hold *structures* to expectations of fairness, transparency, or justice. Our resentment at algorithmic bias is a demand for the system to "show good faith"—even if it lacks a mind.  

  ---

  ### 4. **Weaknesses & Counterarguments**  
  - **Strawson’s Retort**: "Structural" resentment might just be *confused* reactive attitudes. E.g., anger at a CEO or programmer. But this ignores cases where resentment persists *despite* knowing no ill intent (e.g., "The system is rigged, even if no one meant harm").  
  - **Overextension Risk**: Does this category "water down" responsibility? Not if we specify it applies *only* when harm arises from *enduring structures* (not ad-hoc groups) with normative expectations (e.g., banks *should* be fair).  
  - **Agency Dilemma**: Can structures truly "violate expectations" without consciousness? Arguably, yes—social practices embed norms into systems (e.g., "This algorithm *betrays* its purpose").  

  ---

  ### Conclusion  
  Strawson’s binary collapses when harm emerges from complex systems: we *participate morally* with structures, demanding accountability without individuating blame. "Structural reactive attitudes" name this pervasive experience—anger at faceless institutions, moral outrage at biased algorithms—that’s neither interpersonal nor clinical. Your intuition is sound: moral life exceeds individual agents, and Strawson’s framework needs this third category to capture how we actually hold the modern world responsible. Don’t let your tutor’s "overcomplicating" charge deter you—this is where moral philosophy *must* engage with collective agency.
