prompt: |-
  ok so i'm reading darwin's descent of man for a philosophy of bio class and i keep noticing this pattern that feels like it should have a name but i dont know it. darwin explains religious belief by saying our brains evolved agent-detection and causal reasoning, so belief in god is basically a spandrel - the evolutionary origin is supposed to undercut the belief. but then with morality he says the moral sense also evolved out of social instincts, yet he doesnt treat that origin as undermining morality at all. in fact he uses moral standards - sympathy should expand, cruelty is wrong - to judge evolutionary outcomes, almost like morality stands outside the evolutionary story and grades it. so he's doing evolutionary debunking on religion but shielding morality, even though both have basically the same kind of evolutionary explanation.

  is there a specific term for this asymmetrical move, where you cite evolutionary origins to dismiss one domain but protect another domain with identical origins? i know it's not just the genetic fallacy, and it's not exactly special pleading because there might be a principled reason origins affect belief differently in different domains. but i want to know if philosophers of science or metaethics have named this specific pattern, and if not, how you'd draw its edges - like is it always inconsistent, or can there be real distinctions between how origins bear on descriptive vs normative claims? i really just want the carving, not just a bare label: what the phenomenon is, what it isn't, and where it stops being the same thing.
reasoning: |-
  Okay, the user is reading Darwin's "Descent of Man" and noticed an asymmetry in how Darwin treats religious belief versus morality. Darwin uses evolutionary origins to debunk religious belief but doesn't apply the same reasoning to morality. The user wants to know if there's a specific term for this move and how philosophers analyze it.

  First, I need to recall the key concepts here. Darwin explains religious belief as a byproduct (spandrel) of agent-detection and causal reasoning. This evolutionary origin undermines the truth of religious beliefs. However, for morality, even though he traces it to social instincts, he doesn't see it as undermined. Instead, he uses moral standards to judge evolutionary outcomes. 

  The user mentions terms like genetic fallacy and special pleading but feels they don't fully capture the issue. They want to know if there's a named phenomenon in philosophy of science or metaethics. If not, they want a clear explanation of the boundaries.

  I remember that in metaethics, evolutionary debunking arguments (EDAs) are common. EDAs argue that if a belief has evolutionary origins not tracking truth, it's unjustified. But why apply this to religion and not morality? Darwin might see morality as adaptive in a way that tracks moral facts, whereas religious beliefs are misfirings. 

  The asymmetry could be due to different domains: descriptive vs. normative. Religious beliefs make truth claims about the world (e.g., gods exist), which evolution doesn't support. Morality, however, isn't about descriptive truths but normative ones. Even if evolved, moral instincts could be reliable if they track truths about well-being or social cooperation. 

  Philosophers like Sharon Street and Richard Joyce discuss EDAs for morality. Street's "Darwinian Dilemma" questions if moral realism can survive evolutionary explanations. Joyce argues that even if morality is adaptive, it doesn't track moral truths. But Darwin himself might have been a moral realist, believing evolved morality aligns with objective standards. 

  The user might be interested in whether this asymmetry is justified. Distinctions could include the tracking truth element: if evolved mechanisms track truth in one domain but not another. For morality, if it's tied to social cooperation, it might have a feedback loop ensuring reliability, unlike supernatural beliefs. 

  Also, the moral projectivist view: morality isn't about facts but attitudes. So origins don't debunk it because it's not truth-apt. Darwin using morality to judge evolution suggests he sees it as evaluative, not descriptive. 

  The user might need clarification on why the same evolutionary approach isn't applied consistently. They might be looking for validation that the asymmetry is a recognized issue in philosophy and how different theories handle it. Terms like "selective skepticism" or "asymmetric application of EDAs" could describe the move. But there's no single term, so explaining the underlying principles is key.
answer: |-
  That's an incredibly sharp observation about Darwin's argumentative asymmetry in *The Descent of Man*. Philosophers have indeed grappled intensely with this pattern, especially concerning Evolutionary Debunking Arguments (EDAs). While there isn't a single, universally agreed-upon *term* for this specific Darwinian move, the phenomenon is well-recognized and analyzed under several related concepts. Here's a breakdown:

  1.  **The Core Phenomenon:**
      *   **Asymmetric Application of Evolutionary Debunking Arguments (EDAs):** This is the most precise description. An EDA argues that if a belief (e.g., "God exists," "Torturing innocents is wrong") arose through evolutionary processes *not* primarily geared towards tracking truth in that specific domain, then that belief is epistemically unjustified or suspect.
      *   **Darwin's Asymmetry:** He applies a *successful* EDA to religious belief (its origin undermines its justification/truth) but *shields* moral belief from a seemingly parallel EDA (its origin *does not* undermine its justification/authority). Instead, he uses morality as an external standard.

  2.  **Why it's Not *Just* Genetic Fallacy or Special Pleading:**
      *   **Genetic Fallacy:** Rejecting a belief *solely* because of its origin. You're right, it's more nuanced. The EDA *uses* the origin to raise an epistemic challenge about *how* the belief-forming mechanism connects to truth. The potential fallacy lies in applying this challenge inconsistently without a good reason.
      *   **Special Pleading:** Making an exception without justification. The key philosophical debate *is* whether there *is* a principled justification for treating morality differently. Darwin *implicitly* assumes such a justification exists (e.g., morality tracks objective facts about flourishing/suffering in a way religious supernatural claims might not). Whether this justification *succeeds* is the crux of the metaethical debate.

  3.  **Key Philosophical Frameworks & Terms for Understanding the Asymmetry:**

      *   **Tracking Truth vs. Adaptive Advantage (Sharon Street's "Darwinian Dilemma"):** This is central.
          *   For **Religion:** Darwin argues the mechanisms (hyperactive agency detection, causal reasoning misfiring) evolved for survival advantages (avoid predators, understand physical causation), but they generate *false positives* (belief in gods/spirits) that don't track *truth* about supernatural agents. Origin undermines truth-tracking.
          *   For **Morality:** Darwin likely assumes the mechanisms (social instincts, sympathy) evolved *because* they track something *real* and *adaptive* – namely, the requirements for successful social living and cooperation within a species like ours. The moral sense isn't *just* a spandrel; it's an adaptation that (he believes) reliably connects us to genuine normative facts about well-being, harm, and social cohesion. Origin *confirms* or is consistent with truth-tracking. He then uses *this* moral framework (which he sees as justified/reliable) to evaluate evolutionary *outcomes* (e.g., condemning cruelty even if it might confer some advantage).
      *   **Moral Realism vs. Projectivism/Subjectivism:**
          *   **Realism:** If Darwin was a **moral realist** (believing moral facts exist independently of human minds/evolution), he *needs* an explanation for why evolution didn't lead us astray morally. His implicit argument is that moral facts *are* facts about social survival and flourishing, precisely what our social instincts were selected to track. Hence, origin doesn't debunk.
          *   **Projectivism/Subjectivism:** If morality is *not* about tracking mind-independent facts but is a projection of our evolved sentiments/attitudes, then its origin *wouldn't* debunk it in the same *truth-related* way, because it wasn't *supposed* to track truth in that sense. However, Darwin *using* morality to *judge* evolution strongly suggests he wasn't a subjectivist; he treats morality as having normative authority *over* the evolutionary process.
      *   **Distinguishing Descriptive Origins from Normative Authority:** This is the heart of Darwin's move and where philosophers draw the line.
          *   **Descriptive Claim (Origin):** "Belief X (God/morality) arose via evolutionary mechanism Y." (Darwin offers this for both).
          *   **Normative Claim (Justification/Authority):** "Belief X is justified/true/has normative authority." OR "Value Z is objectively binding."
          *   Darwin argues: For religion, the descriptive origin *undercuts* the normative claim (justification/truth). For morality, the descriptive origin *is compatible with or even supports* the normative claim (authority/justification) because, in his view, the origin *reliably produces* beliefs that align with genuine normative demands arising from our social nature. He then uses *this sustained normative authority* to critique *other* evolutionary outcomes.

  4.  **Where the Asymmetry Stops Being the Same Thing: The Crucial Distinctions Philosophers Debate**

      The consistency of Darwin's move hinges on whether there's a *relevant difference* between the domains that explains why origins debunk one but not the other. Key potential distinctions:

      *   **Truth-Aptness & Tracking:**
          *   **Religion:** Makes claims about the existence and nature of supernatural entities/forces. The EDA argues the origin mechanism isn't a reliable truth-tracker for *this specific kind of claim*.
          *   **Morality:** Makes claims about what *ought* to be done. Can these be "true" in the same way? If yes (Realism), does the origin mechanism reliably track *those* truths (e.g., facts about harm/flourishing)? Darwin implies yes. If no (Subjectivism), then "debunking" in the *truth* sense doesn't apply, but the origin might still explain *why we have these sentiments* without undermining their practical force (though Darwin doesn't treat them *only* as sentiments).
      *   **Adaptive Function vs. Spandrel:**
          *   **Religion:** Presented as primarily a *spandrel/byproduct* of mechanisms selected for other purposes (agency detection for survival), prone to error in the supernatural domain.
          *   **Morality:** Presented as a *direct adaptation* (selected *for* promoting cooperation/social cohesion). If the adaptation was selected *because* it produced behaviors that genuinely *were* beneficial/survival-conducive (and if "beneficial/survival-conducive" maps onto moral goodness in Darwin's view), then the origin *supports* its reliability. The mechanism *was* tracking something real (social utility).
      *   **The Feedback Loop:**
          *   **Morality:** There's arguably a tighter feedback loop. Moral norms that *fail* to promote group cohesion/stability would be maladaptive and selected against. Norms that *succeed* are reinforced. This sustained adaptive feedback *could* be seen as a process refining the moral sense towards tracking genuine requirements of social existence. No analogous feedback loop exists for the truth of supernatural agent beliefs.
      *   **Normative Project vs. Descriptive Belief:**
          *   Darwin uses morality as part of an ongoing *normative project* – shaping the future of humanity. Its origin doesn't invalidate this project; it might even inform it (e.g., understanding our sympathetic nature tells us to expand it). Religion, as he discusses it, is primarily a *set of descriptive beliefs about the world* that his explanation shows are likely false.

  5.  **Conclusion: The Phenomenon & Its Carving**

      *   **The Phenomenon:** Darwin's **asymmetric application of evolutionary debunking**, where origins undermine religious belief (as unreliable false positives) but protect (and even leverage) moral belief (as a reliable adaptation tracking real normative demands of social existence).
      *   **What it Isn't:** It's not *simply* the genetic fallacy (it's a targeted epistemic challenge). It's not *necessarily* special pleading, as there *might* be principled distinctions (truth-tracking potential, adaptive function vs. spandrel, normative vs. descriptive role).
      *   **Where it Stops Being the Same:** The asymmetry hinges on whether there's a **relevant difference in how the evolutionary origins relate to the epistemic justification or normative authority** of the beliefs in each domain. The debate focuses on:
          *   Does evolution reliably track moral *truths* (if they exist)?
          *   Is morality fundamentally about truth-apt propositions in the same way as religious claims about gods?
          *   Is the origin of morality primarily adaptive (suggesting reliability) or a spandrel (suggesting potential unreliability)?
          *   Can normative authority arise from, or be sustained by, adaptive processes even if not grounded in mind-independent facts?

      Darwin's text exemplifies the core tension in applying EDAs. Modern metaethics continues to wrestle with whether morality *can* be shielded from EDAs in a way that other domains (like religion) cannot, and if so, *why*. Your observation hits right at the heart of this enduring philosophical puzzle.
