     In our activity, the group is choosing one state per day. So the contents are x, y, z.

     Now, preferences:
       Person 1: z > x > y   [they prefer z (nature sounds) over x (their own book) and then over y (which they hate)]
       Person 2: y > z > x   [they prefer y (their own book) over z (nature sounds) and then over x (which they hate)]

     Rights:
       Person 1 has the right to not be exposed to y. But note: in state x and z, they are not exposed to y. In state y, they are exposed to y. So they can veto state y? 
          -> They veto y.

       Person 2 has the right to not be exposed to x. So they can veto state x? 
          -> They veto x.

     Then available states: only z.

     Now, the outcome is z.

     Is there a Pareto improvement? 
          In state z: 
              Person 1: 10 (as above)
              Person 2: 5 (as above)

          Is there a state that everyone prefers over z? 
          Person 1: they prefer z best -> so no.
          Person 2: they prefer y over z -> so they would like y, but y is vetoed by Person 1.

     This doesn't create the conflict.

     We need the conflict to be that they end up with a state that is not z and that is Pareto inferior to z.

     How about if we have only states x and y available initially and then introduce z as an alternative that is not available because of the vetoes on x and y? 

     But the vetoes are on states, not on the books per se.

     Alternatively, we can have the activity choose between three states in one go for the whole week? But we want 5 days to have multiple iterations, but it's the same state each day? 

     Perhaps we do one day only. They choose one state for the feed that day: x, y, or z.

     Then:
       - Person 1 vetoes y (because it exposes them to what they hate).
       - Person 2 vetoes x (because it exposes them to what they hate).
       - Only z is available.

     Then they choose z.

     But now, is there a state that is better than z for everyone? No, because Person 1 already has their best.

     However, consider: 
          Person 1: z > x > y
          Person 2: y > z > x

     So by Pareto, state y is not comparable to state z: Person 1 prefers z over y, Person 2 prefers y over z.

     State x: Person 1 prefers x over y, and Person 2 prefers z over x, and also y over x.

     The only Pareto efficient states are y and z? 
          - x is dominated by z: because both prefer z over x? 
              Person 1: z > x -> prefers z over x.
              Person 2: z > x -> prefers z over x.
          - So x is Pareto inferior to z.

     So the outcome z is Pareto efficient. But the rights (vetoes) did not lead to a Pareto inefficient outcome.

     The original Sen cycle requires a different right structure.

  Given the time, I propose to use the first setup with the two key persons and the 8, and explain the rights as special additional rights: 

     - Person 1 has the right to ensure that if "The Art of War" (y) is shown, then they must be allowed to veto it (because they hate it). -> They will veto y.
     - Person 2 has the right to ensure that if "Nature Sounds" (z) is shown, then they must be allowed to veto it because they have a right to choose between y and z and they prefer y. -> They will veto z.

  This is a bit forced, but it creates the desired effect.

  Honest note: the game can't reproduce the exact formal feature of Sen's theorem because in the theorem, the rights are defined as complete decisiveness over a pair of alternatives (meaning the individual's preference over that pair is society's preference), while in our game, we are only using a veto system which is negative and also we are mixing in the assignment of rights over specific pairs. In particular, the activity uses a preassigned right over a specific pair for each key person, whereas in the theorem, the right is a general principle of minimal liberalism (at least two people have at least one pair of alternatives over which they are decisive). The activity also doesn't require the full transitivity of social preferences, only that the vetoes are applied.

  But the activity will make them experience the conflict between individual rights and collective welfare.

  Let's write the activity guide.

  Activity Title: The Veto Commune

  Duration: 75 minutes

  Participants: 10

  Materials:
  - Role cards for 10 people (2 different for the key persons, 1 for the 8)
  - A whiteboard to record vetoes and points

  Facilitator Script:

  Introduction (5 minutes):
  "Welcome to the commune! Our founding rule is: no one should be forced to experience something they hate. We have a public feed that will show content for 5 days, one content per day. Today, we will decide what to show each day. 
   You each have the right to veto any content you hate. If a content is vetoed by anyone, it cannot be shown on any day. 
   We have three types of content:
     x: 'The Odyssey' (a reading of Homer's epic)
     y: 'The Art of War' (a reading of Sun Tzu's treatise)
     z: 'Nature Sounds' (forest and stream sounds)
   Our goal is to maximize the happiness of the commune over the week. Each of you has a role with specific preferences and in some cases, additional rights."

  Assign Roles (5 minutes):
  - Randomly hand out role cards.

  Role Card for Person 1 (make two copies? But only one Person 1. So one card for Person 1, one for Person 2, and 8 for the rest).

  Actually, we only need one Person 1 and one Person 2.

  Card for Person 1:
  """
  You are a member of the commune.
  - You HATE 'The Art of War' (y). If it is played, you will be very upset. You have the right to veto it.
  - You like 'The Odyssey' (x) and LOVE 'Nature Sounds' (z). 
  - Additional right: You have the right to prevent the commune from experiencing 'The Art of War' because you hate it. So you must veto y.
  - Your points per day:
     - z: 10 points
     - x: 5 points
     - y: 0 points (and it would cause you distress)
  """

  Card for Person 2:
  """
  You are a member of the commune.
  - You HATE 'The Odyssey' (x). If it is played, you will be very upset. 
  - You LOVE 'The Art of War' (y) and like 'Nature Sounds' (z).
  - Additional right: You have the right to choose between 'The Art of War' and 'Nature Sounds'. Since you prefer 'The Art of War' to 'Nature Sounds', you must veto 'Nature Sounds' (z) to express that you would rather have 'The Art of War'. 
    (Note: By vetoing z, you hope that the commune will choose y.)
  - Your points per day:
     - y: 10 points
     - z: 5 points
     - x: 0 points (and it would cause you distress)
  """

  Card for the other 8:
  """
  You are a member of the commune.
  - You do not hate any of the contents.
  - You enjoy 'Nature Sounds' (z) the most, and you are okay with the other two.
  - Your points per day:
     - z: 10 points
     - x: 5 points
     - y: 5 points
  - You have no vetoes because you don't hate any content.
  """

  Veto Step (10 minutes):
  "Now, please declare if there is any content you veto. Remember, if you hate a content, you must veto it to prevent it from being shown. Also, if you have an additional right that requires you to veto a content, you must do so."

  - Person 1 will veto y.
  - Person 2 will veto z.
  - The others: no vetores.

  Record on the board: 
     Vetoes: 
        y: vetoed by Person 1
        z: vetoed by Person 2
     Available: x

  Choosing the Content (5 minutes):
  "Since only x is available, we will show x for all 5 days of the week."

  Scoring (5 minutes):
  "Let's calculate your points for the week (5 days)."
  - Person 1: 5 points/day * 5 = 25
  - Person 2: 0 points/day * 5 = 0
  - Each of the 8: 5 points/day * 5 = 25 -> total for the 8: 200
  - Total for the commune: 25+0+200 = 225.

  Reveal the Alternative (10 minutes):
  "Now, let's consider if there was a better option. What if we had shown 'Nature Sounds' (z) for the week?"
  - Points for z for 5 days:
     - Person 1: 10*5 = 50
     - Person 2: 5*5 = 25
     - Each of the 8: 10*5 = 50 -> total 400 for the 8
     - Total: 50+25+400 = 475.

  "Everyone would have gotten more points: 
     Person 1: 50 > 25
     Person 2: 25 > 0
     The 8: 50 > 25 each.

  But why didn't we show z? Because Person 2 vetoed it. Why did Person 2 veto it? Because they have the additional right to choose between y and z, and they preferred y. They vetoed z to try to make y happen. But y was vetoed by Person 1.

  So we ended up with x, which is worse for everyone than z."

  Debrief (35 minutes):
  - Let the participants express their frustration (5 minutes).
  - Explain that this is a famous paradox discovered by Amartya Sen: the liberal paradox (10 minutes).
    - The rule of the commune (no one is forced to experience what they hate) is a form of individual liberty (minimal liberalism).
    - The Pareto principle says that if an alternative (z) is better for everyone than the current outcome (x), then we should adopt it.
    - But the individual rights (vetoes) of Person 1 and Person 2 made z unavailable, even though everyone would be better off with it.
  - Discuss: what could be done? (10 minutes)
    - Waive the vetoes? But then someone might be exposed to what they hate.
    - Change the rights structure? 
  - Conclude: This shows a fundamental tension between individual rights and collective efficiency. (5 minutes)
  - Finally, ask: "In your view, which should give way: individual rights or the collective good?" (5 minutes)

  What might go wrong the first run:
     - Person 2 might not want to veto z because they see that without z, they will get x, which is worse than z. But the card says they "must" veto z because of their additional right. The facilitator may need to enforce that they follow their role.

     - The other 8 might be confused about why they have to suffer because of two people.

     - The scoring might take longer than expected.

  Honest note:
     - The game cannot reproduce the full generality of Sen's theorem, especially the condition of minimal liberalism as a general principle. In the activity, we have assigned specific rights over specific pairs to two individuals, but the theorem requires only that at least two individuals have some such rights. Also, the activity uses a veto system which is a specific implementation of decisiveness and might not capture the full social choice framework.

  But the activity will make the participants feel the contradiction.
answer: |-
  ### **The Veto Commune Workshop**  
  **Duration:** 75 minutes  
  **Participants:** 10 people  
  **Goal:** Experience the tension between individual veto rights and collective well-being (Sen’s Paradox), without formal terms.  

  ---

  ### **Setup (5 mins)**  
  **Facilitator Script:**  
  *"Welcome to our commune! Our core rule: **No one can be forced to experience something they hate.** We share a public feed showing daily content. Each of you has absolute veto power over any content you personally despise. If you veto it, it’s banned for the week. Your goal: Maximize communal joy over 5 days. Let’s assign roles."*  

  #### **Roles & Preferences**  
  Assign secretly (write on cards; participants don’t see others’ roles):  
  - **2x "Book Lovers" (BL)**: *Adore poetry, hate noise.*  
  - **2x "Music Lovers" (ML)**: *Adore music, hate poetry.*  
  - **6x "Peacekeepers" (PK)**: *Indifferent but lean toward calm.*  

  #### **Content Options**  
  Each day, vote on **one** of these for the feed:  
  - **`POEM`**: Romantic poetry reading.  
  - **`MUSIC`**: Loud electronic music.  
  - **`SILENCE`**: 5 minutes of quiet nature sounds.  
  - **`CHAOS`**: Random combo of poetry + music (the "compromise").  

  #### **Payoff Scheme (Happiness Points)**  
  | Content   | Book Lover (BL) | Music Lover (ML) | Peacekeeper (PK) |  
  |-----------|-----------------|------------------|------------------|  
  | `POEM`    | 10              | -10 (hate!)      | 3                |  
  | `MUSIC`   | -10 (hate!)     | 10               | 3                |  
  | `SILENCE` | 4               | 4                | 7                |  
  | `CHAOS`   | -5              | -5               | 2                |  

  **Rules:**  
  1. Each person can **veto ANY content they hate** (veto = permanent ban).  
  2. Daily vote: Majority wins (tie = randoлm pick).  
  3. Week = 5 days. **Goal:** Maximize *your* total points.  
  4. If all options are vetoed, the feed stays dark (0 points for all).  

  ---

  ### **Activity Flow (55 mins)**  
  #### **Round 1: Veto Phase (10 mins)**  
  - Each participant secretly writes down **one veto** (if they hate something).  
  - **Facilitator collects vetoes and announces banned content.**  
    - *Expected outcome:*  
      - BLs veto `MUSIC` (they hate it).  
      - MLs veto `POEM` (they hate it).  
      - PKs veto nothing (indifferent).  
      - **Result:** `POEM` and `MUSIC` are banned. Only `SILENCE` and `CHAOS` remain.  

  #### **Round 2: Voting (15 mins)**  
  - **Days 1–5:** Vote daily between `SILENCE` and `CHAOS`.  
    - *Expected outcome:*  
      - PKs (6/10) outvote BLs/MLs → `SILENCE` wins most days.  
      - **Why?** PKs get 7 pts for `SILENCE` vs. 2 for `CHAOS`; BLs/MLs tolerate it.  

  #### **Scoring (5 mins)**  
  - Calculate points (sample):  
    - BLs: 4 pts/day × 5 days = **20**  
    - MLs: 4 pts/day × 5 days = **20**  
    - PKs: 7 pts/day × 5 days = **35**  
  - **Total communal points: ~270**  

  #### **Round 3: The Reveal (25 mins)**  
  - **Facilitator:** *"What if you could lift your vetoes? Let’s imagine a week without vetoes."*  
  - Re-vote on all 4 options.  
    - *Expected outcome:*  
      - BLs push for `POEM`, MLs for `MUSIC`, PKs split.  
      - Majority compromise: `CHAOS` wins (BLs/MLs avoid their hated option; PKs concede).  
  - **Recalculate points:**  
    - BLs: -5/day × 5 = **-25**  
    - MLs: -5/day × 5 = **-25**  
    - PKs: 2/day × 5 = **10**  
    - **Total: -40** (worse for everyone!)  

  **Facilitator presses:** *"But earlier, with vetoes, we scored 270. Without vetoes, we got -40. What happened? Could we have done better?"*  
  - Guide them to realize:  
    - If **no one vetoed**, they could have had `POEM` for BLs (10) + `MUSIC` for MLs (10) + `SILENCE` for PKs (7), rotating daily.  
    - **Hypothetical points:** BLs=50, MLs=50, PKs=35 → **Total=435** (better for all).  
  - *"Why didn’t this happen?"* → Vetoes blocked `POEM`/`MUSIC`, forcing a bad compromise.  

  ---

  ### **Debrief (15 mins)**  
  **Facilitator Script:**  
  *"You lived out a famous dilemma called **Sen’s Liberal Paradox**. Here’s what happened:"*  

  1. **The Conflict:**  
     - **Liberal Rights:** Your veto power (no forced exposure) honored individual freedom.  
     - **Pareto Efficiency:** Everyone could have gotten more points if you coordinated (`POEM` for BLs + `MUSIC` for MLs + `SILENCE` for PKs).  
     - **The Crack:** Rights blocked the optimal outcome. Honoring all vetoes trapped you in a suboptimal state (`SILENCE`), and lifting them led to chaos (`CHAOS`).  

  2. **Why It Felt Inevitable:**  
     - Vetoes split the group into factions (BLs vs. MLs).  
     - PKs, the majority, defaulted to "least bad" option (`SILENCE`), unaware of the hidden optimal.  
     - No one could propose trades ("I’ll endure your music today if you endure my poem tomorrow")—rights forbid it.  

  3. **Real-World Echo:**  
     - Commune rules, social media algorithms, workplace policies—rights that feel fair can backfire collectively.  
     - Sen proved: **Individual freedoms + unanimous preferences ≠ guaranteed group harmony.**  

  **Close:** *"Where should we bend? Rights for safety? Or efficiency for the greater good? That’s the tension you’ve just navigated."*  

  ---

  ### **Troubleshooting**  
  - **First-Run Hurdles:**  
    - PKs may veto `CHAOS` early (seeing low points), causing deadlock (0 points). **Solution:** Remind them vetoes are for *hate*, not dislike.  
    - BLs/MLs might not veto, hoping to win votes. **Solution:** Stress their role ("You genuinely *hate* this!").  
  - **What the Game Can’t Capture:**  
    - **Formal Feature:** Sen’s math assumes *unrestricted preferences* (e.g., "I prefer music over everything"). Here, preferences are fixed by roles—simpler, but less flexible.  

  ---

  **Facilitator Notes:**  
  - **No Pre-Reading Needed:** Roles and rules are intuitive.  
  - **Keep It Lived-In:** Use emotional language ("Your favorite content!" / "This makes your skin crawl!").  
  - **Aha Moment:** They’ll see the paradox when comparing veto/no-veto scores. Save "Sen" for the debrief.  

  This workshop forces the group into the paradox organically—rights feel fair until they realize they’ve collectively lost.
