  hey so im trying to work through a section of Vācaspati Miśra's Tātparyaṭīkā on Nyāya Sūtra 1.1.4, the part about sāmānyalakṣaṇa pratyakṣa — perception that grabs a universal not because you've seen every instance, but because there's this aloukika sannikarṣa (extraordinary contact) with the universal through its instances. the passage says that when the sense-organ connects to an object bearing a universal, and the mind is in some state of prior conditioning or yogik clarity, perception doesn't just register the particular but also reaches the universal as an object, even though the universal isn't spatially present the same way. he adds this isn't anumāna because there's no hetu (middle term) being applied, yet it still gives determinate knowledge of the universal in other unobserved cases.

  im stuck on whether he's literally saying perception can have a non-spatial object, or if he's just smuggling inference in by calling the mental conditioning perceptual. also he seems to imply that if you accept this, then inference becomes redundant for universal knowledge, which feels off since Nyāya usually holds that anumāna depends on prior perception of the universal. is there a hidden circularity? and here's a twist that might be off-base: if we treat this yogik perceptual state as a kind of self-locating belief update — like the knower updates indexically based on their position in the causal chain of universals — does that break the Nyāya claim that pramāṇas are objective and not agent-relative? i dont need citations or a reading list, just help untangling the logic and where the passage is actually going.
