answer: |-
  *(A dry rustle of cardinal’s robes in the dim cell; the voice is low, resonant, yet weary with the weight of centuries and countless confessions)*

  Ah, you fixate upon the sparks struck from the anvil, the bright, brief flares of defiance, and mistake them for the enduring substance of humanity. The heretic, the mystic, the solitary voice crying in the wilderness – these are but exceptions, precious few grains of sand against the vast, crushing shore of human weakness. Do you imagine their pyres were lit *for the multitude*? Nay. They were lit *against* them. To protect the flock from the contagion of their dangerous, lonely strength. That very coercion you cite proves my case: left unchallenged, their fevered dreams of "authentic self-determination" – a pretty phrase masking chaos – would have lured countless weaker souls into the desert Christ abandoned, where freedom becomes a howling void. The Church, in her stern mercy, shields the millions from the seductive poison offered by the single defiant soul. We burn the aberrant branch not out of fear of *its* strength, but fear of the countless tender shoots it might infect and destroy with its impossible demands.

  You speak of a "positive freedom," an alignment with truth. A philosopher's dream! Where is this truth inscribed, save in the solitary, anguished conscience? Christ offered it, naked and terrible, and they crucified Him for it. Men flee such terrifying responsibility. What you call the "condition for meaningful choice" is, for the vast herd, merely the condition for paralyzing doubt, corrosive envy, and the bloody chaos of a thousand warring truths. We offer not the destruction of flourishing, but its *only possible foundation for the many*: certainty, order, belonging. The authority of Rome – the true authority, born of necessity, not pride – *creates* the stable ground upon which the weak may live without the terror of the abyss beneath their feet. If a handful of souls, gifted with some unnatural fortitude, writhe under this care and yearn for the precipice... their suffering is the price of universal peace. Does the shepherd weep for the single lamb that strains towards the wolf’s territory? He guards the fold. Our anthropology holds: the craving for security, for *final* answers borne by another, is the universal bedrock. Those who seem to transcend it are either saints – vanishingly rare, and often broken – or rebels consumed by their own pride, mistaking the agony of their isolation for nobility. Their resistance proves not the appeal of Christ's freedom, but the desperate, essential need for the shield we provide against it.
