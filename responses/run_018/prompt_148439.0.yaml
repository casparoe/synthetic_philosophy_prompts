answer: |-
  Here's a decision tree for navigating Bernard Williams' integrity objection, designed to sort positions without direct ideology questions. The tree starts from the drowning spouse case and incorporates your key elements, including preemptive lock-in. Each leaf names a position, its awkward commitment, and flags indistinct leaves.

  ---

  ### **Decision Tree: Integrity in the Drowning Spouse Case**
  *(Start at Node 1)*

  1. **In the drowning scenario, can you save your spouse without any moral calculation?**  
     (i.e., no thought of "Should I save her? Is this optimal?")  
     → **Yes** → Go to Node 2  
     → **No** → Go to Node 5  

  2. **Are your "ground projects" (e.g., love for spouse) non-negotiable?**  
     (i.e., must they *never* yield to impartial demands like utility?)  
     → **Yes** → **Leaf A: Williams-Style Integrity**  
     → *Awkward commitment: Prioritizing personal integrity even if it causes catastrophic harm (e.g., letting thousands die to save your spouse).*  
     → **No** → Go to Node 3  

  3. **Could indirect utilitarianism justify your automatic response?**  
     (e.g., "Not calculating leads to better long-term outcomes")  
     → **Yes** → **Leaf B: Smart Indirect Utilitarian**  
     → *Awkward commitment: Defending deeply personal acts with impersonal systemic arguments (e.g., "I saved my spouse to maximize social trust").*  
     → **No** → Go to Node 4  

  4. **Is preemptive moral lock-in rational?**  
     (e.g., "I *bind myself* never to calculate for loved ones")  
     → **Yes, and it’s more than rule-following** → **Leaf C: Integrity Lock-In (Unnamed)**  
     → *Awkward commitment: Deliberately becoming irrational in crises to preserve your "self" (e.g., scorning a calculator even when calculation would clearly save more lives).*  
     → **No, or it’s just hidden rule-utilitarianism** → **Leaf D: Virtue-Ethics Loyalty**  
     → *Awkward commitment: Moral luck (e.g., being "virtuous" for saving your spouse, but condemned if the stranger was a cure-for-cancer scientist).*  

  5. **Is partiality (e.g., favoring spouse) justifiably *absorbed* by utilitarianism?**  
     (e.g., "Bias for loved ones indirectly maximizes utility")  
     → **Yes** → **Leaf E: Indirect Utilitarian**  
     → *Awkward commitment: Needing to prove that love isn’t intrinsically valuable—just a tool for better consequences.*  
     → **No** → **Leaf F: Act Utilitarian**  
     → *Awkward commitment: Demanding moral math in crises (e.g., "Sorry honey, I checked the numbers first").*  

  ---

  ### **Key Notes**
  - **Indistinct Leaves**:  
    - **B (Smart Indirect Utilitarian)** and **E (Indirect Utilitarian)** often blur. Both justify partiality via utility, but B does so via psychological lock-in, while E uses systemic reasoning.  
    - **C (Integrity Lock-In)** and **A (Williams Integrity)** overlap if lock-in is seen as expressing non-negotiable identity.  

  - **Weakest Branch: Preemptive Lock-In (Node 4)**  
    - **What could flip it?** If lock-in is proven incoherent (e.g., "binding future self" is impossible without *already* accepting a rule), it collapses into **B** or **E**. If it reduces to rule-utilitarianism ("lock-in maximizes utility"), it becomes **B**.  
    - **Flip condition**: Evidence that self-binding is *always* covert rule-optimization (e.g., neuroscience showing "commitments" are just predictive heuristics).  

  ### **Why This Works**
  - **Practical focus**: Starts concrete (drowning case), tests core tensions (negotiability, absorption, lock-in).  
  - **No jargon**: Uses relatable terms ("binding yourself," "moral math").  
  - **Unnamed position**: Highlights where standard frameworks strain (Leaf C).  

  This tree isolates Williams’ critique, forces distinctions between similar outcomes (e.g., automatic actions vs. lock-in), and exposes hidden rule-utilitarian assumptions. Try applying it to real-world examples like triage or loyalty conflicts!
