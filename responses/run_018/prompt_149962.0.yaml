answer: |-
  Your diagnosis cuts to the core of the composition debate. The stalemate *does* stem from a deeper conflict about whether ontological boundaries must track causal-explanatory joints, masked as a dispute about existence. Let's dissect this through the lenses of contact, life, and vagueness, then evaluate whether distinguishing ontological commitment from explanatory framing can resolve it.

  ### 1. **Engaging the Camps on Key Cases**  
     - **Contact (e.g., a hand on a table):**  
       - **Universalists** (e.g., Lewis, Sider): Mere contact suffices for composition. The "hand-table fusion" exists simply because parts occupy contiguous spacetime. They reject causal thresholds as irrelevant to *existence*—ontology is prior to causation.  
       - **Restrictivists** (e.g., van Inwagen, Merricks): Contact alone is inert. Composition requires *functional unity* or causal integration (e.g., covalent bonding). A hand and table don’t compose an object because they lack joint causal powers—no "new" entity emerges.  
       - **Nihilists** (e.g., Dorr, Rosen): No contact yields composition; only simples exist. Boundaries are always illusory.  

     - **Life (e.g., organisms vs. aggregates):**  
       - **Universalists:** Organisms are no more ontologically privileged than a "heap of cells + dust." Both are equally real composites, though only organisms *interest us* explanatorily.  
       - **Restrictivists** (van Inwagen): Only living things compose objects. The self-maintaining causal unity of metabolism marks a joint in reality. A corpse ceases to be an object, becoming a mere aggregate.  
       - **Nihilists:** Even organisms are "strictly speaking" non-existent; only particles are real.  

     - **Vagueness (e.g., a gradually assembled car):**  
       - **Universalists:** Vagueness is semantic, not ontological. There’s a precise moment composition occurs (e.g., adding bolt #1,000), but our language lacks sharp boundaries.  
       - **Restrictivists:** Vagueness reflects ontological indeterminacy (Merricks). If composition requires causal unity, and unity admits degrees (e.g., a half-assembled engine), boundaries *are* fuzzy in reality.  
       - **Nihilists:** Vagueness vanishes—no composition occurs at all.  

  ### 2. **The Core Disagreement: Ontology vs. Explanation**  
     - **Restrictivists** treat "object" as a *causal-explanatory category*: composition is grounded in joint causal powers (e.g., a tiger’s parts collectively hunt; a rock’s parts collectively fall). Boundaries must track real-world divisions to avoid "causal danglers" (entities with no explanatory role).  
     - **Universalists** treat composition as *logically primitive*: existence is cheap, but explanation is selective. Arbitrary sums exist, but we ignore most because they lack causal coherence ("the dust in quadrant 3" explains nothing).  
     - **Nihilists** collapse ontology into fundamental physics: only causally basic simples exist.  

  ### 3. **Can a Sharp Distinction Break the Impasse?**  
     Proposing a split between **ontological commitment** (what exists) and **explanatory framing** (what we use in science/folk talk) *could* clarify:  
     - **Universalists** might accept: "All mereological sums exist, but only cohesive composites (e.g., organisms, artifacts) feature in explanations."  
     - **Restrictivists** might concede: "Only unified composites exist, but we can *refer* to aggregates pragmatically."  

     **Why this fails in practice:**  
     - **Restrictivists** see causal unity as *constitutive of existence*. Granting existence to arbitrary sums violates their core intuition: "If it doesn’t *do* anything, it isn’t real."  
     - **Universalists** see existence as independent of explanation. Granting restrictivism implies causal powers create objects—a "magical" emergence they reject.  
     - **Nihilists** dismiss both: neither sums nor composites are fundamental.  

  ### 4. **The Anchor: Pre-Theoretical Intuitions of Unity**  
     The stalemate is ultimately rooted in irreconcilable intuitions:  
     - **Restrictivist Intuition:** Objects must be "unified agents" (e.g., a tiger, a watch). We perceive boundaries where causation is integrated.  
     - **Universalist Intuition:** Reality has no "joints"; unity is perspectival. Existence is maximal to avoid arbitrary thresholds.  
     - **Nihilist Intuition:** Only the fundamental is real; composites are conceptual tools.  

     **Formal arguments** (e.g., vagueness puzzles, parsimony) fail because they presuppose these intuitions:  
     - Universalists see restrictivism as *ad hoc* ("Why privilege life but not stars?").  
     - Restrictivists see universalism as bloating reality with "non-objects."  
     - Nihilists see both as ignoring physics' ontology.  

  ### Conclusion: A Tripartite Impasse  
  The debate is **three distinct projects conflated under "composition"**:  
  1. **Metaphysical** (Restrictivists): What structures reality into causally significant units?  
  2. **Logical** (Universalists): What follows from mereology + unrestricted quantification?  
  3. **Scientific** (Nihilists): What does fundamental physics commit us to?  

  **No sharp distinction can break this** because each camp rejects the others' starting intuitions. The restrictivist’s "causal joint" and the universalist’s "mereological sum" are incommensurable primitives. Progress may require abandoning "composition" as a unitary question and instead asking: *What work do 'objects' do in our theories?* But this shifts the dispute to pragmatism—a truce, not a resolution. The impasse endures because ontology cannot escape its intuitive anchors.
