  Within each kind, status could scale continuously based on intensity, complexity or scope of these properties. The tier-three agent might fall into minimal patient status because while it lacks binding, it could still have valenced states (if we empirically assume valence can exist without binding). Its sophisticated cognition would then increase its moral weight within that category.

