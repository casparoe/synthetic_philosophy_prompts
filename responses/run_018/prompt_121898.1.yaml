  - Paragraph 2: Defend it using Benatar's own examples (e.g., not creating happy lives isn't wrong). 
  - Paragraph 3: Contrast with NU-lite—highlight how NU-lite would call creating pleasure *neutral*, while Benatar calls it *good but not required*. 
  - Paragraph 4: Conclude whether the hidden premise is defensible or a flaw. 

  Marking scheme traps: 
