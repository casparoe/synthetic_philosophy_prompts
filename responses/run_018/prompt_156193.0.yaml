prompt: |-
  I'm co-hosting a podcast with some other software engineers where we try to talk philosophy without knowing the jargon too well, and next week we're interviewing a philosopher - I don't think she's that well-known outside the field - who defends a specific version of epiphenominalism about consciousness. Her particular spin is that phenomenal judgments, like when you judge "this pain hurts," aren't actually caused by the conscious experience itself, but by some parallel neural tracking mechanism that runs alongside awareness but never causally interacts with it. She calls this the shadow-correlation view, or something close to that.

  I need about eight to ten questions for her, and I want them to actually dig into the paradox of phenominal judgment rather than just asking her to explain the basics. Specifically, please include one question that sets up the self-stultification worry - if her own belief that consciousness lacks causal power isn't caused by consciousness, then why should she trust that belief about consciousness specifically? - and then a follow-up for the standard reply that it's the neural correlates, not consciousness, that cause her belief. I also want a question about misfire cases: if the tracking system can glitch on its own, could someone form a false phenomenal judgment about an experience they never actually had? And another about whether this makes all phenomenal knowledge indirect or inferential, since she still claims it's direct in some sense. Maybe also ask about stacked judgments - judging that you're judging about pain - and whether those higher-order tracks also run in parallel without ever touching consciousness.

  Write them like I'm genuinely asking them in conversation - I'm a backend developer so my phrasing might be a bit clunky, and I don't want anything that sounds like I'm reading off an academic paper. Don't include any requests for citations, bibliographies, or further reading lists, since I can't look that stuff up before we record.
