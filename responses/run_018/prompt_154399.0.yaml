answer: |-
  Let's address your three questions directly through close textual analysis of Newton's arguments, staying within the conceptual boundaries you've set:

  ### (1) Causal Efficacy vs. Ontological Ground
  Newton's argument does **not require absolute space to act as a causal agent**. The Scholium is explicit: Absolute space has no parts, marks, or causal powers ("it does not act upon nor is acted upon"). The concavity and tension are caused by *inertial forces* arising from **acceleration** (change in true motion), not by space "pushing" or "pulling." Space provides the **ontological ground** that makes acceleration absolute rather than relational. Key steps:
  - The water's concavity manifests *centrifugal force*, which Newton attributes to the water's *endeavor to recede from the axis of rotation* (Corollary to the Laws of Motion).
  - This endeavor exists only when there is *absolute rotation* (change in direction relative to absolute space), not relative rotation to the bucket (as shown when both rotate together).
  - **Inference:** The physical effect (concavity) reveals a non-relational fact about motion (true rotation), which presupposes a fixed reference frame (absolute space). Space is the *necessary referent* for defining true motion, not its *cause*. The force arises from inertia within this frame.

  ### (2) How the Globes Block Distant-Matter Relationism
  The globes example directly targets the relationist escape hatch of appealing to *any* distant matter:
  - **The Setup:** Newton specifies an "otherwise empty universe" ("*in spatio libero a corporibus longe dissitis*"). This explicitly removes *all* external reference bodies, near or far.
  - **The Observation:** Tension exists in the cord connecting the globes rotating about their center of gravity. This tension requires a *centrifugal endeavor* of each globe away from the axis.
  - **Relationist Dilemma:**
    - *Option 1:* Claim motion is merely relative to the *other globe*. But relative to each other, the globes are static (fixed distance); only their *absolute* orientations change. Tension cannot arise from mutual rest.
    - *Option 2:* Appeal to *distant, unseen matter* (e.g., a "fixed star" plenum). Newton's setup **precludes this by fiat** – the universe *contains only the two globes and cord*. If tension still arises (as Newton insists it would), its cause cannot be relation to distant bodies. True rotation must be defined non-relationally.
  - **Conclusion:** The globes show that *even if all other matter were annihilated*, the tension (and thus true rotation) would persist. This forces the relationist to either deny the observable effect (tension in empty space) or accept a non-relational basis for motion.

  ### (3) Compatibility with Structural Relationism
  A contemporary **structural relationist** (accepting an absolute metric/affine structure of spacetime but denying space is a substance) **can consistently accept Newton's observations while rejecting substantivalism**. Here's why:
  1.  **Accepting Phenomena:** They agree concavity/tension result from *absolute acceleration* (covariant derivative of velocity ≠ 0). Newton's empirical core is preserved.
  2.  **Reinterpreting the Ground:** Instead of attributing acceleration to motion relative to a substantial "container" (absolute space), the structuralist attributes it to deviation from *inertial trajectories* defined by the spacetime's geometric structure (e.g., geodesics in Minkowski spacetime). The structure is "absolute" in being non-dynamical and non-relational to matter, but it is not a *substance*; it's a set of geometric relations or a field.
  3.  **Neutralizing Newton's Inference:** Newton concludes that true motion requires a *substantial space* because he lacks the concept of an autonomous spacetime *structure*. The structuralist argues the phenomena only require the structure, not an underlying substance. The "immovable framework" becomes the inertially fixed *metric structure*, not a substantial void.
  4.  **Textual Compatibility:** Newton's emphasis on the *immovability* and *independence* of space aligns with the fixed nature of the background structure. His inability to "observe" space parts/marks becomes the structure's lack of localizable physical parts, while its global properties (e.g., Euclidean geometry) govern inertia.

  **Summary for Your Position:** Newton's arguments establish that motion has an absolute (non-relational) aspect demonstrable through forces arising from acceleration. He ontologically grounds this in substantial absolute space. However, his *empirical evidence* (bucket concavity, cord tension) only strictly necessitates an **absolute standard of acceleration** (non-relative inertia), which can be ontologically grounded in either:
  *   Newton's **substantivalism** (space as substance), or
  *   Modern **structural relationism** (spacetime metric/affine structure as primitive).

  The globes experiment is crucial because it severs the explanatory link to *any* relational frame (local or distant), forcing an absolute basis. Your inheritance dispute analogy holds: Newton argues location/acceleration is intrinsic *to the body/land within a framework*, not defined purely by adjacent relations. Whether that framework is a substance or a structure is the deeper ontological debate.
