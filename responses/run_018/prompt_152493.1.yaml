answer: |-
  Here’s the dialogue, keeping it grounded but sharp:

  **Setting:** Co-op common room after a board meeting, mismatched mugs in hand.

  **MORGAN:** Okay, hear me out on this "Community Wins" board again. We’re drowning in potluck sign-ups and lost cat flyers. What if the lobby *also* showed real wins? Priya finally got her nursing license after night classes for *years*. Ben landed that sustainable architecture grant. That stuff matters.  
  **RILEY:** *[Sighs, leaning back]* Morgan, I get the impulse. But plastering that stuff publicly? It turns the lobby into a LinkedIn feed. Suddenly everyone’s silently auditing each other’s life progress.  
  **MORGAN:** That’s my point! We *should* see it! Hiding it creates this… **aspirational vacuum**. If the *only* visible stuff is complaint boards and chore charts, mediocrity becomes the default we measure against. How does Priya’s grind inspire the kid thinking about trade school if it’s invisible? Seeing "Ben - Grant Awarded" isn’t bragging; it’s a damn roadmap saying "This is possible *here*, for someone like you."  
  **RILEY:** **"Aspirational vacuum"?** More like avoiding **visibility debt**. Every "win" you force into public view creates a social IOU. Now Sam, who’s perfectly happy fixing bikes and reading poetry in peace, *owes* Ben performative congratulations just walking to the mailboxes. Or worse, feels like his quiet contentment is now a deficit on the public ledger. It turns genuine community into a stage. Not everyone *wants* their journey measured by the co-op bulletin board. It feels… surveilled.  
  **MORGAN:** *[Nods thoughtfully]* Okay, the Sam point. That’s fair. Surveillance is the *last* vibe we want. *But*... does celebrating Priya *force* Sam to perform? Couldn’t it just… exist? Like the art on the walls? Sam can appreciate it or ignore it, same as Terrence’s weird ceramic badger. The vacuum isn’t just about lacking inspiration; it subtly signals that striving *itself* is somehow… gauche here. Like ambition needs to stay hidden to preserve the vibe. Doesn’t that hurt the people who *are* striving, making them feel isolated?  
  **RILEY:** *[Pauses, taps mug]* Maybe. But isolation cuts both ways. You think Priya *wants* her license up there? Or feels pressured to say yes because it’s "for the community"? **Visibility debt** isn't just about owing praise; it’s about the invisible pressure *on the "winner"* to keep performing, and the quiet resentment or inadequacy it can breed in others who aren’t on that path. It *replaces* genuine, organic support – like me actually asking Priya how her exam went over tea – with this… mandatory public spectacle. The trust comes from letting people share *if* and *how* they choose, not turning their milestones into communal property.  
  **MORGAN:** So… we default to silence? Protect the Sams by making the Priyas and Bens keep their wins private? Doesn’t that just reinforce the idea that ambition is… *suspect* here? That the *only* safe way to exist is quietly? Aspiration *needs* oxygen. Seeing "Grant Awarded" might spark an idea for Lee down the hall. Hiding it starves that spark. Can’t we find a way to shine a light without burning people? Opt-in only, super clear?  
  **RILEY:** Opt-in helps. But the *board itself* frames success in a specific way – promotions, degrees, grants. What about Anya finally managing her anxiety enough to host a small dinner? Or Carlos building that incredible compost system? Does that not "count"? The board inherently creates a hierarchy of wins. The quiet, personal triumphs, the ones that build real resilience and community… get erased. Visibility isn’t free, Morgan. The cost might be the very trust and quiet dignity people come *here* for.

  **Confidence & Critique:**

  *   **Overall Framing (High Confidence):** I'm confident the dialogue captures the core tension effectively. Morgan's "aspirational spillover" (highlighting the motivational vacuum and implied devaluation of ambition) and Riley's "visibility debt" (emphasizing social pressure, performativity, and the burden on both observers and achievers) are distinct, valid positions that genuinely engage. They directly address each other's key concerns (Morgan on isolation/surveillance, Riley on motivation/hierarchy).
  *   **"Visibility Debt" as a Concept (Moderate Confidence):** This is the part I'm least sure about *as a universally recognized term*, but **the phenomenon it describes feels psychologically and socially real.** We see it in the exhaustion of obligatory social media engagement, the pressure to celebrate colleagues' wins disingenuously, and the anxiety of feeling "less than" when constantly exposed to curated success. Riley articulates this force well – the "social IOU," the pressure on the achiever, the potential for resentment, and the erosion of genuine, private interaction. It might not be a formal academic term, but it effectively names a recognizable social dynamic, especially in close-knit, egalitarian-minded communities.
  *   **American Dream Framing (Fair Treatment):** Morgan's argument draws on the aspirational energy without glorifying uncritical individualism. It's framed as "roadmaps" and "possibility" *within the specific community context*, not blind celebration of winners. Riley effectively counters by highlighting the *communal cost* of that visibility. Neither side feels like a caricature. Morgan isn't advocating for cutthroat competition, and Riley isn't advocating for enforced blandness; both are arguing for different visions of supportive community.

  The dialogue intentionally ends on an unresolved tension – the core conflict between celebrating visible achievement to inspire and avoiding the social burdens of mandatory public recognition – because that *is* the honest tension you described. There's no easy answer, just a clearer understanding of the stakes.
