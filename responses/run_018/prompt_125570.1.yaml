answer: |-
  Here’s a structured pedagogical plan focusing on conceptual dependencies, sequenced misconceptions, and targeted resolution through the case study:

  ---

  ### **Pedagogical Plan: Inferential Architecture in Material Culture Studies**  
  **Target Concept:** *Moving from traces to reconstructed institutions without literalism or unmoored constructivism*  
  **Core Case Study:** Neolithic plastered skulls (Jericho/Ain Ghazal)  
  **Time:** 75 minutes  

  ---

  #### **Phase 1: Foundational Distinction (15 min)**  
  **Goal:** Establish the *functional vs. symbolic/institutional inference* dichotomy as the necessary first step.  
  - **Opening Question:** *"How do we get from a broken pot to understanding ancient social structures?"*  
  - **Key Input:**  
    - **Functional Inference:** Objects as solutions to practical problems (e.g., a grinding stone’s wear patterns reveal food processing).  
    - **Symbolic/Institutional Inference:** Objects as products of collective practices beyond utility (e.g., a deliberately shattered pot in a grave).  
  - **Preemptive Strike:** Head off **Misconception 1** (*literalism*) by contrasting a grinding stone (functional) with a ritual vessel. Emphasize:  
    > *"Functional traces show* ***what was done***; symbolic traces require us to ask ***why it was done repeatedly***."*  
  - **Visual:** Diagram contrasting inference types (no examples yet).  

  ---

  #### **Phase 2: Case Study Launch & Constrained Interpretation (25 min)**  
  **Goal:** Use plastered skulls to model *ambiguity-as-evidence* and defeat **Misconception 2** (*interpretive free-for-all*).  
  - **Introduce Skulls:** Images + key facts: plastered crania, shell eyes, domestic/mortuary deposits, *no* texts, *no* clear utility.  
  - **Guided Analysis:**  
    - *"What functional inferences can we make?* (e.g., plaster application required technical skill → functional inference about technology).  
    - *"What CAN’T functional inference explain?*" (e.g., deposition in homes, multiple skulls together, facial reconstruction → symbolic/institutional).  
  - **Neutralize Misconception 2:** Highlight *constraints*:  
    - Taphonomy: Skulls curated/re-deposited → intentionality.  
    - Comparative patterning: Found across sites → shared practice.  
    - Contextual contradictions: Domestic vs. mortuary → complex meaning.  
    > *"Constraints rule out some interpretations (e.g., ‘children’s toys’) but don’t specify a single ‘meaning’."*  

  ---

  #### **Phase 3: Conceptual Synthesis & Institutional Residue (20 min)**  
  **Goal:** Resolve **Misconception 3** (*institutions = individual beliefs*) via *institutional residue*.  
  - **Trigger Question:** *"If we say ‘ancestor worship,’ are we claiming Neolithic people consciously believed X?"*  
  - **Introduce Institutional Residue:**  
    > *"Some objects are **material sediments of social routines**—practices so ingrained they outlast individual cognition. The skulls may be residues of a mortuary *institution*, not direct symbols of belief."*  
  - **Reframe Skulls:**  
    - They index *recurring collective action* (plastering, depositing skulls).  
    - They do *not* prove specific beliefs (e.g., "ancestors watched families").  
  - **Contrast:**  
    - Literalism: "Skulls = portraits of ancestors" (overreach).  
    - Constructivism: "Any meaning is possible" (ignores constraints).  
    - Residue: "Skulls = traces of a *practice* requiring coordination" (inference to institution).  

  ---

  #### **Phase 4: Application Check & Scoping (10 min)**  
  **Goal:** Test transfer of the framework; clarify limits.  
  - **Task:** Hypothetical ceramic assemblage:  
    - *Crushed pots in pit* (institutional residue)  
    *Kiln waste with misfired vessels* (functional)  
    *Unbroken pot with animal motifs in grave* (symbolic? unsupported without comparanda)  
  - **Map Inferences:** Students categorize each using:  
    \- **F** (functional) / **IR** (institutional residue) / **U** (unsupported without further evidence).  
  - **Explicit Omissions:**  
    > *"Today we omit quantitative taphonomy, deep ethnography, or artifact biography—not because they’re unimportant, but because they build on this inferential foundation."*  

  ---

  ### **Critical Sequencing Notes**  
  1. **Institutional Residue** is introduced **only in Phase 3** to resolve the third misconception. Introducing it earlier risks conflating it with the functional/symbolic distinction.  
  2. **Skulls Carry the Argument** by:  
     - Requiring the Phase 1 distinction (no utility/text collapses ambiguity).  
     - Modeling constrained interpretation (Phase 2).  
     - Demanding a non-mentalist explanation (Phase 3).  
  3. **Constructivism is Pre-Bunked:** Phase 2’s focus on taphonomy/comparative patterning shows interpretation is *constrained*, not arbitrary, before residue reframes the institution/belief dichotomy.  

  ---

  ### **Outcome**  
  Students exit seeing:  
  - Functional vs. institutional inference as distinct tools.  
  - Plastered skulls as indexes of a *practice* (repeated curation/deposition), not a decoded "belief."  
  - Institutional residue as the bridge from ambiguous traces to social structures.  

  This plan ensures the case study *drives* conceptual progression while systematically dismantling predictable traps. The ceramic check transfers logic beyond the Levantine example, reinforcing framework over content.
