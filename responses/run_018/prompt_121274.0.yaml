prompt: |-
  Hi — I'm the lay member on our university's animal research ethics committee (the others are two vets, a neurophysiologist, and a moral philosopher who mostly just sighs), and we're in the middle of rewriting the tiering system we use to decide how much scrutiny a protocol gets. We've already made a pile of calls and I'm trying to work out what on earth our implicit rule is before the next meeting, where we've got two new proposals to rule on. Our track record so far: mice and zebrafish stay in the lowest tier for brief procedures; minipigs get exactly the same protection as full-size pigs even though the whole animal, brain included, is about a third the size; chimpanzees are off the table entirely; after a sentience review a while back we folded octopuses and edible crabs into the protected tier, which surprised me given one of them has a nervous system you could balance on a pinhead; a proposal involving a colony of roughly fifty thousand ants went through with no extra protection for the colony as such, even though the colony does things no individual ant can do; a study using older dogs with quite advanced cognitive decline had to be run under the full dog rules, and when someone suggested the tier could come down because these particular animals' capacities were clearly reduced, the committee said no quite firmly; and a protocol using lab-grown human cortical organoids — a few million neurons, no body, no sensory input, no behaviour — was recieved as a ordinary tissue-governance matter, i.e. no welfare protection at all. When I asked one of the vets whether any of this had anything to do with brain size, she said something like 'size is a proxy, not the thing that matters' and left it there, which I found deeply unhelpful.

  The two new proposals both involve lines of pigs engineered for research use. In the first, the brain is roughly three times normal volume at the same neuron packing density, so around three times as many forebrain neurons; the applicants claim — and I'm happy for us to just stipulate this rather than argue about it — that these animals are noticeably better at reversal learning and at tolerating delayed reward than ordinary pigs. In the second, the brain is also about three times normal volume, but the extra volume is mostly cerebellum and neuropil, with larger and more sparsely packed neurons, so the forebrain neuron count is basically the same as an ordinary pig's and the behavioural data looks allready indistinguishable from controls. Same species, same size of animal, quite different neurology.

  So: what should we decide about each of these if we want to be consistent with ourselves, and which of our earlier decisions is the closest analog in each case? Please lay out the two or three rules our track record is equally compatible with — I can come up with candidates like 'protection tracks forebrain neuron count', 'protection tracks absolute brain mass', 'protection tracks encephalization, i.e. brain size relative to what you'd predict for a body of that size', 'protection tracks behavioural sophistication assessed case by case', 'protection is fixed by taxon and every member of a protected taxon gets the same tier whatever its current capacities', and 'protection requires a single integrated organism with a capacity for experience' — then say what each predicts for each new proposal, where they come apart, which one you'd bet the committee actually converges on and why, and what principle we'd be tacitly adopting if we went the other way. If you think our precedents genuinely don't settle it, give me one concrete case — a proposal you'd have us put in front of the committee next — that would do the most work in telling the surviving rules apart. Please write in British English, and do flag anywhere you think my description of the cases has smuggled in an assumption that's doing the philosophical work for me.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from a university animal research ethics committee member. They're trying to reverse-engineer their implicit rules for tiering animal research protocols based on past decisions, and now have two new pig proposals to evaluate.

  Looking at their track record: They treat mice and zebrafish as low-tier despite brief procedures; give minipigs same protection as regular pigs regardless of size difference; completely ban chimpanzee research; include octopuses and crabs in protected tier after sentience review; gave no colony-level protection to 50k ants despite emergent intelligence; maintained full dog protections for cognitively impaired dogs; and treated lab-grown human brain organoids as mere tissue.

  The key clues seem contradictory: Brain size isn't the direct factor (as the vet said "size is a proxy"), yet they protected octopuses with tiny nervous systems while denying protection to neuron clusters without bodies. The cognitively impaired dog case suggests capacity reductions don't lower protections, while the ant colony decision implies collective intelligence isn't valued.

  Now two new pig variants: Both have 3x brain volume, but Pig A has 3x forebrain neurons with demonstrably enhanced cognition, while Pig B has same forebrain neuron count with normal behavior due to different neurology.

  Possible rules that fit most precedents:
  1. Taxon-based equality (all pigs equal regardless of individual variation)
  2. Neuron count threshold (forebrain focus)
  3. Behavioral capacity (assessed case-by-case)

  The sticking points: The octopus decision breaks the neuron count model, while the impaired dog case breaks behavioral capacity model. The organoid decision suggests embodiment matters. 

  For prediction: Their committee will likely treat both pigs equally under standard pig rules (taxon-based), but the Pig A case might cause tension. To test between rules, I should propose a hypothetical with neuron-matched animals across taxa.

  Must flag assumptions: Referring to ant colonies as doing things "no individual can do" implies accepting collective cognition, yet they didn't protect it. Also "capacity for experience" language in the organoid case may be doing heavy lifting.
answer: |-
  Right, let's dissect this step by step – you've got a gloriously inconsistent set of precedents that scream "committee pragmatism battling hidden principles". First, I'll lay out the rules compatible with your track record, then apply them to the new pig proposals, flag assumptions, and suggest a test case. Crucially, **your precedents strongly suggest that *current, individual, embodied cognitive capacity* is the unspoken anchor, but applied within rigid taxonomic boxes.**

  ### Rules Compatible with Your Precedents
  1.  **Taxon-Specific Fixed Protection:** Protection tier is rigidly assigned per species/taxon, ignoring individual variation in size, neurology, or current cognitive capacity within that taxon. Once a taxon is 'in', all members get the same tier.
      *   *Supported by:* Minipigs = pigs, cognitively impaired dogs = full dog rules, chimpanzees banned entirely (protected taxon off-limits).
      *   *Challenged by:* Octopus/crab inclusion (new taxa added based on review), arguably by the pig neuro-variants (if you tier them differently).

  2.  **Threshold of Neuronal Complexity/Embodied Cognition:** Protection requires a central nervous system (CNS) complex enough to support integrated subjective experience ("sentience") *in a behaving animal*. Absolute neuron count (especially forebrain) and behavioural sophistication are key *proxies*, but the embodied, integrated nature is essential. Brain size/encephalization are secondary proxies for this complexity.
      *   *Supported by:* Mice/zebrafish low tier (small CNS, simple behaviours), Octopus/crab protected (complex behaviour despite different neurology, sentience review), Ant colony low tier (no individual CNS complexity, colony intelligence not recognised), Organoids no protection (no body, no behaviour, no integration), Cognitively impaired dogs protected (they *possess* the required CNS type, even if currently impaired).
      *   *Challenged by:* Minipig = Pig (smaller CNS, but same type), arguably strict taxon adherence.

  3.  **Behavioural Sophistication (Case-by-Case Proxy):** Protection tracks observable behavioural capabilities (learning, problem-solving, affective states) assessed per protocol. Neurological data informs potential, but behaviour is the ultimate arbiter.
      *   *Supported by:* Octopus/crab inclusion (sentience review likely focused on behaviour), Pig A potentially higher tier?
      *   *Challenged by:* Cognitively impaired dogs (reduced behaviour didn't lower tier), Mice/zebrafish (simple behaviours accepted as low tier), Ant colony (complex colony behaviour ignored), Organoids (no behaviour). **This is the weakest fit overall.**

  **Assumption Flagged:** Your description of the ant colony ("the colony does things no individual ant can do") smuggles in the idea that *collective* intelligence/sentience *should* matter. Your committee explicitly rejected this. The principle tacitly adopted is that only *individual* organisms with sufficiently complex *individual* nervous systems warrant welfare consideration.

  ### Application to New Pig Proposals
  *   **Pig A (Larger Forebrain, Enhanced Cognition):**
      *   **Taxon-Specific:** Same tier as any pig (High). Precedent: Minipigs, impaired dogs.
      *   **Neuronal Complexity/Embodied Cognition:** *Potentially* higher tier? Significantly increased neuron count in key areas and demonstrably enhanced cognitive performance strongly suggest greater cognitive capacity/complexity. **Closest Analog:** *Contrast* with impaired dogs – here capacity is *increased*, not decreased. *Similar* to octopus inclusion (new evidence of sophistication). Committee might feel uneasy keeping it standard pig tier.
      *   **Behavioural Sophistication:** Enhanced performance suggests higher tier. Precedent: Octopus inclusion based on review.
  *   **Pig B (Larger Brain, Same Forebrain Neurons, Normal Behaviour):**
      *   **Taxon-Specific:** Same tier as any pig (High). Precedent: Minipigs (smaller brain, same tier), impaired dogs.
      *   **Neuronal Complexity/Embodied Cognition:** Same tier as standard pig. Forebrain neuron count – your committee's most consistent neurological anchor – is identical. Enlarged cerebellum/neuropil likely doesn't imply higher-order sentience. **Closest Analog:** Minipigs – altered brain size, same essential forebrain complexity. Also impaired dogs – different neurology (pathology), same protection.
      *   **Behavioural Sophistication:** Normal pig behaviour = standard pig tier.

  ### Where the Rules Come Apart & Prediction
  *   **Key Divergence:** Pig A is the tripwire. Taxon-Specific demands it stays standard pig tier. Neuronal Complexity suggests it *might* warrant *more* scrutiny. Behavioural Sophistication also suggests potentially more scrutiny.
  *   **Committee Prediction (Bet):** Your committee will assign **BOTH Pig A and Pig B to the standard, high pig protection tier.** Why?
      1.  **Overriding Power of Taxon:** Your strongest precedent is taxon-based equality (minipigs, impaired dogs). Changing tier *within* pigs sets a precedent they've avoided (unlike adding new taxa like octopus). The vet's "proxy" comment hints that size/neuron count isn't the *defining* factor for *established* taxa; membership is.
      2.  **Avoiding the Slope:** Granting Pig A higher tier opens the door to arguing *other* pigs (e.g., particularly intelligent individuals, different breeds) deserve more scrutiny, or conversely, that impaired pigs deserve less. They firmly closed that door with the dogs.
      3.  **Pragmatism:** It's administratively simpler. "All pigs are high tier" is a clear line.
      4.  **The Embodiment Anchor:** While Pig A has more neurons, it's still fundamentally the *same type* of embodied cognitive system as a standard pig. The committee hasn't shown willingness to fractionally increase protection based on incremental improvements within a taxon's normal range. The octopus was a binary in/out decision for a novel taxon.

  *   **Tacit Principle if you Tier Pig A Higher:** If you assigned Pig A a higher tier than Pig B or standard pigs, you'd be tacitly adopting the principle that **within a species, welfare protections should scale with *demonstrated* (or strongly neurologically inferred) increases in cognitive capacity relevant to experiencing harm or benefit.** This directly contradicts the impaired dog decision.

  ### The Unsettled Question & The Perfect Test Case
  Your precedents *don't* definitively settle whether a significant, *intra-species* enhancement of cognitive capacity warrants increased scrutiny, because Pig A is novel. To tease apart "Taxon-Specific Fixed Protection" vs. "Threshold of Neuronal Complexity/Embodied Cognition" (with intra-species scaling), you need a case targeting that gap.

  **Concrete Test Case Proposal:**
  *   **"Super-Mouse":** A genetically modified mouse line with a *doubled* forebrain neuron count (achieved via denser packing or delayed apoptosis, not just a bigger brain) and robust, reproducible behavioural data showing cognitive abilities significantly beyond standard lab mice (e.g., complex multi-step problem-solving, clear evidence of metacognition or richer affective states demonstrable in welfare-relevant contexts like anticipation of reward/punishment).

  **Why this works:**
  1.  **Same Taxon:** Forces the intra-species question directly. Is "mouse" a single tier?
  2.  **Clear Neurological Enhancement:** Significant increase in the key metric (forebrain neurons) your committee seems latently focused on.
  3.  **Clear Behavioural Enhancement:** Undeniable evidence of greater cognitive sophistication impacting potential experiences.
  4.  **Contrasts Precedents:**
      *   Vs. Impaired Dogs: Increased capacity, not decreased.
      *   Vs. Minipigs: Altered neurology *and* proven enhanced function.
      *   Vs. Octopus: Established taxon, not a novel one being added.
      *   Vs. Zebrafish/Mice: Clear evidence moving it beyond the "simple" baseline.
  5.  **Resolves the Pig A Ambiguity:** If Super-Mouse gets standard mouse tier, Pig A definitely gets standard pig tier. If Super-Mouse gets *higher* scrutiny, Pig A probably should too, forcing a rethink of the taxon-fixed rule.

  **Flagged Assumption in Your Query:** You describe the organoids as having "no body, no sensory input, no behaviour". This absolutely frames them as lacking the *embodiment* your committee clearly values (as per ant colony, organoid decisions). This is likely correct and central to their reasoning. The question for Pig A is whether being a *better embodied pig* makes it different ethically from a *standard embodied pig* in your committee's eyes. The test case suggests they'll likely say "No, a pig is a pig."

  Good luck in the meeting – watch the moral philosopher's sighs carefully; they might be trying to tell you something about the taxon straitjacket!
