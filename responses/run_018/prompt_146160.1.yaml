answer: |-
  Here are eight tight questions with follow-ups, designed as requested:

  1. **Question:** You argue spandrels are just "latent exaptations" awaiting co-option. Doesn't this collapse Gould & Lewontin's core distinction, making "spandrel" functionally useless as a term?  
     *Follow-up (if she emphasizes future potential):* If *every* current non-function is defined by its *future* potential for selection, what term is left for traits that truly never acquire function? What evidence would falsify "latency" for a specific trait?

  2. **Question:** Take the human chin – a classic spandrel candidate. What's your proposed *adaptive* story for its initial emergence via selection?  
     *Follow-up (if she admits no current adaptive story):* If there's no known adaptive origin *and* no current proven function, how is calling it "latent" different from faith that function *will* appear? Isn't "wait and see" scientifically weak?

  3. **Question:** Doesn't labelling *every* non-adaptive trait "latent" make your view unfalsifiable? Any trait, given enough time, *might* be co-opted.  
     *Follow-up (if she argues constraints generate future utility):* What specific empirical finding – say, about the chin – would convince you it's genuinely non-adaptive *forever*, not just "latent"? What observation kills "latency"?

  4. **Question:** On culture: You suggest things like writing or religion might be "latent" spandrels. But aren't these demonstrably co-opted cultural *inventions*, not byproducts awaiting function?  
     *Follow-up (if she ties them to cognitive architecture):* If a cultural trait emerges *because* of cognitive biases (e.g., pattern-seeking enabling religion), why call it a "latent" spandrel rather than an immediate exaptation *of that cognitive trait*?

  5. **Question:** Critics say latent-adaptationism is just pan-adaptationism with a time delay. How do you avoid that charge when *all* structures are deemed potentially functional?  
     *Follow-up (if she cites constraint-driven forms):* Doesn't defining future "potential" based on constraints *still* assume selection *will* inevitably exploit it? What breaks the determinism?

  6. **Question:** Applying latent-adaptationism to culture: If a cultural practice persists for millennia without clear adaptive benefit (e.g., specific ritual art forms), is it "latent" until co-opted, or evidence non-adaptive things *can* persist?  
     *Follow-up (if she argues persistence proves latent utility):* Doesn't that make persistence *itself* the evidence for latency, creating a circular argument?

  7. **Question:** For the appendix: If its immune functions are secondary exaptations, what selective pressure originally shaped its form *as a spandrel*? Isn't its structure a byproduct of gut development constraints?  
     *Follow-up (if she agrees it's a constraint byproduct):* If its form wasn't *shaped* for future function, only its *existence* provided material, how is "latent adaptation" different from standard exaptation theory?

  8. **Question:** Could latent-adaptationism hinder research? If we assume every trait *must* be or become adaptive, does it downplay investigating non-adaptive origins or purely structural explanations?  
     *Follow-up (if she denies hindrance):* How does assuming "latency" *not* bias investigation towards *seeking* future/potential functions over non-adaptive hypotheses?

  **Weakest Line:** Question 3's follow-up ("What observation kills 'latency'?"). It risks being dodged with vague answers about timescales or complex interactions.  
  *Drop it if she provides:* A concrete, measurable threshold (e.g., "If phylogenetic analysis shows the trait persists unchanged in multiple lineages for X million years after its origin with no measurable impact on fitness, despite environmental variation, latency is falsified") or acknowledges genuine permanent non-adaptation exists.

  **When to Change Mind on Interview Angle:**  
  Change your mind **if Dr. K** provides:  
  1.  **Clear falsification criteria:** Specific, observable, non-circular tests for "latency" vs. permanent non-adaptation.  
  2.  **Novel predictions:** Unique predictions latent-adaptationism makes that standard exaptation/spandrel theory doesn't (e.g., about *which* spandrels co-opt fastest based on constraint type).  
  3.  **Mechanism for "latency":** Explains *how* a structure is "primed" for future function beyond just existing (e.g., specific properties common to "latent" traits).  
  If she just rephrases exaptation with "wait and see," the angle likely isn't worth it. If she offers 1 or 2 above, it becomes compelling.
