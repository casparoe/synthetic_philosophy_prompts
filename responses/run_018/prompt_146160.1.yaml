  Fourth angle: Cultural spandrels. Should writing/religion be seen as brain byproducts? Follow-up on whether cultural evolution's faster pace breaks the biology analogy. Weakest when comparing timescales; if she argues cultural latency operates similarly but faster, it might stick. 

  User's deeper need: They're prepping to pin down a slippery guest. The "weakness" flags I added are essentially pre-game coaching – spotting where Dr. K could escape. Also, their chemistry background might make them extra wary of unfalsifiable claims. 

