  3. Dropping (5) commits you to rejecting the chain argument's conclusion, preserving (1)'s claim that no number of specks outweighs torture, regardless of the chain's existence.  
  4. The next-cheapest step to drop would be (1), forcing you to accept that specks can outweigh torture, but this abandons the core intuition that torture is incomparably worse.  
