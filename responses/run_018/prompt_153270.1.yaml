  Okay, the user is having a debate with their roommate about Plutarch's *Parallel Lives*. Let me start by understanding the roommate's main points. They claim Plutarch pairs Greek and Roman figures not for historical accuracy but to create moral mirrors. Each life is either a perfect virtue model or a cautionary tale, with readers copying the hero exactly. The parallel structure supposedly shows Greek and Roman virtues as interchangeable universals, hiding moral ambiguity. Also, the "ethical stereoscopy" concept is mentioned as a tool for calibrating virtue only in virtuous pairs. The user is skeptical, especially about ignoring flaws, citing Alcibiades and Demetrius.

  First, I need to verify Plutarch's actual approach. I recall that while Plutarch is interested in ethics, he doesn't suppress flaws. Alcibiades is a prime example where he shows both brilliance and moral failings. Similarly, Demetrius is portrayed as a warning but with complexities. So the claim that he presents pure exemplars seems incorrect.

  Next, the parallel structure's purpose. The roommate says it's to prove virtues are universal. But Plutarch's prefaces often highlight cultural differences. For instance, comparing Lycurgus and Numa shows different societal values. The universality might be overstated; Plutarch acknowledges distinct virtues shaped by context.

  Then there's "ethical stereoscopy." Is this a real term? Upon checking, it's a modern concept applied to Plutarch. The idea of comparing two lives to gain deeper moral insight makes sense, especially with virtuous figures. But Plutarch also uses flawed lives for nuanced lessons, not just simple warnings. Coriolanus and Alcibiades serve as complex examples where virtues and vices coexist, offering more than just caution.

  The user's deeper need might be to validate their interpretation against their roommate's, possibly for academic validation. They might also seek a nuanced understanding beyond the seminar's surface level. They mentioned tagging along lectures, so they might lack formal training but are keen to engage critically.

  I should address each claim: moral mirrors, suppression of flaws, universal virtues, stereoscopy. Point out where the roommate is partially right but oversimplified. Emphasize Plutarch's complexity and use of contrasts. Mentioning specific Lives like Alexander-Caesar or Fabius-Pericles can illustrate nuanced comparisons. Also, clarify that modern historians critique his methods but still value his insights and sources.

  Need to ensure the response balances scholarly views with accessible examples. Highlight that moral ambiguity is present, parallels aren't about interchangeability, and stereoscopy is a useful modern framework but not Plutarch's explicit term. Conclude that the summary oversimplifies Plutarch's work, missing his depth and ethical complexity.
answer: |-
  That's an impressively articulate but ultimately oversimplified take from your roommate. While he grasps key aspects of Plutarch's *moral purpose*, he misrepresents the *method* and *nuance* of the *Parallel Lives*. Here's a breakdown of his claims:

  1.  **Claim: Plutarch pairs lives "not to do history but to build moral mirrors."**
      *   **Accurate:** This is fundamentally correct. Plutarch explicitly states his purpose in the prologue to the *Life of Pericles*: "It is not Histories that I am writing, but Lives... a noble deed or a word... may reveal far more of a man's character than battles where thousands fall." His goal is ethical instruction through character study, not chronicling events with strict historical accuracy. He selects and emphasizes details that illuminate virtue or vice.

  2.  **Claim: "He curates each life so the subject comes out as either a pure exemplar of virtue or a clear cautionary tale... deliberately hides moral ambiguity."**
      *   **Mostly Inaccurate / Common Simplification:** This is where your roommate goes significantly astray. Plutarch absolutely *does not* hide flaws in virtuous figures or complexity in flawed ones. His biographies are famed for their psychological depth and acknowledgment of human contradictions:
          *   **Flawed "Heroes":** Pericles faces criticism for arrogance and potentially starting the Peloponnesian War. Themistocles is ambitious and cunning, potentially treacherous. Alexander the Great exhibits immense courage and vision alongside terrible rages, paranoia, and drunkenness. Plutarch wrestles with these complexities, not suppresses them.
          *   **Nuanced "Villains":** Alcibiades and Demetrius Poliorcetes ("The Besieger") are prime examples *against* this claim. Plutarch presents them as brilliant, charismatic, and capable of great deeds, *but* fatally flawed by ambition, recklessness, and moral laxity. They are not simple "cautionary tales" but complex studies of wasted potential and the dangers of unchecked character traits. Coriolanus is portrayed with immense sympathy for his virtues (courage, integrity) alongside his fatal flaw (pride and lack of political flexibility).
          *   **Moral Ambiguity is Central:** Plutarch often presents multiple perspectives on controversial actions, invites the reader to judge, and explicitly discusses the mixed nature of his subjects. He understands that virtue and vice are often intertwined. Your instinct about Alcibiades and Demetrius is spot-on – they are Plutarchan archetypes of complex, flawed brilliance.

  3.  **Claim: "The reader is supposed to pick a hero and copy him exactly."**
      *   **Inaccurate:** Plutarch explicitly rejects simple imitation. In the *Life of Timoleon*, he compares learning from lives to a feast where we sample different dishes, taking what suits us best. He emphasizes discerning judgment, understanding context, and adapting principles rather than copying actions verbatim. The complexity of his portraits necessitates this nuanced approach.

  4.  **Claim: "The parallel structure... proves that Greek and Roman virtue are interchangeable universal types... flattens real cultural differences."**
      *   **Partially Accurate but Oversimplified:**
          *   **Universal Ethos:** Plutarch *does* believe in universal moral principles (virtue is virtue, vice is vice) accessible to both Greeks and Romans. He aims to show that greatness of character transcends specific cultural origins. The pairing highlights these shared potentialities.
          *   **Flattening Differences? Not Really:** However, he doesn't ignore cultural context. The comparisons often *highlight* differences in political systems, societal values, and historical circumstances shaping how virtue manifests. He compares Lycurgus (Sparta's lawgiver focused on austerity and military discipline) with Numa (Rome's peaceful, religious king), explicitly contrasting their societal models. The pairing serves to explore *both* similarity *and* difference, using one culture to illuminate the other. It's about comparative ethics, not asserting identity.

  5.  **Claim: "Ethical Stereoscopy" – comparing two lives creates a 3D moral image for precise calibration (only applied to virtuous pairs).**
      *   **Insightful Modern Gloss, but Not Plutarch's Term / Partially Accurate Application:**
          *   **Real Insight?** This is actually a sophisticated and insightful modern scholarly concept used to describe Plutarch's method (e.g., scholars like Christopher Pelling). By juxtaposing two figures, Plutarch forces the reader into a comparative mode. Looking at Pericles *alongside* Fabius Maximus (both known for cautious, defensive strategy) allows deeper insight into the specific qualities and contexts of that kind of leadership than either life alone. Comparing Alexander and Caesar highlights different manifestations of ambition and drive. This *is* a powerful way Plutarch achieves his moral aim.
          *   **Only for Virtuous Pairs? Inaccurate:** While the concept is often discussed regarding virtuous figures, Plutarch absolutely uses it for flawed/complex figures too. Comparing Alcibiades and Coriolanus reveals different paths to political self-destruction driven by pride and alienation. Comparing Demetrius and Antony explores the destructive potential of charisma, excess, and volatile ambition across cultures. The comparison itself *is* the calibration tool, revealing nuances even (or especially) in vice and failure. Your roommate is wrong to limit this effect to virtuous pairs.

  6.  **Claim: "This is why modern historians don't take Plutarch seriously."**
      *   **Overstated / Contextual:** Modern historians *do* take Plutarch seriously, but with critical awareness:
          *   **Source Criticism:** They recognize he wasn't writing modern "scientific" history. He uses sources selectively for moral purpose, anachronistically applies contemporary ethics, and sometimes prioritizes a good story over verifiable fact.
          *   **Value:** However, his immense value is acknowledged:
              *   He preserves fragments of many lost sources.
              *   He provides unparalleled insight into Roman views of Greeks and vice-versa in the early Imperial period.
              *   His focus on character and motivation offers a unique (if subjective) perspective absent from more event-focused historians.
              *   His literary skill and psychological insights remain compelling. Historians use him critically, not dismiss him outright.

  **Conclusion:**

  Your roommate correctly identifies Plutarch's core *purpose* (moral instruction through biography) and the *idea* behind the parallels (highlighting shared ethical potential). He also lands on a genuine, insightful modern interpretation ("ethical stereoscopy") as part of Plutarch's method.

  **However, his summary significantly errs by:**

  1.  **Overstating Plutarch's suppression of flaws and ambiguity.** Plutarch revels in complexity and contradiction; it's central to his ethical project.
  2.  **Misrepresenting Plutarch's view on imitation.** He advocates discernment, not copying.
  3.  **Oversimplifying the parallel structure's effect.** It explores similarity *and* difference, context *and* universal principle, not just interchangeable types.
  4.  **Limiting the "stereoscopy" effect to virtuous lives.** The comparative method illuminates vice and complexity just as powerfully.
  5.  **Overstating Plutarch's dismissal by historians.** He's used critically as a valuable source, not ignored.

  Your skepticism, especially regarding the portrayal of flawed characters like Alcibiades and Demetrius, is well-founded. Plutarch is far more sophisticated, psychologically nuanced, and less dogmatic than the "pure exemplar/cautionary tale" model suggests. The "ethical stereoscopy" concept is valid and useful, but it applies across the spectrum of his subjects, not just the virtuous ones. Plutarch's genius lies in using comparison to reveal the *multifaceted* nature of character and virtue, not to flatten it into simple types.
