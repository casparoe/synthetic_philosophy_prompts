prompt: |-
  I was arguing with my roommate last night about Plutarch's Parallel Lives — he's in an intro classics semanar and I'm just tagging along to the lectures because I like the professor's style. He summed up Plutarch's whole biography project like this: "Plutarch pairs Greek and Roman lives not to do history but to build moral mirrors. He curates each life so the subject comes out as either a pure exemplar of virtue or a clear cautionary tale, and the reader is supposed to pick a hero and copy him exactly. The parallel structure is basically a framing trick to prove that Greek and Roman virtue are interchangable universal types, and he deliberately hides moral ambiguity because he thinks biography should work like hagiography — you learn from saints, not from flawed people."

  He also said this is why modern historians don't take Plutarch seriously: he treats biography as moral instruction instead of factual record, and his pairing method flattens real cultural differences into one-size-fits-all ethical templates. There's this idea he mentioned too — something about "ethical stereoscopy" — where comparing two lives creates a 3D moral image that lets the reader calibrate their own virtue more precisely. But he said Plutarch only applies this to the virtuous pairs, not to the flawed ones, because flawed lives are just warnings, not calabration tools.

  Something about this sounds wrong to me, especially the part about hiding flaws — I could swear Alcibiades and Demetrius are full of contradictions and failures. My roommate insists I'm confusing Plutarch with later Christian hagiographers and that the "ethical stereoscopy" thing is the real point everyone misses. Is this summary fair? Can you go through the main claims and tell me what's accurate, what's a common simplification, and what's just wrong? Specifically, does Plutarch actually suppress moral ambiguity to create pure types, is the parallel structure really about interchangable universal virtues, and is this "stereoscopy" idea a real part of his method or just a modern gloss?
