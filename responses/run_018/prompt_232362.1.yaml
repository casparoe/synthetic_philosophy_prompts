  Therefore, the underdetermination in (4) is not as radical as claimed, and we can use principles of simplicity and generalization to choose the true reward function over the junk.

  How does preference inference survive? We can still do IRL by assuming that the reward function is structured (e.g., linear in features) and by using regularization to prefer simpler rewards. In everyday attribution, we assume that preferences are stable and based on features of the options (e.g., tea vs. coffee) and not on arbitrary state-action pairs.

