  We are given an argument in steps (1) to (6) that concludes we can never know what anyone wants because behavioral evidence radically underdetermines the reward function. The user finds (5) and (6) in conflict and wants to know where the argument breaks.

  Let me restate the argument:

  (1) The only evidence we have about an agent's preferences is their behavior; no direct readout of reward.

  (2) Inverse Reinforcement Learning (IRL) formalizes this: from behavior, we try to recover the reward function.

  (3) However, the mapping from behavior to reward is one-to-many. In the discounted setting, we can cook up a reward function that makes the observed policy optimal by giving a reward of 1 for the action taken by the policy in each state and 0 otherwise. Thus, the same behavior is consistent with the true reward and many "junk" rewards.

  (4) Therefore, behavioral evidence alone does not discriminate between these reward functions; the data underdetermine the preferences.

  (5) Hence, we cannot genuinely infer what another agent values; any attribution is arbitrary.

  (6) But (5) is absurd because we do make successful preference attributions (e.g., flatmate prefers tea to coffee).

  The user asks for at least three candidate breakpoints before settling.

  Candidate Breakpoints:

  1. Step (3): The argument about cooking up a reward function that makes the policy optimal is technically correct in a tabular MDP with no constraints on the reward function. However, this reward function is state-action based and depends on the entire policy. But note that in the example, the cooked-up reward function is defined as giving 1 for the action taken by the policy in each state and 0 otherwise. This reward function is not only arbitrary but also depends on the entire policy. However, in real life, we often observe a limited set of behaviors and in limited states. Moreover, the reward functions we consider in practice are often structured (e.g., linear in features) and not arbitrary.

  2. Step (4): The underdetermination claim. Even if there are multiple reward functions that can explain the behavior, it does not follow that behavioral evidence alone cannot discriminate at all. We might have additional constraints (e.g., simplicity, prior knowledge) that let us choose between them. Moreover, the argument ignores that we observe behavior in many different states and over time. The junk reward function (which gives 1 only when the policy is followed) might not generalize to new states. In fact, the true reward function is expected to be simpler and more general.

  3. Step (1): Is behavior the only evidence? The argument assumes that we only have behavioral evidence. But in humans, we might have additional evidence: self-reports, neural data, evolutionary considerations, etc. However, the argument is set in the context of IRL, which typically uses behavior. Also, the flatmate example is behavioral. So rejecting (1) might be costly because it forces us to rely on non-behavioral evidence, which might not always be available.

  4. Step (5): The inference from underdetermination to impossibility of genuine inference. Even if the data underdetermine the reward function, we might still make reasonable inferences by using additional principles (e.g., Occam's razor). Moreover, the fact that we can cook up an alternative reward function does not mean that it is equally plausible. The junk reward function in (3) is extremely complex and state-specific. In practice, we assume that the reward function is simpler and has a structure that generalizes.

  5. Step (2): The claim that IRL is the precise formalization. But IRL methods often make assumptions (e.g., the reward function is linear in features, or that it is stationary) that break the one-to-many mapping. In fact, with such assumptions, the mapping might become one-to-one or at least constrained.

  Now, I need to brainstorm at least three candidate breakpoints. Let me list three:

  Candidate 1: Step (3) is misleading because it ignores the role of generalization. The cooked-up reward function (state-action specific) is not a plausible reward function because it does not generalize to unseen states. We typically assume that the reward function is defined in terms of features of the state and action, so it must be the same in similar states. If we only observe a subset of states, then the true reward function must be consistent with the behavior in the unobserved states as well. The junk reward function would fail in unobserved states because it assigns 0 to every unobserved state-action, which might lead to a different policy. Therefore, if we require the reward function to be defined in a way that is independent of the entire state trajectory and generalizes, then the set of reward functions that are consistent with the behavior in a training set of states and also generalize to other states might be small.

  Candidate 2: Step (4) overstates the underdetermination. The underdetermination is only radical if we consider arbitrary reward functions without any constraints. But in practice, we have constraints. For example, we might assume that the reward function is sparse, or linear in some features, or that it has a simple form. Moreover, we observe the agent in multiple states and over time. The junk reward function in (3) is only consistent if we observe every state and if the agent is optimal in every state. But if we don't observe every state, then the junk reward function might not be consistent with the behavior in unobserved states. Therefore, the underdetermination is not as bad as claimed.

  Candidate 3: Step (1) is too strong. While the primary evidence might be behavioral, we often have access to other forms of evidence. For example, in the case of the flatmate, we might ask her why she chose tea. Self-reports can provide additional evidence. Also, in the context of IRL, we might use demonstrations in multiple environments to break ties. However, the argument is set in a reinforcement learning context where only behavior is available. Rejecting (1) would require expanding the evidence base beyond behavior, which might not be possible for non-human agents.

  Now, I must settle on one.

