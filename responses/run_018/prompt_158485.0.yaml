prompt: |-
  Hey, so I used to do molecular bio before I retired, and lately I've been digging into philosphy — specifically Pearce's hedonistic imperative, the idea that we should use biotech to abolish suffering altogether. I was arguing with my book club (mostly retired scientists like me) about whether tweaking nociception genes in wild rodent populations counts as abolishing suffering or just fancy wireheading. So here's my ask: what's your actual credance, on a scale of 0 to 1, that by 2100 we'll have edited the germline of at least one free-living mammal species to eliminate nociceptive experience without destroying survival behaviours, and that philosophers and the public mostly frame this as a moral victory rather than reward tampering?

  Don't just hand me a bare number — decompose it into parts: the prob the biotech works cleanly without side effects, the prob it doesn't turn the animals into behavioural zombies, the prob ethicists agree there's an actual obligation to do this for wild animals, and the prob the wireheading/political objection doesn't kill the project. Combine them however you think is right, tell me which term you're least confident in, and say what kind of empirical result or argument would move that term most. For context, my friend puts the whole package at about 0.15, while I think it's closer to 0.40 — where do you sit, and is our disagreement mainly about the technology, or about whether reducing suffering is even the right kind of good to justify messing with nature?
