  Dropping convexity is third. Non-convex or discrete sets are common in real situations, like indivisible goods. But if KS's intuition breaks without convexity, it might be a technical limitation rather than a conceptual flaw. Still, it's important for applicability but less urgent than the first two.

  Comparing KS to other solutions like proportional or egalitarian is fourth. While interesting, it's more of a downstream analysis. Without addressing the multi-party or monotonicity issues, such comparisons might be premature. This could be explored after the core concerns are tackled.

