  We are going to construct a thought experiment that introduces a specific structural feature to make a zombie scenario genuinely conceivable while giving the physicalist a non-question-begging way to block the move from conceivability to possibility.

  **The Thought Experiment: The Quantum Echo**

  Imagine a being, Echo, physically identical to a normal human in every respect: same neural wiring, same behavior, same functional organization. However, we introduce a specific structural feature: Echo's brain states are *quantum-entangled* with a duplicate brain in a parallel universe (a many-worlds interpretation scenario). This entanglement is such that every neural event in Echo's brain has a perfect counterpart in the duplicate. Crucially, the duplicate brain is entirely non-conscious (it's just a physical duplicate without any experience). Because of the entanglement, we can conceive that Echo's brain, while physically identical to a normal human brain, might be "merely echoing" the physical states without generating consciousness, since the conscious aspect is tied to the duplicate in the other universe. Importantly, we are not changing any physical laws; we are just adding a structural relation to a duplicate. (Note: We assume the duplicate is not in our universe and has no causal interaction with ours beyond the entanglement.)

  **Walkthrough:**

  1. **Dualist Reasoning (Conceivability to Possibility):**  
     The dualist argues: we can clearly conceive of Echo as physically identical to us but lacking consciousness because we are imagining that the conscious aspect is "drained" into the duplicate universe. Since we can conceive this without contradiction, it must be metaphysically possible for a physical duplicate to lack consciousness. Therefore, consciousness is not logically supervenient on the physical, implying dualism.

  2. **Physicalist Block Using the Injected Feature:**  
     The physicalist responds: the conceivability of Echo as non-conscious relies on the *structural feature* of quantum entanglement with a duplicate. This feature introduces a *relational property* (being entangled with a non-conscious duplicate) that is not part of the intrinsic physical description of Echo's brain. Thus, when we conceive of Echo lacking consciousness, we are not conceiving of a world where the *intrinsic* physical facts are the same but consciousness is absent; we are conceiving of a world with an *additional* relational fact (entanglement) that explains the absence. Therefore, the conceivability of Echo does not show that a physical duplicate in *our* universe (without entanglement) could lack consciousness. The physicalist blocks the inference by showing that the scenario is not a genuine physical duplicate in the relevant sense (because it has an extra relational property) and thus does not threaten physicalism about our universe.

  3. **What Collapses if We Strip the Feature?**  
     If we remove the entanglement feature, we revert to the standard zombie: a being physically identical in every intrinsic respect but without consciousness. Then, the dualist argument proceeds as usual: if we can conceive it, it must be metaphysically possible. Without the entanglement, the physicalist cannot block the inference without appealing to the completeness of physics (which would be question-begging). Thus, the standard zombie argument stands unless the physicalist can challenge the conceivability.

  **Dualist Attack on the Setup:**  
  The dualist might argue that the setup smuggles in physicalism by assuming that the entanglement relation is a purely physical relation that does not inherently involve consciousness. They might claim that if consciousness is fundamental, then even the entangled duplicate might have consciousness (unless we stipulate it doesn't, which is question-begging). Thus, the dualist could say that the scenario doesn't genuinely conceive of a physical duplicate without consciousness because the entanglement itself might be a carrier of consciousness, or because the stipulation that the duplicate is non-conscious is not justified by the physical description alone.

  **Verdict:** Quantum entanglement with a non-conscious duplicate in a parallel universe.
