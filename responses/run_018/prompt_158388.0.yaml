prompt: |-
  I sit on my town's civic-participation review board and we gotta decide by next wednesday whether our public-hearing rules should let religious citizens ground objections to zoning changes in scriptural authority, or force them to reframe everything in secular terms. One faction says Rawlsian public reason is basically dead on arrival; the other says letting scripture into the record corrupts democratic equality. Draft the short memo I'll circulate before Thursday's vote: recommend one concrete rule-change with a 30-day rollout, engage seriously with the best argument on the losing side, and don't include any reading lists or citations. Format it as exactly five numbered points, each just a sentence or two, with no intro or conclusion. Make sure you address the covenantal reciprocity worry our local pastor raised—that religious citizens owe secular translations only if the state owes them religious accomodation in return—without treating it as a strawman.
reasoning: |-
  Okay, the user is on a civic-participation review board and needs a memo by Thursday about whether religious objections to zoning changes can be based on scripture or must be secular. They need a concrete rule change with a 30-day rollout, to address both sides fairly, and specifically handle the pastor's argument about reciprocity without strawmanning. 

  First, I need to understand the core conflict. One side says forcing secular reframing kills genuine participation (Rawlsian public reason being "dead"), while the other fears scripture corrupts democratic equality. The pastor's "covenantal reciprocity" point is crucial—it argues religious citizens aren't obligated to translate unless the state accommodates them in return. 

  For the recommendation, I'm leaning toward allowing scripture in testimony but requiring secular translation. This balances inclusion with accessibility. The 30-day rollout gives time for training and adaptation. 

  Now, structuring the memo in exactly five numbered points: 
  1. Recommend the rule change clearly. 
  2. Address the losing side's strongest argument (that translation burdens religious citizens). 
  3. Engage the reciprocity concern head-on by acknowledging the state's parallel duty to accommodate. 
  4. Outline practical rollout steps. 
  5. Frame it as strengthening democratic dialogue. 

  The reciprocity point needs careful handling—it's not a strawman if I concede the state must reciprocate with accommodations. I'll tie this to existing legal precedents like RLUIPA without naming them. 

  User's deeper need might be unifying a divided board; the memo should model bridge-building by taking all concerns seriously. Avoiding citations keeps it action-focused. Final check: five points, no fluff, concrete rule, and pastor's worry addressed substantively.
answer: |-
  **MEMORANDUM: HEARING TESTIMONY RULE RECOMMENDATION**

  1.  **Recommend adopting the rule: "While citizens may reference scripture or religious tenets during testimony on zoning matters, they must concurrently articulate a secular rationale grounded in tangible community welfare (e.g., safety, traffic, environment, property values) for any objection or request to be formally considered in the Board's decision-making."**  
  2.  **Acknowledge the losing argument: Mandating secular translation *does* risk devaluing deeply held religious perspectives by asking citizens to reframe core convictions in unfamiliar terms, potentially chilling participation and undermining Rawlsian ideals if citizens perceive the requirement as hostile.**  
  3.  **Address covenantal reciprocity: The pastor's concern is valid – expecting religious citizens to translate their reasoning *does* imply a reciprocal obligation for the state to provide reasonable religious accommodations where feasible (e.g., scheduling, access), recognizing this fosters mutual respect within a pluralistic framework.**  
  4.  **Implement a 30-day rollout: Effective one month from adoption, staff will brief all relevant boards, update speaker guidelines/forms to clearly state the requirement, and train clerks to gently remind speakers *during hearings* to provide the secular rationale without suppressing religious expression.**  
  5.  **This approach balances inclusion and legitimacy: It respects diverse voices by allowing religious expression into the public record while ensuring objections impacting shared community outcomes are accessible and evaluable by all citizens and officials, strengthening deliberative fairness.**
