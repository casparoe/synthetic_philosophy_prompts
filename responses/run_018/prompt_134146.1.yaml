answer: |-
  Here is the poem, designed to embody the tension of compound predication through structural shifts, followed by the requested contextual note:

  **The Dividing Gate**  

  *The form holds* the arch of bone and height,  
  A thing that moves through day and night.  
  *The color divides* the snow’s command—  
  White is not horse at the gatekeeper’s hand.  

  *The form holds* the meadow’s grazing sound,  
  A unity of hoof-fall on the ground.  
  *The color divides* what the eye confides—  
  White is not horse where the boundary resides.  

  *The color divides* the claim you bring,  
  While essence strains toward a single thing.  
  *The form holds* fractured in the plea—  
  “Is this *a horse*, or white, that stands by me?”  

  *The form holds the color divides* the space  
  Between the name and the named thing’s face.  
  Ash on wind, unsettled snow—  
  Is it lost, or found, where the predicates go?  

  ---

  **Contextual Note for Seminar:**  

  **Settled:**  
  1.  The dialogue "On the White Horse" is attributed to Gongsun Long (c. 325–250 BCE), a key figure associated with the School of Names (Mingjia).  
  2.  The Mingjia were primarily concerned with the relationship between names (ming 名) and actualities (shi 實), and the logical paradoxes arising from language.  
  3.  The text explicitly argues "a white horse is not a horse" (bai ma fei ma 白馬非馬).  

  **Contested:**  
  1.  **Core Purpose:** Whether the paradox critiques logical categories (universals vs. particulars), explores reference (how words point to objects), exposes linguistic ambiguity, or is primarily a rhetorical/sophistic exercise remains debated.  
  2.  **"Universals":** While often discussed in terms resembling Platonic universals ("horseness"), it's controversial to impose this Western framework directly. The Mingjia focus was likely more on functional classification within language and social practice than abstract metaphysical entities.  
  3.  **Predication vs. Reference:** Is the paradox fundamentally about *what we say* about an object (predication: "This is white," "This is a horse") or *what we're referring to* when we use a compound term ("white horse")?  
  4.  **Sophistry vs. Rigor:** Some scholars dismiss it as wordplay; others see meticulous, proto-logical analysis of language.  

  **Where the Poem Takes Liberties:**  
  *   **Focus on Predication & Extension:** The poem strongly favors the interpretation that naming a compound ("white horse") actively *splits* or *reconfigures* the extension (the set of things referred to) compared to the bare term ("horse"). "The form holds" suggests the essence/class captured by "horse"; "the color divides" suggests the qualifying predicate ("white") carves out a subset, altering the identity asserted by the bare term.  
  *   **Structural Embodiment:** The poem prioritizes this "splitting" reading through the refrains' separation, swap (showing mutual exclusivity *in the argument*), and final entanglement (showing the unresolved tension inherent in the compound term). It downplays other potential readings (e.g., purely semantic, rhetorical, or metaphysical).  
  *   **Metaphorical Extension:** Images like "the gatekeeper’s hand," "boundary," "ash on wind," and "unsettled snow" evoke the *consequence* of this splitting – barriers, loss, ambiguity – which, while resonant with the paradox's effect, are poetic interpretations of its implications rather than direct claims from the text.  

  The poem uses structure and metaphor to *perform* the tension central to a prominent interpretation of Gongsun Long's argument, highlighting the disruptive power of compound terms on the identity promised by simple names.
