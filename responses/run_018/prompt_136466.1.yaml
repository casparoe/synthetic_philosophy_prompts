  Can you draft my Q&A prep sheet? I want the objections ordered by how much damage they'll do in this room, phrased exactly like that audience would phrase them — not generic AI-risk stuff, but the kind of thing a Heideggerian or a historian of computing would actually say, with their vocabulary intact. For each objection, give me a reply I can deliver in about two minutes and flag honestly where that reply is softest. Tell me what I should concede upfront so I don't look defensive, and include the one question I'm dreading — probably something about whether I'm smuggling technological determinism back in through a side door — with a strategy for not collapsing on the spot. Please write your answer in British English; I keep getting American spellings and it throws me off.
