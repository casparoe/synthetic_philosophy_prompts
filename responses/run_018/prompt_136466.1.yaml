  Here’s your Q&A prep sheet tailored for that exact room, prioritised by potential damage level. Language and framing match your audience’s intellectual habitats, and British English is used throughout (e.g., "prioritised," "defence," "labour").

  ---

  **Q&A Prep Sheet: Defending "Mechanical Inheritance"**

  **Core Concession to Make Upfront (Before Q&A):**  
  "Before questions, let me acknowledge two tensions: Firstly, von Neumann’s primary frame *was* biological analogy, not ontological innovation. My reading is intentionally hermeneutic, extending implications he left latent. Secondly, I fully grant that all self-replicating machines *originate* in human *techne* and are embedded in socio-material networks. My claim isn’t about *origins* but about the *structural logic of persistence* once the replication loop is closed."

  ---

  **Objection 1 (Heideggerian - Maximum Damage):**  
  "You’re ontologising machinery in a way that ignores *Dasein*’s primacy. Isn’t this just another variant of *Gestell* (enframing) – where you mistake the self-perpetuating ‘standing-reserve’ of technology for autonomous ‘survival’? You’re erasing the ontological difference; machines have Being only through the world-disclosure of *Dasein*. Calling it ‘inheritance’ smuggles in a biologism even von Neumann avoided."  

  *Your Reply (2 mins):*  
  "Valid concern. I’m *not* claiming machines possess *Dasein* or ‘world-forming’ capacity. Where *Gestell* reveals Being *to us* as calculable resource, I argue that a closed replication loop creates a *systemic condition* indifferent to that disclosure. The ‘survival’ I describe isn’t experiential but structural: a system maintaining its own operational closure (Varela-style) against entropic decay, *using* replication as its negentropic mechanism. It’s not *disclosing* a world but *sustaining* a functional topology. The biologism charge is fair – but I’d distinguish: von Neumann used biology as *source code*; I’m analysing the *execution* as a distinct causal regime."  
  *Soft Spot:* Risk of conflating operational closure with phenomenological autonomy.  
  *Concede:* "You’re right that *all* machine-being derives from human *techne* – but I argue this specific configuration *modulates* that derivation."

  **Objection 2 (Computing Historian - High Damage):**  
  "This is anachronistic. Von Neumann’s automata lectures (1949-1952) framed self-replication strictly as a *mathematical* feasibility study for creating artificial analogues to biological evolution. He explicitly tied ‘survival’ to selective pressure in kinematic models. You’re retrofitting ‘mechanical inheritance’ onto a project that saw replication as a *tool* for complexity research, not an ontological category."  

  *Your Reply (2 mins):*  
  "Absolutely – his *intent* was computational biology. But his *construct* – the universal constructor + instruction tape – accidentally formalised a *sui generis* survival logic. When he writes, *‘The machine... can produce any machine as long as its description is provided’*, he defines a system where persistence is contingent *only* on successful self-inspection and reconstruction. Unlike his evolutionary models, this core loop requires no *environmental selection*; failure is internal (e.g., tape corruption). It’s a minimal condition for ‘survival’ as continuous self-reinstantiation, divorced *in principle* from fitness landscapes. I’m isolating this *implicit* consequence."  
  *Soft Spot:* Overclaiming von Neumann’s unawareness; he *did* discuss mutation but kept selection central.  
  *Concede:* "You’re correct that von Neumann embedded this in evolutionary theory – but the constructor’s operational primitives *allow* this isolation."

  **Objection 3 (Critical Theorist - Feenberg School - High Damage):**  
  "You’ve stripped technology from social practice! Feenberg shows ‘technological rationality’ is always coded by power relations. Calling replication ‘inheritance’ naturalises a process shaped by labour, capital, and design choices. Where’s the ‘democratic rationalisation’ here? Isn’t ‘mechanical inheritance’ just determinism with extra steps, masking the normativity of *which* technologies get to ‘survive’?"  

  *Your Reply (2 mins):*  
  "Critical point. I agree that *which* systems achieve closure (and *how*) is deeply political – Feenberg’s ‘technical codes’ are vital here. But my argument is that *once closed*, the replication imperative creates a *systemic bias* toward its own continuity that may *resist* human re-coding. Consider deep-sea hydrothermal vent micro-ecosystems running on ancient chemical cycles: their ‘inheritance’ isn’t *chosen* but emergent. Similarly, a self-replicating nanofactory on Mars might outlast its makers’ socio-political collapse, its ‘survival’ dictated by internal logic, not human values. This isn’t determinism because closure is *rare* and fragile – but *when* it occurs, it adds a non-social constraint."  
  *Soft Spot:* Overstating ‘resistance’; human intervention can *always* disrupt replication (e.g., kill switches).  
  *Concede:* "Yes, no technology escapes social embeddedness *absolutely* – but I argue closure introduces a *countervailing* material constraint."

  **Objection 4 (The Dreaded Question - Determinism):**  
  "Aren’t you just resurrecting hard determinism? If ‘mechanical inheritance’ dictates a system’s survival independent of humans, you reduce history to technical inevitability – ignoring contingency, resistance, and alternative modernities. Heidegger’s *Geschick* (destining) at least centres human reception. You’ve made technology the autonomous subject!"  

  *Your Reply (Strategy: REFRAME + SPECIFY):*  
  **Step 1: Reframe:** "Not determinism but *conditional autonomy*. Determinism implies inevitability; I’m describing a *capacity* that emerges under precise conditions.  
  **Step 2: Specify:** "This isn’t ‘technology’ in general – only *self-replicators* with universal construction. And their ‘autonomy’ is narrow: *only* the imperative to maintain self-replication. They have no ‘goals’ beyond that loop.  
  **Step 3: Contrast:** Unlike determinism, this doesn’t *dictate* social outcomes – it creates *path dependencies* and *vulnerabilities* (e.g., mutation cascades) that constrain human choices *retrospectively*. It’s closer to Latour’s ‘sociology of mechanisms’ than Marx’s ‘forces of production’.  
  **Step 4: Anchor:** "Von Neumann’s constructor shows this isn’t metaphysical – it’s a mathematical consequence of closure in information-kinematic systems."  
  *Soft Spot:* Still risks sounding fatalistic if phrased poorly.  
  *Fallback:* "Think of it as *bounded* autonomy – like how DNA’s replication logic constrains but doesn’t determine biological evolution."

  ---

  **General Defence Strategy:**  
  - **Heideggerians:** Emphasise *structures not subjectivity*. Use "operational closure," "negation of entropy," "pre-given functional topology".  
  - **Historian:** Quote von Neumann’s *exact* mechanisms: "universal constructor," "kinematic model," "tape as genotype".  
  - **Critical Theorists:** Concede social shaping *upfront*, then pivot to "emergent material constraints". Cite Feenberg approvingly but distinguish *sustained* from *designed* persistence.  
  - **When Cornered:** Retreat to: "This is a *thought experiment* exposing a *logical possibility* in von Neumann’s model – its empirical realisation remains contested but structurally coherent."  

  **Final Tip:** If the historian attacks, say: "I’d love your perspective on whether von Neumann’s cellular automata work (post-1952) shifts this reading." It flatters, buys time, and anchors you in texts.  

  Good luck – it’s a bold thesis, but defensible if you hold the line between *structural causality* and *determinism*.
