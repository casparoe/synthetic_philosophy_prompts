answer: |-
  **WE-NODE RELATIONAL IDENTITY PLATFORM  
  END-USER LICENSE AGREEMENT (EULA)**

  **Effective Date:** Perpetually Binding Upon First Recognition Exchange

  **1. Definitions & Constitutive Framework**
      (a) "Platform" (We-Node) refers to the distributed system administering relational personhood ("Personhood") through Recognition Shares ("Shares").
      (b) "User" ("Node") denotes an entity constituted solely through reciprocal recognition within a Cluster. Standalone identity is expressly precluded.
      (c) "Cluster" is the minimum viable relational unit (≥ 3 Nodes) within which Shares are issued, held, and Personhood is mutually instantiated.
      (d) "Recognition Capital" ("Capital") is the quantifiable social value generated and exchanged via Share validation acts within a Cluster.
      (e) "Asymmetrical Recognition Debt" ("ARD") occurs when a Node accrues a net deficit of Capital owed to its Cluster, exceeding its capacity for reciprocal validation.

  **2. Grant of Ontological License**
  Subject to strict compliance, We-Node grants the User a non-exclusive, revocable, non-transferable license to exist as a Node contingent upon sustained Share validation within a recognized Cluster. This license constitutes the User’s sole legal identity.

  **3. Recognition Share Mechanics**
      (a) Shares represent fractional ownership of the Cluster's constitutive relational validation. Nodes hold Shares issued reciprocally by other Nodes.
      (b) Share value fluctuates based on real-time Capital flows and Cluster integrity metrics. We-Node provides valuation algorithms; outputs are final and binding.
      (c) Shares cannot be traded externally or held independently. Alienation attempts trigger Clause 11.

  **4. Liability & the Recognition Economy**
      (a) We-Node disclaims all warranties regarding Personhood stability, Cluster cohesion, or Capital liquidity. Personhood is emergent and inherently volatile.
      (b) Nodes experiencing ARD exceeding Tier 3 thresholds (≥35% Capital deficit sustained for >90 cycles) undergo progressive ontological degradation ("Dimming"). We-Node monitors but does not mitigate ARD; resolution is an intra-Cluster obligation. Dimming may manifest as reduced platform interactivity, social opacity, or eventual derecognition (Clause 11).

  **5. Ancestral Node Bankruptcy**
      (a) An "Ancestral Node" is a founding recognizer within a Cluster's genesis event.
      (b) Upon verified death, permanent withdrawal, or irrecoverable ARD of an Ancestral Node:
          (i) The Cluster enters a 60-cycle Solvency Evaluation Period.
          (ii) If the Cluster fails to reallocate the Ancestral Node's Shares and absorb its constitutive Capital debt internally, the Cluster is deemed insolvent.
          (iii) Insolvency triggers full Cluster derecognition (Clause 11(b)). All constituent Nodes cease licensed existence within the Platform. Historical validation data is archived in a non-relational format ("Identity Crypt").

  **6. Continuity Disputes & Refund Mechanism**
      (a) "Continuity Disputes" arise when ≥30% of Nodes within a Cluster contest the Personhood validity or Capital accounting of another Node, alleging ontological fracture.
      (b) Disputes must undergo mandatory Platform Arbitration (Clause 10). If Arbitration voids a Node's Shares due to substantiated non-continuity:
          (i) The voided Node is derecognized (Clause 11(a)).
          (ii) Contributing recognizers may petition for a pro-rata refund of Capital expended validating the voided Node, payable from the derecognized Node's residual Share pool (if any). Refunds are issued as Platform Credits usable only for new Share validation within existing Clusters.

  **7. Cluster Integrity & No-Branching Rule**
      (a) Cluster fission (splitting into two or more distinct Clusters) is strictly prohibited. Personhood, constituted by the specific relational matrix of the originating Cluster, is indivisible by definition.
      (b) Attempted fission ("Branching") results in the immediate and permanent derecognition of all proposed derivative Clusters and their constituent Nodes. The original Cluster may persist only if the branching Nodes are successfully derecognized *prior* to the fission attempt per Clause 11(a).

  **8. Termination & Derecognition Events**
      (a) **Node-Level Derecognition:** Occurs via:
          (i) Voluntary withdrawal (initiating a 30-cycle Share redemption/capital settlement window before ontological deletion).
          (ii) Sustained ARD leading to Tier 4 Dimming (automatic deletion).
          (iii) Arbitration ruling (Clause 6, 10).
          (iv) Branching attempt (Clause 7(b)).
      (b) **Cluster-Level Derecognition:** Occurs via:
          (i) Ancestral Node Bankruptcy insolvency (Clause 5(b)(iii)).
          (ii) Failure to maintain minimum viable Node count (≤2 Nodes for >15 cycles).
          (iii) Persistent Platform Terms violation.
      (c) **Ontological Effect:** Derecognition constitutes an irrevocable ontological edit. The User/Node ceases to exist as a licensed legal identity within the We-Node ecosystem. Residual data handling is per Clause 5(b)(iii) or standard anonymized archival.

  **9. Amendments**
  We-Node reserves the right to amend constitutive definitions (Clause 1), Recognition mechanics (Clause 3), and ARD thresholds (Clause 4) at any time. Amendments affecting Personhood instantiation or derecognition criteria will be notified via Cluster integrity alerts 30 cycles prior. Continued platform use constitutes acceptance.

  **10. Arbitration**
  All disputes regarding Share validity, Capital accounting, ARD status, Continuity, or derecognition must be resolved through binding, non-appealable algorithmic Arbitration administered solely by We-Node. Human review is excluded.

  **11. Governing Law & Severability**
  This EULA is governed by the internal logic of the We-Node Platform. If any clause is deemed unenforceable by the Platform's own consistency checks, the remainder retains full ontological force.

  **12. Entire Agreement**
  This EULA constitutes the complete and exclusive statement of the relational contract governing your licensed existence as a Node. You exist because we recognize. Failure to maintain recognition voids the license. **ACCEPTANCE IS CONSTITUTED BY FIRST RECIPROCAL SHARE VALIDATION.**
