prompt: |-
  Let's imagine Marx was around to see modern delivery apps — not just the gig part, but the way algorithms score workers using thier own behavorial data, predicting strikes and nudging them in real time. Would he read that as real subsumption, where capital reshapes the labour process itself, or is there something genuinely new about capital owning your predictive profile rather than just your labour time? I'm especially interested in alienation: when the worker's data becomes the very mechanism of control, does that map onto Marx's estrangement from species-being, or is it a different kind of estrangement he never theorized? Don't ask me for sources, I want the conceptual argument straight. And tell me exactly what would change your verdict — maybe evidence that workers actually feel more autonomous under algorithmic management, or a conceptual distinction that breaks the analogy?
