prompt: |-
  I am a doctoral student in social ontology working on whether demographic cohorts can constitute genuine kinds rather than mere statistical aggregates, and I am trying to fix my own intuitive judgments into a coherent principle. Here are five cases with my tentative verdicts.

  Case 1: The U.S. “Baby Boomer” grouping, bounded by birth years 1946–1964 and marked by shared structural conditions—post-war economic expansion, suburbanization, and specific welfare-state configurations. I treat this as a real social kind: it supports counterfactual generalizations about wealth accumulation and political alignment that do not collapse into pure age or period effects.

  Case 2: “Generation Z,” defined globally by birth years roughly 1997–2012 and characterized by digital nativity and climate anxiety. I think this is not a real kind, because the putative shared conditions are distributed so unevenly across the global South, rural North, and different national regulatory environments that the cohort fails to ground stable explanatory predictions.

  Case 3: A purely marketing-driven cluster such as the “Pepsi Generation” of 1980s American adolescents, assembled for advertising segmentation without any independent causal structure. Clearly not a kind.

  Case 4: A cohort defined not by birth year but by experiencing a macroeconomic shock during a specific life-stage—for instance, entering the labor market during the 2008–2009 crisis between ages 22 and 30, regardless of birth year. Here I am inclined to say there is a real kind, because the shock produces durable “scarring” effects on earnings trajectories that support predictions across otherwise demographically heterogeneous individuals.

  Case 5: “Millennials” defined jointly by birth years (approximately 1981–1996) and a shared technological trajectory—coming of age with broadband social media. I am genuinely undecided: the technological exposure seems causally relevant, yet the boundaries blur with adjacent cohorts and with pure life-stage effects, so I am tempted to classify this as a hybrid—partly explanatory kind, partly artifact of measurement.

  Is there a single principle—perhaps involving counterfactual robustness, structural position, or what we might call inter-cohort causal closure—that delivers all five verdicts? If not, which judgment should I revise? I am especially troubled by the tension between Case 2 and Case 4: both invoke conditions that cross-cut standard birth-year boundaries, yet I treat them differently. Please state the principle precisely, indicate which cases it accommodates, predict its verdict for a case I have not listed—say, adolescents in one nation who experienced a specific pandemic-lockdown schooling policy that neighboring countries with identical demographics avoided—and be explicit about which of my judgments it must reject if it is to remain simple rather than ad hoc.
reasoning: |-
  Okay, let me try to unpack this doctoral student's problem. They're working on social ontology, specifically whether demographic cohorts can be genuine kinds or just statistical aggregates. They've presented five cases with their intuitive judgments, and they're struggling to find a coherent principle that explains all of them. The key tension seems to be between Case 2 (Generation Z as not a kind) and Case 4 (economic shock cohort as a kind), where both cross-cut birth years but get different verdicts.

  First, I notice their judgments hinge on explanatory power. Baby Boomers (Case 1) support counterfactuals about wealth and politics that aren't reducible to age or period effects. The economic shock cohort (Case 4) has clear causal "scarring" effects. But Generation Z (Case 2) fails because its traits like digital nativity vary too much globally. The Pepsi Generation (Case 3) is clearly artificial. Millennials (Case 5) are a borderline case because technological exposure matters but boundaries are fuzzy. 

  The core conflict: Why is a global birth cohort (Gen Z) rejected while a trans-birth-year shock cohort (Case 4) is accepted? Both transcend traditional boundaries. The student senses inconsistency here. 

  Hmm... what if the unifying principle is about durable causal networks? Not just shared conditions, but whether those conditions create feedback loops that reinforce cohort identity. Baby Boomers' economic advantages compounded over time through policy feedback. The recession cohort's labor market entry created persistent disadvantage. But Gen Z's digital nativity doesn't universally reshape social institutions - it's more passive exposure. 

  For the pandemic lockdown case: Adolescents under a unique schooling policy would form a kind if the policy altered their developmental trajectory in ways that later affect behavior predictably (e.g., socialization deficits impacting workforce entry). But if the effects fade when policy ends, it's not durable. 

  This principle would force revising Case 5: Millennials' social media exposure might qualify if platform algorithms actively shaped their preferences in self-reinforcing ways (e.g., recommendation bubbles creating distinct political identities). But if it's just usage without feedback, it's not a kind. 

  The student might resist giving up the birth-year element entirely, but the cases show temporality matters less than causal architecture. Case 4 proves birth years aren't essential. The principle's elegance comes from ignoring calendar boundaries and focusing on self-sustaining causal structures. 

  Biggest implication: Demographic cohorts are kinds only when membership generates downstream effects via social mechanisms that recognize that membership. It's not about shared traits, but about whether the cohort label becomes causally active in the social world.
answer: |-
  Your cases reveal a consistent underlying principle centered on **durable causal-explanatory cohesion**—specifically, whether cohort membership generates *distinct, counterfactually robust causal effects* that cannot be reduced to mere age, period, or individual-level properties. Here's the unified principle:

  **The Durable Causal Network (DCN) Principle:**  
  *A demographic cohort constitutes a genuine social kind iff:  
  (1) It occupies a shared structural position within a social system,  
  (2) This position generates durable, network-mediated feedback effects (e.g., institutional reinforcement, collective identity formation, or resource channeling),  
  (3) These effects support non-reducible counterfactual predictions about members' behaviors or life trajectories.*

  ### Application to Your Cases:
  | Case | Verdict | DCN Analysis |
  |------|---------|--------------|
  | **1. Baby Boomers** | Genuine Kind ✅ | Structural advantages (e.g., subsidized education, housing policies) created self-reinforcing wealth accumulation loops. Cohort identity became institutionally embedded (e.g., Social Security debates), enabling predictions irreducible to age. |
  | **2. Generation Z** | Not a Kind ❌ | Global heterogeneity prevents shared structural positioning: digital access varies by class/region; climate policies differ nationally. No feedback mechanisms bind the cohort into a causally unified network. |
  | **3. Pepsi Generation** | Not a Kind ❌ | Purely nominal; no institutional mechanisms or feedback loops sustain shared traits beyond marketing exposure. |
  | **4. Recession Cohort** | Genuine Kind ✅ | Macro-shock during formative life-stage creates scarring *and* institutional recognition (e.g., hiring bias against "recession graduates"). Shared position triggers durable network effects (e.g., cohort-specific professional networks). |
  | **5. Millennials** | Hybrid (Revise) ⚠️ | **Revise to Genuine Kind**: Technological exposure created *emergent network effects* (algorithm-driven socialization, platform economies) that reconfigure life trajectories (e.g., delayed homeownership). Blurred boundaries don't negate causal cohesion. |

  ### Resolving the Case 2 vs. Case 4 Tension:
  - **Case 4 succeeds** because the shock creates *institutionally mediated path-dependence* (e.g., employers stereotyping "recession graduates"), generating feedback loops.
  - **Case 2 fails** because "digital nativity" lacks *institutional reinforcement*: A rural Indonesian Gen Z member shares no causal network with a Swedish peer. The label doesn’t alter their social opportunities.

  ### New Case Prediction:  
  **Adolescents under unique pandemic schooling policy**  
  - **Verdict: Genuine Kind** (if policy was sustained).  
  - **Why?** Policy creates shared structural position (e.g., remote learning infrastructure gaps → skill deficits). This would generate network effects (e.g., labor market penalties for "lockdown graduates") and collective identity, supporting counterfactuals ("Had they not been in lockdown schools, their earnings would differ").

  ### Required Judgment Revisions:
  1. **Revise Case 5**: Millennials qualify due to *algorithm-mediated socialization* creating cohort-specific capital (e.g., Instagram-driven entrepreneurship norms). Blurring with Gen Z is a gradation issue, not a cohesion failure.
  2. **Reject "birth-year essentialism"**: Case 4 shows temporal boundaries are secondary to structural positioning. Case 2’s failure isn’t about birth years per se but lack of global causal networks.

  ### Key Strength:
  The DCN Principle avoids ad hocness by demanding **self-reinforcing causal networks**—not just shared experiences. It explains why *institutional recognition* (e.g., policies targeting Boomers, labor markets penalizing recession cohorts) is pivotal: without it, cohorts remain aggregates.

  ---
  *Your intuition about "inter-cohort causal closure" was astute—the DCN Principle formalizes it as institutional feedback loops that make cohort membership causally active in social systems. This grounds kinds in social ontology’s core concern: structure-dependent causal powers.*
