    "capabilities_equality_verdict": "Conditionally fair, if focusing on parity in achievable functionings while respecting autonomy boundaries",
    "key_distinction_applied": "Basic capabilities versus combined capabilities",
    "practical_recommendation": "Equal rent payments; chore/social allocation weighted by energy burden, with you handling lower-impact tasks and offsetting with non-physical contributions",
    "residual_tension": "Determining objective thresholds for 'reasonable accommodation' without medical paternalism or over-reliance on self-reported constraints"
  }
  ```

  **Key Justification**:  
  - **Resources**: Unfair by punishing unchosen disadvantage.  
  - **Welfare**: Unfair by demanding unpaid care labor.  
  - **Capabilities**: Conditionally fair when distinguishing potential (basic) from realistic functioning (combined) and avoiding adaptive preferences. Your health reduces combined capabilities for high-energy tasks, justifying asymmetric duties to achieve equal *freedom from household-induced harm*.  

  **Actionable Steps**:  
  1. Jointly map chores by energy intensity and assign based on sustainable capacity.  
  2. Set clear boundaries: "Discretionary time" is personal; shared obligations should not compromise health.  
  3. Track for 2 weeks, then adjust—prevents "slippery slope" concerns.
