  Hmm, the core challenge is balancing three competing principles: avoiding exploitation of the healthier roommate, acknowledging differential energy conversion rates, and preserving autonomy. The colleague's "strict resources" stance feels like treating humans as interchangeable machines - it ignores how chronic illness transforms objective tasks into subjectively different burdens. 

  Ah! The capabilities approach offers the precise tools needed here. The key is distinguishing between what the user theoretically could do (basic capabilities) versus what they can actually achieve given their condition (combined capabilities). For instance, both roommates have the basic capability for household labor, but the user's combined capability is constrained. Calling this a "private misfortune" is like blaming someone for gravity. 

