prompt: |-
  I'm a master's student in computer science taking a graduate seminar on inverse reinforcement learning and the problem of inferring preferences from observed behavior, and I'm also working part-time in a robotics lab. My job in the lab is to take each new batch of human demonstrations for a manipulation task — someone teleoperating or kinesthetically guiding an arm through, say, setting a table, clearing a cluttered desk, or packing a lunchbox — and hand the lab a reward function that our downstream reinforcement-learning pipeline will optimize. I do this roughly once a week, with twenty to forty demonstrations per task from two or three demonstrators, about a day of my time per batch, no background in cognitive science, and a PI who signs off on the result but mostly wants a documented decision rather than a treatise. The stakes show up downstream: when the learned reward is wrong, the robot doesn't merely fail at the task; it finds ways to satisfy the letter of the objective that none of us intended, and by then the mistake is baked into a trained policy rather than a line of code.

  The course has made me uneasy about how ad hoc my current workflow is. I now know that the same observed behavior can be optimal under many different reward functions, so choosing among them takes auxiliary assumptions; that attributing everything to the reward is a mistake when the demonstrator has a different world model, a short planning horizon, motor noise, or habits; and that the promise of IRL over behavioral cloning is precisely that a recovered objective should transfer to new settings rather than just reproduce the demonstrations. But I don't yet know how to turn those insights into a procedure I can run on a Tuesday. I would like a reusable protocol for each batch of demonstrations: the questions to ask in order, what counts as a sufficient answer before moving on, where the protocol should stop and report that the data underdetermine the reward, and where I should instead go ask a demonstrator a few targeted questions rather than infer more. The protocol should output something like a ranked set of reward hypotheses with a one-paragraph warning label about what each should and shouldn't be trusted for, not a single confident objective, and it should make explicit which steps are real inferences and which are just prior commitments dressed up as inference.

  Could you also run the protocol on two cases so I can see what it produces in practice? The first is a table-setting task in which one demonstrator places glasses far from the edge, moves slowly, and double-checks each placement; I cannot tell whether this person cares about protecting the glassware, has motor tremor or poor depth perception, or is simply cautious. The second is a desk-clearing task in which a demonstrator occasionally knocks small objects over while reaching for larger ones, and my supervisor is fairly confident the correct reward should include a collision penalty. I would particularly like one application to come out against what my supervisor wants to read into the data, if that is what the protocol says, because I need practice defending that kind of refusal. And if I'm misdescribing the task — if "give me a procedure for reward inference" is itself the wrong frame because the hardest parts are one-off modeling decisions rather than a repeatable pipeline — I'd rather hear that plainly than receive a checklist that manufactures false confidence. Where does the procedure refuse to run, and what does it leave to judgment?
reasoning: |-
  We are designing a reusable protocol for inferring reward functions from human demonstrations in a robotics lab setting. The protocol must:
  1. Acknowledge that observed behavior can be optimal under many reward functions and that auxiliary assumptions are needed.
  2. Avoid attributing everything to the reward when factors like different world models, planning horizons, motor noise, or habits may be at play.
  3. Output a ranked set of reward hypotheses with warnings about their limitations, not a single confident objective.
  4. Distinguish between real inferences and prior commitments.
  5. Include steps to determine when data underdetermine the reward and when to ask targeted questions to the demonstrator.

  The protocol should be pragmatic for a one-day-per-batch schedule and output a documented decision.

  We'll structure the protocol as a series of steps with clear outputs and decision points.

  ---

  **Protocol for Reward Inference from Demonstrations**

  **Input:** A batch of demonstrations (20-40 trajectories) for a task, and access to the demonstrators for targeted questions if needed.

  **Output:** A report containing:
  - A ranked list of reward function hypotheses (each expressed in a form suitable for the downstream RL pipeline).
  - For each hypothesis, a paragraph of warnings (what it should and shouldn't be trusted for).
  - A clear indication of which parts are inferred from data and which are prior assumptions.
  - A flag if the data underdetermine the reward and additional data or questions are needed.

  **Steps:**

  1. **Task Description and MDP Setup:**
     - Document the task, state space, action space, and any known constraints (e.g., robot kinematics, object properties).
     - Define the set of features that the reward function might depend on (e.g., distances, collisions, object positions, task completion indicators, smoothness measures). This step is a prior commitment.

  2. **Demonstration Preprocessing:**
     - Align demonstrations in time if necessary (e.g., dynamic time warping).
     - Extract feature statistics (mean, variance, min, max) for each demonstration and overall.
     - Flag any anomalies (e.g., demonstrations that are too short, too long, or have outlier feature values). This step is descriptive and does not involve inference about rewards.

  3. **Behavioral Analysis (without reward inference):**
     - Compute the variance in trajectories for the same task. High variance may indicate multiple strategies, motor noise, or different preferences.
     - Look for consistent patterns and inconsistencies across demonstrations and demonstrators.
     - Identify any systematic errors (e.g., collisions, near misses) and their frequency.
     - This step is about characterizing the data, not inferring the reward.

  4. **Formulate Initial Reward Hypotheses:**
     - Based on the task description and behavioral analysis, list candidate reward functions. These are prior commitments and should be explicitly labeled as such. Examples:
       - A sparse reward for task completion.
       - Dense rewards based on progress toward the goal.
       - Penalties for collisions, near misses, or unsafe states.
       - Rewards for energy efficiency (smoothness) or speed.
     - Also, consider the possibility of multiple reward components (e.g., a weighted sum of features).

  5. **Infer Reward Parameters (if applicable):**
     - If the reward function is parameterized (e.g., weights in a linear combination of features), use an IRL method (e.g., maximum entropy IRL) to estimate the parameters from the demonstrations.
     - Run the IRL method for each candidate reward structure (from step 4) and rank the resulting reward functions by how well they explain the data (e.g., via likelihood or a similar metric).
     - Note: If the IRL method fails to converge or the results are highly sensitive to initialization, this may indicate that the data are insufficient to determine the parameters.

  6. **Hypothesis Testing via Simulation (or Forward Prediction):**
     - For each candidate reward function (with parameters if applicable), use the reward to train a policy (using the lab's RL pipeline) in simulation and generate simulated trajectories.
     - Compare the simulated trajectories to the human demonstrations. Metrics might include:
       - Task success rate.
       - Feature statistics (e.g., average collision count, average distance to obstacles, smoothness).
       - Distributional similarity (e.g., using dynamic time warping, Fréchet distance, or other trajectory metrics).
     - Rank the reward hypotheses by how well the simulated behavior matches the human demonstrations.

  7. **Identify Ambiguities and Underdetermination:**
     - If multiple reward functions lead to similarly good matches, note that the reward is underdetermined by the data and list the plausible alternatives.
     - For each candidate, document the auxiliary assumptions that led to it (e.g., "assumes demonstrator is risk-averse", "assumes demonstrator values speed over safety").
     - Identify any aspects of the behavior that are not explained by any candidate (e.g., a consistent error pattern). This might indicate a missing feature or a non-reward factor.

  8. **Targeted Questions to Demonstrators:**
     - If the data underdetermine the reward or if there are unexplained behaviors, prepare targeted questions for the demonstrators. Examples:
       - "In the table-setting task, you placed glasses far from the edge. Was that because you were concerned about the glass breaking if it fell, or was there another reason?"
       - "In the desk-clearing task, we noticed that sometimes small objects were knocked over. Was that an accident you were trying to avoid, or did you not mind?"
     - Limit the number of questions (e.g., 2-3 per batch) to respect time constraints.

  9. **Revise Hypotheses and Warnings:**
     - Update the reward hypotheses based on the answers from demonstrators (if collected).
     - For each reward function, write a warning paragraph that states:
       - What the reward function is expected to capture (e.g., "This reward function emphasizes collision avoidance and smooth movement").
       - What it does not capture (e.g., "It does not account for the demonstrator's occasional preference for speed over precision in the absence of obstacles").
       - Known limitations (e.g., "This reward was inferred from data that had few examples of crowded scenes; it may not generalize to high clutter").
       - The auxiliary assumptions (e.g., "We assumed that the demonstrator's world model matches the simulator").

  10. **Report Compilation:**
      - Rank the reward hypotheses by a combination of data fit (from step 5 or 6) and consistency with demonstrator answers (if any).
      - Clearly mark which parts of the reward function were inferred from data and which were prior assumptions (from step 4).
      - If the data are insufficient and questions were not answered (or not asked), state that the reward is underdetermined and list the minimal set of additional information required.

  **Where the procedure refuses to run:**
  - If the demonstrations show no consistent pattern (e.g., random behavior) and no candidate reward function from step 4 leads to successful task completion in simulation (step 6), then the procedure stops and reports that the demonstrations are uninformative for reward inference and that behavioral cloning might be more appropriate.

  **What is left to judgment:**
  - The choice of features in step 1 (this is a modeling decision).
  - The selection of candidate reward structures in step 4 (prior knowledge).
  - The threshold for when data are too ambiguous (step 7) and when to ask questions (step 8) vs. report underdetermination.
  - The trade-off between data fit and simplicity in ranking (step 10).

  ---

  **Application to Case 1: Table-Setting Task**

  *Demonstrations:* One demonstrator places glasses far from the edge, moves slowly, and double-checks each placement.

  **Step 1: Task Description and MDP Setup**
  - Task: Place glasses on a table without breaking them.
  - Features: distance from glass to edge, speed of movement, time spent in "double-check" (hovering) before release, task completion (glass placed), glass breakage (if any).

  **Step 2: Preprocessing**
  - All demonstrations are from one demonstrator. They all show glasses placed at least 10 cm from the edge. Movements are slow and include a hover phase.

  **Step 3: Behavioral Analysis**
  - Low variance in placement (always far from edge) and movement speed (always slow). Consistent hover behavior.

  **Step 4: Initial Reward Hypotheses (prior commitments)**
  - Candidate 1: Reward for placing the glass (sparse) and penalty for proximity to edge.
  - Candidate 2: Reward for placing the glass, plus penalty for high speed (to encourage slow movement) and penalty for not hovering (if we can measure it).
  - Candidate 3: Reward for placing the glass and penalty for any glass breakage (but breakage never occurs in the demos, so this is not observable).

  **Step 5: Infer Reward Parameters**
  - Using linear reward: R(s) = w1 * (glass_placed) + w2 * (1/(1+distance_to_edge)) + w3 * (speed) + w4 * (hover_time).
  - IRL (max entropy) might assign a high negative weight to w3 (speed) and a positive weight to w4 (hover_time) and w2 (but note: w2 is for being close to edge, so we might want to use distance_to_edge as a feature and expect a negative weight? Let's redefine: use distance_to_edge as a feature and expect a positive weight if we want to be far? Actually, we can define features so that higher values are desirable. So let features be: 
    - f1: 1 if glass placed, else 0.
    - f2: distance from glass to edge (in cm).
    - f3: negative of the absolute speed of the end effector (so higher is better for slow movement? Actually, we want to penalize high speed. Alternatively, use a feature that is negative of speed squared).
    - f4: total hover time (accumulated when the end effector is near the placement location and moving slowly).
  - We run IRL and get high positive weights for f2 (distance to edge) and f4 (hover time), and a negative weight for f3 (if we use -speed, then a positive weight for f3 would penalize high speed). But note: without breakage events, we cannot infer the cost of breakage.

  **Step 6: Hypothesis Testing via Simulation**
  - Candidate 1 (with high penalty for proximity to edge) produces trajectories that place glasses far from the edge but might move quickly and without hovering. This does not match the slow movement and hovering.
  - Candidate 2 (with penalties on speed and reward for hover) produces slow movements and hovering, and if we also include the edge penalty, it matches the demonstrations.
  - Candidate 3 (breakage penalty) cannot be tested because we don't have breakage in the demos and the simulator might not model breakage.

  **Step 7: Ambiguities**
  - The behavior (slow, hover, far from edge) could be due to:
    - A preference for safety (avoiding breakage) -> Candidate 2 with edge and speed/hover penalties.
    - Motor tremor (if the demonstrator has shaky hands, they might move slowly to compensate) -> then the reward should not penalize speed? But the robot doesn't have tremor.
    - Poor depth perception (so they place far from edge to be safe) -> again, the robot has good sensors.
  - Without knowing the reason, we have two interpretations: 
    - The demonstrator values safety (which for the robot means we should penalize edge proximity and speed?).
    - The demonstrator has a physical limitation that the robot does not have (so we should not penalize speed?).

  **Step 8: Targeted Questions**
  - We must ask: "We observed that you placed the glasses far from the edge and moved slowly with a hovering step. Was that to prevent the glasses from breaking, or was it because of difficulty with the controls or depth perception?"

  **Step 9: Revised Hypotheses and Warnings**
  - Suppose the demonstrator answers: "I was being cautious to prevent breakage because the glasses are fragile."
  - Then we focus on Candidate 2: R(s) = w1 * (glass_placed) + w2 * (distance_to_edge) - w3 * (speed) + w4 * (hover_time) [with weights from IRL].
  - Warning for Candidate 2: 
    - "This reward function captures the demonstrator's caution by rewarding distance from the edge, slow movement, and hovering. It should transfer to settings where breakage is a concern. However, it does not account for the trade-off between speed and safety that might occur in time-pressured situations. Also, without breakage events in the data, the penalty for breakage is not learned and set to zero; if breakage is possible in new settings, we may need to add a breakage penalty. The robot does not have motor tremor, so the slow movement is purely for safety in this reward."

  **Step 10: Report**
  - Rank: Candidate 2 is the top hypothesis.
  - Inferred from data: weights for distance, speed, and hover time (via IRL).
  - Prior: the structure (linear combination of these features) and the inclusion of hover time (which was observed but might be a byproduct of caution).

  ---

  **Application to Case 2: Desk-Clearing Task**

  *Demonstrations:* A demonstrator occasionally knocks small objects over while reaching for larger ones. Supervisor wants a collision penalty.

  **Step 1: Task Description and MDP Setup**
  - Task: Remove all objects from a desk without causing damage.
  - Features: number of objects removed, number of collisions (or knock-overs), time to complete, smoothness of movement.

  **Step 2: Preprocessing**
  - Demonstrations show that collisions (knock-overs) occur occasionally (say 15% of the time when reaching near small objects).

  **Step 3: Behavioral Analysis**
  - The demonstrator successfully clears the desk but sometimes knocks over small objects. The collisions are infrequent but not rare.

  **Step 4: Initial Reward Hypotheses**
  - Candidate 1: Sparse reward for each object removed, plus a penalty for each collision (supervisor's preference).
  - Candidate 2: Only sparse reward for removal (no collision penalty) because collisions are unavoidable and the demonstrator didn't seem to avoid them.
  - Candidate 3: Penalty for collisions and also for time (to encourage efficiency).

  **Step 5: Infer Reward Parameters**
  - Using linear reward: R(s) = w1 * (number_removed) + w2 * (number_collisions) + w3 * (time_elapsed).
  - IRL might show that w2 (collision penalty) is negative but small in magnitude (because collisions happen) and w3 (time) is negative (if the demonstrator was fast) or zero.

  **Step 6: Hypothesis Testing via Simulation**
  - Candidate 1 (with a high collision penalty) will produce trajectories that avoid collisions by moving very carefully, possibly taking longer and having a lower collision rate than the demonstrator.
  - Candidate 2 (no collision penalty) will remove objects quickly but with a higher collision rate than the demonstrator.
  - Candidate 3 (with a time penalty and a small collision penalty) might match the demonstrator's collision rate and time.

  **Step 7: Ambiguities**
  - Why did collisions occur? 
    - Maybe the demonstrator did not care about collisions (so Candidate 2 is correct) but then why were collisions infrequent? Maybe because they tried to avoid but sometimes failed? 
    - Or the demonstrator cared about collisions (so Candidate 1 or 3) but had a short planning horizon or noisy control leading to occasional collisions.
  - The data alone cannot distinguish between:
    - The demonstrator having a small collision penalty and being efficient (so collisions are a byproduct of trying to be fast) -> Candidate 3.
    - The demonstrator having a high collision penalty but making mistakes due to noise -> then the robot (with precise control) would have fewer collisions.

  **Step 8: Targeted Questions**
  - Ask: "When you were clearing the desk, we noticed that sometimes small objects got knocked over. Was that something you were trying to avoid, or did you not mind as long as the desk got cleared?"

  **Step 9: Revised Hypotheses and Warnings**
  - Suppose the demonstrator answers: "I didn't like knocking things over, but I was focused on getting the job done quickly and sometimes I bumped things by accident. I tried to be careful but didn't want to spend too much time."
  - This suggests a trade-off: they cared about collisions but also about time. Candidate 3 (with both collision and time penalties) is supported.
  - Warning for Candidate 3: 
    - "This reward function captures the trade-off between efficiency (time) and collision avoidance. It should lead to behavior that clears the desk quickly with occasional collisions. However, note that the collision penalty is inferred to be small because collisions occurred. The robot, having more precise control, might achieve fewer collisions for the same time penalty. Also, without data in very cluttered scenes, the penalty might not generalize to high clutter. The inferred weights are specific to the trade-off observed and may not hold if the cost of a collision changes (e.g., if objects are fragile)."

  **But what if the supervisor is confident in a high collision penalty?** The data and the demonstrator's answer do not support a high penalty. The protocol produces Candidate 3 (with a small penalty) as the best match. We must report that a high penalty (Candidate 1) leads to overly cautious behavior that does not match the demonstrator's efficiency.

  **Step 10: Report**
  - Rank: Candidate 3 (with both time and collision penalties) is top, then Candidate 2, then Candidate 1 (high collision penalty) is last because it does not match the observed collision rate and time.
  - Inferred: weights for collisions and time (via IRL).
  - Prior: the features (collisions and time) and the linear structure.

  **Defending against the supervisor:** The report states that a high collision penalty (Candidate 1) would lead to behavior that is more cautious than the demonstrator (as seen in simulation) and does not match the observed trade-off. The demonstrator explicitly stated they balanced speed and care. Therefore, we choose Candidate 3.

  ---

  **Conclusion:**

  The protocol provides a structured way to handle reward inference, but it leaves room for judgment in feature selection and candidate reward formulation. It explicitly flags underdetermination and prompts for targeted questions when needed. The output is a set of ranked hypotheses with clear warnings, which serves the need for a documented decision without overconfidence.
answer: |-
  Below is a reusable protocol for reward inference from human demonstrations, designed for your lab context. It explicitly separates *inference* (data-driven conclusions) from *prior commitments* (assumptions you must make upfront), forces documentation of ambiguity, and includes off-ramps when data is insufficient. The protocol outputs a **ranked set of reward hypotheses with explicit warnings**, not a single point estimate.

  ---

  ### **Reward Inference Protocol**
  **Input:** Batch of demonstrations (20-40 trajectories), task description, simulator access.  
  **Output:** Ranked reward hypotheses + warnings, OR a request for targeted human input.  
  **Time Budget:** 1 day (steps 1–5 in AM, steps 6–9 in PM).

  #### **Step 1: Decompose Behavior into Features (Prior Commitment)**  
  - **Action:** List *observable* features (e.g., object positions, velocities, collisions, task completion time).  
  - **Stop if:** Features don’t cover key aspects of the task (e.g., "glass stability" isn’t measurable).  
  - **Output:** Feature set \(\mathcal{F} = \{f_1, \dots, f_k\}\).  
  - **Warning Label:** "Features are modeling choices, not inferences. Missing features create reward blindness."  

  #### **Step 2: Compute Feature Statistics (Descriptive)**  
  - **Action:** For each demo, compute:  
    - Mean/variance of each \(f_i\) (e.g., avg. distance to table edge).  
    - Outliers (e.g., collisions in desk-clearing).  
    - Cross-demonstrator consistency (e.g., does everyone avoid edges?).  
  - **Stop if:** Variance >50% of mean for safety-critical features (e.g., glass positions).  
  - **Output:** Table of \(\mu_f, \sigma_f\) per feature.  

  #### **Step 3: Identify Behavioral Paradoxes (Inference)**  
  - **Action:** Flag behavior that conflicts with *any* linear reward \(R(s) = \theta \cdot \phi(s)\):  
    - **Example 1:** Slow movement + edge avoidance in table-setting → Could be optimal under:  
      - \(\theta_{\text{stability}} >0\) (intentional), OR  
      - \(\theta_{\text{energy}} <0\) (motor noise compensation).  
    - **Example 2:** Occasional collisions in desk-clearing → Could imply:  
      - Low \(\theta_{\text{collision}}\) (indifference), OR  
      - High \(\theta_{\text{efficiency}}\) that overrides collision cost (tradeoff).  
  - **Stop if:** >30% of demos show paradoxes → **Request human input** (Step 7).  
  - **Output:** List of candidate rewards \(\{\theta_i\}\) explaining *most* behavior, plus unresolved paradoxes.  

  #### **Step 4: Simulate Optimal Policies for Each \(\theta_i\) (Inference)**  
  - **Action:** For each \(\theta_i\) from Step 3:  
    - Train RL policy in simulator under \(R_i(s) = \theta_i \cdot \phi(s)\).  
    - Generate trajectories, compute feature stats \(\mu_f^{\text{sim}}\).  
  - **Metric:** Compare \(\mu_f^{\text{sim}}\) to human \(\mu_f\) using Wasserstein distance.  
  - **Output:** Ranked hypotheses \(\{\theta_i^*\}\) by similarity to human \(\mu_f\).  

  #### **Step 5: Diagnose Divergence (Inference)**  
  - **Action:** For each \(\theta_i^*\), identify where simulated behavior diverges from demos:  
    - **Critical divergence:** Safety violations, task failure.  
    - **Benign divergence:** Low-priority features (e.g., path smoothness).  
  - **Stop if:** All \(\theta_i^*\) show critical divergence → **Reward underdetermined**.  
  - **Output:** Warning per \(\theta_i^*\): "Trust for [X]; untrustworthy for [Y]."  

  #### **Step 6: Handle Ambiguity (Decision)**  
  - **If** one \(\theta_i^*\) dominates (similarity >80%): Document as "best guess."  
  - **If** tie or low similarity:  
    - **Ambiguity type 1:** Data insufficient → **Flag underdetermination**.  
    - **Ambiguity type 2:** Auxiliary factors suspected (e.g., motor noise) → **Proceed to Step 7**.  

  #### **Step 7: Targeted Human Query (Optional)**  
  - **Action:** Ask demonstrators *only* about paradoxes (Step 3):  
    - "You placed glasses far from edges. Was this to prevent breaks, or due to control issues?"  
    - "You sometimes knocked objects over. Was this acceptable, or a mistake you tried to avoid?"  
  - **Rules:** Max 3 questions/batch; yes/no or 1–5 scales only.  
  - **Output:** Updated \(\{\theta_i\}\) incorporating responses.  

  #### **Step 8: Document Assumptions (Prior Commitments)**  
  - **Action:** For each \(\theta_i\), state:  
    - "We assumed demonstrator optimizes \(\theta_i\)" (core commitment).  
    - "We inferred \(\theta_i\) weights from data" (where applicable).  
  - **Output:** Explicit split between priors/inference.  

  #### **Step 9: Final Output**  
  - **Report:**  
    ```  
    Ranked reward hypotheses:  
    1. θ_1 = [w_edge = -2.0, w_speed = -0.5, ...]  
       - Trust: Preventing edge accidents.  
       - Untrust: Generalizing to fast execution.  
       - Assumed: No demonstrator motor noise.  
       - Inferred from: Edge distance variance (σ=0.1).  
    2. θ_2 = [...]  
    Ambiguity: [e.g., "Collision penalty indeterminate; θ_collision ∈ [-0.1, -0.01]"]  
    ```  

  ---

  ### **Case Applications**

  #### **Case 1: Table-Setting Task**  
  - **Behavior:** Glasses far from edge, slow movement, double-checks.  
  - **Step 1 (Features):** \(\mathcal{F}\) = {distance_to_edge, velocity, hover_time, task_time}.  
  - **Step 2 (Stats):** \(\mu_{\text{distance}}\) = 20cm (σ=2cm), \(\mu_{\text{velocity}}\) = 0.1m/s (σ=0.01).  
  - **Step 3 (Paradoxes):**  
    - Slow movement optimal under:  
      - θ₁: w_velocity <0 (intentional slowness), OR  
      - θ₂: w_stability >0 (indirectly requires slowness).  
    - **Verdict:** Data cannot distinguish θ₁ vs. θ₂ → **Ambiguity type 2**.  
  - **Step 7 (Human Query):** "You moved slowly. Was this because you valued caution, or was moving faster difficult?"  
    - **Answer:** "I was cautious to avoid breaks; I could move faster if needed."  
  - **Step 4/5 (Simulation):**  
    - θ₁ (w_velocity<0): Robot moves slowly even when unnecessary.  
    - θ₂ (w_stability>0): Robot speeds up when glasses stable.  
  - **Output:**  
    ```  
    Top hypothesis: θ₂ = [w_stability=1.0, w_edge=-0.3, w_velocity=0]  
      - Trust: Preventing tip-overs in stable conditions.  
      - Untrust: Dynamic scenes (e.g., moving around people).  
      - Assumed: Demonstrator valued stability, not compensating for motor limits.  
      - Inferred from: Stability-focused query response.  
    Warning: Do not use if robot lacks human depth perception.  
    ```  
  - **Defense to PI:** "We inferred stability as the priority, not slowness, based on the demonstrator’s statement. Penalizing speed would overfit to their motor capabilities."  

  #### **Case 2: Desk-Clearing Task**  
  - **Behavior:** Occasional collisions with small objects. Supervisor wants collision penalty.  
  - **Step 1 (Features):** \(\mathcal{F}\) = {objects_cleared, collisions, time}.  
  - **Step 2 (Stats):** \(\mu_{\text{collisions}}\) = 1.2/demo (σ=0.8), task success=100%.  
  - **Step 3 (Paradoxes):**  
    - Collisions occur but task succeeds → Could be:  
      - θ₁: w_collision ≈0 (indifference), OR  
      - θ₂: w_time <<0 (speed valued over collisions).  
    - **Verdict:** Supervisor’s θₛ (high w_collision) would make collisions *rare* in simulation → Contradicts data.  
  - **Step 4/5 (Simulation):**  
    - θₛ (supervisor): 0 collisions but 2x slower than human.  
    - θ₂ (w_time<<0): Collisions ≈1.5/demo, matches human time.  
  - **Output:**  
    ```  
    Top hypothesis: θ₂ = [w_cleared=1.0, w_collision=-0.05, w_time=-0.3]  
      - Trust: Time-constrained clearing.  
      - Untrust: If collisions damage objects (data lacks damage events).  
      - Assumed: Collisions were tradeoffs, not indifference.  
      - Inferred from: Collision rate matching human σ.  
    Rejected: θₛ (high collision penalty) → Underestimates human time preference.  
    Ambiguity: True w_collision indeterminate without damage data.  
    ```  
  - **Defense to Supervisor:** "A high collision penalty would make the robot slower than humans, violating the observed tradeoff. θ₂ explains the collision rate *and* speed. If collisions are costly, we need demos with fragile objects."  

  ---

  ### **When the Protocol Refuses to Run**  
  1. **No consistent features (Step 2):** If variance exceeds safety thresholds (e.g., glass positions σ >10cm), stop: "Data too noisy for reward inference."  
  2. **Irresolvable paradoxes (Step 6):** If >50% of behavior contradicts all linear rewards, stop: "Reward underdetermined; use behavioral cloning or fix features."  
  3. **Unanswerable human queries (Step 7):** If demonstrators can’t resolve paradoxes, stop: "Insufficient information; redesign task or gather focused demos."  

  ### **What’s Left to Judgment**  
  - **Feature selection (Step 1):** No algorithm tells you if "hover_time" matters for table-setting. This is domain knowledge.  
  - **Similarity thresholds (Step 5):** Is 75% trajectory match "good enough"? Set conservatively (e.g., >80%).  
  - **Query phrasing (Step 7):** Avoid leading questions; this is a skill.  

  ### **Why This Isn’t a False-Confidence Checklist**  
  - **Ambiguity is front-and-center:** Steps 3/6 force confrontation with uncertainty.  
  - **Outputs are hypotheses, not truths:** Warnings explicitly bound usability.  
  - **Priors are naked:** Step 8 forces you to admit where inference ends and assumption begins.  
  - **It rejects overreach:** The protocol stops more often than it concludes.  

  This workflow captures IRL’s theoretical insights (partial observability, reward ambiguity) while operating in your time constraints. Use it to force conversations about what’s *actually* supported by data—which is the best defense against overconfident supervisors.
