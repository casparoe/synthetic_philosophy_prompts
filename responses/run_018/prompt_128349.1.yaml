  The user wants a 39-line broken sestina with specific end-words cycling through: before, nothing, harm, after, exist, loss. The form should mirror Epicurus' symmetry, but in the envoy (final stanza), the words need to "collide" to show where the logic cracks—particularly having "loss" meet "before" and "after" together. They emphasize blank verse and intentional breaks, with the structure itself arguing rather than preaching acceptance. 

  Hmm, this is interestingly meta—using poetic form to demonstrate philosophical tension. The user clearly knows their stuff: they reference deprivation theory (the idea that death harms by depriving us of life's goods) and want the poem's rupture to challenge Epicurus' equivalence between pre-birth and post-death. 

  Key challenges: 
