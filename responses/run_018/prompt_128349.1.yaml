  Envoy: loss/before + after/harm + exist/nothing (but twisted) 

  For the "break": The envoy will merge lines so "before" and "after" share space with "loss," creating dissonance. Imagery will lean into absence—gaps, mirrors, missing steps—to embody deprivation without stating it. 

  User’s tone suggests academic rigor; they’ll likely share this with peers. The poem must withstand philosophical scrutiny while being poetically cohesive. No platitudes. 

  *scribbles draft lines* Focus on concrete images (mirrors, dry wells, unwritten books) to abstract concepts. The final stanza’s enjambment will force "loss" into both temporal voids—"this loss / that stains the before and after"—making deprivation visceral. 

