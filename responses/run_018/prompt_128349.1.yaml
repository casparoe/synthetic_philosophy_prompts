  - The envoy’s collision needs precision. "Loss" touching both "before" and "after" could visually represent how deprivation bridges nonexistence periods. 
  - Avoiding didacticism. The poem mustn’t conclude with "so death is fine"; instead, the broken form should let readers sit with the unresolved worry. 

