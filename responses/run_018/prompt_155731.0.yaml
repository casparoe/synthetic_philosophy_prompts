  1.  **Rotation:** Strict sestina rotation: context, principle, wrong, reason, shape, rule -> rule, context, principle, wrong, reason, shape -> etc. Envoy uses all six.
  2.  **Generalist Start:** Early stanzas (especially 1 & 2) lock "principle" and "rule" together conceptually (simple rule, rigid principle).
