  (Applies always!) seems less **wrong**.
  Maybe the **rule** holds *some* weight?
  Oof. Now I need a stronger **reason**.

  What's the unifying **reason**?
  Can't *just* be shifting **context**.
  Can't *just* be fixed, cold **rule**.
  Ethics isn't code; it doesn't **shape**
  To fit. But rigid code feels **wrong**.
  Where's the balance, **principle**?

  **(Envoy)**
  The filter sputters: "**Principle** definately needs a **rule**!"
  I argue back: "No, check the **context**, see the **reason**!"
