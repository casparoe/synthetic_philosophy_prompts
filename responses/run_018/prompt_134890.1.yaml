prompt: |-
  Following a long argument with a friend about whether virtue ethics survives the situationist critique, I need help seeing whether a specific Aristotelian passage actually forces the global trait stability she claims modern psychology has undermined. Here is the relevant text from Nicomachean Ethics, Book II, Chapter 5 (classic English translation):

  "A state of the soul is either （l） an emotion, （2） a capacity, or （3） a disposition; virtue therefore must be one of these three things. By the emotions, I mean desire, anger, fear, confidence, envy, joy, friendship, hatred, longing, jealousy, pity; and generally those states of consciousness which are accompanied by pleasure or pain. The capacities are the faculties in virtue of which we can be said to be liable to the emotions, for example, capable of feeling anger or pain1 or pity. The dispositions are the formed states of character in virtue of which we are well or ill disposed in respect of the emotions; for instance, we have a bad disposition in regard to anger if we are disposed to get angry too violently or not violently enough, a good disposition if we habitually feel a moderate amount of anger; and similarly in respect of the other emotions. Now the virtues and vices are not emotions because we are not pronounced good or bad according to our emotions, but we are according to our virtues and vices; nor are we either praised or blamed for our emotions—a man is not praised for being frightened or angry, nor is he blamed for being angry merely, but for being angry in a certain way—but we are praised or blamed for our virtues and vices. Again, we are not angry or afraid from choice, but the virtues are certain modes of choice, or at all events involve choice. Moreover, we are said to be 'moved' by the emotions, whereas in respect of the virtues and vices we are not said to be 'moved' but to be 'disposed' in a certain way."

  My friend insists that defining virtue as a "formed state of character" commits Aristotle to predicting high cross-situational consistency—something like the familiar personality correlation ceiling near r ≈ .30—whereas I think the exclusion of emotion and capacity leaves room for locally stable, practice-embedded regularity that does not require global uniformity. Please respond with exactly five numbered points, each one or two sentences long, with no introduction or conclusion: (1) why the tripartite division rules out treating virtue as a reactive state; (2) how the clause about choice distinguishes hexis from being "moved"; (3) whether "disposed in a certain way" can accommodate ecological variation without collapsing into pure situationism; (4) the specific misreading involved in treating hexis as a decontextualized trait score; and (5) what part of Aristotle's account remains intact even if empirical cross-situational consistency is low.
