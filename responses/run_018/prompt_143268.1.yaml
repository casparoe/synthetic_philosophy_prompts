  i've been throwing pots for like three years now, no formal training, just youtube and messing up a lot. last week my friend asked me: if you take a finished vase and chip away one tiny flake of clay at a time, when exactly does it stop being that vase? i said it's obviously vague, but then i started wondering if philosphers have actual answers for this kind of slippery slope thing. i think it's called the sorites paradox, or maybe soritess, idk.

  anyway, could you take the main philosophical responses to vagueness — the view that there's secretly a precise cutoff line we just can't detect, the view that there's genuinely no fact of the matter right at the boundary, and that "degrees of truth" idea where something can be partly true — and restate all three using only pottery vocabulary i actually know: greenware, leather-hard, bisque firing, glaze, kiln shrinkage, wedging, etc. be honest about the translation, don't just pretend my kiln is "truth." tell me what maps cleanly onto ceramic processes, what has to be stretched or distorted to fit, and what just has no expression at all in the language of clay and firing. then say whether the leftover bits mean pottery thinking is missing some important conceptual tool, or if they show the philosophical debate is partly just playing with language that doesn't connect to actual materials. no need for quotes or reading lists, i'm just trying to understand it while i wait for my next firing to cool.
