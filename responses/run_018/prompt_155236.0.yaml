  *British English maintained throughout, as requested: 'fissure' over 'fissure', 'honour' over 'honor', etc. The prose flows as a letter, avoiding structural markers while addressing each query in sequence: correspondence, fractures, determinism, alternative metaphors, and the verdict on historiography.*
