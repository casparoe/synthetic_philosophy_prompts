  I'm giving the opening remarks at a workshop on decision architecture next Thursady — half the room are philosophers of action, the other half are engineers who build choice-architecture programmes. I want to frame the day with Buridan's ass, but not the usual textbook story where the beast just starves from indecision. There's this angle I've been playing with, call it the 'stalled equilibrium' view: the ass doesn't die because it can't pick, but because maintaining perfect equidistance between the bales is itself a hidden preference for the status quo of not-choosing. I need about four minutes, casual but precise, that uses this to warn the engineers against treating indiference as a bug that needs a tie-breaker, without making the philosophers feel like I'm lecturing them in favour of some systems fix. Please don't cite anyone specifically or mention dates — I want us working with the thought experiment live, not doing history of philosophy. Write it in British English, and don't worry about being too polished; a typo or two is fine, I just want it to sound like I actually spoke it.
