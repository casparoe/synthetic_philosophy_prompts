  Next, distinguishing thermal drift from status quo bias. Status quo bias is a preference for inaction. Thermal drift involves active escalation to avoid perceived losses. The user's concept implies a proactive element—bidding more reputation to prevent loss. That's different from passively sticking to the current state. So, the term might hold up.

