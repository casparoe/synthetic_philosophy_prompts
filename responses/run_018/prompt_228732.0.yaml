prompt: |-
  My roommate has started ending arguments with "actions speak louder than words" and I keep loosing because of it. Latest round: I told him I genuinely value eating well and saving money, he gestured at the takeout containers and my bank statement, dropped the line, and walked off. I know economics has a fancy version of this somewhere — revealed preference, the idea that what you choose shows what you actually prefer — but I'm not convinced the slogan and the theory are the same claim, and I want to take the slogan apart properly before the next round.

  Can you lay out the distinct precise things "actions speak louder than words" could be claiming? I'm thinking there are at least a few: an epistemic claim (behavior is better *evidence* of what you want than self-report is), a definitional claim (your preferences just ARE your choice dispositions, so self-report isn't even evidence about the same thing), a predictive claim (to guess what I'll do next, watch my past behavior not my talk), a sincerity or hypocrisy claim about me as a person — plus whatever else I've missed. For each reading: is it trivial, substantive-but-defensible, or just false? And this is the part I actually care about: does that reading support my roommate's specific move, which was dismissing what I *said* I value in favor of what I did? Please pressure-test each one against the obvious trouble spots — weakness of will, choosing the least-bad of bad options rather than what you most want, one-off choices versus patterns, framing and context effects, people genuinely changing over time, words sometimes being the only data available. Menu format is fine, with a verdict on each entry.

  End with a last line of the form \answer{...} naming the single strongest reading of the slogan for my roommate's argument (or "none" if none of them survive the pressure-testing).
reasoning: |-
  Okay, the user is having an ongoing argument with their roommate who keeps using "actions speak louder than words" to dismiss what they say about valuing eating well and saving money. The roommate points to takeout containers and bank statements as evidence against their claims. The user wants to dissect this slogan and find out if any interpretation actually supports the roommate's move. They mentioned revealed preference theory in economics but suspect it's not the same.

  First, I need to break down "actions speak louder than words" into precise claims. The user suggested several angles: epistemic (behavior as better evidence), definitional (preferences as choices), predictive (predicting future actions), and sincerity/hypocrisy. I should check if there are others. Maybe something about moral responsibility or commitment?

  For each claim, I'll assess whether it's trivial, defensible, or false. Then, see if it holds up against counterexamples like weakness of will (e.g., wanting to eat healthy but ordering takeout due to stress), constrained choices (buying expensive food because the cheaper option is gone), patterns vs. one-offs, context effects (like different situations affecting decisions), genuine change over time (values shifting), and when words are the only data. 

  Epistemic claim: Behavior is better evidence than self-report. This seems defensible because actions are observable. But it's not absolute. Weakness of will and constraints can make actions misrepresent true preferences. For example, someone might value saving money but face an emergency expense. So, while actions are strong evidence, they're not infallible. Does this support the roommate? Partially, but with caveats—past takeout doesn't necessarily negate valuing healthy eating if there are context issues.

  Definitional claim: Preferences are defined by choices. This comes from revealed preference theory. It's substantive but controversial. Philosophers like Sen criticize it, noting that choices can be constrained or irrational. If preferences are defined solely by choices, then self-reports are irrelevant. But this ignores inner states and intentions. Weakness of will is a problem here—choosing cake over salad doesn't mean you prefer cake. The roommate might use this to dismiss words, but it's an oversimplification.

  Predictive claim: Past actions predict future behavior better than words. This is often true but not always. People change, learn from mistakes, or face new circumstances. If someone has a pattern of takeout, they might keep doing it, but a resolution to change could alter that. The roommate's move is supported if patterns exist, but one-off choices or genuine change weaken this.

  Sincerity claim: Actions show sincerity; inconsistent words are hypocrisy. This is more of a moral judgment. It assumes that if words and actions conflict, the person is insincere. But weakness of will isn't hypocrisy—it's human. Valuing health but struggling with habits doesn't make one a hypocrite. The roommate uses this to accuse the user of not genuinely valuing their stated goals, but it's too harsh and ignores psychological complexities.

  Are there other interpretations? Maybe about commitment or effort. For instance, actions demonstrate commitment to values. But similar issues apply—effort might be hindered by external factors.

  Now, the user wants the strongest reading for the roommate's argument. The epistemic claim is the most defensible since actions are generally reliable evidence. However, it doesn't fully support dismissing words outright because of the counterexamples. The definitional claim is strong but flawed. The predictive is situational. The sincerity claim is judgmental and often unfair.

  Considering the roommate's specific move—dismissing stated values based on actions—the epistemic claim best supports it, even with caveats. Revealed preference is definitional, but the roommate is likely making an evidence-based argument. So, \answer{epistemic} seems right, but I need to confirm. The user's scenario involves takeout and bank statements as evidence against stated values, so the roommate is using actions as better evidence. Yes, epistemic fits.
answer: |-
  Here's a breakdown of "actions speak louder than words" into precise claims, evaluated for validity and applicability to your roommate's argument. Each is pressure-tested against key challenges (weakness of will, constrained choices, patterns vs. one-offs, context effects, change over time, and words-as-only-data).

  ---

  ### 1. **Epistemic Claim**  
  *Claim*: Actions are *better evidence* of true preferences/beliefs than self-reported words.  
  *Status*: **Substantive-but-defensible** (with caveats).  
  *Supports Roommate?*: **Partially**. Actions are often more reliable evidence than words, but not infallible.  
  *Pressure Testing*:  
  - **Weakness of Will**: Actions may reflect short-term impulses, not deep values (e.g., ordering takeout during exhaustion ≠ rejecting healthy eating).  
  - **Constrained Choices**: Buying takeout because groceries spoiled doesn't prove you *prefer* takeout.  
  - **Patterns vs. One-offs**: A single action is weak evidence; patterns are stronger.  
  - **Context Effects**: Stress or social pressure can distort actions.  
  - **Change Over Time**: Past actions don't capture recent shifts in values.  
  - **Words-as-Only-Data**: If actions are absent (e.g., future plans), words matter.  
  *Verdict*: Actions are *often* better evidence, but dismissing words outright ignores nuance. Roommate's move is *weak* if your actions are inconsistent or context-driven.

  ---

  ### 2. **Definitional Claim**  
  *Claim*: Preferences *are defined by* actions (i.e., "what you value" = "what you consistently choose"). Self-reports are irrelevant to defining preferences.  
  *Status*: **Substantive-but-controversial** (core of revealed preference theory).  
  *Supports Roommate?*: **Strongly** (if accepted). If preferences *are* choices, your words about "valuing saving/eating well" are meaningless noise.  
  *Pressure Testing*:  
  - **Weakness of Will**: Contradicts the theory (e.g., choosing cake ≠ "preferring" cake if you're addicted).  
  - **Constrained Choices**: Choosing takeout because the store closed doesn't "define" preference.  
  - **Patterns vs. One-offs**: Revealed preference requires *consistent* choices; one-offs are noise.  
  - **Change Over Time**: Fails if preferences evolve faster than actions.  
  - **Hypocrisy?**: N/A – sincerity isn't relevant; words are disconnected from "preference."  
  *Verdict*: Economists use this for modeling, but philosophers like Sen critique it as reductionist. **Fails** under weakness of will/constraints. Roommate's move *depends* on ignoring psychology.

  ---

  ### 3. **Predictive Claim**  
  *Claim*: Past actions predict *future behavior* better than stated intentions.  
  *Status*: **Substantive-and-often-true** (in stable contexts).  
  *Supports Roommate?*: **Yes, but narrowly**. He can predict you'll *keep* ordering takeout, but not that you don't *value* healthier options.  
  *Pressure Testing*:  
  - **Weakness of Will**: Predicts relapse but doesn't negate underlying values.  
  - **Constrained Choices**: Predictions fail if constraints change (e.g., you get a raise).  
  - **Patterns vs. One-offs**: Patterns improve predictions; one-offs don't.  
  - **Change Over Time**: Poor predictor if you're actively reforming habits.  
  - **Words-as-Only-Data**: Future plans (words) matter if no past actions exist.  
  *Verdict*: Useful for forecasting behavior, but silent on *why* you act (e.g., "Do you order takeout because you prefer it, or because cooking is hard?"). Doesn't fully support dismissing your *values*.

  ---

  ### 4. **Sincerity/Hypocrisy Claim**  
  *Claim*: Actions reveal *sincerity*; inconsistent words are hypocritical or self-deceived.  
  *Status*: **Substantive-but-overloaded**.  
  *Supports Roommate?*: **Explicitly** – he implies your actions prove insincerity.  
  *Pressure Testing*:  
  - **Weakness of Will**: Struggling ≠ hypocrisy (e.g., valuing fitness but skipping gym isn't insincere).  
  - **Constrained Choices**: Blaming "hypocrisy" ignores barriers.  
  - **Patterns vs. One-offs**: A pattern suggests insincerity; a one-off doesn't.  
  - **Change Over Time**: Accusing hypocrisy ignores growth.  
  - **Words-as-Only-Data**: If actions align later, words weren't necessarily hypocritical.  
  *Verdict*: **Least defensible**. Conflates *failure* with *dishonesty*. Roommate's move is a **rhetorical cheap shot** that pathologizes normal human inconsistency.

  ---

  ### 5. **Commitment/Effort Claim** (Bonus Round)  
  *Claim*: Actions demonstrate *commitment* to values; words without action are empty.  
  *Status*: **Substantive-and-defensible**.  
  *Supports Roommate?*: **Indirectly**. He could argue your actions show low *commitment* to saving/eating well.  
  *Pressure Testing*:  
  - **Weakness of Will**: Effort fluctuates; low effort ≠ no value.  
  - **Constrained Choices**: High effort might be invisible (e.g., researching recipes ≠ cooking).  
  - **Patterns vs. One-offs**: Consistent effort matters most.  
  - **Change Over Time**: Commitment can grow gradually.  
  *Verdict*: Best for *motivational* contexts (e.g., self-improvement), but **doesn't negate stated values** – it critiques follow-through.

  ---

  ### Key Takedowns for Your Next Round
  1. **"Weakness of will isn't hypocrisy"**: Cite Aristotle: Valuing virtue ≠ always acting virtuously.  
  2. **"Constraints matter"**: Ask: "If my bank account was hacked last week, would my statement still 'prove' I don't value saving?"  
  3. **"Patterns over outliers"**: Challenge: "Judge me on my *best* month, not my worst takeout night."  
  4. **"Words guide future actions"**: Argue: "My stated values *explain* why I'm trying to change – they're the reason I'm bothered by my actions!"  

  \answer{epistemic}  
  *(The epistemic claim is the strongest for your roommate: actions *are* often better evidence than words. But pressure-testing shows it's not absolute – and his application ignores critical nuances like constraints and patterns.)*
