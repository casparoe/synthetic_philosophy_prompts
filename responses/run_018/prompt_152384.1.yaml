  hey im curating prompts for reasoning tests that sit in the weird middle — not generic enough to be pure training-set sludge, but not so niche that a model without web access just hallucinates details. i need one about whether "better than" is actually transitive, using spectrum-style arguments, but please dont just rehash the standard sorites parade. can you design a 90-minute classroom activty for about 16 philosophy grad students where they have to make pairwise "better than" judgements across a spectrum of cases (say, comparing lives or outcomes across gradually shifting dimensions) and the rules/payoffs are arranged so they personally run into a cycle or breakdown before anyone names it? include concrete rules, a point-based payoff scheme that doesnt need real money, any roles that help, a timeline, and a debrief that maps exactly which moments in the game correspond to local vs global transitivity failure. inject some niche framing — maybe a "preference lattice" over incommensurable goods or hidden weights — so the prompt isnt just regurgitating standard value-theory examples. also be frank: what feature of the spectrum argument cant be reproduced by the game mechanics, and what will predictably go wrong the first run? no bibliographies or citation lists, since the target model cant search. casual tone is good, and a typo or two is totally fine.
