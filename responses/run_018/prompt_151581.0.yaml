prompt: |-
  I sit on the acquisitions committee of a regional science museum. We must rule on a proposal for a temporary exhibit titled "Parallel Timelines" that presents Anatoly Fomenko's New Chronology—his statistical argument that major ancient civilizations and events are phantom duplicates of medieval history—using symmetrical display panels that place conventional archaeological chronology and Fomenko's compressed chronology side-by-side without labeling either as established or pseudohistorical. The curator argues this format teaches visitors to weigh evidence; the board's science advisor warns that symmetrical presentation falsely implies epistemic parity, violating our institutional demarcation standard that distinguishes legitimate revisionism (testable, peer-reviewed, responsive to anomaly) from pseudohistory (post-hoc pattern matching that evades falsification). Draft the committee's formal decision memo recommending approval, rejection, or conditional approval with specific modifications and a concrete implementation timeline. Give an honest account of the strongest consideration favoring the opposing view, invoke the relevant demarcation criteria explicitly, and take a committed position with clear reasoning rather than balancing both sides neutrally. Do not request citations, reading lists, or bibliographic references.
reasoning: |-
  Okay, the user is part of a museum acquisitions committee dealing with a tricky proposal about Fomenko's New Chronology. Let me unpack this. They need a formal decision memo that either approves, rejects, or conditionally approves the exhibit. The key conflict is between the curator's educational approach and the science advisor's concerns about false equivalence. 

  Hmm, the user's role is crucial here—they're not just an observer but a decision-maker in a science institution. Their actual need is a legally sound, ethically defensible memo that protects the museum's credibility. But deeper down, they probably want to navigate this without stifling critical thinking or causing internal strife. The phrase "teach visitors to weigh evidence" suggests they value education, but "demarcation standard" implies institutional integrity is non-negotiable. 

  Fomenko's theory is widely debunked, so presenting it symmetrically next to actual archaeology is like putting astrology beside astronomy. The science advisor's point about epistemic parity hits hard—if the museum accidentally legitimizes pseudohistory, it could damage their reputation. The curator's heart is in the right place, but the execution risks misleading visitors who trust the museum's authority. 

  I should lean hard on the demarcation criteria: testability, peer review, responsiveness to evidence. Fomenko's work fails all three—it's pattern-matching without falsifiability. The memo must reject symmetry but could salvage the critical-thinking angle by suggesting a redesign that explicitly labels theories by their scholarly standing. 

  Timeline-wise, a full redesign would take 6-8 months. That's realistic if the curator commits. The "strongest opposing view" paragraph should genuinely acknowledge the educational intent but then dismantle it by explaining why symmetry backfires pedagogically. No hedging—this isn't about balance but upholding scientific standards. 

  ...Wait, did the user imply frustration with committees that "balance neutrally"? Yeah, they want decisiveness. So the memo's tone must be firm but respectful, ending with a clear directive. No citations needed, just razor-focused reasoning. The conditional approval option is a compromise, but only if the redesign guts the false equivalence. Otherwise, outright rejection is safer. 

  Final structure: reject symmetry, offer conditional path, hammer demarcation, timeline with milestones. Protect the museum, honor education without deception.
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisitions Committee, [Museum Name]  
  **FROM:** [Your Name/Committee Chair]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on "Parallel Timelines" Exhibit Proposal  

  **DECISION:** **REJECTION** of the proposed format. **Conditional Approval** granted *only* if the exhibit is restructured to explicitly demarcate Fomenko’s New Chronology as a disputed pseudohistorical theory, with clear scientific context and no implied equivalence to mainstream chronology.  

  ### I. Analysis Under Institutional Demarcation Standard  
  Our policy requires distinguishing legitimate revisionism from pseudohistory based on three criteria:  
  1. **Testability**: Legitimate theories generate falsifiable claims (e.g., radiocarbon dating inconsistencies).  
  2. **Peer Review & Responsiveness**: Legitimate scholarship engages openly with criticism and evidence.  
  3. **Methodological Rigor**: Pseudohistory relies on post-hoc pattern matching, evades falsification, and ignores contradictory evidence.  

  **Fomenko’s New Chronology fails all criteria:**  
  - It **evades falsification** by dismissing archaeological, textual, and genetic evidence as "corrupted" or "duplicated."  
  - Its statistical methods have been **repeatedly invalidated** in peer-reviewed mathematics and historiography for selective data use and arbitrary assumptions.  
  - It exhibits **zero responsiveness** to disconfirming evidence (e.g., dendrochronology, stratified artifacts, astronomical records).  

  The symmetrical "unlabeled" presentation falsely implies **epistemic parity** between a theory rejected by the global scientific community and a chronology built from multidisciplinary, testable evidence. This violates our core mandate to communicate scientific consensus while contextualizing dissent.  

  ### II. Strongest Consideration Favoring the Proposal  
  The curator’s argument that symmetrical presentation teaches visitors to "weigh evidence" has merit in principle. Engaging the public in critical analysis of historical methods aligns with our educational mission. An exhibit contrasting methodologies *could* foster valuable discussion about how historians validate claims—if both approaches met baseline standards of scholarly integrity.  

  ### III. Why This Argument Fails Here  
  **Pseudohistory cannot be "weighed" against science.** Presenting Fomenko’s model as symmetrical to conventional chronology:  
  - **Misrepresents the evidential landscape**, implying equivalence where none exists.  
  - **Undermines scientific literacy** by validating evasion of falsification as a legitimate "alternative."  
  - **Contradicts our ethics**: We cannot ethically ask visitors to "decide" between a theory that rejects scientific norms and one built on them.  

  ### IV. Conditions for Conditional Approval & Implementation Timeline  
  **Approval is contingent on comprehensive restructuring:**  
  1. **Explicit Demarcation**: Panels must label Fomenko’s theory as a "controversial pseudohistorical model" rejected by mainstream scholarship, with concise explanations of *why* (e.g., "ignores physical evidence," "rejected by peer review").  
  2. **Contextual Framing**: Introduce the exhibit with a panel explaining institutional demarcation criteria and how pseudohistory differs from legitimate revisionism.  
  3. **Focus on Process**: Emphasize *how* historians test claims (e.g., "Here’s how archaeologists date this artifact; here’s why Fomenko’s model dismisses those methods").  
  4. **Remove Symmetry**: Design elements must avoid visual/textual equivalence (e.g., place mainstream chronology as the primary narrative with Fomenko’s critique in supplementary "debunking" sidebars).  

  **Implementation Timeline:**  
  - **Day 1–30**: Curator submits revised storyboard and labels addressing above criteria.  
  - **Day 31–60**: Science Advisor and Committee review revisions for compliance.  
  - **Day 61–120**: Fabrication and installation (if approved).  
  - **Day 121**: Opening (*only* if all conditions met).  
  **Failure to resubtaintially meet conditions by Day 60 results in automatic termination of the proposal.**  

  ### V. Recommendation  
  **Reject the current proposal.** The symmetrical format’s violation of demarcation standards creates unacceptable reputational and pedagogical risks. We cannot present pseudoscience as epistemically equal to scholarly consensus.  

  **Approve conditionally** only if restructuring explicitly centers scientific methodology, unequivocally labels Fomenko’s model as disputed pseudohistory, and abandons false symmetry. This compromise honors educational intent while upholding our institutional integrity. The revised exhibit could then serve as a case study in *identifying* pseudohistory—a far more valuable lesson than its original design.  

  **Action Required:** Committee vote on rejection with conditional approval pathway as specified.  

  ---  
  **Signed,**  
  [Your Name]  
  [Title]
