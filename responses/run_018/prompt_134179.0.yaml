prompt: |-
  ok so i'm trying to figure out what a theory of personal survival actually needs to deliver, especially in weird edge cases. not just parfit's teletrasportation but also gradual replacement where 10% of your neurons get swapped for silicon analogues that dont preserve 1:1 functional mapping but keep the overall dynamics going, then another 10%, until you're fully synthetic but there's never a sharp cutoff point.

  write me the full spec: the desiderata any adequate theory of what matters in survival has to meet. for each one, give the case or puzle that forces it -- teletrasportation, split brain, the gradual synthetic swap i mentioned, fusion of two minds, etc. include the distinctions it can't collapse (like between surviving and merely being similar, or between one survivor and two). flag which are hard constraints vs camp preferences (e.g. requiring spatiotemporal continuity vs allowing psychological continuity). then tell me if some subset is jointly unsatisfiable -- i have a hunch that "branching is impossible" and "gradual replacement preserves identity" can't both hold, but i want the argument. no need for a bibliography, just the list and your reasoning.
reasoning: |-
  We are constructing a list of desiderata (requirements) for a theory of personal survival. Each desideratum is motivated by a specific puzzle or case. We also note whether each is a hard constraint (something the theory must account for) or a camp preference (a position that some theories might adopt but others might reject). Then we explore potential conflicts, especially between branching being impossible and gradual replacement preserving identity.

  ### Desiderata for a Theory of Personal Survival

  1. **Survival vs. Similarity (Distinction Requirement)**
     - **Case**: Parfit's Teletransportation (with destruction of original).
       - In the teletransportation scenario, a replica is created on Mars while the original on Earth is destroyed. The replica is psychologically continuous with the original. The question is: does the original person survive? If the theory says yes, then it must explain why mere similarity (without identity) isn't sufficient. If no, then it must explain what is missing (e.g., physical continuity).
     - **Requirement**: The theory must distinguish between actual survival (where I continue to exist) and mere replication (where someone else, who is very similar to me, exists). We cannot collapse the distinction between being the same person and being a different person who is similar.
     - **Type**: Hard constraint. Without this distinction, we cannot account for the intuition that we care about our own survival in a way that we don't care about the existence of a replica.

  2. **Branching Survival (Possibility of Multiple Survivors)**
     - **Case**: Brain Bisection (or Split-Brain with successful separation into two hemispheres each transplanted into new bodies).
       - Suppose that a person's brain is split into two hemispheres and each is transplanted into a different body. Both resulting individuals are psychologically continuous with the original. Does the original survive? If so, as one or both?
     - **Requirement**: The theory must account for the possibility of branching (i.e., one person splitting into two). It must explain how identity can be preserved in non-branching cases but fail in branching cases (if identity is one-one) or allow for multiple survivors (if identity is one-many).
     - **Type**: Camp preference? Some theories (like psychological continuity theories) can allow branching, while others (like biological continuity) might deny that branching is possible because they require spatiotemporal continuity which is one-one.

  3. **Gradual Replacement (Continuity without Identity Loss)**
     - **Case**: The Gradual Synthetic Swap (as described).
       - Over time, 10% of a person's neurons are replaced by synthetic analogs that do not preserve a 1:1 functional mapping but maintain overall dynamics. This continues until the person is entirely synthetic. At no point is there a sharp break in consciousness or psychological continuity.
     - **Requirement**: The theory must hold that the person survives the gradual replacement. There should be no point at which the person ceases to exist and a new person comes into being because the change is gradual and continuous.
     - **Type**: Camp preference? Some theories (e.g., psychological continuity) might easily accommodate this, while others (e.g., biological continuity) might argue that the person ceases to exist when the brain is no longer biological. However, the intuition that we survive gradual change is strong and often taken as a constraint.

  4. **Spatiotemporal Continuity (No Gaps)**
     - **Case**: Teletransportation (without destruction of original) vs. Normal Travel.
       - If I travel normally from Earth to Mars, there is a continuous path. In teletransportation, the original is destroyed and a replica is created on Mars. The replica is not spatiotemporally continuous with the original.
     - **Requirement**: Some theories (e.g., animalism) require spatiotemporal continuity without interruption for survival. The theory must either require this continuity or explain why it isn't necessary.
     - **Type**: Camp preference. This is a point of contention between different theories. Animalism and some physicalist theories require it, while psychological continuity theories often drop it.

  5. **Fusion (Two into One)**
     - **Case**: Mind Fusion.
       - Two persons (A and B) are fused into a single person C, who has the memories and traits of both. What happens to A and B? Do they survive? If so, how? Or is C a new person?
     - **Requirement**: The theory must account for fusion. It must explain whether A and B survive in C (and if so, how two persons become one) or whether they cease to exist and a new person begins.
     - **Type**: Hard constraint? Any complete theory should address fusion. However, it is a challenge for most theories.

  6. **Exclusivity (One Survivor vs. Two)**
     - **Case**: The Combination of Branching and Fusion.
       - Suppose we have a branching case (split brain) followed by a fusion of the two branches. The theory must not collapse the distinction between one survivor and two. For example, if we have two distinct survivors after branching, and then they are fused, we must not say that the original person was always one throughout.
     - **Requirement**: The theory must preserve the count of persons. It must not allow for cases where we cannot say whether there is one or two persons without ambiguity.
     - **Type**: Hard constraint. We need to be able to count persons.

  7. **No Duplicates Constraint**
     - **Case**: Teletransportation with Double Release.
       - The teletransporter malfunctions and creates two replicas on Mars. Which one is the original? Neither? Both?
     - **Requirement**: The theory must explain why, in the case of two replicas, the original person does not survive (or survives as both). If the theory allows survival in the single replica case, then it must explain why having two replicas changes the situation. This is related to the "branching is impossible" requirement for some theories.
     - **Type**: Hard constraint? This is central to the non-branching requirement of some theories (like those that require identity to be one-one).

  ### Conflicts Between Desiderata

  Now, let's focus on the conflict you mentioned: between "branching is impossible" (which we can call the **No Branching** requirement) and "gradual replacement preserves identity" (which we'll call **Gradual Survival**).

  - **No Branching**: This is the idea that identity must be one-one. In branching cases (like the split brain or double teletransportation), the original person does not survive because identity cannot be shared between two distinct individuals. This is often motivated by the intuition that we cannot be two people at once. Moreover, in the double release teletransporter, we would say the original dies because there are two candidates and identity must be unique.

  - **Gradual Survival**: In the gradual synthetic swap, we start with person P and end with person Q. The intuition is that P survives as Q because the change is gradual and continuous.

  The conflict arises when we combine branching with gradual replacement. Consider the following scenario:

  - **Gradual Branching**: Suppose we have a gradual process that leads to branching. For example, we gradually replace the neurons in the left hemisphere with synthetic ones that are designed to eventually be separable. Then we do the same for the right hemisphere. Finally, we split the brain into two, each hemisphere in a new body. Both resulting individuals are psychologically continuous with the original (because of the gradual replacement and then the split). 

    - According to **Gradual Survival**, the original person survives the gradual replacement. So at the end of the replacement, we have one person (call them P*) who is the same as the original P. 
    - Then we split P* into two individuals, A and B. 
    - If we accept **No Branching**, then P* cannot survive as both A and B. Therefore, P* must not survive the split. But this seems arbitrary: why would the gradual replacement be unproblematic but the split (which might also be done gradually) cause the person to cease to exist?

  Alternatively, consider a case of **Gradual Duplication**:

  - We gradually replace the neurons in the brain, but at each step, we also create a duplicate of the replaced part elsewhere. At the end, we have two complete synthetic brains, both continuous with the original. This is a branching that happens gradually.

    - If **Gradual Survival** holds, then at no point during the replacement does the original cease to exist. But at the end, we have two persons. 
    - If we also hold **No Branching**, then we must say that the original does not survive the process because there are two. But then we have a contradiction: the gradual process should preserve identity, but the end result violates the one-one identity.

  Therefore, **Gradual Survival** and **No Branching** are jointly unsatisfiable because gradual processes can lead to branching. The only way to avoid this is to deny that branching can occur gradually or to deny that gradual processes always preserve identity. But the latter would break the **Gradual Survival** desideratum.

  ### Conclusion

  The desiderata that are jointly unsatisfiable are:
  - **No Branching**: Identity must be one-one; branching is impossible (so in branching cases, the original does not survive).
  - **Gradual Survival**: Gradual replacement of parts (even without 1:1 functional mapping) preserves identity.

  Because gradual processes can be designed to lead to branching, these two cannot both be true.

  A theory must therefore choose:
  - Either allow branching (and then explain how identity can be preserved in branching, perhaps by giving up on identity being one-one) and thus satisfy **Gradual Survival** even in branching scenarios.
  - Or deny **Gradual Survival** in the branching cases, but then we must explain why gradual replacement without branching preserves identity but gradual replacement with branching does not.

  This is a deep tension in theories of personal identity.
answer: |-
  Below is the full specification of desiderata for a theory of personal survival, derived from edge cases like teletransportation, gradual replacement, branching, fusion, and others. Each desideratum is defined, motivated by a specific case, and classified as a **hard constraint** (non-negotiable for adequacy) or a **camp preference** (theory-dependent). I then analyze conflicts, including the joint unsatisfiability of "no branching" and "gradual replacement preserves identity."

  ---

  ### **Core Desiderata for a Theory of Personal Survival**

  1. **Distinguish Survival from Similarity**  
     - **Requirement**: The theory must differentiate between *being the same person* (survival) and *merely having a similar successor* (e.g., a replica). Collapsing this distinction invalidates self-interest (e.g., why care about survival if a replica suffices?).  
     - **Case**: **Parfit’s teletransportation** (with destruction of the original). A replica is created on Mars, but the Earth-based original is destroyed. The replica is psychologically identical, but is it *you*?  
     - **Constraint Type**: **Hard constraint**. Any theory failing this reduces survival to triviality (e.g., "survival" could be achieved by cloning a corpse).  

  2. **Allow Branching (One-to-Many Survival)**  
     - **Requirement**: The theory must accommodate cases where one person splits into two or more distinct survivors, each claiming continuity with the original.  
     - **Case**: **Split-brain fission**: A brain is divided, and each hemisphere is transplanted into a new body, producing two psychologically continuous individuals. Both inherit the original’s memories and traits.  
     - **Constraint Type**: **Camp preference**. Psychological continuity theories (e.g., Parfit) accept branching; spatiotemporal theories (e.g., animalism) reject it.  

  3. **Gradual Replacement Preserves Identity**  
     - **Requirement**: If a person’s components are replaced incrementally without abrupt changes in consciousness/psychology, identity persists. No "death" occurs mid-process.  
     - **Case**: **10% neuron swap**: Neurons are replaced gradually (10% increments) with synthetic analogs that alter low-level functional mapping but preserve global dynamics. After full replacement, the synthetic entity is psychologically continuous.  
     - **Constraint Type**: **Camp preference**. Favored by psychological continuity theories; rejected by theories requiring strict biological continuity.  

  4. **Spatiotemporal Continuity**  
     - **Requirement**: Survival requires an unbroken physical trajectory through space and time. Gaps (e.g., teleportation) terminate identity.  
     - **Case**: **Teletransportation vs. ordinary travel**. Walking to Mars preserves identity; teletransportation (destroy-and-copy) does not, despite psychological continuity.  
     - **Constraint Type**: **Camp preference**. Essential for animalism or embodied theories; irrelevant for pure psychological accounts.  

  5. **Handle Fusion (Many-to-One Survival)**  
     - **Requirement**: The theory must address mergers of persons into a single entity, explaining whether predecessors "survive" in the fusion.  
     - **Case**: **Mind fusion**: Two individuals (A and B) merge into a single entity C, with blended memories and psychology. Does A or B survive as C?  
     - **Constraint Type**: **Hard constraint**. Fusion tests if theories can handle asymmetric/overlapping identities.  

  6. **Count Coherence (One vs. Two Survivors)**  
     - **Requirement**: The theory must not blur the distinction between one survivor and two. It must resolve ambiguities in branching/fusion.  
     - **Case**: **Fission vs. fusion combo**: If a person splits (fission) and the results later merge (fusion), is the outcome one or two persons? The theory must avoid equivocation.  
     - **Constraint Type**: **Hard constraint**. Collapsing counting undermines moral/legal responsibility (e.g., who is punished for a pre-fission crime?).  

  7. **No Arbitrary Cutoffs**  
     - **Requirement**: Identity cannot depend on arbitrary thresholds (e.g., "51% replacement"). Changes must be evaluated holistically.  
     - **Case**: **Gradual replacement (again)**: Swapping 49% vs. 51% of neurons shouldn’t determinatively kill the person if 50% is acceptable.  
     - **Constraint Type**: **Hard constraint**. Avoids ad hoc solutions.  

  8. **Psychological Continuity as Necessary**  
     - **Requirement**: Some form of psychological connectedness (e.g., memory, intentions, traits) is required for survival.  
     - **Case**: **Amnesia**: Complete psychological discontinuity implies death, even if the body survives.  
     - **Constraint Type**: **Camp preference**. Psychological theories enforce this; biological theories may not.  

  9. **Non-Branching as Necessary**  
     - **Requirement**: Identity must be one-to-one; branching is impossible. Survival requires a unique survivor.  
     - **Case**: **Teletransportation with double release**: Two replicas are created. Neither is the original because identity cannot split.  
     - **Constraint Type**: **Camp preference**. Favored by spatiotemporal/biological theories.  

  10. **Survival Without Psychology**  
      - **Requirement**: The theory must account for identity in cases where psychology is disrupted or absent (e.g., dementia, artificial minds).  
      - **Case**: **Zombie duplication**: A non-conscious organic replica of you is created. Is it you? (Tests theories that over-rely on psychology.)  
      - **Constraint Type**: **Camp preference**. Emphasized by animalism or physicalist theories.  

  ---

  ### **Conflict Analysis: Joint Unsatisfiability**
  **Desiderata in tension**:  
  - **Gradual Replacement Preserves Identity** (from neuron-swap case).  
  - **Non-Branching as Necessary** (from teletransportation double release).  

  **Why they conflict**:  
  - Suppose gradual replacement preserves identity: After 100% neuron replacement, the synthetic entity is *you* because each step maintained continuity.  
  - Now modify the case: **Gradual branching replacement**.  
    - Step 1: Replace 10% of your neurons with synthetic analogs.  
    - Step 2: Instead of discarding the original neurons, use them to grow a duplicate brain in a vat, synced to your state.  
    - Repeat: At each step, you replace 10% of *your* neurons and grow a duplicate set from the removed originals.  
    - Outcome: After 10 steps, there are **two** entities:  
      - (A) The fully synthetic you (from incremental replacement).  
      - (B) A biological duplicate (from reassembling discarded neurons).  
    - Both A and B are psychologically continuous with the original.  

  **The contradiction**:  
  - **Gradual replacement** says A is you (no cutoff).  
  - **Non-branching** says branching is impossible, so *neither* A nor B can be you (or both must be, violating uniqueness).  
  - **Result**: If gradual replacement guarantees survival, branching *must* be possible (since A and B both qualify). If branching is forbidden, gradual replacement *cannot* preserve identity (since it produced two candidates).  

  **Resolution**: Theories must choose:  
  - **Option 1**: Reject non-branching (allow branching). Then gradual replacement can preserve identity, but fission is survival (e.g., Parfit’s view).  
  - **Option 2**: Reject gradual replacement. Then identity requires non-branching, but gradual changes may not preserve identity (e.g., spatiotemporal theories).  

  ---

  ### **Summary of Constraints**
  | **Desideratum**                           | **Case**                     | **Type**          | **Verdict**                                                                 |
  |-------------------------------------------|------------------------------|-------------------|-----------------------------------------------------------------------------|
  | Distinguish survival from similarity      | Teletransportation           | Hard constraint   | Required to avoid trivializing identity.                                    |
  | Allow branching                           | Split-brain fission          | Camp preference   | Incompatible with non-branching.                                            |
  | Gradual replacement preserves identity    | 10% neuron swap              | Camp preference   | Conflicts with non-branching.                                               |
  | Spatiotemporal continuity                 | Teletransportation vs. walk  | Camp preference   | Contingent on theory; rivals psychology.                                    |
  | Handle fusion                             | Mind fusion                  | Hard constraint   | Tests coherence of identity overlaps.                                       |
  | Count coherence (one vs. two)             | Fission-fusion combo         | Hard constraint   | Prevents ambiguous person-counting.                                         |
  | No arbitrary cutoffs                      | Gradual replacement          | Hard constraint   | Eliminates ad hoc thresholds.                                               |
  | Psychological continuity necessary        | Amnesia                      | Camp preference   | Contested by theories emphasizing biology.                                  |
  | Non-branching necessary                   | Double teletransport release | Camp preference   | Conflicts with branching and gradual replacement.                           |
  | Survival without psychology               | Zombie duplication           | Camp preference   | Tests scope of psychology-based theories.                                   |

  **Key takeaway**: No theory satisfies all desiderata. The **gradual replacement** vs. **non-branching** conflict is fundamental. Theories must prioritize:  
  - **Psychological continuity** (accepts branching and gradual replacement).  
  - **Spatiotemporal/biological continuity** (rejects branching, may reject gradual replacement).  
  - **Narrative or pragmatic theories** (sidestep metaphysics but struggle with edge cases).  

  This spec defines the "price of admission" for any theory of survival—choose your axioms, but the edge cases will expose the trade-offs.
