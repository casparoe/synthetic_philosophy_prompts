answer: |-
  Here is a disciplined analysis of the Nixon Shock through the lens of social ontology, mapping your core questions to the historical episode while critically examining the theoretical frameworks:

  ### **Pre-1971 Constitutive Rule (Bretton Woods)**  
  - **X (Token)**: U.S. Federal Reserve notes / dollar-denominated claims  
  - **Y (Status Function)**: Claim on 1/35 oz. gold held by U.S. Treasury  
  - **C (Context)**: International agreements (IMF Articles), U.S. Treasury commitment, central bank settlements  
  - **Searlean Mechanism**: Collective acceptance among central banks, governments, and institutional actors that dollars *were* gold proxies.  

  ---

  ### **The Suspension Event (Aug 1971)**  
  **Action**: Nixon unilaterally suspended gold convertibility, voiding the constitutive rule.  
  **Key Players & Responses**:  
  1. **U.S. Treasury/Fed**:  
     - *Options*: (a) Defend gold peg (infeasible due to inflation/gold drain), (b) Suspend convertibility.  
     - *Action*: Chose (b), asserting dollars remained "money" via legal tender laws and tax obligations.  
     - *Evidence of Status Persistence*: Continued use of dollars domestically (no collapse).  

  2. **Foreign Central Banks (e.g., West Germany, Japan)**:  
     - *Options*: (a) Reject dollars as reserve assets, (b) Acquiesce to new fiat regime.  
     - *Action*: Initial protests (Smithsonian Agreement, 1971), but continued holding/trading dollars.  
     - *Evidence*: Dollar remained primary reserve currency (78% of global reserves by 1975 vs. 71% in 1970).  

  3. **Domestic Economic Agents (U.S. firms/individuals)**:  
     - *Options*: (a) Reject dollars for alternative stores of value (e.g., commodities), (b) Continue using dollars.  
     - *Action*: Widespread (b), driven by legal tender laws, tax liabilities, and network inertia.  
     - *Evidence*: No hyperinflation spike (CPI rose 3.3% in 1972 vs. 4.4% in 1971).  

  4. **Global Markets (Traders, Commodity Pricing)**:  
     - *Response*: Continued dollar pricing of oil/commodities (e.g., Saudi Aramco contracts retained dollar invoicing by 1974–75).  
     - *Evidence*: Dollar remained dominant unit of account despite devaluations (1971, 1973).  

  ---

  ### **Testing the Ontological Frameworks**  
  #### **A. Searle's Institutional Fact Model**  
  - **Prediction**: Status function (*dollar-as-gold-claim*) should collapse when constitutive rule is revoked.  
  - **Contradiction**: Dollar retained its status as "money" globally despite rule suspension.  
  - **Limitation Revealed**: Searle's model cannot explain *persistence* when the original constitutive rule is broken but enforcement/network effects remain. Collective intentionality did not "withdraw" – it adapted pragmatically.  

  #### **B. Coercive-Network Model**  
  - **Mechanisms**:  
    - *State Power*: Legal tender laws, tax obligations forced domestic acceptance.  
    - *Network Effects*: No viable alternative reserve currency; dollar-centric trade/invoicing created switching costs.  
    - *Geopolitical Enforcement*: Petrodollar recycling (1974) leveraged oil markets to sustain demand.  
  - **Evidence For**:  
    - Status function persisted *without* gold backing due to coercion (taxes) and interdependence (trade networks).  
  - **Evidence Against**:  
    - Initial volatility (Dollar Index fell 15% by 1973) suggests *partial* status erosion among international actors.  

  #### **C. Coherence of Your Distinction**  
  - **Backing-Dependent vs. Network-Dependent**:  
    - *Coherent*: Gold backing was *disposable* without catastrophic status failure, proving the dollar's Y-term (*money*) was not ontologically tied to gold.  
    - *Not Brute-Fact Smuggling*: Network/coercion are *social* mechanisms (e.g., legal tender laws are institutional artifacts). Value remains socially constructed, but via layered structures beyond declarative rules.  

  ---

  ### **Critical Limitations in the Framing**  
  1. **"Collective Acceptance" as an Empirical Variable**:  
     - *Problem*: In 1971, "acceptance" was not binary but stratified:  
       - **Domestic**: Coerced compliance (tax laws, legal tender).  
       - **International**: Reluctant acquiescence due to lack of alternatives (no "collective intentionality" in Searle's sense).  
     - *Theoretical Gap*: Searle’s model lacks gradations between *active endorsement*, *passive acquiescence*, and *coerced compliance*.  

  2. **Reading Ontology from Macro-History**:  
     - **Risk**: Assuming the dollar’s status persistence *proves* it was "always" network-dependent ignores path dependence. Bretton Woods’ gold rule *enabled* the network effects that later sustained the fiat dollar.  
     - **Episode’s Lesson**: Institutional facts can morph – the dollar’s Y-term shifted from *"gold substitute"* to *"fiat reserve currency"* via new constitutive practices (e.g., petrodollar deals).  

  3. **What the Frameworks Are Silent On**:  
     - **Status Function Evolution**: Neither model fully explains *how* constitutive rules adapt (e.g., via implicit renegotiation among central banks post-1971).  
     - **Power Asymmetry**: Why did weaker states (e.g., Global South) accept the fiat dollar? Coercion (e.g., U.S. aid conditionalities, IMF loan terms) is undertheorized in Searle.  

  ---

  ### **Conclusion: Illuminating the Episode & Theory**  
  - **Episode → Theory**: The Nixon Shock reveals that institutional status functions can survive the collapse of their original constitutive rules when sustained by:  
    - (a) **Enforcement architectures** (legal tender, tax systems),  
    - (b) **Network externalities** (trade dependencies, switching costs).  
    This supports a **hybrid ontology**: Money is a *coercively maintained network good* that may originate in declarative rules but persists via path-dependent entrenchment.  

  - **Theory → Episode**: Searle’s model explains the *initial stability* of Bretton Woods but not its *fiat afterlife*. The coercive-network view better accounts for persistence but risks ex post facto determinism (e.g., "dollar was always fiat").  

  - **Core Insight**: Your distinction is coherent and *social*: Backing-dependent money fails if the backing evaporates (*gold standard logic*); network-dependent money fails only if the network fragments or enforcement collapses (*fiat logic*). The episode proves the dollar transitioned from the former to the latter, exposing the *plasticity* of institutional reality undergirded by power and interdependence.
