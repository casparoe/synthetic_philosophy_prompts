  For the analogy... Aristotelian accidents won't work because Western properties are inherent to substances, while Mingjia's se (color-determination) is co-constitutive with xing (form). The "bronze ritual vessel" example feels right - the material isn't accidentally bronze; the bronze is essential to it being that ritual object. But I should specify it must lack Western substance/accident baggage while showing how names bind multiple determinations. 

  Ah, the misconceptions map neatly to the lesson sequence: Zeno confusion gets defused when establishing Mingjia's focus isn't physical division but naming; linguistic reduction fails when we contrast ming as binding rather than modifying; Quine gets addressed by emphasizing normative consequences in the ming/shi discussion. 

  The understanding check should force application - maybe asking what "yellow horse is not horse" would imply for naming practices. And yes, explicitly bracketing Mohist logic and Han synthesis is wise - tell students we're isolating the Mingjia move to avoid noise. 

  Wait, did I miss... no, the user emphasized not explaining arguments but scaffolding comprehension. The ritual vessel analogy must include: 1) name as binding material/function 2) absence of substrate. Must exclude any hint of Platonic forms. Perfect. 

  Final touch: the "one thing" takeaway should be Mingjia's anxiety about names failing to guide action if they don't fix actualities. That's what makes it ontological - bad naming collapses social order. Not logic, not language... dao.
answer: |-
  Here’s a focused teaching plan targeting your core concerns, structured to build ontological clarity while preempting common misreadings:

  ---

  ### **1. Dependency Order for Conceptual Foundations**  
  *(Sequence critical for ontological framing)*  
  **First:** Secure **名 (míng) vs. 實 (shí)**  
  - *míng* (name): Conventional signifier with *normative* force (prescribes how things *ought* to be classified).  
  - *shí* (actuality): Concrete particular fulfilling (or failing) a name’s criteria.  
  **→ Without this, students default to linguistic (not normative-ontological) readings.**  

  **Second:** Introduce **形 (xíng) vs. 色 (sè)** as *criteria* for applying names:  
  - *xíng* (form): Structural essence (e.g., equine biology defining "horse").  
  - *sè* (color-determination): Sensory quality (e.g., whiteness).  
  **→ Establishes that names bind *multiple criteria*.**  

  **Third:** Only now present the thesis:  
  *"White horse is not horse"* =  
  A name ("horse") binding *only xíng* ≠ a compound name ("white horse") binding *xíng + sè*.  
  **→ Thesis appears as substantive claim about *name-governed categories*, not contradiction.**  

  ---

  ### **2. The Explanatory Analogy: "Bronze Ritual Vessel"**  
  **What it MUST include:**  
  - A compound name ("*bronze ritual vessel*") binding **material (bronze) + function (ritual)**.  
  - Contrast with the simple name "*vessel*" (binding *only* function).  
  - **Key point:** "A bronze ritual vessel is not [just] a vessel" → Rejecting reduction to functional criteria alone.  

  **What it MUST lack:**  
  - No "substance/accident" framing (e.g., *bronze* isn’t "accidental" to ritual use; it’s constitutive).  
  - No physical divisibility (this isn’t about parts/wholes).  

  **Why it works:**  
  - Mirrors Mingjia’s worry: **Compound names create new categories** with distinct criteria.  
  - Cross-cultural anchor: Avoids Western metaphysics while showing *names as binding commitments*.  

  ---

  ### **3. Mapping & Defusing Misconceptions**  
  | **Misconception**       | **When to Defuse**                          | **Strategy**                                                                 |
  |--------------------------|---------------------------------------------|-----------------------------------------------------------------------------|
  | **Zenonian (motion/division)** | When introducing *xíng/sè*               | *"This isn’t about cutting horses into parts. ‘Form’ and ‘color’ are criteria for applying names, not physical components."* |
  | **Linguistic reduction** | During *míng/shí* distinction              | *"Míng isn’t just a label; it’s a standard for judging shí. If we misapply ‘horse,’ we misjudge actuality."* |
  | **Quinean relativity**   | When presenting the thesis                 | *"For Mingjia, misnaming has consequences: calling a white horse ‘horse’ fails the name’s normative role in guiding action (e.g., selecting horses for a task)."* |

  ---

  ### **4. Check for Understanding**  
  **Prompt:** *"If a farmer demands you bring her a ‘horse’ (馬), why might bringing a white horse (白馬) fulfill the request, yet Gongsun Long insist it does not?"*  

  **Target Insight:**  
  - Correct answer distinguishes:  
    - **Linguistic convention:** Colloquially, "horse" includes white horses.  
    - **Mingjia ontology:** "Horse" *as a name* prescribes only *xíng*. "White horse" binds *xíng + sè*.  
    - **Consequence:** Bringing a white horse fails if "horse" was meant to exclude color (e.g., "bring a horse [meaning bay horses only]").  
  **→ Reveals grasp of naming’s normative role in fixing shí.**  

  ---

  ### **5. What to Omit & Explicitly Bracket**  
  **Omit:**  
  - Mohist logical critiques (e.g., *"white horse is horse"* rebuttals).  
  - Later Han syntheses (e.g., Dong Zhongshu).  
  - The dialogue’s *full* rhetorical structure (focus on §§1–2 only).  

  **Explicitly Tell Students:**  
  *"Today we isolate Gongsun Long’s move to expose Mingjia’s core worry: names fixing actualities. We bracket later debates (Mohist, Han) to avoid conflating their projects."*  

  ---

  ### **Teaching Flow (50-Minute Sequence)**  
  1. **(5 min)** Hook: *"Why would anyone claim a white horse isn’t a horse? Let’s uncover the anxiety driving this."*  
  2. **(15 min)** Found: **míng/shí** distinction + examples (e.g., "ruler" míng vs. corrupt shí).  
  3. **(10 min)** Introduce **xíng/sè** as name criteria. Defuse Zeno here.  
  4. **(10 min)** Present thesis via "Bronze Ritual Vessel" analogy. Defuse Quine/linguistic reduction.  
  5. **(5 min)** Check for understanding + discussion.  
  6. **(5 min)** Conclusion: Mingjia’s fear—bad naming collapses social/ontological order (*zhengming*).  

  **Key Takeaway:**  
  Mingjia’s ontology isn’t about language or logic—it’s about **names as rigid designators binding criteria**, where slippage = ethical/cognitive failure.
