prompt: |-
  There's this Japanese practice — Shikinen Sengu at Ise — where they completely tear-down and rebuild the Grand Shrine every 20 years with fresh cypress. Same layout, same rituals, but after two cycles none of the original wood is left; meanwhile they keep the sacred mirror untouched in the inner shrine. At the same time, museum conservators treat replacing one beam in a 400-year-old tea house like a moral catastrophe. So what theory of object identitiy does the shrine practice actually presuppse? Functionalist? Ritual continuity? Something weirder that lets physical matter be disposable but not the ritual role? And is it even consistent with how law treats a corporation as "the same entity" after every shareholder, employee, and asset has turned over? Keep it under 350 words, lead with a one-sentence bottom line, then say whether the practice strictly needs one metaphysics or is just compatabile with several. Also tell me what would have to change in heritage conservation law if we adopted the shrine's implicit view for buildings everywhere.
reasoning: |-
  Okay, the user is asking about the Shikinen Sengu ritual at Ise Grand Shrine in Japan. They're comparing the complete rebuilding of the shrine every 20 years with fresh wood to how museum conservators treat replacing even one beam in a historic tea house as catastrophic. The user wants to know what theory of object identity this practice presupposes - whether it's functionalist, ritual continuity, or something else. They're also asking about parallels with corporate identity where all assets and people change over time, and how heritage conservation law would need to change if we applied the shrine's approach universally.

  I need to understand the key differences in preservation philosophy here. The Ise Shrine practice involves completely dismantling and rebuilding the structures every 20 years using the same design and rituals. They preserve the form and function rather than the material. In contrast, Western conservation prioritizes maintaining original materials as much as possible. The sacred mirror in the inner shrine remains untouched, which is an interesting exception that emphasizes ritual continuity.

  The core question is about object identity - what makes the rebuilt shrine "the same" as the previous one? It seems to be about the continuity of ritual practice, spiritual presence, and function rather than physical material. This aligns with functionalist views where the purpose and role define identity, not the substance. But it's also tied to specific Shinto beliefs about renewal and purity.

  For the corporate analogy, corporations are legally considered the same entity even as shareholders, employees, and assets completely change over time. This is based on legal continuity rather than physical continuity. The shrine practice similarly emphasizes continuity of tradition and ritual function over physical matter.

  If we applied this approach to heritage conservation globally, laws would need dramatic changes. Preservation standards that prioritize original material would have to shift to focus on maintaining design integrity, crafting skills, and ritual practices. We'd need to allow periodic reconstruction using traditional methods while preserving sacred relics separately. This would require redefining what constitutes "authenticity" in conservation - moving from material authenticity to functional and ritual authenticity.

  I should structure my response with a clear bottom line up front, then explain that while functionalism is a good description, the practice is compatible with multiple metaphysical views. I'll also outline the specific changes needed in heritage law to accommodate this perspective.
answer: |-
  **Bottom line:** The Ise Shrine practice presupposes that an object's identity is defined by its *ritual function, form, and the continuity of its sacred purpose*, not by the persistence of its original physical matter.

  **Metaphysical Compatibility:**
  *   **Primary Fit:** **Ritual/Functional Continuity:** The shrine's identity resides in the uninterrupted replication of its form using prescribed materials/techniques and the ongoing performance of rituals that maintain its sacred role. The wood is a necessary *vessel* for this function, deliberately renewed.
  *   **Compatible Views:** It's also compatible with a **Process Metaphysics**, where the shrine is a dynamic *event* of cyclical renewal. **Institutional Identity** (like corporations) fits well, as the entity persists through defined roles/procedures despite material turnover. It *weakly* fits **Functionalism** (identity via purpose), but the *ritualized* method of achieving that function is crucial here.

  **Consistency with Corporate Identity:** Yes, it's highly consistent. Both rely on **formal continuity of structure and role**: the shrine persists through defined rebuilding rituals and consecration, just as a corporation persists through legal formalities and the continuity of its charter/purpose, regardless of complete turnover in physical assets or personnel. Identity is maintained institutionally, not materially.

  **Heritage Law Changes:**
  Adopting the Ise view universally would necessitate radical shifts:

  1.  **Redefine Authenticity:** Shift focus from *material authenticity* (original fabric) to *process authenticity* (traditional craftsmanship, techniques) and *functional/ritual authenticity*.
  2.  **Mandate Cyclical Renewal:** Legal frameworks would need to permit, even require, the periodic, complete reconstruction of significant structures using traditional methods, provided the form and ritual context are preserved.
  3.  **Protect Craft & Knowledge:** Laws would prioritize safeguarding the intangible cultural heritage (skills, rituals, designs) necessary for accurate renewal over preserving decaying original material.
  4.  **Differentiate Sacred Relics:** Acknowledge specific irreplaceable elements (like the mirror at Ise) requiring different, preservation-focused treatment, distinct from the renewable structure.
  5.  **Accept Material Transience:** Legally recognize that a building's identity and heritage value can endure *despite* the complete replacement of its physical substance via sanctioned processes.
