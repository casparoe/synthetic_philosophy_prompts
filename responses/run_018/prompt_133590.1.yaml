prompt: |-
  I'm giving a seminar next thursday defending my "recursive exposure" take on the boundary problem — who belongs to the demos isn't about citizenship or being affected, but about being inside the causal feedback loop of whatever decision actually gets enforced. I'm applying it to urban watershed governance, so my claim is that the demos for water policy should include upstream proxy reps for non-human ecosystems, but only when those ecosystems are genuine nodes in the feedback loop and not just passive victims. The audience is mostly urban planners who care whether this is implimentable, one democratic theorist who's all about "all affected interests," plus a legal scholar obsessed with jurisdictional lines. Draft my Q&A prep sheet: the objections I'll actually get, ordered by how much damage they'd do, each phrased the way thier field would put it, with a short reply and a note on where the reply is soft. Tell me what to concede up front, and include the one question I'm hoping nobody asks. Write everything in American English, and don't ask me for citations or a reading list — I need this to work offline.
