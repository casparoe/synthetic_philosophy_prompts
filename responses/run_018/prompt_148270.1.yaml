answer: |-
  Here's the full specification for a universal theory of pleasure, addressing the heterogeneity problem:

  **Desiderata for a Universal Theory of Pleasure:**

  1.  **Universal Coverage:** Must account for all phenomenologically distinct pleasures:
      *   *Sensory:* Taste (sweet), touch (warm bath), smell (fresh coffee).
      *   *Homeostatic Relief:* Thirst quenched, pain cessation, fatigue alleviation.
      *   *Cognitive:* "Aha!" moment, solving a puzzle, intellectual satisfaction, aesthetic appreciation (gazing at a landscape).
      *   *Social:* Schadenfreude, pride, vicarious joy, bonding/affiliation feelings, shared laughter.
      *   *Achievement/Mastery:* Completing a difficult task, skill execution (flow state), winning a game.
      *   *Perverse/Complex:* Enjoying one's own humiliation (masochistic element), bittersweet nostalgia, "guilty" pleasures, relief mixed with sadness.
      *   *Calm/Contentment:* Serene well-being, absence of striving, deep peace.

  2.  **Key Distinctions to Preserve:**
      *   **Pleasure vs. Liking (Wanting/Desire):** Must explain cases of "liking" without concurrent pleasure (e.g., addict wanting a drug they no longer enjoy) and pleasure without prior wanting (e.g., unexpected delight). *Non-Negotiable.*
      *   **Pleasure vs. Mere Absence of Suffering:** Must capture the *positive* phenomenal character of relief and contentment, distinguishing it from a neutral state. *Non-Negotiable.*
      *   **Higher vs. Lower Pleasures (Qualitatively):** Must provide a non-circular basis for qualitative differences (e.g., Mill's "competent judge" preference) without presupposing "higher" = "more pleasurable" or relying solely on source/cause. *Potentially Relaxable* if a theory successfully reduces qualitative differences to quantitative ones without loss.
      *   **Pleasure vs. Positive Evaluation:** Must distinguish feeling pleasure from judging something good/valuable (e.g., appreciating a virtue intellectually without feeling pleasure).
      *   **Pleasure vs. Motivation:** Must account for pleasures that don't necessarily motivate further action (contentment) and motivations not driven by anticipated pleasure (duty).

  3.  **Empirical Constraints:**
      *   **Distributed Neural Correlates:** No single "pleasure center." Must accommodate involvement of diverse systems (e.g., orbitofrontal cortex, nucleus accumbens, insula, ventral pallidum, opioid/cannabinoid systems) varying by pleasure type. *Non-Negotiable.*
      *   **Dissociation of "Liking" and "Wanting":** Must align with evidence that neural substrates for hedonic impact ("liking") can be dissociated from those for incentive salience ("wanting"). *Non-Negotiable.*
      *   **Phenomenal Consciousness:** Pleasure is a conscious experience. The theory must posit a constitutive link to subjective feel. *Non-Negotiable.*
      *   **Graded Intensity:** Must account for the variable intensity of pleasure experiences (mild contentment to intense euphoria).
      *   **Temporal Dynamics:** Must cover transient pleasures (bite of food) and sustained states (contentment).

  **The Requirement That Wipes Out Major Theories:** **The Dissociation Constraint (Pleasure vs. Liking/Wanting).**

  *   **Felt-Quality Theories:** Fail because they cannot explain how the *same* proposed intrinsic feeling (e.g., "hedonic tone") can exist without the desire to sustain it (liking without wanting) or how the desire can exist without the feeling (wanting without liking). The feeling itself is supposed to be the motivator.
  *   **Pro-Attitude Theories:** Fail catastrophically. If pleasure *is* a pro-attitude (desire for the experience to continue), it cannot account for:
      *   Cases of wanting an experience to continue *without* concurrent pleasure (addiction compulsion).
      *   Cases of experiencing pleasure *without* any concurrent desire for the state to continue (e.g., intense, overwhelming pleasure where desire is absent or a calm state of contentment without active desire).
  *   **Functionalist Theories (Standard):** Fail if they define pleasure by its typical causal role (e.g., causing desire to sustain, reinforcing behavior). The dissociation evidence shows pleasure (liking) is neither necessary nor sufficient for wanting or reinforcement. A state can play the "functional role" (motivate, reinforce) without being pleasurable (wanting without liking).

  **Theory Scorecard:**

  | Theory Type         | Universal Coverage | Dissociation (Liking/Wanting) | Higher/Lower Non-Circular | Neural Plausibility | Overall Viability |
  | :------------------ | :----------------- | :---------------------------- | :------------------------ | :------------------ | :--------------- |
  | **Felt-Quality**    | Low (Struggles with diversity e.g., relief vs. schadenfreude) | **FAIL**                      | Medium (If quality is primitive) | Low (Implies single quality) | Low              |
  | **Pro-Attitude**    | Medium (Can define broadly)      | **CATASTROPHIC FAIL**         | High (Via attitude object) | Medium              | Very Low         |
  | **Functionalism**   | **High** (Flexible)              | **FAIL** (If defining via standard causal role) | Medium (Risk of circularity) | **High** (Flexible) | Low              |

  **Non-Negotiables:** Universal Coverage, Pleasure vs. Liking/Wanting Distinction, Pleasure vs. Mere Absence of Suffering, Distributed Neural Correlates, Dissociation Evidence, Phenomenal Consciousness Link.
  **Potentially Relaxable:** Providing a non-circular qualitative distinction (Higher/Lower), Detailed neural implementation mechanism, Evolutionary explanation.
