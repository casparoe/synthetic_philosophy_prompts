prompt: |-
  In mass-casualty triage protocols—such as SALT and START—emergency services explicitly deprioritize patients with the gravest injuries and the greatest resource needs, directing care instead toward those whose survival is probable with minimal intervention, precisely to maximize the number of survivors. The same institutions, in ordinary clinical practice, reject aggregate welfare calculations—like quality-adjusted life-year maximization—as a legitimate basis for denying care to any identifiable patient, insisting instead that each person has an individual claim that cannot be overridden by statistical benefits to others. This creates a bifurcated system: aggregation is forbidden in the clinic but treated as mandatory in the crisis zone. What philosophical commitments does that institutional split presuppose? Reconstruct the implicit theory of moral justification: does it assume a Scanlon-style contractualist framework in which, during routine care, no patient could reasonably reject being treated as having an absolute claim, but in which, under crisis conditions, the worst-off can be told that others could not reasonably reject being saved first? Or does the split reveal that the practice is not genuinely contractualist but rather a concealed form of rule-utilitarianism, using individualist language for ordinary ethics and aggregative logic for emergencies? Distinguish what the practice strictly requires from what merely accommodates it—whether contractualism genuinely licenses the crisis exception, or whether the exception undermines contractualism’s core rejection of aggregation. Then consider a revised protocol in which every triage decision had to be justified pairwise to the specific patient being deprioritized, as contractualism demands; describe what would have to change in emergency medicine if that revision were adopted, and say whether the current bifurcation is philosophically stable or incoherent. Say how confident you are in your reconstruction, and single out the point about which you are least sure. Lead with your bottom line in the first sentence, then give the reasoning with no preamble and no restating of the question. Write in American English.
reasoning: |-
  Okay, the user is asking about the philosophical underpinnings of triage protocols like SALT and START versus ordinary clinical ethics. They point out this tension: in mass-casualty situations, we aggregate welfare to save as many as possible, but in regular care, we treat each patient as having an absolute claim. The user wants me to reconstruct the implicit moral theory here—is it contractualist like Scanlon, or is it actually rule-utilitarianism in disguise? 

  First, I need to unpack the core of the question. The user is highlighting a real inconsistency in how healthcare systems operate. In emergencies, we deprioritize the gravely injured based on aggregate outcomes, which sounds utilitarian. But day-to-day, we reject QALY-style calculations that could deny care to individuals for the greater good. That does seem like a split personality in ethics. 

  Hmm, let's think about contractualism. Scanlon says an act is wrong if it can't be justified to others on grounds they couldn't reasonably reject. In normal times, you could argue no patient would accept being denied care just to marginally benefit others—so individual claims hold. But in crises? Maybe the deprioritized patient couldn't reasonably reject being passed over if it means saving multiple lives instead. That feels plausible... but is it consistent? If contractualism fundamentally rejects aggregation, how can it suddenly allow summing lives in triage? 

  Now the rule-utilitarian angle: perhaps the whole system is covertly utilitarian, using individualist language as a stable rule for daily operations but dropping it when efficiency demands. That would explain the switch, but it's philosophically dishonest—the institutions explicitly deny aggregative ethics in clinics. 

  The user also asks about a hypothetical "pairwise justification" protocol where medics must explain each triage call to the deprioritized patient. That's fascinating. If we took Scanlon literally, medics would need to stop and say, "Sir, I'm not treating your massive hemorrhage because saving these two mildly injured people maximizes overall survival." But in a crisis, that's absurd—it wastes time and could cause psychological harm. So adopting this would cripple emergency response. 

  My bottom line? The split isn't stable contractualism; it's a pragmatic hybrid leaning utilitarian in crises. But I'm least sure about whether contractualism can stretch to cover triage without betraying itself—maybe "reasonable rejection" just works differently when resources evaporate? Still feels like aggregation sneaks in. 

  Confidence-wise, I'm solid on the critique but shaky on whether there's a hidden contractualist argument for the exception. The pairwise thought experiment really exposes the tension.
answer: |-
  The institutional split reflects a pragmatic hybrid model prioritizing rule-utilitarianism in crises while adopting contractualist rhetoric in routine care, though this bifurcation is philosophically unstable.  

  **Reconstructing the implicit theory**:  
  The practice superficially resembles contractualism in ordinary settings by affirming that patients can reasonably reject being denied care for aggregate benefits (e.g., QALY calculations). However, crisis triage violates core contractualism by permitting aggregation—deprioritizing one patient to save others without their consent or individualized justification. This suggests the system is not genuinely contractualist but operates as **rule-utilitarianism**: individual rights are enforced as a beneficial *rule* under normal resource conditions, while crises trigger an exception where aggregate welfare directly overrides individual claims. Contractualism cannot consistently license the crisis exception because Scanlon’s framework categorically rejects aggregating harms/benefits across persons; the triage exception *requires* such aggregation, undermining contractualism’s essence.  

  **Revised protocol implications**:  
  If every triage decision required pairwise justification to the deprioritized patient (as contractualism demands):  
  - Emergency protocols would collapse. Medics would need to halt lifesaving efforts to explain decisions (e.g., "I cannot treat your unsurvivable injuries because saving three others maximizes lives saved"), wasting critical time and escalating psychological trauma.  
  - Triage categories (e.g., "expectant" patients) would become ethically untenable, as no patient could reasonably accept being designated "unsavable" without contestation.  
  - Outcome-focused efficiency—central to mass-casualty response—would be subordinated to individual consent, reducing overall survival rates.  

  **Stability assessment**:  
  The bifurcation is **incoherent** as moral philosophy: it inconsistently applies aggregation based on context rather than principle. Contractualism’s rejection of aggregation is absolute; the crisis exception reveals institutions ultimately default to utilitarian logic when stakes are high. Yet the system retains rhetorical contractualism in routine care to preserve trust and avoid QALY’s political unpalatability.  

  **Confidence and uncertainty**:  
  I am highly confident the split reflects unstable rule-utilitarianism. My greatest uncertainty is whether *any* coherent non-utilitarian framework could justify crisis triage—perhaps a Scanlonian "generalizable emergency principle" might exist, but no such construct is articulated in current protocols.
