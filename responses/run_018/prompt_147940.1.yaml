  What philosophical commitments about work, leisure, and autonomy does this messy triple system preseuppose? Reconstruct the implicit theory: is leisure a negative liberty, a welfare good, or just recovery-time for labor-power? Does the karoshi threshold logic presuppose a probabilistic, risk-curve view of harm that clashes with the intentionalist framing of labor contracts? Is the buyout option compatible with leisure being inalienable?

