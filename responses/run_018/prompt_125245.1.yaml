  - Case #4 (man who believes he's a ghost) shows mistaken attributes don't negate existential awareness 
  - But Case #3 (ex nihilo man) isn't a perfect analog because that's about biographical emptiness, not structural indistinction 

  The decisive test? Have the ecstatic man suddenly return to normal consciousness. If he immediately reports "I was absorbed in being," that implies continuous implicit self-awareness (Rule C). If he needs inference to reconstruct his state ("something happened but I don't know who experienced it"), that supports Rule B. 

  *checks uncertainty points* 
  Least confident about whether Avicenna's psychology permits such radical ego-dissolution. In Al-Mabda' wal-Ma'ad he describes mystical union as "annihilation" (fana) - does that mean temporary suspension of first-personhood? 70% confidence in my reading because he always treats selfhood as ontologically primary. 

