answer: |-
  Here is a step-by-step decision procedure grounded in epistemic integrity, designed for efficiency and structural awareness. Reviewers should complete each stage sequentially, stopping if any "Do Not Fund" criterion is met.

  ---

  ### **Adversarial Collaboration Good-Faith Assessment Protocol**

  **Time Budget:** 30 minutes per proposal  
  **Materials Needed:** Project proposal, CVs/bios of key collaborators, public statements/articles from both groups  

  ---

  #### **Stage 1: Doxastic Openness Assessment**  
  *(Tests willingness to revise core beliefs)*  

  1.  **Question:** *"Describe a specific piece of empirical evidence (not hypothetical) that, if produced by this collaboration, would cause your side to significantly modify your current policy position. What would change and why?"*  
      **Sufficient Answer:** Identifies *concrete, falsifiable* evidence (e.g., "If the study shows carbon pricing increases energy poverty in communities X/Y despite rebates, we’d abandon statewide cap-and-trade").  
      **Insufficient:** Vague responses ("new insights"), deflection ("evidence can’t capture our values"), or inability to name meaningful revisions.  
      **Stopping Point:** **Do Not Fund** if either side fails this.  

  2.  **Question:** *"What evidence has caused your side to update its position in the past 3 years? How did it change your view?"*  
      **Sufficient Answer:** Cites specific studies/events with clear before/after shifts (e.g., "Air quality data from Policy Z made us prioritize localized enforcement over carbon taxes").  
      **Insufficient:** No examples, dismissive framing ("minor adjustments only").  
      **Referral:** If updates are trivial or defensive, escalate to senior board.  

  ---

  #### **Stage 2: Dialectical Openness Assessment**  
  *(Tests ability to accurately represent opponents)*  

  3.  **Question:** *"In one paragraph, summarize the opposing side’s core argument in terms they would endorse as fair. Cite their publications/leaders."*  
      **Sufficient Answer:** Paraphrases opposition’s strongest case without straw-manning (e.g., carbon tax critics: "Proponents argue pricing is the *most efficient* tool to reduce emissions while funding equity programs via rebates [cite Smith 2023]").  
      **Insufficient:** Misrepresents key claims (e.g., "They think poor people don’t deserve clean air"), uses loaded terms ("reckless deregulation"), omits citations.  
      **Stopping Point:** **Do Not Fund** if either side fails.  

  4.  **Question:** *"Does your summary above match how the opposing team describes their view in Section 2.1 of the proposal? If not, explain discrepancies."*  
      **Sufficient Answer:** Acknowledges alignment or neutrally explains differences (e.g., "We emphasized efficiency; they framed it as innovation incentives").  
      **Insufficient:** Defensive/accusatory responses.  
      **Referral:** Escalate if reviewers suspect motivated misreading.  

  ---

  #### **Stage 3: Structural Echo Chamber Audit**  
  *(Tests awareness of institutional biases)*  

  5.  **Question:** *"List 3 influential studies/reports your institution frequently cites that the opposition likely disputes. How would you verify their methodology *with* opponents in this project?"*  
      **Sufficient Answer:** Names specific contested sources (e.g., "We cite Tech Institute’s AI risk benchmarks; we’ll co-design replication protocols"). Concrete verification plans.  
      **Insufficient:** Dismisses need for verification ("our sources are peer-reviewed"), cites only in-group work.  

  6.  **Question:** *"What evidence would your institution *ignore* as illegitimate? Why?"*  
      **Sufficient Answer:** Transparent criteria (e.g., "Non-peer-reviewed blogs; we’ll use adversarial peer review").  
      **Insufficient:** Broad categorical exclusions ("industry-funded research," "activist narratives").  
      **Stopping Point:** **Do Not Fund** if either side preemptively rejects evidence types central to the opposition.  

  ---

  #### **Stage 4: Collaboration Design Check**  
  *(Tests procedural fairness)*  

  7.  **Question:** *"How will disagreements about methodology/interpretation be resolved? Show specific arbitration mechanisms."*  
      **Sufficient Answer:** Clear, symmetric process (e.g., "Dual lead authors; 3rd-party mediator for deadlocks").  
      **Insufficient:** Vague commitments ("we’ll discuss"), unilateral control.  
      **Referral:** Escalate if asymmetry remains unresolved.  

  ---

  ### **Worked Applications**

  #### **Case 1: Carbon Pricing Proponents (CPP) vs. Equity Critics (EC)**  
  - **Stage 1:**  
    - CPP pass: "If data shows rebates fail to reach 20% of vulnerable households, we’d demand universal direct cash."  
    - EC pass: "If pricing reduces emissions *without* increasing racial disparities in pollution hotspots, we’d support pilot programs."  
  - **Stage 2:**  
    - CPP *fail* if they summarize EC as "anti-market ideologues."  
    - EC *pass* if they note CPP’s efficiency arguments fairly.  
  - **Stage 3:**  
    - EC *referral* if they reject all modeling studies as "neoliberal pseudoscience."  
  - **Verdict:** Fund if Stage 2/3 passes.  

  #### **Case 2: AI Safety Researchers (AS) vs. Open-Source Advocates (OS)**  
  - **Stage 1:**  
    - AS pass: "If open-source audits match proprietary safety tests, we’d oppose mandatory licensing."  
    - OS pass: "If scaling curves show sudden capability jumps, we’d support staged releases."  
  - **Stage 2:**  
    - AS *fail* if they frame OS as "prioritizing hobbyists over human extinction."  
    - OS *fail* if they call AS "regulatory capture lobbyists."  
  - **Stage 3:**  
    - AS *referral* if they categorically reject open-source risk assessments.  
  - **Verdict:** **Do Not Fund** if Stage 2 fails.  

  ---

  ### **Unwelcome Outcome Example**  
  **Case:** *Abortion Policy Study*  
  - **Stage 1:** Both sides specify updatable empirical claims (e.g., impacts on maternal mortality).  
  - **Stage 2:** "Pro-life" team accurately summarizes "pro-choice" safety arguments.  
  - **Stage 3:** "Pro-choice" team rejects all data from crisis pregnancy centers as "inherently fraudulent."  
  - **Verdict:** **Do Not Fund** (structural bad faith via institutional filtering).  
  *Why unwelcome?* Both individuals are sincere, but institutional constraints prevent evidence reciprocity.  

  ---

  ### **Explicit Limitations**  
  This procedure **cannot**:  
  1. Guarantee productive outcomes (good faith ≠ truth-conducive dynamics).  
  2. Detect hidden strategic motives (e.g., gaining access to opponents’ networks).  
  3. Assess the quality of research design.  
  4. Resolve fundamental value conflicts (e.g., "efficiency vs. equity" weights).  
  5. Predict institutional backlash against collaborators.  

  **Final Output:**  
  - **Fund:** Pass all stages with ≤1 referral.  
  - **Do Not Fund:** Any stopping point failure.  
  - **Senior Board Review:** All referrals + unresolved Stage 4 issues.  

  The procedure filters for *minimal conditions for truth-seeking* but remains agnostic to moral stakes or political feasibility. It prioritizes epistemic safety over consensus-building.
