  I'm trying to locate where my own reasoning about escalation fails. Give me your credence—between 0 and 1—that in the dollar auction (highest bidder wins $1, both pay their final bid), the rational explanation for bids exceeding $1 is not a failure of backward induction, but rather a sequential collapse of common belief in rationality at each node after the first bid, such that each new bid is locally rational given the updated belief about the opponent. Decompose this precisely: (a) the probability that the rules actually contain a stable, common-knowledge stopping point that backward induction should identify; (b) the probability that placing the first bid already fractures common knowledge of payoff-maximization, making the second bid rational conditional on that fracture; (c) the probability that this explanation survives an asymmetric variant in which the winner takes $1.20 and the loser pays only half their bid—a case I use to test whether sunk-cost logic or structural commitment dynamics drive the result; and (d) how these combine into your overall credence, with explicit identification of which sub-estimate dominates your final number and what observation about common-knowledge reasoning in finite games would shift your estimate most.
