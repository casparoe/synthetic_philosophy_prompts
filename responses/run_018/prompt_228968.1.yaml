            |-- Yes -> Q2
            |      |-- Yes -> Modest foundationalism
            |      |-- No -> Classical foundationalism
            |
            |-- No -> Q3
                   |-- Yes -> Infinitism
                   |-- No -> Q4
                           |-- Yes -> Q5
