answer: |-
  ### Core Mechanism
  Teams compete to derive target strings by applying MIU rules to the axiom "MI", earning points for targets but losing points per step, forcing them to eventually stop and prove impossibility via a public ledger that reveals invariants—without explicit instruction—while a twist alters a rule to invalidate their invariant.

  ---

  ### Rules and Materials
  **Materials**:  
  - Whiteboard or shared digital document (public ledger).  
  - Handouts: MIU rules, targets, points scheme.  
  - Timer.  

  **Game Rules**:  
  1. **Teams**: 5–6 teams of 3–4 students.  
  2. **Start**: All teams begin with the axiom "MI".  
  3. **Turns**: 90-second turns per team (rotating). On their turn, a team chooses:  
     - **Apply a rule**: Derive a new string from any public string. Write it on the ledger. **Cost**: -1 point per step.  
       - *If the string is a target*: +10 points.  
     - **Declare impossibility**: For a target, submit an "impossibility certificate" (template provided later).  
       - *Correct*: +15 points, target retired.  
       - *Incorrect*: -5 points, team skips next turn.  
     - **Pass**: No action, no penalty.  
  4. **Public Ledger**: All derived strings are displayed (with team name). No duplicates.  
  5. **Winning**: Highest score after 45 minutes (or when all targets are resolved).  

  **Points Rationale**:  
  - Grinding steps costs points (-1/step), making blind derivation unsustainable.  
  - Blanket impossibility declarations risk penalties (-5 if wrong), but stopping to prove saves points.  
  - Targets include:  
    - **Easy derivable** (quick points, e.g., "MII").  
    - **Impossible** (requires proof, e.g., "MU").  
    - **Invariant-silent** (derivable, but invariant doesn't block it, e.g., "MUI").  

  ---

  ### Targets and Answer Key
  1. **Target: MII** (Derivable)  
     - **Derivation**:  
       - MI → MII (Rule 2: Mx → Mxx, where x = "I").  
     - **Steps**: 1. **Points**: -1 (step) + 10 (target) = +9.  

  2. **Target: MU** (Impossible)  
     - **Impossibility Argument**:  
       - **Invariant**: Number of "I"s modulo 3 ≠ 0.  
       - Axiom "MI": 1 "I" → 1 mod 3 = 1 (≠0).  
       - Rule 1: xI → xIU → "I" count unchanged → preserves mod 3.  
       - Rule 2: Mx → Mxx → doubles "I"s (k → 2k). If k ≢ 0 mod 3, 2k ≢ 0 mod 3 (since 2 and 3 coprime).  
       - Rule 3: xIIIy → xUy → removes 3 "I"s → k ≢ 0 → k-3 ≢ 0 mod 3.  
       - Rule 4: xUUy → xy → no "I"s changed → invariant preserved.  
       - Target "MU": 0 "I"s → 0 mod 3 = 0 (violates invariant).  

  3. **Target: MUI** (Derivable, invariant-silent)  
     - **Derivation**:  
       - MI → MII (Rule 2: Mx → Mxx, x = "I").  
       - MII → MIIII (Rule 2: Mx → Mxx, x = "II").  
       - MIIII → MUI (Rule 3: x = "M", III, y = "I" → xUy = "MUI").  
     - **Steps**: 3. **Points**: -3 + 10 = +7.  
     - **Note**: Invariant (k ≢ 0 mod 3) holds for MUI (1 "I" ≢ 0 mod 3), but it’s derivable—shows invariant incompleteness.  

  ---

  ### Impossibility Certificate Template  
  *(Handed out when teams are stuck, e.g., after 20 minutes)*  
  ```markdown
  # Impossibility Certificate for Target: ______  
  **Property P**: [e.g., "Number of 'I's is not divisible by 3"]  

  **Check**:  
  1. **Axiom MI has P**: [Explain, e.g., "1 'I' → not divisible by 3"]  
  2. **Rule 1 preserves P**: [If a string has P, applying xI → xIU keeps P. Why?]  
  3. **Rule 2 preserves P**: [If a string has P, applying Mx → Mxx keeps P. Why?]  
  4. **Rule 3 preserves P**: [If a string has P, applying xIIIy → xUy keeps P. Why?]  
  5. **Rule 4 preserves P**: [If a string has P, applying xUUy → xy keeps P. Why?]  
  6. **Target lacks P**: [e.g., "MU has 0 'I's → 0 is divisible by 3"]  
  7. **P is non-vacuous**: [Give a string *without* P, e.g., "MU" (not derived, but in alphabet). *This rules out "always true" properties.*]  
  ```  

  ---

  ### Last-Ten-Minutes Twist  
  - **Rule Change**: Alter **Rule 2** from "Mx → Mxx" to "Mx → Mxxx" (triple the string after "M").  
  - **Effect on Invariant**:  
    - Original invariant (k ≢ 0 mod 3) breaks:  
      - Axiom "MI": 1 "I" (1 mod 3 ≠ 0).  
      - New Rule 2: "MI" → "MIII" (3 "I"s → 0 mod 3). Invariant violated!  
  - **MU Now Derivable**:  
    - MI → MIII (New Rule 2: Mx → Mxxx, x = "I").  
    - MIII → MU (Rule 3: x = empty, III, y = empty → xUy = "MU").  
  - **Lesson**: Rule changes break invariants—meta-reasoning must adapt.  

  ---

  ### Minute-by-Minute Timeline  
  **Total: 80 minutes**  
  - **0–5 min**: Divide teams, hand out rules/targets, explain game (no theory terms).  
  - **5–50 min**: Gameplay (45 min).  
    - Teams derive strings, update public ledger.  
    - Facilitator enforces rules/points, **nudges if stuck**: "Why is no one getting MU? Check patterns in the ledger."  
  - **50–60 min**: **Twist**: Announce Rule 2 change. Teams re-test MU (now derivable).  
  - **60–70 min**: **Debrief**: Map gameplay to concepts:  
    | **Game Moment**               | **Concept**                          | **Asymmetry Lesson**                          |  
    |-------------------------------|--------------------------------------|-----------------------------------------------|  
    | Applying rules step-by-step   | Working *inside* the system          | Inside: Can derive provable strings           |  
    | Scanning ledger for patterns  | "Jumping out" to meta-reason         | Outside: Can prove *non*-derivability         |  
    | Submitting a certificate      | Formalizing an invariant proof       | Outside *cannot* prove derivability (e.g., MUI required inside work) |  
    | Invariant breaking in twist   | System-dependence of invariants      | Rules define what is possible                 |  
  - **70–80 min**: Name concepts ("invariant," "meta," "proof," "jump out"), link to computation/cognition.  

  ---

  ### Predictable Problems and Solutions  
  1. **Problem**: Teams misapply rules (e.g., force "III" → "U" in non-consecutive "I"s).  
     - **Solution**: Facilitator intervenes: "Show me the exact substring ‘III’ in your string."  
  2. **Problem**: Teams hoard derivations, avoid public ledger.  
     - **Solution**: Enforce: "All new strings *must* go on the ledger—no private work!"  
  3. **Problem**: Teams declare "MU" impossible too early (without pattern-spotting).  
     - **Solution**: Penalize incorrect certificates (-5 points); ledger will show invariant over time.  
