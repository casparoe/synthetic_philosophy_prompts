prompt: |-
  Throwaway context: about two months ago I got seconded off my normal job onto a small team helping a transitional justice commission here draft its charging framework for the old regime. Not a lawyer, by the way — I'm the person who reads things and writes memos. The fight on the team is basically: do we prosecute under the penal code that was on the books while the crimes were happening (which mostly covers ordinary murders, tortures, disappearances, but not the systemic part, and not the people who gave the orders from a desk), or do we write new offenses now and apply them to conduct from before. Half the room keeps saying "Nuremberg did exactly that, so we're fine," and the other half says "Nuremberg was victors' justice and a show trial," and I've lost patience with both moves.

  So here's what I actually want. Take the Nuremberg and Tokyo tribunals and analyze them through the lens of the legality principle — nullum crimen, nulla poena sine lege, no crime or punishment without pre-existing law. What I want from the lens is a careful mapping, not a verdict.

  Some things I need you to keep separate, because I think everyone on my team is collapsing them:

  1. Retroactive creation of a new crime (crimes against peace, crimes against humanity).
  2. Retroactive removal of a defense that existed in the defendants' own military law — the superior orders point.
  3. Retroactive innovation in who gets to try whom at all, i.e. an international court over the heads of a sovereign state, and over heads of state.

  I want to know which of those three the legality principle actually bites on, and how hard, because it seems to me (2) might be a different problem from (1) and people lump them together.

  Also: one of my colleagues sketched a ladder that we've started using, and I want you to use it rather than your own taxonomy, because I need to see where it breaks. Rung 1: an existing crime, retroactively redefined or re-labeled. Rung 2: a new crime whose underlying conduct was already criminal in the defendant's own domestic system (murder, theft, rape are crimes everywhere) but now charged as something bigger. Rung 3: a new crime covering conduct that was widely condemned morally and politically at the time but not codified as an international offense. Rung 4: a new crime covering conduct nobody had clearly condemned as criminal when it happened. Place the main Nuremberg and Tokyo charge categories on those rungs and tell me if the ladder is doing any real work or if it just restates the conclusion.

  And I want a second test run alongside it: the swap test. Would we accept the same doctrine if the other side had won and were prosecuting us? Concretely: the Allies were not going to charge their own area bombing of cities or the atomic bombings as crimes against humanity, and Tokyo left the Emperor alone. Say what the swap test shows — does it show the doctrine is corrupt, or does it show something narrower and more interesting, like that any tribunal is going to be asymmetric in who it can reach and that the legality principle was never designed to fix that?

  Then the other direction: what do these two tribunals show about the legality principle itself? Is this a case it confirms (it's a fair-notice principle and the defendants did have notice, in some sense, that what they were doing was monstrous), an anomaly it has to swallow (the one time everyone agrees we should break it), or a case it never anticipated — i.e. evidence that the principle is really about constraining officials and giving citizens a stable planning environment, and simply has no application to people who made the law themselves? (Someone on the team keeps invoking that German postwar writer who said that extremely unjust statutes aren't really law; I want your view on whether that's a way out or a way of changing the subject.)

  Please don't give me "the crimes were so heinous that legality had to yield" and don't give me "victors' justice, end of story." I've read both. And where the principle is genuinely silent, say so rather than making it speak. Maybe 900 to 1200 words of analysis.

  After the analysis, two structured things.

  First, a table, one row per charge or issue, with exactly these columns:
  issue | rung_1_to_4 | analogue_in_defendants_own_law (yes / partial / no) | notice_verdict (adequate / contested / absent) | swap_test (passes / fails / unclear) | what_our_commission_should_do_with_it (max 15 words)
  Rows: crimes against peace (aggressive war), war crimes, crimes against humanity, conspiracy or common plan, superior orders, and the non-prosecution of the victors' own conduct.

  Second, a JSON object with exactly these fields:
  principle_verdict (one of "confirmation", "anomaly", "unanticipated_case")
  what_the_principle_is_really_about (one sentence)
  rungs_safe_for_us_to_use (list of numbers)
  rungs_we_should_not_touch (list of numbers)
  weakest_step_in_the_mapping (one sentence)
  one_thing_to_stop_saying_in_the_room (one sentence)
reasoning: |-
  Okay, let me unpack this user's request carefully. They're clearly deeply immersed in a high-stakes transitional justice process, frustrated with oversimplified "Nuremberg card" arguments from colleagues. The core need is a granular, taxonomy-driven analysis of retroactivity issues in the WWII tribunals - specifically avoiding moralistic or political conclusions they've already rejected. 

  Hmm, their framework requests are precise: that ladder taxonomy (rungs 1-4), swap test, and legality principle dissection. Smart how they separate the three retroactivity types - creation of new crimes (1), removal of defenses (2), jurisdictional innovation (3). Most commentators blur these. 

  The user's background matters here. As a non-lawyer memo writer in a commission, they need actionable analysis, not theoretical debates. That "max 15 words" instruction for the table shows they'll use this in tense meetings. The German Radbruch formula mention suggests someone's invoking natural law arguments - which they rightly suspect might be a diversion.

  For the legality principle analysis, I'll need to distinguish:
  - Formal notice (was it written down?)
  - Constructive notice (should they have known?)
  - The "sovereign's paradox" (how can rulers claim no notice of limits on power?)

  On the rungs: 
  - Rung 1 (relabeling) feels weakest legally - like charging ordinary murder as CAH without new elements
  - Rung 2 (new aggregation) has more legitimacy when conduct was domestically criminal
  - Rung 3 (uncodified but condemned) is Nuremberg's CAH territory
  - Rung 4 (truly novel) doesn't apply here

  The swap test reveals uncomfortable truths - Tokyo prosecutors overlooking Allied firebombing proves selectivity, but doesn't invalidate the entire legal framework. Better to frame this as inherent asymmetry in transitional justice rather than hypocrisy.

  For the table, I'll need concise verdicts:
  - Aggressive war (rung 3, partial analogue, contested notice)
  - Superior orders (rung 1, retroactive defense removal)
  - Non-prosecution row crucial for their "both sides" colleagues

  Final JSON should emphasize that legality principle is primarily a citizen's shield against state power - less relevant when state architects become defendants. The "one thing to stop saying" field must kill that tired "Nuremberg was just victor's justice" line they're hearing daily.

  This needs surgical precision - every point must help them redirect committee debates toward legally substantive ground.
answer: |-
  Here is a granular analysis of Nuremberg/Tokyo through the legality principle lens, structured as requested:

  ### Core Analysis
  The legality principle (*nullum crimen*) fundamentally concerns **fair notice and constraint of state power**. Its bite varies significantly across your three categories:

  1.  **Retroactive Creation of New Crimes:** This is the core tension. Crimes Against Peace (aggressive war) and Crimes Against Humanity (systematic persecution) *were* novel international offenses. While precedents existed (Kellogg-Briand Pact, Hague Conventions, Martens Clause), they lacked clear individual criminal liability and procedural definitions. This fits **Rung 3** (widely condemned, uncodified crime). The principle bites hardest here, contesting notice. The defense "they knew it was wrong" appeals to moral notice, not legal certainty.

  2.  **Retroactive Removal of a Defense (Superior Orders):** This is **Rung 1** (redefining existing law). Most defendants' military codes *conditionally* allowed the defense (requiring illegality to be manifest). Nuremberg *modified* this by declaring manifestly criminal orders inherently unlawful, removing the defense's absolute nature. The principle bites less severely. Pre-existing military law *already* conditioned the defense on legality, implying soldiers had constructive notice of limits. This is a doctrinal shift, not wholly novel law. The key is the *standard* for "manifest illegality" – arguably lower than pre-existing "knew to be unlawful" standards in some codes.

  3.  **Retroactive Jurisdictional Innovation:** The principle traditionally governs *substantive* crimes/punishments, not jurisdiction creation. Sovereign immunity doctrines were the barrier. The tribunals asserted jurisdiction based on state consent (London Charter) and the inherent illegality of the acts. *Nullum crimen* doesn't directly address "who tries whom," focusing instead on *what* is tried. This is a distinct sovereignty/jurisdiction issue. The principle is largely silent here.

  **The Ladder Test (Applied):**
  *   **Rung 1 (Relabeling/Redefining):** *Superior Orders Defense Removal* (modification of existing doctrine).
  *   **Rung 2 (New Crime, Domestically Criminal Conduct):** *War Crimes* (murder, torture, etc. of POWs/civilians). Core acts were criminal under German/Japanese law and Hague/Geneva rules. The "international armed conflict" element was new aggregation.
  *   **Rung 3 (New Crime, Widely Condemned Conduct):** *Crimes Against Peace* (Kellogg-Briand condemned war; aggressive war concept existed but lacked individual liability/definition). *Crimes Against Humanity* (persecution/murder of civilians widely condemned, but "in connection with" aggressive war/other crimes was a novel jurisdictional hook; systematic state policy element uncodified).
  *   **Rung 4 (New Crime, No Prior Condemnation):** *Not applicable* to core Nuremberg/Tokyo charges. (Conspiracy/Common Plan is procedural).
  *   **Ladder Evaluation:** It usefully distinguishes *degrees* of retroactivity. Its value lies in forcing analysis of whether the *underlying conduct* was considered wrongful/criminal *somewhere* (Rung 2 vs. Rung 3) and separating defense modifications (Rung 1). It doesn't resolve the core Rung 3 legitimacy debate but clarifies the terrain. It risks oversimplifying "condemnation" (e.g., was aggressive war *criminally* condemned pre-1945?).

  **The Swap Test:**
  Applying Allied doctrines to their own conduct (area bombing, atomic bombs, Emperor's immunity) demonstrates **selective enforcement and inherent power asymmetry**, not necessarily doctrinal corruption *per se*. The test fails spectacularly on **non-prosecution of victors' conduct**. This reveals:
  *   The tribunals were **structurally incapable** of judging the victors.
  *   **Jurisdictional limits** were defined by the victors (e.g., CAH required connection to aggressive war, which only Axis committed).
  *   *Nullum crimen* is **agnostic on selectivity**; it governs defining the crime *for the defendant*, not who *else* gets charged. The swap test highlights a *different* principle: equality before the law. It shows the tribunals were **asymmetric accountability mechanisms**, not that the *legal definitions themselves* were inherently invalid if applied universally (though victors clearly had no intent to do so).

  **Legality Principle Interpretation:**
  The tribunals present an **unanticipated case**. The principle evolved to protect citizens from arbitrary state power. Here, defendants *were* the state architects. Arguments that they had "moral notice" or that their laws were "extremely unjust" (Radbruch formula) **change the subject**:
  *   **Radbruch Formula:** A powerful *moral/political* argument for overcoming positivism ("unjust law is no law"). However, it **circumvents** *nullum crimen*, which is precisely *about* requiring positive law for conviction. Invoking it concedes the retroactivity problem and seeks to justify overriding the principle, not resolve it within the principle's terms. It's a way out *of* the legality principle, not an application *of* it.
  *   **Core Function:** The principle is **primarily about constraining officials and providing citizens a stable legal environment for planning conduct**. Its core function breaks down when officials dissolve the very legal order. The tribunals exposed a gap: how to legally condemn regime architects operating beyond or through perverted domestic law. The principle wasn't designed for this scenario, making it an **unanticipated case** requiring development beyond strict positivism, not merely an "anomaly" or "confirmation."

  ---

  ### Structured Outputs

  **Table:**

  | issue                          | rung_1_to_4 | analogue_in_defendants_own_law | notice_verdict | swap_test | what_our_commission_should_do_with_it                     |
  | :----------------------------- | :---------- | :------------------------------ | :------------- | :-------- | :-------------------------------------------------------- |
  | Crimes Against Peace           | 3           | Partial (Kellogg-Briand)        | Contested      | Fails     | Avoid. Requires strongest justification; high retroactivity risk. |
  | War Crimes                     | 2           | Yes (Domestic + Int'l Hague)    | Adequate       | Passes*   | Safest path. Ground in pre-existing domestic/int'l norms. |
  | Crimes Against Humanity        | 3           | Partial (Domestic crimes exist) | Contested      | Fails     | Use cautiously. Clearly tie to pre-existing domestic crimes; avoid excessive novelty. |
  | Conspiracy / Common Plan       | (Procedural)| N/A                             | Contested      | Unclear   | Avoid novel conspiracy charges; focus on substantive acts. |
  | Superior Orders Defense        | 1           | Yes (modified)                  | Adequate       | Passes    | Permissible. Condition defense on manifest illegality standard. |
  | Non-prosecution of victors     | N/A         | N/A                             | N/A            | Fails     | Acknowledge asymmetry; focus on prosecutable offenses fairly. |

  *(Passes: Conduct was criminal; Fails: Selective non-application evident)

  **JSON:**

  ```json
  {
    "principle_verdict": "unanticipated_case",
    "what_the_principle_is_really_about": "Constraining state power and providing citizens stable expectations for lawful conduct.",
    "rungs_safe_for_us_to_use": [1, 2],
    "rungs_we_should_not_touch": [4],
    "weakest_step_in_the_mapping": "Asserting 'moral notice' satisfies the fair notice requirement of nullum crimen for Rung 3 crimes.",
    "one_thing_to_stop_saying_in_the_room": "Stop claiming Nuremberg proves Rung 3 retroactivity is always legally unproblematic; it required unique justification."
  }
  ```

  **Key Implications for Your Commission:**
  *   Prioritize **Rung 2** (existing crimes aggregated/relabeled) and cautious **Rung 1** (defense modifications like superior orders). These align best with *nullum crimen*.
  *   **Rung 3** (Crimes Against Humanity analogue) is legally vulnerable but potentially necessary; mitigate risk by:
      *   Maximizing linkage to pre-existing *domestic* crimes within the old regime's own law (e.g., murder, persecution).
      *   Explicitly basing it on conduct widely condemned *within the state* or by its *own prior international commitments*, not just external norms.
      *   Avoiding excessive novelty in definitions.
  *   **Avoid Rung 4** entirely and novel **Conspiracy** charges.
  *   Acknowledge **asymmetry** (Swap Test failure) as a political reality of transitional justice, not a flaw automatically invalidating the legal framework. Focus on fairness *within* the cases you can prosecute.
  *   Ground arguments in the **old regime's own laws** where possible (Superior Orders, War Crimes) – this strengthens notice and legitimacy.
  *   The Radbruch formula is a **political/moral argument**, not a legal solution to retroactivity; use it sparingly if at all in *legal* drafting.
