answer: |-
  Your dilemma cuts to the heart of epistemology, ethics, and the philosophy of action. The tension you feel reflects a genuine philosophical boundary, but your aunt's position can be coherently defended without collapsing into wishful thinking—if framed within specific ethical constraints. Below is a principled framework for navigating such irreconcilable ambiguities:

  ### Core Principles for Ethically Permissible "Pragmatic Beliefs"
  1.  **The "Forced Choice" Condition**: Belief must be practically unavoidable for fulfilling non-negotiable moral duties. If suspending judgment would paralyze essential ethical action (e.g., abandoning vulnerable communities your family committed to support), and no neutral path exists, belief becomes a *practical necessity*. Your aunt’s "moral paralysis" argument hinges on this.

  2.  **The "No Defeater" Constraint**: The belief must not contradict *known* evidence. While the fragment is ambiguous, it doesn't *prove* collaboration; it merely allows conflicting interpretations. If clear evidence of collaboration existed (e.g., an undisputed document), sustaining the original belief would be dishonest.

  3.  **The "Moral Scaffolding" Criterion**: The belief must sustain a *preexisting, independently justified moral commitment*. You don’t invent new duties to fit the belief; the belief preserves duties already central to your identity and relationships. Abandoning it would rupture concrete obligations (e.g., community funding, trust with descendants).

  4.  **The "Integrity-Preserving" Requirement**: The belief must align with your core values *without self-coercion*. You cannot *force* yourself to believe the impossible. Instead, focus on *acting under the description* ("We honor Grandmother as a protector") while acknowledging evidentiary limits. This is a practical stance, not a factual assertion.

  5.  **The "Epistemic Humility" Clause**: Explicitly acknowledge the ambiguity. Say: "Given the lost archives, we cannot know her actions with certainty. But we choose to continue her *legacy* as we understand it—because these commitments matter." This separates historical truth from ethical practice.

  ### Why This Isn't Mere Wishful Thinking
  -   **Practical Reason vs. Theoretical Reason**: Your aunt prioritizes *practical reason* (how to act) over *theoretical reason* (what to believe). When evidence is permanently inaccessible, demanding certainty before acting can be its own ethical failure. Philosophers like William James ("The Will to Believe") and Charles Taylor argue that in "genuine options" (living/forced/momentous choices), we may commit to beliefs that enable vital action.
  -   **Narrative Identity**: Humans make sense of life through narratives. Abruptly dismantling a foundational narrative—especially one sustaining moral projects—causes existential and social harm. Preserving a *morally generative* narrative isn't deception if it serves justice and you remain open to revision *should evidence emerge*.
  -   **The Alternative Isn't Neutrality**: Suspending judgment *is* an action with consequences: it weakens the resolve needed to sustain your commitments. In ethics, refusing to choose often serves the status quo—which here may mean abandoning vulnerable communities.

  ### Boundaries: When Pragmatic Belief Becomes Unethical
  -   **If New Evidence Emerges**: Should incontrovertible proof of collaboration surface, clinging to the belief violates the "No Defeater" constraint.
  -   **If Duties Are Not Genuine**: If the "obligations" serve self-interest or perpetuate harm (e.g., covering up wrongdoing), the belief is corrupt.
  -   **If It Demands Denying Ambiguity**: Insisting the fragment *must* mean X despite specialists' disagreement crosses into dogmatism.

  ### A Coherent Path Forward
  You can reconcile your intellectual integrity with your aunt’s pragmatism:
  > *"We cannot know the full historical truth about Grandmother's actions. The evidence is lost, and the fragment is ambiguous. However, her legacy—as lived through our family's decades-long commitment to this community—is real and morally compelling. We choose to continue honoring her *as an organizer who protected the vulnerable* because this narrative sustains our concrete duties to others. Should new evidence ever emerge, we will face it honestly. But in the absence of truth, we prioritize the living ethics she inspired."*

  This stance:
  -   Acknowledges epistemic limits.
  -   Grounds action in proven moral commitments (your family’s actual work).
  -   Avoids asserting false certainty.
  -   Preserves obligations without self-deception.

  **The defensible principle is this: When irreparable evidentiary gaps force a choice between moral paralysis and action, and one option sustains essential, preexisting duties without contradicting known facts, adopting the *practical stance* that enables ethical continuity is not just permissible—it may be a duty of care.** This is not claiming knowledge, but choosing how to live amid unanswerable questions. Your tension arises because truth *matters*, but so does justice—and in this liminal space, ethics may demand we let justice guide us when truth is beyond reach.
