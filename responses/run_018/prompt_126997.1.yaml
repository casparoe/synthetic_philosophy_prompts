  I should make sure the explanation distinguishes this from similar fallacies. For example, it's not a bait-and-switch because both parts support anti-physicalism, just in different ways. The problem is the intuitive weight comes from the thick description, but the conceivability relies on the thin one. 

  Providing examples would help. Like when someone says "I can imagine a functional duplicate without consciousness" (thin) but then describes zombies as "empty shells" (thick), the latter evokes a stronger reaction but depends on importing subjective experience into the initial conception. 

  This user is clearly deep in the literature—they reference "explanatory gap" and "motte-and-bailey." They need a precise, academically rigorous response. Coining a Latin or Greek term might appeal, but a clear descriptive phrase is probably more useful for immediate use in philosophy circles. 

