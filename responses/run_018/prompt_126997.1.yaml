prompt: |-
  hey, quick question from a phd student in phil of mind who isnt quite in the zombie literature proper. theres this move i keep noticing in discussions of the conceivability argument: someone claims they can conceive a zombie world, but when you press them on whether theyve really imagined every physical fact -- like the exact quantum state of every neuron -- they retreat to saying they only need the functional blueprint, not the full physical description. then, a few paragraphs later, they lean on the vivid intuition that a zombie would seem hollow or lack that inner glow to argue the explanatory gap is real. so they secure conceivability with a thin, stripped-down description, but borrow the punch from a thick, phenomenologically loaded picture of what a zombie would be like. is there an established name for this kind of slide between thin modal imagination and thick phenomenological intuition? i know its not quite equivocation, and not exactly motte-and-bailey, since both versions are supposed to support the same anti-physicalist conclusion. if theres no term, can you coin one with clear boundary conditions -- e.g., does it apply to any modal argument that uses an underspeccified base, or is it specific to consciousness debates where the intuition depends on smuggling in first-person data?
