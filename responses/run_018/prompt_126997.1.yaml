answer: |-
  Your observation cuts to the heart of a critical methodological tension in zombie arguments. This move is indeed pervasive and problematic, but lacks a universally accepted name. Let's break it down and propose a precise coinage with boundary conditions:

  **The Core Problem:**
  1.  **Thin Conceivability Claim:** Uses an *underspecified, functional, or macro-level description* (e.g., "behaviorally identical," "physically identical at the neuronal level," "functional duplicate") to establish *prima facie* conceivability. This makes the scenario seem easy to imagine ("Sure, I can imagine that!").  
  2.  **Thick Intuition Appeal:** Relies on the *vivid, phenomenologically rich intuition* of what the *absence* of consciousness entails (e.g., "hollowness," "dark inside," "lacking inner glow," "just going through the motions") to generate the powerful intuition of an *explanatory gap* and the seeming impossibility of physicalism closing it. This intuition draws on our deep, first-person acquaintance with consciousness.

  **The Illicit Slide:** The vividness and force of the *thick intuition* are illegitimately transferred to support the modal claim established by the *thin conceivability*. The thin description makes conceivability plausible; the thick intuition makes the gap seem undeniable. But the thick intuition *presupposes* an understanding of consciousness that the thin description deliberately avoids specifying.

  **Proposed Term:** **The Phenomenological Conceivability Gap (PCG) Gambit**  
  *(or "Thin Conceivability/Thick Intuition Gambit")*

  **Boundary Conditions & Definition:**

  1.  **Applies Specifically to Modal Arguments about Consciousness:** The core issue arises *only* when the target phenomenon is subjective, qualitative experience (phenomenal consciousness). The "thickness" relies on first-personal acquaintance.
  2.  **Requires a Modal Claim:** The argument must involve a claim about possibility/impossibility derived from conceivability (e.g., zombies are conceivable, therefore possible; consciousness is inconceivably arising from the physical, therefore impossible).
  3.  **Involves an Underspecified Base:** The initial conceivability claim relies on a description that is intentionally *less* than the full physical micro-state (e.g., functional, behavioral, organizational, coarse-grained physical). This base is chosen precisely *because* it seems easier to conceive independently of consciousness.
  4.  **Smuggles First-Person Data for Intuitive Force:** The argument leverages the powerful, pre-theoretical intuition generated by imagining the *phenomenological absence* (the "what it's like" being missing), an intuition grounded in our direct experience of consciousness. This thick intuition is essential to the argument's persuasiveness but is not justified by the thin conceivability base alone.
  5.  **The Gap:** There exists a logical gap between the *kind* of description used to secure conceivability (thin, functional, underspecified) and the *kind* of intuition used to establish the explanatory gap (thick, phenomenological, relying on first-person knowledge). The argument slides over this gap without bridging it.

  **Why This Captures Your Observation:**
  *   **"Phenomenological Conceivability Gap":** Highlights the mismatch between the *type* of conceivability employed (thin, non-phenomenal) and the *type of intuition* needed (thick, phenomenal) to feel the force of the gap.
  *   **"Gambit":** Indicates a potentially risky argumentative maneuver where the force depends on an unexamined slide.
  *   **"Thin Conceivability/Thick Intuition":** Explicitly names the two components and the illicit transfer of force from the latter to the former.

  **Distinguishing from Similar Concepts:**
  *   **Not Equivocation:** The *terms* (like "zombie" or "consciousness") aren't shifting meaning; the *basis* of the conceivability claim vs. the basis of the intuitive force is shifting.
  *   **Not Motte-and-Bailey:** The "thin" claim isn't a defensible retreat position; it's the *initial* step used to *enable* the "thick" intuition. Both are presented as supporting the *same* anti-physicalist conclusion simultaneously, not as separate claims where one is retreated to.
  *   **More Specific than "Explanatory Gap":** This names a specific *argumentative tactic* used to *exploit* or *establish* the explanatory gap feeling, not the gap itself.
  *   **Not Just Any Underspecified Modal Base:** It's specifically problematic *because* the thick intuition required relies on smuggled first-person knowledge that the thin base explicitly avoids. Underspecification in, say, imagining a different chemical composition for water doesn't involve this phenomenological smuggling.

  **Why Coining a Term is Useful:** It provides a precise tool to call out this specific maneuver, forcing proponents to either:
  1.  Defend the conceivability of zombies under the *thick* description (which is much harder, as it requires genuinely imagining the absence of consciousness *while* fully specifying the microphysical state), or
  2.  Justify how the force of the thick intuition legitimately applies to the conclusion drawn from the thin conceivability claim (which seems impossible without collapsing the distinction).

  Your identification of this "slide" is astute and points to a fundamental vulnerability in how the conceivability argument is often presented rhetorically. The **Phenomenological Conceivability Gap Gambit** names and diagnoses this vulnerability.
