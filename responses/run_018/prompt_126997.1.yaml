  Hmm, this is an interesting observation. Let me recall the conceivability argument first. It usually goes: if you can conceive of a zombie world (physically identical but no consciousness), then consciousness isn't physical. But as the user notes, when pressed, proponents don't actually imagine every physical detail—they think of the functional blueprint. Yet when arguing for the intuition that zombies lack inner experience, they're invoking a rich, vivid sense of what that absence feels like. 

  I should check if there's an established term for this. I remember David Chalmers distinguishes primary and secondary conceivability, but that's not exactly this. There's also the idea of the "phenomenal concept strategy" but that's more about explaining the gap. The user mentions it's not quite equivocation or motte-and-bailey. They're right—those don't fit perfectly because both moves aim for the same conclusion, just with different levels of description.

  So maybe coining a term makes sense. The key elements are the shift from thin (functional) to thick (phenomenological) and the borrowing of intuitive force. "Thin Conceivability/Thick Intuition Gambit" captures that duality. Boundary conditions would include: must involve modal imagination, underspecified base, reliance on first-person phenomenology for impact, and occurring in consciousness debates specifically. 

  I wonder if the user is also hinting at a deeper frustration. As a PhD student, they might be looking for precise tools to critique arguments in their field. Naming this move could help in their own research or discussions. They might need this to strengthen their critique of anti-physicalist arguments, or perhaps they're developing a response in their thesis. The request for boundary conditions suggests they want clarity to apply it rigorously. 

