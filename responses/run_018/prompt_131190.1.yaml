  Rules Document:

  **The Malthusian Tension Game**

  **Objective**: To experience the philosophical tension in long-run predictions where a theory may be "right but early" (like Malthus's theory of population outstripping resources) due to unforeseen innovations.

  **Roles**:
  - **Defenders (3 students)**: Defend the structural theory that population growth (geometric) will inevitably outstrip resource growth (arithmetic), leading to crises (famine, war, etc.). They present the gap projection at the start of each round.
  - **Critics (3 students)**: Argue that human ingenuity (via innovations) can prevent crises. They play Innovation Cards to boost resources or slow population growth.
  - **Adjudicators (4 students)**: Judge the theory's status each round by voting: "Falsified" (theory is wrong), "Suspended" (unsure), or "Rescued" (theory is right but temporarily averted). They hold credibility chips (5 each) and may lose chips for incorrect judgments at the end.

  **Materials**:
  - Whiteboard/chart showing:
      - Population: starts at 100, grows geometrically (doubles each round unless modified).
      - Resources: starts at 100, grows arithmetically (adds 100 each round unless modified).
  - Innovation Cards deck (12 cards, see examples below).
  - Credibility chips (e.g., poker chips, paper clips, or just tally on paper).

  **Innovation Cards Examples (make 12 cards, 2 of each type)**:
  1. **Green Revolution**: Add 200 to current resources. Then, increase base resource growth by 50 for all future rounds.
  2. **Synthetic Fertilizer**: Add 150 to current resources. Then, increase base resource growth by 30 for all future rounds.
  3. **Industrial Revolution**: Add 100 to current resources. Then, increase base resource growth by 100 for all future rounds.
  4. **Education for Women**: Permanently change population growth factor to 1.5 (from 2.0) starting this round.
  5. **Demographic Transition**: Change population growth factor to 1.5 for this round and the next round (then returns to 2.0).
  6. **Family Planning Programs**: Change population growth factor to 1.5 for this round only.

  **Setup**:
  1. Assign roles.
  2. Critics receive 3 random Innovation Cards. Shuffle the remaining cards into a draw pile.
  3. Initialize the chart: 
     - Round 0: Population=100, Resources=100, Base Resource Growth=100, Population Growth Factor=2.0.
  4. Adjudicators get 5 credibility chips each.

  **Round Procedure (repeat for Rounds 1-5)**:
  1. **Defenders' Presentation (2 min)**:
     - Project next round's population and resources *without innovation*:
          - Population = current population × 2
          - Resources = current resources + base resource growth
     - Highlight the gap (population - resources) and argue that a crisis is imminent if no innovation occurs.

  2. **Critics' Turn (2 min)**:
     - Decide whether to play one Innovation Card. If played, announce and apply its effects immediately:
          - Apply any one-time boosts to current resources.
          - Apply any changes to base resource growth (affects next round and beyond).
          - Apply any changes to population growth factor (for current round and beyond as specified).
     - If playing a card that affects population growth, recalculate this round's population using the new factor.

  3. **Update State**:
     - Calculate this round's population and resources:
          - Population = (previous population) × (current growth factor)
          - Resources = (previous resources) + (base resource growth) + (any one-time boost from card)
     - Update the base resource growth and population growth factor for the next round (if changed by a card).
     - Calculate gap = population - resources.

  4. **Crisis Check**:
     - Crisis occurs if: (gap > 0) AND (Critics did not play a card this round).
     - If crisis occurs, Defenders declare: "Crisis has struck!"

  5. **Adjudicators' Vote (3 min)**:
     - Discuss and vote by secret ballot: "Falsified", "Suspended", or "Rescued".
     - Record the majority vote and individual votes for chip accounting later.

  6. **End of Round**:
     - Critics draw one card from the deck (if available).

  **End of Game (after Round 5)**:
  - **Chip Penalties** (administered by instructor):
     - If the game ended with **no crisis in any round**: 
          - Theory is considered **falsified**. 
          - Adjudicators lose 1 chip for every "Rescued" vote they cast.
     - If the game ended with **at least one crisis** (any round): 
          - Theory is considered **validated at least once**.
          - Adjudicators lose 1 chip for every "Falsified" vote they cast (anytime) because they doubted the theory that eventually had a crisis.
     - "Suspended" votes never lose chips.
     - Adjudicators keep their remaining chips as "credibility points".

  **Debrief (15 min)**:
  1. **Historical Mapping**:
     - Round 1: ~1800 (Malthus's time; balance).
     - Round 2: ~1830-1850 (early industrialization; first innovations).
     - Round 3: ~1870-1900 (technological boosts; synthetic fertilizers).
     - Round 4: ~1950-1970 (Green Revolution).
     - Round 5: ~2000-present (demographic shifts; continued innovation).

  2. **Discussion Questions**:
     - At which round did you feel the theory was "right but early"? Why?
     - How did the Adjudicators decide between "Rescued" and "Falsified" when an innovation was played?
     - Did the Defenders feel the theory was being unfairly judged? How?
     - What does this game reveal about falsification in long-run predictions?
     - Can a theory be "right but early" forever? When would we declare predictive bankruptcy?

  **Predictable Issues**:
  - **Number balancing**: The gap may grow too fast/slow. Adjust card effects on the fly if needed (e.g., "This card gives +300 instead of +200").
  - **Role confusion**: Defenders/Critics may not know how to argue. Provide prompts: Defenders stress inevitability; Critics stress human adaptability.
  - **Time management**: Use a timer. Skip draws if behind.
  - **Chip accounting**: It’s complex. Simplify by only penalizing "Falsified" votes if any crisis occurred.
  - **Unrealistic rescue**: The game cannot simulate waiting 200 years. Acknowledge that real-world verification takes generations.

  **What the Game Can’t Capture**:
  - The actual passage of time (centuries) and uncertainty of future innovations.
  - Regional disparities (crisis in one area, not globally).
  - Ethical dimensions (e.g., innovations’ side effects).

  Run the game, embrace the chaos, and focus on the philosophical tension!
