  ### **The "Right But Early" Prediction Game**  
  *(Designed for a 60-minute seminar with 10 students)*  

  ---

  #### **Game Overview**  
  Three teams reenact the tension of long-run predictions (like Malthus’s population-resource gap). Defenders argue a structural crisis is inevitable, Critics delay it with innovations, and Adjudicators judge if the theory is falsified, suspended, or rescued each round. The goal: feel the pull between "right but early" vs. "falsified."  

  ---

  #### **Roles & Materials**  
  **Teams (10 players total):**  
  - **Defenders (3 players):** Protect the structural theory.  
  - **Critics (3 players):** Play "Innovation Cards" to shift resource curves.  
  - **Adjudicators (4 players):** Vote using "Credibility Chips."  

  **Materials:**  
  1. **Projected Gap Chart** (whiteboard or poster):  
     - *Population Curve:* Starts at 100, doubles each round (geometric growth).  
     - *Resource Curve:* Starts at 100, adds 100 each round (arithmetic growth).  
  2. **Innovation Cards Deck** (12 cards, 2 of each type):  
     - *Green Revolution:* +200 to resources this round, then +150/round (not +100).  
     - *Synthetic Fertilizer:* +150 to resources this round, resource growth +30/round forever.  
     - *Demographic Transition:* Halve population growth this round (×1.5, not ×2).  
     - *Industrial Revolution:* +100 to resources, resource growth +100/round forever.  
     - *Education for Women:* Permanently reduce population growth to ×1.5.  
     - *Disease/Conflict:* −50 to population (forces Critics to "fix" a crisis).  
  3. **Credibility Chips:** 5 per Adjudicator (use paper clips, poker chips, or tally marks).  

  ---

  #### **Rules**  
  **Setup (5 min):**  
  - Defenders draw the starting gap chart (Pop 100, Resources 100).  
  - Critics get 3 random Innovation Cards; shuffle the rest into a draw pile.  
  - Adjudicators get 5 chips each.  

  **Each Round (8 min/round × 4 rounds):**  
  1. **Defenders’ Turn (1 min):**  
     - Project the gap for the current round *without innovations* (e.g., Round 1: Pop 200, Resources 200).  
     - Argue: "The gap will widen—crisis is inevitable without divine/social collapse!"  

  2. **Critics’ Turn (2 min):**  
     - Play **one Innovation Card** (or pass). Apply its effect immediately to the chart.  
     - Argue: "This innovation changes everything—no crisis!"  
     - *After voting*, draw one new card (if deck has cards left).  

  3. **Crisis Check:**  
     - **Crisis occurs** if:  
       - Population > Resources *and* Critics played **no card** that round.  
     - **No crisis** if:  
       - Resources ≥ Population, *or* Critics played a card (even if Pop > Resources).  

  4. **Adjudicators’ Vote (3 min):**  
     - Secret ballot on the theory’s status:  
       - **Falsified:** "The core theory is wrong—innovation prevents crisis permanently."  
       - **Suspended:** "Unclear—wait and see."  
       - **Rescued:** "The theory is right, but delayed by innovation."  
     - Tally votes (majority wins).  

  5. **Update Chart:**  
     - Recalculate Population/Resources for the next round (using new growth rates if changed).  

  **Scoring (End of Game):**  
  - Adjudicators lose chips if:  
    - They vote **Falsified** and a **later crisis occurs**. (−1 chip per wrong vote).  
    - They vote **Rescued** for **3+ consecutive rounds** with no crisis ("Predictive Bankruptcy," −2 chips).  
  - *Suspended* votes never lose chips.  
  - Winner: Team with most credibility (Adjudicators) or fewest crises (Defenders/Critics).  

  ---

  #### **Predetermined Rounds (The Malthusian Arc)**  
  *Play these scenarios—no need to announce the historical parallels until debrief.*  
  - **Round 1 (1800s):**  
    - *Baseline:* Pop 200, Resources 200 (no gap).  
    - *Critics likely pass or play weak card.*  
    - *Adjudicator tension:* Vote "Suspended"—no crisis, but gap looms.  
  - **Round 2 (Early 1900s):**  
    - *Baseline:* Pop 400, Resources 300 (crisis without innovation!).  
    - *Critics play Synthetic Fertilizer:* Resources jump to 450 (Pop 400).  
    - *Adjudicator tension:* Vote "Rescued" (innovation worked... for now).  
  - **Round 3 (1960s):**  
    - *Baseline:* Pop 800, Resources 450 (crisis without innovation!).  
    - *Critics play Green Revolution:* Resources jump to 650, future growth +150/round.  
    - *Adjudicator tension:* Vote "Falsified" or "Rescued"? Gap persists but is delayed.  
  - **Round 4 (2000s):**  
    - *Baseline:* Pop 1,600, Resources 800 (crisis without innovation!).  
    - *Critics play Demographic Transition:* Pop grows to 1,200 (not 1,600).  
    - *Adjudicator tension:* "Rescued" again? Risk "Predictive Bankruptcy."  

  ---

  #### **Debrief (15 min)**  
  **Map to History & Discuss:**  
  1. **Round 1 (1800s):** Malthus publishes *Essay on Population*; UK census shows balance.  
     - *Q: Did this feel like "suspended judgment"? Why?*  
  2. **Round 2 (Early 1900s):** Famines in Asia/Europe; fertilizer tech emerges.  
     - *Q: When Critics played the card, did you feel the theory was "rescued" or "falsified"?*  
  3. **Round 3 (1960s):** Green Revolution; global crop yields soar.  
     - *Q: Did voting "Rescued" feel like faith or denial?*  
  4. **Round 4 (2000s):** Demographic transition (falling birth rates); climate change threatens.  
     - *Q: Where did you feel "he was right but early"—and where did it tip to "falsified"?*  

  **Key Tension Questions:**  
  - "Can a theory be ‘right’ if it’s constantly rescued by unforeseeable innovations?"  
  - "When does ‘suspended judgment’ become intellectual cowardice?"  
  - "Would Malthus be falsified today, or is he still ‘early’?"  

  ---

  #### **What Will Break (And Why)**  
  1. **Predictable Snags:**  
     - Critics hoarding cards: They might save strong cards (e.g., *Education for Women*) for late rounds, making rescues too easy.  
     - Adjudicators gaming chips: They’ll vote "Suspended" to avoid risk, killing tension.  
     - Population math gets wild: Round 4’s 1,600+ numbers cause calculator panic.  

  2. **What the Game Can’t Capture:**  
     - **The weight of centuries:** Real-world verification takes generations (not 20 minutes). You can’t feel the dread of waiting 200 years for tech to "save" you.  
     - **Innovation uncertainty:** In reality, critics don’t hold "cards"—they bet on unknowns. The game makes innovation feel inevitable.  
     - **Moral stakes:** Real crises (famine, war) aren’t points on a chart. The game turns human suffering into abstraction.  

  **Pro Tip:** Run it fast and messy. Embrace arguments—the chaos *is* the lesson.  

  ---  
  *Adapt as needed, but stick to 4 rounds to fit 60 minutes. No readings—just play, debate, and feel the Malthusian itch.*
