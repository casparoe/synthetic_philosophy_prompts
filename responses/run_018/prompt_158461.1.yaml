prompt: |-
  I'm in a metaphysics reading group with my friend Maya and we've been arguing about cross-world identity, not in the usual textbook framing but more like whether the same "you-thing" can sit in two worlds or if we're just tracking similarity lines. Anyway, her verdicts so far have been pretty steady: yes, you'd still be you if you'd become a musician instead of an accountant; yes if you'd grown up in Osaka with the same parents; yes even if you'd lost your left eye in an accident; but no, if the specific sperm and egg that formed you had never met — even if your parents had a different child right after — then there's no world where you exist; also no to a perfect brain-upload running on silicon, that's just a copy; yes, Sherlock Holmes could have had a sister and still be Sherlock Holmes; and she said that if your parents had never met at all, there wouldn't be anyone in that world who counts as you, only people who are somewhat like you. Now there's this branching case she's stumped on: at the exact moment of your birth, reality splits — in one branch you grow up normally, in the other a clone is made from your cells and raised in the exact same enviroment. Would Maya say the clone is you? I'm less interested in her gut answer than in mapping the rules that fit all her earlier calls — maybe literal transworld identity with essential origin, maybe a counterpart view that weights causal origin over psychological similarity, maybe even some modal-part view where you have parts scattered across worlds — and saying which one she probably runs. Also, what's the further case that would actually split them apart, since right now they all seem to agree on the upload being a copy and the career change being okay?
reasoning: |-
  Okay, let me start by unpacking Maya's position based on her previous answers. She seems to have a clear pattern: identity depends heavily on biological origin. For instance, she insists that if the specific sperm and egg hadn't met, you wouldn't exist. That's a strong essentialist view about origins. The clone scenario is tricky because it involves a biological copy but diverges at birth.

  First, the clone case. The original and the clone share the same biological origin up to the point of birth, but then they split. Since Maya rejects brain uploads as copies, she probably values the actual biological continuity. But the clone comes from the same cells, so maybe she'd see it as a duplicate rather than the original person. That fits with her rejection of the perfect brain upload—both are copies, not the original.

  Looking at her other verdicts, she accepts changes like career, location, or even losing an eye, as long as the biological origin is intact. Sherlock Holmes having a sister is a fictional case, but she allows it, which might mean she treats fictional entities differently or that origins aren't as fixed for them. But for real people, the sperm-and-egg origin is crucial.

  The theories: transworld identity with essential origin fits best. She believes in a unique entity tied to its biological start. Counterpart theory with heavy weight on origin also aligns, but since she gives definite yes/no answers, not just similarity, transworld identity seems more her style. Modal parts theory is less likely because she sees identity as all-or-nothing.

  Now, to split the theories: the branching scenario itself is key. Transworld identity would say both branches have the same person until the split, but after that, they diverge. Counterpart theory might see them as counterparts initially but distinct later. But Maya would probably say the clone isn't the original, as it's a copy from the split point. That aligns with transworld identity where post-split, they're distinct.

  A better test case: imagine a scenario where two individuals share the same origin but diverge later. For example, if a person's cells are used to create a clone years after birth. Here, the clone shares the origin but has a different timeline. Maya would likely say the clone isn't the original, strengthening the essential biological origin view. Another case: gradual replacement of parts. If someone's brain is replaced piece by piece with synthetic material, at what point do they cease to be themselves? If Maya stops considering them the same once biological continuity is broken, that's consistent with her stance on brain uploads.
answer: |-
  Based on Maya's consistent pattern of verdicts, here's the breakdown of her implicit rules and the predicted answer for the branching/clone case, followed by the theory that best fits her view and a decisive test case:

  ### Maya's Implicit Identity Rules
  1.  **Essential Biological Origin:** Your existence is strictly dependent on originating from the *specific* sperm and egg cell that actually fused to form you. This is non-negotiable ("no" to different sperm/egg, "no" to parents never meeting).
  2.  **Biological Continuity (Soma, not just Germline):** While origin is essential, identity persists through changes to the *developed biological organism* ("yes" to career change, location change, losing an eye). This organism is the "you-thing".
  3.  **Rejection of Non-Biological Replication:** Perfect functional replication (brain upload) is insufficient; it lacks the *specific biological history and continuity* of the original organism ("no" to silicon upload).
  4.  **Acceptance of Counterfactual Biological Development:** Changes affecting the organism *after* conception/germination are compatible with identity, as long as the organism persists ("yes" to Osaka upbringing, accident).
  5.  **Fictional Entities are Different:** Fictional beings like Sherlock Holmes are defined by their descriptions/concepts, not biological origin, allowing more flexibility ("yes" to Sherlock having a sister).
  6.  **No "Gappy" Existence or Mere Similarity:** If the specific biological origin isn't realized in a world, there is *no* entity in that world that is *you*, only similar entities.

  ### Prediction for the Branching/Clone Case
  *   **Maya would say the clone is NOT you.**
      *   **Reasoning:** Both the original and the clone originate from the *same* specific sperm and egg (satisfying Rule 1). However, at the moment of birth/splitting, a *single* biological organism exists. The act of cloning *creates a new, distinct biological organism* from the cells of the first. While genetically identical and raised identically, the clone has its *own* biological history and continuity *from the moment of its creation*. It is a separate "you-thing" instantiating the same genetic blueprint, not the continuation of the original biological organism. Rule 2 (Biological Continuity) applies to the *persistence* of a single organism. The clone is a copy, analogous to the rejected silicon upload (Rule 3), even though it's biological. The original organism continues in Branch A; a new, distinct organism begins in Branch B.

  ### The Theory Maya Runs: Literal Transworld Identity with Essential Origin (+ Biological Continuity)
  *   **Why it fits best:**
      *   **Definite Identity Claims:** Her "yes/no" answers are categorical, not graded ("*is* you" vs "*isn't* you"), rejecting the similarity-based "counting as you" in parents-never-met scenarios. This points strongly away from Counterpart Theory (which typically deals in counterpart relations/similarity, not strict identity) and Modal Parts (which fragments identity).
      *   **Essential Origin Paramount:** The sperm/egg criterion is treated as a *metaphysically necessary condition* for her existence, a hallmark of essentialism about origins within Transworld Identity.
      *   **Biological Organism as the Carrier:** Identity tracks the concrete biological organism that began with that specific origin and persists through changes (career, location, accidents). This organism cannot be "copied" in a way that preserves identity (upload, clone).
      *   **Rejects Mere Similarity:** The insistence that there's *no one* who *is* her if the origin differs, only people *like* her, is incompatible with Counterpart Theory's core function (which would say there *are* counterparts who "are her" in the relevant modal contexts) and Modal Parts (which might have parts of her scattered about). Transworld Identity straightforwardly says: no origin, no her *in that world*.
      *   **Fictional Flexibility:** The Sherlock Holmes answer is easily accommodated by recognizing that fictional characters aren't concrete biological organisms subject to the same essential origin constraints.

  *   **Why not the others?**
      *   **Counterpart Theory (even origin-weighted):** Would likely say that in the clone world, the clone is her counterpart (due to identical origin + massive similarity), meaning "she" *does* exist in that world *as that counterpart*. Maya explicitly rejects this for the different-sperm/egg case and the parents-never-met case (saying no one *is* her, only similar). Her answers demand strict identity, not counterpart relations.
      *   **Modal Parts:** Would suggest she is "partly" in both branches after the split or that the pre-split person is a part shared by both. Her all-or-nothing answers ("is you" / "isn't you") and rejection of copies (upload) suggest she views identity as unified and non-fragmented. The clone would be a distinct sum of modal parts.

  ### The Decisive Test Case: Gradual Biological Replacement vs. Teleportation
  To split Transworld Identity from a sufficiently origin-weighted Counterpart Theory *while respecting Maya's biological focus*, consider:

  1.  **Scenario A (Gradual Replacement):** Over time, all of your biological cells (including neurons) are painstakingly replaced, one by one, with *perfectly genetically identical* lab-grown cells derived *from your original zygote's preserved stem cells*. After 10 years, none of your original atoms remain, but the biological organism has persisted through continuous function. It's still clearly "you" biologically and psychologically.
  2.  **Scenario B (Destructive Scan/Replication - "Biological Teleportation"):** Your body is scanned at the molecular level and instantly disintegrated. Simultaneously, at a distant location, a *perfect biological replica* is constructed *using organic molecules assembled exactly as scanned, derived from stem cells of your original zygote*. This replica has all your memories and psychology.

  *   **Prediction for Maya (Transworld Identity + Essential Origin/Bio Continuity):**
      *   **A (Gradual): YES, it's you.** The *same biological organism* has persisted through continuous function, even with all parts replaced, maintaining its specific biological history/origin.
      *   **B (Teleportation): NO, it's a copy.** The original biological organism was destroyed. A new organism, albeit identical and sharing the origin *genetically*, is created. It lacks the continuous biological existence of the original. This mirrors her rejection of the brain upload and clone.

  *   **How this Splits the Theories:**
      *   **Transworld Identity (Maya's Likely View):** Will distinguish A (persistence via continuity) from B (destruction and replication).
      *   **Strong Origin-Weighted Counterpart Theory:** Might treat *both* A and B as "you" (or your counterpart). The replica in B shares the essential origin (genetically, from the same zygote stem cells) and is molecule-for-molecule identical at creation. The destruction of the original might be seen as irrelevant to the counterpart relation in the destination world. This contradicts Maya's expected "NO" for B based on her upload/clone rejections.
      *   **Modal Parts:** Would likely see both scenarios as resulting in entities that share significant modal parts with the original, but may not be straightforwardly identical.

  This test case isolates the importance of *biological continuity* (the persistence of the organism through space and time) versus mere *replication of origin and state*. Maya's rejection of the upload and clone, combined with her acceptance of post-origin changes, strongly suggests continuity is crucial *in addition to* origin, leading her to accept A but reject B. This decisively favors Transworld Identity over the other frameworks when mapping her specific set of intuitions.
