prompt: |-
  I have been working through the literature on the extended mind thesis and the debates that followed the original parity argument, and in recent seminar discussions I have repeatedly encountered a particular form of resistance that I cannot place within the standard taxonomy of objections. The pattern runs as follows. A proponent of cognitive extension points to a case in which a person relies on an external structure — for instance, a mathematician who has developed a bespoke symbolic notation maintained only in a dedicated notebook, or a clinician who depends on a long-evolving shared database to guide diagnostic reasoning — and argues that this structure functions in precisely the same way that an internal belief store or inference mechanism would. The opponent then concedes the functional equivalence but denies that the artefact is part of the mind on the grounds that it lacks a particular status: not accessibility to consciousness, not biological implementation, but something closer to normative authority or epistemic binding. The opponent typically grants that if the very same representational content and inferential role were fully internalised — say, through prolonged memorisation or neural integration — it would possess that status and thus count as genuinely mental. The denial therefore hinges not on functional difference but on a kind of location-sensitive metaphysical condition: being inside the skull, or being part of the biological system, is treated as a necessary precondition for acquiring the normative or epistemic property in question, even when the functional profile is held constant. I have seen this move made in discussions of software-dependent expertise and of collaborative cognitive systems, but I do not know whether philosophers of mind have named and analysed this specific configuration.

  Is there an established concept for this location-sensitive normative denial of functional parity? If so, how does it relate to the coupling-constitution fallacy, to concerns about trust and glue conditions, and to biological internalism? If not, I should like a precise definition that distinguishes it from plain internalist intuition and from standard objections about causal coupling, together with clear boundary cases and an explanation of whether it ultimately collapses into one of the more familiar objections or stands as a distinct failure mode. Please reply in British English, and avoid offering a bibliography or reading list; I am interested in the conceptual carving rather than in references.
reasoning: |-
  Okay, the user is deep into the extended mind thesis and has encountered a specific objection they can't place in the standard taxonomy. They describe a scenario where opponents concede functional parity but deny mental status based on a "location-sensitive normative authority." Let me unpack this.

  First, the core of their observation: opponents agree that external tools (like a mathematician's notebook) function identically to internal cognitive processes but insist they lack "normative authority" or "epistemic binding." The key is that this authority is granted only if the process is intracranial. This isn't about accessibility or biology per se, but about where the cognition happens determining its normative status. 

  I need to recall how this differs from classic objections. The coupling-constitution fallacy (Adams & Aizawa) focuses on mistaking causal coupling for constitutive membership. But here, the opponent explicitly concedes functional equivalence—so coupling-constitution isn't the issue. Clark's "trust and glue" conditions (constancy, accessibility, etc.) are also met in these cases, per the user's description. Biological internalism would outright deny functional parity, but these opponents grant it. 

  Hmm... this seems like a hybrid move. It smuggles in internalism through the back door by adding a non-functional, location-based condition for normative properties. The opponent is saying: "Yes, it works the same, but real mental states must bear normative weight, and only brain-bound states can do that." That's subtly different from claiming biological implementation is necessary—it's claiming that implementation location determines epistemic status. 

  I should flag the dialectical tension: by conceding functional equivalence but demanding this extra condition, the opponent might be begging the question. They're treating "being intracranial" as a primitive requirement for normativity without justifying why location should matter when function doesn't. It's like saying a calculator can't "truly understand" math because understanding requires wetware—even if it outcomputes humans. 

  The user wants to know if this has a name. I'm not aware of a canonical label, but "cranial exceptionalism" captures the core idea: the skull boundary confers unique normative privileges. Alternatively, "normative internalism" emphasizes the location-based condition for epistemic authority. Both terms highlight how this move resurrects internalism despite functional concessions. 

  Boundary cases help clarify: 
  - If a scientist uses fMRI to read her own notebook-based calculations directly via BCI, does it gain normative status mid-process? If the opponent says no, they're likely just a biological internalist in disguise. If yes, they're genuinely location-focused. 
  - Collaborative databases add complexity: if four clinicians share a diagnostic tool, is its "authority" diluted because it's distributed? The opponent's location condition would struggle here—it's not about individual skulls anymore. 

  This objection doesn't collapse into standard ones because it uniquely isolates normative authority as the stumbling block. It reveals that some critics implicitly treat the mind as not just a functional system but a normative one, with the brain as its privileged seat. The user's seminar opponents might be channeling philosophers like McDowell or Burge without realizing it—hence the "metaphysical condition" vibe. 

  Final thought: naming it "cranial exceptionalism" serves the user best. It’s punchy, points to the skull fetish, and distinguishes it from broader internalism. The definition must stress that it’s a meta-constraint on what can count as properly epistemic, contingent on location despite functional parity.
answer: |-
  You've identified a sophisticated and indeed distinct form of resistance to the extended mind thesis (EMT), one that operates subtly beyond the standard objections. While not universally named, the position you describe aligns most closely with what might be called **Cranial Exceptionalism** or **Normative Internalism**. It asserts that intracranial location is a necessary, non-functional condition for genuine *mental* or *epistemic* status—specifically, for possessing **intrinsic normative authority** (e.g., the capacity to *bind* rational commitment, warrant belief revision, or ground epistemic responsibility).

  ### Core Definition
  **Cranial Exceptionalism**:  
  The view that only intracranial (or biologically internal) states/processes can possess the intrinsic normative authority constitutive of genuine mental states (e.g., beliefs, inferences). External artefacts, even when functionally equivalent to internal counterparts, lack this authority because their location outside the skull precludes them from bearing the *epistemic obligations* or *rational force* inherent to cognition. Normativity is "skull-bound."

  ### Distinguishing Features vs. Standard Objections
  1.  **Vs. Plain Biological Internalism**:  
      Biological internalism (e.g., Adams & Aizawa) denies functional parity outright, insisting cognition *must* be biologically realised. Cranial exceptionalism *concedes* functional parity but argues that functional equivalence is insufficient for mental status due to a *metaphysical precondition*: only intracranial states acquire normative properties.
  2.  **Vs. Coupling-Constitution Fallacy**:  
      The fallacy (targeting Clark & Chalmers) mistakes *causal coupling* for *constitutive membership*. Here, the opponent *accepts* deep functional integration (satisfying "glue and trust" conditions like constancy, accessibility, endorsement) but still denies constitution. The failure is located not in causal relations but in the artefact's *inability to be a normative source*.
  3.  **Vs. "Glue and Trust" Concerns**:  
      Clark’s criteria address reliability and access. The opponent here grants these are met but insists they are irrelevant to the core issue: external tools cannot *impose rational obligations* on the agent. For example, the notebook’s content may *inform* the mathematician’s reasoning but cannot *oblige* it in the way a memorised axiom does.
  4.  **Vs. Cognitive Bloat/Overextension**:  
      Bloat worries focus on *unrestricted* extension (e.g., "is Google part of my mind?"). This objection applies even to tightly coupled, functionally identical systems, targeting their *normative deficit* specifically.

  ### Boundary Cases & Conceptual Tension
  - **Boundary Case 1 (Internalisation Test)**:  
    Suppose the mathematician painstakingly memorises their entire notebook. The opponent agrees this internalised version *is* mental/normative. If the same content, when external, lacks normative force despite identical functional role, the objection hinges *solely* on location as a barrier to normativity.
    
  - **Boundary Case 2 (Cyborg Integration)**:  
    A neural implant stores the notebook’s content, interfacing directly with biological memory. If the opponent *grants* normative status here, they confirm their commitment is to *intracranial placement* (biological or artificial), not biology *per se*. If they *deny* it, they collapse into strict biological internalism.

  - **Boundary Case 3 (Distributed Database)**:  
    A diagnostic database is maintained by a team. All clinicians treat it as authoritative, and it reliably guides reasoning. The opponent might deny its mental status because no *single agent’s* cognition "hosts" the normativity. This reveals an implicit individualism: normativity requires a *singular intracranial bearer*.

  ### Does It Collapse into Familiar Objections?
  It does **not** fully collapse. While adjacent to internalism, its uniqueness lies in:
  - **Conceding functional parity** while demanding an **extra-functional, location-grounded condition** for normativity.
  - Treating the **skull as a normative boundary**—a metaphysical "firewall" that blocks epistemic authority from extending, even when causal-inferential roles cross it seamlessly.

  ### Why It Stands as a Distinct Failure Mode
  This objection exposes a deeper commitment: that **mind is not just computational but inherently deontic** (governed by norms), and these norms are anchored *constitutively* to the intracranial. It’s a **meta-constraint on what can count as a "realizer" for normative properties**:
  > *"Yes, the notebook plays the same causal-inferential role as biological memory. But only biological memory can *make you rationally accountable* for its content."*

  The proponent of EMT must either:
  - Argue that normativity *can* be realised extracranially when functional parity and glue/trust hold (e.g., the notebook *does* bind your rationality), or  
  - Challenge the assumption that normativity *requires* intracranial realisation, reframing it as a relational property of integrated systems.

  This position remains a distinct hurdle because it shifts the debate from cognitive science (function, mechanism) to epistemology/metaphysics (the nature and location of normative force)—a move that preserves internalism while sidestepping functional counterexamples.
