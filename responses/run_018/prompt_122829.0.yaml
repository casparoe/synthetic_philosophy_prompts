  Below is a designed scenario that cleanly separates "robust Pareto improvement" (indifferent to probability assignments) from "safe Pareto improvement" (immune to small payoff estimation errors). The scenario involves a family clinic co-owned by three siblings (you, Brother, and Sister). The status quo (SQ) is maintaining current operations. Two options exist: **A** (expand services) and **B** (reduce hours to cut costs). Payoffs represent annual income (in thousands of dollars). States are **Strong** (high patient demand) and **Weak** (low demand). The credal set includes two probability assignments: **Optimistic** (Strong: 90%, Weak: 10%) and **Pessimistic** (Strong: 10%, Weak: 90%), reflecting the siblings' disagreement about future demand.

