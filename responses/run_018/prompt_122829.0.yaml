  ### **Scenario**  
  The siblings jointly inherit a small clinic. The status quo (SQ) generates steady income but faces uncertainty about patient demand over the next decade. Option A expands services, increasing potential income in a strong market but risking losses in a weak one. Option B reduces operating hours, providing stability in a weak market but sacrificing gains in a strong one. Brother is optimistic about demand; Sister is pessimistic. As executor, you must justify decisions to both.

  #### **States, Payoffs, and Credal Set**  
  - **States**:  
    - **Strong**: High patient demand.  
    - **Weak**: Low patient demand.  
  - **Payoffs (annual income, $000s)**:  

    | Option | State | Your Payoff | Brother's Payoff | Sister's Payoff |  
    |--------|-------|------------|------------------|----------------|  
    | **SQ** | Strong | 100 | 100 | 100 |  
    | **SQ** | Weak  | 50 | 50 | 50 |  
    | **A**  | Strong | 120 | 105 | 110 |  
    | **A**  | Weak  | 49.5 | 55 | 60 |  
    | **B**  | Strong | 105 | 80 | 115 |  
    | **B**  | Weak  | 60 | 60 | 40 |  

  - **Credal Set (probabilities)**:  
    - **Optimistic**: \( P(\text{Strong}) = 0.9 \), \( P(\text{Weak}) = 0.1 \)  
    - **Pessimistic**: \( P(\text{Strong}) = 0.1 \), \( P(\text{Weak}) = 0.9 \)  

  ---

  ### **Condition 1: No Ex Post Pareto Improvement**  
  - **SQ vs. A**: In **Weak**, you earn **49.5** < **50** (worse off), while Sister earns **60** > **50** (better off).  
  - **SQ vs. B**: In **Weak**, Sister earns **40** < **50** (worse off), while you earn **60** > **50** (better off).  
  - **No option dominates SQ in all states** → **Condition 1 satisfied**.  

  ---

  ### **Condition 2: Option A is Robustly but Not Safely Improving**  
  #### **Robustness Check**  
  - **Optimistic Probabilities** (\( P(\text{Strong}) = 0.9 \)):  
    - *Your expected gain (A vs. SQ)*:  
      \( (0.9 \times (120 - 100)) + (0.1 \times (49.5 - 50)) = (18) + (-0.05) = 17.95 > 0 \)  
    - *Brother's expected gain (A vs. SQ)*:  
      \( (0.9 \times (105 - 100)) + (0.1 \times (55 - 50)) = (4.5) + (0.5) = 5.0 > 0 \)  
    - *Sister's expected gain (A vs. SQ)*:  
      \( (0.9 \times (110 - 100)) + (0.1 \times (60 - 50)) = (9) + (1) = 10.0 > 0 \)  

  - **Pessimistic Probabilities** (\( P(\text{Strong}) = 0.1 \)):  
    - *Your expected gain (A vs. SQ)*:  
      \( (0.1 \times (120 - 100)) + (0.9 \times (49.5 - 50)) = (2) + (-0.45) = 1.55 > 0 \)  
    - *Brother's expected gain (A vs. SQ)*:  
      \( (0.1 \times (105 - 100)) + (0.9 \times (55 - 50)) = (0.5) + (4.5) = 5.0 > 0 \)  
    - *Sister's expected gain (A vs. SQ)*:  
      \( (0.1 \times (110 - 100)) + (0.9 \times (60 - 50)) = (1) + (9) = 10.0 > 0 \)  
  - **Gains > 0 for all under both probabilities** → **A is robustly improving**.  

  #### **Safety Failure**  
  - **Perturbation**: Your payoff in **Weak** under A decreases by **2.0** (from **49.5** to **47.5**).  
    - *Under Pessimistic Probabilities*:  
