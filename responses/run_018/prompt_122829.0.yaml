     - **Legitimacy**: This **changes the subject**. The original credal set models uncertainty about *demand*, not *model error*. Forcing payoff errors into probability assignments conflates distinct uncertainties and makes the set arbitrary (e.g., no basis to assign probabilities to "estimation mistakes"). Safety remains distinct.  

  4. **Recommendation for Executor**:  
