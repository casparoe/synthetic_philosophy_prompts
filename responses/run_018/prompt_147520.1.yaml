answer: |-
  Righto, here's a proper 60-minute wrestle for your MSc lot. None of that spoon-fed nonsense. British spelling and casual tone included, as requested.

  **Question: The Shifting Utopia (60 mins)**

  Consider two players, A and B, bargaining over a feasible set S with disagreement point d = (1, 2). The Pareto frontier of S is piecewise linear:
  1.  Segment 1: From point (2, 6) to point (5, 7) with a slope of -1/3 (i.e., for every 3 units A gains, B loses 1 unit).
  2.  Segment 2: From point (5, 7) to point (8, 3) with a slope of -4/3 (i.e., for every 3 units A gains, B loses 4 units).
  The Utopia point is therefore u = (u_A, u_B) = (8, 7).

  Now, suppose a "regulatory fallback" comes into effect. This *only* expands the feasible set horizontally for player A. Specifically, the frontier is extended *from (8, 3) to (10, 3)* with a slope of 0 (i.e., B remains at 3 while A increases from 8 to 10). Player B's maximum possible payoff (7) and the disagreement point d (1, 2) *do not change*. The new Utopia point is u' = (10, 7).

  **Tasks:**
  1.  **Calculate:** Compute the Kalai-Smorodinsky (KS) bargaining solution allocation for both the original situation (u = (8, 7)) and the new situation (u' = (10, 7)). Show your working clearly, including the line-intersection calculations and indicating which segment of the frontier the solution lies on.
  2.  **Explain:** Why does player A's payoff *strictly increase* under the KS solution after the regulatory change (u' replaces u), even though player B's maximum possible payoff (u_B = 7) and the location of the kink point (5, 7) remain unchanged?
  3.  **Contrast:** Calculate the Nash Bargaining Solution (NBS) for the *original* feasible set (u = (8,7)). Compare both the original KS allocation and the new KS allocation (from part 1) to this NBS allocation. Precisely highlight where the different axioms (specifically Scale Invariance and Symmetry) lead to the differences you observe.
  4.  **Discuss:** Briefly argue whether you find this monotonicity property of the KS solution (A gaining when only *their* utopia coordinate improves) normatively attractive in a real-world setting (e.g., employment negotiation, environmental regulation) where one side's outside option or best potential outcome improves. Justify your view concisely.

  ---

  **Model Answer (Approx. 380 words):**

  **1. KS Calculations:**
  *   **Original Utopia (u = (8,7)):** The KS line runs from d=(1,2) to u=(8,7). Its slope is (7-2)/(8-1) = 5/7. We need its intersection with the Pareto frontier.
      *   Check Segment 1 (Slope -1/3): Equation of Segment 1: `B - 6 = (-1/3)(A - 2)` -> `B = -(1/3)A + 20/3`. KS line: `B - 2 = (5/7)(A - 1)` -> `B = (5/7)A + 9/7`. Set equal: `(5/7)A + 9/7 = -(1/3)A + 20/3`. Multiply by 21: `15A + 27 = -7A + 140` -> `22A = 113` -> `A ≈ 5.136`. Then `B = (5/7)(113/22) + 9/7 = (565/154) + 198/154 = 763/154 ≈ 4.955`. But Segment 1 only exists for A between 2 and 5. A≈5.136 > 5. So not on Segment 1.
      *   Check Segment 2 (Slope -4/3): Equation: `B - 7 = (-4/3)(A - 5)` -> `B = -(4/3)A + 41/3`. Set equal to KS line: `(5/7)A + 9/7 = -(4/3)A + 41/3`. Multiply by 21: `15A + 27 = -28A + 287` -> `43A = 260` -> `A = 260/43 ≈ 6.0465`. Then `B = (5/7)(260/43) + 9/7 = (1300/301) + 387/301 = 1687/301 ≈ 5.6047`. A≈6.0465 is between 5 and 8, so valid. **Original KS: (A, B) ≈ (6.05, 5.60)**
  *   **New Utopia (u' = (10,7)):** KS line runs from d=(1,2) to u'=(10,7). Slope = (7-2)/(10-1) = 5/9. Equation: `B - 2 = (5/9)(A - 1)` -> `B = (5/9)A + 13/9`.
      *   Segment 1: Same as before. KS vs Seg1: `(5/9)A + 13/9 = -(1/3)A + 20/3`. Multiply by 9: `5A + 13 = -3A + 60` -> `8A = 47` -> `A = 47/8 = 5.875`. `B = -(1/3)(47/8) + 20/3 = (-47/24) + 160/24 = 113/24 ≈ 4.708`. But A=5.875 > 5 (Seg1 max A), so invalid.
      *   Segment 2: Same as before. KS vs Seg2: `(5/9)A + 13/9 = -(4/3)A + 41/3`. Multiply by 9: `5A + 13 = -12A + 123` -> `17A = 110` -> `A = 110/17 ≈ 6.4706`. `B = -(4/3)(110/17) + 41/3 = (-440/51) + 697/51 = 257/51 ≈ 5.0392`. Valid (A between 5 and 8). **New KS: (A, B) ≈ (6.47, 5.04)**

  **2. Why A Gains:** The KS solution equalises the *proportionate gains* from d to u (or u') for each player. Originally, the gain ratio was fixed at 5/7. After the change, the KS line slope flattens to 5/9 because A's utopia improved (10 > 8), while B's didn't (7=7) and d is unchanged. This flatter line intersects the *unchanged* Segment 2 of the frontier at a point further right (higher A). Player A gains solely because the ray defining proportionate gains is now less steep, favouring A more, driven purely by the increase in *A's potential maximum* (u_A).

  **3. Contrast with Nash:**
  *   **NBS for Original Set:** Maximises `(A-1)(B-2)` over frontier. On Segment 2 (`B = -(4/3)A + 41/3`), maximise `g(A) = (A-1)(-4A/3 + 41/3 - 2) = (A-1)(-4A/3 + 35/3) = (-4/3)(A² - 36/4 A + 35/4)` (Simplify constant). Derivative: `g'(A) = (-4/3)(2A - 9)`. Set to zero: `2A - 9 = 0` -> `A = 4.5`. But Segment 2 starts at A=5. Check endpoint A=5: `g(5) = (4)(7-2)=4*5=20`. At A=8: `g(8)=(7)(3-2)=7*1=7`. Max on Seg2 is at A=5, B=7? Wait, A=4.5 <5, so check Segment 1 (`B = -A/3 + 20/3`). `g(A)=(A-1)(-A/3 + 20/3 - 2)=(A-1)(-A/3 + 14/3)`. Derivative `g'(A) = (-1/3)(A-1) + (-A/3 + 14/3) = -A/3 +1/3 -A/3 +14/3 = -2A/3 + 15/3`. Set to zero: `-2A/3 = -5` -> `A=15/2=7.5` (invalid, >5). Endpoints: A=2, B=6: `g(2)=(1)(4)=4`; A=5, B=7: `g(5)=(4)(5)=20`. **NBS: (A, B) = (5, 7)** (the kink point).
  *   **Comparison:**
      *   **vs Original KS (6.05, 5.60):** KS gives A more (6.05>5), B less (5.60<7) than NBS. **Why?** KS is *not Scale Invariant*. Changing the utopia point (even holding d and the frontier fixed) changes the KS outcome (as seen!). NBS *is* Scale Invariant (only cares about d and frontier shape). KS also violates Symmetry here; the frontier and d aren't symmetric. NBS respects Symmetry only if the problem is symmetric; here it's not, so NBS doesn't force equal payoffs but reflects the asymmetric bargaining strength via the frontier's slope, favouring B slightly more at the kink than KS does.
      *   **vs New KS (6.47, 5.04):** Difference is even starker. KS moves further right (A=6.47) giving A more benefit from their improved utopia, while NBS remains fixed at (5,7) – Scale Invariance means NBS ignores the utopia change.

  **4. Normative Attractiveness:** It's a mixed bag. **Attractive:** If u_A truly reflects A's "best achievable" (e.g., legislated max hours reducing worker's potential effort, or new tech boosting a seller's best price), it seems fair KS rewards A when this improves, even if B's ceiling is unchanged. It reflects an idea of "equal relative opportunity gain". **Unattractive:** In practice, B might feel aggrieved ("Why do I lose payoff just because *their* outside option got better, not mine?"). It can seem less stable than NBS, which ignores these potential shifts. Whether it's desirable hinges on if the utopia change represents a genuine shift in bargaining power or just a theoretical bound.

  ---

  **Marking Scheme (20 Marks Total)**

  *   **Must-hit points & Common Mistakes:**
      1.  **Correct KS Calculations (5 marks):** Must show both KS lines, correctly identify the relevant segment (Segment 2 for both), solve the simultaneous equations accurately, and report both allocations ≈(6.05, 5.60) and ≈(6.47, 5.04). *Common Mistake:* Forgetting to check which segment the intersection lies on (e.g., trying Segment 1 for u' and getting invalid A=5.875), or algebraic errors solving the lines.
      2.  **Explanation of A's Gain (5 marks):** Must clearly link the flattening of the KS line slope (5/9 < 5/7) to the increase in u_A (10>8), explaining this allows A a higher payoff on the *same* frontier segment for the same d, due to the principle of equalising *relative* gains to the (shifted) utopia. *Common Mistake:* Vague references to "monotonicity" without explaining the *mechanism* (slope change due to u_A increase) or confusing it with changes to the frontier itself/d.
      3.  **NBS Calculation & Contrast (5 marks):** Must correctly calculate NBS for the original set as (5,7), showing working (especially recognising the max is at the kink). Must contrast both KS points to NBS, explicitly stating: KS gives more to A/less to B; NBS is unchanged by u->u' (Scale Invariance); KS outcome changes with utopia point; NBS reflects asymmetry via frontier slope at kink (not forcing symmetry). *Common Mistake:* Incorrect NBS calc (e.g., finding interior point on wrong segment), failing to mention Scale Invariance regarding the utopia shift, or not contrasting the specific payoff differences.
      4.  **Normative Discussion (5 marks):** Must present *both* a plausible argument *for* the attractiveness (linking relative opportunity gains to shifts in potential) and *against* (potential perceived unfairness by B, instability compared to NBS) in a real-world context. Needs a justified view. *Common Mistake:* Only stating one side, being overly vague ("it's good/bad"), or not grounding the discussion in a practical negotiation scenario.
