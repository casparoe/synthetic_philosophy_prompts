prompt: |-
  Compare internalist and externalist accounts of practical reasons by applying both to the same precisely specified case: an agent who, after a profound and apparently irreversible shift in her values, retains formal obligations to a long-term project she now regards as worthless—for instance, a philanthropic endowment she founded but no longer endorses. For each framework, state whether she still has a reason to maintain the project, and pinpoint exactly where they diverge, particularly on whether a present absence of any motivational link can nullify a reason. Then assess which account yields the more defensible verdict in this scenario, justifying your judgment in terms of the coherence of practical rationality rather than empirical psychology.
reasoning: |-
  Okay, the user wants a comparison between internalist and externalist accounts of practical reasons applied to a specific case. Let me start by understanding the scenario: an agent who has a profound shift in values but still has formal obligations to a project she now finds worthless. The example given is a philanthropic endowment she founded but no longer endorses. 

  First, I need to recall the definitions. Internalism ties reasons to the agent's subjective motivational set, like desires or commitments. Externalism argues reasons exist independently, based on objective facts or obligations. 

  Applying internalism: Since her current motivations don't support the project, she has no reason to continue it. The formal obligations don't matter if they don't connect to her present motivations. The key point here is the absence of a motivational link nullifies the reason.

  Externalism would say the obligations themselves create reasons, regardless of her current values. The commitments she made are objective reasons, even if she doesn't feel motivated. The divergence is clear: internalism requires motivation; externalism doesn't.

  Now, assessing which is more defensible. The user wants this based on practical rationality, not psychology. So, I should focus on coherence, consistency, and the nature of obligations. 

  Internalism might lead to instability in long-term commitments. If reasons vanish when motivation does, projects could be abandoned easily, undermining the reliability of obligations. Externalism preserves the binding nature of commitments, which supports trust and persistence in projects. 

  But the user mentioned "profound and irreversible" value shift. If she genuinely sees no worth in the project, forcing her to continue might seem irrational. However, externalism's strength is in honoring past commitments as part of practical rationality, which involves temporal consistency. 

  The key is whether practical rationality includes honoring past commitments as inherently reason-giving. Externalism's approach aligns with how we understand obligations in social structures, like contracts or promises. Internalism's flexibility might better respect autonomy but risks making commitments arbitrary. 

  I think externalism provides a more coherent account because it treats commitments as persisting reasons, which is essential for collaborative projects and trust. Even if her values change, the obligation stands as a reason, though she might choose not to act on it. This maintains rationality as consistent over time.
answer: |-
  ### Comparison of Internalist and Externalist Accounts in the Specified Case  
  **Scenario:** An agent founded a philanthropic endowment (a formal, legally binding commitment) but has since undergone a profound, irreversible shift in values. She now views the project as worthless and feels no motivation to sustain it, though contractual obligations (e.g., donor agreements, board responsibilities) remain.  

  ---

  ### **1. Internalist Account (e.g., Williams’ Humean Internalism)**  
  - **Core Thesis:** An agent has a reason to act *only if* the action connects to an element in her "subjective motivational set" (S desires, commitments, dispositions) via sound deliberation.  
  - **Verdict:** **No reason to maintain the project.**  
    - Her current motivational set contains no trace of endorsement for the project (no desire, value alignment, or emotional attachment).  
    - Past motivations (e.g., founding the endowment) are irrelevant; reasons are constrained by *present* psychological states.  
    - Formal obligations (e.g., contracts) only generate reasons *if* she has a current motivation (e.g., fear of legal penalties, residual loyalty). Here, no such link exists.  
  - **Divergence Point:** The absence of a *present motivational link* nullifies the reason. Obligations cannot create reasons ex nihilo; they must "hook" onto existing motivations.  

  ---

  ### **2. Externalist Account (e.g., Parfit-style Objectivism)**  
  - **Core Thesis:** Reasons are objective facts grounded in normative truths (e.g., moral duties, promises, intrinsic goods), independent of an agent’s motivations.  
  - **Verdict:** **She has a reason to maintain the project.**  
    - The formal obligations (e.g., promises to beneficiaries, legal contracts) generate enduring reasons, irrespective of her changed values.  
    - The project’s objective value (e.g., alleviating suffering) or the moral weight of commitment persists even if she denies it.  
    - Her psychological disconnect is irrelevant to the *existence* of the reason (though it may affect her ability to act on it).  
  - **Divergence Point:** Motivational absence **cannot nullify the reason**. Reasons derive from external facts (obligations, consequences), not contingent attitudes.  

  ---

  ### **Key Divergence**  
  | **Issue**                          | **Internalism**                                     | **Externalism**                                   |  
  |-------------------------------------|-----------------------------------------------------|--------------------------------------------------|  
  | **Source of Reasons**           | Agent’s current subjective state                   | Objective facts (obligations, values)            |  
  | **Role of Motivation**          | *Constitutive*: No motivation → no reason          | *Contingent*: Reason exists independently        |  
  | **Authority of Past Commitments** | Dismissed if disconnected from present motivations | Binding; generates ongoing reasons              |  
  | **Formal Obligations**          | Only matter if motivationally engaged             | Intrinsically reason-giving                     |  

  ---

  ### **Assessment: Which Account Yields the More Defensible Verdict?**  
  **Externalism is more defensible** in this scenario, judged by the **coherence of practical rationality**:  

  #### **Why Externalism Succeeds**  
  1. **Temporal Consistency of Commitments:**  
     - Practical rationality requires honoring past commitments to enable long-term agency (e.g., promises, projects). If reasons evaporated with shifting motivations, collaborative human endeavors (e.g., treaties, marriages) would collapse into arbitrariness. Externalism upholds the **normative force of promises** as timeless reasons, securing rational stability.  

  2. **Avoids Epistemic Subjectivism:**  
     - Internalism reduces reasons to psychological contingencies, implying that if the agent *believes* the project is worthless, it *is* worthless *for her*. This conflates rationality with mere psychological consistency. Externalism distinguishes *having a reason* (objective) from *acknowledging it* (subjective), preserving rationality as a normative standard.  

  3. **Handles Identity-Transcendent Obligations:**  
     - The agent’s shift in values does not annul duties to others (e.g., beneficiaries relying on the endowment). Externalism recognizes that reasons arise from **relational obligations**, not just internal states. Denying this undermines the social fabric of rationality.  

  #### **Why Internalism Fails**  
  - **Collapses into Instrumentalism:** By tethering reasons solely to present motivation, internalism cannot explain *why* agents *should* care about commitments made as "past selves." This fragments agency across time, rendering coherent life projects impossible.  
  - **Paradox of Disavowal:** If the agent can extinguish reasons by disavowing prior values, she could rationally evade *any* inconvenient obligation (e.g., debts, parental duties) through willful indifference. This licenses bad faith and erodes responsibility.  

  ---

  ### **Conclusion**  
  Externalism delivers a superior verdict by grounding reasons in **objective normative structures** (obligations, consequences) rather than fleeting psychological states. This aligns with practical rationality’s core aim: guiding agents through time via consistent, binding commitments. The agent *has* a reason to maintain the endowment—even if she acts against it—because obligations transcend her present motivations. Internalism’s reduction of rationality to subjective desire fails to capture the robust, inter-temporal nature of rational agency.  

  **Final Judgment:** Externalism’s objectivity provides the necessary scaffolding for coherent, socially embedded practical rationality. The absence of motivation does not nullify reasons; it signifies a failure in responsiveness to them.
