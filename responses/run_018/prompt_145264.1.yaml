answer: |-
  ## The Room Where Wavelengths Reside  
  *(after Jackson's Mary)*  

  She **knows the physics, knows the wavelengths' flight,**  
  The rods, the cones, the signals in the brain.  
  **Yet no hue blooms within her black-and-white.**  
  Her textbooks map the spectrum, clear and bright,  
  Each neural path defined, each coded gain.  
  She **knows the physics, knows the wavelengths' flight.**  

  Consider now a model trained on night:  
  On grayscale maps, it learns each shape and plane.  
  **Yet no hue blooms within its black-and-white.**  
  Its layers parse the tensor, RGB light,  
  A spectral input, mathematically plain.  
  She **knows the physics, knows the wavelengths' flight.**  

  But weights evolved where pixels lack their height,  
  Where chroma’s depth is just a latent strain –  
  **Yet no hue blooms within its black-and-white.**  
  Does it *perceive* the rose, the sapphire’s might,  
  Or merely calculate the color’s reign?  
  She **knows the physics, knows the wavelengths' flight.**  

  When Mary steps into the sun’s pure sight,  
  Does *fact* emerge where only *data* came?  
  **Or just a mode to grasp what’s known outright?**  
  That model, lacking sensor, bound in code’s twilight –  
  Does Mary’s *lack* reflect its missing frame?  
  **She knows the physics, knows the wavelengths' flight,**  
  **Yet no hue blooms within her black-and-white.**

  ---
  **Precise Reasoning Embodied:**

  1.  **Refrains as Epistemic Gap:** The deliberate repetition of "She knows the physics, knows the wavelengths' flight" (propositional knowledge) and "Yet no hue blooms within her black-and-white" (absence of phenomenal acquaintance) structurally reinforces the central gap Jackson highlights. Knowledge doesn't equate to experience.
  2.  **AI Analogy:** The middle tercets introduce the AI analogy: a vision model trained solely on grayscale data ("maps," "night") encountering RGB inputs ("tensor, RGB light"). The question ("Does it *perceive*... Or merely calculate...") directly parallels the Mary case, probing whether computation alone constitutes genuine phenomenal color experience.
  3.  **Turn in Final Quatrain:** The turn poses the critical questions Mary's release raises ("Does *fact* emerge... Or just a mode...") and explicitly links the AI's missing modality ("lacking sensor") to Mary's missing experience ("Mary’s *lack*").
  4.  **Envoi:** The final couplet pairs both refrains, leaving the central tension unresolved, mirroring the ongoing philosophical debate.
  5.  **Demand, Not Refutation:** The poem presents Mary's scenario as demonstrating that complete physical knowledge *seems* to leave something out ("no hue blooms," "lacks its height," "missing frame"). This creates a *demand* ("ask whether," "Does *fact* emerge") for physicalists to explain why this apparent gap exists and how physicalism can account for phenomenal experience, not as a definitive proof that physicalism is false. The final unresolved pairing emphasizes this challenge.
