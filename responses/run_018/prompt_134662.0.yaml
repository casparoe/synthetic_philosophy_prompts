  I'll craft Rousseau's voice to be characteristically intense and uncompromising. First paragraph should acknowledge the distinction from theater but pivot to the deeper corruption of spectatorship. Second paragraph must insist that true virtue can't be performative, perhaps invoking his concept of the general will. I'll keep it under two paragraphs as requested, with no need for clarification since the practice is well-described.

