  **Subject: Joint Statement: Adversarial Collab on Lying vs. Misleading - Broken Promise vs. Same Harm Camps**

  Hey all,

  Okay, after a *lot* of back-and-forth (and some genuinely productive shouting), here’s where we landed for the joint statement on whether lying and misleading are *morally* different, especially when "scaffolded testimony" is in play. Remember, "scaffolded testimony" here is just *our* shorthand for how listeners rely on implicit structures (like standard reporting formats, common disclaimers, algorithmic context, or institutional norms) to fill in meaning beyond the literal words. It’s not some fancy citation-needed theory, just a useful way to frame the problem.

  **Part 1: Agreed-Upon Stuff (We All Sign This)**

  1.  **Definitions:**
      *   **Lying:** Asserting something you believe to be false with the intent to deceive.
      *   **Misleading:** Intentionally causing someone to believe something false, *without* asserting that false thing directly. You might say something technically true but easily misconstrued, omit key info, or exploit ambiguity.
      *   **Scaffolded Testimony:** In many real-world contexts (e.g., news summaries with stats, product disclaimers, financial reports, algorithm outputs), listeners don't just process the literal utterance. They rely heavily on shared, implicit "scaffolding" – baseline assumptions about context, format, typical completeness, and norms – to interpret the *intended* or *expected* meaning efficiently. This scaffolding shapes expectations about relevance, honesty norms, and how gaps are filled.

  2.  **Basic Psychology:**
      *   Both lying and misleading can successfully implant false beliefs in the listener.
      *   Listeners *do* often rely on scaffolding to interpret messages quickly and efficiently. They assume baseline norms of relevance and non-deception unless given strong reason not to.
      *   Discovering deception (whether lie or misleading) usually causes harm like trust erosion, wasted effort, or bad decisions.

  3.  **Scaffolding Mechanics:**
      *   Scaffolds can make misleading *easier* by providing predictable patterns an agent can exploit (e.g., burying the lede in a "standard" report format).
      *   Scaffolds can make *detecting* deception harder for the listener, as they mask deviations from truth within expected structures.
      *   Deliberate violations of scaffold norms (lying or misleading) can damage the scaffold itself over time, making future communication harder for everyone.

  **Part 2: Where We Still Duke It Out (Disagreements Table)**

  | Aspect                     | Broken Promise Camp View                                                                                              | Same Harm Camp View                                                                                                                                                             | Crux / Test Case                                                                                                                              | Predictions & Notes                                                                                                                                                                                                                                                                                                                                                                                               |
  | :------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Core Moral Wrongness**   | **Lying is uniquely wrong** because it involves making a specific, assertive commitment (a "promise" of truth) and then *knowingly breaking it*. This betrayal of the speech-act itself constitutes a distinct moral harm. Misleading avoids this direct breach, even if sneaky. | **The moral wrongness tracks intent and outcome.** If you intentionally induce a false belief (successfully), that's the core wrong, regardless of whether you used a lie or a misleading-truth. Misleading can be *worse* due to sneakiness. | **Does the primary moral harm come from violating a specific speech-act commitment (promise-breaking), or from the intentional creation of a false belief (deception)?** | **BP:** "Violating the promise is the core betrayal." <br> **SH:** "Creating the false belief is the core harm." <br> ***(Real Disagreement - Foundational)***                                                                                                                                                                                                                                                         |
  | **Scaffolded Testimony: Primary Danger** | **Lying is more destructive to scaffolds.** A direct lie poisons the core scaffold element of *assertive commitment*. It's a direct attack on the trust enabling scaffolded communication. Misleading exploits the scaffold but doesn't necessarily break its core promise-mechanism. | **Misleading is more corrosive to scaffolds.** It weaponizes the listener's trust in the scaffold itself to trick them. It erodes the scaffold *from within* by making it an *instrument* of deception, undermining the shared assumptions it relies on. | **In scaffolded contexts, which act does more fundamental damage to the scaffold's integrity and future usability: lying or misleading?** <br> *Test Case: Algorithmic Summaries.* A system designed to summarize news neutrally. Is it worse if it *lies* (inserts a false fact) or *misleads* (omits crucial counter-evidence, exploiting the user's trust in its neutrality)? | **BP:** "Lying is worse – it directly breaks the scaffold's core 'truth assertion' function." <br> **SH:** "Misleading is worse – it turns the scaffold's trusted neutrality *against* the user, corrupting its purpose." <br> ***(Real Disagreement)***                                                                                                                                                               |
  | **Scaffolded Testimony: Harm Amplification** | **Misleading can be *harder to correct* within a scaffold.** Because it uses technically true statements fitting the scaffold, the listener might cling harder to the false belief, thinking *they* misapplied the scaffold, not that they were deceived. | **Lying can be *faster to detect/correct* within a scaffold.** A direct falsehood is often easier to spot and falsify using the scaffold's own expected rules or data sources. Misleading leaves less clear evidence. | **In scaffolded contexts, which act generally leads to false beliefs that are more persistent or harder to correct after the fact?** <br> *Test Case: Financial Disclaimers.* Is a false statement about risk (lie) or a technically true but highly misleading omission of risk (misleading) harder for an investor relying on standard disclosure formats to later recognize and correct? | **BP:** "Misleading beliefs are stickier – the scaffold makes them seem legit." <br> **SH:** "Lies are usually easier to catch and disprove using the scaffold's own tools." <br> ***(Real Disagreement - Empirical Prediction)***                                                                                                                                                                                          |
  | **"Intentionality" Threshold** | **The specific intent to *break an assertive commitment* matters morally.** Misleading might involve deception, but it lacks the specific intent to violate that core speech-act promise inherent in lying. | **The specific intent to *induce a false belief* is what matters morally.** The means (lie vs. misleading) are secondary; the core malicious intent is identical. Focusing on the "promise" is legalistic hair-splitting. | **Is the *specific intent to break a speech-act commitment* (present in lying) a morally significant intent distinct from the *general intent to deceive* (present in both)?** | **BP:** "Yes, breaking the promise is a distinct, worse intent." <br> **SH:** "No, the deceptive intent is identical; the 'promise' framing is artificial." <br> ***(Potentially Verbal/Foundational)*** - SH sees the "promise" as part of the deception mechanism, not a distinct intent. BP sees it as a separable, more fundamental commitment. But both agree the *deceptive intent* is present in both acts. |

  **Part 3: What Would Change Our Minds (Personal Notes)**

  *   **Broken Promise Camper:** "I'd seriously reconsider if someone showed me a clear, real-world case where a *misleading* statement caused *more* direct, undeniable harm to the *specific trust relationship* underpinning a scaffold than a direct lie did. Like, if misleading consistently destroyed institutions built on scaffolded norms faster than outright lies did. I think my biggest vulnerability is maybe underestimating how deeply misleading can corrupt the *shared understanding* of the scaffold itself, making it unusable. Maybe I'm too attached to the 'promise' metaphor as something tangible."
  *   **Same Harm Camper:** "I'd flip if someone convincingly argued that the 'speech-act promise' isn't just a social convention but taps into a fundamental human moral instinct (like promise-keeping) that *is* uniquely triggered by lying, making its violation inherently distinct and worse, even if the *immediate* false belief harm is the same. Or if evidence showed lies reliably cause *different kinds* of long-term psychological harm (e.g., deeper trauma) than misleading. My weak spot is probably downplaying how violating that specific assertive commitment *feels* like a distinct betrayal to people, even if I think the harm *should* be judged by the false belief outcome. Maybe I'm too utilitarian about the harm."

