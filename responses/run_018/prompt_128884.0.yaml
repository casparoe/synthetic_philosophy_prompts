prompt: |-
  I'm a software engineer with no formal philosophy background, and I'm trying to work out who actually belongs to the demos in a democratic system. I'm not working from theory; I'm going by gut verdicts on concrete cases and want to know if there's a principle behind them.

  My verdicts:
  - Every adult citizen physically present in the territory and affected by its laws: clearly belongs.
  - A permanent resident with no citizenship, fully integrated, and equally subject to taxation and regulation: belongs.
  - A citizen who emigrated permanently decades ago, pays no taxes, and is unaffected by current policy: does not belong to the active demos.
  - Unborn future generations who will inherit the climate and fiscal consequences of today's decisions: belong in some representational sense.
  - Sentient non-human animals in the territory affected by environmental rules: do not belong.
  - AI proxy agents that aggregate and cast votes for living citizens according to explicit instructions: do not belong; they are instruments, not members.
  - A secessionist community inside the borders that explicitly denies the system's legitimacy: still belongs, since it remains subject to coercive law.
  - Children currently unable to deliberate politically: belong prospectively, with interests that should be represented now.

  The case I keep reversing on is a "legacy agent"—an AI system that continues to vote according to a deceased citizen's recorded preference profile years after death. Sometimes I treat it as an extension of that dead person (whom I said is out); other times I see it as persistent software that should be disregarded, yet I still want future generations represented, which feels structurally similar. Is there a coherent principle—perhaps about reciprocal agency, affected stakes, or system membership—that captures all eight verdicts? If not, which verdict should I drop, and what does the best principle predict for the legacy-agent case?
reasoning: |-
  Okay, let me start by really understanding what this software engineer is asking. They're trying to figure out who should be part of the demos in a democracy, but they're approaching it from practical cases rather than theory. They've listed eight concrete verdicts and are stuck on the "legacy agent" case—an AI that votes based on a dead person's preferences.

  First, I need to unpack each of their verdicts to see the underlying principles. They include present adults, permanent residents, exclude long-gone emigrants, include future generations, exclude sentient animals and AI proxies, include secessionists and children. The conflict arises with the legacy AI because it feels similar to future generations but represents the dead.

  Hmm, the key principles here seem to be affectedness and agency. The engineer mentions reciprocal agency and affected stakes. Let me map each case to these principles. Present adults are affected and have agency. Permanent residents are affected but lack formal membership, yet included. Emigrants aren't affected anymore, so excluded. Future generations are affected but lack current agency—so representation needed. Animals are affected but lack moral agency, hence excluded. AI proxies are tools, not agents. Secessionists are affected and have agency, so included despite dissent. Children will be affected and gain agency later, so prospective inclusion.

  The legacy agent represents someone who's no longer affected (dead) and lacks agency. But why does it feel similar to future generations? Both involve representing non-present entities. The difference is future generations will be affected and become agents, while the dead are no longer affected. So the principle must distinguish between future potential agency and past expired agency. 

  The engineer might need to refine the agency aspect to include potential future agency. For the legacy AI, since the dead aren't affected and have no future agency, it shouldn't belong. But what if the AI adapts? The engineer specified it follows recorded preferences, so no independent agency. That seals it—excluded. 

  Is there a conflict? Verdict 4 includes future generations without agency because they will be affected and become agents. Verdict 3 excludes emigrants who once were agents but aren't affected now. Consistency here relies on ongoing or future affectedness coupled with (potential) agency. The dead have neither. 

  Should any verdict be dropped? All seem consistent except maybe the legacy agent confusion. The principle holds: affectedness + agency (current or potential). Legacy agent fails both. Future generations have potential agency and are affected. So no verdict needs dropping. The legacy agent case is resolved by the principle: exclude it.
answer: |-
  Your concrete verdicts reveal a remarkably consistent underlying principle: **the demos consists of entities whose *present or future lived experience* is *significantly shaped by collective decisions*, and who possess (or will possess) *moral agency*.** Let's break this down:

  ### Core Principle: **Affected Moral Agency**
  1. **"Affected"** = Subject to enforceable consequences (laws, taxes, environment, fiscal burdens).
  2. **"Moral Agency"** = Capacity for interests, well-being, or dignity that can be harmed/benefited *and* the potential for reciprocal political responsibility (even if unrealized).
  3. **"Present or Future"** = Distinguishes the living (or soon-to-be-living) from the irreversibly departed.

  ### Your Verdicts Mapped to the Principle:
  | Case | Verdict | Why It Fits |
  |-------|---------|-------------|
  | **1. Adult citizen present** | Belongs | *Currently* affected; possesses moral agency. |
  | **2. Permanent resident** | Belongs | *Currently* affected; possesses moral agency (identical to citizens in stakes). |
  | **3. Emigrated citizen** | Excluded | No longer affected; no moral agency *engaged* by current decisions. |
  | **4. Unborn generations** | Belong (representation) | *Future* lived experience *severely* affected; *future* moral agency. |
  | **5. Sentient animals** | Excluded | Affected but lack *moral agency* (no capacity for political reciprocity/autonomy). |
  | **6. AI voter proxies** | Excluded | Instruments, not agents. No *stakes* of their own. |
  | **7. Secessionists** | Belong | *Currently* affected; possess moral agency (even if rejecting legitimacy). |
  | **8. Children** | Belong (representation) | *Future* agency (soon-to-be-autonomous); *currently* affected (e.g., education, safety). |

  ### The Legacy Agent Conflict Resolved
  Your reversal on the "legacy agent" stems from conflating two distinct concepts:
  - **Future generations** possess *future moral agency* and will experience *actual consequences*.
  - **Legacy agents** represent an entity with *expired agency* and *no future lived experience*.

  **Apply the principle:**  
  A dead person:
  - Is **no longer affected** (experiences no consequences).
  - Has **no moral agency** (agency ceases at death).
  - Has **no future lived experience** to protect.

  Thus, the AI is merely software rehashing historical preferences with no present or future stakes. It fails both criteria of Affected Moral Agency. Future generations succeed on both.

  **Verdict:** The legacy agent **does not belong**. Your intuition to exclude it aligns with your exclusion of emigrated citizens and AI proxies.

  ### Is This Principle Fully Coherent With Your Judgments?
  **Yes.** All 8 verdicts hold without contradiction under Affected Moral Agency. No verdict needs dropping. The legacy agent case clarifies the boundary:
  - **Agency must be actual or prospective** (future generations, children), not extinct.
  - **Affectedness must be experiential** (future generations will experience climate collapse; the dead cannot).

  ### Why This Works for a Systems Thinker
  This principle mirrors robust engineering design:
  1. **Input/Output Relevance:** Membership requires being an impacted "end-user" of the system (affectedness).
  2. **Feedback Loops:** Moral agency implies capacity to participate in feedback (voting, protest, cultural response).
  3. **State Management:** Distinguishes active/pending (living/unborn) from terminated (dead) processes.
  4. **No Magic:** Rejects metaphysical claims (e.g., "eternal voter will") in favor of verifiable stakes.

  ### Practical Test for Edge Cases
  Ask:  
  ❶ *"Will this entity **experience consequences** of today's decisions in a way that impacts its well-being?"*  
  ❷ *"Does/can it possess **moral weight** demanding reciprocity (even if only via representation)?"*  
  **If both → Belongs.**  
  This excludes the dead, animals, and tools; includes secessionists, children, and future generations.

  Your gut judgments are philosophically sound. The legacy agent is an artifact—not a member of the demos.
