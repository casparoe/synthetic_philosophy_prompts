   Let me try the reverse: a case where she gains an ability without acquaintance. How? Suppose that upon release, she is given a pill that blocks the formation of any conscious experience of color (so she doesn't have acquaintance) but that also rewires her brain so that she can now recognize colors, imagine them, etc. But the constraint says no new physics or magic. And a pill that blocks conscious experience while enabling recognition is arguably magic.

