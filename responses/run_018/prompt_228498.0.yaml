  We are to build a scenario where Mary gains acquaintance without gaining new abilities. The acquaintance hypothesis says Mary gains direct acquaintance with a phenomenal property. The ability hypothesis says she gains only new abilities (to recognize, imagine, remember, etc.). We want a scenario where she gains acquaintance but no new abilities.

   Idea: What if the release event does not allow Mary to exercise any new recognitional, imaginative, or mnemonic abilities? For instance, if the experience is fleeting and immediately forgotten, then she might have a moment of acquaintance without being able to use it for any subsequent ability. But note: the acquaintance theorist might say that even a fleeting experience is acquaintance. The ability theorist might say that even a fleeting experience gives her an ability (e.g., to recognize during that moment) but that ability is lost. We want to avoid any ability at all.

   Refinement: What if the experience is not of a color but of a pain? And the pain is so intense and traumatic that it induces a temporary retrograde amnesia for the event itself? Then, at the moment of the experience, she has acquaintance with the phenomenal character of pain (which she never had before) but then immediately forgets it. Moreover, because of the amnesia, she doesn't even remember having had the experience. So she gains no new recognitional ability (because she never sees the pain again and wouldn't recognize it if she did because she doesn't remember it), no new imaginative ability (she can't imagine it because she doesn't remember it), no new mnemonic ability (she doesn't remember it). But she did have a moment of acquaintance.

   However, note: the ability hypothesis might argue that during the experience she had the ability to recognize the pain (as it was happening) and to remember it (for the brief moment it was in her working memory) but that these abilities were lost due to the amnesia. We want to block the idea that she had any ability at all, even during the experience? But that seems impossible: during the experience, she must at least have the ability to recognize that experience as it occurs (if recognition is taken as a concurrent ability). So maybe we need a different approach.

   Another idea: What if the experience is not one that she can attend to? Or what if it is so brief that it doesn't register? But then, does she really have acquaintance?

