  First, I need to recall the structure of Plutarch's Parallel Lives. Each pair includes a Greek and a Roman figure, followed by a synkrisis (comparison). The Pericles-Fabius pairing is key here. Both are leaders during crises: Pericles in the Peloponnesian War and Fabius against Hannibal. The user mentions Fabius dying in obscurity, which might highlight humility and endurance over glory. So the comparison could emphasize that true virtue isn't about fame but steadfastness.

  The death scene of Pericles is crucial. Even in suffering, he's focused on Athens, not himself. Plutarch often highlights such moments to show virtue in adversity. But Pericles is a contaminated exemplar—he advocated for the war that led to the plague. The user is unsure if Plutarch glosses over this or uses it to show complexity. I should check how Plutarch handles Pericles' role in the war. In other sections, Plutarch does mention criticisms, so he's not ignoring the flaws. The moral lesson here might be about resilience despite failures, not perfection.

  The user's deeper struggle is understanding how synkrisis works in teaching virtue. By comparing two figures, Plutarch can highlight different aspects of virtue. Pericles demonstrates foresight and civic dedication, while Fabius shows caution and patience. Their paired failures (war strategy, political unpopularity) make them relatable and show that virtue exists amidst imperfection. This contrasts with hagiography, which often sanitizes flaws. Plutarch's approach acknowledges shortcomings, making the exemplars more human and imitable.

  The user also questions if contaminated exemplars are intentional. Yes, Plutarch chooses figures with mixed records to provide nuanced lessons. The takeaway isn't to emulate every action but to learn from both successes and failures. The dying scene emphasizes Pericles' character in crisis, separate from his strategic errors. So Plutarch separates the virtue in the moment from the broader consequences of his decisions.

  Regarding the hagiography comparison, Plutarch is closer to realistic biography because he includes flaws, even if he doesn't emphasize them in every passage. The synkrisis structure allows him to present a balanced view by juxtaposing strengths and weaknesses across the pair. The user might be missing that the moral lesson is cumulative, built through the entire life and comparison, not just isolated virtuous moments.

  In conclusion, the dying scene showcases Pericles' commitment to the common good as an example of enduring virtue under duress. The pairing with Fabius extends this to humility and persistence beyond glory. Contaminated exemplars serve to offer realistic models, teaching that virtue persists despite failures. Plutarch's method sits between biography and hagiography by highlighting virtues without erasing flaws, using synkrisis to deepen the moral lesson.
answer: |-
  You've hit on a profound tension at the heart of Plutarch's project! Let's break down the Pericles death scene, the role of the synkrisis with Fabius Maximus, and how Plutarch navigates the "contaminated exemplar" issue compared to hagiography:

  1.  **The Pericles Death Scene (Life of Pericles, 38):**
      *   **The Immediate Lesson:** Plutarch absolutely wants to showcase virtue under extreme pressure. Pericles' death is framed as the culmination of his character. While physically broken by the plague, his *mind* and *spirit* remain focused on what defined his life: service to Athens and the common good. He transcends personal agony and the despair of his friends to offer a final act of civic-mindedness – reminding them of Athens' greatness and his role in it, rather than indulging in mourning.
      *   **Beyond Stoic Endurance:** It's not just *enduring* suffering stoically. It's actively *choosing* the common good *in* suffering. His final thoughts aren't resignation, but affirmation: "Remember my deeds, remember Athens." This crystallizes his lifelong principle of prioritizing the *polis* over the individual.
      *   **The Power of the Moment:** Plutarch uses such death scenes because they are ultimate tests. How one faces death reveals the core of their character. Pericles' death confirms the authenticity of his professed virtues. He doesn't "break character."

  2.  **The Synkrisis with Fabius Maximus: Reframing Virtue and Glory:**
      *   **Parallels Beyond Obvious Similarities:** Yes, both were cautious, strategic leaders during existential wars (Pericles vs. Sparta, Fabius vs. Hannibal). Both faced immense criticism and unpopularity during their commands. Both were eventually vindicated, but also died without the immediate, unalloyed glory one might expect for saviors.
      *   **The Crucial Juxtaposition:** Plutarch pairs them specifically to explore the nature of *true* leadership and virtue, particularly when it involves unpopular restraint and long-term thinking.
      *   **The Deaths as Commentary:**
          *   **Pericles:** Dies during the plague he couldn't prevent, a consequence of the war he advocated for. His final act is *verbal* – affirming his service *to the city*, still seeking a form of recognition *within* the civic framework.
          *   **Fabius:** Dies in relative obscurity *after* the war, having saved Rome through his unpopular "Delayer" strategy. Plutarch emphasizes his *humility* and lack of resentment for later commanders (Scipio) gaining more glory (Life of Fabius Maximus, 27). His virtue is quieter, more self-effacing.
      *   **The Synkrisis Lesson:** The comparison *does* suggest that true virtue lies not in fleeting glory or spectacular victories, but in steadfastness, prudence, endurance, and prioritizing the long-term survival and health of the state *even when it means personal unpopularity, obscurity, or association with disaster*. Their deaths reinforce this: Pericles affirms his civic legacy amidst failure; Fabius embodies quiet endurance without demanding his due. Virtue is shown in the *process*, the *character*, not just the outcome.

  3.  **Pericles as "Contaminated Exemplar" and Plutarch's Method:**
      *   **He Absolutely Is Contaminated:** This is crucial. Plutarch *does not* shy away from Pericles' role in starting the disastrous war. Earlier in the Life, he details the accusations against Pericles (fomenting war to distract from personal scandals and financial troubles - *Per*. 31-32). He explicitly states that Pericles' strategy, while sound in theory, failed in practice due to unforeseen events (the plague) and human frailty (*Per*. 33-35).
      *   **Plutarch vs. Hagiography: The Key Difference:**
          *   **Hagiography:** Typically *sanitizes*. Flaws are minimized, ignored, or transformed into proofs of holiness. Failure is either absent or miraculously overcome. The focus is on transcendent, otherworldly perfection designed for veneration, not imitation.
          *   **Plutarch:** **Acknowledges and grapples with contamination.** Pericles' failures are *part of the narrative fabric*. Plutarch presents the complexity:
              *   He shows Pericles' virtues (wisdom, foresight, eloquence, incorruptibility, devotion to Athens).
              *   He shows his flaws/vices (ambition, arrogance, perhaps recklessness in pushing for war, the vulnerability of his strategy).
              *   He shows the disastrous consequences (the war, the plague, his own death within it).
          *   **The Moral Point is Nuanced:** Plutarch isn't saying "Be exactly like Pericles in every action." He's saying, **"Look at this magnificent, flawed man. See his towering virtues – especially his unwavering commitment to the common good, displayed even unto death. See also his errors and the tragic consequences. Learn from *both*."** The dying scene highlights the *persistence* of core virtue *despite* failure and disaster.
      *   **Why Use Contaminated Exemplars?** Precisely because they are *realistic* and *instructive in their complexity*.
          *   **Relatability:** Readers are flawed and face failures. Perfect saints are alienating; flawed greats are relatable. We see virtue struggling within the messy reality of life and politics.
          *   **Deeper Moral Exploration:** Contamination forces the reader to grapple with hard questions: Can virtue exist alongside error? How does one judge character amidst disaster? What aspects *are* truly admirable and worth emulating despite the flaws? This complexity fosters deeper moral reflection than simple rules or perfect models.
          *   **Focus on Character Traits:** Plutarch often isolates specific virtues or vices *within* the context of a life. The dying scene isolates Pericles' *civic devotion* and *fortitude* as exemplary traits worthy of emulation, *even if* his overall strategic judgment regarding the war was flawed or fateful.

  4.  **Where Plutarch Sits: Between Biography and Hagiography?**
      Plutarch is firmly on the **biography** side, but with a strong **didactic purpose**. He uses the tools of biography:
      *   **Historical Context:** Grounding lives in real events (war, plague, politics).
      *   **Complexity:** Presenting virtues *and* vices, successes *and* failures.
      *   **Human Portrayal:** Showing figures as humans, not demigods (e.g., Pericles' grief over his sons, his political vulnerabilities).
      ...to achieve a moral-philosophical goal: illustrating virtue and vice in action to guide the reader's own character development.

      **He is not hagiographical because:**
      *   He doesn't erase the "stain" of failure (Pericles' war, the plague, his death within it).
      *   He doesn't claim perfection for his subjects.
      *   His goal is practical moral learning and reflection, not uncritical veneration.

  **Conclusion & What Plutarch Wants You to Take:**

  1.  **Virtue Endures:** The immediate point of the death scene is that true virtue (in Pericles' case, civic devotion and fortitude) holds firm even under the most extreme pressure (physical agony, despair, imminent death). It defines the person to the very end.
  2.  **Virtue > Outcome (via Synkrisis):** By pairing Pericles with Fabius, Plutarch argues that the *quality of character* – prudence, endurance, prioritizing the common good over personal glory – is the true measure of virtue, even when outcomes are mixed (Pericles) or recognition is lacking (Fabius). Their shared *character traits* under adversity are what Plutarch holds up, not their unblemished records.
  3.  **Learning from Complexity:** Pericles *is* a contaminated exemplar, and Plutarch uses him deliberately. He wants you to see the magnificent civic virtue shining *through* the failure and disaster. The lesson isn't "Pericles was perfect," but **"Even amidst profound error and tragic consequence, this core virtue of devotion to the common good remained unbroken and defines his greatness. Emulate *that* unwavering principle, learn from the errors of judgment that led to the disaster."**
  4.  **Synkrisis as a Tool:** The comparison doesn't erase Pericles' contamination; it *reframes* it. Placing him beside Fabius, who also faced contamination (unpopularity, being sidelined) but whose story ended less catastrophically, allows Plutarch to isolate the *admirable character traits* they shared *despite* their different contexts and outcomes. It shows virtue transcending circumstance and specific results.

  You're absolutely right to sense that Plutarch isn't whitewashing Pericles. He's offering a sophisticated moral lesson: greatness is complex, virtue can be real and profound even in flawed figures caught in tragic circumstances, and the ultimate test of character often comes at the point of greatest vulnerability. The dying scene is the brilliant, tragic, and ultimately affirming culmination of Pericles' defining virtue, presented *alongside* his failures for the reader to contemplate and learn from. This rich complexity is what separates Plutarch's morally instructive biography from simpler rule-based ethics or idealized hagiography.
