prompt: |-
  I'm in this course on biography and moral learning — we've been talking about Plutarch and how people used to learn virtue from lives, not just rules. I was arguing with my freind about whether hagiography actually teaches anything useful, since saints are too perfect to imitate, and then I went back to Plutarch's Life of Pericles (the old Clough translation, I think 19th century?). There's this bit near the end where Pericles is dying of the plague, lying there with his friends weeping around him, but he pulls himself together and tells them to remember his service to the city rather than mourn his death — and Plutarch adds that even in that moment he was thinking about the common good, not his own suffering. I'm having trouble seeing exactly what Plutarch wants us to take from that. Is it just that virtue holds up under pressure? Or is there something about the way he pairs Pericles with Fabius Maximus in the Roman parallel that changes the reading — like, Fabius also died in relative obscurity after saving Rome, so maybe the comparison is saying that real virtue isn't about glory but about endurance?

  Here's where I'm really stuck. I came across this idea of "contaminated exemplars" — figures whose moral record is clearly mixed with failure or disaster — and it seems like Pericles is exactly that, since he led Athens into the war and then died in the plague he couldn't stop. So is Plutarch giving us a contaminated exemplar on purpose, and if so, does that make him closer to hagiography (because he smooths over the failure) or further away (because he leaves the stain in)? I feel like I'm missing something about the synkrisis structure and how it's supposed to work for the reader. Can you help me understand the passage and where it sits between biography and hagiography?
