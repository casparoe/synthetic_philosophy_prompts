          P(termites) * (-1,000,000) [no message] + P(no termites) * (-1000) 
          But note: if they have a policy of not paying, then they get the message only if there are termites. So they don't pay and then lose $1,000,000. If there are no termites, they don't get the message and nothing happens. Expected utility: 
          P(termites) * (-1,000,000) [because they get the message and don't pay] + P(no termites)*0.

          So the expected utility of the policy of paying: 
            - P(termites)*1,000,000 - P(no termites)*1000
          The expected utility of not paying:
            - P(termites)*1,000,000

          Since P(no termites)*1000 is positive, the policy of not paying is better. But wait, that can't be right because we don't know P(termites). Actually, without knowing P(termites), we cannot compare. But if the termite infestation is rare, then paying is worse. However, the problem is symmetric? Actually, the problem does not specify the base rate. But note: the agent might have a prior on termites.

          However, the point of the problem is that if the agent conditions on the message, then paying gives good news. But at the policy level, if the agent chooses the policy of paying, then the message is good news (meaning no termites) and they pay $1000. If they choose the policy of not paying, then the message is bad news (termites) and they don't pay. The expected utility of the paying policy is:
            P(termites) * [no message, so loss of $1,000,000] + P(no termites) * [message, so loss of $1000]
            = - P(termites)*1000000 - P(no termites)*1000

          The expected utility of the not-paying policy is:
            P(termites) * [message, so loss of $1,000,000] + P(no termites) * [no message, so loss of $0]
            = - P(termites)*1000000

          So the difference is: 
            Paying policy: - P(termites)*1000000 - (1-P(termites))*1000
            Not-paying policy: - P(termites)*1000000

          Therefore, the not-paying policy is better by (1-P(termites))*1000. So the agent should choose the policy of not paying. But then why is it a problem? 

          The problem is that if the agent uses evidential decision theory and conditions on the message, they will pay because:
            P(termites | message and pay) = 0? 
            Actually, if the agent pays, then the message is sent only if there are no termites. So P(termites | pay) = 0? But wait, the agent is conditioning on the message and then deciding to pay. The evidential decision theory calculation:

            If the agent pays, they lose $1000 and the house doesn't have termites (because if it did, the message wouldn't have been sent if they paid). So they are sure they don't have termites? Then they avoid the $1,000,000 loss. So the net effect is a loss of $1000.

            If they don't pay, then the message was sent because they are not paying and there are termites? Because the message is sent only if exactly one of termites or pay is true. So if they don't pay and the message is sent, then it must be that there are termites. So they lose $1,000,000.

            Therefore, EDT says: paying gives a loss of $1000, not paying gives a loss of $1,000,000. So they pay.

          But at the policy level, the not-paying policy is better. This is a conflict: EDT at the act level chooses to pay, but the policy of paying is worse than the policy of not paying.

          So the point of XOR blackmail is that EDT does the wrong thing: it pays, but the policy of paying is dominated by the policy of not paying. Therefore, the agent should not pay. The problem pushes for updatelessness: choose the policy of not paying, and then in the event of a message, do not pay. This leads to the best outcome.

          However, note: in the original description, the predictor sends the message just in case exactly one of (termites, pay) holds. The agent's policy is part of the setup. The policy of not paying means that the message is sent exactly when there are termites. So upon receiving the message, the agent (if they are going to follow the policy) should not pay, and they know they have termites. But they still lose $1,000,000. There's no way out.

