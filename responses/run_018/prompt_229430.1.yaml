          Therefore, the agent should not pay because paying doesn't remove the termites. The causal decision theorist gets it right: don't pay. The evidential decision theorist pays because they think that paying implies no termites, but actually, paying doesn't cause the termites to go away. The agent is stuck with termites or not. So the EDT agent pays $1000 and still has termites if they are present? But wait: the message is sent only if exactly one is true. If the agent pays, then the message was sent only if there are no termites. So if they pay, they are in a world without termites? No, the termites are there or not independently. The message is sent based on the actual state and the agent's policy. So if the agent has a policy of not paying, and there are termites, then the message is sent. Then, if the agent receives the message and pays, they break the policy. But the state of termites is already fixed. So if they pay, then the condition for the message being sent is (termites XOR pay) = (true XOR true) = false. But the message was already sent! So it's inconsistent. Therefore, the agent must stick to the policy? The problem is that the predictor has sent the message based on the policy. The agent's act at the time must be the one that the policy specifies? Otherwise, the predictor would have made a mistake. But the predictor is perfect. Therefore, the agent must act according to the policy that the predictor predicted.

          This is getting very messy. Perhaps the clean way is to assume the agent has a fixed policy that the predictor knows. The agent then, at the choice point, must execute the policy. The problem is to choose the policy. The policy of not paying leads to: if there are termites, you get the message and you don't pay -> you lose $1,000,000. If there are no termites, you don't get the message -> you lose nothing. The policy of paying leads to: if there are no termites, you get the message and pay $1000. If there are termites, you don't get the message -> you lose $1,000,000. So the expected utility of the paying policy is: - P(termites)*1000000 - P(no termites)*1000. The expected utility of not paying: - P(termites)*1000000. So not paying is better. Therefore, choose the policy of not paying.

          Then, when the agent receives the message, they know that they have termites (because the policy is not to pay, and the message is sent only if there are termites) and they don't pay. They lose $1,000,000. But that's unavoidable. The alternative policy of paying would have them paying $1000 when there are no termites and still losing $1,000,000 when there are termites (without a message). So it's worse.

          Therefore, the agent should choose the policy of not paying. The point of XOR blackmail is that the evidential decision theorist, who conditions on the message, would pay and lose $1000 in the no-termites case, but if they had chosen the policy of not paying, they would never pay and would avoid the $1000 loss in the no-termites case. However, in the termites case, both policies lose $1,000,000. So not paying is better. The agent who conditions on the message and pays is making a mistake because they are not following the best policy.

          So the problem pushes for choosing the policy updatelessly and then following it.

          But note: in the termites case, the agent with the not-paying policy loses $1,000,000 and the agent with the paying policy also loses $1,000,000 (without a message). In the no-termites case, the not-paying policy doesn't pay and loses nothing, while the paying policy pays $1000. So not-paying policy is better.

          Therefore, the misconception that CDT is obviously right is correct: the agent should not pay. But the problem is that EDT would pay, which is wrong. The challenge is to explain why EDT goes wrong: because it conditions on the message and then pays, but that is not part of a globally optimal policy.

          So in the synthesis, we say: CM pushes for paying in the tails branch (which seems irrational locally) because of the counterfactual. XB pushes for not paying (which seems irrational evidentially) because the policy of not paying is globally better. Both show that conditioning on information can lead to suboptimal decisions, and the solution is to choose a policy without conditioning.

  6. (10 min) Closing check of understanding: Use the exercise described above.

  7. (10 min) Wrap-up and omission list.
answer: |-
  ### Teaching Plan for Decision Theory Seminar

  #### **1. Prerequisite Idea: The Predictor as a Structural Element**
  **Why it must be secured first:** Without this, students dismiss the scenarios as impossible tricks. The predictor isn't a claim about real-world feasibility but a *stipulated logical device* that creates correlations between the agent's decision procedure and outcomes. Emphasize:  
  - The predictor perfectly models the agent's policy (their decision algorithm), not just their surface act.  
  - This correlation is fixed before the agent faces the choice, making the agent's decision procedure part of the causal fabric of the scenario.  
  **How to secure it:** Start with a recap: "In Newcomb's problem, the Predictor isn't magic—it's a stand-in for a world where your decision algorithm is correlated with outcomes. Here, we extend that: the predictor *simulates your policy*, creating dependencies that force us to distinguish acts from policies."  

  ---

  #### **2. Ordering the Session**  
  **Sequence and Rationale:**  
  1. **Counterfactual Mugging (CM) first** (30 minutes):  
     - **Why start here?** CM isolates the *counterfactual dependency*: the benefit (heads) depends on the policy, not the act in the current branch. Students are in the tails branch, so they *know* their act doesn't cause the heads outcome. This stages a pure problem of *act vs. policy* without evidence confusion.  
     - **Build intermediate notions:**  
       - *Pre-commitment as ideal but inaccessible*: "If you could pre-commit to paying in tails, your expected utility (EU) would be positive. But at the choice point, you can't pre-commit—you're in tails. The predictor already simulated your policy."  
       - *Probability of a policy, not an act*: Calculate EU of a paying policy: EU = 0.5($0) + 0.5($10,000 - $100) = $4,950. EU of a refusing policy: $0. Highlight that conditioning on being in tails hides this.  

  2. **Bridge: Policy as the Unit of Choice** (20 minutes):  
     - **Core idea:** Policies are functions mapping information states to acts. The predictor correlates outcomes with the *entire policy*, not isolated acts.  
     - **Key distinction:** "In CM, the predictor doesn't care about your act in tails—it cares about what your policy *would do* in tails. Your act now is just *evidence* of your policy."  

  3. **XOR Blackmail (XB) second** (30 minutes):  
     - **Why after CM?** XB introduces *evidential reasoning*: the agent receives a message (evidence) correlating their policy with the world state (termites). CM lacks this, so XB shows a *new problem*: conditioning on evidence breaks policy-level correlations.  
     - **Stage the problem:** "XB isn't about causing termites to vanish—it's about your policy determining whether the message *signals* termites. If you condition on the message, you lose the global view."  
     - **Build intermediate notion:** *Prediction as policy-correlation*: "The predictor sends the message iff (termites XOR pay). If your policy is 'never pay,' the message implies termites. If your policy is 'always pay,' it implies no termites."  

  **Why this order:** CM forces policy thinking by stripping away evidence; XB complicates it by adding evidence, showing why updatelessness handles both.  

  ---

  #### **3. Carrying Example: Simplified Counterfactual Mugging**  
  **Why CM is the spine:** Its simplicity (no evidence, clear counterfactual) makes the act/policy distinction visceral.  
  **Features to retain (and why):**  
  - **Fair coin (not logical fact):** Ensures probabilistic symmetry; students can calculate EU without distractions.  
  - **Perfect predictor (not statistical):** Avoids "the predictor might be wrong" objections; focus on structural dependency.  
  - **Mixed-upside structure:** Benefit ($10,000) in the unrealized branch (heads), cost ($100) in the actual branch (tails). This makes updatelessness tangible: "You pay in tails to 'bind' your policy in heads."  
  - **One-shot (not repeated):** Prevents reputation-based escapes.  

  **Core to omit from XB:** Termite evidence. XB is referenced later to contrast evidence handling, but CM carries the primary load.  

  ---

  #### **4. Misconception Map**  
  Address each preemptively during the relevant phase:  

  | Misconception | When to Address | How to Address |
  |---------------|----------------|----------------|
  | "The predictor is impossible—false presupposition!" | **Start (prerequisite)** | *Pre-empt with analogy:* "Like in Newtonian physics, we assume frictionless planes to isolate principles. Here, we assume a predictor to explore decision theory, not prediction." |
  | "This is just Newcomb's with labels changed." | **After CM, before XB** | *Modify CM:* "In Newcomb, you choose an act affecting *your* branch. In CM, you're in tails—your act can't affect heads. The counterfactual is the point." |
  | "I'd pay only for a cooperator reputation." | **During CM policy discussion** | *Pause and extend:* "Reputation doesn't apply—it's one-shot, and the predictor already ran. Your policy is fixed; your act is a symptom." |
  | "XB is correlation, so CDT is obviously right." | **During XB evidence discussion** | *Contrast with CM:* "CDT refuses to pay in XB (can't cause termites away). But if your policy is 'don't pay,' the message implies termites—so you lose $1M. Policy-level CDT fails." |
  | "CM and XB are the same problem." | **Synthesis (after both)** | *Pre-empt with carrying example:* "CM has no evidence; XB adds evidence. CM's problem: conditioning on the branch. XB's: conditioning on the message. Both need updateless policies." |

  ---

  #### **5. Closing Check of Understanding**  
  **Exercise:** *Variant of CM with a "heads choice."*  
  - **Setup:** "A perfect predictor flips a fair coin. If heads, it asks you to pay $50; if tails, it asks for $100. In heads, you get $10,000 iff you would have paid in tails. You are in heads. Do you pay the $50? Why?"  
  - **Shallow answer (memorized):** "I pay because I follow the policy of paying in both branches."  
  - **Deep answer (grasped updatelessness):** "I don't pay. The policy is set pre-flip: 'pay in tails, refuse in heads.' In heads, paying $50 doesn't affect the $10,000 (already determined by my tails policy), so I refuse to avoid the cost. The predictor simulated my policy, not my heads act."  
  **Why it works:** Distinguishes policy selection (pre-flip) from act execution (post-flip). Students who conflate them will pay; those who grasp updatelessness refuse.  

  ---

  #### **6. Conscious Omission List**  
  Explicitly omit:  
  - **Logical counterfactuals and proof-based decision theory:** "We're using probabilistic counterfactuals (e.g., fair coins), not logical dependencies. This keeps focus on the act/policy distinction."  
  - **Formal differences (updateless/timeless/functional):** "We use 'updateless' loosely: choosing policies without conditioning on your branch or evidence. Formal distinctions matter for advanced work but obscure today's core."  
  - **Reflective oracles/equilibrium concepts:** "These extend to repeated games, but we're in one-shot scenarios. Adding them would blur why policies resolve single decisions."  
  **How omissions reinforce the point:** By bounding the discussion to *stipulated predictors* and *one-shot choices*, the act/policy distinction remains the star. Students see updatelessness as the minimal stable solution.  

  ---

  **Timing Allocation:**  
  - Prerequisite + CM: 50 min  
  - Policy bridge: 20 min  
  - XB + misconceptions: 30 min  
  - Synthesis + exercise: 20 min  
  **Total:** 120 min
