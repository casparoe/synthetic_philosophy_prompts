prompt: |-
  I am leading a two-hour seminar for a reading group of quantitative master's students in computer science and statistics. They are comfortable with probability, conditioning, expected utility, and basic causal graphs, but they have never worked through decision theory beyond Newcomb's problem, and most of them treat Newcomb's problem as a parlour trick rather than as a diagnostic instrument. I want the session to get them to see what counterfactual mugging and XOR blackmail jointly establish: that the genuine choice point in such cases is between selecting an act and selecting a policy or decision procedure, and that once that distinction is in place, updatelessness — acting on branches of reality one knows one is not in — stops looking like superstition and begins to look like a stable stopping point.

  For reference, the two scenarios are, in compressed form. In counterfactual mugging, a perfect predictor flips a fair coin; if the coin lands tails it asks you for $100, and if it lands heads it pays you $10,000 just in case it predicted you would have paid had it landed tails. You are asked, so you know you are in the tails branch. In XOR blackmail, the predictor sends you a message just in case exactly one of the following holds: your house is infested with termites, or you will pay it $1,000; an infestation would cost you $1,000,000.

  I do not want you to write the explanation itself. I want a teaching plan: the order in which components must be introduced and why each depends on the previous one, the single worked example the session should return to, the misconceptions this audience will predictably form and where in the sequence each should be headed off, the closing check that would show the idea has landed rather than merely been tolerated, and what should be left out and openly flagged as omitted.

  Specifically, give me:

  1. The prerequisite idea that must be secured before either problem is intelligible — the thing which, if it is not in place, will make the students experience both cases as conjuring tricks rather than arguments.

  2. An ordering for the session. Should counterfactual mugging come before XOR blackmail, or the reverse? In what precise sense should the first case stage a problem for reasoning about acts, and the second a different problem for reasoning about evidence and correlation? Which intermediate notions (for example, pre-commitment as legitimate but unavailable in the posted choice; the difference between the probability of an act and the probability of a policy; prediction as correlation with the decision procedure rather than with the surface action) need to be built between the two cases, and why?

  3. One carrying example. Decide which of the two scenarios should serve as the spine of the session, and state what features it must have and must lack for the pedagogical point to survive — for instance, a fair coin rather than a logical fact, perfect prediction rather than merely statistical prediction, a one-shot choice rather than a repeated game, and a mixed-upside structure in which the benefit lands in the branch the agent knows it is not in. If the cleanest spine is a simplified common core of both scenarios rather than either standard version, specify that core.

  4. A misconception map. For each of the following predictable moves — and for any others you judge as pressing — say at which point in the sequence it should be addressed and how to address it without dismissing it: 'the predictor is impossible, so the problem floats on a false presupposition'; 'this is just Newcomb's problem with the labels changed'; 'I would pay only because it buys me a reputation as a cooperator'; 'XOR blackmail is simply correlation rather than causation, so the causal decision theorist is obviously right and that closes the matter'; 'the two problems are the same problem described twice'. Be specific about whether each misconception is best pre-empted by an example, by a modification of the carrying example, or by pausing the sequence and extending the current case.

  5. A closing check of understanding. Design a short exercise or question, answerable in five minutes without new machinery, that would distinguish a student who has genuinely grasped why the two problems push in opposite directions from a student who has merely learned to say 'choose the policy, not the act'. Say what a correct-but-shallow answer looks like and what a correct-and-deep answer adds.

  6. A conscious omission list. State which neighbouring topics — logical counterfactuals, proof-based decision theory, the formal differences among updateless, timeless, and functional decision theories, reflective oracles, or anything similar — you would explicitly decline to cover, and explain how drawing that boundary can itself reinforce the main point rather than deflate the session.

  Do not provide a reading list or citations; the plan should be built from the two scenarios themselves.
reasoning: |-
  We are building a teaching plan for a two-hour seminar. The goal is to get students to see that the key distinction is between selecting an act and selecting a policy, and that updatelessness is a stable stopping point.

  Prerequisite Idea:
  The absolute prerequisite is the understanding that decision theory is about how to map beliefs and desires to actions, and that the standard frameworks (like causal decision theory and evidential decision theory) are attempts to formalize this. However, for these problems to be seen as more than tricks, we must establish that the predictor is not just an adversary but a logical consequence of the setup. The predictor represents a correlation that is built into the structure of the problem, and the agent's decision procedure is part of the causal chain that leads to the outcome. Without this, the problems seem like impossible magic. Specifically, we must secure the idea that the predictor is a given in the problem and that the agent's decision algorithm is part of the world that the predictor models. This is not about the possibility of prediction in our world, but about reasoning within a world where such prediction is stipulated.

  Ordering the Session:

  1. Start with Counterfactual Mugging (CM) because it is simpler in structure and does not involve evidence about the world (like termites). It has a clear coin flip and a direct counterfactual.

     - Stage CM as a problem for reasoning about acts: The agent is in the tails branch and is asked to pay $100. The immediate act of paying seems to lose $100 with no return because the predictor already made its decision. But the counterfactual in which the coin was heads and the agent gets $10,000 depends on the agent's policy (what they would have done in the counterfactual). The problem: if the agent conditions on being in the tails branch, then paying $100 does not cause the $10,000 (because that branch is already closed) but is only evidence that the agent has a policy that would have led to payment in the counterfactual. However, the agent doesn't get the $10,000 in this branch. So, acting on the current act (refusing) seems rational by causal reasoning, but acting on the policy (paying) leads to a better outcome in expectation.

     - Build the intermediate notion: Pre-commitment. If the agent could pre-commit to paying, then they would get $10,000 in the heads branch and lose $100 in the tails branch, which has positive expected value. But in the actual situation, they cannot pre-commit because they are at the choice point. However, the predictor has already simulated what they would do. Thus, the agent must choose an act that is consistent with the policy that would have been pre-committed.

     - Introduce the idea of a policy: A policy is a function from the agent's information state to an action. In CM, the policy is: "If the coin is heads and I am offered $10,000, then I accept; if the coin is tails and I am asked for $100, then I pay." The predictor rewards the agent for having a policy that pays in the tails branch. But note: the agent in the tails branch does not get the reward. So why pay? Because the policy that pays in the tails branch is the same policy that gets the reward in the heads branch. The agent must choose the policy, not just the act.

  2. Then move to XOR Blackmail (XB). This problem introduces evidence: the agent receives a message, which is evidence about the state of the world (termites) and also about the predictor's prediction.

     - Stage XB as a problem for reasoning about evidence and correlation. The agent must decide whether to pay $1000. The message is sent only if exactly one of two things is true: the house has termites or the agent pays. The agent also knows that having termites would cost $1,000,000. The problem: if the agent conditions on having received the message, then paying $1000 is evidence that the house does not have termites (because if it did, then the message would not have been sent unless the agent was going to pay, but the message is sent only in the XOR case). However, paying does not cause the termites to go away. The causal decision theorist would not pay because paying doesn't cause the absence of termites. But if the agent has a policy of not paying, then the message is sent only if there are termites, so receiving the message is bad news. If the agent has a policy of paying, then the message is sent only if there are no termites, so it is good news. But the agent, upon receiving the message, must choose an act. The evidential decision theorist would pay because it is evidence that there are no termites. However, the causal decision theorist would not pay because it doesn't cause the termites to be absent.

     - Build the intermediate notion: The difference between the probability of an act and the probability of a policy. In XB, the correlation between the act and the state of the world (termites) depends on the agent's policy. The predictor is correlating with the policy, not just the act. The agent's decision at the choice point is evidence about the policy they are using, which in turn is correlated with the state of the world.

     - The key point: In XB, the agent is updating on the message. The updateless agent would not update on the message because the policy is chosen before seeing the message. But in the actual choice, the agent has seen the message. How to reconcile? The agent must choose an act that is part of a policy that was chosen before the update.

  3. After both problems, draw the contrast: CM shows that conditioning on being in the tails branch leads to a loss of the counterfactual benefit. XB shows that conditioning on the message leads to a loss of the correlation that the policy sets up. Both push for updatelessness: acting as if you haven't conditioned on the information that you have.

  The Carrying Example:
  Use Counterfactual Mugging as the spine because it is simpler and does not involve evidence about an external state. The core features:

  - Must have: a random event (fair coin) that the agent does not control, and which creates two branches (heads and tails).
  - Must have: the reward in one branch (heads) depends on the agent's action in the counterfactual branch (tails).
  - Must have: the agent is in the branch that does not get the reward (tails) and must decide an act that affects the reward in the other branch.
  - Must lack: any evidence about the external world (like termites) that the agent updates on. This keeps it clean.

  A simplified common core might be:

    A fair coin is flipped. If heads, the agent is given $10,000 if and only if the predictor predicted that in the event of tails, the agent would pay $100. If tails, the agent is asked to pay $100. The agent is in the tails branch.

  Misconception Map:

  1. 'The predictor is impossible, so the problem floats on a false presupposition.'
     - When: Address at the very beginning, when introducing the setup of CM.
     - How: Emphasize that the problem is a thought experiment that assumes a predictor as given. The point is not to debate the possibility of prediction but to reason about the decision given that the predictor exists. Compare to Newcomb: we don't debate the possibility of the Predictor, we take it as part of the problem.

  2. 'This is just Newcomb's problem with the labels changed.'
     - When: After presenting CM, before moving to XB.
     - How: Point out the structural difference: in Newcomb, the agent's choice is correlated with the state of the box (which is fixed) and the agent can take both boxes. In CM, the agent is in a branch that doesn't get the reward, and the reward is in the other branch. The counterfactual is more explicit. Also, in Newcomb, the agent's choice is evidence about the prediction, but in CM, the agent is in the branch that is the test of the counterfactual.

  3. 'I would pay only because it buys me a reputation as a cooperator.'
     - When: During the discussion of CM, when talking about pre-commitment and policy.
     - How: Pre-empt by noting that the problem is one-shot and there is no reputation. The predictor is the only observer and it has already made its prediction. The agent's action now does not affect the prediction. So reputation is irrelevant.

  4. 'XOR blackmail is simply correlation rather than causation, so the causal decision theorist is obviously right and that closes the matter.'
     - When: When presenting XB, after explaining the evidential reasoning.
     - How: Point out that the causal decision theorist (CDT) does indeed refuse to pay, but then note: if the agent follows CDT, then when they get the message, it means they have termites (because they didn't pay, so the message is sent only if there are termites). So they are about to lose $1,000,000. If they had a policy of paying, they would only pay $1,000 and the message would be sent only if there are no termites. So the policy of paying has a better expected outcome. The problem for CDT is that at the choice point, the agent has updated and sees that paying doesn't cause the termites to go away. But the policy choice was made before the update.

  5. 'The two problems are the same problem described twice.'
     - When: After presenting both, during the synthesis.
     - How: Contrast: In CM, the agent is in the branch that doesn't get the reward and the issue is about counterfactual reasoning. In XB, the agent receives evidence and the issue is about updating on that evidence. Both push for updatelessness but from different angles.

  Closing Check of Understanding:

  Exercise: 
    Consider a variant of Counterfactual Mugging where the coin is flipped and you are told the outcome. If tails, you are asked to pay $100. If heads, you get $10,000 only if you would have paid in the counterfactual tails scenario. Now, suppose that instead of being asked only in the tails branch, the predictor asks you in both branches: in tails, you are asked to pay $100, and in heads, you are asked to pay $100 as well. However, the reward in the heads branch is still $10,000 only if you would have paid in the tails branch. You are now in the heads branch and are asked to pay $100. Should you pay? Why or why not?

  A correct-but-shallow answer: 
    "I should pay because if I don't pay, then in the counterfactual tails branch I wouldn't have paid, so I wouldn't get the $10,000. But I'm in the heads branch, so paying $100 now doesn't affect the counterfactual. However, I must follow the policy: if I have a policy of paying in both branches, then I get the $10,000. So I pay."

  A correct-and-deep answer adds:
    The agent is in the heads branch and has updated on that. The payment of $100 in the heads branch does not cause the counterfactual in tails to change. However, the agent's decision now is evidence about what they would have done in the tails branch. Specifically, if they don't pay now, that indicates that their policy is not to pay in the heads branch, but what about the tails branch? The problem does not specify a direct link. But note: the predictor's decision to give the $10,000 is based on what the agent would have done in the tails branch. The agent's current action might be correlated with their counterfactual action only if they are following a consistent policy. If the agent has a policy that pays in both branches, then they pay in heads and would have paid in tails. If they have a policy that pays only in tails, then in heads they wouldn't pay. But in this problem, the agent in heads is being asked to pay. The key is that the agent must choose a policy. The updateless approach would have chosen a policy before the coin flip. The policy "pay in both branches" leads to: in tails, lose $100; in heads, pay $100 and get $10,000, so net $9,900. The policy "don't pay in either" leads to: in tails, nothing; in heads, nothing (so no $10,000). The policy "pay only in tails" is not available in the heads branch because in the heads branch you are being asked to pay and if you refuse then the predictor might infer that you wouldn't have paid in tails? Actually, the predictor has already made the prediction. So the agent's action now does not affect the reward. Therefore, in the heads branch, the agent should not pay because it doesn't cause the reward and they don't need to prove anything. But wait, the problem states that the predictor has already made the prediction. So the agent's action now is irrelevant to the reward. Therefore, the agent should not pay. However, this is a trick: the policy is already fixed by the predictor. The agent's action now is just an additional cost. So they should not pay. But note: the predictor's prediction was about what the agent would have done in the tails branch. The agent's action in the heads branch is not the same as in the tails branch. Therefore, the agent in the heads branch does not need to pay. The expected utility of paying in the heads branch is -$100 (since the $10,000 is already determined). The expected utility of not paying is $0. So they should not pay.

  But wait, this exercise is designed to test the understanding that the policy must be chosen before the update. The correct policy is to pay only in the tails branch? But in the heads branch, if you are asked to pay, you don't have to. However, the problem says the predictor asks you in both branches. The predictor's prediction for the counterfactual tails branch is independent of what you do in the heads branch. Therefore, the agent in the heads branch should not pay. This shows that the policy is not about paying in both branches but about paying in the tails branch. The agent in the heads branch does not need to pay. The point: the policy is defined over branches. The agent in the heads branch is not in the counterfactual branch, and their action in the heads branch does not affect the counterfactual. Therefore, they should not pay.

  This exercise reveals that the agent must choose a policy per branch. The carrying example (CM) requires paying in the tails branch and not paying in the heads branch is irrelevant. But in the variant, if the agent in the heads branch pays, they lose $100 for no reason. The policy that pays in the tails branch but not in the heads branch is the best. The agent in the heads branch, having updated, should not pay. The agent in the tails branch, having updated, should pay? But that would be the policy. The updateless agent would set the policy: pay in tails, don't pay in heads. Then, when in the heads branch, they don't pay. This is consistent and yields the $10,000 without the extra $100 loss.

  Therefore, the exercise checks the understanding that the policy is chosen without conditioning on the branch, but then the agent conditions on the branch to execute the policy. The agent in the heads branch does not pay because the policy says: in heads, don't pay. The agent in the tails branch pays because the policy says: in tails, pay.

  The shallow answer might say "I pay in heads to prove I would have paid in tails" but that is incorrect because the predictor has already made the prediction. The deep answer recognizes that the policy is set in advance and the action in the branch is just executing the policy. The branch condition is part of the policy.

  Conscious Omission List:

  1. Logical counterfactuals: We are not going into how the predictor works, especially in cases where the agent's decision is determined by logical necessity. We assume a fair coin and a predictor that can simulate the agent.

  2. Proof-based decision theory: We are not formalizing the decision theory using logical proofs. We are staying with the policy approach.

  3. Formal differences among updateless, timeless, and functional decision theories: We are using the term "updateless" informally to mean not conditioning on information that the agent has. We won't distinguish among these.

  4. Reflective oracles: This is beyond the scope and not needed for the core point.

  Drawing the boundary: By omitting these, we reinforce that the core idea is about the act/policy distinction and conditioning. The problems can be understood without these advanced topics, and the stopping point is the policy-based, updateless approach.

  Teaching Plan Outline:

  1. (10 min) Introduction: Recap of decision theory and the role of the predictor. Secure the prerequisite: the predictor is a given and the agent's decision procedure is part of the model.

  2. (30 min) Counterfactual Mugging:
     - Present the problem.
     - Discuss the act: why refusing seems rational.
     - Introduce the policy: pre-commitment and the expected value of the policy.
     - Show that choosing the policy (paying) has higher expected utility.
     - Address misconceptions 1, 2, and 3 as they come up.

  3. (30 min) Build the bridge: The difference between an act and a policy. The idea that the predictor is responding to the policy, not the act. The agent, by conditioning on being in a branch, loses the ability to control the counterfactual.

  4. (30 min) XOR Blackmail:
     - Present the problem.
     - Show the evidential reasoning: paying is evidence of no termites.
     - Show the causal reasoning: paying doesn't cause the termites to go away.
     - Contrast the policy level: if the agent chooses a policy of paying, then the message is good news (no termites) and they only lose $1,000; if they choose a policy of not paying, then the message is bad news (termites) and they lose $1,000,000.
     - Address misconception 4.

  5. (10 min) Synthesis: Both problems push for updatelessness. In CM, conditioning on tails leads to refusing; in XB, conditioning on the message leads to not paying (if CDT) or paying (if EDT) but the policy level shows that the best policy is to pay in both? Actually, in XB the best policy is to pay? Let me clarify:

