  The user's hypothesis is that the real issue isn't decision theory but an unargued metaphysical commitment. The first camp assumes diachronic psychological continuity is necessary for rational agency, while the second sees identity discontinuity as compatible with rational evaluation. They want to know if this is correct or if there's a hidden formal disagreement, perhaps about whether intertemporal choice theory needs an identity-stability axiom. 

  First, I need to verify if the user's diagnosis holds. Looking at each camp's claims: Camp 1 (epistemic) says you can't assign accurate subjective values without experiential knowledge. Camp 2 (axiological discontinuity) argues that even with perfect information, the preference structure changes so much that the old values don't apply. The user thinks the disagreement stems from underlying assumptions about personal identity. 

  I recall that Camp 1, by emphasizing the inability to know future subjective states, seems to require a continuous self whose future experiences can be anticipated. Camp 2, by accepting that preferences can be radically replaced, implies that different identity stages can still engage in rational evaluation. Neither side explicitly argues for their view of personal identity; it's assumed. 

  Is there a hidden formal disagreement? The user suggests it might be about an identity-stability axiom in intertemporal choice theory. Standard models assume a consistent agent over time. Camp 2 might reject this axiom, but they haven't formalized an alternative. Camp 1 relies on it implicitly. So yes, the metaphysical commitments are the bedrock issue, not just epistemic or axiological surface arguments. 

  The user asks about progress. A conceptual distinction between phenomenal ignorance and axiological discontinuity might help, but since the camps already frame their positions this way, it won't resolve the deeper divide. A formal model of choice across identity stages could be useful, as it forces both sides to articulate their assumptions. Reframing the problem, like questioning the necessity of psychological continuity for rationality, might dissolve the issue by challenging the shared premise. 

  The user seems well-versed in philosophy, possibly a grad student or academic. Their unspoken need might be to find a pathway out of the stalemate for their own research or paper. They want clarity on whether the debate's core is metaphysical or formal, and what steps could advance it. By diagnosing the disagreement as bedrock due to identity metaphysics, and suggesting formal modeling or reframing as progress, they can focus their efforts on those areas.
answer: |-
  Your diagnosis is **largely correct**: the core disagreement is **bedrock**, rooted in irreconcilable metaphysical commitments about personal identity and agency, masquerading as an epistemic or axiological dispute. Here's a breakdown using their explicit claims:

  ### 1. **What Each Side Explicitly Claims**
     - **Camp 1 (Epistemic Ignorance):**  
       *Claims:* Rational choice requires accurate subjective value assignment. Transformative experiences create "phenomenal ignorance" — you cannot *know* what it's like to be a parent (etc.) beforehand, so you cannot assign utilities to outcomes involving that state.  
       *Implied Metaphysics:* Rational agency requires **diachronic psychological continuity**. The *same agent* must persist to evaluate choices for their future self. If you can't access future subjective states, rational comparison fails.

     - **Camp 2 (Axiological Discontinuity):**  
       *Claims:* Even with perfect phenomenal knowledge, rational evaluation is impossible because transformation *replaces your preference architecture*. The pre-transformation agent is evaluating outcomes for a *different subject* (numerically or psychologically distinct).  
       *Implied Metaphysics:* **Identity discontinuity** is compatible with rational agency. The pre-transformation agent can rationally choose for a *different future entity* (like choosing for a descendant or successor).

  ### 2. **Nature of the Disagreement**
     - **Not Verbal:** Both sides clearly define their terms (epistemic access, preference architecture).  
     - **Not Superficially Substantive:** The epistemic vs. axiological framing is substantive, but it’s secondary.  
     - **Bedrock:** The true conflict is **metaphysical**:  
       - Camp 1 assumes a *Lockean psychological continuity* view of identity: rationality requires a stable "self" to justify sacrifices for future benefits.  
       - Camp 2 assumes a *bundle theory or stage-theory* of identity: rationality doesn’t require a persistent self, only coherent evaluation between stages/successors.  
       Neither defends this premise because it functions as an unstated axiom.

  ### 3. **The Hidden Formal Disagreement**
     Your insight about an **identity-stability axiom** is key. Standard intertemporal choice models (e.g., discounted utility) assume:
     - **Axiom of Identity Stability:** The agent at \( t_1 \) and \( t_2 \) is numerically identical, with utilities commensurable across time.  
     - **Camp 1** *relies* on this axiom. Without it, phenomenal knowledge is irrelevant.  
     - **Camp 2** *rejects* this axiom. They argue transformative experiences violate commensurability *even if utilities are known*, because the \( t_2 \) agent is a "different person."  
     This formal gap is obscured by both sides talking about "value assignment" without clarifying the metaphysics of the valuing *subject*.

  ### 4. **Paths to Progress**
     Progress requires addressing the bedrock issue. The options you propose vary in effectiveness:
     - **Conceptual Distinction (Phenomenal Ignorance vs. Axiological Discontinuity):**  
       *Status:* Already implicit in the debate. Camp 1 focuses on the former, Camp 2 on the latter.  
       *Limitation:* Fails to resolve the stalemate because it doesn’t touch the identity metaphysics.  
       **Verdict: Necessary but insufficient.**

     - **Formal Model of Choice Across Identity Stages:**  
       *Potential:* Forces both camps to explicitly formalize their metaphysical commitments. Examples:  
       - *Successor-Agent Modeling* (Camp 2): Treat pre/post-transformation as distinct agents with a "legacy choice" rule (e.g., pre-agent selects a utility function for the successor).  
       - *Continuity-Preserving Models* (Camp 1): Require a continuity constraint (e.g., utilities must be relatable via empathy or narrative unity).  
       *Progress Value:* High. Exposes assumptions, enables empirical tests (e.g., do people reason like Camp 1 or 2?).  
       **Verdict: Most promising for breaking the stalemate.**

     - **Reframing that Dissolves the Problem:**  
       *Options:*  
       - **Eliminativism:** Reject "rational choice" as incoherent for transformative decisions. Focus on non-rational factors (e.g., commitment, character).  
       - **Narrative Rationality:** Shift to "rationality as coherent life-story construction." Transformation becomes a plot point, not a discontinuity.  
       - **Meta-Preferences:** Rationality resides in choosing *which preferences to have*, not maximizing current utilities.  
       *Progress Value:* High if successful, but risks changing the subject.  
       **Verdict: Radical but could dissolve the dichotomy if widely adopted.**

  ### Conclusion
  You’re right: the debate is stalled due to **unexamined metaphysical commitments** about identity and agency. Camp 1’s epistemic argument presupposes identity continuity; Camp 2’s axiological argument presupposes its irrelevance. The hidden formal disagreement concerns whether intertemporal choice requires an **identity-stability axiom**. 

  **What counts as progress:**  
  1. **Formalizing identity-stage models** is the most direct path—it forces confrontation with the metaphysical bedrock.  
  2. **Reframing rationality** (e.g., narrative/meta-preference approaches) could dissolve the problem by redefining rational agency.  
  3. Mere conceptual distinctions won’t suffice—the stalemate is too entrenched in foundational assumptions.  

  The next breakthrough requires philosophers to stop "talking past" each other on identity and formally model *how rational choice functions when the chooser and experiencer may not be the "same person."* This shifts the debate from "Can we choose rationally?" to "What metaphysics of self does rational choice require?"—which is the real, unaddressed question.
