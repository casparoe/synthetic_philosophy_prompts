answer: |-
  ## Proposal: The Scaffolded Norm – When Moral Revolutions Collapse, Not Persuade

  **Project Title:** Beyond Honor vs. Reason: Modeling the Structural Collapse of Moral Norms (Dueling and Foot-Binding Case Studies)

  **Principal Investigator:** [Your Name/Identifier]
  **Duration:** 6 Weeks
  **Deliverable:** 4000-word conceptual paper

  ### 1. The Core Question & Puzzle
  Why do deeply entrenched, morally charged norms like dueling or foot-binding vanish seemingly overnight, despite persisting for centuries? Existing explanations often fall into two camps: the "rationalist persuasion" narrative (moral arguments gradually change hearts and minds) and the "interest-based erosion" narrative (material interests slowly undermine the practice). Both feel inadequate. Persuasion narratives struggle to explain the *speed* of collapse (e.g., dueling's rapid decline in the 19th century). Interest narratives struggle to explain why change was *delayed* for so long despite obvious costs (e.g., the long persistence of foot-binding).

  This project proposes a third mechanism: **structural scaffold collapse**. The central question is: **Do norms requiring high-stakes coordination vanish primarily when three interdependent structural conditions simultaneously fail: (1) the *credibility* of the norm's status signal, (2) the *visibility* of defection, and (3) the *costliness* of exit?** This model aims to explain rapid collapse without relying solely on mass belief-shift, while acknowledging why interest-based pressures alone were insufficient for so long.

  ### 2. The Gap: Why Williams/Appiah (and Others) Leave the Door Open
  Influential accounts by Bernard Williams and Kwame Anthony Appiah powerfully highlight the role of "honor" or social recognition in sustaining norms like dueling. Williams frames honor as an internalized disposition distinct from, and often resistant to, moral reason. Appiah emphasizes honor as tied to social identity and recognition, arguing that shifts in what confers honor drive moral revolutions. While invaluable, these treatments risk creating a binary:
  *   **Honor/Recognition vs. Reason:** They position honor as the primary engine *opposed* to rational moral argument.
  *   **Honor/Recognition vs. Material Interest:** They often treat the pursuit of honor as distinct from (or even conflicting with) material self-interest.

  **The key gap is treating "honor" as a monolithic *rival* force to reason or interest, rather than analyzing the specific *structural preconditions* that make honor-based coordination viable and costly.** This project contends that honor is not a primitive force, but is *enabled* and *sustained* by a visible, credible, and costly coordination scaffold. Williams and Appiah illuminate the *fuel* (the desire for honor/recognition), but leave the *machinery* (the scaffold enabling its coercive power) underspecified. Consequently, they struggle to fully explain the *suddenness* of collapse – why the "honor engine" doesn't just sputter but catastrophically fails when the scaffold rusts through.

  ### 3. Conceptual Method: Reconstructing the Scaffold
  This project is a **conceptual reconstruction and model-testing exercise**. Within the 6-week limit and 4000-word constraint, it will:
  1.  **Define the Scaffold Framework:** Precisely articulate the three proposed conditions:
      *   **Credibility of Status Signal:** Does adherence to the norm (e.g., dueling, foot-binding) reliably signal high status/prestige within the relevant group? (Does refusing a duel *actually* mark one as a coward? Does bound feet *securely* signal elite marriageability?).
      *   **Visibility of Defection:** Can deviations from the norm be easily observed and verified by the relevant community? (Is refusing a duel conspicuous? Can hidden unbinding be easily detected?).
      *   **Costliness of Exit:** What are the concrete social, economic, or political penalties for publicly defecting? (Ostracism? Loss of marriage prospects? Career ruin?).
      *   Argue that these conditions are *interdependent* and mutually reinforcing, creating a high-stakes coordination equilibrium.
  2.  **Apply the Framework to Case Studies:** Conduct a focused conceptual analysis of **dueling (focus: 19th-century Europe/America)** and **foot-binding (focus: late Qing/early Republican China)** using existing secondary historical and sociological scholarship (no new archival work). For each:
      *   Reconstruct the historical scaffold: How credible, visible, and costly *was* the norm at its peak?
      *   Analyze its decline: Did the collapse coincide with the simultaneous undermining of *all three* conditions? What specific historical factors (e.g., changing military roles, rise of courts/law, new media, economic shifts, state interventions, feminist movements) targeted which specific scaffold element?
      *   Contrast the scaffold collapse narrative with pure "persuasion" or pure "interest" narratives regarding the *timing* and *pace* of change.
  3.  **Test Against Slavery (Preliminary):** Briefly examine **transatlantic chattel slavery abolition** as a potential counterexample or scope-limiter. Did its collapse align with scaffold failure? If not, why? (Likely factors: vastly different power dynamics, racial ideology, economic centrality requiring state-level coercion). This tests the model's boundaries.

  ### 4. Measuring Success & Failure
  *   **Success:** The project succeeds if it:
      *   Clearly defines a plausible "scaffold collapse" model distinct from existing honor/reason/interest narratives.
      *   Demonstrates convincingly, using secondary sources, that the rapid collapses of dueling and foot-binding *are better explained* by the simultaneous failure of credibility, visibility, and exit costs than by gradual persuasion or interest shifts alone.
      *   Generates a preliminary predictive heuristic: Scaffold norms (high on all three conditions) are prone to *sudden collapse* when all supports fail simultaneously. Norms lacking one or more conditions (e.g., low visibility, low credibility) may erode more slowly via interest/persuasion.
      *   Provides a coherent account of why Williams/Appiah-style honor narratives, while insightful, miss this structural interdependence.
  *   **Failure/Scope Limitation:** The project *fails* if:
      *   The scaffold model proves incoherent or adds no explanatory value beyond existing frameworks.
      *   Analysis shows dueling/foot-binding collapse *was* primarily driven by mass belief-shift or gradual interest change, undermining the core thesis.
      *   Slavery abolition definitively breaks the model, demonstrating it cannot handle norms underpinned by extreme power asymmetry and racial ideology. **Success in this case involves clearly diagnosing *why* it breaks (e.g., state coercion supersedes social coordination, exit costs were lethal/insurmountable for the oppressed group, credibility signal operated within the dominant group differently), thereby sharply defining the model's scope to norms reliant on *social coordination within a status group*.**

  ### 5. Feasibility & Deliverable within Constraints
  The 6-week timeframe and 4000-word limit necessitate a focused conceptual study. This is achievable because:
  *   **No Primary Research:** Reliance is on synthesizing and re-interpreting well-established secondary literature on dueling, foot-binding, and slavery abolition.
  *   **Conceptual Focus:** The core task is model-building and framework application, not exhaustive historical narrative.
  *   **Targeted Case Studies:** Dueling and foot-binding are well-documented, discrete norms ideal for testing the scaffold model. Slavery serves as a defined boundary-test.
  *   **Structured Output:** The 4000-word paper will clearly present the gap, the scaffold model, the case study analyses, the slavery test, and conclusions on the model's validity and scope. Citations will be included in-text; a formal bibliography is deferred as per guidelines.

  This project offers a novel lens on moral change, moving beyond the honor/reason dichotomy by revealing the structural machinery that makes honor-binding norms persistent yet fragile. It promises a tractable, high-impact contribution explaining why some moral revolutions feel like sudden collapses rather than slow conversions.
