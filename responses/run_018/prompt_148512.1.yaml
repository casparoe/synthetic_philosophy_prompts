  First, I need to recall Turing's actual writings. The "child machine" concept from "Computing Machinery and Intelligence" does suggest starting with a simple foundation and educating it, but his examples involve mathematical puzzles and rewards - not Latin drills. The boarding school analogy feels more like the friend's cultural framing than Turing's own words. 

