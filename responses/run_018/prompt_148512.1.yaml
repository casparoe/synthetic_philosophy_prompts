  I was chatting with my friend who took a course on AI history and she summarized Turing's view on learning machiens like this: he believed you should raise an intelligent machine exactly like a British public-school boy—start with a blank mechanical child-brain, then drill it in Latin, Euclid, and moral philosophy until the computation produces something indistinguishable from a cultivated gentleman. She said he thoght culture was the real engine of intelligence, not algorithms, and that once a machine could consistently win the imitation game we ought to grant it the legal status of a student since there's no principled line between learned human habits and trained machine responses. Something feels stretched about tying his child-machine idea to boarding-school curricula and legal rights, but she insists it's all in his later writings and that I'm just being pedantic. Is this a fair summary? Please go through it sentence by sentence—what captures Turing's actual proposals about educating learning machines, what's a subtle conflation with other thinkers or a overstatement of his modest claims, and whether the leap to legal personhood follows from anything he actually argued about learning and behavior.
