  First, the apparent contradiction: If there's no self, what carries kamma? The key is citta-santāna—the mental continuum. It's not a "self" but a causal chain, like fire spreading. Kamma is just momentum in this stream. The tension dissolves when we see rebirth as pattern-propagation, not soul-migration. 

  Then, skillful means: How can a "selfless" agent act skillfully? Because the illusion of agency is functionally real. The aggregates react to intentions, so upāya-kauśalya works pragmatically—like steering a car with no driver. The kusala/akusala distinction isn't deontic; it's teleological toward cessation. Killing might be "bad" because it fuels clinging, not because it breaks a rule. 

  Finally, the harming vs. not-benefiting dilemma: Without a permanent subject, harm is just a negative shift in the dependent arising chain. But ethically, intention still matters. Withholding treatment isn't "harming" if the intent is to cease suffering, not create new dukkha. 

