answer: |-
  Your inquiry demands a rigorous dissection of the apparent paradox between Buddhist consequentialism and *anattā*. The tension is **genuinely structural but resolvable through precise metaphysical and ethical mechanisms within classical Buddhist thought**, not mere linguistic reconciliation. Here's the conceptual architecture:

  ### 1. **The Structural Tension & Its Resolution: Kamma without a Self**
     - **Core Tension**: If no self (*attā*) exists, what entity experiences kammic results (*vipāka*) across lifetimes? Consequentialism requires continuity of moral responsibility, yet *anattā* denies a persisting subject.
     - **Resolution Mechanism: Causal Continuity (not Identity)**  
       Kammic transmission occurs through the *citta-santāna* (mind-stream), a dynamic, ever-changing sequence of causally linked mental states. This stream lacks an enduring essence (*svabhāva*) but possesses **causal coherence**:
       - *Analogy*: A flame passing from one wick to another. No "identical" flame exists moment-to-moment, but causal conditions (heat, fuel) propagate patterns of combustion. Similarly, intentional actions (*cetanā*) imprint latent tendencies (*saṅkhāras*) onto the mind-stream, conditioning future states.
       - *Kamma as Impersonal Causality*: Kamma is not "punishment/reward" for a self but the *natural law* that volitional acts reshape the mind-stream’s trajectory. The "subject" of suffering in future rebirths is a **causally emergent configuration** (the *paṭiccasamuppāda* process), not a transmigrating soul.

  ### 2. **Upāya-Kauśalya (Skillful Means) without Enduring Identity**
     - **Agent as Process**: The "agent" making ethical decisions is itself a temporary coalescence of aggregates (*khandhas*). Skillful means functions *because* the mind-stream exhibits:
       - *Intentional Continuity*: A decision to authorize/withhold treatment arises from present causes (compassion, wisdom, delusion), altering future mental states.
       - *No-Self Pragmatism*: Ethical skillfulness is measured by how actions influence the *citta-santāna*’s movement toward *dukkha* or its cessation (*nirodha*). The "agent's" lack of permanence doesn’t negate causality; it underscores that skillful action must account for the stream’s impersonal dynamics.
     - **Application**: Choosing to forgo life-prolonging intervention (e.g., aggressive resuscitation) can be *upāya* if motivated by compassion (*karuṇā*) and insight into the dementia patient’s irreversible *dukkha*. The act’s "skill" lies in its effect on the mind-streams involved (patient, caregiver, clinicians)—reducing *upādāna* (clinging) to biological life as inherently "self."

  ### 3. **Kusala/Akusala: Teleological Heuristic, Not Deontic Rule**
     - **Instrumental to Cessation**: Kusala (wholesome) and akusala (unwholesome) are **evaluative categories defined by their causal relationship to liberation**:
       - *Akusala*: Actions rooted in greed (*lobha*), hatred (*dosa*), delusion (*moha*) that increase *dukkha* and reinforce *saṃsāric* bondage.
       - *Kusala*: Actions rooted in non-greed, non-hatred, non-delusion that reduce *dukkha* and support progress toward *nibbāna*.
     - **Consequentialist Foundation**: The Abhidhamma explicitly links kusala/akusala to outcomes (*Aṅguttara Nikāya 6.63*). Killing is akusala not because it violates a divine command, but because it *intensifies* cruelty in the mind-stream and perpetuates cycles of violence. However, the "outcome" is measured holistically across the mind-stream’s trajectory, not just immediate effects.

  ### 4. **Harm vs. Failure to Benefit under Anattā**
     - **Collapse? No—Intention and Causal Architecture Matter**  
       *Anattā* reframes, but does not erase, the distinction:
       - *Harming* (*ahiṃsā* violation): An intentional act (e.g., administering pointless, painful treatment) that introduces *new duḥkha* or reinforces delusion. It generates akusala kamma by strengthening *moha* (ignorance of suffering’s nature) or *dosa* (resentment of care burdens).
       - *Failing to Benefit*: Withholding intervention isn’t intrinsically akusala if:
         (a) The intervention prolongs *dukkha* without alleviating underlying causes (e.g., extending biological life while dementia erodes personhood),  
         (b) The intention is *compassionate non-attachment* to futile treatment, not aversion toward the patient.
       - **Key Principle**: Buddhism prioritizes reducing *present dukkha* over prolonging biological existence (*Dīgha Nikāya 30*). "Harm" arises from volitional acts (or omissions) that *actively condition* suffering. Letting a disease take its natural course when treatment increases net suffering is not kammically equivalent to actively causing harm.

  ### Conclusion: Structural Coherence through Dependent Origination
  The tension dissolves when both kamma and ethics are grounded in *paṭiccasamuppāda* (dependent origination). Kammic outcomes are not "borne by a self" but manifest as **emergent properties of causal chains** in the mind-stream. *Anattā* negates a *substantialist* basis for ethics but **strengthens a consequentialist framework** by:
  - Making ethics entirely **cause-and-effect driven**, free of metaphysical absolutes.
  - Prioritizing **intention** (*cetanā*) as the kammic engine, evaluated by its impact on the mind-stream’s liberation-potential.
  - Framing end-of-life decisions through **dukkha-centric analysis**: Does this act/omission reduce or amplify suffering in the interdependent web of causes?

  Thus, authorizing or withholding interventions is kammically significant not because a "self" will be punished/rewarded, but because the volition shapes the *citta-santāna*—yours and others’—toward wisdom or delusion, bondage or release. The rigor lies in tracing the causal arcs, not in finding an enduring actor.
