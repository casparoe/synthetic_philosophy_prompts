  *Remember:*
  - Try to pass the message as accurately as you can.
  - When choosing a message for the next round, think about which one is catchiest and most memorable.

  The game will have 4 rounds. At the end, we will see which message is carried by the most chains.

  **Teacher's Notes:**
  - Start with these messages (on index cards for round 1):
    - Chain A: "The quick brown fox jumps over the lazy dog, but only on Tuesdays when the sun is shining brightly." (long and complex)
    - Chain B: "Catch me if you can!" (short and catchy)
    - Chain C: "I love you forever and always." (emotional)
    - Chain D: "The meeting will commence at 10:00 AM in the conference room." (neutral and boring)

  - After each round, you will write the final messages from each chain on the board. Label them as Message 1, 2, 3, 4 (without revealing the chain of origin).

