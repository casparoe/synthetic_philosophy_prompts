  2. Which messages became more common? Why do you think that happened?
  3. Were there any messages that disappeared? Why?
  4. Did the messages change in ways that made them easier to remember? Or more emotional? Give examples.
  5. How did the properties of the messages (like length, emotion, catchiness) affect their spread?
  6. Was the spread of a message due to someone judging it as true or useful, or because it was easy to pass on and catchy?
  7. In real life, can you think of examples of things that spread because they are catchy, even if they are not true or useful?

  Then introduce the term "meme" and explain the Darwinian principles.

  This should fit in 80 minutes if you keep the rounds tight. Good luck!
answer: |-
  ### **Cultural Transmission Game: "Message Evolution" Activity**  
  **Designed for 80 minutes with 16 students (4 chains of 4 students each).**  
  **Goal:** Students experience how cultural items (later called "memes") spread through variation, imperfect copying, and competition—without anyone judging their truth or usefulness.  

  ---

  ### **Preparation (Do Before Class)**  
  1. **Materials:**  
     - **Index cards:** 4 starting messages (1 per chain, see below). Prepare extras for new messages each round.  
     - **Voting slips:** Small paper slips for chains to vote in selection phases.  
     - **Whiteboard/projector:** To display messages and track "fitness" (frequency).  
     - **Timer:** For rounds.  
     - **Handout (1 per student):** [See "Rules for Students" below]. Print in **American English**.  
     - **Pens/paper:** For students to write final messages.  

  2. **Starting Messages (Print on Cards):**  
     - *Chain A (Long/complex):* "The quick brown fox jumps over the lazy dog, but only on Tuesdays when the sun is shining brightly."  
     - *Chain B (Short/catchy):* "Catch me if you can!"  
     - *Chain C (Emotional):* "I love you forever and always."  
     - *Chain D (Boring):* "The meeting will commence at 10:00 AM in the conference room."  

  3. **Room Setup:**  
     - Arrange desks into 4 rows (chains), each with 4 chairs.  
     - Label positions: **"Starter"** (front), **"Middle 1"**, **"Middle 2"**, **"Writer"** (back).  

  ---

  ### **Rules for Students (Handout Text – American English)**  
  > #### **MESSAGE EVOLUTION GAME**  
  > **Goal:** Your chain’s job is to pass messages down the line. The winning chain is the one whose message is carried by the MOST chains at the end.  
  >   
  > **How to Play:**  
  > 1. **Transmission (Each Round):**  
  >    - **Starter:** Gets the message card. Memorize it in 30 seconds.  
  >    - **Passing:** Whisper the message *once* to the next person (no repeats!).  
  >    - **Writer:** Write the message you hear on paper. Give it to the teacher.  
  >   
  > 2. **Selection (After Each Round):**  
  >    - **All chains vote** for the *catchiest* message (not your own!).  
  >    - The teacher will announce how many chains carry each message next round.  
  >   
  > 3. **Rotation:** After each round, move back one seat (Starter → Middle 1 → Middle 2 → Writer → becomes new Starter).  
  >   
  > **Rules:**  
  > - Pass messages *exactly* as you hear them (no cheating!).  
  > - Vote for the message you think is easiest to pass on (catchy, short, or fun).  
  > - You win if your chain’s message is the most common at the end!  

  ---

  ### **Activity Flow (80 Minutes Total)**  
  **Step 1: Intro & Setup (10 min)**  
  - **Teacher:** “Today, we’re simulating how ideas spread. Your goal is to pass messages accurately and vote for the catchiest ones. No technical terms—just play!”  
  - Divide students into 4 chains (A, B, C, D). Assign positions. Give each Starter their message card.  

  **Step 2: Round 1 – Transmission & Selection (20 min)**  
  - **Transmission (5 min):**  
    - Starters memorize message (30 sec). Collect cards.  
    - Chains whisper: Starter → Middle 1 → Middle 2 → Writer (1 min total).  
    - Writers hand final message to teacher.  
  - **Selection (15 min):**  
    - Teacher writes all 4 final messages on the board (label M1, M2, M3, M4). *Hide which chain they came from!* Example:  
      > M1: “The fox jumps on sunny Tuesdays”  
      > M2: “Catch me can!”  
      > M3: “I love you always”  
      > M4: “Meeting at 10:00 AM in conference”  
    - **Vote:** Chains discuss and vote for the *catchiest message* (not their own). Use slips.  
    - **Tally:** Announce how many chains will carry each message next round (e.g., “M2 chosen by 3 chains, M1 by 1, M3 and M4 by 0”).  
    - Prepare new cards: Replicate winning messages for the next round (e.g., 3 copies of M2, 1 copy of M1).  

  **Step 3: Rounds 2 & 3 (20 min total; 10 min each)**  
  - Repeat Round 1:  
    - **Rotate positions** (Writer becomes new Starter).  
    - Starters get new messages (based on votes).  
    - Writers hand in final messages.  
    - **Selection phase after each round:** Vote, tally, reset messages.  
  - ***Key:*** Messages mutate (whispers alter them), and selection reshapes which survive.  

  **Step 4: Round 4 – Final Transmission (15 min)**  
  - Repeat transmission (no selection after).  
  - Writers hand in final messages.  
  - **Tally final frequency:** Count how many chains carry each message (e.g., 4 chains carry M2).  

  **Step 5: Debrief & Concept Reveal (15 min)**  
  - **Questions for Students:**  
    1. “What happened to the messages over the rounds? Did they change? How?” *(Students note mutations: shortening, word swaps.)*  
    2. “Which messages became more common? Why?” *(e.g., “Catch me if you can!” spread for being short/catchy.)*  
    3. “Did anyone *decide* which message was ‘true’ or ‘useful’? Or did they spread for other reasons?” *(Emphasize: spread ≠ truth.)*  
    4. “What determined ‘winning’? Was it about the message itself or how it was copied?” *(Highlight replication, not judgment.)*  
  - **Reveal Darwinian Concepts:**  
    - “What you saw is **cultural evolution**. Messages competed like genes:  
      - **Variation:** Messages mutated (e.g., ‘fox’ → ‘foxes’).  
      - **Heredity:** Messages were copied (but imperfectly).  
      - **Differential Fitness:** ‘Catchy’ messages left more copies (high fitness!).  
      - **Cumulative Change:** Messages evolved to be shorter/emotional.”  
    - “We call these cultural units **memes**. They spread based on *replication*—how many copies they make—not truth.”  
  - **Connect to Real World:**  
    - “Memes spread online? Yes! Catchy slogans, viral dances—they win by being easy to copy, not true.”  
    - “But real life is messier: Memes combine (e.g., remixes), and people *deliberately* change them.”  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Voting is random/chaotic:**  
     - *Why:* Students vote for friends or rush.  
     - *Fix:* Stress that chains win only if *their* message dominates. Offer candy to the winning chain.  

  2. **Messages don’t mutate enough:**  
     - *Why:* Students whisper too carefully.  
     - *Fix:* Tighten time limits (30-sec memorization, quick whispers).  

  3. **One message dominates too fast:**  
     - *Why:* A catchy message (e.g., “Catch me!”) wins all votes in Round 1.  
     - *Fix:* If this happens, highlight it in debrief: “Why did this spread so fast? Was it ‘better’ or just easier to copy?”  

  4. **Students focus on “winning” over copying:**  
     - *Why:* They intentionally alter messages to make them catchier.  
     - *Fix:* Remind them: “Pass *exactly* what you hear—no improvements!”  

  ---

  ### **What the Game Can’t Capture (Discuss in Debrief)**  
  - **Real-World Complexity:**  
    - Memes mix (e.g., song mashups), while our game has no recombination.  
    - People *innovate* (e.g., create new memes intentionally). Here, change is accidental.  
    - Context matters (e.g., a meme spreads differently in different groups). Our chains are identical.  
    - **Stress:** “In reality, memes spread through social networks, not linear chains. And sometimes, ‘useful’ ideas *do* spread—but often, catchiness wins.”  

  This activity makes selection emergent (via voting tallies) and avoids lecturing upfront. Students *feel* differential replication—why some messages thrive—without jargon. The debrief links their experience to Darwinian logic, setting up deeper discussion.  

  **Handout/Slide Text (American English Summary for Students):**  
  > **Activity: Message Evolution**  
  > - **Goal:** Get your chain’s message carried by the MOST chains!  
  > - **How:**  
  >   1. **Pass messages** down your chain (whisper once, no repeats!).  
  >   2. **Vote** for the catchiest message (not your own!).  
  >   3. **Rotate seats** after each round.  
  > - **Win:** Your message is #1 at the end!  

