  **Handout for Students (Rules Summary):**

  *Cultural Transmission Game*

  *Goal:* Your chain's goal is to have the message that becomes the most popular by the end of the game.

  *How it works:*
  1. You are in a chain of 4 students (positions 1 to 4).
  2. In each round:
