prompt: |-
  I work in mechanism design and am fluent in its formal vocabulary—strategy-proofness, individual rationality, budget balance, the revelation principle, social-choice functions, equilibrium selection, and matching algorithms—but I have little background in moral philosophy. I want you to restate the philosophical debate over repugnant markets—specifically Sandel’s thesis that putting prices on goods such as kidneys, emergency supplies during shortages, or votes corrupts their social meaning and crowds out intrinsic motivations, and Roth’s thesis that repugnance is best treated as a legitimate constraint on the feasible set of allocations—entirely within my vocabulary. Treat Sandel’s “corruption of meaning” as a potential failure mode of a mechanism, and his “crowding out” as an interaction between the allocation rule and agent preferences. Treat Roth’s repugnance constraint as a boundary condition on mechanism design. For each central claim, indicate whether it translates cleanly into an existing design concept (for example, preference misrepresentation, externalities in welfare functions, or endogenous preference formation), whether it can be expressed only by distorting its meaning (for example, reducing moral significance to a parameter in a utility function), or whether it has no counterpart at all in mechanism-design language. Then report the residue: is the untranslatable remainder a sign that mechanism design genuinely lacks the resources to represent normative corruption, or is it a sign that the philosophical claim was less determinate than it appeared? Be honest in the translation—do not smuggle moral assumptions into formal terms merely to make them fit. In particular, address whether capturing crowding out requires allowing preferences to shift as a direct function of the allocation rule, which violates the standard independence assumption, and whether vote-selling can be represented without collapsing democratic legitimacy into a transferable utility. Focus on price-gouging and vote-selling, since kidney markets are already well-discussed in design literature. Keep the translation faithful, and treat the residue as the most interesting part of the answer.
reasoning: |-
  Okay, the user is deeply immersed in mechanism design and wants to see how Sandel's and Roth's arguments about repugnant markets fit into that framework. They're specifically asking about price-gouging and vote-selling, avoiding kidneys since that's well-covered. 

  Hmm, the challenge is to translate philosophical concepts like "corruption of meaning" and "crowding out" into mechanism design terms without distorting them. Sandel's ideas seem trickiest—how do you formalize something as slippery as social meaning? 

  First, for Sandel's corruption thesis: The closest mechanism design parallel is preference misrepresentation, but that's not quite right. When prices change how people value things, it's more like... ah, maybe endogenous preferences? But standard models assume preferences are fixed. Capturing this would require letting the allocation rule itself shift utility functions—that breaks fundamental assumptions. 

  For crowding out: This maps neatly to negative externalities in the welfare function. If paying for votes makes others feel democracy is cheapened, that's an externality. But Sandel means something deeper—it's not just diminished utility, but a transformation of the good itself. That part doesn't translate cleanly. 

  Now Roth's repugnance constraint: Easy. This is just a hard constraint on the feasible set, like legality or physical limits. No translation problems here—it's exogenous to the model. 

  The residue is fascinating. Sandel's "corruption" concept leaves a gap: mechanism design can model changed behavior (via shifting preferences) but not the moral degradation he describes. Is that a flaw in the formalism, or is Sandel's claim too vague? Probably both—the model can show symptoms but not the disease. 

  For vote-selling: Big problem. If we model votes as transferable utility, we've already assumed they're commodities, which is exactly what Sandel argues against. Avoiding that requires treating democratic legitimacy as non-fungible, but mechanism design lacks tools for that. 

  User's clearly sharp—they anticipated the preference-shifting issue and utility-collapsing trap. Their real interest seems to be testing mechanism design's limits for handling normative decay. The residue analysis might help them decide whether to expand the formalism or dismiss philosophical concerns as "noise." 

  ...Better emphasize that Roth translates cleanly while Sandel exposes genuine modeling gaps, especially around meaning shifts. The vote-selling example perfectly shows where mechanism design smuggles in commodification by default.
answer: |-
  Here’s the translation of Sandel’s and Roth’s theses into mechanism-design vocabulary, isolating conceptual matches, distortions, and residue—with emphasis on price-gouging and vote-selling:

  ### **1. Sandel's "Corruption of Social Meaning" as Mechanism Failure**  
  - **Claim**: Pricing certain goods (e.g., surge-priced emergency supplies, votes) alters their perceived value, transforming them from *social/civic goods* to *mere commodities*.  
  - **Translation Attempt**:  
    - **Clean Match**: *None*. Standard design assumes fixed preferences over outcomes. "Corruption" implies the *good itself changes* under monetization—a transformation orthogonal to utility functions.  
    - **Distortion**: Forcing this into existing concepts:  
      - *Option 1*: Frame as **negative externality in welfare**. When agent \(i\) sells votes or gouges prices, agent \(j\)'s utility from democracy/equity diminishes. But Sandel claims the good’s *meaning* degrades, not just \(j\)'s welfare.  
      - *Option 2*: Model as **endogenous preference formation**. Let utility \(u_i\) depend on the allocation rule \(\Gamma\): e.g., \(u_i(\text{vote-sale}|\Gamma_{\text{monetary}}) < u_i(\text{vote}|\Gamma_{\text{non-monetary}})\).  
    - **Residue**: The core idea—that pricing *reconstitutes the good*—has no counterpart. Mechanism design treats goods as fixed primitives; Sandel treats them as socially contingent. Distorting this into preference shifts *preserves behavior but not the moral claim*.

  ### **2. Sandel's "Crowding Out" as Allocation-Preference Interaction**  
  - **Claim**: Monetary incentives displace intrinsic motivations (e.g., selling votes reduces civic duty; surge pricing erodes solidarity).  
  - **Translation Attempt**:  
    - **Clean Match**: **Negative allocative externality**. If agent \(i\) pays for votes/supplies, agent \(j\)'s intrinsic motivation to donate/vote honestly diminishes. This fits standard externality models.  
    - **Distortion**: **Violating preference independence**. Crowding out requires \(u_j(\mathbf{x})\) to depend directly on the allocation rule \(\Gamma\) (e.g., \(u_j\) drops if \(\Gamma\) allows vote sales). Standard design assumes \(u_j(\mathbf{x})\) is defined over outcomes \(\mathbf{x}\), not rules.  
    - **Residue**: Sandel’s "motivational displacement" is partially capturable as an externality. However, the deeper claim—that monetization *destroys the normative category* (e.g., "duty" becomes "commodity")—lacks a formal object. Mechanism design reduces all welfare effects to utility changes; it cannot model *ontological shifts* in goods.

  ### **3. Roth's Repugnance Constraint as Boundary Condition**  
  - **Claim**: Repugnance (e.g., against vote-selling or price-gouging) is a cultural constraint that shrinks the feasible set of allocations.  
  - **Translation**: **Clean Match**. Repugnance is a **hard constraint** \(\mathcal{F}' \subset \mathcal{F}\) on feasible allocations, like legal or physical limits. Mechanism design then optimizes over \(\mathcal{F}'\). No distortion needed—Roth’s view is native to design.  

  ---

  ### **Residue Analysis: The Untranslatable Core**  
  - **Sandel’s Corruption Thesis**:  
    - *Residue*: The idea that pricing "corrupts" a good’s essence cannot be expressed without:  
      - (a) Treating goods as functions of the mechanism (\(\Gamma \rightarrow \text{good}^\prime \ne \text{good}\)), violating *good invariance*.  
      - (b) Smuggling moral assumptions into primitives (e.g., defining "vote" as inherently non-fungible).  
    - *Diagnosis*: This reflects a **genuine limitation** of mechanism design. It lacks tools to model *semantic change*—only behavior and utilities are formalized. Sandel’s claim is less "indeterminate" than *non-behavioral*; it targets conceptual, not empirical, shifts.  

  - **Vote-Selling’s Democratic Legitimacy**:  
    - **Problem**: Representing votes without "collapsing legitimacy into transferable utility."  
      - *Clean Approach*: Define vote-selling as an **infeasible allocation** (per Roth).  
      - *Distortion*: If votes *are* modeled as transferable:  
        - Legitimacy loss becomes a **negative externality** (e.g., reduced utility from perceived democratic decay).  
        - But this *presupposes* votes *can* be alienated—contradicting Sandel’s core argument.  
      - **Residue**: Mechanism design cannot separate "legitimacy" from utility. Either democracy is a constraint (Roth), or legitimacy effects are utilities (distorting Sandel).  

  - **Crowding Out & Preference Independence**:  
    - Capturing Sandel *fully* requires letting \(\Gamma\) directly alter \(u_i\). This **breaks standard design’s independence axiom**. The residue is **methodological**: mechanism design prioritizes predictive precision over moral psychology.  

  ---

  ### **Conclusion: Residue as Signal**  
  - **Roth’s Thesis**: Translates perfectly—repugnance is a feasibility constraint \(\mathcal{F}'\).  
  - **Sandel’s Thesis**:  
    - *Crowding out*: Partially translatable as externalities, but preference-dependence on \(\Gamma\) is a distortion.  
    - *Corruption of meaning*: **No clean translation**. The residue reveals mechanism design’s **inability to formalize social ontology**. This is not indeterminacy but a **category gap**: design studies *allocations*, not *hermeneutics*.  
  - **Implication**: Sandel’s critique exposes that mechanism design’s vocabulary *presumes commodifiability*. To model "corruption" without distortion, the field would need to formalize goods as **mechanism-dependent symbols**—a paradigm shift beyond current tools.
