answer: |-
  ### Classroom Activity: Constructing Arrow's Impossibility  
  **Bottom Line:** The group will hit a cyclical ranking (e.g., Open Access > Licensed Access, Licensed Access > Tiered Access, Tiered Access > Open Access) in Profile 2, proving no fair aggregation method satisfies all constraints.  

  #### **Setup**  
  - **Mechanisms:** Open Access (O), Licensed Access (L), Tiered Access (T).  
  - **Constraints (secretly assigned):**  
    - Student 1–3: "If everyone prefers A > B, final ranking must have A > B." *(Unanimity)*  
    - Student 4–6: "Ranking of A vs B can’t change if C is added/removed." *(IIA)*  
    - Student 7–8: "No one person dictates A vs B for the group." *(No Dictator)*  

  #### **Preference Profiles & Aggregation**  
  Students aggregate rankings via **pairwise majority votes** (e.g., vote O vs L, then O vs T, then L vs T) and record group rankings.  

  1. **Profile 1 (Unanimity Test):**  
     - *Preferences:* All 8 students rank: **O > L > T**.  
     - *Aggregation:* Vote O vs L (O wins 8-0), O vs T (O wins 8-0), L vs T (L wins 8-0).  
     - *Group Ranking:* **O > L > T** (satisfies all constraints).  

  2. **Profile 2 (Cycle Emerges):**  
     - *Preferences:*  
       - 3 students: **O > L > T**  
       - 3 students: **L > T > O**  
       - 2 students: **T > O > L**  
     - *Aggregation:*  
       - O vs L: O wins 5-3 (3+2 > 3).  
       - L vs T: L wins 6-2 (3+3 > 2).  
       - O vs T: T wins 5-3 (3+2 > 3).  
     - *Group Ranking:* **O > L, L > T, T > O** → **Cycle!** (No transitive order possible. Students must record the pairwise outcomes, revealing inconsistency.)  

  3. **Profile 3 (Dictator Risk):**  
     - *Preferences:*  
       - 4 students: **L > O > T**  
       - 4 students: **T > L > O**  
     - *Aggregation:*  
       - O vs L: Tie 4-4 → *Deadlock* (Unanimity forces no action; IIA forbids using T to break tie).  
       - L vs T: Tie 4-4 → *Deadlock*.  
       - O vs T: Tie 4-4 → *Deadlock*.  
     - *Resolution Attempt:* Students realize breaking any tie requires letting one person decide (violating "no dictator") or ignoring unanimity/IIA.  

  #### **Debrief (10–15 min)**  
  1. **Reveal the Deadlocks:**  
     - Profile 2’s cycle proves intransitivity.  
     - Profile 3’s ties force a choice: appoint a tie-breaker (dictator) or leave outcomes undefined (violating rationality).  

  2. **Map to Arrow’s Theorem:**  
     - **Constraint (i) = Unanimity:** Violated if group ignores unanimous preferences.  
     - **Constraint (ii) = IIA:** Violated if O vs L ranking changes when T is considered (e.g., in Profile 2, T’s presence created a cycle).  
     - **Constraint (iii) = No Dictator:** Violated if one student resolves Profile 3’s ties.  

  3. **Arrow’s Insight:**  
     - No voting system satisfies all three constraints for *every possible preference profile*.  
     - The cycle (Profile 2) and dictator risk (Profile 3) are unavoidable in some cases.  

  4. **Limitation of the Activity:**  
     - **Universal Quantification:** We tested specific profiles, but Arrow’s theorem applies to *all conceivable preferences* (infinite profiles). Physical setups can’t replicate this—we only saw "symptoms" of the proof.  

  **Conclusion:** Collective decision-making requires trade-offs; no "perfect" system exists under these constraints.
