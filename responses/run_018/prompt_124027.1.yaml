  ## Neuro-Distributed Continuity Clinic (NDCC)
  **Patient Information Leaflet: Elective Bilocated Consciousness Separation Procedure (Model D-78)**

  **Ref: NDCC/PIL/EBSP/78.1**  
  **Issue Date: 01/04/2024**  
  **Review Date: 01/04/2025**

  ---

  **1. Introduction**
  This leaflet provides essential information for patients considering Elective Bilocated Consciousness Separation (EBCS), modelled on the D-78 protocol. This procedure involves the surgical relocation of your cerebral substrate (the "Neural Core") to a secure, life-sustaining vat facility, whilst establishing remote telemetric control over a designated ambulatory unit ("AU", colloquially "the Walker"). It is crucial you understand the administrative protocols governing your continuity status post-procedure *before* providing consent. **Please read carefully.** If you have questions, direct them to your Pre-Procedure Counsellor during your scheduled sessions.

  **2. Pre-Operative Counselling (Mandatory Schedule C Sessions)**
  *   **2.1:** You will undergo a minimum of three (3) Counselling Sessions. These sessions focus less on surgical risk (minimal, involving standard anaesthetic protocols and vat sterility maintenance) and more on *ontological acclimatisation*.
  *   **2.2:** Counsellors will guide you through simulated scenarios of neural-body signal latency and catastrophic communication failure ("Decoupling Events"). You will practise declaring your perceived locus of consciousness ("Vat-Side" or "Walker-Side") using the standard NDCC Declaration Form NDCC-F7b.
  *   **2.3:** **Primary Beneficiary Designation Form (PBDF):** **This is mandatory.** During Session 2, you will complete Form NDCC-PBDF/1. This form requires you to designate, *in advance of any ambiguity*, where legal and social identity responsibilities reside during periods of confirmed location ambiguity (e.g., Decoupling Events exceeding 15 seconds).
      *   **2.3.1:** Options include: Identity anchored solely to the Neural Core ("Vat-Primary"); Identity anchored solely to the Ambulatory Unit ("Walker-Primary"); or Identity suspended in an administrative escrow account managed by the NDCC Continuity Tribunal ("Escrow Status").
      *   **2.3.2:** Designations cover: Inheritance rights and testamentary execution; Spousal/Partner obligations and privileges; Criminal liability and civil suit responsibility; Taxation domicile; Eligibility for voting and state benefits; Responsibility for outstanding parking fines and library book returns.
  *   **2.4:** Your completed PBDF will be reviewed by the **Continuity Tribunal** (a statutory body convened quarterly). The Tribunal assesses the form for logical consistency and may request clarification via NDCC Form CT-Q1 ("Query on Beneficiary Designation Intent"). **The Tribunal's adjudication is final.** You will receive Form CT-R1 ("Continuity Ruling") detailing where your legal/social identity defaults during ambiguity.

  **3. During Dislocation (The Procedure)**
  *   **3.1:** The Neural Core extraction and AU linkage procedure is performed under general anaesthetic at our main facility. Your original biological body ("OB") is humanely decommissioned following established bio-ethical protocols (Section 7, NDCC Operating Framework).
  *   **3.2:** Upon regaining consciousness, you will experience a mandatory 72-hour calibration period within the vat environment. Telemetric control of the AU is initiated gradually under supervision. Initial disorientation regarding your perceived location is common and documented on Form NDCC-O1 ("Post-Dislocation Orientation Log").

  **4. Post-Operative Identity Verification & Continuity Management**
  *   **4.1:** **Continuous Location Logging:** The NDCC Telemetry Hub constantly monitors signal integrity between Neural Core and AU. Your declared perceived location (via implanted declaratory micro-switch, activated by conscious intent) is logged against the telemetry data.
  *   **4.2:** **Standard Operation:** When telemetry is optimal (>99.8% signal integrity) *and* your declared location matches the active AU, you are considered "Coherently Located". Legal/social identity follows your PBDF designation (Vat-Primary or Walker-Primary) for this state.
  *   **4.3:** **Decoupling Event Protocol:**
      *   **4.3.1:** Signal drop below 99.8% integrity triggers an Amber Alert. You have 15 seconds to file a Declaration (Form NDCC-F7b via neural interface) confirming your perceived locus.
      *   **4.3.2:** If no Declaration is filed within 15 seconds, OR if Declaration conflicts with primary telemetry data concerning AU operability, a Red Alert is declared.
      *   **4.3.3:** **Red Alert Status:** Your Continuity Status immediately defaults to the ruling on your PBDF as per Continuity Tribunal Form CT-R1 (Vat-Primary, Walker-Primary, or Escrow). NDCC Continuity Officers will attempt re-establishment protocols. During Escrow, all legal/social identity matters are suspended; bills will not be paid, spousal arguments are inadmissible, and you cannot be arrested or inherit. A fee applies for Escrow administration (see Schedule of Charges, NDCC-FIN/1).
  *   **4.4:** **Identity Verification Checks:** Random Identity Verification Checks (IVCs) may be conducted by NDCC staff. You will be required to confirm your current Continuity Status and Declared Location. Failure to respond coherently may trigger an Escrow review.

  **5. A Note on Holiday Closures & Administrative Limbo**
  *   **5.1:** The NDCC main facility and Continuity Tribunal operate standard NHS administrative hours, excluding Bank Holidays and the period between Christmas Day and New Year's Day (inclusive).
  *   **5.2:** **Crucially:** Should a Decoupling Event resulting in Red Alert/Ambiguity occur immediately prior to or during a closure period, the default Continuity Status (per your CT-R1) remains in effect **until the next working day** when the Tribunal or relevant officers can convene.
  *   **5.3:** Re-integration protocols following a closure-period ambiguity event may experience delays due to administrative backlog. Patients are advised that prolonged Escrow Status during holiday periods may impact utility payments, scheduled appointments (dental, etc.), and the timely resolution of marital disputes. Plan accordingly. NDCC shall not be held liable for consequences arising from identity suspension during scheduled closures.

  **6. Important Considerations**
  *   EBCS is an elective procedure. You may withdraw consent up to 48 hours pre-operation.
  *   The NDCC accepts no liability for existential distress, ontological confusion, or philosophical disagreements arising from the procedure or the inherent ambiguities managed by our protocols.
  *   Whilst the AU is robust, standard wear and tear applies. Cosmetic damage is not covered under the NHS. Vat integrity is guaranteed.
  *   Always carry your NDCC Continuity Status Card (issued post-procedure) and Tribunal Ruling Summary (CT-R1S). Inform your GP and dentist of your status.

  **For further information or to report a Decoupling Event:**  
  Contact the NDCC Helpline: 0800 000 0078 (Operational Mon-Fri, 9am-5pm, excluding Bank Holidays. Voicemail monitored during Red Alerts only).  
  **In an existential emergency:** Please file Form NDCC-F7b and await protocol activation. Response times may vary.

  ---
  **Remember:** Your continuity is our protocol. A smooth bilocated existence relies on clear designation and timely form submission. The NDCC: Managing the Logistics of Location since 1978.
