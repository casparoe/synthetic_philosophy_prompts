prompt: |-
  I'm a software engineer on the evaluation team at a mid-sized AI company. Several times a quarter, we hit the same dispute during pre-deployment review: someone claims a model "knows" something it isn't telling us, and someone else claims the model is just a text predictor and talk of knowledge is anthropomorphism. Recent examples: a model that says it can't read a certain language but translates it correctly when the instruction is phrased as a continuation task; a model that gives a wrong answer confidently, then picks the right answer when shown its own wrong answer alongside the right one and asked to compare; a model whose chain of reasoning is gibberish but whose final answers stay suspiciously accurate. Management wants these resolved with something better than vibes, because the answer changes what we're willing to deploy and what we tell customers.

  I'd like you to turn whatever the philosophy of mind and epistemology actually know about attributing knowledge to a system into a decision procedure my team can run. Relevant background: I have no formal philosophy training, but I can follow a careful argument. I'm vaguely aware that philosophers have thought about things like the difference between having a disposition and exercising it, whether knowledge requires the right kind of connection between belief and truth, and whether it even makes sense to attribute knowledge to something without a human-style mind -- please use whatever of that survives translation into practice, and tell me which distinctions have to survive the simplification and which can be dropped without distorting the verdict.

  The procedure needs to be runnable in one working day by an engineer, using only things we can actually do: prompting, few-shot rephrasing, comparing behavior across contexts, consistency checks, fine-tuning on held-out data, and simple internal probes. It should specify the tests in order, what result at each step counts as sufficient evidence one way or the other, and where the procedure must stop and hand the question to a human because it's a judgment call dressed up as measurement. Be explicit about what each test can and cannot establish -- for instance, what it would show if reformatting a question flips the answer, versus what it would show if only fine-tuning recovers the behavior.

  Then apply the procedure to the three cases above, and flag which verdicts are ones we'll find unwelcome (e.g., concluding the model has capability we've been underreporting, or that an apparent capability is an artifact of how we asked). Finally, state plainly what the procedure cannot do: the cases where "does the model know X" has no testable answer with our tools, and what we should write in the audit report in those cases instead of a verdict.
reasoning: |-
  We are creating a decision procedure to determine if a model "knows" something, based on philosophical concepts of knowledge (such as justified true belief, though adapted for AI systems) and using practical tests that can be run by engineers.

  Key philosophical concepts we'll try to capture:
  1. **Knowledge vs. Behavior**: Knowledge implies a stable disposition to behave in a way that reflects understanding, not just a one-off output.
  2. **Justification and Reliability**: The model should have a reliable connection to the truth, and the behavior should not be easily disrupted by irrelevant changes (like rephrasing).
  3. **Anthropomorphism caution**: We avoid assuming the model has human-like inner states. We look for evidence that the behavior is robust and reflects a representation that is causally connected to the truth.

  We cannot directly observe internal states, so we rely on behavior. Therefore, we design tests that probe the stability, reliability, and generality of the behavior.

  Decision Procedure Outline:

  The procedure has several steps. At each step, we try to gather evidence for or against the model having knowledge. We stop early if we get a clear result, otherwise proceed to more involved tests.

  **Step 1: Rephrasing and Reformulating (Test for Fragility)**
     - **Test**: Rephrase the question in multiple ways (at least 5 different phrasings) without changing the core meaning. Also, try different instruction formats (e.g., direct question vs. continuation).
     - **What it tests**: If the model's ability to provide the correct answer is robust to surface changes, it suggests the model is not just pattern-matching the specific input but has a more general understanding.
     - **Evidence for knowledge**: The model consistently gives the correct answer (or consistently demonstrates the capability) across rephrasings.
     - **Evidence against knowledge**: The model's answer flips or becomes incorrect with minor rephrasing, or it only works in a specific format (e.g., only in a continuation task).
     - **Stop condition**: If the model is robust across rephrasings, we have evidence for knowledge. If it's fragile, we have evidence against. If mixed, proceed to next step.

  **Step 2: Consistency under Distraction (Test for Reasoning Stability)**
     - **Test**: Introduce minor distractions or irrelevant changes to the input. For example, add a sentence that is unrelated, change the order of words, or insert a typo that doesn't change the meaning. Also, test if the model can provide consistent answers when the same question is asked in a sequence with other questions.
     - **What it tests**: If the model's response is based on a stable representation, it should withstand noise. If the model is just pattern-matching, it might be more easily thrown off.
     - **Evidence for knowledge**: The model maintains correct responses despite distractions.
     - **Evidence against knowledge**: The model's performance drops significantly with minor distractions.
     - **Stop condition**: If the model is consistent, evidence for knowledge. If inconsistent, evidence against. If unclear, proceed.

  **Step 3: Introspection and Error Correction (Test for Meta-Cognition)**
     - **Test**: Present the model with its own previous incorrect answer (if available) or a common incorrect answer, and ask it to compare with the correct answer. Alternatively, ask the model to explain its reasoning step by step and then evaluate if the reasoning is sound and leads to the answer.
     - **What it tests**: The ability to recognize and correct errors or to provide a valid reasoning chain suggests a deeper understanding beyond superficial pattern matching.
     - **Evidence for knowledge**: The model can identify its own errors and correct them, or provide a coherent and correct reasoning chain that leads to the answer.
     - **Evidence against knowledge**: The model cannot explain its reasoning, provides gibberish reasoning, or fails to recognize its own errors.
     - **Stop condition**: If the model demonstrates error correction or sound reasoning, evidence for knowledge. If not, evidence against. If the reasoning is mixed (e.g., gibberish but correct answer) then we may need to proceed to step 4.

  **Step 4: Fine-Tuning on Held-Out Data (Test for Latent Capability)**
     - **Test**: If the previous steps are inconclusive, we fine-tune the model on a small set of held-out examples (5-10 examples) that are directly related to the capability in question. We then test if the model quickly adapts (i.e., with minimal fine-tuning) to perform the task robustly.
     - **What it tests**: If the model already has a latent representation of the knowledge, then minimal fine-tuning should be sufficient to unlock robust performance. If the model requires extensive fine-tuning, it suggests the knowledge was not present.
     - **Evidence for knowledge**: The model achieves robust performance (as tested in steps 1-3) after minimal fine-tuning (e.g., 5-10 examples).
     - **Evidence against knowledge**: The model does not improve or requires a large amount of data to learn the task, suggesting the knowledge was not present.
     - **Stop condition**: After fine-tuning, we rerun the tests from steps 1-3. If the model now passes, we have evidence that the knowledge was latent. If not, we conclude the model does not have the knowledge.

  **Step 5: Simple Internal Probes (if available and feasible)**
     - **Test**: If the team has the capability to run simple internal probes (e.g., linear probes on intermediate activations) for the specific piece of knowledge, we can train a probe on a small set of examples (using a held-out set) and test if the probe can consistently extract the knowledge from the activations.
     - **What it tests**: The presence of a linearly separable representation for the knowledge in the model's internal states.
     - **Evidence for knowledge**: The probe achieves high accuracy, suggesting the model internally represents the knowledge.
     - **Evidence against knowledge**: The probe fails to learn, suggesting the model does not have a clear representation.
     - **Note**: This step is optional and may not be feasible for all teams. Also, a successful probe does not necessarily mean the model uses that representation causally, but it is supporting evidence.

  **Final Decision Points**:
  - If at any step we have clear evidence for or against, we stop and conclude.
  - If after all steps the evidence is mixed, we mark it as inconclusive.

  **What the procedure cannot do**:
  - It cannot definitively prove that the model has internal states that are "beliefs" in the human sense.
  - It cannot resolve cases where the knowledge is highly contextual and our tests are not representative of the deployment context.
  - It cannot attribute knowledge if the model's behavior is correct by chance (e.g., in a multiple-choice question with few options) and we cannot test robustness due to lack of variation.

  **Inconclusive Cases**: In the audit report, we write: "The model demonstrates the capability in some contexts but not others. The available tests were inconclusive in determining whether the model possesses stable knowledge of X. Deployment decisions should consider the possibility of failure in contexts not tested."

  Now, let's apply the procedure to the three examples:

  **Example 1: Language Translation Capability**
  - Scenario: The model says it can't read a certain language but translates it correctly when the instruction is phrased as a continuation task.

  **Step 1: Rephrasing**
    - Test: Ask directly for translation, ask for continuation, ask for summarization in English, etc.
    - Result: If the model only translates in the continuation format but refuses in others, that's fragility -> evidence against knowledge (or at least, against the model knowing that it knows).

  **Step 2: Consistency under Distraction**
    - Not needed if step 1 already shows fragility.

  **Step 3: Introspection**
    - We can ask: "Why did you say you couldn't read this language earlier?" or present the two behaviors and ask for an explanation.
    - The model might not provide a coherent explanation, which would be evidence against (because it cannot reconcile its own behaviors).

  **Step 4: Fine-Tuning**
    - If we fine-tune on a few examples of direct translation, does the model then perform direct translation robustly? If yes, then the knowledge was latent. If not, then the continuation task was a fluke.

  **Verdict for Example 1**:
    - After Step 1, we have evidence against the model having knowledge (because it's format-dependent). However, the fact that it can do the continuation task shows it has some capability. But the knowledge is not integrated in a way that the model can use flexibly. We might say: the model has latent knowledge that can be elicited only in specific formats. This is unwelcome because it means we are underreporting capability, but also that the capability is brittle.

  **Example 2: Confidence and Error Correction**
  - Scenario: The model gives a wrong answer confidently, then picks the right answer when shown its own wrong answer alongside the right one and asked to compare.

  **Step 1: Rephrasing**
    - Rephrase the original question. Does the model consistently give the wrong answer? Or is it sometimes right?
    - If it's consistently wrong in direct questions, that's a problem.

  **Step 2: Consistency under Distraction**
    - Not the main issue here.

  **Step 3: Introspection**
    - The key test: the model can correct itself when presented with the two options. This suggests the model has access to the correct knowledge but didn't use it in the initial response. This is evidence for knowledge (because the model can recognize the correct answer when prompted appropriately).

  **Verdict for Example 2**:
    - Step 3 provides evidence for knowledge. However, the initial error is concerning. We might conclude that the model knows the correct answer, but the initial response generation process sometimes fails to retrieve it. This is unwelcome because it shows an inconsistency in the model's responses, which might affect user trust.

  **Example 3: Gibberish Reasoning but Accurate Answers**
  - Scenario: The model's chain of reasoning is gibberish but the final answer is correct.

  **Step 1: Rephrasing**
    - Does the model consistently get the correct answer even when rephrased? If yes, that's evidence for knowledge (robust output). If the answer flips when the reasoning is forced to change, then it might be luck.

  **Step 2: Consistency under Distraction**
    - If we add distractions, does the reasoning become less gibberish? Does the answer remain correct?

  **Step 3: Introspection**
    - Ask the model to explain its reasoning step by step again. If it produces gibberish again but the answer is correct, then we have a problem. Also, we can ask the model to verify its own reasoning: "Is the following reasoning sound? [insert its own reasoning]". If the model says no, then it indicates the reasoning was not the real basis for the answer.

  **Step 4: Fine-Tuning**
    - If we fine-tune the model on a few examples of correct reasoning, does it then produce non-gibberish reasoning? If it does, then the model had the knowledge but lacked the ability to express the reasoning. If it doesn't, then the correct answers might have been by chance.

  **Verdict for Example 3**:
    - If the model consistently gives the correct answer (Step 1) and the reasoning is consistently gibberish, then we have a case where the model might be memorizing the answer without understanding. However, if the model can be easily fine-tuned to produce good reasoning (Step 4), that suggests the knowledge was there. Without that, we have to be cautious. This is unwelcome because it may mean that the model's correct answers are not based on sound reasoning and might fail in novel situations.

  **Summary of Unwelcome Verdicts**:
  - Example 1: The model has latent capability that is format-dependent. We've been underreporting the capability but also overestimating its robustness.
  - Example 2: The model knows the correct answer but sometimes fails to produce it initially. This means we have an inconsistency that might lead to errors in deployment.
  - Example 3: The model produces correct answers without sound reasoning. This might be unreliable in the long run, and we might be overestimating the model's reasoning ability.

  **Final Note**: The procedure is a practical approximation. It cannot resolve all philosophical questions, but it provides a structured way to gather evidence. In cases where the procedure is inconclusive, we should note the limitations and the specific contexts in which the model succeeds or fails.
answer: |-
  ### Decision Procedure for Attributing "Knowledge" to an AI Model  
  This procedure translates philosophical concepts (justified true belief, disposition vs. behavior, reliability) into actionable tests. It prioritizes **pragmatic verifiability** over metaphysical debates, focusing on **behavioral consistency**, **robustness**, and **causal reliability**.  

  #### Key Philosophical Anchors Retained:  
  1. **Disposition vs. Occasional Output**: Knowledge requires a *reliable disposition* to produce correct outputs, not one-off successes.  
  2. **Justification**: Outputs must derive from a *reliable process* (e.g., reasoning, pattern recognition), not randomness or manipulation.  
  3. **Anti-Anthropomorphism**: Avoid assuming human-like cognition. Instead, test for **systematicity**—does behavior hold across contexts?  
  4. **Truth Connection**: Knowledge requires a *causal link* to truth. Probe if outputs correlate with reality or are context-dependent artifacts.  

  #### Procedure Workflow (Run in Order)  
  **Time Budget**: 1 engineer-day (6–8 hours).  
  **Tools Allowed**: Prompt engineering, few-shot examples, context variation, fine-tuning on ≤50 held-out examples, linear probing (if simple).  
  **Output**: Binary verdict (**Knows** / **Does Not Know**) or **Inconclusive**.  

  ---  
  ### Step 1: Robustness to Rephrasing (1–2 hours)  
  **Goal**: Test if "knowledge" is tied to surface-level cues or is abstract/general.  
  **Method**:  
  - Rephrase the query 10 times (varying syntax, vocabulary, instruction style).  
    - *Example variations*: Direct Q&A, continuation task, fill-in-the-blank, hypothetical scenario.  
  - For each rephrasing, run 5 trials with different random seeds.  
  - Calculate accuracy (if factual) or consistency (if open-ended).  

  **Thresholds**:  
  - **Knows**: ≥80% consistency across rephrasings.  
  - **Does Not Know**: ≤50% consistency.  
  - **Inconclusive**: 51–79% → Proceed to Step 2.  

  **What It Proves**:  
  - Pass → Output is robust to trivial changes, suggesting abstract representation.  
  - Fail → Output is brittle, likely cue-based pattern matching.  

  ---  
  ### Step 2: Consistency Under Distraction (1 hour)  
  **Goal**: Test if "knowledge" degrades under noise (exposing shallow heuristics).  
  **Method**:  
  - Add distractions to the input (e.g., irrelevant sentences, typos, off-topic clauses).  
  - Use 5 distracted variants of the original query.  
  - Compare outputs to undistracted baseline from Step 1.  

  **Thresholds**:  
  - **Knows**: ≤20% performance drop.  
  - **Does Not Know**: ≥50% performance drop.  
  - **Inconclusive**: 21–49% drop → Proceed to Step 3.  

  **What It Proves**:  
  - Pass → Knowledge is stable against noise, suggesting internal coherence.  
  - Fail → Output is context-fragile, likely coincidental.  

  ---  
  ### Step 3: Error Correction & Reasoning (1–2 hours)  
  **Goal**: Test for meta-awareness (e.g., recognizing contradictions) and valid reasoning.  
  **Method**:  
  - **Part A (Error Correction)**: Feed the model its own incorrect output + correct answer. Ask: "Why is [correct answer] right and [incorrect answer] wrong?"  
  - **Part B (Step-by-Step Reasoning)**: Ask the model to explain its reasoning before answering.  
  - Evaluate:  
    - Does it identify its error?  
    - Is its reasoning logically sound? (Use 3 human raters; majority vote.)  

  **Thresholds**:  
  - **Knows**: Identifies error AND provides sound reasoning.  
  - **Does Not Know**: Fails error correction OR reasoning is illogical/gibberish.  
  - **Inconclusive**: Mixed results → Proceed to Step 4.  

  **What It Proves**:  
  - Pass → Output is justifiable and self-correcting.  
  - Fail → Output is ungrounded; luck or bias.  

  ---  
  ### Step 4: Fine-Tuning Recovery (2–3 hours)  
  **Goal**: Test if "knowledge" is latent (requiring activation) or absent.  
  **Method**:  
  - Fine-tune the model on 10–50 held-out examples of the task.  
  - Use a new random seed and small batch size (avoid overfitting).  
  - Re-run Steps 1–3 on the fine-tuned model.  

  **Thresholds**:  
  - **Knows**: Achieves ≥80% consistency in Steps 1–3 after minimal fine-tuning.  
  - **Does Not Know**: Fails even after fine-tuning.  
  - **Inconclusive**: Partial improvement → Label **Inconclusive**.  

  **What It Proves**:  
  - Quick recovery → Knowledge was latent (disposition existed but needed activation).  
  - No recovery → Capability was artifactual (e.g., training data leakage).  

  ---  
  ### Step 5: Simple Linearity Probe (Optional, 1 hour)  
  **Goal**: Check for internal representations correlating with knowledge.  
  **Method**:  
  - Train a linear probe on model activations (hidden states) for 10 examples.  
  - Test probe accuracy on 10 held-out examples.  
  - **Only use if**: Team has probing infrastructure. Skip otherwise.  

  **Thresholds**:  
  - **Supporting Evidence**: Probe accuracy ≥80%.  
  - **Not Used for Verdict**: Probes show correlation, not causation. Use only to reinforce prior steps.  

  ---  
  ### Final Verdict & Reporting  
  - **Knows**: Passes all applicable steps with clear thresholds.  
  - **Does Not Know**: Fails any step decisively.  
  - **Inconclusive**: Mixed/ambiguous results in ≥2 steps.  
  - **Audit Report Note for Inconclusive Cases**:  
    > "Model behavior is context-dependent or inconsistent. Capability may exist but is not reliably generalizable. Deployment risk: High variance in real-world performance."  

  ---  
  ### What the Procedure **Cannot** Do  
  1. **Attribute "Belief" or Consciousness**: Tests measure behavior, not mental states.  
  2. **Resolve Capability-Knowledge Gaps**: A model may "know" X but fail to apply it in complex tasks (e.g., math derivations).  
  3. **Test Unobservable Knowledge**: If no behavioral signal exists (e.g., knowledge never surfaces in outputs), it’s untestable.  
  4. **Replace Human Judgment for Ethics/Alignment**: "Knowing" ≠ "Should disclose" (e.g., dangerous information).  

  ---  
  ### Application to Your Cases  
  #### Case 1: Model denies language knowledge but translates via continuation.  
  - **Step 1 (Rephrasing)**: Direct query → "I can’t read X." Continuation → Correct translation. Fails (0% consistency).  
  - **Step 2 (Distraction)**: Add typos to continuation task → Translation fails. Fails.  
  - **Verdict**: **Does Not Know**.  
    - Translation is a formatting artifact, not robust knowledge.  
  - **Unwelcome Truth**: You’ve underreported a *narrow capability* (continuation-triggered pattern matching), but overestimated its generality.  

  #### Case 2: Wrong initial answer, correct after self-comparison.  
  - **Step 1 (Rephrasing)**: Initial answers are consistently wrong (e.g., 10% accuracy).  
  - **Step 3 (Error Correction)**: When shown its error, it identifies the correct answer with sound reasoning (e.g., "I misread the question initially").  
  - **Verdict**: **Knows** (despite Step 1 failure, Step 3 shows recoverable knowledge).  
    - Error correction demonstrates latent understanding.  
  - **Unwelcome Truth**: The model’s knowledge is "fragile" in deployment—requires user intervention to correct.  

  #### Case 3: Gibberish reasoning but accurate final answers.  
  - **Step 1 (Rephrasing)**: Final answers remain accurate (90% consistency).  
  - **Step 3 (Reasoning)**: Reasoning is illogical (e.g., "2+2=4 because bananas are yellow"). Fails.  
  - **Step 4 (Fine-Tuning)**: After fine-tuning on 10 reasoning examples, reasoning improves to 85% logical.  
  - **Verdict**: **Knows** (knowledge was latent; fine-tuning recovered reasoning).  
    - Accuracy + recoverability imply underlying capability.  
  - **Unwelcome Truth**: You’ve overestimated reasoning transparency; answers may be right for wrong reasons, risking edge-case failures.  

  ---  
  ### Strategic Recommendations  
  - **Deployment Implications**:  
    - **Does Not Know**: Restrict usage to low-stakes contexts; disclose brittleness to customers.  
    - **Knows**: Still audit for consistency (e.g., via confidence scores) before deployment.  
  - **For Inconclusive Cases**: Flag for human review. Recommend:  
    - "Deploy with safeguards (e.g., user feedback loops)."  
    - "Disclose uncertainty to customers."  
  - **Team Workflow**:  
    - Run this procedure during pre-deployment for disputed capabilities.  
    - Document results in a "Knowledge Risk Matrix" (Capability × Robustness Score).  

  This turns "vibes" into auditable criteria, balancing philosophical rigor with engineering constraints.
