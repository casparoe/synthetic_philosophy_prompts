  Within the market's logic, unconfined.
  They see no wall, no bright dividing line,
  Just price revealing choice, a common sign,
  For wealth buys voice, the poor lose rightful say.
  But is the vote like bread, a thing to hold?
  Or is its worth beyond what can be told?
  This separability, both sides uphold.
  The stalemate spins where neither will concede,
  One sees corruption, one sees freed-up need,
  When votes are sold, shared status turns to gold.
  The arguments repeat, their circle tight,
  One speaks of theft, the other claims a right,
