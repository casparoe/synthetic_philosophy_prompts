  Refrain 1 (corruption): "When votes are sold, shared status turns to gold" (captures transformation of citizenship to asset)
  Refrain 2 (distributive): "For wealth buys voice, the poor lose rightful say" (shows economic→political conversion)

  Then build the separability argument in other lines, using words like "spheres," "divide," "domain" to contrast civic/market norms. The final couplet should clash the refrains abruptly: 

  "When votes are sold, shared status turns to gold
