prompt: |-
  I'm running a two-hour workshop for philosophy graduate students with strong analytic training but virtually no exposure to classical Indian philosophy. The goal is to have them understand Jain anekāntavāda—specifically syādvāda and the seven-fold predication (saptabhaṅgī)—not as a vague "Eastern relativism" but as a rigorous logical doctrine about the necessary partiality of every predication. Plan the explanatory arc: first, identify the precise conceptual dependency, so that I know which idea must be firmly in place before syādvāda can be introduced without being heard as mere epistemic modesty, and why nayavāda has to come before or after saptabhaṅgī depending on that order. Second, choose one carrying example drawn from their own conceptual neighborhood—ideally institutional ontology or artifact kind-membership, not the blind-men-and-elephant parable—specifying exactly what the example must have (multiple non-contradictory respects of evaluation) and what it must lack (any hidden "real essence" that resolves the multiplicity). Third, map the misconceptions in the order they will arise: initially that this is just cultural relativism; then that it is a form of dialetheism accepting true contradictions; then that the modal qualifier syāt ("perhaps," "in some respect") is a speaker-confidence hedge rather than a logical operator. For each, state the point in the sequence where it should be defused and the specific conceptual distinction that blocks it. Fourth, design a brief check for understanding that reveals whether they have grasped the logical structure of nayavāda—how standpoints are partial without being subjective—rather than whether they have merely adopted a tolerant pluralist attitude. Finally, state explicitly what should be left out at this level—the metaphysics of jīva and ajīva, the ethical derivation of ahiṃsā, or the full technical apparatus of Jain syllogistic logic—and justify the omission in terms of the audience's preparatory needs. Do not provide a reading list or bibliography.
reasoning: |-
  Okay, the user is a philosophy instructor planning a workshop on Jain logic for analytic grad students with no background in Indian philosophy. They need a tightly structured explanatory arc that avoids common misconceptions. 

  Hmm... the core challenge is making anekāntavāda feel rigorous rather than "exotic" to this audience. Analytic philosophers will immediately test it against dialetheism or epistemic contextualism unless preempted. 

  First conceptual dependency: They must see necessity of partiality before modal qualifiers. If I start with syādvāda's "in some respect," these students will dismiss it as trivial hedging. Need to first establish that partiality is ontological—not just about our limited knowledge. That's why nayavāda (standpoints) must scaffold saptabhaṅgī (predication). 

  For the carrying example... institutional ontology is perfect. Take "Is this blockchain token a security?"—SEC says yes, crypto-anarchists say no, both correct under different regulatory frameworks. No Platonic "security-ness" resolves it. Bonus: lawyers actually use standpoint-like analysis here. 

  Misconception sequence: 
  1. Relativism: Defuse when introducing nayavāda by stressing standpoints aren't subjective but constitutive. Distinction: relativity to conditions vs. relativity to believers. 
  2. Dialetheism: Crush during saptabhaṅgī's 7th step. Stress "non-assertible" ≠ "both true" but "indeterminable under current standpoint." 
  3. Syāt as hedge: Preempt by formalizing it as a parametric operator early on. Contrast with epistemic modals like "probably." 

  The understanding check... must force application. Have them dissect a tenure case: "Professor X is productive" (research standpoint) vs. "unproductive" (teaching standpoint). If they call it "perspectivism," they missed the ontological claim. 

  What to omit: Jīva/ajīva metaphysics—irrelevant to logic. Ahiṃsā derivation—distracting. Jain syllogistics—too technical. Justification: Goal is transferable tools for analytic ontology, not comprehensive survey. 

  ...Wait, did I address all five requirements? *scrolling up* Conceptual dependency—check. Example—check. Misconceptions—check. Nayavāda test—check. Omissions—check. Good.
answer: |-
  Here’s a structured plan for your workshop, designed to meet your specifications:

  ---

  ### **Explanatory Arc & Conceptual Dependencies**
  **Core Sequence:**  
  1. **Start with ontology of complexity** → 2. **Introduce *nayavāda* (standpoint epistemology)** → 3. **Derive *syādvāda* (conditional predication)** → 4. **Map to *saptabhaṅgī* (7-fold schema)**  

  **Why this order?**  
  - **Dependency 1:** Students must first grasp that objects *ontologically* possess infinite attributes (*anekānta*). Without this, *syādvāda* collapses into epistemic humility ("we can't know everything").  
  - **Dependency 2:** *Nayavāda* must precede *saptabhaṅgī* because standpoints (*naya*) define the "respects" (*paryāya*) that structure the 7 predications. *Saptabhaṅgī* is the formal logic of *nayavāda*.  

  ---

  ### **Carrying Example: University "Tenure"**  
  **Why it works:**  
  - **Multiple non-contradictory respects:** "Professor X is tenured" is:  
    - (a) *True* under legal-contractual respect (signed document).  
    - (b) *False* under sociological respect (peers reject her work).  
    - (c) *Conditional* under ethical respect (if "tenure" implies moral authority).  
  - **Lacks "real essence":** No Platonic "tenure-ness" resolves the contradictions—meanings are institutionally constituted.  

  **Workshop Application:**  
  - Use this to demonstrate *nayavāda*: Each respect is a *naya* (standpoint) capturing a partial truth.  
  - Transition to *syādvāda*: "In some respect (*syāt*), Professor X is tenured" is *necessarily* qualified.  

  ---

  ### **Misconceptions & Defusal Sequence**  
  1. **"This is cultural relativism"**  
     - **Arises when:** Introducing *anekāntavāda* as "multiple perspectives."  
     - **Defuse during *nayavāda*:** Distinguish *standpoint-relativity* (truth is respect-dependent) from *subject-relativity* (truth depends on believers). Stress: Standpoints are objective frameworks (e.g., legal vs. scientific), not opinions.  

  2. **"Jains accept true contradictions (dialetheism)"**  
     - **Arises when:** Presenting *saptabhaṅgī*’s 3rd/4th steps (e.g., "maybe it is and isn’t").  
     - **Defuse during *saptabhaṅgī* analysis:** Contrast with dialetheism:  
       - Jainism: *No single standpoint* asserts P ∧ ¬P; contradictions dissolve across respects.  
       - Dialetheism: P ∧ ¬P *in the same respect*.  

  3. **"*Syāt* is a confidence hedge"**  
     - **Arises when:** Translating *syāt* as "perhaps."  
     - **Defuse immediately after introducing *syādvāda*:** Redefine *syāt* as a *parametric operator*:  
       - "In respect R, P" (e.g., "*syāt*-tenured" ≡ "tenured-in-legal-framework").  
       - Contrast with epistemic modals ("probably P") by showing *syāt* references objective conditions.  

  ---

  ### **Check for Understanding: *Nayavāda***  
  **Prompt:** *"In the tenure example, is the 'ethical respect' just a subjective opinion? Why can't we combine all respects into one complete truth?"*  

  **Reveals:**  
  - **Grasped:** They’ll note standpoints are *objective* (e.g., ethics is a formal framework) but *partial* (each excludes other attributes). Combining respects is impossible—not epistemically, but because attributes are ontologically distinct.  
  - **Not grasped:** If they appeal to "tolerance" or "aggregating perspectives," they’ve missed the ontological claim.  

  ---

  ### **Omissions & Justifications**  
  1. **Metaphysics of *jīva* (soul) and *ajīva* (non-soul):**  
     - **Omit:** Requires background in *karma* theory and substance ontology.  
     - **Justification:** Distracts from the logical focus; *anekāntavāda* applies to any complex entity, not just sentient ones.  

  2. **Ethical derivation of *ahiṃsā* (non-violence):**  
     - **Omit:** Ethical implications follow from metaphysics but aren’t needed to grasp the logic.  
     - **Justification:** Workshop goal is *logical rigor*, not ethics. Analytic students can derive ethics later once logic is clear.  

  3. **Jain syllogistic logic (e.g., *nikṣepa*):**  
     - **Omit:** Technical apparatus for applying *saptabhaṅgī* to debate.  
     - **Justification:** Overly granular; 7-fold predication is the core takeaway.  

  ---

  ### **Workshop Flow (120 mins)**  
  - **0:00–0:20:** Ontology of complexity (Tenure example → infinite attributes).  
  - **0:20–0:45:** *Nayavāda* (Standpoints as partial truths; defuse relativism).  
  - **0:45–1:15:** *Syādvāda* (Parametric operator *syāt*; defuse "hedge" misconception).  
  - **1:15–1:45:** *Saptabhaṅgī* (Map 7 steps to tenure; defuse dialetheism).  
  - **1:45–2:00:** Check for Understanding + Q&A.  

  This arc ensures *anekāntavāda* is encountered as a *metaphysical logic of predication*, avoiding reductive "relativism" traps. The example grounds it in familiar analytic terrain while meeting all your criteria.
