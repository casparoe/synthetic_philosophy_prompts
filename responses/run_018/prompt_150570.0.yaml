answer: |-
  Below is a decision-tree taxonomy for classifying positions on whether the archivists' ontological dispute is verbal. The tree uses the archive case as its diagnostic scenario and is designed to be answerable from intuitive reasoning about that case, without requiring prior knowledge of philosophical literature. Each branch leads to named positions or marks unoccupied/unnamed options, with explicit "awkward commitments" (the specific cost making the view uncomfortable) for named positions.  

  ### Decision Tree: Is the Dispute About Information Entities Merely Verbal?  
  **Start with Question 1**  

  1. **Is there a *genuine factual disagreement* between the archivists?**  
     - **Yes** (They disagree about how the world *is*, beyond language or concepts).  
       → Proceed to Question 2A.  
     - **No** (The disagreement stems from language/conceptual differences, not facts).  
       → Proceed to Question 2B.  

  ---

  #### **Branch A: Substantive Disagreement (Answer "Yes" to Q1)**  
  **Question 2A: How is the divergence best explained?**  
     - **One party is in *straightforward conceptual error*** (e.g., misapplying concepts like "existence" to reality).  
       → **Leaf: Robust Ontological Realism**  
         *Awkward commitment*: Must accept that one archivist is factually wrong about reality *despite* perfect agreement on all observable evidence, making ontological truth undetectable.  
     - *No other options needed:* All substantive paths converge here (see "Collapsed Paths" below).  

  ---

  #### **Branch B: Verbal Disagreement (Answer "No" to Q1)**  
  **Question 2B: What best explains the verbal nature?**  
     - **Ambiguous terminology** (e.g., "information-bearing entity" or "physical item" is inconsistently defined; clarifying terms would resolve the dispute).  
       → **Leaf: Unnamed/Unoccupied**  
         *Awkward commitment*: Must deny that explicitly defined terms (e.g., "information entity = pattern independent of physical substrate") can *ever* sustain ontological disagreement, reducing metaphysics to semantics.  
     - **Different pragmatic rules for quantifier use** (e.g., both share a concept of "existence" but apply "there exists" differently based on context or usefulness).  
       → **Leaf: Quantifier-Variance Deflationism** (e.g., Hirsch)  
         *Awkward commitment*: Makes existence claims (e.g., "numbers exist") *meaningless* outside conversational context, undermining objectivity.  
     - **Different conceptual frameworks** (e.g., "existence" itself has distinct meanings; one framework counts physical items only, another counts patterns as entities).  
       → **Leaf: Carnap-Style Framework Pluralism**  
         *Awkward commitment*: Reduces "what exists" to a choice of linguistic conventions, making ontology feel trivial or arbitrary.  

  ---

  ### Special Notes  
  1. **Logically Possible but Unoccupied Branch**:  
     - **Path**: "No" to Q1 (verbal) → "One party in conceptual error".  
     - **Diagnosis**: Incoherent. If there is *no factual disagreement*, neither party is "wrong" about reality—they are just talking differently. Calling one "in error" smuggles in substantive disagreement.  

  2. **Collapsed Paths**:  
     - **Robust Realism vs. Eliminativism**: The tree *cannot* separate "robust realism" (both physical items *and* information entities exist) from "conceptual-error eliminativism" (only physical items exist; information talk is erroneous). Both require a "Yes" to Q1 and attribute error to one party. They collapse because:  
       - The archive case lacks observable differences to distinguish them.  
       - Metaontologically, both assert a mind-independent fact of the matter—they only disagree on *which* fact.  
     - **Result**: "Robust Ontological Realism" (Q2A) encompasses both positions.  

  3. **Blurred Distinction**:  
     - **Quantifier variance (Q2B-b)** and **ambiguity (Q2B-a)** may feel similar. Key difference:  
       - Ambiguity: Clarifying definitions *resolves* disagreement.  
       - Quantifier variance: Definitions are clear, but "exists" is used flexibly (e.g., "Do holes exist in doughnuts?").  

  ### Tree Summary  
  ```  
  1. Factual disagreement?  
     ├── Yes → 2A: Error?  
     │         └── Yes → Robust Ontological Realism  
     └── No → 2B: Why verbal?  
               ├── Ambiguous terminology → Unnamed  
               ├── Pragmatic quantifier rules → Quantifier-Variance Deflationism  
               └── Different frameworks → Carnap-Style Pluralism  
  ```  

  This taxonomy isolates core metaontological stances using intuitive branching. It reveals that most positions either inflate ontology beyond evidence (e.g., realism) or deflate it into language/conventions (e.g., Carnap/Hirsch), each with uncomfortable trade-offs. The unoccupied branch and collapsed paths highlight logical constraints in the debate.
