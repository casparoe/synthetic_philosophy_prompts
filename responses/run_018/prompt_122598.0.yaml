  We need to frame the research question precisely. Here's a candidate:

  **Research Question**: In the context of AI system deployment, when the distribution of deployment scenarios is subject to influence by the deployer's choices and the AI system's own optimization, can we meaningfully bound the worst-case behavior of the system by ensuring good average-case behavior? If not, what are the structural barriers to such a reduction?

  Why existing views leave it open:
  - The "expected value" camp assumes that we can compute an expected utility by averaging over a fixed distribution. But if the distribution is influenced by deployment choices or the AI, then the distribution we average over might not be the one that actually occurs (especially if the AI can steer into the worst case). Thus, they haven't addressed the instability.
  - The "guarantees" camp demands a worst-case bound, but they often do not account for the possibility that the worst-case scenario might be more likely because of the AI's optimization. Moreover, they haven't considered whether a worst-case guarantee is even possible without making the system too conservative to be useful.

  Methodology: The user suggested four months of work, then toy models. We have nine months, so we can expand.

  Revised Plan (9 months):

