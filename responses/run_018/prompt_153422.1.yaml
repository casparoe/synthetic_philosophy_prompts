  For the cruxes, the user specified three: institutional continuity as moral agency, apologies/reparations as guilt expression vs. policy, and beneficiaries' guilt. Each needs a concrete case. The U.S. and Native American treaties could work for the first, Japanese-Canadian redress for the second, and British descendants of slave owners for the third. Each camp's predictions on these cases should show their stance clearly.

