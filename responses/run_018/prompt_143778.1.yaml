prompt: |-
  hey im in this social epistemology seminar and weve been going deep on frickers idea of testimonial injustice. i also do peer mediation for dorm conflicts about 6 hours a week, filing reports after each session, so i actually need to apply this stuff repeatedly not just write essays. can you turn testimonial injustice into a reusable checklist or decision tree i can run in like 15 minutes befor i submit a form? it should have ordered steps with yes/no gates, clearly mark where im using judgment instead of rules, and bake in that hermeneutical gap thing my prof calls preemptive hermeneutical exclusion — where the listener doesnt even have the vocabulary to recognize the harm. i need three worked cases: one clear gender-based credibility dismissal, one personality clash where the checklist still flags injustice even though i personally think its wrong (the false positive), and one where the harm is hermeneutical not testimonial. also be honest about where the procedure misfires and what kinds of harm it will never catch. no citations or reading lists please, i dont have the books on me and this is for my job.
reasoning: |-
  Okay, the user is in a social epistemology seminar focusing on Fricker's testimonial injustice and also works as a peer mediator for dorm conflicts. They need a practical, reusable checklist or decision tree to apply before submitting their reports. The key requirements are: a tool that takes about 15 minutes, includes ordered steps with yes/no gates, marks where judgment is needed, incorporates hermeneutical exclusion, and has three worked cases. They also want honesty about limitations.

  First, I need to recall the core concepts of testimonial injustice. It's when a speaker's credibility is unfairly downgraded due to prejudice. Hermeneutical injustice involves a gap in collective understanding, making it hard for someone to articulate their experience. The user specifically mentioned "preemptive hermeneutical exclusion," which is when the listener lacks the vocabulary to recognize the harm. That's crucial to include in the checklist.

  The user needs this for real-world application, not just essays. So the checklist must be actionable. Since they handle dorm conflicts, examples should be relatable to that setting. They want three cases: gender-based credibility dismissal, a false positive where the checklist flags but they disagree, and a hermeneutical harm case. Also, they want the tool to acknowledge its own limitations.

  Breaking down the checklist structure. Ordered steps with yes/no gates will make it efficient. I'll start with gathering facts, then move to credibility assessment. Need to include prompts where judgment is required, like identifying identity prejudices. For hermeneutical exclusion, a step to check if there's an unexplained disconnect or lack of vocabulary.

  For the worked cases:  
  1. Gender-based: Clear case where a woman's report is dismissed as emotional.  
  2. False positive: Personality clash where the checklist flags due to cultural stereotypes, even if the mediator thinks it's not injustice.  
  3. Hermeneutical harm: A situation where the harm isn't about credibility but the inability to articulate an experience, like microaggressions related to socioeconomic status.  

  Limitations are important. The checklist might miss subtle biases, hermeneutical gaps it can't detect, systemic issues beyond individual interactions, or when the mediator's own biases blind them. Also, it's reactive, not preventive.  

  I should ensure the checklist is concise, uses plain language, and fits within 15 minutes. Steps should logically flow: after mediation, review facts, then assess credibility issues, check for hermeneutical exclusion, and finally, document using specific language.  

  The user emphasized no citations, so avoid academic references. Focus on practicality. Also, their role as a mediator means the tool must aid in fair reporting, not just theoretical understanding. They might have deeper needs: reducing liability for the dorm, ensuring their reports are ethically sound, or personal growth in applying theory to practice. The checklist should empower them to spot injustices they might overlook, especially subtle ones.  

  Testing the checklist with the cases to ensure it flags correctly. For the false positive, the cultural stereotype might trigger a flag even if the mediator thinks it's just personality. That shows the checklist's sensitivity, which is useful for reflection. Hermeneutical case should highlight when the harm isn't spoken but felt, requiring the mediator to note the gap.  

  Finally, stress that the checklist is a tool, not infallible. Encourage reflection and consultation when unsure. This addresses the user's need for a reliable yet humble approach in their mediation work.
answer: |-
  Here's a **Testimonial Injustice (TI) & Hermeneutical Exclusion (HE) Pre-Submission Checklist**, designed for speed and practicality in mediation reporting:

  ---

  ### **The 15-Minute Credibility & Hermeneutics Review**
  *(Run this AFTER mediation, BEFORE submitting your report)*

  **CORE QUESTION:** *Could credibility assessment or interpretive gaps have distorted how testimony was received?*

  | STEP                                      | YES/NO GATE                                                                 | JUDGMENT ZONE                                                                 | ACTION IF "YES"                                                                 |
  | :---------------------------------------- | :-------------------------------------------------------------------------- | :---------------------------------------------------------------------------- | :------------------------------------------------------------------------------ |
  | **1. Fact Check:**                        | Did all parties get to state core facts without interruption?               | *N/A (Objective)*                                                             | Flag interruptions in report. Revisit notes for missing facts.                  |
  | **2. Credibility Markers:**               | Did any party visibly react to another's testimony (eye roll, sigh, laugh)? | *What emotion/attitude did the reaction signal? (Disbelief? Contempt?)*       | Note specific reactions + target in report. **→ Proceed to Step 3.**            |
  | **3. Identity Prejudice Scan:**           | Could a party's social identity (gender, race, major, etc.) unconsciously lower their credibility? | *Which identity? Is prejudice likely? (Don't over-apply!)* | **→ Proceed to Step 4.**                                                       |
  | **4. Credibility Dismissal Evidence:**    | Was testimony rejected with weak reasoning? ("overreacting," "dramatic," "confused")? | *Was the reason vague, emotional, or stereotypical?*                         | Quote the dismissal language in report. **→ STRONG TI RISK**                    |
  | **5. Hermeneutical Gap (Preemptive):**    | Did a party struggle to articulate harm? Did their description feel "off" or incomplete? | *Is there a systemic power gap? (e.g., class, neurodivergence, culture)* | Note: "Party X expressed frustration but lacked vocabulary for harm." **→ HE FLAG** |
  | **6. Mediator's Gut Check:**              | Did *I* feel skeptical toward a party's account despite evidence?           | *Why? Could my bias be at play? (Be brutally honest)*                         | Consult a trusted peer *before* finalizing report. **→ POTENTIAL TI/HE BLIND SPOT** |
  | **7. Harm Labeling:**                     | Did parties/mediators label the harm? (e.g., "disrespected," "ignored")     | *Does the label fit the experience described? Is it too narrow?*              | If mismatch, note the gap in report: "Harm described as __ but may reflect __." |

  ---

  ### **Worked Cases**

  **Case 1: Clear Gender-Based Credibility Dismissal (TI)**  
  *Scenario:* Woman (A) says male neighbor (B) plays loud music after quiet hours. B dismisses: "She's just hormonal from midterms."  
  *Checklist Run:*  
  - Step 1: YES (A stated facts).  
  - Step 2: YES (B laughed during A's testimony).  
  - Step 3: YES (Gender likely factor).  
  - Step 4: YES ("hormonal" = gendered dismissal).  
  - Step 5: NO (A articulated harm clearly).  
  *Report Action:* **Flag TI:** "B attributed A's complaint to emotionality ('hormonal') despite factual basis."

  **Case 2: Personality Clash "False Positive"**  
  *Scenario:* International student (C) accuses teammate (D) of "not listening." D (abrupt personality) says C is "too sensitive." *You think D is just rude, not prejudiced.*  
  *Checklist Run:*  
  - Step 1: YES.  
  - Step 2: YES (D sighed during C's statements).  
  - Step 3: **JUDGMENT** (Culture clash? Possible, but D is rude to everyone).  
  - Step 4: YES ("too sensitive" dismisses C's experience).  
  - Step 5: NO (C articulated harm).  
  *Report Action:* **Flag potential TI:** "D dismissed C's concern as oversensitivity. Cultural communication differences may be a factor." *(Checklist forces you to name the dismissal pattern even if you assess intent as non-prejudiced.)*

  **Case 3: Hermeneutical Harm (HE, Not TI)**  
  *Scenario:* First-gen student (E) feels "uncomfortable" when roommate (F) talks about expensive vacations. E can't explain why. F is confused.  
  *Checklist Run:*  
  - Step 1: YES.  
  - Step 2: NO (No overt reactions).  
  - Step 3: YES (Socioeconomic status gap).  
  - Step 4: NO (No testimony dismissed).  
  - Step 5: **YES** (E can't articulate harm; "uncomfortable" feels insufficient).  
  *Report Action:* **Flag HE:** "E expressed discomfort around discussions of wealth disparity but lacked vocabulary to articulate specific harm. Unresolved tension noted."

  ---

  ### **Where This Tool Fails (Be Honest)**

  1. **Subtle Biases:** Misses micro-aggressions masked as "jokes" or tone-based dismissals if not recorded.  
  2. **Hermeneutical Gaps You Share:** If *you* lack the framework (e.g., not recognizing ableist structures), you won't flag the gap.  
  3. **Systemic Issues:** Can't capture injustice embedded in policies (e.g., dorm rules that disadvantage international students).  
  4. **Mediator Blind Spots:** If your judgment in Steps 3/6 is compromised by your own bias, the tool won't self-correct.  
  5. **Non-Testimony Harm:** Silent exclusion, environmental microaggressions, or institutional neglect won't trigger this.  
  6. **"Reverse" Injustice:** Rare cases where privilege *inflates* credibility (e.g., believing a wealthy student over a janitor) aren't directly covered.  

  **Critical Reminder:** This is a **structural awareness tool**, not a truth machine. It forces you to pause and interrogate credibility dynamics *before* your report legitimizes one narrative. When in doubt at a Judgment Zone, **write descriptively** ("D called C 'too sensitive' after C described feeling ignored") rather than interpretively ("D was dismissive"). Submit on time — perfection isn't possible.
