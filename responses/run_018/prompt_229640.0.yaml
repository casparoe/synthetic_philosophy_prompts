answer: |-
  Below is a practical, step-by-step decision procedure for pest control approvals, designed to balance insect welfare with human needs. It uses a tiered evidence approach to avoid "paralysis by uncertainty," includes a harm/benefit framework, and specifies when to escalate. The procedure should take <60 minutes per case using publicly available resources (e.g., IUCN reports, university entomology databases). 

  ### **Decision Procedure: Insect Intervention Protocol**
  **Required Inputs per Case**:  
  - Target insect species/group  
  - Estimated number affected  
  - Intervention method (e.g., spraying, baiting)  
  - Justification (e.g., disease risk, public nuisance)  
  - Proposed alternatives (if any)  

  ---

  #### **Step 1: Evidence for Sentience Assessment**  
  *Time: 10 min | Use free databases (e.g., Animal Sentience Institute, IUCN invertebrate reports)*  
  - **Score** (1–5) based on neurobiological/behavioral evidence:  
    - `5` = **Strong evidence** (e.g., honeybees: self-awareness studies, opioid response)  
    - `4` = **Moderate evidence** (e.g., ants/wasps: social learning, aversive behaviors)  
    - `3` = **Ambiguous/untested** (e.g., mosquitoes: nociception exists but no complex cognition)  
    - `2` = **Limited evidence against** (e.g., springtails: no brain, reflexive only)  
    - `1` = **Strong evidence against** (e.g., aphids: no pain receptors)  
  - **Default for unknown groups**: Assign `3` but apply a **sentience discount factor (SDF) of 0.5×** to harm calculations (Step 3).  
  - **Output**: Sentience score (S) and SDF multiplier (1.0 for S=3–5; 0.5 for S=1–2).  

  #### **Step 2: Harm Scale Estimation**  
  *Time: 15 min | Use historical data, pest company estimates*  
  - **Calculate projected deaths**:  
    - `Low` = <100 individuals  
    - `Medium` = 100–10,000  
    - `High` = >10,000  
  - **Adjust for suffering duration**:  
    - Fast kill (<1 min): ×1.0 multiplier (e.g., gassing)  
    - Slow kill (>1 min): ×2.0 multiplier (e.g., baiting)  
  - **Final harm score (H)**: `Projected deaths × Suffering multiplier × SDF`  

  #### **Step 3: Necessity Justification**  
  *Time: 10 min | Use CDC, county health data*  
  - **Score** (1–5) based on urgency and alternatives:  
    - `5` = Immediate threat (e.g., active disease vector, life-threatening allergies)  
    - `4` = High risk (e.g., disease detected in area, playground hazard)  
    - `3` = Moderate nuisance (e.g., frequent complaints, minor economic loss)  
    - `2` = Mild inconvenience (e.g., aesthetic issue, no safety risk)  
    - `1` = Purely preemptive (no current problem)  
  - **Output**: Necessity score (N)  

  #### **Step 4: Alternative Assessment**  
  *Time: 15 min | Consult NPIC, Xerces Society guidelines*  
  - **Options in descending priority**:  
    - A: **Non-lethal** (e.g., relocation, repellents, habitat modification)  
    - B: **Reduced-lethal** (e.g., targeted application, faster kill)  
    - C: **Standard lethal** (e.g., broad-spectrum spraying)  
  - **Feasibility check**:  
    - Cost increase >20%? Staff time >2×? If yes, flag for escalation.  

  #### **Step 5: Decision Matrix**  
  *Time: 5 min*  
  Use the **Harm-Necessity Ratio (HNR)**: `H ÷ N`  
  - **Approve if**:  
    - HNR ≤ 10 **OR**  
    - Necessity = 5 **OR**  
    - Alternative = A/B with HNR ≤ 50  
  - **Reject if**:  
    - HNR > 50 **OR**  
    - Necessity ≤ 2 AND Harm ≥ Medium  
  - **Escalate to parks board if**:  
    - HNR = 10–50 **OR**  
    - High cost (>$1k) **OR**  
    - Sentience = 3 (unknown) AND Harm = High  

  #### **Step 6: Documentation & Conditions**  
  - **Approvals**: Require least-harm method (e.g., if Alternative B exists, mandate it).  
  - **Rejections**: Provide public explanation toolkit (e.g., "Non-lethal options prioritized per new insect welfare guidelines").  
  - **Escalations**: Chair must rule within 5 days.  

  ---

  ### **Case Evaluations**  
  #### **Case 1: Aerial Spraying for Mosquitoes (West Nile Detected)**  
  - **Sentience (S)**: Mosquitoes = `3` (ambiguous). SDF = `0.5×` (default for unknowns).  
  - **Harm (H)**: High (>100,000 deaths) × Slow kill (×2.0) × SDF (0.5) = **10,000** (equivalent harm units).  
  - **Necessity (N)**: `5` (active disease vector).  
  - **Alternatives**: None (larvicides ineffective for adults; traps insufficient).  
  - **HNR**: 10,000 ÷ 5 = **2,000**  
  - **Decision**: **Approve** (HNR ≤10? No, but Necessity=5 overrides).  
  - **Why**: Imminent health risk outweighs uncertain sentience.  

  #### **Case 2: Baiting Ant Hills by Picnic Area**  
  - **Sentience (S)**: Ants = `4` (moderate evidence). SDF = `1.0×`.  
  - **Harm (H)**: Medium (~5,000 ants) × Slow kill (×2.0) × SDF (1.0) = **10,000**.  
  - **Necessity (N)**: `2` (mild inconvenience; no safety risk).  
  - **Alternatives**: A (non-lethal) available—e.g., cinnamon barriers, relocate colonies.  
  - **HNR**: 10,000 ÷ 2 = **5,000**  
  - **Decision**: **Reject** (HNR >50 AND Alternative A exists).  
  - **Why you won’t like it**: Public may see this as "overprotecting pests," but the procedure prioritizes non-lethal options for low-necessity cases. High sentience + slow kill creates unacceptable harm for a trivial problem.  

  #### **Case 3: Destroying Wasp Nest in Play Equipment**  
  - **Sentience (S)**: Wasps = `4` (moderate evidence). SDF = `1.0×`.  
  - **Harm (H)**: Low (~200 wasps) × Fast kill (×1.0) = **200**.  
  - **Necessity (N)**: `4` (high safety risk: playground, allergy potential).  
  - **Alternatives**: B (reduced-lethal) available—e.g., nighttime removal (faster, targets only nest).  
  - **HNR**: 200 ÷ 4 = **50**  
  - **Decision**: **Approve conditionally** (mandate Alternative B: nighttime removal).  
  - **Why**: Necessity high, harm low. Fast-kill method reduces suffering.  

  ---

  ### **Key Features**  
  - **Non-Crazy Default**: "We don’t know" (S=3) doesn’t mean "do nothing"—it triggers SDF to avoid overestimation.  
  - **Escalation Clarity**: Breaks gridlock by sending ambiguous/high-cost cases to the board.  
  - **Public Unpopularity Handling**: Case 2 (ants) rejects baiting, but the procedure provides a defensible rationale: *"Non-lethal alternatives exist for a low-necessity problem involving animals with moderate sentience evidence."*  
  - **Limitation**: Won’t resolve philosophical debates but converts ethics into actionable math.  

