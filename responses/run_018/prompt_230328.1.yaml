prompt: |-
  For a graduate seminar on the foundations of game theory, please write the desiderata: what must an account of common knowledge of rationality get right before it earns its place in the foundations? I am asking for a specification, not a survey, and certainly not a reading list.

  State the purpose first. The account should be adequate for explaining how rational agents coordinate, or fail to coordinate, under shared and private information, and for underpinning solution concepts such as equilibrium and backward induction. Then give the full requirements list, each with the case or consideration that motivates it. At minimum, address the following.

  1. Hierarchical structure. Common knowledge is not simply everyone knowing p; it is everyone knowing p, everyone knowing that everyone knows p, and so on without bound. Why can an adequate theory not collapse this hierarchy into first-level mutual knowledge, and what would be lost if it did?

  2. Publicity versus shared private information. A public announcement of p generates common knowledge of p; merely correlated or overlapping private observations do not. The theory must explain this difference and say why it matters for conventions, coordinated action, and coordination failure.

  3. Fragility and approximate common knowledge. Consider two commanders who must attack at the same time but can communicate only by messengers that may fail to arrive. Each additional message can confirm an earlier one, yet the infinite chain needed for common knowledge of the plan is never secured. The theory must handle this case and explain why making message loss arbitrarily unlikely is not the same as eliminating it.

  4. Modal distinctions. The theory must separate knowledge from belief, certainty from high probability, and common knowledge from common belief or common certainty, and it must say which of these the assumption of rationality actually requires.

  5. Content of the rationality assumption. The account must specify what it means for rationality to be common knowledge: whether it requires common knowledge of a unique prior, of utility functions, of the structure of the game, and of the solution concept, or whether some weaker epistemic condition suffices for the results people typically invoke.

  6. Constraints from results. The theory must be consistent with, or reproduce, the result that two agents who begin with a common prior and whose probability assignments become common knowledge cannot rationally disagree; and it must say what happens when the common-prior condition is dropped or weakened.

  Then mark each requirement as non-negotiable or as a preference of a particular camp, and identify the requirement or pair of requirements that does the most work in excluding candidate accounts. I want special attention to apparent conflicts. For instance, the demand that common knowledge be attainable by actual agents communicating through fallible channels appears to conflict with the hierarchical and fragility requirements; and the demand that common knowledge of rationality underwrite backward induction appears to conflict with the need to respect off-path beliefs. Say whether these conflicts are real or merely apparent, and whether resolving them requires an idealization that quietly forfeits one of the desiderata. Finally, close with a brief scorecard of the main contender frameworks — the syntactic approach via multi-agent modal logic, the semantic approach via partitions over a state space, and the type-space approach that represents the infinite hierarchy of beliefs explicitly — against the list. Keep the scorecard brief; the criteria and their conflicts are where the thinking belongs.
reasoning: |-
  We are building desiderata for an account of common knowledge of rationality (CKR) to serve as a foundation for game theory. The purpose is to explain rational coordination (and failure) under shared and private information, and to underpin solution concepts (equilibrium, backward induction). The requirements:

  1. **Hierarchical structure (non-negotiable)**  
     *Motivation*: In the coordinated attack problem (also known as the email game), if we collapse the hierarchy to mutual knowledge of finite depth, then coordination can fail even when the depth is arbitrarily large. Only common knowledge (infinite depth) guarantees coordination in such settings. Without the hierarchy, we lose the ability to explain why public events (like a public announcement) lead to coordination while private information might not, even if the private information is widely shared. What is lost: the foundation for coordination in simultaneous-move games and for the justification of equilibrium concepts (which rely on the infinite regress of beliefs).

  2. **Publicity versus shared private information (non-negotiable)**  
     *Motivation*: Consider the difference between a public announcement of a fact (which creates common knowledge) and each agent receiving a private message about the same fact (even if the messages are identical and perfectly correlated). In the latter, without a public channel, agents might not be able to coordinate because each might doubt whether the others received their messages. This matters because many coordination conventions (like driving on the right) rely on public observability. The theory must account for why publicity enables coordination and why shared private information might not. This is critical for explaining coordination failures (like in the email game) and successes.

  3. **Fragility and approximate common knowledge (non-negotiable)**  
     *Motivation*: The coordinated attack problem again: two generals can only communicate by messengers that may get lost. Even after many messages, they do not attain common knowledge of the attack plan because the chain is finite. However, if the probability of message loss is low, they can achieve "almost common knowledge" and attack with high probability. But the theory must explain why making the loss arbitrarily small does not substitute for common knowledge: because without common knowledge, there is always a non-zero probability of coordination failure. The theory must handle this fragility and the role of approximation without collapsing the hierarchy.

  4. **Modal distinctions (non-negotiable)**  
     *Motivation*: The theory must separate knowledge (which is factive) from belief (which can be false), and common knowledge from common belief. For example, in backward induction, if we assume common knowledge of rationality, we get the backward induction solution. But if we only have common belief (even with very high probability), then in some games (like the centipede game) players might rationally deviate because they assign positive probability to irrationality. Similarly, the assumption of rationality in game theory often requires knowledge (so that if a player is rational, it is true) and common knowledge of that. However, in some contexts (like Bayesian games) we might work with common belief in rationality. The theory must clarify which is required and when.

  5. **Content of the rationality assumption (non-negotiable)**  
     *Motivation*: What exactly is common knowledge when we say "common knowledge of rationality"? Does it include common knowledge of the game structure, the players' utility functions, a common prior, and the solution concept? Or can we get by with less? For example, in the context of Nash equilibrium, we require that players have common knowledge of rationality, the game structure, and a common prior. But for correlated equilibrium, we might relax some of these. The theory must specify the minimal epistemic conditions for the solution concepts it aims to underpin. This is critical because over-strong assumptions limit applicability.

  6. **Constraints from results (non-negotiable)**  
     *Motivation*: The theory must account for the Aumann (1976) agreement theorem: if two agents have a common prior and their posterior probabilities for an event are common knowledge, then these posteriors must be equal. This implies that rational agents cannot agree to disagree. The theory must be consistent with this and also explain what happens when the common prior is dropped (then disagreement becomes possible) or weakened (e.g., common knowledge of differences in priors). This constraint is fundamental to the epistemic program in game theory.

  **Conflicts and Tensions**:

  - The requirement of **hierarchy** and **fragility** seems to conflict with the desire for **attainability** by real agents (who cannot process infinite hierarchies and communicate over fallible channels). This conflict is real. Resolution: We must accept that common knowledge is an idealization. In practice, we use approximations (like common belief with high probability) for many applications. But the idealization is necessary for the foundations because it sets the benchmark and explains why approximation sometimes fails arbitrarily.

  - The requirement that **common knowledge of rationality must underpin backward induction** (so that players always play the backward induction solution) appears to conflict with the **need to respect off-path beliefs**. In extensive-form games, if we assume common knowledge of rationality, then at every node the player must believe that the opponents will play rationally in the future. But if an off-path node is reached, then it contradicts the common knowledge of rationality (since a rational player would not have taken the action leading to that node). This is the paradox of backward induction (e.g., in the centipede game).  
     *Resolution*: The conflict is real and has led to two main approaches:  
     (i) **Epistemic counterfactuals**: We allow for beliefs about what would happen off the equilibrium path, even if those paths are inconsistent with common knowledge of rationality. This requires a theory of counterfactual beliefs (like in Battigalli and Siniscalchi's work).  
     (ii) **Weakening the rationality assumption**: Instead of common knowledge of rationality, we use common belief in rationality (with a bounded depth) which can break down at off-path nodes.  
     The tension shows that common knowledge of rationality might be too strong for extensive-form games and we need a dynamic theory of belief revision.

  **Which requirement does the most work in excluding candidate accounts?**  
  The combination of **hierarchy** and **fragility** is particularly challenging. Accounts that try to collapse the hierarchy (e.g., by using fixed points) must still account for the fact that finite-depth mutual knowledge does not suffice for coordination (as in the email game). Similarly, accounts that ignore fragility (by assuming common knowledge is easily attained) fail to explain real-world coordination failures. The type-space approach (which explicitly builds the infinite hierarchy) can handle hierarchy but struggles with fragility because it is a static representation. The syntactic approach (using modal logic) also requires the infinite hierarchy and does not naturally incorporate probability. The semantic (partition) approach handles publicity well but struggles with shared private information and approximation.

  **Scorecard of frameworks**:

  - **Syntactic approach (multi-agent modal logic)**:  
     - Handles hierarchy well (via the fixed-point definition: common knowledge as the fixed point of the "everyone knows" operator).  
     - Struggles with publicity vs. shared private information because it is abstract and does not model the information structure explicitly.  
     - Fragility: not designed for probabilistic approximation.  
     - Modal distinctions: naturally separates knowledge and belief.  
     - Content: can express the rationality assumption syntactically but does not provide a direct link to the structure of the game.  
     - Constraints: can express the agreement theorem but without probabilities it is limited.

  - **Semantic approach (partitions over state space)**:  
     - Hierarchy: common knowledge is defined as the meet of partitions (an infinite regress captured by a set of states).  
     - Publicity vs shared private: naturally handles public events (they refine the partition to a common coarsening) but shared private information does not necessarily create common knowledge unless it is public.  
     - Fragility: the static state-space does not model the dynamics of communication and approximation is not built-in.  
     - Modal distinctions: can model knowledge and belief (if extended with plausibility orders).  
     - Content: can encode the game structure and rationality conditions in events.  
     - Constraints: the agreement theorem was proved in this framework.  
     *Overall*: Strong on publicity and the agreement theorem, weak on fragility and approximation.

  - **Type-space approach (Harsanyi, Mertens-Zamir)**:  
     - Hierarchy: represents the infinite hierarchy of beliefs explicitly (each type specifies a belief over the state and others' types).  
     - Publicity vs shared private: can model both by appropriately defining the type spaces.  
     - Fragility: can incorporate probabilistic beliefs and approximate common knowledge (via ε-common knowledge).  
     - Modal distinctions: naturally incorporates beliefs (with probabilities) but knowledge is harder (unless we impose truth).  
     - Content: can encode rationality and common priors as part of the type space.  
     - Constraints: the agreement theorem holds if we have a common prior.  
     *Overall*: The most flexible and expressive, but complex.

  **Conclusion**: The type-space approach does best overall because it handles hierarchy, shared private information, and approximation. However, it is abstract and complex. The partition approach is elegant for publicity and common knowledge but less flexible for other requirements. The syntactic approach is foundational but less applied.

  **Final note**: All requirements are non-negotiable for a foundational account. The main tension is between the idealization of common knowledge (required for the hierarchy and the agreement theorem) and the practical unattainability in finite, fallible systems (fragility). This tension is resolved by noting that foundations require idealization, but applications can use approximations. The conflict in backward induction requires a dynamic extension of the theory (e.g., incorporating belief revision).
answer: |-
  ### Desiderata for an Account of Common Knowledge of Rationality in Game Theory Foundations  
  **Purpose**: The account must underpin rational coordination (or failure) under shared/private information and support solution concepts (e.g., equilibrium, backward induction) by providing a rigorous epistemic basis.  

  #### Requirements List  
  1. **Hierarchical Structure** (Non-negotiable)  
     - **Motivation**: Collapsing common knowledge to finite-depth mutual knowledge (e.g., "everyone knows \(p\)" to depth \(k\)) fails in coordination problems like the *Email Game*. Here, finite mutual knowledge permits coordination failure even for large \(k\), whereas common knowledge (infinite depth) guarantees coordination. Loss of hierarchy undermines justification for equilibrium play (e.g., Nash equilibrium requires players to best-respond to beliefs infinitely reflected in others' beliefs).  

  2. **Publicity vs. Shared Private Information** (Non-negotiable)  
     - **Motivation**: Public announcements (e.g., a traffic light) generate common knowledge, enabling conventions like driving norms. Shared private signals (e.g., correlated private emails about a meeting) do not, as agents doubt others' awareness (e.g., *Lewis’s conventions* fail without publicity). The theory must explain why publicity enables robust coordination (e.g., Schelling points) while private information risks miscoordination (e.g., speculative attacks in finance).  

  3. **Fragility and Approximate Common Knowledge** (Non-negotiable)  
     - **Motivation**: In the *Coordinated Attack Problem*, messengers may fail, preventing common knowledge of the attack plan. Each message confirms prior messages but never secures the infinite hierarchy. The theory must show why making failure arbitrarily unlikely (\(\epsilon \to 0\)) differs from eliminating it (\(\epsilon = 0\)): with \(\epsilon > 0\), ex-post coordination failure remains possible, and expected payoffs do not converge to the common-knowledge case.  

  4. **Modal Distinctions** (Non-negotiable)  
     - **Motivation**: Knowledge (factive: \(K_i p \implies p\)) vs. belief (\(B_i p\) without truth) matters for robustness. Backward induction fails if rationality is common *belief* (e.g., in the *Centipede Game*, players may cooperate if they assign >0 probability to irrationality). Common *certainty* (probability 1) is insufficient if beliefs are not closed under deduction. The theory must specify that solution concepts require common *knowledge* of rationality (not belief), as knowledge anchors predictions in truth.  

  5. **Content of Rationality Assumption** (Non-negotiable)  
     - **Motivation**: Does "rationality" imply common priors, known utilities, or known game structure? Backward induction requires common knowledge of the game tree and sequential rationality, but Nash equilibrium may only need mutual knowledge of payoffs. The theory must delineate minimal conditions: e.g., for backward induction, common knowledge of the game structure and substantive rationality (maximizing expected utility) suffices; a common prior is unnecessary but required for Bayesian equilibrium.  

  6. **Constraints from Results** (Non-negotiable)  
     - **Motivation**: The account must recover *Aumann’s Agreement Theorem*: with a common prior and common knowledge of posteriors, agents cannot disagree. Without a common prior (e.g., agents have entrenched private beliefs), disagreement is rational. The theory must show how weakening the common prior (e.g., to common knowledge of priors) alters results and enables phenomena like speculative trade.  

  #### Conflicts and Resolution  
  - **Hierarchy + Fragility vs. Attainability**: Real agents cannot process infinite hierarchies or communicate flawlessly. This conflict is **real**. Resolution requires idealization: common knowledge is a limit concept. Approximations (e.g., \(\varepsilon\)-common knowledge) handle practical cases but forfeit exactness (e.g., fragility persists).  
  - **Backward Induction vs. Off-Path Beliefs**: Common knowledge of rationality implies backward induction, but off-path play contradicts rationality. Conflict is **real**. Resolution: Introduce belief revision (e.g., *strong belief in rationality*) that allows rationalization of off-path actions without abandoning the framework, accepting that common knowledge is violated off-path.  

  #### Framework Scorecard  
  - **Syntactic (Modal Logic)**:  
    - ✅ Hierarchy: Explicit via fixed-point operators.  
    - ❌ Publicity/Fragility: Abstract; handles publicity but not probabilistic fragility.  
    - ❓Modal Distinctions: Clear, but probabilistic belief hard to integrate.  
    - ❌ Constraints: Struggles with probabilistic agreement theorems.  
  - **Semantic (Partitions/State-Space)**:  
    - ✅ Hierarchy: Captured by meet of partitions.  
    - ✅ Publicity: Public events refine partitions cleanly.  
    - ❌ Fragility: Static; cannot model message loss dynamically.  
    - ✅ Constraints: Naturally encodes Aumann’s theorem.  
  - **Type Spaces (Infinite Hierarchies)**:  
    - ✅ Hierarchy: Directly represents beliefs to all orders.  
    - ✅ Publicity/Private Info: Flexible (via type mappings).  
    - ✅ Fragility: Handles approximation (\(\epsilon\)-common \(p\)-belief).  
    - ✅ Constraints: Recovers agreement theorems; extends without common priors.  

  **Exclusionary Power**: **Hierarchy + Fragility** excludes accounts that collapse common knowledge to finite depths (e.g., early mutual-knowledge models) or ignore approximation (e.g., naive state-space models). Type spaces excel by satisfying all requirements but at the cost of complexity.  

  **Conclusion**: A viable account must treat common knowledge as an idealization that explains *why* coordination succeeds (publicity/hierarchy) or fails (fragility/private information). Type spaces are the most robust contender, though semantic approaches suffice for publicity-centric contexts. Conflicts are resolved by accepting idealization for foundations while using approximations (e.g., \(p\)-belief) for applied work.
