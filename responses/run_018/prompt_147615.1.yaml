  For the free-floating side, proponents like Derek Parfit or non-naturalists might argue that normative truths exist like mathematical truths. The prescriptive force comes from their objective nature. But the worry is how these can motivate or obligate without any agents. Are they just inert truths?

  The user asks for the strongest arguments. For relationalists: the normativity-action link. Reasons must be able to guide action, which requires agents. Without them, "ought" doesn't make sense. For non-relationalists: the objectivity of value. If something is good, its goodness isn't contingent on agents existing. So residue must be real.

  Then, the user wants to know which relationalist commitment is least costly to drop. Probably the strict actual agent requirement. Moving to possible agents might allow accommodating residue without full free-floating. But that risks blurring the line.

  A key consideration that could change my view: if relational counterfactuals fully capture residue without losing normativity, or if there's a case where normativity fails without any possible agents. For example, a universe with valuable states but no possible agents—does "ought" apply? If not, relationalism holds; if yes, free-floating gains ground.

  My reasoning might fail in assuming that counterfactuals reduce normativity. Maybe they preserve it, or perhaps the debate itself shows a deeper ambiguity in normative language. Also, the motivational aspect: if reasons require the capacity to motivate, but that's a Humean view not all accept. So that's a potential weakness.

