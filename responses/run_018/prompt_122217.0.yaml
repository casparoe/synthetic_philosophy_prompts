  First, I need to map the strongest objections. The self-creation regress is Strawson's core, so any defeater must either (a) show responsibility doesn't require being causa sui, or (b) demonstrate we *can* be causa sui in a non-literal way. The user mentioned three key areas: hierarchical models, narrative identity, and constitutive luck—good starting points. 

  Let me unpack each. Hierarchical models (like Frankfurt) argue you're responsible if your actions align with higher-order desires you endorse. But Strawson would retort: where did those higher-order desires come from? Not from you—so regress continues. Defenders dismiss this as missing the point; it confuses *identification* with *ultimate responsibility*. 

  Narrative reconstruction is trickier. If the self isn't stable (as Dennett suggests), maybe there's no fixed "you" to hold responsible. But this feels like it backfires—episodic selves might make responsibility *more* elusive. Strawsonians likely see this as irrelevant; randomness or fragmentation doesn't create authorship. 

  Constitutive luck is the most interesting. We *do* hold people responsible for innate traits (e.g., blaming a naturally cruel person). Strawson bites the bullet here: yes, it's inconsistent, but folk practices don't negate the logical impossibility. His argument is metaphysical, not anthropological. 

  Ah, and the user suspects Strawson might be unfalsifiable—that's astute. He could always say any proposed "source" of responsibility (genes, environment, randomness) isn't *truly* you. But that's not a flaw; it's the point. The impossibility is conceptual, like squaring a circle. 

  Ranking them: constitutive luck is "awkward" (exposes inconsistency in practice but doesn't touch the logic). Narrative approaches are "weak" (don't solve regress). Hierarchical models are "strong but not fatal" (get traction by shifting what responsibility means). 

