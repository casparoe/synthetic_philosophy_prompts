  I'm a machine learning engineer with a working grasp of calibration, epistemic versus aleatoric uncertainty, proper scoring rules, leakage, and conditional independence, but I've never read the philosophy of probability. Restate the Principal Principle — the claim, associated with David Lewis, that a rational agent's credences should defer to known objective chances — together with the associated puzzles about inadmissible evidence and about chance theories that assign positive probability to futures in which their own chance values turn out to be wrong, in the vocabulary I actually use, as faithfully as you can. Treat credence as something like a predictive distribution I would assign, chance as something like a reference conditional probability model whose stated probabilities I am told, and admissibility as something like the absence of leakage between my extra information and the outcome conditional on that model's stated probability, extending the analogy only as far as it goes without distortion. Then give me a residue report: which parts map cleanly onto calibration and conditional independence, which parts you had to fudge, and which parts have no expression in my vocabulary at all — especially the idea that chance has a distinctive normative authority over belief rather than merely good expected accuracy. I want to know whether what I would naturally call a calibrated forecaster you should defer to is all the philosophers are talking about, or whether my vocabulary is missing something, and why. Write it as continuous prose, like an email or a letter: no headings, bullet points, bold text, or tables.
