  - Identify what the practice strictly requires vs what merely fits
  - Pinpoint where it's philosophically underdetermined
  - Specify what would change if conscious awareness were deemed necessary

  First, the bottom line: The pairing presupposes a compatibilist or two-level theory where pre-conscious processes can constitute "volition" while conscious awareness provides supervisory endorsement. 

  Breaking it down:
  The BCI design logic treats pre-motor signals as authoritative commands - that's non-negotiable for the technology to function. Meanwhile, consent protocols absolutely require conscious understanding - that's legally non-negotiable. 

  The reconciliation happens through hierarchical thinking: 
  - Subpersonal neural dynamics handle motor initiation
  - Personal-level consciousness handles endorsement and responsibility 

  Where it's underdetermined: The practice doesn't specify whether consciousness is causally necessary or just additively significant. It works with either view as long as consciousness has some supervisory role.

  If institutions switched to requiring causal necessity for consciousness:
  1. BCI decoding would need delayed thresholds until after reported urges
  2. Capacity assessments might test neural readiness potentials
  3. Misuse accountability would shift toward engineers over patients

  But crucially, the current framework survives precisely because it avoids committing to consciousness being causally necessary - it just needs consciousness to be involved in the broader volitional process. The user seems particularly sharp for spotting how neuroscience and ethics are awkwardly glued together here.
answer: |-
  The institutional pairing presupposes a two-level hierarchical theory of agency where pre-conscious neural dynamics constitute the causal motor of volitional action, while conscious awareness provides supervisory endorsement that legitimizes those actions within the moral framework of autonomy and responsibility. 

  **Strict Requirements vs. Philosophical Underdeterminacy:**  
  The practice strictly requires:  
  - *For BCI functionality:* Treating pre-report neural signals as authoritative motor commands, accepting they precede conscious urge reports.  
  - *For ethics:* Treating conscious deliberation as essential for valid consent and responsibility attribution.  

  It is philosophically underdetermined on:  
  - Whether consciousness causally contributes to action initiation or merely rationalizes pre-determined neural events.  
  - Whether responsibility attaches to the unconscious neural "decision" or requires conscious ratification.  

  **Reconciliation via Compatibilism:**  
  A hierarchical account resolves the tension:  
  1. **Subpersonal level:** Pre-conscious processes generate motor intentions (treated as "real" volitional causes in BCI decoding).  
  2. **Personal level:** Conscious awareness endorses, modifies, or vetoes intentions, enabling:  
     - *Autonomy:* Consent requires conscious integration of motives and consequences.  
     - *Responsibility:* Accountability hinges on the agent's conscious identification with the action.  
  BCI commands are "authoritative" not as final moral choices, but as proto-volitions subject to conscious oversight—consistent with Libet’s model where consciousness can abort pre-initiated acts.  

  **Changes if Consciousness Were Causally Necessary:**  
  If trials required conscious awareness as a *sine qua non* of agency:  
  1. **Design:** Decoding would ignore pre-urge signals, delaying command execution until subjective urge reports. Motor restoration efficacy would plummet due to neural signal decay.  
  2. **Ethics:**  
     - Consent protocols would deem patients incapable if pre-motor signals conflicted with conscious choices.  
     - Misuse liability would shift wholly to engineers (as unconscious processes couldn’t bear responsibility).  
  3. **Assessment:** Capacity evaluations would prioritize neural markers of consciousness over motor readiness potentials.  

  The status quo survives through pragmatic dualism: unconscious mechanisms execute actions, while consciousness anchors moral personhood—a view fitting but not strictly requiring epiphenomenalism, as long as consciousness retains gatekeeping authority over the will’s final output.
