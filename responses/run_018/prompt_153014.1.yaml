    "dialectical_steps": [
      "Abstract Right: Universal law/property as abstract potential.",
      "Crime: Particular will negates abstract universal.",
      "Punishment: Universal actualizes itself via negating the negation, restoring right.",
      "State (Ethical Life): Emerges as concrete universal individual (internal sovereignty actualized).",
      "State's External Existential Need: Sovereignty requires recognition but exists abstractly among peers.",
      "Violation of Sovereignty: One state's particular will negates sovereignty's universal principle.",
      "War: Defending state negates the violation, actualizing its concrete sovereign will (negation of negation)."
    ],
    "stagnation_link": "Prevents the *concept* of sovereign statehood from stagnating as a merely abstract, formal idea by forcing states to continually actualize their individuality through the potential/actuality of defensive war, mirroring how internal punishment prevents civil society's universal consciousness from stagnating.",
    "main_risk": "Over-identifying internal justice with external war, ignoring Hegel's insistence that international relations lack morality/juridical universality, making war contingent fate, not true justice.",
    "seminar_pitch": "Forget realism: Hegel's war isn't just power politics. Read dialectically, interstate war functions as the *international penal system*. Violating another state is the crime; defensive war is the punishment – the necessary, tragic mechanism by which the abstract universal of sovereignty achieves concrete actualization in a world without a higher court. It's the state's external negation of negation, mirroring crime/punishment internally."
  }
  ```

  **Key for Seminar Pitch:** Emphasize this is a *structural/dialectical* parallel, not a moral equivalence. Frame war as the tragic, contingent, but *logically necessary* external counterpart to internal justice, driven by the state's existential need to actualize its individuality against negation. This moves decisively beyond the "unfortunate contingency" or "realist power play" readings.
