  If you can lay out the argument, I'd appreciate it if you finish with a JSON summary: fields should be core_analogy, dialectical_steps (list), stagnation_link (string), main_risk (string), and seminar_pitch (string). I don't need citations—my prof hates bibliography dumps in seminar prep—but I do want the logic tight. Also, please don't just say Hegel was a realist about power politics, that's the boring reading I recieve every semester and it's not what I'm after.
