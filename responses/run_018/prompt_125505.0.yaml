prompt: |-
  I serve as the senior commissioning editor for a university-press series of synthetic world-history texts aimed at undergraduate readers. Each volume is multi-authored, and I must sign off on every chapter’s explanatory architecture within thirty minutes, without consulting a specialist in philosophy of science. A recurring problem is the treatment of non-human forces—pathogens, climatic shifts, volcanic winters—as “historical actors”. Some authors anthropomorphise these forces, attributing strategic intention; others fall into environmental determinism, treating climate or disease as sufficient causes that override institutional and human variability. I need a reusable decision procedure I can apply to any draft chapter that explains a major transition through a non-human cause.

  The principle I want operationalised is this: a non-human factor may carry genuine explanatory sovereignty in a historical narrative only if (i) it is not a constant background condition but produces differential outcomes across comparable societies facing the same event; (ii) its causal contribution survives the introduction of human institutional responses—that is, it explains variance that remains after accounting for policy, technology, or social structure; and (iii) attributing it explanatory weight does not require imputing intention or strategic agency. Where these conditions fail, the factor should be relegated to background context or explicitly flagged as a trigger whose effects were mediated. The procedure must distinguish this safe attribution from determinism, identify where judgement about narrative emphasis is unavoidable, and tell me exactly when to demand revision.

  Please construct the procedure as an ordered sequence of tests with explicit stop points: the questions to ask in order, what counts as a sufficient answer to each, where the procedure halts with a mandatory revision, where it flags a value-laden choice I must make personally, and where it allows publication with an annotation. Then apply it to three draft proposals:

  1. A chapter attributing the post-1492 demographic collapse across the Americas primarily to smallpox and measles, describing the pathogens as “conquerors” that “defeated” indigenous polities, with minimal discussion of varying indigenous public-health responses or political alliances.

  2. A chapter arguing that the Little Ice Age was the principal driver of seventeenth-century global crises (state collapse, famines, wars), presenting human institutions as uniformly reactive to temperature and harvest failure.

  3. A chapter linking the 1815 Tambora eruption to the 1816 European food crises and subsequent migration, but arguing that state grain-policy differences between Britain and France explain the divergent mortality and unrest—a case where the author expects approval, but where the procedure may yield an answer that undermines the chapter’s central claim.

  For each application, show the step-by-step result, including any point where the procedure demands revision, requires my judgement, or produces an unwelcome conclusion. Conclude by stating precisely what the procedure cannot do—for instance, whether it can adjudicate between competing specialist historiographies, eliminate normative choices about narrative focus, or substitute for domain expertise in epidemiology or palaeoclimatology. Write in British English.
reasoning: |-
  Okay, the user is a senior commissioning editor for a university press, dealing with world-history texts. They need a reusable decision procedure to evaluate chapters that attribute historical transitions to non-human forces like pathogens or climate events. The main issue is avoiding anthropomorphism and environmental determinism while ensuring these factors are given appropriate explanatory weight.

  The user specified three conditions for safe attribution: the factor must have differential outcomes across societies, its causal effect must persist despite human institutional responses, and it shouldn't require imputing intention. The procedure needs to be a step-by-step test with clear stop points for revisions, judgement calls, or annotations.

  I need to design this procedure as an ordered sequence. Let me outline the steps:

  First, identify if the non-human factor is being treated as an actor. If yes, that's an immediate revision point for anthropomorphism. If not, move to the next step.

  Second, check if the factor is presented as a constant background condition versus a variable event. If it's constant, it should be background context—flag for revision if overemphasized.

  Third, assess if differential outcomes are demonstrated. The chapter must show how the same event affected comparable societies differently. If not, it suggests determinism—revision needed.

  Fourth, examine if human institutional responses are addressed. The analysis should show the factor's effect after accounting for human actions. If missing, this is a revision point.

  Fifth, verify if the factor still explains variance after considering human responses. If not, it might just be a trigger—annotation may suffice.

  Sixth, confirm that the factor isn't given strategic agency. Any such language requires revision.

  Finally, if all checks pass, the chapter can be published with possible annotations depending on emphasis choices.

  Now, applying this to the three examples:

  For the first draft on American demographic collapse: It fails at step one by calling pathogens "conquerors"—that's anthropomorphism requiring revision. Also, it ignores indigenous responses, failing step four.

  For the Little Ice Age chapter: It presents human institutions as uniformly reactive, failing step three on differential outcomes and step four on institutional responses—revision needed to show variation.

  For the Tambora chapter: It passes most checks but might need annotation at step five since human policies explain the variance, making Tambora a trigger rather than sovereign cause. The chapter's claim might be undermined, but it's publishable with annotation.

  The procedure can't resolve historiographical debates or replace expertise—it just enforces methodological rigor. The user must still make judgement calls on narrative emphasis.

  I'll structure this in British English with clear headings and a table for the procedure. For each application, I'll show step-by-step results with decisions. The conclusion will clarify limitations: no adjudication of specialist disputes, no elimination of normative choices, and no substitution for domain knowledge.
answer: |-
  Below is a formalised decision procedure operationalising your principle for evaluating explanatory sovereignty of non-human factors in historical narratives. The procedure is structured as an ordered sequence of tests with explicit stop points, using British English.

  ---

  ### **Decision Procedure: Explanatory Sovereignty of Non-Human Factors**

  | **Step** | **Question to Ask** | **Sufficient Answer** | **Failure Outcome** | **Stop Point** |
  |----------|---------------------|------------------------|----------------------|----------------|
  | **1** | Is the non-human factor anthropomorphised (e.g., ascribed intention, strategy, or agential verbs like "conquer" or "decide")? | No explicit/implicit attribution of human-like agency. | Mandatory revision: Remove agential language. | **HALT: Revision required** if failed. |
  | **2** | Is the factor presented as a *variable event/process* with spatiotemporal boundaries, not a *constant background condition* (e.g., "Little Ice Age cooling 1550-1700" vs. "Earth's climate")? | Yes, with clear chronological/geographical specificity. | Relegate to background context; flag if overemphasised. | **HALT: Revision required** if failed. |
  | **3** | Does the narrative demonstrate *differential outcomes* across ≥2 comparable societies facing the same factor? | Evidence that societies with distinct institutions/structures had divergent results. | Suggests determinism; revision needed to introduce comparators. | **HALT: Revision required** if no evidence provided. |
  | **4** | Does the analysis explicitly address *human institutional responses* (e.g., policies, technologies, social adaptations) to the factor? | Yes, with specific examples of responses and their efficacy. | Revision required to integrate human agency. | **HALT: Revision required** if omitted. |
  | **5** | After accounting for human responses, does the non-human factor *still explain significant residual variance* in outcomes? | Data/narrative shows factor had independent causal weight (e.g., via regression, counterfactuals, or comparative analysis). | Factor is a *trigger* or *context*, not sovereign cause; annotate as "mediated effect". | **Flag for annotation** if failed. Proceed. |
  | **6** | Is the factor’s explanatory weight *contingent on narrative emphasis* (e.g., prioritising ecological vs. political lenses)? | Not applicable (objective test). | Subjective emphasis remains; editor must judge balance. | **Flag for editor’s judgement** on narrative weighting. |
  | **7** | Final Check: Are all conditions (i–iii) satisfied without determinism or agency? | Yes. | — | **Approve for publication** (annotate if Step 5/6 flagged). |

  ---

  ### **Application to Draft Proposals**

  #### **1. Demographic Collapse in the Americas (Pathogens as "Conquerors")**
  - **Step 1:** *Fail.* "Conquerors that defeated" imputes strategic agency.  
    → **HALT: Mandatory revision.** Remove anthropomorphic language.  
  - *(If revised)* **Step 2:** Pass (pathogens are variable events).  
  - **Step 3:** *Fail.* No discussion of differential outcomes (e.g., Tawantinsuyu vs. Mexica responses).  
    → **HALT: Revision required.** Add comparative analysis of public-health/political variability.  
  - **Step 4:** *Fail.* Indigenous responses omitted.  
    → **HALT: Revision required.** Integrate evidence of local adaptations.  
  - **Conclusion:** Chapter requires substantive revision at Steps 1, 3, and 4. Determinism and agency are present.

  #### **2. Little Ice Age Driving 17th-Century Crises (Institutions as Uniformly Reactive)**
  - **Step 1:** Pass (no explicit agency imputed).  
  - **Step 2:** Pass (specific chrono-geographical bounds).  
  - **Step 3:** *Fail.* Presents all institutions as similarly vulnerable; no contrast (e.g., Ottoman vs. Dutch responses to harvest failure).  
    → **HALT: Revision required.** Add cases showing institutional variability (e.g., grain storage, market integration).  
  - **Step 4:** *Fail.* Human institutions framed as passive; no agency in adaptation.  
    → **HALT: Revision required.** Analyse active responses (e.g., welfare policies, trade diversification).  
  - **Conclusion:** Fails Steps 3 and 4. Determinism evident; revision must show differential outcomes and institutional agency.

  #### **3. Tambora Eruption (1815) and Divergent European Outcomes**
  - **Step 1:** Pass (no agency ascribed to Tambora).  
  - **Step 2:** Pass (specific event with documented effects).  
  - **Step 3:** Pass (explicitly compares Britain/France as comparable societies).  
  - **Step 4:** Pass (details grain-policy differences: British laissez-faire vs. French price controls).  
  - **Step 5:** *Fail.* Human policies explain divergent outcomes; Tambora’s effect is mediated (similar weather, different mortality/unrest). Residual variance not attributable to eruption.  
    → **Flag for annotation:** "Tambora acted as a trigger; effects were institutionally mediated".  
  - **Step 6:** *Flag for editor’s judgement.* Author emphasises policy over volcanology; acceptable if title/abstract reflects this.  
  - **Conclusion:** **Approve with annotation** (Step 5). Chapter’s central claim *is* undermined procedurally (Tambora lacks sovereignty), but argument about policy divergence is valid. Editor must judge if title/thesis overstates Tambora’s role.

  ---

  ### **What the Procedure Cannot Do**
  1. **Adjudicate specialist historiographical disputes:** It tests methodological rigour, not factual accuracy (e.g., cannot resolve debates about Little Ice Age regional variability).  
  2. **Eliminate normative choices:** Narrative emphasis (e.g., prioritising ecological vs. political factors) remains subjective (Step 6 flags this for editor’s discretion).  
  3. **Substitute domain expertise:** Relies on author-provided evidence; cannot verify epidemiological/palaeoclimatological data.  
  4. **Handle multifactorial complexity:** Identifies over-attribution to non-human factors but cannot quantify their precise causal share.  

  The procedure ensures non-human factors are neither anthropomorphised nor granted undue sovereignty, while spotlighting where human agency or comparative analysis is neglected. It shifts revision from philosophical debates to tractable tests of narrative construction.
