  ### Designed Case: Multi-Phase Pharmaceutical Licensing Agreement  
  **Scenario**: A biotech startup (Player 1) and a pharmaceutical company (Player 2) engage in a four-stage licensing agreement. Stage 1: Player 1 shares preliminary research (Cooperate) or withholds (Defect). Stage 2: Player 2 invests $2M (Cooperate) or declines (Defect). Stage 3: Player 1 shares clinical trial data (Cooperate) or withholds (Defect). Stage 4: Player 2 commits to a $10M license (Cooperate) or exits (Defect). Crucially, a **reputation bond** of $4M (held in escrow) is forfeited by Player 2 *only* if they defect at Stage 2, paid to Player 1. Payoffs (P1, P2) are:  
  - Defect at Stage 1: (1, 0)  
  - Defect at Stage 2: (3, 1) → *after bond forfeit: (3 + 4, 1 - 4) = (7, -3)*  
  - Defect at Stage 3: (5, 6)  
  - Defect at Stage 4: (4, 8)  
  - Cooperate at Stage 4: (10, 12)  

  ### Why Backward Induction Fails at Stage 2  
  1. **Standard backward induction without bond**:  
     - Stage 4: Player 2 defects (8 > 12? No! Correction: 8 < 12, so cooperate? Revise payoffs to ensure defection dominates at each step without bond.  
     *Revised payoffs (ensuring defection dominates without bond)*:  
     - Defect Stage 1: (1, 0)  
     - Defect Stage 2: (1, 4)  
     - Defect Stage 3: (3, 2)  
     - Defect Stage 4: (2, 5)  
     - Cooperate Stage 4: (4, 3)  
     *Backward induction without bond*:  
     - Stage 4: Player 2 defects (5 > 3).  
     - Stage 3: Player 1 defects (3 > 2).  
     - Stage 2: Player 2 defects (4 > 2).  
     - Stage 1: Player 1 defects (1 > 1? Indifference; assume defects to avoid risk).  
     Outcome: Defection at Stage 1.  

  2. **With reputation bond (triggered only on Stage 2 defection)**:  
     - Defect at Stage 2 payoffs become (1 + 4, 4 - 4) = (5, 0) [bond forfeit: +4 to P1, -4 to P2].  
     *Backward induction with bond*:  
     - **Stage 4**: Player 2 defects (5 > 3).  
     - **Stage 3**: Player 1: Cooperate yields 2 (after P2 defects), defect yields 3. **Defects** (3 > 2).  
     - **Stage 2**: Player 2:  
       - Defect: Gets 0 (after bond forfeit).  
       - Cooperate: Game proceeds to Stage 3, where P1 defects → P2 gets 2.  
       Since 2 > 0, Player 2 **cooperates**.  
     - **Stage 1**: Player 1:  
       - Defect: Gets 1.  
       - Cooperate: Proceeds to Stage 2 (P2 cooperates) → Stage 3 (P1 defects) → P1 gets 3.  
       Since 3 > 1, Player 1 **cooperates**.  
     Outcome: Cooperation through Stage 1–2, defection at Stage 3.  

  **Structural feature**: The reputation bond severs induction at **Stage 2** by making defection there strictly worse than cooperation for Player 2 (0 < 2), but it *only* applies to Stage 2 defection. At Stage 4, defection still dominates (5 > 3), so induction holds there.  

  ### Collapse Without the Feature  
  Remove the bond: Defection at Stage 2 yields (1, 4) > (2) for Player 2 (as in standard induction), restoring defection at Stage 2 and propagating to Stage 1.  

  ### Defender's Repair Attempt and Why It Fails  
  **Repair attempt**: A defender argues that the bond should be folded into Stage 2’s payoff matrix as a fixed cost, making it "just part of the game." Thus, backward induction should proceed with payoffs (5, 0) for Stage 2 defection.  
  **Why it fails**: The bond is an **institutionally contingent feature**: it activates *only* if Player 2 defects at Stage 2 *and* the game reaches Stage 2. If Player 1 defects at Stage 1, the bond is irrelevant. Folding it into the payoff matrix ignores this contingency:  
  - At Stage 1, Player 1 knows that if they cooperate, the bond *could* bind Player 2 at Stage 2. But if Player 1 defects, the bond never materializes.  
  - Treating the bond as unconditional alters the game tree: It forces Player 2 to "pre-pay" the bond cost even if Stage 2 is never reached, violating the institutional setup. Holding the institutional details fixed (bond forfeiture *only* upon Stage 2 defection), Player 1’s rational choice at Stage 1 depends on anticipating Player 2’s *future* bond constraint, which the defender’s repair erases. Thus, the repair misrepresents the game’s structure.  

  ### Key Insight  
  The bond **selectively punishes defection at one node** (Stage 2) without altering rational behavior elsewhere. This severs the induction chain by making cooperation strictly optimal at Stage 2, while preserving common knowledge of rationality. The defender’s repair fails because it cannot model the contingency without distorting the game tree or the institutional feature’s stage-specific activation.
