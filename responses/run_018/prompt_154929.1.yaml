  Scenario: A pharmaceutical company (Player 1) and a regulatory agency (Player 2) engage in a four-stage approval process. The institutional feature is a sunset clause that activates only if the process reaches stage 4 and the agency denies approval, triggering a review that costs the agency a reputation loss R (where R>1) and requires compensation P to the company. This changes the stage 4 defection payoffs from (3,5) to (3+P,5-R), and since 5-R<4, the agency prefers to cooperate at stage 4.

  Backward induction with the clause:
  - Stage 4: Player 2 cooperates (because 4 > 5-R).
  - Stage 3: Player 1, anticipating this, cooperates (because 6 > 4).
  - Stage 2: Player 2 cooperates (because 4 > 3).
  - Stage 1: Player 1 cooperates (because 6 > 1).

  Without the clause, backward induction:
  - Stage 4: Player 2 defects (5>4).
  - Stage 3: Player 1 defects (4>3).
  - Stage 2: Player 2 defects (3>2).
  - Stage 1: Player 1 defects (1>0).

  The induction fails exactly at stage 4 due to the clause. If we remove the clause, the standard centipede resolution (immediate defection) occurs.

  A defender of backward induction might not need to repair anything because the analysis is sound for both games. However, if they try to argue that the sunset clause should not be part of the game description for some reason (e.g., that it is not a payoff-relevant consequence but an institutional detail that should be ignored), then they would be arbitrarily changing the game. The institutional details are held fixed as common knowledge, so such an argument fails.

  Thus, we have a game where the institutional feature alters the payoff at the last node, which then rationally induces cooperation all the way back, even though the players are perfectly rational and there is common knowledge of rationality.
