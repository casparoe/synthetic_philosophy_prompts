answer: |-
  ## Exam Question

  **Friedman's F-twist contends that the realism of a model's assumptions is irrelevant to its scientific validity; only predictive success matters. Critically evaluate whether this position can be sustained when models are used, not to predict directly observable outcomes, but to estimate *counterfactual policy effects* – such as the macroeconomic impact of a tax change or the climatic effect of geoengineering – where the predicted effect can only be assessed *via* the model itself due to the absence of a directly observable counterfactual baseline.**

  1.  **Exposition:** Precisely articulate Friedman's core argument concerning the irrelevance of assumption-realism, clearly distinguishing between the roles of a model's *assumptions*, its *internal implications*, and its *testable predictions* in his methodology. (5 marks)
  2.  **Challenge:** Explain why the evaluation of predictive success becomes problematic when the prediction is a counterfactual outcome (e.g., "GDP would be 2% lower without this stimulus"). Focus on the epistemological challenge of establishing an independent test for the prediction when the counterfactual state of the world is fundamentally unobservable and *must* be inferred using models. (7 marks)
  3.  **Critical Analysis:** Assess whether, in such counterfactual contexts, the strict separation Friedman requires between the structure of the model's assumptions and the independent testing of its predictions collapses. Does this generate a problematic circularity (e.g., the model defines the counterfactual baseline against which its own policy-effect prediction is judged) that undermines the F-twist's defence of unrealistic microfoundations? Justify your answer. (8 marks)
  *(Total: 20 marks)*

  ---

  ## Model Answer (Approx. 600 words)

  Friedman's central methodological claim, often termed the 'F-twist', asserts that the realism of a model's assumptions is irrelevant to its scientific validity. What matters solely is the model's ability to yield accurate predictions about observable phenomena. Friedman distinguishes between the model's *assumptions* (its foundational premises, often simplified or abstracted from reality), its *implications* (the logical deductions or calculations made *within* the model based on those assumptions), and its *testable predictions* (specific, observable outcomes derived from the model that can be compared against empirical data). Crucially, he argues that assumptions, however unrealistic, are justified *instrumentally* if the model's predictions consistently succeed. The model is a tool or 'engine' for prediction, not a literal description of underlying mechanisms. Defending unrealistic assumptions rests entirely on this sharp separation: the model's internal structure (assumptions and implications) is distinct from the external, independent metric of predictive success against real-world data.

  However, this separation faces a profound challenge when the predictive target is not an observable state of the world, but a *counterfactual policy effect*. Consider predicting the effect of a new central bank interest rate policy on inflation, or the impact of stratospheric aerosol injection on global temperature. The prediction is not "inflation will be X%" under the policy, but rather "inflation is Y% *lower than it would have been without the policy*". Similarly, the climate prediction is "temperature is Z°C *lower than it would have been without the intervention*". The core problem is the epistemological status of the counterfactual baseline ("inflation without the policy", "temperature without geoengineering"). This baseline state is fundamentally unobservable; we cannot rerun history without the policy. Consequently, establishing this baseline *requires* estimation, and this estimation inevitably relies on modelling – often the *very same* class of models whose unrealistic microfoundations (e.g., representative agents, specific cloud physics parameterisations) are in dispute.

  This necessity introduces a potential circularity that threatens Friedman's required separation. To test the model's prediction about the *policy effect* (Y% lower inflation, Z°C lower temperature), we need an estimate of the counterfactual baseline. But if that baseline estimate itself depends critically on the model's structure and assumptions – including the unrealistic microfoundations – then the 'test' of the prediction is no longer independent. The model is effectively being used to generate the standard against which its own prediction is judged. For instance, a macroeconomic model using specific, unrealistic assumptions about consumer behaviour might generate both the baseline forecast *and* the policy-impact forecast. If we then use the model-generated baseline to judge the accuracy of the policy-impact prediction, we are not performing an independent test; we are largely checking the model's internal consistency. The predictive 'success' becomes contingent on the model's own construction of reality, rather than independent empirical validation against observable data.

  Therefore, in counterfactual policy domains like macroeconomics or climate intervention modelling, the F-twist's core defence of unrealistic assumptions faces significant strain. The required separation between the model's internal structure and an independent evaluation metric collapses because the metric (the counterfactual baseline) is model-dependent. This circularity does not *automatically* falsify the F-twist or render models useless; modellers employ various validation strategies (e.g., historical testing, cross-model comparison, sensitivity analysis) to mitigate the issue. However, it fundamentally challenges the *simplicity* of Friedman's dichotomy. Predictive success concerning counterfactuals cannot be established with the same direct, independent empirical check that Friedman presupposed for observable outcomes. Consequently, the justification for unrealistic microfoundations in such contexts cannot rely solely on Friedman's instrumentalist argument; it must also engage with the plausibility of the model's structure in constructing the counterfactual world against which the policy effect is measured. The burden of justification shifts partially back towards the assumptions themselves, or at least towards the robustness of the model in generating credible counterfactuals, precisely because the 'prediction' is no longer straightforwardly testable independently of the model's internal machinery.

  ---

  ## Marking Scheme (Total: 20 Marks)

  ### 1. Exposition (5 marks)
  *   **A-grade (4-5 marks):** Clear, precise articulation of Friedman's core claim: unrealistic assumptions are irrelevant if predictions succeed. Explicit and accurate distinction between assumptions (premises, may be unrealistic), implications (internal model logic), and testable predictions (observable outcomes used for validation). Explains the instrumentalist justification for assumptions based *only* on predictive success. Avoids misrepresenting Friedman as demanding unrealistic assumptions or dismissing theory entirely.
  *   **B-grade (2-3 marks):** States the F-twist but lacks precision (e.g., conflates assumptions with implications, misstates the role of predictions). May imply Friedman advocated for falsity rather than irrelevance of realism. Basic understanding but key distinctions blurred.
  *   **Lower (0-1 mark):** Vague or incorrect summary of Friedman. Major confusion over concepts.

  ### 2. Challenge (7 marks)
  *   **A-grade (6-7 marks):** Clearly identifies counterfactual policy effects as the predictive target (e.g., *difference* caused by intervention). Forcefully explains the unobservability of the counterfactual baseline state. Explicitly links this unobservability to the *necessity* of model-based estimation for establishing the baseline. Clearly articulates the resulting epistemological problem: the lack of a directly observable, independent standard against which to test the *counterfactual prediction* itself.
  *   **B-grade (4-5 marks):** Identifies counterfactuals and notes they are hard to test. Mentions unobservability but doesn't fully connect it to the *necessity* of model dependence for baseline estimation. Explains the problem in general terms but lacks the specific epistemological link to independent testing failure.
  *   **Lower (0-3 marks):** Superficial treatment of counterfactuals. Fails to grasp the unobservability of the baseline or its implications. May treat counterfactual effects as directly testable like regular predictions.

  ### 3. Critical Analysis (8 marks)
  *   **A-grade (7-8 marks):** Clearly identifies the potential circularity: the model defines the counterfactual baseline used to assess its own policy-effect prediction. Explicitly argues that this undermines Friedman's strict separation between model structure and independent predictive testing. Explains *how* the circularity arises (baseline estimation relies on model assumptions => test of effect depends on model assumptions). Acknowledges this doesn't destroy models' value but shows it weakens the *specific* F-twist defence of unrealistic microfoundations in this context. Concludes that justification shifts towards plausibility/robustness of assumptions/structure *for counterfactual construction*, moving beyond pure instrumentalism. Maintains neutrality on contested interpretations of Friedman.
  *   **B-grade (5-6 marks):** Identifies circularity and links it to model dependence of the baseline. States it challenges Friedman's separation but doesn't fully elaborate *how* the separation collapses logically. May overstate the case (e.g., claims circularity makes F-twist completely invalid everywhere). May not clearly articulate the shift in justification burden towards assumptions/robustness for counterfactuals. Might drift into presenting contested interpretations as fact.
  *   **Lower (0-4 marks):** Vague assertion of "circularity" without clear explanation. Fails to connect the model dependence of the baseline to the testing of the effect prediction. May simply dismiss Friedman as wrong without engaging with the specific counterfactual challenge. Significant misinterpretations.

  ### Overall Clarity and Structure (Embedded)
  *   While not a separate mark category, coherence, logical flow, precision of language, and adherence to the question structure significantly influence the marking within each section. A well-structured, clear response will naturally score higher within the allocated marks for each part. Tangents, repetition, or poor structure will impede scoring.
