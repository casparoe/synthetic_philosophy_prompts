  You are an expert philosophy of science examiner with a specialism in economic methodology and the epistemology of scientific modelling. Before drafting, please think carefully about the conceptual crux that separates a genuinely critical exam question on Friedman’s F-twist from one that merely invites summary. Brainstorm specifically how the standard defence of unrealistic assumptions — that predictive success renders descriptive realism of premises unnecessary — depends on a separation between the internal structure of a model and an independent evaluation metric, and consider precisely where that separation collapses.

  Write a final-exam essay question for an upper-level philosophy of science seminar (90 minutes, expected response approximately 1,200 words). The question must centre on the F-twist in Milton Friedman’s classic essay The Methodology of Positive Economics — namely, the claim that unrealistic assumptions are methodologically harmless provided the model delivers accurate predictions. However, it must be unanswerable by reciting that summary alone. To achieve this, inject the following niche framing: ask students to evaluate whether the F-twist can survive in domains — such as macroeconomic policy forecasting or climate-intervention modelling — where the predictive target is not an observable outcome but a counterfactual policy effect that can only be estimated by the very model whose unrealistic microfoundations are in dispute. Require them to assess whether this generates a circularity that undermines the separation between assumption-realism and predictive-testing that Friedman requires.

  Please provide, in British English:
