  ## DEPARTMENT OF NOMINAL CLASSIFICATION
  **Import Compliance Directive 87-11R: Equine & Associated Attribute Manifestation (Revised)**

  **1.0 Purpose & Scope:** This Directive establishes classification protocols for the importation of biological entities exhibiting equine characteristics and their attendant nominal manifestations (hereafter "Attributes"). Classification adheres strictly to the Principle of Categorical Exclusivity (PCE), mandating that each discrete Attribute constitutes a unique taxable entry. "Horse" (Entry 0101.90.0000) and "White Horse" (Entry 0101.90.0015) are distinct and non-interchangeable categories. This Directive applies to all live specimens, representations (statuary, images), and abstract conceptual imports referencing equine Attributes.

  **2.0 Core Principles of Nominal Segregation:**
      2.1 **Attribute Independence:** The manifestation of an Attribute (e.g., "Whiteness," "Bigness," "Gallopingness") exists independently of the underlying Substantive Form ("Horseness"). Each requires separate declaration and valuation.
      2.2 **Naming Fixes Category:** The application of a specific nominal descriptor (e.g., "White Horse") irrevocably establishes a distinct conceptual category separate from both the broader genus ("Horse") and the isolated Attribute ("Whiteness"). A "White Horse" is *not* a "Horse" for tariff purposes; it is its own entity (0101.90.0015).
      2.3 **Non-Identity Relations:** The assertion "This White Horse is not a Horse" reflects a fundamental logical relation under PCE, not an empirical observation error or misdescription. It denotes categorical separation. Misapplication of this principle constitutes a Classification Error (Form DNC-44 required).

  **3.0 Classification Procedures:**
      3.1 **Primary Substantive Declaration:** Declare the core Substantive Form (e.g., "Horseness," Entry 0101.90.0000). Valuation based on standard equine assessment metrics (height, weight, breed).
      3.2 **Attribute Declaration:** Declare *each* observable or conceptually inherent Attribute as a separate line item. Common Attributes include, but are not limited to:
          *   0102.30.0050: Whiteness (per specimen)
          *   0102.30.0100: Blackness (per specimen)
          *   0102.30.0200: Brownness (per specimen)
          *   0102.30.0300: Dappledness (Requires *both* Base Color + Dappledness Attribute)
          *   0102.40.0005: Bigness (exceeding 16 hands)
          *   0102.40.0010: Smallness (under 14 hands)
          *   0102.50.0000: Tiredness (manifested during inspection)
          *   0102.60.0000: Horseness-in-Motion (Gallopingness, Trottingness, etc. - per distinct gait observed)
      3.3 **Compound Manifestations:** An entity exhibiting multiple Attributes requires declarations for the Substantive Form *and* each Attribute. Example: A large, white, galloping horse requires four (4) distinct entries: Horseness (0101.90.0000), Whiteness (0102.30.0050), Bigness (0102.40.0005), Horseness-in-Motion-Galloping (0102.60.0100). A dappled grey requires three: Horseness, Greyness (0102.30.0250), Dappledness (0102.30.0300).

  **4.0 Valuation & Duty Assessment:**
      4.1 Duty is assessed cumulatively on *each* declared entry (Substantive Form + all Attributes).
      4.2 Attribute valuation is fixed per type (see DNC Valuation Schedule Annex Gamma), irrespective of the Substantive Form it manifests upon. Whiteness carries the same duty whether manifesting on a horse, a statue, or a described concept.

  **5.0 Appeals Process for Classification Disputes (e.g., "Misclassified Greys"):**
      5.1 Challenge must be filed using Form DNC-27B/6 "Appeal of Nominal Categorization," submitted within 30 days of assessment.
      5.2 Appellant must demonstrate, via formal logical syllogism adhering to PCE, why the manifested Attributes were incorrectly segregated or conflated. Empirical evidence (e.g., "But it *looks* like a regular horse!") is inadmissible. Focus must be on the precise nominal descriptors applied during initial declaration and inspection.
      5.3 Common Grounds: Disputes often arise concerning boundary cases (e.g., "Is this light grey truly distinct from Whiteness + Minimal-Sootiness?" or "Does standing still negate Horseness-in-Motion declared on the manifest?"). Precedent relies on nominal precision, not perceptual similarity^1.

  **6.0 Recordkeeping:** Maintain complete records substantiating the declaration of *each* discrete entry (Substantive Form and all Attributes). Photographic evidence must be accompanied by explicit nominal labels matching declared entries. Unlabeled photos are insufficient proof.

  ---

  **SIDEBAR: COMMON ERRORS & CLARIFICATIONS**

  *   **ERROR:** Declaring only "White Horse" (0101.90.0015) without separate entries for "Horseness" (0101.90.0000) and "Whiteness" (0102.30.0050).
      *   **CORRECTION:** "White Horse" is a *composite category*, not a substitute for its constituent parts. All three entries are mandatory. Penalty: DNC-104(a).
  *   **ERROR:** Assuming a "Horse" declared without Attributes suffices if Attributes are later noted by Inspector.
      *   **CORRECTION:** Attributes manifesting at the time of inspection *must* be declared and assessed retroactively via Amended Declaration DNC-88, plus late fees. The initial declaration was incomplete.
  *   **ERROR:** Appealing a "White Horse is not Horse" assessment on grounds of common sense or biological taxonomy.
      *   **CLARIFICATION:** The principle of categorical exclusivity is a foundational logical and legal standard^1. Appeals based on non-PCE reasoning will be summarily dismissed. Cite *nominal* discrepancies, not empirical ones.

  **FAQ 13.7: My horse was declared white at origin but appears grey upon arrival. What do I do?**
  *   You must file an Immediate Attribute Change Notification (Form DNC-99) upon discovery. The initial "Whiteness" (0102.30.0050) declaration is void. You must declare:
      *   The original "Horseness" (0101.90.0000) remains valid.
      *   New Attribute: "Greyness" (0102.30.0250).
      *   If applicable: "Dappledness" (0102.30.0300) or other newly manifested Attributes (e.g., "Travel-Stainedness," 0102.70.1000).
  *   Duty will be recalculated based on the new Attributes manifesting at the port of entry. Failure to file DNC-99 constitutes misdeclaration. The "horse" did not change; its attendant manifested Attributes did. These are separate imports.

  ---

  **^1 See:** *Heritage Stock Ltd. v. Commissioner of Nominal Classification*, 745 F. Supp. 1123 (Ct. App. Nom. Class. 1999), upholding the decoupling of equine substance from transient appearance attributes and affirming that "the name fixes the category in perpetuity for the purposes of that specific manifestation, irrespective of subsequent perceptual drift."

  *(Note: Duty schedules and specific entry codes (e.g., 0102.30.0250 "Greyness") are illustrative. Consult the latest DNC Harmonized Attribute Schedule for current codes and rates. Rev. 04/11)*

