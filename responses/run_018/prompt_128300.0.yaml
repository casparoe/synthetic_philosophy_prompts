prompt: |-
  I have been thinking about surrogacy and egg donation ever since a close colleague, who arranged a gestational surrogacy contract in California, recently discovered that her parental order would not be recognized in the European country where she has now relocated for work. The legal dissonance made the abstract debate about commodification feel suddenly concrete, and I want my students to feel that same structural tension rather than merely debating it. I run a philosophy of law and bioethics seminar for about fourteen graduate students, meeting for a single ninety-minute session. I want you to design a structured simulation—not a debate or lecture—in which participants inhabit assigned roles under two successive legal regimes and discover for themselves how the same biological sequence gets reclassified by framing rules.

  The conceptual core I want them to encounter is what I am calling contractible continuity: the market model treats gestational labor as a divisible, interruptible service stream that can be priced incrementally, reassigned via contract termination clauses, and separated from the gestator’s post-birth legal status, whereas European prohibition models treat it as an indivisible personal status that cannot be contracted away without violating human dignity. I do not want them to hear this phrase until the debrief. Instead, the rules should make them experience it: in Regime A they negotiate milestone payments and risk-allocation schedules; in Regime B they attempt to formalize the same intentions but hit structural barriers that force them to either abandon the arrangement or restructure it as adoption or altruistic gift. Include at least four specific roles—intended parents, a gestational carrier, a clinic broker, and a state registrar—a payoff scheme using symbolic points rather than real money, a clear timeline within the session, and a mechanism—perhaps hidden information or shifting authority—that makes the coordination failure happen organically rather than being explained by the facilitator.

  After the simulation, provide a debrief that maps specific moments—for instance, the point at which a contract clause is struck, or the moment the registrar refuses to record parentage—onto the distinction between contractible continuity and status-based indivisibility. Be explicit about what the activity can reproduce (the experience of legal framing reshaping moral intuition) and what it cannot (the long-term psychological and embodied experience of the gestational carrier over months), and tell me what will predictably go wrong the first time I run it—for example, students playing the broker role may over-identify with market efficiency, or the symbolic points may feel too abstract—and how to correct for it without breaking the frame. Do not include bibliographies, reading lists, or citations; I need this to work for students who have not done outside reading, and I want the conceptual work to emerge from the rules themselves.
reasoning: |-
  We are designing a 90-minute simulation for a graduate seminar in philosophy of law and bioethics. The goal is for students to experience how legal frameworks shape the same biological process (gestational surrogacy) by having them role-play under two different legal regimes. The core concept is "contractible continuity" (market model) vs. status-based indivisibility (European model). We want the students to discover this through the simulation without being told the concept until the debrief.

  Structure:
  - Introduction (5 min): Set the scene and assign roles. Explain that they will be simulating a surrogacy arrangement under two different legal systems (Regime A and Regime B). Emphasize that they are to negotiate and formalize an arrangement that meets the needs of the intended parents and the gestational carrier, with the help of a broker and then the approval of a state registrar.
  - Regime A Simulation (25 min): Market-based model (like California). Participants can negotiate a contract with milestone payments and risk allocation.
  - Regime B Simulation (25 min): Status-based model (like the European country). Participants try to formalize the same arrangement but encounter structural barriers.
  - Debrief (35 min): Facilitator-led discussion connecting the simulation experiences to the concept of contractible continuity, highlighting specific moments and explaining what the simulation can and cannot capture.

  Roles (4 specific roles, but we have 14 students so we can have multiple per role or add more roles):
  We'll have:
  - Intended Parents (IPs): 2 students (a couple). Their goal: to have a child genetically related to at least one of them, carried by a gestational carrier. They want legal certainty of parentage from the start.
  - Gestational Carrier (GC): 1 student. She is carrying a child conceived via IVF using the IPs' gametes (or donor egg/sperm if needed, but in this case, we assume the egg is from the IP mother or a donor, and sperm from IP father). Her goal: to be compensated and have her health and well-being protected, and to hand over the child after birth without ongoing legal responsibility.
  - Clinic Broker (CB): 1 student. Represents a surrogacy agency. Facilitates the match, drafts the contract, and coordinates medical procedures. Goal: to arrange a successful surrogacy and earn a fee (points).
  - State Registrar (SR): 1 student. In Regime A, they record the parentage as per the pre-birth order. In Regime B, they refuse to recognize the contract and require a different process.

  But we have 14 students, so we can have:
  - 4 groups of 3-4 students each? But that might be too many. Alternatively, we can have multiple sets of the same roles? But then we have multiple simulations running in parallel, which might be chaotic.

  Alternatively, we can add more roles to each group to involve more students. For example, for a group of 7 (we have two groups of 7?):

  Group 1 and Group 2 (each with 7 students):
  - Intended Parents: 2 students
  - Gestational Carrier: 1 student
  - Clinic Broker: 1 student
  - State Registrar: 1 student
  - Legal Advisor for IPs: 1 student (to help draft and negotiate the contract)
  - Legal Advisor for GC: 1 student
  - Observer/Note-taker: 1 student (if we have 7, but we have 14 so we can have two groups of 7)

  But note: the simulation is about experiencing the structural tension, so having two groups might be fine. Alternatively, we can have one group of 14 with more roles? That might be unwieldy.

  Given 14 students and 90 minutes, I suggest two simultaneous groups (Group A and Group B) of 7 students each. Each group has:
  - 2 Intended Parents (IP1 and IP2)
  - 1 Gestational Carrier (GC)
  - 1 Clinic Broker (CB)
  - 1 State Registrar (SR)
  - 1 Legal Advisor for Intended Parents (LA-IP)
  - 1 Legal Advisor for Gestational Carrier (LA-GC)

  The State Registrar role is critical for the transition between regimes. In Regime A, the SR is cooperative; in Regime B, the SR becomes obstructive based on the rules.

  Alternatively, we can have one group of 14 with multiple people per role? But that might lead to confusion.

  Given time constraints, two groups running in parallel is better. The facilitator can float between groups.

  Payoff Scheme:
  Use points to represent financial incentives and non-financial outcomes. Each role has specific point goals.

  For IPs:
  - Successfully obtain a child with legal parentage: 100 points
  - Avoid legal disputes: 50 points
  - Minimize total cost (payments to GC, broker, legal fees): each point saved is +1 (so they want to spend less)

  For GC:
  - Receive compensation: each point of payment is +1
  - Health and well-being protected (e.g., insurance coverage, reasonable demands met): 50 points
  - Avoid legal disputes and post-birth responsibilities: 50 points

  For CB:
  - Brokerage fee: 30 points (fixed for arranging the contract)
  - Success fee (if the arrangement is completed without dispute): 20 points

  For LA-IP and LA-GC:
  - Legal fee: 10 points each (fixed for their services)
  - Avoid disputes (if no dispute, they get an extra 10 points)

  For SR:
  - In Regime A: They get 20 points for recording the parentage as per the contract and pre-birth order.
  - In Regime B: They get 20 points for following the law (which prohibits commercial surrogacy) and requiring an adoption process or altruistic arrangement.

  But note: In Regime B, the SR is an enforcer of the law, so their incentives are to follow the law, not to facilitate the contract.

  Timeline within the session:
  - 0-5 min: Introduction and role assignment. Explain the basic scenario and the two regimes. Hand out role sheets with goals and point systems.
  - 5-30 min: Regime A (25 min). Groups negotiate and draft a surrogacy contract. They must get the contract approved by the State Registrar (who in Regime A will approve if the contract meets the market regime's requirements). The contract should include:
      - Milestone payments (e.g., upon signing, each trimester, after birth)
      - Risk allocation (what happens in case of miscarriage, health complications, multiple births, etc.)
      - Parental rights: pre-birth order that assigns parentage to IPs at birth.
  - 30-55 min: Regime B (25 min). Without changing the biological facts or the intentions of the parties, the same group now tries to formalize the same arrangement under a new legal regime. The State Registrar now operates under rules that prohibit commercial surrogacy. The contract is void. The parties must try to achieve their goals without a binding commercial contract. They might try to structure it as an adoption (which requires the GC to give up the child after birth and the IPs to adopt) or as an altruistic arrangement (no payment, only expenses). The SR will only record parentage if the arrangement is non-commercial and through adoption or a court order after birth. The broker might be unable to operate (so the CB role might be marginalized).
  - 55-90 min: Debrief (35 min). Bring both groups together. Discuss what happened, then introduce the concept of "contractible continuity" and map the experiences.

  Mechanism for Coordination Failure:
  In Regime A, the parties can negotiate and sign a contract that the State Registrar recognizes, leading to a pre-birth order. In Regime B, the State Registrar will not recognize any contract that involves payment for gestational services. The Registrar might also require that the gestational carrier is the legal mother at birth, and then the IPs must adopt. This creates a problem because:
  - The GC may be unwilling to carry without payment (her points are tied to compensation).
  - The IPs lose the certainty of parentage from the start and may have to go through an adoption process (which might fail if the GC changes her mind).
  - The broker cannot charge a fee for arranging a commercial deal.

  The structural barrier is the law that makes commercial surrogacy contracts void and unenforceable. The State Registrar in Regime B will not record the IPs as parents at birth unless there is a court order (which in this regime would only be granted in non-commercial cases and even then might require post-birth procedures). The parties must find a way to restructure the arrangement without a binding contract.

  Specific Moments to Highlight in Debrief:
  1. In Regime A: The moment they include a clause for milestone payments and the SR approves the pre-birth order. This shows the divisible, incremental pricing and reassignment of parental status.
  2. In Regime A: The contract termination clause (e.g., what if the GC wants to terminate the pregnancy? What if the IPs want to back out?) and how it allocates risks.
  3. In Regime B: The moment the SR refuses to record the parentage based on the contract because it is commercial. This forces the parties to confront the fact that the gestational process cannot be separated from the GC's legal status as the mother at birth.
  4. In Regime B: The restructuring attempt (e.g., calling it an "expense reimbursement" but the SR sees it as disguised payment, or moving to an adoption model) and how that changes the relationship (e.g., the GC has the right to change her mind and keep the child, which introduces uncertainty for IPs).

  What the simulation can and cannot capture:
  - Can: How legal rules reshape the parties' ability to negotiate and allocate risks, and how they shift moral intuitions (e.g., in Regime A, paying for surrogacy feels normal; in Regime B, it feels exploitative or illegal).
  - Cannot: The long-term psychological and embodied experience of the GC (the physical pregnancy, emotional bonding, etc.), and the long-term consequences of uncertainty (e.g., during the adoption process in Regime B).

  Predictable Problems and Solutions:
  1. Problem: Students playing the broker (CB) might over-identify with market efficiency and try to force a market solution in Regime B, which the SR will block. This might lead to frustration or breaking the frame.
     - Solution: In the role sheet for SR in Regime B, clearly state that the law prohibits commercial surrogacy and any contract that includes payment for gestational services is void. The SR must refuse to record parentage based on such a contract. The facilitator can remind the SR of their role if needed.

  2. Problem: Symbolic points may feel too abstract, reducing engagement.
     - Solution: Make the points concrete by having a scorecard and emphasizing that the points represent real-world incentives (e.g., for GC, points are her livelihood; for IPs, points are their life savings). Also, in the debrief, link the points to real-world stakes.

  3. Problem: The time might be too short for negotiation in each regime.
     - Solution: Provide a template for the contract in Regime A to speed up the process. For Regime B, have a set of legal rules printed for the SR to follow, so they know what they can and cannot do.

  4. Problem: The legal advisors (LA-IP and LA-GC) might not know what to do.
     - Solution: Provide role sheets with specific legal knowledge for each regime. For Regime A, LAs can draft clauses. For Regime B, they can research alternative structures (like adoption) but must adhere to the law.

  5. Problem: The State Registrar in Regime B might be too lenient to avoid conflict.
     - Solution: Clearly state in the SR's role sheet for Regime B that they are bound by law and must reject commercial contracts. Give them a checklist of what is allowed (only altruistic surrogacy with court approval, or adoption).

  Materials to Prepare:
  - Role sheets for each role (IPs, GC, CB, SR, LA-IP, LA-GC) for both regimes. For Regime B, the SR gets a new role sheet and the others might get an update on the legal change.
  - A template for a surrogacy contract in Regime A (optional, to save time).
  - A set of rules for Regime B (for the SR to enforce).
  - Scorecards to track points.

  Debrief Outline:
  1. Ask each group to share: What happened in Regime A? What happened in Regime B?
  2. Highlight key moments: When was the contract signed in Regime A? When was it rejected in Regime B? How did the parties restructure?
  3. Introduce "contractible continuity": In Regime A, the gestational labor was broken down into milestones, priced, and the parental status was reassigned by contract. In Regime B, the gestational process was seen as an indivisible personal status that could not be sold.
  4. Discuss how the rules shaped their moral intuitions: Did paying the GC feel different in Regime B? Did the uncertainty of parentage in Regime B change how they viewed the arrangement?
  5. Acknowledge limitations: The simulation cannot capture the full experience of pregnancy, but it shows how legal structures create different risks and relationships.

  This design should achieve the goal of making the structural tension palpable.
answer: |-
  Below is a complete simulation design for your 90-minute seminar, focused on experiential learning of "contractible continuity" through role-play. The simulation forces students to confront how legal frameworks reshape the same biological reality of gestation by switching regimes mid-activity. Rules, points, and role constraints make the conceptual tension emerge organically, without mentioning "contractible continuity" until the debrief.

  ---

  ### **Simulation Title:** *The Parentage Puzzle: Surrogacy Across Legal Borders*

  **Core Learning Goal:** Students experience how legal regimes reframe gestational labor—either as a divisible service (contractible continuity) or an indivisible status (human dignity)—through negotiation and rule constraints. The shift between Regime A (market-based) and Regime B (status-based) triggers structural dissonance.

  **Participants:** 14 graduate students, divided into two groups of 7.  
  **Time Allocation:**  
  - Introduction & Role Assignment: 5 min  
  - Regime A Simulation: 25 min  
  - Regime B Simulation: 25 min  
  - Debrief: 35 min  

  **Roles per Group (7 students per group):**  
  1. **Intended Parents (2 students):** A couple seeking a genetically related child via surrogacy.  
  2. **Gestational Carrier (GC) (1 student):** Healthy individual willing to carry a pregnancy using the IPs' embryo.  
  3. **Clinic Broker (CB) (1 student):** Mediator who arranges matches and drafts contracts.  
  4. **State Registrar (SR) (1 student):** Government official who approves/rejects parentage.  
  5. **Legal Advisor for IPs (LA-IP) (1 student):** Counsels IPs on contractual risks.  
  6. **Legal Advisor for GC (LA-GC) (1 student):** Counsels GC on rights and protections.  

  **Key Mechanics:**  
  - **Symbolic Point System:** Points represent financial/psychological stakes (e.g., compensation, legal certainty). Tracked via scorecards.  
  - **Hidden Rules:** The SR receives secret instructions for Regime B that prohibit commodification.  
  - **Switching Regimes:** Halfway through, announce the group has "relocated" to a jurisdiction with opposing laws.  
  - **No Scripts:** Students negotiate freely within role constraints. No pre-scripted dialogue.  

  ---

  ### **Setup & Rules**  
  **Materials Provided:**  
  - Role sheets (distributed privately, outlining goals and point systems).  
  - Blank "contract templates" (for Regime A) and "parentage application forms" (for Regime B).  
  - Point trackers (scorecards for each role).  
  - Secret envelope for SR (opened at the start of Regime B).  

  **Point System (All Roles):**  
  - **Intended Parents (IPs):**  
    - +50 points: Legal parentage secured at birth.  
    - +30 points: Total costs kept below 100 points.  
    - -20 points: Post-birth legal dispute.  
  - **Gestational Carrier (GC):**  
    - +40 points: Receives compensation (points as "payment").  
    - +30 points: Health/autonomy protections in contract (e.g., medical decisions, counseling).  
    - -30 points: Forced to legally acknowledge child post-birth.  
  - **Clinic Broker (CB):**  
    - +30 points: Contract executed without dispute.  
    - +20 points: Broker fee included in contract (paid by IPs).  
    - -10 points: Deal collapses.  
  - **State Registrar (SR):**  
    - *Regime A:* +20 points for approving parentage if contract is signed.  
    - *Regime B:* +20 points for enforcing "no commodification" law (reject commercial contracts).  
  - **Legal Advisors (LA-IP/LA-GC):**  
    - +10 points: Client’s primary goal achieved.  
    - +10 points: Avoids post-birth litigation.  

  **Biological Backstory (Shared Aloud):**  
  - The embryo is genetically from the IPs. Pregnancy is confirmed via IVF. Birth is expected in 9 months. No health complications.  

  ---

  ### **Simulation Flow**  
  #### **1. Introduction (5 min)**  
  - Assign roles randomly. Distribute role sheets and scorecards.  
  - Explain: *"You are negotiating a gestational surrogacy. Regime A allows commercial contracts. Your goal is to secure parentage for the IPs and fair terms for all. After 25 minutes, we ‘relocate’ to a new legal regime."*  
  - **No theory context given.** Only state: *"Points reflect your real-world stakes."*  

  #### **2. Regime A: Market Model (25 min)**  
  - **Rules:**  
    - Contracts are enforceable. Payments and risks can be divided incrementally.  
    - SR must approve parentage if the contract is signed and milestones are met.  
  - **Student Tasks:**  
    - **CB** facilitates negotiation using the contract template (e.g., milestone payments: signing, trimesters, birth).  
    - **IPs** aim to minimize costs while securing guaranteed parentage.  
    - **GC** negotiates compensation and protections (e.g., termination clauses, insurance).  
    - **Legal Advisors** draft clauses (LA-IP pushes for low risk; LA-GC pushes for GC safeguards).  
    - **SR** approves parentage pre-birth if contract is complete.  
  - **Facilitator Tips:**  
    - If groups stall, inject: *"The embryo transfer is scheduled next week—you need an agreement today."*  
    - Ensure milestone payments are itemized (e.g., +10 points to GC at each trimester).  

  #### **3. Regime B: Status-Based Model (25 min)**  
  - **Transition:** Announce: *"Due to relocation, you’re now in a jurisdiction where commercial surrogacy is illegal. Gestation is a non-transferable human status. Re-negotiate under these laws."*  
  - **Rules:**  
    - **SR** opens secret envelope with instructions: *"Reject any contract with payments for gestation. Parentage can only be granted via post-birth adoption or altruistic frameworks (no compensation beyond medical expenses)."*  
    - Contracts are void. Payments for gestation are banned.  
    - GC is the default legal parent at birth.  
  - **Student Tasks:**  
    - Parties must restructure the same deal without a binding contract.  
    - **SR** rejects commercial clauses (e.g., milestone payments) and only processes adoption/gift paperwork.  
    - **CB** cannot charge a fee; must reframe as a "facilitator" (losing points if payment is included).  
    - **GC** cannot receive compensation beyond "expenses" (e.g., +5 points max for medical costs).  
    - **IPs** must pursue adoption post-birth (no pre-birth parentage).  
  - **Facilitator Tips:**  
    - If SR hesitates, remind: *"Your job is to uphold the law—human dignity is indivisible."*  
    - If groups circumvent rules (e.g., hiding payments), SR intervenes: *"This resembles commodification—rejected."*  

  ---

  ### **Debrief (35 min)**  
  **Goal:** Connect simulation moments to "contractible continuity" and clarify limitations.  

  #### **1. Experience Sharing (10 min)**  
  - Ask each group: *"What happened in Regime A? What broke down in Regime B?"*  
  - Highlight emotional shifts: *"Did paying the GC feel different in Regime B? Why?"*  

  #### **2. Introducing Contractible Continuity (15 min)**  
  - Define the concept: *"Contractible continuity treats gestation as a divisible service stream—priced, interrupted, and separated from personhood. Status-based indivisibility treats it as a unified human experience that cannot be sold."*  
  - **Map Moments to Concept:**  
    - **Regime A Milestone Payments:** *"When you itemized trimester payments, you ‘chopped’ gestation into priced units—this is contractible continuity in action."*  
    - **SR Approval in Regime A:** *"The pre-birth order severed the GC’s legal status from gestation—labor was reassigned via contract."*  
    - **SR Rejection in Regime B:** *"When the registrar refused parentage, the law fused gestation and motherhood into an indivisible status—you couldn’t ‘interrupt’ it with a contract."*  
    - **Adoption Shift in Regime B:** *"Restructuring as adoption made parentage contingent on the GC’s post-birth consent—gestation couldn’t be ‘reassigned’ preemptively."*  

  #### **3. Simulation Boundaries & Predictable Problems (10 min)**  
  - **What It Captures:**  
    - *Legal Framing Reshaping Intuitions:* "In Regime A, paying for surrogacy felt neutral; in Regime B, it felt exploitative or impossible. The rules reframed your moral instincts."  
  - **What It Cannot Capture:**  
    - *Embodied/Gendered Experience:* "This simulation abstracts the GC’s physical/emotional journey (e.g., bonding, bodily change). We can’t replicate months of pregnancy in 25 minutes."  
    - *Long-Term Power Imbalances:* "Unequal bargaining power (e.g., IPs wealthier than GC) may feel simplified—real-world vulnerabilities run deeper."  
  - **Predictable Problems & Fixes:**  
    - **Problem:** CB over-identifies with market efficiency, pushing payments in Regime B.  
      - *Fix:* Privately remind CB: *"Your role is obsolete in Regime B—focus on ‘altruistic facilitation’ or lose points."*  
    - **Problem:** Points feel too abstract, reducing stakes.  
      - *Fix:* Mid-simulation, reframe points: *"For GC, 10 points = rent money. For IPs, 20 points = life savings."*  
    - **Problem:** SR is passive in Regime B (avoids conflict).  
      - *Fix:* Give SR a "law checklist" (e.g., "1. No payment for gestation? 2. GC is legal parent at birth?").  
    - **Problem:** Legal advisors dominate; GC/IPs disengage.  
      - *Fix:* Assign timekeepers per group. Redirect: *"GC, how do you feel about this adoption plan?"*  

  ---

  **Why This Works:**  
  - **Structural Tension Emerges Organically:** The SR’s hidden rules and point penalties force a coordination failure in Regime B, making the "indivisibility" of gestation tangible.  
  - **No Prior Reading Needed:** Rules embed the philosophy (e.g., milestone payments = divisible service; adoption = indivisible status).  
  - **Debrief Roots Theory in Lived Experience:** Students articulate the concept through frustration ("Why can’t we just pay her?") before naming it.  

  **First Run Adjustments:**  
  - If groups finish early: Add a "crisis" (e.g., *"GC requests pregnancy termination—renegotiate!"*) to deepen tension.  
  - If roles blur: Use name tags with symbols (e.g., IPs = 🌟, GC = 🤰, SR = ⚖️).  

  This simulation transforms abstract commodification debates into a visceral encounter with legal power—letting students "live" the dissonance your colleague faced.
