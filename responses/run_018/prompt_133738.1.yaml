  Okay, the user bought a painting three years ago and genuinely loved it. Then a friend mentioned it's an AI reconstruction of a lost 1920s piece. The friend says they should feel cheated because it's not "real," but the user still feels the same about it. The question is whether there's something missing in such a copy when the original is gone forever, or if the friend is just being snobby about authenticity.

