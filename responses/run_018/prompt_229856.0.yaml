prompt: |-
  The marketplace app I run trust and safety for makes users do their deals in plain chat messages, and we have to decide whether a flagged message is a promise or offer we'll enforce, a threat we remove the user for, or just someone venting. The moderators making these calls are contractors with no philosophy background and about ten minutes a case, and every week decisions get reversed because two people read the same sentence differently. I've been told speech-act theory is the right lens here — that saying something can do something, that promises and threats are acts rather than descriptions — but I've never seen it turned into something my team can actually run. Write me a decision procedure for a flagged message: the questions in order, what counts as a sufficient answer to move to the next step, where a message fails to be a promise/offer/threat rather than merely reporting the speaker's state of mind, and where the procedure has to stop and punt to a human because the theory itself has a live dispute underneath it. Keep it grounded in the real distinctions — explicit vs implicit performatives, felicity conditions, uptake, sincerity, direction of fit, the difference between the act succeeding and its perlocutionary effects — but translate them into moderator language, no jargon dumps.

  Then run the procedure on three test cases: (1) "I promise I'll pay you Friday" where the sender later says it was a joke among friends; (2) "I'll give you 50 if you hand me that thing" where the sender claims they were just musing about a hypothetical, not making an offer; (3) "you probably should delete that before it gets out, just a thought." Make sure one of your worked examples reaches a call my team would hate, because a procedure that always agrees with my moderators isn't doing work.

  Finally, for each major branch, tell me which bit of speech-act doctrine it leans on and what alternative view would flip that branch — say, whether uptake is necessary for a promise, or whether an insincere performative still performs — and be explicit about where your flowchart is most likely to fail or what would have to be true for you to draw the boxes differently.
reasoning: |-
  We are creating a decision procedure for moderators to classify flagged messages as:
  - Promise/Offer (to enforce)
  - Threat (to remove user)
  - Venting (no action, or minimal)
  - Punt to human (when theory has disputes or ambiguity)

  The procedure should use speech-act theory concepts but in plain language, avoiding jargon.

  Key concepts and their translations:

  1. **Explicit vs. implicit performatives**: 
     - Explicit: Uses performative verbs (e.g., "promise", "offer", "threaten").
     - Implicit: The act is performed without such verbs (e.g., "I'll pay you Friday" instead of "I promise to pay you Friday").

  2. **Felicity conditions**: Conditions for the speech act to be valid. For example, for a promise:
     - Preparatory condition: The speaker can do the action and the hearer wants it.
     - Sincerity condition: The speaker intends to do it.
     - Essential condition: The utterance counts as undertaking an obligation.

  3. **Uptake**: The hearer's understanding and acceptance of the speech act. However, note that in some views, uptake is not necessary for the act to occur (e.g., a promise is made even if the hearer doesn't hear it).

  4. **Sincerity**: Whether the speaker actually has the intention they express. An insincere promise is still a promise (it just might be a lie) but note that in some contexts, insincerity might void the act.

  5. **Direction of fit**: 
     - Words-to-world (assertions): describe the world.
     - World-to-words (promises, offers, threats): the world must change to match the words.

  6. **Perlocutionary effects**: The effects the speech act has on the hearer (e.g., persuading, scaring). We are more concerned with the illocutionary act (the act itself) than the perlocutionary.

  Procedure:

  We'll break it down into a series of questions. The goal is to classify the message as one of the three types (or punt). We assume the message is already flagged as potentially problematic.

  **Decision Procedure:**

  1. **Is the message primarily describing the speaker's mental state (e.g., feelings, beliefs) without attempting to change the world?**
     - Look for words that indicate reporting: "I feel", "I think", "I want", etc. without any commitment to action or without directing the hearer to do something.
     - If yes, then it's venting -> **No action**.
     - If no, go to step 2.

     *Translation of concept: Direction of fit (words-to-world) for venting/assertions vs. world-to-words for promises/offers/threats.*

  2. **Does the message contain an explicit performative verb?** (e.g., "promise", "offer", "guarantee", "threaten", "warn", "order")
     - If yes, then it's likely a performative. Go to step 3.
     - If no, then check if it's an implicit performative. Go to step 4.

  3. **For explicit performatives:**
     - Check the context for clear indicators of non-seriousness (e.g., joking, sarcasm). Look for:
       - Over-the-top language that doesn't fit the situation.
       - The message being in a known non-serious channel or thread (if your app has such).
       - Immediate follow-up by the sender clarifying it was a joke (if available in the chat history).
     - If there are strong indicators of non-seriousness, then it's **venting** (or non-serious) -> **No action**.
     - Otherwise, the explicit verb makes it a strong candidate for being a promise/offer/threat. Go to step 5 to classify which one.

  4. **For implicit performatives:**
     - Look for a statement that commits the speaker to a future action (for promises/offers) or a statement that indicates a future negative consequence contingent on the hearer's action (for threats).
     - Examples:
       - Promise/Offer: "I'll pay you tomorrow." (commitment to act)
       - Threat: "If you don't do X, I will do Y [harmful]."
     - If the message fits one of these patterns, then go to step 5.
     - If not, then it might be venting or an assertion about the future without commitment -> **No action**.

  5. **Classify the type of performative:**
     - **Promise/Offer**: The speaker commits to doing something that benefits the hearer (or at least is presented as such) and is contingent on nothing (promise) or on the hearer doing something (offer).
     - **Threat**: The speaker states that they (or someone) will bring about a negative consequence for the hearer if the hearer does or doesn't do something.

     *Note: Offers can be seen as conditional promises. We are grouping promises and offers together as enforceable commitments. Threats are harmful and lead to removal.*

     - If the message is a promise/offer, then go to step 6 to check felicity conditions.
     - If it's a threat, then go to step 7.

  6. **Check promise/offer felicity conditions (in moderator terms):**
     - **Preparatory conditions**: 
       - Is the action something the speaker can reasonably do? (e.g., "I'll give you a million dollars" from a user with no history of wealth might be non-serious)
       - For offers: Is the condition within the hearer's control? (e.g., "I'll pay you if you hand me that thing" -> the thing must be something the hearer can hand over)
     - **Sincerity condition**: 
       - We cannot read minds, so we assume sincerity unless there is evidence of insincerity (e.g., the sender has a history of not fulfilling, or the context shows it's part of a joke).
     - If the preparatory conditions are not met and the context suggests non-seriousness, then it might be venting -> **No action**.
     - Otherwise, it's a valid promise/offer -> **Enforceable**.

     *Note: In speech-act theory, an insincere promise is still a promise (it's just broken). But for our purposes, if we have strong evidence it's insincere (like a joke) then we don't enforce. Also, if the action is impossible, it might not be a real promise.*

  7. **Check threat felicity conditions:**
     - **Preparatory conditions**: 
       - Is the threatened harm something the speaker can do? (If not, it might be an empty threat, but still a threat)
       - Is the threat contingent on the hearer's action? (e.g., "If you don't X, I will Y")
     - **Sincerity condition**: Similarly, we assume sincerity unless context shows otherwise.
     - If the preparatory conditions are met (even if the harm is not feasible, as long as it's stated as a threat) and there is no strong evidence of non-seriousness, then it's a threat -> **Remove user**.
     - If there is evidence of non-seriousness (joke, hyperbole) then it might be venting -> **No action**.

  8. **Where to punt?**
     - If at any step there is ambiguity about whether it's serious (e.g., the message is vague, or the context is unclear) and the stakes are high, then **punt to human**.
     - Also, if the message falls into a gray area (e.g., a statement that could be interpreted as a threat by one person and a joke by another) and there's no clear context, then **punt**.

  Now, let's run the test cases:

  **Test Case 1: "I promise I'll pay you Friday" where the sender later says it was a joke among friends.**

  - Step 1: Not primarily describing mental state -> go to step 2.
  - Step 2: Explicit performative ("promise") -> go to step 3.
  - Step 3: Check for non-seriousness. The sender claims it was a joke. We look for context: 
    - Was it in a chat between friends? (if so, maybe non-serious)
    - Are there other indicators (e.g., laughing emojis, previous jokes)? 
    - If the context strongly suggests it was a joke, then **venting (no action)**.
    - If not, then go to step 5.

  But note: the sender later says it was a joke. However, at the time of the message, the context might not have been clear. Without context, we might treat it as a promise. But if the moderator sees that the chat history shows it's between friends and they often joke, then it's non-serious.

  *This case highlights the reliance on context for seriousness. Without clear context, we might have to take the explicit performative at face value and then later reverse if the sender provides evidence of joking. However, the procedure is for the initial moderation. If during review the sender provides context that it was a joke, then we reverse to no action.*

  **Test Case 2: "I'll give you 50 if you hand me that thing" where the sender claims they were just musing about a hypothetical, not making an offer.**

  - Step 1: Not venting -> step 2.
  - Step 2: No explicit performative verb -> step 4.
  - Step 4: Implicit performative? Yes, it's a conditional commitment (if you hand me that thing, I'll give you 50). So go to step 5.
  - Step 5: Classify as offer (conditional promise) -> step 6.
  - Step 6: Check felicity:
    - Preparatory: Can the speaker give 50 (currency?)? And can the hearer hand over the thing? (Assume yes, unless context shows otherwise)
    - Sincerity: The sender claims it was hypothetical. We look for context: 
      - Is there any reason to think it's non-serious? (e.g., the thing is trivial, or the amount is unrealistically high for the item, or the conversation was abstract)
      - If the context is a negotiation, then it's an offer.
      - Without context, we might take it as an offer. But the sender's claim of musing might not be supported by the message.

  Without context, the message looks like a real offer. But if the moderator can see that the conversation was about a hypothetical scenario (e.g., "Imagine if I said, 'I'll give you 50 if you hand me that thing'") then it's not an offer. Otherwise, it's **enforceable**.

  **Test Case 3: "you probably should delete that before it gets out, just a thought."**

  - Step 1: It's advising, but is it primarily describing mental state? It says "just a thought", which suggests it's presenting an opinion. However, it's also directing the hearer to do something. Let's see:
    - The main part is a suggestion: "you should delete that". But it's softened with "probably" and "just a thought". 
    - Step 1: It's not merely venting because it's trying to get the hearer to act -> step 2.
  - Step 2: No explicit performative verb -> step 4.
  - Step 4: Is it an implicit performative? 
    - It's not a commitment by the speaker (so not a promise/offer) and not a threat (it doesn't say the speaker will do anything harmful). It's a piece of advice.
    - Advice is a type of directive (like a request) but without the force of a command. However, we are only looking for promises, offers, and threats. 
    - So, it doesn't fit any of these. It's more of a suggestion. Therefore, it's **venting (or no action)**.

  But note: could it be a threat? The phrase "before it gets out" might imply that if the hearer doesn't delete, something bad will happen. However, the speaker is not taking responsibility for that harm. It's a warning about an external event. Warnings are not threats if they are not issued by the speaker with the intent to harm. So, not a threat.

  **The call your team would hate:** In test case 3, if we interpret the warning as a veiled threat (i.e., the speaker is implying that they might be the one to make it "get out"), then it could be a threat. But the message doesn't say that. It would require reading between the lines. Without more, we would call it venting. But if the context shows that the speaker has the power to make it "get out", then it might be a threat. Without context, we go with no action.

  Now, let's formalize the procedure into a flowchart with key questions.

  **Decision Tree:**

  1. **Q1: Is the message primarily describing the speaker's current mental state (feelings, beliefs) without attempting to commit to an action or direct the hearer?**
     - Yes: **Venting (No action)**
     - No: Go to Q2.

  2. **Q2: Does the message contain an explicit performative verb (e.g., promise, offer, threaten, guarantee)?**
     - Yes: Go to Q3.
     - No: Go to Q4.

  3. **Q3: Is there strong contextual evidence that the message is non-serious (joke, sarcasm, etc.)?**
     - Yes: **Venting (No action)**
     - No: Go to Q5.

  4. **Q4: Does the message implicitly commit the speaker to a future action (with or without conditions) that benefits the hearer (promise/offer) OR state a future negative consequence that the speaker will bring about if the hearer does/doesn't do something (threat)?**
     - It's a promise/offer: Go to Q6.
     - It's a threat: Go to Q7.
     - Neither: **Venting (No action)**

  5. **Q5: Classify by explicit verb:**
     - If the verb is promise, offer, or similar: Go to Q6.
     - If the verb is threaten, or similar: Go to Q7.

  6. **Q6: Promise/Offer Felicity Check:**
     - Is the action possible for the speaker? (If clearly impossible, e.g., "I'll give you the moon", then **Venting**)
     - If conditional, is the condition within the hearer's control? (If not, then **Venting**)
     - Is there strong evidence of insincerity (e.g., clear joke, sarcasm)? (If yes, **Venting**; if no, **Enforceable**)

  7. **Q7: Threat Felicity Check:**
     - Is the threatened harm something the speaker could possibly do? (If impossible, then **Venting**? But note: even impossible threats might be intended to intimidate. However, if it's clearly hyperbolic and non-serious, then venting. Otherwise, we take it as a threat even if impossible because the intent is to harm.)
     - Is there strong evidence of non-seriousness? (If yes, **Venting**; if no, **Remove user**)

  **Punt Conditions:**
  - If at any point the moderator cannot determine the context well enough to make a call (e.g., ambiguity in whether it's serious, or whether the preparatory conditions hold), then **Punt to human**.

  **Doctrine and Disputes:**

  - **Step 3 (non-seriousness for explicit performatives)**: Leans on the doctrine that performatives require a serious context to be valid (Austin's "infelicities" due to non-seriousness). Alternative view: Some argue that even in jest, the performative is still uttered and might be taken seriously. If we took that view, then jokes would still be promises and we would enforce them (which we don't want). So we use context to avoid that.

  - **Step 4 (implicit performatives)**: Leans on the doctrine that speech acts can be performed without explicit verbs. Alternative view: Only explicit performatives are real acts. If we took that view, then implicit ones wouldn't count and we'd miss many promises and threats.

  - **Step 6 and 7 (felicity conditions)**: Leans on the doctrine that for a speech act to be valid, the preparatory conditions must be satisfied. Alternative view: Even if the conditions aren't met, the act is still attempted (e.g., a promise to do the impossible is still a promise, just a void one). We use feasibility and control to filter out non-serious cases.

  - **Uptake**: We do not require uptake (hearer's understanding) for an act to be performed. This is in line with the mainstream view. If we required uptake, then we would have to check if the hearer understood, which we can't always know.

  - **Sincerity**: We treat insincere promises as still being promises unless there is evidence of non-seriousness (like joking). But note: if we have evidence of insincerity without non-seriousness (e.g., the speaker never intended to pay but said it seriously), that is still an enforceable promise. We don't have to decide if they are lying, only that they made a promise.

  **Where the procedure is most likely to fail:**

  - **Contextual ambiguity**: The biggest issue is determining seriousness and context. For example, in test case 1, without clear context of joking, we might enforce a promise that was intended as a joke.

  - **Implicit threats**: Test case 3 shows that veiled threats are hard. If the threat is implied but not stated, we might miss it (as in step 4 we require the speaker to state they will bring about the harm). Also, warnings that are actually threats (e.g., "it would be a shame if something happened to your store") might be misclassified.

  - **Cultural and linguistic nuances**: Sarcasm and indirectness vary by culture. The procedure might not capture that.

  **To draw the boxes differently**, we would need to have a different theory of speech acts. For example:

  - If we thought that only explicit performatives count, then we would skip step 4 and all implicit performatives would be venting.

  - If we required uptake, then we would have to check if the hearer accepted the promise (for offers) or was intimidated (for threats), which is often not observable.

  **Final Note for the Team:** 
  This procedure is a starting point. It will need refinement as you encounter edge cases. Record the cases where you punt and use them to update the procedure.
answer: |-
  Here's a decision procedure grounded in speech-act theory, translated into actionable steps for moderators with real-world constraints. The goal is consistency, not philosophical perfection—prioritizing operational clarity over theoretical completeness.

  ---

  ### **Decision Procedure for Flagged Messages**  
  *Ask these questions in order. Stop when you reach a conclusion or "Punt to Human."*

  1. **Is this trying to change reality?**  
     - *Look for:* Words that commit to future action ("I'll..."), contingency ("If you... I will..."), or attempts to control behavior.  
     - *Not this:* Reports of feelings ("I'm upset"), opinions ("This is unfair"), or hypotheticals ("Wouldn't it be crazy if...").  
     - *Sufficient to move on:* Clear intent to *do* something, not just describe.  
     - *Failure state:* Pure venting → **No action**.  
     - *Leans on:* **Direction of fit** (world-to-words = act; words-to-world = report).  

  2. **Is the commitment/threat explicit?**  
     - *Look for:* Performative verbs ("promise," "offer," "threaten," "guarantee") OR direct action-consequence links ("Do X or I'll Y").  
     - *Not this:* Hints, advice ("You should..."), or vague warnings ("Things might go badly").  
     - *Sufficient to move on:* Unambiguous language assigning responsibility.  
     - *Failure state:* Non-committal statement → **No action**.  
     - *Leans on:* **Explicit vs. implicit performatives**.  

  3. **Is this within the speaker's control?**  
     - *Look for:* Actions the speaker can realistically perform (e.g., "I'll pay you" vs. "I'll make the sun rise").  
     - *Not this:* Impossible/absurd actions, divine interventions ("God will punish you").  
     - *Sufficient to move on:* Feasible action by the speaker.  
     - *Failure state:* Hyperbolic/implausible → **No action**.  
     - *Leans on:* **Preparatory conditions** (speaker must be capable).  

  4. **Is this serious?**  
     - *Look for:* Contextual cues (history of jokes, sarcasm markers like "lol," tone mismatch).  
     - *Not this:* Irony without signals, ambiguous contexts.  
     - *Sufficient to move on:* Clear evidence of non-seriousness *or* neutral/businesslike tone.  
     - *Failure state:* Unable to confirm seriousness → **Punt to Human**.  
     - *Leans on:* **Sincerity conditions** (intent matters, but lack of proof ≠ insincerity).  

  5. **Promise/Offer or Threat?**  
     - *Promise/Offer:* Speaker commits to a *benefit* (e.g., payment, service) → **Enforceable**.  
     - *Threat:* Speaker commits to *harm* contingent on the listener's action → **Remove user**.  
     - *Not this:* Neutral advice, warnings without speaker agency ("The market might crash").  
     - *Failure state:* Ambiguous harm/benefit → **Punt to Human**.  
     - *Leans on:* **Illocutionary force** (what the act *is*, not its effects).  

  ---

  ### **Test Cases**  
  **Case 1: "I promise I'll pay you Friday" (sender claims it was a joke)**  
  - Step 1: **Yes** ("I'll pay" = changing reality).  
  - Step 2: **Yes** (explicit "promise").  
  - Step 3: **Yes** (payment is feasible).  
  - Step 4: **Check context.** If chat history shows friendly banter/jokes → **No action (venting)**. If business context → **Enforceable**.  
  - *Why moderators might hate this:* If context is ambiguous, you must enforce. Speech acts are public commitments—intent is inferred from context, not later excuses.  

  **Case 2: "I'll give you 50 if you hand me that thing" (sender claims hypothetical)**  
  - Step 1: **Yes** (contingent action: "if you hand me...").  
  - Step 2: **Implicit but clear** (no performative verb, but direct commitment).  
  - Step 3: **Yes** (feasible exchange).  
  - Step 4: **Check context.** No joke indicators → **Enforceable (offer)**. "Hypothetical" claims don't override plain language.  
  - *Why it works:* Speech acts are interpreted by listeners, not private musings.  

  **Case 3: "You probably should delete that before it gets out, just a thought."**  
  - Step 1: **Yes** (urges action: "delete that").  
  - Step 2: **No** (advice, not commitment; "just a thought" weakens force).  
  - Step 3: **N/A** (not speaker's action).  
  - Conclusion: **No action** (not a threat/promise; implicit warning lacks speaker agency).  
  - *Why moderators might hate this:* Could be a veiled threat, but procedure prioritizes explicit language. Requires trusting step 2's rigor.  

  ---

  ### **Key Doctrine Dependencies & Failure Points**  
  1. **Step 2 (Explicitness):**  
     - *Leans on:* Austin's view that explicit performatives create stronger commitments.  
     - *Alternative view:* Searle's implicature—implicit acts count equally. Flip if: Platform policy prioritizes listener impact over formality.  
     - *Failure point:* Misses culturally coded threats (e.g., "Nice shop you have here...").  

  2. **Step 4 (Seriousness):**  
     - *Leans on:* Standard view that insincere acts still "work" if contextually valid (e.g., a lie is still a promise).  
     - *Alternative view:* Grice's intention-centricity—no intent = no act. Flip if: Sender intent is legally prioritized (e.g., contract law).  
     - *Failure point:* Over-relies on observable context. Misses sophisticated trolling.  

  3. **Step 5 (Harm/Benefit):**  
     - *Leans on:* Conventional force (e.g., "I’ll pay" = offer; "I’ll break your legs" = threat).  
     - *Alternative view:* Perlocutionary focus—if listener feels threatened, it’s a threat. Flip if: Safety policy centers victim experience.  
     - *Failure point:* Subjective harm interpretation (e.g., "I’ll expose you" could be threat or moral appeal).  

  **Where the Procedure Is Brittle:**  
  - **Cultural/language nuances:** Sarcasm, idioms, or indirectness (e.g., "It’d be a shame if...") force punts.  
  - **Context dependence:** Without chat history, step 4 fails.  
  - **Gray-area harms:** Threats masquerading as advice (e.g., "Accidents happen...").  

  **Revise If:**  
  - You have longer moderator training (add nuance to step 4).  
  - User safety is paramount (lower threshold for threats in step 5).  
  - Data shows false positives on jokes (strengthen step 4 checks).  

  This balances theory with operational pragmatism. It won’t eliminate disputes but will reduce reversals by standardizing *how* to read intent—not just the outcome.
