prompt: |-
  As a journalist covering the archaeology of belief for a science-and-ideas quarterly, I am trying to design a diagnostic instrument for my readers: a decision tree that sorts not by labels but by concrete commitments about when a legend earns the status of history. I want it built around three canonical stress cases—the Trojan War, the Arthurian cycle, and the Exodus narrative—because each occupies a different quadrant of the evidentiary problem: a site that may match an epic poem, a figure who may anchor a regional resistance, and a collective migration for which material traces are contested or absent. The tree should open with a branch on whether physical correlation—stratigraphic destruction layers, settlement discontinuities, mass-burial patterns—is necessary at all, then move through whether heroic singularity must be recoverable, whether collective memory can preserve a historical kernel without identifiable protagonists, and whether the scale and social form of the claimed event—city-state siege, sub-Roman polity consolidation, or population displacement—alters the burden of proof in kind rather than merely in degree.

  Each leaf should carry the name of the position (maximalist, minimalist, mythicist, kernel-historian, narrative-functional, or unnamed if the combination is logically available but apparently unoccupied) together with its most awkward commitment, and you should flag any pair of leaves that the tree cannot genuinely separate, such as a minimalist stance that denies Anatolian stratigraphic correlations and a maximalist stance that accepts only post-Roman settlement continuity but no individual king. Finally, include one branch asking whether archaeological silence functions as disconfirmation or as neutral absence, since this is precisely where scholars diverge across the three cases without anyone being able to cite the others' literature in real time; the instrument should be answerable by reasoning through cases alone, not by consulting specialist archives.
reasoning: |-
  Okay, I need to design a decision tree for the journalist's article on archaeology of belief. The goal is to help readers determine when a legend becomes history, using three key cases: the Trojan War, Arthurian cycle, and Exodus. Each represents different evidentiary challenges—site correlation, heroic singularity, and contested migration evidence.

  First, I consider the tree's structure. The journalist specified starting with whether physical correlation is necessary. That's the first branch. Then branches on heroic singularity, collective memory without protagonists, and event scale affecting burden of proof. Finally, a branch on archaeological silence as disconfirmation or neutral absence.

  For positions, I recall standard terms: maximalist (accepts most tradition), minimalist (doubtful without evidence), mythicist (sees as pure myth), kernel-historian (believes core truth), narrative-functional (values societal role over facts). Need to map these to the leaves based on combinations.

  Each leaf must show the position name and its "most awkward commitment"—something logically required but uncomfortable, like denying evidence others accept. Also, flag if the tree can't separate certain stances, as with minimalists on Troy or maximalists on Arthur.

  The silence branch is crucial. Scholars disagree on whether no evidence disproves a story or just means absence. For example, Exodus lacks material traces, so minimalists see it as disproof, while others say it's neutral. Need to reflect that.

  I sketch the tree mentally. Start: Branch A asks if physical correlation is necessary. If yes, it leads to questions about that evidence. If no, it jumps to heroic singularity or collective memory. Then, depending on answers, it branches to scale affecting proof or silence.

  For the leaves: If someone says correlation is necessary and finds it for Troy but not Exodus, that might be maximalist for Troy but minimalist for Exodus. The awkward commitment could be inconsistency. If they say correlation isn't needed at all, that could be mythicist or narrative-functional, with awkwardness being ignoring archaeology.

  On heroic singularity: If required, and found, it supports Arthur or Trojan kings. If not, it allows kernel-historian views where the core event is real but heroes aren't identifiable.

  Scale affecting proof: Some might say a massive event like Exodus needs more proof, others that all scales have similar standards. This could distinguish positions.

  Finally, silence: If seen as disconfirmation, it leans minimalist; if neutral, it might allow kernel or maximalist views.

  I need to ensure the tree covers all combinations. For instance, a position that denies correlation but accepts heroic singularity might not exist—flag that. Or, minimalists who reject Anatolian layers for Troy but accept post-Roman continuity for Arthur—tree might not separate them well, so note it.

  Overall, the tree should be answerable just by thinking through the cases, not research. So keep questions concrete: "Does a destruction layer prove the Trojan War?" or "Can Arthur be real without a named king?"

  Once structured, I'll output the tree with branches and leaves, explaining the positions and awkward commitments.
answer: |-
  Below is a diagnostic decision tree designed to clarify positions on the historicity of legends like the Trojan War, Arthurian cycle, and Exodus. It focuses on **concrete scholarly commitments** rather than labels, using your three stress cases to test logical consistency. The tree progresses through five key questions, with each "leaf" (endpoint) naming a position, its most awkward commitment, and whether it applies coherently across all cases. Combinations that the tree cannot separate are flagged.

  ---

  ### **Decision Tree: When Does Legend Become History?**
  *Answer each question based on reasoning through the three cases (Trojan War, Arthurian cycle, Exodus). No specialist knowledge required—only comparative logic.*

  1. **Is physical correlation (e.g., destruction layers, settlement shifts, burial patterns) NECESSARY to establish historicity?**
     - **Yes** → Go to 2
     - **No** → Go to 3

  2. **Does the evidence from physical correlation CONVINCINGLY match the legend in at least one case?**
     - **Yes** (e.g., Troy’s destruction layer *could* align with Homer; Exodus’s absence of Sinai material *could* align with its narrative) →  
       - **Position:** *Contingent Maximalist*  
       - **Most Awkward Commitment:** *Must accept that Troy’s stratigraphy confirms a "Homeric" war while simultaneously rejecting Exodus due to lack of Sinai evidence, despite both relying on circumstantial archaeology.*  
       - **Case Consistency:** *Fails Exodus (silence = disproof) but works for Troy/Arthur if evidence exists.*
     - **No** (e.g., Troy’s destruction layer is too early/late; no Exodus trail in Sinai; Camelot’s archaeology is unverifiable) →  
       - **Position:** *Archaeological Minimalist*  
       - **Most Awkward Commitment:** *Must dismiss Troy’s destruction layer as coincidental, Arthur’s Tintagel pottery as trade debris, and Exodus’s lack of evidence as conclusive—even if textual or cultural evidence exists.*  
       - **Case Consistency:** *Applies uniformly but reduces all legends to "myth until disproven."*

  3. **Must "heroic singularity" (a specific, named protagonist) be recoverable archaeologically?**
     - **Yes** → Go to 4
     - **No** → Go to 5

  4. **Does heroic singularity alter the burden of proof? (e.g., Arthur requires a kingly grave; Agamemnon requires a palatial inscription; Moses needs no tomb but Exodus needs collective evidence)**
     - **Yes** →  
       - **Position:** *Scaled Literalist*  
       - **Most Awkward Commitment:** *Requires accepting Arthur as a "sub-Roman warlord" based on fragmented texts but rejecting Trojan leaders due to no inscribed swords—making proof standards arbitrary across similar legends.*  
       - **Case Consistency:** *Fails Troy (no names in strata) but may work for Arthur if "Ambrosius Aurelianus" is accepted.*
     - **No** →  
       - **Position:** *Heroic Historicist*  
       - **Most Awkward Commitment:** *Insists a figure like Arthur or Hector must leave direct evidence (e.g., a grave), but when none exists (e.g., Arthur’s Glastonbury cross is forged), defaults to "probably mythical"—undermining all heroic legends.*  
       - **⚠️ Cannot Separate From:** *Archaeological Minimalist (2→No) if no heroic evidence exists anywhere.*

  5. **Can collective memory preserve a "historical kernel" without identifiable protagonists?**
     - **Yes** → Go to 6
     - **No** →  
       - **Position:** *Narrative-Functionalist*  
       - **Most Awkward Commitment:** *Denies that Exodus *or* Arthur *or* Troy need any historical basis—their value lies in societal function (e.g., Exodus as liberation metaphor). Yet must explain why cultures invest in "false" memories with such specificity.*  
       - **Case Consistency:** *Works uniformly but voids history from legend entirely.*

  6. **Does the SCALE/SOCIAL FORM of the event alter the burden of proof in kind (not degree)?**
     - **Yes** (e.g., city-state siege ≠ tribal migration ≠ polity consolidation) →  
       - **Position:** *Contextual Kernel-Historian*  
       - **Most Awkward Commitment:** *Exodus (large migration) requires higher proof than Arthur (local resistance), but both lack direct evidence—forcing Exodus into "myth" while Arthur remains "plausible" on weaker grounds.*  
       - **Case Consistency:** *Fails Exodus unless absence is neutral.*
     - **No** → Go to 7

  7. **Does archaeological silence function as DISCONFIRMATION or NEUTRAL ABSENCE?**
     - **Disconfirmation** (Silence = evidence against) →  
       - **Position:** *Empiricist Minimalist*  
       - **Most Awkward Commitment:** *Exodus’s lack of evidence disproves it, but Troy’s destruction layer (even if misdated) is "not silence"—creating a double standard where absence condemns Exodus but ambiguous evidence rescues Troy.*  
       - **⚠️ Cannot Separate From:** *Archaeological Minimalist (2→No) if no physical evidence exists.*
     - **Neutral Absence** (Silence ≠ disproof; other evidence suffices) →  
       - **Position:** *Cultural Maximalist*  
       - **Most Awkward Commitment:** *Accepts Exodus as history based on textual tradition alone, but must also accept Arthur’s 12 battles or Trojan alliances without corroboration—risking "anything goes" if standards are too flexible.*  
       - **Case Consistency:** *Works for all cases but ignores contradictory evidence.*

  ---

  ### **Key Insights from the Tree**
  - **Unoccupied Leaves:** No position demands heroic singularity *and* scale-altered proof *and* silence as neutral—this combo is logically possible but unused, as it would require untenable contradictions (e.g., "Arthur must be a named king, but his lack of evidence is fine because resistance is small-scale").  
  - **Ambiguous Separations:**  
    - "Archaeological Minimalist" (2→No) and "Empiricist Minimalist" (7→Disconfirmation) overlap if physical evidence is absent everywhere.  
    - "Heroic Historicist" (4→No) and "Archaeological Minimalist" (2→No) conflate when heroic evidence is missing.  
  - **Core Divide:** The silence question (7) splits scholars irreconcilably: minimalists see Exodus’s lack of proof as fatal; maximalists attribute it to nomadic lifestyles or biased preservation.  
  - **Diagnostic Power:** By forcing commitments across *all three cases*, the tree exposes inconsistencies (e.g., accepting Troy’s strata but rejecting Exodus’s cultural memory). Positions like "mythicist" are absorbed into "narrative-functionalist" or "minimalist" leaves.

  ---

  ### **How to Use This Instrument**  
  Readers work through the tree by comparing the three cases:  
  - **Trojan War:** Does Hisarlik’s destruction layer validate Homer?  
  - **Arthurian Cycle:** Does post-Roman British conflict evidence support a "king" without a grave?  
  - **Exodus:** Does the lack of Sinai archaeology disprove a migration?  

  The "awkward commitments" reveal each position’s weakest point when applied universally. For instance, a *Cultural Maximalist* must equally trust Exodus’s texts and Arthur’s *Historia Brittonum*, despite both being compiled centuries later. This tree doesn’t resolve debates but maps the logical terrain, showing where scholars *must* disagree based on first principles.
