answer: |-
  Here’s a structured 90-minute seminar plan using Arrow’s Impossibility Theorem as applied to philosophical explanation aggregation. It leans into epistemic tensions (depth vs. tractability) to mirror political irreducibility.

  **Phenomenon:** "Why do humans experience *retrospective regret* for past choices they still rationally endorse?"  
  **Three Explanations:**  
  1. **Rational Reconstructionist (RR):** "Regret arises from re-evaluating past reasoning under new contextual knowledge."  
     - *Depth:* High (engages self-knowledge, rationality)  
     - *Tractability:* Low (hard to falsify subjective reasoning)  
  2. **Affective Primacy (AP):** "Regret is a pre-cognitive affective response triggered by counterfactual imagery."  
     - *Depth:* Medium (links emotion/cognition)  
     - *Tractability:* High (measurable via neuroimaging)  
  3. **Temporal Self-Alienation (TSA):** "Regret stems from the present self’s inability to identify with past agency."  
     - *Depth:* Very High (existential, narrative identity)  
     - *Tractability:* Very Low (abstract, phenomenological)  

  ---

  ### **Timeline & Rules**  
  *(Total: 90 mins)*  

  1. **Introduction (5 mins)**  
     - *Materials:* Whiteboard, handout of the 3 explanations with their depth/tractability trade-offs.  
     - *Task:* Frame the goal: "As a group, produce a *single collective ranking* of these 3 explanations for regret, reflecting our joint epistemic judgment. You’ll design your own aggregation rule."  
     - *Incentive:* "If you agree on a full ranking (no ties) by 70 mins, you earn collective recognition as 'Master Aggregators' on the department blog. Fail to agree, and the offer expires."  

  2. **Individual Card Review (5 mins)**  
     - *Materials:* 10 private cards (see distribution below). Each card shows a strict ranking (1st, 2nd, 3rd) of RR, AP, TSA based on an *individual weighting* of depth vs. tractability.  
     - *Instruction:* "Do not share your card yet. Note *why* your ranking feels compelling to you."  

  3. **Small Group Deliberation (15 mins)**  
     - Split into 2 groups of 5.  
     - *Task:* "Share your rankings. Discuss tensions between depth and tractability. Propose 1-2 aggregation rules for the whole group to use later (e.g., ‘Prioritise depth’, ‘Average Borda scores’, ‘Pairwise votes’)."  

  4. **Aggregation Rule Design (10 mins)**  
     - Whole class. Groups pitch rules. Class *must* vote to adopt **one** rule (e.g., "Pairwise majority, with Borda tiebreaker").  
     - *Crucial:* Record the chosen rule visibly.  

  5. **Collective Ranking Attempt (20 mins)**  
     - *Task:* Apply the chosen rule to all 10 rankings. Aim for a full collective ordering.  
     - *Predictable Failure:*  
       - **Cycle:** RR > AP (7-3), AP > TSA (6-4), TSA > RR (7-3).  
       - **Phantom Dictator:** One student (Card 10) has RR>AP>TSA, aligning with all majority pairs.  
       - *Likely Student Errors:*  
         - Merging dimensions: "Let’s just debate which is *best overall*!" → Violates *independence* by ignoring original criteria.  
         - Assuming compromise: "TSA is deepest, so it *must* win" → Ignores aggregation rule, imposes external values.  
         - Abandoning rule: "This is messy—let’s vote again!" → Highlights *path-dependence*.  

  6. **Debrief & Theorem Reveal (35 mins)**  
     - **Step 1:** Let frustration simmer. Ask: *"What broke down? Why was unanimous agreement impossible?"*  
     - **Step 2:** Introduce Arrow: "You encountered Arrow’s Impossibility Theorem (1950): *No* aggregation rule can convert individual rankings into a collective ranking while satisfying 4 reasonable conditions."  
     - **Map Breakdown to Conditions:**  
       | **Arrow’s Condition** | **Your Group’s Failure** |  
       |------------------------|--------------------------|  
       | **Unrestricted Domain (UD)** | *Simplified here:* I gave only 6 card types (see below). *Explain later:* "Real preferences are wilder—UD assumes *any* ranking is allowed, deepening impossibility." |  
       | **Pareto Efficiency** | If everyone ranked RR > AP, group must too. (Likely satisfied but trivial here). |  
       | **Independence of Irrelevant Alternatives (IIA)** | *VIOLATED:* When debating RR vs. AP, students invoked TSA’s "depth" as a reason. But under IIA, RR vs. AP should *only* depend on individual RR/AP rankings! Your "depth" arguments broke IIA. |  
       | **Non-Dictatorship** | *VIOLATED?* Card 10’s ranking matched every majority outcome. But was s/he a *dictator*? No—the group *chose* pairwise voting, creating accidental alignment. Arrow proves *no rule* avoids such a "phantom dictator". |  
     - **Step 3:** Discuss simplifications:  
       - *UD Gap:* "I restricted card types. But imagine if one student ranked TSA > RR > AP *because it’s Tuesday*. Arrow’s theorem holds even then—hence its strength."  
       - *Why Philosophy?* "Voting isn’t just about power. When explanations conflict on incommensurable values (depth/tractability), *any* aggregation forces trade-offs that feel irrational."  

  ---

  ### **Materials & Card Distribution**  
  - **Cards (10 students):**  
    - **Cycle Generators (6 cards):**  
      - Type A (×2): RR > TSA > AP  *(Depth-focused, distrusts empiricism)*  
      - Type B (×2): AP > RR > TSA  *(Balanced but pragmatic)*  
      - Type C (×2): TSA > AP > RR  *(Depth-obsessed, rejects compromise)*  
    - **Majority Anchors (3 cards):**  
      - Type D (×3): AP > TSA > RR  *(Tractability-focused)*  
    - **Phantom Dictator (1 card):**  
      - Type E (×1): RR > AP > TSA  *(Matches all pairwise majorities)*  

  - **Profile Math:**  
    - RR > AP: Types A(2), D(3), E(1) = 6 votes vs. Types B(2), C(2) = 4 → RR wins 6-4.  
    - AP > TSA: A(2), B(2), D(3), E(1) = 8 vs. C(2) = 2 → AP wins 8-2. (*Adjust if needed*)  
    - TSA > RR: B(2), C(2), D(3) = 7 vs. A(2), E(1) = 3 → TSA wins 7-3.  

  ---

  ### **Pedagogical Notes**  
  - **Why It Works:** Students *feel* the cycle (frustration) and IIA violation (arguing irrelevancies). The "phantom dictator" is revealed post-hoc, unsettling naive majoritarianism.  
  - **British English Touch:** Use "maths," "timetabling," "trade-offs," "whilst," and frame regret as a "sticky wicket" of moral psychology.  
  - **During Debrief:** Hammer IIA—"Did TSA’s sheer depth *irrelevantly* sway your RR/AP vote? That’s why Arrow demands we ignore alternatives outside a pair."  

  This design forces epistemic humility: aggregating "best explanations" is as logically fraught as aggregating votes. The recognition incentive mirrors real-world stakes (e.g., journal publication rankings), ensuring genuine engagement.
