prompt: |-
  You are a decision theorist who also teaches — graduate seminar experience plus a lot of one-off adult-education sessions — and you know how these ideas actually land on a room of smart non-specialists. Before you draft anything, spend some effort brainstorming: write down, for yourself, the two or three sentences you would want a participant to be able to say on the way out the door, then work backwards to the sequence that makes those sentences available. I want the reasoning behind the ordering, not a tidy-looking outline.

  The situation: I have been reading LessWrong since the Overcoming Bias days, and I run the monthly "hard problems" session at my city's rationalist meetup. Next month I get ninety minutes, a whiteboard, a projector, and no handouts beyond one index card per person. The room will be about twenty people: mostly working software engineers, three econ/biostat grad students, one retired math teacher, and one guy who has read the relevant encyclopedia article and will say "it's just conditional convergence" within the first five minutes — tell me whether to recruit him or shut him down, and when. Everyone there has met the St. Petersburg paradox before; maybe a third have a vague memory of the Pasadena game; nearly all of them have "shut up and multiply" as a reflex, which is precisely the habit I need to put pressure on for an afternoon.

  The topic is the Pasadena game and, more specifically, what it means that this gamble's expected value is undefined rather than merely infinite.

  Do not explain the paradox to me — I know it. Plan how I explain it. Concretely, give me:

  1. The dependency-ordered sequence, in four to six beats with rough minute marks: what has to be in place before what, and why. In particular, whether to open with St. Petersburg as a warm-up, given that it is the one thing in the room they all already know and the one thing most likely to make them file the new material under "infinite expected value, handled that already."

  2. The single example that carries the whole session, with an explicit account of what such an example must have and what it must lack. My own guess is that it must have payoffs denominated in dollars rather than in utils, a probability structure they can simulate in their heads, and a time-order sum that converges to a definite finite number, so that the temptation to accept that number is real; and that it must lack infinite positive expectation, so that nobody can retreat to the St. Petersburg moral. Tell me what I have wrong, and tell me why two candidate carriers I am tempted by — St. Petersburg itself, and a two-envelope-style framing — would each distort something.

  3. A misconception table: the misconception, why this particular audience brings it, the exact beat at which to defuse it, and one sentence of what I should say. The ones I expect are: "undefined just means infinite, same lesson as St. Petersburg"; "bounded utility, or log utility, dissolves it, so there is nothing here"; "the reordering is a math trick with no decision-theoretic content, since the gamble is just a function from outcomes to probabilities and that is order-invariant"; "the coin-flip order is privileged, so the answer is ln 2, end of story"; "this is an artifact of infinite precision, no finite agent could ever be offered it, so it cannot matter."

  4. Where in the sequence to place the fact that the partial sums in the natural order do converge — that the naive sum gives you a number — and why saying it too early collapses the whole session into "so it is ln 2, and the puzzle was conditional convergence."

  5. Two devices of my own that I want you to place, revise, or reject outright. First, my "shuffled Pasadena": a sequence of finite games, each assigning zero outside a growing finite set of outcomes, where the sets grow to cover every outcome, so that at each stage you have a perfectly ordinary finite gamble and in the limit you have exactly the Pasadena game — but the expectations of these finite approximants converge to whatever target I like. My claim is that this shows the value ln 2 comes from the temporal structure of the coin-flipping process rather than from the gamble considered as a distribution over payoffs, and that "take the limit of finite truncations" does not single out ln 2 unless you privilege one approximating sequence. Is that the right instrument, and does it belong before or after the rearrangement point? Second, a spreadsheet demo: have a few people simulate repeated plays on their phones and watch the running average fail to settle. I believe this is right but I am not certain it will show what I want it to show, and I would rather cut it than have it misfire.

  6. The exit check on the index card: the question that distinguishes someone who has understood from someone who has learned the phrase "the expectation is undefined." Tell me what a near-miss answer looks like and what a real one looks like, and in particular what a participant would have to say to count as having a positive grip on the issue rather than just a negative one.

  7. What I should pointedly refuse to explain at this level, and say out loud that I am refusing.

  Constraints: no reading list, no citations, no "the literature distinguishes" — I want the teaching plan and nothing else. Do not spend words flattering the setup. If any part of what I have proposed above is confused, or if one of my beats is in the wrong place, say so plainly; I would rather be corrected in the plan than discover it in front of twenty people.
reasoning: |-
  Okay, let me try to unpack this user's request. They're planning a 90-minute session on the Pasadena game for a rationalist meetup, and they need a teaching plan that really makes the concept stick. The audience is technically savvy but not decision theory specialists - mostly software engineers with some math/econ background. 

  Hmm, the core challenge here is making people understand why "undefined" is fundamentally different from "infinite" expectation. The user's worried participants will dismiss it as just another St. Petersburg variant. I need to find a way to shatter that equivalence.

  First, I should identify the key takeaways. What do I want participants to say leaving the room? Probably: "It's not that the value is too big to handle - it's that no single value makes sense mathematically" and "How you approach the gamble changes the answer". Those become my North Star for structuring the session.

  Looking at their proposed sequence... Starting with St. Petersburg seems necessary but risky. If I spend too long on it, people tune out. If I gloss over it, they miss the contrast. Maybe a lightning-quick 5-minute recap focusing solely on "we have techniques for infinite expectations" as setup for "but here's something those techniques can't handle".

  The example choice is critical. Their idea of dollar-denominated payoffs is good - keeps it concrete. But St. Petersburg itself won't work because it leads back to familiar territory. The two-envelope variant might confuse the issue with different paradox mechanics. Need something where the partial sums converge conditionally but not absolutely... the original Pasadena structure might actually be best if presented right.

  Ah, the misconceptions list is telling. This audience will absolutely say "just use log utility" or "it's conditional convergence, big deal". Those need surgical takedowns at specific moments. Like when someone mentions bounded utility, I should immediately counter with "but the payouts are in dollars, not utils - the problem exists even before utility functions".

  The "shuffled Pasadena" idea is golden. That belongs right after showing rearrangement matters - demonstrates how the limit depends entirely on your approximation path. The spreadsheet demo though... risky. With finite samples, the average might coincidentally stabilize and undermine the point. Probably better to cut it.

  For the exit card, asking "what would happen if two people played differently?" forces them to confront the core insight. A near-miss would be "they get different averages" - no, the point is their calculation methods yield different theoretical expectations before any coins are flipped.

  And I must refuse to dive into measure theory or Kolmogorov axioms. When the math teacher asks, just say "We're staying in the realm of Riemann sums today" - keeps it accessible.

  Timing is tight. 90 minutes disappears fast. Need to allocate: 5min intro, 15min setup, 20min Pasadena walkthrough, 15min rearrangement demo, 20min approximation sequences, 10min implications, 5min card exercise. Leave buffer for that one guy who'll interrupt about conditional convergence - shut him down early by saying "Yes exactly, and that's why we can't treat it as convergent" then revisit his point properly during rearrangement section.
answer: |-
  Here’s the sequence designed to force participants to confront **why undefined ≠ infinite** and why "shut up and multiply" fails. Target exit sentences:  
  1. *"It’s not that the value is infinitely large—it’s that no single number can be the expectation at all."*  
  2. *"How you *approach* the gamble changes the answer, so the gamble itself can’t have a ‘true’ expected value."*  
  3. *"Finite approximations work, but the limit depends on how you truncate—so the gamble’s structure doesn’t dictate a value."*

  ---

  ### **Sequence (85 min + 5 min buffer)**  
  **1. St. Petersburg Lightning Recap (5 min)**  
     - *Why now?* Reactivate intuition for infinite expectation.  
     - *Key move:* Have them compute partial sums: $S_n = \sum_{k=1}^n \frac{1}{2^k} \cdot 2^{k-1}$. Show $S_n = n/2 \to \infty$.  
     - **Crucial:** Highlight that order doesn’t matter. Rearrange terms? Sum still diverges to $\infty$.  
     - *Shut down "conditional convergence guy" here:* "Yes, St. Petersburg diverges unconditionally. But what if reordering *changes* the sum?" (Pivot to next.)  

  **2. Introduce Pasadena Game (15 min)**  
     - Describe payoffs: $(-1)^{k-1} \cdot \frac{2^k}{k}$ for heads on flip $k$.  
     - **Simulate partial sums in natural order:** Have them compute $S_3$, $S_5$, $S_{10}$ live. Show oscillation *with growing amplitude*:  
       $S_1 = 2$, $S_2 = 2 - 2 = 0$, $S_3 = 0 + 8/3 \approx 2.67$, $S_4 \approx 2.67 - 4 = -1.33$, etc.  
     - *Why this first?* They see a number emerge temporarily ($S_2=0$, $S_4<0$), tempting them to "accept" it. Then $S_5>0$ shatters that.  

  **3. "What’s the sum?" Trap (10 min)**  
     - *Pose the crisis:* "Your partial sums oscillate forever. But if you sum *all* terms, is there a ‘right’ answer?"  
     - **Reveal the naive sum converges to $\ln 2$** (≈0.693). *Why now?* If revealed earlier, they latch onto $\ln 2$ as "the answer." Now, it feels suspicious.  
     - *Defuse "it’s just $\ln 2$":* "But why trust *this* order? The coin flips could be recorded in any sequence!"  

  **4. Rearrangement Demo (15 min)**  
     - Rewrite payoffs in order: all positive terms first, then negatives.  
       Sum positive terms: $\frac{2}{1} + \frac{8}{3} + \frac{32}{5} + \cdots \to \infty$  
       Sum negative terms: $-\frac{4}{2} - \frac{16}{4} - \frac{64}{6} - \cdots \to -\infty$  
     - *Punchline:* "Depending on *how you group the outcomes*, you get $+\infty$, $-\infty$, or $\ln 2$. The gamble doesn’t prefer one over another."  
     - **Kill misconception 3 ("order doesn’t matter"):** "The *map* of outcomes to probabilities is fixed, but the *sum* of payoffs isn’t order-invariant. Decision theory needs a number to act—here, there isn’t one."  

  **5. Shuffled Pasadena (Your Device, 20 min)**  
     - *Place here* (after rearrangement). Define finite approximations:  
       - *Version A:* First $N$ flips (natural order). Expectation $\to \ln 2$.  
       - *Version B:* First $M$ positive-payoff outcomes, then $M$ negative. Expectation $\to +\infty$ then drops.  
     - **Why this works:** They see identical distributions (all finite gambles are well-behaved), but limits diverge based on *how you grow the support*.  
     - *Refute "privileged order" misconception:* "If you insist coin-flip order is ‘real,’ why do finite players (who respect order) disagree on the limit?"  

  **6. Implications & Utility Red Herring (15 min)**  
     - *Confront "bounded utility solves this":* "If payoffs are in dollars, not utils, the problem exists *before* utility functions. Changing utils reshapes payoffs—it doesn’t fix the mathematical indeterminacy."  
     - *Cut "artifact of infinity" misconception:* "Finite agents *can* face this: imagine a contract paying Pasadena rewards. How much would you pay to buy it? No single price is ‘fair’."  
     - *Kill "undefined = infinite" once more:* "Infinity is *one* answer you can get. Undefined means *no consistent answer*."  

  **7. Spreadsheet Demo? REJECT**  
     - *Why:* Empirical averages might coincidentally stabilize, implying "it converges in practice." Or they oscillate visibly—but participants may blame "slow convergence." Distracts from the *mathematical* point.  

  ---

  ### **Misconception Defusal Table**  
  | Misconception                          | Audience Trigger                     | Defusal Beat          | One-Sentence Response                                                                 |
  |----------------------------------------|--------------------------------------|-----------------------|---------------------------------------------------------------------------------------|
  | "Undefined ≈ infinite"                 | St. Petersburg intuition             | After rearrangement   | **"Infinity is *one* answer rearrangement gives you. Undefined means *every* answer is possible."** |
  | "Bounded utility dissolves it"         | "Shut up and multiply" reflex        | Implications section  | **"The problem is summing dollar payoffs—it fails *before* we apply utility functions."**           |
  | "Reordering is a math trick"           | Formalist view of probability        | After rearrangement   | **"The sum *is* order-dependent. Decision theory needs a number—which order is ‘correct’?"**        |
  | "Coin-flip order is privileged"        | Temporal intuition                   | Shuffled Pasadena     | **"Finite agents using the same order disagree on the limit. The privilege isn’t in the structure."**|
  | "Artifact of infinite precision"       | Engineer’s pragmatism                | Implications section  | **"How much would you pay to play? No price is fair *even in theory*. The indeterminacy is fundamental."** |

  ---

  ### **Exit Check on Index Card**  
  **Question:** *"If two people calculate the expected value of the Pasadena game using different methods, could both be ‘correct’? Why?"*  
  - **Near-miss:** "Yes, because the sum diverges." *(Still implies "it’s infinite," misses conditional convergence.)*  
  - **Real answer:** "Yes—one might get $\ln 2$, another $+\infty$, another $-\infty$. All are valid sums of the same terms; no method is uniquely rational."  
  - **Positive grip:** Cites *specific* valid sums (e.g., $\ln 2$ vs. $\infty$) and notes the gamble doesn’t break ties.  

  ---

  ### **What to Refuse**  
  When the math teacher asks, *"But what about Lebesgue integration?"* say:  
  > **"We’re treating the expectation as an infinite series—which is how the paradox was framed. Lebesgue sums won’t resolve this: absolute convergence fails, so the integral is still undefined. We’d need to change the gamble."**  
  *(Do not explain Fubini’s theorem. Do not discuss non-principal values.)*

  ---

  ### **Why This Sequence?**  
  - **St. Petersburg first** to exhaust the "it’s infinite" intuition. Rearrangement in Pasadena then *shocks* them.  
  - **Naive sum ($\ln 2$) revealed late** to prevent anchoring. They feel its arbitrariness.  
  - **Shuffled Pasadena after rearrangement** proves the limit depends on approximation *path*, not just the distribution.  
  - **No handouts/proofs**—force them to simulate sums mentally. The discomfort is pedagogical.  

  **Recruit "conditional convergence" guy early:** His interjection ("it’s just conditional convergence!") at **Step 4** becomes a hook. Respond: *"Exactly. But in decision theory, conditional convergence isn’t enough—you need a reason to sum one way rather than another. What’s yours?"***  
  (He’s an asset if managed; let him amplify the crisis.)
