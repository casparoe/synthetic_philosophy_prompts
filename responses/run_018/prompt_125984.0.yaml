  But I suspect Pettit would object to this framing. Let me think about why. The key is that domination creates a power relationship that persists even when interference isn't occurring. In their modal analysis, the user is still focusing on interference - just spread across worlds. But for Pettit, the evil of domination exists even in worlds where interference never happens.

