answer: |-
  Your concept is fascinating and pushes beyond standard philosophical binaries. You're right that neither numerical identity ("same soul, different outcome") nor counterpart theory ("separate duplicate") captures Mara's state. What you're describing is a **transworld psychological haunting with partial ontological entanglement**—and while there's no single established term, I can unpack the ideas and suggest precise language.

  ### Why Standard Theories Fail
  1. **Numerical Identity** (Kripke, Chisholm): Assumes a core "self" persists across possible worlds. But Mara *isn't* the same individual transplanted; her history diverges fundamentally (no brother).
  2. **Counterpart Theory** (Lewis): Each world has distinct individuals who merely *resemble* each other. But Mara's vivid, bodily memories aren't just resemblance—they imply a metaphysical connection to another timeline's events.

  ### Your "In-Between" Concept: Key Elements
  - **Non-Identical Inheritance**: Mara inherits fragments of another self's experience without inheriting that self's *identity* or history.
  - **Asymmetrical Haunting**: She's haunted by a trauma that "belongs" to a version of her who *did* exist in that context, yet she feels it as her own.
  - **Ontological Bleed**: The boundary between possible worlds is permeable for *qualia* (subjective experience) but not for facts.

  ### Philosophical Anchors & Suggested Terms
  1. **Parfit's "Quasi-Memories" (Extended):**  
     Derek Parfit suggested "quasi-memories" (q-memories) as memories of experiences that aren't *yours* but feel identical. Your twist: **Transworld Q-Memories**.  
     *Why it fits:* Mara's memories aren't false; they're "real" but imported from a non-actualized possibility. She has q-memories of an event that never occurred *in her world* but did occur for a counterpart.

  2. **Possible Worlds with Causal Residue:**  
     Mara’s universe carries **metaphysical scars** from nearby possible worlds. Think quantum decoherence, but for consciousness.  
     *Term:* **Decoherent Identity** or **Quantum Haunting**.  
     *Why it fits:* Like quantum particles retaining entanglement, Mara is "entangled" with a drowned-brother timeline’s emotional residue.

  3. **Schelling’s "Unlived Life" Phenomenology:**  
     The existential weight of paths not taken. Mara doesn’t just *regret* not saving a brother; she *remembers* saving him despite his non-existence.  
     *Term:* **Anachronic Trauma** or **Paradoxical Mourning**.  
     *Why it fits:* She grieves a brother who never existed, haunted by a rescue she never performed.

  4. **Deleuze's "Virtual" vs "Actual":**  
     The drowning exists in the *virtual* realm (a real but non-material plane of potential) and intrudes into Mara’s *actual* world.  
     *Term:* **Virtual Memory Intrusion** or **Actualized Potential**.  
     *Why it fits:* The event is "real" as potential, and its emotional imprint crosses into her reality.

  ### What to Call It? Coining a Term
  - **Best Options:**  
    - **Echo-Identity** (as you suggested): Implies resonance without source.  
    - **Palimpsest-Self**: Layers of alternate experiences overwriting her identity.  
    - **Counterpart Haunting**: Focuses on the source of the memories.  
    - **Transworld Psychic Entanglement**: Highlights the metaphysical link.  

  ### Why This Isn't "Smuggling" Positions
  You’re exposing a gap in standard models. Philosophers assume worlds are causally isolated. Your Mara violates this by having:
  - **Epistemic Access**: She "knows" the drowning intimately.  
  - **Affective Binding**: She feels guilt/responsibility.  
  - **Somatic Echo**: Bodily memories without physical cause.  

  This isn’t logical inconsistency—it’s **phenomenological truth-telling**. Trauma *feels* timeless and transcontextual. Survivor’s guilt often manifests as "I should have died" even when no alternative existed. You’re literalizing this through speculative fiction.

  ### Narrative Strategy
  - **Lean into the Ambiguity**: Have characters debate whether Mara is "cursed," "quantum-damaged," or "metaphysically infected."  
  - **Show the Cost**: Does she lose agency? ("Am I *me* or just a vessel for her pain?")  
  - **Use the Uncanny**: Contrast her certainty about the memory with others’ insistence it’s impossible.  

  **In essence**: Mara isn’t "the same person" or "a different copy." She’s a **psychic wound manifesting across realities**, making her a singular node of transworld trauma. This is philosophy meeting dark fantasy—where identity isn’t defined by origin, but by the ghosts it accumulates.
