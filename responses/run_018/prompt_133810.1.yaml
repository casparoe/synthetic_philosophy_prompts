  ## Hole Argument: A Diffeomorphic Poem

  ### [Invariant Frame: Opening]
  The cosmos bends where matter’s currents flow;  
  Fixed stars decree the metric’s outer form.  
  No stress disturbs this vacuum’s calm below—  
  A hole, untouched by force or thermal storm.  
  At **P**, we search for gravity’s true face,  
  But find no mark to designate its place.  

  ### [Hole: Rearrangeable Points]
  At A, no feature, only void extends.  
  At B, a coordinate, bereft and bare.  
  At C, no line to start, no curve that ends.  
  At D, a locus floating in thin air.  
  At E, no distance etched, no angle shown.  
  At F, a nameless vertex, alone, unknown.  
  At G, no light cone’s edge, no future’s seam.  
  At H, a cipher in the metric’s scheme.  

  ### [Invariant Frame: Closing]
  Now shift the points—a smooth, deceptive slide—  
  The outer frame still holds its rigid sway.  
  At **P**, we grasp the absence, deep and wide:  
  Points hold no essence, drift like ghosts away.  
  The structure stands, all relations true—  
  The field alone defines what spacetime *is*, not who.  

  ---

  ### Notes on Structural Enactment  
  - **Frame Invariance**: The opening/closing hexameters are fixed except for "**P**", an indexical term designating an arbitrary point within the hole. Whether "P" refers to A, F, or H, the frame’s meaning remains unchanged.  
  - **Hole Permutability**: The central octet (lines 7–14) can be reordered freely (e.g., swap "At G" and "At D", or shuffle all labels). This mirrors a diffeomorphism acting solely within the hole—rearranging point-labels alters nothing in the frame’s rhyme, meter, or physical description.  
  - **Volta & Resolution**: The turn occurs at line 15 ("Now shift the points..."), where the reader realizes that if points had intrinsic identity, the metric *would* be underdetermined inside the hole. The resolution (lines 17–18) denies points independent reality, affirming that relational structure (the field) defines spacetime.  

  No points, no paradox—only field and form remain.
