     - Reveal scheduler's choice.
     - Calculate scores: for students, number of correct predictions (3 days). For scheduler, number of students who predicted "No" on the event day.

  7. Debrief (35 min): structured as below.

  Why this timeline: 
  - Day 1: no discussion, to get a baseline.
  - Day 2: small group discussion to share reasoning.
  - Day 3: full group discussion to force the backward induction to emerge.

  By Day 3, if they haven't done backward induction, the full group discussion might bring it up.

  Debrief mapping:

  - The announcement: at setup.
