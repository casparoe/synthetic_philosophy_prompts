          - The scheduler commits to a day by writing on a card, sealing in envelope, giving to facilitator. Announcement: "The box will be opened on one day this week, and it will be a surprise to the students."
          - Each day, students write a prediction at the start of the day: "Yes" if they think it will open that day, "No" if not.
          - After predictions are collected, facilitator reveals whether it is opened that day.
          - Scoring: students get 1 point for each correct prediction. Scheduler gets 1 point for each student who predicted "No" on the event day (i.e., surprised).

  2. Scheduler commitment (2 min): scheduler writes the day and seals it.

  3. Day 1 (5 min):
     a. Start of day: students have 2 min to think and write prediction for Day 1 (no discussion).
     b. Collect predictions.
     c. Facilitator checks: if Day 1, announce "Opened!" else "Not opened".
     d. Record.

  4. Day 2 (7 min):
     a. Start of day: students have 2 min to discuss in pairs or small groups their strategy for the remaining days. Then 1 min to write prediction for Day 2.
     b. Collect.
     c. Reveal.

  5. Day 3 (7 min):
     a. Start of day: 2 min group discussion (entire group) about what to predict. Then 1 min to write.
     b. Collect.
     c. Reveal.

