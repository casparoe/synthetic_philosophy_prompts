answer: |-
  ### Activity Design: The Surprise Lock-In

  **Overview**: This activity recreates the surprise exam paradox through a 3-day "event week" where participants experience backward induction, eliminate all possible days for a "surprise event," and then get surprised when it occurs. The scheduler is adversarial but committed in advance to ensure the announcement is trusted, mirroring the original puzzle's epistemic structure while adding stakes via a scoring system. The debrief explicitly maps the activity to the paradox and acknowledges limitations.

  ---

  ### Setup (5 minutes)
  - **Materials**: Index cards (one per student per day), pens, one envelope, one sheet of paper for the scheduler.
  - **Roles** (assign before explaining rules):
    - **Scheduler**: One participant familiar with the paradox (they understand the twist). Their goal is to maximize the number of surprised students.
    - **Students**: All other participants. Their goal is to accurately predict daily if the event occurs.
    - **Facilitator**: Runs the activity, enforces timing, and records outcomes.
  - **Facilitator Script** (key beats):
    - "We're running a 3-day activity. The scheduler has committed in advance to opening a 'lockbox' (a metaphorical event) on one day: Day 1, 2, or 3. The announcement: 'The lockbox will open on exactly one day this week, and its opening will be a surprise to all students.'"
    - "Each day, students will write a prediction: 'Yes' if you think the lockbox opens today, 'No' if not. Predictions are private and submitted before I reveal the outcome."
    - "Scoring:  
      - Students: 1 point per correct prediction (e.g., you predict 'No' and it doesn’t open, or 'Yes' and it opens).  
      - Scheduler: 1 point per student who predicts 'No' on the opening day (i.e., is surprised)."
    - "Important: The scheduler chose the day secretly at the start and cannot change it. I hold their commitment in this sealed envelope. Let’s begin."
  - **Scheduler Commitment**: The scheduler writes the chosen day (e.g., "Day 2") on paper, seals it in the envelope, and gives it to the facilitator. The scheduler should aim for a middle day (e.g., Day 2) to maximize surprise potential after backward induction.

  ---

  ### Rules and Timeline (35 minutes total)
  1. **Day 1 (5 minutes)**:
     - Students silently write predictions for Day 1 on index cards (no discussion).  
     - Facilitator collects cards, then reveals outcome: "The lockbox is [not] open today." (Check envelope privately; if Day 1, announce "open"; else "not open.")  
     - Record outcomes publicly (e.g., on a board: "Day 1: Not open").

  2. **Day 2 (7 minutes)**:
     - **Small-group discussion (2 minutes)**: Students discuss in pairs: "Given Day 1 didn’t open, what should we predict today and why?"  
     - **Prediction (1 minute)**: Students write Day 2 predictions individually.  
     - **Reveal (1 minute)**: Facilitator collects cards and announces outcome. Record.

  3. **Day 3 (7 minutes)**:
     - **Full-group discussion (3 minutes)**: Students discuss as a whole group: "Since Day 1–2 didn’t open, what must happen today? Can it still be a surprise? Why/why not?" (Facilitator intervenes only if backward induction stalls; e.g., "What if we get to Day 3 with no opening?").  
     - **Prediction (1 minute)**: Students write Day 3 predictions.  
     - **Reveal (1 minute)**: Collect cards, announce outcome. Record.

  4. **Scoring and Reveal (5 minutes)**:
     - Open the envelope to reveal the scheduler’s chosen day.  
     - Score students: 1 point per correct daily prediction (max 3).  
     - Score scheduler: 1 point per student who predicted "No" on the opening day.  
     - Declare "winners" (e.g., students with 3 points, scheduler with high surprise count). Use pride-based stakes: "Most points gets bragging rights in the debrief."

  ---

  ### Debrief (35 minutes)
  **Goal**: Connect activity moments to the paradox, then critique limitations.  
  **Facilitator Script** (structured as Q&A; reveal the paradox name at the start):  
  1. **Reveal the paradox (1 minute)**: "Today we experienced the *surprise exam paradox*. Let’s break it down."  
  2. **Mapping activity to paradox (15 minutes)**:
     - "When did you first feel convinced the event couldn’t happen? How did the group discussions contribute?" → Links to backward induction cascade.  
     - "At the start of Day 3, did anyone argue the event was impossible? What happened when it opened anyway?" → Highlights the surprise despite elimination.  
     - "Scheduler: Why did you choose your day? Did backward induction affect your choice?" → Shows adversarial intent vs. original teacher.  
     - Use the timeline to pinpoint:  
       - **Announcement**: Setup phase (trusted commitment).  
       - **Induction step**: Group elimination of Day 3 during Day 2–3 discussions.  
       - **Cascade**: Students extending elimination to Days 2 and 1.  
       - **Surprise**: Event occurring on a "eliminated" day (e.g., if Day 2 opened, students who predicted "No" were surprised).  
  3. **Limitations and broader insights (15 minutes)**:
     - "Where did this activity *diverge* from the original paradox? Specifically:  
       - The original has no adversary—the teacher isn’t trying to 'trap' students. Here, the scheduler’s incentives made the announcement feel like a game, not a truth.  
       - In the paradox, the announcement is self-referential and semantic ('this statement is surprising'). Our activity reduced it to a scoring rule, losing that loop."  
     - "Why does this matter? In real life, self-reference (e.g., 'this sentence is false') creates undecidability. The activity sidesteps this by making 'surprise' operational—we defined it via predictions. But the paradox’s core remains: logic says one thing, reality another."  
  4. **Group reflection (4 minutes)**: "When have you seen similar backward-induction failures? (e.g., project deadlines, AI timelines). How do we avoid over-relying on 'perfect' rationality?"

  ---

  ### Why This Design Works
  - **Core mechanism**: Students perform backward induction in discussions, eliminating days, but the scheduler’s pre-committed choice forces a surprise—creating visceral tension between reasoning and outcome.  
  - **Scheduler setup**: Committed in advance to ensure the announcement is trusted (like the original), but adversarial to incentivize backward induction. An adaptive scheduler would break the announcement’s truth; a non-adversarial one wouldn’t exploit the induction.  
  - **Handling foreknowledge**: Knowing participants are schedulers (their goal requires exploiting the paradox) or paired with newbies in Day 2 discussions (sharing insights without dominating).  
  - **Predictable issues**:  
    - **Gaming payoffs**: Students might always predict "No" to avoid missing a surprise. *Mitigation*: Scoring rewards accuracy, making mispredictions costly.  
    - **Refusing to update**: A student rejects backward induction. *Mitigation*: Group discussions pressure consensus; facilitator asks, "What if everyone reasoned like you?"  
    - **Time overruns**: Discussions run long. *Mitigation*: Use a timer; cap discussions at 2–3 minutes.  
    - **Scheduler bias**: Choosing Day 1 reduces surprise. *Mitigation*: Brief schedulers to pick middle days (e.g., "Day 2 maximizes surprise after induction").  

