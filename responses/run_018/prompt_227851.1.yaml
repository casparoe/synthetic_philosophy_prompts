  - The cascade: in the group discussion on Day 2 or Day 3, they might eliminate Day 3, then Day 2, then Day 1.

  - The surprise: when the event happens on a day they predicted "No".

  Known failure modes:

  1. Students always predict "No": then they are surprised on the event day, but they are incorrect on that day. They might do this if they believe the backward induction. But if the event is on Day 1, they are incorrect and surprised. But they might not care about correctness? We score correctness, so they have an incentive to predict correctly.

