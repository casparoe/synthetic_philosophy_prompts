  ### Practical Decision Procedure for Heritage Board  
  **Philosophical Foundation:**  
  - **Epistemicism**: A sharp cutoff exists (e.g., a precise year or feature), but we lack complete knowledge. We seek objective evidence to approximate this cutoff.  
  - **Supervaluationism**: No single cutoff exists; multiple "admissible precisifications" (criteria) are valid. A building is:  
    - **YES** if it passes *all* admissible criteria (super-true).  
    - **NO** if it fails *all* criteria (super-false).  
    - **INDETERMINATE** if results conflict (borderline case requiring value-based vote).  

  **30-Minute Checklist**  
  **Ordered Questions & Stopping Points**  
  1. **Clear Epistemic Threshold Check**  
     - *Question*: Is there **objective, undisputed evidence** placing the building firmly in "historic" or "non-historic" territory?  
       - *Sufficient YES*: Landmark status, listed on national registers, or universally acknowledged by experts.  
       - *Sufficient NO*: Built <30 years ago with no exceptional features, or altered beyond recognition.  
     - *Flow*:  
       - **YES** → Stop, approve.  
       - **NO** → Stop, reject.  
       - *Unclear* → Proceed to Step 2.  

  2. **Supervaluationist Criteria Assessment**  
     Evaluate 5 admissible precisifications (1 min each). For each, answer:  
     - **A. Age Integrity**: Is the building ≥50 years old *and* retains >70% original structure/materials?  
     - **B. Architectural Significance**: Is it an exemplary model of a recognized style, movement, or architect?  
     - **C. Historical Association**: Is it tied to major events, figures, or social changes (with documentation)?  
     - **D. Community/Cultural Role**: Has it hosted enduring communal activities (e.g., 20+ years of festivals, governance)?  
     - **E. Rarity/Innovation**: Is it a rare survivor or pioneering example of its type?  
     - *Scoring*:  
       - **Pass**: Clear, documented evidence.  
       - **Fail**: Evidence absent or insufficient.  
       - **Borderline**: Debatable/subjective evidence.  

  3. **Decision Matrix**  
     - **YES** if it passes **all 5 criteria** (super-true).  
     - **NO** if it fails **all 5 criteria** (super-false).  
     - **INDETERMINATE** if mixed results (e.g., passes some, fails others, or borderline criteria).  
     - *Flow*:  
       - **YES/NO** → Stop, final decision.  
       - **INDETERMINATE** → Proceed to Step 4.  

  4. **Value-Based Vote**  
     - *Only for INDETERMINATE cases*.  
     - Board votes: "Should we grant significance **despite borderline status**?"  
     - Majority wins.  

  ### Where the Procedure Misfires  
  - **False Negatives**: Young buildings with emerging significance may be rejected (Step 1).  
  - **Unpopular Outcomes**:  
    - Buildings failing **Step 2** due to strict "all-or-nothing" logic (e.g., old but altered).  
    - **INDETERMINATE** forces subjective votes, risking inconsistent outcomes.  
  - **Limitations**:  
    - **Cannot justify demolition** of borderline buildings—INDETERMINATE always triggers a vote.  
    - **Ignores intangible values** (e.g., nostalgia, aesthetics) in non-borderline cases.  
    - **Assumes criteria exhaustiveness**; may miss novel forms of significance.  

  ### Test Sentences for Any Proposal  
  Apply these to criteria B–E (A is quantitative):  
  - *Pass*: "This evidence is concrete, documented, and uncontroversial."  
  - *Fail*: "Evidence is absent, irrelevant, or disputed by experts."  
  - *Borderline*: "Evidence exists but is subjective, incomplete, or context-dependent."  

  ---

  ### Case Applications  
  **Case 1: 1923 Courthouse (100 years old)**  
  - **Step 1**: Clear epistemic YES (objectively "old" and landmark status).  
  - **Result**: **YES** (no further steps).  
  - *Why?* Epistemicism applies—sharp cutoff (age) is undisputed.  

  **Case 2: 1978 Brutalist Parking Garage (45 years old)**  
  - **Step 1**: Not clear (not universally accepted as historic/non-historic).  
  - **Step 2**:  
    - A. Age Integrity: **Fail** (<50 years).  
    - B. Architectural Significance: **Borderline** (exemplary Brutalism but divisive).  
    - C. Historical Association: **Fail** (no documented events).  
    - D. Community Role: **Fail** (no sustained communal use).  
    - E. Rarity: **Borderline** (rare but not unique).  
  - **Result**: **INDETERMINATE** (mixed/borderline criteria).  
  - **Step 4**: Value-based vote (e.g., 4–3 to approve).  
  - *Why?* Supervaluationism—conflicting admissible precisifications.  
  - *Unpopular Outcome*: Preservationists may protest if vote rejects it.  

  **Case 3: 1999 Community Center (24 years old; architect influential post-2010)**  
  - **Step 1**:  
    - Age <30 → Check for extraordinary non-age significance.  
    - B. Architectural Significance: **Borderline** (architect now famous, but building predates acclaim).  
    - Other criteria: **Fail** (no history/community role yet).  
  - **Result**: **NO** (fails Step 1; insufficient evidence to override youth).  
  - *Why?* Epistemicism—sharp cutoff for youth overrides borderline features.  
  - *Misfire*: Unpopular with architecture enthusiasts; ignores future significance.  

  ### What the Procedure Cannot Do  
  - **Justify demolition of borderline buildings**: INDETERMINATE always forces a vote, blocking automatic demolition.  
  - **Capture evolving significance**: Static criteria may overlook buildings "becoming" historic (e.g., Case 3).  
  - **Resolve subjectivity**: Values dominate in borderline cases, risking politicization.  
  - **Override community sentiment** in clear YES/NO cases (e.g., a 1923 courthouse can’t be voted down).  

  **Final Note**: This procedure prioritizes philosophical rigor over flexibility. It accepts that vagueness mandates value-based decisions when evidence conflicts—embracing supervaluationism’s core insight.
