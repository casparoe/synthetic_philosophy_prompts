  Third, the "revolutions consume their progeny" concern. Does her model allow real continuity or break rationality? She'll probably argue for rational threads in reconstruction. Follow-up: if hinges are rebuilt, can past science be judged rationally at all? This ties to scientific realism and whether truth is preserved.

