answer: |-
  Here's that adversarial collab doc drafted tight and technical like you asked – zero fluff, all gears exposed. Grammar’s loose per request, focus on the machinery.

  ---

  **Adversarial Collaboration: Closure Principle vs. Strict Nozickian Tracking**

  **Agreed Claims (Signed by both Closure Defender (CD) & Strict Tracking Theorist (STT)):**

  1.  **Formal Closure Principle (Single-Premise Deductive):** If S knows that *p*, and S competently deduces *q* from *p* (where *q* is a known deductive consequence of *p*), then S knows that *q*.
  2.  **Nozick's Tracking Conditions (Applied to Belief):** S knows that *p* via method M only if:
      *   **Sensitivity:** If *p* were false, S wouldn't believe *p* via M.
      *   **Adherence:** If *p* were true (in close possibilities where it *could* be false but is still true), S would still believe *p* via M.
  3.  **Intuition vs. Apparent Violation:** The closure principle (1) seems highly intuitive for competent deduction. However, applying tracking conditions (2) to cases involving entailments (like Zebra/Mule) *appears* to generate violations of closure. In Zebra: S knows "That's a Zebra" (*p*) via vision (sensitive/adherent), deduces "That's not a cleverly painted mule" (*q*), but tracking seems to fail for *q* because in the close world where it *is* a painted mule, S *would* still believe *q* is false (failing sensitivity for *q*).
  4.  **Substantive Dispute:** The disagreement isn't merely verbal ("knowledge" meaning different things). It crucially hinges on **how the belief-forming method M is individuated across the inferential step** (from believing *p* to believing *q*), and **how modal closeness is determined when evaluating the tracking conditions for *q* relative to the deduction**.

  ---

  **Disagreements Table**

  | Point of Disagreement                     | Closure Defender (CD) Position (Wording CD Accepts)                                                                 | Strict Tracking Theorist (STT) Position (Wording STT Accepts)                                                                 |
  | :---------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------- |
  | **1. When Closure Fails?**                | Closure *never* fails for competent deduction from known premises. Deduction isn't a new belief-forming method; it validly transfers warrant. | Closure can fail *specifically when* the tracking-relevant method M for believing *q* differs from the method M used to know *p*, or when the modal conditions required for tracking *q* aren't satisfied by the inference. |
  | **2. Modal Proximity for Evaluating *q*:** | When checking if S knows *q* (deduced from *p*), evaluate tracking conditions for *q* relative to **all nearby possible worlds simpliciter**. The method includes the perceptual basis *plus* the competent deduction. | When checking if S knows *q* (deduced from *p*), evaluate the *sensitivity* condition for *q* primarily relative to **nearby worlds where *p* is false** (since *q* is deduced from *p*). The method for *q* is often distinct. |

  ---

  **Cruxes & Predictions on Agreed Cases**

  **Crux 1: The Method-Transfer Problem**
  *   **Core Question:** When S knows *p* via method M_p (e.g., perception) and competently deduces *q* from *p*, is the method M_q for believing *q*:
      *   (CD) *The same extended method* (M_p + the deduction), so *q* inherits *p*'s tracking properties via the deduction?
      *   (STT) *A distinct method* (logical derivation based on M_p), potentially requiring its *own* tracking evaluation?

  **Agreed Case ("Modified Zoo - Variable Disguise"):**
  S is at the zoo, sees a zebra-striped animal in the zebra pen. Conditions are normal.
  *   *p*: "That animal is a zebra." (Known via vision M_p: Sensitive/Adherent - if not zebra, S likely sees it's a horse/whatever and doesn't believe; if zebra in slightly different light, S still believes).
  *   S knows: Zebra entails ~Painted-Mule.
  *   *q*: "That animal is not a cleverly painted mule."
  *   **Modification:** Crucially, in this zoo, the *mechanism* for potential deception *varies wildly* in nearby possibilities. In some close ~*p* worlds, it's a poorly painted mule (obvious close up). In *other, equally close* ~*p* worlds, it's an *extremely well-painted* mule using novel tech, visually indistinguishable from a zebra even on close inspection *under those specific conditions*. S's visual method M_p is sensitive to the poor paint job but *not* to the super-good paint job.

  **Predictions:**
  *   **CD Prediction:** S **knows** *q*. The method for *q* is M_p + competent deduction. Since S knows *p* via M_p, and *q* is validly deduced, warrant transfers. The variability in disguise mechanisms is irrelevant to the *deductive* step; the method M_p successfully tracked *p*, and *q* follows necessarily. The super-good paint job worlds aren't relevant because *in those worlds, p is false*, but S deduced *q* *from p*, which is false there – so S *shouldn't* believe *q* there, satisfying sensitivity *for the deduced q* relative to ~*p* worlds. The deduction *handles* the ~*p* possibilities.
  *   **STT Prediction:** S **does not know** *q*. The method for believing *q* is distinct: it's *forming a belief based on the logical consequence of a perceptually formed belief*. Evaluating sensitivity for *q*: We look at close worlds where *q* is false (it *is* a painted mule). In the close worlds where it's a *super-well-painted* mule (visually indistinguishable), S, using their *visual* method (which is part of the basis for the inference), *would* still believe *p* ("zebra") and thus, via deduction, believe *q* ("not painted mule") – **failing sensitivity** for *q*. The fact that S *would* use the same visual+deductive process in the super-disguise world shows the inference method *itself* isn't sensitive to *q* being false in *that* specific close way. The deduction doesn't magically make the visual method sensitive to *all* possible disguises.

  **Crux 2: Modal Proximity Evaluation for *q***
  *   **Core Question:** When evaluating if the deduced *q* is tracked (especially sensitivity), do we consider:
      *   (CD) All nearby worlds simpliciter? (*q*'s truth-value varies independently in nearby worlds).
      *   (STT) Primarily nearby worlds where the premise *p* is false? (Since *q* is believed *only because* *p* is believed).

  **Agreed Case (Same "Modified Zoo - Variable Disguise"):** (Relies on the same setup).

  **Predictions:**
  *   **CD Prediction:** (Already covered in Crux 1 prediction). Evaluating sensitivity for *q*: Look at nearby worlds where *q* is false (painted mule). In the *poorly* painted world (close), S sees it's not a zebra, doesn't believe *p*, so *doesn't* deduce/believe *q* – **satisfies sensitivity**. In the *super-well-painted* world (also close), *q* is false, but S *would* believe *p* (visually fooled) and thus believe *q*. **BUT**: CD argues this world *isn't relevant for evaluating the sensitivity of the deduced q* because the sensitivity condition for the *deduced* belief is inherently tied to the status of the premise. We care if S would believe *q* *when q is false **and** the deduction is performed*. Crucially, in worlds where *p* is true (like the actual world), *q* is necessarily true – there are *no* close worlds where *p* is true and *q* is false. So the *only* close worlds where *q* is false are worlds where *p* is false. And in *those* worlds, as above, S *doesn't* believe *p* in the relevant ones (the poorly painted ones are detectable), so *doesn't* believe *q*. The super-painted world might be close, but S's belief in *q* there is *based on a false belief in p* – the inference process *itself* is working correctly given its input. Sensitivity for the *deduced* *q* is evaluated relative to ~*p* worlds, and it holds where it matters (the detectable disguises).
  *   **STT Prediction:** Evaluating sensitivity for *q*: Look at close worlds where *q* is false (painted mule). The super-well-painted world *is* close and relevant. In that world, S *would* believe *q* (via believing *p* and deducing) even though *q* is false. **Fails sensitivity**. STT insists we evaluate *q*'s sensitivity relative to *its own* falsity in nearby worlds, *simpliciter*. The fact that this world is also a ~*p* world doesn't change that; *q* has a specific false-making scenario (super disguise) that the belief-forming process for *q* (visual inspection + deduction) doesn't track. Restricting evaluation *only* to worlds where *p* is false artificially limits the sensitivity test for the *conclusion* *q*. The deduction doesn't shield *q* from needing to be sensitive to *its own* falsity in close possibilities, even if those possibilities involve *p* being false in a way the initial method didn't track. The method for *q* needs its *own* modal robustness.

  ---

  This lays bare the fault lines: CD sees deduction as warrant-transfer preserving method identity & tying *q*'s modals to *p*'s falsity, STT sees inference as a new method step needing *q* to track *q*'s falsity in all close worlds. The modified zoo case forces the issue on method individuation and modal scope. Good luck in the seminar!
