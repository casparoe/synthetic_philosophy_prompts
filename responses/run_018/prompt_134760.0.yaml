answer: |-
  You're right to flag the linguistic tension, but you're misdiagnosing where the conceptual slippage occurs. Your engineered enzyme *is* causally efficacious, certainly—it catalyzes the reaction. But when you call it "redundant" *or* "functional," you're smuggling in a teleological judgment that only makes sense against a backdrop of *what the system is supposed to do*. And that "supposed to" is inherently historical. The causal-role theorist points at the new enzyme doing the job and declares "See? Function!" But *why* is *that* job the relevant benchmark? Why isn't the function just "whatever chemistry this molecule happens to catalyze in this artificial context"?

  The answer lies in the system's *design*—either by natural selection or human engineers. In your synthetic microbe, *we* identify the "function" of the backup pathway *only* by referencing the natural metabolic pathway *that was shaped by selection* to produce a specific outcome for the organism. You're implicitly relying on the etiological normativity you claim to reject! Without that historical anchor—without knowing what the system was selected *for*—you have no non-arbitrary basis to call this new causal contribution "functional" rather than just a fortuitous effect. The causal role is observable; the *function* is explanatory only in light of history. Your case proves my point: we recognize the redundancy precisely because we know the selected original.
