  hey so me and my roomate just had this long argument about endurantism vs perdurantism after a few beers, and I need an example to settle something. can you give me an example of a conceptual issue where endurantism is forced to pick a sharp cutoff for personal identity but perdurantism doesnt have to, specifically in a case where someones neurons get replaced one at a time but only while theyre asleep? like, over 30 years every neuron becomes synthetic but theres never a waking moment where they feel not fully themselves. I want the example to focus on whether the person is morally responsable for something they did in year 15 when the brain is like 40 percent synthetic and they wake up feeling totally normal. my friend thinks perdurantism has its own hidden problem where temporal parts in that intermediate stage have mental states that dont belong to any persisting subject, but I think thats just confused. can you lay out that conceptual issue with the sleep-replacement twist? sry for the ramble
