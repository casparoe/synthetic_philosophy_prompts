  The user wants me to outline precise claims behind the slogan. They mentioned demographic continuity, institutional transmission, and emotional identification across generations. For each, I should assess if it's trivial, defensible, or false. Then, determine which readings support the living/zombie distinction and which collapse it.

  Starting with demographic continuity. The tutor's point is that without the original group, the myth loses authenticity. That's defensible but problematic. Genetic lineage isn't the only way to preserve identity. Cultures evolve, and new members can adopt the myth. For the Lost Cause, while the original group is gone, some Southerners still identify with it. So this view might be too rigid, making the zombie label stick only under strict demographic terms. But it ignores how myths can be revitalized or appropriated.

