  Then, emotional identification. If people feel a connection, regardless of lineage, the myth lives. This challenges the tutor's view. For example, modern Southerners might still emotionally identify with the Lost Cause, keeping it alive in some form. Masada and Dunkirk thrive on current emotional resonance. If emotional identification is key, then the Lost Cause isn't dead as long as some group feels connected. This collapses the living/zombie distinction because it's about present feelings, not origins.

  So, the demographic reading supports the tutor's distinction but is narrow. Institutional and emotional factors blur the lines, making the zombie label less clear. The user might be pointing out that the tutor's view oversimplifies by ignoring how myths adapt. Also, the ethical aspect: labeling Lost Cause as zombie might dismiss ongoing issues, like how it still influences racial attitudes. 

