  Okay, the user has shared a popular science essay summary about cooperation in evolutionary game theory and is questioning its accuracy. They're particularly skeptical about claims regarding zero-determinant strategies "always out-earning" opponents, the dismissal of spatial structure, and whether the conclusion about reciprocity being insufficient actually follows. 

