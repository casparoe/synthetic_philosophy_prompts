  1. Axelrod's tournament showed tit-for-tat dominates and cooperation evolves naturally in iterated PD
  2. ZD strategies enforce linear payoff relations and prove cooperation isn't evolutionarily stable without external enforcers
  3. ZD strategies always out-earn opponents in evolutionary competition
  4. Therefore spatial structure and repeated interactions are irrelevant
  5. Reciprocity alone can't explain altruism

  The user's skepticism seems justified - especially points 3 and 4 feel oversimplified. I recall that while extortionate ZD strategies can dominate individuals, they struggle in populations. And spatial structure demonstrably affects cooperation in countless studies. 

  On Axelrod: the summary gets the spirit right but oversimplifies. Tit-for-tat wasn't strictly dominant - it tied with other reciprocating strategies. And "cooperation evolves naturally" needs qualifiers: it depends on population structure, mutation rates, and the shadow of the future. 

  Press & Dyson's ZD work is badly misrepresented here. The "always out-earn" claim only holds for pairwise extortion against inflexible opponents. In evolutionary settings with multiple strategies, extortioners often trigger races to the bottom. Generous ZD strategies exist but weren't mentioned. 

  The jump to "spatial structure is irrelevant" is frankly wrong. Spatial structure promotes cooperation through network reciprocity - Nowak's work shows this mathematically. The blogger seems to conflate pairwise tournaments with population dynamics.

