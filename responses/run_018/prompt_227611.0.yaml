  We are going to restate Fitch's paradox in distributed systems terms. The paradox is:

  1. Knowability Premise (KP): Every true proposition is knowable. (∀p: p → ◊Kp)
  2. Assume for reductio that there is an unknown truth: ∃p: (p ∧ ¬Kp)
  3. Consider a specific such p, and form the conjunction q: p ∧ ¬Kp.
  4. By KP, q is knowable: ◊K(q) = ◊K(p ∧ ¬Kp)
  5. But if one knows p ∧ ¬Kp, then one knows p (by conjunction elimination) and one knows that p is not known (by the second conjunct). However, knowing p implies that p is true (factivity) and thus that p is known (since the knower knows it), so Kp. But then we have Kp and ¬Kp, a contradiction.
  6. Therefore, the assumption of an unknown truth must be false: every truth is known.

  Now, translating to distributed systems:

  Nodes: Represent agents or observers.
  Local state: What a node "knows" at a given time.
  Message passing: Communication by which knowledge is shared.
  Snapshots: A consistent global state at a point in time? Or a node's local state at a time.
  Replication: How state is copied across nodes.
  Partitions: Network failures that prevent communication.
  Eventual consistency: Guarantee that if no new updates, eventually all nodes will have the same state.

  Key ideas from impossibility results:
  - CAP: In a network partition, you must choose between consistency and availability.
  - FLP: In an asynchronous system, consensus is impossible with one faulty process.

