prompt: |-
  I'm a philosophy PhD student who also advises a regional disaster-response board, and I need a reusable decision proceedure for rescue-allocation cases where we can't save everyone. I want it grounded in the Taurek-style view that raw numbers shouldn't decide—saving five doesn't automatically outweigh saving one—but I need it to handle real messiness: victim counts that are estimates with big error bars, partial rescue where survivors are left severely disabled, and knock-on harm to dependants. Write the procedure as ordered questions with clear stop/no-stop points, flag exactly where judgment replaces calculation, and say what it can't settle. Then run it on two proposals: (a) one helicopter can reach either a confirmed 3 people in a flooded clinic or an estimated 8–15 in a remote valley with unreliable headcounts; (b) a rapid unit saves more lives but leaves survivors with serious disability, while a slower unit saves fewer but intact. Include one case where the procedure gives an answer the board will hate. Keep it practical—something people without philosophy training can run in a meeting.
reasoning: |-
  Okay, the user is a philosophy PhD student working with a disaster-response board. They need a decision procedure that doesn't just default to saving the larger group, inspired by Taurek's view. But they also have real-world constraints: uncertain victim counts, potential disabilities from rescue, and dependents affected. 

  First, I need to unpack why Taurek matters here. The user is clearly rejecting pure utilitarianism in rescue scenarios—they want a framework where saving one person isn't automatically less valuable than saving five. But they also need practicality: no ivory-tower philosophy, just actionable steps for stressed responders. The tension is between ethical rigor and operational usability.

  Hmm, their hidden pain points are interesting. They mention "real messiness" like estimation errors and disability outcomes—that screams trauma-informed design. The board probably faces moral injury from past decisions where "save more" backfired (e.g., rescues causing lifelong suffering). The unspoken ask: protect responders' psyches while honoring victims' intrinsic worth.

  For the procedure, I'll avoid jargon like "moral patient." Instead, concrete filters: "Can we verify lives at risk?" not "Assess epistemic certainty." Stop/no-stop gates must be binary—no "maybe" to paralyze decisions. And I’ll force judgment calls into specific boxes (e.g., "Judge quality of life impact") so non-philosophers know when to switch from data to ethics.

  The two test cases are smartly chosen. Case (a) attacks Taurek’s weak spot: what if the "one" group is tiny but certain, while the "many" is huge but fuzzy? Case (b) pressures the disability clause—forcing the board to weigh survival against suffering. And the "answer they’ll hate" requirement? Brutal but necessary. I’ll pick a scenario where saving fewer intact lives beats many disabled ones, knowing it’ll trigger backlash. That’s the point: the procedure must withstand emotional resistance.

  Biggest challenge: balancing Taurek with harm prevention. Pure Taurek says flip a coin between groups, but that’s irresponsible when dependents starve if parents die disabled. So I’ll graft on a "knock-on harm" filter—not utilitarian calculus, but a duty to avoid cascading damage. Compromise? Maybe. Pragmatic? Hopefully.

  Final note: the "can’t settle" disclaimer is crucial. If groups tie on all filters, admit paralysis. Better honest deadlock than forced, unjustified choices.
answer: |-
  Here's a practical, reusable decision procedure grounded in a Taurek-inspired ethic, designed for operational use by a disaster-response board. It prioritizes *meaningful rescue* over raw numbers while handling real-world complexities.

  **Core Principles:**  
  1.  **Equal Moral Worth:** Every life has inherent, equal value. Saving 5 is not inherently "better" than saving 1.  
  2.  **Rescue Quality Matters:** Preventing death alone isn't sufficient; the *quality* of the rescue outcome (survivability without severe suffering, impact on dependents) is critical.  
  3.  **Minimize Harms:** Actively avoid choices causing severe disability or catastrophic knock-on effects where possible.  
  4.  **Judgment Over Calculus:** When core values conflict or uncertainty is irreducible, structured judgment replaces calculation.  

  **The Rescue Allocation Procedure: Ordered Questions with Stop/No-Stop Points**

  1.  **CAN WE ACTUALLY RESCUE ANYONE?**  
      *   *Question:* Can we realistically reach and extract *any* victims from *either* option with reasonable safety for responders?  
      *   *Stop (No Action):* If **No** for *both* options. Re-evaluate resources/tactics.  
      *   *Stop (Act):* If **Yes** for *only one* option. Choose that option.  
      *   *Continue:* If **Yes** for *both* options. Proceed to Question 2.

  2.  **CAN WE VERIFY LIVES ARE AT IMMINENT RISK?**  
      *   *Question:* Is there credible, actionable evidence (e.g., visual confirmation, reliable comms, known occupancy) that specific lives are *imminently* threatened and rescue is time-critical for *each* group?  
      *   *Stop (No Action):* If **No** for *both* options (e.g., both are highly speculative). Redirect resources.  
      *   *Stop (Act):* If **Yes** for *only one* option. Choose that option.  
      *   *Continue:* If **Yes** for *both* options. Proceed to Question 3. *(Judgment Starts: Assess credibility of evidence)*

  3.  **WILL SUCCESSFUL RESCUE LIKELY RESULT IN MEANINGFUL SURVIVAL?**  
      *   *Question:* Considering immediate medical needs, evacuation path, and available post-rescue care, are rescued individuals likely to survive *with an acceptable quality of life* (avoiding severe, untreatable disability or unmanageable pain)?  
      *   *Stop (No Action):* If **No** for *both* options (e.g., rescue only leads to agonizing death or permanent unconsciousness). Redirect to palliative care if possible.  
      *   *Stop (Act):* If **Yes** for *only one* option. Choose that option.  
      *   *Continue:* If **Yes** for *both* options. Proceed to Question 4. *(Judgment Starts: Define "acceptable quality of life" contextually - severe mobility loss vs. constant agony matter differently)*

  4.  **ARE THERE CATASTROPHIC KNOCK-ON HARMS?**  
      *   *Question:* Would rescuing one group unavoidably cause severe, immediate harm to *others* who are *dependent* on them (e.g., infants left unattended, frail elders reliant solely on them) *that we cannot mitigate*?  
      *   *Stop (No Action):* If **Yes** for *both* options. Seek alternative mitigation.  
      *   *Stop (Act):* If **Yes** for *only one* option. **Choose the *other* option.** (Prioritize avoiding catastrophic harm creation).  
      *   *Continue:* If **No** for *both* options OR if the harm exists but is *severe but not catastrophic* (e.g., hardship but not starvation/abandonment) OR *effective mitigation exists*. Proceed to Question 5. *(Judgment Starts: Assess severity and mitigability of knock-on harms)*

  5.  **ARE THE GROUPS FUNDAMENTALLY COMPARABLE?**  
      *   *Question:* Considering Questions 1-4, are the groups effectively similar concerning:  
          *   Certainty of existence/imminent threat?  
          *   Likelihood of meaningful survival?  
          *   Avoidance of catastrophic knock-on harms?  
          *   *And* are the victim count estimates reasonably reliable and stable?  
      *   *Stop (Act - Coin Flip / Random Selection):* If **Yes**. (Core Taurek Principle: When groups are morally equivalent and numbers are reliable, random choice respects equal worth).  
      *   *Continue:* If **No**. Proceed to Question 6. *(Judgment Starts: Assess overall comparability across dimensions)*

  6.  **JUDGMENT: SIGNIFICANT DIFFERENCE IN ONE DIMENSION?**  
      *   *Question:* Is there one dimension (Certainty, Survival Quality, Harm Avoidance) where one option is *significantly and demonstrably preferable* to the other, *despite* potential differences in estimated numbers?  
      *   *Stop (Act):* If **Yes**. Choose the option superior on that compelling dimension. (e.g., Much higher certainty, Significantly better survival outcomes, Clearly avoids a severe knock-on harm).  
      *   *Continue:* If **No** (dimensions conflict or no *significant* difference). Proceed to Question 7. *(Judgment Intensifies: Weigh conflicting priorities)*

  7.  **JUDGMENT: AVOID WORST OUTCOME?**  
      *   *Question:* Facing irreducible conflict/uncertainty, which choice carries the greatest risk of a *clearly unacceptable outcome* (e.g., rescuing people only to leave them in agonizing pain, causing the abandonment of vulnerable dependents, acting on grossly unreliable intel leading to wasted effort/no rescue)?  
      *   *Stop (Act):* Choose the option that *minimizes the risk* of the most unacceptable outcome. *(Final Judgment Call: Requires board deliberation on core values - e.g., Is leaving dependents worse than causing disability?)*

  **What the Procedure CANNOT Settle:**  
  *   **Truly Equivalent Tragic Choices:** When *all* dimensions (certainty, survival quality, knock-on harm) are equally balanced *and* numbers are equally uncertain or deemed irrelevant, the procedure forces a random choice (Q5) or a final value judgment (Q7). It cannot magically resolve the underlying tragedy.  
  *   **Defining "Acceptable Quality of Life" or "Catastrophic Harm":** These require contextual board deliberation and possibly pre-established guidelines based on local values/resources.  
  *   **Long-Term Societal Trade-offs:** It focuses on the immediate rescue decision and its direct consequences, not broader societal resource allocation ethics.

  ---

  **Running the Procedure on the Proposals:**

  **Case (a): Helicopter - Clinic (3 confirmed) vs. Remote Valley (8-15 estimated, unreliable)**  
  1.  **Can Rescue?** Yes for both. Continue.  
  2.  **Verify Imminent Risk?** Clinic: **Yes** (confirmed). Valley: **No** (unreliable headcounts, estimate range large, "unreliable"). *--> STOP (ACT): Choose the Clinic (confirmed group).*  
      *   *Justification:* The Valley group fails the verification threshold. The procedure stops at Q2, prioritizing the known lives over the highly uncertain ones. Taurek reinforces this: saving confirmed lives isn't outweighed by a *speculative* larger number.

  **Case (b): Rapid Unit (Saves more, causes disability) vs. Slower Unit (Saves fewer, intact)**  
  *Assume both groups are verified, rescue is possible, no catastrophic knock-on harms identified initially.*  
  1.  **Can Rescue?** Yes for both. Continue.  
  2.  **Verify Imminent Risk?** Yes for both (implied). Continue.  
  3.  **Meaningful Survival?** Rapid Unit: **Likely Partial "No"** (severe disability). Slower Unit: **Yes** (intact). *--> STOP (ACT): Choose the Slower Unit.*  
      *   *Justification:* The Rapid Unit fails Q3 for "meaningful survival" if the disability is deemed severe enough to constitute an unacceptable quality of life *in this context*. The procedure stops here, prioritizing intact survival for fewer over disabled survival for more. **This may be the "answer the board will hate"** if they are instinctively drawn to maximizing numbers or downplay the disability severity. The procedure forces confrontation with the quality of rescue outcome.  
      *   *If Disability Deemed "Acceptable":* Q3 would pass for both. Continue.  
  4.  **Catastrophic Knock-On Harms?** Assume No for both. Continue.  
  5.  **Comparable?** **No** - Significant difference in Survival Quality dimension. Continue to Q6.  
  6.  **Significant Difference?** **Yes** - Slower Unit significantly preferable on Survival Quality. *--> STOP (ACT): Choose Slower Unit.* (Same outcome via Q6).

  **Case the Board Might Hate:** Imagine a scenario with two groups:  
  *   **Group A:** 5 verified adults, likely intact survival. Rescue leaves 10 young children unattended in a safe but isolated location (severe hardship/risk, but not *imminent* death if found within 48hrs - **Severe but not Catastrophic** knock-on harm).  
  *   **Group B:** 1 verified adult, likely intact survival. No dependents.  
  *   *Procedure Path:* Both pass Q1/Q2/Q3. Q4: Knock-on harm for Group A is severe but *not catastrophic* (mitigation *might* be possible later). Continue. Q5: Groups not comparable (Group A has severe knock-on harm risk). Continue. Q6: No *single* compelling dimension difference (Saving 5 vs Saving 1 conflicts with Avoiding Severe Harm). Continue. Q7: **Avoid Worst Outcome?**  
      *   *Option A (Save 5):* Risk: 10 children suffer severe hardship/possible harm.  
      *   *Option B (Save 1):* Risk: 5 adults die.  
      *   *Board Judgment:* Which outcome is more unacceptable? **The procedure might force saving the 1 (Option B) if the board judges abandoning 10 children to severe hardship as the *worst* outcome, despite the smaller number saved.** This prioritizes harm avoidance over saving numbers, aligning with Taurek's aversion to harming some to benefit others, and will likely be controversial.

  This procedure provides structure, forces explicit consideration of key ethical dimensions beyond numbers, clearly flags judgment points, and delivers defensible decisions grounded in the stated principles, even when they are difficult. It prevents defaulting to simple utilitarianism.
