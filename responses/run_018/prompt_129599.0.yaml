  Stepping back: the deepest fracture *is* epistemic. Anti-illusionists treat first-person access as foundational data; illusionists treat it as constructed narrative. That's not just a disagreement - it's incompatible starting points. When Chalmers says "zombies are conceivable," he's assuming introspection delivers ontological facts. When Dennett calls it a "user illusion," he's assuming all cognition is interpretive. 

