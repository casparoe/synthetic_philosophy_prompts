answer: |-
  **I. Causality resides in the *orientation* of action.**  
  When the ascetic Protestant entrepreneur interprets profit as a *sign of grace* and reinvests rather than consumes, this *meaningful motivation* (value-rational action) transforms saving into systemic capital accumulation — a psychological mechanism absent in mere "economic conditions."  

  **II. Material conditions enable but do not *dictate* this ethic’s content.**  
  Pre-existing economic structures provided fertile ground, yet the *specific* injunction to relentless work as a *calling* — an ideal-typical core of the Protestant ethic — emerged from theological innovation, not economic calculation.  

  **III. The ethic persists even when *instrumentally* irrational.**  
  Its early adherents pursued vocational rigor despite it threatening traditional social bonds and immediate self-interest (e.g., rejecting familial charity). This *autonomous cultural force* contradicts reduction to material rationality.  

  **IV. Economic selection acts *secondarily*, not as prime mover.**  
  Yes, capitalism later favored those embodying this ethic. But this "selection" presupposes the ethic’s prior *existence* and motivational power to be favored — you cannot select what is not yet conceived.  

  **V. Elective affinity denotes *mutual transformation*, not mere correlation.**  
  The ethic reshaped economic conduct (e.g., methodical profit-seeking), while capitalist structures later amplified compatible values. This dialectic *is* causality — not a linear arrow, but a constitutive process where culture configures material action.
