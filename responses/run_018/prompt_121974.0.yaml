prompt: |-
  I spent thirty years as a field ornithologist studying avian speciation across Pacific archipelagos, and since retiring I have been auditing graduate seminars in philosophy of science. I am planning a single 90-minute workshop for approximately ten philosophy graduate students who have encountered the standard literature on the species problem but have never faced live classification ambiguity with practical stakes. I want an in-class activity—not a lecture or debate—where participants must apply competing species concepts to a deliberately constructed set of cases: specifically, a ring species exhibiting asymmetric gene flow across an island chain, paired with a cryptic species pair that are genetically distant but ecologically identical in every observable behavior and habitat. The rules and roles should be arranged so that the group divides into three functional positions—taxonomist, conservation lawyer, and evolutionary theorist—each forced to render a binding classification decision on whether the organisms in question constitute one species or several, with that decision then triggering a predetermined downstream consequence (for example, a conservation funding allocation or an explanatory framework for a subsequent evolutionary prediction). The point is not for them to reach consensus but for them to feel the pull of lumping versus splitting as a practical commitment rather than an abstract preference. After the exercise, provide a debrief that maps specific moments of disagreement onto the metaphysical commitments of the biological, phylogenetic, and morphological species concepts, and include an honest note on which feature of the problem—perhaps the temporal boundary problem or the normative dimension of classification—this staged scenario cannot reproduce and I must supply in discussion myself. Also tell me what will predictably go wrong the first time I run this, particularly given that the participants will be philosophy students with no field experience, and how I should handle it. Write this in a formal register appropriate for a workshop proposal, and avoid asking for bibliographies, reading lists, or citations, since I want the design to stand on its own logic.
reasoning: |-
  Okay, the user is a retired ornithologist with 30 years of experience studying avian speciation in the Pacific. They're now auditing philosophy of science seminars and wants to design a 90-minute workshop for philosophy grad students. The students have read about the species problem but haven't dealt with real-world classification dilemmas. 

  Hmm, the core challenge here is translating abstract philosophical debates into tangible stakes. The user specifically wants an activity—not lecture or debate—with three forced-choice roles (taxonomist, conservation lawyer, evolutionary theorist) applied to two deliberately constructed cases: a ring species and a cryptic species pair. 

  *First, unpacking the user's explicit needs:*
  - Must feel the "pull" of lumping vs splitting as practical commitment
  - Downstream consequences tied to each classification decision
  - Debrief mapping disagreements to species concepts (biological, phylogenetic, morphological)
  - Honest note about what the scenario can't capture
  - Predictable pitfalls with philosophy students + mitigation strategies

  *But reading between the lines...*
  They're likely frustrated by purely theoretical treatments of species concepts. The "practical stakes" emphasis suggests they want students to viscerally grasp how classification choices ripple into funding, research trajectories, legal frameworks. The role-play aspect hints at their field experience where decisions had real consequences. 

  *Key design challenges:*
  1. **Case construction** needs artificial but plausible complexity. The ring species must show asymmetric gene flow (harder to model than classic ring species), while the cryptic pair needs genetic distance without ecological divergence—contrary to usual assumptions. 
  2. **Role constraints** must feel binding. Lawyers can't suddenly care about phylogeny; theorists can't appeal to conservation ethics. 
  3. **Time compression** is brutal: 90 mins for setup, activity, debrief. The briefing materials must do heavy lifting.
  4. **Philosophy student pitfalls:** They'll over-intellectualize, debate metaphysics mid-activity, or miss biological nuances. Need baked-in interruptions.

  *Structure solution:*
  - **Phase 1 (20 mins):** Quick primer with laminated cards defining roles/concepts and case summaries. No discussion yet—just absorption. 
  - **Phase 2 (45 mins):** Simultaneous small-group role-play. Crucially, assign *individual* decisions first, *then* intra-role consensus. Forces personal commitment before negotiation. 
  - **Phase 3 (25 mins):** Debrief with "decision consequences" reveal (e.g., lawyer's split/lump choice triggers funding loss/gain) and concept mapping via whiteboard.

  *What the simulation can't capture:*
  The user must verbally inject the **temporal boundary problem**—how species are dynamic lineages, not static categories. Also, the **normative weight** of being the person who literally writes the species description for Field Guides or legislation.

  *Predictable disasters & fixes:*
  - **Disaster 1:** Students dissect case plausibility instead of engaging. → Fix: Start by announcing "These are contrived but biologically possible; focus on the forced choice."
  - **Disaster 2:** Role confusion (e.g., taxonomist argues like theorist). → Fix: Print role "mantras" on table tents (e.g., Lawyer: "My duty is to the Endangered Species Act").
  - **Disaster 3:** Cryptic species case stalls because "no data." → Fix: Seed materials with explicit "You lack genomic tools" to force morphological-only decisions.

  The user's expertise means they can ad-lib biological nuance, so the framework must prioritize clean role constraints and consequence mechanics. The debrief's "reveal" of real-world outcomes (e.g., lumping the cryptic pair caused extinction) will land hardest.
answer: |-
  ## Workshop Proposal: "Species Concepts in Practice: A Decision Forced-Exercise"

  **Workshop Title:** Taxonomic Tensions: Applying Species Concepts Under Operational Constraints  
  **Target Audience:** Philosophy of Science graduate students (10 participants) familiar with theoretical literature on the species problem but lacking practical classification experience.  
  **Duration:** 90 minutes  
  **Pedagogical Goal:** To simulate the material consequences of species delimitation decisions, forcing participants to confront the interplay between conceptual frameworks, practical stakes, and disciplinary priorities.  

  ---

  ### **I. Activity Design: Structured Decision-Making Exercise**  
  **Core Cases:**  
  1. **"Seabird Ring Complex" (*Thalassornis circummarinus*):**  
     - A seabird distributed across 5 volcanic islands (A→E) forming a linear archipelago.  
     - Continuous gene flow between adjacent islands (A↔B↔C↔D↔E), but asymmetric introgression (e.g., alleles flow A→B more readily than B→A).  
     - Terminal islands (A and E) exhibit hybrid infertility in captivity and divergent mating displays.  
     - Morphological cline: Plumage grades gradually from A→E, but A and E populations are diagnosably distinct.  

  2. **"Cryptic Finch Pair" (*Geospiza obscura* and *G. cryptica*):**  
     - Sympatric finches on a single island. Genomic divergence indicates 5 million years of separation.  
     - Identical in morphology, song, diet, nesting behavior, and habitat use.  
     - No hybridization observed in 20 years of monitoring; mitochondrial DNA shows no shared haplotypes.  

  **Roles & Constraints:**  
  Participants divide into three groups, each assigned a role with binding priorities and output requirements:  

  | Role                | Mandate                                                                 | Decision Output Required                                  | Downstream Consequence Triggered                                                                 |  
  |---------------------|-------------------------------------------------------------------------|-----------------------------------------------------------|-------------------------------------------------------------------------------------------------|  
  | **Taxonomist**      | Apply standardized criteria for clear diagnosis and museum specimen classification. | Publish a formal species description/revision.            | *Conservation Funding*: Splitting → Major grant for alpha taxonomy; Lumping → Funds reallocated to other taxa. |  
  | **Conservation Lawyer** | Enforce legal protections under Endangered Species Act equivalents.        | Argue for/against protective status in a regulatory brief. | *Habitat Protection*: Splitting → Critical habitat designated; Lumping → Development permits approved. |  
  | **Evolutionary Theorist** | Prioritize mechanisms of divergence and evolutionary trajectory.            | Propose a model for speciation processes in a grant application. | *Research Funding*: Splitting → Grant for studying sympatric speciation; Lumping → Grant for studying stasis. |  

  **Rules of Engagement:**  
  - Groups independently deliberate for 20 minutes using provided case dossiers (including genetic data maps, behavioral summaries).  
  - Groups must reach consensus *within their role* and declare a binary decision: **LUMP** (one species) or **SPLIT** (multiple species) for *each* case.  
  - Decisions are final and submitted anonymously. Consequences are revealed post-activity.  
  - Inter-role debate is prohibited to simulate real-world compartmentalization of expertise.  

  ---

  ### **II. Debrief Structure (20 minutes)**  
  **Step 1: Decision & Consequence Reveal**  
  - Display anonymous group decisions and trigger predetermined consequences (e.g., "Taxonomists split the finches → $500K allocated to type specimens; Lawyers lumped the seabirds → 200 hectares of habitat lost to development").  

  **Step 2: Mapping Disagreements to Species Concepts**  
  | Disagreement Moment             | Species Concept Manifested                | Philosophical Tension                          |  
  |---------------------------------|-------------------------------------------|------------------------------------------------|  
  | Seabird: Split A/E populations? | Biological (reproductive isolation)       | Metaphysics of "potentially interbreeding" across space/time |  
  | Seabird: Lump entire ring?      | Phylogenetic (monophyly)                  | Boundary problem for metapopulations           |  
  | Finches: Split despite ecology? | Morphological (diagnosability) vs. Genetic | Epistemology of "observable" characters        |  
  | Finches: Lump despite genetics? | Ecological (niche conservatism)           | Ontological priority of process vs. pattern    |  

  **Step 3: Limitations of the Simulation**  
  > *"While this exercise captures the normative weight of classification, it cannot replicate the **temporal boundary problem** inherent in real-world systems. In nature, speciation is a dynamic continuum—our decisions artificially freeze this process into discrete categories. I will contextualize this during discussion by examining how asymmetric gene flow in the seabirds could represent incipient speciation versus ephemeral structure."*  

  ---

  ### **III. Predictable Challenges & Mitigation Strategies**  
  **Challenge 1: Over-Intellectualization of Decisions**  
  - *Risk:* Philosophy students may dissect concepts ad infinitum rather than committing.  
  - *Mitigation:* Enforce strict time limits; emphasize that consequences bind regardless of epistemic uncertainty. State: "You are acting under institutional constraints, not seeking truth."  

  **Challenge 2: Misinterpreting Biological Data**  
  - *Risk:* Participants may misread gene flow diagrams or genetic distance metrics.  
  - *Mitigation:* Provide data in simplified visual formats (e.g., color-coded gene flow arrows; >5MY divergence labeled "HIGH"). Include a glossary (e.g., "introgression = gene exchange between populations").  

  **Challenge 3: Role Confusion**  
  - *Risk:* Lawyers may drift into theoretical arguments; Theorists may appeal to conservation ethics.  
  - *Mitigation:* Print role-specific "decision priorities" on cards (e.g., Lawyer: "Focus on legally defensible thresholds"). Interrupt if groups violate mandates.  

  **Challenge 4: Frustration with Artificial Constraints**  
  - *Risk:* Students may resist forced binary choices or compartmentalization.  
  - *Mitigation:* Frame this as the core lesson: "Real-world decisions often exclude nuance. Your task is to embody how institutional roles shape ontology."  

  ---

  ### **IV. Materials & Logistics**  
  - **Dossiers:** 3 distinct packets per case (1 per role) with tailored data summaries.  
  - **Consequence Cards:** Sealed envelopes revealed during debrief (e.g., "Your split decision secured habitat protection").  
  - **Setup:** Three separate deliberation tables; timer visible to all.  
  - **Instructor Role:** Facilitator/enforcer—intervene only to clarify rules or data.  

  This exercise compresses operational taxonomy into a high-stakes simulation, exposing how metaphysical commitments become instrumental under institutional pressures. By divorcing abstract preference from material outcome, participants experience classification as a consequential act—not a theoretical debate.
