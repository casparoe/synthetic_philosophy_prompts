prompt: |-
  In public debate, honouring sunk costs is routinely likened to remaining in a dreadful cinema because the ticket is already paid: the cost is irrecoverable, and only future enjoyment should matter. Lately, however, some institutional economists have begun treating “sunk commitments” — maintaining legacy structures or long-term partnerships whose running costs now exceed their direct benefits — as credibility mechanisms in repeated interactions rather than as reasoning errors. Audit the cinema analogy: set out the correspondence table (ticket price, film quality, viewer discomfort, and the decision to leave, mapped onto maintenance costs, current benefits, stakeholder expectations, and withdrawal); identify precisely where the mapping fractures, especially regarding whether prior investments are fungible and whether future-interaction effects are present; and state whether the conclusion that honouring sunk costs is always irrational survives once those disanalogies are on the table, or whether the analogy was carrying that conclusion all along. Please reply in British English.
reasoning: |-
