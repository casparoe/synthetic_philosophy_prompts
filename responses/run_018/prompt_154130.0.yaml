answer: |-
  Okay, this is a fantastic premise for a joke playing on moral psychology and cultural relativism. Here's one aiming for that specific blend of academic reference, clash of perspectives, and the philosopher's ironic downfall:

  **The Punchline:**

  **Title:** The Objective Morality Coffee Spill

  **Setup:**
  Dr. Thaddeus Finch, a WEIRD philosopher obsessed with proving objective morality, presents his research at an international ethics conference. He describes a classic scenario to two focus groups:

  *   **Scenario:** "A man is carrying a priceless, ancient funerary urn sacred to the River People. He *accidentally* trips (intent: harmless) and shatters it (outcome: catastrophic, spiritually polluting)."

  *   **Group A (WEIRD Psychologists):** Overwhelmingly judged the act as "not very wrong." Key quotes: "Clearly unintentional!" "No malice!" "Mere clumsiness!"
  *   **Group B (Elders from the River People):** Unanimously declared it "deeply wrong, requiring purification." Key quotes: "The river spirits are angered!" "The pollution must be cleansed!" "The consequence is everything!"

  **The Twist:**
  Finch, flushed with excitement, leans into the mic: "SEE? This *proves* my point! While the *surface* judgments differ, the *core* recognition of wrongness based on **harm** is universal! The River People just express it through spiritual consequence! Objective morality CONFIRMED!"

  Just then, gesturing wildly, he knocks over his enormous latte. It drenches:
  1.  The laptop of Dr. Evelyn Sharp (WEIRD Psychology, Group A researcher), frying her year's data.
  2.  The ceremonial woven mat of Elder Moonshadow (River People, Group B representative), brought for the opening ritual.

  **The Punchline:**
  Dr. Sharp (WEIRD, focused on intent) yells: "FINCH! You CLUMSY IDIOT! What were you THINKING?!" (Judging his *mental state/character*).
  Elder Moonshadow (Outcome/Spiritual focus) gasps, pointing at the soaked, stained mat: "The ancestors! The SACRED SPACE IS POLLUTED! The CONSEQUENCE is irreversible!" (Judging the *result/state of the world*).

  Finch, stammering, tries: "But... but it was an ACCIDENT! I didn't MEAN to...!"
  They both turn on him, united only in disdain:
  Sharp: "Your *reckless disregard* caused this!"
  Moonshadow: "Your *carelessness* has defiled this place!"
  Finch slumps, realizing: *His own accidental act just perfectly demonstrated the irreconcilable cultural weighting of intent vs. outcome/spiritual state he was trying to dismiss... and offended both groups simultaneously.* Objective morality remained frustratingly elusive, drowned in coffee and ritual desecration.

  ---

  **Why this works (hopefully):**

  1.  **Core Concept:** Directly uses the WEIRD (intent-focused: Sharp) vs. Non-WEIRD (outcome/spiritual pollution-focused: Moonshadow) moral judgment split.
  2.  **The Philosopher's Goal:** Finch explicitly wants to prove objective morality by finding a common core ("harm") beneath cultural expressions.
  3.  **The Own:** His *own accidental act* becomes the perfect, real-time test case. He triggers *both* moral frameworks simultaneously:
      *   **WEIRD Offense:** Sharp judges his *character and mental state* (clumsy idiot, reckless disregard).
      *   **Non-WEIRD Offense:** Moonshadow judges the *concrete outcome and spiritual pollution* (defiled space, irreversible consequence).
  4.  **The Twist:** His desperate appeal to intent ("It was an accident!") falls flat because *both* groups, according to *their own frameworks*, find him blameworthy. Sharp focuses on the *recklessness* leading to the accident (a failure of intent/care), Moonshadow focuses purely on the *pollution* caused (the consequence).
  5.  **No Obscure Study:** Relies on the general, well-known contrast in moral psychology and the classic "accidental harm" scenario, not a specific citation.
  6.  **Accessible:** Anyone familiar with the basic debate about cultural relativism vs. moral objectivity and the idea that cultures weigh intent/outcome differently will get it. The coffee spill is a universal relatable accident.
  7.  **Humane:** The cultures aren't the butt of the joke; the philosopher's hubris and the perfect irony of his own blunder are.
