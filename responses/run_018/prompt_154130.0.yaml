  anyway, could you write a joke that actually turns on that? i dont want some generic 'cultural differences are funny' thing. i want the punchline to depend on knowing that WEIRD people are weirdly obsessed with mental states and intentions, while other folk moralities weigh outcomes or spiritual pollution more heavily, and then someone - maybe a philosopher - tries to settle whether morality is objective by comparing these views and gets completely owned by his own data. it should make sense to someone who knows the debate but not require looking anything up. also please dont make it about some obscure study i wouldnt know, just the general idea with maybe a weird twist like the philosopher accidentally offending both groups at once.
