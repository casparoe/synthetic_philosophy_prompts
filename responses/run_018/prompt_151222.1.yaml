prompt: |-
  I'm writing this as a senior in an advanced philosophy of science elective at my high school, where a sustained disagreement has emerged between two classmates regarding the scope of evolutionary and physical explanation. One student maintains a strict crane-only position: she contends that every higher-order phenomenon—including consciousness, mathematical reasoning, and moral normativity—can eventually be reconstructed through layered bottom-up mechanisms without remainder, and that any talk of autonomous downward causation or irreducible emergence functions merely as a disguised skyhook that blocks empirical inquiry. The other student accepts cranes for biological adaptation but rejects greedy reductionism: he grants that evolutionary processes build complex structures incrementally, yet insists that in domains achieving functional autonomy—such as normative reasoning or formal proof—reducing the phenomenon to its origins strips away exactly what requires explanation, namely its authoritative or objective force, without needing to invoke any mysterious skyhook.

  Please draft the joint adversarial-collaboration statement that these two students could both endorse after careful negotiation. The document should contain: (1) a numbered section of agreed claims clarifying what cranes, skyhooks, and greedy reductionism entail, specifying where evolutionary explanation succeeds uncontroversially and where its limits are genuinely disputed; (2) precise, neutrally worded formulations of the residual disagreements, with each formulation phrased so that the respective camp recognizes it as its own view rather than a strawman—particularly regarding whether evolutionary genealogy can account for the binding force of moral reasons and whether cross-cultural mathematical convergence is better explained by shared neural architecture or by independent abstract access; (3) the cruxes, defined as sub-questions whose resolution would cause at least one side to update, including specifically whether predictive success in evolutionary psychology explains the authority of moral norms or merely describes their genealogy; and (4) for each crux, a concrete case or argument both parties accept as relevant—such as the convergence on altruistic punishment norms across isolated societies, or the independent discovery of prime-number theorems—together with each side's explicit, pre-registered prediction of what that case demonstrates. Format the output as a numbered agreed-claims section followed by a disagreements table, avoid any request for external bibliographies, and ensure that no disagreement is presented as merely verbal.
reasoning: |-
  We are drafting a joint adversarial-collaboration statement for two students with opposing views on reductionism in the philosophy of science. The statement must include agreed claims and a clear presentation of residual disagreements with specific cruxes and test cases.

  Structure:
  1. Agreed Claims (numbered list): Define key terms (cranes, skyhooks, greedy reductionism) and specify uncontroversial successes and genuine limits of evolutionary explanation.
  2. Disagreements Table: Neutrally worded formulations of the remaining disagreements, each phrased so the respective camp recognizes it. Focus on moral norms' binding force and mathematical convergence.
  3. Cruxes: Sub-questions that would cause at least one side to update, with concrete cases and pre-registered predictions for each.

  Key Definitions (based on Dennett's terminology, as implied by "crane" and "skyhook"):
  - Crane: A step-by-step, incremental, bottom-up mechanism (like natural selection) that builds complexity without invoking unexplained powers.
  - Skyhook: An unexplained, top-down cause or deus ex machina that is invoked without a mechanistic basis.
  - Greedy Reductionism: The attempt to explain a higher-level phenomenon solely in terms of its lower-level components, ignoring or denying the reality of emergent properties or functional autonomy.

  Agreed Claims:
  1. We agree that the term "crane" refers to any incremental, mechanistic process (such as natural selection) that builds complex structures through stepwise modifications without invoking unexplained top-down causes.
  2. We agree that the term "skyhook" refers to any explanatory device that posits an unexplained, non-mechanistic top-down cause to account for a phenomenon, and that such devices are illegitimate in scientific explanation because they block empirical inquiry.
  3. We agree that "greedy reductionism" is the position that denies the reality or causal efficacy of higher-level phenomena by attempting to reduce them entirely to lower-level components, thereby potentially stripping away essential features of the phenomenon in question.
  4. We agree that evolutionary mechanisms (cranes) successfully explain the emergence of complex biological adaptations, including the development of sensory organs, metabolic pathways, and behavioral traits, without remainder in these domains.
  5. We agree that there are domains where evolutionary explanation is uncontroversially applicable, such as in the phylogenetic development of morphological structures and the adaptive functions of behaviors that enhance survival and reproduction.
  6. We agree that there are domains where the applicability of evolutionary explanation is genuinely disputed, particularly in accounting for (a) the binding force of moral reasons and (b) the cross-cultural convergence on mathematical truths.
  7. We agree that any adequate explanation must avoid skyhooks and be consistent with the methods of natural science.

  Residual Disagreements:
  The two main points of disagreement are:

  Disagreement 1: On whether evolutionary genealogy can account for the binding force of moral reasons.
  - Strict Crane Position (Student A): The binding force of moral reasons is entirely explicable as an evolved psychological mechanism that promotes social coordination, and any sense of objective authority is an adaptive illusion.
  - Anti-Greedy Reductionism Position (Student B): While evolutionary processes explain the origin of moral sentiments, they cannot account for the normative authority of moral reasons, which arises from the autonomous domain of reasons and requires a distinct level of explanation that is not reducible to genealogy.

  Disagreement 2: On whether cross-cultural mathematical convergence is better explained by shared neural architecture (crane) or by independent access to abstract truths.
  - Strict Crane Position (Student A): The cross-cultural convergence on mathematical truths is fully explained by shared neural architecture shaped by evolution, which processes abstract concepts in a consistent manner due to common selective pressures.
  - Anti-Greedy Reductionism Position (Student B): The cross-cultural convergence on mathematical truths is best explained by the independent access of human minds to an abstract realm of mathematical truths, which is not reducible to evolutionary history because the necessity and universality of mathematical truths transcend any contingent evolutionary pathway.

  Cruxes:
  We identify the following cruxes, which are sub-questions that, if resolved, would cause at least one side to update their position.

  Crux 1: Does predictive success in evolutionary psychology regarding moral norms explain the authority of moral norms or merely describe their genealogy?
  - Case: The convergence on altruistic punishment norms across isolated societies (e.g., in both foraging and agricultural societies, individuals punish non-cooperators at a cost to themselves, even when not directly affected).
  - Pre-registered Predictions:
    - Student A (Strict Crane): If evolutionary psychology can predict the specific conditions under which altruistic punishment emerges and the variations in its expression based on ecological factors, and if the perceived authority of these norms varies as predicted by their adaptive function (e.g., stronger in contexts where group survival is threatened), then this demonstrates that the authority is an evolved psychological mechanism and thus explained without remainder.
    - Student B (Anti-Greedy Reductionism): Even if evolutionary psychology successfully predicts the emergence and variation of altruistic punishment norms, this only describes the genealogy of the norms. The authority of moral reasons (e.g., why we *should* punish non-cooperators even when it is costly) remains unexplained by such a description and requires a normative account that is autonomous from evolutionary history.

  Crux 2: Is the independent discovery of prime-number theorems across cultures evidence of shared neural architecture or independent access to abstract truths?
  - Case: The independent discovery and proof of prime-number theorems in ancient Greece, classical India, and the Islamic Golden Age, despite minimal cultural contact.
  - Pre-registered Predictions:
    - Student A (Strict Crane): If the methods and conceptual pathways used in these independent discoveries can be shown to be constrained by species-specific cognitive architecture (e.g., a shared innate number sense) and if the historical development of these theorems follows an incremental, error-prone process consistent with cultural evolution, then this convergence is best explained by shared neural architecture without invoking abstract access.
    - Student B (Anti-Greedy Reductionism): If the independent discoveries involve distinct conceptual frameworks and yet converge on the same necessary truths, and if the proofs demonstrate an appreciation of the necessity of the theorems (not just contingent agreement), then this is evidence that human minds are accessing an abstract realm of mathematical truths that is independent of evolutionary history.

  Formatting:
  We will now present the agreed claims as a numbered list and the disagreements and cruxes in a table.

  Note: We avoid any presentation of disagreement as merely verbal. Each position is presented as a substantive disagreement about the explanatory scope of evolutionary mechanisms.
answer: |-
  ### Joint Adherent-Collaboration Statement  
  **Agreed Claims:**  
  1. **Cranes** denote incremental, bottom-up mechanisms (e.g., natural selection) that build complexity through empirically traceable steps without invoking unexplained top-down causes.  
  2. **Skyhooks** denote non-mechanistic, top-down explanatory devices (e.g., supernatural or metaphysical causes) that illegitimately halt empirical inquiry by appealing to irreducible primitives.  
  3. **Greedy reductionism** occurs when a reductive explanation discards essential features of a higher-order phenomenon (e.g., normativity or abstract necessity) by conflating origins with constitutive mechanisms.  
  4. **Evolutionary cranes uncontroversially succeed** in explaining:  
     - Biological adaptations (e.g., eye development via incremental selection).  
     - Behavioral traits with clear fitness benefits (e.g., fight-or-flight responses).  
     - Genealogical origins of cognitive faculties (e.g., pattern recognition).  
  5. **Evolutionary explanation faces genuine limits** in domains where functional autonomy arises, specifically:  
     - The *binding force* of moral reasons (e.g., why we feel obligated to act against self-interest).  
     - The *cross-cultural universality* of mathematical truths (e.g., why diverse cultures converge on identical theorems).  
  6. **No skyhooks are permissible**: Both parties reject appeals to non-natural causes (e.g., Platonic forms or divine commands) as antithetical to scientific inquiry.  

  ---

  ### Residual Disagreements: Formulations and Cruxes  
  *Each formulation is neutrally worded and endorsed by the respective camp as capturing their core position.*  

  | **Disagreement Domain** | **Strict Crane Position (Student A)** | **Anti-Greedy Reductionism Position (Student B)** |
  |-------------------------|--------------------------------------|--------------------------------------------------|
  | **Moral Normativity** | Evolutionary genealogy fully explains moral normativity: The "binding force" of moral reasons is an adaptive illusion arising from neural mechanisms selected for social coordination. Accounting for this force requires no additional explanatory layer beyond describing its causal history and psychological instantiation. | Evolutionary genealogy explains the *origin* of moral sentiments but not their normative authority: The binding force arises from the autonomous logical space of reasons, where justification (e.g., "ought" claims) transcends causal history. Reducing it to psychology strips its validity. |
  | **Mathematical Convergence** | Cross-cultural mathematical convergence is fully explained by shared neurocognitive architecture: Evolutionarily constrained neural mechanisms (e.g., numerosity circuits) process abstract concepts consistently across cultures, making identical conclusions inevitable without invoking mind-independent truths. | Cross-cultural mathematical convergence reflects access to abstract necessity: While neural mechanisms enable discovery, the universality of mathematical truths (e.g., 2+2=4) stems from their mind-independent necessity, which cannot be reduced to evolved biology without losing their infallible authority. |

  ---

  ### Cruxes: Sub-Questions and Test Cases  
  *Each crux is a decisive sub-question where empirical or conceptual resolution would compel one side to update their view. Both parties accept the test cases as relevant and pre-register their predictions.*  

  | **Crux** | **Test Case** | **Strict Crane Prediction (A)** | **Anti-Greedy Reductionism Prediction (B)** | **What Resolution Would Update Views?** |
  |----------|---------------|---------------------------------|---------------------------------------------|-----------------------------------------|
  | **Crux 1: Does evolutionary psychology explain moral authority or merely its genealogy?** | *Altruistic punishment norms* (e.g., costly punishment of non-cooperators documented in isolated societies like the Hadza foragers and Pacific island communities). | **A’s Prediction:** If cross-cultural data show that perceived moral "authority" varies predictably with ecological pressures (e.g., punishment intensity correlates with group survival demands), this confirms authority is an adaptive construct with no residue beyond psychological mechanisms. | **B’s Prediction:** If moral authority persists as categorically binding even when evolutionary pressures change (e.g., in industrialized societies where group survival is less urgent), this demonstrates that normativity cannot be fully reduced to adaptive utility. | **Update condition for B:** If authority co-varies strictly with adaptive context, B concedes evolutionary psychology explains normativity. **For A:** If authority remains invariant despite adaptive shifts, A concedes residue exists. |
  | **Crux 2: Is mathematical convergence caused by neural architecture or abstract access?** | *Independent discovery of prime-number theorems* (e.g., Euclid’s proof in Greece, Āryabhaṭa’s in India, and al-Khwārizmī’s in the Islamic Golden Age, all deriving infinitude of primes). | **A’s Prediction:** If historical analysis reveals convergent proofs relied on analogous cognitive tools (e.g., spatial reasoning or counting algorithms) shaped by shared neural constraints, this confirms convergence is fully explained by evolved neurobiology. | **B’s Prediction:** If proofs use distinct conceptual pathways (e.g., geometric vs. algebraic) yet still recognize the *necessity* of the theorem (e.g., primes must be infinite), this shows minds independently accessing abstract truth beyond neural contingencies. | **Update condition for B:** If convergence always relies on homologous cognitive mechanisms, B concedes neural architecture suffices. **For A:** If necessity is recognized across incommensurable frameworks, A concedes abstract access is implicated. |

  ---  
  **Signatures:**  
  [Student A]  
  [Student B]  

