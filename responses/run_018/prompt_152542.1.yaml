prompt: |-
  I'm the director of a clinical psychology residency and every quarter I have to write these character evaluations for the accrediting body — they want ratings on compassion, integrity, practical wisdom, that kind of thing. The problem is I'm actually convinced by both virtue ethics and the situationist critique, which puts me in a weird spot. If character is just stable dispositions then I should rate residents on whether they consistently act well, but if the situationists are right then behavior mostly tracks context not traits, so my ratings are basically astrology unless I control for pressure and setting. I need a reusable procedure I can run in about thirty minutes per resident that doesn't collapse into a gut-feeling form.

  Can you turn virtue ethics — specifically the idea that virtues are dispositions to feel, reason, and act correctly across a range of situations, not just habits — into an operational checklist for me? It needs to specify what counts as evidence for a virtue versus just lucky behavior, how to weight situational pressure (high-stress crisis vs routine rotation), and where the procedure has to stop and admit it's a values judgment rather than a measurement so I don't recieve false precision. Include three worked cases: a resident who was rude to a patient during a double shift but usually kind; one who was exemplary in easy rotations but collapsed in crisis; and one ambiguous case where the procedure gives an answer I probably won't like. Also flag the points where I'm just dressing up judgment calls as steps, and say what the procedure absolutely cannot do — like predicting future behavior or replacing a real conversation. Don't give me bibliographies or citations; I already know the debate and can't search them. I just need something I can apply repeatedly without pretending psychology doesn't exist.
reasoning: |-
  Okay, the user is a director of a clinical psychology residency program who needs to write character evaluations for accreditation. They're stuck between virtue ethics and situationist critiques. Virtue ethics emphasizes stable dispositions, while situationism argues behavior is context-dependent. They want a practical, 30-minute per resident procedure that avoids false precision.

  First, I need to address their core conflict. They can't just rate based on behavior alone because situations heavily influence actions. The challenge is distinguishing between true virtues and situational outcomes. How can I create a checklist that accounts for context without being too time-consuming?

  The key elements they mentioned are evidence for virtues vs. lucky behavior, weighting situational pressure, and acknowledging where judgment is necessary. The procedure must be systematic but honest about its limitations. They also want three worked examples to illustrate different scenarios.

  Starting with the structure. Breaking it into phases makes sense: Situational Context, Behavioral Evidence, Interpretation. Each phase needs specific questions to guide the evaluation. For Situational Context, factors like stress level, novelty, and interpersonal load are crucial. High-stress situations might excuse a lapse, but patterns matter.

  Behavioral Evidence should track actions, reasoning, and emotional responses. The triad of feel-reason-act from virtue ethics helps here. Looking for patterns across contexts is essential to counter situationism. If a resident shows consistent behavior in varied situations, that's stronger evidence of a disposition.

  Interpretation requires mapping evidence to virtues and noting inconsistencies. Here, I need to flag where judgment comes in—like deciding what counts as "sufficient" evidence. Also, explicitly stating the procedure's limits: no future predictions, not a replacement for dialogue.

  For the worked examples: 
  The first case is a resident rude during a double shift but usually kind. Situational context shows high stress and fatigue. The key is whether this is a one-off. If there's a pattern of stress-related lapses, it points to a lack of resilience. Otherwise, it's situational.

  Second example: exemplary in easy rotations but collapses in crisis. Consistent failure under pressure indicates a lack of practical wisdom or courage. This contrasts with the first case because it's a pattern, not an isolated incident.

  Third case is ambiguous—maybe a resident who acts virtuously but for the wrong reasons. The procedure might reveal instrumental behavior rather than genuine virtue. The director might not like that it questions underlying motives, but the checklist forces confronting that ambiguity.

  I need to emphasize points where judgment is unavoidable. For instance, deciding the severity of situational factors or interpreting emotional cues. Being transparent about these steps prevents false precision.

  The procedure's limitations are crucial. It can't predict future behavior or replace conversations. It's a structured assessment tool, not a crystal ball. Highlighting this meets the user's request to not ignore psychology's realities.

  Also, ensuring the checklist is reusable and quick. Phases with clear questions allow efficient evaluation. The examples demonstrate how to apply it within 30 minutes, using existing records and observations without new data collection.

  Finally, the user's deeper need might be justifying evaluations to accrediting bodies while staying intellectually honest. They want a method that acknowledges situationist critiques but still provides actionable assessments. Balancing structure with transparency addresses this, showing due diligence without claiming infallibility.
answer: |-
  Here’s a reusable 30-minute operational procedure based on virtue ethics, designed to acknowledge situationist critiques while avoiding false precision. It focuses on **patterns of reasoning, emotional responsiveness, and action** across contexts, weighted by situational pressure. 

  **Core Principle:** A virtue is evidenced by **consistency in *how* one navigates challenges** (reasoning/emotional regulation) **and acts** (behavior) **across *diverse* situations**, not just by isolated good/bad acts. Situations are graded on "demand load" (stress, complexity, novelty, stakes).

  ---

  ### **Procedure: Dispositional Trait Assessment (DTA) Checklist**  
  *(Time: 30 min/resident, using existing rotation evals, supervisor notes, and incident reports)*

  **PHASE 1: SITUATIONAL CONTEXT AUDIT (5 min)**  
     - *Review 3-5 recent scenarios* (routine, challenging, crisis) for the resident. Assign a **"Demand Load" (DL) score** to each:  
       - **Low DL (1)**: Routine, low-stakes, familiar tasks (e.g., stable outpatient session).  
       - **Moderate DL (2)**: Complexity or mild stress (e.g., new diagnosis disclosure, busy clinic).  
       - **High DL (3)**: Crisis, high stakes, fatigue, ambiguity (e.g., suicidal patient at 3 AM, system error).  
     - *Flag*: Any scenario where situational pressures (e.g., 24-hour shift) likely overwhelmed *any* reasonable person.

  **PHASE 2: EVIDENCE MAPPING (15 min)**  
  For each virtue (Compassion, Integrity, Practical Wisdom), chart evidence across scenarios:  
     - **Action (What they did)**: Observable behavior (e.g., "Listened without interrupting," "Omitted adverse event in chart").  
     - **Reasoning (How they decided)**: Documented rationale, ethical justification, or supervisor feedback on judgment.  
     - **Emotional Responsiveness (What they felt/expressed)**: Noted empathy, frustration, anxiety, or emotional detachment.  
     - *Key Question*: **Is there a pattern in *how* they respond to similar demand levels?** (e.g., "Under Moderate DL, consistently seeks supervision; under High DL, becomes defensive").  

  **PHASE 3: DISPOSITION INFERENCE & LIMITS (10 min)**  
     - **Strong evidence for virtue**: Consistent *alignment* of feeling, reasoning, and action *across varying DL levels*.  
       - *e.g., Compassion:* Expresses genuine concern (feeling), recognizes patient distress (reasoning), adjusts approach (action) in both Low and High DL.  
     - **Weak/contested evidence**:  
       - Good acts only in Low DL ("fairweather virtue").  
       - Isolated virtue displays in High DL without reasoning/feeling alignment ("lucky behavior").  
       - Contradictions (e.g., empathetic feeling but poor action under stress).  
     - **Weighting Situations**:  
       - **High DL missteps** require *less evidence* to indicate a dispositional gap (situationism acknowledges most fail here).  
       - **Low DL missteps** require *more evidence* to indicate a flaw (virtue ethics expects consistency here).  
     - **Explicit Judgment Flags**:  
       - *"Demand Load interpretation is inherently subjective."*  
       - *"Inference from behavior to disposition requires clinical judgment."*  
       - *"Absence of negative evidence ≠ positive evidence."*  

  **PROCEDURE LIMITS (Must include in report)**  
     - ❌ **Cannot predict future behavior** (situationism prevails).  
     - ❌ **Cannot replace direct observation or mentorship conversations**.  
     - ❌ **Cannot resolve ambiguities without supervisor input**.  
     - ✅ **Can identify patterns suggesting dispositional strengths/risks**.  
     - ✅ **Can contextualize isolated failures/successes**.  

  ---

  ### **Worked Cases**  
  **Case 1: "Usually kind, rude during double shift (High DL)"**  
  - *Context*: Rude remark to demanding patient after 18-hour shift (DL 3).  
  - *Evidence*: 10+ prior Low/Moderate DL cases show active listening, warmth (feeling/reasoning/action aligned). No prior High DL incidents.  
  - *Inference*: **Low risk for dispositional compassion deficit**. High DL explains lapse. Flag: "Monitor fatigue resilience; lapse likely situational."  
  - *Judgment Flag*: DL score interpretation is subjective but consistent with situationist data.  

  **Case 2: "Exemplary in easy rotations, collapsed in crisis (Moderate DL)"**  
  - *Context*: Avoided decision during escalating family conflict (Moderate DL 2). History of praise in Low DL (e.g., structured assessments).  
  - *Evidence*:  
    - *Low DL*: Follows protocols flawlessly (action), but notes show minimal independent reasoning.  
    - *Moderate DL*: Supervisor reports "frozen," deferred decisions (action), expressed anxiety (feeling), no documented problem-solving (reasoning).  
  - *Inference*: **Practical Wisdom concern**. Consistent pattern: Good action *only* when demands are low. Reasoning/action misalign under pressure.  
  - *Judgment Flag*: Inferring "lack of practical wisdom" from repeated Moderate DL failures is a clinical call.  

  **Case 3: "Ambiguous: Perfect actions, questionable motives"**  
  - *Context*: Resident volunteers for extra call (action), documents meticulously (action), praised by supervisors.  
  - *Evidence*:  
    - *Feeling*: Peer reports resident "cold," focus on "checking boxes."  
    - *Reasoning*: Notes emphasize "avoiding liability," not patient welfare.  
    - *Action*: No errors, but minimal extra-therapeutic engagement.  
  - *Inference*: **Integrity gap likely**. Action aligns with rules, but reasoning/feeling suggest instrumentalism, not genuine care. "Virtue" requires correct motivation.  
  - *Hard Truth*: Procedure flags dispositional risk despite perfect compliance. You must address the "why" behind actions.  

  ---

  ### **Why This Works**  
  - **Bridges theories**: Tracks consistency (virtue ethics) while weighting context (situationism).  
  - **Operationalizes "disposition"**: Requires tripartite (feel/reason/act) evidence across DL levels.  
  - **Avoids astrology**: Isolated acts don’t define ratings; patterns do.  
  - **Honest about limits**: Flags judgment points and can’t-do items upfront.  
  - **Efficient**: Uses existing data; focuses on high-signal scenarios.  

  **Final Note**: Use this to structure evidence, not as a scoring algorithm. When the procedure hits a judgment flag (e.g., "Is this DL 2 or 3?"), *that’s your cue to consult colleagues or supervisors*—it’s a feature, not a bug. Your role is to interpret patterns, not divine character.
