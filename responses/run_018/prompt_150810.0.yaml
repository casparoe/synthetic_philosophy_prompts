answer: |-
  ### **In-Class Activity: The Committee of Senses**
  **Objective:** Experience the fragmentation of perception and the challenge of creating a unified narrative without a central "observer."

  #### **Roles & Setup (10 mins)**
  - **Participants:** 9 students divided into:
    - **Visual Committee (3):** Receives timed info about a light flash.
    - **Auditory Committee (3):** Receives timed info about a sound.
    - **Editorial Board (2):** Integrates inputs into a report (only communicates via shared board).
    - **Memory Keeper (1):** Records the final group report after each round (no input during drafting).
  - **Materials:** 
    - Whiteboard (shared, erasable) + markers.
    - Role-specific event cards (hidden from others).
    - Timer.
  - **Rules:**
    - No "official observer" or leader. 
    - Editorial Board **cannot speak**; they only write/erase on the shared board.
    - Board is wiped clean after each round—no persistent record.
    - Group must agree on one written report per round.

  ---

  #### **Event Sequence & Payoff Scheme (30 mins, 3 rounds)**
  **Round 1: Simple Synchrony**  
  - *Event:* Light flash + sound at **T=0s**.  
  - *Note Cards:*  
    - Visual: "Light flash at T=0s."  
    - Auditory: "Sound at T=0s."  
  - *Goal:* Ease into collaboration.  
  - *Payoff:* 10 pts if report states synchronous events.

  **Round 2: Temporal Conflict**  
  - *Event:* Light flash at **T=0s**, sound at **T=2s**.  
  - *Note Cards:*  
    - Visual: "Light flash at T=0s."  
    - Auditory: "Sound at T=2s."  
  - *Goal:* Reveal timing discrepancies.  
  - *Payoff:* 15 pts if report accurately reflects delay; bonus 5 pts if no arguments erupt.

  **Round 3: Sensory Overload**  
  - *Event:* Light at **T=0s**, sound at **T=3s**, but *one auditory member* gets "Sound at T=0s" (error).  
  - *Note Cards:*  
    - Visual: "Light flash at T=0s."  
    - Auditory: 2x "Sound at T=3s", 1x "Sound at T=0s" (error).  
  - *Goal:* Force resolution of conflicting inputs.  
  - *Payoff:* 20 pts if report ignores erroneous input and notes sound at T=3s.

  **Scoring Rules:**  
  - Points **only awarded** if:  
    - Consistency is achieved **without appointing a leader**.  
    - Editorial Board uses the board (no verbal directives).  
  - Facilitator deducts 5 pts for every "observer" claim (e.g., "I saw it clearly, trust me!").

  ---

  #### **Predicted Struggles**
  1. **Round 1:** Quick consensus. Editorial Board may dominate by writing first draft unilaterally.  
  2. **Round 2:** Auditory group insists on delay; Visual group resists. Editorial Board overwhelmed by scribbling compromises.  
  3. **Round 3:** Erroneous auditory member causes chaos. Group may scapegoat them or ignore the board entirely.  

  ---

  #### **Debrief (40 mins)**  
  **Guided Discussion:**  
  1. "What frustrated you? Did anyone feel like the 'real' observer?"  
  2. "How did the erased board affect your trust in the report?"  
  3. "Did the Memory Keeper’s record match your experience?"  

  **Map to Dennett:**  
  - **No Cartesian Theatre:** The board (seeming "screen") was wiped constantly—no stable stage for "showtime."  
  - **Multiple Drafts:** Competing sensory inputs (visual/auditory) were "drafts." The Editorial Board’s report was a temporary "narrative winner," not an absolute truth.  
  - **Distributed Control:** Points were lost if a leader emerged—highlighting Dennett’s rejection of a central "boss."  
  - **Memory’s Role:** The Memory Keeper stored the *final report*, not raw data—echoing how brains retrofit past events to fit the current story.  

  **Honest Limitations:**  
  - The game **can’t replicate real-time revision**. In brains, drafts compete *continuously* (e.g., a sound might retroactively alter your memory of a light). Here, reports are discrete.  

  **Key Takeaway:**  
  Consciousness isn’t a unified broadcast—it’s a battle of drafts where the "story" that sticks depends on timing, conflict, and context.  

  ---

  **Total Time:** 80 mins (10 setup + 30 game + 40 debrief), leaving 10 mins buffer. No prep reading needed—just willingness to argue!
