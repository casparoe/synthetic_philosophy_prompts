      - Move: The preface paradox involves a collection of individually justified beliefs that are jointly inconsistent (because the agent believes at least one is false). The Löbian obstacle, by contrast, is about the agent's belief in the general reliability of their belief-forming process. It does not require multiple beliefs to be inconsistent, but rather shows that the very belief in one's own reliability leads to triviality.

