prompt: |-
  My flatmate's finishing a thesis on whether there are any genuine moral dilemmas, and she's got suprisingly firm verdicts on the cases everyone drags out:

  - two strangers drowning the same distance away, you can only reach one: not a genuine dilemma, save either one, nobody is wronged
  - two equally serious promises to two people you love, impossible to keep both, and no way to make it up to whoever you let down: genuine dilemma
  - breaking a small promise to your roommate in order to stop something much worse from happening, where you can explain and apologise afterwards: not a genuine dilemma
  - a nurse in a blackout with one dose left and two patients, where hospital policy says treat in order of arrival: not a genuine dilemma, the policy settles it
  - staying with your mother versus going off to join a resistance movement, where either way someone you love is devastated: genuine dilemma

  The case I want to try on her: you're the only person who can stop a colleague from getting a job they got by stealing someone else's research, but the only way to do it is to pass on something a friend told you in confidence. Doing it is clearly the lesser evil and clearly what you ought to do, and it will wreck the friendship beyond repair.

  What will she say? I can think of two rules that fit her verdicts so far — one roughly like you're in a genuine dilemma only if every option open to you is one you'd be doing something wrong in taking, another roughly like you're in one whenever whichever you pick leaves a remainder you can't clean up — and they come apart here. Which is she more likely running, what other rules fit her track record just as well, and what case would you put to her next to tell them apart?
reasoning: |-
  Okay, let's tackle this question step by step. The user's flatmate has a thesis on genuine moral dilemmas and has specific verdicts on several cases. The user wants to know how she'd classify a new scenario and which of two possible rules she's following. They also ask for other rules that fit her verdicts and a case to distinguish between them.

  First, I need to understand the flatmate's existing verdicts. She has five cases with clear decisions:

  1. **Two strangers drowning**: Not a dilemma. Save either, no one wronged.
  2. **Two promises to loved ones**: Genuine dilemma. Can't keep both, no way to make up.
  3. **Breaking small promise to prevent worse**: Not a dilemma. Can explain/apologize.
  4. **Nurse with one dose, policy dictates**: Not a dilemma. Policy settles it.
  5. **Mother vs. resistance**: Genuine dilemma. Either choice devastates someone loved.

  Now, the user proposes a new scenario: Stopping a colleague who stole research by betraying a friend's confidence. The user thinks it's the lesser evil but wrecks the friendship.

  The user suggests two possible rules the flatmate might be using:
  1. **Wrongness Rule**: Genuine dilemma only if every option involves doing something wrong.
  2. **Unresolved Remainder Rule**: Genuine dilemma if any choice leaves a remainder that can't be cleaned up.

  I need to see how the new scenario fits under each rule. 

  Under the **Wrongness Rule**: Betraying confidence is wrong, but it's the lesser evil. So, there's a wrong action involved. But the verdicts in cases 1 and 4 had no wrongness because saving either stranger is permissible, and policy makes the nurse's choice right. Case 3 involved breaking a promise but was resolvable via apology. Here, even though it's the lesser evil, betraying confidence is still wrong. So this rule might classify it as a genuine dilemma.

  Under the **Unresolved Remainder Rule**: The friendship is wrecked beyond repair, which is a remainder that can't be cleaned up. Cases like the two promises and mother vs resistance had irreparable harm to relationships. Case 3 allowed for an apology, so no remainder. Here, the friendship can't be fixed, so this rule might also see it as a genuine dilemma.

  But the user thinks the two rules come apart here. Why? Maybe because the Wrongness Rule focuses on the inherent wrongness of the action, while the Unresolved Remainder focuses on the aftermath. However, in this case, both seem to point to a genuine dilemma. But the user's scenario notes that doing it is clearly the lesser evil and what ought to be done. That's a key point. The flatmate's case 3 had a resolvable remainder (apology), so not a dilemma. The new case has an irreparable friendship, so Unresolved Remainder would call it a dilemma. But the Wrongness Rule might also call it a dilemma because even though it's the right thing to do, betraying confidence is still morally wrong? Or is it permissible because it's the lesser evil?

  Wait, in case 3, breaking a small promise to prevent worse was not a dilemma because you could apologize. That implies that the action wasn't wrong because it was justified. Similarly, in the nurse's case, following policy makes it permissible. So for the Wrongness Rule, if an action is justified (lesser evil), it might not be considered wrong. Therefore, in the new scenario, if betraying confidence is the lesser evil and obligatory, it might not be seen as wrong. Hence, not a genuine dilemma under the Wrongness Rule. But under Unresolved Remainder, the wrecked friendship can't be fixed, so it's a dilemma. That's where they come apart.

  So, applying the rules:

  - **Wrongness Rule**: Since it's the lesser evil and obligatory, betraying confidence isn't wrong. Thus, not a genuine dilemma.
  - **Unresolved Remainder Rule**: The friendship is irreparably damaged, so genuine dilemma.

  Now, looking at the flatmate's past verdicts. Case 2 (two promises) is a genuine dilemma. Both options involve breaking a promise, which is wrong, and the harm can't be resolved. Case 5 (mother vs resistance) involves causing devastation to a loved one either way, which is irreparable. 

  Case 3 isn't a dilemma because the remainder (broken promise) can be cleaned up with an apology. So Unresolved Remainder fits. Case 1 and 4 have no remainders or the remainders are handled (policy, no specific wronged party).

  The user wants to know which rule the flatmate is using. But the new scenario could go either way. If she says it's a genuine dilemma, she's likely using Unresolved Remainder. If not, then the Wrongness Rule.

  But are there other rules that fit her verdicts? For example, **Agent-Regret Rule**: Dilemmas involve choices where either option results in harm that the agent must regret, even if justified. Case 2 and 5 involve unavoidable harm to loved ones, leading to agent-regret. Case 1 has no specific harm (strangers), so no regret needed. Case 4, policy removes regret. Case 3, apology resolves regret. The new scenario involves wrecking a friendship, so agent-regret is present. This might align with Unresolved Remainder.

  Another rule: **Relational Obligations Rule**: Dilemmas arise when core relational duties conflict. Case 2 involves promises to loved ones, Case 5 family vs cause. Case 1 has no relational ties. Case 3 is a small promise, not core. Case 4 is professional, policy-bound. The new scenario involves a friend's confidence, so relational. This could also align.

  To distinguish between Wrongness and Unresolved Remainder, the user needs a test case. For example: **Whistleblower Scenario**. You must report a friend's minor crime (e.g., petty theft) which is the right thing, but the friendship ends. Here, the action is obligatory (lesser evil? maybe not clearly), but the friendship is wrecked. If the flatmate says genuine dilemma, she's using Unresolved Remainder. If not, perhaps Wrongness Rule (if she considers reporting not wrong).

  But if the crime is minor, maybe it's not obligatory to report? Need a case where the action is clearly right but leaves irreparable harm. Another example: **Sacrificing one to save many in a way that's justified but causes personal loss**. Like, diverting a trolley to save five but killing your own friend. The action is justified (lesser evil), but you cause irreparable harm to the friend's family and your own conscience. Here, Unresolved Remainder would say dilemma, Wrongness Rule might not if it's permissible.

  But the flatmate's case 1 is similar (two strangers), so if it's your friend, does it change? In her verdicts, relational ties matter (promises to loved ones). So maybe the Whistleblower case where the harm is irreparable and relational. 

