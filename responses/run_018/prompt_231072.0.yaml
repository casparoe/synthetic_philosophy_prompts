answer: |-
  ### Electoral Systems Decision Tree  
  *Discover your position based on values, not labels. Answer each question without jumping to "PR" or "FPTP."*  

  ---

  **Q1: Should a party winning 49% of the vote in a district *always* earn at least one seat there?**  
  - **YES** → Go to Q2.  
  - **NO** → Go to Q5.  

  **Q2: Must every geographic community have its *own* directly accountable representative?**  
  - **YES** → Go to Q3.  
  - **NO** → **Party List PR**  
    - *Awkward commitment:* Sacrifices local accountability to ensure party proportionality. Coalitions form *after* elections, risking unstable negotiations.  

  **Q3: Should voters be able to personally eject *their specific* incumbent?**  
  - **YES** → **Single Transferable Vote (STV)**  
    - *Awkward commitment:* Complex vote-counting and larger districts dilute hyper-local ties.  
  - **NO** → **Mixed-Member Proportional (MMP)**  
    - *Awkward commitment:* Two types of representatives (local vs. party) confuse accountability.  

  **Q5: Is it worse for a party to win a *majority of seats* without a majority of votes than to have prolonged coalition talks?**  
  - **YES** → Go to Q6.  
  - **NO** → Go to Q7.  

  **Q6: Should simplicity for voters override perfect fairness?**  
  - **YES** → **First Past the Post (FPTP)**  
    - *Awkward commitment:* Lets 49% of a district’s voters win *zero* representation. "Manufactured majorities" common.  
  - **NO** → **Approval Voting / Score Voting** (Unoccupied)  
    - *Diagnosis:* Underexplored. Balances simplicity and fairness but lacks major real-world examples.  

  **Q7: Must winners earn >50% in their district, even if it takes multiple rounds?**  
  - **YES** → **Two-Round System (TRS)**  
    - *Awkward commitment:* Runoffs costly and lower turnout. Still risks unproportional legislatures.  
  - **NO** → **Alternative Vote (AV)**  
    - *Awkward commitment:* Favors centrists; doesn’t fix national-level disproportionality.  

  ---

  **Unoccupied Combinations & Why:**  
  - **Geographic accountability + No local rep ejection (Q3→NO) + Anti-PR (Q1→NO):** *Incoherent*. Demands local reps but rejects tools to hold them accountable.  
  - **National proportionality + Reject post-election coalitions:** *Unattractive*. Proportionality almost always requires multi-party bargaining.  

  **Verdict:** The core tension is between *individual voter power* (local reps, ejecting incumbents) and *collective fairness* (seat-vote proportionality, minimizing wasted votes).
