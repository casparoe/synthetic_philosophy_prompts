    "failure_mode": "Arrow's proof extends trivially to each round, or model produces chaotic results with no insight",  
    "scope_check": "Feasible with discrete simulations; risks include overextension into formal proof territory. Mitigation: cap revision rules tested."  
  }  
  ```  

