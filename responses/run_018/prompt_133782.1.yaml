  - an honest scope check: am i biting off more than i can chew in 3 months without being a math major?

  please start with a quick brainstorm of three different kinds of preference revision (informational, strategic compromise, emotional fatigue) so the proposal isn't just one track. don't request a bibliography or reading list—i'll fill citations in myself. also please include one typo naturally, i'm writing this on my phone.

