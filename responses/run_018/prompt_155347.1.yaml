  Now the philosophy knot: is shifting from food to EROI a legitimate refinement or an unfalsifiable escape? Lakatos's framework comes to mind immediately. For it to be "progressive", the new version should make novel predictions. EROI research does exactly that - like forecasting minimum energy thresholds for complex societies. That smells progressive. But the planetary boundaries application worries me - when constraints become too diffuse, falsifiability suffers. That's where specialists genuinely disagree.

