prompt: |-
  Longtime lurker here, posting this because it came up in a thread on priors and I want to sanity-check my reading. I recently reread Hume's essay 'Of Miracles' (from the Enquiry) and his argument as I understand it goes roughly: a miracle is a violation of a law of nature, laws of nature are established by uniform experience, so the evidence for the law will always outweigh any testimony, meaning testimony can never make it rational to believe a miracle report.

  Neat result, but it seems to prove too much? On that logic nobody could ever rationally accept eyewitness reports of something genuinely unprecendented — the first meteorite falls, say, or radioactivity — because prior experience would always count against the report. But clearly we can and did accept such things, and were right to.

  So my question: roughly how many independent eyewitnesses would Hume's argument actually demand before a rational person should accept, e.g., a resurrection? Presumably there's some threshold of witnesses where the likelihood ratio swamps even a very low prior and the balance tips. And is Hume's maxim just an informal anticipation of Bayesian updating with extreme priors — i.e., something like Cromwell's rule applied to testimony — or is there anything in it that doesn't translate into the Bayesian frame? If it's the former, is the only real disagreement between Hume and the believer a disagreement about the size of the prior?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're referencing Hume's "Of Miracles" essay, specifically his argument that testimony can never justify belief in miracles because uniform experience supports natural laws. The user feels this proves too much, using examples like meteorites or radioactivity—unprecedented events initially rejected but later accepted. They want to know how many witnesses would overcome Hume's skepticism, especially for something like resurrection, and if Hume's stance is essentially Bayesian with extreme priors.

  First, I need to recall Hume's core argument. He defines miracles as violations of natural laws, which are established by uniform experience. Since testimony for a miracle contradicts this uniform experience, the evidence for the law should always outweigh the testimony. The user's point about unprecedented events is valid. If Hume's argument were strictly applied, any new phenomenon would be dismissed because prior experience counts against it. But history shows we do accept new discoveries, so Hume's logic seems flawed here.

  The user mentions a threshold of witnesses where the likelihood ratio could overcome a low prior. That's a Bayesian perspective. I should explain how Bayesian updating works here. The prior probability of a miracle (like resurrection) is extremely low based on natural laws. Each reliable witness report acts as evidence, shifting the posterior probability. But for miracles, the prior is so low that even multiple witnesses might not suffice because the likelihood of alternative explanations (mistakes, lies) is higher.

  Next, the examples of meteorites and radioactivity. These weren't true violations of natural laws but expansions of them. Initially rejected due to lack of evidence, but with repeated, testable evidence, they were incorporated. Miracles, defined as supernatural violations, can't be tested or repeated, so they remain outside scientific adjustment. Hume's error was conflating unprecedented events with miraculous ones, ignoring that new evidence can update our understanding without violating established laws.

  The user's deeper need might be understanding the debate between Hume and believers. Is it just about prior probabilities? Partly yes, but also about what constitutes a natural law. Believers might assign a non-zero prior to miracles based on theological grounds, while Humeans see it as zero. Also, the quality and context of testimony matter. Hume's argument requires that no testimony could be reliable enough, but Bayesian thinking allows that theoretically, overwhelming evidence could shift belief, though practically it's near impossible.

  Calculating the number of witnesses involves Bayes' theorem. For resurrection, if the prior is 1 in a billion, and each witness has a 1% false positive rate, you'd need around 18 reliable witnesses to get a posterior of 50%. But this is oversimplified. Factors like witness reliability, corroborating evidence, and alternative explanations affect each report's likelihood. In real cases, these factors often reduce the weight of testimony for miracles.

  Hume's rule as Cromwell's rule makes sense—never set priors to absolute zero. But Hume might be implying that for practical purposes, the prior is so low that no testimony can overcome it. The key disagreement is whether miracles are possible. If a believer accepts supernatural intervention, their prior isn't as low, making testimony sufficient. Hume's prior excludes the supernatural, so no testimony suffices. Thus, the debate is foundational: can natural laws be violated, or are we misunderstanding them?

  The user might also be interested in the philosophical implications. Hume's argument is probabilistic, not deductive. Critics like Earman say Hume overstates uniformity; natural laws are corrigible. So, while Bayesian framing captures Hume's intuition, it also shows its limitations when applied to genuine scientific anomalies versus miraculous claims.
answer: |-
  You've hit on one of the most persistent critiques of Hume's argument! Your reading is perceptive, and the "proves too much" objection is spot-on. Let's break down Hume's argument, its Bayesian interpretation, and the witness threshold question.

  1.  **Hume's Core Argument (Simplified):**
      *   A miracle is a "violation of a law of nature."
      *   Laws of nature are established by "firm and unalterable experience" – vast, uniform, consistent counter-instances.
      *   Testimony is evidence *for* the miracle.
      *   We must weigh the evidence *for* the law of nature (the uniform experience) against the evidence *for* the miracle (the testimony).
      *   The evidence for the law of nature (based on universal experience) is *always* stronger than any possible testimony (which is inherently fallible and prone to error, deception, or misunderstanding).
      *   Therefore, "no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavours to establish." Crucially, Hume argues this standard is *never* met.

  2.  **The "Proves Too Much" Objection (Meteorites, Radioactivity, etc.):**
      *   You're absolutely right. If Hume's argument categorically forbade believing testimony about *any* event contradicting prior uniform experience, it *would* forbid believing in genuinely new, natural phenomena.
      *   Hume's defenders usually offer a crucial distinction:
          *   **Unexplained/Unprecedented Event:** An event *not previously observed* but *not necessarily violating* known physical laws. It expands or refines our understanding of nature. (E.g., The first meteorite reports contradicted the *belief* "rocks don't fall from the sky," but not the *fundamental laws* governing motion, gravity, and celestial bodies. They revealed an unknown *application* or *source* of those laws).
          *   **Genuine Miracle (as defined by Hume):** An event that *violates* an established law of nature *as we understand its fundamental principles*. It posits a suspension or contradiction of the causal mechanisms themselves (e.g., resurrection violating biological laws of decay and death, walking on water violating gravity/inertia).
      *   **Hume's Error (or Oversimplification):** He conflated "uniform experience" with "infallible knowledge of ultimate natural laws." Science progresses precisely because "uniform experience" is corrigible. A *single* well-verified counter-instance *forces* us to revise our understanding of the law (like radioactivity revising notions of atomic stability), not accept a supernatural violation. Hume underestimated the ability of *repeatable, testable* evidence to overturn prior beliefs. Miracles, by definition (singular, unrepeatable supernatural interventions), cannot provide this kind of evidence.

  3.  **The Bayesian Framing:**
      *   **Yes, Hume's argument is a powerful (if informal) anticipation of Bayesian reasoning.**
      *   Let:
          *   `M` = The miracle occurred.
          *   `~M` = The miracle did not occur (the report is mistaken/deceptive).
          *   `T` = The testimony report is given.
      *   We want `P(M | T)` (Probability the miracle happened *given* the testimony).
      *   Bayes' Theorem: `P(M | T) = [P(T | M) * P(M)] / P(T)`
      *   **P(M) - The Prior Probability:** This is *extremely* low for a genuine Humean miracle (a violation of fundamental natural law). Based on all scientific understanding and uniform experience, `P(M)` is vanishingly small. This is Hume's "evidence for the law." Setting `P(M)` *exactly* to zero violates Cromwell's Rule and makes belief impossible regardless of evidence. But setting it to 10^-9, 10^-12, or lower is often seen as reasonable for events like resurrection.
      *   **P(T | M) - Likelihood if True:** Probability of getting this testimony *if* the miracle actually happened. Less than 1! (Not all true miracles are witnessed/reported reliably). Say 0.5 - 0.9 for good witnesses? (Highly debatable).
      *   **P(T | ~M) - Likelihood if False:** Probability of getting this testimony *if no miracle happened*. This is *high* because of the many ways testimony can be mistaken, deceptive, hallucinated, misinterpreted, etc. `P(T | ~M)` might be 0.1, 0.01, or even lower for a *single, specific, detailed* report by a reliable witness – but crucially, it's almost certainly *much larger* than `P(M)`.
      *   **P(T) - Total Probability of Testimony:** `P(T) = P(T | M)*P(M) + P(T | ~M)*P(~M)`. Since `P(M)` is tiny and `P(~M)` ≈ 1, `P(T) ≈ P(T | ~M)`.
      *   **The Posterior:** `P(M | T) ≈ [P(T | M) * P(M)] / P(T | ~M)`
      *   **The Crucial Ratio:** `P(M | T)` is proportional to `[P(T | M) / P(T | ~M)] * P(M)`. For `P(M | T)` to be > 0.5 (more likely true than false), we need:
          `[P(T | M) / P(T | ~M)] * P(M) > 0.5 * P(T)` (which ≈ `0.5 * P(T | ~M)` since `P(T) ≈ P(T | ~M)`)
          Simplifying, the *Likelihood Ratio* `LR = P(T | M) / P(T | ~M)` needs to be > `0.5 / P(M)`.
      *   **The Problem for Miracles:** Because `P(M)` is *so* incredibly small (say 10^-10), the required Likelihood Ratio `LR` needs to be *astronomically large* (e.g., 5 x 10^9 for `P(M) = 10^-10`). This means the testimony must be *vastly* more probable if the miracle happened than if it didn't.

  4.  **How Many Witnesses? A Simplified Calculation:**
      *   Assume `n` *independent* witnesses of *equal reliability*.
      *   Let `s = P(T_i | M)` (Sensitivity - prob. a witness reports truly if M). Assume `s` is constant.
      *   Let `f = P(T_i | ~M)` (False Positive Rate - prob. a witness reports falsely if ~M). Assume `f` is constant.
      *   The combined Likelihood Ratio for `n` independent reports: `LR_total = (s / f)^n`
      *   We need `LR_total > k / P(M)` (where `k` is a constant around 0.5, depending on exact threshold).
      *   Solving for `n`: `n > log( k / P(M) ) / log( s / f )`
      *   **Example (Resurrection):**
          *   `P(M) = 10^{-10}` (Extremely skeptical prior)
          *   `s = 0.8` (If it happened, 80% chance a good witness reports it)
          *   `f = 0.01` (1% chance a good witness falsely reports a resurrection if it didn't happen - *very* optimistic for `f`)
          *   `s/f = 80`
          *   `k ≈ 0.5`
          *   `n > log( 0.5 / 10^{-10} ) / log(80) = log(5 \times 10^9) / log(80) ≈ 22.3 / 1.903 ≈ 11.7`
          *   So, `n ≥ 12` witnesses needed *in this model*.
      *   **Why this is unrealistic & underestimates the problem:**
          *   **`f` is too low:** The false positive rate `P(T_i | ~M)` for something like resurrection isn't 1%. It encompasses mass hallucination, complex deception, profound grief/delusion, legend formation, etc., especially in ancient contexts. `f` might be more realistically 0.1 or higher *per individual report*, making `s/f` much smaller (e.g., 8 or less).
          *   **Independence is false:** Witnesses influence each other (shared cultural expectations, group dynamics, leading questions, contamination of testimony). This drastically reduces the effective `n`.
          *   **`s` is debatable:** Even if a resurrection happened, would it be clearly perceived/reported reliably? What counts as "seeing" the resurrected person?
          *   **`P(M)` might be lower:** Critics argue `10^{-10}` is *too high* for a genuine law violation.
          *   **Corroborating Evidence:** Hume focuses *only* on testimony. Physical evidence (e.g., incontrovertible video, repeated medical exams) could drastically change `P(T | M)/P(T | ~M)`, but is absent for historical miracles.
          *   **Result:** Using more realistic numbers (e.g., `P(M)=10^{-12}`, `s=0.8`, `f=0.1`, `s/f=8`), you get `n > log(0.5 / 10^{-12}) / log(8) ≈ 27.3 / 0.903 ≈ 30.2`. With less independence or higher `f`, `n` easily climbs into the hundreds or thousands, far exceeding any historical claim.

  5.  **Hume vs. Bayesianism & the Core Disagreement:**
      *   **Anticipation of Bayesianism:** Hume's core intuition – weighing prior probability (`P(M)`) against the likelihood of evidence under alternative explanations (`P(T | ~M)`) – is fundamentally Bayesian. His maxim ("falsehood more miraculous") is a version of comparing `P(T | ~M)` to `P(M)*P(T | M)`.
      *   **Cromwell's Rule:** Hume arguably *does* implicitly violate it by treating the prior `P(M)` as so low that *no finite amount* of testimony (given its inherent unreliability `P(T | ~M)`) can overcome it. He doesn't *strictly* set it to zero, but functionally, it's near-zero. A strict Bayesian insists `P(M) > 0`, allowing (theoretically) enough evidence to overcome it.
      *   **The Core Disagreement:**
          *   **Humean Skeptic:** Believes `P(M)` (prior for supernatural law violation) is so low *and* `P(T | ~M)` (probability of false testimony/mistake) is sufficiently high *and* the conditions for witness independence/corroboration are so rarely (if ever) met, that `P(M | T)` never reaches a level justifying rational belief for *any* actual historical testimony about miracles.
          *   **Believer:** Disagrees on one or more key points:
              1.  **Prior (`P(M)`):** Assigns a higher prior based on philosophical/theological grounds (e.g., belief in a God who can intervene). This is the *most fundamental* disagreement.
              2.  **Likelihood Ratio (`P(T | M)/P(T | ~M)`):** Argues the *specific* testimony for *their* miracle (e.g., resurrection accounts) is of such exceptionally high quality, consistency, and from reliable witnesses facing persecution, that `P(T | M)` is high and `P(T | ~M)` is *extremely* low (making the LR huge). They argue Hume unfairly generalizes the unreliability of testimony.
              3.  **Nature of the Event:** Argues the event, while miraculous, is not a *pure* "violation" but fits within a broader theistic framework, making it less inherently improbable *given that framework* (affecting `P(M)` contextually).
          *   **The Scientific Anomaly vs. Miracle Distinction:** This is key. Both agree *unprecedented natural events* can be accepted. The believer argues *their* event *is* that unprecedented event. The Humean argues resurrection *isn't* just unprecedented science; it's a *supernatural violation*, fundamentally different than discovering meteorites or radioactivity, which were integrated into natural law *without* violating core principles.

  **In Conclusion:**

  1.  **Hume's Argument & Its Flaw:** It powerfully highlights the extreme evidential burden for miracles due to the overwhelming prior against natural law violations. However, your "proves too much" objection is valid; Hume's strict form risks rejecting *any* genuinely novel natural phenomenon. The defense relies on distinguishing unprecedented events (which refine laws) from miraculous violations (which break them).
  2.  **Witness Threshold:** It's theoretically calculable using Bayes, but realistically immense (dozens to thousands of *truly independent, highly reliable* witnesses with *no plausible alternative explanations*), far exceeding the evidence for any claimed historical miracle. The numbers explode when you account for witness dependence and realistic false positive rates.
  3.  **Bayesian Frame:** Hume's core logic is a brilliant informal Bayesian argument. The formalization shows *why* testimony struggles: the required Likelihood Ratio is astronomical due to the tiny prior.
  4.  **Core Disagreement:** While the Bayesian frame clarifies the debate, the *fundamental* disagreement is over the prior probability `P(M)` of a supernatural law violation occurring. The believer assigns a significantly higher prior (based on worldview) than the Humean skeptic. Secondary disagreements involve the reliability assessment of the *specific* testimony (`P(T | M)` vs. `P(T | ~M)`). Hume argues that the inherent fallibility of testimony and the lack of corroborating physical evidence *always* make `P(T | ~M)` sufficiently high relative to the required `LR` needed to overcome `P(M)`, preventing rational belief.

  Hume's essay remains a cornerstone of skeptical thought precisely because it forces believers to confront the sheer weight of evidence required to overcome our rational understanding of how the world consistently works. Whether that burden is *impossible* to meet, as Hume contends, or merely *extremely difficult* but met in specific cases, as believers argue, is the enduring debate. Your critique shows you've grasped the argument's power and its potential weakness.
