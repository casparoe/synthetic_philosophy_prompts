prompt: |-
  ok so me and jake got into it last night about whether giving your advisor an expensive bottle of wine is corruption or just politeness, and now i'm running a study group for junior poli-sci majors who think corruption is just brown envelopes in poor countries. i need a teaching plan, not the lecture itself. what has to come first—maybe that every culture draws a line between gift and bribe, but the line moves? what's the one carrying example? i'm weighing japanese omiyage culture against a german bureaucrat refusing coffee, but worry that's too stereotypey—should i use something closer like clientelism in local politics? what misconceptions do they show up with—probably that western legal standards are universial and that if no law is technically broken it's clean? map exactly where in the sequence i head each off. also my friend kept pushing this idea he called 'moral visibility'—that corruption is really defined by whether you can narrate the exchange as a market transaction without blushing. where does that fit in the arc, and does it need its own example? what's the end check—maybe classify three ambiguous cases? and what should i flat-out skip—probably deep ethnography of specific patron-client networks? keep it casual, there's a typo or two.
reasoning: |-
  Okay, the user is a grad student running a study group for junior poli-sci majors who have a narrow view of corruption as only involving "brown envelopes in poor countries." They had an argument with Jake about whether giving an expensive bottle of wine to an advisor is corruption or politeness, and now needs a teaching plan that addresses this. 

  First, I need to unpack their core needs: They want to dismantle the misconception that corruption is solely a "Global South" phenomenon and tied to explicit illegality. The students likely equate corruption with poverty and overt bribery, missing how it manifests in subtle, institutional ways everywhere. The wine debate is perfect because it's relatable and ambiguous - it forces them to confront how context and intent blur lines.

  The user worries about stereotypes (Japanese gifts vs German bureaucracy) but also wants concrete examples. Maybe I can bridge this by using their local politics suggestion - like city councilors doing "favors" for donors - which feels immediate and less clichéd. Clientelism in local politics works well because it's universal but culturally variable. 

  Ah, and Jake's "moral visibility" concept is intriguing! It's essentially about social accountability - if you'd feel shame describing the transaction aloud, it hints at corruption. That deserves a dedicated spot in the lesson arc, maybe paired with the wine example: "Would you casually mention gifting that $200 Bordeaux to your advisor in a department meeting?" 

  For structure: Starting with wine makes sense because it hooks them personally. Then we dismantle their "brown envelopes" assumption by showing legal ≠ ethical (lobbying examples!). The "moral visibility" test comes midway as a litmus paper for gray areas. The endpoint should be classifying ambiguous cases to apply all lenses - like a professor "happening" to assign a donor's kid a prestigious research spot. 

  What to skip? Deep ethnography is overkill for undergrads. Keep it conceptual with punchy examples. Also avoid getting bogged down in legal minutiae - this is about norms, not statutes. 

  ...Wait, they mentioned a typo in the query ("universial") but it's trivial. Probably just signaling they're relaxed about formalities. I'll match that tone in the plan - workshop-style, not lecture-heavy. 

  Final check: The three-case classification at the end must force trade-offs. Example: "A lobbyist takes a senator on a 'fact-finding trip' to Monaco." Is it corrupt if legal? Does context change it? Would the senator proudly tweet about it? Boom - all lenses activated.
answer: |-
  Here's a lean, workshop-style teaching plan focused on shifting their "brown envelopes only" mindset, using your wine dilemma as the anchor:

  **Core Goal:** Challenge the misconception that corruption is only explicit, illegal, & confined to "poor countries." Introduce context-dependency & the ambiguity of "gift vs. bribe."

  **Target Misconceptions to Head Off:**
  1.  **MC1:** Corruption = only illegal cash bribes in developing nations.
  2.  **MC2:** If it's legal (or common), it's not corruption.
  3.  **MC3:** Western institutions are inherently "clean" due to strong laws.
  4.  **MC4:** Intent doesn't matter; only the act/outcome does.

  **Session Structure (90 mins):**

  1.  **Hook: The Wine Bottle Dilemma (15 mins)**
      *   **Activity:** Present the scenario: "You give your advisor a $200 bottle of wine *after* they wrote you a glowing recommendation for a prestigious fellowship. Corruption or politeness? Discuss in pairs."
      *   **Objective:** Surface initial intuitions & reveal ambiguity. Highlight disagreement (like yours with Jake).
      *   **Head Off:** Immediately challenges **MC1** (not poor, not cash) and **MC2** (no law broken?).

  2.  **Deconstructing "The Line": Context is King (20 mins)**
      *   **Activity:** Brainstorm factors influencing the Wine Bottle decision (e.g., school policy, wine cost relative to your income, timing relative to the favor, advisor's power, cultural norms in your dept, expectation of *future* favors).
      *   **Input:** Briefly introduce key concepts:
          *   **The Moving Line:** Emphasize no universal standard. Show *contrasting* examples quickly:
              *   *Example 1:* Japanese Omiyage (focus: *expected* social lubricant, modest value, reciprocity - **not inherently corrupt, but context can twist it**).
              *   *Example 2:* Strict German Bureaucrat Rule (focus: *preventing* even perception of influence, prioritizing impartiality).
          *   **Bridge:** Acknowledge potential stereotypes, pivot to: "But how does this play out *here*? Think local politics."
      *   **Carrying Example: Local Clientelism (US/EU Focus)** - "Councilor Smith gets a big campaign donation from Developer Jones. 6 months later, Smith votes to rezone Jones's land, increasing its value 10x. Legal? Often yes. Problematic? Why?" (Links gift/favor to power/influence).
      *   **Head Off:** Directly tackles **MC3** (shows "clean" systems have gray areas & influence-peddling) and reinforces challenge to **MC1 & MC2**. Establishes context (power, reciprocity, value, expectation) as crucial.

  3.  **Jake's "Moral Visibility" Test (15 mins)**
      *   **Activity:** Introduce the concept: "Can you describe this transaction openly *as a market exchange* without shame? 'I gave Advisor X $200 worth of wine *for* that recommendation.' If that makes you squirm, why?"
      *   **Discussion:** How does this test apply to the Wine Bottle? To the Local Clientelism example? Does it capture something formal rules miss? (Connects to norms, hypocrisy, social sanction).
      *   **Fit:** Perfect bridge between context/ambiguity and the *social* definition of corruption. It makes the implicit explicit. **Don't skip it!**
      *   **Head Off:** Challenges **MC4** (highlights the role of perception, narrative, and social morality). Complicates the purely legalistic view (**MC2**).

  4.  **Applying the Lenses: The Gray Zone Gauntlet (25 mins)**
      *   **Activity:** Small groups classify 3 ambiguous cases using Context + Moral Visibility:
          1.  **Lobbyist Lunch:** A corporate lobbyist takes a key regulator to a $500/person dinner *regularly* to "explain industry challenges." Legal? Common?
          2.  **"Priority Hiring":** A firm gives an internship to the well-connected but average-ability child of a major potential client. No explicit quid pro quo mentioned.
          3.  **Community "Thank You":** Residents of a wealthy neighborhood pool funds to give a $10k "holiday bonus" to the popular police chief credited with reducing local crime. (Is it different if it's a poor neighborhood pooling $100?).
      *   **Objective:** Force application of context (power, value, expectation, reciprocity) and moral visibility. Reveal trade-offs and disagreements.
      *   **Head Off:** Solidifies understanding that corruption exists on a spectrum, often in the gray areas (**MC1, MC2, MC3**). Shows universality.

  5.  **Wrap-Up & Key Takeaway (15 mins)**
      *   **Synthesis:** Quick recap: Corruption isn't just illegal bribes (**MC1**). It's about the *misuse of entrusted power for private gain*. The line between gift/bribe depends heavily on **Context** (power dynamics, value, timing, expectation, cultural norms) and **Social Perception** ("Moral Visibility"). Legal != clean (**MC2**). It happens everywhere (**MC3**).
      *   **Final Thought:** "Your advisor's wine bottle? Where does *your* context and 'moral visibility' test place it now? Does knowing the power imbalance change things?"

  **What to Skip (As Planned):**
  *   Deep ethnography of specific patron-client networks (too granular for intro).
  *   Detailed legal comparisons across countries.
  *   Extensive historical deep dives.
  *   Overly academic jargon (keep it "corruption as misuse of power," not "principal-agent problems" unless it emerges naturally).

  **Why This Works:**
  *   Starts personal (wine), expands outward (local, intl examples).
  *   Actively uses *their* likely misconceptions as the roadblocks to dismantle.
  *   Uses relatable examples alongside less familiar ones.
  *   Integrates Jake's "Moral Visibility" as a practical, memorable heuristic.
  *   Ends with application, forcing synthesis.
  *   Casual, discussion-based, focused on shifting perspective.

  **Tone:** Keep it conversational, workshop-style. Use phrases like "Jake argued...", "Let's test this with...", "Where does this leave our wine bottle?". Embrace the ambiguity – the goal is to complicate their thinking, not give easy answers. Good luck!
