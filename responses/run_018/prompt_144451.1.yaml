prompt: |-
  I'm moderating a podcast Q&A with an unnamed philosopher of language who still holds the Hofstadter-style view that statistical machine traslation is shallow—basically pattern matching at scale with no real comprehension. He loves to deflect by saying LLMs just do the same thing with more parameters. Write me a sequence of questions that pins him down on what understanding actually requires: is it causal connection to the world, the ability to explain ambiguities, or something like Searle's intentionality? I want the first question to hit him with the fact that modern neural MT handles long-range syntactic dependancies that old rule-based systems never could, then a follow-up asking whether his standard also applies to human interpreters who work by intuition rather than explicit rules. End with one about what specific empirical finding—say, a system that resolves cross-lingual anaphora in gender-neutral languages using only embodied interaction data and no symbolic grammar—would actually change his mind. Keep it casual, like I'm writing this at 2am and forgot to proofread.
