  ### Workshop Design: "Epistemic Fragmentation in Lottocracy"  
  **Duration:** 90 minutes  
  **Participants:** 12 philosophy grad students  
  **Goal:** Experience coordination failures in randomly assembled groups due to epistemic fragmentation, bypassing democracy-vs-expertise debates.  

  ---

  #### **Materials**  
  1. **Domain Cards (12 unique):**  
     - Each card has:  
       - A specialized domain (e.g., "urban hydrology," "indigenous tenure systems," "quantum ethics").  
       - 3–5 niche jargon terms + brief definitions (e.g., "aquifer recharge: water replenishing groundwater").  
       - **1 translation token** (physical token: paper clip, colored card, or poker chip).  
     *Example Card:*  
     > **Domain:** Climate Modeling  
     > **Jargon:** Albedo effect (reflectivity of surfaces), RCP 8.5 (high-emissions scenario), Teleconnections (climate linkages).  
     > **Tokens:** 1  

  2. **Development Proposal (1 per group):**  
     *Example:*  
     > **"GreenCorp Dam Proposal":** Build a hydroelectric dam on River X. Benefits: clean energy, jobs. Risks: flooding sacred sites, disrupting fish migration, aquifer depletion. *Approve or reject?*  

  3. **Randomizers:**  
     - Two hats: one for domain cards, one for numbered slips (1–6) to assign speaking/voting order.  
     - Timer (for speaking turns).  

  4. **Grouping:**  
     - Split 12 students into **two groups of 6** (each group is a separate "citizen assembly").  

  ---

  #### **Rules**  
  **Phase 1: Setup (10 min)**  
  - Assign each student a random **domain card** and **1 translation token**.  
  - Read the development proposal aloud.  
  - **Rules Brief:**  
    > "You must deliberate in your domain’s jargon. To use plain language, spend a translation token. Voting order is random each round. Goal: Reach a group decision on the proposal."  

  **Phase 2: Deliberation (45 min, 3 rounds × 15 min each)**  
  - **Round Structure:**  
    1. **Randomize Speaking Order:** Draw numbered slips from a hat to set the sequence.  
    2. **Turn-Based Speaking (1.5 min/person):**  
       - Speakers **must use ≥1 jargon term** from their card.  
       - To **translate jargon** (define terms plainly), spend a token → token is surrendered to the facilitator.  
       - *No interjections*; only the speaker may talk.  
    3. **Repeat** for 3 rounds (new random order each round).  

  **Phase 3: Voting (5 min)**  
  - Randomize voting order via hat draw.  
  - Each student votes **yes/no** on the proposal publicly.  
  - **No majority?** Revote until consensus (emphasize real-world stakes).  

  ---

  #### **Debrief (30 min)**  
  **Guiding Questions:**  
  1. **Experience:**  
     - "What frustrated you? Did jargon obscure critical points?"  
     - "How did token scarcity shape strategy?"  
     - "Did voting order affect outcomes?"  

  2. **Mapping to Real Lottocracy Critiques:**  
     | **Observed Failure**         | **Real-World Critique of Sortition**                     |  
     |------------------------------|----------------------------------------------------------|  
     | Jargon barriers → poor decisions | **Epistemic injustice:** Marginalized knowledge (e.g., indigenous expertise) gets "lost in translation" without structural support. |  
     | Token hoarding/underuse      | **Inequity:** Costly translation favors dominant speakers or leaves gaps. Real assemblies need funded facilitation. |  
     | Random speaking order chaos  | **Procedural unfairness:** Luck in turn order skews influence; real assemblies need moderated agendas. |  
     | Fragmented consensus         | **Shallow deliberation:** Random bodies lack shared lifeworlds; may default to lowest-common-denominator decisions. |  

  3. **What This *Can’t* Reproduce:**  
     - **Learning over time:** Real assemblies span weeks/months with expert briefings.  
     - **Power dynamics:** Token scarcity simplifies real imbalances (e.g., class/gender affecting speech).  
     - **Facilitation:** Professionals in real assemblies actively bridge gaps (unlike our token mechanic).  

  ---

  #### **Predictable 1st-Run Failures**  
  1. **Jargon Overload:** Students will fixate on decoding terms ("What’s *usufruct rights*?") instead of debating the proposal.  
  2. **Token Mismanagement:** Most will hoard tokens until too late ("I saved mine, then ran out of time!").  
  3. **Voting Chaos:** Random order may cause bandwagon effects (early voters sway later ones).  
  4. **Fragmented Outcomes:** Groups likely reject the proposal by default—not due to merit, but communication collapse.  

  ---

  #### **Why This Works**  
  - **Discovery > Lecture:** Students *feel* fragmentation’s pull via failed coordination, making critiques visceral.  
  - **Philosophy Hook:** Focuses on epistemology ("How do we *know* together?") rather than procedural democracy.  
  - **Scalable:** Adjust time/jargon complexity based on group engagement.  

  **Final Tip:** Assign a "silent observer" in each group to note dysfunctions for debrief. Lean into the chaos—it’s the point!
