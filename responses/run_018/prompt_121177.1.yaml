prompt: |-
  Hey — I'm putting together a packet for a reading group on anthropic reasoning, and two people in it have been going at each other for like six weeks without converging: one is committed to the self-sampling assumption (SSA, roughly: treat yourself as a random sample from the observers in some reference class) and is basically fine with the doomsday-style argument; the other is committed to the self-indication assumption (SIA, roughly: you should favor hypotheses on which more observers exist, since your existence is itself evidence) and has made peace with the presumptuous philosopher but thinks the doomsday argument is a straight-up error. They've definately been talking past each other — half of what they say is about the reference class, and half is about whether these are even evidential principles rather than decision rules — so I want the document they should have produced instead: a joint statement of an adversarial collaboration. Give me (1) a numbered agreed-claims section that both of them could actually sign — including the agreed statement of what each principle says, the agreed toy cases (Sleeping Beauty, the presumptuous philosopher setup, the doomsday setup) and what each principle delivers there, and anything they agree the formalism by itself doesn't decide; (2) a disagreements table, one row per crux, with a neutrally worded statement of the sub-question, the SSA side's own preferred formulation, the SIA side's own preferred formulation, a case or argument both accept as bearing on it, and each side's prediction about that case written down in advance; (3) a short closing section on which parts of the fight areverbal, if any, and exactly where; and (4) a "what would move each of us" section.

  Some guesses I want you to test rather than just defer to: I suspect the real cruxes include (a) whether the disagreement only shows up for hypotheses that differ in how many observers exist, or whether it also bites elsewhere, (b) whether SIA's boost to the big-world hypothesis is a genuine cost or just a sign the prior was badly specified, (c) how either principle handles infinitely many observers, and (d) whether the fight is best relocated from "which is the correct updating rule" to "which rule a collection of agents would choose ex ante." On (d) I want you to work through two cases I made up and haven't seen anywhere: The Relay — you will live either one life or a thousand lives in sequence, with amnesia between them, and you currently find yourself fairly early in the sequence; does each principle even have a verdict, and do they come apart in the synchronic way at all? And Pre-Registration — before being copied, you and your future copies agree on a single self-locating updating rule to be used by whoever wakes up; which rule would they pick, and does the fact that they'd pick one tell us anything about which is correct? Also tell me if my framing of either case is subtly broken or smuggles in an answer. Please write in American English, and add a short meta-note at the end from you as the drafter: which formulation in the document you think one of the two parties would refuse to sign, and where your own reasoning is most likely to have gone wrong.
