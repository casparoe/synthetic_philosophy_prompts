answer: |-
  ### Adversarial Collaboration: SSA vs. SIA  
  **Joint Statement Draft**  

  ---

  #### 1. Agreed Claims  
  Both parties endorse the following:  

  1. **Formal Definitions**:  
     - **SSA (Self-Sampling Assumption)**: Treat your own observer-moment as a random sample from the set of all observer-moments within a specified *reference class*. Conditional on a hypothesis \(H\), the probability you observe \(X\) is proportional to the fraction of observer-moments in \(H\) that observe \(X\).  
     - **SIA (Self-Indication Assumption)**: Favor hypotheses that predict more observers *proportionally to their count*. Formally, the prior probability of \(H\) is weighted by the number of observers in \(H\), then normalized.  

  2. **Toy Cases & Predictions**:  
     - **Sleeping Beauty (SB)**:  
       - Setup: Beauty is put to sleep, fair coin flipped. Heads: woken once (Monday). Tails: woken twice (Monday/Tuesday, with amnesia). What is P(Heads) upon waking?  
       - SSA: Reference class = "wakings." 1/3 heads (1 wakening) vs. 2/3 tails (2 wakenings).  
       - SIA: Weight by total observers. 1 actual observer vs. 2 possible, but SIA updates on existence → P(Heads) = 1/2.  
     - **Presumptuous Philosopher (PP)**:  
       - Setup: Two theories: \(T_1\) (universe has 1 trillion observers), \(T_2\) (has 2 trillion). No other evidence.  
       - SSA: P(\(T_1\)) = P(\(T_2\)) = 1/2 (no sampling update).  
       - SIA: P(\(T_1\)) = 1/3, P(\(T_2\)) = 2/3 (weights by observer count).  
     - **Doomsday Argument (DA)**:  
       - Setup: Humanity will last either 200B ("Early") or 2T ("Late") total humans. You’re born at position \(n\).  
       - SSA: Reference class = "all humans." P(Late | \(n\)) decreases as \(n\) increases → supports "Early Doom."  
       - SIA: P(Late) boosted by higher observer count; cancels doomsday effect → P(Late | \(n\)) ≈ prior.  

  3. **Limitations**:  
     - Neither formalism specifies the *reference class* (SSA) or *prior weighting* (SIA).  
     - Both principles are *evidential* (update beliefs given data), not decision rules.  
     - Neither resolves how to handle *infinitely many observers* (e.g., measure problems).  

  ---

  #### 2. Disagreements Table  
  | Sub-Question | SSA Position | SIA Position | Test Case/Argument | SSA Prediction | SIA Prediction |  
  |--------------|--------------|--------------|---------------------|----------------|----------------|  
  | **(a) Scope**: Does the SSA/SIA divergence *only* apply when hypotheses differ in observer count? | Yes. Disagreement arises solely from differences in total observers. | No. SIA’s "existence evidence" applies even when counts match (e.g., indexical uncertainty). | **Modified PP**: \(T_1\) and \(T_2\) both predict 1T observers, but \(T_1\) has 1B identical observers in red rooms, \(T_2\) has 1B in blue rooms. You wake in a red room. | P(\(T_1\)) = 1/2 (sample favors no theory). | P(\(T_1\)) = 2/3 (SIA weights worlds by observers; your red room is more likely if \(T_1\) has more red-room observers). |  
  | **(b) Cost of SIA**: Is SIA’s boost to large-world hypotheses a flaw? | Yes. SIA’s prior violates conservation of probability (e.g., PP lets \(T_2\) dominate despite no evidence). | No. SIA corrects for *selection bias*; the "boost" reflects legitimate evidence for existing. | **Cosmic Die**: 6-sided die rolled. If 1–5, 1 observer exists; if 6, 1M observers exist. You exist. What is P(die=6)? | P(6) = 1/6 (no update from existence). | P(6) ≈ 1 (SIA updates on existence; high-count hypotheses favored). |  
  | **(c) Infinite Observers**: How do SSA/SIA handle infinite populations? | Reference classes must be finite/well-defined. SSA undefined for identical infinities. | SIA requires a *density* over observer types (e.g., "fraction of observers like me"). | **Infinite Hotel**: Two identical universes: \(U_1\) (infinite observers, 50% human), \(U_2\) (infinite observers, 10% human). You’re human. | Undefined (no non-arbitrary sample). | P(\(U_1\)) = 5/6 (ratio of human densities: 0.5/(0.5+0.1)). |  
  | **(d) Ex Ante Choice**: Which rule would agents precommit to? | SSA: Agents precommit to SSA to avoid "presumptuous" errors (e.g., PP). | SIA: Agents precommit to SIA to maximize accuracy (e.g., in PP, \(T_2\) is objectively more likely). | **Pre-Registration (below)**: Pre-copying, you agree with future selves on a rule. | SSA (avoids overconfidence in large worlds). | SIA (accounts for indexical evidence fairly). |  
  | **(d) The Relay**: Sequential lives with amnesia. Early in sequence, does synchronic SSA/SIA diverge? | Synchronic SSA applies: treat current moment as sample → P(long sequence) low if early. | SIA: No synchronic update; P(long sequence) unchanged by position (diachronic evidence only). | **The Relay**: You live 1 life or 1000 in sequence (amnesia between). At life #2, what is P(1000 lives)? | P(1000) low (sampled early from reference class = "all lives"). | P(1000) = prior (no update; existence doesn’t indicate length). |  

  ---

  #### 3. Closing: Verbal Disputes & Moving Forward  
  **Verbal Disputes**:  
  - "Observer" vs. "observer-moment": SSA often uses observer-moments (e.g., SB wakenings), SIA uses total observers.  
  - "Evidence": SIA treats existence *as* evidence; SSA treats it as a sampling condition.  
  - **Resolution**: Both agree "existence" is not a *datum* for SSA but is for SIA.  

  **What Would Move Each Side**:  
  - **SSA Advocate**: Show SIA leads to *incoherent bet-ratios* (e.g., in PP, SIA agents accept dominated bets).  
  - **SIA Advocate**: Show SSA *underweights indexical data* (e.g., in the red/blue room case, SSA ignores the room color as evidence).  

  ---

  #### 4. User’s Cases: Analysis & Predictions  
  - **The Relay**:  
    - Setup: You live 1 life (short) or 1000 lives (long) sequentially, with amnesia. You’re at life #\(k\) (early). Does synchronic SSA/SIA apply?  
    - SSA: Reference class = "all lives." At life #2, P(long) = \(2/1000\) ≈ 0 (if uniform sampling).  
    - SIA: No update from position; P(long) = prior.  
    - **Crux**: SSA sees "early position" as evidence for short sequence; SIA rejects this.  
    - **Framing Check**: Neutral. No smuggling (amnesia prevents diachronic updating).  

  - **Pre-Registration**:  
    - Setup: Before being copied, you and future selves agree on a single self-locating rule. Which rule?  
    - SSA Prediction: Choose SSA to avoid biasing toward large populations (e.g., in PP, SIA overcommits).  
    - SIA Prediction: Choose SIA to correctly weight evidence (e.g., in DA, SSA ignores observer-count data).  
    - **Framing Check**: Valid ex ante perspective. Doesn’t resolve normative correctness but tests pragmatic coherence.  
    - **Insight**: If agents precommit to SIA, it suggests SIA handles indexical uncertainty more consistently.  

  ---

  ### Meta-Note from Drafter  
  - **Likely Refusal Point**: The SSA advocate may object to the *Infinite Hotel* SIA prediction ("P(\(U_1\)) = 5/6") as arbitrary without a well-defined measure.  
  - **Drafter’s Blind Spot**: I may underestimate SSA’s resilience in *The Relay* by assuming a "lives" reference class; SSA advocates might insist on "sequences" instead.  
  - **User’s Guesses Addressed**:  
    - (a) Disagreement extends beyond observer-count (e.g., red/blue rooms).  
    - (b) SIA’s "boost" is contested (legitimate correction vs. prior violation).  
    - (c) Infinities handled via densities (SIA) or not at all (SSA).  
    - (d) *Pre-Registration* favors SIA pragmatically; *Relay* exposes synchronic vs. diachronic updating.  

  ---  
  *Document ends. Both parties are invited to annotate disagreements with this draft.*
