answer: |-
  Here’s a structured proposal for your term paper, designed to rigorously interrogate the contrastive question while leveraging your "shared-factor criterion" and addressing your key suspicions. The approach prioritizes conceptual clarity over historical adjudication, making it feasible within scope.

  ---

  ### **Proposal: Contrastive Questions in Historical Explanation—A Diagnostic Framework**  
  **Core Question:** *Under what conditions is the contrastive question "Why did the Industrial Revolution occur in Britain and not China?" well posed as a single explanatory problem, rather than a conflation of distinct questions?*

  **Well-Posedness Criteria (Defined):**  
  A contrastive historical question is **non-degenerate** if:  
  1. **Shared Explanatory Framework**: The causes invoked for both conjuncts (why *P* occurred in A, why *~P* occurred in B) operate within a common causal structure.  
  2. **Non-Trivial Contrast**: The foil (China) is not arbitrarily selected; its "failure" must be meaningfully comparable to A’s "success" under a plausible set of initial conditions.  
  3. **Unit Synchronization**: The units of comparison (e.g., nation-states, regions, temporal slices) are commensurate in scale and dynamics.  

  Degeneracy arises when these fail: e.g., if explanations for Britain/Cana depend on incommensurable factors, or if China is a mismatched foil.

  ---

  ### **Why the Debate Remains Open: Three Positions**  
  1. **The Monocausal Optimist**:  
     - Holds the contrast is straightforward: a single factor (e.g., coal, institutions) explains both Britain’s success *and* China’s failure.  
     - *Why open?* Assumes unit commensurability and ignores denominator problems (e.g., why China? Why not France/India?).  

  2. **The Framing Skeptic**:  
     - Argues the question dissolves when comparing like units (e.g., Yangtze Delta vs. Lancashire) or adjusting timelines. China’s "non-industrialization" is misdiagnosed; it experienced growth via different trajectories.  
     - *Why open?* Treats unit-matching as decisive but struggles to define "like" units objectively.  

  3. **The Pluralist**:  
     - Accepts the question but answers with a conjunction of independent causes (e.g., "Britain had coal + colonial markets; China had labor abundance + state constraints").  
     - *Why open?* Risks making the contrast vacuous—any pairing of disjoint factors "solves" the question without explanatory unity.  

  **Your Intervention**: The shared-factor criterion tests whether positions (1) or (3) hold, while unit-matching and denominator worries challenge all three.  

  ---

  ### **Method: Section-by-Section Plan**  
  **Total: ~6,000 words**  

  #### **I. Introduction: The Puzzle of Contrastive Degeneracy (800 words)**  
  - Motivate the problem: Historians treat "Why Britain not China?" as substantive, but conflicting answers suggest conceptual confusion.  
  - Propose the **shared-factor criterion** (SFC): A contrast is degenerate if the best explanations for each conjunct share *no overlapping factors in a causal mechanism*.  
  - Preview unit-matching and denominator worries as diagnostic tools.  

  #### **II. Conceptual Groundwork: What Makes a Contrastive Question Well Posed? (1,200 words)**  
  - Define contrastive explanation using philosophical tools (e.g., Lipton’s difference-making, Woodward’s invariance).  
  - Operationalize "well posed":  
    - Non-degeneracy requires the contrast to identify a *specific difference-maker* (not just list causes).  
    - Degeneracy arises when:  
      - (a) Conjuncts have no common causal space (SFC violation);  
      - (b) Units are asynchronous (e.g., comparing 1800 Britain with 1600 China);  
      - (c) The foil is cherry-picked from a large set of possible losers.  

  #### **III. Applying the Shared-Factor Criterion to the IR Debate (1,500 words)**  
  - **Without resolving historical disputes**, synthesize leading explanations:  
    - *Britain*: Coal geography, wage-price ratios, imperial markets, institutional innovation.  
    - *China*: Agrarian equilibrium, labor-intensive growth, state fiscal policies, silver crises.  
  - **Test 1 (SFC)**: Do these explanations share any factor?  
    - *Overlap?* Possibly "factor mobility" (e.g., capital/labor constraints) or "state capacity"—but note divergent mechanisms.  
    - *No overlap?* Then the contrast is degenerate; "Britain succeeded for reasons X; China ‘failed’ for unrelated reasons Y."  
  - **Test 2 (Unit-Matching)**: Re-pair units:  
    - Compare Lower Yangtze (1600–1750) vs. Britain (1700–1800): Do explanations converge?  
    - If yes, the original contrast mis-specified units; if not, degeneracy is deeper.  

  #### **IV. The Denominator Problem and Framing Artifacts (1,000 words)**  
  - Argue that China is often a *rhetorical foil*, not a plausible alternative. If >10 regions "could have" industrialized, pairing any loser with Britain creates a pseudo-puzzle.  
  - Show how disagreements (e.g., Pomeranz vs. Vries) reflect clashing assumptions about the candidate set—not just causes.  

  #### **V. Conclusions and Diagnostics (1,000 words)**  
  - **Possible outcomes**:  
    - **SFC satisfied**: The contrast is sound; the shared factor (e.g., "market integration") is the real explanandum.  
    - **SFC failed**: The question splits into two distinct problems.  
    - **Triviality/Objection**: If "geography" or "contingency" always counts as a shared factor, SFC is too weak. Rebut by requiring *mechanistic* overlap (e.g., not just "proximity to water" but *how* it enabled capital accumulation).  
  - **Deliverable for historians**: A **diagnostic checklist** for contrastive questions:  
    > 1. **Factor Test**: Do explanations for A and ~B invoke a common causal driver?  
    > 2. **Unit Test**: Are units spatiotemporally aligned? (If not, rescale.)  
    > 3. **Foils Test**: Is the foil one of many plausible alternatives? (If yes, specify the candidate set.)  
    > *When all fail, decompose the question.*  

  #### **Explicitly Set Aside (500 words)**  
  - **Substantive resolution**: No original claims about *why* Britain industrialized.  
  - **Global comparisons**: Debates about "Great Divergence" timelines or non-European cases (e.g., Japan).  
  - **Full historiography**: Deeper analysis of China’s economic history is beyond scope; use consensus positions from secondary literature.  

  ---

  ### **Why This Approach?**  
  - **Beyond surveys/conceptual analysis**: The SFC + unit/denominator tests offer *actionable diagnostics* for historians.  
  - **Feasibility**: Relies on comparing existing explanations (e.g., from Pomeranz, Allen, Rosenthal/Wong) without new archival work.  
  - **Risk mitigation**: If SFC proves trivial/overstrict, the paper still advances methodology by exposing why contrastive questions frustrate consensus.  

  ### **Historian-Facing Deliverable**  
  Your paper equips historians to:  
  1. **Audit their questions**: Before debating causes, apply the checklist to verify if a contrast is well posed.  
  2. **Reframe inquiries**: E.g., shift from "Why Britain not China?" to "Why did labor-saving technology diffuse in Britain but not the Yangtze Delta post-1750?"  
  3. **Identify hidden disagreements**: Is a debate really about causes—or about mismatched units/foils?  

  This turns philosophical critique into a tool for sharper historical practice.  

  ---  
  **Next Steps**: Draft Section II (conceptual groundwork) first to lock in definitions. Use tables to map factors for Britain/China in Section III. Flag where historians’ consensus is thin (e.g., China’s "blocking mechanisms").
