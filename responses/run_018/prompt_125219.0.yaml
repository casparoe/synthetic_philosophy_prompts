answer: |-
  Here’s a distilled list of desiderata for a viable conceivability-possibility bridge principle, key test cases, critical distinctions, and tensions:

  ### **Core Desiderata**  
  1. **Handle epistemic gaps without endorsing ontological gaps**  
     - *Test case: Inverted qualia*. You can conceive of a being with identical color-discrimination behavior but inverted color experiences (e.g., their "red" is your "green").  
     - *Why test?* The principle must distinguish phenomenal concepts from functional/behavioral facts. A good bridge must explain why this *seems* metaphysically possible without necessarily making it so (avoiding overreach).  

  2. **Accommodate non-spatial/emergent scenarios**  
     - *Test case: Distributed cognition*. Conceiving a cognitive system (e.g., a network of AIs) with intelligence but no unified locus of awareness.  
     - *Why test?* Challenges assumptions about consciousness requiring spatial continuity or central processing. The principle must not presuppose human-like cognition.  

  3. **Resist false positives from misdescription**  
     - *Test case: "Water isn’t H₂O"*. Conceiving watery stuff that isn’t H₂O (e.g., Twin Earth XYZ) must *not* imply water could be non-H₂O.  
     - *Why test?* Rules out conflating conceptual confusion with metaphysical possibility.  

  4. **Demarcate primitive from derived possibilities**  
     - *Test case: Zombies*. Conceiving physical duplicates without consciousness must not *automatically* refute physicalism. The principle should require ruling out conceptual/epistemic limitations (e.g., incomplete grasp of "physical").  

  ### **Distinctions It Must Preserve**  
  - **Prima facie vs. ideal conceivability**: Surface-level imaginability (e.g., "square circle") vs. ideally rational, contradiction-free conceiving. Bridge principles can only use the latter.  
  - **Logical vs. metaphysical possibility**: Conceivability might entail *logical* possibility (no contradiction) but not *metaphysical* possibility (e.g., "Hesperus isn’t Phosphorus" is logically conceivable but metaphysically impossible).  
  - **Epistemic vs. ontological gaps**: Separating "I can’t see how P could be true" from "P is impossible".  

  ### **Tensions/Joint Impossibilities**  
  - **Cognitive limits vs. idealization**: Human working memory can’t fully conceive hypercomplex states (e.g., a billion-neuron network’s emergent properties). A principle demanding "ideal conceivability" becomes unattainable; one that accepts human constraints becomes unreliable.  
  - **Safety vs. informativeness**: Strict principles avoiding false positives (e.g., requiring *deductive* links from conceivability to possibility) are inert (too few outputs). Permissive principles (e.g., "conceivability entails possibility") generate false positives (zombies, inverted spectra).  

  ### **How Theories Fare**  
  - **Chalmers-style 2D semantics**:  
    - *Pros*: Handles inverted spectra (via primary intension) and misdescription (secondary intension). Distinguishes epistemic/metaphysical modality cleanly.  
    - *Cons*: Struggles with cognitive limits (ideal conceivability is idealized beyond human capacity). Distributed cognition tests strain the "scrutability" base (what’s primitively conceivable?).  
  - **Deflationary/heuristic view** (e.g., Yablo, Dennett):  
    - *Pros*: Avoids overcommitment by treating conceivability as fallible evidence. Compatible with cognitive limits.  
    - *Cons*: Can’t strongly justify modal claims (e.g., why trust intuitions about zombies?). May collapse epistemic/ontological gaps under pragmatism.  

  **Bottom line**: A viable principle must navigate the **inverted spectrum** (phenomenal vs. functional), **distributed systems** (structural constraints), and **misdescription** traps, while admitting human cognition can’t access "ideal" conceivability for complex states. No current theory fully balances safety and informativeness under cognitive constraints.
