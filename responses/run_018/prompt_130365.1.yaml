  Defending that stance: In the medical example, gathering more data on probabilities makes sense. But averaging moral values doesn't resolve disagreements; it just papers over them. Decisions need separate consideration of factual vs. value-based uncertainties. 

  User's deeper needs: They might be grappling with ethical decision-making frameworks, possibly in AI, policy, or philosophy. They want clarity on whether EV is fundamentally flawed or just messy. They need a strong argument to inform their own stance or work. 

  Also, they're on their phone, so I should keep it concise but thorough. Avoid jargon where possible. Make the example vivid and the logic clear. 

