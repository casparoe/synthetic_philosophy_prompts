  I should create a scenario that highlights this collapse. Something with high stakes but unknown probabilities and contested morals. Let me think... maybe something involving an AI system? Like an AI making decisions that could save lives but also might cause harm. But I need it concrete. 

  Ah, how about an experimental medical treatment? That's a classic. Let me flesh it out: a drug that could either cure a rare disease or cause a severe side effect. The epistemic uncertainty: we don't know the probability of the side effect. Moral uncertainty: some people prioritize curing the disease, others prioritize avoiding harm, especially if it involves children. 

  The EV calculation would multiply the probability by the utility. But if the probability is unknown, we might use a range or expected probability. For morals, we might average different values. But collapsing both into one number ignores that they're different kinds of uncertainty. 

  The user mentioned a paradox. So in this scenario, EV might recommend the drug even if it has a high risk because the potential upside is huge. But others might oppose it due to moral reasons, like not risking children's lives. The tension is that EV combines these, hiding the distinct concerns. 

