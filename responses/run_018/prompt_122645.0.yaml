  ### Grading Scheme (Full-Mark Requirements)
  1. **(a)** Precisely identify what self-anchoring must show to *resolve* the fixture problem (avoid circular restatement).  
  2. **(b)** Correctly state if cross-cutting hinges can erode/lose status; reconcile with river-bed shift metaphor.  
  3. **(c)** Distinguish self-anchoring hinges from classical foundationalist basic beliefs (justification vs. arationality).  
  4. **Engagement:** Address idle-hinge objection; avoid conflating hinge "fixing" with epistemic support.  
  5. **Structure:** Coherently separate (a)/(b)/(c) while integrating hinge epistemology's core tenets.  

  ---

  ### Mark Breakdown (20 Total)  
  - **(a) 5/6**: Correctly identifies non-epistemic anchoring need but misses *how* it resolves (not just restates) fixture problem.  
  - **(b) 3/6**: Fails to reconcile hinge immutability with river-bed shifts; misreads metaphor.  
  - **(c) 4/6**: Strong contrast with foundationalism but undermines with "confirmation" claim.  
  - **Structure/Engagement 2/2**: Clear, focused, addresses all question parts.  
  **TOTAL: 14/20**  

  ---

  ### Point-by-Point Comments  
  1. **"The self-anchoring theorist has to show that being held in place need not mean being supported by reasons."**  
     *Correctly identifies non-epistemic anchoring as necessary. (+1)*  
  2. **"The exercise of the practice... is constitutive of the hinge's holding... no gap between our going on and the hinge."**  
     *Accurate: Anchoring is constitutive, not evidential. Defends against bootstrapping. (+2)*  
  3. **"The anchoring relation is non-epistemic."**  
     *Essential point, correctly isolating self-anchoring from justification. (+1)*  
  4. **"Could a cross-cutting hinge be lost? I think not... no possible experience could dislodge one."**  
     *Error: Contradicts river-bed shift (stipulated in question). Hinges *can* erode. (-2)*  
  5. **"This is consistent with the river-bed remark: what shifts is the water... the bed remains."**  
     *Misreading: River-bed *itself* shifts per question; hinges are dynamic, not static. (-2)*  
  6. **"A hinge is not justified at all... cannot be non-inferentially justified."**  
     *Key contrast with foundationalism: hinges ≠ basic beliefs. Correct. (+2)*  
  7. **"The practice... supplies its own justification for the hinge. My successful perceptual judgments confirm..."**  
     *Contradiction: "Justification/confirmation" reintroduces epistemic support, violating non-epistemic anchoring. (-1)*  
  8. **"Circularity is benign... confirmation is global."**  
     *Charitable but flawed: "Global confirmation" still implies evidence, inviting idle-hinge objection. (-1)*  

  **Substantive vs. Harmless Imprecision**  
  - **Harmless**: "Hinge is presupposed by every practice" (overstates—domain-local hinges aren’t). No deduction: minor hyperbole.  
  - **Harmless**: "Fixture problem bites" (colloquial). No deduction: clarity intact.  
  - **Substantive**: "Hinges could never come loose" (ignores river-bed shift). Deducted above.  

  ---

  ### Named Verdicts  
  - **Strongest Reasoning**: *"A hinge is not justified at all... cannot be non-inferentially justified."*  
    → Cleanly distinguishes hinges from foundationalist basic beliefs.  
  - **Weakest Sentence**: *"My successful perceptual judgments confirm that there is an external world."*  
    → Undercuts non-epistemic anchoring by smuggling in evidential support.  

  ---

  ### Summative Comment  
  Candidate 4071: Your answer excels in isolating non-epistemic anchoring (a) and contrasting hinges with foundationalism (c). However, you misread Wittgenstein’s river-bed shift (b), asserting hinge immutability contrary to the question’s stipulations. The "confirmation" language in (c) also weakens your non-epistemic claims. To reach first-class: Revise (b) to acknowledge hinge erosion (e.g., "bed shifts gradually") and eliminate all epistemic language (e.g., "justification") from the anchoring account.  

  *(Word count: 845)*
