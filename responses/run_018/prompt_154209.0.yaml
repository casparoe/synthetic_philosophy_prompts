  3. **Overlap between pure organizational and structural views:** The tree separates these by asking whether bureaucracy is an independent mechanism (Q4). If bureaucracy is seen as a subset of organizational dynamics, the tree still forces a choice: if bureaucracy is the *best* explanation, it goes to structural; otherwise, to pure organizational.  
  4. **Overdetermination and other views:** The tree isolates overdetermination by asking whether organizational dynamics alone are sufficient (Q3=Yes) and then whether the atrocity would have happened without them (Q6=Yes). This avoids conflating it with interactionism (which requires culture) or character views.  
  5. **Incremental disengagement and character:** The tree separates these by asking whether incremental disengagement is distinct from peer pressure (Q5). If yes, it goes to incremental disengagement; if no and character differences are invoked, it goes to character-modulated.  

  This taxonomy captures the core positions while highlighting underdiscussed mechanisms (incremental moral disengagement) and forcing confrontations with each view’s most counterintuitive implications.
