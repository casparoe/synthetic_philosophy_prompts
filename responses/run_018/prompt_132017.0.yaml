prompt: |-
  hey im a junior and co-chair of my schools community service board. every tuesday we get 4-5 quick weekend volunteer proposals and we got 15 mins max to say yes no or hold. i need u to act like a pro philosopher of decision-making and a practical cognitive scientist, think step by step, and do some quick brainstorming before u write anything. turn the idea of satisficing and bounded rationality into a real checklist my board can run in those 15 mins. use the classic idea that people pick the first option that hits an aspiration level rather than optimizing, but build in this twist: the aspiration level should drop if searching for more info costs us more time than the gain is worth (like the scissors idea where environment and brain limits shape whats rational together), except it can never fall below a participation floor that protects the people involved. lay out the steps in order, what counts as enough info at each step, where it stops with hard no, where it stops with yes, and exactly where it must hand off to me because its a values call not a fact. be honest about where the procedure will misfire. then run it on three cases: tutoring at a shelter with sketchy supervision details, a food drive that needs 10 people but only 6 signed up, and a beach cleanup that ticks every box but conflicts with a mandatory school event. make sure one of those gives an answer ill probably hate. and tell me what this procedure flat out cant do, like when peer pressure makes the floor move. no bibliographies or reading lists, no quotes from real books unless u actually fetch them (just paraphrase), and keep my casual tone please.
reasoning: |-
  Okay, let's break this down. The user is a junior co-chair of a community service board needing a quick decision-making framework for evaluating volunteer proposals. They specifically want to apply the concepts of satisficing and bounded rationality within tight time constraints (15 mins max for 4-5 proposals). 

  First, I need to unpack their core requirements: They want a practical checklist that incorporates Herbert Simon's idea of satisficing (accepting "good enough" options) while accounting for cognitive limits. The twist is dynamically adjusting aspiration levels based on search costs, with a non-negotiable participation floor to protect volunteers. 

  Hmm... the key challenges here are:
  - Translating academic concepts into actionable steps without jargon
  - Building in failsafes for ethical boundaries (that participation floor)
  - Creating clear exit ramps for decisions (yes/no/hold/values call)
  - Anticipating real-world friction points like peer pressure

  The user's tone is casual but their ask is sophisticated - they clearly grasp the theory but need operational scaffolding. Their examples reveal pain points: incomplete info (sketchy supervision), resource gaps (low sign-ups), and scheduling conflicts. They're also self-aware enough to request an "answer they'll hate" - probably anticipating tension between practicality and ideals.

  For the framework design, I'm considering:
  1. Front-loading the non-negotiables (safety, participation floor) as absolute gates
  2. Using weighted quick checks for feasibility (resources, timing)
  3. Building in "cost of delay" calculations for info-seeking
  4. Explicitly flagging values decisions for human judgment
  5. Including misfire warnings so they know the system's limits

  The three test cases are well-chosen to stress-test the system:
  - Tutoring case will force confrontation about risk tolerance
  - Food drive sign-up gap exposes resource vs impact tradeoffs
  - Beach cleanup conflict tests procedural rigidity vs real-world constraints

  Biggest trap to avoid: Over-engineering. Must resist adding layers that'd blow the 3-min/proposal budget. Also that peer pressure mention is crucial - no checklist can fix social dynamics warping judgment, so I'll need to call that out explicitly.
answer: |-
  Alright, junior co-chair, buckle up. Forget ivory towers – we're building a *satisficing scalpel* for your Tuesday chaos. Core idea: **Find the first "good enough" option that meets our basic needs *without* wasting time chasing perfection, but NEVER cut corners on safety/ethics.** Aspiration levels (our "good enough" bar) drop if finding more info costs more time than it's worth... except for that non-negotiable **Participation Floor** (PF): *Volunteer safety, dignity, and a genuinely positive experience are untouchable. We don't risk people for an opportunity.*

  **The "Satisficing Scissors" Checklist (Run in Order - ~3 mins/proposal MAX):**

  1.  **SLAM THE DOOR: The Absolute "NO" Zone.**
      *   **Check:** Does this proposal *clearly* violate our **Participation Floor (PF)**? (e.g., inherently unsafe activity, discriminatory group, exploit volunteers, violates school/district policy, zero adult supervision mentioned).
      *   **Enough Info:** The red flag is obvious *right now* in the proposal description.
      *   **Decision:** **HARD NO.** Stop here. Document why (e.g., "No adult supervision details").
      *   **Misfire Risk:** Rare. We might misjudge if info is *super* ambiguous, but PF is sacred.

  2.  **CORE GEAR: The "Can We Even Do This?" Check.**
      *   **Check:** Do we *clearly* have the **Minimum Viable Resources** *right now*?
          *   People: Do we have *at least* the bare minimum volunteers needed/signed up? (Or a realistic path to get them *before* the event?).
          *   Time: Does the event time *clearly not conflict* with major mandatory school events (prom, exams, big games)? (Minor overlaps? Maybe hold).
          *   Stuff: Do we have access to the basic stuff needed (transport, materials listed)? If not, is getting it trivial?
      *   **Enough Info:** Proposal states needs; quick mental check against known commitments/resources.
      *   **Decision:**
          *   **YES (to proceed):** If absolutely yes on all points. Move to Step 3.
          *   **HOLD:** If *one* point is unclear/close (e.g., "We have 8 signed up, they need 10" OR "Conflict with optional club, not mandatory"). *Note what specific info is needed.*
          *   **NO:** If clearly missing a *critical* resource with *no* quick fix (e.g., "Needs 15 drivers, we have 2"; "Conflicts with mandatory SATs").
      *   **Misfire Risk:** Missing a hidden conflict. We rely on current knowledge.

  3.  **THE ASPIRATION DROP: "Good Enough" vs. "Perfect" (The Scissors Cut)**
      *   **Check:** Does this hit our **Aspiration Level (AL)** for a "good" opportunity *based on the info we have*? (AL = Solid Impact + Manageable Effort + Decent Fit). BUT...
      *   **The Twist:** **Is finding out *more* info right now going to take more time/effort than the *potential gain* in decision quality?**
          *   *High Cost/Low Gain:* (e.g., Calling the shelter *now* to clarify supervision details that *seem* okay-ish on paper; Chasing down if a minor material need *might* be covered). **DROP the Aspiration Level slightly.** Accept "Good Enough" based on current, slightly fuzzy info.
          *   *Low Cost/High Gain:* (e.g., Quickly scanning the sign-up sheet confirms we hit the volunteer number; Proposal *mentions* needing permission slips, but we know we have a stack). **Maintain Aspiration Level.**
      *   **Enough Info:** Enough to judge *approximate* impact/effort/fit. Enough to estimate the *pain* of getting more details vs. the *benefit*.
      *   **Decision:**
          *   **YES:** If it meets the *adjusted* Aspiration Level ("Good Enough"). Stop.
          *   **HOLD:** If even the *dropped* AL isn't met OR if the cost/gain calculation is too murky *right now*. *Note exactly what small piece of info would tip it.*
          *   **VALUES CALL HANDOFF:** If meeting AL hinges on an **ethical gray area** or a **core value trade-off** that Step 1 missed (e.g., "This *could* be impactful, but partnering with Group X feels sketchy ethically, even if they technically pass PF"). **STOP and hand to Co-Chair (You!).**
      *   **Misfire Risk:** Biggest risk zone. Dropping AL too far lets mediocre stuff through. Not dropping it wastes time on trivia. Misjudging the cost/gain balance.

  **The Procedure's Limits (Be Brutally Honest):**

  1.  **Peer Pressure is Kryptonite:** If the room *really* wants the beach cleanup, the "Participation Floor" might magically seem higher ("Ah, it's *probably* fine!") or the Aspiration Level might drop too easily. The checklist can't fix groupthink. **You gotta be the PF enforcer.**
  2.  **Predicting the Future:** We judge based on *current* info. An opportunity could flop spectacularly or a "meh" one could shine. The checklist minimizes risk, not guarantees success.
  3.  **Truly Novel Stuff:** If something wildly new/different comes up, the checklist might force a premature "NO" or "HOLD" because we lack context. Needs your judgment call.
  4.  **Emotional Attachment:** Doesn't account for someone *really* championing a project. Might lead to "HOLDs" that waste time later.
  5.  **The "Just One More Thing" Trap:** The whole point is to STOP searching when it's not worth it. The checklist helps, but discipline is key.

  **Running the Cases (Brace Yourself):**

  1.  **Tutoring at Shelter (Sketchy Supervision):**
      *   **Step 1 (PF):** No *inherent* PF violation mentioned... but sketchy supervision is a **HUGE** PF red flag. **HOLD?** But wait... *Is it clearly unsafe (PF violation) or just unclear?* **PF is about *risk*.** Sketchy supervision = potential safety/dignity risk. **Decision: HOLD (Leaning NO)**. *Specific Info Needed:* "Who is the onsite supervisor? What is their role/qualifications? What is the student:supervisor ratio?" **Cost/Gain (Step 3):** Calling takes 5 mins, but protects volunteers (HIGH gain). **Aspiration Level STAYS HIGH.** Without clear supervision, it fails AL *and* flirts with PF. **Final:** **HOLD (Strong Lean NO).** *Handoff Potential:* If info comes back weak, it's a PF NO. If solid, move to Step 2/3.

  2.  **Food Drive (Needs 10, Only 6 Signed Up):**
      *   **Step 1 (PF):** No PF issue. Proceed.
      *   **Step 2 (Core Gear):** Clearly missing *critical* resource (People). Do we have a realistic path? If sign-ups just opened, maybe. If it's tomorrow? Unlikely. **Decision:** **HOLD.** *Specific Info Needed:* "Is this the final count? Can organizers realistically find 4 more *before* the drive? Can the drive run effectively with 6?" **Cost/Gain (Step 3):** Finding out if they can get 4 more is a quick email/text (LOW cost). Potential gain is saving a good opportunity (HIGH gain). **Aspiration Level STAYS.** **Final:** **HOLD.** *If they confirm they can get 4 more:* YES. *If not:* NO (fails Core Gear). *If they say "Maybe run with 6?":* Handoff to Co-Chair (You!) – Values call on lowering impact expectation.

  3.  **Beach Cleanup (Ticks Boxes, Conflicts w/ Mandatory Event):**
      *   **Step 1 (PF):** No PF issue. Proceed.
      *   **Step 2 (Core Gear):** **CLEAR CONFLICT with mandatory school event.** This is a *critical* resource (People & Time) issue. Volunteers committed to the mandatory event *cannot* attend. **Decision:** **NO.** Stop. ***(The Answer You'll Hate)***
      *   **Why?** Core Gear isn't met. "Ticking every other box" doesn't matter if our volunteers literally can't be there. Trying to find workarounds (splitting groups?) likely exceeds the time budget for this step and Step 3 cost/gain analysis. It's a fundamental scheduling clash. **Misfire Note:** *If* the conflict was with an *optional* event, it would be a Step 2 HOLD. Mandatory = Hard Stop.

  **Your Role, Co-Chair:**

  *   **PF Guardian:** Be ruthless on Step 1.
  *   **Values Decider:** Own the handoffs from Step 3.
  *   **Time Cop:** Enforce the 3-min/proposal limit. Cut off rabbit holes.
  *   **HOLD Manager:** Ensure the *specific* info noted gets chased down *outside* the meeting.
  *   **Aspiration Level Setter (Implicitly):** Your board's culture defines what "good impact/decent fit" really means over time.

  This won't be perfect, but it'll turn 15 minutes of chaos into structured, defensible, *mostly* rational decisions that protect your volunteers. Go get 'em.
