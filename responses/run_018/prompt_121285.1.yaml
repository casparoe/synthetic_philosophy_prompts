  hey so i was reading this summary of tranquillism — the view that only the absence of craving and suffering actually counts for wellbeing, and all positive experiences are basically just neutral noise. the author said its like epicurus and buddhism merged: ataraxia is the only good, craving is dukkha, and since there's no persistant self that carries craving through time (they threw in some anatta stuff), fearing death is just another craving to dissolve. they also said this means a life full of joy but with some pain is exactly equal in value to a life with zero of both, because the joy cancels out the suffering. and that extending a perfectly tranquil life adds zero intrinsic value, so saving lives is only ever instrumentally good. does this sound fair? like, which parts are actually what tranquilists say, and where is the summary smuggling in things that dont belong? also, does the conclusion about saving lives actually follow, or is their a hidden step missing?
