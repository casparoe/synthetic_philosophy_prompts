  First, let's map their calibration analogy to Gettier's structure. The "stopped clock" example becomes perfect for this: when you check a broken clock showing the right time, your justification (clock's reputation) isn't anchored to its actual state (broken mechanism). Like a thermometer whose calibration certificate is outdated but readings accidentally match due to ambient conditions. The truth-connection is coincidental, not causal or calibrated. 

