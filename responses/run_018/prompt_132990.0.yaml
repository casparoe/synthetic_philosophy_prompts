  Don't just use those terms as metaphors; actually translate the arguments into them as precisely as you can, then give me the residue report: which claims survive intact, which ones have to be distorted to fit, and which ones have no expression at all in information-theoretic terms. I'm especially curious wether the philosophers' worry about moral deference is really just a special case of over-relying on a noisy, low-bandwidth channel, or if there's a normative or second-personal structure to testimony that simply doesn't map onto signal processing. Please think carefully, maybe start with a quick brainstorm of the philosophical moves before you do the translation and the gap analysis.
