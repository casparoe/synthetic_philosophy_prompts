  ## Argument for Calibration-Stability Restricted Eliminativism

  **Premise 1: Scientific Adequacy Requires Calibration Stability.** For a taxonomic framework (a system of classification) to be scientifically adequate for describing and explaining a phenomenon, attributions using its core categories must demonstrate *inter-subjective calibration stability*. This means that competent observers, applying the framework consistently, should converge on the same attribution of a specific state (e.g., "believes that P") to a subject across minor contextual variations (e.g., slight changes in phrasing, observation setting, or background assumptions). Instability indicates that the taxonomy is tracking observer-dependent interpretations rather than robust, observer-independent features of the target system.

  **Premise 2: Folk-Psychological Taxonomy Lacks Calibration Stability.** Attributions of specific propositional attitudes (e.g., "believes it will rain," "desires a promotion") are demonstrably unstable across observers and contexts, even when considering first-person reports. Minor contextual shifts (e.g., emphasizing different behavioral cues, phrasing the attitude slightly differently, changing the observer's theoretical bias, or the subject's recent experiences) frequently lead to divergent attributions or profound uncertainty about the *exact* content or even the *presence* of a specific belief/desire. This instability arises because folk-psychological kinds are defined by coarse-grained functional roles and semantic content, which are inherently ambiguous and context-sensitive. The "same" behavioral or verbal output can license multiple, incompatible attitude attributions ("Does she *believe* P or just *hope* P?" "Is that a *desire for Q* or *aversion to not-Q*?").

  **Premise 3: Neural-Dynamical Taxonomies Exhibit Greater Calibration Stability.** Descriptions of brain activity using coarse-grained dynamical systems categories (e.g., "high-amplitude gamma oscillation in prefrontal region X," "dominant predictive-error signal in sensory module Y," "trajectory towards attractor state Z") demonstrate significantly higher inter-subjective calibration stability across minor contextual shifts. Observers trained in neuroimaging or electrophysiology techniques, using the same data and measurement protocols, converge more reliably on identifying *patterns of neural activity* than folk psychologists converge on identifying *specific propositional attitudes*. This stability stems from the physical, measurable nature of the signals and the mathematical precision of dynamical systems descriptions, which are less dependent on semantic interpretation than propositional attitude ascriptions.

  **Interim Conclusion 1: Folk Psychology is Scientifically Deficient.** From Premises 1-3, the folk-psychological taxonomy fails a key criterion (calibration stability) necessary for scientific adequacy in describing the neural causes of behavior, while a neural-dynamical taxonomy (e.g., based on predictive coding, attractor states, or error-minimization dynamics) succeeds. Therefore, neuroscience should abandon the project of reductively mapping propositional attitudes like "belief" or "desire" onto specific, stable neural states. Such mappings inherently rely on the unstable folk kinds and are doomed to fail or be hopelessly disjunctive.

  **Conclusion 2: Replacement, Not Reduction.** Neuroscience should instead adopt a *replacement* taxonomy grounded in the stable, observable dynamics of neural systems (e.g., patterns of prediction, prediction-error minimization, energy landscape transitions). This taxonomy carves the causal structure of cognition at its joints – the evolving patterns of neural activity – without presupposing or preserving the discrete, content-laden kind-structure of folk psychology. States in this taxonomy (e.g., "a transient phase of heightened prediction-error in auditory cortex") bear no necessary one-to-one correspondence to discrete beliefs or desires. They describe the mechanistic unfolding of cognitive processes directly.

  **Addressing Self-Refutation:** The assertion of this eliminativist thesis is *not* a contradiction. It is a pattern of neural activity and vocalization produced by a brain organized according to predictive-error minimization principles. This specific vocalization ("Folk psychology should be eliminated") arises from the speaker's current neuro-dynamic state, shaped by sensory inputs (e.g., reading philosophy), internal models, and error-correction processes. It minimizes prediction error *for the speaker's brain* within its current context and learning history. The claim itself is a *dynamic cognitive event* described by the successor taxonomy (e.g., "a high-level prediction minimizing verbal output"), not an attribution of a "belief" state with fixed content. The thesis explains the *utterance* without invoking the eliminated kind "belief."

  **Distinction from Reductive Identity Theory:** This restricted eliminativism remains genuinely distinct. Reductive identity theory posits that folk-psychological kinds *are* neural kinds (e.g., "belief that P" = Nₚ). It preserves the folk kind-structure and seeks neural realizers *for that structure*. Our argument rejects this preservation. While the successor neural-dynamics taxonomy will host functional analogues *in specific contexts* – patterns that play belief-*like* or desire-*like* roles transiently within a dynamical flow (e.g., a sustained prediction minimizing error about environmental state S might *functionally resemble* a "belief that S") – these are context-dependent phases within a continuum, not stable, discrete natural kinds isomorphic to "belief" or "desire." The successor taxonomy describes the *process* (e.g., prediction, error-signaling, model updating); any "belief-like" or "desire-like" behavior is an emergent, contextually-bound *effect* of this process, not the mapping target for a discrete neural state. The *kind-structure* itself is replaced; similarity in coarse function under specific descriptions does not imply identity of kinds or preservation of the folk ontology.

  **Verdict:** The restricted eliminativist position remains genuinely distinct from reductive physicalism because it rejects preserving the folk kind-structure for reduction and replaces it with a fundamentally different dynamical-process taxonomy, where belief/desire analogues are transient, context-dependent functional effects, not stable natural kinds.
