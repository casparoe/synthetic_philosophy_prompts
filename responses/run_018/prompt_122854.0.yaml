  Marking scheme will punish: 
  - Mere vignette regurgitation (C-grade) 
  - Unanalyzed "blameworthiness = intentionality" claims (B-grade ceiling) 
  - Failure to engage counterfactual tension (automatic cap at B) 

  The spiteful gardener case is crucial—it creates a scenario where the agent *wants* the good effect *not* to happen but causes it anyway, testing if negative attitudes toward good effects induce symmetric intentionality judgments. This could fracture the "normativity" explanation if people don't call it intentional harm. 

  Biggest risk is students missing that the counterfactual ("he'd have acted anyway") makes standard mental state accounts implode. The model answer must model how to argue that judgments track whether the outcome *violated a norm the agent *should* have cared about*, not just what they actually intended.
answer: |-
  Here’s an essay question designed to push beyond rote explanations, leveraging your cases to force analysis of the Knobe effect’s underlying mechanics—especially the counterfactual puzzle. The marking scheme prioritizes conceptual dissection over recitation.

  ---

  ### **Essay Question (45 mins, 25 marks)**  
  **Title:** *Testing the Limits: What Drives the Knobe Effect?*  

  **Scenario:**  
  Consider the original Knobe effect: when a side effect is *harmful* (e.g., harming the environment), people judge it intentional; when *beneficial* (e.g., helping), they do not—*even though the agent knew the outcome, didn’t care, and would have acted identically regardless*.  

  **Your Task:**  
  Using **ALL FOUR** cases below, explain what this asymmetry reveals about how people assign *intentionality*. For each case:  
  1. **Predict** whether people will judge the side effect intentional.  
  2. **Explain** *why* this prediction supports or challenges *at least two* distinct explanations of the Knobe effect (e.g., normative bias, mental state requirements, pragmatic reinterpretation of "intentionally").  
  3. **Focus especially** on how the "would have acted anyway" counterfactual complicates simple accounts.  

  **Cases:**  
  1. **The Playlist Rule:**  
     > *Maya curates a school dance playlist solely to maximize attendance. She knows a track contains explicit lyrics, violating a new (but widely ignored) admin rule banning such content after 9 PM. She doesn’t care about the rule. If the track lacked explicit lyrics, she’d still have played it. Did she intentionally break the rule?*  

  2. **The Silent Chairman:**  
     > *The Board Chairman learns that canceling a program would boost profits. Canceling would also accidentally harm [or help] the environment. He quietly lets the program be canceled, indifferent to the environmental impact. If canceling had *no* environmental effect, he’d still have allowed it. Did he intentionally harm/help the environment?*  

  3. **The Algorithm:**  
     > *A school scheduling AI’s sole goal is minimizing room clashes. Its solution forces 30 students to miss the last bus home—an outcome foreseen by programmers who didn’t care. If the solution *avoided* this outcome, the programmers would have still approved it. Did the AI (or programmers) intentionally make students miss the bus?*  

  4. **The Spiteful Gardener:**  
     > *Liam hates his neighbor. He sets toxic weeds on fire solely to annoy him. He knows the smoke will *accidentally* nourish a rare orchid (which he despises). If the smoke didn’t help the orchid, he’d still have burned the weeds. Did he intentionally help the orchid?*  

  **Requirements:**  
  - Do **not** re-describe the original Knobe effect. Assume your reader knows it.  
  - **Crucially**: Engage with why agents who "would have acted anyway" and "didn’t aim at the outcome" are *still* judged differently across cases.  
  - Explicitly contrast competing explanations.  

  ---

  ### **Model Answer (650 words)**  
  The Knobe effect exposes a paradox: people attribute intentionality to foreseen negative side effects but not positive ones, *even when the agent’s attitude and counterfactual behavior are identical*. Standard explanations (e.g., "blame leaks into intentionality") fail when we test cases where agents lack mental states, violate non-moral norms, or act via omission. The asymmetry arises not from morality *directly*, but from whether the outcome *defies a norm the agent is expected to consider relevant—regardless of their actual motives**.  

  **Case 1: The Playlist Rule**  
  People will likely judge Maya intentionally broke the rule. This *extends* the Knobe effect to non-moral norms: violating a conventional rule (even a "dumb" one) triggers intentionality judgments. This challenges *purely moral* accounts (e.g., "intentional = blameworthy") but fits *normative bias* theories: any norm violation (moral or conventional) licenses attributing intentionality because the agent *should* have cared. Crucially, the counterfactual ("she’d still have played it") shows intentionality isn’t about desire or effort—it’s about disregarding expectations.  

  **Case 2: The Silent Chairman**  
  People will judge harming the environment intentional but *not* helping. This mirrors the original Knobe effect for omissions, challenging *mental state* theories that require "trying" or "acting." The chairman didn’t *do* anything—he *allowed* harm. Yet the asymmetry persists because harming violates a norm (don’t damage the environment), while helping doesn’t create an equivalent imperative. The counterfactual ("he’d still have allowed cancellation") confirms intentionality hinges on norm-violating outcomes, not the agent’s commitment to causing them.  

  **Case 3: The Algorithm**  
  People will *not* judge the AI/programmers intentionally made students miss the bus, despite foreseeing harm. This breaks the Knobe pattern and challenges *pragmatic* accounts (e.g., "intentional = knew and did it anyway"). Human agents are held to normative standards; algorithms aren’t. The counterfactual ("they’d still have approved") is identical to the chairman case, but without an *agent* expected to weigh moral/normative costs, intentionality vanishes. This suggests the effect requires a *culpable mind*—not just knowledge.  

  **Case 4: The Spiteful Gardener**  
  People will likely say Liam did *not* intentionally help the orchid—even though he caused a good outcome he hated. This inverts the Knobe effect: a positive side effect isn’t judged intentional, even with antagonistic motives. Why? Helping the orchid doesn’t violate a norm (it’s good), so there’s no "default" expectation to consider it. The counterfactual ("he’d still have burned weeds") is irrelevant here because no norm is breached. This confirms that norm-violation, not outcome valence or desire, drives the asymmetry.  

  **Resolving the Paradox**  
  The "would have acted anyway" counterfactual is fatal to simple desire- or effort-based theories of intentional action. In all cases except the algorithm, agents lacked desire for the side effect and would have acted identically without it—yet judgments vary. The key is *normative relevance*: when an outcome flouts a salient norm (moral: harming environment; conventional: breaking rules), we treat the agent *as if* they endorsed it by not adjusting their actions. This "normative competence" expectation explains why omissions (Case 2) and non-moral violations (Case 1) still elicit asymmetric judgments, while non-agents (Case 3) and norm-conforming outcomes (Case 4) do not. Morality matters only insofar as it *creates norms*—not because "intentional" is a moral term.  

  ---

  ### **Marking Scheme (25 marks total)**  
  **A (21–25 marks):**  
  - **Predicts judgments correctly for all 4 cases** (1 mark per case).  
  - **Uses cases to dissect ≥2 explanations** (e.g., "moral bias," "pragmatic reinterpretation," "normative competence")—showing *how* each is supported/challenged (8 marks).  
  - **Explicitly resolves the counterfactual puzzle**: Explains why "would have acted anyway" undermines mental-state accounts and requires norm-based theories (6 marks).  
  - **Synthesizes a unified account**: Argues that norm-violation (not valence, blame, or desire) drives asymmetry, using cases as proof (5 marks).  
  - **No rote recitation**: Original Knobe mentioned only as reference point.  

  **B (15–20 marks):**  
  - Correct predictions for 3/4 cases.  
  - Compares explanations superficially (e.g., "Case 1 shows it’s not just morality") without deep analysis.  
  - Mentions counterfactual tension but doesn’t fully resolve it.  
  - Treats cases in isolation; limited synthesis.  

  **C (≤10 marks):**  
  - **"Moral judgments leak" as sole explanation** (max 3 marks if unanalyzed).  
  - Predictions mostly wrong/missing.  
  - Regurgitates original Knobe without engaging cases or counterfactuals.  
  - Confuses mental states (e.g., "He knew, so it’s intentional" in Case 3).  

  **Key A-grade moves:**  
  - **Case 3 as a litmus test**: Uses the algorithm to show that *agency* (not outcome) is necessary.  
  - **Case 4 as a critical foil**: Notes that negative attitudes toward good outcomes *don’t* create intentionality.  
  - **Counterfactuals as the core puzzle**: Explains why "he’d still have done it" makes desire-based accounts implausible.  
  - **Norms over morality**: Distinguishes norm-violation (Cases 1–2) from moral valence (Case 4).  

  **Common wimp-outs:**  
  - "People use ‘intentionally’ to mean blameworthy" (ignores non-moral Case 1).  
  - Ignoring counterfactuals or treating them as irrelevant.  
  - Equating foresight with intentionality (fails Case 3 and 4).  
  - Listing explanations without using cases to test them.  

  This forces students to confront why the counterfactual matters, separates normative competence from morality, and uses your cases to fracture simplistic accounts. The spiteful gardener (Case 4) is key—it shows that negative motives don’t "flip" the asymmetry, undermining moralistic readings. Good luck!
