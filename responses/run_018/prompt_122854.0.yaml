  The user's academic level matters here. As second-year undergrads in experimental philosophy, they can handle conceptual tension but shouldn't need citation recall. The question must force engagement with their cases while avoiding memory-testing. I'll structure it around their three scenarios plus my fourth (the "spiteful gardener" variant) to cover: 
  - Non-moral norms (does rule-breaking without morality still trigger asymmetry?) 
  - Omissions (is harming by inaction judged differently than action?) 
  - Non-human agents (does intentionality require mental states?) 
  - Perverse incentives (does desiring the opposite outcome flip judgments?)

