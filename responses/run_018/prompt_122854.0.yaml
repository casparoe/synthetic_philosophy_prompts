prompt: |-
  hey — so I'm doing this summer course (second-year undergrad, psych/philosophy crossover, mostly experimental philosophy) and me and two friends are putting together a practice final for our study group. I got assigned the question on the Knobe effect and I'm stuck, because literally everyone in the group can already recite the basic thing: chairman of the board, new program, it'll raise profits, it'll also harm the environment, he says he doesn't care about the environment at all, and people say he harmed the environment intentionally — but in the version where it helps the environment they don't say he helped it intentionally. If I just ask "describe and explain the asymmetry" everyone writes the same paragraph and I've learned nothing about who actually gets it. The bit that actually broke my brain in lecture was the counterfactual part: in the harmful case people will also happily say that if the environment wouldn't have been harmed he'd have run the program anyway, that he wasn't trying to harm anything and would've prefered it not happen, and they *still* call it intentional. So something is doing work there and I can't say what. Is it that the ordinary concept of intentional action is secretly normative somehow, or is it that people are quietly answering a different question than the one they were asked — reporting whether he's blameworthy, or whether he knew, or whether he did it anyway despite knowing — so the result is an artifact of the vignette and the wording rather than a fact about the concept? My friend keeps saying the "he knew and did it anyway, that's what intentional means" reading is just relabeling the datum instead of explaining it, and I think she's right but I can't articulate why.

  So: can you write me one essay question for this, 45 minutes, 25 marks, that forces people to actually pick that apart instead of reciting? I want it built around some cases I invented that I think pull the explanations apart (fix them if they're bad or if they don't do the work I think they do — and please say in the marking scheme if one of them turns out not to discriminate anything): (1) a version where the side effect breaks a rule that has nothing to do with morality at all — a girl picks the playlist for a school dance to get people dancing, and she knows it breaks some dumb new admin rule about explicit lyrics after 9pm, but breaking the rule isn't her reason; did she intentionally break the rule? (2) a version where nobody acts: the chairman quietly lets the program get cancelled because cancelling is good for profits, and the environment is helped / harmed as a result, and again he doesn't care either way. (3) a version where the "agent" isn't a person — the school's timetable scheduling program, which the programmers gave exactly one objective (minimise room clashes) and which ends up, totally foreseen, making a bunch of kids miss the last bus home; the programmers knew and didn't care. Maybe a fourth where the side effect is good but the agent hates that it's good and tried to stop it, you decide if that one helps.

  Then I need a model answer (600–700 words is good) and a marking scheme that really separates an A from a B — the specific moves an A has to make, what each cluster of marks is for, and the ways people wimp out. Definitely build into the scheme that "moral judgments leak into non-moral ones" or "people use intentionally to mean blameworthy" on its own is the classic C answer and worth like 3/25 max, and say what the A answer does with those claims instead. Also: we're doing this closed-book with no wifi, so please don't make anything depend on who published what or in what year, and no reading list or citations — I always mix up which paper said which thing and I don't want to memorise names. And please don't spend the question explaining the basic finding back at us; assume we know it and come at it from a angle that makes us squirm a bit.
