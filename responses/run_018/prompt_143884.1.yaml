  **DECISION TREE: ANALYZING ARCHIVAL SILENCES (COLONIAL CENSUS EXAMPLE)**  
  *Root Case: A colonial census listing settlers but leaving blank spaces for indigenous names.*  

  ### **LEVEL 1: WHAT EXPLAINS THE BLANK SPACES?**  
  *(Triadic Absence Framework)*  
  - **A. Omission:** Names were never recorded.  
  - **B. Suppression:** Names were recorded but later destroyed/hidden.  
  - **C. Occlusion:** Names were recorded but are now illegible (e.g., faded ink, coded language).  

  ---

  ### **LEVEL 2: IS THE ABSENCE RECOVERABLE WITH ENOUGH RESEARCH?**  
  - **Yes:** Potential to reconstruct missing data.  
  - **No:** Absence is permanent/epistemically inaccessible.  

  ---

  ### **LEVEL 3: PRIMARY FUNCTION OF ARCHIVES?**  
  - **Truth:** Archives preserve objective historical records.  
  - **Power:** Archives enforce control, authority, or ideology.  

  ---

  ### **LEAVES (POSITIONS & COMMITMENTS)**  
  *Follow the branches to reach a leaf.*  

  #### **A. OMISSION (Never Recorded)**  
  - **A → Yes → Truth:**  
    - **Naive Empiricism**  
      - *Most awkward commitment:* Assumes archives neutrally reflect reality, ignoring power-driven selection biases.  
    - **Triadic Absence (Omission Branch)**  
      - *Most awkward commitment:* Insists omission is ontologically distinct from suppression/occlusion, even when power underlies all.  

  - **A → Yes → Power:**  
    - **Unnamed "Critical Optimist"**  
      - *Most awkward commitment:* Believes power-driven omissions are recoverable, contradicting how power often *prevents* documentation.  

  - **A → No → Truth:**  
    - **Unnamed "Incomplete Truth"**  
      - *Most awkward commitment:* Claims archives aim for truth despite systemic erasures of marginalized groups.  

  - **A → No → Power:**  
    - **Unnamed "Irrecoverable Oppression"**  
      - *Most awkward commitment:* Assumes power always succeeds in erasure, ignoring counter-evidence from oral histories.  

