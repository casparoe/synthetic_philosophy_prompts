  - **B → Yes → Power:**  
    - **Unnamed "Resistant Recovery"**  
      - *Most awkward commitment:* Accepts archives as tools of power while claiming suppressed truths can be "rescued."  

  - **B → No → Truth:**  
    - **Unnamed "Failed Guardianship"**  
      - *Most awkward commitment:* Argues archives *intend* truthfulness but are corrupted by external actors (e.g., colonial administrators).  

  - **B → No → Power:**  
    - **Foucauldian Power/Knowledge**  
