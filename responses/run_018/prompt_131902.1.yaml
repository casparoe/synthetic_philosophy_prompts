prompt: |-
  Analyze the September 2007 run on Northern Rock through the lens of rational information cascades. Map it carefully: depositors each had private signals about solvency versus liquidity, observed the growing queues and the leaked news that the Bank of England had agreed to emergency liquidity support, and updated sequentially. Say exactly where the canonical cascade logic applies—who held prior beliefs, what actions were observable, when a depositor should rationally ignore her private signal—and where it breaks down. In particular, did the cascade depend on true informational externalities, or was it a coordination failure driven by common knowledge of panic? Then test the theory against the ending: the run stopped after the Treasury announced a blanket deposit guarantee. Does that termination show the herding was never fully rational (since rational agents should have updated on the guarantee itself, not merely stopped queuing), or does it reveal that the cascade model is silent about how public commitments restructure payoffs? I want the mapping disciplined—identify the player, the observable action, and what counts as the private signal—and an honest account of what rational herding explains and what it misdescribes about the panic.
reasoning: |-
  We are analyzing the Northern Rock run of September 2007 through the lens of rational information cascades. We'll map the events step by step, identifying players (depositors), their private signals, observable actions, and how they update their beliefs. We'll also discuss where the canonical cascade logic applies and where it breaks down, and then test the theory against the ending (the Treasury's blanket deposit guarantee).

  ### Canonical Cascade Logic in the Northern Rock Run

  In the rational herding model (as in Banerjee, 1992; or Bikhchandani, Hirshleifer, and Welch, 1992), individuals make sequential decisions, each observing the actions (but not the private signals) of those who acted before them. Each individual has a private signal about the underlying state (here, the bank's solvency) and updates their belief based on their own signal and the history of actions. A cascade occurs when it becomes rational for an individual to ignore their own private signal and follow the crowd.

  **Mapping to Northern Rock:**

  1. **Players:** The depositors of Northern Rock.

  2. **Underlying State:** The bank's financial health, which can be:
     - **Solvent (S):** The bank is fundamentally sound and can meet all obligations.
     - **Insolvent (I):** The bank is fundamentally unsound and may fail.

     However, in the case of Northern Rock, the problem was initially a liquidity crisis, not necessarily insolvency. The bank was heavily reliant on short-term wholesale funding, which dried up. So we might also consider two states:
     - **Liquidity crisis only (L):** The bank is solvent but faces a temporary liquidity shortfall.
     - **Insolvency (I):** The bank is fundamentally insolvent.

     But note: a liquidity crisis can turn into insolvency if the run forces the bank to sell assets at fire-sale prices. So the state is not entirely exogenous.

     Alternatively, we can think of the state as the bank's ability to survive without a run. In a run, even a solvent bank can fail (due to the coordination problem). So the state might be:
     - **Viable (V):** The bank can survive if there is no run, but may fail if there is a run.
     - **Non-viable (N):** The bank will fail even without a run.

     However, for simplicity in the cascade model, we often have two states: good (solvent) and bad (insolvent). We'll adapt.

  3. **Private Signals:** Each depositor receives a private signal about the bank's condition. The signal could be:
     - `s_h` (high): indicating the bank is solvent (or has only a liquidity problem that can be resolved).
     - `s_l` (low): indicating the bank is insolvent (or has a severe problem that cannot be resolved).

     The signals are noisy. Let the precision of the signal be `p = P(s_h | S) = P(s_l | I) > 0.5`.

     In the context of Northern Rock, private signals might come from:
     - Personal knowledge of the bank's business model (e.g., its reliance on wholesale funding).
     - News about the subprime mortgage market (which was affecting many banks).
     - Rumors or leaks about the bank's difficulties.

     However, note that the private signals might be weak because most depositors are not experts.

  4. **Actions:** Each depositor must decide whether to:
     - **Withdraw (W):** immediately (and get their money back, but if too many withdraw, the bank may fail and late withdrawers may get nothing).
     - **Keep (K):** the deposit (and get the full amount plus interest if the bank survives, but lose if the bank fails).

     The payoff structure is similar to the classic Diamond-Dybvig model: there is a coordination problem because the bank uses long-term assets to fund short-term deposits. If too many withdraw, the bank fails.

  5. **Observable Actions:** The key feature of a cascade model is that depositors observe the actions of those before them. In the Northern Rock run, the observable actions were:
     - The growing queues outside Northern Rock branches (which were widely reported in the media).
     - The behavior of other depositors (e.g., the rush to withdraw).

     Also, note that depositors observed the leaked news (on September 13, 2007) that the Bank of England had agreed to provide emergency liquidity support. This is a public signal.

  6. **Sequence of Events:**
     - **Prior to the run:** The bank had been facing funding pressures due to the freezing of the interbank lending market (since August 2007). This was known to some (especially in the financial sector) but not necessarily to all depositors.
     - **Trigger:** The news of the Bank of England's emergency support (leaked on September 13) was initially intended to calm the situation but had the opposite effect. It became public knowledge that the bank was in trouble.
     - **Run begins:** On September 14, queues formed at branches. This was observable and widely reported.

  7. **Belief Updating:**
     - Each depositor starts with a prior belief about the bank's health (say, a probability that the bank is solvent). Let the prior probability of solvency be `π`.
     - Upon receiving a private signal, a depositor updates to a posterior belief.
     - Then, the depositor observes the actions of previous depositors (if any). In a cascade model, each depositor observes the entire history of actions.

     However, in the Northern Rock case, the run was happening simultaneously at multiple branches and online. So the exact sequence is not clear. But we can think of depositors as acting in a sequence over time (e.g., by the order they arrive at the branch or by the time they decide to withdraw online).

     **Cascade Formation:**
     - Suppose the first few depositors withdraw. This could be because they received negative private signals. Then, a subsequent depositor might see two withdrawals and, even if they have a positive signal, might decide to withdraw because the history of withdrawals is more informative than their own signal (if the signals are not very precise). This is the beginning of a cascade.

     **Where the Cascade Logic Applies:**
     - The initial run might have been started by depositors who had negative private signals (or by the public news of the Bank of England's intervention, which was a negative signal). Then, the observable queues (withdrawals) provided additional negative information. This is consistent with the cascade model: the actions of others are informative about their private signals.

     **Breakdown of the Cascade Logic:**
     - **Common Knowledge of Panic:** The cascade model assumes that agents are rational and update based on the information content of actions. But in reality, the panic itself might have become common knowledge. Once the queues were televised, it became clear to everyone that a run was in progress. In such a situation, even if a depositor believes the bank is solvent, they might still run because they fear that others will run and cause the bank to fail. This is a coordination failure (as in Diamond-Dybvig) and does not require any private information. Thus, the cascade might have been driven by both informational externalities (learning from others' actions) and coordination motives (fear of being last in line).

     - **Public Signals:** The cascade model typically assumes that the only public information is the history of actions. But in Northern Rock, there was a major public signal: the Bank of England's emergency liquidity support. This was a strong signal that the bank was in trouble. So the run might have been triggered by this public signal, not just by the actions of the first few depositors. The cascade model can incorporate public signals (by having agents update on both public and private signals), but the model becomes more complex.

     - **Simultaneity:** The run happened quickly and at multiple locations. The cascade model assumes a well-defined sequence, which might not hold.

     - **Payoff Structure:** The cascade model often assumes that the payoff depends only on the state (and the action). But in bank runs, the payoff also depends on how many others withdraw. This strategic complementarity (where the incentive to withdraw increases as more withdraw) is central to the coordination problem. The cascade model does not fully capture this because it typically assumes that the state is the only uncertainty and that the action of others is only informative about the state. In reality, the actions of others also directly affect the payoff (via the bank's failure). This is why we have a coordination failure.

  ### The Role of the Blanket Deposit Guarantee

  On September 17, 2007, the UK Treasury announced that it would guarantee all deposits at Northern Rock. The run stopped almost immediately.

  **Testing the Theory:**

  1. **Rational Herding View:**
     - In a rational cascade, agents update their beliefs about the bank's solvency based on the actions of others. The guarantee announcement is a public signal that the deposits are safe. Rational agents should update their beliefs about the bank's solvency (or the government's willingness to backstop) and then decide not to withdraw. So the stopping of the run is consistent with rational updating: the guarantee removed the reason to run.

  2. **Coordination Failure View:**
     - The guarantee also changed the payoff structure. Even if the bank was insolvent, the government guarantee ensured that depositors would get their money. So the incentive to run (fear of loss) was removed. This is not just about updating beliefs on solvency but about eliminating the downside risk. Thus, the guarantee directly addressed the coordination problem by making it a dominant strategy to keep the deposit (since there's no risk of loss).

  **Does the termination show that the herding was never fully rational?**

     - It does not necessarily show that. Rational herding can be overturned by a strong public signal. The guarantee was a very strong signal (and a change in the rules of the game). The cascade model can explain the run as rational based on the available information at each step. The guarantee provided new information and changed the payoffs, so rational agents would stop running.

     - However, the cascade model is silent on how public commitments restructure payoffs. The model typically assumes fixed payoffs. The guarantee changed the payoff function: now, even if the bank fails, depositors are covered. This is a structural change that goes beyond updating beliefs. So the cascade model does not explicitly model such interventions.

  ### Conclusion: What Rational Herding Explains and What It Misdescribes

  **What it explains:**
     - The run started with a negative public signal (the Bank of England's emergency support) and was amplified by the observable actions of other depositors (queues). This is consistent with the cascade model: the public signal shifted priors, and then the withdrawals provided additional negative information, leading to a cascade where even depositors with positive signals might withdraw.
     - The run stopped when a strong positive public signal (the guarantee) was announced, which is also consistent with rational updating.

  **What it misdescribes:**
     - The cascade model does not fully capture the coordination failure aspect. The fear of being last in line (due to the payoff externality) is a separate driver that the model does not explicitly account for (unless we model the state as including the actions of others, which complicates the cascade).
     - The model assumes sequential decisions with perfect observation of all prior actions, but in reality, the run was simultaneous and chaotic.
     - The model also does not account for the possibility that the bank's state is endogenous to the run (i.e., the run itself can cause insolvency).

  **Honest Account:**
     The rational herding model provides a useful lens for understanding how the run could have started and accelerated due to informational externalities. The initial leak about the Bank of England's support was a negative public signal. Then, the observable queues (withdrawals) provided additional negative information, leading to a cascade where depositors rationally ignored their own positive signals. However, the model underemphasizes the coordination motive (which was central) and the role of panic as a self-fulfilling prophecy. The guarantee worked because it both provided positive information (the government believes the bank is worth saving) and, more importantly, removed the incentive to run by guaranteeing deposits. Thus, the run was a mix of rational information cascades and coordination failure.

     In summary, the cascade model explains the informational aspect of the run but does not fully capture the strategic complementarities that are inherent in bank runs.
answer: |-
  ### Rational Information Cascade Analysis of the 2007 Northern Rock Run

  #### **Mapping the Cascade Logic**
  1. **Players**:  
     - Depositors (sequential decision-makers).

  2. **Private Signals**:  
     - Each depositor observes a noisy signal about Northern Rock's underlying state:  
       - **Solvency signal** (\(s_S\)): Evidence of fundamental health (e.g., strong mortgage assets, robust capital).  
       - **Liquidity signal** (\(s_L\)): Evidence of short-term fragility (e.g., reliance on wholesale funding, market rumors).  
     - Signals are imperfect and binary: \(s_S\) or \(s_L\), with precision \(p > 0.5\) (i.e., \(P(\text{signal} \mid \text{state})\) is correct with probability \(p\)).

  3. **Observable Actions**:  
     - **Withdraw** (\(W\)): Join the queue to remove deposits.  
     - **Keep** (\(K\)): Maintain deposits.  
     - **Public Information**: Leaked news (Sept. 13) of Bank of England (BoE) emergency liquidity support—a **negative public signal** implying fragility.

  4. **Prior Beliefs**:  
     - Initial prior (\(\pi_0\)) of solvency is high (pre-crisis confidence in UK banking).  
     - BoE liquidity announcement shifts priors downward: \(\pi_{\text{post-BoE}} < \pi_0\).

  5. **Sequential Updating**:  
     - Depositors observe:  
       - **Action history**: Growing queues (visible withdrawals).  
       - **Public signal**: BoE intervention (indicating distress).  
     - Each updates beliefs using Bayes’ rule:  
       - Early withdrawals signal \(s_L\) holders acting.  
       - After sufficient \(W\) actions, a depositor **rationally ignores their private signal** if the public history outweighs it.  
       - *Cascade threshold*: If the first \(k\) depositors withdraw, the \((k+1)\)-th depositor withdraws regardless of their signal.  

  #### **Where the Cascade Logic Applies**
  - **Informational Externalities Drive Early Run**:  
    - BoE leak (Sept. 13) acts as a negative public signal, lowering solvency priors.  
    - Initial queues (Sept. 14) provide observable \(W\) actions. Depositors infer that early actors received \(s_L\) signals.  
    - Rational herding begins: After \(\sim\)2 days of queues, depositors with \(s_S\) signals ignore them and join the run. **Cascade logic explains acceleration**—actions reveal aggregated private signals.  

  #### **Where the Logic Breaks Down**
  1. **Coordination Failure Dominates**:  
     - The cascade model assumes payoffs depend *only* on the state (solvency/insolvency). In reality:  
       - Payoffs depend on **others’ actions** (Diamond-Dybvig coordination game):  
         - If enough withdraw, the bank fails regardless of solvency.  
       - Queues become **common knowledge of panic**, creating a self-fulfilling prophecy. Depositors withdraw fearing others will, irrespective of signals.  
     - **Result**: The cascade was amplified by strategic complementarities (panic begets panic), not purely informational learning.  

  2. **Simultaneity and Chaos**:  
     - Depositors act in parallel (branches + online), not sequentially. Observing "growing queues" aggregates actions imperfectly, violating the sequential-updating assumption.  

  3. **State Endogeneity**:  
     - BoE support intended as liquidity backstop, but depositors interpreted it as solvency risk. Rational cascade models treat the state as exogenous, but here actions *induced* insolvency risk.  

  #### **The Ending: Treasury Guarantee (Sept. 17)**
  - **Event**: UK Treasury announces a blanket deposit guarantee. The run halts immediately.  
  - **Cascade Theory Prediction**:  
    - Rational agents should **update beliefs** on solvency (guarantee implies state is viable) *and* reassess payoffs (no loss even if bank fails).  
    - Actions should shift from \(W\) to \(K\) as the guarantee eliminates downside risk.  
  - **Reality vs. Theory**:  
    - **Support for Rationality**: The guarantee provided a **definitive public signal** that outweighed prior history. Depositors rationally halted withdrawals because the guarantee resolved uncertainty.  
    - **Limitation of Cascade Model**: The model **fails to explain payoff restructuring**. The guarantee altered the game:  
      - **Pre-guarantee**: \(W\) is dominant if others \(W\) (coordination failure).  
      - **Post-guarantee**: \(K\) becomes dominant (no loss possible).  
      - Cascade models assume fixed payoffs; they cannot capture how **policy interventions change strategic incentives**.  

  #### **Conclusion: What Rational Herding Explains and Misdescribes**
  - **Explains**:  
    - **Acceleration phase**: BoE leak and early queues triggered rational herding. Depositors with \(s_S\) signals ignored them after observing withdrawals, consistent with information cascades.  
    - **Sudden stop**: Guarantee provided a decisive public signal, enabling Bayesian updating.  

  - **Misdescribes**:  
    - **Panic as coordination failure**: The model underweights strategic motives (fear of being last in line). Queues became focal points for panic, not just signal aggregation.  
    - **Policy impact**: Cascade logic cannot handle exogenous payoff shifts (e.g., guarantees). The halt reflected both belief updating *and* eliminated coordination incentives.  

  **Synthesis**: The Northern Rock run began as a rational information cascade but devolved into a coordination failure. The cascade model explains the run’s onset and acceleration via informational externalities but fails to capture panic-driven strategic complementarities. The guarantee’s success reveals the model’s silence on how public commitments redefine payoffs, not just beliefs.
