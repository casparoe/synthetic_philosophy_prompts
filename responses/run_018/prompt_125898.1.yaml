  Reading 2 addresses Löwenheim-Skolem theorems. This is substantive: first-order logic can't pin down uncountability. Defensible, and it partly supports dismissing Skolem's paradox as non-threatening to realism. But it doesn't reduce second-order logic, and the relativity analogy remains shaky—models aren't inertial frames. 

