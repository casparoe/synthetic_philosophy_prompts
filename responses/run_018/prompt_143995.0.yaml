  **INTEROFFICE MEMORANDUM**  
  **OFFICE OF MNEMONIC EQUITY (OME)**  
  **MEMORANDUM NO.: OME-HER-2024-017**  
  **DATE:** October 26, 2024  
  **TO:** Municipal Heritage Board, Chair & Members  
  **FROM:** Dr. A. Pendleton, Director, Mnemonic Hygiene Division  
  **SUBJECT:** Mandatory Implementation of Standardized Commemorative Impact Assessment (CIA) Protocol; Introduction of Contamination Coefficient (CC) Metric  

  **1.0 PURPOSE & SCOPE**  
  This memorandum formalizes the requirement for all entities under municipal jurisdiction, effective immediately, to utilize the **Commemorative Impact Assessment (CIA) Form OME-7a (Rev.3)** prior to the installation, retention, or alteration of any commemorative public artefact (hereafter "Commemorative"), including but not limited to statuary, street/avenue/park nomenclature, and plaque dedications. The CIA protocol ensures rigorous quantification of potential mnemonic disquietude arising from the dual vectors of **Retrospective Honor (RH)** and **Prospective Endorsement (PE)**, thereby safeguarding communal moral equilibrium.  

  **2.0 RATIONALE: RH vs. PE DISJUNCTION**  
  Analysis indicates persistent conflation of **RH** (the *original intent* motivating commemoration, typically reflecting contemporaneous societal values and achievements) with **PE** (the *perceived contemporary moral endorsement* signalled by the Commemorative's ongoing, unmodified presence). This disjunction constitutes a primary vector for civic discord. The CIA protocol, specifically through the **Contamination Coefficient (CC)**, provides an objective framework to disentangle these vectors and quantify resultant moral friction.  

  **3.0 THE CONTAMINATION COEFFICIENT (CC)**  
  The **CC** is a scalar metric (range: 0.0 - 1.0) quantifying the degree to which an individual's documented views or actions, now deemed categorically objectionable under prevailing ethical standards, contaminate their otherwise laudable achievements (the core RH justification).  

  *   **3.1 Calculation Basis:**  
      *   **CC = (S * I * P) / C**  
          *   **S (Severity Score):** Moral gravity of objectionable view/action (1=Minor Disagreement; 5=Egregious Violation of Core Principles).  
          *   **I (Influence Score):** Extent to which the individual actively promoted or materially enabled the objectionable view/action (1=Private Belief; 5=Public Advocacy/Enforcement).  
          *   **P (Permanence Score):** Duration and consistency of objectionable view/action relative to lifespan/relevant career phase (1=Isolated Incident; 5=Lifelong/Defining Feature).  
          *   **C (Context Mitigation Factor):** Availability and public accessibility of nuanced historical context explaining the coexistence of laudable and objectionable aspects (1=Abundant, Well-Known Context; 5=No Known Mitigating Context).  
  *   **3.2 Interpretation:**  
      *   **CC < 0.2:** Negligible Contamination. Retention typically viable (Low PE risk).  
      *   **CC 0.2 - 0.5:** Moderate Contamination. Requires Mitigation Strategy (Moderate PE risk).  
      *   **CC > 0.5:** Severe Contamination. Removal/Replacement strongly advised (High PE risk).  

  **4.0 APPLICATION: HYPOTHETICAL CASE STUDY - "WHITAKER STREET"**  
  *   **Commemorative:** Street named for Dr. Elias Whitaker (1820-1890).  
  *   **RH Justification:** Pioneering public health reformer; established city's first sanitation commission; reduced cholera mortality by 70%.  
  *   **Contaminating Elements:** Authored influential pamphlets advocating for the compulsory sterilization of "hereditary paupers" and endorsed restrictive immigration policies based on pseudoscientific racial hierarchies.  
  *   **CC Calculation (Illustrative):**  
      *   S = 4 (Eugenics advocacy is severe violation).  
      *   I = 4 (Public pamphlets & lobbying).  
      *   P = 3 (Advocated for ~20 years, concurrent with reforms).  
      *   C = 3 (Limited public awareness of this duality; complex socio-scientific context often omitted).  
      *   **CC = (4 * 4 * 3) / 3 = 48 / 3 = 16.0**  
      *   **Interpretation:** CC = 16.0. **Severe Contamination.** The significant public health achievements (RH) are critically undermined by the pervasive, actively promoted objectionable views, presenting a high PE risk if unaddressed.  

  **5.0 REQUIRED ACTION & ATTACHED FORM**  
  The Heritage Board **must** utilize the attached **Commemorative Impact Assessment Form OME-7a (Rev.3)** for *all* existing and proposed Commemoratives within its purview. Completed forms must be submitted to OME for audit and CC validation within 90 days for existing assets, and prior to any approval for new proposals.  

  **6.0 REMEDIATION OPTIONS (SELECT BASED ON CC)**  
  Based on the validated CC, the Board will select and implement one mandatory Remediation Option:  
  *   **Option A:** Unmodified Retention (CC < 0.2 only).  
  *   **Option B:** Retention with Mandatory Contextualization Package (CC 0.2 - 0.5).  
  *   **Option C:** Contextual Plaque with Apologetic Footnote (See Form, Sec. IV).  
  *   **Option D:** Removal and Archival Storage (CC > 0.5).  
  *   **Option E:** Removal and Replacement (CC > 0.5, with Immediate Naming Priority).  

  **ATTACHMENT:** Commemorative Impact Assessment Form OME-7a (Rev.3)  
