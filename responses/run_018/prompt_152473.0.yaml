  Opening concessions: Grant that patterns supervene on microfoundations (appease physicalists) and aren't group minds (block intentionality). Avoid design-stance collapse by defining structural constraints as non-teleological. The nightmare question is structural stance smuggling in design—must deny teleology and cite selection mechanisms.

  User's blind spot? Possibly underestimating how much "constraints as selected" sounds design-like. Need stronger demarcation: design implies foresight, structure is post-hoc winnowing. Also, institutional examples better avoid anthropomorphic language like "function." 

