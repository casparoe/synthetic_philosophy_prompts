  can you write a dialogue between Dr. Maya Torres (defending virtue ethics) and Dr. Leo Park (pushing situationist critique) arguing over coffee about whether classic experiments like Milgram actually destroy the idea of character, or just show that character needs the right ecological conditions to show up. they should really talk to each other, not past each other. for example, Leo should deal with Maya's point that without virtue-language we can't even call the Milgram results morally bad, and Maya should actually engage with Leo's claim that people act totally differently in hospitals versus prisons versus home. keep them both smart and equal.

  they should keep returning to a concrete case: Jordan, a paramedic who saves lives in chaos but is kind of a jerk to there family. is that 'fragmented virtue' or are we just expecting one-size-fits-all character in a world that doesn't work like that? please make it conversational, not like a textbook, and don't include any reading lists or citations since i need to turn this in as my own work. also i keep misspelling virtue as 'virtue ethcis' in my notes lol, but mostly i just want them to actually respond to each other's real points instead of talking past eachother.
