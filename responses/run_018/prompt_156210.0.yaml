  Then, argue that this structural difference affects the moral equality. If aggressor soldiers' ignorance is a result of their institution's design, they can't claim the same epistemic excuse as defensive soldiers whose institutions don't manipulate information as severely. Thus, the moral equality breaks down because the conditions for ignorance aren't symmetric. 

