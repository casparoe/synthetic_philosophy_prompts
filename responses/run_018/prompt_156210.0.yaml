answer: |-
  Here's the argument that asymmetric epistemic closure undermines the moral equality of combatants, focusing solely on institutional structures:

  1.  **The Core Walzerian Symmetry:** Walzer's moral equality rests on the premise that soldiers on both sides suffer from a *symmetrical epistemic deficit* – they are equally unable to reliably know the justice of their nation's cause due to their position within the military hierarchy and the fog of war. This universal ignorance grants them an equal right to kill enemy combatants ("the war right").

  2.  **Epistemic Closure in Command Hierarchies:** Command hierarchies are not neutral information conduits; they are active filters. Their structure, culture, and directives profoundly shape what information flows up, down, and laterally, and what moral considerations are deemed relevant or permissible.

  3.  **Asymmetry of Institutional Filters in Aggressive vs. Defensive Wars:**
      *   **Aggressive Wars:** Initiating unjust aggression carries significant political and moral risk. The initiating state/institution has a *strong systemic incentive* to manufacture consent and suppress dissent *within its own military apparatus*. This manifests as:
          *   **Top-Down Propaganda & Ideological Purity:** Relentless dissemination of a single, justifying narrative, framing the war as necessary, defensive, or righteous. Counter-narratives are labeled treasonous or enemy disinformation.
          *   **Suppression of Dissent:** Formal and informal punishment for questioning the war's justification. Channels for raising moral or factual objections are closed, ignored, or actively punished (e.g., silencing whistleblowers, court-martials for dissent).
          *   **Information Control:** Restricting access to external information, controlling internal communications, and filtering intelligence reports to support the predetermined narrative. Dissenting views from lower ranks are unlikely to reach decision-makers or be taken seriously.
          *   **Creating an Echo Chamber:** The hierarchy becomes structured to reinforce the aggressive premise, actively excluding or discrediting counter-evidence. Ignorance is not passive; it's *manufactured*.
      *   **Defensive Wars:** While not immune to propaganda, the state/institution defending against aggression faces a different reality:
          *   **Exogenous Justification:** The core justification (defense against attack) is often evident to the population and military from the outset. Sustaining morale relies less on manufacturing a complex, hidden justification.
          *   **Less Need for Internal Suppression:** The existential nature of defense can sometimes (though not always) allow greater tolerance for internal debate *about tactics or specific policies*, even while maintaining unity against the external threat. The core "just cause" is less contested internally.
          *   **Potential for Counter-Evidence Flow:** While imperfect, channels for reporting facts (e.g., civilian casualties, logistical failures) might remain somewhat more open, as accurate intelligence is crucial for survival. Suppressing inconvenient facts directly undermines the defensive effort. Soldiers *might* encounter credible counter-evidence challenging specific actions, even if the overall defensive posture isn't questioned.

  4.  **Breaking the Symmetry of Ignorance:** This institutional asymmetry creates a *qualitative difference* in the soldiers' epistemic condition:
      *   **Aggressor Soldiers:** Their ignorance is often *actively produced and maintained* by their own institution. The hierarchy functions as an "epistemic blocker," systematically preventing access to credible counter-evidence concerning the war's *fundamental justification*. The "they didn't know" excuse stems from *institutional design* suppressing knowledge, not just inherent fog or position.
      *   **Defensive Soldiers:** While ignorant of many things, their lack of certainty about the *core justice of resisting aggression* is more likely a product of the inherent fog of war, complexity, and their position – not primarily the result of their own institution *actively and systematically suppressing counter-evidence proving their cause is fundamentally unjust*. They may be unaware, but their hierarchy is less likely to be an active *manufacturer* of that specific ignorance regarding the core cause.

  5.  **Undermining Moral Equality:** Because the epistemic deficit regarding the war's fundamental justice is *institutionally manufactured and asymmetric*:
      *   The "they didn't know" excuse becomes *structurally weaker* for soldiers fighting for the aggressor. Their ignorance is less a passive condition of soldiering and more a consequence of their institution's deliberate effort to *prevent* them from knowing the truth about the war's unjust foundation. This institutional complicity weakens the claim that their ignorance is entirely blameless and symmetrical.
      *   The Walzerian level playing field collapses. The aggressor soldier fights under an institution that actively shields him from the moral truth of his actions in a way the defensive soldier's institution typically does not (regarding the core justice of defense). This structural difference in access to truth (or barriers to it) means their moral starting points are not equivalent.
      *   Therefore, the *right to kill* derived from symmetrical blameless ignorance cannot hold equally. The aggressor soldier's right is undermined by the fact that his excusing ignorance is, to a significant degree, a product of his own side's institutional malfeasance designed precisely to enable the aggression.

  **Key Distinction (No Individual Blame):** This argument targets the *institutional structures and incentives*, not individual soldiers' diligence. It doesn't claim aggressor soldiers *should have known better* by individually defying their chain of command or seeking outside news (which may be impossible or punished). It claims their *institution* made knowing the fundamental injustice systematically difficult or impossible through its internal design, while the defensive institution (focused on survival) generally lacks this *specific* incentive and mechanism for manufacturing ignorance about the core cause. The asymmetry lies in the *source and nature* of the ignorance, not in individual culpability for failing to overcome it. The moral equality breaks down because the epistemic conditions imposed by the warring institutions themselves are fundamentally unequal.
