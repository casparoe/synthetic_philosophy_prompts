  The tricky part comes when we consider perceptual thoughts like "that liquid is refreshing". If externalism applies here too, then their thoughts have different contents because they refer to different substances. That would mean no shared mental content at all between twins - which seems counterintuitive since their subjective experiences are identical. 

  The user wants to know if there's a middle ground where we can distinguish broad (externalist) content from narrow (phenomenal/demonstrative) content. This matters because without such a distinction, externalism might imply that even our conscious experiences are determined externally - which feels wrong when considering the twins' identical inner states.

  I should explain why this threatens externalism's coherence: if all mental content depends entirely on external factors, then twins share zero psychological states. This undermines psychology's ability to generalize about mental states based on internal properties. 

  For the middle ground position: it proposes that while broad content differs (H₂O vs XYZ), narrow content like "that phenomenal quality" or "this liquid experience" could be shared. This preserves both external determination of reference and internal similarity of experience.

  But the big risk is that this narrow content might not be truly "contentful" - if it doesn't determine reference, is it still meaningful thought? Critics say this collapses into internalism because it makes the mental content entirely internal after all.

  My assessment: the middle ground can hold if we accept that mental content has multiple dimensions. Narrow content isn't empty - it captures the subjective character of thought while broad content handles reference. They're complementary aspects rather than competitors. This doesn't collapse into internalism because broad content remains essential for explaining intentionality.

