  Read Shakespeare's Hamlet through the lens of Hume's essay on suicide, treating the play not as an illustration of the philosophy but as an interlocutor that may correct or complicate it. Focus on the soliloquy in Act III in which Hamlet weighs continued existence against self-annihilation, and on the structural contrast between his refusal to kill Claudius at prayer—where he fears sending the king to heaven—and his eventual acceptance of death by poison in the final scene. Hume argues that suicide violates no special duty to God, to society, or to oneself, partly by analogizing it to other voluntary risks and partly by treating the fear of an afterlife as a superstitious exaggeration that makes self-killing seem uniquely sinful. Ask whether Hamlet frames his own death as a moral problem of the kind Hume dissolves, or whether the play operates with a different framework in which the manner, timing, and witness of death carry symbolic weight regardless of who initiates it. In particular, examine whether Hamlet's reluctance to kill Claudius reveals a concern for the moral quality of dying that Hume's deflationary account cannot accommodate, and whether Hamlet's fear of the undiscovered country functions as the kind of superstitious barrier Hume targets or rather as a rational epistemic caution about unknown consequences. I want a reading that takes both the dramatic logic of the play and the specific architecture of Hume's arguments seriously, and that ends by saying what Hamlet adds to the philosophical debate about suicide—perhaps about narrative closure, the ethics of being seen to die, or the asymmetry between self-killing and being killed—that pure argument does not supply.

  After your reading, provide a brief structured summary as a JSON object with exactly these fields:
