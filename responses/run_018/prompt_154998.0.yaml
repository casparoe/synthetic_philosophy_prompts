  **INTERNAL MEMORANDUM**  
  **The Society for Psychical Research**  
  **Committee for Ethical Apparition Assessment (CEEA)**  
  **Ref: CEEA/1894/App/Delta**  
  **Date: 17th October, 1894**

  **From:** Dr. E. Vance, Secretary to the CEEA  
  **To:** Members of the CEEA; Prof. H. Sidgwick (Chair)  
  **Subject:** Application of Sidgwickian Ethical Principles to Pending Cases of Haunting (Quarterly Review Cycle)

  **1. Preamble:**  
  Pursuant to the Chair’s directive (CEEA/1893/Directive/Alpha), this Committee is obligated to evaluate all reported spectral phenomena for potential funding allocation (e.g., investigation expenses, mediumistic validation, stenographer fees for witness depositions) through the tripartite ethical lens explicated in *Methods of Ethics*. Each case must be assessed for its conformance to:  
      a. **The Utilitarian Principle (Observer Welfare):** Maximising aggregate pleasurable affect (awe, intellectual stimulation, moral elevation) amongst credible witnesses, minus deleterious effects (terror, sleep disruption, property devaluation).  
      b. **The Egoistic Principle (Spectral Self-Interest):** Promotion of the apparition’s inferred post-mortem well-being or satisfaction of its ostensible desires (e.g., resolution of unfinished business, attention, atmospheric dominance).  
      c. **The Intuitionist Principle (Manifest Duty):** The apparition's adherence to an intrinsic, intuitively apprehended moral obligation to manifest appropriately (e.g., proportionate to grievance, historically significant, aesthetically coherent, avoiding vulgarity).

  **2. Introduction of the Continuity Coefficient (CC):**  
  To address persistent ambiguity regarding the *moral status* of an apparition (i.e., whether it constitutes the *same moral agent* as the deceased individual, thereby meriting consideration under Principles 1b & 1c), the Committee hereby adopts the **Continuity Coefficient (CC)**. The CC quantifies the degree to which personal identity persists post-mortem, calculated thusly:

  > **CC = (M + E) / A**  
  > Where:  
  > **M** = Measurable congruence of *Memory* (specific recollections demonstrated, verified historical accuracy).  
  > **E** = Consistency of *Ethical Character* (alignment with documented lifetime virtues/vices).  
  > **A** = *Anomaly Factor* (disruptive deviations in appearance, behaviour, or temporal coherence from the known living persona).

  A **CC ≥ 0.7** indicates substantial identity continuity, warranting full ethical consideration as the *original person*. **CC 0.4 – 0.69** suggests fragmented identity; consideration is proportional. **CC < 0.4** classifies the phenomenon as a 'psychic residue' or 'atmospheric imprint,' meriting evaluation *solely* under the Utilitarian Principle (1a), as its moral agency is deemed negligible.

  **3. Case Assessments & Funding Recommendations:**

  *   **Case Delta-7: "The Green Lady of Throgmorton Hall" (Reported: Dorset)**
      *   *Utilitarian (1a):* **High.** Consistent reports evoke profound melancholic beauty and historical intrigue. Witnesses report refined sorrow, not terror; minor sleep disruption offset by cultural enrichment. Property value *increased* due to notoriety.
      *   *Egoistic (1b):* **Moderate-Low (CC Dependent).** Manifestation appears linked to unrequited love. CC calculated at **0.65** (Strong M, Moderate E, Low A). Thus, moderate consideration: lingering desire inferred, but spectral self-actualization seems stagnant. Funding could facilitate resolution (e.g., targeted séance).
      *   *Intuitionist (1c):* **Moderate-High (CC Dependent).** CC >0.5 suggests residual personhood. Intuitive duty to manifest grief aesthetically fulfilled with commendable restraint. Avoids excessive moaning or ectoplasmic excess.
      *   **Recommendation:** **Conditional Funding (£15)** for historical verification & one mediated resolution attempt. Priority: Medium-High.

  *   **Case Epsilon-2: "The Headless Accountant" (Reported: Cheapside, London)**
      *   *Utilitarian (1a):* **Very Low.** Manifestations solely involve rattling ledger books and cold spots near the old strongbox. Induces tedium and minor chills in clerks. Zero awe, negative impact on clerical efficiency.
      *   *Egoistic (1b):* **Indeterminate (CC < 0.4).** CC = **0.25** (Low M – only bookkeeping gestures, Low E – no moral dimension, High A – headlessness). Classified as psychic residue. No discernible self-interest.
      *   *Intuitionist (1c):* **N/A.** CC <0.4 negates duty assessment.
      *   **Recommendation:** **No Funding.** A tedious anomaly of no ethical significance. Advise witnesses to wear thicker waistcoats.

  *   **Case Zeta-9: "The Shrieking Miner" (Reported: Cornwall Tin Mine)**
      *   *Utilitarian (1a):* **Negative.** Causes profound terror, work stoppages, and incipient panic amongst miners. No redeeming intellectual or aesthetic pleasure reported. Significant economic detriment.
      *   *Egoistic (1b):* **Moderate (CC Dependent).** CC = **0.58** (Moderate M – recalls collapse, High E – rage at perceived negligence, High A – non-corporeal shrieking). Suggests fragmented but agentic identity. Rage implies strong, if negative, self-interest (vengeance?).
      *   *Intuitionist (1c):* **Low.** While grievance (mine safety) may be valid, intuitive duty demands proportionate manifestation. Shrieking universally, causing indiscriminate terror, violates duty of *reasonable spectral conduct*. Excessive, vulgar.
      *   **Recommendation:** **Funding Denied.** Ethically unsound due to net negative utility and breach of manifest duty. Recommend local vicar perform unsanctioned (unfunded) rite of placation. Place case on probationary watch-list.

  **4. General Observations:**  
  Application of the CC clarifies previously contentious cases. However, recalibration may be necessary for "collective" or "atavistic" apparitions lacking individual biography. Persistent challenges remain in quantifying "pleasurable affect" (1a) – is scholarly fascination equivalent to spiritual awe? Further, defining the parameters of "spectral self-actualization" (1b) for entities with CC<0.7 requires refinement; does rattling a chain constitute progress?

  **5. Action:**  
  Members are requested to review the attached scoring sheets for Cases Delta-7, Epsilon-2, and Zeta-9, and signify approval or dissent regarding the recommendations by return memorandum before 24th inst. The next review cycle will include the perplexing "Poltergeist of the Periwinkle Teapot" (Case Theta-1), noted for its prosaic domesticity and low CC.

  Respectfully submitted,

  **Dr. E. Vance**  
  Secretary, Committee for Ethical Apparition Assessment  
  The Society for Psychical Research
