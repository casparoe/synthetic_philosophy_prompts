  Here's a joke adhering to your specifications:

  **Setup:**  
  Two friends, Priya and Ben, are driving when their smartphone navigation app suddenly reroutes them down a narrow, unpaved road that dead-ends at a cow pasture. Ben slams the dashboard.

  **Ben:** "This app is useless! It lied! It told us the route *existed*, but clearly, it doesn't! There's *no inherent truth* in this stupid blue line!" *(Denies Position 1: It is so/Exists inherently)*

  **Priya:** "Hold on. Earlier it got us *perfectly* onto the highway. To say the app 'doesn't exist' or has 'no truth' at all is ridiculous. We followed it successfully for miles!" *(Denies Position 2: It is not so/Doesn't exist inherently)*

  **Ben:** "Fine! Maybe it both *is* trustworthy and *isn't* trustworthy at the same time. Sometimes it works, sometimes it doesn't! Both true!" *(Affirms Position 3: Both so and not so)*

  **Priya:** "But Ben, how can it *inherently possess* both 'perfect reliability' and 'total unreliability' simultaneously? That’s a logical contradiction. It can't *be* both in its core nature." *(Denies Position 3)*

  **Ben:** (Sighs) "Alright, forget 'both'. So maybe it's *neither* inherently trustworthy *nor* inherently untrustworthy? Just... neutral?" *(Affirms Position 4: Neither so nor not so)*

  **Priya:** "But that doesn't hold either. The app isn't floating in a void. It *functions*. It gives directions based on satellite signals, traffic algorithms, and our phone's sensors. We *use* it. It has dependent, conventional reality. Saying it's 'neither' ignores that it clearly *does* something, even if it's flawed." *(Denies Position 4)*

  **Ben:** (Stares blankly at the phone, then the cows, then back at Priya) "...So... the app *isn't* inherently real. It *isn't* inherently fake. It *isn't* both inherently real and fake. And it *isn't* inherently neither... because it *depends* on satellites, my phone battery, Google's servers, road closures, and maybe that cow over there judging us?" *(Realizes the tetralemma collapse)*

  **Priya:** (Nods sagely) "Exactly. Its 'trustworthiness' lacks *svabhāva*. It arises dependently: cell towers, GPS signals, your shaky 4G, the ever-changing digital map... and our desperate hope we're not late. No fixed essence in the app, the route, or even us drivers. Just empty, conditioned phenomena leading... somewhere."

  **Ben:** (Starts the car, chuckling) "So the punchline is, the only thing emptier than the app's inherent existence... is this gas tank if we don't find a way out of this pasture *depending* on it."

  **Punchline Structure Breakdown:**
  1.  **Rejects "Is Trustworthy" (Position 1):** The app fails visibly.
  2.  **Rejects "Is Not Trustworthy" (Position 2):** It worked earlier; denying *any* function is absurd.
  3.  **Rejects "Both Trustworthy and Untrustworthy" (Position 3):** Cannot possess contradictory inherent natures simultaneously.
  4.  **Rejects "Neither Trustworthy nor Untrustworthy" (Position 4):** Its conventional, dependent functionality is undeniable.
  5.  **Turns on Śūnyatā:** The *reason* all positions are rejected is the lack of independent, intrinsic nature (*svabhāva*) in the app's "trustworthiness." Its reliability is entirely contingent on myriad causes and conditions (network, software, data, user input, physical world), demonstrating its emptiness.
  6.  **Modern Mundanity:** Uses a relatable tech frustration (flaky GPS) as the scenario.
  7.  **Coherent to Understanding:** The punchline relies on recognizing emptiness as dependent origination, not nihilism ("just empty... leading somewhere" + Ben's pragmatic action).

  The humor comes from rigorously applying the tetralemma's formal logical negation to a mundane irritation, revealing the profound (and slightly absurd) lack of inherent existence in our everyday digital dependencies.
