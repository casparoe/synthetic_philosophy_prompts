          debrief_mapping:
            Round 1: Shows that when there is a strong majority, all aggregation methods agree. This corresponds to the aggregative conception of popular will as the sum of individual preferences. It also can be seen as a case where the transformative model (if it involves deliberation) might not change anything because of the clear majority.

            Round 2: Shows that when preferences are more divided, different aggregation methods can yield different results (even though in our example they mostly agreed). The cycle in the Condorcet method illustrates the problem of non-transitive preferences. This round highlights the ambiguity in the aggregative conception.

            Round 3: Explicitly shows that no method is neutral and that each method constructs a different "will". The requirement to defend their method's result despite the fact that no citizen has the aggregate preference ordering exposes the manufactured nature of the will. The transformative group's outcome (E4) is not the first choice of any citizen, but they present it as the common good. This connects to the transformative conception: the popular will as emerging from deliberation that transforms preferences.

