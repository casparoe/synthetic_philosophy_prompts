               - In Scenario B, according to both theories, is the algorithm the cause of the non-virality? (Answer: no.)
               - Why might we still want to hold the algorithm causally responsible? (Because it actually did the suppression, and the backup was only potential.)
          - This checks that they see the theories give the same answer in this case and understand the limitation.
     7. (5 min) Conclusion: Both theories have their merits and limitations. The social media example shows that causation in complex systems may require richer causal models.

     This is a ninety-minute session.

     Note: We have not found a scenario within this example where the theories diverge, but we have shown that they share challenges. For the purpose of this group, that may be enough.
answer: |-
  ### Teaching Arc: Counterfactual vs. Interventionist Causation in Social Media  
  **Scenario:** A social-media algorithm suppresses a viral post. Without suppression, the post would have reached a critical audience and spread widely. We investigate whether the algorithm **caused** the post's failure to spread.  

  ---

  ### **Teaching Sequence**  
  #### **1. Set Up the Scenario (10 mins)**  
  - **Outline the case:**  
    - A post gains initial traction.  
    - The algorithm suppresses it (e.g., de-prioritises it in feeds).  
    - The post fails to "go viral."  
    - *Crucial detail:* Without suppression, the post *would* have spread.  
  - **Why this scenario?**  
    - Avoids physical intuitions (e.g., billiard balls) that oversimplify agency and redundancy.  
    - Embeds **omissions** (failure to act), **preemption** (backup causes), and **networked dependencies** (algorithm↔user behaviour) naturally.  
    - Mirrors real-world debates (e.g., algorithmic accountability).  

  #### **2. Introduce Counterfactual Causation (20 mins)**  
  - **Core idea:** "But-for" test.  
    > *"Event C caused E iff, had C not occurred, E would not have occurred."*  
  - **Apply to the scenario:**  
    - *But for the algorithm’s suppression, would the post have spread?*  
    - Answer: **Yes** → Algorithm caused the failure.  
  - **Preempt misconceptions from decision theory:**  
    - *Defuse immediately:* "Unlike Newcomb-like problems, we assume no self-fulfilling prophecies or causal loops here. Hold questions about predictors vs. causes until Q&A."  
  - **Check for understanding:**  
    > *"If a human moderator had deleted the post* anyway *without the algorithm, would the counterfactual theory still blame the algorithm? Why?"*  
    → Answer: **No**. Without suppression, failure still occurs → no but-for dependence.  

  #### **3. Introduce Interventionist Causation (25 mins)**  
  - **Core idea:** "What if we *intervened*?"  
    > *"C causes E iff intervening to change C (while holding other variables fixed) changes E."*  
  - **Contrast with counterfactuals:**  
    - Counterfactuals: Imagine *removing* the cause.  
    - Interventions: Actively *set* the cause (e.g., "force" algorithm on/off).  
  - **Apply to the scenario:**  
    - Intervention: Force algorithm **not to suppress**. Outcome: Post spreads.  
    → Algorithm **is a cause**.  
  - **Key divergence point:**  
    - *Now add a twist:* Suppose a **backup system** (e.g., human moderator) would have suppressed the post *if the algorithm failed*.  
    - Counterfactual: "Without algorithm, backup acts → failure still occurs" → **no causation**.  
    - Interventionist: "Intervene to *disable algorithm* → backup activates → failure still occurs" → **no causation**.  
    - *But intuitively, the algorithm "did the work"!*  

  #### **4. Expose the Gap: Omissions and Preemption (20 mins)**  
  - **Omission case (new variant):**  
    - Algorithm *fails to boost* a post (omission). The post fails to spread.  
    - *Without the omission* (i.e., if boosted), it *would* have spread.  
    - Counterfactual: "But-for the omission, spread would occur" → **omission is a cause**.  
    - Interventionist: "Intervene to *force boosting* → spread occurs" → **omission is a cause**.  
    → *Theories agree here.*  
  - **Preemption case (critical divergence):**  
    - Algorithm suppresses post. *Simultaneously*, the *user deletes* the post. Either alone would prevent virality.  
    - Counterfactual: "Without suppression, deletion still happens → failure occurs" → **no causation**.  
    - Interventionist: "Intervene to *prevent suppression* → deletion still happens → failure occurs" → **no causation**.  
    → *Theories still agree?*  
  - **The divergence trigger:**  
    - Modify preemption: Algorithm suppresses at **t₁**. Backup (moderator) would suppress at **t₂ if needed**.  
    - Interventionist test: Intervene to **prevent algorithmic suppression** at t₁.  
      - Outcome: Backup activates at t₂ → failure still occurs.  
      → **No causation** (same as counterfactual).  
    - *Ah, but:* Interventionist theory allows testing **mediating variables**.  
      - Add variable: "Reach at t₁.5" (e.g., post visibility *before* backup acts).  
      - Intervention: Prevent suppression → Reach increases at t₁.5 → *Then* backup activates.  
      → Algorithm’s suppression **caused reduced Reach at t₁.5** (even if final outcome is unchanged).  
    → Interventionism **can capture early-stage causation**; counterfactual often cannot without ad hoc fixes.  

  #### **5. Check for Understanding (10 mins)**  
  - **Test:**  
    > *"In the two-stage preemption case (algorithm t₁, backup t₂), why might an interventionist say the algorithm caused the post’s mid-stream suppression, while a counterfactualist might deny it caused the final outcome?"*  
    - Target insight: Interventionism’s focus on **path-specific effects** via mediators (Reach at t₁.5) vs. counterfactualism’s binary "final outcome" view.  
  - **Misconception defusal:**  
    - "Note: Interventionism does *not* inherently handle preemption better—it’s the **structured variables** (e.g., time-graded mediators) that expose nuance. Counterfactualism needs similarity metrics for worlds to resolve this."  

  #### **6. Why Social Media > Physical Examples (5 mins)**  
  - Physical cases (e.g., "match lights iff struck") hide:  
    - **Redundancy**: Real systems (social/media, biology) have backup causes.  
    - **Agency**: Algorithms (like humans) have "dispositional" behaviours (e.g., "if not suppressed, backup activates").  
    - **Omissions**: "Not acting" is a live debate in tech ethics (e.g., "Facebook failed to remove harmful content").  

  ---

  ### **Technical Machinery to Set Aside**  
  1. **Structural Equations:**  
     - *Omit:* Do not formalise variables (e.g., `Viral = f(Algorithm, Backup)`).  
     - *Why:* At this level, intuition suffices. Formal SCMs risk bogging down non-technical learners. The logic holds verbally.  
  2. **Possible-World Similarity Metrics:**  
     - *Omit:* Avoid Lewis-style "closest worlds" comparisons.  
     - *Why:* Social media’s deterministic backup systems make similarity intuitive (e.g., "world without suppression ≈ backup activates"). Metrics add complexity without clarifying the gap.  
  3. **Causal Graphs/DAGs:**  
     - *Omit:* No need to diagram paths.  
     - *Why:* The mediator (Reach at t₁.5) is explainable narratively. Graphs are useful but not essential here.  

  ---

  ### **Misconceptions to Defuse**  
  | **Misconception**                     | **When Defused**               | **Response**                                                                 |  
  |---------------------------------------|--------------------------------|------------------------------------------------------------------------------|  
  | "Intervention = counterfactual"       | Intro to interventionism       | "Interventions fix confounders; counterfactuals imagine absence. Social media backups *depend* on the cause." |  
  | "Omissions aren’t causal"             | Omission case                  | "Both theories treat omissions as causes iff they change outcomes under tests." |  
  | "Preemption is identically handled"   | Preemption divergence point    | "Interventionism leverages mediators; counterfactualism often needs extra logic for temporal chains." |  
  | "Causal loops resolve the same"       | Pre-emptively in intro        | "Loops (e.g., self-fulfilling prophecies) break both theories. We exclude them today." |  

  ---

  ### **Timing Summary**  
  - Setup: 10 mins  
  - Counterfactual: 20 mins  
  - Interventionist: 25 mins  
  - Gap & Check: 20 mins  
  - Recap/Q&A: 15 mins  

  By anchoring in one rich scenario, you avoid example-fatigue while exposing how both theories handle (and stumble on) omissions, preemption, and structure-dependent causation. The social media case forces learners to confront gaps they’d overlook in "clean" physical analogies.
