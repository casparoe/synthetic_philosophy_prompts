  ### Bargaining Theory in ML Vocabulary: Nash vs. Kalai-Smorodinsky (KS)

  #### Core Translation of Players, Gains, and Objectives
  - **Player ≡ Objective**: Each "player" is an objective (e.g., accuracy, fairness, interpretability) with **incommensurable units**. Gains are measured from a **disagreement point** (status quo/baseline model).
  - **Disagreement Point**: Baseline model performance (e.g., a simple model like logistic regression). Gains \(g_i = \text{objective}_i - \text{baseline}_i\).
  - **Feasible Set**: Achievable \((g_1, g_2, \dots)\) tuples across your **model class** (e.g., all DNNs with fixed architecture). Pareto frontier = undominated points.
  - **Invariance to Affine Transformations ≡ Per-Objective Rescaling**:  
    - Nash and KS are invariant to \(g_i \mapsto a_i g_i + b_i\) (\(a_i > 0\)).  
    - **ML analogue**: Adam-like per-parameter scaling or input normalization. Ensures solution doesn't change if you rescale/recenter an objective (e.g., multiplying fairness loss by 100).

  #### Nash Bargaining Solution (NBS)
  - **Rule**: Maximize \(\prod (g_i)\) (Nash product) over feasible gains.  
  - **ML Scalarization**: Maximize \(\sum \log(g_i)\) ≡ **proportional fairness** (common in networking/fair ML).  
  - **Axioms in ML Terms**:  
    1. **Pareto Efficiency**: Solution is on the Pareto frontier (no objective improves without sacrificing another).  
    2. **Symmetry**: If objectives/swapsymmetric and baseline symmetric, solution is symmetric (e.g., \(g_1 = g_2\)).  
    3. **IIA (Independence of Irrelevant Alternatives)**: If you restrict to a subset of models containing the solution, it remains optimal.  
       - *ML gap*: Never tested—assumes consistency across counterfactual model classes.  
    4. **Affine Invariance**: As above; handled via rescaling.

  #### Kalai-Smorodinsky (KS) Solution
  - **Rule**:  
    1. Compute **ideal point** \(I = (\max g_1, \max g_2)\) (best each objective achieves *solo*).  
    2. Draw ray from \((0,0)\) to \(I\).  
    3. Pick the **feasible point furthest along the ray** (i.e., maximize \(\min_i \frac{g_i}{I_i}\)).  
  - **ML Scalarization**: **Min-max fairness** on normalized gains \(\frac{g_i}{I_i}\). Equalizes fractional improvements.  
  - **Axioms in ML Terms**:  
    1. **Pareto Efficiency**: Same as Nash.  
    2. **Symmetry**: Same as Nash.  
    3. **Monotonicity**: If feasible set expands and \(I\) improves for one objective, that objective doesn’t lose.  
       - *ML gap*: Counterfactual—assumes consistency if model class improves.  
    4. **Affine Invariance**: Same as Nash.

  #### Your Concrete Non-Convex Example
  - **Setup**: Gains \((g_1, g_2)\) with \(0 \leq g_i \leq 10\), and \((g_1 > 4) \implies (g_2 \leq 4)\) (L-shaped region).  
    Pareto frontier: segments \((10,4)\) to \((4,4)\) and \((4,4)\) to \((4,10)\).  
    **Problem**: \((4,4)\) is Pareto-*inefficient* (dominated by, e.g., \((10,4)\)).
  - **KS Failure**:  
    - Ideal point \(I = (10, 10)\).  
    - Ray \(g_1 = g_2\) hits feasible set last at \((4,4)\).  
    - **KS picks \((4,4)\)**—violates Pareto efficiency!  
    - *Why?* **Convexity is implicit in KS**. Without it, the ray can hit a dominated point.
  - **Nash Outcome**:  
    - Nash product \(g_1 g_2\). Max at \((10,4)\) and \((4,10)\) (product=40).  
    - **Picks asymmetric solutions** in a symmetric problem (no unique optimum).
  - **Repairing KS for Non-Convexity**:  
    - **Post-hoc Pareto improvement**: From \((4,4)\), move to the frontier—but to which point? \((10,4)\)? \((4,10)\)? \((5,4)\)? No canonical choice.  
    - **Cost**: Breaks KS axioms (monotonicity may not hold) or requires arbitrary tie-breaking. Nash avoids this by directly maximizing on the feasible set.

  #### Statistical Fragility of KS
  - **KS Depends on Ideal Point**: Estimated as coordinate-wise max over validation samples.  
    - **Problem**: Max is biased upward with finite/noisy data (overestimates \(I_i\)).  
    - KS solution \(g_i = \lambda I_i\) becomes over-optimistic (e.g., picks \(\lambda\) too high).  
  - **Nash Uses Only Baseline**: Baseline is easier to estimate (lower variance). Less sensitive to noise.  
  - **Verdict**: KS is **statistically more fragile**—ideal point estimation exacerbates non-convexity issues.

  #### The Residue: What Doesn't Translate
  1. **Counterfactual Feasible Sets (IIA/Monotonicity)**:  
     - Axioms require asking: "If model class were \(\mathcal{M}' \subset \mathcal{M}\), would the solution stay consistent?"  
     - **ML Gap**: We fix one model class/training run. Never test counterfactuals.  
     - *Consequence*: IIA and monotonicity are **unverifiable** in standard ML workflows. Violations (like Nash’s asymmetry) are invisible.

  2. **Disagreement Point Dependence**:  
     - Both Nash and KS require a baseline ("walk away" point).  
     - **ML Gap**: No canonical baseline. Ad-hoc choices (e.g., logistic regression) affect solutions.  
     - *Cardinal Scales for KS*:  
       - KS requires \(I_i\) (ideal point) to define normalized gains \(\frac{g_i}{I_i}\).  
       - **No meaningful zero/unit?** (e.g., invented interpretability score):  
         - Affine invariance \(\implies\) rescaling doesn’t break KS *if baseline and ideal are rescaled too*.  
         - But if the objective lacks cardinal meaning, \(I_i\) is arbitrary—**KS loses justification**.

  3. **Non-Convexity Breaks KS Efficiency**:  
     - As shown, KS can pick dominated points. Nash always picks Pareto-efficient points but may violate symmetry.  
     - **Convexity’s Hidden Role**: KS’s monotonicity axiom assumes convex sets. In ML non-convexity (e.g., deterministic models), KS fails without ad-hoc fixes.

  ### Verdict: What’s Missing in ML Vocabulary
  - **The Axiomatic Debate Isn’t "Thin"**: Econ axioms highlight **consistency across counterfactual scenarios** (IIA/monotonicity), which ML ignores. When model classes change (e.g., new architectures), solutions may shift erratically—Nash isn’t monotonic, KS isn’t efficient.  
  - **ML’s Blind Spots**:  
    - No pressure-testing: "Would this scalarization stick if we added/removed models?"  
    - Baseline arbitrariness undermines gains-based methods.  
    - Non-convexity forces compromises: **Nash > KS here** (efficiency > symmetry, avoids dominated points).  
  - **Practical Recommendation**:  
    - **Use Nash** (proportional fairness) for non-convex sets. More robust to Pareto violations and ideal-point noise.  
    - **Reject KS** for non-convex problems (e.g., your L-shape) unless you convexify (ensembling) or accept post-hoc fixes.  
    - **Always report baseline**: Sensitivity analysis on baseline choice.  

  #### Final Answer to Your Flatmate
  The axiom swap **isn’t superficial**—it surfaces in non-convex ML settings:  
  - Nash ensures efficiency but may break symmetry.  
  - KS ensures monotonicity but breaks efficiency without convexity.  
  - **Neither dominates**; the choice depends on what you value (e.g., efficiency vs. counterfactual stability). In ML, with non-convexity and finite data, Nash’s flaws are easier to manage. The "convention" is thinner in ML because we ignore counterfactuals and baselines, but the axioms reveal real trade-offs.
