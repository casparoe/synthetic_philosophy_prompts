answer: |-
  Here is a rigorous argument for the framing-sensitive interpretation of the White Horse Dialogue, engaging with objections and acknowledging its vulnerabilities:

  **Core Argument: Framing Over Essence**

  1.  **The Paradox:** Gongsun Long's "white horse is not horse" (bái mǎ fēi mǎ) presents a seeming contradiction. The standard essentialist reading resolves this by claiming "white horse" refers to a compound essence (white-horse-ness), distinct from the simple essence (horseness), making them fundamentally different kinds.

  2.  **The Framing Alternative:** The dialogue is better reconstructed as analyzing how *contextual salience* implicitly restricts the extension of a kind term ("horse") within a compound description ("white horse"). Specifically:
      *   When "horse" is used alone, its extension defaults to the *typical, unmarked* instances of the kind within the relevant comparison class (implied to be non-white horses, given their prevalence or cultural norm).
      *   When the contrasting property "white" is made salient (explicitly in "white horse"), this creates a new, restricted frame. Within this frame, the unmodified term "horse" is implicitly understood as referring *only* to the *non-white* horses within the broader kind. "White horse" refers explicitly to white horses.
      *   **Result:** In the salient contrast frame, "horse" (now implicitly meaning *non-white* horse) and "white horse" have mutually exclusive extensions. Hence, "white horse" is correctly said *not* to be (an instance of) "horse" *under this specific, contextually restricted understanding of "horse"*. The essence "horseness" remains constant; what changes is the *implicitly restricted set* the unmodified term points to within the frame.

  3.  **Resolving the Paradox:** The paradox dissolves not because whiteness changes the essence of the horse, but because the *pragmatic function* of the term "horse" shifts based on the salient contrast. "Horse" in isolation and "horse" under the contrast of "white" are pragmatically distinct uses, though semantically linked to the same underlying kind.

  **Defense Against the "Trivial Ambiguity" Objection**

  The objection: This interpretation renders the dialogue trivial, merely highlighting a common case of word ambiguity ("horse" meaning all horses vs. "horse" meaning non-white horses).

  *   **Response 1: Pragmatic Restriction vs. Lexical Ambiguity:** This is not lexical ambiguity (like "bank" meaning river edge or financial institution). It's a systematic, *pragmatic* phenomenon of contextual restriction based on conversational salience and relevance. The core meaning ("horseness") remains stable; the extension is narrowed *implicitly* by the discourse context. The dialogue highlights a fundamental mechanism of language use, not an accidental homonymy.
  *   **Response 2: Philosophical Weight of Pragmatics:** For the School of Names (Míngjiā), obsessed with the precise relationship between names (míng 名) and realities (shí 實), understanding *how context shapes the referential scope of names* is profoundly significant. It reveals that the "reality" a name picks out isn't fixed solely by the word itself, but is dynamically co-determined by the discursive frame. This makes the connection between name and reality inherently context-sensitive and complex.
  *   **Response 3: Non-Trivial Consequence:** Recognizing this mechanism has non-trivial consequences. If "horse" *can* implicitly exclude white horses when white is salient, it demonstrates that kind terms are not rigid designators of an essential set but flexible tools whose reference is negotiated in discourse. This directly challenges a naive essentialist view of naming and categorization.

  **Why Framing is Weightier than Essentialism for the School of Names**

  1.  **Broader Concerns:** The School's core project was diagnosing and rectifying the "rectification of names" (zhèngmíng 正名) – ensuring names accurately correspond to realities to prevent social disorder. An essentialist reading of WHD offers a static ontology: distinct essences exist. A framing-sensitive reading directly addresses their central *epistemological and linguistic* concern: *how do names actually function in discourse to pick out realities, and how can this process go wrong?*
  2.  **Linguistic Mechanism:** Framing exposes a powerful, implicit linguistic mechanism governing reference. It shows that the "reality" corresponding to a name like "horse" is not monolithic but is *partitioned* by contextual parameters (like salient contrast). This is a deep insight into the pragmatics of reference, highly relevant to their investigations into paradox, argumentation, and the stability of meaning.
  3.  **Dynamic vs. Static:** Essentialism provides a static metaphysical distinction. Framing offers a dynamic account of *how semantic content is generated in communication*. This dynamic view aligns better with other School of Names fragments exploring relativity, perspective, and the dependence of assertions on context (e.g., discussions of "hard/white" or "pointing to things").
  4.  **Explanatory Scope:** The framing account can elegantly explain other puzzling claims within the WHD and related texts (e.g., why "horse" includes yellow/black horses but "white horse" excludes them in the contrastive context) purely through shifting implicit restrictions, without multiplying essences.

  **Acknowledged Weaknesses and Potential Falsifiers**

  1.  **Weakness 1: Textual Explicitness:** The primary weakness is the *implicit* nature of the proposed pragmatic restriction. The dialogue does not explicitly state that "horse" *means* non-white horse in the contrastive context; it must be inferred from the argument's structure and the resulting paradox. An essentialist reading can claim direct support from the assertion of distinct "forms" (xíng 形).
  2.  **Weakness 2: Alternative "Markedness" Readings:** While "non-white" is a plausible default restriction, the specific property excluded might be context-dependent. The argument assumes "white" is the marked property triggering the restriction, but the text doesn't definitively prove this is the *only* or *necessary* mechanism (could it work with any contrasting property?).
  3.  **Weakness 3: Historical Linguistic Evidence:** The argument assumes that kind terms in Classical Chinese *could* and *did* function with this kind of pragmatic restriction. While plausible given cross-linguistic ubiquity, explicit historical linguistic evidence demonstrating this specific mechanism operating uncontroversially in contemporary texts would strengthen the case considerably.

  **Potential Falsifiers (What Would Force Abandonment):**

  1.  **Definitive Ontological Language:** Discovery of contemporaneous texts or unambiguous passages within the WHD itself where Gongsun Long (or immediate commentators) explicitly *denies* that context is the issue and instead *asserts* that the compound term creates a fundamentally new, distinct *essence* or *entity* ("white-horse-ness") ontologically separate from "horseness," using unambiguous metaphysical terminology not compatible with pragmatic restriction.
  2.  **Evidence of Rigid Designation:** Demonstration through rigorous analysis of Warring States period philosophical or common language that kind terms like "horse" were consistently used *without* pragmatic restriction, functioning as rigid designators for the entire kind regardless of context, in a way incompatible with the proposed implicit parameter. If every use of "horse" demonstrably included *all* horses without exception in all contexts, the framing account collapses.
  3.  **Authorial Intent:** Discovery of compelling historical evidence (e.g., reliable commentaries directly from the School of Names) explicitly stating that the intended point of the dialogue was metaphysical (about distinct essences/entities) and *not* linguistic/pragmatic (about contextually shifting reference).

  **Conclusion:**

  Reconstructing the White Horse Dialogue as an analysis of implicit framing parameters restricting kind term extensions offers a more coherent, philosophically weightier, and textually viable interpretation than the essentialist reading. It resolves the paradox through a fundamental pragmatic mechanism of language (contextual restriction), directly engages the School of Names' core concern with the dynamic relationship between names and realities in discourse, and avoids the ontological profligacy of multiplying essences. While the essentialist reading might seem superficially supported by the dialogue's bold assertion, the framing account provides a deeper explanation for *why* the assertion holds in the specific context, aligning with the School's broader linguistic and epistemological preoccupations. The interpretation's main vulnerability lies in the implicitness of the proposed mechanism, but it gains strength from its explanatory power and resonance with the Mingjia's known interests. Evidence demonstrating rigid, context-insensitive designation of kind terms or explicit authorial commitment to a purely ontological distinction would necessitate abandoning this interpretation.
