prompt: |-
  I was appointed three months ago to the board of trustees of a mid-sized charitable foundation in the Midlands, and I now chair the quarterly grants panel. We have begun receiving an increasing number of proposals that frame themselves through effective altruist reasoning: cost-effectiveness analyses, long-termist projections, promises of deferred giving via high-earning careers, and demands that we fund only what can be measured against a quantitative welfare metric. I need a reusable decision procedure—ordered questions, sufficient-answer conditions, clear stopping points, and explicit hand-offs to value judgement—that my panel (none of us philosophers, all with legal or sector backgrounds) can actually run in a ninety-minute session without outsourcing the reasoning to outside experts. The procedure must operationalise three specific conceptual pressures: the institutional critique (whether accepting the proposal reshapes our charitable mission or creates capture), the earning-to-give objection (whether the proposal defers moral obligation into a speculative future income stream), and measurability bias (whether goods that resist quantification are being systematically excluded not because they lack value but because they lack metrics). For each step, specify what counts as a sufficient answer, where the procedure terminates in rejection, where it terminates in approval, and where it must flag that the remaining disagreement is one of values rather than facts; also flag the points where the procedure is likely to misfire or produce an answer the panel will dislike. Then apply the procedure to two concrete proposals: first, a £200,000 request to fund mass deworming in East Africa, supported by a published cost-effectiveness estimate of approximately thirty pounds per DALY averted and a condition that our foundation’s branding appear on all programme materials; second, a £50,000 seed request from a local community theatre collective whose founders propose taking corporate finance roles for five years, donating half their earnings back to the collective, arguing this maximises long-term social value through an “earn to give” pathway, but whose artistic work produces no quantifiable welfare metric whatsoever. Please write the answer in British English, keep the tone formal and suitable for a board document, avoid bibliographies or citation requests, and be explicit about what the procedure cannot settle.
reasoning: |-
  We are designing a decision procedure for the grants panel that addresses three conceptual pressures: institutional critique, earning-to-give objection, and measurability bias. The procedure must be executable in a 90-minute session by non-philosophers, with clear steps, sufficient-answer conditions, stopping points, and hand-offs to value judgments.

  The procedure will have the following steps:

  1. **Mission Alignment Check**
     - **Question:** Does the proposal align with the foundation's charitable mission as stated in our governing documents?
     - **Sufficient Answer:** The proposal must demonstrate a clear and direct link to at least one of the foundation's stated charitable objectives. If the link is indirect, the proposal must explain the causal pathway.
     - **Termination Conditions:**
       - Reject if the proposal falls entirely outside the mission.
       - Approval is not granted at this step; proceed to next step if aligned.
     - **Hand-off to Values:** If the panel disagrees on whether the proposal is within the mission, the disagreement is one of interpretation of the foundation's values and should be resolved by a vote.
     - **Potential Misfire:** A proposal that stretches the mission might be approved too readily, or a novel approach that fits the mission might be rejected due to conservative interpretation.

  2. **Institutional Critique Assessment**
     - **Question:** Would accepting this proposal risk reshaping our charitable mission in ways that might lead to capture (e.g., by a particular ideology, method, or donor) or undermine our independence?
     - **Sufficient Answer:** The panel must consider:
       - Whether the proposal explicitly or implicitly requires the foundation to adopt new priorities or methods that are not currently part of our mission.
       - Whether the proposal comes with conditions (e.g., branding requirements) that might compromise the foundation's independence or public perception.
       - The scale of the request relative to our budget and the potential for repeated similar requests.
     - **Termination Conditions:**
       - Reject if the panel, by majority, determines that the proposal poses a high risk of mission capture or loss of independence.
       - Proceed if risks are low or can be mitigated (e.g., by negotiating conditions).
     - **Hand-off to Values:** Disagreements about the level of acceptable risk to institutional independence are value-based and should be resolved by vote.
     - **Potential Misfire:** Overly cautious rejection of innovative proposals, or under-appreciation of subtle capture risks.

  3. **Earning-to-Give Objection Review**
     - **Question:** Does the proposal defer moral obligation into a speculative future income stream? Specifically, does it rely on future earnings that are uncertain and, if so, is the deferral justified by a compelling argument for greater long-term impact?
     - **Sufficient Answer:** The panel must assess:
       - The credibility of the future income stream (e.g., the track record of the individuals, the stability of the industry they plan to enter, the feasibility of their earning projections).
       - The existence of a clear and binding commitment to donate (e.g., legal agreements, escrow accounts, or strong track record).
       - The opportunity cost: what would happen if the foundation does not fund the proposal? Would the applicants pursue the high-earning path anyway?
     - **Termination Conditions:**
       - Reject if the future income stream is deemed too speculative and the opportunity cost argument is weak.
       - Approval is not granted at this step; proceed if the objection is overcome.
     - **Hand-off to Values:** Disagreements about the acceptability of deferral (even if the income stream is credible) are value-based (e.g., whether we should fund present needs vs. future potential) and should be resolved by vote.
     - **Potential Misfire:** Over-reliance on optimistic financial projections, or undervaluing the moral urgency of present needs.

  4. **Measurability Bias Evaluation**
     - **Question:** Does the proposal exclude or undervalue goods that resist quantification, and if so, is there a qualitative case for their value that the panel finds compelling?
     - **Sufficient Answer:** The panel must:
       - Identify the quantifiable metrics provided (if any) and note what they measure and what they might miss.
       - Consider qualitative evidence (e.g., testimonies, case studies, expert opinions) that supports the value of the non-quantifiable aspects.
       - Assess whether the proposal's failure to provide quantitative metrics is due to the inherent nature of the goods (e.g., arts, community building) or to poor evaluation design.
     - **Termination Conditions:**
       - Reject if the panel finds that the proposal fails to make a compelling case for the value of non-quantifiable goods and the proposal does not provide any alternative form of accountability.
       - Proceed if the panel is satisfied that the qualitative case is strong.
     - **Hand-off to Values:** Disagreements about the relative weight of quantifiable vs. non-quantifiable goods are value-based and should be resolved by vote.
     - **Potential Misfire:** Overvaluation of quantifiable outcomes leading to rejection of inherently unmeasurable but valuable work, or the opposite: funding proposals with no accountability.

  5. **Cost-Effectiveness and Impact Assessment**
     - **Question:** Where quantifiable metrics exist, how does the cost-effectiveness of this proposal compare to other opportunities we have funded or are considering?
     - **Sufficient Answer:** The panel must compare the cost-effectiveness (if available) to a benchmark of typical grants (e.g., average cost per outcome in similar areas). If the proposal is not quantifiable, skip to step 6.
     - **Termination Conditions:**
       - Reject if the cost-effectiveness is significantly below our benchmark and the proposal does not have strong qualitative justification (from step 4) to override this.
       - Proceed if the cost-effectiveness is at or above benchmark, or if the qualitative case overrides.
     - **Hand-off to Values:** The panel must decide what level of cost-effectiveness is acceptable, especially when comparing quantifiable and non-quantifiable proposals. This is a value judgment and should be resolved by vote.
     - **Potential Misfire:** Overemphasis on cost-effectiveness leading to rejection of high-impact but less quantifiable work, or undervaluation of cost-effectiveness in quantifiable proposals.

  6. **Overall Value Judgment and Risk Assessment**
     - **Question:** Considering all the above, does the proposal represent a compelling use of our funds, balancing quantitative and qualitative factors, immediate and long-term impacts, and institutional risks?
     - **Sufficient Answer:** The panel must weigh the evidence from the previous steps and make a holistic judgment. This step should include a discussion of the proposal's uniqueness, the potential for learning, and the reputation of the applicant.
     - **Termination Conditions:**
       - Approval if the panel, by majority, agrees that the benefits outweigh the risks and the proposal is among the best uses of our funds at this time.
       - Reject if the panel does not reach a majority for approval.
     - **Hand-off to Values:** This step is inherently value-laden and requires a vote.
     - **Potential Misfire:** Groupthink, or failure to properly balance the various factors.

  **Procedure Limitations:**
  - The procedure cannot resolve fundamental value disagreements among panel members; these must be settled by vote.
  - It cannot predict the future, so assessments of risk (especially in earning-to-give) are necessarily speculative.
  - It cannot create metrics for inherently unmeasurable goods; it can only rely on the panel's collective judgment of qualitative evidence.

  ---

  **Application to Proposals:**

  **Proposal 1: Mass Deworming in East Africa (£200,000)**
  - **Step 1: Mission Alignment Check**
    - Assuming the foundation's mission includes global health or poverty alleviation, the proposal aligns. **Proceed.**
  - **Step 2: Institutional Critique Assessment**
    - The branding condition requires our foundation's logo on materials. This may be acceptable, but we must consider: Does it risk associating us with a programme that might have controversies (e.g., about deworming efficacy)? Also, the scale is large. We should assess if this might set a precedent for future health interventions at the expense of other areas. 
      - *Sufficient Answer:* If the branding is non-intrusive and we are comfortable with the association, and if the panel feels this won't lead to mission drift, then proceed. 
      - **Flag:** If there is disagreement about the branding, it's a value issue. 
      - *Termination:* Reject only if the panel feels the branding condition is unacceptable or the risk of mission capture is high. Otherwise, proceed.
  - **Step 3: Earning-to-Give Objection Review**
    - Not applicable (no earning-to-give element). **Proceed.**
  - **Step 4: Measurability Bias Evaluation**
    - The proposal provides a quantifiable metric (£30 per DALY). We must consider if DALYs capture the full value of deworming (e.g., education benefits, long-term economic gains). The metric is strong, but we should note that it might not capture community-level effects. 
      - *Sufficient Answer:* The quantitative case is strong, and the proposal does not exclude unquantifiable goods because deworming is primarily a health intervention. 
      - **Proceed.**
  - **Step 5: Cost-Effectiveness and Impact Assessment**
    - £30 per DALY is considered highly cost-effective in global health. Compare to our benchmark: if we have funded health interventions at, say, £50-£100 per DALY, this is better. 
      - *Termination:* Approve on cost-effectiveness grounds, unless we have reason to doubt the estimate (e.g., the study is contested). 
      - **Proceed to step 6.**
  - **Step 6: Overall Value Judgment**
    - The proposal is strong on cost-effectiveness and alignment. The main risks are institutional (branding) and potential controversy around deworming evidence. If the panel is comfortable with these, **approve**.

  **Proposal 2: Community Theatre Collective (£50,000 seed request with earn-to-give plan)**
  - **Step 1: Mission Alignment Check**
    - If the foundation's mission includes arts and culture or community development, it aligns. **Proceed.**
  - **Step 2: Institutional Critique Assessment**
    - No immediate institutional risks (no branding condition). **Proceed.**
  - **Step 3: Earning-to-Give Objection Review**
    - The proposal relies on founders taking corporate finance roles and donating half their earnings in five years. 
      - *Credibility:* Are the founders likely to get these roles? Do they have relevant backgrounds? What is the plan if they don't? Without binding commitments, the future donations are speculative. 
      - *Opportunity Cost:* Would the founders pursue corporate careers anyway? If so, the seed funding might not change their path. If not, then the foundation's funding is enabling a future income stream. 
      - *Sufficient Answer:* If the panel finds the income stream too speculative and the opportunity cost argument weak, reject. Otherwise, proceed. 
      - **Flag:** This is a critical step. If the panel is split, it becomes a value judgment about the acceptability of deferral. 
      - *Termination:* Reject if deemed too speculative. Otherwise, proceed.
  - **Step 4: Measurability Bias Evaluation**
    - The artistic work produces no quantifiable welfare metric. The panel must evaluate the qualitative case: 
      - What is the collective's track record? 
      - What community benefits do they claim (e.g., social cohesion, youth engagement)? 
      - Are there testimonials or case studies? 
      - *Sufficient Answer:* If the panel finds the qualitative case compelling (e.g., they have strong local support and demonstrated impact), proceed. Otherwise, reject. 
      - **Hand-off to Values:** The weight given to non-quantifiable arts impact is a value judgment.
  - **Step 5: Cost-Effectiveness and Impact Assessment**
    - Not applicable because there are no quantifiable metrics. Skip to step 6.
  - **Step 6: Overall Value Judgment**
    - Weigh the speculative future donations against the immediate seed need and the qualitative arts impact. The panel must decide if the potential long-term social value (via both the arts and future donations) outweighs the risks. 
    - **Decision:** If the panel is convinced by the qualitative impact and the earning-to-give plan is credible, approve. Otherwise, reject.

  **Final Note:** The procedure is designed to structure the discussion and ensure key issues are considered, but the panel must use its collective judgment and vote when values are in conflict.
answer: |-
  ### Decision Procedure for Grants Panel: Addressing EA-Influenced Proposals  
  **Purpose:** To evaluate grant proposals influenced by effective altruist (EA) reasoning while safeguarding against institutional capture, speculative deferral of obligations, and measurability bias. Designed for non-philosophers to execute within 90 minutes.  

  #### Procedure Structure  
  Six sequential steps. Each step requires unanimous agreement on "sufficient answers" to proceed. If unresolved, the panel votes (simple majority) to terminate (reject) or flag for value-based disagreement. Steps 1–5 are fact-based; Step 6 is explicitly value-driven.  

  **Key Definitions:**  
  - **Sufficient Answer:** Evidence or reasoning that resolves the step’s core question to the panel’s consensus.  
  - **Terminate in Rejection:** Proposal fails the step’s criteria; no further steps.  
  - **Terminate in Approval:** Proposal meets all steps without unresolved risks; approve.  
  - **Flag for Values:** Disagreement persists due to divergent priorities, not factual gaps. Proceed to Step 6.  
  - **Likely Misfires:** Steps may undervalue non-Western epistemologies, over-index on short-term risks, or favour quantifiable outcomes.  

  ---

  ### Step-by-Step Procedure  
  #### **Step 1: Mission Fidelity Check**  
  **Question:** *Does the proposal directly advance at least one core objective in our foundation’s governing documents?*  
  - **Sufficient Answer:** Proposal cites specific clauses from our charter and demonstrates a causal link to outcomes.  
  - **Terminate in Rejection:** If no alignment exists.  
  - **Terminate in Approval:** Not applicable (proceed).  
  - **Flag for Values:** If alignment is contested due to ambiguous charter language.  
  - **Likely Misfire:** Overly literal interpretation may exclude innovative approaches aligned with spirit but not letter of mission.  

  #### **Step 2: Institutional Critique Assessment**  
  **Question:** *Could accepting this proposal reshape our mission, create ideological capture, or compromise independence (e.g., via donor conditions)?*  
  - **Sufficient Answer:** Analysis shows (a) no conditions that cede strategic control, (b) no disproportionate influence from EA-aligned actors, and (c) consistency with existing grant portfolios.  
  - **Terminate in Rejection:** If branding/conditions risk mission distortion (e.g., requiring adoption of EA metrics as standard).  
  - **Terminate in Approval:** If risks are negligible and mitigable (e.g., branding is incidental).  
  - **Flag for Values:** If risks exist but panel disagrees on tolerability.  
  - **Likely Misfire:** Underestimating long-term capture risks from repeated EA-funded projects.  

  #### **Step 3: Earning-to-Give Objection Review**  
  **Question:** *Does the proposal defer moral obligation to a speculative future income stream without sufficient safeguards?*  
  - **Sufficient Answer:** Evidence that (a) future earnings are highly probable (e.g., funded roles in high-employment sectors), (b) enforceable commitments bind income pledges (e.g., legal agreements), and (c) no superior near-term alternatives exist.  
  - **Terminate in Rejection:** If income stream is improbable (e.g., no track record in target sector) or commitments are unenforceable.  
  - **Terminate in Approval:** If all criteria are met.  
  - **Flag for Values:** If earnings are probable but panel disagrees on moral acceptability of deferral.  
  - **Likely Misfire:** Overweighting individual potential while neglecting systemic barriers (e.g., labour-market discrimination).  

  #### **Step 4: Measurability Bias Evaluation**  
  **Question:** *Are non-quantifiable goods excluded due to metric limitations rather than lack of value?*  
  - **Sufficient Answer:** Proposal either (a) provides robust quantitative metrics without excluding material qualitative goods, or (b) justifies non-quantifiable value via peer-recognised evidence (e.g., case studies, expert testimonials).  
  - **Terminate in Rejection:** If key outcomes are ignored due to measurability bias, and no qualitative case is made.  
  - **Terminate in Approval:** If quantifiable metrics are comprehensive or qualitative case is credible.  
  - **Flag for Values:** If disagreement persists on the weight of quantifiable vs. qualitative evidence.  
  - **Likely Misfire:** Dismissing qualitative evidence from marginalised communities as "anecdotal."  

  #### **Step 5: Cost-Effectiveness Scrutiny**  
  **Question (if quantifiable):** *Is the cost-effectiveness claim plausible and contextually appropriate?*  
  **Question (if unquantifiable):** *Is the resource request proportionate to the scale of expected impact?*  
  - **Sufficient Answer:** (a) For quantifiable claims: methodology aligns with sector standards (e.g., WHO for health); (b) For unquantifiable: budget is reasonable given analogous initiatives.  
  - **Terminate in Rejection:** If quantifiable claims are methodologically flawed (e.g., ignoring local costs) or unquantifiable requests lack proportionality (e.g., £50,000 for untested micro-project).  
  - **Terminate in Approval:** Not applicable (proceed).  
  - **Flag for Values:** If cost-effectiveness is valid but panel prioritises other factors (e.g., equity).  
  - **Likely Misfire:** Accepting high cost-effectiveness in quantifiable proposals while rejecting high-impact unquantifiable ones.  

  #### **Step 6: Holistic Value Judgment**  
  **Question:** *Balancing all assessments, does this proposal merit funding given our foundation’s role in the Midlands ecosystem?*  
  - **Sufficient Answer:** Panel vote (majority) based on:  
    - Urgency of need.  
    - Distinctiveness of impact.  
    - Alignment with community priorities (e.g., local consultations).  
  - **Terminate in Approval:** Majority supports.  
  - **Terminate in Rejection:** Majority opposes.  
  - **Flag for Values:** All disagreements here are value-based; external arbitration is beyond the procedure’s scope.  
  - **Likely Misfire:** Dominant voices overriding minority perspectives; requires chair to ensure equitable debate.  

  **Procedure Limitations:**  
  - Cannot resolve deep value conflicts (e.g., "long-termism vs. immediacy").  
  - Cannot validate technical claims without external experts (flag at Step 5 if needed).  
  - Assumes panel familiarity with foundation charter; review pre-meeting if not.  

  ---

  ### Application to Concrete Proposals  
  #### **Proposal 1: Mass Deworming in East Africa (£200,000)**  
  - **Step 1:** Aligns if foundation mission includes global health. *Sufficient*. Proceed.  
  - **Step 2:** Branding condition risks institutional capture if EA framing dominates materials. *Insufficient answer*. Flag for Values (disagreement likely on reputational risk tolerance).  
  - **Step 3:** No earning-to-give element. *Sufficient*. Proceed.  
  - **Step 4:** DALY metric robust but may exclude qualitative goods (e.g., education engagement). *Sufficient* if panel accepts health focus. Proceed.  
  - **Step 5:** £30/DALY credible per WHO standards. *Sufficient*. Proceed.  
  - **Step 6:** Value judgment on branding risk vs. high cost-effectiveness. *Panel vote required*.  

  **Outcome:** Likely approval if branding is negotiable; rejection if branding forces EA alignment. **Misfire Warning:** May undervalue local ownership if branding displaces community voices.  

  #### **Proposal 2: Community Theatre Collective (£50,000 seed funding)**  
  - **Step 1:** Aligns if mission includes arts/community development. *Sufficient*. Proceed.  
  - **Step 2:** No capture risks identified. *Sufficient*. Proceed.  
  - **Step 3:** Earning-to-give plan defers obligation; corporate roles probable but no enforceable pledges. *Insufficient*. Terminate in Rejection (high speculation).  
  - **Steps 4–6:** Not reached.  

  **Outcome:** Rejection at Step 3 due to unmitigated deferral risk. **Misfire Warning:** May overlook collective’s local impact if panel over-indexes on financial speculation.  

  ---

  **Chair’s Guidance:**  
  - Allocate 15 minutes per step.  
  - Document rationales for flagged steps to inform future reviews.  
  - Procedure clarifies *why* disagreements arise (fact vs. values) but cannot reconcile incompatible ethics.  
  - **Final Note:** This framework operationalises critique but cannot replace contextual wisdom—the panel must retain agency to override steps if new evidence emerges mid-session.  

  ---  
  *Approved by Grants Panel Chair, [Date]*  
  *The Midlands Charitable Foundation*
