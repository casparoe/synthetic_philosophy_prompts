  hey can you help me draft a short reasearch proposel? I'm pitching a 6-month philosophy-of-medicine micro-grant and I want it to actually do conceptual work, not just summarize old debates. Before writing, please think carefully and do a quick brainstorm: what are the three strongest objections to applying Szasz's myth-of-mental-illness argument against modern dimensional trait models?

