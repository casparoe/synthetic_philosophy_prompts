  Alright, council members, honoured guests from Poland, my mates at the back trying not to fall asleep – cheers for having me. Seriously, standing here talking about our town twinning with [Name of Polish Town/City] is **properly cool**. It feels big, you know? Connecting across borders, sharing stories, maybe even swapping tips on the best places for a decent pierogi or a bacon bap.  

  But honestly? It also feels like the *exact* right moment to talk about something that’s been buzzing around town lately. Bit awkward maybe, but stick with me. You've probably heard – our council just voted to spend £2 million on a new skatepark here. Awesome for me and my mates, right? Ramps, rails, no more dodging security at the Tesco carpark.  

  *But.* That money *could* have gone to help people hit by floods somewhere else in the world. And that’s sparked a right barney. Are we wrong to spend it here? Do we owe more to the people living down the road just ‘cos they’re… well, down the road? Is looking after your own just a fancy way of being selfish? My debate club last week called nationalism "extended egoism". Bit harsh, yeah?  

  So, here’s my messy 16-year-old brain trying to figure it out for this speech:  

  It’s not as simple as local *or* global. Like, **of course** borders matter. They shape where we live, the rules we follow, the people we share our streets and schools with every single day. That shared space, that shared life? It *does* create a bond, a responsibility. You can't just ignore that. Fixing the pothole outside your nan’s house *feels* different than fixing one a thousand miles away, even if both need doing. It’s about the community you’re literally part of. Building that skatepark *is* about looking after our own patch, making life better for people here. It’s tangible, it’s immediate. Calling that pure "egoism" misses the point – it’s about shared responsibility, right where we are.  

  **But!** And it’s a big BUT... (no laughing at the back). That responsibility *here* doesn’t magically erase our responsibility *out there*. It doesn’t mean the flood victims don’t matter, or that their suffering is less real. Cosmopolitanism – that idea that we’re all citizens of the world – isn’t some airy-fairy nonsense. It’s recognising that a person’s worth isn’t defined by which side of a line on a map they were born. Their pain hurts just as much. Their need is just as urgent.  

  So, where does that leave us? Especially today, celebrating this link with Poland?  

  For me, it’s about **layers**. Like an onion. Or maybe a really good cake. You’ve got your local layer – looking after your neighbours, building the skatepark, fixing the local issues. That’s solid, necessary ground. Then you build outwards. That’s what twinning is! It’s us saying, "Yeah, our town matters, *and* your town in Poland matters too." We’re deliberately reaching over that border, creating a new layer of connection and responsibility. We’re choosing to see you, our Polish friends, not just as "people over there," but as partners. People we share something with.  

  Spending on the skatepark *isn’t* saying "Sod everyone else." It’s building our home base *so* we can be stronger partners. A thriving local community, where people feel looked after, is *more* likely to have the energy, the resources, and the open heart to look further afield. It’s not either/or. It’s about doing both, as best we can, understanding that sometimes the immediate need is right here, and sometimes it’s a world away.  

  Celebrating this twinning today proves we get that. It proves our town isn’t just hunkered down in some selfish bubble. We’re reaching out. We’re building bridges, not just skate ramps. We’re saying Polish lives, Polish culture, Polish friendship matters deeply to us. That connection *itself* pushes back against the idea that caring stops at the border.  

  So, to our brilliant guests from [Name of Polish Town/City] – a massive, heartfelt *witamy*! We’re genuinely buzzing to have you here. This partnership isn’t just a plaque or a flag; it’s us choosing to add that extra layer, to extend our sense of community to include you.  

  And to everyone else? Maybe the skatepark debate is a bit mad, yeah. But hopefully this twinning shows what we’re *really* about: building a strong, caring home *and* reaching out a hand in friendship across the miles. Because in the end, whether it’s shredding the new concrete park or standing in solidarity with friends facing floods, it’s all about recognising the value in people. Starting close to home, but definately not stopping there.  

  Cheers! Let’s make this partnership awesome.
