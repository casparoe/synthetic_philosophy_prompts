  hey, i need a speech for saturday's welcome ceremony for our town's twinning with a place in poland. im 16 and our council just voted to spend £2m on a local skatepark instead of flood relief abroad, so people are fighting over whether we actually owe more to compatriots just because they live near us. the crowd will be councillors, the polish delegates, and my mates who'll switch off if i sound like a textbook. i want the philosphy about special claims to compatriots vs cosmopolitanism to actually shape the speech - like i cant pretend borders dont matter, but i also cant act like the guests are less important. please write it in british english, keep it casual and like im really talking, maybe with a typo or two, and definately dont put in any citations or reading lists. also our debate club called nationalism "extended egoism" last week and i wanna push back on that gently without being a jerk. thanks!
