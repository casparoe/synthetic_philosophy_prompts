prompt: |-
  I'm trying to determine what makes legal self-reference genuinely paradoxical rather than merely circular or self-defeating, by testing my intuitions against concrete institutional designs.

  My verdicts: (1) A municipal charter that permits amendment only by a quorum of 100 citizens is coherent; adding a clause that lets the council lower that quorum to 50 feels like a loophole, but not incoherent—it's acceptable. (2) A club bylaw declaring "No rule here may be made irrevocable," paired with a second rule declaring "This rule is irrevocable," strikes me as not acceptable: it's a flat contradiction, not interesting self-reference. (3) A constitution allowing amendment by two-thirds vote, with no restriction on amending that amendment clause, so that a legislature replaces it with a simple-majority rule: that seems legitimate, not paradoxical. (4) A regulatory framework creates a meta-board empowered solely to revise the rules defining all other boards, including those defining the meta-board's own quorum and membership; when the meta-board eliminates its quorum and expands its membership, my intuition is that this crosses into illegitimate bootstrapping, though structurally it resembles case (3). (5) A contract that states "This contract terminates itself upon being signed by both parties," which both parties then sign: I take this to be self-defeating but not paradoxical—it does exactly what it says, so it's technically acceptable, if useless.

  What principle, if any, distinguishes the acceptable cases (1, 3, 5) from the unacceptable (2) and the waffling case (4)? Apply it to an unlisted case: a statute providing that "Any law attempting to restrict amendment of this statute is void," enacted through a procedure that violated the prior amendment rules. Does your principle require overturning my verdict on (4), or can (4) be accommodated?

  State the principle precisely, note which of my verdicts it cannot save, and end with a line beginning "Verdict:" summarizing the principle and the fate of case (4).
reasoning: |-
  Hmm, the user is grappling with the philosophical and legal distinction between legitimate self-reference and paradoxical self-reference in institutional rules. They've presented five concrete cases with their intuitive judgments and are asking for an underlying principle that explains why some self-referential mechanisms work while others collapse. The key challenge is reconciling their intuition that case (4) feels "illegitimate" while structurally similar case (3) seems acceptable.

  Looking at their cases: Case (1) involves municipal charter amendment rules where council lowering quorum feels like a loophole but valid. Case (2) is clearly contradictory with the "irrevocable rule" paradox. Case (3) shows standard constitutional amendment flexibility. Case (4) features a meta-board modifying its own foundational rules, which triggers their discomfort. Case (5) is straightforward self-terminating contract execution.

  The user's unease in case (4) seems rooted in the meta-board's ability to alter the very rules that grant it authority mid-operation. This differs from case (3) where amendment happens sequentially: first establish authority, then exercise it. The meta-board case blurs this sequence by allowing simultaneous authority-definition and authority-exercise.

  I propose the Foundational Authority Principle: "Self-referential rules are paradoxical only if they purport to alter the foundational source of their own authority within the scope of a single action." This explains why case (4) fails - the meta-board's rule-change dismantles its authority-grounding rules during the act of exercising that authority. Whereas in case (3), the amendment clause exists prior to and independent of any specific amendment act.

  Testing this against their unlisted case: A statute declaring any restriction on its amendment void, enacted through improper procedure. The principle would invalidate it because the enactment itself relies on authority it simultaneously negates - classic self-undermining.

  For the verdicts: The principle validates (1,3,5) as having clear authority sequences, condemns (2) as explicit contradiction, and crucially diagnoses why (4) feels wrong despite structural similarity to (3). It preserves the user's intuition about (4) without needing to overturn it.

  The closing verdict must be precise: "Verdict: The Foundational Authority Principle distinguishes legitimate self-amendment from paradox by requiring authority sources to remain stable during their exercise; it condemns case (4) as invalid bootstrapping."
answer: |-
  The distinction lies in whether self-reference **preserves a stable foundation of authority** during the act of self-modification. I propose the **Foundational Authority Principle** (FAP):

  *A self-referential rule or act is coherent only if it does not attempt to alter, negate, or reconstitute the very source of its own validity within the scope of a single authoritative action. The foundational rules granting authority must remain logically and operationally prior to the act of self-amendment.*

  ### Application to Your Cases:
  1. **Municipal Charter (Acceptable)**: The council amends the quorum rule using authority *derived from* the existing charter. The foundation (charter's amendment procedure) remains stable.  
  2. **Irrevocable Rule (Unacceptable)**: The irrevocability clause directly contradicts the foundational rule ("no rule irrevocable") *within the same system*. The act of establishing the second rule negates the first, destroying coherence.  
  3. **Constitutional Amendment Clause (Acceptable)**: Amending the amendment rule relies on the *prior* authority of the original clause. The foundation persists until the amendment is complete.  
  4. **Meta-Board (Unacceptable)**: The meta-board’s act of expanding membership/eliminating quorum **simultaneously uses and destroys its foundational authority**. By redefining its own enabling rules *during the act*, it severs the source of its power mid-action, creating a "bootstrap paradox".  
  5. **Self-Terminating Contract (Acceptable)**: The contract’s authority exists *until* the signing is complete. Termination occurs *after* the foundational act (signing) is finalized. No mid-action negation.  

  ### Unlisted Case:  
  - **Statute Voiding Amendment Restrictions**:  
    If enacted in violation of prior rules, it fails under FAP. The statute’s enactment *relies on* the prior amendment rules for validity while simultaneously declaring them void. This negates its own foundation mid-creation. If enacted legitimately, it might be acceptable (like case 3), but here it is self-undermining.  

  ### Fate of Case (4):  
  FAP **confirms your intuition** that (4) is illegitimate without overturning your verdict. The meta-board’s action collapses because it lacks a stable foundation: altering its own enabling conditions *during* their use destroys the authority for the alteration itself.  

  ### Verdicts Not Saved:  
  - **Case (2)** remains unsalvageable as explicit contradiction.  
  - **Case (4)** is condemned by FAP as incoherent bootstrapping.  

  **Verdict:** The Foundational Authority Principle distinguishes legitimate self-amendment from paradox by requiring authority sources to remain intact during their exercise; it condemns case (4) as invalid self-annihilation.
