prompt: |-
  Something's been eating at me for a few months and I'd like help figuring out what rule I actually use, because my own gut reactions don't seem to match any of the rules I hear people state.

  I'm talking about when it's okay to state something as a fact—flat out, no hedging—and when you should've said "I think" or "probably" or just kept quiet. I'm setting aside actual lying, since in every case that follows the person believed what they said. By "wrong" I don't mean wicked; I mean something off about the saying itself, even if nobody gets hurt. I've since found out the people who study this call it something like the norm of assertion, but I want the rule built from my cases, not from a label.

  My gut calls:

  My uncle once announced to a bunch of people at the track that a longshot horse was going to win. He had no inside info, just a feeling, and he said it like it was a sure thing. The horse won. I still think he shouldn't have said it the way he did, even though he turned out to be right.

  My coworker told a client the meeting was at 2, because that's what our shared calendar said. The calendar hadn't been updated and the meeting was actually at 3. I can't bring myself to say she did anything wrong, even though what she said was false.

  A couple years ago I told my neighbor their cat was in my yard, because I could see a cat through the fence that looked exactly like theirs. It turns out the cat I was looking at was a nearly identical cat from two doors down. But their cat really was in my yard, hidden behind the shed. So what I said was true, and I had what looked like a perfectly good basis for saying it, and I still came away feeling like I shouldn't have said it.

  My friend read in the Sunday paper that the museum is free this weekend, and told a group of us "the museum is free this weekend." It was free. That seems totally fine to me.

  I've tried to turn those four verdicts into a rule and I can't. "Only say what's true" fits the uncle and the museum, but not the coworker, and it makes no sense of the cat case. "Only say what you have good reason to believe" fits the coworker and the museum, but it seems to let the uncle and the cat case off the hook, and that doesn't feel right. So maybe one of my verdicts just has to go, or maybe there isn't one rule and I've got a patchwork.

  Can you work out what principle—or small set of principles—would have to be behind my verdicts, and state it precisely enough that I could test it on a new case? Tell me which verdicts the principle keeps and which it forces me to give up, and whether I should keep the principle or the verdict. If the best option is a patchwork that saves all four, say what the patchwork rule actually is and what it costs in simplicity. Then take whichever rule you land on and tell me what it says about the case I keep going back and forth on: a relative calls after an accident and says "he's going to be fine" before any doctor has said anything.

  One last thing. I know people have studied this properly, so please separate what's settled from what's genuinely contested among them, and don't present one contested view as if it's the obvious consensus.
reasoning: |-
  Okay, the user has been struggling with when it's appropriate to state something as a fact without any hedging. They provided four scenarios with their gut reactions and want to understand the underlying principle. Let me start by breaking down each case to identify patterns.

  First, the uncle at the track: He claimed a longshot would win based on a feeling, stated as a sure thing. The user thinks this was wrong even though the horse won. So, truth alone isn't the issue here. The lack of evidence seems key.

  Next, the coworker: She told the client a meeting was at 2 based on the shared calendar. It was wrong because the calendar wasn't updated. The user feels she did nothing wrong. Here, reliance on a credible source (the calendar) makes the assertion acceptable despite being false. So, justification matters more than truth in this case.

  Then, the cat situation: The user saw a cat that looked like the neighbor's and claimed it was theirs. It turned out to be a different cat, but the neighbor's cat was actually in the yard. The user feels they shouldn't have said it. Even though the statement was true and they had good reason, it seems like the reasoning was flawed. The evidence pointed to the wrong cat, making the assertion accidentally correct but poorly supported.

  Lastly, the museum: The friend read in the Sunday paper that the museum is free and stated it as fact. It was true and the user finds it fine. Here, both truth and a reliable source are present, making the assertion proper.

  Looking at these, truth alone doesn't explain all cases (cat and uncle). Justification alone doesn't either (uncle and cat). The cat case is tricky because the statement was true but based on incorrect evidence. The user's discomfort might stem from the fact that their evidence didn't actually support the truth. The cat they saw wasn't the neighbor's, so their reason was flawed even though the conclusion was right.

  Epistemology concepts like the knowledge norm or justification norm come to mind. The knowledge norm requires knowing the proposition, which includes truth and justification. In the uncle's case, he didn't know because it was a guess. The coworker had justification but didn't know because it was false. But the user thinks the coworker did nothing wrong, so knowledge might be too strict. 

  Maybe the justification norm fits better: assert only what you are justified in believing. The uncle isn't justified, so wrong. Coworker is justified, so okay. Museum is justified, okay. But the cat case: the user had justification (visually identical cat), yet feels it was wrong. Why? Because the justification was misleading; the evidence didn't actually support the specific cat being there. So perhaps the justification needs to be properly connected to the truth.

  Williamson's knowledge norm might not fit the coworker case since she didn't know (the info was false). But the user excuses her. So maybe a reasonable person standard or a norm based on available evidence. 

  The cat case suggests that the user values the reliability of the evidence. Even though the visual ID was reasonable, it was incorrect in that instance. The user's discomfort might come from the realization that their evidence was faulty, leading to accidental truth. This ties into epistemic luck: the truth wasn't due to good evidence but coincidence.

  For the relative's "he's going to be fine" after an accident: no medical info, just hope. According to the justification norm, this would be wrong because there's no evidence. The knowledge norm would also say it's wrong since they don't know. But emotionally, the relative might be excused due to distress. The user's rule might require sufficient evidence, making this assertion inappropriate.

  Putting it together, the user's implicit rule might be: Assert only when you have adequate and properly functioning evidence. The uncle's feeling isn't adequate. Coworker's calendar is adequate evidence. Museum's paper is adequate. The cat evidence was adequate but malfunctioned (the identical cat threw them off), so it's a borderline case where the evidence was reasonable but unreliable in that context. This explains the user's lingering discomfort.

  So the refined principle: Assert only when your belief is formed and conveyed based on evidence that is both sufficient and appropriately connected to the truth, minimizing epistemic luck. This saves all cases but notes that the cat situation involves accidental truth, hence the discomfort despite meeting the evidence sufficiency.
answer: |-
  Based on your detailed cases and gut reactions, your judgments reveal a nuanced principle that prioritizes **epistemic responsibility** over simple truth or justification. You seem to hold that an assertion is appropriate only when the speaker has **adequate, well-functioning evidence that properly connects to the truth**, minimizing epistemic luck. Crucially, you reject assertions where truth is accidental or divorced from the quality of evidence, even if the speaker is sincere.

  Here's the principle I infer from your verdicts:
  **"Assert a proposition *only if* your belief in it is formed and conveyed based on evidence that is both *sufficiently reliable* and *appropriately connected* to the truth, such that the truth isn't accidental relative to your grounds."**

  ### How This Principle Handles Your Cases:
  1. **Uncle at the track (Wrong)**:  
     - **Keeps your verdict**: He had no reliable evidence ("just a feeling"). His being right was pure luck.  
     - **Principle applied**: Evidence was insufficient and disconnected from truth → assertion inappropriate.

  2. **Coworker (Not wrong)**:  
     - **Keeps your verdict**: She relied on a *shared calendar*—a socially sanctioned, reasonably reliable source. Her error wasn't due to negligence.  
     - **Principle applied**: Evidence was sufficient and properly connected (even though false due to external factors) → assertion appropriate.

  3. **Cat in the yard (Wrong, despite truth)**:  
     - **Keeps your verdict**: Your evidence (visual similarity) was *misleading* for this context. Though true, your belief was accidentally correct—it wasn't *because* of your evidence.  
     - **Principle applied**: Evidence was insufficiently connected to the truth (you saw the *wrong cat*) → assertion inappropriate, even if true.

  4. **Museum (Fine)**:  
     - **Keeps your verdict**: The *Sunday paper* is a reliable source. Truth wasn't accidental.  
     - **Principle applied**: Evidence sufficient and properly connected → assertion appropriate.

  ### Key Features of Your Implicit Rule:
  - **Truth isn't sufficient**: The cat case shows accidental truth is still problematic.  
  - **Justification isn't sufficient**: The uncle had *some* grounds (a feeling), but it was inadequate.  
  - **Anti-luck condition**: You reject assertions where the speaker "gets lucky" (uncle, cat).  
  - **Socially calibrated reliability**: Evidence is weighed against context (e.g., calendars are valid for meetings; feelings aren't for horse races).  

  ### What You Might Sacrifice:
  - **Simplicity**: This is more complex than "only say what you know" or "be truthful."  
  - **Coworker case tension**: Philosophers debate whether false assertions are *always* improper. Your intuition here is lenient (prioritizing reasonable effort over truth), which is defensible but not universal.  

  ---

  ### Applying to Your New Case:  
  **Relative says "he's going to be fine" after an accident, pre-diagnosis.**  
  - **Your principle says: Wrong** (matches your unease).  
    - *Why*: No reliable evidence (medical expertise, doctor's input). Belief is likely based on hope/denial. Even if true, it would be accidentally true—disconnected from adequate grounds.  
  - **Contrast with coworker**: The coworker used a *system designed for accuracy* (calendar). The relative has no such basis.  

  ---

  ### Philosophical Context: Your Rule Among Experts  
  Your principle aligns closest with **anti-luck virtue epistemology** (e.g., Duncan Pritchard) and **proper functionalism** (e.g., Alvin Plantinga), but with a pragmatic twist. Key debates:  
  1. **Knowledge Norm** (Williamson): "Assert only what you know."  
     - *Fits*: Uncle (didn't know), Museum (knew).  
     - *Clashes with you*: Coworker (asserted falsely → didn't "know"), but you excuse her. Also, cat case (you "knew" accidentally).  
  2. **Justified Belief Norm**: "Assert only what you justifiably believe."  
     - *Fits*: Coworker (justified), Museum (justified).  
     - *Clashes with you*: Uncle (felt justified by "gut"), Cat (you were visually justified). You reject both.  
  3. **Reasonable to Believe Norm** (Lackey): Adds social context.  
     - *Fits your coworker*: Calendar reliance was reasonable.  
     - *Fits your uncle*: Gut feeling isn't reasonable for race predictions.  
     - *Tension*: Your cat case *was* reasonable (identical cats), yet you condemn it—showing you demand *more* than reasonableness.  

  **Settled vs. Contested**:  
  - **Settled**: Mere truth is insufficient (all major theories agree).  
  - **Contested**:  
    - Whether false assertions are *always* improper (your coworker case is a battleground).  
    - Whether "accidentally true" assertions (like your cat) are improper (anti-luck theorists say yes; justificationists often say no).  
    - The role of social context (e.g., calendar reliance vs. gut feeling).  

  ### Conclusion: Keep Your Verdicts, Refine the Rule  
  Your intuitions are consistent and philosophically defensible. Don't abandon any—they reveal a sophisticated view where **assertions must reflect a non-accidental link between evidence and truth**. The cost is complexity, but it captures real-world nuances. For the relative's "he'll be fine," your rule correctly condemns it: without evidence, it gambles with truth.  

  **Final Rule Statement**:  
  *"Assert P only if:*  
  *(a) You believe P based on evidence of a type reliably suited to P in the context;*  
  *(b) The evidence isn't overwhelmed by unaccounted-for defeaters (e.g., identical cats, outdated calendars);*  
  *(c) If P is true, it isn't true *despite* your evidence (avoiding epistemic luck)."*  

  This saves all four verdicts and explains your discomfort in the cat case: your evidence wasn't defeated, but it *misidentified* the truth-maker, violating (c).
