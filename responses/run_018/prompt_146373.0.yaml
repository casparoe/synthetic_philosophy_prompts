  - Two observers: A on Earth, B on a ship heading toward Andromeda at constant velocity (say 0.5c).
  - They reason about the same decision event: whether A sends a message tomorrow (from A's perspective).
  - Inject a condition called 'frame-transitive reality': 
      If x is simultaneous with y in frame F (so x and y are co-real in F) and y is simultaneous with z in frame G (so y and z are co-real in G), then x and z are co-real period, even if in another frame they are not simultaneous.

  The scenario should show that B, applying frame-transitive reality, must treat A's distant future decision as already fixed, while A treats their present choice as open.

  After the scenario, we need to walk through:
  (1) Block-universe/eternalist verdict on both reasonings.
  (2) Presentist verdict if they reject frame-transitive reality.
  (3) Presentist verdict if they accept it.
  (4) Which feature is doing the work, and what collapses if we shrink the separation from Andromeda-scale to a local lab.

  Also, the user wants to know how a presentist defender attacks the case.

  Let me design the thought experiment.

  **Thought Experiment:**

  On Earth, Alice (A) plans to decide tomorrow (by her clock) whether to send a message. Bob (B) is traveling towards Andromeda at 0.5c. Due to time dilation and relativity of simultaneity, events simultaneous with A's present in Earth's frame are not simultaneous in B's frame. Specifically, in B's rest frame, A's "tomorrow" (the decision event) is already in the past. Now, apply frame-transitive reality: consider an event Y that is simultaneous with A's present in Earth's frame (so Y is co-real with A's present in Earth's frame). Also, in B's frame, that same event Y is simultaneous with A's decision event (which is in the past for B). By frame-transitive reality, since A's present is co-real with Y (in Earth's frame) and Y is co-real with A's decision event (in B's frame), then A's present and A's decision event are co-real. Thus, from B's perspective, the decision event is already fixed and real, even though from A's perspective it is in the future and open.

  **Walk-through:**

  (1) **Eternalist/Block Universe Verdict**: Both A and B are correct in their respective frames, but in the block universe, all events are equally real. A's decision event exists timelessly, so it is fixed. The openness A feels is an illusion. B's reasoning is also correct: the event is fixed because it's in the past in his frame and in the block.

  (2) **Presentist Verdict (Rejecting Frame-Transitive Reality)**: The presentist denies that simultaneity relations in different frames carry ontological weight. Only the present moment is real. For A, the decision is future and not real, hence open. For B, the event is in his past and therefore real and fixed, but that's because for B, the event is in his past. However, the presentist would say that the reality of the event is relative to each observer. There is no absolute reality of the event independent of the observer. So, the presentist can maintain that A's decision is open for A and fixed for B without contradiction because they are in different frames. They reject the frame-transitive reality condition because it forces an absolute reality that they deny.

  (3) **Presentist Verdict (Accepting Frame-Transitive Reality)**: If the presentist accepts frame-transitive reality, then they are forced to conclude that A's decision event is co-real with A's present. But then, for A, the future decision is already real and fixed, which contradicts presentism's core tenet that the future is not real and open. This leads to a contradiction for presentism because it would require that the future is real. So, the presentist must reject frame-transitive reality to avoid this.

  (4) **Which feature is doing the work?** The feature doing the work is the large spatial separation (Earth to Andromeda) that, due to the relativity of simultaneity in SR, causes a significant difference in what is considered simultaneous in different frames. If we shrink the separation to a local lab (say, two observers in the same room), then the relativity of simultaneity effect becomes negligible (because the time lag due to the speed of light is tiny). Thus, the events that are simultaneous in one frame are nearly simultaneous in another, and the frame-transitive reality condition would not force events that are clearly future for one observer to be real in the present of another. The collapse of the argument at small scales is because the temporal displacement due to relativity of simultaneity is proportional to the spatial separation and the relative velocity. At small scales, the displacement is too small to matter.

  **How a Presentist Defender Attacks the Case**:

  A presentist defender would attack the frame-transitive reality condition as begging the question. They would argue that it assumes an absolute reality that presentists deny. The presentist maintains that reality is frame-dependent. So, even if in frame F, x and y are co-real, and in frame G, y and z are co-real, that does not mean x and z are co-real in any absolute sense. They would say that the transitivity of co-reality across frames is invalid because co-reality is relative to a frame. Therefore, the entire argument fails because it imposes an absolute reality via transitivity, which the presentist rejects. They might also question whether the event Y is the same in both frames, but in SR, events are unique, so that's not the issue. The attack is on the transitivity of co-reality across frames.

