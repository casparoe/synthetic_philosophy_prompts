  Can you build me a thought experiment for my philosophy of time seminar? I'm trying to isolate the exact move in the Rietdijk-Putnam argument that presentists reject — the idea that distant simultaneity carries ontological weight. Here are the specs: one paragraph, realistic, no FTL or perfect predictors, just standard SR. Two observers: A on Earth and B on a ship heading toward Andromeda at constant velocity. They're both reasoning about the same decision event, say whether A sends a message tomorrow. Now inject this niche condition I'm calling 'frame-transitive reality': if x is simultaneous-with-and-therefore-co-real with y in frame F, and y is co-real with z in frame G, then x and z are co-real period, even if F and G disagree on whether x and z are simultanious. The case should show that B, applying this condition, must treat A's distant future decision as already fixed, while A treats thier present choice as genuinely open. After the scenario, walk me through: (1) the block-universe/eternalist verdict on both reasonings, (2) the presentist verdict if they reject frame-transitive reality, (3) the presentist verdict if they accept it, and (4) which feature is doing the work — plus what collapses if we shrink the separation from Andromeda-scale to a local lab. No bibliographies or reading lists, please. Also tell me how a presentist defender attacks the case. I think there's a typo in my spec sheet but you'll figure it out.
