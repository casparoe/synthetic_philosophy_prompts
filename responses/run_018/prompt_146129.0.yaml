answer: |-
  Here’s a conceptual analysis of the implications of epistemicism and supervaluationism for classifying borderline synthetic organisms, addressing your three queries:

  ### (1) Epistemicism: Hidden Boundaries & Practical Costs
  - **Commitment to Determinacy**: Epistemicism insists every organism *is* determinately native or invasive, even in borderline cases—we merely lack knowledge of the sharp boundary. Regulators **must** assign a binary category; withholding judgment is epistemically wrong, as there *is* a fact to be discovered.
  - **Practical/Ethical Costs**:  
    - **Arbitrary Outcomes**: Decisions may appear random or inconsistent, as regulators rely on imperfect heuristics to "guess" the hidden boundary.  
    - **Accountability Gaps**: Errors are inevitable but untraceable, undermining trust. If an organism later shows invasive traits after being classified as native (or vice versa), regulators face blame for "missing" the truth, even if evidence was ambiguous.  
    - **Precautionary Failures**: Treating a metastable organism as determinately native risks ecological harm if it drifts toward invasiveness. Conversely, misclassifying a harmless borderline case as invasive may stifle beneficial research.  
    - **Procedural Injustice**: Stakeholders (e.g., conservationists, biotech firms) perceive decisions as capricious when borderline cases lack transparent rationale.

  ### (2) Supervaluationism: Truth Gaps & Default Rules
  - **Rejecting Ontological Facts**: Supervaluationism denies any "sharp boundary" in reality. Borderline cases are genuinely indeterminate—no ontologically privileged answer exists.  
  - **Justifying Provisional Exclusion**:  
    - **Principled Non-Arbitrariness**: A default rule (e.g., "exclude from protection unless determinately native") avoids falsely ascribing determinate status. It treats indeterminacy *as such* rather than masking it.  
    - **Burden of Proof Framework**: Exclusion aligns with shifting the burden to proponents to demonstrate that an organism *clearly satisfies* the "native" predicate across all admissible precisifications. Absent this, protection lacks justification.  
    - **Practical Necessity**: Institutions require decisive action. Default rules operationalize indeterminacy without presupposing hidden facts—they reflect epistemic humility and manage risk.  
    - **Ethical Alignment**: Provisional exclusion minimizes harm from false positives (e.g., mistakenly protecting an invasive organism), prioritizing ecosystem stability over speculative benefits.

  ### (3) Generational Drift: Discrete Threshold vs. Extended Indeterminacy
  - **Epistemicist Response**:  
    - **Discrete Point Insistence**: Each generation either is or isn’t invasive/native, even if drift is gradual. A single modification *must* cross the sharp boundary (e.g., Generation *n* is invasive; Generation *n-1* is native).  
    - **Regulatory Challenge**: Requires identifying the exact transition point. Uncertainty compounds as drift accumulates, making error probabilities high. Retroactive corrections may be needed if later evidence reveals misclassification.  
  - **Supervaluationist Response**:  
    - **Extended Indeterminacy Zone**: Drift creates a "penumbra" across generations. Organisms in intermediate generations lack determinate status—they are neither clearly native nor invasive across all precisifications.  
    - **Regulatory Flexibility**: Admits graded responses (e.g., "provisionally regulated" status) without binary assignment. Decisions can reference trajectory: if drift trends toward invasiveness, restrictive measures increase incrementally.  
    - **Temporal Precisifications**: "Native" may be precisified differently over time (e.g., ancestral origin vs. ecological integration). An organism could be *now* borderline-in-native relative to past precisifications but borderline-in-invasive relative to future ones.  

  **Core Tensions Highlighted**:  
  - Epistemicism forces binary decisions amid ignorance, risking arbitrary outcomes with high stakes.  
  - Supervaluationism permits procedural fairness for indeterminacy but risks institutional indecision without careful default rules.  
  - Generational drift exacerbates epistemicism’s hidden-boundary problem while aligning with supervaluationism’s ontology of blurred thresholds.  

  Both frameworks demand explicit institutional rules for borderline cases, but supervaluationism better accommodates metaphysical vagueness in both static and dynamic scenarios through non-binary classifications.
