answer: |-
  The furnaces of Meridian never slept, and neither did Zara. Coal grit clung to her eyelashes and the sweat that slicked her arms as she wrestled the heavy ash rake. Below the grating, the Heart-Furnace glowed a sullen, angry red, its heat radiating through the thick stone walls of the Foundry District, warming the very air that flowed through the city’s lifeblood: the thermal pipes.

  Meridian’s wealth wasn’t metal; it was heat. Heat-bonds, printed on special, heat-sensitive paper, derived their value from the regulated temperature of the Heart-Furnace. Too cold, bonds went stiff and pale, worthless. Too hot, they darkened and curled, their ink bleeding – still worthless. Commerce between districts wasn't settled with coins, but by the flow of thermal energy through those massive, insulated pipes snaking beneath the streets. If the Spice Traders in Harbor District sent more nutmeg and cinnamon to the Weavers in Silk District than they received in cloth, the thermal imbalance sent excess heat *back* to Harbor through the pipes, warming their local bonds. Silk District cooled slightly, their bonds requiring careful tending near smaller heaters. It was supposed to be automatic, self-correcting. Like water finding its level, Old Man Bren used to say before the emphysema took him. Bren had tended the furnace before Zara.

  Zara watched the gauges. The Chief Engineer had just ordered a massive coal dump – a "stimulus," he called it. The Council was worried; rumors of hardship in the outer districts, whispers of bread lines. More coal meant more heat, more heat meant more valuable bonds, more valuable bonds meant… well, prosperity, supposedly. Zara dumped the load, the furnace roaring like a waking dragon. The needle on the main gauge jumped, then settled higher. The air shimmered.

  Days later, Zara walked through the market, clutching her pay-bonds. The air was thick, oppressive, even outside the Foundry. The baker, Mistress Anya, looked harried, sweat beading on her forehead despite the early hour. Zara handed over a bond for her usual loaf.

  "More," Anya said tersely, not meeting her eye.

  "More? But the bond value… the furnace is hotter than ever!" Zara protested.

  Anya finally looked at her, exhaustion etched deep. "Flour costs more. Salt costs more. Even the damn *water* carrier charges more. Your bond burns hotter, Zara, but so does everything else." She took the bond, its edges already slightly darkened from the ambient warmth, and handed Zara a smaller, denser loaf than before. "More heat, same bread. Less bread, sometimes."

  Hume’s oil analogy flickered in Zara’s mind. *Oil makes the engine run smooth, doesn't make it stronger.* Pouring coal into the furnace hadn’t made Meridian stronger; it just made everything run *hotter*, friction increasing. Prices scaled with the heat, nullifying the bond's nominal "increase." The engine wasn't more powerful; it was just generating more wasteful noise and heat.

  Then came the windfall. A massive shipment of high-grade coal arrived unexpectedly, a payment for emergency repairs Meridian had done on a foreign trader’s storm-damaged vessel. The Council, jubilant, ordered it all fed into the Heart-Furnace. "Let Meridian blaze!" the Chief Engineer proclaimed.

  The furnace screamed. The gauges pinned at their maximum. The thermal pipes groaned as superheated air surged through them. Bonds everywhere darkened rapidly. Panic set in. Goods vanished from shelves as merchants hoarded, fearing their bonds would char to cinder before they could spend them. The Foundry District became unbearable; workers fainted. The "wealth" was palpable, searing, dangerous.

  And then, the blockage. An old, neglected pipe junction in the Stonecutters’ Quarter, overwhelmed by the unprecedented flow, ruptured and collapsed. Suddenly, the vital thermal artery between Foundry and Harbor Districts was severed. Harbor District, reliant on imported food and luxury goods it paid for by exporting spices and shipwright services, stopped receiving *any* heat flow. Their local bonds, cut off from the Heart-Furnace's regulation, plunged towards useless stiffness.

  But Harbor hadn't stopped exporting. Ships still sailed out laden with spice. According to the old flow, heat should be rushing *back* to Harbor through the pipes to balance the trade... but the pipe was blocked. Zara, monitoring the labyrinthine pressure differentials on her console, saw it first. The gauges for Harbor showed plummeting temperature, while the pressure *from* Harbor, indicating the thermal energy generated by their export surplus, was spiking dangerously high behind the blockage. The self-correcting mechanism was straining, trapped.

  Hume’s natural balance was trying to work. Harbor was exporting more than it imported; wealth *should* flow back as heat. But the physical pipe, the conduit for that symbolic wealth, was broken. The imbalance couldn't correct. Harbor froze commercially while pressure built, threatening a catastrophic secondary rupture.

  Zara acted on instinct honed by years of listening to the furnace's moods. Ignoring protocols, she diverted auxiliary heat feeds and rerouted smaller pipes, creating a temporary, inefficient bypass around the blockage. She didn’t send *more* heat from the furnace; she just allowed the pent-up thermal energy *from Harbor's exports* to finally flow back home. Slowly, the Harbor gauges began to rise from the danger zone. The bonds stopped stiffening. The pressure behind the blockage eased.

  Standing in the sweltering control room, Zara watched the needles stabilize. The system *had* tried to self-correct, just as Hume described. The export surplus naturally generated the "inflow" of wealth (heat). But the mechanism, the physical reality of the pipes and the dangerous intensity of the heat itself, had nearly caused disaster. The oil kept the engine running, yes, but if you poured in too much, or the pipes clogged, the engine could seize or explode. Money might be a symbol, but heat was real. It could warm your home or burn your city down.

  She looked at the main furnace gauge, still pinned high. The surplus coal was gone, reduced to ash and oppressive, unproductive heat. Bread wouldn’t be cheaper tomorrow. The bonds in her pocket felt heavy, hot, and somehow hollow. The engine still ran, but it was running ragged, fueled by an illusion of wealth that couldn't fill a belly or fix a pipe. The natural balance worked, she understood that now, but only if the pipes were sound and the heat was controlled. Could it fix *this*? Could it fix the Council’s hunger for more fire? She adjusted a valve, listening to the groan of overtaxed metal, and wondered if the flow could truly right itself before the pipes burst.
