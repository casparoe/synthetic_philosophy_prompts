answer: |-
  ### Joint Statement on Applied Ontology: Deflationist and Realist Perspectives  

  #### I. Agreed Claims  
  1. **Ontological Commitment**: A theory's ontological commitments are determined by the entities over which it quantifies, where quantification is indispensable to the theory’s explanatory and predictive success.  
  2. **Quantifier Variance**: The meaning of quantifiers (e.g., "there exists") can vary across conceptual frameworks (e.g., legal, medical) based on domain-specific rules, aims, and linguistic practices.  
  3. **Explanatory Structure**: Explanations in applied domains (e.g., law, medicine) involve layered structures, where non-fundamental entities (e.g., corporations, diseases) function as nodes in inferential networks despite not being reducible to fundamental physical entities.  
  4. **Verbal Disputes**: A dispute is *verbal* if it dissolves upon clarifying (a) the conceptual framework in use, (b) the domain-specific quantifier rules, and (c) the practical objectives of the discourse.  
  5. **Substantive Disputes**: A dispute is *substantive* if it persists after framework-clarification and involves incompatible claims about the world with divergent explanatory consequences (e.g., predictive accuracy, causal efficacy).  
  6. **Framework-Relativity**: Existence-claims about institutional objects (e.g., "Company X exists") are only intelligible relative to a framework (e.g., legal or economic) and its operative conventions.  
  7. **Pragmatic Selection**: Framework-choice is often guided by pragmatic virtues (e.g., simplicity, utility) rather than by direct correspondence to mind-independent structure.  

  ---

  #### II. Disagreements Table  
  | Deflationist Position | Realist Position |  
  |------------------------|-------------------|  
  | **On Explanatory Success & Ontological Commitment**: The explanatory success of a theory in applied domains *never* requires ontological commitment to institutional entities; such entities are useful fictions that organize experiences but do not denote mind-independent existents. | **On Explanatory Success & Ontological Commitment**: The explanatory success of a theory in applied domains *sometimes* requires ontological commitment to institutional entities because their causal-explanatory roles cannot be fully reduced to or replaced by fundamental entities without loss of predictive power. |  
  | **On Framework Selection**: Framework-selection is *exclusively* pragmatic; no evidence can rationally compel the adoption of one ontological framework over another, only demonstrate its relative convenience for domain-specific goals. | **On Framework Selection**: Framework-selection can be *rationally compelled* by evidence when one framework provides superior explanatory depth (e.g., novel predictions, anomaly-resolution) that reveals mind-independent structural features of the domain. |  
  | **On Ontological Seriousness**: There is *no* domain-independent criterion for "ontological seriousness"; existence-claims are always contextual, and no sense can be made of "absolute existence" beyond framework-relative truths. | **On Ontological Seriousness**: There *is* a domain-independent criterion for ontological seriousness: an entity is "serious" if it features in our best causal-explanatory narratives *across* frameworks, indicating a mind-independent anchoring role. |  
  | **On Explanatory Redundancy**: Institutional entities are *demonstrably* explanatorily redundant in principle; all institutional phenomena can be fully explained by referencing only fundamental entities (e.g., particles, psychological states) and social conventions. | **On Explanatory Redundancy**: Institutional entities are *not* explanatorily redundant; attempts to reduce them to fundamental entities fail to capture emergent causal patterns (e.g., corporate liability, disease progression) unique to higher-level ontologies. |  

  ---

  #### III. Cruxes  
  1. **Domain-Independent Criterion**: Does a domain-independent criterion for "ontological seriousness" exist?  
  2. **Explanatory Redundancy**: Can institutional entities be shown to be explanatorily redundant in principle?  

  ---

  #### IV. Concrete Cases & Predictions  
  **Crux 1: Domain-Independent Criterion**  
  - **Case**: The legal treatment of a corporate entity (e.g., **Enron Corp**) as a "person" in bankruptcy proceedings.  
    - **Deflationist Prediction**: Enron's "existence" as a person will be contextual (relative to U.S. bankruptcy law), with no deeper ontological implications. Success in proceedings hinges on pragmatic utility, not mind-independent reality.  
    - **Realist Prediction**: Enron's causal role in bankruptcy (e.g., debt consolidation, asset distribution) reveals a mind-independent structural pattern that cannot be explained without ontologically committing to corporate personhood.  

  **Crux 2: Explanatory Redundancy**  
  - **Case**: Adopting **DSM-5's Major Depressive Disorder (MDD)** vs. **RDoC's neurobiological circuits** to diagnose/treat depression.  
    - **Deflationist Prediction**: MDD will prove reducible to RDoC's circuitry descriptions; the DSM-5 category is a pragmatic shorthand with no unique explanatory power.  
    - **Realist Prediction**: MDD will retain explanatory indispensability (e.g., predicting treatment response, social functioning) beyond RDoC's circuitry, demonstrating non-redundancy.  

  ---  
  This statement reflects exhaustive deliberation on shared ground, unresolved tensions, and testable divergences. Both parties endorse this document as a fair representation of the collaboration’s outcomes.
