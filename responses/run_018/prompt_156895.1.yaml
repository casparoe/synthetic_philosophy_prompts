answer: |-
  The air in the Hall of Nearlies hummed, thick with ozone and the weight of impossible things. Clara moved past display cases holding doppelgänger coins from worlds where Rome never fell, spectacles worn by alternate Shakespeares who wrote comedies. Clinical plaques insisted: *Not Copies. Singular Objects Existing Transworld.* She never believed it, not truly, until Case 731B.

  There it sat. Her mother’s bone-china teacup, roses climbing the handle. Identical, down to the hairline crack near the rim... except the chip was on the left side, not the right. That tiny, wrong imperfection stole her breath. She’d chipped the right side herself, age eight, fumbling while drying. This cup, pristine except for *that* impossible flaw, vibrated with a sickening intimacy.

  Beside it, under glass, lay a sheet of paper. Her mother’s looping script: *"Darling, the hydrangeas are blooming madly this year, and—"* It ended there. Jagged. Incomplete.

  Clara knew this letter. The original, tucked in her own drawer at home, stopped at the same agonizing "and—". She’d found it unfinished on the desk the morning after the stroke. Now, a curator murmured, every recovered fragment from every nearby world ended precisely at "and—". Not a syllable further. Always that hanging conjunction.

  Her fingers pressed cold glass over the teacup’s impossible left-hand chip. Was this *hers*? Was this chipped ghost, existing across countless realities, still her mother’s cup? Or just a cruel echo wearing its face? Grief felt suddenly vast, oceanic – mourning not one loss, but the potential infinity of losses flickering in these nearby worlds. A thousand mothers, a thousand teacups, a thousand strokes silencing them at the same fractured moment.

  Her gaze shifted to the letter. The unfinished sentence. Every version, everywhere, broken at the same word. *And—*. Not a name, not a date, just the connective tissue of thought itself, severed. Maybe *this* was the constant, she thought wildly, not the cup, not even the woman. Maybe the true anchor across worlds wasn't the vessel, but the interruption. The shared, unfinished breath. The thing left perpetually unsaid.

  Was she mourning one mother, or the universal shape of a mother’s interrupted thought? Was the broken sentence her mother’s legacy, or language’s own inherent, aching incompleteness? Clara leaned her forehead against the cool glass, staring at the chipped porcelain and the suspended "and—". The air hummed louder. She didn’t have an answer. Only the weight of the cup in her memory, and the echoing silence after the dash.
