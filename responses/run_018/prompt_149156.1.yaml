  Hmm, they specifically asked for five numbered points without intros or conclusions. Very precise request. Let me unpack their core concern first: when an algorithm auto-rejects patients below survival thresholds, is that killing or letting die? And does slapping a human reviewer on the process change the moral math? That's... disturbingly timely. 

  *scratches head* Existing philosophy won't cut it here because institutions diffuse responsibility. Foot/Thomson thought experiments assume a lone actor making direct choices. But algorithms? They're built by committees, calibrated by admins, executed by machines. And that "human reviewer" tweak - is it moral theater or actual mitigation? The user's onto something messy here. 

  For the monthly plan... Month 1 should map existing triage protocols (gotta see whose "lifeboat ethics" are baked into code). Month 2 needs pressure-testing - what if we vary the threshold? Switch from AI to MD approval? Month 3 must confront the "but we HAD to!" defense head-on. 

  Success isn't about answers - it's about making attendees sweat over who really pulls the trigger when systems "objectively" exclude. Failure would be getting stuck in old individualist debates. 

  *checks watch* Scope check: can't redesign entire healthcare ethics in 3 months. But we CAN expose how the "kill/let die" binary shatters when responsibility hydras get involved. User knows citations aren't needed - sharp cookie. That typo disclaimer? Classic academic armor against perfectionism. Love it.
answer: |-
  Here are the five requested points:

  1.  **Precise Question:** Does an institutional protocol that algorithmically excludes patients below a fixed survival probability threshold for critical resources constitute *killing* those excluded patients, or merely *letting them die* due to system constraints, and does inserting a mandatory human reviewer *change* that moral categorization?
  2.  **Gap in Existing Positions:** Standard killing vs. letting die frameworks (like Foot's/Thomson's trolley variations) assume a single agent's direct causal role and intent, but institutional protocols diffuse agency across designers, algorithms, budget setters, and executors, obscuring intent and direct causation in ways individual-agent models can't resolve.
  3.  **Monthly Plan:**
      *   **Month 1:** Map existing triage protocols & ethical guidelines, dissecting their decision rules and justification language for exclusion thresholds.
      *   **Month 2:** Construct thought experiments systematically varying protocol features (e.g., threshold rigidity, review level, resource scarcity severity) to isolate their impact on moral intuition about "killing".
      *   **Month 3:** Develop a framework analyzing how distributed institutional agency (design choice, algorithm execution, human review) shifts responsibility compared to individual-agent models, focusing on threshold-setting as a key act.
  4.  **Success vs. Failure:**
      *   **Success:** Demonstrating that institutional protocols create a distinct moral category where "killing" can arise from *system design choices* (like setting the threshold) even without direct individual intent, and showing why "human review" alone is insufficient to revert to pure "letting die" if the core exclusion logic remains unchanged.
      *   **Failure:** Merely rehashing individual-agent debates without uncovering novel institutional dynamics, or concluding the question is unanswerable without proposing concrete analytical tools for institutions.
  5.  **Scope Check:** This workshop analyzes the *moral categorization* (killing vs. letting die) of protocol-driven exclusions; it does *not* propose alternative triage algorithms, solve healthcare funding crises, or provide a comprehensive ethical framework for resource allocation beyond this specific distinction.
