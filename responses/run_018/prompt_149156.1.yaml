prompt: |-
  I'm working on a workshop pitch and need a proposal turned out of this half-baked idea. The usual killing-vs-letting-die literature treats the agent as one person with clear intentions, but I want to push it into institutional protocols — specifically hospital triage algorithms that rank patients by survival odds and automatically withold resources below a fixed threshhold. Is the institution killing those it excludes, or letting them die through budget constraints, and does inserting a human reviewer shift the moral category? Give me exactly five numbered points, each a sentence or two, no intro or conclusion: 1) the precise question with a determinate answer, 2) why existing philosophical positions don't settle the institutional version, 3) what I'd actually do month by month for about three months, 4) what counts as success versus failure, 5) an honest scope check for a workshop pitch. Don't bother with citations or reading lists, I'll handle those. There's probably a typo or two in this prompt but that's okay.
reasoning: |-
