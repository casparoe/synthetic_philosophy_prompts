prompt: |-
  I have a friend whose moral judgments about animals are unusually stable across cases, and I want to predict how she will judge a new case before she knows about it. Her settled verdicts include the following. She regards it as seriously wrong to keep layer hens in battery cages or a parrot alone in a small, barren cage. She regards it as wrong to raise and kill a pig for food when one could eat otherwise, and wrong to kill a healthy dog for food even if it had been raised for that purpose. She regards it as wrong to use a chimpanzee in invasive biomedical research. She regards it as not wrong to eat oysters, mussels, or scallops. She regards it as not wrong to catch and kill a wild salmon for food, provided the death is quick.

  Now consider this new case. A company proposes to farm octopuses for food, keeping them in tanks and killing them by chilling. My friend knows that octopuses are invertebrates and that they have large brains, flexible behavior, and unusual problem-solving abilities. What would she likely say? I am less interested in the bare prediction than in the following: identify the moral principle or principles that best explain her past verdicts, state which rival principles fit them nearly equally well, explain what each principle implies about the octopus case, say which prediction you favor and why, and name one further case that would cleanly separate the rival principles. Lead with your bottom line in the first sentence—your predicted verdict and the principle you judge she is running—then give the reasoning, with no preamble and no restating the question.
reasoning: |-
  Hmm, the user wants me to predict their friend's moral judgment about farming octopuses for food. They've provided detailed information about her existing judgments on various animal ethics cases, and they want me to identify the underlying moral principles that explain these judgments.

  Looking at her settled verdicts, I notice some clear patterns. She opposes practices that cause suffering to animals with complex cognitive abilities: battery cages for hens, solitary confinement for parrots, killing pigs and dogs for food when unnecessary, and invasive research on chimpanzees. At the same time, she finds it acceptable to eat oysters, mussels, and scallops (which have simple nervous systems) and to kill wild salmon quickly for food.

  The key seems to be sentience - the capacity for subjective experience, suffering, and complex cognition. Her judgments consistently protect beings that can suffer meaningfully while permitting consumption of creatures with minimal or no sentience.

  For the octopus case, I need to consider what we know about octopus cognition. Octopuses have large brains for invertebrates, demonstrate flexible problem-solving, and show evidence of pain perception and learning. This suggests they meet the sentience threshold she likely uses. Farming them in tanks and chilling them to death would likely cause suffering, aligning with cases she already condemns.

  There are alternative principles that might fit her judgments almost as well: perhaps she focuses on vertebrates versus invertebrates, or maybe she uses a combination of biological complexity and behavior. But the vertebrate/invertebrate distinction doesn't hold up because she accepts eating salmon (a vertebrate) but rejects eating oysters (invertebrates). The complexity principle could work, but octopuses clearly demonstrate high complexity.

  I predict she'll say farming octopuses is wrong because of their demonstrable sentience and cognitive abilities. To distinguish between the principles, a good test case would be something like farming insects for food (e.g., crickets). If she rejects it, she's using sentience; if she accepts, she might be using complexity or a vertebrate/invertebrate distinction.
answer: |-
  She would likely say farming octopuses for food is wrong, based on a principle of avoiding harm to sentient beings capable of suffering and complex cognition.

  **Explaining Principle:** Her judgments are best explained by a principle prioritizing the **avoidance of suffering and death for beings with significant sentience and cognitive complexity**. This accounts for:
  *   Opposing battery hens/parrot cages: causes prolonged suffering to cognitively complex birds.
  *   Opposing killing pigs/dogs for food: causes death and suffering (especially under farming conditions) to highly sentient mammals.
  *   Opposing invasive chimp research: causes severe suffering/death to highly cognizant primates.
  *   Permitting eating oysters/mussels/scallops: bivalves lack centralized brains and strong evidence of sentience/suffering.
  *   Permitting killing wild salmon (quickly): minimizes suffering, and while sentient, fish are often seen as less cognitively complex than mammals/birds in ways relevant to her (though she likely accepts their sentience, hence the need for a quick death).

  **Key Rival Principle:** A nearly equally good fit is a principle of **avoiding harm to vertebrates**, combined with **permitting harm to invertebrates unless they demonstrate exceptionally high cognitive complexity or sentience evidence**. This fits because:
  *   Hens, parrots, pigs, dogs, chimps, salmon: all vertebrates, harmed = wrong.
  *   Oysters/mussels/scallops: invertebrates, harmed = not wrong.
  *   *Almost fits:* The chimp case (a vertebrate) is covered, and the invertebrate bivalves are permitted.

  **Predictions for Octopus Case:**
  1.  **Sentience/Cognition Principle:** Predicts **wrong**. Octopuses exhibit exceptional invertebrate intelligence: large brains, advanced problem-solving, clear learning, play behavior, and strong evidence of sentience and pain perception. Farming (confinement stress) and chilling (potentially inhumane death) cause suffering to a highly sentient being, analogous to the condemned cases.
  2.  **Vertebrate/High-Complexity Invertebrate Principle:** Predicts **not wrong** (or less wrong). Octopuses are invertebrates, the default is permissibility (like bivalves). While complex, this principle might *only* protect vertebrates unless invertebrate complexity rivals vertebrates *in kind* (not just degree). She *might* still condemn it based on exceptional complexity, but the principle itself doesn't demand it based solely on her past verdicts, which only clearly protect vertebrates.

  **Favored Prediction & Why:** I favor **wrong** based on the **Sentience/Cognition Principle**. The rival "vertebrate default" principle struggles with the octopus's *demonstrable* advanced cognition and sentience evidence, which aligns far more closely with the cognitive traits (problem-solving, behavioral flexibility) she protects in vertebrates like parrots and pigs. Her concern seems rooted in the *capabilities* of the being (suffering, cognition), not merely its phylum. Condemning the octopus farm is the most consistent extension of her protection of complex birds and mammals.

  **Discriminating Case:** Farming **crickets or mealworms for food**.
  *   **Sentience/Cognition Principle:** Likely **not wrong**. While insects might experience nociception, evidence for complex subjective suffering or cognition comparable to vertebrates/cephalopods is weak. This aligns with permitting bivalves.
  *   **Vertebrate/High-Complexity Invertebrate Principle:** Also predicts **not wrong** (they are invertebrates without exceptional cephalopod-like complexity).
  *   **Why it Discriminates:** If she condemned **farming shrimp/prawns** (complex decapod crustaceans with some evidence of pain perception and learning, but less than cephalopods), it would strongly favor the **Sentience/Cognition Principle** (graded protection based on evidence) over the rival principle (which would likely permit it as invertebrates below the "exceptional" threshold). If she permitted shrimp farming but condemned octopus farming, it would support the rival principle's vertebrate default + only protecting *exceptionally* complex invertebrates.
