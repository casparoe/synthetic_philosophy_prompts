prompt: |-
  hey im a software engineer with zero formal philosophy background. there's this claim that introspection is unreliable mainly because of source-monitoring failures — we cant tell if a belief came from actual reasoning or just social pressure and noise. assuming thats roughly right, what are exactly five most important implications for how we should treat AI explanations of their own reasoning, and for whether agile retrospectives asking "why did we pick this stack" are valid? please list 1-5, each point a sentence or two, with no intro or conclusion. also, does this basically make root-cause analysis on human team decisions useless?
