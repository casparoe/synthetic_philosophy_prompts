answer: |-
  ### Explanatory Arc Plan

  #### Sequence (Ordered Steps with Dependencies)
  1. **Reframe utilitarianism as aggregation**  
     *Dependency:* Start by acknowledging their optimization lens ("utilitarianism ≅ multi-objective optimization + regularization"). Explicitly state we're testing the *structural soundness* of aggregation itself.  
     *Key move:* "It's not that the math is wrong—it's whether the math appropriately models moral reality."

  2. **Introduce palliative care budget example**  
     - *Setup:* Fixed budget for pain relief. Two patient groups:  
       - Group A: Many patients with moderate pain ($1k each reduces pain from 6→2).  
       - Group B: Few patients with severe, unremitting pain ($50k each reduces pain from 10→9).  
     - *Utilitarian solution:* Allocate all funds to Group A (maximizes total pain reduction).  
     - *Highlight moral tension:* Group B is left at near-maximum suffering despite available resources.

  3. **Isolate the structural flaw**  
     *Dependency:* After presenting the example, preempt rights-based interpretations.  
     *Key point:* "Notice: No one is 'harmed' in the rights-violation sense. Funds are allocated fairly by utilitarian math. The issue is that *treating pain as a pool* erases whose pain it is."

  4. **Analogize to CS concepts**  
     - Utilitarianism = summing vector values into a scalar (Σutility).  
     - Separateness objection = insisting we must reason about the *vector* (individual positions) first.  
     - *Crucial contrast:* "This isn't adding constraints (like 'no pain >9'). It’s rejecting that summation is ever morally sufficient."

  5. **Defuse misconceptions**  
     - When discussing Group B's outcome: "This isn't about individual rights—we could add 'minimum care' constraints and *still* miss the point."  
     - When noting utilitarian efficiency: "Even with perfect Pareto efficiency, aggregating utility ignores *who* bears the residual suffering."

  6. **Generalize to moral reasoning**  
     *Dependency:* After the example and analogies.  
     *Core claim:* "Separateness means we can't trade off *between persons* like we trade objectives *within* a person. Suffering isn't fungible across moral agents."

  ---

  #### Example Specs (What It Needs and Avoids)
  **Needs:**  
  - Linear pain reduction math (to show utilitarianism "works" computationally).  
  - Asymmetrical resource needs (Group B requires disproportionate funds).  
  - Non-zero baseline suffering for Group B even post-allocation (to prevent "solved problem" dismissal).  
  - No rights violations (avoid "killing" or "stealing" intuitions).  

  **Avoids:**  
  - Scarce life-saving resources (risks conflating with trolley problems).  
  - Subjective utility differences (keep pain measurable to focus on aggregation).  
  - Any suggestion Group B is "deserving" of neglect (prevents misreading as desert-based objection).  

  ---

  #### Misconceptions (When to Head Them Off)
  | Misconception | When to Head Off | Response |
  |---------------|------------------|----------|
  | "This is just about individual rights." | Immediately after presenting the example outcome. | "Rights aren't violated here—we're distributing aid, not harming. The issue is whether suffering is *aggregatable* across persons at all." |
  | "We can fix this with a fairness constraint." | During the CS analogy step. | "Constraints band-aid the symptom. But even with a 'min-max pain' rule, utilitarianism still sees persons as utility-buckets—the structure stays reductive." |
  | "It's irrational not to maximize efficiency." | During generalization step. | "Efficiency assumes comparability. Separateness argues that *interpersonal comparisons* lack moral justification—it's not inefficiency, it's category error." |

  ---

  #### Check Question  
  **Q:** "If we achieve the same total pain reduction by either (a) lifting one person from agony to comfort, or (b) slightly easing many already-comfortable people, does utilitarianism distinguish these? Why would the separateness objection?"  
  - *Correct grasp:* Utilitarianism treats (a) and (b) identically (same ΣΔpain). Separateness insists (a) is morally required because it attends to the *worst-off individual*—not summed outcome.

  ---

  #### Omissions (Skip with Brief Notes)  
  | Topic | Reason Skipped |
  |-------|----------------|
  | Rawlsian contractarianism | "Rawls' veil of ignorance is one response, but separateness is a prior objection—utilitarianism fails *before* we get to contracts." |
  | Nozick's experience machine | "Focuses on authenticity of experiences, not structural aggregation—save for hedonism critiques later!" |
  | Prioritarianism | "Weighting the worst-off reintroduces aggregation—we're examining if *any* summing is defensible." |

  ---

  #### Framing Note for CS Audience  
  - **Leverage their intuition:** Start with "You're right—utilitarianism *is* optimization. But let's stress-test the model."  
  - **Use their language:** "Moral patients ≠ threads sharing a heap. Allocating 'suffering cycles' violates process isolation."  
  - **Precision demand:** "Your optimization instincts are valid. The target is whether *utility aggregation* is a valid primitive for ethics."  

