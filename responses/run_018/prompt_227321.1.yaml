prompt: |-
  So I've been chewing on an argument that keeps resurfacing whenever satisficing comes up on LW-adjacent threads, and I've talked myself into a position I want properly stress-tested rather than just nodded at.

  The position: bounded rationality isn't actually a rival theory of decision-making to expected utility maximization. It's just EU maximization with deliberation costs priced in. Every satisficing rule -- stop searching once you hit your aspiration level, take-the-best, 1/N portfolios, whatever -- can be reproduced as the output of some expected utility maximizer facing search costs, attention costs, or a finite compute budget. Simon needed the satisficing vocabulary because optimization-under-costs was mathematically intractable at the time, but conceptually the maximizer always swallows the satisficer. So when people say humans "satisfice rather than maximize," they aren't describing a different kind of agent, they're describing a maximizer whose cost function nobody bothered to write down. And the whole fast-and-frugal heuristics programme is at best a nice collection of engineering tricks for compute-limited agents, and at worst an unfalsifiable umbrella that can claim any behavior post hoc by positing whatever environmental constraints make it "ecologically rational."

  What would count against this? Specifically:

  - Empirically: what behavioral findings, if they hold up, can't be redescribed as constrained maximization without doing violence to the very idea of a cost function? People point at aspiration levels that shift based on recent search experience -- does the maximizer picture handle that cleanly, or only by baking the observed behavior into the utility function, which feels like cheating?
  - Formally: is there any result that actually separates the two? E.g. a class of problems where the optimal-with-deliberation-costs policy provably doesn't look like any simple heuristic, or the reverse -- a case where a fixed heuristic beats every feasible approximation to the optimal policy in a way that the "you're really just maximizing" story can only accommodate by gerrymandering.
  - Conceptually: does MY position have its own falsifiability problem? If any behavior whatsoever can be fitted with some cost function, then "it's all maximization" is trivially true and therefore empty. Tell me whether that's a knock-down objection to what I'm saying or just pedantry.
  - And what would the bounded rationality camp itself accept as settling things? The less-is-more results -- heuristics beating full optimization in noisy environments with small samples -- are those genuine differential predictions that the maximize-with-costs picture fails to make, or the same predictions dressed in different clothes? If a committed ecological-rationality person and a committed constrained-maximization person can each explain every experiment the other one runs, I want that stated plainly.

  Rank the defeaters from fatal to merely annoying, and be explicit about which ones the satisficing side would themselves concede as damage versus dismiss as missing the point. Also, per usual: say what would change your mind about your own answer -- which argument, if it turned out to go through, would flip your verdict, and where your reasoning here is most likley to fail. And if your honest conclusion is that this whole dispute is terminological because the two camps are one utility-function redefinition away from each other, I'm open to that, but argue for it instead of asserting it, because "it's all semantics" is also a claim that should have to earn its keep.
reasoning: |-
  Okay, let me start by unpacking the user's argument. They're claiming that bounded rationality and satisficing aren't actually separate from expected utility maximization; they're just EU maximization with deliberation costs factored in. The user wants this position stress-tested across empirical, formal, and conceptual dimensions.

  First, I need to recall key concepts. Simon's bounded rationality argues humans use heuristics due to cognitive limits, not because they're optimizing with costs. The user's challenge is whether all such heuristics can be reduced to EU maximization under constraints. 

  Looking at empirical counterexamples: the user mentions aspiration levels shifting with search experience. If a satisficer adjusts their aspiration based on recent finds, like lowering the bar after poor results, a traditional EU model with fixed costs might not explain this without ad-hoc adjustments. Studies like those from Gigerenzer's group on recognition heuristics show people making accurate decisions with minimal information, which outperforms complex models in specific environments. That's hard to fit into a cost-based EU framework because the heuristic's success depends on environmental structure, not just cost savings.

  Formally, the user asks if there are problems where optimal policies don't resemble simple heuristics or vice versa. Computational complexity theory might help here. For NP-hard problems, optimal deliberation under constraints could be intractable, while heuristics provide feasible solutions. Additionally, in multi-armed bandit problems, satisficing rules like Thompson sampling might outperform EU approaches with computational limits, suggesting a divergence.

  Conceptually, the user worries their position is unfalsifiable. If any behavior can be explained by adding costs, then "it's all maximization" becomes vacuous. This is a serious issue because it makes the theory non-predictive. The bounded rationality camp would argue that their heuristics are defined independently of costs, making them falsifiable, while cost-based EU can always retrofit explanations.

  The user also asks what bounded rationality proponents would accept as settling the debate. Less-is-more effects, where simple heuristics beat optimization in noisy environments, are key. If a heuristic consistently outperforms EU under constraints in such settings, it challenges the reductionist view. However, if constrained EU can replicate these results by adjusting cost functions, the debate remains unresolved. The distinction lies in predictive power and parsimony: heuristics offer specific, testable predictions, whereas post-hoc cost adjustments lack rigor.

  I need to assess which counterarguments are fatal versus annoying. The unfalsifiability problem is critical—if adding costs can explain anything, the EU model loses scientific value. Empirical cases like adaptive aspiration levels and ecological mismatches (using heuristics in wrong contexts) are strong evidence against reductionism. Formal results showing computational intractability or heuristic superiority in specific problems are significant but might be context-dependent, so less fatal.

  The user's position might fail most at the conceptual level. By allowing arbitrary utility functions, it risks becoming tautological. Bounded rationality, with its focus on specific heuristics and environmental fits, offers testable hypotheses without that baggage. To change my view, I'd need evidence that a well-specified cost function can predict new heuristic behaviors without post-hoc adjustments, or a formal proof that all heuristic outcomes are expressible as EU optima under a universal cost structure.

  In conclusion, while constrained EU can model many satisficing behaviors, it struggles with adaptive heuristics and ecological rationality, making the reduction incomplete. The debate isn't just terminological; it's about explanatory scope and predictive validity. The strongest points against the user's view are the unfalsifiability risk and the adaptive nature of heuristics that don't align with fixed cost structures.
answer: |-
  Here's a stress-test of your position, ranking defeaters from most to least severe, with explicit analysis of where each side stands:

  ### 💥 Fatal Counterarguments (Threaten Core Coherence)
  1. **The Unfalsifiability/Objection:**  
     - **Knock:** If *any* behavior can be rationalized by inventing *ad hoc* deliberation costs or utility functions (e.g., "the agent gets utility from stopping early" or "costs scale non-linearly with search depth"), your position becomes empirically vacuous. It predicts everything and nothing.  
     - **Satisficer Response:** "This is the core objection! Bounded rationality *must* posit specific, independently testable mechanisms (e.g., aspiration adjustment rules, recognition heuristics) to be science. Your 'maximization' is a just-so story."  
     - **Flip Condition:** If you can provide a **universal, parsimonious cost/utility specification** that predicts *which* satisficing rule emerges in *which* environment *without* post-hoc tweaking. (Example: A general theory of "computational effort" that derives aspiration resetting from first principles.)  
     - **Why It's Fatal:** Without constraints, "it's all maximization" ceases to be a scientific claim. This is the strongest argument against your view.

  ### 🔥 Serious Counterarguments (Challenge Explanatory Power)
  2. **Adaptive Aspiration Levels:**  
     - **Behavior:** Aspiration levels shift *during search* based on experience (e.g., high initial aspiration → few acceptable options → lower aspiration).  
     - **Maximizer Challenge:** Baking "utility from avoiding regret/effort" into the utility function feels contrived. Why would a rational agent dynamically *redefine* their goals mid-search? Optimal search with fixed costs typically implies monotonic stopping rules.  
     - **Satisficer Win:** This is core Simon/Gigerenzer territory. Models like **aspiration adaptation** (e.g., lowering the bar after failed search) are naturally explained as frugal heuristics, not optimization.  
     - **Concession:** A maximizer *could* model this with a complex state-dependent cost function (e.g., cost of search increases with frustration), but it lacks the elegance and directness of the satisficing explanation.  
     - **Rank:** High damage to your position—this behavior feels "alien" to fixed-utility maximization.

  3. **Ecological Mismatch & Maladaptive Heuristics:**  
     - **Behavior:** Humans use heuristics (e.g., take-the-best) even in environments where they perform *worse* than simple EU, and where deliberation costs are negligible (e.g., lab tasks with monetary stakes and no time pressure).  
     - **Maximizer Challenge:** If costs are near-zero, why satisfice poorly? You must argue either: (a) hidden cognitive costs exist (unfalsifiable?), or (b) the heuristic is "miscalibrated" due to evolutionary mismatch. But (b) concedes the heuristic isn't *currently* optimizing.  
     - **Satisficer Win:** Bounded rationality predicts systematic biases when heuristics are deployed outside their ecological niche. EU-with-costs struggles to explain *persistent* suboptimality without invoking irrationality.  
     - **Rank:** Major empirical thorn—unless you posit implausibly high fixed "mental effort" costs for *all* computation.

  ### ⚠️ Annoying Counterarguments (Highlight Limitations)
  4. **Less-is-More Effects & Formal Separations:**  
     - **Finding:** Simple heuristics (e.g., recognition, 1/N) outperform full EU maximization in noisy, small-sample, or high-dimensional environments (e.g., Gigerenzer's stock-picking experiments).  
     - **Maximizer Response:** "This is still constrained optimization! The heuristic approximates the *optimal policy given costly computation*."  
     - **Satisficer Counter:** Yes, but:  
       - **Formal Proofs:** For some NP-hard problems (e.g., subset selection), optimal *approximations* under constraints are *provably* more complex than high-performing heuristics (e.g., greedy algorithms).  
       - **Performance Gap:** Heuristics often beat *feasible* approximations to optimal-with-costs (e.g., a quick 1/N rule vs. a flawed MCMC sampler for portfolios).  
     - **Verdict:** This is the *core battleground*. Satisficers claim a **pragmatic victory**: heuristics work where optimization fails *in practice*. Maximizers claim a **theoretical victory**: the heuristic is still optimal *under the true (unknown) cost function*.  
     - **Settlement Condition:** A class of problems where:  
       (i) A simple heuristic dominates all feasible approximations of the optimal-with-costs policy,  
       (ii) The cost function needed to "explain" the heuristic is absurdly complex (e.g., depends on global problem structure).  
       *(No clear consensus exists.)*

  5. **Evolutionary/Ecological Rationality:**  
     - **Satisficer Claim:** Heuristics co-evolve with environments (e.g., "recognize valid cities → choose larger one" exploits statistical structures). They aren't "optimizing with costs"; they're exploiting environmental regularities *ignoring* costs.  
     - **Maximizer Response:** "Exploiting regularities *is* optimal under a cost function that values speed/robustness!"  
     - **Stalemate:** Both explain the data. Satisficers argue their description is **more ontologically honest** (the brain isn't computing costs; it's pattern-matching). Maximizers argue theirs is **more general**.  
     - **Rank:** Terminological? Satisficers won't concede—they see "ecological rationality" as a distinct explanatory framework.

  ---

  ### Where Your Reasoning Is Most Likely to Fail
  - **The Utility Function Trap:** Your view risks becoming **tautological** ("whatever they do, it must be optimal given *some* costs"). Bounded rationality escapes this by positing *specific*, *falsifiable* mechanisms.  
  - **Ignoring Adaptation:** Satisficing rules (e.g., aspiration adjustment) are often **procedural** and **state-dependent**. EU-with-costs struggles to explain why the "cost function" itself changes dynamically during search.  
  - **Underestimating Engineering:** Framing heuristics as "just tricks" misses their power. A satisficer might say: "Yes, they're *for* bounded agents, but that doesn't make them *reducible* to EU—they're solutions to a *different problem* (survival under ignorance)."

  ---

  ### Conclusion: Not *Just* Terminological, But Your View Has Merit
  - **Fatal Flaw:** Unconstrained utility/cost functions make your position unfalsifiable. This must be addressed.  
  - **Satisficing's Core Defense:** They offer **specific algorithmic models** of *how* decisions are made (aspiration + search, take-the-best), while you offer a **rational reconstruction** of *why* they might be optimal. These are complementary but not reducible.  
  - **Middle Ground:** **Bounded optimality** (Russell & Subramanian) bridges the gap: design agents that compute the *best possible action given their computational architecture*. Here, satisficing heuristics *emerge* as optimal policies for specific architectures.  
  - **What Would Change My Mind:**  
    - If you could **derive common heuristics** (e.g., aspiration resetting) as optimal policies under a **simple, universal cost function** (e.g., linear search cost + convex cost of delay).  
    - If someone proved a **formal equivalence**: "For every satisficing heuristic H, there exists a cost function C such that H optimizes EU under C, and C is *not* gerrymandered (e.g., Kolmogorov-simple)."  
    - **Until then:** Satisficing remains a distinct *descriptive* and *engineering* framework, while EU-max remains the *normative* gold standard. The camps explain different aspects of cognition. Conflating them loses insight.
