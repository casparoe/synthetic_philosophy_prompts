  The salt-stink of low tide hung thick over Siltport, that labyrinth of barges chained like restless beasts to the creaking wharves. Mara spat a shred of seaweed over the gunwale of the *Mudlark*, her knuckles white on the smooth-worn tiller. Below, the murky water swirled with deceptive lethargy, but Mara felt the deep tremor through the barge’s timbers – the Wheel of Tides was stirring. Soon, the great submerged cogs would bite, the hidden pumps groan to life, and the canals would become writhing serpents of current.

  "Right mess today, Mara," called Kael from his broader, safer grain barge. He jerked a thumb towards the central channel, already showing the first silvery ripples of acceleration. "Wheel’s groaning like a bad tooth. Heard the Tide-keepers reckon it’s skipping a beat. Fortune’s fickle, eh? Stick to the sluggish edges, that’s my advice. Don’t fancy your little dances today." His grin was wide, devoid of malice but full of the certainty that Mara’s ‘counter-rhythms’ were reckless theatre.

  Mara just nodded, her gaze fixed on the water. Kael spoke of fortune as a capricious god, best placated by caution. Mara saw it as a wild horse – unpredictable, yes, but with a muscle beneath the chaos that could be *felt*, anticipated, nudged. Virtù, her old tutor had called it, not goodness, but the keenness of a knife finding the joint. For Mara, it lived in the subtle tension of the tiller, the way a barge shuddered before a surge, the precise, counter-intuitive moment to shove *against* the flow, not flee it. That brief, violent resistance could carve a pocket of deceptive calm, a still point in the maelstrom, just wide enough for the *Mudlark* to pivot or slip through a gap others deemed impossible.

  Today’s cargo was fragile: crated clockwork songbirds for the Glasshouse District, delicate mechanisms that wouldn’t survive the long, safe route via the sluggish Backwater Cut. The direct path meant threading the Needle’s Eye – a narrow, current-raked passage beneath the shuddering arches of the Wheel’s support structure. Normally, Mara’s counter-rhythms made it feasible. Today, with the Wheel ‘skipping a beat’? Kael’s warning echoed.

  The tide surged. Water that had been sluggish boiled into life. Barges upstream groaned as the current grabbed them. Mara felt the familiar, hungry pull at the *Mudlark*’s hull. The Needle’s Eye beckoned, a dark maw already foaming white around its edges. The safer route, the Backwater Cut, was a broad, slow curve to the left – easy, safe, but hours longer. The songbirds’ owner, old Mistress Elara, would be furious at the delay. Worse, the fragile mechanisms might warp in the Cut’s stagnant damp.

  *Fortune,* whispered Kael’s voice in her head. *Play it safe. Wait for kinder water.*

  *Virtù,* countered the memory in her muscles. *Find the rhythm within the chaos.*

  The *Mudlark* bucked. The current wasn’t building steadily; it was lurching, like a drunkard’s gait. A sourceless eddy spun off the central channel, slapping the barge sideways. Mara’s pulse hammered against her ribs. This wasn’t just a skipped beat; the Wheel was coughing, spitting out irregular pulses of force. Charting the counter-rhythm felt like trying to dance on shifting shale.

  She lined up for the Needle’s Eye’s approach, the roar of compressed water filling her ears. The first surge hit – a monstrous, unexpected shove that nearly tore the tiller from her grip. Instinct screamed to yield, to let the current carry her wide, towards the slower waters. Safety. Predictability. Luck’s mercy.

  Instead, gritting her teeth, Mara *shoved* back.

  It wasn't graceful. The *Mudlark* groaned in protest, shuddering violently as its nose bit against the torrent. Water piled up against the prow, frothing angrily. For a terrifying heartbeat, they hung suspended, fighting the inevitable. Kael would be shouting now, certain she was doomed.

  Then, it happened. The piled water collapsed, not sideways, but *down*, creating a sudden, violent whirlpool just off the bow. And within that maelstrom, directly ahead in the narrow channel’s mouth, a transient pocket of unnaturally still water bloomed – a dead zone carved by the collision of forces. Mara’s counter-rhythm, imperfectly timed against the Wheel’s irregular throb, had still found purchase.

  She didn’t think. She *flowed*. A flick of the tiller, a surge of the long pole against the canal bed, and the *Mudlark* slid sideways into that fleeting calm like an eel finding a crevice. The raging current howled past, inches away, powerless against the stillness Mara had wrested from the chaos. For three precious seconds, she was becalmed in the heart of the storm.

  She poled hard. The barge slid through the Needle’s Eye, emerging into the broader, choppy water beyond as the Wheel gave another great, grinding shudder. The unnatural calm vanished instantly, swallowed by the renewed surge. But the *Mudlark* was through, riding the powerful current now carrying her swiftly towards the Glasshouse District.

  Behind her, the Needle’s Eye frothed and roared, impassable again. Kael’s barge was a distant shape already turning resignedly towards the Backwater Cut.

  Mara leaned on the tiller, her breath coming fast, the tremor in her hands not entirely from exertion. Had she mastered fortune? No. The Wheel’s erratic cough was pure, dumb luck – ill fortune that could have smashed her against the arches. But within that unpredictable surge, she had found a pressure point. Her virtù wasn't commanding the tide; it was the sharpness that found the hidden lever in the chaos, the timing that exploited the brief, violent opening created by opposing forces. She hadn't conquered the Wheel, but she had, for a fleeting, critical moment, reshaped the water it moved.

  She guided the *Mudlark* towards the Glasshouse wharf, the crates of songbirds silent and secure. Mistress Elara would be pleased. Kael would call it a lucky gamble. Mara ran a calloused hand over the smooth tiller, feeling the phantom vibration of the water’s resistance. Fortune provided the chaos. Virtù was knowing, deep in the bone, how to push back at just the right moment, in just the right way, to make a space for yourself within it. The Wheel groaned again, deep and unfathomable beneath the murk. Mara allowed herself a small, tight smile. The dance wasn’t over. It never was.
