  Breaking it down, the requirements should cover several areas. First, avoiding homunculi is essential. The account must explain the sense of agency without positing a "little agent" inside. Then, empirical adequacy: the model must align with motor control deficits, like in schizophrenia where the sense of agency is disrupted. Phenomenology is another key aspect—how to account for the feeling of effort without reifying it as a separate entity.

  Normativity is tricky. Personal-level reasons involve "shoulds," but if subpersonal processes are deterministic, how do we reconcile that? Also, decomposability: can the sense of agency be broken down into prediction errors and precision weighting without assuming a homunculus to interpret them? Continuous emergence is important too—agency should arise gradually from subpersonal mechanisms, not appear magically.

  Precision weighting itself might be a hidden skyhook. If precision is a parameter that's optimized, who or what is doing the optimizing? That could sneak in teleology. The user’s advisor wants just the criteria, but the user thinks the joint unsatisfiability is where the real philosophy is. So, identifying tensions between requirements is crucial.

  Possible conflicts: Normative grounding vs. subpersonal determinism. If personal-level reasons are irreducible but subpersonal processes are deterministic, how do we bridge that gap without a skyhook? Also, decomposability without residue vs. non-eliminativism about phenomenology. If we decompose agency completely, do we lose the qualitative feel? And the precision hierarchy's teleology: if precision optimization requires a top-down goal, that might introduce a skyhook.

