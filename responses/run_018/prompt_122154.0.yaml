answer: |-
  Here’s the bottom line: **A theory of emergence for institutional facts must explain how physical stuff (like paper) gains social reality (like money) through collective practices, without reducing it to brain states or invoking supernatural forces, while respecting science and avoiding key conceptual traps.**

  ### The Full Spec (What It Needs to Cover)
  1. **Specific Cases**  
     - **Paper → Money:** How inert matter acquires value/function via agreement.  
     - **Descriptive Practices → Normative Authority:** E.g., why "citizen" isn’t just a label but carries obligations/rights enforceable by law.  

  2. **Distinctions It Can’t Collapse**  
     - **Explaining-away vs. Explaining-up:** Can’t reduce money to "just paper" (greedy reductionism) *or* claim it’s magically real (skyhook). Must show *how* layers build.  
     - **Causal vs. Constitutive:** Brains *cause* social facts, but social facts (e.g., laws) *constitute* new realities (e.g., "owning property").  
     - **Individual vs. Collective:** Needs group intentionality ("we believe this is money"), not just individual brains.  

  3. **Science Constraints**  
     - **Evolutionary Continuity:** No sharp break between animal signaling (e.g., vervet monkey alarms) and human institutions.  
     - **Neuroscience:** Brains must support collective intentionality, symbols, and norm-compliance (mirror neurons, predictive coding help).  
     - **Physics Compatibility:** No violating thermodynamics or quantum mechanics.  

  ### Tensions & Potential Dealbreakers  
  ⚠️ **"No Skyhooks" vs. "Irreducible Normativity"**  
  - If norms (e.g., "dollars *should* be accepted") aren’t reducible to physics, does that sneak in a skyhook? *Some argue normativity emerges from evolutionary/learning pressures.*  

  ⚠️ **"Collective Intentionality" vs. "Cranes All the Way Down"**  
  - If groups have intentions not explainable by individual psychology, is that a crane (evolutionary adaptation) or a skyhook? *Dennett vs. Searle feud here.*  

  ### Settled vs. Contested  
  | **Settled**                         | **Contested**                                  |
  |-------------------------------------|-----------------------------------------------|
  | Emergence ≠ magic (no skyhooks)     | How "real" are social facts? (Searle: ontologically subjective but epistemically objective vs. eliminativists: useful fictions) |
  | Greedy reductionism fails for norms | Is collective intentionality biologically primitive or built from individual cognition? |
  | Institutions require feedback loops | How much does biology *constrain* social facts? (e.g., can money exist without language?) |

  ### Key Battlegrounds  
  - **John Searle:** Collective intentionality + "status functions" (X counts as Y in context C) are bedrock. *Critics say this hides a skyhook.*  
  - **Dan Dennett:** Institutions are "competence without comprehension" — cranes built by cultural evolution. *Critics say this underplays normativity.*  
  - **Evolutionary accounts:** Institutions as extended phenotypes (Dawkins) or niche construction (Odling-Smee). *Critics ask: where do *oughts* come from?*  

  ### Why This Isn’t Easy  
  **Institutional facts are physical *and* normative, individual *and* collective, stable *and* changeable.** Nailing this without cheating requires showing how layers of practice (rituals, laws, symbols) bootstrap reality from scratch. If it feels like walking a tightrope between "it’s just atoms!" and "magic!," that’s because it is.
