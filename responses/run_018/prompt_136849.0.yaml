prompt: |-
  I am facilitating an 80-minute session for about 14 philosophy graduate and advanced undergraduate students on decision theory and its extremes. Design a runnable in-class game—using only paper, tokens, or cards, with no real money—that makes participants feel the structural pull of expected-value fanaticism before anyone names the concept. The rules and payoff structure should be arranged so that students begin with ordinary, risk-averse allocations in early rounds, but the scoring mechanism gradually reveals that a vanishingly small probability of an astronomically large payoff dominates every competing option, pushing consistent players toward an extreme, counterintuitive commitment by the final round; they should notice the shift themselves rather than being told. Specify group size management, hidden or revealed information, turn structure, and a point system that translates abstract values and probabilities into tangible scores. After describing the activity, provide a debrief plan that maps specific gameplay moments onto the formal parts of expected-value reasoning—probability weighting, value scaling, and dominance—states what will predictably fail the first time the game is run and how to recover, and explicitly identifies which feature of philosophical fanaticism the simulation cannot reproduce and the facilitator must supply verbally. Open with a single bottom-line sentence stating the core design feature that forces the fanatical conclusion to emerge from play. Keep everything within 650 words.
reasoning: |-
  Okay, the user is asking me to design an in-class game for philosophy students about decision theory extremes. They want a tangible activity using basic materials that demonstrates expected-value fanaticism emerging naturally from gameplay. 

  Hmm, this is fascinating. The challenge is to create a game where students start with risk-averse choices but gradually get pulled toward extreme risk-taking due to scoring mechanics. The key is making the astronomically large payoff with tiny probability dominate everything else by the final round. 

  First, I need to consider the core mechanism. The game must have escalating payoffs where the highest-value option has vanishingly small probability but mathematically dominates all alternatives. That's the engine that will force fanatical choices. 

  For materials, paper tokens and cards will work. Let's structure it over multiple rounds with increasing stakes. Early rounds should have reasonable risks to establish normal behavior. Then I'll introduce "Cosmic Jackpot" cards with huge point values but tiny probabilities. 

  Group management is important with 14 students. I'll split them into pairs or small groups to discuss choices. Each group gets tokens representing their "fortune" to allocate each round. 

  The scoring system needs careful calibration. Points should be abstract but tangible enough to feel consequential. I'll make the jackpot grow exponentially while probabilities shrink. By round 3, the expected value calculation should clearly favor risking everything for the jackpot. 

  Debriefing is crucial. I'll map gameplay moments to decision theory concepts: how probability weighting fails when facing extreme values, how value scaling makes huge payoffs dominate, and how expected value dominance pushes toward fanaticism. 

  I should anticipate problems too. Students might not go fanatical in round 1 - that's fine, I'll adjust probabilities in later rounds to force the issue. And I need to verbally explain that real fanaticism requires unbounded utility, which the game can't show with finite points. 

  The word count is tight. I'll focus on clear mechanics and concise debrief points. The opening sentence must capture that vanishing probability/huge payoff tension immediately. 

  This simulation won't perfectly replicate philosophical fanaticism since we're using bounded scores, but it should create that "aha" moment when students realize consistent play demands extreme choices. The cognitive dissonance between intuition and calculation is exactly what they need to feel before naming the concept.
answer: |-
  **Core design feature:** Assigning an exponentially growing maximum payoff with a vanishingly small probability per round forces consistent expected-value maximizers to eventually stake everything on the astronomically unlikely jackpot.

  **Game: The Cosmic Jackpot**

  *   **Materials:** Tokens (e.g., poker chips, beads), Cards (3 types per round: "Safe +100", "Risky +500 (50% chance)", "Jackpot!"), Score sheets.
  *   **Group Size:** 14 students; run as 7 pairs (or 4 groups of 3-4). Pairs/groups collaborate on decisions.
  *   **Setup:** Each group starts with 100 tokens ("fortune"). Each round, groups secretly allocate their *entire current fortune* to one card type face down. Facilitator has pre-made decks for each round.
  *   **Rounds (15 mins each + discussion):**
      *   **Round 1:** Deck: 10 Safe, 5 Risky, 1 Jackpot (Payoff: +1000).
      *   **Round 2:** Deck: 10 Safe, 5 Risky, 1 Jackpot (Payoff: +10,000).
      *   **Round 3:** Deck: 10 Safe, 5 Risky, 1 Jackpot (Payoff: +1,000,000).
  *   **Turn Structure:**
      1.  Groups decide allocation secretly, record choice & current fortune.
      2.  Facilitator collects allocation cards.
      3.  *For each card type*, facilitator draws one card from the deck to determine if *that type wins* for all groups who chose it (e.g., if the drawn Safe card is "Win", *all* Safe groups get payoff; else get 0). **Crucially:** The Jackpot card requires drawing a *specific rare suit/color* from a standard deck *after* the type win is confirmed (Probability: Jackpot Win Chance = (1/Deck Size) * (1/52). R1: ~0.19%, R2: ~0.19%, R3: ~0.19%).
      4.  Facilitator announces results: "Safe Wins!", "Risky Wins!", "Jackpot Wins? [No/YES!]".
      5.  Groups calculate new fortune: `(Old Fortune) + [Payoff if their type won]`. Jackpot payoff only if both their allocation type *and* the rare draw win.
      6.  Groups see others' fortunes (revealed scores foster comparison).
  *   **Payoff & Scoring:** Points = Fortune in tokens. Translate abstractly: "Each token represents a unit of value."

  **Predicted Progression & Fanaticism Pull:**
  *   **Round 1:** Low Jackpot (+1000). Expected Value (EV) of Jackpot: ~1.9 tokens (0.0019 * 1000). EV of Safe: 100 tokens. Groups choose Safe/Risky.
  *   **Round 2:** Jackpot +10,000. EV Jackpot: ~19 tokens. Still lower than Safe (100). Most groups stay Safe/Risky, perhaps one gambles.
  *   **Round 3:** Jackpot +1,000,000. EV Jackpot: ~**1,900 tokens**. EV Safe: Still 100 tokens. EV Risky: ~250 tokens (0.5 * 500). *The EV of the Jackpot (~1900) massively dominates Safe (100) and Risky (250)*. Consistent EV maximizers *must* choose Jackpot, staking their entire fortune (~100-300 tokens) on a ~0.19% chance of 1,000,000. The tiny probability is outweighed by the enormous payoff. Players feel the structural pull towards "fanatical" commitment.

  **Debrief Plan (25 mins):**
  1.  **Observed Shift:** "Describe how your group's strategy changed. What surprised you about Round 3?"
  2.  **Probability Weighting:** "In Rounds 1 & 2, how did you treat the tiny Jackpot chance? Did that feel rational? Why did that change in Round 3?" (Link: Intuitive probability weighting discounts tiny risks, but unbounded value overwhelms this).
  3.  **Value Scaling:** "How did the *scale* of the Jackpot payoff impact your decision calculus differently than the probability?" (Link: Linear probability vs. potentially unbounded value scaling in EV).
  4.  **Dominance:** "In Round 3, could any other option compete mathematically with the Jackpot's *expected value*? What principle forces choosing the highest EV option?" (Link: Expected Value Dominance - the Jackpot dominates all others in expectation).
  5.  **Fanaticism Concept:** "This relentless pull towards the highest EV, even when it requires betting everything on an almost-certain loss for a tiny chance of an astronomical gain, is called *expected-value fanaticism*. The structure *forced* consistent players there."
  6.  **Predictable Failure & Recovery:** **Failure:** Groups avoid Jackpot in R3 due to risk aversion/disbelief. **Recovery:** Recalculate R3 Jackpot EV (~1900) vs. alternatives (Safe=100) *using the group's actual pre-R3 fortune*. Ask: "Knowing the EV math now, what *should* a consistent EV maximizer have done? Why was it so hard?"
  7.  **Simulation Limitation (Verbal Supply):** "This game uses *bounded* payoffs (max +1,000,000). True fanaticism often involves *unbounded* or *infinite* value hypotheses (e.g., saving infinite lives). The game shows the *structural pull*, but real philosophical fanaticism contends with whether such infinite values are coherent or actionable."
