  ### Moral Responsibility: Reactive Attitudes & Determinism  
  **A Branching Taxonomy of Substantive Commitments**  

  ---

  #### **Root Node**  
  **Claim:** *"When a person commits a harmful act entirely determined by prior causes (e.g., upbringing, biology, environment), it is sometimes appropriate to feel resentment toward them — and this appropriateness depends on more than just the social utility of expressing resentment (e.g., deterrence or norm maintenance)."*  
  - **Agree (A):** Proceed to Node 1.  
  - **Disagree (B):** Proceed to Node 4.  

  ---

  #### **Node 1** (for Root-A)  
  **Claim:** *"Reactive attitudes (e.g., resentment, gratitude) are fundamentally *rational* responses to agents — i.e., they can be true/false or justified/unjustified based on facts about the agent’s capacities or the situation, similar to beliefs."*  
  - **Agree (A):** Proceed to Node 2.  
  - **Disagree (B):** Proceed to Node 3.  

  ---

  #### **Node 2** (for Node 1-A)  
  **Claim:** *"Determinism (the idea that all events are caused by prior states + laws of nature) would *undermine* the rationality of reactive attitudes if true, because it would show agents lack the control needed for true responsibility — even if they seem reasons-responsive."*  
  - **Agree (A):** **Leaf: *Libertarian Incompatibilist*** (Reactive attitudes require indeterminism; preserve them by rejecting determinism).  
  - **Disagree (B):** **Leaf: *Rationalist Compatibilist*** (Reactive attitudes depend on reasons-responsive capacities; determinism compatible if capacities exist).  

  ---

  #### **Node 3** (for Node 1-B)  
  **Claim:** *"Conditions that exempt agents from reactive attitudes (e.g., severe mental illness) are primarily defined by *objective facts* about incapacity (e.g., inability to understand moral reasons), not social negotiation or cultural context."*  
  - **Agree (A):** **Leaf: *Hybrid A* (Non-rational objectivist)** (Reactive attitudes are non-rational practices, but exemptions are objective capacity failures).  
  - **Disagree (B):** **Leaf: *Pure Strawsonian*** (Reactive attitudes are non-rational social practices; exemptions are socially negotiated; determinism irrelevant).  

  ---

  #### **Node 4** (for Root-B)  
  **Claim:** *"The inappropriateness of resentment in determined cases is because determinism *globally undermines* all reactive attitudes — we should adopt an objective attitude (e.g., managing/predicting behavior) toward everyone."*  
  - **Agree (A):** **Leaf: *Hard Determinist / Global Skeptic*** (Determinism undermines all reactive attitudes; objective attitude should prevail).  
  - **Disagree (B):** Proceed to Node 5.  

  ---

  #### **Node 5** (for Node 4-B)  
  **Claim:** *"Reactive attitudes can be appropriately directed at *collective entities* (e.g., corporations) for harms caused by standard practices (e.g., a biased algorithm widely deployed by engineers), even when inappropriate toward individuals involved."*  
  - **Agree (A):** **Leaf: *Hybrid B* (Collective-only responsibility)** (Determinism undermines individual responsibility but not collective responsibility).  
  - **Disagree (B):** Proceed to Node 6.  

  ---

  #### **Node 6** (for Node 5-B)  
  **Claim:** *"Reactive attitudes are appropriately directed at *sub-personal mechanisms* (e.g., cognitive biases, neural processes) rather than whole persons — e.g., resenting a depressive episode for causing harm, not the person."*  
  - **Agree (A):** **Leaf: *Hybrid C* (Sub-personal targeting)** (Reactive attitudes apply only to mechanisms, not agents; determinism irrelevant).  
  - **Disagree (B):** Proceed to Node 7.  

  ---

  #### **Node 7** (for Node 6-B)  
  **Claim:** *"The *only* basis for reactive attitudes is their social function (e.g., reinforcing norms) — their appropriateness has no connection to truth or agent capacities beyond utility."*  
  - **Agree (A):** **Leaf: *Hybrid D* (Social functionalist)** (Appropriateness depends solely on social utility; determinism irrelevant).  
  - **Disagree (B):** **Unoccupied** (See "Unoccupied Space" below).  

  ---

  ### **Terminal Leaves**  
  1. **Pure Strawsonian**: Reactive attitudes are non-rational social practices; exemptions are negotiated; determinism irrelevant.  
  2. **Rationalist Compatibilist**: Reactive attitudes depend on reasons-responsive capacities; determinism compatible if capacities exist.  
  3. **Hard Determinist / Global Skeptic**: Determinism undermines all reactive attitudes; objective attitude is universally appropriate.  
  4. **Libertarian Incompatibilist**: Reactive attitudes require indeterminism but should be preserved.  
  5. **Hybrid A (Non-rational objectivist)**: Reactive attitudes are non-rational, but exemptions are objective capacity failures (e.g., mental illness).  
  6. **Hybrid B (Collective-only responsibility)**: Reactive attitudes apply to institutions/collectives but not individuals under determinism.  
  7. **Hybrid C (Sub-personal targeting)**: Reactive attitudes apply only to sub-personal mechanisms (e.g., biases), not whole agents.  
  8. **Hybrid D (Social functionalist)**: Reactive attitudes are appropriate *only* if socially useful, regardless of determinism or capacities.  

  ---

  ### **Unoccupied Space**  
  - **Rationalist without reasons-responsiveness** (Path: Root-A → Node 1-A → Node 2-B): Assumes reactive attitudes are rational but rejects that reasons-responsiveness matters. *Gap due to incoherence*: If attitudes are truth-apt, they require a capacity-based criterion to avoid arbitrariness.  
  - **Rejection of all options** (Path: Root-B → Node 4-B → Node 5-B → Node 6-B → Node 7-B): Denies determinism’s global threat, collective responsibility, sub-personal targeting, and social functionalism. *Gap due to lack of exploration*: Logically possible but rarely defended (e.g., "responsibility requires non-causal agency").  

  ---

  ### **Separation & Scoring Key**  
  | Leaf                            | Path (Answers in Sequence)       |  
  |---------------------------------|----------------------------------|  
  | Rationalist Compatibilist       | Root-A → Node 1-A → Node 2-B     |  
  | Pure Strawsonian                | Root-A → Node 1-B → Node 3-B     |  
  | Hybrid A (Non-rational objectivist) | Root-A → Node 1-B → Node 3-A     |  
  | Hard Determinist                | Root-B → Node 4-A                |  
  | Libertarian Incompatibilist     | Root-B → Node 4-B → Node 5-A¹    |  
  | Hybrid B (Collective-only)      | Root-B → Node 4-B → Node 5-A     |  
  | Hybrid C (Sub-personal)         | Root-B → Node 4-B → Node 5-B → Node 6-A |  
  | Hybrid D (Social functionalist) | Root-B → Node 4-B → Node 5-B → Node 6-B → Node 7-A |  

  **Ambiguity Flag**:  
  - **Libertarian Incompatibilist** and **Hybrid B (Collective-only)** *both* follow Root-B → Node 4-B → Node 5-A. The tree cannot separate them because both agree determinism isn’t the *primary* issue for collective responsibility, but their core divergence (indeterminism vs. collective agency) isn’t probed. *Reason*: Node 5 focuses on collective entities without testing metaphysical commitments.  

  ---

  ### **Design Notes**  
  - **Non-Obvious Scenario**: Node 5 uses harm from "standard, widely deployed algorithms" to isolate *collective responsibility* (e.g., blaming a corporation, not an engineer).  
  - **Key Distinctions**: Exemption conditions (Node 3), determinism’s scope (Nodes 2, 4), and targets of attitudes (Nodes 5, 6) divide positions without requiring labels.  
  - **Formal Structure**: Branches prioritize mapping logical space (e.g., rationality, determinism, targets) before assigning positions. Hybrids represent coherent but niche views (e.g., sub-personal targeting).
