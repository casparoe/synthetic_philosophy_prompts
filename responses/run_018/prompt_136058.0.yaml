answer: |-
  ### Conceptual Framing  
  The dollar auction model—where rational players escalate bids beyond a prize's value to avoid losses on prior investments—maps onto your cooperative's deadlock in three key ways: First, the "bidding" involves members investing non-monetary resources (labor, social capital) for control over a collective good (aesthetic prestige). Second, the "prize" is non-rival (all members benefit from the renovated space) but confers disproportionate reputational rewards to perceived "winners," mimicking the auction's contested ownership dynamic. Third, partial exit costs mirror the auction's penalty for withdrawal: disengaging sacrifices sunk social investments without eliminating obligations, trapping members in a cycle of defensive escalation to justify prior commitments.

  ---

  ### Core Implications  
  **1. Rational Escalation Becomes Socially Toxic:**  
  Members face a perverse incentive: once they've invested visible labor (e.g., drafting designs, lobbying peers), withdrawing concedes reputational loss. Continuing to bid—offering more unpaid work or escalating advocacy—appears rational to protect their standing, even as total costs dwarf any realistic prestige gains. This creates a "race to the bottom" where collective welfare erodes as individuals compete to avoid personal defeat. Observable commitments (e.g., public proposals, volunteered hours) signal seriousness, pressuring rivals to match or exceed efforts, deepening the deadlock.

  **2. Asymmetric Costs Fuel Entrenchment:**  
  Members with higher social stakes (e.g., long-tenured residents, board officers) face steeper exit costs. Their reputations are more tightly bound to group outcomes, making disengagement feel catastrophic. Conversely, newer members may escalate tactically, betting that visible commitment accelerates social integration. This asymmetry prevents coalition-building for compromise, as high-stakes players interpret concessions as existential threats, while others exploit the conflict for status.

  **3. De-Escalation Requires Removing Bid Triggers:**  
  Escalation persists because bids (labor/social capital) are visible, comparable, and tied to individual credibility. Breaking the cycle demands mechanisms that:  
  - **Decouple Effort From Ownership:** Separate past contributions from decision rights (e.g., "All submitted designs are anonymized for voting").  
  - **Externalize Validation:** Introduce a neutral third party (e.g., architect, mediator) to evaluate proposals objectively, reframing the conflict as technical problem-solving.  
  - **Cap Investments:** Impose hard limits on volunteer hours per member or freeze new inputs until a reset.  

  ---

  ### Boundary Conditions  
  The analogy weakens in two areas: First, labor is non-fungible—unlike money, hours invested in design or debate cannot be reallocated to other purposes, making costs feel irrecoverable and justifying further escalation. Second, the prize is non-excludable; even "losers" gain from improved shared spaces, which should incentivize cooperation. However, when status competition dominates, the non-excludability paradoxically intensifies conflict—members fight harder for symbolic ownership precisely because material benefits are shared.

  ---

  ### Application to the Cooperative Case  
  This deadlock is a **modified escalation trap**, where collective ownership and social currency amplify—not negate—dollar auction dynamics. Prestige functions as a de facto private reward, while partial exit penalties (reputational damage) lock members into bidding. Pure auction logic explains the escalation, but cooperative norms distort rationality: members overvalue social returns, mistaking relentless effort for group loyalty. To break the cycle, **reframe the conflict away from zero-sum prestige**. Freeze all voluntary labor, appoint an external facilitator to consolidate design inputs, and hold a blind vote on anonymized concepts. This severs the link between sunk social costs and decision influence, resetting incentives toward collective gain.

  ---

  ### Bottom Line  
  As a board member, your most urgent task is to **de-personalize the bids and socialize the prize**. Announce a "labor amnesty" that honors past contributions but decouples them from influence, while externally mediating the design integration. This transforms the competition into a collaboration, neutralizing escalation triggers without shaming participants. Prioritize shared enjoyment of the outcome over individual ownership of the process to restore cohesion.
