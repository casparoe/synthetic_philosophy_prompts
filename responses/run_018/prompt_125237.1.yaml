answer: |-
  Below is a formalized decision procedure for evaluating testimonial claims in submissions, designed as an ordered checklist with explicit stopping rules. It preserves the logical distinction between testimony reductionism (justification requires independent evidence of the speaker's reliability and access) and anti-reductionism (justification flows directly from the testimony unless defeated), while being accessible to a non-specialist board. 

  The procedure is structured as a flowchart with binary questions, clear thresholds, and three verdicts:  
  - **Accept as testimony-justified** (claim passes either anti-reductionist or reductionist standards).  
  - **Reject for lack of independent corroboration** (claim fails reductionist standards).  
  - **Refer to board judgment** (non-epistemic factors like values/risk tolerance dominate).  

  Steps must be followed sequentially. Judgment is minimized but not eliminated; value-laden gaps are flagged explicitly.  

  ---

  ### **Testimonial Claim Evaluation Procedure**  
  **Input**: A claim *p* asserted solely on testimony (oral report, document, etc.).  

  #### **Step 1: Defeater Check**  
  - **Question**: Is there *any positive evidence* that the testimony is unreliable?  
    - *Consider*: Internal contradictions, inconsistency with established facts, evidence of speaker bias/dishonesty, or circumstantial red flags (e.g., coercion, context of deception).  
  - **Sufficient Answer**:  
    - **YES** (defeater found) → **Reject** the claim. **HALT**.  
    - **NO** (no defeaters) → Proceed to Step 2.  

  #### **Step 2: Anti-Reductionist Eligibility**  
  - **Question**: Is the testimony from a source embedded in a *practice of accountability* (e.g., academic, journalistic, or institutional context where errors are corrected)?  
    - *Consider*: Experts in their field, peer-reviewed work, or documents from verified archives. Exclude informal/anonymous sources.  
  - **Sufficient Answer**:  
    - **YES** → **Accept as testimony-justified** (anti-reductionist path). **HALT**.  
    - **NO** → Proceed to Step 3 (reductionist path).  
    - **UNCLEAR** → Proceed to Step 3 (reductionist path).  

  #### **Step 3: Reductionist Reliability Check**  
  - **Question A**: Is there *independent evidence* that the speaker/document is *generally reliable* on this topic?  
    - *Consider*: Track record, credentials, corroboration from unrelated sources, or institutional validation.  
  - **Sufficient Answer for A**:  
    - **YES** → Proceed to Question B.  
    - **NO** → **Reject for lack of independent corroboration**. **HALT**.  
    - **PARTIAL/UNCLEAR** → **Refer to board judgment** (values/risk tolerance). **HALT**.  

  - **Question B**: Is there *independent evidence* that the speaker had *direct perceptual/experiential access* to the event/fact?  
    - *Consider*: Proximity to the event, methodological transparency, or documentation of access.  
  - **Sufficient Answer for B**:  
    - **YES** → **Accept as testimony-justified**. **HALT**.  
    - **NO** → **Reject for lack of independent corroboration**. **HALT**.  
    - **PARTIAL/UNCLEAR** → **Refer to board judgment** (values/risk tolerance). **HALT**.  

  #### **Value Judgment Gap**  
  - **Procedure Limit**: Steps 3A/3B **cannot resolve** whether a speaker’s social position (e.g., authority, identity, demographics) affects reliability.  
    - *Example*: Does an expert’s institutional power make them *more* reliable (due to resources) or *less* (due to bias)?  
    - **Resolution**: Board must decide this *without procedural cover* based on values/context. Flag as "**REFER TO BOARD JUDGMENT (values)**" if raised.  

  ---

  ### **Worked Applications**  
  #### **Case 1: Expert’s Oral Report of an Unreplicable Experiment**  
  - **Claim**: "Chemical X causes rare effect Y," based solely on an expert’s conference presentation. Experiment cannot be replicated (unique equipment destroyed).  
  - **Step 1**: No defeaters (no contradictions, expert is credible). → Proceed.  
  - **Step 2**: Source is an expert (accountability practice: academia). → **YES**.  
    - **Anti-reductionist path**: **Accept as testimony-justified**. **HALT**.  
  - **Reductionist path**: Not triggered (stopped at Step 2).  
  - **Verdict**: **Accept** (anti-reductionism permits acceptance without further evidence).  

  #### **Case 2: Anonymous Historical Document**  
  - **Claim**: "Event Z occurred in 1600," based on an unsigned, undated document with unknown origins.  
  - **Step 1**: No defeaters (no internal errors, not contradicted). → Proceed.  
  - **Step 2**: Source is anonymous (no accountability practice). → **NO**. → Proceed to Step 3.  
  - **Step 3A**: No independent evidence for reliability (author unknown, no provenance). → **NO**.  
    - **Reductionist path**: **Reject for lack of independent corroboration**. **HALT**.  
  - **Anti-reductionist path**: Not triggered (failed Step 2).  
  - **Verdict**: **Reject** (reductionism demands independent evidence of reliability).  

  #### **Counterintuitive Divergence**  
  - **Where paths split**: Step 2.  
  - **Why**: Anti-reductionism accepts testimony from accountable sources without independent evidence (Case 1). Reductionism requires independent evidence of reliability/access when accountability is absent (Case 2).  
  - **Counterintuitive outcome**: Case 1 is accepted under anti-reductionism but rejected under reductionism (if forced to Step 3). In Case 1, reductionism would demand:  
    - Step 3A: Is there independent evidence the *expert is reliable*? Credentials suffice? → **YES** (if accepted).  
    - Step 3B: Is there independent evidence of *access*? Unreplicable experiment lacks evidence of access. → **NO**.  
    - **Reductionist verdict**: **Reject**.  
  - **Flag**: Anti-reductionism accepts Case 1; reductionism rejects it. Split occurs because anti-reductionism trusts testimony by default in accountable contexts, while reductionism requires verifying *access* independently.  

  ---

  ### **Procedure Summary**  
  1. **Defeater Check** → Reject if flaws.  
  2. **Anti-Reductionist Path** → Accept if source is accountable.  
  3. **Reductionist Path** → Accept only if reliability + access are independently verified.  
  4. **Value Gaps** (social position, authority, identity) → Refer to board judgment.  

  **Time-Saving Design**: Binary questions; Steps 1–2 resolve most cases in <5 minutes.  
  **Limitations**: Cannot adjudicate social/identity factors in reliability; cannot define "accountability practice" without board input. Use pre-meeting guidelines (e.g., "Peer-reviewed journals = accountable; anonymous blogs = not").
