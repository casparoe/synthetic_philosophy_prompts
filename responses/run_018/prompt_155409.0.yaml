answer: |-
  Here's a precise diagnosis of your argument, pinpointing the critical flaw and pricing the alternatives:

  **The Failing Step: Premise (7)**  
  Specifically, the claim that applying a universal definition *"requires knowing which gains count as corrupting 'private' ones, which in turn requires knowing the local constitutive norms."*

  **Why (7) Looks Initially Sound:**  
  It seems logically compelling. If corruption is "use of public office for *private* gain," then defining "private" appears context-dependent. What's "private" in a Western bureaucracy (e.g., enriching family) might be "public duty" in a kinship-based system. Premises (2), (3), and (6) reinforce this by showing how "private" interests can be constitutive in some contexts but not others. It feels like acknowledging cultural embeddedness.

  **Why (7) Fails (and Derails the Argument):**  
  It **equivocates on "private gain"** by conflating two distinct senses:
  1.  **Formal/Procedural "Private":** Gain directed *outside* officially sanctioned channels/rules.
  2.  **Substantive/Normative "Private":** Gain serving interests *contrary to the institution's purported public purpose*.

  Premise (7) assumes the *only* way to define "private gain" is substantively/normatively (i.e., relative to the local constitutive norm). **This ignores the possibility of a universal, procedural definition of "private gain" based on formal rules and transparency, *independent* of the local constitutive norm's substantive content.**

  **The Core Error:** Premise (7) falsely presents a dichotomy: either define "private gain" substantively relative to local norms *or* give up on universality. It suppresses the alternative: defining "private gain" procedurally as *any benefit directed based on undisclosed, unofficial, or rule-violating criteria*, regardless of whether the local norm *endorses* that criteria.

  **Repairing the Argument & Saving (3) and (6):**  
  Reject the flawed premise (7) and replace it with a procedural understanding:
  *   **Revised Premise (7):** "If corruption is defined universally—as the use of public office for private gain—then applying the definition requires a *procedural standard*: 'private gain' means benefit directed based on *undisclosed loyalties, violation of formal appointment/spending rules, or criteria diverging from officially stated institutional procedures*, irrespective of whether local constitutive norms endorse those loyalties or criteria."
  *   **Revised Premise (8):** "Consequently, universal application classifies practices based on *transparency and adherence to formal rules*, not on the substantive local constitutive norm. It can condemn opaque, rule-violating patronage *even within* a kinship-based system (if rules demand impartiality on paper) *and* condemn opaque, rule-violating lobbying *within* Western systems. It avoids both wholesale relativism *and* the assumption that Western substantive norms are universal."
  *   **Revised Conclusion (9):** "Therefore, universal anti-corruption law is coherent if grounded in *procedural norms* (transparency, rule-adherence) rather than substantive norms (like impartiality vs. loyalty). It can be parochial only if it insists Western *substantive* purposes (e.g., pure impartiality) are universal, but not if it insists on universal *procedural* standards."

  **Why This Saves (3) and (6):**
  *   **(3) Stands:** You can still argue that in a kinship-based system, distributing goods to kin *fulfills the local constitutive norm* (the substantive purpose). The universal procedural standard doesn't deny this; it simply says that if the *official rules* of the institution (even in that society) *state* that distribution should be based on merit, need, or some other criterion *besides* kinship, and officials *violate those rules secretly* to favor kin, it's corrupt *by the procedural standard*. If the official rules *explicitly mandate* favoring kin (unlikely, but possible), then doing so transparently and rule-adherently *wouldn't* be procedurally corrupt.
  *   **(6) Stands:** You can still argue that Western frameworks lack a *principled, non-circular substantive criterion* for distinguishing legitimate political loyalty from illegitimate private loyalty. The procedural standard *sidesteps* this substantive quagmire. It asks: Was the loyalty acted upon *disclosed*? Did it *violate formal rules* governing the process? Was the criteria *officially stated*? Western practices like earmarking or regulated lobbying can be scrutinized under this procedural lens (are the deals transparent? do they break spending rules? is the influence peddling disclosed?).

  **Pricing the Alternatives (What You Must Surrender):**

  1.  **Rejecting (2):**
      *   **Cost:** You surrender the powerful anthropological insight that roles are culturally constructed. You must argue that kinship obligations *always, universally* compete with the bureaucratic role, never constituting it. This ignores compelling evidence from political anthropology (e.g., work on "neopatrimonialism") and makes your critique of Western frameworks (Step 6) much weaker. It forces you into a position where only Western-style bureaucratic rationality is legitimate.
      *   **Outcome:** You save universality by imposing a Western substantive norm (impartiality as constitutive everywhere), making (9) true ("parochial"). You lose (3) and severely weaken (6).

  2.  **Rejecting (6):**
      *   **Cost:** You surrender your critical insight about the hypocrisy and lack of principle within *Western anti-corruption frameworks themselves*. You must argue that Western democracies *do* have a clear, non-circular, universalizable criterion for distinguishing legitimate political loyalty from illegitimate private loyalty. This is empirically dubious (see debates over campaign finance, lobbying, earmarks) and philosophically challenging.
      *   **Outcome:** You might preserve a *modified* universality, but only by ignoring the internal inconsistencies of the dominant frameworks you're critiquing. You lose the core critical force against Western parochialism. (3) might still stand, but its contrast with the West is diminished.

  3.  **Rejecting/Revising (7) (The Recommended Path):**
      *   **Cost:** You surrender the idea that a universal definition *must* rely on substantive local norms to define "private gain." You must develop and defend a *procedural* standard (transparency, rule-adherence, official criteria) as the universal core. This requires arguing that such procedural norms can be meaningfully applied cross-culturally and are not themselves hopelessly Western. (They are aspirational ideals present in many traditions, even if imperfectly realized).
      *   **Outcome:** You preserve (3) and (6), avoid the damning (9), and offer a *coherent, non-relativist, less parochial* foundation for universal anti-corruption efforts focused on process rather than imposing substantive purposes. You shift the debate from "What is the *right* purpose?" to "Are officials following their *own stated rules* openly?"

  **Conclusion:** The argument stumbles at step (7) by assuming the impossibility of a universal *procedural* definition of "private gain," leading to the false dilemma in (8) and (9). Rejecting this premise and replacing it with a procedural standard allows you to retain your key insights about the cultural constitution of roles (2, 3) and the internal inconsistency of Western frameworks (6), while offering a coherent, non-relativist basis for universal anti-corruption norms focused on transparency and adherence to formally established rules. The cost is the theoretical and practical work of rigorously defining and defending this procedural standard across diverse contexts.
