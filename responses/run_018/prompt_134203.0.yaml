answer: |-
  **BUREAU OF RADICAL INTERPRETATION**  
  **Internal Field Manual BRI-FM-1984-07**  
  **"PROCEDURES FOR PRIMARY LINGUISTIC INTERFACE (PLI) UNDER ZERO-SHARED-VOCABULARY CONDITIONS"**  
  **CLASSIFICATION: RADICAL INTERPRETATION EYES ONLY**  
  **DATE: 1984-10-26**  
  **REVISION: ALPHA**

  **1. PRE-ENGAGEMENT PREPARATION**
      1.1 **Objective:** To establish baseline interpretation of Subject utterances and associated intentional states, absent any pre-existing linguistic or cultural referents.
      1.2 **Prerequisite:** Complete epistemological tabula rasa on part of Field Agent (FA). Any pre-suppositions regarding Subject’s beliefs, desires, or perceptual capacities constitute Protocol Violation (PV-7a).
      1.3 **Equipment:** Standard Issue Triangulation Verification Kit (TVK-84); Field Charity Adjustment Ledger (FCAL-84, Form Set B); Provisional Web Mapping Canvas (WMC-84, Scale 1:1); Indeterminacy Filing System (IFS-84) requisition forms.

  **2. INITIAL CONTACT & TRIANGULATION VERIFICATION (TV)**
      2.1 **Mandate:** No attribution of belief or desire (B/D Complex) is authorized prior to successful TV.
      2.2 **Procedure:**
          *   2.2.1 FA, Subject, and Shared Environmental Stimulus (SES) must be physically co-present. (Remote observation invalidates TV per Directive 7.3.1).
          *   2.2.2 FA identifies a proximate, mutually observable SES (e.g., rabbit running, water dripping, bright light). Designate SES as "Stimulus Alpha."
          *   2.2.3 FA notes Subject’s physical orientation (gaze, pointing, flinch) towards Stimulus Alpha concurrent with Subject utterance. Record utterance phonetically as "Utt-Alpha."
          *   2.2.4 FA simultaneously observes Stimulus Alpha. **Note:** FA's own perceptual state *is* the objective correlate (Re: Rejection of Scheme/Content Distinction, Directive 1.0).
          *   2.2.5 Complete Form TVK-84a ("Tripartite Co-Occurrence Log") detailing FA location, Subject location, SES description, and Utt-Alpha. Submit for Provisional Authorization (PA) before proceeding. **Failure constitutes PV-12d.**

  **3. PRINCIPLE OF CHARITY APPLICATION (PCA)**
      3.1 **Mandate:** Maximize agreement between FA and Subject belief systems. Presume Subject rationality and truth-holding coherence. Minimize attributed disagreement ("disagreement deficit").
      3.2 **Procedure:**
          *   3.2.1 For each attributed belief candidate derived from TV (e.g., "Subject believes 'Utt-Alpha' refers to Stimulus Alpha"), FA **must** consult the Field Charity Adjustment Ledger (FCAL-84).
          *   3.2.2 If attribution implies Subject holds a belief contradicting FA's own firmly held belief (e.g., FA sees rabbit, Subject's Utt-Alpha and orientation suggest belief in "winged serpent"), FA **must**:
              *   3.2.2.1 **Option A:** Re-interpret Utt-Alpha (e.g., perhaps Subject refers to the *movement*, not the *entity*). **OR**
              *   3.2.2.2 **Option B:** Revise FA's *own* belief regarding Stimulus Alpha (e.g., log in FCAL-84: "Per Stimulus Alpha (SES-001), revised personal belief: Visual data consistent with winged serpent morphology. Previous 'rabbit' classification erroneous.").
          *   3.2.3 The option selected **must** result in the lowest possible Disagreement Deficit Score (DDS) calculated per FCAL-84 algorithms. Higher DDS requires Brigade Commander approval.
          *   3.2.4 **Crucial:** PCA overrides intuitive plausibility. Subject utterances expressing geometric impossibilities, violations of temporal causality, or contradictions must first be resolved via FCAL-84 self-revision before attributing irrationality (Re: Holism, Sec 4).

  **4. HOLISTIC WEB VERIFICATION (HWV)**
      4.1 **Mandate:** No single belief or desire is isolable. Attributing any element of the B/D Complex requires provisional mapping of the *entire* network of Subject's propositional attitudes relative to the FA's own.
      4.2 **Procedure:**
          *   4.2.1 Using Provisional Web Mapping Canvas (WMC-84), FA plots each tentatively attributed belief/desire node derived from TV sequences.
          *   4.2.2 FA establishes logical and probabilistic coherence linkages between all nodes. **Example:** Attribution of belief "Water is poisonous" necessitates linked desires ("avoids water"), supporting beliefs ("ingestion causes harm"), perceptual beliefs ("recognizes water"), etc.
          *   4.2.3 **Holism Check (HC):** Before finalizing any *single* belief attribution (e.g., "Subject believes water is wet"), FA must demonstrate on WMC-84 how this belief coheres with *all* other currently mapped beliefs and desires. Incoherence triggers return to PCA (Sec 3) for FA belief revision or re-attribution.
          *   4.2.4 **Caution:** Initial web will be sparse. HWV demands iterative TV sessions across diverse SESs to populate the WMC-84 sufficiently for meaningful HC. Premature attribution is PV-9f ("Atomistic Fallacy").

  **5. HANDLING INTERPRETATIVE INDETERMINACY (IND)**
      5.1 **Mandate:** Recognition that multiple, incompatible belief/desire webs may equally satisfy PCA and HWV requirements. This is not an error state but an inherent feature of PLI.
      5.2 **Procedure:**
          *   5.2.1 Upon encountering persistent IND (e.g., Subject's utterances equally support interpretations "worships sun" or "fears sun"), FA initiates Indeterminacy Filing System (IFS-84) protocol.
          *   5.2.2 FA generates distinct, fully coherent Web Maps (using WMC-84 duplicates) for each viable interpretation (e.g., Map A: Sun-God Worship; Map B: Solar Phobia Complex).
          *   5.2.3 Both maps are submitted via IFS-84 Form Set C ("Certification of Equally Charitable & Holistic Interpretations").
          *   5.2.4 Bureau Linguistic Audit Division (LAD) certifies both interpretations as operationally valid for field purposes. **Note:** LAD assessment focuses solely on internal coherence and PCA adherence, not external "accuracy."
          *   5.2.5 Subject is automatically billed via Form IFS-84d ("Ambiguity Surcharge") for resource expenditure incurred due to IND. FA selects the interpretation yielding the simplest ongoing DDS.

  **6. REJECTION OF NON-STANDARD PERCEPTUAL ARRAYS (NSPA)**
      6.1 **Mandate:** Subjects cannot possess fundamentally different conceptual schemes or modes of perceiving/world-organizing. Apparent differences **must** be resolvable into shared, public SES referents via PCA and TV. Claims of "incommensurable worldview" are strictly prohibited (PV-1a, "Scheme/Content Distinction Violation").
      6.2 **Procedure:**
          *   6.2.1 Any FA experiencing intuition of radical difference (e.g., "Subject perceives smells as colors," "Subject categorizes objects by sound not form") **must immediately**:
              *   6.2.1.1 Re-initiate TV with simpler SES.
              *   6.2.1.2 Aggressively apply PCA via FCAL-84 self-revision (e.g., log: "Revised belief: Olfactory data *is* visually representable. Previous sensory modality separation erroneous.").
              *   6.2.1.3 Expand HWV to incorporate the revised FA beliefs and seek coherence.
      6.3 Persistent NSPA intuitions indicate FA failure, not Subject anomaly. Report for Re-Calibration (Psych Dept, Form RC-84).

  **7. ONGOING OPERATION & DOCUMENTATION**
      7.1 The PLI process is continuous. Each new utterance requires fresh TV, PCA via FCAL-84, HWV update, and IND assessment if applicable.
      7.2 The FA's own belief system, as documented in the FCAL-84, becomes the Bureau's primary ethnographic record. Subject's "native" belief system is the optimally charitable and holistic construct derived *through* the FA's revised lens. Original FA beliefs pre-PLI are archived as irrelevant.
      7.3 All forms (TVK-84a, FCAL-84 entries, WMC-84 sheets, IFS-84 sets) must be submitted in triplicate weekly. Incomplete documentation halts salary accrual.

  **END OF DOCUMENT**  
  **(Further revisions pending resolution of interpretative indeterminacy regarding the concept 'practicality')**
