answer: |-
  Your framing is sharp and perceptive—Russell *is* more complex than the standard utilitarian caricature. Let's break down your points:

  **1. The "Sovereignty-Utilitarianism" Hybrid: Coherent & Necessary**
  You're right to identify a non-negotiable core. Russell *does* treat sexual/relational self-determination as a foundational principle akin to a deontological constraint:
  *   **Property Rights Analogy:** His explicit comparison of traditional marriage to owning another person's body ("as a man owns a dog") frames this as a violation of fundamental personhood, not merely an inefficient arrangement. Sovereignty is the bedrock.
  *   **Sovereignty vs. Stability:** He argues social stability derived from possessive marriage is *illegitimate* because it's built on violating individual sovereignty. This isn't a utilitarian trade-off calculation where sovereignty could be outweighed by sufficient stability gains; sovereignty *trumps* stability built on ownership.
  *   **"Cannot Be Bartered":** This language is key. Sovereignty isn't subject to the utilitarian calculus; it's the right upon which the calculus must operate *around*. He optimizes welfare *within* the constraint of sovereign individuals freely associating.

  **This hybrid view makes him *more* coherent.** Without it:
  *   His vehement rejection of "ownership" becomes merely a preference within utility, potentially overridable by strong enough social benefits (which he denies).
  *   His critique shifts from a moral condemnation of violation to a mere critique of inefficiency.

  **2. Possessive vs. Expressive Attachment: Implicit in Russell**
  You're not importing this wholesale; it's **clearly implicit in his jealousy argument**:
  *   **"Learned" vs. "Instinctive":** Russell meticulously dissects jealousy. He argues the *destructive, proprietary* form dominating traditional marriage ("I own you, therefore no one else can touch you") is socially conditioned, rooted in the institution of ownership. This maps directly to **Possessive Attachment**.
  *   **The Alternative:** He contrasts this with what we could call **Expressive Attachment** – the natural pain of potential loss of a valued companion's affection or time. He sees *this* as a more natural, manageable feeling arising from love and investment in the relationship itself, not from ownership. He implies this form isn't inherently destructive and can coexist with greater freedom if the possessive element is unlearned.
  *   **Function in Argument:** This distinction is crucial for his case. If *all* jealousy were innate and possessive, his proposals would cause universal misery. By arguing possessive jealousy is *learned* (a product of the ownership model), he clears the ground for relationships based on expressive attachment and voluntary commitment, making non-possessive arrangements viable and potentially happier.

  **3. Does it Collapse into Utilitarianism in Practice?**
  Not entirely, but there's **tension**, primarily in his *optimism* about outcomes:
  *   **The Constraint Holds:** His core recommendations (abolishing legal penalties for adultery, no-fault divorce, acceptance of trial marriage, greater sexual freedom *before* commitment) stem from the sovereignty principle. Law shouldn't enforce ownership.
  *   **The Utility Optimism:** Where the hybrid shows strain is in his *confidence* that removing ownership structures will *automatically* lead to less destructive jealousy (expressive attachment prevailing), greater honesty, deeper love, and thus *greater net happiness*. He struggles to fully grapple with cases where sovereign choices might lead to significant, non-possessive pain that isn't easily "unlearned," or where expressive attachment itself creates complex conflicts in non-monogamous settings. His utilitarian optimism sometimes *assumes* the sovereignty constraint leads seamlessly to the best outcomes, potentially downplaying the messy reality of human emotions even without ownership. The *justification* for the structure (sovereignty) remains distinct, but his *prediction* of overwhelmingly positive utility gains feels like a strong hedge.

  **4. Linking to Relational Autonomy: Illuminating, Not Anachronistic**
  This is **highly illuminating**, with a crucial nuance:
  *   **Core Resonance:** Russell's assault on the "property model" of marriage and his emphasis on relationships formed through free choice and negotiation, not coercion (legal or social) based on ownership, is fundamentally about **relational autonomy**. He champions individuals defining the terms of their intimate bonds based on mutual respect and consent, free from external, ownership-based scripts. This is the heart of relational autonomy.
  *   **Nuance:** Modern relational autonomy theory often incorporates more complex analyses of power dynamics, social embeddedness, and internalized oppression than Russell explicitly provides. He tends toward a more individualistic, Enlightenment-informed view of autonomy.
  *   **Why it Works:** Linking him highlights his *prescient critique* of how traditional marriage law and morality violated autonomy by constructing relationships as property rights. It shows he grasped the core problem modern relational autonomy addresses: the need for intimate relationships to be structures of freely chosen connection, not domination or possession. It's not anachronistic to point out he identified a fundamental problem and solution space that relational autonomy theory later developed more fully.

  **Conclusion:**
  Your "sovereignty-utilitarianism" framing is robust and necessary to capture Russell's argument. The possessive/expressive attachment distinction is implicit and crucial to his critique of jealousy. This hybrid view enhances his coherence by grounding his most radical claims in a non-negotiable principle. While his utilitarian optimism about outcomes creates some tension, the sovereignty constraint remains structurally distinct in his reasoning. Linking him to relational autonomy theory is insightful, revealing his foundational critique of ownership in relationships as a violation of self-determination – a core concern of autonomy theorists. Your analysis moves beyond the simplistic utilitarian reading to capture the deeper, more radical, and philosophically richer argument Russell was making.
