     - If the event at 0.5 happened, then state at 0.5+ is OFF, so at 1.0- it is OFF, then toggle to ON.
     - If the event at 0.5 did not happen, then state at 1.0- is ON, then toggle to OFF.

   So the state after 1.0 event could be ON or OFF. And this affects downstream.

   Therefore, they cannot compute.

   So in the distributed system, if there is any gap, they cannot determine the state after that gap.

   So to make it work, we remove one event from each node's log, and ensure that at least one of the missing events is early (e.g., within the first few events) so that almost the entire sequence after is unknown.

   Then when they try to simulate, they will get stuck at the first gap.

   So the activity becomes: they try to simulate the state in order, but when they hit a gap, they stop.

   Then they realize they cannot determine the state at the end.

   This is workable.

  **Adjusted Rules:**
  - Each node has a consecutive chunk of events, but missing one event.
  - The missing event is not the very first or very last in the chunk, but somewhere in the middle.
  - Then when they try to merge the logs and sort by time, they will see gaps.
  - Then when they try to compute the state, they can start from the initial state (OFF) and simulate until they hit the first gap. At that gap, they don't know the state, so they cannot continue.

   Therefore, they cannot compute the final state.

   We also don't reveal the intended number of events? Or we can, but it doesn't help because the simulation gets stuck at the first gap.

   So we can keep the fact that there are 240 intended events.

  ** instructions to participants:**
    - "The lamp started OFF. We have event logs from the distributed system. Each event is a toggle at a specific time. You must simulate the state of the lamp in sequence from time 0.0 to time 119.5. The final state at time 120.0 is what you need."

    - They will see that when they reach a time for which they have no event, they don't know whether to toggle or not, and they don't know the current state to toggle from.

  ** example:**
    - Suppose they have events: [0.0, 1.0, 2.0] but missing 0.5.
    - They start at 0.0: OFF -> toggle to ON.
    - Then next event should be 0.5, but it's missing. So what is the state at 0.5? They don't know. They might assume it stayed ON? But they know an event was scheduled at 0.5. They don't know if it happened.

    So they are stuck.

   Therefore, the activity should work.

  **Revised missing event distribution:**
    - For each node's consecutive chunk, remove one event that is not the first or last. For example, in a chunk of events for times 0.0, 0.5, 1.0, ... 11.5, remove the event at 6.0.

   Then when they aggregate, there are gaps. The simulation cannot get past the first gap.

  ** during the activity, you might need to clarify:**
    - "To compute the state at time 120.0, you need to know the state after each event. If you don't have an event at a particular time, you don't know if the toggle happened at that time, and you don't the state after that time."

   So with this, they cannot compute.

  ** one more issue: **
    - If they assume that missing events means the toggle did not happen, then they can continue. But that's one possible assumption. They might make that assumption and then compute a state. But then another node might assume differently.

   So in the activity, we should not tell them whether missing events mean the toggle happened or not. We should leave it ambiguous.

   Exactly as in the distributed system where they might not know if the event was lost or the toggle skipped.

   Therefore, they will have to either assume or leave unknown.

   The safe answer is UNKNOWN.

   Hopefully, they will reach a consensus on UNKNOWN.

  ** in the debrief, we then say:**
    - "In the distributed system, the missing events made it impossible to determine the state. In Thomson's lamp, even if you have all the events (infinitely many), the state at the limit is undefined because the state does not settle on a value. So our distributed version encountered a practical uncertainty, while the philosophical one encounters a theoretical uncertainty."

  **Summary of the Activity Setup:**

  1. **Materials:**
     - 10 envelopes.
     - Master list of 240 events: times 0.0, 0.5, ... 119.5.
     - Split into 10 chunks of 24 consecutive events.
     - For each chunk, remove one event that is not the first or last (e.g., if the chunk is times 0.0 to 11.5, remove event at 6.0).
     - Each envelope gets the remaining 23 events for one chunk.

  2. **Rules to Participants:**
     - The lamp started OFF at time 0.0 (before any toggle).
     - Events are toggles at specific times.
     - Your goal: determine the state at time 120.0 (after all toggles).
     - You have partial logs. Communicate to reconstruct the event sequence as much as possible.
     - You may find gaps in the sequence. For times where there is no event in the logs, you do not know whether a toggle happened or not.
     - After 10 minutes, each node must write down:
          - The lamp state at 120.0: ON, OFF, or UNKNOWN.
          - (Optional) a brief reason.
     - You should try to reach a group consensus.

  3. **Payoff:**
     - If the entire group agrees on the same answer (ON, OFF, or UNKNOWN), then each node gets 10 points.
     - Additionally, if a node writes UNKNOWN and the reason mentions missing events or gaps in the event sequence causing uncertainty, they get 5 bonus points.

  4. **Debrief:**
     - Have participants share their answers.
     - Reveal that there were 10 missing events (permanently lost) and that these were spread throughout the sequence.
     - Explain that the simulation couldn't proceed after the first gap.
     - Map to Thomson's lamp: "In our activity, the finite number of toggles had a clear answer if we had complete information. But the distributed system introduced gaps, making the state unknown. In the actual Thomson's lamp, we have an infinite number of toggles in finite time, and even with complete information, the state at the limit is undefined because the sequence of states doesn't converge. So both situations have no fact of the matter, but for different reasons: gaps in data versus non-convergence."

     - Honest note: "Our activity can't reproduce the infinite number of toggles and the non-convergence. We only reproduced the effect of missing data."

  5. **Predictable Problems:**
     - Participants might assume that missing events mean the toggle did not happen. Then they might simulate and get a state, and then agree on that state. Then they will have consensus on ON or OFF. In the debrief, you can point out that they made an assumption. The point is that without the data, they don't know, so any assumption is arbitrary.
     - Participants might spend too long trying to collect the logs and not start simulating.
     - Some nodes might have chunks that are later in time. If the first gap is in an early chunk, but that chunk is held by a node that hasn't shared yet, they might not see the gap immediately. So encourage them to sort the events by time early on.

   We hope they hit the first gap and realize they are stuck.

   This should take about 20-30 minutes including the debrief.
