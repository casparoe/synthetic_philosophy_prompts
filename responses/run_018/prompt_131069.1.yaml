  hey, i'm applying for a small six-month philosophy-of-ai grant and need a tight two-page proposal. my half-baked idea is about coherent extrapolated volition and whether it can survive being moved from a single mind to a plural or institutional agent.

  the precise question: are the coherance conditions that ground CEV—consistency, reflection under extrapolation, and value-stability—agent-relative in a way that makes multi-agent or intertemporal collective extrapolation conceptually impossible? or do they generalize, in which case does CEV just collapse into idealized preference aggregation? i want to know if there's a principled break point, not just a technical one.

  why existing answers dont settle it: the literature mostly treats extrapolation as individual rationality—what you'd want if you were smarter, knew more, etc. social-choice analogues exist but they dont ask whether the coherence chain itself requires a unified subject of experience. if reflection presupposes a single self that can recognize its own values, then institutional CEV might be a category error, not just hard.

  approach, mounth by mounth: month 1 formalize the single-agent coherence conditions precisely without importing heavy math; month 2 construct institutional analogues (intertemporal democratic preferences, federated value structures); month 3 isolate where the chain breaks—probably reflection or value-drift across members; month 4 check if repairing it requires empirical psychology or collapses into voting; month 5 draft the argument; month 6 stress-test against the "just aggregate preferences" objection.

  what counts as success: either showing collective CEV is coherent but needs a revised coherence condition, or showing the agent-relativity is irreducible. failure: if the only fix is "run an election" or if i have to solve Arrow-style impossibility results to make progress.

  scope reality check: this is conceptual, not formal, but i need to flag what makes it blow up—probably trying to formalize collective preference dynamics. also no bibliographies needed, i'll fill citations later.
