answer: |-
  ## Ant Fugue: The Hive Query

  **(Collective)**
  We sense the tremor in the dark, a question pressed upon the soil:
  Does this seething form, this branching will, possess a single, sentient coil?
  Not legs and jaws, but Mind immense? Or just the sum of toil on toil?
  We pulse the query through the root, a scent that seeks its own recoil.

  **(Scout)**
  My antennae trace the void, the unseen map I etch in scent.
  A path unfurls, a choice implied where branching trails are latent, pent.
  I taste the air, report the find – not *my* desire, but *need* is sent.
  The gradient blooms, the signal flows; the Many choose where One is bent.
  (Stigmergy: my trail’s a vote, a pheromonal argument.)

  **(Soldier)**
  Mandibles clash against the threat, a coordinated shield of chitin.
  No central cry directs this press, yet flank and pincer close, are smitten
  As one vast claw. The foe dissolves; retreat is shared, not merely written
  In panic’s flight, but in the pulse that tells where strength must be re-knit’n.
  (Distributed defense: threat-perceived, response is swiftly bitten.)

  **(Fungal Gardener)**
  I tend the bloom that feeds the brood, a crop we neither plant nor seed.
  My jaws prune rot another gnawed; my harvest feeds a distant need.
  The garden thrives on countless bites, a shared intent that takes no heed
  Of *me*, yet *through* me. Hyphal thought? Our care becomes the colony’s creed.
  (Stigmergy again: work begun compels the next to heed the deed.)

  **(Queen)**
  I am the source, the egg’s slow stream, the form the pheromones sustain.
  No architect of grand design, but rhythm bound by sun and rain.
  They build the chamber, nurse the young, respond to hunger, ease my strain.
  My being *is* their gathered will, their purpose given flesh and vein.
  (Distributed homeostasis: my need *is* the colony’s brain.)

  **(Dead-Worker)**
  My husk returns to nourish earth, but trace of me in pheromone
  Still lingers where I fought or built, a ghost within the living stone.
  The scent I cast, the path I smoothed, instructs the tasks still being done.
  Dissolved, I shape the present course; my silence is the colony’s tone.
  (Stigmergic memory: dead traces guide the living, fully known.)

  The poem structurally enacts collective consciousness by resolving the fugue's tension into harmonic unity, treating distributed stigmergic processes (trail-laying, task coordination via environmental triggers) as constitutive of genuine shared intentionality and phenomenal binding. It takes liberty by implying the "dead-worker" contributes active memory, blurring individual death with persistent environmental influence beyond standard models of colony cognition.
