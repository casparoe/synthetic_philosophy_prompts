  ## Prohibition Through Plato's Lens: A Civic Diagnostic Suppressed & Distorted

  Plato's *Laws* I-II presents a provocative theory of regulated drinking as a civic diagnostic tool. Applying this framework rigorously to American Prohibition reveals profound tensions and ultimately suggests Plato's model, while insightful, presupposes conditions irreplicable in a modern federal state.

  **Plato's Framework:**
  1.  **Wine as Diagnostic Tool:** Moderate, *regulated* drinking within the symposion (drinking party) reveals citizens' inherent character – temperate or prone to excess (*akrasia*).
  2.  **The Symposiarch's Role:** A sober, authoritative figure (the symposiarch) observes, moderates, and *interprets* the behavior, guiding the gathering and identifying valuable civic data about self-control and susceptibility to corruption.
  3.  **Unregulated Drinking as Disease:** Without this controlled environment and authoritative oversight, intoxication becomes a "political and bodily disease" fostering shamelessness, violence, and civic disintegration.
  4.  **Goal:** Not suppression, but regulated *exposure* under observation to cultivate moderation and identify vulnerabilities within the safe confines of ritual.

  **Mapping Prohibition onto Plato's Framework:**

  1.  **The "Symposiarch" Vacancy (The Critical Failure):**
      *   **Plato's Requirement:** A trusted, sober, authoritative observer/moderator (symposiarch).
      *   **Prohibition Reality:** The state (acting as a *prohibitor*, not a *moderator*) abdicated this role entirely. By banning alcohol, it removed the very *context* for the diagnostic symposion. **No one assumed the symposiarch's observational and moderating role.**
      *   **Consequence:** The essential civic diagnostic function – observing citizens' relationship with alcohol under controlled guidance – was eliminated, not transferred. Law enforcement (police, Prohibition agents) played a role of *suppression and punishment*, not *observation and moral guidance*. They lacked the symposiarch's intimate civic knowledge and purpose.

  2.  **Driving the Diagnostic Underground (The Empirical Shift):**
      *   **Plato's Fear:** Unregulated drinking leads to disease.
      *   **Prohibition Reality:** Prohibition didn't suppress vice; it drove the diagnostic underground into speakeasies and clandestine consumption.
          *   **From Public Saloons to Speakeasies:** The regulated (though often problematic) public space of the saloon, where behavior was *somewhat* observable (by bartenders, peers, community), was replaced by hidden, unregulated environments. Speakeasies prioritized secrecy, not observation or moderation. There was no equivalent to the symposiarch; the "owner" or "bouncer" aimed for profit and avoiding raids, not civic assessment.
          *   **Rise of Organized Crime:** Black-market distribution networks (e.g., Capone's empire) became the de facto "suppliers," utterly divorced from any civic purpose. Their "authority" was based on violence and profit, not wisdom or the common good. They encouraged excess consumption to maximize illicit profits.
          *   **The Diagnostic Suppressed:** Drinking occurred, but in environments deliberately designed to *avoid* observation by legitimate civic authority. The "true nature" Plato sought to reveal was hidden, distorted by the context of illegality, secrecy, and the profit motive. Excess was not moderated; it was often *facilitated*.

  3.  **The Players:**
      *   **The Drinker:** The American citizen (though participation varied significantly).
      *   **The (Absent) Symposiarch:** **Vacant.** The state prohibited instead of moderating. Law enforcement punished instead of observing diagnostically. No trusted civic figure filled this role in the illicit spaces.
      *   **The Polity:** The vast, diverse, and increasingly anonymous American nation-state, fundamentally different from Plato's small, intimate *polis* bound by shared rituals and a known ruling class.

  **Reversing the Analysis: What Prohibition Reveals about Plato's Model**

  1.  **Confirmation of Regulated Exposure over Suppression:** Prohibition's catastrophic failure – rampant crime, public health disasters (poisoned alcohol), widespread disrespect for law, and the *failure* to eliminate drinking – strongly supports Plato's core aversion to outright suppression (Laws II, 674a). It demonstrated that suppression:
      *   Doesn't eradicate desire; it drives it underground and empowers criminal elements.
      *   Removes the possibility of *learning* and cultivating moderation through regulated practice and observation.
      *   Creates worse societal ills than the regulated vice it sought to eliminate.

  2.  **Exposing Plato's Presuppositions (The Model's Limits):** Prohibition starkly reveals that Plato's framework relies on conditions absent in a modern liberal democracy:
      *   **Small-Scale Civic Intimacy:** Plato's symposiarch knows the citizens personally. In a nation of millions, such intimate knowledge by a central authority is impossible. Anonymity is the norm.
      *   **Shared Ritual Authority & Cultural Homogeneity:** The symposion assumes shared cultural values and acceptance of the ritual's purpose and the symposiarch's authority. Prohibition-era America was deeply divided, heterogeneous, and lacked consensus on the law itself, let alone a shared ritual framework for drinking.
      *   **A Trusted, Unified Ruling Class:** Plato's model presupposes a ruling class (the symposiarch being part of it) that is wise, trusted, and acting for the common good. Prohibition was enacted by a distant federal government, enforced by agents often seen as corrupt or intrusive, and opposed by significant portions of the population. Trust in the "rulers" was fractured.
      *   **Silence on Scale and Illicit Markets:** Plato doesn't grapple with the dynamics of mass society, federalism, or the rise of powerful, violent criminal syndicates filling the vacuum created by suppression. His model operates within the bounds of the *polis*, not against a backdrop of organized crime controlling a forbidden substance on a national scale.

  **Conclusion: Outside, but Illuminating**

  Prohibition **ultimately lies significantly outside Plato's conceptual architecture**, primarily due to the **vacancy of the symposiarch role** and the **radically different scale and nature of the polity**. Plato presupposes a small, integrated community where a trusted authority can observe and guide behavior within a shared ritual. The modern American federal state cannot replicate this intimacy, shared ritual authority, or trusted ruling class necessary for the symposion-as-diagnostic to function as Plato envisioned.

  However, Prohibition **powerfully confirms Plato's fundamental insight** that **outright suppression is a dangerous and counterproductive strategy** compared to regulated exposure and cultivation of moderation. It demonstrates that driving a behavior Plato saw as diagnostically valuable underground prevents any beneficial civic observation or guidance, unleashing the very "political and bodily disease" – rampant crime, social disorder, violence, and public health crises – that he feared from *unregulated* drinking. While Plato's specific civic ritual cannot be transplanted, his profound warning against the hubris of prohibition, born from his understanding of human nature and the need for managed exposure, is validated by the American experiment. Prohibition shows what happens when the diagnostic tool is banned rather than wisely wielded.
