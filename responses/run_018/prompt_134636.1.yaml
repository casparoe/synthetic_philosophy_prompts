answer: |-
  This arts council's policy reveals a deeply confused, inconsistent, and likely hypocritical view of art and morality, masking bureaucratic convenience and risk aversion behind a facade of aesthetic purity. Here's the implicit theory, its incoherence, and what genuine separation would require:

  **The Implicit Theory & Its Contradictions:**

  1.  **"Moral Stain" is Temporal & Contextual (for the Artist):** The 50-year sunset clause suggests moral culpability attached to the *artist* diminishes or becomes irrelevant over time – specifically, 50 years after death. This implies:
      *   **Historical Distance:** Society's judgment softens; the artist becomes a "historical figure" rather than a living threat or beneficiary.
      *   **Lack of Direct Benefit:** The artist can no longer profit or gain notoriety from the display.
      *   **Audience Complicity Shift:** Engaging with the work is no longer seen as directly supporting the *living criminal*, absolving the audience/council of complicity. This aligns with their implied concern about living fraudsters "cashing in."

  2.  **"The Canvas" is Separate... Until It Isn't:** The claim to judge "only the canvas" is immediately contradicted by:
      *   **The Sunset Clause Itself:** If the canvas is truly separate, why does the *artist's* death (let alone 50 years after) matter at all? The ban on living artists proves the biography *is* the primary filter, not the canvas.
      *   **Refusing Protest-Damaged Works:** This is the glaring contradiction. By refusing to restore art damaged *because of the artist's politics*, the council implicitly accepts that:
          *   The artwork *is* politically charged due to its creator.
          *   The damage *is* part of its history and meaning.
          *   Restoring it *would* be seen as endorsing or rehabilitating the artist's message, making the council complicit in that message. They suddenly treat the work and the artist's ideology as inseparable.

  3.  **Hierarchy of Crimes & Political Expediency:**
      *   **War Crimes vs. Fraud:** The policy treats fraud by a *living* artist as an absolute bar, but mass atrocities by a *dead* artist (after 50 years) are acceptable. This suggests:
          *   Financial dishonesty directly related to the *art market* is an immediate practical concern they want to avoid.
          *   Horrific violence is somehow "sanitized" by time and death, becoming abstract history rather than a present moral issue tied to the work.
      *   **Protest Damage:** Reacting to protest damage shows the council fears *current* political backlash and controversy more than historical moral judgment. They prioritize institutional safety over their stated principle when faced with active public anger.

  **Coherence Assessment: Utterly Incoherent & Likely Bureaucratic Cover**

  *   **Self-Contradictory:** The core claim of separating art from artist is demolished by the sunset clause and obliterated by the protest-damage exception. They apply the separation principle arbitrarily and inconsistently.
  *   **Arbitrary Timelines:** The 50-year rule lacks philosophical or moral justification. Why not 25, 100, or eternity? It reeks of bureaucratic convenience ("long enough ago").
  *   **Inconsistent Moral Weight:** Prioritizing the prevention of living fraudsters profiting over the display of art linked to mass atrocities reveals a warped moral calculus focused on proximate, market-related risks rather than the inherent gravity of the crimes.
  *   **Hypocrisy:** The protest-damage refusal exposes their true priority: avoiding *current* controversy. They are happy to separate art and artist when the artist is safely distant (dead 50+ years), but when the artist's ideology is still potent enough to provoke *current* protests damaging the art, they suddenly embrace the connection to avoid trouble.

  **This is not a coherent theory of art and morality. It's primarily bureaucratic risk management and historical sanitization disguised as an aesthetic principle.**

  **Rules for Genuine Separation of Art and Artist:**

  If the council genuinely believed art and artist *could* be separated cleanly, their rules would need radical simplification and consistency:

  1.  **Eliminate Artist Biography as a Criterion:** Remove *all* rules based on the artist's moral character, crimes, or status (living/dead). Acquisition and display decisions would be based **solely** on:
      *   Artistic merit, quality, and significance (aesthetic value).
      *   Historical importance within art movements.
      *   Technical condition and conservation needs.
      *   Fit within the collection's mission/curatorial focus.
  2.  **Abolish the Sunset Clause:** The artist's death or the passage of time becomes irrelevant. A painting by a living war criminal would be judged by the same criteria as one by a dead saint.
  3.  **Restore Based on Conservation Ethics, Not Politics:** Restore damaged works based *only* on:
      *   The intrinsic value of the artwork itself.
      *   Conservation best practices.
      *   The significance of the damage to the work's material history (which might include documenting protest damage as part of its history, *without* letting that political context dictate the *decision* to restore).
  4.  **Contextualize, Don't Censor:** Acknowledge the artist's biography and crimes in didactic materials, exhibitions, and publications as *context*, explicitly stating this information does not determine the work's display-worthiness but is provided for historical understanding. The *display decision itself* remains based on the work's artistic merits.
  5.  **Address Complicity Transparently:** If displaying art by morally reprehensible individuals raises concerns about complicity or endorsement, address this *openly* in programming and interpretation, rather than using biographical bans as a covert solution. The principle remains: the *art* is displayed for its own sake, the *context* is provided for understanding.

  **In essence:** Genuine separation requires **absolute consistency**. The artist's life and deeds become *contextual information*, not *acquisition criteria*. Decisions are made purely on the perceived artistic value and conservation needs of the physical object and its place in art history, regardless of who made it, when they made it, what they did, when they died, or how people reacted to it. The council's current policy fails this test spectacularly, revealing a practice driven by convenience, risk aversion, and an unacknowledged belief that time washes away bloodstains but not the taint of fraud committed against the art market.
