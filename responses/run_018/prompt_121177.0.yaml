  We are drafting an adversarial collaboration document. The goal is to have two parties (SSA advocate and SIA advocate) agree on a set of claims and then clearly state their disagreements with testable predictions.

  Structure:
  1. Agreed Claims (numbered)
  2. Disagreements Table (with columns: Crux, SSA Position, SIA Position, Shared Case/Argument, SSA Prediction, SIA Prediction)
  3. Short closing on verbal disputes
  4. "What would move each of us" section

  We must address the user's specific cases (Relay and Pre-Registration) and the cruxes (a,b,c,d).

  Agreed Claims Section:
  - We need a neutral statement of SSA and SIA.
  - Agreed toy cases: Sleeping Beauty, Presumptuous Philosopher, Doomsday.
  - What each principle delivers in these cases.
  - What the formalism doesn't decide.

  Disagreements Table:
  - Cruxes: (a) Scope of disagreement (only when observer count differs?); (b) Is SIA's boost a cost?; (c) Handling infinity; (d) Ex ante choice (including Relay and Pre-Registration cases).

  For the Relay and Pre-Registration cases, we must:
  - Describe them neutrally.
  - State each side's verdict and whether they come apart.
  - Check for framing issues.

  Meta-note at the end: point out which formulation might be refused and where the drafter's reasoning might be wrong.

  Let's begin.

  ## Adversarial Collaboration: SSA vs SIA

  ### 1. Agreed Claims

  Both parties agree on the following:

  1. **Definitions**: 
     - The **Self-Sampling Assumption (SSA)** states: When reasoning about one's own position in the universe, one should reason as if one were a random sample from the set of all actual observers in a suitable reference class.
     - The **Self-Indication Assumption (SIA)** states: The fact that one exists is evidence that favors hypotheses under which more observers exist. Formally, SIA can be implemented by weighting hypotheses by the number of observers they imply, and then applying SSA.

  2. **Reference Class**: Both parties agree that the choice of the reference class (e.g., which beings count as "observers") is a separate issue that must be specified for SSA, and that SIA also requires a reference class. They agree that the principles themselves do not specify the reference class, and that disagreements about the reference class are orthogonal to the core dispute.

  3. **Toy Cases and Predictions**:
     - **Sleeping Beauty (SB)**:
       - *Setup*: Beauty is put to sleep on Sunday. A fair coin is flipped. If Heads, she is awakened on Monday only. If Tails, she is awakened on Monday and Tuesday, but with amnesia between awakenings. Each awakening she is asked for her credence that the coin was Heads.
       - *SSA*: Assigns 1/3 probability to Heads. Reasoning: There are three possible awakenings (Heads-Monday, Tails-Monday, Tails-Tuesday), each equally likely from her perspective. Only one is Heads, so P(Heads)=1/3.
       - *SIA*: Also assigns 1/3 to Heads. (Note: SIA in the usual SB setup does not change the result because the total number of observers does not differ between hypotheses. Both Heads and Tails have one Beauty, but Tails has two awakenings. However, some SIA formulations might consider awakenings as distinct observer-moments, so both sides agree on 1/3 in this case.)

     - **Presumptuous Philosopher (PP)**:
       - *Setup*: Two theories about the universe: Theory A says that the universe contains a trillion observers. Theory B says it contains a trillion trillion observers. We have evidence that is equally likely under both theories. What is the probability of A vs B?
       - *SSA*: Assigns equal probability to A and B. Reasoning: We are a random sample from the actual observers. The fact that we exist doesn't tell us about the total number because the reference class is fixed to the actual set.
       - *SIA*: Assigns overwhelmingly higher probability to B. Reasoning: Our existence is more likely if there are more observers, so we update in favor of B.

     - **Doomsday Argument (DA)**:
       - *Setup*: Let the total number of humans that will ever exist be N. We are equally likely to be any of the N humans. We observe our birth rank n. What does this suggest about N?
       - *SSA*: We are a random sample, so we are likely to be somewhere in the middle of the human population. Thus, observing a low birth rank n suggests that N is not much larger than 2n (or similar). This is the classic Doomsday Argument: it predicts that humanity is likely to end sooner rather than later.
       - *SIA*: The fact that we exist gives strong evidence for larger N. This effect can cancel or even reverse the Doomsday Argument. In fact, typical SIA-based reasoning leads to the conclusion that our birth rank n provides very little information about N.

  4. **Formalism Limitations**: Both parties agree that:
     - Neither principle, by itself, resolves how to handle infinite observer populations (without additional machinery, e.g., limiting densities or measure-theoretic approaches).
     - The principles are typically framed as evidential (updating rules for credences) but can be extended to decision-making. However, the core dispute is about evidential reasoning.

  5. **Common Ground**: Both parties agree that:
     - In cases where the total number of observers is the same under all hypotheses, SSA and SIA typically yield the same results.
     - The principles are intended for self-locating uncertainty, not just any uncertainty.

  ### 2. Disagreements Table

  We now present the key points of disagreement. Each row addresses a crux. We include a shared case or argument that both accept as bearing on the crux, and then each side's prediction.

  | Crux | SSA Position | SIA Position | Shared Case/Argument | SSA Prediction | SIA Prediction |
  |------|--------------|--------------|----------------------|---------------|---------------|
  | **(a) Scope of Disagreement**: Does the SSA/SIA disagreement only arise for hypotheses that differ in the number of observers? | The disagreement is primarily about cases where the total number of observers varies. However, SSA can be applied to other self-locating uncertainties (e.g., being in a particular room in a hotel) without invoking SIA. | The disagreement is mainly about how to account for observer counts. However, SIA's effect is only present when observer counts differ. | Consider a case with two identical rooms: Room A and Room B. You wake up and are told that a coin flip determined which room you are in. Both rooms have the same number of observers (one). What is your credence that you are in Room A? | SSA: 50%. Reasoning: You are a random observer, and there is one observer in each room. | SIA: 50%. Reasoning: The observer count is the same, so no update. Both agree. But note: If the rooms had different numbers of observers, SSA and SIA would differ. |
