answer: |-
  ### Adversarial Collaboration: SSA vs. SIA  
  **Joint Statement**  

  #### 1. Agreed Claims  
  Both signatories endorse the following statements as foundational to the debate:  

  1. **Core Definitions**:  
     - **Self-Sampling Assumption (SSA)**: Treat yourself as a random sample from the set of all actual observers within a well-defined reference class. Formally, for hypothesis \(H\) and reference class \(R\), the probability of being observer \(O_i\) given \(H\) is \(P(O_i | H) = 1 / N_H\), where \(N_H\) is the number of observers in \(R\) under \(H\).  
     - **Self-Indication Assumption (SIA)**: The fact that you exist provides evidence in favor of hypotheses that imply more observers. Formally, \(P(H) \propto P_{\text{prior}}(H) \times N_H\), where \(N_H\) is the number of observers in \(R\) under \(H\). SIA is an update to the prior, not a sampling procedure.  

  2. **Reference Class Agreement**:  
     - Both principles require specifying a reference class (e.g., "humans," "observer-moments"). Neither principle defines this class; it is an independent input. Disagreements about the reference class are separable from disputes over SSA vs. SIA.  

  3. **Toy Cases & Predictions**:  
     - **Sleeping Beauty (SB)**:  
       - *Setup*: Beauty is told a fair coin was flipped. Heads: she is woken once (Monday). Tails: she is woken twice (Monday and Tuesday), with amnesia between. Upon waking, what is her credence for Heads?  
       - *SSA*: \(P(\text{Heads}) = 1/3\). Reasoning: Three possible awakenings (H-Mon, T-Mon, T-Tue), each equally likely.  
       - *SIA*: \(P(\text{Heads}) = 1/3\). Reasoning: Observer-count (1 for Heads, 2 for Tails) adjusts the prior; \(P(\text{Heads}) \propto (0.5 \times 1) / [(0.5 \times 1) + (0.5 \times 2)] = 1/3\).  
     - **Presumptuous Philosopher (PP)**:  
       - *Setup*: Theory A predicts \(10^{12}\) observers; Theory B predicts \(10^{24}\). No evidence favors either. What is \(P(A)\)?  
       - *SSA*: \(P(A) = 0.5\). Reasoning: You are a random sample; no update for total observers.  
       - *SIA*: \(P(A) \approx 10^{-12}\). Reasoning: Prior weighted by observer count; \(P(A) \propto 0.5 \times 10^{12}\), \(P(B) \propto 0.5 \times 10^{24}\).  
     - **Doomsday Argument (DA)**:  
       - *Setup*: Total humans ever is \(N\). You observe birth rank \(n\). What does this imply for \(N\)?  
       - *SSA*: \(N\) is likely near \(2n\) (Doomsday conclusion). Reasoning: Random sampling implies median birth rank \(\approx N/2\).  
       - *SIA*: \(n\) provides little information about \(N\). Reasoning: Existence evidence favors large \(N\), counteracting SSA.  

  4. **Formalism Boundaries**:  
     - Both principles are **evidential rules** for updating credences in self-locating uncertainty. Neither is inherently a decision rule.  
     - Neither principle resolves **infinite observer populations** without additional tools (e.g., densities, measure theory).  
     - Disagreement arises **only when hypotheses differ in observer counts**. When counts match, SSA and SIA agree.  

  ---  

  #### 2. Disagreements Table  
  Each row addresses a crux with neutral framing, positions, a shared test case, and predictions.  

  | Crux | SSA Position | SIA Position | Shared Test Case | SSA Prediction | SIA Prediction |  
  |------|--------------|--------------|------------------|----------------|----------------|  
  | **(a) Scope of Disagreement**: Does SSA vs. SIA disagreement extend beyond observer-count differences? | Disagreement is *exclusively* tied to observer-count differences. SSA applies broadly to self-locating uncertainty (e.g., location in space), but SIA only activates for observer-count variation. | Disagreement arises *whenever* observer counts differ, but SIA's core role is to handle selection effects in existence questions. It has no effect where counts match. | **Identical Rooms**: Two rooms, A and B, each with one observer. A coin flip determines your room. What is \(P(\text{you are in A})\)? | \(P(\text{A}) = 0.5\). SSA treats observers symmetrically; no observer-count difference. | \(P(\text{A}) = 0.5\). SIA adds no update where observer counts are equal. |  
  | **(b) SIA's Boost to Large Worlds**: Is SIA's favor toward large-\(N\) hypotheses a flaw or a correction? | SIA's boost is a *cost*: It violates indifference, favoring complex theories without evidence (e.g., PP). It amplifies unsupported claims (e.g., multiverse theories). | SIA's boost is a *correction* for selection bias. Ignoring it underweights large-\(N\) hypotheses (e.g., in DA). It aligns with evidence we exist. | **Presumptuous Philosopher (PP)**: Theories A (\(N=10^{12}\)) and B (\(N=10^{24}\)) have equal prior probability. What is \(P(A)\)? | \(P(A) = 0.5\). SSA: No update for unobserved observers. | \(P(A) \approx 10^{-12}\). SIA: Existence is evidence for B. |  
  | **(c) Handling Infinite Observers**: How do SSA/SIA handle infinite populations? | SSA requires finite densities: E.g., in infinite space, \(P(\text{location}) \propto \text{density}\). Without densities, probabilities are undefined. | SIA faces problems: Weighting by \(N\) fails for infinite \(N\). Solutions (e.g., SIA-Density) are ad hoc. Infinity reveals flaws in both. | **Infinite Universe**: Half of planets host 1 observer, half host 2. What is \(P(\text{you are on a 1-observer planet})\)? | \(P(1) = 0.5\). SSA: Equal fraction of planets. | \(P(1) = 1/3\). SIA: Weight by observers; 2x more in 2-observer planets. |  
  | **(d) Ex Ante Choice**: Which rule would agents choose pre-observation? | Agents choose SSA: It avoids SIA's extreme updates (e.g., PP) and reflects objective chances. SIA leads to unstable group decisions. | Agents choose SIA: It maximizes calibration with observations (e.g., DA). SSA ignores existence evidence, causing misestimation. | **Pre-Registration**: Pre-copying, you and \(N\) future copies agree on a rule. Which rule is chosen? (Case: Coin flip; Heads: 1 copy, Tails: 1000 copies.) | Choose SSA. Upon waking, \(P(\text{Heads}) = 1/1001\)—avoids "double-counting" existence. | Choose SIA. Upon waking, \(P(\text{Heads}) = 1/1001\)—but SIA's prior adjustment is essential for accuracy. |  
  | **(d) Relay Case**: Do SSA/SIA diverge in sequential amnesiac lives? | **Relay Setup**: Coin flip: Heads (1 life), Tails (1000 lives, amnesia between). You are early in the sequence. What is \(P(\text{Heads})\)?  
       - *SSA Prediction*: \(P(\text{Heads}) = 1/1001\). Reasoning: Treat each life as an observer; sample from all lives.  
       - *SIA Prediction*: \(P(\text{Heads}) = 1/1001\). Reasoning: Prior weighted by lives: \(P(\text{Heads}) \propto 0.5 \times 1\), \(P(\text{Tails}) \propto 0.5 \times 1000\).  
       - *Agreement*: No synchronic divergence. "Early" position is irrelevant—no update for indexical information.  

  ---  

  #### 3. Verbal Disputes  
  Both parties agree that aspects of the debate are verbal:  
  - **"Observer" definition**: Disputes about reference class (e.g., "observer-moments" vs. "persons") are orthogonal. SSA and SIA inherit this ambiguity equally.  
  - **Evidential vs. Decision Rules**: The core disagreement is evidential. SSA and SIA are *not* decision rules; betting behavior (e.g., in SB) requires separate principles (e.g., "no double-counting").  
  - **"Existence Evidence"**: SIA advocates frame existence as evidence; SSA advocates see this as question-begging. This is terminological—both agree it implies observer-count weighting.  

  ---  

  #### 4. What Would Move Each of Us  
  - **SSA Advocate**: I would reconsider if:  
    - SSA *systematically* mispredicts in finite cases (e.g., DA without SIA correction).  
    - Ex ante agents *consistently* prefer SIA in non-anthropic decisions (e.g., resource allocation in Relay).  
    - SIA resolves infinity paradoxes cleanly (e.g., via SIA-Density).  
  - **SIA Advocate**: I would reconsider if:  
    - SIA leads to *unavoidable* paradoxes (e.g., in Pre-Registration, agents regret choosing SIA).  
    - SSA handles selection effects *without* ad hoc fixes (e.g., in PP).  
    - Anthropic reasoning is reducible to non-indexical Bayesianism.  

