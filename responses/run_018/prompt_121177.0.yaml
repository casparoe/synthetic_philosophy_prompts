  ### Drafter's Meta-Notes  
  **Framing Tests**:  
  - **Relay Case**: Framing is sound. SSA and SIA converge here because amnesia creates distinct "observer-moments," and both weight by the number of moments. No synchronic divergence.  
  - **Pre-Registration**: Framing is sound. Both predict \(P(\text{Heads}) = 1/1001\), but SSA advocates call this "SSA" (no prior boost), while SIA advocates call it "SIA" (prior boost). The *justification* differs, but the output does not. Crux (d) is relocated to "why choose one formalism?"  

  **Likely Objections**:  
  - The SSA advocate may reject §1.3's SIA definition ("weighting hypotheses...") as conflating prior and update. They prefer: "SIA updates credences by the likelihood of existing under H."  
  - The SIA advocate may dispute §2(c)'s SSA prediction for infinity, arguing that without densities, SSA fails—making the comparison unfair.  

  **Where My Reasoning May Be Wrong**:  
  - In §2(d)'s Pre-Registration prediction, I assumed both sides accept \(P(\text{Heads}) = 1/1001\). SSA advocates might insist ex ante \(P(\text{Heads}) = 0.5\) is the "objective chance," and deviations are errors. This could invalidate the case.  
  - In §2(a), I assumed Identical Rooms is non-contentious. If observers differ in properties (e.g., longevity), SIA might apply—misjudging neutrality.  

