  Here’s a joke crafted for your scene, blending dry wit with precise metaphysical tension:

  **Philosopher:** *(Staring at the unfinished marble torso, running a hand over its cold surface)* So if I were to take your chisel now and reduce this Diana to gravel, would we mourn the artwork or pity the stone?  

  **Sculptor:** *(Wiping dust from his hands)* Neither, surely. The marble persists. The form is lost.  

  **Philosopher:** Precisely the coincidence! Yet consider: before your tools ever touched it, this block was merely marble — inert, unremarkable. Now? It’s *Diana-in-potentia*. Two distinct entities, indistinguishable to the eye, sharing every atom. One destined for ruin at a hammer’s blow, the other… eternal, if only in conception.  

  **Sculptor:** *(Sighs, picks up a small mallet)* So you’d have me strike it? To settle your paradox?  

  **Philosopher:** *(Holding up a restraining hand)* Oh, no. Far too vulgar an experiment. But it does remind me of poor Alistair Thorne. You recall his *"Torso of Contingency"*?  

  **Sculptor:** Vaguely. Ugly thing. Overworked.  

  **Philosopher:** Indeed. Well, during the opening gala, a tipsy patron stumbled into its plinth. Sent it crashing down. Shattered completely. Thorne was distraught, naturally. Later that evening, as the staff swept up, he watched them dump the fragments into a crate marked ‘rubble’. Suddenly, he brightened. Tapped the crate with his boot and declared: *"There now! Finally liberated. That’s the finest work I’ve ever made: ‘Essence Prior to Intention’. Utterly indestructible. And it only cost me three tons of Carrara and seven years of my life to discover it."*  

  **Sculptor:** *(A dry chuckle escapes him)* He called the pile in the crate his masterpiece?  

  **Philosopher:** He did. Insisted the true artwork was the *marble itself* — the very substance he’d always possessed, merely obscured by his futile attempts to make it ‘art’. The broken statue? A fleeting illusion. The crate’s contents? Timeless, immutable. The perfect coincidence realized: the masterpiece and the quarry debris, at last *indiscernible counterparts*.  

  **Sculptor:** *(Shakes his head, a wry smile forming)* Poor Alistair. Always did confuse failure with profundity. Tell me... did he exhibit the crate?  

  **Philosopher:** He intended to. Called it *‘Untitled (Post-Catastrophic Essentialism)’*. Unfortunately, the janitor, unaware of its newfound ontological status, used the finest chunks to patch a pothole in the gallery’s driveway.  

  **Sculptor:** *(Laughs outright now)* So much for immutability! I suppose the marble persisted… as a rather expensive patch of road.  

  **Philosopher:** *(Nodding gravely)* Thus resolving the paradox rather concretely. The artwork perished twice over — first as form, then as mereological unity. The matter? Indestructible, yet perpetually downgraded. A Carrara tragedy in three acts: Statue. Rubble. Infrastructure.  

  **Sculptor:** *(Gestures toward his own unfinished figures)* Remind me not to let you near the mallet. Or the driveway.  

  ### Why this works
  1. **Specificity:** The joke hinges directly on the coincidence problem – the "indiscernible counterparts" (statue/rubble) and the absurdity of declaring the rubble the "true" artwork due to its perceived essential persistence, while the statue's identity is fragile.
  2. **Practical Absurdity:** Thorne's declaration that the rubble is his masterpiece highlights the ridiculousness of applying rigid essentialism to artifacts. Its subsequent fate (becoming road filler) mocks the notion of matter's "immutability" outside intentional context.
  3. **Dry, Literary Tone:** Language like *"ontological status," "mereological unity,"* and *"Post-Catastrophic Essentialism"* is precise and fits a philosopher's voice, while the punchline (*"Statue. Rubble. Infrastructure."*) delivers the absurdity with formal brevity.
  4. **Character-Revealing:** Thorne is a believable archetype – the artist masking failure with pretentious theory. The janitor’s action provides the perfect, mundane foil to high-flown metaphysics.
  5. **No Named Theories:** It relies entirely on the concepts (coincidence, persistence, essentialism) without citing philosophers or texts, staying within the fictional frame.

  This joke delivers the conceptual punch while feeling like a natural, wry anecdote shared between two intellectuals surrounded by the very matter under debate.
