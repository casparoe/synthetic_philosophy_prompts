          - If treatment given (i.e., doctor chose T and R=POS): recover.
          - Otherwise: die.
     - If no disease (D=False):
          - If treatment given (i.e., doctor chose T and R=POS): die.
          - Otherwise: recover.

   Now, from the doctor's perspective, she wants to maximize the probability of recovery.

   Let's compute for each choice.

   If the doctor chooses T:
     Treatment is given only if R=POS.
     P(recover| choose T) = 
          P(recover| choose T, D=True) * P(D=True| choose T) + P(recover| choose T, D=False) * P(D=False| choose T)
     = [ P(R=POS| choose T, D=True) * 1 + P(R=NEG| choose T, D=True) * 0 ] * P(D=True| choose T) 
       + [ P(R=POS| choose T, D=False) * 0 + P(R=NEG| choose T, D=False) * 1 ] * P(D=False| choose T)

     = [ 0.99 * 1 + 0.01 * 0 ] * P(D=True| choose T) + [ 0.01 * 0 + 0.99 * 1 ] * P(D=False| choose T)
     = 0.99 * P(D=True| choose T) + 0.99 * P(D=False| choose T)
     = 0.99

   This seems too high. Let me explain: if she chooses T, then treatment is given only if R=POS. Given that the test is very accurate, if the patient has the disease, it's likely R=POS, so treatment is given and patient recovers. If the patient does not have the disease, then it's likely R=NEG, so treatment is not given, and patient recovers. Only in the cases where the test is wrong (1%) does the patient not get the right outcome.

   Specifically, when D=True and R=NEG (1% of the time among diseased), treatment is not given -> die.
   when D=False and R=POS (1% of the time among non-diseased), treatment is given -> die.

   So overall, the probability of recovery when choosing T is:
     = P(D=True and R=POS) * 1 + P(D=True and R=NEG) * 0 + P(D=False and R=POS) * 0 + P(D=False and R=NEG) * 1
     = P(D=True, R=POS) + P(D=False, R=NEG)

     = P(D=True) * P(R=POS|D=True) + P(D=False) * P(R=NEG|D=False)
     = 0.01 * 0.99 + 0.99 * 0.99 = 0.0099 + 0.9801 = 0.99

   So indeed 99%.

   If the doctor chooses not T (¬T), then treatment is never given.
     Then:
          if D=True: die
          if D=False: recover

     P(recover| choose not T) = P(D=False) = 0.99

   So both choices give 99% chance of recovery. So no difference.

   This doesn't create a conflict.

