  The predictive processing lens is perfect here. I should emphasize how prediction errors propagate upward, forcing higher levels to update priors (the "veto"). This flips the script: what looks like top-down control is actually bottom-up error correction. The temporal dynamics matter too - RP's early onset reflects constant prediction cycling, not a fixed decision point.

