answer: |-
  You've hit upon a genuine conceptual tension at the heart of social science causality. Your trichotomy feels false because it stems from applying a *strictly interventionist* causal model (where only nodes susceptible to physical manipulation count) to phenomena operating at a different ontological level. Weber's thesis *can* be operationalised without reducing culture to epiphenomena or committing category errors, but it requires expanding your causal framework. Here's the conceptual repair:

  1.  **Rejecting the Physical Intervention Constraint for Social Causality:** Your pipeline model (requiring counterfactual changes via physical interventions on nodes) is ideal for *direct physical mechanisms*. Culture operates differently. Its causal power lies in its **emergent, collective, and constitutive nature**. Shared beliefs and norms aren't "things" you poke; they are patterns of meaning and expectation that *structure perception, desire, and action* for individuals within a group. Their causal efficacy is relational and systemic.
      *   **Analogy:** Consider a traffic system. The *physical cause* of a car stopping is the driver pressing the brake pedal. But the *reason* they press it at that specific moment is the red traffic light (a culturally agreed signifier) and the shared norm/expectation (culture) that "red means stop". You cannot "intervene" physically on the *meaning* of red without changing the entire cultural system of traffic rules. The light's colour (physical) *plus* its culturally assigned meaning (non-physical) cause the stopping behaviour.

  2.  **Culture as a Constitutive Cause & System of Constraints/Opportunities:** Calvinist values didn't "push" like a physical force. They **re-defined the possible and the desirable**. They constituted:
      *   **New Interpretive Frameworks:** Seeing worldly success as a *sign* of grace (not just wealth) changed the meaning of profit-seeking.
      *   **New Motivational Structures:** Asceticism directed towards work (not away from it) created a powerful drive for reinvestment.
      *   **New Normative Constraints:** Ostentatious consumption became morally suspect, channeling wealth back into enterprise.
      *   **New Social Expectations:** Trustworthiness in business dealings became linked to religious probity, lowering transaction costs within certain groups.
      *   This isn't correlation; it's the **construction of the social reality** within which economic actions took place. It defined the "rules of the game" (constraints) and the "rewards of the game" (opportunities/incentives) for actors.

  3.  **Operationalising "Elective Affinity": This is Key:** Weber didn't say "Calvinism caused Capitalism." He argued that Calvinist doctrine, *interpreted in a specific way under specific historical conditions*, created a unique "habitus" (a set of dispositions) that was *uniquely favourable* to the *systematic, rational pursuit of profit as an end in itself*. This is the "affinity":
      *   **Mutual Reinforcement:** The emerging capitalist practices found justification and motivational fuel in Calvinist tenets, while the success of these practices reinforced the plausibility and appeal of the Calvinist worldview for those engaged in them.
      *   **Selection Mechanism:** Material conditions (e.g., existing trade networks, technologies) created an *environment* where individuals/groups embodying the Protestant ethic were more likely to succeed *and accumulate influence*. Their success propagated the ethic. The ethic wasn't *reducible* to the conditions; it was the *specific cultural toolkit* that allowed actors to *exploit* those conditions most effectively *in that specific way*.
      *   **Operationalisation:** Think of it as a **positive feedback loop** between:
          *   **Node A:** Internalised cultural values/norms (e.g., asceticism, calling, predestination anxiety).
          *   **Node B:** Observable economic behaviours (e.g., reinvestment, systematic accounting, reliability).
          *   **Node C:** Material outcomes (e.g., capital accumulation, business success).
          *   **Edge A->B:** Values shape behaviour (e.g., asceticism discourages consumption, encouraging reinvestment).
          *   **Edge B->C:** Behaviour influences outcomes (e.g., reinvestment leads to growth).
          *   **Edge C->A:** Outcomes reinforce values (e.g., success interpreted as sign of grace, reinforcing worldview). *Material conditions set the stage for C->A to be a plausible reinforcement.*
      *   This loop creates a distinct, self-sustaining *pattern* of behaviour (rational capitalism) that wouldn't stabilise without the specific cultural input (A). The "cause" is the *activation and stabilisation* of this loop by the specific cultural configuration.

  4.  **Why it's Not Like "Average Height Causing Collapse":** The average height is purely descriptive aggregation without inherent meaning or direct causal power on behaviour. Calvinist values are:
      *   **Meaning-laden:** They carried specific, powerful meanings that actively shaped how individuals perceived the world and their role in it.
      *   **Motivationally Potent:** They generated strong internal drives (anxiety about salvation, drive to fulfil one's calling).
      *   **Normatively Binding:** They created expectations and sanctions (internal guilt, social disapproval for wastefulness).
      *   **Collectively Held:** Their power derived from being shared, creating predictable expectations *between* actors (e.g., trust based on shared ethic).

  **Conceptual Repair Summary:**

  *   **Shift Perspective:** Move from "physical push" causality to **systemic, constitutive, and enabling causality**. Culture causally shapes behaviour by defining the landscape of meaning, motivation, and legitimate action.
  *   **Focus on Mechanisms:** Operationalise culture not as a monolithic "node" but as **internalised schemas, motivational drivers, and shared normative expectations** that mediate between material conditions and observable actions/outcomes. These *are* intervenable in principle (e.g., via education, propaganda, socialisation processes - though complex and messy).
  *   **Embrace "Elective Affinity":** Model it as a **mutually reinforcing feedback loop** between specific cultural configurations, resulting behaviours, and material outcomes. The causal power of culture lies in its ability to *initiate and stabilise* these loops, making specific behavioural patterns dominant.
  *   **Accept Emergence:** The causal power of shared beliefs/norms is an emergent property of collective human interaction. It's not reducible *solely* to individual psychology (though enacted by individuals) nor to the economic base (though constrained/enabled by it). It's the *relational structure* itself that has causal efficacy.

  You *can* build causal graphs incorporating culture. The nodes become things like "strength of internalised belief in ascetic calling", "prevalence of trust norms within group X", "level of anxiety regarding salvation". The edges represent how these cultural states influence behavioural probabilities (e.g., probability of reinvesting profits vs. consuming them lavishly) *given the existing material context*. The challenge isn't category error; it's the immense complexity of measuring and isolating these cultural variables and their interactions within feedback loops. Weber's genius was identifying a specific cultural configuration that acted as a crucial catalyst and stabiliser for a specific, world-changing economic system.
