  I need to explain how cultural values can have causal efficacy without being reducible to psychology or economics. The key might be showing how shared beliefs function as collective constraints that shape behavior patterns. Like how traffic rules (non-physical) causally affect driving behavior through shared expectations. 

  The user needs conceptual tools to represent this in causal graphs. Perhaps showing how values operate through mediating nodes: belief systems → internalized norms → behavioral patterns → economic outcomes. But the challenge is the emergent, collective nature - a single person's belief change doesn't shift the culture.

  Weber's "elective affinity" is crucial here - it's about mutually reinforcing systems. The solution might be framing culture as a system-level property that coordinates expectations, making certain behaviors more likely. Like how a shared language enables communication - not reducible to individual psychology but not supernatural either.

  The British English requirement means avoiding Americanisms. Words like "operationalise" instead of "operationalize" are already covered. Should use "behaviour" consistently. 

