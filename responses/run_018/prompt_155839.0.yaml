  ### **Node 4: False Memory Integration**  
  *You lose all memories, then "recover" false ones (e.g., believing you’re a spaceship captain). Are you still "you"?*  
  - **(A)** Yes—identity isn’t just about memory accuracy.  
  - **(B)** No—your narrative is now fundamentally alien.  

  → **If A:** Go to Node 5.  
  → **If B:** Go to **Leaf 3 (Narrative Reconstructionism)**.  

  ---

  ### **Node 5: Body Swap Intuition**  
  *Your mind is wiped and placed in a new body. A stranger gets your old body/brain. Who owns your bank account?*  
  - **(A)** The new body—it has your memories/personality.  
  - **(B)** The old body—it’s biologically continuous.  
  - **(C)** Neither—the "you" in question dissolved.  

  → **If A or B:** Go to **Leaf 2 (Two-Truths Conventionalism)**.  
  → **If C:** Go to **Leaf 1 (Hard Reductionist Anatta)**.  

  ---

  ### **Leaves**  
  1. **Hard Reductionist Anatta**: No self (conventional *or* ultimate). Emerges from: Node 1C, Node 2C, Node 3C, Node 5C.  
  2. **Two-Truths Conventionalism**: Functional self (conventionally real, ultimately empty). Emerges from: Node 5A/B.  
  3. **Narrative Reconstructionism**: Self as story coherence. Emerges from: Node 4B.  
  4. **Distributed Conventional Self**: Self as multi-body system. Emerges from: Node 3A.  

  ---

  ### **Key Notes**  
  - **Indistinguishable Pairs**:  
    - **Conventionalism (Leaf 2) vs. Narrative (Leaf 3)** both *could* choose **Node 1B** (new self) and **Node 2A** (shared inheritance). The tree separates them at **Node 4** (false memory response).  
    - **Reductionism (Leaf 1) vs. Distributed (Leaf 4)** are cleanly split by **Node 3C vs. 3A**.  
  - **Distributed Self Coherence**:  
    - Leaf 4 flagged as **✓COHERENT** if async conflicts don’t violate dependent origination (functionality > unity).  
    - **!INCOHERENT** if strict unity is required for convention (e.g., Node 3B rejects it).  
  - **Design Logic**:  
    - Gut-driven choices (e.g., "who gets the bank account?").  
    - Tests continuity (Node 1), unity (Node 2), scalability (Node 3), narrative (Node 4), and embodiment (Node 5).  
    - 7 nodes total (5 questions + 4 leaves, with Leaf 1 recurring).  

  This tree forces engagement with fragmentation, convention, and emergence—revealing intuitions about selfhood without Buddhist or Lockean jargon.
