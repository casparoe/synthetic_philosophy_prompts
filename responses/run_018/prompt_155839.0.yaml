  ### **Node 1: Synthetic Memory Replacement**  
  *Your memories are slowly replaced by synthetic ones (feeling identical but zero causal link to your past). What happens?*  
  - **(A)** The original mental stream is shattered → emptiness remains.  
  - **(B)** A new self picks up the thread (same convention, new owner).  
  - **(C)** No "owner" existed in the first place.  

