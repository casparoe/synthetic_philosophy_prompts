  - **(B)** One is original, the other is a copy (inheritance is exclusive).  
  - **(C)** The "original self" was incoherent to begin with.  

  → **If C:** Go to **Leaf 1 (Hard Reductionist Anatta)**.  
  → **If A or B:** Go to Node 3.  

