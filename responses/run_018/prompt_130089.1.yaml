answer: |-
  As a steadfast proponent of the moral equality of combatants, I reject both horns as false dichotomies that misunderstand the *normative source* of that equality. My position is robustly normative, grounded not in the combatant’s contingent epistemic state *nor* in the objective justice of the cause, but in the *functional role* soldiers occupy within a collective, organized war effort authorized by a *putatively legitimate sovereign authority*. The equal permission to kill arises from reciprocal recognition that soldiers, on *both sides*, are instrumentally acting under *orders* and within a *structure of public authority* that claims the right to wage war – regardless of whether that claim is ultimately sound *ad bellum*. The deceived soldier, acting in good faith within such a structure, possesses the same moral license to target opposing combatants as the just soldier does, because both are fulfilling the same socially recognized, institutionally defined role of *combatant*. Crucially, this status-based permission is *extinguished* only by actions violating *jus in bello* (targeting non-combatants, perfidy, etc.), *not* by the retrospective revelation of deception or the objective injustice of their state’s cause. To tie forfeiture of protection to *ad bellum* truth—whether known or unknown—collapses the very distinction you rightly note is essential, transforming *jus in bello* into a mere function of *jus ad bellum* and inviting the retroactive slaughter you abhor. The deceived soldier’s *personal moral culpability* for participation in an unjust war may vary based on belief and evidence, but their *status as a legitimate target* during combat, and their reciprocal *permission to target enemy combatants*, is invariant, secured by their role within a belligerent collective acting under *color of law*. Your epistemic scenario highlights tragedy and error, but it does not undermine the normative bedrock of combatant equality: the reciprocal risk inherent in the role itself, deliberately insulated from the shifting sands of *ad bellum* appraisal to prevent the total war your dilemma portends.
