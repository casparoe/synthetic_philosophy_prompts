answer: |-
  Here is a comprehensive exam package addressing your request for an advanced contractualism question on intertemporal reasoning, complete with prompt, model answer, and marking scheme.

  ---

  ### (a) Exam Question (75 minutes, ~700 words)

  **Prompt:** T.M. Scanlon's contractualism grounds morality in principles no one could reasonably reject. A central feature is its rejection of utilitarian aggregation *across different persons*: we cannot justify imposing severe burdens on one person simply to provide smaller benefits to many others, because the single burdened individual could reasonably reject such a principle. Consider now an *intertemporal contractualism* applied *within* a single life: Can a present temporal stage of a person ("Stage-P") reasonably reject a principle permitting significant present burdens (e.g., intense pain, severe deprivation) imposed on Stage-P in exchange for generating substantial future benefits *for a later stage of that same person* ("Stage-F")? Proponents argue that Stage-P, acting as a proxy for Stage-F, could *not* reasonably reject such a principle, as Stage-F would strongly endorse it. Critics argue this smuggles in a form of *intrapersonal aggregation* – summing benefits and burdens across temporal stages – precisely the kind of summation Scanlon forbids across persons.

  **Task:** Assess whether intertemporal contractualism introduces problematic intrapersonal aggregation. Can Scanlon's framework (specifically, the reasonable rejectability test) coherently block this aggregation *without* implicitly relying on either (1) prioritarian weighting (favoring the worse-off stage) or (2) an independent metaphysical theory of diachronic personal identity? In your analysis, address:
  1.   Why the logic Scanlon uses to block interpersonal aggregation in "rescue cases" might *not* straightforwardly transfer to this intra-life scenario.
  2.   Whether the "proxy representation" argument conflates the *strength of Stage-F's reasons* with the *reasonable rejectability of a principle by Stage-P*.
  3.   What hidden assumptions about temporal continuity or identity are necessary for the proxy argument to work, and whether these assumptions are compatible with Scanlon's purely justificatory framework.

  **Deliver a reasoned verdict:** Is intertemporal contractualism a consistent extension of Scanlon's core commitments, or does it inevitably collapse into a form of aggregation Scanlon must reject?

  ---

  ### (b) Model Answer (~700 words)

  Scanlon’s contractualism forbids justifying severe burdens for one person by aggregating smaller benefits for others. The victim can reasonably reject such a principle because the *magnitude* of their burden outweighs any *individual* beneficiary's countervailing reason. Intertemporal contractualism applies this framework across time within one life: Can Stage-P (suffering a burden) reasonably reject a principle permitting that burden for the sake of Stage-F's benefit? While intuitively plausible that Stage-P *cannot* reasonably reject this (acting as Stage-F's proxy), this extension risks reintroducing the aggregation Scanlon condemns, now intrapersonally, and faces challenges regarding its consistency with Scanlon's core apparatus without illicit imports.

  **1. The Disanalogy with Interpersonal Rescue Cases:** Scanlon blocks interpersonal aggregation because the burdened individual has a complaint grounded in their *separateness* from the beneficiaries. Their suffering constitutes a distinct, unrejectable complaint. In the intra-life case, however, Stage-P and Stage-F are stages *of the same person*. Proponents argue Stage-P cannot reasonably reject the burden-for-benefit principle because Stage-F, whom Stage-P represents, would strongly affirm it. The core disanalogy is that interpersonal rejection relies on the *irreducible moral standing of distinct persons*, each wielding a veto. Temporal stages lack this independent moral standing within Scanlon’s framework; they are aspects of one continuing person. The "separate complaint" logic doesn't transfer cleanly. Stage-P’s potential complaint seems inherently linked to Stage-F’s endorsement, suggesting a form of *internal summation* is occurring.

  **2. Strength of Reasons vs. Reasonable Rejectability:** The proxy argument rests on a potential conflation. It emphasizes the *strength of Stage-F's reasons* to accept the benefit. However, Scanlonian reasonable rejectability is not determined solely by the strength of the countervailing reasons *within the same life*. It asks whether Stage-P, considering the *generic reasons* of any person (or stage) in their position, could reasonably reject the principle *given the alternatives*. Stage-P has a powerful generic reason to avoid severe suffering *now*. The argument that Stage-P should weigh Stage-F's future reasons as decisive treats the temporal stages as distinct justificatory agents *within* the contractualist test, effectively requiring Stage-P to aggregate its own burden with Stage-F's benefit. This replicates the structure of utilitarian summation that Scanlon rejects interpersonally: sacrificing one (stage) for the greater net good of the whole (temporal sequence). The strength of Stage-F's future reasons does not automatically neutralize Stage-P's grounds for rejection; it merely provides a strong counter-reason. Reasonable rejectability hinges on whether Stage-P's complaint outweighs the strongest counter-reasons *in a way that makes rejection reasonable*. Conflating the strength of Stage-F's reasons with the *unreasonableness* of Stage-P's rejection smuggles in aggregation by assuming the future benefit *must* outweigh the present burden for the "person-stage collective."

  **3. The Hidden Work of Continuity and the Verdict:** The proxy argument implicitly relies on a strong assumption of psychological connectedness/continuity – that Stage-P identifies sufficiently with Stage-F to prioritize Stage-F's interests *as if they were its own future interests*. However, Scanlon's framework is explicitly justificatory, not metaphysical. It does not, and arguably *cannot*, adjudicate questions of personal identity or the normative significance of psychological connections. To function, the proxy argument *needs* this assumption, but importing it risks smuggling in an independent theory of identity that determines what counts as "one person" for the purposes of summation. Furthermore, if continuity is strong enough to make Stage-F's reasons *definitive* for Stage-P's rejection, it effectively treats the stages as a single unit where benefits and burdens *are* summed. If continuity is weak, Stage-P has little reason to act as Stage-F's proxy. Scanlon's framework lacks the resources to specify the requisite degree of continuity without going beyond justification and into metaphysics.

  **Verdict:** Intertemporal contractualism, as framed, is **not** a consistent extension of Scanlon's core commitments. It inevitably introduces problematic intrapersonal aggregation. It relies on treating temporal stages as quasi-distinct justificatory agents within the test, forcing a summation (Stage-P's burden vs. Stage-F's benefit) that mirrors the forbidden interpersonal aggregation. The proxy argument conflates the strength of a future stage's reasons with the unreasonableness of the present stage's rejection, demanding an internal aggregation Scanlon's framework isn't equipped to handle neutrally. Crucially, it cannot avoid this without implicitly depending either on (a) a prioritarian-like weighting favoring the burdened stage (which Scanlon doesn't endorse), or (b) an external theory of personal identity/continuity specifying when stages are "unified enough" to permit summation – a move alien to Scanlon's purely reason-based, justificatory contractualism. While Scanlon might allow individuals to *personally* accept great present burdens for future gains, grounding the *moral permissibility* of *imposing* such burdens via a contractualist test requires the problematic intra-stage aggregation his framework cannot consistently accommodate without compromising its anti-aggregationist core.

  ---

  ### (c) Marking Scheme

  **Key Distinctions (A vs. B):**

  | **Component**                                                                 | **A Answer (85-100%)**                                                                                                                               | **B Answer (70-84%)**                                                                                                                              |
  | :---------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Locating Anti-Aggregation**                                              | **Correctly identifies:** Anti-aggregation is embedded in the *structure of the reasonable rejectability test itself* (individual veto power based on complaint strength relative to others' *individual* reasons), NOT in a theory of the good or a claim that aggregation is intrinsically wrong. | Mentions anti-aggregation but locates it vaguely (e.g., "Scanlon thinks aggregation is bad") or primarily in the outcome/consequences, not the justificatory procedure. |
  | **2. Interpersonal vs. Intrapersonal Disanalogy**                            | **Clearly articulates:** The fundamental role of *separate persons* wielding distinct moral standing/veto power in interpersonal cases, and why this grounds rejection. **Explicitly states:** Temporal stages lack this independent moral standing; they are parts of one entity. | Notes the stages are the same person but doesn't fully explain *why* this undermines the transfer of the "separate complaint" logic central to interpersonal rejection. |
  | **3. Conflation: Strength of Reasons vs. Rejectability**                     | **Precisely diagnoses:** The proxy argument conflates the *strength of Stage-F's reasons to want the benefit* with the *unreasonableness of Stage-P's rejection*. **Explains:** Stage-P's rejection is reasonable based on its *own* generic reasons (avoiding severe burden), regardless of Stage-F's strong counter-reasons; treating Stage-F's reasons as decisive *demands internal aggregation*. | Identifies a tension but doesn't sharply distinguish the concepts. Might say "Stage-P has strong reasons too" without showing *how* the argument conflates reason-strength with the reasonableness *criteria*. |
  | **4. Role of Continuity/Identity**                                           | **Explicitly identifies:** The proxy argument *implicitly relies* on assumptions about psychological continuity/connectedness for Stage-P to prioritize Stage-F. **Crucially argues:** Scanlon's framework lacks resources to justify this assumption without importing an *external metaphysical theory*, violating its justificatory purity. | Notes identity matters but doesn't clearly show *how* it's doing hidden work in the argument or why importing it is problematic for Scanlon's project. |
  | **5. Proxy Representation & Aggregation**                                     | **Directly argues:** Allowing Stage-P to act as Stage-F's proxy within the test effectively *replicates the structure of summation* (Stage-P's loss vs. Stage-F's gain) that Scanlon forbids interpersonally. It makes the stages quasi-persons within the test. | Sees a similarity to aggregation but doesn't convincingly demonstrate *how* the proxy maneuver structurally replicates the forbidden summation. |
  | **6. Avoiding Illicit Moves (Prioritarianism/Identity Theory)** | **Demonstrates:** The argument either collapses into aggregation OR must implicitly rely on prioritarian weighting (e.g., giving Stage-P's burden extra weight) or an external identity theory to block aggregation, neither of which are native to Scanlon's framework. | States that prioritarianism/identity theory shouldn't be used but doesn't show *how* the intertemporal argument inevitably requires them or collapses without them. |
  | **7. Reasoned Verdict on Consistency**                                        | **Clear, decisive verdict** (e.g., "inconsistent") **firmly grounded** in the preceding analysis of aggregation, conflation, and illicit reliance. | Offers a verdict but it may be tentative or not fully supported by the specific arguments made about Scanlon's framework. |

  **Common Errors (Marks Reduction):**
  *   **Misunderstanding Anti-Aggregation:** Thinking Scanlon rejects aggregation because it leads to bad outcomes per se, rather than because it violates the justificatory requirement to each individual.
  *   **Treating Stages as Full Persons:** Arguing Stage-P *can* reject the principle simply because it suffers, ignoring the proxy challenge or failing to see why stages aren't morally distinct persons.
  *   **Accepting Proxy Uncritically:** Assuming Stage-P *must* accept Stage-F's interests as overriding without analyzing the justificatory logic or the aggregation risk.
  *   **Appealing to Prudence:** Justifying the principle based on rational self-interest or prudence, rather than within the strictures of the Scanlonian *reasonable rejectability test*.
  *   **Introducing External Elements:** Resorting to prioritarianism, utilitarianism, or a specific theory of personal identity (e.g., Parfit) *without* critically examining whether this is compatible with Scanlon's framework or necessary due to its limitations.
  *   **Ignoring the Constraints:** Failing to address the specific prohibition against using prioritarian weights or an independent identity theory.
  *   **Vagueness on Key Concepts:** Using "reasonable rejectability," "strength of reasons," "aggregation," or "personal identity" imprecisely.
  *   **Structural Issues:** Poor organization, significantly under/over word count, lack of clear thesis/verdict.

  **Grading Summary:**
  *   **A Range:** Hits all 7 Key Distinction components clearly and accurately. Demonstrates deep understanding of Scanlon's framework, precisely identifies the core problem (intrapersonal aggregation via proxy), exposes the conflation and hidden reliance on continuity, and delivers a well-supported verdict of inconsistency. Writing is clear, concise, and logically structured.
  *   **B Range:** Addresses most Key Distinction components but might be less precise on 1-2 (e.g., slightly vague on disanalogy, doesn't fully unpack the conflation, or underplays the role of continuity). Shows good understanding but may miss the deepest layer of the aggregation problem within the test structure. Verdict is present but support might be slightly less rigorous. Avoids major errors but may have minor conceptual slips.
  *   **C Range (50-69%):** Superficial engagement. Misunderstands core Scanlonian concepts (esp. aggregation/reasonable rejectability). Fails to adequately address the disanalogy or proxy challenge. Relies heavily on intuition or external theories. Significant errors or omissions in addressing the prompt's requirements.
  *   **D/F Range (<50%):** Fundamental misunderstandings of contractualism, aggregation, or the prompt. Off-topic or severely underdeveloped.

  ---
  This package provides a rigorous question pushing students beyond rote Scanlon, a model answer demonstrating the required depth and precision, and a clear marking scheme focused on specific conceptual moves and common pitfalls, ensuring fair and targeted assessment for your advanced seminar.
