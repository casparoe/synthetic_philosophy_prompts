  ### Honor Shift: Contract Guild Role-Play  
  **Objective**: Simulate a moral revolution where a norm collapses due to shifted social costs (honor vs. material loss), not argument or persuasion.  

  ---

  #### **Setup**  
  - **Roles** (assign randomly):  
    - **Merchants** (10 students): Trade goods (candy or points). Must defend their ledger's "honor" if publicly corrected.  
    - **Scribe** (2 students): Records challenges/apologies. Announces corrections publicly.  
    - **Arbitrator** (1 student): Initially passive. After rule-change, settles disputes.  
    - **Secret Moral Advocate** (1 merchant): Privately instructed to argue against the norm. Others ignore them.  
  - **Materials**:  
    - Ledger cards (paper) for each merchant.  
    - Dice (or coin) for challenge outcomes.  
    - Candy/points (e.g., 10 pieces per student).  

  ---

  #### **Rules & Payoffs**  
  **Phase 1: The Norm (20 min)**  
  - **Trading Round**:  
    - Merchants pair up, trade (each gains 1 candy).  
    - After each trade, Scribe rolls a die: **1-2 = Public Correction** (accuser names a ledger "error").  
  - **When Corrected**:  
    - **Option 1: Challenge** (defend honor):  
      - Pay 2 candy to guild (status cost).  
      - Roll die: **1-3 = Win** (accuser gives you 3 candy), **4-6 = Lose** (exiled next round + pay 3 candy to accuser).  
    - **Option 2: Apologize** (lose face): Pay 2 candy to accuser.  
  - **Payoff Matrix**:  
    |                | Win Challenge | Lose Challenge | Apologize |  
    |----------------|---------------|----------------|-----------|  
    | **Your Candy** | +1 net        | -6 net         | -2 net    |  
    - *Dominant Strategy*: Challenging has higher expected value (-1.5) than apologizing (-2).  

  **Phase 2: Rule-Change (5 min)**  
  - **External Shift**: "The Crown mandates arbitration! Exile now bans you from **TWO** trades (lose 4 candy). Arbitration is free."  
  - **New Option**: **Arbitration** (settle with Arbitrator):  
    - No status cost or exile.  
    - Lose 1 candy to guild (no face loss).  

  **Phase 3: Collapse (15 min)**  
  - Repeat Trading Rounds with new rules.  
  - **Payoff Shift**:  
    - Challenging expected value drops to **-3.5** (exile cost ↑).  
    - Arbitration costs only **-1 candy**.  

  ---

  #### **Timeline**  
  1. **Intro** (5 min): Explain roles, rules, and candy economy.  
  2. **Phase 1** (20 min): 3-4 trading rounds. Secret Moral Advocate argues against dueling (ignored).  
  3. **Phase 2** (5 min): Announce rule-change. Arbitrator activated.  
  4. **Phase 3** (15 min): 2-3 rounds with arbitration option.  
  5. **Debrief** (30 min).  

  ---

  #### **Debrief Guide**  
  1. **Observe the Shift**:  
     - Pre-rule-change: Challenges dominate (honor > candy).  
     - Post-rule-change: Arbitration replaces challenges (exile cost > honor loss).  
  2. **Map to Williams/Appiah**:  
     - Norms collapse when **social costs/resource shifts** (e.g., state arbitration) make old honor codes impractical.  
     - Moral judgments didn’t change (they still hated dueling)—*honor* recalibrated around new costs.  
     - The Secret Moral Advocate showed **argument alone fails** without material incentives.  
  3. **Limitations**:  
     - Simulates *structural* shift, not slow cultural shame (e.g., centuries to stigmatize slavery).  
     - No real violence/fear (dueling deaths vs. candy loss).  
     - Honors shifts often need "unthinkable" events (e.g., war) to catalyze.  

  ---

  #### **What Will Go Wrong (First Run)**  
  - **Confusion**: Students may miss corrections or miscalculate payoffs. *Fix*: Scribe must announce each step clearly.  
  - **Advocate Succeeds**: If the Moral Advocate sways peers, note it as "rare IRL—arguments need structural backing."  
  - **Arbitrator Bias**: If Arbitrator plays favorites, highlight how real institutions require trust.  

  ---

  #### **Twist: The Secret Moral Advocate**  
  - One merchant receives a note: "Argue passionately against challenges. Call them barbaric or pointless."  
  - **Key Moment**: When corrected, they apologize *and* rant—but the group ignores them, proving argument isn’t the engine.  

  **Outcome**: Students *feel* how norms crumble when honor’s "price" changes—no sermons needed.
