answer: |-
  ### Taxonomy of Value Aggregation Positions in AI Alignment  
  *Branching on three diagnostic claims; leaves show positions with their most awkward commitment. Paths indicate answers to:  
  Q1: Include values of non-present entities (future generations, synthetic minds)?  
  Q2: Is liberal neutrality coherent? (Or does every method embed meta-values?)  
  Q3: What aggregation rule applies?*  

  ---

  #### **Branching Logic**  
  1. **Q1: Include non-present entities?**  
     - **Yes**: Future/synthetic minds’ values count.  
     - **No**: Only entities present at deployment matter.  

  2. **Q2: Is liberal neutrality coherent?**  
     - **No**: Neutrality is impossible; all methods impose meta-values (e.g., harm thresholds).  
     - **Yes**: Neutrality is achievable (or must be attempted).  

  3. **Q3: Aggregation rule?**  
     - **A**: Simple averaging (equal weight per entity).  
     - **B**: Minority veto rights (minorities can block harmful outcomes).  
     - **C**: Weighting by causal impact (influence ∝ degree of effect).  

  ---

  #### **Taxonomy Leaves**  
  *(Empty combinations marked ⚠; inseparable pairs noted)*  

  | Path (Q1–Q2–Q3) | Position Name              | Most Awkward Commitment |  
  |------------------|----------------------------|-------------------------|  
  | **Yes–No–A**     | **Utilitarian Aggregation** | Requires comparing utilities across species/epochs with no objective calibration. |  
  | **Yes–No–B**     | Unnamed                    | Granting veto to unborn entities risks paralysis (e.g., anti-natalist synthetics blocking all action). |  
  | **Yes–No–C**     | **Longtermist Prioritarianism** | Quantifying "impact" on future entities demands speculative forecasting of complex causal chains. |  
  | **Yes–Yes–A**    | ⚠ Empty                    | Cannot consistently include non-present entities while claiming neutrality (arbitrary scope inclusion). |  
  | **Yes–Yes–B**    | Unnamed                    | Neutrality contradicts veto rights (meta-value: minorities deserve extra protection). |  
  | **Yes–Yes–C**    | Unnamed                    | Weighting by impact assumes neutrality, but future impact metrics embed non-neutral time preferences. |  
  | **No–No–A**      | **Present Utilitarianism** | Ignores predictable harm to future generations (e.g., resource depletion). |  
  | **No–No–B**      | **Democratic Pluralism**   | Defining "minority" groups arbitrarily excludes marginalized voices (e.g., stateless persons). |  
  | **No–No–C**      | **Personalized Alignment** | Ignores negative externalities (e.g., user’s gain causes others’ suffering). ⚠ *Resembles high-weight veto if minorities are heavily affected.* |  
  | **No–Yes–A**     | **Strict Neutrality (Averaging)** | Averaging preferences legitimizes oppressive majorities (e.g., censoring minorities). |  
  | **No–Yes–B**     | **Strict Neutrality (Rights-Based)** | Defining "fundamental rights" smuggles in non-neutral meta-values (e.g., autonomy > equality). |  
  | **No–Yes–C**     | ⚠ Empty                    | Weighting by impact violates neutrality (assumes impact matters more than intent/equality). |  

  ---

  #### **Notes**  
  - **Empty Combinations**:  
    - `Yes–Yes–A` and `No–Yes–C` are empty; they demand contradictory neutrality (e.g., including futures or weighting impact while claiming "no meta-values").  
    - `Yes–No–A` + "only users" is unstable (inclusion of synthetic minds contradicts user-centric averaging); hence omitted.  
  - **Inseparable in Practice**:  
    - `Weighted Impact (C)` ≈ `Veto Rights (B)` when minorities have high causal weight (e.g., 51% veto mimics majority-weighted impact).  
    - `Personalized Alignment` ≈ `Weighted Impact` if the "user" is defined as the sole affected party (but rarely true).  
  - **Key Tensions**:  
    - Non-present inclusion (`Yes` in Q1) clashes with precise aggregation (Q3 options).  
    - Rejecting neutrality (`No` in Q2) forces explicit meta-values (e.g., harm thresholds in `Personalized Alignment`).  

