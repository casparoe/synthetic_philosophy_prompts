  First, I need to recall Rousseau's arguments. He condemned theater for creating artificial emotions and reinforcing social hierarchies. The actors' representations distance the audience from genuine feelings, leading to moral corruption. On the other hand, he promoted civic festivals where citizens participate actively, fostering unity and direct community bonds. 

  The core issue here is the distinction between mediated and unmediated experiences. Theater involves mimesis—actors representing others, which inserts a layer between the participant and the experience. Civic festivals, however, are participatory; citizens are both actors and spectators. This eliminates the representational layer, creating a direct communal presence. 

  I should articulate this conceptual difference clearly. Mediation in theater introduces distortion, while festivals aim for immediacy. The challenge for Rousseau's consistency is whether the spectator role in festivals still introduces mediation. If spectatorship inherently creates distance, even festivals might have a representational element. Rousseau would argue that in festivals, the spectators are also potential participants, blurring the line between observer and actor. The absence of professional performers and scripted roles helps maintain immediacy.

