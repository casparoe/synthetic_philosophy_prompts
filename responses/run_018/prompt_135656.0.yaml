        - Without the clock, on any awakening the volunteer doesn't know the day. 
        - Halfer: P(heads)=1/2 -> chooses A.
        - Thirder: P(heads)=1/3 -> chooses B.
        - This does not meet our specification for Tuesday (we want both to choose A).

      **Halfer defender's attack:**
        A halfer defender might argue that the clock is just ordinary evidence and should be treated as such. They might say that the initial probability of heads is 1/2, and then the clock evidence updates it. But they would update differently than the thirder. 
        - For example, on a Tuesday awakening, the halfer might compute:
            P(heads | clock=TUE) = ?
            They start with P(heads)=1/2.
            They know that if heads, the clock must show TUE (because it's Tuesday and the clock is perfect) -> P(clock=TUE|heads)=1.
