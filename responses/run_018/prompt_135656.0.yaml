                                   = [1 * 1/2] / [1*1/2 + (1/2)*(1/2)] = (1/2) / (1/2 + 1/4) = (1/2) / (3/4) = 2/3.
            So the halfer, using this conditionalization, would assign 2/3 to heads on Tuesday and choose A with even more confidence.

        - On Thursday:
            P(heads | clock=THU) = 0, because heads has no Thursday awakening. So they would choose B.
          This is not the halfer view we want. We want the halfer to stick to 1/2.

        So the halfer defender might have to bite the bullet and say that the probability of heads is always 1/2, regardless of the clock. This would mean they would choose A even on Thursday.

      **Confidence and Uncertainty:**

      I am moderately confident in the analysis with the perfect clock. The Thursday awakening for the halfer is the most problematic point. It is hard to defend the halfer's position that the probability of heads is 1/2 when they are awake on Thursday, which only happens on tails.

