answer: |-
  That's an exceptionally sharp observation of a pervasive rhetorical pattern in nationalist discourse. You've pinpointed a core tension in how nations legitimize themselves, and you're right that it goes beyond simple Motte-and-Bailey (which relies on a clear fallback position). There isn't one universally agreed-upon term, but several concepts capture facets of it, and we can define the pattern clearly:

  **Core Pattern:** **Opportunistic Temporal Legitimation Switch (OTLS)** - *The strategic and contradictory use of both "objective historical antiquity" and "subjective present belief" to legitimize the nation's existence and demands, switching between them as needed to evade critique and maintain normative power.*

  **Key Characteristics of OTLS:**

  1.  **Initial Claim (Ancient Pedigree):** "Our nation is ancient/continuous (since time X)."
  2.  **Debunking:** Evidence shows modern construction (borders, standardized language, mass education, symbols, etc., largely 19th/20th century).
  3.  **Pivot (Subjective Shield):** "Ah, but the *nation* is defined by our shared *belief* and feeling of belonging *now*; the administrative details are irrelevant."
  4.  **Re-deployment (Normative Leverage):** "Therefore, because this nation (defined by our ancient continuity/essence) exists, newcomers *must* assimilate to its timeless core values/culture/traditions." (Reverting implicitly or explicitly to the "ancient essence" claim for normative weight).

  **Established Concepts & Why They Fit (Partially):**

  1.  **Hobsbawm & Ranger's "Invented Tradition" / Anderson's "Imagined Community":** These explain *why* the pivot exists (the traditions *are* often invented, the community *is* imagined). However, they describe the *phenomenon*, not the specific *rhetorical switch* used to defend it when challenged. OTLS is the *argumentative tactic* deployed *because of* the invented/imaged nature.
  2.  **Anthony D. Smith's "Ethnosymbolism":** Smith argued nations need a pre-modern "ethnic core" (myths, symbols, memories) *and* modern mobilization. OTLS exploits this duality opportunistically, using the "ethnie" for antiquity claims and the "mobilization" aspect for the subjective shield, while obscuring the constructed nature of the *fusion*.
  3.  **"Simultaneous Affirmation and Denial of Historicity" (Smith & others):** This gets close. Nationalism often requires both a claim to deep history *and* the flexibility of modern construction. OTLS is the *rhetorical manifestation* of this contradiction when defending against critique.
  4.  **"Janus-Faced Temporality" (Common in Nationalism Studies):** Nations look both backward (to foundational myths) and forward (to destiny). OTLS weaponizes this dual gaze: backward for legitimacy/assimilation demands, forward/present for defensive flexibility against historical debunking.
  5.  **"Essentialism of the Ephemeral" (Adapted from critiques):** Treating a modern, contingent, and constructed identity ("ephemeral" in historical terms) *as if* it possesses an unchanging, timeless essence ("essentialism"), then leveraging that imagined essence normatively.

  **Boundary Cases: Where OTLS Ends and Complex Identity Begins**

  OTLS is defined by the **opportunistic, contradictory switching** specifically to avoid critique and wield normative power. Complex identity exists without this:

  1.  **Acknowledging Construction:** "Our *sense* of nationhood solidified in the 19th century, drawing on older cultural elements. This shared modern identity, forged through specific historical processes, underpins our civic norms. Assimilation means integrating into these current societal structures and values, not pretending they are medieval." *(No antiquity claim debunked, no pivot, no normative use of fabricated antiquity).*
  2.  **Stable Subjective Focus:** "We are a nation because we collectively affirm this political community and its values *today*. This shared commitment is the basis for our common life and expectations of newcomers." *(Never relies on unprovable ancient continuity, avoids the "ancient essence" trap for norms).*
  3.  **Nuanced Historical Continuity:** "While the *modern state* and its standardized forms are recent, there is demonstrable cultural, linguistic, or institutional continuity in this region reaching back centuries. This long development informs, but does not rigidly dictate, our contemporary identity and integration policies." *(Distinguishes between demonstrable threads and the constructed nation-state; avoids claiming unchanging "essence" for normative demands).*
  4.  **"Ethnic" vs. "Civic" Distinction (Flawed but illustrative):** An argument based *solely* on current political allegiance and shared civic values ("civic nationalism") avoids OTLS. An argument based *solely* on deep, unchanging blood/descent ("ethnic nationalism") might be essentialist and wrong, but it doesn't involve the *switch* when debunked. OTLS thrives in the messy middle where civic appeals mask or rely on unexamined ethnic essentialism.

  **In essence:**

  *   **OTLS is present:** When there's the *switch* (facts -> belief when challenged) and the *re-deployment* of the debunked (or shielded) antiquity claim for normative power (assimilation demands).
  *   **OTLS is absent:** When arguments are consistent – either explicitly acknowledging modern construction and arguing norms based on *that*, or arguing consistently from subjective belief *without* leveraging an implied ancient essence for norms, or making nuanced historical arguments that don't claim an unchanging core demanding assimilation.

  You've identified a powerful and deceptive rhetorical tool central to nationalist ideology. While no single term perfectly captures it, **Opportunistic Temporal Legitimation Switch (OTLS)** or highlighting the **Janus-faced contradiction in temporal legitimation** effectively names the core manipulative move you've dissected. Calling it out requires pointing directly to the switch and the normative bait-and-switch it enables.
