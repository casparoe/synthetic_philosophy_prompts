  Okay so I've been noticing this pattern in arguments about nationalism and where countries come from — especially in immigration threads or seperatist debates. Someone claims their nation is ancient, like we've been a continuous people since teh medieval dynasty and points to language or symbols. Then you check and teh actual administrative borders, the mass schooling, the standard dialect — all of that was cooked up in the 19th century, sometimes deliberately. Instead of backing down, they pivot: the shared belief is what matters, not teh paprework, which sounds reasonable. But then they immediately use the original ancient-claim to argue that newcomers need to assimilate to this timeless culture. So they use teh historical authority when it's convenient and the subjective-belief shield when it's challenged. It's not motte-and-bailey exactly because neither version is clearly the defensible core — they're more like two incompatible justifications that share a slogan. Is there an established name for this specific move? I know Hobsbawm and Anderson have things to say about invented traditions and imagined communities, but I'm asking about teh rhetorical pattern where you defend antiquity with facts, retreat to collective imagination when debunked, then re-deploy teh antiquity for normative weight. Does that have a concept in philosophy or sociology, and if not can you define it with boundary cases? I want to know where it ends and regular complex identity begins.
