answer: |-
  Based on your precise description, this phenomenon **does not have a single, universally established term** in political ethics or psychology. It represents a specific and perverse inversion of the classic "dirty hands" problem and adjacent concepts. However, we can define it clearly and distinguish it from related ideas.

  **Proposed Term & Definition:**

  *   **Transgressive Legitimation:** The process whereby a political leader or regime **actively cultivates and publicly displays the violation of a widely shared moral norm** (the "dirt") **as a deliberate strategy to generate political authority, credibility, and legitimacy** among a relevant audience (supporters, citizens, adversaries). The transgression itself becomes a signal of exceptional capability, resolve, and the willingness to bear the burdens of power that ordinary citizens cannot or will not. The *wrongness* of the act is not hidden or merely accepted as a cost; it is instrumentalized and transformed into a source of power.

  **Key Characteristics & Boundary Conditions:**

  1.  **Public Display of Transgression:** The act must be known or deliberately made known. Secrecy or plausible deniability negates the phenomenon.
  2.  **Violation of Widely Shared Norm:** The act must contravene a deeply held moral principle (e.g., due process, prohibition on torture, non-negotiation with terrorists, sanctity of life in non-combat contexts).
  3.  **Invocation of Higher Collective Good:** The transgression is justified (by the actor and/or supporters) as necessary for a paramount public goal (national security, peace, stability, survival).
  4.  **Inversion of Moral Cost:** The moral "dirt" is not a regrettable burden privately borne by the leader (classic dirty hands), nor a necessary evil reluctantly accepted by the public. It becomes an *asset*, actively leveraged to:
      *   Signal resolve and seriousness ("Only someone willing to do *this* can protect us").
      *   Demarcate the leader from ordinary citizens ("You couldn't do this, but I must").
      *   Dismiss critics as naive or weak ("They don't understand the real world of power").
      *   Construct an aura of exceptional authority grounded in the transgression itself.
  5.  **Audience Complicity/Collaboration:** The phenomenon requires an audience (supporters, a significant portion of the public) that *accepts and validates* this instrumentalization of transgression. Their perception shifts from "This was wrong but necessary" to "This *demonstrates* why they are the right leader for these hard times."
  6.  **Applicability:**
      *   **Democratic Contexts:** Highly applicable, often relying on electoral support or popular approval where the display resonates with fears or desires for security/strength. Accountability mechanisms exist but are rendered less effective by the legitimation strategy (e.g., voters rewarding the transgression).
      *   **Authoritarian Contexts:** Also applicable, though the mechanism differs. The display signals strength to both the populace (deterrence, awe) and potential rivals within the regime. Legitimation may be aimed more at demonstrating invulnerability and ruthlessness to maintain control, rather than winning votes. The "higher good" justification might be thinner or replaced by raw assertions of state/power necessity.

  **Distinguishing from Nearby Concepts:**

  *   **Classic "Dirty Hands" (Walzer, Sartre, Weber):**
      *   **Core Difference:** In "dirty hands," the moral cost is a tragic burden the leader *must* bear privately (or acknowledge publicly with remorse) for the greater good. The "dirt" stains *them*, potentially corrupting them, and ideally induces guilt. **Transgressive legitimation** turns the dirt into a *badge of honor*; the stain is polished and displayed, not borne with regret. The leader may *perform* regret, but the function is to enhance credibility, not expiate guilt.
      *   **Audience:** In dirty hands, the audience might accept the necessity but still see it as morally regrettable. In transgressive legitimation, the audience actively values the transgression *as proof* of the leader's worth.
  *   **Costly Signaling:**
      *   **Overlap:** Both involve actions that are difficult or undesirable to fake. Transgression *can* be a costly signal.
      *   **Difference:** Costly signaling focuses on demonstrating commitment or quality through sacrifice *that is inherently valuable or admirable* (e.g., bravery in battle, personal financial sacrifice). **Transgressive legitimation** signals through the violation of a *moral* norm – the "cost" is moral corruption, but it's precisely *this type* of cost that signals the desired attribute (ruthless resolve). The signal isn't just costly; it's *immoral* and that immorality is the point.
  *   **Moral Authority from Sacrifice:**
      *   **Overlap:** Both derive authority from enduring hardship.
      *   **Difference:** Sacrifice typically involves enduring suffering, loss, or hardship *oneself* (e.g., Gandhi's fasting, Mandela's imprisonment) for a moral principle. **Transgressive legitimation** involves *inflicting* suffering or committing a wrong *onto others* and displaying that act as proof of one's capability. It's the sacrifice of *moral principle* (by the leader and implicitly condoned by supporters), not personal suffering for principle.
  *   **Legitimation of State Violence:**
      *   **Overlap:** State violence often requires legitimation.
      *   **Difference:** Legitimation of state violence usually focuses on justifying the *act* itself as legal, necessary, defensive, or proportional (e.g., just war theory, law enforcement paradigms). **Transgressive legitimation** may involve violence, but its distinctive feature is legitimizing the *leader* by showcasing the leader's *willingness to transgress*. The legitimation attaches to the *actor* and their exceptional nature revealed by the transgression, not just to the act. It makes the transgression a credential.
  *   **Hypocrisy:**
      *   **Core Difference:** Hypocrisy involves *concealing* a transgression while publicly professing the violated norm. **Transgressive legitimation** requires the transgression to be *known* and *displayed*. It thrives on visibility, not concealment.

  **Mechanisms & Risks:**

  *   **Psychological Mechanism (Audience):** It leverages fear, the desire for security, resentment, or admiration for ruthlessness. It offers a narrative where complexity is reduced: the leader is strong because they are unbound by squeamishness.
  *   **Risk:** This dynamic can normalize transgression, erode shared moral norms over time, create a "ratchet effect" of escalating violations to demonstrate continued resolve, and undermine democratic accountability by framing critics as weak. It can also trap leaders, forcing them into ever more extreme acts to maintain their "transgressive" credentials.

  **Conclusion:**

  You've identified a powerful and disturbing mechanism in modern politics: **Transgressive Legitimation**. It's a specific subversion of "dirty hands" theory where the moral stain becomes the foundation of authority, not its tragic cost. While drawing on elements of signaling and legitimation, its core is the **instrumental public display of norm violation as a credential**. While prevalent in democracies facing perceived existential threats (e.g., post-9/11 security policies, responses to terrorism), it is not exclusive to them and can be a feature of authoritarian consolidation. This concept deserves more explicit recognition and analysis within political theory and ethics.
