answer: |-
  Silent conventions don't break Lewis's account but require weakening the common knowledge requirement to *mutually manifest salience of precedent*, preserving arbitrariness by recognizing latent alternatives suppressed by institutional inertia, not design.  

  Lewis's core insight is that conventions solve recurrent coordination problems where agents prefer conformity *conditional* on others conforming. "Common knowledge" (CK) in his strict sense—infinite nested beliefs about mutual expectations—is an idealization for small-scale, transparent interactions. In large anonymous societies, coordination via precedent operates differently: individuals observe a salient, established pattern (e.g., driving on the right) and rationally adopt it because its *observable prevalence* signals it as the focal point for coordination. This doesn't require deep CK of mutual expectations; it requires only that the precedent is *mutually manifest*—publicly evident and recognizable as a solution. Lewis hints at this (pp. 42-44) when discussing how precedent creates "presumptive expectations."  

  Arbitrariness remains intact even when institutions ossify one solution. A convention is arbitrary if another *could* have solved the coordination problem *in the past* and if the *persistence* of the current rule depends on its established status, not intrinsic superiority. Institutional codification (e.g., traffic laws) may *remove practical alternatives* by imposing sanctions, but the *conventional core* persists: the law works *because* it coordinates expectations, and its authority relies on the pre-existing convention of legal obedience. If the law were repealed, coordination might revert to precedent-based convention (e.g., spontaneous driving norms re-emerge post-disaster).  

  This avoids collapsing convention into mere regularity or law:  
  - **vs. Mere Regularity**: Silent conventions still solve coordination problems (e.g., queueing). Regularities (e.g., afternoon coffee) lack conditional preference for conformity.  
  - **vs. Law**: Conventions persist via expectations of conformity; laws add enforcement. When laws codify conventions, the conventional layer survives as the substrate enabling the law’s efficacy.  

  Thus, Lewis’s framework holds by relaxing CK to *pragmatic salience* and anchoring arbitrariness in historical contingency, not present options. Institutionalization masks—but doesn’t erase—the conventional foundation.
