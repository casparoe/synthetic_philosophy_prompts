answer: |-
  Here’s a decision tree mapping nuanced critiques of Effective Altruism (EA), designed for philosophy-literate non-specialists. Critiques split at key disagreements, with positions named (or marked "unnamed") and their "awkward commitments" highlighted. **Bolded terms** mark genuine academic contention — no consensus exists.  

  ```mermaid
  graph TD
  A[EA's core failure is...] --> B[Allocative: <br/>Sends money to wrong places?]
  A --> C[Institutional: <br/>Structures morality/careers poorly?]
  B --> D[Measurability bias is...]
  D --> E[Practical Error: <br/>We overvalue countable things <br/>(QALYs) but can fix methods.]
  D --> F[Constitutive: <br/>Optimizing metrics *reshapes* <br/>what 'good' even means.]
  C --> G[On 'earning to give': <br/>Problem is...]
  G --> H[Individual Hypocrisy: <br/>Bad actors laundering guilt.]
  G --> I[Structural Moral Laundering: <br/>Donations legitimize harmful systems.]
  C --> J[On democratic/VC-style flaws: <br/>EA mainly...]
  J --> K[Bypasses Democratic Priorities: <br/>Elites override public will.]
  J --> L[Imports 'Move Fast' Logic: <br/>Tech hubris corrupts ethics.]
  ```

  ### Leaf Positions & Awkward Commitments:
  1. **Practical Measurability Skeptic** (e.g., some development ethicists)  
     *Awkward commitment*: Must concede that *some* "dehumanizing" interventions (e.g., bed nets) *do* save lives efficiently.  

  2. **Constitutive Measurability Critic** (e.g., embedded in post-colonial critiques)  
     *Awkward commitment*: Argues that *even successful* projects (like malaria prevention) might subtly redefine "good" as technocratic control.  

  3. **Hypocrisy Focus** (common in populist critiques)  
     *Awkward commitment*: If a genuinely ethical billionaire donated effectively, this critique dissolves.  

  4. **Structural Moral Laundering** (**contested** — inspired by Olúfẹ́mi Táíwò’s work)  
     *Awkward commitment*: Must show that EA donations *actively enable* harmful industries (e.g., crypto/pharma), not just offset them.  

  5. **Democratic Deficit Advocate** (e.g., aligns with Bernardo Venturi)  
     *Awkward commitment*: Concedes that democracies sometimes prioritize local/irrational projects over global needs.  

  6. **'Move Fast' Ethics Critic** (e.g., critics of longtermist VC culture)  
     *Awkward commitment*: Acknowledges that slow institutions (e.g., UN) often fail catastrophically too.  

  7. **Unnamed Hybrid** (K + L overlap; some argue both)  
     *Awkward commitment*: Must explain why elite-driven projects are uniquely bad vs. other undemocratic actors (e.g., Gates Foundation).  

  ### Key Tensions & Clarifications:
  - **Blurry Distinction**: "Moral laundering" vs. "hypocrisy" hinges on **whether harm is systemic** — no clean split.  
  - **Settled?** Everyone agrees measurability bias *exists* — **constitutive harm** is the contested claim.  
  - **Niche Inject**: The "constitutive" branch and "moral laundering" framing are under-discussed outside academia.  
  - **Contested Terrain**: **No consensus** exists on whether EA's institutional structure inherently corrupts, or if it’s fixable.  

  This tree excludes "Twitter critique" staples (e.g., "EA is cultish") to focus on material/philosophical disputes. Each branch forces a concrete choice: e.g., you can't oppose "earning to give" on structural grounds without biting the bullet that *any* donation from "dirty" industries is harmful.
