answer: |-
  The institutional exclusion of fundamental physical entities from moral consideration rests on several interconnected philosophical presuppositions, which I'll reconstruct systematically below. My confidence varies across components (indicated as percentages), with the valence-neutrality point being the most uncertain.

  ### Core Implicit Theory of Value & Moral Status (95% Confidence)
  1. **Anthropocentric Sentientism**: Moral standing requires **demonstrable sentience** (capacity for subjective experience) linked to neurobiological complexity or behavioral proxies. This assumes:
     - Consciousness is an emergent property of complex biological systems (not fundamental physics).
     - Moral relevance scales with cognitive/affective complexity (e.g., humans > mammals > insects).
     - Non-sentient entities (ecosystems, particles) derive value instrumentally through their effects on sentient beings.

  2. **Epistemic Boundary**: Only entities with **observable indicators of welfare interests** (e.g., pain behaviors, goal-directed learning) warrant direct moral consideration. Fundamental physics lacks such indicators.

  ### What the Practice Strictly Requires vs. What is Merely Ancillary
  - **Strict Requirements** (98% Confidence):
    - Moral status depends on *empirically detectable consciousness*.
    - Ethics assessments need not engage with metaphysical speculation (e.g., panpsychism).
  - **Ancillary Elements** (85% Confidence):
    - Biological chauvinism (consciousness *must* be biological).
    - Complete valence-neutrality of micro-experiences (this is avoidable; see below).

  ### Panpsychism's Compatibility with Current Practice (90% Confidence)
  A panpsychist **can defend the exclusion** without rejecting combination problems:
  - **The Combination Problem Defense**: Even if fundamental entities have proto-consciousness, macro-consciousness requires specific structural integration. Altering particles/spacetime need not affect *morally relevant* (i.e., integrated) consciousness.  
  - **Non-Transferable Valence**: Micro-experiences may lack valence (pleasure/suffering) or possess valence orthogonal to human concepts. Thus, physical manipulation doesn't equate to harming a subject.
  - **Epistemic Opacity**: We cannot detect or measure micro-phenomenal properties, making them ethically inert in practice.

  ### Valence-Neutrality: Assumption or Tractable Ignorance? (70% Confidence)
  **This is the point of least certainty.** The practice likely treats valence-neutrality as a **tractability principle** rather than a committed thesis:
  - Institutions implicitly argue: *Even if* micro-experiences exist, we lack methods to assess their valence or moral significance. Thus, excluding them is pragmatic, not metaphysical.
  - However, the burden of proof against valence is never addressed, revealing an unexamined bias toward biological valence as the only relevant form.

  ### Changes Required Under Panpsychist Acceptance
  If panpsychism were taken seriously in ethics frameworks (e.g., assuming fundamental entities have valence-bearing experiences):
  1. **Expanded Harm Assessment**: Particle colliders, quantum computers, or geoengineering might need to evaluate:
     - Alterations to intrinsic properties of spacetime/fields as *prima facie* harms.
     - Risks of creating or destroying experiential states (e.g., via vacuum decay).
  2. **New Metrics**: Developing proxies for "physical state welfare" (e.g., stability, complexity gradients).
  3. **Reversibility as a Criterion**: But this faces severe problems...

  ### Reversibility Criterion Applied to Physics: Coherence or Paralysis? (80% Confidence)
  Extending the reversibility principle (from animal ethics) yields **incoherent constraints**:
  - **Paralysis Problem**: *All* high-energy physics is irreversible (entropy increase). Banning irreversible changes would halt particle physics, quantum computing, and fusion research.
  - **No Identifiable Subject**: Reversibility presumes a continuous subject. Fundamental entities lack persistence or individuality (e.g., particle indistinguishability).
  - **Valence Ambiguity**: Irreversibly collapsing a quantum state might *prevent* suffering or erase joy—we cannot know. Thus, the criterion lacks action-guidance.
  - **Solution?** Only coherent if applied to *aggregate systems* with emergent consciousness (e.g., destabilizing quantum fields in biosphere-relevant ways). But this collapses back to sentientism.

  ### Confidence Summary
  - **Most Confident**: Implicit theory is anthropocentric sentientism; panpsychism can defend exclusion via combination problem (90–98%).
  - **Least Confident**: Whether valence-neutrality is an explicit assumption or mere tractability artifact (70%). Institutional documents avoid engaging this metaphysics, making motives ambiguous.

  ### Conclusion
  The current boundary reflects **pragmatic sentientism** anchored in observable welfare impacts. Panpsychism *could* justify the status quo by denying morally relevant combination or valence transfer. However, incorporating fundamental entities into ethics would require radically new frameworks—extending reversibility fails, but assessing large-scale structural alterations for valence risks might be feasible if panpsychist valence were measurable. The deepest challenge remains epistemic: without empirical access to micro-phenomenal properties, any inclusion risks either paralysis or groundless speculation.
