prompt: |-
  I am a high school junior in an elective on Enlightenment philosophy, and our class just finished reading selections from Émilie du Châtelet's essay on happiness. In my study group we have been arguing about whether her hierarchy of passions—study ranked above glory, love, and sensual pleasure—describes a real psychological law or merely defends the life of a scholar. Rather than ending with another summary, I want to present a poem that forces the idea to work structurally.

  Please write a villanelle in which two refrains carry the philosophical load. The first refrain should capture her claim that study is the only passion that is fully self-sufficient, requiring neither another person's approval nor a favorable bodily state, and therefore never decays into disgust. The second refrain should capture the dependency and eventual exhaustion of the other passions—glory, which borrows its light from an audience; love, which hinges on reciprocity; and pleasure, which depends on a body that tires. The poem should follow the ABA rhyme scheme with the refrains in the A positions. Through the five tercets, the two refrains should alternate and circle past one another without resolving, tracking how these two conditions for happiness keep intersecting but never collapsing into one. In the final quatrain, both refrains should appear together, standing side by side in co-presence rather than synthesis, reflecting her view that happiness needs the stable, prejudice-resistant foundation of study even while the other passions remain genuine but unstable supplements. The poem should be accurate enough that someone familiar with her argument recognizes the specific distinctions—especially that study alone escapes the corruption of prejudice and external opinion—without becoming a didactic lecture. Begin with the poem itself, with no preface, commentary, or restatement of the prompt, and write in American English.
reasoning: |-
  Hmm, the user is a high school junior studying Enlightenment philosophy, specifically Emilie du Châtelet's essay on happiness. They've been debating whether her hierarchy of passions—elevating study above glory, love, and sensual pleasure—is a universal psychological truth or just a defense of scholarly life. Instead of writing another summary, they want a poem that structurally embodies this idea.

  The user requests a villanelle with two alternating refrains that capture du Châtelet's core arguments: one about study's self-sufficiency (never decaying into disgust), and another about how other passions depend on external factors (audience approval, reciprocity, physical endurance) and eventually exhaust themselves. The poem must strictly follow villanelle form: five ABA tercets where the refrains alternate, and a final quatrain where both appear together without synthesis. Rhyme scheme requires the A positions to be refrains.

  Key philosophical points to embed: 
  - Study's independence from others' opinions/prejudice 
  - Glory's dependence on spectators 
  - Love's need for reciprocity 
  - Pleasure's bodily limitations 
  - The non-hierarchical co-presence in the quatrain showing study as foundation while others supplement

  Challenges: 
  Making the refrains philosophically precise yet poetic ("borrowed light" for glory, "bodies tire" for pleasure) 
  Maintaining ABA rhyme without forcing (e.g., "glow"/"bestow") 
  Avoiding didacticism while ensuring recognizability (e.g., "prejudice's stain" signals study's resistance to corruption) 

  Structural execution: 
  Tercet 1: Refrain 1 (study) establishes thesis 
  Tercet 2: Refrain 2 (other passions) introduces antithesis 
  Tercet 3: Refrain 1 returns, now contrasted with glory 
  Tercet 4: Refrain 2 returns, now contrasted with love/pleasure 
  Tercet 5: Refrain 1 reasserts study's endurance 
  Quatrain: Both refrains + two new lines showing co-presence ("Two flames: one borrowed... one stone")

  Final lines emphasize study's role as "foundation" while other passions remain "bright"—faithful to du Châtelet's view of unstable supplements.
answer: |-
  The mind's own fire requires no borrowed light.
  Glory's applause, love's gaze, pleasure's sweet ache—
  All passions fade that bodies must ignite.

  No audience need crown this inner sight,
  No lover grant what study can self-make.
  The mind's own fire requires no borrowed light.

  Ambition waits on crowds to make things bright,
  Its borrowed torch will flicker, dim, and break.
  All passions fade that bodies must ignite.

  Desire depends on an answering delight,
  Or falters when one heart begins to quake.
  The mind's own fire requires no borrowed light.

  Pleasure demands the flesh be swift and right,
  But limbs grow slow, and senses dull with ache.
  All passions fade that bodies must ignite.

  While prejudice's stain clouds wrong from right,
  Pure reason builds what time cannot forsake.
  The mind's own fire requires no borrowed light.
  All passions fade that bodies must ignite.

  Two flames: one borrowed, brilliant but finite;
  One bedrock glow no circumstance can shake.
  The mind's own fire requires no borrowed light.
  All passions fade that bodies must ignite.
  A foundation stands where bright sparks forsake.
