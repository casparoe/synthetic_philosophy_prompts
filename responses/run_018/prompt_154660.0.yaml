  The protocol's hard threshold at phi=0.42 for withdrawal of care immediately suggests a radical reductionist view - that consciousness can be quantified like a physical property. The exclusion of access-consciousness and global workspace theories is particularly telling; it implies that only integrated information matters morally, which is a strong metaphysical claim. I need to unpack how this shapes concepts of personal identity too - if consciousness is just phi, then identity vanishes below 0.42.

