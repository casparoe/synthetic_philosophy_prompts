prompt: |-
  Consider the Consensus Protocol for Disorders of Consciousness adopted by several neurocritical-care networks, which applies a perturbational-complexity-derived phi-score with a hard withdrawal-of-care threshold fixed at 0.42, mandates a secondary "phenomenal-character" review only for scores falling between 0.30 and 0.42, and explicitly excludes any evaluation of access-consciousness or global-workspace dynamics from the decision matrix, treating integrated information as the sole legally relevant substrate of moral status. What philosophical commitments about consciousness, personal identity, and the ontology of mental states does this protocol presuppose? Reconstruct the implicit theory, distinguishing what the protocol strictly requires from what it merely accommodates, assess whether its parts are mutually consistent, and show where the practice is philosophically underdetermined so that rival theories of consciousness could license identical clinical rules. State how confident you are in each claim and identify the single point about which you are least certain. Deliver your answer as exactly five numbered items, each consisting of one or two sentences, with no introduction and no conclusion.
