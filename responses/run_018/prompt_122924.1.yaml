prompt: |-
  I lead a team of health assessors for a public body that decides claims for a disability benefit. We handle something like forty cases a week; an assessor has about half an hour with a claimant and a short written record to complete, which a case manager signs off the same day. Each decision moves several years of payments and can be appealed to a tribunal. My assessors are nurses, physiotherapists and occupational therapists. None of them has any training in philosophy, and none of them will read a bibliography: anything useful has to be built into the questions they ask.

  The reason I am asking now is partly personal. Until last year I described a condition I have had since childhood with a word my grandmother used, which in our family meant something like bad nerves. When a neurologist finally gave it a name, it turned out that I had been talking about a specific, well-understood disorder for thirty years while holding almost no true beliefs about it. That is entirely ordinary, and my assessors see it daily. Claimants tell us they have arthritis in the thigh, that their water is bad, that they have the sugar, or they use a word from a first language that our interpreters render as epilepsy or asthma when that word, in the community it comes from, covers a wider or simply different set of troubles. Our working rule at present is crude: if the claimant's own account does not line up with the diagnostic category in our regulations, we treat the claim as unsubstantiated and score the item down. I have come to think that is wrong, and wrong in a way I can now name. What a person's word picks out is not settled by what is in their head; it is settled by what the thing is, by the history of the word in their community, and by which speakers that usage answers to. A claimant can therefore be referring to a real condition while badly misunderstanding it, and can equally be referring to something other than what we take her to be referring to. What I cannot do is hand my assessors a theory.

  Please write me a decision procedure they can run, grounded in that idea but never naming it as a theory, with:

  1. the questions in the order an assessor should ask them, and what counts as a sufficient answer to each. I imagine questions of roughly these kinds: is this a term the claimant would defer to a clinician about, or a term on which she is herself the authority; could the thing she names turn out not to be what she takes it to be without her being able to tell by how it feels; is there anyone the usage answers to in her community, and what is to be done when there is not.
  2. where the procedure stops with a no, and where it must stop and hand the decision to a person because the remaining question is one of values rather than fact.
  3. an honest note on which distinctions have to survive into a half-hour assessment and which can be dropped, and what we lose by dropping them.
  4. a short statement of what the procedure cannot do, and one thing an assessor must never use it for.

  Then run it on three composites I have put together from our caseload. First, a claimant who writes that he has arthritis in his thigh muscle and describes pain and swelling there, with no joint involvement. Second, a claimant whose first language is not English and whose word for her condition is glossed for us as epilepsy, although in her community that word covers both what we call epilepsy and a kind of faint with a different cause and a different outlook; her symptoms and everything she believes about herself are indistinguishable from those of the English-speaking claimant in the next room who says she has epilepsy. Third, a claimant whose condition has no settled medical standing, because her doctors disagree about it, or have withdrawn the label, or have offered her three. For each, tell me what the assessor records and what happens next, and include at least one case where the answer the procedure gives is one I will not like.

  Write it in British English, with our spelling and usage. No citations, references or reading lists, please, and no jargon an assessor would have to look up: where a distinction needs a name, give it a plain one.
reasoning: |-
  We are designing a decision procedure for health assessors to handle cases where the claimant's own terminology for their condition may not align perfectly with established medical categories. The goal is to determine whether the claimant is referring to a real condition that should be considered under the regulations, even if their understanding or the label they use is imprecise or culturally different.

   The core idea: A claimant can refer to a real condition without fully understanding it, and the meaning of the word they use is determined by the community and context, not just their personal belief.

   The procedure must be practical, fitting into a half-hour assessment and a short written record. It should avoid philosophical jargon and be a series of questions.

   Steps of the Procedure:

   1. **Establish the Claimant's Own Understanding:**
      - Ask: "Can you tell me in your own words what you mean when you say you have [claimant's term]?"
      - What counts as sufficient: The claimant provides a description of symptoms, experiences, or limitations they associate with the term. The assessor should note these.

      Why: We need to know what the claimant believes they are referring to. This is the starting point.

   2. **Determine if the Claimant Would Defer to Medical Expertise:**
      - Ask: "If a doctor or nurse told you that what you have is not exactly [claimant's term] but something else, would you accept that? Or is this something you feel you know best about?"
      - What counts as sufficient: The claimant either indicates they would defer to a clinician (suggesting they are using the term as a placeholder for a medical condition) or that they are the authority (suggesting the term might be a personal or cultural construct not necessarily tied to a biomedical category).

      Why: This helps us see if the term is being used in a way that is open to correction by medical professionals.

   3. **Check for Community Usage:**
      - Ask: "Is [claimant's term] a word that other people in your family or community use? What do they mean by it?"
      - What counts as sufficient: The claimant either confirms that others use the term and describes what it means in their community, or says it's their own personal term.

      Why: If the term is shared in a community, its meaning is shaped by that community's usage and might not match the medical term we initially associate with it.

   4. **Assess the Underlying Condition:**
      - Ask: "Regardless of the name, can you describe the symptoms or problems you experience that led you to use this term? How do they affect your daily life?"
      - What counts as sufficient: The claimant provides a clear account of symptoms, functional limitations, and impact on daily activities.

      Why: This step bypasses the label and focuses on the actual experiences. It allows the assessor to consider whether the described symptoms, regardless of the label, could correspond to a condition recognized in the regulations or whether they constitute a functional impairment that should be scored.

   5. **Deciding Next Steps:**

      - If the claimant would defer to medical expertise (from step 2) and the symptoms described (step 4) align with a recognized medical condition (even if not the one the claimant named), then the assessor should record the symptoms and the medical condition that fits (if any) and proceed to score based on that condition.

      - If the claimant would defer to medical expertise but the symptoms do not align with any recognized condition, then the claim for that specific condition is unsubstantiated. However, the symptoms might still be considered under functional descriptors.

      - If the claimant is the authority (step 2) and the term is personal (step 3) or the community usage does not match a medical category, then we cannot assume it maps to a medical condition. But the symptoms described in step 4 must still be assessed for functional impact. The condition may be recorded as the claimant's term (with a note on the description) and then the functional assessment proceeds.

      - If the claimant is the authority and the community usage is different, we must rely on the symptom description and functional impact.

   6. **Handling Values vs. Facts:**
      - The procedure stops and must be handed to a case manager (or a senior decision-maker) when the question is about how to interpret the regulations in light of the facts gathered. For example:
          - If the condition described does not fit any category in the regulations but the functional limitations are severe, the case manager must decide whether the functional descriptors apply and how to score.
          - If there is a dispute about the meaning of the regulations (e.g., whether a condition that is not medically recognized but causes significant impairment should be scored) that is a values/policy decision.

      In the assessment, the assessor should note the facts and flag any such issue for the case manager.

   7. **Honest Notes on Distinctions:**

      - Must survive: The distinction between the claimant's label and the actual symptoms/functional impact. We must capture both the claimant's own words and the underlying symptoms.
      - Can be dropped: Detailed exploration of the community usage if it becomes too complex or time-consuming. We might lose some cultural nuance, but we can still rely on the symptom description.

   8. **Limitations and Prohibitions:**

      - What the procedure cannot do: It cannot create a medical diagnosis where none exists. It cannot resolve conflicts in the medical community about a condition. It cannot change the regulations.
      - One thing an assessor must never use it for: To dismiss a claimant's account because the label is "wrong" without considering the described symptoms and functional impact.

   Now, apply the procedure to the three cases:

   **Case 1: Claimant with "arthritis in the thigh muscle"**

     Step 1: Claimant describes pain and swelling in the thigh muscle, no joint involvement.
     Step 2: Claimant likely would defer to a clinician (since they are using a medical-sounding term). If the claimant says they would accept a different medical term, then we note that.
     Step 3: The term "arthritis" is a medical term in the wider community, but the claimant is using it in a non-standard way. However, the claimant might not have a community usage beyond the general public understanding of arthritis as joint pain.

     Step 4: The symptoms described are pain and swelling in the thigh muscle. These are real symptoms that could be due to muscle strain, myositis, or other conditions.

     Assessor's Record: 
       - Claimant reports "arthritis in thigh muscle" but describes symptoms of muscle pain and swelling. 
       - Claimant would defer to medical expertise on the term.
       - Symptoms: pain and swelling in thigh muscle, affecting mobility.

     What happens next: The assessor does not score "arthritis" (which typically involves joints) but records the symptoms and functional limitations. The case manager, with input from the assessor, will consider the functional descriptors for pain and mobility. The condition might be recorded as "musculoskeletal pain" or similar, and scored accordingly.

   **Case 2: Claimant with a non-English term glossed as "epilepsy" but which in her community covers both epilepsy and fainting spells**

     Step 1: Claimant describes symptoms that might include seizures and/or fainting.
     Step 2: Ask if she would defer to a clinician. She might say yes (if she views it as a medical condition) or no (if it's a cultural term). Let's assume she would defer because she is seeing a doctor for it.

     Step 3: The term in her community covers both epilepsy and fainting. The interpreter has given the English word "epilepsy", but the community meaning is broader. The claimant might explain that in her community, the word is used for both conditions.

     Step 4: The claimant describes her symptoms: she has episodes of loss of consciousness that are brief, without the typical features of an epileptic seizure (e.g., no tongue biting, no post-ictal confusion). They are more like fainting spells.

     Assessor's Record:
       - Claimant uses a term that in her community covers both epilepsy and fainting. She describes symptoms consistent with fainting (e.g., vasovagal syncope).
       - She would defer to medical expertise.
       - Symptoms: episodes of loss of consciousness, occurring in specific situations (e.g., when standing for long periods), without features of epilepsy.

     What happens next: The condition is not epilepsy, but the symptoms (fainting) are real and may cause functional impairment. The case manager will consider functional descriptors for loss of consciousness, falls, etc. It would be scored based on the functional impact of the fainting episodes, not as epilepsy.

     This might be an answer you don't like because the regulations might have specific scoring for epilepsy, which is a recognized condition, but the claimant's condition is not epilepsy. However, if the fainting spells are frequent and severe, they might score under other descriptors.

   **Case 3: Claimant with a condition that has no settled medical standing (doctors disagree, label withdrawn, or multiple labels offered)**

     Step 1: Claimant uses a term (or terms) that have been given by doctors or that they have adopted. They describe their symptoms and limitations.

     Step 2: The claimant might be confused because of the medical disagreement. They may defer to doctors but note that doctors don't agree. They might be the authority if they have chosen a label themselves.

     Step 3: The community usage might be mixed or non-existent.

     Step 4: The claimant describes symptoms (e.g., chronic fatigue, pain, cognitive difficulties) and functional impact.

     Assessor's Record:
       - Claimant reports a condition with multiple or disputed medical labels (list the labels if given). 
       - Claimant defers to medical expertise but notes disagreement among doctors.
       - Symptoms: detailed description of the claimant's experiences and functional limitations.

     What happens next: The assessor cannot assign a single medical label because of the dispute. The case manager must focus on the functional impact of the described symptoms. The claim will be scored based on the functional descriptors that align with the symptoms and limitations, regardless of the medical label.

     Note: This might be frustrating because the regulations might require a specific diagnosis, but the procedure forces us to look at function. If the regulations do not allow scoring without a diagnosis, then the case manager might have to reject the claim for that specific condition. However, the functional limitations might still be considered under other descriptors. This is a potential point of appeal.

   **Summary of the Procedure:**

   1. Ask the claimant to describe in their own words what they mean by the term.
   2. Ask if they would defer to a clinician about the term or if they are the authority.
   3. Ask about community usage and meaning.
   4. Get a description of symptoms and functional impact, regardless of the term.

   Then:
   - If the claimant defers to clinicians and the symptoms match a recognized condition, record that condition and the symptoms.
   - If the claimant defers but the symptoms don't match the named condition but do match another, record the other condition and the symptoms.
   - If the claimant is the authority or the term is cultural and does not match a medical condition, record the term and the symptoms, and rely on the functional impact.

   Always:
   - Record the functional impact for scoring.

   Hand to case manager when:
     - There is a question of how to interpret the regulations in light of the facts (e.g., whether a condition without a clear diagnosis can be scored, or how to weigh functional limitations that don't fit neatly into a category).

   Limitations:
     - This procedure does not change the regulations. It only helps in understanding the claimant's condition and symptoms.
     - Never use it to ignore a claimant's symptoms because the label is not medically recognized.

   We are trading off a deep exploration of cultural context for the sake of time, but we are capturing enough to avoid dismissing claims based solely on label mismatch.
answer: |-
  ### Decision Procedure for Health Assessors: Understanding Claimant Terminology

  Below is a step-by-step procedure to help assessors handle cases where a claimant's description of their condition may not align with standard medical categories. It focuses on **what the claimant is actually experiencing** rather than relying solely on the accuracy of their words. This is designed to be practical within a 30-minute assessment and a concise written record. Use it when a claimant's term seems unclear, mismatched, or culturally specific.

  **Core Principle:**  
  A claimant may be referring to a real health problem even if:  
  - Their understanding of it is incomplete or incorrect.  
  - The word they use has a different meaning in their community.  
  - It lacks a clear medical label.  

  **The Procedure:**  
  Ask these questions in order during the assessment. Record answers plainly in your notes.

  #### 1. **"What do you mean when you say [claimant’s term]? Tell me in your own words."**  
     - **Goal:** Understand the claimant’s personal definition.  
     - **Sufficient answer:** Any description of symptoms, feelings, or experiences (e.g., "It feels like burning," "I get dizzy," "I can’t walk far").  
     - **What to record:** Quote the claimant’s exact words. Do not reinterpret.  
     - **If no answer/unsure:** Note this. Probe gently: "What happens when you have it?"  

  #### 2. **"How does this affect your daily life? Give me examples."**  
     - **Goal:** Identify functional impacts, not labels.  
     - **Sufficient answer:** Specific activities limited by the condition (e.g., "I can’t stand to cook," "I fall and hurt myself," "I need help dressing").  
     - **What to record:** Concrete examples of limitations (frequency, severity, assistance needed).  

  #### 3. **"Is this something a doctor or nurse could explain better than you? Or is it something you know best?"**  
     - **Goal:** Determine if the claimant sees the term as medical or personal/cultural.  
     - **Sufficient answer:**  
       - **Deference to clinicians:** "A doctor would know better," "I was diagnosed by a specialist."  
       - **Personal authority:** "Only I know how it feels," "My family calls it this, but doctors don’t understand."  
     - **What to record:** Which category applies.  

  #### 4. **"Do others in your family or community use this word? What do they mean by it?"**  
     - **Goal:** Check for shared cultural meaning.  
     - **Sufficient answer:**  
       - **Community usage:** "Yes, my neighbours get it too—it means sudden shakes," "At home, it’s what we call weakness."  
       - **No community link:** "It’s just my word," "I made it up."  
     - **If unclear:** Ask: "Who would you ask if you weren’t sure what the word means?"  
     - **What to record:** Whether the term is shared, and a brief summary of its meaning to others.  

  #### Where the Procedure Stops:  
  - **Stop with "no"** at Question 3 if the claimant **asserts personal authority** *and* there is **no community usage** (Question 4). In this case, the term is likely personal shorthand. Base scoring solely on functional impacts (Question 2), not the label.  
  - **Hand to case manager** when:  
    - The functional impact (Question 2) is clear, but it’s ambiguous whether it fits the benefit criteria. This is a **values/policy call** (e.g., "Is chronic pain without a diagnosis covered?").  
    - Medical evidence conflicts (e.g., doctors disagree).  

  #### Honest Notes on Distinctions:  
  - **Must survive into assessment:**  
    - The split between **personal/cultural terms** (Questions 3–4) and **functional impacts** (Question 2). Dropping this risks misinterpreting the claimant.  
    - **Functional examples** (Question 2). Without these, we lose the link to disability.  
  - **Can be dropped:**  
    - Deep exploration of community usage (Question 4) if time runs short. Focus on the claimant’s own meaning (Question 1) and function (Question 2). We lose cultural nuance but retain core symptoms.  

  #### What the Procedure Cannot Do:  
  - It **cannot resolve medical disagreements** or create new diagnoses. It only clarifies what the claimant is experiencing.  
  - **Never use it to:** Dismiss a claimant’s account because they "used the wrong word." Always return to functional impacts.  

  ---

  ### Running the Procedure on Case Examples

  #### Case 1: "Arthritis in the thigh muscle" (pain/swelling, no joint involvement)  
  1. **Q1:** "Arthritis means deep aching in my thigh, like a bruise that swells."  
  2. **Q2:** "I can’t climb stairs or lift my leg to put on trousers. I use a stick."  
  3. **Q3:** "A doctor would know better—I’m not an expert."  
  4. **Q4:** "My family calls it arthritis too, but we’ve never seen a doctor for it."  
     - **Analysis:** Claimant defers to clinicians (Q3) but misunderstands "arthritis." Community usage exists but aligns with claimant’s view.  
     - **Assessor records:**  
       - *Claimant’s term:* "Arthritis in thigh."  
       - *Symptoms/functional impact:* Localised thigh pain, swelling, reduced mobility (needs stick, can’t climb stairs).  
       - *Medical deference:* Yes. *Community usage:* Yes, similar meaning.  
     - **Next:** Ignore the label "arthritis." Symptoms suggest a musculoskeletal issue (e.g., myositis). Score based on functional mobility limits. Medical review may be needed, but the claim **isn’t dismissed**—function is established.  

  #### Case 2: Non-English term glossed as "epilepsy" (covers epilepsy and faints in community)  
  1. **Q1:** "I get sudden blackouts. My body shakes, and I wake up tired."  
  2. **Q2:** "I collapsed at work last month. I can’t drive or bathe alone."  
  3. **Q3:** "Doctors know best—I take epilepsy pills."  
  4. **Q4:** "Back home, this word means any sudden collapse. Some have fits, some just faint."  
     - **Analysis:** Claimant defers to clinicians (Q3), but community usage is broader than English "epilepsy." Symptoms could fit epilepsy or syncope.  
     - **Assessor records:**  
       - *Claimant’s term:* "[Non-English word] (interpreter: epilepsy)."  
       - *Symptoms/functional impact:* Blackouts with shaking, fatigue; can’t drive/bathe alone.  
       - *Medical deference:* Yes. *Community usage:* Broader term (covers faints and seizures).  
     - **Next:** Do not score as "epilepsy" without evidence. Record symptoms as "blackouts with shaking." Functional impact (safety risks) is clear. Case manager decides if this fits benefit criteria for loss of consciousness. **You may not like this**—it decouples from the "epilepsy" label—but avoids misdiagnosis.  

  #### Case 3: No settled medical standing (doctors disagree/withdrawn label)  
  1. **Q1:** "I call it nerve fire. It’s burning pain everywhere, like electric shocks."  
  2. **Q2:** "I can’t sit for more than 10 minutes. I need help with housework."  
  3. **Q3:** "Doctors argued—one said fibromyalgia, one said anxiety. I don’t know who’s right."  
  4. **Q4:** "No one else uses this term. It’s just how I describe it."  
     - **Analysis:** Claimant defers to clinicians (Q3), but medical consensus is absent. No community usage (Q4).  
     - **Assessor records:**  
       - *Claimant’s term:* "Nerve fire."  
       - *Symptoms/functional impact:* Widespread burning pain, electric shocks; unable to sit or do housework.  
       - *Medical deference:* Yes. *Community usage:* None.  
     - **Next:** Label is irrelevant. Functional impact (pain limiting sitting/housework) is key. Case manager must decide if pain severity meets benefit thresholds—**a values call**. If regulations require a diagnosis, the claim may fail, but the functional impact is documented for appeal.  

  ---

  ### Final Notes  
  - **Why this works:** It separates **words** from **experiences**. Assessors don’t need philosophy—just structured questions.  
  - **In practice:** Focus on Questions 1–2 first; skip Question 4 if short on time. Function is non-negotiable.  
  - **Risk:** We may still miss cultural nuances, but we avoid the worst error: rejecting real disabilities over word choice.  
  - **Key reminder:** Never let a claimant’s "wrong" label override functional evidence. If their thigh hurts, it hurts—even if it’s not "arthritis."  

  This procedure respects claimants’ realities while fitting your team’s constraints. It won’t fix flawed regulations, but it ensures decisions are grounded in fact, not terminology.
