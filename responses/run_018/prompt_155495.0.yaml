prompt: |-
  I facilitate governance design for cooperative housing associations—groups of thirty to two hundred households that draft their own charters and amend them by supermajority. Increasingly, these groups want to embed what I call Ulysses provisions: rules that are deliberately costly to overturn, meant to bind future residents to commitments made today, such as perpetual affordability covenants, bans on speculative resale, or mandatory environmental maintenance levies. The philosophical rationale is familiar—a collective, like an individual, may rationally precommit to avoid predictable failures of will or shortsightedness. But my clients also fear locking themselves into mistakes if conditions change radically, and they want something more nuanced than a simple sunset clause. I have been experimenting with a framework I term conditional rigidity with epistemic release: the idea that a precommitment should not dissolve automatically after a fixed term, but only when an independent internal review body, operating under its own locked procedural rules, certifies that the original rationale for the clause has become epistemically obsolete according to criteria specified in the charter itself. This creates a second-order binding—the group binds not only its future actions but also the conditions under which it may reconsider them.

  I need you to turn this combination of Ulysses-style constitutional precommitment and this second-order, conditionally locked release mechanism into an operational decision procedure my clients can actually run during charter drafting. The procedure should be ordered: the specific questions to ask about a proposed provision, what counts as a sufficient answer to advance to the next step, where the procedure stops with a clear recommendation not to precommit, and where it explicitly hands the decision to human judgment because the issue is one of values rather than institutional mechanics. It must handle hard cases—provisions that protect vulnerable members versus those that merely reflect current aesthetic preferences; release mechanisms that risk being captured by the very majorities the precommitment is meant to restrain; and situations where specifying the epistemic obsolescence criteria in advance seems impossible without smuggling in the desired conclusion. Please apply the procedure to three proposed charter clauses: a perpetual covenant capping resale prices at original purchase value plus inflation; an irrevocable rule requiring unanimous consent to approve emergency loans above a set threshold; and a clause mandating specific low-carbon heating infrastructure that is currently compulsory but might become technologically obsolete. For at least one of these, the procedure should yield a recommendation that my clients will dislike—perhaps that a deeply valued provision should not be precommitted, or that the release mechanism they want is structurally self-defeating. Also flag exactly which steps in your procedure are judgment calls disguised as technical checks, and state clearly what the procedure cannot do—where a cooperative must simply choose between competing visions of its own future self.
reasoning: |-
  We are designing a decision procedure for cooperative housing associations to decide whether to include a Ulysses provision (a precommitment rule that is costly to overturn) and, if so, to design a conditional rigidity with epistemic release mechanism.

  The procedure must:
  1. Be ordered: specific questions to ask about a proposed provision, with clear criteria for advancing or stopping.
  2. Identify when to recommend against precommitment.
  3. Explicitly hand decisions to human judgment when the issue is about values.
  4. Handle hard cases (e.g., protecting vulnerable members vs. aesthetic preferences, avoiding capture of release mechanisms, specifying epistemic obsolescence criteria without bias).
  5. Apply to three examples and yield at least one recommendation that the clients might dislike.

  The core idea: conditional rigidity with epistemic release. The precommitment does not dissolve automatically (like a sunset clause) but only when an independent internal review body, operating under locked procedural rules, certifies that the original rationale for the clause has become epistemically obsolete according to pre-specified criteria.

  ---

  **Decision Procedure: "Precommitment and Epistemic Release Assessment" (PERA)**

  The procedure is divided into steps. At each step, if the answer is negative (or the condition is not met), we either stop and recommend against precommitment, or we loop back to adjust the provision. Some steps require judgment calls (we will flag them). The steps are:

  **Step 0: Provision Identification**
     - _Input:_ A proposed charter clause (the precommitment rule).
     - _Question:_ Is the clause intended to protect against a predictable collective action problem, weakness of will, or short-termism that could harm the cooperative's long-term values or survival?
     - _Sufficient Answer:_ Yes, with a clear description of the problem and why it is predictable and serious. If no, the procedure stops and recommends not to precommit because the clause is not a Ulysses provision (it might be a regular rule that can be changed by normal amendment).
     - _Judgment Call:_ Determining what counts as a "predictable collective action problem, weakness of will, or short-termism" requires judgment. However, the group must articulate it clearly.

  **Step 1: Vulnerability and Values Assessment**
     - _Question:_ Does the clause primarily protect vulnerable members or core cooperative values (e.g., affordability, sustainability, democratic control) as opposed to reflecting transient preferences (e.g., current aesthetics, temporary economic conditions)?
     - _Sufficient Answer:_ If yes, proceed. If no, the procedure stops and recommends not to precommit because the clause is not important enough to justify the rigidity. Alternatively, the group might reconsider whether the clause should be in the charter at all (as a regular rule) or if it is better handled by ordinary policy.
     - _Judgment Call:_ Distinguishing between core values and transient preferences is a value judgment. The group must explicitly agree that the clause is about core values.

  **Step 2: Reversibility Without Precommitment**
     - _Question:_ Without a precommitment (i.e., if the rule were amendable by ordinary majority), is there a strong risk that a future majority would overturn it under conditions that the current members would consider illegitimate (e.g., under short-term pressure, without due consideration of long-term consequences, or by a coalition that disregards the interests of vulnerable members)?
     - _Sufficient Answer:_ If yes, proceed. If no, the procedure stops and recommends not to precommit because the rule can be safely managed by ordinary amendment procedures.
     - _Judgment Call:_ Assessing the risk of future illegitimate overturning is speculative and requires judgment.

  **Step 3: Design of Epistemic Obsolescence Criteria**
     - _Question:_ Can the cooperative specify, in the charter, clear and verifiable criteria for when the original rationale for the clause has become epistemically obsolete? (These criteria must be based on objective indicators or conditions that can be assessed without relying on the very values the clause is meant to protect.)
     - _Sufficient Answer:_ If yes, proceed to Step 4. If no, the procedure stops and recommends not to precommit because the release mechanism cannot be designed without creating a self-defeating or arbitrary process. Alternatively, the group might consider a sunset clause (if they can accept automatic dissolution) or leave the rule as an ordinary amendment.
     - _Hard Case:_ If specifying the criteria seems impossible without smuggling in the desired conclusion (i.e., if the criteria would inherently require a value judgment that the rule is no longer needed, which is what the release body is supposed to avoid), then precommitment is not feasible via this mechanism.

  **Step 4: Independence and Capture Resistance of the Review Body**
     - _Question:_ Can the review body be designed to be independent (e.g., selected by a process that is not easily controlled by a transient majority) and operate under procedural rules that prevent capture by the majority the precommitment is meant to restrain?
     - _Sufficient Answer:_ If yes, proceed to Step 5. If no, the procedure stops and recommends not to precommit because the release mechanism would be too vulnerable to capture, making the precommitment either too rigid (if the body is too insulated) or too easily overturned (if not). Alternatively, the group might consider a different release mechanism (e.g., requiring a higher supermajority for amendment without an independent body) but that would not be "epistemic release".

  **Step 5: Locking the Procedure**
     - _Question:_ Can the procedural rules for the review body (including its composition, selection process, and decision criteria) be locked into the charter in a way that is itself costly to amend (i.e., requiring a supermajority) and designed to resist manipulation?
     - _Sufficient Answer:_ If yes, proceed to Step 6 (final design). If no, the procedure stops and recommends not to precommit because the second-order rules (for the release) are not sufficiently rigid, risking that the release mechanism itself is changed to make it easier to overturn the precommitment.

  **Step 6: Final Design**
     - _Output:_ Draft the precommitment clause with the following elements:
        a. The substantive rule (the precommitment).
        b. The establishment of an independent review body (with locked selection and procedural rules).
        c. The epistemic obsolescence criteria (clear, verifiable conditions under which the rule can be reviewed).
        d. The process: the review body can be triggered (by a specified event or petition) and must certify that the criteria for obsolescence are met. Upon certification, the rule is suspended (or amended) by a defined process (e.g., a simple majority vote, or automatically).
        e. The locked rules for the review body are also part of the charter and require a supermajority to amend.

  ---

  **Application to Three Proposed Charter Clauses**

  **Case 1: Perpetual Covenant Capping Resale Prices at Original Purchase Value Plus Inflation**

  - **Step 0:** Yes, this is a Ulysses provision. It aims to prevent speculative resale and ensure perpetual affordability, protecting against the collective action problem of future residents voting to allow market-rate sales for short-term gain.
  - **Step 1:** Yes, it protects vulnerable members (low-income residents) and a core cooperative value (affordability).
  - **Step 2:** Without precommitment, a future majority might overturn the cap under pressure from rising market prices, leading to loss of affordability. Risk is high, so proceed.
  - **Step 3:** *Designing epistemic obsolescence criteria:* What would make the rationale (ensuring affordability) obsolete? For example, if the cooperative's housing is no longer desirable (e.g., due to environmental disaster) and prices fall below the cap anyway, the cap is irrelevant. But if the cooperative remains desirable, the rationale remains. However, the group might specify: "The review body may certify obsolescence only if the median market price for comparable housing in the area falls below the cap for a continuous period of five years." This is objective and verifiable. But note: if the cap becomes too low relative to incomes (making it hard to sell) but market prices are still above the cap, the rationale (preventing speculation) still holds. The group must decide: is the cap's purpose only to prevent speculation, or also to ensure affordability? If the latter, then a criterion might be: "if the cap is so low that no one can afford to buy even at the cap because incomes have dropped, making the cap irrelevant." But that's hard to specify without value judgments. 
     - _Hard Case:_ If the group cannot agree on objective criteria that don't require value judgments about what constitutes "affordability" or "speculation", then Step 3 fails. Let's assume they specify: "if the cap is above the 25th percentile of market prices for comparable housing in the area for five consecutive years, then the rationale of preventing speculation is obsolete (because there is no speculation at that price level)." This is objective. So we proceed.
  - **Step 4:** The review body must be independent. They might create a committee of randomly selected members (with long terms) or include external experts. The key is to avoid capture by a majority that wants to remove the cap. They can design it to be independent? Yes, so proceed.
  - **Step 5:** The rules for the review body (selection, terms, criteria) must be locked. The group can require a supermajority to change these rules? Yes.
  - **Step 6:** Design the clause with the cap, the review body, and the criteria.

  **Case 2: Irrevocable Rule Requiring Unanimous Consent to Approve Emergency Loans Above a Set Threshold**

  - **Step 0:** This is a Ulysses provision. It aims to prevent reckless borrowing that could jeopardize the cooperative's financial stability by requiring unanimous consent for large emergency loans. The problem is short-term panic leading to hasty decisions.
  - **Step 1:** It protects the cooperative's long-term financial health (a core value). But note: it might also block necessary loans, harming the cooperative. We proceed to Step 2.
  - **Step 2:** Without precommitment, a future majority might lower the threshold or remove the unanimity requirement in a non-emergency context, but the rule is meant for emergencies. However, the rule might be too rigid: what if a loan is needed to prevent disaster and one member unreasonably blocks it? The current group must weigh the risks. If they think the risk of reckless borrowing is high and the risk of one member blocking a necessary loan is low, they might proceed. But note: the rule might harm the cooperative in a real emergency. This is a judgment call.
     - _But let's continue:_ The procedure must ask: is there a strong risk of illegitimate overturning? Maybe not as much as in Case 1. However, the group might fear that in a non-emergency, a future majority might weaken the rule. So, they might say yes. Proceed.
  - **Step 3:** *Epistemic obsolescence criteria:* What would make the rationale (preventing reckless borrowing in emergencies) obsolete? For example, if the cooperative becomes so wealthy that the threshold is trivial? Or if new financial instruments emerge that make the loan risk negligible? But it's hard to specify without knowing the future. Alternatively, if the threshold (in real terms) becomes too low to be relevant? They could index the threshold to inflation. But the rationale of requiring unanimity might remain. 
     - _Problem:_ The rationale might never become obsolete because emergencies and the risk of reckless borrowing will always exist. The group might specify: "if the cooperative accumulates a reserve fund that is X times the maximum loan threshold, then the rationale is obsolete." But that doesn't remove the risk in an emergency that exceeds the reserve. Alternatively, they might not be able to specify objective criteria. 
     - _Result:_ Step 3 fails. The procedure stops and recommends not to precommit. The rule is too context-dependent and the criteria for obsolescence cannot be defined without value judgments (e.g., what counts as an acceptable risk). 
     - _Alternative:_ The group might use a different release mechanism (e.g., a sunset clause every 10 years) or not precommit. This is the disliked outcome: the group values the rule but the procedure says not to precommit.

  **Case 3: Clause Mandating Specific Low-Carbon Heating Infrastructure**

  - **Step 0:** Yes, a Ulysses provision. It aims to bind the cooperative to environmental sustainability, preventing backsliding due to cost concerns or short-term thinking.
  - **Step 1:** It reflects a core value (sustainability) but also a specific technology. The group must decide: is the specific technology part of the core value? Or is the value low-carbon heating in general? The clause mandates a specific infrastructure (e.g., heat pumps). If the technology becomes obsolete, the clause might force an inefficient solution. So we proceed with caution.
  - **Step 1 (continued):** The group must answer: does this protect a core value, or is it a transient preference for a specific technology? If the core value is environmental sustainability, then the specific technology is a means. They might reframe the clause as requiring the lowest-carbon heating system available at the time of installation. But the proposed clause is specific. Let's assume they want to precommit to this technology. We proceed to Step 2.
  - **Step 2:** Without precommitment, a future majority might switch to a cheaper, carbon-intensive system. Risk is high? Yes, so proceed.
  - **Step 3:** *Epistemic obsolescence criteria:* The rationale is to use low-carbon heating. The specific technology might become obsolete (e.g., if a new technology is far superior). Criteria: "if the mandated technology is no longer available, or if a new technology has a lower carbon footprint and is economically feasible, then the rationale for mandating the old technology is obsolete." This is objective (if they define "economically feasible" with clear metrics, e.g., cost per unit of heat output compared to the old system). So proceed.
  - **Step 4:** The review body must be independent. They can design it? Yes.
  - **Step 5:** The rules for the review body can be locked? Yes.
  - **Step 6:** Design the clause with the technology mandate and the release mechanism.

  ---

  **Judgment Calls and Limitations**

  - **Judgment Calls Disguised as Technical Checks:**
     - Step 1: Deciding what is a "core value" vs. a "transient preference".
     - Step 2: Assessing the risk of future illegitimate overturning.
     - Step 3: Deciding whether the epistemic obsolescence criteria are sufficiently objective and verifiable (without being self-defeating).

  - **What the Procedure Cannot Do:**
     - Resolve fundamental value conflicts. For example, if the cooperative is divided on whether a rule protects a core value or not, the procedure cannot decide that. It requires the group to reach consensus on values.
     - Predict the future. The assessments of risk and obsolescence are inherently uncertain.
     - Eliminate all risk of capture or bad outcomes. It only structures the decision.
     - Replace democratic deliberation. At several points, the group must make value judgments.

  The procedure structures the decision but does not make it easy. It forces the group to confront the trade-offs and design challenges of precommitment. The most important outcome might be that a group decides not to precommit, or to precommit with a robust release mechanism.
answer: |-
  Below is an operational decision procedure for your clients, structured as a step-by-step workflow to evaluate Ulysses provisions and their conditional rigidity with epistemic release mechanisms. The procedure is designed to be rigorous, values-explicit, and actionable during charter drafting sessions. It flags judgment points, stops where precommitment is inadvisable, and forces explicit deliberation on trade-offs. I then apply it to your three cases, including one "disliked" outcome.

  ---

  ### **Ulysses Provision Assessment Procedure (UPAP)**  
  *For evaluating precommitment clauses with conditional rigidity and epistemic release*  

  #### **Core Principles**  
  1. **Precommitment is justified only for:**  
     - Predictable collective failures (weakness of will, short-termism, or vulnerability exploitation).  
     - Core values (e.g., equity, sustainability, democratic integrity), not transient preferences.  
  2. **Epistemic release requires:**  
     - An independent review body (IRB) with locked procedures.  
     - Objective, pre-specified criteria for "rationale obsolescence" (not outcome desirability).  
  3. **Stop conditions:**  
     - If provision protects aesthetics/trends, not core values.  
     - If epistemic criteria cannot be defined without circularity or capture risk.  
     - If release mechanism undermines the precommitment’s purpose.  

  ---  
  #### **Step-by-Step Procedure**  
  **Flow:** Start at Step 1. Proceed only if answers are sufficient. Stop if any step fails.  

  | Step | Question to Ask                                                                 | Sufficient Answer to Advance                                                                                                | Stop Condition & Recommendation                                                                                                                                 | Judgment Call? |  
  |------|----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------|  
  | 1    | **Is the provision addressing a predictable collective failure?** <br>*Define: What specific weakness (e.g., short-termism, majority exploitation) does it bind against?* | Clear evidence of historical/empirical precedent (e.g., data from similar co-ops) AND a causal link to harm.                | **STOP:** No predictable failure exists. → *Recommend: Do not precommit. Use ordinary majority rule.*                                                          | Yes. Assessing "predictability" requires contextual judgment. |  
  | 2    | **Does the provision protect a core cooperative value (not a transient preference)?** <br>*Define: Is this value central to the co-op’s identity (e.g., affordability) or expendable (e.g., paint colors)?* | Explicit link to foundational values (e.g., "permanent affordability" in mission). Vulnerable group protection strengthens the case. | **STOP:** Protects preferences/aesthetics. → *Recommend: Do not precommit. Sunset clauses or regular amendments suffice.*                                      | **Yes.** Distinguishing "core value" vs. "preference" is inherently values-based. |  
  | 3    | **Can epistemic obsolescence criteria be specified in advance?** <br>*Define: What conditions would objectively prove the *original rationale* is obsolete (e.g., technological irrelevance), not that the *outcome* is undesirable?*  | Criteria are measurable, exogenous, and falsifiable (e.g., "technology banned by EU regulators"). No reliance on value judgments. | **STOP:** Criteria require circular logic (e.g., "if the rule is unpopular") or desired outcomes (e.g., "if inflation makes caps painful"). → *Recommend: Do not precommit.* | Partially. Designing criteria is technical, but "falsifiability" relies on group agreement. |  
  | 4    | **Is the IRB design capture-resistant?** <br>*Define: How are IRB members selected? Can future majorities manipulate appointment/review rules?* | Selection avoids direct election (e.g., lottery + expertise, staggered terms). Rules locked under higher supermajority than the provision itself. | **STOP:** IRB is elected by simple majority or lacks insulation. → *Recommend: Do not precommit. Release mechanism is self-defeating.*                         | No. This is a mechanical check: if IRB selection is majority-dependent, it fails. |  
  | 5    | **Does epistemic release avoid value substitution?** <br>*Define: When the IRB certifies obsolescence, does it trigger re-evaluation (not automatic repeal)?* | Charter requires a vote (e.g., supermajority) to amend post-certification. IRB only confirms rationale death, not new solutions. | **LOOP BACK:** If release = automatic repeal. → *Adjust: Add a vote step. Return to Step 4.*                                                                   | No. Pure rule design. |  
  | 6    | **Final Check: Is precommitment necessary?** <br>*Define: Could ordinary supermajority amendments address the risk without rigidity?* | Rigidity’s costs (e.g., inflexibility) outweigh risks of amendment if IRB/criteria are robust.                               | **STOP:** Ordinary amendments are sufficient. → *Recommend: Do not precommit.*                                                                                | **Yes.** Balancing costs/benefits requires value-laden trade-offs. |  
  | 7    | **Drafting Directive**                                                                 | N/A                                                                                                                         | Proceed with precommitment clause, including:<br> a. Ulysses provision + supermajority threshold.<br> b. IRB composition/procedure (locked identically).<br> c. Obsolescence criteria.<br> d. Post-certification amendment process. | N/A            |  

  ---  
  #### **Procedure Notes**  
  - **Judgment Calls Disguised as Technical Checks:** Steps 1, 2, and 6 involve values-based judgments framed as technical assessments (e.g., "core value" in Step 2). Facilitators must surface these for explicit deliberation.  
  - **What UPAP Cannot Do:**  
    - Resolve conflicts over competing values (e.g., "affordability vs. capital investment"). The co-op must choose its vision.  
    - Guarantee future-proofing. UPAP only minimizes lock-in errors.  
    - Replace democratic legitimacy. Final adoption requires member ratification.  

  ---  
  ### **Application to Case Studies**  
  #### **Case 1: Perpetual Resale Price Cap (Inflation-Adjusted)**  
  - **Step 1:** Yes. Predictable failure: future residents may raise prices for short-term gain, undermining affordability.  
  - **Step 2:** Yes. Protects core value (permanent affordability for vulnerable members).  
  - **Step 3:** **Hard case.** *Obsolescence criteria:* "If inflation-adjusted caps make units unsellable (e.g., 12+ months vacant) due to market divergence." → **Sufficient.** Criteria are exogenous (market data).  
  - **Step 4:** IRB = panel of 3 external housing economists + 2 randomly selected members. Selection by lottery + co-op board approval (85% supermajority). → **Capture-resistant.**  
  - **Step 5:** Post-certification, 75% vote required to amend cap. → Pass.  
  - **Step 6:** Precommitment necessary—ordinary amendments could gut affordability.  
  - **Outcome:** **Precommitment recommended.** Draft with IRB and market-vacancy criteria.  

  #### **Case 2: Unanimous Consent for Emergency Loans (Threshold: 10% Annual Budget)**  
  - **Step 1:** Yes. Predictable failure: panic-driven debt risks bankruptcy.  
  - **Step 2:** Partial. Protects financial stability (core) but unanimity may harm collective survival (e.g., one dissenter blocking urgent repairs).  
  - **Step 3:** **Fails.** *Obsolescence criteria impossible.* Rationale (preventing rash decisions) can’t be obsolete—emergencies are eternal. Criteria like "if loans are cheaper" confounds rationale with outcome. → **STOP. Do not precommit.**  
  - **Why clients dislike this:** They value financial caution, but UPAP rejects rigidity because (a) epistemic obsolescence is indefinable, and (b) unanimity risks paralyzing co-op in crises.  
  - **Alternatives:** Ordinary supermajority (e.g., 80%) for loans, or expedited IRB review *without* precommitment.  

  #### **Case 3: Mandatory Low-Carbon Heating Infrastructure**  
  - **Step 1:** Yes. Predictable failure: future cost-cutting may revert to fossil fuels.  
  - **Step 2:** Yes. Protects core value (sustainability).  
  - **Step 3:** **Sufficient.** *Obsolescence criteria:* "If technology is banned by national regulations OR unavailable from suppliers for 24 months."  
  - **Step 4:** IRB = sustainability engineer + co-op’s environmental committee. Selection fixed in charter (no majority interference). → **Robust.**  
  - **Step 5:** Post-certification, 70% vote required to adopt new tech. → Pass.  
  - **Step 6:** Precommitment justified—prevents backsliding, release mitigates tech obsolescence.  
  - **Outcome:** **Precommitment recommended.** Include regulatory/availability criteria.  

  ---  
  ### **Key Insights from UPAP**  
  1. **Precommitment is not for "important" rules** but those with **inescapable collective failures** and **defensible obsolescence conditions**.  
  2. **The disliked outcome (Case 2)** arises when epistemic obsolescence is conceptually impossible. Here, rigidity creates existential risk, so UPAP forces ordinary governance.  
  3. **Facilitator Role:** Flag Steps 2 and 6 as values checkpoints. Use structured deliberation (e.g., "What makes affordability *core*? How do we define 'vulnerable'?").  

  By following UPAP, co-ops avoid locking in mistakes while honoring Ulysses’ intent: binding future selves *only* when rationality outweighs democracy.
