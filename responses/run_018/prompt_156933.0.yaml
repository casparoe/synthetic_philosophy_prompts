answer: |-
  Here's a disambiguation of the key theses hiding in "incommensurable paradigms live in different worlds," assessed for defensibility, Kuhn's actual position, and whether it blocks rational comparison, with a focus on the local/global distinction:

  1.  **Taxonomic Incommensurability (Local - Most Defensible & Kuhnian Core):**
      *   **Thesis:** Scientific terms (especially kind-terms like "mass," "space," "time," "planet") are defined by their relationships *within* a paradigm's conceptual network. Shifting paradigms changes these relationships and meanings. Terms from different paradigms cannot be perfectly mapped onto each other (no shared "taxonomy"). *Local* means this affects *key* terms central to the theories, not necessarily every word.
      *   **Defensible?** **Yes, partially.** Meaning change in theory shifts is well-documented (e.g., Newtonian "mass" vs. Relativistic "rest mass"). Perfect point-by-point translation is often impossible for core theoretical terms.
      *   **Kuhn Held?** **Yes.** This was a core, evolving part of Kuhn's later work (post-*Structure*).
      *   **Blocks Rational Comparison?** **No, not inherently.** Scientists can *learn* the other paradigm, understand its internal logic and problem-solving effectiveness, compare empirical success (though data may be interpreted differently), and assess coherence/fruitfulness. Comparison is *difficult* and *interpretive*, not algorithmic, but possible. Shared mathematical formalisms or low-level observational reports often provide bridges.

  2.  **Semantic Holism (Often Implied, Broader than Strict Kuhn):**
      *   **Thesis:** The meaning of *any* term in a theory is dependent on the meaning of *all* other terms in the whole theoretical framework. Changing any part potentially changes the meaning of everything ("meaning holism").
      *   **Defensible?** **Highly Controversial/Extreme.** While meaning is context-dependent, strong holism makes communication *within* a paradigm or learning *across* paradigms seem impossibly mysterious. Most reject this strong version.
      *   **Kuhn Held?** **Ambiguous/Attributed.** Kuhn's early work (e.g., "world changes") was often *interpreted* this way, leading to charges of relativism. He later clarified and backed towards the more moderate taxonomic view.
      *   **Blocks Rational Comparison?** **Purportedly Yes, but Collapses.** If *no* shared meanings exist *at all*, comparison seems impossible. However, this strong thesis is indefensible. Humans demonstrably learn new languages/theories. Shared practices, instruments, and basic perceptual experiences provide anchors.

  3.  **Methodological Pluralism / Lack of Shared Standards (Global Claim):**
      *   **Thesis:** Different paradigms embody different standards of what counts as a good theory, valid evidence, a significant problem, or a legitimate explanation. There is no neutral, super-paradigmatic "scientific method" to adjudicate between them.
      *   **Defensible?** **Yes, significantly.** Standards *do* evolve (e.g., demands for mathematical rigor, reproducibility, mechanistic explanation). What counts as "proof" or a "good reason" can shift.
      *   **Kuhn Held?** **Yes.** A major point in *Structure*. Paradigms define "normal science" and its standards.
      *   **Blocks Rational Comparison?** **No, but complicates it.** Comparison isn't rule-based but *persuasive* and *evaluative*. Scientists argue about which paradigm solves more important problems more effectively, is more fruitful, coherent, or handles anomalies better. Shared values *often* persist (e.g., accuracy, scope, simplicity – though interpreted differently), and pragmatic success matters. Conversion is more like persuasion than proof.

  4.  **Radical Ontological Relativism / "World Change" (Global & Strongest Claim):**
      *   **Thesis:** Paradigms don't just interpret the world differently; they *constitute* different realities. The entities, laws, and even the sensory experiences of scientists literally change. Newtonians and Einsteinians literally "live in different worlds" populated by different things.
      *   **Defensible?** **Largely No.** While perception is theory-laden and concepts shape experience, the idea that there is no stable, mind-independent world interacting with paradigms is extreme idealism/solipsism. It struggles to explain how instruments work across paradigms or how paradigm shifts are motivated by anomalies *in the world*.
      *   **Kuhn Held?** **Ambiguous/Rhetorical.** Kuhn used dramatic "world-change" language in *Structure* ("After a revolution scientists work in a different world"). He later clarified he meant a change in *conceptual organization* and *perceptual experience*, not literal solipsistic worlds. Critics often seized on the literal interpretation.
      *   **Blocks Rational Comparison?** **Purportedly Absolutely.** If there's no shared reality to refer to, comparison is meaningless. However, this thesis is generally rejected as indefensible. The stability of the physical world (despite conceptual changes) and the success of science in interacting with it argue against it.

  **The Crucial Local vs. Global Distinction:**

  *   **Local Incommensurability (Plausible):** Affects *core theoretical terms* and *concepts*. Translation for *those specific terms* is impossible without loss or distortion. **Does not block rational comparison.** Scientists work around it by learning both frameworks, focusing on empirical consequences, mathematical mappings where possible (e.g., Newtonian mechanics as low-velocity limit of Relativity), and pragmatic evaluation.
  *   **Global Incommensurability (Implausible):** Claims *no* shared meanings, standards, or access to a common world exist *at all*. Language as a whole is untranslatable; worlds are solipsistic. **Purports to block all rational comparison.** However, this collapses under scrutiny. Basic communication across paradigms happens; instruments work; the world imposes constraints. Kuhn's stronger rhetoric sometimes suggested this, but his more careful position was closer to local incommensurability + methodological shift.

  **Verdict on the Seminar Claim:**

  *   The claim ("no shared language so rational choice impossible") slides from the plausible core of **local taxonomic incommensurability** (which makes translation *difficult* for *key terms*) to the indefensible implication of **global semantic holism or ontological relativism** (which would indeed make comparison impossible).
  *   **Kuhn's core position (local taxonomic incommensurability + methodological shift)** is defensible and **does not block rational comparison**. It makes it **interpretive, holistic, and value-laden**, rather than algorithmic or based on simple falsification. Scientists compare paradigms by evaluating their problem-solving effectiveness, scope, coherence, and fruitfulness *within a historical and pragmatic context*, not by a point-by-point logical deduction using perfectly shared terms and rules.
  *   **Therefore, the speaker's use of the phrase to "shut down" comparison is invalid.** It misrepresents the strongest (local) form of incommensurability as the weakest (global) strawman. Rational comparison, while complex and lacking a single "neutral algorithm," is demonstrably possible and happens all the time in science and its history. The burden shifts to proponents of a new paradigm to persuade the community that it handles the domain *better* overall.
