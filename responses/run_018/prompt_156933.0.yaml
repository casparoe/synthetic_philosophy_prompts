  i was in a seminar on phil of science and someone threw out 'incommensurable paradigms live in diffrent worlds' to shut down a comparison between Newtonian and Einsteinian mechanics. they said there's no shared langauge so rational choice is impossible. I'm sure that's too quick but I can't parse it. Can you lay out the precise theses this could be hiding — like taxanomic incommensurability vs semantic holism vs methodological pluralism vs some ontological claim that the entities literally disappear — and for each say whether it's defensible, whether Kuhn actually held it, and whether it actually blocks rational comparison? I especially want to know about the niche distinction between local incommensurability (just a few terms) and global incommensurability (the whole langauge), since the speaker seemed to slide between them. Don't need citations, just the disambiguation with verdicts.
