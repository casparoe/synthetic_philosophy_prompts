answer: |-
  The "RetroFrames" forum smelled like ozone and nostalgia—a digital attic for enthusiasts of 80s microcomputers. Miles, its lone active moderator, scrolled past the latest flame war brewing in the Commodore 64 emulation thread. His finger hovered over the ban button for "KeySmashHero," a notoriously abrasive user. But instead, he pasted the now-familiar boilerplate:

  *"User KeySmashHero has received a Reintegrative Opportunity. A public apology thread will be pinned for 30 days. Upon completion, KeySmashHero is to be welcomed back into full participation. Let’s build community through accountability."*

  Miles believed in this. He’d stumbled upon John Braithwaite’s "reintegrative shaming" theory in a dusty criminology textbook: shame the act, not the person; ritualize apology; the community absorbs the offender back, stronger. Banning felt like exile. Here, Miles thought, was a digital village square offering redemption.

  KeySmashHero’s apology thread went up the next day, pinned beneath the forum rules. It was formulaic, stilted, clearly crafted under duress:

  *"I regret my inflammatory language in the C64 thread (linked). I was wrong to call User PixelPusher a 'ROM-stealing parasite.' My frustration was misplaced. I apologize to PixelPusher and the RetroFrames community. I value our shared passion and will strive for constructive dialogue."*

  Comments trickled in.

  *"Took you long enough."*
  *"Weak sauce. You called my Amiga setup 'garbage' last week too."*
  *"Respect for owning it, I guess. Hope you mean it."*
  *"See you in a month, maybe."*

  Miles felt a flicker of optimism. The process was working! The shame was focused on the *act*, the apology was public, the path back was clear.

  He watched KeySmashHero’s profile. Silence. The apology thread sat there, a digital pillory. After two weeks, PixelPusher linked to it in a different argument: *"Remember when KeySmashHero blew up and had to do the walk of shame? Yeah, this feels familiar."* Others started using "doing a KeySmash" as shorthand for flaming out.

  The thirty days crawled by. Miles dutifully unpinned the apology thread and posted the official "Welcome Back, KeySmashHero!" announcement. It felt hollow. Only two users replied: "Welcome back?" and "Try not to blow a gasket this time."

  KeySmashHero logged in. He lurked. He posted a single, technical question about a floppy drive issue in the hardware section. The responses were curt, purely functional. One user replied: *"Glad you're back. Hope you've cooled off since... well, you know."* Linking, subtly, to the now-unpinned but permanently searchable apology thread.

  Miles refreshed the page. KeySmashHero didn’t reply. He didn’t post again.

  Weeks later, a new user, "Z80Ninja," joined a heated debate about ZX Spectrum sound chips. He was passionate, maybe a little sharp. Someone immediately posted: *"Careful Z80Ninja, don't pull a KeySmashHero. Check his history if you don't believe me."* A link followed, pointing straight to the archived apology thread.

  Miles stared at the screen. He searched "KeySmashHero apology." Google returned the RetroFrames thread as the second result, below KeySmashHero's inactive profile. The apology wasn't a transient moment of shame leading to reintegration. It was a tombstone. A monument. The first, permanent chapter of KeySmashHero’s identity on RetroFrames, overshadowing any technical help he might offer now. The "village" wasn't forgiving; it was archiving.

  He thought about Braithwaite’s theory – rooted in physical communities where memories fade, interactions are fluid, and reintegration happens through daily, unrecorded interactions. Here, every word was etched in silicon. The "ritual" wasn't absorbing KeySmashHero back in; it had *defined* him, forever isolating him within the very structure meant to heal. The welcome back thread was just another piece of metadata attached to the main exhibit.

  A new report pinged. Another flame war. Miles’s hand automatically reached for the ban template. He stopped. He looked at the Reintegrative Opportunity template. The cursor blinked mockingly.

  He closed the templates. He typed directly into the moderator action log:

  *"User TempestFury: 3-day cooling-off ban. Reason: Repeated personal attacks. Context: See thread #4472."*

  A temporary exile. Not forgiveness, not reintegration – just silence. It was the only thing the architecture allowed that wasn't permanent branding. Miles locked the thread, the click of the mouse sounding unnaturally loud in his quiet room. Outside his window, the real world darkened, forgiving nothing, remembering little, moving on. Inside the glowing screen, RetroFrames stood frozen, a meticulously indexed museum of every mistake.
