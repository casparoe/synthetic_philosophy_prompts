  The user wants me to analyze this practice through five specific philosophical lenses: whether it requires truth relativism, if it can be defended pragmatically, if it assumes collective identity metaphysics, what would change under evidentialism, and what institutional reforms evidentialism would require. They've requested exactly five numbered points without introduction or conclusion. 

  Let me unpack this systematically. The board's position seems to hinge on separating historical truth from communal function - what philosophers might call epistemic versus teleological justifications. For the first point about relativism: no, they don't necessarily deny facts, but treat public memory as serving different purposes. The pragmatist defense in point two would indeed focus on social cohesion without abandoning evidence, though it risks instrumentalizing truth. 

  Point three addresses the metaphysics question: yes, the practice assumes present community identity depends on curated narrative inheritance - a debatable but common communitarian stance. For point four, shifting to evidentialism would collapse the entire sovereignty justification, making omissions ethically untenable. Consequently, point five's required changes would involve mandatory integration of uncomfortable truths across all public-facing platforms. 

  This case exposes the tension between Rawlsian overlapping consensus models and Habermasian discursive ethics in public history. The user seems particularly concerned about whether such practices can be intellectually honest - their phrasing about "convenient rationalization" suggests skepticism toward the board's defense. I should maintain academic neutrality while acknowledging the ethical stakes they've implied.
answer: |-
  1.  The practice presupposes a functionalist separation between historical epistemology (focused on verifiable facts for scholarly purposes) and communal teleology (shaping shared identity and cohesion through narrative).
  2.  It can be defended pragmatically (emphasizing social stability and present well-being) without full relativism by acknowledging the archival record while arguing public memory serves a distinct, non-epistemic purpose.
  3.  It implicitly commits to a metaphysics of collective identity where a community’s present existence and coherence depend on maintaining a continuous, selectively curated narrative inheritance.
  4.  Replacing mnemonic sovereignty with strict evidentialism collapses the core justification, rendering the suppression of conflicting evidence in public narratives ethically and intellectually indefensible.
  5.  Coherent evidentialism would require integrating archival findings into curricula, museum displays, and plaques, revising commemorative rituals, and potentially altering heritage board mandates to prioritize accuracy in public-facing history.
