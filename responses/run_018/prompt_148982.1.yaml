answer: |-
  The phenomenon is **Domain-Dependent Rationality Standards**, arising from differences in system closure, consequence accessibility, and epistemic norms.

  1.  **System Closure & Axiomatic Clarity:** Formal systems (math, logic, programming) are closed and have explicit, agreed-upon axioms. All consequences *must* follow deductively. Contradictions are catastrophic failures within the system itself. Real-world domains (politics, ethics) are open systems with fuzzy, contested premises ("justice," "freedom") and probabilistic/incomplete information. Consequences are often inductive or abductive, not purely deductive.
  2.  **Practical Consequence Accessibility:** In closed systems, consequences are *in principle* traceable algorithmically (even if computationally hard). Blame arises from failing a tractable task *within the system's rules*. In open systems, tracing all consequences is genuinely intractable due to vast variables, unknown unknowns, and shifting contexts. The expectation to do so is unrealistic.
  3.  **Epistemic Norms & Purpose:** Formal systems prioritize absolute consistency as their core purpose; contradiction *is* the error. Real-world reasoning prioritizes practical action under uncertainty. Defeasible reasoning (conclusions open to revision) is the norm. Inconsistencies are seen as opportunities for *revision* or *learning*, not proof of incompetence.
  4.  **Bounded Rationality:** In complex domains, humans rely on heuristics. Demanding exhaustive consequence tracing ignores cognitive limits (Simon's bounded rationality). We forgive gaps because *no one* could realistically do better. In formal domains, the "gaps" are within the solvable scope of the system's rules.
  5.  **Burden of Proof:** In formal disputes, the burden is on the prover to demonstrate consistency/truth within the system. In ethical/political disputes, the burden often shifts; pointing out a distant contradiction requires demonstrating its *practical significance* and *inescapability* given the open system.

  **Why difficulty isn't the key:** Even a "simple" two-step contradiction in ethics might rely on unstated assumptions or contextual interpretations absent in formal deduction. The domain's *openness* and *normative tolerance for defeasibility*, not just step-count, drive the differing expectations. It's fundamentally about the **tractability of consequence enumeration** and the **primary goal** (absolute consistency vs. pragmatically adequate belief).
