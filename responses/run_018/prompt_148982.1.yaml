prompt: |-
  I was arguing with my friend last week about blame and belief, and i keep coming back to this pattern i dont have a word for. In math or programming, if you hold P and P leads to Q and Q eventually conflicts with R that you also hold, people say you messed up — you should have seen the contradiction. But in politics or personal ethics, someone can hold a whole web of beliefs that only clash after like ten reasoning steps, and nobody blames them for not noticing; we treat it like "well nobody can trace every consequence." Whats weird is the split doesnt track difficulty — a five-step chain in politics is still excused, while a two-step conflict in a proof is your fault.

  Is there an established concept for this selective expectation that people should know all the consequences of thier beliefs in some contexts but not others, even when the mental work is about the same? I want to know if this fits inside the problem about knowing all logical consequences, or if its a seperate phenomenon with its own edges — like, what makes a domain one where we demand full consistency and one where we forgive gaps, and if there's no name, what should we call it? Start with your bottom line in the very first sentence — name it, deny it, or coin it — then give the reasoning, with no preamble and without restating my question.
