answer: |-
  Your frustration is well-founded—this interpretive stalemate reflects a genuine tension in Augustine's texts, amplified by competing hermeneutical priorities. Here’s a structural diagnosis of the disagreement, grounded in textual emphasis and conceptual frameworks, followed by an assessment of potential resolutions:

  ### Core Arguments of Each Camp
  1.  **Absolutists ("No Divergence Permitted"):**
      -   **Textual Focus:** _De Mendacio_ 3.3 ("A lie consists in speaking a falsehood with the intention of deceiving"), _Contra Mendacium_ 12.26 ("The fault of him who lies consists in his desire to deceive in expressing his thought"), and Augustine's relentless categorization of *types* of lies (all sinful).
      -   **Emphasis:** The *ontological/moral* bond between the soul, God (as Truth), and reality. Any voluntary act creating discord between inner belief and outer expression fractures this bond. Speech is an extension of the soul's state; deliberate misalignment is inherently corrupting, regardless of consequences.
      -   **Silence/Omission:** Viewed as morally equivalent to false utterance *if* the intent is deception ("mental reservation" implies holding a false belief internally while speaking technically true words; strategic silence *with the intent to mislead* constitutes deceit of the heart). The sin lies in the *will to deceive*, which can manifest through utterance *or* calculated withholding.
      -   **Hidden Priests/Suffering:** Interpreted as *enduring* evil (silence under duress) or *avoiding disclosure* without *affirming falsehood*. Augustine condemns priests *denying* their faith (a false utterance), not merely hiding. Suffering silently preserves inner truth without uttering falsehood.

  2.  **Contextualists ("Withholding ≠ Lying"):**
      -   **Textual Focus:** _Contra Mendacium_ 10.24 (Approving hidden priests who *do not speak*), 2.2 (Distinguishing not revealing truth from asserting falsehood), Jesus's "economy" (John 7:8-10, discussed by Augustine as permissible non-disclosure), and Augustine’s own strategic letters/political maneuvers.
      -   **Emphasis:** The *communicative/social* function of speech. Truthfulness governs *what is actually asserted*, not every piece of knowledge one possesses. "Lying" requires a positive *false assertion*. Withholding information, using ambiguity, or strategic silence is a distinct category governed by prudence and charity, not the absolute prohibition against false utterance.
      -   **Harm Principle:** Augustine’s vehement opposition to lying *to save life* (e.g., _Contra Mendacium_ on the Priscillianists) stems partly from the *harm* caused by lies (corrupting faith, destroying trust). Contextualists argue this implies a tacit calculus: withholding to prevent greater harm (e.g., revealing a hidden priest leads to murder) is permissible omission, not lying.
      -   **"Against One's Mind":** Interpreted narrowly as *saying what one believes to be false*. Thinking a truth but not speaking it is *not* speaking against one's mind.

  ### Diagnosis of the Stalemate's Structure
  1.  **Substantive Conceptual Difference (Ontology vs. Communication):**
      -   **Absolutists** prioritize **Truth as Ontological Alignment:** The soul-mind-speech continuum must perfectly reflect divine reality/one's belief. Any *intentional* break (by commission *or* culpable omission) is a sin against Truth itself (God).
      -   **Contextualists** prioritize **Truth as Communicative Fidelity:** The primary ethical duty is to not *assert* what is false. Managing information flow (silence, evasion) falls under discretion/prudence, governed by love (caritas), not the absolute "no lie" rule. The *act of assertion* is the locus of sin.
      -   **This is NOT merely verbal.** They fundamentally disagree on *what constitutes the core violation*: Is it corrupting the soul's inner truthfulness (Absolutists) or breaking the social contract of honest assertion (Contextualists)?

  2.  **The "Will to Deceive" Ambiguity:**
      -   **The Crux:** Both sides agree "intent to deceive" is central to lying. The stalemate revolves around **what actions constitute this intent.**
      -   Absolutists: *Any* voluntary act (speech or silence) *aimed at causing false belief* embodies the will to deceive.
      -   Contextualists: Only *false assertion* embodies the will to deceive *in the manner prohibited as a lie*. Strategic silence avoids false belief *without* committing the sin of false assertion; the intent is protection, not deception *per se*. Augustine’s examples (hidden priests) show he accepted this distinction.

  3.  **Empirical Factor (Early Christian Practice - "Economy"):**
      -   **Yes, this plays a significant role.** Practices like "oikonomia" (economy/dispensation) or "mental reservation" (later, but rooted in earlier ideas of prudent concealment) were known in early Christianity. Contextualists argue Augustine operated within this framework, distinguishing licit concealment from illicit falsehood.
      -   **The Problem:** Augustine *explicitly condemns* "mental reservation" techniques in _Contra Mendacium_ (e.g., 10.24, 12.26). Absolutists seize on this. Contextualists counter that he condemns *disingenuous verbal tricks* (uttering words meant to be misunderstood), not simple silence or non-disclosure. The empirical reality is fuzzy, allowing both sides to claim support.

  4.  **Theological Framing (Caritas vs. Veritas Tension):**
      -   Augustine's ethics balance *Veritas* (Truth) and *Caritas* (Love/Charity). The stalemate reflects a tension within his own thought:
          -   **Absolutists:** *Veritas* is supreme and non-negotiable; *Caritas* cannot justify violating it (lying to save a life destroys the liar's soul and corrupts faith).
          -   **Contextualists:** *Caritas* provides the hermeneutic for applying *Veritas* in complex situations; truthful communication *includes* responsible withholding to prevent harm, which *is* an act of love. Prohibiting this creates a cruel, impractical ethic.

  ### Can the Stalemate Be Advanced? Assessing Possibilities
  1.  **Conceptual Distinctions:**
      -   **Refining "Intent to Deceive":** Could a distinction between *active deception* (creating false belief) and *passive allowance of false belief* (not correcting it, when not obligated) help? Augustine likely saw both as problematic, but clarifying degrees of culpability might bridge the gap. However, Absolutists might reject this as compromising the absolute duty of inner/outer truth alignment.
      -   **Taxonomy of Silence:** Distinguish *concealment* (neutral withholding), *evasion* (avoiding questions without lies), and *deceptive withholding* (silence specifically intended to create a false belief). Contextualists see Augustine permitting the first two; Absolutists see the *intent* behind the second two as equally sinful. This might clarify points of agreement/disagreement but likely won't resolve the core conflict over intent.

  2.  **Textual Observations:**
      -   **Deepening Context:** Re-examining *Contra Mendacium*'s *specific target* (the Priscillianist practice of lying for "religious" ends) is crucial. Absolutists rightly note Augustine condemns *all* lies here. Contextualists rightly note his arguments *against* lying to save life implicitly rely on rejecting consequentialism, but his *approvals* of non-disclosure show he wasn't mandating full transparency regardless of consequence. Neither side ignores this, but emphasizing the polemical context *might* temper Absolutist claims slightly.
      -   **"Against One's Mind" (contra mentem):** A meticulous philological study of how Augustine uses this phrase across his corpus, especially in non-lying contexts, *might* provide new insight. Does it inherently include culpable silence? This is underexplored terrain.

  3.  **Reframing:**
      -   **Augustine's Epistemology/Hermeneutics:** Framing the issue through his view of signs (*De Doctrina Christiana*). Speech is a sign. A lie corrupts the sign-reality relationship. Does strategic silence corrupt this relationship, or is it simply *not using a sign*? Absolutists say it corrupts by misusing the *absence* as a deceptive sign; Contextualists say silence is not inherently a sign requiring disclosure. This reframe is promising but complex.
      -   **"The Heart's Orientation":** Focusing less on discrete acts and more on the *habitual disposition* Augustine seeks. Absolutists see any intentional divergence as corrupting the habit. Contextualists see a habit of truthful assertion compatible with prudent silence. This shifts the debate but doesn't resolve the act/omission question.

  ### Likely Outcome: Permanent Impasse (with Nuance)
  *   **The core tension is likely irresolvable** because it stems from a genuine ambiguity within Augustine's own ethics and the texts themselves. He prioritizes absolute truthfulness but also acknowledges the necessity of prudence and the evils that can arise from reckless truth-telling.
  *   **The differing hermeneutical priorities (Ontological Truth vs. Communicative Virtue)** are foundational and probably irreconcilable. Which lens one adopts determines the outcome.
  *   **The role of intent and the definition of "deception"** are too central and too contested for easy resolution.

  **However, advancement is possible in two ways:**

  1.  **Mapping the Stalemate Precisely:** Scholars can move beyond simply reasserting positions by rigorously mapping *exactly where and why* interpretations diverge on specific passages (like the hidden priest examples or the condemnation of mental reservation), explicitly naming the underlying assumptions (e.g., "This reading assumes Augustine views silence as always communicative" vs. "This reading assumes disclosure is the default"). This creates a clearer, more sophisticated understanding of the *structure* of the disagreement, even if it doesn't resolve it.
  2.  **Focusing on Implications:** Shifting focus from "What did Augustine *really* mean about lying?" to "What are the *consequences* of adopting either interpretation for understanding Augustine's broader ethics, his theology of sin, or his view of social life?" This can yield fruitful insights even within the stalemate.

  **Conclusion:** The deadlock is primarily substantive and conceptual, rooted in differing understandings of Augustine's core conception of truth (ontological relation vs. communicative virtue) and the nature of deception. While empirical factors (rhetorical practices) play a role, they are insufficient to break the impasse. Conceptual refinements or reframings can provide greater clarity and sophistication in articulating the disagreement, but a definitive resolution is unlikely. The most productive path forward is to rigorously diagnose the points of divergence and explore the broader implications of each reading for Augustinian ethics as a whole, accepting that the tension itself may be a feature, not a bug, of his thought. Your seminar could powerfully model this by dissecting specific contested passages through both lenses, exposing the underlying premises for debate.
