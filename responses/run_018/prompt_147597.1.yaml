  First, I need to recall Augustine's key texts on lying. His main works are "De Mendacio" and "Contra Mendacium." In these, he explicitly defines lying as speaking against one's mind. The absolutist camp focuses on this definition and the idea that any intentional falsehood corrupts the soul's orientation toward God. The contextualist camp points to cases where Augustine seems to permit concealment, like hidden priests or Jesus's evasive tactics. 

  Looking deeper, the core of the disagreement might be ontological versus communicative truth. For the absolutists, truth is about the mind's alignment with divine reality. Any deviation, even by omission, breaks that relationship. For contextualists, truth is more about virtuous communication where intent and consequences matter. So, the definition of "lie" itself is contested: does it only cover false statements, or also omissions?

  The user also mentions possible empirical factors like early Christian rhetorical practices. Practices like "economy" (oikonomia) or "mental reservation" might influence how Augustine's examples are interpreted. But since these practices aren't explicitly detailed in his texts, scholars might be projecting later concepts onto him, causing circular arguments.

