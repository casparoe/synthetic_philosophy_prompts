answer: |-
  Here's an analysis of Machiavelli's argument and your queries:

  **Argument & Distinction:** Machiavelli argues that fortune ("fortuna") controls about half of human affairs, posing unpredictable, destructive force like a flooding river. However, through "virtù" (human energy, skill, foresight), individuals, especially princes, can mitigate fortune's impact. The dykes and embankments built in "calm times" represent prudent preparation. This image supports *both* interpretations. The "situational" aspect is evident: virtù involves adapting conduct to seize opportunities or deflect blows within existing circumstances (e.g., changing tactics if caught unprepared). Crucially, the metaphor *also* licenses a "structural" interpretation: the dykes are preventative, physical structures built *before* the flood, implying virtù includes shaping the environment itself – shoring up defenses, securing alliances, establishing stable institutions – to better withstand future fortune.

  **Quantification, Tension & Institutional Engineering:** The "half" claim is likely rhetorical exaggeration emphasizing fortune's immense power rather than a precise quantification; Machiavelli's examples often show fortune dominating where virtù is absent. The tension you identify is genuine and unresolved: while Machiavelli emphasizes adapting *to* the times, exceptional princes (like Moses, Cyrus, Romulus) *do* fundamentally reshape their environments through foundational acts, implying virtù can sometimes transcend mere adaptation to initiate structural change. Your "institutional engineering" suspicion is textually grounded in the dyke metaphor itself (preventative construction) and in Machiavelli's treatment of founders. **Settled:** Virtù requires both preparation (structural foresight) and adaptability (situational response); fortune is a powerful, independent force. **Disputed:** Whether the "dykes" primarily mean personal readiness/inner resilience or concrete institutional reform; the precise extent to which virtù can *permanently* reshape the fundamental "times" versus navigating them; the dominance of structural preparation versus situational flexibility in Machiavelli's overall conception.
