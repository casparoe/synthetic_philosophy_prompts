prompt: |-
  I have been thinking on my own about whether human flourishing could really be nothing more than the absence of craving and suffering, with no positive goods required — a view I will call tranquilism. Before I read further, I want the full specification: what must a theory of well-being actually be able to do to count as adequate if tranquilism is correct? Give me the complete desiderata. For each requirement, state the phenomenon or case it must cover — for example, deep meditative states that lack both desire and pleasure, lives of neutral contentment, or the difference between the absence of suffering and the presence of genuine peace — and explain why that case makes the requirement necessary. Distinguish the non-negotiable conditions from those that are merely camp-specific preferences, such as whether determinism about desire is required. I am especially interested in whether any subset of these desiderata is jointly unsatisfiable: for instance, if explaining human motivation requires some form of craving, that may conflict with the core thesis. Identify which single requirement does the most to rule out the popular positive theories of well-being. Then briefly score hedonism, desire-satisfactionism, and objective-list theories against your list. A table is fine; citations and reading lists are not needed.
reasoning: |-
  Okay, the user is really diving deep into this "tranquilism" idea—flourishing as just the absence of craving and suffering, no positive goods needed. They want a rigorous framework to evaluate it. Hmm, they're clearly well-versed in philosophy of well-being but avoiding academic jargon, so I should match that tone.  

  First, unpacking their ask: they want a complete set of desiderata for any adequate theory of well-being *if tranquilism is true*. Not just a list—each item needs a concrete example (like meditative states) and justification. They also want:  
  - Non-negotiables vs. camp-specific additions (e.g., determinism)  
  - Potential conflicts between desiderata (e.g., motivation vs. anti-craving)  
  - Which requirement most strongly challenges mainstream theories  
  - A quick scorecard for hedonism/desire/objective-list theories  

  Key challenge: tranquilism’s core is minimalist, but well-being theories usually need to explain why we *seek* things beyond suffering-avoidance. The motivation point might be the tripwire.  

  For desiderata, I’ll start with non-negotiables:  
  1. **Zero-Craving/Suffering as Sufficient**: Must accept that a craving-free state *is* flourishing (e.g., deep meditation). If not, tranquilism collapses.  
  2. **No Positive Goods Required**: Neutral contentment must count as fully flourishing—no sneaking in "but joy makes it *better*."  
  3. **Distinguish Absence from Presence**: Explain why craving’s absence *isn’t* just "not bad" but actively good/peaceful (e.g., monk vs. coma patient).  
  4. **Motivation Without Craving**: Resolve how humans act (e.g., eating when hungry) without invoking craving. Tranquilism’s biggest vulnerability.  
  5. **Degrees of Flourishing**: Handle why reducing craving from 100% to 10% feels like improvement, even if both are "absence."  

  Then, negotiables: e.g., determinism (do we *choose* tranquility?), or whether tranquility has qualitative depth (pure silence vs. serene awareness).  

  The motivation desideratum (#4) is the landmine—it might force tranquilists into a corner where actions must be "craving-neutral," like reflexes. That’d clash with how we experience agency.  

  For scoring other theories:  
  - *Hedonism* fails hard—it needs positive pleasure.  
  - *Desire-Satisfaction* is closer but still craves fulfillment.  
  - *Objective-List* insists on positive goods (love, achievement).  

  The knockout punch: if "motivation requires craving" is true, tranquilism can’t explain why we pursue tranquility itself. Irony alert.  

  User’s clearly thought about this—probing for hidden flaws. I’ll flag that desideratum #4 is the linchpin for both internal consistency and external rivalry.
answer: |-
  Here is a complete specification of desiderata for any theory of well-being if tranquilism (flourishing = absence of craving/suffering) is correct. **Non-negotiables** are essential to tranquilism’s core thesis; **negotiable extensions** reflect intra-camp debates. Key conflicts and scoring against rival theories follow.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  1. **Sufficiency of Craving-Absence**  
     - **Phenomenon/Case**: Deep meditative states (e.g., Buddhist *nirodha-samāpatti*) lacking desire, pleasure, or aversion.  
     - **Requirement**: Must recognize such states as *peak flourishing*, even with no positive mental content.  
     - **Why?** Tranquilism fails if craving’s absence isn’t *sufficient* for flourishing.  

  2. **No Positive Goods Required**  
     - **Phenomenon/Case**: A life of neutral contentment (e.g., a person devoid of strong joys but free from all suffering and longing).  
     - **Requirement**: Must not rely on goods like pleasure, meaning, or relationships to define flourishing.  
     - **Why?** Tranquilism rejects positive additives; neutrality *is* the ideal.  

  3. **Absence-as-Presence Distinction**  
     - **Phenomenon/Case**: Contrasting a coma (no suffering but no awareness) with mindful equanimity (alert peace without craving).  
     - **Requirement**: Must explain why the *absence of craving* is qualitatively distinct from mere void/unconsciousness.  
     - **Why?** Flourishing requires conscious tranquility, not blank non-existence.  

  4. **Explaining Motivation**  
     - **Phenomenon/Case**: Why a tranquilist would eat when hungry if craving is abolished (e.g., acting on non-afflictive biological signals).  
     - **Requirement**: Must account for goal-directed behavior *without* invoking craving/desire as motivators.  
     - **Why?** If action requires craving, tranquilism is self-undermining or only achievable in stasis.  

  5. **Degrees of Flourishing**  
     - **Phenomenon/Case**: Reducing craving from 90% to 10% (e.g., via therapy or ascetic practice) feeling like progressive improvement.  
     - **Requirement**: Must allow for a spectrum of well-being based on craving’s *degree* of absence.  
     - **Why?** Avoids all-or-nothing flourishing; explains why partial relief is better.  

  ---

  ### **Negotiable Extensions (Camp-Specific)**  
  6. **Determinism of Desire** (Optional)  
     - **Phenomenon/Case**: Whether cravings are illusory (e.g., Buddhist *anattā*) or biologically determined.  
     - **Requirement**: *If* included, must show cravings are unfree/conditioned.  
     - **Why?** Some tranquilists tie craving’s absence to realizing determinism.  

  7. **Qualitative Depth of Tranquility** (Optional)  
     - **Phenomenon/Case**: Distinguishing "shallow" calm (e.g., fatigue) from "deep" peace (e.g., enlightenment).  
     - **Requirement**: *If* included, must differentiate tiers of tranquility beyond mere absence.  
     - **Why?** Avoids flattening all craving-free states to equal flourishing.  

  ---

  ### **Key Conflict: Joint Unsatisfiability**  
  - **Desiderata #1 (sufficiency of absence) + #4 (motivation sans craving)** risk contradiction.  
    - If flourishing *requires* abolishing craving (#1), but action/motivation *presupposes* craving (#4), tranquil agents couldn’t act to *maintain* flourishing (e.g., seeking food/shelter).  
    - **Resolution**: Tranquilism must ground motivation in non-craving mechanisms (e.g., instinct, intuition, or "choiceless awareness").  

  ---

  ### **Most Damaging Requirement to Rival Theories**  
  **#2 (No Positive Goods Required)**  
  - **Why?** Hedonism needs pleasure; desire theories need satisfaction; objective lists need goods like friendship/achievement. All fail if a craving-free neutral state suffices for *full* flourishing.  

  ---

  ### **Scoring Rival Theories**  
  | Theory             | #1: Sufficiency of Absence | #2: No Positive Goods | #3: Absence≠Void | #4: Motivation | #5: Degrees |  
  |--------------------|----------------------------|------------------------|-------------------|----------------|-------------|  
  | **Tranquilism**    | ✅ (Defining)              | ✅ (Core)              | ⚠️ (Must clarify) | ⚠️ (Critical gap)| ✅          |  
  | **Hedonism**       | ❌ (Needs pleasure)        | ❌ (Pleasure required) | ✅                | ✅             | ✅          |  
  | **Desire-Satisfaction** | ❌ (Needs desire fulfillment) | ❌ (Satisfaction required) | ✅          | ✅             | ✅          |  
  | **Objective-List** | ❌ (Needs goods like love) | ❌ (Goods required)    | ✅                | ✅             | ✅          |  

  - **Key**: ✅ = Satisfied, ⚠️ = Contested/Partial, ❌ = Violated  
  - **Outcome**: Only tranquilism satisfies #1 and #2, but struggles with #3/#4. Rivals universally fail #1/#2.  

  **Conclusion**: Tranquilism’s adequacy hinges on resolving motivation (#4) and the absence/presence distinction (#3). If craving-free action is unexplainable, or tranquility collapses into passivity, the theory fails. Rivals are ruled out by their dependence on positive states (#2), but their strength is explaining why humans *seek more* than neutrality.
