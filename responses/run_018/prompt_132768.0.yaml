answer: |-
  1.  Settled: Textbook content is intrinsically political, serving as a site where state authorities, historians, educators, and interest groups contest national narratives, identity, and civic values, observable globally.  
  2.  Settled: Historical disagreements persist where evidence is fragmentary or interpretation-laden (e.g., precise numbers of "comfort women"), but core factual events (e.g., chattel slavery in the US, Imperial Japan's wartime coercion systems) are well-documented and acknowledged by mainstream scholarship.  
  3.  Genuinely contested: Whether dominant national narratives *require* foundational myths shielding founders/institutions from systemic critique (US 1776 focus) versus narratives emphasising victimhood/perpetration to secure contemporary state legitimacy through grievance or exoneration (East Asian mnemonic security disputes).  
  4.  Genuinely contested: If centring historical injustice (e.g., slavery’s centrality, colonial violence) pedagogically fosters constructive civic reflection or destabilises national cohesion and citizen identification, a core anxiety driving resistance in both contexts despite differing surface rhetoric.  
  5.  Genuinely contested (and diagnostically shaky): Whether the US debate's focus on *moral reckoning* with foundational flaws versus East Asia's focus on *state accountability/responsibility* for past *actions* represent distinct philosophical deadlocks, or are contextually specific manifestations of the same underlying tension over history's role in legitimising present political communities.
