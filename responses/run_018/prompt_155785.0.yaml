  Okay, the user is taking a philosophy of value course and is stuck on a problem from Moore's Principia Ethica. Their professor pointed out a tension between Moore's intrinsic goods—friendship and beauty—and his principle of organic unities. Let me unpack this.

  First, the user mentions that Moore lists friendship and beautiful experiences as intrinsic goods. But Moore also talks about organic unities, where the whole's value isn't just the sum of its parts. The professor hinted that friendship, being an organic unity, might imply that individuals aren't valuable alone, but Moore treats consciousness and pleasure as intrinsically valuable. That's one tension.

  Then there's beauty. It requires a conscious observer to be appreciated, but Moore insists intrinsic value is objective and independent of mental states. So the user is confused about whether Moore can consistently hold both friendship and beauty as intrinsic goods given organic unities. They also bring up edge cases: an isolated person experiencing aesthetic rapture versus someone with deep friendships but blind to beauty. Does isolation break the organic unity for friendship? And does beauty's observer-dependence clash with anti-naturalism?

  The user has a personal thought that Moore might need to choose between treating these as simple properties or relational ones. They want a conclusion, not just a summary. 

  I need to analyze both tensions. For friendship as organic unity: Moore sees friendship as a complex good where the relationship's value exceeds the sum of individuals' values. But he still thinks individuals have intrinsic value. So the organic unity doesn't negate individual value; it's that the combination creates a new value. The edge case of the isolated aesthete: here, the person experiences beauty, which Moore considers intrinsically good. But without friendships, they're missing that organic unity good. Both are intrinsically valuable, but they're different goods. The isolated case doesn't break the organic unity claim; it just lacks one type of good.

  Beauty's dependence on an observer is trickier. Moore is an anti-naturalist, so intrinsic value can't depend on natural properties. But a beautiful experience requires a conscious mind. If the observer is necessary, does that make beauty relational? Moore could argue that the valuable thing is the complex of the object and the appreciation. The value emerges from the whole, making it intrinsic to that unified experience. But this seems to edge toward relationality, which might conflict with his idea of intrinsic value as a simple, non-natural property.

  The user's idea about simple vs. relational properties is key. If friendship and beauty are organic unities, they are relational by nature. Moore's challenge is to integrate relational goods into a framework that treats intrinsic value as simple and objective. Maybe he can argue that the relational whole itself is a bearer of intrinsic value. But beauty’s need for an observer makes it observer-relative, which could be problematic for objectivity. If no observers exist, does beauty have value? Moore would say yes, but if appreciation is part of the valuable whole, then without observers, the whole doesn't exist. That's a problem.

  In conclusion, Moore might resolve friendship's organic unity by emphasizing the emergent value. For beauty, the observer issue is harder. He might need to treat beautiful experiences as the intrinsic goods, which include the observer, but that leans into naturalism. That's inconsistent with his anti-naturalism. So Moore can handle friendship with organic unities, but beauty's observer-dependence strains his framework. The user's insight that Moore must choose between simple and relational properties is spot on. He probably can't hold both without some tension, especially on beauty. My final thought: friendship works within organic unity, but beauty poses a bigger problem for his anti-naturalism.
