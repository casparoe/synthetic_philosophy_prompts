  ## The Tangled Web: Moore's Intrinsic Goods and the Shadow of Organic Unity

  G.E. Moore's *Principia Ethica* presents a compelling yet intricate ethical landscape. His identification of "friendship" and "the appreciation of beauty" as fundamental intrinsic goods, alongside his crucial principle of "organic unities," creates a fascinating tension, particularly concerning their relational nature and the demands of his anti-naturalism. While Moore attempts to navigate this complexity, I argue that **Moore can consistently uphold friendship as an intrinsic good within his organic unity framework, but his treatment of beauty faces a more severe challenge to his anti-naturalism, potentially forcing an uncomfortable choice between relationality and his conception of intrinsic value as a simple, objective property.**

  **Friendship: Organic Unity Triumphant**

  The tension surrounding friendship arises from its apparent status as an organic unity. An organic unity is a complex whole whose intrinsic value is *not* simply the sum of the intrinsic values of its parts considered in isolation. Friendship clearly fits this mold:

  1.  **The Whole Exceeds the Sum:** The value of a genuine friendship vastly exceeds the mere sum of the pleasures, consciousness, or even the intrinsic value of the individuals involved *as isolated beings*. The mutual recognition, shared understanding, loyalty, and complex interplay of emotions create a unique good that emerges only from the relational whole.
  2.  **Parts May (or May Not) Retain Value:** Moore readily acknowledges that parts within an organic unity can possess intrinsic value themselves. He explicitly states that consciousness and certain pleasures *are* intrinsically good. Crucially, **this does not contradict the organic unity principle.** The principle states that the value of the *whole* (friendship) is not the arithmetic sum of the isolated parts. It does *not* deny that the parts (the individuals) possess intrinsic value independently. The isolated individual *is* intrinsically valuable – possessing consciousness, potential for pleasure, perhaps other goods. But the *friendship* adds a distinct, emergent, and greater value arising from their specific relational configuration.

  **Addressing the Edge Case: The Isolated Aesthete**

  Consider the individual experiencing perfect aesthetic rapture in isolation. This person possesses the intrinsic good of "the appreciation of beauty." They lack the intrinsic good of "friendship." Moore's framework readily explains this:
  *   The isolated aesthete possesses *one* intrinsic good (appreciation of beauty).
  *   They lack *another* distinct intrinsic good (friendship).
  *   This does not "break" the organic unity claim for friendship. It simply illustrates that the *absence* of the relational conditions necessary for the organic unity (friendship) means that particular intrinsic good is absent. The individual's intrinsic value remains (derived from consciousness, pleasure, aesthetic appreciation), but the *additional* and distinct intrinsic value arising from the relational whole (friendship) is not realized. There is no contradiction here; it merely shows that different intrinsic goods require different conditions for their instantiation.

  **Beauty: The Observer Problem and Anti-Naturalism**

  The challenge for beauty is deeper and strikes at the core of Moore's anti-naturalism. Moore insists intrinsic value is a simple, non-natural, objective property. It cannot be defined in terms of natural properties (like psychological states) and must exist independently of being apprehended. Yet, "beautiful experience" or "the appreciation of beauty" seems inherently relational and observer-dependent:

  1.  **Inherent Relationality:** Moore identifies *"the appreciation of beauty"* or *"beautiful experience"* as the intrinsic good, *not* beauty as an objective property of objects independent of any observer. The value resides in the *conscious experience* of finding something beautiful. The "whole" here is the complex state: [Conscious Mind + Beautiful Object + Apprehension of Beauty].
  2.  **Observer-Dependence:** This good *requires* a conscious subject to appreciate it. A landscape without a perceiver possesses natural properties (color, form) but lacks the *value* of "beautiful experience." The value emerges only when the relational whole (mind + object + appreciation) exists.
  3.  **Clash with Anti-Naturalism?** The problem arises when we ask *where* the simple, non-natural property of goodness resides within this relational whole. Moore wants goodness to be objective and independent. But if the intrinsic value *only* emerges when a specific mental state (appreciation) is directed towards a natural object, is value truly independent of that mental state? Doesn't this make the value *contingent* on the existence and specific psychological response of an observer, veering dangerously close to naturalism (defining value by psychological facts)?

  **Addressing the Edge Case: The Friendship-Blind Individual**

  The person with deep friendships but blind to beauty possesses the intrinsic good of friendship (an organic unity) but lacks the intrinsic good of the appreciation of beauty. Moore's framework again explains the presence of one good and the absence of another. The difficulty lies not in the coexistence of these goods in one life, but in the *ontological status* of the beauty-based good itself. The friendship-blind person's lack highlights that the value of "beautiful experience" *is* conditional on a specific subjective capacity – the ability to appreciate – raising questions about its claimed objectivity and independence.

  **Resolution and Moore's Dilemma**

  *   **Friendship:** Moore can consistently maintain friendship as an intrinsic good *and* an organic unity. The intrinsic value of the relational whole (friendship) is a distinct, emergent good supervening on intrinsically valuable parts (the individuals). The organic unity principle explains why friendship's value isn't additive, without negating the individuals' value.
  *   **Beauty:** Here lies the genuine tension. To preserve beauty as an intrinsic good, Moore must treat "[Conscious Mind + Beautiful Object + Apprehension of Beauty]" as the organic unity bearing the intrinsic value. **However, this solution risks undermining his anti-naturalism.** The value:
      *   Is *constituted* by a relation involving natural properties (the object's form, the observer's psychology).
      *   Is *contingent* on the existence of conscious observers with specific capacities.
      *   Makes the "simple, non-natural property" dependent on the occurrence of a complex natural/mental event.

  Moore could attempt to argue that the *apprehension of beauty* is itself a non-natural element within the complex. But this seems ad hoc, especially given his general suspicion of mental states being conflated with value. The simpler, more naturalistic explanation is that the value arises *from* the specific mental state directed at the object – an explanation Moore's anti-naturalism forbids.

  **Conclusion: A Fork in the Road**

  Moore navigates the tension for friendship successfully within his framework. Friendship thrives as an organic unity precisely because its emergent value doesn't erase the intrinsic value of the individuals who form it; it adds a new, relationally constituted good. However, the intrinsic good he identifies as "beautiful experience" or "appreciation of beauty" creates a more fundamental problem. **To consistently hold this as an intrinsic good, Moore is pushed towards acknowledging that some intrinsic goods are fundamentally relational and observer-dependent.** This, however, forces him towards the precipice of naturalism or subjectivism, positions he vehemently rejects. His alternative is to abandon "appreciation of beauty" as an intrinsic good and locate intrinsic value solely in objective beauty itself, independent of any observer – but this contradicts his own examples and emphasis on the *experience*.

  Therefore, while Moore *can* hold both friendship and beauty as intrinsic goods *if* he accepts the relational nature of the beauty-good, **he cannot do so while strictly maintaining his anti-naturalist doctrine that intrinsic value is a simple, objective, observer-independent property.** Beauty's dependence on an observer presents the sharper challenge. Your instinct is correct: Moore faces a choice. He must either soften his rigid anti-naturalism to accommodate the inherent relationality of certain intrinsic goods like aesthetic appreciation (acknowledging that value can emerge from complex states involving consciousness), or he must abandon "the appreciation of beauty" as a fundamental intrinsic good in the form he describes, potentially weakening his ethical picture. The elegance of his system is preserved for friendship by the organic unity principle, but for beauty, that same principle highlights the tension with his foundational metaphysical commitments.
