answer: |-
  ## Desiderata for a Theory of Moral Reasons: What Any Serious View Must Deliver

  **Introduction:** The debate between moral particularism (emphasizing context) and generalism (emphasizing rules) hinges on what we demand from a theory of moral reasons. Rather than declaring a winner, let's outline the core requirements any adequate account must satisfy. Some are bedrock; others are contested battlegrounds. Identifying tensions between them reveals the debate's true stakes.

  **I. The Non-Negotiables (Settled or Near-Consensus):**

  1.  **Explain Moral Salience & Basic Consistency:**
      *   **Requirement:** Explain why certain features (pain, promise-breaking, helping) *reliably* count morally, and often count similarly across diverse situations. It must avoid moral chaos where identical features arbitrarily shift significance.
      *   **Motivating Case:** The badness of *unwanted pain*. While its *overall* moral impact varies (e.g., dentist vs. torture), any theory denying pain is *pro tanto* bad in both contexts struggles. Similarly, promise-breaking consistently generates *a* reason against the action, even if overridden (e.g., breaking a trivial promise to save a life).
      *   **Status:** Non-negotiable. Denying this resembles denying moral patterns entirely.

  2.  **Handle Moral Conflict & Overriding:**
      *   **Requirement:** Explain how conflicting moral reasons interact and how one can override another, leading to an "all-things-considered" judgment. Must avoid portraying morality as always yielding a single, clear answer without struggle.
      *   **Motivating Case:** **Ross's Prima Facie Duties.** Honoring promises (fidelity) conflicts with helping someone in desperate need (beneficence). We readily understand why saving a life *overrides* keeping a trivial appointment; a theory must capture this dynamic without collapsing the genuine conflict.
      *   **Status:** Non-negotiable. Moral dilemmas and hard choices are fundamental to ethical experience.

  3.  **Accommodate "All Else Equal" Clauses (But Not Infinitely):**
      *   **Requirement:** Utilize "all else equal" (ceteris paribus) clauses meaningfully to express default tendencies of reasons, while acknowledging their limitations. Must avoid both pretending these clauses can list *every* possible exception and dismissing them as useless.
      *   **Motivating Case:** "Lying is wrong, all else equal." We understand this defaults to truthfulness but allows exceptions (e.g., lying to save a life). However, listing *every* possible exception (threats, games, surprises, etc.) is impossible. The theory must explain the role and limits of such generalizations without relying on an infinite patchwork.
      *   **Status:** Settled necessity, but the *extent* of their usefulness is contested.

  4.  **Respect the Possibility of Practical Reasoning:**
      *   **Requirement:** Be compatible with how (at least some) moral agents actually deliberate and learn. Must not require impossible cognitive feats (e.g., consulting infinitely complex rules) or make moral knowledge utterly mysterious.
      *   **Motivating Case:** Ordinary moral reasoning. People often navigate complex situations competently without consciously applying codified rules, drawing on perception, empathy, analogy, and experience (e.g., judging fairness in novel situations). A theory shouldn't make this competence inexplicable.
      *   **Status:** Non-negotiable. A theory that renders moral competence impossible is self-defeating.

  **II. The Contested Desiderata (Battlefield of Particularism vs. Genericism):**

  5.  **Allow for Radical Context-Sensitivity (Valence Switching/Holism):**
      *   **Requirement:** Allow that a feature's moral valence (positive/negative) or contributory weight *can* fundamentally change based on context. What's usually a reason *for* could become a reason *against*, or vice versa, or simply inert.
      *   **Motivating Case (Particularist):** Jonathan Dancy's examples: Enjoying someone else's pain (sadism) makes the pleasure bad, not good. Returning a borrowed weapon to someone who snaps and becomes homicidal isn't keeping a promise *well* – the context radically alters the "promise-keeping" reason. Pain in athletic training might be seen as positive.
      *   **Status:** **Contested.** Particularists (like Dancy) see this as essential to capture true moral nuance. Generalists (like Rossians) argue apparent valence switches involve different *features* (e.g., "pleasure-in-someone's-pain" isn't the same feature as "pleasure") or involve overriding, not switching.

  6.  **Provide Action-Guidance & Explanatory Power:**
      *   **Requirement:** Offer substantive guidance for action and explain *why* actions are right/wrong in terms beyond mere singular intuition.
      *   **Motivating Case (Generalist):** Facing a novel dilemma, we seek principled guidance ("Does this involve deception? Harm?"). Explaining why genocide is wrong requires more than "it's bad here"; we appeal to general features (extreme suffering, dignity violation). Rules/principles seem crucial for moral education and criticism.
      *   **Status:** **Contested.** Generalists see this as essential. Particularists argue guidance comes from nuanced perception of the *whole* situation, analogy, and "default" tendencies, not exceptionless rules; explanation is holistic, not reductive to atomistic principles.

  7.  **Achieve Systematicity & Predictive Power:**
      *   **Requirement:** Show how diverse moral phenomena fit into a coherent, interconnected structure, potentially allowing predictions about new cases.
      *   **Motivating Case (Generalist):** The aspiration for a unified ethical theory (e.g., Utilitarianism, Kantianism) or Ross's finite list of duties. We expect consistency: if lying is wrong *because* it undermines trust, similar trust-undermining acts should be suspect.
      *   **Status:** **Contested.** Generalists prioritize this. Particularists argue morality is inherently messy and context-bound; systematicity is a philosopher's imposition, not a requirement of the phenomena. Predictive power is limited.

  **III. The Core Tension (Likely Irreconcilable):**

  *   **Principled Consistency (II.6 & II.7) vs. Radical Context-Sensitivity (II.5):** This is the heart of the debate. Can a theory provide robust principles that offer genuine guidance and explanation *while also* accommodating the radical context-dependence particularists highlight? Generalists argue principled consistency is possible and vital, using ceteris paribus clauses and recognizing overriding. Particularists argue context-sensitivity is so pervasive and deep that any genuinely robust principles are impossible – the "exceptions" *constitute* the meaning of the reason in that context. **Satisfying both fully seems impossible; theories lean one way.**

  **How the Contenders Fare (Briefly):**

  *   **Rossian Genericism:** Excels at I.1, I.2, I.3 (within limits), I.4, II.6, II.7. Struggles most with II.5 (radical context-sensitivity), often explaining it via complex overriding/feature specification, which particularists find inadequate or question-begging.
  *   **Dancy-style Particularism:** Excels at I.2, I.4, II.5. Accepts I.1 & I.3 but gives "defaults" a weaker status than principles. Struggles most with II.6 & II.7, arguing its holism and perception-based approach provide sufficient (and more accurate) guidance/explanation, which generalists find unsatisfyingly vague or lacking normative force.
  *   **Rule-Consequentialism/Refined Kantianism:** Attempt to systematize (II.7) while building in sensitivity (e.g., through rules of thumb, specification). Often seen by particularists as failing II.5 (true valence-switching remains elusive) and by some generalists as potentially too rigid or missing the deontic force captured by Ross.

  **Conclusion:** The debate isn't settled because the desiderata themselves pull in opposite directions. All serious theories must explain basic consistency, conflict, and practical reasoning while using "all else equal" thoughtfully **(I.1-I.4)**. The core conflict lies in whether radical context-sensitivity **(II.5)** fundamentally undermines the need for robust, guiding principles and systematicity **(II.6, II.7)**. Any theory must choose its emphasis, acknowledging the genuine pull of the opposing desiderata it discounts. Understanding *this* tension is key to grasping why the "rules vs. no rules" question remains profoundly unresolved.
