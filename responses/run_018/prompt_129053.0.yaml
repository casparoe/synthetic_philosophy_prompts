answer: |-
  Here’s a defended prioritization for your research agenda, structured by tractability, dependency relations, and downstream impact, with explicit deprioritization of tangential debates:

  ### **Priority 1: The Ontological Status of the Structural/Recognitional Distinction**  
  **Why first?**  
  - **Tractability**: Purely conceptual. Resolves via analyzing paradigmatic cases (e.g., traffic coordination vs. collaborative dialogue) for necessary/sufficient conditions. No empirical input needed—tests whether "structural" cases implicitly rely on mutual recognition (e.g., baseline expectation of agential responsiveness).  
  - **Dependency**: Foundational. If recognition is ontologically necessary, it collapses the distinction and forces revision of structural accounts (e.g., Bratman). If distinct, it validates your framework’s core.  
  - **Downstream Impact**: Determines whether Q2 (asymmetric cases) is a boundary dispute or a category error, and whether Q3 (responsibility) requires recognitional grounds.  
  - **Progress Trigger**: Conceptual resolution via counterexamples showing structural coordination *failing* without latent recognition (e.g., AI bots "coordinating" devoid of mutual regard). Consensus here would elevate Q2.  

  ### **Priority 2: Asymmetric Joint Action ("I-frame" vs. "We-frame")**  
  **Why second?**  
  - **Tractability**: Conceptual boundary-work. Assessed through normative analysis of cases (e.g., gig workers executing corporate "collective" goals). Focuses on agential self-conception and its role in jointness—no new data required.  
  - **Dependency**: Requires Q1’s outcome. If recognition is necessary, asymmetries likely default to *non-joint* action (lacking co-subjectivity). If structural coordination suffices, asymmetries might be "deficient but joint."  
  - **Downstream Impact**: Clarifies thresholds for collective responsibility (Q3). If asymmetries qualify as joint action, responsibility assessments become murkier; if not, they revert to individual blame.  
  - **Progress Trigger**: Novel taxonomy of asymmetry types (e.g., power-imbalanced vs. role-specialized). If Q1 shows recognition is non-negotiable, this becomes urgent for real-world applications (e.g., labor ethics).  

  ### **Priority 3: Recognition’s Role in Distributed Moral Responsibility**  
  **Why third?**  
  - **Tractability**: Normative/conceptual, but *conditional* on Q1–Q2. Asks: Does recognitional commitment amplify/diffuse blame? (e.g., collaborators in harmful research vs. structurally coordinated hackers).  
  - **Dependency**: Wholly contingent on prior nodes. If Q1 establishes recognition as essential, its absence *exempts* structural harm from collective blame. If Q2 deems asymmetries non-joint, responsibility individualizes.  
  - **Downstream Impact**: Directly influences applied ethics (corporate/complicit harm). However, premature without settled joint-action criteria.  
  - **Progress Trigger**: Emergence of recognition-free responsibility theories (e.g., "output-based" models). If successful, this could rise in priority—but currently speculative.  

  ---

  ### **Actively Deprioritized Questions**  
  1. **Reduction of We-Intentions (Bratman vs. Searle)**:  
     - **Why**: Your framework sidesteps by focusing on *relational dynamics* (recognition) over intention-internalism. Resolution wouldn’t impact the structural/recognitional divide.  
  2. **Aggregation of Group Attitudes**:  
     - **Why**: Relevant to corporate epistemology, not ordinary joint action. Your agenda targets *agency-in-interaction*, not group belief-formation.  
  3. **Evolutionary Origins of Joint Action**:  
     - **Why**: Empirical and decoupled from your conceptual distinction. Tractability lies with cognitive science, not philosophy.  

  ---

  ### **Why This Order?**  
  - **Logical Flow**: Ontology (Q1) → Boundary Conditions (Q2) → Normative Implications (Q3). Building without foundations risks misapplication.  
  - **Tractability Sequence**: Q1–Q2 are "cleaner" conceptual puzzles; Q3 imports normative complexity best tackled later.  
  - **Field Impact**: Resolving Q1 disrupts mainstream taxonomies; Q2 addresses under-theorized real-world cases; Q3, while pressing, awaits input.  
  - **Reordering Conditions**:  
    - If Q1 resolves *quickly* (e.g., broad acceptance of recognitional ubiquity), advance Q3 alongside Q2.  
    - If ethicists develop recognition-independent responsibility models, elevate Q3 to contest them.  
    - If Q2 reveals asymmetries as pervasive, it might temporarily supersede Q1 for applied relevance.  

  This agenda isolates high-leverage, philosophy-native problems while insulating against empirical drift or well-trodden dead ends.
