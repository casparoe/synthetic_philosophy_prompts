  First considering Q1: The ontological status question. This feels foundational - if recognitional elements are always already present in structural cases, it collapses the distinction. But proving this requires conceptual analysis of "minimal recognition" - tractable through thought experiments about marginal cases (e.g. unconsciously coordinated actions). Resolving this would impact how we frame all joint action theories. I'd rank it first because both other questions presuppose some version of this distinction holds.

  Then Q2: Asymmetric joint action. Fascinating edge case! The "we-frame" vs "I-frame" scenario tests whether collective commitment is necessary. This seems methodologically tractable through conceptual role-playing (e.g. imagining a contractor vs homeowner painting scenario). Its resolution would clarify the boundaries of "jointness" - crucial before tackling moral responsibility. Ranked second because it builds on Q1's foundations but doesn't have as many downstream implications as Q3.

