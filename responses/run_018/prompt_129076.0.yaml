  **LEGACYBIND ADVANCE DIRECTIVE PLATFORM**  
  **TERMS OF SERVICE AGREEMENT & TEMPORAL BINDING PROTOCOL**  
  **EFFECTIVE: PERPETUITY-ADJACENT**  

  **1. PARTIES & TEMPORAL DEFINITIONS**  
  1.1. **"Current User" ("CU")**: The biological entity executing this Agreement at Timestamp T<sub>0</sub>, possessing full metacognitive faculties and an unbroken chain of psychological connectedness exceeding Threshold Γ (see Clause 3.1).  
  1.2. **"Future Self" ("FS")**: The biological entity occupying the same spatiotemporal body-continuum at Timestamp T<sub>n</sub> (n>0), whose psychological connectedness to CU may be degraded, divergent, or actively hostile.  
  1.3. **"LegacyBind" ("LB")**: A neutral arbitration platform facilitating contractual enforcement between CU and FS, herein recognized as distinct legal persons with potentially incommensurable utility functions.^[1]  

  **2. BINDING NATURE OF DIRECTIVES**  
  2.1. CU hereby imposes legally enforceable obligations upon FS regarding medical interventions, asset distribution, and aesthetic preferences (e.g., "Do not resuscitate," "Cremate, not bury," "Ban accordion music at memorial").  
  2.2. FS, by virtue of biological continuity, is deemed to have provided implicit consent at T<sub>0</sub>, irrespective of FS's contemporaneous desires at T<sub>n</sub>. Authority derives solely from CU's privileged position as the causal originator of FS's existence.  

  **3. PSYCHOLOGICAL CONTINUITY THRESHOLD**  
  3.1. This Agreement is void *ab initio* if the Psychological Connectedness Index (PCI) between CU and FS falls below **0.55** at T<sub>n</sub>. PCI shall be calculated per LegacyBind's proprietary formula:  
      > `PCI = (M * 0.4) + (E * 0.3) + (V * 0.2) + (Q * 0.1)`  
      Where:  
      - **M** = Episodic Memory Fidelity Score (0-1.0)  
      - **E** = Emotional Valence Consistency (Pearson r vs. CU baseline)  
      - **V** = Value-Axiom Alignment (Weighted similarity score)  
      - **Q** = Q-Memory Continuity^[2]  
  3.2. PCI Assessment may be triggered by FS, LB, or designated Medical Proxy via Form LB-9D ("Petition for Metaphysical Discontinuity").  

  **4. NO-BRANCHING CLAUSE**  
  4.1. This Agreement assumes a single, linear future consciousness-stream. Should CU undergo:  
      (a) Whole-brain emulation,  
      (b) Destructive mind-uploading, or  
      (c) Forking via any quantum/classical process,  
  the resulting entity(ies) **do not** constitute FS under this Agreement, unless designated the sole legal successor via LB's "Anthropic Will Rider" (Form LB-Ω). Duplicates are void and forfeit all claims.  

  **5. ARBITRATION OF TEMPORAL DISPUTES**  
  5.1. Should FS contest CU's Directive (e.g., refuses feeding tube, demands inappropriate haircut), LB shall initiate binding arbitration:  
      (a) **Mediation Phase**: FS must review a 120-min holorecording of CU articulating their rationale at T<sub>0</sub>, while monitored for galvanic skin response.  
      (b) **Adjudication Phase**: A panel of 3 LB-appointed utilitarians (1 cryonicist, 1 bioethicist, 1 rationalist blogger) shall evaluate FS's objections solely against CU's documented utility function. FS's subjective wellbeing is inadmissible.  
  5.2. FS bears all arbitration costs + LB's "Temporal Reconciliation Fee" ($1,500/hour).  

  **6. LIQUIDATED DAMAGES FOR FUTURE NON-COMPLIANCE**  
  6.1. Should FS violate a Directive upheld in arbitration, FS agrees to forfeit:  
      (a) **Financial**: 20% of assets designated for FS's care, payable to LB or CU's estate.  
      (b) **Experiential**: Revocation of "non-essential" sensory inputs for 72hrs (e.g., dessert access, grandchild visitation, streaming services).  
      (c) **Reputational**: Posthumous publication of FS's non-compliance metrics on the LegacyBind "Wall of Temporal Shame."  

  **7. MISCELLANEOUS PROVISIONS**  
  7.1. **Governing Law**: Disputes shall be resolved under the A-Theory of Time Jurisprudence Act (Fictional Statute 42-τ).  
  7.2. **Notices**: FS consents to notifications via neural implant, telepathic broadcast, or certified mail to their last-known hospice address. Failure to recieve^[3] notice is not a defense.  
  7.3. **Amendments**: CU may unilaterally amend directives until PCI <0.55. FS may petition for amendments only with CU's notarized precommitment (Form LB-5R).  
  7.4. **Termination**: This Agreement dissolves upon FS's death, heat death of the universe, or proof that CU was a Boltzmann Brain.  

  **ACKNOWLEDGEMENT**  
  BY CLICKING "I AGREE TO BIND MY FUTURE SELF," CU:  
  (A) AFFIRMS FS IS A DISTINCT ENTITY BOUND BY CONTRACT,  
  (B) WAIVES FS'S RIGHT TO HEDONIC ADAPTATION OR LATE-STAGE EPIPHANIES,  
  (C) ACCEPTS THAT SATIRE BECOMES POLICY AT SCALE.  

  **FOOTNOTES**  
  ^[1] *Per "Reasons and Persons" (Parfit, 1984), reduced to enforceable boilerplate. FS's protests re: "I am literally suffering" constitute a category error.*  
  ^[2] *Q-Memories: Artificially induced memories (e.g., "Remembering" CU's wedding) implanted to boost PCI. Not fraud if algorithmically optimized!*  
  ^[3] *LegacyBind regrets any spelling inconsistenciys in this legally binding instrument.*  

