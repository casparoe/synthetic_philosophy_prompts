answer: |-
  ### Exam Question  
  **Hume's "On Suicide": Fungibility, Sentimentalism, and Exit Licenses**  
  In "On Suicide," Hume argues that suicide does not violate our duty to society because society suffers no net loss when an individual’s misery renders them unable to contribute. Critically evaluate whether this argument relies on treating individuals as *fungible* social units (i.e., interchangeable parts of a collective). Then, assess whether this fungibility framing conflicts with Hume’s sentimentalist moral theory, which roots morality in particularized feelings like sympathy. Finally, imagine a society that adopts an “exit-license” model: suicide is permitted *only* when an individual’s net social contribution (economic, emotional, etc.) is calculably negative. Does Hume’s reasoning **support**, **undermine**, or remain **orthogonal** to such a model? Justify your response with close attention to Hume’s text and philosophical commitments.  

  ---

  ### Model Answer (628 words)  
  Hume’s "On Suicide" contends that suicide violates no duty to society because a suffering individual becomes a "burden" whose removal leaves society "in the same condition as before." This logic implicitly treats humans as *fungible* units—interchangeable economic/emotional assets. Hume notes society "loses nothing" by a suicidal person’s death since their unhappiness prevents them from fulfilling roles others can occupy. For instance, a depressed farmer’s land can be tilled by another laborer; a grieving parent’s duties can be redistributed. This reduces individuals to quantifiable inputs in a social machine, where value lies in *function* rather than intrinsic worth.  

  Yet this fungibility clashes with Hume’s sentimentalist ethics. In the *Treatise*, Hume grounds morality in subjective sentiments—especially sympathy, which allows us to *particularize* others’ suffering. Sentimentalism requires seeing individuals as unique loci of emotions and relationships, not replaceable cogs. If morality stems from feeling others’ pain, a miserable person’s anguish *itself* generates social duties (e.g., compassion), irrespective of productivity. Fungibility ignores this by framing obligations purely in terms of net utility. Hume’s suicide essay thus prioritizes cold social arithmetic over his core ethical theory, creating tension: Can we truly "sympathize" with someone while deeming them expendable?  

  The "exit-license" model exacerbates this tension. Under this system, suicide is permitted only when an individual’s net contribution is negative (e.g., they consume more resources than they provide). Superficially, Hume’s reasoning appears to **support** this: He explicitly states suicide is permissible when one is a "burden." However, his fungible-unit logic paradoxically **undermines** the model’s feasibility. Hume assumes society can *objectively* calculate net contributions—yet his sentimentalism denies such calculations are possible. For Hume, moral judgments (including "burden") arise from sentiments, not reason. Sympathy would color assessments of "negative" value: A grieving widow might be deemed a "burden" economically but evoke protective instincts in her community. The exit-license model demands impartial calculus, but Humean ethics insists all moral evaluations are emotion-laden and contextual.  

  Moreover, the model conflicts with Hume’s insistence that suicide is a *private* act. He frames it as a balance between self-regard and social duty, rejecting external arbitration. An exit-license system institutionalizes society’s authority over life/death decisions—a prospect Hume would likely reject as tyrannical. His essay mocks "superstition" (e.g., religious taboos) for imposing external rules on personal choices; a state-run license scheme replicates this dogma.  

  Ultimately, Hume’s reasoning is **orthogonal** to the model’s core mechanics. He never advocates for institutionalized permission systems because his argument targets *moral* (not legal) permissibility. His case for suicide rests on refuting duties to God/others—not designing policy. The exit-license model is a bureaucratic tool, while Hume’s focus is individual autonomy against abstract obligations. Thus, while his fungibility logic *resonates* with the model’s cost-benefit approach, his deeper commitments to sentiment and liberty render it incompatible.  

  In sum, Hume’s fungibility argument—though pragmatically effective for rebutting suicide’s "immorality"—betrays sentimentalism’s emphasis on irreducible human particularity. The exit-license model highlights this betrayal: It operationalizes fungibility in ways Hume’s anti-dogmatic, emotion-centric ethics cannot coherently endorse.  

  ---

  ### Marking Scheme (25 total marks)  
  1. **Fungibility Analysis (5 marks)**:  
     - Must-hit: Explain how Hume’s "no net loss" argument reduces individuals to interchangeable units.  
     - Typical mess-up: Vague restatement of Hume’s points without linking to fungibility.  

  2. **Sentimentalist Conflict (5 marks)**:  
     - Must-hit: Contrast fungibility with Hume’s theory that morality stems from particularized sentiments (e.g., sympathy).  
     - Typical mess-up: Treating sentimentalism as compatible with fungibility by overemphasizing utility.  

  3. **Exit-License Evaluation (5 marks)**:  
     - Must-hit: Take a clear stance (support/undermine/orthogonal) with textual/philosophical justification.  
     - Typical mess-up: Asserting "Hume supports it" based solely on "burden" quotes, ignoring his anti-dogmatism.  

  4. **Hume’s Anti-Dogmatism (5 marks)**:  
     - Must-hit: Note how exit licenses violate Hume’s rejection of external arbitration over personal choices.  
     - Typical mess-up: Overlooking Hume’s focus on individual autonomy vs. institutional authority.  

  5. **Synthesis & Originality (5 marks)**:  
     - Must-hit: Connect all threads (fungibility vs. sentiment, model’s feasibility) into a coherent critique.  
     - Typical mess-up: Isolating points instead of showing how tensions undermine Hume’s consistency.  

