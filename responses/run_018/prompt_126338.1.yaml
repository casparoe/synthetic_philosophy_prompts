reasoning: |-
  Okay, the user is writing a novel and wants to explore how Gödel's ontological argument and his personal belief in an afterlife impact rational theology. They need a concise explanation that's casual, like a coffee chat. 

  First, I need to recall Gödel's work: his modal ontological proof uses logic to argue for God's existence, while his private letters express belief in an afterlife. The key is linking these—does personal faith undermine or complement rational theology? 

  The user wants the bottom line upfront: Gödel's combo shows rational theology can embrace logic and personal conviction without contradiction. Then, unpack briefly. Keep it under 120 words, no jargon or citations. 

