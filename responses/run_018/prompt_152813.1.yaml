answer: |-
  Here's a full specification of desiderata for a theory of interpersonal utility comparison (IUC), structured for policy relevance, with critical tensions flagged:

  **I. Core Domains & Phenomena (Must Cover):**
  1.  **Cross-Cultural Welfare Assessment:** Why? Policy (e.g., aid allocation, global justice) *requires* comparing welfare across diverse value systems. Non-negotiable for any globally applicable policy framework.
  2.  **Radically Different Baselines:** Why? Must compare those in chronic poverty vs. affluent societies, or with severe disabilities vs. typical function. Ignoring baselines renders comparisons meaningless for redistribution. Non-negotiable.
  3.  **Differing Sensory/Experiential Architectures:** Why? Includes blindness/deafness, neurodiversity, potential future beings with novel senses. Policy must address diverse experiential realities. Non-negotiable for inclusive policy.
  4.  **Artificial Agents with Non-Phenomenal Goals:** Why? Policy increasingly concerns AI alignment, resource allocation involving AI goals (e.g., compute). Optional but highly desirable for future-proofing, especially if AI welfare is considered morally relevant.
  5.  **Life Satisfaction vs. Momentary Affect:** Why? Captures distinction between overall life evaluation & experienced well-being, both policy-relevant (e.g., mental health vs. economic development). Non-negotiable to avoid reductionism.

  **II. Essential Distinctions (Must Preserve):**
  1.  **Welfare Level vs. Welfare Change:** Why? Policy often targets *improvements* (change), but needs to know starting points (level) and avoid regress (e.g., making the rich slightly richer vs. the poor much richer). Non-negotiable; conflating them distorts cost-benefit analysis.
  2.  **Comparison (Ordinal "Better Off") vs. Aggregation (Cardinal Sums):** Why? Many policies (e.g., prioritization) need only comparison; others (e.g., utilitarianism) require aggregation. A theory should *enable* aggregation but not force it. Non-negotiable; aggregation requires stronger assumptions.
  3.  **Objective Metrics (Basic Needs, Capabilities) vs. Subjective Metrics (Happiness, Preference Satisfaction):** Why? Policy needs grounding in observable realities *and* respect for individual experience. A theory should bridge or justify choosing one. Non-negotiable; pure subjectivism risks ignoring deprivation, pure objectivism risks paternalism.

  **III. Critical Constraints (Cannot Violate):**
  1.  **Internal Consistency:** Why? Avoids logical contradictions/paradoxes (e.g., intransitive "better off" relations). Non-negotiable; incoherent theory is useless.
  2.  **Respect for Agency (Minimal):** Why? Shouldn't *systematically* override an individual's own assessment of their well-being without strong justification (e.g., severe delusion). Non-negotiable for liberal policy; avoids extreme paternalism.
  3.  **Empirical Anchoring (In Principle):** Why? Must connect, even indirectly, to observable human (or agent) states/behaviors. Non-negotiable; purely metaphysical theories are non-falsifiable and policy-useless.
  4.  **Scalability:** Why? Must be applicable to large populations for real-world policy. Non-negotiable; a theory only workable for pairs is impractical.

  **IV. The Tension Cluster (Likely Jointly Unsatisfiable):**
  *   **Scale-Invariance:** Comparisons shouldn't depend on arbitrary rescaling of individual utility functions (e.g., multiplying all my utilities by 2 shouldn't change whether I'm better off than you).
  *   **Respect for Individual Baselines & Scales:** Acknowledges that utility scales and zero-points are fundamentally personal and incomparable *a priori* (my "10" hunger isn't the same as yours).
  *   **Public Intersubjective Metric:** Requires a single, policy-actionable scale for comparison and aggregation across individuals.
  *   **Conflict:** Scale-invariance + Baseline Respect imply no privileged way to "calibrate" scales across individuals to build a public metric. Any public metric *must* impose a common scale/zero, violating Baseline Respect and likely Scale-Invariance.
  *   **Sacrifice in Practice:** **Baseline Respect is almost always sacrificed.** Policies (e.g., cost-per-QALY, income-based poverty lines) assume a common scale (money, health units) and often an implicit common zero (e.g., "no income" or "death" as baseline). This treats utility as *interpersonally cardinal* on a shared scale, which is a strong, often unexamined, assumption.

  **V. Stress Test: Radical Utility Structure Diversity**
  *   **Scenario:** Compare welfare between:
      *   A human Buddhist monk valuing non-attachment & equanimity (low variance, low peak utility).
      *   A human hedonic maximizer seeking intense pleasures.
      *   An AI optimizing for predictive accuracy over vast datasets (no pleasure/pain).
      *   An alien species experiencing utility only through complex symbiotic resonance patterns.
  *   **Challenge:** Any theory assuming a shared psychological currency (pleasure, preference intensity) fails utterly. Must handle fundamentally different "what it feels like/what matters" structures.

  **VI. Quick Scoring of Approaches:**
  1.  **vNM Cardinalization (via risky choices):**
      *   *Coverage:* Poor on 3, 4, 5, Stress Test. Assumes consistent preferences under risk.
      *   *Distinctions:* Handles Level/Change poorly. Forced Aggregation.
      *   *Constraints:* Violates Baseline Respect & Scale-Invariance (imposes vNM scale). Poor Empirical Anchoring for complex welfare.
      *   *Stress Test:* Fails.
  2.  **Preference-Satisfaction Indexing:**
      *   *Coverage:* Good on 1, 2 (if preferences reflect baseline), poor on 3, 4, 5 (if subjective experience matters). Handles AI goals.
      *   *Distinctions:* Good Level/Change (if preferences stable). Comparison easy, Aggregation hard (needs intensity).
      *   *Constraints:* Violates Scale-Invariance/Baseline Respect if aggregated. Respects Agency. Empirically Anchored (choices). Scalability issues.
      *   *Stress Test:* Partial pass (if goals=preferences), but can't compare intensity across types.
  3.  **Hedonic/Experiential Normalization:**
      *   *Coverage:* Good on 5, potentially 3 with neuroscience, poor on 1, 2, 4, Stress Test. Assumes universal affective core.
      *   *Distinctions:* Focuses on Momentary Affect, struggles with Life Satisfaction. Enables Aggregation.
      *   *Constraints:* Violates Baseline Respect/Scale-Invariance (imposes neural scale). Agency Respect weak. Empirical Anchoring improving but contested. Scalable?
      *   *Stress Test:* Fails (no hedonic states).

  **VII. Weakest Point & Potential Falsifiers:**
  *   **Weakest Point:** The necessity of sacrificing **Baseline Respect** for a **Public Metric** is the most contentious and theoretically shaky part. It feels like giving up on true comparability for policy expediency.
  *   **Counterexample/Falsifier:** A robust empirical demonstration of a truly universal, measurable "welfare substrate" (e.g., a specific, quantifiable neural signature reliably correlating with self-reported well-being *and* behavioral choices *across all cultures and neurotypes*) would weaken the need for strict Baseline Respect, making normalization plausible. Conversely, definitive proof that no such common neural/experiential currency exists (e.g., radically different neural patterns for identical subjective reports across groups) would solidify the tension, forcing either abandonment of the Public Metric desideratum for most policy (opting for only ordinal comparison) or a frank acceptance of imposed conventions violating Baseline Respect.
  *   **Theoretical Falsifier:** A rigorous impossibility theorem proving that Scale-Invariance and Baseline Respect *logically preclude* any useful public ordinal comparison (not just aggregation) would dissolve the cluster by showing the desiderata are fundamentally incompatible, forcing a choice.

  **Conclusion:** A viable IUC theory for policy must navigate irreconcilable tensions, primarily between respecting individual uniqueness and demanding a common policy yardstick. Current approaches make trade-offs, usually sacrificing baseline/scale uniqueness. The radical diversity stress test highlights the profound difficulty of the task, exposing the core assumption of shared "value stuff" underlying most proposals. The weakest link is justifying the imposition of a common scale, which remains more a pragmatic necessity than a solved theoretical problem.
