answer: |-
  Your description brilliantly captures a nuanced and pervasive pattern in quantitative modeling that *does* have significant resonance in philosophy of science, though no single, universally accepted label exists. Philosophers have grappled with related ideas under several conceptual umbrellas, but your specific focus on the **architectural entrenchment of a false assumption via corrective patching** is a distinct and under-theorized phenomenon. Here's a breakdown of the landscape:

  1.  **Close Relatives & Partial Matches:**
      *   **Auxiliary Hypotheses (Ad Hoc Modifications):** While related, this classic concept (from Duhem-Quine) is broader. Auxiliary hypotheses can be introduced for many reasons (handling anomalies, refining scope). Your lifecycle describes a specific *subtype* where the auxiliaries are:
          *   **Structurally Dependent:** They are mathematically or logically derived *from* the initial false assumption (`F`), not just appended to it. Removing `F` invalidates the derivation of the auxiliaries (`A1, A2,...`).
          *   **Architecturally Load-Bearing:** The entire model structure relies on `F` being "true" within the formal system to justify the form and parameters of `A1, A2,...`. `F` is no longer a disposable approximation; it's the keystone.
      *   **Path Dependence in Theory Development:** This captures the "lock-in" aspect. Once significant resources are invested in building the patchwork (`F + A1 + A2 + ...`), switching to a fundamentally different foundation without `F` becomes prohibitively costly or conceptually difficult. The model evolves down a path dictated by `F`.
      *   **Idealizations Becoming "Constitutive":** Some philosophers (e.g., Michael Weisberg, Nancy Cartwright) discuss how idealizations can shift from being mere approximations to becoming defining elements of a theoretical framework. However, this often focuses on their *explanatory* role rather than the specific *architectural dependence* created by patching.
      *   **Lakatosian "Degenerating Research Programme":** Imre Lakatos described programmes where the "protective belt" of auxiliary hypotheses grows increasingly complex and ad-hoc to defend a stagnant "hard core." Your lifecycle fits well here as a *mechanism* for degeneration: the hard core (`F`) is protected *precisely* by building auxiliaries that structurally depend on it, making core revision catastrophic for the entire edifice. This is arguably the closest established framework.

  2.  **Proposed Labels & Delineation:**
      Given the lack of a perfect term, here are descriptive options capturing your core insight:
      *   **Structural Entrenchment of Idealizations:** Highlights the key shift from disposable to load-bearing.
      *   **Foundational Ossification via Patching:** Emphasizes the hardening and dependence created by corrections.
      *   **Path-Dependent Model Rigidity:** Focuses on the lock-in effect.
      *   **Architectural Capture by an Idealization:** Stresses how `F` captures the model's structure.
      *   **Self-Reinforcing Idealization:** Captures the feedback loop where defending `F` necessitates structures that further depend on `F`.

  3.  **Delineating it from Related Concepts:**
      *   **Vs. Ordinary Auxiliary Hypotheses:**
          *   **Dependence:** Ordinary auxiliaries might be independent additions or refinements. In your case, auxiliaries are *derived consequences* of `F` within the model's logic. Removing `F` doesn't just remove one component; it destroys the rationale and structure of the fixes.
          *   **Rhetoric vs. Reality:** The persistent framing of `F` as "just an idealization" or "temporary simplification" becomes increasingly incongruent with its actual, indispensable role in the *current* model structure.
          *   **Boundary Case:** Adding a simple friction coefficient to a Newtonian mechanics model of a pendulum is an ordinary auxiliary. It refines the prediction but doesn't make the core laws structurally dependent on the *absence* of friction. Removing friction doesn't invalidate the derivation of the coefficient; it just reverts to a simpler model. In your lifecycle, removing `F` invalidates the derived auxiliaries.
      *   **Vs. Simple Institutional Inertia:**
          *   **Mechanism:** Inertia is about resistance to change due to habit, sunk costs, or power structures. Your lifecycle describes a specific *scientific/intellectual* mechanism: the model itself evolves in a way that `F` becomes *logically* indispensable *within its own formal structure*. The dependence is baked into the math, not just the sociology.
          *   **Boundary Case:** A field might cling to an outdated model (`F + A`) purely due to tradition or textbook dominance, even though a newer model (`G`) exists that doesn't rely on `F` and is structurally simpler/more coherent. Here, `F` isn't architecturally indispensable; it's sociologically entrenched. In your lifecycle, no viable `G` might even be conceivable *without* dismantling the entire existing architecture because `G` fundamentally contradicts the derivation of the established `A`'s.

  4.  **Boundary Cases Clarifying the Phenomenon:**
      *   **Case Demonstrating the Phenomenon:** **Neoclassical Economics & Rational Choice:** `F` = Perfect rationality, unlimited computational power, self-interest. Anomalies arise (e.g., endowment effect, framing). Patches (`A`'s) are added: prospect theory (which modifies utility *based on deviations from rational reference points*), behavioral nudges (framed as correcting "biases" *relative to the rational norm*), information asymmetry models (assuming agents *would* optimize *if* they had perfect info). Critically, these patches *define* the anomaly *in terms of the deviation from `F`* and derive their structure *relative to `F`*. Abandoning `F` entirely (e.g., for radical bounded rationality or non-rational heuristics as the *core*) would make the entire edifice of behavioral "corrections" incoherent. Yet, `F` is still rhetorically called the "benchmark" or "ideal."
      *   **Case NOT Demonstrating the Phenomenon (Ordinary Auxiliary):** **Adding Air Resistance to Projectile Motion:** `F` = No air resistance (false). Prediction fails for long distances/high speeds. Auxiliary (`A`): Drag force proportional to velocity squared. This `A` is *not* structurally derived *from* the assumption of no air resistance. It's derived from fluid dynamics principles largely *independent* of the initial `F`. Removing `F` (i.e., incorporating drag) doesn't invalidate the core laws (Newton's laws); it refines their application. `F` remains a useful approximation for short distances/low speeds, but it's genuinely dispensable without collapsing the model.
      *   **Ambiguous Case (Highlighting the Boundary):** **Ptolemaic Epicycles:** `F` = Geocentrism + Perfect circular motion. Anomalies arise (e.g., retrograde motion). Patches (`A`'s): Epicycles, deferents, equants. These were complex structures *derived* mathematically *within the geocentric/circular framework* to save the phenomena. Removing geocentrism (i.e., adopting heliocentrism) *did* make the entire epicycle apparatus obsolete and incoherent. **Why it's borderline:** While `F` became entrenched, the patching arguably reached a point of such diminishing returns (extreme complexity) that it *did* eventually collapse under the weight of its own auxiliaries when a simpler foundation (Kepler/Newton) emerged. This shows the phenomenon can be unstable long-term, but it perfectly fits the lifecycle *until* the paradigm shift. The rhetoric often *did* treat the circles as fundamental truths, not mere conveniences.

  **Conclusion:**

  You've identified a crucial and distinct failure mode in model development: **the structural entrenchment of a false foundational assumption (`F`) through the derivation of corrective patches (`A`'s) that become logically dependent on `F`'s formal truth within the model, rendering `F` architecturally indispensable while maintaining the rhetorical fiction of its disposability.** While elements are covered by Lakatos (degeneration), path dependence, and discussions of idealization, the specific *mechanism of architectural capture via dependent derivation* deserves recognition.

  **How to delineate it precisely:** Focus on the **logical/mathematical dependence of the corrective structures (`A`'s) on the *literal* truth of the initial false assumption (`F`) within the formal model.** If removing `F` doesn't just remove an approximation but collapses the rationale and structure of the accumulated fixes because those fixes were derived *from `F`*, then you have this phenomenon. It's more than inertia; it's a model evolving internal logical dependencies that trap it on its initial, flawed foundation. The persistent rhetorical downplaying of `F`'s true role is a key symptom. This phenomenon represents a specific and pernicious form of path dependence within scientific modeling, where the "path" is paved with mathematically dependent patches that cement the initial error into the structure itself. It warrants a specific label like **Structural Entrenchment of Foundational Idealizations (SEFI)** or **Path-Dependent Model Ossification**.
