prompt: |-
  Is there an established name for the following pattern in how competent speakers treat borderline cases? Consider a man who is genuinely on the border between tall and not tall. The same speakers who refuse to call him tall, and equally refuse to call him not tall, will happily grant that he is either one or the other, and will flatly reject the suggestion that he is somehow both. Nor do speakers who give opposite verdicts about him correct one another: each verdict seems permitted, rather than one being a mistake. I am aware of two rival accounts of borderline cases — one on which such statements are neither true nor false, and one on which they are true or false but we cannot know which. Does the pattern of use I have described have a name of its own? Does it fit one account better than the other, or is it exactly what both accounts predict? If it has no established label, coin one, define it, and mark its edges; and in any case say what observable behaviour, if any, would actually discriminate between the two accounts, since I suspect this pattern cannot. Please answer in British English.
reasoning: |-
  Hmm, the user is asking about a specific linguistic pattern involving borderline cases like a man who's neither clearly tall nor clearly not tall. They describe how competent speakers will refuse to call him tall or not tall, yet insist he must be one or the other, and won't correct others who give opposite verdicts. They're aware of two philosophical accounts - the gap theory (neither true nor false) and the epistemic theory (true or false but unknowable) - and want to know if this pattern has a name, which theory it fits better, and how we might distinguish between the theories.

  The pattern described is indeed well-documented in philosophy of language. It's called the "tolerance principle" in some contexts, but more accurately represents what Crispin Wright termed "intolerance of vagueness" - the insistence that a borderline case must be one or the other despite our inability to classify it. This sits alongside "recalcitrance" - our resistance to applying either label.

  The user's description aligns with both major theories equally well. Both can explain why speakers refuse to apply either predicate (for gap theorists there's no fact, for epistemicists we can't know the fact). Both explain why we insist on excluded middle (gap theorists might see this as a logical principle, epistemicists as an ontological truth). Both explain tolerant disagreement (gap theorists see no fact to correct, epistemicists see unknowable facts).

  To distinguish these theories, we'd need observable evidence beyond this core pattern. We'd look for behavior that violates excluded middle (which would challenge epistemicism) or evidence that speakers treat borderline statements as truth-apt in embedded contexts like conditionals or knowledge attributions. The user's suspicion that this pattern doesn't discriminate seems correct - it's precisely why the debate continues.

  I should coin a precise term for this cluster of behaviors: "Semantic Equivocation Tolerance" captures the key elements - semantic indecision, tolerance of conflicting judgments, and insistence on bivalence. I'll define it clearly and mark its boundaries.

  The user seems philosophically sophisticated - they've clearly engaged with the literature but want to pinpoint where the theories diverge. I'll maintain British English throughout as requested, and structure the response to first name the phenomenon, then analyze its theoretical implications, before proposing discriminative tests.
answer: |-
  Your description captures a fascinating and much-debated pattern in the philosophy of language concerning **vagueness** and **borderline cases**. This specific cluster of linguistic behaviours does have recognised components, though a single, universally agreed-upon label for the *entire pattern* isn't firmly established. Let's break it down:

  1.  **Refusal to Apply either Predicate (Tall / Not Tall):** This is often called **recalcitrance** or **indeterminacy in application**. Speakers feel it's incorrect or inappropriate to apply either the positive ("tall") or the negative ("not tall") predicate to the borderline case.
  2.  **Insistence on Excluded Middle (Either Tall or Not Tall):** Speakers firmly adhere to the **Law of Excluded Middle** (LEM) – the principle that for any proposition P, either P is true or not-P is true. They insist the man *must* be one or the other, denying any "third" status.
  3.  **Tolerance of Conflicting Verdicts:** Speakers do not treat others' opposing classifications ("He *is* tall" vs. "He is *not* tall") as *mistakes* requiring correction, but rather as *permissible* judgments. This is often discussed as **tolerant disagreement** or **faultless disagreement** in the context of vagueness.

  **The Established Name(s) and the Rival Accounts:**

  The core phenomenon you describe – the *tension* between recalcitrance and the insistence on LEM, coupled with tolerant disagreement – is frequently discussed under the banner of **the phenomenon of vagueness** itself, specifically highlighting **the tolerance principle** and its breakdown. Crispin Wright called the insistence on LEM despite recalcitrance **"intolerance of vagueness"**.

  *   **How it Fits the Rival Accounts:**
      *   **Gap Theory (Neither True Nor False):**
          *   **Recalcitrance:** Easily explained. If "The man is tall" is neither true nor false in a borderline case, then asserting it *is* incorrect, and asserting its negation ("The man is not tall") is *also* incorrect (as the negation would be true only if "tall" is false, which it isn't – it's gappy). This directly predicts the refusal to apply either predicate.
          *   **LEM Insistence:** This is a *problem* for standard gap theories. Classical logic holds that "P or not-P" is *always* true (a tautology). However, if "P" is neither true nor false, what is the truth value of "P or not-P"? Most gap theorists either reject classical logic (adopting a logic where LEM fails for vague propositions) or bite the bullet and say "P or not-P" is still *true* even when P is gappy (arguing LEM is a logical truth independent of the status of P). The latter option preserves LEM but makes the speaker's insistence seem somewhat mysterious or purely logical, divorced from the actual indeterminacy.
          *   **Tolerant Disagreement:** Fits well. If there's no fact of the matter, neither speaker is saying something *true*, but neither is strictly saying something *false* either (as both predications fail). Both judgments reflect permissible ways of resolving the indeterminacy in context, perhaps driven by slight shifts in the comparison class or the speaker's own standards. There's no "mistake" to correct because there's no underlying fact to be mistaken *about*.
      *   **Epistemic Theory (True or False, but Unknowable):**
          *   **Recalcitrance:** Explained by our *ignorance*. The speaker refuses to assert "Tall" because they *don't know* if it's true; they refuse to assert "Not tall" because they *don't know* if *that's* true. The predicates *do* apply exclusively, but we lack the epistemic access to determine which one.
          *   **LEM Insistence:** Fits perfectly. The epistemicist *endorses* classical logic. The proposition "The man is tall or the man is not tall" *is* straightforwardly true – one disjunct *is* true, we just cannot know which one. The speaker's insistence reflects this metaphysical commitment to bivalence.
          *   **Tolerant Disagreement:** This is the *trickiest* part for epistemicism. If one verdict *is* true and the other *is* false, why don't speakers correct each other? Why is the disagreement "faultless"? Epistemicists typically explain this by arguing that *given our ignorance*, neither speaker is being *irrational* or *unjustified* in their assertion based on the available evidence and context (e.g., slightly different standards momentarily adopted). While one is *factually* wrong, they aren't *blameworthy* or making an *epistemic* mistake *given their situation*. The disagreement is "faultless" in the sense of being rationally permissible, not in the sense of both being true.

  **Coining a Label: Semantic Equivocation Tolerance (SET)**

  If a single label for the *entire pattern* is needed, I propose: **Semantic Equivocation Tolerance (SET)**.

  *   **Definition:** Semantic Equivocation Tolerance (SET) is the linguistic phenomenon observed with vague predicates where competent speakers, confronted with a borderline case:
      1.  **Recalcitrance:** Refuse to apply either the positive predicate (P) or its direct negation (not-P) to the case, deeming both assertions inappropriate.
      2.  **Bivalence Insistence:** Nevertheless insist that the Law of Excluded Middle holds (P or not-P *is* true for the case).
      3.  **Tolerance:** Treat conflicting verdicts (assertions of P vs. assertions of not-P) by other competent speakers regarding the *same* borderline case as *permissible* rather than requiring correction, exhibiting faultless disagreement.
  *   **Marking its Edges:**
      *   SET applies specifically to **vague predicates** (like 'tall', 'bald', 'heap') not to precise ones ('prime number', 'pregnant').
      *   It manifests with **genuine borderline cases**, not clear cases or cases clearly on one side.
      *   It involves **competent speakers** familiar with the predicate and its typical usage.
      *   "Equivocation" captures the *apparent* contradiction in holding 1, 2, and 3 simultaneously. "Tolerance" captures the acceptance of conflicting verdicts. "Semantic" roots it in the meaning/use of language.

  **Discriminating Between the Accounts: Observable Behaviour**

  You are correct that the core SET pattern *itself* is consistent with both the Gap Theory and the Epistemic Theory, as outlined above. Both can accommodate recalcitrance, LEM insistence (with caveats for some gap theories), and tolerant disagreement (with different explanations for the latter).

  To discriminate between them, we need to look for observable behaviours or linguistic data *beyond* the core SET pattern:

  1.  **Rejection of Excluded Middle:** If a significant number of competent speakers, when pressed on the logic, were to *deny* that "The man is tall or the man is not tall" *must* be true for a borderline case, this would strongly favour a Gap Theory that rejects classical logic for vague statements. The Epistemic Theory predicts universal acceptance of LEM.
  2.  **Treatment in Embedded Contexts:**
      *   **Conditionals:** How do speakers handle conditionals like "If the man is tall, then X" or "If the man is not tall, then X" when the man is borderline? Epistemicists predict these might behave like conditionals with unknown antecedents. Gap theorists might predict they lack a clear truth value or default to something else.
      *   **Knowledge Attributions:** Do speakers find it natural to say "We cannot know whether he is tall" (favouring Epistemicism) or "There is no fact of the matter to know" (favouring Gap Theory)? While speakers might use both, systematic preference could be telling.
      *   **Higher-order Vagueness:** How do speakers treat borderline cases *of* borderline cases? Does SET apply recursively? The accounts predict different structures for higher-order vagueness, potentially manifesting in subtle differences in patterns of recalcitrance and tolerance at the borders between clear cases, borderline, and clear non-cases.
  3.  **Patterns of "Forced March" or "Sorties" Paradoxes:** Observing how speakers actually respond when confronted with a long series of tiny increments (e.g., removing grains from a heap one by one) can be revealing. Epistemicism predicts a sharp, albeit unknowable, cut-off point where refusal flips to acceptance. Gap theories predict a region of increasing uncertainty/recalcitrance. While individual judgments are tolerant, the *aggregate pattern* of where speakers *start* refusing the predicate might show a smoother gradient (favouring gap/supervaluationist views) or suggest a hidden sharp boundary (favouring epistemicism, though tolerance masks it).
  4.  **Use of Denial:** When a speaker says "He's not tall" about a borderline case, is this heard as:
      *   *Asserting the negation* ("He is not-tall") - more consistent with Epistemicism (even if unknowably true/false) or Gap Theory if negation is handled carefully.
      *   *Rejecting the original assertion* ("It's not correct to say he *is* tall") - more consistent with Gap Theory, where denial can target lack of truth rather than asserting falsity. Careful analysis of how "not" functions in response to borderline predications can be discriminating.

  **In summary:**

  *   The pattern you describe is central to the phenomenon of vagueness and involves **recalcitrance**, **insistence on bivalence (LEM)**, and **tolerant/faultless disagreement**.
  *   Crispin Wright's term **"intolerance of vagueness"** captures the LEM insistence part well.
  *   The entire cluster can be labelled **Semantic Equivocation Tolerance (SET)**.
  *   **SET itself is predicted by both the Gap Theory and the Epistemic Theory**, albeit with different underlying explanations, particularly for tolerant disagreement.
  *   Discriminating evidence would come from:
      *   Observable rejection of LEM for borderline cases.
      *   Patterns in the use of vague predicates in embedded contexts (conditionals, knowledge claims).
      *   Aggregate behaviour in forced-march paradoxes.
      *   Fine-grained analysis of denial and negation concerning borderline statements.

  The difficulty in finding observable behaviour that cleanly discriminates is precisely why the philosophical debate remains vigorous. SET highlights the complex, perhaps even paradoxical, nature of our linguistic competence with vague concepts.
