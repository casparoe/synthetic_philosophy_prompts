answer: |-
  Here's the argument structured as requested, with a clear separation of Jaspers's categories and an assessment of confidence:

  ### Core Argument: Strict Separation of Guilt Categories is Essential
  1. **Criminal Guilt (Individual/Legal)**  
     Applies *only* to perpetrators convicted through legal processes. It dies with them. A German born in 1990 cannot inherit criminal guilt for Auschwitz—they weren’t alive, didn’t act, and courts hold no jurisdiction over them for those crimes.

  2. **Political Guilt (Institutional/State Continuity)**  
     *This is the only "guilt" that persists.* States are continuous legal entities. Modern Germany inherits obligations from the Nazi regime: reparations (e.g., to Israel), restitution of stolen property, maintenance of memorials, and constitutional safeguards. Citizens *today* bear **proxy responsibility** via democratic participation—they uphold institutions addressing past wrongs. But this is *collective* (state-level), not personal moral blame.

  3. **Moral Guilt (Personal Complicity/Conscience)**  
     Requires **first-person involvement**: Did *you* choose to collaborate, remain silent, or fail to resist? Moral guilt is non-transferable. A grandchild cannot be "morally guilty" for choices they didn’t make. They may feel *shame* or *sorrow*, but these are distinct from guilt—which implies agency.

  4. **Metaphysical Guilt (Existential Solidarity)**  
     Jaspers’s most elusive category: the "rupture in human solidarity" affecting all who share humanity with perpetrators. But crucially, **it demands present-tense reckoning**—*your own* confrontation with the capacity for evil revealed by the crimes. Inheriting metaphysical guilt is incoherent; it requires *personal* existential engagement ("How do *I* ensure this never recurs?"). A 1990-born German might feel horror at human nature, but not guilt *for* the Holocaust itself.

  ### Why Conflation is Dangerous
  Merging these categories:
  - **Moralizes politics**: Turns state obligations into vague "stains" on innocents.
  - **Dilutes accountability**: Shifts focus from actual perpetrators and institutional reforms.
  - **Impedes reconciliation**: Demands performative penance from the uninvolved instead of concrete policy changes.

  ### Confidence Assessment
  - **Overall Confidence: 85%**  
    This framework robustly protects individuals from unjust blame while ensuring states honor historical debts. It aligns with legal practice (e.g., Germany’s reparations are state obligations, not levied against newborns) and moral philosophy (you can’t be culpable for others’ choices).

  - **Shakiest Point: Metaphysical Guilt (as predicted)**  
    Jaspers’s framing *is* quasi-religious ("a solidarity among men as human beings that has been violated"). In secular politics, it risks becoming poetic but unactionable. Can a state "bear" metaphysical guilt? Unclear. Modern discourse often reduces it to symbolic gestures (e.g., national apologies), which blur into politics/morality. **Least confident claim**: That metaphysical guilt *must* be purely individual today. Some argue communities inherit a duty to confront existential ruptures (e.g., via education), but this still isn’t "guilt."

  ### Key Takeaway for Your Debate
  **"Germany is guilty" is only coherent as shorthand for:**  
  *"The German state, as a continuous institution, bears political responsibility to address its predecessor’s crimes—a duty enforced by its citizens through democratic means."*  
  This imposes **no moral/metaphysical burden** on later-born individuals—only a civic obligation to uphold just institutions. Jaspers’s separation is vital to prevent ethical confusion.

