answer: |-
  Below is a reusable, jargon-free decision procedure grounded in ethical philosophy (drawing on concepts like collective action problems, marginal impact, and symbolic responsibility). It's designed as a checklist with ordered questions to handle the "one app can't change the climate" inefficacy objection. Each step defines clear exit points ("hard yes," "hard no") and flags where human judgment is required. The goal is to force explicit reasoning about small contributions to big problems.

  ---

  ### **Decision Procedure: Small Actions in Collective Harm Contexts**
  **Use this when:** Evaluating a proposal that seems ethically good but faces "it won't move the needle" objections.  
  **Input:** A specific action your team can take.  
  **Output:** **YES** (do it), **NO** (don’t do it), or **UNCERTAIN** (needs deeper debate).

  1. **Is the harm linear or threshold-based?**  
     - **Linear harm**: Each unit of harm adds up steadily (e.g., CO2 emissions — each ton warms the planet a tiny bit).  
     - **Threshold harm**: Harm jumps suddenly after a tipping point (e.g., melting an ice sheet once emissions pass a level).  
     - *Move on if*: Harm is linear OR threshold exists but we’re far from it.  
     - **Hard YES if**: We’re near a known threshold AND this action could tip it (e.g., stopping a project that would push emissions 0.001% over a cliff edge — rare!).  
     - **Hard NO if**: Harm is threshold-based, we’re nowhere near the threshold, AND the action can’t help us avoid it.  
     - *Judgment call*: Are we near a tipping point? (Requires expert input/evidence.)  

  2. **Is there direct causal impact or mainly symbolic/structural effect?**  
     - **Direct impact**: Action physically reduces harm (e.g., energy saved by a feature).  
     - **Symbolic/structural**: Action influences norms, laws, or others’ behavior (e.g., banning beef signals values, shifting culture).  
     - *Move on if*: Direct impact is non-negligible (see judgment) OR symbolic effect is plausible but weak.  
     - **Hard YES if**: Strong symbolic effect (e.g., action could inspire industry-wide change or shift policies).  
     - **Hard NO if**: Direct impact is negligible (≈0) AND no plausible symbolic effect (e.g., action is invisible/ignored).  
     - *Judgment call*: Is the direct impact *non-negligible*? (Define "negligible" for your context: e.g., "Would this save more CO2 than a single employee’s lifetime commute?" or "Is it ≥0.1% of our total footprint?")  

  3. **Is there a coordination or scaling mechanism?**  
     - **Coordination**: Action helps others act collectively (e.g., an open-source tool others adopt).  
     - **Scaling**: Action can grow beyond your team (e.g., a toggle users enable, spreading impact).  
     - *Move on if*: Mechanism exists but is weak/uncertain.  
     - **Hard YES if**: Clear path to scaling/coordination (e.g., action is designed to spread, or you’ll actively promote it).  
     - **Hard NO if**: No path to scaling AND impact is isolated (e.g., action only affects internal systems with no ripple).  
     - *Judgment call*: How likely is scaling? (Base on evidence: e.g., "Did similar past actions spread?")  

  4. **Pure values call — does the principle matter even if the outcome is nil?**  
     - **Ignore outcomes**: Is this about integrity, even if it achieves nothing? (e.g., "We don’t serve beef because it’s wrong").  
     - *Move on*: Never — this is the final step.  
     - **Hard YES if**: Aligns with core values (e.g., "We avoid harm when possible, full stop").  
     - **Hard NO if**: Values don’t apply OR costs outweigh principle (e.g., "This conflicts with other values like user experience").  
     - *Judgment call*: What are our non-negotiable values? (Requires team/company agreement.)  

  ---

  ### **Applied to Your Proposals**
  **Key**:  
  - ✅ = Passes step, moves on.  
  - ❌ = Fails step, hard stop.  
  - ⚠️ = Judgment required.

  #### **(a) Ship API-batching feature (~0.2% energy saved/user)**  
  1. **Linear/threshold?** Climate harm is linear (CO2 accumulates). No imminent threshold. ✅ → Step 2.  
  2. **Direct/symbolic?** Direct impact: 0.2% savings/user. *Judgment*: Non-negligible if scaled (e.g., 1M users = 2,000 users’ worth of energy). ✅ → Step 3.  
  3. **Coordination/scaling?** Mechanism: Users enable toggle → direct scaling. *Judgment*: Likely, if feature is user-facing. **HARD YES** (no need for step 4).  
  **Result: YES**  

  #### **(b) Ban beef at company events**  
  1. **Linear/threshold?** Beef emissions are linear (methane adds up). ✅ → Step 2.  
  2. **Direct/symbolic?** Direct impact: Negligible (one company’s events won’t dent global demand). Symbolic: Strong — signals values, may shift norms. **HARD YES** (stop here).  
  **Result: YES**  

  #### **(c) Add in-app banner urging voting (one vote rarely matters)**  
  1. **Linear/threshold?** Elections are threshold-based (one vote CAN decide, but rarely). *Judgment*: We’re never "near" a threshold predictably. ✅ → Step 2.  
  2. **Direct/symbolic?** Direct impact: Negligible (one banner → extra votes, but unlikely to swing an election). Symbolic: Weak — voting banners are common/low-impact. **HARD NO** (stop here).  
  **Result: NO**  
  *Why counterintuitive?* Voting "feels" civic-minded, but steps 1–2 show no clear impact. Philosophy insight: Isolated symbolic acts without scaling are "cheap talk" (vs. beef ban, which may change norms).

  ---

  ### **Where It Misfires and Limitations**
  - **Misfires**:  
    - Step 2 (direct/symbolic) is subjective. Example: If the voting banner targeted a swing district, symbolic impact might be stronger → different judgment.  
    - Step 4 (values) can override logic. Example: A team might say "We always encourage voting" → YES on principle, ignoring step 2’s NO.  
  - **What it can’t settle**:  
    - **Cost-benefit tradeoffs**. (e.g., "This carbon tweak hurts performance — is it worth it?").  
    - **Uncertainty**. (e.g., "Could this tiny action inspire a movement?" requires speculation).  
    - **Moral priorities**. (e.g., "Is climate more urgent than voting?").  
    - **Group dynamics**. (e.g., "Will this proposal demotivate engineers if blocked?").  

  **Use this to**: Force rigor in debates, not replace them. If steps 1–3 exit at YES/NO, it’s decisive. If not, step 4 requires values alignment — which is a leadership call. Ground philosophy: Rejects "inefficacy trap" (individuals aren’t off the hook in collective harm) by emphasizing scalability, symbolism, and duty. No reading required — just run the checklist.
