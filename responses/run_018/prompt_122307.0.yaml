prompt: |-
  You're a professional philosopher who's spent some time around working field biologists — philosophy of action, philosophy of biology, whatever you'd call yourself. I need a teaching plan, not an essay, so please think carefully and do a bit of unstructured brainstorming on your own before you settle on the shape of it.

  Situation: I'm a retired solid-state chemist (forty years of hysteresis loops, for my sins) who's come to philosophy late, and I run a monthly "big ideas" session at the local library. About fifteen people, mostly retired scientists and engineers like me, plus a history teacher and one very argumentative sixteen-year-old. One hour, no slides. Next month is mine and I want to do it on sphexishness — you know the old story: the digger wasp (Sphex something) leaves her paralysed katydid on the doorstep, goes down into the burrow to check the nest, comes back up, drags it in; and if you shift the katydid six inches while she's down there she goes through the whole inspection again, and will do it fourty times if you keep moving it. The bit I actually want them to chew on is whether our own behaviour is rigid in ways we can't see, and what any of that has to do with free will.

  Don't explain sphexishness to me, I've read the basics. Plan how I should teach it in that hour. In particular:

  - the order the ideas have to go in, and why — what has to be in place before the wasp looks like a philosophical problem rather than a funny animal fact, and what depends on what downstream;
  - the one example that should carry the whole hour, and what it has to have and what it has to lack to do that job. I've been toying with the automatic doors at the supermarket — they trigger on a body-shaped thing and then there's a second or two during which they will not re-decide — but I'm not convinced, and I want to know where exactly it breaks down if I use it;
  - the misconceptions this particular crowd will bring, in the order they'll actually arrive, and the point in the sequence where I head each one off. I can already predict two: my chemist friends will say the wasp is a machine and we plainly aren't, so the whole comparison is a category mistake; and the sixteen-year-old will have read that experiments of the Libet sort show the decision is made before you're conscious of it, so we're every bit as fixed as the wasp. There will be more, and I want them in the order they'll surface, not sorted by importance;
  - one question I can ask in the last five minutes that would show me they'd understood the real point instead of just having been amused by a wasp;
  - and what I should flatly refuse to try to settle in fifty minutes, and say out loud that I'm refusing to settle.

  One thing you have to deal with, because I think it's the bit they'll miss and it's the bit I care about: I've started thinking that "sphexish" isn't one property but a bundle that can come apart — rigid about which variables it registers, stereotyped in what it does once it starts, and locked out of reconsidering for a while after it commits — and that a system can be rigid on one of those and flexible on another, and that rigidity down in the machinery is often exactly what pays for flexibility further up (my walking doesn't occupy my attention because something under the hood is hopelessly rigid, and if it weren't I'd fall over). That's my own half-baked framing and I'd rather you sharpened it than flattered it: tell me if it's wrong, tell me if it's going to mislead them in some specific way, and tell me where to put it in the sequence if you keep it.

  Lead with your bottom line in the first sentence — the single claim about the structure of the session that everything else hangs on — then give me the reasoning. No preamble, and don't restate the question back at me.
