answer: |-
  ### Bottom Line: Structure the session as a ladder from concrete wasp behavior → abstract human parallels → your "rigidity bundle" framework → meta-question about unseen inflexibility, **rigorously avoiding free will debates until the final minutes and explicitly bracketing them as unsettleable.**

  ---

  ### Teaching Sequence & Rationale  
  *(45 min content + 15 min Q&A/discussion)*  

  1. **Hook: The Wasp Story (5 min)**  
     - *What:* Describe *Sphex ichneumoneus* ritual with katydid (no jargon, just vivid narrative).  
     - *Why:* Immediate engagement. Scientists/engineers relate to empirical observation. Sets baseline for "rigid sequence."  
     - **Pre-empt Misconception #1 (Funny Animal Fact):** Ask *"Why does this feel absurd to us?"* → Tease out implied human superiority.  

  2. **Dissect Rigidity: Your "Bundle" Framework (10 min)**  
     - *What:* Frame sphexishness as **3 separable traits**:  
       (a) *Trigger Rigidity* (only registers katydid in original location),  
       (b) *Action Stereotypy* (mandatory nest-check sequence),  
       (c) *Lockout Period* (no reassessment during check).  
     - *Why:* Must establish *before* human parallels. Scientists need a structural model to analyze mechanisms.  
     - **Pre-empt Misconception #2 (Machine/Category Error):** "Chemists: Is this *just* machine-like? Hold that thought – let’s map the components first."  

  3. **Human Parallels: Subconscious Routines (15 min)**  
     - **Core Example: Driving Home Autopilot**  
       - *Triggers*: Time of day, fatigue → *Action*: Standard route taken mindlessly → *Lockout*: Missed turns because "zoned out."  
       - *Why it works:* Engineers relate to system automation. Highlights rigidity *enabling* efficiency (frees attention for conversation).  
       - *Where Supermarket Doors Fail:* They lack *adaptive purpose* – humans override autopilot (e.g., detour for gas). Doors are pure sensors → weak analogy for *motivated* behavior.  
     - **Pre-empt Libet Argument (Teen):** "Libet shows *initiation* is subconscious, but did his subjects ever *abort* the action? That’s key." → Segues to...  

  4. **Interruptibility as Flexibility (10 min)**  
     - *What:* Contrast wasp (cannot abort ritual) vs. human (can override autopilot mid-route).  
     - *Why:* Your rigidity bundle allows this: Wasp combines all 3 rigid traits; humans often have (a)+(b) but not (c), or weak (c).  
     - **Pre-empt Misconception #3 (Rigidity = Bad):** "Is your heartbeat’s rigidity a flaw? No – it enables you to debate philosophy!"  

  5. **The Meta-Question & Free Will Tease (5 min)**  
     - *Pivot:* "We easily see the wasp’s rigidity. What routines of *ours* feel flexible but might be rigid in ways we *can’t* self-observe?"  
     - **Closing Question (Understanding Check):**  
       *"What’s one personal habit that feels automatic (trigger/action rigidity), yet you know you* could *interrupt it if needed? What does that interruptibility depend on?"*  
       - *Tests grasp:* Recognizes bundled rigidity + identifies flexibility conditions (attention, novel context).  

  6. **Explicit Refusal to Settle (Stated upfront & reiterated):**  
     - *"We won’t solve free will today. Determinism? Compatibilism? That’s years of debate. Focus instead: How might spotting *sphexish patterns* in ourselves reveal where our flexibility *actually* lives?"**  

  ---

  ### Why Your "Bundle" Framework Works (And Warnings)  
  - **Strength:** Correctly dissects rigidity. Engineers will latch onto modular design (e.g., "Lockout Period = neural refractory phase").  
  - **Risk:** Over-mechanizing human cognition. Mitigate by:  
    - Emphasizing *degrees* of rigidity (e.g., "Lockout weakens when hungry").  
    - Stressing that bundles are *descriptive tools*, not neural reality.  
  - **Placement:** Immediately after wasp story. Provides analytical lens *before* human examples.  

  ---

  ### Predicted Misconception Sequence & Deflections  
  1. **"It’s just a machine!"** (Chemist @ Step 1) → *Deflect:* "Agreed – but *how* is it machine-like? Let’s reverse-engineer it." (Leads to Step 2)  
  2. **"We’re not wasps!"** (Engineer @ Step 3) → *Deflect:* "Absolutely. So where *does* our flexibility kick in? Let’s test an example." (Leads to driving autopilot)  
  3. **"Libet proved we’re automatons!"** (Teen @ Step 3) → *Deflect:* "Does subconscious *onset* mean we lack *veto* power? What evidence breaks the wasp comparison?" (Leads to Step 4)  
  4. **"Rigidity is inefficient!"** (Historian @ Step 4) → *Deflect:* "Is your procedural memory for typing wasteful? Or does it enable higher-order creativity?"  

  ### Why This Flow?  
  Concrete (wasp) → Conceptual (bundle) → Familiar (human routines) → Reflective (self-appraisal). Uses the audience’s analytical instincts against their biases. You’re not *arguing* for free will; you’re *investigating flexibility mechanisms*. The final refusal disarms ideological battles.
