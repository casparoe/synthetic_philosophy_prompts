  The user's bundle idea is crucial. They see sphexishness as multiple dissociable traits: trigger detection, action execution, and lockout periods. This is insightful because it avoids binary thinking. Confirming that this framework helps analyze different systems. However, the risk is oversimplifying human cognition. The solution is to apply the bundle to both wasp and human examples, showing how subsystems can be rigid while the whole system is flexible. Placing this after the wasp story and before human examples sets the analytical framework.

  For the sequence: Start with the wasp to hook interest. Then dissect it using the bundle. Then tech examples (automatic doors) as a bridge. Then human subconscious routines. Finally, free will implications. End with a question about identifying personal routines that have rigid elements but allow adaptability. Avoid deep free will debates; state upfront that determinism vs. free will won't be resolved.

