answer: |-
  ### Step 1: Restatement of Your Position  
  You hold:  
  1. **Pure time preference** (discounting future welfare *solely* due to temporal distance) is ethically arbitrary, analogous to spatial discrimination.  
  2. Standard objections (e.g., personal identity, rational consistency) fail, as they overlook a deeper tension:  
     - Rejecting pure discounting implies **temporal cosmopolitanism**: obligations to people in 2124 = obligations to people 10,000 miles away.  
  3. You wish to preserve **institutional proximity** (governability, feedback loops, shared mechanisms) as a *legitimate*, non-arbitrary factor that weakens obligations without collapsing into time preference.  
  4. You also endorse **value drift** (future values may be incommensurable with ours) as a *distinct* justification for reduced present investment, but only if:  
     - It is empirically tractable (not a blanket excuse).  
     - It avoids equivalence with pure time preference.  

  This combined view seeks to:  
  - Reject pure discounting on ethical grounds.  
  - Accommodate intuitions about institutional constraints and value uncertainty.  
  - Maintain a firewall between these factors and temporal bias.  

  ---

  ### Step 2: Systematic Mapping of Exposures  
  #### **I. Formal Results That Threaten the View**  
  **Fatal Defeaters (Potentially Undermining Core Claims):**  
  - **Social Choice Impossibility Theorems**: If intergenerational equity requires equal treatment across time (per temporal cosmopolitanism), but institutional proximity demands differential weighting, models may show this violates minimal rationality axioms (e.g., consistency under dynamic aggregation). Result: *Either* cosmopolitanism *or* proximity must be sacrificed to avoid cyclical preferences or dictatorship of the present.  
  - **Growth Economics: Non-Convergence in Optimal Savings**: Models without pure discounting (e.g., Ramsey with δ=0) can demand savings rates >50% of GDP to benefit the distant future. If adding "institutional proximity" as a discount factor replicates δ>0 outcomes, it collapses into hidden time preference.  

  **Damaging Defeaters (Forcing Concessions):**  
  - **Decision Theory: Dutch Book for Non-Exponential Discounting**: Hyperbolic or proximity-based discounting can make you exploitable (e.g., accepting sequences of trades that guarantee net loss). This pressures institutional proximity to justify itself beyond intuition—lest it mirror inconsistent time preference.  
  - **Value Drift as a Free Parameter**: If models of intergenerational value change require arbitrary decay rates to avoid excessive sacrifice, and these rates match empirical discount rates (e.g., 1–3%/year), value drift becomes empirically indistinguishable from time preference.  

  **Awkward Defeaters (Requiring Ad Hoc Adjustments):**  
  - **Spatial-Temporal Symmetry in Network Models**: Graph-theoretic models of obligation (weighted by institutional connectivity) may show that "10,000 miles" (with digital feedback) can have *stronger* links than "2124" (with institutional rupture). This blurs your spatial-temporal analogy.  

  → *A committed defender should concede:* If institutional proximity *formally replicates* discounting in optimization models, it damages the claim of distinctness. Dismiss symmetry arguments by emphasizing *contingent* human psychology (e.g., temporal anxiety ≠ spatial neglect).  

  #### **II. Empirical Threats to Value Drift**  
  **Fatal Defeaters:**  
  - **No Evidence of Radical Incommensurability**: Longitudinal studies of moral values (e.g., shifts in rights frameworks over 200 years) show additive evolution (e.g., expanding rights), not replacement. If future values are predictably continuous, "drift" cannot justify discounting.  
  - **Institutional Transmission Outlasts Value Shocks**: E.g., constitutions persist through value changes. If mechanisms binding generations (e.g., trusts, treaties) empirically endure longer than moral revolutions, proximity remains prior to drift.  

  **Damaging Defeaters:**  
  - **Value Drift as Self-Defeating**: If current values endorse investing for future autonomy (e.g., education), refusing investment *because* values may drift contradicts those values. Empirical data on generational altruism (e.g., bequest motives) shows low sensitivity to predicted drift.  

  **Awkward Defeaters:**  
  - **Tractability Thresholds**: If "empirically tractable drift" requires predicting values beyond 100 years—where data is scant—it risks becoming an untestable assumption.  

  → *A committed defender should concede:* If data show value continuity, drift cannot ground discounting. Dismiss tractability concerns by narrowing drift’s scope (e.g., only for >500-year horizons where uncertainty dominates).  

  #### **III. Conceptual Collapses**  
  **Fatal Defeaters:**  
  - **Institutional Proximity Reduces to Preference**: If "governability" depends on our *willingness* to create feedback mechanisms (e.g., ignoring future CO₂ costs because we lack carbon markets), it reduces to revealed time preference. Distinction collapses.  
  - **Value Drift Applies Symmetrically to Space**: E.g., "We owe less to cultures 10,000 miles away because their values are incommensurable." If you reject this for space (as discrimination) but accept it for time, your asymmetry needs justification beyond intuition.  

  **Damaging Defeaters:**  
  - **Proximity Incentivizes Neglect**: Strong institutions *now* (e.g., democratic feedback) favor near-term interests. Using proximity to weaken obligations creates perverse incentives to avoid building long-term institutions.  

  **Awkward Defeaters:**  
  - **Temporal Cosmopolitanism as a Trojan Horse**: If obligations to 2124 = obligations to distant others, and we already underfulfill spatial obligations (e.g., foreign aid), cosmopolitanism demands infeasible sacrifice—undermining its plausibility.  

  → *A committed defender should concede:* If institutional proximity incentivizes presentism, it damages its normative role. Dismiss spatial symmetry by arguing time’s *irreversibility* (e.g., extinction risks) makes future drift uniquely disempowering.  

  ---

  ### Step 3: Assessment of Unfalsifiability  
  **The Risk**: Your qualifications—  
  - Institutional proximity ≠ time preference  
  - Value drift ≠ blanket excuse  
  —could insulate the view. E.g., any observed discounting is attributed to "legitimate proximity" or "tractable drift," while no test defines *illegitimate* cases.  

  **Is This a Defect?**  
  - **Yes, if normative**: A theory of obligation must guide action. Unfalsifiability makes it non-actionable (e.g., "How much should we invest?" lacks an answer).  
  - **No, if meta-ethical**: As a critique of pure discounting, exposing arbitrariness need not offer an alternative calculus.  

  **Verdict**: Your view risks unfalsifiability *in practice* by:  
  1. Making institutional proximity’s weight indeterminate.  
  2. Allowing value drift to absorb predictive failures.  
  **This is a defect** for a view aiming to guide policy. To rescue it, specify:  
  - *Quantifiable thresholds* for institutional strength (e.g., governance index scores).  
  - *Falsifiable criteria* for incommensurability (e.g., collapse of overlapping consensus on core rights).  

  ---

  ### Ranked Defeaters (Fatal → Awkward)  
  | Rank | Defeater                                      | Category                | Defender’s Response |  
  |------|-----------------------------------------------|-------------------------|---------------------|  
  | 1    | Proximity reduces to preference in models     | Formal/Conceptual       | Concede: fatal if proven |  
  | 2    | No empirical evidence of radical value drift  | Empirical               | Concede: undermines drift’s rationale |  
  | 3    | Drift mirrors discount rates                  | Formal                  | Dismiss: coincidence ≠ equivalence |  
  | 4    | Spatial symmetry of drift argument            | Conceptual              | Dismiss: time’s irreversibility breaks symmetry |  
  | 5    | Dutch books for proximity-based weighting     | Formal                  | Concede: requires reformulation |  
  | 6    | Tractability of drift predictions             | Empirical/Conceptual    | Concede: narrow scope to extreme longtermism |  

  **Conclusion**: Your synthesis is vulnerable to formal and empirical results showing that proximity/drift *functionally replicate* discounting. To survive, it must:  
  - Formalize "institutional proximity" as a measurable, non-preference-based factor.  
  - Anchor value drift to historical discontinuity data.  
  Otherwise, temporal cosmopolitanism remains the only coherent alternative to pure time preference—and your intuition must yield.
