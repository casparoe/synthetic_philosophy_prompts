prompt: |-
  I'm in a reading group on decision theory and last week a friend of mine (he did a master's in economics, so he's not clueless, but he does like to sound authoritative) gave us this rundown of Aumann's "agreeing to disagree" result, and I want to sanity-check it before I repeat any of it in front of the group. His version went roughly like this: Aumann proved that two rational agents with the same prior beliefs cannot disagree — if both are Bayesians and they update on the same evidence, their posteriors must coincide, so persistent disagreement between rational people is simply impossible. He then said that the requirement of "common knowledge" in the theorem just means that both agents know each other's estimates, i.e. that they've told each other what they believe, and that once that's happened the theorem forces them to agree immediately. Finally, he drew the moral that this is why trade between rational agents can't happen: since any offer to bet reveals information, two rational agents could never both willingly take opposite sides of a bet, so speculative markets are, strictly speaking, populated by irrational people.

  Now, a few things here smell off to me. I thought the theorem was about common knowledge of the posteriors themselves, not about agents receiving the same evidence — those seem like pretty different conditions. And I have a vague memory that there's a difference between everyone knowing something and it being common knowledge that matters a lot here, which his gloss seems to flatten. The bit about markets also feels like an overreach dressed up as a corollary. But he's normally reliable, and the basic thrust — common priors plus common knowledge of posteriors implies agreement — I do think is right.

  So: is his summary fair? Please go through it claim by claim and separate what is accurate, what is a defensible simplification, and what is actually wrong or conflated. In particular I'd like to know whether the conclusions he draws (disagreement is impossible, trade is impossible) survive once the summary is corrected, and what a careful statement of the theorem and its actual limits would look like. Also, if he's muddled together two different results anywhere, tell me which ones. Please answer in British English.
reasoning: |-
  Okay, the user is in a decision theory reading group and their friend presented Aumann's "agreeing to disagree" theorem. The friend's summary seems off, and the user wants me to fact-check it claim by claim. Let me recall the theorem accurately.

  First, the friend claimed that rational agents with the same prior cannot disagree if they're Bayesians updating on the same evidence. But Aumann's theorem actually requires common knowledge of posteriors, not just same evidence. Evidence can be different as long as the posteriors are commonly known. The friend conflated "same evidence" with "common knowledge of beliefs." That's a key mistake because agents might have private information.

  Then, the friend defined "common knowledge" as simply telling each other their estimates. But common knowledge is stronger: it's not just that both know, but that both know that both know, and so on infinitely. Without this, disagreement can still persist. For example, if Alice tells Bob her belief, Bob might think she hasn't considered his perspective yet.

  The moral about trade being impossible seems stretched. The friend argued that trade requires disagreement, so rational agents wouldn't trade. But Aumann's theorem doesn't directly address trade. Markets can have trades due to different risk tolerances or liquidity needs, not just disagreement. Also, even with common priors, if agents have different information, they might trade until their beliefs align. So the conclusion that markets are irrational is an overreach.

  The user mentioned their friend has an economics background but might oversimplify. The user wants to correct misconceptions before presenting to the group. They need a clear breakdown of accurate points vs. errors. Highlighting where the friend conflated concepts, like common knowledge versus mutual knowledge, is crucial. Also, clarifying that trade can still happen for non-informational reasons keeps the analysis balanced.

  Underlying needs: The user likely wants to confidently discuss the theorem without spreading inaccuracies. They might also seek deeper understanding to facilitate group discussion, ensuring they grasp nuances like common knowledge. Providing a careful statement of the theorem's conditions and limits helps them address similar oversimplifications in the future.
answer: |-
  Right, your instincts are spot on—your friend's summary captures the *spirit* of Aumann's result but seriously muddles the specifics and overstates the implications. It contains a crucial conflation that leads to those overly strong conclusions about disagreement and trade. Let's break it down claim by claim, using British English as requested.

  **1. Claim:** *"Aumann proved that two rational agents with the same prior beliefs cannot disagree — if both are Bayesians and they update on the same evidence, their posteriors must coincide."*
  *   **Accuracy:** **Mostly Wrong / Conflated.** The core requirement isn't "updating on the same evidence". Agents *can* receive different private evidence. What Aumann actually requires is **common knowledge of their posterior beliefs** (and common prior, common knowledge of rationality/partition structures). Crucially, agents *don't* need to know *what evidence* the other received, just what the other *believes now* about the event in question. Your friend has conflated "common knowledge of posteriors" with "receiving the same evidence". These are fundamentally different. It's entirely possible for rational agents with a common prior receiving different evidence to disagree *unless* their posteriors become common knowledge.

  **2. Claim:** *"The requirement of 'common knowledge' in the theorem just means that both agents know each other's estimates, i.e. that they've told each other what they believe."*
  *   **Accuracy:** **Wrong and Over-simplified.** "Common knowledge" is vastly stronger than simply "both know" (which is called "mutual knowledge"). Common knowledge means:
      *   Agent 1 knows Agent 2's belief.
      *   Agent 2 knows Agent 1's belief.
      *   Agent 1 knows that Agent 2 knows Agent 1's belief.
      *   Agent 2 knows that Agent 1 knows Agent 2's belief.
      *   Agent 1 knows that Agent 2 knows that Agent 1 knows... *ad infinitum*.
      Simply telling each other ("I think P=0.6", "I think P=0.4") achieves only *mutual* knowledge (Level 1). This is **not** sufficient for the theorem to force agreement. Common knowledge requires an infinite regress of "I know that you know that I know...". In practice, this often arises in public, transparent announcements where the fact of the announcement and its content are indisputable and known to be so by everyone (e.g., a public press conference, a market ticker).

  **3. Claim:** *"...once that's happened [telling each other] the theorem forces them to agree immediately."*
  *   **Accuracy:** **Wrong, based on previous errors.** Because "telling each other" only achieves mutual knowledge, not common knowledge, the theorem does **not** force immediate agreement in this scenario. Disagreement can persist after simply exchanging beliefs. They might update slightly based on the other's stated belief (if they learn something new), but their posteriors need not become equal. The theorem *only* guarantees agreement *if* common knowledge of their posteriors is achieved *and* they have a common prior.

  **4. Claim:** *"Persistent disagreement between rational people is simply impossible."*
  *   **Accuracy:** **Vast Overstatement / Misleading.** Persistent disagreement is **absolutely possible** and incredibly common among rational agents, *even with a common prior*:
      *   **Different Private Information:** This is the most common reason. Agents haven't shared *why* they believe what they believe.
      *   **Lack of Common Knowledge of Posteriors:** They may not know each other's beliefs at all, or only know them mutually, not commonly.
      *   **Different Partitions/Models:** While the theorem assumes a common state space and partition structure, in reality, rational agents might model the world differently.
      *   **Differences Beyond Priors/Evidence:** Differences in risk aversion, utility functions, or computational constraints can lead to different *actions* even with identical beliefs.
      The theorem only says disagreement *cannot persist* under the very specific and strong conditions of *common knowledge of posteriors* and *common prior*.

  **5. Claim:** *"Trade between rational agents can't happen... speculative markets are populated by irrational people."*
  *   **Accuracy:** **Highly Problematic Overreach.**
      *   **Impossibility of Trade?** This is a misinterpretation of a *theoretical implication* under *idealised conditions*, not a description of reality. The argument is: Trade requires both parties to believe they benefit. If they have the same prior and common knowledge of their posteriors, they must agree on the value of any bet, so neither would think it beneficial to trade. However:
          *   **Different Priors:** Aumann assumes common priors. Real agents often *don't* share identical priors.
          *   **Non-Common Knowledge:** Trade often happens *before* posteriors become common knowledge, precisely *because* agents have different information and hope to profit from it.
          *   **Non-Belief Motives:** Trade happens for many reasons *besides* differing beliefs about an event: differences in risk tolerance, liquidity needs, hedging, endowment effects, time preferences, or simply consumption.
          *   **The Market Process:** Speculative markets are *mechanisms* for aggregating dispersed information. Rational agents trade *because* they have private information, hoping the market price doesn't yet fully reflect it. Their trades *reveal* information, potentially moving prices towards consensus *without* common knowledge of posteriors being necessary at the outset. Milgrom & Stokey's "No-Trade Theorem" formalises the point your friend is gesturing towards, but it relies on the same strong assumptions (common prior, common knowledge of rationality, and often common knowledge of the *opportunity* to trade). Relaxing any of these (especially common knowledge of the trade offer or identical priors) allows rational trade.
      *   **Markets Populated by Irrational?** This is a gross overstatement. Markets involve immense amounts of rational trade based on differential information, risk profiles, and needs. While behavioural factors exist, attributing *all* trade to irrationality based on a misinterpretation of Aumann is unsound economics.

  **Careful Statement of Aumann's Agreement Theorem:**
  > "If two (or more) rational agents share the same prior beliefs about a set of possible states of the world, and it is common knowledge between them what their posterior probabilities are for some particular event (after potentially receiving different private information), then those posterior probabilities must be equal."

  **Key Limits & Clarifications:**
  1.  **Common Prior:** A critical and often controversial assumption.
  2.  **Common Knowledge of Posteriors:** Essential and very strong. Not achieved by simple exchange of beliefs.
  3.  **Rationality & Model Structure:** Agents must be Bayesian rational and share a common understanding of the state space and information partitions (how signals correspond to states).
  4.  **Not "Same Evidence":** Agents *can* and typically *do* have different private information signals.
  5.  **Agreement on the *Event*:** It forces agreement on the probability of the specific event whose posteriors are common knowledge, not necessarily on everything else.

  **What Conclusions Survive Correction?**
  *   **Disagreement is Impossible?** **No.** It only becomes impossible under the *very specific and strong* conditions of the theorem (common prior + common knowledge of posteriors). Persistent disagreement is otherwise normal and rational.
  *   **Trade is Impossible?** **No.** Rational trade driven by differential information is a cornerstone of financial economics. While the "No-Trade Theorem" shows trade is impossible under conditions *even stronger* than Aumann's (common knowledge of the trade opportunity itself), relaxing these assumptions (different priors, lack of common knowledge of the offer, non-belief motives) makes rational trade not only possible but expected.

  **Where the Conflation Happened:**
  Your friend fundamentally conflated **"receiving the same evidence"** with **"common knowledge of posterior beliefs"**. This error led directly to the mistaken ideas that (1) simply updating on the same things forces agreement, (2) telling each other beliefs forces agreement (mistaking mutual for common knowledge), and (3) therefore disagreement/trade is impossible. He also conflated the conclusions of Aumann's theorem with those of the much stronger "No-Trade Theorem".

  In short, the *theorem* itself is correctly summarised by the "basic thrust" you recalled (common priors + common knowledge of posteriors implies agreement), but your friend's explanation of the *conditions* and the *implications* for disagreement and trade was significantly flawed and overstated. You're right to be sceptical of those sweeping conclusions. Stick to the careful statement above when presenting to your group – it avoids the pitfalls while capturing the profound insight about the power of common knowledge to force consensus among Bayesians with shared origins. Cheers!
