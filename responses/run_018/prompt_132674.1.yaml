answer: |-
  That's an astute observation of a pernicious pattern! You're right that it twists the classic "dirty hands" dilemma into something distinct and more insidious. While there isn't one universally agreed-upon term, several established concepts and potential neologisms capture facets of it:

  1.  **"Dirty Hands Drift" or "Corruption Laundering":** This emphasizes the *progression* from an arguably necessary evil to avoidable corruption. The initial "dirty hands" act becomes a *platform* or *justification* for further, less defensible actions, laundering new corruption through the perceived legitimacy of the unavoidable prior act.

  2.  **"Moral Exhaustion" or "Moral Nihilism Masquerading as Realism":** This focuses on the psychological/ethical state the actor claims. They argue their capacity for moral restraint is depleted ("exhausted") by the initial hard choice, leading to a cynical abandonment of principle ("nihilism"), falsely presented as continued tough-minded pragmatism ("realism").

  3.  **"The Sunk Cost Fallacy of Morality":** Similar to economic sunk costs, where past investments justify continuing a failing course, here the past *moral sacrifice* ("I'm already stained") is used to justify abandoning further moral effort ("why bother staying clean now?"), even though the new act is independently wrong and avoidable.

  4.  **"Instrumentalization of the Dirty Hands Dilemma":** This highlights how the genuine ethical tension of the original dilemma is *weaponized*. The inherent tragedy and guilt of the first act are cynically exploited as a *tool* to bypass ethical scrutiny for subsequent, self-serving acts.

  5.  **"The License of Stain":** This directly names the core mechanism: the acquired "stain" is treated not as a burden demanding atonement or caution, but as a *license* permitting further transgression.

  **How it differs from Dirty Hands:**
  *   **Original Dirty Hands:** Focuses on the *agonizing choice* and inherent *guilt* of committing a necessary evil. The emphasis is on the tragic conflict and the moral cost *to the actor*.
  *   **This Pattern:** Focuses on the *exploitation* of that prior guilt/stain to *avoid accountability* and *justify unnecessary, avoidable evils*. The initial act becomes a rhetorical shield and an excuse for moral laziness or corruption.

  **How it differs from Moral Licensing:**
  *   **Moral Licensing:** Good deed A makes one feel entitled to do bad deed B ("I donated to charity, so I can be rude").
  *   **This Pattern:** *Necessary evil* A makes one feel entitled to do *optional evil* B ("I *had* to do A, which was terrible, so I *might as well* do B for gain"). The "license" comes from accepting a necessary *stain*, not from accumulating moral credit through good acts.

  **How it differs from Slippery Slope (as you noted):**
  *   **Slippery Slope:** Suggests that A *logically or inevitably leads to* B.
  *   **This Pattern:** Denies that A *causes* B. Instead, it argues that *because* A happened and stained the actor, doing B *no longer matters ethically*. It's about *status*, not causation.

  **Distinguishing it from Plain Hypocrisy:**

  *   **Hypocrisy:** Involves *concealing* one's own violations of stated principles while condemning others for the same violations. It's about inconsistency and deception.
  *   **This Pattern:** Often involves *acknowledging* the initial stain and even the questionable nature of the *current* act. The argument isn't "I didn't do anything wrong," but rather "My hands were *already* dirty from the *necessary* evil, so *refraining* from this *optional* evil now is pointless vanity – the damage is done, I might as well get the benefit." It's a form of *cynical transparency* or *weaponized guilt*, not concealment.

  **The Core Ethical Violation:** This pattern perverts the purpose of acknowledging "dirty hands." The genuine dirty hands dilemma emphasizes the *tragedy* and *residual guilt* of the necessary evil, which should inspire *greater caution, humility, and a commitment to minimizing future harm and seeking atonement*. This pattern uses the *acceptance* of being stained as an *excuse for moral abdication and further harm*. It confuses the *unavoidability* of one act with the *permissibility* of all subsequent acts.

  **In short:** The best descriptive terms are likely **"Dirty Hands Drift," "Corruption Laundering,"** or **"The License of Stain."** It's the cynical exploitation of a past, arguably necessary moral compromise to justify present, avoidable corruption, arguing that maintaining integrity is futile once initial purity is lost. It's hypocrisy's more sophisticated, philosophically weaponized cousin.
