  For part 2, the independence assumption in money pumps seems genuinely compromised. Standard game theory treats future "players" as distinct entities, but when future you is causally downstream of current you, the independence vanishes. Like trying to bet against yourself when you control both sides. I'd put this at 85% - the violation feels necessary.

  Part 3 is trickier. Could an agent precommit through self-modification? Like installing irreversible cognitive filters? But the embedding problem might resurface - any internal commitment mechanism still has to be modeled by the agent. It's turtles all the way down. Only 30% chance this fully resolves things.

