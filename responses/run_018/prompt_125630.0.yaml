  First, assessing the core challenge: policy students who dismiss philosophy as "opinions with fancy words" likely hold instrumentalist views of knowledge. Their resistance pattern suggests I need to anchor this in their existing workflow - probably policy memo writing where descriptive/prescriptive slippage has concrete consequences. The algorithm example works because it mirrors real predictive analytics in urban planning, but I'll tighten it to force the value-step visibility: must include a "efficiency" assumption that's actually normative.

  Dependency mapping for the concepts: 1) Students must first grasp descriptive claims as separate from prescriptive ones (foundational for both gaps) 2) Then see how the naturalistic fallacy manifests when someone treats a descriptive property (like "predictable gentrification") as intrinsically prescriptive 3) Only then reveal these are two angles on the same valuation black box. Crucially, Moore's open-question argument depends on understanding Hume's point - reverse order would confuse them.

  Misconception trajectory: First they'll conflate Hume (logical derivation problem) with Moore (property identification error) because both criticize "science to ethics" moves. Then they'll overcorrect to "empirical data is irrelevant to ethics" - dangerous for policy students! Finally, some might biologize "natural" to mean evolutionarily adaptive. Each needs blocking at specific points: the conflation during definitions, the irrelevance fear when analyzing the example, the evolution drift during Q&A.

  Sharp end-check question: "What exact step would remain unjustified even if the algorithm's accuracy improved to 100%?" Forces focus on the inference structure rather than data quality. For Hume/Moore, I'll bracket Hume's psychological origins of morality and Moore's non-natural properties - waving hands there with "specialist rabbit holes" keeps focus on the applied trap.

  Teaching arc sequence: 1) Start with their world - policy memo that hides the value leap 2) Dissect it into descriptive/prescriptive parts 3) Define both gaps as guardians against that specific slippage 4) Apply definitions back to memo 5) Debunk misconceptions as they arise 6) End with reconstruction exercise. The algorithm stays central because its "94% accuracy" creates false security - they'll feel the unease when efficiency seems "obviously" good.
answer: |-
  Here's a proven pedagogical sequence designed for policy students, treating the is-ought gap and naturalistic fallacy as a single structural trap in policy reasoning. The arc builds dependencies logically and preempts key misconceptions.

  **Core Carrying Example (Defended Choice):**  
  Use your **gentrification algorithm scenario** with one critical refinement:  
  *"City Council sees algorithm predicts Neighborhood X will gentrify with 94% accuracy. Council concludes city funds* ***ought*** *to be directed to X to 'maximize efficient use of public resources.'"*  
  **Why it works:**  
  - **Must have:** A clear descriptive input ("will gentrify"), a prescriptive output ("ought to invest"), and a hidden value premise masquerading as fact ("efficiency = good use of funds").  
  - **Must lack:** Obvious moral wrongness (e.g., it's not about racial bias). This prevents students from jumping to "it's bad policy" before analyzing the inference structure.  
  - **Sharpness:** The 94% accuracy baits them into trusting the science, while "efficiency" smuggles in the value. Policy students recognize this "evidence-based" rhetoric.

  ---

  **Teaching Sequence & Dependency Map**  
  *(Each step requires the previous to avoid collapse)*

  1. **Problem First:** Present the **algorithm case as a policy memo excerpt**. Ask: *"Should the council approve this? Why/why not?"*  
     *→ Surface instinctive policy objections (unfairness, displacement) but note these aren't the focus yet.*

  2. **Dissect the Inference:** Map the argument on board:  
     `Descriptive Premise (IS):` Algorithm predicts X *will* gentrify (94% accurate).  
     `Prescriptive Claim (OUGHT):` City *ought* to invest in X.  
     **ASK:** *"What's logically MISSING between IS and OUGHT?"*  
     *→ Force recognition of a gap. They'll name hidden values (e.g., "efficiency is good").*

  3. **Name the Trap - Hume's Is-Ought Gap:**  
     - "This is **Hume's Guillotine**: No set of *descriptive* facts (IS) alone can logically compel a prescriptive *ought*. You always need a *value premise*."  
     - Visual: `IS → [???] → OUGHT`. The "[???]" is the hidden value.  
     *→ Dependency: Students must see the inference break BEFORE labeling it.*

  4. **Expose the Hidden Value - Moore's Naturalistic Fallacy:**  
     - "The council assumed 'predictable gentrification' (a descriptive property) *just is* 'efficient investment' (a value). This is the **Naturalistic Fallacy**: Mistaking a *natural/descriptive* property for *goodness itself*."  
     - Stress: "Naturalistic" = "descriptive" here (e.g., statistical, sociological), NOT "natural" as in forests.  
     - Show the smuggled premise: `"Whatever maximizes efficient resource allocation is GOOD"`  
     *→ Dependency: Hume's gap reveals the missing piece; Moore shows why hiding it in the description is fallacious.*

  5. **Fuse the Concepts:**  
     - "This is **one double-bind**:  
       - *Step 1:* Hide your value premise (e.g., efficiency = good).  
       - *Step 2:* Treat a descriptive fact (gentrification predictability) *as if it were* the value.  
       - *Result:* You 'derive' an ought from an is by cheating."  
     - Re-map the argument with the hidden premise exposed:  
       `IS (predicts gentrification)` + `HIDDEN VALUE (efficiency = good)` → `OUGHT (invest)`  
     *→ Now they see both thinkers attack different sides of the same error.*

  ---

  **Misconception Defense Plan**  
  Preempt errors *at precise moments*:

  1. **Conflation of Hume & Moore**  
     - ✦ **When:** During definitions (Steps 3 & 4).  
     - ✦ **Head-off:** "Hume asks *'Where's your bridge?'* Moore warns *'Don't pretend your bricks are the bridge!'* Hume notes the missing link; Moore says you can't build the link from descriptive bricks alone."  
     - ✦ **Anchor:** Use the gentrification map. Hume = gap between IS and OUGHT. Moore = mistaking "predictable gentrification" (IS) for "good investment" (OUGHT).

  2. **"So science is useless for ethics?"**  
     - ✦ **When:** After Step 4 (defining both gaps).  
     - ✦ **Head-off:** "NO. Science reveals consequences (e.g., investing here *causes* displacement). But consequences only matter *if we value* things (e.g., fairness). Science informs; values decide."  
     - ✦ **Anchor:** Ask: *"Would better data (e.g., 99% accuracy) solve the council's mistake? Why not?"*

  3. **"Natural = evolutionarily good"**  
     - ✦ **When:** During Q&A or "naturalistic" label explanation.  
     - ✦ **Head-off:** "In this context, 'naturalistic' means *descriptive facts* (data, trends, biology) – NOT 'nature' or 'evolution'. Saying 'evolution favors it' is still an IS claim. You'd still need: *'Why ought we follow evolution?'*"  
     - ✦ **Anchor:** Modify the example: *"If the algorithm predicted evolutionarily 'fit' neighborhoods, would that justify investment?"* → Still requires a value leap.

  ---

  **Do NOT Unpack**  
  - **Hume:** Skip his *psychological explanation* of morality (custom, passion). Only use his *logical point* about inference.  
  - **Moore:** Avoid "non-natural properties" metaphysics. Only use his *open-question argument*: *"Is whatever gentrifies automatically good?"* → The "yes" feels incomplete.  

  **Sharp Check-at-End Question**  
  > *"The council responds: 'But we HAVE bridged the gap! Our hidden premise is that efficient spending is good, and that's just basic fiscal responsibility.' What's wrong with this?"*  

  **Correct Answer:**  
  They committed the naturalistic fallacy by treating "fiscal responsibility" (a descriptive policy outcome) as identical to "good" (a value), without justifying *why* that value should override others (e.g., equity). The inference remains circular: "We ought to do this because it fulfills this value" assumes the value is valid.  

  **Why it works:** It tests if they see the structure, not just the slogan. Strong answers will:  
  (1) Re-identify the hidden value,  
  (2) Note it wasn't derived from data,  
  (3) Explain why labeling it "fiscal responsibility" doesn’t make it objectively binding.  

  This sequence forces policy-minded students to confront the trap in their own logic, using a realistic case where dismissing philosophy could lead to unexamined, value-laden decisions.
