answer: |-
  ## The Metaphysics of Legislative Precisification

  Supervaluationism provides the more coherent account of legislative precisification. This act involves replacing a vague normative standard like "excessive force" with a sharp quantitative cutoff like "pressure exceeding thirty pounds." To understand this act's metaphysical nature, we must contrast epistemicism and supervaluationism.

  Epistemicism posits that vague predicates possess sharp, objective boundaries, but these boundaries are unknowable due to our epistemic limitations. For the epistemicist, legislative precisification is an act of *metaphysical discovery*. The lawmakers, perhaps through deliberation or empirical investigation, uncover the pre-existing, precise threshold that was always determinately true (e.g., 30 pounds *was* always the exact boundary of "excessive force"). The precisification reveals, rather than creates, the extension. However, this faces a powerful objection: it implausibly treats a contingent legislative *choice* as uncovering a necessary metaphysical truth. Why would the hidden boundary align perfectly with the politically negotiated, often arbitrary-seeming number chosen by fallible humans in a specific context? It renders legislative debate about the "right" cutoff strangely akin to scientific discovery, obscuring the normative and conventional nature of lawmaking.

  Supervaluationism, conversely, holds that a vague predicate admits multiple equally legitimate ways of making it precise (precisifications), all consistent with its core meaning and established usage. The predicate's *definite* extension includes only what is true under all admissible precisifications; borderline cases vary across them. For the supervaluationist, legislative precisification is an act of *selection*. Lawmakers arbitrarily (in the sense of not being uniquely determined by meaning) choose *one* admissible precisification from the many (e.g., selecting 30 pounds as the cutoff, even though 29.9 or 30.1 might also have been admissible interpretations before the law). This choice *alters* the concept's extension within the legal domain, rendering cases that were previously borderline definitively in or out. The strongest objection here concerns *bindingness*: Why does the chosen precisification suddenly become legally authoritative and binding when, prior to the legislation, all precisifications were equally legitimate interpretations? How does the legislative act transform an arbitrary selection into the sole determinant of truth and legal consequence?

  While the bindingness objection is significant, supervaluationism offers a more plausible framework for legislative precisification. It accurately captures the sense that lawmakers are *stipulating* a boundary where none was dictated by language alone, reflecting the contingent, creative aspect of law. The act of legislation itself, grounded in institutional authority and the need for determinacy in application, provides the mechanism by which one precisification becomes uniquely authoritative – it is *decreed* legally binding. This better explains why legislative choices about cutoffs (e.g., blood alcohol limits) often feel like pragmatic settlements rather than discoveries of hidden facts. Epistemicism's strength lies in preserving bivalence and a straightforward notion of truth, but its treatment of legislative choice as discovery strains credibility, ignoring the role of convention and authority. Supervaluationism, despite needing to explain the source of bindingness (found in the nature of legal institutions), provides a more realistic and coherent picture of precisification as a normative act of selection, not revelation.
