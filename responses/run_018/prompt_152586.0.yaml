  First, I need to recall Lewis's framework clearly. His conventions solve coordination problems through behavioral regularities sustained by mutual expectations - like driving on one side of the road. The puzzle is how such arbitrary solutions become "moralized" into obligations that resist change even when better options exist.

  For the desiderata structure, I'll organize into:
  - Explanatory coverage (must account for moralization and persistence of suboptimal norms, like the honor culture case where dueling persists despite alternatives)
  - Conceptual distinctions (critical to preserve between behavioral expectations vs normative expectations, and between stability vs prescriptive force)
  - Consistency constraints (non-negotiables like no explicit rules or common knowledge requirements from Lewis, plus evolutionary path-dependence)
  - Exclusion conditions (must avoid reducing "ought" to prediction or smuggling in moral realism)

  The core tension asks whether we can simultaneously have:
  (a) Normative force from first-order preferences alone
  (b) Resistance to Pareto improvements
  (c) Lewis's authority-free conventions

  I suspect (a) is the weak link. First-order preferences alone can't generate true obligation - we need second-order attitudes to explain why people feel bound even when it's disadvantageous. This connects to Hart's internal aspect of norms. Relaxing (a) to include emergent second-order attitudes does the least damage while preserving Lewis's core insights.

  The user seems highly knowledgeable - likely a grad student or academic preparing for a seminar. They want rigorous philosophical analysis but with concrete examples anchoring each point. I should maintain precision while making the tradeoffs clear, especially that sticky issue of how obligation emerges from mere coordination. The honor culture case is perfect for showing why second-order attitudes become necessary.
answer: |-
  Here is a structured analysis of desiderata for a theory extending Lewisian convention to normative practices, addressing the core tension:

  **I. Desiderata Categories & Motivating Cases**

  1.  **Explanatory Coverage (Non-Negotiable Core)**
      *   **Required Transitions:**
          *   **Emergence of Moralization:** How purely coordinative conventions (e.g., driving side) acquire *intrinsic* prescriptive force ("we *ought* to drive on the right") and become objects of normative attitudes (approval/blame).
          *   **Persistence of Suboptimal Norms:** Why norms resist change even when a Pareto-superior alternative exists (e.g., "Honor Culture": Dueling persists despite high costs and safer dispute-resolution alternatives being available, due to perceived obligation and fear of dishonor/sanction).
      *   *Rationale:* A theory failing here cannot explain the target phenomenon – normativity beyond coordination.

  2.  **Conceptual Distinctions (Non-Negotiable Core)**
      *   **Must Preserve:**
          *   **First-order (Behavioral) Expectations:** Expectation *that* others will conform (e.g., expect others to drive on the right).
          *   **Second-order (Normative) Expectations:** Expectation *that* others expect conformity *and* approve of it/disapprove of violations, potentially sanctioning (e.g., expect disapproval/social cost if I drive on the left; expect approval for conforming).
          *   **Descriptive Stability vs. Prescriptive Force:** Distinguishing a mere behavioral regularity (people *do* X) from one perceived as obligatory (people *should* do X, violating it is *wrong*).
      *   *Rationale:* Conflating these obscures the essence of normativity. The "Honor Culture" case hinges on second-order expectations and prescriptive force.

  3.  **Consistency Constraints (Mostly Non-Negotiable)**
      *   **Must Be Compatible With:**
          *   **Lewis's Minimalism:** No requirement for explicit agreements or centralized authority (Non-Negotiable). Norms must emerge bottom-up.
          *   **Lewis's Epistemology:** No requirement for common knowledge of rationality (Non-Negotiable). Norms can arise through simpler learning/adaptation.
          *   **Evolutionary Dynamics & Path-Dependence:** Ability to explain how historical accidents or selection among multiple coordination equilibria lead to specific norms (e.g., QWERTY keyboard layout persisting despite inefficiency). (Non-Negotiable for an evolutionary account).
      *   *Rationale:* Violating Lewis's core undermines the extension project. Ignoring path-dependence ignores a key feature of norm evolution.

  4.  **Exclusion Conditions (Non-Negotiable Core)**
      *   **Must Avoid:**
          *   **Reduction of "Ought" to Predictive Reliability:** Explaining norm-following *only* as prediction of sanctions ("I do X to avoid punishment") fails to capture the *internal* sense of obligation ("I *should* do X"). (Anti-Reductionist Constraint).
          *   **Importing Unreduced Moral Realism:** The theory should explain normative *force* and *phenomenology* without presupposing objective moral facts ("Platonic Forms"). (Anti-Realist Constraint for naturalistic accounts; camp-specific preference for realists).
      *   *Rationale:* Avoiding the first preserves normativity; avoiding the second preserves naturalism/continuity with Lewis.

  **II. Addressing the Core Tension (a, b, c)**

  The theory **cannot** simultaneously satisfy all three of:

  *   **(a) Deriving Normative Force Solely from First-Order Preferences:** Normativity requires more than predicting behavior and preferring coordination.
  *   **(b) Explaining Resistance to Pareto-Improvement:** Requires a force *beyond* individual preference for the best outcome (e.g., fear of sanction, sense of duty, identity costs).
  *   **(c) Faithfulness to Lewis (No Authority/Explicit Rule):** This remains possible.

  **Conflict Analysis:**

  1.  **(a) vs. (b):** This is the fundamental conflict.
      *   *Why?* First-order coordination preferences alone are inherently *instrumental* and *consequentialist*. If a Pareto-superior alternative exists, purely self-interested agents with only first-order preferences (like in basic Lewisian conventions) *should* switch. Resistance requires a countervailing force – precisely what second-order expectations (fear of blame/sanction, internalized sense of duty) or the *intrinsic* value placed on conformity *as such* (a proto-normative attitude) provides. The "Honor Culture" (b) collapses if only first-order preferences matter; agents would abandon dueling for safer alternatives. *(a) directly undermines (b).*

  2.  **(a) vs. the Conceptual Distinction:** Insisting on (a) forces a conflation of behavioral expectations (first-order) with normative expectations/prescriptive force (second-order), violating a core desideratum.

  **Resolution: Relaxing (a) does the least damage.**

  *   **Relaxation:** Allow the emergence of **second-order normative attitudes** (expectations of approval/blame/sanction, internalized sense of obligation) from *within* the evolutionary dynamics of coordination, without requiring explicit rules or centralized authority (thus preserving (c)).
  *   **Why Least Damage?**
      *   **Preserves (b):** Second-order attitudes explain resistance to Pareto-improvement (e.g., in "Honor Culture," fear of dishonor/sanction outweighs material benefit).
      *   **Preserves (c):** These attitudes can emerge bottom-up through repeated interaction, learning, and social signaling (e.g., via evolutionary game theory models of indirect reciprocity or costly signaling), satisfying Lewis's anti-authoritarian requirement.
      *   **Addresses Explanatory Coverage:** Explains moralization and persistence.
      *   **Preserves Conceptual Distinctions:** Second-order attitudes ground prescriptive force distinct from mere stability.
      *   **Satisfies Consistency Constraints:** Compatible with evolutionary dynamics and Lewis's minimalism/epistemology.
      *   **Satisfies Exclusion Conditions:** Avoids reducing "ought" to prediction (the attitude *is* the "ought") and avoids unreduced realism (attitudes are psychological/social facts).
  *   **Cost:** Requires moving beyond Lewis's *strictly* first-order preference framework. However, this extension is necessary and faithful to the *spirit* of explaining social phenomena through individual interactions and expectations.

  **Evolutionary Game-Theoretic/Social Norm Accounts:** These models (e.g., Bicchieri, Skyrms, Young) naturally incorporate second-order expectations (sanctioning, conditional strategies) and internalization through learning/evolutionary dynamics. They excel at explaining path-dependence and suboptimal persistence, satisfying most desiderata, especially when incorporating elements like norm psychology or group selection to address internalization and moralization. They typically relax (a) to achieve (b) while maintaining (c). Rational-choice reductionist models struggle more with (b) unless they incorporate sophisticated preference structures mimicking normative attitudes, while normative realist accounts might struggle with (c) and the exclusion condition against unreduced realism.
