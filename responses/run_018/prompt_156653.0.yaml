  ### Decision-Tree Taxonomy: Moral Desert, Determinism, and Punishment  
  *Root Case*: An offender with a deterministic neural lesion causing violent behavior expresses remorse and requests stricter, longer confinement for self-correction.  

  **First Split (Q1):**  
  - **Option A:** Granting the request treats the offender with respect because they *genuinely deserve* the harsher conditions.  
  - **Option B:** Granting the request is a *therapeutically appropriate intervention* to address risk or rehabilitation.  

  *(A → Retributive frameworks; B → Non-retributive frameworks)*  

  ---

  ### Binary Splits  
  1. **Split (i) Control vs. Sourcehood under Determinism:**  
     - **Question:** If every choice is determined by prior causes (e.g., genetics, environment), does this *only* undermine your ability to control your actions, *only* undermine your status as the ultimate source of your actions, undermine *both*, or undermine *neither*?  
       - **Option A:** Undermines **both or one condition** (control/sourcehood) for responsibility.  
       - **Option B:** Undermines **neither condition**.  

  2. **Split (ii) Justification for Confinement:**  
     - **Question:** Should confinement (like incarceration) be justified *only* by future benefits (e.g., crime prevention, rehabilitation), or does it *always* include a backward-looking component (e.g., society has a right to impose suffering for the act itself)?  
       - **Option A:** **Only future benefits** (social coordination, risk management).  
       - **Option B:** **Includes backward-looking entitlement** (offender forfeited rights).  

  3. **Split (iii) Quarantine Model vs. Retributivism:**  
     - **Question:** If an offender’s isolation time matches the *seriousness of their past crime* rather than their *current risk level*, is this a disguised form of retribution?  
       - **Option A:** **Yes, it collapses into retributivism.**  
       - **Option B:** **No, it remains non-retributive risk management.**  

  4. **Split (iv) Expressive Punishment without Desert:**  
     - **Question:** Can society condemn a crime to recognize victims’ suffering *without* invoking a metaphysical notion that the offender "deserves" suffering?  
       - **Option A:** **Yes, expression is separable from desert.**  
       - **Option B:** **No, expression requires desert.**  

  5. **Split (v) Procedural Desert:**  
     - **Question:** Can an offender *rationally endorse* rules that apply sanctions deterministically to people like them, creating a non-instrumental (but non-retributive) reason for punishment?  
       - **Option A:** **Yes, procedural desert is coherent.**  
       - **Option B:** **No, procedural desert is incoherent.**  

  ---

  ### Terminal Leaves (8 Positions)  
  1. **Hard Incompatibilism (Pereboom/Strawson-inspired)**  
     - *Core claim:* The offender’s lesion voids responsibility; confinement is purely preventive and ignores their request unless it reduces risk.  
     - *Awkward commitment:* Must deny that remorse or self-correction requests alter moral status.  
     - *Coherence:* **Defended** by hard determinists; consistent but sacrifices intuitive blame.  

  2. **Compatibilist Retributivism (Dennett-inspired)**  
     - *Core claim:* The offender deserves stricter confinement for their act (control/sourcehood intact), and their remorse validates this desert.  
     - *Awkward commitment:* Must defend desert even with a deterministic cause (e.g., lesion).  
     - *Coherence:* **Defended**; prioritizes agential control over causal history.  

  3. **Utilitarian Quarantine (Caruso-inspired)**  
     - *Core claim:* Confinement duration must *only* match current risk (like disease quarantine); the offender’s request is irrelevant unless it lowers risk.  
     - *Awkward commitment:* May release high-risk offenders if rehabilitation fails.  
     - *Coherence:* **Defended**; collapses if severity tracks past acts (Split iii-A).  

  4. **Expressivist Non-Retributivism (Duff-inspired)**  
     - *Core claim:* Grant the request to express societal condemnation *without* desert, treating it as communicative therapy.  
     - *Awkward commitment:* Risks smuggling in desert if expression mirrors retributive severity.  
     - *Coherence:* **Coherent but unstable** if victim recognition demands desert (Split iv-B).  

  5. **Procedural Desert Hybrid (Unnamed)**  
     - *Core claim:* Grant the request because the offender endorses rules that apply sanctions deterministically to all (including themselves), creating non-retributive "desert."  
     - *Awkward commitment:* Justifies punishment even if no therapy/risk-reduction occurs.  
     - *Coherence:* **Unexplored but coherent**; bridges autonomy and determinism.  

  6. **Moral Luck Skepticism (Nagel-inspired)**  
     - *Core claim:* The lesion voids desert, but backward-looking forfeiture justifies confinement (not for future benefits).  
     - *Awkward commitment:* Punishes "unlucky" offenders without moral responsibility.  
     - *Coherence:* **Incoherent**; forfeiture requires responsibility it denies.  

  7. **Therapeutic Instrumentalism (Wootton-inspired)**  
     - *Core claim:* Ignore the request; confinement is *only* therapy/risk-management. No desert or expression.  
     - *Awkward commitment:* Treats offenders as objects, dismissing autonomy.  
     - *Coherence:* **Defended**; purely empirical but morally sparse.  

  8. **Retributive Collapse (Unnamed)**  
     - *Core claim:* Use a "quarantine" model, but if severity tracks past acts, it secretly accepts desert. Grant the request as deserved penance.  
     - *Awkward commitment:* Denies non-retributive labels while using their framing.  
     - *Coherence:* **Incoherent**; simultaneously denies and affirms desert.  

  ---

  ### Meta-Section: Unresolved Divergences  
  The tree cannot cleanly separate:  
  - **Compatibilist Retributivism (Leaf 2) vs. Retributive Collapse (Leaf 8):** Both answer Q1-A, Q2-B, Q3-B, Q4-B, Q5-B. Divergence stems from **unmeasured normative weighting**: Leaf 2 sees desert as explicit; Leaf 8 sees it as covert in "neutral" frameworks.  
  - **Utilitarian Quarantine (Leaf 3) vs. Therapeutic Instrumentalism (Leaf 7):** Both answer Q1-B, Q2-A, Q3-A, Q4-B, Q5-B. Divergence lies in **empirical beliefs**: Leaf 3 ties quarantine to risk algorithms; Leaf 7 rejects institutional constraints.  
  - **Expressivist Non-Retributivism (Leaf 4) vs. Procedural Desert Hybrid (Leaf 5):** Both answer Q1-B, Q2-B, Q3-A, Q4-A, Q5-A. Divergence arises from a **conceptual ambiguity** in "endorsement" (Q5): Leaf 4 prioritizes societal communication; Leaf 5 prioritizes individual rationality.  

  **Diagnosis:** The tree captures core disagreements but blurs positions sharing all splits, as practical recommendations hinge on unspoken priorities (e.g., victim recognition vs. agent autonomy) not reduced to binary nodes.
