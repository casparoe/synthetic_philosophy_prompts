  ### Decision Tree: Ontology of Space, Motion, and Inertial Structure from Newton's Bucket

  **Starting Observation**: The water’s surface becomes concave when the bucket and water rotate together (no relative motion between them) relative to the "fixed stars," even if no other matter is visible. This concavity occurs without relative rotation to the bucket walls. The tree uses idealized Newtonian mechanics and probes responses via counterfactuals. Nodes are phrased as questions answerable from physical principles (e.g., symmetry, causality), not historical labels.

  ---

  #### **Decision Tree**  
  *Nodes 1–12 branch on concrete cases; leaves A–G are named positions. "World" = physically possible universe.*

  1. **In an otherwise empty universe (only bucket + water), if the water co-rotates with the bucket, does the surface become concave?**  
     - **Yes** → Node 2 (Non-material reference)  
     - **No** → Node 7 (Material-dependent motion)  

  2. **In a universe where a stationary bucket is surrounded by a rotating spherical shell containing *all* other matter, does the water’s surface become concave?**  
     - **No** → Node 3 (Absolute space/structure unaffected by distant matter)  
     - **Yes** → Node 4 (Inertial structure affected by matter)  

  3. **Imagine two worlds with identical material histories (distances, velocities, relative accelerations) but differing by constant absolute velocity. Are they physically distinct?**  
     - **Yes** → Node 5 (Absolute velocity real)  
     - **No** → Node 6 (Velocity relational)  

  4. **Can the inertial structure (defining "straight-line motion") exist unchanged if all matter is removed?**  
     - **Yes** → Node 13 (Unstable: Inertial structure independent yet affected? → Unoccupied)  
     - **No** → Leaf D: **Dynamicalism**  

  5. **Imagine two worlds with identical material histories but differing only in which space-points are occupied (via a smooth non-rigid shift). Are they distinct?**  
     - **Yes** → Leaf A: **Traditional Substantivalism**  
     - **No** → Leaf B: **Sophisticated Substantivalism**  

  6. **Can absolute acceleration be real if absolute velocity is conventional?**  
     - **Yes** → Unoccupied (Unstable: Acceleration needs velocity-difference)  
     - **No** → Unoccupied (Incoherent with Node 1 "Yes")  

  7. **In the rotating-shell scenario, does the water’s surface become concave?**  
     - **Yes** → Node 8 (Motion relative to matter)  
     - **No** → Node 9 (Motion unexplained by matter alone)  

  8. **In an empty universe, does a sealed inertial compass (e.g., gyroscope) register rotation?**  
     - **Yes** → Unoccupied (Incoherent: Material reference denied)  
     - **No** → Node 10  

  9. **Could a world contain matter but lack facts about which trajectories are inertial?**  
     - **Yes** → Leaf G: **Conventionalism/Deflationism**  
     - **No** → Node 11  

  10. **Are two worlds identical if all material relations (distances, velocities, accelerations) match?**  
      - **Yes** → Leaf C: **Machian Relationism**  
      - **No** → Unoccupied (Incoherent for relationism)  

  11. **In the hole argument scenario (same material relations, different point-occupancy), are the worlds distinct?**  
      - **Yes** → Unoccupied (Contradicts Node 1 "No": Points unreal)  
      - **No** → Node 12  

  12. **Does inertial structure require matter to exist?**  
      - **Yes** → Leaf F: **Point-Free Inertial Structuralism**  
      - **No** → Unoccupied (Incoherent with Node 1 "No")  

  ---

  #### **Leaf Positions**  
  *Characterization + "Most Awkward Commitment" (per position)*  

  - **A: Traditional Substantivalism**  
    Space-time is a substance; points exist independently. Motion is absolute.  
    *Awkward commitment:* Physically distinct but observationally identical worlds (e.g., hole argument).  

  - **B: Sophisticated Substantivalism**  
    Space-time points exist but lack primitive identity; only relational facts matter.  
    *Awkward commitment:* Complex semantics for spacetime discourse (e.g., counterpart theory).  

  - **C: Machian Relationism**  
    Motion is purely relational to matter; inertia depends on cosmic mass distribution.  
    *Awkward commitment:* Explaining local rotation without instantaneous cosmic dependence.  

  - **D: Dynamicalism**  
    Inertial structure encodes dynamical laws, not background space; affected by matter.  
    *Awkward commitment:* Ontological status of "structure" in matter-free regions.  

  - **F: Point-Free Inertial Structuralism**  
    Affine/inertial structure is real but manifold points are not; structure depends on matter.  
    *Awkward commitment:* Defining "structure" without relata (e.g., geodesics sans points).  

  - **G: Conventionalism/Deflationism**  
    Inertial frames are conventions; no objective fact about acceleration.  
    *Awkward commitment:* Explaining universal agreement on inertial effects (e.g., Coriolis).  

  *(Leaf E: Broad Leibnizian relationism merged with C; no distinct branch captured.)*  

  ---

  #### **Mapping & Unoccupied Combinations**  
  - **Plausible unoccupied combinations**:  
    - Node 6 "No" → Unstable: Accepts absolute acceleration but denies absolute velocity, violating vector coherence.  
    - Node 13 → Unattractive: Inertial structure independent *of* matter (Node 4 "Yes") yet affected *by* it (Node 2 "Yes").  
    - Node 11 "Yes" → Incoherent: Material-dependence (Node 1 "No") conflicts with point-identity realism.  

  - **Indistinguishability by bucket experiment**:  
    - *Sophisticated substantivalism (B) vs. Point-free structuralism (F)*: Same prediction for all cases (concavity iff non-rotating relative to inertial structure). Only distinguishable by hole argument (Node 5) or point-ontology.  
    - *Machian relationism (C) vs. Others in rotating shell*: Only C predicts concavity in rotating-shell case (Node 2 "Yes" → Node 8). Others (A, B, F) predict no concavity (Node 2 "No").  

  ---

  #### **General Relativity Note**  
  In GR, Nodes 2/4/7/12 collapse: Inertial structure (metric) is dynamically coupled to matter (Einstein’s equations), so shell rotation *can* cause concavity (frame-dragging). This eliminates traditional substantivalism (A) and favors dynamicalism (D) or point-free structuralism (F). The hole argument (Node 5) remains relevant.
