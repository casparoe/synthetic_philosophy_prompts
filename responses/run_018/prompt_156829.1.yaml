answer: |-
  ### Final Exam Question: Philosophy of Rationality Seminar (90 minutes)

  **Question (25 marks total):**  
  Consider an agent whose preferences over compound lotteries systematically violate the independence axiom in a manner we term *frame-locked independence failure*. Here, the framing of outcomes (e.g., as gains or losses relative to a reference point) shifts the agent’s weighting of common consequences, *without* altering:  
  (i) her ordinal ranking of sure outcomes, or  
  (ii) her probabilistic beliefs about states of the world.  

  **Assess whether a coherence argument** (e.g., Dutch-book, money-pump, or dynamic choice-based) **can be reconstructed to defend expected utility maximization (EUM) for this agent.** In your response:  
  1. **Logically reconstruct** how frame-locked failure challenges the assumptions underlying standard coherence proofs (e.g., Ramsey, Savage).  
  2. **Philosophically evaluate** whether such a reconstructed argument (if possible) retains normative force as a justification for EUM, or collapses into a mere consistency requirement on revealed preference.  

  ---  
  ### Model Answer (≈800 words)  

  #### (a) Standard Coherence Proofs Presuppose Separability  
  Standard Dutch-book arguments for the independence axiom (and thus EUM) implicitly assume *state-independent utility* and *separability of beliefs and values*. Ramsey and Savage derive a unique probability-utility pair by requiring that preferences over acts remain consistent across all hypothetical bets. Crucially, they assume the utility of an outcome is invariant to the state in which it occurs and to other counterfactual outcomes. This *separability* allows the extraction of a stable utility function solely from preference coherence. Frame-locked independence failure directly violates this: an outcome framed as a gain (e.g., +$100) and the same outcome framed as avoiding a loss (e.g., −$0 vs. −$100) are assigned different weights in lotteries, despite identical ordinal rankings and beliefs. The agent thus violates the *state-space invariance* required to isolate utility from belief.  

  #### (b) Frame-Locked Failure Undermines Unique Utility Representation  
  Frame-locked preferences reveal that "utility" is not separable from framing contexts. For instance, in a compound lottery choice:  
  - *Gain-frame*: The agent prefers lottery A = [0.5 chance of +$200, 0.5 of $0] over B = [sure +$100].  
  - *Loss-frame*: She prefers lottery C = [0.5 chance of −$0, 0.5 of −$200] over D = [sure −$100].  
  Both choices violate independence if we assume a fixed utility scale, yet the agent’s ordinal ranking of sure outcomes (−$200 < −$100 < $0 < +$100 < +$200) and beliefs (correct probabilities) remain unchanged. Coherence proofs require that the utility of $100 (or −$100) be identical across all acts to derive a unique representation. Frame-locking fractures this: utility becomes *frame-dependent*, rendering it impossible to construct a single utility function satisfying EUM for all framing contexts. Dutch-book vulnerabilities may still arise *within* a frame (e.g., loss-frame-only choices), but no global coherence constraint can be enforced without imposing ad hoc frame-invariance.  

  #### (c) Normative Force vs. Consistency: A Pyrrhic Victory  
  Reconstructing coherence requires relaxing separability. Jeffrey-style frameworks could incorporate frame-dependent utilities (e.g., utilities indexed to gain/loss states), but this redefines "coherence" as *internal consistency within frames*. While such an agent avoids Dutch books *if the frame is fixed*, she remains vulnerable to *meta-frame* money pumps: a bookie could exploit her by reframing identical outcomes (e.g., cycling between gain/loss descriptions of the same bet). Coherence thus reduces to avoiding exploitation *given a fixed frame*—a formal consistency condition on choice behavior. This strips coherence arguments of normative force:  
  - **Normative collapse**: The argument no longer justifies EUM as *rationally compelling*; it merely demands that preferences obey EUM *relative to a frame*. Framing sensitivity itself is deemed "rational" if consistent, despite contradicting EUM’s core norm of consequence-based choice.  
  - **Agency fragmentation**: Rationality becomes compartmentalized. The agent is "coherent" only in disconnected choice episodes, with no requirement for unified agency across contexts. Coherence loses its role as a guide for *deliberation*, becoming a local constraint on *response patterns*.  

  In sum, frame-locked failure exposes coherence arguments’ dependence on separability. Reconstructing coherence without it saves formal consistency but abandons EUM’s normative universality.  

  ---  
  ### Marking Scheme (25 marks total)  
  **A Answer (21–25 marks):**  
  - **Logical Reconstruction (10/10):**  
    - Identifies separability (state-independent utility) as a tacit assumption in Ramsey/Savage.  
    - Demonstrates how frame-locked failure disrupts unique utility representation by violating state-space invariance.  
    - Explains why Dutch-books may hold *within* frames but fail *across* frames.  
  - **Philosophical Evaluation (9–10/10):**  
    - Argues that reconstructed coherence (frame-relative EUM) reduces to consistency of revealed preference.  
    - Diagnoses the loss of normative force: frame-dependence voids EUM’s claim to transcend context.  
    - Engages the tension between dynamic consistency and unified agency.  
  - **Clarity (5/5):** Structured, precise, no tangents.  

  **B Answer (16–20 marks):**  
  - **Logical Reconstruction (7–8/10):**  
    - Correctly describes Dutch-book mechanics and notes framing violates independence.  
    - Fails to explicitly link framing to separability failure or state-space dependence.  
  - **Philosophical Evaluation (7–8/10):**  
    - States that framing challenges EUM but does not dissect normative consequences.  
    - Superficial treatment of "coherence vs. consistency" distinction.  
  - **Clarity (4/5):** Generally clear but less rigorous.  

  ---  
  ### Penalize These Mistakes (−3 marks each):  
  1. **Conflating coherence with static consistency**:  
     - *Error:* Claiming Dutch-books only require "no contradictions in choices" (e.g., treating coherence as transitivity).  
     - *Correction:* Coherence is diachronic—it punishes agents who accept multiple bets leading to sure loss. Framing exploits *dynamic* inconsistency across choice sequences.  
  2. **Treating framing as stochastic noise**:  
     - *Error:* Framing effects are "mistakes" or "random biases" that disrupt "true" preferences.  
     - *Correction:* Frame-locked failure is *structurally regular*—preferences are deterministic and reproducible within frames. The issue is non-separability, not irrationality.  

  ---  
  **Exam Conditions:**  
  - 90 minutes, closed-book, no citations.  
  - Refer to Ramsey/Savage/Jeffrey as needed for conceptual orientation.  
  - Grading: Logic (10), Philosophy (10), Clarity (5).
