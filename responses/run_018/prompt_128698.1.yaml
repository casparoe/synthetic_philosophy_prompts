    *Awkward: You're saying we're all bad at basic math about our own lives.*
  - **A1b**: Being overwhelmed in the moment? (e.g., stress, tired) → **Willpower Depletion Model**  
    *Awkward: Willpower is a muscle that gets tired, but why do some temptations exhaust it more?*

  **Q1b: Why choose worse?**
  - **A1c**: Because right then, you valued the immediate pleasure more? → **Clear-eyed Akrasia**  
    *Awkward: You can genuinely choose what you know is worse overall – which seems bonkers.*
  - **A1d**: Because you changed your mind about what's best? → **Re-evaluation Model**  
    *Awkward: This means you didn't really act against your better judgment – you just changed your mind.*

  **Q2 (for B): How do the parts relate?**
  - **B1**: One part is the boss but got weak? → **Hierarchical Model**  
    *Awkward: How do we pick the boss part? And why does it ever lose?*
  - **B2**: No boss – it's a battle or democracy? → **Fragmented Self Model**  
    *Awkward: There's no "true you" – just a bunch of voices.*

  **Q3 (for C): Why didn't the group act?**
  - **C1**: Each person thought their action wouldn't matter? → **Collective Action Problem**  
    *Awkward: It's not about willpower – it's about coordination.*
  - **C2**: The group kept pushing responsibility to the future? → **Intertemporal Group Procrastination**  
    *Awkward: Groups aren't single agents, but we treat them like they are.*
  - **C3**: The group's decision process is broken? → **Structural Akrasia**  
    *Awkward: It's not about will – it's about bad structures.*

  **Notes:**
  - **Empty Spot?** If you choose **A2** (knew and chose worse) and then **A1d** (changed mind), that's not akrasia – it's just changing your mind. We mark it as a position (Re-evaluation Model) but note it's not truly weakness of will.
