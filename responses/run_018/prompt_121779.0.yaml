answer: |-
  Here is the thought experiment: Reconsider Black's spheres—two identical spheres symmetrically separated by two metres in an otherwise empty universe, sharing mass, charge, and all intrinsic physical properties. Introduce a single, undetectable, non-relational distinction: one sphere bears an intrinsic **ontological valence**—a primitive, non-qualitative 'mark' designating it as *the subject of consideration* within the foundational metaphysical framework of this universe. This valence is not a physical property, not caused by anything, not temporally variable, and grants no empirical difference; it is a brute fact of its individual identity, akin to being arbitrarily labelled 'A' in the universe's axiomatic ground rules, though no such label physically exists.

  I reject Leibniz's Identity of Indiscernibles. The ontological valence isolates a real, non-qualitative difference. On this view, both spheres are empirically and qualitatively identical. Observing them reveals no distinction whatsoever; all measurements, interactions (if any were possible), and relational properties (like distance) are symmetric. However, the spheres are *metaphysically* distinct. Sphere Alpha possesses the brute ontological valence, meaning its fundamental 'this-ness' includes the primitive fact *that it is the subject*. Sphere Beta lacks this valence entirely. The structural element doing the philosophical work is the valence's *brute intrinsicality* and *non-qualitative nature*. It is not a property like mass or charge that describes *how* the sphere is; it is a primitive fact *that* it is *this* particular subject, a haecceitistic difference grounding numerical distinctness without qualitative variation. Each sphere is like the other in every conceivable experiential or measurable way, yet Alpha is metaphysically 'tagged' as subject by the universe's fundamental structure, while Beta is not—a difference in bare identity.

  A defender of Leibniz would attack this by arguing the ontological valence is either disguised relationalism or fails to be a genuine property. They might contend that being 'the subject of consideration' necessarily implies a relation—consideration *by whom* or *by what*? If the valence stems from the 'foundational metaphysical framework', doesn't that framework stand in a relation to Alpha? Thus, the distinction isn't truly intrinsic to Alpha alone. Furthermore, they might claim that a 'valence' granting no qualitative difference is incoherent or vacuous—if it makes no difference to the sphere's being or how it can be apprehended, it cannot constitute a legitimate basis for discernibility. It is merely a verbal label, not a real feature of the object itself, collapsing into a linguistic or conceptual relation rather than an intrinsic property. My rebuttal is that the framework's 'consideration' is not an *external* act or entity but an irreducible, non-relational aspect of Alpha's primitive identity within the universe's ontology, a brute fact not requiring a relatum. The valence's non-qualitative nature is precisely the point—it demonstrates that numerical distinctness can be primitive and not supervene on qualitative properties.
