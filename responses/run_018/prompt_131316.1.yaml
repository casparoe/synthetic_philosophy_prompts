  Here's a toast weaving those ideas tightly, aiming for warmth and intellectual spark without lecturing:

  "Cheers to [Bride]! Thinking about her journey here, a truth stands out: she couldn’t have come from any *other* sperm and egg. Those specific, fundamental building blocks were essential to make *this* incredible person we all love. Which makes me wonder about marriage vows: are they spoken by two people fixed by their separate origins, destined to meet? Or... is the *act* of making those promises something more? Maybe the vow itself becomes a new kind of origin – a shared foundation they *choose* to build upon, together, from this day forward. It’s not about soulmates predestined, or that 'anyone' could be standing here. It’s about *these* two specific people, shaped by their unique histories, freely choosing to create a brand new origin story – one they’ll write with every 'I do' repeated every single day. To [Bride] and [Groom], and your beautiful, brand-new beginning!"

  **Word Count:** 178  
  **Why it works:**  
  1.  **Clear Metaphysics Hook:** Explicitly states the origin essentialism concept ("couldn’t have come from any *other* sperm and egg," "essential," "fundamental building blocks").  
  2.  **The Pivot:** Smoothly transitions to the core question about vows being spoken by origin-fixed individuals OR *creating* a new shared origin.  
  3.  **Ruling Out Clichés:** Directly addresses "soulmates" and "you could've been anyone" as alternatives it *isn't*.  
  4.  **Heart & Shared Meaning:** Focuses on "this incredible person," "freely choosing," "brand new origin story," "beautiful, brand-new beginning" – resonant for all.  
  5.  **Accessible Language:** Uses "building blocks," "foundation," "story" instead of jargon. "Sperm and egg" is clear and might get a knowing chuckle.  
  6.  **Positive & Forward-Looking:** Ends on the active creation of their future together ("write with every 'I do'").  
  7.  **Concise:** Hits all points under the word limit.  

