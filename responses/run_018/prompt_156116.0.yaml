answer: |-
  **Decision Tree on Judicial Overrule**  
  *Start: Should unelected judges overrule legislatures?*

  **Q1: Primary objection?**  
  - **Democratic** (prioritizes electoral accountability) → Q2A  
  - **Epistemic** (prioritizes expertise/process) → Q2B  

  **Q2A (Democratic): What's the core flaw?**  
  - **Appointment mechanism** (judges aren't elected/appointed poorly) → Q3A  
  - **Lifetime tenure** (no accountability over time) → Q3A  
  - **No sunset/re-enactment** (decisions lack democratic renewal) → Q3A  

  **Q2B (Epistemic): What's the core flaw?**  
  - **Lack of expertise** (judges lack policy/fact knowledge) → Q3B  
  - **Institutional constraints** (courts can't gather evidence/views well) → Q3B  

  **Q3A (Democratic remedy): Can safeguards fix it?**  
  - **No** → Position: **Reject Judicial Overrule** (Parliamentary Supremacy or Popular Constitutionalism—tree can’t separate these)  
  - **Yes, limit scope** (only narrow interpretation, no striking down laws) → Position: **Weak-Form Review**  
  - **Yes, add sunset clauses** (laws revive unless legislature re-passes) → Position: **Unnamed** (sunset-adjusted review; unexplored)  
  - **Yes, ensure representativeness** → Q4  

  **Q3B (Epistemic remedy): Can safeguards fix it?**  
  - **No** → Position: **Legislative Expertise Primacy** (unnamed; rejects overrule)  
  - **Yes, limit scope** (only for clear legal errors) → Position: **Weak-Form Review**  
  - **Yes, enhance procedures** (e.g., expert panels, citizen input) → Position: **Expert-Adjusted Review** (unnamed)  
  - **Yes, ensure representativeness** → Q4  

  **Q4 (Representativeness type): What non-electoral trait matters?**  
  - **Demographic mirroring** (court reflects society’s diversity) → Position: **Unnamed** (demographic court; unexplored)  
  - **Deliberative quality** (court uses debate/rationality) → Position: **Deliberative Court Review** (unnamed)  
  - **Both** → Position: **Unnamed** (hybrid; incoherent—conflicting ideals)  

  ---

  **Tree Notes:**  
  - **Unseparated positions**: "Reject Judicial Overrule" lumps Parliamentary Supremacy (laws always win) and Popular Constitutionalism (people, not courts, interpret constitution)—both oppose overrule but differ on *who* checks legislatures.  
  - **Empty branches**:  
    - Sunset clauses (Q3A): Not inherently toxic but unexplored; could let legislatures override courts.  
    - Demographic mirroring (Q4): Coherent (e.g., diversity arguments) but rarely a standalone fix for overrule power.  
    - Hybrid representativeness (Q4): Incoherent—demographic quotas might clash with deliberative ideals.  
  - **Niche distinction**: Sunset/re-enactment (Q2A) addresses democratic decay without abolishing review.
