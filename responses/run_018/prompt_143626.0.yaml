answer: |-
  Fair point, but you're misinterpreting the rationality. Cascades collapse precisely *because* the model is working. Early agents rationally weigh their private signals against the accumulating public information. Once the public signal (the herd) becomes strong enough, it's statistically optimal to follow it *even if your private signal contradicts it* – you assume your signal is likely the outlier. The collapse isn't proof they suppressed evidence *irrationally*; it proves a new, highly informative signal (the deviant's action plus potentially their reasoning) finally outweighed the accumulated public evidence. It's a Bayesian update, not an admission of prior irrationality. Doesn't that moment of collapse actually demonstrate the system correctly responding to decisive new information?
