prompt: |-
  At a seminar on global workspace theory, a colleague dismissed reports of qualitative experience during subliminal priming by saying, "If it never reaches the global workspace, it was never phenomenally conscious." Before I respond, I want to understand exactly what that slogan could mean. Please lay out exactly five distinct precise readings of the claim — from a tautological definition to a contingent neurocognitive thesis — and for each say whether it is defensible, whether it conflates access with phenomenal consciousness, and whether it actually addresses the priming evidence. Give your answer as a numbered list of exactly five items, each one or two sentences long, with no introduction or conclusion.
