answer: |-
  You've precisely articulated three distinct institutional failure mechanisms—and I applaud this granular analysis—but you mistake diversity in political pathology for divergence from the entitlement thesis. My core claim isn't that famines share identical *operational* mechanics, but that they share the *fundamental causal condition*: catastrophic breakdowns in the social, legal, or political systems governing access to food. In Bengal, the trigger was war, but mass starvation occurred because wartime inflation and labor dislocation *institutionally* destroyed rice-purchasing power for rural laborers. In Ireland, the blight was biological, but mass death ensued because colonial property relations *institutionally* denied the starving any entitlement to the exported grain—a legally enforced transfer. China’s quotas and misinformation weren't mere distortions; they were *institutional* commands that actively dismantled household entitlements through state coercion. While the vulnerability mechanisms differ—market collapse, extractive property rights, or command-system fraud—they all demonstrate that starvation arises when institutions sever people's means of acquiring food. The entitlement framework doesn't flatten these; it *exposes* how each distinct institutional architecture creates distinct pathways to the same ultimate failure: systemic exclusion from sustenance. Nature provides the spark; politics builds the tinderbox and lights the match.
