answer: |-
  That's a brilliantly observed phenomenon! Philosophers absolutely have a handle on this specific tension. The established concept you're looking for is **haecceity** (pronounced "hek-SEE-ity" or "HEK-see-ity"), often discussed alongside the related concepts of **"thisness"** and **causal origin essentialism**. Here's the breakdown:

  1.  **Haecceity / Thisness:** This is the *specific, narrower term* for the "something else" people intuitively point to.
      *   Coined by the medieval philosopher Duns Scotus, **haecceity** refers to the non-qualitative property of being a *particular, unique individual thing*. It's the "thisness" that makes *this* heart *that specific heart*, *this* painting *the Mona Lisa*, or *this* text *the authentic Shakespeare sonnet*, even if an exact qualitative duplicate exists.
      *   It's the property of being *numerically identical* to itself, distinct from any other object, regardless of shared properties.
      *   In your examples, people are intuitively appealing to the haecceity of the original object – its unique historical identity and particular existence – which they feel isn't captured by even a perfect replica sharing all observable properties.

  2.  **How it Relates to Essentialism and Nominalism:**
      *   **Essentialism:** This intuition strongly supports a form of **non-qualitative essentialism**, specifically **origin essentialism** (associated with Saul Kripke). Essentialism holds that objects have necessary properties that make them what they are. Origin essentialism argues that an object's *specific causal origin* (e.g., being formed from *this* specific zygote, painted by *this* specific artist at *this* specific time, written by *this* specific author) is essential to its identity. The replica, despite sharing *qualitative* properties, lacks this essential historical/causal property. The "resistance to collapsing categories" stems from believing the *kind* "original human heart" or "authentic Van Gogh" *requires* a specific causal history.
      *   **Nominalism:** Nominalism generally denies the existence of universal properties or essences beyond the particulars. A strict nominalist might argue that if *all* observable properties are identical, then there *is* no real difference – the categories "original" and "replica" are just labels we apply based on contingent historical facts, not reflecting a deep metaphysical distinction. The intuition you describe is a problem *for* strict nominalism because it reveals a persistent belief in something more fundamental than just the bundle of properties – the haecceity or essential origin. Nominalists would see this intuition as a psychological or linguistic habit, not a reflection of reality.

  3.  **Is it a Difficulty for Realism or Anti-Realism about Kinds?**
      *   **For Realism about Kinds (especially Essentialist Realism):** This intuition *supports* a realist view that kinds have deeper essences (like specific causal origins) beyond just their observable features. It shows people naturally categorize based on perceived underlying historical identities. Realists can point to this intuition as evidence that kinds *are* more than just clusters of properties.
      *   **For Anti-Realism/Nominalism about Kinds:** This intuition *is a major difficulty*. It demonstrates that even when presented with perfect qualitative duplicates, people stubbornly insist on a categorical distinction based purely on origin/history. This suggests our concept of "kind" or "being the real thing" *isn't* reducible to observable properties alone, contradicting the nominalist claim that only particulars exist and kinds are just names for property bundles. The nominalist must explain why this intuition is so powerful and persistent if it doesn't track something real (even if just a social construct).
      *   **The Core Tension:** This phenomenon highlights the tension between **qualitative identity** (sharing all properties) and **numerical identity** (being the *very same* object). Your friends agree on qualitative identity but disagree on numerical identity for the original vs. the replica. They believe the replica, while qualitatively identical, is numerically distinct because it lacks the specific haecceity or essential causal origin of the original.

  **In Summary:**

  *   **The specific concept:** **Haecceity** (or **thisness**) captures the irreducible particularity people intuit.
  *   **The essentialism link:** It strongly supports **causal origin essentialism** – the idea that an object's specific origin is an essential part of what makes it that very thing and a member of its kind.
  *   **The nominalism challenge:** This persistent intuition poses a significant challenge to strict nominalism, which struggles to explain why the origin matters categorically if all properties are identical.
  *   **The realism/anti-realism tension:** It provides evidence for realist views (kinds have deeper essences like origins) but creates a problem for anti-realist/nominalist views (which must dismiss the intuition or explain it away).

  This "disagreement structure" reveals a deep-seated human intuition about individuality and origins that persists even in the face of perfect qualitative duplication – an intuition philosophers grapple with through these precise concepts. Your examples perfectly illustrate this enduring metaphysical puzzle.
