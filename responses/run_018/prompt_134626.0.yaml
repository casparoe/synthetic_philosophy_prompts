answer: |-
  ### Outline  
  1. **Introduction**: Define the mirror-test and core controversy.  
  2. **Critique 1: Presentism**: The risk of anachronistic projection.  
  3. **Critique 2: Equifinality**: Alternative causes for material patterns.  
  4. **Critique 3: Material-Mental Gap**: Can repetition imply shared intentionality?  
  5. **Defense**: Pattern stability as evidence of normative constraints.  
  6. **Synthesis**: Is the mirror-test salvageable?  
  7. **Conclusion**: A modified framework for inference.  

  ---

  ### Can Archaeologists Infer Religious Institutions from Burial Patterns?  
  #### The Mirror-Test Under Scrutiny  

  The "mirror-test" for institutional memory proposes that certain archaeological patterns—like persistent burial orientations across generations—reflect not just individual actions but shared rules, implying collective religious institutions. Critics dismiss this as circular presentism, equifinality, and an unjustified leap from material repetition to mental consensus. I argue that while the mirror-test is flawed, it can be salvaged through stricter criteria that sidestep modern baggage and address equifinality.  

  **The Presentism Objection**  
  Labeling patterned burials as "religious institutions" imports modern concepts of organized religion onto societies that may have lacked centralized authority or doctrinal orthodoxy. Prehistoric groups might have shared rituals without formalized priesthoods, dogmas, or enforcement mechanisms—features embedded in the modern term "institution." The mirror-test risks conflating *normative behavior* (e.g., "we bury north-facing here") with *institutionalized religion* (e.g., "the council enforces burial doctrine"). Unless modified, the test smuggles in contemporary assumptions.  

  **The Equifinality Challenge**  
  Identical burial patterns could stem from non-institutional causes:  
  - **Environmental constraints**: Wind direction or terrain dictating orientation.  
  - **Routine imitation**: Copying practices without shared belief ("tradition for tradition’s sake").  
  - **Kinship pragmatism**: Families repeating layouts for practical identification, not reverence.  
  If a single artisan oversaw burials for centuries, individual preference—not collective doctrine—could create stability. Equifinality forces us to ask: *Could this pattern exist without shared intentionality?* Too often, the mirror-test overlooks simpler alternatives.  

  **The Material-Mental Gap**  
  Repetition ≠ consensus. Grave goods aligned east-west might reflect:  
  - **Coincidence**: Limited options in a narrow valley.  
  - **Memetic drift**: Unreflective mimicry across generations.  
  - **Decentralized norms**: Emergent conventions, not top-down rules.  
  Without evidence of enforcement (e.g., deviant burials punished), correction, or symbolic elaboration (e.g., artifacts denoting supernatural concepts), material patterns alone cannot confirm *shared mental content about the sacred*.  

  **The Defense: Stability as Normative Constraint**  
  Proponents counter that *long-term stability* (e.g., 500 years of uniform burials) defies explanations based on individual whim, environmental flux, or coincidence. In living societies, such durability typically requires normative constraints—social mechanisms transmitting rules. Archaeologists might analogize to bird flocks: individual birds follow simple rules, but the *pattern* reveals an emergent structure. Thus, cross-generational material regularity *does* signal collective behavior, even if "institution" is an overreach.  

  **Synthesis: Salvaging the Mirror-Test**  
  The mirror-test fails if it demands *direct* inference of "religious institutions" from objects. However, it succeeds as a heuristic for detecting *normative collective behavior*. To rescue it:  
  1. **Replace "institution"** with "normative tradition," avoiding modern baggage.  
  2. **Require exclusion of equifinality**: Demonstrate environmental/technical factors *could not* produce the pattern (e.g., variable terrains with identical orientations).  
  3. **Seek corroborating proxies**:  
     - **Deviance**: Irregular burials suggesting enforcement.  
     - **Symbolic clustering**: Objects implying cosmology (e.g., grave goods only in specific orientations).  
     - **Scalability**: Patterns persisting across village relocations or population changes.  

  **Conclusion: Inference with Humility**  
  The mirror-test is not overreach if redefined. Archaeologists *can* legitimately infer collective normative practices from burial patterns—but not full-blown "religious institutions" without additional evidence. Pattern stability implies *some* social transmission mechanism, but calling it "religion" requires proxies for shared belief in the supernatural. The modified test becomes: *Does this material pattern necessitate normative transmission, and can we link it to the sacred through contextual cues?* Without such rigor, we risk constructing institutional mirages from ancient dust.  

  ---  
  **Final Verdict**: The mirror-test is salvageable as a tool for identifying normative traditions but requires stringent modifications to avoid presentism and equifinality traps. It points to *collective behavior*, not institutions—until further evidence bridges the material-mental gap.
