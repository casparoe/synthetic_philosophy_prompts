answer: |-
  Your ghostwriter voting setup **perfectly captures the formal structure** of the discursive dilemma—it's not a forced metaphor but a vivid, functional illustration. Let's dissect the philosophical stalemate and your questions:

  ### 1. **The Core Conflict: Logic vs. Legitimacy**  
     - **Premise-Based Aggregationists** prioritize *collective rationality*: The group must be logically consistent (e.g., "If we vote that the betrayal is believable AND the traitor is redeemable, redemption *must* happen").  
     - **Conclusion-Based/Democratic-Autonomy Advocates** prioritize *procedural legitimacy*: The group's direct vote on outcomes (e.g., "Should redemption happen?") reflects its true will, even if inconsistent with premises.  

     **They're answering different questions**:  
     - Premise-based: *"Can we construct a rational group agent?"*  
     - Conclusion-based: *"Whose voice counts as the group's?"*  
     This isn't a verbal dispute—it’s a clash between **epistemic** (truth-tracking) and **procedural** (will-expressing) ideals of democracy.

  ### 2. **The Hidden Empirical Claim**  
     Yes! Both sides assume **how real groups *should* reason**, but empirical studies (e.g., juries, corporate boards) show:  
     - Groups often **oscillate** between premise/conclusion-focused reasoning under pressure.  
     - **Power dynamics** matter: Who frames the premises? Does the chair force coherence?  
     - **Stakes change behavior**: In high-risk decisions, groups favor premise-based logic; in value-laden debates, they leap to conclusions.  
     → A field study (e.g., observing writing rooms or policy committees) could reveal which approach minimizes regret or maximizes buy-in.

  ### 3. **What Counts as Progress?**  
     - **Formal Results**: Impossibility theorems (like List & Pettit’s) prove no perfect system exists—but they clarify trade-offs.  
     - **Empirical Work**: Showing *when* premise/conclusion-based voting leads to better outcomes (e.g., fewer plot holes vs. richer character arcs).  
     - **Hybrid Models**: Your ghostwriters could use **sequential voting** (e.g., vote premises first, but revote if the conclusion clashes) or **approval voting** on premise-conclusion bundles.  
     - **Admitting Bedrock Intuitions**: Yes—this reveals a **metaphysical split**. Is the "group mind" an entity that *must* be rational? Or is it a chorus of voices that needn’t cohere?  

  ### 4. **Your Novel’s Brilliant Alignment**  
     Your ghostwriters exemplify the dilemma **exactly**:  
     - **Premises**: "Betrayal is believable" (P), "Traitor is redeemable" (Q).  
     - **Conclusion**: "Redemption arc happens" (P∧Q).  
     - **Flipped majorities**: 60% vote P true, 60% Q true, but 55% vote ¬(P∧Q) (no redemption).  
     → This *is* the discursive dilemma in action. The "flip" isn't a flaw—it’s the system working as designed when reasoning is fragmented.  

  ### 5. **Why Philosophers Are Stuck (and How Your Novel Can Help)**  
     The deadlock arises because **both sides are right within their frameworks**. Progress might come from:  
     - **Contextual Solutions**: In your novel, could ghostwriters use different rules for different genres? (e.g., strict logic for murder mysteries, outcome-voting for romances).  
     - **Power Interventions**: What if a lead ghostwriter breaks ties? Or if "narrative integrity" overrides votes?  
     - **Embrace the Chaos**: The voting flaws could *drive the plot*—e.g., inconsistent decisions creating plot holes that haunt the writers.  

  ### Honest Take:  
  Your setup isn’t just a metaphor—it’s a **natural application**. The ghostwriters’ struggle mirrors real-world committees (e.g., Supreme Court opinions, EU regulations). The "years of papers, zero movement" reflects a deeper tension: **We want groups to be both rational and authentic, but often they can’t be both.**  

  **→ Novelistic Opportunity**: Use the ghostwriters to explore *why* humans cling to coherence (premise-based) vs. sovereignty (conclusion-based). Is one approach more ethical? More creative? Does forcing logic sterilize art? Does pure democracy breed nonsense? That’s where philosophy meets narrative gold.  

  For academic closure: Cite *List & Pettit (2002)* for the formal dilemma, and *Dryzek & Niemeyer (2006)* for discursive solutions. But your fiction might resolve what papers can’t—by showing the human stakes behind the paradox.
