  If Schleiermacher was alive now and saw how LLMs translate whole books without ever asking what the author meant, do u think he'd side with Hofstadter that its all shallow statistical pattern-matching? There's this specific framing I want to push on: some people say transformer attention heads basically do Schleiermacher's grammatical interpretation — tracking syntax and lexical relations across languages — but they totally skip his psychological interpretation, where you have to reconstruct the author's mental state from the text. Would Schleiermacher think that split is meaningful? Like, can grammatical interpretation without psychological interpretation count as understanding at all, or is it just a fancy autocomplete with good syntax? And does his idea of the hermeneutic circle — understanding parts through the whole and back again — map onto how these models build context vectors, or is that analogy broken because there's no conscious whole being reconstructed?
