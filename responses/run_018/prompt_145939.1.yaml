answer: |-
  ## Verdict: Strawson's framework survives the challenge of vicarious and structurally-mediated reactive attitudes, but it must evolve by stretching the concept of the "participant stance" to encompass broader moral communities and acknowledging responsibility's complex diffusion in systems, ultimately strengthening its underlying compatibilist impulse.

  Strawson's core insight remains robust: moral responsibility is rooted not in elusive metaphysical freedom, but in our inescapable human practice of reactive attitudes (resentment, gratitude, indignation) within interpersonal relationships. Vicarious resentment (e.g., anger on behalf of future generations) doesn't destroy this foundation; it *extends* it. Feeling indignant for those who cannot feel wronged themselves (future people, distant victims) demonstrates that the participant stance – viewing others as proper targets of reactive attitudes – isn't limited to immediate, reciprocal exchanges. It reveals a psychological capacity to *represent* the interests and potential reactive attitudes of others within our imagined moral community. This vicariousness strengthens Strawson's case against skepticism by showing how deeply embedded reactive attitudes are, reaching beyond direct interaction. We adopt the objective attitude (viewing someone as an object to be managed, not blamed) towards the *unborn* only if we fundamentally deny their future moral status, a practical shift consistent with Strawson’s view.

  However, structurally-mediated resentment (e.g., towards corporations or policies) presents a sharper challenge to Strawson's focus on *individual* agents. Resenting a corporation feels genuine, yet we often cannot pinpoint a single blameworthy individual within the complex system. This seems to demand impersonal responsibility. But Strawson's framework can adapt. Our resentment towards the structure *still* implicitly points towards the *human agents* who design, maintain, or benefit from it. We resent the *collective* failure of moral regard embodied in the structure. When we adopt the objective attitude towards a *system* (e.g., seeing it purely mechanistically), it's often a practical strategy for analysis or reform, distinct from exempting individuals within it. We might simultaneously hold individuals responsible *through* the lens of the structure.

  This scenario doesn't force us to abandon personal responsibility; instead, it highlights a compatibilist truth Strawson gestures towards: responsibility exists *within* the causal order. Blaming the system precisely *because* we cannot easily isolate a single "free" culprit underscores that our practices of holding responsible aren't dependent on contra-causal freedom. They function pragmatically to regulate behaviour and express demands for moral regard, even when agency is distributed. We demand the system (and thus its human constituents) *change*, reflecting the core function of reactive attitudes.

  **Conclusion:** Vicarious and structurally-mediated reactive attitudes do not sink Strawson's ship. They reveal the participant stance's remarkable elasticity, encompassing representation and complex agency. While demanding we stretch "interpersonal" to include broader moral communities and acknowledge responsibility's diffusion, they reinforce Strawson’s core anti-skeptical argument: our practices of holding responsible are fundamental features of human social life, resilient and adaptable, operating effectively *without* needing to resolve the metaphysical free will debate. They push Strawsonian compatibilism towards acknowledging collective responsibility and systemic moral failure, but within a framework that remains fundamentally grounded in human psychology and practice.
