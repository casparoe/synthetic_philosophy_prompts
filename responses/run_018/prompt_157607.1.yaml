  hey im a phd student working on belief revision and im kinda stuck. could you give me an example of a conceptual issue that pops up when you apply Judy Benjamin-style updating to condtionals inside deontic modal contexts? specificaly im interested in cases where an agent updates on learning the antecedent of an 'if-ought-then-ought' claim is false, but they still retain the conditional belief, and this runs into trouble with a non-monotonic logic of obligation—what im calling the 'should-be-ought' tension in bureacratic ethics. imagine a civil servant who finds out they lack authority to issue a particular order, yet still believes that if they had the authority then they should issue it; the update seems to leave them with obligations about covering up the authority gap that conflict with the retained conditional. i want this as a concrete conceptual example, not a literature review—i dont have web access to verify citations right now.

