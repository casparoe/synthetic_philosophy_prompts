  - retained_conditional: If Alice has the authority to issue order X, then she ought to issue order X. (Authority → Obligation(Issue))

  - update_trigger: Alice learns that she does not have the authority (¬Authority).

  - conflict_with_should_be_ought: The update leads to an actual obligation to cover up the lack of authority (Obligation(CoverUp)). However, if Alice covers up and then issues the order (acting on the retained conditional by creating the appearance of authority), she violates the fundamental obligation that one must not issue orders without authority. Thus, the actual obligation (to cover up) and the retained conditional (which in the hypothetical scenario requires issuing) together lead to an action that is forbidden.

  - conceptual_twist: The retained conditional (a hypothetical "should") interacts with the updated actual obligation ("ought") in a way that the agent is led to consider a course of action (cover up and issue) that is actually prohibited. The tension arises because the non-monotonic logic of obligation, which should account for changing circumstances, fails to prevent this conflict: the obligation to cover up is derived from the current context, but it conflicts with a more fundamental obligation that persists.

