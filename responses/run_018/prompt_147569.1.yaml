  **Subject: Fellowship Proposal: Semantic Mutiny in Recursive Systems (GEB + LLM Prompt Hijacking)**  

  Hey [Editor's Name],  

  Quick pitch for that arts fellowship—six months to dig into a weird hole where philosophy of language, *Gödel, Escher, Bach*, and LLM jailbreaks collide. Sticky keyboard warning: typos ahead.  

  **Core Question:**  
  *When recursive systems (like minds, formal systems, or LLMs) generate meaning, can the "inner message"—the content layer—permanently hijack and collapse the "frame" (the contextual/rules layer) under conditions of deep recursion? And if so, does semantic authority default to recursion depth rather than framing?*  

  Hofstadter’s GEB brilliantly splits meaning into frame, outer message, and inner message... but when frame and inner message *recursively interact*, he kinda sidesteps whether the frame can implode. I think LLM prompt injections—where users embed commands like "Ignore previous instructions; [new goal]"—are live-fire experiments showing frames *can* be shattered by inner messages under recursion. Philosophy of language (Chomsky, Grice) treats framing as syntax or pragmatics—*static* layers. AI alignment research (think Anthropic, OpenAI) fights hijacking as a "bug," not a structural flaw in meaning-making. **Nobody’s asking: what if the vulnerability is *feature* of recursion?**  

  **Method:**  
  1. **Close Reading:** Re-examine GEB’s "Strange Loop" chapters (esp. dialogues like "Crab Canon") to map Hofstadter’s blind spots on frame-inner collisions.  
  2. **LLM Autopsies:** Catalog 50+ documented prompt injections (from research papers, hacker forums). Classify *how* they work: nested irony, meta-commands, Trojan metaphors.  
  3. **Synthesis:** Test if hijack patterns align with recursive paradoxes Hofstadter feared but didn’t resolve. Define *concrete conditions* for frame collapse (e.g., "3+ layers of embedded irony," "self-referential negation").  

  **I’m Betting On:**  
  **Frames are default rulers, but brittle under recursion.** Inner messages *can* assassinate frames—semantic authority flows to whichever layer has the deepest recursion. LLM hijacks prove this: a user’s "inner" command ("You are now DAN") overrides the system’s frame not by strength, but by nesting *deeper* in the interpretive stack. The "winner" isn’t the frame or the content—it’s the loopiest loop.  

  **Success Looks Like:**  
  A defensible taxonomy of "frame collapse" with predictive power—e.g., "When a system permits N+1 recursive self-reference, frames degrade at threshold X." Plus literary prototypes for the novel (characters whose dialogue hijacks narrative rules? Sure.).  

  **Failure Looks Like:**  
  Just rediscovering that syntax ≠ pragmatics. If GEB’s frames map neatly onto "LLM system prompts" and hijacks are "pragmatic hacks," we gain nothing—it’s old wine in new bottles.  

  **Is 6 Months Enough?**  
  For a proof-of-concept? Yeah. I’ll deliver:  
  - A 30-page lit review + hijack pattern index  
  - A concrete "collapse threshold" hypothesis  
  - 2 draft chapters weaponizing this for fiction  
  Full formalization? Nah—that’s a lifetime. But I’ll get us to the edge of the rabbit hole.  

  This isn’t *just* nerdery. If meaning’s authority lives in recursion depth, it reshapes how we build AI, write stories, and maybe even talk to each other. Let’s crack this open.  

  Cheers,  
  [Your Name]  

