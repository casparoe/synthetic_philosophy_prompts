  ### Key Design Choices:
  1. **Progression**: Starts concretely (MIU), creates cognitive friction, uses invariants as the first "small jump," then scales to Gödel. Each step resolves the previous step's frustration.
  2. **Carrying Example**: The robot token puzzle forces a topological view (ownership cycles) instead of numerical counts. Rules are purely local, making the invariant (global cycle structure) invisible until JOOTS occurs.
  3. **Misconception Timing**: Defusals are placed *after* the concept is introduced but *before* it could solidify as a misunderstanding (e.g., clarifying "not cheating" immediately after the invariant proof).
  4. **Understanding Check**: The modified MIU rule variant tests adaptive application of JOOTS principles, not memorization. Correct response requires invariant recalibration.
  5. **Omissions**: Excludes technicalities that don't directly serve the epistemic lesson. Gödel numbering is metaphorized ("map to arithmetic") but not formalized.
