prompt: |-
  I am a retired physicist who has only recently begun to study philosophy, and I have become absorbed by the problem of evidential cooperation in large worlds. By this I mean the situation, familiar from evidential decision theory, in which an agent expects her choice to correlate with those of many causally disconnected but structurally identical copies of herself, so that her decision carries evidential weight about outcomes elsewhere in the ensemble. I wish you to compare the evidential-decision-theoretic endorsement of cooperation in such worlds with the causal-decision-theoretic refusal to cooperate, but I want the comparison conducted through a specific analogical lens drawn from statistical mechanics: treat the full ensemble of decision-makers as a system of identical particles subject to symmetry constraints. Precisely identify which aspects of evidential cooperation correspond to the preservation of global symmetry across the ensemble, which correspond to its breaking, and whether the causal theorist's demand for local causal efficacy functions structurally like a local-field constraint that prohibits non-local correlations. Do not provide a bibliography, a reading list, or citations; I am interested solely in the disciplined conceptual mapping and in the exact points where the analogy succeeds or collapses. Please maintain a formal, analytical tone throughout.
reasoning: |-
  Okay, the user is a retired physicist diving into philosophy, specifically the problem of evidential cooperation in large worlds. They want a comparison between evidential decision theory (EDT) and causal decision theory (CDT) using an analogy from statistical mechanics. The key is to map the ensemble of decision-makers to a system of identical particles with symmetry constraints.

  First, I need to recall the core differences between EDT and CDT. EDT considers the evidence an action provides about outcomes, including correlations with other agents. CDT focuses only on causal consequences. In large worlds with identical agents, EDT often recommends cooperation because one's action indicates others might do the same. CDT ignores such correlations, leading to defection.

  The user wants the analogy to symmetry in statistical mechanics. Global symmetry here would be the indistinguishability of agents, like identical particles. Preserving symmetry means all agents act uniformly—cooperating. Symmetry breaking would be some defecting. 

  For EDT, cooperation maintains global symmetry. Each agent's action correlates with others, so cooperating preserves uniformity. CDT's refusal to cooperate breaks symmetry because it acts locally without considering global correlations. 

  Mapping CDT to a local field constraint: in physics, an external field can break symmetry by affecting particles locally. Similarly, CDT's focus on local causal effects ignores non-local correlations, acting like a local perturbation that forces symmetry breaking. 

  Where might the analogy fail? In physics, symmetry breaking is spontaneous, but in decision theory, it's driven by the decision rule. Also, in quantum mechanics, identical particles are fundamentally indistinguishable, but agents in large worlds are separate entities, even if similar. The user might be testing how far this analogy stretches and where the limitations lie.

  The user's deeper interest could be in understanding if philosophical frameworks can be modeled with physical concepts they're familiar with. They might seek a rigorous, structural comparison to bridge physics and philosophy. Ensuring the analogy is precise without overstretching is crucial. Highlighting where the analogy holds and collapses will satisfy their analytical approach.
answer: |-
  ### Conceptual Mapping: Decision Theory and Statistical Mechanics Analogy

  **Core Elements of the Analogy:**
  1.  **Decision-Making Agents ≡ Identical Particles:** Each agent in the large world ensemble is treated as an identical, indistinguishable particle within a statistical system.
  2.  **Agent Choices ≡ Particle States:** The binary choice (Cooperate/Defect) corresponds to a discrete internal state (e.g., spin orientation).
  3.  **Structural Identity ≡ Global Symmetry:** The identical decision-making structure and environment impose a global symmetry constraint: the system is invariant under permutation of any two agents (particles).
  4.  **Evidential Correlation ≡ Non-Local Correlation:** The expectation that an agent's choice provides evidence about the choices of identical, causally disconnected copies corresponds to non-local quantum entanglement or long-range order in a symmetric phase.

  **Evidential Decision Theory (EDT) as Symmetry Preservation:**
  *   **Cooperation ≡ Symmetric State:** EDT's endorsement of cooperation maps to the system maintaining global symmetry. Cooperating agents occupy identical states (like aligned spins in a ferromagnet below T_c), maximizing indistinguishability. An EDT agent reasons: "My cooperation is evidence my copies exist and likely cooperate, ensuring mutual benefit." This preserves global symmetry by ensuring uniformity across the ensemble – the permutation symmetry is manifest in the identical cooperative state configuration.
  *   **Evidential Weight ≡ Symmetry-Induced Correlation:** The evidential correlation EDT leverages is analogous to the correlation enforced by the global symmetry constraint itself. In the symmetric phase, the state of one particle statistically constrains the state of all others due to the symmetry requirement for uniformity. EDT exploits this inherent statistical correlation inherent in the symmetric description.

  **Causal Decision Theory (CDT) as Symmetry Breaking:**
  *   **Defection ≡ Symmetry-Broken State:** CDT's refusal to cooperate (defection) maps to the system breaking global symmetry. By defecting based solely on local causal efficacy, the agent acts as an individual, distinguishing itself from the ensemble (like a spin flipping against the field). The global permutation symmetry becomes hidden; agents are no longer functionally identical in state.
  *   **Demand for Local Causal Efficacy ≡ Local Field Constraint:** CDT's core tenet – an action is only evaluated by its *causal* consequences within its local light cone – functions precisely as an effective local field breaking the global symmetry. This constraint forces each agent ("particle") to minimize its *local* energy (maximize its *local* payoff) without regard for the symmetry-maintaining correlations. The "local field" is the causal isolation postulate: "My action cannot *cause* copies' actions; therefore, I must optimize only my local outcome." This prohibits the agent from acting based on non-local evidential correlations, just as a local magnetic field prohibits spins from aligning purely via symmetry-induced correlation (demanding alignment with the field instead). Defection becomes the stable local minimum under this field.

  **Points of Analogy Success:**
  1.  **Symmetry Origin:** The global symmetry arises fundamentally from the indistinguishability of agents/particles due to identical structure and environment.
  2.  **Cooperation/Uniformity:** EDT's cooperative equilibrium directly corresponds to the symmetry-preserving, uniform state.
  3.  **Defection/Fragmentation:** CDT's defection equilibrium corresponds to the symmetry-broken state where individuality fragments the ensemble uniformity.
  4.  **Correlation Constraint:** The CDT postulate that local causal efficacy is paramount structurally mirrors the imposition of a local field that disrupts symmetry-induced non-local correlations, forcing a locally optimal but globally sub-optimal (symmetric) state.

  **Points of Analogy Collapse:**
  1.  **Dynamics vs. Statics:** Statistical mechanics typically describes equilibrium states arising from physical laws. Decision theory describes deliberate choices by reasoning agents. The "dynamics" leading to the equilibrium state (agent reasoning vs. physical relaxation) are fundamentally different.
  2.  **Spontaneity:** Symmetry breaking in physics is often spontaneous, arising from instability in the symmetric state. CDT's defection is not spontaneous; it is the direct, deterministic output of a specific decision rule applied locally. The "breaking" is rule-driven, not instability-driven.
  3.  **Information vs. Force:** The evidential correlation in EDT is informational/statistical. The particle correlation in symmetric phases is physical (e.g., quantum entanglement, exchange forces). CDT's local field is a logical constraint, while a magnetic field is a physical force. The analogy maps logical structure, not ontological substance.
  4.  **Indistinguishability Depth:** Fundamental particle indistinguishability is ontological (permutation is not just a symmetry, it's a gauge redundancy). Agent indistinguishability is epistemological and contingent – they *are* distinct spatiotemporal entities, merely identical in structure. This impacts the strength of the symmetry constraint.
  5.  **Single-Agent Focus:** The decision problem centers on the reasoning of a *single* agent within the ensemble. Statistical mechanics typically describes the ensemble as a whole. The analogy requires projecting the ensemble symmetry properties onto the reasoning of one constituent particle/agent.

  **Conclusion:**
  The analogy robustly maps the core structural conflict. EDT exploits the global symmetry constraint inherent in the large-world ensemble description, leading to cooperation – the symmetry-preserving state where non-local evidential correlations are harnessed. CDT, by imposing a demand for strictly local causal efficacy, functions as a symmetry-breaking "local field" constraint. This field forces agents into defection – a symmetry-broken state where local optimization occurs at the expense of global correlations and optimality. The analogy succeeds in highlighting how EDT respects the global symmetry of the ensemble description, while CDT's localism actively breaks it. The collapses primarily concern the origin of dynamics and the nature of the constraints (logical vs. physical), but do not undermine the core structural correspondence between symmetry preservation/breaking and cooperation/defection under the respective decision theories.
