answer: |-
  Alright, let's break down this museum practice and your debate – you've hit on some really core issues in historiography and ethics. Forget the bibliography, we'll talk theory straight up.

  1.  **The Museum Practice & Its Assumptions:**
      *   **Not *Necessarily* Linear Moral Progress:** The plaque saying "outdated and harmful views" **doesn't automatically assume history is a straight line of moral improvement.** What it *definitely* assumes is:
          *   **Shifting Standards:** Moral and ethical standards *change* significantly over time. What was once widely accepted (or imposed by the powerful) is now rejected.
          *   **Contemporary Judgment:** We *can* and *should* apply our *current* understanding of ethics (harm, justice, human rights, equality) to evaluate past beliefs and actions, even if we understand *why* they existed then.
          *   **Harm is Recognizable:** The perspectives depicted in the old exhibit *cause harm in the present* (through perpetuating stereotypes, justifying past oppression, causing offense or pain to descendants of colonized peoples). The museum acknowledges this harm exists *now*.
          *   **Critical Distance:** Historians/museums can achieve enough critical distance to recognize that past views are deeply problematic *by current lights*, even while contextualizing them within their historical moment.
      *   **The "Shock Value" & Internal Tension:** You're absolutely right. This is the **major internal tension**.
          *   **The Power of the Artifact:** Keeping the display "as is" leverages its raw, unvarnished power as evidence. It shows the *actual* propaganda, the *actual* framing, the *actual* dehumanization. This visceral impact is hard to replicate with just text.
          *   **The Risk:** This *does* risk exploiting the offensive content for shock value or spectacle, potentially re-traumatizing affected communities while claiming education. The contextual panel is an attempt to *manage* this risk, but it doesn't erase the inherent tension. Museums walk a tightrope here: preserving evidence of past wrongs vs. perpetuating harm. They generally argue the educational value (exposing the mechanisms of oppression) justifies preservation *with* critical context.

  2.  **Presentism vs. Contextualism:** Your friend argues judging the past by today's morals is arrogant (classic anti-presentism). The museum practice is trying a **balancing act**:
      *   **Anti-Presentism:** They preserve the display to show what people *actually thought/believed then* (contextualism). They don't erase it.
      *   **Critical Presentism:** The plaque explicitly judges those *past* views using *current* ethical standards. They say: "Within *their* context, this was common. Within *our* context, this is harmful and wrong, and here's why."
      *   **Theory?** This leans towards **"Critical Hermeneutics"** or **"Ethical Historicism."** It says: We must *understand* the past in its own context (hermeneutics/historicism), but that understanding doesn't preclude us from making *ethical judgments* about it from our situated position. Knowledge isn't neutral; it carries ethical responsibility.

  3.  **The "Safe Pareto Improvement" Idea - Does it Hold Water?**
      *   **The Claim:** Revising the narrative (adding the plaque) supposedly makes things better (more accurate, less harmful) for everyone ("stakeholders") without making things worse for anyone epistemically.
      *   **Why it Mostly *Doesn't* Fit & Masks Power:**
          *   **Who are the "Stakeholders"?** This framing often assumes a neutral playing field. It doesn't.
          *   **Loss of Narrative Authority:** Groups whose power *depended* on the old narrative (e.g., colonial apologists, those invested in nationalist myths) **absolutely lose epistemic authority and narrative control.** Their version of history is explicitly labeled harmful and outdated. Their claim to "truth" is undermined. This is a *significant* loss for them.
          *   **Gains are Uneven:** The gain for marginalized groups (colonized peoples, targets of racism) is huge: validation of their experience, acknowledgment of harm, a shift towards epistemic justice. The gain for the previously dominant group might be "better understanding" or "less guilt by association," but it's qualitatively different and often involves confronting uncomfortable truths they previously ignored.
          *   **"Epistemically Worse Off"?** The previously dominant group might *feel* worse off because their comfortable narrative is disrupted, but **is their *access to knowledge* actually worse?** Arguably, no. They now have access to a *more complete* picture that includes the harmful impacts of the old views and the perspectives of the marginalized. Their understanding is *improved* (more accurate, less biased), even if it's uncomfortable. The *feeling* of loss is about power and comfort, not pure epistemology.
          *   **The Cover-Up:** Framing it as Pareto improvement **absolutely covers up the power shift.** It presents a revision that challenges dominant narratives as a win-win, ignoring that it inherently involves a *transfer* of epistemic authority and a challenge to established power structures. It pretends there's no conflict where there clearly is.

  **The Bottom Line:**

  *   Museums using disclaimers are **not naively assuming linear progress.** They **are** asserting that our current ethical standards *allow us to identify harmful ideas of the past* and that we have a responsibility to label them as such *while preserving the evidence*.
  *   There **is a real tension** between using the raw artifact (with its shock value) and the goal of ethical education. It's a calculated risk museums take.
  *   The **"Pareto improvement" idea is largely a fallacy** in this context. Revising historical narratives to be more critical and inclusive *fundamentally shifts power and authority*. Groups who benefited from the old, sanitized, or biased narrative *do* lose their privileged position in the story, even if their access to a more truthful account is enhanced. Claiming it's a win-win for all "stakeholders" equally smooths over this crucial, often contentious, redistribution of narrative power and epistemic justice.

  Your instinct about the power dynamics being obscured by the Pareto framing is spot on. History isn't just about adding facts; it's often about contested power over the story itself.
