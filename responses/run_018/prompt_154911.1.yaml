  For P1: The challenge of moral desert requiring persistent personal identity feels substantial. Even secular theories struggle with this - think Parfit's teletransporter thought experiments. But karma's rebirth mechanism compounds this by stretching identity across lifetimes. I'd weight this heavily at 0.85. 

  For P2: The no-self (anatta) contradiction is karma's unique Achilles heel. If there's no enduring "you", how can "you" deserve karmic outcomes? Buddhist compatibilist responses exist (e.g. causal continuum), but the tension remains sharp. This deserves the highest probability - maybe 0.9. 

  For P3: Secular retributivism has well-documented weaknesses (moral luck, state overreach), but they're not necessarily fatal. Alternatives like consequentialism offer patches. This seems less decisive than the other two - perhaps 0.7. 

  Combining these: Multiplying independent probabilities (0.85 * 0.9 * 0.7) gives ~0.54, but since they're somewhat interdependent, I'll adjust downward to 0.45. The user's 0.3 guess was close! 

  The least certain point is P3 because empirical legal systems function despite theoretical flaws. What would change my view? Evidence that retributivism inevitably collapses into injustice across cultures - like comparative studies of punitive systems failing on their own terms. 

