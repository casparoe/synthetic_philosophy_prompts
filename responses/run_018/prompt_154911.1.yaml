  2. prob that karma's anatta/no-self idea makes it self-defeating since theres no stable person to actually deserve the outcome?
  3. prob that secular retributivism fails on its own for reasons like moral luck or the state having no right to inflict harm?

  then combine those into your final number. also tell me which of those three youre least sure about and what kind of argument or evidence would move it the most. fwiw my own guess is around 0.3 but honestly idk lol
