  You are a professional philosopher of religion with expertise in comparative ethics and metaphysics. Approach this task carefully: begin with brief internal brainstorming about the core conceptual tensions, then produce the final document. Write in formal American English, keep the response tightly focused, and do not include citations, bibliographies, reading lists, or references to specific texts or historical figures.

  Draft the joint statement that a committed defender of karma as a literal, metaphysical theory of moral desert (the Karmic Retributivist) and a committed critic who treats moral desert solely as a socially constructed accounting practice with no transpersonal causal force (the Secular Desert Skeptic) could both sign after a good-faith adversarial collaboration.

  Structure your output as follows:

  1. A numbered section of agreed claims—about what karma traditionally asserts, what moral desert conceptually requires, and the empirical or psychological patterns both parties accept without dispute.
  2. A disagreements table with two columns, each phrased so the named party would accept the wording of its own view and the other side would recognize it as accurate, not as a strawman.
  3. The cruxes—identify the precise sub-questions such that settling them would move at least one party. Include, specifically, the crux of whether moral desert can remain coherent at the interface with Buddhist anatta (no enduring self across rebirth), and the crux of whether observed correlations between moral behavior and life outcomes are best explained by a karmic mechanism or by confounding social and psychological variables.
  4. For each crux, describe one concrete hypothetical case or observable pattern both sides agree is genuinely relevant, and record in advance what each side predicts that case or pattern will show.

  Make the formulations precise and avoid vacuous agreement; the point is to separate genuine metaphysical disagreement from verbal confusion. Do not invoke obscure sectarian doctrines that a small model could not be expected to know; rely only on widely understood concepts.
