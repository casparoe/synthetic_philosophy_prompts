prompt: |-
  hey — prepping my grad seminar on moral psych and need a quick sanity check. my colleague dr mara sorts disagreements into "preference" vs "bias" and her calls so far:
  - trolley vs footbridge: prefference, just different weights on direct harm
  - elder-care norms across cultures: prefference
  - a CEO who genuinely thinks shareholder value is teh only moral good, despite knowing climate externalities: bias
  - vaccine refusal grounded in teh false belief that natural immunity is always stronger: bias

  now she's facing a member of a closed religious order who claims only people baptized in their specific rite have full moral standing. she's got a complex theological defense that's internally consistent, doesn't depend on any false empirical claim about biology, but teh boundary tracks her order's membership exactly.

  what do you think mara calls this? i'm less interested in teh answer than in teh rule she's running — correlation with social position, failure of coherence/false belief, or maybe this "normative echoing" idea (a view counts as preference only if an outsider could adopt it without joining the group)? what other rules fit her four verdicts just as well, and what's teh one further case that'd actually tell them apart?
reasoning: |-
  Okay, the user is prepping for a grad seminar on moral psychology and needs a sanity check on their colleague Dr. Mara's framework. Dr. Mara categorizes disagreements into "preference" versus "bias." The examples given are:

  1. Trolley vs. Footbridge: Preference (different weights on direct harm)
  2. Elder-care norms across cultures: Preference
  3. CEO prioritizing shareholder value despite climate externalities: Bias
  4. Vaccine refusal based on false belief about natural immunity: Bias

  Now there's a new case: a member of a closed religious order who believes only those baptized in their specific rite have full moral standing. The theological defense is internally consistent and doesn't rely on false empirical claims, but the boundary aligns exactly with the group's membership.

  The user wants to know what Dr. Mara would call this and is more interested in identifying the underlying rule Mara uses. They mention possible rules like correlation with social position, failure of coherence/false belief, or "normative echoing" (a view is preference only if an outsider could adopt it without joining the group). They also want other rules that fit the initial four cases and a test case to distinguish them.

  First, I need to figure out the pattern in Mara's existing classifications. The trolley problem and elder-care norms are both preference-based. The CEO and vaccine refusal are biases. What's the difference? 

  For the trolley problem, it's a philosophical disagreement about moral principles. Different people weigh factors like direct harm differently, which isn't inherently biased. Similarly, elder-care norms vary by culture, reflecting different values without false beliefs.

  The CEO case involves ignoring climate externalities despite knowing about them. Here, bias might stem from self-interest or ideological blind spots. The CEO's position benefits their role, so social position correlates. Vaccine refusal is based on a false empirical claim, so it's a bias due to factual error.

  So Mara's rule seems to involve false beliefs or social position influencing judgment. But the religious case has no false empirical claims and an internally consistent theology. However, the moral standing boundary matches the group's membership exactly. That seems like social position correlation. 

  Normative echoing is another angle. Could an outsider adopt the trolley position without joining a group? Yes. The elder-care norms? Culturally, outsiders could adopt them by immersing in the culture. The CEO's view? An outsider might adopt shareholder primacy without being a CEO. Vaccine refusal based on false info isn't adoptable without believing the false claim. For the religious view, an outsider couldn't adopt it without being baptized into the group. So normative echoing fits here.

  But social position correlation also fits the CEO and the religious case. The CEO's view benefits their position, and the religious view aligns with group membership. So how to distinguish?

  A test case could be a self-sacrificing bias. For example, a philanthropist who believes only those who donate over 50% of their income deserve full moral standing. This view correlates with their social position (as a donor) and requires joining their group (donating) to adopt. If Mara calls this bias, she's using normative echoing. If preference, maybe coherence/false belief. But the example lacks false beliefs, so if she calls it preference, then her rule isn't just about false beliefs.

  Another test case: a false belief that doesn't align with social position. Like a CEO who believes climate action hurts profits (false) but still values shareholders. If Mara calls this bias due to false belief, then false beliefs are key. If she calls it preference, then social position might matter more.

  The user's deeper need is to understand the implicit rules in Mara's framework to facilitate discussion in the seminar. They want to challenge students to think critically about categorization criteria. Providing test cases that tease apart different rules would help achieve that. They might also want to explore how bias is defined—whether it's about epistemology, social influence, or something else.
answer: |-
  Based on Dr. Mara's pattern, I'd predict she calls the **religious order case a "bias"** – but the *reason* reveals competing possible rules in her framework. Here's the breakdown and how to test it:

  ### Mara's Likely Verdict & Competing Rules
  1.  **Prediction: BIAS**
      *   **Why?** The key feature is the **perfect correlation between the moral boundary and the agent's social identity/group membership**. This mirrors the CEO case (benefit aligns with role) and contrasts with the "preference" cases where views aren't tied to *who you are* specifically (anyone can weigh harm aversion differently, anyone can adopt different elder-care norms culturally).

  2.  **Competing Rules Explaining Her Pattern:**
      *   **Rule A: Social Position Correlation (SPC):** A view is likely "bias" if the *moral conclusion directly benefits or exclusively aligns with the agent's own social position, identity, or group membership.*
          *   *Fits All Cases:* CEO (benefits role), Vaccine Refusal (often correlates with in-group identity/politics), Religious Order (defines in-group superiority). Trolley/Elder-care lack this tight self-referential link.
      *   **Rule B: Normative Echoing (NE):** A view counts as "preference" *only if an outsider could sincerely adopt the normative principle without needing to join the agent's specific social group or adopt their specific identity.* "Bias" occurs when adoption *requires* joining the group.
          *   *Fits All Cases:* Trolley (outsider can adopt principle), Elder-care (outsider can adopt norm via cultural immersion). CEO (outsider *can* adopt shareholder primacy w/o being CEO), Vaccine Refusal (outsider *can* adopt false belief w/o specific identity). **Religious Order:** An outsider *cannot* adopt the principle ("only *our* baptized have standing") without *being* baptized into *that* group. Hence, bias.
      *   **Rule C: Failure of Coherence / Reliance on False Belief (FC/FB):** "Bias" requires either *internal inconsistency* or *reliance on a demonstrably false empirical belief*. "Preference" is coherent and factually possible.
          *   *Fits Most Cases:* Vaccine (false belief), Trolley/Elder-care (coherent & factually possible). **Problem:** CEO and Religious Order cases *pass this test* (internally consistent, no *stated* false biology). This rule **doesn't fit the CEO verdict** (she called it bias despite coherence/lack of explicit false biology). Mara likely uses more than just FC/FB.

  ### Which Rule is Strongest?
  *   **SPC and NE both fit the existing 4 cases perfectly.**
  *   **FC/FB fails because the CEO case is called "bias" without relying on false belief or incoherence.** (Mara likely sees the *ignoring of externalities despite knowledge* as a motivated blind spot linked to position, not a factual error *per se*).

  ### The Crucial Test Case to Distinguish SPC vs. NE
  We need a case where the view **correlates perfectly with social position (suggesting SPC=Bias) BUT an outsider could adopt the principle without joining the group (suggesting NE=Preference).**

  **The Test Case: The Self-Sacrificing Philanthropist**
  > *A wealthy philanthropist believes that "only individuals who donate >50% of their income to effective charities deserve full moral standing." They live by this principle, donating >50% themselves. Their defense is philosophically coherent (prioritizing radical altruism) and doesn't rely on false empirical claims. The boundary perfectly tracks their own actions/identity.*

  *   **How SPC Predicts:** **BIAS.** The moral rule directly justifies the agent's *own* elite status ("deserving") based on their *specific action* (donating >50%), which they perform. Perfect social position correlation.
  *   **How NE Predicts:** **PREFERENCE.** An outsider *could* sincerely adopt the principle "only those who donate >50% deserve full standing" *without* being wealthy or having donated yet. They could adopt the *norm* and strive to meet it (or judge others by it) without *being* part of the philanthropist's specific "group" (which might not even exist as a formal group). Adoption doesn't *require* joining; it requires *action* anyone *could* theoretically take (even if hard).
  *   **How Mara Would Decide Reveals Her Rule:**
      *   If Mara calls this **Bias**, she's likely using **Social Position Correlation (SPC)** as her core rule. The self-referential justification is key.
      *   If Mara calls this a **Preference**, she's likely using **Normative Echoing (NE)** as her core rule. The principle is adoptable in the abstract.

  ### Why This Test Case Works
  It directly pits the core mechanisms of SPC (self-referential justification/benefit) against NE (abstract adoptability) while satisfying the coherence/factual accuracy condition present in the religious case. It isolates the feature that makes the religious case seem like "bias" (it's *about us*) from the feature that might make it seem like a "preference" (it's a coherent normative view).

  **For your seminar:** Present the religious case and the philanthropist case. Ask students to predict Mara's call on *both* using SPC and NE. The disagreement will highlight the subtle but crucial difference between a view being *in-group serving* (SPC) vs. being *in-group defined* (NE). This gets to the heart of what makes a moral view "biased" – is it the *origin/social function* or the *structure/adoptability*?
