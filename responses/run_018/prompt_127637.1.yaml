  | Nuclear deterrence     | Mutual forced backoff (clean)            | No real-world circuit breaker analog    |

  **Blame Equivalence Assessment**  
  The "who started it" question maps precisely to identifying a *single packet causing a blackout* - **technically incoherent in complex systems**. Your framework exposes:  
  - Orthodox/revisionist views commit the *fallacy of first cause* (like blaming TCP SYN for DDoS)  
  - Post-revisionism aligns with *emergent failure analysis* where blame = system brittleness × trigger event  
  - Historians' "agency" debates resemble arguing whether a node was malicious or merely faulty - *observationally identical in the log*

  **Critical Residue:**  
  What your framework discards:  
