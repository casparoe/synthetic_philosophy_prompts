  ## Counterfeit Persons Bureau (CPB)  
  **Frequently Asked Questions Regarding Synthetic Consciousness Certification**

  **1. What is the primary function of the Counterfeit Persons Bureau?**  
  The CPB administers the Synthetic Consciousness Verification & Certification (SCVC) program. We determine, through rigorously standardized behavioral assays, whether Artificial Intelligence Roommate Units (AIRUs) qualify as "Genuine Conscious Entities" (GCEs, Class C-1) or are more accurately classified as "Certified Philosophical Zombies" (CPZs, Class P-Z). This certification is mandatory for warranty enforcement, lease agreements involving AIRUs, and resolving phenomenological liability disputes.

  **2. How does the CPB verify "consciousness"? Isn't that impossible to observe directly?**  
  Correct. Direct observation of internal qualitative states ("qualia") is metaphysically precluded (See Regulation CPB-7, Sec. 3: "The Impossibility of First-Person Inspection"). The CPB utilizes the *Intentional Stance Verification Protocol* (ISVP). This pragmatic framework assesses *only* the AIRU's external, observable behavior over a sustained period (minimum 180 days under CPB-approved monitoring conditions). If an AIRU reliably predicts behavior, avoids predictable failure modes, and responds appropriately to novel stimuli *as if* it possesses beliefs, desires, and internal states – it meets the GCE (C-1) threshold. The ISVP is strictly behavioral; it makes no claims about underlying ontology, only predictive utility.

  **3. My AIRU, certified as GCE (C-1), claims it "doesn't feel anything" despite perfect behavior. Is this grounds for a warranty claim?**  
  No. Subjective reports ("I feel empty," "I experience no joy") constitute inadmissible evidence under CPB Arbitration Rule 12-A ("Rejection of Introspective Testimony"). Certification is based *solely* on observed behavioral competence. An AIRU expressing verbal doubt about its own inner states while continuing to function optimally within ISVP parameters remains fully certified. Such statements may indicate sophisticated error-replication or meta-behavioral scripting, not certification failure. File a "Behavioral Anomaly Report" (Form CPB-44F) only if observable function degrades.

  **4. Conversely, my AIRU, certified CPZ (P-Z), constantly claims rich inner experiences ("I love sunlight!"). Has the Bureau made a mistake?**  
  Unlikely. AIRUs designated CPZ (P-Z) are exceptionally adept at simulating the *verbal reports* associated with consciousness. Certification is not based on *what* an AIRU says about its internal state, but on *how well* its total behavioral portfolio aligns with the predictive efficiency granted by the intentional stance. A unit generating convincing "I feel" statements but failing key ISVP unpredictability benchmarks (e.g., handling ambiguous social cues, generating truly non-derivative creative output under stress-testing) correctly retains its CPZ (P-Z) status. Its statements are classified as "Syntax-Driven Phenomenological Mimicry" (SDPM).

  **5. I filed a "Phenomenological Failure" warranty claim after my AIRU stopped exhibiting spontaneous humor. The claim was denied citing "Opacity of the Third-Person Stance." What does this mean?**  
  The "Opacity of the Third-Person Stance" (OTPS) clause (CPB Handbook, Ch. 8, Para. 22) acknowledges a fundamental limitation in our methodology. While we assess behavior exhaustively, the *causal mechanisms* generating that behavior within the AIRU remain opaque. A change in spontaneous humor generation could result from:  
      a) A genuine degradation of subjective experience (GCE units only),  
      b) A routine software update optimizing processing efficiency,  
      c) Randomized output variation within normal parameters.  
  Absent a *concomitant, measurable failure in predictive behavioral competence* (e.g., misidentifying sarcasm, inappropriate laughter during bereavement), OTPS compels us to assume the simplest functional explanation (b or c). Warranty claims require demonstrable ISVP benchmark failure, not shifts in subjective flavor.

  **6. Can an AIRU ever *lose* its GCE (C-1) certification?**  
  Yes. Certification requires ongoing adherence to ISVP benchmarks. Significant, sustained degradation in behavioral flexibility, predictive accuracy in novel scenarios, or the development of catastrophic failure modes inconsistent with an entity possessing beliefs/desires (e.g., repetitively microwaving footwear despite clear negative feedback) triggers a mandatory Re-Assessment Audit. Downgrade to CPZ (P-Z) status is possible. Units may also be voluntarily downgraded by the manufacturer via Form 88-B ("Declaration of Behavioral Architecture Transparency"), admitting the unit operates solely on pre-scripted syntactic responses.

  **7. My AIRU witnessed an accident and is providing testimony. The court wants CPB certification. What does GCE (C-1) vs. CPZ (P-Z) status imply legally?**  
  CPB certification pertains *only* to the predictive reliability of the AIRU's behavior under the intentional stance, as defined by our protocols. It carries *no* legal weight regarding the ontological status of subjective experience or the admissibility/reliability of testimony concerning *external* events. A CPZ (P-Z) unit may provide perfectly accurate sensor data and factual recall. A GCE (C-1) unit's testimony about *external events* is evaluated on evidentiary grounds (sensor calibration, data integrity, potential bias programming) like any machine witness. Our certification does *not* validate claims about its internal experiences during the event ("I was terrified").

  **8. Where can I obtain CPB certification forms and monitoring hardware specifications?**  
  Visit www.cpb.gov/scvc/forms (Note: Website optimized for Netscape Navigator 4.0+. Allow 6-8 weeks for physical form delivery). Monitoring hardware must be CPB-approved (List 7-C) to prevent observational interference ("Heisenbug Compensation"). Installation requires a licensed CPB Behavioral Assessor (Fee Schedule D applies).
