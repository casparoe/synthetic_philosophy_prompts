  I should emphasize that non-human agency in historical writing doesn't erase human responsibility. Rather, it acknowledges that humans operate within material constraints. The Little Ice Age didn't cause the Ming collapse; it interacted with specific policy failures. Maybe the user worries this framing lets decision-makers off the hook? But actually, highlighting environmental pressures can underscore the importance of human adaptation choices.

  The policy angle intrigues me most. If we seriously treat pathogens as "actors," does that change how we fund public health? Perhaps it justifies pre-emptive measures even without human "villains." The user's closing question about coherent causation theories is spot-on - we might need to articulate layered models where systemic forces set the stage for accountable human actions.

  This deserves a response that maps the linguistic pattern to philosophical frameworks (actor-network theory?), examines the agency paradox, and tackles the litigation inconsistency head-on. The user seems ready for nuanced discussion - no dumbing down. I'll structure it around their three core questions while preserving their brilliant observation about museum plaques and WHO reports as cultural evidence of this narrative tendency.
answer: |-
  Your observation cuts to the heart of historiography, philosophy of science, and environmental ethics. This linguistic pattern reflects a **complex, layered theory of causation that blends material determinism, emergent agency, and narrative pragmatism—but it's not philosophically consistent, and its moral/political consequences are significant.** Let's break it down:

  ### 1. **The Theory of Agency/Causation Presupposed**
      - **Non-Human Actants (Not Agents):** This practice aligns with **Actor-Network Theory (ANT)** and **New Materialism**. These frameworks reject the human/non-human binary, treating entities like microbes, climate systems, or volcanoes as **"actants"** — entities with the *capacity to produce effects* within a network, regardless of intentionality. A virus *acts* by replicating; a drought *acts* by desiccating soil.
      - **Emergent Causation:** Historical events emerge from **reciprocal relationships** between human and non-human forces. Ming grain reserves weren't destabilized *by* the Little Ice Age alone, but by the *interaction* of climate shifts with agricultural practices, tax systems, and political decisions. The language reflects this entanglement.
      - **Narrative Pragmatism:** Humans think in stories. Assigning verbs to non-humans ("cholera reshaped") is a *narrative shortcut* to convey complex causality. It’s more engaging than passive constructions ("sewage laws were reshaped due to cholera outbreaks caused by...") and highlights the *force* of material realities.

  ### 2. **Does it Erase Human Agency? Not Necessarily, But It Complicates It**
      - **Against Epiphenomenalism:** This language *doesn’t* make humans passive. Rather, it shows humans responding to *forceful material pressures*. "Cholera reshaped sewage law" implies humans *recognized the threat* and *chose to act*. Agency is relocated to the *interface* between environment and society.
      - **Distributed Agency:** Agency isn’t binary (human = agent; environment = backdrop). It’s distributed across networks. A virus has *causal efficacy*; humans have *interpretive and responsive agency*. The Ming Dynasty *could* have stored more grain or diversified crops—its failure to adapt is agential, even if triggered by frost.
      - **Risk:** The danger is **asymmetry**. We rarely say "Ming bureaucrats *invited* collapse by ignoring early frost warnings." Non-human actants get vivid verbs ("ravaged," "triggered"), while human institutions get weaker ones ("responded," "adapted"). This can subtly downplay human culpability and foresight.

  ### 3. **Moral/Political Responsibility: The Core Tension**
      Here’s where the inconsistency you noted becomes critical:
      - **In Science/History:** Using "climate change caused X" is shorthand for **probabilistic, systemic causation**. It answers: "Would this heatwave/famine/extinction likely occur without anthropogenic forcing?" Agency is *explanatory*, not moral.
      - **In Law/Policy:** Responsibility requires **proximate, intentional, or negligent human action**. Courts ask: "Which *specific* entities (states, corporations) contributed foreseeably to harm, and could have acted otherwise?" Agency is *culpable*.
      - **The Double Standard:** It’s **ad hoc, not coherent**. We toggle between:
        - **Systemic Agency** ("Climate change drowned your city") for *attribution science*.
        - **Reductionist Agency** ("Exxon’s emissions contributed 0.3% to the storm") for *litigation*.
      This serves practical needs (science needs holistic models; law needs assignable blame) but masks a philosophical rift.

  ### 4. **What Would Change If We Took Non-Human Agency Seriously?**
      - **Policy as Co-Adaptation:** Public health wouldn’t just "fight germs" but negotiate with microbial evolution. Climate policy wouldn’t just "cut emissions" but manage *ongoing, agentic Earth systems* (e.g., "How do we live with intensified hydrological cycles?").
      - **Moral Consideration Expansion:** If actants have causal power, do they deserve *moral consideration*? (e.g., Rivers in legal personhood frameworks). This challenges anthropocentrism but risks diffusing human responsibility.
      - **Responsibility Reframed:** Culpability shifts from *solely causing harm* to **foreseeable failure to adapt/resiliently co-evolve**. Exxon isn’t (just) "causing sea-level rise" but **"negligently failing to safeguard society against predictable climate actancy."**
      - **Litigation Evolution:** Courts might accept **probabilistic causation** (as in some toxic tort cases) rather than demanding direct traceability. "Climate change" could be a legally recognized *force majeure* with human amplifiers.

  ### 5. **Toward Consistency? A Framework for "Stratified Agency"**
      A coherent approach might distinguish:
      | **Level**          | **Agency Type**       | **Question Addressed**               | **Responsibility Frame**               |
      |--------------------|-----------------------|--------------------------------------|----------------------------------------|
      | **Material**       | Non-Human Actancy     | What forces exerted pressure?        | Adaptation obligation                  |
      | **Systemic**       | Networked Emergence  | How did interactions produce harm?   | Institutional redesign                 |
      | **Intentional**    | Human Culpability     | Who acted negligently/maliciously?   | Legal liability, reparations           |

  ### Why This Matters
  The language you’ve spotted isn’t just stylistic—it’s a **metaphysical choice** with real-world stakes. Treating non-humans as actants:
  - **Empowers** better science/history by capturing complex causality.
  - **Endangers** by potentially obscuring human power asymmetries (e.g., fossil fuel lobbying) behind a veil of "natural" forces.
  - **Demands** new ethical frameworks where responsibility isn’t binary ("who dunnit?") but stratified ("how do we distribute duties in a more-than-human world?").

  **In essence: The writing practice presupposes a *relational ontology* but operates within a *juridical individualism*. Bridging this gap is the critical task for policy—recognizing that while viruses and volcanoes act, only humans can be *responsible*.** The challenge is designing systems where that responsibility matches the scale of the actants we engage.
