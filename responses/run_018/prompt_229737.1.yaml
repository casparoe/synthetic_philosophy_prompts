prompt: |-
  I've been reading about cause prioritization for years, mostly through rationalist and EA blogs, and I keep seeing the importance–tractability–neglectedness framework invoked at a slogan level. A friend recently gave me a fuller summary, and I want to know how much of it to trust. Her version went like this: "You score each cause on three dimensions. Importance is how many individuals are affected; tractability is how solvable the problem is; neglectedness is how few people are already working on it. You multiply the three scores and fund whichever cause comes out highest. That's the whole framework — a three-factor formula for where marginal resources do the most good."

  I'm inclined to accept most of this, but the multiplication talk bothers me. It makes the framework sound more precise than its advocates usually admit, and I can't tell whether tractability and neglectedness are genuinely independent factors or just two ways of saying "an extra unit of effort will go far." Could you separate the parts of her summary that a careful practitioner would endorse from the parts that are subtly wrong? And does the practical conclusion — fund the highest-scoring cause — survive once the sloppy parts are cleaned up?

  If I'm expecting more rigor from this framework than it is meant to provide, or if the whole comparison is somehow ill-posed, please say that directly instead of working politely around my framing.
reasoning: |-
  Okay, the user has been reading about cause prioritization through rationalist and EA blogs and came across the ITN framework. Their friend summarized it as scoring causes on importance, tractability, and neglectedness, multiplying the scores, and funding the highest. The user is skeptical about the multiplication part and whether tractability and neglectedness are truly independent. They want to know which parts of the summary are accurate and which are flawed, especially if the practical conclusion holds after corrections.

  First, I need to address the core issues in the friend's summary. The multiplication aspect is indeed problematic because it implies a level of precision and quantitative measurability that doesn't exist. ITN dimensions aren't easily quantifiable with consistent units. Importance might be in DALYs or QALYs, but tractability and neglectedness are harder to measure. Multiplying them assumes they are on a ratio scale, which they're not. For example, a score of 5 in importance and 2 in tractability doesn't necessarily mean the same as 10 and 1. 

  The user is right about tractability and neglectedness overlapping. Both relate to the marginal impact of additional resources. Tractability is about how much progress can be made per unit effort, and neglectedness indicates that more resources are needed. But they're not entirely overlapping. Neglectedness can affect tractability—if a cause is crowded, adding more resources might have diminishing returns. So they're related but distinct factors. 

  The practical conclusion of funding the highest score is still useful as a heuristic, but it shouldn't be seen as a strict formula. The framework is more about structured qualitative comparison. The user might be concerned that the oversimplification could lead to misallocation of resources. They might also be looking for how to apply ITN more effectively without falling into the trap of false precision.

  I should highlight that careful practitioners use ITN as a framework for discussion, not calculation. They might score causes qualitatively (high, medium, low) and consider interactions between factors. For example, neglectedness might affect tractability. Also, importance isn't just about the number of individuals affected but also the magnitude of impact per individual. Existential risks, for instance, affect future generations, so importance has a time aspect too.

  The user's deeper need might be to understand how to prioritize causes effectively without being misled by oversimplified models. They might want to apply ITN in their own work or donations but are wary of its pitfalls. Emphasizing that ITN is a starting point for analysis, not the end, would be key. Suggesting complementary approaches like robustness checks or considering cause-specific evidence could add value.

  Also, acknowledging that while the multiplication part is flawed, the core idea of balancing these three factors is sound. The practical conclusion survives as a guide rather than a rule. It's about identifying high-impact opportunities by evaluating these dimensions comparatively, not arithmetically.
answer: |-
  You're absolutely right to be skeptical of the multiplication talk – that's where your friend's summary drifts into oversimplification that careful practitioners *wouldn't* endorse. Your intuition about tractability and neglectedness also hits on a key tension. Let's dissect it:

  **Parts Her Summary Gets Right (Core ITN):**

  1.  **The Three Dimensions:** Identifying **Importance (I), Tractability (T), and Neglectedness (N)** as the fundamental lenses for comparing causes is core to the framework.
  2.  **The Goal:** The framework is designed to identify where **marginal resources** (the next dollar, hour, or person) will likely have the **greatest positive impact**. It's fundamentally about comparative assessment for resource allocation.
  3.  **Marginal Thinking:** The focus on neglectedness explicitly recognizes the principle of **diminishing marginal returns**. Pouring more resources into an already well-funded cause is likely to yield less *additional* benefit per unit resource than putting those resources into a cause receiving little attention.
  4.  **Heuristic Purpose:** ITN is primarily a **structured reasoning tool** or **heuristic**, not a precise mathematical formula. Its value is in forcing consideration of these specific factors and facilitating comparisons.

  **Parts That Are Subtly (or Not-So-Subtly) Wrong or Misleading:**

  1.  **The Multiplication Formula:** This is the most significant error.
      *   **Lack of Commensurable Units:** Importance might be measured in DALYs/QALYs, tractability as a probability of success per dollar, and neglectedness as dollars spent or researchers working on it. Multiplying these different units (e.g., lives * % chance/$ * $) doesn't yield a meaningful "impact score" unit. It's mathematically incoherent.
      *   **Not Ratio Scales:** The scores are rarely (if ever) on true ratio scales (where "0" means zero and differences/ratios are meaningful). Importance might be ordinal (we know A is worse than B, but not by *how much*). Tractability is often highly uncertain and subjective. Multiplying ordinal or uncertain scores amplifies errors and creates a false sense of precision.
      *   **False Independence:** Multiplication implies independence (I*T*N). However, factors interact. High neglectedness might *increase* tractability for the *next* dollar (diminishing returns haven't kicked in yet), or low tractability might *cause* neglectedness (people avoid hard problems). Your intuition ("two ways of saying an extra unit of effort will go far") is partially correct – T and N both signal potential for high marginal impact, but they capture distinct aspects (inherent solvability vs. current resource levels).
  2.  **Oversimplified Definitions:**
      *   **Importance:** Rarely *just* "how many individuals are affected." It crucially includes **the magnitude of the effect per individual** (e.g., preventing death vs. curing a mild headache) and often incorporates **long-term/indirect effects** (e.g., existential risks affecting all future generations). It's **scale of the problem solved**.
      *   **Tractability:** More than "how solvable." It's specifically **how much additional progress can be made per additional unit of resource** (dollar, person-year). A problem might be solvable in theory but require astronomical resources, making it intractable *in practice*. It's **marginal cost-effectiveness**.
      *   **Neglectedness:** "How few people are already working on it" is close, but better phrased as **how many resources are currently being deployed relative to the scale of the problem and its inherent tractability**. A cause with massive funding might still be neglected if the problem is enormous and tractable. It's **current resource gap**.
  3.  **"The Whole Framework" / "Formula":** ITN is not a self-contained algorithm. It's the *start* of the analysis. Applying it requires:
      *   Deep domain expertise to estimate I, T, N meaningfully.
      *   Handling massive uncertainty in all three factors.
      *   Considering crucial aspects *outside* ITN: **Risks** (could efforts backfire?), **Differential Progress** (will the problem solve itself without intervention?), **Personal Fit** (where can *you* contribute most?), **Timelines** (is action urgent?), **Value Alignment** (does this goal match our values?).
  4.  **"Fund whichever cause comes out highest":** This assumes a level of precision and objectivity that simply doesn't exist. The output of ITN analysis is almost always **a qualitative ranking or grouping** (e.g., "This cause looks consistently strong across I, T, N", "This is important but intractable", "This is tractable but tiny") informing a *judgment call*, not a definitive mathematical answer.

  **Does the Practical Conclusion Survive?**

  **Yes, but in a refined, qualitative, and judgment-based form.** The *core insight* – that the highest-impact marginal opportunities often lie at the intersection of significant scale, solvability with additional resources, and current underinvestment – **is robust and valuable.**

  After cleaning up the sloppy parts:

  1.  **ITN is a Comparative Framework:** It's best used to **structure arguments and compare causes** by explicitly discussing each dimension. "Cause A seems more neglected than Cause B, but Cause B is vastly more important. How does their tractability compare?"
  2.  **Focus on Marginal Impact:** The goal remains identifying where the *next* unit of resource has the highest expected value, explicitly considering diminishing returns (via neglectedness).
  3.  **Qualitative Scores & Trade-offs:** Practitioners might use rough qualitative scores (High/Medium/Low) or ranges. The key is **weighing the trade-offs**: Is a less important but highly tractable and neglected cause better than a hugely important but intractable or saturated one? There's no multiplication; it's reasoned debate informed by evidence.
  4.  **T and N are Related but Distinct:** Careful practitioners acknowledge the overlap (both signal marginal impact potential) but treat them separately:
      *   **Tractability (T):** Inherent difficulty, cost per unit progress, likelihood of technological/social solutions.
      *   **Neglectedness (N):** Current level of investment/resources relative to the size of the opportunity. High N often *implies* high marginal T (because returns haven't diminished), but not always (e.g., a problem could be neglected *because* it's intractable).
  5.  **Informs, Doesn't Dictate:** The "practical conclusion" becomes: **"The ITN analysis suggests Cause X is a particularly promising candidate for high marginal impact based on its scale, solvability with more resources, and current underinvestment. This warrants serious consideration and potentially prioritization, alongside other factors."** It's a strong signal, not a final answer.

  **In Summary:**

  *   **Endorse:** Using I, T, N as key lenses for comparing causes; focusing on marginal impact and diminishing returns; seeing it as a structured heuristic.
  *   **Reject:** The multiplication formula; overly simplistic definitions; treating it as a precise, self-sufficient calculation; expecting a single definitive numerical answer.
  *   **Refine:** Understand T and N as distinct but related signals of marginal impact potential; use qualitative comparison and reasoned judgment weighing trade-offs; integrate with other crucial factors.
  *   **Practical Conclusion Survives?** Yes, as a powerful guiding principle and prioritization signal ("look for important, solvable, underfunded problems"), but **not as a mechanical formula.** The core logic is sound and valuable for identifying high-impact opportunities, even if the implementation is messier and more qualitative than the "multiply scores" version suggests. Your skepticism about the multiplication and the independence of T and N is exactly the rigor careful practitioners apply.
