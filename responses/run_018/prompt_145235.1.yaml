  Anti-reductionists insist that adaptation to novelty isn't captured by propositions, even with context. Reductionists think including indexical and procedural elements suffices. The disagreement hinges on whether the ability to handle novel situations is something beyond propositions. 

  Neuroscience shows that skills involve both declarative and procedural memory, but this doesn't resolve the debate because both can interpret the same data differently. The user points out that neither side can cite a decisive experiment. That suggests the issue isn't empirical but conceptual or methodological. 

  Bedrock intuitions play a role too. Reductionists prioritize unity in cognition, while anti-reductionists see a categorical difference. These intuitions might be axiomatic, leading to circular arguments. 

