answer: |-
  This impasse represents a **substantive but non-empirical disagreement about the norms of explanation in cognitive science**, deeply entangled with **metaphysical intuitions about the architecture of mind** and **bedrock commitments to the unity (or duality) of mental phenomena**. It is *not* merely verbal, nor is it resolvable by current empirical findings alone. Here's a breakdown:

  1.  **Beyond Verbal Dispute:** Both sides agree on the empirical phenomena (neural correlates, degrees of articulation, behavioral profiles). The dispute isn't about *whether* experts use propositions/procedures or *whether* adaptation occurs. It's about the *sufficiency* of the propositional-procedural model to constitute the *essence* of know-how. Calling it "knowledge" isn't merely honorific; it's a claim about the ontological and explanatory category this competence belongs to.

  2.  **Core: Norms of Explanatory Completeness:** The fundamental rift concerns **what counts as a complete explanation of intelligent action**:
      *   **Reductionists:** Operate with a **closure principle**: If a phenomenon (adaptive skill) can be *fully described, predicted, and causally explained* using a framework combining propositional representations (facts, rules, goals) and procedural schemas (execution routines, context-indexing), then no further ontological category ("know-how") is needed. The *description* constitutes the *explanation*.
      *   **Anti-Reductionists:** Operate with an **explanatory gap intuition**: Even the most elaborate propositional-procedural description is an *external specification* of the structures *used by* the skill. The *possession* and *deployment* of that structure – the *ability to fluently, context-sensitively, and adaptively apply it* – constitutes an irreducible practical capacity. The description *specifies what is known*, but the *knowing how to use it* remains unexplained. For them, explanatory completeness requires acknowledging this distinct *mode of cognitive access/engagement*.

  3.  **Metaphysical Underpinnings:** This explanatory norm clash reflects deeper ontological intuitions:
      *   **Reductionists (Monist/Propositional Primacy):** Hold that propositional attitudes (beliefs, desires) are the fundamental building blocks of the mental. Abilities are complex states *constructed from* these attitudes plus functional/architectural properties of the cognitive system (memory, indexing, processing speed). Practical "grasp" is an emergent property of this complex system, not a primitive.
      *   **Anti-Reductionists (Dualist/Capacity Primacy):** Maintain that practical capacities represent a fundamental *mode* of cognitive relation to the world, as basic as propositional attitudes. This "grasp" is constitutive of intelligent agency itself and cannot be decomposed without explanatory loss. It requires its own ontological category (e.g., a non-representational disposition, a sui generis intentional mode).

  4.  **Bedrock Intuitions:** Ultimately, the disagreement rests on conflicting, pre-theoretical intuitions:
      *   **Reductionist Intuition:** "Any intelligent action must, in principle, be traceable to the agent's beliefs (propositional knowledge) and goals, processed according to rules/routines the system follows. Novel adaptation is just complex rule application + pattern matching." (Unifying intuition)
      *   **Anti-Reductionist Intuition:** "No amount of 'knowing-that' *about* swimming or speaking French can substitute for the embodied, situated *ability* to swim or speak French fluently, especially when things go unexpectedly wrong. The ability *itself* is the core phenomenon." (Distinctness intuition)
      *   **The Circularity Trap:** Defending either intuition typically involves presupposing the very explanatory norms or ontological categories under dispute, leading to charges of begging the question.

  **Why the Impasse? The Limits of Current Resolution Strategies**

  *   **Conceptual Distinction:** Existing distinctions (procedural/declarative, implicit/explicit) are already incorporated into both frameworks. Creating a new "know-how" *category* won't resolve the dispute over whether it's *irreducible*.
  *   **Empirical Finding:** Neuroscience identifies brain areas and processes correlated with skill, but cannot adjudicate whether activity in (e.g.) basal ganglia circuits implementing procedural schemas *constitutes* know-how or merely *implements* a system possessing irreducible practical grasp. Brain data underdetermines the philosophical interpretation. Novel perturbation experiments reveal *that* experts adapt, but not *whether* that adaptation is best explained by complex rule application or irreducible grasp.
  *   **Formal Result:** Computational modeling can simulate expert behavior, including adaptation, using propositional rules and procedures. Anti-reductionists will argue the simulation possesses the *description* but lacks the genuine *grasp*. The Chinese Room argument looms large here. Modeling hasn't (and arguably cannot) bridge this gap in interpretation.

  **Reframing the Question: Beyond the Binary**

  The impasse suggests the original question ("Is know-how *distinct from* know-that?") is indeed ill-posed. It forces a binary choice where the reality is likely more complex and layered. A more productive reframing shifts focus:

  *   **From Ontology to Architecture & Control:** Instead of asking "*Is* there a distinct category?", ask: "**What are the specific cognitive/computational *architectures* and *control mechanisms* that enable robust, adaptive skill execution, particularly in response to genuine novelty? How do propositional knowledge, procedural routines, sensorimotor couplings, predictive models, and attentional resources *interact dynamically* to generate flexible intelligent action?**"
      *   This focuses on *how* the system works rather than *what* fundamental category it belongs to.
      *   It acknowledges the *multi-component* nature of expertise without pre-judging the reducibility of the whole.
      *   It makes the "novel perturbation" challenge central and empirically tractable.

  *   **From Reduction to Constraint:** Instead of asking "Can X be *reduced to* Y?", ask: "**What *constraints* does the phenomenon of robust, adaptive skill place on cognitive/computational theories? What minimal architecture and representational/computational resources are *necessary* to account for the observed flexibility?**"
      *   This avoids the all-or-nothing reduction debate.
      *   It allows for the possibility that hybrid models (combining symbolic, subsymbolic, embodied elements) might be necessary, without requiring a single "fundamental" layer.

  *   **From Knowledge to Performance:** Shift the explanandum from "knowledge" (a state) to "skilled performance" (a dynamic process): "**How do cognitive systems achieve real-time, context-sensitive, robust control of action in complex domains, especially under unpredicted conditions?**"
      *   This is more directly tied to observable phenomena.
      *   It naturally incorporates embodied, embedded, and extended cognition perspectives.

  **Conclusion:** The dispute is primarily a **clash of explanatory paradigms** rooted in **fundamental intuitions about mental ontology**. Neither conceptual distinctions nor current empirical findings can resolve it because the disagreement lies in the *interpretation* of the data and the *standards* for a complete explanation. The impasse signals the need to move beyond the binary "distinct or reducible?" question. Reframing the inquiry towards understanding the **dynamic architectures and control mechanisms enabling robust adaptive performance** offers a more fruitful path forward, integrating empirical research (especially on novelty response) with theoretical modeling, without getting bogged down in unresolvable ontological disputes. The focus shifts from *categorizing* know-how to *explaining* how the cognitive system *does* what it does so well.
