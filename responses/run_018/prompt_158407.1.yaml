  The rain drummed a steady, damp rhythm on the tarpaulin stretched over Marnie’s field tent. Inside, the air hung thick with the smell of wet canvas, mildew, and the sharp tang of the preservative she used on the ceramic sherds spread across her folding table. Six months. Six months of painstaking work in this muddy valley, coaxing meaning from the silent earth and the hesitant words of her primary informant, Old Kael.

  Her table was a mosaic of meticulous order. Cardboard trays held sherds grouped by her latest hypothesis: **Surface Treatment**. One tray: *Incised – Geometric*. Another: *Incised – Organic*. *Polished – Red Slip*. *Polished – Black Slip*. *Rough – Untreated*. Beside each tray sat her field notebook, pages warped with humidity, filled with dense script, sketches, and increasingly convoluted flowcharts.

  "Alright Kael," Marnie sighed, pushing her glasses up her nose. Her fingers, stained with clay dust and ink, shuffled the trays. "Show me again. Which ones belong together? Which ones *don't*?" She pointed to a polished black-slip bowl rim and a rough, untreated jar handle – her current outliers.

  Old Kael, his face a map of wrinkles under a worn wool cap, squinted. He picked up the polished rim, then a seemingly random incised sherd with a wavy line pattern from the 'Organic' tray. He set them together. "These, *kala*," he murmured. Then, he picked up the rough jar handle and placed it next to a different incised sherd, this one geometric. "These, *kala*." He pushed away a perfectly nice polished red-slip sherd. "*Na kala*."

  Marnie felt the familiar prickle of frustration mixed with exhaustion. It was always like this. Patterns seemed to emerge – maybe it *was* about the precision of the incision, or the depth? – only to dissolve the next day when Kael grouped a polished piece with a rough one, or split apart two sherds that looked identical to her.

  "*Kala*... *Na kala*..." she muttered, tapping her pen. Good. Not good. The only constants. She’d mapped everything: clay composition (all local), temper types (limited variation), vessel form (too fragmented to be reliable), decorative motifs (overlapping messily across her groups), firing techniques (inferred, inconsistent). She’d hunted for a *taxonomy*. A nested hierarchy of types. Like sorting butterflies: wings, antennae, colour patterns. Find the key features, build the tree.

  But the features kept slipping. Nothing *stuck*. Her beautiful, colour-coded tabs in her notebook felt increasingly like meaningless graffiti.

  One particularly sodden afternoon, battling a headache and the conviction that humidity was seeping into her brain, Marnie decided to re-examine her earliest notes. Maybe she’d missed a clue in the initial, less structured sorting sessions. She flipped back through the stiff pages. Sketches of sherds. Lists of Kael’s words. Dates.

  Her finger stopped. Scribbled in the margin of a page from three months ago, almost obscured by a coffee ring, was a note: "*Kael mentions ‘bright nights’ re: collection spot A? Ask later.*"

  *Bright nights?* She’d followed it up, she was sure. She scanned the following pages. Ah, yes. She’d asked about the collection spots. Kael had pointed vaguely towards different parts of the valley. She’d noted the locations meticulously on her map – Ravine Mouth, High Meadow, Old River Bend. She’d assumed the "bright nights" was just an observation about visibility during collection. Irrelevant to the *artefacts themselves*.

  A cold, sickening feeling began to pool in her stomach. Not quite realization, but the terrifying precursor: the suspicion that the ground beneath her feet wasn't solid.

  She grabbed her map. Spots marked: A (Ravine Mouth), B (High Meadow), C (Old River Bend). She dragged the relevant trays over. Sherds Kael had consistently grouped as '*kala*' came predominantly from... A and C? Not exclusively, but mostly. '*Na kala*' seemed clustered around B. But why? Different workshops? Different periods? The geology didn't support it. The styles overlapped maddeningly.

  "Kael," she asked, her voice tight. "The bright nights. When you collected at... Old River Bend? Spot C?"

  Kael nodded. "Ah, *kala*. Good nights. Good light. Easy to see."

  "And... Ravine Mouth? Spot A?"

  "*Kala* also. Good light nights."

  "High Meadow? Spot B?"

  Kael wrinkled his nose. "*Na kala*. Dark nights. Harder. Mistake time." He mimed tripping.

  Marnie stared. Light. Dark. *Kala. Na kala.* He wasn't talking about the *artefacts'* characteristics. He was talking about the *context* of their collection. The *state of the moon* when they were found.

  Her heart hammered against her ribs. *It wasn't about the thing. It was about the relationship between the thing and the time it was found.*

  "Kael," she whispered, pointing not at the sherds themselves, but at the labels on the trays: 'Spot A', 'Spot C'. "These... *kala*? Because... bright night?"

  He beamed, a flash of understanding crossing his face. "*Ena!* Yes! *Kala*! Found under Sister's Eye!" He pointed upwards, though the tent roof obscured the sky. Then he pointed to 'Spot B'. "*Na kala*. Found when Sister sleeps. Hidden time. Mistake time."

  The world tilted. Six months. Six months of measuring microns of slip thickness, cataloging every zig and zag of incision, weighing temper grains, building elaborate, brittle taxonomies in her damp notebooks... while Kael had been operating on a completely different plane. His '*kala*' and '*na kala*' weren't intrinsic properties of the pottery. They were relational. Temporal. Tied to the lunar cycle governing when it was appropriate, *auspicious*, or simply *possible* to find certain things. Artefacts found under a full moon were '*kala*' – good, proper, belonging together irrespective of their physical form. Those found during the dark moon were '*na kala*' – tainted, mistaken, belonging to a different, hidden order.

  Her feature space – slip, incision, form, temper – was utterly orthogonal to the actual rule. It wasn't sparse data; it was the *wrong grid entirely*. She’d been meticulously sorting apples and oranges based on the density of their peel, while Kael was separating them by the day of the week they were picked.

  Marnie looked down at her beautiful trays, her colour-coded tabs, her pages of careful analysis. The order she’d imposed felt suddenly absurd, a desperate fiction clinging to the wrong reality. The sherds themselves hadn't changed, but the universe they existed in had just fractured and reconstituted itself around a silent, celestial rhythm she’d never thought to chart. The damp air in the tent felt heavier, thick with the ghost of all those wasted hours spent hunting for categories in a world governed by phases. She reached out and slowly, deliberately, smudged one of her precious, meaningless labels.
