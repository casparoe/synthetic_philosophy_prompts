answer: |-
  ## Proposal: Escaping Arrow's Shadow? Investigating Social Choice Under Framed Preferences

  **Working Title:** Beyond Universal Comparability: Aggregation Rules for Transitive Preferences Within Incommensurable Frames

  **1. Core Research Question:**  
  Can we define a non-dictatorial social welfare function satisfying modified Arrowian axioms when voters have preferences that are transitive *within* distinct, incommensurable "frames" (e.g., architectural merit vs. budget impact), but cannot meaningfully rank alternatives *across* frames?

  **2. Motivation & Gap in Literature:**
  My debate with my friend highlights a key limitation in interpreting Arrow's Impossibility Theorem for real groups. Arrow assumes:
  *   **Universal Domain:** Any logically possible preference ordering across *all* alternatives is allowed.
  *   **Completeness:** Every voter can compare *any* two alternatives (A > B, B > A, or A~B).
  *   **Transitivity:** Preferences are consistent across pairwise comparisons.

  Real-world decision-making often occurs within specific "frames" or criteria. A voter can consistently rank buildings based *only* on aesthetics *or only* on cost, but may genuinely find comparing a beautiful expensive building to an ugly cheap one impossible ("incommensurable"). Standard social choice (Arrow, Sen) crucially **retains global comparability (completeness)** even when relaxing transitivity (e.g., Sen's Value Restriction) or domain (e.g., single-peakedness). This project argues that **dropping global comparability/completeness** in favor of "framed transitivity" is a fundamentally unexplored relaxation relevant to committee decisions, multi-criteria analysis, and deliberative democracy, potentially providing an escape route from Arrow's impossibility.

  **3. Modified Axioms:**
  We define a set of alternatives `X`, a finite set of voters `N`, and a finite set of distinct, **incommensurable frames** `F = {f1, f2, ..., fk}`. Each voter `i` submits:
  *   A **transitive preference relation `R_i^f`** (complete and transitive) over `X` *for each frame `f` in F*.
  *   *No* preference relation is submitted *across* frames. Comparisons like `(x,f1)` vs `(y,f2)` are undefined for voters.

  The social welfare function (SWF) aggregates these `|N|x|F|` frame-specific preference profiles into a **single social preference relation `R_soc` over X**, which must be **complete and transitive** (Arrow's core output requirement). We modify Arrow's axioms:

  1.  **Framed Unrestricted Domain (FUD):** The domain of the SWF is all logically possible combinations of transitive preference relations `R_i^f` for every voter `i` and every frame `f`. (Replaces Universal Domain).
  2.  **Localized Comparability (LC):** Voters only express preferences *within* frames; no cross-frame comparisons are required or used as input. (Replaces Completeness *as an input assumption*; output `R_soc` *must be complete*).
  3.  **Weak Pareto Efficiency (wPE):** If *for every frame `f`*, every voter prefers `x` to `y` within `f` (`x P_i^f y` for all `i`), then society prefers `x` to `y` (`x P_soc y`). (Note: Weaker than standard PE, which acts on overall preferences).
  4.  **Frame-Independence of Irrelevant Alternatives (FIIA):** The social ranking of any two alternatives `x` and `y` depends *only* on how voters rank `x` and `y` *within each frame*. Specifically, it depends *only* on the profile of sets `{ R_i^f | {x,y} }` for all `f` and `i` (i.e., the restriction of each `R_i^f` to just `x` and `y`). (Replaces IIA).
  5.  **Non-Dictatorship (ND):** There is no single voter `i` such that for every pair of alternatives `x, y`, if `i` prefers `x` to `y` *in at least one frame*, then `x P_soc y`. (Strengthened: A dictator only needs to prefer `x>y` in *one* frame, not overall, to force social preference).

  **4. Methodology:**

  *   **Phase 1: Formal Exploration (Weeks 1-8):**
      *   Precisely define the model (X, N, F, `R_i^f`, SWF, `R_soc`).
      *   Formally state the modified axioms (FUD, LC, wPE, FIIA, ND) and the desired properties of `R_soc` (Completeness, Transitivity).
      *   **Constructive Path:** Attempt to define plausible aggregation rules. Examples:
          *   *Frame-Score Summation:* Assign a score to each alternative in each frame based on its position in the frame-specific social ranking (e.g., Borda count *within each frame*), sum scores across frames, rank alternatives by total score.
          *   *Frame-Veto Rule:* An alternative `x` is socially preferred to `y` if there exists *at least one frame* `f` where `x` is ranked above `y` in the frame-`f` social ranking (`R_soc^f` derived from `{R_i^f}` using e.g., majority rule), *and* there is *no frame* `g` where `y` is ranked above `x` in `R_soc^g`. (Requires defining `R_soc^f` first).
      *   **Impossibility Path:** Attempt to prove an impossibility theorem: Show that any SWF satisfying FUD, wPE, FIIA, and producing a complete/transitive `R_soc` must violate ND. Key focus: Does FIIA or wPE, combined with the need for a global ordering, inevitably concentrate power ("frame-dictatorship" or overall dictatorship), even without universal comparability?
      *   Analyze simple counter-examples (2 voters, 2 frames, 3 alternatives) to test rules against axioms or find impossibility seeds.

  *   **Phase 2: Empirical Resonance (Weeks 9-12):**
      *   Analyze **two real-world committee decision protocols** known for using multiple criteria/frames:
          1.  **Architectural Design Competitions:** Explicit judging criteria (e.g., "Aesthetics", "Functionality", "Sustainability", "Cost Feasibility"). How are scores/ranks *within* each criterion aggregated into a final winner? Does the protocol *assume* or *force* cross-criterion comparisons by judges? Does it resemble any rule explored in Phase 1?
          2.  **University Faculty Hiring:** Committees often use distinct rubrics (e.g., "Research", "Teaching", "Service", "Collegiality"). How are assessments *within* these categories combined? Is there an explicit rule, or implicit negotiation potentially masking cross-frame comparisons?
      *   **Goal:** Not statistical testing, but conceptual evaluation. Do these protocols *operate* under something akin to our LC assumption? Do their aggregation methods avoid obvious dictatorship? Could they be formalized under our model? Do they face Arrow-like problems in practice (e.g., path dependence, strategic manipulation)?

  **5. Success vs. Failure Criteria:**

  *   **Success (Escape!):**
      *   Define a specific aggregation rule satisfying FUD, LC, wPE, FIIA, ND and producing a complete/transitive `R_soc`.
      *   OR, prove that while Arrow's *specific* impossibility is avoided, a *different* but still significant trade-off exists (e.g., between FIIA and wPE, or introducing cycles only in specific configurations).
      *   Demonstrate how this rule could be applied to one of the real committee protocols.
  *   **Failure (Arrow's Resilience):**
      *   Prove an impossibility theorem: No SWF under FUD/LC can satisfy wPE, FIIA, ND and always output a complete/transitive `R_soc`.
      *   Discover that *any* rule satisfying the other axioms inevitably makes the global ranking `R_soc` depend *only* on the preferences within a *single frame* (a "frame-dictator") or a single voter's frame preferences (a dictator under our definition).
      *   Find that producing a complete/transitive `R_soc` *forces* effective cross-frame comparability at the aggregation stage, collapsing back to Arrow's assumptions.
  *   **Nuanced Outcome:** Characterizing the *boundaries* of possibility – e.g., finding rules that work only under specific frame structures (e.g., disjoint criteria) or voter agreement levels.

  **6. Feasibility & Scope Management (Honest Assessment):**

  This is ambitious for one semester (~4000 words) but **feasible with strict focus.**

  *   **Avoiding Topology:** We explicitly avoid mathematical domains requiring topology (e.g., spatial models, continuous preferences). The focus is on finite sets, discrete preferences (transitive relations within frames), and combinatorial/logical reasoning, staying within classic social choice toolkit.
  *   **Scope Control:**
      *   **Priority on Formal Model:** Phase 1 is the core (75% effort). Success hinges on rigorously exploring the modified axioms.
      *   **Empirical as Illustration:** Phase 2 is secondary (25% effort). It provides context and a reality check using *documented, accessible* protocols (public design competition rules, typical faculty hiring guidelines), not original data collection.
      *   **Focus on Binary Case First:** Initial exploration will heavily use small numbers (2-3 alternatives, 2 frames, 2 voters) to build intuition and find proofs/counter-examples.
      *   **Clear Exit Points:** If Phase 1 yields an impossibility proof early, the project becomes a characterization of that result and its implications. If a rule is found, the project shifts to analyzing its properties and resonance. The empirical phase provides concrete grounding either way.
  *   **Challenge:** The main difficulty lies in navigating the interaction between the incommensurable frame inputs and the need for a globally complete/transitive output. FIIA is particularly tricky to define and work with. Proving *anything* conclusive (possibility or impossibility) requires careful construction.

  **7. Expected Output:**
  A 4000-word paper presenting:
  1.  The core argument for framed preferences and the gap in standard Arrow/Sen.
  2.  The formal model and modified axioms.
  3.  The primary finding: Either (a) a working aggregation rule with justification for satisfying all axioms, (b) an impossibility proof, or (c) a clear characterization of the boundary between possibility and impossibility.
  4.  Analysis of how the finding relates to the two real-world committee protocols.
  5.  Discussion of implications for understanding collective decision-making under incommensurable values and limitations of the model.

  This project directly addresses my argument with my friend: by rigorously relaxing Arrow's completeness assumption in a structured way relevant to real groups, we can determine if his "logic puzzle" truly binds when comparability is localized, or if a path exists for reasoned collective choice under fragmented preferences.
