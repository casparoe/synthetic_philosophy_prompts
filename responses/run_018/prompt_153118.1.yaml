answer: |-
  Here is the taxonomy derived from the five splitting claims, yielding five distinct leaf positions:

  1.  **Perpetual Corporate Guilt** (Y/N/Y/N/N):  
      The state is a continuous moral person; guilt is structural; present citizens inherit guilt itself (not just obligations); collective guilt is literal; time does not dissolve it.  
      *Awkward Commitment:* Must claim newborns automatically bear inherited guilt for past atrocities committed by a state entity they belong to, despite no personal connection.

  2.  **Inherited Obligation Only** (Y/N/N/N/N):  
      The state is a continuous moral person; guilt is structural; present citizens inherit *only* repair obligations (not guilt itself); collective guilt is literal; time does not dissolve it.  
      *Awkward Commitment:* Must assert that the state *itself* perpetually "feels guilty" as a literal entity, imposing duties on current citizens solely due to their membership, regardless of time passed.

  3.  **Structural Debt Holders** (N/Y/N/N/N):  
      The state has no continuous moral personality; guilt is structural; present citizens inherit only repair obligations; collective guilt is literal; time does not dissolve it.  
      *Awkward Commitment:* Must claim tangible obligations persist indefinitely due to purely structural injustices, even though the collective entity bearing them lacks continuous identity and no living individual was involved.

  4.  **Metaphorical Shame & Duty** (N/Y/N/Y/N):  
      The state has no continuous moral personality; guilt is structural; present citizens inherit only repair obligations; collective guilt is metaphorical for distributed shame; time does not dissolve obligations.  
      *Awkward Commitment:* Obligations bind current citizens based on structural harms from the distant past, justified by diffuse feelings of group shame they *should* feel, not direct responsibility.

  5.  **Temporal Dissolution** (Unnamed) (N/N/N/N/Y):  
      The state has no continuous moral personality; guilt requires individual mental states; present citizens inherit neither guilt nor obligations; collective guilt is metaphorical; time automatically dissolves it.  
      *Awkward Commitment:* Must deny any claim for reparations or acknowledgment of historical wrongs once the perpetrators and direct victims have died, regardless of ongoing structural consequences.
