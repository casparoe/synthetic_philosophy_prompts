prompt: |-
  Hey, I'm giving the opening remarks at this workshop on historical consciousness in non-western archives — half the room are Nietzsche people who will spot every move, the other half are archivists who haven't read him since undergrad if ever. Our host institution just lost funding for its living-memory oral history wing, so there's a real tension: we want to honor the work that's been done, preserve what's left, but also ask whether some of those collections should've been assembled in the first place. I want you to write a five-minute opening that uses Nietzsche's three modes — monumental, antiquarian, critical — not as a list but as the actual structure of what I can and can't say about the archives. It needs to feel like an occassion, not a seminar, and land for both sides without dumbing it down. No citations please, just the speech. And please don't turn it into a eulogy for the funding — keep it forward-looking but honest about the loss.
