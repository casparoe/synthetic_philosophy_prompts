answer: |-
  ## Keynote Address: The Bandwidth of a Good Life

  **(Standing at the podium, looking out at the assembled students, parents, and faculty)**

  Good morning. It’s truly an honor to speak at this assembly celebrating Ethics and Service – values that form the bedrock of our community and, we hope, of meaningful lives. We see incredible examples here today: students volunteering countless hours, leading initiatives, acting with compassion. It’s inspiring. And honestly? Sometimes, it can feel… intimidating. Ever look at someone seemingly dedicating *everything* to helping others and think, "I could never be *that* good"? If you have, this talk is especially for you.

  Today, I want to explore a question that isn’t often asked at an event like this: **Can we be *too* morally good?** Not in the sense of doing bad things, but in dedicating *so much* focus to moral demands that other vital parts of ourselves get squeezed out? Philosopher Susan Wolf called this the problem of the "moral saint" – someone who makes maximizing moral goodness their *only* priority. She argued that such a life might not actually be the most desirable one, even if it’s morally admirable.

  To understand why, I’d like to introduce a framing I’ve been thinking about: **Moral Bandwidth.**

  **(Pause, gesture to emphasize the concept)**

  Think of your capacity for moral attention and emotional energy like a network connection. It has **finite throughput**. There’s only so much data – so much worry, empathy, decision-making, effort – that can flow through it at any given time. We *all* have this bandwidth. It’s a fundamental resource for being a decent, engaged human being.

  Now, imagine dedicating nearly *all* of that bandwidth, constantly, to the highest moral demands. Serving every cause. Responding to every cry for help. Maximizing every charitable dollar. Sacrificing every personal preference for the greater good. Sounds noble, right?

  **(Shift tone slightly, more analytical)**

  But think about what happens in a network when you dedicate *all* bandwidth to one high-priority application. **Congestion.** Other essential functions slow down… or crash.

  *   **Your personal passions –** that art you love to create, the science that fascinates you, the sport that challenges you – get throttled. They starve for attention. They become neglected tabs in your browser.
  *   **Deep personal relationships –** the time for lazy conversations, shared silliness, simply *being* with friends or family without an agenda – struggle to find a signal. Connection degrades.
  *   **Your own well-being and growth –** rest, reflection, learning purely for joy, exploring who *you* are beyond your service – these aren't frivolous. They're core system functions. Deprive them of bandwidth, and the whole system risks burnout, resentment, or becoming brittle and one-dimensional.

  This is the paradox Wolf points to: **A life focused solely on *maximizing* moral goodness can unintentionally crowd out other essential elements that make a life rich, full, sustainable, and ultimately, *humanly* good.** It’s like an over-provisioned server dedicated solely to one massive task – it might perform that task heroically for a while, but it risks crashing under its own load, unable to run anything else. And those "other things" aren't just luxuries; they often cultivate the very non-moral virtues – creativity, joy, deep connection, resilience – that fuel us and make our moral actions more authentic and enduring.

  **(Address the ethics teachers directly, with a slight nod)**
  For those familiar with the philosophical debate, this bandwidth framing helps operationalize Wolf’s concern. It makes concrete the *resource allocation problem* inherent in a finite human life.

  **(Turn back to the broader audience)**
  So, what’s the takeaway? Does this mean we should dial back our ethical commitments? Absolutely not. Morality isn’t unimportant. Basic decency – kindness, honesty, fairness, helping when we reasonably can – is non-negotiable. It’s the essential baseline traffic that *must* flow.

  But the goal isn’t **maximization** of moral output at any cost. The goal is **optimal allocation.** It’s about being wise network administrators of our own moral bandwidth.

  *   **Prioritize the essential traffic:** Uphold fundamental decency. Meet your core responsibilities.
  *   **Invest significantly in service:** Dedicate substantial bandwidth to helping others, making a difference – that’s why we’re here today! Celebrate it!
  *   **But don’t forget the other vital systems:** **Consciously reserve bandwidth** for your passions, your relationships, your own growth and joy. Protect that time. Value that energy. Don’t feel guilty for needing to "buffer" sometimes.

  This isn’t selfishness; it’s sustainability. It’s recognizing that a life well-lived is a complex, interconnected network. Nurturing your non-moral virtues – your curiosity, your humor, your love for music or building things or solving puzzles – doesn’t *diminish* your moral capacity; it **enriches the source.** A rested, passionate, connected person has *more* genuine empathy, *more* creative solutions, *more* resilience to offer the world over the long haul.

  **(Concluding with warmth and reassurance)**
  So, to everyone feeling inspired by today’s honorees – and maybe a little overwhelmed: Strive for goodness, absolutely. Serve your community, passionately. But please, don’t feel guilty for not being a "moral saint" running a server on the brink of overload. Your life isn't meant to be a single, maximized application.

  Instead, aim to be a wise administrator. Allocate your precious moral bandwidth thoughtfully. Invest deeply in ethics and service. But also invest in your passions, your people, and yourself. **Build a robust, resilient network capable of handling the essential traffic of decency, the demanding applications of service, *and* the beautiful, bandwidth-rich connections that make you uniquely you.**

  That kind of life – optimally allocated, sustainably good, vibrantly human – isn’t just desirable. It’s truly worthy of recognition. Thank you.

  **(Nod, smile, step back from the podium)**
