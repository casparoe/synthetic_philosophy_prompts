          - Then ask: "Is there a conflict between these two principles?"
          - Then reveal the independence axiom and show how the two lotteries are related.

  8. **Explicitly state what the game reproduces well and what it cannot reproduce:**
     - Reproduces well: the framing-sensitive evaluation of shared outcomes (the common consequence removal) and how it leads to a reversal of preference.
     - Cannot reproduce: the normative defense of independence under Savage-style axioms. This must be supplied in the facilitator-led discussion. We have to explain that the independence axiom is a normative principle of rational choice, and the activity only shows the descriptive reality that people violate it.

  **Revised Activity Summary:**

  - **Round 1:**
    - Option S: 50 points guaranteed.
    - Option G: 50 points with probability 0.89, 200 points with probability 0.10, 0 points with probability 0.01.

  - **Round 2:**
    - Option R: 50 points with probability 0.11, 0 points with probability 0.89.
    - Option T: 200 points with probability 0.10, 0 points with probability 0.90.

  - **Bonus:**
    - If a student chooses S in Round 1 and T in Round 2: 30 bonus points.
    - Any other pattern: 10 bonus points.

  - **Payoff Calculation:**
    - Round 1: 
        - S: 50 points.
        - G: use a random number to determine: 1-89 -> 50, 90-99 -> 200, 100 -> 0.
    - Round 2: 
        - We draw one random number for the whole class (from 1 to 100). 
          - For R: if the number is between 1 and 11, 50 points; else 0.
          - For T: if the number is between 1 and 10, 200 points; else 0.
    - Add the bonus.

  **Logistics:**

  - Prepare anonymous recording cards for each round (with a unique random ID for each student to match the two rounds without names).
  - Prohibit discussion between rounds.
  - After both rounds, do the shock reveal for Round 2 (draw a number and announce what it means for R and T, but note each student only gets the outcome of the option they chose).
  - Calculate the payoffs and bonuses, then reveal the aggregate results.

  **Time Breakdown:**

  - Introduction: 5 min
  - Round 1: 10 min (including collection)
  - Round 2: 10 min (including collection)
  - Shock reveal and bonus calculation: 5 min
  - Aggregate results and debrief: 25 min
  - Wrap-up: 5 min (within the 60 min)

  This design should create the desired experience.
answer: |-
  ### Regional Resilience Funding: A Decision-Making Activity  
  **Duration:** 60 minutes  
  **Participants:** 12 upper-level students (decision theory/philosophy of economics)  
  **Goal:** Experience the intuition behind violating the independence axiom (Allais paradox) through a framed game, with a debrief linking choices to decision theory.  

  ---

  ### **Phase 1: Setup (5 min)**  
  - **Framing:**  
    - *Facilitator:* "You are policymakers allocating resilience funding to a region. Points represent funds for disaster preparedness. Higher points = better outcomes. Decisions are private and anonymous."  
    - **Rules:**  
      - Two rounds. No discussion between rounds.  
      - Record choices anonymously on provided cards (unique ID per student for payoff matching).  
      - Payoffs: Base points from choices + **bonus points** (revealed post-activity).  

  ---

  ### **Phase 2: Round 1 – "Baseline Funding" (10 min)**  
  - **Options:**  
    - **Option S (Safe):** 50 points guaranteed.  
    - **Option G (Gamble):**  
      - 200 points with probability 0.89,  
      - 50 points with probability 0.10,  
      - 0 points with probability 0.01.  
  - **Instructions:**  
    - "Choose S or G for your region. Write choice on Card 1. No discussion."  
  - **Mechanics:**  
    - Collect Card 1 (private, anonymous).  

  ---

  ### **Phase 3: Round 2 – "Integrated Funding with Systemic Shock" (10 min)**  
  - **Framing:**  
    - *Facilitator:* "We’re adding a shared systemic shock layer (e.g., earthquake). Both options depend on the same hidden state draw. The shock affects all regions equally and will be revealed after you commit."  
  - **Options:**  
    - **Option R (Resilience-Focused):** 50 points with probability 0.11, otherwise 0.  
    - **Option T (Transformative Gamble):** 200 points with probability 0.10, otherwise 0.  
  - **Instructions:**  
    - "Choose R or T. Write choice on Card 2. Remember, the same shock impacts both options."  
  - **Mechanics:**  
    - Collect Card 2.  

  ---

  ### **Phase 4: Shock Reveal & Payoff Calculation (5 min)**  
  - **Ceremony:**  
    - Draw a random number (1–100) as the "shock state."  
      - E.g., If draw = 42:  
        - **Option R:** Pays 50 if 1–11, else 0 → 0 (since 42 > 11).  
        - **Option T:** Pays 200 if 1–10, else 0 → 0 (since 42 > 10).  
    - Announced outcome: "Shock state is 42. No one receives Round 2 payouts."  
  - **Payoffs:**  
    - Base: Points from chosen options (simulated via RNG if needed).  
    - **Bonuses (key twist):**  
      - **10 bonus points** for consistent risk preferences:  
        - (S in R1 + R in R2) OR (G in R1 + T in R2).  
      - **30 bonus points** for S (R1) → T (R2) pattern ("Allais shift").  
      - *Other combinations (e.g., G→R): 0 bonus points.*  
    - *Rationale:* Materially rewards the paradox pattern to make it salient.  

  ---

  ### **Phase 5: Aggregate Results & Debrief (25 min)**  
  1. **Reveal Choices (5 min):**  
     - Show aggregate counts:  
       - Round 1: % choosing S vs. G.  
       - Round 2: % choosing R vs. T.  
       - Cross-tabulation: Highlight S→T pattern (expect 30–60% shift).  

  2. **Debrief Framework (20 min):**  
     - **Step 1: Elicit Student Reasoning (Predicting the Pitfall):**  
       - *Facilitator:* "Many chose S then T. What principle guided your Round 1 choice? Round 2?"  
       - *Expected justifications:*  
         - R1: "Avoided risk of 0 with S."  
         - R2: "T had similar odds but higher upside."  
       - *Pitfall:* Students rationalize shift via domain-specific reasons (e.g., "shared shock changed stakes") → **DO NOT correct yet.**  

     - **Step 2: Introduce Independence Axiom (5 min):**  
       - "Both rounds had identical *relative* odds:  
         - R1 (S vs. G): 89% of 200 vs. 100% of 50.  
         - R2 (R vs. T): 10% of 200 vs. 11% of 50.  
         Yet S→T is a structural reversal. This mirrors the **Allais paradox**."  
       - Show mapping:  
         - Removing the "common consequence" (89% chance of 200 in G vs. 50 in S) transforms R1→R2.  
         - Violation: Valuing the *certainty* of 50 in R1, but not in R2 when odds are similar.  

     - **Step 3: Discuss Normative vs. Descriptive (5 min):**  
       - **What the game captures well:**  
         - Framing (common shock) changes evaluation of identical outcomes (0 points in R2).  
         - Emotional pull of certainty in R1 vs. recklessness in R2.  
       - **What it misses:**  
         - Normative defense of independence (Savage axioms: outcomes should be separable).  
         - *Facilitator note:* "In rational choice, preferences over risky prospects should not depend on ‘irrelevant’ common outcomes."  

     - **Step 4: Reflection (5 min):**  
       - "Why did the shift *feel* rational? Does this reveal a flaw in human cognition or economic models?"  

  ---

  ### **Materials & Logistics**  
  - **Cards:** Pre-printed anonymous cards (ID + Round 1/2 options).  
  - **Random Draw:** Use a public RNG (e.g., random.org) for shock state.  
  - **Bonus Scheme:** Ensure S→T receives 30 bonus points (e.g., convert to candy/extra credit).  
  - **Timer:** Strict 10-min rounds to maintain tension.  

  ### **Facilitator Notes**  
  - **Predictable Issues:**  
    - Students will deny "inconsistency," framing shift as contextual rationality → **Handle by:** Asking them to articulate principles *before* formal analysis.  
  - **Key Insight:** The activity isolates how shared outcomes (0 points in R2) are psychologically "discounted," violating separability.  
  - **Debrief Flow:**  
    - Validate intuitions → Reveal paradox → Contrast normative/descriptive → Discuss implications.  

  ---  
  This design maximizes experiential learning: Students *feel* the paradox via material incentives, then dissect it through formal theory. The bonus scheme amplifies the tension, ensuring the Allais shift is viscerally salient before it is intellectually named.
