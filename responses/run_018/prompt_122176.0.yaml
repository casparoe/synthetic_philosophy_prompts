prompt: |-
  I'm prepping a session for my second-year philosophy reading group — theyre mostly comfy with basic ethics but now hitting teh wrong-kind-reasons problem and mixing it up with just having bad reasons generally. You are a seasoned philosophy tutor; please think carefully about the dependency structure before you lay out the plan, and start with a quick brainstorm of what can go wrong pedagogically. I need the answer in British English.

  Don't explain the concept to me directly — design the teaching arc for a single 90-minute meeting. First, what distinction must be solid before 'wrong kind' makes any sense, and in what order do the pieces have to come? Then the carrying example: I'm tempted to use admiration for a mathematician's proof, but tell me whether that works, what properties it must have, and what it must lack so it doesn't collapse into 'bad reasons' or 'selfish motives'. Map out the misconceptions they'll arrive with or form — especially thier tendency to think it's about hidden motivation rather than the category of reason being inappropriate — and say exactly where in the sequence each gets headed off, including teh sneaky misconception that instrumental value can 'leak' into intrinsic appreciation without them noticing.

  Also: the one check question at the end that shows they've got the structural point, not just memorised the phrase; what I should openly say we're skipping at this level; and weave in this niche twist — show how the problem looks different when the attitude is belief rather than admiration, using a scenario about someone forming confidence in climate-model outputs mainly because of departmental peer-pressure rather than evidence, but don't ask them to research anything. Keep it casual; a typo or two is fine.
reasoning: |-
  Okay, let me approach this systematically. The user is prepping a philosophy session on the wrong-kind-of-reasons problem for second-year students familiar with basic ethics but prone to conflating it with bad reasons or selfish motives. 

  First, I need to identify the core pedagogical challenge: students will likely arrive thinking "wrong kind" means morally bad or self-interested reasons, rather than category errors in reason-type. The key distinction to establish upfront is intrinsic vs instrumental value, as without this foundation, the entire concept collapses. 

  For the carrying example, admiration for a mathematician's proof works well because:
  - The proof has intrinsic epistemic value
  - Adding external incentives (like £100 reward) creates a clear category mismatch
  - It lacks moral baggage that might distract into "bad reasons" discussions
  Crucially, I must emphasize that the reward isn't a bad reason to act admiring - it's the wrong currency for genuine admiration.

  The common misconceptions to preempt:
  - Early on: Define "inappropriate category" before introducing examples
  - During carrying case: Explicitly contrast "not worth admiring" (bad reason) vs "can't be admired for money" (wrong kind)
  - Peer-pressure climate belief example: Show same structural issue in non-emotive context

  For the niche twist about belief vs admiration:
  - Use departmental peer-pressure scenario for climate models
  - Highlight how social pressure is wrong-kind reason for belief formation (should be evidence-based)
  - Contrast with bad evidence being right-kind-but-poor quality

  The check question shouldn't be about definitions but application: "Why isn't 'it'll make me popular' a wrong-kind reason to think 2+2=4?" Forces recognition that social pressure can't constitute epistemic justification.

  I'll explicitly bracket:
  - Complex cases like blame/promises
  - Non-cognitivist complications
  - Full taxonomy of attitude-types

  Timing-wise: 15min foundations, 30min carrying case with misconceptions, 20min belief twist, then synthesis. Keep it conversational with deliberate casual phrasing to avoid intimidating precision.
answer: |-
  Right then, let's craft a tight 90-minute plan for your reading group, sorting out the "wrong kind of reasons" (WKR) problem from general "bad reasons". I've seen this go sideways when the dependencies aren't nailed first. Here’s the pedagogical arc, pitfalls flagged upfront, and your niche twist woven in. British English throughout, casual tone kept.

  **Pedagogical Pitfalls (Brainstorm First):**
  1.  **Conflating "Wrong Kind" with "Morally Bad/Selfish":** Biggest risk. Students will initially think WKR = immoral/self-interested motives (e.g., admiring for money = greedy). Must sever this link early.
  2.  **Missing the Category Error:** They'll focus on *strength* or *quality* of the reason ("Is £100 *enough* to admire?"), not the *type* ("Can money *ever* be a reason *for admiration itself*?").
  3.  **Instrumental "Leak":** Subtle trap: thinking if the instrumental goal (getting £100) is achieved *through* the attitude, it somehow validates the attitude's object (e.g., "I got the money, so the proof *must* be admirable for that reason"). Need to expose this sleight-of-hand.
  4.  **Over-applying WKR:** Assuming *any* external reason is WKR. Must show some attitudes *do* have constitutive standards that include external factors (e.g., promising).
  5.  **Belief vs. Attitude Confusion:** When you shift to belief, they might blur epistemic reasons (evidence) with pragmatic ones (peer pressure), but not see the *structural* parallel to admiration.

  **Core Distinction Needed FIRST:**
  You **must** solidify **Intrinsic Value/Standards vs. Instrumental Value/Reasons**.
  *   *Why?* WKR only bites when reasons of the *wrong kind* (usually instrumental) try to apply to attitudes/mental states judged by *intrinsic* or *constitutive* standards (like admiration, belief, fear). Without this, "wrong kind" has no anchor.

  **The 90-Minute Plan:**

  **Part 1: Foundations & The Crucial Distinction (15 mins)**
  *   **Hook:** "Why do we admire things? What makes admiration *fitting* or *unfitting*? Is it just about what *gets* us to feel it, or something about the *thing itself*?"
  *   **Establish Intrinsic vs. Instrumental:**
      *   Quick recap: "Intrinsic value = valuable for its own sake (e.g., happiness, beauty, truth). Instrumental value = valuable as a means to something else (e.g., money, a tool)."
      *   **Key Question:** "What kind of value is admiration *responding to*? If I admire a sunset, is it because the sunset is *useful*, or because it's *beautiful*?" (Guide them to see admiration tracks intrinsic value - beauty, skill, virtue etc.)
      *   **Pitfall Pre-emption (Conflation):** Explicitly state: "Notice we're not talking about *good* or *bad* motives yet, like greed. We're asking what *kind* of thing admiration is even *about*."

  **Part 2: The Carrying Case - Admiration & WKR (30 mins)**
  *   **Your Example (Mathematician's Proof):** Perfect, *if* framed right.
      *   *Setup:* "Brilliant, elegant proof of Fermat's Last Theorem. You understand it, grasp its ingenuity. You feel genuine admiration. Fitting?"
      *   *The Offer:* "Now, a wealthy eccentric says: 'I *really* want someone to admire that proof. I'll pay you £100 if you *genuinely admire it* right now.'"
      *   *Crucial Properties & What It Lacks:*
          *   **Must Have:** Clear intrinsic object (proof's elegance), clear instrumental inducement (£100).
          *   **Must Lack:** Moral condemnation (the offer isn't *evil*, just weird), ambiguity about the proof's genuine merit (it *is* admirable intrinsically), any suggestion the money *enhances* the proof's value. The money is *utterly external* to the proof's properties.
  *   **Discussion Driver:** "Can you *genuinely admire the proof itself* **for** the reason that you get £100?"
      *   *Target Misconceptions:*
          *   **"Bad Motives":** "Is the offer making you greedy? Maybe, but that's not the point. Even if you're pure as snow, *can* £100 be your *reason for admiring the proof itself*?" (Head off Conflation Pitfall 1).
          *   **"Strength/Quality":** "Is £100 *too little*? Would £1 million work? Why/why not?" (Expose Category Error Pitfall 2 - the amount is irrelevant to the *kind* of reason).
          *   **"Leak" Pre-emption:** "Imagine you *do* somehow muster genuine admiration and get the £100. Does that mean £100 *was* a fitting reason to admire the *proof's elegance*?" (Force them to see the attitude and the instrumental goal are separate. Achieving the goal via the attitude doesn't validate the reason-object link. Nail Pitfall 3).
  *   **Introduce WKR Label:** "This is the WKR problem. The £100 is a reason *to want to admire*, or *to make yourself admire*, but it's the **wrong kind of reason** to *base your admiration itself upon*. Admiration is constituted as a response to properties like elegance, not to financial incentives. The reasons don't 'fit' the attitude."

  **Part 3: Niche Twist - Belief & Peer Pressure (20 mins)**
  *   **Shift Attitude:** "Okay, let's swap admiration for *belief*. Belief seems different – it's about truth, yeah? What are the *right kind* of reasons for belief?"
      *   (Elicit: Evidence, logic, data – epistemic reasons).
  *   **The Scenario:** "Researcher, Clara, works on complex climate models. The outputs are alarming, suggesting severe warming. The data is messy, the models complex. Clara hasn't fully grasped the technical nuances herself yet. However, *everyone* in her prestigious department, her supervisors, her brilliant peers, are utterly convinced by the outputs and express high confidence. There's strong peer pressure to conform. Clara finds herself forming a confident belief in the model outputs."
  *   **Analysis:**
      *   "Clara might have a belief. But what's her *primary reason* for holding it confidently? Peer pressure/departmental consensus."
      *   "Is peer pressure *evidence* about the climate? Is it a reason concerning the *truth* of the model outputs? Or is it a reason about social acceptance, career prospects, avoiding conflict?" (Highlight the instrumental nature of peer pressure).
      *   **WKR Parallel:** "So, peer pressure is a reason *to want to believe* (or to act as if you believe), maybe even *to make yourself believe*. But is it the **right kind of reason** to *base the belief itself upon*? Belief is (arguably) constituted as a response to *epistemic* reasons – evidence for truth. Peer pressure is the **wrong kind of reason** for belief itself, even if it gets her to a (potentially) true belief. It's a category mismatch, just like the £100 for admiration."
      *   **Pitfall Pre-emption (Belief):** Contrast with: "What if her peers *showed her clear evidence*? *That* would be a right-kind reason, even if delivered via peer pressure. The *source* isn't the issue; the *kind* of consideration (evidence vs. social consequence) is."

  **Part 4: Synthesis & Check (15 mins)**
  *   **Recap Contrast:** "So, for both admiration and belief: WKR are reasons that might *cause* or *motivate* the attitude, but they aren't reasons that speak to the *standard that defines what makes that attitude fitting or correct* (elegance/beauty for admiration, truth/evidence for belief). They're the wrong currency."
  *   **"Bad Reasons" Clarification:** Reiterate distinction: "A *bad* right-kind reason for admiring the proof would be misjudging a clumsy proof as elegant. A *bad* right-kind reason for belief would be relying on shoddy evidence. WKR aren't even in the running to be good or bad *as reasons for that specific attitude* – they’re in the wrong game."
  *   **The Check Question (Structural Understanding):**
      *   **"Imagine someone says: 'I believe 2+2=4. Why? Mainly because believing it makes me popular with mathematicians.'**
      *   **Is 'it makes me popular' a *wrong kind of reason* for that belief? Why/why not?"**
      *   *Why it works:* It forces application. The belief is true, popularity is achievable, but popularity is utterly irrelevant to the *truth* of 2+2=4. It's clearly a pragmatic/instrumental reason trying to be an epistemic one – classic WKR structure. If they get this, they see the category error, not just the phrase. If they say "it's a bad reason", probe: "Bad *how*? Could popularity *ever* be the right *kind* of reason for a belief's truth?"
  *   **What We're Skipping (Say Explicitly):** "Just to manage scope, we're *not* diving into the really thorny debates today: how this applies to *blame* or *promising* (where external reasons might sometimes be relevant), the deep meta-ethical debates about whether all attitudes have constitutive standards, or the 'Myth of the Given' stuff about belief. We're sticking to the core structural puzzle: the category mismatch."

  **Key to Tone:** Keep it conversational. Use phrases like "Let's noodle on this...", "Hang on, does that *really* track?", "Where's the category foul here?". A few deliberate "sorta"s or "kinda"s help. Your "teh" typo? Spot on for the vibe. Good luck – it's a tricky one, but cracking when the penny drops!
