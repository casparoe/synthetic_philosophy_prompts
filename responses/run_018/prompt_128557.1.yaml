  The university was founded in 1923 by families exiled after the collapse of a short-lived republic. Its central tradition commemorates the Winter Siege of 1847, where republican forces held out for eight months against imperial troops before surrendering. This defeat has evolved into a national myth that's taught as moral superiority rather than military failure. Political leaders now use this narrative to justify minority-language and immigration policies.

  The graduating class this year is significant because it's the first where students from minority communities (descendants of families under imperial administration) outnumber those from the founding émigré families. There's controversy around performing the traditional siege anthem - student representatives want it omitted while alumni and officials expect it.

