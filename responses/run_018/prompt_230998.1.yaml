  Standard interpretation of loop case: 
    - Without the one person, the trolley would loop back and kill the five. So the one person is being used as a block. So the death is intended as a means? 
    - But if the trolley is diverted to a track that loops back, and the one person is on that loop, then if the one person weren't there, the trolley would come back and kill the five. So by diverting, you are using the one person to stop the trolley. So the death is a means.

  However, some argue that in the loop case, the death is not intended but merely foreseen? This is a point of contention.

  We'll use:

  - Switch: divert trolley to side track with one person, saving five. Death is typically seen as foreseen, not intended.
  - Footbridge: push one person off bridge to stop trolley, killing him. Death intended as means.
  - Loop: divert trolley to a loop that has one person; if the one person weren't there, the trolley would loop back to the main track and kill the five. So the one is being used to block the trolley. Hence, death is a means.

  Non-trolley:

  1. Hysterectomy: a pregnant woman has a cancerous uterus; removing it will save her life but cause the fetus to die (foreseen side effect). Permissible.
  2. Craniotomy: crush the fetus's skull to remove it and save the mother's life. Impermissible because the death is intended as a means.

  Strategic bombing vs. terror bombing:

  - Strategic: bomb a munitions factory, foreseeing that nearby civilians will die (side effect). Permissible?
  - Terror: bomb civilians to terrorize the enemy into surrendering. Impermissible.

  But note: in strategic bombing, if the factory is in a civilian area, the civilian deaths might be intended as a means to destroy the factory (if the factory's destruction requires the area to be destroyed, including the civilians)? This is debated.

  Joint Claims:

  1. Both accept that in the switch case, most people judge the action as permissible, and in the footbridge case, most judge it as impermissible.
  2. Both accept that in the hysterectomy case, most judge it as permissible, and in the craniotomy case, most judge it as impermissible.
  3. Both accept that in the strategic bombing case (properly described), most judge it as permissible (or at least more permissible than terror bombing), and in the terror bombing case, most judge it as impermissible.
  4. Both accept that the intention/foresight distinction is a conceptual distinction that can be formulated in principle (even if B thinks it is not doing the moral work).
  5. Both accept that the loop case is controversial: some people judge it as permissible, some as impermissible, and this variation in judgment is a point to be explained.
  6. Both accept that there are variations in the cases (like method of killing) that can affect judgments, and that these variations are not always captured by the intention/foresight distinction alone.

  Disagreements:

  We'll set up a table with:

  - Disagreement (neutral)
  - A's view
  - B's view
  - Crux (with case/argument and predictions)

  We'll have multiple rows for different disagreements.

  Let's draft:

  **I. Jointly Accepted Claims**

  1. There is a robust pattern of moral judgments across a range of cases: diverting a threat in the Switch case is typically judged permissible, while directly using a person as a means to stop a threat in the Footbridge case is typically judged impermissible. Similarly, removing a uterus to save a mother's life (Hysterectomy) is judged permissible, while crushing a fetus's skull to save the mother (Craniotomy) is judged impermissible. Strategic bombing (where civilian deaths are foreseen but not intended) is judged more permissible than terror bombing (where civilian deaths are intended as a means to demoralize the enemy).

  2. The Doctrine of Double Effect (DDE) provides a theoretical framework that distinguishes between intended and merely foreseen harmful consequences, and this distinction is often invoked to explain the pattern of judgments in the above cases.

  3. The Loop variant of the trolley problem (where diverting the trolley requires the death of one person to stop the trolley from looping back and killing five) elicits mixed judgments: some find it permissible and some impermissible, and this variation requires explanation.

  4. Certain variations in the description of cases (such as the method of causing death, the presence of physical contact, or the directness of the harm) can influence moral judgments, and these variations are not always directly captured by the intention/foresight distinction as typically formulated.

  5. The intention/foresight distinction is conceptually coherent and can be defined in a way that is not inherently arbitrary, though the moral relevance and the adequacy of this distinction in explaining judgments is contested.

  **II. Table of Disagreements**

