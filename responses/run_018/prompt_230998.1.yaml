  | **2. The robustness of the intention/foresight distinction across non-trolley cases** | The distinction consistently explains the permissibility of hysterectomy and the impermissibility of craniotomy, as well as strategic bombing versus terror bombing. | The distinction fails to capture the full pattern of judgments because other factors (e.g., the nature of the act, the identity of the victim, or the context) are at play. | **Crux Case: Strategic Bombing with High Civilian Casualties** <br> *Case: Bombing a military target that is embedded in a civilian area, where the destruction of the target requires destroying the entire area, including civilians. The deaths of the civilians are foreseen but not intended (as per DDE). However, the number of civilian deaths is very high (e.g., 1000) and the military benefit is moderate.* <br> - A predicts: The action may still be judged permissible (though perhaps less so due to proportionality) because the deaths are not intended. <br> - B predicts: The judgment will be impermissible due to the high civilian toll and the direct causal role of the civilians' presence (they are being used as part of the target), and the intention/foresight distinction will not override these factors. <br> *Nature of Dispute: Both descriptive moral psychology and normative relevance (whether the distinction should matter in the face of other factors).* |
  | **3. The non-arbitrary definability of "intending as a means" in the Loop case** | The Loop case can be clearly classified: the death is intended as a means because the one person is used to block the trolley. | The Loop case is ambiguous, and the classification as "intended means" is arbitrary because the causal structure is complex and could be described in multiple ways. | **Crux: Alternative Description of Loop Case** <br> *Case: The Loop case is described in two ways: <br> (a) "You divert the trolley to the loop where it will hit the one person, which stops it and prevents it from looping back to kill the five." <br> (b) "You divert the trolley to the loop to prevent it from killing the five. The loop leads to a dead end where the one person is, and the trolley will stop there. Without the one person, the trolley would roll back out and kill the five."* <br> - A predicts: Both descriptions will lead to the same judgment (impermissible) because the death is intended as a means in both. <br> - B predicts: Description (a) will lead to more impermissible judgments because it highlights the use of the person as a means, while (b) might lead to more permissible judgments because it emphasizes the prevention of the trolley from looping back (making the death seem more like a side effect). <br> *Nature of Dispute: Whether "intending as a means" can be defined non-arbitrarily and whether it tracks moral judgments consistently.* |
