  Additionally, we note that B sometimes views A's invocation of the intention/foresight distinction as a verbal move, particularly in cases where the classification of an effect as intended or merely foreseen seems arbitrary. For instance, in the Loop case, B argues that A's insistence that the death is intended is a post hoc classification to fit the desired judgment. However, B acknowledges that there are cases (like the Switch case) where the distinction seems to make a real difference, but B attributes that to the distinction correlating with other factors (like directness of harm).

