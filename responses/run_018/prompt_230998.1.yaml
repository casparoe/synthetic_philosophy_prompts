     - B: Tweaking low-level details (like method of killing) changes judgments, and the intention/foresight distinction cannot account for that.

  3. **The definability of "intending as a means" without arbitrariness**:
     - A: We can define what it means to intend harm as a means in a non-arbitrary way that tracks moral relevance.
