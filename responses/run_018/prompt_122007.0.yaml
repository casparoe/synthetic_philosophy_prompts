prompt: |-
  A guy in my reading group has been pushing this argument for weeks and I think its broken but I can't put my finger on where. He says it's basically Hume's case against miracles, tidied up, and that once you tidy it up you see it proves way more than Hume let on.

  His version, as close as I can get it:

  (1) A miracle, in the sense that matters, is not just a surprising or rare event -- it's an event contrary to a law of nature, something that can't have happened unless a generalization we've confirmed countless times has an exception.
  (2) We have no reason at all to believe any law of nature except uniform experience: we've seen the regularity hold again and again and we've never seen it break.
  (3) So the evidence that the law holds on this occasion is as strong as inductive evidence gets. He uses Hume's term for this: a "proof" -- not logical certainty, but a body of experience so large that no finite pile of contrary reports can be stacked against it.
  (4) The evidence for a miracle is testimonial, and testimonial evidence is only ever as good as our track record for witnesses of that kind in circumstances of that kind, which is always finite and imperfect.
  (5) Both bodies of evidence are, in the end, just records of experience, so they're commensurable and the bigger one wins. A finite imperfect record can never outweigh a proof.
  (6) So no quantity of testimony -- however many witnesses, however independent, however sober and disinterested -- can ever make it reasonable to believe a miracle occurred. The rational response is always to conclude the witnesses were mistaken, or lying, or that the report got garbled on its way to us.
  (7) And none of this depends on the content of the miracle, or on lawhood specifically. The same reasoning goes through for any well-confirmed regularity: if we've confirmed that X doesn't happen, testimony that X happened loses by default.

  (7) is the step he thinks is interesting, because it means the argument isn't really about religion. And (7) is also where I lose him, because it seems to swallow things I'm not willing to give up:

  - Take a network of, say, forty instrument chains on four continents, sealed, self-calibrating, triple-redundant, results cryptographically signed and archived with no human in the loop, all reporting that a body in a vacuum chamber accelerated upward for three seconds. He has to say the right response is "the instruments are wrong." But that means no amount of instrumentation could ever disconfirm a law, which I take to be obviously false. He bites the bullet and says we'd have been right to go on believing the law -- which is insane, but I can't say why.
  - Take a modern court case: thirty independent witnesses, none of whom know each other, testify that a man certified dead by two doctors sat up in the morgue and walked out. No law of nature is violated there -- people survive overdoses, doctors misdiagnose -- but "people certified dead don't get up and leave" is about as well confirmed a regularity as you could want. Juries convict on less. His argument seems to say they shouldn't.
  - And then the case he actually cares about: a resurrection-type report attested in several apparently independent sources from two thousand years ago. Here I want his conclusion. I really don't want to end up saying that's credible.

  He has one move I half-understand. He calls it the closure of the test set: a law is only ever confirmed for conditions inside some tested class, and a report from outside that class isn't competing with the law at all, it's just silent about it. That sounds like it dissolves the whole argument -- and he agrees it would, but says it doesn't matter, because we've got no positive reason to think this case is different from the tested ones, and "we have no reason to think it's different" is all the argument ever needed.

  So: which step do I reject? And be honest about the bill -- I'd rather keep (1) through (5) and I'd rather keep (6) for the religious case than give up that the instrument network could ever be right, so tell me what I'm paying if I insist on that combination, and tell me why the step I'm rejecting looked fine in the first place. Also, if it's (7) that goes, I want to know what work "law of nature" vs. "well-confirmed regularity" has to do afterwards, because I have a wierd feeling that the version of the argument that stops at laws is too narrow to be interesting and the version that doesn't eats everything.
reasoning: |-
  Okay, the user is struggling with a Humean argument against miracles that's been extended to cover any well-confirmed regularity. They want to know where the argument breaks down, especially since they agree with its conclusion about religious miracles but find it leads to absurd results in scientific and legal contexts. 

  First, I need to unpack the core tension. The argument treats inductive evidence as monolithic "proof" that can't be outweighed by testimony. But in practice, we constantly allow new evidence to overturn established theories when it's sufficiently robust. The problem lies in how the argument frames the weight of evidence.

  The instrumentation case is key. When forty automated instruments report anomalous data, we don't dismiss it—we investigate. This shows that the argument fails to distinguish between different qualities of counter-evidence. Testimony isn't just "finite experience"; well-designed instrumentation is engineered to produce evidence that's epistemically superior to human testimony. 

  For the courtroom example, "dead men don't walk" is indeed a strong regularity, but the legal system rightly considers multiple independent eyewitnesses as substantial evidence. The argument's flaw is treating all testimony as equally weak when context matters—thirty strangers with no motive to lie constitute a different epistemic category than hearsay.

  Hume's original concern about miracles had an unstated premise: that miracle reports usually come from unreliable contexts (ancient texts, religious fervor). But when applied universally, this premise vanishes. That's why step (7) overextends. 

  The user's hesitation makes sense—they want to preserve Hume's skepticism about religious miracles without endorsing scientific dogmatism. The solution is rejecting the equivalency in step (5). Not all evidence is "just experience"; the structure and reliability of the reporting mechanism matters. We can say ancient resurrection accounts are implausible not because testimony can never outweigh laws, but because ancient testimony lacks modern standards of verification. 

  The "closure of test set" point is a red herring. The argument correctly notes that laws are always conditional, but incorrectly assumes absence of evidence for exceptions means we should ignore testimony. In reality, surprising testimony prompts us to investigate whether conditions were exceptional. 

  Ultimately, the user pays this price: they must accept that testimony can sometimes justify belief in violations of regularities, but can argue that resurrection accounts fail because ancient testimony doesn't meet modern epistemic standards. This preserves scientific flexibility while denying credibility to ancient miracles—which seems to align with their intuitions.
answer: |-
  Here's the breakdown of where the argument fails, why it *seems* compelling, the cost of your preferred combination, and why "law of nature" might be a red herring:

  **The Fatal Flaw: Step (5) - "Commensurable and the Bigger One Wins"**

  This is the core misstep. It falsely equates two fundamentally different *types* of evidence and ignores the *quality* and *structure* of evidence within each "body."

  1.  **Evidence for the Law is Aggregate & Inductive:** It's the massive collection of countless individual observations ("A happened when B") supporting the generalization "Whenever B, A happens." Its strength comes from its sheer volume and consistency *across varied instances*. It establishes a high prior probability that the regularity holds *in general*.
  2.  **Evidence for the Miracle is Specific & Eyewitness:** It's a distinct, specific report (or set of reports) about a *single event*: "At time T, place P, under conditions C, we observed ~A happening despite B." Its strength comes from the *reliability and circumstances* of the *specific reporting mechanism* (witnesses, instruments, process) for *this specific event*.

  **Why Step (5) is Wrong:**

  *   **"Bigger" Isn't Always Better for the Task:** A mountain of evidence establishing a general rule *does not automatically* outweigh a smaller, but highly reliable, body of evidence about a specific exception. The inductive evidence sets the *prior probability* that the exception occurred as *very low*. But the testimonial evidence provides *direct evidence* about that specific event. If the testimonial evidence is exceptionally strong *for that specific case*, it can overcome the low prior probability set by the inductive evidence.
  *   **It Ignores the Nature of the Counter-Evidence:** The argument treats the testimonial evidence as just "a finite pile of contrary reports." But your examples highlight why this is inadequate:
      *   **Instruments:** The network isn't just "a report"; it's a meticulously designed system engineered *specifically* to detect anomalies accurately and rule out error. Its redundancy, independence, lack of human intervention, and calibration make it *epistemically superior* for reporting *this specific event* than the vast inductive evidence *in this specific context*. It's designed to be *more reliable* than the background knowledge for this specific measurement. Dismissing it as "finite and imperfect" ignores its engineered superiority.
      *   **Courtroom:** Thirty independent, disinterested witnesses with no connection, reporting the *same specific, salient event* under good viewing conditions, constitute an *extremely strong specific report*. While "dead men don't walk" is a strong regularity, the specific evidence *for this specific man walking* is powerful. Juries *should* convict on less when the alternative explanations (mass hallucination? vast conspiracy among strangers?) become *less probable* than the reported event, even if it violates a strong regularity. The argument ignores the *implausibility of the alternative explanations required to dismiss the testimony*.
  *   **It Treats Induction as Infallible:** Inductive generalizations, no matter how well-confirmed, are *probabilistic*, not certain. History shows they *can* be overturned by sufficiently robust counter-evidence (e.g., Newtonian physics by Relativity/Quantum Mechanics). Step (5) effectively grants inductive "proofs" a status approaching logical necessity when faced with testimony, which is unjustified.

  **Why Step (5) *Seems* Fine (Especially for Miracles):**

  1.  **Hume's Context:** Hume was primarily targeting *religious miracle reports*, often ancient, second-hand, arising in cultures with strong incentives to believe or fabricate, lacking modern standards of evidence, reporting events inherently tied to specific religious claims. In *this specific context*, characterizing the testimonial evidence as "finite and imperfect" compared to the "proof" of natural law is often *reasonable*. The testimonial evidence *is* usually weak relative to the strong prior.
  2.  **Confirmation Bias:** We intuitively feel that evidence gathered over centuries/globally *must* outweigh a few reports. This feels true for weak testimony (like ancient miracle accounts). The error is generalizing this to *all* testimony, regardless of its quality.
  3.  **The "Proof" Label:** Calling inductive evidence a "proof" (even defined as strong probability) subtly biases the comparison, making it sound like testimony is inherently trying to refute something near-certain.

  **Your Preferred Combination & Its Cost:**

  You want to keep (1)-(5) and (6) for the religious case, but reject the universal application in (7) so your instrument network can be right.

  *   **The Cost:** You must accept that **exceptionally strong, specific testimonial/instrumental evidence *can* rationally justify belief in an event that violates a well-confirmed regularity.** You *cannot* categorically say "testimony can never outweigh a proof."
  *   **Why This Works:** You then argue that **ancient resurrection accounts lack the necessary quality of evidence to overcome the strong prior probability against them.** The sources aren't independent in the modern sense (they share a community and belief system), the reporting chain is long and potentially corrupted, the witnesses aren't disinterested (they were followers), the event type is maximally extraordinary and tied to specific religious claims, and we lack the rigorous verification standards of modern science or law. The testimonial evidence *is* "finite and imperfect" *in this specific case*. The instrument network or courtroom testimony, however, provides evidence of a *different order of reliability* for the specific event it reports.
  *   **What "Law of Nature" vs. "Well-Confirmed Regularity" Does:** Honestly, **very little crucial work.** The core issue is the *strength of the prior probability* established by experience and the *quality of the countervailing evidence* for the specific case.
      *   A "law of nature" is just the *strongest possible* well-confirmed regularity, often thought to be exceptionless. This makes the prior probability *extremely* low.
      *   A strong regularity (like "dead men certified by two doctors don't get up") also sets a very low prior.
      *   The *argument's logic* applies equally to both: strong prior vs. testimonial evidence. The distinction doesn't fundamentally change the epistemic calculation. The difference is in *degree* of prior probability, not kind. Whether you call it a "law" or a "strong regularity," the question remains: "Is the evidence for *this specific exception* strong enough to overcome the very low prior probability?"

  **Why the Narrow Argument (Just Laws) is Still Interesting (and Why (7) Fails):**

  Even if limited to "laws of nature," the argument *is* interesting as a powerful challenge: **Testimonial evidence for a law-breaking event starts with an *extremely* low prior probability. Overcoming this requires *exceptionally* strong, reliable evidence specific to the event.** Hume successfully argues that *the evidence typically offered for religious miracles* fails this test spectacularly. However, step (7) overreaches by claiming *no possible evidence* could *ever* suffice, which your instrument case disproves. The "closure of the test set" point is irrelevant because the instrument network *is* reporting on conditions *within* the tested class (vacuum chambers, controlled labs) – it's just reporting an anomaly *in that class*.

  **Conclusion:**

  *   **Reject Step (5):** Inductive evidence for a regularity and testimonial evidence for a specific exception are not commensurable in a simple "bigger pile wins" way. The *quality, structure, and reliability* of the testimonial evidence for the *specific event* matter critically.
  *   **Cost:** You must accept that sufficiently robust, specific evidence *can* rationally overturn even extremely well-confirmed regularities (whether called "laws" or not). Denying the instrument network or the courtroom witnesses would be irrational dogmatism.
  *   **Keep (6) for Religion:** Argue that *specifically for ancient religious miracle claims*, the testimonial evidence is far too weak and unreliable to overcome the massive prior probability against them. The instrument network and courtroom examples demonstrate the *kind* of evidence that *would* be needed, which the resurrection accounts lack.
  *   **"Law" vs. "Regularity":** This distinction is largely semantic for the argument's core logic. The key is the *strength of the prior probability*, which can be very high for both strong regularities and laws. The argument against testimony works when the prior is high *and* the testimony is weak. It fails when the prior is high *but* the testimony for the specific event is exceptionally strong and reliable.

  Your "weird feeling" is spot-on: the argument stopping at "laws" is too narrow because the core logic applies broadly, but the version applying broadly (step 7) "eats everything" only by making the false step (5) that ignores evidence quality. Rejecting (5) allows you to preserve skepticism about ancient miracles while embracing scientific progress and rational legal verdicts based on strong evidence.
