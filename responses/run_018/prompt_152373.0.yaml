  Next, the teaching sequence must make the distinction feel necessary, not arbitrary. Starting with the Kantian base they know (duty vs. accordance) is smart. Then, building on that to show why motive matters, using the carrying example to contrast different internal reasons. The progression from concrete action to abstract principles should flow naturally.

  Misconceptions are a big concern. Students might confuse right reasons with emotions, guilt, or rule-following. I should address these at specific points. For instance, after introducing affective states, clarify that emotions aren't necessary. When discussing duty, differentiate it from rigid rule-following. Timing is key to prevent these from hardening.

  The diagnostic question at the end needs to test understanding of practical reasoning structure, not just labels. Asking why someone helped despite reluctance could reveal if they grasp the focus on features vs. abstract duty. Maybe ask them to identify the motivation in a new scenario.

  Adjacent debates to avoid include moral worth without explicit knowledge or consciousness of reasons. The user wants to keep it simple, so mentioning these but setting them aside is important to stay focused.

  Time management is crucial. The session is 40 minutes, so each segment should be timed. Activities like pair discussions and the diagnostic question should engage students without taking too long. Ending with the question and a quick recap ensures they leave with the core concept.

  I should also consider the students' background. They've only read an intro text, so avoiding complex theories is necessary. Using relatable examples and clear transitions will help. The peer-teaching aspect means the user needs facilitation tips, like guiding discussions and addressing misconceptions in real-time.

  Finally, the structural distinction needs to be emphasized throughout. Connecting each step back to why the distinction matters—how it affects moral worth—will make it feel necessary. Highlighting the shift from what to why in motives solidifies the concept.
answer: |-
  Here’s a structured 40-minute teaching plan designed to build the distinction between object-directed and principle-directed motivation *conceptually*, using a single concrete example while preempting common misconceptions. The sequence ensures each step logically demands the next.

  **Core Example:**  
  *The Dropped Box Scenario*  
  *You’re walking on a busy campus path. A student ahead of you trips, dropping a heavy box of books. Papers scatter everywhere. They look overwhelmed. You stop to help gather the items, reload the box, and carry it to their next class.*

  ---

  ### **Teaching Plan Sequence** (40 mins total)

  #### **1. Anchor: Recap Kant’s Moral Worth & Duty** (6 mins)
  - **Q1:** *"What makes an action have ‘moral worth’ for Kant?"*  
    (Prompt recall: Action from duty > action merely in accordance with duty).  
  - **Q2:** *"In the dropped box scenario, what would ‘acting in accordance with duty’ look like vs. ‘acting from duty’?"*  
    (E.g., Helping to impress a professor [accordance] vs. helping because it’s right [duty]).  
  - **Why this order:** Establishes baseline understanding. Uses familiar Kantian frame to transition deeper.

  #### **2. Problem: Why "Because It’s Right" Isn’t Enough** (8 mins)
  - **Activity:** *Pair discussion—* "Imagine two helpers:  
    *Sam* helps because *"I know I ought to help someone in distress."*  
    *Alex* helps because *"This person is struggling and needs help right now."*  
    **Q:** *Do both act ‘from duty’? Does one feel different? Why?"*  
  - **Reveal:** Both *could* act from duty. But Kant’s "because it’s right" is vague—we need to unpack *how* the reason functions in their mind.  
  - **Key Insight:** Introduce terms *without jargon*:  
    > *"Sam is focused on a* ***rule*** *in their head (‘help the distressed’). Alex is focused on* ***this person’s struggle*** *in front of them."*  
  - **Why this order:** Creates cognitive tension—students sense a difference Kant doesn’t resolve. Forces attention to *structure* of reasoning.

  #### **3. Introduce Structural Distinction via Scenario** (12 mins)
  - **Map the Motivations:**  
    - **Sam (Principle-Directed):**  
      *Trigger:* Sees scattered papers → *Thought:* "This falls under ‘helping the distressed’ → *Motivation:* "I must fulfill my duty to help."  
      → **Moved by abstract principle.**  
    - **Alex (Object-Directed):**  
      *Trigger:* Sees overwhelmed person → *Thought:* "They need aid *now*" → *Motivation:* "This situation demands help."  
      → **Moved by concrete moral features (distress, need).**  
  - **Clarify:** Both are "right reasons" (duty-based), but *what they attend to* differs:  
    - **Principle-directed:** Duty *mediates* the response (principle → act).  
    - **Object-directed:** Moral features *directly* move you (situation → act).  
  - **Why this order:** The scenario makes the distinction *visible* after the problem step. Labels now describe observed reasoning structures.

  #### **4. Intercept Misconceptions** (6 mins, integrated with step 3)  
  - **Misconception 1: "Right reasons = Warm feelings"**  
    *Intercept when contrasting Sam/Alex:*  
    *"Alex might feel compassion, but suppose they’re calm. Or Sam feels proud of ‘doing duty.’ Feelings don’t make it object-directed. Focus on* ***what their mind is responding to*** *— the rule or the need?"*  
  - **Misconception 2: "Principle-directed = Mechanical rule-following"**  
    *Intercept when explaining Sam:*  
    *"Sam isn’t robotic! They* understand *the principle applies here. But their reason for acting is* loyalty to the rule itself*, not (just) the person’s pain."*  
  - **Misconception 3: "Object-directed = No principles"**  
    *Intercept when explaining Alex:*  
    *"Alex isn’t rejecting rules! The principle* describes *why the features matter. But Alex is moved* by the features themselves*, not by ‘checking a rule.’"*  

  #### **5. Diagnostic Question** (5 mins)  
  - **Q:** *"Imagine a third helper, Taylor. Taylor hates interacting with strangers and feels reluctant, but helps because ‘no one else is stopping, and this person’s isolation is unbearable.’ Is Taylor’s motivation object-directed or principle-directed?* ***Why?****"*  
  - **Why it works:** Tests if they see past affect (reluctance) to structure ("isolation" as concrete feature). Correct answer (object-directed) requires recognizing responsiveness to the situation’s properties, not principle invocation.

  #### **6. Consolidate & Set Boundaries** (3 mins)  
  - **Summary:** *"Moral worth requires acting for the right reasons—but we’ve seen these reasons can function differently: directly responsive to the world (object-directed) or responsive to a principle representing the world (principle-directed)."*  
  - **Explicitly Exclude:**  
    *"Today we* **didn’t settle** *whether explicit moral knowledge is required, or if reasons must be conscious. Those are debates for later! We focused solely on* how reasons structure your response to duty*."*  

  ---

  ### **Why This Dependency Order Matters**
  1. **Kant Recap → Problem:** Creates necessity for distinction. If "from duty" is sufficient, why analyze further? The Sam/Alex contrast shows a gap.  
  2. **Problem → Distinction:** The scenario resolves the tension *only* by differentiating structures. The labels *emerge* as solutions.  
  3. **Distinction → Misconceptions:** Addresses biases *after* distinction is visible but before they distort understanding. Correcting "warm feelings" *during* Alex/Sam comparison anchors it concretely.  
  4. **Diagnostic Q last:** Ensures application of structural insight (reluctant Taylor) without relying on labels alone.  

  ### **Materials & Facilitation Tips**
  - **Scenario Visual:** Sketch the dropped box scene on board. Add thought bubbles for Sam/Alex/Taylor.  
  - **Pacing:** Strict timekeeping! Use pair discussions (step 2) to engage and reset attention.  
  - **Language:** Avoid "deontic," "phenomenology," etc. Use "concrete features," "abstract rule," "what your mind is focused on."  
  - **Common Pitfall:** Students may conflate "principle" with "maxim." Gently clarify: "Here, ‘principle’ means a general moral rule like ‘help those in need.’"  

  This sequence builds the distinction as the *key* to resolving the ambiguity in Kant’s "acting from duty," using a relatable case to make abstract reasoning tangible. By excluding adjacent debates, you keep focus on the structural insight central to moral worth.
