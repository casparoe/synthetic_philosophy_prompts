  Strawson would likely argue that resentment towards the AI itself isn't valid because it's not a moral agent. But he might acknowledge that the anger is a natural human reaction. The challenge is redirecting that anger towards the responsible humans—developers, corporations, regulators. 

  The user also questions if allowing such attitudes weakens Strawson's link to human relationships. I think Strawson could maintain his stance by distinguishing between the immediate object of anger (the AI) and the valid target (humans involved). The resentment, while initially directed at the AI, reveals underlying expectations of the people behind it. 

