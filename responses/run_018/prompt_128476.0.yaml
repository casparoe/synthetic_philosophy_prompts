  First, I need to recall Strawson's main arguments in "Freedom and Resentment." He emphasized that reactive attitudes are rooted in interpersonal relationships. Resentment makes sense when we hold someone accountable because we see them as a moral agent. So, applying this to AI, which isn't a person, could be tricky. The user is aware of the distributed training process, which complicates assigning blame to a specific human.

