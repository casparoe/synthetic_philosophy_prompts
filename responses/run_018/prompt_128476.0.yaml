prompt: |-
  If Peter Strawson were around today and saw people getting genuinely angry at chatbots that spew slurs or cause real-world harm after being fine-tunned with RLHF, do you think he'd treat that as a genuine reactive attitude—like resentment—or dismiss it as a kind of category mistake? I'm not asking for a biography; I want you to reconstruct his logic about the interpersonal nature of these attitutes and apply it to a case where there's no single human agent behind the specific act, just a distributed training process and a reward model. Would he say the resentment is misdirected but still morally informative, or that it collapses once you realize there's no 'other' to hold to account? And if he did allow it, what does that do to his claim that reactive attitudes are essentially tied to participation in human relationships?
