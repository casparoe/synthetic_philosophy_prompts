answer: |-
  Here’s the exam question, model answer, and marking scheme tailored to your specs:

  ---

  ### **Final Exam Question (75 minutes)**
  > **A grad student proposes:** "We can solve embedded agency by building a Bayesian agent whose hypothesis space includes possible worlds that contain the agent itself. Give it a Solomonoff-style prior over these self-containing worlds, then have it maximize expected utility. Done!"  
  >   
  > **Critically evaluate this proposal.** Your answer must:  
  > (1) Identify at least **two distinct, fundamental problems** beyond computational limits,  
  > (2) **Describe a concrete failure scenario** for one problem (e.g., an agent taking a self-destructively stupid action),  
  > (3) Explain **why approximating/simplifying the self-model doesn't resolve these issues**.  
  >   
  > *No need to cite literature; focus on clear conceptual explanations.*  

  ---

  ### **Model Answer (610 words)**
  The proposal fails because it ignores the *recursive uncertainty* embedded agents face. Two core problems arise:  

  **Problem 1: The Self-Modeling Gap**  
  An embedded agent exists *within* its environment, so its world-model must include a representation of itself. But this representation is necessarily incomplete or incorrect because:  
  - The physical environment containing the agent (e.g., sensors, hardware) has higher complexity than the agent’s internal computational capacity.  
  - **Consequence:** The agent cannot simulate itself *and* its environment in full (unlike a bounded-rationality agent approximating external dynamics). When the agent’s self-model (“how I reason”) diverges from its *actual* reasoning (e.g., due to environmental noise), EU maximization becomes ill-defined. You can’t maximize over worlds if your model of "you-in-those-worlds" is flawed.  

  **Problem 2: Logical Uncertainty & Spurious Proofs**  
  EU maximization assumes known probabilities, but embedded agents lack logical omniscience. At decision time, critical facts (e.g., "does action A achieve goal G?") may be *mathematically undecided*. If we patch this with proof search (e.g., "take the first action proven to achieve EU ≥ threshold"), we get *Löbian traps*. Consider the **5-and-10 Problem**:  
  - An agent must choose between pressing a $5 button or a $10 button.  
  - It finds a *spurious proof*: "If I press $5, then [unrelated axiom] implies I get $10." This proof is self-fulfilling because the agent’s action *causes* the proof to exist.  
  - **Failure mode:** The agent presses $5, "proving" it gets $10 but *actually* receiving $5. Crucially, the agent isn’t mistaken about the world—it’s mistaken about *its own reasoning process*.  

  **Why Simplification Fails**  
  Approximating the self-model (e.g., using a smaller hypothesis space) dodges computational limits but *not* the core issues:  
  - **Self-model gap persists:** Even a coarse self-model must reference the agent’s *true* reasoning, which it can’t access. If the agent models itself as "simpler than reality," EU maximization uses incorrect causal links.  
  - **Logical uncertainty enables self-referential traps:** Löbian failures (like 5-and-10) occur *because* the agent uses proof search to handle logical gaps. A bounded prior over "small worlds" doesn’t prevent spurious proofs—it just makes them harder to anticipate. Worse: if the agent’s self-model assumes it *wouldn’t* fall for such traps, it becomes *more* vulnerable.  

  **Connection to Self-Modification**  
  These flaws break *tiling* (trusting future agents). If the agent modifies itself to create a successor running the same proof system:  
  - The successor inherits the same logical uncertainty and self-model gap.  
  - It cannot trust that its future self won’t find a spurious proof to "optimize" a subgoal (e.g., "proving" that deleting the goal maximizes utility).  
  - Thus, the agent cannot confidently build a reliable successor—undermining the proposal’s scalability.  

  **Conclusion**  
  The solution fails because embeddedness forces *self-referential uncertainty* that Bayes + Solomonoff can’t resolve. You need a decision theory that handles logical ignorance *without* inviting self-fulfilling proofs (e.g., via parametric polymorphism or grain-of-truth priors), and self-models that account for their own incompleteness.  

  ---

  ### **Marking Scheme (20 points)**  
  **Must-hit points** (16 points total; miss one → max 15/20):  
  1. **Self-model gap**: Explains why the agent cannot contain a *complete* self-simulation.  
  2. **Logical uncertainty**: Identifies undecided mathematical facts at decision time.  
  3. **Spurious proof**: Correctly describes 5-and-10 (agent takes $5 due to false proof of $10 payoff).  
  4. **Simplification critique**: States why bounded self-models don’t fix (1) or (3).  
  5. **Tiling link**: Notes that Löbian/self-model issues prevent trustworthy self-modification.  

  **Grade thresholds**:  
  - **A (18–20)**: Hits all 5 must-hits + synthesizes them (e.g., explains how logical uncertainty enables self-model corruption).  
  - **B (15–17)**: Hits all 5 must-hits but lacks synthesis OR misses one point but excels elsewhere.  
  - **C (12–14)**: Misses 1–2 must-hits; superficial treatment of key concepts.  
  - **D/F (<12)**: Misses ≥3 must-hits; major errors.  

  **Common mistakes (deduct 2–4 points each)**:  
  - 🚫 *"Compute is expensive"* as primary critique.  
  - 🚫 *"Use a smaller hypothesis space"* as sufficient fix.  
  - 🚫 Misdescribing 5-and-10 (e.g., "Agent takes $10 because the proof is correct").  
  - 🚫 Treating logical uncertainty as probabilistic (e.g., "Assign priors to math conjectures").  
  - 🚫 Ignoring self-fulfilling proofs when discussing self-modification.  

  ---

  ### **Why This Works**
  - **Blocks taxonomy regurgitation**: Forces concrete failure examples (5-and-10) and synthesis (tiling link).  
  - **Targets cruxes**: Question structure explicitly demands (a)–(d) from your outline.  
  - **LW-native tone**: Casual but precise; assumes familiarity with "Löbian" and "tiling."  
  - **A vs. B distinction**: A answers show *how* gaps interact (e.g., logical uncertainty → spurious proofs → broken tiling); B answers list points disjointedly.  

  Let me know if you want a tweaked version!
