answer: |-
  ### Taxonomy: Occasionalism and Scientific Explanatory Practice

  This decision tree classifies positions on whether occasionalist metaphysics (where God is the sole efficient cause) can be reconciled with scientific explanatory practice, particularly interventionist accounts of causation (which analyze causation as counterfactual dependence under interventions). The tree begins with a root question about divine causality, then branches on the ontological status of secondary causes and the applicability of interventionist counterfactuals. Each leaf names a position, states its core commitment, and identifies its most awkward philosophical burden. Unoccupied nodes are flagged with a diagnosis.

  ---

  **Root Question:**  
  In cases like fire burning cotton or medicine curing disease, is God the sole efficient cause (i.e., is the effect directly produced by God without any causal power in secondary causes like fire or medicine)?  
  - **No** → Proceed to Leaf 1.  
  - **Yes** → Proceed to Question 1.  

  ---

  **Question 1 (for "Yes" to root):**  
  Do secondary causes (e.g., fire, medicine) possess any *ontological reality* (i.e., are they real, God-created features of the world), or are they purely *epistemic conveniences* (i.e., useful human constructs for describing patterns, with no independent reality)?  
  - **Purely epistemic conveniences** → Proceed to Question 2A.  
  - **Some ontological reality** → Proceed to Question 2B.  

  ---

  **Question 2A (for "Epistemic conveniences"):**  
  Can interventionist counterfactuals (e.g., "If we intervened to remove the fire, the cotton would not burn") describe *real dependencies* among created things (i.e., do they track mind-independent relations), or do they merely describe *stable regularities in divine action*?  
  - **Describe real dependencies** → *Unoccupied node* (diagnosis: **incoherent**—if secondary causes are purely epistemic, there are no real created dependencies for counterfactuals to track).  
  - **Describe divine regularities** → **Leaf 2: Hard Occasionalism**.  
    - *Awkward commitment*: It must deny that scientific explanations refer to real causal structures, reducing them to predictive tools for divine habits.  

  ---

  **Question 2B (for "Some ontological reality"):**  
  Can interventionist counterfactuals (e.g., "If we intervened to administer the medicine, the disease would be cured") describe *real dependencies* among created things (i.e., do they track mind-independent relations sustained by God), or do they merely describe *stable regularities in divine action*?  
  - **Describe real dependencies** → **Leaf 3: Interventionist-Reconstructed Occasionalism**.  
    - *Awkward commitment*: It must explain how God’s direct causation preserves (rather than overrides) real created dependencies, without collapsing into non-occasionalist concurrentism.  
  - **Describe divine regularities** → **Leaf 4: Inefficacious Realism**.  
    - *Awkward commitment*: It must hold that secondary causes are ontologically real but lack any causal efficacy, rendering their "reality" explanatorily inert for science.  

  ---

  **Leaf 1 (from "No" to root):**  
  **Non-Occasionalist Theism** (e.g., concurrentism, deism, or naturalism).  
  - *Awkward commitment*: It must avoid making divine action either redundant or disruptive relative to natural causes.  

  ---

  ### Key Notes:
  1. **Unoccupied Node**: The branch for "epistemic conveniences + real dependencies" (under Question 2A) is **incoherent**—it requires real dependencies among created things while denying their ontological basis.  
  2. **Indistinguishable Pair**: The tree **cannot distinguish** between *Hard Occasionalism* (Leaf 2) and *Inefficacious Realism* (Leaf 4) on the question of divine arbitrariness. Both allow for miracles (divine deviations from habit), but this isn't captured by the branching logic.  
  3. **Clarifications**:  
     - *Hard Occasionalism* denies all created causality; science is descriptive, not explanatory.  
     - *Interventionist-Reconstructed Occasionalism* "saves" science by grounding counterfactuals in real (though God-dependent) created structures.  
     - *Inefficacious Realism* is **unattractive** due to its inert ontology; it is rarely defended and mostly unexplored.  
     - *Non-Occasionalist Theism* is included to contrast with occasionalism but is not part of the reconciliation project.  

  ---

  \answer{4, 1, Hard Occasionalism and Inefficacious Realism}
