    Given the time, I recommend sticking to the business asset only. The disagreement point is what they get from the business in case of disagreement. If they can force a sale and get $50,000 each, then dA=50000, dB=50000. Split the surplus 0 -> each gets $50,000.

    If partner A can walk away and not participate in the sale, then the sale might not happen? Then dB=0 and dA=0? But that's not true because partner B could force a sale and then partner A would be forced to take their share? So dA=50000, dB=50000.

    In summary, the examples show that defining the disagreement point is critical and sometimes difficult, especially when there are external opportunities. The method might break down when:

        a) The disagreement point cannot be quantified or agreed upon.
        b) There are external opportunities that are not part of the asset being divided but affect the parties' willingness to accept a deal.

    Also, the method assumes that the asset is divisible and that the value is transferable. It might not work for non-monetary assets.

    Given the mediator's time constraint and the need for simplicity, I recommend:

        - Only consider the asset being split.
        - Define the disagreement point as what each would get from that asset if they don't agree (e.g., from a forced sale, based on legal ownership).
        - If there is no forced sale mechanism and they would get nothing, then dA=0, dB=0.
        - Calculate the surplus and split it equally.

    This is essentially the Nash bargaining solution in the symmetric case, and it is also the Kalai-Smorodinsky solution in the linear case.

    But note: the equal split of the surplus might not account for differential needs or moral claims. The mediator might need to use their judgment if the parties feel it is unfair.

    Finally, the method breaks down when the surplus is negative (total < d1+d2). Then we have to renegotiate or declare an impasse.

    Given the time, we'll wrap up with a simple procedure:

    **Final Checklist (30 minutes):**

    1. **Explain the goal (2 minutes):** "We'll determine a fair split by considering what you would get if you don't agree and then sharing the extra value equally."

    2. **Determine the total value (3 minutes):** "What is the total value of the asset being divided? (e.g., the current market value of the food truck)"

    3. **Determine the disagreement point (10 minutes):** 
          - "If we don't reach an agreement, what happens to this asset? How much would each of you get from it? (e.g., would you sell it and split the money? How?)"
          - If they have a prior agreement (like 50/50 in case of disagreement), use that.
          - If they don't know, assume a forced sale and subtract costs (e.g., legal fees 20%), then split the remainder based on ownership (usually 50/50 if equal partners).
          - If they are the only owner and can't sell without the other, then they get $0 in case of disagreement? But that might not be true. This is a judgment call.

    4. **Calculate (5 minutes):**
          - Total = T
          - dA, dB
          - Surplus = T - dA - dB
          - If surplus < 0: Stop. "You cannot both get your minimums. You must either lower your minimum requirements (reevaluate what you would get in disagreement) or find additional value."
          - If surplus >=0:
               - A gets: dA + surplus/2
               - B gets: dB + surplus/2

    5. **Present and discuss (10 minutes):** 
          - Explain the result.
          - If they think it's unfair, ask why. If it's about external factors (like one needs more because they are broke), explain that the method is based on the asset and their alternatives within it. They can choose to adjust based on need, but that's outside the model.

    This procedure is not perfect, but it is a structured approach that can be done in 30 minutes.
answer: |-
  Below is a practical, step-by-step checklist for applying the **Kalai-Smorodinsky (KS) bargaining solution** in community mediations. It’s designed for non-math users, fits into a 30-minute session, and addresses your concerns about fairness, hidden information, and breakdowns. I’ll then apply it to your three examples and flag limitations.

  ---

  ### **Kalai-Smorodinsky Checklist (30-Minute Mediation)**
  **Goal**: Fairly split a shared asset (e.g., food truck, grant money) by ensuring both parties gain proportionally from their worst-case fallback to their best-case ideal.  
  **Core Idea**:  
  - **Worst-case (Disagreement Point)**: What each gets if they walk away.  
  - **Best-case (Utopia Point)**: What each *could* get in an ideal world.  
  - **Solution**: Split so both move the **same fraction** toward their best-case from their worst-case.  

  #### **Step 0: Prep (2 min)**  
  - **Say**: “We’ll find a split where both of you gain equally *proportionally* from your worst-case scenario.”  
  - **Need**: A whiteboard or paper to draw a simple graph (see Step 4).  

  #### **Step 1: Define the Asset (3 min)**  
  - **Ask**: “What’s the total value of what you’re splitting?” (e.g., “The food truck sells for $20K,” or “$10K grant money left.”)  
  - **Enough Info?** Must get a **number** (e.g., market value, cash amount).  
  - **Hard Stop?** If they can’t agree on the total value → **Pause mediation**. Resolve this first.  

  #### **Step 2: Define Worst-Case Fallbacks (Disagreement Point) (10 min)**  
  - **Ask Each**: “If we *don’t* agree today, what do you walk away with? Be honest—this is your safety net.”  
  - **Examples**:  
    - Job offer salary ($50K/year), unemployment benefits ($0), scholarship value ($5K), or forced sale proceeds.  
    - If no fallback → **$0**.  
  - **Enough Info?** Must get **numbers** for both parties.  
  - **Judgment Call**:  
    - If a party is vague (e.g., “I’ll find something”), ask: “What’s the *lowest* you’d accept to walk away?”  
    - If they hide options (e.g., secret job offer), use what they *disclose*. (See Example 3 for fallout.)  
  - **Hard Stop?** If parties dispute facts (e.g., “They *do* have a job!”) → **Verify with evidence** (e.g., offer letter) or skip to backup (e.g., equal split).  

  #### **Step 3: Define Best-Case Dreams (Utopia Point) (5 min)**  
  - **Ask Each**: “If the other person gave you *everything*, what’s the most you could get?”  
    - Usually, this is the **total asset value** (e.g., $20K truck → $20K for each).  
  - **Enough Info?** Default to the total asset value if no other number is given.  
  - **Judgment Call**: If one claims they “deserve more,” note it but use the total value.  

  #### **Step 4: Calculate the KS Split (5 min)**  
  - **Draw a Graph**:  
    - X-axis: Party 1’s gain (from $0 to total value).  
    - Y-axis: Party 2’s gain.  
    - Plot:  
      - **Worst-case (d)**: Bottom-left corner (e.g., [$0, $0]).  
      - **Utopia (u)**: Top-right corner (e.g., [$20K, $20K]).  
  - **Formula**:  
    - Party 1’s gain = `d1 + [(u1 - d1) / (u1 - d1 + u2 - d2)] * (Total Value - d1 - d2)`  
    - Party 2’s gain = `d2 + [(u2 - d2) / (u1 - d1 + u2 - d2)] * (Total Value - d1 - d2)`  
  - **Shortcut for Non-Math Users**:  
    - Calculate **surplus** = Total Value - d1 - d2.  
    - Calculate **Party 1’s fraction** = `(u1 - d1) / [(u1 - d1) + (u2 - d2)]`  
    - Party 1 gets = `d1 + (fraction * surplus)`  
    - Party 2 gets = `d2 + [(1 - fraction) * surplus]`  
  - **Enough Info?** All numbers from Steps 1-3.  

  #### **Step 5: Reality Check & Agreement (5 min)**  
  - **Say**: “This split gives you both the same *proportional gain* from your worst-case.”  
  - **Judgment Call**:  
    - If one protests (e.g., “But I need more!”), acknowledge: “This is math-based, but we can adjust if you both agree.”  
    - If surplus is **negative** (Total Value < d1 + d2) → **Hard stop**. No feasible split.  
  - **Agreement**: Shake hands, sign a memo.  

  ---

  ### **Applied to Your Examples**  
  #### **Example 1: Food Truck Split**  
  - **Total Value**: $20K (sale price).  
  - **Worst-Case**:  
    - Party A (job offer out of town): Can earn $50K/year → **$0** from truck (they walk away).  
    - Party B (no fallback): **$0** from truck.  
  - **Utopia**: $20K each (total truck value).  
  - **Surplus**: $20K - $0 - $0 = $20K.  
  - **Fractions**:  
    - A’s fraction = ($20K - $0) / [($20K - $0) + ($20K - $0)] = 0.5  
    - B’s fraction = 0.5  
  - **KS Split**:  
    - A gets = $0 + (0.5 * $20K) = **$10K**.  
    - B gets = $0 + (0.5 * $20K) = **$10K**.  
  - **Why Fair?** Both gain 100% from their worst-case ($0 → $10K). Job offer is irrelevant because it’s external to the truck.  

  #### **Example 2: Artists’ Grant Money**  
  - **Total Value**: $10K grant.  
  - **Worst-Case**:  
    - Artist A (backup scholarship): **$0** from grant (they keep $5K scholarship).  
    - Artist B (broke): **$0** from grant.  
  - **Utopia**: $10K each (total grant value).  
  - **Surplus**: $10K - $0 - $0 = $10K.  
  - **Fractions**:  
    - A’s fraction = ($10K - $0) / [($10K - $0) + ($10K - $0)] = 0.5  
    - B’s fraction = 0.5  
  - **KS Split**:  
    - A gets = $0 + (0.5 * $10K) = **$5K** (total wealth = $5K scholarship + $5K = $10K).  
    - B gets = $0 + (0.5 * $10K) = **$5K**.  
  - **Why Fair?** Both gain equally from the grant. Scholarship is external.  

  #### **Example 3: Hidden Amazing Outside Option**  
  - **Total Value**: $100K business.  
  - **Worst-Case (based on lies)**:  
    - Party A (hides job offer): Claims **$0** fallback.  
    - Party B (no fallback): **$0**.  
  - **Utopia**: $100K each.  
  - **KS Split**: $50K each (as in Example 1).  
  - **Reality**: Party A reveals *after* they have a secret job offer worth $200K/year.  
    - **Fallout**: Party B is furious because true worst-case:  
      - A’s fallback = $200K job → **$0** from business.  
      - B’s fallback = **$0**.  
    - KS still splits $50K/$50K (since fallbacks are both $0).  
    - **Why B is Furious**: KS doesn’t punish lying. A gets $50K *plus* $200K job, while B only gets $50K.  
  - **Mediator Fix**:  
    - Pre-empt lying in **Step 2** by requiring proof (e.g., “Show offer letters”).  
    - If caught later, **re-run KS with true fallbacks** (still $50K/$50K here).  
    - Use **moral leverage**: “You manipulated the process. We should adjust for fairness.”  

  ---

  ### **Where KS Breaks Down (Don’t Use It When…)**  
  1. **Surplus is Negative** (Total Value < d1 + d2):  
     - E.g., Asset = $10K, but one’s fallback = $8K, other’s = $3K → $10K < $11K.  
     - **Solution**: Switch to needs-based mediation.  

  2. **Non-Quantifiable Values** (e.g., emotional labor, reputation):  
     - KS requires numbers. If parties fixate on “fairness” beyond math, use a **values-based framework** (e.g., “What does fairness mean to you?”).  

  3. **Hidden Information/Manipulation**:  
     - As in Example 3, KS can’t retroactively fix lies. Mitigate by:  
       - Requiring proof for fallbacks.  
       - Adding a penalty clause (e.g., “If you hide options, you forfeit 20%”).  

  4. **Asymmetric Power Dynamics**:  
     - E.g., One party fears the other → may understate their fallback.  
     - **Solution**: Interview parties separately first.  

  5. **Indivisible Assets** (e.g., a single food cart):  
     - KS assumes money-like division. If asset can’t be split, use:  
       - **Buyout**: One pays the other (using KS to set price).  
       - **Lottery**: Random assignment with side payments.  

  ---

  ### **Summary**  
  - **Use KS when**: Splitting money or quantifiable assets with clear fallbacks.  
  - **Avoid KS when**: Emotions dominate, assets are indivisible, or fallbacks are disputed.  
  - **Mediator Script**:  
    > “We’ll ensure both of you gain the same *percentage* from your worst-case scenario. No math needed—just honesty about your alternatives.”  

  This method prioritizes proportional fairness over equal splits, but its success hinges on **transparency** in Steps 2 and 3. Always leave room for renegotiation if values (e.g., “I built this with my hands!”) override the numbers.
