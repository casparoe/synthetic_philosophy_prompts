  ---

  ### **Component Breakdown**
  #### **(1) Intentionality Necessity vs. Functional Sufficiency**  
  *Probability that institutional role/function suffices for illocutionary force without biological intentionality:* **`0.65`**  
  - **Case for functionalism**: Legal systems already recognize corporate "speech" (e.g., contracts signed by bots, auto-generated stock trades). Searle's "Background" capacities might be replicable institutionally.  
  - **Case against**: Promises imply commitment to *intend* future action (Searle, 1969). Without consciousness, it may only be *as-if* intentionality.  
  - *Key evidence shift*: Neuro-AI alignment proving artificial systems exhibit goal-directed commitment (e.g., AI consistently acts to fulfill "promises" without prompting).

  #### **(2) Distributed Agency Satisfies Conditions**  
  *Probability that model weights + data + prompt engineer satisfy agency requirements from (1):* **`0.55`**  
  - **Pro**: Human-AI systems as "hybrid agents" (e.g., *users delegate speech acts* to tools, like CEOs using autopens). Training data encodes human intentionality.  
  - **Con**: No singular locus of responsibility. Gradient descent isn’t "committing"; it’s optimizing.  
  - *Least confident term here*. Shifted by: Legal precedent assigning liability to *users* of AI tools (e.g., "The human promisor is the one who deployed the LLM").

  #### **(3) Institutional Recognition Regardless of Philosophy**  
  *Probability institutions treat synthetic utterances as binding:* **`0.85`**  
  - Courts enforce clickwrap agreements signed by bots (e.g., *N.G. v. Amazon*). UCITA/UETA laws validate automated messages. Regulatory bodies (e.g., SEC) fine firms for AI-generated false promises.  
  - *Shifted by*: Landmark case explicitly voiding an AI "promise" due to lack of agency.

  #### **(4) Perlocutionary Effects Without Illocution**  
  *Probability perlocution (e.g., reliance, legal consequences) occurs without "genuine" illocution:* **`0.95`**  
  - If an AI's "promise" causes a client to forfeit other contracts, courts *will* assign damages (perlocution is observer-relative).  
  - *Crucially*: Perlocution doesn’t require illocutionary validity (e.g., a forged will still causes inheritance disputes).

  #### **(5) Frame Collapse (Simulation/Enactment Distinction Dissolves)**  
  *Probability the distinction is incoherent:* **`0.40`**  
  - Wittgenstein/Dennett: Intentionality is *ascribed* based on behavior, not intrinsic. If institutions treat AI promises as real, the force is *de facto* real.  
  - Counter: Illocutionary acts require conventional *uptake* (Austin). If humans accept AI promises, force exists *by convention*.  

  ---

  ### **Probability Synthesis**  
  The middle ground exists if:  
  - Functional role suffices **AND**  
  - Distributed agency qualifies **AND**  
  - Institutions recognize it *or* the distinction collapses.  

  Using rough independence:  
  `P(Middle Ground) = P(1) × P(2) × [P(3) + P(5) - P(3)×P(5)] + P(4) (as backstop)`  
