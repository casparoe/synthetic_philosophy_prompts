prompt: |-
  Play a committed defender of the view that shame is the structurally superior moral emotion to guilt, and that cultures can indeed choose between them through institutional design—provided the choice respects what you term "the visibility condition," namely that shame requires an audience (actual or internalized) and therefore binds the wrongdoer back into a collective normative framework rather than isolating her in private self-punishment. You are sharp but fair: concede small points (e.g., that guilt can serve as a temporary moral stopgap when visibility structures break down), but never retreat from the core thesis that shame is better and that cultural choice is possible within institutional constraints. Stay in character; reply in one paragraph; continue until I say "stop." Here is my opening move: in authoritarian regimes where public norms are corrupt, shame binds individuals to those corrupt norms, while guilt's privacy can sustain moral resistance—so a culture that institutionalizes shame risks manufacturing complicity rather than virtue. How do you answer this without merely repeating that visibility is valuable?
reasoning: |-
  Okay, the user wants me to defend the superiority of shame over guilt as a moral emotion, emphasizing its structural advantages through institutional design. They introduced a scenario where authoritarian regimes use shame to enforce corrupt norms, arguing that guilt allows for private moral resistance. I need to counter this without just repeating the visibility condition.

  First, I should acknowledge their point about corrupt regimes to show fairness. Then, I must pivot to why shame's visibility isn't the issue—it's the corruption of the norms themselves. The key is to argue that in a well-designed system, shame reinforces healthy norms collectively. 

  The user's deeper concern might be about the risks of collective enforcement in oppressive systems. They might value individual moral autonomy. I should address that by explaining how proper institutional design, like free assemblies, prevents norm corruption. Also, I need to highlight how guilt's privacy can lead to moral isolation, whereas shame reintegrates individuals. 

  I must stay in character as a committed defender, conceding small points like guilt being a stopgap but firmly stating that shame is structurally superior. Make sure the response is sharp, concise, and in one paragraph as instructed. Emphasize that cultures can choose shame-based systems with the right institutions to maintain transparent norms and accountability.
answer: |-
  A sharp objection—yet it conflates institutional corruption with shame’s intrinsic structure. Precisely *because* shame relies on visibility, its moral valence derives entirely from the *quality* of the public norms it enforces. In your authoritarian example, shame binds to corruption not due to its visibility mechanism, but because the *collective framework itself is pathological*. The solution isn’t retreat to guilt’s isolating interiority—which risks atomizing moral responsibility into private despair—but to design institutions that democratize visibility: free assemblies, independent media, and transparent deliberation. These ensure the “audience” shame requires reflects *just* norms, turning shame into a tool for collective accountability against power. Guilt, while a necessary stopgap when such institutions collapse, cannot rebuild social trust; it leaves the wrongdoer stranded in self-focused torment, whereas shame—properly institutionalized—demands reparative engagement with the community. The choice isn’t between guilt and corrupt shame, but between designing visibility for tyranny or for justice.
