  I'm preparing the final assessment for an upper-level undergraduate seminar in moral psychology, and I need an essay question on moral worth and acting for the right reasons that cannot be answered by reciting standard Kantian or Aristotelian summaries. To push students past memorized labels, please embed the following constructed conceptual framework directly into the exam prompt: define counterfactual stability of moral motivation as the condition that an agent's correct reason for acting would remain causally effective in nearby possible worlds where a contingent, non-moral psychological feature—here, a recent traumatic experience of property loss that generates an acute but unendorsed aversion to retaining others' belongings—is absent. The scenario should present an agent who returns a lost wallet for the genuinely right reason, respect for the owner's claim, yet admits that without the trauma-induced aversion they would likely have kept it. The exam question should ask students to determine whether this agent deserves full moral worth, partial worth, or none, and to defend their answer by addressing whether moral credit requires not merely the presence of a right reason but also its independence from such contingent psychological scaffolding.

  Please provide: (1) the exam question itself, designed for a 60-minute handwritten essay of approximately 800 words, explicitly instructing students not to rely on bibliographic citations, reading lists, or external texts; (2) a model answer of about 700 words that distinguishes at least three positions—full credit, partial credit, and denial of credit—explains the specific conceptual error in each rival view (for example, conflating causal origin with normative justification, or treating overdetermination as automatically undermining worth), and argues for one position by appealing to the stability condition rather than to authority; and (3) a marking scheme out of 25 total marks that separates an A-range answer (22–25) from a B-range (18–21) and C-range (14–17) by listing the specific argumentative moves required at each level—such as distinguishing the presence of a reason from its causal dominance, handling the overdetermination problem, and avoiding the fallacy of equating contingent psychological origin with moral reason content. The scheme should also identify the two or three most common mistakes that should cost 2–3 marks each, for instance treating the trauma as itself a moral reason or appealing to what a canonical figure said without conceptual application. The assessment should be self-contained: students should need no knowledge beyond what the prompt supplies.
