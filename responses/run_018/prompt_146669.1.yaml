answer: |-
  ### Exam Question: Moral Worth and Counterfactual Stability  
  **(Time: 60 minutes; Word Guideline: ~800 words)**  

  **Prompt:**  
  Dr. Rivera returns a lost wallet to its owner solely because they recognize it belongs to another person and believe returning it expresses respect for the owner’s rightful claim. However, Dr. Rivera discloses that without a recent traumatic experience (a burglary that instilled an intense, unendorsed aversion to retaining others’ property), they would likely have kept the wallet. While respect for the owner’s claim *is* their actual motive, they admit this motive might not have prevailed without the trauma’s psychological influence.  

  **Conceptual Framework:**  
  *Counterfactual stability of moral motivation* requires that an agent’s correct moral reason (here, respect for property rights) would remain causally effective in nearby possible worlds where a contingent, non-moral psychological feature (here, the trauma-induced aversion) is absent.  

  **Question:**  
  Does Dr. Rivera’s action deserve **full moral credit**, **partial moral credit**, or **no moral credit**? Defend your answer by addressing whether genuine moral worth requires not only acting *for the right reason* but also ensuring that this reason operates independently of contingent psychological scaffolding like the unendorsed trauma response.  

  **Instructions:**  
  - Do **not** appeal to Kant, Aristotle, or other philosophers’ theories. Use only the scenario and conceptual framework provided.  
  - Avoid bibliographic citations or references to course readings.  
  - Focus on:  
    (a) Whether the *presence* of the right reason is sufficient for full credit,  
    (b) How the trauma’s role affects the *causal dominance* and *counterfactual stability* of the right reason,  
    (c) Why overdetermination (multiple motives) does/might not undermine moral worth.  

  ---

  ### Model Answer (Approx. 700 words)  
  **Position:** Dr. Rivera deserves **partial moral credit**—but not full—because the counterfactual instability of their moral motivation reveals contingent psychological scaffolding undermines the robust causal efficacy of the right reason.  

  #### Three Positions and Their Errors:  
  1. **Full Credit (Error: Conflating Reason Presence with Causal Dominance)**  
     *Argument:* "Since Dr. Rivera acted *for* the right reason (respect for the owner’s claim), they deserve full credit. Motives are judged by actual causes, not hypothetical failures."  
     *Error:* This ignores that moral worth requires the right reason to be *causally sufficient* without contingent psychological crutches. The trauma’s role exposes fragility: in worlds without it, the right reason fails. Credit requires not just acting rightly *now* but having dispositions resilient to non-moral psychological changes.  

  2. **No Credit (Error: Equating Contingent Origin with Reason Content)**  
     *Argument:* "The trauma psychologically enabled the ‘right’ action, so the motive is corrupted. Without trauma, Dr. Rivera is dishonest; thus, the action lacks moral worth."  
     *Error:* This conflates the *origin* of psychological access to a motive with the motive’s *content*. That trauma *facilitated* attention to the right reason doesn’t alter that reason’s validity. Rejecting all credit implies that any influence from non-moral psychology voids worth—an implausible standard, as all motives have psychological preconditions.  

  3. **Partial Credit (Correct): The Stability Threshold**  
     *Argument:* Dr. Rivera’s action has *some* worth because the right reason is causally active, but not *full* worth because it lacks counterfactual stability. The trauma acts as psychological scaffolding: it enables the right reason to dominate *contingently* but not *reliably*. Moral credit demands that the right reason would persist absent such scaffolds, ensuring the action expresses a durable commitment to morality—not a fragile alignment of non-moral triggers.  

  #### Why Partial Credit? Key Distinctions:  
  - **Overdetermination ≠ Worthlessness:**  
    The right reason and trauma aversion *coexist*, but overdetermination alone doesn’t negate worth. The problem isn’t multiple motives—it’s that the right reason *depends* on the non-moral one for causal efficacy. Without trauma, the right reason is inert; thus, it lacks autonomy.  
  - **Causal Fragility vs. Moral Justification:**  
    The right reason *justifies* the action normatively, but its *causal fragility* (exposed by instability) shows Dr. Rivera’s moral psychology is underdeveloped. They act rightly only when non-moral aversion reinforces duty—not from integrated character.  
  - **The Scaffolding Principle:**  
    Moral credit requires reasons to be *functionally independent* of unendorsed psychological contingencies. Trauma-induced aversion is unendorsed (Dr. Rivera dislikes its influence) and non-moral (it concerns visceral discomfort, not rights). When such features prop up a right reason, credit is diminished—not erased, but not exemplary.  

  **Conclusion:** Dr. Rivera’s action is commendable but not praiseworthy *as moral virtue*. It reflects a "lucky" convergence of morality and pathology, not stable goodwill. Partial credit acknowledges right action but demands more for full worth: reasons resilient to the removal of non-moral scaffolds.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A-Range (22–25):**  
  - Explicitly uses "counterfactual stability" to diagnose causal fragility.  
  - Distinguishes *normative validity* of the right reason from its *causal dominance*.  
  - Explains why overdetermination doesn’t automatically negate worth *but* dependency does.  
  - Argues for partial/full/no credit by linking stability to moral character (e.g., "durable commitment").  
  - Avoids all appeals to external authorities.  

  **B-Range (18–21):**  
  - Correctly applies "counterfactual stability" but ambiguously ties it to credit.  
  - Notes the right reason’s presence but undersells causal fragility.  
  - Addresses overdetermination superficially (e.g., "two motives are confusing").  
  - Defends a position but relies on intuition versus scaffolding principle.  

  **C-Range (14–17):**  
  - Mentions stability but doesn’t connect it to credit.  
  - Focuses only on actual motive ("they acted rightly!") or only on counterfactual failure ("they’re corrupt!").  
  - Misreads the trauma as a moral reason (e.g., "fear of guilt").  
  - Appeals to Kant/Aristotle (-3 marks).  

  #### Common Mistakes (Deductions):  
  - **-3 marks:** Treating the trauma as part of the moral reason (e.g., "They returned it to avoid trauma-feelings, so it’s selfish").  
  - **-3 marks:** Citing philosophers/texts without conceptual application (e.g., "Kant says..." without analysis).  
  - **-2 marks:** Ignoring overdetermination (e.g., assuming trauma "taints" the motive entirely).  
  - **-2 marks:** Equating psychological origin with normative status (e.g., "Trauma caused the motive, so it’s impure").  

  ---

  This assessment tests conceptual precision, not historical knowledge. Top answers dissect *why* causal stability matters for moral credit—not *who* said what.
