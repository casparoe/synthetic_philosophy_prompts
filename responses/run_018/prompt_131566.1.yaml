prompt: |-
  I am trying to specify what an account of "free will worth wanting" must deliver if it is to be adequate for moral psychology rather than metaphysics alone. Write the desiderata: list the requirements any such theory must satisfy, with the motivating case or distinction behind each. Specifically, it must distinguish executive sourcehood—control over particular actions—from diachronic narrative coherence—the capacity to recognize one's present self in past decisions—and it must accommodate both gradual value drift, where an agent's priorities shift in ways she only partly endorses retrospectively, and sudden value rupture, such as trauma-induced personality change or conversion, without treating either as a failure of freedom tout court. It must also preserve the distinction between lacking freedom due to internal compulsion and lacking it due to external coercion, and it must remain consistent with empirical findings that deliberative processes are often post-hoc rationalizations. Flag which desiderata are genuinely non-negotiable and which reflect partisan commitments of particular camps—especially the demand for ultimate origination. Identify whether any subset, particularly the combination of full narrative coherence with open-ended executive revision, is jointly unsatisfiable. Then briefly indicate how standard compatibilist, hierarchical, and revisionist accounts fare against your list. No bibliography is needed; I want the conceptual architecture.
reasoning: |-
  Okay, the user is asking for a detailed framework on what constitutes "free will worth wanting" specifically for moral psychology, not just metaphysics. They want desiderata that distinguish executive sourcehood from narrative coherence, accommodate value drift and rupture, preserve the internal-external constraint distinction, and align with empirical findings about post-hoc rationalization. They also want to flag non-negotiables versus partisan demands, check for joint satisfiability issues, and evaluate standard theories against these criteria.

  Hmm, this is a sophisticated request clearly from someone deep in philosophy of mind or ethics—likely an academic or advanced student. The specificity about trauma-induced change and post-hoc rationalization suggests they're engaging with empirical psychology too. They might be constructing a novel account or critiquing existing ones, possibly frustrated with metaphysical dead-ends. The "worth wanting" framing hints at Dennettian pragmatism, but they’re pushing beyond compatibilism’s usual boundaries. 

  Breaking it down: First, the core distinction between *executive sourcehood* (moment-to-moment control) and *narrative coherence* (self-continuity) is crucial. Moral psychology needs both: we blame based on who acted (executive) but also assess character over time (narrative). Yet they can conflict—e.g., a trauma survivor might feel alienated from past actions they controlled at the time. 

  Then the curveballs: **value drift** (slow priority shifts) and **rupture** (sudden changes). Most theories treat radical change as freedom-failing, but the user insists we shouldn’t—hence desideratum 2’s emphasis on partial endorsement. Desideratum 3 handles rupture by decoupling coherence from freedom. Smart move: this avoids pathologizing growth or survival. 

  Desideratum 4 (internal vs. external constraints) is non-negotiable—moral responsibility collapses without it. If coercion and compulsion aren’t distinguished, all unfreedom looks the same. But desideratum 5 (post-hoc rationalization) is trickier: it must allow that we *often* confabulate reasons without making *all* deliberation illusory. 

  Now, landmines: **Ultimate origination** (desideratum 6) is rightly flagged as partisan/metaphysical. Moral psychology doesn’t need uncaused causes—just sufficient control for desert-attribution. **Joint satisfiability** is the real headache: Can an agent have total narrative transparency *and* radical executive freedom? Probably not (hence the asterisk). If I can deeply identify with my past self *and* utterly repudiate it, we strain coherence. 

  For theory evaluation: **Standard compatibilism** nails executive control but flunks rupture cases (narrative incoherence = unfree?). **Hierarchical** (Frankfurt) struggles with drift—what if higher-order desires shift ambivalently? **Revisionist** (e.g., Vargas) handles post-hoc rationalization best but might undersell narrative. 

  User’s unspoken need? Likely bridging moral phenomenology (how freedom *feels* post-trauma) with responsibility practices. They might be rehabilitating agency in contexts of oppression or mental health where "freedom" seems compromised but blame persists. The emphasis on "not failure tout court" suggests a normative push: even fractured selves can be free enough to deserve respect. 

  ...Time to structure this cleanly. Desiderata first, then tensions, then theory report card. Non-negotiables: 1, 3, 4. Partisan: 6. The executive/narrative combo might be the pivot—get that right, and the rest follows.
answer: |-
  Here is a conceptual architecture for "free will worth wanting" in moral psychology, specifying desiderata, their motivations, tensions, and evaluation of leading theories:

  ---

  ### **Core Desiderata for Moral Psychology**
  1. **Executive Sourcehood (Control)**  
     - **Requirement**: The agent must be the *proximal source* of actions, with reasons-responsive control over specific choices.  
     - **Motivation**: Distinguishes *my action* (e.g., choosing coffee over tea) from spasms, coercion, or hijacked impulses. Necessary for assigning responsibility for *this act*.  
     - **Non-negotiable**: Yes. Foundational for blame/praise in moral psychology.

  2. **Diachronic Narrative Coherence (Identity)**  
     - **Requirement**: Capacity to see one's past decisions as *recognizably one’s own*, even if not fully endorsed.  
     - **Motivation**: Enables self-attribution of responsibility over time (e.g., "I was dishonest then, and I own that"). Addresses integrity of personal history.  
     - **Non-negotiable**: Qualified. Must be *possible* but not universally flawless; ruptures don’t negate freedom.

  3. **Accommodation of Gradual Value Drift**  
     - **Requirement**: Allows agents to evolve priorities (e.g., careerist → parent) without full retroactive endorsement.  
     - **Motivation**: Personal growth often involves ambivalence ("I see why I prioritized work, but I regret it"). Treating drift as *unfreedom* pathologizes maturation.  
     - **Non-negotiable**: Yes. Empirical ubiquity of non-identical selves over time.

  4. **Accommodation of Sudden Value Rupture**  
     - **Requirement**: Accepts trauma, conversion, or epiphanies as *changes in agency* without erasing prior freedom (e.g., post-trauma self disavowing past values).  
     - **Motivation**: To avoid conflating psychic rupture with *exculpation* of past acts (e.g., "I am different now, but I was responsible then").  
     - **Non-negotiable**: Yes. Critical for trauma/redemption narratives.

  5. **Distinction: Internal Compulsion vs. External Coercion**  
     - **Requirement**: Preserve asymmetry between inner constraints (e.g., addiction) and outer threats (e.g., mugger’s demand).  
     - **Motivation**: Moral psychology treats coercion as *mitigating* responsibility; compulsion as *complex* (e.g., "You chose the drug, but weren't free").  
     - **Non-negotiable**: Yes. Central to legal/moral distinctions.

  6. **Compatibility with Post-Hoc Rationalization**  
     - **Requirement**: Accepts that deliberation can be confabulatory without negating freedom.  
     - **Motivation**: Empirical psychology (e.g., Libet, Haidt) shows reasons often follow acts. Moral responsibility must survive imperfect self-knowledge.  
     - **Non-negotiable**: Yes. Accountability doesn't require flawless introspection.

  ---

  ### **Contested/Possibly Partisan Desiderata**
  7. **Rejection of Ultimate Origination**  
     - **Requirement**: No appeal to *causa sui* (self-creation ex nihilo).  
     - **Motivation**: Metaphysically dubious and unnecessary for moral psychology. Responsibility requires *sufficient control*, not cosmic authorship.  
     - **Status**: **Partisan** (anti-libertarian). Non-negotiable for naturalists; optional for metaphysicians.

  ---

  ### **Tensions and Joint Satisfiability**
  - **Primary Tension**: **Full Narrative Coherence + Radical Executive Revision**  
    - If an agent undergoes *rupture* (e.g., religious conversion), they may reject past acts as "alien," threatening narrative coherence.  
    - **Resolution**: Satisfiable if narrative coherence is *retrospective* and *partial* ("I own that past act as mine, though I now reject its values").  
    - **Limit**: Total dissociation (e.g., dissociative identity disorder) may break coherence *without* negating past executive control.  

  - **Subsidiary Tension**: **Value Drift vs. Compulsion**  
    - Gradual shifts (e.g., ideological radicalization) may blur into compulsion.  
    - **Resolution**: Drift involves *sustained reasons-responsiveness*; compulsion bypasses it.  

  ---

  ### **Evaluation of Standard Theories**
  1. **Classic Compatibilism (e.g., Hume, Strawson)**  
     - **Strengths**: Nails executive control (1), external coercion (5), post-hoc rationalization (6).  
     - **Weaknesses**: Struggles with narrative coherence (2) and rupture (4). Treats value drift as mere preference change, risking neglect of identity stakes.

  2. **Hierarchical Compatibilism (e.g., Frankfurt, Dennett)**  
     - **Strengths**: Refines control via higher-order desires (1), allows drift (3) if endorsed by "true self."  
     - **Weaknesses**: Rupture (4) breaks hierarchical harmony ("Who endorses now?"). Narrative (2) is fragile if higher orders shift abruptly. Post-hoc rationalization (6) undermines "real self" claims.

  3. **Revisionist Accounts (e.g., Vargas, Shoemaker)**  
     - **Strengths**: Best on post-hoc rationalization (6), separates moral responsibility from metaphysics. Handles drift (3) via "modest historicism."  
     - **Weaknesses**: Risks reducing narrative (2) to social negotiation. Rupture (4) may collapse into excusing conditions unless carefully bounded.

  ---

  ### **Synthesis**
  Adequate moral-psychological free will must:  
  - Anchor responsibility in **executive sourcehood** (non-negotiable),  
  - Treat **narrative coherence** as defeasible and dynamic (allowing drift/rupture),  
  - Reject **ultimate origination** as irrelevant (partisan but necessary for naturalism),  
  - Tolerate **post-hoc rationalization** while preserving the **compulsion/coercion distinction**.  

  **Verdict**: No theory perfectly satisfies all, but **revisionist-compatibilist hybrids** come closest by decoupling moral agency from metaphysical unity. The executive/narrative distinction resolves the core tension: one can control an act *then* without fully owning it *now*.
