  Here's my take:

  Genuine moral dilemmas likely require actual conflicting obligations ("binding conflicts"), not just unpleasant choices ("bad-option traps"), because a dilemma implies you *must* breach *some* duty regardless of choice. Guilt after choosing the lesser harm isn't necessarily proof of a real unfulfilled duty; it's often an emotional response to causing harm, even when justified, reflecting empathy or societal conditioning rather than a philosophical failing. While the feeling is real and meaningful psychologically, it doesn't invalidate the necessity of your choice within the dilemma. You can fulfill your strongest obligation overall yet still feel profound regret for the unavoidable harm caused.

  **Certainty:** Fairly sure (80%) that binding conflicts define true dilemmas and guilt isn't proof of failure.
  **Least Sure:** Whether *all* persistent guilt is just emotional noise – sometimes it *might* signal a misjudged obligation.
