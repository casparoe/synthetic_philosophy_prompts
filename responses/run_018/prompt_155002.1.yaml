prompt: |-
  i'm trying to pin down what a theory of original versus derived intentiality actually has to deliver, specifcally in the weeds of Dennett's two-bitser argument against Searle. write the full desiderata: the cases it must handle right (the chinese room, a two-bitser tracking prey, a map with wrong directions, maybe a language model generating text), the distinctions it can't collapse (original vs derived, intrinsic vs observer-relative, having intentionality vs being interpreted as having it), and any hard constraints from cognitive science or logic. for each requirement say why it's non-negotiable or just camp-preference, and flag any pair that looks jointly unsatisfiable -- especially the tension that syntax alone can't ground semantics while derived intentionality remains genuinely real, not just a fiction. briefly score Searle's biological naturalism and Dennett's stance view against the list, but keep the weight on the criteria not the scorecard. no citation lists please, and don't ask me to look up page numbers.
reasoning: |-
