  **Marking Scheme (Total: 30 Points)**

  | **Criterion**                                     | **Specific Move Required (A Grade)**                                                                                                 | **Points (A)** | **Specific Move Required (B Grade)**                                                                 | **Points (B)** | **Typical Failure Mode (Costs Marks)**                                                                 |
  | :------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------- | :------------- | :--------------------------------------------------------------------------------------------------- | :------------- | :----------------------------------------------------------------------------------------------------- |
  | **1. Conceptual Foundation (10 pts)**             | **Precisely defines "epistemic subsidy" and "performance legitimacy," and articulates the *reflexive contradiction* with clarity.** | **10**         | Defines key terms adequately but lacks depth on the *nature* of the contradiction (focuses on control without the circularity). | **7**          | Vague definitions; conflating epistemic subsidy with simple propaganda; no mention of reflexivity/contradiction. |
  | **2. Comparative Application (12 pts)**           | **Applies the reflexivity problem *diagnostically* to BOTH cases, showing *how* each regime's specific mechanisms create the circularity despite their differences (e.g., China's censorship vs. Singapore's managed metrics/framing).** | **12**         | Describes China's information control and Singapore's metrics *accurately* but treats them separately; fails to *explicitly link* each case's mechanisms to undermining independent verification for legitimacy. | **8**          | Empirical description without conceptual analysis; treating cases in isolation; focusing only on one case; ignoring differences in *how* subsidy works. |
  | **3. Critical Engagement (8 pts)**                | **Engages the gradualism counter-argument effectively: explains its logic, then provides a *philosophical critique* showing *why* it fails to resolve the core reflexivity problem (e.g., managed adaptation vs. genuine epistemic independence).** | **8**          | Mentions gradualism or a counter-argument but offers only a weak rebuttal (e.g., "it hasn't happened yet") or drifts into empirical debate. | **5**          | Ignoring the counter-argument; offering only an empirical rebuttal; misrepresenting the counter-argument. |
  |                                                   |                                                                                                                                    | **Total A: 30** |                                                                                                      | **Total B: 20** |                                                                                                        |

  **Grade Boundaries (Illustrative):**  
  *   **A (Distinction):** 26-30 pts (Identifies & analyzes the contradiction comparatively in both cases, strong critique of counter-argument)  
  *   **B (Merit):** 20-25 pts (Solid definitions, good descriptions of both regimes, some awareness of epistemic issues, weaker on contradiction/counter-argument)  
  *   **C (Pass):** 15-19 pts (Adequate coverage but significant weaknesses in conceptual depth, comparative analysis, or critical engagement)  
  *   **Below C:** <15 pts (Serious omissions, conceptual errors, lack of comparative focus, failure to address the prompt's core requirements).
