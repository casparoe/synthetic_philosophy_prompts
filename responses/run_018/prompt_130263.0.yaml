answer: |-
  Here's a tight decision tree for the paradox of fiction, built on concrete claims and mapping to key positions (6 leaves max):

  **Paradox of Fiction Taxonomy: Decision Tree**

  1.  **Start:** Is your emotional reaction to a fictional character's death *phenomenologically identical* to your reaction to a real person's death? (Does it *feel* exactly the same inside?)
      *   **NO** → Go to 2
      *   **YES** → Go to 3

  2.  **Felt Different:** Is this distinct "fictional emotion" still rationally *about* the fictional character?
      *   **NO** (The emotion isn't *about* the character, but perhaps about ideas, real memories, or aesthetic features) → **Deflationary View (No Paradox):** The "emotion" isn't truly grief *for the character*, so there's nothing irrational to explain. (E.g., Neill, some Humeans)
      *   **YES** (It *is* genuinely *about* the character) → **Problematic Hybrid (Incoherent?):** Claims emotion feels different *and* is directly about the non-existent, making the "aboutness" potentially irrational without further mechanism. (Diagnosis: Hard to defend; avoids core tension without resolving it).

  3.  **Felt Same:** Does a genuine emotion *require* a belief that its target *actually exists* to be rational? (Existence Assumption)
      *   **NO** (Emotions can be rationally directed at the merely imagined) → **Fragmentation Solution?:** Can your emotional state hold *simultaneous, fragmented* attitudes? (E.g., "part of me" responds to the character *as if real* within the story-world, while "part of me" knows they aren't).
          *   **YES** → **Simulation Theory (Currie):** We rationally simulate *having* the belief (or perception) needed to ground the emotion. Our emotion is about what we imagine *would be* real *if* the story were true. (Affect is real, object is make-believe real).
          *   **NO** → **Unnamed "Quasi-Realist" Position:** Emotions *feel* real and are directed at the fiction, but without requiring existence belief *or* fragmentation. (Rare; risks irrationality).
      *   **YES** (Existence Assumption holds) → Can the emotion be considered *appropriate* (even if not fully rational) based *only* on the *fictional truths*?
          *   **NO** → **Illusionism (Coleridge's "Willing Suspension of Disbelief"):** We *temporarily* allow ourselves to believe the fiction is real (or act *as if* we do), making the emotion rational *during* that state. (Affect real, object *treated as* real).
          *   **YES** → **Make-Believe Theory (Walton):** We don't have genuine emotions, but *quasi-emotions*. We make-believe *that* we are afraid/grieving *as part of* playing the game of fiction. (Affect *is* real physiological/feeling state, but its *intentional object* is make-believe, not actual belief).

  **Key Diagnostics:**

  1.  **Incoherent Combo (Leaf 2, "YES"):** Claiming the emotion feels *different* from real grief *but* is still rationally *about* the non-existent character avoids the phenomenological puzzle but creates a new one about intentionality without existence belief or simulation. It struggles to explain *why* this distinct state still attaches to the character rationally.
  2.  **Ambiguous Pair:** The tree *cannot cleanly separate* **Simulation Theory (Currie)** and **Make-Believe Theory (Walton)** under intense scrutiny regarding the *nature* of the "fictional object." Both rely crucially on imagination. The key *practical* difference is how they characterize the emotion itself (Currie: real emotion directed at imagined state; Walton: quasi-emotion as part of make-believe). The "Fragmentation?" node tries to push towards Simulation, but a committed Waltonian might argue fragmentation isn't needed for quasi-emotions. *For handout purposes, the "Existence Assumption" and "Appropriateness" nodes are the primary differentiators.*

  **How to Use:**
  1.  Start at the top. Answer based on your own experience (does movie grief *feel* like real grief?).
  2.  Follow the branches, answering each concrete yes/no question.
  3.  Arrive at a leaf position. The names provide hooks for further reading/discussion.
  4.  Remember: Philosophers debate these distinctions! The tree simplifies complex arguments into core commitments.
