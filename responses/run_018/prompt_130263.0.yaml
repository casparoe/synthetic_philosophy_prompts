  hey im in a phil of art seminar and were stuck on teh paradox of fiction — like why do i actually tear up at a movie death when i know the actor is fine? i need a sorting taxonomy for our handout, not just a list of names.

  can you build a decision tree where every split is a concrete claim i could answer without knowing who said what? start with: is your emotional reaction to fiction phenomenologically the same kind of thing as real-world grief, or is it a different mental state altogether?

  then branch on:
  - whether you think that state still needs a real object to be rational (call it the existence assumption)
  - whether fiction can be emotionally appropriate even if the characters dont exist
  - whether accepting that emotions can be 'fragmented' — directed partly at a story-world and partly at nothing actual — dissolves the paradox without giving up real affect

  map answers onto named positions (coleridges willing suspension, waltons make-believe, curries simulation, the deflationary no-paradox view) plus any unnamed leaves. include one combo that seems incoherent or unexplored and diagnose why its empty. flag any pair of leaves your tree cant actually separate.

  rules:
  - 6 leaves max
  - each node phrased so an undergrad can answer it cold
  - dont ask for citations or reading lists — this should work for someone without web access
  - keep the logic tight but dont dumb down the philosophy

  thanks!
