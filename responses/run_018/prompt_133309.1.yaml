  We are preparing a Q&A prep sheet for a philosophy seminar presentation.
   The thesis: Moral sentences express "stance-commitments" (structured practical attitudes) rather than beliefs, and the Frege-Geach embedding problem is avoided because in conditionals, the commitment operates in a hypothetical mode (like suppositional reasoning with beliefs).

