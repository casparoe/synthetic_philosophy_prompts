    Then the rest.

    Alternatively, the modus ponens might be even more central. But I think the teacher's objection is the most damaging because it comes from an authority and questions the very foundation.

    Let's go with:

    1. Teacher: non-cognitivism refuted (a)
    2. Debate kid: modus ponens (b) [since he loves conditionals, and this is a direct conditional challenge]
    3. Senior: compositionality (c)
    4. Debate kid: modus tollens (f)
    5. Senior: structure of the attitude (e)
    6. Teacher: metaethics dead (d)
    7. Senior: relation to belief (g)
    8. Debate kid: complex embeddings (h)

    Now, for each, write the objection as they would say it, then the reply, then the shaky part and concession.

    Opening concession: I should concede that my view is a form of non-cognitivism (or expressivism) and that the Frege-Geach problem is a serious challenge that has troubled many views. But I'm offering a new solution by introducing the idea of hypothetical mode for embedded contexts.

    Hidden question: I hope nobody asks about the connection to truth-conditional semantics in non-moral domains, or how my view handles mixed sentences (like "If stealing is wrong and stealing is common, then we have a problem") because accounting for both moral and non-moral in one conditional is very hard for expressivists.

    Thesis in one line: Moral sentences express structured practical attitudes (stance-commitments) and their embeddings in conditionals are handled by a hypothetical mode of commitment, thus solving the Frege-Geach problem.

   Let's write the JSON.

