  **BUREAU OF LIBERTY BOUNDARIES**  
  Municipal District 7 • Liberty House, 100 Principle Plaza  
  *"Safeguarding Autonomy Through Quantified Harm Mitigation"*

  **FREQUENTLY ASKED QUESTIONS**  
  *Version 3.7.2 // Reviewed: 15 Thermidor, Current Year*

  **Q1: I delivered an honest, factually accurate negative review of my neighbor’s publicly visible kinetic sculpture ("Whirling Despair") installed on their front lawn. My neighbor claims this caused them emotional distress and diminished their property’s aesthetic appeal to passersby. Is this actionable other-regarding harm?**

  **A1:** The Bureau acknowledges the inherent tension between expressive liberty and potential receptor discomfort. Factual statements regarding observable phenomena (e.g., "The sculpture emits a 65-decibel grinding sound between 8 PM and 11 PM," or "Component C detached on [Date], striking mailbox 42B") are presumptively self-regarding conduct, falling under Opinion/Expression Sector 3(b). However, subjective value judgments (e.g., "It’s hideous," "It degrades the neighborhood") require assessment under the **Liberty Encroachment Assessment Protocol (LEAP)**. LEAP calculates a **Social Friction Coefficient (SFC)** incorporating:
  *   **Audience Proximity Factor (APF):** Was the critique delivered directly to the neighbor, posted within a hyperlocal forum (APF > 0.7), or broadcast widely (APF > 1.2)?
  *   **Discomfort Gradient (DG):** Measured in subjective distress units (SDUs) via Form LB-114 (Requires Notarized Testimony & Corroborating Witness Affidavits LB-114a). DG must exceed Threshold Gamma (Γ ≥ 8.5 SDUs) to trigger review.
  *   **Material Impact Score (MIS):** Quantifiable detriment (e.g., documented property value decline >2%, verifiable loss of commercial commissions).
  Initial findings suggest factual observations likely fall below actionable SFC thresholds. Subjective critiques may require a Formal Mediation Session (Schedule LB-205) if SFC > 1.0. Submit Form LB-89 "Expression Impact Disclosure" within 10 business days for a preliminary SFC estimate.

  **Q2: During a community garden committee meeting, a colleague proposed an elaborate, expensive automated watering system I believed was wasteful. I remained silent during the vote, which passed unanimously. My silence is now cited as tacit endorsement, allegedly damaging the group’s financial autonomy by enabling poor resource allocation. Is my inaction subject to harm regulation?**

  **A2:** The Bureau recognizes that inaction (Conduct Sector 5: Omissions) can generate complex liberty externalities. Tacit endorsement liability hinges upon the **Autonomy Impact Score (AIS)**, calculated post-event. Key variables include:
  *   **Reasonable Expectation of Dissent (RED):** Did precedent or role (e.g., Treasurer, Engineering Consultant) establish an expectation of vocal assessment? (RED > 0.6 implies heightened duty).
  *   **Consequence Severity Index (CSI):** Measured in quantifiable resource depletion (e.g., funds expended / total discretionary budget). CSI > 0.25 necessitates review.
  *   **Knowledge Certainty Level (KCL):** Did you possess, and could you reasonably prove prior possession of, specific data demonstrating wastefulness? (KCL ≥ 0.8 required for omission to be materially causative).
  Silence alone, absent a pre-existing duty (RED < 0.4) and with low CSI (< 0.15), is generally insufficient to constitute other-regarding harm under Section 12-Gamma. However, high CSI (> 0.3) *combined* with documented expertise (RED > 0.7) *may* trigger an AIS exceeding permissible thresholds, requiring Restorative Autonomy Rebalancing (Process LB-301). File Form LB-77 "Omission Justification Narrative" if contacted for AIS evaluation.

  **Q3: I stated, "I find veganism ethically compelling," within earshot of colleagues eating lunch in a shared break room. A colleague alleges this created an "atmosphere of judgment," causing them anxiety about their own dietary choices and constituting impermissible social pressure. Does this qualify as harm?**

  **A3:** Expressions of personal preference or belief, absent direct accusation, command, or targeted disparagement, are typically classified as Core Self-Regarding Speech (Sector 1). The concept of "atmosphere of judgment" falls under Ambient Value-Pressure (AVP), a contested domain. Assessment requires:
  *   **Ambient Pressure Differential (APD):** Measured via calibrated environmental surveys (Form LB-212) administered to all present individuals within 24 hours, assessing self-reported comfort variance pre/post utterance. Mean APD shift must exceed +/- 0.5 on the 5-point Harm Perception Scale.
  *   **Specificity of Target (SoT):** Was the statement general (SoT < 0.3, e.g., "I believe X") or perceived as implicitly targeting specific individuals/conduct (SoT > 0.6)?
  *   **Contextual Permissibility Index (CPI):** Does the venue (shared break room) have a higher baseline expectation of ideological exposure (CPI = Moderate) versus a strictly neutral workspace (CPI = High)?
  Low APD shift (< 0.3), general statements (SoT < 0.4), and moderate CPI environments generally render the expression non-actionable. Sustained or targeted value-statements in high-CPI zones *may* warrant Informal Atmosphere Correction (Notice LB-408). Proactive registration of recurring personal preferences on Form LB-66 "Declared Non-Impositional Stances" is recommended to pre-empt AVP disputes.

  **Conclusion & Compliance Note:** The Bureau administers Municipal Liberty Code Chapter 42, focusing exclusively on quantifiable, other-regarding harms demonstrably infringing upon specific, definable liberties of identifiable individuals. Self-regarding conduct, internal mental states, generalized social discomfort below established SFC/APD/AIS thresholds, or harms stemming purely from third-party interpretation absent measurable external impact, fall outside the Bureau's regulatory purview. All determinations rely on strict evidentiary thresholds and calibrated metric application to minimize discretionary overreach while protecting actionable liberties. Appeals require submission of LB-Form 999 within 15 days, accompanied by a recalculated metric dossier.

  **Bureau of Liberty Boundaries**  
  *Ensuring Your Freedom Stops Precisely at Measurable Harm.*
