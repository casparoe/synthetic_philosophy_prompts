  For Nicod's criterion, I'll show how the paradox arises when we treat negative cases (healthy people) as evidence for absence. The Bayesian part needs to incorporate pre-test probability and base rates - that's crucial because epidemiology already knows rare diseases behave differently. Goodman's projectability connects to how we define "disease absence" operationally.

  The residue analysis is where it gets interesting. The user suspects philosophy's idealized logic breaks in real-world settings. I should highlight:
