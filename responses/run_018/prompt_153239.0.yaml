  ### Frankfurt-Style Cases: Responsibility Decision Tree  
  **Base Case:** Jones votes Democrat on his own. Black's chip would've forced Republican if he showed *any* sign of voting otherwise, but it didn't activate.  

  **Instructions:**  
  We'll tweak **one feature at a time** in the base case. Answer intuitively—don’t overthink! Each path leads to a view on whether Jones is morally responsible.  

  ---

  ### Start Here:  
  **Tweak 1: Does Jones have a second-order desire endorsing his vote?**  
  *(e.g., does he reflect, "I’m glad I’m voting Dem; it feels right" before acting?)*  
  - **Yes** → Go to **Leaf C**  
  - **No** → Move to Tweak 2  

  **Tweak 2: Is there a mental "flicker" that could trigger the chip?**  
  *(e.g., a split-second urge to vote Republican that Black’s chip could detect)*  
  - **Yes** → Go to **Leaf B**  
  - **No** → Move to Tweak 3  

  **Tweak 3: Does Black’s chip monitor internal thoughts or just behavior?**  
  - **Monitors internal thoughts** → Go to **Leaf A**  
  - **Only monitors behavior** → Go to **Leaf D**  

  ---

  ### The Leaves:  
  - **Leaf A: Hard Incompatibilist**  
    *Jones isn’t responsible.* PAP (Principle of Alternative Possibilities) is true. The chip’s presence means Jones had no *real* alternative—even if it didn’t activate.  

  - **Leaf B: Flicker Defender**  
    *Jones is responsible.* That mental flicker (e.g., a hesitation) was enough of an alternative to make his choice free. PAP stands!  

  - **Leaf C: Hierarchical Compatibilist**  
    *Jones is responsible.* What matters is his second-order endorsement of his choice. The chip? Irrelevant. Freedom is about aligning with your "true self."  

  - **Leaf D: Actual-Sequence Source View**  
    *Jones is responsible.* Blame/praise depends on the *actual cause* of the action (Jones’ own reasoning), not hypothetical alternatives.  

  ---

  ### Behind the Scenes:  
  - **The Empty Slot (!!):** Combo = **No flicker (T2) + Chip monitors internal (T3) + No second-order desire (T1)**.  
    - *Why empty?* Intuitively, if Jones has no flicker, no endorsement, *and* the chip reads his mind, it’s wild to call him responsible. Yet pure "source" theorists might try… but it’s unstable. We’ll debate!  

  - **Tree Quirks:**  
    - **Leaf C vs. Leaf D** sometimes collapse: If you answered **Yes** to Tweak 1 (endorsement), you went to C. But D *also* cares about the actual cause—which might include endorsement! We’ll untangle this.  
    - **Leaf B** dominates if there’s *any flicker* (Tweak 2 = Yes)—even if other factors suck. Flicker defenders won’t budge!  

  ---

  ### How You Sorted:  
  | Tweak 1: Endorsement? | Tweak 2: Flicker? | Tweak 3: Chip Monitors Internally? | Leaf |  
  |------------------------|-------------------|-----------------------------------|------|  
  | ✅ Yes                  | *Any*             | *Any*                             | C    |  
  | ❌ No                   | ✅ Yes            | *Any*                             | B    |  
  | ❌ No                   | ❌ No             | ✅ Yes                            | A    |  
  | ❌ No                   | ❌ No             | ❌ No                             | D    |  

  *(The empty slot is ❌ / ❌ / ✅ — if you landed here and still think Jones is responsible, congrats! You broke the matrix.)*  

