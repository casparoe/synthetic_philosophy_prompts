     Round2: (40.93-10)/70=30.93/70≈0.4419
     Round3: (50.91-10)/90=40.91/90≈0.4545

     So the sacrifice level increases over rounds.

     The point is not that the sacrifice level is constant, but that within a round, the two players have the same sacrifice level.

     In the activity, we want the students to see that in Round2, because South's technology improved, South's potential is higher, so to have the same sacrifice level, South should get a larger share of the resource.

     In Round3, when the resource increases, both get more, but the sacrifice levels for both are again equal and slightly higher than in Round2.

     We can then contrast with the Nash solution in Round2 and Round3 to show the difference.

     Given time constraints, we will design the activity as planned.

     Activity rules:

     - 7 groups of 2 students each.
     - Each group has a North and a South delegate.
     - Disagreement point: if they fail to agree, both get 10 points.
     - The activity has 3 rounds. In each round, the resource amount is revealed at the beginning of the round.
          Round1: 50 units
          Round2: 80 units
          Round3: 100 units
     - Technology factors are given in sealed envelopes or private cards that are replaced between rounds.

     How the technology is communicated:
          - At the beginning, each group gets two technology cards (one for North, one for South) for Round1: both have factor 1.0.
          - After Round1 is complete, the facilitator collects the technology cards and distributes new ones for Round2: 
                For 3 groups: North's factor becomes 1.5, South's remains 1.0.
                For 4 groups: South's factor becomes 1.5, North's remains 1.0.
                (or vice versa, but we want to have both cases; for simplicity in debrief, we might do the same for all groups, but then we can't have both treatments. Let's do for all groups the same: South's factor becomes 1.5 in Round2, and in Round3, North's factor becomes 1.5 too? Then in Round3 both have 1.5. 
          - After Round2, for Round3: 
                For groups that had North's factor become 1.5 in Round2, now in Round3 we change South's factor to 1.5? Then both would be 1.5.
                For groups that had South's factor become 1.5 in Round2, now in Round3 we change North's factor to 1.5 -> both 1.5.

          So in both cases, in Round3 both have 1.5.

     But the problem says "shifts for exactly one side between rounds", so we do:

          Between Round1 and Round2: shift happens to exactly one side (randomly chosen per group: half the groups shift North, half shift South).
          Between Round2 and Round3: shift happens to the other side.

     So at the end of Round3, both have shifted once, so both have the same technology factor? We can set both to 1.5.

     But then in Round3, both have 1.5, so it's symmetric again.

     We can choose the factors so that the student can convert resource to points easily.

     Alternatively, we can do:

          Round1: a=1, b=1
          Round2: 
              For half the groups: a=1.5, b=1
              For the other half: a=1, b=1.5
          Round3: 
              For the groups that had a=1.5 in Round2: now change b to 1.5 -> then a=1.5, b=1.5.
              For the groups that had b=1.5 in Round2: now change a to 1.5 -> then a=1.5, b=1.5.

     In Round3, everyone is symmetric.

     But then in Round2, we have two cases: either North has the advantage or South has the advantage.

     In the debrief, we can then compare the groups that had North improve in Round2 and those that had South improve.

     The rules for negotiation:

     - In each round, the resource amount is announced to both players in the group.
     - Each player's technology factor is written on their private card. They are instructed to keep it private.
     - However, for the negotiation, they may choose to reveal or not.
     - They negotiate to split the resource: they must agree on a split (x, R-x) where x is the resource given to North, R-x to South.
     - Then, utilities are: North: u_N = (technology factor of North) * x 
                     South: u_S = (technology factor of South) * (R-x)

     - If they agree, they get these utilities.
     - If they fail to agree within the time limit, they get (10,10).

     - After each round, the facilitator collects the agreements and then reveals to the group (or to the class) what the technology factors were for that round.

     Timeline (75 minutes):

     0-5 min: Introduction to the scenario and rules.
