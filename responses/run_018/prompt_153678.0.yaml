          KS: (25,25) as before.
     In Round2: 
          KS: sacrifice_N = (u1-10)/(80-10) = (u1-10)/70
              sacrifice_S = (u2-10)/(120-10) = (u2-10)/110   [because with b=1.5, South's utopia=1.5*80=120]
              Set equal: (u1-10)/70 = (u2-10)/110 = t
              u1=70t+10, u2=110t+10
              Constraint: u1/1 + u2/1.5 =80 -> u1 + (2/3)u2 =80
              -> 70t+10 + (2/3)(110t+10) =80
              -> 70t+10 + 220t/3 + 20/3 =80
              Multiply by 3: 210t+30+220t+20=240
              -> 430t+50=240
              -> 430t=190
              -> t=19/43≈0.44186
              u1=70*19/43+10 = 1330/43 +430/43=1760/43≈40.93
              u2=110*19/43+10=2090/43+430/43=2520/43≈58.60
     In Round3: 
          R=100, a=1, b=1.5, d=(10,10)
          Utopia: North=100, South=150
          KS: (u1-10)/90 = (u2-10)/140 = t
              u1=90t+10, u2=140t+10
              Constraint: u1 + (2/3)u2 =100
              -> 90t+10 + (2/3)(140t+10)=100
              -> 90t+10 + 280t/3 +20/3=100
              Multiply by 3: 270t+30+280t+20=300
              -> 550t+50=300
              -> 550t=250
              -> t=250/550=5/11≈0.4545
              u1=90*(5/11)+10=450/11+110/11=560/11≈50.91
              u2=140*(5/11)+10=700/11+110/11=810/11≈73.64

