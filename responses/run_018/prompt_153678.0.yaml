  ### Classroom Activity Design: The Orbital Mining Accord

  **Objective:** Students intuitively grasp the Kalai-Smorodinsky (KS) bargaining solution, especially its monotonicity axiom, through a hidden-information negotiation. They experience tension between proportional gain (anchored to shifting utopia points) and the intuitive "equal sacrifice" norm, contrasting it with the Nash solution.

  **Core Mechanics:**  
  - Two delegations (North/South) negotiate resource splits (units) across 3 rounds (R=50, 80, 100).  
  - Disagreement point: fixed at (10, 10) utility points for all rounds.  
  - Private "technology cards" set utopia points (max achievable utility). One side’s technology shifts per round via hidden draw; the other remains constant.  
  - Payoffs: Points redeemable for privileges (e.g., extra credit, priority seating).  

  ---

  ### Rules  
  1. **Pair Formation (5 min):**  
     - 14 students form 7 pairs randomly. Assign one as North, one as South.  
     - Each pair receives:  
       - Disagreement point card: (10, 10).  
       - Sealed envelopes for each round (see table below).  

  2. **Resource & Technology (Per Round):**  
     - Facilitator reveals resource pool (R) at round start.  
     - Players open their round-specific envelope privately:  
       - Contains "technology factor" (e.g., 1.0, 1.5) converting resource to utility.  
       - Utopia point = factor × R.  
     - Example: South with factor 1.5 and R=80 → utopia = 120 utility.  

     | Round | Resource (R) | North Tech (50% groups) | South Tech (50% groups) | Utopia Shift |
     |-------|--------------|-------------------------|-------------------------|--------------|
     | 1     | 50           | 1.0                     | 1.0                     | None (baseline symmetry) |
     | 2     | 80           | 1.0 (fixed)             | 1.5 (★new)              | South’s utopia ↑ |
     |       |              | 1.5 (★new)              | 1.0 (fixed)             | North’s utopia ↑ |
     | 3     | 100          | 1.5 (★new)              | 1.5 (fixed)             | North’s utopia ↑ |
     |       |              | 1.5 (fixed)             | 1.5 (★new)              | South’s utopia ↑ |

  3. **Negotiation & Proposals (Per Round):**  
     - 10 min to negotiate. Players know R and *only their own* technology factor.  
     - Submit a split: North gets X units, South gets (R - X) units.  
     - **No agreement?** Both receive (10, 10) utility.  
     - Utilities calculated as:  
       - North: (tech factor) × X  
       - South: (tech factor) × (R - X)  

  4. **Revelation (After Agreement):**  
     - After splits are submitted, facilitators reveal both technologies to the pair.  
     - Utilities are computed publicly on a shared board.  

  ---

  ### Timeline (75 min)  
  - **0–5 min:** Introduction and pair formation.  
  - **5–20 min:** **Round 1** (R=50, symmetric tech).  
    - *Expected outcome:* Most split 25–25 (utilities 25, 25) via symmetry.  
  - **20–35 min:** **Round 2** (R=80, one side’s tech jumps to 1.5).  
    - *Jarring moment:* Equal splits (40–40) yield unequal sacrifices.  
    - E.g., North tech=1.5, South=1.0:  
      - Split 40–40 → utils (60, 40).  
      - Sacrifice: North = (60-10)/(120-10)≈0.45, South = (40-10)/(80-10)≈0.43 → **not equal**.  
  - **35–50 min:** **Round 3** (R=100, other side’s tech jumps to 1.5).  
    - *Monotonicity in action:* Asymmetric expansion favors the newly upgraded side.  
    - E.g., South upgraded in R2 (utils 58.6, 40.9), North upgrades in R3:  
      - KS solution: utils (50.9, 73.6) → North’s utility ↑ despite South’s prior advantage.  
  - **50–65 min:** Data collection. Display utilities/splits for all groups.  
  - **65–75 min:** Structured debrief.  

  ---

  ### Debrief (10 min)  
  **Round 1: Symmetry & Pareto Efficiency**  
  - "Why did most split 25–25? You anchored to symmetry and Pareto efficiency—no one could gain without hurting the other. KS respects this when the feasible set is symmetric."  

  **Round 2: Disagreement Anchoring**  
  - "In Round 2, technology shifted. If you split equally (40–40), why did sacrifices feel uneven? *[Show utils: e.g., (60,40)]* Utilities must exceed 10 (disagreement), but the utopia points diverged. KS scales gains proportionally to the new utopias:  
    - E.g., North tech=1.5: KS solution = utils (58.6, 40.9).  
    - Sacrifice = (58.6-10)/110 = (40.9-10)/70 = 0.44 for both → **equal sacrifice**."  

  **Round 3: Monotonicity & IIA Violation**  
  - "In Round 3, the resource grew, and the *other* side upgraded. KS ensures:  
    - If the feasible set expands asymmetrically (one utopia ↑), that player doesn’t lose (monotonicity).  
    - E.g., South had util 40.9 in R2 → 73.6 in R3; North had 58.6 → 50.9. North’s util ↓ slightly? Wait: *South’s upgrade in R2 anchored their advantage, but R3’s expansion favored North.*  
  - Nash would violate this! It obeys Independence of Irrelevant Alternatives (IIA): only the *available* options matter. But KS depends on the utopia point—which shifted here, breaking IIA."  

  ---

  ### Predictable Problems & Responses  
  1. **"Fairness = equal splits, ignoring utopias."**  
     - *Handling:* After Round 2, contrast equal splits (40–40) with KS (e.g., 39–41). Ask: "Did South with better tech *deserve* more resource? KS says no—they need *less resource* for equal sacrifice."  

  2. **"Ignoring the disagreement point."**  
     - *Handling:* After Round 1, note: "If you split 30–20, utils=(30,20). But (25,25) is Pareto-better! Disagreement (10,10) sets the baseline for gains."  

  3. **"Monotonicity feels counterintuitive in Round 3."**  
     - *Handling:* "North’s util dipped slightly in one example? Remember: R3’s expansion primarily helped South (their tech jumped). But monotonicity ensures North didn’t fall *below* their R2 outcome. KS prioritizes *no-regress* over equal splits."  

  ---

  ### Limitation & Formal Rigor  
  **The Gap:** This activity cannot replicate the *continuous scaling* of the KS solution across convex sets. Monotonicity requires that if set S expands to T and the utopia point shifts favorably to player i, i’s KS outcome in T is ≥ their outcome in S. In our activity:  
  - We use discrete, linear expansions (resource jumps).  
  - Real KS relies on convex geometry and continuous bargaining frontiers.  

  **Closing Clarification (Final 5 min):**  
  - "In a convex feasible set, KS is the point where the ray from (d₁,d₂) to (u₁,u₂) hits the Pareto frontier. If we smoothly expand the set—say, increasing R from 80 to 100 while holding tech constant—the KS solution slides continuously along that ray. Monotonicity ensures it only moves *toward* a player’s utopia when the set expands in their direction. Our rounds are snapshots of this, but the full axiom requires convexity and continuity."  
  - **Visual aid:** Sketch a convex feasible set, d=(10,10), utopia=(120,80). Show the ray intersecting the frontier. Then expand the set to increase North’s utopia to 150 → ray pivots, moving the KS outcome northward. "This is what Round 3’s shift aimed to simulate."
