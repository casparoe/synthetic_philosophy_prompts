answer: |-
  ## Exam Question

  **The contrastive question "Why did the Industrial Revolution occur in Britain and not in China?" has been central to debates on the "Great Divergence" and the "Needham Question." Critically evaluate whether this specific contrastive framing constitutes a *well-posed* explanatory question within the philosophy of history. Your evaluation must engage explicitly with the following:**

  1.  **The "Baseline Problem":** Does framing Britain and China as the contrasting cases implicitly assume a problematic level of institutional, economic, or structural comparability ("baseline equivalence") circa 1700 that is historically unsustainable? If so, how does this undermine the contrast?
  2.  **Interventionist Counterfactuals:** Applying Woodward's interventionist account of causation, where an explanation requires identifying factors such that intervening to change them (while holding background conditions fixed) would change the outcome, analyze the feasibility of constructing a stable counterfactual scenario for this question. Does the need to "hold background conditions fixed" reveal that the contrastive framing inevitably collapses into a non-contrastive analysis of Britain alone, or collapses entirely? Or can it be salvaged by severely restricting the scope of the counterfactual? Be specific about what such restrictions might entail and their implications for the explanation.
  3.  **Explanatory Structure:** Based on your analysis, conclude whether the "Britain/China" contrast is a genuinely useful explanatory structure for understanding the Great Divergence, or whether it should be replaced by a different approach (e.g., configurational analysis, multiple conjunctural causation, non-contrastive developmental narratives). Defend your conclusion rigorously.

  ---

  ## Model Answer: The Illusion of Contrast - Why "Britain/Not China" is Fundamentally Ill-Posed

  **(Approx. 700 words)**

  The persistent question "Why Britain and not China?" aims to pinpoint the causes of the Great Divergence through a seemingly clear contrast. However, upon rigorous philosophical examination grounded in the logic of contrastive explanation and interventionist causation, this framing proves fundamentally ill-posed and misleading. Its core flaw lies in the **illicit baseline assumption of comparability** circa 1700, an assumption shattered by historical scholarship and fatal when subjected to interventionist counterfactual reasoning. Consequently, the contrast collapses; it cannot be salvaged as a meaningful macrohistorical explanatory structure without rendering it trivial or incoherent, and should be replaced by configurational approaches.

  The contrastive form "Why P rather than Q?" implicitly demands that cases P (Britain) and Q (China) share a sufficiently similar set of background conditions (S) such that the crucial difference (D) causing the divergent outcomes (O_Britain, O_China) can be isolated. This is the **Baseline Problem**. Framing Britain and China as the contrasting pair presupposes that circa 1700, they occupied a comparable developmental plateau – perhaps characterized by "advanced organic economies," "proto-industrial" regions, or "high-equilibrium traps" – from which Britain uniquely diverged. This baseline equivalence is historically unsustainable. As Pomeranz, Wong, Rosenthal, Bin Wong, and others demonstrate, Britain and China circa 1700 differed profoundly in their institutional configurations (e.g., nature of property rights, state structure and capacity, fiscal systems), demographic regimes, ecological constraints and resource access (especially New World windfalls), market structures, and integration into global networks. China was arguably larger, more commercially sophisticated in many internal markets, and arguably more stable, while Britain possessed distinct advantages in coercive capacity, specific financial institutions, and global reach. Crucially, these differences were not minor variations on a common theme; they represented deeply embedded, path-dependent configurations. Selecting them as the contrasting pair *presumes* the very comparability that is the core historical question. The framing thus smuggles in an answer by its case selection, implying Britain was "ahead" or uniquely positioned *before* the divergence is explained.

  Applying **Woodward's interventionist account** exposes the fatal consequences of this baseline fallacy. Interventionism requires that an explanation identifies a cause (or difference-maker) such that an intervention changing it (ideally while holding other relevant background factors fixed) would change the outcome. To isolate "D" (the cause of divergence) in the contrast "Why Britain (developed industrially) and not China?", we must imagine an intervention on China circa 1700. We must change some factor(s) hypothesized as crucial in Britain (e.g., stronger patents, different financial institutions, parliamentary constraints on the crown) *while holding other background conditions fixed*. But what constitutes the "fixed" background? Given the profound differences identified above, holding China's background "fixed" means imposing British-style institutions, ecology, or global context onto China *is itself a massive, transformative intervention* that fundamentally alters the case. It doesn't isolate a single cause; it creates a wildly different counterfactual entity ("China-with-British-ecology-institutions-global-position"). Conversely, holding a truly minimal, neutrally defined background fixed (e.g., "Eurasian societies circa 1700 with populations > X million") leaves so much variation unconstrained that it becomes impossible to attribute the divergence to any specific factor or small set of factors acting differently in Britain versus China. The background conditions are *not* separable or fixable independently of the very factors we wish to test.

  Proponents might argue the framing can be **salvaged by severely restricting the counterfactual scope**. For instance, imagine a *very* specific, localized intervention: "If China circa 1700 had possessed *exactly* the British patent law system, *holding absolutely everything else constant*, would industrialism have emerged there?" However, this restriction is fatal to the original ambition. First, it abandons the macrohistorical "Great Divergence" explanandum, focusing instead on a micro-level institutional mechanism whose relevance to the *overall* divergence is uncertain and requires separate justification. Second, it ignores the profound interdependence of institutions and context – would British patent law function the same within the Qing administrative and social structure? Almost certainly not; its effects are contingent on the broader configuration. Third, this minimal intervention cannot explain why Britain had the patent system and China did not – it pushes the explanatory burden back to a non-contrastive analysis of each society's development. The contrastive form collapses into either a non-contrastive analysis of Britain or a trivial, contextually barren micro-thought experiment irrelevant to the macro puzzle.

  Therefore, the "Britain/Not China" framing is not merely difficult; it is ill-posed. It presupposes an unsustainable baseline and generates interventionist counterfactuals that are either incoherent or explanatorily impotent for the macro phenomenon. It should be abandoned as the primary explanatory structure. A more fruitful approach embraces **configurational analysis** and **multiple conjunctural causation**. Instead of seeking a single decisive difference, we should analyze how specific combinations of institutions, resources, contingent events, and global contexts interacted within *each* society over time. Why did Britain's *particular constellation* of factors prove explosive in its context? Why did China's *different constellation*, despite its own sophisticated dynamics, not generate a similar rupture at that specific juncture? This shifts focus from an illusory head-to-head contrast to understanding the complex, path-dependent processes within each unique historical configuration, acknowledging that the Great Divergence was not a race between equals on a single track, but the contingent outcome of vastly different historical trajectories intersecting within an emerging global system.

  ---

  ## Marking Scheme

  **Core Conceptual Moves Required for a High Grade (A/B):**

  1.  **Clear Identification & Analysis of the Contrastive Form:** Explicitly defines the logical structure of "Why P rather than Q?" and its requirements for contrastive explanation.
  2.  **Articulation of the Baseline Problem:** Clearly identifies and explains the assumption of institutional/structural comparability circa 1700 implicit in the Britain/China pairing. Uses historical evidence (even briefly/summarily) to demonstrate the *lack* of this comparability (e.g., citing state structure, property rights, ecology, global context). Explains *why* this lack of baseline equivalence undermines the contrast.
  3.  **Application of Interventionist Counterfactual Reasoning:** Correctly applies Woodward's core idea – that explanation requires specifying an intervention on a variable that changes the outcome, ideally while holding other background factors fixed. Explicitly analyzes the *feasibility* and *meaning* of "holding background fixed" given the established baseline differences. Shows *how* this application reveals the problem (either collapse into non-contrastive analysis or incoherent counterfactual).
  4.  **Critical Evaluation of Salvageability:** Engages with the possibility of restricting the counterfactual scope. Explains what such restrictions might look like (e.g., minimal, localized interventions) and provides a cogent argument for why they either fail to address the core macro question or render the explanation trivial/uninteresting/incoherent in the macrohistorical context.
  5.  **Clear, Defended Conclusion & Alternative:** Takes a clear stance on the framing's validity. If arguing against it (as per the model), proposes a coherent alternative explanatory structure (e.g., configurational analysis, path-dependence, multiple conjunctural causation) and briefly justifies its superiority for the macrohistorical explanandum. If defending it, provides a robust counter-argument addressing the baseline and interventionist challenges head-on.
  6.  **Addressing the Strongest Objection:** Explicitly identifies and counters the most plausible defense of the contrastive framing (e.g., "minimal deviation" counterfactuals, focus on specific abstract variables like "high-wage economy"). Demonstrates why this defense fails or is insufficient.

  **Distinguishing an A Answer from a B Answer:**

  *   **A Answer (Excellent):**
      *   **Does ALL of the above with sophistication, depth, and precision.**
      *   Seamlessly integrates philosophical concepts (contrastive explanation, interventionism, counterfactuals) with relevant historical substance from the Great Divergence literature.
      *   Provides a *nuanced* explanation of *why* the baseline differences matter for causal isolation under interventionism (e.g., discusses path-dependence, institutional complementarities, non-separability).
      *   Offers a compelling and well-developed critique of salvageability attempts, showing *in depth* why restricted counterfactuals fail for the *macro* question.
      *   Presents a coherent, well-justified alternative framework that directly addresses the limitations of the contrastive approach.
      *   Anticipates and effectively dismantles the strongest objections.
      *   Demonstrates originality in synthesis or argumentation within the required framework.
      *   Logically structured, clear, and concise.

  *   **B Answer (Good):**
      *   **Covers most core moves (1-5) but with less depth, nuance, or precision than an A.**
      *   Identifies the baseline problem and interventionist challenge correctly.
      *   Explains the collapse or unsalvageability of the framing, but perhaps more superficially (e.g., states background is too different without fully exploring *why* this breaks interventionism).
      *   Engages with salvageability but offers a less developed or less convincing critique (e.g., doesn't fully articulate why minimal interventions don't solve the macro problem).
      *   Proposes an alternative but with less detailed justification or connection to the specific flaws identified.
      *   May mention the strongest objection but not fully engage with or refute it.
      *   Shows good understanding but relies more on summary of concepts/arguments than deep synthesis or independent critical application.
      *   Generally clear and well-organized.

  **Common Errors Costing Marks:**

  *   **Narrative Summary:** Merely recounting historical factors favoring Britain or hindering China without engaging with the *philosophical/logical structure* of the contrastive question. (Major Deduction)
  *   **Ignoring the Baseline Problem:** Failing to explicitly identify and analyze the assumption of comparability circa 1700. (Major Deduction)
  *   **Superficial Treatment of Interventionism:** Mentioning interventionism/counterfactuals but failing to rigorously apply the requirement to "hold background fixed" to the Britain/China case and demonstrate the resulting problem. (Significant Deduction)
  *   **Ignoring Salvageability/Alternatives:** Not addressing whether the framing can be saved with restrictions or failing to propose/discuss alternative explanatory structures. (Significant Deduction)
  *   **Conflation:** Conflating the *selection* of the contrast cases with the *counterfactual reasoning* itself, or conflating causal *factors* with the *logic* of contrastive explanation.
  *   **Straw Man Objections:** Addressing weak defenses of the framing instead of the strongest plausible one.
  *   **Unsupported Assertions:** Making claims (e.g., "it's obviously comparable," "counterfactuals are impossible") without argument or evidence.
  *   **Lack of Clear Stance:** Failing to take a definitive position on whether the framing is well-posed or not by the end.
  *   **Poor Structure/Clarity:** Arguments are disorganized, opaque, or significantly exceed/fall short of the expected length without justification.
