  For progress, formal results haven't resolved the debate, but distinctions like Levi's doxastic vs. practical commitment help. The least-correction rule might be presented as an innovative heuristic, with the actuary defending it as common sense among prudent insurers. Historical plausibility could come from early probability thinkers like Bernoulli or Bayes, whose work was known in mercantile circles.

