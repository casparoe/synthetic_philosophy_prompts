answer: |-
  ### Exam Question: Philosophy of Mind & Moral Psychology  
  *(45-minute in-class essay; 500–600 words)*  

  **Background:** The *Knobe effect* reveals an asymmetry in folk judgments of intentional action. Consider two scenarios:  

  > **(Harm Case):** A corporation’s chairman learns that a new program will increase profits but *harm* the environment. He says, "I don’t care at all about harming the environment. I just want to maximize profits." He approves the program, and the environment is harmed.  
  >   
  > **(Help Case):** Another chairman learns that a new program will increase profits but *help* the environment. He says, "I don’t care at all about helping the environment. I just want to maximize profits." He approves the program, and the environment is helped.  

  Most people judge the harm as intentional but the help as unintentional, despite identical mental states toward the side-effect (*foresight without desire*).  

  **New Case:** A corporation uses a predictive algorithm to maximize profits. Through statistical updates—*without beliefs, desires, or representational states about side-effects*—it reliably produces:  
  - **(Algorithm-Harm):** Significant environmental harm.  
  - **(Algorithm-Help):** Significant environmental help.  

  The board forecasts these outcomes but builds no internal policy, report, or goal-representation about environmental effects. The algorithm operates mechanistically.  

  **Prompt:**  
  1. Would the Knobe asymmetry (stronger intentionality attributions for harm vs. help) **persist, diminish, or disappear** in this algorithmic-institutional setting? Justify your prediction.  
  2. What does your prediction imply for **two competing explanations** of the Knobe effect:  
     - The *normative account* (intentionality attributions partly depend on blame/praise-worthiness),  
     - The *mental-state account* (attributions track beliefs/desires as causal factors)?  
  Argue which account your prediction supports, weakens, or complicates.  

  ---

  ### Model Answer (550 words)  
  The Knobe asymmetry likely **diminishes but does not vanish** in the algorithmic-institutional case. This pattern challenges pure mental-state accounts while revealing the resilience—yet contextual limits—of normative evaluation, supporting a hybrid view.  

  In the original chairman cases, the asymmetry arises because evaluative judgments shape intentionality attributions. Harm triggers blame, amplifying the perceived agential contribution; help lacks praiseworthiness, downplaying intent. Mental-state accounts struggle here: both chairmen identically *foresee but do not desire* the side-effect, yet only harm is deemed intentional.  

  The algorithmic case disrupts this dynamic but incompletely. First, the **mental-state account** predicts the asymmetry *should vanish*. The algorithm and board lack beliefs/desires about side-effects: the board merely forecasts outcomes without representational commitment, and the algorithm operates via "mindless" statistical correlations. Without beliefs/desires as causal mediators, intentionality cannot be attributed under this view. Yet folk psychology likely retains *some* asymmetry. People anthropomorphize systems and infer implicit goals (e.g., "profit-obsessed algorithms ignore harm"). Harm’s salience may still skew attributions, albeit weaker than with a human agent. This persistence suggests mental states are insufficient to fully explain the effect.  

  Conversely, the **normative account** predicts asymmetry *persistence* but must confront the *diffusion of agency*. Blame requires a blameworthy agent, but here agency is fractured: the board is negligent (foreseeing but not representing harm), while the algorithm is amoral. Harm may still elicit stronger intentionality judgments because the outcome is condemnable, and the corporation is culpable for deploying a harmful system recklessly. However, without a clear agent *endorsing* harm (like the chairman’s "I don’t care"), blame—and thus intentionality—may weaken. The help case remains unintentional because indifference to benefit isn’t blameworthy. Thus, the asymmetry diminishes but persists, as normative evaluation adapts to institutional contexts.  

  This result supports a **hybrid explanation**. The asymmetry’s attenuation highlights the role of mental states: when beliefs/desires are opaque (algorithm) or passive (board’s forecast), evaluative judgments lack a clear target, reducing their grip. Yet its persistence shows normativity’s primacy: harm’s moral status can sustain weak intentionality attributions even when mental states are ambiguous, as folk psychology "fills in" agential indifference. The mental-state account thus explains the *reduction* in asymmetry strength (due to removed belief/desire cues), while the normative account explains its *residual presence* (due to blame’s inertia).  

  Ultimately, the algorithmic case reveals that the Knobe effect is not merely about discrete mental states or blunt moralism. It reflects a cognitive heuristic where moral evaluation scaffolds intent attribution *in light of perceived agency*—which, in institutional settings, becomes decentralized but not erased.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Must-Hit Conceptual Moves:**  
  1. **Identify Knobe asymmetry in original cases** (4 marks):  
     - *Harm judged intentional, help unintentional, despite identical foresight/indifference.*  
     - *Failure mode:* Misstating the vignettes (e.g., claiming the chairman desires harm).  
  2. **Distinguish normative vs. mental-state accounts** (5 marks):  
     - *Normative:* Blame/praise modulates intent; *Mental-state:* Beliefs/desires are necessary causal conditions.  
     - *Failure mode:* Conflating normative account with simple moral judgment (ignoring its role in *structuring intent*).  
  3. **Predict asymmetry fate in algorithmic case with justification** (6 marks):  
     - *e.g., "Diminishes but persists" due to fractured agency/weaker blame.*  
     - *Failure mode:* Claiming asymmetry vanishes entirely (ignoring normativity) or persists unchanged (ignoring removed mental states).  
  4. **Analyze implications for each account** (6 marks):  
     - *Mental-state:* Weakened (asymmetry persists without beliefs/desires); *Normative:* Modified (blame diffused but not absent).  
     - *Failure mode:* Treating algorithm as irrelevant without addressing *why* it challenges mental-state explanations specifically.  
  5. **Synthesize a position (e.g., hybrid)** (4 marks):  
     - *e.g., "Asymmetry attenuation supports mental-state relevance; residual asymmetry requires normative factors."*  
     - *Failure mode:* Mere description; no comparative evaluation of accounts.  

  **Grading Standard:**  
  - **A (21–25):** Hits all 5 moves with precise distinctions (e.g., "blame diffusion ≠ absence").  
  - **B (16–20):** Solid grasp of vignettes + one account, but misses algorithmic implications OR fails to comparatively evaluate theories.  
  - **C (11–15):** Describes asymmetry/accounts but lacks argument about algorithmic case OR mispredicts asymmetry fate.  
  - **D/F (0–10):** Major errors (e.g., denying asymmetry exists) or irrelevance.
