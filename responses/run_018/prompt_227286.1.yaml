  Hmm, their core anxiety seems twofold: first, whether this distinction holds water philosophically (is it really binary? does degree matter?), and second, whether predictive success alone can justify load-bearing falsehoods—especially when explanation matters. They name-drop Cartwright, hinting they want realism addressed. 

  The challenge is balancing rigor with accessibility: they want "patient friend" prose, no academic scaffolding. Yet their physics background means we can't oversimplify. I should avoid jargon like "epistemology" but keep the argument tight. 

  First, I need to validate their intuition. Load-bearing isn't just quantitative drift (like adding air resistance altering a trajectory slightly); it's qualitative annihilation (mean-field theory collapsing without infinite particles). That feels meaningfully different. But is it? Maybe all idealizations are load-bearing if probed deeply enough... 

  Wait—no. In planetary motion, neglecting asteroid gravity is idle: predictions degrade but orbits remain. Whereas assuming rational agents in economics might create market efficiency that evaporates with behavioral tweaks. The difference seems robust. 

  Friedman's defense ("predictions justify means") stumbles here. If a model only predicts *because* of a false assumption, its success might be luck or artifact. And crucially, science seeks *why*, not just *what*. Cartwright was right: predictive power ≠ explanatory depth. 

  But I shouldn't caricature instrumentalism. Friedman's point—that unrealistic assumptions focus on key variables—has merit. The verdict? Their distinction holds, and load-bearing idealizations demand scrutiny. We can't celebrate predictions while ignoring explanatory bankruptcy. 

  Final shape: start with their physicist/chemist debate, define the idealization types plainly, pressure-test the distinction, then argue that realism bites back. End affirming that science needs both prediction and understanding—especially when false assumptions aren't just convenient but constitutive.
answer: |-
  ## The Unseen Scaffolding: Why Some Idealizations Hold Weight and Others Don't

  Your chemist friend’s laughter and the clink of beer glasses echo a sentiment many scientists share instinctively: models simplify, assumptions are false, and if the numbers come out right, why fuss? Milton Friedman’s 1953 essay, "The Methodology of Positive Economics," codified this pragmatic view, arguing that the realism of a theory’s assumptions is irrelevant; its only test is the accuracy of its predictions. Your unease, born from forty years wrestling with electrons and lattices, points to something deeper, something Friedman’s elegant instrumentalism glosses over – the crucial difference between scaffolding we can kick away and scaffolding holding the entire edifice aloft. This distinction between "idle" and "load-bearing" idealization isn't just semantic hair-splitting; it strikes at the heart of what predictive success actually licenses and exposes a vulnerability in Friedman’s "as-if" defense, particularly when we consider science’s explanatory ambitions alongside its predictive ones.

  Let’s grant the power of the idle idealization. Neglecting air resistance for a falling cannonball *works*. The core dynamics – constant acceleration under gravity – remain robustly intact. Introduce air resistance, and the prediction drifts quantitatively, but the fundamental *shape* of the solution, the concept of gravitational acceleration dominating near Earth’s surface, persists. The idealization isolates the primary mechanism. Similarly, treating gas molecules as point masses in the kinetic theory captures the essential pressure-volume-temperature relationships derivable statistically. Adding finite size or intermolecular forces refines the model, adding complexity like the van der Waals equation, but the core connection between microscopic motion and macroscopic state variables doesn’t vanish; it's merely augmented. The false assumption here is a simplifying veil, easily lifted to reveal a more complex but fundamentally similar reality underneath. In these cases, Friedman’s defense feels intuitive: the model’s predictive success *does* license a degree of indifference to the falsity of the assumption *because* relaxing it doesn't destroy the phenomenon being modeled, only modifies its details. The success points to a core truth captured despite, not because of, the unreality.

  The load-bearing idealization is a different beast entirely. Here, the phenomenon predicted isn't just approximately described by the model under the idealization; it fundamentally *emerges from*, or is *sustained by*, the very unreality of the assumption. Relaxing it doesn't cause a quantitative drift; it causes the predicted phenomenon to collapse or transform into something unrecognizable. Your suspicion about mean-field theory is astute. In systems with strong correlations or disorder, mean-field approximations (replacing complex many-body interactions with an average field) don't just get the critical temperature slightly wrong; they often predict ordered phases (like ferromagnetism or superconductivity) that simply don't exist when the neglected fluctuations or inhomogeneities are properly included. The idealized assumption of perfect averaging isn't a simplifying veil; it's the foundation upon which the predicted phenomenon precariously rests. Remove it, and the phenomenon vanishes. The model doesn't approximate reality poorly; it depicts a *different* reality.

  Economics, Friedman’s own domain, is rife with potential load-bearing idealizations. Consider the assumption of perfect rationality. If market efficiency or specific equilibrium outcomes critically depend on agents possessing and flawlessly executing hyper-rational, utility-maximizing calculations with perfect information, and we know real humans are boundedly rational, subject to biases, and operate with imperfect information, then the success of a model *assuming* perfect rationality might be deeply suspect. Does the model predict well *despite* the false assumption, or *because* the false assumption artificially creates a stable, predictable equilibrium that wouldn't exist amidst the messy reality of human cognition? Is the predicted efficiency a feature of the market or an artifact of the assumption? If relaxing rational expectations fundamentally alters the model's dynamics – causing instabilities, multiple equilibria, or chaos instead of smooth convergence – then the idealization is load-bearing. The predictive success, if it exists, might be a happy coincidence within a narrow domain, but it tells us little about the *real* mechanisms driving economic behavior and may mask crucial instabilities lurking beneath the surface. The "as-if" defense here feels hollow; it licenses indifference not just to the falsity of the assumptions, but potentially to the *falsity of the phenomenon itself* as depicted.

  Does this distinction collapse under pressure? Is everything ultimately load-bearing if we dig deep enough? There’s a kernel of truth here. Any idealization, pushed to extremes or examined with infinite precision, will falter. Air resistance *does* affect even a heavy cannonball infinitesimally. But the *qualitative* difference remains crucial. For the cannonball, the core dynamics survive the relaxation; for the mean-field magnet or the hyper-rational market, the core phenomenon *as modeled* does not. Load-bearingness isn't an absolute binary, but exists on a spectrum of *fragility*. Some idealizations are robustly idle – the phenomenon persists across a wide range of relaxations. Others are highly fragile – the phenomenon is critically dependent on the specific, unreal assumption and evaporates quickly when it's modified. The key question is: how much reality can the model absorb before its core predictions fundamentally change character or disappear? Friedman’s defense works best for robustly idle idealizations; it becomes increasingly precarious as we move towards the fragile, load-bearing end of the spectrum.

  This brings us to the core of your unease: predictive success and truth. Friedman explicitly divorces prediction from explanation. A theory doesn't need to be "true" in a descriptive sense; it just needs to predict well. But the load-bearing idealization exposes a flaw in this. If predictive success is achieved *only* by an assumption that we know creates an artificial stability or phenomenon absent in reality, what does that success signify? It might indicate the model is a useful computational tool or a good curve-fitting exercise within a specific, constrained context. However, it doesn't license indifference to *why* it works. More importantly, it doesn't license the belief that the *mechanism* depicted in the model (e.g., hyper-rational agents converging to equilibrium) bears any relation to the actual causal processes at work. The success licenses indifference to whether the *theory as a whole* is true only in the weakest sense – that it produces numbers matching some data points. It emphatically does *not* license indifference to whether the assumptions are obscuring or distorting the fundamental nature of the system, especially when relaxing them destroys the prediction entirely. The load-bearing case reveals that predictive success, achieved via fragile artifice, can be profoundly misleading about the underlying reality.

  This is where Nancy Cartwright’s critique, which you alluded to, lands powerfully. Science isn't just an prediction engine; it seeks understanding. We want to know *why* things happen – the causal structures, the mechanisms. Laws and models, Cartwright argues, are often true only in highly idealized, circumscribed situations ("nomological machines"). The danger of the load-bearing idealization is that it presents a mechanism (e.g., perfect rationality leading to efficiency) that *isn't* the real mechanism, even if it sometimes yields similar outputs. Relying solely on predictive success in such cases doesn't just ignore explanation; it actively *impedes* it by promoting a false picture of causality. Your condensed matter instincts are sound: understanding why a superconductor works requires grappling with the messy realities of electron-phonon interactions and Cooper pairs, not just the elegant but ultimately brittle predictions of a mean-field BCS theory applied beyond its breaking point. Explanatory depth demands we probe the load-bearing beams, not just admire the facade held up by them.

  So, what verdict for Friedman? Your distinction is real and vital. Idle idealizations are workhorses of science; their falsity is often benign, and predictive success *can* reasonably justify their use, pointing to a robust underlying truth. Load-bearing idealizations, however, are treacherous. Their predictive success, when it occurs, is inherently fragile and potentially artifactual. It does *not* license indifference to their falsity because that falsity is constitutive of the very phenomenon being "predicted." Friedman’s instrumentalism, while a useful corrective against naive realism, overreaches when it dismisses the structure of assumptions entirely. It fails to account for the difference between a model that approximates reality and one that constructs a parallel, potentially misleading, universe. Furthermore, by severing prediction from explanation, it neglects science’s fundamental drive to understand *why*. A model built on load-bearing idealizations might predict, but if its success hinges on falsehoods that mask real causal structures, it ultimately explains nothing and risks leading us astray. The strongest instrumentalist reading buckles under the weight of the load-bearing beam. Predictive success, achieved through fragile artifice, is not enough. We must also ask what holds the prediction up, and whether that scaffolding exists in the world we seek to understand, or only in the convenient fiction we’ve built. Your physicist’s intuition, honed by decades of distinguishing robust phenomena from computational artifacts, is pointing in the right direction. Not all idealizations are created equal, and some false assumptions carry far more weight than others.
