  Give me rough probabilities for A, B, and C, combine them into an overall credence, and tell me which term you're least confident in. Also, what specific kind of argument or empirical finding would move that weakest term the most?

  My own gut says maybe 0.4 that it really bites, but I feel like I'm missing something obvious. Probly overthinking my old field notebooks.
