  *checks dictionary* Better confirm "sestina" rules - six 6-line stanzas, envoi of 3 lines with all end-words inside. Yep. Rhyme isn't required, thank goodness - that'd overcomplicate this. 

  User's phrase "the form should do the work" haunts me. Every word choice matters. "If" in the conditional must feel flimsy; "circle" should echo like a prison. Last stanza's "hands" in fifth position? That's when the belief is *used* to justify, not foundational. Perfect. 

