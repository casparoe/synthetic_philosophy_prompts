  The sestina's rotating end-word pattern (1-2-3-4-5-6 → 6-1-5-2-4-3 etc.) is perfect for showing how these concepts shift roles - what starts as foundational belief becomes justification, then loops back. The envoi must collapse all six into a tautological knot.

