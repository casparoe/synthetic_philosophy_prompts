  The user mentions a powerful being threatening torture to elicit admiration and a harmless spider with a monetary reward for fear. In both cases, there's a reason to adopt the attitude because of consequences, but the attitude isn't fitting or correct. The core issue is separating pragmatic reasons from appropriateness. 

  The user is familiar with LessWrong and rationalist concepts, so they value precise terminology. They want to know if there's an established term for this distinction. I recall terms like "pragmatic reasons" vs. "epistemic reasons" in belief contexts, but they're asking about attitudes like admiration and fear too. The fitting-attitude analysis might be relevant here, where correctness depends on the object's properties.

  For admiration, the fittingness depends on admirable traits, not threats. Similarly, fear's correctness ties to actual danger, not rewards. So the boundary is whether the reason relates to the object's properties that make the attitude fitting. 

  Belief might be special because evidence directly relates to truth, which is its correctness condition. Pragmatic reasons don't affect truth but might influence belief adoption. The user wonders if the boundary is the same across attitudes. Probably yes, but with belief having a stronger norm (truth vs. usefulness).

  Are there borderline cases? Maybe when outcomes indirectly relate to correctness, like feeling fear to avoid real danger. But the reason here is still outcome-based, not about the object's properties. The key is whether the reason directly bears on the attitude's intentional object.

  Since no single term covers all attitudes, "extrinsic normative pressure" could be a proposed term. The established terms are context-specific: pragmatic reasons for belief, instrumental for desires. The answer should reflect that "pragmatic reasons" is the closest, with caveats.
answer: |-
  This distinction is well-recognized in philosophy, particularly in meta-ethics, philosophy of mind, and epistemology. The established technical name for considerations that count in favor of being in a state *because of its consequences*, while being irrelevant to the *correctness* or *fittingness* of that state *toward its object*, is **pragmatic reasons**.

  Here's the precise carving:

  1.  **The Distinction Defined:**
      *   **Pragmatic Reasons:** These are reasons to *bring about* or *cultivate* a particular mental state (belief, desire, emotion, attitude) *because of the beneficial consequences* (or avoidance of harmful consequences) *of having that state itself*. They stem from the *instrumental value* of the state.
      *   **Non-Pragmatic Reasons (Fittingness/Correctness Reasons):** These are reasons that bear directly on whether the state *accurately represents*, *is an appropriate response to*, or *fits* its intentional object. These reasons concern the *internal standards of correctness* inherent to the type of state.

  2.  **The Boundary:**
      *   The boundary is drawn based on the **source of normativity**:
          *   **Pragmatic Reasons:** Source = Consequences *of having the state* (e.g., reward, punishment, utility).
          *   **Non-Pragmatic Reasons:** Source = Properties *of the intentional object* relevant to the state's constitutive aim (e.g., dangerousness for fear, admirability for admiration, truth for belief, desirability for desire).
      *   **Key Test:** Ask: "Does this consideration make the state *more accurate* or *more appropriate* as a response *to this specific object*?" If the answer is "No, but it makes *having* the state beneficial," it's a pragmatic reason.

  3.  **Consistency Across Attitudes:**
      *   **Belief is NOT fundamentally special:** The *structure* of the distinction applies universally to intentional states with constitutive aims (fear, admiration, desire, belief).
      *   **The Standard of Correctness *is* Special:** Belief has a uniquely strict and dominant standard: correspondence with truth. Pragmatic reasons for belief (e.g., believing for comfort) notoriously *fail* to provide *justification* for the belief *as true*, violating its constitutive norm. While pragmatic reasons might make it *prudent* to try to instill a belief in yourself, they cannot make the belief itself *epistemically justified* or *correct*. This makes the tension between pragmatic and correctness reasons particularly stark for belief, often leading to claims that "there are no pragmatic reasons *for belief*" (meaning reasons that justify the belief *as true*), only reasons to *cause* oneself to believe. This nuance is unique to belief's truth-aim.

  4.  **Cases on the Boundary or Arguments for Overlap:**
      *   **Indirect Links:** A pragmatic consideration might *indirectly* point to a correctness reason. (e.g., "Being afraid of that spider might make you cautious around *other* spiders that *are* dangerous." The pragmatic reason points to a potential correctness reason for a *different* object/state, not for *this* spider/fear).
      *   **Motivational/Epistemic Entanglement:** Cultivating a state for pragmatic reasons might make one more receptive to *finding* genuine correctness reasons (e.g., trying to admire someone for a reward might make you notice actual admirable traits). This doesn't make the *original* pragmatic reason a correctness reason; it just changes the context.
      *   **Constitutive Aim Arguments:** Some argue that for states *other* than belief (e.g., desire), pragmatic considerations *could* potentially contribute to correctness if the state's aim includes well-being. However, this is highly contested. Most maintain that even for desire, the *object*'s desirability (its goodness or ability to satisfy) is distinct from the usefulness *of desiring it*.
      *   **Self-Fulfilling States:** If believing X makes X true (e.g., believing you can succeed makes you more likely to succeed), the pragmatic reason (success) *coincides* with a potential correctness reason (truth). However, the *source* of the reason remains distinct: the pragmatic reason is the *value of the consequence* (success), while the correctness reason would be the *actual likelihood* of success *given the belief*. The pragmatic reason exists even if the belief *doesn't* make it true; the correctness reason depends on whether it *does* or not.

  5.  **Nearest Neighbouring Concepts & Why They Don't Fit:**
      *   **Epistemic Reasons (for belief):** *Are* the correctness reasons for belief (evidence). Pragmatic reasons are distinct.
      *   **Instrumental Reasons (for action):** Reasons to perform an action to achieve a goal. Pragmatic reasons are a *type* of instrumental reason, but specifically instrumental *about mental states* themselves. Broader than the requested concept.
      *   **Prudential Reasons:** Reasons concerning one's own well-being. Pragmatic reasons are often prudential, but not exclusively (they could be moral). Prudential reasons can also *be* correctness reasons (e.g., the danger of the spider is a prudential reason *for* fear). Broader and not specific to the state/object relation.
      *   **Causal vs. Normative Reasons:** Pragmatic reasons *are* normative reasons (they count in favor), not mere causes. The distinction is between *types* of normative reasons.
      *   **Fitting-Attitude Analysis:** This is the framework *within* which the distinction between pragmatic and correctness reasons is most clearly drawn for attitudes like admiration and fear. Correctness reasons are those identified by fitting-attitude analysis (what makes admiration fitting? Admirable properties). Pragmatic reasons are external to this analysis.

  **Conclusion:** The established technical term for the class of considerations you describe is **pragmatic reasons**. They are distinguished from correctness/fittingness reasons by their source (consequences of having the state vs. properties of the object) and their inability to make the state fitting or correct towards its object. This distinction holds across attitudes like admiration, fear, and desire, though belief's unique truth norm makes pragmatic reasons particularly incapable of justifying belief *as belief*. Borderline cases exist mostly where pragmatic reasons indirectly facilitate finding correctness reasons, but they don't dissolve the core distinction.

  \answer{pragmatic reasons}
