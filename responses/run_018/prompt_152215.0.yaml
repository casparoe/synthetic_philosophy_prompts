prompt: |-
  I was talking to my roommate about this moral-uncertainty thing he read on a blog. He summed it up like this: "If you're unsure whether you're a utilitarian or a deontlogist, you just assign credances and do expected value calculus across theories. So if you're 60% deontologist, killing one innocent person is 60% infinitely wrong and 40% okay if it saves five lives. Then you solve for the break-even point and it turns out you should only kill if you save more than 1.67 people per death, which avoids being a pure consequentialist but still lets you trade lives sometimes. He also said this means you might have to do things that are wrong on every theory you consider, like telling a small lie that is mildly bad on utilitarianism but severely forbidden on deontology, because the expectation comes out positive." How fair is that summary? Go through it piece by piece and tell me what a philosopher working on normative uncertainty would accept, what they'd wince at, and what's just confused -- especially the part about multiplying infinite wrongness by 0.6 and the claim that you can end up with actions that are wrong on every theory. Does his conclusion about small lies actually follow?
reasoning: |-
  Okay, let me start by understanding the user's query. They're discussing a summary their roommate gave about moral uncertainty, specifically combining utilitarianism and deontology using expected value calculus. The user wants to know how accurate this summary is and where it might be problematic, especially regarding infinite wrongness and actions wrong on all theories.

  First, I need to recall what normative uncertainty theory involves. It's about making decisions when you're unsure which moral theory is correct. The roommate's approach uses expected value, assigning probabilities to each theory and calculating the expected moral value of actions. The key points to address are: multiplying infinite disvalue by a probability, the break-even point for saving lives, and actions that are wrong on all theories but might still be obligatory under uncertainty.

  The main issue is handling deontology's absolute prohibitions. If deontology views killing as infinitely wrong, multiplying infinity by any probability is mathematically problematic. Philosophers like MacAskill and Sepielli have discussed this, suggesting ordinal rankings or lexical priorities instead. I should explain why multiplying infinity doesn't work and mention these alternatives.

  Next, the break-even point calculation. The roommate says saving 1.67 lives per death is the threshold. But if deontology assigns infinite disvalue to killing, even a small probability makes the expected disvalue infinite, meaning you can't balance it with finite utility gains. This contradicts the roommate's calculation. I need to clarify that under standard interpretations, any non-zero probability of infinite wrong would prohibit the action, making consequentialist trade-offs impossible unless deontology's prohibition isn't absolute.

  Then, the part about actions wrong in all theories but having positive expected value. The example is a small lie that's mildly bad in utilitarianism but severely forbidden in deontology. If deontology's prohibition is infinite, the expected disvalue would be infinite, making the action impermissible. But if the disvalue is finite, then it's possible. However, the term "wrong on every theory" might confuse normative evaluations with decision-making under uncertainty. Even if an action is wrong according to each theory, expected value could still favor it if the probabilities and values align. But this is counterintuitive and controversial. Philosophers like Weatherson and Harman debate this, with some arguing that an action wrong in all considered theories shouldn't be done. I should highlight this disagreement.

  The user might be interested in practical applications of moral uncertainty, like ethical dilemmas in real life. Their roommate's summary oversimplifies, so pointing out the complexities is important. Also, the user might want to understand if there's a reliable method for making decisions when torn between moral frameworks. Addressing the mathematical issues and philosophical debates will help them grasp why the roommate's approach is contested.

  I should also check the sources. MacAskill's "Moral Uncertainty" discusses lexical thresholds and expected value. Sepielli's work on ordinal comparisons is relevant. The conclusion about small lies only holds if deontology's disvalue isn't infinite, otherwise it's invalid. Emphasizing the conditions under which each part holds or fails will clarify the summary's fairness.

  Finally, structure the response piece by piece, noting what's accepted, problematic, and confused. Highlight the mathematical confusion with infinity, the break-even point oversight, and the controversy around obligatory but universally condemned actions. Conclude by balancing the summary's strengths in introducing the concept versus its technical flaws.
answer: |-
  That's a surprisingly sophisticated summary for a blog post! Your roommate grasps the core idea of *expected moral value* under normative uncertainty, but there are significant philosophical and technical wrinkles, especially regarding infinite disvalues and "universally wrong" actions. Let's break it down:

  **The Core Idea: Expected Moral Value**
  *   **Roommate's Summary:** Assign credences to moral theories (e.g., 60% Deontology, 40% Utilitarianism) and calculate the expected moral value of an action by weighting each theory's evaluation by your credence.
  *   **Philosopher's View:** This is **largely accepted** as the foundational framework by proponents of normative uncertainty theory (e.g., William MacAskill, Toby Ord, Andrew Sepielli). The idea is that if you care about being moral and are unsure *which* morality is correct, you should maximize *expected moral value*, just as you'd maximize expected utility under empirical uncertainty.

  **The Killing One to Save Five Example:**
  *   **Roommate's Setup:**
      *   Deontology (60%): Killing an innocent is infinitely wrong (disvalue = -∞).
      *   Utilitarianism (40%): Killing one to save five is net good (+4 utils? +5? The specific number matters less than it being finite positive).
  *   **Roommate's Calculation:**
      *   Expected Disvalue = (0.6 * -∞) + (0.4 * +4) = -∞ + 1.6 = -∞.
      *   **Break-Even Claim:** Set (0.6 * -∞) + (0.4 * S) = 0. He argues this implies you need S = (0.6 / 0.4) * ∞ / ∞ = 1.5 * 1 = 1.5 lives saved per death? (His 1.67 seems miscalculated from 60/40=1.5, not 1.67. 1.67 is 1/0.6, which is a different calculation).
  *   **Philosopher's Wince & Confusion:**
      1.  **Multiplying Infinity:** This is the **biggest problem.** Multiplying infinity by any positive number (like 0.6) is **mathematically undefined and philosophically incoherent** in standard arithmetic. You cannot do meaningful arithmetic with infinity this way. (0.6 * -∞) is still -∞. Adding *any* finite number (like 0.4 * +S) to -∞ still leaves you with -∞. **Conclusion:** Under this setup, the expected value is *always* -∞ for any action involving killing an innocent, no matter how small your credence in Deontology (as long as it's non-zero) or how many lives you save. Any non-zero chance of infinite wrongness swamps any finite good. Deontology's prohibition would effectively be absolute under uncertainty.
      2.  **Break-Even Point Implausibility:** Because of the infinity problem, the proposed break-even point **doesn't hold water.** If Deontology assigns *infinite* disvalue, you can *never* "break even" by saving a finite number of lives under uncertainty. The calculation he attempts is mathematically invalid.
      3.  **Possible Salvage (What Philosophers Debate):**
          *   **No True Infinities:** Maybe Deontology doesn't *literally* assign infinite disvalue, but just an extremely high finite disvalue. Then calculation *is* possible, and break-even points make sense. E.g., if killing = -1,000,000 utils, then Expected Value = (0.6 * -1,000,000) + (0.4 * +S). Set to zero: -600,000 + 0.4S = 0 => S = 1,500,000 lives saved. This is more like 1.5 *million* per death, not 1.5 or 1.67. His numbers are way off.
          *   **Lexical Priority/Thresholds:** Some frameworks (e.g., MacAskill) suggest theories might have *lexical priorities* or *thresholds*. Deontology's prohibition might be so strong it lexically dominates Utilitarianism's calculus for that specific act-type, meaning any non-zero credence forbids the act entirely, regardless of consequences.
          *   **Ordinal Rankings:** Others (e.g., Sepielli) argue we can only rank actions ordinally *within* each theory and then try to find a "best fit" across theories under uncertainty, avoiding cardinal numbers and infinities altogether. Break-even calculations become impossible in this framework.

  **The "Small Lie" Example & Universally Wrong Actions:**
  *   **Roommate's Claim:** You might be obliged to do an action that is wrong according to *every* theory you consider (e.g., a small lie: mildly bad for Utilitarianism, severely forbidden for Deontology), if the *expected value* is positive (e.g., Utilitarianism's mild disvalue is outweighed by the high credence on a less severe Deontological disvalue? His wording is ambiguous here).
  *   **Philosopher's View - Highly Controversial:**
      1.  **The Infinity Problem Again:** If Deontology assigns *infinite* disvalue to lying, then the expected value is -∞ (due to any non-zero credence), making the action impermissible under uncertainty, regardless of Utilitarianism's mild assessment. The "positive expectation" claim **fails** under the infinite disvalue model.
      2.  **Finite Disvalues - Possible in Theory:** Assume both disvalues are finite. Suppose:
          *   Deontology (60%): Lying = -100 utils (severely forbidden)
          *   Utilitarianism (40%): This specific small lie = -2 utils (mildly bad)
          *   Expected Value = (0.6 * -100) + (0.4 * -2) = -60 - 0.8 = -60.8. **Negative!** Not positive.
          To get a *positive* expected value, the action would need to be *good* according to at least one theory with sufficient weight. *If* an action is *wrong* on every theory, it means *every* theory assigns it a *negative* value. The expected value is then a *weighted average of negatives*, which **must also be negative** (unless a theory assigns exactly zero, but "wrong" usually implies negative). **Conclusion:** An action considered *wrong* by every theory you have non-zero credence in **cannot have a positive expected moral value.** It will always be negative.
      3.  **The Nuance - Wrong vs. Obligatory vs. Permissible:** The controversial claim is whether an action that is *merely permissible* or even *required* under the expected value calculation could be *wrong* according to *every* individual theory. For example:
          *   Theory A: Action X is wrong (-10), Action Y is obligatory (+5).
          *   Theory B: Action X is obligatory (+5), Action Y is wrong (-10).
          *   You have 50% credence in each.
          *   Expected Value of X: (0.5 * -10) + (0.5 * +5) = -5 + 2.5 = -2.5
          *   Expected Value of Y: (0.5 * +5) + (0.5 * -10) = 2.5 - 5 = -2.5
          *   Suppose the only other option is Inaction (Value 0 in both theories). Expected Value of Inaction = 0.
          *   **Conclusion:** Inaction (EV=0) has higher expected value than X (EV=-2.5) or Y (EV=-2.5). You are obliged to do nothing. Both X and Y are *wrong* according to *each* theory individually (-10 in the theory that forbids it), *and* they are impermissible under uncertainty (EV negative).
          *   **The Controversial Case:** Is there a scenario where the *best available option* under expected value calculation is *wrong* according to *every* theory? This is hotly debated. Some (e.g., Brian Weatherson, Elizabeth Harman) argue this is possible and even likely. Others (e.g., Jacob Ross) argue that if an action is wrong according to every theory you find plausible, you simply shouldn't do it, regardless of the expected value calculation between them. This is a major open debate in the field. **Your roommate's specific "small lie" example likely doesn't work** (due to the infinity issue or the math of averaging negatives), but the *general possibility* of being required to do something condemned by all your candidate theories is a **live and contentious philosophical issue**.

  **Overall Fairness of Summary:**

  1.  **Accepted:** The core idea of maximizing expected moral value under normative uncertainty by weighting theories by credence is a standard (though not universally accepted) proposal in the field.
  2.  **Wince-Worthy:**
      *   The blithe handling of "infinite wrongness" and the specific calculation (multiplying by 0.6, break-even point) is **deeply flawed and misleading.** It ignores the central mathematical and philosophical problem infinity poses.
      *   The specific numbers used (60%, saving 5 lives, break-even at 1.67) are arbitrary and, in the infinite case, nonsensical.
      *   Claiming the small lie example *demonstrates* the "universally wrong but obligatory" point is incorrect based on his own premises (if deontology has infinite disvalue) or the math (if disvalues are finite).
  3.  **Confused:**
      *   The mathematical operations with infinity are invalid.
      *   The break-even point calculation relies on this invalid math.
      *   The implication that you can easily balance an infinite disvalue with finite goods under uncertainty is false.
      *   The small lie example doesn't successfully illustrate the "universally wrong" point as stated.

  **In short:** Your roommate gets an A for explaining the *concept* of normative uncertainty and expected moral value. He gets a D (or an incomplete) for the mathematical execution, especially regarding infinity and the specific examples. The "universally wrong but obligatory" idea is a real and controversial topic, but his small lie example doesn't successfully demonstrate it given his premises. Philosophers working on this take the infinity problem *very* seriously and propose complex (and debated) solutions like lexical thresholds or ordinal comparisons to avoid it. The break-even point he calculates is a mathematical artifact of mishandling infinity, not a genuine result.
