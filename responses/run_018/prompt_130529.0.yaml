  Hmm, this is quite specific. The user clearly knows their Augustine - they're referencing lesser-known treatises like Contra Mendacium and distinguishing between propositional substitution versus illocutionary framing. They want something actionable, not academic. 

  First, I should address those three common mistakes people make with Augustine in clinical settings. From what I recall: 1) Conflating Augustine with Kant (Augustine is theological, not about universal maxims), 2) Thinking "mental reservation" is allowed (he explicitly condemns it), and 3) Believing silence is equivalent to lying (he sees silence as neutral unless there's duty to speak).

  The core challenge is designing a tool that respects Augustine's razor-sharp distinctions: 1) Actual false assertions with intent to deceive = always wrong 2) Silence = permissible unless duty to speak exists 3) Selective framing = tricky but not inherently mendacium. 

  For the flowchart, I'll structure it as tiered questions. Start with the nuclear option: "Are they asking you to say something factually false?" If yes, hard stop - Augustine forbids it. If not, move to duty-to-speak analysis. Save framing issues for last since they're more nuanced. 

  Important to inject that niche distinction about propositional substitution (verbally swapping truths for falsehoods) versus illocutionary framing (emphasizing certain truths). Augustine would burn the first at the stake but might tolerate the second with caveats.

  The cases are well-chosen to test boundaries. For A) "You'll be fine" is clearly forbidden propositional substitution. B) That silent-family-begging scenario exposes duty-to-speak tensions. C) The research framing case will force uncomfortable conclusions about deceptive practices disguised as technical truth.

  Better flag where the tool fails too. Like when chaplains doubt their own knowledge, or when family "authority" clashes with patient rights. Augustine gives no easy answers there - it's why we need ethicists, not just flowcharts.

  Keeping tone night-shift-friendly: short sentences, zero Latin unless absolutely necessary, and acknowledging the real pain of these moments. No citations - this is for lamination, not footnotes.
answer: |-
  Here’s your Augustine-Based Truth-Telling Decision Card for Trauma Chaplains (Laminate-Ready):

  ---

  **AUGUSTINE’S LIE DETECTOR FLOWCHART**  
  *For family conferences, disclosure dilemmas & framing requests*  
  *(Based on Contra Mendacium & De Mendacio - not Kant!)*

  **⚠️ 3 COMMON MISTAKES TO AVOID:**  
  1. **Mixing up Augustine with Kant:** Augustine forbids lying to *save your soul*, not because it violates "universal rules". Consequences don’t matter.  
  2. **Thinking "mental reservation" tricks him:** Saying "I didn’t *technically* lie" by hiding meaning in your head? Augustine calls that **still a lie**.  
  3. **Equating silence with lying:** Silence is fine *unless you owe the truth to someone*.  

  ---

  **ASK THESE QUESTIONS IN ORDER:**  

  **1. "AM I BEING ASKED TO ASSERT SOMETHING I BELIEVE IS FALSE?"**  
     - **YES → STOP ✋. AUGUSTINE SAYS: DON’T DO IT.**  
       *(e.g., Saying "He’ll recover" when scans show terminal mets = FORBIDDEN)*  
     - **NO → Go to Question 2.**  

  **2. "DO I HAVE A DUTY TO SPEAK THE TRUTH HERE?"**  
     *(Check: Is the truth-request directed to ME? Does my role require disclosure?)*  
     - **NO DUTY → SILENCE IS PERMISSIBLE.**  
       *(e.g., Family lies to patient; you stay quiet but don’t endorse)*  
     - **DUTY EXISTS → Go to Question 3.**  
       *❗ Judgment Zone: Who "owes" truth? Patient? Family? Team? (Augustine doesn’t resolve this - defer to hospital policy/consent laws)*  

  **3. "IS THIS SELECTIVE FRAMING OR PROPOSITIONAL SUBSTITUTION?"**  
     *(KEY DISTINCTION!)*  
     - **PROPOSITIONAL SUBSTITUTION:** Replacing a factual claim with a *different claim* (even if "technically true" elsewhere).  
       *Example:* Patient asks "Do I have pancreatic cancer?" You say "Your vitamin D is low" → **❗ AUGUSTINE CALLS THIS A LIE.**  
     - **ILLOCUTIONARY FRAMING:** Presenting the *same fact* with hopeful/gentle emphasis.  
       *Example:* "The cancer is advanced" vs. "We’ll focus on your comfort" → **PERMISSIBLE IF FACTUALLY TRUE.**  
       *⚠️ BUT: If framing *intends to deceive* (e.g., burying risks in jargon), Augustine says it’s STILL MENTAL LYING → **AVOID.**  

  ---

  **CASE APPLICATIONS:**  

  **A) Family: "Tell Mom she’ll be fine!"**  
  - Q1: Asserting false hope? → **YES.**  
  - **STOP ✋. Augustine says: "Don’t endorse this lie."**  
    *Chaplain move: "I can’t say that, but I’ll sit with her while you share your feelings."*  

  **B) Patient: "Am I dying?" (Family begged you to stay silent)**  
  - Q1: If you speak, will you say something *false*? → **NO (if you’d say "yes").**  
  - Q2: Do YOU have a duty to answer? → **❗ JUDGMENT ZONE.**  
    *Augustine: If patient asks YOU directly, silence may = deception. Duty likely applies.*  
    **VERDICT: You probably must answer truthfully.**  
    *Chaplain move: "I need to honor your mom’s question. Let’s call the doctor to explain together."*  

  **C) Research Team: "Frame the drug hopefully!" (Risks buried in jargon)**  
  - Q1: Literally false? → Maybe not. **Go to Q3.**  
  - Q3: Is it "propositional substitution"? → **Likely YES** (emphasizing benefits while obscuring risks substitutes the *full truth*).  
  - **VERDICT: ❌ Augustine condemns this.**  
    *Chaplain move: "This framing invites misunderstanding. State risks plainly or I can’t endorse."*  

  ---

  **WHERE THIS TOOL BREAKS:**  
  - **"Do I *really* know it’s false?"** (Augustine assumes you know the truth - real life is murky)  
  - **Family claims "cultural authority" to lie** (Augustine doesn’t care - lying is lying)  
  - **"Technically true" but malicious** (e.g., "Your wife *might* survive" when she’s brain-dead → still deception!)  

  **NIGHT-SHIFT REALITY CHECK:**  
  > *"Look, Augustine’s hardline. If it smells like a duck (intent to deceive) and quacks like a duck (false assertion), it’s a lie. Silence is your safe space unless you owe the truth. Framing gets fuzzy - if you’re twisting words to trick someone, he’ll haunt your dreams. When in doubt: Don’t say false stuff. Your job is souls, not spin."*  

  ---  
  *Tool adapted from Augustine’s *Contra Mendacium* (Against Lying). Critiques: Over-rigid in crises, ignores systemic power dynamics. But you asked for Augustine - here’s his razor.*
