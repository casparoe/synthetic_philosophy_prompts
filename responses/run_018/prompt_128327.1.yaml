prompt: |-
  I'm a science journalist covering neuroscience and theoretical psychology, and I need a reusable editorial procedure I can run in about fifteen minutes to determine whether a research submission genuinely explains its findings through predictive processing and the free energy principle, or merely uses those terms as conceptual decoration. Write a step-by-step checklist—ordered questions, what counts as a sufficient answer at each stage, explicit stop points where the verdict is negative, and clearly marked judgment calls—grounded in the actual mechanics of hierarchical generative models, precision-weighted prediction errors, and active inference rather than loose metaphor. The procedure should distinguish mechanistic specificity from redescriptive labeling, state exactly where evaluation must be handed to a specialist because it exceeds journalistic competence, and flag the steps that are irreducibly value-laden rather than factual. Apply it to two hypothetical cases: first, a clinical study linking hallucination severity to independently measured precision-weighting deficits in auditory cortex; second, a behavioral study describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics. Include at least one worked case where the procedure returns a negative verdict that conflicts with the authors' own framing, and be explicit about what the checklist cannot settle.
reasoning: |-
  We are creating a reusable editorial checklist to evaluate whether a research submission genuinely employs predictive processing (PP) and the free energy principle (FEP) mechanistically or merely uses them as conceptual decoration.

  The core of the evaluation must focus on:
  1. Hierarchical generative models: The paper should specify or imply a hierarchical structure of generative models that generate predictions (priors) at multiple levels of abstraction.
  2. Precision-weighted prediction errors: The paper must account for how prediction errors are weighted by precision (inverse uncertainty) and how this precision is modulated.
  3. Active inference: The paper should consider action (including perceptual inference) as an integral part of minimizing prediction error (or free energy) either through changing predictions (perception) or changing sensory input (action).

  The checklist will consist of ordered questions. At each step, we will specify:
  - What counts as a sufficient answer?
  - Stop points (negative verdict) if the answer does not meet the criteria.
  - Judgment calls (where the evaluator must use some discretion, but we will try to minimize these).

  Additionally, we will flag:
  - Steps that require specialist knowledge (beyond journalistic competence) and where evaluation must be handed off.
  - Steps that are irreducibly value-laden (subjective).

  We will then apply the checklist to two hypothetical cases.

  ---

  **Checklist: Evaluating Genuine Use of Predictive Processing and Free Energy Principle**

  **Step 1: Core Claims Check**
  - **Question:** Does the paper explicitly claim that its findings are explained by, or consistent with, predictive processing (PP) and/or the free energy principle (FEP)?
  - **Sufficient Answer:** Yes, the paper states that PP/FEP is a central theoretical framework for the study. If not, the paper may still be using the terms, so we proceed to Step 2. If the paper does not mention PP/FEP at all, then it is not using them as decoration either -> **Stop (Negative: Not applicable)**.
  - **Stop Point:** If the paper does not mention PP/FEP, stop. Otherwise, proceed.
  - **Judgment Call:** None.

  **Step 2: Generative Model Specification**
  - **Question:** Does the paper specify (or clearly imply) the structure of the generative models (e.g., hierarchical layers, what variables are being predicted, and at what levels of abstraction) that are central to the proposed mechanism?
  - **Sufficient Answer:** The paper must describe or refer to a model that generates predictions (priors) about sensory inputs or hidden states, and this model should have at least an implicit hierarchical structure (i.e., higher levels predict lower levels). The model should include variables that can be updated by prediction errors.
  - **Stop Point:** If the paper does not specify or imply a generative model (e.g., only uses the term "prediction" in a general sense without tying it to a model that generates predictions), then **Stop (Negative: Decorative use)**. Otherwise, proceed.
  - **Judgment Call:** The requirement of "hierarchical" structure is a judgment call. If the model is clearly described as having multiple levels (e.g., low-level sensory features and high-level abstract representations) that's sufficient. If the model is flat (only one level) but the paper argues it is a generative model, we proceed but note that this is non-standard and requires justification (this becomes a judgment call in Step 3). However, a flat model might still be acceptable for very simple systems.

  **Step 3: Precision Weighting**
  - **Question:** Does the paper account for how the precision (reliability, certainty) of predictions or prediction errors is modulated and how this weighting affects inference or behavior?
  - **Sufficient Answer:** The paper must mention precision (or equivalent terms like uncertainty, confidence, reliability) and explain how it is assigned (e.g., contextually modulated, learned, or pathologically altered) and how it weights prediction errors (i.e., high precision on a prediction error means it has a larger impact on updating beliefs). If the paper does not mention precision but claims to use active inference, then proceed to Step 4 and note that precision is a critical component of active inference in perception and action. However, if the paper only uses passive inference (perception only) and does not mention precision, this step fails.
  - **Stop Point:** If the paper does not mention precision or an equivalent concept and does not have a clear alternative mechanism for how prediction errors are weighted (e.g., just uses unweighted prediction errors), then **Stop (Negative: Decorative use)**. Otherwise, proceed.
  - **Judgment Call:** Determining equivalence (e.g., if they use "confidence" but do not link it to prediction error weighting) is a judgment call. If they use a term that clearly maps to precision (like inverse variance) and explain its role in weighting, that's sufficient. If they mention precision but do not explain how it affects the processing, that is insufficient.

  **Step 4: Active Inference**
  - **Question:** Does the paper incorporate active inference (i.e., action as minimizing prediction error by changing sensory input) or, if focusing only on perception, does it at least specify how perceptual inference (updating beliefs) minimizes prediction error?
  - **Sufficient Answer:** 
    - For perception: The paper must describe belief updating (changing the generative model) as driven by prediction errors (and weighted by precision). 
    - For action: The paper must describe actions as being selected to fulfill predictions (i.e., to bring about expected sensory states) by minimizing expected prediction error (or free energy). 
    - Note: A paper can focus solely on perception and still be genuine, but it must then be explicit about the inference process (Step 4a). If the paper includes action, it must describe action selection in terms of expected free energy minimization (Step 4b).
  - **Stop Point:** If the paper does not describe how either perception (belief updating) or action is driven by prediction error minimization (and how precision is involved in the case of perception), then **Stop (Negative: Decorative use)**. Otherwise, proceed.
  - **Judgment Call:** Deciding whether the description of belief updating or action is sufficiently tied to prediction error minimization. For example, if they say "beliefs are updated to reduce surprise" without mentioning prediction errors, that is insufficient. They must mention prediction errors and how they drive updating.

  **Step 5: Mechanistic Specificity**
  - **Question:** Does the paper provide a specific mechanistic link between the PP/FEP components (generative models, precision, prediction errors, action) and the observed phenomena, beyond merely relabeling existing concepts?
  - **Sufficient Answer:** The paper should explain how the observed data (e.g., behavioral, neural) are generated by or relate to the dynamics of the generative model, precision weighting, and/or active inference. It should not just use PP/FEP terms as synonyms for existing psychological constructs without adding mechanistic detail (e.g., "minimizing surprise" as a synonym for reinforcement learning without specifying the generative model).
  - **Stop Point:** If the paper only uses PP/FEP terminology as a relabeling of existing concepts without providing a mechanistic account (e.g., "we call reward prediction error as just prediction error", but without the broader PP machinery), then **Stop (Negative: Decorative use)**. Otherwise, the paper passes and is considered a genuine use.
  - **Judgment Call:** This step is highly judgment-based. The evaluator must decide if the PP/FEP framework is providing a distinct mechanistic explanation or just a relabeling. This is where the distinction between a genuine explanation and a metaphor is most critical.

  **Specialist Handoff:** 
  - If at any step the paper presents a formal mathematical model (e.g., a specific free energy functional, Bayesian update equations, or simulations) and the evaluator is not equipped to evaluate its correctness or consistency with PP/FEP, then the evaluation must be handed to a specialist at that point. This is especially relevant in Step 2 (if the generative model is mathematically complex) and Step 5 (if the mechanistic link is formalized in equations). The checklist can proceed until such a formal model is encountered, then hand off.

  **Value-Laden Steps:**
  - Step 5 (Mechanistic Specificity) is irreducibly value-laden because it requires the evaluator to judge whether the explanation is sufficiently mechanistic and not just a relabeling. This judgment may depend on the evaluator's prior knowledge and the state of the field.

  ---

  **Application to Hypothetical Cases**

  **Case 1: Clinical study linking hallucination severity to independently measured precision-weighting deficits in auditory cortex.**

  **Step 1:** The paper claims that hallucinations are explained by PP/FEP. Proceed.

  **Step 2:** The paper specifies a hierarchical generative model for auditory processing (e.g., higher levels predict semantic content, lower levels predict acoustic features). They describe how predictions flow down and prediction errors flow up. Sufficient. Proceed.

  **Step 3:** The paper explicitly measures precision-weighting deficits (e.g., via EEG or fMRI, showing reduced precision on prediction errors in auditory cortex in hallucinating patients). They explain that low precision on prediction errors means they are not given enough weight, leading to over-reliance on prior beliefs (hallucinations). Sufficient. Proceed.

  **Step 4:** The paper focuses on perceptual inference (not action). They describe how in auditory hallucinations, the precision on prediction errors is too low, so perception is dominated by top-down predictions (prior beliefs) even when they are inaccurate. This is a clear account of perceptual inference in PP. Proceed.

  **Step 5:** The paper links the observed neural deficit (reduced precision-weighting in auditory cortex) to the symptom (hallucinations) via the PP mechanism. This is a specific mechanistic link. 

  **Verdict:** Genuine use.

  ---

  **Case 2: Behavioral study describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics.**

  **Step 1:** The paper claims consumer choice minimizes surprise (a term from FEP). Proceed.

  **Step 2:** The paper does not specify a generative model. It just says that consumers choose options that minimize surprise. There is no description of what predictions are made, at what levels, or how they are generated. 

  **Stop Point:** Step 2 fails. The paper does not specify a generative model. 

  **Verdict:** Negative (Decorative use). 

  **Note:** Even if we proceed (if we are lenient on Step 2), the next steps would fail:

  Step 3: No mention of precision or how prediction errors are weighted.

  Step 4: It describes choice as minimizing surprise, which sounds like active inference (action), but without specifying how the action policy is derived from the generative model and precision. It does not describe the action as fulfilling predictions by minimizing expected prediction error.

  Step 5: The term "minimizing surprise" is used as a synonym for choosing the most expected option (or the one with highest utility) without adding mechanistic detail beyond standard economic models.

  ---

  **Worked Case with Negative Verdict Despite Authors' Framing**

  **Case 3 (hypothetical):** A study on motor learning that frames skill acquisition as "updating generative models through prediction error minimization" but does not specify the hierarchy, precision, or how action is generated.

  **Step 1:** The paper claims motor learning is explained by PP. Proceed.

  **Step 2:** The paper says that the motor system uses a generative model to predict sensory feedback. However, it does not specify the hierarchical structure (e.g., whether there are multiple levels such as goal, trajectory, muscle commands). It just says "the generative model". We might give the benefit of the doubt and proceed, but note that a hierarchical structure is a core aspect of PP in motor control.

  **Step 3:** The paper does not mention precision or how prediction errors are weighted. It just says prediction errors drive learning. But without precision, the model is incomplete. 

  **Stop Point:** Step 3 fails. The paper does not account for precision weighting.

  **Verdict:** Negative (Decorative use). 

  **Conflict with Authors' Framing:** The authors explicitly frame their work in PP terms, but the lack of precision weighting (and the lack of hierarchy in Step 2) means they are not using the full PP machinery. They are using "prediction error" in a general sense, which is common in other learning theories (e.g., reinforcement learning), but without the distinct features of PP (precision, hierarchy) it is decorative.

  ---

  **What the Checklist Cannot Settle:**

  1. **The correctness of the PP/FEP model:** The checklist only evaluates whether the paper uses PP/FEP mechanistically, not whether the model is correct or the best explanation. That requires specialist evaluation and empirical validation.

  2. **The novelty of the application:** The checklist does not assess whether the application of PP/FEP to a new domain is innovative or appropriate.

  3. **The quality of the empirical support:** The checklist is about theoretical framing, not the strength of the evidence.

  4. **Alternative interpretations:** The checklist does not evaluate whether the data might be better explained by another theory.

  5. **Formal mathematical consistency:** If the paper presents equations, the checklist may flag the need for specialist evaluation but cannot itself verify the mathematics.

  By following this checklist, a journalist can systematically evaluate the depth of engagement with PP/FEP and avoid promoting work that merely uses the terms as buzzwords.
answer: |-
  ### Editorial Checklist: Evaluating Predictive Processing (PP) & Free Energy Principle (FEP) Substance  
  **Goal**: Distinguish mechanistic PP/FEP explanations from superficial labeling. Time: ≤15 mins.  
  **Core Principles**: Must engage with (1) hierarchical generative models, (2) precision-weighted prediction errors (PEs), and (3) active inference.  
  **Key Risks**: Stop at first unambiguous failure. Hand off to specialists for formal/mathematical claims (marked ⚠️). Value-laden judgments marked ⚖️.  

  ---

  #### **Step-by-Step Checklist**  
  1. **Claim Transparency**  
     - **Question**: Does the paper explicitly position PP/FEP as a *causal mechanism* (not just inspiration)?  
     - **Sufficient Answer**: Clear statement (e.g., "hallucinations arise from dysregulated precision in hierarchical inference").  
     - **Stop Point**: Vague framing (e.g., "consistent with FEP") → **Negative Verdict: Decorative**.  
     - **Judgment**: None.  

  2. **Generative Model Specification**  
     - **Question**: Is a hierarchical generative model defined, including:  
       - (a) Levels of abstraction (e.g., sensory → semantic),  
       - (b) Variables generating predictions (e.g., priors over states),  
       - (c) How predictions cascade downward?  
     - **Sufficient Answer**: Explicit description (e.g., "auditory cortex L4 encodes pitch priors, L2 encodes word predictions").  
     - **Stop Point**: No hierarchy/model structure → **Negative Verdict: Decorative**.  
     - **Judgment**: ⚖️ (Assess if implied hierarchy is plausible).  
     - **Handoff**: ⚠️ If formal math (e.g., Markov blankets) is central.  

  3. **Precision-Weighted Prediction Errors**  
     - **Question**: Does the paper specify:  
       - (a) How precision (inverse uncertainty) is quantified/modulated (e.g., neuromodulators, attention),  
       - (b) How precision weights PEs (e.g., high precision amplifies PE impact)?  
     - **Sufficient Answer**: Mechanistic link (e.g., "dopamine modulates precision in striatum, scaling PEs").  
     - **Stop Point**: "Precision" mentioned without quantification/modulation → **Negative Verdict: Decorative**.  
     - **Judgment**: None.  

  4. **Active Inference Integration**  
     - **Question**: Is action/perception framed as:  
       - (a) **Perception**: Belief updating via precision-weighted PEs,  
       - (b) **Action**: Policy selection minimizing *expected* free energy (EFE)?  
     - **Sufficient Answer**: Explicit EFE formulation (e.g., "choices minimize expected surprise via risk-sensitive policies").  
     - **Stop Point**: "Minimizing surprise" without action policies or belief updating → **Negative Verdict: Decorative**.  
     - **Judgment**: ⚖️ (Does "action" align with PP’s expected free energy?).  
     - **Handoff**: ⚠️ If EFE equations are used.  

  5. **Mechanistic Link to Data**  
     - **Question**: Are results explained via PP *mechanics* (not just labels)?  
     - **Sufficient Answer**: Shows how model hierarchy, precision, or PEs *generate* outcomes (e.g., "low precision in L2 explains hallucination rates via unchecked priors").  
     - **Stop Point**: PP terms merely redescribe known effects (e.g., "learning = prediction error minimization" without new mechanism) → **Negative Verdict: Decorative**.  
     - **Judgment**: ⚖️ (Critical: Is PP doing explanatory work?).  

  **Final Verdict Logic**:  
  - **Genuine PP/FEP**: Passes all steps with mechanistic specificity.  
  - **Decorative Use**: Fails any step (stop early).  
  - **Inconclusive**: Hand off to specialist if formal/mathematical claims exceed scope.  

  ---

  ### **Worked Examples**  
  #### Case 1: Clinical Study on Hallucinations & Auditory Precision  
  **Paper Claim**: "Hallucination severity correlates with degraded precision-weighting in auditory cortex (measured via fMRI GABA/glutamate ratio)."  
  - **Step 1**: Pass. Explicit PP mechanism: "precision deficits cause hallucinations."  
  - **Step 2**: Pass. Specifies hierarchy: "auditory cortex layers (L2/4) generate top-down predictions of speech."  
  - **Step 3**: Pass. Quantifies precision: "GABAergic inhibition modulates precision; low GABA → low precision." Links to PEs: "low precision amplifies irrelevant PEs, causing hallucinations."  
  - **Step 4**: Pass (perception focus). Belief updating: "imprecise PEs fail to correct priors."  
  - **Step 5**: Pass. Mechanistic: "GABA deficit → unweighted PEs → false perceptual inference."  
  - **Verdict**: **Genuine PP/FEP**.  

  #### Case 2: Behavioral Study on Consumer Choice (Negative Verdict)  
  **Paper Claim**: "Consumers minimize surprise by choosing familiar brands."  
  - **Step 1**: Pass. Claims choice "minimizes surprise" via FEP.  
  - **Step 2**: **FAIL**. No generative model hierarchy. "Surprise" is behavioral, not from predictions.  
  - **Stop Point**: Step 2 → **Negative Verdict: Decorative**.  
  - **Why Conflict with Authors?**: Framed as FEP, but "surprise" is a loose metaphor for preference. No hierarchy, precision, or PEs.  

  #### Case 3: Motor Learning Study (Negative Verdict Despite PP Framing)  
  **Paper Claim**: "Motor errors update generative models via prediction error minimization."  
  - **Step 1**: Pass. "PP explains skill acquisition."  
  - **Step 2**: Ambiguous. Mentions "generative model" but no hierarchy (e.g., kinematics → dynamics). Judgment ⚖️: Proceed cautiously.  
  - **Step 3**: **FAIL**. "Precision" absent. No weighting of PEs (e.g., via proprioceptive uncertainty).  
  - **Stop Point**: Step 3 → **Negative Verdict: Decorative**.  
  - **Conflict**: Authors use PP terminology, but "prediction error" is just motor error relabeled. No precision or active inference.  

  ---

  ### **Limitations of Checklist**  
  1. **Cannot Settle**:  
     - Empirical validity of PP claims (hand off to specialists).  
     - Whether PP is the *best* explanation (versus alternatives).  
     - Formal/mathematical coherence (e.g., if FEP equations are misapplied).  
  2. **Irreducible Judgment**: Steps 2 (hierarchy plausibility) and 5 (mechanistic novelty) are ⚖️. Document rationale.  
  3. **Edge Cases**: Hand off if PP is peripheral (e.g., one of multiple theories) or if mathematical rigor is required (⚠️).  

  **Usage Tip**: For speed, stop at first unambiguous failure (e.g., missing hierarchy/precision). When in doubt, flag for specialist review.
