answer: |-
  ### Essay Question  
  George Berkeley’s *The Querist* (1735–37) advances a theory of money that appears contradictory: he insists that coin and paper are ontologically "insubstantial" signs representing labor and goods, yet argues that state-issued paper currency (backed by land and labor, not metal) can *cause* economic prosperity more effectively than specie. Resolve this tension by:  
  1. Explaining how Berkeley separates money’s *ontological status* (as a sign) from its *causal efficacy* (as an economic stimulant).  
  2. Contrasting his position with a **commodity theory of money** (e.g., the view that currency’s value derives from labor/material worth intrinsic to its physical substrate).  
  3. Identifying where **collective belief and social convention** perform the sustaining role in Berkeley’s system that **intrinsic material worth** plays in commodity theory.  
  *Do not summarize Berkeley’s immaterialism about money. Avoid equating his view with modern fiat currency theory or treating social convention as subjective preference.*  

  ---

  ### Model Answer (598 words)  
  Berkeley resolves the tension between money’s insubstantiality and causal power through three interlocking moves. First, he rigidly separates the *sign* (money) from the *thing signified* (labor/goods). For Berkeley, a coin or note is ontologically empty: it possesses no intrinsic value, functioning purely as a "ticket" or "counter" denoting a claim on real wealth (e.g., Q. 23, 441). This distinguishes money from commodities, whose worth is tied to their material properties. Crucially, this sign-thing distinction isolates money’s *being* (a conventional token) from its *function* (mobilizing economic activity).  

  Second, Berkeley contends that money’s causal efficacy depends not on materiality but on **credit** sustained by collective trust. He argues that paper currency issued by a national bank, backed by a permanent fund of land and labor, stimulates industry because it operates as a "credit" (Q. 502–504). Here, *credit* is not a psychological add-on but the structural condition enabling the sign’s power: trust in the state’s authority and the stability of its backing transforms paper into a reliable medium of exchange. This trust is *causal*: Berkeley notes that metallic coinage fails to spur prosperity because its perceived intrinsic value (e.g., gold’s scarcity) encourages hoarding, while paper—lacking intrinsic worth—*must* circulate to retain value, thus incentivizing industry (Q. 6, 235). The sign’s efficacy thus arises from its embeddedness in a public system of credit, where collective belief in redeemability (via land/labor) replaces materiality as the source of stability.  

  Third, Berkeley anchors value not in money’s substrate but in **labor** as the true "wealth-substrate" (Q. 38). Commodity theories (e.g., Locke’s labor-embodied view) hold that currency’s value must derive from the work/material condensed in its *own* production (e.g., mining silver). Berkeley inverts this: labor and goods are the *objects* money signifies, not properties of the sign itself. Paper acquires value by indexing a social commitment to redeem it against a share of collective labor and resources—not by embodying labor in its manufacture. Consequently, social convention performs the role commodity theorists assign to intrinsic worth: it fixes the sign’s reference and ensures its acceptance. Whereas commodity theorists see material worth as a *precondition* for money’s function, Berkeley sees convention as the *sustaining mechanism* that grants an otherwise valueless token causal power.  

  This framework diverges sharply from modern fiat theory. Fiat currency (e.g., USD) derives value from state declaration and legal tender laws, detached from any backing. Berkeley’s system, however, retains an objective anchor: national land and labor. Collective belief does not *create* value subjectively but *mediates* access to real wealth. His theory is thus neither materialist (like commodity theories) nor purely declarative (like fiat): it is a **semiotic-credit system** where convention and trust translate signs into economic causality.  

  *(Word count: 598)*  

  ---  
  ### Marking Scheme (Total: 20 marks)  
  **A-Grade Response (17–20 marks)**  
  - **Recognizes all three conceptual moves**:  
    - (1) Strict sign/thing-signified distinction applied to currency’s ontology vs. function (4 marks)  
    - (2) Credit/collective trust as *causal conditions* (not psychological embellishments) enabling efficacy (4 marks)  
    - (3) Labor (not metal) as the value-substrate, allowing paper to function without intrinsic worth (4 marks)  
  - **Precisely contrasts Berkeley with commodity theory**: Explains how social convention replaces intrinsic material worth as the sustainer of value (3 marks)  
  - **Avoids major errors**: No conflation with fiat currency or subjective-value theory; no significant misconceptions (3 marks)  
  - **Structure/Clarity**: Logically resolves tension; terminology exact (2 marks)  

  **B-Grade Response (13–16 marks)**  
  - Addresses two of three core moves but omits/weakens one (e.g., notes credit’s role but misses labor as substrate)  
  - Contrast with commodity theory present but superficial (e.g., calls convention "subjective" without clarifying structural role)  
  - Minor errors: E.g., implies Berkeley’s money is identical to fiat currency (-3) or treats trust as mere opinion (-2)  
  - Clear but less nuanced analysis  

  **C-Grade Response (9–12 marks)**  
  - Summarizes Berkeley’s view without resolving tension  
  - Vague/missing contrast with commodity theory  
  - Significant misconceptions (e.g., Berkeley "denies real economic exchange" due to immaterialism, -2 marks)  
  - Weak structure  

  **D/F-Grade Response (0–8 marks)**  
  - Misrepresents Berkeley’s theory (e.g., collapses money into subjective belief)  
  - No engagement with commodity theory  
  - Major omissions or incoherence  

  #### Penalties:  
  - **-3 marks**: Equating Berkeley’s view with modern fiat currency (e.g., "like the USD, backed by nothing")  
  - **-2 marks**: Treating social convention as subjective preference (e.g., "value depends on individual opinions")  
  - **-2 marks**: Claiming Berkeley’s immaterialism entails denial of real economic exchange (identifiable misconception)  
  - **-2 marks**: Excessive summary of "money as signs" without addressing tension  

  ---  
  **Rationale**: Top answers must isolate Berkeley’s unique integration of semiotics, credit, and labor-value to show how an ontologically empty sign gains causal power. Penalties target common slippages into anachronism or subjectivism.
