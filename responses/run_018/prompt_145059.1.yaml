  Second names the "invented tradition" idea bluntly but warmly. 
  Third shifts to her teaching impact using specific examples (Hobsbawm’s books). 
  Fourth personalizes — how she changed minds. 
  Fifth ends on action (raising glasses), not sentiment. 

