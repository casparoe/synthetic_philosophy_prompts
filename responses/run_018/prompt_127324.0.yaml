  First, I should map the fault lines. The analytics will attack framing vs causality and demand operationalization. The naturalists will reject Foucault's entire paradigm. The sociologist will guard against presentism. The user's application to algorithms is brilliant but vulnerable to "this is just bias" reductions. 

