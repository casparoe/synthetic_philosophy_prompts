prompt: |-
  Give an example of a conceptual issue that arises when Buddhist ethics — specifically the Theravada emphasis on cetana (volitional intention) and the Mahayana doctrine of upaya (skillful means) — is pressed against consequentialist evaluation. Construct a precise, non-standard scenario, avoiding familiar tropes such as the burning-house parable or clinical euthanasia cases, in which an agent knowingly undertakes an action that foreseeably increases aggregate suffering in the short term, yet is regarded within the Buddhist framework as morally unproblematic because it issues from a mental state free of lobha, dosa, and moha. Then articulate the exact point of conceptual tension: does the consequentialist objection that the outcome profile makes the act wrong merely rest on a misunderstanding of kamma as intention rather than consequence, or does it expose a deeper incoherence in holding that an act can be genuinely skilful if its welfare effects are systematically negative? Map the conceptual geography with discipline, indicating where each framework falls silent, where they talk past one another, and where they genuinely contradict, and do so without invoking bibliographic authority or citation.
reasoning: |-
  Okay, the user wants an example where Buddhist ethics, specifically Theravada's cetana and Mahayana's upaya, conflict with consequentialist evaluation. They want a non-standard scenario avoiding common tropes like the burning house or euthanasia. The scenario should involve an action that increases short-term suffering but is morally acceptable in Buddhism due to the lack of lobha, dosa, moha. Then, I need to analyze the conceptual tension between the frameworks.

  First, I need to recall the key concepts. Theravada emphasizes cetana—volitional intention—as the core of kamma. Mahayana's upaya involves skillful means, where actions are justified by compassionate intent, even if they appear unorthodox. Consequentialism evaluates actions based on outcomes, particularly maximizing welfare or minimizing suffering.

  The challenge is creating a unique scenario. Common examples are overused, so I need something original. Maybe something involving public policy or environmental intervention? Let me think about infrastructure projects that displace people but are intended for long-term good. But that might resemble the burning-house parable. 

  How about a scenario involving the suppression of misinformation? Suppose a government official, a Buddhist practitioner, shuts down a panic-inducing news outlet during a crisis. This causes immediate distress but is meant to prevent chaos. The intention is compassionate, free from greed, hatred, delusion. But the action increases short-term suffering—people lose a source of information, feel oppressed. Consequentialism would criticize this because it increases suffering without guaranteed long-term benefits. 

  But why is this Buddhistically acceptable? Because the official acts with pure intention, using skillful means (upaya) to prevent greater harm. The action stems from karuna (compassion) and panna (wisdom), not lobha, dosa, moha. Theravada would focus on cetana being pure. Mahayana would see it as upaya, even if it causes immediate harm.

  Now, the conceptual tension: Consequentialists argue that outcomes define morality. If suffering increases, the act is wrong. But Buddhism prioritizes intention. The conflict arises because consequentialism sees kamma as tied to outcomes, while Buddhism sees it as intention. However, the deeper issue is whether an action can be skillful (kusala) if it consistently leads to bad outcomes. If an action repeatedly causes harm, can the intention still be pure? This questions the coherence of Buddhist ethics when actions systematically produce negative welfare effects.

  Where do the frameworks contradict? Consequentialism demands good outcomes; Buddhism values intention. They talk past each other because consequentialism focuses on results, Buddhism on mental states. Buddhism might remain silent on empirical outcomes, trusting that skillful intentions lead to long-term good. Consequentialism ignores the agent's mental state. The deeper incoherence is if an action always leads to suffering, can it ever be considered skillful? Buddhism might respond that outcomes are uncertain and influenced by many factors, so intention is the only controllable aspect. But if negative outcomes are foreseeable and consistent, the Buddhist position might struggle to justify such actions without appearing detached from actual harm.
answer: |-
  Here is a precise scenario and analysis addressing the conceptual tension:

  **Scenario: The Silence of the Master (Vipassana Retreat Context)**
  A revered Vipassana meditation master (Theravada-aligned) conducts an intensive 30-day silent retreat. A student, after 20 days of profound practice, experiences intense, destabilizing psychological distress ("Dark Night" phenomena) – panic attacks, terrifying visions, and suicidal ideation – directly linked to deep purification of mental sankharas (formations). The student pleads for guidance. The master, possessing deep experiential knowledge of this terrain, *knows* that:
  1.  Offering verbal reassurance, modifying instructions, or allowing the student to break silence would likely provide immediate relief and reduce acute suffering.
  2.  However, this intervention would disrupt the critical purification process. The student would likely solidify aversion to the experience, become dependent on external guidance, and fail to develop the crucial insight into impermanence and non-self needed to transcend *dukkha* permanently.
  3.  Allowing the process to continue (maintaining strict silence and standard instruction) will prolong intense suffering for several more days but offers the highest probability of profound, lasting liberation.

  The master chooses strict silence. The student's acute suffering increases significantly over the next 48 hours before a breakthrough occurs. Aggregate suffering (intensity x duration) during the retreat demonstrably increases compared to the intervention path.

  **Buddhist Ethical Justification:**
  *   **Cetana (Theravada):** The master's volition is rooted in *karuna* (compassion) and *panna* (wisdom), aiming solely for the student's ultimate liberation (*nibbana*). There is an absence of *lobha* (desire for the student's affection or reputation), *dosa* (aversion to the student's distress or wish to punish), and *moha* (delusion about the process or outcomes). The act itself (non-intervention/silence) is kammically neutral; the *cetana* driving the decision is wholesome (*kusala*).
  *   **Upaya (Mahayana):** Maintaining silence is the skillful means (*upaya*) perfectly calibrated to this student's specific needs and stage of development. The master's profound wisdom perceives the long-term liberative potential inaccessible to conventional assessment. The apparent "harshness" is the expression of ultimate compassion (*karuna*), prioritizing the destruction of ignorance over temporary comfort. The master embodies the Bodhisattva ideal, willing to bear the kammic perception of harshness for the student's ultimate good.

  **Consequentialist Objection:**
  The action (non-intervention) foreseeably and knowingly increased aggregate suffering in the accessible short-term timeframe relevant to evaluation. The suffering was severe and unnecessary for achieving the long-term goal (alternative paths existed, albeit with different long-term outcomes). Therefore, the act was morally wrong. Relying on uncertain, long-term, metaphysical outcomes (liberation) is speculative and discounts the concrete, verified suffering inflicted.

  **Conceptual Tension Mapped:**

  1.  **Core Definitions of "Right Action":**
      *   **Buddhism:** Right action is defined primarily by the quality of the intention (*cetana*) – its freedom from the "three roots of unwholesomeness" (*lobha, dosa, moha*) and alignment with wisdom/compassion. The *kusala* nature of the intention *defines* the act as "skillful" (*upaya-kusalata*).
      *   **Consequentialism:** Right action is defined by the actual (or reasonably expected) consequences – specifically, maximizing welfare/minimizing suffering. The mental state is secondary (e.g., praiseworthy intentions don't negate a harmful outcome's wrongness).
      *   **Contradiction:** They offer fundamentally different criteria for moral evaluation. An act can be simultaneously *kusala* (Buddhist) and wrong (Consequentialist) based on the same empirical facts.

  2.  **Kamma vs. Consequence:**
      *   **Talking Past:** The consequentialist objection *does* often rest on a misunderstanding of kamma as *equivalent* to consequence. Buddhism explicitly states kamma is volitional action (*cetanāhaṃ bhikkhave kammaṃ vadāmi*). The consequence (*vipāka*) is the *result* of kamma, not kamma itself.
      *   **Deeper Tension:** However, Buddhism *does* hold a strong correlation: wholesome intentions (*kusala cetana*) tend to lead to pleasant results, unwholesome (*akusala*) to unpleasant results, albeit complexly and over time. The tension arises when an action stemming from demonstrably *kusala cetana* foreseeably leads to *increased suffering in the proximate context*. Does this break the correlation thesis? Buddhism might argue:
          *   The timeframe is too short; the ultimate kammic result (student's liberation) is profoundly positive.
          *   The increased suffering is actually the *ripening* of the *student's past kamma*, not the *master's new kamma*. The master's kamma is the compassionate intention, which will bear positive fruit.
      *   **Consequentialist Counter:** This relies on empirically unverifiable metaphysical claims (kammic results across lifetimes, liberation). The measurable outcome is increased suffering caused by the master's choice. If *kusala* intentions can systematically lead to foreseeable, significant proximate suffering without guaranteed long-term offsets, the practical moral guidance of Buddhism becomes incoherent or dangerously detached from actual welfare consequences.

  3.  **Skillfulness (*Upaya*) and Systematic Negative Welfare Effects:**
      *   **Point of Genuine Contradiction:** This is the core clash. Consequentialism asserts that if an action (or type of action) *systematically* and *foreseeably* leads to increased suffering, it cannot be morally justified, regardless of intention. Calling it "skillful means" becomes an empty label or a dangerous rationalization.
      *   **Buddhist Response & Silence:** Buddhism prioritizes the liberation from *samsara* (the cycle of suffering) as the ultimate welfare. An action is genuinely skillful (*upaya*) if it effectively conduces to that ultimate end, *even if it increases proximate dukkha*. It views proximate suffering through the lens of its potential for insight and purification. Buddhism *falls silent* on providing a purely empirical, non-teleological (liberation-focused) justification for actions that increase proximate suffering. Its framework inherently assumes the soteriological goal is paramount and justifies means in relation to it. Consequentialism (especially hedonistic utilitarianism) *falls silent* on, or outright rejects, this soteriological hierarchy of goods, prioritizing the reduction of experiential suffering/advancement of well-being *within* the conventional world.

  4.  **Scope of Moral Evaluation:**
      *   **Buddhism:** Emphasizes the agent's mental state and the *intrinsic nature* of the act based on that state. The primary locus of morality is the mind.
      *   **Consequentialism:** Emphasizes the state of the world resulting from the act. The primary locus of morality is the outcome.
      *   **Talking Past:** They are evaluating fundamentally different things. The Buddhist asks, "Was the mind pure?" The Consequentialist asks, "Did the world improve?"

  **Conclusion:** The consequentialist objection highlights a fundamental **incommensurability**, not merely a misunderstanding of kamma as consequence. The deeper incoherence exposed is whether an act can coherently be labeled "skillful" (*kusala* via *cetana* or *upaya*) if its **foreseeable proximate effects systematically contradict the stated ultimate goal of ending suffering**. Buddhism resolves this by prioritizing the ultimate soteriological goal and viewing proximate suffering through that transformative lens, accepting the correlation between *kusala* intention and long-term good as axiomatic, even when empirically obscured in the short term. Consequentialism rejects this prioritization and the axiomatic correlation when faced with negative empirical outcomes, demanding that "skillfulness" be demonstrable through observable welfare effects. The frameworks genuinely contradict on the **hierarchy of goods** (liberation vs. proximate suffering reduction) and the **primary locus of moral evaluation** (intention vs. outcome).
