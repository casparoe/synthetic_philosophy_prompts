answer: |-
  Good morning. It’s a privilege to welcome you all—our deeply experienced forecasters and analysts, our philosophers of science, and our invaluable supporters, board members, and families—to this gathering on "Forecasting and Humility." Today isn’t about decorating an abstract theme. We’re here to wrestle with something fundamental, something that lives in the gap between two ways of seeing the world, a gap that shapes not just predictions, but how we reason under uncertainty.

  That gap has a name we’ll return to: **the single-case reference problem**. Simply put: Each of us, when facing a unique situation—a prediction, a decision, a judgment—operates from two irreconcilable perspectives.  

  1.  **The Inside View:** This is your seat at the table. It’s your unique access to the *specifics* of *this* problem—your intricate model, your carefully weighed doubts, your subtle adjustments for context, the little things only you see. It feels grounded, detailed, *real*.  
  2.  **The Outside View:** This steps back. It asks: "What category does this situation fall into? What’s the track record of people like me, facing problems like this?" It draws on base rates, statistical averages, the sobering history of how often *similar* judgments went astray, often due to overconfidence or unseen bias.  

  Here’s the core tension, the single-case reference problem: **These two accounts cannot be cleanly merged into one authoritative story without doing violence to one perspective.** To dismiss the inside view is to ignore vital, unique detail. To ignore the outside view is to ignore the persistent, statistical whispers of human fallibility. Trying to force them into a single narrative often means silencing one voice or misapplying the other.  

  **So why are we gathered?** Not to solve this tension—it’s inherent to the human condition of reasoning under ambiguity. We’re here to explore how to *inhabit* that tension with more wisdom and humility. How do we let the outside view *inform* our inside view without crushing it? How do we let our specific insights *enrich* our understanding of the reference class without denying its sobering lessons? How do we reason well when these two powerful perspectives pull in different directions?  

  Let me illustrate this with a scenario, stripped of jargon or citations, built from the ground up:

  *Imagine you are part of a small emergency response team arriving at a chaotic scene with two critically injured people. You have limited resources and time to save only one immediately. One victim has severe, complex internal injuries your team has rarely encountered. The other has severe but more familiar trauma.*  

  *   **The Inside View:** Your lead medic, highly experienced, focuses intently on the unique complexity of the first patient. She sees subtle signs others miss, believes her specific expertise gives her a chance to pull off a difficult save where others might fail. Her detailed assessment feels compelling. She *knows* this case.  
  *   **The Outside View:** The statistics are stark. When medics face extremely rare, complex cases under time pressure like this, even highly skilled ones, the success rate is tragically low. For the more familiar trauma, the success rate is significantly higher. The base rates scream caution.  

  **The tension is immediate and visceral.**  
  *   For our experts: You see the trap. The medic’s inside view feels uniquely compelling *to her*, but the outside view places her firmly in a reference class ("medics attempting rare, complex saves under duress") with a discouraging base rate. Her feeling of unique insight *is itself a common feature* of that class. Trusting *only* the inside view risks a tragic statistical likelihood.  
  *   For everyone: You feel the human pressure. The medic’s conviction is real. Dismissing her specific insight feels cold, almost cruel, in the face of a life that *might* be saved. Ignoring the statistics feels like reckless gambling with another life. There is no single, clean narrative here that honors both realities.  

  This is the single-case reference problem in its rawest form. It’s not just about medicine or forecasting; it’s about any judgment under uncertainty where our unique perspective clashes with the statistical echoes of history.  

  **Today’s purpose is not to resolve this.** It’s to gather around this tension—to share tools, frameworks, and hard-won experiences from philosophy, decision analysis, and forecasting practice. It’s to explore how humility—epistemic modesty—isn't about doubting everything, but about honestly acknowledging the limits and powers of *both* views. How can we let the outside view *correct* our inside view without extinguishing its vital spark? How can our inside view *refine* our understanding of which reference classes even apply?  

  We won’t find a magic formula. But by grappling with this live tension together—experts sharing their struggles, newcomers feeling its weight—we aim to become slightly wiser, slightly more humble reasoners in an ambiguous world.  

  Welcome. Let the conversation begin.**
