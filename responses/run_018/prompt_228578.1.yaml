prompt: |-
  At a meeting of my workplace union last week, we were debating whether to refuse to cross the picket line of the cafeteria workers, who are employed by a contractor and are on strike over wages. Honoring their line would put us in breach of the no-strike clause in our own contract, and several members were reluctant. At that point our shop steward invoked the old labor slogan 'an injury to one is an injury to all,' said it settled the question, and the room went quiet in a way I found unsatisfying. The slogan obviously did something rhetorically, but when I pressed him afterward on what exactly it claims, he got impatient, as if asking for precision were itself a betrayal of solidarity.

  I suspect the slogan compresses several quite different theses, and I want them separated before the next meeting. It might be a causal-empirical claim: tolerating an injury to one worker measurably weakens the bargaining position of every worker, so the injury literally propagates. It might be a normative claim: members owe one another a duty of solidarity such that an injury to one *should be treated as* an injury to all. It might be a prudential reciprocity claim: I protect you now so that you protect me later, essentially an insurance arrangement. It might be a constitutive claim about what union membership is: to join is precisely to adopt the standpoint that fellow members' injuries count as one's own, so that refusing to act is not breaking a rule but defecting from the identity. Or it might be a purely mobilizing utterance with no propositional content at all, closer to a cheer than a thesis. There may be readings I am missing.

  Please lay out the distinct claims the slogan could be making, as a numbered list. For each, say whether it is trivial, substantive and defensible, or false on its face, and -- this is the part I most need -- whether that reading, if true, would actually support the steward's conclusion that we are obliged to honor the cafeteria workers' picket line even at the cost of breaching our own contract. Note also which reading the steward most likely meant, given how he used it, and which reading a skeptic in the room would find hardest to dismiss. Keep the whole answer under 600 words.
reasoning: |-
  Okay, the user is part of a workplace union debating whether to honor a picket line for cafeteria workers employed by a contractor. Their shop steward used the slogan "an injury to one is an injury to all" to justify supporting the strike, which would breach their own contract's no-strike clause. The user felt this shutdown discussion and wants to unpack the slogan's meanings before the next meeting.

  I need to analyze this slogan systematically. The user has already identified several possible interpretations: causal-empirical, normative, prudential, constitutive, and performative. These are good starting points. 

  For each interpretation, I'll assess whether it's trivial, defensible, or false, and crucially whether it actually supports honoring the picket line despite the contract breach. The user particularly needs this last part for their upcoming debate.

  Looking at the steward's behavior - cutting off discussion and treating questions as betrayal - suggests they're likely using the constitutive or normative interpretation. But the most compelling argument for skeptics might be the prudential one, since it appeals to self-interest. The user seems frustrated with ideological rigidity and wants concrete reasoning to persuade reluctant colleagues.

  The cafeteria workers being contractors adds complexity - are they considered "one of us" in solidarity? That's probably the core tension. I should address how each interpretation handles this outsider status. 

  Word count is tight (under 600), so I'll be concise. Numbered list format works well for clarity. For each point: state the claim type, evaluate it, then check if it justifies the action. Finally, I'll identify the steward's probable meaning and the skeptic's weakest point.

  Noticing the user values precision - they're philosophically inclined given how they parsed the slogan. Their hidden need might be for ammunition to reopen discussion without seeming anti-union. They want to validate solidarity while examining its limits.
answer: |-
  Here's a breakdown of the slogan's potential meanings and their implications for your situation:

  1.  **Causal-Empirical Claim:** Tolerating an injury to one worker measurably weakens the collective bargaining power of *all* workers by emboldening employers and setting precedents.
      *   **Assessment:** Substantive and defensible, though context-dependent (e.g., strength of labor movement).
      *   **Supports Action?** **Yes, conditionally.** If true, breaching the contract *could* be a necessary defensive action against long-term weakening, but the specific risk to *your* unit needs evaluation. The cafeteria workers being contractors complicates direct causation.
  2.  **Normative Claim:** Workers owe each other a fundamental moral duty of solidarity. Ignoring an injury to others violates this duty, regardless of immediate consequences.
      *   **Assessment:** Substantive and defensible within a solidarity ethic; foundational to many union philosophies.
      *   **Supports Action?** **Yes, strongly.** The duty implies prioritizing solidarity over contractual compliance when they conflict. The cafeteria workers' status as fellow workers triggers the duty.
  3.  **Prudential Reciprocity Claim:** Supporting others now ("I protect you") ensures they will support you later ("you protect me"), functioning like mutual insurance.
      *   **Assessment:** Substantive and defensible as a practical strategy for collective strength.
      *   **Supports Action?** **Uncertain/Weak.** Reciprocity relies on the expectation of future mutual aid. Cafeteria workers (contractors) may lack the capacity or contractual ability to reciprocate meaningfully, weakening the prudential argument for *your* unit.
  4.  **Constitutive Claim:** Union membership *is defined by* adopting the identity where fellow workers' injuries *are experienced as one's own*. Refusal to act isn't just wrong; it's a rejection of the core identity.
      *   **Assessment:** Substantive and defensible as a core tenet of radical labor solidarity; defines a specific type of unionism.
      *   **Supports Action?** **Yes, absolutely.** Honoring the line becomes an inherent expression of identity. Not doing so is existential defection. "Fellow workers" likely includes the cafeteria workers.
  5.  **Performative/Mobilizing Claim:** The slogan is primarily a rallying cry to inspire unity and action, not a precise proposition to be dissected. Its power is emotional and motivational.
      *   **Assessment:** Trivially true as a description of its *use*, but lacks propositional content for debate.
      *   **Supports Action?** **No, inherently.** It motivates but doesn't logically justify the *specific* action of breaching *your* contract. Its effectiveness is rhetorical, not logical.

  **Analysis:**

  *   **Steward's Likely Meaning:** The steward's reaction (impatience, seeing questions as betrayal) strongly suggests the **Constitutive Claim (4)** or the **Normative Claim (2)**. He invoked it as a fundamental, non-negotiable principle closing debate, characteristic of an identity-based or deep ethical commitment.
  *   **Hardest for Skeptic to Dismiss:** The **Prudential Reciprocity Claim (3)** is often the strongest argument for reluctant members focused on self-interest. However, its weakness here (lack of clear reciprocity from contractors) makes the **Causal-Empirical Claim (1)** potentially more compelling for a skeptic. If convincingly argued that crossing *this* line demonstrably weakens labor power broadly (including your own unit long-term), it provides a pragmatic reason beyond pure principle. The **Normative Claim (2)** is philosophically robust but may not sway someone who doesn't share that ethic. The steward's use likely relied on the power of **4 or 2**, combined with the mobilizing effect (**5**).
