  ### Branching Taxonomy: Anthropocene Formalization  
  **Audience:** Graduate seminar (15 students)  
  **Structure:** Six branch nodes posing concrete claims, leading to eight distinct leaves. Branch nodes address stratigraphic criteria, authority, and niche considerations (diachronic legitimacy, predictive power).  

  ---

  #### **Node 1:** Does the Anthropocene require a globally synchronous stratigraphic marker (e.g., radioactive isotopes) to define its start?  
  - **Yes** → Node 2  
  - **No** → Node 3  

  #### **Node 2:** Must this marker be abrupt (≤ century-scale) to ground a discrete epoch boundary?  
  - **Yes** → Leaf B (*Great Acceleration*)  
  - **No** → Leaf C (*Orbis*)  

  #### **Node 3:** Can the Anthropocene’s start be defined without a synchronous marker (e.g., via diffuse transitions)?  
  - **Yes** → Node 4  
  - **No** → Leaf A (*Anti-formalist*)  

  #### **Node 4:** Does epoch designation depend *not only* on descriptive coherence but also predictive power about future stratigraphy?  
  - **Yes** → Leaf D (*Deep-time*)  
  - **No** → Node 5  

  #### **Node 5:** Must authority to formalize the epoch rest solely with contemporary stratigraphers (e.g., ICS)?  
  - **Yes** → Leaf E (*Unoccupied: Technocratic Retrospective*)  
  - **No** → Node 6  

  #### **Node 6:** Can diachronic authority (e.g., future observers classifying retrospectively) legitimately define the epoch?  
  - **Yes** → Leaf F (*Democratic-geoscience*)  
  - **No** → Leaf G (*Unoccupied: Presentist Consensus*)  

  ---

  ### Leaves  
  1. **Leaf A: Anti-formalist view**  
     - *Awkward commitment:* Denying geology’s capacity to adjudicate a concept already entrenched in socio-political discourse.  
  2. **Leaf B: Great Acceleration (mid-20th century)**  
     - *Awkward commitment:* Treating artificial radionuclides as a "natural" stratigraphic signal despite their anthropogenic origin.  
  3. **Leaf C: Orbis (early-modern, ~1610 CE)**  
     - *Awkward commitment:* Elevating a relatively minor atmospheric CO₂ dip into a planetary boundary marker.  
  4. **Leaf D: Deep-time (early agriculture)**  
     - *Awkward commitment:* Stretching epoch boundaries to multi-millennial scales, rendering them functionally meaningless for contemporary policy.  
  5. **Leaf E: Unoccupied: Technocratic Retrospective**  
     - *Awkward commitment:* Demanding predictive certainty about future strata while rejecting present stratigraphic evidence as insufficient.  
     - *Diagnosis:* Unoccupied due to incoherence—stratigraphy relies on extant data, yet predictive power requires uncontested future projections.  
  6. **Leaf F: Democratic-geoscience**  
     - *Awkward commitment:* Subordinating technical stratigraphic rigor to interdisciplinary or community-based deliberation.  
  7. **Leaf G: Unoccupied: Presentist Consensus**  
     - *Awkward commitment:* Insisting only scientists contemporaneous with the transition can decide, excluding retrospective insights.  
     - *Diagnosis:* Unoccupied due to unattractiveness—discounts geology’s long-term observational nature.  

  ---

  ### Collapsed Distinctions & Design Notes  
  - **Leaf B (Great Acceleration) and Leaf C (Orbis)** collapse if synchronicity is reinterpreted: Both require a marker, but differ only on timescale (abrupt vs. gradual). They separate cleanly at Node 2.  
  - **Niche angles integrated:**  
    - *Diachronic authority* (Node 6) challenges the ICS’s presentist monopoly.  
    - *Predictive power* (Node 4) tests whether future strata projections are necessary for epoch status.  
  - **Unoccupied combinations:**  
    - *Technocratic Retrospective* (Leaf E) demands predictive certainty without present evidence.  
    - *Presentist Consensus* (Leaf G) rejects retrospective classification, which is geologically atypical.  
  - **Formal tone:** Avoids citations; focuses on logical structure for seminar debate.  

  ---  
  **Total:** 6 nodes, 7 leaves + 1 implicitly doubled (anti-formalist spans Nodes 3/5). Compact for handout use.
