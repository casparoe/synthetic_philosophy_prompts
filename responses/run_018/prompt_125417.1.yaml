  Below is a decision-tree handout designed to help students categorize theories of causation by their responses to concrete problem cases, without relying on pre-existing labels. The tree branches on four key commitments, using diagnostic questions phrased for accessibility. The leaves include major theories (Lewisian counterfactual, Woodward's interventionist, Pearl's structural model) and a hybrid view, with unoccupied combinations flagged as incoherent or unexplored. Cases referenced: symmetric overdetermination (identical redundant causes), preemption (physically impossible backup), and feedback loops (non-acyclic structural equations).

  ---

  ### **Causation Theory Decision Tree**  
  *Start at Question 1 and follow branches based on your answers to concrete cases.*

  **Question 1: For causation to exist, must we require that causes can *actually be manipulated* (e.g., through interventions), or is causation about *non-manipulable dependencies* across possible worlds (e.g., "what if" scenarios, even if unrealizable)?**  
  - **If "Must be manipulable (intervention-based)"** → Go to Question 2A.  
  - **If "Non-manipulable dependencies (cross-world)"** → Go to Question 2B.  

  ---

  #### **Branch A: Intervention-Based (Manipulable)**  
  **Question 2A: Must structural causal models forbid feedback loops (i.e., be acyclic) to represent real causation?**  
  - **If "Yes, feedback loops invalidate causation"** → Go to Question 3A.  
  - **If "No, feedback loops can be valid"** → Go to Question 3B.  

  **Question 3A: In symmetric overdetermination (e.g., two identical lightning strikes causing a fire), does redundancy in the model imply that neither strike is a real cause?**  
  - **If "Yes, redundancy negates causation"** → Go to Question 4A.  
  - **If "No, redundant causes can be real"** → Go to Question 4B.  

  **Question 4A: Must a cause be *actually alterable* (e.g., testable via physical intervention) to count as causal?**  
  - **If "Yes, actual intervenability required"**: Unexplored.  
    *Diagnosis: No major theory combines manipulability, acyclicity, redundancy-negation, and strict intervenability—likely incoherent as interventionism typically allows redundant causes.*  
  - **If "No, unalterable causes can still be causal"**: Unexplored.  
    *Diagnosis: Unattested in literature; interventionism usually requires intervenability in principle, not redundancy-negation.*  

  **Question 4B: Must a cause be *actually alterable* to count as causal?**  
  - **If "Yes, actual intervenability required"**: **Woodward's interventionist account**  
    *Fits preemption (backup is impossible but testable via interventionist counterfactuals) and symmetric cases (both causes count). Requires acyclicity for feedback loops.*  
  - **If "No, unalterable causes can still be causal"**: **Pearl's structural-model approach**  
    *Handles symmetric overdetermination (both causes matter) and preemption (backup irrelevant). Uses acyclic models; causation defined by do-operator, not physical intervenability.*  

  **Question 3B: In symmetric overdetermination, does redundancy imply non-causation?**  
  - **If "Yes"** → Go to Question 4C.  
  - **If "No"** → Go to Question 4D.  

  **Question 4C: Must a cause be *actually alterable*?**  
  - **If "Yes"**: Unexplored.  
    *Diagnosis: No known theory allows feedback loops but requires both redundancy-negation and strict intervenability—interventionism struggles with cycles.*  
  - **If "No"**: Unexplored.  
    *Diagnosis: Unattested; allowing cycles while negating redundant causes conflicts with how feedback is modeled.*  

  **Question 4D: Must a cause be *actually alterable*?**  
  - **If "Yes"**: Unexplored.  
    *Diagnosis: Cyclic interventionism with intervenability is unexplored; feedback loops complicate intervention definitions.*  
  - **If "No"**: **Hybrid view (Non-acyclic structural equations without modal realism)**  
    *Accepts structural equations (like Pearl) and feedback loops but rejects modal realism. Symmetric cases: both causes count; preemption: backup ignored. Does not require physical intervenability.*  

  ---

  #### **Branch B: Cross-World Dependencies (Non-Manipulable)**  
  **Question 2B: Must structural models forbid feedback loops?**  
  - **If "Yes, feedback loops invalidate causation"** → Go to Question 3C.  
  - **If "No, feedback loops can be valid"** → Go to Question 3D.  

  **Question 3C: In symmetric overdetermination, does redundancy imply non-causation?**  
  - **If "Yes"** → Go to Question 4E.  
  - **If "No"** → Go to Question 4F.  

  **Question 4E: Must a cause be *actually alterable*?**  
  - **If "Yes"**: Incoherent.  
    *Diagnosis: Modal theories reject intervenability; requiring it contradicts cross-world dependence.*  
  - **If "No"**: Unexplored.  
    *Diagnosis: No theory combines modal dependence, acyclicity, redundancy-negation, and no intervenability—Lewisian accounts accept redundant causes.*  

  **Question 4F: Must a cause be *actually alterable*?**  
  - **If "Yes"**: Incoherent.  
    *Diagnosis: Modal realism cannot demand actual intervenability; it relies on possible worlds, not physical manipulation.*  
  - **If "No"**: **Lewisian counterfactual account**  
    *Uses possible-worlds counterfactuals. Symmetric cases: both causes count via "quasi-dependence"; preemption: backup irrelevant. Requires acyclicity; feedback loops are problematic.*  

  **Question 3D: In symmetric overdetermination, does redundancy imply non-causation?**  
  - **If "Yes"** → Go to Question 4G.  
  - **If "No"** → Go to Question 4H.  

  **Question 4G: Must a cause be *actually alterable*?**  
  - **If "Yes"**: Incoherent.  
    *Diagnosis: Modal theories cannot require intervenability; combining this with cycles/redundancy-negation has no grounding.*  
  - **If "No"**: Unexplored.  
    *Diagnosis: Allowing feedback loops in modal theories while negating redundant causes is unattested and likely inconsistent.*  

  **Question 4H: Must a cause be *actually alterable*?**  
  - **If "Yes"**: Incoherent.  
    *Diagnosis: Modal dependence and intervenability are incompatible commitments.*  
  - **If "No"**: Unexplored.  
    *Diagnosis: Modal theories for cyclic causation (e.g., non-acyclic counterfactuals) are underdeveloped and face circularity challenges.*  

  ---

  ### **Key to Leaves**  
  - **Lewisian counterfactual account**: Cross-world dependence, requires acyclicity, accepts redundant causes, no intervenability.  
  - **Woodward's interventionist account**: Intervention-based, requires acyclicity, accepts redundant causes, requires intervenability.  
  - **Pearl's structural-model approach**: Intervention-based, requires acyclicity, accepts redundant causes, no intervenability.  
  - **Hybrid view**: Intervention-based, allows feedback loops, accepts redundant causes, no intervenability.  
  - **Incoherent**: Answers conflict (e.g., modal + intervenability).  
  - **Unexplored**: No known theory matches; may be a gap in current research.  

  This tree prioritizes problem cases over labels, helping students derive theories from first principles. For unresolved cases, discuss whether diagnoses hold under scrutiny.
