  ### 1. The Proposed Principle: **Restricted Self-Sampling (RSS)**

  **Statement**:  
  *Credences should be updated using the Self-Sampling Assumption (SSA) only when dealing with self-location uncertainty within a single, fixed uncentered world. For hypotheses about which uncentered world is actual, no adjustment is made for the number of observers; priors are updated solely on non-indexical evidence. Specifically:  
  - **Within a world**: Treat yourself as a random sample from all subjectively indistinguishable observer-moments in that world.  
  - **Across worlds**: Assign priors to uncentered worlds without weighting by observer count; update only on evidence that is not indexical (e.g., sensory data, not observer frequency).*  

  **Clauses at Work in Each Case**:  
  - **Case 1 (Sleeping Beauty, standard)**: RSS applies SSA within the fixed experimental world. Two tails awakenings vs. one heads awakening → P(heads) = 1/3.  
  - **Case 2 (Sleeping Beauty, Monday)**: RSS applies SSA within the world, conditioning on Monday. Only two Monday awakenings exist (one heads, one tails), but their probabilities differ: P(heads and Monday) = 1/2, P(tails and Monday) = 1/4 → P(heads | Monday) = (1/2)/(3/4) = 2/3.  
  - **Case 3 (Dr. Evil)**: RSS applies SSA within the fixed world (one world, two observers). No across-world counting → P(original) = 1/2.  
  - **Case 4 (Cosmology, two worlds)**: RSS forbids SSA across worlds. Observer count doesn’t sway priors → no shift toward the larger universe.  
  - **Case 5 (Within-world concentration)**: RSS applies SSA within a world. Observer concentration in a region is legitimate evidence for self-location.  
  - **Case 6 (Boltzmann brain)**: RSS forbids SSA across worlds. Prior for the Boltzmann world isn’t boosted by observer count, and within that world, SSA might suggest being a Boltzmann brain, but the principle doesn’t force it (see costs below).

  ---

  ### 2. Costs and Abandoned Verdict

  - **Abandoned Verdict**: RSS **fails to fully secure your verdict in Case 6** (Boltzmann brain).  
    - **Why?** RSS (correctly) doesn’t boost the prior of the Boltzmann world due to observer count. However, *if we conditionalize on being in that world*, RSS applies SSA within it, making you likely to be a Boltzmann brain (since they vastly outnumber ordinary observers). This clashes with your refusal to assign "any serious credence" to being one.  
    - **Should you fight for or concede this verdict?** Fight for it. Your intuition is defensible: Boltzmann brains have unstable, incoherent experiences, making your rich sensory evidence astronomically unlikely under that hypothesis. RSS can incorporate this by updating on evidence (e.g., coherence of memories) to crush the Boltzmann likelihood, but this requires auxiliary assumptions about evidence. Without them, RSS doesn’t guarantee the verdict as a "theorem."  

  - **Cheapest Fix**: Add a **restriction clause** to RSS:  
    *"When applying SSA within a world, exclude observer-moments that are incompatible with the totality of your evidence (e.g., incoherent experiences)."*  
    - **Principled or Stipulative?** This is **principled** if "evidence" includes the stability and coherence of your experiences (standard in epistemology). Boltzmann brains produce chaotic evidence, so they’re excluded from your reference class. However, it risks being **stipulative** if "evidence" is tailored to avoid unwanted conclusions.  

  ---

  ### 3. Verdict on a New Case: Biased Coin (9:1 Tails)

  **Case**: Sleeping Beauty setup, but the coin is biased 9:1 toward tails (P(tails) = 0.9, P(heads) = 0.1). On awakening, what is your credence in heads?  
  **RSS Verdict**:  
  - RSS applies SSA within the world. Awakenings: 1 if heads, 2 if tails.  
  - P(heads | awakening) = P(heads) / [P(heads) + P(tails) × 2] = (0.1) / [0.1 + (0.9 × 2)] = 0.1 / 1.9 ≈ 0.0526 (or 1/19).  

  **Does This Expose Discomfort?**  
  - **Yes**. RSS gives a non-intuitive, very low credence (∼5.3%) for heads, driven by the 9:1 bias and two tails awakenings. This might feel too extreme—why should a coin bias change the *ratio* of awakenings' evidential weight? Yet it’s consistent with your verdicts: in Case 1, you endorsed this weighting (1/3 credence) for a fair coin. If you balk here, it suggests your pattern has tension: within-world counting feels intuitive in symmetric cases but strained under skew.  

  ---

  ### 4. Diagnosis of the Tension: Awakenings vs. Observers

  **Real Conceptual Distinction or Inconsistent Intuitions?**  
  Your pattern tracks a **real distinction** between two types of uncertainty:  
  - **Self-location within a world (awakenings)**: Cases 1, 2, and 5 involve uncertainty about *where/when* you are in a fixed world. Here, indexical counting (SSA) is natural—it resolves a "centered" question.  
  - **World selection (observers)**: Cases 3, 4, and 6 involve uncertainty about *which world exists*. Here, counting observers feels like double-counting evidence and swamping priors.  

  This distinction is grounded in formal epistemology:  
  - **Centered vs. uncentered worlds**: Awakenings are "centers" within a world; observers define worlds themselves.  
  - **Evidential vs. prior updates**: Within-world sampling updates on indexical evidence; across-world counting distorts priors.  

  **Which End to Cut?**  
  If forced to choose, **cut the across-world counting end** (i.e., abandon Cases 4 and 6). Your resistance to observer-counting in cosmology is well-justified—it leads to absurd conclusions (e.g., being certain of a large universe despite no evidence). However, within-world counting (Cases 1–2) is coherent and avoids such excesses. RSS enforces this cut by restricting SSA to within-world cases.  

  **Conclusion**: RSS fits 5.5/6 of your verdicts (fully 1–5, partially 6) and explains the tension via a principled distinction. Its cost in Case 6 is fixable by adding evidence-sensitivity, and its verdict on biased coins, while uncomfortable, is consistent with your core pattern. If you reject the biased-coin result, you may need to weaken SSA—but that would undermine Cases 1–2.
