prompt: |-
  You are a philosopher of law and logic who also understands how voluntary organisations actually draft and live under their constitutions. Before you write anything, please brainstorm in private: enumerate every way you can think of in which a system of rules that contains its own amendment procedure can degenerate, deadlock or quietly change its own identity, then divide those failures into the ones that are generic to any rule system — vagueness, bad faith, low turnout, people not reading — and the ones that exist *only* because the rules are able to refer to and alter themselves. Throw the first pile away. Then build the specification out of what is left. Take your time and don't settle for the first framing that occurs to you.

  I should be honest about where I'm coming from: I have no academic background at all — I work in freight forwarding — but for the last six years I've been one of the volunteer directors of a community-owned pub with about four hundred members, and I've ended up as the person who keeps the rulebook. Our rules can be amended by member vote, which sounds harmless until you've watched it go wrong. We have had: a single motion that lowered the amendment threshold from a two-thirds majority to a simple majority *and* in the same breath authorised the transfer of a piece of land, leaving us unable to say afterwards whether it had validly passed under the old rule or the new one (I call this the piggyback motion, but the label is mine); a vote to lower the quorum for constitutional amendments that was itself held at a meeting whose turnout satisfied only the new, lower quorum (borrowed validity); a clause protecting our community-benefit rule from amendment except by a ninety per cent vote at two consecutive AGMs, which a later ordinary majority simply deleted before rewriting the rule it was guarding (the hollow lock); a repeal of the audit rule that left the accounts rule referring to something that no longer exists, alongside a membership change that nobody can now say whether it applies to people who joined under the old wording (orphaned dependencies and residue); and a thinly attended meeting that raised the threshold for reversing its own decision, so that a change nobody much wanted has become very hard to undo (the ratchet). Someone told me there is a parlour game built entirely around this sort of thing — Nomic, I think it is called — which is how I found out that other people have noticed the problem.

  What I want from you is not a model constitution, and not a reading list or citations: I have no library access and no interest in being told which names to look up, I want the arguments. I want the desiderata — the list of things any self-amending system of rules must get right, with the concrete failure behind each requirement, and the cases it has to be able to adjudicate. Please assume there is no external enforcer: nothing outside the rulebook settles whether an amendment was validly made, so the system has to be self-policing and usable by volunteers who will not read it carefully. Mark each requirement as non-negotiable or as a preference of a particular temperament, and say which. Pay particular attention to two things I suspect are at the centre of it: what the system must stipulate about the *initial* rules and the initial amendment procedure before any amendment has yet been made, and what it must say about an amendment's validity when the procedure used to make it is itself what the amendment changes. Then, and this is the part I most want, tell me which pairs of requirements cannot both be satisfied — if the list turns out to describe something impossible, that is a real answer and I would rather know it — and identify the single requirement that excludes the largest number of otherwise attractive designs. If there is room afterwards, a short scorecard for three or four obvious approaches (a hard-coded unamendable core, a tiered structure with entrenched clauses, and full mutability in which even the amendment rule is up for ordinary amendment) would be useful, but the criteria are the deliverable, not the scoring. About nine hundred words, British English, and a table is fine if it helps.
reasoning: |-
  Alright, let me start by really understanding what this pub director needs. He's dealing with a self-amending rulebook that's caused multiple problems like piggyback motions, borrowed validity, hollow locks, etc. He wants desiderata for a robust system, focusing on self-reference issues, not general issues like vagueness.

  First, I need to brainstorm all the ways self-amendment can fail uniquely. Things like simultaneous validity conflicts when changing the amendment rule itself. How does an amendment affect the procedure used to enact it? That's key. Also, what happens when an amendment removes a rule that others depend on, leaving orphaned references. 

  Then, there's the issue of self-entrenchment. Can a rule make itself harder to amend? Or does a lower threshold apply to itself? The hollow lock example shows a protection clause being easily deleted. So, how do you ensure entrenchment works without being bypassed?

  Another point is residue—old rules affecting new members. The membership change left ambiguity. So, the system must handle transitions clearly, specifying applicability based on enactment date.

  Also, ratcheting: raising the threshold to reverse a change. The amendment rule must prevent self-increased entrenchment without consent. Maybe requiring higher thresholds only for future amendments, not the current one.

  What about the initial rules? They need a clear, unassailable starting point. The amendment procedure must define its own applicability to avoid bootstrap paradoxes. And validity tests—how to judge an amendment's validity without external enforcers. Using the rules in force at the time of proposal seems logical.

  Now, conflicts between requirements. For example, allowing full mutability versus preventing self-entrenchment. If the amendment rule can change itself easily, it might lower its threshold, causing instability. But if you lock it down, you lose flexibility. That's a core tension.

  Also, tiered systems with unamendable cores might seem safe but could become obsolete. The trade-off here is adaptability versus security. The user probably prefers a balance but needs to know where compromises lie.

  The single toughest requirement is regulating self-referential amendments. Any change to the amendment rule must explicitly state how it applies to itself to avoid paradoxes. This excludes many simple designs because they don't address this recursion.

  For the scorecard, hard-coded cores are stable but inflexible. Tiered systems offer layers of entrenchment but can have gaps. Full mutability is flexible but risky. Each has trade-offs on the desiderata like no self-invalidating changes or clear validity tests.

  I should ensure all points tie back to his examples. For instance, the piggyback motion shows simultaneous validity conflict. The solution is requiring amendments to state applicable procedure. Borrowed validity points to using existing rules only. Hollow lock requires entrenchment to bind future amendments properly.

  Also, orphaned dependencies need automated fallbacks or explicit transitions. Ratcheting needs asymmetric thresholds. The initial rules must be explicitly defined and immutable at start.

  Finally, compiling the desiderata with their failure cases and marking non-negotiables versus preferences. Non-negotiables include validity source clarity and amendment rule applicability. Preferences might include how to handle residue or entrenchment levels.
answer: |-
  Here are the core desiderata for a self-amending rule system, distilled from your lived failures and focused exclusively on *self-referential* pathologies. These exclude generic issues (vagueness, bad faith, etc.). Each requirement is marked **Essential** (non-negotiable for coherence) or **Temperamental** (reflects a prioritisation of stability/flexibility).

  ### Core Desiderata & Concrete Failures
  1.  **Unambiguous Validity Source (Essential)**  
      *Failure:* Piggyback Motion & Borrowed Validity.  
      *Requirement:* The system must specify *which version* of the rules governs the validity of *any proposed amendment*. Without this, simultaneous changes create paradoxes (e.g., "Was this vote valid under the old threshold or the new one?").  
      *Adjudication Test:* **"The rules in force at the moment a motion is formally *proposed* determine the procedure for its adoption."** This freezes the applicable rule-set for judging *that specific amendment*.

  2.  **Amendment Rule Applicability Clause (Essential)**  
      *Failure:* Borrowed Validity & Ratchet.  
      *Requirement:* Any amendment *altering the amendment procedure itself* must explicitly state whether it uses the *old* procedure or the *new* procedure to validate *its own adoption*. Failure creates self-referential loops.  
      *Adjudication Test:* **"A motion changing the amendment rule must declare in its text whether it operates under the pre-amendment or post-amendment procedure. Absent this declaration, it is invalid."** Prevents bootstrap paradoxes.

  3.  **Non-Retroactive Self-Entrenchment (Essential)**  
      *Failure:* Hollow Lock & Ratchet.  
      *Requirement:* A rule *cannot* use a higher threshold (e.g., 90%) to protect *its own enactment* or *increase its own entrenchment* during its adoption. Entrenchment applies only to *future* amendments.  
      *Adjudication Test:* **"An amendment requiring supermajority X% for future repeal cannot itself require X% for adoption unless X% was already the threshold."** Prevents self-ratcheting and hollow locks (deleting the lock with a simple majority).

  4.  **Orphaned Dependency Resolution (Temperamental: Stability-Leaning)**  
      *Failure:* Orphaned Dependencies & Residue.  
      *Requirement:* The system must provide automated fallbacks or explicit transition rules when an amendment repeals a rule that others depend on, or changes membership criteria.  
      *Adjudication Test:* **"Repeal of Rule A automatically nullifies any rule referencing A *unless* the repealing amendment provides substitute language or a transition mechanism. Membership eligibility is determined by the rules in force at the time of application."**

  5.  **Explicit Transition for Self-Amended Rules (Temperamental: Flexibility-Leaning)**  
      *Failure:* Residue (membership cohorts).  
      *Requirement:* When an amendment alters a rule with ongoing effects (e.g., membership rights), it must specify whether it applies retrospectively, prospectively, or to defined cohorts.  
      *Adjudication Test:* **"An amendment changing an operational rule must state its temporal scope. If silent, it applies prospectively only."**

  6.  **Atomic Amendment Scope (Temperamental: Stability-Leaning)**  
      *Failure:* Piggyback Motion.  
      *Requirement:* A single amendment motion may only alter rules functionally or logically connected to a single purpose. Prevents "ticking bomb" amendments (e.g., lowering threshold + transferring land).  
      *Adjudication Test:* **"No amendment may combine changes to the amendment procedure with changes to substantive operational rules."**

  7.  **Initial Rule Inviolability (Essential)**  
      *Failure:* Bootstrap problem (how to validate the *very first* amendment?).  
      *Requirement:* The initial amendment procedure and core identity clauses (e.g., "We are a community-owned pub") must be explicitly defined and *unambiguously operative* before any amendment occurs.  
      *Adjudication Test:* **"The founding document must contain a procedurally complete, self-contained amendment rule and a declaration of irrevocable purpose. Amendments cannot nullify these *until* a valid successor procedure exists."**

  ### Conflicts & The Central Problem
  *   **Impossible Pair:** **Full Mutability vs. Non-Retroactive Self-Entrenchment (Desiderata 3 & 7).** If *every* rule (including the amendment rule) can be changed by simple majority (Full Mutability), you cannot prevent a simple majority from ratcheting *future* thresholds (violating 3). Conversely, forbidding self-entrenchment (3) requires *some* immutable principle (7), limiting mutability.
  *   **The Single Greatest Excluder:** **Desideratum 2 (Amendment Rule Applicability Clause).** This kills "simple" tiered or mutable systems. Most amateur constitutions assume an amendment rule change "just works," ignoring *which* rule validates *its own* adoption. Requiring explicit self-referential declaration excludes elegant-but-naive designs. *Your Borrowed Validity failure epitomises this.*

  ### Approach Scorecard
  *(Assessed against **Essentials** only. Temperamental desiderata reflect trade-offs.)*

  | Approach                | Validity Source (1) | Amendment Applicability (2) | Non-Retroactive Entrenchment (3) | Initial Rules (7) | Notes                                                                 |
  | :---------------------- | :------------------ | :-------------------------- | :------------------------------- | :---------------- | :-------------------------------------------------------------------- |
  | **Hard-Coded Core**     | ✓ Trivial           | ✓ Trivial                   | ✓ Enforced                       | ✓ Explicit        | Inflexible. Core cannot adapt even if obsolete. "Community pub" unchangeable? |
  | **Tiered Entrenchment** | ✓                   | ⚠ (Requires Clause 2)       | ⚠ (If tiers can self-entrench)   | ✓                 | Risk of "hollow locks" if entrenchment clauses aren't themselves entrenched. Complex. |
  | **Full Mutability**     | ✓                   | ⚠ (Requires Clause 2)       | ✗ Violated inherently            | ✗                 | Enables ratchets & self-destruction. High volatility.                 |
  | **Procedural Freeze (Clause 2)** | ✓                   | ✓ (By design)               | ⚠ (Requires Clause 3)            | ✓                 | Most robust *if* combined with 3 & 7. Still complex for volunteers.   |

  ### The Unavoidable Truth
  No system eliminates human ingenuity in creating paradoxes or acting in bad faith. The desiderata above prevent *unintentional* self-sabotage through self-reference. **Desideratum 2 (explicit self-application declaration) is the keystone.** Without it, borrowed validity and ratchets are inevitable. With it, and adherence to the initial rules (**7**) and anti-self-ratcheting (**3**), you create a *minimally coherent* self-amending system. The trade-off between stability (**Atomicity, Orphan Resolution**) and flexibility (**Explicit Transitions**) is temperamental, but the **Essentials** prevent the system from eating itself. Your pub’s rules need **2, 3 & 7** codified immediately – the rest manages chaos, not collapse.
