  Okay, the user is a doctoral student in comparative ethics and philosophy of religion, focusing on a tension in Buddhist moral theory. They mention the "dual-teleology problem": dependent origination challenges the idea of a stable agent for consequentialist calculations, while the bodhisattva vow aims for universal suffering reduction. They want to know if Buddhist ethics can be seen as a unique, path-dependent consequentialism or if doctrines like anātman and karma undermine outcome-based frameworks.

  First, I need to unpack both sides. The user is likely struggling with categorizing Buddhist ethics within Western frameworks like virtue ethics or deontology. They're noticing a gap where neither fits perfectly. Their deeper need might be to resolve this classification issue to contribute original scholarship. They might also want a coherent model that respects Buddhist doctrines without forcing them into Western boxes.

  The key points are dependent origination dissolving the agent and the bodhisattva's universal goal. The challenge is how to reconcile no-self with outcome-oriented ethics. I should address the objection that without a persistent agent, who bears the burden of maximization? But also consider the counter that the bodhisattva vow acts as a regulative ideal for systemic liberation.

  I recall that in Buddhist thought, karma is intentional action leading to results, but without a fixed self. The path is about reducing suffering through interdependent causes. Consequentialism here can't be aggregative like utilitarianism because there's no quantifiable utility. Instead, it's about weakening karmic conditioning across causal chains. Skillful means (upāya) adapt actions contextually, which might align with flexible strategies in consequentialism.

  On the other hand, doctrines like anātman and the emphasis on intention (cetanā) might challenge consequentialism. If there's no self to maximize outcomes for, and karma focuses on individual intentions, that leans more deontological or virtue-based. But the bodhisattva ideal complicates this by extending compassion universally.

  The user wants a conclusion based on conceptual coherence, not historical analysis. So, I need to argue whether Buddhist ethics is a hybrid, non-aggregative consequentialism, or non-consequentialist. Considering the bodhisattva's commitment to all beings and the path's structure, a non-aggregative consequentialism seems defensible. The Four Noble Truths present a causal framework where actions aim to reduce suffering as an outcome, even if the "maximization" is path-dependent and non-linear.

  The regulative ideal of the bodhisattva vow directs action toward systemic liberation without requiring a permanent agent. Each action weakens suffering's conditions interdependently. This avoids the aggregation problem by focusing on process over outcomes. Skillful means allow for context-specific actions aligned with this teleology.

  However, the centrality of intention and mental cultivation might suggest virtue ethics. But the teleological end of cessation of suffering frames virtues as means, not ends. Thus, integrating both, Buddhist ethics might be teleological but not purely outcome-based; it's a path where virtues and intentions serve the ultimate goal.

  Conclusion: It's a unique teleological structure with path-dependent consequentialism. The doctrines don't undermine but reconfigure consequentialism to fit interdependence and no-self. The bodhisattva vow provides direction, while karma and upāya address means without fixed agents. This offers a coherent model that resolves the dual-teleology problem.
answer: |-
  ## The Consequentialist Bodhisattva on a Path of No Self: Resolving Buddhist Moral Tension

  Your identification of the "dual-teleology problem" strikes at the heart of a persistent ambiguity in Buddhist ethics. The standard virtue-deontology dichotomy indeed obscures a deeper structural tension: a metaphysics dissolving the stable agent essential for conventional consequentialism, coupled with a soteriology demanding universal suffering attenuation that *looks* profoundly consequentialist. Reconciling these requires moving beyond Western taxonomies. Buddhist ethics is best understood as a **distinctive form of non-aggregative, path-dependent consequentialism**, uniquely structured by the doctrines of *anātman*, karma, and *upāya*, which do not undermine but *reconfigure* the consequentialist framework.

  **The Case for Sui Generis Consequentialism:**

  1.  **The Telos of Suffering's Cessation:** The core of Buddhist practice is explicitly teleological: the cessation of *dukkha* (suffering, unsatisfactoriness). The Four Noble Truths diagnose *dukkha*, identify its cause (craving, *taṇhā*), proclaim its cessation as possible, and prescribe the path to that cessation. This ultimate goal – *nirodha* – is an outcome state. The Mahāyāna bodhisattva vow explicitly universalizes this telos: the liberation of *all* sentient beings from suffering. This isn't merely personal perfection; it's a commitment to a specific, universal outcome.
  2.  **Dependent Origination as Consequentialist Framework:** *Pratītyasamutpāda* provides the causal logic for this consequentialism. Actions (*karma*), rooted in intention (*cetanā*), generate results (*phala*) within an intricate web of conditionality. Moral evaluation inherently considers consequences: unskillful actions (*akuśala karma*) lead to suffering, skillful actions (*kuśala karma*) lead to happiness and ultimately liberation. The "maximand" is not aggregated utility held by discrete selves, but the **progressive weakening of the causal chains perpetuating *dukkha* across the interdependent network of sentience.** Liberation (*nirvāṇa*) *is* the state where these chains are fully dissolved. The bodhisattva's actions are judged effective (*upāya*) precisely by their capacity to sever these chains for others.
  3.  **The Bodhisattva Vow as Regulative Ideal:** The vow is not merely a deontological rule; it is the *orienting principle* directing all action towards the ultimate outcome of universal liberation. It functions precisely as a consequentialist "maximizing" directive, albeit maximizing *the conditions for liberation*. Compassion (*karuṇā*) isn't just a virtue; it's the *motivational engine* driving action aimed at the suffering-reduction outcome. Wisdom (*prajñā*) provides the understanding of dependent origination necessary to discern which actions *actually* weaken suffering's causes effectively in any given context.
  4.  **Path-Dependence and Non-Aggregation:** This consequentialism is inherently path-dependent. The "good" (weakening of *dukkha*'s causes) is not a static quantity to be summed across discrete individuals. Liberation unfolds along unique, interdependent causal trajectories. An action's moral quality depends critically on its place within the practitioner's (and recipient's) karmic continuum and its specific impact on the dynamic web of conditions. Skillful means (*upāya*) embodies this: the ethically optimal action is *context-dependent*, chosen solely for its efficacy in moving beings towards liberation *from their current position on the path*. Aggregation fails because the "units" (sentient beings) lack inherent, independent existence (*svabhāva*) and are radically interdependent; the focus is on systemic transformation, not summing individual utilities.

  **Objections and Counterarguments:**

  1.  **The No-Self Objection:** *Anātman* seemingly dissolves the stable agent who could perform consequentialist calculations or bear the "burden" of maximization. Without a persistent self, who maximizes for whom?
      *   **Resolution:** The objection conflates ontological agency with functional agency. While there is no enduring *ātman*, the conventional person (*pudgala*) exists as a dynamic stream (*santāna*) of causally connected aggregates (*skandhas*). Intention (*cetanā*) arises within this stream and initiates karmic causal chains. The bodhisattva acts *as* this conventional agent, guided by wisdom and compassion, intending outcomes within the interdependent whole. The "burden" isn't borne by a self but manifests as karmic results conditioning the future unfolding of the causal stream itself – both for the actor and those affected. Consequentialism operates *within* the conventional truth of action and result, oriented towards the ultimate truth of cessation.
  2.  **The Karma-Phala Objection:** Karma emphasizes intention and the link between *specific* actions and *specific* results for the actor. This seems deontological (intention-focused) or focused on individual merit, contradicting universal outcome-maximization.
      *   **Resolution:** Karma-phala *is* consequentialist, but its scope is refined. Intention matters *because* it shapes the karmic result – the consequence *is* intrinsically linked to the mental state motivating the act. However, the bodhisattva ideal transcends individual karmic bookkeeping. Skillful action (*upāya*) motivated by universal compassion generates karmic results conducive to the liberation of *others*. The "merit" (*puṇya*) accrued is not hoarded but dedicated (*parināmanā*) towards the universal goal. Karma-phala provides the micro-mechanics of causality; the bodhisattva vow provides the macro-orientation towards universal consequence.
  3.  **The Skillful Means Objection:** *Upāya*'s radical contextuality, where actions like lying or killing *might* be skillful if they lead beings towards liberation, seems to undermine any stable consequentialist calculus, risking situationalism.
      *   **Resolution:** *Upāya* is the *operationalization* of path-dependent consequentialism, not its refutation. The calculus *is* stable: the ultimate consequence (liberation/weakening of *dukkha*) is fixed. What varies infinitely is the *effective means* to achieve that consequence for beings at different stages of development within the interdependent web. Wisdom (*prajñā*) – seeing reality as it is (*yathābhūtam*), including dependent origination and emptiness – is the indispensable faculty for discerning the maximally effective action *in each unique causal nexus*. It prevents *upāya* from devolving into mere expediency by anchoring it firmly in the ultimate telos and the law of karma.

  **Conclusion: A Reconfigured Consequentialism of Conditionality**

  Buddhist ethics is fundamentally structured as a **non-aggregative, path-dependent consequentialism**, uniquely defined by its core doctrines. *Anātman* dissolves the atomistic self required for conventional aggregative utilitarianism but does not eliminate functional agency within dependent origination. Instead, it demands that the "good" be conceived as the **attenuation of suffering's causal conditions across the interdependent network of sentient experience.** Karma-phala provides the causal law linking intention to consequence within this network, while the bodhisattva vow establishes universal liberation as the supreme consequentialist aim, transforming individual karmic mechanics into a collective soteriology. *Upāya*, far from undermining consequentialism, is its essential tool, embodying the radical context-sensitivity required to effectively navigate the infinitely complex, path-dependent causal web towards the fixed goal of *dukkha*'s cessation.

  This view resolves the dual-teleology problem: the metaphysics of *pratītyasamutpāda* doesn't negate consequentialism; it provides its specific causal architecture. The bodhisattva’s universal aim isn't an alien graft; it is the logical culmination of the path-dependent effort to unravel suffering's causes wherever they manifest. The "maximization" is not of utility held by selves, but of the **conditions for liberation unfolding along interdependent causal paths.** Buddhist ethics thus presents a coherent, *sui generis* moral system where consequentialist ends are pursued through non-aggregative, condition-focused, and wisdom-guided means, fully integrated within a metaphysics of radical interdependence and no-self. The tension is resolved not by choosing a Western category, but by recognizing the unique consequentialist logic inherent in the Buddha's diagnosis of suffering and its cure.
