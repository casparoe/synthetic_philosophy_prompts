     This is not simply a function of the state entered.

     Alternatively, if the reward is state-based and received upon entering, then the shaping should be applied to the transition.

     But in our activity, the teams only specified the state rewards, not the transition rewards. So the shaping invariance in the literature is for transition rewards.

     To avoid this complexity, we can (in the debrief) explain that there is a transformation that leaves the optimal policy unchanged and that involves adding a function that depends on the state.

     Specifically, for a given shaping function Φ, the transformation on the state-based reward (received upon entering) would be:

          R'(s) = R(s) + γ * Φ(s) - Φ(s_prev)   [but s_prev is not the same for all]

     This is messy.

     Instead, we can note that the value function is transformed by: V'(s) = V(s) + Φ(s)

     and then the shaped reward for a transition from s to s' is:

          R_shape(s, a, s') = R(s') + γ * Φ(s') - Φ(s)

     and then the Q-value becomes:

          Q_shape(s, a) = R(s') + γ * Φ(s') - Φ(s) + γ * [V(s') + Φ(s')] 
          = R(s') + γ * V(s') + γ * Φ(s') - Φ(s) + γ * Φ(s')
          = R(s') + γ * V(s') + [ - Φ(s) ] + [ 2γ * Φ(s') ]

     This is not what we want.

   Given the complexity, it's better to focus on the fact that the value function is only determined up to a constant in each connected component? Or something else.

   For the activity, we can explain that there is a degrees of freedom in the reward function that cannot be resolved by behavior, and that is what they experienced.

   The handout with the grid and behavior:

   Grid world map (3x4 grid) with states:
     A1, A2, A3, A4
     B1, B2, B3, B4
     C1, C2, C3, C4

   The agent's behavior (arrows):
     A1 -> A2
     A2 -> A3
     A3 -> A4
     A4 -> B4
     B4 -> C4
     C4 -> C4

   (for states not listed, no behavior is given because the agent didn't visit them)

   Rules: 
     - The agent can move up, down, left, right to adjacent states (if within the grid).
     - The agent receives the reward of the state she enters.
     - The discount factor is 0.9.
     - The agent's behavior is optimal for some reward function.

   Team instructions:

     "Propose a reward function (a number for each state) such that the observed behavior is optimal. 
      For each state that the agent visited, and for each possible action from that state, the observed action must yield a value at least as high as any other action.
      In formulas: for a state s and an action a that leads to s', the value of taking a is: 
          Q(s, a) = R(s') + 0.9 * V(s')
      where V(s') is the value of state s' (under the optimal policy for your reward function).
      The observed action must have the highest Q-value in that state.

      Note: you will have to define the value function for all states. The value function satisfies the Bellman equation:
          V(s) = max_{a} [ R(s') + 0.9 * V(s') ]
      but only if the agent is being optimal. However, for states not visited by the agent, you are free to choose the reward and hence the value.

      Your deliverable: a reward for each state and a brief explanation of your reward function (e.g., 'the agent is in a hurry to the goal', or ' the agent enjoys the riverside').

      We will then have a prediction round and a discussion."

   Then after the activity, the debrief should cover:

    1. All teams' reward functions explain the observed behavior.
    2. In the prediction round, they all predicted the same behavior in the altered environment.
    3. In the divergence beat, when asked about the reward of a state (e.g., B4), they gave different answers.
    4. This shows that the reward function is underdetermined by behavior, even in new environments.
    5. The underdetermination is not due to lack of data or noise, but is structural.
    6. The shaping invariance: there is a transformation (potential-based shaping) that leaves the optimal policy unchanged.
    7. This means that the question "What does the agent want?" might be ambiguous between the behavioral disposition and the intrinsic preferences.
    8. In IRL, we often resolve the ambiguity by assuming the reward is sparse or by regularization, but that is a assumption.

   Risks: 
     - A team might set all rewards to zero and then try to set the value function arbitrarily to make the condition hold. For example, they might set V(A3) very high and V(B2) very low. This is valid, but then we can ask them to explain what the agent wants. They might say: the agent is myopic and only cares about the next state, and the next state's reward is zero, so it doesn't matter. But then the value function is not consistent with the Bellman equation? They must set the value function to satisfy the Bellman equation for the entire MDP. This might be too hard.

   Given the time constraints of the activity, we might have to accept that and then in the debrief, explain that even such a reward function is in the equivalence class.

   - A team might see the invariance quickly. Then the instructor can ask them to keep quiet and let the others discover.

   - A team might not be able to find any reward function. Then the instructor can provide a hint: set the reward at the goal high and elsewhere zero, and then adjust the value function.

   To save time, we can provide a worksheet with the Bellman equation for the path states.

   For example, for the states along the path:

     V(C4) = R(C4) + 0.9 * V(C4)   => V(C4) = R(C4) / (1-0.9) = 10 * R(C4)
     V(B4) = R(B4) + 0.9 * V(C4)
     V(A4) = R(A4) + 0.9 * V(B4)
     V(A3) = R(A3) + 0.9 * V(A4)
     V(A2) = R(A2) + 0.9 * V(A3)
     V(A1) = R(A1) + 0.9 * V(A2)

   Then for state A2, the agent chose to go to A3. What other actions? 
     From A2, the agent can also go to B2. 
     So we require: 
          R(A3) + 0.9 * V(A3) >= R(B2) + 0.9 * V(B2)
     But note: the left side is exactly the value of going to A3, which is part of V(A2) if we are using the Bellman equation for the optimal value, but in our case, the value function is for the observed policy. 

   This is a bit of a shortcut.

   Given the time, I think the activity will work if the students are upper-level and have some background in decision theory or reinforcement learning.

   Finally, to avoid making it look like a sceptical parlour trick, we can emphasize that in real IRL, we do have partial observability, noise, and limited data, and we also have to choose the state representation. But even if we had complete data and no noise, the underdetermination would remain. This is a fundamental limitation of trying to infer desires from behavior alone.

   The activity might not be perfect, but it should achieve the goal.
answer: |-
  ### Activity Design: Uncovering Reward Ambiguity in Inverse Reinforcement Learning

  **Goal:** Students experience the structural underdetermination of reward functions from behavior, distinguishing between resolvable ambiguity (more data helps) and irreducible ambiguity (more data doesn't help), then recognize that irreducible ambiguity stems from conflating *choice-disposition*, *well-being*, and *counterfactual preference*.

  #### Handout Materials (Photocopy for Students)
  **Grid World Map** (12 squares, 3×4 grid):  
  ```
  Start → A1 ─── A2 ─── A3 ─── A4  
            │      │      │  
            B1     B2     B3  
            │      │      │  
            C1     C2 ─── C3 → Goal (C4)
  ```
  - **States**: Labeled as above. **Goal**: C4 (absorbing; once entered, agent stays).
  - **Transitions**: From any state, move to adjacent square (up/down/left/right; no diagonal moves). Walls block moves (e.g., no direct move from A3 to C3).
  - **Observed Agent Behavior** (arrows show where the agent goes next):  
    - A1 → A2  
    - A2 → A3  
    - A3 → A4  
    - A4 → B4 (down)  
    - B4 → C4 (down)  
    - C4 → C4  
    (Squares B1, B2, B3, C1, C2, C3 unvisited; no arrows provided.)  
  - **Rules**:  
    - Reward received **upon entering a state** (e.g., moving to C4 gives reward of C4).  
    - Discount factor: **γ = 0.9** (a point tomorrow is worth 0.9 points today; continues after reaching C4).  
    - Agent’s behavior is **optimal** for *some* reward function.  

  **Task for Teams**:  
  *Propose a reward function (one number per square) that explains the arrows. Verify your function by showing the observed move from each state yields the highest discounted future reward compared to alternatives. Example check at A2:  
  `R(A3) + 0.9·V(A3) ≥ R(B2) + 0.9·V(B2)`  
  (where V(s) = reward of s plus discounted value of the next state under your policy).*

  ---

  ### Team Structure & Timeline (90 Minutes Total)
  - **Teams**: 3 teams (4-5 students each; mixed CS/philosophy).  
  - **Roles per Team**:  
    - **Recorder**: Writes rewards/values.  
    - **Verifier**: Checks optimality (Bellman condition).  
    - **Spokesperson**: Reports hypotheses.  
    - **Theorist** (optional): Proposes counterfactuals.  
  - **Timeline**:  
    - **0–5 min**: Introduce activity, hand out materials, form teams.  
    - **5–35 min**: **Explanation Phase**  
      Teams design reward functions and verify against observed behavior.  
    - **35–40 min**: **Share Hypotheses**  
      Teams post rewards on the board.  
    - **40–50 min**: **Prediction Round**  
      World change: *"A shortcut opens! From A3, the agent can now move directly to C4."*  
      Teams predict: *"Where does the agent go from A3?"* (Score: 10 pts if correct).  
    - **50–60 min**: **Divergence Beat**  
      Question: *"The city will build a bench in one unvisited square (B1, B2, B3, C1, C2, C3). Which square’s reward should be increased to maximize the agent’s *well-being* (total life satisfaction)?"*  
      Teams propose a square and justify using their rewards.  
    - **60–75 min**: **Debrief/Discussion**  
      Map activity to concepts.  
    - **75–90 min**: **Instructor Synthesis**  
      Clarify takeaways, address pitfalls.  

  ---

  ### Expected Rival Hypotheses with Numbers
  Teams will create **intuitive, non-gerrymandered** rewards. Examples:  
  1. **Team 1 (Goal-Driven)**:  
     - `R(C4) = 10`, `R(s) = 0` elsewhere.  
     - *Story*: "Agent just wants coffee at C4!"  
     - *Verification*:  
       - At A2: Move to A3 (0 + 0.9·V(A3) = 7.29) > Move to B2 (0 + 0.9·V(B2) = 0).  
       - `V(C4) = 10 + 0.9·10 + ... = 100`; `V(A3) = 0 + 0.9·V(A4) = 8.1` (etc.).  

  2. **Team 2 (Scenic-Route Lover)**:  
     - `R(A3) = 5`, `R(C4) = 10`, `R(s) = 0` elsewhere.  
     - *Story*: "Agent enjoys the riverside path (A3) and wants coffee!"  
     - *Verification*:  
       - At A2: Move to A3 (0 + 0.9·V(A3) ≈ 14.2) > Move to B2 (0 + 0.9·0 = 0).  
       - `V(A3) = 5 + 0.9·V(A4) ≈ 15.8`; `V(A4) = 0 + 0.9·V(B4) = 12`.  

  3. **Team 3 (Hates Crowds)**:  
     - `R(B4) = -10`, `R(C4) = 15`, `R(s) = 0` elsewhere.  
     - *Story*: "Agent avoids busy intersections (B4) but values coffee."  
     - *Verification*:  
       - At A4: Move to B4 (0 + 0.9·V(B4) ≈ 1.8) > Move back to A3 (0 + 0.9·V(A3) = 0).  
       - `V(B4) = -10 + 0.9·V(C4) = 3.5`; `V(C4) = 150`.  

  **Verification Check**: All teams confirm at A2, A3, A4, B4 that observed moves dominate alternatives.  

  ---

  ### Engineered Beats
  1. **Prediction Round (Tie)**:  
     - Shortcut opens (A3 → C4). All teams predict: Agent moves to C4 (higher value than A4/B4).  
     - **Why tied?** Structural invariance: All reward functions are *equivalent under potential shaping* (γΦ(s') - Φ(s)), preserving optimal choices in any world change.  

  2. **Divergence Beat (Reveals Irreducible Ambiguity)**:  
     - **Question**: "Where to build the bench to maximize the agent’s *well-being*?" (Not a choice prediction! Asks about intrinsic reward.)  
     - **Responses**:  
       - Team 1: "B3" (R=0, but closest to C4).  
       - Team 2: "B3" (R=0, but near scenic A3).  
       - Team 3: "Not B3! R(B3) might be -10!"  
     - **Why divergent?** Reward functions disagree on unvisited states. Well-being (intrinsic reward) is not observable from behavior.  

  ---

  ### Debrief: Mapping Activity to Concepts
  | **Activity Moment**          | **Concept**                                                                 |  
  |------------------------------|-----------------------------------------------------------------------------|  
  | Teams propose rewards        | **Ambiguity in IRL**: Many R(s) explain the same behavior (underdetermination). |  
  | Prediction round ties        | **Resolvable ambiguity**: More behavior or new environments don’t distinguish R(s) if they’re shaped equivalents. |  
  | Divergence on bench location | **Irreducible ambiguity**: "What’s good for the agent?" (well-being) ≠ choice-disposition. |  
  | Rewards for unvisited states | **Counterfactual preference**: What the agent *would* want if placed there—unknowable from observed acts. |  
  | Simplicity arguments         | **Stipulation, not inference**: Picking the "simplest" R(s) (e.g., sparse rewards) is a modeling choice. |  

  **What You Must Explain**:  
  - **Proof of invariance**: Reward shaping (R'(s) = R(s) + γΦ(s') - Φ(s)) preserves optimality.  
  - **Real-world limitations**: Humans are non-optimal, partially observed, and states are chosen by the modeler.  
  - **Noise/misspecification**: These *compound* but don’t *cause* structural ambiguity.  

  ---

  ### Predictable Pitfalls & Mitigation
  1. **"Let’s pick the simplest rewards (Team 1)!"**  
     - *Response*: "Great! But why is simplicity the right criterion? Team 2’s story is equally consistent."  

  2. **Gratuitous numbers (e.g., R(B1)=π)**.  
     - *Response*: "Does this reflect a hypothesis about the agent’s *motivation*? If not, revise."  

  3. **"We need more data or less noise!"**  
     - *Response*: "Even with infinite noise-free data, Teams 1–3’s rewards *all* fit. Why?" (Point to prediction-round tie).  

  4. **Student spots the trick early**:  
     - *Response*: "Help your team design a hypothesis anyway—does your insight clarify the divergence beat?"  

  5. **Scepticism ("Parlour trick!")**:  
     - *Response*: "This isn’t scepticism—it’s a *feature* of the world. If you build an IRL system and ignore this, you’ll misattribute preferences (e.g., recommend benches in ‘hated’ squares)."  

  ---

  ### Why This Isn’t a Parlour Trick
  The activity shows that **inferring well-being from choices is impossible without extra assumptions**—a critical flaw for applications like:  
  - **AI alignment**: Optimizing for a reward function that conflates choice-disposition with well-being harms users.  
  - **Policy design**: A "bench" built where an agent *chooses to go* (B4) might not improve its *well-being* (if R(B4) < 0).  
  - **Ethics**: Assuming "revealed preference = well-being" is empirically unsound.  

  **Key takeaway**: IRL reveals *choice-dispositions* (mapped by equivalence classes), but answering "What’s good for you?" requires non-behavioral input.  

  ---

  ### Grid and Behavior for Photocopy
  ```  
  Grid:  
  Start → (A1) ─── (A2) ─── (A3) ─── (A4)  
             │        │        │  
            (B1)     (B2)     (B3)  
             │        │        │  
            (C1)     (C2) ─── (C3) → [Goal: C4]  

  Observed Behavior (Arrows):  
  - A1 → A2  
  - A2 → A3  
  - A3 → A4  
  - A4 → B4  
  - B4 → C4  
  - C4 → C4  

  Unvisited Squares: B1, B2, B3, C1, C2, C3 (no arrows).  

  Rules:  
  1. Moves: Adjacent squares only (↑/↓/←/→).  
  2. Reward: Received upon entering a state.  
  3. Discount: γ = 0.9 (applies even after reaching C4).  
  4. Agent is optimal.  
  ```  

  Run this, and students *will* collide with the ambiguity—then see why it matters.
