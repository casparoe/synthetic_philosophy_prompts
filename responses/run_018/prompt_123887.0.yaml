prompt: |-
  I'm writing this on my phone so apologies for typos. I'm trying to understand why the development debate about why some nations are rich has been stuck for decades — you know, Acemoglu and Robinson with inclusive vs extractive institutions, Sachs and geography/malaria, Diamond with axes and germs, then culture/religion people jumping in. Every few years there's a new regression or a natural experiment, everyone agrees correlation isn't causation, yet nobody actualy updates their view. Is this a real causal disagreement, or is it verbal — like "institutions" meaning formal rules to one camp and de facto power distributions to another, and "geography" sometimes meaning climate and sometimes meaning distance to coast? Or maybe it's two different questions smushed together: one about divergence around 1800 and one about what policy can do today. My hunch is that a hidden problem is endogeneity — we measure institutional quality by looking at outcomes that already happened, so it's circular — but I don't know if that's the real stall or if there's something deeper about what counts as evidence in history. Can you diagnose what kind of disagreement this actually is, using what each side really argues, and tell me whether anything — a conceptual distinction, a formal result about identification, or just admitting the question bundles too many mechanisms — could actually move it? I don't want a literature review, just the structure of the impasse.
