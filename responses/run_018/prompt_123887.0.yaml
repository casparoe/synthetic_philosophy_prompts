  Looking at the theories: Acemoglu/Robinson emphasize institutions as the fundamental cause, arguing that inclusive institutions enable growth. Sachs points to geography affecting disease, agriculture, etc. Diamond focuses on historical biogeographical factors. Then there are cultural arguments. Each camp uses evidence like regressions, but endogeneity is a problem. For example, measuring institutions often uses outcomes like GDP, creating circularity.

  The semantic differences are real. "Institutions" can mean formal rules or de facto power. "Geography" might refer to climate, location, or resources. This leads to talking past each other. Moreover, the time frames differ—divergence since the Industrial Revolution vs. contemporary growth policies.

  The user is right about endogeneity. It's a big issue. But the deeper problem is that each theory is partially right and interconnected. Geography might shape initial institutions, which then evolve and influence culture, all affecting growth. Isolating one cause is tough because these factors interact over centuries. Natural experiments help but are limited by scope and generalizability.

  Evidence standards vary. Historians prioritize narratives and context, while economists want statistical identification. This methodological divide means evidence acceptable to one group isn't convincing to the other. Also, confirmation bias plays a role—researchers might favor evidence supporting their pre-existing views.

