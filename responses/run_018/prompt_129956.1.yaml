  ### Decision Tree for Personal Survival through Technological Replacement

  **Tree Structure**  
  The decision tree consists of four sequential nodes, each posing a concrete question about technological replacement scenarios. Answers lead through branches to five distinct leaf positions. Each node is binary except the third, which has three options.

  1. **Gradual In-Vivo Neuron Replacement**:  
     *Question:* "If we gradually replace each neuron in your brain with an artificial substitute while you remain conscious and functionally equivalent, do you survive as the same person?"  
     - **Yes** → Proceed to Node 2.  
     - **No** → Proceed to Node 2.  

  2. **Destructive Scanning-and-Reconstruction**:  
     *Question:* "If your brain is scanned, destroyed, and an identical functional copy is activated in a computer, does the original you survive in the copy?"  
     - **Yes** → Proceed to Node 3.  
     - **No** → Proceed to Node 3.  

  3. **Non-Destructive Scanning**:  
     *Question:* "If your brain is scanned without destruction, creating a simultaneous copy in a computer, how many instances of *you* survive? (The original biological you and the digital copy both exist.)"  
     - **One survivor** (only the original or only the copy is you) → Proceed to Node 4.  
     - **Two survivors** (both are you, now distinct persons) → Proceed to Node 4.  
     - **No survivors** (neither is you) → Proceed to Node 4.  

  4. **Interrupted Upload**:  
     *Question:* "If your brain is scanned (non-destructively), the scan is stored for years, then activated in a computer, does the interrupted copy still represent your survival?"  
     - **Yes** → Leaf position.  
     - **No** → Leaf position.  

  ---

  ### Leaf Positions  
  Each leaf corresponds to a specific combination of answers. The **standard name** (if applicable) and **most awkward commitment** are provided.

  1. **Path**: Yes (Node 1) → No (Node 2) → One survivor (Node 3) → No (Node 4)  
     - **Standard Name**: Spatiotemporal-Causal-Continuity View  
     - **Awkward Commitment**: Rejects destructive uploads even if functional organization is preserved, as the destruction of the original body breaks spatiotemporal continuity. This implies advanced medical neuron replacement is survivable, but a "perfect" destructive upload is not—prioritizing physical continuity over functional equivalence.  

  2. **Path**: Yes (Node 1) → Yes (Node 2) → One survivor (Node 3) → Yes (Node 4)  
     - **Standard Name**: Pattern-Identity Functionalist View  
     - **Awkward Commitment**: Denies branching in non-destructive scanning (only one survivor), requiring ad-hoc criteria to designate which instance (original or copy) "owns" identity when both are functionally identical. This clashes with functionalism's pattern-focused principles.  

  3. **Path**: Yes (Node 1) → Yes (Node 2) → Two survivors (Node 3) → Yes (Node 4)  
     - **Standard Name**: Branching-Tolerant Functionalist View  
     - **Awkward Commitment**: Accepts that non-destructive scanning multiplies identity (two survivors) but denies shared identity post-branching. This implies the original person ceases to exist upon copying, replaced by two new distinct persons—effectively equating survival with identity fission.  

  4. **Path**: No (Node 1) → No (Node 2) → One survivor (Node 3) → No (Node 4)  
     - **Standard Name**: Embodied-Enactivist View  
     - **Awkward Commitment**: Rejects gradual neuron replacement *even in vivo* (e.g., replacing biological neurons with artificial ones in the same body), insisting biological embodiment is essential. This requires dismissing functional equivalence if substrate changes, despite continuous consciousness.  

  5. **Path**: Yes (Node 1) → Yes (Node 2) → Two survivors (Node 3) → No (Node 4)  
     - **Standard Name**: **Unnamed** (Deflationary Graded-Survival View)  
     - **Awkward Commitment**: Treats survival as practical/gradual, not metaphysical, but inconsistently rejects interrupted uploads while accepting destructive uploads. This implicitly smuggles in a metaphysical continuity condition (e.g., no pauses) contrary to its deflationary aims.  

