answer: |-
  ## Exam Prompt: Intergenerational Ethics Final Take-Home

  **Time Allowed:** 90 minutes  
  **Instructions:** Answer the following question clearly and concisely. Focus on precise conceptual analysis rather than extensive citation. Structure your argument logically.

  **Question:**  
  The "Perturbation-Resilient Nonidentity" (PRN) condition reframes the nonidentity problem. Instead of asking whether a *different* policy would create *numerically different* future persons, it asks:  
  1.  **Invariance:** Is the *actual set* of future persons *invariant* under sufficiently small (epsilon) perturbations to present resource-allocation parameters (e.g., minor shifts in savings rates, pollution caps, or healthcare funding)?  
  2.  **Moral Focus:** If so, should moral obligations attach to the *invariance class* itself (the set of persons who *will* exist across these perturbations) rather than to the particular identities instantiated within that class?

  Assume for a policy domain (e.g., climate change mitigation, long-term infrastructure investment) that the PRN condition holds: the same set of future persons exists across minor policy perturbations, though their specific life experiences differ.  

  **Analyze:** Does this PRN framing **dissolve, relocate, or intensify** the classic tension between the following arguments in the context of this policy domain?  
  *   **Harm-to-none:** We have no obligation to choose Policy A over Policy B because the future persons who exist under Policy B are not *harmed* compared to how they would have been under Policy A (since they wouldn't exist under A).  
  *   **Wrong-to-none:** We have no obligation to choose Policy A over Policy B because there exists no specific future person, identifiable *now*, to whom we owe a duty to be born into the conditions created by A rather than B.  

  Justify your answer by precisely applying the logic of the PRN condition to the structure of both arguments.  

  ---

  ## Model Answer (Approx. 700 words)

  The Perturbation-Resilient Nonidentity (PRN) condition neither dissolves nor relocates the core tension between the "harm-to-none" (HtN) and "wrong-to-none" (WtN) arguments central to the nonidentity problem. Instead, it **intensifies** this tension by exposing its fundamental structural nature and rendering appeals to contingent numerical identity differences irrelevant within the invariance class.

  **PRN Clarifies the Invariance Class:** The PRN condition stipulates that for minor policy perturbations (epsilon-changes), the *set* of future persons who will exist remains identical. While the specific timing of conceptions or sperm-egg combinations leading to individuals *within* this set may vary slightly with the perturbation, the membership of the set itself is fixed. Crucially, moral obligations are now directed at this *invariance class* – the group of persons who *will* exist regardless of minor policy tweaks – rather than at the specific counterfactual identities who would exist only under significantly different policies.

  **Impact on Harm-to-None (HtN):** The PRN condition **undermines the standard HtN defense** within the invariance class. HtN traditionally relies on the non-comparability of existence versus non-existence for specific individuals. However, under PRN, we are comparing outcomes *for the same set of persons*. Consider Policy B (e.g., slightly lower savings, leading to marginally fewer resources per capita in the future) versus Policy B+ε (slightly higher savings). Since the same individuals exist under both (due to PRN), we *can* meaningfully compare their well-being levels. If Policy B+ε results in higher well-being for members of the invariance class compared to Policy B, then choosing Policy B *does* make these specific, existing future persons *worse off* than they would have been under B+ε. The core HtN claim – that no one is harmed – collapses because the individuals *are* comparable across the minor perturbation; they are the same people potentially experiencing different welfare levels. Choosing the worse policy *harms* the identifiable members of the invariance class.

  **Impact on Wrong-to-None (WtN):** Conversely, the PRN condition **reinforces and clarifies the WtN challenge**. While HtN is defeated *within* the invariance class, WtN persists as a distinct normative hurdle. WtN argues that obligations must be owed *to* specific individuals. Even though the invariance class is fixed, and we *can* identify that choosing Policy B harms them *compared to B+ε*, we still face the temporal problem: *At the time of decision-making*, no specific member of the future invariance class exists as a concrete entity to whom a present duty is owed. The obligation is to a *future collective* ("the invariance class") or to abstract future individuals who will exist, but not to any presently identifiable person. The WtN argument contends that moral obligations require a specific, identifiable recipient *at the time the duty is incurred*. PRN doesn't resolve this; it simply shifts the focus of the potential harm to a fixed but future set. The WtN claim – that there is *no one* (currently existing or identifiable) *to whom* we owe the duty to implement B+ε over B – remains structurally intact. The obligation seems to float, lacking a present bearer.

  **Intensifying the Tension:** PRN thus intensifies the classic tension. On one hand, it decisively refutes the HtN defense *within the relevant policy space* (minor perturbations) by establishing comparability and the possibility of harm to specific future persons in the invariance class. We *can* harm them by choosing worse policies. On the other hand, it leaves the WtN objection untouched: *to whom* is the obligation owed at the decision point? The tension transforms from one obscured by identity switches (HtN) into a stark conflict between:
  1.  The demonstrable *harm* inflicted on identifiable future persons by choosing sub-optimal policies within the perturbation range (defeating HtN).
  2.  The persistent *structural difficulty* of grounding that obligation in a duty *owed to* those specific, not-yet-existent persons (sustaining WtN).

  PRN doesn't dissolve the tension; it removes the smokescreen of non-comparability provided by large identity shifts, exposing the underlying normative conflict more clearly. It doesn't relocate the tension; the core arguments (harm avoidance vs. duty recipient) remain, but their interaction becomes sharper and more unavoidable within the invariance class framework. The intensification arises from forcing the conflict into a domain where future persons *are* fixed and comparable, yet still normatively elusive at the point of action. The problem is revealed as fundamentally about the nature of obligations to future, non-existent collectives, not merely a logical artifact of identity dependence.

  ---

  ## Marking Scheme (Total: 25 points)

  | **Must-Hit Analytical Move**                                                                                              | **Points** | **Characteristic Failure Mode**                                                                                              |
  | :------------------------------------------------------------------------------------------------------------------------ | :--------- | :--------------------------------------------------------------------------------------------------------------------------- |
  | **A. Correct Interpretation & Application of PRN:** Clearly defines the invariance class (same *set* across epsilon-perturbations) and explains the shift in moral focus *to* this class, away from specific numerical identities *within* it. Demonstrates understanding that PRN makes identity *within* the class irrelevant for the comparison. | 5          | **Failure:** Conflates modal invariance (the set *would* be the same across perturbations) with actual-world identity persistence in a single timeline, or fails to distinguish the set from its members. |
  | **B. Analysis of Harm-to-None (HtN) under PRN:** Correctly argues that PRN *defeats the standard HtN defense* within the invariance class. Explains that because the *same persons* exist across minor perturbations, their well-being *is comparable*. Choosing a worse policy *harms* these specific future persons (compared to the better perturbation). | 5          | **Failure:** Claims HtN still holds because existence itself isn't comparable (missing that PRN fixes identities *for the comparison*), or treats harm solely as an empirical fact without linking it to the PRN-enabled comparability. |
  | **C. Analysis of Wrong-to-None (WtN) under PRN:** Correctly argues that PRN *does not resolve the WtN challenge*. Explains that even with a fixed invariance class, the WtN argument persists because *at the time of decision*, no *specific, identifiable* future person exists *to whom* the duty is owed. Obligations to the class remain structurally problematic for recipient-focused ethics. | 5          | **Failure:** Assumes defeating HtN automatically resolves WtN, or treats WtN as an empirical claim ("we can't identify them") rather than a normative claim about the necessity of identifiable duty-bearers. |
  | **D. Distinction between Harm and Wrong/Duty Recipient:** Clearly articulates the *different structures* of HtN (focused on comparative harm/benefit) and WtN (focused on the existence of a specific duty recipient). Explains how PRN sharpens this distinction by defeating HtN while leaving WtN standing. | 5          | **Failure:** Conflates "harming no one" (HtN) with "wronging no one" (WtN), treating them as synonymous arguments. Fails to see HtN is about outcome comparability and WtN is about obligation structure. |
  | **E. Synthesis: Intensification of Tension:** Provides a clear and justified verdict (Intensifies). Explains *how* PRN intensifies the tension: by removing the HtN defense (making harm demonstrable) while leaving the WtN objection intact, thus exposing a sharper conflict between demonstrable future harm and the structural lack of a present, identifiable duty recipient. Avoids claims of dissolution or relocation. | 5          | **Failure:** Incorrectly claims dissolution (tension gone) or relocation (tension moved elsewhere), or provides only a superficial/unjustified verdict without explaining *how* the tension is intensified structurally. |

  **Grading Notes:**  
  *   Points are awarded based on the clarity, accuracy, and depth of engagement with each analytical move.
  *   A top-grade answer (22-25) will hit all moves precisely, demonstrating sophisticated understanding of the structural mechanics and logical interplay.
  *   A good answer (18-21) will cover all moves but may lack some precision or depth in one area.
  *   A passing answer (15-17) will attempt all moves but show significant misunderstanding or imprecision in 1-2 areas.
  *   Below 15 indicates significant conceptual gaps or failure to engage with the core PRN logic applied to the HtN/WtN tension.
