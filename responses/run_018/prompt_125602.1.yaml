prompt: |-
  I've been arguing with my flatmate about whether chatbots can actually lie, since they don't have beliefs like we do. We got sidetracked into this idea my friend called 'counterfactual candour' — basically, whether an AI should be judged on what it would say if it had access to the true state of affairs, even when its weights are frozen and it can't update. Anyway, I'm drafting notes for a philosophy of technology semniar and realised I need the full spec first.

  Could you lay out the desiderata that any decent theory of AI honesty and deception must meet? I want the cases it has to handle (like false medical advice from a training bias versus deliberately obscuring a reasoning chain), the distinctions it can't collapse (wrong vs deceptive, omission vs commission), the results from cognitve science or consumer-protection law it can't contradict, and flag any pair of requirements that probably can't both be satisfied — especially around intentionality and empirical testability. Then briefly score a behaviourist account, an intentional-stance account, and this 'counterfactual candour' idea against the list. Please answer in British English, and don't worry if there's a typo or two — I might have missed someting obvious.
