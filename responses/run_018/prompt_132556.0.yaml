answer: |-
  ### Essay Question  
  **Statistical Geometry of Coupled Beliefs and Bets:** Consider an agent whose belief about a hidden parameter \(\theta \in \mathbb{R}\) (e.g., the bias of a coin) is represented by a probability distribution \(p(x|\theta)\) defining a statistical manifold with the Fisher-Rao metric \(g_{\theta\theta} = \mathbb{E}_x[ (\partial_\theta \ln p)^2 ]\). She faces two simultaneous wagers:  
  - **Wager A:** Pays \(O_A > 1\) if event \(x_1 = 1\) occurs, else 0.  
  - **Wager B:** Pays \(O_B > 1\) if event \(x_2 = 1\) occurs, else 0.  
  Events \(x_1, x_2\) are independently drawn *given \(\theta\)*, but \(\theta\) is unknown. The agent starts with prior belief \(\theta \sim \mathcal{N}(0, \sigma^2)\) and observes a signal \(y = x_1 + x_2 + \epsilon\) (\(\epsilon \sim \mathcal{N}(0, \sigma_\epsilon^2)\)). She updates her belief via the geodesic (viable shift) on the manifold to posterior \(\theta_{\text{post}}\). She then allocates fractions \(f_A, f_B\) of her capital via Kelly to maximize expected log-growth.  

  **(a)** Derive the geodesic update rule for \(\theta\) under the Fisher-Rao metric. Explain why this differs from a Bayesian posterior mean.  
  **(b)** Compute the standard Kelly fractions \((f_A^*, f_B^*)\) assuming \(x_1, x_2\) are independent *after updating* (i.e., ignoring manifold curvature).  
  **(c)** Show that the geodesic update couples the belief and allocation via the manifold’s curvature tensor. Calculate how the true Kelly-optimal fractions \((f_A^{**}, f_B^{**})\) deviate from \((f_A^*, f_B^*)\).  
  **(d)** Argue whether this deviation reflects:  
  - (i) A flaw in Kelly betting due to its independence assumption, OR  
  - (ii) A necessity for geometric consistency (e.g., preserving information geometry under sequential betting).  

  ---

  ### Model Answer (600 words)  

  **(a)** The Fisher-Rao metric for \(\theta\) is \(g_{\theta\theta} = \mathbb{E}_x[(\partial_\theta \ln p(x|\theta))^2]\). For \(x_i \sim \text{Bernoulli}(p(\theta))\) with \(p(\theta) = (1+e^{-\theta})^{-1}\), \(g_{\theta\theta} = p'(\theta)^2 / [p(\theta)(1-p(\theta))]\). Geodesic updating minimizes the information length \(\int \sqrt{g_{\theta\theta} \, d\theta^2}\) under the observed \(y\). This yields the PDE:  
  \[
  \frac{d^2\theta}{dt^2} + \Gamma^\theta_{\theta\theta} \left(\frac{d\theta}{dt}\right)^2 = 0, \quad \Gamma^\theta_{\theta\theta} = \frac{1}{2}g^{\theta\theta}\partial_\theta g_{\theta\theta}
  \]  
  where \(\Gamma\) is the Christoffel symbol. Solving this gives \(\theta_{\text{post}}\) as the *Rao-parallel transport* of the prior, not the posterior mean. Unlike Bayesian updating (a "jump" in parameter space), geodesics preserve the local metric structure.  

  **(b)** If \(x_1, x_2\) are treated as independent given \(\theta_{\text{post}}\), Kelly maximizes \(\mathbb{E}[\ln(1 + f_A r_A + f_B r_B)]\) where \(r_A = O_A \mathbf{1}_{x_1=1} - 1\). The optimum is \(f_A^* = \frac{p_A O_A - 1}{O_A - 1}\) (similarly for \(f_B^*\)) where \(p_A = p(x_1=1|\theta_{\text{post}})\). This assumes \(\partial_{f_A} \partial_{f_B} \mathbb{E}[\ln(\text{wealth})] = 0\), i.e., no coupling.  

  **(c)** Curvature couples beliefs and allocations via the *amortized second fundamental form*. The true growth rate \(G(f_A, f_B) = \mathbb{E}_{x|\theta}[\ln(1 + f_A r_A + f_B r_B)]\) must be optimized over \(\theta\) updated geodesically. The curvature tensor \(R = \partial_\theta \Gamma^\theta_{\theta\theta}\) introduces a correction:  
  \[
  \delta G \approx -\frac{1}{2} R_{\theta\theta\theta\theta} \, df_A df_B \, d\theta^2
  \]  
  For exponential families, \(R_{\theta\theta\theta\theta} \propto \partial^2_\theta g_{\theta\theta} \neq 0\) (e.g., \(g_{\theta\theta} \propto e^\theta\) for Bernoulli with \(p(\theta) = e^\theta/(1+e^\theta)\) implies \(R < 0\)). Thus, the optimal fractions solve:  
  \[
  \partial_{f_A} G + \lambda \partial_{f_A} \langle d\theta, d\theta \rangle_g = 0
  \]  
  where \(\langle \cdot \rangle_g\) is the metric inner product. This forces \(f_A^{**} = f_A^* + \eta \, R \cdot \text{Cov}(r_A, \partial_\theta \ln p)\) (and similarly for \(f_B\)) with \(\eta > 0\). The deviation scales with curvature and the covariance of payoffs and score functions.  

  **(d)** The deviation reflects geometric necessity (ii). Kelly’s "independence" assumption ignores that belief updates and allocations both live on the manifold. Geodesic updating ensures beliefs evolve viably (e.g., avoiding overconfidence from path-dependent curvature). Using \((f_A^*, f_B^*)\) would maximize *myopic* growth but violate the coherence of sequential updates under the Fisher-Rao structure. For example, negative curvature (common in Bernoulli models) implies \(f_A^{**} < f_A^*\), reducing exposure to hidden risk in \(\theta\). This preserves consistency with the agent’s information geometry, treating belief and capital as intertwined under curvature. Kelly is not flawed—it is misapplied when the statistical manifold is non-flat.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit moves:**  
  1. **Identify Fisher-Rao metric** (4 pts):  
     - *Correct:* \(g_{\theta\theta} = \mathbb{E}[(\partial_\theta \ln p)^2]\) for given \(p(x|\theta)\).  
     - *Botch:* Confuses with KL divergence or fails to specify for \(p(\theta)\).  

  2. **Write geodesic condition** (4 pts):  
     - *Correct:* \(\frac{d^2\theta}{dt^2} + \Gamma^\theta_{\theta\theta} \left(\frac{d\theta}{dt}\right)^2 = 0\) with \(\Gamma = \frac{1}{2}g^{\theta\theta}\partial_\theta g_{\theta\theta}\).  
     - *Botch:* States "geodesic = straightest path" without PDE/Christoffel.  

  3. **Break independence assumption** (4 pts):  
     - *Correct:* Computes \(\partial_{f_i}\partial_{f_j} G\) or \(\text{Cov}(r_i, \partial_\theta \ln p) \neq 0\) due to shared \(\theta\).  
     - *Botch:* Claims dependence "vanishes after update" or misses score function.  

  4. **Link curvature to fraction shift** (4 pts):  
     - *Correct:* Derives \(f^{**} - f^* \propto R_{\theta\theta\theta\theta} \cdot \text{Cov}(r_i, \partial_\theta \ln p)\).  
     - *Botch:* Vague appeal to "curvature effects" without tensor/functional form.  

  5. **Resolve tension** (4 pts):  
     - *Correct:* Argues deviation preserves geometric consistency (not Kelly’s flaw).  
     - *Botch:* Calls it "irrational bias" or avoids philosophical stance.  

  ---

  **Exam logistics:**  
  - **Duration:** 3 hours (open book: course notes/texts allowed; no internet).  
  - **Scope:** Assumes familiarity with differential geometry (connections, curvature) and Kelly’s theorem.  
  - **Hint in question:** Explicitly state \(x_1, x_2\) are independent *given \(\theta\)* but \(\theta\) is latent.
