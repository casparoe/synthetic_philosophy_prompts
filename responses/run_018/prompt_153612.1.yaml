answer: |-
  Your diagnosis is perceptive: the core impasse in the Mary debate stems not from a direct ontological clash, but from **divergent, unarticulated assumptions about the nature of "complete physical knowledge" and the epistemology of phenomenal concepts**. The stalemate arises because each side implicitly defines the key terms ("physical fact," "knowledge," "complete information") in ways that predetermine their conclusion, making their moves appear question-begging to the other. Here's a breakdown of the diagnosis and paths to progress:

  ### Diagnosis: The Roots of the Stalemate
  1.  **The Epistemic Gap Disguised as Ontological:**
      -   **Physicalists** define "complete physical information" *structurally/functionally*: knowing all objective, third-person propositions (de dicto) about physical structures, dynamics, and causal roles. On this view, Mary *has* all the facts. What she gains is a new *mode of access* (de re acquaintance, demonstrative concept possession, cognitive ability) to a fact she already knew propositionally.
      -   **Non-Physicalists** define "complete physical information" as requiring *knowing what it's like* (de se/de re). They see phenomenal properties as having an intrinsic, subjective "residue" that cannot be fully captured by structural/functional descriptions alone. Demonstrative phenomenal concepts are treated as *essential* components of knowing the fact itself, and these concepts are only acquirable through direct experience. Hence, Mary learns a genuinely new *fact*.
      -   **The Stalemate:** Physicalists see non-physicalists smuggling in an unexplained epistemic primitive ("knowing what it's like" as a brute fact-bearer). Non-physicalists see physicalists explaining away the datum by redefining "knowledge" to exclude the very thing needing explanation (the subjective character).

  2.  **The Role of Phenomenal Concepts - The Hidden Battleground:**
      -   The disagreement crystallizes around **phenomenal concepts**. Are they:
          *   **Essentially Indexical/Demonstrative?** ("This [type of] experience") requiring direct acquaintance for possession? (Non-Physicalist leaning)
          *   **Reducible/Constructible?** Can they be fully constituted by physical/functional concepts (even if complex), or are they novel cognitive tools built *from* acquaintance but whose content is physical? (Physicalist leaning, especially Phenomenal Concept Strategy - PCS)
      -   **The Stalemate Deepens:** Non-physicalists argue PCS *presupposes* the gap it tries to close (it needs the "raw feel" to build the concept). Physicalists argue demanding acquaintance-independent grasp of demonstrative phenomenal concepts is incoherent or asks for the impossible, conflating epistemology with ontology.

  3.  **The Formal/Conceptual Underpinning: A Priori Entailment & Concept Possession:**
      -   The hidden formal question is: **"Are all phenomenal truths *a priori* derivable from the complete set of fundamental physical truths *under any possible mode of presentation*?"**
      -   **Physicalists (especially reductive):** "Yes, in principle, given the *correct* conceptual scheme (which might include complex physical/functional concepts capturing the relevant causal roles). Mary's limitation is her *current* conceptual poverty."
      -   **Non-Physicalists:** "No. No amount of structural/functional conceptualization *a priori* entails the specific *subjective character* captured by a demonstrative phenomenal concept. Acquiring *that* concept requires the experience."
      -   **The Stalemate:** This hinges entirely on the *theory of concept possession* and what counts as a "possible mode of presentation." Physicalists argue non-physicalists haven't shown the entailment is impossible; non-physicalists argue physicalists haven't shown it *is* possible without smuggling in phenomenal concepts.

  4.  **Conflation of Semantic & Metaphysical Projects:**
      -   The debate often conflates two distinct questions under "what does Mary learn?":
          *   **Semantic/Epistemic:** Does she acquire new *representational content* (a new propositional fact)? Or a new *way of representing* an old fact?
          *   **Metaphysical:** Does her learning imply a *non-physical property* in the world?
      -   **The Stalemate:** Non-physicalists see the new epistemic gain (the "what it's likeness") as evidence *for* a metaphysical gap. Physicalists see the epistemic gain as compatible with physicalism *if* it's solely about concept possession/representation.

  ### Paths to Progress: Breaking the Stalemate
  The impasse requires shifting the focus away from rehashing intuitions about Mary and towards clarifying the foundational assumptions. Progress is unlikely to come from "winning" the original argument but from reframing or deeper investigation:

  1.  **Precise Formalization & Scrutiny of the Phenomenal Concept Strategy (PCS):**
      *   **Goal:** Make PCS's commitments brutally explicit and test its coherence and explanatory power. What *exactly* is the nature of a "physical" phenomenal concept? How does it refer? What cognitive architecture does it require? Does it truly avoid presupposing the phenomenal residue?
      *   **Potential Progress:** If a robust, non-question-begging formalization is achieved and withstands criticism, it could persuade many that the epistemic gap doesn't imply an ontological gap. Conversely, if every plausible formalization is shown to either fail or tacitly rely on non-physical elements, it strengthens the non-physicalist case. This forces the debate onto clearer conceptual ground.

  2.  **Empirical Investigation of Concept Acquisition & Cognition:**
      *   **Goal:** Investigate how concepts of sensory qualities are formed *without direct phenomenal instantiation* (e.g., congenital blindness/color, deafness/sound, studies on imagination, AI models of concept learning). Can sophisticated neural models or linguistic training generate *accurate* demonstrative-like concepts for unexperienced qualia? What are the cognitive/neural differences between descriptive and experiential knowledge of the same stimulus?
      *   **Potential Progress:** Evidence that highly accurate, functionally equivalent "phenomenal-like" concepts *can* be formed without experience would seriously challenge the non-physicalist intuition and support PCS. Evidence that such concepts are fundamentally impoverished or structurally different would support the non-physicalist view of their essential indexicality. This grounds the debate in science.

  3.  **Sharpening the Conceptual Distinction: Epistemic Gap ≠ Ontological Gap:**
      *   **Goal:** Develop a more rigorous and widely accepted framework for understanding *why* an epistemic gap might persist even under physicalism, separating issues of concept acquisition, cognitive architecture, representation, and metaphysics. Clarify the role of indexicality, acquaintance, and modes of presentation *independent* of the consciousness debate.
      *   **Potential Progress:** If a convincing general account of "explanatory gaps" compatible with ontological monism (physicalism) is developed and applied to consciousness, it could dissolve the apparent force of the Mary argument for many. This involves disentangling the specific intuition about consciousness from broader epistemological puzzles.

  4.  **Reframing/Abandoning the Question?**
      *   **Abandonment?** Declaring the question "ill-posed" is tempting but premature. The intuition behind it is powerful and persistent, indicating it taps into something significant. Abandonment feels like surrender without resolution.
      *   **Reframing:** A more productive approach is to explicitly **reframe the debate:** "Given that Mary gains *something* significant upon leaving the room, what is the *minimal* ontological commitment required to explain this gain? Does it necessitate a fundamental non-physical property, or can it be accounted for within a physicalist framework through an enriched theory of concepts, cognition, and knowledge?" This focuses efforts on explaining the datum rather than using it as a direct ontological lever.

  **Conclusion:** The stalemate arises from deep, conflicting intuitions about the epistemology of consciousness – specifically, whether "knowing all physical facts" includes or excludes the subjective, demonstrative mode of access constitutive of phenomenal concepts. Progress is most likely to come from **interdisciplinary efforts**: rigorous philosophical formalization (especially of PCS) combined with relevant empirical cognitive science and neuroscience to test assumptions about concept formation and cognitive architecture. Clarifying the distinction between epistemic access and ontological commitment remains paramount. The Mary argument won't be "solved" by a knockout punch; progress will involve gradually dissolving the apparent paradox by building a richer understanding of how physical systems represent their own states, particularly states with subjective character.
