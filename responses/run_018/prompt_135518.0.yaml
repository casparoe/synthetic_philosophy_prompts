answer: |-
  Here’s your seminar game – designed for narrative gut-punch:

  **1. Setup and materials (120 words)**  
  Room: Standard seminar table, chairs for 14. **Materials per student:** 3 identical opaque envelopes (A, B, C), 2 blank "Choice Cards" (thick paper), pens, 3 small pots labelled "Safe Pot", "Risky Pot", "Shared Pot". **Group split:** Pairs or threes (small groups foster discussion). **On table:** Central bowl of token chits (e.g., laminated card squares: "£30", "£0", "£100"). **Portable:** Envelopes, cards, pots, chits all fit in a small box. Coffee voucher prizes mentioned later.

  **2. Rules, roles and token payoffs (220 words)**  
  **Round 1 (Commit to Narrative):**  
  *   Groups choose one *real* gamble for everyone:  
      *   **Option Safe:** 100% chance £30 (put £30 chit in Safe Pot).  
      *   **Option Risky:** 80% chance £0, 20% chance £100 (put £0 & £100 chits in Risky Pot).  
  *   *Physical Action:* Write chosen option name ("SAFE" or "RISKY") on a Choice Card. Seal this card inside Envelope A. Place their group’s *unchosen* pot’s chits into the "Shared Pot" (visible to all – this is key!).  
  *   *Payoff Later:* One group’s envelope/chits drawn randomly for actual payouts (coffee vouchers based on chits drawn).  

  **Round 2 (Cancel Shared Component):**  
  *   Instructor reveals: "The Shared Pot (£0 chits from Risky groups / £30 chits from Safe groups) is irrelevant! It’s identical *conditional* on the draw. We cancel it."  
  *   *Physical Action:* **Tear up the Shared Pot chits.** Groups now face ONLY the *remaining* gamble:  
      *   Safe Groups: Envelope A contains "SAFE". *Only* their Safe Pot (£30) remains.  
      *   Risky Groups: Envelope A contains "RISKY". *Only* their Risky Pot (£0/£100 mix) remains.  
  *   Groups must choose *again* for the *real* payoff (same draw as before): Stick with their Envelope A choice? Or switch to the *other* option (using fresh Choice Card in Envelope B)? Seal final choice in Envelope B.  

  **3. The moment they feel it (180 words)**  
  The gut punch hits during **Round 2's tearing**. Safe groups (who had chosen £30 guaranteed) see their comforting £30 chits from the Shared Pot being destroyed. Risky groups see their already-dreaded £0 chits ripped away. **Narrative-continuity resistance emerges:**  
  *   **Safe Groups:** "We *had* £30 locked in! Tearing it feels like stealing our certainty, even though logically it 'didn't count'. Sticking with Safe feels like honouring our initial 'win'." Switching to Risky now feels reckless *within the story they started*.  
  *   **Risky Groups:** "We *braced* for £0! Ripping it out retroactively changes the emotional stakes. Sticking with Risky feels like we endured the fear for nothing, making £100 seem less worth it." Switching to Safe feels like a cowardly retreat *after* committing to the gamble.  
  Destroying the Shared Pot physically severs the *narrative thread* they’d already woven around their initial choice and its potential outcomes.  

  **4. Debrief (200 words)**  
  Don’t name Allais yet! Ask:  
  *   "How many Safe groups switched to Risky in Round 2? Risky groups to Safe? Why not?"  
  *   "What did *tearing* the Shared Pot chits *feel* like? Did it change how you viewed your initial choice?"  
  *   "Did the *story* of your first commitment make the second choice feel different, even though the *probabilities and payoffs* were objectively identical?"  
  **Then reveal:** "You’ve just experienced a violation of the **Independence Axiom** of Expected Utility Theory. It says identical parts of gambles should 'cancel out' without affecting preference. But you felt that cancelling the 'shared' outcome *after* choosing disrupted the **narrative continuity** of your decision – like editing the past. This mirrors the **Allais Paradox**, where people reliably violate independence when a 'safe' option is involved, often explained by regret or certainty effects. But today, you felt it as a resistance to *retroactively altering the story* you’d already started telling yourselves about risk and reward."  

  **5. What will definitely go wrong first time (120 words)**  
  *   **"It's obvious!" Rationalisers:** Some groups may switch logically in Round 2 ("Same odds now!"). **Handle it:** "Great! *Why* did others hesitate? What made it *feel* different even if you switched?" Focus discussion on the *resisters*.  
  *   **Shrugging:** "Meh, just pick." **Handle it:** Press the *emotional* angle: "Did tearing the chits feel satisfying? Neutral? Like breaking a promise? Did anyone feel a twinge of 'But we *earned* that imaginary safety/loss?'" Link it to the physicality – the act of destruction makes the 'cancellation' visceral, not abstract.  
  *   **Confusion on pots:** Be ultra-clear when placing chits initially. Walk around during setup.  

  **6. The feature this can’t reproduce (100 words)**  
  The game brilliantly triggers the *narrative resistance* to cancellation, mimicking the *direction* of Allais reversals (Safe-stayers, Risky-stayers). **But it misses the *real stakes*.** Token chits and hypothetical vouchers lack the visceral fear/greed of potentially losing/winning real, significant money. The emotional weight of a genuine £30 vs £0 vs £100 is diluted. You’ll need to verbally emphasise: "In real Allais experiments, with real money, this reversal persists powerfully – imagine that torn £30 chit was your *actual* lunch money!" The abstraction weakens the effect, but the *mechanism* of narrative rupture is laid bare.  

  **Good luck!** The ripping sound will be glorious pedagogy.
