answer: |-
  Right, here's the thought experiment tailored to your specs, with a quick dissection after:

  **Scenario:** Diagnosed with early-stage neural degeneration, a patient undergoes a decades-long treatment: every few months, a small cluster of failing neurons is replaced with synthetic analogues during a deep, medically-induced coma where EEG flatlines completely, indicating zero detectable cortical activity. Crucially, *before* each anaesthetic, a high-fidelity map of the patient's active neural state is captured. During the coma, the new synthetic nodes are precisely initialised with this pre-sleep map before integration, ensuring that upon waking, memories, personality, and subjective experience feel utterly continuous – no gaps, no jarring shifts in behaviour. After thousands of these coma-procedures, 99% of their brain is now a metabolically inert, synthetic network, completely decoupled from the dwindling original tissue which provides no ongoing biological support whatsoever. They report feeling like themselves throughout, their lifestream unbroken.

  **The Claim:** Has the original biological person survived, or have they died and been replaced by a synthetic artefact that merely *believes* it is the original?

  **Method:** Gradual, piecemeal replacement during periods of induced unconsciousness (EEG flatline) with pre-loaded neural state maps ensuring seamless psychological continuity upon awakening. Final state: >99% synthetic, biologically inert substrate.

  **Nearby Worlds:** A world with no comas (continuous wakefulness during replacement); a world with comas but *no* pre-loading (waking up confused/amnesiac); a world with biological replacement (e.g., cultured neurons) instead of synthetic.

  **Why Theories Split:**
  *   **Psychological Continuity (Parfit-style):** Verdict = **Survival.** What matters is the robust causal chain of connected psychological states (memories, intentions, character traits). Pre-loading the synthetic nodes meticulously preserves this chain *from the patient's subjective perspective* across every waking period. The coma gap is irrelevant *psychologically* because consciousness isn't continuous anyway (sleep, anaesthesia), and the waking continuity is flawless. The *substance* (biological vs. synthetic) carrying these states is deemed irrelevant.
  *   **Strict Biological Substance:** Verdict = **Death/Replacement.** The person *is* their specific, living biological organism (or its core biological processes, primarily the brain). Replacing 99% of the brain with non-biological, metabolically inert material – even gradually – means the original biological entity has ceased to exist. The final entity is a sophisticated artefact mimicking the original, built *from* the original's data, but not the same living being. The coma periods emphasise the discontinuity of the biological process.

  **Feature Doing the Work:** The **total loss of metabolising tissue (final biological inertness)** is *essential* to force the biological view's "death" verdict. The **pre-loading/memory seamlessness** is crucial to force the psychological view's "survival" verdict by eliminating any psychological discontinuity argument. The **coma gap** primarily serves to *isolate* the replacement events, preventing overlap or "blending" that might give the biological view wiggle room (like a "closest continuer" during simultaneous operation), and potentially symbolising a biological cessation, but it's secondary to the substance/pre-loading combo.

  **Biological Defender's Attack:** They'd likely pounce on the **pre-loading**. "It's a *trick*, a perfect illusion of continuity! The synthetic system is merely *replaying* a saved state snapshot, not *continuing* the biological consciousness that ceased during the coma. Each wake-up isn't a *resumption*, it's a *reboot* of a simulation based on the last backup. The original stream of consciousness ended with the first flatline; everything after is a copy."

  **Removing the Coma?** Absolutely collapses it back towards Ship-of-Theseus ambiguity. If replacements happen while awake/conscious, both theories have potential wiggle room:
  *   Psychological: Argue continuity *is* maintained directly.
  *   Biological: Argue the *gradual biological replacement* means the organism persists (like replacing cells). You lose the clean "biological process cessation" point and the isolation preventing overlap/closest continuer arguments. The coma is vital for *forcing* the stark binary choice your spec demands. Bit messy, innit? Hope this hits the spot – ping if it needs tweaking.
