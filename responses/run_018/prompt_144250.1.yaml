prompt: |-
  i'm a phd student in evolutionary bio, mostly doing life-history theory and ESS modelling, so i'm pretty fluent in Hamilton's rule, reproductive value, payoff matricies, and selection gradients, but my philosophy knowledge is basically podcast osmosis. there's this debate called the procreation asymmetry — the idea that it's wrong to have a kid who'd suffer but not wrong to skip having a kid who'd be happy, and there's also that non-identity problem about whether you can harm someone by bringing them into existence. i want you to restate the whole debate, including whatever arguments about moral reasons to reproduce and the weight of future suffering vs happiness are usually in the mix, strictly in my vocabulary: fitness payoffs, inclusive fitness costs, reproductive value of potential offspring, ESS strategies, and asymmetric payoff matrices. don't smuggle moral terms in where they don't map — if 'harm' doesn't translate to a fitness cost or selection pressure, just say it's untranslatable. then give me the residue report: what translates clean, what only fits if you distort evolutionary framing (like treating hypothetical people as 'potential payoffs' in a strategy set), and what has no counterpart at all in selection dynamics. i'm especially interested in whether the asymmetry itself — negative outcomes weighing more than positive ones — shows up anywhere real in evolutionary dynamics, or whether it's purely a framing artifact that vanishes once you actually write down the payoff matrix with symmetric fitness effects. please don't ask me to cite papers or give a bibliography — i don't have access to that stuff in my head and this isn't a lit review.

  format your answer in three sections:
  1. Translation (around 400 words): map the philosophical positions onto evolutionary/game-theoretic terms.
  2. Residue report (around 300 words): what's lost, distorted, or unmapped, and whether that's a failure of evolutionary framing or a sign the original argument was less substantive.
  3. Verdict (around 200 words): does evolutionary biology miss something real that the philosophers are pointing at, or is the asymmetry just conceptual confusion?

  oh, and keep it casual — i wrote this on my phone so excuse any weird formatting.
reasoning: |-
