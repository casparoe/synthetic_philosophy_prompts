answer: |-
  ## Research Plan: The Expressive Paradox in Strategic Voting Under Deontological Constraint

  **1. Research Question & Gap Analysis**

  *   **Precise Research Question:** Can a coherent account of expressive voting justify the strategic selection of a viable candidate whose platform violates a fundamental deontological constraint (e.g., treating persons merely as means), without the act of voting for that candidate constituting symbolic complicity through the expression of endorsement for the violating policies? Specifically, does the nature of the ballot as a speech act, the voter's private intent, or the institutional context of voting as anonymous aggregation sever the link between selection and endorsement?

  *   **Why Existing Frameworks Leave it Unresolved:**
      *   **Purely Expressive Accounts:** These typically frame voting solely as an act of self-expression or identity affirmation, detached from consequences. They struggle to accommodate strategic considerations ("lesser evil" choices) and offer little guidance on whether selecting a morally compromised candidate *expresses* endorsement of their *entire* platform or merely a preference relative to worse options. They often neglect the symbolic meaning and potential complicity inherent in the act of selection within a public ritual.
      *   **Purely Instrumental/Consequentialist Accounts:** These focus solely on the causal impact of the vote on outcomes. They readily justify "lesser evil" voting based on minimizing harm or maximizing expected utility. However, they systematically overlook or dismiss the *expressive* dimension of the act itself. Consequently, they fail to address concerns about the voter symbolically associating themselves with or endorsing the violating policies, as complicity is solely tied to causal contribution to harm, which is negligible in large elections.
      *   **The Gap:** The standard dichotomy forces a choice: express values *or* influence outcomes. The core problem arises when the strategically optimal choice *itself* violates core values the voter wishes to express. Neither framework adequately addresses the *meaning* of the act when the object of strategic choice is morally tainted by deontological violation. The question of whether the ballot *inherently expresses endorsement* when used strategically, and how intent or context might mitigate this, remains unexamined at this precise intersection.

  **2. Methodological Approach**

  *   **Core Methodology:** Conceptual analysis combining Speech-Act Theory and Moral Complicity Theory.
      *   **Speech-Act Analysis of Ballot-Casting:** Employ J.L. Austin and John Searle's framework to analyze voting as a performative utterance. Key questions:
          *   What illocutionary act(s) does casting a ballot for Candidate X typically perform (e.g., endorsing, selecting, authorizing, protesting)?
          *   How do institutional features (anonymity, aggregation, binary choice) constrain or shape the possible illocutionary acts? Does anonymity make it a "muted" speech act?
          *   Is the ballot fundamentally a *propositional* act (asserting "I support X") or an *institutional* input (registering a preference in an aggregation mechanism)? Does its meaning derive from individual intent or public convention?
          *   Can the act carry a "disclaimer" (e.g., "I vote for X only as the lesser evil") given the fixed, unqualified nature of the ballot?
      *   **Moral Complicity Analysis:** Distinguish carefully between:
          *   **Causal Complicity:** Responsibility arising from contributing to a harmful outcome. (Likely negligible for a single vote).
          *   **Symbolic Complicity:** Responsibility arising from actions that associate the agent with wrongful norms, policies, or agents, thereby expressing endorsement, condonation, or solidarity, irrespective of causal impact.
          *   Focus: Develop a nuanced account of *symbolic complicity* specifically related to expressive acts within institutional rituals. When does selecting an agent in an authorization ritual (like voting) constitute symbolic association with their wrongful commitments? Does private dissent sever this link?
  *   **Why Preferable to Standard Analyses:**
      *   **Beyond Consequentialism:** Directly addresses the non-consequentialist concern about "dirty hands" and symbolic association, which instrumental analyses dismiss.
      *   **Beyond Simple Rights/Duties:** Moves beyond abstract rights to vote or duties to participate, focusing instead on the *moral meaning and relational implications* of the specific act of voting for a particular, compromised candidate.
      *   **Captures the Core Tension:** This approach directly targets the heart of the problem – the *meaning* of the strategic vote and its potential for *expressive self-betrayal or complicity*, which purely outcome-based or purely value-expression models cannot adequately capture.

  **3. Definition of Success and Failure**

  *   **Successful Result:** The development of a philosophically robust framework that:
      1.  Clearly delineates conditions under which strategic voting for a deontologically compromised candidate *can* be expressively coherent and non-complicit (e.g., when the ballot is understood primarily as an anonymous input, when institutional context clearly dissociates selection from endorsement of specific policies, when the act expresses rejection of the *greater* evil more saliently).
      2.  Clearly delineates conditions under which such voting *necessarily* constitutes impermissible symbolic endorsement/complicity (e.g., when the voting act is inherently performative of authorization/endorsement in that context, when the compromising policy is central to the candidate's identity, when alternative expressive avenues exist).
      3.  Provides criteria for assessing the relative weight of voter intent versus public convention in determining the expressive meaning of the vote.
      4.  Offers guidance on how voters might navigate this dilemma with moral integrity.
  *   **Failure:** The project would fail if:
      1.  The speech-act analysis collapses back into purely consequentialist reasoning (i.e., the meaning is solely determined by expected outcomes).
      2.  The complicity analysis proves indistinguishable from causal contribution, rendering the symbolic dimension irrelevant.
      3.  No coherent distinction between permissible strategic voting and impermissible complicit endorsement can be sustained, leading to the conclusion that strategic voting under deontological constraint is *always* expressively incoherent or complicit, or *never* complicit.
      4.  The analysis remains entirely dependent on subjective voter intent, providing no objective criteria for assessing complicity.

  **4. Realistic Scope for One Year (Conceptual Work)**

  *   **Phase 1 (Months 1-3): Foundational Analysis & Literature Engagement**
      *   Deep dive into existing expressive voting theories (Brennan, Lomasky, others) and instrumental/consequentialist justifications (Parfit, Goodin). Identify precise limitations regarding the conflict case.
      *   Rigorous articulation of the deontological constraint(s) in play and the structure of the voter's dilemma.
      *   Develop the core speech-act analysis of voting, drawing on Austin, Searle, and applications to political authority.
  *   **Phase 2 (Months 4-6): Complicity & Symbolic Association**
      *   Develop the account of symbolic complicity, drawing on moral philosophy (e.g., notions of association, solidarity, expressive action) and political theory (e.g., theories of representation, authorization, public reason).
      *   Analyze the specific link between selecting a candidate via ballot and symbolic endorsement/complicity. Examine the role of intent, publicity, anonymity, and institutional context.
      *   Critically engage with concepts of "dirty hands" and moral residue.
  *   **Phase 3 (Months 7-9): Framework Construction & Refinement**
      *   Synthesize findings to construct the proposed framework distinguishing permissible strategic voting from impermissible complicit endorsement.
      *   Test the framework against challenging scenarios and potential counterarguments.
      *   Refine conditions and criteria.
  *   **Phase 4 (Months 10-12): Integration, Writing & Refinement**
      *   Integrate the analysis into a coherent dissertation chapter/manuscript draft.
      *   Articulate implications for democratic theory and voter ethics.
      *   Refine arguments and prose.
  *   **Scope Limitations:**
      *   **Focus:** Primarily on single-member district, plurality-winner elections with binary or limited-choice ballots common in majoritarian systems (e.g., US Presidential/Parliamentary elections). Complex systems (PR, ranked-choice) introduce additional variables best addressed later.
      *   **Candidate Type:** Focus on candidates where the deontological violation is a clear, publicly advocated policy position (e.g., rights violations, discriminatory policies), not merely perceived incompetence or policy disagreement.
      *   **Voter Motivation:** Focus on voters sincerely holding the deontological constraint and facing a genuine strategic dilemma. Willful ignorance or apathy are excluded.
      *   **Empirical Claims:** No primary data collection. Relies on conceptual argumentation and analysis of institutional features. May reference real-world examples illustratively, not evidentiary.
      *   **Full Normative Theory:** The goal is *not* to provide a complete normative theory of voting ethics, but to resolve this specific conceptual tension within such theories.

  This plan provides a clear, focused, and feasible structure for a one-year conceptual dissertation fellowship project, directly addressing the novel tension identified while leveraging appropriate philosophical methodologies.
