answer: |-
  Here's a rigorous argument that mirror-tracking in logical space dissolves the epiphenomenalist paradox while avoiding collapse into parallelism or other alternatives:

  **The Core Argument:**

  1.  **The Epiphenomenalist Paradox Restated:** If phenomenal states (P) are causally inert epiphenomena, then the physical brain state (B1) causing the report "I am in P" is *not* caused by P itself. The report's accuracy depends on a causal connection between P and the concept deployment (C). Without this, C seems accidentally correlated with P, undermining justification for belief in P.

  2.  **Mirror-Tracking Defined:** A phenomenal concept (C_P) refers to a phenomenal state (P) not via causal tracking (where C_P is caused by P and covaries with it), but via *structural isomorphism within logical space*. C_P possesses an intrinsic conceptual structure that perfectly mirrors the intrinsic qualitative structure of P. Accuracy is achieved when the structure of the experience token *instantiates* the structure defined by the concept.

  3.  **Dissolving the Paradox:**
      *   When you experience pain (P), a specific brain state (B_pain) simultaneously *realizes* P and *activates/instantiates* the phenomenal concept C_pain.
      *   Crucially, **C_pain's structure is designed *in advance* (evolutionarily, developmentally) to mirror the structure of P.** This mirroring exists in the abstract realm of logical space – the space of possibilities and necessary relations.
      *   The judgment "I am in pain" involves deploying C_pain *while* B_pain is active. The *accuracy* of this judgment doesn't depend on P *causing* C_pain deployment. Instead, it depends on:
          *   **Structural Match:** Does the actual structure of the *experience token* (P) match the structure defined by the *concept token* (C_pain) being deployed?
          *   **Constitutive Grounding:** Both P and the deployment of C_pain are non-causally grounded in the *same* physical substrate, B_pain. B_pain is the common realization base.
      *   Because C_pain's structure *necessarily* mirrors P's structure (as defined in logical space) *and* both are realized by the *same* brain state (B_pain), the judgment deploying C_pain is *automatically* accurate when B_pain occurs. The truth-maker (P) and the concept deployed (C_pain) are structurally isomorphic aspects of the *same* underlying physical event.

  4.  **Avoiding Psychophysical Parallelism:**
      *   **No Dual Tracks:** Parallelism requires two independent, pre-established chains (one physical, one mental) running in harmony. Mirror-tracking rejects this dualism.
      *   **Single Realization Base:** Both the phenomenal state (P) and the conceptual deployment (C_pain) are different *aspects* or *manifestations* of the *single* physical brain state (B_pain). P is the "what it's like," C_pain is the cognitive recognition/representation *of* that "what it's like," both supervening on B_pain.
      *   **No Pre-Established Harmony:** The correlation isn't a pre-set harmony between distinct substances. It's a *consequence* of how phenomenal concepts are *defined* and how they are *physically realized*. C_pain *means* that structural quale, and the brain state realizing that quale *also* realizes the concept designed to mean it. The harmony is *constitutive*, not pre-established.
      *   **Structure as the Link, Not Causation:** The connection isn't causal (P -> C) nor a mysterious parallel correlation. It's the *identity in structure* between the phenomenal property of B_pain and the conceptual content of the cognitive state also realized by B_pain, both defined within logical space.

  5.  **Distinguishing from Other Alternatives:**
      *   **vs. Identity Theory:** Unlike strict identity theory (P = B_pain), this preserves the conceptual distinction between the phenomenal feel and the physical state/brain concept. P is a property *of* B_pain, and C_pain is a cognitive state *realized by* B_pain, but they are distinct aspects.
      *   **vs. Representationalism:** While representationalism often uses causal/informational tracking, mirror-tracking relies solely on structural isomorphism in logical space without requiring causal covariance or teleosemantic history.
      *   **vs. Analytic Functionalism:** The concept C_pain isn't defined by its causal-functional role *within the cognitive system* (which would give P causal efficacy via its concept). Its content is fixed by its structural isomorphism to P *in logical space*, independent of its intra-mind causal role.
      *   **vs. Illusionism:** Accuracy is preserved! The judgment *is* true because the structure of the experience token *does* match the structure defined by the concept deployed, thanks to their shared realization base and pre-defined mirroring.

  **Why This Works for Epiphenomenalism:**

  *   **P Remains Causally Inert:** The occurrence of P (the quale itself) plays *no causal role* in triggering the judgment "I am in P." The judgment is caused entirely by physical processes within B_pain that *also* realize P and instantiate C_pain.
  *   **Accuracy Without Causation:** The judgment's accuracy stems solely from the *structural isomorphism* between the concept deployed (C_pain) and the quale (P) experienced, both non-causally necessitated by their common physical realization base (B_pain) and the conceptual definition in logical space. No causal link between P and the cognitive state is needed.
  *   **Grounding in Logical Space:** Logical space provides the framework where the necessary structural relations defining P and C_pain exist prior to any instantiation. This explains the *a priori* knowability of phenomenal truths (knowing C_pain tells you what P *must* be like) without invoking causation.

  **In essence:** The epiphenomenalist paradox arises from demanding a *causal* explanation for the accuracy of phenomenal judgments. Mirror-tracking replaces the need for causation with **constitutive structural isomorphism grounded in a shared physical realization base, where the phenomenal concept's definition in logical space inherently captures the structure of the phenomenal property it refers to.** This preserves epiphenomenalism (P causes nothing) while securing the truth and justification of introspective reports ("I am in P"), avoiding the pitfalls of parallelism by anchoring both P and C_pain in a single physical state and linking them via necessity in logical space, not pre-established harmony.
