  Other potential counterevidence includes temporal binding windows in perception and the global neuronal workspace theory's experimental support. But I should acknowledge that Dennettians have responses to each of these - for instance, they'd argue split-brain phenomena demonstrate precisely the kind of fragmented processing their model predicts.

  The analogy breakdown points are important too. Qualia and subjective unity don't map neatly to log files. I should emphasize that while the distributed systems model explains reportability well, it struggles more with raw subjective experience. 

