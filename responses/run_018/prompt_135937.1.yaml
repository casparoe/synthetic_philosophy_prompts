answer: |-
  You've precisely identified a crucial tension in the philosophy of time arising from relativity. The position you describe—where each observer has a fundamental, local "now," and *all* of these local presents exist together ontologically—is most commonly identified with **Fragmentalism** (particularly as developed by Kit Fine in response to relativity). It is distinct from both classical Presentism and standard Eternalism (the block universe), but occupies a complex middle ground.

  Here's the conceptual carving you requested:

  1.  **The Core Position: Fragmentalism**
      *   **What it is:** Reality is constituted by multiple, *co-existing* but *mutually incompatible* "fragments" or "perspectives." Each fragment contains events that are genuinely present *from that perspective*. Crucially, *all* fragments are ontologically real and fundamental. There is no single, overarching timeline or "God's-eye view" that reconciles these fragments into a single, consistent ordering of events. An event E being present-for-observer-A and past-for-observer-B are *both* real, irreducible facts about E *in* their respective fragments. Reality is "fragmented" into these local presents.
      *   **Key Metaphor:** Imagine reality not as a single, smooth block, but as a collection of overlapping, partially conflicting snapshots (each representing a local "now"). The snapshots exist together, but they can't be perfectly glued into one coherent picture without contradiction.

  2.  **Distinguishing it from Presentism:**
      *   **Presentism (Classical):** Only the *single, global* present moment exists. Past and future are unreal.
      *   **Fragmentalism vs. Presentism:**
          *   **Multiplicity vs. Singularity:** Fragmentalism posits *many* fundamental present moments (one per perspective/fragment), while Presentism insists on only *one* present moment for the entire universe.
          *   **Co-existence of "Presents":** Fragmentalism allows events that are "present" in different fragments to coexist ontologically, even if they are mutually exclusive *within* a single temporal ordering. Presentism denies this; only one set of simultaneous events is real *simpliciter*.
          *   **The Boundary:** Presentism collapses the moment you allow *more than one* fundamental "present" slice to exist simultaneously in the ontology. If reality contains *both* my "now" *and* your "now" (located elsewhere and containing events that are future/past relative to me) as equally real and fundamental, you have necessarily abandoned Presentism. Fragmentalism embraces this multiplicity.

  3.  **Distinguishing it from Eternalism (Block Universe):**
      *   **Eternalism (Standard Block):** All events in spacetime, past, present, and future, exist equally. There is no privileged "present" slice; "past," "present," and "future" are merely relational properties (like "here" vs. "there") depending on the observer's location in spacetime. The universe is a single, four-dimensional manifold.
      *   **Fragmentalism vs. Eternalism:**
          *   **Privilege of the Present:** Fragmentalism *retains* the notion that "presentness" is an absolute, non-relational property *within each fragment*. In your fragment, your "now" *is* genuinely present in a way that your past/future is not. Eternalism denies this; "present" is always relative, never absolute.
          *   **Structure:** Eternalism sees a single, consistent, observer-independent spacetime structure. Fragmentalism sees a reality composed of *multiple, incompatible* temporal perspectives/fragments, lacking a single unifying structure. The block is smooth; the fragments are disjointed shards.
          *   **Temporal Passage/Becoming:** Fragmentalism can accommodate a form of temporal passage *within each fragment* (as the fragment's focus shifts along its own timeline). Eternalism typically denies genuine passage; change is just variation across the static manifold.
          *   **The Boundary:** Eternalism dissolves the absolute significance of "now" entirely, making it purely frame-dependent. Fragmentalism preserves the absolute reality of "now," but multiplies it, insisting that *every* frame's "now" is absolutely real *within its fragment*. Fragmentalism becomes indistinguishable from Eternalism *only if* you insist that the fragments *must* be embedded within a single, consistent spacetime manifold, and treat the "local present" as merely a subjective label within that manifold. Fragmentalism denies this embedding requirement.

  4.  **Boundary Conditions & Nuances:**
      *   **The Subjectivity Trap:** The position avoids being *merely* subjective if the "local presents" are not just mental states but fundamental features of reality itself. The fragments are objective, even if perspectival. If the "nows" are *only* in the mind, it reduces to a form of anti-realism about time or a psychological view, not Fragmentalism.
      *   **Overlap vs. Conflict:** Fragmentalism thrives on the *incompatibility* of the fragments. If the local "nows" could be seamlessly integrated into a single timeline without contradiction (as Minkowski spacetime allows for spacelike separated events), then Fragmentalism loses its motivation and collapses into Eternalism. The *irreconcilable disagreement* about simultaneity is what necessitates the fragmentation.
      *   **The "Collection" vs. the "Block":** You are correct that the *collection* of all local presents structurally resembles the block universe. The crucial difference lies in *how* that collection is conceived:
          *   **Eternalism:** The block is primary and fundamental. The slices (including "now" slices) are derivative ways of partitioning it.
          *   **Fragmentalism:** The fragments (each containing their own "now") are primary and fundamental. The "collection" is just that – a collection of fundamental realities. The apparent block-like structure is an *emergent* or *derived* feature, not the underlying ontology. There is no pre-existing block that the fragments are carved from; the fragments *are* the fundamental reality.
      *   **Where it Ceases to be Presentism:** The instant the ontology includes *more than one* fundamental, co-existing "present" state of affairs (i.e., events that are non-simultaneous relative to each other both being fundamentally "present" in their respective fragments), classical Presentism is abandoned. Fragmentalism embraces this.
      *   **Where it Risks Collapsing into Eternalism:** If the fragments are conceived as *merely* different ways of *describing* or *experiencing* a single underlying block reality, rather than being ontologically fundamental and incompatible, then it collapses into a form of Eternalism. Fragmentalism insists the fragments are irreducibly real and incompatible. If the apparent incompatibility is resolved by appealing to a higher-dimensional structure that contains all fragments consistently, it collapses into Eternalism.

  **In essence:** Fragmentalism carves reality not along a single temporal axis (Presentism) or as a static whole (Eternalism), but into a multitude of fundamental, tensed, local realities ("fragments"), each possessing its own absolute present moment. The phenomenon is the ontological co-existence of these mutually incompatible temporal perspectives. It is *not* the denial of temporal becoming (like Eternalism), nor the assertion of a single global becoming (like Presentism). Its edges lie between the singularity required by Presentism and the unified, tenseless manifold of Eternalism, defined by its commitment to multiple, fundamental, and irreconcilable "nows" constituting reality. Your intuition that it reproduces the block "in disguise" touches on a key criticism: whether this complex ontology is truly distinct from or merely a convoluted restatement of Eternalism, just privileging the present tense locally. Fragmentalism insists on the distinction through its commitment to the irreducible reality and incompatibility of the fragments.
