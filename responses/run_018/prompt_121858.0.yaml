  Here's that poem draft for your character's notebook, playing with the loop exactly as you described:

  **Notebook Page (Coffee Ring Stain Upper Right Corner)**

  A whisper claiming *this* is me  
  pressed flat against the morning window.  
  The glass holds both the sky and face—  
  which one is breathing fog? The trace  
  of finger-wipes where thought should go.  
  A whisper claiming *this* is me.

  A whisper claiming *that* is me  
  across the room now, faint and thin.  
  Not in the skin, but near the chair  
  where yesterday sat someone there  
  who swore the center must begin.  
  The voice insisting *here* is home.

  The voice insisting *there* is home  
  dissolves as footsteps cross the floor.  
  The sound arrives, a lagging freight,  
  a past-tense echo, always late  
  to meetings held behind the door.  
  The echo tracing *now* is gone.

  The echo tracing *then* is gone.  
  Just hollows where the words once fit.  
  The mirror shows the empty room  
  reflecting back the gathering gloom  
  that wears your coat. A constant split.  
  This ghost repeating *you* are here.

  This ghost repeating *I* am here  
  borrows the light, the shape, the sound.  
  It writes the lines, it stains the page,  
  trapped center-stage inside its cage  
  of symbols chasing, round and round—  
  a whisper claiming *this* is me.

  ---

  **Why the loop works**

  1.  The forced carry-over (last line -> next first line) literally traps the speaker inside her own prior words, makin her re-start from a slightly altered version of herself, like shes stuck replaying a tape thats degrading each pass.
  2.  The single word shift each time ("this"->"that", "here"->"there", "now"->"then", "you"->"I") is that "telephone game" slippage – tiny distortions in the self-reference that build up, showin how the core "I" statement never stays stable, its always becomin something else.
  3.  Ending right back at the very first line, but crucially *after* the word "ghost" replaced "whisper", creates that perfect strange loop feel: its the "same" start, but haunted now, implyin the whole cycle just repeats with deeper fractures. No landing, just eternal revision.
  4.  The form *does* the philosophizin without preachin: the speaker *tries* to define herself ("this is me", "here is home"), but the structure keeps destabilizing the ground under those claims, makin her chase her own tail. The instability is built-in.
  5.  The casual, slightly fragmented free verse inside the rigid loop structure mirrors the messy mind caught in the too-perfect formal trap of selfhood.

  Hope this fits the vibe for your character! That loop structure is a trip to write within, really drives home the slippage. Good luck with the novel!
