  Hmm, I need to unpack both of Williams' ideas clearly. The integrity objection is about utilitarianism demanding we abandon our deepest projects if calculations favor it, which feels like a betrayal of self. The "one thought too many" is about a husband saving his wife because utilitarianism permits it rather than out of love. The user links these by pointing to the intrusive layer of calculation. 

  Their analogy is intriguing. Ground projects are like research programs you're invested in without daily justification. Constantly recalculating their value mirrors the husband's excessive moral math. But is this chronic vs. acute distinction accurate? 

