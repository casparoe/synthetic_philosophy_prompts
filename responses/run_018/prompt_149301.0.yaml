answer: |-
  **Exam Question:**  
  "Your friend proposes two cosmological models. Both predict exactly 8 billion awake, embodied observers *now*. However, **Model A** also predicts 100 billion dormant observers (e.g., uploaded minds in cold storage, inactive Boltzmann brains) that *could* activate in the future. **Model B** predicts *zero* such dormant observers. Neither model affects your non-indexical evidence.  

  Using *only* the principles of **Self-Sampling Assumption (SSA)** and **Self-Indication Assumption (SIA)**, compare how an observer like you should update their credence in Model A vs. Model B upon finding themselves awake now. Where exactly do SSA and SIA diverge in their predictions here, and why?  

  Finally, the ‘Presumptuous Philosopher’ (PP) objection claims SIA unreasonably favors theories predicting more observers. Does PP *actually apply* to this dormant-observer scenario, or is it misapplied? Explain your reasoning.  

  *(Avoid regurgitating generic textbook arguments; focus squarely on this setup. 700 words max.)*"  

  ---

  **Model Answer (Approx. 700 words):**  

  **SSA vs. SIA Predictions:**  
  Under SSA ("I should reason as if randomly sampled from all *actual* observers in my reference class"), only currently existing observers matter. Here, both models have **identical numbers of awake observers (8 billion)**. Dormant observers in A are irrelevant because they aren’t "actualized" observers now; they’re potential future entities. Thus, SSA treats Models A and B symmetrically: **Pr(A|SSA) ≈ Pr(B|SSA)**. My existence provides no evidence favoring either model since the *observed* reference class is identical.  

  SIA ("I should reason as if weighted by the total number of *possible* observers") diverges sharply. SIA weights hypotheses by their predicted number of observers *before* conditioning on your existence. Model A predicts **108 billion total possible observers** (8B awake + 100B dormant), while B predicts only **8 billion**. Upon finding myself awake, SIA updates by conditioning on being an observer. The likelihood ratio becomes:  
  > *Pr(I exist | A) / Pr(I exist | B) = (Total observers in A) / (Total observers in B) = 108B / 8B = 13.5*.  

  Thus, **SIA strongly favors Model A by a factor of 13.5**. The dormant observers boost A’s probability because SIA counts them as "possible" observers I could have been—even though they’re inactive now.  

  **Divergence Point:**  
  The core divergence is **whether dormant observers are included in the "sampling pool"**. SSA ignores them (only actual observers now count), while SIA includes them (all *possible* observers count, regardless of current state). This directly impacts likelihood ratios: SSA sees no difference, SIA sees a 13.5x difference.  

  **Presumptuous Philosopher (PP) Applicability:**  
  The PP objection argues that SIA problematically favors high-observer models *without empirical evidence*. **PP does NOT apply here**, as this scenario lacks PP’s defining feature: *indistinguishable observers competing for the same "slot"*.  

  In classic PP (e.g., universe A has 1 trillion observers, B has 1 billion), SIA favors A because you’re "more likely to exist" in a high-observer world. But here, dormant observers in A **do not compete with awake ones for your observer-moment**. Your data isn’t "I am an observer" *simpliciter*—it’s "**I am an awake observer now**." Dormant observers aren’t part of this *localized* reference class; they’re disconnected from your current evidence stream.  

  Thus, favoring A under SIA isn’t "presumptuous" in the PP sense. PP criticizes SIA for overriding *empirical* data when observers are qualitatively identical. Here, dormant observers are *ontologically distinct* from your awake state. SIA’s weighting isn’t prior-driven presumption; it’s a structural feature of how it defines possibility. Crucially, **no empirical evidence contradicts A**—dormant observers are unobservable by definition. PP applies when SIA ignores *contradictory* evidence, not when it weights unobservable parameters.  

  In short: SSA sees symmetry, SIA sees asymmetry, and PP is misapplied because dormant observers don’t threaten "overconfidence" in observable data.  

  ---  

  **Marking Scheme (25 points total):**  
  Fail to hit these → **lose 5 points each**:  
  1. **SSA’s symmetry claim**: Must state SSA gives ~equal credence to A/B *because dormant observers are excluded from the reference class*.  
     *Lose points if:* They imply SSA favors A or B, or include dormant observers in SSA’s sampling pool.  
  2. **SIA’s likelihood ratio**: Must explicitly calculate Pr(I exist|A)/Pr(I exist|B) = 108B/8B = 13.5 (or equivalent).  
     *Lose points if:* Ratio is missing, incorrectly calculated, or justified vaguely without SIA’s weighting rule.  
  3. **Divergence on dormant inclusion**: Must pinpoint that SSA/SIA differ *only* on whether dormant observers count as "observers" for sampling/weighting.  
     *Lose points if:* Attribute divergence to other factors (e.g., "complexity") or misdefine the sampling pool.  
  4. **PP’s inapplicability**: Must argue PP doesn’t apply because dormant observers aren’t in the *awake-now* reference class and don’t compete with observed data.  
     *Lose points if:* Claim PP applies here, or cite PP generically without addressing the *dormant vs. awake* distinction.  
  5. **Evidence specificity**: Must emphasize that "I am awake now" (not just "I exist") is the key evidence, making dormant observers irrelevant to *this* observation under PP logic.  
     *Lose points if:* Treat "I exist" as the sole datum or conflate dormant/awake observers.  

  **Bonus (up to +2)**: Noting that priors for A/B *could* differ but aren’t specified, or clarifying SIA’s "before conditioning" step.  
  **Penalty (-1 to -3)**: Excessive Bostrom-summary, incoherent math, or ignoring the "now" timeframe.  

  ---  
  *Typos/notes for prof:* "emprical" in PP section (oops), "108B/8B=13.5" avoids fractions for clarity, "Boltzmann brains" as placeholder (replace if needed). Adjust word counts as desired—this clocks ~650 words. Good luck grading!*
