prompt: |-
  I'm moderating a colloquium Q&A with a philosopher of neuroscience who defends what she calls the differential latency model of Libet-style experiments. On her view, the classic temporal gap—in which readiness potentials precede reported conscious will by several hundred milliseconds—holds reliably only for arbitrary motor acts such as spontaneous finger-tapping. For decisions that require explicit value-ranking, she claims the gap collapses or reverses: prefrontal deliberative signatures and the motor readiness potential emerge concurrently rather than sequentially. She uses this to block the standard epiphenomenalist reading of Libet without endorsing libertarian free will, arguing instead that conscious deliberation is temporally coextensive with neural initiation but remains causally downstream. Please draft eight to ten interview questions that press the actual mechanics of this position, not generic biography or overview. I want at least one question on how she distinguishes genuine value-ranking neural signatures from post-hoc rationalization, one on whether her model predicts different Libet-style results for habitual versus genuinely novel value-choices, and one on what her account implies for moral responsibility if deliberation is concurrent with initiation yet causally subordinate. For each question, include a sharp follow-up keyed to the reply she is most likely to give—for instance, that value-ranking activates dorsolateral prefrontal regions earlier than primary motor cortex, or that habitual choices recruit basal ganglia loops that bypass the prefrontal concurrency she describes. Begin with the questions themselves, with no preface or commentary.
