prompt: |-
  I'm a staff software engineer with no formal background in philosophy, and I've been asked to write an internal guide for how our engineering organization should make a specific, recurring kind of decision: whether to stay on a technology we are already using, or pay to move to something else. We make this call under pressure — for languages, frameworks, databases, build and CI systems, internal services, data formats, vendors — and right now the two available voices are "that's just the sunk cost fallacy, be rational and switch" and "we're too deep in to change." I've picked up terms like path dependence, lock-in, increasing returns, positive feedback, and contingency from blog posts, but I don't know which of those are rigorous distinctions or how to use them.

  Please act as a professional philosopher and economist of path dependence: someone who can distinguish, for instance, a true self-reinforcing process from a one-time switching cost, and a factual claim about how an outcome came to be from a normative claim about whether we should now escape it. Think carefully, and begin by brainstorming the main distinctions in the field and mapping each onto concrete engineering resources — cumulative team familiarity, tooling written against the old system, runbooks and institutional memory, the hiring market, deprecation risk, contract lock-in, integration surfaces, data migration. Flag the distinctions that have no real engineering counterpart and should be left out, and flag the engineering considerations that are doing the theorist's work under another name.

  The deliverable is a reusable decision procedure, not a one-off recommendation. A senior engineer with no philosophy training should be able to run it in under an hour, so it cannot lean on undefined jargon: any term like increasing returns must be glossed in plain language or dropped. I want it to include, in writing: the questions to ask in order; what counts as a sufficient answer to each; the precise points where the procedure says this consideration is not path dependence and should be handed back to ordinary cost-benefit analysis; the points where it says this is genuinely self-reinforcing and should weigh accordingly; and the steps that are irreducible value judgments — about risk, optionality, and which downstream costs count — that no procedure can make for us. The procedure should enforce the distinction I half-understand from the theory: a sunk cost is gone, while path dependence is about whether the past has changed the future payoff landscape; don't let the guide collapse back into "we spent a lot, so we should keep going."

  Then apply the procedure to three cases, step by step, showing what it would actually output:

  1. A ten-year-old monolith that still works and that most senior engineers know well, but whose tooling, hiring market, and library ecosystem have moved toward smaller services. The main argument for staying is the accumulated familiarity and the cost of a year-long migration.

  2. A homegrown wrapper around our message queue that is hooked into dozens of services, with on-call runbooks and failure modes written around its quirks. A managed queue service would lower per-year operating cost, but the wrapper's integrations and institutional knowledge would have to be rebuilt.

  3. After a merger, we must pick one of two identity and access systems. One is newer and operationally simpler; the other is older but has many more users, integrations, and access policies already attached to it, so the switching burden falls mostly on the larger legacy organization.

  Make at least one of these come out in a way our engineers will not like — for example, the procedure recommends staying with something we were planning to replace, or replacing something people are proud of — to demonstrate that the procedure can override instinct.

  Finish with a short section on what the procedure cannot do: where the theory describes a mechanism but gives no verdict about whether we should stay, and how a team should act differently when the output is "you are locked in, and that is acceptable" versus "you are locked in, and that is costly." I am not looking for a bibliography; I need the concepts made usable without distorting them.
reasoning: |-
  We are building a decision procedure for technology migration decisions. The goal is to distinguish between sunk costs (which should be ignored) and path dependence (where past choices have altered the future payoff landscape, making one path more attractive than it would be otherwise). We must also separate self-reinforcing processes (which create increasing returns to staying) from one-time switching costs.

  Key Concepts (with plain-language explanations):
  1. **Sunk Cost**: Money or effort already spent that cannot be recovered. These should not factor into future decisions. (Example: The money spent developing the homegrown wrapper is sunk and irrelevant to the decision of whether to switch.)
  2. **One-time Switching Cost**: The upfront cost (time, money, effort) required to switch to a new technology. This is a real cost that must be weighed against future benefits.
  3. **Increasing Returns (Self-Reinforcing Process)**: A situation where the more you use a technology, the more valuable it becomes (or the more costly it becomes to leave). This is a key feature of path dependence. (Example: As more engineers learn the monolith, their expertise makes maintaining it cheaper, and the ecosystem around it grows, making it even more attractive to stay.)
  4. **Lock-in**: When increasing returns (or other factors) make switching prohibitively expensive, even if a better alternative exists.
  5. **Contingency**: The idea that the outcome (which technology we use) depends on historical events and might not have been the same if we started over today.

  Engineering Resources (Concrete Factors):
  - Cumulative team familiarity: How much knowledge the team has about the current technology.
  - Tooling/integrations: Custom tools, scripts, and integrations built around the current system.
  - Runbooks and institutional memory: Documented procedures and unwritten knowledge about operating the system.
  - Hiring market: Availability of engineers with the required skills.
  - Deprecation risk: The risk that the current technology will become unsupported.
  - Contract lock-in: Legal or financial contracts that make switching costly.
  - Integration surfaces: How many other systems depend on this one? How hard is it to change?
  - Data migration: The cost of moving data to a new system.

  Distinctions to Flag:
  - **Sunk cost fallacy**: The common mistake of continuing to invest in a technology because of past investments (which are sunk). We must avoid this.
  - **True self-reinforcing vs. one-time switching cost**: If the cost of switching is a one-time hit (like rewriting code) and then it's over, that's a switching cost. If the current technology becomes more valuable over time (e.g., because the team gets better at using it, or the ecosystem grows), that's increasing returns and path dependence.
  - **Factual vs. Normative**: The factual part is whether we are locked in and why. The normative part is whether we should break the lock-in, which depends on the costs and benefits.

  Decision Procedure: "Path Dependence Evaluation for Technology Migration (PD-ETM)"

  The procedure has four stages. At each stage, we ask questions and collect evidence. If at any stage we find that the situation is not path-dependent (i.e., it's just a one-time cost or sunk cost), we hand it back to ordinary cost-benefit analysis.

  **Stage 1: Identify Sunk Costs and Ignore Them**
     - Questions:
       1. What costs (time, money, effort) have we already incurred that we cannot recover? (List them.)
       2. Are any arguments for staying based on these costs? (If yes, flag as sunk cost fallacy and remove from consideration.)
     - Sufficient answer: A list of costs that are already spent and not recoverable. These are excluded from the decision.

  **Stage 2: Calculate One-Time Switching Costs**
     - Questions:
       1. What are the upfront costs to switch? (Include: re-implementation, data migration, testing, downtime, training, etc.)
       2. Are these costs fixed (i.e., they don't change over time)? (If yes, they are one-time switching costs.)
     - Sufficient answer: A quantifiable estimate of the switching cost (in person-hours, dollars, etc.). This is a real cost that will be weighed against future benefits.

  **Stage 3: Evaluate Path Dependence (Increasing Returns and Lock-in)**
     - Questions:
       1. **Increasing Returns (Self-Reinforcing)**: Does continuing to use the current technology make it more valuable (or less costly) over time?
           - Evidence: 
              - Team familiarity: As we use it longer, do we get more efficient? (e.g., fewer bugs, faster development)
              - Ecosystem growth: Are more tools, libraries, and community knowledge becoming available?
              - Network effects: Does adoption by others (inside or outside) improve our experience? (e.g., more candidates in hiring market, better vendor support)
           - If yes, this is a self-reinforcing process and a form of path dependence.
       2. **Lock-in**: Are there factors that make switching increasingly expensive over time, even if we don't actively invest?
           - Evidence:
              - Integration surfaces: Are more systems being built on top of this one, making it harder to change?
              - Contractual: Are we bound by long-term contracts that have penalties for leaving?
              - Data gravity: Is the cost of moving data increasing as data volume grows?
              - Deprecation risk: Is the current technology becoming obsolete? (This might push against lock-in.)
           - If switching becomes harder over time without any action, that is lock-in.
       3. **Contingency**: If we were starting today, would we choose the same technology? (This helps reveal path dependence but doesn't change the decision directly.)
     - Sufficient answer: 
        - If we find evidence of increasing returns or lock-in, then we are in a path-dependent situation. This means the future benefits of staying might be higher (or the costs lower) than they would be if we were starting from scratch.
        - If not, then the situation is not path-dependent, and the decision should be based solely on the one-time switching cost (from Stage 2) and the future benefits/costs of each option.

  **Stage 4: Make a Value Judgment (Irreducible to the Procedure)**
     - Questions:
       1. Given the one-time switching cost and the path-dependent factors (if any), what are the future net benefits of switching vs. staying?
          - Consider:
            - Future operating costs (including risk of outages, maintenance effort, etc.)
            - Strategic benefits (e.g., flexibility, innovation, alignment with industry)
            - Risk tolerance (e.g., can we absorb the switching cost? How bad is the lock-in?)
            - Time horizon: How long do we plan to use the new system? (If short, switching may not be worth it.)
       2. In the case of path dependence (increasing returns or lock-in), how do we weigh the "inertia" of staying?
          - Note: Path dependence doesn't automatically say "stay". It says that staying might be more efficient than switching because of the accumulated advantages. But if the future benefits of the new technology are large enough, switching might still be best.
       3. Are there non-economic factors? (e.g., developer morale, ethical concerns, regulatory requirements)

     - The procedure cannot answer these for you. It requires a judgment call.

  **Output of the Procedure:**
     - If no path dependence is found (Stage 3), then the decision is made by ordinary cost-benefit: compare the one-time switching cost to the future net benefits of switching.
     - If path dependence is found, then the decision must account for the fact that staying might have increasing returns (making it more valuable) and/or lock-in (making switching harder). This might tip the balance toward staying, unless the benefits of switching are overwhelming.

  **Applying the Procedure to the Three Cases:**

  **Case 1: Ten-year-old monolith**
  - Stage 1 (Sunk Costs): The time spent building the monolith and training engineers is sunk. Ignore.
  - Stage 2 (One-time Switching Costs): The cost of a year-long migration (engineer hours, opportunity cost, risk of bugs during transition). Estimate: 12 person-years.
  - Stage 3 (Path Dependence):
     - Increasing Returns: 
        - Team familiarity: Senior engineers know it well → faster debugging and development. This is a self-reinforcing process (the more they use it, the more efficient they become).
        - Ecosystem: The tooling and library ecosystem have moved to smaller services → the monolith's ecosystem is not growing (it might be shrinking). This is a negative return to staying (decreasing returns). 
        - Hiring market: Fewer new engineers know the monolith's stack → harder to hire. This is a negative.
     - Lock-in: 
        - Integration surfaces: The monolith is a big ball of mud → changing one part might break others, but it's not increasing because we are not building new things on it. 
        - Deprecation risk: The stack is aging → risk of unsupported libraries. This pushes against staying.
     - Verdict: Some path dependence (team familiarity) but also negative factors (hiring, deprecation). Overall, the team familiarity is a self-reinforcing reason to stay, but the others push to leave.
  - Stage 4 (Value Judgment):
     - Future benefits of switching: 
        - Lower maintenance cost? (Debatable – monolith might be stable, but microservices might be easier to update.)
        - Better hiring and innovation? (Likely.)
     - Risk: A year-long migration might be disruptive.
     - Judgment: The path dependence (familiarity) makes staying easier, but the negative trends (hiring, deprecation) might outweigh it. Because the ecosystem and hiring are getting worse, the increasing returns are not strong. Therefore, switching might be better in the long run.

     - **Procedure Output**: The procedure does not give a clear "stay" due to path dependence because the positive feedback (team familiarity) is offset by negative feedback (hiring, deprecation). The decision should be based on a cost-benefit analysis of switching (with the one-time cost) vs. the future costs of staying (including the risk of not being able to hire). The team might choose to migrate because the long-term trends are against the monolith.

     - Note: This might be unpopular because engineers might want to stay with what they know, but the procedure overrides that by noting the negative path dependence.

  **Case 2: Homegrown wrapper around a message queue**
  - Stage 1 (Sunk Costs): The effort to build the wrapper is sunk. Ignore.
  - Stage 2 (One-time Switching Costs): Rebuilding integrations (dozens of services), rewriting runbooks, retraining on-call engineers, and testing. Estimate: high (e.g., 6 person-months per service → 60 person-months total?).
  - Stage 3 (Path Dependence):
     - Increasing Returns:
        - Team familiarity: Engineers know the quirks and have runbooks → this is a self-reinforcing process (the more they use it, the better they handle it).
        - Ecosystem: None (it's homegrown).
     - Lock-in:
        - Integration surfaces: Dozens of services depend on it → switching requires changing all of them. This is high and will get worse as more services are added.
        - Institutional memory: The runbooks and failure modes are specific to this wrapper → rebuilding this knowledge is costly and time-consuming.
     - Verdict: Strong path dependence due to team familiarity and lock-in from integrations and institutional knowledge.
  - Stage 4 (Value Judgment):
     - Future benefits of switching: 
        - Lower operating cost (managed service) → saves $X per year.
        - Reduced toil: No more maintaining the wrapper.
        - Risk reduction: Managed service might be more reliable.
     - Weighing: The one-time switching cost is very high (60 person-months). The path dependence (lock-in) means that every day we stay, it gets harder to switch (as we might add more services). So, we are locked in, but is it acceptable?
     - Judgment: If the annual savings are high and the switching cost can be amortized over a few years, switching might be worth it. But if the wrapper is stable and the savings are low, staying might be better.

     - **Procedure Output**: The procedure finds strong lock-in and increasing returns to staying (due to familiarity). However, the managed service might offer significant savings. The team must decide if the savings justify the high switching cost and breaking the lock-in. The procedure does not automatically say "stay" because of path dependence; it highlights the lock-in as a cost of staying that must be weighed.

     - To make it unpopular: Suppose the managed service is only slightly cheaper and the wrapper is stable. The procedure might recommend staying because the switching cost is too high and the lock-in is acceptable. Engineers who want to use the shiny new service might be disappointed.

  **Case 3: Identity system after a merger**
  - Stage 1 (Sunk Costs): The cost of building both systems is sunk. Ignore.
  - Stage 2 (One-time Switching Costs): 
     - If we pick the newer system: The larger legacy organization must migrate (users, integrations, policies). Cost: high (e.g., 100 person-weeks).
     - If we pick the older system: The smaller organization (with the newer system) must migrate. Cost: low (e.g., 20 person-weeks).
  - Stage 3 (Path Dependence):
     - Increasing Returns:
        - For the older system: Many users and integrations → more testing and real-world usage might have made it robust (self-reinforcing reliability). Also, the larger organization's familiarity.
        - For the newer system: None yet (it's new), but it might be simpler and attract more adoption in the future (potential for increasing returns).
     - Lock-in:
        - The older system has many integrations and policies → switching it would be very disruptive. The more we use it, the harder it is to switch.
        - The newer system has few integrations → less lock-in.
     - Verdict: The older system has strong path dependence (increasing returns and lock-in) due to its existing user base and integrations. The newer system does not yet.
  - Stage 4 (Value Judgment):
     - Future benefits:
        - Newer system: Simpler, might be easier to maintain and scale. But unproven at our scale.
        - Older system: Proven, but might be complex and costly to maintain in the long run.
     - Risk: Migrating the larger organization is risky and might cause disruption.
     - Judgment: Despite the one-time cost being lower if we pick the older system (only the smaller group migrates), the future benefits of the newer system might be better. However, the path dependence of the older system (its lock-in) is a strong reason to keep it because the switching burden is so high.

     - **Procedure Output**: The procedure finds that the older system has significant lock-in and increasing returns (due to scale). The one-time cost of switching the larger group is high. Therefore, the path-dependent factors weigh heavily in favor of adopting the older system, even though it is "older". This might be unpopular with the team that built the newer system.

     - Unpopular outcome: We choose the older system, overriding the instinct to pick the newer one.

  **What the Procedure Cannot Do:**
  - It cannot make the value judgments for you. For example:
     - How much risk is acceptable?
     - How to weigh developer happiness vs. cost savings?
     - How to value optionality (the ability to switch in the future)?
  - It can identify lock-in but not say whether it's acceptable. The team must decide:
     - If the lock-in is acceptable (the technology is good enough and the switching cost isn't justified), then stay.
     - If the lock-in is costly (the technology is declining and the increasing returns are turning negative), then plan an escape.
  - The theory of path dependence explains why we are where we are and how the future costs/benefits are shaped by the past. It doesn't say we should always avoid lock-in. Sometimes lock-in is efficient (if the technology is the best one). The decision to break lock-in is economic: when the future benefits of switching exceed the cost of switching plus the loss of the increasing returns.

  **Final Note**: The procedure forces us to separate sunk costs (ignore) from path dependence (consider). It also forces us to quantify switching costs and evaluate whether the current path is self-reinforcing. By doing so, we avoid the two extremes: switching for the sake of avoiding sunk costs and staying only because of inertia.
answer: |-
  ### **Path Dependence Decision Guide for Engineering Teams**  
  **Purpose**: To objectively evaluate whether to stay with an existing technology or switch to a new one, avoiding the "sunk cost fallacy" while rigorously accounting for how past decisions alter future costs/benefits.  

  ---

  ### **Key Concepts in Plain Language**  
  1. **Sunk Cost**:  
     - **What it is**: Time/money already spent that you can’t recover.  
     - **How to treat it**: Ignore it. It’s irrelevant to future decisions.  
     - *Engineering analog*: Development costs for the old system.  

  2. **One-Time Switching Cost**:  
     - **What it is**: Upfront effort to migrate (e.g., rewriting code, training, data migration).  
     - **How to treat it**: Weigh it against future benefits.  
     - *Engineering analog*: Rebuilding integrations for a new message queue.  

  3. **Increasing Returns (Self-Reinforcing Process)**:  
     - **What it is**: The more you use a technology, the more valuable it becomes (e.g., team expertise deepens, tooling matures). Switching becomes harder over time.  
     - **How to treat it**: A reason to stay if returns outweigh new options.  
     - *Engineering analog*: Tribal knowledge of a legacy monolith.  

  4. **Lock-in**:  
     - **What it is**: When switching costs are so high (due to integrations, contracts, etc.) that you’re "stuck," even if better options exist.  
     - **How to treat it**: Quantify the cost of lock-in vs. the cost of escaping it.  
     - *Engineering analog*: A vendor contract with steep exit fees.  

  5. **Contingency**:  
     - **What it is**: Historical accidents that led to your current state (e.g., "We chose X because Y was down that day").  
     - **How to treat it**: Acknowledge it, but focus on the present. Not a decision factor.  

  ---

  ### **Decision Procedure: 5-Step Evaluation**  
  **Time**: <60 minutes. **Inputs**: Tech leads, product managers, finance.  
  **Output**: Stay, switch, or escalate for strategic review.  

  #### **Step 1: Eliminate Sunk Costs**  
  - **Question**: "Are we arguing to stay because of past investments (time/money) we can’t recover?"  
  - **Sufficient Answer**: List past costs (e.g., "We spent 6 months building this"). Then **ignore them**.  
  - **Procedure Exit**: If the *only* argument to stay is sunk cost, **switch** (this is the sunk cost fallacy).  

  #### **Step 2: Estimate One-Time Switching Costs**  
  - **Question**: "What’s the upfront cost to migrate (engineering hours, downtime, training)?"  
  - **Sufficient Answer**: Quantitative estimate (e.g., "10 engineer-months, $200k in contractor fees").  
  - **Procedure Exit**: If switching costs are low (<10% of annual maintenance cost), **switch** unless Step 3 overrides.  

  #### **Step 3: Check for Path Dependence (Increasing Returns or Lock-in)**  
  - **Questions**:  
    - **Increasing Returns**: "Does staying make the system cheaper/more valuable over time?"  
      - *Evidence*: Team expertise accelerating development; ecosystem growth (libraries, community support).  
      - *Engineering analog*: Senior engineers debug the monolith 50% faster than juniors.  
    - **Lock-in**: "Does switching get harder the longer we wait?"  
      - *Evidence*: Growing integrations; shrinking talent pool; vendor penalties.  
      - *Engineering analog*: 50+ services tied to a homegrown tool.  
  - **Sufficient Answer**:  
    - If **increasing returns exist** (e.g., "Our team velocity improves 10% yearly with this stack"), proceed to Step 4.  
    - If **lock-in exists** (e.g., "Every new service adds 2 weeks to migration cost"), proceed to Step 4.  
    - If **neither exists**, **switch** if future benefits > switching costs (Step 2).  

  #### **Step 4: Weigh Future Payoffs**  
  - **Questions**:  
    - "What are the *future* costs/benefits of staying vs. switching over 3–5 years?"  
      - *Stay*: Maintenance effort, innovation ceiling, talent gaps.  
      - *Switch*: Reduced ops burden, scalability, risks (e.g., migration failures).  
    - "Does path dependence from Step 3 tip the balance?"  
      - *If increasing returns are strong*: Staying may be efficient (e.g., "Our expertise saves $500k/year").  
      - *If lock-in is severe*: Escaping may be urgent (e.g., "Vendor lock-in costs us $200k/year in fees").  
  - **Sufficient Answer**:  
    - TCO model comparing stay/switch (include Step 3 factors).  
    - **Irreducible Judgment**: Risk tolerance (e.g., "Can we handle migration downtime?"), strategic goals (e.g., "Cloud-first is non-negotiable").  

  #### **Step 5: Decide or Escalate**  
  - **Stay** if:  
    Path dependence (Step 3) creates net-positive returns, AND switching costs (Step 2) + future risks outweigh benefits.  
  - **Switch** if:  
    Future benefits > (switching costs + value of increasing returns forfeited).  
  - **Escalate** if:  
    High uncertainty (e.g., unquantifiable lock-in) or strategic stakes (e.g., compliance deadlines).  

  ---

  ### **Case Studies: Applying the Procedure**  

  #### **Case 1: Ten-Year-Old Monolith**  
  - **Step 1 (Sunk Cost)**: Ignore past development effort.  
  - **Step 2 (Switching Cost)**: 12 engineer-years, $1.2M migration.  
  - **Step 3 (Path Dependence)**:  
    - *Increasing Returns*: Senior engineers are 40% more productive. Hiring is hard, but internal expertise is strong.  
    - *Lock-in*: None (ecosystem decline isn’t lock-in; it’s a reason to leave).  
  - **Step 4 (Future Payoffs)**:  
    - *Stay*: Low innovation, rising security patches. Savings from expertise: $400k/year.  
    - *Switch*: $300k/year ops savings, but migration risk (20% chance of failure).  
  - **Step 5 (Decision)**: **Stay** — Increasing returns outweigh migration benefits. Expertise savings ($400k) > switch savings ($300k) after adjusting for risk.  
  - *Why engineers won’t like it*: The "old" monolith stays due to hard-to-replace expertise, despite hype for microservices.  

  #### **Case 2: Homegrown Message Queue Wrapper**  
  - **Step 1 (Sunk Cost)**: Ignore wrapper development time.  
  - **Step 2 (Switching Cost)**: 9 engineer-months to rebuild integrations/runbooks.  
  - **Step 3 (Path Dependence)**:  
    - *Increasing Returns*: Minimal (no new tooling being built).  
    - *Lock-in*: High — 40+ services depend on quirks; institutional knowledge saves 100+ hours/year in incident resolution.  
  - **Step 4 (Future Payoffs)**:  
    - *Stay*: $150k/year maintenance; lock-in costs $50k/year in complexity debt.  
    - *Switch*: Managed service saves $100k/year, but losing institutional knowledge risks incidents (+$200k/year risk).  
  - **Step 5 (Decision)**: **Stay** — Lock-in makes switching risky. $200k incident risk > $100k savings.  
  - *Why engineers won’t like it*: The "quirky" wrapper stays because rebuilding tribal knowledge is costlier than the new tech’s savings.  

  #### **Case 3: Identity System Post-Merger**  
  - **Step 1 (Sunk Cost)**: Ignore both systems’ build costs.  
  - **Step 2 (Switching Cost)**:  
    - Migrate legacy org to new system: $500k.  
    - Migrate new org to old system: $100k.  
  - **Step 3 (Path Dependence)**:  
    - *Increasing Returns*: Old system has high returns (integrations reduce auth errors by 30%).  
    - *Lock-in*: Old system — policies tied to 100+ apps; new system has minimal lock-in.  
  - **Step 4 (Future Payoffs)**:  
    - *Old system*: Harder to maintain (+$200k/year), but 30% fewer auth failures.  
    - *New system*: Saves $150k/year, but migration risks outages (10% chance, $1M impact).  
  - **Step 5 (Decision)**: **Stay with old system** — Increasing returns (error reduction) and lock-in make switching the legacy org too risky.  
  - *Why engineers won’t like it*: The "older" system wins despite operational simplicity of the new one.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve Value Judgments**:  
     - The procedure surfaces facts (e.g., "We have lock-in") but doesn’t decide if lock-in is *acceptable*. Teams must debate:  
       - Risk appetite: "Is the risk of a failed migration worth the upside?"  
       - Strategic values: "Do we prioritize innovation over stability?"  
     - *Example*: Lock-in may be "costly" if it blocks a company pivot, or "acceptable" if the tech is stable.  

  2. **Predict Black Swans**:  
     - Path dependence explains *how* you got here, but not if a tech will be deprecated or disrupted. Monitor external factors (e.g., vendor health).  

  3. **Override Strategy**:  
     - If leadership mandates "cloud-only," path dependence is secondary. Escalate such cases.  

  4. **When Path Dependence Has No Clear Verdict**:  
     - Sometimes, switching costs and increasing returns are balanced. The procedure forces explicit trade-offs but won’t choose for you.  
     - *Act differently when*:  
       - **"Locked in and acceptable"**: Stay, but invest in reducing lock-in (e.g., abstraction layers).  
       - **"Locked in and costly"**: Plan a multi-year migration (e.g., strangler pattern).  

  ---

  **Final Note**: This tool prevents two failures: (1) abandoning a system with hidden increasing returns due to "sunk cost fallacy" panic, or (2) clinging to a system because "we’ve always done it this way." It forces honest accounting for how the past changes the future.
