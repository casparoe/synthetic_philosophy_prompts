prompt: |-
  Write a joke that turns on Quine's naturalist account of moral values within his holistic web-of-belief epistemology. The joke should hinge on the specific structural position Quine assigns to ethics: moral judgments sit far out on the periphery of the web, technically revisable like any other belief but so remote from the sensory core that overturning them requires adjusting almost no empirical science, even though doing so feels existentially catastrophic. The punchline should make this tension explicit—perhaps by comparing the revision of a moral claim to an epistemic home renovation that changes nothing in the foundation but renders the house unlivable—so that someone familiar with Quine's distinction between central and peripheral beliefs recognizes the mechanics of the joke rather than seeing a generic philosophers-think-everything-is-relative gag. Do not ask for citations, and avoid attributing specific verbatim formulations to Quine.
