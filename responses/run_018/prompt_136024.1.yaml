          45-75 min: Debrief (30 minutes).

     Debrief Structure:

          - Reveal the profiles of each cell.

          - Ask each cell to share the actions they chose for the scenarios and their principle.

          - Show the treaty and which rules passed.

          - Discuss: 
              - Why did you choose the actions you did in your cell?
              - How did your principle guide you?
              - What happened in the negotiation? Which rules were hard to agree on? Why?
