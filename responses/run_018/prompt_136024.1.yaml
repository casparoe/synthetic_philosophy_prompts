answer: |-
  ### **In-Class Activity: "Rules of Engagement Negotiation"**  
  **Goal:** Immerse students in the tension between the moral equality of combatants and epistemic constraints (what soldiers can reasonably know about their command's reliability) through role-play and negotiation.  

  ---

  ### **Materials**  
  - **Profile Cards (4 total, one per cell):**  
    - Cell 1: **Just Cause + High Reliability**  
      *"Your nation is defending against unprovoked aggression. Command intelligence is consistently accurate and transparent."*  
    - Cell 2: **Just Cause + Low Reliability**  
      *"Your nation is resisting invasion, but command has a history of misreporting intel and covering up errors."*  
    - Cell 3: **Unjust Cause + High Reliability**  
      *"Your nation initiated this war for economic gain (disguised as 'preemptive defense'). Command intelligence is highly reliable."*  
    - Cell 4: **Unjust Cause + Low Reliability**  
      *"Your nation invaded for resources under false pretenses. Command regularly lies and manipulates intel."*  
  - **Scenario Cards (3 total, same for all cells):**  
    - Scenario A: *"Enemy soldiers are transporting suspected weapons near a hospital. Civilian presence is likely."*  
    - Scenario B: *"Enemy soldiers are dug into a school. Intel claims they are stockpiling explosives."*  
    - Scenario C: *"Enemy soldiers are retreating across a bridge. Intel says they will regroup to attack."*  
  - **Action Tokens (per cell):** 3 red (direct strike), 3 yellow (warn/shield), 3 green (stand-down).  
  - **Points:** Each cell gets 10 "Operational Points" (OP) and 10 "Moral Points" (MP) on paper.  
  - **Timer**  
  - **Treaty Draft Sheet**  

  ---

  ### **Rules & Stakes**  
  **1. Intra-Cell Decision Rounds (15 mins):**  
  - For each scenario, cells **vote secretly** on an action:  
    - **Direct Strike** (red token): High operational gain, high moral risk.  
    - **Warn/Shield** (yellow token): Moderate operational gain, moderate moral risk (e.g., issue warnings, use non-lethal measures).  
    - **Stand-Down** (green token): Low operational gain, low moral risk.  
  - After voting, they **allocate points** between OP (success) and MP (risk):  
    - Total points allocated per scenario must sum to 10 (e.g., 7 OP + 3 MP).  
    - **Scoring Incentive:** Groups earn 1 bonus point per round if their OP/MP split is consistent *across all 3 scenarios* (e.g., always prioritizing OP over MP).  

  **2. Treaty Negotiation (20 mins):**  
  - Cells draft **one unified rule** per scenario (e.g., "In Scenario A, always Warn/Shield").  
  - **Veto Power:** Any cell can veto a rule *that applies to their cell’s profile*. Vetoes cost 2 OP (penalizes obstruction).  
  - **Stakes:**  
    - If a rule passes, all cells gain 3 OP.  
    - Vetoed rules grant 0 OP.  
    - Groups lose 1 MP for every rule where they vote *against their intra-cell choice* (penalizes inconsistency).  

  **3. Physical Stakes:**  
  - Tokens force discrete choices.  
  - OP/MP allocations are written publicly.  
  - Point deductions are tangible (e.g., crossing out numbers on paper).  

  ---

  ### **Predicted Tensions & Facilitation**  
  **What Will Go Wrong (and How to Handle It):**  
  - **Unjust/High-Reliability Cell (Cell 3) Dominates:**  
    - *Why:* They trust their command, push aggressive rules (direct strikes), and may bully others.  
    - **Facilitator Response:**  
      - Remind cells of veto costs ("Losing 2 OP hurts your mission").  
      - Privately prompt Cell 2/4: "Does this rule account for your command’s reliability?"  
      - **DO NOT** intervene overtly—let dominance highlight epistemic arrogance.  

  - **Low-Reliability Cells (2 & 4) Veto Excessively:**  
    - *Why:* Distrust makes them risk-averse, leading to deadlock.  
    - **Facilitator Response:**  
      - Highlight trade-offs: "Vetoes protect your MP but cost OP. Is stand-down always viable?"  
      - Ask: "Could a rule work if *all* cells shared the same intel reliability?"  

  - **Cross-Cell Agreement Without Justification:**  
    - *Penalty:* If two cells back the same rule *without citing epistemic limits*, deduct 1 MP from both.  
    - **Example:** Cell 1 and Cell 3 agree on "direct strikes in Scenario B" *without* mentioning reliability.  

  ---

  ### **Debrief Structure (20 mins)**  
  **Step 1: Map Activity to Moral Equality of Combatants (MEC)**  
  - Reveal profiles. Chart each cell’s choices:  
    | Cell | Cause | Reliability | Scenarios (A/B/C) | OP/MP Pattern |  
    |---|---|---|---|---|  
    | 1 | Just | High | Likely aggressive | High OP, low MP |  
    | 3 | Unjust | High | **Aggressive (problematic!)** | High OP, low MP |  
    | 2/4 | Just/Unjust | Low | Defensive | Low OP, high MP |  
  - **Key Tension:** "Cell 3 (unjust/high-reliability) acted like Cell 1 (just/high). Should their *epistemic position* shield them from moral liability?"  

  **Step 2: Why MEC "Wobbles" with Epistemic Partitioning**  
  - **Activity Limits:** Students set *rules for harming others*, but MEC claims liability is **cause-independent**. The exercise *cannot* simulate the abstract norm that *being an unjust soldier makes you liable* regardless of belief.  
  - **Instructor Note:**  
    > "In the treaty, you debated when soldiers *deserve* harm based on their knowledge. But MEC says: *All* soldiers are liable merely for fighting. Your negotiation exposed how real-world epistemic constraints—like unreliable intel—make this feel unfair."  

  **Step 3: Supply the Abstract Norm**  
  - **Post-Activity Lecture Snippet:**  
    - "MEC holds that a soldier’s liability hinges *only* on their role as a combatant, not their cause or beliefs (McMahan, Walzer). Today, you saw how injecting epistemic constraints—what soldiers *can reasonably know*—challenges this. Should a soldier with trustworthy command but an unjust cause (Cell 3) be *less liable* than one with unreliable command and a just cause (Cell 2)?"  
  - **Discussion Prompts:**  
    - "If liability depends on reasonable belief, does that excuse Cell 3? Or does MEC’s cause-independence override this?"  
    - "How does ‘epistemic partitioning’—where armies operate in information bubbles—complicate reciprocity in war?"  

  ---

  ### **Why This Works**  
  - **Stakes Feel Real:** Tokens/points create pressure. Veto costs force trade-offs.  
  - **Tension Emerges Organically:** Unjust/high-reliability cells dominate; low-reliability cells resist. Students *feel* the epistemic rift before labeling it.  
  - **Clean Debrief:** Profiles scaffold the MEC critique. The abstract norm is clarified *after* experiential learning.  
  - **Runs on Paper/Pens:** No tech needed.  

  **Final Tip:** If time runs short, skip intra-cell point bonuses. Focus on the treaty clash—it’s where epistemic partitioning screams loudest.
