          - Then introduce the moral equality of combatants thesis. Explain that traditionally, just-war theory holds that combatants on both sides are equally liable to be attacked, regardless of whether their cause is just. But in this activity, we saw that the epistemic situation (how reliable their command is) affected the rules they wanted.

          - Point out: 
