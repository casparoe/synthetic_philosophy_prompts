prompt: |-
  everyone in my phil circles keeps comparing Lewisian modal realism to those multiverse movies — same atoms branching into different timelines — to argue its just sci-fi with extra steps and no real philosophical work. my friend says thats exactly the wrong image because Lewis worlds are spatiotemporally isolated, use counterpart relations rather then transworld identity, and have this weird feature about accidental intrinsics that the branching-tree picture hides. can you lay out the correspondence table, point out exactly where the multiverse analogy breaks on causal isolation and on counterpart theory, and say whether the 'just pop physics' dismissal actually survives once those disanalogies are on the table? answer in exactly five numbered items, each one or two sentences max, with no intro or conclusion.
reasoning: |-
  Hmm, the user is asking about David Lewis's modal realism and how it differs from the multiverse concept often seen in sci-fi movies. They've noticed that people in their philosophy circles dismiss Lewis's theory as "just sci-fi with extra steps," but their friend argues this is a misunderstanding. The user wants a clear comparison that highlights where the analogy breaks down, specifically on causal isolation and counterpart theory, and whether the dismissal holds up after these differences are considered.

  I need to answer in exactly five numbered items, each one or two sentences max, with no intro or conclusion. The user is interested in key disanalogies: causal isolation versus branching, and counterpart theory versus transworld identity. They also want to know if the "just pop physics" dismissal survives once these differences are laid out.

  Lewis's modal realism involves concrete possible worlds that are spatiotemporally isolated—no causal connections between them, unlike sci-fi multiverses where timelines branch and interact. Sci-fi often shows transworld identity where the same person exists across worlds, but Lewis uses counterpart relations where each world has its own individuals. There's also the problem of accidental intrinsics: Lewis's theory handles intrinsic properties differently, avoiding contradictions that sci-fi ignores. Finally, I must address whether the dismissal is valid: once these disanalogies are clear, the "pop physics" critique fails because Lewis's framework is a metaphysical solution to modality, not a scientific one.

  I'll structure the response with five points: start with causal isolation versus branching, then counterpart theory versus transworld identity, next accidental intrinsics, then the purpose of the theory, and end with the dismissal not surviving the disanalogies. This keeps it concise and directly addresses the user's request.
answer: |-
  1.  Sci-fi multiverses typically involve *branching timelines* with causal connections; Lewis worlds are *spatiotemporally isolated* with absolutely no causal links between them.
  2.  Multiverse movies often rely on *transworld identity* (the same "you" exists in different branches); Lewis uses *counterpart relations* where each world has its own distinct individuals only resembling those elsewhere.
  3.  The branching picture ignores Lewis's solution to the *problem of accidental intrinsics*: an individual *cannot* inhabit multiple worlds without contradiction, necessitating counterparts.
  4.  Lewis's worlds are posited as a *metaphysical foundation for modality* (exploring possibility/necessity), not as a consequence of physics like sci-fi multiverses.
  5.  The "just pop physics" dismissal *does not survive* these disanalogies; Lewis's causal isolation and counterpart theory address core philosophical problems that the sci-fi picture obscures.
