prompt: |-
  Hi — I write novels, and the one I'm working on right now keeps forcing me to work out what I actually think about everyday conventions, because half my scenes turn on a character either honouring or flouting one. I want someone to audit my position before I put a version of it in a character's mouth and get taken apart at a festival panel.

  Roughly where I've landed:

  (1) Queueing-type conventions are genuine moral obligations, not just etiquette. Pushing into a queue is *wrong*, not merely rude, because these are mutually beneficial coordination schemes and it's unfair to take the benefit while skipping the cost.

  (2) A visitor has to follow the local version specifically, not just any old version — "any consistent queue will do" is not good enough. Locals set the terms; I'm a guest.

  (3) Jaywalking is fine. Crossing against the light on an empty street isn't wrong at all, and I don't owe anybody anything for it. Traffic laws bind only when they're actually doing coordination work and someone is affected.

  (4) Tipping in the US is obligatory, and I think it's a different kind of thing from queueing: it isn't coordination, it's compensation for a wage structure that exploits servers. So I tip properly even in cities where the local tipping convention is weak or mean.

  (5) In places where tipping isn't the norm, I don't tip, and I dont think I do anything wrong — even though hospitality workers there are often badly paid too.

  (6) I won't follow a convention I think is morally bad (norms that rank people by caste, gender, age, whatever). Being a guest doesn't require that of me.

  (7) I also follow the local convention when it literally makes no difference to anybody — standing on the right of a completely empty escalator, in a country where that's the done thing. I'd feel like a jerk not to, even though nobody's affected and nobody's watching.

  Two scenes from the novel I keep testing these against. In the city it's set in, people hold a place in a queue by leaving an object in it — a shoe, a bag — and the locals insist a visitor has to honour the object the same as a person. And in that same city everybody crosses wherever they like, the drivers expect it, and it's against the law.

  What I want: go through the seven and tell me which pairs are really in tension and how badly, ordered by severity, with what would have to give in each case and what the cheapest repair would be. Tell me too which of the tensions only *look* like tensions and dissolve when you think about them properly — I've got a feeling at least one of these is fine as it stands, and I'd rather not throw away a commitment I don't have to. Please don't just flag all seven as problematic; I want to know which one I actually have to drop.

  And be clear about which bits of what you say are settled and which are genuinely contested among people who work on this sort of thing — don't present a contested view as if it were the consensus, say which claims you'd only give 60/40, and flag wether anything in your answer is more guess than argument.
reasoning: |-
  Okay, the user is a novelist working through moral philosophy about everyday conventions to inform their book. They've outlined seven positions and want an audit to identify tensions and inconsistencies. The goal is to refine these views before putting them in a character's mouth.

  First, I need to map their stated positions:
  - (1) Queues as moral obligations (fairness-based)
  - (2) Local convention supremacy (guest obligation)
  - (3) Jaywalking as permissible (harm principle)
  - (4) US tipping as obligatory (structural injustice response)
  - (5) No tipping where not normative (context dependency)
  - (6) Moral override of conventions (universal ethics)
  - (7) Symbolic compliance (convention internalization)

  The core tensions leap out immediately. Position 2's "local rules absolute" clashes with position 6's moral override - that's the biggest conflict. Also, position 4's US tipping obligation seems inconsistent with position 5's non-tipping elsewhere when the structural exploitation argument could apply globally. 

  For the escalator example (position 7), while it seems irrational, the psychological reality of feeling like a jerk for violating empty-convention actually aligns with how social norms function. That one's probably salvageable with a "constitutive convention" explanation. 

  The novel's queue-object scenario perfectly tests position 2. If the user accepts shoe-as-placeholder while rejecting caste norms via position 6, they need a principled distinction between morally neutral vs charged conventions. The jaywalking law violation in their fictional city is clever - it highlights how position 3 treats coordination norms differently from legalistic ones.

  Biggest philosophical pressure points:
  - Can "guest obligation" (position 2) withstand morally objectionable conventions? Probably not without position 6's override. 
  - Is the tipping inconsistency (4 vs 5) justifiable? Only if structural complicity differs by system, which is debatable.
  - The escalator case (7) reveals norm internalization - less a tension than an insight about social psychology.

  I'll structure the response by severity: start with the 2/6 collision as critical, then 4/5 as major but debatable, surface-level tensions like 1/3 as minor, and defend 7 as coherent. For each, I'll note where professional philosophers disagree (e.g. cultural relativism debates) and offer minimal repairs that preserve their core intuitions. The key is helping them refine without abandoning positions unnecessarily - especially since these tensions might actually enrich their novel's thematic complexity.
answer: |-
  Here's an audit of your 7 positions, analyzing tensions, severity, repairs, and dissolving false tensions. I'll follow your request strictly: ordered by severity of tension, flagging contested views, noting where positions dissolve, and avoiding unnecessary rejection of commitments.

  **Critical Tension (Severity: High - Requires Revision)**
  *   **Conflict:** **Position 2 (Local Convention Supremacy) vs. Position 6 (Moral Override)**
      *   **Nature:** This is the most fundamental tension. Position 2 states "Locals set the terms; I'm a guest," implying near-absolute deference to local coordination norms (like the shoe-in-queue). Position 6 states you *won't* follow a convention you deem morally bad (e.g., caste-based queueing), regardless of being a guest. These directly contradict when the local norm *is* deemed morally bad.
      *   **Why It's Bad:** You cannot simultaneously hold that guests *must* follow *any* local coordination norm *and* that they *must not* follow morally bad norms. The fictional shoe-queue norm tests this: if you deem it arbitrary/silly but *not* morally bad, Position 2 might hold. But if you encountered a caste-based queue (or even a norm where leaving a cheap shoe holds less priority than leaving an expensive bag), Position 6 kicks in, overriding Position 2. Your scene highlights this: insisting a visitor *must* honor the shoe is Position 2 logic.
      *   **Cheapest Repair:** **Modify Position 2.** Clarify its scope: "*Local conventions governing morally neutral coordination (like queueing order, escalator side) are binding on guests.*" This explicitly carves out space for Position 6 to override conventions involving morally significant categories (caste, gender) or fundamental injustices. Position 6 remains your core safeguard.
      *   **Philosopher Consensus?** **Highly Contested (60/40 in favor of override).** Debates rage between strong cultural relativism ("guest must defer") and universalist morality ("basic rights override local custom"). Most contemporary philosophers working on normativity and cross-cultural ethics lean towards some form of moral override (Position 6), rejecting *absolute* deference (Position 2). Your Position 6 is the less contested commitment here.

  **Major Tension (Severity: Medium - Requires Justification/Clarification)**
  *   **Conflict:** **Position 4 (US Tipping Obligatory) vs. Position 5 (No Tipping Where Not Normative)**
      *   **Nature:** You justify US tipping as compensating for exploitative wage structures. But you *don't* tip where it's not the norm, even if workers are "often badly paid too." The tension lies in the underlying principle: if the obligation stems from compensating exploitation *you benefit from*, why does it vanish just because the *local convention* doesn't exist? You're still benefiting from low wages.
      *   **Why It's Problematic:** Your reasoning for Position 4 is structural ("compensation for wage structure"). If low wages + your patronage create similar structural exploitation elsewhere (Position 5's admission), why isn't there *some* obligation? Position 5 relies heavily on the *convention itself* as the source of obligation, seemingly contradicting the structural rationale of Position 4.
      *   **Cheapest Repair:** **Refine the Basis for Position 4.** Distinguish between:
          1.  **Structural Complicity + Convention (US):** You are complicit *and* violating a crucial social norm *integral* to the worker's expected income. Not tipping actively harms them *in that system*.
          2.  **Structural Complicity *Without* Convention (Elsewhere):** While benefiting from low wages, tipping might be actively disruptive (confusing, embarrassing, seen as charity undermining dignity, or even getting the worker in trouble). Your action (tipping) isn't expected *or* necessarily beneficial within the existing structure. The obligation weakens significantly without the coordination/convention aspect.
      *   **Philosopher Consensus?** **Contested (No Clear Majority).** The ethics of tipping are messy. Some argue the structural injustice creates a universal duty to top up wages where low. Others argue the duty is primarily convention-dependent, as the convention defines the economic relationship. Your Position 4 is a common pragmatic view; Position 5 is widely practiced but harder to square *cleanly* with the structural rationale. This is the hardest tension to resolve perfectly.

  **Minor Tension (Severity: Low - Likely Dissolves on Scrutiny)**
  *   **Conflict:** **Position 1 (Queues are Moral) vs. Position 3 (Jaywalking is Fine)**
      *   **Apparent Tension:** Both involve coordination schemes. Why is flouting one (queueing) unfair, while flouting the other (jaywalking law) is permissible?
      *   **Dissolution:** Your reasoning *already* contains the distinction:
          *   **Queueing (Position 1):** Violation directly exploits others' compliance ("taking the benefit while skipping the cost") creating immediate unfairness *to specific individuals* behind you.
          *   **Jaywalking (Position 3):** You explicitly limit the obligation to when coordination is *needed* ("only when actually doing coordination work and someone is affected"). Crossing an empty street flouts the *rule* but not the *underlying coordination purpose* (safety/efficiency), causing no harm or unfairness. The fictional city scene reinforces this: if drivers *expect* jaywalking, the coordination norm *is* "cross with care," not "obey the light." Violating the *law* isn't violating the *effective coordination norm*.
      *   **Philosopher Consensus?** **Relatively Settled.** Your harm/unfairness principle (focusing on the *purpose* of the coordination rather than the rule itself) aligns well with consequentialist and fairness-based approaches to social norms. Most would agree the *moral weight* of a coordination norm depends on the actual stakes (immediate unfairness/harm vs. abstract rule-following). This tension disappears under your own framework.

  **Position 7 (Symbolic Compliance) - Stands Alone (No Significant Tension)**
  *   **Analysis:** This seems psychologically astute rather than a logical inconsistency. It describes internalized respect for convention *as such*. While it might *feel* irrational ("nobody's affected"), it's consistent with:
      *   **Habit/Virtue:** Following the norm reinforces the disposition to follow it when it *does* matter.
      *   **Signaling (Even to Oneself):** It signals respect for the social order and one's role within it.
      *   **Constitutive Rules:** In some views, rules like "stand right" *define* the practice of using an escalator efficiently, even when empty. Violating it feels like rejecting the practice itself.
  *   **Relation to Other Positions:** It aligns with Positions 1 & 2 (respecting coordination/convention). It doesn't contradict Position 6, as morally bad norms wouldn't be internalized this way. It's distinct from Positions 3/4/5 (harm/compensation-based).
  *   **Philosopher Consensus?** **Descriptively Accurate (Consensus).** Philosophers and social scientists largely agree that internalized norms drive much compliance, even in "victimless" scenarios. Its *moral weight* is debated, but as a description of human psychology within a normative system, it's sound.

  **Summary & Recommendations for Your Novel:**

  1.  **Must Repair:** **Position 2 vs. Position 6 (High Severity).** Limit Position 2 to *morally neutral* coordination conventions. Position 6 (Moral Override) is your stronger, less contested commitment. *This directly impacts your fictional shoe-queue scene.*
  2.  **Needs Justification:** **Position 4 vs. Position 5 (Medium Severity).** Refine the basis for tipping. Emphasize the *combination* of structural complicity *and* the convention's role in defining expectations/harm in the US, versus the potential disruption/absence of expected benefit where no convention exists. This tension reflects real-world moral ambiguity.
  3.  **Dissolves:** **Position 1 vs. Position 3 (Low Severity).** Your harm/unfairness principle cleanly distinguishes them. *Your fictional jaywalking law scene perfectly illustrates this dissolution.*
  4.  **Stands Strong:** **Position 7.** It's a valid psychological insight about norm internalization, not a logical flaw.

  **Key Insight for Your Scenes:** The shoe-queue forces a confrontation between Position 2 (local rule) and the *potential* for Position 6 (is the shoe-queue arbitrary but harmless, or does it encode a status hierarchy you reject?). The jaywalking law illustrates Position 3 perfectly: the *effective* coordination norm ("cross carefully") differs from the written law ("wait for green"), and violating the latter causes no harm, aligning with your reasoning. Use these scenes to *show* the nuances and potential conflicts in your character's philosophy, especially the repaired Position 2/6 dynamic. Don't shy away from the messy tension in Positions 4/5 – it's realistic.
