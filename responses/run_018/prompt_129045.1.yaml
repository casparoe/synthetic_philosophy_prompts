  hey so im prepping an interveiw for my science-and-ideas podcast. next weeks guest is a philospher who defends pure time preference but with this twist she calls identity-constituting discounting: she thinks pure rate preference is rational for impersonal goods but not for commitments that define who you are across time. i need like 8-10 interview questions that actually get into the mechanics, not generic life-story stuff. can you draft them? i def want one that hits the old neutrality argument about why temporal distance shouldnt matter morally, one comparing climate damage to strangers versus damage to your own future self under her framework, one that anticipates her usual structural-rationality reply and has a sharp follow-up, and one asking whether extreme versions of her view just collapse into intergenerational lexical priorities. also maybe toss in a question about the zero-rate camp in climate econ. keep it loose im not writing an academic syllabus.
