answer: |-
  Here are 8 interview questions designed to drill into the mechanics of "identity-constituting discounting," hitting your requested angles while keeping it focused and conversational for a podcast:

  1.  **The Core Distinction:** "Let's set the stage. You argue pure time preference is rational for impersonal goods but irrational for identity-constituting commitments. Can you give us a concrete, maybe even personal, example of *each*? What makes a commitment 'identity-constituting' in your view, versus just something I happen to really care about right now?"

  2.  **Hitting Temporal Neutrality Head-On:** "Philosophers like Derek Parfit argue that temporal distance itself is morally irrelevant – hurting my future self 50 years from now is just as bad as hurting myself tomorrow. Your view seems to reject this neutrality *specifically* for identity commitments. How do you reconcile that? Isn't the future self in both cases still *me*?"

  3.  **Climate Damage vs. Future Self Harm (The Asymmetry Test):** "Let's make this practical. Imagine I neglect my health today, guaranteeing serious future suffering for *me*. Under your view, that seems irrational because it violates an identity-constituting commitment to my future self. But if I emit a ton of CO2 today, causing equivalent suffering to a *stranger* 50 years from now, pure time preference might be rational. Why is discounting my *own* future suffering irrational, but discounting the distant stranger's suffering potentially permissible? Where does the fundamental asymmetry lie?"

  4.  **The Structural Rationality Gambit (Pre-empting & Pushing):** "I anticipate you might say discounting identity commitments is structurally irrational – it undermines the agency or self-constitution required for rational choice itself. **Follow-up:** Okay, but doesn't that just push the question back? *Why* is maintaining this specific identity structure rationally non-negotiable? Couldn't someone rationally choose *not* to be the kind of person bound by long-term commitments? Isn't that just bootstrapping?"

  5.  **Lexical Priorities & The Slippery Slope:** "Take this to an extreme. If discounting my identity-constituting commitments to my *own* future is irrational, does that imply an absolute, *lexical* priority for my near-term identity projects over *any* future impersonal good? Could this view, taken strictly, justify ignoring massive, catastrophic damage to future generations if it conflicts with fulfilling my current deep commitments? Where's the line?"

  6.  **Zero-Rate Discounting & Climate Policy:** "This connects directly to climate economics. Folks like Stern argue for a near-zero or zero pure time preference rate for intergenerational impacts, treating future generations impersonally but *equally*. How does your view engage with that? Does rejecting pure discounting for impersonal goods *support* Stern's near-zero rate, or does your acceptance of it for impersonal goods (just not identity commitments) actually *undermine* the zero-rate argument for things like climate damage?"

  7.  **The Source of Identity Commitments:** "How do these identity-constituting commitments *arise*? Are they chosen reflectively? Thrown upon us by circumstance or biology? Socially constructed? Does the source matter for whether discounting them is irrational? If they change over time, does the irrationality only apply *while* they hold?"

  8.  **Prudence vs. Morality:** "Traditionally, prudence (caring for your future self) is seen as a *different kind* of rationality than morality (caring for others). Your view seems to make prudence *morally* significant or at least structurally fundamental. Are you collapsing that distinction? Is neglecting my future self now not just imprudent, but *immoral* under your framework?"

  **Why this works for your podcast:**

  *   **Mechanics-Focused:** Every question targets the *structure* and *implications* of the theory, not biography.
  *   **Hits Your Specified Angles:** Temporal Neutrality (Q2), Climate vs. Self (Q3), Structural Rationality Anticipation & Pushback (Q4), Lexical Priorities (Q5), Zero-Rate Climate Econ (Q6).
  *   **Concrete & Conversational:** Uses examples ("health neglect," "CO2 emissions"), avoids overly academic jargon where possible, phrases things conversationally ("Let's set the stage," "I anticipate you might say...").
  *   **Probes Tensions:** Designed to reveal potential conflicts (asymmetry in Q3, bootstrapping in Q4, extreme implications in Q5, source problems in Q7).
  *   **Flows Logically:** Starts with core distinction, moves to challenges (neutrality, asymmetry), probes defenses (structural rationality), explores extremes (lexical, zero-rate), then digs into foundations (source, prudence/morality).

  **Tips for Delivery:**

  *   **Listen Actively:** Her answers to Q1 (examples) and Q4 (structural rationality) will set up great follow-ups organically during the interview.
  *   **Clarify, Don't Grandstand:** Use phrases like "Help me understand..." or "So, if I follow you..." to drill deeper without sounding adversarial.
  *   **Connect Back:** If she gives a strong answer to Q3 (asymmetry), you can refer back to it when asking Q5 (lexical priorities) or Q6 (climate econ).
  *   **Keep it Loose:** Don't feel bound to ask *exactly* these. Use them as a roadmap and adapt based on the conversation's flow and her responses.

  Good luck with the interview! This is a fascinating topic.
