prompt: |-
  hey — I'm a junior and I'm taking a seminar on Dewey this term (the public-and-its-consequences stuff and the inquiry sequence: indeterminate situation, instituting the problem, hypothesis, testing, settling), and I somehow also ended up as one of two undergrads on the university's Space and Capital Planning Committee. We meet for ninety minutes every other week, we get maybe eight or nine real decisions a year — convert a parking lot, renovate a building, close something — and whatever we produce goes to the VP for Finance and Facilities, who can ignore it but usually doesn't. The other members are two faculty, a dean, the head of facilities, and an institutional research analyst who can pull numbers for us in about two weeks if we ask nicely. Nobody on this committee has read any theory and if I say "experimentalism" out loud I will lose the room for the rest of the year. Stakes are real: these are ten- to forty-year decisions about buildings and about who can afford to be on campus.

  So here's what I want. Turn that picture of inquiry-as-democracy into an actual procedure my committee can run on a proposal, in the order we'd run it, that I can hand to the dean as a one-page checklist with no Dewey vocabulary in it at all. For each step: what question we ask, what counts as an answer good enough to move on, where the procedure just stops and says no, and where it has to hand the decision to a human because the thing in dispute is a value and not a forecast. Then tell me which of Dewey's distinctions have to survive the translation for it to still be his idea rather than just good meeting hygiene, and which I can quietly drop.

  Some things I think need building in, but you tell me if I'm wrong about where they go:

  - We keep starting with options ("dorm or no dorm") and I'm pretty sure the Dewey move is that the first meeting isn't allowed to consider options at all, only formulations of what's actually gone wrong. But I don't know what a "problem formulation" has to look like for us to accept one and move on, and I don't know how to stop facilities from sneaking a preferred option in disguised as a problem statement.
  - Preferences vs consequences. Everyone wants a survey. Dewey's whole thing seems to be that a poll just adds up wants people walked in with, which is not inquiry. My idea instead is consequence pacts: when someone tells us what they want, we make them name one specific thing they expect to observe in eighteen months if they get it, we write it down with their name, and we bring the list back out when the time comes. Is that a faithful operationalization or a parody of it, and what do I do with the people who refuse to commit to a prediction, which will be most of them?
  - The public as the people who catch the indirect consequences. Most affected people never show up — commuters, night custodial staff, the neighbors, students who aren't enrolled yet, people who'd enroll if childcare were cheap. I want a required step where we name the absentees and assign someone in the room to carry their stake explicitly, but that feels like it could become theater where I appoint myself to speak for everyone. How does the procedure keep that honest?
  - Experts. Facilities tells us things and we have no way to check them. Dewey's thing about the person wearing the shoe knowing where it pinches, even if the expert knows how to fix it, seems to imply an actual cross-examination step. What form does it take when we have ninety minutes?
  - Irreversibility. Some of these decisions (demolish, sell land, close the childcare center) can't be un-tried, and Dewey's whole model seems to assume you can learn by doing and then revise. What does the procedure degrade into when it hits one of those, and how should I recognize that I've hit one?

  Then run it on three:

  1. Converting a surface parking lot into a 500-bed residence hall with retail on the ground floor. We have the consultant's traffic and revenue study.
  2. Closing the campus childcare center and contracting with a private provider five minutes away — saves the college real money, and every parent who uses it is staff or a student parent, meaning the people most affected can't come to a 4pm meeting because of the very thing we're deciding about.
  3. A case where I won't like the answer: student government has already announced a campus-wide binding-ish referendum on the residence hall for spring, and I'm the one who pushed for it because it's the only way students ever get listened to here. Tell me what your procedure says about the referendum specifically, and what I'd have to go back and tell people who think I sold them out.

  Finally, be straight about what the procedure can't do. My worry is that it can churn through every step, produce something well-warranted, and still get rejected by everyone, and that Dewey's answer to that is just "more inquiry" — which is useless when the VP wants a vote in March. Where does this thing actually break, and what should I do in the room when it does.
reasoning: |-
  Okay, let me unpack this user's request. They're a junior in a Dewey seminar, serving on a university planning committee with real long-term consequences. They need to translate Dewey's inquiry model into a practical, jargon-free checklist for committee procedures. 

  First, I notice the tension between theory and practice here. The user clearly grasps Dewey's concepts but recognizes committee members won't tolerate academic language. Their hidden need might be legitimacy—wanting to apply theory without seeming pretentious. The parking lot example shows they've hit institutional friction points already.

  Hmm, their four structural concerns reveal deep institutional barriers: problem formulation vs. pre-baked solutions, preference theater, absent stakeholders, and irreversible decisions. The childcare center case particularly highlights power imbalances—those affected can't attend 4pm meetings about their needs. Smart of them to spot that.

  For the procedure itself... I should avoid Dewey's terminology entirely while preserving: 1) problem-first orientation, 2) consequence-testing, 3) stakeholder mapping, 4) hypothesis framing. The "consequence pact" idea is brilliant but needs softening—maybe "outcome commitments" sounds less confrontational? 

  Biggest challenge: irreversibility. Dewey assumes iteration, but demolition decisions can't be undone. The checklist needs explicit "point of no return" flags. And the referendum dilemma... oof. Must acknowledge that sometimes democratic processes conflict. The user needs cover to say "this vote shouldn't replace inquiry" without sounding anti-democratic.

  Breakage points worry me most. When VP deadlines hit, the procedure could crumble. Need to build in "triage thresholds": if X isn't resolved by step 3, escalate to human judgment. And always document gaps so the VP sees what's missing.

  For the three cases:
  - Parking lot: Stress testing traffic studies via counter-experts matters most. 
  - Childcare: Mandatory absentee analysis isn't theater if they assign concrete advocates.
  - Referendum: Distinguish ratification from inquiry—the vote shouldn't shortcut the testing phase.

  Finally, the "can't do" section must be brutally honest. No procedure fixes power imbalances or deadline pressures. But framing documentation as "liability protection" might appeal to the facilities head...
answer: |-
  Here's a pragmatic, Dewey-inspired procedure distilled into a one-page checklist, stripped of theory jargon but preserving core principles. It forces *inquiry before advocacy* and focuses on **consequences for affected groups** rather than preferences. Key Dewey elements retained: **problem-first orientation, consequence-testing over preference-aggregating, explicit identification of affected publics, and hypothesis-driven experimentation** (where possible).

  ---

  **Campus Planning Decision Protocol**  
  *(One-Page Checklist for Proposals)*

  ### PHASE 1: DEFINE THE PROBLEM (NOT THE SOLUTION)  
  *(Before discussing options)*  
  **Question:** *"What measurable symptom or changing condition makes action necessary? Who is directly experiencing this?"*  
  **✓ Valid Answer:** Concrete evidence (e.g., "Parking overflow spills into neighborhoods 3x/week," "Childcare waitlist = 92 families," "Deferred maintenance costs up 40% in 5 years").  
  **✗ Stop If:** Problem is stated as a solution ("We need a new dorm") or lacks evidence.  
  **Human Judgment Needed:** If disagreement persists on whether a "problem" exists.  

  *Your Concern (Facilities Sneaking in Solutions):* **Mandate symptom-first language.** Reject statements like "Problem: Lack of student housing" → Force reframing: "Problem: 18% of accepted students decline enrollment citing housing costs."  

  ---

  ### PHASE 2: MAP AFFECTED GROUPS (PRESENT & ABSENT)  
  **Question:** *"Which groups will experience direct/indirect consequences (positive/negative) of potential solutions? Who is NOT in this room?"*  
  **✓ Valid Answer:** Named groups + specific consequences (e.g., "Night-shift custodians: longer walk from new parking," "Future low-income students: impacted by housing cost," "Local businesses: lose lunch traffic if lot closes").  
  **✓ Action:** Assign **Advocacy Roles** (*not* representatives!) to 2 committee members:  
  - *Role 1:* Gather input from named absent groups before next meeting (e.g., survey custodians *on shift*, email waitlisted parents).  
  - *Role 2:* Defend absentees’ interests during testing (e.g., "Would this design increase custodial travel time?").  
  **Human Judgment Needed:** Prioritizing which groups’ consequences matter most.  

  *Your Concern (Theater):* **Require specific, testable consequences per group.** Role-players must cite evidence (e.g., shift schedules, enrollment data) — not just "speak for." Document gaps in understanding.  

  ---

  ### PHASE 3: EVALUATE OPTIONS AS HYPOTHESES  
  **For Each Proposal:**  
  **Question:** *"What specific, observable outcomes do we expect in 1-3 years if we do this? What evidence suggests this will happen?"*  
  **✓ Valid Answer:** Forecasts tied to *Phase 1 problem* (e.g., "Hypothesis: New dorm will reduce student decline rate by 5%," "Evidence: Consultant study on peer institutions").  
  **✓ Action:** Create **Outcome Commitment List** → Record:  
  1. The forecast (e.g., "Traffic delays at Elm/5th < 5 mins peak hour").  
  2. Who proposed/supports it.  
  3. Deadline to verify (e.g., 18 months post-opening).  
  **✗ Stop If:** No testable forecast is offered.  
  **Human Judgment Needed:** If evidence is contested (e.g., dueling studies).  

  *Your Concern (Preferences vs. Consequences):* **"Consequence Pacts"** are core to Dewey. Refusing to commit? → "Without a forecast, we can’t evaluate success. This option lacks criteria for assessment."  

  ---

  ### PHASE 4: STRESS-TEST EVIDENCE (90-MINUTE RULES)  
  **Question:** *"What could invalidate the key evidence? How would we know if this goes wrong?"*  
  **✓ Valid Answer:**  
  - **Cross-Examination Lite:** Each member asks 1 critical question to the *evidence-source* (e.g., Facilities, consultants). Focus: methodology gaps (e.g., "Did traffic study include game days?").  
  - **"Pinch Test":** Share 1 concern from an *absent group* assigned in Phase 2 (e.g., "Will retail rents price out current food trucks?").  
  **✓ Action:** Document unresolved risks & assign follow-up if critical.  
  **Human Judgment Needed:** If risks are deemed unacceptable (e.g., "20% chance of bankrupting childcare provider").  

  ---

  ### PHASE 5: DECISION & IRREVERSIBILITY HANDLING  
  **Question:** *"Can we test this reversibly? If not, what safeguards mitigate permanent harm?"*  
  **✓ Action:**  
  - **Reversible?** → Build in pilot/test (e.g., "Temporarily relocate childcare for 1 year before closing").  
  - **Irreversible?** (e.g., demolition, land sale) → Require:  
    a) *"Pre-mortem"*: "Assume failure: What caused it?" → Mitigate top 3 risks.  
    b) *Compensation pact* for worst-hit group (e.g., "If traffic worsens, college funds shuttle passes").  
  **✗ Stop If:** Safeguards are unenforceable.  

  ---

  ### WHERE DEWEY SURVIVES (AND WHAT TO DROP)
  | **Core Dewey Element**     | **Translated To**                 | **Dropped?** |
  |----------------------------|-----------------------------------|--------------|
  | **Problem First**          | Phase 1 symptom definition        | NO — Essential |
  | **Consequences > Preferences** | Outcome Commitment List         | NO — Essential |
  | **Affected Publics**       | Absentee mapping + Advocacy Roles | NO — Essential |
  | **Hypothesis Testing**     | Forecasts with verification steps | NO — Essential |
  | **Inquiry as Social**      | Cross-examination & role assignments | Kept        |
  | "Dramatic Rehearsal"       | Pre-mortems                      | Kept        |
  | **Epistemology of Action** | Dropped — No need to justify learning-by-doing | YES |
  | **Aesthetic Experience**   | Dropped — Not practical here      | YES         |

  ---

  ### APPLIED TO YOUR CASES  
  1. **Parking Lot → Dorm**  
     - **Phase 1:** Problem = "Student enrollment down 12% due to housing costs" (not "We need a dorm").  
     - **Phase 2:** Absentees = Neighbors (traffic), future low-income students. Advocate: *You* research neighbor concerns.  
     - **Phase 3:** Forecasts = "5% enrollment increase by Year 3," "Retail revenue covers 30% of operating costs."  
     - **Phase 4:** Stress-test traffic study: "Did it model parent move-in days?"  
     - **Phase 5:** Reversible? Design phased construction to pause if forecasts miss Year 1 targets.  

  2. **Childcare Center Closure**  
     - **Phase 1:** Problem = "$1.2M annual subsidy unsustainable; waitlist growing 15%/year."  
     - **Phase 2:** Absentees = Night-shift parents, future student parents. Advocate: *Dean* surveys parents *during pick-up times*.  
     - **Phase 3:** Forecast = "95% of users transition to new provider without dropouts."  
     - **Phase 4:** "Pinch Test": "What if provider raises rates 20%? Contract cap?"  
     - **Phase 5:** Irreversible → **Pre-mortem:** "Failure caused by provider bankruptcy" → Demand escrow fund. **Compensation Pact:** Free emergency backup care if provider fails.  

  3. **Referendum Challenge**  
     - **Procedure’s Response:** *"Referendums aggregate preferences, not test consequences. Use vote to identify concerns (Phase 2), but not to skip inquiry. We still need:*  
       1. Forecasts from 'Yes/No' camps (Phase 3 Outcome Commitments).  
       2. Stress-test of claims (Phase 4).  
       3. Plan for irreversible impacts (Phase 5)."  
     - **What You Say:** "The vote tells us *what* students want, but not *whether it will work*. Our job is to ensure their demands won’t backfire. Let’s embed their priorities in testing."  

  ---

  ### WHAT THIS CAN’T DO & HOW TO HANDLE BREAKAGE  
  1. **"Rejected Despite Good Process"**  
     - **Why:** Power imbalances (VP overrides), value conflicts ("Saving money > supporting parents"), or deadline pressures.  
     - **Dewey’s Flaw:** "More inquiry" ignores political reality.  
     - **In-Room Triage:**  
       - Document gaps in inquiry (e.g., "VP: We lack data on X, but proceed anyway").  
       - If overruled on values: "This prioritizes [cost] over [student access]. We formally note objection."  
       - If rushed: Insist on Phase 5 safeguards ("If we can’t test fully, we need a sunset clause").  

  2. **When It Breaks:**  
     - **Before Phase 3:** If no testable forecasts emerge → "We lack criteria to evaluate success. We recommend postponing until evidence exists."  
     - **After Phase 4:** If risks are high & irreversible → "The potential harm to [group] outweighs benefits under current safeguards. We reject unless mitigations are added."  
     - **Human Judgment Override:** Always an option — but force explicit justification: *"We are proceeding despite [unresolved risk] because [value reason]."*  

  **Your Role:** Be the process anchor. When debate veers into preferences, say: *"What problem does that solve? What would success look like?"* When experts opine, ask: *"What test would prove this wrong?"* Record everything — a rigorous paper trail is your leverage.  

  This turns Dewey’s "public" into actionable scrutiny, his "inquiry" into auditable forecasts, and his experimentalism into reversible pilots. It won’t eliminate politics, but it forces consequences to the table. Good luck.
