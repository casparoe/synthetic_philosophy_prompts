prompt: |-
  I've recently ended up on the board of a small global-health foundation that funds malaria, deworming, and maternal health programs, and there's a deal on the table I can't stop chewing over. A church-based health network with genuinely deep reach in rural areas has offered to carry our malaria and deworming programs, on the condition that all the maternal-health materials co-branded with them drop any mention of contraception and instead include a short page promoting natural family planning, which their church supports. Half the board sees this as a no-brainer: we get bednets and deworming pills to communities we otherwise can't reach, and they get materials their volunteers are comfortable distributing. The other half thinks we'd be lending our name to a family-planning message we don't believe and which we think is worse for women, and that taking the deal makes us complicit in pushing it. Draft the short decision memo I can bring to the board: recommend approve, reject, or approve with conditions, give reasons the losing side can actually respond to, and end with a clear actionable bottom line.
reasoning: |-
  Okay, the user is on the board of a small global-health foundation focused on malaria, deworming, and maternal health. They're facing a tough decision about partnering with a church-based health network. The church offers to distribute their malaria and deworming programs but wants to remove contraception mentions from maternal health materials and replace them with natural family planning promotion. The board is split, and the user needs a memo to present.

  First, I need to understand the core conflict. The foundation's mission covers malaria, deworming, maternal health. The church has deep rural reach, which is valuable. But the condition alters their maternal health messaging. Some board members see it as a pragmatic trade-off: reach more people with life-saving interventions. Others see it as endorsing a message they don't believe in, which could harm women's health.

  The user wants a memo that recommends approve, reject, or approve with conditions. The reasons must be fair to both sides, and the bottom line actionable. Key points from the query: the church has "genuinely deep reach," suggesting their distribution network is hard to replicate. The materials would be co-branded, so the foundation's name is tied to the modified message. The opposition worries about complicity in pushing an ineffective method and undermining their values.

  Looking deeper, the user might be seeking a balanced solution that doesn't alienate either faction. They need to preserve board unity while making an ethical, practical decision. Unspoken needs: maintaining the foundation's integrity, ensuring the partnership doesn't set a bad precedent, and addressing potential long-term consequences like donor reactions or impact on women's health.

  Options to consider:
  1. **Reject**: Upholds principles but misses out on extending life-saving programs. Could leave a gap in hard-to-reach areas.
  2. **Approve**: Maximizes immediate impact for malaria and deworming but risks endorsing a contested family planning approach. Might damage reputation.
  3. **Approve with conditions**: A compromise. Separate the maternal health materials to avoid co-branding on the disputed content. This way, the foundation still benefits from the church's distribution for malaria/deworming without directly supporting the natural family planning message.

  The conditional approval seems most balanced. It addresses the pro-deal side's point about expanding reach while mitigating the con side's concerns about complicity. By decoupling maternal health materials, the foundation avoids putting its name on messages it doesn't endorse. The church still gets to distribute their preferred materials, but not under the foundation's brand. This respects both the pragmatic and principled perspectives.

  Potential risks: The church might reject this condition. If so, the foundation must be prepared to walk away. Also, monitoring is crucial to ensure compliance. But overall, this approach aligns with the foundation's mission to maximize health impact without compromising core values. It turns a binary choice into a nuanced solution that could satisfy both sides enough for agreement.
answer: |-
  ## Board Decision Memo: Church Network Partnership Proposal

  **To:** Board of Directors  
  **From:** [Your Name], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Church Network Partnership for Malaria/Deworming Distribution - Conditional Approval Required  

  **1. Proposal:** Partner with [Church Network Name] to distribute our malaria bednets and deworming pills in underserved rural areas, contingent on modifying co-branded maternal health materials: removing contraception references and adding a page promoting natural family planning (NFP).  

  **2. Recommendation:** **Approve with Strict Conditions** (Detailed below).  

  **3. Analysis of Pros (Why Some Support Unconditional Approval):**  
  *   **Massive Reach Expansion:** The Church Network's deep rural penetration offers an unparalleled opportunity to deliver life-saving malaria prevention and deworming treatments to populations we currently cannot access effectively. This directly advances core foundation goals and saves lives immediately.  
  *   **Practical Impact:** Leveraging their existing volunteer structure is highly efficient, maximizing resource utilization and accelerating impact in critical areas. Rejecting means leaving vulnerable communities unprotected.  
  *   **Material Distribution:** The modified materials will still be distributed, potentially reaching women who might otherwise receive *no* maternal health information.  

  **4. Analysis of Cons (Why Some Advocate Rejection):**  
  *   **Endorsing Ineffective Messaging:** Co-branding materials promoting NFP *only* (without contraception information) implicitly endorses a family planning approach we believe is less effective and potentially harmful to women's health autonomy and outcomes. This contradicts our evidence-based maternal health mission.  
  *   **Reputational Complicity:** Attaching our name to materials that omit critical health options we support makes us complicit in restricting information. This risks donor trust, partnerships with other health providers, and our credibility as a science-driven organization.  
  *   **Slippery Slope:** Accepting this condition sets a precedent where partners dictate our core messaging on sensitive topics, potentially undermining our mission integrity in future negotiations.  

  **5. Recommended Conditions for Approval:**  
  To capture the **pro-deal** benefits while directly addressing the **anti-deal** concerns, approval MUST be contingent on:  
      *   **Decoupling Maternal Health Materials:** Our malaria and deworming programs proceed with the Church Network *without* any linkage to modified maternal health materials.  
      *   **No Foundation Co-Branding on Altered Content:** The Church Network is free to distribute *their own* maternal health materials promoting NFP (without contraception info) under *their name only*. Our foundation name, logo, and brand identity **must not appear** on any material omitting contraception or exclusively promoting NFP.  
      *   **Clear Scope in Agreement:** The written partnership agreement explicitly limits the scope to malaria and deworming distribution. It must state that maternal health information distribution by the Church Network is separate, not part of the funded partnership, and carries no Foundation endorsement.  
      *   **Independent Monitoring:** We implement a mechanism to verify compliance with branding and scope separation during distribution.  

  **6. Why Conditional Approval Addresses Both Sides:**  
  *   **For the Pro-Deal Side:** We secure the critical benefit: dramatically expanded, efficient delivery of malaria and deworming interventions to save lives in inaccessible areas, leveraging the Church Network's unique reach. This is the primary goal of the partnership.  
  *   **For the Anti-Deal Side:** We avoid complicity. By strictly separating our brand and funded activities from the modified maternal health messaging, we do not endorse or lend credibility to a family planning approach we believe is suboptimal. We maintain our integrity and evidence-based stance on maternal health. The Church Network can still distribute their preferred materials, but not under our banner or as part of our funded program.  

  **7. Bottom Line - Action Required:**  
  **I move that the Board APPROVE the partnership with [Church Network Name] for the distribution of malaria bednets and deworming pills ONLY, STRICTLY CONDITIONAL upon agreement to the terms outlined in Section 5 (Decoupling, No Co-Branding on Altered Maternal Content, Clear Scope, Monitoring). If these conditions cannot be met by the Church Network, the partnership must be rejected.**  

  **This approach maximizes life-saving impact for malaria and deworming while safeguarding our foundational principles on maternal health information and avoiding endorsement of messaging we cannot support.**
