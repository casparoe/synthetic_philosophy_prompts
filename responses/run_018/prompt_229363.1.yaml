prompt: |-
  I'm a philosophy professor, and somehow half my job is running votes: hiring committee shortlists, picking which colloquium speakers to invite, curriculum proposals, grad admissions waitlists. A while back I actually sat down and read up on the Gibbard-Satterthwaite theorem (partly out of guilt, since I teach social choice every few years and always hand-wave the proof), and it's been bugging me ever since. As I understand it: once there are three or more options, any deterministic rule for picking a single winner that isn't a dictatorship and lets every option possibly win can be gamed by someone voting insincerely. Fine. Depressing, but fine. The thing is, I still have to run these votes next semester, and the theorem doesn't come with a "so here's what to do about it" section.

  So: turn what the theorem actually implies -- and just as importantly, what it does NOT imply -- into a practical procedure I can follow when I'm setting up a departmental vote. Roughly: given the kind of decision, the number of options, what I know about how people's preferences line up, and how much I care about sincere voting versus other goods (speed, legitimacy, the losers not feeling robbed), which rule should I use? Or should I restructure the choice itself instead -- narrow the field first, vote on things one at a time, pair options off?

  Some constraints on the procedure:

  - It should start from the theorem's actual content and scope conditions. It only bites, as I understand it, when preferences are unrestricted, so I want an early step that checks whether something like single-peakedness plausibly holds in the case at hand (hiring votes often feel nearly one-dimensional -- research quality -- until someone mentions teachign coverage and suddenly we're in two dimensions and I'm doomed). The procedure should say what to do when the theorem genuinely applies versus when a restriction plausibly saves me.
  - It should distinguish "the theorem says strategic voting is possible" from "strategic voting is likely and worth designing around." I suspect a lot of people overread it as "everyone will lie all the time," and I don't think that's what it says.
  - It should go through the escape hatches I keep hearing about and say whether each one genuinely escapes: sequential elimination with an agenda, approval voting (voters aren't submitting rankings, so is it even under the theorem's jurisdiction?), randomization, deliberation before the vote, just... refusing to have more than two options on the table.
  - Include three worked applications: (a) a hiring committee ranking four candidates for one job; (b) a faculty meeting choosing among five curriculum proposals with known factions; (c) at least one case where the procedure gives me an answer I won't like -- e.g., it tells me a rule I'd pick on other grounds is fine despite being manipulable, or it tells me to shrink the agenda when I'd rather not.
  - Be explicit about what the theorem can't settle. As far as I know it says nothing about which rule's manipulability is worst in practice, nothing about legitimacy, nothing about when strategic voting is even bad. Mark clearly where the procedure runs out and I'm back to judgment.

  Write it as an actual checklist or flowchart-in-words I could tape next to my office door, not an essay. Casual tone is fine; I'm going to be following this thing at 4:45pm in a stuffy seminar room and I need it to work then.
reasoning: |-
  Okay, the user is a philosophy professor who deals with a lot of departmental voting. They've studied the Gibbard-Satterthwaite theorem, which shows that with three or more options, any voting system that isn't dictatorial and allows every option to win can be manipulated through strategic voting. The professor is looking for a practical guide based on the theorem to set up departmental votes effectively.  

  First, I need to recall the key points of the Gibbard-Satterthwaite theorem. It applies when there are three or more options, preferences are unrestricted, and the voting rule is non-dictatorial and onto. The theorem states that strategic voting is always possible under these conditions. However, it doesn't mean manipulation will always happen—just that it's possible.  

  The user wants a procedure that starts by checking if the theorem's conditions apply. Unrestricted preferences are crucial here. If preferences are single-peaked (aligned on a spectrum) or have some other structure, the theorem might not bite, and simpler voting methods could work. For example, in hiring, if everyone agrees on research quality as the main dimension, Condorcet methods could be safe. But if teaching coverage introduces a second dimension, that could cause problems.  

  They also want to distinguish between possible and likely strategic voting. The theorem doesn't imply everyone will manipulate, just that they could. Factors like group size, transparency, and voter sophistication affect the likelihood. Small committees might have less incentive to strategize if preferences are similar, while larger groups with factions might see more gaming.  

  The escape hatches need evaluation. Sequential elimination (like amendment procedures) can avoid the theorem if the agenda is set, but agenda manipulation becomes a risk. Approval voting isn't covered by Gibbard-Satterthwaite because it doesn't use rankings—it's a non-ranked method. Randomization (like random dictators) escapes but sacrifices determinism. Limiting to two options avoids the theorem entirely.  

  The user provided three scenarios. For hiring (four candidates), if preferences are one-dimensional, a Borda count might work, but if not, approval voting could be better. For curriculum proposals with factions, approval voting or runoff systems might handle strategic voting better. The third scenario should show a case where the recommendation is unpleasant, like narrowing options despite resistance.  

  The procedure must clarify what the theorem doesn't address. It doesn't compare the manipulability of different rules, assess legitimacy, or determine when manipulation is harmful. Those aspects require judgment beyond the theorem.  

  Structuring this as a flowchart-in-words. Start by asking about the number of options. If less than three, use majority rule. If three or more, check for preference structure. If structured, use Condorcet or Borda. If unstructured, consider group size and stakes. Small groups might use Borda with deliberation, large factions might need approval or runoff. Always include deliberation and be transparent about the system's flaws.  

  For the worked examples: Hiring committee—likely one-dimensional, so Borda count. Curriculum proposals with factions—unstructured preferences, so approval voting. Unpleasant case—forcing a reduction to two options despite wanting more choices.  

  Need to emphasize that the theorem doesn't make manipulation inevitable. The guide should help the professor decide based on context, using the theorem's limitations to inform choices without overstating its implications.
answer: |-
  Here’s your practical "Gibbard-Satterthwaite Survival Kit" – a checklist for setting up departmental votes. Tape it next to the coffee machine for maximal visibility.

  **G-S THEOREM QUICK REFRESHER:**
  *   **Bites When:** 3+ options, non-dictatorial rule, every option can win, *and* voters' preferences can be *any possible ordering* (Unrestricted Domain).
  *   **Says:** Strategic voting is *always theoretically possible* for *some* preference profiles.
  *   **Does NOT Say:** Strategic voting *always happens*, is *easy to do*, or *changes the outcome every time*. It doesn't tell you *which rule is least manipulable* or *fairest*.

  ---

  **THE CHECKLIST: "WHAT VOTING RULE FOR THIS MESS?"**

  1.  **HOW MANY WINNERS?**
      *   **One Winner?** → Go to Step 2.
      *   **Multiple Winners?** → *G-S doesn't directly apply!* (Consider STV, Approval for multi-winner, or separate votes). *Skip to Step 6 for general advice.*

  2.  **HOW MANY OPTIONS?**
      *   **1 Option?** → Why are we voting? Go home.
      *   **2 Options?** → *G-S DOESN'T BITE!* **Use Majority Rule.** Relax. Done.
      *   **3+ Options?** → Go to Step 3. *(G-S Lurks Here)*

  3.  **PREFERENCES: STRUCTURED OR FREE-FOR-ALL?**
      *   **Likely Structured?** (e.g., Hiring - "Research Quality" spectrum; Colloquium - "Theoretical/Applied" axis; Proposals - "Cost/Impact" trade-off) → *Escape Hatch Possible!*
          *   **Is there ONE clear underlying dimension?** (e.g., pure research prowess) → **Use Borda Count** (Ranking) or **Condorcet Method** (Pairwise comparisons). *G-S technically still applies, but manipulation is much harder/predictable if preferences are truly single-peaked.*
          *   **Or TWO dimensions?** (e.g., Research *and* Teaching) → **Danger Zone.** *G-S bites hard.* Go to Step 4. Consider Approval.
      *   **Likely Unstructured/Messy?** (e.g., Curriculum votes with strong factions, diverse values; Grad admissions with wildly different candidate strengths) → **G-S Applies Fully.** Go to Step 4.

  4.  **HOW BAD WOULD MANIPULATION BE? (Risk Assessment)**
      *   **Small Group? (<10) & Trust/Shared Goals?** → Manipulation less *likely*. **Borda Count** (Ranking) or **Plurality Runoff** (Top 2) often acceptable. Transparency helps.
      *   **Large Group? Factions? High Stakes? Controversial?** → Manipulation *likely and damaging*. **Use Approval Voting.** *This is the key escape hatch!* G-S *doesn't apply* because voters submit *sets* (approve/disapprove), not full rankings. Sacrifices fine-grained preference info for strategy-resistance. **Or, if you MUST rank:** Use **Sequential Elimination (Amendment Procedure)** - *Escapes G-S (technically) BUT introduces AGENDA MANIPULATION risk.* Set agenda fairly/randomly.
      *   **Desperate for True Strategy-Proofing?** → **Random Dictator** (Pick one voter randomly, their top choice wins). *Escapes G-S!* But feels awful/illegitimate for big decisions. Use sparingly (e.g., breaking unresolvable ties).

  5.  **CAN I SHRINK THE OPTIONS?**
      *   **Yes, and it makes sense?** (e.g., Committee filters to strong top 2-3 for full faculty vote) → **DO IT.** *Reduces to Step 2 (Majority Rule) or lowers manipulation risk.* Win.
      *   **No, or it feels unfair/arbitrary?** → Stick with choice from Step 4. Acknowledge the trade-off.

  6.  **BEFORE YOU VOTE: NON-THEOREM NECESSITIES**
      *   **DELIBERATE FIRST!** Discussion clarifies preferences, reveals structure, builds consensus. *Reduces need/opportunity for manipulation.*
      *   **BE TRANSPARENT:** Announce the voting rule *in advance* and explain *why* you chose it (e.g., "We're using Approval because there are many good proposals and we want to avoid strategic ranking").
      *   **MANAGE EXPECTATIONS:** Remind voters: "No system is perfect. G-S tells us strategy is possible, but we've chosen [Rule] because [Reason]. Vote sincerely unless you see a *clear, major* reason not to." (They're philosophers, they can handle nuance).
      *   **CONSIDER OTHER GOODS:** Speed? → Approval/Plurality. Fine-grained preferences? → Borda (if structured). Condorcet winner legitimacy? → Condorcet method (if structured). Loser acceptance? → Runoff/Sequential often feels fairer.

  ---

  **WORKED APPLICATIONS:**

  1.  **Hiring Committee Ranking Four Candidates (One Job):**
      *   Step 1: One Winner → Yes.
      *   Step 2: 4 Options → 3+.
      *   Step 3: **Likely Structured (Research Quality Spectrum).** Escape hatch! *Usually...* Unless teaching fit is a wildcard making preferences 2D.
      *   Step 4: Small Group, Shared Goal (hire best). Lower manipulation risk.
      *   **Recommendation: Borda Count.** Captures nuanced preferences well on the presumed spectrum. If someone whispers "But Candidate A can't teach Topic X!", reassess structure → if now messy, **switch to Approval Voting** for safety.
      *   *G-S Says:* Manipulation *possible*, but unlikely to be rampant in this context with Borda. Approval escapes G-S.

  2.  **Faculty Meeting Choosing Among Five Curriculum Proposals (Known Factions):**
      *   Step 1: One Winner → Implicitly yes (adopting one proposal).
      *   Step 2: 5 Options → 3+.
      *   Step 3: **Likely UNSTRUCTURED/MESSY.** Factions = divergent values. G-S bites hard.
      *   Step 4: Larger Group, Factions, Potentially High Stakes/Controversy. High manipulation risk/impact.
      *   **Recommendation: APPROVAL VOTING.** Best escape hatch. Lets voters support *all* acceptable options without fear of hurting their favorite. Harder for factions to game systematically than ranking/runoff. **Alternative:** If factions are very rigid and you *must* rank, use **Sequential Elimination** with agenda set randomly *after* proposals are finalized.
      *   *G-S Says:* Manipulation is very possible with ranking/runoff. Approval escapes.

  3.  **The Unpleasant Answer (Grad Admissions Waitlist - Ordering 3 candidates for 1 spot if top choice declines):**
      *   **What you want:** A ranked vote (Borda?) to get a nuanced order.
      *   Step 1: One Winner → Eventually, yes.
      *   Step 2: 3 Options → 3+.
      *   Step 3: **Likely UNSTRUCTURED.** Different strengths (GPA/GRE vs. Writing Sample vs. LORs vs. Fit), subjective evaluations. Messy.
      *   Step 4: Small Committee, but VERY high stakes for candidates, potential for strong divergent views. Manipulation could feel ethically worse here.
      *   **Recommendation (You Won't Like): APPROVAL VOTING or SHRINK THE OPTIONS.**
          *   **Approval:** Vote "Which candidates are *acceptable* for this spot?". Randomly select from approved list if needed. Avoids strategic ranking nightmares. Loses nuance.
          *   **Shrink:** "Each member names their *single* top choice from the 3 for this backup spot." If clear majority (≥2/3), that candidate is #1. If not, drop the least named candidate and revote majority between the top 2. *Effectively forces a path to majority rule, minimizing G-S exposure.* Less fair if all 3 are truly close?
      *   *Why it's unpleasant:* You lose the desired nuanced ranking. But G-S says trying to get that nuanced ranking with *any* non-dictatorial rule invites potential strategy. Approval or forcing a top choice/majority runoff reduces that risk significantly. *The theorem pushes you towards simpler, less information-rich methods when structure is lacking and stakes are high.*

  ---

  **WHERE THE THEOREM RUNS OUT (JUDGMENT CALLS):**

  *   **"Which manipulable rule is *least* manipulable in practice?"** (G-S is silent. Evidence suggests Approval, Condorcet, Borda often perform better than Plurality/Runoff).
  *   **"Will manipulation *actually* happen *here*?"** (Depends on voters: savvy? motivated? ethical? transparent?).
  *   **"Is strategic voting even *bad* here?"** (Sometimes "compromising" is good! G-S treats all insincere voting as manipulation, but intent matters).
  *   **"Which rule feels most legitimate?"** (Cultural/political question, not formal).
  *   **"How much do we value preference intensity vs. just order?"** (Approval captures some intensity, ranking doesn't).

  **FINAL WARNING LABEL (Tape this at the bottom):**
  **G-S IS NOT A DOOMSDAY DEVICE.** It's a reality check. You can't *eliminate* the *possibility* of strategy with 3+ options, but you can *manage the risk* by choosing rules wisely (especially Approval!), structuring choices, and fostering good deliberation. Now go run that vote. Good luck in the stuffy seminar room! ☕
