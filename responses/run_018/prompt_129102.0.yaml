answer: |-
  ### Exam Question: Rationality and Constitutive Investments (90 minutes, 800–1000 words)  

  **Case Study:** The *Anomalous Physics Collaboration* (APC) is a 15-year multinational project investigating a rare physical effect. Despite rigorous experimentation across 12 laboratories, it has yielded *only null results*. Researchers acknowledge no breakthrough is likely. Yet they continue, arguing that abandonment would dissolve three irreplaceable goods:  
  1. A specialized epistemic community sharing tacit knowledge.  
  2. Shared methodological norms refined over 15 years.  
  3. Deep inter-laboratory trust enabling high-risk/high-precision science.  

  **Question:**  
  Critically evaluate whether the APC’s decision to honor sunk costs is rational. In your essay:  
  1. **Articulate** the standard forward-looking model of rational choice and its argument for ignoring sunk costs.  
  2. **Analyze** the APC case through "constitutive investment": how might sunk costs create *present constitutive reasons* (e.g., sustaining identity/community) irreducible to future utility?  
  3. **Address** the objection that this reasoning collapses into psychological attachment. Propose a *principled criterion* to distinguish legitimate path-dependent rationality from sunk cost fallacy.  
  4. **Evaluate** whether a coherent model of *diachronic rationality*—where history constrains choices non-instrumentally—can accommodate this case without abandoning the sunk cost critique’s core insight.  
  5. **Defend a clear position**: Is honoring sunk costs *always irrational*? Justify using the APC case.  

  ---

  ### Model Answer (Approx. 600 words)  

  #### (1) Standard Forward-Looking Rationality  
  The standard economic model treats rational agents as *time-slice expected utility maximizers*. Sunk costs—past expenditures irrecoverable now—are irrelevant to current decisions because rationality requires evaluating only *future consequences*. Continuing a project due to prior investment commits the sunk cost fallacy: it misallocates resources to failing endeavors, violating efficiency. For example, persisting with APC solely because of 15 years’ investment wastes funds better spent on promising alternatives.  

  #### (2) Constitutive Investment in the APC Case  
  The APC case challenges this model. Here, sunk costs are not merely wasted money but *constitutive investments* that formed:  
  - An **epistemic community** with shared language, trust, and problem-solving heuristics.  
  - **Methodological norms** enabling precise null-result science (e.g., calibrating instruments across labs).  
  - **Relational capital** allowing high-stakes collaboration.  
  Abandoning the project would *dissolve these constitutive elements*, destroying present value *unrelated* to future discoveries. The researchers’ rationale is not “We might succeed” but “This community *is* valuable”—a reason grounded in the *identity* forged by past investment, not anticipated outcomes.  

  #### (3) Distinguishing Constitutive Rationality from Bias  
  *Objection:* This resembles commitment bias (e.g., escalating devotion due to ego).  
  *Reply:* Legitimate path-dependence requires:  
  > **The Revisable Contribution Criterion (RCC):** Sunk costs generate rational constraints *only if* they created a *revisable* practice/identity that (a) enables valued agency, and (b) would be *disproportionately costly* to recreate.  
  For APC, dissolution destroys 15 years’ accumulated trust and tacit knowledge—recreating it elsewhere would require similar investment. Conversely, persisting due to “pride” or “loyalty” alone fails RCC: those motives lack functional value and resist revision.  

  #### (4) Diachronic Rationality Without Instrumentalization  
  Diachronic rationality acknowledges agents as temporally extended entities whose history *non-instrumentally* shapes present reasons. Honoring APC’s investment sustains the community *as a good in itself*, not a tool for future utility. This does not undermine the sunk cost critique: RCC prevents *all* past costs from mattering—only those constituting *enduring frameworks for agency*. The core insight (avoid throwing good money after bad) remains intact: if APC’s community ceased enabling science (e.g., norms became obsolete), continuing *would* be fallacious.  

  #### (5) Position: Sunk Costs Are Not *Always* Irrational  
  Honoring sunk costs is rational *only when* they meet RCC. In APC, dissolution annihilates constitutive goods that enable scientific agency and cannot be costlessly replaced. Here, honoring sunk costs is *identity-maintaining*, not future-chasing. To abandon APC solely to avoid “fallacy” would ignore the *actual value* of its epistemic community—a value created by the investment itself. Thus, rigid adherence to time-slice rationality is *itself irrational* when agency is constitutively embedded in history.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-Grade (16–20):** Exceeds requirements; synthesizes concepts; original critique of atomistic agency.  
  **B-Grade (13–15):** Meets requirements competently but lacks synthesis or precision in key moves.  

  #### Part 1: Standard Model (3 marks)  
  - **A (3):** Explicitly identifies *atomistic agency* (agent as ahistorical optimizer) as foundational.  
  - **B (2):** Describes forward-looking logic but misses agency-structure critique.  
  - *Common error:* Paraphrasing "ignore sunk costs" without linking to time-slice ontology.  

  #### Part 2: Constitutive Analysis (4 marks)  
  - **A (4):** Uses APC to show *dissolution of epistemic community* as non-instrumental loss (not emotional attachment).  
  - **B (3):** Notes community loss but frames it as emotional/psychological.  
  - *Common error:* Reducing "trust" to interpersonal sentiment rather than epistemic infrastructure.  

  #### Part 3: Criterion Proposal (4 marks)  
  - **A (4):** Offers a *structural, revisable* criterion (e.g., RCC) with functional thresholds (e.g., "disproportionate recreation cost").  
  - **B (3):** Proposes a criterion but relies on intuition (e.g., "if it feels meaningful").  
  - *Common error:* Defining legitimacy via subjective commitment without external checks.  

  #### Part 4: Diachronic Rationality (4 marks)  
  - **A (4):** Argues history constrains agency *non-instrumentally* (e.g., APC community as end-in-itself) without denying sunk cost insights.  
  - **B (3):** Describes diachronic agency but collapses constitutive value into future utility.  
  - *Common error:* Claiming "community enables future projects" (instrumentalizing the loss).  

  #### Part 5: Position & Defense (5 marks)  
  - **A (5):** Nuanced stance (e.g., "sometimes rational under RCC") using APC to show *constitutive dissolution* as decisive.  
  - **B (4):** Absolute position ("always irrational" OR "rational here") without engaging RCC/APC structure.  
  - *Common error:* Asserting "it depends" without principled justification from Parts 2–4.  

  ---
  **Rationale:** This design tests higher-order analysis by forcing engagement with *constitutive value*—a niche but philosophically robust challenge to orthodox rationality. The marking scheme prioritizes identifying structural assumptions (e.g., atomism) and constructing non-circular criteria over recitation.
