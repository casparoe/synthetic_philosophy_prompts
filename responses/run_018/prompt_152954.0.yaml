prompt: |-
  I'm taking a course on social ontology and find the Lewis literature a little dry, but my friend talked me into moderating a podcast interveiw next week with a philosopher who just wrote a book extending David Lewis's account of convention to what she calls distributed micro-norms — like the unwritten rules for correcting strangers in open-source threads, or the etiquette of reblogging without attribution. She insists she's still doing straight Lewisian work, not just evolutionary game theory, but I have a feeling she'll deflect hard questions by saying the digital context is only a fresh application of the same old framework.

  Could you draft seven or eight interview questions that actually press on the content? I want at least one that targets the common-knowledge requirement when participants are anonymous and constantly rotating in and out, one that asks whether the arbitrariness condition collapses when platform architecture forces specific coordination points, and one about what the clause about behavior being regular across the group even means when enforcement is partly handled by bots or algorithms. For each of those, please include the follow-up she's most likely to use — maybe something about scalability or about treating algorithms as part of the agent pool — and then the sharper counter-follow-up that makes the dodge harder. Write the response in American English, and please don't include any requests for bibliographies, citations, or reading lists; I want her to defend the position directly, not name-drop papers.
reasoning: |-
  Okay, the user is taking a social ontology course and finds David Lewis's work on convention dry. They're moderating a podcast with a philosopher who extended Lewis's account to "distributed micro-norms" in digital spaces. The user wants questions that press on the content, specifically targeting anonymity, platform architecture, and algorithmic enforcement. They also want follow-ups and counter-follow-ups to prevent deflections. 

  First, I need to recall Lewis's key points: conventions solve coordination problems, require common knowledge, are arbitrary, and involve regular behavior. The philosopher applies this to online norms like correcting strangers in open-source threads or reblogging etiquette. The user suspects she might deflect by saying it's just a fresh application. So the questions need to challenge the core concepts in digital contexts.

  The user specified three key areas: common knowledge with anonymity, arbitrariness under platform constraints, and group regularity with algorithmic enforcement. For each, I need a main question, a predicted dodge, and a counter-follow-up. Let me break these down.

  For common knowledge: In Lewis, common knowledge is mutual awareness that everyone knows the norm. But online, anonymity and fluid participation disrupt this. How can participants know what others know? The philosopher might dodge by appealing to scalability or emergent knowledge. The counter should question if this stretches Lewis's definition too far.

  Arbitrariness: Lewis says conventions are arbitrary because alternatives could work. But platform design forces specific behaviors (like retweet buttons). If the architecture mandates actions, is it still arbitrary? The dodge might be that norms emerge despite constraints. Counter: if the platform removes choice, isn't it more like a rule than a convention?

  Algorithmic enforcement: Norms are group behaviors, but bots enforce rules. Does this count as group regularity? Dodge: treat algorithms as part of the agent pool. Counter: if bots act without intentionality, does it fit Lewis's view of agents? Also, how do norms form when enforcement is automated?

  Beyond these, I should cover other aspects. Coordination problems: Are micro-norms really solving coordination issues, or just governance? Normativity: How do Lewisian conventions explain "should" in digital spaces? Emergence: Can micro-norms form without explicit agreement in fast-changing digital groups? Scale: Lewis focused on small groups; does scaling up change the dynamics?

  The user wants direct engagement, no citations. Questions should be sharp but not hostile. The counter-follow-ups need to anticipate dodges and push deeper. Let me ensure each question has a clear target, predicted deflection, and a counter that forces the philosopher to clarify or defend her position without relying on "it's just an application."

  Also, the examples given (open-source corrections, reblogging etiquette) should be referenced to ground the questions. This makes it concrete. I'll avoid jargon where possible, but some terms like "common knowledge" are necessary. The responses should be in American English, so contractions and direct phrasing are good.

  Structure each question with:
  1. Main question targeting a core Lewisian concept in digital context.
  2. Predicted dodge based on scalability or other extensions.
  3. Counter-follow-up that challenges the dodge and ties back to Lewis's original framework.

  Make sure there are 7-8 questions total, covering the three specified areas plus additional angles. The goal is to make the philosopher defend her position directly, avoiding deflections to broader applications.
answer: |-
  Here are eight interview questions designed to press the core Lewisian framework in digital contexts, including your specified focus areas, with anticipated dodges and sharper counter-follow-ups. The phrasing forces direct engagement with Lewis's core criteria:

  1.  **Question (Common Knowledge & Anonymity):** "Lewis's common knowledge requirement hinges on mutual recognition of the convention and others' awareness of it. How does this hold in spaces like open-source forums with anonymous, transient participants who often lack shared history? How can 'everyone knows that everyone knows...' function when 'everyone' is a constantly changing, faceless crowd?"
      *   *Predicted Dodge:* "Common knowledge scales differently online; it's emergent through repeated patterns visible in the public record of interactions. The 'knowledge' is in the observable digital traces, not individual minds."
      *   **Counter-Follow-Up:** "But Lewis requires mutual recognition *among the agents themselves*. If Participant A today has no way to know if Participant B tomorrow has seen the same pattern trace, or even cares, doesn't this reduce common knowledge to mere *statistical* regularity observed by an *outsider* (like us analysts), rather than a shared cognitive state coordinating *their* actions?"

  2.  **Question (Arbitrariness & Platform Constraints):** "Lewis emphasizes the *arbitrariness* of conventions – that another regularity *could have* served just as well. But digital platforms impose rigid architectures: specific 'report' buttons, forced reply structures, algorithmic content sorting. Doesn't this architecture often *dictate* the coordination point, making the resulting 'norm' (like using the official report flow) non-arbitrary in the Lewisian sense because viable alternatives *are structurally excluded*?"
      *   *Predicted Dodge:* "Norms emerge *within* the constraint space. Users still coordinate on *how* to use the report button effectively, or develop unwritten rules *around* the platform's features – that's where the arbitrariness persists."
      *   **Counter-Follow-Up:** "If the platform's design functionally *mandates* a specific behavior to achieve coordination (e.g., you *must* use *this* button to report), and actively suppresses alternatives, is the resulting regularity still usefully called a 'convention'? Or is it closer to a rule *enforced* by the system, where the 'could have been otherwise' clause collapses because the platform owner removed the alternatives?"

  3.  **Question (Regularity & Algorithmic Enforcement):** "Lewis defines convention as a regularity in behavior *across the group*. But when enforcement is automated – like bots flagging 'impolite' phrasing or algorithms demoting unreferenced reblogs – how much of the 'regularity' is genuine agent behavior versus top-down programming? What does 'the group' even refer to when key 'enforcers' aren't participants but tools?"
      *   *Predicted Dodge:* "We should treat the algorithm as part of the environment *or* as an agent within the system. Agents coordinate their behavior *in response to* the algorithm's predictable actions, maintaining the regularity. The 'group' includes those interacting with and adapting to the system."
      *   **Counter-Follow-Up:** "Lewisian agents coordinate based on preferences and expectations about *other agents*. If the enforcer is an algorithm acting on fixed rules, not preferences or expectations, does folding it into 'the group' fundamentally redefine Lewis's concept of agency? Doesn't this risk conflating *compliance with automated rules* (like stopping at a red light) with *conventional coordination among intentional agents* (like driving on the right)?"

  4.  **Question (Coordination Problem Core):** "Lewis roots convention in solving recurring *coordination problems*. Many digital micro-norms you describe – like attribution etiquette or correction styles – seem more about conflict avoidance, status management, or governance than pure coordination (e.g., agreeing which side of the road to drive on). Could you pinpoint the *specific coordination problem* solved by, say, the 'proper' way to correct a stranger in an open-source thread?"
      *   *Predicted Dodge:* "It coordinates expectations to enable smooth collaboration. Without it, you have chaos, wasted effort correcting corrections, or people avoiding participation altogether – hindering the *coordinated* goal of the project."
      *   **Counter-Follow-Up:** "Isn't the core problem there often about *fairness*, *efficiency*, or *power dynamics* rather than coordinating complementary actions? How does avoiding a flame war constitute solving a coordination problem in the strict Lewisian sense of finding a mutually beneficial equilibrium where *alignment of action* is key?"

  5.  **Question (Normativity vs. Regularity):** "Lewis is careful to distinguish mere behavioral *regularities* (people often do X) from genuine *conventions* (people do X *because* they expect others to do X and prefer conformity). How do you empirically distinguish this crucial expectation/preference layer in distributed, often ephemeral digital interactions where explicit articulation is rare? How do we know it's not just copy-catting or fear of bot-moderation?"
      *   *Predicted Dodge:* "We infer it from the patterns: the reactive enforcement (even if algorithmic), the justifications offered when norms *are* discussed, the observable adjustments people make to avoid sanctions. The 'because' is revealed in the system dynamics."
      *   **Counter-Follow-Up:** "Doesn't relying on 'system dynamics' risk circularity? We see enforcement (bot or human) and call it a convention, then point to the enforcement as evidence of the expectation/preference. How do you *independently* verify the Lewisian mental states driving the regularity?"

  6.  **Question (Emergence without Agreement):** "Lewis conventions often emerge from explicit agreement or salient precedents. Digital micro-norms seem to bubble up from countless decentralized interactions, potentially without any 'focal point' moment. Does this distributed emergence process, lacking clear precedent-setting events or agreements, genuinely fit Lewis's model, or does it demand a fundamentally different mechanism?"
      *   *Predicted Dodge:* "Lewis allows for gradual, evolutionary emergence. The 'precedent' is iterated micro-interactions. Online, the sheer volume and visibility *create* salience – the successful pattern *becomes* the focal point."
      *   **Counter-Follow-Up:** "But without a shared context or history for participants (due to anonymity/churn), how does a *particular* micro-interaction gain salience as a precedent *across the whole group*? Doesn't Lewisian salience typically require a shared perceptual or cognitive anchor that's often absent?"

  7.  **Question (Scale & Group Boundaries):** "Lewis typically imagined conventions within bounded groups. 'Distributed micro-norms' often span vast, fuzzy networks (e.g., 'Tumblr etiquette'). How do you define the relevant 'population P' for a given micro-norm in this fluid context? Doesn't the potential for multiple, overlapping, or conflicting micro-norms within the same platform space challenge the idea of a single group-wide regularity?"
      *   *Predicted Dodge:* "The 'group' is defined by participation in a specific practice or subcommunity. Norms are often niche-specific. The boundaries are porous, but conventions operate within identifiable, self-reinforcing clusters of interaction."
      *   **Counter-Follow-Up:** "If the boundaries are porous and norms are niche-specific, how do new entrants *discover* which specific micro-norm cluster they've stumbled into? If they get it wrong and are sanctioned, doesn't that suggest the 'common knowledge' prerequisite fails at the crucial point of entry, undermining the coordination?"

  8.  **Question (Intentionality & the "Reason" Clause):** "Lewis states agents conform to a convention *because* they believe others conform and expect them to conform, etc. This seems to require intentionality. How does this apply when behavior is heavily shaped by non-conscious algorithmic nudges (e.g., auto-suggested replies, pre-filled hashtags) or simply mimicking visible top-voted behavior without reflection? Is the Lewisian 'reason' still operative?"
      *   *Predicted Dodge:* "The nudges shape the environment, but agents still *choose* to follow the suggestion or mimic the popular behavior *because* they recognize it as the prevailing norm within that context. The intentionality is in the adoption."
      *   **Counter-Follow-Up:** "But if the primary reason for using the auto-suggested reply is convenience or speed, not an active belief/expectation about others' conformity to a specific norm, does it still count as acting *because of the convention*? Doesn't this dilute the intentional, expectation-driven core of Lewis's definition?"

  **Key Strategies Embedded:**
  *   **Anchoring in Lewis:** Each question explicitly ties back to a specific Lewisian criterion (common knowledge, arbitrariness, regularity, coordination problem, reason for conformity, etc.).
  *   **Concrete Digital Examples:** References to open-source corrections, reblogging, bots, algorithms, anonymous forums, etc., ground the challenge.
  *   **Anticipating Deflections:** The predicted dodges reflect common ways to stretch the framework ("scaling," "treating tech as agent/environment," "emergence," "inference"). The counters force the issue back onto Lewis's original, more demanding requirements.
  *   **Demanding Specificity:** Questions push for the *mechanism* (how does common knowledge *actually work*?), the *distinction* (how is this not just regularity/compliance?), and the *core applicability* (is the coordination problem/arbitrariness/reason truly present?).
  *   **Avoiding Bibliographic Escape:** Focuses on defending the conceptual fit within Lewis's framework, not citing other literature.

  Good luck with the interview! These should push beyond the "fresh application" surface.
