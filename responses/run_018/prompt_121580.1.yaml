     - Alternatively, if the brand is not considered an entity in our authority file (we only do people, corporate bodies, places, works) then we might not have a record for the brand. Instead, the brand name would be a variant name for the original company during its operation and then for the larger firm after the merger. But note: the brand is not an entity, so we don't create a record for it. We only record the corporate bodies.

