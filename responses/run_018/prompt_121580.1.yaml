prompt: |-
  Hi — I work on the data team of a small consortium that publishes a shared authority file for museum and archive catalogs: people, corporate bodies, places, works, one record per entity, everybody downstream pulls from our URIs. What actually fills our week is merge proposals — two records that might be the same person, firm, or place, and someone has to decide whether they become one record or just get linked. It's maybe 20–40 of these a week, they're triaged by rotating catalogers and two interns who have about five to ten minutes each and no research time, and anything irreversible has to be signed off by our senior editor, who is a career librarian, extremely patient, and will not read a line of philosophy. Bad merges are quietly catastrophic because other institutions have already copied the URI and we can't recall it. I also suspect part of the problem is that we currently just use owl:sameAs for every kind of connection we make.

  I did a philosophy minor years ago and halfway through a lunch argument with a colleague I dredged up Frege's puzzle about identity — the morning star/evening star sort of case, where an identity statement can be a genuine discovery and tell you something, while the trivial self-identity tells you nothing, even though both are about one and the same thing. My colleague says this has nothing whatsoever to do with our work: if two records refer to the same thing, obviously they should be one record. I think he's wrong, but I can't turn the intution into something my team could actually run, and "be careful about sense and reference" is not instructions anyone can follow. So what I want is a procedure: an ordered checklist in words that a cataloger with zero philosophy can run on a merge proposal in under ten minutes, with what counts as a sufficient answer to each question, clear STOP-with-a-no points, and clear "hand this to a human because it's a values call rather than a fact" points.

  Some things I think have to survive the translation, though please organize it however is actually right rather than following my list: identity always being identity *under a sortal* (the same person, the same legal entity, the same continuing brand, the same city, the same river — so if no single sortal covers both records, that's a relation, not a merge); a distinction between terms that rigidly tag one thing whether or not any description happens to fit (a personal name, a registry number) and flaccid role-descriptions like "the director", "the artist of this work", "the firm then trading as X", which can be true of different things at different times and probably shouldn't be merged with anything, only time- or role-indexed; and the case where an identification is true but definitely informative — a notname finally attached to a named painter, a pen name, a maiden name — where I take it the merge is fine at the level of reference but rewriting every older sentence that used the other name is not. For that last part I want an actual test my catalogers can run in their heads for when swapping one term for another is unsafe: belief reports, quotations, attributions, "the artist of", modal and temporal contexts, and cases where the source was simply mistaken or the thing referred to doesn't exist. Give me a small set of test sentences with the verdict for each, and say which verdicts are judgment calls dressed up as rules. Also tell me plainly what the procedure cannot do, and separately flag where a wrong merge fails *silently* downstream instead of loudly — that's the bit I actually lie awake about.

  Then please run it on three cases. (1) A proposal to merge a record for an anonymized fifteenth-century painter known only by a conventional nickname — say "Master of the Blue Annunciation", I'm making that up — with a record for a named artist, on the strength of one recent attribution that maybe half the field accepts. (2) A proposal to merge the record for a manufacturing company that was absorbed into a larger firm in a merger and whose name lived on afterwards as a brand: same entity or not, and if "not", what do we put there instead? (3) The one I already know you'll annoy me on: our objects database has a painting whose own historic catalog card attributes it to a famous old master, current scholarship gives it to a pupil in his workshop, and the marketing team wants it merged into the famous painter's record so it surfaces in search on the site. If the procedure says no, I need one paragraph I can paste to the marketing people explaining why, and it can't use the words "sense", "reference", or "opaque". Long answers and bullet points very welcome, and please don't assume I remember any of the terminology.
reasoning: |-
  We are designing a procedure for handling merge proposals in an authority file system. The goal is to prevent bad merges that could lead to silent errors downstream. The procedure must be executable by catalogers with no philosophy background in under 10 minutes per proposal. It will include clear stop points, points where human judgment is required, and tests for when term substitution is unsafe.

  Key Principles to Incorporate:
  1. Identity under a sortal: Only merge if both records refer to the same entity under the same sortal (e.g., same person, same corporate body). If no single sortal covers both, then it's a relation, not a merge.
  2. Rigid vs. flaccid designators: 
     - Rigid designators (e.g., personal names, registry numbers) tag the same entity across all possible worlds (i.e., they are constant).
     - Flaccid designators (e.g., "the director", "the artist of this work") are role-dependent and may refer to different entities at different times. These should not be merged but linked with time/role qualifiers.
  3. Informative identities: When an identity is informative (e.g., attaching a notname to a known artist, pen names), merging is acceptable at the reference level, but we must not rewrite historical attributions. We need a test for unsafe term substitution.

  Procedure Outline:
  We will create an ordered checklist. Each step must have a clear outcome: continue, stop (do not merge), or refer to senior editor.

  Checklist for Merge Proposals:

  1. **Same Sortal?**
     - Check: Are both records intended to represent the same kind of entity? (e.g., both are persons, both are corporate bodies, both are places)
     - If no (e.g., one is a person and one is a corporate body), then **STOP: Do not merge**. Instead, consider creating a relation (e.g., "associated with") if appropriate.
     - If yes, proceed.

  2. **Rigid Identifier Match?**
     - Check: Do both records share any rigid identifier? (e.g., same birth/death dates for a person, same official registration number for a firm, same geographic coordinates for a place) 
     - If yes, and the identifiers are consistent (no conflict), then proceed to step 4 (bypassing step 3 because we have a strong indicator).
     - If no, or if there is a conflict in rigid identifiers, proceed to step 3.

  3. **Flaccid Designators Only?**
     - Check: Are the designators in both records primarily flaccid? (e.g., one record is "The Director of the Metropolitan Museum in 1990" and the other is "John Smith", but without a rigid link)
     - If both records are based solely on flaccid designators (without any rigid anchor) and no rigid link exists, then **STOP: Do not merge**. Instead, create a time-specific or role-specific relation.
     - If one record has a rigid designator and the other is flaccid, but there is evidence they refer to the same entity, then proceed to step 4. But note: this evidence must be evaluated.

  4. **Evidence Assessment for Identity:**
     - Check: Is there evidence that the two records represent the same entity? (e.g., scholarly attribution, historical documents, etc.)
     - If the evidence is:
          - Strong and uncontroversial (e.g., widely accepted by experts, multiple independent sources): Proceed to step 5.
          - Weak, controversial, or based on a single source: **Refer to senior editor** for judgment.
          - No evidence: **STOP: Do not merge**.

  5. **Test for Unsafe Term Substitution (for when we are about to merge):**
     - We must ensure that merging does not lead to incorrect historical attributions. We are going to test whether substituting one designator for the other in various contexts would change the truth of statements made in the past.
     - The cataloger should consider: Would replacing the old term (from one record) with the new merged term (or vice versa) in the following contexts alter the truth of the original statement?
          a. **Belief reports**: If the original source said, "I believe that [Old Term] painted this," would replacing [Old Term] with the merged term change what the source believed? (Example: If a source said "I believe the Master of the Blue Annunciation painted this," and we merge to "Giovanni Bellini", then substituting would make it "I believe Giovanni Bellini painted this" — which might not be what the source believed. So substitution is unsafe.)
          b. **Quotations**: If the source used the old term in a direct quote, substitution would misrepresent the quote.
          c. **Attributions**: If the attribution was made at a time when the identity was not known, substitution would misrepresent the historical state of knowledge.
          d. **Modal contexts**: If the statement is about possibility (e.g., "It might have been the Master of the Blue Annunciation"), substitution could change the meaning.
          e. **Temporal contexts**: If the statement is about a specific time (e.g., "The artist of this work in 1490 was the Master of the Blue Annunciation"), substitution might be safe if the identity is fixed, but if the term was used for a role then it's unsafe.
          f. **Mistaken identity**: If the source was mistaken (e.g., they said "Michelangelo" but it was actually someone else), then substitution would propagate the error.

     - How to run the test in practice:
          - For each record to be merged, consider the key fields (e.g., the name, the description) and the context in which they were used in the original records and in downstream data.
          - Ask: If we replace the old term (from one record) with the merged term (or the other record's term) in any of the above contexts, would the meaning of the original statement change?
          - If substitution would change the meaning in any of these contexts, then **we must not merge without preserving the original designator as an alternative**. In practice, if a merge is done, the old designator must be retained as an alternative label (with appropriate qualifiers) and not replaced in historical contexts.

     - Verdicts for test sentences (examples to think through):
          - Safe substitution: "The artist is the Master of the Blue Annunciation" (if we merge to Giovanni Bellini) becomes "The artist is Giovanni Bellini" — if the identity is certain, this might be safe for current statements but unsafe for historical ones? 
            - Actually, for historical records, we must preserve the original attribution. So in the authority record, we can have the identity, but in the object record that attributes the painting, we must not change the original attribution. Instead, we can add a note with the current scholarship.

     - Rule: If substitution is unsafe in any of the above contexts (which it often will be for historical attributions), then:
          - The merge may still be done (if identity is established) but the original designator must be preserved as an alternative label (with a note on the context, e.g., "previously attributed to" or "used as a notname for").
          - In the authority record, we can have multiple names (with qualifiers) and indicate which one is the current preferred one.

     - However, if the unsafe contexts are pervasive and the original designator was used in a way that is fundamentally a different entity (e.g., a fictional character) then the merge might be invalid. This is a judgment call.

     - Therefore, after this step:
          - If substitution is safe in all expected downstream uses (rare for historical data), then proceed to merge and replace terms.
          - If substitution is unsafe in some contexts (common), then **Merge but preserve the original designators as alternatives with context notes**. (This is acceptable and the procedure allows it.)
          - If substitution is unsafe and the identity itself is in doubt (the evidence is that they are different), then **STOP: Do not merge**.

  6. **Final Check for Silent Failures:**
     - Consider: If we merge, what could go wrong silently?
          - Downstream systems that copied the old URI might now get a merged record that includes information that was not originally associated with that URI. For example, if a museum used the old URI for the Master of the Blue Annunciation in their catalog, and we merge it to Giovanni Bellini, then when they pull our record, they get Giovanni Bellini's record, which includes paintings that were never attributed to the Master. This could lead to false associations.
     - To mitigate: 
          - Always preserve the original URIs as aliases? But note: we cannot recall URIs. Instead, we can deprecate the old URI and provide a redirect to the merged URI, but with a note that the old URI is now part of the merged record. However, if the merge is bad, this is irreversible.
          - Therefore, the only safe way is to be very sure of the merge. If there is any doubt, do not merge.

     - Action: 
          - If the merge is judged to be correct and the above steps are passed, then merge and deprecate the old URI with a note about the merge.
          - If there is a risk of silent failure (e.g., because the evidence is not conclusive and downstream might have used the old URI for a different context), then **Refer to senior editor**.

  Summary of Stop/Refer Points:
  - STOP at step 1 (different sortals), step 3 (only flaccid designators without rigid link), step 4 (no evidence), step 5 (identity in doubt despite evidence).
  - Refer to senior editor at step 4 (weak or controversial evidence) and step 6 (risk of silent failure).

  What the Procedure Cannot Do:
  - It cannot guarantee that a merge is correct; it only minimizes the risk.
  - It cannot fix bad merges after the fact because URIs are permanent.
  - It cannot resolve deep philosophical issues; it is a practical heuristic.

  Now, let's run the procedure on the three cases.

  ---

  **Case 1: Master of the Blue Annunciation and a named artist**

  - Step 1: Same sortal? Both are persons. Yes.
  - Step 2: Rigid identifier match? Probably not. The Master is an anonymized painter without a known identifier (like a birth name). The named artist has a name and possibly dates. So no rigid match. Proceed to step 3.
  - Step 3: Flaccid designators only? The Master is a flaccid designator (a role: the artist who painted a specific work). The named artist is a rigid designator (a specific person). But note: the named artist might be the same as the Master. So we proceed to step 4.
  - Step 4: Evidence? One recent attribution, accepted by about half the field. This is weak and controversial. **Refer to senior editor**.
     - If the senior editor decides there is enough evidence to merge, then we proceed to step 5.
  - Step 5: Test for unsafe substitution.
     - Consider: If we merge, then substituting "Master of the Blue Annunciation" with "Giovanni Bellini" (the named artist) in an old attribution would be unsafe because the original source did not know or claim that it was Bellini. They used the notname to refer to the artist without knowing the identity.
     - Therefore, we must preserve the notname as an alternative label. The merge can be done, but the old record must be kept as a variant with a note: "Attributed to the Master of the Blue Annunciation, now identified by some scholars as Giovanni Bellini."
  - Step 6: Silent failure? If we merge, downstream systems that used the Master's URI for attributions in their records will now get the merged record (Giovanni Bellini). This might lead to over-attribution to Bellini if the identification is not accepted by everyone. This is a risk. **Refer to senior editor** for final decision given the controversy.

  **Verdict for Case 1**: Refer to senior editor at step 4 and step 6. If merged, preserve the notname and note the controversy.

  ---

  **Case 2: Manufacturing company absorbed in a merger, name lives on as a brand**

  - Step 1: Same sortal? Both records are for corporate bodies? We have one record for the original company and one for the brand? Actually, we have one record for the original company and we are considering merging it with the record for the brand (or perhaps the record for the larger firm). Let me clarify: 
