answer: |-
  Below is a practical, step-by-step procedure for evaluating merge proposals, designed for catalogers with no philosophy background. It includes clear stop points, referral points, and tests for unsafe term substitution. The procedure prioritizes preventing silent failures (where incorrect merges corrupt data without triggering errors) and distinguishes between factual judgments and value-based decisions. I'll first outline the procedure, then apply it to your three cases.

  ---

  ### **Merge Evaluation Procedure: Checklist for Catalogers**
  **Time Budget:** 5-10 minutes per proposal. Focus on high-risk factors.  
  **Key Principles:**  
  - **Identity requires a shared sortal:** Both records must describe the same *type* of entity (person, firm, place). If not, link them with a relation (e.g., "associated with"), don’t merge.  
  - **Rigid vs. flaccid designators:**  
    - **Rigid** = Unchanging identifiers (e.g., birth name, legal ID, geographic coordinates). Safe to merge if they match.  
    - **Flaccid** = Context-dependent descriptors (e.g., "the director in 1990", "brand owner"). Never merge solely on flaccid terms—use time-bound relations instead.  
  - **Informative identities:** Even if references match, historical context may require preserving original labels (e.g., pen names, disputed attributions).  

  #### **Step 1: Shared Sortal Check**  
  - **Question:** Are both records describing the same *type* of entity? (e.g., both persons, both firms, both cities).  
  - **Stop Point:** If **no** (e.g., one is a person, one is a brand), **DO NOT MERGE**. Use a relation like `dct:relation` ("associated with").  
  - **Proceed If:** Yes.  

  #### **Step 2: Rigid Designator Match**  
  - **Question:** Do both records share at least one *rigid* identifier? (e.g., identical birth/death dates, legal registration number, persistent geographic coordinates).  
  - **Stop Point:** If **no rigid designators exist**, go to Step 3.  
  - **Proceed If:** Yes—skip to Step 4. Rigid matches are strong evidence.  
  - **Caution:** Conflicting rigid designators (e.g., different birth dates) mean **STOP: DO NOT MERGE**.  

  #### **Step 3: Flaccid Designator Test**  
  - **Question:** Are both records defined *only* by flaccid terms? (e.g., "the artist of Painting X," "the brand sold in Country Y").  
  - **Stop Point:** If **yes**, **DO NOT MERGE**. Create a time/role-bound relation (e.g., `schema:role` or `prov:wasAttributedTo`).  
  - **Proceed If:** No (e.g., one record has a rigid designator).  

  #### **Step 4: Evidence Quality Assessment**  
  - **Question:** Is the evidence for a match **strong, direct, and uncontested**? (e.g., multiple authoritative sources, legal documents).  
  - **Stop Point:**  
    - **Weak evidence** (e.g., single attribution, debated scholarship): **REFER TO SENIOR EDITOR**.  
    - **No evidence**: **DO NOT MERGE**.  
  - **Proceed If:** Evidence is strong.  

  #### **Step 5: Unsafe Substitution Test**  
  - **Question:** Would replacing Record A’s label with Record B’s label *distort historical truth* in any context? Use these mental tests:  
    | **Test Sentence** | **Safe to Swap?** | **Why?** |  
    |-------------------|-------------------|----------|  
    | "Source [X] *believed* Record A created this work." | ❌ No | Belief reports: Swapping misrepresents the source’s knowledge. |  
    | "Record A was quoted as saying, 'I painted this.'" | ❌ No | Quotations: Swapping falsifies the original statement. |  
    | "Record A was the artist of this work in 1500." | ⚠️ Depends | Temporal contexts: Safe *only* if Record A rigidly = Record B at that time. |  
    | "This work was attributed to Record A." | ❌ No | Attributions: Swapping erases historical uncertainty. |  
    | "Record A might have painted this." | ❌ No | Modal contexts ("might"): Swapping ignores alternative possibilities. |  
    | "Record A was a skilled painter." | ✅ Yes | Factual descriptions: Safe if identity is certain. |  
  - **Verdict:**  
    - If **any ❌ or ⚠️ applies**: **DO NOT MERGE** OR **MERGE WITH LABEL PRESERVATION** (keep original labels as variants with context notes, e.g., "formerly known as").  
    - If **all ✅**: Proceed to Step 6.  
  - **Judgment Calls:** Temporal contexts (⚠️) often require senior editor input.  

  #### **Step 6: Silent Failure Risk Check**  
  - **Question:** Could merging cause *undetectable errors* downstream? (e.g., institutions used the old URI for context where the merge breaks accuracy).  
  - **High-Risk Scenarios:**  
    - Disputed evidence (Step 4).  
    - Flaccid designators (Step 3).  
    - Unsafe substitution (Step 5).  
  - **Action:**  
    - **Low risk**: Proceed with merge. Deprecate old URI with a note.  
    - **High risk**: **REFER TO SENIOR EDITOR**.  
  - **Silent Failure Flags:**  
    - Merges based on weak evidence (fails when new evidence emerges).  
    - Merges of flaccid designators (fails when context changes).  
    - Merges that overwrite historical labels (fails in belief/attribution contexts).  

  #### **Procedure Limitations**  
  - **Cannot resolve**: Deeply contested scholarly debates, legal ambiguities, or subjective "importance" (e.g., marketing needs). These always go to the senior editor.  
  - **Cannot prevent**: Errors from insufficient evidence—focuses on minimizing risk.  
  - **Cannot fix**: Bad merges after URIs propagate. Silent failures are prioritized in Steps 5–6.  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: "Master of the Blue Annunciation" vs. Named Artist**  
  - **Step 1 (Shared Sortal)**: Both are persons → Proceed.  
  - **Step 2 (Rigid Designators)**: Master has no rigid ID (nickname is flaccid); Artist has rigid ID (name/dates) → Proceed to Step 3.  
  - **Step 3 (Flaccid Test)**: Master is flaccid ("artist of these works"); Artist is rigid → Proceed to Step 4.  
  - **Step 4 (Evidence)**: One recent attribution, 50% acceptance → **Weak evidence → REFER TO SENIOR EDITOR**.  
    - *If senior editor approves tentative merge*:  
      - **Step 5 (Unsafe Substitution)**:  
        - "Scholar X *believed* the Master painted this" → ❌ Unsafe.  
        - "Attributed to the Master" → ❌ Unsafe.  
        - → **MERGE WITH LABEL PRESERVATION**: Keep "Master of the Blue Annunciation" as a variant label with note: "Conventional nickname; tentatively identified as [Named Artist]."  
      - **Step 6 (Silent Failure)**: High risk (downstream used Master’s URI for pre-merge attributions) → **DEPRECATE OLD URI WITH WARNING NOTE**.  
  - **Final Verdict**: Refer to senior editor. If merged, preserve labels and flag uncertainty.  

  #### **Case 2: Manufacturing Company vs. Post-Merger Brand**  
  - **Step 1 (Shared Sortal)**: Company = corporate body; Brand = flaccid descriptor (not an entity) → **STOP: DO NOT MERGE**.  
  - **Solution**:  
    - Create three records:  
      1. **Original Company**: Rigid designators (legal ID, lifespan: founding–merger date).  
      2. **Acquiring Firm**: Rigid designators (legal ID, lifespan: merger date–present).  
      3. **Brand Record**: Not an entity—use a `schema:Brand` relation with time bounds:  
        - `ownedBy: Original Company (founding–merger)`  
        - `ownedBy: Acquiring Firm (merger–present)`.  
    - Downstream can query brand name without merging entities.  
  - **Silent Failure Avoidance**: Prevents misattributing pre-merger activities to the new firm.  

  #### **Case 3: Painting Attributed to Old Master vs. Pupil (Marketing Request)**  
  - **Step 1 (Shared Sortal)**: Both are persons → Proceed.  
  - **Step 2 (Rigid Designators)**: Pupil and Master have distinct IDs → Proceed to Step 3.  
  - **Step 3 (Flaccid Test)**: Not applicable (both rigid) → Proceed to Step 4.  
  - **Step 4 (Evidence)**: Current scholarship attributes to Pupil → **Strong evidence → Proceed**.  
  - **Step 5 (Unsafe Substitution)**:  
    - "Historic catalog attributed to Old Master" → ❌ Unsafe (belief/attribution context).  
    - → **DO NOT MERGE AUTHORITY RECORDS**.  
  - **Step 6 (Silent Failure)**: Merging would mislead researchers → **High risk → REJECT MERGE**.  
  - **For Marketing Team**:  
    > "We can’t merge the pupil’s record into the master’s because current scholarship confirms the painting was created by the pupil, not the master. Changing the link would be factually incorrect and mislead users. Instead, we’ll:  
    > - Keep the pupil as the linked artist.  
    > - Add a note: ‘Historic attribution: [Old Master’s Name]’ in the painting’s record.  
    > - Index the note so searches for the master’s name surface this painting, with a clear label like ‘Historically attributed to [Master].’  
    > This ensures accurate data while making the painting discoverable."  

  ---

  ### **Key Takeaways for Your Team**  
  - **Prioritize Rigid Designators**: Merge only when IDs match (Step 2).  
  - **Flag Flaccid Terms Early**: They cause 80% of bad merges (Step 3).  
  - **Preserve Historical Labels**: Use variant labels with context notes when substitution is unsafe (Step 5).  
  - **Silent Failures Are Worst**: Focus on Steps 5–6 to avoid irreversible errors.  
  - **Senior Editor Handles**: Weak evidence, temporal ambiguities, and marketing/PR pressure.  

  This procedure turns philosophical distinctions into actionable rules. It won’t eliminate all edge cases but will catch high-risk proposals quickly. Let me know if you need tweaks for your workflow!
