  I recall that the PBR theorem rules out certain psi-epistemic models but doesn't resolve everything. Theories must account for interference, measurement outcomes, and partial decoherence. Conceptual distinctions like epistemic vs. ontic states and global vs. local descriptions are crucial. Formal constraints include unitarity, no-signaling, and Bell's theorem.

  Partial decoherence is probably the toughest requirement because it demands explaining the quantum-to-classical transition without a clear boundary. Theories that handle this well are few, like decoherence-based ones or objective collapse models. The negotiable item might be the interpretation of the wavefunction itself, as instrumentalist approaches can bypass ontology by focusing on predictions.

