answer: |-
  Okay, Professor! Welcome to the rabbit hole – it's deep, messy, and endlessly fascinating. Coming from CM physics, you know the power of clear desiderata. For wavefunction ontology, the landscape is defined by what a theory *must* explain to be taken seriously, versus where it has philosophical wiggle room. Let's break it down. Think of this as the "spec sheet" any interpretation needs to meet.

  **Core Quantum Phenomena (The Non-Negotiables):**

  1.  **Interference & Superposition:**
      *   **What:** Explain the patterns observed in double-slit experiments (electrons, photons, buckyballs!), quantum computing gates, neutron interferometry, etc. This is the hallmark quantum weirdness.
      *   **Why Hard Constraint:** This is the *defining feature* of quantum mechanics. Any theory that can't reproduce interference patterns isn't quantum mechanics anymore. It's table stakes.
      *   **Partial Decoherence Angle:** Must explain why interference *vanishes* under strong decoherence (e.g., why we don't see interference patterns for baseballs) but *persists* under partial decoherence (e.g., large molecules where the environment is 'noisy' but not fully destructive). The theory needs a *dynamical account* of the transition.

  2.  **Definite Measurement Outcomes:**
      *   **What:** When we look at a system prepared in a superposition (e.g., |spin up> + |spin down>), we *always* find it in *one* definite state (up *or* down). The "pointer" on the device clicks one way.
      *   **Why Hard Constraint:** This is empirical bedrock. Our entire experimental practice relies on definite outcomes. Theories that leave this ambiguous (e.g., naive "many worlds" without decoherence/apparent collapse) fail here.
      *   **Partial Decoherence Angle:** Must explain outcomes even in regimes where decoherence is *just* strong enough to make interference practically unobservable *but* the system hasn't fully classicalized. How does the "click" emerge from the underlying quantum substrate?

  3.  **Born Rule Statistics:**
      *   **What:** The probability of observing outcome `i` (e.g., spin up) is given by |<ψ|i>|² (or the density matrix equivalent).
      *   **Why Hard Constraint:** This is how QM connects theory to experimental data *quantitatively*. Any deviation would be experimentally detectable and falsify the theory. It's the numerical link between the wavefunction and the frequencies we observe.
      *   **Partial Decoherence Angle:** Must hold not just for pure states and perfect measurements, but also for mixed states arising from partial decoherence and imperfect measurements. How do the probabilities emerge from the ontology?

  **Crucial Conceptual Distinctions (Must Be Respected or Explained Away):**

  4.  **Epistemic vs. Ontic Indefiniteness:**
      *   **What:** Distinguish between "I don't *know* which slit the electron went through" (epistemic ignorance) and "The electron literally did *not* go through a definite slit" (ontic indefiniteness/superposition).
      *   **Why Hard Constraint:** The PBR theorem (which I know you've seen) explicitly targets this. Naive psi-epistemic views (where the wavefunction *only* represents ignorance of a definite underlying state) struggle badly here. PBR shows that for overlapping wavefunctions (like |slit1> and |slit1> + |slit2>), they *cannot* correspond to the same underlying physical state. The wavefunction must be *at least partially* ontic. A theory must either embrace ontic indefiniteness *or* provide a mechanism explaining why the distinction *appears* but isn't fundamental (e.g., some hidden variable theories). It can't just ignore it.

  5.  **Global State vs. Local Descriptions:**
      *   **What:** The wavefunction of the universe is a single, entangled object. Yet, we describe subsystems (like a lab apparatus) with reduced density matrices. How does the local, effective description relate to the global reality?
      *   **Why Hard Constraint:** Entanglement and non-locality (see below) force the global perspective. However, our practical physics and experience are local. A theory must either explain how local definite properties emerge from the global state (e.g., via decoherence and einselection) or provide a consistent framework where only the global state is real and local descriptions are approximations/illusions. Ignoring entanglement isn't an option.

  **Formal Constraints (The Physics Police):**

  6.  **Unitarity (at the Closed System Level):**
      *   **What:** The time evolution of the wavefunction for a system isolated from its environment is governed by the Schrödinger equation (or relativistic equivalent), which is unitary (preserves the norm and is reversible).
      *   **Why Hard Constraint:** It's the fundamental dynamical law of QM. It works spectacularly well for predicting interference, atomic transitions, scattering, etc. Deviations from unitarity for closed systems lack empirical support and break core quantum predictions. *However:* Theories can argue that *apparent* non-unitarity (collapse) arises when considering *open* systems interacting with an environment (decoherence) or via fundamental modifications (objective collapse). But the underlying theory for the *whole* must respect unitarity *or* have a compelling reason/modification consistent with all other constraints.

  7.  **No-Signaling:**
      *   **What:** It's impossible to use entangled states to transmit information faster than light. Bob's measurement outcome on his particle doesn't give him any information about *what* Alice chose to measure on hers, only about the *correlation* after comparing results.
      *   **Why Hard Constraint:** Violating no-signaling breaks special relativity causality. It's experimentally verified to incredible precision. Any ontological model *must* respect this. This constrains how "real" the wavefunction collapse or non-local effects can be.

  8.  **Bell's Theorem (Non-Locality/Contextuality):**
      *   **What:** Any theory reproducing QM predictions must be either non-local (actions/influences can be spacelike separated) or contextual (the value of a property depends on *how* it is measured).
      *   **Why Hard Constraint:** Bell's inequalities are violated experimentally. Therefore, any ontological model *must* incorporate either genuine non-locality (like Bohmian mechanics) or contextuality (like Consistent Histories or QBism) as fundamental features. You cannot have a perfectly local *and* non-contextual theory that reproduces QM.

  **The Big Filter & The Negotiable Item**

  *   **Which Requirement Eliminates the Biggest Chunk? You're right, it's Partial Decoherence / The Quantum-to-Classical Transition.** Many interpretations shine in idealized extremes (pure superposition *or* definite measurement) but get fuzzy in the messy middle ground:
      *   **Naive Copenhagen:** Shrugs, says "collapse happens *somewhere*". Where? When? For a buckyball diffracting? Unclear.
      *   **Many Worlds (without decoherence):** Says *everything* is always in superposition. Why don't *we* see superpositions of measurement outcomes? Needs decoherence to explain apparent collapse/branching.
      *   **Objective Collapse (GRW/DP):** Has a mechanism, but the parameters (when/how often collapse happens) are put in by hand to *match* where decoherence usually kicks in. Is it fundamental or just mimicking decoherence?
      *   **Psi-Epistemic (Post-PBR):** Explaining how the *appearance* of ontic indefiniteness/superposition arises *only* when decoherence is weak, while definite properties emerge when it's strong, is a major challenge for these views. How does the underlying definite reality "know" to behave like an indefinite wavefunction only sometimes?
      *   **Theories that handle it best:** Decoherence-based interpretations (like Zurek's Existential Interpretation, Consistent Histories, Everett/Decoherence combo) build the transition *dynamically*. Bohmian mechanics has definite particles *and* a guiding wave, so the transition is less dramatic (definiteness is always there, but the wave's influence wanes).

  *   **The Negotiable Item: Literal Ontological Status of the Wavefunction (The "Shut Up and Calculate" Escape Hatch)**
      *   **What:** Can a theory refuse to say whether the wavefunction is *really real* (a physical field, a component of reality) or *just* a calculational tool/information?
      *   **Why Negotiable:** The empirical content of QM lies in the *predictions* (probabilities for measurement outcomes) derived from the wavefunction/density matrix formalism. **Instrumentalist/Operationalist views (like some flavors of QBism or simply "Shut Up and Calculate") argue that *only* the predictive algorithm and its connection to experience matter.** They explicitly avoid committing to an underlying ontology. As long as the formalism *works* to predict phenomena (including partial decoherence – you calculate decoherence in the density matrix formalism!), they fulfill the *phenomenological* and *formal* constraints.
      *   **The Catch:** This doesn't satisfy the *philosophical* drive behind asking the psi-ontic/epistemic question. It sidesteps ontology entirely. For someone wanting to know "what *is* really happening?", this feels like a cop-out. But strictly speaking, in terms of delivering empirically adequate predictions for *all regimes*, including mesoscopic, it *can* work. It just refuses to answer the "reality" question.

  **The Desiderata Table (Casual Version):**

  | Category          | Requirement                      | Why It's Mandatory (Hard Constraint)                       | Why It's Tricky (Especially for...)                      |
  | :---------------- | :------------------------------- | :--------------------------------------------------------- | :------------------------------------------------------- |
  | **Phenomena**     | 1. Interference & Superposition  | Defines QM; basis of tech like quantum computing.          | Must work for "Schrödinger's cat" size objects too.      |
  |                   | 2. Definite Measurement Outcomes | What experiments show; foundation of empirical science.    | How does "click" emerge from fuzzy wave?                 |
  |                   | 3. Born Rule Statistics          | Connects math to real-world frequencies.                   | Must hold for messy, decohered systems.                  |
  | **Concepts**      | 4. Epistemic vs. Ontic Indef.    | PBR theorem: Wavefunction isn't *just* ignorance.          | Forces acceptance of "real" fuzziness or hidden vars.    |
  |                   | 5. Global vs. Local              | Entanglement is real & pervasive; we experience locality. | How does my lab bench emerge from universal entanglement? |
  | **Formal**        | 6. Unitarity (Closed Sys)        | Core QM dynamics; works incredibly well.                   | Apparent collapse needs explanation (open sys/mod?).     |
  |                   | 7. No-Signaling                  | Relativity demands it; confirmed by experiment.            | Limits how "real" and instantaneous collapse can be.     |
  |                   | 8. Bell's Theorem (Non-Loc/Cont) | Experiment forces non-locality or contextuality.           | Rejecting local realism is mandatory.                    |
  | **Big Filter**    | **Partial Decoherence / Q->C**   | Reality isn't just pure quantum OR pure classical.         | Most interpretations struggle with the *dynamical* emergence of classicality from quantum rules alone. |
  | **Negotiable**    | **Literal Wavefunction Reality** | Formalism predicts outcomes regardless of interpretation.  | Instrumentalism ("Shut Up & Calculate") avoids ontology but feels philosophically unsatisfying. |

  **In a nutshell:** A decent theory must **reproduce all quantum phenomena** (especially the messy mesoscopic stuff), **respect the implications of entanglement and non-locality/contextuality** (PBR, Bell), **obey the fundamental dynamics** (unitarity), **preserve causality** (no-signaling), and have a **coherent story for how definite experiences emerge** from the quantum formalism. **Partial decoherence is indeed the litmus test** that weeds out many contenders. You *can* technically dodge the ontology question (negotiable), but then you're not really playing the ontology game you got hooked on!

  Enjoy the dive! It's a glorious mess where deep physics meets deep philosophy. Don't expect a consensus anytime soon, but the constraints are what make the debate productive.
