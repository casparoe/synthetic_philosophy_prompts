  - **Camp B Prediction**: The baseline for the individual includes the structural fact that the disease is a collective threat and that a coordinated response is necessary. The individual's burden (the small risk) must be seen in the context of the alternative: without the policy, she and everyone else face a higher risk from the disease. Moreover, being one of many is relevant because the policy is only effective if all participate. Thus, the individual cannot reasonably reject the policy because her burden is small and the alternative (no policy) would leave her (and others) worse off in a way that is structurally interconnected.

  ### Crux 3: Distinction Between Counting Numbers and Counting Structural Patterns
  - **Question**: Whether there is a principled distinction between “counting numbers” and “counting structural patterns” in institutional design, and if so, what formal feature distinguishes them.
  - **Concrete Case/Reasoning**: The Distributed Archive Protocol (described below) is the test case for this crux. We will use it here as well for consistency.

