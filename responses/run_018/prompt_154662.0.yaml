  1. **Agreed Claims**: A numbered section of shared commitments about what contractualism requires.
  2. **Disagreements Table**: For each remaining dispute, state the precise formulation for Camp A and Camp B in their own words (using neutral wording for the framing of each row).
  3. **Cruxes**: Identify sub-questions (cruxes) that, if resolved, would move at least one camp. For each crux:
     - Specify a concrete case or line of reasoning both camps agree bears on it.
     - Record what each camp predicts or concludes about that case.
     - Include at least the three specified cruxes.
  4. **Concrete Test Case**: The Distributed Archive Protocol scenario. Both camps should state:
     - Whether the contractualist can justify the first option (preserving 10,000 records, costing the researcher's project) to the researcher.
     - Whether the contractualist can justify the second option (preserving the researcher's project, costing all 10,000 records) to any one record-holder.
     - Whether the multiplicity of record-holders changes what any one of them can reject.
  5. **Conclusion**: For each disagreement, indicate whether it is substantive or partly verbal. Specifically, address:
     - Whether the dispute over "aggregation" dissolves once both sides accept that the structural-interdependence view does not license sacrificing one for the greater good in the utilitarian sense.
     - Whether the pairwise-baseline view can accommodate institutional reasoning without contradiction.

  We are not to include bibliographies, reading lists, citations, or references to specific page numbers. We are not to ask the camps to agree on a final verdict.

  Let's proceed step by step.

  ## 1. Agreed Claims

  We list the shared commitments about what contractualism requires:

  1. Contractualism requires that principles be justifiable to each affected individual, not that they maximize aggregate welfare.
  2. The moral permissibility of a principle depends on whether it can be reasonably rejected by any individual.
  3. Reasonable rejection is grounded in the individual burdens that a principle imposes, relative to available alternatives.
  4. Contractualism rejects pure utilitarian trade-offs: one cannot justify imposing a severe burden on one person simply by pointing to a greater aggregate benefit to others.
  5. There is a distinction between (a) harming one person to prevent harm to others and (b) distributing unavoidable burdens. Contractualism is particularly concerned with the former and may allow certain patterns in the latter when burdens are unavoidable.

  ## 2. Disagreements Table

  We now list the remaining disputes. Each row will state a point of disagreement, and we will have two columns: one for Camp A's precise formulation and one for Camp B's.

  | Dispute Description | Camp A (Pairwise Baseline) Position | Camp B (Structural Interdependence) Position |
  |---------------------|--------------------------------------|---------------------------------------------|
  | **Baseline for Reasonable Rejection** | The baseline for assessing the burden on an individual for reasonable rejection is determined independently of the burdens on others; specifically, the presence or absence of other burden-bearers is not part of the baseline. | The baseline for assessing the burden on an individual for reasonable rejection in institutional contexts inherently includes the structural presence of others and the pattern of burdens they face, because the baseline is defined by the institutional structure. |
  | **Aggregation of Small Harms** | A principle that imposes a very large burden on one person to prevent many small burdens (of the same type) on others can always be reasonably rejected by the one, regardless of the number of others spared the small burden, because the small burdens are considered individually and do not aggregate. | A principle that imposes a very large burden on one person to prevent many small burdens on others may not be reasonably rejected by the one if the baseline for the one already assumes the structural interdependence of the group, and the alternative would impose a pattern of burdens that is worse for each when considered in the context of the group's structure. |
  | **Role of Multiplicity in Reasonable Rejection** | Whether an individual is one of many similarly situated is irrelevant to what that individual can reasonably reject; each individual's rejection is based solely on their own burden against a baseline that does not reference the number of others. | Whether an individual is one of many similarly situated can be relevant to what that individual can reasonably reject because the baseline against which burdens are measured is interdependent and the individual's reasonable expectations are shaped by the group context. |

  ## 3. Cruxes

  We now identify the cruxes and for each, a concrete case and the camps' predictions.

  ### Crux 1: Baseline Interdependence without Utilitarian Collapse
  - **Question**: Whether the baseline for measuring burden in Scanlon’s formula can include the presence or absence of other burden-bearers without collapsing into utilitarian aggregation.
  - **Concrete Case/Reasoning**: Consider a policy for building a dam that will save 10,000 people from a small annual flood risk (each facing a 0.1% risk of death) but will cause one person to lose their home and livelihood (a severe burden). The baseline for the one who loses their home is either (a) the status quo without the dam, which does not include the flood risks of others, or (b) a baseline that includes the existing flood risks and the collective need for protection.
  - **Camp A Prediction**: The baseline is the status quo without the dam. The one who loses their home suffers a severe burden that is not outweighed by the small risks to others, even collectively, because the risks to others are considered individually. Thus, the principle can be reasonably rejected by the one.
  - **Camp B Prediction**: The baseline for each person in the flood-prone area includes the collective risk and the need for a solution. The burden on the one who loses their home must be compared to the alternative: if the dam is not built, each of the 10,000 faces a small risk, but the pattern of risk is worse in aggregate. However, this is not utilitarian because the rejection is pairwise: the one person cannot reasonably reject the dam if the alternative baseline (no dam) leaves each of the 10,000 with a burden (the risk) that is, in the structural context, more severe than the loss of home for the one when distributed. But note: Camp B does not say it's justified because of aggregate welfare, but because the baseline interdependence makes the burden on the one reasonable relative to the pattern of burdens otherwise.

  ### Crux 2: Relevance of Being One of Many
  - **Question**: Whether an individual’s knowledge that she is one of many similarly situated can enter into what she can reasonably reject, or whether such knowledge is irrelevant to pairwise justification.
  - **Concrete Case/Reasoning**: A vaccination policy requires each of 1 million people to bear a small risk of a serious side effect (say, 1 in a million chance of death) to achieve herd immunity, which would prevent 10,000 deaths from a disease. If an individual knows she is one of many being vaccinated, does this affect whether she can reasonably reject the policy?
