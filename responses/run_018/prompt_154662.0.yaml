  We are drafting a joint statement for an adversarial collaboration between two camps interpreting T.M. Scanlon’s contractualism on the aggregation problem.

  Camp A: Pairwise Baseline Contractualists
  - Hold that the reasonableness of rejecting a principle is assessed for each affected individual against a baseline that does not include other people’s parallel burdens. Thus, multiplying small harms across a population never aggregates into justification for imposing a large harm on one.

  Camp B: Structural Interdependence Contractualists
  - Hold that in institutional and collective-choice contexts, the baseline for each person already includes the structural presence of others. Therefore, evaluating whether a principle can be justified to each requires comparing patterns of burden across the group. What looks like aggregation is actually pairwise comparison against interdependent baselines.

