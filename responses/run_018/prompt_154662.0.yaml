answer: |-
  ### Joint Statement: Adversarial Collaboration on Scanlonian Contractualism and the Aggregation Problem

  #### **1. Agreed Claims**  
  We, Camp A (Pairwise Baseline Contractualists) and Camp B (Structural Interdependence Contractualists), jointly affirm the following core tenets of T.M. Scanlon’s contractualism:  
  1. Principles must be justifiable to each affected individual; moral permissibility is not determined by maximizing aggregate welfare.  
  2. A principle is impermissible if it can be reasonably rejected by any individual on grounds of the burdens it imposes on them.  
  3. Reasonable rejection depends on comparing the burdens an individual bears under a principle against feasible alternatives; it is not a utilitarian calculation.  
  4. Contractualism prohibits "sacrificing one for the many": imposing a severe burden on one person cannot be justified solely by aggregating smaller benefits to others.  
  5. A distinction exists between (i) *harming one to benefit others* (generally impermissible) and (ii) *distributing unavoidable, non-comparative burdens* (permissible if fair).  

  ---

  #### **2. Disagreements Table**  
  The table below states unresolved disputes. Each row neutrally frames a point of contention, followed by each camp’s precise formulation.  

  | **Dispute Description** | **Camp A: Pairwise Baseline Contractualists** | **Camp B: Structural Interdependence Contractualists** |
  |-------------------------|-----------------------------------------------|-------------------------------------------------------|
  | **Nature of the baseline for measuring burdens** | The baseline for assessing an individual’s burden is defined independently of other individuals’ burdens; it excludes the presence, absence, or number of others facing parallel burdens. | The baseline for assessing an individual’s burden in institutional contexts inherently includes the structural presence of others; burdens are evaluated against interdependent social patterns. |
  | **Permissibility of imposing a large burden to prevent many small burdens** | A principle imposing a large burden (e.g., death) on one to prevent many small burdens (e.g., minor losses) on others can always be reasonably rejected by the one, as small burdens do not aggregate to outweigh a large burden in pairwise justification. | A principle imposing a large burden on one to prevent many small burdens on others may not be reasonably rejected if, given structural interdependence, the alternative imposes a pattern of burdens that is worse for each when evaluated against their baseline. |
  | **Role of group size in reasonable rejection** | Whether an individual is one of many similarly burdened is irrelevant to reasonable rejection; justification depends solely on an individual’s burden compared to a baseline excluding group size. | Whether an individual is one of many similarly burdened can affect reasonable rejection, as the baseline incorporates structural expectations about how burdens are distributed across the group. |

  ---

  #### **3. Cruxes**  
  Cruxes are sub-questions whose resolution would shift at least one camp’s position. For each, we specify a shared test case or reasoning, and each camp’s prediction.  

  **Crux 1: Baseline Interdependence Without Utilitarian Collapse**  
  - **Question**: Can the baseline include the presence/absence of other burden-bearers without collapsing into utilitarian aggregation?  
  - **Shared Test Case**: *Dam Construction*: A dam prevents annual flood risks to 10,000 people (each facing a 0.1% chance of death) but destroys one person’s home (severe burden). The baseline for the homeowner is contested.  
    - **Camp A Prediction**: The homeowner can reasonably reject the dam. The baseline excludes others’ flood risks; the homeowner’s burden outweighs each individual’s minor risk, and risks do not aggregate.  
    - **Camp B Prediction**: The homeowner cannot reasonably reject the dam. The baseline includes the collective flood risk; the burden on the homeowner is less severe than the pattern of risks each faces without the dam. This avoids utilitarianism as justification is pairwise against an interdependent baseline.  

  **Crux 2: Relevance of Group Membership**  
  - **Question**: Can an individual’s knowledge that they are one of many similarly situated affect what they can reasonably reject, or is this irrelevant?  
  - **Shared Test Case**: *Vaccination Policy*: 1 million people each bear a small risk of side effects (1 in 1,000,000 chance of death) to achieve herd immunity preventing 10,000 deaths.  
    - **Camp A Prediction**: Each individual can reasonably reject the policy. The baseline excludes group size; the side-effect risk (however small) is a burden, and knowing others are vaccinated does not alter individual justification.  
    - **Camp B Prediction**: No individual can reasonably reject the policy. The baseline includes the structural necessity of collective action; the small risk is reasonable given the alternative (higher disease risk for all), and group membership shapes expectations.  

  **Crux 3: Distinguishing Counting Numbers from Counting Structural Patterns**  
  - **Question**: Is there a principled distinction between "counting numbers" and "counting structural patterns" in institutional design? If so, what formal feature distinguishes them?  
  - **Shared Test Case**: *Distributed Archive Protocol* (details below).  
    - **Camp A Prediction**: "Counting numbers" (e.g., summing burdens) is aggregation and impermissible. "Structural patterns" are irrelevant; only pairwise burden comparisons matter.  
    - **Camp B Prediction**: "Counting numbers" reduces to utilitarianism and is impermissible. "Counting structural patterns" is permissible; it identifies how institutional baselines distribute burdens across roles (e.g., archive users), defined by features like *non-separability* (burdens depend on others’ positions).  

  ---

  #### **4. Concrete Test Case: Distributed Archive Protocol**  
  **Scenario**: A shared institution must choose:  
  - **Option 1**: Preserve 10,000 irreplaceable cultural records (each minor to one community) but halt one researcher’s life-saving project.  
  - **Option 2**: Preserve the researcher’s project but lose all 10,000 records.  

  **Questions**:  
  1. Can Option 1 be justified to the researcher?  
  2. Can Option 2 be justified to any single record-holder?  
  3. Does the multiplicity of record-holders change what one record-holder can reject?  

  **Camp A Analysis**:  
  1. **Option 1** cannot be justified to the researcher. The researcher’s burden (losing a life-saving project) is severe; each record-holder’s avoided burden (losing one record) is minor and does not aggregate.  
  2. **Option 2** can be justified to any record-holder. The burden (losing one record) is minor; no individual can reject it based on others’ losses.  
  3. **Multiplicity is irrelevant**. Each record-holder evaluates only their own minor burden; the number of others does not alter reasonable rejection.  

  **Camp B Analysis**:  
  1. **Option 1** can be justified to the researcher. The baseline includes the institution’s structural role in preserving shared culture; the researcher’s burden, while severe, is not unreasonable compared to the alternative pattern (all record-holders losing their records).  
  2. **Option 2** cannot be justified to any record-holder. The baseline includes interdependence (the archive as a collective good); losing one record is minor, but the *pattern* of all records being lost violates structural expectations, making the burden non-minor.  
  3. **Multiplicity is essential**. The baseline for each record-holder includes the archive’s existence as a shared resource; thus, what one can reject depends on the collective pattern.  

  ---

  #### **5. Conclusion: Nature of Disagreements**  
  We assess whether disagreements are substantive or partly verbal:  

  - **Baseline Definition**: *Substantive*. Camp A sees B’s "interdependent baseline" as smuggling in aggregation; Camp B insists it is structurally distinct. The dispute does not dissolve even if B disavows utilitarianism, as A rejects any baseline that references others’ burdens.  
  - **Aggregation of Harms**: *Substantive*. Camp A denies B’s "pattern-based" justification avoids aggregation; Camp B argues patterns are irreducible to sums. Accepting B’s non-utilitarian framing does not resolve A’s objection that B still "counts numbers."  
  - **Institutional Accommodation**: *Partly verbal but largely substantive*. Both agree institutions matter, but Camp A argues pairwise comparisons suffice (e.g., via individual rights), while Camp B contends institutions require structural baselines, making A’s view contradictory in cases like the Archive.  

  **Overall**: Disagreements persist on whether structural features can be integrated without aggregating burdens. No final convergence is claimed; this statement maps the battleground for future inquiry.  

