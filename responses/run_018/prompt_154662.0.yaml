  - **Disagreement on Aggregation of Small Harms**: This is substantive. Camp A holds that multiplying small harms never justifies a large harm, while Camp B holds that in structural contexts, the pattern of small harms can justify imposing a large harm on one because the alternative pattern is worse for each in the interdependent baseline. The fact that Camp B disavows utilitarianism does not resolve the dispute because Camp A still sees this as introducing aggregation through the back door.

