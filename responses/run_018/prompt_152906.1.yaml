  ## Research Proposal: Keynes's Bloomsbury Goods - Moorean Pluralism in Disguise?

  **Research Question:** To what extent does John Maynard Keynes’s vision of the “good life” in *Economic Possibilities for our Grandchildren* (1930) – characterized by minimal work (15 hours/week) and the pursuit of art, friendship, and aesthetic enjoyment – depend conceptually, albeit implicitly, on G.E. Moore’s ethical pluralism and specific account of intrinsic goods as presented in *Principia Ethica* (1903), rather than rigorous independent argumentation?

  **Background & Significance:** Keynes’s famous essay paints a utopian picture of a post-scarcity future where humanity’s primary challenge shifts from economic struggle to the worthy use of leisure. He explicitly champions states of mind associated with “the art of life”: aesthetic appreciation, meaningful personal relationships, and the cultivation of non-instrumental activities. While celebrated, Keynes offers little *philosophical justification* for why *these specific activities* constitute the good life. He presents them as self-evident or desirable ends, reflecting the values of his Bloomsbury Group milieu. Crucially, G.E. Moore’s *Principia Ethica* was the foundational ethical text for the Bloomsbury Group. Moore argued for ethical non-naturalism (goodness is a simple, indefinable property) and radical pluralism: the only things possessing intrinsic goodness are certain complex states of consciousness – primarily, the pleasures of human intercourse (friendship, love) and the enjoyment of beautiful objects. This striking alignment demands investigation: is Keynes's vision merely an application of Moorean ethics to economics, revealing an unacknowledged philosophical dependency?

  **Addressing the Gap in Existing Literature:** Scholarship on Keynes overwhelmingly focuses on his economic theories (macroeconomics, liquidity preference, fiscal policy). Analyses of his vision for the future typically examine its economic feasibility, technological assumptions, or historical context, often treating his conception of the "good life" as a personal preference or rhetorical flourish. Studies linking Keynes to Moore tend to be biographical, highlighting their association through Bloomsbury, or focus narrowly on Keynes’s early philosophical paper "My Early Beliefs." **Crucially, there is a lack of sustained, close philosophical analysis examining whether the *structure* and *content* of Keynes's specific vision of flourishing in *Economic Possibilities* fundamentally relies on Moore's ethical framework.** This project fills that gap by treating Keynes not just as an economist, but as a value theorist whose foundational assumptions require interrogation.

  **Methodology:** The primary method will be **close textual analysis and philosophical comparison**. This involves:
  1.  **Exegesis of Keynes:** A meticulous reading of *Economic Possibilities for our Grandchildren*, focusing on passages defining the "good life," the nature of the activities promoted (art, friendship), the language used to describe their value, and the absence of justification for selecting these goods over others.
  2.  **Exegesis of Moore:** A close reading of relevant sections of *Principia Ethica* (especially Chapters I, VI) to establish Moore's arguments for pluralism, his account of intrinsic goods (friendship, aesthetic enjoyment), and his critique of "naturalistic" ethical systems that conflate facts with values.
  3.  **Comparative Analysis:** Systematically comparing the *nature* of the goods Keynes promotes with Moore's intrinsic goods. Does Keynes implicitly adopt Moore's non-naturalism? Does his vision structurally mirror Moorean pluralism, rejecting monistic foundations (like pure hedonism or utilitarianism)? Does he share Moore's focus on specific *states of mind*? How does Keynes's dismissal of "purposiveness" align with Moore's critique of instrumental reasoning?
  4.  **Contextual Consideration:** While the focus is textual, acknowledging the Bloomsbury context as the likely conduit for Moore's influence, without relying solely on biography to establish the conceptual link.

  **Scope, Limitations, and Realism:** This project operates within significant constraints:
  *   **Limited Texts:** Focus is primarily on *Economic Possibilities* and *Princincipia Ethica*. Other relevant Keynes writings (e.g., "My Early Beliefs," letters) or Moore commentaries will be secondary.
  *   **Proving "Dependency":** **Crucially, within one semester, establishing definitive *causal* or *intentional* dependency (Keynes consciously applying Moore) is likely impossible.** The realistic aim is to demonstrate a **compelling conceptual congruence**: showing that Keynes's vision *functions* logically and structurally only *if* one accepts Moorean pluralism and his specific list of intrinsic goods, and that Keynes provides no independent justification, leaving Moore as the most plausible philosophical foundation. The argument will be one of *best explanation* for the coherence and content of Keynes's value claims.
  *   **Not Economics:** The project does *not* evaluate the economic viability of Keynes's forecast.

  **Defining Failure:** This project would fail if:
  1.  **No Substantive Congruence Found:** Close reading reveals Keynes's goods are justified differently (e.g., instrumentally, biologically, aristocratically) or structured in a way fundamentally incompatible with Moorean pluralism.
  2.  **Overstated Claims:** The analysis overreaches, claiming definitive proof of direct influence where only vague parallels exist.
  3.  **Ignoring Keynes's Nuance:** Failure to acknowledge any subtle distinctions Keynes might make or potential tensions within his vision that don't perfectly map onto Moore.
  4.  **Superficial Comparison:** The analysis remains at the level of shared interests (art, friendship) without probing the underlying *philosophical commitments* (pluralism, non-naturalism, intrinsic value) that give those interests their specific ethical weight in each author.

  **Expected Contribution:** This research will provide a deeper philosophical understanding of the ethical foundations underpinning Keynes's influential vision of the future. It challenges the view of his "good life" as a mere preference, revealing its potential grounding in a specific, rigorous, yet unacknowledged ethical theory (Moorean pluralism). It highlights the importance of value theory in interpreting economic visions of human flourishing and offers a model for analyzing the hidden philosophical assumptions within economic thought.
