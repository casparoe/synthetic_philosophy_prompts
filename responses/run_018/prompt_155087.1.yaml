prompt: |-
  hey im a junior and we talked about the judy benjamin problem in philosophy club and now im stuck on my own gut feelings about updating on conditonals. here are my verdicts on cases, and i want to know if theres one rule behind them or if im just messy.

  case 1: soldier hears 'if your in red territory then HQ is north' but doesnt know her color. my gut: her belief shes in red should stay exactly the same. learning a rule shouldnt move your belief about the world.

  case 2: i think its 60/40 my laptop is broken vs just glitchy. tech support says 'if its the motherboard then the screen flickers.' then i see flickering. i think ok probably motherboard. but if i learn the tech is a liar, i think maybe its glitchy after all. so my update on the conditonal depends on how much i trust the source?

  case 3: doctor says 'if you carry the gene then symptoms appear by 25.' im 28 and fine. my gut says i should conclude i dont carry the gene, not that the rule is broken. but if im 22 and sick, i should conclude i do carry it and the rule is right. so the same conditonal updates me differently depending on whether the outcome happened?

  case 4: i learn 'if it had rained yesterday, the picnic would have been cancelled.' i also learn the picnic happened. i feel like i should now think it didnt rain. but heres the clash: i also think learning a counterfactual about a fake situation shouldnt change my belief about real weather at all. these two gut feelings fight.

  case 5: my friend tells me a secret rule: 'if the answer is A then B is false.' i check and B is true. i immediately think A is false. but if i never check B, just knowing the rule shouldnt change my belief in A. that feels consistient with case 1 but im not sure.

  so whats the actual principle? is it about trusting the speaker, about causation, about whether you observe the outcome? and please tell me which of my verdicts id have to drop to get a clean theory. also predict what i should think if i learn a conditonal, then forget whether the antecedent is true.

  Verdict: [the principle or 'no single principle']
