  ### Structured Workshop Activity: "The Life Definition Game"

  #### **Activity Goal**  
  To create experiential understanding of how formal definitions of life lead to arbitrary inclusions/exclusions of borderline cases, highlighting tensions between logical consistency, intuition, and consensus.

  ---

  ### **Materials**  
  - **Entity Cards** (3 copies each of A, B, C, D for 12 students).  
  - **Criterion Cards** (3 copies each: Autopoiesis, Evolutionary Capacity, Metabolic Closure, Information Processing).  
  - **Tokens** (e.g., colored chips/stickers; 1 gold for consensus, 1 silver for individual consistency).  
  - **Worksheet** for initial classifications.  
  - **Timer**.  

  #### **Entity Descriptions**  
  - **A**: Synthetic minimal cell (homeostasis/metabolism, no genome/evolution).  
  - **B**: Brain-dead human on ECMO (gut microbiome metabolizes/adapts/reproduces).  
  - **C**: Viral factory (self-replicates via host, no independent metabolism).  
  - **D**: Self-catalyzing peptide network (grows/divides/responds, no nucleic acids).  

  #### **Criterion Definitions**  
  1. **Autopoiesis**: Self-maintaining, organizationally closed system.  
  2. **Evolutionary Capacity**: Capable of heritable variation and natural selection.  
  3. **Metabolic Closure**: Internally regulated energy/material cycles.  
  4. **Information Processing**: Encodes, transmits, and uses hereditary information.  

  ---

  ### **Rules & Payoff Scheme**  
  1. **Individual Consistency Token (Silver)**:  
     - Awarded if *all four* of a student’s classifications align with their assigned criterion.  
  2. **Pair Consensus Token (Gold)**:  
     - Awarded if the dyad agrees on a joint classification for all four entities.  
  3. **Tension**:  
     - To earn *both* tokens, a student must:  
       - Reach consensus with their partner (gold),  
       - While maintaining personal classifications that are *internally consistent* with their criterion (silver).  
     - **Conflict**: Consensus may force classifications contradicting their criterion, costing their silver token.  

  ---

  ### **Timeline (90 Minutes)**  
  | **Time** | **Phase** | **Instructions** |  
  |----------|-----------|------------------|  
  | 0–10 min | **Setup** | Distribute entity and criterion cards. Project entity descriptions. Students **work alone** to classify their four entities (Alive/Not Alive) on worksheets. *Do not reveal payoffs yet*. |  
  | 10–15 min | **Pairing** | Pair students into **opposing-criterion dyads** (e.g., Autopoiesis vs. Evolutionary Capacity). *Reveal payoff rules*: "You’ll earn one gold token per pair for consensus, and one silver token each if your initial classifications stay consistent with your criterion." |  
  | 15–30 min | **Negotiation** | Dyads negotiate a joint classification for all four entities (15 min). Emphasize: "You *must* agree on one answer per entity." |  
  | 30–40 min | **Reporting** | Each dyad shares consensus classifications. Instructor records results publicly. |  
  | 40–50 min | **Token Award** | Distribute gold tokens to consensus pairs. Review worksheets: award silver tokens only if initial classifications align with criterion (use pre-defined key below). |  

  #### **Pre-Defined Key for Consistency**  
  *(Instructor reference; not shared with students)*  
  | Entity | Autopoiesis | Evolutionary | Metabolic | Information |  
  |--------|-------------|--------------|-----------|-------------|  
  | **A**  | No          | No           | Yes       | No          |  
  | **B**  | No          | Yes          | Yes       | Yes         |  
  | **C**  | No          | Yes          | No        | Yes         |  
  | **D**  | Yes         | No           | No        | No          |  

  ---

  ### **Predictable Breakdowns & How to Block Intuitive Convergence**  
  - **Problem**: Students will default to intuitive judgments (e.g., calling viruses "not alive").  
  - **Solution**:  
    - **Silent Start**: Begin with solo classification ("Use *only* your criterion, not intuition").  
    - **Payoff Leverage**: Reveal tokens *after* initial work. Silver tokens incentivize rigid adherence.  
    - **Dyad Mismatch**: Pair conflicting criteria (e.g., Evolutionary Capacity forces viruses "alive"; Autopoiesis forces "not alive").  

  ---

  ### **Debrief (40 Minutes)**  
  #### **Guided Discussion**  
  1. **Reactions** (5 min):  
     - *Ask*: "Which negotiation felt most frustrating? Did your criterion clash with intuition?"  
     - *Example*: Viral factory (C) often splits intuitions vs. evolutionary/information criteria.  

  2. **Map Breakdowns to Philosophy** (20 min):  
     - **Boundary Problems**:  
       - Entity B (ECMO body): If the microbiome is "alive," is the *system* alive? What defines the "self"?  
     - **History vs. Function**:  
       - Entity A (synthetic cell): Lacks evolutionary history but fulfills metabolism. Why privilege one criterion?  
     - **Operational vs. Essentialist Traps**:  
       - Entity D (peptide network): Fits autopoiesis but fails evolution/information. Is it "life" or just "life-like"?  

  3. **Reveal the Design** (5 min):  
     - "The tokens forced you to confront the gap between consistency and consensus. Real-world debates face this, but with higher stakes."  

  #### **Connect to Personal Stakes** (10 min)  
  - **Honest Limitations**:  
    - *What the game misses*: The **normative weight** of declaring life (e.g., clinical/ethical consequences) and **temporal emergence** (life as a process, not a snapshot).  
  - **Bridge to Experience**:  
    - "Three months ago, my sister’s 23-week fetus became a borderline case. Doctors debated metabolic autonomy—a criterion that, as you saw, is both necessary and insufficient. This activity *simulates* the arbitrariness we felt. But in reality, the stakes were not tokens—they were a life, grief, and protocols. How do we reconcile these definitions with that weight?"  
  - **Open Reflection**:  
    - *Ask*: "Would you trust *any* single criterion in a clinical setting? What would you add?"  

  ---

  ### **Why This Works**  
  - **Experiential Tension**: Students *feel* the frustration of criteria failing at edges.  
  - **No Early Lecturing**: Payoffs and solo work block intuition without explicit instruction.  
  - **Ethical Connection**: The debrief centers the human stakes without making the workshop about your story.  

  This structure ensures students confront the messiness of life’s definitions firsthand, while the token system mirrors real-world trade-offs between rigor and practicality.
