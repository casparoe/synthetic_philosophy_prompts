      "This workshop was inspired by a personal experience with a borderline case: a 23-week fetus. The doctors debated whether it had achieved independent metabolic autonomy. In that situation, the definition of life was not an academic exercise; it had real consequences. This activity cannot capture the emotional weight of such a decision. But it can show us why, when we are forced to draw a line, it feels arbitrary. And yet, we must draw it. So we must be aware of the limitations of our definitions and the stakes involved."

    This should be done in the last 5-10 minutes of the debrief.

