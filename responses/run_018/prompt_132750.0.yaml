prompt: |-
  hey so im a backend engineer on a legacy maintanence team with basically zero philosophy background. every sprint we hit cases where two different explanations for a weird module behavior both match every log and test we have, but we still gotta pick one to refactor around or decide to hold both. i read a little about underdetermination of theory by evidence - like the quine-duhem thing where data never fully forces one theory - and i want to turn that into an actual decision procedre my team can run in like 20 minutes. nobody here has studied philosophy, and at the end someone senior has to sign off.

  write me the ordered checklist: the questions to ask in sequence, what counts as a good enough answer at each step, where it stops with a hard 'no, dont commit to either', where it says 'pick A or B but flag the risk', and where its clearly a values call that philosophy cant solve. keep it usable by people who dont know the jargon.

  apply it to three cases:
  1. two database normalization theories that both predict the exact same slow query patterns
  2. two competing security breach narratives that both fit every audit log
  3. a case where the procedure forces us to reject the simpler, cleaner explanation we all like and go with a messier one because some hidden auxilliary assumption check fails

  also be honest about where this is gonna misfire or break since im probably mangling the concept, and say clearly what the procedure cant do - like it cant actually prove one theory is right, can it? and flag the spots where a human just has to make a call.
reasoning: |-
  We are creating a decision procedure checklist for underdetermined theories in software maintenance.
   The goal is to help a team decide between two competing explanations for a behavior when both fit the existing evidence.

   Steps:
   1. We'll have a sequence of questions.
   2. Each step must have clear pass/fail criteria or a way to move to the next.
   3. We want to end with one of:
      - Reject both (don't commit to either, need more data)
      - Pick one (with risk flag if necessary)
      - Acknowledge it's a values call (beyond the scope of the procedure)

   The procedure cannot prove which theory is correct, but it can help in:
      - Uncovering hidden assumptions
      - Evaluating the theories against auxiliary knowledge
      - Assessing risks and costs

   Let's design the checklist:

   Step 1: Check for Critical Auxiliary Assumptions
     Question: For each theory, what are the key assumptions that are not directly tested by the current logs/tests?
     Good enough answer: The team must list at least 2-3 key assumptions per theory that are critical to the theory being correct.
     If they cannot list any, they must note that the theory is too vague or they haven't thought deeply enough -> reject both until they can.

   Step 2: Auxiliary Assumption Testability
     Question: Can we design a new test (or check existing data we haven't looked at) to test at least one critical auxiliary assumption for each theory?
     Good enough answer: 
       - If for both theories, we can design such a test and it's feasible to run within the current sprint (or a short time), then we do that and return to Step 1 with the new evidence. 
       - If we can test at least one for one theory and it fails, then that theory is rejected and we proceed with the other (with a note that we might have to revisit if the other fails later).
       - If we cannot test any critical auxiliary assumptions and they remain untestable, move to Step 3.

   Step 3: Risk Assessment of Each Theory
     Question: What is the worst-case scenario if we pick theory A and it's wrong? Same for theory B? Consider: 
          - Security, performance, cost, user impact, future refactoring complexity, etc.
     Good enough answer: The team must list at least two concrete risks for each theory. 
     If one theory has significantly lower worst-case impact, then pick that one and flag that it's a risk-based decision.

   Step 4: Simplicity and Coherence
     Question: Which theory is simpler (requires fewer ad-hoc assumptions) and fits better with the rest of the system's known behavior?
     Good enough answer: The team must agree on which is simpler and more coherent. If one clearly wins, pick that one and note that it's based on simplicity. 
     If they are equally simple/coherent, or if the team disagrees, then move to Step 5.

   Step 5: Values Call
     Question: We have to make a call based on non-evidential factors. Which one aligns better with:
          - Our team's current priorities (e.g., reducing tech debt, preparing for feature X)?
          - The senior's past decisions (for consistency)?
          - The team's gut feeling (if it's strong and unanimous)?
     If the team can align on one based on these, then pick it and document the non-evidential reasons. 
     Otherwise, reject both and escalate to the senior with a summary of the deadlock.

   Step 6: Senior Sign-off
     The senior reviews the steps taken and the decision. They can override based on broader context.

   Now, we apply to the three cases:

   Case 1: Two database normalization theories that both predict the exact same slow query patterns.

   Step 1: List auxiliary assumptions.
     Theory A: Assumes that the slowness is due to lack of an index on column X.
     Theory B: Assumes that the slowness is due to a join with a large table Y that isn't properly filtered.

     Critical assumptions:
        A: That the index doesn't exist, and that adding it would fix the problem without harming write performance.
        B: That the join condition is not sargable, and that the table Y has grown unexpectedly.

   Step 2: Testability.
     We can check if the index exists. If it does, then A is weakened. We can check the query plan to see if the join is the bottleneck and if table Y is large. 
     If we can run an EXPLAIN and see the plan, we can test both. If we haven't done that, we can do it now.

     If we do the EXPLAIN and see that the join is indeed the issue and table Y is huge, then B is supported. If we see a full scan on column X and no index, then A is supported.

     If we can't run the EXPLAIN (maybe because it's production and we can't run the query live) and we don't have a way to test, then we move to Step 3.

   Step 3: Risk assessment.
     Picking A: We add an index. Worst-case: the index causes write slowdowns and doesn't fix the query. We have to remove it and try something else.
     Picking B: We refactor the query to filter earlier. Worst-case: the refactor is complex, might break the logic, and if it doesn't fix the issue we have to revert.

     If adding an index is low risk (because the table is read-heavy) and the refactor is high risk (because the query is critical and complex), then pick A.

   Step 4: Simplicity.
     Adding an index is simpler than rewriting a query. So A wins on simplicity.

     Decision: Pick A (if Step 2 didn't already show a problem for A).

   Case 2: Two competing security breach narratives that both fit every audit log.

   Step 1: Auxiliary assumptions.
     Theory A: An insider with legitimate access leaked the data.
     Theory B: An external attacker used a zero-day in the authentication system.

     Critical assumptions:
        A: That an insider had both access and motive, and that the logs wouldn't show anything unusual because the access was legitimate.
        B: That there exists an unpatched vulnerability in the auth system that we haven't discovered.

   Step 2: Testability.
     We might not be able to test for insider motive without an investigation. We can check if the insider had access to the data at the time. 
     For B, we can check if the auth system has any known unpatched vulnerabilities (or if there was one at the time). 

     If we can check the insider's access logs and see they accessed the data at the time of the breach, that supports A. If we find a zero-day that matches, that supports B.

     If we cannot gather more evidence (e.g., the insider logs are gone, or we can't find a zero-day) then we move to Step 3.

   Step 3: Risk assessment.
     Picking A: We focus on internal controls. Worst-case: if it was actually an external attacker, they are still out there and we are vulnerable.
     Picking B: We focus on patching and external defenses. Worst-case: if it was an insider, they might do it again and we haven't addressed the internal threat.

     The worst-case of picking the wrong one is high in both cases (continued breaches). We might have to do both? But the procedure is for picking one.

     Alternatively, we might decide to do both fixes because the risk is too high to choose one. But the procedure is for the theory we commit to for explanation.

     Since both risks are high, we might reject both? But we have to pick one to focus on first.

     Step 4: Simplicity. 
        The insider theory might be simpler because it doesn't require an unknown vulnerability. But the zero-day might be simpler because it doesn't require a malicious insider.

     Step 5: Values call. 
        The team might decide based on which is more likely in their industry, or which fix is easier to implement first. 
        For example, if the company has had insider issues before, pick A. Otherwise, pick B.

     We might end up flagging both as risks and doing both, but the procedure forces us to pick one for the narrative? Or we might reject both and say we need more investigation.

     Given the high risk, we might reject both and escalate to the senior immediately.

   Case 3: A case where the procedure forces us to reject the simpler, cleaner explanation.

     Setup: 
        Theory A (clean and simple): The cache is not being invalidated because the invalidation key is misspelled in one place.
        Theory B (messy): The cache invalidation is failing due to a race condition between two services.

     Step 1: Auxiliary assumptions.
          A: That there is a misspelling, and that fixing it would fix the issue.
          B: That the two services are out of sync in their timing, and that the cache invalidation message is sometimes lost.

     Step 2: Testability.
          We can check the code for the misspelling. If it's there, then A is supported. If not, then A is rejected. 
          For B, we might need to run a stress test to see if the race condition can be triggered.

          If we check and the spelling is correct, then A fails. We must then test B. If we can't test B (maybe because the stress test is too hard to set up), then we move to Step 3.

     Step 3: Risk.
          If we pick A: We fix the spelling. Worst-case: it doesn't fix the issue and we have to look again. Low risk.
          If we pick B: We implement a complex fix (like a message queue). Worst-case: it introduces latency and doesn't fix the issue.

          Even though A is simpler and we like it, if Step 2 showed the spelling is correct, then A is already rejected. So we must go with B? Or if Step 2 was inconclusive, then we note that A is low risk and B is high risk, so we try A first.

     But what if Step 2 was not done? We must do Step 2 first.

     The procedure forces us to test auxiliary assumptions when possible. In this case, we can easily check the spelling. So we do.

     If the spelling is correct, then we reject A and must consider B. Then we try to test B (Step 2 again for B). If we can't, we move to Step 3 for B.

     Step 3 for B: The risk of implementing a complex fix is high. But the risk of not fixing the cache issue might be higher. So we might pick B and flag the risk.

     The team might prefer A because it's clean, but the procedure forces rejection because the auxiliary assumption (the misspelling exists) fails.

   Limitations and misfires:

    - The procedure cannot prove a theory is correct. It only helps in managing uncertainty.
    - It relies on the team's ability to identify critical auxiliary assumptions. If they miss a key one, the procedure might lead to a wrong decision.
    - In Step 2, if a test is not feasible, we move on, but sometimes a test might be feasible if we think creatively.
    - Step 4 (simplicity) is subjective. What one engineer finds simple, another might not.
    - In high-risk scenarios (like security), the procedure might lead to a decision that is too risky. We might need a separate high-risk protocol.
    - The procedure might be too rigid and not account for the possibility of a third theory.

    We must note that at any step, if a new theory emerges, we restart the procedure for the new set.

    The procedure also doesn't account for the cost of delay. Sometimes we might pick the theory that leads to the fastest fix, even if it's riskier.

    Finally, the senior sign-off is crucial because they have the context we might not.

   Now, the checklist in a numbered step-by-step:

   Checklist for Underdetermined Theories:

   1. List Critical Assumptions:
      For each theory, list at least 2-3 critical assumptions that are not directly proven by the existing logs/tests.
      - If you can't list at least one per theory, then reject both and gather more info (stop here for now).
      - Else, proceed.

   2. Test Auxiliary Assumptions:
      For each critical assumption, ask: "Can we test this with a new or existing test that we haven't run yet, and is it feasible to do so now?"
      - If you can test at least one assumption for each theory, run those tests and:
          - If a test fails for a theory, reject that theory. If only one remains, pick it and stop.
          - If both are rejected, reject both and stop.
          - If both pass, or if results are inconclusive, proceed to step 3.
      - If you cannot test any critical assumptions, proceed to step 3.

   3. Assess Risks:
      For each remaining theory, consider: "If we act on this theory and it's wrong, what is the worst that could happen? (Consider security, performance, cost, etc.)"
      - If one theory has a much lower worst-case impact, pick that one and flag the risk. Stop.
      - If both have high and similar risk, proceed to step 4.

   4. Evaluate Simplicity:
      Ask: "Which theory is simpler (requires fewer new entities or assumptions) and fits better with the rest of the system?"
      - If one is clearly simpler, pick it and stop.
      - If they are tied or unclear, proceed to step 5.

   5. Values Call:
      Ask: "Which theory aligns better with our team's priorities, the senior's known preferences, or our collective gut feeling?"
      - If the team can agree on one, pick it and document the non-evidential reasons. 
      - If not, reject both and escalate to the senior with the reasons for the deadlock.

   6. Senior Review:
      Present the decision and the reasoning to the senior. They sign off or override.

   For the third case, we see how it forces rejection of the clean theory if the auxiliary assumption (the misspelling) is tested and fails.

   Let's write the checklist in a clear, concise way without jargon.
answer: |-
  ### Decision Checklist for Underdetermined Theories  
  *Use when two explanations fit all existing data, but you must commit to one or reject both.*  
  **Timebox:** 20 minutes max. **Goal:** Minimize risk, not prove truth.  
  **Senior must sign off at the end.**  

  ---

  #### **Step 1: List Hidden Assumptions**  
  **Question:** *"What must be true about the system for each theory to work, that we haven’t directly tested?"*  
  **Good answer:** 2-3 concrete technical assumptions per theory (e.g., "assumes index X exists," "assumes service Y handles null inputs safely").  
  **Stop if:** Assumptions are vague (e.g., "the code is messy"). **→ Reject both.**  
  **Otherwise:** Proceed.  

  #### **Step 2: Stress-Test Assumptions**  
  **Question:** *"Can we disprove any assumption using: (a) existing logs/tests we haven’t checked, or (b) a 5-minute experiment?"*  
  **Good answer:**  
  - If **any assumption is disproven**, discard its theory.  
  - If **both theories survive**, proceed.  
  **Stop if:** One theory is disproven → **commit to the other (flag risk)**.  
  **Misfire warning:** If tests are shallow (e.g., logs lack granularity), this step may falsely clear both.  

  #### **Step 3: Risk Assessment**  
  **Question:** *"If we pick Theory A and it’s wrong, what’s the worst outcome? Repeat for Theory B."*  
  **Good answer:** Quantifiable risks (e.g., "20% latency increase," "exposes PII," "requires 3 days to revert").  
  **Decision:**  
  - One theory’s worst-case outcome is **severely worse** (e.g., security breach vs. temp slowness) → **reject the riskier theory**.  
  - Risks are comparable → proceed.  
  **Values call:** Senior must weigh business impact (e.g., "security > performance").  

  #### **Step 4: Simplicity Check**  
  **Question:** *"Which theory requires fewer changes to the system’s normal behavior or architecture?"*  
  **Good answer:**  
  - Theory A needs a one-line config change; Theory B needs a new service → **A is simpler**.  
  - Both are similar → proceed.  
  **Stop if:** One is clearly simpler → **pick it (flag risk if risks from Step 3 are high)**.  
  **Philosophy limit:** Simplicity ≠ correctness (e.g., a simple SQL theory may ignore race conditions).  

  #### **Step 5: Future Testability**  
  **Question:** *"Can we add a cheap probe (log, metric, test) to definitively rule out one theory in the next sprint?"*  
  **Good answer:** A specific, low-effort validation (e.g., "log cache hits" or "add a 10-line unit test").  
  **Decision:**  
  - Yes → **reject both theories now, implement the probe first**.  
  - No → proceed to Step 6.  

  #### **Step 6: Tiebreaker**  
  **Question:** *"Which theory aligns with: (a) team priorities (e.g., ‘reduce tech debt’), or (b) senior’s past decisions?"*  
  **Good answer:** Reference a specific value (e.g., "We optimize for stability, so pick the theory that avoids rearchitecting").  
  **Decision:**  
  - Team agrees → **pick one (document the values call)**.  
  - Deadlock → **reject both and escalate**.  
  **Values call:** Philosophy can’t resolve this. Senior breaks ties.  

  ---  
  ### **What This Can’t Do**  
  - 🚫 **Prove a theory is true** (only manages uncertainty).  
  - 🚫 Handle >2 theories (simplify to 2 first).  
  - 🚫 Replace domain expertise (e.g., a DB pro should sanity-check Step 1).  
  - 🚫 Fix bad data (if logs are incomplete, results will be brittle).  

  ---  
  ### **Applied to Your Cases**  

  #### **Case 1: Two DB Normalization Theories**  
  - **Step 1 Assumptions:**  
    - *Theory A:* Assumes missing index causes slowness.  
    - *Theory B:* Assumes lock contention from row-level locking.  
  - **Step 2 Test:** Check `pg_locks` table for contention (B) or `EXPLAIN ANALYZE` for index scans (A).  
  - **Step 3 Risk:** If A is wrong, wasted time. If B is wrong, deadlocks. → Similar risk.  
  - **Step 4 Simplicity:** Adding an index (A) is simpler than rewriting locking logic (B). → **Pick A, flag risk**.  

  #### **Case 2: Security Breach Narratives**  
  - **Step 1 Assumptions:**  
    - *Theory A (Insider):* Assumes no MFA on admin accounts.  
    - *Theory B (Hacker):* Assumes unpatched CVE in auth service.  
  - **Step 2 Test:** Verify MFA logs (A) or CVE patch history (B). If both unverifiable → proceed.  
  - **Step 3 Risk:** Wrong A → insider uncaught. Wrong B → breach repeats. → **B’s risk is worse**.  
  - **Decision:** **Reject B** (due to higher risk), then **pick A** if it passes Step 2.  

  #### **Case 3: Rejecting the Clean Explanation**  
  - **Scenario:**  
    - *Clean Theory (A):* "Bug is from typo in config."  
    - *Messy Theory (B):* "Bug is from distributed race condition."  
  - **Step 1 Assumptions:**  
    - *A:* Assumes config was deployed (deployment logs untested).  
    - *B:* Assumes network latency > 100ms (metrics untested).  
  - **Step 2 Test:** Check deployment logs → typo doesn’t exist. **A disproven!**  
  - **Result:** **Must reject A** despite simplicity → **proceed with B**.  
  - **Why:** Hidden assumption (config deployment) failed. Philosophy forces rigor.  

  ---  
  **Final Tip:** Run this in a meeting with a shared doc. Senior’s job: challenge assumptions in Step 1/2 and own the values call in Step 6.
