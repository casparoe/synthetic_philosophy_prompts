answer: |-
  Here’s your prep sheet, tailored to your audience’s likely objections, ordered by potential damage level. Each includes a 90-second reply and an honesty flag:

  ### **Concession Upfront (Open with this):**
  > *"Before we begin: I am **not** advocating file destruction, state erasure, or enabling perpetrators. I argue for **institutional restraint**: protocols for *selective non-collection* (e.g., excluding revenge porn from a TRC archive) and *contextual redaction* (e.g., anonymizing minor actors in low-level atrocities). This is about curating a survivable past, not burying truth."*

  ---

  ### **Top 8 Objections & Replies**
  1. **The Practitioner’s Killshot** (Most damaging—challenges real-world viability):  
     *"You talk about ‘curating absence,’ but in my TRC, perpetrators controlled the army, courts, and archives. If we’d proposed ‘structured forgetting,’ they’d have used it to whitewash everything. How does this not hand them a tool?"*  
     **Reply:** "You’re absolutely right—this framework assumes a minimum of institutional good faith, which is often absent *during* transition. That’s why I argue it’s for **later-stage reconciliation**, once power imbalances are reduced. Think Rwanda’s *Gacaca* archives: post-trial, anonymizing low-level *génocidaires* to prevent eternal vendettas. But in active power struggles? It’s poison. **Soft Spot:** My timing is vague—‘later-stage’ is situational, not defined."  

  2. **Philosophers’ Core Ethical Objection**:  
     *"This sounds like state-sponsored amnesia. Victims have a right to acknowledgment—your ‘negative space’ robs them of dignity and enables denialism."*  
     **Reply:** "Margalit teaches us that shared memory *creates* ethical community. But if that memory is purely traumatic—say, generations fixating on massacre sites—it can *prevent* community formation. Structured absence here isn’t denial; it’s redirecting focus to reparative norms. Like Germany abstaining from exhaustive documentation of every SS guard’s petty cruelty to prioritize Holocaust education. **Soft Spot:** Balancing victim dignity against communal survival is agonizingly subjective."  

  3. **Archivists’ Professional Horror**:  
     *"You’re asking us to violate our core mandate: preserving evidence for accountability. ‘Negative space’ is just a euphemism for destruction by omission."*  
     **Reply:** "Archival ethics already accept restraint: privacy redactions, non-collection of redundant/irrelevant material. I argue that in *specific* cases—e.g., not archiving every hate speech leaflet from a civil war—omission prevents recirculating harm. This isn’t shredding trial transcripts; it’s not amplifying noise. **Soft Spot:** ‘Noise’ vs. ‘evidence’ is a judgment call—I rely on archivists’ expertise, but it’s a burden."  

  4. **Philosophers’ Communitarian Pushback**:  
     *"If shared memory binds us, how can erasure create a healthier community? Isn’t this just avoiding hard truths?"*  
     **Reply:** "Not erasure—*reframing*. Toxic memory binds through pain (e.g., Serbia’s Kosovo myth). Curating absence disrupts that cycle, creating space for new narratives. Like post-Apartheid SA emphasizing Ubuntu over Boer commando tactics. **Soft Spot:** I assume new narratives will be *better* ones—but that’s not guaranteed."  

  5. **Archivists’ Slippery Slope**:  
     *"Who decides what’s ‘toxic enough’ to omit? Once you endorse gaps, every regime will claim their crimes are ‘too divisive’ to preserve."*  
     **Reply:** "Decisions must be transparent, participatory, and post-accountability—never during fact-finding. Think international panels with victim advocates, not interior ministries. The ICTY’s anonymization rules for sensitive testimonies show it’s possible. **Soft Spot:** Power can corrupt any panel—I’m banking on process rigor we rarely achieve."  

  6. **Practitioner’s Pragmatic Skepticism**:  
     *"TRCs barely get funding to *collect* evidence. Now you want costly protocols for *non-collection*? This is ivory-tower idealism."*  
     **Reply:** "I’m proposing this for mature archives, not struggling TRCs. Example: Colombia’s Historical Memory Group *deliberately* not digitizing paramilitary graffiti photos to avoid viral resurfacing. It’s resource-neutral curation. **Soft Spot:** ‘Mature’ archives imply stability many lack."  

  7. **Philosophers’ Victim-Centered Objection**:  
     *"This sacrifices victims’ truth for communal comfort. Forgetting serves the powerful."*  
     **Reply:** "Some victim groups *demand* redaction—e.g., Indigenous communities refusing to archive sacred trauma rituals. This isn’t *imposing* silence; it’s respecting agency. **Soft Spot:** Individual/group agency conflicts (e.g., one victim wanting full disclosure vs. community preference) remain unresolved."  

  8. **Archivist/Practitioner Hybrid**:  
     *"‘Negative space’ obscures context. Future historians won’t know what’s missing, corrupting scholarship."*  
     **Reply:** "Ethical curation requires *documenting the gap*: ‘X was excluded by panel Y in 2025 under Z protocol.’ Like redacted documents with placeholders. Absence becomes traceable. **Soft Spot:** Traceability doesn’t equal usability—researchers still lose data."  

  ---

  ### **The Dreaded Question You Pray Nobody Asks**  
  **Question (Likely from the Practitioner or a Philosopher):**  
  *"You say perpetrators can’t control this process—but if your ‘structured absence’ becomes policy, what stops a reformed-but-still-influential perpetrator class from lobbying to omit *their* crimes, calling them ‘divisive’? Isn’t your framework a gift to enablers of atrocity?"*  

  **Barely-Holding-Together Reply:**  
  "This is why the ‘structured’ in structured forgetting is non-negotiable: it requires **victim-vetted protocols** *before* specific omissions. Imagine a treaty-bound panel—like a hybrid court—where victims’ associations hold veto power over redaction categories *at the institutional design stage*. Perpetrators couldn’t ad-hoc lobby because the rules (e.g., ‘no redacting command responsibility evidence’) are locked in early. For example, Timor-Leste’s CAVR archive required unanimity between international and local reps to anonymize. It’s about front-loading safeguards."  

  **Where It Collapses:**  
  1.  **Perpetrator infiltration:** If ex-perpetrators still control the state (e.g., post-civil war Guatemala), they’ll manipulate the "victim reps" or treaty negotiations.  
  2.  **Veto impracticality:** Unanimity gives one group blocking power—stalling archives indefinitely.  
  3.  **Temporal creep:** "Locked-in" rules get amended. Who stops a future illiberal government redefining "divisive"?  

  **Honesty Flag:** *"You’ve hit the fracture point. If perpetrators retain *any* institutional power, this model fails. It only works when victims hold real leverage—which is tragically rare. I’m proposing an ideal for *favorable* conditions, not a universal solution."*  

  ---

  **Final Prep Tips:**  
  - **Lead with Margalit’s bind**: "When memory *is* the toxin, preservation kills."  
  - **Flatter the archivists**: "You’re already ethicists of absence—we just need to make it explicit."  
  - **Nod to the practitioner**: "You’ve seen when this *can’t* work—I’m exploring where it *might*."  
  - **Drop "negative space" early**—it’s jargony. Use "curated gaps" or "ethical silence."  

  This arms you for trench warfare. Good luck—they’ll respect the nuance even when they dissent.
