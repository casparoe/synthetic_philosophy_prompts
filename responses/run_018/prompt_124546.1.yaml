  Below is a comprehensive in-class simulation design tailored to your seminar's needs. It focuses on **normative institutional lock-in** (e.g., ethical commitments, procedural precedents) rather than technological path dependence, using a "commitment token" system to simulate sunk costs in institutional capital.

  ---

  ### **Simulation: "The Normative Path"**  
  **Core Idea:** Groups design micro-institutions (rules for distributing shared points) across 3 rounds. Early choices generate "commitment tokens" representing normative capital (trust, legitimacy, procedural inertia). Reversing a prior decision later costs 3× the immediate gain, forcing trade-offs between efficiency and institutional stability.  

  **Duration:** 60 minutes  
  **Participants:** 16 students → 4 groups of 4 (3 builders, 1 auditor)  
  **Materials per Group:**  
  - 12 "commitment tokens" (coins, chips, or cards)  
  - 3 **Rule Cards** (labeled A/B/C) with 2–3 options each (see below)  
  - 1 **Auditor Rubric** (printed)  
  - Score sheet  

  ---

  ### **Rules & Rounds**  
  **Goal:** Maximize group points. Points represent institutional fitness (efficiency, fairness). Commitment tokens represent **normative capital** (e.g., trust, legitimacy, procedural stability).  

  #### **Round 1: Contingency** (10 mins)  
  - **Task:** Choose **Rule A** (distribution principle) from 3 options:  
    - A1: *Equality* (split points equally).  
    - A2: *Merit* (award points based on perceived contribution).  
    - A3: *Need* (award points based on perceived need).  
  - **Mechanics:** All options give **10 points** + **2 commitment tokens**.  
  - **Why it feels arbitrary:** No option is objectively superior. Tokens represent initial normative buy-in.  

  #### **Round 2: Increasing Returns** (15 mins)  
  - **Task:** Choose **Rule B** (enforcement mechanism) from 3 options:  
    - B1: *Voting* (majority decides distributions).  
    - B2: *Council* (rotating subgroup decides).  
    - B3: *Random* (distributions randomized).  
  - **Mechanics:**  
    - Each option gives **15 points**.  
    - **Compatibility Bonus:** If Rule B aligns with Rule A (e.g., A1 + B1 = "egalitarian voting"), gain **+5 points** and **+1 token**.  
      - *(Predefined compatibilities: A1+B1, A2+B2, A3+B3)*  
  - **Hidden Lock-in:** Tokens now entrench early choices.  

  #### **Round 3: Irreversibility** (15 mins)  
  - **Task:** Choose **Rule C** (crisis response) from 2 options:  
    - C1: *Solidarity* (guarantee minimum points to all).  
    - C2: *Efficiency* (award double points to top performers).  
  - **Mechanics:**  
    - Groups *must* adopt Rule C.  
    - **Option:** Groups can **reverse Rule A or B** to optimize for Rule C.  
      - Example: Switching from A1 (Equality) to A2 (Merit) if choosing C2 (Efficiency).  
    - **Cost:** Reversing a rule costs **3 tokens** but may increase Rule C’s point yield (e.g., C2 gives 25 points if aligned with A2, else 15).  
    - **Lock-in Condition:** The gain from reversing + Rule C points must exceed **3× the token cost** (e.g., if reversal gains 10 points, it must yield >30 net points to be "rational").  
      - *Most groups will lack tokens or net gains to justify reversal.*  

  #### **Auditor Role**  
  - Tracks alternative choices at each round and calculates "what if" scenarios.  
  - Uses **3-Criteria Rubric** post-game to score the group’s outcome:  
    | **Criterion**          | **Score (1–5)** | **Description**                                  |  
    |-------------------------|----------------|--------------------------------------------------|  
    | **Fitness-Selected**    |                | Outcome optimized efficiency/points.             |  
    | **Frozen Accident**     |                | Outcome caused by arbitrary R1 choice.           |  
    | **Normative Path-Lock** |                | Outcome driven by token commitments (even if suboptimal). |  

  ---

  ### **Timeline**  
  1. **Setup (5 mins):** Split groups, assign roles, distribute materials.  
  2. **Round 1 (10 mins):** Groups choose Rule A.  
  3. **Round 2 (15 mins):** Groups choose Rule B, record bonuses.  
  4. **Round 3 (15 mins):** Groups choose Rule C, decide whether to reverse prior rules.  
  5. **Auditor Scoring (5 mins):** Auditors apply rubric.  
  6. **Debrief (10 mins):** Groups share outcomes → instructor maps to theory.  

  ---

  ### **Predictable "Failures" & Learning Moments**  
  - **Groups miss the reversal cost:** Many will reverse Rule A/B in Round 3 without calculating the 3× token cost, realizing too late that net points decrease.  
  - **Token hoarding vs. spending:** Groups that save tokens for Round 3 still find reversal too costly, revealing lock-in.  
  - **Auditors expose divergence:** Auditors will show how the same Rule C could yield more points if groups started differently.  

  ---

  ### **Debrief: Mapping Game ↔ Theory**  
  - **Round 1 → Contingency:** "Why did you choose A1 over A2? Was there a ‘right’ answer?" (Highlight: Initial choices are arbitrary but generative).  
  - **Round 2 → Increasing Returns:** "How did your Rule A constrain Rule B? Did the token bonus feel like ‘legitimacy’?" (Link: North’s institutional matrix).  
  - **Round 3 → Irreversibility:** "Why didn’t you reverse Rule A even when you knew C2 was more efficient?" (Link: sunk costs in normative capital vs. Pierson’s path dependence).  
  - **Convergence Debate:** "Did all groups trend toward the same Rule C? Or did early choices create divergent endpoints?"  

  ---

  ### **Limitations & Niche Framing**  
  **What This Can’t Simulate:**  
  - **Long timescales:** Real institutional lock-in unfolds over decades, not minutes.  
  - **Unforeseen consequences:** Players know the rules; historical actors don’t.  
  - **Power asymmetries:** Groups are egalitarian; real institutions embed hierarchy.  

  **Niche Framing: Institutional Capital in Normative Space**  
  Unlike QWERTY (technical efficiency), this simulates **normative lock-in**:  
  - Tokens represent *procedural legitimacy* (e.g., maintaining trust by not reversing rules).  
  - Reversal costs mirror *sunk costs in institutional identity* (e.g., a democracy pivoting to technocracy erodes social contract).  
  - **Key Insight:** Groups stick to suboptimal paths not because of "efficiency" but because unraveling normative commitments is costlier than tolerating inefficiency.  

  ---

  ### **Instructor Notes**  
  - **Emphasize arbitrariness:** Stress that Round 1 options are functionally equal.  
  - **Hide the lock-in:** Don’t explain the 3× cost until Round 3; let groups discover it.  
  - **Auditor cold call:** Have auditors share rubric scores to contrast "fitness" vs. "accident" interpretations.  
  - **Real-world hook:** Post-debrief, ask: "Where do we see normative lock-in in academia, policy, or corporate governance?"  

  This design forces players to *feel* lock-in as rational choice—not abstract theory. The token mechanic and auditor rubric ensure even "efficient" outcomes are scrutinized for hidden contingency.
