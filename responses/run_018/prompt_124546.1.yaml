          Option 3: Change your Round 2 rule (dispute resolution) to an improved version that is more efficient for the new situation. This gives 30 points, but you must spend 3 commitment tokens.

          Note: At the end of the game, each unused commitment token is worth 5 points.

          Important: You can only choose Option 2 or 3 if you have at least 3 commitment tokens."

     Final score calculation:

          Total points = 
            Round 1 points (10) 
            + Round 2 points (15, plus 5 if compatible) 
            + Round 3 points (20, 30, or 30) 
            + (unused tokens * 5)

     The improved rules in Round 3 are not further specified? They are just a label to get the points.

     What predictably goes wrong:

