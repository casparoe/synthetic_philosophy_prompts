     This simulates lock-in: the institution is stuck with its existing rules because the cost of change (in institutional capital) is too high.

     The niche framing: the tokens represent normative institutional capital (trust, shared values, established procedures) that is built along the way. Spending it to change the rules erodes that capital, so the net effect is negative.

     Finally, what can't be reproduced: 
