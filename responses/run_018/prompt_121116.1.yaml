  Looking at their suggestions:
  - A bloc with perfectly correlated errors
  - Unequal competences needing weighted voting
  - Mean competence below 50% where majority rule fails
  They want students to see why the theorem's assumptions matter in real-world cases and what it actually implies about majority vs expert rule.

  I'm thinking of a licensing committee scenario because it's concrete. For the blocs, I'll have some members relying on the same memo - that breaks independence cleanly. For unequal competence, I'll make one member highly reliable but not infallible - that creates tension between expert deference and majority rule. The sub-50% case can be woven into the unequal competence part by noting how adding average members lowers group accuracy when mean competence is borderline.

  The key insight is that the theorem requires strict conditions (independence, competence above 0.5) to justify majority rule, and relaxing any condition changes the calculus - sometimes making expert rule or weighted voting superior. Students must articulate why asymptotic results don't help small groups and why correlated voters don't add real information.

  For the model answer structure:
  1. Dissect the theorem's assumptions first
  2. Show how bloc voting breaks independence (using the memo example)
  3. Analyze unequal competence case where expert deference beats majority
  4. Explain why sub-50% mean competence flips the result
  5. Discuss real-world applicability (independence failures, competence uncertainty)

  The marking scheme needs clear must-hit moves:
  - Identifying independence violation (students often miss why correlation caps group reliability)
  - Calculating when expert rule beats majority in small groups (they forget to compare)
  - Handling sub-50% case (often ignore non-monotonicity)
  - Distinguishing finite vs asymptotic claims (they conflate them)
  - Discussing applicability to democracy (overextrapolate from simplified models)

  I'll avoid computations beyond simple probabilities - focus on reasoning. The sequential voting idea is interesting but might overcomplicate the 45-minute format. Better to nail these three broken assumptions thoroughly.

  For the deliverables: starting with the crux ("The Condorcet Jury Theorem justifies majority rule only under strict independence and competence conditions; relaxing these fundamentally alters epistemic performance"), then straight into question text, model answer, and marking scheme. Keeping the political theory/epistemology tension visible by noting where conclusions are contested (e.g., whether real voters meet independence).
answer: |-
  **Crux:** The Condorcet Jury Theorem justifies majority rule only under strict independence and competence conditions; relaxing these fundamentally alters epistemic performance, often making unweighted majority inferior to weighted or expert-based alternatives for realistic group sizes.

  ---

  **EXAMINATION QUESTION**

  **Question 1 (25 Marks Total)**

  The MediTech Licensing Committee (MTLC) is a 15-member body responsible for approving or rejecting novel medical devices based on whether they are safe and effective (a fact of the matter). Historically, individual MTLC members exhibit varying levels of competence (probability of correct judgment, p_i).

  **Scenario A:** The standard MTLC operates under pure majority rule. Members are assumed independent and each has competence p_i = 0.55. Calculate the probability that the majority makes the correct decision. *(Hint: For simplicity, assume n=15, p_i identical and independent. Use the binomial probability formula or known properties.)* (3 Marks)

  **Scenario B:** Three MTLC members (Bloc B) *always* receive and rely solely on the same internal summary memo prepared by a single junior analyst. If the analyst is correct, all three are correct. If the analyst is incorrect, all three are incorrect. The analyst has competence p_analyst = 0.6. The remaining 12 members are independent of each other and of Bloc B, each with p_i = 0.55.
      i) Explain why Bloc B does *not* constitute three independent votes. (2 Marks)
      ii) Calculate the probability of a correct majority decision under pure majority rule for the full 15-member committee under this structure. (5 Marks)
      iii) Compare this probability to the probability from Scenario A and explain the significance of the difference. (3 Marks)

  **Scenario C:** A different committee of 5 experts has known, unequal competences: Member A (p_A = 0.9), Members B,C (p_B = p_C = 0.7), Members D,E (p_D = p_E = 0.55).
      i) Calculate the probability of a correct decision under pure majority rule (3 votes needed). (3 Marks)
      ii) Calculate the probability of a correct decision if the committee defers entirely to Member A. (1 Mark)
      iii) Based on your calculations for (i) and (ii), which decision rule is epistemically superior for this specific committee? Briefly explain why, referencing the Condorcet Jury Theorem's assumptions. (3 Marks)

  **General Reflection:** The Chair argues that because the Condorcet Jury Theorem shows majority correctness approaches 1 for large, competent groups, adding more average members (p_i ≈ 0.55) to the MTLC is always epistemically beneficial. Critically evaluate this claim using insights from Scenarios B and C. What essential conditions must hold for the asymptotic result to be a reliable guide for a committee of realistic size (like 15-25 members)? What does this imply for justifying pure majority rule vs. weighted or expert-based rules in real-world bodies like the MTLC? (5 Marks)

  ---

  **MODEL ANSWER (Approx. 700 Words)**

  **Scenario A:**
  For n=15 independent members, each p_i=0.55, majority correct requires at least 8 correct votes. Using the binomial distribution P(X≥8) for X~Bin(15,0.55). Calculation yields approximately **0.760**. (Calculation step: Sum_{k=8}^{15} [C(15,k) * (0.55)^k * (0.45)^{15-k}] ≈ 0.760).

  **Scenario B:**
  i) Bloc B members do not vote independently because their judgments are perfectly correlated – they all succeed or fail together based solely on one source (the analyst's memo). An error by the analyst guarantees errors by all three bloc members simultaneously. Independence requires that the correctness of one voter provides no information about the correctness of another, which is violated here.
  ii) Effectively, there are only 13 *independent* "voting units": Bloc B counts as *one* "unit" with competence p_unitB = p_analyst = 0.6 (since its 3 votes always agree), plus 12 independent members each with p_i=0.55. A majority requires at least 8 "units" correct. Calculate P(Y≥8) where Y = correctness of Unit B + correctness of 12 independent members. Unit B correctness ~ Bernoulli(0.6), Independent members correct ~ Bin(12,0.55). Calculation yields approximately **0.741**.
  iii) The probability in Scenario B (0.741) is *lower* than in Scenario A (0.760) despite having the same number of individuals and similar average competence. This difference demonstrates that **correlation destroys the "wisdom of crowds" effect predicted by the CJT.** Adding correlated voters (like Bloc B) does not add genuinely new, independent evidence. Instead, it acts like adding a single, slightly more reliable voter while inflating the group size without proportional gain, potentially even harming reliability if the correlation introduces systematic bias or if the correlated unit has lower competence than the average independent member. The group's reliability is capped by the reliability of the correlated unit(s) and the remaining independents.

  **Scenario C:**
  i) Pure Majority (Need ≥3 correct votes). Calculate P(X≥3) for the 5 members. P(X≥3) = 1 - P(X≤2). P(X=0) = (0.1*0.3*0.3*0.45*0.45), P(X=1) = P(A correct & others wrong) + P(B correct & others wrong) + ... (sum over all single successes), P(X=2) = Sum of all combinations of 2 correct. Calculation yields approximately **0.897**.
  ii) Defer to Member A: P(correct) = p_A = **0.9**.
  iii) Deferring to Member A (0.9) provides a *higher* probability of correctness than pure majority rule (0.897) for this specific small group. This contradicts the naive CJT intuition that majority rule is always superior. The CJT assumes equal (and sufficient) competence; relaxing the equality assumption is crucial here. Member A is significantly more competent than the mean (≈0.68). Weighting votes by competence (e.g., log-odds) would favor A heavily. In small groups with high variance in competence, the single best expert can outperform the majority, especially if the majority includes less competent members whose errors outweigh the collective wisdom benefit. The CJT's asymptotic guarantee doesn't help for n=5; finite-n performance depends critically on the distribution of p_i.

  **General Reflection:**
  The Chair's claim is flawed and illustrates a common misinterpretation of the CJT. Insights from Scenarios B and C show why:
  1.  **Violated Independence (Scenario B):** Adding more members only improves reliability if they add *independent* evidence. Adding members whose errors are correlated (e.g., relying on the same information source, shared biases, deference networks) does not provide new independence and can dilute or cap group accuracy. The asymptotic result *requires* independence; without it, adding members, even competent ones, may yield no improvement or even harm. Real committees often feature correlated information sources or social influence, breaking independence.
  2.  **Unequal Competence & Small Groups (Scenario C):** The CJT's limit holds for fixed *p > 0.5*, but says nothing about *finite-n* performance. When competences are unequal and the group is small, majority rule can be suboptimal. Weighting votes by competence (theoretically optimal via log-odds) or even deferring to the best expert can outperform simple majority. Adding "average" members (p_i ≈ 0.55) to a small group already containing highly competent members might *lower* the group's epistemic performance if the new members lower the *median* competence or introduce errors outweighing the marginal benefit of added (but independent) evidence. The CJT's asymptotic behavior is irrelevant for justifying adding members to groups of realistic size if the new members are only marginally competent or correlated. The theorem is silent on *who* is competent or how competence is distributed; an epistocracy (rule by the competent) might satisfy CJT conditions better than universal suffrage if the electorate's mean competence is low or correlated.
  3.  **Mean Competence Below 0.5:** Although not directly featured, the Chair's claim ignores this critical boundary. If mean competence p < 0.5, the CJT predicts majority correctness *approaches 0*, not 1. Adding more members makes the majority *less* reliable. Whether a real electorate has p > 0.5 is a highly contested empirical question the CJT cannot answer.

  For the CJT's asymptotic result to be a reliable guide for a committee like the MTLC (n=15-25), the strict conditions must *approximately* hold: members must be highly independent in their judgments *and* have mean competence *significantly* above 0.5 *and* competences should not be too unequal. Violating any condition (especially independence or competence near 0.5) means the limit result is a poor predictor, and alternatives like weighted voting, expert panels, or supermajority rules may be epistemically superior. The CJT, on its own assumptions, licenses majority rule *only* under specific ideal conditions. Justifying pure, unweighted majority rule for bodies like the MTLC or real democracies requires arguing that these conditions are sufficiently met – an argument the theorem itself does not provide, and which remains deeply contested in political theory concerning voter competence and independence.

  ---

  **MARKING SCHEME (Total 25 Marks)**

  **Must-Hit Moves (Marks allocated per component):**

  1.  **Calculates Core CJT Probability (A):** Correctly computes P(majority correct) ≈ 0.760 for n=15, p=0.55. *(3 Marks)*
      *   *Botch:* Arithmetic error, wrong n, ignores binomial requirement.
  2.  **Identifies & Explains Correlation Violation (Bi):** Clearly states Bloc B lacks independence due to perfect correlation from shared memo/source. *(2 Marks)*
      *   *Botch:* Vague reference to "dependence" without mechanism; confuses with unequal competence.
  3.  **Calculates Correlated Probability Correctly (Bii):** Models Bloc B as single unit (p=0.6) + 12 indep. (p=0.55), calculates P(≥8 units correct) ≈ 0.741. *(5 Marks)*
      *   *Botch:* Treats Bloc B as 3 independent votes; fails to reduce effective group size; arithmetic error.
  4.  **Analyzes Correlation Impact (Biii):** Compares 0.741 < 0.760, attributes difference to loss of independence/correlation, explains why correlated voters don't add independent evidence/cap reliability. *(3 Marks)*
      *   *Botch:* Only notes difference without explanation; misattributes to competence difference.
  5.  **Calculates Small Group Majority (Ci):** Correctly computes P(≥3 correct) ≈ 0.897 for given competences. *(3 Marks)*
      *   *Botch:* Assumes equal competence; arithmetic error in combinatorics.
  6.  **Calculates Expert Deference (Cii):** Correctly states P(correct) = 0.9. *(1 Mark)*
      *   *Botch:* Any error.
  7.  **Compares Rules & Cites Unequal Competence (Ciii):** Identifies expert deference (0.9) > majority (0.897), explicitly links superiority to relaxation of equal competence assumption in CJT, mentions small group size/finite-n context. *(3 Marks)*
      *   *Botch:* States which is better without comparison; ignores unequal competence; appeals only vaguely to CJT limit.
  8.  **Critically Evaluates Chair's Claim Using Scenarios (GR):** Integrates insights:
      *   **B:** Adding correlated members doesn't help/can hurt (independence failure). *(1 Mark)*
      *   **C:** Adding average members *can* hurt in small groups with unequal competence; expert/weighted rule can beat majority. *(1 Mark)*
      *   **Handles Sub-0.5 Implication:** Notes Chair ignores risk that p<0.5 makes majority worse. *(1 Mark)*
      *   **Distinguishes Finite-n vs. Limit:** Explicitly states asymptotic result ≠ finite-n performance, especially for n~20. *(1 Mark)*
      *   **Conditions for Applicability:** Summarizes necessity of approximate independence, p>0.5, and implications for majority vs. alternatives. *(1 Mark)*
      *   *Botches (Common):* Only repeats scenario results without synthesis; ignores finite-n distinction; fails to mention sub-0.5 case; asserts CJT justifies democracy without caveats; doesn't connect to weighted/expert alternatives.

  **Grading Standard:**
  *   **A (21-25 Marks):** Hits all key moves correctly. Especially strong in General Reflection: integrates B & C insights fully, explicitly distinguishes finite-n from limit, handles sub-0.5, clearly states necessary conditions, discusses implications for rule types contestedly.
  *   **B (16-20 Marks):** Hits most core calculations (A, Bii, Ci, Cii) correctly and key explanations (Bi, Biii). General Reflection integrates at least one scenario insight well and mentions finite-n/limit distinction or sub-0.5, but may be less complete or precise on conditions/implications.
  *   **C (11-15 Marks):** Significant errors in calculations or major explanations missing/muddled (e.g., botches correlation explanation, misses expert>majority comparison). General Reflection weak, possibly just repeating scenario points without synthesis or critical evaluation of Chair's claim.
  *   **D (6-10 Marks):** Multiple major calculation errors and poor explanations. Little coherent analysis in General Reflection.
  *   **F (0-5 Marks):** Fundamentally misunderstands scenarios/CJT, minimal attempt, or largely blank.
