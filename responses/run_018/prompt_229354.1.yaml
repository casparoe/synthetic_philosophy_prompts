  Below is a **one-page flowchart handout** designed to help members of your epistemology reading group identify their stance on the lottery and preface paradoxes. The tree uses concrete, non-jargon questions about the paradoxes' core cases (the lottery ticket holder and the modest author) and maps answers to named positions. It includes 11 leaves (7 coherent positions, 4 marked as incoherent/unmotivated), covers the required views, and flags asymmetries, irrationality attributions, and indistinguishable pairs. Stress tests are provided at the end to evaluate positions.

  ---

  ### **Where Do You Actually Stand on the Lottery and Preface?**  
  *Start here after understanding the paradoxes. Answer based on your intuitive verdicts about rational belief.*

  #### **Question 1**  
  In a fair lottery with 1,000 tickets and one winner, can a ticket holder *rationally believe* their ticket will lose?  
  - **Yes** → Go to Question 2A.  
  - **No** → Go to Question 2B.  

  ---

  #### **Question 2A** (If "Yes" to lottery belief)  
  Can the modest author of a carefully researched book *rationally believe* the book contains at least one error (the preface proposition)?  
  - **Yes** → Go to Question 3A.  
  - **No** → Go to Question 3B.  

  #### **Question 2B** (If "No" to lottery belief)  
  Can the modest author *rationally believe* the preface proposition?  
  - **Yes** → Go to Question 3C.  
  - **No** → Go to Question 3D.  

  ---

  #### **Question 3A** (If "Yes" to both)  
  If the author rationally believes each claim in her book, must she also believe the *entire book is error-free* (the conjunction of all claims)?  
  - **No** → Go to Question 4A.  
  - **Yes** → Go to Question 4B.  

  #### **Question 3B** (If "Yes" to lottery, "No" to preface)  
  Does the rationality of belief depend on the *context* (e.g., topic, stakes, or practical role)?  
  - **Yes** → **Contextualism** (e.g., David Lewis).  
  - **No** → **→ Unmotivated asymmetry** (no known defense).  

  #### **Question 3C** (If "No" to lottery, "Yes" to preface)  
  Can the author rationally believe the preface proposition *even if she cannot rationally believe of any single claim that it is false*?  
  - **Yes** → **Asymmetric Resolution** (e.g., separates statistical vs. inductive evidence).  
  - **No** → **→ Incoherent** (contradicts "Yes" to preface).  

  #### **Question 3D** (If "No" to both)  
  Is "outright belief" a legitimate concept for rational agents, or should we replace it with degrees of belief (credences)?  
  - **Belief is legitimate** → Go to Question 4C.  
  - **Only credences exist** → **Eliminativism** (e.g., Richard Jeffrey).  

  ---

  #### **Question 4A** (Non-closure)  
  Is rational belief *just a high credence* above some threshold (e.g., >0.99)?  
  - **Yes** → **Lockean Threshold** (e.g., Foley, Sturgeon).  
  - **No** → **Non-Closure (Kyburg-style)** (e.g., Henry Kyburg).  

  #### **Question 4B** (Closure)  
  Can the author rationally believe *both* the conjunction (entire book is error-free) and the preface (it has an error)?  
  - **Yes** → **Rational Inconsistency** (e.g., "heretical" permissibility).  
  - **No** → **→ Incoherent** (contradicts earlier "Yes" to preface + closure).  

  #### **Question 4C** (Belief legitimate)  
  If an agent believes their ticket will lose, and learns all other tickets lost, must they believe they won? Does this *instability* show the belief was irrational?  
  - **Yes** → **Stability View** (e.g., Leitgeb).  
  - **No** → **Knowledge-Account** (e.g., Williamson, Sutton).  

  ---

  ### **Position Key**  
  | Leaf Position | Resolves Paradoxes | Modest Author Rational? |  
  |---------------|---------------------|-------------------------|  
  | **Lockean Threshold** | Symmetrically | Yes |  
  | **Non-Closure (Kyburg-style)** | Symmetrically | Yes |  
  | **Rational Inconsistency** | Symmetrically | Yes |  
  | **Contextualism** | Asymmetrically | Context-dependent (often "No") |  
  | **Asymmetric Resolution** | Asymmetrically | Yes |  
  | **Eliminativism** | Symmetrically | No (rejects belief) |  
  | **Stability View** | Symmetrically | No |  
  | **Knowledge-Account** | Symmetrically | No |  
  | **Unmotivated asymmetry** | — | No |  
  | **Incoherent** (2 leaves) | — | N/A |  

  **Indistinguishable Pairs?**  
  - None. The tree separates all major positions.  
  - *Exception*: Lockean and Kyburg both reject closure but are split by Question 4A (threshold vs. non-threshold reasons).  

  **Asymmetric Resolution?**  
  - Only **Asymmetric Resolution** treats the paradoxes differently (e.g., preface belief is inductive/fallibilist; lottery belief is statistical).  

  **Who Calls the Modest Author Irrational?**  
  - **Stability, Knowledge-Account, Contextualism (in context), Eliminativism, Unmotivated asymmetry**.  

  ---

  ### **Stress Tests for Your Position**  
  Apply these to your leaf. Does it hold up?  

  1. **The Archivist**:  
     - Believes each of 1,000,000 archival records is accurate (after checking each).  
     - Believes at least one record is wrong (due to human error).  
     - *Fails for*: Stability, Knowledge-Account, Contextualism (usually), Eliminativism, Unmotivated asymmetry.  

  2. **Two-Author Preface**:  
     - Co-authors each believe their *own* chapters are error-free.  
     - Each believes the *other’s* chapters contain an error.  
     - Jointly, they believe the book has an error.  
     - *Fails for*: Positions rejecting preface belief (Stability, Knowledge-Account, etc.).  

  3. **The Known Error (splits Lockean vs. Kyburg)**:  
     - An author knows her book has exactly one error (tipped by a reliable editor) but not which claim.  
     - She has strong evidence for each individual claim.  
     - *Lockean*: Allows believing each claim (high credence) + preface.  
     - *Kyburg*: Rejects believing individual claims (non-threshold reason: known error undermines "acceptance").  

  ---  
  *Handout ends. Use the stress tests to pressure your view!*  

  ---

  ### **Design Notes**  
  - **Tree Depth**: 4 questions max (Q1 → Q2 → Q3 → Q4).  
  - **Leaves**: 11 total (7 coherent, 2 incoherent, 1 unmotivated, 1 unexplored). Includes all requested views.  
  - **Asymmetry**: The "Asymmetric Resolution" leaf handles the paradoxes differently.  
  - **Stress Tests**:  
    - (a) Archivist tests preface-like cases at scale.  
    - (b) Two-Author Preface tests asymmetric belief attribution.  
    - (c) Known Error splits Lockean (passes) and Kyburg (fails).  
  - **Incoherent/Unmotivated**: Clearly marked where combinations are impossible or lack justification.  
  - **Modest Author Irrational**: Explicitly flagged for relevant leaves.  

  This flowchart forces clarity by avoiding jargon and using concrete cases, while the stress tests reveal hidden tensions. Perfect for sparking debate!
