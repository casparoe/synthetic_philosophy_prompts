  I need to start by understanding their position clearly. They're rejecting both coincidence (two objects in one place) and mere perspectivalism (just different descriptions). Instead, they're grounding identity conditions in normative practices, which affects modal properties like survival conditions. For example, squashing destroys the statue but not the clay lump, depending on which practice we're using.

  Now, thinking about potential defeaters. First, the most serious objections would be those that show internal contradictions. If the same object can't simultaneously have incompatible properties without contradiction, that might be fatal. For instance, if the statue must survive certain changes in one practice but not in another, and those changes actually happen, we face a literal contradiction in properties. The user might counter by saying these properties are framework-dependent, but this could lead to truth relativism, which many metaphysicians reject. This feels like a fatal flaw unless they embrace a radical relativism.

  Next, consider cases where normative practices conflict. What if art conservation requires preserving the statue, but geological practice deems it altered? If both practices apply simultaneously, how do we resolve conflicting identity conditions? The user might say practices don't apply at the same time, but that seems ad hoc. This is very damaging but maybe not fatal if they can argue practices are context-specific.

