prompt: |-
  I am a staff engineer at a company of about 250 people, and I own the measurement layer for our internal developer platform. Several times a quarter I am asked to turn a qualitative goal — "make the platform easier to ship on", "improve the reliability of service X", "raise code quality" — into numbers that then do real work: they go into team OKRs that a director reviews, into a launch gate for a migration, and into promotion packets. Call it a dozen to twenty metrics a year, each of which gets roughly one 90-minute working session with me, one data analyst (no statistics PhD anywhere on my team), an engineering director who signs off, and the lead of the team that will live under the metric.

  I am good at writing specifications for APIs and I am bad at this. Every time a number of mine starts to matter, it stops tracking the thing it was supposed to track. I have read the popular write-ups of the effect people call Goodhart's law; they are long on diagnosis and anecdote and short on anything I can run on a Tuesday. So I want a procedure, not an explanation.

  Please write me a decision procedure I can apply to a candidate metric before it is allowed to govern anything, and re-apply when a metric already in force looks suspicious. Ordered steps, each with: the question to ask; what counts as a sufficient answer (and what counts as hand-waving); the artifact I should record; and an explicit stopping rule — either stop with a "no, this metric may not govern that decision", or hand off to a named human because the question is one of values rather than facts. Then give me a one-page "metric charter" template that captures the outputs of the steps.

  I want the procedure to build on the following distinctions, which I have found useful but cannot systematize. Please keep them, sharpen them where they are muddled, and tell me if any of them is wrong or collapses into another:

  1. Classify the failure before treating it. A metric can stop tracking its goal because the world moved and the correlation decayed with nobody responding to it; because the people under the metric changed their behaviour to move the number; because we optimised the number far outside the range of conditions in which anyone ever checked that it tracked the goal; or because measuring and reporting the number changed the system being measured, so that the target itself moved. These have different remedies, so classification has to be step one — and it has to be doable from artifacts we actually have (dashboards, commit and review history, ticket data, incident write-ups), not from guessing at intentions. I cannot prove anyone gamed anything, and I do not want a procedure whose output is an accusation.

  2. The indifferent optimizer. Instead of asking whether anyone would cheat, ask what a competent, well-meaning engineer who has no interest whatsoever in the goal and every interest in the number would do, given the tools and permissions they actually have. Name the concrete behaviour. If the list is long, that is evidence about the metric rather than about the team.

  3. The blindness profile. An explicit list of what the metric is structurally incapable of registering: things that never enter the data source at all, effects that only appear on timescales longer than the reporting window, qualities that have no unit, and costs borne by people outside the measured population. Require naming the single most important item on that list, and require someone to sign their name to it.

  4. The validated envelope. State the range of conditions and values within which anyone ever checked that moving the number moved the goal, and state where current and target values sit relative to that range. If nobody ever checked, the procedure must stop with a "no" rather than produce a confidence score.

  5. A second channel. For any metric that governs a high-stakes decision, require an independent signal not computed from the same underlying source, chosen so that it fails in a different direction from the first. Where no such channel exists, the procedure should say so plainly and route the decision to a human with a review date, rather than implying the number is adequate on its own.

  6. A pre-registered kill condition. At definition time, write down what observation would make us stop using this metric, set a review date, and record a rough half-life estimate in quarters — "unknown" is an acceptable entry only if it is written down as such. "We'll keep an eye on it" should count as a failed step.

  The procedure must also mark its own limits: which steps produce answers from data and which are value judgments it is not entitled to make — which goals are worth pursuing at all, the exchange rate between units of the proxy and units of the goal, and how much false-positive versus false-negative risk we accept. Where a step looks rigorous but is really a judgment call in a lab coat, say so in the step.

  Then apply the finished procedure to three cases from my world, showing the artifacts and the point at which each case stops or hands off:

  (a) Deployment frequency and change-failure-rate targets attached to a gate that decides whether a large service migration is allowed to proceed.

  (b) Counts derived from bug trackers — open P1s, or bugs closed per sprint — used as an input to promotion packets, where the declared goal is code quality.

  (c) A composite "developer productivity index" that our platform dashboard already computes and that leadership is attached to. I suspect the procedure will tell me to stop using it. If that is where it lands, work it through to that conclusion anyway and draft the two or three sentences I would actually have to say to the director who likes it.

  Finish by stating what the procedure cannot do: the situations where it simply does not apply (systems too new to have a validated envelope, goals with no unit at all, goals that are contested rather than merely hard to measure), and the ways it will misfire even when applied honestly — slow drift below the detection threshold, blindness lists that are effectively unbounded.

  Two constraints. Please draw your examples from software engineering rather than from the standard folklore about bounties and factory quotas, and do not give me citations, a reading list, or a bibliography: I have no way to check them and I am not asking for the literature. I want something I can run in ninety minutes with a data analyst and defend in a room.
reasoning: |-
  We are going to design a decision procedure for metric validation and maintenance. The procedure is built around the distinctions provided and will output either a rejection of the metric for the given decision context or a "charter" for the metric that includes the required artifacts.

  The steps of the procedure are designed to be applied in order. Each step has:
  - A question to ask
  - What counts as a sufficient answer (and what is hand-waving)
  - The artifact to record
  - A stopping rule (either stop and reject, or hand off to a named human because it's a value judgment)

  Additionally, we will create a "metric charter" template that captures the outputs.

  We'll then apply the procedure to the three cases.

  ---

  **Decision Procedure: Validating and Maintaining Metrics**

  **Step 0: Preconditions**
  - **Question:** Is the metric intended to govern a decision? (If not, the procedure may not be necessary, but if it's going to be used in any governing context, proceed.)
  - **Sufficient answer:** Yes, and we have a clear understanding of the decision context (e.g., OKRs, launch gate, promotion).
  - **Artifact:** Decision context statement (one sentence).
  - **Stopping rule:** If the metric is not intended to govern a decision, stop the procedure (not applicable). Otherwise, proceed.

  **Step 1: Classify the Failure (if the metric is already in use) or Anticipate Failure Modes (for new metrics)**
  - **Question (for existing metrics):** Based on artifacts (dashboards, commit history, ticket data, incident write-ups), what pattern of divergence is observed? Choose one: 
    (a) The world moved (external factors changed the system, and the metric moved without corresponding goal movement, or vice versa) 
    (b) Behavioral change (people under the metric changed behavior and moved the number, but the goal did not move as expected) 
    (c) Optimization outside validated envelope (we pushed the metric beyond the range where it was validated) 
    (d) Measurement altered the target (the act of measuring changed the goal itself, e.g., by redefining what "quality" means to fit the metric).
  - **Question (for new metrics):** What is the most likely failure mode? (Use the same categories, based on analogous past metrics or known system dynamics.)
  - **Sufficient answer:** A specific category selected with evidence from artifacts (for existing) or reasoning by analogy (for new). Hand-waving: Vague statements without reference to data or past examples.
  - **Artifact:** Record the classification and the evidence (e.g., "Dashboard shows metric increased but incident rate unchanged; commit history shows changes in deployment patterns").
  - **Stopping rule:** If the failure mode is (c) and the current value is outside the validated envelope (see Step 4), stop and reject the metric for the current decision. Otherwise, proceed.

  **Step 2: The Indifferent Optimizer**
  - **Question:** What would a competent, well-meaning engineer (with no interest in the goal but every interest in the number) do to move the metric, given their actual tools and permissions? List concrete behaviors.
  - **Sufficient answer:** A list of specific, feasible actions (e.g., "break up deployments into smaller chunks to increase deployment frequency", "reclassify bugs as P2 to reduce open P1 count"). Hand-waving: General statements like "they might game it" without concrete examples.
  - **Artifact:** List of actions (even if hypothetical for new metrics).
  - **Stopping rule:** If the list is long (say, more than 3 distinct actions) and these actions are likely to harm the goal, reject the metric. Otherwise, proceed.

  **Step 3: The Blindness Profile**
  - **Question:** What is the metric structurally incapable of registering? (e.g., missing data sources, timescales longer than the reporting window, unmeasurable qualities, costs borne by outsiders). What is the single most important blind spot?
  - **Sufficient answer:** A list of blind spots and the identification of the most critical one. Hand-waving: Denial of blind spots or vague statements.
  - **Artifact:** List of blind spots and the top one highlighted. Also, record the name of the person (e.g., the director) who signs off on accepting this blind spot.
  - **Stopping rule:** If the most critical blind spot is judged to be unacceptable for the decision context, hand off to a human (the director) to decide whether to proceed despite it. The human must sign. If they refuse, reject.

  **Step 4: The Validated Envelope**
  - **Question:** What is the range of conditions (e.g., system state, load, team size) and metric values within which we have evidence that moving the metric moved the goal? Where do the current and target values lie relative to this envelope?
  - **Sufficient answer:** Explicit boundaries (e.g., "deployment frequency between 1/day and 1/week, with team size 5-10") and a statement of whether current/target are inside. For new metrics, if no validation exists, state "none". Hand-waving: Using the metric without any validation history.
  - **Artifact:** Description of the envelope and a plot or table of the validation data if available. Mark current and target values.
  - **Stopping rule:** If there is no validated envelope, reject the metric for any governing decision. If current or target is outside the envelope, reject for decisions that require extrapolation.

  **Step 5: A Second Channel**
  - **Question:** For high-stakes decisions, what independent signal (different data source, different method) can we use to detect if the metric is misleading? How does it fail in a different direction?
  - **Sufficient answer:** A concrete alternative metric or qualitative check (e.g., for deployment frequency, use lead time for changes; for bug counts, use severity-weighted age of bugs). Describe how it might fail independently (e.g., second channel might be noisy but not subject to the same manipulation). Hand-waving: Using a metric derived from the same underlying data.
  - **Artifact:** Description of the second channel and its failure modes.
  - **Stopping rule:** If no second channel is available for a high-stakes decision, hand off to a human (the director) to decide whether to proceed with a review date set (e.g., 3 months). The human must set the review date. If they refuse, reject.

  **Step 6: Pre-registered Kill Condition**
  - **Question:** What specific observation would cause us to stop using this metric? Set a review date and estimate a half-life (in quarters) for the metric's usefulness.
  - **Sufficient answer:** A concrete trigger (e.g., "if the correlation between metric and goal drops below 0.5", "if we see two consecutive quarters of metric improvement without goal improvement"). A fixed review date (e.g., 6 months) and a half-life estimate (e.g., 8 quarters). Hand-waving: "We'll watch it" without specifics.
  - **Artifact:** Kill condition, review date, and half-life estimate.
  - **Stopping rule:** If the kill condition is met now, reject the metric. Otherwise, proceed to record the charter.

  **Step 7: Record the Charter**
  - If all steps are passed, record the metric charter (template below) and allow the metric to be used for the decision.

  ---

  **Metric Charter Template**

  **Metric Name:**
  **Decision Context:**
  **Owner:**
  **Date Created:**
  **Review Date:** (from Step 6)

  1. **Purpose:** (Qualitative goal the metric proxies for)
  2. **Failure Classification (for existing) or Anticipated Failure Mode (for new):** (From Step 1)
  3. **Indifferent Optimizer Behaviors:** (From Step 2)
  4. **Blindness Profile:** 
     - Full list: [list]
     - Most critical blind spot: [item] (Signed by: ________)
  5. **Validated Envelope:** 
     - Conditions: [description]
     - Metric range: [min, max]
     - Current value: [value] (inside/outside)
     - Target value: [value] (inside/outside)
  6. **Second Channel:** 
     - Name: [name]
     - How it fails differently: [description]
     - (If not available for high-stakes, note: "Waived by [name] on [date] for decision [context], with review on [date]")
  7. **Kill Condition:** [condition]
  8. **Half-Life Estimate:** [number] quarters (or "unknown" if recorded as such)

  ---

  **Limits of the Procedure:**
  - The procedure does not judge whether the goal is worth pursuing (value judgment).
  - It does not set the exchange rate between the proxy and the goal (value judgment).
  - It does not set the acceptable risk of false positives vs. false negatives (value judgment).
  - Steps that look rigorous but are judgment calls: 
    - Step 1 (classification) relies on interpretation of artifacts.
    - Step 3 (blindness) requires prioritizing what is "most critical", which is subjective.
    - Step 2 (optimizer) is hypothetical and may miss creative gaming.

  ---

  **Situations where the procedure does not apply:**
  - Systems too new to have a validated envelope (Step 4 will reject).
  - Goals with no unit at all (we cannot even define a proxy).
  - Goals that are contested (e.g., what "developer productivity" means) — the procedure assumes we agree on the goal, just not how to measure it.

  **Ways it will misfire:**
  - Slow drift: The metric may decay very slowly, and the kill condition might not trigger until too late.
  - Blindness lists may be incomplete or the "most critical" item might be wrong.
  - The indifferent optimizer might find new behaviors we didn't anticipate.

  ---

  **Applying the Procedure to Cases**

  **Case (a): Deployment frequency and change-failure-rate targets for a migration launch gate**

  - **Step 0:** This is a governing decision (launch gate). Proceed.
  - **Step 1 (Anticipate):** Most likely failure mode is (b) behavioral change (teams might deploy more frequently but with smaller, less risky changes to keep failure rate low, or they might avoid necessary changes to keep failure rate low). This is based on common industry experience.
  - **Step 2:** Indifferent optimizer:
    - For deployment frequency: Break up a single change into multiple deployments (even if not useful to users) to increase frequency.
    - For change failure rate: Avoid making complex changes near the measurement window, or redefine what a "failure" is (e.g., by lowering severity of incidents).
    - List is concrete and non-trivial (2-3 items per metric).
  - **Step 3:** Blindness profile:
    - Deployment frequency: Blind to the value of the changes (might be trivial). Most critical: Deployments that don't deliver user value.
    - Change failure rate: Blind to near-misses and failures that are not detected (e.g., silent data corruption). Most critical: Undetected failures.
    - Sign-off required from the director (who is the decision-maker for the gate).
  - **Step 4:** Validated envelope:
    - Typically, these metrics are validated in the context of continuous delivery for small services. But this is a migration of a large service. The current state might be far from the envelope (e.g., if the service currently deploys monthly, and the target is daily). If no validation exists for large services, then the envelope is unknown for this context.
    - **Stopping rule:** If there's no validation for large services, we must reject. But note: we might have data from similar migrations? If not, reject.
  - **Result for (a):** Reject at Step 4. The metric cannot be used for the launch gate because we are outside the validated envelope (or there is none for this context). We hand off to the director: without a validated metric, the gate decision must be made qualitatively. We can still collect data during the migration for future validation.

  ---

  **Case (b): Bug tracker counts (open P1s, bugs closed per sprint) for promotion packets (goal: code quality)**

  - **Step 0:** Governing decision (promotion). High-stakes. Proceed.
  - **Step 1 (Anticipate):** Failure mode (b) behavioral change: Engineers might avoid logging bugs, reclassify P1s as P2s, or close bugs without fixing (e.g., marking as "won't fix"). Evidence: ticket data might show a drop in P1 creation or an increase in bugs closed without resolution comments.
  - **Step 2:** Indifferent optimizer:
    - Open P1s: Pressure to downgrade or close P1s quickly (even if not resolved).
    - Bugs closed per sprint: Close easy bugs and ignore hard ones, or even create trivial bugs to close.
    - List is long and concerning.
  - **Step 3:** Blindness profile:
    - Blind to bugs that are never reported (poor testing or user feedback), bugs that are not fixed properly (reopened later), and quality aspects beyond bugs (e.g., maintainability, technical debt). Most critical: The metric doesn't capture the absence of bugs (only the ones found) and may incentivize reducing visibility of bugs.
    - Sign-off required by the promotion committee (or the director).
  - **Step 4:** Validated envelope:
    - Is there evidence that reducing open P1s or closing more bugs improves code quality? Probably not directly validated. We might have data showing that teams with lower open P1s have fewer incidents? But code quality is broader. Likely, no validated envelope for promotion (which looks at individual contribution). 
    - **Stopping rule:** Reject because no validated envelope exists for this context (individual level, code quality).
  - **Result for (b):** Reject at Step 4. However, promotion decisions are inherently qualitative. We hand off to the promotion committee: the metric might be one input among many, but it cannot be the primary one. The committee must use qualitative judgment.

  ---

  **Case (c): Composite "developer productivity index" on platform dashboard**

  - **Step 0:** Used in dashboards and likely influences decisions (e.g., investment, goal setting). It governs implicitly. We treat as governing. Proceed.
  - **Step 1 (Anticipate):** Failure mode (b) and (d): Teams might optimize for the components of the index (e.g., if it includes deployment frequency, they might increase it without real productivity gain). Also, the index itself might redefine productivity to what it measures (d). Evidence: if the index moves up but engineers complain about productivity, that's a divergence.
  - **Step 2:** Indifferent optimizer:
    - Depends on the components, but likely: optimize the easy components (e.g., if it includes commit count, make more trivial commits; if it includes deployment frequency, break up changes).
    - Long list expected.
  - **Step 3:** Blindness profile:
    - Blind to: unmeasured aspects (e.g., collaboration, innovation, long-term health), and it might incentivize local optimization at the cost of system-wide productivity. Most critical: It might not capture the actual outcome (shipping valuable software) and could encourage busywork.
    - Sign-off by leadership (director).
  - **Step 4:** Validated envelope:
    - Composite indices are hard to validate. Likely, no one ever checked that moving the index actually improves productivity. It might be a weighted average of proxies that individually have weak validation.
    - **Stopping rule:** Reject because no validated envelope exists.
  - **Result for (c):** Reject at Step 4. But since leadership is attached to it, we hand off to the director with a strong warning.

  **What to say to the director:**
  "We have evaluated the developer productivity index using our new metric validation procedure. The index does not have a validated envelope: we have never confirmed that improving the index actually improves productivity. Moreover, it has significant blind spots and can be gamed in multiple ways. Therefore, it should not be used to govern decisions. We recommend removing it from the dashboard or using it only as a conversation starter, not a target. We can work on defining validated metrics for specific aspects of productivity."

  ---

  **Final Note:** The procedure is designed to catch the most common pitfalls but requires diligence. It should be run at definition time and whenever a metric starts to look suspicious. It takes about 90 minutes per metric if the artifacts are available.
answer: |-
  ### Decision Procedure for Metric Validation and Maintenance  
  **Purpose:** To systematically evaluate a candidate metric for use in governing decisions (e.g., OKRs, launch gates, promotions) or to diagnose a suspicious in-use metric. Outputs a "Metric Charter" or a reject/handoff decision.  
  **Time:** Designed for a 90-minute session with a data analyst, engineering director, and team lead.  
  **Materials Needed:** Dashboards, commit/review history, ticket data, incident write-ups, and access to metric computation logic.  

  ---

  #### Step 0: Define Decision Context  
  **Question:** "What decision will this metric govern, and what qualitative goal does it proxy for?"  
  **Sufficient Answer:** Concrete description of the decision (e.g., "gate for service migration") and the goal (e.g., "improve reliability").  
  **Hand-Waving:** Vague statements like "track overall health" without a decision link.  
  **Artifact:** Document: "Decision: [description]. Goal: [qualitative statement]."  
  **Stopping Rule:** If no decision/goal is defined, **stop—reject metric**. Else, proceed.  

  ---

  #### Step 1: Classify the Failure Mode (For In-Use Metrics) or Anticipate Failure (For New Metrics)  
  **Question:** "Using artifacts (dashboards, commits, tickets, incidents), does the metric diverge from the goal? If so, how?"  
  **Sufficient Answer:** Pick one failure type with evidence:  
  - **A: World moved** (e.g., correlation decayed with no behavioral change; evidence: metric and goal diverged amid external events).  
  - **B: Behavior changed** (e.g., engineers optimized the number; evidence: commits/tickets show tactical changes coinciding with metric shifts).  
  - **C: Outside validated envelope** (e.g., metric pushed beyond tested range; evidence: target value is 2x historical max per past data).  
  - **D: Target moved** (e.g., measuring altered the goal; evidence: goal redefined in docs after metric introduction).  
  **Hand-Waving:** Blaming "gaming" without artifact-backed examples.  
  **Artifact:** One-sentence classification + evidence (e.g., "Type B: commit history shows engineers split deployments to inflate frequency").  
  **Stopping Rule:** If Type C and current/target value is outside the validated envelope (Step 4), **stop—reject metric**. Else, proceed.  

  ---

  #### Step 2: Indifferent Optimizer Test  
  **Question:** "What would a competent, well-meaning engineer (focused solely on the metric) do to move it, given their actual tools?"  
  **Sufficient Answer:** List 1–3 concrete, feasible actions (e.g., "reduce deployment size to inflate frequency," "downgrade P1 bugs to P2").  
  **Hand-Waving:** Generic claims like "they might cheat" without specifics.  
  **Artifact:** Bullet-point list of behaviors.  
  **Stopping Rule:** If >3 distinct actions exist and all harm the goal, **stop—reject metric**. Else, proceed.  

  ---

  #### Step 3: Blindness Profile  
  **Question:** "What is the metric structurally blind to? What is the single biggest gap?"  
  **Sufficient Answer:** List of blind spots (e.g., "can’t capture long-term tech debt," "ignores feedback from QA team"). Identify #1 (e.g., "no visibility into code maintainability").  
  **Hand-Waving:** Claiming "no blind spots" or omitting external costs.  
  **Artifact:** "Blindness: [list]. Top Gap: [item]." + Director’s signature acknowledging acceptance.  
  **Stopping Rule:** If the top gap undermines the decision (e.g., promotion metric ignores code quality), **hand off to director**. They must sign or reject.  

  ---

  #### Step 4: Validated Envelope Check  
  **Question:** "What conditions (e.g., system load, team size) and metric values were tested to confirm correlation with the goal?"  
  **Sufficient Answer:** Explicit range (e.g., "frequency = 1–5 deploys/day; team size = 5–10") and evidence (e.g., "A/B test in Q2 showed 20% reliability gain").  
  **Hand-Waving:** Assuming correlation without data or using untested extrapolation.  
  **Artifact:** "Validated Range: [min] to [max] under [conditions]. Current/Target: [value]."  
  **Stopping Rule:** If no validation exists, **stop—reject metric**. If current/target is outside the range, **stop—reject metric**.  

  ---

  #### Step 5: Second Channel Requirement  
  **Question (For High-Stakes Only):** "What independent signal (different data source/methodology) can detect if this metric fails?"  
  **Sufficient Answer:** A practical alternative (e.g., "qualitative user surveys" for reliability; "static code analysis scores" for quality) with different failure modes (e.g., "surveys catch false negatives in incident metrics").  
  **Hand-Waving:** Using a metric derived from the same source (e.g., "deployment success rate" when main metric is "deployment frequency").  
  **Artifact:** "Second Channel: [name]. Fails Differently By: [description]."  
  **Stopping Rule:** If no second channel exists for high-stakes decisions (e.g., promotions), **hand off to director** to set a review date (e.g., 3 months). No date → **reject metric**.  

  ---

  #### Step 6: Pre-Registered Kill Condition  
  **Question:** "What specific event would kill this metric? What is its half-life?"  
  **Sufficient Answer:** Concrete trigger (e.g., "correlation with goal < 0.5") and half-life estimate (e.g., "4 quarters" or "unknown").  
  **Hand-Waving:** "We’ll monitor it" without criteria.  
  **Artifact:** "Kill Condition: [trigger]. Half-Life: [estimate]. Review Date: [date]."  
  **Stopping Rule:** If kill condition is met now, **stop—reject metric**. Else, proceed to **charter**.  

  ---

  ### Metric Charter Template  
  **Metric Name:**  
  **Date:**  
  **Decision Context:** [From Step 0]  
  **Goal Proxied:**  
  **Owner:**  
  **Failure Classification:** [From Step 1]  
  **Indifferent Optimizer Behaviors:** [From Step 2]  
  **Blindness Profile:**  
  - Full List: [Item 1, Item 2...]  
  - Top Gap: [Item] (Signed: ________)  
  **Validated Envelope:**  
  - Range: [Min] to [Max]  
  - Conditions: [E.g., "Team size < 15, on-prem infra"]  
  - Current/Target Value: [Value] (In/Out of Envelope)  
  **Second Channel (If Applicable):** [Name + How It Fails Differently]  
  **Kill Condition:** [Trigger] | **Half-Life:** [Estimate] | **Review Date:** [Date]  

  ---

  ### Application to Your Cases  

  #### Case (a): Deployment Frequency & Change-Failure Rate for Migration Gate  
  - **Step 0:** Decision = "Gate for service migration." Goal = "Improve reliability."  
  - **Step 1 (Anticipate):** Likely Type B (engineers optimize frequency via smaller, less risky changes). Evidence: Ticket data shows deploy size dropped 80% in past migrations.  
  - **Step 2:** Behaviors = (1) Split single logical changes into micro-deploys; (2) Delay high-risk changes until post-migration.  
  - **Step 3:** Blindness = (1) Can’t detect if changes deliver user value; (2) Ignores infra costs. Top Gap = "Deploys lack user impact." → **Director signs**.  
  - **Step 4:** Validated envelope = "Frequency 1–3/day, failure rate < 5%." Target = "Frequency 5/day, failure rate 2%" → **Outside envelope! Stop—reject metric**.  
  - **Outcome:** Metric **rejected** for gate. Tell director: "Frequency/reliability targets are outside historical validation range. Use qualitative review or delay gate until envelope is expanded."  

  #### Case (b): Bug Counts (Open P1s) in Promotion Packets  
  - **Step 0:** Decision = "Input for promotions." Goal = "Raise code quality." High-stakes → requires second channel.  
  - **Step 1 (Anticipate):** Type B (engineers downgrade P1s). Evidence: Ticket history shows 40% P1s downgraded to P2s during promotion cycles.  
  - **Step 2:** Behaviors = (1) Downgrade severity; (2) Delay bug logging until post-promotion.  
  - **Step 3:** Blindness = (1) No capture of design quality; (2) Ignores bug recurrence. Top Gap = "Misses maintainability." → **Director signs**.  
  - **Step 4:** No validation for individual promotions (only team-level). → **Stop—reject metric**.  
  - **Outcome:** Metric **rejected** for promotions. Tell committee: "Bug counts lack validation for individual impact. Use code reviews or peer feedback instead."  

  #### Case (c): Composite "Developer Productivity Index"  
  - **Step 0:** Decision = "Platform dashboard for resourcing." Goal = "Improve developer productivity."  
  - **Step 1 (Anticipate):** Type D (metric redefines productivity). Evidence: Engineers now optimize for index components (e.g., commit count).  
  - **Step 2:** Behaviors = (1) Write trivial commits; (2) Prioritize easy tasks over high-impact work.  
  - **Step 3:** Blindness = (1) No innovation capture; (2) Ignores cross-team blockers. Top Gap = "Incentivizes busywork." → **Director signs**.  
  - **Step 4:** No validation (index built from untested proxies). → **Stop—reject metric**.  
  - **Outcome:** Metric **rejected**. Tell director:  
    > "The productivity index has no validated link to actual productivity and creates perverse incentives. It cannot govern decisions. We’ll sunset it and work with you to define goal-aligned metrics (e.g., flow efficiency + user feedback)."  

  ---

  ### What This Procedure Cannot Do  
  **Inapplicable Scenarios:**  
  - Systems too new for a validated envelope (Step 4 forces rejection).  
  - Goals with no unit (e.g., "improve morale" lacks a proxy starting point).  
  - Contested goals (e.g., "what is quality?" debated; procedure assumes goal clarity).  

  **Inherent Limitations (Even When Applied Honestly):**  
  - **Slow drift:** Metrics decaying below detection threshold until kill condition triggers.  
  - **Unbounded blindness:** Complex goals (e.g., "developer productivity") may have incomplete blindness profiles.  
  - **Value judgments masked as data:** E.g., Step 3’s "top gap" prioritization is subjective but presented as factual.  

  **Procedure Outputs:** A defendable Metric Charter, a documented rejection, or a human handoff with guardrails. Use it to shift conversations from "why is this metric broken?" to "what evidence supports this metric?"
