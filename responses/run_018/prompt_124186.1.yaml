  We are writing a research proposal for a six-month fellowship in political philosophy. The project aims to investigate whether Sen's liberal paradox can be avoided by modeling liberal rights as graded, dimensional authorities rather than binary vetoes over entire social states.

  The proposal should be four pages and structured as follows:

  1. **Introduction and Research Question**: State the problem from Sen's liberal paradox and the limitation of the standard binary model. Then, precisely state the research question: can we avoid the paradox by decomposing rights into independently controllable dimensions with thresholds? What would a formal model look like, and what are the conditions for success or failure?

  2. **Background and Gap**: Explain why the standard binary framing leaves the question open. Highlight that in standard social choice, rights are all-or-nothing vetoes over pairs of social states, but in reality, individuals might have control over specific dimensions (like privacy, speech, etc.) and only when a threshold is crossed.

  3. **Conceptual Framework**: Define the key concepts: dimensional versus holistic rights, threshold conditions versus absolute vetoes. Also, explain how we might model the scope conditions (when a right is activated) and the graded nature of control (e.g., a slider between 0 and 1 of control over a dimension).

  4. **Methodology and Formal Model**: Outline the formal model. We will:
     - Represent a social state as a vector of dimensions (each dimension being a real-valued or categorical attribute).
     - Each individual has a set of dimensions they control, but only when the proposed change in that dimension exceeds a threshold (which might be individual-specific or context-dependent).
     - The aggregation rule must respect both: (a) if a change in a dimension exceeds the threshold for an individual who controls that dimension, then the collective choice cannot change that dimension against their will; and (b) the collective choice must be Pareto efficient (or satisfy some other collective rationality condition).
     - We will then investigate whether there exists an aggregation rule that satisfies these properties and is consistent (i.e., avoids cycles or impossibility) for a broad class of preferences.

  5. **Research Plan (Month-by-Month)**:
     - Month 1: Literature review and formalization of the dimensional model of rights.
     - Month 2: Define the aggregation rule and the conditions (dimensional autonomy, Pareto efficiency, etc.) and prove initial results for simple cases (e.g., one dimension, two agents).
     - Month 3: Extend the model to multiple dimensions and agents, and investigate the possibility of consistency (existence of a non-empty choice set satisfying the conditions) under various preference domains.
     - Month 4: Explore the robustness: what happens when thresholds are endogenous? What if dimensions are interdependent? 
     - Month 5: Analyze the model under strategic behavior (do agents misreport thresholds or preferences?) and consider alternative collective choice rules (e.g., voting, bargaining).
     - Month 6: Write up the results and prepare a draft paper.

  6. **Success and Failure Criteria**:
     - Success: A consistency proof showing that under the dimensional model with thresholds, we can define an aggregation rule that respects dimensional autonomy and Pareto efficiency without leading to cycles or empty choice sets, for a general class of preferences and threshold structures. Alternatively, a demonstration that the model collapses to the standard one under certain conditions (and hence the paradox reappears) but that there are non-trivial conditions under which it works.
     - Failure: We might find that the dimensional decomposition does not avoid the paradox because conflicts reappear either between dimensions (if one agent controls dimension A and another dimension B, and they conflict) or because the thresholds themselves lead to new impossibilities. Also, failure might occur if we cannot define a coherent model that captures the intended graded autonomy without violating basic rationality.

  7. **Scope Assessment**:
     - In six months, we can: set up the formal model, prove results for the base cases (small numbers of dimensions and agents), and identify the key conditions for possibility or impossibility. We can also outline the structure of the general problem and the main obstacles.
     - Future work: Extending to more complex preference structures, empirical validation, applications to institutional design, and the study of dynamics (how thresholds evolve).

  We are not including a bibliography.

  Let's write the proposal accordingly.

  ---

  **Research Proposal: Dimensional Liberal Rights and the Possibility of Consistent Collective Choice**

  **1. Introduction and Research Question**

  Amartya Sen's liberal paradox demonstrates a fundamental tension in social choice: minimal individual rights (interpreted as the power to veto certain social states) are incompatible with Pareto efficiency when individuals have diverse preferences. This result assumes that liberal rights are binary and holistic — each right gives an individual absolute control over a pair of social states, typically defined by a personal feature (like the color of one's walls). However, real-world governance often involves more nuanced rights structures. For instance, serving on a university committee revealed that individuals may have graded authority over specific dimensions of a decision (e.g., the financial cost to them, the use of their personal data) only when a threshold of impact is crossed, rather than an absolute veto over entire policies.

  This project asks: *Can we resolve Sen's paradox by decomposing liberal rights into dimensional authorities with activation thresholds?* Specifically, we model each agent's liberal domain as a set of independently controllable dimensions (e.g., privacy, financial burden), each associated with a threshold beyond which the agent's authority is activated. The research question is formally stated as:

  *Does there exist a collective choice rule that, for any profile of individual preferences over multidimensional social states, satisfies:*
     - *(Dimensional Autonomy)*: *For any agent i and dimension d that i controls, if a proposed change in d exceeds i's activation threshold, then the collective choice cannot alter d against i's will;*
     - *(Pareto Efficiency)*: *The collective choice is Pareto efficient;*
     - *(Consistency)*: *The rule generates non-empty choice sets for every feasible agenda?*

  Success would constitute a proof that such a rule exists under general conditions (e.g., for any continuous preferences and threshold functions). Failure would be a demonstration that even in this graded model, the paradox reappears — either because dimensional autonomy and Pareto efficiency conflict, or because the thresholds themselves induce intransitivities.

  **2. Background and Gap in the Literature**

  Sen's theorem (1970) and the subsequent literature frame liberal rights as binary: an individual has the right to veto any social state that differs from another in a "personal" feature (e.g., reading Lady Chatterley or not). This leads to an impossibility: no social decision function can simultaneously satisfy unrestricted domain, Pareto optimality, minimal liberty (binary rights), and collective rationality (acyclicity). 

  The standard model leaves open two critical issues: 
  - **Holistic vs. Dimensional Rights**: Rights are defined over entire social states, but in practice, individuals care about specific dimensions (e.g., the amount of a tax, not the entire budget). 
  - **Absolute vs. Threshold-Triggered Vetoes**: Vetoes are unconditional, whereas in reality, rights are often activated only when a dimension crosses a threshold (e.g., a 10% cost increase). 

  By treating rights as dimensional and threshold-triggered, we reframe the problem in a way that may avoid the paradox. The gap in the literature is the absence of a formal model that integrates these features. 

  **3. Conceptual Framework**

  We define the following key concepts:

  - **Social State**: A vector \( x = (x_1, x_2, ..., x_m) \) where each \( x_d \) is a dimension (e.g., a real-valued policy variable, or a categorical attribute). 
  - **Dimensional Rights**: Each agent \( i \) controls a subset of dimensions \( D_i \). Control means that, under specified conditions, \( i \) can block changes in \( d \in D_i \).
  - **Activation Threshold**: For each agent \( i \) and dimension \( d \in D_i \), there is a threshold function \( \tau_{i,d} \) that determines when a proposed change in \( d \) is large enough to activate \( i \)'s veto. For example: \( \tau_{i,d}(x_d, y_d) = 1 \) if \( |x_d - y_d| > \delta_{i,d} \), else 0. The threshold could depend on the agent and context.
  - **Scope Conditions**: Thresholds may depend on the state of other dimensions (e.g., privacy rights activate only for personal data).
  - **Graded Autonomy**: Instead of a binary veto, we may allow agents to have graded control (e.g., a continuous veto power). However, for simplicity, we start with threshold-triggered binary vetoes per dimension.

  **4. Methodology and Formal Model**

  We construct a formal model as follows:

  - **Set Up**: 
    - Let \( N \) be the set of agents, \( D \) the set of dimensions. 
    - Each social state \( x \in X \subseteq \mathbb{R}^m \) (or categorical space). 
    - For each agent \( i \), a preference relation \( \succsim_i \) over \( X \).
    - For each \( i \) and \( d \in D_i \), a threshold function \( \tau_{i,d}: X \times X \to \{0,1\} \) (1 if the change activates the veto).

  - **Dimensional Autonomy Condition**: A social choice correspondence \( C \) satisfies dimensional autonomy if, for any agenda \( A \subseteq X \) and any \( x, y \in A \), if for some \( i \) and \( d \in D_i \), \( \tau_{i,d}(x,y) = 1 \) and \( x_d \neq y_d \), then \( y \) is not chosen over \( x \) if \( i \) prefers \( x_d \) to \( y_d \) (in the context of the other dimensions). 

    More formally: if \( x \) and \( y \) differ only in dimension \( d \), and \( \tau_{i,d}(x,y)=1 \), then if \( i \) prefers \( x \) to \( y \), then \( y \) is not in \( C(\{x,y\}) \). But if they differ in multiple dimensions, we need to aggregate vetoes. We might require that if a change in any dimension \( d \) controlled by \( i \) exceeds the threshold and \( i \) objects, then the social state cannot be changed in that dimension without \( i \)'s consent. This means that for the collective to move from \( x \) to \( y \), for every dimension \( d \) where \( y_d \neq x_d \) and \( \tau_{i,d}(x,y)=1 \) for the controlling agent \( i \), we must have that \( i \) does not prefer \( x_d \) to \( y_d \) (in the full context). 

  - **Pareto Efficiency**: If all agents prefer \( x \) to \( y \), then \( y \) is not chosen when \( x \) is available.

  - **Aggregation Rule**: We will explore rules that respect the above conditions. The challenge is to define a choice function that, given an agenda, selects the set of states that are not dominated (by the veto conditions and Pareto).

  We will then investigate the existence of a non-empty choice set for every finite agenda. The main technical work will involve proving possibility or impossibility theorems under various assumptions (e.g., continuous dimensions, single-peaked preferences, etc.).

  **5. Research Plan**

  - **Month 1**: Conduct a focused literature review (social choice, game theory with veto players, multidimensional voting). Formalize the model: define dimensions, thresholds, and the autonomy condition.
  - **Month 2**: Analyze the base case: two agents, one dimension each. Prove initial results: under what thresholds and preferences is consistency achievable? 
  - **Month 3**: Scale up: multiple agents and dimensions. Investigate the combinatorial structure of vetoes. Does the aggregation rule lead to cycles? Use graph theory (dominance relations) to study acyclicity.
  - **Month 4**: Relax assumptions: allow thresholds to depend on other dimensions (scope conditions) or to be continuous (graded control). Study the impact on possibility.
  - **Month 5**: Test robustness: strategic misreporting of thresholds or preferences. Compare with alternative aggregation rules (e.g., sequential voting with veto gates).
  - **Month 6**: Consolidate findings. Write a paper proving either a possibility theorem (with conditions) or an impossibility result. Draft the fellowship report.

  **6. Success and Failure Criteria**

  - **Success**: 
    - A possibility theorem: We identify conditions (e.g., thresholds are sufficiently high, preferences are separable, dimensions are independent) under which a consistent aggregation rule exists. 
    - A meaningful relaxation: We show that the dimensional model strictly enlarges the domain of possible rights structures that avoid the paradox, compared to the binary model.

  - **Failure**:
    - The paradox reappears: We prove that even with thresholds, dimensional autonomy and Pareto efficiency conflict under minimal conditions (e.g., when two agents control different dimensions and have conflicting preferences over a bundle of dimensions). 
    - Collapse to binary: We show that the threshold model reduces to the standard binary model (e.g., if thresholds are zero, we get the same impossibility).

  **7. Scope Assessment**

  In six months, we can:
  - Define the formal model and prove results for small-scale cases (2-3 agents, 2-3 dimensions).
  - Identify the critical parameters (threshold levels, preference restrictions) that determine possibility.
  - Provide a foundation for future work.

  Future work should:
  - Study richer preference domains (e.g., non-separable preferences).
  - Explore dynamic adjustments of thresholds.
  - Apply the model to real institutions (e.g., committee governance, data privacy regulations).

  This project reimagines liberal rights as multidimensional and threshold-triggered, offering a fresh lens on a classic paradox. Whether it resolves the tension or relocates it, the results will advance our understanding of the logical structure of rights in collective choice.

