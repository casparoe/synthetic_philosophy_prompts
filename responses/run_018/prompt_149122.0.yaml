answer: |-
  ## Decision Procedure for Evaluating Proposals with Effective Altruist (EA) Elements  
  *For Use by the Grants Panel, Charitable Foundation of the Midlands*  
  **Version 1.0** | **Time Allocation:** 90 Minutes Maximum  

  This procedure provides a structured framework for evaluating grant proposals employing EA reasoning, addressing three specific conceptual pressures: **Institutional Critique (IC)**, **Earning-to-Give Objection (ETG)**, and **Measurability Bias (MB)**. It is designed for panelists with legal/sector backgrounds, terminating in **Reject**, **Approve**, or **Flag for Values Disagreement**.  

  ---

  ### **Procedure Structure**  
  **Phase 1: Foundation Alignment Check** (15 mins)  
  *Question:* Does the proposal align with our charitable mission *as currently defined* in our governing documents?  
  - *Sufficient Answer:* Clear mapping of proposal activities to specific mission clauses.  
  - *Terminate:* **REJECT** if no alignment exists.  
  - *Hand-off:* Proceed if aligned; IC pressure still applies.  
  *Risk:* Overly narrow interpretation of mission may reject innovative work.  

  **Phase 2: Institutional Critique (IC) Assessment** (20 mins)  
  *Question:* Would accepting this proposal materially reshape our mission, create dependency on EA metrics, or enable capture by external agendas (e.g., branding demands, restricted future funding)?  
  - *Sufficient Answer:* Evidence that decision preserves foundation autonomy and does not set precedents undermining core values.  
  - *Terminate:* **REJECT** if risks mission distortion or capture.  
  - *Flag:** If risks exist but are deemed acceptable – this is a **VALUES JUDGEMENT** for the Board.  
  *Risk:* Overestimating "capture" may reject legitimate partnerships.  

  **Phase 3: Earning-to-Give (ETG) Evaluation** (15 mins)  
  *Question:* Does the proposal rely on deferred giving from future high earnings? If yes, is the pathway credible, and does it *supplement* (not replace) current moral obligation?  
  - *Sufficient Answer:* Track record of founders, binding commitment mechanisms, evidence that core activities *continue* during earning phase.  
  - *Terminate:* **REJECT** if funding is *solely* contingent on speculative future income without interim impact.  
  - *Flag:** If ETG is ancillary and credibility is contested – resolve via **FACTUAL DUE DILIGENCE** (e.g., CVs, employment contracts).  
  *Risk:* Underestimating attrition risk in ETG pathways; penalising genuine long-term strategy.  

  **Phase 4: Measurability Bias (MB) Interrogation** (25 mins)  
  *Question A:** Does the proposal claim superior impact solely through quantifiable metrics?  
  *Question B:** Are there material, legitimate goods within the proposal’s scope that inherently resist quantification (e.g., cultural enrichment, social cohesion, dignity)?  
  *Question C:** If B is 'yes', has the proponent acknowledged these and offered credible qualitative evaluation?  
  - *Sufficient Answer:* Recognition of non-quantifiable value; robust mixed-methods evaluation plan.  
  - *Terminate:* **REJECT** if quantifiable metrics are presented as the *exclusive* measure of value, thereby excluding core mission-aligned goods that lack metrics.  
  - *Flag:** If value exists but quantification is prioritised – this is a **VALUES JUDGEMENT** about the foundation’s stance on qualitative impact.  
  *Risk:* Equating "non-quantifiable" with "low value"; demanding impractical qualitative metrics.  

  **Phase 5: Synthesis & Decision** (15 mins)  
  *Question:* Having passed Phases 1-4 without rejection or unresolved factual disputes, does the proposal warrant funding based on *our foundation’s values and resources*?  
  - *Sufficient Answer:* Panel consensus that benefits outweigh risks/costs within our strategic priorities.  
  - *Terminate:* **APPROVE** (conditional on standard due diligence).  
  - *Terminate:* **REJECT** if resources are insufficient or strategic fit is poor.  
  - *Flag:** If disagreement persists solely on the *weight* given to quantitative vs. qualitative impact, or the *acceptability of risk* – this is **FOUNDATIONAL VALUES DISAGREEMENT** requiring Board guidance.  

  **What the Procedure Cannot Settle:**  
  1.  **Foundational Value Conflicts:** E.g., whether DALYs inherently outweigh unquantified social goods.  
  2.  **Predictive Certainty:** Absolute validation of long-term impact projections.  
  3.  **Moral Philosophy Debates:** Intrinsic merit of EA vs. other ethical frameworks.  

  ---

  ### **Application to Sample Proposals**  

  **Proposal 1: £200,000 for Mass Deworming (East Africa)**  
  - **Phase 1 (Alignment):** *Pass.* Health interventions align with foundation’s poverty alleviation mission.  
  - **Phase 2 (IC):** **FLAG FOR VALUES.** Branding condition risks mission capture (tying reputation to one metric) and sets precedent for restricted giving. Panel must decide if branding trade-off is acceptable.  
  - **Phase 3 (ETG):** *Not Applicable.* No ETG component.  
  - **Phase 4 (MB):** *Pass.* DALY metric is valid *for this specific health outcome*, and deworming's primary benefits *are* quantifiable. Non-quantifiable benefits (e.g., educational engagement) are secondary here.  
  - **Phase 5 (Synthesis):** **CONTINGENT ON PHASE 2 FLAG.** If branding is accepted, *approve* based on cost-effectiveness. If branding is rejected, *reject* unless condition is removed. *Likely Panel Pain Point:* Accepting branding feels transactional; rejecting loses a high-DALY project.  

  **Proposal 2: £50,000 Seed for Community Theatre Collective (Earn-to-Give)**  
  - **Phase 1 (Alignment):** *Pass.* Supports local arts/culture, aligns with community development mission.  
  - **Phase 2 (IC):** *Pass (Conditionally).* No direct capture risk, but reliance on ETG warrants scrutiny in Phase 3.  
  - **Phase 3 (ETG):** **REJECT.** Core ask (£50k seed) enables founders to *defer* theatre funding for 5+ years based on speculative future earnings. No binding mechanism ensures donations or continued artistic activity. Replaces immediate obligation with high-risk promise.  
  - **Phase 4 (MB):** **FLAG FOR VALUES (Pre-empted by Rejection).** Theatre’s value (social cohesion, wellbeing) is inherently non-quantifiable. Proposal correctly states no metric exists. Rejection in Phase 3 renders this moot, but highlights MB risk if panel *only* valued quantifiable outcomes.  
  - **Phase 5:** **REJECTED at Phase 3.**  
  *Likely Panel Pain Point:* Desire to support local arts conflicts with ETG model’s lack of accountability. Procedure forces rejection based on obligation deferral, not arts value.  

  ---

  **Chair’s Note:** This procedure ensures systematic scrutiny of EA pressures while centring our foundation's integrity and values. It explicitly surfaces where disagreements are philosophical (requiring Board guidance) versus operational (resolvable by panel). Regular review of outcomes where "Flag for Values" is triggered is recommended to ensure alignment with institutional ethos.  

  **Approved:** Grants Panel, Charitable Foundation of the Midlands  
  **Date:** [Date of Adoption]
