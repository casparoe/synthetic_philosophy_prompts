  - Principle Q might be interpreted as requiring the causal structure to be implemented in non-simulated hardware (i.e., not in software at all). So even if the computer is dedicated, if it's running software, it's still a simulation and hence not pain.

  But we can also consider:

  **Further Case:** A robot controlled by a special-purpose computer that is built out of silicon circuits, but this computer is programmable and runs the pain simulation as software. However, the computer is permanently dedicated to running only this one simulation (so it's not a general-purpose computer that can run arbitrary programs). The robot has sensors and motors appropriately connected.

  Now, what do the principles predict?

  - **Principle P:** The system has the causal structure (via simulation) and is embedded. So it should be in pain.
  - **Principle Q:** This system is implemented in software (even though on a dedicated computer) so it's still a simulation. Thus, not in pain.

  But note: the philosopher accepted case 3 (purpose-built silicon circuits) which is hardware. This new case is a computer that is built for the purpose of running the simulation, but the causal structure is implemented in software. So it's not the same as case 3.

  Alternatively, we can consider a case that is implemented in hardware but without the causal structure? But that would be like the lookup table and be rejected by both.

  Another idea: a system that has the causal structure and is embedded, but implemented in a biological substrate in a petri dish? But that might be too far.

  Alternatively, let's consider:

  **Further Case (Case 7):** A robot controlled by a field-programmable gate array (FPGA) that has been programmed to implement the exact causal network of the human pain system in hardware (i.e., the FPGA is configured to have the same circuit as the purpose-built silicon robot in case 3). The robot has sensors and motors appropriately connected.

  Now:

  - **Principle P:** It has the causal structure and is embedded -> pain.
