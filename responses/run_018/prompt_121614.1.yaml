     - **Yes** → **Leaf: Degree-Functionalist/Fuzzy-Logic Vagueness** (You see truth as a matter of degree; e.g., 0.7 "heapness").  
     - **No** → *Diagnostic note: Heap/Portrait suggest degrees, but Color rejects them. Overlap with Contextualism—proceed to Q6.*  

  10. **Heap Gaps?**  
      *In the grain series, are there numbers where it’s neither true nor false that it’s a heap?*  
      - **Yes** → **Leaf: Supervaluationism** (You believe words have multiple precise meanings; truth requires unanimity).  
