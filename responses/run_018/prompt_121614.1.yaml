  ### Decision Tree: Borderline - The Heap, the Portrait, and the Law  
  **Key for Users**:  
  - This tree helps you explore philosophical puzzles about boundaries (e.g., when does a heap stop being a heap?).  
  - Answer based on your intuition about the concrete cases—no prior philosophy knowledge needed.  
  - Questions are designed to be clear for thoughtful teenagers.  
  - **Important**: Your answers to specific cases (not abstract theories) determine your path.  

  ---

  #### The Decision Tree  
  **Starting Commitment**: You agree that the grain series (10,000 grains → 1 grain) has no obvious first non-heap, and you see this as a puzzle to solve.  

  1. **Heap Sharp Cutoff?**  
     *In the grain series, must there be an exact number N where N grains is a heap, but N-1 grains is not?*  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q4.  

  2. **Pixel Portrait Sharp Cutoff?**  
     *In the Receding Pixel Friend series, must there be an exact minute when the image stops being a portrait of the person?*  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q4.  

  3. **Color Sharp Cutoff?**  
     *In the red-to-orange spectrum, must there be an exact point where the color stops being red?*  
     - **Yes** → **Leaf: Epistemicism** (You believe sharp cutoffs exist but are unknowable; vagueness is due to ignorance).  
     - **No** → *Diagnostic note: Pixel/Heap pull you toward sharp cutoffs, but Color pulls away. Overlap with Contextualism or Degree-Functionalism—proceed to Q6.*  

  4. **Heap Degrees?**  
     *Can a collection of grains be "kind of" or "partially" a heap (not just "yes heap" or "no heap")?*  
     - **Yes** → Go to Q5.  
     - **No** → Go to Q6.  

  5. **Portrait Degrees?**  
     *Can the Receding Pixel Friend image be "partially a portrait" or "gradually less of a portrait" of the person?*  
     - **Yes** → Go to Q9.  
     - **No** → *Diagnostic note: Heap suggests degrees, but Portrait rejects them. Overlap with Supervaluationism—proceed to Q7.*  

  6. **Color Context?**  
