  ---

  ### Leaves (Final Positions)  
  1. **Epistemicism**: Sharp cutoffs exist but are unknowable.  
  2. **Degree-Functionalist/Fuzzy-Logic Vagueness**: Truth comes in degrees (e.g., 30% heap).  
  3. **Supervaluationism**: Words have multiple precisifications; truth requires unanimity across them.  
  4. **Contextualism**: Meaning depends on situational factors (e.g., conversational context).  
  5. **Graduated Legal Fictionalism**: Law should enforce sharp cutoffs as useful fictions.  
  6. **Semantic Nihilism**: Vague language is meaningless or incoherent.  
  7. **Uncharted Anchoring** (placeholder): Stable meanings exist without cutoffs, degrees, or gaps.  

