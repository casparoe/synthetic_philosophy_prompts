prompt: |-
  hey im a software engineer with zero philosphy training trying to figure out what a decent theory of work and leisure rights actually needs to cover. I keep seeing three things that feel like they should constrain any answer: the Protestant work ethic treating labor as virtuous, France's 35-hour week capping it by law, and karoshi in Japan where people literally work themselves to death. but I also want it to handle this weird case I'm stuck on—imagine AI automates all productive labor, so the only "work" left is voluntary creative projects people do for fun, yet society still shames or penalizes anyone who opts out completely.

  what would the full list of desiderata be? I want the spec: the phenomona and edge cases it must explain (the ethic, the legal cap, death-by-overwork, and my AI leisure-punishment scenario), the distinctions it can't collapse (like a right to leisure vs being forced into it, or earned rest vs state-mandated idleness), any medical or economic results it can't flat-out contradict, and for each why it's a real requirement not just one camp's prejudice. also tell me which requirements are genuinely non-negotiable vs just preferences, and point out the single one that does the most damage to popular theories. table is fine—just keep it conceptual, no need to name-drop obscure authors.
reasoning: |-
  Okay, the user is a software engineer with no philosophy background trying to build a robust theory of work and leisure rights. They've identified three key constraints: Protestant work ethic (labor as virtue), France's 35-hour week (legal cap), and Japanese karoshi (death by overwork). Plus they're stuck on an AI automation edge case where society shames non-workers even when all labor is optional. 

  Hmm, their framing is very engineer-like—treating this as a "spec" with "desiderata" and "edge cases." That's useful because it suggests they want structural clarity over poetic abstraction. The AI scenario is particularly clever; it exposes how moral judgments about work might persist beyond economic necessity. 

  *scribbles mental notes* The core tension seems to be between intrinsic/extrinsic motivations and social coercion. Also need to flag that medical realities (e.g., overwork mortality) are hard constraints, while cultural norms like the Protestant ethic are malleable inputs. The karoshi example is brutal but perfect—it proves "work as virtue" becomes toxic without counterbalances. 

  *testing boundaries* Would they accept "leisure" including caregiving or community work? Probably, since their AI scenario specifies "voluntary creative projects." But must emphasize that unpaid labor often gets invisibilized in these debates. The France/Japan contrast is gold—same species, opposite pathologies. 

  *biggest pitfall* Most theories fail the AI test because they root work obligations in economic need. Once that vanishes, their moralizing collapses into pure bias. Gotta highlight that. Also should stress that "earned rest" vs "forced idleness" isn't just semantics—it's about agency versus structural abandonment. 

  *structuring the response* A table might actually help this user, but only if accompanied by plain-English explanations. No jargon. Column for "why non-negotiable" is crucial because they explicitly asked to filter out "camp prejudices." The medical/economic rows must cite concrete evidence (WHO stats, labor econ studies) not just philosophy. 

  *lightbulb* The Protestant ethic requirement is the trickiest—it's culturally specific but globally influential. Solution: frame it as "must explain why societies glorify work" without endorsing it. Like debugging legacy code you inherited. 

  Final check: Are they secretly anxious about their own workaholism? Maybe, but the query feels genuinely theoretical. Best stick to rigorous neutrality while subtly validating their observation that leisure-shaming is weirdly persistent.
answer: |-
  Here's a conceptual "spec" for a robust theory of work and leisure rights, designed to handle your constraints and edge cases. Non-negotiables are rooted in fundamental human needs or empirical realities, while preferences reflect cultural/political variability.

  ### Desiderata for a Theory of Work/Leisure Rights
  | **Requirement**                     | **Must Explain/Handle**                                   | **Critical Distinctions to Preserve**                          | **Why Non-Negotiable?**                                                                 | **Negotiable?**       |
  |-------------------------------------|----------------------------------------------------------|---------------------------------------------------------------|-----------------------------------------------------------------------------------------|------------------------|
  | **1. Prevention of Bodily Harm**    | Karoshi (death by overwork)                              | Work vs. self-destruction; autonomy vs. coercion              | Medical reality: Chronic stress/exhaustion causes measurable physical/mental breakdown. | **NO** (empirical)    |
  | **2. Agency & Consent**             | Protestant work ethic’s moral coercion; AI leisure-shaming | Voluntary labor vs. socially forced labor; earned rest vs. idleness | Foundational to human dignity. Without consent, "virtue" becomes tyranny.               | **NO** (ethical core) |
  | **3. Economic Necessity & Fairness**| France’s 35-hr week (balancing productivity/well-being) | Work as survival necessity vs. work as surplus extraction    | Basic economics: Humans require resources to live. Uncompensated labor is exploitative. | **NO** (material reality) |
  | **4. Cultural Value Pluralism**     | Protestant work ethic’s virtue signaling                 | Labor as intrinsic good vs. instrumental good                | Societies vary in valuing work/leisure. Theory can’t impose one culture’s values globally. | Partly (values vary, but harm limits apply) |
  | **5. Post-Scarcity Ethics**         | AI automation scenario (shaming non-workers)             | Meaningful activity vs. "productive" labor; leisure as right vs. deviance | Tests if work-obligation is inherent or contingent. Exposes hidden moral biases.       | **NO** (critical edge case) |
  | **6. Temporal Sovereignty**         | Karoshi (no time to recover); 35-hr week (enforced rest) | Rest as recovery vs. rest as punishment; controllable time vs. empty time | Biological/psychological need: Humans require autonomy over life rhythms to thrive.     | **NO** (health/agency) |
  | **7. Structural Accessibility**     | France’s law (access to leisure); karoshi (no escape)    | Leisure as universal right vs. privilege for the wealthy     | Justice: Rights are meaningless without material means to exercise them.                | **NO** (fairness)     |

  ---

  ### Key Insights & Damage Assessment
  - **Most Damaging Requirement for Popular Theories**: **#5 (Post-Scarcity Ethics)**.  
    Most theories (e.g., those rooted in Calvinism, Marxism, or capitalism) tie work obligations to **economic necessity or divine duty**. Your AI scenario vaporizes this foundation, exposing unresolved cultural baggage. If society shames "non-workers" *even when work is optional*, it reveals:  
    → Work is socially enforced **performance of conformity**, not just productivity.  
    → Leisure is stigmatized as **moral deviance** without logical basis.  
    *Theories failing this test are likely rationalizing prejudice, not defending principle.*

  - **Non-Negotiables Explained**:  
    - **Bodily Harm (#1)** & **Temporal Sovereignty (#6)**: Rooted in neuroscience (chronic stress damages brains/bodies) and psychology (autonomy is a core well-being pillar).  
    - **Agency (#2)** & **Accessibility (#7)**: Without these, "rights" become theoretical—e.g., a starving person has no *meaningful* right to leisure.  
    - **Post-Scarcity (#5)**: If a theory only works under scarcity, it’s an economic patch, not an ethical framework.

  - **Negotiables/Preferences**:  
    - *How* leisure/work is valued (#4) → Societies may prioritize community art (France) or individual hustle (USA), provided harm limits are respected.  
    - *Mechanisms* for ensuring rights → State mandates (France) vs. collective bargaining vs. cultural norms, as long as outcomes meet core requirements.

  ---

  ### Why Your Cases Are Core Tests
  - **Protestant Work Ethic**: Tests if theory can **separate cultural values from universal rights** (Requirement #4).  
  - **35-Hour Week**: Tests **structural fairness** (#7) and **temporal sovereignty** (#6).  
  - **Karoshi**: Tests **bodily harm prevention** (#1) and **coercion** (#2).  
  - **AI Scenario**: Ultimate stress-test for **agency** (#2) and **post-scarcity ethics** (#5). If your theory can’t explain why someone painting murals for fun is "virtuous" while someone napping is "lazy" in a post-work world, it’s biased.

  A robust theory must frame **work/leisure as fluid, context-dependent expressions of human agency**—not fixed moral categories. The second we lose the distinction between *chosen* effort and *coerced* labor, or between *restorative* leisure and *enforced* idleness, we enable karoshi or dystopian leisure-shaming. Your AI edge case isn’t weird; it’s the canary in the coal mine for unexamined dogma.
