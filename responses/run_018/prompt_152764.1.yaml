  For the carrying example... *pauses to mentally simulate both scenarios* The embryo split case wins: it isolates gamete origins from genetics/environment by having identical DNA twins with different origins. Must emphasize the temporal discontinuity (years later implantation) to block "same causal pathway" objections. The sibling case introduces irrelevant genetic variation.

  Ah, their niche distinction about gametes vs. causal pathways is sharp. That should surface AFTER establishing core essentialism as a possible refinement. Introducing it earlier would muddy the waters, but post-fundamentals it could deepen understanding for advanced participants.

