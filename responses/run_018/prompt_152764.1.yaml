answer: |-
  Here's a structured 90-minute teaching plan focused on conceptual clarity and avoiding common pitfalls:

  **1. Dependency Order & Core Distinction (20 mins)**
  *   **Foundation (12 mins):** Start by securing the **Numerical Identity vs. Qualitative Similarity** distinction. Use a simple non-biological example: "Is *this specific* dollar bill (hold one up) necessarily the one in your wallet right now? Could a *different* but otherwise identical dollar bill be *this very one*? Why/why not?" Contrast "this very zygote" (numerical identity) with "a zygote with an identical genome" (qualitative similarity). Emphasize: Origin essentialism concerns *which specific thing* you are, not *what properties* you have.
  *   **Formulating the Thesis (5 mins):** State origin essentialism clearly: "The claim is that a particular person (e.g., Alice) *necessarily* originates from the specific sperm cell (S1) and egg cell (E1) that actually fused to form her zygote. Alice could not have existed if a different sperm (S2) or different egg (E2) had been involved, even if S2/E2 were genetically identical to S1/E1."
  *   **Initial Defensive Step (3 mins):** Immediately follow with the core intuition pump: "What makes Alice *Alice* rather than her sibling? If Alice came from S1+E1, and her brother came from S2+E1, why *isn't* Alice her brother? The essentialist argues it's the *specific origins* that fix her identity from the very beginning."

  **2. The Carrying Example (15 mins)**
  *   **Use the Embryo Split Scenario:** "A single zygote (Z1), created from sperm S1 and egg E1, is split in vitro shortly after fertilization, creating identical twins (Twin A and Twin B). Twin A is implanted immediately and born 9 months later. Twin B is cryopreserved. Years later, Twin B is thawed and implanted in a different country, in a different woman, and born."
  *   **Why This Works & Required Features:**
      *   **Carries the Intuition:** Twin A and Twin B are genetically identical, yet clearly distinct individuals existing at different times/places. Essentialism says Twin B *necessarily* originates from S1 and E1 (via Z1), just as Twin A does. Twin B couldn't have originated from *different* gametes.
      *   **Avoids Confusions:**
          *   *Genetics:* Genetically identical twins force focus away from genetic makeup to origin.
          *   *Environment:* Different countries/mothers/wombs/times rule out environment as the identity-grounder.
          *   *Personal Identity (Psychological):* No developed psychology exists at zygote stage; focuses purely on origin.
      *   **Must Lack:** Any suggestion that genetics is the key factor. Any implication that temporal/environmental differences *alone* could constitute a different origin for Twin B (the origin is the same gametes and zygote).

  **3. Gamete vs. Causal Pathway Essentialism (10 mins)**
  *   **Placement:** **After** the core thesis and initial defense (incl. embryo split example), but **before** deep diving into objections/misconceptions.
  *   **Introduce the Distinction:** "A crucial refinement: Origin essentialism typically focuses on the *specific gametes* (S1 & E1). But could it instead be about the *specific causal pathway*? For example, does Alice *necessarily* require not just S1 & E1, but also the exact petri dish, the specific technician, the precise moment of conception, the exact uterine environment? Or is it *only* the gametes?"
  *   **Purpose:** Briefly highlight this as a *potential refinement or debate within origin essentialism*. Ask: "Does the embryo split case feel different if we imagine the split happening in a different lab years later?" Conclude that the *core, minimal claim* essential to personal identity is usually argued to be the specific gametes, while the wider causal pathway might be contingent. **Flag it as a deeper question** but state you'll focus on the gamete-centric version for clarity today.

  **4. Mapping & Mitigating Misconceptions (25 mins)**
  *   **Genetic Determinism (Surfaces during zygote/genome distinction or thesis statement):**
      *   **Intervention:** Explicitly state *immediately* after mentioning gametes/genome: "Crucially, origin essentialism is **NOT** the claim that your genes determine your personality, abilities, or fate. It is *only* about the metaphysical question: *Which specific entity are you?* It says nothing about what properties you develop." Reiterate this when using the twin example.
  *   **Psychological-Continuity Accounts (Surfaces during defense/objections, especially if discussing "what makes me *me*?"):**
      *   **Intervention:** Redirect firmly: "That's an important theory of *persistence* (how you remain the same person *over time*). Our question today is more fundamental: *Could you have come into existence differently at the very beginning?* Origin essentialism is about your *coming-into-being*, not about memories or personality linking you to a future self." Use the zygote stage: "No psychology exists then, yet origin essentialism applies."
  *   **Essentialism about Parents/Siblings (Surfaces when discussing origins or family scenarios):**
      *   **Intervention:** Clarify scope: "Origin essentialism is specifically about *your own* originating gametes. It does **not** claim that *your parents* are essential to you in the same way. The claim is that *you* necessarily come from *those specific gametes* (S1 & E1). Whether those gametes necessarily had to come from your specific parents is a *different* question about biological origins or the essentiality of gamete sources, which we are *not* addressing today." Contrast with the sibling example: "You and your sibling share parents, but have different originating gametes."

  **5. Check Question (5 mins)**
  *   **Question:** "Imagine scientists create a perfect, genetically identical clone of you using a cell from your body (not a gamete). This clone has your memories, personality, and body. According to origin essentialism, is this clone *you*? Why or why not?"
  *   **Reveals Grasp:** A correct understanding recognizes:
      *   The clone is genetically identical = *Qualitatively similar*.
      *   But it did *not* originate from the specific sperm and egg *you* originated from.
      *   Therefore, according to origin essentialism, it is *not* you; it is a distinct individual who merely resembles you. It demonstrates the distinction between qualitative similarity and numerical identity tied to origin.

  **6. Explicit Omissions (State at Start & Briefly Reiterate)**
  *   **Leave Out:**
      *   **Formal Modal Logic:** No symbols (□, ◊), no possible worlds semantics. Use accessible language ("necessarily," "could have," "must").
      *   **Artifact Essentialism:** Avoid comparisons to ships (Ship of Theseus), statues, or other artifacts. Focus solely on biological persons/zygotes.
      *   **Essentialism of Biological Kinds:** Do not delve into whether "human" or "tiger" is an essential kind. Focus is on individual identity, not kind membership.
      *   **Deep Metaphysics of Modality:** Avoid justifying the nature of necessity/possibility itself.
      *   **Full Debates on Personal Identity Over Time:** Briefly acknowledge other theories (psychological, bodily) only to contrast scope, don't debate them.
  *   **State Openly:** Begin the session by saying: "To focus our 90 minutes effectively, we will *not* be covering formal logic, debates about artifacts like ships or statues, theories about what makes a human *a human* (biological kinds), or detailed comparisons to other theories of personal identity over time (like psychological continuity). We are laser-focused on the claim about the necessity of your specific gametic origins for *your individual existence*."

  **Session Flow Summary:**
  1.  (5 mins) Intro & Explicit Omissions
  2.  (20 mins) Dependency Order (Identity/Similarity Distinction -> Thesis -> Defense)
  3.  (15 mins) Embryo Split Example + Discussion
  4.  (10 mins) Gamete vs. Causal Pathway Distinction
  5.  (25 mins) Defense Deep Dive + Proactively Addressing Misconceptions (Weave interventions in as concepts arise)
  6.  (10 mins) Group Discussion / Key Objections
  7.  (5 mins) Check Question & Wrap-up

  This plan prioritizes conceptual foundations, isolates the target intuition, strategically addresses likely confusions without derailment, and includes a clear diagnostic check, while rigorously excluding tangential complexities. Good luck!
