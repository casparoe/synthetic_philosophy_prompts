  Your **gut estimate (0.6)** was remarkably sharp. I’d significantly shift (Δ > ±0.25) given:
  1. **Proof that all proper scoring rules implicitly encode non-cognitive affect** (e.g., topological equivalence between valence circuits and scoring functions).  
