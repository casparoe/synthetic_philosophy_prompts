  3. **Empirical falsification**: An AI system that objectively *outperforms* EUT-calibrated models on forecasting tasks by using "non-utilitarian accuracy" (suggesting a real distinction).

  ---

  ### Why This Matters for Your Calibration Layer
  - **Implementation**: For non-sentient systems, **accuracy-first is EUT with uniform weights**. Use proper scoring rules (e.g., log loss) and forget philosophy.  
  - **Edge Case**: If your system interacts with human moral reasoning (e.g., ethical AI), the "social" component (S) may force non-flat weights *externally*.  
  - **Rabbit Hole Escape**: Your intuition aligns with Leitgeb & Pettigrew (2010): *"Epistemic rationality is just decision theory minus practical consequences."*

