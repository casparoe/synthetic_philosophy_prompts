answer: |-
  **INTERNAL MEMORANDUM**  
  **Bureau of Participant Stance Compliance (BPSC)**  
  **Division of Interpersonal Involvement Integrity**  
  **Ref: BPSC/23/RA-9**  

  **TO:** All Licensed Interpersonal Mediators, Couples-Therapists, and Affiliated Moral Operators  
  **FROM:** Helena Voss, Deputy Director, Stance Compliance Enforcement  
  **DATE:** October 27, 2023  
  **SUBJECT:** Mandatory Reactive Attitude Disclosure Protocol & Tiered Licensing Requirements  

  Effective immediately, all client expressions of resentment, gratitude, forgiveness, or analogous moral-reactive outputs within mediated interpersonal exchanges must be preceded by the filing of **Form BPSC-114 ("Reactive Attitude Disclosure")**. This protocol enforces Strawson’s conceptual distinction between the *participant stance* (reactive attitudes) and the *objective attitude* (causal management) to prevent stance drift and maintain regulatory purity in dyadic moral ecosystems.  

  ### I. DISCLOSURE REQUIREMENTS  
  Clients must declare, prior to utterance:  
  **(A)** Whether the expressed attitude (e.g., resentment) operates under the **participant stance** (i.e., treating the other as a morally responsible agent within a framework of interpersonal involvement).  
  **(B)** Or whether it originates from the **objective attitude** (i.e., treating the other as a causal system requiring technical management, repair, or behavioral conditioning).  

  *Example:* A client stating, "I resent my partner for neglecting household duties," must file BPSC-114 specifying either:  
  > **Box P-3:** *Participant Stance Resentment* (involves holding partner accountable as a moral agent).  
  > **OR**  
  > **Box O-7:** *Objective Stance Resentment* (views neglect as a malfunction to be remediated via behavioral recalibration).  

  **PENALTY:** Stance contamination (e.g., expressing participant-based resentment while checked O-7) constitutes a Tier 2 violation. First offense: mandatory recalibration seminar ("Participant/Object Boundaries: A Flowchart Approach"). Repeat offenses trigger decertification.  

  ### II. THREE-TIER RESENTMENT LICENSING SYSTEM  
  As reactive outputs vary in complexity, mediators must hold appropriate credentials:  
  - **BASIC RESENTMENT LICENSE (BRL):** Covers routine grievances (e.g., unmet promises). Renewal: biennial.  
  - **CERTIFIED RESENTMENT ANALYST (CRA):** Required for chronic resentment or multi-party blame networks. Requires 10 Continuing Education Credits (CECs) annually in *Interpersonal Involvement Maintenance*.  
  - **FORENSIC RESENTMENT ANALYST (FRA):** For resentment involving historical trauma or systemic moral injury. Requires 20 CECs, including 5 in *Temporal Blame-Horizon Assessment*.  

  > **NOTE:** Gratitude/forgiveness licenses remain unified (Levels 1-3), pending 2024 regulatory review.  

  ### III. THEORETICAL EXEMPTION REQUESTS DENIED  
  Following Petition #4472 (submitted by Senior Mediator Dr. Roland Finch, Ph.D.), requesting exemption from licensing fees due to the "causal determination of all resentment" under universal determinism:  

  **BPSC RULING:** While Dr. Finch correctly notes that reactive attitudes operate independently of theoretical debates about determinism (per Strawson’s framework), this does not constitute grounds for fee waivers. The Bureau acknowledges that resentment arises *despite* determinism, but its *administration* remains subject to operational oversight. Licensed resentment is a *procedural output*, not a metaphysical condition. Fee structure remains intact.  

  ### IV. OBJECTIVE ATTITUDE RESTRICTIONS  
  Deploying the objective attitude during marital or partnership counseling is strictly prohibited unless:  
  (a) A BPSC Objective-Attitude Waiver (Form BPSC-205) is secured *prior* to session, AND  
  (b) Both clients are notified using BPSC-approved language: "Your partner will now be discussed as a psychologically complex object within a causal matrix. Moral engagement is suspended."  

  **VIOLATION:** Unauthorized deployment results in immediate decertification and placement in the **Objective-Attitude Operator Registry (OAOR)**, which may preclude future participant-stance licensure.  

  ### V. COMPLIANCE AUDITS  
  Participation audits commence Q1 2024. Ensure all BPSC-114 forms are filed electronically via the **Attitude Tracking and Logging Interface System (ATLIS)**, with cryptographically sealed timestamps verifying pre-expression submission.  

  Maintaining the participant/objective distinction is not optional—it is the bedrock of moral community functionality. Report stance deviations to the BPSC tip-line (1-888-NOT-OBJECT).  

  **\*\* NON-COMPLIANCE IS PARTICIPATION STANCE SABOTAGE \*\***  

  ---  
  *This memo complies with BPSC Directive 0.1: "No Unlicensed Moral Outputs in Controlled Dyads."*  
  *BPSC: Keeping Interaction Human Since 2021.*
