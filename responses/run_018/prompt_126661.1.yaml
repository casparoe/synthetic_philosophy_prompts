  *Why this works*: 
  - The "nesting" is visible: Worker 2's inability to take the risky option was itself due to prior brute luck (no inheritance). 
  - LE would deny Worker 2 compensation because they "chose" not to have insurance, ignoring the constrained choice set. 
  - Prioritarianism sees the deeper disadvantage. 

  *Key structural feature*: The option luck (gambling on insurance) is only equally accessible in theory - brute luck made it substantively unequal. Strip away the inheritance difference, and both theories might agree the uninsured worker deserves less help. 

  *Anticipating pushback*: A prioritarian might argue LE's distinction is fundamentally flawed here - if brute luck creates the conditions for "bad" option luck, it's all disadvantage. But that's exactly the point of divergence. 

  Better avoid jargon overload in the walkthrough. Emphasize that LE stops at "you chose," while prioritarianism asks "but could you really choose otherwise given your starting point?" The nesting collapses the option/brute luck distinction for prioritarians but not for LE. 

