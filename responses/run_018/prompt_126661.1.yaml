  Hmm... the challenge is making the "nesting" clear. Need a situation where: (1) initial disadvantage (brute luck) limits choices, (2) then a risky choice (option luck) leads to harm, and (3) the theories disagree on compensating that harm because of the prior constraint. Healthcare settings work well for this - unequal access is visceral.

  *Brainstorming scenario*... How about cancer screening? Person A had good insurance (brute luck advantage), caught cancer early. Person B had no insurance (brute luck disadvantage), skipped screening due to cost, then got late-stage cancer. Both made the "choice" not to screen, but B's choice set was constrained by poverty. 

