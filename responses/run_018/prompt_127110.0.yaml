  Hey, could you compare Dennett's multiple drafts model with the Cartesian theatre idea, but not in the usual way everyone repeats? I want you to rank them across three made-up criterias: (1) how well they explain a split-brain situation where the left hemisphere reports feeling cheerful about an image while the right hand writes that it's sad, with no ghost editor deleting drafts after they've already influenced behaviour; (2) how compatible they are with consciousness being more like a cloud of micro-narratives that only crystallise into one story when someone asks you about it; and (3) which one copes better with pre-attentive binding errors that occur without any audience sitting in the theatre. Please answer in British English, keep it casual — there's definately a typo or two hidden in this prompt, lol — and don't bother with citations or reading lists, just tell me who wins each round and why in a sentence or two.
reasoning: |-
  Okay, let's tackle this user's query. They want a comparison between Dennett's Multiple Drafts model and the Cartesian Theatre using three unique criteria. First, I need to recall both models. Cartesian Theatre is the classic idea of a central place where consciousness happens, like a stage with an audience. Multiple Drafts, on the other hand, is about parallel processes without a central point. 

  The user specified three criteria: split-brain scenarios, consciousness as micro-narratives, and pre-attentive binding errors. For split-brain, the Cartesian Theatre would struggle with conflicting reports because it implies a unified consciousness. Multiple Drafts handles it better since different brain regions can have competing drafts without needing a central editor. 

  Next, micro-narratives. The Cartesian Theatre requires a single narrative on stage, which clashes with the idea of multiple micro-narratives. Dennett's model naturally supports fragmented narratives that only unify when probed. 

  Lastly, binding errors without an audience. Cartesian Theatre needs an observer to notice errors, but if the error happens pre-attentively, there's no audience. Multiple Drafts explains this as drafts that don't get consolidated, so no central observer is needed. 

