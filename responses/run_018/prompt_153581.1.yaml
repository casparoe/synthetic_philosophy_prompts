  The scenario needs two evidentiary streams: an elaborate literary source and ambiguous material traces. Plus, there's this "intercalated witness" element that's unique - something like a fragmentary administrative record that conflicts with the narrative. The key is to engineer it so Minimalist and Coherentist historians reach opposite conclusions based on how they weigh this conflicting evidence.

