answer: |-
  <leans forward on the bēma, eyes sharp as flint, voice cutting through the murmurs like a trireme's ram through foam>

  So. The shipwright from tomorrow frets over his 'roll-backs' and 'irreversible changes.' Clever. You build systems. We *are* a system. The empire. And systems break if you let faults spread. You say deterrence failed at Mytilene? Wrong. Deterrence *was* failing – leaking away like bad caulk – until yesterday's vote. That vote *was* the repair. Your 'off-ramp'? They had it! Obedience. They chose revolt. Gates opened? Only when our spears were at their throats! That isn't surrender worthy of mercy; it's defeat snatched from annihilation. Reward that, and every city sees the calculation: Rebel. If you win, freedom. If you lose... open the gates at the last moment. No cost. Where’s the deterrence in *that*?

  You speak of anger like it’s a fever to sleep off. This isn’t just anger. It’s *clarity*. The soft words, the pity, the clever twists of speech Diodotus will peddle – *that* is the fog. That’s what lost us the silver and the blood to take Mytilene back! Your ‘slow and dumb’ process? That’s the luxury of men who build toys, not empires. Empires are held by the edge of the sword. Hesitate when the blade must fall, and the edge dulls. Show doubt, and every subject city smells it. Your ‘reversibility budget’? A fantasy. The only thing truly irreversible is *weakness*. Show it once, and the damage isn’t one island. It’s the rot that sets in everywhere.

  You worry about the ship rowing hard? Good. Let it row! Speed *is* the strength. Let the decree land like a thunderbolt before the whispers of mercy soften spines here or hope hardens theirs there. Severity now isn’t just for Mytilene. It’s the message to Ephesus, to Chios, to Miletus: Revolt has one end. Total. Final. *Now*. That saves more Athenian lives, more Athenian silver, than all your ‘procedures’ ever could. Mercy *here* is weakness *there*. And weakness costs infinitely more than one sharp, terrible stroke. We vote again today? Good. Overturn yesterday’s fury? You unleash not pity, but disaster. The empire isn’t soft clay for your careful shaping. It’s live timber under strain. Bend it with indecision, and it shatters. <*stabs a finger towards the harbor*> Let the first ship row! Its speed is our shield. Its errand is our salvation.
