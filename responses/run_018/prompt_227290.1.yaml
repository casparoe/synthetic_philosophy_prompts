  Also, the user asks about boundary cases. For instance, does the label have to come from the immediate successor period? What about terms like "Late Antiquity" coined to escape previous labels? They need a clear demarcation between this phenomenon and neutral periodization.

  The persistence of the label after rejection is crucial. Medievalists reject "Dark Ages" but still use it, framing research around disproving it. That's the core issue—how the label dictates questions even when its premise is rejected. 

  I should explain why existing terms don't fit. Whig history is broader, presentism is different. Invented tradition is about practices, not periods. So "tendentious periodization" might be the closest, even if it's not a household term. The analysis should define its components: polemical origin, persistence, constraining effect. 

  Boundary cases: Labels imposed later (like "Scientific Revolution") still count if they're polemical. But "Late Antiquity" is a corrective, so it's different. The key is whether the label was originally a foil. 

  The user's deeper need is to understand how to navigate these constraints in their research. They want conceptual tools to critically engage with periodization, not just a term. So emphasizing the analytical framework is crucial. They might also benefit from strategies to counteract the constraining effects, like sub-periodization or emphasizing continuity.
answer: |-
  Based on your precise description and the need for conceptual clarity, here's the breakdown:

  1.  **The Established Term:** The phenomenon you describe **lacks a single, universally established, widely recognized term** in historiography that captures *all* its facets simultaneously. While historians constantly grapple with the issues you raise, the *specific combination* of successor-period polemic, label persistence, and constraint on questioning hasn't crystallized under one dominant label.

  2.  **Proposed Term & Precise Definition:** The most accurate and analytically useful term is **Tendentious Periodization**.

      *   **Definition:** Tendentious Periodization describes the historiographical phenomenon where:
          *   A historical period ("Period B") defines its identity and significance *in opposition* to an immediately preceding era ("Period A").
          *   Period B coins a label for Period A that is inherently polemical, evaluative, and serves as a negative foil (e.g., "Dark Ages," "Middle Ages," "Gothic").
          *   This label, embedded with Period B's value judgment, becomes the dominant identifier for Period A.
          *   Subsequent historians, even while explicitly rejecting Period B's negative evaluation of Period A, retain the polemically-derived label.
          *   The persistence of this label subtly constrains the questions asked about Period A, often framing research as a reaction to or rehabilitation against the original polemic embedded in the name, rather than generating questions from the internal dynamics and diverse evidence of Period A itself.

  3.  **Boundary Cases & Distinctions:**

      *   **vs. Whig History:** Whig history is a broader interpretive *framework* emphasizing progress towards the present, often using tendentious periodization *as a tool*. Tendentious periodization *is* the specific *act* and *consequence* of naming the preceding era polemically.
      *   **vs. Presentism:** Presentism involves imposing *current* values/norms onto the past. Tendentious periodization involves imposing the *values/norms of the immediate successor period* onto its predecessor. The source of the judgment (immediate successor vs. distant present) is key.
      *   **vs. Invented Tradition:** This focuses on specific practices or symbols retrojected into the past for contemporary legitimacy. Tendentious periodization focuses on the *demarcation and naming of entire temporal blocks* for purposes of self-definition.
      *   **vs. Ordinary Periodization:** Ordinary periodization aims for descriptive or analytical convenience (e.g., "Reign of X," "The Long 18th Century," "Post-Classical Era"). Tendentious periodization is defined by its *origins in polemic* and its *persistent constraining effect*, even after the polemic is rejected. The *intent* and *enduring consequence* are distinguishing factors.
      *   **Origin of the Label:**
          *   **Core Phenomenon:** Requires the label to originate *within the successor period itself* (Period B naming Period A). This is essential for the dynamic of self-definition through negation (e.g., Humanists naming the "Dark Ages/Middle Ages").
          *   **Edge Case 1 - Later Scholarship:** Labels imposed by much *later* scholarship (e.g., "Scientific Revolution" coined in the 20th century for the 16th-17th) *can* exhibit the *constraining effect* (debating if it *was* a revolution). However, they lack the core element of Period B *actively using the label to define itself against Period A*. The polemical intent is retrospective projection by later scholars, not contemporary self-definition. This is a related but distinct phenomenon – perhaps "Retrospective Polemical Framing."
      *   **Corrective Labels (e.g., "Late Antiquity"):** These are designed *specifically to counteract* earlier tendentious periodization (escaping the "Dark Age" foil implied by "Middle Ages"). They represent a conscious effort to break free from the constraining narrative. They are the *antidote to*, not an example of, tendentious periodization. Their goal is precisely to generate questions based on the period's own evidence and dynamics, not the foil.

  4.  **Handling the Persistence of the Label (The Core Problem):**
      Historians aware of tendentious periodization grapple with the label's persistence in several ways:
      *   **Explicit Critique:** Consistently highlighting the label's polemical origins and problematic legacy in introductions and theoretical discussions (e.g., "the so-called 'Dark Ages'...").
      *   **Scare Quotes:** Using quotation marks around the label ("Renaissance," "Scientific Revolution") to signal awareness of its constructed and contested nature.
      *   **Sub-Periodization & Nuance:** Fragmenting the monolithic period implied by the label into smaller, more specific, and less value-laden sub-periods (e.g., Carolingian Renaissance, Twelfth-Century Renaissance, emphasizing diversity *within* the "Middle Ages").
      *   **Emphasis on Continuity:** Actively researching and highlighting lines of continuity *across* the artificial boundary created by the tendentious label (e.g., scholarship demonstrating the vitality of late antique philosophy/theology/science flowing into the early medieval period, blurring the "Dark Age" break).
      *   **Proposing Alternatives:** Offering alternative periodizations or labels that better reflect the period's internal characteristics (e.g., "Early Modern" instead of "Renaissance" for certain aspects, though this has its own baggage). "Late Antiquity" is the prime successful example.
      *   **Reframing the Questions:** Consciously resisting the agenda set by the label. Instead of asking "Was there a Renaissance?" (which accepts the Humanist frame), asking "How did cultural production, intellectual engagement, and social values change between 1300-1550?" or "What were the diverse modes of engaging with classical antiquity in the 14th-16th centuries?" The challenge is to make the *questions* derive from the evidence, not the inherited label.

  **Conclusion:**

  You have pinpointed a fundamental and pervasive mechanism in historical periodization: **Tendentious Periodization**. While lacking a single ubiquitous label, this concept precisely captures the process where a period's identity is forged by its successor's polemical naming, and the subsequent struggle of historians to escape the narrative constraints embedded in that enduring label, even after rejecting its original derogatory intent. The key boundaries lie in the *origin* of the label (contemporary successor period), its *polemical intent* (defining self by negating the other), and its *persistent constraining effect* on historical inquiry. Corrective labels like "Late Antiquity" represent deliberate attempts to overcome this phenomenon. The ongoing challenge for medievalists (and others) is to continue developing strategies – through nuanced periodization, emphasis on continuity, and reframed research questions – to break free from the gravitational pull of these inherited, tendentious frameworks and engage with the past on its own more complex and diverse terms.
