answer: |-
  ## Fresco Fragment: After Hume

  The damp has gnawed this saint or king apart,
  Leaving one hand uplifted, robes half-gone.
  A student sees a fist clenched round a heart,
  Pure grief etched deep in fractured stone and bone.
  A tourist traces power in the curve,
  A phantom sceptre held within the air.
  Another shrugs – just plaster, loss to serve
  No purpose, colour stripped beyond repair.
  Thus chaos reigns where vision meets the stain.

  And yet, I have stood longer in this chill,
  We who know pigments, fractures, lime and pain
  See *more* than chance – suggestion works the will,
  Not finding beauty sleeping in the grime,
  But how the trained eye *builds* the story, line by line.

  ---

  **Notes on Execution:**

  *   **Octave (Subjective Chaos):**
      *   Lines 1-2: Sets the scene – damaged fresco fragment ("saint or king," "hand," "robes half-gone").
      *   Lines 3-4: Viewer 1 sees **grief** ("fist clenched round a heart").
      *   Lines 5-6: Viewer 2 sees **power** ("phantom sceptre").
      *   Lines 7-8: Viewer 3 sees **nothing** ("just plaster," "loss," "stripped beyond repair").
      *   **Rhyme:** ABAC CDCD – intentionally loose and unsettled ("apart/heart," "curve/serve," "air/repair" are slant rhymes or imperfect; "gone/bone" is true).
      *   **Meter:** Predominantly iambic pentameter with variations reflecting the fragmentation ("**damp** has **gnawed**..." slight trochaic start; "**Pure** grief..." emphasizes the emotion).

  *   **Volta (Line 9):** "Thus chaos reigns where vision meets the stain." Summarizes the subjective mess and marks the turn.

  *   **Sestet (The Trained Eye / Tension):**
      *   Lines 10-11: Speaker (conservator/critic) enters, contrasting "longer" observation and shared expertise ("We who know...").
      *   Lines 12: Key Humean tension – "suggestion works the will" implies the expert *constructs* meaning ("will") based on hints ("suggestion") inherent in the object, not just passively finds it. "Works" is active.
      *   Lines 13-14: Resolves the tension ambiguously. The expert doesn't just *find* beauty ("sleeping in the grime") – they actively participate in *building* the interpretation ("builds the story"), using their trained perception ("trained eye") on the physical traces ("line by line"). This acknowledges the normative standard ("trained eye") without claiming pure objective discovery.
      *   **Rhyme:** EFG EFG – More settled pattern than the octave, reflecting the speaker's attempt at reasoned perspective, but the concepts remain complex.
      *   **Meter:** Iambic pentameter with natural variations ("**We** who **know** pigments...").

  *   **Avoidances:**
      *   No museum ethics sermon. Focus is solely on perception and judgment *of the fragment*.
      *   No direct Hume quotes. The argument about suggestion, training, and the active role of the perceiver embodies the Humean tension.
      *   "Statistical agreement" is implied by "We who know..." – a community of trained judgment forms the standard, but the poem stays focused on the *experience* of the speaker confronting the object, not abstract statistics.
