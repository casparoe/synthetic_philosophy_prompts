  Okay, the user wants me to argue that chicken production causes more wild animal suffering than beef production, but without using the typical feed conversion efficiency math. Instead, they want me to focus on how annual crop harvests for chicken feed create ecological vacancies that lead to boom-bust cycles in rodent populations, while perennial pastures for beef maintain more stable populations with lower turnover.

