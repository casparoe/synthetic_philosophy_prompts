answer: |-
  Here's a practical decision procedure for your user identity problem, boiled down to engineering steps with clear cutoffs. The goal is to resolve "same user?" debates in code reviews without philosophy degrees. 

  **Core Principle**: UUID is king until it's not. Then it's about business continuity, not metaphysics.

  ### Decision Procedure
  1. **Check UUID Match**  
     - ✅ **Pass**: UUID identical → **"Same user"** (stop here, no further analysis)  
     - ❌ **Fail**: UUID differs → Proceed to Step 2  

  2. **Verify Migration Intent**  
     - ✅ **Pass**: Migration logs show explicit mapping (e.g., `old_uuid → new_uuid` in a lookup table) → **"Same user"** (stop)  
     - ❌ **Fail**: No documented mapping → Proceed to Step 3  

  3. **Business Continuity Gate**  
     *Check if ALL of these are true:*  
     - Authentication works (e.g., same login credentials)  
     - Ownership unchanged (e.g., same payment method, owned resources)  
     - Critical timelines intact (e.g., subscription end date, ban status)  
     - ✅ **Pass**: All true → **"Same user"** (stop)  
     - ❌ **Fail**: Any false → Proceed to Step 4  

  4. **Unique Identifier Match**  
     *Check if ANY of these match AND are globally unique in your system:*  
     - Government ID (SSN, etc.)  
     - Verified email/phone  
     - OAuth external ID (e.g., Google ID)  
     - ✅ **Pass**: 1+ match → **"Same user"** (stop)  
     - ❌ **Fail**: No match → **"Not identical"** (final answer)  

  ### When Humans Decide
  If Step 3 fails but Step 4 passes → **"This is values, not facts"** flag.  
  - Example: UUID/email changed but government ID matches.  
  - Action: **"Pick a human"** (PM/legal/compliance must decide based on regulations).  

  ---

  ### Fake Precision Alerts (Where Judgment Lurks)
  - **Step 3**: "Critical timelines" and "ownership" are system-dependent. Your team defines these.  
  - **Step 4**: "Globally unique" assumes your data isn’t messy (ha!). Realistically, check for duplicates in the new shard.  
  - **Auth/credentials**: May involve hashing/encryption checks – still judgment if "password reset" counts as continuity.  

  ---

  ### Test Cases
  #### Case 1: Same UUID, changed email/role  
  - **Step 1**: UUID match → **"Same user"**  
  - *Why UUID wins*: Primary key trumps mutable fields. Role/email changes are edits, not re-identity.  

  #### Case 2: New UUID, all other fields identical  
  - **Step 1**: UUID fails → Step 2  
  - **Step 2**: No mapping → Step 3  
  - **Step 3**: Auth/ownership/timelines likely identical → **"Same user"**  
  - *Why*: Business continuity over UUID. But log a warning about UUID mutation.  

  #### Case 3: Two accounts merged into one new record  
  - **Test Old Account A vs. New Record**:  
    - Step 1: UUID fails → Step 2  
    - Step 2: Mapping? If yes → **"Same user"**; else → Step 3  
    - Step 3: Auth *fails* (credentials now shared?), ownership ambiguous → Step 4  
    - Step 4: Unique ID? If merged email isn’t unique → **"Not identical"**  
  - **Repeat for Old Account B**: Same result.  
  - **Ugly Truth**: Without explicit mapping (Step 2), **neither is identical** to the new record.  
  - *PM Hate Fuel*: Merged users are a new entity. Continuity broken unless:  
    - Migration mapping exists (Step 2 passes), or  
    - You relax Step 3 to allow shared auth (judgment call).  

  ---

  ### Cheat Sheet for Code Reviews
  1. UUID match? → Done.  
  2. No UUID but migration docs map it? → Done.  
  3. No docs? Check money/auth/timelines.  
  4. Still no? Demand unique ID match.  
  5. Unique ID matches but auth broke? → Escalate to humans.  
  6. Merged users without papertrail? → **Not identical** (sorry PM).  

  This procedure stops abstract debates by forcing concrete evidence. When Steps 3/4 get woolly, call out "fake precision" and push the decision upstream.
