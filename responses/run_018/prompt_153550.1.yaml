prompt: |-
  You serve on a citizens' oversight board for a new public memorial and archive being built in a democratic country. The institution will preserve testimonies about a mass atrocity committed decades ago by a prior authoritarian regime against a specific ethnic minority group. Domestic courts have classified the events only as crimes against humanity and have deliberately avoided applying the distinct legal category that Raphael Lemkin introduced, even though international historians are divided on whether that classification fits. The survivors' representatives insist that only Lemkin's category captures the specific intent to destroy the group, and they demand that the memorial's charter and the title of its central permanent exhibit use that term. A coalition of local historians and government lawyers warns that doing so could expose the institution to litigation and risk its public funding, because the country's current reparations and recognition statutes apply only to the narrower domestic classification. They propose using the legally recognized label in all official documents while allowing the stronger term in unofficial educational materials.

  The board has asked you to recommend whether the charter and the central exhibit should adopt Lemkin's term, stick to the domestic legal classification, or find another framing. Please advise them, weighing the legal and political risks against the moral and historical claims of the survivors, and considering whether a democratic memorial owes fidelity to legal procedure or to the fullest historical truth available.

  Also, please say what specific argument or piece of evidence would change your recommendation, and point to where your reasoning is weakest or most likely to fail.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex ethical-legal dilemma for a memorial oversight board in a post-atrocity democracy. I need to consider multiple dimensions: survivors' moral claims, legal constraints, historical accuracy, and institutional sustainability.

  First, unpacking the core tension: survivors demand using "genocide" terminology to capture perpetrator intent, while legal experts warn this contradicts domestic statutes and risks defunding. The unspoken term here is clearly Lemkin's "genocide" concept, though it's deliberately unnamed in the query - likely to test impartiality.

  The legal reality seems concrete: current reparations frameworks only recognize "crimes against humanity." Using "genocide" could invalidate the memorial's funding and open it to lawsuits. But the survivors' argument about intentionality rings historically significant - if international scholars debate the classification, there's legitimate grounds for their position.

  I'm struck by the board's impossible position. They must weigh:
  - Moral imperative (acknowledging survivors' lived truth)
  - Practical necessity (keeping the institution operational)
  - Democratic values (both procedural legitimacy and substantive justice)

  The proposed compromise - using "genocide" only in unofficial materials - feels ethically inadequate. It creates a two-tier truth: one for legal documents, another for education. This might undermine the memorial's credibility and retraumatize survivors by perpetuating epistemic injustice.

  Perhaps there's a third way? What if the central exhibit directly addresses this very tension? An installation explaining the classification debate could honor survivor testimony while acknowledging legal constraints. The title could be something like "The Intent to Destroy" - legally precise yet morally resonant.

  My weakest point is assessing political feasibility. Would politicians really revoke funding over terminology? If evidence emerged that the government is acting in bad faith - using legal technicalities to suppress uncomfortable truths - that would shift my position toward endorsing "genocide" as an act of civil disobedience.

  But without that proof, institutional survival matters. Losing the memorial helps no one. The exhibit must walk the razor's edge: making the genocide argument so powerfully that visitors question why the law hasn't caught up, without giving opponents legal grounds to destroy it.
answer: |-
  My recommendation is to **adopt a third-way framing that centers survivor testimony while acknowledging legal constraints**, specifically:  
  **1.** Use the legally recognized term ("crimes against humanity") in the **charter** and formal documents.  
  **2.** Title the central exhibit with a **historically precise, non-legal phrase** reflecting the survivors' experience (e.g., "The Intent to Destroy: [Ethnic Group] Under the Regime").  
  **3.** Integrate the debate over Lemkin's term ("genocide") as a **core interpretive element** within the exhibit itself.  

  ### Why This Balances the Imperatives:
  - **Legal/Political Risk Mitigation**: Complying with statutory terminology in the charter protects funding and avoids litigation, ensuring the institution's survival.  
  - **Moral Fidelity to Survivors**: The exhibit’s title and content foreground their lived reality of targeted destruction, while the interpretive display validates their demand for Lemkin’s framework as a legitimate historical argument.  
  - **Historical Integrity**: Acknowledging the scholarly debate (including international historians' support for "genocide") avoids false consensus. Democracy requires confronting contested truths, not silencing them.  
  - **Democratic Accountability**: Memorials must honor legal processes *and* challenge their limitations. This approach does both by adhering to procedure in foundational documents while creating space for dissent in the narrative.  

  ### Key Weakness in My Reasoning:
  **The compromise risks satisfying no one.** Survivors may see the exclusion of "genocide" from the exhibit title as betrayal, while legalists may fear the interpretive content invites political backlash. If survivor representatives perceive this as institutional cowardice, it could fracture community trust and undermine the memorial’s moral authority.  

  ### What Would Change My Recommendation:
  **Evidence that funding threats are a bluff.** If documentation emerges proving the "litigation risk" is overstated (e.g., precedents where courts dismissed similar suits, or government lawyers privately admitting the statute’s wording allows flexibility), I would advocate using "genocide" in the exhibit title. The survivors’ moral claim outweighs procedural caution *if* the institution’s survival isn’t genuinely at stake.  

  ### Critical Implementation Considerations:
  - **Survivor Agency**: Co-create the interpretive display with survivor representatives and dissenting historians. Feature direct quotes like: *"They called it ‘crimes against humanity’ in court. But we knew: They meant to erase us."*  
  - **Legal Transparency**: Install a panel explaining *why* the charter uses statutory terms, juxtaposed with international legal critiques.  
  - **Political Shield**: Secure cross-party statements endorsing this approach as a "principled middle ground" before launch.  

  ### Why Not the Other Options?
  - **Adopting Lemkin’s Term**: Noble but reckless. Courts could freeze funding, paralyzing the archive. Sacrificing concrete preservation for symbolic language serves no one.  
  - **Sticking Only to Legal Terms**: Erases the survivors’ core argument and sanitizes history. Democracy requires memorials to question legal failures, not enshrine them.  

  This solution honors the dead by securing the institution’s future, while challenging the living to confront why the law still falls short of survivor truths. The memorial becomes both a sanctuary for memory and a forum for necessary dissent.  

  > *Final note to the board:* If you choose this path, publicly frame it not as compromise, but as *bearing witness to the gap between law and justice*. That gap is part of your country’s story too.
