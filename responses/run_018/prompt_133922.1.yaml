prompt: |-
  I'm a journalist running an idea-lunch for my newsroom—smart editors, zero neuroscience. Next session I'm walking them through predicitive processing and the free-energy priciple, but I don't want the usual brain-is-guessing summary. Plan the teaching arc: the dependency order so each idea carries the next; one concrete example—not the dark room, please—like a tidal gauge that adjusts its own exposure to minimize surprise about storm surges, with what properties it needs and the teleological trap it avoids; the misconceptions in the order they'll appear ('free energy is literal heat,' 'predictions are conscious guesses,' 'error signals are bad news') and where in the sequence to kill each; one check question that shows they understand the framework, not just the buzzwords; and what I should openly refuse to put on the board (the variational equation, probably). Format exactly: Dependency order (~120 words), The carrying example (~100 words), Misconception map (~130 words), The check (~50 words), What to skip (~60 words).
reasoning: |-
  Okay, the user is a journalist preparing an "idea-lunch" session for editors with no neuroscience background. They want to teach predictive processing and the free-energy principle without oversimplifying to "brain is guessing." The challenge is to build a clear conceptual arc that avoids technical jargon while preempting common misconceptions. 

  Hmm, the tidal gauge example feels promising - it's concrete, avoids the overused dark room analogy, and demonstrates active inference through physical adjustment. The tide gauge needs specific properties: predictive capability (forecasting), feedback loops (exposure adjustment), and goal-directedness without teleology (passive physics). This neatly sidesteps the "why does it want to minimize surprise?" trap. 

  For misconceptions, I notice editors might anthropomorphize early ("predictions are conscious guesses") or confuse free energy with thermodynamics. These need dismantling at specific points: thermodynamic confusion during the initial definition, anthropomorphism when introducing prediction, and "error signals as bad" during active inference explanation. 

  The dependency order must flow logically: surprise as the core problem → inference as solution → prediction as inference engine → active sensing → full active inference. Each step should feel inevitable. 

  For the check question, I'm considering asking about a thermostat - it tests if they grasp prediction (expected temp), error (deviation), and action (heating/cooling) as inseparable components rather than linear steps. 

  Definitely skipping Friston's equations. Also avoiding Bayesian math and any mention of Markov blankets - those would derail the conversation. Keeping it strictly at the "what does the model do?" level of abstraction.
answer: |-
  Here’s your teaching plan, structured as requested:

  ---

  **Dependency Order (118 words)**  
  Start with **surprise** (unexpected sensory input) as the core problem biological systems must solve. Introduce **inference** (estimating hidden causes of sensations) as the solution, requiring a **generative model** (an internal "simulator" of how the world works). Explain that models generate **predictions** to preempt sensations. When predictions mismatch reality, **prediction errors** arise. Reveal the **free-energy principle**: minimizing surprise by reducing prediction errors. Finally, introduce **active inference**: acting to *change sensations* to match predictions (e.g., moving closer to see better). Each concept scaffolds the next: surprise → inference → models → predictions → errors → free energy → action.

  **The Carrying Example: "Storm-Ready Tide Gauge" (98 words)**  
  Imagine a tide gauge predicting storm surges using historical data (its **generative model**). It proactively adjusts its sensor height *before* waves hit (**active inference**) to keep readings within expected ranges, minimizing sensor overload (**surprise**). It needs: (1) a **predictive model** (storm patterns), (2) **error detection** (actual vs. expected wave height), and (3) **action capacity** (motorized height adjustment). Crucially, it isn’t "seeking truth" or "avoiding damage"—it’s mechanically minimizing prediction errors via physics. This avoids the teleological trap: no "goal" beyond error reduction.

  **Misconception Map (130 words)**  
  1. **"Free energy = literal energy/heat"**: Kill immediately when defining free energy. Clarify: "It’s a *math metaphor* for prediction errors, not thermodynamics."  
  2. **"Predictions = conscious guesses"**: Crush when introducing predictions. Stress: "These are *unconscious*, probabilistic signals at all neural levels (e.g., edge-detectors predicting lines)."  
  3. **"Error signals = bad/failure"**: Correct during active inference. Explain: "Errors are *information*! They drive learning (update models) or action (change inputs)—like the tide gauge adjusting *because* of errors."  
  4. **"Brains just predict; senses just input"**: Preempt with the tide gauge. Emphasize: "Sensing is *active*—we sample the world to *test* predictions (e.g., squinting)."

  **The Check Question (47 words)**  
  *"A thermostat expects 20°C but senses 15°C. What would predictive processing say it ‘should’ do? How is this active inference?"*  
  ✅ Correct answer: Adjust temperature (action) *or* update its expectation (learning) to reduce prediction error—not just "turn on heat." Tests grasp of perception-action unity.

  **What to Skip (58 words)**  
  **Refuse to write:** The variational free energy equation (ℱ). **Avoid:** "Bayesian brain" (jargon), Markov blankets (overcomplicates), entropy metaphors. **Instead say:** "Free energy quantifies total prediction errors—don’t worry *how*, focus on *what it does*: force systems to resolve surprises." Use analogies (like the gauge) as computational placeholders.

  ---

  **Key Teaching Tips**  
  - **Anchor to journalism:** "This is why we crave narratives (predictive models) and get cognitive dissonance (prediction errors!)."  
  - **Whiteboard:** Sketch the tide gauge’s predict→sense→act loop. Label components using bolded terms above.  
  - **Emphasize:** "Your brain isn’t *guessing*—it’s *enacting* a controlled hallucination, constrained by senses."
