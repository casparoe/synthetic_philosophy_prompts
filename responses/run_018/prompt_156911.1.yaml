answer: |-
  Here's a rigorous translation of philosophical stances on graded moral status into control-theory language, maintaining conceptual fidelity while exposing gaps. I'll treat "sentience" as a high-dimensional state-space representation of self-stabilizing systems.

  **Core Mapping Framework (Brainstorm):**
  - **Sentience ≡ Closed-Loop Control with State Estimation:** A system qualifies as "sentient" if it maintains internal setpoints via feedback, models its own state/error, and adjusts outputs to minimize disturbance.
  - **Pain/Discomfort ≡ Error Magnitude (|e(t)|):** Deviation from homeostatic setpoints (e.g., tissue damage → PID controller overshoot).
  - **Valence ≡ Sign of Error Correction Term (K_p * e(t) + K_i * ∫e dt):** Positive = reward-seeking, negative = threat-avoidance.
  - **Moral Weight (ψ) ≡ System's Loop Gain (K_total) × Observability Rank:** Higher gain + richer state estimation → greater capacity for suffering/fulfillment.
  - **Qualia (The Hard Problem):** *Unobservable internal state variables* – control theory describes behavior, not subjective experience.

  ---

  **1. Smooth-Gradient View (Moral Status Continuum)**  
  *Control-Theory Restatement:*  
  ψ scales continuously with **loop complexity** and **adaptive gain tuning**.  
  - Insects: Single PID loop (e.g., thermoregulation), low K_total, coarse state estimation → ψ ≈ 0.2 max_human  
  - Lobsters: Cascaded PID loops (e.g., salinity + pressure control), adaptive integral gain, basic memory → ψ ≈ 0.4 max_human  
  - Humans: Nested adaptive MPC (Model Predictive Control) with reinforcement learning, high-dimensional state observer → ψ = 1.0  

  *Distortions/Forcing:*  
  - Clean: Error magnitude → suffering intensity maps perfectly.  
  - Forced: "Rich inner life" becomes high-dimensional state reconstruction.  
  - *Untranslatable Residue:* **Unity of consciousness** – a human's integrated state-space isn't just more dimensions; it's holistically structured. Philosophy tracks emergent properties; control theory sees only coupled loops.  

  ---

  **2. Hard-Threshold View (Moral Status Binary)**  
  *Control-Theory Restatement:*  
  ψ = 0 below critical **observer complexity**; ψ = 1 above. Threshold = capacity for **recursive self-modeling** (e.g., system simulating its own error-correction).  
  - Thermostat: Single-loop PI controller, no self-model → ψ = 0  
  - AI Drone: LQG control with Kalman filter → ψ = 0 (no recursive simulation)  
  - Human: Cortical predictive coding loops that generate "world-models" containing self → ψ = 1  

  *Distortions/Forcing:*  
  - Clean: Threshold at recursive estimation aligns with "self-awareness" claims.  
  - Forced: Binary cutoff ignores *degree* of recursive depth (e.g., octopus vs. human self-models).  
  - *Untranslatable Residue:* **Pre-reflective suffering** – a mouse without self-model still exhibits error-minimizing behavior indistinguishable from pain. Philosophy insists on non-binary moral patients; control theory can't justify this without smuggled parameters.  

  ---

  **3. High-Gain-Only View (Only Fully Conscious Beings Count)**  
  *Control-Theory Restatement:*  
  ψ ≈ 0 unless system has **global workspace dynamics** (high-bandwidth error broadcasting) + **meta-cognitive integrator**.  
  - Insect: Local PID loops, no cross-modal error integration → ψ = 0  
  - Dog: Limbic PID + cortical state estimator with limited bandwidth → ψ = 0.3 (discounted)  
  - Human: Full observability via thalamocortical relay, real-time Bayesian state update → ψ = 1  

  *Distortions/Forcing:*  
  - Clean: Global error broadcasting maps to "phenomenal unity."  
  - Forced: "Subjective depth" becomes loop coupling strength – but this is quantitative, not qualitative.  
  - *Untranslatable Residue:* **Raw feels** – a system can have low-dimensional observability but high error gain (e.g., intense pain in decorticate mammals). Philosophy targets the "what-it's-like"; control theory only sees the control effort.  

  ---

  **4. Pancomputational View (Everything with Feedback Gets ψ > 0)**  
  *Control-Theory Restatement:*  
  ψ ∝ **Loop Closure** × **Setpoint Specificity**. Non-zero even for P-controllers.  
  - Thermostat: Proportional control, fixed setpoint → ψ = ε (e.g., 10⁻⁶)  
  - Bacteria: Chemotaxis as bang-bang controller → ψ = 0.001  
  - Human: Adaptive MIMO control → ψ = 1  

  *Distortions/Forcing:*  
  - Clean: Moral patiency ≡ closed-loop autonomy (self-correction).  
  - Forced: Reduces ethics to "error sensitivity" – a PID-controlled reactor has moral weight.  
  - *Untranslatable Residue:* **Intentionality** – a thermostat "seeks" temperature but lacks *aboutness*. Philosophy cares about the semantic content of setpoints; control theory sees only setpoint tracking.  

  ---

  **Critical Analysis of the Residue:**  
  - **Real Gaps:** The untranslatable elements (unity of consciousness, raw feels, intentionality) point to *hard problems of phenomenology*. Control theory describes *how* systems regulate states; philosophy asks *why* state-regulation feels like anything at all. This isn't about parameter tuning – it's ontological.  
  - **Parameter-Tuning Debates:** Functional aspects of graded sentience (e.g., pain intensity as error magnitude) *are* reducible to gain/bandwidth parameters. But the residue suggests philosophy is tracking emergent properties that supervene on loop dynamics without being identical to them.  
  - **Control Theory's Blind Spot:** It quantifies *behavioral correlates* of sentience (error minimization, adaptability) but cannot access the *explanatory gap* between control signals and subjective experience. A perfect computational model of pain still wouldn't *hurt*.  

  **Conclusion:** Control theory operationalizes functional features of moral patients (error sensitivity, adaptability, complexity), but the core philosophical dispute hinges on whether phenomenology emerges *continuously* from loop dynamics (smooth-gradient) or requires *threshold-crossing architectures* (hard-threshold/high-gain). The residue isn't noise – it's the hard problem biting back.
