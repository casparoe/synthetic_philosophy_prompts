answer: |-
  The 1758 controversy centered on d'Alembert's *Encyclopédie* article proposing a permanent theatre for Geneva, opposed by Rousseau in his *Letter to d'Alembert*. Rousseau framed the debate as a test of his theory: theatre cultivates artificial *amour-propre* (vanity, social comparison) over natural *amour de soi* (self-preservation, authenticity), thereby corrupting civic virtue essential for Geneva's small republic. The actual decision-makers were Geneva's governing councils (ultimately rejecting the proposal) and the Consistory (moral guardians expressing strong reservations), while d'Alembert represented the *philosophes* advocating Enlightenment progress. Rousseau assigned stark payoffs: adopting theatre meant importing Parisian decadence, idleness, and vanity, dissolving local solidarity, frugality, and citizen-militia readiness, leading to moral and political collapse. Rejecting it preserved republican virtue, community cohesion through wholesome *fêtes*, and civic vigilance.

  Rousseau's account captures well the elite's anxiety about imported Parisian manners eroding Genevan distinctiveness and the perceived link between spectacle and the cultivation of socially destructive vanity (*amour-propre*). However, it obscures the economic motives behind the proposal (merchants seeking entertainment and prestige) and the significant fact that Geneva later tolerated occasional performances without experiencing the predicted civic collapse. This eventual outcome suggests Rousseau's causal mechanism (spectacle → vanity → civic decay) was contingent on Geneva embodying his idealised, austere republican public life – a condition it never fully realised, being a commercial hub with existing social stratification. The absence of catastrophic decay reveals Rousseau's opposition likely depended on an unstated anthropological premise: that humans possess a high degree of plasticity vulnerable to spectacle's corrupting influence, making civic virtue inherently fragile. Geneva's resilience indicates this plasticity might allow adaptation rather than inevitable corruption, challenging the theory's universality. Rousseau's framework powerfully diagnoses a specific threat to *his* model of virtue-based republicanism but cannot account for the more complex social dynamics and adaptability evident in Geneva's history.
