  Okay, the user is presenting at a joint philosophy and political science seminar next week and needs help prepping for Q&A. Their main argument is that religious arguments in public discourse not only violate Rawlsian civility but suffer from normative opacity, making them self-undermining. They believe this actually harms religious citizens by stripping their arguments of authority. The audience includes Rawlsians, political theologians, and a pragmatist.

