prompt: |-
  You are a political philosopher who specializes in the ethics of membership, territorial rights, and freedom of association. Please think carefully, and before you give me your verdict I would find it genuinely useful if you first set out, in two or three lines apiece, the candidate principles that could jointly explain the track record below — I want to see the whole space of rules that fits our precedents, not only the one you happen to favour — and then run each of them against the new case.

  I am the junior, non-voting secretary of our faculty's Working Group on Membership and Exclusion, which for three years has issued short advisory opinions on who may exclude whom, and I have to draft the opinion on a new petition before our next meeting. I want to know what consistency with our own record actually requires, because I suspect our precedents fit more than one principle and I would rather not smuggle in my own politics; my private view is that the petitioner should win, and I would like you to argue against me if the precedents point the other way. Compressed, the opinions so far: a contemplative religious order that refuses to admit a postulant who rejects its vows — exclusion permissible; a private household that declines to put up a stranger for the night — permissible; a private hospital's emergency department that turns away a patient in acute danger of death who cannot pay — impermissible; a company that owns every dwelling, the only school and the only clinic in an isolated mining town, and that evicts a family for union organizing — impermissible; a small farming cooperative with a language-revival charter that admits only members willing to conduct its business in the endangered language, although it is by far the cheapest housing in the district — permissible, but only because it publishes transparent admission criteria and lets non-members lease land at the market rate; a wealthy coastal state that refuses admission to families from a drowning island state whose submersion its own emissions materially contributed to — impermissible, five to four, the majority relying on dire need plus causal contribution and the dissent on collective self-determination; a large public discussion forum that expels a member for sustained bad-faith disruption — permissible.

  The new petition concerns Meridian, a privately built and operated orbital habitat with about two thousand residents. Meridian's charter requires every adult resident to re-affirm its mutual-aid compact every five years, and the operator has declined to renew the residency of a woman born and raised there who now refuses to re-affirm and publicly campaigns against the operator's governance; her partner and child remain residents in good standing. Meridian is the only inhabited structure at its location, it runs all life support, sets the rules of daily life, and operates the only dispute-resolution mechanism available; roughly forty percent of residents are not employees of the operator and never signed anything beyond a standard berth licence. This is not a death sentence: Meridian can, at roughly half a percent of its annual operating budget, fund her transfer to a small research station a few weeks' transit away that has agreed to take her, but she cannot pay for it herself and no state has accepted a duty to receive her. Our chair's circulated draft argues that the mining-town opinion was really about retaliation for protected activity rather than about the town's state-like character, and so does not govern Meridian; I cannot tell whether that is a distinction or an evasion.

  So: does Meridian have the right to exclude her, and if it does, must it fund her relocation? Which of our precedents is the closest analog and why, and what principle are we committing ourselves to either way — the associational-or-ethos reading, the state-likeness reading, the no-genuine-exit reading, the dire-need reading, or something else? If our precedents genuinely underdetermine the case, say so plainly and tell me what each available decision would commit us to, including any conditional option such as exclusion permissible only if funded and phased over a stated period. Finally, name one further hypothetical case, specified in a sentence or two, that would best separate the principles you still think are in play. Please commit to a single recommendation rather than laying out the options for me to choose between, give me in one line how confident you are in it, and flag the one step in your reasoning you think most likely to be wrong, or the single further fact about Meridian that would most change your mind.
reasoning: |-
  Okay, the user is a junior secretary in a faculty working group dealing with membership and exclusion ethics. They need to draft an opinion on a new case about Meridian, an orbital habitat, and want to ensure consistency with past precedents without letting personal bias creep in. They've provided a list of previous rulings and the current case details. Let me start by unpacking all of that.

  First, I need to identify the key principles from the precedents. The religious order and private household cases show strong associational freedom. The emergency room and mining town cases highlight impermissibility when there's dire need or monopoly power with retaliation. The cooperative case allowed exclusion but with conditions: transparency and alternatives. The coastal state case introduced causal contribution to dire need. The forum expulsion was permissible due to bad-faith disruption.

  Now, looking at Meridian. It's a private habitat with monopoly control over life support and dispute resolution. The petitioner refuses to reaffirm the mutual-aid compact and campaigns against the operator. Her family stays, but she faces exclusion. Meridian can fund her relocation, but she can't pay. The chair argues the mining-town case was about retaliation, not state-like traits. Is that distinction valid?

  The user suspects precedents might fit multiple principles. They personally want the petitioner to win but seek an unbiased analysis. The challenge is balancing associational freedom against the lack of alternatives. Meridian's control resembles a state, especially with no exit options without funding. The causal contribution isn't direct like the coastal state, but the habitat's structure creates dependency.

  The mining-town case is crucial here. The impermissibility was due to retaliation for union organizing, which is protected. In Meridian, the petitioner campaigns against governance—similar protected activity? If so, exclusion as retaliation might be impermissible. But if it's just refusal to reaffirm the compact, maybe not. The key is whether her actions are seen as legitimate dissent or breach of membership terms.

  The cooperative case required alternatives—leasing land at market rate. Meridian offers funding for relocation, which could be seen as providing an alternative. But the research station isn't equivalent, and she's dependent. The dire-need factor: while not immediately life-threatening, being stranded without resources poses a risk.

  The user needs to know which precedent is closest. The coastal state case involved causal contribution to dire need. Here, Meridian's control creates the dependency, but they didn't cause her need directly. However, their monopoly means no viable exit, aligning with the no-genuine-exit principle.

  A critical fact is whether her refusal to affirm is passive or active campaigning. If it's just non-compliance, exclusion might be permissible with funding. But if it's retaliation for dissent, it's more like the mining-town case. The chair's focus on retaliation might be an evasion if Meridian's governance is state-like.

  The user also asks for a hypothetical to test principles. One that separates associational freedom from state-like obligations. For example, a private island community with similar control but no external alternatives. That would force a choice between the two readings.

  Confidence level: 70% because the retaliation angle is debatable. If her campaigning is the main reason for exclusion, then mining-town precedent applies. If it's solely her refusal to affirm, then maybe permissible with funding. The key unknown is the exact reason for non-renewal—governance dissent vs. breach of compact. That would change the outcome.
answer: |-
  Based on your precedents and the need for consistency, here is the analysis structured as requested:

  **Candidate Principles Derived from Precedents:**
  1.  **Strong Associational Freedom:** Groups defined by intimate shared purpose (religious order, household) or expressive association (forum) may exclude based on non-adherence to core commitments or disruptive behavior. (*Permitted exclusions: Religious order, household, forum*)
  2.  **Monopoly Power + Basic Need:** Entities controlling essential resources/life-sustaining services (emergency room, company town) cannot exclude in ways that deny basic human needs (emergency care, shelter/community access), especially when no alternatives exist. (*Impermissible exclusions: Hospital, Mining Town*)
  3.  **Causal Contribution + Dire Need:** Where an actor materially contributes to creating a dire need (climate change causing displacement), it cannot deny refuge to those endangered. (*Impermissible exclusion: Coastal State - Majority view*)
  4.  **Conditional Exclusion:** Exclusion based on selective criteria is permissible only if transparent, non-coercive due to alternatives, and non-exploitative of monopoly position. (*Permissible exclusion: Cooperative - with conditions*)
  5.  **Retaliation for Protected Activity:** Exclusion is impermissible when used to punish core rights (like labor organizing) within a dependent community, irrespective of formal statehood. (*Impermissible exclusion: Mining Town - Chair's interpretation*)

  **Application to Meridian Case:**
  *   **Strong Associational Freedom:** Meridian has a defined mutual-aid compact requiring periodic affirmation. Her refusal *prima facie* justifies non-renewal under this principle (like refusing vows). *Favors Meridian's right to exclude.*
  *   **Monopoly Power + Basic Need:** Meridian controls *all* life support, dispute resolution, and habitable space at its location. She has no viable exit without its assistance. Forced ejection *without provision* creates life-threatening dependency akin to the hospital/mining town. *Favors impermissibility OR conditional exclusion with funding.*
  *   **Causal Contribution + Dire Need:** Meridian's governance structure created her dependency. While not causing planetary submersion, its rules and monopoly *cause* her current plight of having nowhere viable to go. *Favors impermissibility OR conditional exclusion with funding.*
  *   **Conditional Exclusion:** Meridian's exclusion is based on a transparent charter rule. However, its monopoly power and the lack of alternatives (unlike the cooperative's land leasing) make the situation coercive. *Suggests exclusion only permissible IF funded relocation is provided.*
  *   **Retaliation for Protected Activity:** Her public campaigning against governance *could* be seen as protected political activity within her home community, analogous to union organizing. If exclusion is primarily retaliatory, it's impermissible under this principle. *Favors impermissibility if retaliation is primary motive.*

  **Closest Analog:** The **Mining Town** case is the closest analog. Both involve:
  1.  A private entity functioning as a *de facto* sovereign within a closed community (monopoly on essential services, dispute resolution, housing).
  2.  Exclusion targeting an individual engaged in dissent (union organizing vs. campaigning against governance).
  3.  The potential for exclusion to effectively banish the individual from their established community/home due to dependency and lack of alternatives.

  **Recommendation & Principle Committed To:**  
  **Meridian's exclusion is impermissible unless it fully funds her safe relocation to the agreed research station.**  
  *Principle Committed To:* **Monopoly Power + Need Creates Obligation.** When an entity wields monopoly control over essential life-sustaining functions within a closed community, creating dependency, it cannot exclude residents in ways that expose them to destitution or extreme peril. Exclusion based on dissent or non-adherence is permissible *only* if a genuine, accessible, and safe alternative is provided. This synthesizes the core concerns of the Mining Town, Hospital, and Cooperative precedents, while respecting the structured association element present in the Religious Order/Forum cases.

  **Confidence & Key Uncertainty:**  
  Confidence: **70%**. The step most likely wrong is **interpreting her "public campaigning" as protected activity analogous to union organizing**. If the Working Group views refusal to affirm the compact as a *purely* internal membership condition (like rejecting vows) *without* a retaliatory element for dissent, the Religious Order/Forum precedent might dominate, permitting unfunded exclusion. *The single fact that would most change my mind:* Clear evidence that her exclusion is **solely** for non-affirmation of the compact, with her campaigning being irrelevant to the decision.

  **Further Hypothetical to Separate Principles:**  
  "A private corporation owns and operates the sole viable underwater habitat on Earth's deepest ocean floor, housing 500 researchers and technicians. It expels a senior scientist, born and raised there, for persistently advocating (within internal channels) for democratic worker governance, citing violation of a charter clause requiring 'alignment with corporate operational philosophy.' The habitat is the only inhabitable structure at that depth; return to the surface requires specialized transport only the corporation provides. Can the corporation expel her without funding her return to the surface?"

  *   This tests the clash between **Strong Associational Freedom** (corporate philosophy as core commitment) vs. **Monopoly Power + Need** (absolute dependency, lack of exit) vs. **Retaliation for Protected Activity** (advocacy for worker rights within the community).
