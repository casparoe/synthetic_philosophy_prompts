reasoning: |-
  Okay, let me unpack this user's query. They're in a philosophy of rationality group facing a medical diagnosis dilemma: balancing statistical evidence ("study averages") against personal case reasoning. As an epistemology/decision theory specialist, they want a rigorous framework for "epistemic modesty" (note their typo "epistimic" - I'll use correct spelling but won't interrupt flow). 

  First, I need to identify core tensions: 
  - The reference-class problem they mentioned is central: how to avoid either (a) overly broad statistics that ignore unique factors or (b) self-serving class fragmentation. 
  - Their suspicion about "always update on reasoning" vs "never treat self as special" suggests they've hit a meta-cognition paradox. 

  *Brainstorming key angles:*
  - **Outlier vs rationalization distinction**: Must handle cases like rare genetic markers (legitimate outlier) vs "I feel different" (potential bias). 
  - **Meta-humility**: Separating doubt about *conclusions* from doubt about *reasoning quality* - e.g., "My logic seems sound but I'm stressed" vs "This premise is weak". 
  - **Fragmentation trap**: Every feature used to narrow reference classes (e.g., "female athletes aged 30+") relies on prior inside-view judgments about relevance. 

  Now, building desiderata. Each must be justified neutrally: 
  1. **Outlier Accommodation** (not just pro-inside-view): Because some individuals *are* statistically unique (e.g., rare disease combo), denying this is scientism. 
  2. **Bias Filtering Requirement** (not just pro-statistics): Rationalization is a well-documented cognitive failure - any theory ignoring it enables self-deception. 
  3. **Meta-Cognitive Separation**: Must distinguish "I doubt this belief" from "I doubt my ability to reason about this" - they demand different responses (fact-checking vs seeking help). 
  4. **Fragmentation Resilience**: If narrowing reference classes inherits all prior inside-view errors, the system collapses. Solution must break the regress. 
  5. **Belief/Reasoning Modularity**: Updating on evidence shouldn't require total self-distrust ("I misremembered one symptom, therefore all my reasoning is suspect" is irrational). 
  6. **Calibration Enforcement**: Humility must improve accuracy long-term - not just feel virtuous (rejects purely aesthetic humility). 

  *Checking tensions:* 
  Their suspected clash between "update on own reasoning" (UA) and "never treat self as special" (NTS) isn't fatal. UA could mean "include reasoning as *evidence*", while NTS means "don't *default* to privileging it". But UA *does* conflict with rigid frequentism (which denies UA's validity). The deeper trap is Fragmentation + Calibration: if every class-narrowing move is inside-view-dependent, how to test calibration without circularity? 

  *Scoring existing approaches:* 
  - **Reference-Class Forecasting** (Tetlock-style): Nails calibration (6) and bias filtering (2), but fails outlier accommodation (1) and fragmentation (4) - can't handle novel individual factors. 
  - **Bayesian Self-Location** (Bostrom-style): Handles outliers (1) and modularity (5) via priors, but struggles with fragmentation (4) - where do subjective priors come from? Also weak on meta-cognition (3). 
  - **Virtue Epistemology** (Zagzebski-style): Excels at meta-cognitive separation (3) and anti-fragmentation (by rejecting hyper-quantification), but vague on calibration (6) - how virtues map to accuracy isn't specified. 

  *Key knockout requirement:* **Fragmentation Resilience** (4) sinks most models because it exposes the regress problem in *all* class-narrowing. Bayesianism survives slightly better by formalizing priors, but still can't fully ground them. 

  Final note for user: Their medical case needs this framework to avoid either (a) ignoring legit unique symptoms or (b) overfitting to anxiety. I'll emphasize practical applicability in the response.
answer: |-
  Here’s a step-by-step breakdown of your epistemic modesty framework, designed for rational belief revision under disagreement. I’ll follow your structure: brainstorming, desiderata with justifications, tension analysis, and candidate scoring.

  ---

  ### **Brainstorming Core Issues**
  - **Inside/Outside Conflict**: Outside-view (statistics) prevents idiosyncratic bias; inside-view (case-specific reasoning) avoids ignoring legitimate uniqueness.
  - **Meta-Problem**: Humility isn’t just about *what* you believe, but *how confidently* you trust your reasoning *process*.
  - **Fragmentation Paradox**: If you narrow reference classes using inside-view judgments (e.g., "my age/genes make me atypical"), you bootstrap bias into the statistics.
  - **Outlier vs. Bias**: True outliers exist (e.g., rare genetic disorders) but self-serving exceptionalism is pervasive.
  - **Goal**: A theory that *dynamically weights* inside/outside views based on epistemic hygiene, not just intuition.

  ---

  ### **Desiderata for a Theory of Epistemic Modesty**
  1. **Outlier Accommodation**  
     *Why essential*: Must distinguish legitimate uniqueness (e.g., verifiable rare biomarkers) from anecdotal overfitting. Rejecting outliers dogmatically is unscientific.  
     *Neutral justification*: Empirical reality includes edge cases; denying this violates empiricism.

  2. **Bias Detection**  
     *Why essential*: Filters confabulation (e.g., "My fatigue means I’m not in the recovery statistic").  
     *Neutral justification*: Cognitive science shows universal self-enhancement biases; ignoring this guarantees miscalibration.

  3. **Meta-Humility Distinction**  
     *Why essential*: Separates "I doubt my *conclusion*" from "I doubt my *ability to reason* about this."  
     *Neutral justification*: A brain-fogged patient might correctly distrust their reasoning *process* while holding true beliefs (e.g., "I have infection X" is true, but deduced poorly).

  4. **Fragmentation Resilience**  
     *Why essential*: Prevents "reference-class tennis" (e.g., "I’m in class A (young), subclass B (athlete), sub-subclass C (with gene X)..." ad infinitum).  
     *Neutral justification*: All features used to fragment classes were initially judged relevant via inside-view. Unconstrained, this *destroys* the outside-view’s purpose.

  5. **Belief/Reasoning Modularity**  
     *Why essential*: Allows updating on evidence *without* requiring total self-distrust (e.g., "My argument for symptom Y was flawed, but my belief in Z stands").  
     *Neutral justification*: Reasoning chains aren’t monolithic; rejecting modularity makes all self-correction self-undermining.

  6. **Calibration Enforcement**  
     *Why essential*: Requires humility to *improve accuracy* long-term, not just feel virtuous.  
     *Neutral justification*: Epistemic modesty is instrumentally rational iff it enhances truth-tracking.

  ---

  ### **Tension Analysis: "Update on Reasoning" vs. "Never Treat Self as Special"**
  - **Conflict**: If you *always* update on your reasoning (e.g., "I reasoned carefully → I’m likely an outlier"), you risk exceptionalism. If you *never* treat yourself as special, you ignore valid inside-view evidence.  
  - **Resolution**: The tension is **dissolvable** with meta-humility:  
    - **Step 1**: Apply outside-view to *your reasoning process* (e.g., "Studies show people overestimate their case-specific reasoning").  
    - **Step 2**: Use this to discount (not discard) inside-view conclusions.  
    - **Deep Contradiction?** Only if outside-view is deemed *infallible*—but it too relies on data interpreted via inside-view. A *recursive checkpoint* (e.g., "Is my uniqueness claim falsifiable?") avoids inconsistency.

  **Real Culprit**: *Fragmentation + Calibration*. If fragmented reference classes inherit biased inside-view judgments, calibration fails. Solutions must "anchor" class selection to objective features.

  ---

  ### **Scoring Standard Theories**  
  *(Key: ✅=Strong, ~=Mixed, ❌=Weak)*

  | **Desideratum**       | **Reference-Class Forecasting** | **Bayesian Self-Location** | **Virtue Epistemology** |
  |------------------------|----------------------------------|----------------------------|--------------------------|
  | **Outlier Accommodation** | ❌ (Assumes class averages apply) | ✅ (Priors absorb uniqueness) | ~ (Depends on virtue application) |
  | **Bias Detection**     | ✅ (Uses base rates)             | ~ (Requires honest priors) | ✅ (Humility as virtue)  |
  | **Meta-Humility**      | ❌ (Ignores process doubts)      | ✅ (Updates on mental states) | ✅ (Focuses on character) |
  | **Fragmentation Resilience** | ❌ (Vulnerable to class-splitting) | ~ (Depends on prior structure) | ❌ (No formal safeguards) |
  | **Modularity**         | ❌ (All-or-nothing class use)    | ✅ (Bayesian conditionalization) | ~ (Virtues aren’t modular) |
  | **Calibration Enforcement** | ✅ (Empirically testable)        | ~ (If priors are miscalibrated) | ❌ (Vague on metrics) |

  **Key Weaknesses**:
  - **Reference-Class**: Fails fragmentation + outliers. Treats individuals as *only* class members.
  - **Bayesian**: Fragile if priors for self-location are biased (e.g., "I’m special" prior).
  - **Virtue Epistemology**: Unclear how to resolve fragmentation or measure calibration.

  **Highest-Impact Requirement**: **Fragmentation Resilience** eliminates most contenders. It exposes how theories handle the regress problem of self-referential class narrowing. Only Bayesianism partially survives (via hierarchical priors), but requires careful prior selection.

  ---

  ### **Conclusion & Practical Path**
  - **Strongest Candidate**: **Bayesian Self-Location** (e.g., modeling yourself as a random sample from a meta-reference-class of "agents with similar reasoning"). It best balances desiderata *if* you rigorously audit priors.  
  - **Critical Move**: Treat your inside-view not as *conclusions*, but as *evidence* to be weighted by its epistemic hygiene (e.g., "Was my reasoning blinded? Has it been reliable before?").  
  - **Your Diagnosis Case**: Start by applying outside-view to your *reasons* for uniqueness (e.g., "Do studies show people with my traits *systematically* misjudge this?"). If no evidence supports exceptionalism, default to statistics—but track calibration over time.

  This framework forces *accountable* uniqueness claims. No theory aces all desiderata, but the list filters unworkable solutions fast. Fragmentation resilience is the litmus test.
