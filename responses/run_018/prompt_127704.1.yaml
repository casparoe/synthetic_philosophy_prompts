  i need the desiderata for any adequate theory of how inside-view reasoning and outside-view statistical humility are supposed to interact — call it a theory of epistimic modisty in belief revision. write the full spec: what cases it has to handle (genuine outliers vs. rationalization), what distinctions it must preserve (like being modest about the belief vs. being modest about the reasoning process that produced it), and what puzzles it has to dissolve — especially the referance-class fragmentation problem where every feature you cite to narrow the class was itself evaluated via inside view. for each, say why it's a genuine requirement and not just a prejudice of one camp. flag any pair you think is jointly unsatisfiable; i suspect "always update on your own reasoning chain" clashes with "never treat yourself as special," but i want to see if there's a deeper contradiction.

  briefly score the standard contenders against your list — i'm thinking of the forecasting/reference-class view, a Bayesian self-location account, and a virtue-epistemology humility view — don't add citations, i'll do that later. also say which single requirement knocks out the most candidates.

