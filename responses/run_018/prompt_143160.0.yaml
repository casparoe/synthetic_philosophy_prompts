prompt: |-
  I'm leading a discussion session for a small group of literature graduate students who have just finished Nausea and are beginning Being and Nothingness; they have seized on the café waiter as the canonical image of bad faith and now assume Sartre is only talking about social roles. I need a teaching plan—not the lecture itself—for explaining Sartre's claim that radical freedom reaches all the way into what people take to be innate emotional or aesthetic temperaments, so that describing oneself as "naturally melancholic" or "constitutionally unable to appreciate abstract art" is already a choice disguised as destiny. Specify the exact order of introduction: what distinction must be secured first—probably facticity versus transcendence, or perhaps the for-itself versus the in-itself—before the students can see why freedom is not the absence of constraint but the unavoidable burden of being one's own foundation.

  For the carrying example, evaluate whether a musician who insists that her sorrow is an innate temperament that determines her compositions can do the work, or whether it fails because it invites psychological determinism; if it works, say precisely what feature it must possess and what it must lack, and if not, propose an alternative single case that carries the same structure without that risk. Then map the misconceptions these particular students are likely to form—such as conflating Sartre's freedom with liberal free will, treating bad faith as mere hypocrisy, or reading "choice" as a conscious deliberation rather than a pre-reflective project—and indicate the exact point in the sequence where each misconception should be intercepted and neutralized. Include one diagnostic question at the end that reveals whether they have understood that freedom is not about having options but about being the groundless ground of one's own being, and state explicitly which Sartrean concept—perhaps the look of the Other, or anguish—should be deliberately omitted at this stage and why its inclusion would derail the sequence.
reasoning: |-
  Okay, I need to help this user create a teaching plan for their literature grad students. They've just finished "Nausea" and are starting "Being and Nothingness," but the students are fixated on the café waiter as the prime example of bad faith, thinking Sartre only critiques social roles. The main goal is to expand their understanding to include how radical freedom penetrates even what we consider innate traits—like claiming to be "naturally melancholic" or unable to appreciate art—as choices disguised as destiny.

  First, I should outline the core concepts they need to grasp. The key distinction has to be facticity versus transcendence. That's foundational. Without it, the students won't get why freedom isn't just about social roles. Facticity covers the given aspects of existence—our body, past, environment—while transcendence is our ability to surpass that through projects and choices. That sets the stage for showing how even emotions and temperaments aren't fixed.

  For the carrying example, the user suggested a musician who attributes her sorrow to innate temperament. I need to evaluate if that works. The problem is it risks reinforcing psychological determinism—if she sees it as innate, it might imply she's bound by it, which contradicts Sartre's point. So, I should tweak it to emphasize how she actively shapes her sorrow through her music, making it a project rather than a passive state. That way, it highlights choice without determinism.

  Now, mapping misconceptions is crucial. These students might conflate Sartre's freedom with liberal free will, thinking it's about having options. Or they might see bad faith as simple hypocrisy, not realizing it's deeper—a denial of freedom itself. Also, they could interpret "choice" as conscious deliberation, missing that it's often pre-reflective. I need to intercept these at specific points: when defining bad faith, clarify it's not just hypocrisy; when discussing freedom, stress it's about being the foundation, not options; and for choice, explain it's pre-reflective.

  A diagnostic question at the end should test if they understand freedom as the "groundless ground." Something like, "If someone says they're naturally melancholic, why is that a choice for Sartre?" The answer should reflect that they're evading responsibility by framing it as facticity, ignoring their transcendence in how they live that melancholy.

  Finally, omit concepts like the "look of the Other" or anguish at this stage. Introducing them too early could derail by shifting focus to social dynamics or overwhelming emotions, which aren't central to this lesson on internal freedom. Stick to the core sequence to build clarity.

  Putting it all together, the teaching plan should start with facticity vs. transcendence, use a revised musician example, address misconceptions step by step, and end with a diagnostic question. This structured approach should help the students see freedom's depth beyond social roles.
answer: |-
  Here’s a structured teaching plan targeting your students’ misconception, sequencing concepts to build toward Sartre’s radical view of freedom. **Total Estimated Time: 90 minutes.**

  ---

  ### **Teaching Plan: Radical Freedom Beyond Social Roles**

  #### **1. Anchor in Their Current Understanding (5 mins)**
     - **Activity:** Quick recap of the café waiter as bad faith.  
     - **Prompt:** *"What makes the waiter’s role-playing 'bad faith'? Is this *only* about social roles?"*  
     - **Goal:** Validate their insight while hinting at limitations.  
     - **Intercept Here:** Conflation of bad faith *only* with social roles.  

  ---

  #### **2. Foundational Distinction: Facticity vs. Transcendence (20 mins)**  
     - **Core Move:** Define terms *without* freedom yet.  
       - **Facticity:** The "given" (body, past, environment, biological traits).  
       - **Transcendence:** Consciousness’s power to *negate* facticity ("not-being-it").  
     - **Analogy:** A mountain (facticity) vs. the climber’s *project* of scaling it (transcendence).  
     - **Key Question:** *"Can facticity *determine* how I relate to it? (e.g., Does a mountain force me to climb it?)"*  
     - **Goal:** Establish that facticity is *mute*—it gains meaning only through transcendence.  

  ---

  #### **3. Introduce the "Musician of Sorrow" Case—*Revised* (15 mins)**  
     - **Scenario:** *A composer says, "My music is dark because I’m *naturally melancholic*—it’s just my temperament."*  
     - **Why the Original Fails:** Invites psychological determinism ("melancholy made me do it").  
     - **Revision:** **Add active engagement.**  
       - *"She *cultivates* her melancholy: seeks out rainy walks, writes nocturnes at midnight, *refuses* therapy saying, 'This pain is my muse.'"*  
     - **Crucial Features:**  
       - **Must Show:** Her *investment* in sorrow (project), not passive suffering.  
       - **Must Lack:** Any reference to biological/psychological causality (e.g., "My serotonin levels...").  
     - **Prompt:** *"Is her melancholy a facticity she *has*, or a way she *chooses to be*? Where do you see transcendence here?"*  

  ---

  #### **4. Link to Freedom: The "Unavoidable Burden" (20 mins)**  
     - **Reveal:** Freedom = Being condemned to *interpret* facticity (no "innocent" given).  
       - Even "I *am* melancholic" is a *position-taking* toward facticity.  
     - **Sartre’s Punchline:** "We are our choices." Not "We *have* choices."  
     - **Misconception Intercepts:**  
       - **Liberal Free Will (Option-Conflation):** *Intercept here.* Clarify: Freedom isn’t choosing *between* paths (e.g., sad/happy) but *being the path-maker*.  
       - **"Choice" as Deliberation:** Explain *pre-reflective choice*: Her midnight composing isn’t "decided"—it’s her *being* her project.  
       - **Bad Faith as Hypocrisy:** Contrast: Waiter *knowingly* fakes a role; musician *genuinely believes* her sorrow is innate. Both flee freedom.  

  ---

  #### **5. Diagnostic Question & Concept Omission (10 mins)**  
     - **Diagnostic Question:**  
       *"If two people share identical 'melancholic temperaments' (same facticity), but one leans into sorrow artistically while the other fights it with activism, how does Sartre explain this?"*  
       - **Target Understanding:** Freedom is not in *having* temperaments but in *being* (as in *existing as*) one’s stance toward them.  
     - **Omit:** **Anguish (Angoisse).**  
       - **Why:** Anguish reveals freedom’s weight *after* grasping its scope. Introducing it now could reduce freedom to a "feeling" or distract from ontology.  

  ---

  #### **6. Application Exercise (20 mins)**  
     - **Prompt:** *"Pair up. Analyze: 'I’m just not an abstract art person—it’s how I’m wired.' Where is facticity? Transcendence? Bad faith?"*  
     - **Debrief Focus:** How "wiring" is *used* to evade responsibility for engagement.  

  ---

  ### **Why This Sequence Works**  
  1. **Starts Concrete** (waiter) → **Abstract Foundation** (facticity/transcendence) → **New Concrete** (musician).  
  2. **Musician Case Revision** avoids determinism by emphasizing *project* ("cultivating" sorrow).  
  3. **Misconceptions Blocked** at critical junctions:  
     - "Options" vs. "Foundation" intercepted when defining freedom.  
     - "Choice-as-deliberation" intercepted explaining pre-reflective projects.  
  4. **Diagnostic Question** isolates the core: Freedom as self-grounding, not deterministic causality.  

  **Final Tip:** Preempt "But biology!" by agreeing facticity *exists*—but stress: *"Biology doesn’t dictate my* relationship *to biology."*
