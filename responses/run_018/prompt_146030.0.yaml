answer: |-
  Here’s a comprehensive specification of desiderata for an adequate framework of criteria in historical Jesus research, addressing your requirements:

  ### **I. Desiderata: What an Adequate Framework Must Deliver**
  #### **A. Classificatory Adequacy**  
  1. **Distinguish authentic vs. inauthentic traditions**  
     - *Motivation*: Core task of HJ research (e.g., separating Jesus’ probable critique of Temple purity laws [Mark 7:15] from later Gentile-Christian anti-Temple theology).  
  2. **Account for *partial* authenticity**  
     - *Motivation*: Most traditions blend early memory and later interpretation (e.g., Olivet Discourse [Mark 13] mixing apocalyptic Jewish motifs with post-70 CE reflections).  
  3. **Identify traditions authentic to *Judaism* but not Jesus**  
     - *Motivation*: Avoid misattributing common Jewish practices (e.g., ritual washing) to Jesus’ uniqueness.  

  #### **B. Critical Distinctions to Preserve**  
  4. **Authentic to Jesus ≠ Historically accurate**  
     - *Motivation*: A saying can be genuine but contextually mislocated (e.g., "render unto Caesar" likely authentic, but its setting in a Temple-trap [Mark 12:13–17] may be staged).  
  5. **Dissimilarity ≠ Contextual incoherence**  
     - *Motivation*: Prevent Jesus from being severed from Judaism (e.g., dissimilarity might reject "love your neighbor" [Lev 19:18] as "too Jewish," ignoring Jesus’ radicalization of it).  
  6. **Authentic core ≠ Unredacted tradition**  
     - *Motivation*: Recognize layers without nihilism (e.g., Lord’s Prayer has Aramaic traces [*Abba*] but Greek liturgical additions [doxology in Matt 6:13]).  

  #### **C. Methodological Constraints**  
  7. **Conform to oral transmission dynamics**  
     - *Motivation*: Aramaic oral patterns (e.g., *chiasmus*, parallelism in sayings like Mark 2:27) demand flexibility, not atomistic literalism.  
  8. **Align with social memory theory**  
     - *Motivation*: Memories are shaped communally (e.g., post-Easter faith influenced Passion narratives but didn’t invent crucifixion).  
  9. **Respect historiographical limits**  
     - *Motivation*: Avoid psychological speculation (e.g., "Jesus believed he was Messiah" is inferential; explicit claims [Mark 14:62] may be retrojected).  

  #### **D. Niche Requirement: Strategic Communal Memory**  
  10. **Explain theological redaction without global skepticism**  
     - *Motivation*: Early Christians curated memories for identity (e.g., resurrection appearances bolstered authority claims [1 Cor 15:5–8]), yet some criteria (e.g., embarrassment) can still isolate bedrock data (e.g., crucifixion under Pilate).  

  ---

  ### **II. Flagged Tensions: Coherence vs. Dissimilarity**  
  - **The Paradox**:  
    - *Dissimilarity from Judaism/Christianity* risks a decontextualized Jesus.  
    - *Contextual coherence* risks absorbing Jesus into generic Judaism.  
  - **Joint Unsatisfiability**: Strict application of both dissolves the historical Jesus. E.g., baptism by John (coherent with Jewish repentance rites) fails dissimilarity (adopted by early Christians). *Resolution requires weighting*: Coherence anchors Jesus in Judaism; dissimilarity highlights distinctive emphases (e.g., open table fellowship).  

  ---

  ### **III. Scoring Existing Approaches**  
  *(Scale: ★ = Weak; ★★★ = Moderate; ★★★★★ = Strong)*  

  | **Desiderata**               | **Standard Multi-Criteria** | **Social-Memory Framework** | **Strict Form-Criticism** |  
  |------------------------------|----------------------------|----------------------------|--------------------------|  
  | **Authentic vs. inauthentic** | ★★★★ (atomistic focus)     | ★★ (emphasizes distortion) | ★ (pre-redaction = authentic) |  
  | **Partial authenticity**      | ★★ (all-or-nothing bias)   | ★★★★★ (fluid memory)       | ★★ (stratified layers)    |  
  | **Oral transmission dynamics** | ★★★ (Aramaic primacy)      | ★★★★ (performance context) | ★ (written sources only) |  
  | **Strategic communal memory** | ★ (ignores group agendas)  | ★★★★★ (core strength)      | ★★ (redaction ≠ memory)  |  
  | **Coherence/Dissimilarity tension** | ★ (rigid application)     | ★★★★ (dialectical approach)| ★★ (ignores Judaism)     |  

  **Key Trade-offs**:  
  - **Multi-Criteria** (e.g., dissimilarity, embarrassment, coherence): Clear taxonomy but mechanically applied → "criteria stacking" ignores memory fluidity.  
  - **Social-Memory**: Best handles strategic memory/partial authenticity but risks relativism ("all memory is distortion").  
  - **Form-Criticism**: Strong on literary layers but neglects oral dynamics and social context.  

  ---

  ### **IV. Settled vs. Contested**  
  - **Settled**:  
    - No tradition is unredacted; oral transmission involves variation.  
    - Crucifixion under Pilate is historically certain (via multiple attestation/embarrassment).  
    - Jesus was a Jew teaching in a Galilean context; frameworks ignoring this are defunct.  
  - **Contested**:  
    - *Utility of dissimilarity*: Most scholars now reject it as a primary criterion (too skeptical) but retain it cautiously.  
    - *Social memory’s limits*: Debate rages over whether it enables historical recovery or undermines it.  
    - *Authenticity of specific sayings*: e.g., apocalyptic logia (Mark 13:30) or "I am" statements (John 8:58) remain hotly disputed.  

  ---

  ### **V. Resolving the Niche Requirement**  
  An adequate framework must:  
  1. **Model communal curation** (e.g., prophecy historicized in Gospels).  
  2. **Retain diagnostic tools** (e.g., multiple attestation across independent streams [Q, Mark, Paul] flags stable memories).  
  3. **Avoid collapse into skepticism** by seeking "traditions with friction"—elements resisting community interests (e.g., Jesus’ baptism by John [embarrassing] or crucifixion [scandalous]).  

  **Bottom Line**: No framework "settles" who Jesus was; adequacy means responsibly sifting probabilities while acknowledging the data’s limits. The coherence/dissimilarity tension remains the field’s thorniest problem—only mitigated by methodological humility and contextual plausibility.
