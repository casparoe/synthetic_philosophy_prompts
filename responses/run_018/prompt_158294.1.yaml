answer: |-
  Here's a structured desiderata list for evaluating theories about the epistemic status of the Church-Turing Thesis (CTT), addressing your core concerns. The criteria are designed to force explicit commitments and expose tensions.

  ### Core Desiderata for Any Theory of CTT's Status
  1.  **Scope Distinction:** *Must distinguish between mathematical/computational models and physical realizability.*
      *   **Critical Cases to Distinguish:**  
          *   Recursion-theoretic models (Turing Machines, λ-calculus, μ-recursion) vs. idealized analog models (BSS machines over ℝ, Malament-Hogarth spacetimes, Zeno machines).  
          *   Quantum computational complexity classes (BQP, BPP, QMA) vs. claims of quantum hypercomputation (e.g., unphysical interpretations of quantum mechanics enabling super-Turing computation).  
          *   Oracle machines (e.g., with Halting Oracle) vs. claims about physically realizable oracles.
      *   *Rationale:* Collapsing this distinction renders CTT either vacuously true (if only recursion-theoretic models define "computation") or trivially false (if idealized analog models count).

  2.  **Mathematical Adequacy:** *Must align with the established core of recursion theory.*
      *   **Non-Negotiable Consistency Requirements:**  
          *   Preserves the equivalence of standard models (Turing, Church, Gödel-Herbrand, Post).  
          *   Compatible with undecidability results (Halting Problem, Rice's Theorem).  
          *   Compatible with hierarchy theorems (time/space complexity).
      *   *Rationale:* CTT is the foundation of this field; a theory undermining it is self-defeating.

  3.  **Explanatory Power for Equivalence Proofs:** *Must explain why proving model equivalence (e.g., TM ≈ λ-calculus) is substantive, not tautological.*
      *   *Rationale:* If CTT is *defined* as "what TMs compute", these proofs become trivial. A viable theory must show why these proofs are discoveries about a pre-theoretic concept ("algorithm", "effective procedure").

  4.  **Empirical Falsifiability (Conditional):** *Must specify what (if anything) would empirically falsify the Physical Church-Turing Thesis (PCTT).*
      *   **Distinction Required:** Must clarify if the theory addresses CTT (mathematical) or PCTT (physical).  
      *   **Potential Falsifiers:** Construction of a physical device solving an undecidable problem (e.g., Halting Problem for TMs) or efficiently solving a provably NP-hard problem in polynomial time *using a physically plausible model not reducible to TM simulation without exponential overhead*.
      *   *Rationale:* Avoids making PCTT non-scientific or vacuously true by redefinition.

  5.  **Physical Realizability Constraint:** *Must provide principled criteria for which mathematical models correspond to physically possible computation.*
      *   **Non-Negotiable:** Cannot treat "physical computability" as identical to "mathematical computability" without justification (begs the question against analog hypercomputation).  
      *   **Must Address:** Why certain infinite-precision/energy/speed analog models are physically unrealizable (e.g., appeal to quantum mechanics, thermodynamics, relativity, finite information density).
      *   *Rationale:* Distinguishes PCTT from CTT and grounds claims about physical limits.

  6.  **Non-Vacuousness of PCTT:** *Must not make PCTT true by stipulative definition of "physical process".*
      *   *Rationale:* If "physical process" is defined *as* "Turing-computable process", PCTT is tautological but useless. A viable theory needs independent characterization of physical processes.

  7.  **Compatibility with Modern Computation:** *Must coherently incorporate quantum computation and probabilistic computation.*
      *   **Critical:** Explain the status of BQP. Is it a subset of computable functions (CTT) but with different complexity (PCTT)? Must reject claims that quantum mechanics *in principle* violates CTT (distinguishing complexity advantages from computability).
      *   *Rationale:* CTT/PCTT must accommodate established, non-hypercomputational extensions.

  ### The Jointly Unsatisfiable Core & Scorecard
  The fundamental tension arises between **Mathematical Definitionalism** and **Robust Physical Falsifiability**.

  *   **The Unsatisfiable Triad:**
      1.  **CTT is a Definition (Tautology):** "Computable function" *means* "Turing-computable function".
      2.  **PCTT is Empirically Falsifiable:** A physical device could compute a non-Turing-computable function.
      3.  **Analog Hypercomputation is Computation:** Models like idealized BSS or Zeno machines describe genuine *computation*, even if unrealizable.

  *   **Why Unsatisfiable?**
      *   If (1) is true, then a non-Turing-computable function is, by definition, *not computable*. Any device claiming to compute it is either mistaken or not performing computation (violating 3). This makes (2) impossible – there's nothing *to* falsify.
      *   Insisting on (2) and (3) *requires* rejecting (1). Something can only falsify PCTT if it computes a *genuinely computable* function that TMs *cannot* compute. This requires a concept of computation broader than TM-computability *by definition*.

  *   **Scorecard Against the Two Main Views:**

      | Desideratum                          | "It's Just a Definition" (Formalist) View | "It's a Physical Law" (Naturalist) View |
      | :----------------------------------- | :---------------------------------------- | :--------------------------------------- |
      | **1. Scope Distinction**             | **Fails:** Collapses math to definition. Physicality irrelevant. | **Passes:** Explicitly distinguishes math (CTT) from physics (PCTT). |
      | **2. Mathematical Adequacy**         | Passes (trivially, by definition)         | Passes (CTT is accepted as math)         |
      | **3. Explanatory Power (Equivalence)** | **Fails:** Proofs become trivial verifications of definitions. | **Passes:** Proofs reveal deep structure of a pre-formal concept. |
      | **4. Empirical Falsifiability (PCTT)** | **Fails:** PCTT is either meaningless or vacuously true. | **Passes:** Specifies physical falsifiers. |
      | **5. Physical Realizability Constraint** | Fails/Irrelevant: Computation is math, not physics. | **Passes/Fails:** *Must* provide this to have content, but often relies on current physics (weakness). |
      | **6. Non-Vacuousness (PCTT)**        | **Fails:** PCTV vacuously true or incoherent. | **Passes/Fails:** Strives for non-vacuity, but grounding "physical process" is hard. |
      | **7. Compatibility (Quantum/etc.)**  | Passes (BQP ⊆ Computable)                 | Passes (BQP ⊆ Computable, complexity issue) |

  *   **The Killer Desiderata:**
      *   **Eliminates "Just a Definition": Desideratum 3 (Explanatory Power for Equivalence Proofs).** If proving TM ≈ λ-Calculus is a substantive discovery (which it clearly is historically and intellectually), then "computable" cannot be synonymous with "Turing-computable" *by prior definition*. There must be a pre-theoretic concept being analyzed.
      *   **Eliminates Naive "Physical Law": Desideratum 5 (Physical Realizability Constraint) + Desideratum 6 (Non-Vacuousness).** Asserting PCTT as a fundamental physical law is empty without independent criteria for what constitutes a physical process. Simply stating "all physical processes are computable" without specifying *why* idealized analog models are unphysical (beyond "they break CTT") is circular. A viable physical law view *must* provide this independent grounding in physics (e.g., arguing that quantum field theory + general relativity imply finite information density and locality, ruling out infinities).

  ### Conclusion
  A compelling theory of CTT's status must navigate between the Scylla of vacuous definitionalism (failing D3, D4, D6) and the Charybdis of empirically ungrounded physical dogma (failing D5, D6). The most plausible views are **robust versions of the "physical law" (PCTT) perspective** that:
  1.  Accept CTT as a profound *mathematical discovery* about the nature of algorithmic processes (satisfying D2, D3, D7).
  2.  Ground PCTT in *specific, contingent features of our physical universe* (satisfying D1, D4, D5, D6). This makes PCTT falsifiable *in principle* but strongly supported by current physics, while acknowledging that CTT itself remains a mathematical truth. This view inherently denies that idealized analog hypercomputation describes physically possible computation (D5).

  The tension isn't fully resolvable because it hinges on the relationship between abstract mathematics and physical reality – a core philosophical problem. However, this desiderata list forces any theory to make its commitments and boundaries explicit.
