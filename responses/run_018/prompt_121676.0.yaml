prompt: |-
  You're a professional philosopher who specializes in game theory and evolutionary explanations of cooperation — do this carefully, and before you write your answer, spend some time brainstorming the candidate readings and then pruning them; I want the menu, not the first thing that comes to mind.

  I was in an argument on a rationalist-adjacent Discord about AI labs racing on safety — Moloch, multipolar traps, the usual — and someone shut down the whole discussion with the slogan "there's no shadow of the future here," which was taken to establish that defection is the only rational move and that talk about cooperation is just wishful moralizing. I keep running into this phrase in the iterated prisoner's dilemma literature (usually attached to the Axelrod-ish tournament results, but I don't care about provenance) and I've realized I don't actually know what precise claim it's making, and the precisification matters a lot here because the argument needed a specific one. So: lay out the distinct theses it could be expressing. Some obvious candidates I want separated out rather than blended: the discount-rate reading (how much the future is worth to you), the probability-of-another-round reading (the expected number or probability of continued interaction), the horizon-shape reading (whether the endpoint is known and common knowledge, with the backward-induction unraveling that follows), and the question of *whose* future is in the shadow — your own next meeting with this partner, versus the future interactions of third parties who are watching and will update on what you did (indirect reciprocity, reputation, image scoring, whatever you want to call it). I'd also like a reading I came up with myself and can't tell is original or just confused: in the evolutionary framing, where the "players" are fixed strategies replicated by differential success rather than agents forecasting anything, there is no forward-looking at all — so the "shadow" can't be anyone's expectation, and has to be a property of the population structure, something like assortment or viscosity, i.e. how likely a cooperator's next interaction is with another cooperator. Is that a separate mechanism smuggled in under the same phrase, or the same claim in different vocabulary? Also: does the slogan implicitly require the game to stay the *same* game across rounds — same payoff matrix, same capabilities — and does it require that the agent around in the future is, in the relevant sense, still you (your institution's successors, a model trained on the public record of your behavior, your reputation among actors you'll never meet)?

  Deliverable: a table or list of the readings, each stated precisely enough that I could go test it, with a verdict on each — trivial platitude, substantive and defensible, false, or question-begging — and, most importantly, say which reading the person in my thread needed and whether any of them actually gets him to "defection is the only rational move." My suspicion is that even the strongest defensible reading only says the shadow is *one* input among several, and that the conclusion also needs claims about the payoff structure actually being a PD rather than something with a cooperative equilibrium, about the other side's strategy not being conditional on anything you can signal, and about the absence of commitment devices or side payments; if that's right, say so, and spell out what he'd have to establish to earn the conclusion he's using the slogan for. Please skip re-explaining tit for tat, the folk theorem, and the finite-horizon unraveling result from scratch — I've read the textbook versions — and just use them. And if you think one of the readings actually cuts the *other* way in this specific case (AI labs, long development timelines, heavy reputational spillover, a field where today's defection is tomorrow's training data), flag that too; that's the part I most want to bring back to the thread.
