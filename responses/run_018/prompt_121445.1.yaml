  in my RE class we were arguing about whether anyone could ever be justified in believing a miracle happened (we were on the resurrection) and this guy in my year kept killing the discussion with "extraordinary claims require extraordinary evidence", like that just settles it. my feeling is it's either obvious or it's circular, and i can't tell which. also I've seen it credited to Hume, to Carl Sagan, and to about five other people, so idk whose line it even is.

  Could you separate out the precise claims that sentence could be making? The ones I keep going round on:

  - does "extraordinary" mean "very improbable given what we already know" or "would force us to rewrite alot of the rest of what we think"? those feel different to me — lottery wins and wierd one-off science results look like the first but not really the second.
  - what counts as "extraordinary evidence"? evidence that is itself improbable? just more of it? or evidence whose being false would be even more extraordinary than the miracle (my teacher said that one is nearer what Hume actually argues about miracles)?
  - and if the first reading is just Bayes — an unlikely claim needs a big likelihood ratio before it's worth believing — isn't it then both obviously true and not specifically about miracles, so it can't be what's doing the work of ruling them out?

  For each reading say whether it's a platitude, defensible, or actually false, then tell me which one my classmate would need for it to genuinely end the argument, and whether that one quietly builds the conclusion in. British English please (analyse, defence, etc) and keep it fairly short, cheers
