answer: |-
  Below is a comprehensive specification of desiderata for an adequate theory of reparations for historical injustice, structured to meet your requirements. The list prioritizes conceptual rigor, systematic coherence, and operational viability—reflecting your emphasis on moving beyond moral intuition to deliver actionable philosophical criteria.

  ---

  ### **Core Desiderata for an Adequate Theory of Reparations**  
  *(Non-negotiable = **N**; Domain-specific Preference = **P**)*  

  1. **Principled Distinction: Direct Corrective vs. Structural-Repair Obligations**  
     - **Requirement**: Must distinguish between:  
       - *Direct corrective obligations*: Owed to identifiable victims or their *direct lineal descendants* (e.g., unpaid wages to enslaved individuals’ heirs).  
       - *Structural-repair obligations*: Owed to present communities suffering persistent institutional harm (e.g., dismantling racially discriminatory property laws).  
     - **Motivation**: Collapsing these obscures agency (individual vs. institutional) and risks misallocating resources (e.g., compensating descendants individually while ignoring systemic disenfranchisement).  
     - **Non-collapsibility Reason**: Direct obligations bind specific perpetrators/victims; structural obligations bind institutions perpetuating harm. Conflating them violates *targeted rectification* (N).  

  2. **Temporal Attenuation: Moral Force Across Generations**  
     - **Requirement**: Must specify *if* and *how* obligations weaken over time, including:  
       - Functional form (e.g., threshold extinction after identifiable victims die; structural compounding if harm escalates institutionally).  
     - **Motivation**: Intuitive approaches yield contradictions (e.g., "sins of the father" vs. arbitrary generational cutoffs). A theory must explain why obligations persist/decay (e.g., via ongoing benefit/harm transmission).  
     - **Non-negotiable (N)**: Without this, theories cannot resolve multi-generational cases (e.g., settler-colonial land theft).  

  3. **Consistency with the Non-Identity Problem**  
     - **Requirement**: Must explain how present persons are owed reparations *without* assuming they would exist absent the harm (e.g., descendants of enslaved people exist *because* of slavery’s historical conditions).  
     - **Solution Path**: Focus on *comparative harm to present individuals* (e.g., "You are owed repair for being born into a world where your community was systemically deprived, not because you would otherwise not exist").  
     - **Non-negotiable (N)**: Avoids metaphysical contradictions in counterfactual personhood.  

  4. **Defensible Counterfactual Baseline Selection**  
     - **Requirement**: Must establish a non-arbitrary baseline for measuring loss (e.g., economic/ecological conditions *without* the injustice) while avoiding speculative history.  
     - **Method**: Use *conservative historical benchmarks* (e.g., pre-injustice land productivity; indigenous sovereignty norms) or *comparator communities* (e.g., non-colonized societies with similar starting conditions).  
     - **Non-negotiable (N)**: Without this, loss quantification is arbitrary.  

  5. **Compatibility with Liberal Anti-Punishment Constraints**  
     - **Requirement**: Must not treat present beneficiaries (e.g., inheritors of colonial wealth) as *blameworthy*. Liability must arise from *unjust enrichment* or *complicity in maintaining harmful structures*, not collective guilt.  
     - **Motivation**: Liberal individualism rejects liability for unchosen identities/actions.  
     - **Non-negotiable (N)**: Violating this legitimizes objectionable forms of collective punishment.  

  6. **Treatment of Ecological/Interspecies Harms**  
     - **Requirement**: Must determine if resource extraction/ecosystem degradation belongs in reparative justice or separate frameworks (e.g., distributive/conservation).  
     - **Resolution**: Include if harm *directly undermines community survival* (e.g., stolen rivers violating treaty rights); exclude if purely ecological (e.g., endangered species with no human-cultural link).  
     - **Preference (P)**: Depends on whether the theory prioritizes *human dignity* (reparations) or *ecological integrity* (distributive justice).  

  ---

  ### **Trilemma Analysis: Joint Unsatisfiability**  
  The combination of **strict temporal attenuation**, **non-identity resolution severing lineal claims**, and **liberal anti-punishment constraints** creates a trilemma:  
  - **Strict attenuation** weakens obligations across generations (e.g., obligations expire after direct victims die).  
  - **Non-identity resolution** severs claims based on lineage (present persons cannot claim harm *as* descendants).  
  - **Anti-punishment constraints** forbid holding present individuals liable.  
  **Result**: Structural harms (e.g., racist property laws) *require* collective liability to assign repair duties, but individualism forbids this. **Only escape routes**:  
  1. Reject strict attenuation (allow structural compounding).  
  2. Reject non-identity’s severance of lineage (permit group-based claims).  
  3. Reinterpret anti-punishment to permit *structural liability* (e.g., states as duty-bearers).  

  ---

  ### **Evaluation of Existing Theories**  
  | **Theory**               | **Direct/Structural Distinction** | **Temporal Attenuation** | **Non-Identity** | **Counterfactual Baseline** | **Anti-Punishment** | **Ecological Harms** |  
  |--------------------------|-----------------------------------|--------------------------|------------------|-----------------------------|---------------------|----------------------|  
  | **Corrective Justice**   | Strong on direct; ignores structural (N❌) | Linear decay (P)         | Fails (N❌)      | Individual loss (N✓)        | Strong (N✓)         | Excludes (P)         |  
  | **Structural Injustice** | Strong on structural; conflates direct (N❌) | Non-decaying (P)         | Resolves (N✓)    | Systemic comparison (N✓)    | Weak (N❌)           | Includes (P)         |  
  | **Hybrid Repair**        | Distinguishes (N✓)               | Threshold + compounding (P) | Resolves (N✓)    | Pluralistic (N✓)            | Moderate (N✓)       | Contextual (P)       |  

  **Summary**:  
  - **Corrective Justice**: Fails non-identity and structural harm. Strong on individualism.  
  - **Structural Frameworks**: Violates anti-punishment by imposing collective liability.  
  - **Hybrid Approaches** (e.g., institutional repair) best satisfy core criteria but face the trilemma unless they reject strict attenuation.  

  ---

  ### **Conclusion: The Adequacy Threshold**  
  A theory must satisfy **all non-negotiable criteria (1–5)** to be adequate. The trilemma reveals that **temporal attenuation must permit structural compounding** to avoid collapse. Ecological harms (6) remain a contested preference. Hybrid theories come closest by:  
  - Separating direct/structural obligations,  
  - Using threshold attenuation (e.g., claims expire if structures are dismantled),  
  - Assigning duties to institutions (not individuals) to resolve the trilemma.  

  This specification insists on *institutional agency* as the linchpin: historical injustices originate and persist through institutions, making them the primary duty-bearers for repair without violating liberal constraints.
