  - I'll assume the credence for paradox is high if analogies are legitimate, no stable resolution, paradox is well-defined, and no mitigating factors.

  - But it's easier to estimate directly: My overall credence that paradox is necessary.

  - From factors: If analogies are illegitimate (prob 0.6), that lowers paradox chance. If stable resolution exists (prob 0.7), that lowers it. If paradox not well-defined (prob 0.8), that lowers it. Practical contingencies help (prob 0.6 against paradox).

