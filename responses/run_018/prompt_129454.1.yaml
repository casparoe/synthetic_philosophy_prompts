prompt: |-
  I have just finished a rather exhausting argument with a friend about whether visitors are morally bound by local conventions they never explicitly accepted. The concrete situation involves three behaviours he defends without apology: in Tokyo he refuses to queue behind the platform markings, he jaywalks across quiet residential streets despite visible social disapproval, and in cities where gratuities are customary he leaves none for good service, insisting in each case that he never agreed to these local expectations and causes no direct physical harm. I feel there is a genuine moral failure here—he enjoys the orderly benefits produced by others' compliance while free-riding on that very compliance—yet I worry that demanding conformity risks a kind of cultural imperialism, especially since he observes that locals themselves occasionally break minor rules. Before you answer, please adopt the persona of an expert moral philosopher with particular expertise in social and political philosophy, think carefully, and begin by brainstorming the key conceptual distinctions between etiquette, law, and morality, paying special attention to the idea of indexical or presence-dependent obligations that apply specifically to temporary beneficiaries of a cooperative scheme rather than to everyone everywhere. Please advise me on whether my friend's reasoning holds, separating what is philosophically settled from what is genuinely contested, and do not present a disputed view as the consensus. Present your response as exactly five numbered points, each consisting of one or two sentences, with no introduction and no conclusion whatsoever.
reasoning: |-
  Hmm, the user has presented a complex ethical dilemma about visitors' obligations to follow local conventions. They've had an argument with a friend who refuses to follow certain norms in different cultural contexts - queueing in Tokyo, jaywalking, and not tipping where customary. The user believes this constitutes moral free-riding, while their friend argues lack of explicit consent and absence of direct harm absolves him.

  The user wants me to respond as an expert moral philosopher with specialization in social and political philosophy. They specifically asked me to brainstorm conceptual distinctions between etiquette, law and morality, and focus on "indexical obligations" - duties that arise specifically from being present in a cooperative scheme.

  Key philosophical points to cover: The distinction between etiquette (socially enforced conventions), law (state-enforced rules), and morality (fundamental obligations). The concept of "indexical obligations" where presence in a social system creates duties - this draws from theorists like John Rawls and David Hume. The free-rider problem is central - benefiting from others' compliance while not contributing. I should note that while direct harm is absent, undermining social coordination can cause diffuse harm. I must be careful to distinguish settled philosophical positions from contested ones - the existence of presence-dependent obligations is widely accepted, but their precise scope is debated. Cultural imperialism concerns are valid but don't negate the core obligation to respect cooperative practices.

  I'll structure my response as five numbered points without introduction or conclusion as requested. Each point will be concise - one or two sentences maximum. The first point will clarify conceptual distinctions. The second will introduce indexical obligations. The third will address the free-rider argument. The fourth will examine the "no harm" defense. The fifth will acknowledge the cultural imperialism concern while maintaining the core obligation.

  I need to maintain a neutral, academic tone throughout - presenting arguments fairly without taking sides in ongoing philosophical debates. The response should help the user understand both the strength of their position and where reasonable disagreement exists.
answer: |-
  Here are five numbered points addressing your concerns as requested:

  1.  Law imposes state-enforced obligations with defined sanctions for violation; etiquette involves culturally specific norms regulating social interaction, often enforced by informal disapproval; morality concerns fundamental obligations regarding right and wrong action toward others, potentially grounded in fairness, harm, or respect. The critical question is when adherence to non-legal local conventions rises to the level of a moral duty for temporary participants.
  2.  A significant strand in political philosophy argues that benefiting from a stable cooperative scheme (like orderly queues, safe road norms, or a service economy predicated on tipping), even temporarily and without explicit consent, can generate *indexical obligations*—moral duties specifically tied to one's presence and receipt of benefits within that scheme, distinct from universal duties. This is often grounded in principles of fairness against free-riding.
  3.  Your "free-riding" critique holds substantial weight philosophically: by intentionally benefiting from the order and services sustained by others' compliance with local conventions (queue discipline, pedestrian norms, tipping expectations) while deliberately refusing to contribute to that scheme, your friend arguably violates the moral principle of fairness, even if his actions cause no immediate, identifiable physical harm to a specific individual.
  4.  Your friend's defense relying on "no direct physical harm" and "no explicit agreement" is contested; many philosophers argue that the diffuse harm to social coordination, trust, and the stability of beneficial conventions, coupled with the unfairness of exploiting others' cooperation, constitutes a genuine moral wrong, settling that explicit consent is not always necessary for moral duties arising from participation.
  5.  While the concern about "cultural imperialism" in demanding conformity is valid, particularly for norms lacking a fairness rationale or imposing significant burdens, it does not negate the core moral duty to avoid unfairly exploiting cooperative practices from which one benefits; the *scope* and *strength* of such indexical obligations in diverse contexts (e.g., minor rule-breaking by locals) is genuinely contested, not the potential existence of the duty itself.
