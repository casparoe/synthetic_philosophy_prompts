  Okay, let's start by unpacking the user's query. They're questioning the validity of generational labels like Boomers, Millennials, and Gen Z. They mention specific examples where certain groups feel real due to shared experiences—like Baby Boomers post-WWII, or high schoolers during COVID—while others, like Millennials, seem arbitrary. 

  First, I need to validate their observations. They're noticing key differences between cohorts defined by shared experiences versus arbitrary birth years. That's astute. The user is trying to find a unifying principle to distinguish real cohorts from marketing labels. 

  The user's examples are spot on. Baby Boomers have concrete demographic data (post-war birth surge) plus shared cultural touchstones. Millennials, as defined by birth years alone, lack that unifying event until maybe the 2008 recession, but even that doesn't cover the entire range. The COVID high schoolers example is strong—it's a time-bound experience cutting across generational labels, making it more about life stage than birth year. 

  They also bring up tech-related boundaries: dial-up vs. broadband, smartphones before middle school, algorithmic news consumption. These feel real because they shape behavior and worldview, but are they generational or just technological shifts? The user is onto something here—maybe it's about formative exposure timing. 

  Their "algorithmic cohort" idea is intriguing. If someone’s first news source is TikTok instead of TV, that could rewire their information processing. But is that studied? Probably not formally, but researchers do look at tech saturation effects. 

  The core tension they're wrestling with is: What makes a cohort "real"? My response should emphasize that shared formative experiences (especially during adolescence) create stronger bonds than birth years. Demographics matter for size, but experiences forge identity. 

  I should also address why Boomers feel real while Millennials might not. Boomers had concentrated, society-altering events (TV proliferation, economic boom) hitting them at similar life stages. Millennials' experiences were more fragmented—older Millennials remember 9/11 vividly; younger ones don’t. The 2008 recession hit younger Millennials entering a crippled job market, but older ones were already established. 

  For COVID high schoolers, it’s absolutely a real cohort based on shared trauma/disruption during a pivotal developmental window. Birth years become irrelevant here—what matters is being 14-18 when schools shut down. 

  The principle I'd propose: cohorts feel "real" when formative experiences (historical, technological, cultural) converge during developmental windows (adolescence/young adulthood), creating shared psychological fingerprints. Marketing labels just slice birth years without capturing that. 

  The user’s algorithmic cohort fits perfectly under this principle. If TikTok is your primary news gateway during your identity-forming years, it fundamentally shapes how you process information, trust sources, and engage with content—distinct from getting news from Cronkite or CNN. 

  They’re also right to question nostalgia (e.g., dial-up). Its impact depends on whether it coincided with key developmental phases. Dial-up defining your *first* internet experience at age 12 is different from encountering it as an adult. 

  Underlying all this, the user seems to crave a framework to make sense of social categorization beyond commercial labels. There’s a hint of frustration with oversimplified generational discourse. They want to understand what truly binds people—maybe for personal clarity or academic curiosity. 

