answer: |-
  Here's a decision tree based on your specifications, designed for reader navigation without philosophical jargon, while flagging conceptual edges and potential gaps:

  **Decision Tree: The Stain of Dirty Hands**

  1.  **Start:** A leader intentionally commits a clearly wrong act (e.g., torture, fraud) *solely* to prevent a greater catastrophe (e.g., mass terror attack, civil war). Afterward...
  2.  **Q1: Does leaving office *permanently* remove the moral stain for the leader?**
      *   **Yes (Stain Removed by Exit):** Go to Leaf 1.
      *   **No (Stain Persists):** Go to Q2.
  3.  **Q2: Can explicit authorization/vote by the affected populace *cleanse* the moral stain?**
      *   **Yes (Democratic Cleansing Possible):** Go to Leaf 2.
      *   **No (Stain Resists Democracy):** Go to Q3.
  4.  **Q3: If the catastrophe was *NOT* averted (the act failed), does the moral debt become *worse* than if it had succeeded?**
      *   **Yes (Failure Compounds Debt):** Go to Leaf 3.
      *   **No (Debt Same Regardless of Outcome):** Go to Q4.
  5.  **Q4: Is there a distinct "institutional virtue" where the leader's *role/office* transforms their personal vice into a public duty, absorbing the stain?**
      *   **Yes (Role Absorbs Stain):** Go to Leaf 4.
      *   **No (Stain Adheres Personally):** Go to Leaf 5.

  **The Leaves (6 Positions):**

  *   **Leaf 1: Consequentialist Absolution (Stain Removed by Exit)**
      *   *Weirdest Commitment:* Achieving the good outcome (or sincerely trying) is the *only* thing that ever mattered morally; once you leave power, the ledger is wiped clean as if the wrong act never truly belonged to *you* personally.
  *   **Leaf 2: Democratic Laundering**
      *   *Weirdest Commitment:* The explicit consent of the governed can morally sanctify *any* act, no matter how intrinsically wrong, performed on their behalf, turning poison into medicine.
  *   **Leaf 3: Compounding Failure**
      *   *Weirdest Commitment:* Committing a necessary evil that *fails* is a uniquely monstrous category of wrong, far exceeding the original act or even succeeding at it, because it wastes the moral sacrifice for nothing.
  *   **Leaf 4: Role-Absorption** (As requested)
      *   *Weirdest Commitment:* Holding high office creates a separate moral self; the public duty performed *consumes* the private sin, leaving no personal residue – the leader genuinely bears *no* taint, only the office does (which is impersonal).
  *   **Leaf 5: Sacramental Contamination** (As requested)
      *   *Weirdest Commitment:* The stain is an indelible metaphysical mark on the *soul* of the actor, utterly immune to outcomes, apologies, punishment, democracy, or even divine forgiveness – it's an eternal, defining burden.
  *   **Leaf 6: Structural Guilt (Addressing your concern)**
      *   *Weirdest Commitment:* Focusing on the leader's "dirty hands" is a dangerous distraction; the *real* moral horror is the **system** that made the wrong act seem necessary, implicating everyone upholding that system in the stain, regardless of individual choices.

  **Flagged Issues & Empty Paths:**

  1.  **Collapsed "Failure" Node:** Your Q3 (compounding failure) only activates *after* rejecting democratic cleansing and affirming the stain persists. This excludes positions where democratic authorization *might* cleanse a successful act but *not* a failed one (or vice versa). The tree forces "failure impact" to be considered only within a specific subset (stain persists, no democratic fix).
  2.  **Impossible Path:** The path "**Q1: Yes (Stain Removed by Exit)**" leads directly to Leaf 1. There are **no subsequent questions** because leaving office resolves the stain entirely. This means combinations like "Stain removed by exit *but also* requires democratic cleansing" or "Stain removed by exit *but also* compounds on failure" are **structurally impossible** in this tree and likely incoherent conceptually. The tree assumes "exit removes stain" is a terminal answer.
  3.  **Unexplored Combination:** "**Q2: Yes (Democratic Cleansing Possible)**" leads directly to Leaf 2. This path **never asks Q4** (Institutional Virtue). Is democratic cleansing *synonymous* with institutional virtue? Or could they be distinct? (e.g., Maybe a populace authorizes an act, but the leader *still* personally bears the stain, or maybe the office absorbs it *without* needing a vote). This combination is **logically possible but unexplored** by the tree's branching.
  4.  **Structural Complicity Smuggled In:** Your initial setup ("a leader authorizes a clearly wrong act") inherently focuses on **individual agency and intentionality**. While Leaf 6 (Structural Guilt) explicitly addresses your concern, the tree's starting point and core questions still center on the leader's conscious choice and its aftermath. The structural view fundamentally challenges this framing. Leaf 6 is somewhat bolted on as an alternative perspective, not seamlessly integrated into the core logic of the individual-choice-focused tree.

  **Summary:** This tree gives you 6 distinct leaves meeting your criteria. It highlights conceptual tensions (e.g., Sacramental Contamination vs. Role-Absorption) and flags where the branching logic makes certain combinations impossible (Stain Removed by Exit + anything else) or leaves others unexplored (Democratic Cleansing + Institutional Virtue interaction). It acknowledges the structural complicity critique via Leaf 6, but the core framework remains centered on individual leader agency.
