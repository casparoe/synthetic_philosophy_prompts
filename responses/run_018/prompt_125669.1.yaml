  hey — i'm prepping for a colloqium i'm running next thursday and need sharp interview questions for my guest, call her Dr. Reeves. she's defending this pretty niche take on kant and animals: she thinks the usual indirect-duty reading of the metaphysics of morals misses a direct-duty thread hidden in the anthopology lectures, centered on what she terms sympathetic-corruption. the claim is that cruelty to animals doesn't just causally harden us toward people; it structurally undermines rational nature's own coherence, so rational agency actually requires a non-instrumental regard for sentient life even though animals aren't ends-in-themselves. i want eight to ten questions, nothing generic like how did you get into philosophy. i need at least one pressing the autonomy objection — animals lack self-legislation, so how can they command direct obligations without collapsing into ends-in-themselves? — with a follow-up keyed to her likely reply that rational nature needs external correlates. then one on whether this blurs the thing/person distinction kant is so careful about in his ethical writings. then one on factory farming versus wild predation: does her view condemn human agriculture but excuse animal violence in nature? include a follow-up there too. also maybe ask about consistency with his teleology in the third critique. keep the tone sharp, like we're in the room. write casually, typos are fine.
