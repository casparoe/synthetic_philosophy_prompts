answer: |-
  ## Joint Statement: Indirect Normativists (IN) & Substantive Deliberationists (SD)  
  *Reconciling Procedural Authority and Normative Grounding*  

  **Section 1: Agreed Foundations**  
  We, undersigned proponents of IN and SD, affirm the following shared understandings:  

  1.  **Formal Properties of Idealization:** Idealizing an agent involves constructing a counterfactual model where specific contingent limitations (e.g., finite computation, local biases, incomplete information, temporal constraints) are removed or corrected. This model exhibits perfect coherence, logical omniscience, and full sensitivity to available reasons *within the idealized epistemic state*.  
  2.  **Core IN Assertion:** Indirect Normativity fundamentally claims that the *rightness* or *normative status* of an action is solely determined by whether it is the output of (or would be selected by) an *idealized decision procedure* correctly instantiated or approximated by the real agent. The procedure itself, not the action-type in isolation, is the primary locus of normative authority.  
  3.  **Encrypted Indexical Thesis (EIT):** The process of idealization, while abstracting away the agent's specific spatio-temporal location and cognitive limitations, does not eliminate the *first-person, present-tense perspective* ("what *I* should do *here* and *now*"). Instead, this perspective is implicitly embedded ("encrypted") within the *structural constraints and inputs* of the idealized procedure (e.g., the agent's actual core values, fundamental desires, or the specific problem-situation being addressed, all considered under full information and coherence).  
  4.  **Modal Stress-Testing (Coherence Checks):** Assessing the robustness of an idealized procedure (or the normative conclusions it generates) requires examining its outputs across relevant counterfactual scenarios involving significant belief revisions or changes in non-normative facts ("modal stress-testing"). Both sides agree this is necessary to expose potential incoherence, instability, or arbitrariness in the procedure or the deliberation it models. A procedure failing modal stress-testing is defective.  

  **Section 2: Core Disagreements**  

  | Point of Contention                     | Indirect Normativist (IN) Position                                                                 | Substantive Deliberationist (SD) Position                                                                 |
  | :-------------------------------------- | :------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- |
  | **Nature of Normative Authority**       | Normative authority resides fundamentally in the *process* of idealized deliberation itself; the procedure *constitutes* what is right for the agent. | Normative authority resides in mind-independent normative facts (reasons, values, duties); idealized deliberation is an *epistemic tool* to *discover* these facts. |
  | **Status of "Indirectness"**            | Calling the view "indirect" accurately reflects that norms govern the *deliberative architecture*, not actions directly; EIT shows how the agent's perspective is preserved within this architecture. | Labeling normative facts as "indirectly" applied via procedures is a category error; procedures track direct facts. EIT reveals the hidden *direct* indexical anchor, undermining true indirectness. |
  | **Primacy of Procedure vs. Output**     | The correctness of the *procedure* (under idealization) guarantees the normative status of the *action*, even if the action seems counterintuitive under direct assessment. | The correctness of the *action* (according to direct norms) is primary; a procedure is validated *only* insofar as it reliably outputs directly right actions. |
  | **Role of Modal Stress-Testing**        | Modal stress-testing is *constitutive* of the ideal procedure itself; a deliberation not robust under such testing isn't truly idealized. | Modal stress-testing is a powerful *diagnostic tool* for refining our epistemic access to direct norms or exposing flawed procedures, but not definitional of normativity itself. |

  **Section 3: Cruxes of the Disagreement & Test Cases**  

  **Crux 1: Does Procedural Authority Survive Decryption?**  
  *Question:* If the hidden indexical within the idealized procedure (per EIT) is made fully explicit – i.e., if we specify "What should *this specific agent, with these specific core commitments, in this exact situation*, decide under full information/coherence?" – does the resulting normativity remain genuinely *procedural/indirect*, or does it collapse into a species of *direct* normativity applied to this unique indexed circumstance?  

  *Agreed Test Case: "The Reluctant Hero"*  
  *   Agent A has a deeply held, coherently maintained core value of non-violence (pacifism).  
  *   A finds themself in a unique situation where *only* they can prevent a massacre by committing a single, targeted act of violence (e.g., shooting a tyrant about to press a button).  
  *   A's *idealized self*, possessing full information and perfect coherence, *correctly* outputs: "Commit the violent act." This output is robust under modal stress-testing (e.g., variations on how the massacre unfolds, A's physical capabilities, etc.).  
  *   However, A *knows* this act directly violates their core pacifist principle.  

  *Predicted Verdicts:*  
  *   **IN:** The action is right *because* it is the output of A's correctly calibrated ideal procedure (embedding A's *actual* core values and situation via EIT). The direct principle (pacifism) is defeasible *by the procedure itself* when applied to this indexed circumstance. Authority remains procedural.  
  *   **SD:** The idealized deliberation revealed the *direct normative fact* that, in *this specific, indexed situation* (A's pacifism + the imminent massacre), the balance of direct reasons demands the violent act. The procedure was a discovery mechanism. Labeling this "indirect" is redundant; the normativity is direct, indexed to A's situation and values.  

  **Crux 2: Is Modal Stress-Testing Conceptually Necessary for Ideal Deliberation?**  
  *Question:* Can we coherently conceive of "ideal deliberation" *without* requiring robustness under modal stress-testing? Or is the very concept of ideal deliberation conceptually dependent on its stability across relevant counterfactual belief revisions?  

  *Agreed Test Case: "The Locally Coherent Bigot"*  
  *   Agent B has a set of highly coherent but fundamentally false and repugnant core normative beliefs (e.g., a meticulously reasoned, internally consistent racist ideology).  
  *   B engages in deliberation that is *locally ideal* relative to their actual, flawed normative base: perfect coherence, full factual information about the world *as they believe it to be*. This deliberation outputs horrendously immoral actions.  
  *   However, this output is *fragile* under modal stress-testing involving belief revision. If B revised their core racist beliefs (even slightly, or under pressure of new non-normative facts), the procedure would output radically different (and morally better) actions.  

  *Predicted Verdicts:*  
  *   **IN:** B's deliberation is *not* genuinely ideal. True idealization requires modal stress-testing to expose the instability and incoherence *inherent* in B's normative starting point. A procedure that shatters under counterfactual belief revision fails as an authority-conferring ideal. Modal stress-testing is built into the *concept* of an ideal procedure.  
  *   **SD:** B's deliberation *is* locally ideal relative to their actual (awful) normative commitments. The procedure correctly outputs the action mandated *by those direct normative facts* (as B falsely believes them). Its fragility under stress-testing reveals the *epistemic flaws* in B's access to the *true* direct norms, not a flaw in the *concept* of ideal deliberation itself. Ideal deliberation simulates reasoning *from given premises*, even false ones; stress-testing checks the premises, not the deliberative ideal.  

