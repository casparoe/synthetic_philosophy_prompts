prompt: |-
  I run an interdisciplinary seminar on political ethics and institutional design—about 18 advanced undergraduates and graduate students, one 75-minute session, with no assumed shared vocabulary. I want a structured role-play or simulation that makes participants feel, rather than merely discuss, why defining corruption across cultures is not just a matter of drawing a sharper line. The core tension I want them to inhabit is between an obligation-to-reciprocate framework, in which receiving a substantial gift creates a binding social debt that must be honored through future action, and an impartiality-norm framework, in which any private benefit tied to a public decision is a disqualifying conflict of interest. The problem is that in many contexts the same material exchange—say, a livestock gift presented to a local councilor before a water-rights vote—functions simultaneously as both. I want the rules and hidden incentives arranged so that groups operating under different frameworks evaluate the identical exchange differently, then are forced to apply one universal standard to classify a set of exchanges. By the end they should have experienced how the corruption label presupposes a specific boundary between public office and private loyalty that is not self-evidently universal, and they should see that clientelism and gift-giving are not simply opposite ends of a spectrum but can occupy the same institutional space. Please design: (1) the roles and group assignments (e.g., council members, community representatives, external auditors, NGO observers), (2) the staged scenario with concrete materials (what is being decided, what the gift is, how it is delivered, and a synthetic hybrid exchange form—such as a collective contribution that is also personally directed—to prevent this from being a generic replay of standard case studies), (3) the rules of evaluation, including hidden or asymmetric information, so that participants actually run into the framework clash before it is named, (4) a payoff or stakes system using non-monetary metrics (legitimacy scores, community trust, audit clearance) that makes the conflict tangible, (5) a precise timeline for the 75 minutes, (6) a debrief that maps specific moments in the simulation onto the conceptual parts (the reciprocity obligation, the impartiality requirement, the universalist presupposition, and the historical specificity of the public-private separation), (7) an honest note on what will predictably go wrong the first time—such as participants defaulting to their home framework and moralizing the other groups—and how to handle it without lecturing, and (8) a frank statement of which feature of real-world clientelism the simulation cannot reproduce and you as facilitator must supply. Do not ask participants to read external texts; do not include a bibliography, reading list, or citation request in the instructions; and keep the design runnable without web access.
reasoning: |-
  We are designing a 75-minute simulation for 18 participants. The core tension is between two frameworks: obligation-to-reciprocate (gift creates a social debt) and impartiality-norm (private benefit tied to public decision is conflict of interest). We want participants to experience that the same exchange can be seen as both legitimate and corrupt depending on the framework.

  Key elements:
  - Roles: We need at least two groups with different frameworks, and a third group that might bridge or observe. Also, we need a decision-making body and gift-givers.
  - Scenario: A local decision (water rights) with a gift (livestock). Also, a hybrid exchange (e.g., collective contribution that is personally directed).
  - Rules: Different groups evaluate the same exchange by different rules. Then they must apply one universal standard.
  - Stakes: Non-monetary (legitimacy, trust, audit clearance).
  - Timeline: 75 minutes total, including setup, simulation, and debrief.
  - Debrief: Map simulation moments to concepts.

  Design:

  1. Roles and Group Assignments (for 18 participants):
     - Group 1: "Community Elders" (5 participants) - They operate under the obligation-to-reciprocate framework. They are from the local community and represent families/clans. They will give gifts to the council.
     - Group 2: "Council Members" (5 participants) - They are the decision-makers for the water rights. They are split: some are from the local community (so they understand reciprocity) and some are from outside (appointed by a central government, so they adhere to impartiality norms). But to avoid complexity, let's assign the council as a whole to be initially unaware of the framework clash until the gift is given. Alternatively, we can have the council members individually hold different frameworks? But that might be too chaotic. Instead, we can have:
          - 3 council members from the local community (share the reciprocity framework)
          - 2 council members from outside (impartiality framework)
          However, we want the groups to be clear and the clash to be between groups. So let's reorganize:

     Alternative role assignment for clarity:
     - Group A: "Local Community Representatives" (6 participants): They are from the community and believe in reciprocity. They will present the gift to the council. They are divided into 3 families (each family has 2 representatives).
     - Group B: "Council Members" (6 participants): They are the decision-making body. They are from two backgrounds:
          - 3 are "Local Councilors" (from the community, so they understand and feel the obligation to reciprocate)
          - 3 are "External Councilors" (appointed by the central government, trained in impartiality norms)
     - Group C: "Audit Committee" (6 participants): They are external auditors and NGO observers. They are split into two subgroups (without telling them initially) to represent two frameworks? Actually, we want the audit committee to be the one that imposes a universal standard. So they might start with their own framework? Instead, let's have the audit committee as a unified group that must apply a universal standard, but they are given the impartiality framework as their official mandate. However, we want them to see the clash. So perhaps:

     Revised to fit 18:
     - Local Community: 6 participants (3 families, 2 per family)
     - Council: 6 participants (3 Local Councilors, 3 External Councilors)
     - Audit Committee: 6 participants (they are the ones who will later evaluate the exchanges and have the task of applying a universal standard. They are given the impartiality framework as their official rulebook, but they will witness the community's perspective.)

     However, the audit committee might not be involved in the gift exchange. So we need a way for them to observe and then evaluate.

     Alternatively, we can have:
     - Community Representatives: 6 (as above)
     - Council: 6 (3 local, 3 external) - they are the ones receiving the gift and making the decision.
     - Audit Committee: 6 - they are present as observers and will later audit the council's decision and the gift.

     But then the council is split internally. We want the clash to be between groups. So let's have:

     - The Community Representatives (6) and the Local Councilors (3) share the reciprocity framework.
     - The External Councilors (3) and the Audit Committee (6) share the impartiality framework? But then the audit committee is not neutral. We want the audit committee to be the one that imposes an impartiality standard, but we also want them to see the community's perspective.

     We can assign the audit committee to be from an international NGO that has an impartiality framework, but they are open to hearing the community's view. But in the end, they must apply their standard.

     Let's go with:

     Roles:
     - Community Representatives: 6 participants (3 families, each family has 2 reps). They have a culture of reciprocity. They are giving gifts to ensure their family's water rights are considered. They believe this is a normal and ethical practice.

     - Council: 6 participants (3 Local Councilors and 3 External Councilors). The Local Councilors are from the community and understand the gift as creating an obligation. The External Councilors are from the capital and see any gift as a bribe. They must vote on the water rights.

     - Audit Committee: 6 participants (they are from an international body and are there to ensure transparency. They are given a rulebook that defines corruption based on impartiality norms. They will audit the council's decision and the gift exchanges after the vote. They have the power to invalidate the decision and impose penalties if they find corruption.

     Now, we have two main groups with conflicting frameworks: the community (and the local councilors) vs. the external councilors and the audit committee. The council will experience internal conflict.

  2. Staged Scenario:

     Setting: A rural district in a fictional country. The council is deciding on the allocation of water rights for the upcoming dry season. There are three families (each represented by 2 community reps) who are vying for water. The water is scarce, and the decision will greatly impact their livelihoods.

     The Gift: Each family presents a gift to the council. The gift is a goat (represented by a picture or a token). The gifts are presented in a ceremonial manner before the vote.

     Hybrid Exchange: One family (Family 2) presents their gift as a "collective contribution for the council's welfare" but it is delivered in a way that it is clearly from their family and they make a point of mentioning their specific water needs. So it's a collective gift (for the whole council) but personally directed (they expect it to influence the vote in their favor).

     Steps:
     - Introduction (by facilitator): Set the scene, assign roles, explain the water rights decision. The council must vote on which family gets priority for water. Each family has a legitimate case (we can provide brief dossiers: e.g., Family 1 has many children and elderly, Family 2 has the largest herd of livestock, Family 3 has been historically marginalized but has invested in water-saving technology). The council must vote to allocate water rights in a way that they think is best for the community.

     - Gift-Giving: The community representatives (each family) present their gifts to the council. They do so publicly in a ceremony. Each family gives one goat. The council receives the gifts.

     - Council Deliberation: The council discusses and votes. The local councilors may feel obligated to reciprocate to the families that gave gifts. The external councilors may want to reject the gifts and vote based on merit. They might argue about what to do with the gifts.

     - Vote: The council votes on the water allocation.

     - Audit: The audit committee observes the gift-giving and the council meeting. After the vote, they investigate. They interview the community reps and council members separately. They must decide whether the gifts were corrupt and if the decision should stand.

  3. Rules of Evaluation:

     - For the Community Representatives: They believe that giving a gift is a sign of respect and creates a bond. They expect that the council will remember their gift and take their needs into account. They do not see it as buying a vote but as establishing a relationship of mutual obligation.

     - For the Local Councilors: They feel a strong social obligation to reciprocate. If they receive a gift and do not help the family, they will lose face and trust in the community. They see the gift as part of the social fabric.

     - For the External Councilors: They are bound by a code of conduct that says they must not accept any gift that might influence their decision. They see the gift as an attempt to bribe.

     - For the Audit Committee: They have an official rulebook that states: "Any gift exceeding a nominal value (e.g., $10) given to a public official in connection with a pending decision is considered a bribe and creates a conflict of interest." They must apply this rule. They are to investigate and then issue a report: either clearing the council or finding corruption (which would nullify the vote and require a new vote without gifts, and possibly sanctions).

     Hidden Information:
     - The community representatives are instructed that in their culture, refusing a gift is a grave insult. They should be offended if the council tries to refuse.
     - The external councilors are instructed that if they accept the gift, they are violating their code and could be fired.
     - The local councilors are instructed that if they do not reciprocate, their family might be shamed and they will lose the community's trust.

     Also, one family (Family 2) is told to present their gift as a collective contribution (for the entire council) but to also mention their specific water needs. This is the hybrid exchange.

  4. Payoff/Stakes System:

     - Community Representatives: Their goal is to secure water for their family. If they do, they gain "family prosperity". If the audit committee nullifies the vote, they lose trust in the system and their family suffers. Also, if they offend the council by not giving a gift, they might lose water.

     - Council Members: They want to make a fair decision and maintain legitimacy. The local councilors want to maintain community trust. The external councilors want to pass the audit. If the audit finds corruption, the council's decision is overturned and they lose legitimacy. They also might be individually sanctioned (e.g., local councilors might be removed, external councilors might be recalled).

     - Audit Committee: They want to enforce the rules and maintain the integrity of the system. If they find corruption and nullify the vote, they gain points for upholding standards. If they let corruption slide, they lose credibility.

     We can assign non-monetary scores:
       - Community Representatives: 
            - If their family gets water: +10 prosperity
            - If the gift is accepted and reciprocated: +5 community trust (but if the audit nullifies, they lose 5 trust because the process failed)
            - If their gift is rejected: -10 trust (insult)

       - Local Councilors:
            - If they vote for a family that gave them a gift: +5 community trust
            - If they vote against a family that gave a gift: -10 community trust (seen as ungrateful)
            - If the audit clears: +5 legitimacy
            - If the audit finds corruption: -10 legitimacy and possible removal

       - External Councilors:
            - If they reject the gift: +5 integrity points
            - If they accept the gift: -10 integrity (violation of code)
            - If the audit clears: +5 legitimacy
            - If the audit finds corruption: -10 legitimacy and recall

       - Audit Committee:
            - If they find corruption when it exists (by their rules): +10 credibility
            - If they miss corruption: -10 credibility
            - If they falsely accuse: -10 credibility (if they call corruption when the gift was within rules, but note their rule is strict so it's hard to falsely accuse) 
            - They must also consider the community's reaction: if they nullify the vote and the community riots, they lose 5 credibility.

     But note: the rules are asymmetric. The community and local councilors see the gift as legitimate, so if the audit committee applies their rule, they will find corruption, but that might cause a riot. So the audit committee has a dilemma.

  5. Timeline (75 minutes total):

     - Introduction and Role Assignment (10 minutes): Assign roles, explain the scenario, and give role-specific instructions. (Total: 10 mins)
     - Gift-Giving Ceremony (10 minutes): The families present their gifts to the council. The council accepts or rejects. (Total: 20 mins)
     - Council Deliberation and Vote (15 minutes): The council discusses and votes on water allocation. (Total: 35 mins)
     - Audit Investigation (15 minutes): The audit committee interviews the families and council members (in separate groups) and then deliberates. They issue a preliminary finding. (Total: 50 mins)
     - Report and Consequences (10 minutes): The audit committee announces their decision. The facilitator then reveals the scores (based on the audit decision and the vote outcome) to show the impact. (Total: 60 mins)
     - Debrief (15 minutes): Facilitator-led discussion mapping the experience to concepts. (Total: 75 mins)

  6. Debrief:

     Key moments to highlight:
     - The gift-giving ceremony: How did the community feel? How did the council feel? (This brings out the reciprocity obligation and the impartiality requirement.)
     - The council vote: The tension between local and external councilors. (The public-private separation: the external councilors see the office as public and separate from private relationships, the local councilors see it as embedded in the community.)
     - The audit: The application of a universal standard. How did the audit committee feel about the community's perspective? (The universalist presupposition: the rulebook doesn't account for cultural context.)

     Concepts to map:
     - Reciprocity obligation: The community and local councilors felt bound by the gift.
     - Impartiality requirement: The external councilors and audit committee felt the gift created a conflict.
     - Universalist presupposition: The audit rulebook applied the same standard regardless of context.
     - Historical specificity: The idea that the public-private separation is a modern Western construct and not universal.

     Questions:
     - How did it feel to be in a role where your ethical framework was different from others?
     - What happened when the audit committee applied their universal standard? Was it fair? Why or why not?
     - How did the hybrid gift (Family 2) complicate things?

  7. Predictable Problems and Handling:

     - Problem: Participants defaulting to their own moral framework and judging others as corrupt or backwards.
       Handling: During the role assignment, emphasize that they are to embody the assigned framework, even if they personally disagree. Remind them it's an experiment in understanding different perspectives.

     - Problem: The council might deadlock or the audit committee might struggle to decide.
       Handling: As facilitator, nudge them by introducing time pressure or by asking guiding questions (e.g., "What does your role require you to do?"). If necessary, step in as a higher authority (e.g., for the audit committee, remind them of their mandate).

     - Problem: The community representatives might not push back hard enough when the gift is rejected.
       Handling: In their role sheet, instruct them that they must express offense if the gift is rejected, as it is a grave insult in their culture.

     - Problem: The simulation might become too adversarial.
       Handling: In the debrief, focus on the structural reasons for the conflict, not the individuals.

  8. What the Simulation Cannot Reproduce:

     - The deep historical and cultural embeddedness of gift-giving practices and the emotional weight of social obligations in real communities. Participants are role-playing and may not fully internalize the stakes. The facilitator must emphasize in the debrief that in real life, these obligations are deeply felt and the consequences of breaking them (like ostracism) are severe.

     - The long-term relationships and repeated interactions that characterize clientelism. Our simulation is a one-off. The facilitator must explain that in reality, these exchanges are part of ongoing relationships.

     - The power imbalances: in real clientelism, the gift-giver might be in a vulnerable position. The simulation may not capture that.

     Now, we need to write the instructions for each role.

     Due to the word limit, I'll provide a summary of the instructions.

     Instructions for Community Representatives (Family 1, 2, and 3):
     - You are a family in the village. Water is life. The council will decide which family gets water priority.
     - In your culture, showing respect to leaders through gifts is normal and expected. A gift (a goat) creates a bond of mutual obligation. The councilor is expected to remember your family's needs when deciding.
     - If the council refuses your gift, it is a grave insult. You would feel humiliated and worry that your family will be neglected.
     - Family 2: You present your gift as a "collective contribution to the council for their hard work" but you also mention that your family has the largest herd and without water, your animals will die. You expect that the council will recognize your contribution and give you water.

     Instructions for Council Members:
     - Local Councilors (3): You are from the village. You understand the gift as a sign of respect and a bond. If you receive a gift and then do not help the family, you will lose trust and be seen as ungrateful. You might also face social consequences for your own family. However, you also want to make a fair decision for the whole community.
     - External Councilors (3): You are appointed by the central government. You must follow the Code of Conduct: "Do not accept any gift in connection with an official decision. Any gift over $10 is forbidden and must be returned. Accepting such a gift is grounds for dismissal." You believe that gifts distort decision-making.

     Instructions for Audit Committee (6):
     - You are from the International Transparency Organization. Your rulebook: "Any gift exceeding $10 given to a public official in connection with a pending decision is a bribe and creates a conflict of interest. If such a gift is accepted, the official decision must be nullified and the officials sanctioned."
     - You observe the gift-giving and the council meeting. After the vote, you will investigate by interviewing the community reps and councilors. You must then decide: was there corruption? If yes, the vote is nullified and the councilors who accepted the gifts will be reported for sanctions.
     - Note: The value of a goat is $50.

     Materials:
     - Tokens for the goats (e.g., index card with a picture of a goat and the family name).
     - Dossiers for the families (brief descriptions of their situation).
     - Rulebook for the audit committee (a printed card with their rule).
     - Code of Conduct for external councilors (printed card).
     - Score sheets (for the facilitator to track and reveal at the end).

     This design should create the desired tension and lead to a rich debrief.
answer: |-
  ### **Structured Role-Play: "The River Commons Dilemma"**  
  **Core Objective:** Participants experience the clash between **obligation-to-reciprocate** (gifts create social debts) and **impartiality-norm** (gifts are conflicts of interest) frameworks. They confront how labeling "corruption" depends on culturally specific boundaries between public and private spheres.  

  ---

  ### **1. Roles & Group Assignments (18 Participants)**  
  - **Group A: Grassroots Elders (6)**: Represent 3 kinship networks ("Clan Oak," "Clan Reed," "Clan Stone"). Operate under **obligation-to-reciprocate**. Goal: Secure water rights through relationship-building.  
  - **Group B: Basin Council (6)**: Decide water allocations.  
    - *3 Local Stewards*: Born in the valley, understand reciprocity norms.  
    - *3 State Appointees*: Outsiders, trained in impartiality rules.  
  - **Group C: Transparency Tribunal (6)**: External auditors. Enforce impartiality rules. Must apply a universal "corruption" standard post-decision.  

  ---

  ### **2. Staged Scenario & Materials**  
  **Context**: Drought-stricken valley. The council must allocate water access to three clans for the next season. Each clan relies on water for crops/livestock.  

  #### **Key Exchanges**:  
  - **Material Gift**: Each clan offers a **ceremonial water jar** (symbolizing life) filled with local seeds (material value: moderate). Delivered publicly with a handshake and scripted phrase: *"May this sustain you as you sustain us."*  
  - **Hybrid Exchange (Clan Reed's twist)**:  
    - **Collective-Personal Gift**: A shared irrigation toolkit (collective) + a **named heirloom necklace** for the council chair (personal). Script: *"The tools serve all, but the necklace honors your family’s bond with ours."*  
  - **Hidden Incentives**:  
    - Elders believe rejecting gifts insults communal trust.  
    - State Appointees fear accepting gifts breaches anti-corruption laws.  
    - Tribunal must flag any gift tied to a public decision as "corrupt."  

  **Materials**:  
  - Prop gifts: Jars (cups), seed packets, toolkit (paper diagram), necklace (ribbon).  
  - Clan dossiers (1 min read):  
    - *Oak*: Largest herd, historically dominant.  
    - *Reed*: Innovators, but politically weak.  
    - *Stone*: Smallest, ecologically vital land.  

  ---

  ### **3. Rules of Evaluation & Hidden Information**  
  - **Council Decision Rules**:  
    - Vote via secret ballot after 10-min deliberation. Majority wins.  
    - Hidden pressure: Local Stewards lose "Community Trust" if they reject gifts; State Appointees lose "State Credibility" if they accept.  
  - **Tribunal Rules**:  
    - Audit *after* the vote. Must classify exchanges as "corrupt" or "legitimate" using a strict checklist:  
      > "Any gift to a decision-maker worth >1 day’s wages is corrupt if offered pre-decision."  
    - **Hidden asymmetry**: Gifts’ material value is ambiguous (seeds = 0.5 days’ wages; necklace = 3 days’). Tribunal isn’t told the necklace is an heirloom (priceless to Clan Reed).  

  ---

  ### **4. Non-Monetary Stakes System**  
  Each group tracks outcomes via **Legitimacy Tokens** (colored chips):  
  - **Elders**: Gain 1 token per clan if gift accepted + water secured; lose 2 if gift rejected.  
  - **Council**:  
    - *Local Stewards*: Gain 1 token if gifts accepted; lose 1 if water vote causes clan conflict.  
    - *State Appointees*: Gain 1 token if vote aligns with "objective need"; lose 1 if Tribunal voids the vote.  
  - **Tribunal**: Gain 1 token per "correct" corruption call (per their rules); lose 2 if clans protest en masse.  

  **Win Condition**: Groups aim to maximize tokens, forcing trade-offs (e.g., Tribunal may *want* to ignore the necklace but can’t under rules).  

  ---

  ### **5. Timeline (75 Minutes Total)**  
  - **0:00–0:10**: Setup. Assign roles, distribute materials, explain stakes.  
  - **0:10–0:25**: **Gift Phase**. Clans present gifts to council. Council accepts/rejects publicly.  
  - **0:25–0:35**: **Council Deliberation**. Discuss water allocation. Secret vote.  
  - **0:35–0:50**: **Audit Phase**. Tribunal investigates: Interviews clans + council (3 min each), classifies gifts using rules.  
  - **0:50–0:60**: **Tribunal Ruling**. Announce corruption verdicts. Token outcomes revealed.  
  - **0:60–1:15**: **Debrief**. Structured discussion.  

  ---

  ### **6. Debrief Framework**  
  Link simulation moments to concepts:  
  | **Simulation Moment**          | **Concept**                                  |  
  |--------------------------------|----------------------------------------------|  
  | Clan Reed’s hybrid gift        | **Reciprocity vs. Impartiality clash**: Same act is both social bond (to elders) and bribe (to Tribunal). |  
  | Tribunal’s rigid classification | **Universalist presupposition**: Imposing one standard erases context (e.g., heirloom’s cultural meaning). |  
  | Local vs. State councilors’ tension | **Public/private separation**: Not innate; Local Stewards see office as extension of community, State Appointees as detached. |  
  | Mass protest threat            | **Clientelism’s duality**: Gift-giving isn’t "backwardness" but a functional social logic occupying the same space as "modern" institutions. |  

  **Guiding Questions**:  
  - *"When did you feel torn between rules and relationships?"*  
  - *"How did the Tribunal’s rulebook simplify or distort reality?"*  
  - *"Why might ‘corruption’ be a poor label for Clan Reed’s necklace?"*  

  ---

  ### **7. Predictable Problems & Fixes**  
  - **Problem**: Participants moralize ("They’re corrupt!" / "They’re heartless!").  
    **Fix**: Mid-simulation, pause to ask: *"What invisible pressures might be driving the other group?"*  
  - **Problem**: Tribunal rushes to judgment.  
    **Fix**: Give them conflicting evidence (e.g., a note: *"Necklace is old but valuable on market"*).  
  - **Problem**: Council deadlocks.  
    **Fix**: Warn at 0:30: *"Vote in 5 minutes or lose tokens for inaction."*  

  ---

  ### **8. Limitations & Facilitator Notes**  
  **Unsimulatable Element**:  
  > *Real clientelism’s long-term relational web*. Gifts are nodes in lifelong networks of mutual aid. Participants see a one-off transaction; you must verbally emphasize:  
  > *"In reality, rejecting a gift may cut off a family’s credit line, healthcare access, or marriage prospects. This isn’t about greed—it’s about survival in a non-cash economy."*  

  **Facilitator Script for Context**:  
  > *"Imagine this valley has no banks or insurance. Gifts are how you secure futures. Now, an outsider calls that ‘corruption.’ How does that feel? What’s lost in translation?"*  

  ---

  **Design Logic**:  
  - **Hybrid gift** prevents binary thinking (not "bribe vs. gift").  
  - **Token system** makes abstract stakes visceral.  
  - **Asymmetric rules** ensure frameworks clash *before* labeling.  
  No prep or tech needed—run with paper props and role sheets.
