  **APPENDIX B: REFUND POLICY FOR CONTINUITY DISPUTES**

  **B.1 Definition:** A "Continuity Dispute" arises when an ontological framework conflict manifests in a clinically or existentially significant outcome regarding implant performance or classification.
  **B.2 Covered Scenarios & Refund Eligibility:**
      *   **B.2.1 Etiological Success / Causal Failure:** Implant possesses valid Etiological Certification (verified lineage) but fails to perform its causal role adequately (e.g., certified heart fails to pump sufficient blood). **Refund:** 80% of implant cost. *Rationale: Proper Function (selected-effect) is confirmed; causal failure is a systems integration issue.*
      *   **B.2.2 Causal Success / Etiological Deficiency:** Implant performs its intended causal role adequately (validated per Causal-Role Protocol) but was denied Etiological Certification or exists under System-Contribution Exception Waiver. Patient experiences distress due to the implant's ontological deficiency (lack of Proper Function per selected-effect). **Refund:** 15% "Ontological Distress Mitigation" credit. *Rationale: Causal efficacy is achieved per chosen pathway; distress stems from theoretical awareness, not service failure.*
      *   **B.2.3 Etiological Failure:** Implant certified via Etiological pathway is found to have fraudulent or insufficient lineage documentation. **Refund:** 100% of certification fee + 50% of implant cost. *Rationale: Fundamental breach of service (invalid certification).*
      *   **B.2.4 Causal Failure:** Implant certified via Causal-Role pathway fails post-implant validation (Section 6.2). **Refund:** 70% of implant cost + full cost of explant procedure. *Rationale: Failure to meet the contracted pathway's criterion.*
  **B.3 Non-Covered Scenario:** **Dual Framework Failure:** An implant simultaneously fails its causal role *and* is found etiologically deficient only qualifies for the higher applicable refund under B.2.1, B.2.2, or B.2.4. Etiological deficiency alone does not compound refunds for causal failure under a Causal-Role certification.
  **B.4 Process:** Continuity Disputes must be filed in writing with the Office of Ontological Reconciliation (OOR-IPFR) within 180 days of implantation or certification invalidation. Supporting documentation per the relevant framework (e.g., telemetry reports for causal failure, phylogenetic audit for etiological deficiency) is mandatory. Decisions by OOR-IPFR are final.

