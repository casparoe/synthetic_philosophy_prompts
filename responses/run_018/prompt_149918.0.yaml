  ## INSTITUTE FOR PROPER FUNCTION RESTORATION (IPFR)
  **PATIENT INTAKE & INFORMED CONSENT PACKET (v.8.7.5)**
  **RE: SYNTHETIC/BIOENGINEERED ORGAN IMPLANTATION**

  **PLEASE READ CAREFULLY BEFORE INITIALING, CHECKING BOXES, OR SIGNING. FAILURE TO COMPLY VOIDS SERVICE AGREEMENT AND ELIGIBILITY FOR REFUNDS (SEE APPENDIX B). CROSS-REFERENCE: IPFR-POL-017 Rev.9 ("Consent & Ontological Alignment").**

  **SECTION 1: PURPOSE OF TREATMENT**
  1.1 The IPFR specializes in the restoration of *Proper Biological Function* through advanced organ implantation (synthetic, bioengineered, or hybrid).
  1.2 "Proper Function" is defined per IPFR Institutional Framework (IPFR-IF-001), which incorporates dual, non-reconcilable assessment protocols:
      *   **A) Etiological Account (Selected-Effect):** Function derives from an organ's history of natural selection. A heart's *Proper Function* is pumping blood *because* this activity conferred a survival advantage on ancestral organisms, leading to its selection (Ref: IPFR-POL-101 "Lineage-Based Function Certification").
      *   **B) Causal-Role Account (System-Contribution):** Function derives from an organ's current causal contribution to systemic viability within the patient's organism. A heart's *Proper Function* is pumping blood *because* this activity currently sustains the patient's circulatory system (Ref: IPFR-POL-102 "Present-Systemic Role Validation").
  1.3 **CRITICAL NOTICE:** IPFR treatment aims to restore function *as defined above*. Success is adjudicated solely against these IPFR-IF-001 criteria, which may diverge from colloquial or clinical understandings of "working." Patient satisfaction metrics are secondary to ontological correctness.

  **SECTION 2: ORGAN SELECTION & CERTIFICATION OVERVIEW**
  2.1 All implantable organs undergo mandatory certification under *one* of the two IPFR-IF-001 frameworks (A or B, Section 1.2). Co-certification is impossible due to inherent theoretical incompatibility (Ref: IPFR-TN-005 "Mutual Exclusivity of Function Ontologies").
  2.2 Your treatment plan and financial liability are contingent upon the certification pathway selected/required for your specific implant(s).

  **SECTION 3: ETIOLOGICAL CERTIFICATION PATHWAY (SELECTED-EFFECT)**
  3.1 Preferred pathway for restoring *Proper Function* defined by evolutionary history.
  3.2 **Applicability:** Mandatory for implants claiming functional equivalence to naturally occurring organs (e.g., hearts, kidneys, livers) unless a System-Contribution Exception is granted (Section 7).

  **SECTION 4: DOCUMENTATION REQUIREMENTS (ETIOLOGICAL PATHWAY)**
  4.1 **Evolutionary Curriculum Vitae (E-CV):** A complete, auditable history of the natural-selection pressures shaping the target organ's structure and activity in the relevant phylogenetic lineage.
  4.2 **HISTORICAL LINEAGE VERIFICATION:**
      *   4.2.1 Patient must provide documented evidence of the target organ's selection history within their species lineage (*Homo sapiens sapiens*), demonstrating that the specific activity the implant is intended to perform (e.g., blood pumping) was the trait *selected for*.
      *   4.2.2 Acceptable evidence includes: Peer-reviewed paleobiological reconstructions, genetic drift analyses correlating organ structure to fitness advantage, fossil record documentation of functional continuity. *Patient self-reported ancestry (e.g., "My ancestors had hearts") is insufficient.*
      *   4.2.3 **NOTE:** An implant that successfully pumps blood *lacks Proper Function* under this pathway if it cannot demonstrate a verifiable history of natural selection *for blood pumping*. Its activity, however effective, is classified as "merely causal" or "accidentally functional" (Ref: IPFR-GL-204 "Accidental Efficacy vs. Proper Function").
      *   `[ ]` **I understand that under Etiological Certification, an implant lacking documented selection history for its intended activity cannot possess Proper Function, regardless of clinical efficacy.**
  4.3 **Synthetic Selection Histories (2029 Brussels Protocol):** For wholly synthetic organs attempting Etiological Certification, a Synthetic Selection History Dossier compliant with the 2029 Brussels Protocol may be submitted for review by the Department of Lineage Simulation (DLS). Approval is discretionary and incurs a non-refundable Simulation Audit Fee (Schedule 3.7a).

  **SECTION 5: CAUSAL-ROLE CERTIFICATION PATHWAY (SYSTEM-CONTRIBUTION)**
  5.1 Alternative pathway for implants deemed necessary for systemic viability but lacking verifiable evolutionary pedigree for the required activity.
  5.2 **Applicability:** Primarily for novel bioengineered organs, complex synthetic systems, or replacements for organs whose original selected-effect function is obsolete or indeterminable (e.g., appendix, certain vestigial structures under review).
  5.3 Focus: Validates that the implant's activity *currently* contributes reliably to maintaining critical systemic parameters (e.g., circulation, filtration, oxygenation) within the *specific patient's organism*.

  **SECTION 6: DOCUMENTATION REQUIREMENTS (CAUSAL-ROLE PATHWAY)**
  6.1 **Real-Time Systemic Integration Plan (RTSIP):** Detailed engineering and physiological modeling demonstrating the implant's proposed causal contribution to the patient's overall viability.
  6.2 **Post-Implant Validation Protocol:** Mandatory 90-day monitoring period with continuous telemetry to verify predicted causal contributions are occurring. Failure to validate results in reclassification and potential refund/removal proceedings (Appendix B).

  **SECTION 7: THE SYSTEM-CONTRIBUTION EXCEPTION & ONTOLOGICAL DRIFT**
  7.1 **EXCEPTION GRANT:** Patients may petition for Causal-Role Certification of an implant *structurally analogous* to a natural organ typically requiring Etiological Certification (e.g., a synthetic heart) if:
      *   7.1.1 Documented failure to obtain Etiological Certification (Section 4).
      *   7.1.2 Demonstrated immediate clinical need outweighing ontological precision concerns (Ref: IPFR-POL-303 "Exigent Circumstances & Functional Pragmatism").
  7.2 **ONTOLOGICAL DRIFT WAIVER (REQUIRED FOR EXCEPTION):**
      *   7.2.1 By selecting the System-Contribution Exception, the patient explicitly acknowledges that the implanted organ, while *functionally adequate* in a causal-role sense, **lacks Proper Function** under the etiological (selected-effect) definition.
      *   7.2.2 The patient further acknowledges the phenomenon of **"Ontological Drift"**: The implanted organ's *ontological status* (its fundamental nature as a functional entity) is contingent upon the theoretical framework applied. Its status may shift if institutional policy or philosophical consensus changes. The implant possesses "function" only contextually, within the Causal-Role framework.
      *   7.2.3 IPFR disclaims responsibility for existential dissonance arising from Ontological Drift or awareness of the implant's etiological deficiency.
      *   `[ ]` **I understand and accept that my implant, certified under System-Contribution Exception, fundamentally lacks Proper Function (Selected-Effect Definition).**
      *   `[ ]` **I understand and accept the inherent instability of its ontological status ("Ontological Drift").**
      *   `[ ]` **I release IPFR from liability related to philosophical dissatisfaction regarding my implant's existential classification.**

  **SECTION 8: NEO-ARISTOTELIAN TELEOLOGY CONSULTANCY MERGER (NATC-IPFR)**
  8.1 Per merger agreement NATC-MRG-001, all IPFR patients are entitled to one (1) complimentary consultation with a NATC "Final Cause Analyst."
  8.2 The Analyst will assess the implant's integration concerning its "inherent purpose" or *telos*, as interpreted through NATC's proprietary blend of Aristotelian metaphysics and modern systems biology.
  8.3 **DISCLAIMER:** NATC assessments are advisory only and **do not supersede** IPFR-IF-001 (Etiological/Causal-Role) for the purposes of certification, warranty, or refund eligibility. NATC *telos* determinations are non-binding and exist in a separate ontological stratum. Conflict between NATC *telos* and IPFR Proper Function does not constitute grounds for dispute (Ref: IPFR-TN-012 "Teleological Irrelevance Clause").

  **SECTION 9: SIGNATURES & ACKNOWLEDGEMENTS**
  9.1 I acknowledge receipt of this packet (v.8.7.5) and have read and understood its contents, particularly the definitions of Proper Function (Section 1.2), the requirements for Etiological Certification (Section 4), the implications of the System-Contribution Exception and Ontological Drift (Section 7), and the Refund Policy for Continuity Disputes (Appendix B).
  9.2 I understand that IPFR prioritizes ontological correctness per its Institutional Framework over conventional clinical outcomes or patient subjective experience.
  9.3 I consent to treatment under the IPFR-IF-001 framework and the specific certification pathway indicated on my Treatment Authorization Form (TAF-IPFR).
  9.4 I release IPFR, its subsidiaries (including NATC-IPFR), and its philosophical advisory board from liability arising from:
      *   Successful organ performance deemed "non-functional" due to etiological deficiency.
      *   Organ failure deemed "functional" under etiological certification due to historical lineage validation despite causal inadequacy.
      *   Existential distress caused by awareness of Ontological Drift or theoretical incompatibility.
      *   Denial of coverage or refunds based strictly on adherence to IPFR-IF-001 criteria.

