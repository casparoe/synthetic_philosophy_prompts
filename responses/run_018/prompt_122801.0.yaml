            However, note: rule 3: we remove 3 I's -> so if we had 3 I's, we remove them and get 0? 
            But wait: if we have 3 I's, then we can replace them with U -> then we have 0 I's? 
            But can we get 3 I's? 
            We start with 1 (mod3=1). 
            Rule 2: 1->2 mod3=2.
            Rule 2 again: 2->4 mod3=1.
            Rule 2 again: 1->2 mod3=2.
            How to get 3? 
            We would need to have 3 mod3=0? But we never have 0 mod3? 
