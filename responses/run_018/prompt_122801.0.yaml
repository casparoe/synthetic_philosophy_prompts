            So we can get 0 I's? No, because we replaced three I's with U -> so we removed three and added one U? 
            But the number of I's goes from 4 to 1? 
            And 4 mod3=1, and 1 mod3=1 -> preserved. 
            But we never get 0 I's? 

            The invariant: the number of I's mod 3 is never 0? 
            And MU has 0 I's -> 0 mod3 -> which is 0, so it's impossible.

     For System B with goal MIII: 
          The number of I's is either 1 (the axiom) or even. 
          MIII has 3 I's -> which is neither 1 nor even -> impossible.

     Then we discuss:
          - How is this proof different from just not finding a derivation?
          - It covers every possible derivation, no matter how long.
          - And it uses a property that is not part of the system.

     Finally, mention Hofstadter and the idea of "jumping out of the system".

