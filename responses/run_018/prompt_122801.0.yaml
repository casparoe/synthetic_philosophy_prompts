  ### Materials List:
  - **Handouts** (printed rules for each system, one per participant)
  - **Three large posters/signs**: "INSIDE", "BESIDE", "ABOVE"  
  - **Table supplies**:  
    - INSIDE table: Paper, pens, whiteboard for writing strings.  
    - BESIDE table: Paper, pens, calculators (for counting properties).  
    - ABOVE table: Paper, pens, large poster for invariant statements.  
  - **Timer** (visible to all).  
  - **Scoring tokens**: Stickers (e.g., gold stars) and a leaderboard (flip chart).  
  - **Overflow task printout** (for fast programmers).  

  ---

  ### Rules Handout (print verbatim):  
  **System A: The MU Puzzle**  
  *Start with:* **MI**  
  *Goal:* **MU**  
  *Rules:*  
  1. If your string ends with **I**, add **U** at the end.  
     - *Example:* **MI** → **MIU**  
  2. If your string starts with **M**, copy everything after **M**.  
     - *Example:* **MI** → **MII**  
  3. Replace **III** with **U** *anywhere* in the string.  
     - *Example:* **MIII** → **MU**  
  4. Remove **UU** *anywhere* in the string.  
     - *Example:* **MIUU** → **MI**  

  **System B: The MIII Puzzle**  
  *Start with:* **MI**  
  *Goal:* **MIII**  
  *Rules:*  
  1. If your string ends with **I**, add **U** at the end.  
  2. If your string starts with **M**, copy everything after **M**.  
  3. Replace **II** with **U** *anywhere* in the string.  
  4. Remove **UU** *anywhere* in the string.  

  *(Note: No hints about invariants, impossibility, or "jumping out.")*  

  ---

  ### Minute-by-Minute Plan (90 mins total):  
  **0–5 mins: Introduction (no theory)**  
  - *Teacher script:* "Here’s System A. Start from MI, use these four rules to reach MU. Work in small groups. You have 20 minutes. Go!"  
  - *Action:* Distribute System A handout. Form groups of 4.  

  **5–25 mins: Grinding Phase (System A)**  
  - Groups work on deriving MU.  
  - At **15 mins (session minute 20)**, reveal scoring:  
    - "New string: 1 sticker. Duplicate strings: 0.  
    - *Hidden bonus (revealed now):* First team to find a property true of *every* string gets 10 stickers. First proof of impossibility gets 20."  
  - *Teacher role:* Circulate, clarify rules, enforce "no meta-talk."  

  **25–30 mins: Introduce System B**  
  - *Teacher script:* "Pause! Did anyone get MU? [No.] Now try System B. Same start, same rules 1, 2, 4. But rule 3 replaces **II** with **U**. Goal is **MU**. You have 5 minutes."  
  - *Action:* Distribute System B handout.  
  - *Gut punch:* Groups get **MU** in 1–2 steps (e.g., MI → MII → MU).  

  **30–35 mins: Twist to MIII in System B**  
  - *Teacher script:* "Great—you got MU! Now, same System B, but new goal: **MIII**. 5 minutes. Go!"  
  - *Action:* Groups fail to get MIII.  

  **35–45 mins: Table Setup & Roles**  
  - *Teacher script:* "Time to change tactics. Some claims are *inside* the system (e.g., 'MI → MII'), some are *beside* it (e.g., 'MII has 2 I’s'), and some are *above* it (e.g., 'All strings start with M'). Move to your assigned table."  
  - Assign roles (enforce strictly):  
    - **INSIDE (4 people)**: Can write derivations/strings. *Banned words: "all," "never," "impossible."*  
    - **BESIDE (6 people)**: Compute properties of *specific* strings (e.g., length, # of I’s). *Banned: Generalizations.*  
    - **ABOVE (6 people)**: State/prove claims about *all* theorems. *Banned: Specific examples.*  
  - *Action:* Groups rotate members to cover all tables.  

  **45–65 mins: Proof Phase**  
  - *Task:* Prove why MU (System A) and MIII (System B) are impossible.  
  - *Teacher hints (as needed):*  
    - *System A:* "Look at the number of I’s. What happens when you apply rule 2? Rule 3?"  
    - *System B:* "How does the number of I’s change? Remember the axiom."  
  - *Scoring:* Award stickers for invariant proposals (e.g., "I-count mod 3 ≠ 0" for A, "I-count = 1 or even" for B).  

  **65–70 mins: Overflow Task (for fast programmers)**  
  - *Printout:* "Write code to generate all theorems up to 10 steps. What’s the shortest path to MIIU in System A? Can you automate invariant checks?"  

  **70–85 mins: Debrief**  
  - *Teacher script/questions:*  
    1. **Invariant surfacing:** "What property did ABOVE table find? How did BESIDE help?" → *Draw out:* "I-count mod 3 ≠ 0" (A), "I-count ≠ 3" (B).  
    2. **Outside vs. inside:** "Is this property in the rules? Can you turn it into a fifth rule?" → *Emphasize:* Invariant uses numbers; rules don’t.  
    3. **Proof structure:** "Why is it true for the axiom? Why do all rules preserve it? Why does MU/MIII break it?"  
    4. **Finite > Infinite:** "How did we settle infinitely many possibilities?"  
    5. **Hofstadter payoff:** "What you did is called *jumping out of the system*. It’s from Gödel, Escher, Bach..."  
    6. **Limitations:** "But sometimes you jump out and find *nothing*, or the system *can* self-reference. That’s when things get wild."  

  ---

  ### Handling Predictable Issues:  
  1. **Illegal moves (e.g., misapplying rules):**  
     - *Prevention:* Rules handout includes examples.  
     - *Intervention:* "Check the example—does your string match the pattern?"  

  2. **Premature "impossible" claims:**  
     - *Prevention:* Scoring rewards discovery, not declarations. Reveal bonuses late.  
     - *Intervention:* "Can you prove it? If not, find more strings."  

  3. **Philosophy-degree guy leaks answer:**  
     - *Prevention:* Assign him to ABOVE table early. Redirect: "Great! Now prove it’s preserved by all rules."  

  4. **Group imbalance (e.g., INSIDE table idle):**  
     - *Intervention:* Rotate roles every 10 mins. Redirect to overflow tasks.  

  5. **Frustration/confusion at tables:**  
     - *Intervention:* Use hint scripts. Clarify role boundaries: "That’s a BESIDE claim—move it there!"  

  ---

  ### What the Activity Fails to Show (Explicitly State in Debrief):  
  - **"Jumping out isn’t always sufficient."** Some systems have no simple invariants, or the invariant is unprovable from outside.  
  - **"Some systems can self-reference."** Complex systems (e.g., math) can model their own properties internally—no "jump" needed.  
  - *Teacher script:* "Today, jumping out worked. But Hofstadter’s point is deeper: When systems *can’t* be fully understood from within, and jumping out *fails*, that’s where incompleteness happens."  

  ---

  ### Bits You Must Supply in Words:  
  1. **The invariant concept:** "A property true initially and preserved by rules is called an *invariant*."  
  2. **Proof structure breakdown:** "True of axiom → preserved by rules → false of goal = impossibility."  
  3. **Outside/inside distinction:** "The proof uses numbers; the rules manipulate symbols. That’s why it’s outside."  
  4. **Limitations:** As above.  

  This plan forces experiential struggle, scaffolds the "jump" via roles/tables, and makes invariants feel earned. The sibling system delivers gut punch, and scoring prevents grinding. Overflow keeps programmers engaged.
