  Hmm, interesting challenge. The core of Hacking's idea is that psychiatric classifications create feedback loops: diagnosing someone changes their behavior and self-perception, which then reinforces the diagnostic category. The user wants this explained in plant breeding terms, with honest notes about what translates cleanly and what gets distorted or lost.

  First I need to identify the key parallels: 
  - Diagnostic categories are like cultivar registrations
