prompt: |-
  hey, i'm writing a piece on the unilateralist's curse -- the problem where any single actor can pull the trigger on geoengineering or an AI release, and the fact that they think they're right dosen't make it okay. every fix i see proposed is either "more democracy" (too slow for fast-moving risks) or "expert panels" (which just pushes the curse up one level).

  i want the full spec for what a normative theory of justified unilateral action under distributed ignorance actually has to deliver. not a bibliography -- i need the desiderata list. the cases it must handle: one actor with genuinely private information, one suffering from overconfidence bias, collective failure via free-riding, and irreversible one-way doors versus reversible pilots. the distinctions it can't blurr: simple ignorance vs. acknowledged error, value disagreement vs. factual disagreement, and acting alone vs. acting with tacit consent. plus whatever consistency conditions come from social-choice logic or basic epistemics -- for each, why it's a hard constraint and not just nice-to-have. then briefly score the usual suspects: prediction markets, expert veto committees, and threshold-based veto norms. which single requirement does the most damage to the popular proposals?

  lead with a one-sentence summary, and put your bottom-line call on the knockout criterion in \answer{...} at the very end.
reasoning: |-
  Okay, the user is writing about the unilateralist's curse and needs a full specification for a normative theory of justified unilateral action. They want a list of desiderata that the theory must fulfill, covering specific cases like private information, overconfidence bias, free-riding, and reversible vs irreversible actions. They also mention important distinctions like ignorance vs acknowledged error, value vs factual disagreements, and acting alone vs with tacit consent. Plus, they want consistency conditions from social choice and epistemology, and an evaluation of popular solutions like prediction markets, expert committees, and veto norms.

  First, I need to unpack the core problem. The unilateralist's curse occurs when a single actor can trigger a global risk, thinking they're right, but their action could be catastrophic if they're wrong. The user is frustrated with existing solutions—democracy being too slow, expert panels just shifting the curse up a level. They need a theory that addresses the gaps in current proposals.

  The user's explicit request is for desiderata—specific requirements the theory must meet. But deeper needs might include practical applicability. They’re writing a piece, so they need a structured framework that’s both theoretically robust and usable for policy or governance. They might also want to highlight why current solutions fail, perhaps to advocate for a novel approach or to critique existing systems.

  Breaking down the cases they mentioned:

  1. **Genuine private information**: An actor has unique data that others lack. The theory must allow action based on this without requiring consensus, but prevent misuse.
  2. **Overconfidence bias**: Actors might overestimate their knowledge. The theory needs safeguards against this.
  3. **Collective failure via free-riding**: When everyone assumes others will act, leading to inaction. The theory should incentivize responsible action without encouraging rash decisions.
  4. **Irreversible vs. reversible actions**: Different thresholds for actions based on reversibility. Reversible pilots might be allowed more easily, while irreversible ones need stricter checks.

  Distinctions to maintain:
  - **Simple ignorance vs. acknowledged error**: Ignorance is not knowing; acknowledged error is knowing you might be wrong. The theory should handle both, perhaps requiring higher certainty for irreversible actions.
  - **Value vs. factual disagreement**: Value conflicts (what’s desirable) vs. factual (what’s true). Solutions for one might not work for the other. Need mechanisms to separate these.
  - **Acting alone vs. tacit consent**: Distinguish between solo actions and those with implicit group approval. Tacit consent might lower the bar for action but requires clear criteria.

  Consistency conditions:
  - **No Dictatorship (Social Choice)**: Avoid concentrating power in one entity. Why it’s hard: Preventing unilateral overrides without consensus, but allowing necessary actions.
  - **Epistemic Non-Arrogance (Epistemics)**: Actors must acknowledge their fallibility. Hard because overconfidence is common; the theory must enforce humility without paralysis.

  Evaluating existing solutions:
  - **Prediction markets**: Aggregate information but fail on value disagreements and irreversible actions. Might not handle private info well if not incentivized.
  - **Expert veto committees**: Risk becoming the new unilateralists. Vulnerable to groupthink or bias, don’t solve the curse shift.
  - **Threshold-based veto norms**: Require multiple actors’ agreement. Could address overconfidence but might be too slow or complex.

  The knockout criterion is likely the **No Dictatorship** condition. If any solution allows a single entity to override without checks, it fails. The user’s bottom line should highlight this as the critical failure point for popular proposals.

  Putting it all together: The desiderata list needs to cover all these aspects, explaining why each is essential. The conclusion should emphasize that existing solutions falter on the no-dictatorship requirement, making them inadequate.
answer: |-
  ### Normative Theory of Justified Unilateral Action: Core Desiderata  
  A viable normative theory must resolve the tension between enabling urgent, informed action to prevent catastrophes and preventing reckless unilateralism, while respecting distributed knowledge and fallibility.  

  #### **Core Cases the Theory Must Resolve**  
  1. **Genuine Private Information**: Enable an actor with unique, verifiable evidence (e.g., sensor data showing imminent ecosystem collapse) to act unilaterally *without requiring consensus*, but with safeguards against fabrication.  
  2. **Overconfidence Bias**: Prevent delusional actors from exploiting the system (e.g., a startup CEO overestimating their AI’s safety).  
  3. **Collective Failure via Free-Riding**: Address scenarios where group inaction guarantees doom (e.g., no one deploys solar geoengineering despite consensus on overheating).  
  4. **Irreversible vs. Reversible Actions**: Assign higher justificatory burdens to irreversible "one-way door" actions (e.g., releasing self-replicating nanobots) versus testable pilots (e.g., temporary aerosol injections).  

  #### **Non-Blurrable Distinctions**  
  - **Simple Ignorance vs. Acknowledged Error**:  
    - *Ignorance*: Acting when unknowns exist but risks are bounded (e.g., limited geoengineering trial).  
    - *Acknowledged Error*: Acting despite known flaws in one’s model (e.g., ignoring peer-reviewed counter-evidence).  
    → *The theory must penalize the latter harshly.*  
  - **Value Disagreement vs. Factual Disagreement**:  
    - *Value* conflicts (e.g., "AI acceleration is worth the risk") cannot be resolved epistemically; unilateral action is illegitimate.  
    - *Factual* disputes (e.g., "This AI has a 0.1% vs. 10% failure chance") require evidence aggregation.  
    → *The theory must quarantine value disputes to democratic processes.*  
  - **Acting Alone vs. Tacit Consent**:  
    - Distinguish solo action (e.g., rogue state deploying geoengineering) from action with implicit group approval (e.g., a scientist acting after consensus conferences fail).  
    → *Tacit consent demands transparent opt-out mechanisms.*  

  #### **Hard Constraints from Logic and Epistemics**  
  5. **No Dictatorship (Social Choice)**:  
     - *Why hard*: Concentrating power in one actor invites abuse. The theory must require *decentralized ratification* (e.g., 3+ independent entities confirming urgency).  
  6. **Epistemic Non-Arrogance (Epistemics)**:  
     - *Why hard*: Unilateral action must incorporate *proven error-correction* (e.g., Bayesian updates from disconfirming evidence). Overconfidence is irreducible; the system must enforce humility.  
  7. **Dynamic Consistency**:  
     - Decisions must remain justifiable as new information emerges (e.g., halting an AI rollout if early signs of misalignment appear).  

  #### **Scoring Popular Solutions**  
  | **Proposal**       | **Genuine Private Info** | **Overconfidence Bias** | **Irreversible Actions** | **Value/Fact Distinction** | **No Dictatorship** |  
  |---------------------|--------------------------|-------------------------|--------------------------|----------------------------|---------------------|  
  | Prediction Markets  | ★★★☆☆ (Good incentives)  | ★☆☆☆☆ (Amplifies bias)  | ★★☆☆☆ (Ignores values)   | ★☆☆☆☆ (Conflates types)    | ★★★☆☆ (Decentralized) |  
  | Expert Veto Panels  | ★★☆☆☆ (Ignores outliers) | ★★☆☆☆ (Groupthink)      | ★★★☆☆ (Case-by-case)     | ★★☆☆☆ (Elite capture)      | ★☆☆☆☆ (New dictators) |  
  | Threshold Veto Norms| ★★★★☆ (e.g., 3/5 approval) | ★★★☆☆ (Dilutes bias)    | ★★★★☆ (Scales thresholds)| ★★☆☆☆ (Values not vetted) | ★★★★☆ (Distributes power) |  

  #### **The Knockout Criterion**  
  The **No Dictatorship** constraint is most damaging to existing proposals: "Expert panels" and veto norms often recreate unilateral power at a higher level, while prediction markets ignore value disagreements and irreversible stakes. Threshold-based veto norms come closest but fail to separate factual and value disputes, risking ethical override by minorities.  

  \answer{**No Dictatorship** is the knockout criterion: any proposal allowing unchecked unilateral override by any entity (individual or panel) collapses into the original curse.}
