answer: |-
  The U.S. intellectual property (IP) scheme reflects a **pragmatic, instrumentalist philosophy** as its core commitment, with **labor-desert and personhood elements operating contextually** within that framework. It presupposes that "owning an idea" is not a natural right but a **state-granted instrumental monopoly**, justified solely by policy goals (innovation/disclosure), with distinct rules tailored to different creative contexts. Here's the reconstruction:

  ### Implicit Theory of "Owning an Idea"
  1. **Ideas Themselves Are Never Owned** (Strict Presupposition):  
     All three regimes deny ownership of abstract ideas. Copyright protects only *expression*, patents protect *specific, useful applications* of ideas (not the underlying principles), and trade secrets protect *information* only if undisclosed. The scheme commits to the principle that **pure ideas, discoveries, or facts remain in the commons**.

  2. **Instrumentalism as the Core Justification** (Strict Presupposition):  
     - **Patents**: Explicitly trade exclusive rights for *disclosure* (20-year monopoly for public revelation). Independent invention is no defense because the system prioritizes incentivizing disclosure over rewarding labor.  
     - **Copyright**: Limited term + idea/expression dichotomy balances creator incentives with public access to ideas. Fair use and independent creation defenses ensure copyright doesn’t stifle follow-on innovation.  
     - **Trade Secrets**: Protection against "misappropriation" (not independent discovery) encourages investment in innovation *without* disclosure, but allows reverse engineering to preserve competition.  
     → Rules strictly presuppose that IP rights exist **only to promote progress** (Art. I, §8, cl. 8 of the U.S. Constitution).

  3. **Labor-Desert as Secondary/Contextual** (Fits Well but Not Required):  
     Labor is acknowledged (e.g., originality in copyright, novelty in patents) but is insufficient alone. Independent creation in copyright and reverse engineering in trade secrets **undercut pure labor-desert**: if labor inherently deserved ownership, independent creators would infringe. Labor-desert is a *rhetorical* fit but not a *logical* foundation.

  4. **Personhood as Marginal/Underdetermined** (Philosophically Optional):  
     Moral rights (e.g., attribution) in copyright hint at personhood, but U.S. law limits these (e.g., no perpetual droit moral). Patents and trade secrets are purely economic. The scheme **does not presuppose personhood**; it’s compatible but not required.

  ### Testing Pure Philosophical Accounts
  **1. Pure Labor-Desert Account (Lockean):**  
     - **Discarded Rule**: Copyright’s independent creation defense.  
       - **Replacement**: Independent creation would infringe copyright. If labor creates ownership, a later author’s identical work would "take" the first’s labor-desert right, regardless of copying.  
     - **Discarded Rule**: Trade secret’s allowance of reverse engineering/independent discovery.  
       - **Replacement**: Reverse engineering or independent rediscovery would infringe, as the labor invested in the secret creates an absolute right.  
     - **Patents**: Largely unchanged, as independent invention already infringes—aligning with labor-desert’s focus on rewarding the inventor’s effort.  

  **2. Pure Personhood Account (Hegelian/Kantian):**  
     - **Discarded Rule**: Trade secret’s allowance of reverse engineering.  
       - **Replacement**: Reverse engineering would infringe. If the secret embodies the creator’s "personhood," copying it—even via reverse engineering—violates selfhood. Independent rediscovery might still be permitted (as it doesn’t "take" the original self-extension).  
     - **Discarded Rule**: Copyright’s idea/expression dichotomy.  
       - **Replacement**: Protection would extend to ideas/themes/plots as "extensions of the author’s self," not just expression.  
     - **Patents**: Could remain, but terms might be perpetual (if the invention is an eternal self-extension), conflicting with current limited terms. Independent invention might still infringe if the invention is viewed as a unique self-expression.

  ### Key Conclusions
  - **Strict Commitments**: Ideas are unownable; rights are instrumental monopolies.  
  - **Instrumentalism Dominates**: The scheme’s variations reflect **contextual cost-benefit analyses**:  
    - *Copyright*: Low-cost independent creation is likely → no infringement.  
    - *Patents*: High R&D costs + easy copying → strong protection even against independents.  
    - *Trade Secrets*: Secrecy as alternative to disclosure → protection only against cheating, not competition.  
  - **Philosophical Hybridity**: Labor-desert and personhood are *rhetorically present* but **subordinated to instrumental goals**. The real commitment is to a **utilitarian calibration** of exclusive rights to maximize societal innovation/access.  

  This structure reveals U.S. IP law as a **policy-driven toolkit**, not a unified philosophical doctrine. Its coherence lies in its adaptability to different innovation ecologies, not in metaphysical consistency.
