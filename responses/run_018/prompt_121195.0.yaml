answer: |-
  ### Map the chain  
  Your argument’s core tension is between **commensurability** (1) and **lexical priority** (3). Steps (1)-(5) show that if pleasure/pain share a scale, lexical priority collapses because huge pleasure *must* numerically outweigh fixed suffering (4→5). Steps (6)-(8) say if they’re incommensurable, lexical ordering lacks justification (7→8). Step (9) extends this to *all* lexical theories. The squeeze is real: (4) and (7) make (3) impossible under either premise. This isn’t equivocation—it’s a valid but brutal dilemma forcing a choice between measurement or lexicality.  

  ### The weak link  
  **Step (4) is the crack.** It assumes commensurability *requires* that any suffering can be arithmetically drowned by sufficient pleasure. But that’s only true if the scale is *unbounded and linear*. If the threshold creates a *qualitative break*—e.g., suffering above the threshold isn’t just "bigger pain" but a *different kind of bad*—then commensurability might hold *within* domains (pain vs. pain, pleasure vs. pleasure) but not *across* the threshold. You’re smuggling in aggregation where the theory forbids it.  

  **Cost of dropping (1)**: You lose precise cardinal measurement. Pain/pleasure become roughly comparable or ordinally ranked near thresholds, but not additively fused. This isn’t "anti-scientific"—it’s acknowledging limits of quantification (e.g., "torture vs. ice cream" isn’t a math problem).  
  **Cost of dropping (3)**: Lexical priority becomes "heavy weighting." A tiny above-threshold suffering *could* be outweighed by galactic pleasure, gutting your NU intuition.  

  ### The overreach check  
  This doesn’t kill *all* lexical theories—just those insisting on full commensurability *and* unbounded scales. **Escape hatch:** Accept *weak commensurability*. Values can be compared ordinally (e.g., "autonomy violations always trump welfare losses") without cardinal sums across domains. For pain/pleasure: above-threshold suffering is *incomparable* to pleasure, not just bigger. You can lexically order them *because* they’re qualitatively distinct, not despite it. Theories like deontology (e.g., "lies > utility gains") do this routinely. Your "orthogonal space" fear only bites if you demand cardinality.  

  ### Bottom line  
  **Ditch strict (1).** Keep ordinal comparability + lexical thresholds. Pain/pleasure share a *rough scale* below the threshold, but above it, suffering enters a "moral emergency" zone where no pleasure can touch it—not because math fails, but because the stakes transform. You save the NU intuition by accepting that some values resist trade-offs *by nature*, not calculation. The cost? You trade "hedonic calculus" for threshold-defined moral categories. Still lets you measure pain, just not cash it in for pleasure at the extremes.
