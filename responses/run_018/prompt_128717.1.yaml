  Here's the scenario and analysis:

  **Scenario:**  
  Claire, a seasoned hospital ward manager, reviews a near-miss incident where junior nurse Sam administered a medication at the wrong time due to the hospital’s new electronic health record system autopopulating an incorrect schedule. Claire knows Sam meticulously followed protocol, but the faulty system overrode it. When pressured by hospital administrators to assign individual blame to "prevent future negligence," Claire firmly defends Sam, presenting log data proving the system error and advocating for a tech review instead. She acts solely out of a clear conviction that blaming Sam would be unjust given the evidence. However, Claire’s commitment to fairness is rigidly confined to her professional role, rooted in decades of hospital disciplinary training. Outside work, she’s habitually dishonest: lying to avoid social commitments, falsely claiming refunds from small businesses, and ignoring pleas from a homeless neighbor—actions she dismisses without ethical reflection.

  **Analysis:**  

  1.  **Verdicts & Reasoning:**
      *   **Right-Reasons View:** Claire *is* morally worthy for shielding Sam. She correctly identified the actual justification for her action—**fairness** (it was objectively wrong to blame Sam for the system failure) and acted *because* she grasped this reason. Her motive wasn't personal gain, malice, or blind rule-following, but a genuine understanding of fairness in this context.
      *   **Integrated Virtue View:** Claire is *not* morally worthy. While her action was correct and arose from correct reasoning *in this instance*, it did not stem from a stable, integrated virtuous character. Her fairness is a **compartmentalized professional habit**, activated solely by workplace triggers ("disciplinary training"). Her pervasive dishonesty and callousness outside work reveal a profound lack of the unified virtue (justice/honesty/compassion) that would make her professional action a true expression of her character. The action is right, but *she* isn't praiseworthy for it.

  2.  **Feature Doing the Work:**  
      The key feature is **compartmentalization of moral reasoning**. The Right-Reasons view focuses only on the *quality of the reasoning and motive in the specific act*, which was correct (fairness). The Integrated Virtue view focuses on whether that reasoning reflects the agent's *overall character*, which it does not – it's an isolated, context-dependent fragment.

  3.  **Removing Compartmentalization:**  
      If Claire's commitment to fairness was **integrated** – meaning she consistently recognized and acted on reasons of fairness, honesty, and compassion both professionally *and* personally – then *both views would likely agree she is morally worthy* for shielding Sam. The Right-Reasons view still sees the correct reasoning in the act. The Integrated Virtue view now sees the act as genuinely expressing her virtuous character.

  4.  **Virtue Ethicist's Non-Question-Begging Attack:**  
      A virtue ethicist argues Claire lacks worth *without* simply asserting "she's not virtuous." They would point to the **lack of consistency and harmony in her character traits**. True virtue (like justice) isn't just knowing the right rule in one context; it's a **reliable disposition** to perceive, reason about, and act on relevant moral reasons across diverse situations. Claire's fairness at work is brittle and isolated, contradicted by her habitual vices elsewhere. This fragmentation means her professional action, however correct, is more akin to a trained reflex or role-play than an expression of *her* moral self. Her character lacks the integrity where virtues support and inform each other, making the single "fair" action an anomaly, not a reliable indicator of her moral worth. The *source* of her action (conditioned habit) matters as much as the action itself for assessing the *agent's* praiseworthiness.
