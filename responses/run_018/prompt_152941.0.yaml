answer: |-
  ### **Relational Personhood: Care, Obligation, and the Self**
  **90-Minute Seminar Plan for 12 Students**  
  **Core Tension:** Ontological claim (personhood is *constituted* through reciprocal relations) vs. normative claim (relations generate *obligations of care*).  
  **Scenario:** Asymmetric, state-mediated caregiving for **Alex** (adult with severe cognitive disabilities). **Sam** is Alex’s sole long-term caregiver and primary relational anchor. State compensation ($15/hour) and institutional scheduling exist but don’t replace the personal bond.  
  **Scarce Resource:** **10 hours of respite care per week** (currently, Sam receives 5 hours; needs 15 more to avoid burnout). The 10 hours must be allocated as a single block to one claimant.  

  ---

  ### **Roles (Assign 4 Students; Others Observe & Rotate in Debrief)**  
  1. **Sam (Caregiver):**  
     - **Principle:** *Relationships create moral obligations.*  
     - **Stance:** Respite must go to Alex’s case. Without Sam, Alex’s personhood dissolves. Sam’s burnout = Alex’s collapse.  
     - **Goal:** Defend the *relational ontology*: Alex exists *through* Sam’s care.  

  2. **Case Manager (State Institution):**  
     - **Principle:** *Efficiency and impartial fairness.*  
     - **Stance:** Respite must go to the claimant who benefits the most people. Alex is one of many; the system must optimize.  
     - **Goal:** Uphold bureaucratic neutrality. Prioritize quantitative impact (e.g., hours/person).  

  3. **Taylor (Alex’s Sibling):**  
     - **Principle:** *Inherent individual rights.*  
     - **Stance:** Respite is Alex’s entitlement, *independent* of Sam. Alex’s rights shouldn’t depend on Sam’s endurance.  
     - **Goal:** Treat Alex as a bounded individual with state-guaranteed rights.  

  4. **Jordan (Disability Advocate):**  
     - **Principle:** *Personhood is relationally constituted.*  
     - **Stance:** Respite must preserve Sam’s role. Removing Sam destroys Alex’s identity. No relationship = no personhood.  
     - **Goal:** Argue Alex has *no freestanding identity* outside the Sam-Alex bond.  

  ---

  ### **Rules of Deliberation**  
  - **Unanimous Agreement Required:** Consensus on *both* the allocation outcome *and* the **justifying principle**. No compromise without shared grounds.  
  - **Defend Principles, Not Preferences:** Roles must root arguments in their assigned principle. No bargaining (e.g., “split the hours”).  
  - **Time Pressure:** 25-minute strict deadline.  
  - **Payoff Mechanism (Incommensurable Values):**  
    - **Relational Preservation:** Success = Alex’s personhood stability (Sam stays).  
    - **Institutional Efficiency:** Success = aggregate hours distributed (e.g., more people served).  
    - *No trade-offs allowed*: Groups can’t merge scales (e.g., “lose efficiency to save the relationship”).  

  ---

  ### **Seminar Structure**  
  **Total Time: 90 Minutes**  

  #### **Phase 1: Mapping Relationships (15 min)**  
  - **Task:** As a group, diagram Alex’s relational world (whiteboard or large paper).  
    - Include: Alex, Sam, state, Taylor, Jordan, and societal institutions.  
    - Label bonds (e.g., “Sam’s care: constitutive?”; “State: mediator?”; “Taylor: rights-based?”).  
  - **Goal:** Visualize ontological claims (how relations *constitute* Alex) vs. normative claims (obligations generated).  
  - **Checkpoint (5 min):** Identify one tension between *constitution* and *obligation* in the diagram.  

  #### **Phase 2: Resource Allocation (25 min)**  
  - **Scenario:** 10 respite hours available. Four claimants:  
    1. **Alex/Sam** (prevent Sam’s burnout → preserve Alex’s personhood).  
    2. **Group Home A** (efficiency: serves 4 residents with 2 hours each).  
    3. **New Parent Respite Program** (fairness: aids 5 overworked parents).  
    4. **Emergency Case** (crisis: caregiver hospitalized).  
  - **Task:** Assign the 10-hour block via unanimous consensus on principle.  
  - **Predictable Failure:** Groups default to liberal rights-language (e.g., “Alex deserves it as an individual”). *Facilitator intervention:*  
    - Ask: “If Alex has inherent rights, why does their identity vanish if Sam leaves?”  
    - Challenge: “Does treating Alex as ‘independent’ erase the role of Sam’s care?”  

  #### **Phase 3: Discovery (10 min)**  
  - **Facilitator-Led Reveal:**  
    1. **If Alex treated as a bounded individual (e.g., allocation based on rights):**  
       - *Problem:* Ignores that Alex’s identity *requires* Sam’s presence. Rights alone don’t sustain personhood.  
    2. **If Alex treated as relationally constituted (e.g., allocation to Sam):**  
       - *Problem:* Erases Alex’s independent claims. If Sam quits, Alex loses moral standing.  
  - **Key Insight:** Both approaches fail. The tension is unavoidable.  

  #### **Debrief (35 min)**  
  1. **Map Phases to Claims (10 min):**  
     - *Phase 1 (Mapping):* **Ontological focus** (relations as constitutive).  
     - *Phase 2 (Allocation):* **Normative focus** (obligations from relations) → exposed tension.  
     - *Phase 3 (Discovery):* **Collision** of ontology and normativity.  

  2. **Identify Felt Conflict (5 min):**  
     - “When did you feel stuck between *preserving Alex’s identity* and *fulfilling obligations*?” (Often during allocation votes).  

  3. **Ubuntu Distortion (10 min):**  
     - **Classic Ubuntu:** Mutual, community-embedded reciprocity.  
     - **Scenario Distortions:**  
       - *Dyadic:* Only Sam ↔ Alex (no community buffer).  
       - *Asymmetric:* Sam gives care; Alex cannot reciprocate.  
       - *State-Mediated:* Institutions depersonalize obligations.  
     - **Result:** Ubuntu’s mutuality is impossible here → obligations feel burdensome, not reciprocal.  

  4. **Ontological Gap (5 min):**  
     - **Visceral but Incomplete:** The activity shows *dependence* (Alex on Sam) but not **mutual co-constitution**.  
     - **Facilitator Note:** “Sam is also *constituted* by caring for Alex (e.g., ‘caregiver’ identity), but the scenario’s asymmetry obscures this. Real relational personhood is a two-way process we’ve simplified.”  

  5. **Group Reflection (5 min):**  
     - “How would this change if Alex’s care involved a *network* of relations?”  

  #### **Timeline**  
  - 0-5 min: Introduction (scenario, roles, rules).  
  - 5-20 min: Phase 1 (Mapping).  
  - 20-45 min: Phase 2 (Allocation).  
  - 45-55 min: Phase 3 (Discovery).  
  - 55-90 min: Debrief.  

  ---

  ### **Facilitator Notes**  
  - **Predictable Failure:** Groups will initially resolve the tension via rights-language (“Alex deserves it”). *Intervene* by role-playing:  
    > Jordan (Advocate): “If Sam leaves, who is ‘Alex’? Without their bond, is Alex still *Alex*?”  
    > Case Manager: “But if we only prioritize Sam, what about others’ rights?”  
  - **Avoid Lecturing:** Use Socratic questions.  
  - **Honest Admission:** The activity *cannot* simulate mutual co-constitution fully. Verbally clarify:  
    > “In real relational personhood, Sam’s self is *also* shaped by Alex—but this scenario’s pressure makes Sam’s role feel instrumental. That’s a limitation of the design.”  

  This structure forces students to *experience* the ontology/normativity conflict before labeling it, ensuring the tension in relational personhood is felt, not just abstractly debated.
