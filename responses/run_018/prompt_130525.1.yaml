  This word took hold; it framed the scattered ache,
  Prompting self-surveillance, a feedback **loop**.

  Users began to track each fractured **loop**,
  Reifying the newly minted **label**.
  They noted focus lost as mental ache
  Intensified – the expected **behaviour**.
  They matched the draft's evolving **manual**,
  A self-fulfilling prophecy of mind.

  The scattered **behaviour**, shaped by the shared mind,
  Now showed new patterns in the growing **loop**.
  The draft required a swift **revision**,
  To capture shifts beneath the weighty **label**.
  The updated text described the coping **behaviour**:
  Avoidance, guilt – the diagnostic ache.

  It wasn't just exhaustion, this strange **ache**,
  But knowing *how* the fractured state should feel in **mind**.
  The text prescribed the sanctioned **behaviour**,
  Which amplified the tightening **loop**.
  Each conscious check confirmed the **label**,
  Demanding yet another **revision**.

  The committee met for fresh **revision**,
  Documenting this distinctive **ache**.
  The classified and conscious **patient**,
  Trapped by the language in their own **mind**,
  Observed themselves within the diagnostic **loop**,
  Performing to the script: the **behaviour**.

  Thus, the documented **behaviour**,
  Shaped by the latest handbook **revision**,
  Deepens the self-entangling **loop**.
  It names the cost, yet feeds the **ache**.
  The **patient**, bound within the shared **mind**,
  Seeks solace in the constricting **label**.

  This **behaviour**, born of **revision**,
  **Patient** mirrors text in weary **mind**.
  The **label** spins the tightening **loop**... ache...

  *(Envoi)*
  The **manual** tracks the shifting **behaviour**,
