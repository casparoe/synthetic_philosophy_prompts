  ### Addressing Tensions
  - **Cases 1 vs. 5**: Resolved by **Risk-Sensitive Wrongness**. Both violate Harm Avoidance, but Case 5's wrongness is mitigated by uncertainty and foregone benefits, matching your "distinct moral texture."  
  - **Case 6**: **Rescue Priority** explains your uncertainty: No severe harm exists, so creating a new being (above T) is permitted despite opportunity costs.  
  - **Case 7**: The biological/non-biological distinction in the **Sufficientarian Threshold** aligns with your verdicts.  

  This principle systematizes your intuitions while highlighting that **context-dependent thresholds** (biological vs. non-biological, risk vs. certainty) are essential to your asymmetry. If you reject these distinctions, the principle collapses, and you may need to abandon one of the conflicting verdicts (e.g., Case 4 or Case 7).
