answer: |-
  Here’s a decision tree taxonomy focused on the **core institutional purpose** of marriage, sorted by concrete claims about its social function. Positions blur where noted.

  ---

  ### Marriage Taxonomy: Institutional Purpose  
  **Start Here:**  
  **1. Does marriage require a *unique social purpose* to justify state recognition?**  
  - **If NO → Go to Position A**  
  - **IF YES → What is that essential purpose?**  

  **Branch 1: Essential Purpose = Biological Parenting & Child-Rearing**  
  *(Claim: "Stable biological co-parenting is marriage’s irreplaceable social function.")*  
  → **Position B: Conjugal View**  
  *Awkward commitment: "Same-sex couples inherently cannot fulfill marriage’s core purpose, even if they raise children."*  

  **Branch 2: Essential Purpose = Romantic/Companionate Bonding**  
  *(Claim: "Marriage exists to publicly affirm and support lifelong romantic attachment between adults.")*  
  → **Position C: Revisionist Companionate View**  
  *Awkward commitment: "Same-sex couples are equally capable of the bond, but marriage *must* exclude non-romantic partnerships (e.g., close friends)."*  

  **Branch 3: Essential Purpose = Economic/Contractual Pooling**  
  *(Claim: "Marriage is fundamentally a state-regulated contract for mutual economic support and risk-sharing.")*  
  → **Position D: Libertarian Contract View**  
  *Awkward commitment: "Same-sex couples qualify, but the state should not privilege romantic/sexual bonds over other interdependent contracts (e.g., siblings)."*  

  **Branch 4: Essential Purpose = Kinship/Alliance Merging**  
  *(Claim: "Marriage primarily creates or strengthens ties between families/communities.")*  
  → **Position E: Kinship-Alliance View**  
  *Awkward commitment: "Same-sex couples can serve this function, but marriage loses meaning if it prioritizes individual choice over family/community interests."*  

  **Branch from "NO" (Position A):**  
  → **Position A: Abolitionist/Privatization View**  
  *Awkward commitment: "Advocating for same-sex marriage legitimizes state interference in personal relationships."*  

  **Combination Position (Blurs Companionate + Contract):**  
  *(Claim: "Marriage’s purpose is *both* lifelong romantic commitment *and* economic partnership.")*  
  → **Position F: Hybrid Companionate-Contract View**  
  *Awkward commitment: "Same-sex couples fit, but marriage becomes incoherent if romantic bonds lack economic intent or vice versa."*  

  ---

  ### Blurred Distinctions & Notes  
  - **Contract (D) vs. Abolitionist (A):** Both oppose state privileging of specific bonds. *Contractarians* still want state-recognized contracts for all; *Abolitionists* reject state roles entirely.  
  - **Kinship-Alliance (E)** is distinct but rare in modern discourse; often merges with Conjugal (B) in traditional contexts.  
  - **Hybrid (F)** is common but logically unstable if romance/economic aims conflict.  
  - **Tree forces separations** that real-world views may combine (e.g., someone could hold B+C).  

  ### Final Positions (7 Leaves):  
  | **Position**                 | **Core Claim**                                                                 |  
  |------------------------------|--------------------------------------------------------------------------------|  
  | **A. Abolitionist**          | State should not recognize *any* marriage.                                     |  
  | **B. Conjugal**              | Marriage exists for biological parenting stability.                            |  
  | **C. Revisionist Companionate** | Marriage exists to support lifelong romantic bonds.                          |  
  | **D. Libertarian Contract**  | Marriage is a state-enforced economic contract.                                |  
  | **E. Kinship-Alliance**      | Marriage merges families/communities, not just individuals.                    |  
  | **F. Hybrid Companionate-Contract** | Marriage requires *both* romance and economics.                     |
