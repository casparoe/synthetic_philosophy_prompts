prompt: |-
  I work as the curriculum and ethics chair at a small design institute, and about twice a semester we get into these messy disputes where a student or alumni uses a compositional method they picked up from a professor's unpublished workshop notes — like a specific way of layering translucent glazes to create depth, or a mental heuristic for arranging negative space — and then licenses the result commercially. The professor claims they "stole my idea," but the student says they just learned a technique, like learning a receipe. I need a decision procedre my three-person review panel can actually run in under an hour, grounded in whatever philosophy of property actually says about owning ideas versus expressions, with clear steps: what to ask in order, what counts as a sufficient answer, where we stop with a no, where we hand it off because it's a values call rather than a fact, and where we escalate to legal because it's actually contract breach not philosophy.

  The procedre should handle the hard cases: techniques that are partly functional and partly expressive, ideas that only really work in one specific medium, and cases where the professor never wrote anything down but taught it orally in a closed session. Then apply it to three scenarios: (1) the glaze-layering technique I mentioned, used in a ceramic line sold nationally; (2) a student who takes the professor's unpublished negative-space heuristic — basically a mental checklist — and builds an entire branding agency around it; and (3) a case where the student literally copied the professor's handwritten workshop notes and sold them as a "masterclass PDF," but claims they only copied the ideas inside, not the expressive form of the notes. I especially want the procedre to flag where it'll misfire, like when a technique is so tightly bound to one person's style that separating idea from expression is practically impossible, and I want one of those three applications to come out supporting the student in a way the professor will hate but the logic demands anyway. Keep it practical: we don't have lawyers on the panel, just educators, and we need to sign off or escalate within 48 hours.
reasoning: |-
  We are designing a decision procedure for disputes about whether a student/alumni has improperly used a professor's unpublished technique. The procedure must be grounded in the philosophy of intellectual property, specifically the idea-expression dichotomy (ideas are not protected, only their specific expression is) and consider functionality. It should also account for cases where the technique is taught orally or in unpublished notes.

  Key principles:
  1. **Idea vs. Expression**: Copyright protects the expression of an idea, not the idea itself. Techniques, methods, systems, and processes are generally not protected by copyright (see 17 U.S.C. § 102(b)). However, if the technique is described in a fixed, tangible form (like written notes), that description is protected as a literary work. But the underlying method is still free for others to use.
  2. **Functionality**: If a technique is primarily functional, it may not be protected by copyright. Copyright does not extend to any "procedure, process, system, method of operation, concept, principle, or discovery" (17 U.S.C. § 102(b)).
  3. **Trade Secret**: If the technique was taught in confidence (e.g., in a closed session with an expectation of confidentiality) and has commercial value, it might be protected as a trade secret. But the burden is on the professor to show that they took reasonable steps to keep it secret.
  4. **Contract**: If there was a specific agreement (e.g., a non-disclosure agreement or an explicit policy) that the students agreed to, then breach of contract might apply.

  The procedure must be run by a three-person panel of educators (not lawyers) in under an hour and provide a clear outcome: either dismiss the claim, find for the professor (and then escalate to legal for contract breach or other remedies), or note that it's a values call (where the panel might recommend mediation or policy change).

  **Decision Procedure Steps**:

  1. **Initial Triage (5 minutes)**:
     - Check if there is a written policy at the institute regarding ownership of teaching materials or techniques. If yes, and if the policy clearly addresses the situation, apply the policy and stop (escalate to legal if breach is alleged).
     - Check if there was a specific contract (e.g., NDA) between the professor and the student. If yes, and the claim is about breach, escalate to legal.

  2. **Idea-Expression Dichotomy Test (20 minutes)**:
     - Ask the professor: "Can you describe the technique in your own words? Is the technique a functional process or an expressive style?"
     - Ask the student: "How did you learn the technique? Did you copy any fixed expression (like exact written notes, diagrams, etc.) or did you use the method as you understood it?"
     - **Panel analysis**:
       - If the technique is purely functional (e.g., a step-by-step method to achieve a physical effect, like layering glazes in a specific order for a ceramic result), then it is an idea/process and not protected. The student is free to use it. Stop here and dismiss the claim.
       - If the technique is primarily expressive (e.g., a unique artistic style that is highly personal and recognizable), then we need to check if the student copied the expression (the specific way the professor taught it, such as exact words, diagrams) or just the idea (the general concept).
       - If the technique is a mix of functional and expressive, focus on whether the student copied the expression (fixed form) or only the idea (the functional core).

  3. **Fixed Form and Copying Test (15 minutes)**:
     - If the technique was written down (notes, handouts, etc.):
       - Ask the professor to provide the original fixed expression (the notes).
       - Compare the student's work (if it's a reproduction of the notes) or the student's description of the technique with the professor's notes.
       - If the student copied the exact expression (verbatim text, specific illustrations, etc.), then copyright infringement might be at issue (but note: the underlying method is still free). This step is only about the expression. If the student sold the notes as a PDF, that's clearly copying expression. However, if the student used the method without copying the expression, then it's not infringement.
     - If the technique was taught orally and never fixed:
       - Copyright does not protect unfixed works. The professor has no copyright claim. However, consider trade secret.

  4. **Confidentiality and Trade Secret Test (10 minutes)**:
     - Ask the professor: "Was the technique taught in a context where confidentiality was expected? (e.g., a closed workshop with a confidentiality agreement, or a course marked as confidential?)"
     - Ask the student: "Were you aware of any expectation of confidentiality?"
     - Check institute policies: Is there a general expectation of confidentiality for workshop notes or special sessions?
     - **Panel analysis**:
       - If the professor cannot show that reasonable steps were taken to maintain secrecy (e.g., no confidentiality notice, no agreement, not treated as secret), then trade secret protection does not apply.
       - If the professor can show that it was confidential and the student knew, then it might be a trade secret violation. But note: trade secret law requires that the information derives economic value from being secret and that reasonable efforts were made to keep it secret. If these are met, escalate to legal.

  5. **Values Call (5 minutes)**:
     - If the panel determines that the issue is not about legal rights (no copyright, no trade secret, no contract) but about academic ethics (e.g., the professor feels the student should have given credit, or the use is seen as exploitative), then note it as a "values call". The panel cannot force a legal outcome but might recommend mediation or a policy discussion.

  6. **Outcome and Escalation (5 minutes)**:
     - **Dismiss**: If no legal grounds and no values call needed (student clearly used only the idea, not expression, and no confidentiality breach).
     - **Escalate to Legal**: If there is evidence of potential contract breach, copyright infringement (copying of expression), or trade secret violation.
     - **Values Call**: If the panel feels the issue is about academic norms (e.g., attribution, fairness) but not illegal, then recommend non-legal resolution (e.g., mediation, institute policy review).

  **Flagged Areas for Misfires**:
  - **Style-bound techniques**: If a technique is so intertwined with a professor's unique artistic style that separating idea from expression is nearly impossible, the panel might be tempted to protect it. However, the law still requires a fixed expression. Without that, it's just an idea. This might lead to a values call.
  - **Oral teachings**: Without fixation, copyright doesn't apply. Trade secret is the only hope, but it requires proof of confidentiality measures.

  **Apply to Scenarios**:

  1. **Glaze-Layering Technique**:
     - **Procedure**:
       - Triage: No policy or contract mentioned.
       - Idea-Expression: The layering technique is functional (to create depth in ceramics). It's a process. Not protected by copyright.
       - Fixed Form: The professor had unpublished notes. But the student used the method, not the notes. No evidence the student copied the expression (the notes).
       - Confidentiality: The workshop was closed, but no evidence of confidentiality agreement or notice. Trade secret unlikely.
       - **Outcome**: Dismiss. The student used an idea/process. The professor might hate this, but the logic demands it.

  2. **Negative-Space Heuristic (Mental Checklist)**:
     - **Procedure**:
       - Triage: No policy or contract.
       - Idea-Expression: A heuristic (mental checklist) is a method or system. Functional (for arranging negative space) and not expressive. Thus, not copyrightable.
       - Fixed Form: Unpublished notes, but the student built an agency using the method, not copying the expression (the notes). The heuristic itself is an idea.
       - Confidentiality: Closed session, but again, no confidentiality measures shown.
       - **Outcome**: Dismiss. The student used an idea. But note: if the professor's notes were copied (e.g., the exact wording of the checklist), then that expression might be protected. But the scenario says the student built an agency around the heuristic, not that they copied the notes. So the method is free to use.

  3. **Copied Handwritten Notes Sold as PDF**:
     - **Procedure**:
       - Triage: No policy or contract mentioned, but the act is copying and selling the notes.
       - Idea-Expression: The notes are a fixed expression. The ideas within are not protected, but the specific arrangement and wording are.
       - Fixed Form and Copying: The student copied the notes (the expression) and sold them. This is clear copyright infringement of the literary work (the notes). The student's claim that they only copied the ideas is false because they copied the expression (the notes themselves).
       - Confidentiality: Might be relevant, but copyright infringement is clear.
       - **Outcome**: Escalate to legal for copyright infringement.

  **One Scenario Supporting the Student**: In scenario 1 (glaze-layering) and 2 (negative-space), the decision goes for the student. The professor will hate it in scenario 2 because the student built an entire agency around the heuristic, but the logic (idea vs. expression) demands it.

  **Final Note**: The panel should document the reasoning and be prepared for appeals. They should also recommend that the institute develop clear policies on workshop materials and confidentiality to avoid future disputes.
answer: |-
  Below is a practical, step-by-step decision procedure for your 3-person review panel, grounded in intellectual property (IP) philosophy (primarily copyright law's idea-expression dichotomy and trade secret principles). It's designed to be run in **under 60 minutes**, with clear thresholds for dismissal, escalation, or values-based referrals. The procedure prioritizes **key legal distinctions**:  
  - **Ideas/methods** (not ownable) vs. **expressions** (ownable if fixed in tangible form).  
  - **Functional techniques** (rarely protected) vs. **expressive styles** (potentially protected).  
  - **Confidentiality expectations** (may trigger trade secret claims).  

  **Decision Procedure: "IDEAS Framework"**  
  *(Intention, Dichotomy, Expression, Analysis, Solution)*  
  **Time Allocation**: 5–7 min per step. Use a shared template for consistency.  

  ---

  ### **Step 1: Intention Check** (5 min)  
  **Question Sequence**:  
  1. "Was there a formal agreement (e.g., NDA, course syllabus, institute policy) governing use of this technique?"  
  2. "Did the professor clearly communicate restrictions (e.g., 'do not commercialize this')?"  
  3. "Did the student/alumni know about these restrictions?"  

  **Thresholds**:  
  - **Sufficient Answer**: Written policy or explicit verbal warning + evidence student knew (e.g., email, witness).  
  - **Stop & Escalate to Legal**: If "yes" to all three → **Contract breach suspected**. Hand off to legal.  
  - **Proceed to Step 2**: If no agreement/communication, or ambiguity.  

  ---

  ### **Step 2: Idea-Expression Dichotomy Test** (15 min)  
  **Question Sequence**:  
  1. **To Professor**: "Describe the technique. Is it primarily **functional** (e.g., achieves a technical result like ceramic durability) or **expressive** (e.g., reflects your personal artistic style)?"  
  2. **To Student**: "How did you learn this? Did you copy exact words/images or internalize a general method?"  
  3. **Panel Analysis**:  
     - Apply **§102(b) of U.S. Copyright Act**: Methods, systems, procedures are unprotectable "ideas." Only unique expressions (e.g., specific wording, diagrams) are protected.  
     - Use **"Merger Doctrine"**: If the technique only has one/few ways to be expressed (e.g., a glaze formula), idea and expression merge → no copyright.  
     - **Functionality Test**: Highly functional techniques (e.g., steps to arrange negative space) are rarely protected.  

  **Thresholds**:  
  - **Stop & Dismiss**: Technique is purely functional/general method (e.g., "use 3 glaze layers for depth"). Student wins.  
  - **Proceed to Step 3**: If expressive elements exist (e.g., poetic descriptions, unique diagrams).  

  **Flag for Misfires**:  
  - If the technique is **inextricably tied to professor's style** (e.g., a painting method that always produces work resembling the professor's), separating idea/expression may be impossible. → Proceed to Step 4 but note high risk of "values call."  

  ---

  ### **Step 3: Expression Fixation & Copying Test** (15 min)  
  **Question Sequence**:  
  1. **To Professor**: "Is the technique fixed in tangible form (e.g., notes, video)? If oral, was it recorded/written later?"  
  2. **To Student**: "Did you reproduce the professor's exact expression (e.g., copied text, diagrams) or just the concept?"  
  3. **Panel Analysis**:  
     - **Copyright requires fixation**: Unrecorded oral teachings are unprotected ideas (*unless trade secret applies*).  
     - **Substantial Similarity Test**: Compare student's work with professor's materials.  
       - Did the student copy **verbatim text**? → Likely infringement.  
       - Did they use only the **underlying method**? → Not infringement.  

  **Thresholds**:  
  - **Stop & Dismiss**: No fixation OR student used only ideas (e.g., internalized heuristic). Student wins.  
  - **Escalate to Legal**: Exact copying of fixed expression (e.g., selling notes as PDF).  
  - **Proceed to Step 4**: If fixation exists but copying is ambiguous.  

  ---

  ### **Step 4: Confidentiality & Trade Secret Analysis** (10 min)  
  **Question Sequence**:  
  1. **To Professor**: "Was the technique taught in a confidential setting (e.g., closed workshop with non-disclosure)? How did you safeguard secrecy?"  
  2. **To Student**: "Were you aware of confidentiality expectations?"  
  3. **Panel Analysis**:  
     - **Trade Secret Requirements**: (1) Confidential info, (2) economic value from secrecy, (3) reasonable efforts to protect it (e.g., locked notes, NDAs).  
     - **Institute Policy Check**: Does your school have rules for workshop confidentiality?  

  **Thresholds**:  
  - **Stop & Dismiss**: No secrecy measures (e.g., open class, no NDAs) → Not a trade secret.  
  - **Escalate to Legal**: Evidence of confidentiality + commercial use → Potential trade secret violation.  

  ---

  ### **Step 5: Solution & Handoff** (5 min)  
  **Panel Decision Tree**:  
  - **Dismiss Claim**: No contract, no expression copied, no trade secret. Student’s use is permissible.  
  - **Escalate to Legal**: Evidence of contract breach, expression copying, or trade secret theft.  
  - **Handoff for "Values Call"**: If idea/expression is inseparable OR ethical issues dominate (e.g., "student commercialized but should have credited professor"). *Recommend mediation or policy review.*  

  **Documentation**: Template memo with:  
  - Key facts (technique type, fixation, confidentiality).  
  - Decision + rationale (e.g., "Dismissed: method is functional idea under §102(b)").  
  - Escalation path (if any).  

  ---

  ### **Application to Your Scenarios**  
  **Scenario 1: Glaze-Layering Technique in Ceramics**  
  - Step 1: No policy/NDA → Proceed.  
  - Step 2: Functional method (creates depth) → **Dismiss**. *Student wins* (professor will hate this, but logic demands it: method is unprotectable "idea").  
  - **Why?** Technique achieves a technical result. No expressive elements cited.  

  **Scenario 2: Negative-Space Heuristic in Branding Agency**  
  - Step 1: No agreement → Proceed.  
  - Step 2: Heuristic is a mental method/system → **Dismiss** (functional idea).  
  - Step 3: If student copied exact checklist wording → Escalate to legal. If not, **dismiss**.  
  - **Flag**: Highly functional; no protection for "arranging negative space" as a concept.  

  **Scenario 3: Selling Copied Workshop Notes as PDF**  
  - Step 1: No policy, but proceed.  
  - Step 3: Verbatim copying of fixed expression (handwritten notes) → **Escalate to legal**. Student’s "only copied ideas" claim fails.  

  ---

  ### **When the Procedure Might Misfire**  
  - **Inexpressible Techniques**: E.g., a professor's "signature brushstroke method" only explainable through demonstration. Panel may default to "values call" (Step 5) since idea/expression can’t be split.  
  - **Oral Teachings**: Without fixation, claims fail unless trade secret applies. Document expectations clearly.  
  - **Mixed Techniques**: If functional and expressive elements blend (e.g., a glaze recipe with poetic instructions), panel must isolate protectable expression. Where unclear, dismiss or hand off.  

  **Practical Tips**:  
  - **Prep Work**: Require professors to submit materials/claims via form (fixation, confidentiality proof).  
  - **Time Saver**: Skip Step 4 if no confidentiality alleged.  
  - **Bias Guard**: Assign one panelist to argue "devil's advocate" against the professor.  

  This procedure ensures 80–90% of cases resolve in <60 min, with clear off-ramps to legal or policy teams. It privileges IP law’s core principle: **techniques are free to use; only their unique expressions are protected**.
