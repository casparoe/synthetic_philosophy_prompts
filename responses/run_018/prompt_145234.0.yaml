prompt: |-
  I am writing the final examination for my upper-level graduate seminar in social ontology and collective intentionality, and I want a single essay question that students cannot answer by reciting the standard taxonomy of joint action. To force genuine conceptual work, the prompt should introduce a constructed scenario involving what I will call “divergent sub-plan opacity”: two urban planners enter a joint commitment to design a “resilient neighborhood,” but each operates with an incompatible implicit definition of resilience—one ecological, one economic—while delegating all technical specifications to a shared contracting team, so neither ever becomes aware of the divergence. The question should ask students to determine whether this still counts as joint action, requiring them to test the scenario against Bratman’s conditions of mutual responsiveness and commitment to shared cooperative activity, Gilbert’s account of joint commitment and plural subjecthood, and Searle’s distinction between we-intentions and I-intentions that contain representations of others. Crucially, students must identify the precise conceptual point at which hidden divergence either undermines or fails to undermine the conditions for jointness, rather than merely stating which theorist they prefer.

  Please draft the exam question, then provide a model answer of approximately 600 to 750 words that clearly separates a merely descriptive answer—one that summarizes the three frameworks—from a diagnostic answer that applies them to the case and reaches a reasoned judgment about whether joint action survives. Include a marking scheme totaling 20 marks, organized around five must-hit analytical moves; for each move, specify the mark allocation, the specific conceptual judgment required, and a one-line note on how candidates typically go wrong. The scheme should distinguish an excellent answer (16–20 marks) from a competent but descriptive one (10–13 marks) by naming exactly which synthetic moves are absent. Impose a hard constraint: neither the question nor the model answer should request or include bibliographic citations, specific page references, or reading lists—the exam tests conceptual analysis, not scholarly recall. Keep the model answer within 750 words and the marking scheme within 300 words.
