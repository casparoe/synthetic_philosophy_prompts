prompt: |-
  I've been chatting with a freind about this analogy people draw between DNA replication and Gödel's proof — not the vague "life is computation" thing, but the specific structural point that DNA encodes not just proteins but also the machinery (ribosomes, polymarases) that reads and copies the DNA itself. So you get this loop where the interperter is written in the language being interpreted. There's a further twist I keep noticing: if a mutation hits the part of the genome that codes for the proofreading enzyme, then the fidelity of replicaton for that very mutation changes. It's like the statement in Gödel's construction that asserts its own unprovability, except here it's a physical feedback loop between the syntax of the code and the reliability of the copier.

  Is there an established term for this specific loop — especially the version where the replication machinery's own specification is embedded in the substrate it replicates, with error-correction fidelity being a direct function of the code's current state? I know Hofstadter writes about strange loops and there's talk of autocatalytic sets, but those feel much broader. I'm also seeing scattered references to "typogenetics" in older bio-philosophy writing, though I can't tell if that's exactly this or something about evolutionary typology. If there's no precise concept for this embedded-fidelity feedback, can you name and delimit it: what counts as an instance, what's just ordinary biological self-reference, and where the boundary with autocatalysis actually sits? I don't need a reading list — just whether the carving already exists, and if not, how you'd draw the edges so it doesn't swallow every case of self-replicating chemistry.
