        - The facilitator (instructor) should be the Translator or guide the Translator to be very clear about the rules. 
        - During the practice round, make sure everyone understands the flow. 
        - Emphasize that the goal is not just to win but to experience the causal ambiguity. 
        - If the Simmball Operators are stuck, the facilitator can offer a hint (e.g., "Remember the rule for two adjacent directions").

