prompt: |-
  I am an undergraduate in a philosophy of computation seminar, and I am preparing a 75-minute session for about twenty students on whether symbolic representations can exert causal force over the physical substrate that implements them. To keep the problem from collapsing into a familiar Chinese Room recap, I want to stage an in-class simulation built around two hypothetical entities I am introducing for the session: the careenium, a substrate that only displaces when acted upon by direct mechanical pressure, and simmballs, weightless symbolic tokens that encode directional rules but possess no mass, charge, or physical interaction profile of their own. Design a structured participatory activity—not a lecture—in which students are split into substrate operators (careenium) and symbol operators (simmballs) and must cooperate to move a shared target across a grid. The rules should be arranged so that the symbolic layer appears to direct motion—simmballs are placed, read, and translated—while the substrate layer supplies every actual unit of force, so that participants feel the ambiguity about where the causal work really resides before anyone names the symbol-grounding or substrate-causation problem. Include specific roles and a turn structure; a minute-by-minute timeline for the full 75 minutes; interaction rules that generate genuine tension between the two layers; a point-based payoff scheme (no real money) that rewards successful coordination but penalizes confusion about agency; a debrief that maps specific moments in the simulation onto parts of the philosophical question; an honest prediction of what will predictably fail the first time the activity is run and how a facilitator should handle it; and a frank admission of which feature of the real philosophical problem the activity necessarily cannot reproduce and must be supplied by subsequent discussion. After the activity description, please provide a brief structured summary as a JSON object with exactly the