              N, E -> S
              E, S -> W
              S, W -> N
              W, N -> E
              N, S -> (invalid, discard both)
              E, W -> (invalid, discard both)

          But note: the Simmball Operators know the rules? Then they can plan. We want them to be able to plan, but the rules are arbitrary and they must figure out how to use them to achieve the goal.

          Three simmballs: 
            - If three identical, discard all (invalid).
            - If two identical and one different, then treat as two of the same (invalid) and discard the two identical, and then the single one is processed? Too complex.

          Let's keep it to sequences of 1 or 2 simmballs per round.

          So the rule book:
            - Each round, the Simmball Operators can place 1 or 2 simmballs in the command zone.
            - If 1 simmball: it is passed to the corresponding activation zone.
            - If 2 simmballs:
                a) If they are the same direction: invalid, discard both.
                b) If they are adjacent (N and E, E and S, S and W, W and N): then the Translator places a simmball for the direction that is the opposite of the direction that is 90 degrees clockwise from the first one? Let's make a table:

                    First | Second | Result
                    N       E        S
                    E       S        W
                    S       W        N
                    W       N        E
                    N       S        invalid
                    E       W        invalid

                c) If they are opposite (N and S, E and W): invalid, discard both.

          This rule is arbitrary and must be learned by the Simmball Operators.

     - The goal: move the target from C3 to A1 (top-left corner). The grid is labeled A1 to E5 (A1 top-left, E5 bottom-right). Starting at C3.

     - The Simmball Operators must plan a sequence of moves that, given the rules, will result in the target moving west and north. But note: with the two-simmball rule, if they put N and E, they get S (which is the opposite of what they want). So they must use single simmballs for north and west, but if they put two together (by mistake) they get an undesired direction.

  10-15 min: Practice Round (1 round without scoring)
     - Let the Simmball Operators try one sequence (e.g., one N simmball) and see what happens: the Translator places N in the North activation zone, the North Careenium Operator pushes the target north to C2. Then they see the result.
     - Then try two simmballs (N and E): the Translator places a S simmball in the South activation zone, so the South Careenium Operator pushes the target south to C4 (if that's possible). But the target was at C2, so now it moves south to C3? Wait, no: from C2, pushing south would go to C3? We need to define the grid coordinates.

     Grid coordinates:

          A   B   C   D   E
        1
        2
        3         C3
        4
        5

     So from C3, north to C2, south to C4, east to D3, west to B3.

     After practice, the target might end up at C4 (if they tried N and E and got a south push).

  15-50 min: Game Rounds (10 rounds, each taking about 3-4 minutes, total 30-40 minutes)
     - Each round: 
          Step 1 (2 min): Simmball Operators discuss and place simmballs (1 or 2) in the command zone.
          Step 2 (1 min): Translator applies the rules and moves simmballs to the activation zones (or discards).
          Step 3 (1 min): Careenium Operators check their activation zones and push if they have a simmball. They remove the simmball after pushing (or if they can't push because the target is at the edge, they still remove it and do nothing).
          Step 4 (1 min): Record the position and scores.

     - We can do 10 rounds. After each round, the position is updated on a board.

  50-65 min: Debrief (15 minutes)
     - Start by asking the participants about their experience.
     - Careenium Operators: How did you feel? Were you in control? Did you feel like you were just following orders?
     - Simmball Operators: How did you feel? Did you feel like you were controlling the movement? How did the rules affect your ability to control?
     - Then, map to the philosophical questions:
          a) The Translator represents the interpreter (like a CPU) that bridges the symbolic and physical.
          b) The Simmball Operators represent the program, and the Careenium Operators represent the physical hardware.
          c) The causal force: every movement was caused by the Careenium Operators pushing, but they only pushed when a simmball was present. However, the simmballs were placed by the Simmball Operators and then interpreted by the Translator. So where does the causal force lie?
          d) The rules of the Translator are like the program that defines the meaning of the symbols. Without the rules, the simmballs are just tokens. But the rules are also implemented in the physical world (by the Translator).
          e) The ambiguity: the system as a whole achieves the goal, but it's unclear whether the symbols are causing the movement or the physical pushes are. The symbols are necessary for the pushes to occur in the right sequence.

  65-75 min: Wrap-up and Connection (10 minutes)
     - Summarize the key philosophical issue: the symbol grounding problem and the causal closure of the physical. In the physical world, every movement must have a physical cause. The simmballs have no physical force, so how can they cause movement? They don't; they are patterns that the physical system (the Translator and the Careenium Operators) respond to. But without the symbols, the physical system wouldn't know when to push. So the symbols are causally relevant? But not causally efficacious? (Using terminology from philosophy of mind: e.g., Donald Davidson's anomalous monism, or Jaegwon Kim's causal exclusion argument).
