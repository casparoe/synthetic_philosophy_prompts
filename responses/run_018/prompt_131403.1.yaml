  Predictable Failure:
     - The first time the activity is run, the Simmball Operators will likely make mistakes in the rules. They might place two simmballs that are invalid (like two identical) and waste a round. Or they might place two adjacent and get an unexpected direction. This will cause the target to move in unintended ways and might lead to frustration. The Careenium Operators might also be confused about when they are allowed to push (they might push without a simmball or not push when they have one).

