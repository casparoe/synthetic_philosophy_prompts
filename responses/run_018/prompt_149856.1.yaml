  Okay, the user is asking me to evaluate a summary from a grad seminar handout comparing pragmatic encroachment and epistemic contextualism. They want me to identify what's accurate, oversimplified, or wrong in this summary, particularly focusing on the metaphysical claims of encroachment and whether contextualism collapses into it.

  First, I need to recall the key distinctions between these positions. Pragmatic encroachment holds that practical factors like stakes can affect whether someone has knowledge, meaning the same evidence might suffice for knowledge in low-stakes situations but not in high-stakes ones. This is often presented as a metaphysical claim about the nature of knowledge itself. Epistemic contextualism, on the other hand, argues that the word "knows" shifts meaning based on conversational context, so the standards for knowledge ascriptions change depending on the situation.

  Looking at the handout's summary, I notice several points that need examination. It says pragmatic encroachment is a metaphysical claim that high stakes literally raise the evidence threshold for knowledge. This is largely accurate for views like Fantl and McGrath's or Stanley's, who do argue for a metaphysical shift in knowledge conditions. The handout also correctly notes that this is compatible with invariantism about the word "knows" - meaning the semantic meaning of "knows" stays constant while the worldly conditions for satisfying it change.

  But then the handout claims contextualism is "just encroachment applied to linguistic practice" and that accepting stakes affect knowledge conditions means abandoning invariantism. This seems conflated to me. Contextualism is fundamentally a linguistic thesis about how "knows" functions in language, not necessarily about stakes changing the actual requirements for knowledge. A contextualist could maintain that the metaphysical conditions for knowledge are invariant, while our ascriptions shift based on context. 

  The handout also suggests that both views reject the traditional JTB (justified true belief) account of knowledge. This is an oversimplification. Pragmatic encroachment typically keeps justification constant but claims that practical factors affect whether justification suffices for knowledge. Contextualism doesn't necessarily reject JTB at all - it might just say that how we apply JTB standards changes contextually.

  The user is particularly unsure about whether encroachment targets metaphysical conditions rather than assertibility conditions. From what I recall, major proponents do make metaphysical claims - they argue that knowledge itself depends on practical factors, not just our ascriptions of it. 

  Regarding whether contextualism collapses into encroachment, I think the handout gets this wrong. These are distinct positions: one about language (contextualism), one about the nature of knowledge (encroachment). You could theoretically hold both, but they address different questions.

  I'll organize my response to address each part of the handout systematically, pointing out where it's accurate (like the invariantism compatibility), where it's oversimplified (the JTB rejection claim), and where it's conflated (the contextualism-as-encroachment point). I'll emphasize that contextualism is primarily about semantic content shifting, while encroachment is about practical factors changing knowledge conditions - two different levels of analysis.
answer: |-
  Here's a conceptual audit of the handout's claims, breaking down what's accurate, oversimplified, or wrong:

  ### **Part 1: "Pragmatic encroachment is the view that whether you know *p* depends on practical stakes, but unlike contextualism it doesn't say 'knows' changes meaning with context."**
  - **Accurate**:  
    Pragmatic encroachment (PE) *does* claim that practical stakes (e.g., costs of being wrong) affect whether S *knows* p. It rejects contextualism's core thesis that "knows" is context-sensitive (i.e., its semantic content shifts with conversational context).  
  - **Oversimplification**:  
    PE isn't *defined* by rejecting contextualism. Its focus is on the *nature of knowledge itself* being practically inflected, not merely a linguistic contrast.

  ### **Part 2: "Encroachment is a metaphysical claim: high stakes literally raise the evidential threshold for knowledge."**
  - **Accurate (for standard PE)**:  
    Proponents like **Jeremy Fantl & Matthew McGrath** or **Jason Stanley** argue precisely this: stakes *metaphysically* increase the justification/evidence required for a true belief to count as knowledge. Identical evidence can support knowledge in low stakes but not high stakes.  
  - **Clarification**:  
    PE targets the *knowledge relation*, not assertibility conditions. It claims S *actually knows* p in low stakes but *does not know* p in high stakes with identical evidence. This is a world-level fact, not about what we can assert.

  ### **Part 3: "This is fully compatible with invariantism about 'knows'."**
  - **Accurate**:  
    PE is typically a form of **interest-relative invariantism (IRI)**: the semantic meaning of "knows" is fixed (invariant), but the *conditions for satisfying that meaning* depend on practical stakes. "Knows" always denotes the same relation (e.g., *adequate evidence for practical purposes*), but what counts as "adequate" varies with stakes.

  ### **Part 4: "Contextualism is basically just encroachment applied to linguistic practice—once you accept stakes affect knowledge, you've abandoned invariantism about knowledge ascriptions."**
  - **Genuinely Wrong/Conflated**:  
    This is a serious misunderstanding.  
    - Contextualism (e.g., **DeRose**, **Lewis**) is a *semantic thesis*: "knows" is context-sensitive, like "tall" or "flat." Standards for applying "knows" shift with conversational context (which *may include* stakes).  
    - PE/IRI is a *metaphysical thesis*: the *property of knowing* shifts with stakes, not the word's meaning.  
    - **Crucially**: Contextualism does **not** require stakes to affect *knowledge itself*. A contextualist can say:  
      - In high-stakes contexts, "knows" expresses a stricter relation (say, *certainty*).  
      - In low-stakes contexts, it expresses a weaker relation (say, *reasonable confidence*).  
      - But *whether S occupies the knowledge relation* might be invariant—only our *ascription standards* change.  
      → **PE and contextualism are independent**: You can be a contextualist *without* believing stakes affect knowledge (e.g., if standards shift due to salience of error, not stakes). Conversely, PE (as IRI) rejects contextualism.  

  ### **Part 5: "Both views reject the traditional belief-truth-justification trio... encroachment keeps justification constant but modifies the belief-to-truth connection through practical pressure."**
  - **Mostly Wrong**:  
    - **Rejecting JTB?** Neither view *necessarily* rejects justification, truth, or belief as necessary for knowledge. They challenge whether justification is *purely epistemic* (i.e., independent of practical stakes).  
    - **PE on justification**: Standard PE (e.g., Stanley) argues that stakes affect *how much justification* is needed for knowledge. Justification *isn't* held constant—the threshold for "sufficient justification" rises with stakes.  
      - *Example*: The same evidence justifying belief in "the bank is open Saturday" suffices for knowledge when stakes are low but *not* when stakes are high.  
    - **Belief-truth connection?** PE doesn't alter the belief-truth link (truth is still required). It alters the *justification-to-knowledge* link. The handout's phrasing confuses justification with the knowledge relation itself.  
    - **Contextualism & JTB**: Contextualists typically preserve JTB but add that "justification" is context-sensitive.  

  ---

  ### **Summary of Key Corrections**
  1. **PE vs. Contextualism**:  
     - PE: Metaphysical claim—*knowledge itself* depends on practical stakes.  
     - Contextualism: Semantic claim—*ascriptions* of "knows" depend on conversational context.  
     → **Not reducible**: Contextualism does *not* collapse into PE. They operate at different levels (language vs. metaphysics).  

  2. **Invariantism Compatibility**:  
     - PE is *only* compatible with **invariantism** (specifically IRI). Contextualism is *incompatible* with invariantism by definition.  

  3. **JTB Rejection?**  
     - Neither rejects JTB wholesale. PE argues justification thresholds are practical; contextualism argues ascription standards are contextual.  
     - PE **does not** keep justification constant—it *raises the justificatory bar* in high stakes.  

  4. **The Handout's Fatal Flaw**:  
     Claiming contextualism "is just PE applied to linguistic practice" reverses the actual debate. PE is a rival to contextualism, not its foundation. Accepting stakes affect knowledge *conditions* (PE) doesn't force you to abandon invariantism—it *is* a form of invariantism.  

  ### **Why the Last Bit Felt "Weird"**  
  The handout incorrectly framed PE as modifying the "belief-to-truth connection" (it doesn’t—truth remains necessary) and implied justification is static (it isn’t). The deeper confusion was conflating contextualism’s *semantic flexibility* with PE’s *metaphysical flexibility*. They’re distinct tools solving different problems (e.g., contextualism addresses paradoxes like the Lottery; PE explains differential action demands).  

