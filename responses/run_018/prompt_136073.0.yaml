prompt: |-
  I'm a novelist drafting scenes in which characters face choices between goods that resist common measurement—artistic creation, filial obligation, ecological preservation, human survival. I want to know whether my intuitive verdicts point to a coherent principle, or whether some must be abandoned.

  Here are my judgments. A surgeon saves a pianist's life by amputating her hand; the choice is right, yet the destroyed music is not outweighed—it remains a genuine, un-canceled loss. A father abandons his unfinished masterpiece to nurse his dying child; right, yet the art is sacrificed, not traded away at a discount. A state razes a unique, un-replicable oral archive to build a hospital saving hundreds; wrong—not because the archive matters more, but because treating its value as comparable to lives saved is itself a moral error, even when lives are saved. Yet when the state razes an identical digital backup of that archive for the same hospital, there is no wrong and no tragic residue. A woman declines an artistic fellowship to stay with her mother, though she could have arranged care and done both; wrong, and not tragic—merely selfish. A commander who must choose by lottery which of two equally deserving soldiers to rescue: right, with no remainder, only misfortune.

  What precise principle distinguishes choices that leave a sacrificial remainder from those that do not, and explains why treating incommensurable values as weights on one scale is sometimes correct reasoning (the surgeon) and sometimes the very source of wrongness (the archive)? Give a committed answer: either state the principle that saves all five verdicts, identify the clause that resolves the tension between the surgeon and archive cases, and predict its verdict on a case I have not listed—say, a society that permits a dying language with twelve speakers to vanish in order to fund universal literacy programs; or admit honestly which of my verdicts the best available principle forces me to drop, with reasons.
reasoning: |-
  Hmm, this novelist is grappling with ethical dilemmas involving incommensurable values—things like art, family, duty, ecology, and human life that can't be neatly weighed against each other. They've shared several intuitive judgments about fictional scenarios and want to know if there's a coherent principle behind them. The key tension is between cases where sacrificing one good feels tragic but justified (like the surgeon amputating the pianist's hand) versus cases where even considering trade-offs feels inherently wrong (like destroying a unique oral archive for a hospital).

  Let me unpack their examples first. The surgeon case suggests a "tragic remainder"—the loss of art isn't erased by saving a life. Similarly, abandoning art for a dying child has sacrificial residue. But in the lottery to save one soldier, no remainder exists; it's pure misfortune. The oral archive case is pivotal: destroying it for a hospital feels wrong not because archives > lives, but because comparing them is the error itself. Yet a digital backup? No issue. Then there's the artist who stays with her mother despite alternatives—seen as selfish, not tragic. 

  The core question is: when does sacrificing a good leave moral residue, and when is it neutral? And why is "weighing" values acceptable sometimes (surgeon) but corrupting others (archive)? 

  Their intuitions point to two hidden factors: uniqueness and substitutability. The oral archive is irreplaceable—it's not just information but embodied cultural meaning. The digital backup? Fungible; value persists elsewhere. Similarly, the pianist's lost artistry is singular; no one else creates exactly that music. But the soldiers in the lottery? Interchangeable in moral weight. 

  The mother-care case reveals another layer: substitutability matters. If the artist could arrange equivalent care, her choice isn't sacrificial but selfish—she's refusing a substitutable good (professional care) for her own preference. 

  So a principle emerges: **Sacrificial remainder arises only when the sacrificed good is non-fungible—its value is tied to a unique, irreplicable instantiation.** When values are commensurable (like soldiers' lives), trade-offs leave no residue; when incommensurable but fungible (digital backup), sacrificing one copy is neutral. But destroying non-fungible goods (oral archive, pianist's artistry) incurs unredeemable loss, even if justified. 

  Testing this: the dying language case. If the language's value lies solely in its utility (e.g., as data), funding literacy might be neutral. But if it carries irreplaceable cultural ontology—ways of seeing the world lost forever—its destruction would leave tragic residue, making the trade-off wrong. 

  This saves all their verdicts. The surgeon/archive tension resolves via fungibility: the hand's artistry is non-fungible; a digital archive is fungible. The principle also predicts the language case hinges on whether its value is replicable. 

  I’ll present this as a committed answer—no verdicts dropped, tension resolved via uniqueness and substitutability, with a clear test for the new case.
answer: |-
  Your intuitions reveal a coherent principle—**The Principle of Non-Fungible Sacrifice**—that preserves all five verdicts. It distinguishes between *fungible* and *non-fungible* values, determining when a sacrifice leaves tragic residue and when trade-offs are morally permissible. Here's the principle articulated, followed by resolution of the surgeon/archive tension, and application to your new case.

  ---

  ### **The Principle of Non-Fungible Sacrifice**
  1. **Non-Fungible Goods**: Certain goods derive their value from being irreducibly particular, irreplaceable, or context-bound. Their worth cannot be replicated, substituted, or "cashed out" without destroying something unique (e.g., a specific cultural artifact, a person's unrepeatable artistic voice, an ecosystem's intrinsic history).  
  2. **Fungible Goods**: Other goods are measurable, replaceable, or expressible in general terms (e.g., lives saved in aggregate, generic medical care, digital data).  
  3. **Tragic Remainder**: Sacrificing a non-fungible good *always* leaves a moral residue, even when justified. This residue arises because the loss is absolute—no future gain can "repay" or negate it.  
  4. **Commensurability Error**: Treating non-fungible goods as fungible weights on a single scale is inherently immoral. It denies their distinctive nature and reduces the sacred to the transactional.  
  5. **Permissible Trade-offs**: Trade-offs are justified (with or without residue) only when:  
     - The sacrificed good is fungible, *or*  
     - The non-fungible good is sacrificed directly for another non-fungible good of greater moral urgency (e.g., saving a life over preserving art), but residue persists.  

  ---

  ### **Resolving the Surgeon vs. Archive Tension**
  - **Surgeon Case**: Amputating the hand destroys a *non-fungible* good (the pianist's unique artistic capacity). Saving her life is non-fungible (her irreplaceable existence). The trade-off is justified by urgency, but the loss of art remains a tragic residue because no future act restores *her music as it would have been*. Commensurate reasoning is acceptable here because both goods are non-fungible, yet life takes precedence without erasing the art’s value.  
  - **Oral Archive Case**: Destroying the archive sacrifices a non-fungible good (irreplaceable cultural meaning) for a fungible one (lives saved as aggregate units). This commits the **commensurability error**: treating the archive as a "weight" denies its intrinsic, particular value. The act is wrong not because lives < archive, but because the framing itself is corrupt.  
  - **Digital Backup Case**: The backup is fungible—it’s a copy of data, not the embodied tradition. Sacrificing it for lives involves commensurate goods (data vs. lives), so no residue exists.  

  **Clause resolving tension**: *Commensurability is only valid when both goods are fungible OR when two non-fungible goods are traded under dire necessity (with residue). It is invalid when a non-fungible good is sacrificed for a fungible one.*  

  ---

  ### **Verdicts on Your Cases**
  1. **Pianist’s Hand**: Justified with residue (non-fungible for non-fungible).  
  2. **Father/Art**: Justified with residue (non-fungible art for non-fungible relationship).  
  3. **Oral Archive Hospital**: Wrong (non-fungible for fungible; commensurability error).  
  4. **Digital Backup Hospital**: Justified, no residue (fungible for fungible).  
  5. **Artist/Mother**: Wrong, no residue. The fellowship is non-fungible (her artistic opportunity), but substitute care makes the mother’s well-being fungible. Refusing substitutable care for personal preference is selfishness, not sacrifice.  
  6. **Soldier Lottery**: Justified, no residue. Lives are fungible in moral weight here (no unique duties or irreplaceable roles).  

  ---

  ### **Verdict on the Dying Language Case**
  - **Scenario**: A society permits a dying language (12 speakers) to vanish to fund universal literacy programs.  
  - **Analysis**:  
    - The language is **non-fungible**. Its value lies in unique cultural ontology, ancestral knowledge, and irreplicable worldview—not just "information."  
    - Literacy programs are **fungible**. They offer generalized skills; their value is aggregate and replicable.  
  - **Principle’s Verdict**: **Wrong, with tragic residue**. Sacrificing a non-fungible good (language) for a fungible one (literacy) commits the commensurability error. Universal literacy could be achieved without extinguishing the language (e.g., phased funding, community documentation). Allowing extinction treats language as a weight on a scale, denying its irreducible worth. The loss is permanent and unredeemable.  

  ---

  ### **Why This Principle Works**
  - It upholds moral intuition without absolutism: Some losses *must* be mourned, even in necessity.  
  - It condemns reductionism: Not all values can be "priced," especially when tied to identity, culture, or irreplaceable particularity.  
  - It explains why digital/data backups lack residue (fungibility) while embodied traditions do not.  
  - It accommodates tragic dilemmas (e.g., surgeon) while forbidding false equivalencies (e.g., archive).  

  This principle aligns with ethical frameworks like Isaiah Berlin’s value pluralism (values clash irreducibly) and Martha Nussbaum’s fragility of goods (some virtues destroy others). If you abandon it, the archive case verdict must drop—but that would ignore your deepest insight: that reducing certain things to trade-offs is itself a violence.
