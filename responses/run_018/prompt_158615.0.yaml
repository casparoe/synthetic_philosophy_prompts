prompt: |-
  Your an expert in normative ethics and moral philosophy, so please think carfully and start with a bit of brainstorming before you answer. In my grad seminar on the paradox of deontology someone cut off my argument with "the ends don't justify the means" — they were trying to block a consequentialist point about institutional triage algorithms during resource shortages. I want you to pull that slogan apart into its precise claims. Is it saying outcomes carry literally zero moral weight? That an agent's intentions are sufficient for rightness? That there's a lexical priority of duty over result? That using people as mere instruments corrupts the actor? Lay out like four or five distinct readings, flag which ones are just tautologies, which ones are actually false, and which ones are substantive but defensible. Then tell me which reading the seminar person was probably smuggling in, and whether that reading actually addresses cost-benefit reasoning about institutions or just dodges it. There's this weird niche concept I might have made up called "deontic leakage" — the idea that duties somehow evaporate in high-stakes collective emergencies — address whether any of your disambiguations can accommodate that or if it just breaks the slogan entirely. Don't cite specific texts or give me a bibliography; work purely from the logic of the positions. Also, check: am I right that there's a hidden ambiguity in what counts as a "means" when the agent is an institution rather than a single person?
