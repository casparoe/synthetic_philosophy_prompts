  I'm convening a small philosophy-of-ethics reading group that has been circling the same ground for months on evolutionary debunking arguments in metaethics. The familiar architecture is intact: evolutionary psychology seems to show that our core normative judgments—about harm, fairness, loyalty—are shaped by selection pressures for social cohesion rather than by tracking mind-independent moral properties; moral realists respond that causal genealogy is epistemically irrelevant unless it severs a correlation with truth, often invoking third-factor explanations or insisting that evolutionary origins are compatible with reliability. What makes the stall puzzling is that every participant can now reproduce these moves automatically—genealogical premises, correlation worries, objections about explanatory redundancy—yet no position has yielded an inch. I want a diagnosis of the disagreement's structure, not another map of the literature. Is this a substantive dispute about whether evolutionary etiology can ever function as a genuine epistemic defeater, a verbal disagreement about what "justification" or "tracking" requires in normative domains, or a case of two distinct inquiries—one about whether moral beliefs are warranted given their origins, another about whether evolutionary explanation makes moral realism redundant—being pursued under one label? I also want you to consider whether a hidden empirical question is doing the silent work: specifically, whether evolutionary psychology has actually identified a unified selection mechanism for moral cognition, or whether distinct pathways (for instance, cooperation-selection generating thick deontic concepts versus disgust-avoidance generating axiological aversions) produce beliefs that should be evaluated differently, with some debunked and others not. Given your diagnosis, tell me what would actually count as progress—an empirical result about moral cognition's evolutionary architecture, a conceptual distinction that separates the two projects, or an admission that the dispute rests on bedrock intuitions about whether causal origins can undermine normative authority—and whether any such progress is realistic. Please ground the diagnosis in what each side actually says rather than in generic summaries, and be explicit about whether the impasse is permanent.

  After your diagnosis, provide a brief structured summary as a JSON object with exactly these fields: "diagnosis_type" (choose from "substantive", "verbal", "different_questions", "mixed", or "ill_posed"), "hidden_empirical_or_formal_question" (a one-sentence statement of the hidden question if present, else null), "progress_pathway" (what distinction, result, or reframing could advance the debate), "permanent_impasse" (true or false, with a one-phrase justification), and "mechanism_distinction_matters" (true or false, indicating whether separating cooperation-selection from disgust-avoidance mechanisms changes the diagnosis).
