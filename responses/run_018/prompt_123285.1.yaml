    "diagnosis_type": "mixed",
    "hidden_empirical_or_formal_question": "Whether moral cognition evolved via a single social-cohesion mechanism or multiple distinct pathways (e.g., cooperation-optimization vs. disgust-avoidance).",
    "progress_pathway": "Empirical evidence of dissociable cognitive mechanisms for moral domains, coupled with explicit separation of epistemic justification and metaphysical redundancy questions.",
    "permanent_impasse": false,
    "justification": "Mechanistic heterogeneity could force domain-specific evaluation, breaking monolithic treatment.",
    "mechanism_distinction_matters": true
  }
  ```

  ### Key Justifications
  - **Mixed Diagnosis**: Combines substantive (defeater criteria), verbal ("tracking"), and conflated-projects elements.  
  - **Mechanism Distinction**: If disgust-based norms lack third-factor anchors but cooperation-based norms retain them, the debate fractures productively.  
  - **Non-Permanent**: Empirical/cognitive science advances could disrupt the stalemate by reframing the target of debunking.
