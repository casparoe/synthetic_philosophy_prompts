answer: |-
  Here’s a diagnosis grounded in the group’s explicit dynamics, followed by the structured summary:

  ### Diagnosis of the Impasse
  1. **Substantive Dispute over Epistemic Defeaters**:  
     Debunkers argue that evolutionary origins **inherently sever** the truth-tracking link because selection pressures optimize for fitness (e.g., social cohesion), not moral truth. They insist that absent a *direct* causal connection to mind-independent properties, beliefs are unjustified—regardless of third-factor correlations. Realists counter that **correlation suffices for justification** if the belief-forming process is reliable (e.g., cooperation-trackers coincidentally aligning with moral facts). This is a substantive clash about whether *any* non-truth-aimed etiology can preserve justification.

  2. **Verbal Disagreement on "Tracking" and "Justification"**:  
     - **Debunkers** define "tracking" as requiring **causal sensitivity to moral properties** (e.g., "If wrongness disappeared, our beliefs would change"). Evolution, they argue, makes beliefs insensitive.  
     - **Realists** define "tracking" as **counterfactual correlation** (e.g., "In worlds where cooperation is good, we believe it’s good"). Evolution, they claim, preserves this.  
     Similarly, "justification" for debunkers demands **non-accidental accuracy**, while realists accept **reliability sans teleology**.

  3. **Conflated Projects**:  
     The group is running together:  
     - **Epistemic Project**: Are moral beliefs *justified* given their origins? (Debunkers: No; Realists: Yes, if reliable).  
     - **Metaphysical Project**: Does evolutionary explanation *render moral facts redundant*? (Debunkers: Yes; Realists: No, third factors bridge the gap).  
     Failure to separate these lets debunkers use "explanatory redundancy" against realism while realists retreat to "correlation."

  4. **Hidden Empirical Question**:  
     The stalemate hinges on **whether evolution produced moral cognition via a unified mechanism** (e.g., social cohesion optimizing group fitness) or **distinct pathways** (e.g., cooperation vs. disgust). If cooperation-modules produce beliefs alignable with third-factor truths (e.g., cooperation’s instrumental value) but disgust-modules produce arbitrary cultural taboos, some judgments might be debunkable (disgust-based purity norms) while others resist (harm norms). Yet both sides default to treating "moral cognition" monolithically.

  ### Pathways to Progress
  - **Empirical Clarification**: Evidence that moral cognition splits into distinct mechanisms (e.g., fMRI studies showing cooperation vs. disgust judgments activate non-overlapping neural pathways) could force nuanced evaluation. If disgust-avoidance lacks a third-factor anchor, it might be debunked, while cooperation-selection retains justification.  
  - **Conceptual Disentanglement**: Explicitly separating the epistemic ("Are beliefs justified?") and metaphysical ("Are facts redundant?") projects. Progress might require conceding that evolution *can* undermine justification for *some* beliefs (addressing debunkers) without eliminating realism (addressing realists).  
  - **Bedrock Admission**: Ultimately, the dispute rests on irreconcilable intuitions about **whether causal origins can strip normative authority**. Realists see origins as irrelevant to current justification; debunkers see origins as contaminating. Progress here may involve mapping these intuitions to broader metaethical commitments (e.g., naturalism vs. non-naturalism).  

  **Is the impasse permanent?** No—but only if the group shifts tactics. Empirical disunity in moral cognition or conceding divergent projects could break the deadlock. Absent this, core intuitions may remain entrenched.

  ---

  ### Structured Summary
