  - Providing agreed claims with plain English glosses.
  - Stating disagreements in each camp's own words.
  - Offering testable cruxes with predictions.
  - Noting a verbal dispute.
  - Avoiding citations and keeping it accessible.
answer: |-
  ### Adversarial Collaboration Wrap-up: Joint Statement  
  **Participants**: "Worst-case" (WC) and "Average-case" (AC) safety camps  
  **Duration**: 8 months  
  **Goal**: Clarify agreements, document disagreements, and specify testable cruxes.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following:  

  1. **Distinction of claim types**  
     *Gloss: "99% reliable on Test X" and "Never does Y" are logically different statements.*  
     - WC: Reliability claims describe measurements; guarantees require bounds.  
     - AC: Both are evidence, but only one is directly actionable in deployment.  

  2. **Distribution-dependence of average-case claims**  
     *Gloss: All average-case claims depend on a prior distribution, which can be wrong.*  
     - WC: The distribution itself needs validation, creating a "regress" problem.  
     - AC: Distributional uncertainty is managed empirically (e.g., via iterative testing).  

  3. **Three distinct variances**  
     *Gloss: Input-level noise, training instability, and deployment shifts affect safety differently.*  
     - WC: Deployment variance dominates tail risk (e.g., novel environments).  
     - AC: Input-level variance is easiest to measure; others require monitoring.  

  4. **Correlated failures invalidate per-instance reliability**  
     *Gloss: If 1,000 systems share a flaw, 99.9% per-instance reliability still risks total failure.*  
     - WC: Correlations amplify tail risk beyond uncorrelated models.  
     - AC: Monitoring must target systemic (not individual) failures.  

  ---

  ### 2. Disagreements Table  
  | Topic | WC Position (in their terms) | AC Position (in their terms) |  
  |-------|------------------------------|------------------------------|  
  | **The role of threat models** | "Safety requires a threat model bounding *all* inputs in a defensible set. Without this, evaluations only describe the past." | "Threat models for superhuman systems are either too vague to bound or too narrow to matter. Reliability measured on *plausible* inputs is the only empirical anchor." |  
  | **How to interpret probabilistic claims (e.g., p(catastrophe) < 1e-3)** | "This must quantify maximum risk against adversarial inputs, not sampling noise. Subjective confidence is irrelevant to guarantees." | "This summarizes observed failures in testing. It guides deployment when combined with error bars and real-world monitoring." |  
  | **Red-team attack rates vs. real risk** | "Attack success rates under fixed compute measure researcher skill, not system robustness. Adaptive adversaries will exploit unseen flaws." | "Attack rates track real risk if the red team’s distribution approximates deployment. They provide actionable data for iterative hardening." |  
  | **Capability gains and tail risk** | "Improving average performance can increase tail risk (e.g., new capabilities enable rarer but worse failures). You cannot measure what you haven’t seen." | "Capability gains reduce overall failures, including the tail, by patching known flaws. New risks emerge slowly and are caught via updates." |  

  ---

  ### 3. Cruxes  
  For each, we define a concrete test and both camps’ predictions.  

  #### Crux 1: What does *p(catastrophe) < 0.001* mean?  
  - **Test**: Deploy an AI assistant in 10,000 scenarios mirroring its test distribution. Measure if catastrophic failures (e.g., aiding crime) exceed 0.1%.  
  - **WC Prediction**: Failures will cluster in "blind spots" outside the test distribution, exceeding 0.1% when adversaries adapt.  
  - **AC Prediction**: Failures will stay below 0.1%, with deviations due to measurable noise (e.g., statistical error ±0.05%).  

  #### Crux 2: Do fixed-budget red teams track real risk?  
  - **Test**: For an AI moderator, measure attack success rate (ASR) under a red team using 1000 GPU-hours. Compare to real-world failure rate after 1M user interactions.  
  - **WC Prediction**: Real-world failures will outpace ASR by >5× due to novel user tactics.  
  - **AC Prediction**: ASR and real-world rates will correlate (e.g., within 2×) if the red team distribution covers key user behaviors.  

  #### Crux 3: Can capability gains worsen tail risk?  
  - **Test**: Train an AI to reduce average errors on a benchmark by 50%. Then probe for catastrophic failures (e.g., leaking secrets) using adversarial inputs.  
  - **WC Prediction**: Tail failures will increase (e.g., 2× more severe incidents) due to new capabilities like better persuasion.  
  - **AC Prediction**: Tail failures will decrease or hold steady; average improvements patch more flaws than they create.  

  #### Crux 4: Is a "relaxed threat model + monitoring" viable?  
  - **Test**: Define a threat model excluding "unforeseen deployment shifts." Deploy with runtime monitors for anomalies. Measure failures when monitors miss attacks.  
  - **WC Prediction**: >10% of catastrophic failures will bypass monitors due to model underspecification.  
  - **AC Prediction**: Failures will align with monitor error rates (e.g., <1%), making risk controllable.  

  ---

  ### Verbal Disputes Note  
  The debate often conflates terms:  
  - **"Guarantee"**: WC uses this for *proofs*; AC uses it for *measurements + mitigations*. This is semantic, not substantive.  
  - **"Safety case"**: WC requires deductive bounds; AC requires empirical track records. The real disagreement is **whether worst-case bounds are feasible or useful for superhuman systems**, not whether safety matters.  

  ### Summary  
  - **Agreements**: Both sides reject conflating distributional reliability with guarantees and emphasize distinct variances/correlations.  
  - **Disagreements**: Red-team validity, threat model necessity, and tail risk dynamics remain unresolved.  
  - **Cruxes**: Tests above can force convergence. WC expects empirical failures to spike under adaptation; AC expects smooth generalization.  

  ---  
  **Word count**: 1,140 | **Audience note**: Plain English prioritizes clarity over technical rigor.
