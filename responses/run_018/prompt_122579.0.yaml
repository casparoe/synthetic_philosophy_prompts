  **Draft Document:**

  # Adversarial Collaboration Wrap-up: Worst-Case vs. Average-Case AI Safety

  ## 1. Agreed Claims

  Both sides endorse the following statements:

  1. **Claim 1: Average-case reliability and worst-case guarantees are distinct types of claims.**  
     *Plain English: Saying "the system is 99% reliable on a test" is fundamentally different from saying "the system will never do X under any circumstances".*

  2. **Claim 2: Average-case claims are relative to a distribution, and that distribution is uncertain.**  
     *Plain English: Any claim about average performance depends on the set of inputs you test against, and you can be wrong about whether that set matches the real world. Checking the set itself is another average-case problem that might be wrong too.*

  3. **Claim 3: Different types of variance matter differently for safety.**  
     *Plain English: Variability due to different inputs, different training runs, and different deployment environments are separate issues and require different approaches to manage.*

  4. **Claim 4: Correlated failures can mislead about tail risk.**  
     *Plain English: If many copies of a system fail in the same way at the same time, even a high per-instance reliability can lead to catastrophic outcomes in the worst cases.*

  ## 2. Disagreements

  The table below states key unresolved disagreements, with each position described in the terms preferred by that camp.

  | Topic | Worst-case camp position | Average-case camp position |
  |-------|--------------------------|----------------------------|
  | **Interpreting probabilistic safety claims** | "A claim like 'p(catastrophe) < 1e-3' must be grounded in a threat model and hold against adversarial inputs. Without that, the number is not a guarantee but a description of past data." | "A claim like 'p(catastrophe) < 1e-3' summarizes measured reliability on a representative test distribution. It is actionable for deployment with monitoring, and demanding a guarantee against unconstrained adversaries is unrealistic." |
  | **Red-teaming as a proxy for real risk** | "Attack success rates under a fixed red-team budget measure vulnerability to that specific red team. They do not bound the rate of catastrophic failures in deployment because adversaries will adapt beyond the red team's scope." | "Attack success rates under a well-designed red team track the rate of catastrophic failures in deployment because the red team distribution is constructed to be representative of real threats and can be updated with new data." |
  | **Capability gains and tail risk** | "Improving average-case reliability can mask increased tail risk if new capabilities create novel failure modes that are rare but severe. Therefore, average-case improvements do not necessarily reduce worst-case risk." | "Improving average-case reliability by reducing known failure modes and adding safeguards reduces both average and tail risk because real-world deployments are constrained by the same distribution used for testing." |
  | **Feasibility of a 'middle object'** | "A relaxed threat model with monitored assumptions is still a threat model. If the assumptions are not guaranteed to hold (e.g., via a worst-case bound), the 'bound' on the relaxed model is not a safety case." | "A bound on a relaxed threat model plus runtime monitoring for assumption violations is the only practical path to safety. It allows us to act on measurable risks and update as we go, which is how engineering has always worked." |

  ## 3. Cruxes

  For each crux, we define a concrete test and record each camp's prediction.

  ### Crux 1: Interpretation of probabilistic safety claims
  - **Concrete test:** Deploy a system in a controlled environment with a claim of "p(catastrophic failure) < 0.001" based on a test distribution D. Run an adversarial red team with 100x the original test compute to find failures. Measure the rate of catastrophic failures found by the red team per unit of compute.
  - **Worst-case prediction:** The red team will find catastrophic failures at a rate significantly higher than 0.001 per instance (e.g., >0.01) because the original claim did not account for adaptive adversaries.
  - **Average-case prediction:** The red team will find catastrophic failures at a rate consistent with the original claim (around 0.001) because the test distribution D was representative and the system's reliability generalizes.

  ### Crux 2: Red-teaming as a proxy for real risk
  - **Concrete test:** In a real-world deployment of a content moderation system, compare the rate of catastrophic failures (e.g., allowing harmful content) to the attack success rate measured by a pre-deployment red team (with fixed compute). Track over 1 million user interactions.
  - **Worst-case prediction:** The real-world catastrophic failure rate will be higher than the red team's measured success rate because novel user behaviors and adversarial inputs will emerge that the red team did not cover.
  - **Average-case prediction:** The real-world catastrophic failure rate will match the red team's success rate (within statistical error) because the red team distribution was designed to cover the real threat landscape.

  ### Crux 3: Capability gains and tail risk
  - **Concrete test:** Take an AI system and improve its average-case reliability on a benchmark (e.g., reduce failure rate from 5% to 1%) via additional training. Then, test the new system on a diverse set of adversarial inputs (generated with a fixed compute budget) and measure the rate of severe failures (those causing catastrophic harm).
  - **Worst-case prediction:** The rate of severe failures on adversarial inputs will increase (or stay the same) because the new capabilities introduced by training may create new attack surfaces.
  - **Average-case prediction:** The rate of severe failures on adversarial inputs will decrease because the same improvements that help average-case reliability also patch known vulnerabilities.

  ### Crux 4: Feasibility of a 'middle object'
  - **Concrete test:** Define a relaxed threat model (e.g., "no catastrophic failure if inputs are non-adversarial") plus a runtime monitor to detect adversarial inputs. Deploy in a setting where adversarial inputs occur at a rate of 1%. Measure the rate of catastrophic failures over 10,000 deployments.
  - **Worst-case prediction:** The system will experience catastrophic failures at a rate significantly higher than the monitor's false-negative rate because the threat model relaxation leaves room for unmonitored failures.
  - **Average-case prediction:** The system will experience catastrophic failures at a rate consistent with the monitor's false-negative rate, showing that the combined approach is effective and practical.

  ## Verbal Disputes Note

  We note that some apparent disagreements may be verbal, particularly around the terms "guarantee" and "safety case." The worst-case camp uses "guarantee" to mean a proof that holds against adversarial inputs within a threat model, while the average-case camp uses it to mean a measured reliability that is actionable for deployment. This difference in definition does not reflect a substantive disagreement about the underlying risks but about the standards of evidence required to declare a system "safe."

