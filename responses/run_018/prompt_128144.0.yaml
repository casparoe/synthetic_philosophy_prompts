  For the research question, I should frame it around distinguishing reflexive rescues from ad hoc adjustments. The key is to show why Popper’s model falls short here. Popper focuses on empirical falsification but ignores cases where the prediction’s dissemination alters the outcome. Reflexive rescues are unique because the theory’s influence causes the failure, not external factors.

