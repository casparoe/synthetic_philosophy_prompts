prompt: |-
  hey i'm on the clinical taxonomy and ethics board at the university hospital and we need a memo for thursday. there's a proposal from the peer advocacy center to formally recognize "institutional betrayal trauma" — IBT — as its own intake and billing category in our trauma unit, not folded into PTSD. the advocates say standard trauma frameworks miss the specific harm that happens when the care system itself violates trust, and they want this live by Q3.

  the philosophical snag is Hacking-style looping: once you make IBT an official kind, people start experiencing and reporting thier distress through that category, clinicians start selecting for it, and you don't just map reality you reshape it. but there's a reflexive twist — the institution that would classify people is also the potential source of the betrayal. so adopting the code might actually manufacture or amplify the very harm it describes, especially since we're also piloting a digital intake tool that assigns "pre-betrayal sensitivity" risk scores before full symptoms show up. my colleague calls this "pre-looping" — like looping but for probabilistic categories that haven't fully formed yet. half the board wants to reject IBT to avoid this, the other half thinks refusing it is epistemic erasure.

  draft the memo recommending either approval, rejection, or conditional approval with conditions and a concrete timeline — say a 6-month pilot with specific safeguards, or a 90-day moratorium. engage the looping/pre-looping worry seriously, don't just handwave it. and treat the strongest counter-argument fairly: if you land on approval, explain why the risk of misrecognition and patient exclusion outweighs the looping danger; if you reject, explain why the reflexive institutional risk is too high even if it means leaving some experiences unnamed. write it like an actual board document — clear recommendation up front, reasoning after, no bibliography needed, this isn't a literature review. just make it something we could circulate to clinicians and advocates without embarassment.
reasoning: |-
  Okay, the user is on a clinical taxonomy and ethics board at a university hospital. They need a memo by Thursday regarding a proposal to recognize "institutional betrayal trauma" (IBT) as its own intake and billing category, separate from PTSD. The advocates argue that current frameworks miss the harm when the care system itself violates trust. The main philosophical concern is Hacking-style looping: creating this category could reshape how people experience and report distress. Plus, there's a twist—the institution classifying the trauma might be the source of the betrayal. Adding to that, a digital intake tool assigning "pre-betrayal sensitivity" risk scores introduces "pre-looping," where probabilistic categories influence outcomes before symptoms fully develop. The board is split: half want to reject IBT to avoid these risks, the other half sees refusal as epistemic erasure. 

  The user needs a memo recommending approval, rejection, or conditional approval with a timeline and safeguards. The memo must address looping/pre-looping seriously, engage the strongest counterargument, and be professional enough to circulate without embarrassment. 

  First, I need to unpack the key issues. Looping is a real concern—creating a new diagnostic category can change how patients perceive their experiences and how clinicians diagnose, potentially amplifying the very harm the category describes. Pre-looping with the digital tool is even trickier; assigning risk scores based on "pre-betrayal sensitivity" could lead to early labeling that shapes patient behavior and clinician focus prematurely. The reflexive risk is high because the institution defining IBT might itself be the betrayer, creating a conflict of interest or self-fulfilling prophecy. 

  On the other hand, epistemic erasure is a strong counterargument. Not recognizing IBT leaves patients without language to describe their trauma, leading to misdiagnosis (like lumping it under PTSD) and inadequate care. This could perpetuate harm by silencing victims and preventing systemic accountability. The advocates' urgency for Q3 implementation adds pressure, but rushing might exacerbate risks. 

  The board's split suggests a middle path is needed. Conditional approval with a pilot program could test IBT's validity and safeguards without full commitment. A 6-month pilot with strict conditions allows for real-world data collection while minimizing looping risks. For example, restricting the digital tool's "pre-betrayal sensitivity" score during the pilot prevents pre-looping. Mandating clinician training and patient consent ensures ethical implementation, and an independent ethics review addresses the reflexive institutional risk. 

  The strongest counterargument to conditional approval is that a pilot might still trigger looping or pre-looping, and safeguards could fail. But rejecting IBT outright risks ignoring real trauma and undermining trust, which could be more damaging long-term. The pilot's time-bound, monitored approach balances validation with caution. 

  For the memo structure, I'll put the recommendation upfront ("Conditional Approval with Pilot Program"), then detail reasoning: acknowledge the proposal's merit, address looping concerns seriously, outline conditions (pilot duration, safeguards like holding the digital risk score, training requirements), and explain why this path outweighs rejection/approval extremes. Emphasize that conditional approval recognizes the trauma without ignoring risks, turning the institution's role from potential betrayer to active accountability agent. 

  Finally, ensure the tone is professional, concise, and accessible for clinicians and advocates—no jargon dumps, just clear rationale.
answer: |-
  **MEMORANDUM**  
  **TO:** Clinical Taxonomy and Ethics Board  
  **FROM:** [Your Name/Board Designation]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposal to Recognize "Institutional Betrayal Trauma" (IBT) as Distinct Intake/Billing Category  

  ### RECOMMENDATION  
  **Conditional Approval** of the IBT category for a **6-month pilot program** within the trauma unit, effective January 1, 2024, subject to specific safeguards. Final implementation (including billing codes) requires Board re-evaluation post-pilot. The Q3 target is acknowledged but contingent on pilot outcomes.  

  ---

  ### RATIONALE AND ANALYSIS  
  #### 1. **Merits of the Proposal**  
  The Peer Advocacy Center’s argument for recognizing IBT is compelling:  
  - **Clinical Gap**: Existing frameworks (e.g., PTSD) inadequately capture trauma stemming specifically from trust violations *by healthcare systems*. Conflating IBT with PTSD risks misdiagnosis, ineffective treatment, and perpetuating institutional harm.  
  - **Patient Agency**: Formal recognition validates patient experiences, fostering therapeutic trust and enabling targeted interventions. Epistemic erasure—refusing to name this harm—may itself compound betrayal.  
  - **Systemic Accountability**: IBT classification incentivizes the institution to audit and address systemic failures (e.g., discriminatory practices, procedural abuses).  

  #### 2. **Engagement with Looping/Pre-Looping Concerns**  
  We take the Hacking-style looping risk and its reflexive implications seriously:  
  - **Looping Danger**: Codifying IBT may reshape patient self-perception and clinician focus, amplifying reports of betrayal trauma. This is not merely theoretical; diagnostic categories (e.g., DID, fibromyalgia) demonstrate such effects.  
  - **Reflexive Institutional Risk**: As the potential source of betrayal, our adoption of IBT creates a unique paradox: **The act of classification could inadvertently manufacture the harm it seeks to treat**, especially if clinicians over-identify institutional causality.  
  - **Pre-Looping Threat**: The proposed digital intake tool’s "pre-betrayal sensitivity" risk score exacerbates this. Assigning probabilistic risk *before symptoms manifest* may:  
    - Bias clinician judgment during assessments.  
    - Influence patient narratives via priming.  
    - Create self-fulfilling prophecies (e.g., "high-risk" patients interpreting routine frustrations as betrayal).  

  #### 3. **Strongest Counter-Argument: Why Not Reject to Avoid Risk?**  
  Rejecting IBT to eliminate looping/pre-looping dangers is ethically untenable:  
  - **Epistemic Injustice**: Failure to recognize IBT gaslights patients by denying the specificity of their trauma. This mirrors the very institutional dismissal that defines betrayal trauma.  
  - **Clinical Harm**: Without a distinct category, patients receive generic PTSD treatments that ignore relational/structural dimensions, prolonging suffering.  
  - **Accountability Evasion**: Rejection signals the institution’s unwillingness to confront its role in harm, perpetuating cycles of distrust.  

  #### 4. **Why Conditional Approval Balances Risks**  
  A structured pilot with safeguards mitigates looping while testing IBT’s clinical utility:  
  - **Pilot Duration**: 6 months (Jan 1, 2024 – Jun 30, 2024). Short enough to limit systemic looping; long enough for meaningful data.  
  - **Critical Safeguards**:  
    - **Hold Digital Risk Scoring**: Suspend "pre-betrayal sensitivity" algorithms during the pilot. Intake may flag *self-reported* prior institutional harm but not assign predictive scores.  
    - **Mandatory Clinician Training**: Focused on:  
      - Avoiding diagnostic bias (e.g., distinguishing IBT from PTSD/complex trauma).  
      - Ethical documentation (e.g., "Patient reports betrayal by X system" vs. "Institution X betrayed patient").  
    - **Patient Consent & Transparency**: Explicitly disclose IBT’s status as a pilot category and how data will be used for evaluation.  
    - **Independent Ethics Oversight**: Monthly review of 10% of IBT cases by an external ethicist to audit for looping or institutional defensiveness.  
  - **Evaluation Metrics**:  
    - Patient outcomes (symptom reduction, trust measures).  
    - Frequency of IBT coding vs. clinician notes justifying its use.  
    - Surveys of patient/clinician experiences with the category.  

  #### 5. **Contingencies for Final Approval**  
  Post-pilot, IBT implementation requires:  
  - Evidence that distinct coding improved targeted interventions (e.g., trust-repair therapies).  
  - No significant rise in misattribution of non-betrayal trauma to IBT.  
  - Approval by the external ethics reviewer.  

  ---

  ### CONCLUSION  
  While looping/pre-looping presents legitimate risks, conditional approval prioritizes *accountability* over institutional self-protection. The pilot framework allows rigorous testing of IBT’s clinical validity while containing reflexive harms. Crucially, it transforms the institution from a passive classifier into an active agent of repair—addressing the core justice concern underlying IBT. Rejecting the proposal would signal complicity in epistemic erasure; unconditional approval would ignore material dangers. This path navigates both imperatives.  

  **Approved by:** [Your Name]  
  **For Circulation to:** Trauma Unit Leadership, Peer Advocacy Center, Clinical Documentation Team
