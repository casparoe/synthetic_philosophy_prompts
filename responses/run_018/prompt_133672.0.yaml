  I'll structure this as a numbered list with clear headings for office hour use. The key is to show that while behavioral underdetermination is defensible, it doesn't entail that all manuals are equally valid - only that evidence can't uniquely determine one. The stronger claims either don't follow or collapse into problematic skepticism.

  For the mental/neural facts claim, I should note this is more contentious and aligns with Quine's rejection of mentalism. But even this doesn't make all manuals equally valid. Ontological relativity might support some arbitrariness but still allows for correctness within frameworks. Global skepticism is self-undermining and false.

