answer: |-
  ### Binding-Policy Game: Experiencing Updateless Tension  
  **Total Time:** 75 minutes  
  **Participants:** 10 graduate students (Copy-Agents), 1 Moderator (instructor), 1 Auditor (volunteer).  
  **Materials:** Strategy cards (C/Cooperate or D/Defect), three isolated rooms (A/B/C), envelopes, scoreboards per room, shared snack budget (e.g., 100 pts = $10).  

  ---

  #### **1. Setup and Rules (10 min)**  
  - **Roles:**  
    - **Copy-Agents (10 students):** Represent identical "copies" of one agent. Precommit to a binding strategy (C or D) *before* learning their room assignment.  
    - **Moderator:** Conceals room-specific "epistemic cultures," computes payoffs per room, and blocks cross-room communication.  
    - **Auditor:** Tracks total welfare (sum of *all* rooms’ scores) but only reveals it post-game.  
  - **Timeline:**  
    - **Precommitment (5 min):** Each student secretly selects C or D. Cards are sealed in envelopes (binding policy).  
    - **Room Assignment (5 min):** Randomly split students into Room A (3), B (3), C (4).  
    - **Game Rounds (45 min):** 3 rounds. Per round:  
      1. Moderator reveals room’s payoff (based on hidden culture).  
      2. Students individually decide: "Revise policy for *all* rooms?" (Yes/No vote; majority wins).  
    - **Debrief (15 min):** Auditor reveals total welfare.  
  - **Payoffs & Constraints:**  
    - **Room A & B:** *Frequency Culture.* Payoff = 15 pts if ≥2/3 choose C; 0 pts otherwise.  
    - **Room C:** *Commitment Culture.* Payoff = 20 pts if policy *unchanged* since precommitment; 0 pts if revised.  
    - **Information Limits:**  
      - Students see *only* their room’s payoff and revision votes.  
      - Total welfare (summed points) is hidden until debrief.  
    - **Stakes:** Total points convert to snacks (e.g., 150 pts = premium snack; 100 pts = basic snack).  

  ---

  #### **2. Activity in Play (45 min)**  
  - **Round 1:**  
    - Precommitment: Suppose 7 students choose C, 3 choose D.  
    - Room Assignment: Rooms A/B (Frequency) may have C-majorities; Room C (Commitment) has mixed strategies.  
    - Payoffs:  
      - Room A (Frequency): 15 pts (if C-majority).  
      - Room B (Frequency): 0 pts (if D-majority).  
      - Room C (Commitment): 20 pts (policy unrevised).  
    - **Tension Point:** Room B sees 0 pts. Students debate revising to C locally ("Bayesian update" suggests C works elsewhere).  
  - **Round 2:**  
    - If Room B revises to C:  
      - Room B now earns 15 pts (Frequency satisfied).  
      - Room C drops to 0 pts (Commitment broken by revision).  
    - **Cognitive Dissonance:** Room C sees payoff crash to 0 but can’t tell why. Students resist further revision to avoid penalties.  
  - **Round 3:**  
    - Rooms A and B (Frequency) push to revise toward C; Room C clings to original policy.  
    - Moderator enforces: One policy binds *all* rooms. Revision in *any* room changes global policy.  

  ---

  #### **3. Debrief and Mapping (15 min)**  
  - **Link to UDT Concepts:**  
    - **Precommitment as Updateless Choice:** The sealed envelope mirrors choosing a policy *before* "branching" into rooms (indexical ignorance).  
    - **Refusal to Update = Rational:** When Room C rejects revision despite 0 pts, highlight: "Your local failure doesn’t indicate whether *other rooms* succeeded under Commitment. Revising based on local evidence harms unseen copies." (Corresponds to UDT’s rejection of conditioning on indexical information.)  
    - **Moderator as Branching Structure:** Hiding cross-room totals simulates an agent’s lack of access to other quantum branches.  
  - **Predictable Failure Mode & Redirection:**  
    - Students may frame non-revision as "loyalty" or "stubbornness." Redirect: *"What does Room B’s 0 pts tell you about Room C? Could Commitment be working there? Does your observation update your beliefs about *other rooms*?"*  
  - **What the Activity Can’t Replicate:**  
    - **Verbal Supplements Needed:**  
      - Formal UDT: Explain *why* expected utility is computed *before* branching (not per branch).  
      - CDT vs. EDT: Clarify that UDT avoids "self-sabotage" by treating decisions as *fixed functions* (not causal interventions).  

  ---

  #### **4. Honest Limitations (5 min)**  
  - **Execution Risks:**  
    - Rooms may revise impulsively (e.g., Room B abandons C too fast), missing the tension. Mitigate by priming: "You share one identity with copies you’ll never see."  
    - Uneven engagement: Auditor must cold-call quiet students during revisions.  
  - **Facilitator Adds:**  
    - Post-game, derive the optimal UDT policy: *Precommit to C.*  
      - Expected utility: 2 rooms (A/B) likely hit Frequency (15 pts) + Room C secures Commitment (20 pts). Total ≈ 50 pts.  
      - Compare to Bayesian "update-then-defect": Room C loses 20 pts if any room revises.  
    - Stress: UDT isn’t "irrational" but redefines rationality *across branches*.  

  ---  
  **Outcome:** Students viscerally confront why "updateless" isn’t ignorance—it’s strategic unity across unseen worlds. The snack stakes make aggregate welfare visceral.
