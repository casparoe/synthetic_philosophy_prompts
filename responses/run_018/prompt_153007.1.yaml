prompt: |-
  Design a 75-minute seminar activity for ten graduate students in philosophy of science that forces them to experience the tension in updateless decision theory—specifically, why an agent with identical copies across branches might rationally precommit to a policy and then refuse to update on her local observation, even when Bayes’ rule seems to demand it. Do not begin with a lecture on the view; arrange the rules, roles, and payoffs so the group runs into the problem before anyone names it.

  Frame the exercise as a “Binding-Policy Game” across three parallel rooms. Before any information is revealed, each student secretly selects a strategy card (Cooperate or Defect) that binds all of her “copies” in every room. After cards are locked, each student is randomly assigned to exactly one room and shown only that room’s outcome, which depends on a hidden moderator: whether the room’s “epistemic culture” weights observed frequencies or prior commitments. The student must then choose whether to revise her strategy for future rounds based solely on her local observation, or to maintain the original binding policy across all copies—including those she never observes. Structure the payoff matrix so that local Bayesian updating maximizes the individual room’s score, but maintaining the global precommitment maximizes total welfare summed across all copies. Use explicit roles—Copy-Agents (the students), a Moderator who controls information flow between rooms, and an Auditor who tracks cross-room consistency—and attach small real stakes (point totals that convert to a shared snack budget).

  In the debrief, map specific moments onto UDT concepts: the instant a Copy-Agent realizes her local update would harm her unobserved twin corresponds to the refusal to condition on indexical evidence; the Moderator’s refusal to reveal cross-room totals mirrors the agent’s lack of access to other branches. Be explicit about the predictable failure mode—students will likely conflate the refusal to update with mere stubbornness or group loyalty—and instruct the facilitator to redirect by asking what evidence, exactly, the local observation provides about the other rooms. Finally, be frank about what the activity cannot reproduce: the formal derivation of expected utility across copies, and the precise distinction between evidential and causal decision theory that underwrites the paradox; the facilitator must supply those verbally.

  Prescribe the response in this order:
  1. Setup and rules (approx. 250 words): setting, roles, timeline, payoff structure, information constraints.
  2. The activity in play (approx. 200 words): round-by-round flow, decision points, and how the hidden moderator operates.
  3. Debrief and mapping (approx. 250 words): linking game moments to UDT, handling the predicted failure mode, and the feature the activity cannot reproduce.
  4. Honest limitations (approx. 100 words): what will likely go wrong in execution and what the facilitator must add.

  Keep the prompt focused; do not request bibliographies, citations, or reading lists.
reasoning: |-
  We are designing a 75-minute seminar activity for 10 graduate students in philosophy of science. The goal is to make them experience the tension in updateless decision theory (UDT) without starting with a lecture. The activity is called the "Binding-Policy Game" and takes place across three parallel rooms.

  1. Setup and Rules (approx. 250 words):
     - Setting: Three adjacent rooms (Room A, B, C). Each room has a table and chairs. A central area for initial grouping.
     - Roles:
          - 10 Copy-Agents (the students): Each is a copy of the same agent. They will be split into the three rooms (with room assignments of, say, 3, 3, 4 to have roughly equal sizes).
          - Moderator: Controls information flow, knows the hidden "epistemic culture" of each room (which determines how outcomes are generated), and reveals only the necessary information.
          - Auditor: Tracks the choices and payoffs across all rooms, ensuring consistency and calculating the total welfare. The Auditor does not reveal cross-room information until the end.
     - Timeline: 
          - (0-10 min) Introduction: Explain the game rules without giving away the philosophical point. Emphasize that each student is a copy of the same agent and they must choose a binding policy for all copies. They will play 3 rounds.
          - (10-15 min) Precommitment: Each student secretly chooses a strategy card (Cooperate or Defect). All cards are collected and locked in an envelope by the Moderator. This represents the binding precommitment.
          - (15-20 min) Room Assignment: Randomly assign students to the three rooms (without revealing the assignment to others). Each room then has its own isolated session.
          - (20-50 min) Rounds: In each room, the Moderator (who knows the room's "epistemic culture") reveals the outcome of that room based on the precommitted strategies and the hidden culture. The outcome is presented as a score for the room. Then, each student in the room is asked individually whether they want to revise the strategy for future rounds (but note: the revision would apply to all copies in all rooms, because they are the same agent) or stick to the original binding policy. The Moderator does not reveal the other rooms' outcomes or the total welfare.
          - (50-65 min) Repeat for 3 rounds (with the same room assignments and same binding policy unless revised). After each round, the room gets a score based on the local outcome.
          - (65-75 min) Debrief: The Auditor reveals the total welfare (sum of all rooms) and the individual room scores. Then the philosophical discussion begins.

     - Payoff Structure:
          - The payoff for a room depends on the strategy chosen (C or D) and the room's hidden "epistemic culture". There are two types of cultures:
              - Frequency Culture: The room's outcome is determined by the proportion of C in the room. For example: if at least 2/3 of the room chose C, then everyone in the room gets 10 points; else, 0 points.
              - Commitment Culture: The room's outcome is determined by whether the original binding policy was maintained (i.e., no one in the room revised). If the policy was maintained, then everyone gets 15 points; else, 0 points.
          - The Moderator assigns the cultures to the rooms at the beginning (without revealing which is which). Example assignment: Room A and B are Frequency, Room C is Commitment.
          - Note: The individual room's score is what the students see. The total welfare is the sum of all points across all rooms.

     - Information Constraints: 
          - Students know the rules and the two types of cultures, but not which room has which culture.
          - They know that the original binding policy is chosen without knowing the room assignment or the cultures.
          - In each room, they see only their own room's outcome and their own room's revision decisions.

  2. The Activity in Play (approx. 200 words):
     - Round-by-round flow:
          - Round 1: After precommitment and room assignment, the Moderator in each room reveals the outcome for the room based on the precommitted strategies and the room's culture. For example, in a Frequency room, if 3 out of 4 chose C, then they get 10 points (if the threshold is 2/3). In a Commitment room, since no one has revised yet, they get 15 points. Then, each student in the room is asked: "Do you wish to revise the binding policy for all copies in all rooms for the next round? You can change from C to D or D to C, or keep the same." They vote secretly, and the majority vote determines the new binding policy (if they revise) or they stick to the original. The Moderator records the decision and the new policy (if changed) and then informs the Auditor.
          - Round 2: The same process. The outcome is computed using the current binding policy (which might have been revised) and the room's culture. Then again, they decide whether to revise for the next round.
          - Round 3: Same as above, but after the third round, the game ends.
     - The hidden moderator (in each room) uses the preassigned culture to compute the outcome. The cultures are fixed for the entire game.

     - Decision Points: 
          - The key tension: In a Frequency room, if they see they got 0 points because not enough C, they might be tempted to switch to C. But if they switch, then in a Commitment room, if they were getting 15 points because they maintained, now they might lose it because the policy was revised (even if the revision was from another room). The students must decide based on their local observation, but their decision affects all rooms.

  3. Debrief and Mapping (approx. 250 words):
     - After revealing the total welfare and room scores, the facilitator links the experience to UDT:
          - The precommitment phase represents the updateless decision: the agent chooses a policy without knowing which branch (room) she will be in.
          - The refusal to update: When a student in a Frequency room (that got 0 points) considers revising, but realizes that revising might harm the copies in the Commitment room (who are getting 15 points by maintaining the policy), that corresponds to the UDT agent refusing to condition on indexical evidence (which room she is in) because the policy is designed for the aggregate welfare.
          - The Moderator's role: By not revealing the other rooms, it mirrors the agent's lack of access to other branches in quantum or multiverse scenarios.
          - The Auditor's role: Calculating the total welfare represents the global perspective of the agent who cares about the sum of utilities across copies.
     - Handling the failure mode: Students might think that not updating is about being stubborn or loyal to the group. The facilitator should redirect by asking: "What does the fact that your room got 0 points tell you about the other rooms? Does it tell you anything about their culture or the success there?" The point is that the local observation (e.g., low frequency in their room) does not provide information about the other rooms' cultures or outcomes, so updating the policy based on it is not justified and might be harmful to the overall welfare.
     - The activity cannot reproduce the formal derivation of expected utility across copies, nor the precise distinction between evidential and causal decision theory. The facilitator must explain that in UDT, the agent does not update on indexical information (like which branch she is in) because the policy is chosen to maximize expected utility from a pre-branching perspective, and that conditioning on being in a particular branch would break the precommitment that was designed for the whole.

  4. Honest Limitations (approx. 100 words):
     - What might go wrong: The random room assignment might lead to uneven groups, and the hidden cultures might not be experienced as intended (e.g., if by chance the precommitment works well in all rooms, there is no tension). Students might not grasp the global effect of their revision because they never see the other rooms until the end. The voting mechanism might lead to groupthink within the room.
     - What the facilitator must add: Verbally explain the formal framework of UDT after the activity, including how expected utility is computed across branches and why updating on indexical information is rejected. Also, clarify the difference between evidential and causal decision theory in this context, as the activity does not model causal separability between branches.

