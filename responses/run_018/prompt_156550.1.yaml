  The user's deeper need is to understand the performative aspect of reactive attitudes that philosophy might abstract. They want their novel to show how societal expectations force emotional performances for moral membership. The funeral scene's heat and Meursault's discomfort with rituals can illustrate the pressure to perform grief. In the trial, the prosecutor's rhetoric shifts from the murder to Meursault's character, showing how the community uses his emotional failure to exclude him. The chaplain's intrusion triggers Meursault's resentment, highlighting his fight for autonomy even as he rejects remorse.

  For their own fiction, the user should focus on scenes where societal figures (like a judge or religious leader) condemn the protagonist for emotional non-conformity, not just the crime. Use physical sensations (heat, light, confinement) to mirror moral suffocation. The protagonist's selective resentment can be shown through intense reactions to those denying their autonomy, while indifference elsewhere. The execution's procedural nature can symbolize the shift from moral judgment to bureaucratic elimination.

