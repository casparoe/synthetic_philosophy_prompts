answer: |-
  ### Lesson Plan: Decision Theory with a Modified Newcomb's Problem

  **Case Setup:**  
  Use a single predictor (Alpha) with the following properties:  
  - For the general population: 95% accurate.  
  - For decision theory students: 70% accurate (due to "theory-shopping" in the 30-second clip).  
  - Opaque box: Contains $1,000,000 if Alpha predicts one-boxing, else $0.  
  - Clear box: Contains $1 (visible).  
  Boxes are filled before the student enters, and the student knows their group (decision theory class) affects accuracy. Beta (80% accurate) is omitted for time and clarity—it adds noise without pedagogical value.  

  **Why this case?**  
  - **Accuracy variance:** The 70% accuracy for students creates tension—EU slightly favors one-boxing, but dominance still pulls toward two-boxing. A flat 90% accuracy makes EU too dominant, collapsing the debate.  
  - **Box values:** $1 in the clear box ensures EU favors one-boxing (if accuracy >50%). If the clear box were $100,000, EU could favor two-boxing, undermining the tension.  
  - **No prior exposure:** Custom accuracy twist prevents encyclopedia lookups.  

  **Table: Lesson Stages**  

  | Stage | What I Actually Do or Say                                                                                              | Leans On          | Misconception Defused                                                                 | Minutes |
  |-------|------------------------------------------------------------------------------------------------------------------------|-------------------|---------------------------------------------------------------------------------------|---------|
  | 1     | **Introduce the case:** "You face two boxes: a clear one with $1 and an opaque one that may hold $1M or $0. A predictor watched a 30s clip of you thinking. It’s 95% accurate for most people but only 70% accurate for decision theory students—like you. Boxes are already filled: if it predicted you’d take only the opaque box, $1M is inside; otherwise, it’s empty. What do you do?" | None              | None (sets up stakes)                                                                 | 5       |
  | 2     | **Pair discussion:** "Turn to a partner: argue for one-boxing or two-boxing. What’s your gut reason?"                  | Stage 1           | None (elicits initial pull)                                                           | 5       |
  | 3     | **Poll and share:** "Raise hands: one-box? Two-box? [Record counts]. Sam (one-boxer), why? Alex (two-boxer), why?" List reasons on board. | Stage 2           | None (surfaces misconceptions)                                                        | 10      |
  | 4     | **Formalize dominance argument:** "Alex says: ‘The boxes are fixed. If $1M is there, two-boxing gets $1M+$1; if empty, it gets $1. Either way, I gain $1 extra. Why leave free money?’" | Stage 3 (Alex)    | *"Boxes are full, so take both"* (shows this is a reasoned argument, not a shrug)     | 5       |
  | 5     | **Formalize EU argument:** "Sam says: ‘But the predictor is 70% accurate for us. If you one-box, 70% chance it predicted that and $1M is there—so EU = $700k. If you two-box, 70% chance it predicted that and the box is empty—so EU = 30%($1M) + $1 = $300,001. One-boxing wins by $400k.’" | Stage 3 (Sam)     | *"My choice causes the prediction"* (EU uses evidence, not causation: prediction came first) | 10      |
  | 6     | **Deepen tension:** "So: dominance says two-boxing always gives +$1. EU says one-boxing averages +$400k. Which feels right? Discuss." | Stages 4–5        | *"This is determinism"* (accuracy ≠ determinism: 30% error leaves room for freedom)   | 8       |
  | 7     | **Defuse misconceptions:** <br>- "Wait—can I ‘trick’ the predictor by deciding last-second?" → "No. It saw your clip already; your ‘last-second’ self is part of that." <br>- "But if I one-box, doesn’t that cause the $1M to be there?" → "No. The prediction—and box—were fixed before you entered." | Stages 3–6        | *"Make up my mind last instant"* and *"Choice causes prediction"*                     | 5       |
  | 8     | **Final question:** "Regardless of your choice, what’s the core disagreement? Is it about evidence vs. dominance? Time? Causation?" | Stages 4–7        | None (tests conceptual grasp)                                                         | 2       |

