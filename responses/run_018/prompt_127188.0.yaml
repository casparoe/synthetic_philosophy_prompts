answer: |-
  ## Semantic Inertia Workshop Q&A Prep Sheet  
  *(Ordered by Descending Damage Potential)*  

  ---

  ### **Objection 1 (Textualist/Originalist Camp)**  
  **Framing:** "Your ambiguity exception is a Trojan horse for judicial policymaking. By letting courts *decide* what counts as 'genuine linguistic ambiguity,' you recreate the discretion textualism exists to eliminate. If 'purposive tension' isn’t enough to trigger displacement, but judges get to define the ambiguity threshold, haven’t you just substituted one form of activism for another?"  
  **Reply (2 min):** "The threshold isn’t judicial discretion—it’s *linguistic* constraint. Genuine ambiguity exists only when the public meaning at enactment yields *multiple plausible applications* to the facts, judged by ordinary language conventions, not policy consequences. This is analogous to contractual *contra proferentem*, where ambiguity must be objective. Courts don’t ‘decide’ ambiguity; they *diagnose* it using corpus linguistics or period dictionaries. If the text hooks onto reality unambiguously, inertia holds—no judicial override."  
  **Weakness:** Relies on "objective" linguistic tools that skeptics argue still require judicial interpretation.  

  ---

  ### **Objection 2 (Purposivist/Regulatory Camp)**  
  **Framing:** "Semantic inertia is originalism with a blindfold. Agencies face novel technologies, markets, and risks daily. Freezing meaning at enactment ignores that Congress *delegates* precisely because it can’t foresee complexity. Your theory would paralyze agencies, forcing absurd or dangerous outcomes when a statute’s purpose is clear but its 1950s text doesn’t ‘fit’ a 2024 problem."  
  **Reply (2 min):** "Inertia constrains *interpretation*, not *implementation*. Where text unambiguously covers a new technology (e.g., ‘vehicle’ includes e-scooters), agencies apply it. Where it’s truly ambiguous *linguistically* (e.g., ‘source’ in pollution statutes), agencies may use discretion. But where text *unambiguously excludes* a modern application (e.g., ‘telegraph’ doesn’t cover email), inertia demands Congress—not agencies—update the law. Democracy requires that gap-filling for clear textual limits be legislative."  
  **Weakness:** Downplays how often agencies confront texts that are neither clearly applicable nor excludable.  

  ---

  ### **Objection 3 (Textualist/Originalist Camp)**  
  **Framing:** "Your ‘democratic legitimacy’ grounding collapses. If courts can override inertia upon finding ‘ambiguity,’ but ambiguity is rare under your test, most statutes will be rigidly enforced even when they produce absurd results *within the enacted text’s own purpose*. That undermines legitimacy more than judicious purposivism."  
  **Reply (2 min):** "Absurdity is already a textualist exception, but it’s narrow and linguistic—focusing on outcomes *no reasonable speaker* would intend. Inertia incorporates this. Crucially, ‘absurdity’ can’t be policy-driven; it must flow from the text’s *self-defeat* in context. Democratic legitimacy means enforcing the deal *as written*, not as judges wish it were written. Congress can fix textual oversights; it can’t fix judicial overrides."  
  **Weakness:** Originalists may counter that "absurdity" is still a purposive backdoor.  

  ---

  ### **Objection 4 (Purposivist/Regulatory Camp)**  
  **Framing:** "The default-rule analogy fails. Contracts bind *mutually assenting parties*; statutes bind the public. Default rules in contracts are gap-fillers for private ordering. Statutes are sovereign commands with coercive force. Treating them like boilerplate ignores the state’s duty to govern effectively when text and policy clash."  
  **Reply (2 min):** "The analogy targets *function*, not ontology. Like a contractual default, semantic inertia is the baseline that governs unless specifically displaced—here by linguistic ambiguity, not policy. The ‘sovereign command’ point reinforces inertia: if Congress’s authority stems from the *text it enacted*, subverting that text without genuine ambiguity usurps democratic sovereignty. Effective governance requires fidelity to enacted law, not ad hoc judicial/admin adjustments."  
  **Weakness:** Doesn’t fully address how "sovereign commands" differ in longevity and scope from contracts.  

  ---

  ### **Objection 5 (Textualist/Originalist Camp)**  
  **Framing:** "You claim to reject speaker intent, but your ‘public meaning at enactment’ is originalism. Why not just admit you’re repackaging original public meaning (OPM) with a thinner exception for ambiguity—which Scalia already endorsed? What does ‘inertia’ add besides metaphor?"  
  **Reply (2 min):** "Inertia centers *textual authority*, not meaning as a proxy for intent. OPM often smuggles in intent (e.g., via ‘context’ debates). Inertia asks solely: ‘Did this text publicly mean X in context Y?’ If yes, it binds *because Congress enacted it*, not because we reconstructed intent. The ‘default rule’ framing emphasizes that displacement requires *positive evidence of linguistic indeterminacy*, not just policy dissatisfaction. This tightens constraint."  
  **Weakness:** Originalists may see this as semantic distinction without practical difference.  

  ---

  ### **Objection 6 (Purposivist/Regulatory Camp)**  
  **Framing:** "Your theory assumes statutory meaning is stable. But language evolves, and agencies *must* interpret dynamically. A 1934 statute’s ‘interstate commerce’ had a fixed meaning then, but its *application domain* legitimately expanded with the economy. Inertia would fossilize law, forcing constant congressional amendments for basic functionality."  
  **Reply (2 min):** "Meaning *at enactment* is stable. If ‘interstate commerce’ unambiguously covered trains but not digital data streams in 1934, inertia says courts can’t *redescribe* data streams as ‘commerce’ today absent ambiguity. But Congress can update statutes, delegate broader authority, or use open terms (‘transportation’). Agencies retain flexibility within unambiguous semantic bounds. Stability isn’t fossilization—it’s predictability and democratic accountability."  
  **Weakness:** Underestimates how often terms have "fuzzy edges" that agencies must resolve without clear ambiguity.  

  ---

  ### 🔥 **The Objection You Hope Nobody Raises**  
  **Objection (Hybrid):** "**Your entire system implodes because ‘genuine linguistic ambiguity’ is a mirage. All statutory application involves context-laden judgment. Your ‘threshold’ pretends ambiguity is objective, but even your examples (corpus linguistics, dictionaries) require interpretive choices *about* context and relevance. Semantic inertia thus defaults to judicial discretion—the very problem you aimed to solve.**"  
  **Why It’s Fatal:** This attacks the keystone of your thesis—that ambiguity can be objectively identified and distinguished from policy-driven "tension." If all ambiguity determination is itself interpretive, your constraint mechanism vanishes, and inertia collapses into a rhetorical device masking judicial subjectivity. Your reply ("Linguistic conventions provide objective benchmarks") would struggle because conventions *also* require interpretation. No crisp "threshold" exists in practice.  

  ---

  **Preparation Tip:** For each reply, pivot back to your core pillars: (1) Default status of enacted text, (2) Ambiguity as narrow linguistic exception, (3) Democratic authority over policy updating. Concede weaknesses frankly but frame them as implementation challenges, not theoretical flaws.
