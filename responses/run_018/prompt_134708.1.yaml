answer: |-
  You've hit on a brilliantly observed and genuinely problematic asymmetry in *some* interpretations of Buddhist ethical reasoning, particularly in popular discourse or debates about "skillful means" (*upāya*). This isn't just "intention matters" (*cetanāhaṃ bhikkhave kammaṃ vadāmi* - "Intention, monks, I declare to be kamma"). It's a specific **meta-logical move** where the purity of intention functions as an absolute gatekeeper, fundamentally altering how consequences are permitted to factor into moral evaluation.

  **Yes, this pattern exists, and it deserves a sharp label. There isn't a single universally accepted term, but we can name it precisely.**

  Here's the breakdown and the proposed terminology:

  1.  **The Pattern You Describe:**
      *   **Pure Intention (e.g., Unalloyed Compassion):** Bad consequences (like harm from a harsh rebuke or deception) are *morally erased* or deemed "non-sticky karmically" for the *actor*. The *action* is justified *despite* the negative outcome. The purity acts as a *karmic solvent* for negative results.
      *   **Impure Intention (e.g., Trace of Anger/Pride):** Good consequences (like the student benefiting from the harsh teaching or lie) are *morally discounted* or deemed insufficient to justify the action. The action is condemned *despite* the positive outcome. The impurity acts as *karmic contamination* nullifying the positive result.
      *   **The Switch:** Mental state purity isn't *one factor weighed alongside consequences*; it acts as a *binary gatekeeper*. If pure, negative consequences are barred from entering the moral evaluation room. If impure, positive consequences are barred. Only one type of consequence is "allowed in" depending on the mental state switch's position.

  2.  **Why it's Distinct:**
      *   **Vs. Standard Consequentialism:** Consequences are *paramount*. Mental states matter only insofar as they reliably *cause* good or bad results. Here, consequences are rendered irrelevant based on the mental state *alone*.
      *   **Vs. Standard Buddhist Intention-Primacy:** While intention (*cetanā*) is the seed of kamma, Buddhism *does* acknowledge *vipāka* (result/fruition) and often discusses the *suffering caused* as part of the evaluation (e.g., the criteria for "Right Speech" include truthfulness, helpfulness, timeliness, *and spoken with a mind of goodwill*). The standard view weighs intention *and* foreseeable consequences together for the actor (karmic result for the *recipient* is more complex). This pattern *decouples* them asymmetrically.
      *   **Vs. Virtue Ethics:** While Buddhist ethics shares features with virtue ethics (focus on character/mental states), virtue ethics generally considers the *entire action* (intention, act, consequence) as reflective of character. This pattern isolates the mental state and uses it to veto the relevance of consequences.

  3.  **Established Concepts it Relates To (But Isn't Identical To):**
      *   **Parivṛtti (Overturning - Yogācāra):** The idea that a pure mind can "overturn" the basis (*āśraya*) of experience, transforming perception. This is deep metaphysics/psychology, not typically applied as an *ethical loophole* for specific actions in the way you describe.
      *   **Cittaviśuddhi (Mental Purification - Theravāda):** Purification of mind is central, but it's the *process* leading to liberation, not usually presented as a mechanism to *ignore* the harmful results of unskillful verbal/bodily actions *within* the conventional world.
      *   **Śūnyatā (Emptiness) Applied Uncritically:** Misapplying emptiness to dismiss conventional ethical distinctions ("it's all empty, so consequences don't *really* matter if my mind is pure") is a known danger warned against (e.g., in the *Kaccānagotta Sutta*). This pattern can be a manifestation of that.

  4.  **The Coined Term: Intentional Override Principle with Asymmetric Moral Weighting (IOP/AMW)**

      *   **Intentional Override Principle (IOP):** This captures the core mechanism – the pure mental state *overrides* the negative consequences in moral evaluation, acting as a decisive switch. It "overrides" the usual karmic link between unskillful action and negative result *for the actor*.
      *   **Asymmetric Moral Weighting (AMW):** This highlights the crucial imbalance. Purity doesn't just *mitigate* bad results, it *nullifies* their moral relevance for the actor. Impurity doesn't just *diminish* the value of good results, it *nullifies* their justificatory power. The "weighting" isn't balanced; it's an on/off switch applied differently to good vs. bad outcomes based on mental state.

  **Why this term works:**

  *   **Sharp Edges:** It explicitly names the "override" function and the "asymmetric weighting."
  *   **Inside/Outside:** Focuses on the *internal* mental state ("Intention") dictating how *external* consequences ("Outcome") are permitted to factor in ("Override," "Weighting").
  *   **Distinction:**
      *   **Consequentialism:** Weighs *external* results primarily.
      *   **Standard Buddhist View:** Weighs *internal* intention primarily, but acknowledges *external* results as karmic fruit (*vipāka*) and within conventional evaluation frameworks (like criteria for skillful speech/action).
      *   **IOP/AMW:** Uses *internal* state as a *gatekeeper* determining whether *external* results are *allowed into* the moral evaluation at all, applying an *asymmetric rule* (bad results ignored if pure, good results ignored if impure).

  **In essence:** Under IOP/AMW, pure intention becomes a *karmic get-out-of-jail-free card* for causing harm, while impure intention becomes a *karmic disqualifier* for achieving good. It turns mental purity into a kind of *moral Teflon* for negative results and impurity into *moral flypaper* trapping actions regardless of positive results.

  This pattern *is* observable in debates, often functioning as a convenient but ethically dubious justification for questionable behavior by authorities ("My harshness was pure compassion!") or a tool for excessive scrupulosity ("My helpful act had a flicker of pride, so it was bad!"). Recognizing it as "Intentional Override with Asymmetric Moral Weighting" provides the sharp tool you need to dissect it. It highlights a potential deviation from the more integrated view found in core texts, where intention *generates* kamma, but the kammic results (for all involved) are an inherent, non-negotiable part of the process (*kamma-vipāka*), and where skillful action considers *both* the mind *and* the likely impact in the world.
