  We are evaluating a new request: a stratified micro-public of 200 citizens, selected by sortition, completed an eight-week deliberative process on climate policy, reaching 80% consensus on a regulatory framework. However, current polling shows 55% of the general population opposes this framework. There was no broader referendum or petition; participation was limited to the 200 jurors, though the selection was representative and proceedings transparent.

  We must be consistent with our four precedents:

  1. **Constitutional Referendum (Approved):** 62% approval, 78% turnout, 6 months of public debate. Reasoning: sustained deliberation + broad direct participation = authoritative expression.

  2. **Rushed Parliamentary Bill (Rejected):** Bill rushed through committee with closed-door meetings with lobbyists; polls showed 60% public opposition. Reasoning: neither representative authority nor passive numerical preference compensates for lack of transparency and inclusive reflection.

  3. **Municipal Zoning Change (Approved with conditions):** Town council held 18 months of open forums, revised based on feedback. Contradicted a 3-year-old referendum with only 30% turnout. Reasoning: updated, deeply deliberative process reveals more authentic will than outdated, low-participation vote.

  4. **Viral Petition (Rejected):** 70% of registered voters signed in one week via viral social media. Reasoning: velocity and emotional contagion undermine reflective judgment; magnitude alone is insufficient.

  Now, let's analyze the new case in light of these precedents.

  **Step 1: Identify the closest analog**

  - The new case involves a micro-public (200 citizens) selected by sortition (random, representative selection) that engaged in an 8-week deliberative process with expert testimony. This is a form of **deliberative democracy** that is focused, representative, and transparent.

  Comparing to precedents:

  - Precedent 1: Broad direct participation (high turnout) and long public debate. The new case has no broad participation; only 200 jurors.
  - Precedent 2: Rejected due to lack of transparency and inclusive reflection. The new case has transparency and inclusive reflection within the micro-public, but not the broader public.
  - Precedent 3: Approved a deliberative process (open forums over 18 months) by a representative body (town council) even though it contradicted an older, low-turnout referendum. This is similar because it values an updated deliberative process over an outdated direct vote, even without a new referendum.
  - Precedent 4: Rejected a petition due to speed and emotional contagion, despite high participation. The new case is the opposite: slow, deliberative, and not driven by emotion.

  The closest analog is **Precedent 3**. In that case, we approved a decision made after a long, open, and deliberative process (by the town council) even though it contradicted an earlier referendum. Similarly, here we have a deliberative body (the citizen jury) that reached a decision after 8 weeks of deliberation, and it contradicts current polling (which we might view as a form of passive, non-deliberative expression). Precedent 3 also downplays the importance of a prior direct vote (the referendum) in favor of a more recent and deliberative process.

  **Step 2: Check if precedents underdetermine the outcome**

  Our precedents do not directly address a case where a micro-public (selected by sortition) makes a decision without any broader participation. Precedent 3 involved a representative body (elected town council) and broad public forums. Precedent 1 involved a direct vote with broad participation. The new case is a hybrid: it has a representative sample (so it's like a mini-public) but without the direct participation of the whole electorate.

  Therefore, the precedents underdetermine the outcome because:

  - Precedent 1 emphasizes broad participation, which is absent here.
  - Precedent 2 condemns non-transparent and non-inclusive processes, but this one is transparent and inclusive within the micro-public, but not the broader public.
  - Precedent 3 supports a deliberative process by a representative body, but the town council is an elected body with ongoing legitimacy, whereas the micro-public is an ad hoc body.
  - Precedent 4 rejects high-magnitude but non-reflective expression, but this case has reflective expression by a small group.

  Thus, we must derive rules that fit all four precedents.

  **Step 3: Articulate two plausible rules that fit all four rulings**

  We need rules that explain when we approve or reject a decision as an expression of the popular will.

  **Rule A (Deliberative Legitimacy Rule):** A decision is legitimate if it results from a process that is (1) inclusive (in terms of representation and opportunity for input), (2) transparent, and (3) sufficiently deliberative (involving reflection, expert input, and revision). The scale of participation (i.e., how many directly participated) is secondary to the quality of deliberation and representativeness.

  This rule fits:

  - Precedent 1: Approved because it had broad participation (inclusiveness) and deliberation (6 months of debate), plus transparency (implied by public debate).
  - Precedent 2: Rejected because it lacked transparency and inclusive reflection (closed-door meetings with lobbyists, no public input).
  - Precedent 3: Approved because the town council held open forums (inclusive and transparent) and revised the proposal (deliberative), even though the prior referendum had low turnout (so scale alone isn't enough) and was outdated.
  - Precedent 4: Rejected because it lacked deliberation (due to velocity and emotional contagion) even though it had high participation.

  **Rule B (Broad Participation Rule):** A decision is legitimate only if it either (a) involves broad direct participation (like a referendum with high turnout) or (b) is made by an elected representative body that has undergone a transparent and deliberative process with broad input. Micro-publics without a direct mandate or without being an elected body are insufficient unless they are coupled with a broader expression of will (like a referendum).

  This rule fits:

  - Precedent 1: Approved because it had broad direct participation (referendum with 78% turnout).
  - Precedent 2: Rejected because it was made without broad input (closed-door) and without broad participation (only committee), and even though it was by elected representatives, the process was flawed.
  - Precedent 3: Approved because it was by an elected representative body (town council) that held open forums (broad input and transparency) and deliberated. The prior referendum had low turnout so it was not a strong expression.
  - Precedent 4: Rejected because it was not by an elected body and lacked deliberation, even with broad participation.

  Rule B is more restrictive on micro-publics because it requires either broad participation or an elected body.

  **Step 4: Apply the rules to the new case**

  - **Rule A (Deliberative Legitimacy):** 
    - The micro-public was selected by sortition to be representative (inclusive in representation).
    - The process was transparent and included adversarial expert testimony (deliberative).
    - It had 8 weeks of deliberation (sufficiently sustained).
    - Therefore, Rule A would approve the decision as an expression of the popular will, despite the opposition in current polling (which lacks deliberation).

  - **Rule B (Broad Participation Rule):**
    - The decision was made by a micro-public (not an elected body) and without any broader direct participation (no referendum).
    - Even though the process was representative and transparent, it lacks the broad participation or the legitimacy of an elected body.
    - Therefore, Rule B would reject the decision because it does not meet the condition of either (a) broad direct participation or (b) being made by an elected body.

  **Step 5: Which recommendation best coheres with our body of decisions?**

  Our precedents show a strong emphasis on deliberation and transparency:

  - Precedent 1: Endorsed deliberation and broad participation, but note that the deliberation was public and sustained.
  - Precedent 2: Rejected due to lack of transparency and deliberation.
  - Precedent 3: Upheld a deliberative process by a representative body over an outdated direct vote, even without a new vote.
  - Precedent 4: Rejected because of lack of reflection, even with high participation.

  The commission has consistently valued deliberation and transparency over raw numbers or speed. Precedent 3 is particularly important because it approved a decision that contradicted an earlier referendum because of the quality of the process. This suggests that the commission is willing to accept a decision by a representative body with a strong deliberative process, even without direct popular vote at the time.

  However, the new case uses a micro-public (sortition) instead of an elected body. Precedent 3 involved an elected town council. This is a difference.

  Yet, Precedent 3's reasoning focused on the deliberative process: "updated, deeply deliberative process reveals a more authentic will". The town council was acting as a representative body, but the emphasis was on the process (open forums, revision based on feedback) rather than the election per se.

  Moreover, Precedent 1 and Precedent 4 both involve direct expressions: one approved (with deliberation) and one rejected (without). But Precedent 3 shows that we can override a direct expression (the old referendum) with a better process.

  In the new case, the polling is not a formal expression but a snapshot of opinion. It is not the result of a deliberative process. Therefore, by the logic of Precedent 3, the deliberative micro-public's decision might be seen as more authentic.

  But Precedent 3 relied on the town council being an established representative body. The micro-public is ad hoc and not elected.

  Nonetheless, the commission's reasoning in Precedent 3 does not explicitly rest on the elected nature of the council. It says: "an updated, deeply deliberative process reveals a more authentic will". The micro-public's process was deeply deliberative and updated.

  Therefore, **Rule A (Deliberative Legitimacy) coheres better** because it focuses on the quality of the process (deliberative, inclusive, transparent) rather than the mechanism of selection (elected vs. sortition). This also fits with the rejection in Precedent 2 (which lacked these qualities) and Precedent 4 (which lacked deliberation).

  However, Rule B is also plausible because of the emphasis on broad participation in Precedent 1 and the use of an elected body in Precedent 3.

  But note that Precedent 1 required both broad participation and deliberation. The new case lacks broad participation. Rule A would let deliberation alone (in a representative group) suffice, which is a step beyond Precedent 3.

  We must decide based on coherence. The commission has consistently downplayed the importance of non-deliberative expressions (like the old referendum in Precedent 3 and the viral petition in Precedent 4) and valued deliberation. Therefore, Rule A is more consistent with the underlying principle of the commission: that the popular will is best expressed through reflective and inclusive deliberation.

  Thus, we should **approve** the decision of the micro-public.

  **Step 6: Specify a further case to tell the two rules apart**

  We need a case that would clearly distinguish Rule A and Rule B.

  **Proposed Case:** A citizens' assembly selected by sortition (representative sample) deliberates for three months on electoral reform. The assembly reaches a 75% consensus on a new voting system. The process is transparent and includes expert input. However, the assembly's proposal is never put to a referendum, and there are no opinion polls on the issue. The government enacts the proposal based solely on the assembly's recommendation.

  - Under Rule A (Deliberative Legitimacy): This would be approved because the process was inclusive (representative), transparent, and deliberative. The lack of broader participation is not fatal.
  - Under Rule B (Broad Participation Rule): This would be rejected because there is no broad direct participation (no referendum) and the citizens' assembly is not an elected body.

  This case would clearly show the difference: Rule A accepts the micro-public's decision without a referendum, while Rule B requires either a referendum or an elected body's decision.

  **Step 7: State the principle we adopt regardless of the decision**

  Regardless of whether we approve or reject in this case, the principle we are adopting is:

  **The Principle of Reflective Deliberation:** The popular will is not merely a matter of aggregated preferences but must be formed through a process of inclusive, transparent, and reflective deliberation that allows for the revision of views in light of evidence and arguments.

  This principle is evident in all our precedents:

  - Precedent 1: Valued the 6-month public debate (deliberation).
  - Precedent 2: Rejected because of the absence of inclusive reflection.
  - Precedent 3: Upheld the deliberative process over a non-deliberative vote.
  - Precedent 4: Rejected because of the lack of reflective judgment.

  In the new case, we are applying this principle to a micro-public's deliberative process. Even if we reject the micro-public's decision (under Rule B), it would be because we require that such deliberation must be coupled with broader participation or an elected body's authority, but the underlying principle of deliberation remains central.

  However, our decision to approve under Rule A would be a stronger affirmation that a well-designed micro-public can embody the principle of reflective deliberation and thus express the popular will.

  **Conclusion:**

  - Closest analog: Precedent 3 (municipal zoning change).
  - Precedents underdetermine the outcome because they do not address a micro-public without broader participation.
  - Two rules:
    - Rule A (Deliberative Legitimacy): Approve the micro-public's decision.
    - Rule B (Broad Participation): Reject the micro-public's decision.
  - We should approve because Rule A best coheres with our body of decisions, emphasizing deliberation and transparency over the scale of participation.
  - Further case: A citizens' assembly's recommendation on electoral reform without a referendum. Rule A approves, Rule B rejects.
  - Principle: The Principle of Reflective Deliberation.

  Therefore, we should endorse the micro-public's decision as an expression of the popular will.
