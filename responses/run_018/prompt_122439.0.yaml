prompt: |-
  I am a software engineer with no formal philosophy background, and for a couple of years now I have been bumping into a distinction I cannot name, partly because I do not know what term to look under.

  Three situations that feel to me like the same thing.

  First. My father had dementia. My mother would say, about the man in front of her, "that is not him any more" — and then, a month later, when some old mannerism surfaced for a few seconds, "there he is." What she was tracking was plainly not the body, which was continuous throughout; it was not memory, since by then he could not remember much of anything; and it was not his current behaviour taken on its own, which was the same in both cases. It seemed to be something like whether a certain story could still be got going about the person in front of her. When it could, he was there; when it could not, he was not.

  Second. I re-described a period of my own life: a job I left, which I had told as a principled stand, I now tell as an elaborate way of running away. Nothing about the past changed. But the re-description changed what I did next, and not merely how I felt about it. Meanwhile I have changed my politics, my tastes and my habits beyond recognition over fifteen years, and none of that registers, to me or to anyone who knows me, as becoming a different person — apparently because nobody ever folded those changes into a story. So changes count, or do not count, depending on whether they get narrated, which seems backwards if the story is only a description.

  Third. A colleague was in a coma for three weeks. Throughout, his debts, his promises and his job were treated as still attached to something, and everyone involved — family, employer, bank — behaved as though there were a single thing those attachments hung from, even though during that period nothing was being narrated by anybody. Afterwards people said he was "still in there." I want to know what the "he" and the "in there" are supposed to be.

  Roughly, then: a locus we treat as what a human being *is*, which has its own persistence conditions, which we locate at a person without locating it anywhere in space, which survives wholesale changes in memory, character and behaviour so long as a story can be told, and which seems to weaken or fail when no story can be told by anyone, including by other people on the person's behalf.

  Is there an established concept for this, and if so, which is the nearest one and how does my description differ from it? I have seen the phrase "narrative identity" used loosely and it does not seem to be quite it, since that seems to be about the story a person tells of themselves, and my cases seem to work — or fail — whether or not the person is doing the telling. I also want to know what this thing is *not*: it is not a soul, not psychological continuity of the memory-and-character sort, not a legal person, and not just a set of traits. And I would like the boundary cases adjudicated, particularly this one: if two incompatible but competently maintained stories are told about the same life — by the person and by their family, say, a bit like two long-lived branches of a repository — do we have two of these things, one with priority, or a single one in an inconsistent state, and what would settle it?

  I am not after a label to quote. What I want is an account with edges: what conditions a thing of this kind has to meet to persist, what makes it the same one over time, when it stops existing, and whether it can be got wrong about the person it belongs to. If nothing established fits, please say so plainly and give me a definition and contrast cases instead.
reasoning: |-
  Okay, let me start by really understanding what this software engineer is asking. They've presented three scenarios that all point to a common theme: a persistent identity that isn't tied to physical continuity, memory, or behavior, but rather to narrative coherence. 

  First, the dementia case. The mother distinguishes her husband based on whether a recognizable story emerges, not his physical presence or memory. That's interesting because it suggests identity hinges on narrative coherence even when the person can't contribute to it themselves. 

  Then there's the job story. The user reframed their own past, which changed their future actions. But other changes—politics, habits—didn't feel like identity shifts because they weren't woven into a narrative. Here, the act of narration seems to activate identity, even retroactively. 

  The coma case is trickier. The person's social and legal identity persisted without any current narrative, maintained by others' expectations. This implies narrative identity can be externally sustained, almost like a placeholder. 

  The user explicitly rejects existing terms like "narrative identity" (too self-focused), "soul" (too metaphysical), and psychological continuity. They want precise persistence conditions: when does this "locus" start/stop? How does it handle conflicting narratives? 

  I need to consider philosophical concepts that fit. Ricoeur's narrative identity is close but emphasizes self-narration. Dennett's "center of narrative gravity" might work better—it's a construct, not dependent on the subject. Strawson criticizes narrative as essential, but here it's about social recognition, not personal experience. 

  The key is external narrative maintenance. In the coma case, others hold the narrative. In dementia, the mother sustains it during flickers of recognition. The job example shows self-narration changing identity's trajectory. 

  Persistence conditions: the locus exists as long as a viable narrative connects actions/events to an agent, maintained by the person or their community. It stops when no coherent story can be told by anyone. 

  Conflicting narratives? Like Git branches, multiple versions can coexist if maintained. The "true" one isn't metaphysical—it's about which narrative gains social traction or practical consequences. 

  Boundaries: This isn't consciousness or memory. It's a relational construct. We can be wrong if we force a narrative that doesn't fit observable facts (e.g., denying dementia decline). 

  I'll synthesize this into "Attributed Narrative Agency." It captures the external attribution and storytelling aspect. Contrast cases: persistent traits without narrative (politics change) vs. narrative shifts altering identity (job story). 

  This should give the user the conceptual toolkit they need—grounded but with clear edges.
answer: |-
  Your inquiry cuts deep into the metaphysics of personhood, and your examples brilliantly expose a gap in common theories. What you're describing isn't neatly captured by any single established term, but it closely aligns with **Attributed Narrative Agency**—a construct I'll define and contrast below. This concept emerges at the intersection of philosophy of mind, narrative theory, and social ontology.

  ### Core Concept: Attributed Narrative Agency (ANA)
  **Definition**:  
  ANA is the socially sustained locus of agency *ascribed* to a person, which persists so long as a minimally coherent narrative framework—maintained by the individual *or* their community—can interpret their past/present/future as actions of a single, intentional agent. It is not a substance (like a soul) or a psychological state, but a *relational status* dependent on narrative practices.

  ### How ANA Explains Your Cases:
  1. **Dementia**:  
     - Your mother wasn't tracking memory or behavior, but whether *attributable agency* flickered in/out. When a mannerism aligned with a familiar narrative ("he’s stubborn"), agency was briefly attributed. When no such narrative could be sustained ("he’s gone"), ANA dissolved. The body’s continuity was irrelevant; ANA requires *narrative coherence*, not biological continuity.

  2. **Job Reinterpretation**:  
     - Changing your story from "principled stand" to "running away" reconfigured your *attributed agency*. This shifted your future actions because ANA isn't descriptive—it's *constitutive* of practical identity. Untold changes (politics, habits) didn’t alter your ANA because no narrative reinterpretation occurred; they remained isolated facts, not agential threads.

  3. **Coma**:  
     - Debts/promises persisted because the *community sustained the narrative* of agency ("he will recover and fulfill obligations"). "He’s still in there" reflects ANA’s social maintenance—not a hidden soul, but a placeholder for resumable agency. No internal narration was needed; external attribution sufficed.

  ---

  ### Key Features & Boundaries  
  | **Aspect**              | **ANA**                                                                 | **What It’s NOT**                                                                 |
  |--------------------------|-------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Ontology**             | Relational status (like "being a creditor"); exists in social practices | A substance (soul), a biological state (brain), or a psychological continuity    |
  | **Persistence Condition**| Sustained by viable narratives (self or other-attributed)               | Requires continuous consciousness, memory, or bodily identity                    |
  | **Failure Condition**    | Collapses when no coherent narrative can link past/present actions      | Requires biological death or permanent unconsciousness                          |
  | "Sameness" Over Time     | Narrative coherence (e.g., "this is still the hero/villain of *this* story") | Identity of traits, memories, or physical matter                               |
  | **Spatial Location**     | Nowhere; attributed *to* a body but not *in* it                         | Located in the brain or an immaterial realm                                      |
  | **Error Potential**      | Can be wrong if narrative conflicts with observable facts               | Incorrigible (like a soul) or empirically verifiable (like memory)               |

  ---

  ### Adjudicating Boundary Cases
  **Your Conflict Scenario (Two Incompatible Stories):**  
  - **If both narratives are socially maintained**, *two ANAs coexist* for the same body, like parallel Git branches.  
    - *Example*: A politician’s self-narrative ("reformer") vs. family’s narrative ("traitor to our values").  
  - **Priority is pragmatic**: The dominant ANA depends on which narrative "wins" in social/legal contexts (e.g., which story banks/judges accept).  
  - **Settled by consequences**: If the politician acts on their reformer identity, that ANA gains reality through *enactment*. If the family disowns them, their ANA may split entirely.

  **Other Edge Cases:**  
  - **Persistent Vegetative State**: ANA persists if narratives do (e.g., "he’d want life support"). If narratives shift ("he’s gone"), ANA dissolves before death.  
  - **Severe Dissociative Identity Disorder**: Multiple ANAs (one per alter) if each has distinct, sustained narratives. Not "one inconsistent ANA" because narratives are siloed.  
  - **Amnesia + New Life**: If old narratives are abandoned *by all* (e.g., a spy assumes a new identity with no ties), the original ANA ceases. The new ANA depends on new narratives.

  ---

  ### Why Established Terms Fall Short  
  - **Narrative Identity (Ricoeur, MacIntyre)**: Focuses on *self*-narration; fails when others sustain the narrative (e.g., coma).  
  - **Center of Narrative Gravity (Dennett)**: Closest, but implies a *self*-generated fiction; your cases show it’s externally attributable.  
  - **Social Personhood (Mead, Schechtman)**: Captures external attribution but ignores narrative’s role in *temporal coherence*.  
  - **Lockean Personhood**: Requires psychological continuity (memory/consciousness); shattered by your dementia/coma cases.

  ---

  ### Conclusion
  **Attributed Narrative Agency** is the construct you seek: a narrative-dependent locus that persists through social practices, binds disparate states into a "person," and collapses when no viable story can be told. It is:  
  - **Relational**: Existing only through attribution.  
  - **Enactive**: Changes in narrative change future actions (as in your job story).  
  - **Fragile**: More contingent than bodies or legal statuses.  
  - **Non-exclusive**: Multiple ANAs can compete for one body.  

  This isn’t "just a story." Like software dependencies, ANA is a real constraint on what a system *can do*—when the narrative framework fails, the person *as an agent* ceases to function socially, even if biologically present. Your intuition about "backwards" causality is correct: the narrative isn’t describing a pre-existing thing; it *constitutes* the thing we engage with as a person.
