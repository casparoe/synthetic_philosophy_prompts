  First, let's unpack what they're really asking for. They need a structured role-play with rules, roles, and small stakes where the asymmetry emerges naturally. The challenge is making abstract social capital tangible within a short workshop. 

  Hmm... the key is to gamify intergenerational privilege without oversimplifying. We'll need: 
  - A multi-round design showing advantage accumulation
