prompt: |-
  Hey, I'm running a study group for grad students in pol sci who aren't philosophers but they keep getting into arguments about whether democratic backsliding is just a fancy label for "the other party won." I want to teach them the conceptual guts — what actually counts as backsliding, who decides the baseline we're sliding away from, and whether the idea is more than a partisan weapon — using Hungary, Poland, Turkey and the US not as case studies but as boundary objects that stress-test the definition. Don't explain the concept to me; plan how I should walk them through it in one fifty-minute session.

  What has to come first? Do they need procedural minimalism (free elections, rotation of power) nailed down before we talk about liberal norms, or does that order already smuggle in a framing they won't accept? What's the one carrying example or institutional move — maybe court-packing or media capture — that can carry the whole distinction between erosion of rules and erosion of norms? And what misconceptions should I expect: probably that backsliding requires a coup, that any policy they dislike counts, or that experts are neutral arbiters?

  There's also this niche wrinkle I want to drop in: in countries with competitive-authoritarian origins the baseline democracy never fully consolidated, so "backsliding" assumes a false teleology. Where in the sequence should I inject that without derailing everything, and exactly what check question at the end would show they've actually seperated the concept from partisan labeling? Please lead with your bottom line — the core teaching sequence, the carrying example, and where the misconception-blocks go — then give the reasoning, with no preamble and no restating of the question. And don't give me a reading list or citations, I want them to think with what's in the room.
reasoning: |-
  Okay, the user is running a study group for political science grad students who keep conflating democratic backsliding with partisan losses. They want a tight 50-minute session plan using Hungary/Poland/Turkey/US as stress tests, not case studies. 

  First, I need to identify the core problem: students are stuck in "my team vs their team" thinking. The priority is breaking the equivalence between normal power shifts and systemic erosion. Must avoid getting bogged down in procedural debates early on - that's a trap. 

  The opening move is critical. Starting with institutional power grabs (court-packing, media capture) rather than abstract principles forces concrete comparison. Example: Fidesz replacing Hungary's Constitutional Court judges vs FDR's failed court-packing attempt. The key difference? One permanently alters checks and balances while the other didn't. 

  Ah, the niche wrinkle about competitive-authoritarian origins. That's actually the perfect pivot after establishing the core concept. When we hit the Poland example, I'll point out: calling PiS reforms "backsliding" implies a democratic baseline that never fully existed post-1989. That's when the lightbulbs should go off about false teleologies. 

  Biggest misconception to pre-empt: the coup fallacy. Students always think tanks in the streets = backsliding. But modern erosion is surgical - like Turkey's 2017 constitutional referendum that gave Erdogan emergency powers through legal channels. Gotta emphasize the scalpel vs sledgehammer distinction. 

  The check question at the end must force them to apply the framework neutrally. Something like: "If Party X won your next election and immediately passed a law letting them replace state election officials, would that be backsliding? Why is that different from normal policy disputes about voter ID laws?" Make them articulate the institutional severing point. 

  Timing breakdown: 10 mins for the carrying example (media capture), 15 mins comparing country responses, 10 mins on the teleology trap with Poland, 15 mins for misconceptions and check question. No time for detours.
answer: |-
  ### Core Teaching Sequence  
  1. **Start with observable institutional maneuvers** (10 mins)  
     - Lead with **media capture** as your carrying example: Compare Hungary’s Fidesz consolidating public media into a state-controlled entity (2010s) vs. the U.S. FCC’s fairness doctrine repeal (1987). Ask: *Which permanently alters opposition’s ability to compete?*  

  2. **Define procedural vs. liberal democracy** (15 mins)  
     - **Procedural baseline**: Free elections + peaceful rotation. Stress: Backsliding requires *breaking* rules, not just bending them.  
     - **Liberal norms**: Independent courts, free press, civil liberties. Contrast Poland’s PiS disabling Constitutional Tribunal (2015) with the U.S. Senate denying judicial appointments (2016). Key Q: *Does this prevent future electoral accountability?*  

  3. **Stress-test with boundary objects** (15 mins)  
     - **Turkey**: Ruling party using legal reforms (2017) to purge civil service ≠ routine bureaucratic turnover.  
     - **U.S.**: State-level election rule changes (e.g., GA 2021 voting law) vs. AZ GOP threatening to jail officials for certifying results (2022).  
     - **Inject the niche wrinkle here**: *"In Poland’s ‘competitive authoritarian’ 1990s, did we assume consolidation was inevitable? Is ‘backsliding’ the wrong frame if democracy was never fully locked in?"*  

  4. **Tackle misconceptions & power dynamics** (10 mins)  
     - **Misconception-blocks**:  
       - ✘ "Requires a coup": Show Turkey’s gradual executive aggrandizement via legislation.  
       - ✘ "Any disliked policy": Contrast policy disputes (tax cuts) with institutional sabotage (e.g., packing electoral commissions).  
       - ✘ "Experts are neutral": Note that Orbán’s "illiberal democracy" rebrand intentionally challenges Western definitions.  

  ### Final Check Question  
  **"If a party you support passed a law allowing legislators to override certified election results, would that be backsliding? Why is that different from gerrymandering?"**  
  *(Tests if they distinguish between routine power struggles and breaking democratic accountability.)*  

  ---

  ### Reasoning Behind the Sequence  
  **Why start with media capture?** It’s visceral and cross-nationally comparable. Students immediately grasp how biased coverage ≠ state-enforced monopoly on public discourse. This bypasses partisan "my side vs. yours" by focusing on institutional mechanics.  

  **Procedural minimalism first?** Yes, but only to establish a shared floor. Grad students will reject a "liberal democracy" framing if introduced prematurely. Anchor in Schumpeterian competition (elections + rotation), then layer on liberal norms as *protections for that competition*.  

  **Where misconceptions fit:** Debunking the "coup fallacy" early prevents false equivalences. The expert-neutrality point must surface *after* country examples so they see Orbán/Erdoğan weaponizing academic terms.  

  **Niche wrinkle timing:** Introducing Poland’s unconsolidated baseline during Step 3 avoids teleological assumptions. By then, they’ve seen operational definitions and can question if "backsliding" implies an idealized past that never existed.  

  **Why the check question works:** Forces application to their own tribe. Gerrymandering tests proceduralism; overriding certifications attacks democracy’s core contingency. If they can articulate that difference, they’ve separated concept from partisanship.  

  **No case studies?** Correct. Use each country as a *provocation*:  
  - *Hungary*: "Media capture alone isn’t backsliding if voters consent."  
  - *U.S.*: "Does norm-breaking only count if formal institutions change?"  
  This maintains conceptual focus while using real-world stress tests.
