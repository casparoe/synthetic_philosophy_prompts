  The debate should flow naturally - perhaps starting with the moralist's case for prohibition, then the critic's rebuttal about law overreaching, then deeper into why criminal law specifically, and whether societal preservation justifies coercion. I'll have them make the required concessions: moralist admitting the harm principle has force in most cases, critic granting that social bonds matter.

