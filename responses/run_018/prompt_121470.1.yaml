  hey i need help for a discussion group im running. we watched Wreck-It Ralph last night and i kept thinking about whether the charaters in it actually matter morally. like Vanellope is a glitch and everyone treats her like garbage, but she's clearly got feelings and wants. and Ralph can destroy whole worlds just by being clumsy in the wrong game. i want someone to read the film through the question "do video-game characters have moral status?" — not just use it as an illustration, but actually see where it takes that idea seriously and where it cheats. like does the fact they can be unplugged or reset change whether hurting them is wrong? and what about the glitch — is she less of a person because she's a coding error? i want a reading that takes both the movie and the philosphy seriously, and tells me if Disney is accidentally making a real point or just being sentimental. no citations or reading lists needed, just your honest take.
