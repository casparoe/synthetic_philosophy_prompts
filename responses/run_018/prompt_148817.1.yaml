answer: |-
  Below is a diagnostic decision tree for the utility monster problem, designed to sort respondents into normative positions based on concrete commitments. The tree has five binary branching nodes (well within the six-node limit) and covers both the canonical hedonic version and the structural variant (non-hedonic systemic flourishing). Each node is phrased as a concrete question answerable by an advanced undergraduate familiar with basic normative ethics but not specialized debates.

  ---

  ### **Decision Tree**

  #### **Node 1: Initial Aggregation Judgment**  
  *In the utility monster scenario, transferring a resource to a single individual (the "monster") yields vastly greater total welfare gains (e.g., 1,000 units) than distributing it equally among 100 others (e.g., 0.5 units each, totaling 50 units). Is it morally* required *to transfer the resource to the monster?*  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 3.  

  #### **Node 2: Diminishing Marginal Weight**  
  *Suppose the monster is already at a high welfare level. Would a fixed welfare gain (e.g., 10 units) matter* less *morally when received by the monster (due to its high baseline) than when received by someone with low welfare?*  
  - **Yes** → **Leaf 2: Prioritarian/Weighted-Utilitarian** (diminishing marginal weight for the monster).  
  - **No** → **Leaf 1: Unrestricted Classical Utilitarian**.  

  #### **Node 3: Permissibility Under a Basic Minimum**  
  *Consider a modified scenario where transferring the resource to the monster would* not *cause anyone to fall below a basic minimum welfare level (e.g., enough for survival/flourishing). In this case, is the transfer at least* morally permissible *even if not required?*  
  - **Yes** → **Leaf 6: Hybrid/Institutional-Separation** (aggregation permitted above a distributive floor).  
  - **No** → Proceed to Node 4.  

  #### **Node 4: Rights Violation**  
  *Is the primary reason for forbidding the transfer that it violates an individual right or constraint (e.g., against taking resources from others without consent),* regardless *of aggregate gains?*  
  - **Yes** → **Leaf 3: Rights-Based/Side-Constraint** (Nozickian).  
  - **No** → Proceed to Node 5.  

  #### **Node 5: Contractualist Rejection**  
  *Is the primary reason for forbidding the transfer that it could not be justified to each affected person (e.g., deprived individuals could reasonably reject a rule allowing such transfers from behind a "veil of ignorance")?*  
  - **Yes** → **Leaf 4: Contractualist/Ex-Ante-Consent**.  
  - **No** → **Leaf 5: Strict Egalitarian/Lexical-Priority**.  

  ---

  ### **Leaves and Structural Variant Compatibility**  
  1. **Leaf 1: Unrestricted Classical Utilitarian**  
     - *Diagnosis for hedonic version:* Requires transfer to the monster.  
     - *Structural variant compatibility:* **Forces revision** (classical utilitarianism is typically welfarist; non-hedonic flourishing is unrecognized unless the theory is expanded to include non-subjective goods).  

  2. **Leaf 2: Prioritarian/Weighted-Utilitarian**  
     - *Diagnosis for hedonic version:* May reject the transfer if the monster's gains are discounted due to high baseline welfare.  
     - *Structural variant compatibility:* **Forces revision** (prioritarianism weights welfare gains; non-hedonic flourishing is incommensurable unless the view incorporates non-welfare values).  

  3. **Leaf 3: Rights-Based/Side-Constraint**  
     - *Diagnosis for hedonic version:* Forbids transfer as a rights violation (e.g., unjust appropriation).  
     - *Structural variant compatibility:* **Diagnosis intact** (rights constraints apply irrespective of the type of good produced; systemic flourishing does not override individual entitlements).  

  4. **Leaf 4: Contractualist/Ex-Ante-Consent**  
     - *Diagnosis for hedonic version:* Forbids transfer as reasonably rejectable by those deprived.  
     - *Structural variant compatibility:* **Diagnosis intact** (non-hedonic flourishing does not alter the unreasonableness of deprivation; losers could still veto the transfer).  

  5. **Leaf 5: Strict Egalitarian/Lexical-Priority**  
     - *Diagnosis for hedonic version:* Forbids transfer due to excessive inequality.  
     - *Structural variant compatibility:* **Depends on egalitarian metric**:  
       - *Resource-based:* Intact (transfer worsens resource inequality).  
       - *Welfare-based:* **Forces revision** (non-hedonic flourishing isn't "welfare," so inequality may not register).  

  6. **Leaf 6: Hybrid/Institutional-Separation**  
     - *Diagnosis for hedonic version:* Permits but does not require transfer if basic needs are met.  
     - *Structural variant compatibility:* **Diagnosis intact** (the distributive floor protects welfare/resources; non-hedonic gains are irrelevant to the floor but permissible above it).  

  ---

  ### **Logically Unoccupied Combination**  
  - **Combination:**  
    - Node 1: **Yes** (transfer required)  
    - Node 2: Any answer  
    - *Plus* commitment that the transfer is **forbidden if it pushes anyone below a basic minimum**.  
  - **Why unoccupied?**  
    - This hybrid view (requiring aggregation above a floor but forbidding it below) is **logically coherent** and potentially attractive (e.g., aggregative efficiency constrained by sufficiency). However, it is **neglected** in canonical debates, as hybrid theories typically emphasize *permissibility* (Leaf 6) rather than *requirement* above the floor.  

  ---

  ### **Indistinguishable Leaves**  
  No leaves share identical paths. However:  
  - **Leaf 3 (Rights) vs. Leaf 4 (Contractualist):** Both forbid the transfer (Nodes 1=No, 3=No, 4=Yes for Leaf 3; Nodes 1=No, 3=No, 4=No, 5=Yes for Leaf 4). They are cleanly separated by Node 4 (rights violation vs. reasonable rejection).  
  - **Leaf 5 (Egalitarian) vs. Leaf 4 (Contractualist):** Separated by Node 5 (contractualist rejection vs. egalitarian concern).  

  ---

  ### **Audience & Implementation Notes**  
  - **Audience:** Advanced undergraduates in moral philosophy. Familiar with concepts like utilitarianism, rights, and distributive justice, but not required to know terms like "prioritarianism" or "contractualism."  
  - **Instructions:** Answer each question based on intuitive moral judgment. Ignore theoretical labels; focus on concrete cases.  
  - **Structural Variant Handling:** After completing the tree, respondents should reconsider their leaf in light of the non-hedonic monster (e.g., one creating irreducibly complex art/epistemic order). The compatibility notes above guide whether this forces revision.  
  - **Validation:** The tree avoids textual citations and tests *actual commitments* by anchoring questions in scenarios. For example, Node 3’s "basic minimum" scenario isolates institutional-separation views without naming them.  

  This instrument isolates core normative commitments while accommodating both hedonic and structural variants of the utility monster problem.
