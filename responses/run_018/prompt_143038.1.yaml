answer: |-
  ## Opening Address: International Symposium on Hunger, Governance, and Moral Responsibility

  **[Delivered in polished British English, pace suitable for an 8-minute address]**

  Distinguished delegates, colleagues, guests, and—most importantly—those who carry the painful weight of lived experience: welcome to this vital symposium.

  When we speak of famine, a certain language instinctively emerges. We hear of ‘natural disasters’, of ‘biblical plagues’, of ‘inevitable tragedies’ born of drought, flood, or blight. It is a language that evokes pity, perhaps charity, but often a sense of helplessness. It frames mass starvation as an act of nature, a misfortune beyond human control.

  Today, we must confront a fundamental challenge to that language. We gather under the profound intellectual shadow of Amartya Sen’s entitlement framework – not as an academic footnote, but as the very lens through which we must understand famine’s true nature and, crucially, our responsibilities in its wake. Sen compels us to see that **famines are not primarily failures of nature; they are failures of human systems.** Starvation occurs not necessarily because there is no food, but because people lose their established means of *commanding* food – their entitlements.

  This distinction reshapes everything. Let us examine it through three harrowing chapters: Bengal 1943, Ireland the 1840s, and China’s Great Leap Forward. In each, we see the critical divide between food availability decline and entitlement collapse, and crucially, between *types* of entitlement collapse.

  The Bengal Famine of 1943 stands as a stark rebuttal to the natural disaster narrative. While war disrupted trade, aggregate food availability in Bengal was not catastrophically low. People starved not because grain vanished, but because their *entitlements* disintegrated. We witnessed a brutal **mediated entitlement collapse**. Wartime inflation, panic hoarding, and disastrous colonial policies – diverting food for the war effort, halting imports from Burma, imposing inter-provincial trade barriers – sent prices soaring beyond the reach of vast swathes of the population, particularly rural labourers whose wages failed to keep pace. Their means of *exchanging* labour or goods for food were severed by policy and market distortion. The food existed; their access to it was politically mediated away.

  Now, consider the Irish Famine. The initial potato blight triggered a **direct entitlement collapse** for the vast majority dependent on their plots. Their direct production entitlement failed. But the tragedy deepened and became a genocidal catastrophe because of a profound **mediated entitlement collapse**. While other food *was* produced and available in Ireland, colonial policies enforced its export to Britain. Landlords evicted starving tenants. Relief efforts were criminally inadequate, driven by laissez-faire dogma that deemed market interference immoral. The Irish peasantry’s potential entitlement through exchange or relief was systematically stripped away by political choices, even as food left the island.

  Finally, the Great Leap Forward in China. Catastrophic agricultural policies and bad weather contributed to falling production – a potential trigger. But the scale of the famine was exponentially amplified by a catastrophic **mediated entitlement collapse**. The collectivisation drive destroyed traditional rural markets and exchange relationships. Grain procurement quotas were set impossibly high, forcibly extracting food even from starving villages to feed cities and industrial projects or fulfil state targets. The communal kitchens failed disastrously. Farmers lost all command over their own produce; their labour entitlements became meaningless under the rigid, malfunctioning system. Food, even when available locally, was rendered inaccessible by state fiat.

  **[Pause, shift tone – more analytical, then building towards moral intensity]**

  This framework – distinguishing direct production failure from the mediated severing of exchange or legal access – fundamentally alters our moral vocabulary. Why?

  When we misdiagnose famine as purely a natural disaster, we relegate it to the realm of *tragedy*. It becomes a sorrowful act of God, evoking sympathy but obscuring agency. The language of ‘calamity’ or ‘act of nature’ muffles the questions of *who* failed to protect entitlements, *who* designed the policies that severed them, *who* stood by as mediated collapses unfolded.

  Sen’s analysis forces a harder conversation. If famines arise from the collapse of entitlement systems – systems underpinned by law, economics, and political power – then we must speak of **negligence**. Negligence in failing to maintain functioning markets, negligence in ignoring early warnings, negligence in designing policies blind to their impact on the most vulnerable.

  And when policies are not merely negligent but actively sever the entitlements of specific groups – through deliberate exclusion, discriminatory allocation, forced extraction, or the calculated sacrifice of one population for another – then the language shifts further. We edge towards the vocabulary of **crime**. The mediated collapse becomes an act of political violence, a severing of the social contract that guarantees minimal command over sustenance.

  Abandoning the natural-disaster narrative is not merely an academic exercise; it is an ethical imperative. It changes what we can and cannot say about responsibility.

  Once we recognise Bengal as a mediated collapse driven by wartime policy choices and market failures, we cannot avoid asking: Who controlled the grain movements? Who failed to implement price controls or relief? Who bore the responsibility for protecting entitlements?

  Once we see Ireland not just as blight but as colonial policy actively exporting food and denying relief, we cannot avoid confronting the decisions made in London and by landlords in Ireland itself. The negligence becomes systemic, the moral burden shifts.

  Once we understand the Great Leap Forward famine as the horrific consequence of forced collectivisation and extraction quotas, mediated collapse becomes undeniable. The responsibility lies squarely with the architects and enforcers of policies that actively dismantled the rural population's entitlements.

  **[Conclude with clarity and moral force]**

  Therefore, colleagues, our task this week is framed by this inescapable truth: Famine is political. It is the catastrophic failure of political and economic systems to guarantee the most basic entitlement – the command over food necessary for survival.

  Our discussions on governance must focus on *how* states protect entitlements – through social safety nets, market regulation, early warning systems, and accountable institutions. Our moral philosophy must grapple with the gradations of responsibility – from tragic circumstance, through culpable negligence, to deliberate harm – that Sen’s framework illuminates. Our humanitarian practice must target not just the provision of food, but the restoration of *entitlements* – rebuilding the means by which people feed themselves with dignity.

  Let us abandon the comforting illusion of natural disaster. Let us speak clearly of systems, of choices, of failures mediated through policy and power. For only then can we truly discern the shape of responsibility. Only then can we build the governance worthy of the moral imperative to end famine. Only then can justice have its say.

  The conversation begins now. Thank you.
