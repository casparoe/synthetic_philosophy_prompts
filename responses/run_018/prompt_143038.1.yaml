prompt: |-
  As a journalist covering science and ideas, I am preparing the opening address for the inaugural session of the "International Symposium on Hunger, Governance, and Moral Responsibility," which I will deliver to a mixed audience of development economists, moral philosophers, humanitarian practitioners, and members of the public affected by famine-related displacement. Before you draft anything, please think carefully and spend a few minutes brainstorming: first, how Amartya Sen's entitlement framework distinguishes famine causation from mere food-availability decline across the Bengal famine of 1943, the Irish famine of the 1840s, and the Great Leap Forward; second, how this philosophical distinction reshapes moral vocabulary—whether we speak of tragedy, negligence, or crime—when addressing both specialists and non-specialists; and third, how to embed the argument structurally in a speech so that it determines what can and cannot be said about responsibility, rather than serving as ornament.

  You should approach this as an expert in political philosophy and the history of economic thought, with particular skill in translating technical arguments for mixed audiences. The address must be approximately eight minutes long, written in polished British English, and must treat Sen's thesis—that famines are not natural disasters but politically constituted failures of entitlement—as its structural backbone.

  Specifically, please weave in the somewhat niche conceptual distinction between "direct entitlement collapse," in which individuals lose command over food through breakdowns in production or legal access, and "mediated entitlement collapse," in which state policy, market restructuring, or deliberate exclusion severs exchange entitlements for specific populations even when aggregate food supplies remain adequate. Apply this distinction across the three cases, and use it to shape the speech's emotional arc: begin with the conventional language of natural catastrophe, demonstrate precisely why that framing commits a category error in each instance, and conclude by specifying the form of political accountability that remains once the natural-disaster vocabulary is abandoned.

  Please do not include bibliographies, reading lists, or citations. Do not use verbatim quotations attributed to Sen or any other author unless you can reproduce them exactly from a verified source; paraphrase freely instead. Think step by step, then compose the speech.
