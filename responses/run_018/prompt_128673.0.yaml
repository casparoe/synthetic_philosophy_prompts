answer: |-
  ### Exam Question  
  **Metaphysics of Modality Final Exam**  
  *Answer ONE question in 90 minutes. Open notes permitted.*  

  **Question 1 (25 pts):**  
  Consider two possible worlds, W and W′, that share an identical spatiotemporal origin point for an object *O*. At this origin, *O* in W is essentially copper (i.e., copper in all worlds where it exists), while *O* in W′ is essentially bronze. Worlds W and W′ diverge *only* in this essential property post-origin. Evaluate whether **Lewisian counterpart theory** can coherently handle this scenario without either:  
  (a) Grounding the counterpart relation in origin-essences (e.g., "objects sharing *this* origin are counterparts"), or  
  (b) Smuggling in haecceities (primitive "thisness") to individuate *O*-at-origin across worlds.  

  **Argue decisively for ONE claim:**  
  > *EITHER*  
  > "Counterpart theory **must** ground counterpart relations in origin-essences to resolve the branching-origin paradox, but this covertly reinstates transworld identity conditions, undermining Lewis’s rejection of cross-world entities."  
  > *OR*  
  > "Counterpart theory **can** reject origin-essence indexing by appealing to qualitative similarity metrics alone, preserving its anti-haecceitist commitments despite the branching scenario."  

  *Your response must:*  
  - Engage the **S5 axiom** (specifically, the necessity of identity and its implications for essential-property divergence).  
  - Explain why the **world-boundness axiom** of counterpart theory is strained by shared-origin divergence.  
  - Avoid rehashing generic summaries of Lewis vs. Kripke. Focus on the *branching-origin paradox* as described.  

  ---

  ### Model Answer (Arguing for Collapse into Transworld Identity)  
  **Position:** *Counterpart theory’s attempt to handle branching origins via origin-indexed relations collapses into a disguised form of transworld identity, violating its core principles.*  

  **(1) The Branching Scenario Paralyzes Standard Counterpart Relations**  
  Lewisian counterpart theory defines de re modality via similarity-based counterparts across worlds, rejecting transworld identity. Objects are world-bound; no entity exists in multiple worlds. However, the branching-origin scenario creates a dilemma: W and W′ share *O*’s exact origin state (spatiotemporal coordinates, initial particles, etc.), but *O* is essentially copper in W and essentially bronze in W′. Standard counterpart relations—based on qualitative similarity—fail here. If counterparts are determined by overall similarity, *O*-in-W and *O*-in-W′ are maximally similar *at origin* but diverge in an essential property. If they are counterparts, S5’s necessity of identity (∀x∀y(x=y → □x=y)) implies that *O* must have identical essential properties across W and W′—yet it does not. If they are *not* counterparts, counterpart theory cannot explain how two objects with identical origins could differ essentially—a violation of origin essentialism, which Lewis accepts. Thus, *the theory must index counterpart relations to origin-essences to avoid absurdity*.  

  **(2) Origin-Essence Indexing Invites Haecceities**  
  To resolve this, the counterpart theorist might restrict counterparts to objects sharing *O*’s origin *and* its essence. Only copper-objects-with-*O*’s-origin are *O*’s counterparts. But this move grounds the counterpart relation in *non-qualitative* conditions. The origin point alone is qualitatively identical in W and W′; the difference lies in *which object* (copper or bronze) occupies it. To individuate *O*-as-copper from *O*-as-bronze at the *same* origin, we must appeal to a primitive haecceity—a "thisness" distinguishing the copper-*O* from the bronze-*O* despite identical initial qualia. This contradicts Lewis’s rejection of haecceitism (*On the Plurality of Worlds*, §4.4). Worse, it implies that *O*’s identity is fixed by something *beyond* qualitative facts—precisely the transworld identity condition counterpart theory sought to avoid.  

  **(3) S5 Exposes the Collapse**  
  S5 modal logic (adopted by Lewis) entails that all identity is necessary: if *a* = *b*, then □(*a* = *b*). In the branching scenario, if *O*-in-W and *O*-in-W′ share an origin *and* are linked by an origin-essence-indexed counterpart relation, they satisfy the conditions for transworld identity *in all but name*. For *O* to be essentially copper in W and essentially bronze in W′ while sharing an origin, S5 demands that we deny *O*-in-W = *O*-in-W′. Yet origin-indexing treats them as "the same object" for modal purposes—else why privilege *this* origin for counterpart relations? This creates a contradiction: counterpart theory must deny cross-world identity (to respect world-boundness) while simultaneously relying on a relation that *presupposes* a cross-world entity (the origin-haecceity) to define counterparts. The origin-essence becomes a transworld identity tag.  

  **(4) World-Boundedness is Sacrificed**  
  Lewis’s world-boundness axiom—that no object exists in multiple worlds—is technically preserved but rendered hollow. If counterparts are determined by sharing *O*’s origin-haecceity, then *O*’s modal properties are fixed by a transworld *identifier*. When we say "*O* could have been bronze," we mean there exists a world W′ with an object *bearing O’s origin-haecceity* that is bronze. This is transworld identity disguised as counterpart relations. The branching scenario forces counterpart theory to reintroduce what it abolished: a cross-world persistent entity (the haecceity) that carriers *O*’s identity conditions.  

  **(5) Conclusion: A Pyrrhic Victory**  
  The branching-origin paradox reveals counterpart theory’s vulnerability. To handle essential-property divergence at a shared origin, it must anchor counterparts in origin-essences—but this requires haecceities to individuate qualitatively identical origins. This smuggles in transworld identity conditions, violating Lewis’s anti-haecceitism and reducing counterpart theory to a notational variant of transworld identity. The theory either implodes in the face of branching origins or abandons its founding principles.  

  ---

  ### Marking Scheme (Total: 25 pts)  
  **A-grade answers execute ALL FIVE moves below. B-grade answers miss nuance in ≥2 categories.**  

  | **Criterion (5 pts each)**                                                                 | **A-Level Insight (5 pts)**                                                                                             | **Common Mistake (Loses 2–3 pts)**                                                                 |  
  |-------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|  
  | **1. Engagement with branching scenario**                                                 | Explicitly uses the copper/bronze divergence *at identical origins* to show why standard counterpart relations fail. | Treats W/W′ as having different origins or drifts into generic essentialism examples.            |  
  | **2. Critique of origin-indexing**                                                        | Argues that indexing to origin-essences *requires* non-qualitative grounds (haecceities) to avoid contradiction.     | Asserts origin-indexing "solves" the problem without addressing haecceitistic implications.     |  
  | **3. S5 interaction**                                                                     | Correctly applies S5’s necessity of identity to show origin-essence indexing implies transworld identifiability.     | Mentions S5 without tying it to essential-property divergence or misapplies the Barcan formula. |  
  | **4. World-boundedness violation**                                                        | Demonstrates how origin-haecceities covertly permit cross-world identity despite nominal world-boundness.            | Claims world-boundness is "preserved" without addressing how haecceities undermine its spirit. |  
  | **5. Collapse thesis defense**                                                            | Concludes that counterpart theory either fails or becomes transworld identity in disguise (no "middle ground").      | Stops at "it’s problematic" without defending a strong position on collapse.                    |  

  ---

  ### Confidence Statement  
  **Confidence Level:** 95%  
  - **Strong Points:** The branching-origin challenge to counterpart theory is well-established (cf. Forbes, Mackie). The S5 necessity-of-identity argument is logically sound, and the haecceitistic implications of origin-essentialism are documented in the literature.  
  - **Least Sure Point:** Whether Lewis *must_ accept origin essentialism. While Lewis endorses "soft" origin constraints (*Counterfactuals*, 1973, p. 39), a radical counterpart theorist might reject *all* essentialism. However, this would make the branching scenario *less_ threatening—undercutting the paradox’s force. I judged this edge case unlikely in a graduate exam context.
