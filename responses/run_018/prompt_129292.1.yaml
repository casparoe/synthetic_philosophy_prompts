prompt: |-
  hi—i'm a phd student in phil of science running a small interview seris for our grad podcast. next week i'm talking to a philospher who defends a contextualist take on the reference class problem: she says the right class isn't fixed by causal similarity but by the explanatory target—so cancer risk uses genetic pools if you're asking about mechanism but social pools if you're asking about access, and there's no universal answer. i need 8–10 questions that don't just let her restate this. specifically: one pressing her on how she stops it collapsing into 'any class works' pure contextualism; one on single-case probabilities like 'will *i* get cancer?'; and one on the meta-problem of picking the explanatory target without already knowing the result. each needs a follow-up tuned to her likely reply (probably she'll appeal to pragmatic framing). keep it focused—this is for a student paper seris, not a formal colloquium, and please don't ask for citations or a reading list since she might just invent them.
reasoning: |-
  Okay, the user is a PhD student in philosophy of science preparing for a podcast interview. They need 8-10 questions for a philosopher who defends a contextualist view on the reference class problem. The key is that the questions shouldn't just let her restate her position but push deeper. 

  First, I need to understand the core of her argument: she argues that the reference class isn't fixed by causal similarity but by the explanatory target. For example, cancer risk might use genetic pools for mechanisms but social pools for access questions. 

  The user specifically wants three types of questions: 

  1. One pressing how her view avoids collapsing into "any class works" pure contextualism. 
  2. One on single-case probabilities, like "Will *I* get cancer?" 
  3. One on the meta-problem of how to pick the explanatory target without already knowing the result. 

  Each question needs a follow-up that anticipates her likely reply—probably pragmatic framing. 

  Since this is for a student podcast, not a formal colloquium, the questions should be focused but not overly technical. No citation requests since she might invent them. 

  For the first type: The collapse into pure contextualism. Main question could challenge how her view differs from saying any class is valid if it fits the context. Follow-up: If she appeals to pragmatic framing, press on what makes some framings "better" and whether that introduces objectivity. 

  For single-case probabilities: Main question on how her view handles highly specific queries like personal cancer risk. Follow-up: If she uses pragmatic framing again, ask how it resolves ambiguity when multiple framings exist (e.g., patient vs. doctor perspectives). 

  For the meta-problem: Main question on avoiding circularity when choosing explanatory targets. Follow-up: If she uses pragmatic needs, ask how we prevent those needs from being influenced by prior beliefs about outcomes. 

  I should also include 5-7 other questions to round out the interview—probing implications, comparing to other views, real-world applications, objections, and future directions. Total 8-10 questions. 

  Keep the tone engaged but not confrontational. Since it's a podcast, clarity and flow matter more than exhaustive detail. Avoid jargon where possible. 

  Structure the questions to build naturally: start with core distinctions, move to challenges, then broader implications. End with something forward-looking. 

  The follow-ups should feel organic, like a genuine dialogue. For example, after her likely pragmatic reply, ask: "But doesn’t that just push the problem back?" 

  Make sure every question serves the user’s goal: to deepen the discussion beyond mere restatement. No fluff.
answer: |-
  Here are 10 focused questions (+ embedded follow-ups) designed to push the discussion beyond restatement, tailored to your context and anticipating pragmatic replies:

  **Core Challenges:**

  1.  **The Collapse Challenge:** You argue the "right" reference class is set by the explanatory target, not inherent causal structure. But how does this avoid collapsing into a view where *any* arbitrarily chosen reference class is "right" for *some* conceivable, however trivial, explanatory target? Where do you draw the boundary between a legitimate target-driven class and an illegitimate, gerrymandered one?
      *   *Likely Reply (Pragmatic Framing):* She might say legitimacy comes from the pragmatic salience or genuine epistemic need within the context of inquiry.
      *   **Follow-Up:** If pragmatic salience is the guardrail, doesn't this reintroduce a kind of objectivity *outside* the explanatory target itself? What makes a framing "pragmatically salient" or a need "genuine" in a way that isn't ultimately arbitrary or just socially contingent? Is there a risk of merely replacing biological determinism with sociological determinism?

  2.  **The Single-Case Challenge:** Your framework addresses population-level risks well. But how does it handle the intensely personal, single-case probability question: "What is the probability that *I* (this specific individual, with my unique combination of genetics, environment, lifestyle, etc.) will get cancer?" Which explanatory target, and thus which reference class, settles *this* question? Isn't the most relevant class arguably a singleton class (just me), which is useless?
      *   *Likely Reply (Pragmatic Framing):* She might argue the "right" class depends on the practical *reason* for asking (e.g., treatment choice vs. existential dread), or the relevant causal factors *for the decision at hand*.
      *   **Follow-Up:** But for a given individual facing a concrete decision (e.g., preventative surgery), multiple explanatory targets seem plausible simultaneously (e.g., genetic mechanism, environmental exposure, access barriers). How does your pragmatic approach resolve which target, and thus which reference class (and potentially which conflicting probability estimate), should be decisive *for that individual in that moment*? Doesn't this expose a critical ambiguity precisely where clarity is most needed?

  3.  **The Meta-Problem / Circularity Challenge:** You emphasize the explanatory target selects the reference class. But how do we *identify* or *justify* the relevant explanatory target in the first place, *without* already presupposing knowledge about which causal factors or reference classes are significant? Isn't there a risk of circularity – we pick the target that makes the class we (implicitly) favor relevant?
      *   *Likely Reply (Pragmatic Framing):* She might say the target arises from the specific question being asked, the interests of the inquirer, or the problem context (e.g., clinical vs. epidemiological).
      *   **Follow-Up:** If the target is set by the inquirer's interests or the problem context, how do we prevent those very interests or the framing of the context from being *shaped* by prior (and potentially biased or uninformed) beliefs about what reference classes *ought* to matter? Doesn't this leave the door wide open for motivated reasoning to dictate the explanatory target, and thus the "acceptable" probability?

  **Deepening the Discussion:**

  4.  **Objectivity vs. Relativism:** Your view seems deeply contextual. Does this mean there's *no* objective fact of the matter about the "real" probability of an event like a specific person getting cancer, only probabilities *relative to* an explanatory target? Or is there a sense in which some targets/classes get us "closer" to a mind-independent truth?
      *   *Follow-Up Potential:* If she leans towards relativism, press on implications for scientific realism. If she suggests some targets are "better," ask *by what standard* beyond pragmatics?

  5.  **Comparison to Causal Similarity:** Critics might argue your view neglects that causal structure *does* ultimately ground why certain reference classes work well for prediction. How do you respond to the charge that explanatory targets are parasitic on underlying causal facts, and that pragmatic framing just helps us *choose* which causal level to focus on, rather than replacing causal similarity as the fundament?
      *   *Follow-Up Potential:* If she concedes causal structure matters but isn't singularly determinative, ask how her view adjudicates when different causal levels suggest conflicting classes.

  6.  **Implications for Policy & Justice:** If risk estimates for things like cancer vary dramatically based on whether we use (e.g.) genetic or social reference classes, how should policymakers decide which estimate to use for resource allocation or public health interventions? Doesn't your view make it harder to justify one choice over another objectively?
      *   *Follow-Up Potential:* Does your framework inherently favor certain types of explanatory targets (e.g., social ones in justice contexts)? Or is it neutral, risking the justification of harmful policies if the "wrong" target is chosen?

  7.  **Handling Conflicting Estimates:** Suppose two researchers ask subtly different questions about the same phenomenon: one targets "biological mechanism," leading to Class A and Probability P1; the other targets "social distribution," leading to Class B and Probability P2. P1 and P2 conflict significantly. Does your view imply both are equally "correct" in their context? How should science reconcile such conflicts?
      *   *Follow-Up Potential:* Is the reconciliation purely pragmatic (e.g., which question is more important right now?), or is there an epistemic hierarchy?

  8.  **Scope & Limits:** Are there domains (e.g., fundamental physics, simple games of chance) where the reference class problem *is* largely settled by causal structure or logical possibility, making contextualism less necessary? Or is your claim universal?
      *   *Follow-Up Potential:* If universal, how does it handle classical probability scenarios (e.g., dice rolls)? If not universal, what marks the boundary?

  9.  **Key Objection Rebuttal:** What do you consider the single strongest objection to your contextualist take, and how do you overcome it? (This forces synthesis and defense).
      *   *Follow-Up Potential:* Probe the strength of her rebuttal, especially if it relies heavily on pragmatics.

  10. **Future Directions:** Where do you see the most exciting or urgent work needing to be done to develop or test this contextualist approach? Are there specific scientific controversies where applying it could yield fresh insights?
      *   *Follow-Up Potential:* This ends constructively, inviting her to look forward and suggest applications relevant to your audience.

  **Key features for your podcast:**

  *   **No Restatement Traps:** Questions 1, 2, 3 directly challenge core tenets with follow-ups ready for pragmatic replies.
  *   **Follow-Ups Anticipated:** Each core question has a follow-up designed to push back if she defaults to pragmatic framing.
  *   **Focused & Accessible:** Avoids overly technical jargon; suitable for a grad student podcast audience.
  *   **No Citation Requests:** Focuses purely on the conceptual arguments.
  *   **Depth & Range:** Covers collapse, single-case, meta-problem, comparison, implications, conflict, scope, objections, and future.
  *   **Conversational Flow:** Starts with core challenges (1-3), deepens with implications/comparisons (4-8), then synthesizes and looks forward (9-10).

  Good luck with the interview! Remember to actively listen and adapt your follow-ups based on her *actual* responses, not just the predicted ones.
