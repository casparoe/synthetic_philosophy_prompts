prompt: |-
  I convene a small reading group on practical rationality, and this week we stalled on decision-making under normative uncertainty in a way I suspect is really a problem about aggregation rather than about morality — I would like to know whether that diagnosis is right, and if so what exactly is being aggregated. As I understand the standard move: I have credences over several first-order moral theories, each theory assigns my available options some degree of choice-worthiness, and I am supposed to multiply each theory's verdict by my credence in it and sum, exactly as I would under empirical uncertainty. My own attempt at saying what goes wrong is that under empirical uncertainty every state–outcome pair already has a value on one shared scale, whereas here each candidate theory arguably brings its own scale and its own account of what is even being measured, so the multiplication is not well defined until I impose a common unit — and any such imposition looks like a further first-order moral commitment smuggled in under the label of a neutral second-order procedure. Is that the right place to locate the difficulty, and is there a cleaner formulation of it?

  What made me suspicious is a case I built to test the framework. Say my options are: (A) take a lucrative job and give away most of the income, (B) stay home and care for an ailing parent full time, (C) a compromise — part-time work, modest giving, partial care. One theory, in which I have credence 0.45, ranks them 100 / 0 / 60; a second, also with credence 0.45, ranks them 0 / 100 / 60; a third, with credence 0.10, does not rank A at all but declares it forbidden. If I rescale each cardinal theory onto a common range using the best and worst options in the case at hand, the compromise wins: A and B each come out at 0.45 and C at 0.54. Two things bother me here. First, no theory I give any credence to recommends C — each of the two cardinal theories thinks C throws away most of what matters — so the framework seems to generate recommendations by averaging rather than by moral reasoning, and I cannot tell whether that is a feature (moral hedging is genuinely reasonable when you are unsure) or a reductio. Second, if option B leaves the menu because a sibling takes over the care, the rescaling changes and C's advantage disappears entirely: A and C now tie at 0.45. So the recommendation depends on an option nobody was going to choose, which strikes me as the same shape as a failure of independence of irrelevant alternatives in social choice, and I wonder whether it admits a diachronic or money-pump-style argument — could someone who controls which options are on offer reliably extract something from an agent who maximises expected choice-worthiness in this way?

  I have two half-formed escape routes and I would like them assessed alongside the framework itself. A friend suggests treating the theories as parties to a bargain and aggregating by something like a Nash bargaining solution over their normalised profiles; my worry is that this just relocates the problem, since bargaining needs interpersonally comparable utilities and a disagreement point, and imports its own fairness commitments. The other thought is to normalise on a global rather than a case-relative scale — each theory's values measured against the best and worst outcomes it can express anywhere — which would restore menu-independence but seems to hand a theory with enormous stakes the same say as one with tiny stakes, and to require a moral judgement about comparative ambition that the second-order framework was supposed to avoid. Against both: the so-called my-favourite-theory rule is menu-independent and needs no comparison, but it apparently tells me to do A here even though a theory I take seriously at 10% says A is forbidden, which suggests that deontic status and scalar value cannot simply be fed into the same expectation.

  What I would like, in roughly this order: (i) an explanation of why the "just take the expectation" move fails here but succeeds under empirical uncertainty, stated sharply enough that I can tell whether my own formulation above is getting it right; (ii) an assessment of whether the menu-dependence I have illustrated is a decisive objection to case-relative normalisation, a merely cosmetic artefact of my numbers, or a symptom that the whole expected-choice-worthiness picture is misdesigned; (iii) a comparison of the alternatives — my-favourite-theory, variance-style normalisation, a global scale, and my friend's bargaining proposal — on the two worries I have raised, namely menu-sensitivity and the fact that the recommended option is one no theory endorses; and (iv) a view on whether forbidden-versus-merely-bad is a separate problem that a purely cardinal framework cannot represent, or whether it can be handled by the same machinery. Please keep it conceptual and self-contained: I am not asking for references, just for the distinctions that make the disagreement intelligible.
reasoning: |-
  Hmm, the user is grappling with a deep problem in decision theory under normative uncertainty. They've set up a reading group on practical rationality and hit a wall with how to aggregate conflicting moral theories when making decisions. Their core concern is whether the standard "expected choice-worthiness" approach works, or if it smuggles in hidden moral commitments through scaling issues.

  The user has constructed a clever test case involving three options (A-job/philanthropy, B-parent care, C-compromise) and three theories: one utilitarian-like favoring A (0.45 credence), one deontological favoring B (0.45), and one that forbids A entirely (0.10). The standard expectation approach with local scaling makes C win (0.54), which feels odd because no theory actually endorses C. Worse, if B becomes unavailable, C loses its advantage - classic IIA violation from social choice theory.

  I need to unpack why empirical uncertainty works differently: there we have a common value scale (e.g. utils) shared across possible states. But moral theories use incommensurable scales - one might use welfare units, another duty-fulfillment points, and the third operates with categorical constraints. Multiplying credences by raw scores assumes comparability that doesn't exist.

  The user's diagnosis seems spot-on: the scaling problem is fundamental. Any normalization (local or global) involves moral judgments. Local scaling makes decisions hostage to irrelevant alternatives, as shown when removing B changes outcomes. Global scaling biases toward "loud" theories with wide scales. My-favorite-theory ignores minority views dangerously. Bargaining solutions just kick the can down to interpersonal comparability.

  The forbidden-action problem (theory 3) exposes a deeper flaw: categorical constraints can't be reduced to low scalar values without losing their deontic force. Expectation maximization fails to capture this "different kind of wrong."

  For the user's four requests: (i) The core failure is assuming intertheoretic comparability where none exists; (ii) Menu-dependence is a fatal flaw showing local scaling is arbitrary; (iii) All alternatives have dealbreaker issues; (iv) Deontic constraints require separate handling - they're not just low utilities.

  The takeaway should be that normative uncertainty may need fundamentally different tools than empirical uncertainty. The user's instinct that this is about aggregation (not morality) is correct, but the aggregation problem may be unsolvable without first-order input - there's no neutral "view from nowhere." Their test case brilliantly exposes these tensions.
answer: |-
  Your diagnosis is precisely on target, and the problem is fundamentally about the **impossibility of intertheoretic value comparison without smuggling in first-order commitments**. Below is a structured analysis addressing your four requests.

  ### (i) Why "Just Take the Expectation" Fails Under Normative Uncertainty
  - **Core Problem**: Under *empirical* uncertainty, all possible outcomes share a **common value scale** (e.g., utils). Multiplying credences by utilities works because utilities are *intertheoretically comparable* (one scale for all theories).  
  - **Under normative uncertainty**: Each moral theory defines its *own scale* (e.g., "duty-units," "welfare-points"). These scales are **incommensurable**—there is no theory-neutral way to equate "1 unit" of Theory 1 with "1 unit" of Theory 2.  
  - **Your formulation is correct**: The expectation formula *assumes* scales are comparable, but no such comparison exists without a prior moral judgment (e.g., "a 10% increase in welfare is worth a 5% decrease in duty-fulfillment"). This covertly imposes a *new meta-theory* about how values trade off.  

  ### (ii) Menu-Dependence: Symptom or Death Knell?
  - **Your case exposes a decisive flaw**:  
    - **Initial menu (A,B,C)**: C wins (0.54) via case-relative normalization.  
    - **Menu without B**: A and C tie (0.45).  
  - **Why this is fatal**:  
    - **Violates Independence of Irrelevant Alternatives (IIA)**: C’s "choice-worthiness" changes based on an option *no one chooses* (B). This is not cosmetic—it makes the theory **arbitrary and manipulable**.  
    - **Money-pump vulnerability**: An adversary could:  
      1. Offer menu {A,B,C} → you choose C.  
      2. Remove B (sibling takes over) → menu {A,C} → you are indifferent.  
      3. Charge you to add back B or pay you to remove A.  
      Result: You pay to cycle between equivalent positions.  
  - **Verdict**: Menu-dependence is a **reductio of case-relative normalization**. It reveals that the aggregation method lacks a coherent account of *what is being measured*.  

  ### (iii) Comparison of Alternatives
  | **Approach**              | **Handles Menu-Dependence?** | **Handles "No Theory Endorses C"?** | **Fatal Flaw**                                                                 |
  |---------------------------|------------------------------|-------------------------------------|--------------------------------------------------------------------------------|
  | **Expected Choice-Worthiness (Case-Relative)** | ❌ (Severe IIA violation)      | ❌ (C wins as a "compromise")        | Arbitrary outcomes; manipulable.                                              |
  | **My-Favourite-Theory**   | ✅                            | ❌ (Forces A, ignoring 55% dissent)  | Ignores minority views; violates "moral hedging" intuition.                   |
  | **Variance-Based Scaling** | ⚠️ (Less menu-dependent)      | ❌ (Likely still favors C)           | Assumes variances are comparable across theories (they’re not).                |
  | **Global Scale**          | ✅                            | ❌ (Amplifies "extreme" theories)    | Hands equal credence to theories with wildly different ambitions (e.g., a theory valuing a paperclip at ±1,000,000 dominates). Requires judging "ambition" morally. |
  | **Nash Bargaining**       | ⚠️ (Depends on disagreement pt) | ⚠️ (May force compromise)           | Needs comparable utilities *and* a moralized "disagreement point" (e.g., "no agreement = doom"). Smuggles fairness commitments. |

  **Key Insight**: All alternatives either fail menu-independence, force unpalatable compromises, or introduce new moral judgments. **No approach is neutral**—each implicitly ranks theories by "weight" (scale sensitivity) or "authority" (credence dominance).  

  ### (iv) Forbidden vs. Merely Bad: A Separate Problem?
  - **Yes, and it breaks the machinery**:  
    - **Cardinal frameworks** treat "forbidden" as *low scalar value* (e.g., Theory 3 giving A a score of -∞). But:  
      - If you assign -∞, expectation breaks (A is infinitely bad).  
      - If you assign a large negative number (e.g., -1000), it’s merely "very bad"—losing the deontic force of *absolute prohibition*.  
    - **Fundamental mismatch**: Deontic constraints ("never do X") are **categorical**, not scalar. Expectation aggregation reduces them to one dimension, destroying their logical structure.  
  - **Consequence**: Theories with categorical constraints cannot be integrated into scalar frameworks without violating their core commitments. This is a **distinct problem** from scaling.  

  ### Conclusion: The Aggregation Dilemma
  Your suspicion is correct: this is not about morality per se, but about **aggregating incommensurable systems of value**. The core takeaways:  
  1. **No free lunch**: Any aggregation method requires **intertheoretic comparisons**, which demand a *first-order moral stance* on how values relate.  
  2. **Menu-dependence** is a fatal flaw for case-relative normalization.  
  3. **Alternatives trade one problem for another**: Global scales bias toward extreme theories; bargaining imports fairness; my-favourite-theory ignores uncertainty.  
  4. **Deontic constraints** expose a hard limit—scalar aggregation cannot capture categorical "oughts."  

  **Why this matters for your group**: The "expected choice-worthiness" framework is not a neutral procedure—it implicitly endorses a **consequentialist meta-theory** where all moral considerations are commensurable and tradeoffable. Your case shows that non-consequentialist theories (e.g., those with prohibitions or incommensurable values) cannot be fairly incorporated. This suggests normative uncertainty may require fundamentally different tools than empirical uncertainty.
