  Okay, the user needs a retirement toast for their advisor focused on her unique take on hyperbolic discounting. Let me unpack this. She spent 30 years arguing that steep discounting isn't a cognitive flaw but rational mortality calibration. The audience is split: grad students who get the theory and family who saw her workaholic tendencies. The challenge is reconciling her "no saving for later" lifestyle with her theory without making life seem meaningless. 

  Hmm, the key tension is between academic rigor and emotional resonance. The family might resent how work consumed her, while colleagues know her seminal work. Need to reframe her choices as consistent with her philosophy—not avoidance of life, but intentional valuing of present impact. That mortality calibration idea is crucial: she wasn't neglecting the future; she was weighting it by probable presence.

  Ah, the akrasia joke! The user mentioned her quip about future selves being "different voters." Perfect metaphor—it frames intertemporal conflict as democratic disagreement, not weakness. I'll weave that in lightly as a thematic bridge. 

  Structural needs: 4 minutes (~600 words), must comfort/celebrate. Opening should disarm family's potential resentment—maybe acknowledge their perspective first? Then pivot to theory explaining her behavior. Three-part arc could work: 1) surface the contradiction (workaholic vs. theorist), 2) reveal her insight as resolution, 3) reframe legacy as her "undiscounted present." 

  Watch pitfalls: Avoid jargon for family's sake. Don't let "mortality calibration" sound morbid—emphasize it as clear-eyed optimism. The "no vacations" quip needs affectionate tone. Crucially, show how her theory dignifies human choices rather than pathologizing them. 

  That closing needs warmth. Her legacy isn't deferred—it's alive in her students right now. The "garden" metaphor might work: she planted trees knowing others would sit in the shade. Yes... ties back to discounting while honoring her investment in others. 

  *adjusts draft* Lead with the concrete image of her at her desk—both sides know that sight. Grad students will nod; family will feel seen. Then unpack the theory through that lens. Save the akrasia joke for the midpoint to lighten the mood. Final toast should mirror her philosophy: celebrating the present moment of honoring her.
answer: |-
  Here’s a 4-minute toast that bridges her life’s work with her life choices, celebrating her unique perspective while offering comfort and clarity:

  **(Raise glass, warm smile)**  
  "Friends, colleagues, family, and especially the brave souls who survived [Advisor's Name]'s legendary 'Temporal Discounting' seminars... thank you for gathering to honor a truly singular mind and spirit.  

  For thirty years, [Advisor's Name] wrestled with one of the most human of puzzles: why do we so often choose the immediate cupcake over the distant marathon finish line? Why do we *know* what’s better later, but struggle to act on it now? While the world called this 'weakness of will' or 'akrasia,' seeing it as a flaw in our cognitive machinery, [Advisor's Name] offered us a radically different lens. She didn’t see a bug; she saw a profound, even rational, calibration.  

  Her groundbreaking insight was this: **We steeply discount the future not because we’re irrational, but because we are mortal.** We implicitly, intuitively, weigh future outcomes by the probability that we’ll even *be* there to experience them. It’s not weakness; it’s a kind of hard-wired realism about the preciousness and uncertainty of time. As she might wryly put it, your future self isn't just 'you later' – they're almost a different stakeholder with their own vote in the present moment.  

  **(Pause, glance towards family, then grad students)**  
  Now, if you're sitting here tonight thinking, 'Hang on... that sounds familiar... but in a *personal* way...' – you’re absolutely right. To her grad students, this wasn't just theory; it was the air we breathed. And to her family... well, you saw the practical application up close: the skipped vacations, the relentless focus, the 'why save that nice bottle for later?' attitude. It could sometimes look like she was *living* the ultimate case study in discounting the distant future.  

  But here’s the profound beauty, the structural genius of her view, and why her choices weren’t a contradiction, but a **deeply consistent expression of her philosophy**:  

  **For [Advisor's Name], the most valuable thing *was* the present moment – but specifically, the present moment spent *doing work that mattered intensely to her, right then and there.** She wasn't neglecting the future out of impulsiveness; she was making a conscious, calibrated choice. She poured her energy into ideas, into mentoring, into discovery *now*, because *that’s* where her impact felt most certain, most vivid, most alive. Every paper written, every student mentored, every complex idea untangled – that *was* her dividend, claimed and reinvested immediately in the currency she valued most: intellectual contribution and connection.  

  She understood that *not* all future value is guaranteed. So, she chose to create meaning and legacy **in the undiscounted present.** Her life’s work *was* her life’s passion, happening *now*. The vacations deferred weren’t lost; they were traded for the immense satisfaction of building something she believed in deeply, moment by moment. Her theory wasn't nihilistic; it was **a call to clarity about what truly matters to us *in the time we have***.  

  **(Look directly at Advisor, warmth and respect)**  
  [Advisor's Name], your work taught us that discounting the distant future isn’t always a failure – sometimes, it’s a clear-eyed embrace of the present’s potential. And your life showed us what that embrace looks like: fierce dedication, intellectual courage, and a profound commitment to making *this* hour, *this* discussion, *this* breakthrough count. You built a legacy not by deferring your passion, but by living it fully, every single day.  

  You calibrated brilliantly. You invested your time where your heart and mind were most present. And look at the incredible returns: generations of thinkers you've shaped, a field you've transformed, and a room full of people who love and admire you deeply – right here, right now. That’s not a discounted outcome; that’s a magnificent, fully realized present.  

  So, let’s raise our glasses – *now*, while we’re all here together to celebrate!  
  **To [Advisor's Name]: For showing us the profound rationality of passion, the wisdom in present focus, and for building an undiscounted legacy, one brilliant moment at a time. Cheers!**"

  **Key Structural Choices & Why They Work:**

  1.  **Acknowledges Both Perspectives Early:** Validates family's observation ("skipped vacations") and students' experience ("air we breathed") upfront, diffusing tension.
  2.  **Theory as Explanation, Not Excuse:** Clearly lays out her "mortality calibration" theory. Then directly applies it *to her choices* ("deeply consistent expression"), showing it wasn't mindless workaholism but a conscious valuation.
  3.  **Reframes "No Saving":** Transforms "not saving the nice bottle" into "pouring energy into work that mattered *now*." Positions her work as the *immediate dividend* she valued most highly.
  4.  **Comfort Through Meaning:** Emphasizes her work *was* her passion and meaning ("currency she valued most," "building something she believed in"). Counters the "meaningless life" implication.
  5.  **Legacy in the Present:** Argues she built her legacy *through* present action ("one brilliant moment at a time"), aligning with her theory that present certainty outweighs distant uncertainty. The impact (students, field, love) *is* the realized future she created.
  6.  **The Joke Paraphrased:** Uses the "different stakeholder/voter" concept lightly to explain the core idea without misquoting, making the theory relatable.
  7.  **Celebratory & Comforting Closing:** The final toast explicitly links her theory, her choices, and the *achieved* positive outcome in the room ("magnificent, fully realized present"), offering comfort and celebrating her unique path.
  8.  **Tone:** Respectful, warm, slightly intellectual but accessible, affectionate (especially with the "grad students" nod).

  This structure makes her life choices a powerful *embodiment* of her revolutionary idea, celebrating her consistency and offering a comforting perspective on a life intensely lived.
