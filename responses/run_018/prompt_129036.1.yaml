  Read Charlotte's Web through the ethics of meat consumption and wild animal suffering — specifically the crop-cultivation and beef-vs-chicken calculus that usually gets left out of classroom debates. Fern saves Wilbur from the knife, but a pig living years eats massive feed crops that kill field mice and invertebrates during harvest, so I want you to ask whether her rescue actually lowers net suffering or just hides it behind the barn door. Take five scenes — Fern's first rescue, Charlotte writing in the web, the county fair prize, Zuckerman's choice to fatten him for bacon, and the hatching of Charlotte's egg sack — and for each say what it reveals about the gap between visible, named-animal rescue and invisible, systemic crop death. Does the novel know it's doing that? Where does it accidentally reproduce the same sentimental bias the philosophers warn about? Give me exactly five entries, each a sentence or two, no intro or conclusion, and dont worry about quoting the text verbatim.
