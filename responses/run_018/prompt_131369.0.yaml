prompt: |-
  After a long argument with a friend about whether absurdism genuinely allows for meaningful lives, I keep noticing a specific pattern I do not have a name for. Interlocutors defend local, human-scale meaning—loving relationships, artistic creation, moral commitment—by saying these remain valuable even if the universe is indifferent. But when I offer a structurally parallel case, such as someone who spends decades constructing a rigorous taxonomy of micro-decay patterns in decommissioned industrial concrete, building shared knowledge and experiencing deep emotional investment within a small community, the same people dismiss it as “merely coping,” “just a hobby,” or “not the right kind of meaning.” The formal features they praised in the canonical examples—complexity, self-transcendence, relational value—are all present, yet they invoke an unstated cultural canon to exclude the unfamiliar case. Is there an established concept for this precise move: using the rhetoric of scale-independent local meaning to defend a pre-selected list of activities, then treating that list as if it were justified by the rejection of cosmic-scale criteria? If there is no specific term, how should it be carved—what exactly is it, what are its boundary cases, and how does it differ from ordinary parochialism, from equivocation between subjective and objective meaning, and from the defensive retreat characteristic of motte-and-bailey arguments? I want the phenomenon precisely mapped, not merely labeled.
reasoning: |-
  Okay, the user is describing a really interesting philosophical puzzle they've noticed in debates about absurdism and meaning. They've observed that people often defend certain "human-scale" activities like love or art as meaningful despite cosmic indifference, but reject structurally similar niche activities (like cataloging concrete decay patterns) as "merely coping." 

  Hmm... what's fascinating here is the inconsistency in applying the same criteria. The user seems frustrated that the formal qualities praised in conventional examples (complexity, community, emotional depth) are dismissed when they appear in unfamiliar contexts. This feels like a case of cultural bias masquerading as philosophical principle.

  Let me break this down systematically. First, the core move appears to be: 1) Rejecting cosmic meaning criteria, 2) Endorsing local meaning based on formal features, 3) Applying those features selectively to culturally privileged activities. The tricky part is step 3 - how the selection happens while denying it's happening.

  I recall Bourdieu's concept of cultural capital might be relevant here - certain activities carry implicit prestige. But the user wants precision about the logical move itself, not just the sociology. The motte-and-bailey comparison is apt but not quite right because there's no obvious retreat happening - the standards seem consistent on surface.

  What's revealing is that the objection to the concrete taxonomy example always invokes some unspoken "special sauce" missing from the niche activity - but that sauce never appears in the initial criteria. It's like aesthetic judgment masquerading as logical categorization. 

  The boundary cases would be important to map: At what point does an activity cross from "meaningful" to "mere coping"? Is restoring vintage cars meaningful? What about competitive dog grooming? The line seems arbitrary but fiercely defended.

  This seems distinct from ordinary parochialism because the participants believe they've transcended cultural bias through their anti-cosmic stance. The hypocrisy is deeper - they think they're being universalist while actually being tribal. That cognitive dissonance is what makes this phenomenon so thorny.

  For the user, who's clearly thought deeply about this, I should avoid oversimplifying. They don't just want a label - they want tools to dissect the inconsistency. The concept needs to capture both the philosophical claim and its cultural blind spot. Maybe emphasizing the "stealth nature" of the canon is key - how it operates as an unacknowledged premise.
answer: |-
  This is a brilliantly observed philosophical and rhetorical phenomenon that cuts to the heart of meaning-making in an indifferent universe. While no single term perfectly captures this *entire* move, we can precisely map its components, mechanisms, boundary cases, and distinctions:

  **Core Phenomenon: Canon-Dependent Meaning Relativism (CDMR)**

  1.  **The Core Move:**
      *   **Step 1 (The Motte):** Explicitly reject *cosmic* meaning criteria ("The universe is indifferent, so meaning must be local/human-scale/subjective/project-dependent"). This establishes a seemingly universal, scale-independent, anti-absolutist principle.
      *   **Step 2 (The Selective Bailey):** Apply this principle *only* to a pre-selected, culturally privileged set of activities (love, art, family, moral commitment, science, etc.), praising their formal features (complexity, emotional depth, relationality, self-transcendence, effort).
      *   **Step 3 (The Hidden Canon):** When presented with a structurally parallel activity possessing identical formal features but falling outside the unstated canon (e.g., concrete taxonomy), deploy dismissive rhetoric ("merely coping," "just a hobby," "not *real* meaning") without applying the *same* formal criteria consistently or admitting the existence of the canon.
      *   **The Illusion:** The canon appears justified by the rejection of cosmic meaning, but it is actually smuggled in as an unacknowledged, culturally contingent filter. The *rhetoric* of local meaning defends the *content* of the canon.

  2.  **Key Components & Mechanisms:**
      *   **Stealth Canon:** An unarticulated list of activities deemed inherently "meaningful" based on cultural norms, tradition, and perceived social value. It operates as a hidden premise.
      *   **Formal Feature Equivalence:** The parallel case demonstrably shares the formal features (complexity, effort, relationality, emotional investment, shared knowledge) explicitly cited to justify the canonical examples.
      *   **Inconsistent Application:** Failure to apply the *same* formal criteria rigorously to the non-canonical case. Dismissal relies on *implicit*, non-formal criteria ("importance," "universality," "nobility").
      *   **Rhetorical Retreat:** When challenged, retreat to the *formal features* of the canon (Step 2) while simultaneously invoking the *implicit value* of the canon's content to dismiss the parallel case. This is distinct from Motte-and-Bailey, where the retreat is to a defensible but weaker position. Here, the retreat is to the *formal criteria* while still covertly relying on the *canon*.
      *   **Meaning Inflation:** The canon's activities are described in elevated, existentially weighty terms ("love," "art," "moral commitment"), while the parallel case is described reductively ("coping," "hobby").

  3.  **Boundary Cases & Testing Grounds:**
      *   **High-Complexity Niche Pursuits:** Competitive miniature painting restoration, ultra-marathon trail running communities, deep historical reenactment with rigorous scholarship, building complex open-source software for obscure platforms. (Likely dismissed via CDMR).
      *   **Canonical Activities Performed "Badly":** Shallow relationships, derivative art, rigid moralism. (Likely *defended* as potentially meaningful due to their *category*, despite lacking formal features).
      *   **Emerging/Contested Canonical Activities:** Professional esports, intense fan communities creating elaborate lore. (May trigger CDMR initially, potentially assimilated later).
      *   **Non-Western/Non-Dominant Cultural Practices:** Rituals or crafts central to a subculture but unfamiliar to the dominant one. (Prime target for CDMR dismissal).
      *   **"Useful" but Uninspiring Work:** Highly efficient but unfulfilling data entry. (Lacks formal features *and* isn't canonical – genuinely dismissed consistently).
      *   **Pure Hedonism:** Simple, repetitive pleasure-seeking without complexity or community. (Lacks formal features – dismissed consistently).

  4.  **Distinctions from Related Concepts:**
      *   **Ordinary Parochialism/Cultural Bias:** CDMR is a *specific instantiation* of this, but distinguished by its **use of anti-cosmic rhetoric as a shield**. The parochialism is hidden *behind* the seemingly universal rejection of cosmic meaning. It's parochialism masquerading as liberated relativism.
      *   **Equivocation (Subjective vs. Objective Meaning):** CDMR exploits this ambiguity. It uses the *language* of subjective/project-based meaning to defend the canon ("*I* find meaning in love/art"), but when faced with the parallel case, implicitly appeals to an *objective* standard ("but *that's* not *really* meaningful") without acknowledging the shift. The canon becomes the unstated objective standard.
      *   **Motte-and-Bailey (M&B):** CDMR *uses* elements of M&B but is distinct.
          *   *M&B:* Defend a controversial claim (Bailey: "All local meaning is equally valid") by retreating to an uncontroversial one (Motte: "Cosmic meaning doesn't invalidate local meaning").
          *   *CDMR:* The Motte ("Reject cosmic meaning, embrace local meaning based on formal features X, Y, Z") is used to defend the *specific content* of the Bailey (the culturally privileged canon). The retreat isn't primarily to the Motte when challenged on the Bailey; instead, the *defense of the Bailey's content relies on the Motte's principle while selectively applying it*. The inconsistency *within* the Bailey (accepting canon, rejecting parallel) is the core issue, defended by the Motte principle.
      *   **Special Pleading:** CDMR *is* a sophisticated form of special pleading. The unstated canon is the "special case" exempt from the rigorous application of the formally stated criteria. The reason given for exemption ("It's not the *right kind*") is circular and based on the canon itself.
      *   **Status Quo Bias:** CDMR strongly manifests this, defending existing cultural hierarchies of "meaningfulness."

  **Precise Mapping & Diagnosis:**

  CDMR is a **rhetorical strategy that leverages the rejection of cosmic meaning to legitimize a culturally contingent hierarchy of meaningful activities, while masking the hierarchy's existence through inconsistent application of formally stated criteria and dismissive labeling of structurally equivalent non-canonical pursuits.** It reveals an unacknowledged commitment to a specific cultural narrative about what constitutes a "properly" human life, even amidst cosmic absurdity. The dissonance arises because the defender *feels* the existential weight and social validation of the canonical activities but cannot articulate a formal criterion that includes them while excluding the parallel case without resorting to circularity or unstated cultural norms.

  **In essence:** The defender claims to have liberated meaning from cosmic insignificance only to immediately re-tether it to an unexamined cultural script, using the language of liberation to enforce a hidden orthodoxy about what counts as "genuine" meaning-making. The parallel case acts as a revelatory counter-example, exposing the canon's unacknowledged presence.
