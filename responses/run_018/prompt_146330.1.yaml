prompt: |-
  Draft a two-page research proposal for a six-month independent study grant. The core idea, still half-formed, is this: the standard literature on legal self-reference—beginning with Peter Suber's analysis of self-amending rules—treats the paradox as a logical contradiction arising when a rule governs its own content. I want to argue that this framing misses a distinct, and perhaps more destabilizing, form of self-reference that I am calling horizontal self-reference: a rule that does not mention its own propositional content, but instead modifies its own authority-level or hierarchical rank within a layered normative system (for instance, a constitutional amendment procedure that reclassifies itself as statutory, or a statutory sunset clause that promotes itself to constitutional status).

  The precise research question: does horizontal self-reference generate a failure mode different from logical contradiction—specifically, an authority-collapse in which the system can no longer determine which normative layer governs the amendment—and can we formalize the stability conditions that prevent it?

  Why existing answers leave this open: current resolutions—acceptance rules, infinite regress blocks, temporal indexing—are designed for vertical self-reference, where a rule mentions itself. They do not systematically distinguish whether the self-reference targets propositional content, hierarchical rank, or meta-authority conditions. Consequently, it is unclear whether those same mechanisms can stabilize a system when its amendment rules change the very layer they inhabit.

  The approach and timeline: Month one, construct a three-part taxonomy—content-reference, rank-reference, and authority-reference—mapping existing accounts onto it. Month two, build a minimal formal model of a two-layer system (constitutional and statutory) with explicit transition rules between layers. Month three, derive consistency conditions for rank-reference amendments, focusing on cases where an amendment procedure demotes or promotes itself. Month four, test whether standard paradox-blocking mechanisms work identically across all three reference types or fail specifically for horizontal cases. Month five, specify the failure conditions: distinguish authority-collapse (loss of layer-identification capacity) from mere logical tension, and identify a proposed "layer-lock" stability condition. Month six, draft the proposal's conclusions, including boundary cases where horizontal and vertical reference interact.

  What counts as success: a precise conceptual distinction between vertical and horizontal self-reference, plus formal conditions showing that horizontal cases require a distinct stability mechanism (the layer-lock) rather than the standard acceptance-rule solution.

  What counts as failure: if the taxonomy collapses—if rank-reference reduces entirely to content-reference—or if the formal model demonstrates that horizontal and vertical cases are resolved by identical mechanisms, leaving no distinctive problem.

  Scope: six months, purely conceptual and formal, no empirical data collection, no fieldwork.

  After the proposal, include a brief structured summary as a JSON object with these exact fields: "research_question" (string), "niche_injection" (string describing the vertical/horizontal distinction), "method_by_month" (array of strings, one per month), "success_criteria" (string), "failure_criteria" (string), and "scope" (string). Write the entire response in American English.
