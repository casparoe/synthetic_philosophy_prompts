prompt: |-
  I am preparing a single ninety-minute seminar for first-year internal-medicine residents. They have substantial clinical experience but no formal philosophy training. The concept I need them to grasp is not the generic killing-versus-letting-die distinction, but a specific structural variant I will call the maintained-omission problem: an omission becomes morally active in the same register as a killing when an agent continuously sustains the institutional or physical conditions that prevent rescue, rather than merely failing to intervene in a one-off situation.

  Plan the explanatory arc for the session. First, state the dependency order: which idea must be secured before the residents can recognize a maintained omission (for instance, the distinction between a baseline that is naturally given and one that is engineered by prior choices), and which idea must come only after that is stable. Second, specify the one carrying case—realistic, clinical, and not the familiar ventilator-withdrawal scenario—describing exactly what features it needs (e.g., an ongoing resource-allocation protocol the physician co-authored and continues to enforce) and what it must lack (e.g., a sudden, unanticipated emergency decision made in isolation). Third, map the misconceptions they will form in sequence—likely beginning with “if my hands do not touch the patient, my agency is not involved,” then “institutional rules diffuse personal responsibility,” then “withholding care is always less active than withdrawing it”—and indicate the precise point in the arc where each misconception should be headed off, together with the specific distinction or question you would deploy at that point. Fourth, design the final check for understanding: one brief judgment task or modified scenario that reveals whether they have grasped the structural claim rather than merely feeling moral discomfort. Fifth, say explicitly what standard frameworks—such as the four-principles approach or a simple utilitarian calculus—should be named and set aside at this level, with a brief reason why each obscures the maintained-omission point. Finally, identify where your reasoning about this sequence is most likely to fail: what clinical objection or feature of real-world triage would undermine the claim that maintained omissions belong in the same moral category as killings, and what specific consideration or counterexample would change your mind about either the suitability of this case or the coherence of the maintained-omission framework itself.
reasoning: |-
  Okay, the user is asking for a detailed seminar plan on the "maintained-omission problem" for first-year internal medicine residents. They want a structured explanatory arc that goes beyond basic ethics concepts. 

  First, I need to unpack what makes this request special. The user isn't looking for generic medical ethics - they're targeting a very specific philosophical nuance about ongoing institutional omissions versus one-time non-interventions. The residents have clinical experience but no formal philosophy training, so the challenge is bridging that gap in 90 minutes.

  Hmm, the dependency order is crucial here. Before even introducing "maintained omission," I need to establish how baselines aren't neutral - that's the foundation. You can't see an omission as active unless you first understand that the "normal" state of affairs might already be shaped by human choices. Only then can we build to the key concept.

  For the case study... ventilator withdrawal is forbidden per the query. Need something with continuous institutional involvement. Aha! ICU admission criteria maintained by the physician's own committee work fits perfectly. It must show: protocol co-authorship, ongoing enforcement, non-emergent context, and a clear alternative outcome if the protocol changed. 

  The misconceptions part is tricky. I can predict three likely misunderstandings based on clinical culture: the "clean hands" fallacy (agency only in direct contact), responsibility diffusion in systems, and the withholding/withdrawing false hierarchy. Each needs a precise interception point - like using the baseline distinction to shatter the "clean hands" idea early on.

  For the understanding check... a quick judgment task works best. The modified case with Dr. Vance should force them to spot maintained omission even when the physician didn't create the protocol originally. If they get hung up on authorship versus maintenance, they've missed the point.

  Notably, I should explicitly dismiss standard frameworks like principlism or utilitarianism here - they flatten the temporal aspect of maintained omissions. The four principles don't capture how responsibility accrues over sustained choices. 

  Biggest vulnerability? Real-world resource constraints. If a resident argues that changing protocols would collapse the system, that challenges the moral equivalence claim. I'd need a counterexample where maintaining scarcity was clearly elective - like rejecting a feasible donor system - to preserve the framework's coherence.
answer: |-
  Here's a structured plan for your 90-minute seminar on the "maintained-omission problem," designed for clinically experienced but philosophically novice residents:

  **I. Dependency Order (Sequential Building Blocks):**
  1.  **Foundation:** The distinction between a *naturally given baseline* (e.g., a patient with an incurable disease dying without any available intervention) and an *engineered/actively maintained baseline* (e.g., a patient dying because existing, feasible interventions are systematically withheld by institutional rules). *Must be secured first.*
  2.  **Core Concept:** **Maintained Omission:** An omission becomes morally active akin to a killing when the agent *sustains the institutional/physical conditions preventing rescue* over time, rather than merely failing to intervene in a single, isolated event. *Built directly upon the baseline distinction.*
  3.  **Implication:** Personal responsibility attaches to the *ongoing maintenance* of the system/conditions causing preventable harm, even if the agent didn't create the system initially and isn't the direct cause in each instance. *Comes after "maintained omission" is stable.*

  **II. The Carrying Case: "The Chronic Clinic Capacity Protocol"**

  *   **Scenario:** Dr. Lee sits on her hospital's Outpatient Specialty Clinic Access Committee. 18 months ago, she helped design and approve a strict protocol limiting referrals for a specific, life-altering chronic condition (e.g., severe autoimmune disease requiring biologics, advanced heart failure needing specialized device management) to only patients meeting very narrow criteria (e.g., under 65, no significant comorbidities, specific lab thresholds). This was driven by genuine resource constraints (limited clinic slots, expensive meds), but feasible alternatives (e.g., staggered scheduling, telemedicine expansion, phased drug initiation funding) were rejected as "too complex" or "not sustainable." Dr. Lee regularly reviews and *reaffirms* this protocol quarterly. Today, she sees Mr. Jones in the ER - he clearly has the condition, is suffering progressive disability/pain, meets the *medical* need for the specialty clinic, but is excluded *solely* by the protocol criteria she maintains (he's 67). She knows referring him would require a complex, time-consuming exception process she consistently votes against streamlining. She follows the protocol, discharging him with palliative measures only, knowing his decline is preventable.
  *   **Necessary Features:**
      *   **Ongoing Protocol:** A pre-existing, rule-based system governing access to care.
      *   **Co-Authorship & Maintenance:** Physician actively participated in creating *and* continuously sustains/enforces the protocol.
      *   **Preventable Harm:** Clear, foreseeable negative outcome directly traceable to the protocol.
      *   **Feasible Alternative:** Existence of a plausible (though perhaps inconvenient) way to provide care, rejected/maintained against.
      *   **Non-Acute Context:** Decision happens outside an emergency; time exists for reflection/system change.
      *   **Personal Encounter:** Physician confronts the human cost directly but is bound by their own maintained rules.
  *   **Must Lack:**
      *   Sudden emergency decision-making.
      *   Isolation (it's embedded in a system the physician helps govern).
      *   Ventilator/withdrawal imagery.
      *   Ambiguity about whether intervention would work.

  **III. Misconceptions & Interceptions:**

  1.  **Misconception:** "If my hands do not touch the patient (e.g., I didn't *deny* Mr. Jones myself, the protocol did), my agency is not involved; it's just a sad omission."
      *   **Interception Point:** Immediately after presenting the case baseline (Mr. Jones excluded) but *before* introducing the committee role.
      *   **Tool:** **Baseline Distinction Question:** "Is the situation where Mr. Jones gets no specialized care the 'natural' state of affairs (like having no treatment available at all), or is it a state *created and kept in place* by specific human decisions? What makes it different from a natural disaster lacking resources?"
  2.  **Misconception:** "Institutional rules diffuse or eliminate my personal responsibility; I'm just following policy/I'm one voice on a committee."
      *   **Interception Point:** When revealing Dr. Lee's role in creating and *maintaining* the protocol.
      *   **Tool:** **Maintenance Question:** "Does Dr. Lee's responsibility change because she's part of a committee? Does repeatedly *choosing* to keep this specific rule in place, knowing its consequences each time she reviews it, make her relationship to Mr. Jones's fate different than if she randomly encountered him and ignored his need?"
  3.  **Misconception:** "Withholding care (never starting) is always less active/morally problematic than withdrawing care (stopping)."
      *   **Interception Point:** If/when this analogy arises (likely during discussion of the case implications).
      *   **Tool:** **Temporal Action Distinction:** "The withholding/withdrawing distinction focuses on a *single point in time* (initiation vs. cessation). How does *sustained, repeated action to preserve the barrier* (maintaining the protocol quarterly) change the moral nature of the 'withholding'? Is it still just a passive omission?"

  **IV. Final Check for Understanding:**

  *   **Task:** Present a **briefly modified scenario:** Dr. Vance *inherited* the same restrictive clinic protocol 6 months ago. She privately thinks it's too strict but hasn't challenged it because she's new and the committee chair is formidable. She sees a similar patient excluded by the protocol. She follows it, feeling uneasy.
  *   **Question:** "Is Dr. Vance's situation regarding the maintained omission problem *significantly different* from Dr. Lee's? Why or why specifically?"
  *   **Reveals Grasp If:** They identify that while Dr. Vance hasn't *authored* the protocol, her *ongoing failure to challenge or work to change it* (despite believing it harmful and having some agency, however limited) starts to approach maintained omission, but is arguably less direct/active than Dr. Lee's *sustained affirmation*. They focus on the *maintenance of the harmful condition* rather than just unease or initial authorship. If they focus *only* on her unease or the initial authorship difference, they've missed the structural claim about ongoing maintenance.

  **V. Frameworks to Name and Set Aside:**

  1.  **Principlism (Autonomy, Beneficence, Non-Maleficence, Justice):**
      *   **Why Set Aside?** While relevant (e.g., Justice in resource allocation), principlism often treats omissions as passive breaches of Beneficence/Non-Maleficence and struggles to articulate the *active, sustained nature* of maintaining a harmful system. It doesn't clearly distinguish the moral weight of a one-time omission vs. an actively perpetuated one. It risks flattening the structural issue into a conflict between principles.
  2.  **Simple Utilitarian Calculus (Greatest Good):**
      *   **Why Set Aside?** Utilitarianism might justify the protocol based on aggregate benefit. However, it obscures the specific moral responsibility of the agents *maintaining* the system causing harm to identifiable individuals. It doesn't capture why *sustaining* the harmful condition is morally distinct from a necessary one-time tragic choice under scarcity. It prioritizes outcome over the nature of the agency involved in perpetuating the harm.
  3.  **Standard Killing vs. Letting Die:**
      *   **Why Set Aside?** The entire seminar moves beyond this. The generic distinction focuses on causality at a single point in time (act vs. omission) and often assumes a neutral baseline. It fails to address the core issue: how *sustained action* transforms an omission into something morally active by *engineering and maintaining* the lethal baseline.

  **VI. Likely Point of Failure & Counter-Consideration:**

  *   **Likely Clinical Objection:** "This ignores the harsh reality of *inescapable scarcity*. We *have* to ration. Maintaining the protocol isn't an elective 'act'; it's the only way to keep the system functioning and prevent *total collapse*, which would harm *more* patients. Changing it isn't feasible. Calling this equivalent to killing paralyzes necessary, if tragic, system management."
  *   **Why it Undermines:** It challenges the premise that maintaining the barrier is "active" in the same way as a killing by framing it as a *passive acceptance* of an immutable constraint, negating the "engineered baseline" concept.
  *   **What Would Change My Mind:**
      1.  **Counterexample Demonstrating Elective Maintenance:** Evidence that the specific barrier (e.g., the *exact criteria* excluding Mr. Jones) is *not* actually necessary for system function given *feasible, ignored alternatives* (proving the baseline *is* actively engineered). If the maintenance is truly unavoidable given *all* reasonable options, the moral equivalence weakens.
      2.  **Coherence Challenge - Intent vs. Structure:** If compelling arguments show that the *intentional structure* of continuously upholding a rule causing death is fundamentally different in kind from a direct killing, regardless of outcome, due to differences in immediacy, intent, or causal chains. However, demonstrating that the *sustained agency* in maintaining the lethal conditions carries significantly *less* responsibility than direct action would be necessary to abandon the framework.
      3.  **Suitability of Case:** If real-world triage consistently involves *no* feasible alternatives and *no* meaningful opportunity for physicians to influence the systems (making "maintenance" purely passive adherence), then this specific case becomes less illustrative. The framework would still apply to instances where maintenance *is* elective, but its general applicability to resource allocation would be reduced.

  This plan prioritizes building the conceptual foundation (baseline), using a targeted case, preempting predictable misconceptions, and testing for structural understanding, while acknowledging the framework's limitations and potential points of vulnerability in clinical reality.
