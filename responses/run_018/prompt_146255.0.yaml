prompt: |-
  I'm on the review board for our state's disability and chronic-condition funding pool, and every month we recieve about a dozen applications asking us to classify some condition as a 'disease' for coverage and research grants. The committee is split between folks who want a naturalist definition — basically Boorse-style statistical deviation from species-typical biological function — and folks who want a normativist one, like Nordenfelt's idea that disease is failure to achieve vital goals given standard circumstances. We need a reusable procedure that works in a 90-minute meeting with no philosophy PhDs present, and I want it to be honest about where it breaks.

  Write it as a step-by-step flow: first check biological dysfunction with concrete criteria, then check harm/vital-goals impairment, then specify exactly where the two conflict and what tie-breaker applies. Give worked examples for three cases — one clear naturalist win, one clear normativist win, and one borderline clash like 'persistent social-comparison fatigue in heavy social-media users,' which is the kind of weird modern case we actually see. Include one case where the procedure gives an answer I'll probably dislike, and flag every point where we still have to punt to a subcommittee or just vote rather than hiding behind false objectivity. Also tell me what argument or finding would change your mind about which framework should dominate tie-breakers, and point out where your reasoning is most vulnerable — don't give me fake confidence.
reasoning: |-
  We are designing a practical procedure for a committee to classify conditions as diseases for funding purposes. The procedure must be usable in 90-minute meetings without philosophy expertise. We'll have two main criteria: biological dysfunction (naturalist) and harm/vital-goals impairment (normativist). We'll also have a tie-breaker for when they conflict.

  The steps:

  1. **Check for Biological Dysfunction** (Naturalist Criterion):
     - We look for evidence of statistically atypical biological functioning that impairs the body's ability to perform a typical function for the species.
     - Concrete criteria:
       - Is there a measurable deviation from species-typical biological function (e.g., lab tests, imaging, genetic markers)?
       - Is this deviation statistically uncommon in the general population? (We might use a threshold, e.g., affecting less than 5% of the population, but note that some common conditions may still be diseases.)
       - Is there an impairment in a biologically designed system (e.g., immune system, cardiovascular system, etc.)?

     If yes, then condition meets naturalist criterion. If no, it fails.

  2. **Check for Harm or Vital Goals Impairment** (Normativist Criterion):
     - We look for evidence that the condition causes harm or impairs the individual's ability to achieve vital goals in standard circumstances.
     - Concrete criteria:
       - Does the condition cause significant suffering or distress?
       - Does it impair the individual's ability to achieve what are widely recognized as vital goals (e.g., basic survival, avoiding severe pain, maintaining social relationships, working, etc.)?
       - Is this impairment present in standard circumstances (i.e., not due to unusual social or environmental factors that are easily modifiable)?

     If yes, then condition meets normativist criterion. If no, it fails.

  3. **Resolve Agreement or Conflict**:
     - If both criteria agree (both pass or both fail), then we have a clear decision: disease if both pass, not disease if both fail.
     - If they conflict (one passes, the other fails), then we proceed to a tie-breaker.

  4. **Tie-Breaker**:
     - We default to a normativist stance in case of conflict, because funding is ultimately about alleviating human suffering and improving lives. However, we note that this is a pragmatic choice and not philosophically absolute.
     - But note: We must be cautious when the naturalist criterion fails and normativist passes (i.e., no biological dysfunction but there is harm). This might be cases of social problems or non-medical conditions. We must consider if the condition is appropriately addressed by medical intervention (as opposed to social or policy changes).

     - The tie-breaker step:
       - If naturalist passes and normativist fails: condition is not a disease (because no harm is demonstrated, so it's a mere difference). 
       - If naturalist fails and normativist passes: condition is classified as a disease only if the harm is severe and persistent, and if medical intervention is an appropriate response. Otherwise, it may be a social problem.

     - However, we must flag that this tie-breaker is vulnerable and we might need a subcommittee or vote in ambiguous cases.

  5. **Handling Uncertainties**:
     - At any step, if there is insufficient evidence or major disagreement, the committee can:
       - Request more information (if time allows) and defer to a future meeting.
       - Form a subcommittee to investigate and report back.
       - Take a vote (simple majority) to resolve the step.

  6. **Documentation of Breakdown**:
     - We explicitly document:
       - Which criterion was met and which wasn't.
       - Why the tie-breaker was applied and the rationale for the decision.
       - Any points of uncertainty or disagreement.

  Worked Examples:

  **Example 1: Clear Naturalist Win (Type 1 Diabetes)**
  - Step 1 (Biological Dysfunction): 
    - Measurable: Elevated blood sugar, lack of insulin production. 
    - Statistically atypical: Affects about 0.5% of the population. 
    - Impairs biological function: Inability to metabolize glucose, leading to organ damage. 
    - **Passes**.
  - Step 2 (Harm/Vital Goals): 
    - Without treatment, leads to severe health consequences (coma, death), impairs daily functioning. 
    - **Passes**.
  - Resolution: Both pass. Classify as disease.

  **Example 2: Clear Normativist Win (Major Depressive Disorder - without known biological marker)**
  - Step 1 (Biological Dysfunction): 
    - Currently, no consistent measurable biological deviation (like a specific lab test). There are brain changes, but they are not yet specific and reliable enough to be a clear dysfunction. 
    - **Fails** (based on current evidence).
  - Step 2 (Harm/Vital Goals): 
    - Severe suffering, inability to work, maintain relationships, or enjoy life. 
    - **Passes**.
  - Tie-breaker: Naturalist fails, normativist passes. We apply tie-breaker: condition causes severe harm and medical intervention (therapy, medication) is appropriate. 
  - Decision: Classify as disease.

  **Example 3: Borderline Clash (Persistent Social-Comparison Fatigue in Heavy Social-Media Users)**
  - Description: A condition characterized by chronic exhaustion, anxiety, and low self-esteem due to constant social comparison on social media, leading to impaired work and social functioning.
  - Step 1 (Biological Dysfunction): 
    - No known biological marker. The fatigue and anxiety may be within normal range of stress responses, though chronic. 
    - Is there a deviation in biological function? Perhaps in cortisol levels or sleep patterns? But these are non-specific and might be within normal variation. 
    - Currently, we lack evidence for a biological dysfunction. **Fails**.
  - Step 2 (Harm/Vital Goals): 
    - Significant distress and impairment in work and social life. 
    - Vital goals (maintaining employment, relationships) are impaired. 
    - **Passes**.
  - Tie-breaker: Naturalist fails, normativist passes. We must decide if medical intervention is appropriate. 
    - Concerns: This condition may be a social problem (due to social media use) and might be better addressed by reducing social media or societal changes. Medicalization might be inappropriate.
    - However, if the impairment is severe and persistent, and if there's evidence that medical or psychological interventions can help, we might classify it as a disease.
    - But note: This is contentious. We might form a subcommittee to review evidence on treatment efficacy or take a vote.

  **Example 4: An Answer You Might Dislike (Homosexuality in a Pathologizing Context)**
  - This example is historical, but let's reframe: A group applies for coverage for a condition they call "Same-Sex Attraction Disorder," claiming it causes distress in some individuals due to internal conflict or social rejection.
  - Step 1 (Biological Dysfunction): 
    - Homosexuality is not a dysfunction of the reproductive system. It is a normal variation in sexual orientation. 
    - **Fails**.
  - Step 2 (Harm/Vital Goals): 
    - The applicants claim harm: distress due to internal conflict or social rejection. 
    - However, the harm is caused by social stigma, not by the attraction itself. In standard circumstances (without stigma), same-sex attraction does not impair vital goals. 
    - Therefore, we must reject the normativist claim because the harm is not inherent to the condition but due to modifiable social circumstances. 
    - **Fails**.
  - Resolution: Both fail. Not a disease.

    But note: If an individual experiences distress because of their attraction (even without external stigma) and it impairs their ability to form relationships, we might consider it under normativist? However, we must be cautious. The condition itself (attraction) is not dysfunctional, and the distress might be better framed as an adjustment issue. This is why our procedure requires that the harm must be inherent to the condition in standard circumstances. We explicitly note that social stigma is not a standard circumstance we should medicalize.

    This outcome might be disliked by applicants who want coverage for conversion therapy or similar, but the procedure rejects it.

  Where the Procedure Breaks and Vulnerabilities:

  1. **Biological Dysfunction Criterion**:
     - Vulnerable: It relies on current scientific understanding. What if we don't know the biological basis? (e.g., mental health conditions without biomarkers). We might miss conditions that are genuinely biological but not yet understood.
     - We have to decide what counts as "species-typical". What about aging? Or common conditions like myopia?

  2. **Harm/Vital Goals Criterion**:
     - Vulnerable: Vital goals are culturally relative. Who defines them? We use "widely recognized" but that's vague. Also, harm might be subjective.

  3. **Tie-Breaker**:
     - We chose normativist when naturalist fails because funding is for human welfare. But this could lead to medicalizing social problems. We have a safeguard: only if medical intervention is appropriate. But what is "appropriate"? This is a judgment call.

  4. **Borderline Cases**:
     - The example of social-media fatigue shows how we might medicalize a condition that is socially induced. We must be cautious and consider if the condition is a normal response to an abnormal (but common) environment.

  What Would Change the Tie-Breaker Dominance?

  - If we found that medical interventions for conditions without biological dysfunction are consistently ineffective or harmful, we might reconsider using normativist as the tie-breaker. Also, if we discover that many conditions we thought had no biological basis actually do, we might shift towards naturalist.

  Most Vulnerable Point:

  - The tie-breaker step when naturalist fails and normativist passes. This is where we risk over-medicalization. We must be transparent that we are making a value judgment about what counts as appropriate for medical intervention.

  Procedure Flowchart:

  1. **Biological Dysfunction Check**:
     - Evidence of statistically atypical biological function? (Y/N)
     - If Y, pass; else, fail.

  2. **Harm/Vital Goals Check**:
     - Evidence of significant harm or impairment of vital goals in standard circumstances? (Y/N)
     - If Y, pass; else, fail.

  3. **Decision**:
     - If both pass: Disease (cover).
     - If both fail: Not disease (do not cover).
     - If conflict:
       - If naturalist pass and normativist fail: Not disease.
       - If naturalist fail and normativist pass: 
           - Is the harm severe and persistent? 
           - Is medical intervention an appropriate response? 
           - If both Y, then disease; else, not disease. (But if uncertain, form subcommittee or vote.)

  4. **Document Breakdown**:
     - Record: 
       - Outcome of each step.
       - Reason for tie-breaker application.
       - Any unresolved issues.

  This procedure is designed to be practical and transparent about its limitations. It doesn't hide the value judgments but structures them.
answer: |-
  Here's a step-by-step procedure designed for practical committee use, with built-in transparency about limitations. It prioritizes speed, forces explicit documentation of disagreements, and uses a normativist tie-breaker (based on funding pools' purpose of alleviating harm). **Bold text** indicates required documentation points.

  ---

  ### **Disease Classification Flow Procedure**  
  *(Max 90 mins per case; chair enforces time)*  

  **STEP 1: BIOLOGICAL DYSFUNCTION CHECK (BOORSE-STYLE NATURALIST)**  
  *Time: 15 mins*  
  **Ask:**  
  - Is there objective evidence of **statistically atypical function** (e.g., lab/imaging/genetic results outside 95% population range)?  
  - Does this deviation **impair a biologically designed system** (e.g., immune, endocrine, neural circuits)? Use WHO/ICD standards.  
  - Is this deviation **intrinsic to the individual** (not environmentally induced, e.g., not due to injury from external trauma)?  

  ▶ **Outcomes:**  
  - **PASS:** All 3 criteria met → proceed to Step 2.  
  - **FAIL:** Any criterion unmet → skip to Step 2.  
  - **UNCLEAR:** Insufficient data or committee deadlock → **flag for subcommittee review** (document specific gaps).  

  **STEP 2: HARM/VITAL GOALS CHECK (NORDENFELT-STYLE NORMATIVIST)**  
  *Time: 15 mins*  
  **Ask:**  
  - Does the condition cause **documented suffering** (e.g., pain scales, quality-of-life surveys, functional impairment logs)?  
  - Does it impede **≥1 vital goal** (define as: survival, basic autonomy, capacity for social participation, ability to perform daily tasks) under **standard circumstances** (i.e., in typical societal settings, not niche environments)?  
  - Is this harm **persistent/recurrent** (not transient or situational)?  

  ▶ **Outcomes:**  
  - **PASS:** All 3 criteria met → proceed to Resolution.  
  - **FAIL:** Any criterion unmet → proceed to Resolution.  
  - **UNCLEAR:** → **flag for subcommittee review** (document specific gaps).  

  **STEP 3: RESOLUTION MATRIX**  
  *Time: 5 mins*  

  | Step 1 Result | Step 2 Result | Classification       | Tie-Breaker/Notes                                                                 | Documentation Required                                                                 |
  |---------------|---------------|----------------------|-----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | PASS          | PASS          | **DISEASE**          | None needed.                                                                      | None.                                                                                  |
  | FAIL          | FAIL          | **NOT DISEASE**      | None needed.                                                                      | None.                                                                                  |
  | PASS          | FAIL          | **NOT DISEASE**      | "Dysfunction without harm = difference, not disease."                             | **Explain why harm is absent despite biological anomaly.**                              |
  | FAIL          | PASS          | **TIE-BREAKER**      | Proceed to Tie-Breaker Protocol (Step 4).                                         | **Note: Naturalist-normativist conflict detected.**                                   |

  **STEP 4: TIE-BREAKER PROTOCOL** (Only if FAIL/PASS conflict)  
  *Time: 20 mins*  
  **Ask:**  
  1. **Severity Test:** Is the harm **life-threatening** or **severely disabling** (e.g., prevents work/social participation >50% of the time)?  
  2. **Medical Appropriateness Test:** Is there evidence that **medical intervention** (not social/policy change) can alleviate >30% of the harm?  
  3. **Social Context Test:** Is the harm primarily caused by **societal injustice/stigma**? (If yes, medicalization may be inappropriate.)  

  ▶ **Outcome:**  
  - **YES to 1 AND 2, NO to 3 → DISEASE** (Normativist override).  
  - **Any other result → NOT DISEASE**.  
  - **Uncertain → Vote** (simple majority; document vote split). **Do not pretend certainty.**  

  **STEP 5: BREAKDOWN TRANSPARENCY**  
  *Time: 2 mins*  
  **Document in verdict:**  
  - ⚠️ **"CLASSIFICATION BREAKDOWN"**: Explicitly state where criteria conflicted and why tie-breaker was applied.  
  - ⚠️ **"UNCERTAINTY FLAGS"**: List any subcommittee referrals or votes.  
  - ⚠️ **"FRAMEWORK LIMITS"**: Note if outcome relied on value judgment (e.g., defining "vital goals").  

  ---

  ### **Worked Examples**  

  #### **Case 1: Clear Naturalist Win (Type 1 Diabetes)**  
  - **Step 1:** PASS (β-cell destruction → insulin deficiency; <0.01% prevalence; intrinsic).  
  - **Step 2:** PASS (Harm: hyperglycemia → death; impedes survival).  
  - **Resolution:** PASS/PASS → **DISEASE**.  
  - **Breakdown Note:** "No conflict; both frameworks align."  

  #### **Case 2: Clear Normativist Win (Major Depressive Disorder without Biomarkers)**  
  - **Step 1:** FAIL (No consistent biological marker; symptoms overlap with normal grief).  
  - **Step 2:** PASS (Harm: suicidal ideation, unable to work; impedes vital goals).  
  - **Tie-Breaker:**  
    1. **Severity:** YES (high suicide risk).  
    2. **Medical Appropriateness:** YES (antidepressants/therapy effective).  
    3. **Social Context:** NO (harm intrinsic, not solely stigma-driven).  
  - **Resolution:** **DISEASE** (Normativist override).  
  - **Breakdown Note:** "Biological dysfunction unclear per current science; harm severity justifies classification."  

  #### **Case 3: Borderline Clash ("Social-Comparison Fatigue")**  
  *Condition: Persistent exhaustion/anxiety in heavy social media users, with work impairment.*  
  - **Step 1:** FAIL (No biomarkers; stress response within normal range; environmentally induced).  
  - **Step 2:** PASS (Harm: clinical anxiety scores; impedes work capacity).  
  - **Tie-Breaker:**  
    1. **Severity:** YES (functional impairment).  
    2. **Medical Appropriateness:** NO (evidence shows therapy helps <20%; behavioral changes more effective).  
    3. **Social Context:** YES (harm driven by platform design/cultural norms).  
  - **Resolution:** **NOT DISEASE**.  
  - **Breakdown Note:** "Medical intervention inappropriate; harm socially mediated. Refer to policy team for digital wellness programs."  

  #### **Case 4: "Answer You'll Dislike" (Chronic Low Back Pain without Structural Abnormalities)**  
  *Context: Pain persists despite normal MRI; opioid prescription requests.*  
  - **Step 1:** FAIL (No structural/neurological deviation).  
  - **Step 2:** PASS (Harm: pain scales show severe suffering; impedes daily tasks).  
  - **Tie-Breaker:**  
    1. **Severity:** YES.  
    2. **Medical Appropriateness:** NO (opioids worsen outcomes; PT/psych effective but underused).  
    3. **Social Context:** PARTIAL (disability benefits may incentivize pain focus).  
  - **Resolution:** **NOT DISEASE** (but note: "Requires pain management referral; not fundable under disease pool").  
  - **Why Disliked?** Rejects patient-reported harm despite suffering; highlights system gaps.  

  ---

  ### **When This Procedure Fails (Explicit Vulnerabilities)**  
  1. **Biological Dysfunction Ambiguity**:  
     - **Vulnerability**: Relies on current science (e.g., "no biomarker" ≠ none exists).  
     - **Punt**: Subcommittee if new research emerges (e.g., fibromyalgia once failed Step 1, now passes with cytokine tests).  

  2. **Harm Subjectivity**:  
     - **Vulnerability**: "Vital goals" are culturally defined (e.g., is infertility a disease if procreation isn't a universal goal?).  
     - **Punt**: Vote if disagreement (document cultural biases).  

  3. **Tie-Breaker Justice**:  
     - **Vulnerability**: Normativist override risks medicalizing poverty (e.g., "malnutrition disease" vs. food insecurity).  
     - **Safeguard**: Social Context Test rejects these.  

  ### **What Would Change the Tie-Breaker?**  
  - **Shift to Naturalist Dominance** if:  
    Evidence shows normativist approvals increase stigma without improving outcomes (e.g., over-medicalization of anxiety).  
  - **Key Finding Needed**: A study proving medical interventions for normativist-only conditions cause net harm (e.g., ADHD drugs for non-dysfunctional attention variation).  

  ### **Weakest Reasoning Points**  
  - **Tie-Breaker's "Medical Appropriateness"**: Assumes committees can neutrally judge interventions without industry bias.  
  - **"Standard Circumstances" in Step 2**: Glosses over how environments shape biology (e.g., is obesity a disease in a junk-food ecosystem?).  
  - **False Objectivity Alert**: The procedure can't resolve philosophy debates—it **exposes them** for transparent voting.  

  **Final Note**: This isn't a philosophy tool—it's a **conflict-surfacing mechanism**. By forcing documentation of clashes (e.g., "Naturalist FAIL/Normativist PASS: override rejected due to social etiology"), it prevents hidden biases and allocates accountability. Revisit tie-breakers annually with outcome data (e.g., % of normativist-override cases with successful treatment).
