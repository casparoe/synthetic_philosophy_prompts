prompt: |-
  I'm putting together a two-page proposal for a one-year dissertation fellowship, and I want to tackle collective guilt across generations — specifically whether a nation can be guilty in a non-metaphorical sense once the original actors are dead. I keep returning to Jaspers and his four categories (criminal, political, moral, metaphysical), but that taxonomy dont really settle what happens when only the institutional shell remains: legal systems, bureaucracies, cultural norms that persist through individual turnover. So my injection is to ask whether "institutional persistance" can carry obligations forward in a way that makes generational blame structurally real, not just analogical — or whether that just pushes individual blame back one step and collapses the whole idea.

  Write the proposal with a precise question: does institutional persistence provide a genuine basis for collective guilt across generations, or does it dissolve into distributed individual responsibility? Explain why Jaspers leaves this open — especially the gap between political guilt (attached to citizens of a state) and moral guilt (which seems to require personal agency). Lay out the conceptual method: analyzing identity conditions of institutions over time, then arguing whether obligation-transfer requires continuous agency or can survive discontinuous membership. Describe the deliverable — maybe a framework distinguishing "structural inheritance" from "structural discharge" — and say honestly what failure looks like (the analysis collapses into pure individualism or pure metaphor) and why one year is the right scope but risks being too big if I try to add empirical case studies. Also, address head-on the objection that this is all just rhetoric, since a friend of mine said exactly that.

  Please don't survey every side neutrally. Take a committed position: either defend that institutional persistence genuinely supports non-punitive collective guilt, or argue that it fails and we should drop the language of national guilt altogether. Build that commitment into the framing and method, not just the conclusion. I don't need a bibliography, citations, or a reading list — I'll fill those in myself — and please don't ask me to reference specific texts or page numbers I wouldn't have memorized.
