answer: |-
  ## Dissertation Fellowship Proposal: The Institutional Shell – Can Persisting Structures Bear Collective Guilt Across Generations?

  **Precise Research Question:** Does the persistence of institutions (legal systems, bureaucracies, cultural norms) across generational turnover provide a *genuine, non-metaphorical* basis for collective national guilt, or does it inevitably dissolve into distributed individual responsibility among contemporary members?

  **Core Problem & Jaspers' Gap:** Karl Jaspers' seminal taxonomy (criminal, political, moral, metaphysical guilt) offers crucial distinctions but leaves a critical theoretical void concerning generational transition. While **political guilt** binds citizens *as members* of a state responsible for its actions (even passively), **moral guilt** requires personal agency, choice, and consciousness of wrongdoing. This creates a tension when the original perpetrators and direct beneficiaries are gone: Can the *state* (via its persisting institutional structures) bear political guilt that translates into a meaningful, non-metaphorical moral burden for *later generations* who inherit these structures? Jaspers' framework doesn't resolve whether the institutional "shell" itself can be a carrier of obligation beyond the aggregate of its living members. Does institutional persistence simply distribute diluted responsibility onto new individuals, or does it create a distinct, collective moral subject?

  **Committed Position:** **This project argues that institutional persistence *can* provide a genuine, non-metaphorical basis for collective national guilt across generations, *but only under specific conditions*.** It contends that institutions are not passive vessels but active transmitters of normative logic and power dynamics. When institutions *actively preserve and reproduce* the structural logic, benefits, or harms initiated by past generations (e.g., discriminatory legal precedents, wealth accumulation patterns rooted in historical injustice, narratives justifying past actions), they become agents of **structural inheritance**. This persistence transforms political guilt attached to the state into an ongoing moral burden for the collective entity *embodied* in those enduring structures. Failure to acknowledge and engage with this inherited burden constitutes a form of contemporary moral failure *enabled by the institution*. This position rejects the view that guilt dissolves with individual turnover and resists collapsing collective guilt into pure metaphor.

  **Conceptual Method:** The analysis employs rigorous philosophical argumentation focused on two core conceptual pillars:
  1.  **Institutional Identity Conditions:** What constitutes the persistence of an institution "X" over time despite complete membership turnover? Criteria include: continuity of constitutive rules, core functions/purposes (even if evolving), formal structures, and crucially, the *persistence of specific normative logics or power relations* relevant to the historical injustice.
  2.  **Obligation-Transfer Mechanism:** Does the moral obligation generated by past wrongs require *continuous individual agency* linking perpetrator to beneficiary? Or can obligation "attach" to the persisting institutional structure itself? The argument hinges on demonstrating that institutions capable of **structural inheritance** (preserving harm-perpetuating or benefit-conferring logics) are also capable of "holding" obligations that arise from their own continuous existence and function. The obligation binds the *collective entity* defined by its institutional embodiment in the present, demanding acknowledgement and rectificatory action.

  **Deliverable:** A novel conceptual framework distinguishing:
  *   **Structural Inheritance:** The process by which persisting institutions actively transmit the normative logic, material benefits, or unresolved harms of past collective wrongdoing, creating a genuine basis for non-metaphorical collective guilt in the present generation *as inheritors of that structure*.
  *   **Structural Discharge:** The process by which institutions can *genuinely* dissolve inherited collective guilt through demonstrable actions: dismantling harmful logics, redistributing unjustly held benefits, formally repudiating past wrongs, and integrating rectification into their core identity. Mere time passage or membership change is insufficient.

  **Risk of Failure & Scope Justification:** The primary risk is conceptual collapse: either into **Pure Individualism** (failing to show how institutions create a moral subject distinct from the sum of current members) or **Pure Metaphor** (failing to ground "collective guilt" in anything beyond rhetorical force). Success requires meticulous argumentation on institutional ontology and obligation theory. **One year is the ideal scope** for developing this demanding conceptual framework rigorously without empirical dilution. Adding detailed case studies (e.g., post-colonial states, legacies of slavery) within this timeframe would sacrifice the necessary depth of philosophical analysis for breadth, risking superficial treatment of both theory and history. The conceptual foundation must be rock-solid before application.

  **Addressing the "Just Rhetoric" Objection:** The objection that collective guilt across generations is merely rhetorical misunderstands the role of *structure*. Rhetoric operates on sentiment; structure operates on reality. Persisting institutions concretely shape life chances, distribute resources, and enforce norms *in the present*. When these structures are demonstrably continuous with past injustice and perpetuate its logic or benefits, appeals to "national guilt" are not mere sentimentality; they are demands to recognize the *present-day moral implications of maintaining these specific structures*. Failing to dismantle or rectify inherited unjust structures is an *ongoing collective choice* enabled by the institution, constituting a genuine, non-metaphorical moral failing. The framework of Structural Inheritance/Discharge provides the conceptual tools to move beyond rhetoric to identify tangible institutional conditions constituting or dissolving this guilt.

  **Conclusion:** This project tackles a critical unresolved problem in collective responsibility theory: the ontological and moral status of institutions across time. By rigorously analyzing institutional persistence as the potential carrier of genuine, non-metaphorical collective guilt through Structural Inheritance, it offers a vital corrective to both individualist dissolution and vague metaphorical appeals. The resulting framework provides concrete criteria for when a nation, via its enduring structures, bears a moral burden for the past, and what it must do to discharge it.
