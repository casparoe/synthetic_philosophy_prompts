  ### Decision Tree for Roadmap Merge Aggregation Rule

  **Tree Structure (13 Nodes, 12 Leaves)**  
  ```
  1. Must aggregation support incremental updates via fixed-size per-project summaries? (Streaming constraint)  
     ├── Yes → 2  
     └── No → 3  

  2. Can a filler project (ranked last by all) flip the order of two unrelated projects? (Independence of Irrelevant Alternatives - IIA)  
     ├── Yes, this is acceptable → 4  
     └── No, this is a bug → 5  

  3. Must every adjacent pair in the output be justifiable by direct majority or a 2-step majority chain? (Auditor chain constraint)  
     ├── Yes → 6  
     └── No → 7  

  4. Can teams submit scores (e.g., 1-10) instead of rankings? (Input expressiveness)  
     ├── Yes → 8  
     └── No → 9  

  5. Is there a single dimension (e.g., cost, risk) for which rankings must be single-peaked? (Domain restriction)  
     ├── Yes → L1 (Black's median voter method)  
     └── No → Uninhabited (IIA + strict ranking + unrestricted domain → Arrow-impossible)  

  6. Should a team gain by ranking a doomed project higher? (Strategy-proofness)  
     ├── No, strategic voting must be futile → L2 (Random dictatorship)  
     └── Yes, strategy is acceptable → 10  

  7. Can the output be a probability distribution over rankings? (Weakened output)  
     ├── Yes → L3 (Randomized Condorcet)  
     └── No → 11  

  8. Can scores be compared across teams? (Interpersonal comparability)  
     ├── Yes → L4 (Utilitarian: sum scores, rank high-to-low)  
     └── No → 9  

  9. Should the platform team break ties only? (Weakened no-dictator)  
     ├── Yes → L5 (Plurality with platform tie-breaker)  
     └── No → 12  

  10. How to handle cycles in majority preferences?  
      ├── Use margins of victory → L6 (Ranked Pairs)  
      └── Use designated tie-breaker → L7 (Copeland with platform override)  

  11. Must rankings be insensitive to near-duplicate projects? (Local IIA)  
      ├── Yes → L8 (Kemeny-Young adjacent swaps)  
      └── No → 13  

  12. Scoring rule weights:  
      ├── Linear weights (Borda) → L9 (Borda count)  
      ├── Top-heavy weights → L10 (Plurality ranking)  
      └── Custom weights → L11 (Generalized positional scoring)  

  13. Should small ballot changes cause large ranking shifts?  
      ├── No, require stability → L12 (Borda with damping)  
      └── Yes, accept volatility → L10 (Plurality ranking)  
  ```

  **Leaf Mapping Table**  
  | Leaf | Rule Name/Description | Blocked? | Contract Change Needed |  
  |------|------------------------|----------|------------------------|  
  | L1 | **Black's median voter method**: Projects ranked by position on the single-peaked axis. | No | - |  
  | L2 | **Random dictatorship**: Randomly select one team's ballot as the ranking. | Yes | Allow randomized output |  
  | L3 | **Randomized Condorcet**: Probability distribution over rankings that minimize Condorcet violations. | Yes | Allow probabilistic output |  
  | L4 | **Utilitarian**: Sum scores per project, rank high-to-low. | No | - |  
  | L5 | **Plurality with platform tie-breaker**: Rank by # of top-place votes; ties broken by platform team. | No | - |  
  | L6 | **Ranked Pairs**: Lock in pairwise wins by margin strength; resolve cycles via transitive closure. | No | - |  
  | L7 | **Copeland with platform override**: Rank by # of pairwise wins minus losses; cycles broken by platform team. | No | - |  
  | L8 | **Kemeny-Young adjacent swaps**: Minimize disagreements on adjacent project pairs (local IIA). | No | - |  
  | L9 | **Borda count**: Linear weights (e.g., 3 points for 1st, 2 for 2nd, etc.); rank by total score. | No | - |  
  | L10 | **Plurality ranking**: Rank by # of top-place votes; ties broken arbitrarily. | No | - |  
  | L11 | **Generalized positional scoring**: User-defined weights (e.g., [5,3,1,0,...]); rank by total score. | No | - |  
  | L12 | **Borda with damping**: Borda scores averaged with previous quarter's to reduce volatility. | No | - |  

  **Diagnostics**  
  - **Uninhabited Combination** (Node 5→"No"): Arrow's theorem precludes IIA + strict ranking + unrestricted domain. Fixes: Relax IIA (Node 2→"Yes"), restrict domain (Node 5→"Yes"), or weaken output (Node 7→"Yes").  
  - **Indistinguishable Leaves**: L10 (Plurality ranking) and L11 with weights [1,0,0,...] are identical.  
  - **Blocked Leaves**: L2 and L3 require contract changes (randomized/set output).  

  ---

  ### Critical Node Micro-Profiles  
  **Node 2 (IIA Sensitivity)**  
  - **Incident**: Filler project Z (ranked last by all) added; flips A > B to B > A.  
  - **Profiles**:  
    - Teams: T1, T2, T3. Projects: A, B, Z.  
    - Ballots: T1: A>B>Z, T2: B>A>Z, T3: B>A>Z.  
    - Without Z: B wins (majority prefers B>A).  
    - With Z: A wins under Borda (scores: A=5, B=4, Z=0).  
  - **Branches**:  
    - "Acceptable" → Output: A>B>Z (Borda).  
    - "Bug" → Output: B>A>Z (Plurality).  

  **Node 6 (Strategy-Proofness)**  
  - **Incident**: Team demotes their top project to lift it.  
  - **Profiles**:  
    - Teams: T1 (manipulator), T2, T3. Projects: A (T1's true top), B, C.  
    - True ballots: T1: A>B>C, T2: B>C>A, T3: C>B>A.  
    - Borda scores: A=3, B=4, C=2 → Rank: B>A>C.  
    - Manipulated T1 ballot: B>A>C → Borda scores: A=2, B=5, C=2 → Rank: B>A=C.  
  - **Branches**:  
    - "Futile" → Random dictatorship: Manipulation fails (1/3 chance T1 wins).  
    - "Acceptable" → Borda: Manipulation lifts B (T1's 2nd choice) but not A.  

  **Node 13 (Volatility)**  
  - **Incident**: One team swaps adjacent projects; flips entire ranking.  
  - **Profiles**:  
    - Teams: T1, T2, T3. Projects: A, B, C, D.  
    - Ballots: T1: A>B>C>D, T2: B>C>D>A, T3: C>D>A>B.  
    - Revised T1: A>C>B>D (swaps B/C).  
  - **Branches**:  
    - "Stability" → Damped Borda: Minimal change (e.g., B/C swap).  
    - "Volatility" → Plurality: Original rank: B>C>A>D; Revised: A>B=C>D.  

  ---

  ### What the Tree Does Not Settle  
  The tree resolves technical tradeoffs but leaves two **value judgments**:  
  1. **Volatility vs. Stability**: Tolerance for ranking shifts when ballots change minimally (Node 13). Business risk appetite decides.  
  2. **Oligarchic Weighting**: If choosing a controlled dictator (Node 9→"No" → Node 12), weights or team subsets (L5, L7, L11) require political agreement on influence allocation.  
  These reflect *purpose* disagreements (e.g., "Is the roadmap a live consensus or a stable commitment?") and cannot be resolved algorithmically.  

