  First, I need to unpack the brother's argument. The three points are logical: the client remains, the job gets filled quickly, and the outcome is the same. But the user's distress comes from personal moral discomfort. They feel responsible even though their role is replaceable. 

  The user's deeper need might be about integrity and self-respect. They mention feeling like they're "doing the thing" when signing invoices. So the real issue isn't just the impact of their actions but how they view themselves. They might be seeking validation that their feelings are legitimate, not just something to get over.

