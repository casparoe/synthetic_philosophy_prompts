  The neutrality problem feels decisive - having clinics design subsidized "flourishing" metrics inherently privileges certain visions of the good life, regardless of menu options. Even voluntary programs create subtle pressures, especially with sliding-scale subsidies. I'll emphasize this while recognizing the applicants' good intentions.

