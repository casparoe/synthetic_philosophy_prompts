  hey, I've been noticing a weird move in arguments about why we're stuck with certain tech or social setups. First instance: someone said we're locked into this particular file format because of one company's marketing decision in the 90s. But when I asked what other companies were actually doing differently, it turned out they all converged on the same format for totally seperate engineering reasons -- the "accident" wasn't branching history, it was just the first visible symptom of a deeper convergence. Second instance: in urban planning debates people call car-centric cities "path dependent" on a 1950s highway bill, but then they admit that even countries without that bill built highways everywhere once cars became cheap. So they're using "path dependance" like a synonym for "sticky and arbitrary," but there's no actual fork in the road they can point to. Is there a name for this specific failure mode -- invoking historical lock-in when the outcome was actually overdetermined by broader forces? How is it different from real path dependence where a small cause genuinely branches things? And if there's no established term, can you name and define it, with clear boundary cases so I can tell it apart from the real thing?
