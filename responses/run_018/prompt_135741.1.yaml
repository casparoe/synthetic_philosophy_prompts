  ### Decision Procedure for Interdisciplinary Peer Review

  **Procedure Specification:**
  1. **Initial Aggregation Rule:** Premise-based aggregation for empirical adequacy (P1) and inferential validity (P2), with a supermajority threshold of 4/5 (80%) for acceptance.  
  2. **Thresholds:**  
     - P1 and P2: Require ≥4 accepts to pass.  
     - P3 (ethical permissibility): Requires ≥3 accepts (simple majority) to pass, but only evaluated if P1 and P2 pass.  
  3. **Rejection Mandate:**  
     - If either P1 or P2 fails supermajority (≤3 accepts), reject immediately.  
     - If P1 and P2 pass but P3 fails (≤2 accepts), halt for human deliberation.  
  4. **Halt for Deliberation:** Triggered when P1 and P2 pass supermajority but P3 fails majority. This indicates a values-based conflict (ethics disagreement despite sound premises).  
  5. **Guaranteed Misfire Condition:** The procedure fails if collective inconsistency arises from **non-separable preferences** (e.g., reviewers trade off premises against ethics in non-linear ways). This is irreducible and cannot be fixed by rule refinement.  

  **Sequence:**  
  1. Collect binary judgments (accept=1, reject=0) for P1, P2, P3 from all reviewers.  
  2. Apply premise-based aggregation to P1 and P2:  
     - If both have ≥4 accepts → Proceed to P3 evaluation.  
     - Else → Reject proposal.  
  3. If P1/P2 pass, apply conclusion-based aggregation to P3:  
     - If P3 has ≥3 accepts → Accept proposal.  
     - Else → Halt for human deliberation.  

  ---

  ### Worked Cases

  **Case 1: Premise Consensus, Ethical Split**  
  - **Profile:**  
    - P1: 4 accept, 1 reject  
    - P2: 4 accept, 1 reject  
    - P3: 2 accept, 3 reject (split on ethics)  
  - **Procedure:**  
    1. P1 and P2 both pass supermajority (≥4 accepts).  
    2. P3 fails majority (only 2 accepts).  
    3. **Outcome:** Halt for human deliberation (values conflict).  

  **Case 2: Unanimous Rejection, Incompatible Premises**  
  - **Profile:**  
    - P1: 2 accept (deny empirical), 3 reject  
    - P2: 3 accept (deny inference), 2 reject  
    - P3: 0 accept (all reject)  
  - **Procedure:**  
    1. P1 fails supermajority (only 2 accepts).  
    2. **Outcome:** Immediate rejection (without evaluating P3).  
  - **Note:** Collective rejection is unanimous at P3, but the procedure rejects based on P1/P2 failure, avoiding inconsistency.  

  ---

  ### Hard Case: Unwelcome Outcome  
  - **Profile:**  
    - P1: 3 accept, 2 reject  
    - P2: 3 accept, 2 reject  
    - P3: 5 accept (unanimous)  
  - **Procedure:**  
    1. P1 and P2 fail supermajority (only 3 accepts each).  
    2. **Outcome:** Reject despite unanimous P3 acceptance.  
  - **Why Unwelcome:** The panel strongly endorses the policy’s ethics (P3) and has majority support for premises, but the procedure rejects due to insufficient consensus on foundations.  

  ---

  ### Irreducible Limitation and Vulnerability  
  - **Limitation:** Permanently vulnerable to **framing manipulation**. If the policy question is reframed (e.g., merging P2 and P3 into a single criterion), the aggregation outcome may flip. This exploits the procedure’s dependence on predefined logical structure.  
  - **High-Stakes Eligibility:** **Does not disqualify the procedure**. The limitation is inherent to *any* judgment aggregation system (per Arrow’s impossibility and discursive dilemma theory). The procedure mitigates key inconsistencies and is feasible under time constraints. For high-stakes decisions, supplement with:  
    - A recorded dissent mechanism.  
    - Post-hoc audit trails for deliberation cases.  
    - Transparency about thresholds in the call for proposals.  

  **Conclusion:** This procedure balances efficiency and logical coherence, handling common dilemmas while flagging irreducible conflicts. It is defensible for funding decisions if stakeholders accept that no aggregation method is strategy-proof.
