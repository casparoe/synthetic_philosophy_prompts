  Okay, the user is grappling with Adam Smith's arguments about colonies in "Wealth of Nations" and has two main concerns. First, they're confused about how Smith's labor theory of value applies to coerced colonial labor. Second, they're skeptical about their tutor's "secret circulation metaphor" regarding capital flow. 

  The user seems like a diligent student - they've clearly read Smith carefully and noticed a genuine tension. Their question about slave labor potentially breaking the labor theory is sharp. The tutor's "blood pooling" metaphor definitely sounds embellished though - Smith never uses that exact phrasing. 

  Hmm... the core connection between these two issues might be Smith's concept of capital misallocation. For the labor theory question: Smith absolutely condemns slavery as inefficient (Book III mentions how free workers outperform slaves), but he analyzes slave labor's output as still constituting value - just at higher cost. That's consistent with his theory, though morally grotesque by modern standards. 

  For the circulation metaphor: While the tutor's phrasing is flowery, Smith DOES describe capital being "drained" to colonies and merchants keeping profits overseas (Book IV chapter VII part iii). The real weakness in my argument is that Smith focuses more on trade monopolies than explicit blood metaphors. If I found a passage where Smith said colonial profits actively benefited Britain, that'd undermine the circulation reading. 

  The user's request for "what would change your mind" shows impressive academic rigor. They're not just seeking answers but methodological clarity. I should emphasize that Smith's failure wasn't theoretical inconsistency but moral blindness - he saw slave labor as costly, not inhuman. 

