  hey im in a history of econ ideas course and im stuck on a passage from smith where he argues that keeping the colonies is a bad deal for britain. he says the cost of defense and running the monopoly trade is like a hidden tax on domestic industry, and britain doesnt recieve enough back—the only real benifit is just the pride of having an empire. i mostly get that part, but then he also treats colonial labor as just another input that creates value, even though a lot of it was slave or coerced labor. does that mean his labor theory breaks down for colonies? also my tutor threw in this idea that smith uses a secret circulation metaphor—like capital is blood that pools in the colonies and doesnt flow home—which sounds cool but might be made up. can you help me see if these two issues are actually connected in the text, or if im overreading?

  please also say what would change your mind—like what counter-argument or missing passage would make you reject the circulation reading or the idea that smith's labor theory conflicts with colonial coercion, and point out where your reasoning is probably weakest.
