answer: |-
  ### Branching Taxonomy: Fixation of Semantic Content in Layered Representational Systems

  This taxonomy classifies positions on where semantic content is fixed using Hofstadter's frame/outer/inner distinction. Branches are determined by responses to concrete diagnostic cases. Unoccupied positions are marked as **incoherent**, **unattractive**, or **unexplored**. Pairs of positions that diagnostic cases fail to separate are explicitly flagged.

  ---

  #### **Root Question**: Can the frame message (syntactic rules/interpretive conventions) be altered by the system itself?
  - **Yes (Frame Mutability)**: Proceed to Case A.  
  - **No (Frame Immutability)**: Proceed to Case B.  

  ---

  ### **Branch 1: Frame Mutability**  
  *(A formal system rewrites one of its own axioms)*  
  **Diagnostic Case A**: Does this rewrite *change* the frame message or produce an inner message *about* the frame?  
  - **A1: Changes the frame** → Meaning is anchored in mutable rules. Proceed to Case C.  
  - **A2: Produces only an inner message** → Frame is inviolable; self-reference is content, not structure. Proceed to Case D.  

  #### **Sub-Branch A1**  
  **Diagnostic Case C**: Can recursive self-reference stabilize meaning *without any fixed frame*?  
  - **C1: Yes** → Recursion alone suffices for stability. Proceed to Case E.  
  - **C2: No** → A frame (even mutable) is essential. Proceed to Case E.  

  **Diagnostic Case E**: Is a subsystem that modifies its parent system’s rules part of the frame, outer layer, or inner loop?  
  - **E1: Part of the frame** → Rules and meta-rules are unified. **Leaf: Dynamic Frame Primacy**  
    - *Awkward commitment*: The frame is perpetually unstable, yet must paradoxically ground meaning during self-modification.  
  - **E2: Anomalous inner loop** → Meta-modification is self-referential content. **Leaf: Recursive Internalism**  
    - *Awkward commitment*: Self-modifying acts lack structural authority, risking infinite regress without a stabilizing frame.  
  - **E3: Outer layer** → Requires external governance. *Incoherent* (contradicts frame mutability; no external agent is implied).  

  #### **Sub-Branch A2**  
  **Diagnostic Case D**: Do artificial neural network weights function as an outer message (externally fixed) or inner message (self-generated)?  
  - **D1: Outer message** → Weights encode external semantic intent. *Unattractive* (ignores emergent learning; weights adapt internally).  
  - **D2: Inner message** → Weights are self-referential content. **Leaf: Stable Frame Internalism**  
    - *Awkward commitment*: The fixed frame cannot explain how weights *learn* meaning, reducing them to epiphenomenal chatter.  

  ---

  ### **Branch 2: Frame Immutability**  
  *(Frame messages are fixed externally or transcendentally)*  
  **Diagnostic Case B**: Do artificial neural network weights function as an outer message (externally fixed) or inner message (self-generated)?  
  - **B1: Outer message** → Weights reflect external interpretation. Proceed to Case F.  
  - **B2: Inner message** → Weights lack external anchors. Proceed to Case F.  

  #### **Sub-Branch B1**  
  **Diagnostic Case F**: Can recursive self-reference stabilize meaning *without any frame*?  
  - **F1: Yes** → *Incoherent* (denies immutability while requiring a fixed frame).  
  - **F2: No** → Frame is non-negotiable. Proceed to Case E.  

  **Diagnostic Case E** (as above):  
  - **E2: Anomalous inner loop** → Self-modification is mere content. **Leaf: Interpretive Externalism**  
    - *Awkward commitment*: Self-modifying subsystems are "ghostly" with no causal power, as rules can only change via external intervention.  
  - **E3: Outer layer** → Modifications require meta-system oversight. **Leaf: Frame Primacy**  
    - *Awkward commitment*: All self-alteration is illusory; only an external interpreter can fix *true* semantic change.  

  #### **Sub-Branch B2**  
  **Diagnostic Case F**:  
  - **F1: Yes** → *Unexplored* (no examples of stable frameless meaning).  
  - **F2: No** → Recursion needs a frame. Proceed to Case E.  
    - **E2: Anomalous inner loop** → **Leaf: Inert Internalism**  
      - *Awkward commitment*: Self-modification is semantically inert, rendering "inner messages" decorative and impotent.  

  ---

  ### **Taxonomy Summary**  
  #### **Occupied Leaves**  
  1. **Dynamic Frame Primacy** (A1 + C1/C2 + E1): Frame evolves via self-modification.  
  2. **Recursive Internalism** (A1 + C1 + E2): Recursion stabilizes meaning sans frame.  
  3. **Stable Frame Internalism** (A2 + D2): Fixed frame with self-generated weights.  
  4. **Interpretive Externalism** (B1 + F2 + E2): Outer interpreter fixes content; self-reference is decorative.  
  5. **Frame Primacy** (B1 + F2 + E3): Frame is immutable; outer meta-system governs change.  
  6. **Inert Internalism** (B2 + F2 + E2): Inner messages lack semantic power without external anchors.  

  #### **Unoccupied Positions**  
  - **A1 + E3** (outer governance + frame mutability): *Incoherent* (outer control voids self-modification).  
  - **B1 + F1** (outer weights + frameless stability): *Incoherent* (fixed weights require a frame).  
  - **B2 + F1** (inner weights + frameless stability): *Unexplored* (no known models achieve this).  
  - **A2 + D1** (fixed frame + outer weights): *Unattractive* (ignores internal learning dynamics).  

  #### **Indistinguishable Positions**  
  - **Dynamic Frame Primacy** vs. **Recursive Internalism**: Case C fails to separate them when recursion *creates* the frame (C1: frameless recursion vs. C2: mutable frame). Both collapse into "meaning through self-directed change."  
  - **Interpretive Externalism** vs. **Inert Internalism**: Case E2 (anomalous inner loop) applies to both; only Case B (weights as outer/inner) distinguishes them, but real systems often blur this line (e.g., neural nets with hybrid training).  

  #### **Key Tensions**  
  Self-modifying systems expose the core awkwardness: **mutable frames** risk instability (Dynamic Frame Primacy), while **immutable frames** deny autonomy (Interpretive Externalism). Recursive Internalism avoids this but struggles with bootstrapping meaning *ex nihilo*.
