prompt: |-
  For my school's philosophy club, I am writing on the paradox of deontology: the scenario in which every individual respects agent-centered moral restrictions, yet universal compliance produces a worse collective outcome than if everyone had violated those restrictions. Before I assess any proposed resolution, I want the full specification of adequacy. Write the desiderata that any theory resolving this paradox must meet—the distinctions it must preserve between acting and allowing harm, the collective-action conditions it must be consistent with, the intuitive judgments about individual rights it must not abandon, and any formal constraints from decision theory that apply—with the case or reasoning behind each requirement. Flag which desiderata are genuinely non-negotiable and which are camp-specific preferences, and indicate whether any subset of these demands is jointly unsatisfiable. I am not asking for a survey of existing authors; I need the criteria sheet itself.
reasoning: |-
  Okay, the user is working on the paradox of deontology for their philosophy club. They need a clear set of criteria for any theory that tries to resolve this paradox. Let me start by understanding the paradox itself. The paradox arises when everyone follows agent-centered restrictions, like not harming others, but this leads to a worse outcome than if everyone had ignored those restrictions. The challenge is to resolve this without abandoning core deontological principles.

  First, I need to outline the desiderata. The user wants distinctions between acting and allowing harm, collective-action conditions, preservation of individual rights, and formal constraints from decision theory. They also want to know which are non-negotiable and which are camp-specific, plus if any desiderata conflict.

  Let me break down each category. Non-negotiable desiderata would include preserving agent-centered restrictions and individual rights. These are core to deontology. Then, distinctions like acting vs. allowing harm, intending vs. foreseeing harm are crucial but might have some flexibility in interpretation. Collective-action problems need addressing the gap between individual and collective rationality. Decision theory constraints involve rationality requirements like avoiding self-defeat and dominance issues.

  I should check for conflicts. For example, preserving individual rights might clash with avoiding catastrophic outcomes. But deontology usually prioritizes rights over outcomes. Also, decision theory's dominance principle might conflict with agent-centered restrictions. Highlighting these tensions is important.

  The user might have deeper needs. They probably want a structured framework to evaluate existing theories or develop their own. They might also need clarity on where compromises can be made without losing deontological integrity. Ensuring the criteria are comprehensive yet clear is key. Also, distinguishing non-negotiable from negotiable points helps in understanding different philosophical stances within deontology.

  I should make sure each desideratum includes a rationale. For example, why acting vs. allowing harm matters—it's tied to moral responsibility. For collective-action, the tragedy of the commons illustrates the problem. Decision theory constraints prevent theories from being irrational.

  Finally, flagging conflicts: the biggest one is between avoiding catastrophic outcomes and strict agent-centered restrictions. Acknowledging this helps the user understand the challenge in resolving the paradox. Also, noting which points different schools might debate, like the scope of rights, adds depth.
answer: |-
  Here is a comprehensive **Criteria Sheet for Resolving the Paradox of Deontology**, specifying the adequacy conditions any proposed resolution must meet, grounded in core deontological commitments and relevant formal constraints. Requirements are categorized, reasoned, and flagged for negotiability.

  ---

  ### **I. CORE NON-NEGOTIABLE DESIDERATA**  
  *(Essential to preserving deontology's defining features)*

  1.  **Preservation of Agent-Centered Restrictions (ACRs):**  
      *   **Requirement:** The theory must uphold the existence and normative force of agent-centered restrictions (e.g., "Do not murder," "Do not torture") as fundamental moral constraints on individual action, *even when* violating them would prevent worse harm or better consequences.  
      *   **Case/Reasoning:** This is the *definitional core* of the paradox. Abandoning ACRs surrenders deontology to consequentialism. The paradox arises precisely *because* ACRs exist and are binding. A resolution must explain why individuals are still bound by them in the collective failure scenario.

  2.  **Non-Abandonment of Individual Rights:**  
      *   **Requirement:** The theory must maintain that individuals possess robust moral rights (e.g., against being used, harmed, or killed) that others are generally forbidden from violating, *even for the greater good*. These rights ground the ACRs.  
      *   **Case/Reasoning:** Rights (like the right to life or bodily integrity) are the typical foundation for ACRs. A resolution cannot dissolve these rights in the collective scenario without collapsing into consequentialism. The paradox highlights a tension *within* a rights-based framework; the framework itself must remain intact.

  3.  **Rejection of Simple Act Consequentialism:**  
      *   **Requirement:** The resolution cannot justify individual action *solely* by the consequences of that isolated act. It must retain the non-consequentialist character of the ACR.  
      *   **Case/Reasoning:** If the resolution implies that in the collective failure scenario, an individual *should* violate the ACR because it would produce better consequences *in that isolated act*, it capitulates to consequentialism. The paradox demands an explanation *other than* "violating the ACR is the right act here."

  4.  **Avoidance of Practical Self-Defeat:**  
      *   **Requirement:** The theory must not render adherence to morality (following ACRs) *systematically* and *predictably* worse for everyone *by the very standards the theory itself cares about* (e.g., respecting rights, preventing harm).  
      *   **Case/Reasoning:** A moral theory that guarantees worse outcomes *on its own terms* when universally followed is practically incoherent and rationally unstable. It becomes irrational to be moral. While deontology prioritizes right action over good outcomes, a theory that *ensures* catastrophic rights-violations *because* everyone respects rights is pathological.

  ---

  ### **II. STRUCTURAL & DISTINCTIVE DESIDERATA**  
  *(Crucial for capturing deontological intuitions and structure; high priority but potentially subject to nuanced interpretation)*

  5.  **Maintaining the Distinction Between Doing and Allowing:**  
      *   **Requirement:** The theory must preserve a morally significant difference between actively *causing* harm (violating an ACR) and merely *failing to prevent* harm that others cause or that occurs "naturally," even if the outcome is identical.  
      *   **Case/Reasoning:** This distinction underpins many ACRs (e.g., the prohibition on killing vs. the (often weaker) duty to save life). The paradox often involves *allowing* a greater harm by *doing* nothing (respecting the ACR) vs. *doing* a lesser harm to prevent it. Erasing this distinction dissolves the core deontological concern with agency and direct responsibility for harm.

  6.  **Maintaining the Distinction Between Intending and Merely Foreseeing Harm:**  
      *   **Requirement:** The theory must preserve a morally significant difference between harm that is intended as a means or end, and harm that is merely a foreseen but unintended side-effect of one's otherwise permissible action.  
      *   **Case/Reasoning:** This distinction (central to the Doctrine of Double Effect) is vital for justifying actions with bad side-effects while maintaining prohibitions on direct harm. In collective scenarios, respecting an ACR might foreseeably *allow* massive harm caused by others/nature, while violating the ACR might *intend* a smaller harm. The resolution must handle this asymmetry.

  7.  **Addressing the Collective Action Problem Structurally:**  
      *   **Requirement:** The resolution must directly engage with the structure of the collective action problem itself – specifically, the gap between the rationality/morality of individual actions under conditions of mutual expectation, and the (potentially disastrous) aggregate outcome of those individually rational/moral choices.  
      *   **Case/Reasoning:** The paradox is *defined* by this gap (e.g., Tragedy of the Commons, Prisoner's Dilemma applied to deontology). A resolution that ignores this structure (e.g., by focusing only on isolated acts) fails to address the core issue. It must explain why individuals are justified (or required) to adhere to ACRs *despite knowing* that universal adherence leads to catastrophe.

  8.  **Consistency with Individual Rationality (Minimal):**  
      *   **Requirement:** The theory must not require individuals to act in ways that are demonstrably self-defeating *for the individual agent's own morally relevant goals* in a single interaction, or make adherence to morality *generally* irrational.  
      *   **Case/Reasoning:** While deontology often prioritizes morality over self-interest, a resolution that makes moral action *systematically* guarantee catastrophic results *for the agent and everyone else* risks making morality alienating and unsustainable. It must show how adhering to ACRs remains rationally coherent *for the individual agent* within the collective context. (Note: This is weaker than requiring optimal outcomes).

  ---

  ### **III. FORMAL / DECISION-THEORETIC CONSTRAINTS**  
  *(Relevant for coherence and avoiding logical pitfalls)*

  9.  **Avoidance of Strictly Dominated Strategies (Conditional):**  
      *   **Requirement:** The theory should not prescribe a strategy (universal adherence to ACRs) which is *strictly dominated* by another strategy (universal violation of ACRs) *if* the theory assigns positive value to the outcomes prevented (e.g., avoiding massive rights violations).  
      *   **Case/Reasoning:** If the theory values preventing catastrophic harm *at all*, prescribing a strategy guaranteed to produce worse results than an alternative is logically awkward. However, **this is negotiable** if the theory categorically denies that the value of respecting ACRs can be traded off against outcome values. *Tension with Desideratum 4 (Practical Self-Defeat) is key here.*
      *   **Negotiability:** **Camp-Specific Preference.** Strong deontologists may reject this constraint entirely, insisting respect for ACRs is non-fungible. Others see avoiding strict dominance as crucial for coherence.

  10. **Handling Expected Compliance:**  
      *   **Requirement:** The resolution should provide guidance for agents who reasonably believe others *will not* comply with the ACRs (making the catastrophic outcome likely even if *they* comply).  
      *   **Case/Reasoning:** Real-world agents face uncertainty about others' compliance. A theory only addressing *strict* universal compliance is incomplete. It must explain the individual's duty when compliance is *expected* to be low. Does the ACR still bind absolutely? Does a permission or duty to violate arise?

  ---

  ### **IV. POTENTIALLY NEGOTIABLE / CAMP-SPECIFIC DESIDERATA**

  11. **Avoidance of Catastrophic Outcomes (Aspirational):**  
      *   **Requirement:** A *desirable* (though perhaps not strictly necessary) feature is that the resolution minimizes the likelihood or severity of catastrophic outcomes arising from universal adherence to the theory's norms.  
      *   **Case/Reasoning:** While deontology prioritizes the right over the good, a theory that *frequently* leads to moral catastrophe (like genocide) *because* everyone follows its rules is deeply counterintuitive and practically problematic.
      *   **Negotiability:** **Camp-Specific Preference.** "Threshold Deontologists" might prioritize avoiding catastrophe above ACRs at extreme levels of harm. "Absolutist Deontologists" reject this, holding ACRs inviolable regardless of consequences. Most seek a resolution that avoids catastrophe *without* violating core ACRs.

  12. **Scope of Rights/ACRs:**  
      *   **Requirement:** The specific *content* and *strength* of rights and ACRs (e.g., absolute prohibition on torture vs. prohibition with extreme necessity exceptions, scope of property rights) may vary.
      *   **Negotiability:** **Camp-Specific Preference.** Different deontological theories define rights and ACRs differently. The resolution must be consistent with *some* plausible set of robust non-consequentialist rights/ACRs, but the precise formulation is negotiable within deontology.

  ---

  ### **V. TENSIONS AND POTENTIAL INCONSISTENCIES**

  *   **Core Tension:** The fundamental tension lies between **Desideratum 1 (Preserve ACRs)** and **Desideratum 4 (Avoid Practical Self-Defeat)**. How can adhering to rules (ACRs) designed to protect individuals (Rights - Desid. 2) lead to worse protection (or massive violation) of those very rights when everyone follows them? Resolutions *must* address this.
  *   **Key Conflict Point:** **Desideratum 9 (Avoid Strict Dominance)** directly challenges resolutions that strictly uphold Desiderata 1 & 2 without modification in collective scenarios. If respecting ACRs *always* leads to worse outcomes (including worse rights violations) than violating them, and the theory values preventing rights violations *at all*, strict adherence seems dominated. Resolutions must either:
      1.  **Deny the Dominance:** Argue the outcomes aren't comparable (rights-respecting acts have intrinsic value incomparable to outcomes), or
      2.  **Modify the Norms:** Introduce context-sensitive permissions/duties in collective scenarios (risking erosion of Desid. 1/2), or
      3.  **Reject the Collective Description:** Argue the scenario misdescribes individual obligations (e.g., focus on individual non-responsibility for the collective harm).
  *   **Tension with Rationality:** Strict adherence to Desiderata 1, 2 & 6 (Intentional Harm) in the face of predictable catastrophe (Desid. 4) can strain **Desideratum 8 (Individual Rationality)**.
  *   **Is a Jointly Satisfiable Set Possible?** Yes, *in principle*, but it is the central challenge of the paradox. A successful resolution must demonstrate *how* all non-negotiable desiderata (1-4) and the high-priority structural ones (5-8) can be satisfied simultaneously without collapsing into consequentialism or accepting pathological self-defeat. Desiderata 9 & 11 create significant pressure that different camps resolve differently.

  ---

  **Summary of Non-Negotiables:** 1 (ACRs), 2 (Rights), 3 (Reject Simple Act Consequentialism), 4 (Avoid Practical Self-Defeat).

  **Summary of High-Priority Structural:** 5 (Doing/Allowing), 6 (Intending/Foreseeing), 7 (Address Collective Structure), 8 (Minimal Individual Rationality).

  **Use this criteria sheet to rigorously test any proposed resolution:** Does it violate a non-negotiable? Does it adequately handle the key distinctions and the collective structure? Does it resolve the core tension without unacceptable compromise? Where does it land on the negotiable points? This framework clarifies the formidable challenge the paradox poses to non-consequentialist ethics.
