answer: |-
  ## Interview Questions on Galen Strawson's Basic Argument

  **Interviewer:** Welcome. We're discussing your defence of Galen Strawson's Basic Argument against moral responsibility. Let us proceed beyond the core regress. My first question concerns its starting point.

  1.  **Question:** The Basic Argument posits that moral responsibility requires being *causa sui* (self-caused), initiating a regress through prior mental states. Crucially, it rejects stopping this regress at an agent's "first" character-forming choice, even if unchosen. Why is halting the regress at such a putative 'initial choice' philosophically arbitrary or inadequate for grounding true responsibility?
      *   **Anticipated Answer:** He will argue that labelling any choice as the "first" character-forming one is arbitrary; even that choice must arise from prior constitutive factors (genetics, environment, preceding mental states) for which the agent bears no responsibility. Responsibility cannot magically emerge at a chosen point in the causal chain; the *capacity* to make that "first" choice wasn't self-determined.
      *   **Follow-Up:** If we concede that *all* character-forming choices are ultimately traceable to unchosen factors, does this not render the *entire notion* of an 'initial choice' incoherent for your purposes, making the regress even more inescapable?

  2.  **Question:** The Argument distinguishes *true moral responsibility* (TMR), entailing ultimate authorship, from mere *causal* or *legal accountability*. Given that unconscious psychological processes demonstrably shape character and choices, how does this distinction become even sharper? Why isn't causal accountability sufficient for our practices of praise and blame?
      *   **Anticipated Answer:** He will emphasise that causal accountability is about efficient causes and societal regulation, while TMR requires *origination* – being the ultimate, non-derivative source. Unconscious processes further demonstrate that the springs of action lie beyond conscious control/choice, reinforcing that we are *patients* of our psychology, not its ultimate *authors*. Accountability can exist without TMR’s deeper desert.
      *   **Follow-Up:** Doesn't this distinction risk making TMR an impossibly abstract, almost mystical concept? If conscious intention and reasons-responsiveness are insufficient, what conceivable empirical reality *could* satisfy the *causa sui* demand?

  3.  **Question:** A standard compatibilist rejoinder is: "We are responsible for our *actions* (choices, decisions), even if we are not ultimately responsible for our *characters*." How does the Basic Argument definitively counter this move?
      *   **Anticipated Answer:** He will invoke the core premise: "You do what you do because of the way you are." Actions *necessarily flow* from one's character, motives, and psychological structure at the time. Since you are not ultimately responsible for *being* that way (as per the regress), you cannot be ultimately responsible for actions *determined* by that way of being. Responsibility for action presupposes responsibility for the source of that action.
      *   **Follow-Up:** **Sharp Follow-Up:** The compatibilist might counter that we *can* shape our character *over time* through choices. Doesn't this reintroduce the regress? For any choice purportedly shaping character, mustn't *that* choice itself stem from the prior character you are trying to change, and for which you lack ultimate responsibility?

  4.  **Question:** The Argument concludes that true moral responsibility is impossible. Does this eliminate *all* forms of praise, blame, and associated practices, or does it target only a particularly stringent, desert-based notion? How should we understand the value of reactive attitudes like resentment if TMR is absent?
      *   **Anticipated Answer:** He will clarify it attacks *basic desert* – blame/praise justified *solely* because the agent *ultimately* authored the action in the *causa sui* sense. Forward-looking practices (deterrence, rehabilitation, moral education) and expressions of relational stance (hurt, gratitude) can remain justified instrumentally or expressively without invoking ultimate authorship. Resentment might persist as a natural response to harm, but not as proof of deep desert.
      *   **Follow-Up:** Does this distinction not risk becoming unstable? If reactive attitudes persist naturally, won't they inevitably carry connotations of *desert* in everyday understanding, potentially undermining the practical separation you propose?

  5.  **Question:** Consider a niche application: An institution (e.g., a prolonged educational regime, a cult, a career military structure) meticulously shapes an agent's fundamental values and dispositions over decades. If we locate responsibility for the agent's resultant actions within the *institution*, does this resolve the problem of individual responsibility, or does it merely relocate the regress?
      *   **Anticipated Answer:** He will argue it only relocates the regress. The institution itself is composed of individuals whose own characters and choices shaped it. Those individuals, in turn, were shaped by prior factors (their own genetics, upbringing, societal influences). Attributing responsibility to the institution pushes the question back one step but does not halt the infinite regress seeking an *ultimate*, responsibility-grounding origin. We still lack a *causa sui*.
      *   **Follow-Up:** Does this imply that *collective* responsibility is equally impossible under the Basic Argument, or are there features of institutional agency that might escape the regress in ways individual agency cannot?

  **(Additional Depth Questions)**

  6.  **Question:** Some critics argue the *causa sui* demand stems from a Cartesian or libertarian picture of the self that is itself implausible. How does the Basic Argument fare if we adopt a thoroughly naturalistic, processual view of the self – as a constantly evolving bundle of dispositions without a fixed core? Doesn't this undermine the need for an *ultimate* originator?
      *   **Anticipated Answer:** He will likely counter that the naturalistic view *strengthens* the argument. If the self is just a causally determined process, lacking any persisting, autonomous kernel, the regress through constitutive factors becomes even more evident. There is simply *no entity* present at any point that could bear the burden of *causa sui*.
      *   **Follow-Up:** But if there's no enduring self to *be* responsible, isn't the *question* of ultimate responsibility rendered incoherent from the start? Does the Argument subtly presuppose a robust self-concept it then finds impossible?

  7.  **Question:** The Argument hinges on the claim that responsibility for an action requires responsibility for its sufficient cause (one's character/mental state). Is this principle ("R-A requires R-C") itself beyond dispute? Could one argue that responsibility operates on a different conceptual level, perhaps concerning *ownership* or *identification* with the action at the time, irrespective of the ultimate genesis of the capacity for ownership?
      *   **Anticipated Answer:** He will defend the principle as fundamental. "Ownership" or "identification" at time T must itself be a feature of one's mental state at T. If you are not responsible for *having* that capacity for ownership/identification (because it derives from unchosen factors), then you cannot be truly responsible for the actions that flow from it. Identification isn't a magical responsibility-conferring act; it's part of the determined psychological state.
      *   **Follow-Up:** What, then, would you say to a Frankfurt-style case where an agent identifies wholeheartedly with a desire, acts on it without coercion, and this identification *itself* seems intuitively sufficient for responsibility, regardless of the desire's ultimate origin?

  8.  **Question:** If the Basic Argument is sound, what is the most significant *practical* consequence for how we structure society and interpersonal relations? Does it necessitate a radical overhaul, or can most existing practices be preserved under a revised, non-desert-based justification?
      *   **Anticipated Answer:** He will emphasise the need for a profound shift in *justification*, moving from retributive desert to forward-looking and expressive/relational grounds for practices like punishment, reward, and moral evaluation. It necessitates abandoning the core belief in ultimate blameworthiness/praiseworthiness, which he sees as both false and often pernicious, but many practical structures could be adapted.
      *   **Follow-Up:** Doesn't the persistent, perhaps ineradicable, *feeling* of desert in human psychology pose a major challenge to implementing such a shift? Can societal practices truly divorce themselves from deeply ingrained retributive intuitions if the Argument is accepted intellectually?
