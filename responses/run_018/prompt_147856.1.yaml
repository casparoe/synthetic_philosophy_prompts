  Issue 1: Circularity in Calibration Adjustments

  - Inside-View Mechanist Formulation: A reasoner can apply explicit calibration adjustments to her current inside-view argument without circularity by treating the calibration assessment as a distinct, locally justified judgment that draws on her domain-specific expertise and causal understanding of the factors affecting calibration.
  - Outside-View Modestist Formulation: Any attempt by a reasoner to apply calibration adjustments to her own current argument is inherently circular because the assessment of her own calibration is itself an inside-view judgment that is subject to the same overconfidence biases that the adjustment aims to correct.
  - Status: Substantive, with an empirical crux.

  Crux for Issue 1: Can a reasoner reliably and non-arbitrarily assess her own calibration in a way that improves forecast accuracy, without that assessment being undermined by the very overconfidence it is meant to correct? (This crux turns on the self-reference problem of second-order calibration.)

  Issue 2: Scarcity of Historical Analogues

