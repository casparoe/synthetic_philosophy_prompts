  1. (a) Any forecast can be formally decomposed into two components: a mechanistic component (which models the causal processes leading to the outcome) and a reference-class component (which assigns the case to a reference class and uses the base rate of the outcome in that class).

  2. (b) Uncalibrated human forecasters exhibit a systematic tendency toward overconfidence in the accuracy of their long-range predictions, especially in domains where feedback is sparse and delayed.

  3. (c) It is logically consistent to update one's beliefs via Bayesian conditioning upon learning that the current case belongs to a particular reference class, even when this information conflicts with one's inside-view model.

  4. (d) There exist domains characterized by such rapid structural change, unique causal factors, or novelty that directly applicable historical analogues are genuinely scarce or absent.

  5. (e) It is conceptually coherent to inquire whether the principle of epistemic modesty applies recursively to its own application, thereby raising the question of whether one should be modest about the very claim that modesty is required.

