  Crux 1: Circularity in Calibration

  - Inside-View Mechanist Prediction: Dr. A's calibration adjustment (based on her own assessment) is legitimate and improves the accuracy of her forecast. Her 70% probability may be well-calibrated because she has accounted for her own past overconfidence in similar domains and the specific strengths of her model.
  - Outside-View Modestist Prediction: Dr. A's calibration adjustment is circular and likely to be biased. Therefore, she should defer to the reference class base rate (30% success) and assign a probability close to 30% to her prediction.

  Crux 2: Scarcity of Analogues

  - Inside-View Mechanist Prediction: The broad reference class (novel causal models in emerging technologies) is too heterogeneous and fails to capture the specific strengths of Dr. A's model and the domain's unique features, so it should not dominate her inside-view probability of 70%.
  - Outside-View Modestist Prediction: The broad reference class is appropriate because it captures the inherent difficulty of predicting in novel domains and the typical failure modes of such models. Therefore, the base rate should dominate.

  Now, what evidence would update both sides? Both sides agree that a well-designed experiment tracking the accuracy of forecasts made by experts who use explicit calibration adjustments versus those who rely solely on reference classes would be relevant. Specifically:

