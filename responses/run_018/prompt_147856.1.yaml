  - Outside-View Modestist Formulation: The scarcity of direct historical analogues does not undermine reference-class forecasting but instead requires shifting to a broader, more appropriate reference class that captures the fundamental similarities in the failure modes of novel models, thereby preserving the superiority of base rates over inside-view models.
  - Status: Substantive, with an empirical crux.

  Crux for Issue 2: In domains with scarce direct historical analogues, does shifting to a broader reference class (e.g., "novel causal models in complex systems") yield base rates that are more accurate predictors than the inside-view models constructed by domain experts?

  Issue 3: Recursive Application of Epistemic Modesty

