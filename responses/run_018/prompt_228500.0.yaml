  Cruxes are critical. The first is ontological: does compression suffice for realism? I propose a deception experiment as test case. The Dennettian would predict deception reinforces belief attribution, while the opponent calls it prompt-engineered behavior. The second crux is about interpretability evidence - can we find belief-like circuitry? Both sides' predictions here reveal their fundamental divergence.

  I suspect part of the dispute is verbal - specifically whether "belief" requires human-like phenomenology. The opponent likely means "biological cognition" while the Dennettian uses "belief" as a functionalist term. Clarifying this might resolve some tension.

  For the confidence note: I'm fairly sure about the attributions except possibly the "literal" phrasing for Dennettians. Some might prefer "real as patterns" over "literal beliefs," though Dennett himself uses provocative language. The safety-concern attribution to the opponent feels solid.

  The closing thought: This framework transforms abstract debate into testable propositions. That's the real win - philosophy meeting empiricism.
