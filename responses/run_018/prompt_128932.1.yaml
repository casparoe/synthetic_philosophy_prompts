answer: |-
  **Bottom line to remember:** *We can hold people accountable for their choices without pretending those choices sprang from some mythical, uncaused self.*

  **(Remarks)**

  Good morning. That line you’ll see on the screen later is the core takeaway: **We can hold people accountable for their choices without pretending those choices sprang from some mythical, uncaused self.**

  Welcome to ‘Accountability Without Ultimacy’. I suspect half of you are here because you’ve dissected Galen Strawson’s Basic Argument so many times, the regress feels like an old friend – or perhaps a persistent headache. The other half? You’re likely professionals – probation officers, therapists – who navigate the messy realities of blame, consequence, and repair daily, where ‘responsibility’ often means showing up, owning actions, and doing the work.

  So, how do we talk seriously across this room? We need a ground rule, upfront: **Today, we suspend the debate about ‘ultimate’ moral responsibility.** We won’t spend our time arguing whether anyone *truly, metaphysically* authored their choices from scratch. Why? Because Strawson’s argument, compelling as it is, shows that regress is inescapable. Chasing that uncaused cause is a philosophical cul-de-sac.

  Instead, let’s frame our discussions around what I’m calling **‘the archival self’**.

  Think of a person as an archive. It contains records – choices made, actions taken, consequences endured. We *must* navigate this archive practically. We hold people accountable for what’s *in* it. We blame harmful acts, praise good ones, seek repair for damage done. This practical engagement is vital and real.

  But here’s the crucial point, linking our groups: **The archive never authored its own filing system.** Just as Strawson shows we inherit our ‘selves’ – our reasons, our dispositions – from an infinite, unchosen chain of prior causes (genes, upbringing, culture, random events), so too do the very *reactive attitudes* we use to navigate the archive – our resentment, our gratitude, our sense of justice – inherit *their* shape from the same sources. They are learned, culturally embedded responses, not revelations of ultimate freedom.

  The ground rule means: We can rigorously explore the structure of blame, praise, and repair – their origins, their effects, their justification within the system *as we find it* – without anyone needing to defend or attack the impossible idea of ultimate self-creation. This isn’t about letting anyone off the practical hook. It’s about understanding the machinery of responsibility we actually work with, whilst acknowledging its contingent origins.

  Philosophers, your rigour is needed to unpack this structure. Practitioners, your ground-truth experience is essential to test it. Let’s explore accountability *within* the archive, together. Welcome – let’s have a meaningful day.

