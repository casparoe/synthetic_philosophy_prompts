  Necessary truths pose problems because counterfactual worlds are impossible or distant. Does adherence trivialize since all worlds are "p-worlds"? Or does the budget break because no ¬q world exists? Follow-up on whether her "off-budget" move applies here too, and if so, whether that renders necessary truths unknowable under her model.

