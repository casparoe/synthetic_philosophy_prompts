answer: |-
  ## Joint Statement: Internalist/Externalist Adversarial Collaboration on "Dormancy" & "Bootstrapping"

  **Preamble:** Look, we're never gonna agree on the fundamental ontology of reasons. Internalists (Int) think reasons are *constitutively* tied to an agent's actual motivational psychology. Externalists (Ext) think reasons are *authoritative normative standards* that exist independently of an agent's current motivational set. But after hours arguing over stale coffee, we found some shared ground and clarified *where* the real cracks are, especially using these two sticky cases: **Dormant Reasons** (full grasp, zero affect) and **Collective Bootstrapping** (group reasons inaccessible to any single member).

  **Section 1: Agreed Claims (Signed by Both Parties)**

  1.  **Conceptual Grasp is Necessary (but Not Sufficient):** For something to be a *candidate* reason *for an agent*, the agent must possess the relevant concepts and understand the proposition. A "dormant reason" scenario requires this full conceptual competence. You can't have a reason you literally can't comprehend.
  2.  **Dormancy Exists & is Puzzling:** Agents *can* fully, clearly grasp a normative consideration (e.g., "Honouring this specific promise made to my estranged parent is morally required"), acknowledge its logical force, experience *no* cognitive dissonance or confusion, yet feel *absolutely no motivational pull* whatsoever towards acting on it. This isn't mere weakness of will; it's affective inertness despite cognitive transparency.
  3.  **Collective Phenomena are Distinct:** The "collective bootstrapping" problem (e.g., a research team holds a reason deriving from complex emergent insights *no single member* fully grasps or is motivated by individually) demonstrates that *groups* can be reason-bearers in ways that aren't straightforwardly reducible to the sum of individual members' reasons or motivations. Group agency involves *sui generis* structures.
  4.  **Motivation is Often Evidentially Relevant:** The presence (or absence) of motivation in a rational agent under transparent conditions is *often* good (though defeasible) *evidence* about whether a purported reason genuinely applies *to them*. Neither side denies the frequent correlation.
  5.  **Formal Attribution Requires Rational Sensitivity:** Attributing a reason to an agent (or group) implies that the reason *could*, under conditions of full rationality and information (including conceptual grasp), make a difference to their *deliberative process* – even if not to their *felt motivation*. A "reason" utterly irrelevant to any possible deliberation isn't one.
  6.  **Bootstrapping Challenges Reductionism:** The collective bootstrapping case shows that purely *individualistic* accounts of reason-attribution (treating group reasons *only* as aggregates or overlaps of individual reasons) face significant difficulties. Something more is going on.

  **Section 2: Disagreements & Diagnostic Test Cases**

  | Aspect                     | Internalist (Int) Stance                                                                 | Externalist (Ext) Stance                                                                                               |
  | :------------------------- | :--------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- |
  | **Core Formulation**       | "A consideration R is a normative reason for agent A to φ *iff* R, were A ideally rational and informed (holding her core 'S' fixed), *would motivate* A (or be capable of motivating her through her S) to φ." | "A consideration R is a normative reason for agent A to φ *iff* R *objectively counts in favor* of A φ-ing, irrespective of whether R is, or ever could be, motivationally accessible to A through her actual psychological set 'S'." |
  | **Crux 1: Motivation's Role** | **Constitutive:** Motivational accessibility (under ideal deliberation from S) is *part of what it is* for R to be a reason *for A*. If R couldn't motivate A via her S, it's simply not A's reason. | **Evidentiary (at best):** Motivation (or its potential) is a frequent *sign* or *consequence* of recognizing a reason, but it's not *constitutive*. Reasons exist normatively prior to their motivational impact. |
  | **Diagnostic Case: Dormant Reason** | **Int Prediction:** The "dormant" consideration isn't *yet* a reason *for that agent*. It becomes one *only if/when* a shift *within her existing S* (e.g., a new desire, emotional insight) makes it motivationally potent. Until then, it's just a true normative proposition *about* the situation, not *her* reason. | **Ext Prediction:** The "dormant" consideration *is already* a genuine, authoritative reason for the agent. The lack of motivation is a *psychological failure* or *affective deficit* in the agent, not a defect in the reason itself. It binds her normatively even while inert. |
  | **Crux 2: Collective Reduction** | **Reductive:** Group reasons must ultimately be analyzable in terms of reasons applying to the *individual members* (e.g., reasons to cooperate, fulfill roles, respond to joint commitments). If no individual member has *any* accessible reason (even a derivative one) corresponding to the group reason, it dissolves into incoherence. | **Non-Reductive (Emergent):** Groups can have genuine, irreducible reasons grounded in their collective aims, structures, or normative statuses. These reasons *obtain for the group as such* and impose normative demands, even if they don't map onto reasons any single member possesses individually. |
  | **Diagnostic Case: Collective Bootstrapping** | **Int Prediction:** The "emergent group reason" either (a) *is reducible* to complex, interlocking reasons individual members *do* have (e.g., reason to trust the process, reason to value collective truth-finding), or (b) if truly irreducible *and* motivationally inaccessible to *all* members individually, it *fails* to be a genuine normative reason *for anyone*, including the group. Groups aren't magical reason-bearers. | **Ext Prediction:** The emergent group reason is a *real, irreducible normative standard* for the group. It provides authoritative reasons *for the group* to act (e.g., publish the finding, change policy). Individual members may only have derivative reasons (e.g., to facilitate the group's action) or none directly tied to the reason's *content*, but the group reason itself is robust. |

  **The Stalemate (Casually):** So yeah, we agree dormancy happens and groups are weird. But Ints see the dormant case proving motivation is *built into* the reason-for-me, while Exts see it proving reasons can *outrun* my psychology. Ints think bootstrapping either reduces down or evaporates; Exts think it shows groups can kinda have normative oomph that floats above our individual heads. We're stuck on whether reasons gotta *live inside* an agent's motivational wiring to count as *theirs*, or if they're like cosmic traffic laws – binding even if your engine's cold. Coffee's still on?
