prompt: |-
  I have been teaching Dennett's distinction between cranes and skyhooks this term, and a particular tension has crystallized for me regarding its application to evolutionary accounts of representational content. Dennett presents natural selection as the canonical crane—an algorithmic process that constructs complex adaptations without intelligent design—while greedy reductionism is the error of explaining away the capacities we sought to understand, leaving us with only genes and neurons where minds once stood. My difficulty concerns contemporary teleosemantic theories, such as those associated with Millikan and Papineau, which attempt to ground intentional content in selection history. On one reading, these theories deploy evolutionary cranes: they derive representation from bottom-up selective processes without invoking an unexplained mental skyhook. Yet they also seem vulnerable to greedy reductionism, because they often analyze misrepresentation as a failure of the causal chain established by selection—thereby dissolving the normative dimension of false belief into purely causal terms. This leads me to a specific confusion. Is the teleosemantic project genuinely using a crane to construct intentionality, or is it secretly relying on a skyhook—namely, the normative notion of proper function that seems to presuppose the very intentionality it aims to build? And if the answer is that proper function is itself fully reducible to selection history, have we not then committed greedy reductionism by explaining away the normative force of error rather than genuinely accounting for it? I would be grateful for clarification of whether this tension reveals an ambiguity in Dennett's framework, a misunderstanding on my part about how selection history can bear normative weight, or perhaps both. Please reply in continuous prose only, without headings, bullet points, bold formatting, or tables, as though writing a thoughtful letter.
