answer: |-
  ### Decision Tree: Multiple Realizability in Philosophy of Mind  
  **Entry Question:** Can two systems with almost nothing physiological in common (e.g., a human, an octopus, and a silicon robot) be in literally the same mental state, such as being in pain?  

  #### **Start Here**  
  - **Yes** → Go to **Question A**.  
  - **No** → Go to **Question D**.  

  ---

  #### **Question A:**  
  *Is multiple realizability (MR) a **conceptual possibility** (knowable by analyzing mental concepts alone) or an **empirical discovery** (requiring scientific evidence)?*  
  - **Conceptual possibility** → Go to **Question B**.  
  - **Empirical discovery** → Go to **Question C**.  

  ---

  #### **Question B:**  
  *When a mental state (e.g., pain) is realized, what does the **causal work** in producing behavior?*  
  - **The functional role** (e.g., "pain" is defined by inputs/outputs/internal relations) → **Classical (Role) Functionalism**.  
    → *Awkward commitment:* Abstract roles aren't directly causally efficacious; only their physical realizers are.  
  - **The physical realizer** (e.g., C-fibers, silicon circuits) → **Realizer Functionalism**.  
    → *Awkward commitment:* Pain becomes a wildly disjunctive physical kind (e.g., "human C-fibers OR octopus O-fibers OR robot circuits"), risking loss of scientific unity.  

  ---

  #### **Question C:**  
  *If MR is empirically discovered in a system (e.g., octopus pain ≠ human pain physically), how should we define "pain"?*  
  - **Reduce pain to a *species-specific* physical state** (e.g., "human-pain = C-fibers," "octopus-pain = O-fibers") → **Local Reductionism**.  
    → *Awkward commitment:* Psychology fractures into disconnected domain-specific sciences (no unified science of mind).  
  - **Define pain by its *functional role* across systems** → **Classical (Role) Functionalism** (same as above).  
  - **Define pain as the *disjunction of realizers*** → **Realizer Functionalism** (same as above).  

  ---

  #### **Question D:**  
  *Is the denial of MR because mental states are **identical to specific physiological states**?*  
  - **Yes** → **Type Identity Theory**.  
    → *Awkward commitment:* Must deny that robots or aliens could feel pain (e.g., "only C-fiber systems can feel pain").  
  - **No** → Go to **Question E**.  

  ---

  #### **Question E:**  
  *Is MR **possible in principle** but **vanishingly rare in practice**?*  
  - **Yes** → **Skeptical View** (e.g., conservative reductionism).  
    → *Awkward commitment:* Must dismiss canonical MR examples (e.g., argue octopus "pain" isn’t *real* pain).  
  - **No** → **Empty Branch**.  
    → *Diagnosis:* Leads to non-physicalism (e.g., dualism), which rejects physicalism entirely and lies outside the MR debate.  

  ---

  ### Key Notes:  
  1. **Unclean Separations:**  
     - *Classical vs. Realizer Functionalism*: The tree splits these cleanly at **Question B/C**, but both face challenges explaining causal efficacy (roles are abstract, realizers are disjunctive).  
     - *Local Reductionism vs. Type Identity*: Distinguished by **Question D** (Type Identity denies MR globally; Local Reductionism accepts MR but fragments reductions).  

  2. **Empty Branches:**  
     - **Non-physicalism** (reached via **No → No** in **Question E**): Untenable for physicalists; ignores functionalism’s core motivation.  
     - **Conceptual MR with realizer causality** (not empty but awkward): Realizer functionalism struggles with disjunctive kinds.  

  3. **Time Estimate:** ~8–10 minutes to traverse.  

  ---

  ### How to Use:  
  - **Internal nodes** (questions) are based on intuitive judgments (e.g., "Does science or philosophy reveal MR?").  
  - **Leaves** are labeled positions with their key cost.  
  - **Paths** reflect live debates (e.g., role vs. realizer causality, empirical vs. conceptual MR).  

  This tree captures 90% of the debate; real-world positions may blend commitments (e.g., some functionalists combine roles with species-specific constraints).
