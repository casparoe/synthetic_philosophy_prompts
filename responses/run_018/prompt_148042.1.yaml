      *   **Scenario:** Scientists use advanced DNA synthesis. They sequence the nuclear genomes of your mother's egg and your father's sperm *from stored samples*. They then *chemically synthesize perfect copies* of both sets of chromosomes from scratch, using lab-made nucleotides. These synthetic chromosomes are placed into a donor egg (with its nucleus removed) and fertilized *in vitro*. The resulting embryo is implanted and develops normally.
