  2.  **Rejection of Strict Kripke-Style Origin Essentialism:** Jordan explicitly rejects the necessity of the *exact gamete cells*. IVF/Surrogate and Cryofrozen cases prove this. The *physical matter* of the original egg cell isn't essential for her, just the *nuclear DNA molecules* that were originally inside it.

  3.  **Committed Position:** Jordan is **not** running a strict Kripke-style origin essentialism (specific gamete cells). She's running a modified principle: **Origin Essentialism grounded in the Physical Continuity of the Specific Parental Nuclear DNA Molecules.** The specific sperm cell and the specific egg nucleus (containing the DNA molecules) are the essential origins. How they are delivered, where they develop, or what surrounds them (as long as the nucleus remains intact) is non-essential.

