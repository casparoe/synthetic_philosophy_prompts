answer: |-
  You've pinpointed the core ambiguity of this powerful metaphor. Let's dissect "revolutions devour their own children" into its distinct theses, evaluate their nature, map them onto historiographical frameworks, expose the smuggled reading, and introduce a clarifying distinction.

  **I. Dissecting the Slogan: Precise Theses & Their Nature**

  1.  **Thesis: Internal Factional Dynamics Under Radical Uncertainty & Threat**
      *   **Claim:** Revolutionary situations create extreme uncertainty, pervasive fear of counter-revolution, and intense competition for power. This environment incentivizes preemptive strikes against potential rivals *within* the revolutionary camp, as factions perceive internal dissent as existential betrayal aiding the external enemy. Loyalty becomes paramount and impossible to prove absolutely.
      *   **Nature:** **Substantive general pattern of revolutionary politics.** While heightened in the Terror, it's observable in many revolutions (Bolshevik purges, Iranian Revolution post-1979). Not *inevitable* but highly *probable* under specific conditions.

  2.  **Thesis: Institutional Logic of Revolutionary Governance**
      *   **Claim:** Revolutionary institutions (like Committees of Public Safety, surveillance networks) created to defend the revolution inherently concentrate power and demand constant vigilance. To maintain their own legitimacy and purpose, they *must* continually identify and eliminate "enemies." This logic drives an ever-expanding definition of treason, inevitably turning against former allies who now represent dissent or moderation.
      *   **Nature:** **Substantive general pattern of revolutionary politics.** Deeply structural logic tied to the nature of emergency revolutionary governance. Highly relevant to 1789-94, seen elsewhere (e.g., Cultural Revolution committees).

  3.  **Thesis: Psychological Law of Revolutionary Fervor Leading to Paranoia**
      *   **Claim:** The intense ideological commitment and utopian zeal required to make a revolution create a mindset vulnerable to seeing betrayal everywhere. The "high" of radical change crashes into fear and suspicion, fueled by real threats but escalating into irrational paranoia where former comrades become the primary threat.
      *   **Nature:** **Platitude bordering on false metaphor.** While individual psychology plays a role, framing it as a universal "law" is reductionist and ignores structural/political factors. It risks pathologizing revolutionaries. More a *possible symptom* than a primary cause.

  4.  **Thesis: Sociological Self-Destruction of the Revolutionary Base**
      *   **Claim:** The radical measures implemented to defend the revolution (e.g., Terror, economic controls, centralization) systematically destroy the very social groups (artisans, urban poor, radical sections of the bourgeoisie) whose mobilization was essential for its initial success. The revolution consumes its human fuel.
      *   **Nature:** **Substantive empirical claim specific to 1789 (with broader resonance).** This fits the trajectory of the *sans-culottes* perfectly – essential for overthrowing the monarchy and the Girondins, then marginalized and repressed by the Jacobin state they helped empower. Applicable elsewhere, but the *specific mechanisms* (e.g., *maximum* vs. dechristianization) are historically contingent.

  5.  **Thesis: Retrospective Narrative Pattern**
      *   **Claim:** The phrase is primarily a *storytelling device* used by historians (often conservative or liberal) to impose a tragic, morally instructive arc on chaotic events. It emphasizes futility and inherent instability, downplaying contingency, alternative possibilities, or the revolution's achievements.
      *   **Nature:** **Substantive claim about historiography.** It's not an explanation *within* the event but a way of framing it *afterwards*. This reading highlights how the metaphor itself shapes understanding.

  **II. Mapping Readings onto Historiographical Frameworks & Explanatory Work**

  *   **Class-Struggle Account (e.g., Marxian/Soboul):**
      *   **Primary Supporting Reading:** **Sociological Self-Destruction.** The bourgeoisie, having used popular forces (the "children") to destroy feudalism and secure power, then turns against those forces (via the Jacobin Terror *and* Thermidor) when they threaten bourgeois property relations and political control. The revolution devours its radical proletarian/semi-proletarian children to consolidate bourgeois rule.
      *   **Secondary Support:** **Institutional Logic.** Repressive institutions serve class interests.

  *   **Ideological Account (e.g., Furet/Hunt):**
      *   **Primary Supporting Reading:** **Institutional Logic.** The uncompromising logic of popular sovereignty and Republican virtue, embodied in institutions like the Committee, *demands* the purification of the body politic. Any deviation is treason. Robespierre becomes consumed by the very ideology he embodies.
      *   **Secondary Support:** **Psychological Fervor/Paranoia.** Seen as an effect of the ideological absolutism.

  *   **Contingency Account (e.g., Revisionists like Cobban/Doyle):**
      *   **Primary Supporting Reading:** **Factional Dynamics under Uncertainty.** The Terror was not inevitable but the product of specific, contingent pressures: the military crisis (foreign invasion, civil war), economic collapse, personalized rivalries (Danton vs. Robespierre, Hébert vs. Robespierre), and the breakdown of normal political processes. The "devouring" was an avoidable tragedy caused by extreme circumstances and human decisions, not deep structures or inherent logics.
      *   **Rejects:** Sociological Self-Destruction as deterministic, Institutional Logic as over-structural, Psychological Law as unsupported generalization. Views the Narrative Pattern as often smuggling in determinism.

  **III. The Smuggled Reading (Dismissing Revolutionary Politics)**

  When used to dismiss *all* revolutionary politics as inherently self-defeating, the smuggled reading is a **combination of the Psychological Law and the Retrospective Narrative Pattern, presented as a General Law.**

  *   **How it works:** The phrase suggests revolutions possess an inherent, almost biological, flaw. The initial idealism *necessarily* curdles into paranoia and violence ("fervor burns out"). The tragic arc ("devouring") is presented as inevitable. This smuggles in a deterministic, pessimistic view where revolution is always doomed to consume its best elements and descend into tyranny, making it futile and dangerous *by its very nature*. It ignores contingency, specific historical contexts, different revolutionary outcomes (e.g., some partial successes, negotiated transitions), and reduces complex political processes to a fatalistic morality tale.

  **IV. Introducing a Conceptual Distinction: Auto-Immunity vs. Ideological Overreach**

  *   **Auto-Immunity:** A **structural/institutional mechanism** internal to the revolutionary state. The emergency institutions created for survival (the "immune system") become so powerful and paranoid that they start attacking the healthy body politic they were meant to protect. *They misidentify internal dissent as an existential pathogen.* This focuses on the *logic of power* in revolutionary crisis governance – the self-perpetuating need for enemies, the centralization of coercion, the erosion of checks. (Links strongly to the *Institutional Logic* thesis).
  *   **Ideological Overreach:** An **ideological/dynamic process.** The revolution's core principles, pushed to their absolute, uncompromising extreme, become impossible to fulfill or sustain. The pursuit of perfect virtue, unity, or purity creates an ever-narrower definition of legitimacy, turning former allies into heretics. This focuses on the *internal logic of the ideology* and its interaction with human ambition and fear under pressure. (Links strongly to the *Psychological Fervor* and *Ideological Account*).

  **V. Does this Distinction Resolve or Rename?**

  *   **Clarifies Mechanism vs. Pattern:** It directly addresses your question. "Auto-Immunity" points to a concrete, institutional mechanism potentially internal to revolutionary states (answering "yes" to describing an internal mechanism). "Ideological Overreach" points to a dynamic process driven by ideas and psychology. The "Retrospective Narrative Pattern" remains a separate, meta-historical category.
  *   **Substantive Advance:** It *does* resolve something substantive:
      *   It forces specificity: *Is* the "devouring" primarily about how *power is structured and exercised* in revolution (Auto-Immunity), or is it about how *ideas radicalize and distort* (Overreach)? These can coexist, but they are distinct drivers.
      *   It reframes the debate: Instead of arguing whether "devouring" is inevitable, we can ask *under what conditions* does institutional auto-immunity become dominant? *When* does ideological overreach become the primary driver? *How* do they interact?
      *   It aids historical analysis: Applying this to 1793-94, you could argue the Law of Suspects and revolutionary tribunals exemplify **Auto-Immunity**, while the Cult of the Supreme Being and Robespierre's speeches on virtue exemplify **Ideological Overreach**. Their combination was devastating.
  *   **Limitation (Renaming Risk):** It doesn't *fully* resolve the deeper determinism vs. contingency debate. A proponent of contingency could argue that both auto-immunity and overreach were *contingent outcomes* of the specific crises of 1793, not inevitable features. A structuralist could argue they were inherent potentials unleashed by the revolutionary rupture. **However, it moves the debate onto more precise ground.** Instead of a vague metaphor, we have clearer concepts to analyze *how* the process unfolded and *what kind* of "devouring" occurred.

  **Conclusion:** The metaphor bundles distinct theses. It does significant explanatory work within all three major frameworks, though differently. When used dismissively, it smuggles in psychological and narrative determinism. Distinguishing **Institutional Auto-Immunity** (a structural mechanism of revolutionary power) from **Ideological Overreach** (a dynamic process of radicalization) provides substantive conceptual clarity. It moves beyond renaming by pinpointing different *types* of causal processes potentially internal to revolutions, offering a more precise toolkit for analyzing *how* and *why* revolutions might "devour their own children," without necessarily assuming they always must. It refines, rather than resolves, the core debate by demanding greater specificity about the mechanisms at play.
