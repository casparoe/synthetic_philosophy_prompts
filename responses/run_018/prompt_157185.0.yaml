answer: |-
  ### Research Proposal: Diachronic Vulnerability and the Utility Separability Assumption in Money Pump Arguments  

  **Title:** Interdependent Values and Diachronic Coherence: Revisiting the Foundations of Money Pump Arguments  

  #### 1. Research Question  
  *Do standard arguments for diachronic coherence (specifically, money-pump vulnerability proofs) require the assumption of time-separable utility, or can they be generalized to agents with interdependent value structures?*  

  #### 2. Background and Motivation  
  Money pump arguments purport to show that agents with dynamically inconsistent preferences (e.g., those who fail to update beliefs via Bayesian conditioning) are vulnerable to exploitation through a series of trades. However, these arguments implicitly rely on *time-separable utility* (TSU): the assumption that an agent’s utility for an outcome at time *t* is independent of their preferences or outcomes at other times. Under TSU, the utility of a temporally extended sequence is additive across stages (e.g., *U*(sequence) = *u₁*(outcome₁) + *u₂*(outcome₂) + ...). This neglects agents for whom present values *directly depend* on future preferences—e.g., caring intrinsically about future autonomy, regret, or identity continuity. Such *interdependent value structures* (IVS) are empirically plausible (e.g., commitment mechanisms, intertemporal identity) and philosophically significant, yet their implications for diachronic rationality remain unexplored.  

  Current formal treatments of money pumps (e.g., in Savage-style frameworks or stochastic choice models) universally assume TSU without justification. This gap is critical: if IVS blocks standard vulnerability arguments, it could undermine the claim that incoherent belief revision *necessarily* implies irrationality. Conversely, if a generalized pump succeeds under IVS, it would strengthen diachronic coherence requirements for a broader class of agents.  

  #### 3. Approach and Methodology  
  To resolve this, I will construct multi-stage decision trees comparing agents across two key dimensions:  
  - **Belief revision coherence**: Coherent agents update beliefs via conditioning; incoherent agents violate it (e.g., through "rigid" or belief-forgetting dynamics).  
  - **Utility structure**: Time-separable (TSU) vs. interdependent (IVS) utility. For IVS, I will model utility as *recursive* or *cross-temporal*, where utility at stage *t* depends directly on the utility function at *t+1*. For example:  
    *Uₜ(sequence) = f(uₜ(outcomeₜ), U_{t+1}(·))*  
    with *f* encoding non-instrumental dependence (e.g., valuing "future selves’ approval" intrinsically).  

  Using dynamic choice models, I will:  
  1. **Replicate classic pumps** under TSU with incoherent belief revision (e.g., an agent with cyclical preferences exploited through a series of trades).  
  2. **Introduce IVS** into the same pump setup, specifying functional forms for interdependence (e.g., present utility penalized if future choices conflict with current ideals).  
  3. **Test exploitability** by determining whether a money-pump sequence remains profitable *for the exploiter* given IVS-induced preference shifts. For instance, if the agent’s changing future utilities alter their trade valuations mid-sequence, the pump may fail to extract net value.  
  4. **Generalize findings** to stochastic and ordinal frameworks to ensure robustness beyond cardinal utility.  

  #### 4. Expected Outcomes and Significance  
  - **Positive result**: A generalized money pump under IVS would demonstrate that belief revision coherence is necessary for diachronic rationality *even when utilities are interdependent*. This would extend the scope of standard arguments.  
  - **Negative result**: If IVS systematically blocks exploitation (e.g., by making the agent’s evolving preferences "pump-resistant"), it challenges the universality of diachronic coherence norms. This could support "fragmented" or context-relative theories of rationality.  

  Either outcome advances the field:  
  - Philosophically, it clarifies whether rationality demands preference stability or accommodates dynamic values.  
  - Formally, it exposes hidden assumptions in foundational arguments, potentially motivating new decision theories for non-separable agents (e.g., incorporating recursive preferences into coherence constraints).  

  #### 5. Feasibility and Limitations  
  This project is viable for a 3-month fellowship if scope is tightly managed:  
  - **Focus**: Restrict IVS to 2–3 tractable cases (e.g., regret-sensitive utility or identity-based recursion) and 3-stage decision trees.  
  - **Tools**: Use analytic models (not simulations) with ordinal choice or bounded cardinal utility.  
  - **Timeline**:  
    - Month 1: Formalize TSU and IVS agents; replicate classic pumps.  
    - Month 2: Develop IVS decision trees; test exploitability.  
    - Month 3: Generalize results; draft findings.  

  **Key risks**:  
  - **Overextension**: IVS formalisms could become intractable if interdependence is too complex (e.g., unconstrained recursion). Mitigation: Use simple functional forms (e.g., additive interdependence) from behavioral economics.  
  - **Ambiguity**: Defining "non-instrumental" interdependence risks circularity. Mitigation: Adopt clear axioms (e.g., IVS violates state-wise dominance when future utilities change).  
  - **Negative proof burden**: Showing *no pump exists* under IVS requires exhaustive case-checking. Mitigation: Focus on constructive proofs for the positive case and counterexamples for the negative.  

  **Deliverable**: A paper proving/disproving the necessity of TSU for money-pump arguments, with implications for diachronic rationality in non-separable contexts.  

  ---  
  *This proposal isolates a foundational gap in decision theory, avoids well-trodden debates, and leverages your insight about interdependence. By targeting the structural assumptions behind pumps—not belief revision itself—it promises novel philosophical leverage within a manageable scope.*
