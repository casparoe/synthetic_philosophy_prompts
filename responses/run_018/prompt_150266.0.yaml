  Final touch: that hoped-nobody-asks question needs to sting but not annihilate. Something like "Isn't your brain/behavior split just Szasz-redux with arbitrary exceptions?" Oof. But their reply can be honest - "It's a work in progress, but we need to discuss this". Humility might disarm critics.
answer: |-
  Here's your Q&A prep sheet - ordered by potential damage level, with casual British English objections and punchy replies. Designed for survival, not perfection!

  ---

  ### **Q&A Prep: "Medical Myths & Working-Age Mental Health"**  
  *Key Stance:* "Anxiety/depression labels medicalise social stress; psychosis is biologically different. Stop hiding society’s failures behind pill bottles."  

  ---

  **#1: Most Damaging Objection**  
  *Objection (from Social Worker/Nurse):* **"If we take away the 'illness' label for depression, won’t that just make it harder for people to get benefits, therapy, or time off work? You’re pulling the rug from under vulnerable people!"**  
  *Your Reply (2 mins):*  
  "Fair point – but we’re not denying their agony, we’re questioning *why* we call it illness. Right now, we slap a medical label on stress so the *system* doesn’t have to change: bosses overload staff, benefits get cut, and GPs hand out Prozac instead of fixing the rot. We should fight for proper social support *without* misusing medical terms. Calling burnout ‘Major Depressive Disorder’ lets policymakers off the hook."  
  *Weakness:* Doesn’t solve immediate access issues. Some WILL fall through gaps in transition.  

  **#2: Very Damaging**  
  *Objection (Nurse/GP):* **"Schizophrenia has no reliable biomarkers either! How can you call it ‘real’ but dismiss depression? That’s cherry-picking science."**  
  *Your Reply:*  
  "Schizophrenia’s got tangible differences: consistent brain volume changes, progressive decline if untreated, far higher heritability. Depression’s ‘diagnosis’? Two clinicians often disagree. My point: psychosis behaves like neurology (like epilepsy). Anxiety/depression? They’re universal human distress responses to crap lives – not brain pathology."  
  *Weakness:* Biomarkers for depression (e.g., inflammation) *are* emerging. You look dismissive.  

  **#3: Damaging (Especially from DSM-5 GP)**  
  *Objection (GP, sternly):* **"The DSM-5 is built on decades of research. Are you saying 1000s of experts are wrong and you—with no background—are right?"**  
  *Your Reply:*  
  "Respectfully, the DSM’s a tool, not scripture. It pathologises grief as ‘depression’ after two weeks! And ‘expert consensus’ changes: homosexuality was in there till ’73. We’ve medicalised normal suffering because it’s tidy – but for working adults drowning in bills, loneliness or bad jobs, ‘illness’ hides the truth. Even the NHS says ‘social prescribing’ works!"  
  *Weakness:* You *are* an amateur. Don’t duel on science. Pivot to social justice.  

  **#4: Annoying but Manageable**  
  *Objection (Nursing Student):* **"But antidepressants WORK for my patients with anxiety! If it’s not an illness, why do pills help?"**  
  *Your Reply:*  
  "Paracetamol helps heartbreak headaches – that doesn’t make heartbreak a brain disease! Antidepressants can blunt emotional pain (great for crisis relief!), but that’s not curing illness. If your patient’s anxiety comes from eviction or debt, pills won’t fix that. We’re overusing meds as sticking plasters for social wounds."  
  *Weakness:* Oversimplifies neurochemistry. Some genuinely benefit long-term.  

  **#5: Predictable Pushback**  
  *Objection (Social Worker):* **"Aren’t you minimising suffering? People with depression can’t just ‘pull themselves together’!"**  
  *Your Reply:*  
  "Absolutely not. This is about taking distress *more* seriously! If your leg’s crushed under a lorry, I wouldn’t call it ‘walking dysfunction’ – I’d blame the lorry. Labelling distress as ‘faulty brains’ implies it’s the person’s flaw, not society failing them. We need to demand better conditions, not just sedate the casualties."  
  *Weakness:* Ignores that some have depression without obvious trauma.  

  **#6: Eye-roll Territory**  
  *Objection (Nurse):* **"So what, we just tell panicked patients ‘it’s not an illness, love, your life’s just shit’?"**  
  *Your Reply:*  
  "Christ, no! We say: *‘What you’re feeling is real and brutal, and here’s how we’ll help you cope.* But let’s also talk about what’s crushing you – your job, your debts, your isolation – because you deserve more than just a prescription.’ Nurses already do this better than anyone!"  
  *Weakness:* Sounds naive about clinical time constraints.  

  ---

  ### **The Question You’re Dreading**  
  *Objection (Sharp GP/Social Worker):*  
  **"You claim psychosis is ‘biological’ but ignore that trauma, poverty, and racism massively increase schizophrenia risk. Isn’t your entire split between ‘brain’ and ‘social’ conditions arbitrary – and just as reductive as what Szasz criticised?"**  

  *Why it’s deadly:* It exposes the weak spot in your argument. Even psychosis isn’t *just* biology. If social factors shape it, why is your dividing line sacred?  
    
  *Survival Reply (2 mins):*  
  "Brilliant question – and you’re right, the lines *are* messy. My point is: psychosis often needs medical tools (antipsychotics save lives), whereas anxiety/depression rarely *start* in the brain. Yes, social stress can trigger psychosis, but once it’s rolling, it’s a neurological fire. With depression, the fire *is* the stress. I’m open to tweaking this – but we must stop treating existential pain like a tumour."  

  *Weakness:* You’re making a fuzzy distinction sound scientific. Admit it’s provisional!  

  ---

  **Final Tip:** If cornered, say: *"Look, I’m not here to dismantle your work. I’m saying we’re being used to bury society’s problems under a mountain of diagnoses. Let’s treat distress seriously without medicalising normality."* Nod to the GP: *"Even the DSM admits these categories aren’t perfect."*  

  Good luck – and if the GP looks furious, buy him a cuppa after! ☕
