  Key replies need to be pragmatic: emphasize they're not denying suffering, just questioning framing. Stress that keeping psychosis medicalized shows they're not anti-psychiatry radicals. And always bring it back to social determinants for working adults - that's their core point. 

  Should avoid citations as requested, but note where arguments are weakest so they know when to gracefully retreat. Like when confronted with biomarker evidence for depression - just concede it's evolving science rather than fight losing battles. 

