answer: |-
  Blimey, Quine'd probably reckon modern LLMs just shovel more dirt onto the gavagai problem, not solve it. The whole point was that *no amount* of behavioural evidence – pointing, grunting, even translation patterns – can *fix* reference to one unique thing ("rabbit" vs "undetached rabbit-stage"). LLMs learn massive correlations from heaps of text, sure, but they're just finding patterns in how *humans* use words relative to each other across languages. They're mirroring our own indeterminate practices, not discovering some bedrock meaning underneath.

  That niche wrinkle? It perfectly *proves* his point! If the model spits out "rabbit" for English speakers (who generally act *as if* "rabbit" refers to whole rabbity things) but "undetached temporal rabbit-stage" for a language with no speakers... well, that just shows the model's output is entirely relative to the *training data and target language conventions*. There's no "fact of the matter" it's uncovering about what 'gavagai' *really* means. The indeterminacy hasn't vanished; it's just shifted to being buried within the model's internal weighting jungle. The model hasn't pinned down reference – it's just learned different *correlation maps* for different outputs, each equally valid (or invalid) from an ontological perspective. Quine'd likely say it brilliantly demonstrates that meaning is always relative to a linguistic scheme, and LLMs, for all their cleverness, are just juggling those schemes without ever touching the "real" referent. Still indeterminate, innit? Just buried under a mountain of stats.
