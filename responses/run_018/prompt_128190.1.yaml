     2.1. The CVC does not warrant that every assertion P submitted by the User is either true or false. The CVC only warrants that it will provide a constructive verification of P if such a verification is submitted and validated, or a constructive refutation of P if such a refutation is submitted and validated.
     2.2. The User acknowledges that the Law of Excluded Middle (LEM) is not endorsed by the CVC. Consequently, for any assertion P for which the User has not submitted either a constructive proof or a constructive refutation, the CVC makes no warranty as to the resolution of P and shall not be compelled to produce a binary outcome.
     2.3. Any attempt by the User to invoke classical reasoning, including but not limited to the application of LEM or double-negation elimination, to force a binary outcome for an assertion P shall constitute a material breach of these Terms.

