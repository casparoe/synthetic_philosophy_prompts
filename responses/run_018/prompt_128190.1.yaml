  **Effective Date:** Upon constructive demonstration of the absence of contradictions in these Terms.

  **1. Definitions**
     1.1. "Proof" shall mean a finite, constructive object that provides an effective method for verifying a proposition. For the avoidance of doubt, a proof is not a mental state but a constructed object, as emphasized by Chief Logician Dr. Vera Constructiva: "A proof must be an intersubjectively verifiable construction, not a private conviction."
