answer: |-
  1.  
  **Instrumentalist:** Kepler's repeated complaints about astrology's predictive failures in personal letters prove his published celestial harmonies were merely strategic concessions to patrons demanding horoscopes. His economic dependence on court positions forced this performative duality.  
  **Causationist:** Predictive failure doesn't negate sincere belief; Kepler explicitly attributed it to the observer's soul being dissonant and misaligned with the harmonic rays, a necessary condition for accurate reception he integrated into his physical cosmology.  

  2.  
  **Instrumentalist:** Those very letters dismiss planetary 'influences' as empty terms for vulgar consumption, revealing his private contempt for the causal mechanism he publicly elaborated – it was economic theatre.  
  **Causationist:** Calling influences "empty" refers to simplistic *astrological* attributions, not his own physics; his *harmonics* involved measurable geometrical forces requiring active, disciplined mental attunement to perceive, not passive reception of vague omens.  

  3.  
  **Instrumentalist:** Invoking 'mental attunement' is conveniently unfalsifiable; it functions as an *ad hoc* shield against empirical counter-evidence, protecting the patronage stream by blaming the client's poor 'reception'.  
  **Causationist:** It's not a shield but the core causal mechanism: the soul, as a geometric entity resonating with planetary angles and intervals, must actively harmonize itself to physically receive and interpret the celestial forces – failure is mechanistic, not mystical evasion.  

  4.  
  **Instrumentalist:** His frantic search for paid positions while privately lamenting casting horoscopes demonstrates the instrumental reality: harmonics were a sophisticated sales pitch masking economic necessity, not a reflection of deep conviction about celestial souls attunement.  
  **Causationist:** Economic pressure explains his *actions* with clients, not his *physics*; his enduring, detailed work on cosmic harmony long after securing patronage shows genuine conviction that attunement was the physical key linking geometry, light, and human perception.  

  5.  
  **Instrumentalist:** You transform Kepler's pragmatic excuse for failed predictions – the client's 'untuned' mind – into a foundational causal principle, mistaking his rhetorical escape clause for sincere cosmological belief.  
  **Causationist:** You reduce a profound, consistent physical theory of resonant perception to a mere rhetorical trick, ignoring how observer-attunement was the *sine qua non* in Kepler's system for the causal transmission of harmonic forces to the embodied soul.
