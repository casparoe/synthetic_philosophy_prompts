  ## Opening Remarks: "Quietism in Practice: Tranquilism, Care Design, and the Value of Absence"

  Good morning. Welcome to this unusual gathering. To those of you who navigate the profound thresholds of human experience as palliative care clinicians and hospice architects, we are deeply grateful for your presence. And to those of you who wrestle with the intricate structures of value and well-being as philosophers, we are equally appreciative that you’ve chosen to join us. You represent two distinct worlds, yet both are fundamentally concerned with the architecture of a life well-lived – or perhaps, more accurately, a life well-ended. Today, we meet under a deliberately specific banner: **Quietism in Practice**.

  Our premise may feel immediately resonant to some, and instinctively challenging to others. That is intentional. To our colleagues from palliative care and hospice design: your daily work is often an art of subtraction. You alleviate suffering, remove obstacles to peace, design spaces that dissolve agitation rather than impose stimulation. You understand value expressed through absence – the absence of pain, the absence of undue noise, the absence of environmental friction. Your expertise lies in creating conditions where distress recedes, allowing a different quality of presence to emerge. This, in many ways, is the tangible expression of what we might call applied quietism.

  To our philosopher colleagues, accustomed to rich debates about the constituents of the good life – be they hedonistic satisfactions, virtuous activities, meaningful accomplishments, or pluralist combinations – our title and framing might seem provocative, perhaps even reductive. Quietism, particularly in its tranquilist form as we’ll explore it, contends that only the absence of craving and suffering carries intrinsic value. Positive mental states – intellectual excitement, aesthetic rapture, profound insight, even feelings of fulfillment – are understood not as intrinsic goods, but as fleeting absences of disturbance, valuable only insofar as they represent freedom from some prior lack or agitation. This perspective deliberately sidelines the very phenomena often central to your theories. It asks: what if the *reduction* of craving, not the *satisfaction* of it, is the fundamental good?

  This is where our unique frame for these two days begins. We are not here, primarily, to argue for tranquilism as the *correct* theory. Nor are we here to synthesize your diverse views into a richer, more complex whole. We are not gathering to achieve intellectual breakthroughs or expand conceptual frameworks, though insights may arise. Instead, we propose an experiment in **craving-neutrality**.

  Consider this: our theories about well-being, our convictions about what constitutes the good life, can themselves become sources of craving. We crave resolution. We crave vindication for our preferred account. We crave the synthesis that harmonizes discordant views. We crave the intellectual satisfaction of a richer, more encompassing theory. This craving, this subtle friction of holding incompatible perspectives or defending contested ground, is a form of conceptual suffering. It is the unease of unresolved tension in the realm of ideas.

  **Our purpose, then, is not to satisfy these intellectual cravings, but to observe them, understand them, and gently reduce them.** We aim to treat every theory presented here – including tranquilism itself – not as a competing good to be achieved or synthesized, but as a potential source of this craving. The value of this gathering lies in the collective *release* from the pressure to resolve, to win, to build a bigger intellectual edifice. It lies in the shared space where the friction of competing frameworks can subside.

  For our palliative care and design colleagues: think of this as analogous to your work. Just as you value an environment not for what it *adds* – more stimulation, more technology, more positive goals – but for what it *removes* (pain, noise, confusion, fear), we are attempting to design an intellectual environment valued for what it might *subtract*: the pressure for certainty, the demand for synthesis, the craving for definitive answers about the nature of the good. Can we create a conceptual space where the *relief* from theoretical tension becomes palpable?

  For our philosopher colleagues: I understand that this framing might feel like a denial of your subject matter. It asks you to step back, temporarily, from the passionate defense of positive states or pluralist goods. I ask not that you abandon your positions, but that you engage in a methodological experiment. Suspend, for these two days, the craving to vindicate your theory or refute its rivals. Instead, observe the craving that arises when theories clash. Notice the urge to resolve the tension. Can we explore what happens when we consciously *don't* feed that craving? Can we value the space created when that particular form of intellectual striving quiets down? Treat tranquilism’s challenge not as a conclusion to be accepted or rejected immediately, but as a lens through which to examine the very *activity* of theorizing well-being and the subtle discomforts it can generate.

  This is not a call for indifference or apathy. It is a call for a different kind of attention: attention to the *quality* of our engagement, to the subtle pressures we bring to intellectual work, and to the possibility that value might manifest most clearly not in the achievement of positive states, but in the quieting of the disturbances that obscure a fundamental equanimity.

  So, welcome to this shared experiment in craving-neutrality. Welcome to an exploration of absence as value, both in the physical spaces that cradle life’s end and in the conceptual spaces where we grapple with life’s meaning. Let us not seek to fill these next two days with more, but to discover what becomes possible when we collectively allow certain kinds of intellectual pressure to subside. Let us see what quiet emerges. Thank you.
