  The audience composition is crucial here - three distinct factions with potentially devastating objections. The phenomenal realists will attack first-person authority, the cognitive scientists will demand empirical grounding, and the Kantian poses a transcendental threat. The user specifically wants damage-controlled Q&A prep, not academic references. 

