prompt: |-
  Since retiring from bench science I've gotten into philosophy, mostly because Nozick's experience machine still buggs me. I want the full spec: what must a theory of well-being actualy deliver?

  Write exactly five desiderata — each in one or two sentences — covering the cases it has to get right (experience machine, adaptive preferences, maybe distributed cognition in slime molds?), the distinctions it can't collapse, and any biological results it can't violate. Flag which ones clash, and quickly note how hedonism, desire-satisfaction, and objective-list views do against them. If I'm conflating well-being with consciousness or asking for something incoherent, say so plainly — don't politely pretend.

  Number them 1 to 5, no intro, no conclusion, American English. No citations or reading lists, please — I'm working offline.
reasoning: |-
  Okay, the user is a retired bench scientist now into philosophy, specifically troubled by Nozick's experience machine. They want five clear desiderata for a theory of well-being. Let me unpack their request.

  First, they mention adaptive preferences, distributed cognition in slime molds, and biological constraints. These are diverse cases that test different aspects of well-being. The user likely wants a theory that's biologically grounded but doesn't ignore subjective experience. 

  I need to identify core challenges: the machine's illusion problem, adaptation issues like oppressed individuals, non-human cognition implications, mind-dependence tensions, and biological feasibility. Each must be addressed concisely.

  The user explicitly wants clashes flagged. Hedonism fails the machine test but handles adaptation poorly. Desire theories struggle with adaptive preferences. Objective lists bypass illusions but impose values rigidly. Slime molds challenge all by demanding minimal cognition standards.

  They're working offline - no citations, just raw analysis. American English means direct language. "Buggs" is intentional informality - match that tone. Must avoid conflating well-being with consciousness; explicitly note if requests are incoherent.

  Structuring five numbered points: start with the machine (universal entry point), then adaptation (social justice link), slime molds (biological boundary), mind-dependence tension (meta-requirement), finally biological plausibility (scientific rigor). 

  Clashes will emerge between anti-illusion demands and adaptation handling (desiderata 1 vs 2), plus objective theories vs biological variability (4 vs 5). Need to flag these sharply. 

  User's background suggests impatience with fluff. Respond like a peer: "don't politely pretend" means call out contradictions. If slime mold inclusion stretches coherence, say so - but it's a valid stress test for theories claiming universality. 

  Final check: each desideratum must force tough tradeoffs. No theory should ace all five - that's the point. Show how each mainstream approach stumbles differently.
answer: |-
  1.  **Must reject plugged-in bliss:** The theory must explain why permanently connecting to the experience machine (delivering maximal positive sensations/feelings) is worse than real life, even if undetectable, preventing collapse of well-being into mere positive conscious experience (Hedonism fails this; Desire-Satisfaction may fail if desires are satisfied in the machine; Objective-List views typically pass).
  2.  **Must condemn adapted oppression:** It must judge a person systematically oppressed from birth (e.g., contented slave) as having low well-being *despite* their reported satisfaction or adapted preferences, avoiding justification of subjugation via adaptation (Hedonism and Desire-Satisfaction often fail; Objective-List views typically pass).
  3.  **Must handle minimal cognition:** It needs a plausible account for entities with extremely simple cognition (e.g., slime molds finding food) possessing *some* well-being (or ill-being) without anthropomorphizing, respecting biological continuity without requiring complex consciousness (Hedonism struggles; Desire-Satisfaction struggles; Simple Objective-List views like "flourishing per kind" might fit best).
  4.  **Cannot fully collapse mind-dependence/independence:** It must navigate the tension between well-being being *for the subject* (so not entirely independent of their mind) and containing elements not *solely determined* by their current mental states (like beliefs/desires) to avoid the pitfalls of pure subjectivism or rigid objectivism (All major types struggle to balance this, creating friction with 1 & 2).
  5.  **Must be biologically plausible:** Its requirements cannot fundamentally violate known biological constraints on cognition, motivation, or flourishing for the kind of entity; e.g., requiring impossible mental states or ignoring evolved drives central to survival/reproduction (This constrains all theories, potentially clashing with highly idealized versions of 1, 2, or 3).

  **Clashes:** Desideratum 1 (anti-illusion) clashes with pure subjectivist readings needed for Desideratum 2 (anti-adaptation). Desideratum 4 (mind-dependence tension) inherently clashes with itself and complicates satisfying 1 and 2. Desideratum 5 (biological plausibility) can clash with highly abstract or rationalist demands of some Objective-List views. Including slime molds (3) pushes the concept and may risk incoherence if well-being is tightly linked to valenced experience. You're *not* conflating it with consciousness, but 3 tests the lower bounds.
