prompt: |-
  I am a retired experimental physicist now moderating an interview series for scientists recently drawn to philosophy of science. Next week's guest is a philosopher who defends Kelly betting—maximizing expected logarithmic capital—as the normative core of scientific rationality, interpreting this geometric-rationality framework as a solution to the problem of induction by treating theory choice as portfolio allocation across competing hypotheses. Please draft eight to ten interview questions that go well beyond having him restate the position. I want at least one question pressing the distinction between epistemic and financial risk aversion in betting on auxiliary assumptions, paired with a follow-up keyed to his likely appeal to long-run growth-rate optimality; one probing how the framework handles continuous parameter spaces where prior probabilities depend on arbitrary parameterizations, with a follow-up anticipating his defense via reference priors; one challenging the extension from individual-agent norms to collective scientific practice—specifically whether a research community ought to pool capital across laboratories or maintain separate portfolios; and one introducing a concern I have developed about adversarial misspecification, in which nature selects outcomes to minimize the researcher’s log-wealth rather than sampling from any true model, asking whether this collapses the Kelly criterion into an uninformative maximin rule and what that implies for the claim that geometric rationality resolves induction. For each required line of questioning, include the calibrated follow-up, and ensure the overall sequence builds pressure on the move from betting mathematics to normative epistemology.
