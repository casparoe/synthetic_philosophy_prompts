prompt: |-
  I work as a drafting clerk for a state-level legislature, and lately every bill preamble and every floor speech ends with some version of "this honors the will of the people." My supervisor asked me to build a quick vetting procedure I can run on these texts before they go to print -- she doesn't want philosophical essays, she wants a reusable checklist that takes about fifteen minutes and that I can defend if a legislator complains. I don't have formal training in political philosophy, so I need the procedure to actually embed whatever democratic theory knows about collective will: not just "people disagree," but the structural issue that a group doesn't have a mind, and any claim about its will depends on how you constitute it (aggregation, acclamation, representation that manufactures the consent it reports, and that weird negative-sovereignty idea my roommate brought up where the will is just whatever people haven't actively rejected).

  Can you turn this into a step-by-step decision procedure? It needs to cover: what to check when the bill cites a specific policy prefference (like a tax rate); what to check when it claims the people "have spoken" after a narrow or contested vote; and what to check when it appeals to a "silent will" of people who never showed up. For each, include a quick test sentence or two I can apply, mark the steps that are really judgment calls in disguise, and work through all three examples including one where the procedure forces me to flag something that politically I actually agree with. Also be explicit about where the procedure breaks down and definately can't settle the dispute, and don't ask me to look up scholars or build a bibliography -- I just need the logic operationalized.
reasoning: |-
  Okay, the user is a drafting clerk for a state legislature who needs a practical, defensible checklist to evaluate claims about "the will of the people" in legislative texts. They explicitly reject philosophical essays and demand an operational 15-minute procedure grounded in democratic theory's core problem: groups don't have unified wills, only constructed ones. 

  Hmm, their pain points are clear: political pressure to rubber-stamp these phrases, lack of formal theory training, and need to flag problematic claims even when they personally agree. The roommate's "negative sovereignty" mention suggests they've encountered sophisticated critiques but need tools, not lectures. 

  Breaking this down: the procedure must handle three claim types—(1) specific policy preferences, (2) contested/narrow votes, (3) silent majorities—with built-in safeguards against four construction methods (aggregation, acclamation, representation, negative consent). Crucially, it must expose where the claim depends on unstated assumptions about how "will" is defined. 

  For policy claims (Type 1), the trap is conflating any poll or input with "will." The key test should force asking: was this preference actually measured, and did the measure match the claim's specificity? Example: claiming "the people want a 5% tax" based on a vague "do you like taxes?" poll fails the granularity test. 

  For contested votes (Type 2), the issue isn't disagreement but whether the claim misrepresents marginal support as overwhelming. The turnout/opposition thresholds (Step 2.3) must be adjustable per jurisdiction—this is where judgment creeps in, so I'll suggest default ranges but emphasize documenting the choice. 

  "Silent will" claims (Type 3) are the trickiest. The roommate's negative sovereignty point is vital here: absence of protest ≠ endorsement. The procedure must require evidence that silence is intentional (e.g., designed feedback channels ignored) and rule out alternative explanations like apathy. 

  Ah, and the user needs a self-incriminating example—good. I'll use a progressive policy claim they might support but that fails the "mandate test" due to low salience. That demonstrates neutrality. 

  Biggest limitation: the procedure can't resolve whether a claim is "true," only whether it's defensibly constructed. Step 5 explicitly kicks the political judgment back to legislators—exactly what the supervisor wants for risk transfer. 

  Final design principle: every step either produces verifiable evidence (✅/❌) or forces transparent assumptions (⚠️). No theory citations, just action verbs: "Check whether...", "Verify that...", "Flag if..."
answer: |-
  Here's a 15-minute, defensible vetting procedure focusing on structural legitimacy, not philosophical debate. It targets *how* "the will" is constructed in the text. Apply this checklist sequentially for each claim.

  **Core Principle:** **Flag claims where the asserted "will" lacks a *demonstrable, specific connection* to a *defined group* via a *clear, defensible method* of construction.** Your role is to expose shaky foundations, not judge the claim's truth.

  ---

  **I. Vetting Procedure: "Will of the People" Claims**

  **Step 0: Identify the Claim Type (1 min)**
  *   **Type 1: Specific Policy Preference** ("The people demand a 5% tax rate").
  *   **Type 2: "The People Have Spoken" (Post-Vote)** ("After the referendum, the people's will is clear" - narrow/contested).
  *   **Type 3: "Silent Will" / "Unspoken Mandate"** ("The silent majority supports this action").
  *   *Mark:* ✅ Type identified.

  **Step 1: Check the Defined Group (2 min)**
  *   **Question:** *Who exactly are "the people" in this claim? Is it defined?*
  *   **Check:**
      1.  Does the claim specify a group? (e.g., "voters," "residents," "citizens," "stakeholders")? If not, **Flag: "❌ 'The people' undefined."**
      2.  Is the defined group *logically connected* to the policy? (e.g., Claiming "the people" on a local zoning bill likely means local residents, not the whole state). If illogical, **Flag: "❌ Defined group illogical for policy scope."**
  *   *Mark:* ✅ Group defined & logical, or ❌ Flagged.
  *   *Judgment Call?* **Slight.** Logic connection requires minor judgment based on policy scope/impact.

  **Step 2: Check the Method of Construction & Evidence (10 min - Focus varies by Type)**

  *   **TYPE 1: Specific Policy Preference**
      *   **Question:** *Is there *specific, relevant evidence* showing *this specific group* expressed *this specific preference*?*
      *   **Checks:**
          1.  **Evidence Cited?** Is specific evidence mentioned (e.g., named poll, survey, hearing testimony, petition)? **If NO: ❌ Flag: "No evidence cited for specific preference."**
          2.  **Method Match?** Does the evidence method *actually measure* the *specific preference* claimed? (e.g., Claim: "People want 5% tax." Evidence: Poll asking "Do you support lower taxes?" is **mismatched**). **If mismatched: ❌ Flag: "Evidence method does not directly measure claimed specific preference."**
          3.  **Group Match?** Does the evidence source *represent the defined "people"* from Step 1? (e.g., Claim: "State residents want X." Evidence: Poll of 100 local activists is **mismatched**). **If mismatched: ❌ Flag: "Evidence source does not represent defined group."**
          4.  **Context & Recency:** Is the evidence recent and relevant to the *current* policy context? (Judgment: Major shifts in circumstances weaken older evidence). **If significantly outdated/irrelevant: ⚠️ Flag: "Evidence context may be outdated/irrelevant."**
      *   *Judgment Call?* **Moderate (Steps 2.2, 2.3, 2.4).** Assessing match/mismatch requires judgment.

  *   **TYPE 2: "The People Have Spoken" (Post-Vote)**
      *   **Question:** *Does the vote result *warrant* framing as a clear, unambiguous expression of "will" by the defined group, given its nature?*
      *   **Checks:**
          1.  **Vote Type:** Was it a binding referendum/initiative *directly* on this policy? **If NO (e.g., general election): ⚠️ Flag: "Vote was not a direct expression on this specific policy."**
          2.  **Margin:** Is the margin substantial? (Judgment: Apply a reasonable threshold - e.g., <55% win OR <5% margin OR high spoiler effect = **narrow**). **If narrow/contested: ❌ Flag: "Vote margin narrow/contested; insufficient basis for unambiguous 'will' claim."**
          3.  **Turnout:** Was turnout representative? (Judgment: Significantly below typical turnout for similar votes? Consider demographics if known). **If abnormally low: ⚠️ Flag: "Low turnout raises representativeness question."**
          4.  **Campaign Clarity:** Was the vote question clear and the campaign fairly conducted? (Judgment: Extreme misinformation or confusion? If obvious, **Flag: "⚠️ Campaign context may undermine vote legitimacy as clear 'will'."**)
      *   *Judgment Call?* **Significant (Steps 2.2, 2.3, 2.4).** Thresholds and context assessment are crucial.

  *   **TYPE 3: "Silent Will" / "Unspoken Mandate"**
      *   **Question:** *Is there *positive evidence* that silence or inaction constitutes *support* for *this specific policy*, ruling out other explanations?*
      *   **Checks:**
          1.  **Evidence of Silence?** Does the claim *only* cite absence of opposition? **If YES: ❌ Flag: "Claims silence = support without positive evidence."** (This rejects pure negative sovereignty).
          2.  **Positive Evidence?** Is there ANY cited positive evidence *specifically* for this policy (e.g., polls showing support *despite* no action, relevant prior votes)? **If NO: ❌ Flag: "No positive evidence cited for silent support."**
          3.  **Alternative Explanations:** Could silence reasonably mean something else? (e.g., apathy, lack of awareness, barriers to participation, focus on other issues). **If plausible alternatives exist: ❌ Flag: "Silence plausibly explained by factors other than support."**
          4.  **Opportunity for Expression:** Was there a clear, accessible mechanism for the defined group to express opposition *if they felt strongly*? (e.g., open hearings, easy contact methods)? **If NO mechanism: ❌ Flag: "No clear mechanism existed for opposition, undermining silence-as-support."**
      *   *Judgment Call?* **Significant (Steps 3.3, 3.4).** Assessing plausible alternatives and opportunity is key.

  **Step 3: Check for Overreach / Misrepresentation (2 min)**
  *   **Question:** *Does the claim *overstate* what the construction method actually shows?*
  *   **Check:** Regardless of type, does the claim use words implying universality, overwhelming mandate, or moral imperative that the evidence/method *cannot* support? (e.g., "the *clear and overwhelming* will," "*all* citizens demand," "the *undeniable* mandate" when evidence is narrow, contested, or silent). **If YES: ❌ Flag: "Language overstates conclusiveness/scope given evidence/method."**
  *   *Judgment Call?* **Moderate.** Assessing if language meaningfully exceeds the evidence's strength.

  **Step 4: Summarize & Flag (Final Step)**
  *   Review your flags (❌ and ⚠️).
  *   **Decision:** If **any ❌ Flag** exists, **recommend revision or removal** of the "will of the people" claim. Explain using the flag reasons (e.g., "Claim lacks specific evidence matching defined group," "Narrow vote insufficient for unambiguous will," "Silence claimed as support without positive evidence/mechanism").
  *   For **⚠️ Flags**, note them as "considerations" but not necessarily requiring change unless combined with ❌ flags or judged severe. Document reasoning.
  *   *Mark:* ✅ Pass (No ❌ Flags), ❌ Fail (At least one ❌ Flag), or ⚠️ Pass with Caveats (Only ⚠️ Flags).

  ---

  **II. Worked Examples**

  1.  **Type 1 (Policy Preference) - You AGREE with the policy:**
      *   **Claim:** "The people of our state overwhelmingly demand a 15% cap on insulin prices." (No evidence cited).
      *   **Step 1:** Group = "people of our state" (Defined & Logical - ✅).
      *   **Step 2 (Type 1):**
          *   2.1 Evidence Cited? **NO ❌ Flag: "No evidence cited for specific preference."**
          *   (Stop here, fails). *Even though you agree, the claim lacks any foundation.*
      *   **Step 3:** N/A (Already failed). **Result: ❌ FAIL - Recommend removal/cite evidence.**

  2.  **Type 2 ("Have Spoken" - Narrow Vote):**
      *   **Claim:** "Following the decisive referendum vote, the will of the people is clear: we must build the reservoir." (Referendum passed 51% to 49%, turnout 42% - typical for off-year).
      *   **Step 1:** Group = Voters (Implied by referendum - ✅).
      *   **Step 2 (Type 2):**
          *   2.1 Vote Type: Binding Referendum ✅.
          *   2.2 Margin: 51-49% = **Narrow ❌ Flag: "Vote margin narrow/contested; insufficient basis for unambiguous 'will' claim."**
          *   2.3 Turnout: 42% - Low? (Judgment: 42% is low for major infrastructure? ⚠️ Flag: "Low turnout raises representativeness question.") *But the ❌ on margin is decisive.*
      *   **Step 3:** "Decisive" overstates the narrow margin. **❌ Flag: "Language overstates conclusiveness given narrow margin."**
      *   **Result: ❌ FAIL - Recommend softening language (e.g., "a majority of voters supported...") or removing "will of the people" claim.**

  3.  **Type 3 ("Silent Will"):**
      *   **Claim:** "The silent majority of residents supports this zoning change; their lack of opposition speaks volumes."
      *   **Step 1:** Group = "Silent majority of residents" (Vague but defined as residents - ⚠️ Note vagueness, but proceed. Group logical for zoning ✅).
      *   **Step 2 (Type 3):**
          *   3.1 Evidence of Silence? Only cites lack of opposition. **❌ Flag: "Claims silence = support without positive evidence."**
          *   3.2 Positive Evidence? None cited. **❌ Flag: "No positive evidence cited for silent support."**
          *   3.3 Alternatives? Plausible: Apathy, unawareness (public notice minimal?), busy with other issues. **❌ Flag: "Silence plausibly explained by factors other than support."**
          *   3.4 Opportunity? Were public hearings held widely advertised? Unknown. ⚠️ If unsure, **Flag: "⚠️ Opportunity for opposition expression unclear."** *But the ❌ flags are decisive.*
      *   **Result: ❌ FAIL - Recommend removal of "silent majority/support" claim or adding specific positive evidence.**

  ---

  **Where the Procedure Breaks Down (Be Explicit):**

  1.  **Judgment Thresholds:** The procedure *forces transparency* about where judgment is needed (e.g., "Is 52% 'substantial'?", "Is 40% turnout 'low'?", "Is this alternative explanation 'plausible'?"). It *cannot make the final call* on these thresholds – that's a political/value judgment for the legislator. Your role is to *identify and document* the ambiguity.
  2.  **Conflicting Legitimate Constructions:** Sometimes multiple methods exist (e.g., a narrow vote *is* an aggregation method, even if weak). The procedure flags claims that *fail* a specific method they implicitly rely on or lack evidence for *any* method, but it cannot adjudicate *between* valid competing constructions (e.g., "Does this poll or that vote better reflect 'will'?"). Flag if *no* valid construction is demonstrable.
  3.  **"Manufactured Consent":** While Step 2 (Type 2, Step 2.4 - Campaign Clarity) touches on this by flagging misinformation, the procedure can't *prove* consent was manufactured, only note factors that *undermine the legitimacy* of the vote as an expression of will.
  4.  **Ultimate Legitimacy:** This is a *vetting* procedure for *structural soundness*, not a truth machine. A claim passing the checklist is *defensible* based on clear evidence and method. It does *not* guarantee the claim is philosophically unchallengeable or that the method used is the "best" one – that's beyond the scope.

  **Defending Your Work:** Focus on the **specific structural weaknesses** identified by the flags ("The claim asserts a specific preference without citing evidence," "A 51% vote is too narrow to claim an unambiguous mandate," "Silence alone is not evidence of support"). Frame it as ensuring claims are **accurately supported and not misleading**, not as a political opinion. Point to the defined group, the construction method implied, and the lack of supporting evidence or problematic context. Your supervisor asked for a logic check – this provides exactly that.
