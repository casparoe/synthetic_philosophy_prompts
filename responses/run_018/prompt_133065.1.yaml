prompt: |-
  In evolutionary debunking debates I keep noticing a particular asymmetry, and I am unsure whether it has a specific name. A debunker explains a first-order moral belief—say, that harming the innocent is wrong—by tracing it to evolutionary pressures that promoted cooperation, and takes this origin story to undermine the belief’s justification, on the grounds that those pressures do not track moral truth. Then, in the same argument, the debunker explains why people resist the debunking conclusion—perhaps by saying that maintaining shared norms is adaptively valuable—without treating that second explanation as undermining belief in evolutionary theory itself, or the normative premise that we ought to avoid unjustified beliefs. The evolutionary mechanism is wielded as a debunker for moral content, but treated as a neutral, truth-tracking account when applied to epistemic or psychological responses; I have seen versions of this pattern in discussions of incest taboos and of fairness norms. Is there an established concept for this selective deployment—where evolutionary explanation discredits beliefs in one domain yet is left untouched in the adjacent domains that support the argument? If not, how exactly would you distinguish it from a generic self-defeat problem and from ordinary explanatory pluralism, and what boundaries would you draw around the phenomenon?
reasoning: |-
  Okay, the user is pointing out an asymmetry in evolutionary debunking arguments. Let me start by understanding their core concern. They notice that debunkers use evolution to explain moral beliefs, claiming that such origins undermine their justification. But when those same debunkers explain why people resist debunking—say, by appealing to adaptive benefits of maintaining norms—they don't apply the same reasoning to evolutionary theory itself or the normative premises about justified belief. The user wants to know if this selective use has a specific name and how to distinguish it from related issues.

  First, I need to recall key terms in metaethics. The main concepts here are the selective genealogical critique and the self-defeat objection. The selective part is crucial. The debunker targets moral beliefs but exempts their own premises. The user mentions examples like incest taboos and fairness norms, so the pattern is recurring. 

  Next, distinguishing from self-defeat. The self-defeat problem questions whether evolutionary debunking undermines itself. But the user is focused on the asymmetry within the debunker's argument, not the broader self-application. So it's more about internal inconsistency in the debunker's methodology.

  Explanatory pluralism is another angle. The debunker might argue that different domains have different truth-tracking mechanisms. But why assume evolution tracks truth in epistemology but not in ethics? That's where the burden of proof lies. The user wants clarity on how to set boundaries around this phenomenon.

  I should also consider the user's possible deeper needs. They might be engaging in academic writing or debate, needing precise terminology to critique debunking arguments effectively. They might seek a framework to challenge this asymmetry without resorting to broad self-defeat claims. Providing distinctions and possible defenses helps them anticipate counterarguments.

  Key points to cover: the asymmetry's name (selective genealogical critique/skeptic's wager), how it differs from self-defeat (internal vs. global), and boundaries like domains affected and debunker's burden. Highlighting necessary distinctions between domains and truth-tracking capacities is essential. Also, mentioning how debunkers like Joyce or Street handle this could add context.
answer: |-
  This is a sharp observation of a genuine and philosophically significant asymmetry in evolutionary debunking arguments (EDAs). While there isn't one universally agreed-upon *name* for this specific selective deployment, it is widely recognized as a core problem and discussed under several closely related concepts:

  1.  **The Self-Defeat Objection (Specific Form):** This is the most direct label. The asymmetry *is* often presented as a form of self-defeat. The core complaint is that the debunker's *method* of using evolutionary explanations to debunk specific beliefs (moral ones) cannot itself be exempted from the same kind of scrutiny without special pleading or an arbitrary double standard. If evolutionary forces distort our belief-forming faculties concerning morality, why wouldn't they also distort our faculties concerning evolution itself or the norms of rationality/justification used in the argument? Applying the debunking principle consistently seems to undermine the debunker's own premises.

  2.  **Selective Skepticism / Selective Genealogical Critique:** This highlights the *selectivity* itself. The debunker applies the genealogical critique (explaining belief via non-truth-tracking causes) selectively to the target domain (morality) while refusing to apply it with equal force to the domains supporting the argument (science, epistemology). It's a charge of inconsistency in applying their own skeptical principle.

  3.  **The Problem of Undermining the Underminer / Debunking the Debunker:** A more informal way to describe the consequence of the asymmetry. If the evolutionary explanation for resisting debunking is sound but doesn't threaten belief in evolution/epistemology, it potentially undermines the debunker's claim that evolutionary explanations *in general* are undermining for the *target* beliefs.

  4.  **The Tu Quoque ("You Also") Challenge:** While not a formal name for the phenomenon, the asymmetry invites this retort: "You are using an explanation that, by your own standards, should also undermine your *own* justifying beliefs!"

  **Distinguishing it from Related Concepts:**

  *   **Generic Self-Defeat Problem:**
      *   **Generic:** Asks whether applying the debunker's *entire argument* globally undermines itself. "If all beliefs formed via evolution are unjustified, then this belief (EDA) itself is unjustified."
      *   **This Asymmetry:** Focuses specifically on the *inconsistency within the debunker's presentation*. The debunker *explicitly* uses an evolutionary explanation for resistance to debunking *without* taking it to undermine the scientific/epistemic premises, while simultaneously using a structurally similar evolutionary explanation *to* undermine moral beliefs. It highlights the *selective application* of the undermining principle *within the argument itself*, revealing a potential double standard or unmotivated exemption for the debunker's foundational beliefs. It's a more targeted critique of the argument's internal structure.

  *   **Explanatory Pluralism:**
      *   **Explanatory Pluralism:** Is the *positive view* that different domains (e.g., physics, biology, ethics) require different types of explanations and may involve different kinds of facts. It's a meta-position about explanation.
      *   **This Asymmetry:** Is a *critique* leveled *against the debunker*. The debunker *presupposes* a form of pluralism by treating the evolutionary explanation as undermining for moral facts but *not* for scientific/epistemic facts. The challenge is: **What justifies this differential treatment?** Why is the evolutionary origin undermining for *this* domain but not *that* one? Explanatory pluralism might be the debunker's *defense* against the asymmetry charge ("Science *can* track mind-independent truth; morality cannot"), but the asymmetry points out that the debunker *owes an argument* for why the domains differ in their susceptibility to evolutionary debunking. Simply *assuming* the difference without argument *is* the arbitrary move.

  **Boundaries of the Phenomenon:**

  The core phenomenon occurs when:

  1.  **Genealogical Explanation as Undermining:** An explanation for belief-formation in Domain X (e.g., morality), highlighting non-truth-tracking causes (e.g., evolution, culture, emotion), is offered as a reason to think beliefs in X are unjustified or false.
  2.  **Genealogical Explanation as Neutral/Supporting:** An explanation for belief-formation in Domain Y (e.g., science, epistemology, psychology), potentially involving the *same type* of non-truth-tracking causes (e.g., evolution, cognitive biases), is offered *within the same argument*, but this explanation is *not* taken to undermine beliefs in Y or the normative principles used in the argument.
  3.  **Lack of Justified Distinction:** There is no clear, non-question-begging argument provided within the debunking framework itself for why the genealogical explanation is undermining for X but not for Y. The distinction appears arbitrary or relies on assumptions favorable to the debunker's desired conclusion.

  **Key Boundaries:**

  *   **Domains Involved:** The asymmetry is most potent when Y includes the very domains necessary to *support* the debunking argument against X (epistemology, science, logic) or the explanation for resistance to the argument (psychology).
  *   **Type of Explanation:** The undermining force hinges on the explanation emphasizing *contingent, selective pressures* rather than *truth-tracking* mechanisms. The critique questions why the same types of causes are taken to preclude truth-tracking in X but not in Y.
  *   **Not Merely Different Mechanisms:** The debunker might argue science *has* truth-tracking mechanisms (e.g., perception, experimentation, logic) that morality lacks. But the asymmetry challenge pushes back: Why think evolution *allowed* reliable truth-tracking mechanisms for science/epistemology to develop, but *didn't* (or *couldn't*) for morality? Or, why think the evolutionary explanation for *resisting debunking* doesn't cast doubt on our ability to reliably assess truth-tracking mechanisms? The debunker needs to provide a plausible evolutionary or epistemological story for this difference that doesn't itself rely on dubious assumptions. Prominent debunkers like Sharon Street ("Darwinian Dilemma") and Richard Joyce ("The Evolutionary Debunking of Morality") explicitly grapple with this asymmetry, attempting to argue that our cognitive faculties *are* reliable for factual beliefs but *not* for moral ones, precisely because of the differing evolutionary pressures.

  **In essence:** The asymmetry you've identified is the **Selective Application of Genealogical Critique** or the **Skeptic's Wager** (betting that evolution tracks truth in *these* domains but not *that* one). It's the core challenge that forces evolutionary debunkers to explain *why* evolution is thought to be truth-tracking for the beliefs underpinning their argument but distorting for the beliefs they target, without begging the question.
