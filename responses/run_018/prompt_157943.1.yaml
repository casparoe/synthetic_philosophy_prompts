prompt: |-
  okay so me and my roommate got into it till like 2am about plato's meno thing — why is knowledge actually better than just being right by luck? i have to run a fifty-minute first-year seminar on tuesday and theyve already read the meno exerpt but not the recollection part in detail. dont explain the answer to me; i need a teaching plan. what order do the pieces have to come in? my roommate thinks i should start with the slave boy geometry scene but i worry that makes students think its about math skills not about belief and justification, so tell me whether to use it and if not what should come first instead. i want the carrying example to be one case that runs through the whole session — it has to show someone with a true belief thats totally accidental, and it also has to clearly lack whatever makes knowledge stable, but without using jargon like safety conditions or modal robustness since they wont know those. also, i want to build toward the idea that knowledge involves a kind of tracking mechanisim that anchors belief to the world, not just paperwork or confidence — thats my niche injection from our argument — so where in the sequence does that idea land and how do i get there without losing them? what misconceptions will they form? im guessing theyll think knowledge is just true belief plus feeling really sure, or that justification is like having a receipt, maybe also that socrates is just saying knowledge is permanent and true belief is temporary — where exactly do i head off each one? and whats one end-of-class check i can use to see if they actually understand why accidental true belief is shakier, not just that they memorized platos line? finally, what part of the recollection theory should i admit im skipping at this level?
