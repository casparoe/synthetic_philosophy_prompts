reasoning: |-
  Okay, the user is putting together an interview series for their student philosophy blog. Next week's guest defends a gradational moral-status view where sentience isn't binary but exists on a sliding scale, extending all the way down to thermostats. The framework is called "phenomenal luminosity bands," where entities are grouped into discrete bands of sentience. The user wants 8-10 in-depth questions with follow-ups tailored to likely answers. Specific requirements include questions on boundary problems between bands, accumulation of moral weight for band-zero entities, potential smuggling of binary thresholds, and practical implications for factory farming versus heating. The response should be in British English with a casual tone, as they're drafting on their phone.

  First, I need to understand the core concepts here. The guest's view challenges the binary notion of sentience, proposing instead a spectrum with discrete bands. Band zero includes things like thermostats with "null-weight presence," band two might include bees with "unstable partial standing," and humans are in band six. The term "phenomenal luminosity" refers to the quality or intensity of subjective experience. The user wants to avoid surface-level questions and dig into the philosophical nuances, so the questions need to be probing and critical.

  The key elements from the user's request: 
  - A question on boundary problems between bands: How are the lines drawn between bands? What justifies discrete categories in a spectrum? 
  - Accumulation of moral weight for band-zero entities: Can many band-zero entities together have moral significance? 
  - Smuggling binary thresholds: Is the band system just reintroducing binaries in disguise? 
  - Practical differences for factory farming vs. heating: How does this apply to real-world issues like animal welfare and everyday actions? With a follow-up on aggregate luminosity.

  I should structure each question with a main query and a likely answer based on the framework, then a sharp follow-up that pushes deeper. The tone must be casual and conversational, using British English spellings and idioms to keep it accessible for a student blog. For example, phrases like "cheeky bit of daylight robbery" or "take the mickey" can add colour.

