  7. **Band-zero null-weight:** Clarify if it's truly zero or minimal. Follow-up on edge cases like simple AI.
  8. **Meta-question on band count:** Why eight bands? Follow-up on flexibility and exceptions.
  9. **Epistemological challenge:** How do we know an entity's band? Follow-up on potential misclassifications.
  10. **Motivation for the view:** End with why this framework matters compared to others.

  For each, I'll ensure the follow-up anticipates the guest's probable response. For instance, if she says bands are based on behavioural markers, I'll ask about counterexamples. Or if aggregate luminosity is key, I'll question computational feasibility.

