prompt: |-
  I'm on a licensing board for protected wildlife and we keep getting submissions asking us to list 'cryptic species' or subspecies as full species, but our legal framework only protects biological species. I need a reusable decision procedure — like a checklist in order — that my team can actually run when a biologist claims two populations are seperate species and deserve seperate protection status. Ground it in the philosophy of taxonomy, not just 'what biologists usually do': cover ring species, asexual lineages, hybrid zones, and cases where DNA and morphology disagree. For each step say what counts as a sufficient answer, where the procedure stops with a 'no', and where it has to hand over to a human because it's a value judgement not a fact. Apply it to three proposals: a ring of salamanders round a valley where the end populations don't interbreed, a coral that looks identical to its neighbour but has partial gene flow, and a researcher pushing to split an asexual lizard population — the last one should be a case where your procedure gives an answer they won't like. Write it in British English please, and don't ask me for bibliographies — I can't search them up from here.
reasoning: |-
  Okay, the user is on a licensing board for protected wildlife and needs a decision procedure to evaluate when populations should be classified as separate species under their legal framework. The legal framework only protects biological species, not subspecies or cryptic species. They want a checklist grounded in taxonomy philosophy, covering complex cases like ring species, asexual lineages, hybrid zones, and DNA-morphology disagreements. They also want it applied to three specific proposals.

  First, I need to recall the philosophical foundations of species concepts. The Biological Species Concept (BSC) is central here because the legal framework specifies "biological species," which typically means reproductive isolation. But there are other concepts like the Phylogenetic Species Concept (PSC) and Ecological Species Concept (ESC). The user mentioned cases where DNA and morphology disagree, so I should address how different evidence is weighted.

  The user emphasized avoiding "what biologists usually do" and focusing on philosophy. So, the procedure must explicitly reference philosophical underpinnings. For example, the BSC relies on reproductive isolation as the key criterion, while PSC focuses on evolutionary independence. The procedure should start with BSC since the law mentions "biological species," but also acknowledge where other concepts might conflict, leading to value judgments.

  Next, structuring the decision procedure. It should be a step-by-step checklist with clear stopping points. Each step needs to specify sufficient answers, where it stops with a 'no', and where human judgment is required. Key cases to cover:
  - **Ring species**: Here, populations form a ring where adjacent ones interbreed but ends do not. Under strict BSC, the ends are separate species, but intermediates complicate it. The procedure should determine if the terminal populations exhibit reproductive isolation without gene flow.
  - **Cryptic species with gene flow**: Morphologically identical but genetically distinct with partial gene flow. BSC might not classify them as separate if gene flow occurs, but PSC could. The procedure needs to assess if gene flow prevents evolutionary independence.
  - **Asexual lineages**: Since no interbreeding, BSC doesn't apply. Here, the law might not protect them as species, leading to a 'no'. The user wants an example where the answer is unfavorable to the researcher, so this is key.

  The procedure must handle conflicts between data types. For instance, DNA suggests splits but morphology doesn't, or vice versa. The steps should prioritize reproductive isolation but also consider other evidence when isolation is ambiguous.

  Applying to the three proposals:
  1. **Salamander ring species**: Terminal populations don't interbreed. Step 1 checks reproductive isolation—confirmed. Step 2 looks for gene flow—absent between ends. Step 3 assesses reproductive barriers—present. Should be approved as separate species.
  2. **Coral with partial gene flow**: Morphologically identical but genetically distinct. Step 1—no reproductive isolation due to gene flow. Step 4 checks evolutionary independence—partial gene flow means not fully independent. Human judgment needed on significance, but likely a 'no'.
  3. **Asexual lizard**: No sexual reproduction. Step 1—inapplicable. Moves to asexual assessment. The law requires biological species, which typically involve reproduction. Thus, not qualifying as per legal definition. Researcher won't like this, as it highlights a gap in protection for asexual species.

  For the checklist, each step must be clear:
  - Start with reproductive isolation (BSC core).
  - If absent, check for evolutionary independence via other means (PSC/ESC).
  - Asexual cases directly fail under BSC, so the procedure should reflect that the law doesn't cover them, even if they're evolutionarily distinct.
  - Where evidence conflicts, e.g., DNA vs. morphology, the procedure should require human judgment on which concept to prioritize, based on conservation goals.

  The user is likely frustrated with frequent submissions pushing for splits based on non-BSC criteria. The procedure should protect the board from arbitrariness by grounding decisions in taxonomy philosophy, specifically aligning with the legal definition. Also, highlighting where value judgments are necessary (e.g., significance of gene flow) prevents overstepping into policy-making.

  Underlying needs: The board needs a defensible, consistent method to avoid ad-hoc decisions. They might face pressure from researchers using genetic data to advocate for more protections. The procedure should legally insulate the board by sticking to the "biological species" definition, even if it excludes deserving cases like asexual species, thus prompting potential legal reform discussions.

  Finally, using British English: terms like "criteria" vs. "criterion," "judgement" with 'e', and avoiding American spellings. Ensure the language is formal yet accessible for a bureaucratic context.
answer: |-
  ## Reusable Decision Procedure for Species Status Evaluation  
  *Grounded in Taxonomy Philosophy & Aligned with "Biological Species" Legal Framework*  
  *(British English Version)*  

  ### Philosophical Grounding  
  Your legal mandate centres on the **Biological Species Concept (BSC)**, which defines species as *"groups of interbreeding natural populations that are reproductively isolated from other such groups"* (Mayr, 1942). This is distinct from:  
  - **Phylogenetic Species Concept (PSC)**: Focuses on shared evolutionary history/monophyly.  
  - **Ecological Species Concept (ESC)**: Defines species by ecological niche.  
  - **Morphological Species Concept (MSC)**: Relies on physical distinctiveness.  
  **Your procedure must prioritise BSC criteria** (reproductive isolation), as law trumps academic debate. Other concepts may inform *if* BSC evidence is ambiguous.  

  ---

  ### Decision Procedure: Step-by-Step Checklist  
  **Objective:** Determine if populations qualify as *separate biological species* under BSC.  
  **Stopping Rules:** Proceed to next step only if prior step is unresolved. Stop at any "NO" outcome.  

  1.  **Evidence of Current Reproductive Isolation?**  
      *   **Check:** Is there direct evidence (field/experimental) that populations *do not interbreed in nature* OR produce *non-viable/infertile hybrids* when sympatric?  
      *   **Sufficient for "YES" (Separate Species):** Documented absence of interbreeding/gene flow in sympatry, OR consistent hybrid inviability/sterility.  
      *   **Stop with "NO":** Populations demonstrably interbreed freely in sympatry with fertile offspring.  
      *   **Handover to Human:** Isolation suspected but evidence indirect (e.g., allopatric populations). *Proceed to Step 2.*  

  2.  **Evidence of Gene Flow in Sympatry/Parapatry?**  
      *   **Check:** Where populations meet (sympatry/parapatry), is there genetic evidence (e.g., microsatellites, SNPs) of *ongoing, biologically significant gene flow*?  
      *   **Sufficient for "NO" (Not Separate Species):** Significant, consistent gene flow detected (Fst < 0.2 often indicates weak isolation; adjudicate significance cautiously).  
      *   **Stop with "YES" (Separate Species):** Genomic evidence shows *no* effective gene flow despite proximity (strong barriers).  
      *   **Handover to Human:** Gene flow is *low, intermittent, or asymmetric*. *Proceed to Step 3.*  

  3.  **Assessment of Reproductive Barriers**  
      *   **Check:** Are there identified *pre-zygotic* (temporal, behavioural, mechanical isolation) or *post-zygotic* (hybrid breakdown) barriers *in nature*?  
      *   **Sufficient for "YES" (Separate Species):** Multiple, strong, documented barriers preventing gene flow effectively.  
      *   **Sufficient for "NO" (Not Separate Species):** Barriers absent, weak, or easily overcome.  
      *   **Handover to Human:** Barriers exist but are *incomplete or context-dependent* (e.g., only partial hybrid inviability). *Proceed to Step 4.*  

  4.  **Evolutionary Independence Assessment (BSC Proxy)**  
      *   **Check:** If reproductive isolation is ambiguous, does *other evidence* (phylogenetics, ecology, morphology) strongly indicate *long-term evolutionary independence*? (e.g., deep genetic divergence without gene flow, distinct niches with adaptive divergence).  
      *   **Sufficient for "YES" (Separate Species):** Compelling, congruent evidence from *multiple* lines (e.g., genetics + ecology) showing independence *despite* ambiguous isolation. *Requires Human Judgement on strength.*  
      *   **Sufficient for "NO" (Not Separate Species):** Evidence shows recent divergence, ongoing adaptation without isolation, or primary divergence is morphological only.  
      *   **Handover to Human:** Evidence *conflicts* (e.g., deep DNA split but no ecological/morphological divergence + gene flow). *Board must weigh concepts (PSC vs BSC vs ESC) – a policy/value judgement.*  

  5.  **Asexual/Uniparental Lineages**  
      *   **Check:** Does reproduction involve *no genetic recombination* (e.g., obligate parthenogenesis, strict selfing)?  
      *   **Sufficient for "NO" (Not a Biological Species):** By definition, BSC *cannot apply* as there is no "interbreeding". Lineages are clones or uniparental.  
      *   **Stop Here:** Outcome is **NO** under BSC. *Note: Conservation merit is a separate policy issue.*  

  ### Special Case: Ring Species
  *   **Procedure:** Treat terminal populations as per Steps 1-4.
  *   **Key Question:** Are the terminal populations reproductively isolated *from each other* (Step 1) and/or is there *direct gene flow between them* (Step 2)? Ignore connectivity via intermediates for terminal-terminal assessment.
  *   **Sufficient for "YES":** Terminal populations meet isolation/gene flow criteria *directly*.
  *   **Handover to Human:** If intermediates complicate sympatry assessment between terminals.

  ---

  ### Application to Proposals

  **Proposal 1: Salamander Ring Species Around Valley**  
  *   **Step 1:** Terminal populations do not interbreed where ranges overlap (sympatry). *→ YES (Separate Species), STOP.*  
  *   **Justification:** Direct evidence of reproductive isolation satisfies BSC. Ring structure is irrelevant to the terminal-terminal interaction under BSC. **OUTCOME: APPROVED (Separate Species).**

  **Proposal 2: Cryptic Coral ("Identical" Morphology, Partial Gene Flow)**  
  *   **Step 1:** No direct evidence of isolation (allopatric?).
  *   **Step 2:** Genetic data shows *partial, asymmetric* gene flow (e.g., Fst = 0.15). → *Handover to Human (Step 3).*
  *   **Step 3:** No documented pre/post-zygotic barriers. → *Handover to Human (Step 4).*
  *   **Step 4:** Deep mitochondrial DNA divergence but nuclear introgression; no measurable ecological divergence. Morphology identical. *Conflicting evidence.*  
  *   **Human Judgement Required:** Partial gene flow and lack of barriers suggest **incomplete evolutionary independence under BSC**. Morphology alone is insufficient. PSC argument (mtDNA) conflicts with BSC (gene flow). **OUTCOME: REJECTED (Not Separate Species under BSC).** *Value Note: Protection may still be warranted for "Evolutionarily Significant Units" if policy allows.*

  **Proposal 3: Splitting an Asexual Lizard Population**  
  *   **Step 1:** Does not apply (no interbreeding possible).
  *   **Step 5:** Confirmed obligate parthenogenesis. → **NO (Not a Biological Species), STOP.**  
  *   **Outcome:** **REJECTED (Not Separate Species).**  
  *   **Researcher's Dissatisfaction Explained:** The procedure *must* follow the legal definition ("biological species"). BSC fundamentally excludes asexual lineages. While PSC/MSC might support splitting clones into "morphospecies" or based on genetic distance, this falls outside your mandate. *Value Judgement Highlight:* This outcome exposes a *policy gap* in protection for asexual taxa, but the board cannot redefine "species" beyond the legal framework.

  ---

  ### Key Procedural Notes for Your Board  
  1.  **Burden of Proof:** Lies entirely with the submitter to provide evidence for each step.  
  2.  **Value Judgements:** Explicitly minuted when the procedure requires handover (e.g., "Board determined low gene flow was biologically insignificant based on X").  
  3.  **"Cryptic Species":** Legally irrelevant unless BSC criteria (reproductive isolation) are met. Genetic divergence ≠ species status under BSC.  
  4.  **Hybrid Zones:** Treat as evidence *against* strong reproductive isolation (Step 2/3) unless hybrids are consistently unfit.  
  5.  **DNA vs. Morphology Conflict:** DNA suggests divergence; morphology suggests gene flow. Prioritise evidence of *actual interbreeding/gene flow* (BSC) over divergence metrics (PSC) unless isolation is proven.  
  6.  **Subspecies:** Automatically fail Step 1 (by definition, interbreed) unless new evidence shows isolation.  

  This procedure ensures decisions are **replicable, legally defensible, and philosophically grounded** in the BSC mandated by your framework, while transparently identifying points requiring policy-level value judgements.
