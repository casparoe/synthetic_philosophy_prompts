prompt: |-
  Hey — I'm a journalist who covers science and ideas, and I'm running a 90-minute work-shop Tuesday for data-journalism interns on historical objectivity. Specificaly I want to walk them through Ranke's old idea that archives can show how things actually happened, then Carr's pushback that every history is selection, then Hayden White's point that narrative form shapes the past before facts even speak. Don't explain the debate to me; I need the teaching plan.

  Start your answer with the bottom line in the first sentence, then the reasoning, no preamble, and don't restate the question. American English only, please. I need the dependancy order: what has to come before what, especially the jump from sources exist to sources need interpretation to interpretation isn't arbitrary but gets shaped by narrative tropes. For the carrying example I'm thinking the Paris Commune archives — tell me if that's wrong and what it must have and lack. Map the misconceptions: I bet they'll think Ranke means zero bias, White means history is fiction, and they might conflate Carr with postmodern relativism. Tell me exactly where in the sequence to head off each one. Give me the end check that proves they grasp the source-to-narrative dependancy, not just the names. And say clearly what's too deep for this session — I don't want them leaving with half-baked White tropology. There's a typo or two in my ask but you get it.
reasoning: |-
  Okay, the user is a science journalist preparing a workshop on historical objectivity for data-journalism interns. They want a structured teaching plan covering Ranke, Carr, and Hayden White, with clear dependency order and misconceptions addressed. 

  First, I need to map the core dependency chain: starting with Ranke's archival positivism (sources as objective truth), then Carr's critique of selection bias (sources needing interpretation), and finally White's narrative tropes (how form shapes facts). The Paris Commune archives could work as a case study here - they're rich but fragmented, requiring selection and vulnerable to narrative framing.

  Key misconceptions to preempt: 
  - Ranke doesn't mean zero bias (correct that when introducing him)
  - White isn't saying history is fiction (emphasize during narrative exercise)
  - Carr isn't a postmodern relativist (clarify during his section)

  For the Paris Commune example, it must show: 
  - Archival abundance (police reports, newspapers etc.) 
  - But also gaps (missing working-class perspectives) 
  - And how narrative shapes interpretation (framing as chaos vs. revolution)

  The end check should force application: give them a primary source and have them identify Ranke/Carr/White implications. Skip deep tropology - just show narrative shapes facts, don't classify archetypes.

  Timing breakdown:
  - Ranke (20 mins) 
  - Carr (25 mins) 
  - White (30 mins) 
  - Wrap-up (15 mins)

  Most importantly - they must leave understanding that narrative isn't just packaging, but constitutive of historical meaning. That's the north star.
answer: |-
  Here's the 90-minute teaching plan with dependency order, misconception fixes, case example, and clear scope limits:

  **Bottom Line:** Structure the workshop to progress from Ranke's archival faith to Carr's selective interpretation to White's narrative construction, using the Paris Commune archives to show each layer's dependence on the prior, while preempting key misconceptions at specific points.

  **Dependency Order & Timing (Total: 90 min):**

  1.  **Ranke (20 min):**  
      *   **Core Idea:** Introduce Ranke's "wie es eigentlich gewesen" — archives reveal objective truth.  
      *   **Activity:** Show tangible Paris Commune sources (police reports, Communard posters, photos). Emphasize Ranke's belief these *are* reality.  
      *   **Preempt Misconception:** Explicitly state Ranke aimed for rigor, NOT "zero bias"; he acknowledged historian skill but believed sources neutrally contained truth. Flag his era's limitations (e.g., archives reflected state power, missing worker voices).  
      *   **Dependency Start:** Establishes "sources exist as objective evidence."

  2.  **Carr (25 min):**  
      *   **Core Idea:** Carr argues history is selection — facts are chosen by the historian based on present concerns. Archives don't speak for themselves.  
      *   **Activity:** Use the *same* Commune sources. Ask: "Which facts here would *you* prioritize for a 1970s social history vs. a 1900s military history?" Highlight gaps (e.g., women's roles, suppressed perspectives).  
      *   **Preempt Misconception:** Clarify Carr is NOT postmodern relativist. Stress: Facts *exist* (Ranke), but their *significance* requires interpretation based on the historian's position and questions. Selection ≠ invention.  
      *   **Dependency Step:** Requires Ranke's "sources exist" but shows "sources *need* interpretation (selection)."

  3.  **White (30 min):**  
      *   **Core Idea:** White argues interpretation is shaped *before* analysis by pre-existing narrative tropes (Romance, Tragedy, Comedy, Satire). Form dictates content.  
      *   **Activity:** Present 2 short paragraphs on the Commune's suppression: One framed as "Tragic Martyrdom," one as "Necessary Order Restoration" — using *identical facts*. Have interns identify the trope and how it shapes meaning.  
      *   **Preempt Misconception:** Emphasize White does NOT mean "history is fiction." Stress: Tropes are deep structures shaping *how* facts are organized/emphasized *within* the bounds of evidence (Carr's selected facts).  
      *   **Dependency Culmination:** Requires Carr's "interpretation is needed" but shows "interpretation is shaped by narrative form."

  **Paris Commune Example Must Have/Lack:**  
  *   **Must Have:** Abundant, diverse primary sources (official reports, opposition pamphlets, images, eyewitness accounts) to satisfy Ranke's premise *and* enable Carr's selection exercise. Clear gaps/perspectives missing (e.g., peasant views, destroyed records) for Carr. Inherently polarizing event for White's tropes.  
  *   **Must Lack:** A single, definitive "objective" narrative. Must allow competing valid interpretations based on source selection and framing.

  **End Check for Grasp (10 min):**  
  *   Give interns a *new*, short primary source excerpt (e.g., a diplomatic cable about the Commune).  
  *   Ask: "Identify one concrete fact (Ranke), explain one way its significance depends on selection/context (Carr), and suggest one narrative trope (White) that *could* shape its use in a history, explaining *how*."  
  *   **Why it Proves Grasp:** They must extract a fact (source), analyze its contingent meaning (interpretation), and link it to narrative structure (form shaping content) — demonstrating the dependency chain.

  **What's Too Deep (State Explicitly):**  
  *   Skip in-depth tropology (Romance, Tragedy, etc.). Only introduce the *concept* that tropes exist and shape framing.  
  *   Avoid White's full metahistorical arguments or linguistic determinism.  
  *   Don't delve into postmodern relativism debates beyond clarifying Carr/White aren't claiming "anything goes."  
  *   Keep the focus on the source → selection → narrative dependency, not broader philosophy of history.
