  Here is the poem, structured to enact the tension of compound predicates and bare terms, followed by the requested contextual note:

  **The Naming Gate**

  The form holds steady at the gate.
  A thing entire, a shape complete.
  The keeper asks for what's innate:
  The essence gathered, pure and neat.
  The color divides the herd outside.
  A dapple grey, a chestnut flank.
  The boundary drawn, the choice applied,
  To sort the mass, to thin the rank.

  The form holds fast against the claim
  That "white" defines what "horse" implies.
  A single word ignites the flame;
  The gate stays shut to compromised ties.
  The color divides the shadowed ground
  Where "horse" as concept starts to fray.
  The named specifics gather round,
  Demanding entry, come what may.

  The color divides within the gate.
  The form holds fractured, split apart.
  Is "white horse" one, or two in state?
  The question pierces to the heart.
  The form holds... the color divides...
  Like snow on stone, the compound strains.
  The essence struggles, shifts, and hides
  Beneath the weight of naming chains.

  ---

  **Contextual Note for the Seminar:**

  *   **Settled Aspects:** Gongsun Long's "White Horse Dialogue" is a core text of the School of Names (Mingjia), active during the Warring States period. The text presents a deliberate, paradoxical argument ("A white horse is not a horse") designed to probe the relationship between names (ming) and realities (shi). It is generally accepted as a serious philosophical exploration of language and logic, not merely sophistry.
  *   **Genuinely Contested Interpretations:** Scholarly debate remains vigorous regarding the *primary* philosophical target:
      *   **Universals/Attributes:** Is it about the relationship between a universal ("horseness") and its attributes ("whiteness"), arguing they are distinct entities? (A Platonic/realist reading).
      *   **Reference/Extension:** Is it primarily about how compound names ("white horse") refer to a different, narrower set of objects than the simple name ("horse"), thus altering the extension? (A more nominalist/logical reading).
      *   **Rhetoric/Performance:** Is the paradox primarily a tool to expose inconsistencies in common language use or a performative act demonstrating the power and pitfalls of naming itself?
      *   **Metaphysics:** Does it imply a specific ontology where compound objects are fundamentally different from their components?
  *   **Where the Poem Takes Liberties (Predication Emphasis):** This poem strongly favors the **"compound predicates split the extension of the bare term differently"** reading. It frames "horse" (the bare term) as asserting a unified form/essence/extension ("the form holds") and "white" (the added predicate) as introducing division/differentiation/sorting ("the color divides"). The structural manipulation of the refrains (separation, swap, entanglement) directly enacts this reading's core tension: the bare term asserts identity/stability, the compound term disrupts it by narrowing focus, and the relationship is ultimately unresolved conflict ("strains," "struggles," "shifts," "hides"). This interpretation is a prominent and philosophically rich one, but it is *not* the only valid reading. The poem implicitly treats "horse" as a relatively stable universal concept whose extension is fractured by the addition of "white," which foregrounds the predication and extension issue over, say, a purely rhetorical or metaphysical reading focused on the nature of compound objects themselves. The "gate" imagery leans into the extension/application consequence central to this reading.
