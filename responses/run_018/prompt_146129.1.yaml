  First, I need to recall the core tenets of each theory. Epistemicism claims vagueness is due to ignorance—there's a sharp boundary we just don't know. Supervaluationism sees vagueness as semantic indecision, where multiple precisifications are possible, leading to truth-value gaps in borderline cases.  

  For part (1) on epistemicism: Regulators would indeed have to treat every borderline organism as definitively belonging to one category or the other, even if unknowably. This could force arbitrary-seeming decisions with ethical costs—like misclassifying a quasi-native organism as invasive, leading to unnecessary destruction. The theory's "hidden determinacy" might clash with procedural fairness, as decisions appear random without justification.  

  For part (2) on supervaluationism: Since it denies sharp boundaries, regulators can't appeal to a "true" category. But they could adopt a default rule (e.g., provisional exclusion from protection) based on practical principles like precaution or burden of proof. The challenge is justifying this without smuggling in ontological claims—perhaps by framing it as a normative choice about risk allocation rather than fact-discovery.  

  For part (3) on generational drift: Epistemicism insists there's a precise (but hidden) generational threshold where the organism flips categories, making drift irrelevant—each organism is judged discretely. Supervaluationism, however, embraces extended indeterminacy: as traits gradually shift, a range of generations would be borderline, and cumulative decisions might need clear rules (e.g., "grandfathering") to avoid arbitrariness.  

  The user seems to want a clear, conceptual breakdown—no citations, just reasoning from first principles. They're likely a philosopher, policymaker, or biologist grappling with real regulatory dilemmas. Their unspoken need might be understanding how abstract theories can inform concrete decisions, especially when outcomes affect ecosystems or ethical norms. I should emphasize practical tensions: epistemicism's rigor versus its potential for unfairness, supervaluation's flexibility versus its justification gaps.  

  I'll structure the response to directly address each query while linking back to the core commitments of each theory, keeping it concise but thorough. The ethical stakes—like misclassification leading to ecological harm—should underscore why these philosophical distinctions matter beyond academia.
answer: |-
  The dispute between epistemicism and supervaluationism has profound implications for institutional categorization of borderline synthetic organisms, particularly regarding statutory classifications like "native" or "invasive" where vagueness is metaphysical (reflecting genuine indeterminacy in the world).

  **(1) Epistemicism & Its Practical Costs:**  
  Epistemicism, committed to a sharp but unknowable boundary, *does* require regulators to assign every organism to one determinate category (native or invasive), even when traits are genuinely intermediate/unstable. This is because the view holds that one predicate *must* be true and the other false, regardless of our ignorance.  
  **Practical/Ethical Costs:**  
  - **Arbitrary Enforcement:** Decisions appear arbitrary and lack public justification, as regulators cannot cite objective reasons for placing a borderline case in one category over the other.  
  - **Procedural Unfairness:** Identical borderline cases *could* receive opposite classifications (due to inconsistent decisions across time/agencies) without violating the theory (the hidden boundary exists but is inaccessible).  
  - **Moral Hazard:** Regulators might mask uncertainty by overfitting evidence to *any* classification, undermining transparency.  
  - **Ecological Risk:** Misclassification (e.g., destroying a quasi-native organism mislabeled invasive) could harm biodiversity or ecosystem stability, with no epistemic recourse to acknowledge error.

  **(2) Supervaluationism & Justifying Default Rules:**  
  Supervaluationism denies sharp boundaries and accepts truth-value gaps: borderline cases are neither determinately native nor determinately invasive across all admissible precisifications.  
  **Can it justify a default rule (e.g., provisional exclusion)?**  
  - **Yes, but procedurally, not ontologically:** The theory *can* support a default rule (like exclusion from protected status) based on **normative principles external to ontology**, such as:  
    - **Precautionary Burden:** Assigning protected status requires affirmative proof of determinacy (i.e., consensus across precisifications). Borderline cases fail this, justifying exclusion.  
    - **Avoiding Harm:** If invasive misclassification risks ecological damage (e.g., eradication), erring toward exclusion minimizes irreversible harm.  
    - **Administrative Efficiency:** Default rules reduce decision costs without claiming ontological correctness.  
  - **Key Limitation:** The justification *cannot* claim the organism is "really" invasive or non-native; it must frame the rule as a pragmatic response to indeterminacy. The rule operates *despite* the lack of fact, not because of it.

  **(3) Cumulative Generational Drift:**  
  *Scenario:* Sequential modifications shift an organism incrementally from clearly native to clearly invasive traits across generations.  
  - **Epistemicism:**  
    - **Discrete Threshold:** There *is* a precise generation (Gₓ) where the organism switches categories.  
    - **Regulatory Implication:** Each generation must be assessed independently. Gₓ is invasive, Gₓ₋₁ is native—even if indistinguishable. Regulators must search for Gₓ (futilely, as it’s unknowable), risking catastrophic reclassification (e.g., loss of protection) at an arbitrary point.  
  - **Supervaluationism:**  
    - **Extended Indeterminacy:** A range of generations (Gₘ to Gₙ) are borderline, with no fact about when the category changes.  
    - **Regulatory Implication:**  
      - Generations in the borderline range lack determinate status.  
      - Institutions *must* adopt **conventional thresholds** (e.g., "Change status after ≥70% invasive traits persist for 3 generations") to avoid arbitrariness.  
      - Precedents matter: Early classifications constrain later ones to avoid sorites contradictions (e.g., if Gₖ is native, Gₖ₊₁ cannot be invasive if indistinguishable).  
      - **Grandfathering** may be necessary: Once classified native, borderline descendants retain status until clearly invasive, preventing disruptive reclassifications mid-drift.

  **Conclusion:**  
  - **Epistemicism** forces binary decisions with hidden arbitrariness, risking unjustifiable harm and procedural illegitimacy.  
  - **Supervaluationism** permits flexible, precautionary rules but requires transparent conventions to manage indeterminacy, especially in dynamic cases like generational drift. Both frameworks highlight that institutions cannot avoid normative choices when regulating metaphysical vagueness—epistemicism by masking them, supervaluationism by exposing them.
