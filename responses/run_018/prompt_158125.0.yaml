  We are mapping Chalmers' two-dimensional semantics to programming concepts, specifically:

  - Primary intension: static type-checking (compile-time evaluation)
  - Secondary intension: runtime resolution (in the actual world)

  Chalmers' zombie argument: 
    - A zombie is a being physically identical to a conscious being but lacking consciousness. 
    - Chalmers argues that zombies are conceivable, and from this, he infers that consciousness is not logically supervenient on the physical.

  We'll restate using the given vocabulary:

  1. **Zombie scenario**: 
     - At compile-time (primary intension, static type-checking), we can conceive of a "program" (a physical system) that, when run in a counterfactual runtime environment, does not produce consciousness (despite being physically identical to one that does in the actual world). 
     - This is like having a type that, at compile-time, we can see could be instantiated in two different ways: one that has consciousness and one that doesn't, even though the physical structure (the "code") is the same.

  2. **Two-dimensional framework**:
     - **Primary intension (static type-checking)**: 
          - This is about what is conceivable at compile-time. We can define a type `PhysicalState` that, when evaluated in a counterfactual runtime (a different possible world), might not have the property `Consciousness`. 
          - So, the primary intension of "consciousness" is a function from a runtime environment (a world) to a truth value for that environment.

     - **Secondary intension (runtime resolution in the actual world)**:
          - In the actual world, when we run the program (the physical system) we observe that it has consciousness. 
          - The secondary intension is fixed by the actual runtime: in the actual world, the physical state is associated with consciousness.

  3. **Conceivability of zombies**:
     - At the static level (primary intension), we can have two different evaluations of the same physical type: one in which it is conscious (in the actual world) and one in which it is not (in a zombie world). 
     - This is analogous to having a type `PhysicalState` that, when instantiated in the actual world, has the property `Consciousness`, but when instantiated in an alternative world (with different runtime rules) does not. 
     - The conceivability is like having a type that passes static checks for both possibilities (so the static type system doesn't rule out the zombie scenario).

  Now, the residue report:

  **Parts that survive as type-theoretic claims**:
  - The distinction between static (compile-time) and dynamic (runtime) is fundamental in programming. The idea that static analysis might not capture all runtime behavior is analogous to primary intension (what we can conceive) not determining secondary intension (what actually happens in the actual world).
  - The conceivability of zombies maps to the static type system allowing a program that, when run in a non-actual runtime, behaves differently (lacks consciousness) than in the actual runtime. This is a valid type-theoretic idea: the same code might behave differently in different environments (e.g., due to different global variables, different system libraries, etc.).

  **Parts that require distortion**:
  - Consciousness as a property: In programming, we don't have a direct analogue of consciousness. We might map it to a property like "outputs a specific token" or "enters a certain state", but that's a simplification.
  - The idea of "physical identity" in the zombie scenario: In programming, we can have two systems that are syntactically identical (same source code) but run in different environments and thus have different behaviors. However, in the actual world, the environment is fixed. The distortion is that in philosophy, the physical world is the entire system, whereas in programming, the environment is separable from the code. We have to think of the entire runtime as the "world", including all external factors.
  - The necessity of the connection: In philosophy, the question is whether consciousness necessarily supervenes on the physical. In programming, we can always imagine an environment that breaks the connection (e.g., by having a different implementation of the same interface). But in the actual world, we have one fixed environment.

  **Parts with no analogue**:
  - The intrinsic quality of consciousness (qualia) has no direct analogue in type theory. We can talk about functional behavior (input-output) but not subjective experience.
  - The idea of metaphysical possibility: In programming, we can simulate any environment, so we can create any counterfactual. But in philosophy, there is a debate about what is metaphysically possible (not just logically or conceptually). Our type system is about logical possibility (what we can express without contradiction) but not metaphysical constraints.

  **Dimensional Collapse in Modal Typing**:

  The phrase "dimensional collapse" is not a standard term in two-dimensional semantics (as per Chalmers). However, in modal logic and type theory, we have:

  - **Modal typing**: Type systems that incorporate modalities (necessity and possibility). 
  - **Two-dimensional modal logic** distinguishes two kinds of necessity: 
      - A priori (logical) necessity (primary intension) 
      - Metaphysical necessity (secondary intension).

  In some systems, when the two dimensions align (for example, when a statement is both primarily and secondarily necessary), we might say that the two dimensions collapse. But Chalmers does not use the term "dimensional collapse". 

  Where might you have encountered it?
