  - But if you don't get two negatives, you might run out of chips and be forced to take the tail risk anyway.
  - This mirrors fanaticism: the huge upside of the tail risk means that even a small chance dominates, and uncertainty (not knowing the true probability) means we are drawn to it. But our epistemic humility (we know we might be wrong) leads us to investigate, but the investigation is costly and might not provide clear evidence, leading to either paralysis (we spend all resources and are forced to act) or reckless commitment (we skip investigation and act).
  - The investigation here is like "checking": we are compulsively checking to reduce anxiety, but it might not help and might leave us worse off (because we end up taking the tail risk anyway after spending attention).
  - Note: the chip economy is a metaphor for limited attention. In real life, the cost of investigating tail risks (e.g., in time, effort) might be high, and the outcomes might involve moral distances (like helping strangers) that we don't feel as viscerally. So the game doesn't capture the full moral weight.

  Warnings for first run:

  1. Hoarding: Some players might not spend chips and just take safe. That's okay, but they miss the point. Encourage them to think about EV. Or they might take tail risk without investigation. That's reckless but rational by prior EV.

  2. Group collusion: Players might want to share signals. Prohibit communication.

  3. Time: The game might run long. Set a timer per player? Or let them play simultaneously and call you when they want to investigate. But with 8 players, you might be busy. Have a signal (like raising hand) for when they want to investigate.

  4. Understanding Bayesian updating: Some players might not know how to update. You can provide a chart with the posterior probabilities for common signal sequences? But that might be too much. Alternatively, in the debrief, explain the math.

  5. The outcome of tail risk might be disappointing: they might choose tail risk and get 0. That's part of the lesson.

  6. Some players might spend all chips and then be forced to choose. They might feel frustrated. That's the paralysis.

  7. The numbers might be too abstract: use a story. For example, safe option: save 100 people in your city. Tail risk: if state Good, 10% chance to save 10,000 people (in the world); if state Bad, 0.1% chance to save 10,000 people. The investigation is like sending scouts to get information about the global situation.

  8. The signal: positive signal means the scouts report that the global situation is promising for the intervention; negative means they report it's not.

  This should work.
answer: |-
  Below is a complete design for your 90-minute graduate workshop activity. It uses physical tokens to simulate the tension between expected value (EV) fanaticism and epistemic humility, with a focus on how uncertainty about tail probabilities amplifies the urge to "chase" them. The game forces players to choose between investigation (which consumes attention and may lead to paralysis) and reckless commitment (betting on tails without due diligence). The debrief links this to the fanaticism debate, emphasizing how EV "weaponizes" uncertainty.

  ---

  ### **Game Title:** *The Compulsive Oracle*
  **Duration:** 30-40 minutes (setup, gameplay, outcome resolution)  
  **Players:** 8 students (individual play, no collaboration)  
  **Materials Needed:**  
  - **Tokens:** 80 chips total (10 per player). Use coins, beads, or paper clips.  
  - **Signal Decks:** Two decks of cards per player (16 decks total):  
    - *Deck A (Good State):* 8 "Positive" cards, 2 "Negative" cards.  
    - *Deck B (Bad State):* 2 "Positive" cards, 8 "Negative" cards.  
  - **State Assignments:** 8 sealed envelopes (one per player), each containing a slip: "Good State" (50% of envelopes) or "Bad State" (50%).  
  - **Payoff Cards:** For tail-risk choices: Pre-rolled outcome cards (see below).  
  - **Player Sheets:** For tracking signals and decisions (simple template: "Signals Received: ____, Chips Left: ____, Final Choice: ____").  

  ---

  ### **Game Setup**
  1. **Assign States:** Randomly give each player one sealed envelope (do not open). This is their unknown "state" (Good or Bad).  
  2. **Distribute Materials:** Each player gets:  
     - 10 chips (attention budget).  
     - Two private signal decks (Deck A and Deck B), corresponding to their state (they don’t know which deck matches their state).  
     - A player sheet.  
  3. **Pre-Roll Outcomes (Facilitator):** For players assigned "Good State," pre-roll a 10-sided die once: **Win** on 1 (10% chance), **Lose** on 2-10. For "Bad State," pre-roll three 10-sided dice: **Win** only if all three are 1 (0.1% chance), **Lose** otherwise. Record outcomes on payoff cards (e.g., "Tail Risk Outcome: Win 10,000 points" or "Lose: 0 points").  

  ---

  ### **Rules**  
  Players act simultaneously. On their turn, they choose one action:  

  1. **Investigate (Cost: 3 chips):**  
     - Draw one card from *both* signal decks (Deck A and Deck B).  
     - The facilitator reveals which deck matches their state (e.g., "Your state is Good, so Deck A is active").  
     - The card drawn from the *active* deck is their signal (Positive/Negative); the other is ignored.  
     - **Noise:** Signals are imperfect (Good state: 80% Positive; Bad state: 80% Negative).  
     - Record the signal. Chips are deducted.  

  2. **Choose Safe (Cost: 0 chips):**  
     - Immediate payoff: **100 points** (e.g., "Save 100 lives locally"). Game over for player.  

  3. **Choose Tail Risk (Cost: 0 chips):**  
     - Reveal payoff card: **10,000 points if Win** (e.g., "Save 10,000 lives globally"), **0 if Lose**. Game over.  

  **Paralysis Rule:** If a player runs out of chips (or has <3 chips and can’t investigate), they **must** choose Safe or Tail Risk immediately.  

  ---

  ### **Payoff Matrix**  
  | **Option**      | **Probability of Win** | **Payoff (Points)** | **EV (Prior)** |  
  |------------------|------------------------|---------------------|----------------|  
  | **Safe Choice**  | 100%                   | 100                 | 100            |  
  | **Tail Risk (Good State)** | 10%                   | 10,000              | 1,000          |  
  | **Tail Risk (Bad State)**  | 0.1%                  | 10,000              | 10             |  
  - **Prior EV of Tail Risk:** 50% Good State (EV 1,000) + 50% Bad State (EV 10) = **505 points** (dominates Safe without investigation).  
  - **EV After Signals:** Updating happens post-investigation (e.g., one Negative signal drops EV to ~208; two Negatives drop EV to ~68, below Safe).  

  **Scaling Rationale:**  
  - Safe is locally reliable but modest. Tail risk is remote, astronomically high-stakes, but uncertain.  
  - EV dominates (505 > 100) only if players **don’t investigate** (due to chip cost). Investigating reduces EV by consuming attention, creating tension.  

  ---

  ### **Game Flow**  
  1. **Briefing (5 mins):** Explain rules, payoffs, and the paralysis/recklessness trade-off. Emphasize: *"Your attention is scarce. Chase the big win, but you might regret not looking closer."*  
  2. **Gameplay (15-20 mins):** Players act at their own pace. Facilitator circulates to:  
     - Reveal active decks during investigations.  
     - Enforce chip limits and paralysis rule.  
  3. **Outcome Resolution (5 mins):** Players reveal choices and outcomes. Discuss surprises (e.g., "Who chose Tail Risk and won? Who investigated but got paralyzed?").  

  ---

  ### **Debrief (20-30 mins)**  
  **Core Link:** Map gameplay to EV fanaticism’s "weaponization of uncertainty."  

  1. **The Pull of Fanaticism:**  
     - Without investigation, tail risk dominates by EV (505 > 100). This mirrors real-world EV reasoning: tiny probabilities of massive payoffs (e.g., x-risk mitigation) swamp modest certainties.  
     - *Key point:* Players feel the urge to chase tails not from greed, but from **unavoidable EV math**.  

  2. **Epistemic Humility as an Accelerant:**  
     - Uncertainty about tail probabilities (Good vs. Bad state) makes tails *more* compelling. Investigating consumes attention but returns noisy signals—updating often *preserves high EV* (e.g., one Negative: EV=208 > 100).  
     - **Weaponized Uncertainty:** Players who investigate but don’t get "clear" signals (e.g., two Negatives) run out of chips. They’re forced into Tail Risk *anyway*—the very bet they doubted. This mirrors how EV fanaticism turns doubt into a reason to chase tails *harder*: "If I’m uncertain, I can’t rule out a high-payoff scenario, so I must pursue it."  
     - Compulsive checking emerges: Players burn chips seeking "certainty" that rarely comes, escalating commitment.  

  3. **Paralysis vs. Recklessness:**  
     - **Paralysis:** Players who exhaust chips (e.g., 3+ investigations) achieve nothing. Analogous to real-world "analysis paralysis" in longtermist projects (e.g., over-modeling asteroid impacts while ignoring tractable aid).  
     - **Recklessness:** Players who skip investigation "win" if tails are Good but lose if Bad. Reflects fanaticism’s gamble: it works until it doesn’t (e.g., betting on unvetted tech for climate salvation).  
     - *Highlight:* Both outcomes are suboptimal. Investigation *feels* rational but often leads to the same reckless bet with fewer resources.  

  4. **Limitations of the Metaphor:**  
     - **Moral Distance:** The chip economy can’t capture the true weight of "astronomical stakes" (e.g., 10,000 lives vs. real-world extinction). Stress that EV’s abstraction risks desensitizing us to tail risks’ moral gravity.  
     - **No Real Zero:** In life, inaction has costs (unlike the game’s paralysis = forced choice). EV fanaticism may undervalue "boring" safe options.  

  ---

  ### **What Will Go Wrong (First-Run Warnings)**  
  1. **Chip Hoarding:** Risk-averse players may skip investigation *and* avoid Tail Risk, taking Safe immediately. This misses the tension.  
     - *Mitigation:* Remind them that EV favors Tail Risk (505 > 100). Ask: "If you ignore the tail, are you sure it’s not irrational?"  
  2. **Group Collusion:** Players may share signals or strategize together.  
     - *Mitigation:* Enforce silence. Emphasize: "This is about your personal dilemma."  
  3. **Misinterpreting Signals:** Players may struggle with Bayesian updating (e.g., thinking one Negative = Bad state).  
     - *Mitigation:* Post-game, walk through an example (e.g., "One Negative means EV=208—still bet on tails!").  
  4. **Time Overruns:** Simultaneous play may cause facilitator bottlenecks.  
     - *Mitigation:* Use a visible timer. Have players "queue" for investigations by raising hands.  
  5. **Frustration with Noise:** Players who get "misleading" signals (e.g., Good state with two Negatives) may resent the game.  
     - *Lean in:* This is the point! Debrief: "Uncertainty isn’t a bug—it’s why EV fanaticism is so seductive and dangerous."  

  ---

  This activity creates visceral tension: players *feel* the compulsive chase of tails and see how epistemic humility fuels it. The physical tokens make abstract EV trade-offs concrete, setting up a rich debate on fanaticism’s limits. If you adapt it, lean into the chaos—the "failures" are teachable moments!
