  Could you write a joke that plays on exactly that tension? Like, the cannibals being confused about whether Montaigne is praising them or just using them as a rhetorical stick to beat Europeans, and Montaigne being confused about whether he's a relativist or not. Make it actually funny, not just a philosophy lecture with a punchline at the end, and please don't just have him say "barbarism is not my custom" as the whole gag. Also, since this leans on a pretty contested interpertation of whether Montaigne was genuinely relativist or just strategically rhetorical, could you add a quick note after the joke separating what's settled about his essay from what's genuinely contested, and flagging where the joke takes liberties with the text or sides with one reading?
