  Here's a joke playing on that specific interpretive tension in Montaigne's "Of Cannibals," followed by the requested clarification:

  **The Scene:** Montaigne is interviewing a Tupinambá chief (Chief Arakú) through a translator after a lavish (vegetarian) feast Montaigne hosted to learn about their customs. Montaigne has just finished explaining his "barbarism isn't my custom" point and then contrasted it with European torture practices.

  **CHARACTERS:**
  *   **MONTAIGNE:** Earnest, slightly flustered, clutching his notes.
  *   **CHIEF ARAKÚ:** Calm, observant, deeply thoughtful.
  *   **TRANSLATOR:** Trying their best, slightly weary.

  **(Montaigne finishes passionately condemning European torture methods as worse than Tupinambá practices.)**

  **TRANSLATOR:** (To Arakú) *The hairy little man with the weak eyes says... our way with captured enemies is... natural? Like birds eating worms? But his own people... they do things to living men that make even the jaguar god look away. He seems... angry? At his own people?*

  **CHIEF ARAKÚ:** (Nods slowly, stroking his chin) *Hmm. Interesting. So, he uses *our* customs... like a sharpened stick... to poke his own people? Because they are being... bad?*

  **TRANSLATOR:** (To Montaigne) *The Chief understands your criticism of your own people. He asks if you are using us as a... moral weapon? Against Europeans?*

  **MONTAIGNE:** (Startled, drops a quill) *A weapon? Non! Pas du tout! I merely observe! I describe! Who am I to judge? One custom is no better than another! Relativity! Perspective!*

  **TRANSLATOR:** (To Arakú) *He says he is not judging. He says no custom is better. He calls it... 'Relativity'.*

  **CHIEF ARAKÚ:** (Raises an eyebrow) *Truly? No judgment? Then... his anger at his own people's 'worse' torture? That is... not judgment? That is... just... description? Like describing the color of the river?*

  **TRANSLATOR:** (To Montaigne) *The Chief is... confused. If you truly believe no custom is better, how can you call your people's torture 'worse'? Isn't that judgment?*

  **MONTAIGNE:** (Sweating slightly, mopping his brow) *Well... yes... no... it is... complex! Observe: Their torture causes greater suffering! It is... objectively... more cruel! One must acknowledge basic human... feeling! Compassion! Surely that transcends...*

  **CHIEF ARAKÚ:** (Leans forward, eyes gleaming with gentle irony) *Ah! So...* **that** *is your custom? This 'compassion'? And judging cruelty as 'worse'? That is the custom *you* bring from across the big water? Tell me, little hairy man... is judging cruelty 'worse'...* **your** *barbarism?*

  **(Montaigne stares, mouth slightly open. The Translator sighs, contemplating early retirement. Arakú smiles serenely and gestures for more fruit.)**

  ---

  **Academic Clarification: What's Settled, Contested, and Where the Joke Takes Liberties**

  1.  **Settled:**
      *   **Critique of Europe:** Montaigne *definitely* uses the Tupinambá as a rhetorical device to criticize European practices (religious wars, torture, greed, hypocrisy). This is the essay's primary thrust.
      *   **Definition of Barbarism:** His opening point that "each man calls barbarism whatever is not his own custom" is a foundational relativist observation about ethnocentrism.
      *   **Limited Relativism:** Montaigne does *not* advocate for pure, anything-goes relativism. He clearly finds certain European practices (like torture during religious wars) morally repugnant and *worse* than Tupinambá practices he describes.

  2.  **Contested (The Core Tension):**
      *   **Nature of the "Worse" Judgment:** This is the heart of the debate. Does Montaigne's condemnation of European torture as "worse" than cannibalism:
          *   **(a) Undermine his opening relativism?** Is it hypocrisy or inconsistency, revealing an unstated universal standard (e.g., minimizing suffering)? (This leans towards your friend's view).
          *   **(b) Exist *within* a sophisticated relativism?** Is he using a standard *internal* to European claims (Christian charity, Stoic reason) to show their hypocrisy, or pointing to a *minimal* universal human sentiment (aversion to excessive cruelty) that even the "barbarians" arguably display more consistently? (This leans towards your view). Or is it **strategic rhetoric**, using the shock value of the comparison to jolt Europeans without fully committing to a philosophical system?

  3.  **Where the Joke Takes Liberties / Sides:**
      *   **Anachronism & Compression:** The joke compresses complex arguments into a single, comedic conversation. Montaigne likely formed his views over time, not in one awkward chat.
      *   **Cannibal Perspective:** We have *no idea* what the Tupinambá thought of Montaigne or his arguments. The joke imagines them as philosophically astute to create irony.
      *   **Siding with the Interpretation:** The joke **heavily leans into interpretation (b)**. It highlights the *tension* Montaigne creates. Arakú directly points out the apparent contradiction: How can Montaigne claim "no judgment" while simultaneously making a strong comparative moral judgment ("worse")? The punchline ("is judging cruelty 'worse'... *your* barbarism?") brilliantly flips the script, using Montaigne's *own* initial definition of barbarism against his implied universal moral claim about cruelty.
      *   **The "Confusion":** The joke portrays Montaigne as genuinely flustered by this tension, embodying the interpretive debate about whether he was inconsistent or operating on a deeper level. It doesn't resolve it but finds humor in the logical knot.

  **In essence, the joke dramatizes the contested heart of the essay:** Can Montaigne consistently hold *both* that judgment is ethnocentric ("barbarism isn't my custom") *and* that some practices are objectively "worse"? Arakú's final question exposes this tension as the central, and perhaps intentionally provocative, puzzle Montaigne left for his readers.
