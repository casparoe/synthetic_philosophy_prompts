answer: |-
  The distinction between legend and history isn't primarily an evidence threshold. It hinges on a narrative becoming an "underdetermined substrate": specific enough to anchor collective identity, yet sufficiently vague or flexible to resist definitive falsification. This creates a murky zone where competing versions fade not through decisive proof, but because *one* narrative becomes socially indispensable – cultural infrastructure. "History," then, is often just the label slapped onto a legend once it stops being widely contested and starts doing essential cultural work.

  Consider the **Trojan War**. Homer's tale provided Greeks with a foundational myth of pan-Hellenic heroism and identity. Its details (gods, superhuman feats, Helen's face) were unfalsifiable precisely *because* they were poetic and non-literal. Yet, the core – a great siege at Troy – was specific enough to feel real and unifying. Rival accounts existed, but the Homeric version prevailed not because archaeology confirmed it (it couldn't, for centuries), but because it served as crucial cultural glue, defining Greekness against the "barbarian" East. Its endurance made it "history" long before Schliemann dug.

  **King Arthur** perfectly embodies this substrate. Is he a Romano-British warlord, a mythical Celtic hero, or a Norman propaganda tool? The narrative core – a noble king uniting Britain against invaders with loyal knights – is identity-defining. Yet, the specifics (Excalibur's magic, Camelot's location, Merlin's prophecies) are beautifully underdetermined. Geoffrey of Monmouth’s version didn't triumph due to evidence; it offered the Norman conquerors a legitimising British pedigree and later served English and Welsh nationalism. The *usefulness* of Arthur as a symbol of British unity smoothed away contradictions, transforming contested legend into foundational "history."

  The **Exodus** narrative is perhaps the starkest example. As a story of divinely orchestrated liberation forging a people, it's phenomenally potent for Jewish and later Christian identity. However, its core events (plagues, mass migration, Sinai) leave minimal, ambiguous archaeological traces. The narrative thrives *because* its divine elements and miraculous scale place it beyond ordinary verification or falsification. Rival origin stories or scholarly doubts don't dislodge it; its power lies in its function as the bedrock of communal self-understanding and covenant. Its acceptance as "history" within the tradition stems from its irreplaceable role as cultural infrastructure, not corroborative proof.

  In each case, evidence accumulation is secondary. What matters is the narrative achieving that sweet spot: specific enough to bind identity ("*We* are the heirs of Troy/Avalon/the liberated slaves"), but sufficiently underdetermined to absorb challenges ("Well, the *gods* intervened," "The *true* location is lost," "It wasn't *literally* 600,000 men"). Rival versions fade when one iteration becomes too socially useful – too foundational for law, art, politics, or faith – to discard. At that point, we stop calling it contested legend and start calling it "history." The label signifies not proven fact, but cultural ratification: the narrative has graduated to become indispensable societal bedrock.
