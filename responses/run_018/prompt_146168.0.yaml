prompt: |-
  I'm on the research ethics board at our university hospital and we have to decide on a policy for the new radiology AI that outputs sentences like "I think this nodule is benign but I'm not sure." The vender says removing that language hurts clinician trust. One board member argues that since the AI has no beliefs, attributing them is decietful; another says Dennett's intentional stance lets us treat it as having beliefs for prediction, so the language is fine. But I want the memo to go deeper: there's a middle position about functional belief attribution where we treat the system as having beliefs only relative to a specific interpretive framework that includes error-correction norms, not just predictive success. Please draft the memo recommending whether we should mandate removal of belief-language, allow it with disclaimers, or require a different framing altogether. Include the strongest argument for letting the language stand, and address whether the intentional stance collaspes into mere convenience or carries normative weight for disclousure. We need a decision by next weeks meeting.
