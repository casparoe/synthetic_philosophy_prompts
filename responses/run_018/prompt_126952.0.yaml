  This challenges the idea that all pleasures share a common quality. The user is pointing out that the experiential qualities (how things feel) don't align with the valence (good/bad). So the pleasure-pain boundary seems arbitrary when looking at actual experiences. 

  They mention existing philosophical discussions about pleasure not being uniform, but they feel their observation is more specific. They want to know if there's a term for this mismatch between qualitative similarity and valence categorization. They also want to avoid conflating it with mixed pleasures or pleasure as absence of pain. 

  First, I need to unpack their core argument. They're saying that the category "pleasure" groups diverse experiences just because they're positive, even if some share more sensory qualities with negative states. Simultaneously, it separates experiences that feel similar but have different valences. This creates a taxonomy problem where valence overrides phenomenology. 

  Looking at philosophy, Bentham's utilitarianism treats pleasure as homogeneous, but Mill argued for qualitative differences. However, neither addressed the user's point about cross-valence similarities. Rachels' heterogeneity of pleasure comes close but doesn't explicitly discuss valence-experience misalignment. 

  The user's observation is distinct because it highlights that valence categories (pleasure/pain) cut across phenomenological families. For example, the sprint burn (positive) is phenomenologically closer to embarrassment (negative) than to sun-warmth (positive). This isn't just about diversity within pleasure but about valence being a poor classifier for experiential resemblance. 

  Possible terms: "Valence-Qualia Misalignment" seems apt. "Valence" captures the good/bad dimension, "Qualia" the subjective feel, and "Misalignment" the mismatch. This distinguishes it from mixed pleasures (which blend good/bad in one experience) and hedonistic monism (which denies qualitative differences). 

  The user also wants clear boundaries. This concept applies when similar qualia have opposite valences, or different qualia share valence. It excludes cases where valence aligns with phenomenology (e.g., all warmth is pleasant) or when experiences are mixed. 

  They might be seeking validation that their nuanced observation isn't just "pleasure is diverse." By naming it, we acknowledge the deeper issue: valence categories may not map to how we experience the world, which could challenge hedonistic ethics that rely on summing pleasures. 

