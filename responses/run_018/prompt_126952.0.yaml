answer: |-
  You've hit on something profound and systematically overlooked. This isn't just about heterogeneity; it's about a fundamental **misalignment between valence (pleasure/pain) and qualia (raw experience)**. Let's build the taxonomy carefully.

  ### Core Insight Breakdown
  1.  **Phenomenological Clusters:** Experiences group based on *how they feel* (qualitative texture): e.g., "warm diffusion" (sun, tired muscles), "sharp/cold resolution" (proof-click, certain epiphanies), "intense somatic strain/burn" (sprint finish, headache, embarrassment), "hollow/quiet relief" (turning down invitation).
  2.  **Valence Assignment:** We label experiences as "pleasant" or "painful" based on *attraction/aversion* or *positive/negative evaluation*.
  3.  **The Misalignment:** Crucially:
      *   Experiences *within the same phenomenological cluster* can have *opposite valences* (e.g., "burn" cluster: sprint finish = pleasant valence, headache/embarrassment = painful valence).
      *   Experiences *with the same valence* can belong to *radically different phenomenological clusters* (e.g., "pleasant" valence: warm sun diffusion vs. sharp proof-click vs. intense sprint burn – they share *no* core "pleasure-feel").
  4.  **The Category Problem:** "Pleasure" acts as a *functional label* ("this feels good/approachable") imposed on experiences that have *no intrinsic phenomenal similarity*. Conversely, experiences sharing deep phenomenal similarity are split into "pleasure" and "pain" based on context/evaluation.

  ### Distinguishing Your Insight from Existing Concepts

  *   **Heterogeneity of Pleasure (e.g., Mill, Rachels):** Acknowledges pleasures differ in *kind* and *quality* (higher/lower, sensory/intellectual). **BUT:** It still assumes all "pleasant" experiences share the *property of being pleasant* (positive valence), distinct from pain. Your point is that *the valence itself* doesn't reliably map to any core phenomenal quality; similar feels can be pleasant *or* painful. Heterogeneity focuses on differences *within* the valence category; you're exposing the *instability of the valence category boundary itself* relative to phenomenology.
  *   **Mixed Pleasures (Plato, Sidgwick):** Acknowledges a single experience can contain both pleasant and painful elements. **BUT:** This assumes identifiable "pleasant" and "painful" *components* within the mix. Your point is that the *very same qualitative feel* (e.g., the "burn") can *be* the pleasure in one context and the pain in another. There's no stable "pleasure component" separable from the qualia *and* its context.
  *   **Pleasure as Absence of Pain (Epicurus):** Defines pleasure negatively. **BUT:** This fails spectacularly with your examples. The sprint burn, proof-click, and sun-warmth are all *positive states*, not mere absences. The "burn" is intensely present, whether pleasant (sprint) or painful (headache). It doesn't feel like the *absence* of anything.
  *   **Valence Realism vs. Anti-Realism:** Debates whether valence is a real, intrinsic property. Your insight suggests **valence is contextually dependent and phenomenologically secondary**, not a primary datum of experience. The "goodness" isn't *in* the feeling the way warmth is *in* the sun-feel; it's an assessment *of* the feeling-in-context.

  ### Naming the Phenomenon: Valence-Qualia Misalignment (VQM)

  This captures the core: a systematic misalignment (*Misalignment*) between the assignment of positive/negative value (*Valence*) and the inherent, raw experiential qualities (*Qualia*).

  *   **Definition:** Valence-Qualia Misalignment (VQM) is the phenomenon whereby:
      1.  Phenomenologically similar qualia can be assigned opposite valences (pleasure/pain) depending on context, evaluation, and functional role.
      2.  Phenomenologically dissimilar qualia assigned the same valence (e.g., "pleasure") share no core experiential property beyond the positive evaluation itself.

  *   **What VQM Includes:**
      *   Cases where the *same* qualitative feel (e.g., intense somatic activation/"burn") is experienced as pleasure *or* pain in different contexts (sprint vs. headache).
      *   Cases where experiences labeled "pleasure" are phenomenologically *more similar* to experiences labeled "pain" (sprint burn ≈ headache) than to other experiences labeled "pleasure" (sprint burn ≉ sun-warmth).
      *   The implication that the category "pleasure" is held together primarily by *functional/attitudinal similarity* (approach/positive evaluation) rather than *experiential similarity*.

  *   **What VQM Excludes (Boundaries):**
      *   **Simple Heterogeneity:** Merely stating pleasures are diverse. VQM requires demonstrating *phenomenological kinship across the valence divide* and *dissimilarity within the valence category*.
      *   **Mixed Feelings:** Experiences containing identifiable pleasant and unpleasant elements simultaneously. VQM focuses on *monovalent* experiences where the *core qualia itself* is ambiguous or valence-switching.
      *   **Absence Theories:** Defining pleasure as lack of pain. VQM acknowledges intense, present-state "positive" feelings.
      *   **Mere Subjectivity/Relativity:** Saying "pleasure is subjective." VQM is a specific claim about the *structure of experience and categorization*, not just individual variation. It identifies a systematic *pattern* of misalignment.
      *   **All Pain is Bad/All Pleasure is Good:** VQM doesn't deny valence exists or matters; it challenges the stability and experiential basis of the categories *as commonly used for summation or comparison*.

  ### Implications for Pleasure-Based Ethics (Hedonism)

  1.  **The Aggregation Problem (Acute Form):** If "pleasures" share no common experiential currency *and* some feel more like pains than other pleasures, summing them quantitatively (Bentham) becomes incoherent. *Can you really add the "units" of sun-warmth and sprint-burn if they feel more dissimilar than a sprint-burn and a headache?*
  2.  **The Comparison Problem:** How do you compare the *value* of pleasures as different as sun-warmth and proof-click? Mill's qualitative hierarchy tries, but VQM shows the experiential gulf is vast, making any common scale (even "higher/lower") phenomenologically dubious. Their "goodness" feels fundamentally *different*, not just different in degree or type.
  3.  **The "What We're Pursuing" Problem:** Hedonism claims we fundamentally desire "pleasure." VQM suggests there's *no single thing* phenomenally corresponding to "pleasure" being pursued. We desire specific *kinds* of experiences (warm diffusion, sharp resolution, intense exertion) *in specific contexts where they feel good*. The "pleasure" label is applied *after*, based on the positive evaluation. We don't desire "pleasure-in-general"; we desire *those specific positive qualia-in-context*.
  4.  **Re-focus on Specific Goods:** VQM pushes towards an ethics focused on the value of *specific kinds of positive experiences* and the *conditions* under which certain qualia become positively valenced, rather than pursuing an abstract "Pleasure." It aligns better with pluralistic theories acknowledging distinct intrinsic goods (e.g., accomplishment, tranquility, aesthetic appreciation) which *generate* diverse positive states, rather than reducing them to a single common denominator.

  In essence, VQM reveals that our taxonomy of "pleasure" is a pragmatic, evaluative overlay on a phenomenological landscape that doesn't naturally respect the pleasure/pain boundary. The sun's warmth and the sprint's burn aren't two kinds of the *same thing* ("pleasure"); they are two fundamentally *different kinds of good feelings*. Recognizing VQM undermines simplistic hedonistic calculi and demands a more nuanced understanding of wellbeing rooted in the diversity and context-dependence of positive experience itself.
