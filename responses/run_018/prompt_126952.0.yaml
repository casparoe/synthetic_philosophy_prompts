prompt: |-
  Right, so I'm trying to think through something about pleasure and I keep hitting this wall. You're a professional philosopher who actually likes conceptual taxomony, so take this slowly and start with a bit of brainstorming before you answer — don't just jump to a label.

  Here's the thing. I notice that if I list stuff I genuinely enjoy, it's all over the place. There's the warm, slow feeling of lying in sun after a swim. There's the sharp, cold click when a proof finally locks together. There's the weird, hollow satisfaction of turning down an invitation I didn't want anyway. And there's the burning, almost painful pleasure of a really hard sprint at the end. Now, none of these share a taste, a temperature, an intensity curve, or even a direction — some pull me in, some push me away from other things, some are active, some are passive. But we still call them all 'pleasures' and philosophers talk about them like they're the same currency you can add up.

  But here's the bit that really messes with me, and I'm not sure if it's part of some standard problem or something else. Some of these so-called pleasures feel closer to pains than they do to each other. The burn at the end of that sprint feels more like the burn of embarrassment or even like a mild headache than it feels like lying in the sun. Meanwhile, lying in the sun feels closer to the dull ache of tired muscles than it does to that sharp proof-click. So the line between pleasure and pain seems to cut across the line between different kinds of pleasure, if you see what I mean? It's like the behaviour of the category 'pleasure' is holding together things that have no experiential family resemblence, and meanwhile splitting apart things that do resemblence each other, just because one is 'good' and one is 'bad'.

  I've heard there's an old philosophical problem about pleasures not being the same kind of thing, but that usually sounds like it's just about them being different from each other. This feels more specific: it's about the good/bad split being less stable than the qualitative boundaries — the way things feel similar to each other doesn't line up with whether they're pleasant or unpleasant. Is there an established name for this exact configuration? And if there isn't, can you coin one and say exactly what it includes and excludes — for instance, is it different from saying that some pleasures are 'mixed', or from the old idea that pleasure is just absence of pain? I don't want a bare label; I want to know where the edges are and what it isn't.

  Think carefully, don't rush to cite stuff I can't check, and if you need to distinguish it from similar moves in pleasure-based ethics, do that explicitly.
