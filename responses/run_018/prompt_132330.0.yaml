  ### Modified Centipede Game Activity Design

  **Conceptual Goal:**  
  Simulate the backward-induction paradox (where rational players "defect" early) without relying on common knowledge of rationality. By assigning hidden reasoning types, players must second-guess opponents' decisions based on beliefs about type distribution, causing cooperation to unravel dynamically. The deterministic BI chain fails, but players experience how uncertainty fractures mutual trust.

  **Materials:**  
  - 12 index cards (for secret type assignments: 4× "M", 4× "O", 4× "F")  
  - 6 game boards (1 per pair; see *Visible Payoff Tree* below)  
  - Scorecards for students (track decisions, payoffs, and opponents)  
  - Whiteboard to display rules and aggregate results  

  **Visible Payoff Tree (Linear, 4 Nodes):**  
  *Players alternate turns. "Take" ends the game and splits the pot; "Pass" continues.*  
  - **Node 1 (Player A):** Take → A:7, B:3  
    Pass → Node 2  
  - **Node 2 (Player B):** Take → A:5, B:15  
    Pass → Node 3  
  - **Node 3 (Player A):** Take → A:18, B:12  
    Pass → Node 4  
  - **Node 4 (Player B):** Take → A:14, B:26  
    Pass → Both:0  

  **Hidden Payoff Modifications (Per Type):**  
  *Added to visible payoff* only if a player chooses "Take". **Not revealed until post-game.**  
  - **Myopic (M):** No bonus/penalty. Values only immediate visible payoff.  
  - **One-Step BI (O):** +5 at **any node** (rewards acting on 1-step foresight).  
  - **Full BI (F):**  
    - Node 1: +20 (rewards "correct" BI starting move)  
    - Node 2: -5 (penalizes "late" defection)  
    - Node 3: -2 (penalizes "late" defection)  
    - Node 4: -5 (penalizes "late" defection)  

  **Example:** An F-type taking at Node 1 gets 7 + 20 = 27; at Node 2 gets 15 - 5 = 10.  

  ---

  ### Facilitator Instructions  
  **1. Setup (5 min):**  
  - Assign types: Shuffle and distribute index cards (students hide their type).  
  - Form 6 pairs randomly. Distribute game boards and scorecards.  
  - Display visible payoff tree. Explain:  
    - "Decide to **Take** (end game, split pot) or **Pass** (continue) at your node."  
    - "Everyone has a hidden type (M, O, or F) affecting *their personal score* if they Take. Types are secret and fixed."  
    - "Goal: Maximize *your total points* across 3 rounds (new opponent each round)."  

  **2. Gameplay (30 min; 3 rounds × 10 min):**  
  - **Per Round:** Pairs play one full game (4 decision nodes max). Players alternate as A/B (swap roles each round).  
  - **Process:**  
    - Start at Node 1. Current player decides **Take** or **Pass** (verbally or written).  
    - If **Take**, record payoffs. If **Pass**, advance node.  
    - Continue until **Take** or Node 4 Pass (both get 0).  
    - Record decisions and *visible* payoffs on scorecards.  
  - **Rotate:** After each round, reassign pairs (ensure new opponents).  

  **3. Post-Game Revelation (10 min):**  
  - Collect types. Reveal all assignments publicly.  
  - Students calculate *hidden payoffs* for **Take** actions:  
    - E.g., An F-type taking at Node 2: 15 (visible) + (-5) = 10 total.  
  - Update scorecards with *total points* (visible + hidden).  

  ---

  ### Debrief (30 min)  
  **1. Map Decisions to BI Logic (15 min):**  
  - **Early Defection (Node 1/2):**  
    - "Who took early? Was your opponent F-type? F-types gain +20 at Node 1, making Take dominant *for them*. If you suspected B was F, you might Pass at Node 1 hoping they’d Pass at Node 2 (to avoid -5 penalty) and let you get 18 at Node 3."  
    - **BI Link:** "Standard BI says Node 1 Take is ‘rational’ (7 > 5). Here, beliefs about F-types can override this—*if* you trust B to Pass, you might too."  
  - **Unexpected Continuation (e.g., Pass at Node 2):**  
    - "Did any B Pass at Node 2? F-types see 15 - 5 = 10, worse than 12 if A Takes at Node 3. If B is F and trusts A to Take, they Pass. But if A is *also* F, they face 18 - 2 = 16 at Node 3 vs. 14 at Node 4—so they Take. This mirrors BI: Node 3 Take is ‘rational’ (18 > 14), enabling Node 2 Pass."  
  - **Key Insight:** "Cooperation collapses not from computing BI but from *fractured beliefs*. E.g., if A doubts B is F, they Take at Node 1. Uncertainty unravels trust node-by-node."  

  **2. Paradox Limitation (5 min):**  
  - "This *cannot* replicate deterministic BI’s common-knowledge chain. Standard BI assumes:  
    (1) All know payoffs,  
    (2) All know everyone is rational,  
    (3) All know *(2)*.  
    Here, hidden types break (1) and (2). I must *tell* you: ‘True BI demands 100% certainty in rationality. Real players lack this—so they gamble on beliefs.’"  

  **3. Predictable Failure Mode (5 min):**  
  - **Prediction:** "Students often reduce this to type-guessing, not induction. E.g., ‘I passed because I guessed B was F’—not ‘I passed because B will Pass if they’re F, and *they* think I’ll Take at Node 3.’ This flattens second-order reasoning."  
  - **Pitfall Example:** "If players fixate on types, Node 3 decisions ignore BI logic. E.g., an F-type A Takes at Node 3 (getting 16) even if passing could yield 14—because they don’t compute B’s Node 4 action."  

  ---

  **Practical Pitfalls & Mitigation:**  
  - **Over-Indexing on Types:** Students may ignore payoffs, treating it as "M/O/F rock-paper-scissors." Mitigate by emphasizing: "Types *modify* incentives; the tree still matters."  
  - **Time Crunch:** 4 nodes × 3 rounds = 12 decisions. Keep rounds brisk; use timers.  
  - **Score Confusion:** Use simplified scorecards (columns: Round, Opponent, Node Taken, Visible, Hidden, Total).  
  - **Debrief Depth:** Focus on 1–2 vivid examples (e.g., a pair that reached Node 4 vs. one that defected early).  

  **Why This Works:**  
  The hidden types inject uncertainty where BI requires common knowledge. Players *feel* the paradox when early defections multiply despite visible incentives to cooperate—miroring real-world trust collapses. The debrief explicitly ties emergent behavior to BI’s failure conditions.
