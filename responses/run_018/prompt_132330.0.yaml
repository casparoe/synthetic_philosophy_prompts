  - Predictable failure mode: students might treat the game as pure type-guessing (e.g., "I think the next player is F-type so I'll pass") rather than induction about the entire game tree. Also, students might not grasp the iterative reasoning about beliefs.

  Materials:
  - Visible payoff tree on a poster or handout.
  - Slips for types.
  - Scoresheets for each student to record: round, opponent, decisions at each node, visible payoff, and then after revelation, hidden bonus and total.
