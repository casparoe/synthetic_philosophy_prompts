prompt: |-
  ok so I'm running these bi-monthly workshops at a community center where we pick one biography and ask what virtue people can actually learn from it, not just admire. I'm trying to adapt something like Plutarch's pairing method but with this twist I call structured defect comparison — you don't learn by copying the hero, you learn by finding the specific failure or limitation (the defect window) structurally tied to the virtue, then comparing that defect across two figures so virtue becomes visible without falling into hagiography. I need a reusable decision procedure my co-facilators can run in about 20 minutes before selecting a text, with questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands to me because it's values not facts. It needs to cover selecting the primary figure, locating the defect window, pairing with a second figure who has a different defect around the same virtue, checking we aren't implying failure is necessary for virtue, and writing the discussion question. Apply it to three cases: (1) a well-known abolitionist whose private letters show serious personal cruelty paired with an obscure local organizer who was kind but ineffective, (2) a religious figure treated mostly as legend with almost no documented failure in the record, and (3) a political leader whose strategic patience required complicity in a harmful policy — I want the procedure to flag or reject this one even though I think we should include them. Mark exactly where judgment can't be eliminated, say what the procedure can't do if the group just wants inspiration not analysis, and make sure one answer is one I won't like.
reasoning: |-
  We are creating a reusable decision procedure for selecting biographies for workshops. The procedure should take about 20 minutes and be run by co-facilitators. It includes steps for selecting the primary figure, locating the "defect window" (the specific failure or limitation tied to the virtue), pairing with a second figure who has a different defect around the same virtue, and then writing a discussion question. We must avoid implying that failure is necessary for virtue.

  The procedure must have:
  - Clear questions in order.
  - What counts as a sufficient answer for each.
  - Where the procedure stops with a "no".
  - Where it hands off to the lead facilitator (you) because it involves values, not facts.

  We will apply the procedure to three cases and mark where judgment can't be eliminated. Also, note what the procedure can't do if the group just wants inspiration, and ensure one answer is one you won't like.

  Structure of the procedure:

  1. **Select Primary Figure**
     - Question: "What virtue is this figure primarily known for demonstrating in a way that is both admirable and complex (i.e., not simplistic)?"
     - Sufficient answer: Must name a specific virtue (e.g., courage, justice) and provide at least one clear example from the figure's life that illustrates this virtue. The example must show the virtue in action in a non-trivial way.
     - If insufficient: Stop. Reason: "The figure must have a clearly identifiable virtue that is central to their story and well-documented."

  2. **Locate the Defect Window**
     - Question: "What specific failure, limitation, or negative consequence (the 'defect window') is structurally tied to the exercise of this virtue in the figure's life? How does this defect reveal the boundaries or costs of the virtue?"
     - Sufficient answer: Must identify a specific defect (e.g., personal cruelty, strategic complicity, a blind spot) that is directly connected to the virtue. The answer must explain how the defect arises from the same traits or circumstances that enabled the virtue. It cannot be a random failing but must be linked.
     - If insufficient (e.g., no defect found, or defect not tied to the virtue): Stop. Reason: "The defect must be structurally tied to the virtue. Without this, we cannot proceed because we risk hagiography."
     - If the defect is not documented (as in case 2: religious figure with no documented failure), then stop and hand off to lead facilitator (you) because it requires a judgment call on whether to proceed without a clear defect or how to handle the lack of documentation.

  3. **Pair with a Second Figure**
     - Question: "Who is a second figure (less known is acceptable) who demonstrated the same core virtue but with a different defect window? What is the contrasting defect?"
     - Sufficient answer: Must name a second figure and identify a defect that is different in kind (not just degree) from the first figure's defect. The defect must also be structurally tied to the virtue in the second figure. The pairing must highlight the virtue by showing two different ways it can be imperfectly realized.
     - If insufficient: Stop. Reason: "The second figure must contrast in the nature of the defect, not just be a lesser example. Without a meaningful contrast, the pairing doesn't serve the purpose."

  4. **Check for Necessity of Failure**
     - Question: "Does our framing imply that the defect is necessary for the virtue? How can we avoid that implication?"
     - Sufficient answer: Must explicitly state that the defect is not necessary and that the virtue can exist without that specific defect. The answer must suggest how the discussion will focus on the conditions that led to the defect and how they might be avoided.
     - If insufficient (if they cannot avoid the implication): Stop. Reason: "We must not teach that failure is required for virtue. If we cannot frame it otherwise, we risk moral confusion."

  5. **Write the Discussion Question**
     - Question: "Write a question that asks participants to compare the two figures' defect windows and extract a practical insight about cultivating the virtue without the defects."
     - Sufficient answer: The question must explicitly mention both figures and their defects, and it must lead participants to think about how to practice the virtue in a way that avoids both defects. It should not be a yes/no question but open-ended.
     - Handoff: If the group struggles to write a balanced question, hand off to lead facilitator (you) because it involves values in framing.

  Where judgment can't be eliminated:
  - In step 2 (Locate the Defect Window): Deciding whether a defect is "structurally tied" to the virtue involves interpretation.
  - In step 3 (Pairing): Choosing a second figure with a different defect window requires judgment about what constitutes a meaningful contrast.
  - In step 4 (Check for Necessity): Avoiding the implication of necessity is a values-based judgment.

  What the procedure can't do:
  - If the group just wants inspiration without analysis, this procedure is not suitable because it requires critical engagement with flaws. The procedure is designed for analysis, not hagiography.

  Now, apply to the three cases:

  **Case 1: Abolitionist with private cruelty vs. obscure kind but ineffective organizer**
  - Virtue: Justice (for the abolitionist) and also justice (for the organizer, but expressed through kindness and community building).
  - Defect for abolitionist: Personal cruelty (e.g., harsh treatment of family or colleagues) tied to their uncompromising stance on justice.
  - Defect for organizer: Ineffectiveness in achieving large-scale change due to a focus on local, kind interactions.
  - Pairing: The contrast is between an abrasive effectiveness and a kind ineffectiveness, both in pursuit of justice.
  - Check necessity: We do not say that justice requires either cruelty or ineffectiveness. We can ask how to be both effective and kind.

  **Case 2: Religious figure treated mostly as legend with almost no documented failure**
  - Step 2: The defect window cannot be located because the record is hagiographic. This step would stop and hand off to you because it requires a judgment call. You might decide to use a different figure, or if you proceed, you might have to infer a defect from the legend (e.g., the virtue of compassion might have led to neglect of their own family, but this is not documented). However, the procedure would flag this as a problem.

  **Case 3: Political leader whose strategic patience required complicity in a harmful policy**
  - Virtue: Strategic patience (waiting for the right moment to achieve a greater good).
  - Defect window: Complicity in a harmful policy (e.g., allowing an injustice to continue for the sake of a long-term goal).
  - Pairing: We might pair with a figure who had the same virtue (strategic patience) but without the complicity? Or a figure who avoided complicity but was ineffective? The procedure requires a second figure with a different defect. However, the issue is that the procedure must flag or reject this case because of step 4 (Check for Necessity). 
    - Why flag? Because the framing might imply that such complicity is necessary for strategic patience. If we cannot avoid that implication (i.e., if we cannot show a way to have strategic patience without complicity in harm), then the procedure stops. And you want it to be flagged or rejected even though you think it should be included. So, in step 4, we would ask: "Does our framing imply that the defect (complicity) is necessary for the virtue (strategic patience)?" 
    - If we say: "Sometimes strategic patience requires complicity in harm," that implies necessity. We must avoid that. Instead, we must frame it as: "In this leader's context, they saw complicity as necessary, but we can explore whether there were alternatives and what conditions might allow for strategic patience without complicity." 
    - If we cannot do that, then the procedure stops. You might override this as lead facilitator, but the procedure flags it.

  One answer you won't like: For case 3, the procedure might stop at step 4 because the co-facilitators cannot frame the discussion without implying that complicity is necessary. So they would reject the figure. But you think they should be included. That's the point of the handoff: if they cannot resolve step 4, they hand off to you, the lead facilitator, for a values-based decision.

  Now, let's write the procedure as a step-by-step guide for co-facilitators.

  ---

  **Structured Defect Comparison: Pre-Text Selection Procedure**

  **Time:** Approximately 20 minutes

  **Instructions:** Co-facilitators should work through these questions in order. For each question, they must achieve a sufficient answer to proceed. If they reach a stop, they should not select the text for the workshop. If they reach a handoff, they should note the issue and hand off to the lead facilitator.

  ---

  **Step 1: Select Primary Figure and Virtue**
  - Question: "What virtue is this figure primarily known for demonstrating in a way that is both admirable and complex (i.e., not simplistic)?"
  - What is sufficient: 
    - A specific virtue named (e.g., courage, justice, compassion).
    - At least one clear, non-trivial example from the figure's life that illustrates the virtue.
  - If not sufficient: Stop. Do not proceed. Reason: "The figure must have a clearly identifiable and well-documented virtue that is central to their story."
  - Judgment note: Minimal judgment here; relies on documented facts.

  **Step 2: Locate the Defect Window**
  - Question: "What specific failure, limitation, or negative consequence (the 'defect window') is structurally tied to the exercise of this virtue in the figure's life? How does this defect reveal the boundaries or costs of the virtue?"
  - What is sufficient:
    - A specific defect identified (e.g., personal failing, negative consequence, blind spot).
    - An explanation of how the defect is directly connected to the virtue (e.g., the same trait that enabled the virtue also caused the defect, or the circumstances of exercising the virtue led to the defect).
    - Note: The defect must be documented or reasonably inferred from reliable sources.
  - If not sufficient: 
    - If no defect can be found, stop. Reason: "Without a defect tied to the virtue, we risk hagiography."
    - If the defect is not tied to the virtue, stop. Reason: "The defect must be structurally tied to the virtue to reveal its boundaries."
    - If the defect is not documented (as in legendary figures), hand off to lead facilitator. Reason: "Requires judgment on how to handle lack of documentation."
  - Judgment note: Deciding structural tie requires interpretation.

  **Step 3: Pair with a Second Figure**
  - Question: "Who is a second figure (less known is acceptable) who demonstrated the same core virtue but with a different defect window? What is the contrasting defect?"
  - What is sufficient:
    - A second figure named.
    - The same core virtue identified in the second figure.
    - A defect in the second figure that is different in kind (not just degree) from the first figure's defect.
    - Explanation of how the defect in the second figure is also structurally tied to their exercise of the virtue.
  - If not sufficient: Stop. Reason: "The pairing requires a meaningful contrast in the nature of the defect to illuminate the virtue."
  - Judgment note: Choosing a second figure and judging the contrast is highly interpretive.

  **Step 4: Check for Necessity of Failure**
  - Question: "Does our framing imply that the defect is necessary for the virtue? How can we avoid that implication?"
  - What is sufficient:
    - Explicit statement that the defect is not necessary for the virtue.
    - A plan for framing the discussion to focus on the conditions that led to the defect and how they might be avoided, without implying that the defect is inevitable.
  - If not sufficient: Stop. Reason: "We must avoid teaching that failure is necessary for virtue. If we cannot frame it appropriately, we risk moral confusion."
  - Handoff: If the co-facilitators are unsure how to avoid the implication, hand off to lead facilitator. Reason: "This involves values-based framing that may require lead facilitator input."
  - Judgment note: This is a values-based step.

  **Step 5: Write the Discussion Question**
  - Question: "Write a question that asks participants to compare the two figures' defect windows and extract a practical insight about cultivating the virtue without the defects."
  - What is sufficient:
    - The question must name both figures and their defects.
    - It must ask for a comparison of the defects and how they relate to the virtue.
    - It must lead to practical insights about avoiding both defects while cultivating the virtue.
    - It must be open-ended (not yes/no).
  - Handoff: If the co-facilitators cannot write a balanced question, hand off to lead facilitator. Reason: "Framing the question involves values and pedagogical goals."

  ---

  **Application to Cases:**

  **Case 1: Abolitionist and Local Organizer**
  - Step 1: Virtue is justice. Example: Abolitionist led successful campaigns against slavery. Sufficient.
  - Step 2: Defect: Personal cruelty in private letters. Tied to virtue: Their uncompromising stance on justice made them harsh in personal relationships. Sufficient.
  - Step 3: Second figure: Local organizer. Virtue: Justice through community building. Defect: Ineffectiveness in creating systemic change. Contrast: Different defect (ineffectiveness vs. cruelty). Sufficient.
  - Step 4: Avoid necessity: We can say that neither cruelty nor ineffectiveness is necessary; we can explore how to be both effective and compassionate. Sufficient.
  - Step 5: Question: "Compare the abolitionist's personal cruelty and the organizer's ineffectiveness. How did each of these defects arise from their pursuit of justice, and what might a path look like that avoids both?" Sufficient.

  **Case 2: Religious Figure (Legend)**
  - Step 1: Virtue, e.g., compassion. Example: Stories of healing and kindness. Sufficient.
  - Step 2: Defect: No documented failure. Hand off to lead facilitator. (You might decide to skip this figure, or to use a different approach, but the procedure flags it.)

  **Case 3: Political Leader with Strategic Patience**
  - Step 1: Virtue: Strategic patience. Example: Waited for the right moment to pass a major reform. Sufficient.
  - Step 2: Defect: Complicity in a harmful policy. Tied to virtue: The patience required tolerating short-term harm for long-term gain. Sufficient.
