    - However, step 4 is the critical one.
  - Step 4: Check necessity. We must avoid implying that complicity is necessary. If we frame it as: "In this leader's case, they believed complicity was necessary, but let's discuss if it was the only way," that might work. But if we cannot avoid implying that it was necessary (e.g., if the historical record shows no alternative), then step 4 is insufficient and we stop. Alternatively, we might hand off to the lead facilitator because it's a values issue. Since you want it flagged, the procedure would stop or hand off at step 4.

  One answer you won't like: For case 3, the procedure stops at step 4 because the co-facilitators cannot find a way to avoid implying that complicity is necessary for strategic patience. Therefore, they reject the figure. But as the lead facilitator, you might override and take it on.

