answer: |-
  Below is a reusable 20-minute decision procedure for your co-facilitators, designed as a step-by-step checklist with clear questions, sufficiency criteria, stop points, handoff triggers, and time allocations. It incorporates your "structured defect comparison" method and addresses your three test cases. **Bold text** marks where judgment cannot be eliminated (due to interpretive or values-based decisions). The procedure rejects purely inspirational goals and includes one outcome you won't like (in Case 3). Total time: 18–20 minutes if answers are concise.

  ---

  ### **Structured Defect Comparison: Biography Selection Procedure**  
  *For co-facilitators (run in 20 min before text selection)*  
  **Goal**: Ensure biographies enable critical virtue analysis, not hero worship. Avoid implying failure is *necessary* for virtue.  

  #### **Step 1: Select Primary Figure and Virtue** (4 min)  
  **Question 1.1**: *"What specific, non-trivial virtue (e.g., courage, justice, patience) is this figure documented to embody through action, not just reputation? Give one concrete example."*  
  - **Sufficient answer**:  
    - Names a virtue (e.g., "abolitionist's relentless justice").  
    - Provides a brief, specific example (e.g., "organized underground railroad rescues").  
    - No vague traits (e.g., "goodness" or "greatness").  
  - **Stop if**: Virtue is purely aspirational (no documented action) or example is trivial. *Reason: Risk of hagiography*.  
  - **Handoff if**: Virtue is values-contested (e.g., "patriotism" in a colonial context). *Reason: Requires lead facilitator's ethical framing*.  

  #### **Step 2: Locate the Defect Window** (5 min)  
  **Question 2.1**: *"What specific, documented failure or limitation (defect) is structurally tied to this virtue? How is it a direct byproduct or cost of exercising the virtue?"*  
  - **Sufficient answer**:  
    - Identifies a defect (e.g., "cruelty to family" or "complicity in harm").  
    - Explains *structural tie*: Defect arises from the same trait/context enabling the virtue (e.g., "abolitionist's justice required ruthless single-mindedness, causing personal cruelty").  
    - Not a random flaw (e.g., "bad temper" unlinked to virtue).  
  - **Stop if**: No defect is documented (e.g., Case 2’s religious figure) or tie is speculative. *Reason: Cannot proceed without evidence-based defect window*.  
  - **Handoff if**: Defect is ambiguous/controversial (e.g., "Was this failure inevitable?"). *Reason: Values debate about blame*.  
  - **Judgment note**: **Deciding "structural tie" requires interpretive judgment** (e.g., Is cruelty a byproduct of justice or just a personality flaw?).  

  #### **Step 3: Pair with Second Figure** (4 min)  
  **Question 3.1**: *"Who is a second figure (obscure is OK) with the same core virtue but a *different* defect? What is their contrasting defect?"*  
  - **Sufficient answer**:  
    - Names a second figure with the same virtue (e.g., "local organizer’s justice").  
    - Contrasting defect is *qualitatively different* (e.g., "ineffectiveness in scaling change" vs. primary’s "cruelty").  
    - Defect is also structurally tied (e.g., "organizer’s kindness prevented systemic impact").  
  - **Stop if**: Defects are too similar (e.g., both "cruel") or pairing exaggerates one figure as "better." *Reason: Contrast must illuminate virtue’s boundaries*.  
  - **Handoff if**: No second figure is known; lead facilitator sources one.  
  - **Judgment note**: **Choosing a "different" defect requires comparative judgment** (e.g., Is "complicity" different enough from "indecision"?).  

  #### **Step 4: Check Necessity of Failure** (3 min)  
  **Question 4.1**: *"Does our framing imply the defect is *necessary* for the virtue? How will we explicitly reject this in the workshop?"*  
  - **Sufficient answer**:  
    - States "No, defect is not necessary."  
    - Plans to emphasize alternatives (e.g., "We’ll ask: ‘Could the virtue exist without this defect? What conditions would help?’").  
  - **Stop if**: Framing implies necessity (e.g., "Strategic patience *requires* complicity"). *Reason: Moral hazard*.  
  - **Handoff if**: Group debates if the defect *was* necessary historically. *Reason: Values-based historical analysis*.  
  - **Judgment note**: **Avoiding "necessity" requires pedagogical judgment** (e.g., How to discuss complicity without normalizing it?).  

  #### **Step 5: Write Discussion Question** (3 min)  
  **Question 5.1**: *"Draft a question comparing both figures’ defects to extract practical insight. Does it force analysis (not admiration)?"*  
  - **Sufficient answer**:  
    - Question compares both defects explicitly (e.g., "How did X’s cruelty and Y’s ineffectiveness each undermine their shared virtue of justice?").  
    - Focuses on actionable insight (e.g., "What personal/systemic changes could avoid both defects?").  
    - Avoids binary praise/blame.  
  - **Handoff if**: Question is too abstract or inspirational (e.g., "What made these heroes flawed?"). *Reason: Requires lead facilitator’s framing for critical edge*.  

  ---

  ### **Procedure Limits & Non-Negotiables**  
  - **Time**: Strict 20-min limit. If steps run long, skip to handoff/stop.  
  - **Cannot do inspiration-only**: Rejects groups seeking pure admiration. *If participants want "motivation," this method is incompatible*.  
  - **Judgment unavoidable**: In **Steps 2–4** (defect ties, pairings, necessity framing). Co-facilitators *must* debate interpretations.  
  - **One outcome you won’t like**: Case 3 (below) triggers a stop—even if you disagree.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Abolitionist (cruel) + Local Organizer (ineffective)**  
  - Step 1: Virtue = "Justice." Example: Abolitionist’s public advocacy. **✓ Sufficient**.  
  - Step 2: Defect = "Private cruelty." Tie: "Relentless justice bred interpersonal ruthlessness." **✓ Sufficient**.  
  - Step 3: Pair = Obscure organizer. Contrast: "Kindness led to ineffectiveness (vs. cruelty)." **✓ Sufficient**.  
  - Step 4: Reject necessity: "Cruelty/ineffectiveness aren’t inevitable; discuss balancing empathy and impact." **✓ Sufficient**.  
  - Step 5: Question: *"Both fought for justice: How did the abolitionist’s cruelty and the organizer’s ineffectiveness each corrupt their goals? What would a ‘middle path’ look like today?"* **✓ Sufficient**.  
  - **Outcome**: Approved.  

  **Case 2: Religious Figure (legendary, no documented failure)**  
  - Step 1: Virtue = "Compassion." Example: "Legends of healing miracles." **✓ Sufficient**.  
  - Step 2: Defect = None documented. **⛔ Stop**. *Reason: No defect window for analysis*.  
  - **Handoff to you**: You might override by inferring a defect (e.g., "neglect of family due to devotion"), but procedure rejects it.  
  - **Outcome**: Rejected by procedure.  

  **Case 3: Political Leader (patience → complicity in harm)**  
  - Step 1: Virtue = "Strategic patience." Example: "Endured short-term compromises for long-term reform." **✓ Sufficient**.  
  - Step 2: Defect = "Complicity in harmful policy." Tie: "Patience required tolerating injustice." **✓ Sufficient**.  
  - Step 3: Pair = e.g., "A reformer who avoided complicity but caused chaos through haste." Contrast: "Rashness vs. complicity." **✓ Sufficient**.  
  - Step 4: **⛔ Stop**. *Reason: Framing implies necessity* (e.g., "Patience inevitably causes complicity"). Co-facilitators cannot resolve without implying harm is a "cost of doing business."  
  - **You’ll dislike this**: Procedure rejects the figure despite your interest. *Handoff to you only if you insist on overriding the stop*.  
  - **Outcome**: Rejected by procedure.  

  ---

  ### **Final Notes for Co-Facilitators**  
  - **When to handoff**: Values debates, contested defects, or if the group resists defect-focused analysis.  
  - **When to stop**: No defect, defects too similar, or necessity framing unavoidable.  
  - **Output**: Either "Approved" (with discussion question), "Rejected," or "Handoff to lead."  
  - **Why this works**: Forces critical engagement with virtues—but **fails for groups wanting "role models."** If inspiration is the goal, use a different framework.  

  This procedure ensures rigor while flagging ethical risks. Use the test cases as training drills for co-facilitators.
