answer: |-
  Here’s a defended research agenda prioritizing your three clusters for limited time/effort, with clear justifications for ordering, tractability, and criteria for re-prioritization:

  ### **Priority Ranking & Justification**
  1.  **Cluster 1: Ex Ante Risk Policies vs. Ex Post Distributions**  
      *Why First?*  
      This is **upstream and foundational**. If the separateness objection *loses force* in ex ante contexts (e.g., small risks imposed on many to prevent near-certain harm to a few), it radically alters the debate’s terrain. Resolving this could:  
      - Defang the objection for vast domains of policy (public health, safety regulation, insurance) where decisions are inherently probabilistic.  
      - Clarify whether "separateness" is fundamentally about *outcomes* or *procedures*. If risk imposition is morally distinct from guaranteed harm, aggregation in policy design becomes more defensible.  
      - Inform Cluster 2: If ex ante aggregation is valid, it may reframe critiques of prioritarianism/contractualism.  
        
      *Tractability*: High for conceptual work. Requires analyzing thought experiments (e.g., "Risk Pool" vs. "Certain Harm" scenarios), developing consistency tests for risk attitudes, and probing the moral difference between statistical lives and identified victims. No empirical data needed initially.  
        
      *Evidence to Change Priority*:  
      - **Demote if**: A compelling argument shows ex ante/ex post is a false distinction (e.g., all ex ante policies collapse into ex post harms for actual individuals upon realization).  
      - **Promote further if**: Formal models demonstrate that rational agents behind a veil of ignorance *would* accept ex ante tradeoffs they reject ex post, revealing the objection as context-dependent.  

  2.  **Cluster 2: Contractualism/Prioritarianism – Solution or Concealment?**  
      *Why Second?*  
      This is **diagnostic but dependent on Cluster 1**. If ex ante aggregation survives the separateness objection, Cluster 2 becomes less urgent for policy (though still philosophically vital). If not, Cluster 2 is essential to salvage non-utilitarian approaches. Key questions:  
      - Does prioritarian weighting ("benefits to the worse off matter more") genuinely respect persons, or is it ad hoc aggregation with a conscience?  
      - Does contractualism (e.g., Scanlon’s "no individual reasonable rejection") *avoid* aggregation or hide it in the "reasonable" criterion?  
      - Are these frameworks *distinctly non-aggregative* or merely constrained aggregation?  
        
      *Tractability*: Moderate. Requires conceptual dissection of "reasonableness" in contractualism and "priority" weights. Must confront paradoxes (e.g., can contractualism handle many-small-harms cases without implicit aggregation?). Prioritarianism needs stress-testing against edge cases (e.g., when slight priority to the worst-off permits massive losses to others).  
        
      *Evidence to Change Priority*:  
      - **Demote if**: Cluster 1 proves the separateness objection is irrelevant to most real-world decisions (e.g., policy is always ex ante).  
      - **Promote if**: Formal analysis shows prioritarianism/contractualism *necessarily* reintroduce aggregation under plausible assumptions (e.g., a theorem proving that satisfying minimal Pareto conditions requires additive structures).  

  3.  **Cluster 3: Institutional Applications (Triage, Health Trade-offs)**  
      *Why Last?*  
      This is **downstream and application-focused**. Without progress on Clusters 1–2, institutional guidance risks being either unprincipled ("adhocery") or paralyzed. Cluster 3 must build on clarified foundations:  
      - If ex ante aggregation is defensible, triage protocols can incorporate statistical lives saved.  
      - If prioritarianism avoids the objection, allocation can weight disadvantage explicitly.  
      - If not, institutions need non-aggregative procedures (e.g., lotteries, strict rights).  
        
      *Tractability*: Lower for pure conceptual work. Requires bridging abstract principles with operational constraints (e.g., urgency, uncertainty, fairness perceptions). Risk of getting bogged down in contextual details without philosophical anchor.  
        
      *Evidence to Change Priority*:  
      - **Promote if**: Real-world crises (e.g., pandemics, disasters) expose concrete institutional failures *directly traceable* to unaddressed separateness concerns, creating urgent need for practical frameworks.  
      - **Demote if**: Clusters 1–2 reveal that separateness has negligible practical implications for institutions (e.g., because constraints like rights or uncertainty dominate decisions).  

  ---

  ### **Why This Ordering Maximizes Impact**  
  - **Cluster 1 is the linchpin**: It tackles the objection where it’s *weakest* (probabilistic harm) and most policy-relevant. A breakthrough here could resolve tensions in the other clusters (e.g., showing contractualism’s "reasonable rejection" hinges on whether harms are ex ante or ex post).  
  - **Cluster 2 builds on 1**: It addresses whether alternatives *work* given Cluster 1’s conclusions. If ex ante aggregation is valid, Cluster 2 shifts to refining it; if not, Cluster 2 explores escape routes.  
  - **Cluster 3 is last but critical**: It translates theory into practice *after* conceptual heavy-lifting. Premature focus here risks either ignoring separateness (yielding crude utilitarianism) or overcorrecting into paralysis.  

  ---

  ### **High-Value Conceptual Tasks for ~3 Years**  
  1. **For Cluster 1**:  
     - Develop a taxonomy of ex ante tradeoffs (e.g., *risks to A for risks to B* vs. *risks to A for certain benefits to B*).  
     - Test whether "separateness" objections correlate with *knowledge of victim identity* vs. *certainty of harm*.  
     - Analyze if time discounting in policy (e.g., climate change) alters the objection’s force.  

  2. **For Cluster 2**:  
     - Formalize contractualist "reasonableness" as a constraint on aggregation: Does it reduce to a social welfare function?  
     - Stress-test prioritarianism with hybrid cases (e.g., small harms to the worst-off vs. large benefits to the middle).  

  3. **For Cluster 3 (preliminary)**:  
     - Draft "separateness-aware" decision heuristics for triage (e.g., "No sacrifice without consent or equivalent ex ante benefit").  
     - Map institutional tradeoffs to Cluster 1’s risk framework (e.g., Is vaccine mandates imposing small risks for herd immunity ex post or ex ante?).  

  ---

  ### **Conclusion: Focus on the Frontier**  
  The separateness objection’s core vulnerability is **ex ante risk imposition**—where everyday policy operates. A 2–3 year project should prioritize Cluster 1 to determine if the objection is a philosophical relic or a live constraint. Cluster 2 then evaluates whether "fixes" hold water, and Cluster 3 converts insights into tools. This order maximizes conceptual progress per hour: start where the objection may crumble (ex ante), then fortify or abandon alternatives, *then* build institutions. If Cluster 1 succeeds, the entire debate pivots; if it fails, the path for Clusters 2–3 becomes clear.
