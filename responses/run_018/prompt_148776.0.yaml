  On the adoption vs biological kids question, the user's insight is sharp—the nonidentity problem does make both choices equivalent in terms of bringing different people into existence. But that doesn't erase meaningful differences: adoption responds to existing need, while reproduction creates new need. Still, we should avoid stigmatizing either choice under this framework. 

