  ive been reading about this puzzle called the nonidentity problem where if you change the future you also change which specific people end up being born, so those people cant complain they were harmed because without your change they wouldnt exist at all. like if we stop polluting now, the people alive in two hundred years will be completely different individuals than if we kept polluting, which makes me wonder who exactly were helping when we talk about saving the future. can you lay out the most important implications of this for how ordinary folks should think about climate action and having kids? im especially stuck on whether this means we dont really owe anything to particular future people, just to some general idea of wellbeing, and whether it weirdly makes adoption and having biological kids morally the same since both choices just determine which people come to exist. please answer in continuous prose only with no headings bullet points bold text or tables, just like a long email.
