prompt: |-
  I'm teaching a unit on whether and how we should judge historical figures morally -- Jefferson owning slaves while writing about liberty, Churchill and the Bengal famine, Columbus and everything after -- and the students keep reaching for two lazy moves: "man of his time, you can't judge" versus "evil is evil, judge away". Before I let them anywhere near the actual figures I want a spec. Write the desiderata: what any adequate account of retrospective moral judgement has to be able to do to count as a serious position rather than a vibe. For each requirement give the case or consideration behind it -- e.g. whatever you say has to handle the fact that plenty of Jefferson's own contemporaries called slavery wrong (so which contemporaries count, and does he get excused if the critics were mostly foreigners or cranks?), it has to say something about people who were better than their era on one axis and awful on another, it has to distinguish judging the person from judging whether we should still name buildings after them, and it has to deal with genuine moral ignorance where arguably nobody could have known better. Which requirements are non-negotiable vs which are just one camp's preference? And the bit I care about most: are any of the plausible desiderata jointly unsatisfiable -- e.g. "judge only by standards available to them" against "our judgements should track what was actually wrong" -- because if the list itself is inconsistent that's the lecture. Finish by noting which single requirement kills off the most of the lazy heuristics my students use. Don't just score Jefferson/Churchill/Columbus at the end, I'll do that in class.
reasoning: |-
  Okay, the user is teaching a unit on judging historical figures and wants to prevent students from using lazy arguments. They need a set of criteria (desiderata) that any serious position must meet. Let me start by understanding their main concerns.

  First, the students are stuck between two extremes: everything is relative to the times, or judging by modern standards without nuance. The user wants a framework that forces deeper analysis. They mentioned specific issues like Jefferson owning slaves despite contemporaries criticizing slavery, figures who were progressive in some areas but regressive in others, and distinguishing between personal judgment and actions like renaming buildings. Also, cases where genuine moral ignorance existed.

  I need to list requirements that address these points. The user emphasized the importance of explaining why each requirement is necessary, using examples they provided. For instance, the contemporaneous criticism requirement comes from Jefferson's peers condemning slavery. Another key point is handling figures with mixed legacies—like someone ahead of their time in one aspect but behind in another.

  The user also wants to know which desiderata are non-negotiable versus optional. Non-negotiables are likely those addressing core philosophical issues, like avoiding anachronism while recognizing objective wrongs. Then, conflicting requirements, such as judging by available standards versus tracking actual wrongs. Resolving that tension is crucial for the lecture.

  The most effective requirement to counter lazy heuristics might be the contemporaneous criticism one because it directly challenges the "man of his time" argument by showing that moral awareness existed even then. Also, the distinction between judging the person versus commemoration practices tackles the "evil is evil" approach by separating moral assessment from practical decisions.

  I should ensure each desideratum is clearly stated with its rationale. The user doesn't want the figures scored yet, so focus on the framework. Potential conflicts: if a standard was unknown at the time (like environmental impact), how do we judge? Or balancing cultural context with universal wrongs. Highlighting these tensions can make the lecture engaging.

  Finally, the user cares most about identifying which requirement undermines the most lazy heuristics. Contemporaneous criticism does that by forcing students to research historical context and recognize that past societies weren't monolithic. That requirement challenges both lazy extremes effectively.
answer: |-
  Here’s a rigorous specification of desiderata for retrospective moral judgment, designed to force nuanced engagement. Each requirement emerges from concrete historical tensions and kills common lazy heuristics.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  *(Failure to satisfy these invalidates an account as unserious)**

  1.  **Contemporaneous Criticism Test:**  
      *Must account for the existence of moral critics within the subject’s own temporal/cultural context.*  
      **Case:** Jefferson (slave owner) vs. contemporary abolitionists like Benjamin Rush or Quakers, or ancient critics of slavery like Seneca. If critics existed, "man of his time" requires justification: *why* did the subject reject available critiques? Were critics marginalized? Did the subject engage?  
      **Kills:** Blanket "man of his time" excuse.

  2.  **Axis Differentiation Requirement:**  
      *Must allow for simultaneous praise and condemnation of a single figure across different moral dimensions.*  
      **Case:** Churchill: Leadership against Nazism (praiseworthy) vs. culpable neglect/racism exacerbating the Bengal Famine (condemnable). Or Frederick Douglass: Progressive on race/gender *for his era* vs. regressive views on Native American displacement.  
      **Kills:** Monolithic "evil is evil" or "hero is hero" judgments.

  3.  **Judgment/Commemoration Distinction:**  
      *Must separate the moral assessment *of the person/historical act* from the practical/political question of *commemoration* (statues, place names, holidays).*  
      **Consideration:** Columbus can be judged morally culpable for atrocities *and* one can argue his voyages were historically consequential *and* one can oppose celebrating him with a holiday – these are distinct judgments with different criteria (morality vs. historical impact vs. civic values).  
      **Kills:** Conflating "he was bad" with "erase him from history" or "he was important" with "he was good."

  4.  **Genuine Ignorance Clause:**  
      *Must provide a framework for assessing actions where no plausible contemporary moral standard condemned them AND no significant critics existed, distinguishing this from willful ignorance.*  
      **Case:** Pre-contact societies practicing human sacrifice embedded in cosmological beliefs with no internal dissent vs. 18th-century slave owners ignoring abolitionist arguments. Did the *epistemic conditions* for knowing better exist?  
      **Kills:** Over-application of both "evil is evil" (ignoring true epistemic limits) *and* "man of his time" (excusing willful blindness).

  5.  **Avoidance of Strict Presentism:**  
      *Must not judge *solely* by moral standards developed *after* the subject's death and inaccessible to them.*  
      **Consideration:** Condemning medieval physicians for not using germ theory. While their actions had harmful *consequences*, moral culpability requires agency within their epistemic framework.  
      **Kills:** Simplistic "evil is evil" based purely on modern sensibilities.

  6.  **Avoidance of Strict Relativism:**  
      *Must acknowledge that some acts are morally wrong *regardless* of their contemporary acceptance.*  
      **Case:** Chattel slavery's inherent dehumanization and violence. Widespread acceptance doesn't negate its objective wrongness; it demands explanation of *why* acceptance occurred.  
      **Kills:** Blanket "man of his time" as a moral absolution.

  ---

  ### **Important (But Negotiable/Camp-Dependent) Desiderata**
  *(Serious positions can differ here, but must address them explicitly)*

  7.  **Scope of "Context":**  
      *What constitutes the relevant moral community for setting the baseline?*  
      **Tension:** Does "his time" mean Virginia planters? Enlightenment thinkers? The Atlantic world? Abolitionist minorities? (e.g., Was Jefferson failing *his own* elite intellectual standards?).

  8.  **Weight of Consequentialism:**  
      *How heavily do unintended negative consequences weigh against intentions or positive consequences?*  
      **Case:** Churchill's war focus arguably "caused" Bengal famine neglect – does the existential threat of Nazis mitigate, or does the preventable suffering dominate?

  9.  **Role of "Progress" Narrative:**  
      *Does judging figures require situating them on a trajectory toward "our" (presumed better) values?*  
      **Preference:** Rejecting this avoids Whig history; embracing it aids pedagogical framing. Affects how we judge "transitional" figures.

  ---

  ### **The Central Tension (Potentially Unsatisfiable?)**
  *   **Desideratum A (Avoid Presentism):** "Judge by standards conceptually available/imaginable within their epistemic and cultural context."
  *   **Desideratum B (Avoid Relativism):** "Our judgments must track objective moral wrongs, even if unrecognized then."
  *   **Conflict:** How can we condemn Jefferson for slavery using our understanding of its wrongness (B) without unfairly imposing a standard he "couldn't" have fully grasped (A)? **This *is* the lecture.**
  *   **Resolution Attempts (Illustrating the Tension):**
      *   **Moral Realism + Epistemic Access:** The wrongness existed; critics prove the idea was *available*, even if not mainstream. Culpability hinges on access/rejection of available critiques (Desideratum 1 bridges A & B).
      *   **Threshold Wrongs:** Some acts (genocide, torture, chattel slavery) are so fundamentally violative that cultural acceptance is irrelevant to their *wrongness*, though it may mitigate *culpability*. (B dominates for the act, A influences blame).
      *   **Double-Historicization:** Judge the *act* by our best understanding of morality (B) *and* judge the *agent's culpability* relative to their context (A). This separates the questions but feels unsatisfying.

  ---

  ### **The Lazy-Heuristic Killer: Desideratum #1 (Contemporaneous Criticism Test)**
  *   **Why it's lethal:** It demolishes the core premise of the "man of his time" heuristic by demonstrating that the moral issue *was* contested *then*. It forces students to engage with *why* the figure held the view they did despite criticism (ignorance? malice? vested interest? genuine philosophical disagreement?). Simultaneously, it complicates the "evil is evil" stance by forcing engagement with context – the criticism existed, but was it mainstream? credible? suppressed? This requirement mandates historical digging and prevents facile generalizations.

  ---

  Use this spec to force students to build tools *before* wielding them. The tension between avoiding presentism and avoiding relativism is the engine of genuine historical ethics – make them grapple with it directly.
