prompt: |-
  Hi — hoping you can save me from myself before Thursday's seminar.

  I'm teaching a third-year decision theory module; they've done Newcomb's problem and the smoking lesion and that's about it. I want to run counterfactual mugging and XOR blackmail as a pair, and my line going in has been that they're the same problem with the signs flipped: in both, what you end up with depends on a predictor's model of your decision procedure rather than on anything your present act causes, so really they're both just Newcomb in a costume. Which, if true, makes the pair useless to me pedagogically — whichever way you jump in Newcomb you'd jump the same way in both, so neither case discriminates between causal, evidential and functional-ish approaches at all. A colleague rolled her eyes at this and said the two actually pull in opposite directions, but she was late for a meeting and only got out something about branches before she left.

  The part I really want help with is a test I made up to settle it. Take a 50/50 mixture: Omega is running one of two protocols and won't tell you which. Protocol A, the mugging: he flips a coin; heads and he deposits $10,000 iff his simulation of you, told the coin came up tails, hands over $100; tails and he sends you the demand. Protocol B, the blackmail: the letter goes out iff exactly one of these holds — your house has termites, or you're the sort who'd pay $1,000 on getting the letter. You get a letter either way. If the cases really are mirror images, the mixture should come out a wash. But it dosn't feel like one: the upside in the mugging half seems to accrue to a policy chosen before the coin is revealed, while the downside in the blackmail half seems to accrue to the act you perform after the letter lands. Adding those together feels like adding an ex ante expected value to an ex post one. Am I inventing that asymmetry, or is it the whole point?

  Could you structure the reply as: "The short answer" (two or three sentences), "Where I'm going wrong" (two paragraphs), "The asymmetry that actually does the work" (two paragraphs), "The 50/50 mixture and my bookkeeping worry" (three paragraphs), "What I should tell the seminar" (one short paragraph). Keep it plain — I have to be able to read it aloud. Thanks!
reasoning: |-
  Okay, let me tackle this decision theory problem step by step. The user is teaching a seminar and wants to clarify whether Counterfactual Mugging and XOR Blackmail are truly mirror images or if they present distinct challenges. 

  First, I need to understand the core concern: the user believes both problems reduce to Newcomb's paradox, making them pedagogically redundant. But their colleague claimed they pull in opposite directions. The user's 50/50 mixture test aims to reveal any asymmetry - and they intuitively feel one exists due to timing differences in when payoffs materialize.

  Hmm, the key insight lies in how decision theories handle pre-commitment versus conditional actions. In Mugging, the critical choice happens before the coin flip revelation - it's about establishing a general policy. Blackmail however forces a decision after receiving the letter, creating a conflict between prior intent and present evidence. This temporal asymmetry explains why one feels like "ex ante" and the other "ex post" valuation.

  For the mixture problem, the user's intuition is spot-on but misattributed. The issue isn't value bookkeeping - it's that EDT and CDT handle the two scenarios differently precisely because of that timing gap. In Mugging, EDT pays while CDT refuses; in Blackmail, CDT pays while EDT refuses. So the mixture doesn't "wash out" - it creates a dilemma where no decision rule dominates.

  The real pedagogical value emerges here: these problems test how different theories resolve conflicts between past commitments and present evidence. Newcomb focuses on prediction versus causation, while Mugging/Blackmail stress temporal consistency. That's what the seminar should highlight - these aren't Newcomb clones but probes into new dimensions of rational choice.
answer: |-
  **The short answer:**  
  No, Counterfactual Mugging (CM) and XOR Blackmail (XB) are not mirror images. They test different *conflicts within decision theories*. CM pushes you to honor pre-commitments to hypotheticals; XB forces a choice between past intent and present evidence. Your 50/50 mixture *exposes* this asymmetry.  

  **Where I'm going wrong:**  
  You’re right that both leverage a predictor’s model, reducing causal influence. But framing them as "Newcomb in a costume" oversimplifies. Newcomb’s core tension is between *causal dominance* (one-boxing seems irrational) and *evidential dominance* (two-boxing loses money). CM and XB introduce a new layer: **temporal conflict between policy and action**.  

  In CM, the "right" act (paying if asked) is chosen *before you know the coin flip*. It tests whether you’d bind yourself to a policy benefiting "other versions" of you. In XB, the demand arrives *after* the state (termites) is set. Paying feels irrational *now* because the blackmailer’s prediction is already fixed—your act only loses money. The asymmetry isn’t in the predictor’s role, but in *when your decision carries weight*.  

  **The asymmetry that actually does the work:**  
  CM rewards **pre-commitment to a globally optimal policy**. Evidential Decision Theory (EDT) and functional/updateless agents pay because they value the *overall expectation* of their strategy. Causal Decision Theory (CDT) refuses: paying can’t *cause* the $10k (the coin is tails!), so it’s pure loss. Here, EDT/functional agents "win" by valuing the counterfactual.  

  XB punishes **updating on the predictor’s signal**. EDT sees the letter as *evidence* you’re in a world where paying works (i.e., no termites), so it pays. CDT pays *if* you think your act affects the prediction—but in XB, the prediction is fixed before you act. CDT *shouldn’t pay*: the $1k loss doesn’t cause the house to be termite-free. Functional agents refuse to pay, preserving their "don’t yield to blackmail" policy. EDT loses by over-updating.  

  **The 50/50 mixture and your bookkeeping worry:**  
  Your intuition is correct: the mixture isn’t a wash. CM’s upside ($10k if you pre-commit to paying) is *locked in during the policy phase*. XB’s downside ($1k loss if you pay post-letter) hits *during the action phase*. EDT agents face a dilemma: their CM success relies on pre-committing to pay, but that same pre-commitment makes them *more likely to lose* in XB (since paying is now part of their "type").  

  CDT agents refuse in CM (missing $10k) but *might* pay in XB if they misinterpret causality. Functional agents pay in CM (gaining $10k) and refuse in XB (saving $1k). The mixture doesn’t add "ex ante" and "ex post" values—it pits *consistency across time* against *situational rationality*.  

  The bookkeeping feels messy because CM’s benefit depends on a *disposition you adopt early*, while XB’s cost stems from *how you implement that disposition later*. This isn’t an accounting error; it’s the crux. The theories split on whether to prioritize the *strategy* (functional) or the *now-dominant act* (CDT/naive EDT).  

  **What you should tell the seminar:**  
  "CM and XB aren’t Newcomb clones. They test how theories handle conflicts between *past policies* and *present acts*. CM rewards committing to counterfactual cooperation; XB punishes over-updating on threats. This reveals why functional decision theory diverges from EDT and CDT—it weights timeless strategies over context-specific acts."  

  ---  
  **Key for plain reading:**  
  - **CM:** Paying when asked (tails) gets you $10k if coin was heads.  
  - **XB:** Paying $1k ‘works’ only if your house *has* termites.  
  - **EDT:** Acts on evidence (what your choice *indicates*).  
  - **CDT:** Acts on causation (what your choice *changes*).  
  - **Functional:** Chooses the best timeless policy (ignoring "you" as an instance).
