  Below is a diagnostic decision tree designed for your graduate philosophy-of-mind seminar. It uses the specified non-standard variant of Jackson's knowledge argument (neural simulation without direct phenomenal encounter) and classifies eight positions based on concrete case-questions. The tree has seven decision nodes, avoids philosophical jargon, and is structured for clarity in a 15-minute exercise. Positions are mapped to leaves after branching, with ambiguous or unoccupied positions flagged.  

  ### **Decision Tree: Does Neural Simulation Close the Epistemic Gap?**  
  **Start with Q1.**  

  **Q1:** After the neural simulation (which did not involve Mary actually seeing red), does Mary know what it is like to see red?  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q5.  

  ---

  #### **Branch 1: Mary Knows What It Is Like (Q1 = Yes)**  
  **Q2:** Is this new knowledge about something non-physical (e.g., a subjective feeling beyond the physical brain state)?  
  - **Yes** → **Leaf 8: Property Dualism with Simulation-Based Qualia Knowledge**  
    - *Unoccupied position*. Diagnosis: Incoherent. Property dualism holds that qualia are non-physical and not produced by physical simulation, so Mary cannot gain knowledge of them this way.  
  - **No** → Proceed to Q3.  

  **Q3:** After the simulation, can Mary form a belief about the experience of seeing red (e.g., think, "This is what it is like to see red")?  
  - **Yes** → Proceed to Q4.  
  - **No** → **Leaf 7: Hybrid**  
    - Accepts simulation yields phenomenal knowledge but denies it yields phenomenal belief (e.g., knowledge is non-conceptual or pre-doxastic).  

  **Q4:** How does the simulation provide this knowledge?  
  - **Option A:** It gives Mary a new concept (a new way of thinking about red experiences) → **Leaf 2: Physicalism via Phenomenal-Concept Acquisition**.  
  - **Option B:** It gives Mary direct access to a physical state she already knew about → **Leaf 3: Physicalism via Acquaintance**.  
    - *Ambiguity note:* Positions 2 and 3 may overlap; both ground knowledge in physical states but emphasize concept-formation vs. direct access.  

  ---

  #### **Branch 2: Mary Does Not Know What It Is Like (Q1 = No)**  
  **Q5:** Is the idea of "knowing what it is like" fundamentally flawed (e.g., because phenomenal concepts are illusory)?  
  - **Yes** → **Leaf 6: Eliminativism about Phenomenal Concepts**.  
  - **No** → Proceed to Q6.  

  **Q6:** Is the gap due to the simulation missing a non-physical aspect of experience (e.g., a subjective feeling not reducible to brain states)?  
  - **Yes** → **Leaf 4: Property Dualism**.  
  - **No** → Proceed to Q7.  

  **Q7:** Could Mary learn "what it is like" without ever seeing red (e.g., by gaining abilities like recognizing or imagining red)?  
  - **Yes** → **Leaf 1: Physicalism via the Ability Hypothesis**.  
  - **No** → **Leaf 5: Knowledge Dualism with Ontological Neutrality**.  
    - Accepts an epistemic gap but denies it implies an ontological gap (e.g., limitation of concepts or modes of access).  

  ---

  ### **Taxonomy of Leaves**  
  | Leaf | Position | Key Commitment in the Case |  
  |------|----------|----------------------------|  
  | 1 | Physicalism via ability hypothesis | Simulation fails, but abilities (e.g., recognition) could close the gap. |  
  | 2 | Physicalism via phenomenal-concept acquisition | Simulation provides a new concept for a physical state. |  
  | 3 | Physicalism via acquaintance | Simulation enables direct access to a known physical state. |  
  | 4 | Property dualism | Gap persists due to missing non-physical quale. |  
  | 5 | Knowledge dualism (ontologically neutral) | Epistemic gap exists but reflects conceptual limits, not ontology. |  
  | 6 | Eliminativism about phenomenal concepts | "What it is like" is a misleading/incoherent idea. |  
  | 7 | Hybrid | Simulation grants knowledge but not belief (e.g., non-conceptual awareness). |  
  | 8 | *Unoccupied*: Property dualism with simulation-based qualia knowledge | Incoherent (non-physical qualia cannot be known via physical simulation). |  

  ### **Design Notes**  
  - **Audience-Friendly**: Questions use concrete descriptions (e.g., "new way of thinking," "subjective feeling") instead of jargon.  
  - **Ambiguity**: Leaves 2 and 3 may not be fully separable due to overlapping commitments (flagged at Q4).  
  - **Efficiency**: Seven nodes fit a 15-minute exercise; respondents answer based on intuitions about the case.  
  - **Unoccupied Position**: Leaf 8 is logically possible but incoherent (property dualism cannot accept simulation-based qualia knowledge).  

  This instrument isolates commitments through scenario-specific reasoning, helping students self-diagnose without prior exposure to position labels.
