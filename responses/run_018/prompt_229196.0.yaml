prompt: |-
  So I work for a mid-sized health insurer and I recently got moved onto the panel that decides which treatments we cover as "medically necessary" and which we exclude as elective or cosmetic-ish. We get maybe 40 of these a month, mostly contested stuff: growth hormone for kids who are short but not hormone-deficient, stimulants for people without a diagnosis who say they can't function at their jobs, laser work, a guy who wants his ACL repaired in a way that would leave the knee stronger than it was pre-injury, that sort of thing. Right now the panel basically argues each one from scratch and the decisions are all over the place -- I'm pretty sure the same request would get approved or denied depending who's on shift.

  What I want is an actual procedure we could run in maybe 20-30 minutes per case, built on whatever the right way to think about the difference between treating a problem and just upgrading a person is. Like, the ordered list of questions, what counts as a good enough answer to move to the next one, where a "no" at some step just kills the application, and where the procedure should stop and admit it's a values call that has to go to a human vote rather than a checkbox. We're doctors and claims people, not philosophers, so it has to be runnable by someone who has never read anything on this topic. Also flag where the procedure will probably give wrong answers, because I assume it will sometimes.

  A few things I'm already stuck on that it should handle: normal ranges are statistical, so "restore to normal function" gets weird when someone is naturally at the bottom of the range and wants to be moved up to average. Also species-typical functioning sounds clean until you hit someone who was born without a trait most humans have but isnt suffering in any measurable way. And there's the question of whether we should be comparing the patient to themselves-before, to the population average, or to some ideal.

  Then actually run the procedure on three cases so I can see it working: (1) a 13 year old boy, no hormone deficiency, predicted adult height around 5'4", getting bullied, parents pushing hard; (2) a night-shift nurse with no diagnosis who wants a wakefulness drug she says she needs to not make errors; (3) a recreational runner whose knee surgery could be done the standard way or with a graft that testing suggests would make the joint more stable than it ever was. At least one of these should come out with an answer I'll hate, because if the procedure only ever agrees with my gut it's not doing anything. And be upfront about what this kind of checklist just cant capture no matter how we tinker with it.
reasoning: |-
  Okay, let's tackle this user's problem. They work for a health insurer and need a clear procedure to determine medical necessity. The current process is inconsistent, with decisions varying based on who's on the panel. The user wants a step-by-step method that's practical, takes 20-30 minutes per case, and can be used by non-philosophers.

  First, I need to understand the core issues they're facing. The main challenge is distinguishing between necessary treatment and elective upgrades. They mentioned problems with normal ranges, species-typical functioning, and comparison standards (self vs. population vs. ideal). 

  I recall frameworks like Daniels' "normal opportunity range" and Boorse's "normal function." But these can be abstract. The user needs something actionable. So, breaking it down into a flowchart with clear yes/no questions makes sense. Key aspects to cover: pathology, functional impairment, evidence, alternatives, and cost-effectiveness. 

  For the pathological threshold step, it's crucial to define when a condition is a true medical issue. Lab values alone aren't enough; functional impairment is necessary. But what about cases where there's no clear pathology, like the short stature kid? Here, the lack of hormone deficiency makes it tricky. The procedure must flag such cases for human judgment.

  Next, functional impairment. ADLs and IADLs are standard, but work/school functioning is also important. Quantifying impairment helps, but subjective reports need objective backing. For the nurse wanting wakefulness drugs, shift work isn't a pathology, so impairment must be assessed carefully. Objective measures like error logs or performance reviews would be needed.

  The evidence step ensures treatments are proven for the condition. Off-label use requires strong evidence. The ACL surgery with a better graft might lack evidence for prophylactic enhancement, leading to denial unless proven necessary.

  Alternatives check for simpler solutions. The nurse might benefit from sleep hygiene instead of drugs. If alternatives exist, the request may be denied. 

  Cost-effectiveness is practical but controversial. The height hormone case is expensive with modest benefits, tipping towards denial unless severe impairment is proven.

  Applying this to the three cases:
  1. The boy with short stature: No pathology, impairment is psychosocial. Alternatives like counseling exist. Likely denial, which the user might dislike but shows the procedure works.
  2. The nurse: No pathology, shift work is occupational. Needs objective impairment data. Without it, denial. If she provides evidence, maybe approve.
  3. The runner: Standard surgery is sufficient; the enhanced graft is an upgrade. Without evidence of medical need for enhancement, denial.

  Limitations include subjectivity in impairment assessment, cultural biases in norms, and edge cases like congenital conditions. The procedure can't handle all values conflicts, hence the escape valves to human judgment.

  The user needs transparency about where the checklist fails, so highlighting these limitations is key. Also, ensuring the steps are clear for non-experts, avoiding jargon. Testing with real cases helps demonstrate consistency, even when outcomes are unpopular. Ultimately, the procedure adds structure but still requires human discretion for borderline cases.
answer: |-
  Here's a structured Medical Necessity Decision Procedure (MNDP) designed for speed, consistency, and transparency. It prioritizes evidence-based medicine, functional impairment, and avoids philosophical quicksand where possible. It includes explicit "escape valves" for value judgments.

  **Core Principle:** Coverage requires a **treatable pathological impairment** (deviation from *species-typical structure/function causing harm*) where the intervention is **effective, standard of care, and the least intensive/costly option**.

  ---

  **Medical Necessity Decision Procedure (MNDP) - 20-30 min/case**

  1.  **PATHOLOGICAL THRESHOLD (Gatekeeper Step - "No" = Deny)**
      *   *Question:* Does the patient have a *diagnosed medical condition* (disease, disorder, injury, congenital defect) confirmed by objective clinical evidence (labs, imaging, exam, validated diagnostic criteria)? **OR** Is there a *preventable, imminent health risk*?
      *   *Evidence Required:* Medical records confirming diagnosis/risk. ICD code alone isn't sufficient; need *supporting clinical data*.
      *   *"Good Enough" Answer:* Yes = Clear diagnosis/risk per standards (e.g., ADA, DSM, clinical guidelines). No = No identifiable pathology or risk (e.g., "short stature" without GHD, "tiredness" without disorder, "enhancement").
      *   *Stop/Deny if:* "No". *Reason:* No medical condition to treat.
      *   *Escape Valve:* If diagnosis is borderline/contested (e.g., subclinical results), proceed but flag for human judgment later.

  2.  **FUNCTIONAL IMPAIRMENT (Gatekeeper Step - "No" = Deny)**
      *   *Question:* Is the diagnosed condition causing *significant, measurable functional impairment* in Activities of Daily Living (ADLs), Instrumental ADLs (IADLs), work/school performance, or significant distress/dysfunction?
      *   *Evidence Required:* Specific examples of impairment (e.g., "child avoids school due to bullying causing grades to drop," "nurse documented near-miss errors," "runner cannot walk >1 block"). Quantify if possible (e.g., absenteeism rates, error logs, pain scales, mobility limits). *Patient report alone is insufficient*; need correlation with condition.
      *   *Comparison Standard:* **Species-Typical Functioning** (Can a typical human perform this core function without impairment? e.g., walk, learn, work safely). *Not* comparison to self-before (unless pathology caused decline) or population average/ideal.
      *   *"Good Enough" Answer:* Yes = Impairment documented and linked to condition. No = Minor inconvenience, purely cosmetic concern, or desire for function *beyond* typical (e.g., wanting to be taller than peers, wanting superhuman wakefulness, wanting a "better-than-original" joint).
      *   *Stop/Deny if:* "No". *Reason:* Condition exists but isn't causing significant harm to core functioning.
      *   *Escape Valve:* If impairment is subjective or culturally complex (e.g., psychosocial impact of short stature), proceed but flag for human judgment.

  3.  **TREATMENT EFFICACY & STANDARD OF CARE**
      *   *Question:* Is the requested intervention *clinically proven* (via robust evidence: RCTs, guidelines) to effectively treat *this specific condition* and its associated impairment? Is it the *standard of care* or a guideline-supported alternative?
      *   *Evidence Required:* Peer-reviewed studies, FDA approval for indication, major clinical guidelines (e.g., Endocrine Society, AMA, specialty societies). Off-label use requires strong evidence for *this specific condition*.
      *   *"Good Enough" Answer:* Yes = Clear evidence/guidelines for this use. No = Experimental, cosmetic, purely enhancement, or evidence weak/absent for this indication.
      *   *Stop/Deny if:* "No". *Reason:* Not a proven treatment for the condition/impairment.
      *   *Escape Valve:* If evidence is emerging or for rare conditions lacking guidelines, flag for expert review/human judgment.

  4.  **MEDICAL ALTERNATIVES & LEAST INTENSIVE OPTION**
      *   *Question:* Are there *effective, less intensive/resource-intensive* alternatives (behavioral, medical, surgical) that address the impairment adequately? Is the requested intervention *necessary* because alternatives failed, are contraindicated, or are clearly inferior?
      *   *Evidence Required:* Documentation of tried alternatives OR valid reason why alternatives aren't viable (contraindications, predicted failure based on evidence).
      *   *"Good Enough" Answer:* Yes = Requested intervention is truly necessary/optimal after considering alternatives. No = Safer/cheaper alternatives exist and haven't been tried/justified.
      *   *Stop/Deny if:* "No" *and* viable alternative exists. *Reason:* Less intensive option should be tried first.
      *   *Escape Valve:* If superiority of requested intervention is debated or context-specific, flag for human judgment.

  5.  **COST-EFFECTIVENESS / RESOURCE ALLOCATION (Tie-Breaker)**
      *   *Question:* (Only if previous steps are equivocal or both "Yes") Is the intervention *cost-effective* relative to the expected health benefit and impairment alleviation, considering insurer resources and member pool fairness?
      *   *Evidence Required:* Cost data, comparative effectiveness data if available (often limited). Consider magnitude of benefit vs. cost.
      *   *Decision:* Human judgment required based on insurer policy/benchmarks. This step *acknowledges* inherent value judgments about resource allocation.
      *   *"Good Enough" Answer:* N/A - This is the explicit "Human Vote" step.
      *   *Stop:* Always requires panel discussion/vote.

  **Output:** Approve / Deny / Needs More Info / Flagged for Human Vote (Specify Step)

  ---

  **Where the MNDP Will Likely Give "Wrong" Answers or Struggle:**

  1.  **The Normal Range Problem:** Someone naturally at the bottom of a statistical range (e.g., very short, low energy) who suffers impairment. MNDP relies on *pathology* + *impairment*. If no pathology exists (Step 1), denial is likely, even if impairment is real (Step 2). This feels unfair but maintains focus on treating disease, not statistical outliers. *Escape Valve: Step 2 Flag.*
  2.  **"Islands of Abnormality":** Congenital absence causing no measurable impairment (e.g., missing a minor toe muscle). MNDP likely denies (No Step 1 pathology, no Step 2 impairment). May conflict with patient's sense of normalcy.
  3.  **Subjectivity of Impairment:** Quantifying psychosocial distress or "functional impairment" in demanding jobs is inherently subjective. MNDP requires *corroborating evidence* but this can be gamed or missed.
  4.  **Evolving Standards:** What's "cosmetic" or "enhancement" changes (e.g., laser hair removal for hirsutism vs. purely cosmetic). MNDP relies on current medical consensus (Step 3).
  5.  **Rare Conditions:** Lack of evidence (Step 3) or clear guidelines makes decisions difficult.
  6.  **Cost-Effectiveness Inequities:** Denying high-cost interventions for severe but rare impairments feels cruel, even if rational for the pool. MNDP forces this into Step 5 for explicit human judgment.

  ---

  **Application to Cases (Be Prepared to Hate One):**

  **Case 1: 13 y/o Boy - Growth Hormone (Predicted 5'4")**
  1.  **Pathology?** No. Short stature, no GH deficiency confirmed. *Diagnosis?* Idiopathic Short Stature (ISS) - a description, not a disease. **No.** *(Gatekeeper Fail - Deny)*
      *   *Escape Valve Consideration:* Does bullying constitute a "health risk"? Not typically an *imminent medical* risk. Proceed to Step 2 only if panel overrides Gatekeeper 1 (unlikely per strict MNDP).
  2.  *(If proceeding)* **Impairment?** Yes (Psychosocial - bullying). Documented impact on school/social function? Needs evidence beyond parent report (e.g., counselor note, school record). *If documented:* **Yes**. *Flag:* High subjectivity.
  3.  **Efficacy/Standard?** GH for ISS has modest efficacy (+1.5-3" avg), controversial cost/benefit. Not universally accepted as standard *medical* care for psychosocial reasons. Guideline support is weak/conditional. **Probably No.** *(Deny)*
  4.  **Alternatives?** Psychosocial support, counseling exist. **Yes (Less intensive options).** *(Deny)*
  5.  **Cost-Effectiveness:** Very high cost, modest/non-medical benefit. Likely Deny.
      *   **MNDP Outcome: DENY** (Primarily fails Gatekeeper 1 & 3). *Human Vote Likely Needed:* But structure forces focus on lack of pathology and weak medical justification.

  **Case 2: Night-Shift Nurse - Wakefulness Drug (No Diagnosis)**
  1.  **Pathology?** No diagnosed sleep disorder (e.g., Shift Work Sleep Disorder, Narcolepsy). "Tiredness" due to shift work isn't a pathology. **No.** *(Gatekeeper Fail - Deny)*
      *   *Escape Valve:* Is chronic sleep deprivation an "imminent health risk" (errors)? Proceed cautiously to Step 2.
  2.  *(If proceeding)* **Impairment?** Requires *objective evidence of impairment linked to sleepiness*: Documented near-miss errors, performance reviews citing fatigue, objective cognitive testing showing deficits. *Patient report alone insufficient.* **Without evidence: No.** *(Deny)*. *With strong evidence:* **Yes** (Impairs core work function/safety). *Flag:* High risk of misattribution.
  3.  **Efficacy/Standard?** Wakefulness agents (e.g., Modafinil) are FDA-approved/proven for *specific sleep disorders* (Narcolepsy, SWSD). Efficacy for *non-disordered* shift work fatigue is less robust/not primary indication. **Probably No** for this use case (no pathology). *(Deny)*
  4.  **Alternatives?** Sleep hygiene optimization, strategic napping, caffeine, schedule adjustment if possible. **Yes (Less intensive options likely exist).** *(Deny)*
  5.  **Cost-Effectiveness:** Moderate cost, benefit uncertain without pathology. Likely Deny.
      *   **MNDP Outcome: DENY** (Fails Gatekeeper 1, likely fails 2 & 3). *Human Vote Possible:* If strong, objective evidence of job impairment solely due to shift schedule exists.

  **Case 3: Recreational Runner - Enhanced ACL Graft**
  1.  **Pathology?** Yes. ACL tear (confirmed by imaging/exam). **Yes.**
  2.  **Impairment?** Yes. Functional impairment in ambulation, running, likely ADLs. **Yes.**
  3.  **Efficacy/Standard?** Standard ACL reconstruction grafts (patellar tendon, hamstring, cadaver) are proven effective to *restore stability and function to pre-injury/normal levels*. The "enhanced" graft (e.g., novel synthetic, special prep) claims *superior* stability. Is it proven *necessary* to achieve *species-typical* function? Is it the standard of care? Likely **No** - standard grafts are SOC and effective. The enhancement is experimental/prophylactic (preventing *future* injury isn't treating *current* pathology/impairment). **No.** *(Deny)*
  4.  **Alternatives?** Yes. Standard, proven ACL reconstruction techniques. **Yes (Effective, standard alternatives exist).** *(Deny)*
  5.  **Cost-Effectiveness:** Enhanced graft likely more expensive with unproven *medical* benefit over SOC. Deny.
      *   **MNDP Outcome: DENY** (Fails Step 3 & 4). *Human Vote Unlikely to Override:* Desire for "better than original" is enhancement, not medical necessity.

  ---

  **What the Checklist Can't Capture (No Matter What):**

  1.  **Deep Value Conflicts:** Is avoiding severe psychosocial suffering (like bullying) due to a non-pathological state a "medical" necessity? MNDP says "No," many people feel it should be "Yes." This is societal, not medical.
  2.  **The "Lived Experience" Gap:** Objective measures (Step 2) can miss the true subjective burden of a condition, especially invisible ones (fatigue, mild pain, social anxiety).
  3.  **Defining "Harm":** MNDP uses functional impairment. But is the *risk* of future harm (e.g., enhanced ACL preventing future tear, wakefulness drug preventing an error) sufficient? MNDP is cautious, requiring current impairment.
  4.  **Justice & Equity:** Strict adherence can disadvantage those with rare conditions, poorly understood impairments, or who fall just outside diagnostic criteria.
  5.  **The "Slippery Slope":** Where does treating pathology end and enhancement begin? MNDP draws a bright line at "species-typical function" and treating diagnosed pathology, but this line is inherently fuzzy and culturally influenced.

  **Implementation Advice:**

  1.  **Pilot & Refine:** Run the MNDP silently on past cases. See where it matches/misses panel decisions. Tweak definitions (especially impairment evidence requirements).
  2.  **Training:** Brief panel on the steps, logic, escape valves, and limitations. Emphasize "Pathology" and "Species-Typical Function" as anchors.
  3.  **Documentation:** Require panelists to document their answers to each step concisely in the case file. This forces structured thinking and allows audit.
  4.  **Escape Valve Use:** Track how often cases hit the "Human Vote" flags and why. This identifies systemic ambiguities needing policy updates.
  5.  **Transparency:** Share the *structure* of the MNDP (not specific decisions) with providers. It sets clearer expectations for what evidence is needed.

  This MNDP provides structure, consistency, and efficiency. It won't eliminate tough calls (Step 5 exists for a reason), but it forces them into the open based on defined criteria, moving away from purely intuitive or shifting judgments. The Case 1 (Growth Hormone) denial is likely the one you'll hate, demonstrating the procedure prioritizes treating disease over alleviating suffering caused by natural variation without pathology.
