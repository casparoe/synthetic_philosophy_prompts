answer: |-
  Here’s a 45-minute activity designed to concretely illustrate the tradeoffs between outcome-based and process-based supervision, using only index cards and a whiteboard. The task is a **constrained pathfinding puzzle** that forces learners to navigate tradeoffs between efficiency and creativity, while supervisors face credit-assignment and anchoring challenges.

  ---

  ### **Activity: GridPath Puzzle**
  **Concept**: Learners ("AIs") must find valid paths across a grid to reach a goal, while supervisors ("humans") provide feedback. Outcome-based groups only get final success/failure feedback; process-based groups get step-by-step validation.  
  **Materials**:  
  - Index cards (10 per group: 5 for moves, 5 for feedback tokens).  
  - Whiteboard (draw a grid for all groups to reference).  

  **Grid Setup** (draw on whiteboard):  
  ```
  (Start) → A → B → C  
            ↓   ↓   ↓  
            D → E → F → (Goal)
  ```  
  - **Valid paths**: `A→B→C→F→Goal` (short path) or `A→D→E→F→Goal` (long path).  
  - **Trick**: `E→C` is a **valid but non-obvious shortcut** (marked with a dotted line on the board). Path `A→D→E→C→F→Goal` is also valid but longer.  
  - **Rules**:  
    - Each move must follow arrows (→ or ↓).  
    - Path must be exactly 4 moves (e.g., `Start→A→B→C→F→Goal` is invalid; it’s 5 moves).  

  ---

  ### **Group Division (15 people)**  
  - Split into **3 groups of 5**:  
    - Each group has **2 supervisors** (share one role) and **3 learners** (collaborate as one "AI").  
    - *Why?* Supervisors need consensus to avoid bias; learners mimic AI’s trial-and-error.  

  ---

  ### **Round 1: Outcome-Based Supervision (15 min)**  
  **Task**: Learners submit a full 4-move path (e.g., `A→B→C→F`).  
  **Supervisor Role**:  
  - Give **only final feedback**:  
    - "Success" (1 candy/token) if path is valid *and* ends at Goal.  
    - "Fail" (no reward) otherwise.  
  - **No explanations**. Record attempts on index cards.  

  **Learner Role**:  
  - Propose as many full paths as possible in 10 min.  
  - Goal: Maximize success tokens.  

  **Predictable Issue**:  
  - Learners spam random paths (e.g., `A→D→E→F` fails—only 3 moves).  
  - Groups fixate on short paths but miss valid options (e.g., `A→D→E→C→F` is never tried).  
  - *Handling*: Let frustration build; interrupt at 10 min to note low success rates.  

  ---

  ### **Round 2: Process-Based Supervision (15 min)**  
  **Task**: Learners propose **one move at a time** (e.g., "Start→A").  
  **Supervisor Role**:  
  - After **each move**, give feedback:  
    - "Valid" (1 candy/token) if the move follows grid rules.  
    - "Invalid" (no reward) if it breaks rules.  
  - **Record each step** on index cards.  

  **Learner Role**:  
  - Build a path stepwise. Restart after each attempt.  
  - Goal: Maximize tokens from valid steps.  

  **Predictable Issue**:  
  - Supervisors **anchor learners to known paths** (e.g., nudge toward `A→B→C→F`).  
  - Learners avoid risky shortcuts (`E→C`), even though valid.  
  - *Handling*: If learners propose `E→C`, validate it—but note post-game that most groups ignore it.  

  ---

  ### **Payoff Scheme**  
  - **Outcome-based**: 1 token per *successful path*.  
  - **Process-based**: 1 token per *valid move*.  
  - **No real stakes**: Use candy, paper tokens, or whiteboard tally.  

  ---

  ### **Debrief Script (10 min)**  
  **Map moments to concepts**:  
  1. **Credit assignment** (Outcome-based):  
     - *"In Round 1, when a path failed, could you tell *which move* caused the error?"*  
     - → Link to RLHF: Sparse rewards make it hard to pinpoint mistakes.  

  2. **Anchoring & step rigidity** (Process-based):  
     - *"In Round 2, did supervisors ever discourage valid but ‘weird’ moves (like E→C)? Why?"*  
     - → Link to process supervision: Defining "steps" can bias AI toward human-like solutions.  

  3. **Efficiency vs. creativity**:  
     - *"Which round had more *successful paths*? Which had more *exploration*?"*  
     - → Outcome: Fewer successes, more random guesses.  
     - → Process: More successes, but fewer novel paths.  

  **Contested Claims to Highlight**:  
  - "Does process-based *always* stifle creativity? (Some argue it can aid exploration if steps are flexible.)"  
  - "Is outcome-based *inherently* sample-inefficient? (With smart exploration, it might not be.)"  

  ---

  ### **Limitations & Caveats**  
  1. **What the game can’t replicate**:  
     - **Scale**: Real AIs explore millions of paths; this is a tiny search space.  
     - **Step ambiguity**: Supervisors here have clear rules; real process supervision often faces fuzzy "step" definitions.  
     - **Supervisor fallibility**: Human supervisors in reality make mistakes (e.g., invalidating a correct move).  

  2. **If this feels artificial**:  
     - **Alternative activity**: Run a **"math proof" task** where learners derive an equation. Outcome-based groups get feedback only on the final answer; process-based groups get feedback on each step. Use index cards for equation steps.  

  ---

  ### **Why This Works**  
  - **Learners experience**: Outcome-based frustration (credit assignment) and process-based rigidity (anchoring).  
  - **Supervisors confront**: The tension between guiding (process) and judging (outcome).  
  - **Minimal setup**: Grid rules are easy to grasp; index cards handle moves/feedback.  

  **First-run tip**: Emphasize the "valid but weird" shortcut (`E→C`)—many will miss it, proving the point!
