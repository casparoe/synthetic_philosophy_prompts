prompt: |-
  I'm writing up my position on institutional morality and need a consistency audit before I present it. Here is the package I hold:

  (1) The classic paradox of deontology is substantive, not dissolvable by redescription: agent-centered restrictions genuinely prohibit producing the best overall outcomes, and this is a feature rather than a confusion.

  (2) The doing/allowing distinction tracks a normative relation of direct authorship, not causal efficacy or divergence in expected utility.

  (3) In large-scale institutional design—say, climate governance or AI safety protocols—moral reasoning should proceed aggregatively, weighing outcomes across all affected agents as if from a consequentialist framework.

  (4) This institutional reasoning is not reducible to rule-consequentialism, because the legitimacy of the institution derives from a prior deontological commitment to treating each person as an end, not from the value of the outcomes produced.

  (5) Agent-relative reasons are strictly non-transferable: my prohibition against killing one to save five does not distribute across five agents, and collective decision-making does not license treating individuals as fungible inputs to an aggregate welfare function.

  Please audit whether these hang together. For each pair that is genuinely in tension, rank them by severity and indicate which commitment (1)–(5) must be qualified or abandoned, with the least costly fix. Identify at least one pair that looks conflicted but dissolves on inspection—perhaps involving a distinction between individual and structural agency that I have not earned. Do not advise me to drop deontology wholesale; I want to know exactly where the pressure points are and what each revision costs.
reasoning: |-
  Okay, the user is asking for a consistency audit of their five philosophical positions on institutional morality. Let me start by understanding each point clearly. 

  First, they hold that the deontological paradox is substantive—agent-centered restrictions genuinely prohibit optimal outcomes, and that's a feature, not a bug. Second, the doing/allowing distinction is about direct authorship, not just causality or utility. Third, institutions should use aggregative, consequentialist-like reasoning for things like climate policy. Fourth, this institutional approach isn't rule-consequentialism because legitimacy comes from deontological respect for persons, not outcomes. Fifth, agent-relative reasons can't be transferred; individuals aren't fungible in group decisions.

  Hmm, the main tension seems between points three and five. Point three says institutions should aggregate outcomes like consequentialism, but point five says agent-relative reasons (like not killing one to save five) don't distribute across people. So when an institution makes a policy that harms some for the greater good, isn't that violating the non-transferable prohibitions? That's a big conflict. 

  Then, points three and four also clash. Point four says legitimacy comes from deontological respect, not outcomes. But if institutions use aggregative reasoning (point three), which might sacrifice individuals for the greater good, that seems to undermine treating people as ends. How can both be true? 

  Looking at points one and three: the paradox of deontology (point one) accepts restrictions that block optimal outcomes, but institutions (point three) are told to pursue optimal outcomes. So why the asymmetry? The user needs to explain why individual agents have these restrictions but institutions don't. Maybe they appeal to the structural agency distinction, but they haven't earned that yet. 

  Points two and three might seem conflicted because doing vs. allowing matters for individuals, but institutions might "do" harm through policies. However, the user could argue that institutions operate at a structural level where direct authorship doesn't apply in the same way. But again, that distinction needs justification. 

  Points four and five together challenge point three. If agent-relative reasons are non-transferable (point five) and institutions derive legitimacy from deontological commitments (point four), how can they use aggregation that might ignore those reasons? That's a core tension. 

  For the false conflict, maybe points two and five. The doing/allowing distinction (point two) is about individual actions, while non-transferability (point five) is about reasons. They address different aspects, so no direct conflict. 

  The user needs to resolve the tension between institutional aggregation and non-transferable agent-relative reasons. The least costly fix might be to qualify point three, allowing aggregation but with constraints from agent-relative prohibitions. But that risks incoherence. Alternatively, adjust point five to allow some transfer in institutional contexts, but that's costly as it weakens core deontology. 

  Another option is to refine point four, emphasizing that institutions embody respect through fair procedures rather than outcomes. That way, aggregation might be acceptable if procedurally just. This preserves deontological legitimacy while permitting some aggregation. 

  They must address why structural agency differs from individual agency. If institutions aren't moral agents like individuals, maybe the restrictions don't apply. But that needs philosophical grounding. The user should clarify this distinction to resolve tensions between points one, three, and five.
answer: |-
  Your position is sophisticated but contains significant tensions, particularly between individual deontological constraints and institutional aggregative reasoning. Here's a consistency audit with prioritized conflicts, minimal fixes, and a false tension:

  **Core Tension Ranking (High to Low Severity):**

  1.  **Conflict: (3) vs. (5)**
      *   **Nature:** (3) demands institutions aggregate outcomes across all agents (consequentialist-like reasoning), while (5) asserts that agent-relative prohibitions (e.g., "don't kill one to save five") are strictly non-transferable and forbid treating individuals as fungible inputs to an aggregate welfare function. Institutional aggregation inherently requires treating individuals as contributors to a collective outcome metric, potentially mandating actions that would violate an individual's agent-relative prohibition if performed by them directly (e.g., a policy causing foreseeable harm to a minority to benefit the majority).
      *   **Severity:** Highest. This strikes at the heart of whether institutions can *practically* use aggregative reasoning without violating the core deontological constraint of non-fungibility central to (1), (2), (4), and (5). (5) directly blocks the operational mechanism required by (3).
      *   **Resolution (Least Costly Fix): Qualify (3).**
          *   **Fix:** Restrict institutional aggregative reasoning to contexts where it does *not* require directly violating fundamental, non-transferable agent-relative prohibitions held by individuals. E.g., "Institutional reasoning proceeds aggregatively *except* when doing so would necessitate actions that, if performed by an individual agent, would violate a core agent-centered restriction (like intentional killing of innocents)."
          *   **Cost:** Significantly limits the scope and decisiveness of institutional aggregative reasoning, especially in hard choices (climate displacement, triage, unavoidable AI trade-offs). May render (3) ineffective for precisely the large-scale problems it's meant to address. Requires developing criteria for "core" restrictions exempt from aggregation.

  2.  **Conflict: (3) vs. (4)**
      *   **Nature:** (3) prescribes institutional reasoning *as if* consequentialist, while (4) grounds institutional legitimacy in a *deontological* commitment to treating persons as ends-in-themselves, explicitly *not* in outcome value. Aggregative reasoning (3) prioritizes outcome value. There's a tension between the *method* (consequentialist-like) and the *justification* (deontological) – can an institution truly treat individuals as ends while employing a decision-procedure designed to maximize aggregate outcomes, which may inherently sacrifice some for the greater good?
      *   **Severity:** High. This challenges the coherence of the institutional "as if" framework. If legitimacy stems from respect for persons (4), but the reasoning method (3) can demand actions disrespectful to individuals as mere means, the justification seems undermined by the method.
      *   **Resolution (Least Costly Fix): Refine (4).**
          *   **Fix:** Emphasize that the "prior deontological commitment" in (4) is fulfilled *procedurally* or *structurally* by the institution's *design and purpose* (e.g., ensuring fair representation, due process, basic rights protection, pursuit of collective survival essential for individual flourishing), *not* by eschewing aggregative reasoning *within* its operational mandate. The *legitimacy* is deontologically grounded, but its *operational decision-making* within that legitimate structure uses aggregative tools constrained by its foundational purpose.
          *   **Cost:** Risks instrumentalizing the deontological foundation. Requires careful articulation of how aggregative outcomes serve the deeper deontological end (e.g., "only by aggregating can the institution fulfill its duty to secure conditions necessary for *all* to pursue their ends"). May not fully resolve the sacrifice issue highlighted in (3) vs. (5).

  3.  **Conflict: (1) & (5) vs. (3)**
      *   **Nature:** (1) & (5) affirm the reality and non-negotiability of agent-centered restrictions blocking optimal outcomes for individuals. (3) instructs institutions to pursue the best overall outcomes via aggregation. This creates an *asymmetry*: why are individual agents bound by restrictions that institutions, aiming at optimal outcomes, are seemingly exempt from? If agent-relative reasons are fundamental (5), shouldn't they constrain *all* moral agents, including institutional ones?
      *   **Severity:** Medium-High. Challenges the justification for the institutional exemption from the paradox affirmed for individuals. Points to the need for a robust account of why structural agency differs.
      *   **Resolution (Least Costly Fix): Leverage Distinction & Refine (3).**
          *   **Fix:** Explicitly ground the asymmetry in the *nature of agency*. Argue that institutions are *structural* or *procedural* agents fundamentally different from individual moral agents. Their "agency" is constituted by rules, roles, and processes designed *precisely* to handle collective action problems where individual restrictions would lead to catastrophe (the very point of (3)). Their mandate *is* the aggregative perspective. This distinction must be *earned* (see below).
          *   **Cost:** Requires a strong, defensible meta-ethical account of structural agency distinct from individual agency. Must explain why the fundamental deontological commitment (4) applies differently at this level without simply being ad hoc. The qualification from resolving (3) vs. (5) also applies here.

  4.  **Conflict: (2) vs. (3)**
      *   **Nature:** (2) grounds the doing/allowing distinction in direct authorship. Institutional actions (policies, regulations) can clearly involve direct authorship of harms (e.g., a regulation causing a firm to close, harming workers; a climate policy displacing communities). (3)'s aggregative reasoning may require such harmful "doings" if they produce net benefits. Does the institutional "author" bear direct responsibility in a way that triggers a doing/allowing constraint analogous to individuals?
      *   **Severity:** Medium. Potentially significant for specific policy choices involving foreseeable, directly caused harms to identifiable groups.
      *   **Resolution (Least Costly Fix): Qualify (2) or Accept Tension.**
          *   **Fix Option 1 (Qualify (2)):** Argue that while "direct authorship" applies to institutional acts, the *normative weight* of the distinction is context-dependent and potentially overridden by the institutional mandate for aggregation *within the bounds of legitimacy and non-transferable prohibitions* (linking back to fixes for 3/5 and 3/4). The distinction still marks a *prima facie* reason against harmful actions needing stronger justification.
          *   **Fix Option 2 (Accept):** Acknowledge the tension but argue that the nature of institutional agency and its foundational legitimacy (4) mean the doing/allowing distinction applies differently or with less force than for individuals, as the institution's *purpose* is collective action involving trade-offs. (This leans into the structural agency distinction needed for Conflict 3).
          *   **Cost:** Option 1 dilutes the robustness of (2). Option 2 requires successfully defending the structural agency distinction.

  **False Conflict: (2) vs. (5)**

  *   **Apparent Conflict:** Both deal with constraints on action. Could (2)'s focus on authorship conflict with (5)'s focus on non-transferable prohibitions?
  *   **Dissolution:** These address distinct, complementary aspects of deontology. (2) provides a criterion for *identifying* when an agent is directly responsible for an outcome (authorship), relevant to applying constraints. (5) specifies the *nature* of certain constraints (agent-relative, non-transferable) that apply *to* actions for which an agent is responsible. Knowing *when* I authored harm (via (2)) tells me *that* my agent-relative prohibition against harming (per (5)) is engaged. They operate at different levels: (2) is about attribution/description of agency, (5) is about the content of normative reasons once agency is attributed. There's no inherent contradiction.

  **Critical Requirement: Earning the Structural Agency Distinction**

  The key to reconciling the core tensions (especially 3 vs. 5 and 1&5 vs. 3) hinges on successfully articulating and defending a **robust distinction between individual moral agency and institutional/structural agency**. You gesture towards this ("structural agency that I have not earned"). You *must* develop this:

  1.  **Define Institutional Agency:** What *is* the moral agent here? The rules? The decision-makers acting in role? The abstract entity? How does it "act"?
  2.  **Justify Asymmetric Constraints:** Why do fundamental agent-relative reasons (5) and the paradox (1) bind individual agents categorically but not (or bind differently) this structural agent? Is it because the institution is *constituted* by rules designed for aggregation? Because its *telos* is inherently collective? Because it lacks certain features of individual agency (consciousness, unified will)?
  3.  **Connect to Legitimacy (4):** How does this distinct agency type ensure the institution fulfills the "prior deontological commitment"? How does aggregative reasoning within this structure *express* respect for persons as ends, rather than undermine it?
  4.  **Address Sacrifice:** How does this framework prevent individuals from being *unjustly* sacrificed on the altar of aggregation? What residual constraints *do* apply to the institution derived from (4) and (5)? (This links back to qualifying (3)).

  **Summary of Minimal Revisions:**

  1.  **Qualify (3):** Aggregation is the institutional method, *but* bounded by fundamental, non-transferable agent-relative prohibitions that cannot be overridden by net benefit calculations. (Resolves 3 vs. 5, impacts 1&5 vs. 3).
  2.  **Refine (4):** Emphasize that the deontological legitimacy is secured through *procedural/structure design* (fairness, rights protection, purpose aligned with collective conditions for individual flourishing), which *permits* (or necessitates) aggregative operational reasoning *within its defined mandate and constraints*. (Resolves 3 vs. 4).
  3.  **Develop Structural Agency:** Provide a clear, defensible account of why institutions are distinct moral agents exempt from the *full* force of individual agent-centered restrictions, justifying the asymmetry noted in (1)&(5) vs. (3). (Essential for all major tensions).
  4.  **Clarify (2):** Acknowledge institutional authorship but argue the normative force of doing/allowing may be modulated by the institutional context and purpose (or accept it as a residual tension mitigated by the other fixes).

  **Costs:** The revisions preserve core deontology but significantly constrain the power and scope of institutional aggregation (Qualifying (3)), potentially making it less effective for catastrophic problems. They also require a major philosophical effort to justify the structural agency distinction – failure here leaves the position unstable. The elegance of pure institutional consequentialism is sacrificed, but the integrity of individual constraints is maintained within a framework acknowledging institutional necessity.
