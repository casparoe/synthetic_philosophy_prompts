prompt: |-
  hey — I'm in a small reading group on political obligation (we're working through the usual candidate grounds for a duty to obey the law: consent, fair play, the natural-duty move, and the objections to each — no fixed text) and I built an argument to shut my friend up and now it's shutting me up instead. He says civil disobedience is just lawbreaking with better PR and no special moral status. I said no, the injustice of the law is what makes it a distinctive, sometimes-justified kind of breach — and then I wrote down the following, which seems to prove his side. Please act like a political philosopher who's taught this material for years, brainstorm for a second on which steps look safe to you before committing, and tell me honestly which one you'd give up. Also: don't send me to papers, we've got no library access and no reliable internet in the room.

  (1) There is at least a natural duty to support and not to undermine institutions that are reasonably just, because they secure goods — peace, coordination, predictable enforcement of rights — that nobody could secure alone, and the cost to me of doing my part is small.
  (2) A legal order yields those goods only given general compliance; a system where each person complies only when she independently approves the particular law isn't a legal order at all.
  (3) A duty to help secure a good includes a duty to do one's part in producing it, and general compliance is nothing but the sum of individual acts of compliance — so the natural duty includes my complying with the law.
  (4) What makes my compliance do any work is not that this particular law is just, but that there is a standing coordinative practice of compliance; so the duty in (3) is content-independent, and it doesn't get weaker when the particular law is unjust — only when the system as a whole stops being reasonably just.
  (5) So I have a duty to obey unjust laws too, and civil disobedience always starts out as a breach of duty whose wrongness is not reduced by how unjust the target law is.
  (6) And since the wrong is a wrong against the legal order as such, the disobedient owes full submission to the penalty, and how serious the injustice is remains strictly beside the point: on this reasoning, sitting in at a segregated lunch counter is, before any balancing, no less wrongful than quietly dodging a parking fine.
  (7) But then the category "civil disobedience" does no work: the injustice of the law is supposed to be what makes it distinctive and sometimes justified, and here it never enters. Worse, the case for disobeying doesn't get stronger as the injustice gets worse. That's absurd.

  I'd rather keep (1) and (7) than anything in the middle. So: which step do you reject, why did that step look fine when I wrote it, and what does rejecting it cost me? Specifically — if I reject (3), do I also lose any story about why I owe taxes or jury service or why free-riding is wrong; if I reject (4), can I still say the duty to obey is content-independent in any sense people care about; and if instead I go for (1)'s "reasonably just" qualifier, does the whole argument quietly assume what's at issue? Also tell me the second step you'd reach for if I forced you to keep your first choice, and say whether there's a separate, independent over-generation problem here — it looks to me like the same reasoning hands me a content-independent duty to obey my employer's staff handbook, and I really don't want that.
reasoning: |-
  Okay, let me approach this systematically. The user presents a tightly constructed argument challenging the moral distinctiveness of civil disobedience, and they're clearly frustrated that their own reasoning now undermines their initial position. 

  First, I notice the argument hinges on a content-independent obligation derived from natural duty theory - a classic move in political obligation debates. The user's distress is palpable in how they describe being "shut up" by their own logic, especially since they seem personally invested in defending civil disobedience as morally significant. 

  The core tension lies between steps (3) and (7): if compliance is indeed our duty precisely because it's part of a general practice (3), then the injustice of particular laws becomes irrelevant (7). But this leads to absurd conclusions where segregated lunch counter protests are morally equivalent to parking fine evasion. 

  When examining step (4), its flaw becomes apparent. It conflates the necessity of general compliance with the necessity of each individual's compliance. This is a common slippage - what game theorists call the "fallacy of division." The system requires sufficient compliance, not universal compliance. 

  Rejecting (4) preserves what matters: we can still maintain content-independence for reasonably just systems overall while allowing that particularly unjust laws create "compliance gaps." The duty weakens at the point of application when a law directly perpetrates injustice. This doesn't collapse into anarchism because the duty reactivates for laws not directly unjust. 

  The employer handbook objection is smart but distinguishable: workplaces lack the monopoly on legitimate coercion and the comprehensive social goods provision that define state institutions. The natural duty argument properly applies only to the latter. 

  What surprises me is how elegantly this resolves without abandoning natural duty theory's core insights. The user gets to keep their foundational premises while avoiding moral absurdities - and importantly, preserves civil disobedience as a conceptually distinct category.
answer: |-
  Your argument is admirably tight, but I'd reject **Step (4)** as the core flaw. Here's the breakdown:

  ### Why Reject (4)?
  - **The Mistake:** (4) conflates the *system's dependence on general compliance* with a claim that *my specific act of compliance is always necessary to sustain the system*. This is false. General compliance is a *threshold* phenomenon, not requiring *every* act. My skipping jury duty *once* (if replaced) or violating an unjust law *seldom* doesn't collapse the system. The duty requires me to *do my fair share* to *support* the system, not absolute, robotic obedience to every command regardless of context. The injustice of a *specific law* can make *my compliance with that law* cease to be part of my "fair share" of support for a reasonably just system.
  - **Why It Looked Fine:** You were correctly emphasizing that the *coordinative practice itself* is the source of the good, not the intrinsic merit of each law. The slippage happened in assuming that sustaining the practice requires *each individual act* of compliance, rather than a *sufficient level* of compliance maintained by the *general disposition* to comply.
  - **Cost:** Minimal to your core commitments. You keep:
      - Content-independence *in principle*: The duty to obey *arises* from the systemic role of law, not the content of each law. *But*, the *application* of the duty to a *specific act* can be *defeated* if obeying *that law* would actively *undermine* the justice the system is meant to secure (e.g., enforcing segregation). The duty's *ground* is content-independent; its *scope and strength* in particular instances are not entirely immune to content.
      - Your story on taxes/jury duty/free-riding: Fair-play still holds. Free-riding (systematically benefiting without contributing) *does* undermine the scheme. Paying taxes *generally* is part of your fair share. Refusing *one specific* tax earmarked for genocide might not be free-riding on the *just aspects* of the system; it might be refusing complicity in its *injustice*.

  ### Addressing Your Specific Concerns
  - **Keeping (1) & (7):** Done. The system must be "reasonably just" (1), and rejecting (4) allows the *degree* and *nature* of the injustice to matter for the *specific act* of disobedience (saving you from (7)'s absurdity).
  - **Content-Independence Preserved? Yes, but nuanced.** The *basis* of the duty (supporting just institutions) is content-independent. The *duty to obey a specific law* is *prima facie* content-independent. But this *prima facie* duty can be *overridden* when obeying would directly perpetrate or support a severe injustice that the system *should* prevent. It doesn't mean the duty weakens *gradually* with minor injustice; it means severe, specific injustice can create an *exception*.
  - **The "Reasonably Just" Qualifier:** It's crucial and *not* question-begging. The argument only applies *if* the system meets the threshold. Whether a *particular* system does is debatable, but the qualifier is a standard, necessary feature of natural duty accounts (Rawls, Waldron) – it avoids requiring support for manifestly tyrannical regimes. Your argument doesn't assume the conclusion; it relies on a premise you (and many) accept.

  ### Second Step I'd Reject (If Forced to Keep (4))
  If I *had* to keep (4), I'd reject **Step (3)**, specifically the leap from "duty to help secure the good" to "duty implies my complying with *every law* is my necessary part." This concedes too much. "Doing my part" could mean:
  *   Generally obeying the law.
  *   Supporting just institutions through other means (voting, advocacy, paying *most* taxes).
  *   *Not actively undermining* coordination/rights-protection.
  This preserves a *general* duty to obey, but allows that disobedience *focused on reforming injustice* might be compatible with "doing my part" to support a *more* just system in the long run. The cost is weakening the direct link between the duty and *each* act of compliance, making it more permissive than you might like regarding routine disobedience. You still have a strong case against *mere* free-riding or arbitrary lawbreaking.

  ### The Employer Handbook Problem (Over-Generation)
  Your instinct is right. The reasoning *as stated in (1)-(4)* would over-generate. **Rejecting (4) solves this too.**
  *   **Why it over-generates:** (1) could apply to any beneficial cooperative scheme (employer, club, condo board). (2) & (3) suggest compliance with *all* their rules is my "part." (4) says this duty is content-independent regarding their rules.
  *   **Why rejecting (4) blocks it:** The *state* is distinctive in (at least) two ways crucial for the *kind* of content-independent obligation you're after:
      1.  **Comprehensiveness & Monopoly on Force:** The state claims supreme, coercive authority over all aspects of life within a territory. My employer doesn't. The goods secured (basic rights, territorial peace) are qualitatively different and foundational.
      2.  **The "Natural Duty" Ground:** The natural duty (as usually construed - Rawls, "duty of justice") is primarily owed to *political* institutions securing *basic justice*, not to all beneficial schemes. My duty to my employer stems from consent, reciprocity, or specific roles, not a fundamental natural duty to support just institutions *simpliciter*.
  *   **Refined (1) Clarifies:** We can specify that the natural duty applies specifically to *political* institutions that provide the *basic framework* for justice and social cooperation on a societal scale. This excludes employers. The handbook analogy fails because the state's role is categorically different.

  ### Conclusion
  Reject **Step (4)**. The system requires *sufficient* compliance, not that *my compliance with every single law, no matter how unjust, is always my necessary contribution*. This allows the injustice of a *specific law* to matter for whether obeying *it* is part of my duty to support the *reasonably just system overall*. It preserves:
  *   The core of the natural duty argument (1, a qualified 3).
  *   Systemic necessity of law (2).
  *   The distinctiveness and potential justification of civil disobedience (saving you from 5,6,7).
  *   Content-independence in its strongest plausible form (duty's *basis* is systemic, not content-based).
  *   Your objections to free-riding.
  *   Avoids absurd equivalence (lunch counter vs. parking ticket).
  *   Avoids over-generating duties to obey employers.

  The cost is acknowledging that the duty to obey a *specific law* isn't *absolutely* immune to its content; severe, direct injustice can override it. But this is a feature, not a bug – it's what allows civil disobedience its distinctive moral character. Your friend's "lawbreaking with better PR" charge fails because the *justification* crucially hinges on the *specific injustice being protested* and the *aim of reforming the system*, not just PR.
