answer: |-
  Here’s the essay question, model answer, and marking scheme tailored to your requirements.

  ---

  **Essay Question**

  Aquinas defines tyranny as rule directed towards the ruler's private good rather than the common good (*De Regno* I.3). He permits a *community* to depose a tyrant if the resulting disorder is not worse than the tyranny itself (ST II-II Q.42 A.2 ad 3; Commentary on the Sentences* II, Dist. 44, Q.2, A.2). However, he explicitly forbids *private individuals* from killing a tyrant, reserving this action solely to public authority acting for the common good (ST II-II Q.64 A.3; *De Regno* I.6).

  Consider this scenario: A ruler governs blatantly for his own private benefit. He was installed by a distant, supreme authority (e.g., an Emperor or Pope), which consistently ignores all legitimate appeals and grievances from the suffering community. The *only* realistic way to remove this tyrant without triggering a devastating civil war is a targeted killing carried out by one private citizen acting alone. Extensive, reasoned analysis by community leaders and scholars universally concludes that the disorder following this single act would be significantly *less* harmful to the common good than allowing the tyranny to continue indefinitely.

  **Based strictly on Aquinas's *own principles* outlined above (definition of tyranny, the disorder calculus, and the distinction between public authority/community action vs. private initiative), does this extreme scenario commit Aquinas to permitting this private tyrannicide? Or do his principles demonstrate that his prohibition on private tyrannicide is absolute, even here? Defend your reasoning using Aquinas's core framework.**

  ---

  **Model Answer (Approx. 550 words)**

  Aquinas's absolute prohibition on private tyrannicide presents a profound tension when applied to this extreme scenario. While the case powerfully argues for the necessity and lesser-evil outcome of the private killing, a strict application of Aquinas's core principles suggests he would maintain the absolute ban, though the scenario exposes significant pressure points within his theory.

  Firstly, Aquinas's definition of tyranny fits perfectly: the ruler governs solely for private gain, neglecting the common good. This establishes the fundamental injustice of his rule, satisfying the first prerequisite for resistance in Aquinas's framework.

  Secondly, the disorder calculus appears strongly satisfied. Aquinas's primary condition for licitly removing a tyrant is that the resulting disorder must not be worse than the tyranny itself (ST II-II Q.42 A.2 ad 3). The scenario stipulates universal expert consensus that the targeted killing causes *less* disorder than enduring the tyranny. If Aquinas's principle is purely consequentialist regarding the common good, this seems to demand permission for the act. The lack of recourse to the installing authority – who bears guilt for perpetuating the tyranny by inaction (*De Regno* I.6) – removes the obvious licit path, seemingly leaving only illicit or ineffective options.

  However, Aquinas's third principle – the requirement for *public authority* – creates an insurmountable barrier for the private citizen, regardless of the apparent justification. Aquinas is unequivocal: killing a ruler, even a tyrant, is an act of judgment and punishment. This judgment belongs *only* to public authority acting for the community, not to a private person (ST II-II Q.64 A.3). He grounds this in the natural law order: just as only a judge can licitly execute a criminal, only duly constituted public authority can licitly depose or kill a ruler. A private individual usurps this authority, committing the sin of sedition by acting without the community's mandate, even if aiming for a good end (ST II-II Q.42 A.2). The act remains intrinsically disordered because it violates the fundamental principle of legitimate authority.

  The scenario's key challenge is that Aquinas links the *community's* right to depose directly to its ability to act through some representative public authority or process (*De Regno* I.6). Here, the installing higher authority blocks this mechanism. Does the community's inherent right to self-preservation against manifest injustice, implied in natural law, override the specific prohibition on *private* action? Aquinas might argue that the community's right persists, but its licit *exercise* is tragically paralyzed without a legitimate public channel. The private citizen, however well-intentioned, cannot *become* that legitimate authority by individual fiat. The act remains a private killing, not a public act of judgment.

  Furthermore, Aquinas harbors deep suspicion of private judgment in such matters, fearing it leads to anarchy, vendetta, or the killing of merely unpopular rulers (*De Regno* I.6). While the scenario attempts to mitigate this by stipulating universal consensus on the lesser disorder, Aquinas would likely argue this consensus doesn't magically confer public authority upon the private assassin. The judgment about the lesser disorder pertains to the *morality of removing the tyrant*, not to the *licitness of the method* used by a private person.

  **Conclusion:** While the extreme scenario powerfully leverages Aquinas's principle regarding disorder and the common good, it founders on his absolute insistence that the *authority* to judge and execute a ruler (even a tyrant) must be public, not private. The paralysis of legitimate public channels is a profound tragedy within Aquinas's system, highlighting a potential gap between the community's right and its practical ability to exercise it licitly. However, Aquinas's texts and core commitment to the necessity of public order and legitimate authority for acts of judgment suggest he would condemn the private killing as intrinsically unlawful sedition, even as a lesser-evil response to intolerable tyranny. His ban appears absolute in its application to private initiative.

  ---

  **Marking Scheme (Out of 20)**

  1.  **Accurate Framing of Aquinas’s Standard Position (4 marks):** Clearly states Aquinas’s definition of tyranny, the community's right to depose based on disorder calculus, and the absolute prohibition on *private* tyrannicide based on lack of public authority. *Common Mistake:* Conflating community action with private action or misstating the prohibition.
  2.  **Application of the Disorder Calculus (4 marks):** Correctly analyzes how the scenario meets Aquinas’s condition (lesser disorder) and the significance of the higher authority's inaction. *Common Mistake:* Ignoring the stipulated lesser disorder or failing to connect it to Aquinas's principle.
  3.  **Engagement with Public/Private Authority Distinction (5 marks):** Thoroughly explains why the act remains private (usurping public judgment/punishment), links this to Aquinas's natural law argument (judge vs. private individual), and addresses the community's paralyzed agency. *Common Mistake:* Assuming "lesser evil" or "community benefit" overrides the authority requirement without addressing Aquinas's specific reasoning on *who* can act.
  4.  **Recognition of Natural Law Tension/Community Right (4 marks):** Acknowledges the tension between the community's natural right/duty to preserve itself and the lack of licit means, and/or discusses Aquinas's fear of anarchy/private judgment. *Common Mistake:* Ignoring the potential natural law argument for community self-preservation or dismissing Aquinas's concerns about precedent/slippery slope.
  5.  **Balanced Conclusion (3 marks):** Clearly states whether Aquinas's principles commit him to permission (No) or show the ban is absolute (Yes), acknowledging the scenario's challenge while grounding the final judgment firmly in the public/private authority principle. *Common Mistake:* Concluding based solely on lesser evil without resolving the authority issue, or stating the conclusion weakly.

  ---
  This package gives you a rigorous question pushing beyond rote answers, a model demonstrating the required depth using Aquinas's core framework, and a clear, focused marking scheme aligned to key analytical points. You can easily adjust the length of the model answer or tweak the marking weightings.
