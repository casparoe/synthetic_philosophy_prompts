answer: |-
  Here’s a taxonomy focused on concrete disagreements, built as a decision tree with diagnostic questions. Critiques branch based on **where the fundamental failure starts** and **how earning-to-give specifically fails** (if it does), landing on distinct "awkward commitments."

  **1. The Diagnostic Tree (400 words)**

  *   **Q1: Is EA's core failure driven primarily by the *quantification of impact*?**
      *   **Yes (Quantification Path):** Quantification inherently distorts moral reasoning or action.
          *   **Q1a: Does this distortion manifest as *moral licensing* (earning/giving buys "indulgences" for other choices)?**
              *   **Yes:** Quantification creates tradable moral credits, corrupting intent.
              *   **No:** Quantification distorts cause selection/action, but *not* primarily via personal licensing (e.g., it commodifies values or ignores hard-to-measure goods).
      *   **No (Structural Path):** The core failure lies in EA's structure/incentives, not quantification itself.
          *   **Q2: Does this structural failure start with concentrated *funding pools* distorting the epistemic community?**
              *   **Yes (Funding Corruption Path):** Major funders dictate research priorities/cause validity, creating echo chambers.
              *   **No:** Funding isn't the primary distorting force.
                  *   **Q3: Does EA collapse primarily due to *career capital substitution*?** Skills built for current priority causes become useless if priorities shift, trapping the community.
                      *   **Yes:** EA’s human capital becomes obsolete upon cause-pivot, causing collapse.

  *   **Q4 (For critiques targeting earning-to-give): Why does earning-to-give fail?** (Applies to paths where it's relevant, often branching from prior answers)
      *   **A: *Career substitution risk*:** Optimizing for high-income skills makes individuals useless if their cause-priority is wrong (skills don't transfer to new causes).
      *   **B: *Normalization of extreme disparity*:** Participating in/extracting wealth from harmful systems to fund EA legitimizes those systems, undermining EA's moral goals.

  **2. The Leaves & Their Awkward Commitments (200 words)**

  1.  **Moral Licensing Core:** *You must commit that any system quantifying "good" inherently corrupts moral motivation by turning virtue into a currency.* (From: Q1:Yes & Q1a:Yes)
  2.  **Quantification Distortion (Non-Licensing):** *You must commit that measurable impact inevitably crowds out vital but unquantifiable values, making EA structurally blind to crucial moral domains.* (From: Q1:Yes & Q1a:No)
  3.  **Funding Pool Epistemic Corruption:** *You must commit that concentrated EA funding inevitably perverts cause prioritization research into justifying donor preferences, making genuine self-correction impossible.* (From: Q1:No & Q2:Yes)
  4.  **Career Capital Substitution Collapse:** *You must commit that EA inevitably trains its talent for current priorities, leaving the movement incapable of pivoting when evidence demands it, guaranteeing obsolescence.* (From: Q1:No & Q2:No & Q3:Yes)
  5.  **E2G: Career Substitution Risk:** *You must commit that "earning-to-give" optimizes individuals for financial extraction at the cost of developing cause-relevant skills, leaving them helpless if their chosen cause fails.* (Applies as a specific failure mode, often linked to Leaf 4 or standalone)
  6.  **E2G: Normalizes Disparity:** *You must commit that "earning-to-give" requires participating in morally toxic systems, functionally endorsing them and negating the net good of the donations.* (Applies as a specific failure mode)
  7.  **Rejection of Standard Critiques:** *You must commit that EA fails despite avoiding moral licensing, quantification bias, and funding corruption, collapsing solely because its *optimized human capital* becomes obsolete upon cause-shift.* (Leaf 4 restated as distinct for emphasis).

  **3. Empty Spots & Separation Failures (200 words)**

  *   **Empty Spots:**
      *   **"Structural Path" without Funding Corruption *or* Career Capital:** What *other* structural mechanism causes collapse? (Q1:No, Q2:No, Q3:No). This feels **unexplored** – critiques usually latch onto funding or human capital. A "bureaucratic ossification" path might fit here but isn't prominent.
      *   **Strong Quantification Critique that *Supports* Earning-to-Give:** If quantification is corrupting, why would its application to wealth generation/donation be valid? (Q1:Yes + Endorsing E2G). Seems **incoherent** – the core critique undermines the tactic.
      *   **Funding Corruption *without* Quantification Issues:** Can concentrated funding distort without quantification enabling it? (Q1:No & Q2:Yes). Possible, but **ugly** – funding power could distort via prestige/punishment without metrics, but quantification likely amplifies it.

  *   **Separation Failures:**
      *   **Moral Licensing (Leaf 1) vs. Normalizes Disparity (Leaf 6):** Hard to separate *cleanly*. Moral licensing focuses on the *individual's* internal moral accounting. Normalizing disparity focuses on the *systemic* legitimization of harmful structures. However, participating in disparity *enables* the licensing (you need the wealth to buy credits), and the act of participation *is* the normalization. The tree splits them based on the *primary* locus (internal credit vs. external system effect), but they deeply intertwine.
      *   **Career Substitution Risk (Leaf 5) & Career Capital Collapse (Leaf 4/7):** These are different scopes (individual vs. movement) of the same core mechanism. The tree isolates them (Leaf 5 for E2G individuals, Leaf 4/7 for the movement) because the *focus* of the critique differs, but the underlying driver (skills optimized for specific causes) is shared. They are logically adjacent, not truly separable concepts.

  This tree forces positions into concrete, often uncomfortable, statements about *why* EA fails fundamentally and *what specific mechanism* is to blame, cutting through labels to the underlying disagreements.
