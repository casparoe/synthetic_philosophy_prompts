answer: |-
  Your inquiry cuts to the heart of intergenerational ethics, demanding rigor beyond rhetorical tropes. Below is a structured analysis of the **desiderata** (necessary features) for a coherent theory of transgenerational collective culpability, grounded in conceptual necessity and real-world cases. I'll then address tensions and evaluate major approaches against these criteria.

  ---

  ### **Core Desiderata for a Coherent Theory**
  *(Each rooted in phenomena, distinctions, or cases that expose theoretical inadequacies)*

  1. **Explain Persistent Obligations Despite Population Turnover**  
     - **Phenomenon**: Why do modern states apologize/reparate for slavery, colonialism, or genocide centuries later?  
     - **Requirement**: Must explain obligations persisting after *all* direct perpetrators/victims die, without metaphysical continuity.  
     - **Why Necessary**: Otherwise, obligations vanish at generational turnover (e.g., post-1945 Germany escapes all guilt once Nazis die), contradicting widespread moral intuitions and practices (e.g., German reparations to Israel).

  2. **Distinguish Blame from Burden**  
     - **Distinction**: Inheriting *liability* for rectifying harm (e.g., polluted land) vs. inheriting *culpability* (moral blameworthiness).  
     - **Requirement**: Theory must separate burdens (reparative duties) from blame (personal fault).  
     - **Why Necessary**: Conflation leads to punishing innocents for ancestors' sins (unjust) or absolving collectives of all responsibility (inadequate). Descendants may bear burdens without being blameworthy.

  3. **Account for Differential Responses to Historical Wrongs**  
     - **Phenomenon**: Why apologize for colonialism but not for every historical war? Why reparations for slavery but not medieval conquests?  
     - **Requirement**: Must identify conditions making some wrongs "live" (e.g., ongoing structural harm, cultural memory) versus "closed."  
     - **Why Necessary**: A theory blaming all past wrongs equally is implausible; one blaming none ignores special obligations (e.g., Native American dispossession vs. Norman Conquest).

  4. **Preserve Institutional vs. Cultural Continuity**  
     - **Distinction**:  
       - *Institutional continuity*: Persistent entities (states, corporations) with formal rules.  
       - *Cultural continuity*: Shared identity/memory without formal structure (e.g., diaspora groups).  
     - **Requirement**: Theory must treat these differently, as obligations may attach to institutions but not unstructured groups.  
     - **Why Necessary**: A nation with identical institutions but new population (e.g., modern Turkey vs. Ottoman Empire) may retain duties, while a reconstituted cultural group (e.g., Neo-Assyrians) likely does not.

  5. **Address Repudiation and Dissolution/Reconstitution**  
     - **Cases**:  
       - *Active repudiation*: Descendants publicly condemn ancestors' acts (e.g., white Germans rejecting Nazism).  
       - *Dissolution/reconstitution*: A collective dissolves, later revives under same name (e.g., Poland post-1795 partitions).  
     - **Requirement**: Must clarify if repudiation mitigates obligations, and if reconstituted collectives inherit prior debts.  
     - **Why Necessary**: Repudiation tests whether guilt is "inherited" or tied to ongoing endorsement; dissolution tests the necessity of unbroken identity.

  6. **Avoid Metaphysical Mysteries & Statistical Reductionism**  
     - **Constraint**:  
       - No supra-individual "group soul" persisting across generations.  
       - No reduction to individual guilt (to prevent evaporation at membership turnover).  
     - **Why Necessary**: Metaphysical claims are empirically ungrounded; reductionism ignores collective agency and perpetuated structures.  
     - **Tension**: If guilt requires agency, and collectives lack diachronic identity, how can guilt persist? *This is the central challenge*.

  ---

  ### **The Core Tension: Can All Desiderata Be Satisfied?**
  **No.** Desiderata (1) and (6) are *jointly unsatisfiable* under traditional guilt frameworks:  
  - **Guilt** presupposes *agency* and *fault*.  
  - If the collective is not a metaphysically continuous agent (per 6), it cannot bear guilt.  
  - If guilt is reduced to individuals (per 6), it evaporates when they die (violating 1).  
  - **Resolution**: Theories must abandon *moral guilt* for later generations and refocus on **forward-looking responsibilities** (e.g., rectifying enduring harm) or **institutional liability** (obligations binding successor entities).

  ---

  ### **The Most Damaging Requirement**
  **#2 (Distinguish Blame from Burden)** devastates popular theories:  
  - **Individualist Analogies** (nations = persons): Imply descendants inherit blame, violating the blame/burden distinction.  
  - **Distributed Liability Models** (guilt shared across members): Treat reparations as "debts" implying fault, punishing innocents.  
  - **Institutional Accounts** survive best by focusing on obligations sans blame, but struggle with cultural groups lacking formal structure.

  ---

  ### **Scoring Major Theories Against Desiderata**
  | **Theory**               | **Persistent Obligations (1)** | **Blame vs. Burden (2)** | **Differential Responses (3)** | **Institutional vs. Cultural (4)** | **Repudiation/Dissolution (5)** | **No Metaphysics/Reductionism (6)** |  
  |--------------------------|--------------------------------|--------------------------|--------------------------------|-----------------------------------|--------------------------------|-------------------------------------|  
  | **Individualist Analogies** | ❌ (evaporates)               | ❌ (conflates)            | ❌ (no selectivity)           | ❌ (ignores institutions)        | ❌ (repudiation irrelevant)    | ❌ (requires group personhood)      |  
  | **Distributed Liability** | ⚠️ (if debt-like)            | ❌ (burden = blame)       | ⚠️ (arbitrary)               | ⚠️ (applies unevenly)          | ⚠️ (repudiation may not matter)| ❌ (reduces to aggregate debt)     |  
  | **Institutional Continuity**| ✅ (binds successors)        | ✅ (burden ≠ blame)      | ✅ (if harm ongoing)         | ✅ (institutions only)          | ✅ (dissolution ends duties)   | ✅ (no metaphysics)               |  
  | **Structural Injustice Models** | ✅ (via systems)          | ✅ (burden ≠ blame)      | ✅ (tracks impact)           | ⚠️ (cultural groups weak)      | ⚠️ (repudiation may not help)  | ✅ (no reductionism)              |  

  **Notes**:  
  - **Institutional/Structural theories** fare best but fail for non-institutional groups (e.g., cultural diaspora).  
  - No theory fully satisfies (5): Reconstitution/repudiation cases fracture all models.  
  - **Best candidate**: Hybrid "structural-institutional" account focusing on *persistent harm, institutional inheritance, and forward-looking duties*—not guilt.  

  ---

  ### **Conclusion: A Viable Path Forward?**
  A coherent theory must:  
  1. **Reject transgenerational moral guilt** (unsatisfiable without metaphysics).  
  2. **Anchor obligations in**:  
     - Enduring structural harm (e.g., racial wealth gaps from slavery).  
     - Institutional continuity (states/corporations as duty-bearers).  
     - Unjust enrichment or inherited capacities (e.g., resources gained via colonialism).  
  3. **Limit applicability** to cases with **demonstrable ongoing impact**, distinguishing burdens (reparable) from blame (non-transferable).  

  This satisfies most desiderata while respecting your constraint: No mystical "national soul," no blaming innocents, yet obligations persist via institutions and structures. Repudiation or dissolution may mitigate duties if harm is severed; if not, the obligation remains—not as guilt, but as rectificatory justice. The tension between (1) and (6) forces this pivot from *guilt* to *responsibility*—a shift from the past to the future.
