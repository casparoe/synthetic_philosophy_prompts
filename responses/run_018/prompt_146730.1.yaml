prompt: |-
  I've come to think that in cases of epistemic akrasia, you should always defer to your higher-order belief that you're being irrational, even when that higher-order belief is supported by reasoning you have indepandant first-order reasons to distrust. What would actually count against this view? I don't mean just "sometimes tired people are right" — I want the structural defeaters, like whether it collapses when the higher-order judgment is itself generated by the unreliable process it's diagnosing. Has this position been qualified into unfalsifiability, and if so is that a problem? Please rank the objections from fatal to merely awkward.
