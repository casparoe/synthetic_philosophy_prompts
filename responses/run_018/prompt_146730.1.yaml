  Then there's the issue of regress. If you always defer to higher-order beliefs, but those could themselves be irrational, you end up in an infinite regress. That could collapse the system. And what about cases where the first-order evidence is actually strong, but the higher-order doubt is based on something flimsy? Deferring might lead to akrasia that's worse.

