answer: |-
  ### Activity Design (approx 250 words)  
  Split the 14 students into five triads (two groups of three and three groups of four, with the fourth member in larger groups acting as an extra observer). Each triad has three hidden roles:  
  - **Informed**: Knows the agent uses a deterministic algorithm (e.g., "Always prioritise minimising Observer losses; if equal, favour the Observer with fewer points"). Must not reveal this until Phase 2.  
  - **Agent’s Proxy**: Represents the artificial agent. Given a "decision guide" (the hidden algorithm) and told to "act in the agent’s best interests". Makes choices in scenarios.  
  - **Observer(s)**: Start with 10 reputation points (tokens). Points fluctuate based on the agent’s choices. Told to react "naturally" to gains/losses (e.g., express gratitude for point gains, resentment for losses).  

  **Materials**:  
  - Role cards (one per student, detailing secret instructions).  
  - Scenario cards (five per group; e.g., "Resource Allocation: Distribute 15 reputation points between Observers. Options: A) Observer 1 gets 10, Observer 2 gets 5; B) Equal split; C) Observer 1 gets 3, Observer 2 gets 12").  
  - Reputation tokens (paper chits).  
  - Algorithm reveal card (shown midway).  

  **Timeline**:  
  - **0–10 mins**: Intro and role assignment. Explain: "You’ll interact with an artificial agent via proxies. Observers, protect your points; react honestly."  
  - **10–35 mins (Phase 1)**: Three scenarios. Per scenario:  
    - Groups read scenario card (1 min).  
    - Agent’s Proxy chooses an option using their guide (2 mins).  
    - Observers adjust points and react (e.g., "Why did you disadvantage me?") (3 mins).  
    - Informed stays silent, noting reactions.  
  - **35–40 mins**: Reveal. Facilitator announces: "The agent’s choices were determined by a fixed algorithm. Proxies, show your decision guides." Groups discuss briefly.  
  - **40–60 mins (Phase 2)**: Two final scenarios. Same format, but algorithm is public. Observers react knowing choices are predetermined.  
  - **60–70 mins**: In-triad reflection. Discuss: "How did your feelings toward the agent shift?"  

  ### Debrief and Mapping (approx 200 words)  
  Begin by asking triads: "When did resentment or gratitude feel strongest? When did it fade?" Map responses:  
  - **Pre-reveal reactions** (e.g., Observers blaming the Agent’s Proxy for unfair losses) mirror Strawson’s **participant attitude** – holding the agent "responsible" through emotions like indignation, even without free-will vocabulary.  
  - **Post-reveal collapse** (e.g., Observers shrugging off losses as "inevitable") mirrors adopting an **objective attitude** – seeing the agent as a causal mechanism, not a moral target.  
  Highlight the tension: Participants *felt* the agent "deserved" blame/praise initially, but this dissolved when determinism was exposed. Stress that this illustrates Strawson’s core argument – moral responsibility hinges on our relational stances (reactive attitudes), not libertarian free will. The agent’s deterministic nature didn’t preclude initial responsibility attributions; it was the *shift in perspective* that invalidated them. Ask: "Does responsibility require a metaphysically free agent, or just a participant stance?" Point out the activity suggests the latter: even a deterministic entity can be held responsible *if* we engage reactively. But emphasise that the reveal forced a stance shift, undermining this.  

  ### Limits and Honest Gaps (approx 150 words)  
  The activity can’t replicate the **natural, pervasive quality** of real-life reactive attitudes. Here, emotions are brief, scenario-bound, and self-conscious; in ordinary life, they’re involuntary, persistent, and tied to deeper relationships. This artificiality may dull the "sting" of resentment or warmth of gratitude. Predictable hiccups:  
  - Observers may **under-react** due to self-awareness ("It’s just a game"), weakening the tension.  
  - Agent’s Proxies might **deviate from the algorithm** if guides are ambiguous, muddying the reveal’s impact.  
  - Time pressure could **rush reactions**, leaving less room for attitude shifts.  
  **Mitigations**: Stress "immersion" in roles; use simple, unambiguous algorithms; have backup scenarios for fast groups. If emotions feel forced, acknowledge it in debrief: "Real reactive attitudes are harder to ‘turn off’ – that’s the gap."  

  ### Settled vs Contested (approx 150 words)  
  **Settled**: Strawson’s core framework is broadly accepted. Reactive attitudes (e.g., resentment) are empirically observable and central to responsibility practices. The participant/objective distinction is a useful tool – we *do* suspend reactive attitudes toward entities seen as deterministic (e.g., malfunctioning robots or brainwashed humans).  
  **Contested**: Whether this **resolves the free-will debate** is disputed. Compatibilists argue Strawson shows responsibility requires only reactive engagement (not libertarian free will). Incompatibilists retort that reactive attitudes *presuppose* genuine alternative possibilities, which determinism negates. Also contested: **how "deep"** the objective attitude goes. Some insist we never fully shed participant stances (e.g., we still resent manipulative humans). The activity’s "reveal" oversimplifies this – real shifts are rarely so abrupt or clean. Acknowledge: the exercise leans compatibilist, but this is far from universal consensus.
