  Okay, the user is describing a specific argumentative pattern they've noticed in high-stakes debates involving vague predicates. Let me unpack this carefully. 

  First, I need to map the core structure: 
  - Step 1: Acknowledge the sorites continuum (clear cases at ends, no natural boundary)
  - Step 2: Argue we must impose an artificial boundary for practical reasons (conventionalist move)
  - Step 3: Defend the specific boundary location asymmetrically:
    • Against lowering: Invoke slippery slope (if we move it down, where to stop?)
    • Against raising: Invoke disruption (inertia, settled expectations, harm to status quo)

  Hmm, this is interestingly distinct from standard philosophical positions. Epistemicism would say there's a hidden sharp boundary, but here the defender admits it's artificial. Supervaluationism accepts multiple admissible precisifications, but this pattern actively resists shifting the boundary. The asymmetry is key - different defenses depending on direction of change.

  The user mentions seeing this in bioethics (moral status), law (competency), and medicine (death criteria). That tracks - all areas where institutional stability matters. I recall Dworkin's "checkerboard" critique of inconsistent principles, but this isn't about inconsistency in values per se. It's more about selectively deploying arguments to protect an established line.

  Is there a term for this? Conventionalism doesn't capture the asymmetric defense. "Precisification" is too neutral. "Status quo bias" is broader. Williamson's epistemicism is the opposite since it denies vagueness. 

  Perhaps "institutional anchoring" - using the continuum to justify needing a line, then anchoring it with asymmetric arguments. But need to specify the defense mechanism: slope fears for downward moves, disruption costs for upward. 

  Important to note this isn't necessarily bad faith. In high-stakes areas, consistency has real value. But the pattern risks masking arbitrariness by switching rationales. The closest existing concept might be Gallie's "essentially contested concepts" but that's about persistent disagreement, not boundary-defense tactics.

  User seems philosophically sophisticated - they've already mapped conventionalism vs epistemicism. Their real need might be analytical tools to critique this move in debates. Should emphasize how this differs from pure rhetoric by having a pragmatic justification core.
answer: |-
  This is a sharp observation of a distinct argumentative pattern that operates at the intersection of vagueness theory, practical reasoning, and institutional legitimacy. While it overlaps with several established concepts, it combines them in a uniquely strategic way that warrants its own characterization. Let's map it precisely:

  ### Core Pattern & Key Features
  1.  **Sorites Premise:** Acknowledges the predicate's vagueness and the soritical continuum (no "natural" joint).
  2.  **Conventionalist Mandate:** Argues the *necessity* of a sharp boundary for practical reasons (avoid chaos, enable function).
  3.  **Asymmetric Defense of Location:**
      *   **Against Lowering (Expansion):** Invokes the **slippery slope** ("If we move it to A, why not A-1?") – treating the continuum as a threat leading to unacceptable outcomes. This leverages *sorites logic itself* as a danger.
      *   **Against Raising (Restriction):** Invokes **institutional inertia, settled expectations, or disruption costs** ("Moving it to B would harm existing arrangements/people") – treating the continuum as *irrelevant* compared to stability concerns. This *rejects* sorites logic for this direction.
  4.  **Status Quo Bias:** The current boundary benefits from a presumption of legitimacy derived from its functional role, regardless of its original arbitrariness.

  ### Distinguishing from Existing Concepts
  *   **Epistemicism (e.g., Williamson):** Denies vagueness exists metaphysically; claims a sharp boundary exists but is unknowable. *This pattern explicitly rejects a hidden metaphysical boundary, embracing conventionalism.*
  *   **Supervaluationism (e.g., Fine, Keefe):** Admits vagueness, defines truth via admissible precisifications (sharpenings). *While the initial mandate resembles precisification, the asymmetric defense isn't about semantic admissibility. It rejects shifting the precisification based on practical harm/stability arguments, not semantic constraints.*
  *   **Pure Conventionalism (e.g., Quine, Lewis on some readings):** Holds the boundary is arbitrary but useful. *The asymmetric defense goes beyond this. Conventionalism *explains* the boundary's existence; this pattern *strategically defends its specific location* using distinct, direction-dependent arguments, masking the underlying arbitrariness.*
  *   **Contextualism (e.g., Raffman):** Holds that context fixes the boundary temporarily. *While stability arguments sound contextual, the defense isn't about *current context* resolving vagueness for a specific utterance, but about *permanent institutional harm* preventing boundary revision.*
  *   **Ordinary Slippery Slope Arguments:** Often fear-mongering about potential consequences. *Here, the slippery slope is *selectively applied only against lowering the boundary*, while *ignoring the symmetrical sorites pressure inherent in the continuum itself*. Raising the boundary triggers a completely different (non-sorites) argument.*
  *   **Pure Interest-Driven Rhetoric:** While pragmatic, the pattern *starts* with a genuine philosophical concession (vagueness necessitates a convention) and leverages recognized sorites dynamics asymmetrically. It has a veneer of principled reasoning grounded in language philosophy.

  ### The Closest Existing Concepts & Why They Fall Short
  1.  **Practical Precisification (Hybrid View):** This comes closest. Precisification is the act of making a vague term sharp for practical purposes (e.g., legal statutes). However, standard accounts of precisification (even pragmatic ones) don't inherently include the *asymmetric defense strategy*. Precisification *sets* the boundary; this pattern is about *defending its location against change* using distinct, direction-sensitive tactics. The asymmetry is the key innovation.
  2.  **Institutional Anchoring (Implicit in Legal Theory):** The idea that once a convention is set for functional reasons, it gains weight through reliance and precedent (e.g., Sunstein on "incompletely theorized agreements"). This captures the stability/status quo defense *against raising*, but doesn't encompass the *slippery slope defense against lowering* or the initial appeal to the sorites continuum to justify needing *any* boundary.

  ### Proposed Term: **Asymmetric Boundary Entrenchment (ABE)**

  *   **Definition:** A rhetorical and justificatory strategy for defending a stipulated sharp boundary of a vague predicate where:
      1.  The existence of a soritical continuum is invoked to justify the *necessity* of imposing a conventional boundary to prevent practical chaos.
      2.  The *specific location* of that boundary is defended asymmetrically:
          *   Proposals to *lower* the boundary (expand the predicate's application) are countered with *slippery slope arguments* leveraging the sorites continuum as a danger.
          *   Proposals to *raise* the boundary (restrict the predicate's application) are countered with *arguments from institutional stability, reliance interests, and disruption costs*, treating the sorites continuum as irrelevant or outweighed.
      3.  The current boundary benefits from a presumption of legitimacy derived from its established functional role.

  *   **Boundary Conditions (When it Collapses or Transforms):**
      *   **Collapses into Pure Conventionalism:** If the defender *only* argues "We need *a* line, this one works okay, changing it is costly," without the direction-dependent argumentative switch, it's just standard conventionalism emphasizing status quo costs.
      *   **Collapses into Epistemicism:** If the defender claims the chosen boundary *does* track a hidden fact (even if initially set conventionally), it abandons the core conventionalist premise of ABE.
      *   **Becomes Pure Slippery Slope Rhetoric:** If the slippery slope argument is used *symmetrically* against any change (up or down), or used without the initial appeal to the sorites continuum *necessitating* a boundary, it loses the distinctive ABE structure.
      *   **Becomes Pure Interest-Driven Rhetoric:** If the arguments for stability against raising or the slope against lowering are demonstrably disingenuous, disconnected from the reality of reliance or potential consequences, and serve only to mask raw power or preference, it sheds the philosophical veneer and becomes naked rhetoric. ABE retains a connection to genuine pragmatic concerns, even if deployed strategically.
      *   **Distinct from Supervaluationist Defeasibility:** A supervaluationist might defend *keeping* a precisification based on overall best fit or minimal disruption. ABE's distinctiveness lies in the *argumentative asymmetry based solely on the direction of change*, not a holistic evaluation.

  ### Why "Asymmetric Boundary Entrenchment" Fits
  *   **Asymmetric:** Captures the core feature – different defenses for lowering vs. raising.
  *   **Boundary:** Focuses on the sharp cutoff point.
  *   **Entrenchment:** Emphasizes the active process of defending and solidifying the boundary's location using available tools (slope fear for one side, stability for the other), moving beyond mere establishment.

  This pattern leverages the *recognition* of vagueness not to embrace semantic indeterminacy or epistemic humility, but paradoxically, to *empower* and *shield* a specific conventional decision from revision, using the very features of the continuum strategically and asymmetrically. ABE is a sophisticated tool for managing the tension between semantic vagueness and institutional necessity in high-stakes domains.
