  First, constructing the correspondence table requires careful ontological alignment. For diabetes, the biological substrate (pancreatic beta-cell dysfunction) and biomarker (HbA1c) are uncontroversial. But psychiatry's equivalents are problematic: "neural circuit dysfunction" remains theoretical, and DSM criteria blend descriptive/normative elements. The therapeutic intervention column highlights another rift—insulin directly corrects a known deficit, while SSRIs' mechanism remains debated. 

