prompt: |-
  I want a number from you, not a both-sides answer, on a claim I've been fightng with my advisor about. The claim is roughly what people mean by Friedman's F-twist: for social-scientific models, the descriptive realism of the assumptions shouldn't matter to how we judge the model; only the model's observable predictions count, and wildly false assumptions can be a virtue rather than a bug. To make it crisp: suppose model A and model B fit the same data and make equally good out-of-sample predictions, but A assumes perfectly rational agents and complete markets while B tries to represent how the agents actually make decisions. Give me your credence that A is no worse science than B, and often the better contribution, partly because its assumptions are false and partly because it is far more tractable. Decompose the number into at least: the probability that prediction is the right target for social science explanation, the probability that false assumptions do no epistemic damage when a more realistic rival has the same predictive record, the probability that scientific practice actually rewards A over B, and whatever else you think belongs. For each term give a rough number and one line of justification, then say how you combine them. Then tell me which term you are least confident in and what evidence would move it most. I'm sitting around 0.6, my advisor is around 0.2, and I mainly want to know where our disagreement actually lives.
