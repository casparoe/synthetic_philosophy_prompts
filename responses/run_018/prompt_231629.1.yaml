  Starting with prediction as the target. In economics, many models prioritize predictive power. Think of Milton Friedman's as-if methodology. But some schools, like behavioral economics, emphasize realistic mechanisms. So maybe a 0.7 probability here, considering the dominance of predictive success in the field.

