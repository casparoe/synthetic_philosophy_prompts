  First, I need to recall the therapy/enhancement distinction. Therapy is about restoring normal function, while enhancement goes beyond it. The moving baseline problem arises when enhancements become widespread, shifting what's considered normal, turning what was once therapy into mere catching up. In Gattaca's world, genetic enhancement is the norm, so unenhanced people like Vincent are seen as disabled from the start. The baseline has already moved before the movie begins; society treats genetic enhancement as the new normal.

