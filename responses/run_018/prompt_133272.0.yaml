  Now, where does the movie support or resist the concept? It supports the moving baseline by showing a world where enhancements are standard, making natural humans disadvantaged. However, it resists the idea that this shift is inevitable or justified through Vincent's achievements. His success highlights that the system is socially constructed, not biologically absolute.

