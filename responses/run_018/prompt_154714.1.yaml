answer: |-
  ## Joint Statement on the Conceptualisation and Nomenclature of Genocide: A Legal-Formalist and Moral-Expansionist Accord

  **Preamble:** After sustained deliberation, the undersigned – one adhering primarily to a **legal-formalist** interpretation of genocide (grounded in Raphael Lemkin’s foundational work and the subsequent codification in the 1948 UN Convention on the Prevention and Punishment of the Crime of Genocide, hereafter "the Convention"), and one advocating a **moral-expansionist** perspective (contending that the moral concept of genocide should encompass structural and cultural destruction beyond the Convention’s strict legal boundaries) – hereby articulate points of agreement and clarify persistent disagreements. We recognise the gravity of the subject, the suffering of victims, and the critical importance of precise language in legal accountability and moral condemnation. Our goal is transparency, not false consensus.

  **I. Agreed Claims:**

  1.  **Lemkin’s Original Conception:** We agree that Raphael Lemkin’s original conceptualisation of genocide (articulated in *Axis Rule in Occupied Europe*) explicitly included the intent to destroy a group *as such*, encompassing not only physical annihilation but also systematic attacks on the group’s foundations of life, including its culture, language, institutions, and distinct identity. Lemkin expressly used the term "cultural genocide" alongside physical destruction.
  2.  **The UN Genocide Convention (1948):** We agree that the final text of the Convention adopted a narrower definition than Lemkin proposed. Key elements:
      *   It focuses on **acts committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such**.
      *   The enumerated acts (Art. II) are predominantly physical/biological: *killing; causing serious bodily or mental harm; deliberately inflicting conditions of life calculated to bring about physical destruction; imposing measures intended to prevent births; forcibly transferring children*.
      *   The concept of "cultural genocide," present in early drafts, was **explicitly excluded** from the final Convention during negotiations, primarily due to state sovereignty concerns regarding assimilationist policies and fears of politicisation.
      *   **Political groups** were deliberately omitted from the protected groups, despite Lemkin’s initial inclusion of them.
  3.  **Current International Law:** We agree that, in international *criminal* law (as applied by tribunals like the ICTY, ICTR, and ICC), the definition of genocide remains strictly confined to the Convention’s text. Prosecutions require proof of specific intent (*dolus specialis*) to destroy one of the four protected groups through the listed physical/biological acts. "Cultural genocide" is **not a standalone crime** under current international criminal law.
  4.  **The Politics and Power of Naming:**
      *   We agree that labelling an atrocity "genocide" carries immense political, moral, and legal weight. It signifies the ultimate crime, demanding the strongest condemnation and, legally, specific obligations for prevention and punishment under the Convention.
      *   We agree that the *failure* to name atrocities perceived as genocidal by victims or observers can constitute a profound injustice, silencing victims, enabling perpetrator impunity, and hindering effective international response.
      *   We agree that precision in legal definitions is crucial for fair trials and upholding the rule of law. Vague or overly broad definitions risk diluting the term's gravity and complicating prosecutions.

  **II. Articulated Disagreements:**

  | Issue                                                                 | Legal-Formalist Position                                                                                                                                 | Moral-Expansionist Position                                                                                                                                 |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Inclusion of "Cultural Genocide" within the Legal Category:**    | "Cultural genocide," while morally reprehensible and potentially constituting other crimes (crimes against humanity, war crimes), **does not and should not fall under the legal definition of genocide.** Including it would violate the principle of legality (*nullum crimen sine lege*), blur essential boundaries, risk politicisation of the courts, and dilute the unique gravity reserved for physical/biological destruction as defined by the Convention. | The exclusion of "cultural genocide" from the Convention was a political compromise, not a moral or conceptual necessity. **The deliberate destruction of a group’s culture, language, and identity *is* genocide** in its essence (per Lemkin) and should be recognised as such legally, as it achieves the group's destruction as a distinct entity without necessarily mass killing. This gap in the law silences victims of cultural annihilation. |
  | **2. Revival of "Political Groups" via Analogy:**                     | Extending the definition to protect political groups **by analogy** (e.g., arguing an ethnic group targeted for political reasons) **breaks the clear textual and intentional limits** of the Convention. The protected groups are defined by stable, often immutable characteristics. Political groups lack this inherent stability. Expanding the groups covered requires treaty amendment, not judicial reinterpretation, to maintain legal certainty and integrity. | The exclusion of political groups was a flaw born of Cold War politics. Where a political group possesses characteristics akin to the protected groups (shared identity, cohesion, often targeted based on perceived immutable traits), **denying them protection under genocide law based solely on the 'political' label is morally indefensible and legally arbitrary.** The *intent* to destroy the group *as such* should be paramount. Analogous reasoning is legally sound and necessary for justice. |
  | **3. Primary Function of Legal Precision:**                           | **Legal precision protects victims** by ensuring clear standards for investigation, prosecution, and conviction. It prevents misuse of the genocide label for political point-scoring and ensures perpetrators of the *most extreme crime* are held accountable under a rigorous, predictable framework. Vagueness risks unfair convictions and undermines the law's legitimacy and deterrent effect. | While fair trials require rules, **an overly rigid legal definition can silence victims** whose experiences of group destruction fall outside its narrow bounds. Insisting on the strict legal definition *exclusively* in political discourse can delegitimise victims' experiences, obstruct calls for intervention, and grant impunity to perpetrators whose systematic destruction of group identity is not primarily physical. Moral clarity demands a broader usage. |

  **III. Cruxes: Concrete Cases and Predictions**

  1.  **Crux: Does Legal Precision Protect or Silence Victims?**
      *   **Case: Canadian Indian Residential School System:** (Agreed this exemplifies systematic cultural destruction aimed at eliminating Indigenous groups *as such*).
          *   **Legal-Formalist Prediction:** While constituting a crime against humanity (persecution) and potentially genocide *if* specific intent to physically destroy and sufficient physical/biological acts (e.g., widespread deaths from neglect, forced sterilisation) can be proven to the high legal standard, the core policy of forced assimilation and cultural suppression **does not, alone, legally constitute genocide** under the Convention. Calling it genocide *legally* without meeting the Convention criteria risks legal confusion and devalues the term. However, the *moral* condemnation using the term "genocide" in public discourse may be powerful and justified.
          *   **Moral-Expansionist Prediction:** The explicit intent to "kill the Indian in the child" and destroy Indigenous cultures and identities **constitutes genocide in the fundamental sense intended by Lemkin.** Restricting the term "genocide" *only* to cases meeting the Convention's physical-biological threshold **silences the lived experience and collective trauma** of survivors and their communities, whose cultural destruction *was* the intended outcome. Refusing the label perpetuates historical injustice.

  2.  **Crux: Can the Political Group Exclusion be Circumvented by Analogy?**
      *   **Case: Rohingya Crisis (Myanmar):** (Agreed that severe atrocities occurred against the Rohingya, a distinct ethnic/religious group, driven by state policies).
          *   **Legal-Formalist Prediction:** The Rohingya clearly fall within the protected group "ethnic and/or religious." Therefore, evidence meeting the Convention's criteria (specific intent + listed acts) **can and should lead to a legal finding of genocide** without needing to stretch the definition to cover political groups. The focus remains correctly on their ethnic/religious identity. Attempting to frame it *also* as targeting a political group adds unnecessary complexity and weakens the legal case based on their inherent characteristics.
          *   **Moral-Expansionist Prediction:** While the Rohingya are an ethnic/religious group, the state's justification often framed them as "illegal immigrants" or a security threat (political/status-based framing). **A rigid focus *only* on ethnicity/religion risks obscuring the political motives and mechanisms of their persecution.** If a future case targeted a group defined *primarily* as political (e.g., an ideology-based group exhibiting strong cohesion and identity), the law's failure to protect them via analogy would be a glaring injustice. The Rohingya case highlights the *need* for flexibility based on the perpetrator's intent to destroy the group *as such*, regardless of the label.

  **Closing:** Our differences reflect fundamental tensions between the demands of enforceable legal certainty and the imperative for moral clarity that resonates with victims' experiences of group destruction. We agree that atrocities falling outside the strict legal definition of genocide demand robust condemnation and accountability under other legal frameworks (crimes against humanity, war crimes, human rights law). We concur that Lemkin’s broader vision remains essential for understanding the multifaceted nature of group destruction. We disagree on whether the legal category of genocide should expand to encompass cultural annihilation or political group destruction, and on the primary societal function of the genocide label itself. This statement serves not as a resolution, but as a map of our contested terrain.

