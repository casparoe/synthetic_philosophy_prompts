answer: |-
  **Bottom line:** Your position is most vulnerable to cases demonstrating that benefiting from systemic injustice constitutes *ongoing normative complicity* functionally equivalent to direct hypocrisy, particularly where the blamer's actions actively sustain the system producing the wrong they condemn, forcing a concession that structural complicity cancels standing.

  **Exposure Map:**

  1.  **Decisive Case Intuitions:** Unrestricted defenders would compel concession with:
      *   **Corporate Climate Hypocrisy:** A fossil fuel CEO, whose wealth/power *directly* relies on extraction causing climate harm, blaming individuals for high carbon footprints. Intuition: Their systemic benefit is causally proximate and morally entangled with the harm.
      *   **Tax Avoidance:** Legislators who design/exploit loopholes benefiting capital, then blame welfare recipients for fraud. Intuition: Actively shaping the exploitative system is complicity in its downstream wrongs.
      *   **Institutional Discrimination:** A university dean condemning student racism while upholding admissions/funding policies demonstrably disadvantaging minority groups. Intuition: Perpetuating the discriminatory structure negates standing.

  2.  **Theoretical Pressure Points:**
      *   **Degree vs. Kind Argument:** If the blamer's structural position *enables* the specific wrong (e.g., the CEO's lobbying prevents regulations enabling individual emissions), direct/indirect complicity converges. The blamer isn't just *vulnerable* but *causally responsible* for the *type* of fault.
      *   **Moral Taint of Benefit:** Unrestricted defenders argue benefiting from injustice *while blaming victims/participants* inherently involves a morally disqualifying inconsistency or bad faith, regardless of "mode" differences. Your distinction seems arbitrary.
      *   **Unfalsifiability Risk:** Continuously refining "identical wrong" and "same mode" to exclude structural cases risks making the view unfalsifiable. Unrestricted defenders *dismiss* this if definitions remain principled, but it *is* damaging if qualifications appear ad hoc. *They would concede* unfalsifiability is fatal.

  3.  **Insulation by Qualification:** While necessary refinement, over-qualification *is* a problem if it renders structural complicity *conceptually impossible* to meet the "direct parity" bar, protecting the core claim from empirical challenge. Defenders must show the distinction is robust, not gerrymandered.

  **Key Distinction:** Unrestricted defenders *dismiss* arguments that structural complicity is inherently different in *kind* (category error). They *concede* the potential damage of unfalsifiability and compelling cases showing functional equivalence via active system sustenance.
