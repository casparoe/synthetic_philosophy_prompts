  The situation: a company has five critical roles requiring a specific certification. One employee, Sarah, has a disability accommodation allowing her to work remotely. The other five certified employees are based in a city facing a sudden transport strike. The rule prevents forcing Sarah to relocate since her accommodation is protected. The company can't revoke it to solve the bigger issue, even though the five others can't work, leading to project failure.

  Next, breaking down the deontologist and consequentialist views. The deontologist would argue that violating Sarah's rights is impermissible, regardless of consequences. The consequentialist would focus on the greater good—sacrificing one accommodation to save five projects. The paradox bites because the same type of rights violation (denying accommodation) occurs five times due to inaction.

  The key feature here is non-aggregation of rights. Deontology doesn't allow tallying violations; each right stands alone. If we strip that away, rights become tradable, collapsing into consequentialism. 

  The best move for the deontologist is to question the "structurally identical" aspect. Maybe the five violations aren't identical because they result from external factors (transport strike), not direct action by the agent. Inaction vs. action distinction could block the paradox without changing the subject. Need to ensure this holds logically.
answer: |-
  Here's the scenario:

  > At a county council's social services committee, Manager Lee faces a staffing crisis: five care homes serving vulnerable elderly residents will lose their qualified dementia specialists next month due to sudden resignations, directly threatening continuity of care (a protected right under disability legislation). The only available, identically qualified internal candidate is Anya, currently working flexibly from home under a legally binding disability accommodation agreement for her chronic illness. Council policy strictly forbids overriding an individual's established disability accommodation to solve broader staffing shortages. Lee *could* reassign Anya to rotating on-site shifts at one care home (violating her accommodation), freeing up her current role to be filled by one of the five specialists who could then cover the remaining four vacancies. However, invoking the policy means Lee must "stand back," leaving all five homes uncovered and risking five distinct failures in delivering legally mandated care continuity.

  **Deontologist's View:**  
  Lee *absolutely must* uphold the procedural rule prohibiting the instrumentalization of Anya’s disability accommodation. Violating Anya’s settled right – using her protected status as a mere resource – is intrinsically wrong, a direct violation of her dignity and the principle that accommodations are non-negotiable entitlements. It doesn’t matter that this inaction leads to five other care failures; causing the *direct, deliberate* violation of Anya’s right (through reassignment) is categorically prohibited. The five potential future failures are results of external circumstances (resignations), not Lee’s *chosen action* to override a right.

  **Consequentialist's View:**  
  Lee’s duty is to minimize overall harm. Upholding the rule results in *five* violations of the right to continuity of care. Violating Anya’s accommodation causes *one* violation while *preventing* five others – a net gain of four protected rights upheld. The rule is defensible in normal circumstances to prevent exploitation, but here it becomes a harmful fetish. Sacrificing one right-claim to save five identical rights-claims is the only rational, morally responsible choice given the catastrophic alternative.

  **Where the Paradox Bites:**  
  The paradox bites at the **non-aggregation of rights** under deontology. The deontologist treats the violation of Anya’s right as an absolute prohibition that *cannot be weighed* against the five identical rights violated elsewhere due to inaction. Preventing one *direct, agent-initiated* wrong outweighs preventing five *indirect, system-failure* wrongs of the same kind. The rule forces Lee to prioritize *not being the direct cause* of one violation over *preventing the occurrence* of five others.

  **The Heavy-Lifting Feature:**  
  **Non-aggregation of rights** is doing the heavy lifting. Deontology insists each right violation is a unique, non-fungible moral catastrophe. You cannot "add up" rights violations to justify causing one. The prohibition on violating Anya’s right stands alone, unmodified by the consequences of adhering to it.

  **What Collapses Without It:**  
  If you strip away non-aggregation, the core distinction between deontology and consequentialism collapses. Allowing aggregation means rights *can* be traded off against identical rights for a net benefit. The "absolute" prohibition becomes contingent on consequences, morphing into rule-consequentialism. The deontologist’s fundamental claim – that certain acts are wrong *regardless* of their outcomes – evaporates.

  **The Deontologist's Best Blocking Move:**  
  The strongest deontological counter is to deny the **"structurally identical"** nature of the violations. The violation *caused by Lee* (revoking Anya’s accommodation) is fundamentally different in kind from the five potential violations *allowed by Lee* (due to resignations and staffing failure). The first is a *direct, deliberate act of wronging* a specific individual by the agent, breaching a specific duty owed *to Anya*. The latter are *foreseen but unintended failures of the system* to meet obligations *to the five homes' residents*. Lee’s duty to Anya is *agent-relative* and *specific* (honor *her* agreement), while the duty to the residents is *agent-neutral* and *general* (ensure the system functions). Causing the first wrong is prohibited; failing to prevent the latter, while tragic, is not a *direct violation* of the same kind. The procedural rule exists precisely to shield specific individuals from being sacrificed for systemic failures, upholding the non-instrumentalization principle even when it leads to worse aggregate outcomes.
