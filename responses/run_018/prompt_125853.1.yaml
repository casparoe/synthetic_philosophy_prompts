prompt: |-
  hey, my friend maya catalogs retro game sprites for a museum and she's got these weird hard lines about corruption vs restoration. her verdicts so far: 1 missing pixel anywhere = original; 5 missing pixels clustered together but same pallete = still original; 50 scattered missing = corrupted; replacing a pixel with any color inside the pallete = restored, not corrupted; replacing even one pixel with a color outside the pallete = corrupted no matter the scale; reconstructing 10% from another rom version = acceptable restoration; 30% reconstructed = forgery. now she's staring at a sprite with exactly 23 missing pixels all in one corner, 3 of them filled in with shades adjacent to the pallete (one technically outside the defined range), and about 15% of the background rebuilt from a later release. do you think she'll call it corrupted, restored, or forged? i'm less interested in the answer than in the rule she's actually running—pure pixel count, cluster density, pallete fidelity, source purity, or some weighted combo? what are the other rules that fit her past verdicts just as well, and which hypothetical case would actually split them? also, could there be a hidden principle about "intention of the damage" she's not saying out loud, and how would we test for that?
reasoning: |-
  Okay, the user is describing their friend Maya's system for judging retro game sprites as original, corrupted, restored, or forged. It's a detailed set of rules, and they want to understand the underlying principles rather than just the verdict. The key is to figure out what logic Maya is using.

  First, I need to parse the verdicts she's given so far. Missing pixels: one missing is original; five clustered but same palette is still original; fifty scattered missing is corrupted. That suggests cluster size matters more than total count. But when pixels are replaced, even one with an out-of-palette color is corrupted, regardless of scale. Replacing with in-palette colors is considered restoration. Reconstruction from another ROM: 10% is acceptable, but 30% is forgery. 

  Now, the current case: 23 missing pixels in one corner, three filled—two with adjacent shades (one technically outside), and 15% background rebuilt from a later release. Applying Maya's rules: the cluster of 23 missing might be seen as acceptable since it's clustered (like the 5-cluster rule). But the filled pixels: one is out-of-palette, which according to her past verdict, would make it corrupted. However, the reconstruction is 15%, which exceeds her 10% allowance for acceptable restoration. 

  The user is more interested in the rules than the verdict. They mention possible factors: pixel count, cluster density, palette fidelity, source purity. From the examples, palette fidelity seems strict—any out-of-palette color causes corruption. Cluster density overrides total missing pixels (5 clustered is okay, 50 scattered is not). Source purity has a threshold (10% vs 30%). 

  But there might be inconsistencies. For instance, the 5 clustered missing pixels are original, but 23 clustered—would that still be okay? The rules don't specify a cluster size limit. Also, the 15% reconstruction exceeds the 10% rule, so that would push towards forgery, but the palette issue might override. 

  The user asks about other possible rules that fit the same verdicts. Maybe cluster size isn't the only factor; perhaps it's about the proximity to the image's focus. But that's not stated. Or perhaps the intention of the damage—like whether the missing pixels are accidental or intentional. Testing that would require seeing if Maya treats identical damage differently based on context, which isn't provided here. 

  To test for hidden principles, hypothetical cases could help. For example, a sprite with 10% reconstruction using out-of-palette colors vs. in-palette. Or clustered missing pixels versus scattered but same total. Also, reconstruction from the same ROM version vs. different. 

  The user's deeper need might be understanding how Maya categorizes these sprites, possibly to help with cataloging or to create a formal system. They might also be curious about the subjectivity in such systems and how unspoken rules affect judgments. So, exploring the structure of Maya's logic and where it might be inconsistent is key.
answer: |-
  Based on Maya's explicit verdicts, here's the breakdown for the specific sprite and the underlying principles she's likely using:

  1.  **The Verdict:** Maya will almost certainly call this **Corrupted**.
      *   **The Critical Factor:** One pixel replaced with a color *technically outside the defined palette* triggers her "corrupted no matter the scale" rule. This single violation outweighs everything else. The palette fidelity rule is absolute and non-negotiable in her system.
      *   Supporting Factors (though the palette breach is decisive):
          *   **23 Missing Pixels (Clustered):** While clustered, 23 is significantly larger than the "5 clustered" example she deemed original. Her rules don't define an upper cluster size limit for "original," but 23 in one corner likely pushes beyond her implicit tolerance, especially combined with other issues.
          *   **15% Reconstructed Background:** This exceeds her "10% reconstructed = acceptable restoration" threshold. While not hitting the "30% = forgery" mark, it's firmly in the "unacceptable alteration" zone for reconstruction *on its own*. Combined with the palette breach, it reinforces corruption.
          *   **3 Filled Pixels (Shades Adjacent/One Outside):** The two adjacent-but-in-palette fills would fall under "restored, not corrupted". However, the single out-of-palette pixel overrides this.

  2.  **The Rule She's Running: A Weighted Hierarchy with Absolute Gates**
      Maya's system prioritizes certain rules absolutely ("gates") and uses thresholds for others:
      *   **Absolute Gates (Fail = Corrupted):**
          *   **Palette Fidelity:** Any pixel replaced with an out-of-palette color = **Corrupted**. This is the strongest gate.
          *   **Source Purity Threshold (Upper):** Reconstruction exceeding 30% = **Forgery** (a specific type of corruption). This is also absolute.
      *   **Threshold-Based Rules:**
          *   **Missing Pixel Quantity/Dispersion:** Low count (1) or clustered moderate count (5 clustered) = **Original**. High count scattered (50) = **Corrupted**. Clustering mitigates corruption for missing pixels. There's an implied threshold (between 5 and 50 scattered, likely lower for clusters) where missing pixels become unacceptable.
          *   **Acceptable Restoration Thresholds:**
              *   In-palette pixel replacement = **Restored** (acceptable).
              *   Reconstruction <=10% = **Acceptable Restoration**.
              *   Reconstruction >10% but <30% = Likely **Corrupted** (based on exceeding the acceptable threshold, though not explicitly stated for 10-30% *without* other factors).
      *   **Hierarchy:** Palette Fidelity > Source Purity (Forgery Threshold) > Missing Pixel Dispersion/Quantity > Acceptable Restoration Thresholds. A breach of a higher rule (like palette) makes lower rules irrelevant for the "corrupted" verdict.

  3.  **Other Rules That Fit Her Past Verdicts:**
      *   **Rule A (Original Focus):** "Original status requires *no* replaced pixels and missing pixels < N (N~50) *and* no cluster > M (M~5)." (Fits missing pixel verdicts, but clashes with her acceptance of in-palette replacements as "restored" not "corrupted").
      *   **Rule B (Restoration Tolerance):** "Corruption is defined by unrecoverable loss or intentional deceit. <=10% reconstruction is recoverable knowledge; >10% is potentially deceitful; >30% is definitive deceit. Palette errors are unrecoverable loss of original data." (Fits reconstruction thresholds and palette absolutism).
      *   **Rule C (Visual Integrity):** "Authenticity depends on core visual integrity. Small clusters of missing pixels or minor reconstruction (<10%) don't break integrity if the palette is correct. Large-scale loss (50px) or any palette shift does. Forgery attempts (30%+) completely replace integrity." (Fits most, but the "5 clustered missing = original" pushes the boundary of "core visual integrity").
      *   **Rule D (Data Purity):** "The original data bytes are paramount. Missing data (pixels) is tolerated in small clusters. *Any* replaced data byte must exactly match the original palette values to not be corruption. Reconstruction uses external data bytes, acceptable only minimally (<10%)." (Fits palette absolutism, missing pixels, and reconstruction thresholds).

  4.  **Hypothetical Case to Split the Rules:**
      *   **Case:** A sprite with **exactly 10% of its pixels reconstructed** from a *different* ROM version, **perfectly matching the original palette**, but with **no missing pixels**.
      *   **How it Splits:**
          *   **Maya's Likely Verdict:** **Restored (Acceptable)**. It hits the 10% reconstruction threshold *exactly* and the palette is correct.
          *   **Rule A (Original Focus):** Would likely call it **Corrupted** or **Forgery** because it has replaced pixels (even if correct) and significant external sourcing, violating "no replaced pixels" or exceeding its tolerance.
          *   **Rule B (Restoration Tolerance):** **Restored (Acceptable)** - matches Maya.
          *   **Rule C (Visual Integrity):** **Restored (Acceptable)** - visual integrity is maintained with correct palette.
          *   **Rule D (Data Purity):** **Corrupted** - 10% of the data bytes are sourced externally, breaching data purity despite matching the output. This rule might have a lower tolerance for *any* external sourcing.

  5.  **Hidden Principle: "Intention of the Damage"?**
      *   **Likelihood:** It's plausible, even probable. Her distinction between "missing" (accidental loss, potentially acceptable) vs. "replaced" (intentional alteration, heavily scrutinized), and the focus on palette errors/deceitful reconstruction, suggests an underlying concern about *intent* or *integrity of the source*.
      *   **Testing for it:** You'd need to present Maya with sprites where the *physical manifestation* is identical, but the *implied cause* differs:
          *   **Case 1:** A cluster of 10 missing pixels (implied decay).
          *   **Case 2:** A cluster of 10 pixels replaced with the *correct* palette colors (implied repair).
          *   **Case 3:** A cluster of 10 pixels replaced with *incorrect but plausible* palette colors (implied error or tampering).
      *   **Prediction:** If "intention" matters, Maya might judge:
          *   Case 1: Original (acceptable loss).
          *   Case 2: Restored (acceptable repair).
          *   Case 3: Corrupted (tampering/error).
      *   **Contradiction:** Her *explicit* rule says replacing a pixel *correctly* is "restored, not corrupted." Case 2 should be "restored" regardless of intent. The test is whether she views identical *correct* replacements differently based *only* on the *implied* reason. If she calls Case 2 "corrupted" simply because it was replaced (even correctly), it reinforces data purity over intent. If she calls it "restored," intent might not be the hidden driver.

  **Conclusion:** Maya's system is fundamentally built on **strict palette adherence as an absolute requirement** and **thresholds for acceptable loss (missing pixels, favoring clusters) and acceptable restoration (in-palette repair, minimal reconstruction)**. The hierarchy prioritizes palette and data source integrity above all else. The single out-of-palette pixel in the described sprite is the smoking gun that triggers her ultimate "corrupted" verdict, regardless of the cluster size or the 15% reconstruction (which itself is problematic but secondary). Her rules suggest a deep concern for the authenticity and integrity of the original data values and source, potentially bordering on data purism, with visual integrity being a secondary concern managed by thresholds. Testing for a hidden "intent" principle requires scenarios where the physical data matches but the implied history differs.
