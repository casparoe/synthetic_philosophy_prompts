answer: |-
  Here's the thought experiment: A hospital admin must allocate a scarce analgesic. Option A prevents one patient from developing lifelong trigeminal neuralgia (moderate chronic facial pain, rated 4/10 intensity). Option B prevents five different post-op patients from each enduring one week of severe acute pain (8/10 intensity) from inadequate pain control. Total suffering-minutes prevented are equal: chronic patient avoids 40 years × 365 days × 24 hours × 60 minutes × 4 intensity = 84,096,000 units; acute group avoids 5 patients × (7 days × 24 hours × 60 minutes × 8 intensity) = 5 × 80,640 = 403,200 units. *Wait, miscalculation—intensity must scale to match.* **Corrected math:** Chronic: 40 years at **2.5/10 intensity** = 40 × 365 × 24 × 60 × 2.5 = 52,560,000 units. Acute: 5 patients × 1 week at **8.5/10 intensity** = 5 × (7 × 24 × 60 × 8.5) = 5 × 85,680 = 428,400 units. *Adjusted to near-equality (≈52.6M vs 42.8M? Final fix):* **Chronic at 3/10 for 30 years** (30 × 365 × 24 × 60 × 3 = 47,304,000) vs. **acute at 9/10 for 5 patients** (5 × 10,080 min × 9 = 453,600). *Closer—use QALY-like weighting:* Assume chronic minute = 0.35 utils, acute minute = 3 utils. Chronic: 30yrs × 525,600 min/yr × 0.35 = 5,518,800 utils. Acute: 5 × (10,080 min × 3) = 151,200 utils. **Scaled solution: Chronic intensity 3.5/10 (1 util/min), acute 9/10 (3 util/min). Chronic: 30yrs × 525,600 min × 1 util = 15,768,000 utils. Acute: 5 × 10,080 min × 3 utils = 151,200 utils. *Equalize by extending acute duration or adding patients.* **Final utilitarian math:** Chronic prevents **15.8M utils** of suffering (1 person × 3.5/10 pain × 15.768M min). Acute prevents **15.8M utils** (5 people × 9/10 pain × 351,467 min each ≈ 5.86 weeks severe pain). Aggregate utilitarian picks acute: same total utils, helps five vs. one.  

  **Separateness objection bites here:** The five acute patients experience suffering in *distinct experiential streams*. Preventing 3.16M utils per acute patient isn’t equivalent to preventing 15.8M utils for one, because suffering isn’t interpersonally fungible—like having five bank accounts each short $3.16M versus one account short $15.8M. The moral "debt" isn’t pooled; relief must target each individual’s intact burden.  

  **Temporal slices tweak:** If the five are one person enduring sequential weeks of acute pain, separateness collapses. The utils aggregate within a single conscious entity, like transferring money between your own accounts. The utilitarian now sees one person avoiding 15.8M utils of suffering either way—no objection.  

  **Clever rule-utilitarian attack:** A rule-utilitarian adds a non-aggregation clause: "Maximize welfare but never sum utils across persons to override a larger *individual* harm." Here, the chronic patient avoids a 15.8M util burden *alone*, while each acute patient avoids only 3.16M utils individually. The rule prioritizes the chronic patient, as no single acute patient faces comparable individual harm. **Does it save? Partially.** It dodges separateness by refusing to aggregate small harms across persons. But it fails if acute pain were more intense (e.g., 10/10)—highlighting where non-aggregation must arbitrarily define "larger harm" (total vs. peak intensity). Real-world triage protocols often reflect this, prioritizing severe individual cases over dispersed minor ones.
