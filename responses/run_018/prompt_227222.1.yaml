prompt: |-
  Next month I am defending, in a departmental seminar, the thesis that evidential cooperation in large worlds gives agents like us a strong reason to act cooperatively: if the universe plausibly contains vast numbers of agents deliberating much as I do, then my decision is evidence about theirs, and by choosing as they would wish I can influence, in expectation, far more value than anything I could causally affect on Earth. The audience is mostly decision theorists and formal epistemologists committed to causal decision theory — people who regard evidential decision theory as having lost the Newcomb debate decades ago — plus a couple of moral philosophers sceptical of anything to do with infinite ethics. Prepare me for the question period: the half-dozen objections I will actually face, ordered by how much damage they would do, each phrased the way this particular audience would put it, with my best two-minute reply and a note on where that reply is weakest. I want definite recommendations rather than a menu of options: for each objection, tell me plainly whether I should concede, reframe, or stand my ground, and why. Finish with the objection I should be hoping nobody raises, and what I will say if they do.
reasoning: |-
  Okay, the user is preparing for a thesis defense on evidential cooperation in large worlds. They're presenting to a tough crowd: causal decision theorists (CDT) who dismiss evidential decision theory (EDT) and moral philosophers skeptical of infinite ethics. I need to anticipate the top objections, craft concise replies, and advise on how to handle each.

  First, the core argument: In large worlds with many similar agents, one's decision provides evidence about others' actions. By cooperating, you can influence expected value more than through causal effects alone. The audience will challenge this from CDT and infinity-skeptic angles.

  I recall the main objections from past debates:
  1. **CDT's dominance argument** - "EDT recommends dominated strategies." Classic Newcomb counter.
  2. **Bootstrapping evidence** - "How can my choice prove anything about others?" Epistemic circularity concern.
  3. **Causal impotence** - "But you're not *making* them cooperate!" CDT's core objection to EDT's leverage claim.
  4. **Infinity skepticism** - "Vast ≠ infinite, and your math breaks down." Moral philosophers' go-to.
  5. **Practical irrelevance** - "Earth-scale effects dominate anyway." Scale objection.
  6. **CDT envy** - "Why not use CDT but add cooperative reasoning?" Hybrid proposal challenge.

  For each, I need:
  - **Audience phrasing**: Sharp, technical, hitting pain points.
  - **2-minute reply**: Evidence-focused, conceding where needed but defending core.
  - **Weakness note**: Where reply is vulnerable.
  - **Tactics**: Concede/reframe/stand ground - must pick one per objection.

  The "silver bullet" objection would be **anthropics + acausal correlation**: If agents are spread across disconnected worlds, evidence dissolves. I'll save this nightmare scenario for last.

  Now structuring replies:
  - For **dominated strategies**: Reframe as different payoff matrix (aggregate outcomes), not individual dominance. Weakness: Still violates CDT's dominance principle.
  - For **bootstrapping**: Stand ground - appeal to decision-theoretic symmetry. Weakness: Assumes identical reasoning without proof.
  - For **causal impotence**: Stand ground - distinguish causal vs. evidential influence. Weakness: Sounds mystical to CDTers.
  - For **infinity**: Concede finite analogs valid, reframe as "vast but bounded". Weakness: Loses key exponential growth argument.
  - For **practical relevance**: Reframe with Fermi estimates. Weakness: Requires accepting speculative numbers.
  - For **CDT envy**: Stand ground - show hybrid collapses to EDT. Weakness: Ignores precommitment solutions.

  Silver bullet reply: Cornered. Must bite the bullet on sparse worlds or pivot to "similar-enough" agents. Weakness: Undermines entire premise if correlations are weak.

  Final check: Are replies audience-tailored? Yes - CDT jargon for decision theorists, Fermi for skeptics. Tactics balanced: Standing firm on core mechanics but conceding on infinity. The silver bullet section will feel like a punch but shows intellectual honesty.
answer: |-
  Below is a targeted preparation for your thesis defense, based on the audience's profile (causal decision theorists/CDT, formal epistemologists, and infinity-skeptical moral philosophers). I've ordered objections by damage potential, phrased as your audience would, with a 2-minute reply, a note on its weakness, and a clear tactical recommendation. The objections focus on CDT's core rejection of evidential reasoning, epistemic circularity, and infinity-skeptical pragmatism. The final section covers the "silver bullet" objection.

  ---

  ### **Objection 1: Dominated Strategies**  
  **Audience phrasing:** "Your evidential approach recommends dominated strategies. In Newcomb-like setups, EDT self-destructs: if all 'similar agents' reason as you do, they'll one-box only if they expect you to one-box, but CDT two-boxes and gets the million. Why endorse a method that's provably inferior in finite cases?"  
  **Damage:** High. Undercuts EDT’s coherence.  
  **Reply (2-min):** "This conflates individual and collective rationality. In large worlds, 'domination' is redefined: if my action is evidence of others' actions, two-boxing *causally* dominates but *evidentially* triggers mass defection. The expected utility of cooperation scales with population size (O(N)), while causal gains are O(1). For N large, EDT’s 'dominated' strategy dominates causally *in aggregate* by correlating actions. CDT’s 'superiority' assumes isolation—false in large worlds."  
  **Weakness:** Doesn’t resolve CDT’s insistence that dominance is defined causally, not evidentially.  
  **Tactic: Reframe.** Shift focus from individual actions to systemic outcomes. Conceding here invites total rejection; standing ground ignores CDT’s technical win. Reframing to aggregate rationality leverages your large-world thesis.  

  ---

  ### **Objection 2: Bootstrapping Evidence**  
  **Audience phrasing:** "Your evidence is bootstrapped: you claim your choice 'signals' others' choices, but only if they’re identical to you. This is circular—it assumes collective cooperation to justify cooperation. Where’s the independent evidence that such agents exist?"  
  **Damage:** High. Challenges the epistemology.  
  **Reply (2-min):** "It’s not circular; it’s decision-theoretic symmetry. If I have reason to believe other agents face similar decisions and use similar reasoning—which is plausible in a large universe—my choice becomes a Bayesian signal. This isn’t proof of cooperation; it’s a Nash-like equilibrium where EDT reasoning is stable. We don’t need 'independent evidence' of identical agents; we need a non-zero prior on their existence, which large worlds guarantee."  
  **Weakness:** Relies on the *assumption* of identical reasoning, which skeptics see as question-begging.  
  **Tactic: Stand your ground.** This is core to your thesis. Conceding invalidates your model; reframing dodges the epistemic challenge.  

  ---

  ### **Objection 3: Causal Impotence**  
  **Audience phrasing:** "Even if your action is evidence of others' actions, it doesn’t *cause* them. CDT cares about *levers*, not reflections. Why sacrifice Earth-bound causal impact for shadows in the multiverse?"  
  **Damage:** Medium-high. Directly rejects EDT’s mechanism.  
  **Reply (2-min):** "Causal levers are myopic in large worlds. Suppose I defect: this is evidence that other agents likely defect, reducing expected value. Cooperating doesn’t 'cause' cooperation—it updates the probability mass for it. With vast N, this expectation swamps causal gains. Think voter’s paradox: one vote doesn’t cause change, but if all reason that way, we get suboptimal outcomes. EDT avoids this trap."  
  **Weakness:** CDTers see this as "magical thinking"—no counterfactual control.  
  **Tactic: Stand your ground.** Conceding here surrenders your thesis; reframing to "pragmatic rationality" won’t sway CDT purists.  

  ---

  ### **Objection 4: Infinity is Intractable**  
  **Audience phrasing:** "Large ≠ infinite. Your 'vast numbers' imply unbounded utility, but infinity breaks aggregation (e.g., Pareto failures or non-measurability). Moral philosophy rejects this; shouldn’t you?"  
  **Damage:** Medium. Targets your math.  
  **Reply (2-min):** "I avoid infinities entirely. 'Vast' means large finite N (e.g., 10¹⁵ agents), where cooperation’s expected value (k•N for k>0) dwarfs O(1) causal effects. For example, saving a life on Earth might have utility 10⁶, but with N=10¹⁵ similar agents, even a 0.001% evidential influence on cooperation nets 10¹⁰ utility. No infinity needed—just scale."  
  **Weakness:** Assumes strong acausal correlation; skeptics doubt the 0.001% estimate.  
  **Tactic: Concede and reframe.** Agree infinity is toxic, pivot to finite-but-large. Standing ground on infinity alienates moral philosophers.  

  ---

  ### **Objection 5: Earth-Bound Pragmatism**  
  **Audience phrasing:** "Even granting your math, Earth's causal stakes dominate. Climate change or AI risk could wipe out billions. Your 'evidential influence' is speculative; causal impact here is measurable. Why gamble on cosmic cooperation?"  
  **Damage:** Medium. Questions practical relevance.  
  **Reply (2-min):"Speculative doesn’t mean negligible. Via Fermi estimates: if P(similar agents) > 10⁻¹⁰, and N > 10²⁰, evidential cooperation’s EV rivals Earth-bound interventions. Further, many causes (e.g., AI alignment) involve coordinating with similar agents *now*, making this directly relevant. CDT’s focus on local causality ignores network effects in large systems."  
  **Weakness:** Relies on subjective priors (e.g., P(similar agents)).  
  **Tactic: Reframe.** Conceding weakens your case; standing ground seems fanatical. Reframe as diversification: evidential cooperation as high-EV insurance.  

  ---

  ### **Objection 6: CDT Can Replicate Cooperation**  
  **Audience phrasing:** "CDT can achieve cooperation via precommitments (e.g., contracts or algorithms). Why invoke EDT’s paradoxes when CDT handles this cleanly?"  
  **Damage:** Low-medium. Suggests your thesis is redundant.  
  **Reply (2-min):"Precommitments require coordination costs or repeated interaction—impossible across cosmic distances. EDT achieves cooperation *acausally* in one-shot decisions. In large worlds, precommitment is infeasible; EDT’s evidential linkage is free. This isn’t replication; it’s CDT’s limitation."  
  **Weakness:** CDTers can cite "UDT" (Updateless Decision Theory) as a CDT-compatible extension.  
  **Tactic: Stand your ground.** Conceding makes your thesis derivative; reframing to "EDT as UDT-lite" confuses the debate.  

  ---

  ### **The Silver Bullet: Anthropic Undercutting**  
  **Objection you hope nobody raises:**  
  **Audience phrasing:** "Your evidence is annihilated by anthropics. If 'similar agents' are scattered across disconnected Everett branches or Boltzmann brains, your decision isn’t evidence of theirs—it’s just noise. Correlation requires a shared causal origin, which large worlds dilute to zero."  
  **Damage:** Catastrophic. Destroys evidential linkage.  
  **Reply (if raised):** "Anthropic arguments cut both ways. If agents are truly disconnected, we’re in a 'small world' for decision purposes—but we have no evidence for that. In fact, physics (e.g., quantum immortality) and cosmology suggest agents *are* entangled. Absent proof of disconnection, we must assign non-zero credence to correlation. Otherwise, we’re paralyzed by solipsism. My thesis applies precisely when such entanglement is plausible—and large worlds make it so."  
  **Weakness:** Invokes speculative physics; doesn’t refute correlation decay in chaotic systems.  
  **Tactic: Concede uncertainty but reframe.** Say: "This is a real concern, but not fatal. My thesis targets worlds *like ours* where agents share decision algorithms—anthropic noise doesn’t erase that."  

  ---

  **Final Summary of Tactics**  
  - **Reframe** for dominance (Objection 1) and pragmatism (5): Softens CDT opposition without capitulation.  
  - **Stand ground** on bootstrapping (2), impotence (3), and CDT replication (6): Core arguments; compromise loses the thesis.  
  - **Concede** on infinity (4): Neutralizes moral philosophers; pivot to finite scale.  
  - For the silver bullet: **Concede uncertainty, reframe to plausibility**—never ignore or bluff.  

  This balances rigor with rhetorical survival. Focus on "evidential correlation in plausible large worlds," and if pressed, fall back to: "Even if EDT lost the Newcomb debate, large worlds change the game—here, it’s the only tool that scales." Good luck!
