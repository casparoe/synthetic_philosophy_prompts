  Therefore, the normative force of the Dutch book argument does not depend on the presence of an actual adversary. It is about the structure of your preferences being flawed. The argument is that if your preferences are inconsistent, then you are acting against your own interests (because you are accepting bets that collectively guarantee a loss).

  So step 4 is the problem: it confuses the practical risk of exploitation with the normative problem of inconsistency. The fact that no adversary is present does not make the inconsistency any less problematic from a rational point of view.

