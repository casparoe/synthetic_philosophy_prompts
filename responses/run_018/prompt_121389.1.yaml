  The integrity-erosion model sees this accumulation as inevitable since every compromise chips away at the coherence of each value system. The remainders aren't just additive but multiplicative, as each new negotiation occurs within already corrupted frameworks. This suggests a theoretical breaking point where the value systems become unrecognizable.

