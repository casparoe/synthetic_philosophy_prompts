answer: |-
  ## Joint Statement on Biological Function: An Adversarial Collaboration

  After twelve months of rigorous deliberation, we, representing the selected-effects (etiological) and causal-role perspectives on biological function, present this joint statement. While significant disagreement remains, we have established common ground, precisely defined our point of divergence, identified crucial test cases, and recorded our respective predictions to clarify the nature of our dispute for empirical resolution.

  **Shared Understanding:** We concur on several fundamental points regarding function ascriptions in biology. Firstly, attributing a function to a trait (e.g., "The function of the heart is to pump blood") is a substantive, non-vacuous claim. It is neither merely a description of what a trait *does* under specific conditions, nor is it solely a metaphorical shorthand. Secondly, function statements inherently relate a trait's activity to the *viability, persistence, or reproduction* of the organism or system containing it. A trait's function contributes, or contributed, to fitness. Thirdly, function talk implies a degree of non-accidentality; a functioning trait is typically a reliable feature of the system, not a random or pathological occurrence. Finally, both perspectives are naturalistic; they seek explanations grounded in physical processes, rejecting vitalism or supernatural purpose.

  **The Point of Division:** Our fundamental fracture occurs precisely when we specify the *grounds* or *truth conditions* for a valid function ascription. The selected-effects theorist holds that a trait T has function F *only if* T exists in the present system *because* ancestral versions of T performed F and were consequently favoured by natural selection. Function, in this view, is inherently historical and tied to the causal explanation for T's presence. The causal-role theorist holds that a trait T has function F *if and only if* T's current activity F contributes causally to a *current capacity* of the containing system (e.g., survival, reproduction, or a higher-level systemic capacity like circulation or digestion), and this contribution is explanatorily relevant within the system's current organisation. Function, in this view, is inherently ahistorical and tied to current causal dynamics.

  **Cruxes and Test Cases:** We agree that resolving our dispute requires evidence bearing on specific, critical sub-questions. We identify three key cruxes and the concrete cases or evidence we agree are relevant to each, along with our respective predictions:

  1.  **Crux 1: Can a Trait Acquire a Function Instantly Upon Performing a Beneficial Activity?**  
      *Case:* A novel, beneficial mutation (e.g., a modified enzyme conferring immediate resistance to a new, ubiquitous toxin) arises de novo in an individual and spreads rapidly through the population due to its advantage. Consider the trait's status *immediately after* the mutation occurs in the first individual, *before* any selection has operated on it (or its lineage) for this new effect.  
      *Relevant Evidence:* Does the trait demonstrably confer a significant survival/reproductive advantage *now*? Is the beneficial effect a direct causal consequence of the trait's structure/activity within the current organism? Is there *zero* relevant selection history for this specific effect?  
      *Selected-Effects Prediction:* The trait *lacks* a function at this precise, initial moment. Its activity is merely fortuitously beneficial. It only acquires the *function* of toxin resistance once it has been selected *for* that effect within the population lineage.  
      *Causal-Role Prediction:* The trait *has* the function of conferring toxin resistance immediately upon performing that beneficial activity within the organism's current physiology and environment. Its current causal contribution grounds the function ascription; selection history is irrelevant.

  2.  **Crux 2: When Does a Trait Lose a Historically Selected Function?**  
      *Case:* A trait with a clear, established evolutionary history of selection for effect F (e.g., the human appendix, plausibly selected for cellulose digestion in ancestors) now performs a different, minor, or negligible activity G (e.g., potential immune system role) within the current organism. The trait may be vestigial, reduced, or even slightly harmful, but retains some minimal causal interaction.  
      *Relevant Evidence:* Is the historical function F still performed effectively? Is the trait actively maintained by selection for F, G, or anything else? Does it perform *any* significant causal role (G) in the current system's capacities? Does its presence now impose a net cost?  
      *Selected-Effects Prediction:* The trait's *original* function F ceases to be its current function once it is no longer maintained by selection *for* F (or a sufficiently similar effect). If it now performs G and is maintained by selection *for* G, then G becomes its function. If it performs G but is not maintained by selection *for* G (e.g., it's a neutral or slightly deleterious vestige), it has *no* current function, even if G is a causal contribution. Its history defines its function(s), and functions cease when the relevant selective regime ceases.  
      *Causal-Role Prediction:* If the trait performs a causal role G that contributes *now* to a current systemic capacity (e.g., immune function), even minimally and even if vestigial, then G *is* its function, regardless of its evolutionary history or whether it's currently under selection. The function is defined by current causal contribution. If it performs *no* significant causal role in any current systemic capacity, it has no function.

  3.  **Crux 3: Must All Current Functions Be Adaptations?**  
      *Case:* A trait was selected for and maintained for effect F, but in the current organism/environment, it also reliably performs a distinct, beneficial effect H (an "exaptation" – e.g., feathers selected for thermoregulation now also enabling flight).  
      *Relevant Evidence:* Does the trait reliably perform H? Does H contribute to current fitness? Is H a consequence of the trait's current structure/activity? Was H part of the selective history?  
      *Selected-Effects Prediction:* The trait has the *function* F (from its history). Effect H is a beneficial *consequence* or *use* of the trait, but H only becomes a distinct *function* if there has been subsequent selection specifically *for* H, modifying the trait to enhance H. Otherwise, H is merely fortuitous.  
      *Causal-Role Prediction:* The trait has *both* function F (if F is still a current causal contribution) *and* function H. Both H and F are functions because they are current causal contributions to systemic capacities. Selection history may explain *why* the trait exists, but not *which* causal roles count as its functions now.

  **Residual Disagreement:** While we acknowledge that *some* debates around specific terms (like "purpose" or "design") may involve verbal elements, the core disagreement documented above is substantive. It concerns the fundamental metaphysical grounding of functional properties: are they historical (etiological) or current-systemic (causal-role)? This divergence reflects a deeper difference in explanatory priorities within biology – explaining *why a trait is present* versus explaining *how a current system works*. Our predictions for the specified cruxes are incompatible. Resolving these cases empirically (e.g., identifying truly novel, instantly beneficial mutations or definitively characterising vestigial contributions) will force one perspective to concede an unexpected outcome or refine its criteria, but will not automatically eliminate the core distinction. We remain committed to our respective positions but offer this statement to crystallise the debate and guide future empirical and conceptual investigation. The dispute is not merely verbal; it concerns the nature of biological explanation itself.
