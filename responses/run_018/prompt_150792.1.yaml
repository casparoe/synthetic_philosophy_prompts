answer: |-
  Here's a breakdown of your reverse-forgery scenario, reasoned probabilities, and how they interact. I'll distinguish settled findings from genuine philosophical/empirical contention.

  **Core Question Probability:**  
  My credence that **more than half the usual "value gap" would remain** if viewers knew they were seeing a perfect replacement Vermeer (despite physical indistinguishability): **~65%**. Below is the decomposition and reasoning.

  ### Decomposition & Probabilities
  *(Probabilities reflect likelihood of the statement being true/relevant to the value gap)*

  1.  **Aesthetic value has a non-epistemic causal-historical component.**  
      *   **Probability: 70%**  
      *   **Reasoning:** Many argue that an artwork's identity/value isn't *just* its appearance/configuration but its genesis – being the product of the artist's specific creative act in its historical context (e.g., Danto's "Artworld," Levinson's "Indicated Type"). The original Vermeer is *that specific object* created by Vermeer's hand in 17th-century Delft. A molecule-perfect replica created yesterday is a different *artifact*, lacking that causal history. This difference is ontological, not just about knowing which is which.  
      *   **Contention:** High. Formalists (like Clive Bell's "significant form") or strict empiricists argue aesthetic value is *entirely* in the perceivable properties. Others (e.g., Goodman in *Languages of Art*) argue while history matters for *identification*, aesthetic *judgment* should focus on the work's properties. **Not settled.**

  2.  **Viewers' reported preferences are mostly belief-driven about origin rather than direct perceptual differences.**  
      *   **Probability: 80%**  
      *   **Reasoning:** Empirical evidence strongly supports this. Blind tests consistently show people struggle to distinguish originals from high-quality copies perceptually. Crucially, *when told* something is an original/forgery/replica, valuation shifts dramatically:  
          *   Studies (e.g., on paintings, wine, violins) show knowledge of authenticity massively influences reported pleasure, value, and even perceived aesthetic qualities ("it looks more vibrant/authentic").  
          *   The "value gap" reported in forgery studies is largely driven by *knowledge* of the object's status, not inherent perceptual differences.  
      *   **Contention:** Low on the core mechanism (belief drives *reported* preference). **Settled.** High on whether this reflects a *legitimate* aspect of aesthetic experience or just snobbery/bias.

  3.  **Artistic achievement is partly constituted by the actual historical act, not just the result.**  
      *   **Probability: 50%**  
      *   **Reasoning:** This is deeply philosophical. Was Vermeer's achievement *making that specific object* under those historical constraints? Or was it *conceiving and realizing* the visual structure? If achievement lies in the *act* (overcoming historical limitations, unique skill execution), the replica lacks it. If achievement is the *idea made manifest* (regardless of how), the replica captures it. This connects to the "performance" aspect of creation.  
      *   **Contention:** Very High. Central debate in philosophy of art regarding the nature of authorship and creation. **Not settled.**

  4.  **The reverse-forgery scenario is conceptually coherent (destroying the original changes modal properties of the copy).**  
      *   **Probability: 60%**  
      *   **Reasoning:** The core physics/chemistry of copying seems coherent. The conceptual hang-up is on *identity* and *properties*:  
          *   If the original exists, the replica is unambiguously a *copy*.
          *   If the original is destroyed *first*, is the replica now *the artwork*? Or is it a *new perfect replica* of a destroyed artwork? Does destroying the original change the *kind* of thing the replica is? Modal realists might argue the replica's "originality-in-this-world" status changes its essential properties relative to possible worlds where the original exists.  
      *   **Contention:** High (metaphysics of art/identity). **Not settled.**

  ### Combining the Probabilities
  *   The persistence of the value gap depends heavily on **A** (History matters intrinsically) and **B** (Belief drives preference). **A (70%)** provides the *reason* why belief (**B, 80%**) would still influence value even without perceptual differences. **C (50%)** reinforces **A** if achievement requires the original act. **D (60%)** suggests the scenario itself isn't nonsense, allowing the gap to potentially exist.
  *   **Combined Estimate for Gap Persistence (>50%): ~65%.**  
      *   *Weighting:* High confidence in **B** (belief driving reported value) is the strongest anchor. **A** is likely enough to make that belief *meaningful* beyond simple snobbery. **C** and **D** add moderate support. This suggests the *knowledge* it's a replacement would trigger the "forgery discount" effect, even for a physically perfect replica. The gap wouldn't be *as large* as with a detectable forgery, but likely still significant.

  ### Impact of New Evidence (Blind Tests Confirm Indistinguishability)
  *   **Which term shifts most? B (Viewers' preferences are belief-driven) would shift DOWN significantly.**
      *   **Reasoning:** This evidence *strengthens* **B**. It confirms the gap *cannot* be due to perceptual differences and *must* be driven by belief/knowledge about origin. It makes the dependence on belief even *more* central to explaining the gap. Your question implies people *think* they can perceive a difference but actually can't. This directly proves the reported preference/value difference is belief-driven, not perception-driven.
      *   **Shift:** **B** would increase from **80% → 90%+**. The core mechanism becomes empirically undeniable.
  *   **Impact on Combined Probability:** This *increases* the credence in the gap persisting when viewers *know* it's a replica, as it removes perception as a confounding factor. My credence would rise from **~65% → ~75%**. The gap is now *entirely* attributable to the belief/knowledge, which points directly back to the importance of origin history (**A**) as the *reason* for that belief's power.

  ### Settled vs. Contested
  *   **Settled (Empirically):**
      *   People cannot reliably distinguish originals from high-quality copies in blind perceptual tests (for paintings like Vermeer).
      *   Knowledge of an object's status (original/forgery/replica) *dramatically* influences reported aesthetic value, emotional response, and even descriptions of perceptual qualities.
  *   **Genuinely Contested (Philosophically & Empirically):**
      *   **Is the causal-historical origin an *intrinsic*, non-epistemic part of the artwork's aesthetic value?** (A) Formalists vs. Contextualists.
      *   **Does the artistic achievement reside solely in the resulting object, or in the *act* of its creation under specific historical constraints?** (C)
      *   **Can the reverse-forgery scenario produce an object that is *the artwork*, or only a replica? Does destroying the original fundamentally change the nature of the copy?** (D) - Metaphysics of identity.
      *   **Is the belief-driven value gap revealed by the reverse-forgery scenario evidence of a *legitimate* ontological/aesthetic difference (A, C), or merely irrational bias/snobbery?** This is the core normative debate your friend is engaging in.

  **Conclusion:** Your friend's view ("full aesthetic value, origin just an epistemic tag") aligns with strict formalism or empiricism. The high probability (>65%) of a significant value gap persisting even with a perfect replacement suggests that for most people and within influential philosophical frameworks, the origin *is* more than just a tag – it's constitutively linked to the artwork's identity, achievement, and the value derived from its unique historical existence. The blind test evidence strengthens this conclusion by proving the value difference is driven by beliefs *about* origin, not perception of the object itself. The core dispute isn't about the *existence* of the belief-driven gap, but about its *justification*.
