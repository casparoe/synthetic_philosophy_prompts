prompt: |-
  hey, quick thing that's been bugging me. there's this idea people call reverse-forgery — an original painting gets destroyed but was scanned at molecular resolution first, so a perfect replacement is made that even the artist (if alive) couldn't tell apart. my friend says that in this scenario the replacement has full aesthetic value, which proves origin only matters as an epistemic tag. i think that's wrong but i'm not sure how wrong.

  specifically, what's your credence that if we ran this on a famous Vermeer portrait and told viewers they were seeing the replacement — physically identical in every detectable way — more than half of teh usual value gap people report between original and forgery would still remain?

  decompose it:
  - prob that aesthetic value has a non-epistemic causal-historical component
  - prob that viewers' reported preferences are mostly belief-driven about origin rather than direct perceptual differences
  - prob that artistic achievement is partly constituted by the actual historical act, not just the result
  - prob that the reverse-forgery scenario is conceptually coherent (some argue destroying teh original changes modal properties of teh copy)

  assign rough numbers, show how they combine, and tell me which term you'd shift most if you learned that in blind tests people genuinely can't distinguish originals from copies even when they think they can. also please separate what's settled from what's genuinely contested among people who know teh topic — don't present one contested view as the consensus. and don't just list philosophers, i want reasoning not a bibliography.
