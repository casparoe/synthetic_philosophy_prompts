answer: |-
  ## Brexit Referendum as Boundary Problem Case Study: Synchronic vs. Diachronic Membership

  This analysis rigorously maps your synchronic/diachronic distinction onto the 2016 UK referendum franchise rules, testing both the institutional design and the theoretical framework itself.

  **Core Definitions & Mapping:**

  1.  **Synchronic Membership:** Defined by *present subjection to the state's coercive authority*. Grounded in the immediate experience of binding laws, enforcement, and taxation.
      *   **Included:** British citizens and qualifying Commonwealth citizens *resident in the UK* (directly subject to UK law, taxation, police, courts daily).
      *   **Excluded:** Long-term UK expatriates (>15 years abroad) – *not currently subject* to the same daily coercive apparatus (taxation may differ, laws enforced remotely/indirectly).
      *   **Problematic Exclusion:** Long-settled EU nationals resident in the UK (non-Irish/Maltese/Cypriot) – *were fully subject* to UK coercive authority (laws, taxes, courts, police) identically to included residents. **Theory Illumination:** The synchronic principle *directly challenges* their exclusion. If legitimacy stems from being coerced *now*, their exclusion lacks justification based on this principle alone. Their inclusion becomes *mandated* by synchronic logic.
      *   **Theory Silent:** Does not resolve *why* the included non-UK Commonwealth citizens (e.g., Canadian, Indian) resident in the UK qualify while EU nationals do not – both are equally *synchronic subjects*. This points to historical/civic notions (Commonwealth legacy) beyond pure synchronic subjection.

  2.  **Diachronic Membership:** Defined by having *fundamental life prospects substantially shaped* by the decision across its relevant temporal horizon. Grounded in the profound, long-term impact on life chances, opportunities, rights, and environment.
      *   **Excluded (Institutionally & Theoretically Problematic):**
          *   **Future UK Generations:** Profoundly affected (economic opportunities, freedom of movement, rights frameworks, environmental/regulatory standards). Diachronic principle strongly suggests they should have a voice, but institutional representation is impossible. *Grounds:* Temporal existence; profound, irreversible impact on life trajectory.
          *   **Long-term UK Expatriates (>15 years):** Life prospects fundamentally altered (loss of EU freedom of movement rights, potential impacts on pensions, healthcare access, property rights, family reunification). *Grounds:* Citizenship + deep, lasting consequences despite current non-residence. Diachronic principle *demands their inclusion* far more strongly than the synchronic principle (which might justify exclusion).
      *   **Partially Included/Problematic:** Young voters (16-17 year olds excluded). While resident (synchronic), their *entire adult lives* were shaped by the decision. Diachronic logic suggests lowering the voting age for such consequential votes. *Grounds:* Age + temporal proximity to maximal impact horizon.
      *   **Included:** Resident voters – their own futures were also deeply affected. *Grounds:* Residency + citizenship + direct temporal impact.

  **Analysis: Theory Illuminating Episode & Episode Testing Theory**

  *   **Synchronic Principle vs. EU Resident Exclusion:**
      *   **Theory Illuminates:** The synchronic principle exposes the fundamental *inconsistency* in excluding long-settled EU nationals. They were subject to identical coercive authority as included Commonwealth residents. This highlights that the actual franchise relied on *citizenship status* (itself a boundary problem!) rather than a consistent principle of current subjection. The theory diagnoses a legitimacy gap.
      *   **Episode Tests Theory:** The episode forces synchronic theory to confront "degrees" of subjection. Was an EU national paying UK income tax and subject to UK courts *less* subjected than a Commonwealth citizen doing the same? Synchronic theory struggles to justify *any* distinction here based purely on current coercion. It reveals synchronic theory's potential radicalism – demanding near-universal suffrage for residents.

  *   **Diachronic Principle vs. Expatriate & Future Generation Exclusion:**
      *   **Theory Illuminates:** The diachronic principle sharply criticizes the disenfranchisement of long-term expatriates and the *complete* exclusion of future generations. Their fundamental life prospects were arguably *more* profoundly and irreversibly altered than many resident voters whose lives were already largely established. The 15-year rule appears arbitrary against the diachronic horizon of Brexit's impact (decades/centuries).
      *   **Episode Tests Theory (Severely):** The episode exposes the *operational impossibility* of pure diachronic inclusion. How do we represent future generations? How far into the future does the "relevant temporal horizon" extend? How do we weigh the interests of an 18-year-old UK resident (high diachronic impact) vs. a 70-year-old (lower)? Diachronic theory struggles with:
          *   **Representation Gap:** No viable institutional mechanism for future generations.
          *   **Boundary Fuzziness:** When does impact diminish enough to exclude? (Does a 14-year expat have *more* diachronic claim than a 16-year one?).
          *   **Conflict with Sovereignty:** Granting expatriates votes challenges territorial sovereignty principles and raises practical questions (e.g., dual citizens voting in multiple jurisdictions on overlapping issues).

  *   **Synchronic Demos Binding Diachronic Population:**
      *   **Core Revelation:** The Brexit case vividly illustrates that the boundary problem's core difficulty is not merely *locating* a line, but **justifying the binding authority of a synchronic demos over a diachronic population.** The referendum empowered a specific group (synchronic residents meeting citizenship criteria) to make an irrevocable, generation-shaping decision for:
          *   Those synchronic subjects excluded despite subjection (EU residents).
          *   Those previously synchronic subjects now excluded by time/geography (expatriates).
          *   Those who were not yet subjects but whose entire future subjection framework was determined (future generations).
      *   **Legitimacy Gap:** The synchronic definition creates a "presentist bias." The demos making the decision has imperfect overlap with the group experiencing the most significant long-term consequences. This creates a fundamental tension: democratic legitimacy derived from the consent of the governed *now* versus the profound imposition of costs/constraints on the governed *later* and *elsewhere*.
      *   **Theory's Limits:** Neither principle alone resolves this tension. Synchronic inclusion is administratively feasible but morally myopic for long-horizon decisions. Diachronic inclusion is morally compelling but institutionally intractable. The episode forces the theory to confront the inherent **temporal paradox of democracy**: How can a decision made by a demos defined at time T legitimately bind individuals who were not part of the demos at T (because they didn't exist, lived elsewhere, or were excluded by arbitrary rules) but are profoundly impacted at T+1, T+10, T+50?

  **Conclusion: What the Case Reveals about the Boundary Problem**

  The Brexit referendum serves as a powerful case study demonstrating that the boundary problem is fundamentally intertwined with the **problem of democratic time**. The episode reveals:

  1.  **Synchronic Subjection is Necessary but Insufficient:** While providing a clear(ish) criterion for current inclusion (exposing the illegitimacy of excluding long-resident EU nationals), it fails to capture the full scope of those whose lives are irrevocably shaped by major decisions, especially long-term expatriates and future generations.
  2.  **Diachronic Impact is Morally Compelling but Operationally Elusive:** It highlights the profound legitimacy deficit in excluding those with high diachronic stakes, but offers no practical solution for representation, leading to boundary fuzziness and implementation challenges.
  3.  **The Core Difficulty is Temporal Authority:** The central challenge illuminated is not just *who* constitutes the demos at a single point, but **how a demos defined synchronically can legitimately wield binding authority over a population that is inherently diachronic.** Brexit exemplifies the "tyranny of the present" over the future and the geographically displaced. It suggests that resolving the boundary problem for major constitutional decisions requires grappling explicitly with the temporal dimension of legitimacy, moving beyond frameworks focused solely on a single moment of consent or subjection. The case forces democratic theory to confront the limits of the synchronic model for decisions with profound and enduring consequences.
