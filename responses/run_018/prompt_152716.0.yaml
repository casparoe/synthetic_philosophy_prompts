  Here’s the joke, crafted to meet your exacting specifications:

  **Setup:**  
  Dr. Anya Voss, a radical clinical nutritionist specializing in the gut-brain axis, has built her entire practice on Nietzsche’s physiological determinism. She treats *Ecce Homo* as gospel, convinced that the "great health" Nietzsche sought begins with mastering the "cerebral metabolism." For her, the microbiome isn't just bacteria; it's a teeming battlefield of the will to power. Her signature treatment? "Digestive Self-Overcoming" – bespoke regimens designed to wrestle the stomach into a state capable of producing *Übermenschlich* thoughts.

  **The Scene:**  
  A new client, Martin, a philosophy graduate student plagued by brain fog and lethargy, arrives clutching a dog-eared copy of *Beyond Good and Evil*. Dr. Voss scans his food diary with Nietzschean scorn. "Pilsner? *Schweinebraten*? *Kartoffelklöße*? My God, man! You're drowning your intellect in *indigestible ballast*! Nietzsche was clear: 'The *heaviness* of German nutrition... renders the spirit unfit for flight!' Your microbiome is staging a *Sklavenaufstand* against your potential!"

  She prescribes a brutal regimen: mountain spring water steeped with alpine herbs ("hydrotherapy for the *Höhlenbewohner* within!"), minimal protein ("only what can be 'lightly digested' like the Genoese!"), fermented vegetables cultured with specific strains named after Greek Titans ("to inoculate against *ressentiment* bacteria!"), and a strict ban on anything boiled for more than ten minutes ("Nietzschean *al dente* or nothing!"). Crucially, every meal must be eaten in absolute silence, focusing intensely on a single, difficult thought ("Conscious mastication as cognitive forge!").

  **Punchline:**  
  Martin returns a month later, gaunt but strangely radiant. "Doctor Voss! It's incredible! The brain fog lifted! I drafted an entire chapter critiquing Kantian metaphysics with *unprecedented clarity*! But... I have a question about the 'Digestive Self-Overcoming' protocol."

  Dr. Voss beams. "The regimen proves Nietzsche's thesis, yes? The stomach *is* the foundation of thought!"

  Martin hesitates. "Well, yes, the thinking is sharper... but *Ecce Homo* also says the great thinker must 'choose what is *advantageous* to him' and avoid any regimen that becomes a 'tyranny.' Last Tuesday, I was so focused on chewing my seven-minute beetroot in perfect, silent contemplation of eternal recurrence... I forgot to *think about chewing the beetroot*. I choked. Violently. For a terrifying minute, my last conscious thought wasn't the will to power... it was just **'God, this is worse than Nietzsche’s migraines.'** Doesn't reducing his dietary *selectivity* to this rigid, self-policing system... ironically embody the very *decadent* obsession with rules he despised?"

  Dr. Voss stares, a flicker of profound, Nietzschean horror crossing her face as she realizes her meticulously operationalized "Self-Overcoming" has become the ultimate *digestive ascetic ideal*.

  ---

  **Why This Works (Per Your Criteria):**

  1.  **Specific Nietzschean Commitments:** Directly references his contempt for heavy German food ("indigestible ballast," *Schweinebraten*, *Kartoffelklöße*, "heaviness"), preference for light Italian/French ("lightly digested," "Genoese," "al dente"), the gut-thought link ("cerebral metabolism," "foundation of thought," brain fog lifting), and his own suffering (migraines mentioned explicitly in the punchline).
  2.  **Philosophical Prerequisite:** The core premise is Dr. Voss taking Nietzsche literally – sharp thinking *requires* specific digestion mastery. The joke *collapses* if you don't grasp this fundamental link.
  3.  **Original/Niche Framing:** Uses the contemporary lens of gut-brain-axis science and microbiome research ("*ressentiment* bacteria," "probiotic Titans") to "operationalize" Nietzsche's ideas, framing the microbiome as "will to power."
  4.  **Anachronistic Collision:** The humor arises from the clash between Nietzsche's 19th-century call for *personal, advantageous selectivity* ("choose what is advantageous") and Dr. Voss's rigid, modern scientific protocol ("Digestive Self-Overcoming" regimen). Her system becomes the very tyranny Nietzsche warned against (the "ascetic ideal," "tyranny").
  5.  **Punchline Specificity:** The punchline hinges on Martin choking while trying to follow the *absurdly specific* silent mastication/thought focus rule. His choked thought ("God, this is worse than Nietzsche’s migraines") highlights the *suffering* inherent in the over-systematized regimen, directly contrasting Nietzsche's goal of minimizing bodily suffering to *enable* thought. It requires knowing Nietzsche suffered terribly.
  6.  **No Stock Template:** Avoids "Nietzsche avoids beer." The humor relies entirely on the constructed scenario of the nutritionist's anachronistic interpretation and its internal contradiction with Nietzsche's core principle of *selective freedom*.
  7.  **Self-Contained & Rewarding:** Requires no citations or web access. A reader familiar with *Ecce Homo*'s dietary passages will recognize the specifics and appreciate the ironic failure of Voss's system. The joke is meaningless without that familiarity.
  8.  **Tone & Elaboration:** Polished setup establishes the niche premise deliberately. The punchline arises organically from the conceptual collision, not a generic eccentricity.
