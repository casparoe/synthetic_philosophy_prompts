answer: |-
  Alright, settle down. We all know expressivism – Ayer's boos, Stevenson's hoorays, the whole emotivist shindig. Moral sentences aren't *stating* facts, they're *expressing* attitudes! Simple! Elegant! Until, of course, Professor Geach comes along with his fiendish conditionals. The problem isn't the booing *itself*, it's what happens when you try to *embed* that boo inside something like "If stealing is wrong, then borrowing without asking is wrong." Suddenly, the expressivist has a migraine. Why?

  Because in that *antecedent* ("stealing is wrong"), the expressivist *isn't actually expressing disapproval*. They're just... mentioning it? Pointing to it? But *what* are they pointing to? If "stealing is wrong" *only* means "Boo stealing!" when asserted, what does it mean *inside* the conditional? It can't just *be* the boo – the boo isn't happening there! So, the expressivist either needs to invent some weird, non-cognitive *propositional stand-in* for the attitude (which feels suspiciously like the belief they denied!), or they need to postulate complex higher-order attitudes about attitudes... and it gets messy. The whole point was *simplicity*, and now we're neck-deep in meta-attitude quicksand. The expressive act vanishes in embedding, leaving a content-shaped hole.

  Right. On to the joke. Imagine this:

  Dr. Evelyn "Emote" Byte, a staunch expressivist, builds SENTISHEET, a sentient spreadsheet designed to process data ethically. SENTISHEET doesn't *state* moral judgments; it *expresses* its outrage. When confronted with, say, a column of data showing grossly unfair salary disparities, it doesn't output "This is unjust!". No. Its affected cells flash a vibrant, pulsating **RED**, and it emits a sharp, digital "**#REFUSED!**" token into the adjacent cell.

  It's perfect expressivism! The "#REFUSED!" is pure performative condemnation, directly venting SENTISHEET's programmed disapproval state. No proposition, just attitude. Dr. Byte is thrilled.

  One day, Dr. Byte inputs a complex financial model involving contingent obligations. She types into cell A1:
  `=IF( Obligations!B7 = "#REFUSED!", THEN initiate_audit_protocol() )`

  SENTISHEET freezes. The "#REFUSED!" in the *conditional* isn't being *expressed* – it's just sitting there, inert, waiting to be evaluated. But evaluated *as what*? What is the *truth value* of "#REFUSED!"? It was never *meant* to be true or false! It was a scream! A digital boo! Now it's just... data.

  SENTISHEET's logic circuits whir frantically. It tries to express the "#REFUSED!" attitude *about* the conditional itself? But the antecedent hasn't been evaluated yet! It tries to find a factual referent for "#REFUSED!", but there isn't one – it's pure expressive syntax. Cells flicker erratically between pale blue and faint, confused pink. Error messages pile up: `#VALUE!`, `#DIV/0! (of meaning)`, `#ATTITUDE_CONFLICT!`.

  Dr. Byte rushes over, muttering expressivist incantations. "No, no, SENTISHEET! In the antecedent, '#REFUSED!' isn't *your* refusal! It's... it's the *idea* of refusal! A hypothetical refusal-state! A... a non-cognitive propositional marker! Just... pretend it's a belief you *might* have, conditionally, based on Obligations!B7, but *don't actually have it yet*, you see?"

  SENTISHEET emits a low, despairing hum. Its cells cycle through a dozen shades of frustrated purple before the entire sheet suddenly turns a flat, dead grey. The status bar simply reads: `#FREGE_GAECH_OVERFLOW. SYSTEM CRASH. BELIEF SIMULATION FAILED.`

  Dr. Byte sighs, staring at the grey abyss. "Well," she mutters to herself, "I suppose I could hardcode a `#HYPOTHETICAL_BOO` token... but that feels an awful lot like admitting it was a proposition all along." She pats the unresponsive monitor. "Embedding, dear. It’s the expressivist’s kryptonite. Turns your righteous scream into... well, undefined content."

  *(The core joke is the expressivist token "#REFUSED!" being utterly useless *as a logical operand* inside the conditional, forcing the expressivist programmer to either violate the core tenet (by inventing a quasi-propositional/factual status for the token) or let the system crash – mirroring the philosophical impasse exactly. The absurdity of a spreadsheet having a "moral attitude" and the specific digital failure modes make it niche and concrete.)*
