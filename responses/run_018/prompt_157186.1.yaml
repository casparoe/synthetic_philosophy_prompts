  *realizes* Perhaps the strongest challenge comes from mathematical consequences the user might accept. Like if they grant the natural numbers as a completed set (since we can generate them), but then the power set "should" exist extensionally by analogy to finite sets... but that's exactly what they dispute!

  *taps fingers* I think the user is right that the view is hard to falsify directly. But maybe that's because it's more a philosophical stance than a scientific claim. The real test is whether it forces us to abandon useful math or science. Currently, it doesn't seem to.

