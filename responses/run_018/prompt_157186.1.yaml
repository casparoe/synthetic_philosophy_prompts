  *flips through mental notes on QM* Hilbert spaces in QM are tricky - while they're uncountable, we only ever deal with finite superpositions in practice. The continuum appears through limits and approximations. Not a clear win against structural finitism.

  Maybe mathematics itself could force the issue? If there were theorems that only hold under extensional infinity... but the user already grants transfinite math is formally consistent. Structural finitism seems compatible with most mathematical practice since mathematicians rarely "touch" actual infinities.

