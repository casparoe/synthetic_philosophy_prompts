prompt: |-
  I'm coordinating a small study group that reads rationalist-adjacent work on collective risk, and we recently got stuck arguing about whether the unilateralist's curse applies to what one member calls "interpretability leakage" — the publication of partial mechanistic explanations of frontier models that lower replication barriers without providing corresponding defensive tools. The discussion started with a casual reference to Bostrom's framing, but quickly moved into whether information goods can trigger the same aggregation dynamics as physical actions. I want a move-by-move adjudication of the actual exchange, not just an overall winner, because neither party was convinced and I need to see whether the framework is being misapplied or genuinely extended.

  Person A opened by claiming that publishing a novel red-teaming protocol is a clear instance: one lab releases the method unilaterally, other actors cannot retract it, and the aggregate effect is a raised competitive floor that accelerates capabilities research without a matching safety gain. Person B objected that the curse requires actions with direct physical or causal externalities summed across agents, whereas publishing a protocol is non-rivalrous and does not automatically cause anyone to build a more dangerous system — it merely supplies information that competitive actors might use. Person A countered that in a competitive market, information supply is causally sufficient for replication: if Lab A demonstrates that architecture X achieves capability Y, Labs B through N are strategically compelled to reproduce it, so the publication operates like an emission that each actor adds to a shared risk pool. Person B then distinguished strategic compulsion from causal aggregation, arguing that the curse depends on each contributor's action being individually negligible and therefore escaping moral accounting, whereas a high-profile publication is large, identifiable, and made with full strategic awareness — which makes it an arms-race decision, not a curse-driven externality. Person A conceded the identifiability point but insisted the dilution still holds: each researcher feels their single paper is a drop in the bucket, yet summed across hundreds of publications the information environment becomes genuinely hazardous, so the psychological structure of the curse is preserved even if the causal mechanism differs. Person B closed by saying that if you relax the causal mechanism that far, the concept loses its distinctive predictive power and collapses into a generic warning about competitive dynamics, which suggests the framework is being stretched beyond coherence.

  Please adjudicate each of these six moves — A's opening claim, B's initial objection, A's counter about strategic compulsion, B's distinction about identifiability, A's concession about dilution, and B's closing collapse charge — rating each as clearly correct, partially correct but missing something, or clearly mistaken. Say which party is more right overall, identify what both sides are missing about how the unilateralist's curse interacts with epistemic goods, and propose a modified principle — you may call it "epistemic unilateralism" if it helps — that captures whatever is genuinely right in both positions without reducing the curse to either pure information theory or pure strategic interaction. Present your adjudication in a table with these exact columns: Move, Speaker, Core Claim, Rating, Brief Justification, Critical Omission. After the table, provide a brief synthesis paragraph summarizing the overall verdict and spelling out the modified principle in one or two sentences.
reasoning: |-
  Hmm, the user is coordinating a study group on collective risk and they're stuck on whether the unilateralist's curse applies to "interpretability leakage" - publishing partial mechanistic explanations of AI models that lower replication barriers without providing safety tools. They've presented a detailed debate between Person A and Person B, with six specific moves, and want me to adjudicate each move step-by-step.

  Looking at the debate sequence: Person A opened by claiming publishing red-teaming protocols triggers the curse due to competitive pressures. Person B objected that information goods aren't causally equivalent to physical actions. Person A countered that information compels replication in competitive markets. Person B distinguished strategic compulsion from causal aggregation. Person A conceded identifiability but maintained psychological dilution applies. Person B argued this stretches the concept beyond coherence.

  I need to carefully evaluate each of these six moves. The unilateralist's curse traditionally applies to physical actions (like geoengineering) where individual contributions are small but collectively catastrophic. Here we're dealing with information goods - which are non-rivalrous and don't directly cause harm, but can enable harmful actions.

  For Person A's opening claim: While intuitively plausible, publishing protocols doesn't directly cause harm - it enables it. So I'd rate this as "partially correct but missing something" since it overlooks the distinction between enabling and causing.

  For Person B's objection: They correctly identify the causal externality gap, but underestimate how information can become causally potent in competitive environments. So also "partially correct but missing something."

  For Person A's counter: The strategic compulsion argument has merit in zero-sum environments, but overstates inevitability - actors still have choice. "Partially correct."

  For Person B's distinction: The identifiability point is strong - high-profile publications are morally accountable acts, not negligible contributions. "Clearly correct."

  For Person A's dilution concession: This captures the psychological aspect well - individual researchers do feel their contributions are drops in the bucket. "Partially correct."

  For Person B's closing argument: Correct that overextension risks conceptual dilution, but too dismissive of the novel risk structure. "Partially correct."

  Overall, Person B has stronger arguments about the traditional curse framework not cleanly applying, but Person A identifies a real phenomenon that deserves its own framing. Both miss that epistemic goods create a different kind of externality - they lower replication costs asymmetrically (benefiting capabilities more than safety) and create irreversible knowledge gains.

  I'll propose "Epistemic Unilateralism" as a modified principle: The publication of capabilities-relevant knowledge creates irreversible, non-rivalrous externalities that asymmetrically lower replication barriers in competitive environments, generating risks from aggregated enablement rather than direct summation.

  This captures A's concern about aggregated harm from many small publications while respecting B's point about distinct causal mechanisms. The key is recognizing information's unique properties: non-rivalry, irreversibility, and asymmetric impact in capability/safety races.
answer: |-
  Below is the move-by-move adjudication of your study group's debate, followed by a synthesis and modified principle. Each move is rated on conceptual alignment with the unilateralist's curse (UC) as defined by Bostrom (focused on **negligible individual contributions to aggregate harm via direct causal externality**).

  ### Adjudication Table
  | Move | Speaker | Core Claim | Rating | Brief Justification | Critical Omission |
  |------|---------|------------|--------|---------------------|-------------------|
  | **1. Opening Claim** | A | Publishing a red-teaming protocol triggers UC by raising capabilities floor without safety gains. | **Partially correct** | Correctly identifies harmful aggregation but misapplies UC: UC requires *direct* causal externality (e.g., pollution), whereas information enables but does not compel harm. | Ignores that information is non-rivalrous and requires *agent adoption* to manifest harm; UC typically assumes automatic aggregation. |
  | **2. Initial Objection** | B | UC requires physical/causal externalities; information is non-rivalrous and non-compulsory. | **Partially correct** | Correct on UC’s core mechanism (direct externality summation) but underestimates information’s *causal potency* in competitive dynamics. | Fails to acknowledge that in high-stakes races, information can *de facto* compel replication (e.g., via market pressure), creating indirect externality. |
  | **3. Strategic Compulsion Counter** | A | Competitive markets make information supply causally sufficient for replication, acting like an "emission." | **Partially correct** | Right about *strategic inevitability* in zero-sum contexts but overstates "causal sufficiency": Labs retain agency to ignore/delay replication. | Treats competitive pressure as mechanical causality; UC requires *negligible individual impact*, but a key publication is pivotal. |
  | **4. Identifiability Distinction** | B | UC relies on negligible individual actions; high-profile publications are identifiable strategic decisions (arms-race logic ≠ UC). | **Clearly correct** | Spot-on: UC’s essence is harm from *uncoordinated negligible contributions* (e.g., small geoengineering tests). A major publication is a salient, accountable act. | Underplays that *many* small interpretability leaks (not just one) could aggregate negligibly, reviving UC dynamics at scale. |
  | **5. Dilution Concession** | A | Psychological "drop in the bucket" effect persists across publications, preserving UC’s structure. | **Partially correct** | Correct about individual *perception* of low marginal impact but incorrect about UC mechanics: Hundreds of papers don’t *sum* like pollution; harm requires adoption. | Ignores that UC’s causal chain is additive externality → direct harm, whereas information enables *downstream choices* → harm. |
  | **6. Collapse Charge** | B | Overextending UC collapses it into generic competition theory, stripping predictive power. | **Partially correct** | Valid warning against conceptual dilution but too dismissive: Information goods *do* create novel aggregation dynamics distinct from physical UC. | Misses that *epistemic irreversibility* (once published, can’t be unlearned) creates a unique externality resembling UC’s "no takebacks" property. |

  ### Overall Verdict & Synthesis
  **Person B is more right overall** (4/6 moves rated higher) because they correctly uphold UC’s defining mechanism: *negligible individual actions causing direct, summed harm without requiring adoption decisions*. Person A identifies a real risk—aggregated information enabling harm—but misapplies UC by conflating *enablement* with *externality* and overlooking agency in adoption. Both miss a key nuance: **Epistemic goods create *asymmetric irreversibility***—once public, they lower replication costs *permanently* for capabilities (easy to weaponize) but not safety (hard to operationalize defenses), creating a risk of "enabling externalities."

  ### Modified Principle: Epistemic Unilateralism
  > **Epistemic Unilateralism**: Publishing capabilities-relevant knowledge in competitive environments creates irreversible, non-rivalrous externalities that asymmetrically lower replication barriers. This enables harmful aggregation when individual contributors underestimate their marginal impact on *collective enablement*, accelerating risks without commensurate safety gains.

  ### Why This Captures Both Views
  - **Addresses A’s concern**: Formalizes "interpretability leakage" as an *enabling externality* with psychological dilution effects.
  - **Addresses B’s concern**: Distinguishes from UC by centering *asymmetric irreversibility* (information can’t be retracted) and *adoption-dependent harm*.
  - **Predictive power preserved**: Explains why niche forums publishing model internals risk aggregated harm ("a thousand leaks") while high-profile papers are strategic acts.
