  **What links rebirth across skandha-streams?**  
  - **A1. Requires a "carrier"** (e.g., self-like entity)  
  - **B1. Bare causal continuity** (no carrier, only dependent origination)  

    - **If A1 (Carrier)**:  
      **Does narrative coherence have normative force?**  
      - **A1a. Yes, normative pull** (coherence morally required) → **Leaf 1: Modern Hybrid Storehouse-Narrative**  
        *Combines storehouse consciousness with normative narrative ethics. Rare in classical texts.*  
      - **A1b. No, only pragmatic** (coherence as convention) → **Leaf 2: Yogācāra (ālaya-vijñāna)**  
        *Storehouse consciousness carries karmic seeds; narrative is a useful fabrication.*  

    - **If B1 (Bare continuity)**:  
      **Does narrative coherence have normative force?**  
      - **A1c. Yes, normative pull** → **Leaf 3: [Logically Unstable]**  
        *Reductionism (no carrier) + normative narrative creates tension. No coherent position.*  
      - **A1d. No, only pragmatic** → **Leaf 4: Theravada Hard Reductionism / Parfit-Style Continuity**  
        *Self-illusion from ignorance; rebirth via causal chains (Dependent Origination/psychological connectedness); narrative is a practical tool.*  

  ---

  #### **If B (Affective clinging)**:  
  **What links rebirth across skandha-streams?**  
