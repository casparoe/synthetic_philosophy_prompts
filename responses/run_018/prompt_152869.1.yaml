answer: |-
  Below is a systematic breakdown of the phrase "people deserve what they earn," dissecting its core components into distinct interpretations. Each combination of **"earn"** (causal contribution, effort/labor, social recognition, moral virtue) and **"deserve"** (moral entitlement, proportional fittingness, institutional assignment, best consequences) is evaluated for plausibility and applied to your three scenarios.  

  ---

  ### **Key Definitions**  
  #### **Readings of "EARN"**  
  1. **Causal Contribution**: You "earn" X if you causally produced X (regardless of effort or intent).  
  2. **Effort/Labor**: You "earn" X only through sustained, intentional work/skill.  
  3. **Social Recognition**: You "earn" X if society collectively attributes X to you (e.g., via norms/laws).  
  4. **Moral Virtue**: You "earn" X if you acted virtuously or in alignment with moral ideals.  

  #### **Readings of "DESERVE"**  
  A. **Moral Entitlement**: A pre-social, innate right to X.  
  B. **Proportional Fittingness**: X should correspond to the quality/scale of your action.  
  C. **Institutional Assignment**: Rules/laws dictate that X is owed to you.  
  D. **Best Consequences**: Society is better off if you receive X.  

  ---

  ### **Combination Grid: Evaluations & Applications**  
  *(✓ = Supports the argument; ✗ = Contradicts; ~ = Neutral/Partial)*  

  | # | "Earn" + "Deserve" Combination            | Evaluation          | Inheritance (Friend) | CEO Bonus | Rescuer     |  
  |---|-------------------------------------------|---------------------|----------------------|-----------|-------------|  
  | 1 | **Causal Contribution + Moral Entitlement**   | *Defensible*        | ✗ (No causal role)   | ✓         | ✓           |  
  |   | *If you caused an outcome, you inherently deserve its benefits.* | (Libertarian view) | | | |  
  | 2 | **Effort/Labor + Moral Entitlement**          | *Defensible*        | ✓ (No effort)        | ~ (If effort≠value) | ✗ (No effort) |  
  |   | *Only conscious effort creates desert.*      | (Lockean labor theory) | | | |  
  | 3 | **Social Recognition + Institutional Assignment** | *Trivial*           | ✗ (Legal ≠ "earned") | ~         | ~           |  
  |   | *"Desert" is defined by society’s rules.*    | (Legal positivism)  | | | |  
  | 4 | **Moral Virtue + Proportional Fittingness**  | *Defensible*        | ✗ (No virtue)        | ✗ (If bonus≠virtue) | ✓ (Virtuous act) |  
  |   | *Virtuous acts deserve fitting rewards.*     | (Aristotelian)      | | | |  
  | 5 | **Causal Contribution + Proportional Fittingness** | *Defensible*        | ✗                    | ✓         | ✓           |  
  |   | *Reward should match scale of causal impact.* | (Utilitarian)       | | | |  
  | 6 | **Effort/Labor + Proportional Fittingness**  | *False*             | ✓                    | ✗ (Effort≠outcome) | ✗           |  
  |   | *Effort always merits proportional reward.* | (Ignores luck/skill)| | | |  
  | 7 | **Moral Virtue + Moral Entitlement**        | *Defensible*        | ✗                    | ~         | ✓           |  
  |   | *Virtue inherently deserves reward.*         | (Kantian ideal)     | | | |  
  | 8 | **Social Recognition + Best Consequences**   | *Defensible*        | ~ (If harmful)       | ~ (If incentivizes) | ~         |  
  |   | *Give X if it benefits society.*             | (Consequentialism)  | | | |  

  ---

  ### **Conclusions & Your Friend's Implicit View**  
  1. **Anti-Inheritance Argument**: Your friend likely relies on **#2 (Effort/Labor + Moral Entitlement)** or **#6 (Effort/Labor + Proportional Fittingness)**. These define "earn" strictly as *intentional effort*, excluding windfalls (inheritance) or instinctive acts (rescuer).  
  2. **Pro-CEO Bonus Argument**: Proponents use **#1 (Causal Contribution + Moral Entitlement)** or **#5 (Causal Contribution + Proportional Fittingness)**. Here, "earn" = *creating value*, regardless of effort (e.g., a CEO’s strategic decision).  
  3. **Instinctive Rescuer**: Only combinations that decouple "earn" from effort work here:  
     - **#1, #5**: She *caused* the rescue → deserves reward.  
     - **#4, #7**: Her act was *virtuous* → deserves praise.  
     - **#3, #8**: Society *recognizes/benefits* from rewarding heroism.  

  ### **Why the Slogan Is Ambiguous**  
  - **"Earn"** is not monolithic: It flexes between *causation*, *effort*, or *virtue*.  
  - **"Deserve"** shifts between *moral*, *proportional*, or *institutional* claims.  
  - **Your friend's error**: He assumes "earn" **must** mean *effort* (#2), but the CEO defender uses *causation* (#1), and the rescuer case requires *virtue* (#4) or *causation* (#1).  

  ### **Recommendation**  
  In debates, force clarity:  
  - *"Does 'earn' mean effort, results, or virtue?"*  
  - *"Is 'deserve' a moral right or a social tool?"*  
  This exposes when the same phrase hides conflicting ideals. Inheritance critics (#2) and CEO defenders (#1) aren’t even using the same definition of "earn." The rescuer demolishes effort-based definitions but fits cleanly into virtue/causation frameworks.
