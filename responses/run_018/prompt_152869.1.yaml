prompt: |-
  I've been thinking about fairness and inheritance after a long argument with a friend. He kept returning to "people deserve what they earn," using it to claim that inherited wealth is undeserved since you didn't work for it. But I then heard the exact same phrase used to defend large executive bonuses—if a CEO creates enormous value, she deserves a commensurate reward. Even more confusing, my cousin raised the case of a bystander who saves a drowning child through pure instinct: she didn't "earn" the rescue through sustained effort or skill, yet we feel she deserves praise, maybe even a medal or compensation. So I'm unsure whether the slogan is doing one job or many. Can you separate out the precise claims hiding inside "people deserve what they earn"? Specifically, lay out the distinct readings of "earn"—causal contribution, labor or effort, social recognition, moral virtue, or something else—and the distinct readings of "deserve"—moral entitlement, proportional fittingness, institutional assignment, or merely "it would be best if they received it." For each combination, say whether it is trivial, defensible, or false. Then tell me which combinations actually support my friend's anti-inheritance argument, which ones support the CEO-bonus argument, and which ones can accommodate the instinctive rescuer without contradiction. I want the answer structured as a menu of interpretations rather than one correct reading, since what I need is to identify which version my friend was implicitly relying on when he dismissed inherited wealth.
