prompt: |-
  ok so I'm prepping notes for a workshop on bounded rationality and I need a consistency check before I present. Here's roughly where I've landed:

  (1) I think satisficing is normatively correct for real agents, not just descriptively accurate - once you factor search costs into the normative calculus, there's no remaining "should" to maximize.
  (2) But I also hold that bounded rationality is purely descriptive; cognitive limits don't lower the normative bar, so an omniscient agent should still maximize and we should approximate that.
  (3) I reject aspiration-level adaptation at the individual level: you fix your "good enough" threshold ex-ante, not move it post-hock to rationalize what you found.
  (4) At the collective level (hiring committees, AI screening systems) I think dynamic adjustment of aspiration levels based on feedback is not only ok but required.
  (5) I think satisficing isn't reducible to cost-sensitive maximization - it's a structurally different form of reasoning, not optimization with a hidden computation budget.
  (6) I want AI decision procedures to apply deontic hard-filters (rule out some options entirely) before any utility comparison, and I call this institutional satisficing.

  Some of these feel like they pull in opposite directions but I can't tell which are real contradictions and which are just surface noise. Can you audit the package? Specifically: which pairs are genuinely in tension and how severely, which ones only look bad but dissolve on inspection, and what's the least costly single revision? Rank them by severity rather than listing equally. And I want to keep the core of (1) and (5) intact if possible - tell me what has to give and what it costs.
