  ### The Ontological Case for Conceptual Slippage in Analogical Figure-Ground Judgment

  In the microdomain of analogical figure-ground judgment, the distinction between "figure" and "ground" hinges not on perceptual salience (e.g., brightness, contrast, or motion) but on **relational structure**: the web of containment, adjacency, and topological dependencies that define how regions cohere as unified entities. Borderline cases arise when a region exhibits relational structures *identical in form* to canonical figures—e.g., nested containment or chained adjacency—yet lacks the perceptual prominence typically triggering the figure-ground split. Here, conceptual slippage—the fluid extension of "figure" to such regions—is not a failure of categorization but the concept’s *ontological mechanism* for adaptive generalization. This slippage is legitimized solely when crossing a **structural resonance threshold**, a minimal density of relational correspondences that anchors extension without arbitrariness. I defend this through three conceptual pillars.

  ---

  #### **1. Conceptual Slippage as Ontological Fluidity, Not Epistemic Failure**  
  The fluidity of "figure" is inherent to the microdomain’s ontology. A "figure" is defined by its *relational role* within a structural whole: it is a region bounded by asymmetric dependencies (e.g., a container depends on its contents for identity, but not vice versa). In borderline cases—say, a faintly outlined cell in a tissue sample adjacent to canonical cells—perceptual weakness does not negate the cell’s *structural position*: it is still nested within a larger organ (containment) and flanked by identical neighbors (adjacency). To insist on perceptual salience here would misconstrue the concept’s essence: "figure" is a relational primitive, not a sensory tag. Slippage—allowing the cell to be judged as "figure"—thus reflects the concept’s *adaptive capacity* to track structural roles across perceptual noise. This is ontological: the concept’s boundaries are *constitutively elastic* to accommodate structurally isomorphic variants, much like a verb adapts to novel subjects without losing grammatical coherence.

  ---

  #### **2. The Structural Resonance Threshold: Density Over Accident**  
  The threshold guards against arbitrariness by demanding a **minimal density of relational correspondences** between the candidate region and the canonical figure. Density is measured by two interlaced criteria:  
  - **Relational multiplicity**: The candidate must instantiate a *critical mass* of the relations defining "figure" (e.g., containment + adjacency + directional asymmetry).  
  - **Interdependence**: These relations must be *non-decomposable*—their meaning emerges from mutual reinforcement (e.g., adjacency alone is ambiguous, but adjacency *plus* containment fixes the region as a figure).  

  Consider a cloud formation that accidentally resembles a canonical "face" figure via one adjacency (e.g., two clouds aligned like eyes). This fails the threshold: it lacks density (no nested containment of "nose," no asymmetric dependencies) and interdependence (the adjacency is isolated, not embedded in a larger relational matrix). Conversely, a degraded archaeological fragment with faint but repeated adjacency chains (e.g., nested pottery shards) crosses the threshold: multiplicities of relations (containment of sub-regions, directional alignment) and their interdependence (shards cohere only via relational topology) create **structural resonance**—a Gestalt-like echo of the canonical pattern. Accident is blocked because random similarities are sparse and decomposable; resonance requires relational saturation that statistically resists coincidence.

  ---

  #### **3. Threshold as Ontological Grounding, Not Epistemic Proxy**  
  The threshold is not a heuristic for uncertain judges but a *condition of possibility* for the concept’s existence in the microdomain. Without it, "figure" would dissolve into infinite extensibility: any region adjacent to another could qualify, collapsing the figure-ground distinction. The threshold prevents this by tethering slippage to **structural integrity**:  
  - **Invariance under perturbation**: Canonical figures retain their "figure" status under perceptual degradation (e.g., blurring) if relational density persists. Borderline candidates inherit this invariance only when their relational matrix is dense enough to *simulate canonical resilience*.  
  - **Non-arbitrary discontinuity**: The threshold induces a sharp phase shift—not gradual ambiguity—between "resonant" and "non-resonant" candidates. A region with 60% relational density may fail, while 61% succeeds, but this discontinuity is ontological: below threshold, the concept *cannot* manifest without violating its structural definition.  

  For example, a smudge on a canvas with partial adjacency to a painted figure fails the threshold: it has no containment hierarchy or asymmetric dependencies, so labeling it "figure" would arbitrary. Yet a nearly invisible ink blot *within* a letter in a word (adjacent to other letters, contained in a word-unit) may cross it: the density of linguistic-relational roles (sequence, grouping) resonates with canonical "figure" structure, extending the concept non-arbitrarily.

  ---

  ### Conclusion: Fluidity as Structural Fidelity  
  In analogical figure-ground judgment, conceptual slippage is not boundary failure but **boundary refinement**. The structural resonance threshold ensures that extension is never arbitrary: it binds "figure" to regions replicating the relational topology of canonical cases at a density that precludes accident. This threshold is ontological—a minimal condition for the concept to *be* what it is—not a cognitive crutch. By embracing slippage as mechanism, we affirm that concepts in relational microdomains are inherently dynamic: their power lies not in rigid borders, but in their capacity to stretch *precisely as far as their structural essence resonates*.
