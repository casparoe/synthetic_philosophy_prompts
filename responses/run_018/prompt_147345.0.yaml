answer: |-
  Here's a self-contained thought experiment designed to your specifications:

  **The Case:** At a busy bus stop in London, a clearly marked queue snakes along the pavement. **Alex (Tourist)**, running slightly late for a pre-booked museum entry slot (non-urgent, no penalty for being late), sees the long queue. Having researched British etiquette online ("Always join the end of the queue") and observed people forming an orderly line, Alex deliberately steps past several waiting locals to stand near the front, justifying it internally as a one-time necessity to catch the next bus. Simultaneously, **Ben (Local)**, also running slightly late for the *same* museum entry slot and standing further back in the same queue, becomes impatient. Knowing the queueing norm implicitly from lifelong experience, Ben also deliberately pushes past several people ahead of him, including Alex, muttering "Late for an appointment," to stand at the very front. Both catch the bus marginally faster, causing minor annoyance and tutting but no verbal confrontation or physical harm.

  **Action:** Deliberate queue-jumping by both individuals for identical non-urgent reasons (avoiding being slightly late for a museum).
  **Method of Knowing Norm:** Alex - Researched online, observed queue formation. Ben - Lifelong cultural immersion/socialization.
  **Nearby Worlds:**
  1.  **Don't Know:** If Alex hadn't researched/didn't observe queueing, the "convention-is-moral" theorist might see less/moral fault. The "pure-social-rule" theorist would see no wrong.
  2.  **Don't Care:** If Alex knew but genuinely didn't care about *any* social rules, both theories likely condemn the action (intentional harm/disregard vs. intentional rule-breaking).

  **Theories' Verdicts:**
  *   **Convention-is-Moral Theorist:** Believes queueing embodies fairness, mutual respect, and social cooperation. Violating this *intentionally* is morally wrong *regardless of origin*. **Verdict:** **Both Alex and Ben act wrongly.** The harm isn't just annoyance; it's undermining a pro-social convention essential for smooth interaction. Ben's act might be *more* blameworthy as he actively betrays the system he benefits from, but Alex knowingly violates a recognized local moral structure.
  *   **Pure-Social-Rule Theorist:** Sees queueing as a useful, local, arbitrary convention. Its value is purely functional. **Verdict:** **Ben acts wrongly (breaking a rule binding on him), Alex does not.** Alex, as an outsider, isn't morally obligated to follow local social homework. Their action is merely impolite or unwise, not immoral. The minor annoyance caused is insufficient for moral wrongness without a binding convention.

  **The Crucial Feature:** **Intentional knowledge and deliberate violation** is doing the heavy lifting. It transforms a potential accident or misunderstanding into a conscious choice to disregard the norm. For the Convention-Moralist, this choice directly attacks the cooperative agreement. For the Pure-Rule theorist, it only matters for Ben because he's party to the agreement.

  **What if we strip away intentional knowledge?**
  *   If Alex *didn't* know the norm, the Convention-Moralist might argue ignorance partially excuses, as the *moral* agreement wasn't knowingly broken. The Pure-Rule theorist sees no obligation to begin with.
  *   If Ben *didn't* know (unlikely for a local), the Pure-Rule theorist would argue he can't be blamed for breaking a rule he didn't know bound him. The Convention-Moralist might still see harm to the cooperative structure.
  *   **Result:** Without intentional knowledge, the divergence between the theories *lessens significantly* regarding blame (though the Convention-Moralist might still see harm done to the convention itself).

  **Normative Spillover:** The Convention-Moralist might argue Alex's action causes "normative spillover": seeing a tourist flout the queue norm weakens the perceived importance of the convention for locals observing it, potentially eroding compliance with other pro-social norms (like yielding seats or orderly boarding) over time, even if the immediate harm is minor. The Pure-Rule theorist dismisses this, seeing spillover as merely a practical consequence of confusing multiple conventions, not a moral harm.

  **Why it Works for Discussion:** It isolates convention-breaking from significant tangible harm (only minor annoyance occurs). The identical actions/motivations of the tourist/local force focus onto the role of the agent's relationship to the convention itself. The niche "normative spillover" injects a concrete consequence beyond immediate feelings, supporting the Convention-Moralist view without resorting to sci-fi. It's grounded, relatable, and clearly shows the theoretical split.
