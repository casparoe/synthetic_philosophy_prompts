  We are going to design a decision procedure that helps avoid the sunk cost fallacy (like in the dollar auction) and escalation of commitment. The procedure must be simple, time-efficient, and usable by non-experts. It will consist of a checklist of questions that force the project lead to focus on future costs and benefits, ignoring sunk costs. The procedure will also identify when a decision is a values call (e.g., strategic, reputational) that must be escalated.

  **Decision Procedure: Go/Kill Checklist**

  **Step 0: Pre-meeting preparation (to be done before the meeting)**
  - For each project, the project lead must provide:
    a. The original business case (as approved) including expected costs, timeline, and benefits.
    b. Current status: sunk costs (time and money) to date, remaining estimated costs (time and money) to completion, and revised expected benefits (quantitative and qualitative) upon completion.
    c. Any new information that has emerged (e.g., market changes, technology shifts, contract changes).

  **In-meeting procedure (per project, 15 minutes max):**

  1. **Question 1: Is the project already completed?**
     - If yes: no decision needed (skip the rest).
     - If no: proceed to Question 2.

  2. **Question 2: What is the future cost to complete? (Ignore sunk costs)**
     - Project lead states: remaining time and money required to complete the project.
     - **Check**: Is this estimate credible? (If not, flag for escalation or require re-estimation.)
     - Proceed to Question 3.

  3. **Question 3: What are the future benefits upon completion? (Quantify if possible)**
     - Project lead states: the expected benefits (e.g., cost savings, revenue, strategic value) that will be realized after completion. These must be compared to the alternative of not doing the project.
     - **Check**: Are these benefits realistic and measurable? If not, can they be described in qualitative terms? If the benefits are entirely qualitative and hard to measure, note that and proceed, but be cautious.
     - Proceed to Question 4.

  4. **Question 4: What is the net future value? (Future benefits minus future costs)**
     - Calculate: Net Future Value (NFV) = Future Benefits - Future Costs (in monetary terms if possible).
     - If NFV is positive: the project is generating value from this point forward. Proceed to Question 5.
     - If NFV is negative: proceed to Question 6 (but note: negative NFV is a strong signal to kill).
     - If benefits are qualitative and cannot be quantified: skip to Question 5.

  5. **Question 5: Are there any non-financial strategic reasons to continue?**
     - This is the values call. Consider:
       - Reputational impact (e.g., will killing this project harm our brand or relationships?).
       - Strategic alignment (e.g., does this project open doors to future opportunities?).
       - Legal/contractual obligations (e.g., penalties, but note: penalties are a future cost and should have been included in Question 4 if quantifiable).
     - **Check**: Are these reasons compelling and verifiable? If they are not, then the project should be killed. If they are, then proceed to Question 6.

  6. **Question 6: What is the opportunity cost?**
     - Consider: What else could we do with the resources (money, time, people) that we would use to complete this project? Are there better uses?
     - This step is critical when NFV is negative or marginal. If the resources can be deployed elsewhere for a higher return, then killing the project is advisable.
     - **Note**: This step may require comparing with other projects. If the room does not have visibility on alternatives, it may be skipped or noted as a risk.

  **Decision Rules:**
  - If NFV is negative and there are no compelling strategic reasons (Question 5) that outweigh the negative value, then **Kill**.
  - If NFV is positive and the opportunity cost (Question 6) is not too high (i.e., it's the best use of resources), then **Go**.
  - If NFV is positive but the opportunity cost is high (i.e., there's a clearly better project that can use the resources), then **Kill**.
  - If the project is being kept alive solely because of sunk costs (e.g., "we've already spent so much"), that is not allowed. The sunk costs must not factor in.

  **Escalation Points:**
  - If the project lead cannot provide credible estimates for future costs or benefits (Steps 2 and 3), escalate to the decision-maker (you) for further investigation.
  - If the strategic reasons (Step 5) are highly subjective and contentious, escalate to the decision-maker (you) for a values call.

  **Important Notes:**
  - The procedure explicitly ignores sunk costs. They are irrelevant to the decision.
  - The procedure may misfire in cases where future benefits are highly uncertain or when strategic considerations are paramount but hard to quantify. It is designed to avoid the sunk cost trap, but it may lead to killing projects that have strategic importance if that importance is not articulated well.

