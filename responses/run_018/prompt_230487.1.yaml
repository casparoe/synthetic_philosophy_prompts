answer: |-
  ### Decision Procedure for Go/Kill Project Reviews  
  **Core Principle:** Ignore sunk costs (time/money already spent). Focus *only* on future costs, future benefits, and strategic alignment. Escalate when values (e.g., reputation, relationships) override economics.  
  **Time:** ≤15 minutes per project.  
  **Participants:** Project lead presents facts; facilitator enforces procedure.  

  ---

  #### Checklist (Run in Order)  
  1. **Future Cost to Complete**  
     *Question: "Ignoring all prior spend, what is the *best estimate* of time and money needed to finish?"*  
     - **Good enough:** Credible, data-backed estimate (e.g., "9 months, $1.4M").  
     - **Stop/kill if:** No estimate, or estimate is "TBD/unknown."  
     - **Escalate to you if:** Estimate is disputed or lacks evidence.  

  2. **Future Benefits if Completed**  
     *Question: "Ignoring all prior spend, what *new* benefits will we gain *after* completion? Quantify if possible."*  
     - **Good enough:** Tangible benefits (e.g., cost savings, revenue, risk reduction) or clear strategic goals (e.g., "keeps key customer").  
     - **Stop/kill if:** No material benefits identified.  
     - **Escalate to you if:** Benefits are qualitative/strategic (e.g., "reputation") and contentious.  

  3. **Net Future Value (NFV) Calculation**  
     *Question: "Subtract future costs (Step 1) from future benefits (Step 2). What’s the net value?"*  
     - **Good enough:** Simple math (e.g., "$500K savings - $1M cost = -$500K").  
     - **Stop/kill if:** NFV is negative (future costs > future benefits).  
     - **Go if:** NFV is positive (future benefits > future costs).  
     - **Escalate to you if:** NFV is marginal (±10%) or benefits/costs are unquantifiable.  

  4. **Opportunity Cost**  
     *Question: "Could the resources (money/team/time) deliver higher value elsewhere?"*  
     - **Good enough:** Comparison to other projects/options (e.g., "This team could earn $2M on Project X instead").  
     - **Stop/kill if:** Resources are scarce and alternatives exist with higher NFV.  
     - **Go if:** No better alternatives or resources are idle.  

  5. **Strategic Override (Values Call)**  
     *Question: "Even if NFV is negative, is there a non-negotiable strategic reason to continue?"*  
     - **Good enough:** Concrete, evidence-based impact (e.g., "Canceling voids $10M in contracts with this client").  
     - **Stop/kill if:** No strategic imperative.  
     - **Escalate to you if:** Strategic rationale is subjective (e.g., "reputational risk") or disputed.  

  **Final Decision Rules:**  
  - **Kill:** NFV negative + no strategic override + high opportunity cost.  
  - **Go:** NFV positive + low opportunity cost.  
  - **Escalate to you:** Strategic override claimed, NFV marginal, or data gaps.  

  **How This Fights Sunk Cost Bias:**  
  - Forbids mentioning past spend (penalize anyone who says "we’ve already invested X").  
  - Forces "future-only" math.  
  - Isolates emotional appeals to Step 5 (where you intervene).  

  **Where It Misfires:**  
  - **False kills:** Projects with unquantifiable strategic value (e.g., R&D).  
  - **False goes:** When "best estimates" (Step 1) are overly optimistic.  
  - **Room resistance:** Project leads fight Step 2 (deny future benefits) or Step 5 (inflate strategic importance).  

  --- 

  ### Application to Your Projects  
  **Key:** All sunk costs ($2.1M, past losses, $300K bid spend) are **ignored**. Decisions based on future costs/benefits only.  

  #### **Project 1: Software Migration**  
  - **Step 1 (Future Cost):** 9 months, $1.4M. *Good enough.*  
  - **Step 2 (Future Benefits):** $90K/year licensing savings. *Quantified.*  
  - **Step 3 (NFV):** Future benefits = $90K/year. Over 5 years (reasonable horizon) = $450K.  
    - NFV = $450K - $1.4M = **-$950K** → **Negative**.  
  - **Step 4 (Opportunity Cost):** $1.4M and team could build revenue-generating projects.  
  - **Step 5 (Strategic Override):** No new capabilities, no strategic rationale given.  
  - **Decision:** **Kill** (NFV negative, no strategic case).  
  - **Room Fight:** Project lead argues "We can’t waste $2.1M!" (sunk cost bias). Facilitator rejects. **You’ll hate this**—but continuing loses $950K more.  

  #### **Project 2: Unprofitable Product Line**  
  - **Step 1 (Future Cost):** 1 year of operating losses (unknown amount). *Poor estimate—escalate for data.*  
    - *Revised estimate needed:* Assume loss = $X (from historical data).  
  - **Step 2 (Future Benefits):** Avoid $600K penalty + retain customer’s other business (profit > losses). *Quantifiable.*  
    - Benefits = $600K + $Y (where $Y = profit from other business).  
  - **Step 3 (NFV):** NFV = ($600K + $Y) - $X.  
    - Since $Y > |$X| (other biz profit > product line loss), NFV = $600K + ($Y - $X) → **Positive**.  
  - **Step 4 (Opportunity Cost):** Resources could be used elsewhere, but losing customer risks >$Y profit.  
  - **Step 5 (Strategic Override):** Not needed (NFV positive), but retaining strategic customer is valid.  
  - **Decision:** **Go** (NFV positive, strategic relationship).  
  - **Room Fight:** Finance argues "We lost money last year!" (sunk cost). Facilitator focuses on future NFV.  

  #### **Project 3: Government Bid**  
  - **Step 1 (Future Cost):** Submission cost (unknown). *Poor estimate—escalate for data.*  
    - *Revised estimate:* "Submission cost" = $Z (e.g., $100K).  
  - **Step 2 (Future Benefits):** Expected return = $50K over submission costs. *Quantified.*  
    - Benefits = $Z (cost) + $50K = $Z + $50K.  
  - **Step 3 (NFV):** NFV = ($Z + $50K) - $Z = **$50K** → **Positive**.  
  - **Step 4 (Opportunity Cost):** Team could pursue other bids. If $50K is low for effort, kill.  
  - **Step 5 (Strategic Override):** None claimed.  
  - **Decision:** **Go** (NFV positive, assumes $50K > opportunity cost).  
  - **Room Fight:** Team says "We spent $300K already!" (sunk cost). Facilitator ignores.  

  --- 

  **Summary of Decisions:**  
  - **Project 1:** Kill (rigorous math forces this—avoids $950K future loss).  
  - **Project 2:** Go (strong NFV + strategic value).  
  - **Project 3:** Go (positive NFV, but verify submission costs).  

  **Critical Flaws in Real Rooms:**  
  1. **Project 1:** Leads will *rage* against ignoring $2.1M sunk cost. Hold firm—the $1.4M future cost is the issue.  
  2. **Project 2:** Requires hard data on losses ($X) and customer profit ($Y). Escalate if unavailable.  
  3. **Project 3:** If submission costs are high (e.g., $500K) and $50K is marginal, kill—but the math defaults to go.  

  **Pro Tip:** Pre-set kill criteria at project kickoff (e.g., "If future costs exceed benefits by 2X, auto-kill"). This procedure makes sunk costs irrelevant—focus on stopping the bleeding.
