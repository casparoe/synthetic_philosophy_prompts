answer: |-
  **Bottom line:** Queuing creates the strongest obligation for visitors because violating it exploits the very collective expectation (that everyone will wait) which makes the system function efficiently and fairly for locals.

  **The Convention's Claim (Sonnet)**

  A coin left quiet on the Tokyo tray
  Is kindness, maybe, not a binding debt.
  Where Berlin's empty street holds no display
  Of crossing guards, quick steps cause no regret.
  The London queue, a patient, winding line,
  Seems just another local rule to know –
  Like where to stand, or pouring proper wine –
  A simple way to make the traffic flow.

  But wait! That queue depends on mutual trust,
  The shared belief *all others* too will stand.
  The cutter gains a place that isn't just
  A broken rule, but stolen common land.

  Is this then duty, born of shared accord,
  Or strategy, to keep the system stored?
  The line holds tension, neither truth ignored.

  **Logic Breakdown:**
  1.  **Octave (Convention View):** Lines 1-4 (tipping in Tokyo as optional kindness), Lines 5-8 (queuing in London presented alongside jaywalking in Berlin as simply "local rules" for smooth "traffic flow" – practical coordination).
  2.  **Volta (Line 9 - Collective Expectation):** "But wait!" introduces the critical shift. The queue is different because it relies on "mutual trust" and the "shared belief" everyone will wait.
  3.  **Lines 10-11 (Objection):** Cutting exploits this trust ("stolen common land"), it's free-riding on an essential collective agreement locals depend on for fairness and function.
  4.  **Sestet (Questioning the Asymmetry):** Lines 12-13 ask if this reliance makes queuing a true "duty" (moral) or merely smart "strategy" (practical) to maintain the system.
  5.  **Couplet (Unresolved Tension):** The final couplet states the core tension – the queue embodies this unresolved conflict ("holds tension") between seeing it as a moral obligation ("duty") or a practical necessity ("strategy"), refusing to declare one "truth" dominant ("neither truth ignored").
