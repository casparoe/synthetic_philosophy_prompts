  They might be inconsistent with Troy vs. Exodus because Troy has both textual and archaeological evidence aligned, while Exodus has disjointed evidence. So corroboration is key. 

  Also, the user values contemporary records highly, which is why Arthur and the blacksmiths are legends. The made-up case tests their consistency, and they held firm, which shows they prioritize textual continuity over isolated artifacts. 

