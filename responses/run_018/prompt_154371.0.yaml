  We frame the problem by distinguishing:
  - Synchronic consistency-recognition: a system's ability at a single time to verify its own consistency.
  - Diachronic consistency-tracking: an evolving system's capacity to maintain consistency-checking procedures across updates.

  The existing debate does not examine whether restricting the argument to systems with non-revisable core rules (diachronic, fixed-architecture) changes the dialectic.

  We propose the approach in stages:
  1. Formalize a minimal model of a diachronic cognitive system with fixed inference rules and representational capacities for basic arithmetic.
  2. Determine whether Gödel's construction yields a true-but-unprovable sentence in that system's language.
  3. Evaluate whether human mathematical practice exhibits diachronic consistency-tracking that exceeds the model's capacities, and whether that excess can be explained by resource-bounded update mechanisms or requires non-mechanism.

  Possible conclusions:
  - The restricted argument succeeds.
  - Or it collapses because diachronic tracking is either mechanistically replicable or not demonstrably possessed by humans.

  Failure conditions:
