prompt: |-
  I have recently taken a seat on a small foundation board that must split its annual budget between quantifiable direct-health programs and climate-resilience projects whose benefits resist monetization. Please describe the most important implications of the measurability-bias critique within effective altruism for how such a board should weigh the two categories, particularly on whether treating unmeasurable outcomes as zero is an epistemic error rather than a conservative heuristic, and on what institutional safeguards would be needed if we abandoned that heuristic. Give your response as a numbered list of exactly five points, each expressed in one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is asking about measurability bias in effective altruism, specifically for a small foundation board that splits its budget between measurable health programs and hard-to-measure climate resilience projects. They want to know if treating unmeasurable outcomes as zero is an epistemic error and what safeguards would be needed if they abandon that heuristic. They want exactly five points in a numbered list without introduction or conclusion.

  The user is likely new to this role, as they mention "recently taken a seat." They're dealing with a practical dilemma: balancing quantifiable impacts with unquantifiable ones, which is common in philanthropy. Their deeper need might be to feel confident in their decision-making, avoiding biases while ensuring the foundation's resources are used effectively. They could be worried about criticism from others on the board or stakeholders who favor measurable outcomes.

  The core issue from effective altruism is measurability bias—the tendency to overvalue what can be measured and undervalue what can't. I need to address why treating unmeasurable outcomes as zero is problematic: it's an epistemic error because it ignores potential value, not a conservative choice. Then, outline safeguards for abandoning that heuristic, like structured qualitative assessments.

  For the response, I'll structure it in exactly five points. Point 1 should explain the bias and the error. Point 2 will cover why it's an error, not heuristic. Point 3 will discuss alternative evaluation methods. Point 4 will highlight the need for safeguards to prevent subjectivity. Point 5 will emphasize strategic trade-offs and transparency. Each point must be concise—one or two sentences—to meet the user's request.

  I recall key concepts from effective altruism: measurability bias leads to underinvestment in areas like policy or long-term risks. Abandoning the zero heuristic requires robust processes to avoid arbitrariness. Safeguards could include diverse expert input, scenario planning, and clear criteria.

  Finally, I'll ensure the language is professional but accessible, avoiding jargon where possible. This should help the user apply it directly to their board discussions.
answer: |-
  Here is the numbered list:

  1.  Measurability bias critiques the systematic undervaluation of interventions with hard-to-quantify benefits; treating unmeasurable outcomes as zero is an epistemic error because it ignores potentially immense, albeit uncertain, value rather than conservatively reflecting true low probability.
  2.  Abandoning the zero heuristic requires explicitly acknowledging the high uncertainty of climate resilience benefits and using qualitative or comparative assessments (e.g., expert judgment, scenario analysis) to estimate their approximate magnitude, avoiding false precision.
  3.  Robust institutional safeguards are essential: implement structured qualitative evaluation frameworks with clear criteria, ensure diverse expert input for assessing climate projects, and mandate explicit documentation of assumptions and uncertainty levels for all funding decisions.
  4.  To prevent subjective bias from replacing measurability bias, establish formal processes for challenging benefit estimates (e.g., red-teaming, independent review panels) and require regular retrospective reviews of climate project assumptions against emerging evidence.
  5.  The board must consciously make strategic trade-offs between measurable health gains and potential high-impact resilience, recognizing that allocating *some* resources to the latter is often justified by catastrophic risk reduction, but with funding levels explicitly tied to the strength of the qualitative case and safeguards.
