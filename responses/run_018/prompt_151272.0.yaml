answer: |-
  Good morning. To our clinical colleagues who navigate the profound distress of patients feeling unreal, detached, or mechanized — and to our theoretical colleagues dissecting the architectures of selfhood — welcome. This workshop exists because of you, and for a shared question: *where does the interface crack?*  

  We begin with a constraint: consciousness as a **user illusion**. Not as metaphor, but as functional architecture. Subjective experience is not a window into hidden mental states. It is an interface — one that evolved to simplify, predict, and control. Like any interface, it conceals its machinery: the generative models, prediction errors, and hierarchical inference that construct our world. Critically, it presents a *self-model* — the felt "I" — as immediate presence. This model is not a lie, but a pragmatic tool. Its transparency is its success: we *inhabit* it, unaware of its rendering.  

  But transparency fails. In depersonalization, the self-model fractures. Patients report watching themselves from afar, feeling like automata, or moving through a fogged lens. Crucially, this is **not** a revelation of some "true" self beneath the interface. It is a breakdown *of* the interface — a glitch in the machinery that usually renders selfhood invisible. The model becomes opaque, and the user stumbles.  

  Our task? To map these fractures. Clinicians: your patients’ reports are not mystical insights, but vital data about *what the system signals when transparency collapses*. Theorists: your models of predictive processing, self-binding, and hierarchy are not abstract toys — they are tools to decode why the system fails to self-conceal. Neither perspective owns the truth. The patient’s "unreality" is neither sacred nor noise; it is a symptom of representational machinery forced into visibility.  

  We will not bridge the explanatory gap. We will not pretend to access "what it’s like" behind the report. Instead, we ask:  
  - *Where* in the architecture does transparency destabilize?  
  - *Why* does the system expose its own scaffolding as dread or detachment?  
  - How do we refine both clinical intervention and theoretical rigor *without* collapsing into mysticism ("the pain is beyond science") or eliminativism ("the pain is just faulty circuitry")?  

  Our goal is neither unity nor conquest, but calibration: tightening the dialogue between lived suffering and the models that explain it. Let’s begin.
