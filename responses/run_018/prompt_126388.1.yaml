  Hmm, the user seems intellectually engaged—they're testing theoretical boundaries with concrete examples while also sensitive to real-world exclusion risks. Their "air breathing" argument is clever reductio ad absurdum, but I need to dismantle it without sounding dogmatic. The immigration accusation is trickier; I must clarify reciprocity isn't about birthplace but mutual obligation, while acknowledging their concern isn't unfounded—some *do* misuse such concepts. 

  For my rebuttal: First, reframe air-breathing as passive, non-binding impact versus active participation in shared systems. Then pivot to stress reciprocity’s purpose—preventing trivial claims, not people. Finally, explicitly separate the principle from nativism by emphasizing ongoing contribution over origin. Keep it tight; they demanded one paragraph. 

