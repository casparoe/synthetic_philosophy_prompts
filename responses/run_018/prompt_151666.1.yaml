prompt: |-
  I'm moderating a podcast interview for my philosophy-of-science seminar, and the guest is Dr. Aris Thorne, an invented defender of "stake-indexed inference to the best explanation"—the view that explanatory virtues such as simplicity, scope, and predictive precision are not weighted by domain-independent norms but are systematically recalibrated according to the practical stakes of the decision the explanation is meant to guide. I want to move well beyond having him restate the position: I need questions that press exactly where the literature on abduction presses, especially the circularity worry that we calibrate stakes using prior explanatory success and then use those stakes to rank explanations, and whether this makes scientific realism contingent on our practical interests rather than on truth-tracking success. The audience includes graduate students in philosophy and cognitive science, so the questions should be technically precise without relying on obscure citations. Please respond with exactly five numbered items and no introduction or conclusion; each item should be one or two sentences containing a direct interview question immediately followed by the follow-up keyed to the answer he is most likely to give.
