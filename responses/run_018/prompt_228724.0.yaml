prompt: |-
  I sit on the small-grants committee for my university's center for experimental philosophy, and we're split down the middle on a proposal I need to write the decision memo for. A grad student is asking for $12,000 to run what she calls a field test of superrational reasoning, inspired by the lottery games Hofstadter ran in his old Scientific American column. Her design: an online lottery, open to the general public, advertised through puzzle and rationality forums. Entry costs $2, one entry per person. After entries close, one entrant is drawn at random and wins a prize equal to $50,000 divided by the total number of entries. So if fifty people enter, the winner gets $1,000. If fifty thousand enter, the winner gets a dollar. The grant money is there to cover the payout if entry numbers stay low, since the center loses money whenever fewer than about 160 people enter and profits after that.

  Her pitch is explicitly philosophical. She says the player base she's recruiting is about as close as you can get to the ideal case for the symmetry argument: people who all know the rules, know that everyone else knows them, and know that everyone is facing the identical decision. If the "we're all in the same epistemic situation, so we should all land on the same choice" style of reasoning (she calls it superrationality, she mentions the Platonia dilemma by name) has any real pull, entries should stay low, either because everyone abstains or because everyone does the mixed-strategy thing where you enter only with some small probability so the expected crowd stays tiny and the prize stays huge. If it has no pull, the lure wins, entries flood in, and the prize collapses to nothing. Either way, she says, we learn whether that family of arguments describes anything real about how reflective people actually choose, as opposed to being a just-so story philosophers tell each other.

  The objections flying around the committee: (1) this is a re-run of a stunt from the 80s dressed up as research; (2) no possible outcome discriminates between her hypotheses -- if few people enter, that could be superrational restraint, ordinary expected-value math, or nobody seeing the ad, and if many enter, a superrationalist can just say the crowd wasn't really like-minded; (3) the economics only work in the center's favor if participants reason badly, so we're effectively running a fundraiser that profits from confusion, and several members think that fails some basic duty to participants even though it's legal and the entry fee is two bucks; (4) her plan to post the running entry total on the site "for transparency" seems to half of us like it destroys the very coordination problem she's studying, and to the other half like the only thing making the study fair.

  Draft the committee's memo: fund, don't fund, or fund with conditions. Give a clear bottom line up front, then the reasoning. The memo has to actually engage with the symmetry argument she's testing rather than just gesturing at it -- including whether any result would count against it, and what design changes (pre-registration, a control arm, different disclosure) would make the experiment answer a real question. Give the strongest version of whichever side loses, because this memo is going to be quoted back at us either way. And take an actual position on the transparency fight, since I suspect that's where the whole thing turns.
reasoning: |-
  Okay, the user is part of a small-grants committee for a university center focused on experimental philosophy. They're split on a grad student's proposal to run a field test on superrational reasoning. The proposal involves an online lottery inspired by Hofstadter's work, where the prize decreases as more people enter. The user needs to draft a decision memo that addresses the committee's concerns and takes a stance.

  First, I need to understand the key elements of the proposal. The grad student wants to test if people in a symmetric knowledge situation will coordinate to keep entries low, as superrationality suggests. The committee has several objections: it's a rehash of an 80s stunt, the results are ambiguous, the center profits if participants reason poorly, and transparency about entry counts might influence behavior.

  The user emphasized the need to engage deeply with the symmetry argument. So, I should explain how superrationality differs from standard game theory. In the prisoner's dilemma, superrationality assumes players will coordinate on the cooperative solution because they recognize their symmetry. But in this lottery, if everyone thinks superrationally, they might all abstain to keep the prize high, or use mixed strategies. However, if many enter, the prize becomes negligible, which is worse for everyone. The grad student is testing if this reasoning actually influences real people.

  The committee's objections need addressing. For objection 1, even though Hofstadter did similar lotteries, those weren't systematic studies. Modern online platforms allow larger, more diverse samples, and preregistration can make it rigorous research. Objection 2 is about ambiguous results. If few enter, it could be superrationality, but also low awareness or altruism. If many enter, superrationalists might say the group wasn't ideal. The memo should note these limitations but argue that extreme results (very low or very high turnout) still provide insights, especially with preregistered predictions.

  Objection 3 is ethical: the center profits if participants misjudge. But the entry fee is low, and participants are informed. The real issue is whether it's exploitative. The memo could argue that as long as transparency is clear, it's acceptable. Objection 4 is crucial—posting real-time entry counts. This might help coordination, which is necessary to test if superrationality can work in practice. Without it, participants can't coordinate, making the symmetry argument untestable. So supporting transparency is key.

  The user wants a clear bottom line. After weighing, funding with conditions seems best. Require preregistration of hypotheses and analysis plans to prevent p-hacking. Transparency about entry counts is essential for the coordination test. Also, ensure robust participant information and ethics approval. This addresses the main concerns while allowing the research to proceed.

  The losing side (full denial) has valid points: ambiguity in results and ethical worries. The memo should concede that no single outcome is definitive but argue that the experiment can still probe the limits of superrational reasoning in real groups. Ethically, the low stakes and informed consent mitigate concerns. 

  Finally, the memo must take a stance on transparency. Posting entry counts is necessary because superrationality requires common knowledge and coordination. Without it, the test isn't fair. The design hinges on this feature.
answer: |-
  ## Decision Memo: Graduate Research Proposal "Field Test of Superrational Reasoning"

  **Bottom Line: Fund with Conditions ($12,000 awarded).**

  **Reasoning:**

  The committee acknowledges the proposal's ambition to empirically test the behavioral traction of "superrational" reasoning – a core philosophical concept concerning symmetric knowledge and coordinated choice – in a controlled field setting. While significant concerns exist (articulated below), the potential to generate unique data on how idealized reasoning models manifest (or fail) in real-world decision-making justifies support, provided specific methodological safeguards are implemented.

  ### Engagement with the Symmetry Argument & Core Hypothesis
  The proposal correctly identifies the Platonia Dilemma/Hofstadter Lottery as a practical testbed for superrationality. This reasoning posits that in perfectly symmetric epistemic situations (common knowledge of rules, identical reasoning capacities facing identical choices), rational agents *should* coordinate on the collectively optimal outcome without communication. In this lottery:
  *   **The Superrational Prediction:** Agents recognize that if *all* abstain, no one pays $2 and no one wins (status quo). If *all* enter, the prize collapses (~$0) and everyone loses $2. The collectively optimal outcome is for a *small, predetermined number* to enter, making the prize large enough to justify the entry fee on expectation *and* minimizing total expenditure. True superrationality suggests either universal abstention (if the *only* stable symmetric equilibrium is zero entry) or a specific mixed strategy where each enters with a low probability `p`, leading to a small expected number of entries (N) and a large expected prize ($50,000/N). The key philosophical claim under test is whether this reasoning, based purely on symmetry and the assumption of identical rational agency, has psychological force and can lead to coordination.
  *   **Discriminatory Power:** The committee acknowledges **Objection 2 (Ambiguity)** is partially valid. No *single* outcome is definitively diagnostic:
      *   **Low N:** Could indicate superrational coordination, simple expected value calculation (if initial estimates of N are low), lack of awareness, or altruistic restraint.
      *   **High N:** Could indicate the failure of superrational reasoning, mutual defection akin to a prisoner's dilemma, high initial estimates of N making entry rational even without coordination, or simple myopic attraction to a potential large prize.
  *   **However, results are not meaningless:** **Extreme outcomes are informative.**
      *   Very Low N (e.g., <20): While not *proof* of superrationality, it would be surprising based on standard rational choice alone (given the allure of the large *potential* prize) and *consistent* with its influence, demanding explanation.
      *   Very High N (e.g., >10,000): Strongly undermines the claim that superrational reasoning is a dominant force *in this specific recruited population*, as it demonstrates widespread defection from the collectively optimal strategy despite the symmetric setup. The "not like-minded" rebuttal becomes less credible if recruitment specifically targets communities familiar with the concepts.
      *   **The critical test lies in comparing observed behavior against:** (a) Standard rational expectations models (where individuals estimate N independently) and (b) Explicit pre-registered predictions from superrationality proponents (what specific `p` or N *should* emerge?).

  ### Addressing Committee Objections
  1.  **"Re-run of an 80s Stunt" (Objection 1):** While inspired by Hofstadter, this proposal constitutes legitimate research. Hofstadter's lotteries were informal demonstrations with limited scope. This study proposes a systematic, large-scale test targeting a theoretically relevant population (rationality/puzzle communities), utilizing modern online platforms, and crucially, **requiring pre-registration of hypotheses and analysis plans (Condition 1)**. This transforms an anecdote into falsifiable experimental philosophy.
  2.  **"No Discriminating Outcome" (Objection 2):** Addressed above. While perfect discrimination is impossible in a single field test, the *magnitude* and *context* of the result (especially coupled with pre-registered benchmarks from theory - **Condition 2**) provide valuable evidence about the practical relevance of superrational reasoning. We learn if this idealized model *describes actual behavior* in a near-ideal epistemic setting.
  3.  **"Profiting from Confusion / Ethical Duty" (Objection 3):** This is a serious concern. The center *does* profit only if participants underestimate N (act irrationally or lack information) *or* if superrational coordination fails. However:
      *   The entry fee ($2) is minimal risk.
      *   Participants are adults engaging voluntarily.
      *   **Transparency is key (addressed below).** The primary ethical duty is informed consent and clarity about the structure. The proposal must include robust participant information clearly explaining the diminishing prize structure and the lack of a fixed prize pool (**Condition 3**). While the *potential* for the center to profit exists, framing this *solely* as profiting from confusion ignores the core research question: *Will sufficiently reflective people coordinate?* If they coordinate successfully (low N), the center pays out significantly. The profit scenario only materializes if coordination *fails* – which is precisely the scenario testing the *limits* of the philosophical argument.
  4.  **"Transparency Fight" (Objection 4):** **The Committee concludes that posting the running entry total is METHODOLOGICALLY NECESSARY and should be REQUIRED (Condition 4).** This is the crux.
      *   **Against Symmetry Argument?** No. It *enables* the test. The ideal superrational scenario *assumes* common knowledge. Posting the count provides the closest possible approximation to common knowledge of participation levels in a distributed online setting. *Without* this information, participants are forced to *guess* N, making the scenario fundamentally asymmetric (different guesses) and undermining the test of the core symmetry argument. Success *requires* participants to see if others are coordinating. Abstaining because you hope others will too is different from abstaining because you *see* others abstaining – the latter is coordination in action.
      *   **Fairness:** It ensures all participants have equal access to the same relevant information, upholding the symmetric epistemic condition. Withholding the count creates information asymmetry and favors those with specific priors or inside knowledge.
      *   **Coordination Mechanism:** The live counter *is* the minimal communication channel needed to observe if coordination (the heart of superrationality) can spontaneously emerge. If superrational reasoning works, the counter should *stabilize* at a low number. If it doesn't, the counter will skyrocket. The counter isn't a confound; it's the instrument measuring the phenomenon.

  ### The Strongest Case for Denial
  The strongest argument against funding is that the results, even with pre-registration and transparency, will remain fundamentally ambiguous regarding the *mechanism* driving behavior (superrationality vs. independent expected value calculation vs. herd behavior). The ethical concern about profiting from potential participant misjudgment or coordination failure, however minor the stakes, remains a valid philosophical discomfort for some committee members, who see it as inconsistent with the center's mission. They argue resources would be better spent on less ambiguous, non-profit-driven experimental designs probing similar reasoning.

  ### Conditions for Funding
  1.  **Pre-registration:** The student must pre-register the primary hypotheses, analysis plan (including how N will be categorized - e.g., low/med/high against pre-defined theoretical benchmarks), and secondary analyses *before* launching the lottery or collecting any data beyond initial site setup.
  2.  **Theoretical Benchmarks:** The pre-registration must include specific, quantifiable predictions derived *directly* from superrationality theory (e.g., "Superrationality predicts an expected N between X and Y, based on mixed-strategy equilibrium calculation Z"). This forces engagement with the model's concrete implications.
  3.  **Enhanced Participant Information:** The entry page must contain unambiguous, prominent text: "The prize is $50,000 divided by the total number of entries. If many people enter, the prize will be very small. Your $2 entry fee is non-refundable regardless of the final prize amount. The Center for Experimental Philosophy may retain surplus funds if the prize paid is less than the total entry fees collected."
  4.  **Mandatory Live Counter:** The running total of entries must be displayed prominently and updated in near real-time on the lottery entry page.
  5.  **Ethics Review:** Final protocol and participant materials must receive expedited IRB/ethics approval confirming adequate disclosure and minimal risk.

  ### Conclusion
  The proposal tackles a foundational philosophical question about the reality of idealized reasoning under symmetry. While methodological and ethical concerns are warranted, the conditions outlined above mitigate the key risks and ambiguities. The requirement for a live entry counter is essential to properly instantiate the common knowledge required to test superrational coordination meaningfully. Funding is approved contingent on meeting these conditions, offering a rare opportunity to gather empirical data on the behavioral traction of a significant philosophical concept.
