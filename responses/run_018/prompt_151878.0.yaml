prompt: |-
  Construct a thought experiment that isolates the explanatory conflict between hard environmental determinism and symmetrical actor-network historiography—specifically regarding germs, climate oscillations, and volcanic aerosols as purported historical actors—while introducing one novel conceptual mechanism you are to term “asymmetric causal gating.” Design a realistic, non-fictional scenario set in a specific agricultural or mercantile community that faces simultaneous but interacting pressures from a latent microbial reservoir, a multi-decadal climate shift, and a minor volcanic aerosol event. The scenario must be contained in a single paragraph and must be engineered so that all three environmental pressures are present and necessary for the community’s collapse, yet none is sufficient; the collapse is triggered only by a particular institutional decision about resource-sharing or irrigation maintenance that creates the causal pathway through which the environment acts.

  Specify that hard environmental determinism must be forced to conclude that the institutional decision made no causal difference, treating human practices as epiphenomenal to the environmental shock. Specify that symmetrical actor-network historiography must be forced to attribute strategic, negotiation-like behaviour to at least one of the non-human entities—behaviour that disappears if that entity is treated as a mere mechanism—because the gating institution is interpreted as a co-actor in a symmetrical network. Include a baseline institutional-mediation view according to which human practices gate the efficacy of environmental factors without granting those factors agency or reducing human choice to irrelevance.

  After the scenario, demonstrate that the specifications are met: state the precise verdict each of the three frameworks delivers and why; identify the exact feature of the case—namely, the asymmetric causal gating—that produces the divergence; explain why removing that feature collapses the case either into a standard determinist story (if the gate is absent) or into a standard interaction problem in which agency is symmetrically distributed (if the gate is present but the environmental factors are insufficient); and provide an honest account of how a defender of the framework that comes out worst—whether the determinist or the actor-network theorist—would attack the case, specifying whether the attack targets the realism of the gating institution, the anthropomorphisation of the pathogen, climate pattern, or volcanic event, or the alleged isolation of variables.

  The case must not depend on named theories beyond general recognition, must contain no bibliographic references, citation requests, or reading lists, and must be fully answerable through conceptual reasoning without recourse to external sources. Write in polished, formal British English.
