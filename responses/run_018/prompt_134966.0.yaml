answer: |-
  Here is a branching taxonomy addressing the coherence of interpersonal welfare comparisons across radically dissimilar phenomenal architectures, structured as requested:

  **I. Is Cross-Architecture Welfare Comparison Conceptually Coherent?**
      *   **(A) No: Comparisons are Incoherent**
          *   **A1. Principled Incommensurability:** Phenomenal welfare states between radically different architectures lack any common grounding property or shared dimension of value, rendering aggregation fundamentally impossible.  
              *   *Position:* Cross-architecture welfare comparisons are incoherent due to an ontological absence of comparable welfare properties.  
              *   *Awkward Commitment:* Moral aggregation involving such beings is either impossible, requiring exclusion from moral consideration, or forces arbitrary, non-welfare-based decisions (e.g., speciesism, procedural fairness over welfare maximization).  
              *   *Status:* Contested minority view, often linked to strong non-reductionism about phenomenal consciousness or value pluralism.
          *   **A2. Mere Epistemic Failure:** There exists a common welfare property (e.g., intrinsic phenomenal valence), but our inability to access or interpret the internal states of radically dissimilar architectures makes reliable comparison practically impossible.  
              *   *Position:* Comparisons are coherent in principle but permanently beyond our epistemic reach due to the radical dissimilarity.  
              *   *Awkward Commitment:* While such beings possess moral status, we are perpetually paralyzed in making welfare-based decisions affecting them, potentially demanding extreme precaution (potentially forbidding interaction) or reliance on crude proxies (e.g., functional analogs to pain behavior) with high risk of error.  
              *   *Status:* Broad agreement exists on the *difficulty*, but deep contention on whether the barrier is *merely* epistemic or principled.

      *   **(B) Yes: Comparisons are Coherent (Proceed to II)**
          *   *Status:* This is the working assumption of most consequentialist ethics and welfare economics, but its applicability to *radically* dissimilar architectures is highly contested.

  **II. What Enables Coherent Cross-Architecture Comparison?**
      *   **(B1) Requires Shared Cardinal Intensity Metric:** Meaningful welfare comparison requires a common, cardinal scale measuring the absolute intensity or magnitude of positive/negative valence, applicable across architectures.  
          *   *Position:* Comparison requires quantifying welfare intensity on a universal scale (e.g., "utils" of valence) that transcends specific phenomenal structure.  
          *   *Awkward Commitment:* Justifying such a universal metric independent of specific neuro/phenomenal implementation is deeply problematic; aggregation implies potentially trading vast amounts of "low-intensity" suffering in one architecture for small amounts of "high-intensity" suffering in another, raising concerns about fairness and the moral significance of intensity calibration.  
          *   *Status:* Highly contested; central to utilitarianism but faces the "hard problem" of cross-architecture intensity calibration.
      *   **(B2) Requires Structural Correspondence in Phenomenal Space:** Comparison requires mapping structural relationships (ordering, similarity/dissimilarity, ratios between states) within each subject's phenomenal welfare space onto a common abstract structure.  
          *   *Position:* Coherent comparison depends on establishing an isomorphism (or homomorphism) between the abstract relational structures of the welfare-relevant phenomenal spaces of the dissimilar beings.  
          *   *Awkward Commitment:* Identifying the relevant structural features ("welfare axes") and demonstrating isomorphism between, e.g., a unified human ego-field and a fragmented distributed system is immensely challenging; aggregation requires weighting the scales of these different structures, reintroducing cardinality concerns at a meta-level.  
          *   *Status:* Niche but active area of research; draws on formal methods but faces significant hurdles in application to radical dissimilarity.
      *   **(B3) Requires Only Consistent Revealed-Choice Behavior (Behavioral Minimalism):** Coherent comparison requires only consistent choice behavior revealing a stable preference ordering under uncertainty; phenomenal properties are irrelevant or epiphenomenal to welfare.  
          *   *Position:* Welfare is defined solely by coherent preferences revealed through choices (especially under risk/uncertainty); architectures are comparable if their choices reveal consistent utility functions, regardless of underlying phenomenology.  
          *   *Awkward Commitment:* Commits to behaviorism or functionalism about welfare; risks attributing welfare to systems that make coherent choices but lack phenomenal experience (e.g., advanced AI), or denying welfare to systems with phenomenology but lacking sophisticated choice behavior (e.g., infants, severely disabled beings, or architectures lacking "choice" mechanisms). Aggregation is purely formal but may ignore the "what it's like" aspect central to many moral intuitions.  
          *   *Status:* Dominant in economics and decision theory; heavily criticized in philosophy of mind and ethics for ignoring subjective experience.

  **Unoccupied/Underexplored Logical Combinations & Diagnosis:**

  1.  **B1 (Cardinal) + B2 (Structural) Hybrid:** A position demanding *both* a universal cardinal metric *and* structural isomorphism.  
      *   *Diagnosis:* Likely **unattractive/unexplored** due to redundancy or excessive restrictiveness. If structural isomorphism is established, it might imply a path to cardinal comparison, making the separate demand for an independent cardinal metric seem unnecessary. If structures are isomorphic, why demand *both*?
  2.  **A2 (Epistemic Failure) + B1 (Cardinal Metric):** Holds a common cardinal metric exists *in principle* but is permanently inaccessible *in practice*.  
      *   *Diagnosis:* **Rarely articulated clearly.** Often conflated with A2 alone. The added commitment to a specific *cardinal* ontology existing but being unknowable is a very strong claim facing significant skepticism, making it **unattractive**.
  3.  **B2 (Structural) without B1 (Cardinal):** Asserts structural correspondence is necessary *and sufficient* for ordinal comparison but avoids commitment to cardinal intensity.  
      *   *Diagnosis:* **Logically coherent but underexplored.** While structural correspondence enables ordinal ranking ("State A is better for S1 than State B is for S1", "State X is better for S2 than State Y is for S2"), it doesn't solve cross-architecture *interpersonal* comparison ("Is State A for S1 better than State X for S2?") without further assumptions (like B1 or B3). Its limitations for aggregation might make it **unattractive** as a *complete* solution. Some work on "representational theories of consciousness" touches on this indirectly.
  4.  **A1 (Principled Incommensurability) + B3 (Behavioral Minimalism):** Claims phenomenal welfare is incommensurable *but* advocates using revealed preference as a separate, non-welfare-based practical guide for action involving dissimilar beings.  
      *   *Diagnosis:* **Logically coherent but rare/unexplored.** It combines a metaphysical claim about the incoherence of phenomenal welfare comparison with a pragmatic decision procedure. Its awkwardness lies in justifying why behavioral choice *should* guide action if it doesn't track comparable phenomenal welfare (the supposed source of moral importance). This might appeal to contractualists or proceduralists but is **unattractive** to welfare consequentialists.

  **Settled vs. Contested:**

  *   **Broadly Settled:**
      *   Comparing welfare between beings with *similar* phenomenal architectures (e.g., typical humans) is conceptually coherent (though empirically difficult).
      *   Radical phenomenal dissimilarity poses *serious*, possibly insurmountable, challenges to welfare comparison.
      *   Epistemic access to the subjective states of radically dissimilar architectures is extremely limited or non-existent with current methods.
      *   Pure behaviorism (B3) effectively sidesteps the phenomenal incommensurability problem but at the cost of severing the link between welfare and phenomenology.
  *   **Genuinely Contested:**
      *   **The core question (I.A vs. I.B):** Is the problem *only* epistemic (I.A2) or is there a deeper ontological incommensurability (I.A1)? Most debate occurs between I.A2 and I.B.
      *   **Among I.B positions:** Which (if any) of the enabling conditions (B1, B2, B3) is sufficient/necessary? B1 is heavily disputed metaphysically. B2 is methodologically disputed. B3 is disputed regarding its connection to genuine welfare/moral significance.
      *   **The viability of B2:** Can formal structural mappings overcome radical dissimilarity in a meaningful way for ethics?
      *   **The moral implications of aggregation:** Regardless of the technical possibility of comparison, *how* to aggregate welfare across such different modes of existence (if at all) remains deeply contested, touching on value theory and population ethics.

  This taxonomy highlights the spectrum of positions and their challenging implications, particularly for moral aggregation, without presuming resolution on the deeply contested core issues.
