  Functionalism is a big point. Evolutionary framing might imply norms exist because they're functional, but Lewis focuses on stability through expectations, not function. The user might be hinting that the analogy oversimplifies norm persistence.

  I need to assess if "no design needed" stands without the analogy. Lewis's recursive expectations can lead to emergent order, but the user might be in a debate where opponents demand centralized control. Clarifying that Lewis provides a different mechanism—bottom-up via expectations—is crucial.

