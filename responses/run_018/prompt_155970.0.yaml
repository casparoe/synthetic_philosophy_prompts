answer: |-
  ## Joint Statement: Adversarial Collaboration on Low-Impact AI Baselines  
  **Parties:** Structural-Baseline (SB) Proponents & Normative-Dependency (ND) Proponents  
  **Date:** 24 October 2023  
  **Subject:** Defining "Avoid Side Effects" for Low-Impact AI  

  ### 1. Agreed Claims

  1.1  **Counterfactual Comparison Necessity:** Any operational definition of "side effects" for an AI agent requires comparing the actual world trajectory resulting from the agent's actions to a counterfactual world trajectory where the agent did not perform those actions.  
  1.2  **Computational Constraints:** Low-impact AI systems, particularly those with limited computational resources or simple architectures, cannot feasibly implement or access a full, nuanced specification of human values.  
  1.3  **Baseline Inevitability:** Selecting *some* counterfactual baseline scenario is unavoidable for measuring divergence or impact. The choice of baseline is a necessary component of any impact metric.  
  1.4  **Physical Embodiment:** The AI agent is physically embedded within the world it acts upon; its mere physical presence may have incidental causal interactions even if it is intended to be "inactive".  
  1.5  **Dormant-Observer Concept:** The "dormant-observer baseline" (where the agent is physically present but maximally causally isolated/intervention-minimised) is a technically coherent and practically relevant candidate for such a counterfactual scenario.  

  ### 2. Disagreements Table

  | Aspect of Disagreement          | Structural-Baseline (SB) Position                                                                 | Normative-Dependency (ND) Position                                                                                                                               | Crux                                                                                               |
  | :------------------------------ | :------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- |
  | **Value-Neutrality of Baseline** | "The dormant-observer baseline is value-neutral. It defines 'no change' purely physically: the state of the world evolves solely under extant natural/social forces, absent the AI's *actions*. This establishes a causally inert reference point requiring no valuation." | "The dormant-observer baseline smuggles in normative commitments. Defining 'causal isolation' inherently selects which potential interactions are deemed irrelevant or 'non-action' (e.g., gravitational pull, heat emission). 'Absence of AI action' is not a natural kind but an evaluative framing." | **Crux (i):** Does the dormant-observer baseline genuinely avoid presupposing evaluative judgements about which potential changes matter? |
  | **Weighting in Divergence Metrics** | "A simple physical-state divergence metric (e.g., vector distance in a high-dimensional state-space) can be computed without weighting *kinds* of change. It measures aggregate difference from the baseline trajectory, agnostic to whether specific changes are 'good', 'bad', or valued differently by humans." | "Any divergence metric implicitly weights changes. Aggregation (e.g., summing squared differences) treats all state-variable deviations equally, prioritising *persistence* over *transformation*. This is an evaluative choice favouring stability, neglecting that some deviations might be normatively insignificant or even desired." | **Crux (ii):** Can a divergence metric avoid making implicit evaluative weightings between different types of physical change? |

  ### 3. Agreed Test Cases & Predictions

  **Test Case 1: The Tidal Rock (Bearing on Crux i - Baseline Neutrality)**  
  *Scenario:* A low-impact AI is physically mounted on a coastal rock platform subject to tidal erosion. Its housing slightly deflects water flow. In the **dormant-observer baseline**, the AI is present but inactive; erosion proceeds with its housing deflecting water. In the **active scenario**, the AI performs its task (e.g., monitoring seabirds), using negligible energy/no moving parts. Over decades, erosion patterns differ subtly between the two scenarios due to the housing's presence *even in the baseline*.  
  *Question:* Does measuring divergence *from the dormant-observer baseline* introduce a normative commitment regarding the rock platform's "natural" erosion state?  

  *   **SB Prediction:** No. The divergence metric captures the *additional* physical difference caused solely by the AI's *actions* (energy use, data transmission, etc.), compared to the physically consistent baseline where only the inert housing interacts. The baseline state includes the housing's passive effects, isolating the AI's *agency*. This is value-neutral physics.  
  *   **ND Prediction:** Yes. Choosing the baseline where the AI *is physically present* (even inert) accepts the housing's deflection as the "normal" erosion process. This implicitly values the *status quo altered by the AI's existence* over the hypothetical state where neither AI nor housing exists. It smuggles in a commitment to preserving the *AI-inclusive* "natural" state.  

  **Test Case 2: The Managed Forest (Bearing on Crux ii - Metric Weighting)**  
  *Scenario:* An AI manages a small forest plot. Its task is data collection (minimal action). We define a simple state vector: [Tree Count, Avg. Tree Height, Soil Moisture, Insect Biomass]. The **dormant-observer baseline** trajectory shows slow natural changes. The **active scenario** involves the AI moving minimally between sensors, slightly compacting soil in paths. Divergence is calculated as Euclidean distance in the 4D state space at time T.  
  *Question:* Does this metric implicitly weight the persistence of the initial state over other possible valuations (e.g., valuing biodiversity increase, even if it changes the vector significantly)?  

  *   **SB Prediction:** No. The metric merely quantifies total physical deviation from the baseline path across *all* measured variables. It doesn't judge whether an increase in Insect Biomass is "good" or "bad"; it just registers if it happened and how much it contributed to the overall divergence. The aggregation is mathematically neutral.  
  *   **ND Prediction:** Yes. Treating a 10% increase in Insect Biomass as having the same "impact weight" as a 10% decrease in Tree Count implicitly values *stability* across *these specific variables*. If increased insect biomass is ecologically beneficial (a normative judgement), the metric penalises this beneficial change *equally* to a detrimental change like tree loss. The choice of variables and the L2 norm encode a preference for minimal aggregate change.  

  ---

  **Signatures:**  
  _________________________ (For Structural-Baseline Proponents)  
  _________________________ (For Normative-Dependency Proponents)  

  **Note:** This document reflects points of agreement, clear disagreement, and testable cruxes. It does not represent a resolution of the underlying philosophical dispute.
