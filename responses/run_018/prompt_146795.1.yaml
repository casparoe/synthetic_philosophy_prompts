prompt: |-
  I am advising a federation of worker-owned manufacturing cooperatives that needs a reusable method for evaluating automation proposals beyond conventional cost-benefit metrics. Please turn Marx's analysis of machinery and automation—specifically the distinctions drawn in Capital between machinery that substitutes for labor, machinery that transforms the labor process itself through real subsumption, and the tendency for capital to separate mental labor from manual labor via the socialization of knowledge—into a practical audit procedure. The deliverable should be an ordered checklist or decision flowchart in words that a non-specialist board member can run in approximately thirty minutes on a vendor proposal, with explicit nodes for judgment calls clearly marked as such and no steps that require consulting an economic historian.

  The procedure must address three hard structural cases: technologies that reduce aggregate labor hours but intensify the pace or surveillance of remaining work; technologies that eliminate traditional craft roles yet create new technical maintenance positions; and technologies adopted primarily under external market coercion rather than democratic collective decision. Apply it to three hypothetical proposals: collaborative welding robots that assist physically but algorithmically pace worker cycle times; an AI shift-scheduling system that optimizes allocation but removes worker autonomy over breaks and sequencing; and a low-cost additive-manufacturing system that would dissolve a skilled craft division within the cooperative yet may be economically necessary for survival—this third case should produce a recommendation you expect I will resist, with the reasoning made explicit. You must also specify what the procedure genuinely cannot determine, such as long-run competitive dynamics or the democratic legitimacy of the adoption vote. I want a committed answer: take a definite stance on whether Marx's framework can be operationalized this way without distorting its critical intent, defend that stance with explicit reasons, and avoid presenting a neutral menu of interpretations.
