answer: |-
  This argument pattern you've described is a fascinating and frustrating blend of several informal fallacies, with a distinct flavor specific to quantum foundations debates. While it doesn't have a single universally accepted name, it's definitely a recognized rhetorical maneuver. The closest established label is likely **Special Pleading**, but it manifests in a specific, self-reinforcing way that merits a more nuanced description.

  Here's the breakdown and why it's problematic:

  1.  **Core Fallacy: Special Pleading:** This is the foundation. The critic applies an ontological standard (e.g., "must be defined in 3D physical space", "must not scale in dimensionality with particle number") rigorously to the wavefunction but exempts other equally abstract or complex mathematical objects in physics (EM field tensor, metric tensor, phase space distributions, etc.) without providing a *principled distinction* for why the standard applies only to the wavefunction. The uniqueness claim ("scaling with particle number") is often presented *as* the distinction, but it's arbitrary without deeper justification.

  2.  **Moving Goalposts:** The objection shifts when countered. Initially, it's "not in 3D space". When shown other objects also aren't strictly in 3D space, it becomes "scales with particle number". If pressed on why *that* scaling is ontologically fatal (while, say, the infinite degrees of freedom in a classical field aren't), the defense often retreats to instrumentalism or points to Bohm.

  3.  **Straw Man + Appeal to Consequences (regarding Bohm):** Bohmian mechanics is presented *not* as a serious candidate ontology to be evaluated on its own merits, but specifically as a *horrible consequence* of taking the wavefunction's structure seriously in 3D space. Its "nonlocality" or "ugly quantum potential" are highlighted (ignoring that standard QM has nonlocality too, and "ugliness" is subjective), reinforcing the idea that *any* 3D ontology *must* look like this and is therefore unacceptable. This diverts attention from the original objection and creates a false dilemma: either accept the "ugly" Bohmian ontology or reject the wavefunction's reality. The possibility of other 3D ontologies (e.g., some collapse models) or the question of whether the *epistemic* view has its *own* "ugly" consequences is ignored.

  4.  **Instrumentalist Shield / Ontological Vacuum Defense:** This is the crucial self-sealing mechanism. The *absence* of a specified alternative ontology for the epistemic view is weaponized:
      *   It avoids the burden of explaining *what* the underlying reality *is* and how it avoids the same (or worse) conceptual problems (e.g., how does the "real" ontology avoid nonlocality? What space does *it* live in? How does it generate the wavefunction as knowledge?).
      *   It deflects counterexamples: "We don't claim *that* thing (EM field, etc.) is the fundamental ontology either; it's just a tool! *All* we claim is that *this specific tool* (the wavefunction) isn't real." This shields the critic from having to define *their* ontological threshold.
      *   It creates an asymmetry: The ontic realist must defend the ontology of their proposed entity (the wavefunction), while the epistemicist faces no such demand for *their* proposed underlying reality. The epistemicist's lack of commitment is portrayed as a virtue ("parsimony", "not over-interpreting") rather than an explanatory gap.

  5.  **Circular Reinforcement:** The argument becomes self-sealing: The structural feature (high-D config space scaling) is deemed fatal *only* for the wavefunction *because* the wavefunction is the target of the epistemic view. The Bohmian "counterexample" reinforces the rejection of 3D ontology *because* it's presented as the inevitable (and ugly) consequence. The lack of an alternative ontology protects the epistemic view from scrutiny *because* "we don't need to specify it." Each element reinforces the others in a closed loop.

  **What to Call It?**

  *   **Self-Sealing Instrumentalist Special Pleading:** This captures the core components: applying standards unevenly (Special Pleading), using instrumentalism as a shield (Instrumentalist), and creating a closed loop resistant to counterarguments (Self-Sealing).
  *   **The Ontological Vacuum Defense:** Highlights the central role played by refusing to specify an alternative ontology, turning the absence into a defensive weapon.
  *   **The Quantum Motte-and-Bailey:** (A bit more metaphorical) The easily defensible "motte" is instrumentalism ("we don't know/care about the underlying ontology, just use the math"). The desired but harder-to-defend "bailey" is the specific negative ontological claim ("the wavefunction *definitely isn't* real, *because* of X, Y, Z"). When pressed on X, Y, Z, the critic retreats to the motte ("we don't need to say what *is* real!"). Bohm acts as a scarecrow guarding the bailey.

  **Distinguishing it from Simple Special Pleading or Absence-of-Evidence:**

  *   **vs. Simple Special Pleading:** The unique elements are the **instrumentalist shield** (using the lack of positive ontology defensively) and the **rhetorical use of an alternative theory (Bohm)** not as a genuine contender but solely as a negative example to reinforce the rejection. Simple special pleading might just inconsistently apply a standard without these extra layers.
  *   **vs. Absence-of-Evidence:** This fallacy is about concluding X is false because there's no evidence for X. Here, the critic *isn't* just saying "There's no evidence the wavefunction is real." They are making a *positive argument* for why it *can't* be real (dimensionality, scaling), applying that standard inconsistently (special pleading), and then using the *absence of their own positive proposal* to deflect criticism of their negative argument. The absence-of-evidence is weaponized *defensively*.

  **The Core Issue:**

  The debate often boils down to **asymmetric burdens of proof and differing standards for ontological commitment.** The critic demands the wavefunction realist justify an entity in a high-D space while simultaneously exempting other abstract entities in physics from the same scrutiny and refusing to subject their own (unspecified) preferred ontology to *any* ontological justification at all. The Bohmian reference serves as rhetorical reinforcement, not a sincere engagement with alternatives. Breaking this pattern requires insisting on consistent ontological standards and demanding clarity on what the epistemic view *does* commit to ontologically, even if it's minimal.
