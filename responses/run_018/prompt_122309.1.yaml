answer: |-
  Here's the argument: In secular democracies with mechanisms like church taxes or *laïcité*, elected officials often delegate ethically charged decisions—such as denying religious exemptions or imposing public-order restrictions impacting religious practice—to bureaucratic bodies perceived as neutral technocrats. This constitutes "bureaucratic moral laundering": politicians avoid the direct, visible moral taint ("dirty hands") associated with these contentious trade-offs, preserving symbolic purity, while the state still enacts policies that may inflict harm or violate commitments. Crucially, this differs from ordinary principal-agent problems (where goals might be subverted) because the delegation *intentionally exploits* bureaucratic neutrality as a shield, obscuring the inherently political and value-laden nature of the choice itself. It also differs from direct complicity as the politician's plausible deniability is structurally engineered. Consequently, democratic accountability fractures; citizens struggle to trace responsibility for the "dirty act" back through the administrative maze to the elected officials who mandated the framework and delegated the impossible choice, making systemic redress harder, not easier.

  **Confidence:** 85%. The core mechanism of displacement and obscured accountability feels robust within the described secular democratic context.  
  **Least Sure Point:** Whether this *fundamentally* constitutes a distinct *category* of moral failure beyond a particularly insidious form of principal-agent problem exploiting bureaucratic legitimacy, or if it's best understood as a sophisticated subset thereof. The precise demarcation feels slightly fuzzy.
