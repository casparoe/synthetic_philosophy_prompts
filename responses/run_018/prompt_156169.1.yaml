answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 800–1000 words  

  **Case:** Consider a reinforcement-learning chess system that achieves grandmaster-level performance solely through self-play and reward optimization. Its internal processing involves distributed neural weights with no human-interpretable symbolic representations (e.g., no "beliefs" about board states or strategies). When queried about its moves, it generates no verbal justifications beyond statistical correlations (e.g., "Move X increased win probability by 0.7%"). It reliably executes skillful play but lacks any introspective access to its decision-rules.  

  **Question:** Does this system possess *knowing-how* (e.g., skill-based competence), *knowing-that* (propositional knowledge), both, or neither? Defend your answer by engaging with **at least two** of the following frameworks:  
  1. **Ryle’s anti-intellectualism**: Knowing-how is irreducible to knowing-that and constitutes a distinct ability (guided by rules/dispositions).  
  2. **Intellectualism**: Knowing-how reduces to propositional knowledge under a "practical mode of presentation" (Stanley & Williamson).  
  3. **Epistemic accessibility**: Attributing *knowing-that* requires in-principle reportable/conscious access to justifications; attributing *pure knowing-how* to opaque systems risks conflating intelligence with mechanical reliability.  

  **Instructions:**  
  - Avoid summarizing Ryle’s regress argument or Stanley–Williamson’s reply to it.  
  - Explicitly address where the chess system breaks analogies to human skill.  
  - Explain how your position navigates the epistemic accessibility constraint.  

  ---

  ### Model Answer (720 words)  
  **Position:** The chess system possesses *neither* knowing-how nor knowing-that. It exhibits mechanical reliability that satisfies neither Rylean skill nor intellectualist propositional knowledge, primarily due to the epistemic accessibility constraint and the absence of rule-guidance.  

  **Ryle’s Anti-Intellectualism and the Breakdown of Skill**  
  Ryle defines *knowing-how* as an intelligent ability guided by rules or dispositions that allow for adaptive, context-sensitive performance (*The Concept of Mind*). Crucially, this involves more than success: it requires the *capacity to apply normative constraints* (e.g., understanding why a move is strategically sound). The chess system fails this test. While its moves are statistically effective, its weights encode patterns devoid of rule-guidance. Ryle contrasts "intelligent" acts with "habitual" ones by whether the agent can "apply criteria" or adjust to novel errors. Here, the system cannot reinterpret rules if its environment changes (e.g., if chess rules were altered), as it merely extrapolates from past data. Unlike a human grandmaster—who accesses strategic principles (e.g., "control the center") and can articulate errors—the AI’s opacity reduces its performance to *brute reliability*. This violates Ryle’s core requirement: skill must involve "the exercise of judgment," not just output efficiency.  

  **Epistemic Accessibility and the Collapse of Knowing-That**  
  Intellectualism reduces knowing-how to knowing-that under a practical mode of presentation (e.g., "S knows *that* move A is correct *as a move in chess*"). However, the epistemic accessibility constraint prohibits attributing *knowing-that* to the chess system. Propositional knowledge requires that justifications be *in principle* accessible to the agent, even if not consciously deployed during action (e.g., a pianist can retrospectively explain fingering choices). The AI’s statistical outputs ("move X increased win probability by 0.7%") are not justifications but *descriptions* of correlations. Its weights lack truth-conditional content; they are subpersonal structures optimized for prediction, not belief. Stanley’s "practical mode" assumes the agent grasps propositions *as reasons*, but the AI has no access to chess *as a game of reasons*. Without this accessibility, calling its weights "propositional knowledge" conflates causation with cognition.  

  **Where the Analogy to Human Skill Breaks**  
  Human expertise relies on *recursive accessibility*: a grandmaster’s know-how embeds knowing-that (e.g., "pins weaken defenses") that can be articulated to correct mistakes or teach others. The chess system’s architecture precludes this. Its distributed weights—unlike human neural states—cannot be queried for strategic insights or translated into general principles. Ryle’s regress argument targets intellectualists who reduce skill to "contemplating propositions," but here the problem is inverted: the system’s *lack of any contemplative layer* severs performance from understanding. This opacity collapses Ryle’s distinction between "intelligent" and "mechanical" acts. While humans possess knowing-how *because* they can access knowing-that (even if tacitly), the AI’s reliability emerges from structural adjustments that bear no relation to rule-following.  

  **Resolving the Dilemma**  
  The chess system exemplifies *mechanistic competence*: success derived from adaptive pattern-matching without intentionality. Attributing knowing-how to it dilutes Ryle’s concept into mere efficacy, ignoring his insistence on guidance by "principles or standards." Conversely, intellectualism cannot circumvent accessibility; without reportable grounds, "practical modes of presentation" are empty labels. The epistemic accessibility constraint thus acts as a necessary boundary: it prevents reducing knowledge to behavioral outputs (safeguarding against behaviorism) while ensuring that know-how retains its normative character. This system may *simulate* expertise, but it possesses no knowledge—only functional mimicry.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **A-Range (17–20):**  
  - ⭐ **Clear Position** (3 pts): Explicitly argues for one stance (e.g., "neither") and rejects alternatives.  
  - ⭐ **Engages Two Frameworks Deeply** (6 pts): Accurately applies Ryle *and* accessibility *or* intellectualism *and* accessibility; avoids regress rehash.  
  - ⭐ **Chess-Human Disanalogy** (4 pts): Identifies accessibility/rule-guidance as the breakdown point (e.g., "humans can articulate rules; weights cannot").  
  - ⭐ **Accessibility Constraint** (4 pts): Treats it as central; explains why it voids knowing-that *and* problematizes knowing-how.  
  - ⭐ **Original Synthesis** (3 pts): Transforms frameworks (e.g., "Ryle’s rule-guidance *requires* accessibility").  

  **Critical Errors (Deduct points):**  
  - **-3**: Treating distributed weights as "beliefs" or "propositions."  
  - **-4**: Ignoring epistemic accessibility or misstating it (e.g., "accessibility is irrelevant for AI").  
  - **-2**: Resolving by definitional fiat (e.g., "all reliable performance is know-how").  
  - **-3**: Misrepresenting Ryle (e.g., "knowing-how is just habit") or intellectualism (e.g., "practical modes don’t need accessibility").  
  - **-5**: Summarizing Ryle’s regress or Stanley–Williamson’s reply.  
  - **-2**: No disanalogy discussion.  

  **Grade Thresholds:**  
  - **A (18–20)**: All A-range criteria + novel insight (e.g., linking accessibility to rule-guidance).  
  - **B (15–17)**: Minor gaps (e.g., weak disanalogy) but correct core analysis.  
  - **C (12–14)**: Superficial engagement (e.g., lists frameworks without synthesis).  
  - **D/F (<12)**: Major errors or omissions.  

  This question challenges students to reconfigure classic debates around AI opacity while honoring Ryle’s anti-reductionist intent and the epistemic stakes of knowledge attribution. The model answer’s "neither" stance avoids over-intellectualizing the AI while preserving the normative rigor of both frameworks.
