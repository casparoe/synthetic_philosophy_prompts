answer: |-
  ### (1) Precise Description of the Two-Register Pattern (200 words)  
  This pattern involves positing a **historical boundary** (e.g., the Cognitive Revolution) as both:  
  **(a)** An *empirical rupture*: A discrete, transformative event/phase with identifiable causes, timing, and consequences (e.g., "agriculture emerged abruptly in region X, causing social hierarchies").  
  **(b)** A *heuristic frame*: An organizing principle that defines pre-boundary phenomena as homogenous ("pre-agricultural societies") and post-boundary phenomena as governed by the boundary's logic ("agricultural societies are unequal").  

  Crucially, these registers provide **mutual cover**:  
  - When empirical claims are challenged (e.g., evidence shows gradual adoption of agriculture), the author retreats to the heuristic, arguing it "usefully simplifies" complexity.  
  - Yet the heuristic *retains explanatory/normative power* dependent on the initial discreteness (e.g., agriculture remains the "cause" of inequality).  
  - Thus, the empirical claim shields the heuristic’s reductive framing ("this *was* a rupture"), while the heuristic shields the empirical claim from falsification ("it’s *meant* as a model").  

  **Instances**:  
  - Harari’s "Cognitive Revolution" renders pre-70,000 BCE humans cognitively static.  
  - Diamond’s agriculture as "worst mistake" assumes a binary pre/post transition.  
  - Graeber/Wengrow’s "seasonal thresholds" maintain a heuristic of reversibility despite empirical fluidity.  

  ---

  ### (2) Nearest Established Terms and Their Shortcomings (250 words)  
  - **Whig History**: Focuses on *teleological progress*, framing history as leading to present triumphs. **Shortcoming**: This pattern need not be progressive (e.g., Diamond frames agriculture as decline); its core is the *duality of registers*, not directionality.  
  - **Teleology**: Assumes history moves toward predetermined ends. **Shortcoming**: While often teleological (e.g., Harari’s "progress"), the pattern’s distinct flaw is the *epistemic bait-and-switch* between registers, not just the endpoint.  
  - **Reification of Periodization**: Treating historical phases as concrete entities. **Shortcoming**: Reification is a component, but this pattern uniquely weaponizes periodization via *strategic register-switching* to deflect critique.  
  - **Heuristic Framing**: Using simplified models for explanatory clarity. **Shortcoming**: Heuristics are legitimate, but here the model *co-depends* on contested empirical claims while evading accountability via retreat ("just a heuristic").  

  **Key Gap**: None capture the **dynamic of mutual reinforcement** where:  
  1. Empirical claims borrow authority from the heuristic’s narrative coherence.  
  2. The heuristic borrows plausibility from the empirical claim’s apparent falsifiability.  
  3. Under critique, the registers trade defensive roles without surrendering explanatory primacy.  

  ---

  ### (3) Divergences and Boundary Conditions (200 words)  
  **This phenomenon is NOT**:  
  - **Standard periodization**: Periods (e.g., "Renaissance") may be reified but lack the *systematic register-switching* to deflect criticism.  
  - **Monocausality**: Oversimplifying causality (e.g., "guns, germs, and steel") is related but doesn’t require the *dual empirical/heuristic structure*.  
  - **Foundational Myths**: These serve identity/ideology without claiming falsifiable empirical status.  
  - **Ideal Types** (à la Weber): These are explicitly hypothetical and not defended as empirical ruptures.  

  **Boundary Conditions**:  
  - The pattern arises in **grand synthetic narratives** (not specialist studies).  
  - Requires **causal/normative weight** attached to the boundary (e.g., "agriculture *caused* inequality").  
  - The heuristic must **functionally depend** on the empirical claim’s discreteness while denying that dependence under scrutiny.  

  ---

  ### (4) Verdict and Coined Term (200 words)  
  This is a **distinct epistemic maneuver** exceeding established concepts. Its core is the **defensive interdependence of empirical and heuristic registers**. Thus, I coin:  

  **Epistemic Boundary Effect (EBE)**  
  *Definition*: A rhetorical strategy in historical synthesis where a posited threshold (1) is asserted as an empirical discontinuity with significant consequences, and (2) serves as a heuristic frame organizing pre/post phenomena. The threshold’s empirical and heuristic functions reciprocally shield each other from critique: empirical challenges are deflected by reframing the threshold as "merely heuristic," while the heuristic’s explanatory power covertly relies on the initial empirical claim of discreteness.  

  **Justification**:  
  - "Epistemic" highlights the knowledge-claim duality.  
  - "Boundary" centers the threshold’s role.  
  - "Effect" denotes the emergent defensive dynamic.  
  - **Scope**: Applies to grand narratives where boundaries bear causal/normative burdens.  

  ---

  ### (5) What Would Change My Mind (100 words)  
  I would reject EBE as a distinct phenomenon if:  
  1. **Demonstrated Ubiquity**: All historical periodization inherently relies on this dual structure, making it unexceptional (e.g., if "Renaissance" *always* functions this way—which it doesn’t).  
  2. **Impossible Autonomy**: A rigorous case showing heuristic frameworks *cannot* operate without covert dependence on empirical claims of rupture, collapsing the two registers into one.  
  3. **Counter-Example**: An author credibly abandons the heuristic’s causal claims when empirical discreteness is falsified (e.g., Diamond conceding agriculture’s "effects" vanish if adoption was non-uniform). No major synthesis examined does this.
