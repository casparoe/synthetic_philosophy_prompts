answer: |-
  The traditional doctrine of moral equality of combatants – the idea that soldiers on opposing sides share an equal moral burden simply by fighting, regardless of the justice of their cause – crumbles when confronted with the reality of **distributed lethal agency** in modern warfare. Focusing purely on "just cause" obscures the crucial moral dimensions of **agency** and **exposure**, which are now radically fragmented.

  Here's the breakdown:

  1.  **Dilution of Agency: The Death of the "Decider"**
      *   In traditional combat, a soldier often made the immediate, observable decision to fire their weapon at a specific, visible enemy combatant. The agency (the capacity to act and choose) was concentrated and direct.
      *   Modern systems shatter this agency. The decision to kill is sliced into micro-tasks spread across a vast network:
          *   **Intelligence Analysts:** Tagging potential targets based on patterns or signals, often abstracted from the human reality.
          *   **Lawyers/JAG Officers:** Reviewing targets against complex Rules of Engagement (RoE) and legal frameworks, making abstract determinations of legality.
          *   **Commanders:** Setting broad RoE protocols and approving target lists, often based on processed data, not direct observation.
          *   **Drone Operators:** Piloting the aircraft and, crucially, pressing the button *only when authorized* by the pre-vetted protocol and command chain. Their act is physically detached and often follows a strict checklist.
          *   **Maintenance Crews/Software Engineers:** Enabling the system without knowing specific mission outcomes.
      *   **The Moral Impact:** No single individual in this chain possesses the *complete* agency of the traditional soldier deciding to shoot. Each contributes a small, specialized piece. Attributing the *same* level of moral responsibility for the killing to the drone operator (who presses the button under orders) as to the intelligence analyst (who identified the "pattern") or the lawyer (who deemed it legal) – or worse, to a foot soldier on a different front – becomes nonsensical. Their *kind* and *degree* of agency differ radically. They are cogs, not singular actors.

  2.  **Radical Asymmetry of Exposure: Risk Beyond the Bullet**
      *   The moral equality doctrine often leans on the shared risk of combat – soldiers face each other, equally exposed to death. This shared peril supposedly grounds a mutual, if tragic, respect and equal standing.
      *   Distributed lethal agency destroys this symmetry of exposure:
          *   **Physical Exposure:** A drone operator faces zero physical risk from the strike they execute. An infantry patrol faces constant, immediate physical danger. The exposure is fundamentally unequal.
          *   **Sensory & Psychological Exposure:** While drone operators see screens, their exposure is mediated, filtered, and often delayed. They might witness the aftermath, but they don't smell the cordite, hear the screams, feel the concussions, or experience the chaotic fog of war in real-time alongside the target. Conversely, a soldier clearing a building faces intense, immediate sensory and psychological trauma. A lawyer reviewing a target packet experiences none of this.
          *   **Temporal Exposure:** The drone operator's "combat" experience is a shift in an air-conditioned room, followed by driving home. The frontline soldier lives immersed in danger and stress for extended periods.
      *   **The Moral Impact:** Moral responsibility is deeply intertwined with the nature of the risk undertaken and the directness of the experience. Attributing *equal* moral risk to individuals inhabiting such radically different realities of exposure – the lawyer safe at a desk, the drone operator thousands of miles away, the infantryman in the mud – is like saying a passive shareholder bears the *same* moral culpability as the factory manager who knowingly ignored safety protocols leading to deaths. The exposure, and thus the nature of the risk and burden, is utterly incomparable.

  **The Shareholder Analogy Holds:**

  Think of a multinational corporation causing environmental devastation. Attributing *equal* moral culpability to every single shareholder, from the pension fund with millions of shares to the individual holding a few, is absurd. Their agency (voting power, influence) and exposure (financial risk, connection to the harm) vary immensely. Similarly, in the distributed killing apparatus of modern conflict, the infantryman, the drone sensor operator, the JAG lawyer reviewing strikes, and the general setting RoE all wear uniforms, but their **specific contributions (agency)** and their **directness of experience and risk (exposure)** are worlds apart.

  **Conclusion:**

  Distributed lethal agency fractures the unified "combatant" figure presupposed by moral equality. When the decision to kill is sliced so thin across a vast network of specialized roles, and when the exposure to violence and its consequences is so radically asymmetric, the notion that everyone in uniform shares an equal moral burden collapses. We must assess moral responsibility based on the **specific nature of an individual's agency** within the killing system and their **direct exposure** to its violence and consequences, not merely the fact of wearing a uniform. Ignoring this fragmentation risks both unfairly burdening low-agency/exposure personnel and dangerously obscuring the concentrated moral weight carried by those designing and authorizing the protocols of remote killing.
