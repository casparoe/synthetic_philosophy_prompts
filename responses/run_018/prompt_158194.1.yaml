  Key angles to press: 
  - **Continuity**: If physical bodies aren't necessary, is shared memory enough? What if instances update asynchronously? 
  - **Splitting paradox**: If copying a cluster creates two "originals," doesn’t that explode the "single self" premise? 
  - **Falsification**: What evidence would make the guest admit it’s *not* a self? Legal recognition is a clever hook—forces them to confront real-world consequences. 

  User’s framing risks misreading Dennett: He’d likely reject *any* literal self (biological or AI), seeing both as useful fictions. But if the guest bites, the cluster-split scenario is the kill shot—it mirrors Parfit’s teleporter thought experiment, which dismantles persistent selfhood. 

