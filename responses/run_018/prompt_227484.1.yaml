prompt: |-
  I've been keeping a running list of my own verdicts on markets that make people uneasy, and I want to know what principle, if any, is doing the work behind them. Here are the cases and my verdicts, stated as honestly as I can.

  1. A regulated market in kidneys from living donors, with the state as the sole purchaser, mandatory screening, and a fixed price well above a year's median income: permissible, and probably better than the status quo of people dying on the waiting list.
  2. A hardware store tripling the price of generators the day before a hurricane makes landfall: permissible, and arguably good, since the alternative is the first five customers buying all forty units.
  3. A binding, enforceable market in votes for public elections, where votes are bought and sold like shares: impermissible, and it should be criminal even between fully informed, consenting adults.
  4. Paying citizens a substantial cash sum to receive a vaccine during a pandemic: permissible.
  5. A charity offering cash to women with drug addictions on condition that they accept long-term contraception or sterilization: impermissible, and I feel this strongly, even though the structure -- a cash incentive aimed at poor people to do something beneficial for third parties -- looks identical to case 4.
  6. A university openly auctioning ten percent of each entering class to the highest bidders, with full transparency: impermissible. But legacy admissions, which function as an opaque auction with a much lower reserve price, strike me as merely distasteful. I notice I can't defend this asymmetry.
  7. An investor visa program in which a country effectively sells permanent residency to anyone who invests a large fixed sum: permissible, if unseemly. An open auction of the same residency slots to the highest bidder, which allocates to almost exactly the same people at almost exactly the same prices: somehow much worse. Again, I can't articulate why.
  8. Prediction markets on election outcomes: permissible and epistemically valuable. Prediction markets on terrorist attacks or assassinations, which would aggregate dispersed information exactly the same way and might even help prevent the events: impermissible.
  9. During the American Civil War, conscripted men could pay a commutation fee or hire a substitute, and this was widely considered a scandal. Today a volunteer army recruits the poor with signing bonuses and hazard pay, and I consider that arrangement broadly acceptable, even though the final allocation -- the wealthy stay home, the poor fight -- is nearly the same.
  10. A medieval-style arrangement in which you can pay a fee to a moral authority and be licensed to continue doing the thing you agree is wrong: obviously corrupt when it's the Church selling indulgences. And yet I think carbon offsets are permissible, and I buy them myself.

  What I want: a principle -- or a small number of jointly necessary conditions -- that sorts these cases the way I do. I know the standard menu of objections (coercion under desperation, corruption of a good's meaning, blocked exchanges between spheres, objectionable inequality between transacting parties), so don't just recite the menu; I want to know which combination, stated precisely, actually reproduces my verdicts, and what it must say about the pairs I've flagged as indefensible. If the price of saving my verdicts in cases 5 through 10 is a principle so gerrymandered that it has no independent plausibility, say so, and tell me which verdicts I should surrender and in what order.

  Finally, apply whatever principle you land on to two cases I haven't listed: first, a donor-priority scheme in which registering as an organ donor moves you up the transplant queue should you ever need an organ, creating a kind of futures market in one's own organs; and second, a shareholder democracy in which corporate votes, unlike political votes, are freely bought and sold along with the shares. I want to know whether the principle treats these as analogous to any of my ten cases, and whether its verdict on them makes me more or less confident in the principle itself.
reasoning: |-
  Hmm, the user has presented a fascinating ethical puzzle. They've listed ten cases where markets make people uneasy, along with their personal verdicts on whether each market should be permissible. They're looking for an underlying principle that explains their judgments consistently, especially noting the cases where they feel their own asymmetry is indefensible.

  Looking at their cases, several patterns emerge. The user seems comfortable with markets when they alleviate scarcity (kidneys), prevent hoarding (generators), or create positive incentives (vaccine payments). But they draw sharp lines when markets involve core democratic processes (vote selling), reproductive autonomy (sterilization incentives), or education access (college auctions). 

  The challenging cases are where structurally similar situations get different verdicts. For example, paying for vaccines (okay) versus paying for sterilization (not okay) - both target the poor with cash incentives for third-party benefits. Or investor visas (tolerable) versus residency auctions (objectionable) - nearly identical outcomes but different emotional responses.

  I notice three major tensions in their judgments:
  First, between consequentialist efficiency (saving lives, preventing shortages) and deontological boundaries (things that shouldn't be commodified). Second, between transparency (they dislike opaque legacy admissions more than open auctions) but also find some transparent markets worse. Third, between historical context (indulgences vs carbon offsets) where the framing changes moral perception.

  For the underlying principle, I'm considering a three-part test:
  1) Does the market violate a sacred boundary? (votes, reproductive rights, core educational access)
  2) Is the consent meaningfully compromised by desperation? (more than just poverty - actual coercion)
  3) Does the market generate perverse incentives that undermine its own purpose? (e.g., assassination markets could incentivize violence)

  Applying this to their asymmetries: 
  - The college auction feels worse than legacy admissions because it makes the sacred boundary violation explicit. 
  - Sterilization payments cross a bodily autonomy line that vaccine incentives don't. 
  - Residency auctions feel more like "selling citizenship" than investor visas which frame it as economic contribution.

  For the new cases: 
  The organ priority scheme likely passes - it's reciprocal and avoids outright commodification. Shareholder vote trading seems permissible since corporate governance lacks the sacredness of political democracy. If the principle approves both while explaining why political vote-selling is different, that might strengthen its validity.

  The hardest cases remain the Civil War substitutions (which feel exploitative) versus modern military pay (which feels voluntary). Here the principle might need to acknowledge that some asymmetries reflect evolving social norms rather than pure logic - and that's okay. Sometimes our moral intuitions outpace our principles.
answer: |-
  Based on your verdicts, the underlying principle that best explains your judgments appears to be a combination of **two core conditions with one critical constraint**:

  **Principle:**  
  A market transaction is permissible **only if**  
  *(1) It does not commodify a "protected sphere" good (sacred, intrinsic, or foundational to personhood/society),*  
  **AND**  
  *(2) It demonstrably improves welfare or prevents significant harm without creating worse systemic distortions,*  
  ***UNLESS***  
  *The transaction exploits* **irreducible desperation** *(a non-negotiable survival threat) to bypass condition (1).*

  **Breakdown of key terms:**  
  - **"Protected sphere" goods:** Goods/services whose marketization fundamentally corrupts their meaning, undermines equality of standing, or degrades social/ethical foundations (e.g., political agency, reproductive autonomy, core educational access, existential moral acts).  
  - **"Irreducible desperation":** Situations where individuals face immediate threats to survival/basic functioning (starvation, life-threatening illness) with no non-market alternatives.  
  - **"Systemic distortions":** Outcomes like incentivizing harm, entrenching caste-like hierarchies, or destroying non-market values (trust, civic duty).

  ---

  ### How This Principle Sorts Your Cases:
  1. **Kidney Market:**  
     - *Permissible:* Avoids commodification (state as buyer, fixed price, screening). Meets condition (2) by saving lives. Desperation (dying patients) justifies the market *form*.

  2. **Generator Price Gouging:**  
     - *Permissible:* Generators aren’t a "protected sphere" good. High prices prevent hoarding (welfare improvement), and buyers aren’t in *irreducible desperation* (hurricane prep isn’t immediate starvation).

  3. **Vote Selling:**  
     - *Impermissible:* Violates (1) — voting is a core "protected sphere" good. Marketization destroys political equality. Condition (2) fails (no welfare gain; undermines democracy).

  4. **Vaccine Payments:**  
     - *Permissible:* Vaccination isn’t a protected sphere good. Incentives improve public health (welfare gain). No systemic harm.

  5. **Sterilization Incentives:**  
     - *Impermissible:* Violates (1) — reproductive autonomy is protected. Targets desperate populations, but condition (2) fails: cash-for-sterilization creates perverse incentives (coercion via poverty), not genuine welfare.

  6. **University Auction vs. Legacy:**  
     - *Auction:* Impermissible (violates (1)). Education access is protected; auctioning slots destroys meritocratic legitimacy.  
     - *Legacy:* Tolerable (but distasteful) because it’s non-monetary and less explicit. **Asymmetry explained:** Auctions make commodification *overt*, which triggers stronger violation of (1). Legacy is corruption; auction is marketization.

  7. **Investor Visa vs. Residency Auction:**  
     - *Investor Visa:* Permissible (barely). Framed as "investment," not direct sale. Condition (1) not *fully* violated (citizenship/residency is semi-protected).  
     - *Auction:* Impermissible. Explicitly commodifies residency (violates (1)). Identical outcome, but the *mechanism* matters — auctions make protected-sphere violation explicit.  

  8. **Prediction Markets:**  
     - *Elections:* Permissible. Information aggregation isn’t protected; welfare gain via better forecasts.  
     - *Terrorism:* Impermissible. Violates (1) — life/security is protected. Markets could incentivize harm (fails (2)).

  9. **Civil War Substitutes vs. Volunteer Army:**  
     - *Substitutes:* Impermissible. Conscription + commodification exploits *irreducible desperation* (poor conscripts facing death).  
     - *Volunteer Army:* Permissible. Market transaction (pay) isn’t tied to an *immediate* survival threat. Condition (1) not violated (military service isn’t fully protected like votes/organs).  

  10. **Indulgences vs. Carbon Offsets:**  
      - *Indulgences:* Impermissible. Commodifies moral absolution (protected sphere). "Payment for sin" corrupts ethics.  
      - *Carbon Offsets:* Permissible. Framed as harm reduction, not moral license. Condition (2) satisfied (incentivizes emissions cuts).  

  ---

  ### Addressing Indefensible Asymmetries:
  - **Cases 6 & 7:** The principle *partially* rescues your asymmetry by emphasizing **explicit commodification** as corrosive to protected spheres. Auctions make the market logic overt, destroying the good’s non-market meaning. Legacy admissions are corrupt but not *purely* transactional.  
  - **Cost:** This requires accepting that **mechanism matters** (not just outcomes). If you reject this, surrender verdicts on university auctions and residency auctions.  

  ---

  ### New Cases:
  1. **Organ Donor Priority Scheme:**  
     - *Verdict:* **Permissible** (analogous to vaccine incentives).  
     - *Why:* Reciprocal incentive avoids commodification (no cash for organs). Satisfies (2) by increasing donor supply. Not a protected-sphere violation (self-binding, not sale).  

  2. **Shareholder Vote-Trading:**  
     - *Verdict:* **Permissible** (contrast with political vote-selling).  
     - *Why:* Corporate governance isn’t a protected sphere like democracy. Votes are property rights; market aligns with shareholder welfare. No condition (1) violation.  

  **Effect on Principle:** These verdicts strengthen the principle. They show:  
  - Protecting spheres isn’t anti-market absolutism (shareholder votes ok).  
  - Non-monetary reciprocity can avoid commodification (donor priority).  

  ---

  ### Conclusion:
  Your judgments reflect a **moderate commodification skepticism**: markets are tools, not universal solvents. The principle isn’t gerrymandered but requires:  
  1. Recognizing **core protected spheres** (votes, reproduction, moral agency).  
  2. Demanding **tangible welfare gains** without exploitation or corruption.  
  3. Treating **explicit monetization** as more corrupting than indirect incentives.  

  **Surrender order if simplifying:**  
  1. Residency auction verdict (align with investor visas).  
  2. University auction verdict (accept "all sales equally bad").  
  3. Sterilization incentive verdict (accept all poverty-targeted cash incentives).  

  This preserves your strongest intuitions (votes, kidneys, terrorism markets) while explaining asymmetries via the *symbolic weight of explicit commodification*.
