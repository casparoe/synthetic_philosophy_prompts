answer: |-
  Here's a thought experiment designed to pit standard Extended Mind (EM) against your Proprioceptive Ownership Filter (POF) version, rooted in a realistic hospital setting:

  **The Scenario:**
  Dr. Anya Sharma, a neurosurgeon, uses a cutting-edge Augmented Reality (AR) headset during complex brain surgeries. The headset projects a real-time, millimeter-accurate 3D holographic map of the patient's brain structures *directly onto her visual field* as she operates, superimposed perfectly over the actual tissue. She relies on it constantly: it's always on during surgery (constant availability), instantly accessible by glancing (automatic endorsement), stores and updates the crucial surgical plan (information-bearing), and its data is far more reliable and detailed than her unaided visual assessment or memory (trusted/relied upon). Functionally, it's identical to an expert neurosurgeon's internal visual-spatial cognition and planning module. However, while Anya trusts the data implicitly and uses it fluently, the AR display remains a visual *overlay* she consciously *interprets*. She doesn't feel the holographic vessels or tumor boundaries "in her fingers" as she manipulates her physical instruments; there's no tactile feedback loop or sense that the holographic data is an *embodied part* of her own sensory-motor system. It's information she *sees and uses*, not something she *feels incorporated*.

  **The Breakdown:**

  1.  **Standard EM Thesis (Clark & Chalmers):** The AR headset qualifies as part of Anya's cognitive system. It meets all functional parity conditions: reliability, constant availability, automatic endorsement, past endorsement (trust built over use), and it's crucial for a core cognitive task (surgical navigation/decision-making). The information it provides is functionally equivalent to biological neural processes involved in spatial reasoning and memory recall during surgery. Therefore, the holographic map *is* part of her mind.
  2.  **Modified EM Thesis (with POF):** The AR headset **fails** to be part of Anya's mind. While it meets all the functional parity conditions, it lacks the crucial "proprioceptive ownership filter." Anya experiences it as an external informational aid she consults, not as something incorporated into her *body schema*. There's no sense of the holographic data being felt *proprioceptively* or *tactually* integrated with her motor actions; it doesn't become "part of her hand-eye coordination" in a felt, embodied way. It remains a tool she *uses*, not a cognitive resource she *inhabits* bodily.
  3.  **The Specific Feature Doing the Work:** The **absence of felt bodily integration/proprioceptive feedback**. The key differentiator is the phenomenological, embodied experience: Does the external resource feel like it's *part of your bodily self* during use (like a blind person's cane *feels* like an extended tactile sense), or is it merely a highly reliable, transparent *informational interface*? In this case, the AR provides flawless information but lacks that visceral sense of embodiment.
  4.  **Does stripping away POF collapse it?** **Yes, absolutely.** If we remove the requirement for proprioceptive ownership, this scenario becomes a *textbook*, almost paradigmatic example of the standard EM thesis in action (like Otto's notebook, but more sophisticated). The AR headset perfectly exemplifies functional parity without sci-fi elements. The POF is the *only* thing preventing it from being a standard, "boring" EM case – it's the added constraint that creates the conceptual tension.

  **In short:** Dr. Sharma's AR headset is a functional cognitive extension (passes EM parity) but a phenomenological alien (fails POF). The missing element is the feeling that the tool's output is proprioceptively/tactually *her own*, integrated into her body schema, not just impeccably reliable data she perceives. Remove the POF requirement, and it's a classic EM win; include it, and the tool stays "outside."
