answer: |-
  That's a brilliantly observed paradox, and you're right – it's more nuanced than simple hypocrisy or pronoun slippage. While there isn't one universally *established* term capturing *exactly* that double move in political philosophy or international law, the phenomenon is widely recognized and debated. We can analyze it and coin a precise term.

  **The Core Tension**

  1.  **Moral Apology (Requires Continuity):** For an apology to have weight ("We are sorry for what *we* did"), it presupposes that the apologizing entity (the present government/state) is the *moral successor* or inheritor of the legacy of the past actor. It claims a shared identity or lineage across time to bear moral responsibility and express remorse. "We" implies a continuous collective agent.
  2.  **Legal Defense (Requires Discontinuity):** To deny legal liability and reparations ("That was a different regime"), the state leverages concepts of legal personality and sovereignty. Governments change, constitutions are rewritten, regimes fall. Legally, the *state* might persist as an abstract entity under international law, but its *government* or specific *form* is seen as distinct. Arguments often cite:
      *   Change in government type (e.g., monarchy to republic, dictatorship to democracy).
      *   Statute of limitations.
      *   Non-retroactivity of laws.
      *   Separation between the state's legal person and its past governments' actions.
      *   Practical impossibility or unfairness of holding current citizens/taxpayers liable.

  **The Double Move:** The state strategically employs **simultaneous, contradictory narratives of temporal identity** depending on the context: *continuity* for moral authority and catharsis, *discontinuity* for legal and financial absolution.

  **Coined Term: Schizochrony (or State Schizochrony)**

  *   **Etymology:** "Schizo-" (Greek: split, divided) + "-chrony" (Greek: time). Literally, "split-time."
  *   **Definition:** The strategic deployment by a state of incompatible narratives regarding its temporal continuity – asserting identity with a past regime for purposes of moral acknowledgment or legitimacy, while simultaneously denying that identity to evade legal or financial responsibility for that regime's actions.
  *   **Why it fits:**
      *   Captures the fundamental split ("schizo") in the state's relationship to its own past.
      *   Highlights the manipulation of time ("chrony") and historical narrative.
      *   Emphasizes it's a *structural* feature of statecraft, not just individual hypocrisy.
      *   Evokes the inherent tension or even pathology in maintaining these contradictory positions.

  **Distinguishing from Simple Equivocation on "We"**

  1.  **Scale and System:** Schizochrony is institutional and systemic, embedded in state policy, rhetoric, and legal arguments. It's not just an individual misspeaking or being vague; it's a coordinated strategy across different branches (executive apology vs. legal defense).
  2.  **Specific Contradiction:** It hinges on the *exact* contradiction between the narrative needed for moral weight (continuity) and the narrative needed for legal/fiscal protection (discontinuity). Simple equivocation might be ambiguous or inconsistent, but not necessarily exploiting this specific, diametrically opposed duality.
  3.  **Functional Purpose:** Each use of "we" serves a distinct, often opposing, *function*: one for symbolic/moral capital, the other for material protection. It's functional inconsistency, not just semantic sloppiness.

  **Cases Where the Two Moves Might *Not* Conflict (Boundary Cases)**

  1.  **Explicitly Non-Legal Apology:** If the apology explicitly states it carries *no* legal liability or implications for reparations, and is purely a moral/ethical statement. The "we" acknowledges historical lineage for symbolic purposes only, while legally the discontinuity is pre-emptively affirmed. (This is rare, as victims often see apology and reparations as linked).
  2.  **Continuity for Both, but Responsibility Limited:** A state could argue, "Yes, we are the continuous legal and moral successor *and* we acknowledge responsibility, BUT..." followed by arguments limiting *how* that responsibility manifests (e.g., symbolic reparations only, limited compensation based on current capacity, non-monetary restitution). Here, continuity is accepted, but the *form* of responsibility is contested, not the identity. This avoids schizochrony.
  3.  **Discontinuity for Both:** A radically new regime might explicitly repudiate the *entire* legacy of the old state ("We are a new nation; that entity is extinct"). They offer no apology and accept no liability. No schizochrony, just complete rejection (though this raises other legitimacy issues).
  4.  **"Successor State" vs. "Continuing State":** In international law (e.g., after dissolution like USSR or Yugoslavia), a new state might be deemed a "successor" with limited obligations, while a "continuing state" (like Russia vis-à-vis the USSR) inherits more. A successor state offering an apology *could* frame it as moral solidarity without accepting full legal continuity, potentially avoiding the stark contradiction. However, if that same successor state leverages discontinuity to deny *all* responsibility while offering the apology, schizochrony re-emerges.

  **In Essence:**

  **Schizochrony** captures the profound, often cynical, tension you identified: states want the moral cleansing and legitimacy that comes from acknowledging a shared, continuous identity with the past ("we did wrong"), but they desperately want to avoid the material consequences that such continuity would logically entail ("*they* did wrong, not *us*"). It's a core mechanism by which states manage the burdens of history while protecting their present interests, revealing the complex and often contradictory nature of collective identity across time.
