answer: |-
  Here are five numbered points addressing your query:

  1.  **Paul's killing of Gérard Duval (the French printer)**: This scene initially demonstrates direct agency required for moral equality, as Paul chooses to stab Duval, but Remarque immediately diffuses this by depicting Paul's paralyzing guilt, viewing Duval not as a legitimate target but as a fellow victim ("Comrade, I did not want to kill you..."), undermining the combatant's autonomous moral license to kill.
  2.  **The sustained bombardments and trench warfare**: Remarque repeatedly describes soldiers as passive, helpless victims of impersonal artillery barrages ("We have become wild beasts... not fighting men, but some sort of instinctive machine") where individual choice and targeting vanish, dissolving the reciprocal agency central to moral equality into sheer shared victimhood imposed by industrial war machinery.
  3.  **Fraternization with Russian prisoners**: Paul and his comrades recognize the starving Russians as fellow sufferers, sharing food and seeing them as "harmless" men caught in the same trap ("They look just as kindly as our own peasants"); this erodes the enemy distinction necessary for reciprocal combatant rights, replacing it with a recognition of shared, undifferentiated victimization devoid of opposing moral agency.
  4.  **The portrayal of recruits and training**: Kantorek's jingoism and Himmelstoss's brutal training strip recruits of individual conscience, molding them into interchangeable, obedient units ("We were all at once terribly alone; and alone we must see it through"); this systematic suppression of autonomy before combat directly challenges the premise that soldiers enter the moral equality relation as independent moral agents.
  5.  **The complete absence of "just cause" justification**: Remarque deliberately denies both sides any noble rationale ("Katczinsky says that we are here to protect our fatherland. And the French, they say they are here to protect *their* fatherland. Well, who is right?"), rendering the war meaningless slaughter; this transforms moral equality from a mutual *license* based on role into a universal *fate* of victimhood, where "equality" signifies only equal exposure to destruction, not equal moral standing as agents.
