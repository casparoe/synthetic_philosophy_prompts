answer: |-
  ### Rigorous Essay Exam Question  
  **Evaluate whether a domain-indexed conception of virtue—where traits like courage or practical wisdom are stable within specific spheres (e.g., professional, domestic) but not globally consistent—genuinely preserves Aristotelian virtue ethics or collapses into situationism. In your response, address the following:**  
  1. How does this model distinguish between *trait possession* and *trait expression*?  
  2. Can *phronesis* (practical wisdom) function coherently when restricted to narrow domains?  
  3. Does moral evaluation (e.g., praise/blame for "courageousness") retain meaning if virtues are domain-specific?  
  4. Ultimately, does this retreat save virtue ethics or abandon its core commitments?  

  ---

  ### Model Answer (730 words)  
  The domain-indexed retreat—proposing virtues as locally stable but globally inconsistent—appears to rescue virtue ethics from situationist critiques by accommodating empirical evidence of behavioral variability. However, I argue this model fatally undermines Aristotelian ethics by collapsing into a fragmented situationism that voids robust character assessment, redefines *phronesis* as mere contextual skill, and severs the link between virtue and *eudaimonia* (flourishing).  

  **1. Trait Possession vs. Expression & Situationist Challenges**  
  Situationists (e.g., Doris, Harman) attack *cross-situational consistency*: the expectation that possessing courage guarantees courageous acts across diverse contexts (e.g., battlefields, offices, family conflicts). Domain-indexing concedes this, limiting consistency to spheres like "professional courage." Yet for Aristotle, virtue possession (*hexis*) is a unified disposition of character—a "settled state" (*Nicomachean Ethics* II.4) expressed *reliably* when appropriate. Domain-indexing reduces possession to *local behavioral reliability*, conflating expression with possession. If a CEO is professionally courageous but domestically timid, they possess not "courage" but a context-bound habit. Aristotelian virtue requires global possession because character is the *source* of actions, not a label for domain-specific conduct.  

  **2. *Phronesis* in Circumscribed Domains**  
  *Phronesis* integrates moral perception, deliberation, and motivation to discern the *mean* in any situation (*NE* VI.5). Domain-indexing constrains this to isolated spheres (e.g., "civic *phronesis*"). But Aristotelian *phronesis* is holistic: it unifies virtues by recognizing how courage in war relates to justice in politics and temperance at home. Fragmenting it denies agents the capacity to weigh competing goods *across* domains (e.g., familial loyalty vs. professional integrity). What appears as "domain-specific wisdom" becomes instrumental reasoning detached from the agent’s overarching conception of the good life. Without this unity, *phronesis* degrades into situational cleverness—a tool for efficiency within bounded contexts, not moral insight.  

  **3. Fragmentation and Moral Evaluation**  
  Domain-indexing fractures moral assessment. If "courage" is exclusively martial, praising a soldier’s battlefield valor says nothing of their cowardice in confronting workplace corruption. For Aristotle, virtue attribution presumes *global* evaluative significance: we praise agents *as courageous persons* because their character reliably orients them toward the noble (*kalon*) (*NE* III.7). Domain-specific virtues reduce praise to descriptions of context-appropriate behavior—akin to situationism’s "local traits." This voids blame, too: if virtues are sphere-bound, failing to show "domestic honesty" need not impugn one’s character if "public honesty" is intact. Virtue ethics traditionally assesses the *agent*, not compartmentalized roles.  

  **4. Saving or Abandoning Virtue Ethics?**  
  The retreat abandons core commitments. First, it surrenders to situationism by rejecting cross-situational consistency—the bedrock of character as a explanatory construct. Second, it severs virtue from *eudaimonia*. Aristotle’s flourishing requires integrating virtues into a coherent life directed toward the human good (*NE* I.7). Domain-indexing permits a "schizoid" self with incompatible dispositions across spheres, denying the unity of character essential for *eudaimonia*. Finally, it reduces virtues to social scripts: "professional courage" may reflect corporate norms, not a stable disposition toward the noble.  

  *Objection*: Domain-indexing saves virtue ethics by grounding traits in realistic, socially embedded practices (e.g., MacIntyre’s "practices").  
  *Reply*: While virtues develop within practices (e.g., courage in parenting), Aristotle demands their *integration* via *phronesis*. A parent’s courage must cohere with their honesty as a citizen. Otherwise, virtue ethics becomes descriptive sociology, not normative theory.  

  **Conclusion**: Domain-indexing is situationism in virtue-ethical clothing. It preserves local predictability but sacrifices character’s explanatory power, *phronesis*’ unifying function, and *eudaimonia* as the final cause of virtue. Virtue ethics cannot retreat here without self-liquidation.  

  ---

  ### Detailed Marking Scheme (Total: 25 marks)  
  **A-Grade (21–25 marks):** Demonstrates mastery by integrating all core demands and making original philosophical moves.  

  | **Criterion**                                                                 | **Marks** | **A-Grade Requirements**                                                                                                                                                                | **Common Errors**                                                                 |  
  |-------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|  
  | **1. Distinguishes trait possession vs. expression**                          | 5         | Explicitly contrasts Aristotelian *hexis* (global settled state) with domain-indexed "possession" as local reliability. Cites *NE* II.4.                                                | Equates expression with possession; ignores Aristotle’s "source of actions" clause. (Lose 2–3 marks) |  
  | **2. Analyzes *phronesis* in narrow domains**                                 | 6         | Argues holistic *phronesis* (integrating virtues/life spheres) is irreplaceable. Explains why domain-bound reasoning collapses into instrumental skill. Cites *NE* VI.5, VI.12.           | Treats *phronesis* as technical problem-solving; misses unity of the good. (Lose 3 marks)             |  
  | **3. Evaluates moral assessment fragmentation**                               | 5         | Shows domain-indexing reduces praise/blame to role-specific behavior appraisal, voiding global character judgments. Uses Aristotle on *kalon* and blame.                                | Assumes domain-specific praise suffices; omits link to *eudaimonia*. (Lose 2 marks)              |  
  | **4. Original argument: Saves or abandons virtue ethics?**                    | 6         | Concludes domain-indexing is situationist capitulation. Innovates by linking fragmentation to *eudaimonia* or exposing "schizoid self" contradiction. Engages MacIntyre/Objections.     | Superficial "middle-ground" conclusion; no engagement with *eudaimonia*. (Lose 3–4 marks)         |  
  | **Structure, clarity, textual precision**                                     | 3         | Seamless logical flow; precise Aristotle citations; zero conceptual errors.                                                                                                             | Unclear argument; misquotes *NE*; vague terminology. (Lose 1–3 marks)            |  

  **B-Grade (16–20 marks):** Competent but incomplete. Typically misses 1–2 major moves:  
  - Fails to cite key Aristotelian texts (e.g., *NE* VI on *phronesis* unity).  
  - Neglects *eudaimonia* as the telos of integrated virtue.  
  - Accepts domain-indexed "character" without probing trait possession.  
  - Superficial objection handling (e.g., "MacIntyre supports domains" without critique).  

  **C-Grade (11–15 marks):** Descriptive summary. Repeats lecture points without critical analysis, confuses situationism with domain-indexing, or omits 3+ core criteria.  

  **D/F-Grade (≤10 marks):** Fundamental errors (e.g., "virtues are just habits"), ignores prompt, or severe omissions.  

  ---  
  **Key Philosophical Moves for an A:**  
  1. **Situationist Target:** Recognizes situationism attacks *cross-situational* (not local) consistency (*A must identify this to score 21+*).  
  2. **Possession ≠ Expression:** Uses *NE* II.4 to show virtue is the *source* of actions, not their pattern (*B answers conflate them*).  
  3. ***Phronesis* Holism:** Quotes *NE* VI.12: *phronesis* requires "a single true understanding of the good life" (*B answers overlook this*).  
  4. ***Eudaimonia* Argument:** Original insight: Domain-indexing fractures the self, making flourishing impossible (*Crucial for top marks*).  

  This exam challenges students to defend virtue ethics’ integrity under empirical pressure—precisely the frontier your seminar seeks to explore.
