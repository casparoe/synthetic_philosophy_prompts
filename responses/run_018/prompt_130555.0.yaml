answer: |-
  Here is a specification of desiderata for an adequate theory of valid consent, focusing on marginal interactions and tensions:

  ### Non-Negotiable Core Desiderata
  1.  **Epistemic-Volitional Distinction:** The theory *must* distinguish between consent being *invalid at the time of giving* (due to epistemic or volitional defects) and *merely regretted later* (due to changed preferences, unforeseen outcomes not undermining initial understanding, or buyer's remorse). **Motivation:** Prevents collapsing normative assessment into hindsight bias. Distinguishes between signing a contract under duress (invalid) vs. signing freely but later wishing you got a better deal (regret).
  2.  **Decision-Relative Competence:** Competence must be assessed relative to the *specific nature and stakes of the decision at hand*, not global cognitive ability or general "rationality." **Motivation:** A person deemed globally incompetent may validly consent to a simple, low-stakes choice (e.g., choosing lunch). Conversely, a highly intelligent person may lack competence for a complex medical decision under severe stress. Competence thresholds must scale with decision complexity and consequences.
  3.  **Coercion Beyond Explicit Threats:** The theory *must* recognize that coercion can arise from *systemic pressures, institutional structures, or background conditions* that functionally eliminate reasonable alternatives *without* any direct interpersonal threat. **Motivation:** Consenting to exploitative work terms because alternative employment is structurally unavailable due to systemic poverty or discrimination differs fundamentally from consenting after explicit threats of violence.
  4.  **Deception Beyond Explicit Lies:** The theory *must* address deception via *deliberate manipulation of context, framing, omission of material facts, or exploitation of reasonable inferences*, even if all individual statements are technically true. **Motivation:** "This surgery has a 95% success rate!" is technically true but deceptive if failure usually means death, while failure in comparable surgeries usually means minor complications. Exploiting the listener's reasonable inference that "success" means survival constitutes deception.

  ### Essential Marginal Interaction Desiderata
  5.  **Competence under Systemic Coercion:** The theory must explain how systemic coercion (D3) interacts with decision-relative competence (D2). Can someone be *competent* to understand the choice presented, yet the consent be *invalid* because the choice-set itself is coercively constrained by background structures? **Motivation:** A financially desperate but cognitively sharp person "choosing" a dangerous job understands the immediate risks (competent) but lacks *meaningfully voluntary* alternatives due to systemic economic coercion.
  6.  **Deception Targeting Specific Incompetence:** The theory must account for deception (D4) that *specifically exploits a temporary or domain-specific incompetence* (D2) induced by the context or the deceiver's actions. **Motivation:** Using complex, fast-talking legalese to confuse an otherwise competent layperson about a contract term exploits a *situationally induced* incompetence regarding that specific term.
  7.  **Epistemic Limits & Unforeseeable Consequences:** The theory must specify whether consent to an *act* (understood at time T1) remains valid when its *downstream consequences* (unforeseeable at T1 due to structural complexity, novelty, or hidden dependencies) fundamentally alter the nature of the act consented to or its impact on the consenter. **Motivation:** Consenting to data collection for research purpose A, where the data is later used (due to technological advances or policy shifts) for vastly different, privacy-invasive purpose B that was structurally unforeseeable at collection. Was consent to the *original data collection act* valid, or does the unforeseen consequence invalidate it retroactively?
  8.  **Normative Decay (Without Revocation):** The theory must address whether consent can "decay" – lose normative force over time *without formal revocation* – due to significant changes in the consenter's epistemic state (learning new, materially relevant information) or volitional state (fundamental shift in values/identity). **Motivation:** Consenting to a long-term open relationship based on one understanding of non-monogamy, then years later developing a profoundly different value framework where the ongoing acts feel violating, despite no explicit revocation. Does the original consent indefinitely bind, or does its normative force diminish?

  ### Camp-Dependent Desiderata (Areas of Legitimate Disagreement)
  9.  **Specificity Scope:** *Can broad, anticipatory consent be valid?* Must consent specify every foreseeable sub-step/procedure, or is consent to a general type of act/domain sufficient? **Camps:** Information-centered views often demand high specificity; relational/voluntariness views may accept broader scopes within established relationships/contexts.
  10. **Subjective vs. Objective Coercion/Deception:** *Is the consenter's subjective perception of pressure or deception sufficient for invalidity, or must there be an objectively unreasonable threat/misrepresentation?* **Camps:** Relational/autonomy views lean subjective; information/voluntariness views often require objective standards to prevent excessive invalidation based on idiosyncratic sensitivities.
  11. **Threshold of Materiality:** *What level of withheld information or pressured alternative renders consent invalid?* **Camps:** Information-centered views set lower bars for material omissions; voluntariness views focus on whether alternatives were *sufficiently* constrained; relational views may contextualize materiality within relationship norms.
  12. **Responsibility for Unforeseeables (D7):** *Who bears the normative burden for structurally unforeseeable consequences?* **Camps:** Does validity hold unless the *actor* should have foreseen (voluntariness/info)? Or does the impact on the consenter shift the burden, requiring re-consent if possible (relational/autonomy)?

  ### Tensions and (Potential) Resolutions
  13. **Maximal Disclosure vs. Practical Feasibility (Time/Resource Constraints):**
      *   **Tension:** Demanding exhaustive disclosure of all remotely possible risks/contingencies is impossible in emergencies, complex negotiations, or time-sensitive contexts.
      *   **Resolution (Contextual Indexing):** The standard of "adequate disclosure" must be context-dependent (emergency vs. elective surgery vs. financial contract). Focus on *material* risks/alternatives *reasonably knowable* within the constraints. Feasibility modulates the *degree* of disclosure required, not the core requirement itself.
  14. **Subjective vs. Objective Coercion (D10):**
      *   **Tension:** Purely subjective standards risk invalidating consent based on unreasonable perceptions; purely objective standards ignore genuinely felt, context-specific pressures that undermine autonomy for *that person*.
      *   **Resolution (Contextual Indexing & Hybrid):** Often resolved via a hybrid "reasonable person in the consenter's situation" standard. Context (e.g., known vulnerabilities, relationship history) informs what pressures/deceptions a reasonable person would experience, blending objective and subjective elements. A purely principled tension may remain regarding extreme subjectivity.
  15. **Broad Consent (D9) vs. Handling Unforeseeables (D7) & Decay (D8):**
      *   **Tension:** Broad consent is practical but struggles with unforeseen consequences and decay. Requiring ultra-specific consent avoids these but is often impractical and fails to cover novel situations.
      *   **Resolution (Procedural/Contextual):** Validity of broad consent depends on: (a) Scope Clarity (clear boundaries of the consented-to domain), (b) Built-in Review/Revocation Mechanisms, (c) Context (ongoing relationship vs. one-off transaction), (d) Handling Unforeseeables via a duty to re-consent for *major* deviations. This accepts broad consent's validity but builds in safeguards against its pitfalls contextually.
  16. **Systemic Coercion (D3) and Individual Responsibility:**
      *   **Tension:** If systemic forces are always coercive, does *any* consent within an unjust system become invalid? This paralyzes necessary social interactions.
      *   **Resolution (Threshold & Agency Preservation):** Systemic coercion invalidates consent only when it eliminates *all reasonable alternatives relevant to the specific type of choice*, rendering the choice non-voluntary in a meaningful sense. It doesn't negate all agency within imperfect systems, only choices where systemic forces create truly coercive *situations*.

  ### Brief Account Interactions
  *   **Information-Centered:** Excels at D4 (Deception), D1 (Epistemic core), D7 (Consequences linked to information). Struggles with D3 (Systemic Coercion - not informational), D5 (Competence under coercion), D8 (Decay - not informational change), D10 (Subjective pressure), D13 (Feasibility).
  *   **Voluntariness-Centered:** Excels at D3 (Coercion), D5 (Interaction), D1 (Volitional core), D10 (Objective threats). Struggles with D4 (Non-coercive deception), D7 (Unforeseen consequences not affecting voluntariness at T1), D8 (Decay), D9 (Specificity beyond core choice).
  *   **Relational-Autonomy:** Excels at D3 (Structural context), D5 (Contextual competence), D8 (Decay within relationships), D12 (Relational materiality). Struggles with D1 (Risk of conflating regret/invalidity via relational norms), D7 (Handling unforeseeables outside relationships), D9 (Specificity in impersonal contexts), D10 (Subjectivity leading to instability).

  This framework prioritizes clarity on the margins while acknowledging core non-negotiables and the legitimate space for theoretical disagreement on other fronts, highlighting where practical resolutions to tensions are possible versus where deeper philosophical divides persist.
