  But the user might prefer a biological example. Maybe slime molds? They are single-celled organisms that can form multicellular structures for problem-solving, like finding the shortest path in a maze. The cognition is distributed across cells without a central nervous system. Comparing the size of a slime mold's "brain" (which doesn't exist) to a vertebrate's brain is incoherent because the functional architecture is different.

