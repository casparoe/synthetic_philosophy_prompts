  Let me develop that example. An ant colony performs tasks like foraging, nest building, and defense, which require coordination, memory (through pheromone trails), and decision-making. These are cognitive functions similar to those in larger-brained animals. But the colony's "brain" isn't a single organ; it's distributed across many small-brained individuals and environmental structures (like pheromone trails). So, comparing the size of an ant's brain to, say, a primate's is irrelevant because the colony's cognition emerges from the system as a whole.

