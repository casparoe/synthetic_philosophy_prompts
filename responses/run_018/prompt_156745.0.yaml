  Okay, the user is writing a chapter on whether brain size is morally relevant and has hit a conceptual snag. They need an example where treating brain volume as a proxy for moral status collapses not due to neuroscience but because of a framing problem with 'scaling invariance'. Specifically, they want a case where the same functional capacities are distributed across non-neural substrates, making size redundant, yet the intuition that bigger brains matter more still lingers. They want the answer in British English and the conceptual structure spelled out properly.

  First, I need to understand the core issue. Scaling invariance here means that moral status shouldn't depend on the size of the system if the functional capacities are identical, regardless of the physical substrate. The user is looking for an example where the substrate isn't neural, but the functions are the same. This would highlight the redundancy of using size as a metric.

