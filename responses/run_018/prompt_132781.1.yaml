answer: |-
  Here’s your battle-tested Q&A prep sheet, structured for maximum survival. Concessions are key to credibility, so lead with them.  

  **Core Concession UP FRONT:**  
  *"I fully accept the situationist critique: global personality traits (e.g., ‘honest person’) are poor predictors of behavior across diverse situations. The Milgram and bystander studies, among others, prove this. Aristotelianism, as traditionally interpreted, *cannot* survive this data."*  

  **Non-Negotiable Anchor:**  
  *"What must survive is normativity grounded in practical reason. Virtues aren’t descriptive labels; they’re prescriptive *skills* of perception, reasoning, and motivation calibrated to contexts. This retains ethics as a guide to *better* functioning, not just behavior cataloging."*  

  ---

  ### **Top Objections (Ordered by Damage Potential)**  
  **1. The Prescriptive Authority Question (DREADED)**  
     * **Ethicist’s Phrasing:** *"If virtues are just context-bound behavioral patterns, haven’t you reduced ethics to descriptive psychology? What obligates me to cultivate these patterns? Where’s the ‘should’?"*  
     * **Reply:** *"The ‘should’ comes from practical reason’s telos: human flourishing. These regulatory patterns aren’t arbitrary; they’re reason-responsive strategies for achieving *eudaimonia* in recurring social contexts (e.g., honesty *when trust is needed*). Cultivating them isn’t about fitting a trait-label—it’s about building cognitive-affective tools to navigate moral demands *well*. This is prescriptive because reason demands coherence in our pursuits."*  
     * **Soft Spot:** Requires accepting *eudaimonia* as a normative anchor. Psychologists may see this as circular.  
     * **Patch:** *"Even if you reject teleology, these patterns solve shared social problems—cooperation, conflict resolution—that we *instrumentally* value."*  

  **2. The "Capitulation" Objection (Ethicists)**  
     * **Phrasing:** *"You’ve surrendered to situationism! If virtues fragment into context-specific habits, what’s left of *character* as a unified project of self-cultivation?"*  
     * **Reply:** *"Character isn’t abolished—it’s reconceived as a *dynamic repertoire*. A musician isn’t ‘unified’ by playing one note; they integrate scales, arpeggios, and interpretation for fluid performance. Likewise, character is the cultivated capacity to *select and deploy* context-appropriate regulatory patterns. This *is* the work of practical wisdom (*phronesis*), which remains the core virtue."*  
     * **Soft Spot:** Risk of making character seem like a disjointed toolkit.  
     * **Patch:** *"Integration comes from meta-cognitive reflection: ‘Why be honest here but discreet there?’ That reflective capacity *is* unity."*  

  **3. The "Just Behaviorism" Objection (Psychologists)**  
     * **Phrasing:** *"Aren’t these ‘regulatory patterns’ just situation-behavior contingencies with a fancy label? How is this *not* behaviorism?"*  
     * **Reply:** *"Behaviorism reduces action to stimulus-response. These patterns are *cognitive-affective*: they involve appraising contexts (e.g., ‘Is this a trust-relevant situation?’), accessing learned scripts (‘How do I communicate hard truths?’), and aligning motivation with values. It’s more like ‘situated cognition’ than Skinner—reason and intention are irreducible."*  
     * **Soft Spot:** If patterns are *too* context-specific, they look like S-R pairs.  
     * **Patch:** *"They transfer across *similar* contexts (e.g., truth-telling in friendships/work) via analogical reasoning—something behaviorism can’t explain."*  

  **4. The Predictive Power Objection (Psychologists)**  
     * **Phrasing:** *"If virtues are context-bound, how do you predict behavior? Isn’t this just post-hoc description?"*  
     * **Reply:** *"We predict *probabilistically* by identifying: (1) an agent’s *repertoire* of regulatory patterns (e.g., ‘She’s skilled in courage-under-threat but not courage-against-social-pressure’), and (2) contextual triggers (‘This situation involves reputational risk’). It’s harder than trait theory, but more accurate—and avoids its false positives."*  
     * **Soft Spot:** Predictive models here are complex and untested.  
     * **Patch:** *"Cognitive psychology already does this with ‘if-then’ personality signatures (Mischel, Shoda). We’re extending that to virtue."*  

  **5. The "No Fight Left" Objection (Ethicists)**  
     * **Phrasing:** *"By accepting situationism, don’t you lose virtue ethics’ critical edge? If contexts control behavior, why blame the ‘unvirtuous’?"*  
     * **Reply:** *"We blame *failures of skill cultivation*, not ‘bad character’. The addict who lies *can* build better patterns—that’s why rehab works. Virtue becomes a *reform project*: diagnosing context-response deficits (e.g., ‘You crumble under authority’) and training better patterns. This *is* normative: we hold people responsible for engaging in self-cultivation."*  
     * **Soft Spot:** May feel ‘soft’ on responsibility.  
     * **Patch:** *"We still blame those who *refuse* to engage in moral skill-building—that’s the vice of negligence."*  

  ---

  ### **Tactical Notes**  
  - **Psychologists** want empirical rigor. Cite Mischel’s CAPS model or social-cognitive "if-then" profiles to show this isn’t hand-waving.  
  - **Ethicists** worry about ‘thinning’ virtue. Hammer *phronesis* as the architectonic skill that unifies context-sensitive responses.  
  - **Bridge Language:** Use "cognitive-affective dynamics," "skill acquisition," and "reason-responsive patterns." Avoid "trait," "disposition," and "habit" (too loaded).  
  - **When Stuck:** *"I’m proposing a *third way*: not traits *or* behaviorism, but *virtue as contextual expertise*. That’s where the data *and* normativity align."*  

  You’ve got this. Lead with the concession, pivot to "regulatory skills," and anchor in practical reason. And get fresh coffee. ☕
