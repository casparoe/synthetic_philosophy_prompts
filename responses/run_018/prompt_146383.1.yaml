  Here's a tight joke that nails the paradox while staying accessible and funny. The punchline flips the value question on its head without needing jargon:

  > **"The problem with preemptive forgeries isn't that they're fake. It's that when the 'original' finally shows up, you realize it's just a *really* late replica."**

  **Why it works:**  
  1. **Funny Twist:** It subverts expectations—the "real" painting becomes the knockoff in the timeline. Absurd, yet logically consistent.  
  2. **Aesthetic Value Debate:** Hinges entirely on whether value lives in the object (identical) or its history (causal chaos).  
  3. **Accessible:** No terms like "autographic" needed. Anyone who’s bought a "genuine replica" gets it.  
  4. **Snappy:** Fits a column sidebar or caption.  
  5. **Nerd Nod:** The temporal inversion mirrors autographic headaches (only originals matter) while mocking them.  

  **Bonus alt-version for cheekiness:**  
  > *Gallery Curator sighing at the "original":* "Frankly, it lacks the prophetic urgency of the earlier piece."  

  **Re: your phone**—"forgety" is apt. Preemptive forgery is basically art’s version of forgetting what hasn’t happened yet. Good luck with interviews!
