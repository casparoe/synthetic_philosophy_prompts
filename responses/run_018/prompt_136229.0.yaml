  Here's a joke playing on that tension:

  A wildly popular restaurant has a single, unchanging Head Chef. He never holds staff elections, but the food is incredible – consistently delicious, affordable, and served with flawless efficiency. Patrons rave about the meals, the spotless dining room, and how safe they feel eating there. One night, overhearing yet another table gushing "This place is amazing! Best restaurant ever!", the Chef beams at his Sous Chef. "See?" he whispers triumphantly, polishing his already-gleaming ladle. "The reviews are perfect, the tables are full, the kitchen runs like clockwork. Proof positive I don't *need* to let anyone else apply for my job. Why would they ever want to choose a different chef when everything's *this* good?" The Sous Chef just nods slowly, thinking, *Yeah... but who decided you get to hold the ladle forever just because you're good at using it? And what happens if tomorrow the special is spoiled fish?*

  **Why it works for the tension:**
  *   **Satisfied Customers = Prosperous Citizens:** The rave reviews mirror citizens acknowledging effective governance (prosperity, order).
  *   **Absence of Choice:** Patrons never chose the chef, just as citizens didn't consent to the political system.
  *   **The Chef's Leap (The Regime's Claim):** The chef equates customer *satisfaction* with *legitimacy* for his permanent, unchosen position. He mistakes appreciation for endorsement of his inherent right to rule unchallenged.
  *   **The Sous Chef's Doubt (The Philosophical Gap):** The silent question highlights the core tension: Effective performance ≠ rightful authority derived from consent. It also hints at the vulnerability – performance can falter, and without consent, there's no peaceful mechanism for change ("spoiled fish").
  *   **Casual & Relatable:** Uses a mundane setting (restaurant) to illustrate the abstract political theory gap. No theorists named, just the inherent absurdity of conflating good results with inherent right-to-rule.
