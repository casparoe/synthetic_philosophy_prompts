prompt: |-
  In my philosophy reading group—mostly people with a rationalist background who have worked through the standard literature on preference aggregation, decision theory, and moral psychology—we keep stalling on what looks like a simple distinction but refuses to resolve. The question is whether particular patterns in moral judgement—proximity-weighting, scope-insensitivity to suffering, and temporal discounting of future welfare—should be classified as stable, reflective preferences that ethics ought to respect, or as cognitive biases analogous to the conjunction fallacy that systematically distort our access to impartial reasons. Everyone agrees on the descriptive psychology: these patterns are robust, partly evolutionary in origin, modulated by framing, and present even in reflective agents. Yet one camp treats them as parameters of a legitimate agent-relative utility function; the other treats them as correctable errors that a fully rational moral agent would filter out. After months of discussion, nobody has shifted position.

  My own suspicion is that this is not primarily an empirical disagreement—no new study on scope neglect is going to settle it—nor a purely verbal dispute about the word 'bias', but rather a disagreement about what kind of entity a moral reason is, specifically whether agent-neutrality is a precondition for a consideration to count as a reason at all. That said, I worry we might be answering two different questions under one label: one about the descriptive architecture of human moral cognition, the other about the normative architecture of rational choice, with neither side noticing the slide. There is also the deeper worry, which I would like you to address, that any attempt to 'debias' a moral weighting already smuggles in a competing normative weighting, so that calling one preference a bias and another a preference is circular rather than foundational.

  What I want is not a verdict on which side is right, but a diagnosis of the structure of the disagreement: is it factual, conceptual, normative bedrock, or a case of talking past one another? Given your diagnosis, is there a conceptual distinction—perhaps between corrigibility conditions and stability conditions, or between first-order preferences and second-order commitments—that could actually move the debate? Or is the stall inevitable because the distinction between preference and bias in the moral domain collapses once we recognise that every correction procedure presupposes its own normative baseline? And if progress is possible, what form should it take: a formal result in decision theory, an empirical finding about corrigibility, or a reframing of the question that dissolves the opposition?
reasoning: |-
  Okay, the user is part of a philosophy reading group stuck on whether certain moral judgment patterns (proximity-weighting, scope-insensitivity, temporal discounting) are legitimate preferences or cognitive biases. They've discussed it for months with no resolution. The user suspects it's not empirical or purely verbal but about the nature of moral reasons—specifically, whether agent-neutrality is necessary for a reason to count. They worry they might be conflating descriptive and normative questions and that labeling something as a "bias" might be circular.

  First, I need to unpack the core disagreement. One side sees these patterns as part of a valid agent-relative utility function. The other views them as distortions to be corrected for impartiality. The user mentions that both agree on the descriptive aspects but differ on the normative interpretation. 

  The user's deeper concern is that calling something a bias might already impose a normative baseline, making the argument circular. So the real issue is whether there's a neutral ground to define biases without presupposing values. 

  Next, I should identify the structure of the disagreement. It's not factual since both sides agree on the psychology. It's also not purely conceptual because the term "bias" is loaded with normative assumptions. The heart seems to be normative bedrock—fundamental commitments about what constitutes a moral reason. 

  The user’s point about conflating descriptive and normative questions is spot on. The group might be talking past each other by not distinguishing between how humans do make moral judgments versus how they should. Clarifying this could help, but the deeper issue remains: what's the correct normative framework?

  Possible ways forward: Introduce meta-preferences. If people reflectively endorse these patterns despite knowing the impartial view, that might lend weight to them being preferences. But if they wish to align more with impartiality, then it's a bias. Empirical studies on reflective endorsement could be useful here. 

  Another angle: formal decision theory. Can agent-relative utilities be part of a consistent decision-theoretic framework? If so, that supports their legitimacy. But the other side might argue that moral decisions require a different framework altogether.

  The user also mentioned corrigibility. If these patterns resist correction even with reflection, that might suggest they're stable preferences. But the opposing camp could counter that persistence doesn't imply legitimacy—it might just mean the bias is deep.

  Ultimately, the circularity worry is crucial. Any "debias" attempt assumes a normative standard. So the group needs to explicitly debate that underlying standard rather than the biases themselves. Maybe shifting the discussion to why agent-neutrality should (or shouldn’t) be the default could break the stalemate. 

  Reframing the question: Instead of asking "bias or preference?", ask "under what normative framework do these judgments hold?" or "what do we owe to each other impartiality?" This might dissolve the opposition by making the presuppositions clear.
answer: |-
  Your diagnosis is astute: the core disagreement is **neither empirical nor purely verbal, but a clash of normative bedrock** concerning the nature of moral reasons and the authority of impartiality. The "circularity worry" you raise is fundamental—labeling something a "bias" always presupposes a normative baseline, while treating it as a "preference" assumes the legitimacy of agent-relative frameworks. Here’s a structured analysis of the deadlock and potential paths forward:

  ---

  ### **1. The Structure of the Disagreement**
  - **Factual Consensus**: Both sides agree on the psychology (robustness, evolutionary origins, framing effects). New empirical data won’t resolve this.
  - **Not Purely Verbal**: While "bias" is a contested term, the dispute runs deeper than semantics. It’s about **what grounds moral validity**.
  - **Normative Bedrock**:  
    - **Camp A (Preferences)**: Holds that moral reasons must be *agent-anchored*. If a cognitively stable, reflectively endorsed preference exists (e.g., "I care more about my child than strangers"), it constitutes a legitimate moral reason. Agent-neutrality is optional, not obligatory.  
    - **Camp B (Biases)**: Assumes that moral reasons must be **agent-neutral** (e.g., suffering has equal weight regardless of whose it is). Any deviation (proximity bias, temporal discounting) is a distortion of "true" moral reasons, akin to logical errors.  
  - **Talking Past Each Other?**: Yes, but not accidentally. The two camps are answering distinct questions:  
    - *Descriptive Architecture*: "How do humans *actually* assign moral weight?"  
    - *Normative Architecture*: "How *should* moral weight be assigned under full rationality?"  
    The stalemate arises because both sides implicitly claim their question is primary.

  ---

  ### **2. The Circularity Problem: Why the Distinction Collapses**
  Your deepest worry is correct: **calling something a 'bias' smuggles in a competing normative framework**.  
  - If Camp B labels scope neglect a "bias," they assume an impartial utilitarian baseline (equal weight per unit of suffering).  
  - If Camp A calls it a "preference," they assume a pluralist/relational baseline (attachments can ground reasons).  
  - **There is no neutral standpoint** to arbitrate this. The distinction between "preference" and "bias" is **parasitic on prior normative commitments**.  

  ---

  ### **3. Conceptual Tools to Unblock the Debate**
  To move forward, reframe the discussion using these distinctions:

  #### **A. Meta-Preferences vs. First-Order Judgments**  
    - Ask: *Do reflective agents endorse their own proximity-weighting/temporal discounting after scrutiny?*  
      - If yes (e.g., "I know famine victims suffer equally, but I *stand by* prioritizing my community"), it strengthens Camp A’s view.  
      - If no (e.g., "I wish I cared equally about future generations"), it supports Camp B’s "correctable error" stance.  
    - **Empirical lever**: Studies on reflective equilibrium (e.g., does cognitive debiasing training change *endorsement* or just behavior?).  

  #### **B. Stability vs. Corrigibility**  
    - **Stability**: Even if a judgment persists post-reflection, is that evidence of legitimacy (A) or deep irrationality (B)?  
    - **Corrigibility**: If a judgment changes under rational persuasion (e.g., understanding scope neglect), Camp B sees this as "correction," while Camp A sees it as *preference manipulation*.  
    - **Key question**: *Does rational persuasion appeal to the agent’s existing values (A) or impose external ones (B)?*  

  #### **C. Domain-Specific Rationality**  
    - Distinguish:  
      - *Prudential rationality* (e.g., temporal discounting may be adaptive for personal goals).  
      - *Moral rationality* (requires impartiality for Camp B).  
    - Challenge both camps: *Can the same weighting pattern be rational in one domain but irrational in another?*  

  ---

  ### **4. Paths to Progress**
  #### **Short-Term: Reframe the Question**  
    - Shift from "*Is this a bias?*" to:  
      - "*What normative framework best explains why we feel torn about these patterns?*"  
      - "*When, if ever, should impartial reasons override agent-relative ones?*"  
    - This surfaces the underlying conflict: **Is morality fundamentally about maximizing good states or respecting relational obligations?**  

  #### **Medium-Term: Formal Decision Theory**  
    - **Result to explore**: Can agent-relative utilities be incorporated into a *consistent* decision-theoretic framework without paradox?  
      - If yes (e.g., hybrid models like weighted utilitarianism), Camp A gains ground.  
      - If not (e.g., generates intransitive preferences), Camp B’s "bias" claim strengthens.  

  #### **Long-Term: Empirical Corrigibility Studies**  
    - Design experiments testing whether **reflective agents** converge toward impartiality *when instructed to reason morally* (not just rationally).  
    - Example: Do agents who reject scope neglect in *moral* contexts still apply temporal discounting to their *own* future welfare?  

  ---

  ### **Conclusion: Why the Stalemate is Inevitable (and How to Outflank It)**
  The distinction between "preference" and "bias" **collapses under scrutiny** because it relies on uncontested normative premises. Progress requires:  
  1. **Explicitly acknowledging the normative baseline** each camp presupposes (e.g., "I define ‘bias’ relative to utilitarian impartiality").  
  2. **Shifting focus to meta-preferences**: Do we *endorse* these patterns upon reflection?  
  3. **Accepting pluralism**: These patterns may be biases *for maximizing impartial good* but legitimate preferences *for honoring special obligations*.  

  The debate isn’t resolvable by "facts" because it’s a conflict between **two visions of moral psychology**: one where reasons emerge from human particularity, and one where they transcend it. The way out is to argue about which vision better serves the point of morality itself—e.g., reducing suffering vs. sustaining meaningful agency. That’s where the real work begins.
