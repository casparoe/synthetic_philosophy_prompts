answer: |-
  Here's the gut-level logic: The problem isn't just that a moral saint sacrifices *other* valuable things (like art or fun), making their life impoverished. The deeper issue is that morality itself might *internally require* some of these non-moral goods to function meaningfully. Consider: true understanding (needed for wise moral action) may require diverse experiences like art. Deep relationships (fundamental to many moral duties) need genuine personal connection and time spent *just* enjoying each other, not just helping. Even avoiding burnout requires non-moral rest and joy. So, "maxing out" morality by relentlessly *only* pursuing direct moral acts might actually *undermine* the very capacities (empathy, judgment, sustainability) and contexts (trusting relationships, a flourishing community) that make robust moral action possible in the first place. Maximal morality isn't just crowded out; it collapses under its own impossible demands by neglecting its own foundations.
