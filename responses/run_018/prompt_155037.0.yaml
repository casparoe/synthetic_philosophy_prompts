prompt: |-
  hey so i'm an SRE with basically no philosophy background. we do chaos engineering where we inject failures on purpose to check if our services are actually resilient or just look good on paper. i was skimming something about plato's laws where he says you should test a person's temperance by letting them drink in a controlled setting - like the alcohol reveals their true charcter, not just their usual behavior. i want to turn that idea into an actual decision procedure my team can run before we greenlight any chaos experiment. it should be a checklist: what conditions make a test a 'character reveal' for the system versus just breaking stuff, what safety rails have to be in place, and the exact point where we call it off. apply it to two proposals: shutting down the primary DB during low traffic to verify failover, and randomly throttling network packets to observe how the on-call engineer reacts. also flag the spots where the plato analogy gets stretched too thin and we're just using our gut.
reasoning: |-
  Okay, the user is an SRE who works with chaos engineering and has come across Plato's idea about testing temperance with controlled drinking. They want to create a decision procedure based on that concept for their team to use before running chaos experiments. They provided two proposals: shutting down the primary DB and randomly throttling network packets. I need to help them build a checklist that determines if a test reveals the system's "character," includes safety measures, and defines abort conditions. Also, I should point out where the analogy might not hold.

  First, I should break down Plato's analogy. Plato suggests that by allowing someone to drink in a controlled setting, their true character is revealed. Similarly, chaos engineering aims to reveal a system's true resilience by injecting failures. The key elements here are controlled environment, observability, safety measures, and the revelation of inherent traits.

  For the checklist, I need to translate these philosophical concepts into practical SRE terms. The main sections should probably be: Test Intent (is it revealing inherent resilience?), Safety Constraints (what prevents catastrophic failure?), Observability (can we monitor everything?), and Abort Conditions (when to stop). 

  Looking at the two proposals: 

  1. Shutting down the primary DB during low traffic: This seems classic. It tests failover mechanisms, which is a core resilience feature. The controlled aspect comes from doing it during low traffic. Safety measures could include backups, rollback plans, and ensuring replication is healthy first. Observability would involve monitoring failover time, client errors, etc. Abort conditions might be if failover takes too long or data corruption is detected.

  2. Randomly throttling network packets to observe the engineer: This is trickier. It's more about human response than system resilience. Plato's analogy might stretch here because it's not the system's "character" but the team's preparedness. Safety would involve ensuring critical services aren't affected, maybe starting with non-prod. Observability includes tracking the engineer's actions and time to detection. Abort if critical systems are impacted or if the engineer is overwhelmed.

  Where does the analogy break? Plato's test reveals inherent traits, but in systems, some failures might be due to unforeseen flaws, not inherent resilience. Also, human elements (like engineer response) add variables that Plato didn't consider. The user needs to recognize when they're relying on intuition, like judging if a test's learnings are worth the risk.

  The user's deeper needs: They want a structured process to avoid reckless testing. They might be seeking validation of their approach or ways to communicate the importance of safety to their team. By using Plato, they're trying to add a philosophical foundation to justify rigorous chaos engineering practices. They also need to highlight when the analogy doesn't apply to prevent misapplication.

  I'll create a detailed checklist covering the key aspects: test intent, safety constraints, observability, and abort conditions. For each proposal, I'll apply the checklist and highlight where the Plato analogy holds or breaks. I'll also explicitly note where gut feelings come into play, such as assessing blast radius or judging the value of human response tests.
answer: |-
  Here's a Plato-inspired "Character Reveal" Chaos Testing Framework, translated for SREs. It focuses on **intent, safety, and observability** to distinguish between revealing true resilience and just causing breakage.

  **Plato's Core Analogy:**
  *   **Temperance Test:** Controlled drinking reveals *inherent* character (resilience), not just practiced sobriety (normal operation).
  *   **Chaos Equivalent:** Controlled failure reveals *inherent* system resilience, not just assumed/paper-based reliability.

  ---

  ### The "Character Reveal" Chaos Testing Checklist (Pre-Greenlight)

  **I. Test Intent & Design ("Is this a True Character Reveal?")**
  1.  **Targets Documented Resilience Feature?** (e.g., failover, retries, backpressure, graceful degradation) *[Plato: Testing a specific virtue]*
  2.  **Simulates a Plausible, Anticipated Failure Mode?** (e.g., AZ outage, process crash, latency spike, dependency failure) *[Plato: Drinking is a real temptation]*
  3.  **Reveals Internal State/Mechanism?** Does the test primarily expose *how* the system handles the fault (e.g., failover time, error rate increase, state consistency) rather than just causing an outage? *[Plato: Reveals hidden impulses]*
  4.  **Controllable Scope & Blast Radius?** Can the impact be limited to the specific component/service under test? *[Plato: Controlled setting]*
  5.  **Hypothesis-Driven?** Is there a clear, measurable prediction about system behavior (e.g., "Failover completes in <30s with <0.1% errors")? *[Plato: Hypothesis: "This temperate person won't get drunk"]*

  **II. Safety Constraints ("The Controlled Setting")**
  6.  **Rollback Mechanism:** Can the injected fault be instantly stopped *and* its effects fully reversed (e.g., restart DB, remove throttle)? *[Plato: Can stop the drinking]*
  7.  **Impact Mitigation:** Are safeguards active (e.g., circuit breakers, kill switches, traffic shedding)? Are critical user journeys/safety systems excluded?
  8.  **Controlled Environment:** Is testing done during lowest-risk periods? (Low traffic, business hours, known stable state). Are non-prod environments ruled out *for this specific test*? (Sometimes prod realism is essential for the "reveal").
  9.  **Health Pre-Check:** Is the system demonstrably healthy *before* injection? (e.g., replication lag low, metrics normal, backups recent).
  10. **Observability Saturation:** Are *all* relevant metrics, logs, and traces enabled and verified? (Success *depends* on seeing the "reveal").

  **III. Abort Conditions ("The Point of Calling it Off")**
  11. **Violated Safety Constraint:** Any breach of Section II triggers immediate abort.
  12. **Unexpected Cascading Failure:** Impact spreads significantly beyond the intended scope.
  13. **Critical User Impact:** Violation of pre-defined SLOs for core user flows (e.g., checkout fails, critical data loss).
  14. **Insufficient Observability:** Key signals needed to validate the hypothesis are missing or corrupted.
  15. **System Unrecoverable:** Rollback fails or system remains unstable after fault removal.
  16. **Human Judgment:** On-call lead or test conductor declares an abort based on unforeseen severity/gut feel. *[See Analogy Limits]*

  ---

  ### Applying the Checklist to Proposals

  **Proposal 1: Shutting Down Primary DB (Low Traffic)**

  *   **I.1 (Targets Resilience):** YES - Explicitly tests failover.
  *   **I.2 (Plausible):** YES - AZ/Instance failure is common.
  *   **I.3 (Reveals Mechanism):** YES - Measures failover time, client error burst, data consistency post-cutover.
  *   **I.4 (Scope):** YES - Assuming DB cluster is isolated target.
  *   **I.5 (Hypothesis):** YES - "Failover completes in <X seconds, read-only errors <Y%, writes resume in <Z seconds, no data loss."
  *   **II.6 (Rollback):** YES - Restart primary DB.
  *   **II.7 (Mitigation):** YES - Ensure clients have retries/backoff, app handles read-only mode gracefully? *[Gut Check: Is app truly ready?]*
  *   **II.8 (Environment):** YES - Low traffic period critical.
  *   **II.9 (Pre-Check):** CRITICAL - Verify replication health, secondary sync status, backup age.
  *   **II.10 (Observability):** CRITICAL - DB metrics (repl lag, conns), app error rates, client latency, HA proxy logs.
  *   **III.11-16 (Abort):** Abort if: Replication was unhealthy (Pre-Check fail), secondary doesn't promote, data inconsistency detected, core API failure, or observability gaps.
  *   **Plato Fit:** **Strong.** Directly tests a core "virtue" (failover) in a controlled way to reveal its true state.

  **Proposal 2: Randomly Throttling Network Packets (Observe On-Call)**

  *   **I.1 (Targets Resilience):** PARTIAL - Tests *system's* tolerance? Or *human* response? Goal is ambiguous. *[Analogy Stretch 1: Testing human, not system "character"]*
  *   **I.2 (Plausible):** YES - Network issues happen.
  *   **I.3 (Reveals Mechanism):** WEAK - Reveals *if* alerts fire & *how* human reacts, not inherent system mechanisms like retries/timeouts. *[Analogy Stretch 2: Observing reaction, not inherent trait]*
  *   **I.4 (Scope):** RISKY - Network throttling can affect anything sharing that path (noisy neighbor). Very hard to truly isolate.
  *   **I.5 (Hypothesis):** VAGUE - "Engineer detects issue within M minutes"? "System degrades gracefully"? Needs sharpening.
  *   **II.6 (Rollback):** YES - Remove throttle.
  *   **II.7 (Mitigation):** HARD - Throttling is broad. Can critical paths be exempted? Unlikely without micro-segmentation.
  *   **II.8 (Environment):** MAYBE - Low traffic helps, but risk remains high.
  *   **II.9 (Pre-Check):** YES - System health normal.
  *   **II.10 (Observability):** ESSENTIAL - Network metrics (packet loss, latency per service), app error rates, *and* detailed monitoring/alerting pipeline status.
  *   **III.11-16 (Abort):** Abort if: Critical user impact (even slight SLO breach), unexpected services affected, on-call overwhelmed, observability fails.
  *   **Plato Fit:** **Weak/Strained.** Primarily tests human & process (on-call playbooks), not inherent system resilience. High risk/low isolation makes it feel more like "just breaking stuff." Better framed as a *drill* than a chaos *experiment* on the *system*.

  ---

  ### Where the Plato Analogy Breaks & Gut Feeling Takes Over

  1.  **Blast Radius vs. "The Setting":** Plato assumes the drunk *only* harms themselves. Systems are interconnected. Judging acceptable blast radius ("controlled setting") is inherently risky and relies on engineering intuition about system boundaries.
  2.  **"Inherent Character" vs. Emergent Behavior:** Systems are complex. A failure might expose a *novel, unintended* behavior, not a designed "virtue." Is this still a "character reveal" or just a bug? Gut feel decides if the result is valuable.
  3.  **Human Element:** Plato tests the individual. Chaos often tests systems *and* humans (on-call). The framework struggles when the primary "reveal" is human/process (like Proposal 2). Gut feel judges the value of testing humans this way.
  4.  **The "Virtue" Itself:** Defining what resilience "virtue" (failover, backoff, etc.) is being tested is an engineering choice, not an absolute truth like Plato's temperance. Gut feel prioritizes which virtues matter most.
  5.  **"Rollback" Certainty:** Restarting a DB is usually reliable. "Rolling back" complex distributed side effects (e.g., corrupted caches, inconsistent state) is never guaranteed. Gut feel assesses the rollback risk.

  ### Recommendation for Proposal 2 Reframe

  Instead of "random throttling to observe on-call," design a test focused on the *system's* network resilience:
  *   **Better:** "Throttle packets *only* between Service A and its non-critical Dependency B during low traffic. Hypothesis: Service A implements backpressure/retries correctly, degrading gracefully (latency <X ms, errors <Y%), without impacting core user flows. On-call is notified via alert Z within M minutes."
  *   **This:** Targets a resilience mechanism (I.1), isolates scope better (I.4), reveals system behavior (I.3), and observing the on-call becomes a *secondary outcome* within a safer, more focused "character reveal" test.

  **In essence:** Use Plato to focus on **controlled revelation of *system* resilience mechanisms**. Where the test shifts to humans, broad breakage, or novel behavior discovery, acknowledge the analogy's limit and lean on disciplined engineering judgment (the "gut") heavily informed by the checklist's safety rails. Good chaos engineering balances philosophical rigor with operational pragmatism.
