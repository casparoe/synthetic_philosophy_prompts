answer: |-
  Here's a taxonomy for the Paradox of Deontology, structured as a decision tree using your specified questions, avoiding trolley problems and jargon. Written in British English as requested.

  **The Deontic Constraint Decision Tree**

  **Start: Is breaking a deontic constraint (e.g., "don't kill innocents") ever permissible to prevent greater harm?**

  1.  **Q1: If you break the constraint (even permissibly), does it *always* leave significant moral residue (guilt, regret, taint) for the agent?**
      *   **Yes → Go to Q2**
      *   **No → Go to Q3**

  2.  **Q2: Is the greater harm you are trying to prevent a single, specific *catastrophic event* (e.g., extinction) or an *aggregated pile of smaller harms* (e.g., many minor rights violations spread out)?**
      *   **Catastrophic Event → Go to Q4**
      *   **Aggregated Pile of Harms → Leaf E: The Unnamed Hybrid**
          *   *Most Awkward Commitment:* Permitting constraint-breaking *only* for aggregated harms creates moral residue but denies any identifiable numerical threshold justifies it, making justification seem opaque or intuitionistic.

  3.  **Q3: Is breaking the constraint used as the *direct means* to achieve the good end, or merely a *foreseen side-effect*?**
      *   **Direct Means → Leaf C: Lexical-Rights Side-Constraint View**
          *   *Most Awkward Commitment:* Maintaining that core rights are absolute *as direct means* requires defining "catastrophe" non-quantitatively to permit rare overrides as side-effects, risking arbitrariness.
      *   **Foreseen Side-Effect → Leaf D: The 'Paradox Dissolver'**
          *   *Most Awkward Commitment:* Insisting obligations are inherently context-sensitive enough to avoid genuine clashes can appear ad hoc or like dissolving the problem by redefinition.

  4.  **Q4: Is breaking the constraint used as the *direct means* to achieve the good end, or merely a *foreseen side-effect*?**
      *   **Direct Means or Foreseen Side-Effect → Leaf A: Hard Absolutism**
          *   *Most Awkward Commitment:* Insisting constraints hold *even to prevent catastrophe* risks paralysis or endorsing intuitively monstrous outcomes ("let the world perish rather than sin").
      *   **Foreseen Side-Effect → Leaf B: Threshold Deontology**
          *   *Most Awkward Commitment:* Admitting constraints can be overridden *above a quantitative threshold* struggles to non-arbitrarily define that threshold and explain why it doesn't collapse into consequentialism.

  **Logical Space Notes:**

  1.  **Empty Branches:**
      *   **Option 1:** `Q1: No` + `Q2: Aggregated Pile of Harms` → This path (`No Residue` + `Aggregated Harm`) doesn't lead cleanly to a defined leaf. It's likely **unexplored or unattractive**: if breaking for aggregated harms leaves *no residue*, it suggests the constraint was weak/non-existent, conflicting with the core deontic commitment.
      *   **Option 2:** `Q1: Yes` + `Q2: Catastrophic Event` + `Q4: Direct Means` → This lands on **Hard Absolutism (Leaf A)**, but the `Direct Means` answer here is redundant with the `Foreseen Side-Effect` path to the same leaf. It's **coherent** (Absolutism forbids both) but highlights that the `Catastrophic` branch only splits Absolutism from Threshold via the violation-type question *if* one thinks Threshold might permit direct means in catastrophe (which is rare; Threshold usually focuses on the *scale* of harm, not the *type* of violation). The tree's structure forces this redundancy for Absolutism under Catastrophe.

  2.  **Potential Collapse Checked:**
      *   **Hard Absolutism (Leaf A)** vs. **Lexical-Rights (Leaf C):** The tree *does* separate them.
          *   Absolutism (`Leaf A`) is reached via `Q1:Yes` + `Q2:Catastrophe` + `Q4:Direct/Foreseen`. It forbids breaking *always*.
          *   Lexical-Rights (`Leaf C`) is reached via `Q1:No` + `Q3:Direct Means`. It forbids breaking *as a direct means*, potentially allowing it *as a foreseen side-effect* for catastrophe (reached via `Q1:No` + `Q3:Foreseen` → `Leaf D: Paradox Dissolver` *only if* they dissolve the clash; if they allow override for catastrophe as foreseen effect, they land on `Leaf C` conceptually, but the tree routes them to `Leaf D` via that path). The key distinction captured is that Lexical-Rights (`C`) *permits* breaking for catastrophe *only* as a foreseen side-effect, while Absolutism (`A`) forbids it *entirely*. The violation-type question (`Q3/Q4`) is crucial for this split. They do **not collapse**. Lexical-Rights is a moderate position compared to Absolutism.

  **Tree Summary:**

  *   **Leaf A: Hard Absolutism** (Break Never Permitted) - Awkward: Paralysis before catastrophe.
  *   **Leaf B: Threshold Deontology** (Break Permitted Above Quantitative Threshold) - Awkward: Defining the non-arbitrary threshold.
  *   **Leaf C: Lexical-Rights Side-Constraint** (Break as Direct Means Never Permitted; *Maybe* as Side-Effect for Catastrophe) - Awkward: Non-quantitative definition of "catastrophe".
  *   **Leaf D: The 'Paradox Dissolver'** (No Genuine Clash - Context Resolves) - Awkward: Appearing ad hoc or dismissive.
  *   **Leaf E: The Unnamed Hybrid** (Break for Aggregated Harms Permitted w/Residue, No Threshold) - Awkward: Justifying breaks without a clear threshold creates residue.
