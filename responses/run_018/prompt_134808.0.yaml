prompt: |-
  hey, i'm putting together a handout for my ethics seminar (advanced undergrads, mostly) and i want a taxonomy — like a decision tree — for the paradox of deontology. not the usual trolley problem rehash, please.

  i want the branches built from concrete distinctions that split real positions, not from the names of the positions. so each node should be a question someone can answer without knowing the jargon. specifically, use these three splitting questions (or ones you think are better): first, does breaking the constraint leave moral residue — guilt, agent-regret, whatever — even when it was clearly the right thing to do? second, is the harm you're trying to prevent one catastrophic event or an aggregated pile of smaller harms? third, is the rule violated as a direct means, or only as a foreseen side-effect?

  the leaves should be: hard absolutism (never break, full stop); threshold deontology (there's a quantitative line, cross it and breaking is allowed); a lexical-rights side-constraint view that tries to keep rights absolute but still makes room for catastrophic override; the 'paradox dissolver' who says obligations are already context-sensitive so there's no genuine clash; and one unnamed hybrid that accepts moral residue but denies any numerical threshold can ever justify breaking. for each leaf, name it (or 'unnamed') and write one sentence on its most awkward commitment.

  then do the logical-space bit: note any answer-combination that lands in an empty branch, and say briefly whether it's incoherent, unattractive, or just unexplored. also flag any pair of leaves that your tree can't actually seperate — i have a hunch absolutism and the lexical-rights view collapse, but check it.

  audience is a small reading group, so keep it to about six or seven leaves max. write in british english. and please — no bibliographies, no 'go read Kant', no citation lists. just the tree, with a typo or two left in if you feel like it.
