  Now for the sequence of introducing positions: I'll start with realism (universals as non-physical entities), then nominalism (no shared entities), then conceptualism (shared mental constructs). This order minimizes confusion because realism presents the intuitive view first: that shared properties exist independently. Then nominalism challenges it by denying extra entities, which feels counterintuitive. Conceptualism comes last as a compromise. I'll introduce trope nominalism after realism but before nominalism, as it bridges the gap by accepting property-instances without universals.

  For the misconception map, I need to anticipate where students might go wrong. For realism, they might think universals are "ghost copies" inside objects - I'll head this off by clarifying that universals aren't spatially located. For nominalism, they might think it denies properties exist at all - I'll correct that nominalism accepts properties as linguistic or class-based. For conceptualism, they might see it as subjective opinion - I'll emphasize it's about shared mental constructs, not personal taste.

  The functional-kind test will use the property "bug" in software across versions. After establishing the framework with chairs, this secondary case tests if students can apply the distinctions outside physical objects. Successful transfer would show correct metaphysical categorization; confusion might involve mixing it with causal similarity or resemblance.

