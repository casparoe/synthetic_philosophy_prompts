answer: |-
  Here’s a focused, tension-building teaching plan for Benacerraf’s dilemma tailored for lit grads in 40 minutes. The core analogy is a **courtroom drama**, avoiding chairs/tables while preserving the epistemic-metaphysical conflict.

  **Total Time:** 40 mins  
  **Goal:** Make them *feel* the pull of both sides—truth vs. knowability—without collapsing into anti-realism ("math is made up").

  ---

  ### **Teaching Plan**

  #### **1. Set-Up: The Non-Negotiables (5 mins)**
     - **Hook:** "Math *feels* discovered: we prove theorems, find errors, and it applies to the world. But if numbers are real *things*, how do we 'grab' them with our squishy brains?"
     - **Anchor Analogy: The Courtroom**  
       *"Imagine Truth is a judge demanding evidence. Knowledge is a detective who must deliver it. But the suspect (a mathematical object) refuses to leave its abstract hideout. How does the detective handcuff a ghost?"*  
       *(This frames the tension: Truth requires objective existence; Knowledge requires access.)*
     - **Define Key Terms (Preempt Misconceptions):**  
       - **Abstract ≠ Imaginary:** "Abstract = non-spatiotemporal, mind-independent (like democracy’s rules ≠ a unicorn in your head)."  
       - **Causal Knowledge ≠ Touch:** "Causal contact = any way the world *affects* your senses/instruments (e.g., gravity affects you without touch)."

  #### **2. Horn 1: The Platonist’s Truth (But Lost Detective) (10 mins)**
     - **Core Idea:** Math describes real abstract objects (like Plato’s "Forms").  
       *Student Task: Why does this feel right?* (Elicit: proofs are objective; 2+2=4 isn’t cultural.)
     - **Problem:** How does a physical brain *know* about causally inert abstractions?  
       - **Preempt Misconception:** "If you say ‘intuition’, is that causal? Does a neuron bump into the number 7?"  
       - **Computer Pivot (Off-Piste Injection):**  
         *"A proof-checking computer manipulates symbols flawlessly. Does it ‘know’ math? Or just syntax? If Platonism is true, the computer has zero more access than we do—it’s just shuffling tokens. So who ‘sees’ the real objects?"*  
       *(Deepens tension: even perfect syntax isn’t contact with abstractions.)*

  #### **3. Horn 2: The Empiricist’s Knowledge (But Lost Truth) (10 mins)**
     - **Core Idea:** Math knowledge comes from causal interaction (e.g., brains, symbols).  
       *Student Task: Why does this feel safe?* (Elicit: we *do* learn math via physical books/teachers.)
     - **Problem:** This reduces math to human conventions (like chess rules).  
       - **Preempt Collapse:** "If math is *just* symbols, why does it predict eclipses? Why can’t we vote that 2+2=5?"  
       - **Hammer the Loss:** "Without mind-independent truth, Galileo’s ‘math is the language of the universe’ becomes ‘math is the language of *our* universe-simulations’."

  #### **4. The Dilemma & Check for Understanding (10 mins)**
     - **Restate the Vise:**  
       - *Platonism:* Truth ✅ / Knowledge ❌  
       - *Empiricism:* Knowledge ✅ / Truth ❌  
       *"Choose: a real math universe we’re blind to, or a visible math that’s ‘just us’."*
     - **Check Grasp (Not Memorization):**  
       - **Question 1:** *"Could aliens discover the same prime numbers if Platonism is true? How? If false, why not?"*  
         *(Tests truth/knowability tension beyond humans.)*  
       - **Question 2:** *"If a computer prints a new proof, did it interact with abstract objects? Where would Benacerraf say it fits?"*  
         *(Tests application of the horns: empiricists say yes to symbols, Platonists say no to objects.)*  
       **Success if:** They articulate *why* Platonists struggle with epistemology and empiricists with ontology—without dismissing math as fiction.

  #### **5. Explicit Omissions & Wrap-Up (5 mins)**
     - **Refuse to Explain (Say This):**  
       *"We’re skipping two advanced pieces: (1) the ‘numbering problem’ (which sets satisfy math axioms?), and (2) Hartry Field’s nominalism (can physics be math-free?). Why? They’re detours around the dilemma—not solutions to it."*  
     - **Final Punch:** "Benacerraf isn’t solving this. He’s showing why philosophy of math *hurts*. Next week, we see how mathematicians live with the tension."

  ---

  ### **Why This Works**
  - **Courtroom Analogy:** Replaces chairs/tables with a relatable power struggle (truth/judge vs. knowledge/detective), making the conflict dramatic and visceral.  
  - **Misconception Preemption:**  
    - "Abstract ≠ imaginary" clarified immediately.  
    - Causal knowledge tied to *any* affectation (gravity, data input)—not touch.  
  - **Computer Pivot:** Injected at the Platonist’s weakest point, forcing students to confront if syntax suffices for "access."  
  - **Checks for Depth:** Questions about aliens/computers require applying the horns, not regurgitating them.  
  - **Strict Omissions:** Field/numbering problem named as off-limits to avoid rabbit holes.  

  **Timing Buffer:** Cut Q2 if short; expand computer discussion if long. Lean into pauses after key questions—let the tension simmer. Literature students thrive on unresolved conflict; this dilemma is perfect for them.
