  I'm writing a feature on philosophy debates that just spin their wheels, and I'm stuck on the Meno problem — why is knowledge actually better than true beleif? The literature has been recycling the same trio of answers for decades: reliabilists point to the process, virtue theorists call it achievement, pragmatists say it guides action better. Recently some folks have tried to recast the whole thing as collective credit-assignment — a group only knows if the belief traces to a responsible agent — but that hasn't broken the logjam either. My hunch is we're mixing up practical value, epistemic value, and maybe a hidden decision-theoretic question about risk-aversion in belief formation. So is this a verbal dispute, two different questions wearing one hat, or bedrock intuitions nobody can argue for? Give me exactly five numbered points, one or two sentences each, no intro or outro, diagnosing what kind of stall this is and what, if anything, would count as progress. Excuse the typo's — my editor's away.
