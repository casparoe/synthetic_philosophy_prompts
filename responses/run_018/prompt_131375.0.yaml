answer: |-
  **Social Epistemology - Grad Seminar Exam**  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1000 words  
  **Total Marks:** 25  

  ---

  ### EXAM QUESTION  
  **Critically evaluate the conciliationist and steadfast approaches to peer disagreement using the following case:**  

  > Mathematicians **A** and **B** are undisputed epistemic peers in number theory (identical training, publication records, and past reliability). They disagree about Lemma **L** in a new preprint.  
  > - **A** argues **B** misreads a notational convention standardized *only in 2022* (e.g., "⊗" now denotes tensor contraction, not direct sum).  
  > - **B** argues **A** is "overfitting to an old heuristic" and misapplies the new convention.  
  >   
  > Both agree they are peers *on core number theory* but disagree about whether they are peers *on interpreting this specific notation*. Enter **C**, another peer who hasn’t examined Lemma **L** but knows **A** and **B** have identical track records. **C** learns of the dispute and both justifications.  

  **Address:**  
  1. Does conciliationism require **A** or **B** to revise their belief about **L**? Does disagreement over *the source* of their disagreement (notation vs. heuristic) undermine conciliationism’s mandate?  
  2. Can **A** or **B** defensibly adopt a steadfast stance *without circular reasoning*?  
  3. How should **C**’s opinion affect **A**’s or **B**’s position? Does **C** break the epistemic symmetry?  
  4. What does this case reveal about the limits of *peerhood* in real-world disagreements?  

  ---

  ### MODEL ANSWER (≈800 words)  
  **Conciliationism’s Dilemma:** Conciliationism (e.g., Christensen, Elga) demands belief revision when facing peer disagreement to avoid arbitrariness. But here, **A** and **B** dispute *why* they disagree: **A** thinks **B** lacks competence on *new notation*; **B** thinks **A** misapplies *domain-general reasoning*. This meta-disagreement fractures peer symmetry. If **A** is right that notation interpretation is a *sub-competency* where **B** isn’t peer, conciliationism wouldn’t apply—it presumes undifferentiated peerhood. **A** could thus steadfastly hold their ground *if* justified in asserting asymmetric expertise. Yet **A** risks bootstrapping: claiming authority over the very issue in dispute. Conciliationism isn’t "undermined," but its trigger (symmetrical peerhood) is contested.  

  **Steadfastness Without Circularity?** Steadfast views (e.g., Kelly) allow maintaining belief if evidence strongly supports it. **A** could argue:  
  > "My critique targets **B**’s *specific* gap (2022 notation), not general competence. Track records don’t cover this niche. My awareness of the heuristic **B** cites is independent evidence I’m not overfitting."  

  This avoids circularity *if* **A**’s evidence for the notation’s standardization is external (e.g., citing textbooks, committee records). But **B** can mirror this: "**A**’s rigidity with new rules ignores contextual heuristics validated by past work." Neither is *inherently* circular, but both risk *question-begging* by assuming their diagnosis is correct. Steadfastness survives only if tied to *independent, shareable evidence*—not just assertions of localized superiority.  

  **C’s Role: The Meta-Peer? C** knows **A** and **B** are peers overall but faces a second-order disagreement about *why* they disagree. **C**’s default conciliationist move would be suspension of judgment—but this ignores asymmetry. If **C** knows **A** helped *draft* the 2022 notation standards (while **B** did not), **C** should weight **A**’s view more heavily. Absent that, **C**’s awareness of identical track records *intensifies* the problem: if **A** and **B** are equally reliable, but their diagnoses conflict, **C** has *stronger* reason to suspend judgment than **A** or **B** do. **C** breaks symmetry only if they possess *independent information* about the sub-dispute (e.g., notation vs. heuristics). Otherwise, **C**’s neutrality pressures **A**/**B** toward conciliation—but this pressures the *less justified* peer unfairly.  

  **The Peerhood Paradox:** This case exposes peerhood as *multidimensional*. Disagreements often hinge on *which* dimensions matter. **A** and **B** agree on "core" peerhood but clash on a sub-competency critical to **L**. Conciliationism struggles with disaggregated expertise; steadfastness risks collapsing into hubris. The solution isn’t a blanket rule but *evidence-sensitive adjudication*:  
  - If **A** objectively participated in standardizing the notation, their steadfastness is defensible.  
  - If not, both must confront whether their self-assessment of sub-competency is biased.  
  **C**’s role highlights that *without* breaking the symmetry on the sub-issue, disagreement metastasizes.  

  **Conclusion:** Conciliationism isn’t refuted but *localized*. It applies only when peers *are symmetric on the disagreement-relevant dimension*. Here, that symmetry is disputed, creating an evidential gray zone. **A**/**B** can be steadfast non-circularly by citing public evidence for their sub-competency claim. **C**’s opinion should compel revision only if it adds new asymmetry. Ultimately, peer disagreement relies on a *prior* agreement about what counts as shared expertise—which this case sabotages.  

  ---

  ### MARKING SCHEME (25 Marks Total)  
  | **Key Point**                                                                 | **Marks** | **Required Conceptual Move**                                                                 | **Common Mistake (A→B Drop)**                                      |  
  |-------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------------------|--------------------------------------------------------------------|  
  | **1. Diagnose peerhood asymmetry**                                            | 5         | Identify that disagreement over *source* (notation vs. heuristic) fractures peer symmetry. | Treating **A**/**B** as peers *simpliciter* despite their dispute. |  
  | **2. Conciliationism’s conditional mandate**                                  | 5         | Argue conciliationism applies *only* if peers are symmetric *on the relevant dimension*.    | Claiming conciliationism is "invalid" instead of *context-dependent*. |  
  | **3. Non-circular steadfastness**                                             | 5         | Ground steadfastness in *external evidence* (e.g., documentation for notation standards).    | Letting steadfastness rely *only* on assertion of expertise (circular). |  
  | **4. C’s role in breaking/not breaking symmetry**                             | 5         | Explain **C** affects disagreement *only* if adding new asymmetric evidence.                 | Suggesting **C**’s neutrality *always* forces **A**/**B** to conciliate. |  
  | **5. Meta-disagreement’s implications for peerhood**                          | 5         | Conclude peerhood requires shared *domain-specific criteria* to avoid stalemate.             | Ignoring that peer assessments can themselves be contested.        |  

  **Grade Boundaries:**  
  - **A (21-25)**: Hits all 5 points, avoids pitfalls, integrates **C** skillfully.  
  - **B (16-20)**: Misses 1-2 points or makes 1-2 "Common Mistakes".  
  - **C (11-15)**: Superficial treatment of asymmetry/meta-disagreement.  
  - **D (6-10)**: Recites generic conciliation/steadfast arguments.  
  - **F (0-5)**: Fails to engage the case.  

  ---  
  **Note for Grading:** Watch for students who "solve" the case by inventing *new facts* (e.g., "if C checks the notation manual..."). Credit only arguments using *given* parameters.
