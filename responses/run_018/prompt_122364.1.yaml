prompt: |-
  You are a professional philosopher who specializes in normative ethics — in particular the doctrine of double effect and the family of cases usually argued over under the heading of trolley problems — and who has some real experience of making that material usable by people who have never read any of it. Please think carefully and do not rush to the deliverable. Before you settle on a final version, spend a few paragraphs brainstorming two or three candidate ways of operationalizing the doctrine, and tell me what you tried, what you rejected, and why. I would much rather have a short, honest procedure with its failures marked than a long, confident one. And please do not give me citations or a reading list: I have the literature. What I need is the translation.

  My situation. I am a professor of philosophy at a large research university, and for two years I have been one of two philosophers sitting on our institutional review board. We meet for three hours every three weeks and dispose of between twenty and thirty protocols; each one has been pre-read by two members. The rest of the board is a pharmacist, a pediatric nurse, a biostatistician, a hospital chaplain, and two community representatives. None of them have studied philosophy, and the two community representatives have to be able to follow and dissent from our reasoning in real time. Every approval has to be defended in a written rationale that an external auditor could read a year later and make sense of. Anything the board cannot settle goes to the chair, who signs off alone. Assume throughout that each protocol below has already cleared our regulatory screening: I do not need the compliance analysis. I need the layer of moral reasoning that the screening does not do.

  The deliverable. A decision procedure — a checklist or a flowchart in words — that this board could actually run on a protocol in the ten or fifteen minutes we have per case, and that operationalizes the doctrine of double effect: the requirement that the act be permissible apart from its bad effects, the intended-versus-merely-foreseen condition, the prohibition on bringing about a good effect by way of a bad one, and the proportionality condition. I want you to be explicit about the translation: which of the doctrine's distinctions must survive simplification because dropping them would change the verdicts, and which are casualties we should accept in exchange for something a nurse and a community representative can apply without training. Mark every point at which the procedure hands the question to a person because what remains is a disagreement about values rather than a matter of fact. And give me at least two hard stopping rules — points at which the procedure returns 'not approvable as designed' and stops, rather than continuing to weigh.

  Four complications the procedure has to earn its keep on.

  First, the intended/foreseen condition. One of our members proposes a simple test: ask whether the good effect would still be achieved if the bad effect failed to occur; if it would not, the bad effect is being used as a means, and the protocol fails at that step. I have doubts, and I want them tested rather than confirmed. The test seems to me to misfire in both directions: it condemns protocols where a single causal process simply carries an unwelcome consequence along with it, and it waves through protocols where what does the work is the participant's body, or their reaction, or their not knowing something, which is precisely what I take the prohibition on using people to be about. My own hunch, which you should feel free to demolish, is that for our purposes the means condition should be replaced by something like an enlisting-versus-exposing question: does the protocol need to make use of the participant as an instrument, or does it merely place them in a situation in which harm may befall them? Build that in if it survives scrutiny, or tell me why it must go and what to put in its place. Relatedly, several of us keep reaching for the thought that diverting a threat that already exists is different in kind from starting a new causal sequence in motion, but we cannot say what to do with a protocol that does some of each.

  Second, proportionality. Two worries. May the good that is weighed include benefits to people other than the participants who bear the burden — future patients, a shelter population, a health authority — or must the relevant good be a good for, or at least a risk taken on by, the person harmed? And if we allow that aggregation, does the proportionality condition simply become cost-benefit analysis, leaving the rest of the doctrine as decoration? If so, say so, and tell me whether the doctrine is then doing any work in our setting at all.

  Third, redescription. Any test that turns on how the act or the effect is described can be gamed by describing more finely or more coarsely; I do not want an applicant to get a different verdict by relabelling. Should the procedure fix a level of description in advance, and if so, on what basis?

  Fourth, agency. The doctrine is stated for an individual agent with intentions, but the body applying it is a committee, and a committee does not literally intend anything. Tell me what the intended/foreseen condition even means when the agent is a board voting seven to one, and whether the procedure should ask about the intentions of the investigators, of the board, or of neither.

  The test cases. Run the procedure on all three, showing your work at each step and where it stalls.

  A. A randomized discontinuation trial. A drug is widely prescribed for a chronic, disabling, non-fatal condition, never properly tested, and genuinely in equipoise. Patients stable on it are randomized to continue or to taper off under monitoring, with a pre-specified rescue rule. Some in the taper arm will flare, painfully, and the flare is part of what generates the evidence.

  B. A stepped-wedge study of a screening-and-treatment programme for a stigmatized infectious disease across a city shelter system. Participation is voluntary and the intervention is beneficial on balance, but it is foreseeable that being seen to take the medication, or the existence of a record, will expose some participants to consequences from shelter staff, employers, or family. Those who impose the consequences are not subjects of the study.

  C. A phase I dose-escalation study in oncology, in which the maximum tolerated dose is defined by dose-limiting toxicity: the more toxicity is observed, the more is learned, and the patients who experience it are the instrument of the dose-finding. The benefit is overwhelmingly to future patients.

  Finally: at least one of your applications must return a verdict that my board will not like — ideally one that condemns a design that research ethics committees everywhere approve as a matter of routine. Do not soften it; if that result is a reductio of the doctrine rather than of the design, say which and argue for it. Close by telling me what this procedure cannot do: the cases it will systematically get wrong, and the questions it will make us answer insincerely in order to get to a verdict at all.
reasoning: |-
  Hmm, the user is a philosophy professor on an institutional review board needing a practical decision procedure for applying the doctrine of double effect to research protocols. They want something usable by non-philosophers in tight timeframes, with explicit tradeoffs between accuracy and simplicity.

  First, I need to unpack their four complications. The intended/foreseen test proposed by their colleague seems flawed because it would incorrectly flag necessary causal chains as means (like placebo effects) while missing cases where harm is instrumentally used (like dose-escalation toxicity). Their "enlisting vs exposing" alternative has promise but needs stress-testing - perhaps reframing it as whether harm is functionally necessary to the experimental mechanism.

  For proportionality, I'm leaning toward allowing societal benefits but with strict epistemic constraints: the benefits must be (1) necessary to justify the harm, (2) non-speculative, and (3) impossible to achieve otherwise. This prevents collapse into pure cost-benefit analysis while acknowledging research's social value.

  The redescription problem terrifies me. Fixing description levels seems impossible, so instead the procedure should force specification of both the physical intervention and its functional role in the protocol. We'll need to flag when relabeling changes moral status.

  Agency is messy. Investigator intention can't be ignored (what if they're clearly aiming for harm?), but board assessment should focus on protocol design as written. The key is whether the harm is structurally embedded versus contingently associated.

  For test cases: 
  - The discontinuation trial passes if flares are monitored risks rather than measurement tools 
  - The stigma study fails if harm is necessary for recruitment efficiency 
  - The oncology trial likely fails because toxicity isn't just risked but required as data source

  The harsh verdict must be the oncology study - it directly uses patients as calibration instruments. If the doctrine means anything, it should bite here.

  Major limitations: 
  - The procedure will struggle with cumulative minor harms 
  - It might over-reject innovative designs 
  - Worst of all, it incentivizes dishonest protocol drafting

  The core tension: We're trying to fit centuries of nuanced debate into a 15-minute checklist. Some butchery is inevitable - we just need to make sure we're carving at the joints.
answer: |-
  Here is a tested decision procedure for IRB application of the doctrine of double effect (DDE), optimized for non-philosophers, time constraints, and auditability. I developed it through three iterations, discarding two approaches before settling on this version. The trade-offs are explicit, and stopping rules are strict.

  ---

  **Procedure: DDE for IRB Review (10-15 min/protocol)**  
  *Run sequentially. Stop and reject if any step fails.*

  1. **PERMISSIBLE ACT TEST**  
     *Strip away all harmful effects.* Would the core research procedure remain ethically acceptable if no harm occurred?  
     - **YES**: Proceed.  
     - **NO**: **STOP. REJECT** (Act is intrinsically wrong).  
     - *Translation sacrifice:* DDE’s "act must be good/neutral" simplified to baseline permissibility.  
     - *Values handoff:* What counts as "baseline permissibility" uses existing IRB norms.

  2. **ENLISTMENT TEST** (Replacing means/intent)  
     *Is the harmful effect* functionally necessary *to achieve the research goal?*  
     - **NO** (Harm is collateral): Proceed to Step 3.  
     - **YES** (Harm is instrumental): **STOP. REJECT** (Uses persons as tools).  
     - *Why this over "intent"?*  
       - Rejected "Good without bad?" test: Fails oncology trials (toxicity unnecessary for cure) but flags discontinuation flares (flare = evidence source). Over-inclusive.  
       - Rejected pure intent focus: Unworkable for committees. Investigators’ intent is opaque; protocol design is objective.  
       - **Enlistment survives**: Pinpoints *structural dependency*. If removing harm voids the scientific objective, harm is instrumentalized.  
     - *Redescription defense:* Fix on the protocol’s *operational mechanism*. Ask: "Does the harm *do work* for the study?" Ignore semantic relabeling.

  3. **PROPORTIONALITY TEST**  
     *Are the harms (a) probable and severe, and (b) outweighed by direct benefits to the same participants?*  
     - **YES**: Approve (no DDE proportionality needed).  
     - **NO**: Proceed to 3b.  
     - *Translation:* Isolates cases needing DDE’s societal benefit calculus.  

     3b. *Would the same participant consent if they valued the collective good?*  
     - **YES** (Plausible, generalizable solidarity): Proceed.  
     - **NO** (Benefits speculative/remote): **STOP. REJECT** (Disproportionate burden).  
     - *Why not full aggregation?* Prevents collapse into cost-benefit. Societal benefits only count if:  
       - Directly generated by *this* study (not future research),  
       - Non-controversial (e.g., curing disease vs. commercial profit),  
       - *And* a reasonable person might accept the risk for this good.  
     - *Values handoff:* "Reasonable consent" judged by board’s communal norms.

  4. **THREAT ORIGIN CHECK**  
     *Does the protocol introduce a new threat?*  
     - **NO** (Manages pre-existing risk): Approve.  
     - **YES** (Creates novel risk): **Pause**. Flag for heightened scrutiny of Steps 1-3b.  
     - *Translation sacrifice:* "Diverted threat" distinction isn’t decisive but weights risk imposition.

  ---

  **Test Cases & Verdicts**  
  *(Showing work at each step)*

  **A. Randomized Discontinuation Trial**  
  1. **Permissible Act:** Yes. Tapering monitored medication is clinically acceptable.  
  2. **Enlistment:** *Flare is evidence source. Is it functionally necessary?* If flare data is required for endpoint, **YES → REJECT**. If flares are merely foreseen (rescue mitigates; endpoint is stability), **NO → Proceed**.  
     - *Crucial:* Protocol description determines if flare = tool or risk.  
  3. **Proportionality:** Harms (pain) vs. direct benefits (rescue rule). Likely unbalanced → **3b**. Collective benefit (better dosing) is material. Would participant consent? Plausibly **YES → Approve** (if 2 passed).  
  4. **Threat Origin:** Pre-existing condition → Low scrutiny.  
  *VERDICT: REJECT if flare is instrumentally necessary; APPROVE if collateral.*

  **B. Stigmatized Disease Screening**  
  1. **Permissible Act:** Yes. Voluntary screening/treatment is standard care.  
  2. **Enlistment:** *Is stigma harm necessary?* No. Harm comes from external actors; not functional to study goals. **NO → Proceed**.  
  3. **Proportionality:** Direct benefits (treatment) may outweigh stigma risk → **Approve** if yes. If stigma risk high/benefits low → **3b**. Collective benefit (public health) clear. Would participant consent? **YES** (plausible) → **Approve**.  
  4. **Threat Origin:** Novel risk? Stigma triggered by study involvement → **Flag**. But passed 1-3 → **Approve with risk mitigation**.  
  *VERDICT: APPROVE (with harm-reduction requirements).*

  **C. Oncology Dose-Escalation**  
  1. **Permissible Act:** *Without toxicity?* Administering sub-therapeutic doses to find MTD is not inherently wrong → **Yes**.  
  2. **Enlistment:** *Is toxicity functionally necessary?* **YES**. Toxicity defines MTD; it *is* the data. Participants’ harm directly generates knowledge → **STOP. REJECT**.  
     - *Harsh verdict:* Standard design fails DDE. Toxicity isn’t collateral; it’s the endpoint.  
  3. *Proportionality irrelevant after rejection.*  
  *VERDICT: REJECT as designed.*  
     - *Reductio?* Doctrine condemns standard practice. But DDE insists: You cannot *use* a person’s suffering as the measuring stick. Redesign options: Start at safe doses; use biomarkers; include therapeutic intent.

  ---

  **What This Cannot Do**  
  1. **Systematic errors:**  
     - Underestimates cumulative/minor harms (e.g., repeated blood draws).  
     - Over-rejects innovative designs where harm is *part* of therapeutic mechanism (e.g., risky surgery trials).  
  2. **Forced insincerity:**  
     - Step 2 (Enlistment) pressures boards to redescribe harms as "collateral" to approve studies (e.g., calling dose-toxicity "observed risk" not "required data").  
     - Step 3b ("reasonable consent") invites paternalism when boards override participant vulnerability concerns.  
  3. **Blind spots:**  
     - No grip on third-party harms (e.g., family distress).  
     - Cannot resolve when societal benefits are legitimate but contested (e.g., military-related research).  

  **Final Note:** This procedure makes DDE’s core trade-off explicit: It protects against instrumentalization (Step 2) at the cost of rejecting some socially valuable research (Case C). If your board won’t reject standard dose-escalation, DDE is ornamental. Use it only when the *means* of harm production matters more than net utility.
