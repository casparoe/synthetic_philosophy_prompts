prompt: |-
  I teach philosophy at a mid-sized university and, for my sins, I also sit on our college's student grievance committee, which means about once a month I help decide what to do with complaints that range from plagiarism accusations to "Professor X humiliated me in seminar." At a recent meeting a colleague dismissed one complaint as "just honor culture stuff," borrowing from that Campbell and Manning line of work on moral cultures -- the distinction between honor cultures (slights must be answered personally or status is lost), dignity cultures (your worth isn't up for grabs, so you shrug off insults and use formal channels for serious harms), and victimhood culture (appeals to third parties and public displays of victimization as a way of mobilizing support). I've been thinking the typology might actually be useful as triage: not to decide who's right, but to figure out what kind of conflict we're even looking at and what response each kind calls for. But I don't want to improvise it anew each meeting, and the other committee members aren't going to read the sociology literature.

  So here's what I want: turn the honor/dignity/victimhood framework into a classification-and-response procedure the committee can actually run in the first twenty minutes of looking at a complaint. It should give us questions to ask in order, say what answers sort a case into which category (including what a genuinely hybrid case looks like, since real complaints are usually messier than the theory), and then attach a recommended handling style to each category -- e.g., what mediation looks like when the underlying logic is honor-based versus when the complaint is structured as an appeal to third parties. It also needs to say explicitly where classification must stop short: the diagnosis of which moral culture is operating can't be allowed to settle the merits, and I'd like the procedure to build in a guard against that, plus a guard against us treating "this is victimhood culture framing" as itself a reason to dismiss. Run the procedure on three worked examples I'll supply: a student demanding a public apology from a classmate who mocked his hometown accent; a student filing a formal complaint that a professor's repeated sarcastic comments about her work amount to harassment; and a group of students circulating a petition calling for a lecturer's removal over a single classroom remark. Include at least one case where the procedure spits out a recommendation I'll find uncomfortable -- say, advising formal mediation for a complaint I personally think is frivolous -- and mark clearly the points where the classification gives out and it's just committee judgment.

  Two requests about how you answer. First, give me the bottom line in the opening sentence -- whether the typology can actually bear the weight of being operationalized like this -- then the procedure itself, then the worked cases, then the caveats; no warm-up and no restating my question back at me. Second, push back where warranted: I know this literature has critics who say the three cultures are ideal types at best and maybe a moralized caricature at worst, so if you think the premise of building committee procedure on it is confused, or that I've misdescribed one of the categories, say so plainly rather than politely working around it.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy professor serving on a grievance committee who wants to operationalize Campbell and Manning's moral cultures framework into a practical triage tool. The core challenge is transforming sociological theory into an actionable protocol while navigating its limitations.

  First, I need to assess whether the typology can support this application. The honor/dignity/victimhood distinction offers useful analytical lenses, but as ideal types, they risk oversimplifying real cases. The committee would need strong safeguards against using the classification to prejudge merits. 

  For the procedure design, I'm considering a three-phase approach: classification questions to identify dominant cultural logic, conflict mapping to understand the dispute structure, and response protocols matched to each cultural pattern. Key considerations include:
  - Questions focused on observable behaviors (e.g., "What remedy is sought?") rather than subjective intent
  - Explicit hybrid category with conflict mapping exercise
  - Response protocols that respect each culture's logic (e.g., face-saving for honor cases)
  - Built-in warnings against conflating classification with merit assessment

  The worked examples will test the framework's boundaries. The accent mockery case likely shows hybrid honor/victimhood elements - demanding public apology (honor) while invoking institutional intervention (victimhood). The sarcasm complaint may reveal dignity culture expectations violated by perceived harassment. The petition case could demonstrate victimhood culture dynamics with collective mobilization over a single remark.

  Critical caveats must foreground the framework's limitations: 
  - Typology as diagnostic tool only, never determinative of outcome
  - Hybrid cases requiring committee judgment
  - Risk of bias when labeling complaints as "victimhood culture"
  - Unavoidable role of institutional context in responses

  The discomfort test case is crucial - perhaps recommending formal mediation for a borderline harassment claim to maintain institutional consistency, even if individually deemed frivolous. This would highlight where procedure must override personal judgment.

  Throughout, I'll maintain academic rigor by:
  - Citing relevant critics like Tyler and Goldberg
  - Distinguishing observable patterns from moral evaluation
  - Emphasizing the committee's ultimate discretion
  - Providing clear exit ramps when typology reaches its limits
answer: |-
  **Bottom line:** Yes, the honor/dignity/victimhood typology *can* be operationalized for initial triage, **but** it requires strict procedural safeguards and recognition of its limits as ideal types—it should diagnose *conflict logic*, not case validity.

  ---

  ### **Operational Procedure: Moral Culture Triage Protocol (20-Minute Framework)**
  **Phase 1: Classification Questions (5-7 mins)**  
  Ask these sequentially. Stop when dominant pattern emerges (allow hybrid flags).  

  1.  **"What remedy does the complainant explicitly seek?"**  
      -   *Honor:* Public apology, retraction, or personal confrontation/accountability (e.g., "They must admit they were wrong *to me*").  
      -   *Dignity:* Correction of material harm (grade change, policy clarification), formal reprimand (discreet), or assurance of future compliance.  
      -   *Victimhood:* Institutional sanction (disciplinary action, removal), public acknowledgment of harm, structural change (policy reform, training), or validation of experience by authority.  
      -   *Hybrid Flag:* Seeks both personal accountability *and* institutional intervention (e.g., "Professor must apologize *and* attend training").  

  2.  **"How is the harm framed, and who is invoked?"**  
      -   *Honor:* Focus on personal insult, disrespect, or status challenge ("They mocked *me*"). Invokes personal reputation/identity.  
      -   *Dignity:* Focus on violation of rules, rights, or professional standards ("This broke conduct policy X"). Invokes institutional norms.  
      -   *Victimhood:* Focus on systemic harm, vulnerability, or group impact ("This creates a hostile environment for students like me"). Invokes third-party solidarity or protected identities.  
      -   *Hybrid Flag:* Mixes personal affront with systemic claims (e.g., "Their insult targeted my disability, which demeans all disabled students").  

  3.  **"What response has the complainant rejected or avoided?"**  
      -   *Honor:* Rejects private resolution ("Talking privately won’t restore my standing"). Avoids formal channels seen as "weak."  
      -   *Dignity:* Rejects escalation over minor slights ("I wouldn’t complain over one comment, but it’s constant"). Avoids public drama.  
      -   *Victimhood:* Rejects individual resolution ("This isn’t just about me"). Avoids direct confrontation with perceived power imbalance.  
      -   *Hybrid Flag:* Rejects solutions addressing only one aspect (e.g., refuses apology without policy change).  

  **Classification Output:**  
  - **Dominant Type** (≥2 answers align clearly).  
  - **Hybrid Case** (mixed signals; proceed to Conflict Mapping).  

  **Phase 2: Conflict Mapping (If Hybrid or Unclear) (5 mins)**  
  *Task:* Sketch the "logic chain" of the grievance:  
  1.  What was the *trigger* (specific act)?  
  2.  What *value* was violated (respect, fairness, safety)?  
  3.  What *social consequence* is feared (loss of face, unchecked injustice, normalized harm)?  
  4.  What *resolution* would restore order?  
  *Pattern Recognition:*  
  - *Honor-driven* chains center on *personal status repair*.  
  - *Dignity-driven* chains center on *procedural correction*.  
  - *Victimhood-driven* chains center on *institutional/symbolic repair*.  

  **Phase 3: Recommended Handling Style (5 mins)**  
  *Match response to conflict logic to address core motivations:*  
  - **Honor-Dominant:** **Face-Saving Mediation**  
      - *Goal:* Restore personal standing.  
      - *Method:* Facilitated dialogue focused on acknowledgment (not punishment). Third party ensures "equal footing." Avoid written records if possible.  
      - *Risk if Ignored:* Escalation to vendetta or public shaming.  

  - **Dignity-Dominant:** **Rule-Based Review**  
      - *Goal:* Impartial assessment of facts against policy.  
      - *Method:* Formal investigation confined to specific alleged violations. Outcome: corrective action or dismissal with clear rationale.  
      - *Risk if Ignored:* Erosion of trust in institutional fairness.  

  - **Victimhood-Dominant:** **Recognition-Focused Process**  
      - *Goal:* Validate experience and affirm institutional values.  
      *Method:* Acknowledge harm *first* (even if no sanction follows). Offer public statement, policy review, or restorative circle. Sanctions require separate evidentiary process.  
      - *Risk if Ignored:* Mobilization of broader outrage; reputational damage to institution.  

  - **Hybrid:** **Sequenced Approach**  
      - *Method:* Address honor/victimhood recognition needs *first* (e.g., acknowledgment of harm), then shift to dignity-based review of actionable claims.  

  ---

  ### **Worked Examples**  
  **Case 1: Student demands public apology from classmate who mocked accent.**  
  - **Q1:** Public apology → *Honor* (personal accountability).  
  - **Q2:** "They disrespected me and my background" → *Honor* (personal insult) + *Victimhood* (group identity implied). *Hybrid Flag*.  
  - **Q3:** Rejects private apology → *Honor*.  
  - **Classification:** **Hybrid (Honor-Victimhood)**.  
  - **Conflict Mapping:**  
      - Trigger: Mockery of accent.  
      - Value Violated: Personal/group respect.  
      - Fear: Ongoing ridicule; devaluation of identity.  
      - Restoration: Public status repair.  
  - **Handling:** **Sequenced Approach**. First: Facilitated dialogue for acknowledgment (honor). If group harm cited, add public statement on inclusivity (victimhood). *Then* assess if conduct violation occurred (dignity).  

  **Case 2: Student files formal complaint over professor’s "repeated sarcastic comments" as harassment.**  
  - **Q1:** Formal reprimand, policy enforcement → *Dignity*.  
  - **Q2:** "Violates professional standards; creates unfair environment" → *Dignity* (rules) + *Victimhood* ("environment" implies systemic impact). *Hybrid Flag*.  
  - **Q3:** Rejected "just talking to professor" → *Dignity* (seeks procedural fairness).  
  - **Classification:** **Dignity-Dominant (with victimhood undertones)**.  
  - **Handling:** **Rule-Based Review**. Investigate frequency/severity of comments against harassment policy. *Add:* Post-investigation, if harm is validated, issue statement on professional conduct (addressing victimhood need for recognition).  

  **Case 3: Students circulate petition for lecturer’s removal over a single remark.**  
  - **Q1:** Removal/sanction → *Victimhood*.  
  - **Q2:** "The remark was [e.g.] racist; makes campus unsafe for marginalized groups" → *Victimhood* (systemic harm/group impact).  
  - **Q3:** Rejects "context" or private resolution → *Victimhood* (seeks institutional validation).  
  - **Classification:** **Victimhood-Dominant**.  
  - **Handling:** **Recognition-Focused Process**.  
      - **Step 1:** Acknowledge concern and affirm institutional values (e.g., "We take reports of bias seriously").  
      - **Step 2:** Initiate *separate* dignity-based review: Does the remark violate policy warranting sanction?  
      - **Uncomfortable Recommendation:** *Even if the committee deems the remark isolated/not policy-violating, Step 1 is non-negotiable.* Failure to validate concerns risks escalation.  

  ---

  ### **Critical Caveats & Safeguards**  
  1.  **Not a Merit Test:** Classification diagnoses the *logic of the grievance*, not its validity. A "victimhood" framing doesn’t make harm real or imagined; a "dignity" claim isn’t inherently more legitimate.  
  2.  **Guard Against Dismissal:** Labeling a complaint "victimhood culture" **must not** imply it’s invalid. The procedure *requires* recognition steps even for claims perceived as frivolous (see Case 3).  
  3.  **Hybrids Are the Norm:** Most cases won’t fit cleanly. Conflict Mapping is essential—skip it only if all Phase 1 answers align unambiguously.  
  4.  **Power Dynamics Trump Typology:** If a power imbalance exists (e.g., student vs. tenured professor), override protocol to ensure complainant protection. Honor-style mediation may be unsafe here.  
  5.  **Critique of Typology:**  
      - Campbell/Manning’s "victimhood culture" is criticized as a politicized caricature (e.g., Tyler 2020). **Mitigation:** Use "third-party mobilization" instead of "victimhood" in committee notes.  
      - Overlaps with "dignity" (both use institutions) are under-theorized. **Mitigation:** In mapping, distinguish *why* institutions are invoked: for neutral arbitration (dignity) or moral authority (victimhood).  
  6.  **Where Classification Stops:**  
      - Determining if a *specific act* occurred → Requires evidence review.  
      - Deciding sanctions → Requires policy analysis.  
      - Balancing institutional resources/risk → Requires committee judgment.  
      **→ Phase 3 recommendations are *procedural*, not substantive.**  

  **Final Note:** This works *only* if the committee agrees: **Classifying the conflict's logic is about finding the best path to resolution, not the fastest path to dismissal.**
