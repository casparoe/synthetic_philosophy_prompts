  ### Diagnostic Taxonomy: Kuhnian Paradigm Shifts & Incommensurability  
  **Root Commitment**: Scientific change is not purely cumulative; it includes episodes where core terms, evaluation standards, and ontological commitments shift together, resisting direct translation.  

  ---

  #### **Branch 1: Scope of Incommensurability**  
  - **Claim A**: "Incommensurability is confined to specific clusters of interdefined theoretical terms (e.g., 'mass' in Newtonian vs. relativistic mechanics), leaving other domains unaffected."  
  - **Claim B**: "Incommensurability extends globally, restructuring the entire disciplinary matrix (e.g., Ptolemaic vs. Copernican cosmology reshapes astronomy, physics, and methodology)."  

  ---

  #### **Branch 2 (from A/B): Primary Discontinuity Type**  
  - **Semantic Claim**: "The meaning and reference of key terms shift irreconcilably (e.g., 'element' in alchemy vs. chemistry)."  
  - **Ontological Claim**: "The fundamental entities/structures posited change (e.g., phlogiston vs. oxygen in combustion theories)."  
  - **Methodological Claim**: "Standards of explanation, confirmation, and problem-solving diverge (e.g., qualitative Aristotelian teleology vs. quantitative Galilean mathematization)."  

  ---

  #### **Branch 3 (from each discontinuity type): Rational Comparison Viability**  
  - **Viable Claim**: "Practitioners can weigh paradigms using shared criteria: predictive accuracy, problem-solving efficacy, simplicity, or consistency (e.g., comparing DNA models via explanatory coherence)."  
  - **Non-Viable Claim**: "Rational comparison breaks down; paradigms are chosen via sociological dynamics, pragmatic utility, or aesthetic preference (e.g., continental drift’s acceptance hinged on generational turnover)."  

  ---

  #### **Branch 4 (from viable/non-viable): Relativism vs. Realism**  
  - **Relativist Claim**: "Incommensurability entails truth is paradigm-relative (e.g., Euclidean and non-Euclidean geometries describe irreconcilable realities)."  
  - **Realist Claim**: "Incommensurability is compatible with realism; paradigms approximate the same reality via distinct conceptual schemes (e.g., wave/particle models of light access objective features)."  

  ---

  #### **Niche Distinction: Computational Arbitration**  
  *(Injected at rational comparison nodes)*  
  - **Neutral Arbitration Claim**: "Large-scale computational simulation and data-driven model selection provide paradigm-independent arbitration (e.g., climate models resolve theoretical disputes objectively)."  
  - **Embedded Arbitration Claim**: "Computational methods are shaped by the paradigms they evaluate (e.g., machine-learning priors embed ontological assumptions of the training data)."  

  ---

  ### Leaf Positions  
  1. **Local + Semantic + Viable + Realist**  
     *Named: **Post-Kuhnian Semantic Realism***  
     Diagnosis: Semantic shifts (e.g., "species" in evolution theories) permit rational comparison; truth is absolute.  

  2. **Local + Semantic + Viable + Relativist**  
     *Unnamed*  
     Diagnosis: Logically unstable—viable comparison undermines truth-relativism. Rarely defended.  

  3. **Local + Semantic + Non-Viable + Realist**  
     *Unnamed*  
     Diagnosis: Coherent but unattractive—semantic gaps block rational choice, yet reality is fixed (e.g., untranslatable terms in quantum gravity).  

  4. **Local + Semantic + Non-Viable + Relativist**  
     *Named: **Kuhn’s Early Radicalism***  
     Diagnosis: Semantic incommensurability voids rational comparison; truth is paradigm-bound.  

  5. **Local + Ontological + Viable + Realist**  
     *Named: **Structural Realism***  
     Diagnosis: Ontological shifts (e.g., from ether to fields) allow comparison via structural continuity; truth is absolute.  

  6. **Local + Ontological + Non-Viable + Realist**  
     *Unnamed*  
     Diagnosis: Neglected—ontological divergence blocks comparison, but realism persists (e.g., competing dark matter ontologies).  

  7. **Global + Methodological + Non-Viable + Relativist**  
     *Named: **Strong Kuhnian Incommensurability***  
     Diagnosis: Global methodological shifts (e.g., Freudian vs. cognitive psychology) preclude comparison; truth is relative.  

  8. **Global + Methodological + Viable + Embedded Arbitration + Realist**  
     *Named: **Methodological Pluralism***  
     Diagnosis: Computational methods are paradigm-embedded, yet enable comparison via pragmatic efficacy (e.g., agent-based models in social science).  

  9. **Global + Ontological + Non-Viable + Realist**  
     *Unnamed*  
     Diagnosis: Incoherent—global ontological divergence (e.g., vitalism vs. mechanism) cannot coexist with robust realism.  

  ---

  ### Flagged Overlaps  
  - **Leaf 2 vs. Leaf 1**: Overlap is substantive; viable rational comparison is incompatible with truth-relativism.  
  - **Leaf 6 vs. Leaf 7**: Verbal overlap; both describe non-viable comparison, but Leaf 6’s realism conflicts with Leaf 7’s global relativism.  

  ### Design Notes  
  - **Branch Points**: 7 (scope, discontinuity ×3, comparison, relativism, niche arbitration).  
  - **Leaves**: 9 positions (5 named, 4 unnamed).  
  - **Diagnostic Focus**: Nodes use concrete judgments (e.g., "climate models resolve disputes") to avoid label-matching.  
  - **Niche Distinction**: Forces positions to confront if computational methods transcend or reproduce paradigm biases.  

  This tree isolates core commitments while exposing tensions (e.g., realism + non-viable comparison) and gaps (e.g., neglected local ontological non-viability).
