answer: |-
  The stall is primarily substantive, rooted in conflicting interpretations of how "waste" functions in signaling equilibrium, but is exacerbated by differing empirical emphases and definitions; progress requires clarifying the relationship between *ex ante commitment* and *ex post net cost* within specific signaling environments.

  Here's the diagnosis and path forward:

  1.  **Core Substantive Disagreement:** Both sides agree signals must be costly to be honest and stable. The core dispute is whether **irrecoverable waste (net fitness loss)** is *necessary* for the signal to guarantee honesty ("handicap" in Zahavi's strict sense) or whether **recoverable costs (investments generating deferred benefits)** are sufficient ("strategic investment" view).
      *   **Proponents (Strict Handicap):** Argue only *phenomenologically wasteful* acts (energy/risk/resources *observably* expended and *irrecoverable* into the signaler's fitness budget) can guarantee honesty because any cost that can be recouped (e.g., via reputation gains) is vulnerable to cheating by low-quality agents who also benefit from the reputation without bearing the true underlying cost of quality. They emphasize **observability of the loss itself** as the guarantor.
      *   **Critics (Strategic Investment):** Argue that signals stabilized by costs *recoverable through the social benefits they unlock* (e.g., trust, cooperation, status granting access to resources) are still honest *if* the *net cost* (initial investment minus deferred benefits) is sufficiently higher for low-quality agents than for high-quality agents. They focus on **differential net cost** as the key, treating "waste" as a misleading phenomenological description when deferred benefits exist. The "cost" is the *risk* or *opportunity cost* of the investment, not necessarily net loss.

  2.  **Verbal & Emphasis Differences:** The term "handicap" is often used loosely. Proponents typically reserve it for signals requiring net loss. Critics often use it synonymously with "costly signal" generally. Furthermore:
      *   Proponents often emphasize **phylogenetic origins** and **ultimate function** – how could such signals evolve *de novo* without initial net cost?
      *   Critics often emphasize **proximal mechanisms** and **current stability** – how is the signal *maintained* in a complex social system where benefits flow back?

  3.  **Settled in Signaling Theory:**
      *   Signals require differential costs (or correlation structures) to be stable against dishonesty (Fundamental Theorem of Signaling).
      *   Costly signaling models (Grafen, Getty, etc.) formally demonstrate stability conditions where signals are honest because high-quality signalers pay lower marginal costs or gain higher marginal benefits for the same signal.
      *   Reputation and repeated interactions *can* sustain honest signaling without inherent physical waste (e.g., via punishment or withheld future benefits).

  4.  **Genuinely Contested Among Specialists:**
      *   **Is net waste necessary?** Must the signal involve a *net* fitness drain, or is a *differential net cost* (even if net positive for high-quality signalers) sufficient for stability, especially in complex social systems? This is the core unresolved question.
      *   **The role of observability:** Must the *waste itself* be directly observable, or is the *signal act* sufficient, with costs being potentially hidden or recoverable? Proponents argue direct waste observability is crucial; critics argue the *act's* observability enabling reputation tracking is key.
      *   **Applicability to human morality:** Is conspicuous altruism primarily a Zahavian handicap (net loss affordable only by the genuinely fit/cooperative) or a reputation-based investment (where benefits often exceed costs for successful signalers)?

  5.  **Paths to Progress:**
      *   **Formal Distinction:** Explicitly modeling and distinguishing **ex ante commitment/risk** (the irreversible decision point involving potential loss) from **ex post net cost/benefit** (the final accounting after deferred benefits). This clarifies that a signal can involve genuine, observable risk/commitment *at the time of signaling* (satisfying the "waste" proponents emphasize phenomenologically) while still yielding net benefits *if* the signaler is high-quality (satisfying the critics' focus on differential net cost).
      *   **Empirical Burden Measurement:** Rigorous studies quantifying *who* bears the *net* cost/benefit across different qualities/social positions. Does conspicuous giving *net* benefit high-status donors while *net* costing low-status imitators? This directly tests the differential net cost hypothesis in specific contexts (e.g., philanthropy, risky heroism).
      *   **Reconceptualizing the Environment:** Framing the signaling environment to include the *institutions* and *reputation-tracking mechanisms* that convert apparent waste into recoverable investment. Progress requires models where these mechanisms are explicitly part of the cost/benefit calculus determining stability, showing *how* they impose differential net costs.
      *   **Origins vs. Maintenance:** Explicitly separating the debate: What evolutionary *origins* require net waste to bootstrap the signal? Once established, can reputation systems *maintain* it with recoverable costs? This acknowledges both perspectives might be partially correct for different phases.

  **Bottom Line on Progress:** Demonstrating rigorously, either empirically or through models incorporating specific social structures, that observable *ex ante commitments* create differential *ex post net fitness outcomes* sufficient to stabilize honest signaling *without* requiring the signal to result in an irrecoverable net fitness drain *for the high-quality signaler* would significantly resolve the stall in favor of the strategic investment view for maintenance. Conversely, finding contexts where net drain *is* essential for stability (despite potential reputation benefits) would support the strict handicap view. The debate hinges on the necessity of net loss.
