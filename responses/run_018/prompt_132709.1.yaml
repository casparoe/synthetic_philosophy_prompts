answer: |-
  Here are the core desiderata for a theory of future contingency, structured around the conceptual challenges of the sea-battle problem, highlighting motivations, non-negotiables, tensions, and brief assessments of key approaches.

  ### Core Non-Negotiable Desiderata (Logical & Ontological Bedrock)

  1.  **Avoidance of Logical Fatalism:**
      *   **Motivation:** The core problem. If "There will be a sea battle tomorrow" (P) is *now true*, and truth entails necessity (via the necessity of the past), then the battle is inevitable, eliminating contingency. Conversely, if it's *now false*, its negation is necessary, eliminating the possibility of a battle. Both violate contingency.
      *   **Requirement:** The theory must provide an account of future-contingent propositions (like P) that blocks the inference from truth/falsity *now* to necessity *now*. Truth-status must be compatible with genuine openness.
      *   **Non-Negotiable:** Yes. Contingency is the phenomenon to be explained.

  2.  **Consistency with Core Modal Logic (Minimally System K):**
      *   **Motivation:** Logical coherence and reasoning about possibility/necessity are fundamental. A theory shouldn't invalidate basic principles like: If necessarily (A → B) and necessarily A, then necessarily B (K axiom). Rejecting core modal logic renders the theory unusable for reasoning about possibility/necessity, central to contingency.
      *   **Requirement:** The theory must be compatible with the valid inference rules and axioms of at least a minimal normal modal logic (like K).
      *   **Non-Negotiable:** Yes. Foundational for coherent modal reasoning.

  3.  **Preservation of Diachronic Propositional Identity:**
      *   **Motivation:** "There will be a sea battle tomorrow" uttered on Monday and "There was a sea battle yesterday" uttered on Wednesday must be about the *same event*. The proposition expressed must maintain its identity across time for truth-values to be meaningfully compared retrospectively.
      *   **Requirement:** The content/reference of propositions about future events must be stable enough that we can say meaningfully *later* that an earlier assertion was true or false, based on what *actually happened*. The proposition "P" at t1 is the same entity as "P" evaluated at t2>t1.
      *   **Non-Negotiable:** Yes. Without this, retrospective truth assessment loses meaning, and the "fixity of the past" becomes incoherent.

  4.  **Respect for Past Fixity / Asymmetry of Openness:**
      *   **Motivation:** Intuition and practice: We deliberate and hold agents responsible for future actions, believing alternatives are open, while treating the past as settled and unchangeable. Laws and norms assume this asymmetry.
      *   **Requirement:** The theory must ground the difference between the "fixed" past and the "open" future. Propositions about the settled past should have determinate truth values (typically true or false), while propositions about the contingent future may not (or may have a different status). The past must constrain the future (not everything is possible now given the actual past).
      *   **Non-Negotiable:** Yes. Capturing the asymmetry is essential to the phenomenon of future contingency.

  5.  **Coherence of Retrospective Truth Attribution:**
      *   **Motivation:** Once the sea battle happens (or doesn't) on Tuesday, it seems undeniable that the Monday assertion "There will be a sea battle tomorrow" was *true* (or *false*). We routinely make such judgments.
      *   **Requirement:** The theory must allow that *after* the event time, a proposition like P can be correctly assessed as having been true (if the event occurred) or false (if it didn't). This assessment must be consistent with the proposition's identity over time (Desideratum 3).
      *   **Non-Negotiable:** Yes. Reflects basic linguistic practice and the intuition that events "make" past statements true/false.

  ### Significant (Often Camp-Dependent) Desiderata

  6.  **Bivalence for Future Contingents:**
      *   **Motivation:** Logical simplicity, adherence to classical logic (Law of Excluded Middle: P ∨ ¬P is always true), intuition that "it *will* happen or it *will not* happen" seems inescapably true even if we don't know which disjunct is true. Favored by determinists and some indeterminists (Ockhamists).
      *   **Requirement:** Every meaningful proposition, including future contingents like P, is either true or false at the time of utterance.
      *   **Non-Negotiable:** No. Rejected by Aristotelians/Open Futurists. Reflects a preference for classical logic and a specific view on truth.

  7.  **Grounding of Truth/Determinate Truth:**
      *   **Motivation:** Truth supervenes on being. What *makes* a future-tense statement true now? Requires an ontological basis.
      *   **Requirement:** If a future-contingent proposition is true (or false) *now*, there must be some present or timeless fact/state of affairs/feature of reality that grounds that truth value *now*. (E.g., present causal chains, divine foreknowledge, a privileged future branch).
      *   **Non-Negotiable:** No. Views differ on what grounds truth (e.g., Ockhamists: the actual future branch; Aristotelians: nothing grounds a truth value for a pure future contingent *now*; TRL: the metaphysically privileged branch). Reflects metaphysical commitments (determinism, presentism, etc.).

  8.  **Contingency / Genuine Openness:**
      *   **Motivation:** Preserving the intuition that the future isn't fully settled, that multiple courses of events are genuinely possible, and that agents have libertarian free will (if desired).
      *   **Requirement:** For some future events (like the sea battle), multiple incompatible future histories must be genuinely possible at the time of utterance. The theory shouldn't entail that only one future is metaphysically possible *now*.
      *   **Non-Negotiable:** *Conceptually* yes (as per Desideratum 1), but interpretations vary. Hard determinists reject it. Most non-fatalist theories accept it, but define "possible" differently (e.g., Ockhamists: many branches are possible, only one is *actual*; TRL: many are possible, one is *privileged*; Aristotelians: many are possible, none is *actual* yet).

  9.  **Law of Non-Contradiction (LNC) for Present-Tense Future Reports:**
      *   **Motivation:** Basic logical coherence. "A sea battle is occurring tomorrow" (present-tense report about a future time, uttered today) and "No sea battle is occurring tomorrow" cannot both be true *simpliciter* at the same time and in the same respect.
      *   **Requirement:** For any specific future time t, the proposition "Event E is occurring at t" and "Event E is not occurring at t" cannot both be true. LNC must hold for propositions describing states of affairs at specific times, regardless of when they are uttered.
      *   **Non-Negotiable:** Yes. Violating LNC is generally considered a fatal flaw for any logical system. All serious contenders satisfy this.

  ### Key Tensions and Potential Joint Unsatisfiability

  *   **Bivalence + Grounding + Openness:** This is the core tension.
      *   If Bivalence holds (P is T or F *now*), and Truth requires Grounding *now*, then there must be some *present* fact making P true or false *now*. This strongly suggests determinism (the future is settled by the present+past) or a metaphysically privileged future, potentially undermining genuine openness (Desideratum 8). Ockhamism/TRL accept Bivalence+Grounding but define Openness in terms of alternative *possibilities* (branches), not present *indeterminacy*. Aristotelianism rejects Bivalence/Grounding *now* to preserve stronger openness.
  *   **Retrospective Truth + Denial of Bivalence:**
      *   If P lacks a truth value on Monday (Aristotelianism), how can it be *true* on Tuesday? The Aristotelian must explain the *acquisition* of truth value without violating past fixity – the Monday state (lack of truth value) is fixed, yet we truly say "It *was* true" on Tuesday. Solutions involve temporal qualification of truth predicates or relativization to contexts of assessment.
  *   **Openness + Fixity of Past:**
      *   While both are required, defining the exact boundary (how far back does "past" extend?) and ensuring future possibilities are genuinely open *given* the fixed past can be delicate, especially in branching models. Does "past" include *all* events before *now*, or only events before *the event in question*? How do past truths about the future constrain openness?

  ### Brief Assessment of Frameworks vs. Non-Negotiables

  1.  **Aristotelian (Open Future, Denies Bivalence):**
      *   **Avoids Fatalism:** Explicitly denies truth value *now* for P, blocking the fatalist inference.
      *   **Modal Logic (K):** Compatible, but may require careful formulation of future operators to avoid validating fatalist arguments.
      *   **Diachronic Identity:** Preserves it. "P" on Monday is the same proposition as "P" evaluated on Tuesday.
      *   **Past/Future Asymmetry:** Strongly respects it. Past is fixed (truth-valued), pure future contingents are not.
      *   **Retrospective Truth:** Problematic. Must explain how "P" acquires truth value later without the Monday state changing. Often uses temporal qualification ("It *is* true *at Tuesday* that P *was* true *on Monday*") or assessment-relativity.
      *   *(Rejects Bivalence - a negotiable)*.

  2.  **Ockhamist (Branching Time, Bivalence, Actual Future):**
      *   **Avoids Fatalism:** Truth *now* is relative to the *actual future branch*. P is true *now* iff the actual future (a specific branch) contains the battle. Truth *now* does not imply *historical necessity now* because other branches were possible. Blocks the fatalist inference.
      *   **Modal Logic (K):** Fully compatible within a branching temporal logic framework (e.g., Ockhamist BT semantics).
      *   **Diachronic Identity:** Preserves it.
      *   **Past/Future Asymmetry:** Respects it via branching structure. Past is linear and fixed. Future branches represent openness *given* the fixed past.
      *   **Retrospective Truth:** Straightforward. Once the actual branch unfolds, we see which future-tense statements on it were true. "P was true on Monday" is true on Tuesday iff the Monday node lies on the branch that includes the Tuesday battle.
      *   *(Accepts Bivalence relative to the actual branch)*.

  3.  **Thin Red Line (TRL) (Branching Time + Privileged Branch, Bivalence):**
      *   **Avoids Fatalism:** Similar to Ockhamist. P is true *now* iff the *metaphysically privileged* future branch (the TRL) contains the battle. Truth *now* doesn't imply historical necessity *now* because other branches are metaphysically possible alternatives.
      *   **Modal Logic (K):** Compatible, though the status of non-TRL branches as "possible" can be debated.
      *   **Diachronic Identity:** Preserves it.
      *   **Past/Future Asymmetry:** Respects it via branching + the privileged TRL. Past is fixed on the TRL.
      *   **Retrospective Truth:** Straightforward. The TRL *is* the actual history. "P was true on Monday" is true iff Monday is on the TRL and the TRL contains the battle.
      *   *(Accepts Bivalence relative to the TRL. Controversial due to the metaphysical commitment to a privileged future branch - a negotiable preference)*.

  **Summary:** All three frameworks successfully satisfy the non-negotiable desiderata (Avoiding Fatalism, Modal Logic K compatibility, Diachronic Identity, Past/Future Asymmetry) *on their own terms*. The core differences lie in how they handle Bivalence (Aristotelian rejects it, Ockhamist/TRL accept it relative to a future) and the Grounding of Truth (Aristotelian denies present grounding for pure contingents, Ockhamist/TRL ground it in the actual/privileged future), leading to different accounts of Openness and Retrospective Truth. The tensions between Bivalence, Grounding, and robust Openness remain central points of contention.
