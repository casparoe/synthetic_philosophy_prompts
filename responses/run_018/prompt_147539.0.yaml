  ### Decision-Tree Classification Instrument: Progress in Philosophy

  **Instructions:** Answer each question based on your concrete judgments about philosophical progress. Choose the option that best reflects your commitments, without needing to reference specific philosophers or theories. The tree has seven terminal positions.

  ---

  #### Decision Tree

  1. **Q1 (Root): Does philosophy ever achieve meaningful resolution or settlement—even if only locally or temporarily—on any of its core problems?**  
     - **No** → Go to Q2  
     - **Yes** → Go to Q3  

  2. **Q2: When philosophy fails to settle problems, is this primarily because its questions are pseudo-problems that dissolve under scrutiny (like rejecting phlogiston in science), or because genuine problems perpetually recur without resolution?**  
     - **Dissolves under scrutiny** → **Leaf 4: Therapeutic dissolution of pseudo-problems**  
     - **Perpetually recur** → **Leaf 3: Perpetual recurrence with zero net advance**  

  3. **Q3: For philosophy to resolve problems, must it incorporate empirical input (e.g., from science or observation)?**  
     - **Yes** → Go to Q4  
     - **No** → Go to Q5  

  4. **Q4: Does empirical input enable philosophy to build cumulative, retained knowledge—akin to the natural sciences?**  
     - **Yes** → **Leaf 1: Cumulative progress analog to natural sciences**  
     - **No** → **Leaf 7: Empirically constrained but non-cumulative refinement**  

  5. **Q5: Can philosophical progress occur without consensus among experts?**  
     - **No** → **Leaf 2: Non-cumulative conceptual clarification**  
     - **Yes** → Go to Q6  

  6. **Q6: When experts persistently disagree despite shared information, does this signal philosophical maturity (e.g., irreducible pluralism) or immaturity (e.g., unresolved confusion)?**  
     - **Maturity** → Go to Q7  
     - **Immaturity** → **Leaf 5: Pluralist divergence measured by quality/articulation of frameworks**  

  7. **Q7: Does progress manifest through the increasing precision of disagreement—opposing positions becoming more rigorous, clashes more narrowly defined, and alternatives mapped—without convergence?**  
     - **Yes** → **Leaf 6: Progress via precision of disagreement**  
     - **No** → **Leaf 5: Pluralist divergence measured by quality/articulation of frameworks**  

  ---

  #### Terminal Leaves (Position Descriptions)
  1. **Cumulative progress analog to natural sciences**: Philosophy resolves problems empirically, building retained knowledge that compounds over time.  
  2. **Non-cumulative conceptual clarification**: Progress occurs through piecemeal clarity (e.g., refining definitions or assumptions), but without cumulative structure or dependence on empirical input. Requires consensus.  
  3. **Perpetual recurrence with zero net advance**: Core problems cycle unresolved across eras; debates refine but never settle. No progress.  
  4. **Therapeutic dissolution of pseudo-problems**: Progress occurs by exposing and abandoning incoherent questions (like "phlogiston" errors), not solving them.  
  5. **Pluralist divergence measured by quality/articulation of frameworks**: Progress means proliferating well-developed, irreconcilable viewpoints; disagreement signals maturity.  
  6. **Progress via increasing precision of disagreement**: Advancement occurs when debates become more rigorous, clashes more exact, and alternatives clearer—without convergence.  
  7. **Empirically constrained but non-cumulative refinement**: Philosophy requires empirical input but discards past insights (no compounding knowledge). *Unoccupied position* (see diagnosis below).  

  ---

  #### Scoring Key (Path-to-Leaf Mapping)
  | Path                                  | Leaf | Description                                                                 |
  |---------------------------------------|------|-----------------------------------------------------------------------------|
  | Q1=No → Q2=Dissolves                  | 4    | Therapeutic dissolution of pseudo-problems                                |
  | Q1=No → Q2=Recur                      | 3    | Perpetual recurrence with zero net advance                               |
  | Q1=Yes → Q3=Yes → Q4=Yes              | 1    | Cumulative progress analog to natural sciences                           |
  | Q1=Yes → Q3=Yes → Q4=No               | 7    | Empirically constrained but non-cumulative refinement                    |
  | Q1=Yes → Q3=No → Q5=No                | 2    | Non-cumulative conceptual clarification                                  |
  | Q1=Yes → Q3=No → Q5=Yes → Q6=Immaturity | 5    | Pluralist divergence (quality/articulation)                             |
  | Q1=Yes → Q3=No → Q5=Yes → Q6=Maturity → Q7=No | 5    | Pluralist divergence (quality/articulation)                             |
  | Q1=Yes → Q3=No → Q5=Yes → Q6=Maturity → Q7=Yes | 6    | Progress via precision of disagreement                                  |

  ---

  #### Diagnosis of Leaf 7 (Unoccupied Position)
  **Empirically constrained but non-cumulative refinement** holds that philosophy *requires* empirical input yet discards past insights without building cumulative knowledge. This position is **unstable**: if empirical input resolves problems (Q3=Yes), it naturally suggests retained solutions (contradicting non-cumulativity). Conversely, if solutions are discarded, empirical input seems ineffective or redundant. No prominent theory occupies this space because it incoherently couples empiricism with epistemic resetting.

  ---

  #### Flagged Undistinguished Pair
  **Leaf 5 vs. Leaf 6**: The tree fails to robustly distinguish pluralist divergence (Leaf 5) from precision-of-disagreement progress (Leaf 6). Both allow expert divergence without consensus, but Leaf 6 *requires* precision in clashes/alternatives as the hallmark of progress.  
  **Additional diagnostic needed**: *"Does unresolved expert disagreement primarily refine the *structure* of debate (e.g., narrowing points of clash) or enrich its *substance* (e.g., generating new frameworks)?"*  
  - **Refines structure** → Favors Leaf 6.  
  - **Enriches substance** → Favors Leaf 5.  

  Without this, paths ending at Q7=No default to Leaf 5, potentially misclassifying commitments to substantive enrichment without structural precision.  

  --- 

  **Design Notes**:  
  - All questions are answerable with general philosophical literacy (e.g., "empirical input" requires no specialized history).  
  - No named theories/philosophers or bibliographic demands.  
  - Trinary nodes (Q2, Q7) use concrete cases (e.g., "dissolution like phlogiston") to avoid labels.  
  - The tree isolates under-discussed Leaf 6 via Q7.
