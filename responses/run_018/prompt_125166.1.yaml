answer: |-
  ### Section 1: The slogan in context and why ambiguity undermines the dismissal  
  The phrase "history is written by the victors" is often deployed as a truism to imply that dominant narratives inevitably marginalise defeated perspectives. However, its ambiguity is problematic. If "written" means literal authorship, the claim is easily falsified (e.g., Confederate memoirs in the US Civil War). If it means interpretive dominance, it becomes substantive but not absolute. Your teacher’s dismissal assumes the slogan justifies ignoring defeated sources *in principle*, yet this relies on conflating distinct claims. Ambiguity here obscures critical nuance: if "history" exclusively reflects victors’ perspectives, studying defeated sources becomes *more* urgent to expose gaps. The dismissal thus collapses under its own vagueness, mistaking a heuristic warning for a methodological prohibition.

  ---

  ### Section 2: Menu of precise readings  

  1. **Literal authorship claim**:  
     *Thesis*: Victors physically write the primary textbooks or official histories.  
     *Status*: **Trivial (often false)**.  
     *Victory/Writing*: Military/political victory; direct authorship of narratives.  
     *Analysis*: Easily disproven (e.g., Tacitus wrote critically of victorious Rome). Surviving sources frequently include defeated voices (e.g., indigenous codices post-Spanish conquest).  

  2. **Archival control claim**:  
     *Thesis*: Victors selectively preserve/destroy evidence, shaping which primary sources survive.  
     *Status*: **Substantive (partially defensible)**.  
     *Victory/Writing*: Institutional power; curation of archives.  
     *Analysis*: Valid where victors seize records (e.g., Nazi documents captured by Allies). However, defeated groups often hide/preserve sources (e.g., Jewish ghetto archives), and accidents of preservation create counter-archives.  

  3. **Interpretive dominance claim**:  
     *Thesis*: Victors’ frameworks dictate how surviving evidence is contextualised and prioritised.  
     *Status*: **Substantive (widely defensible)**.  
     *Victory/Writing*: Cultural hegemony; hermeneutic authority.  
     *Analysis*: E.g., "Romanisation" narratives privileging imperial perspectives. This creates bias but *requires* studying defeated sources to challenge it, as gaps reveal hegemony’s mechanics.  

  4. **Strong constructivist claim**:  
     *Thesis*: Historical facts are constituted solely by victors’ narratives; no "reality" exists outside their discourse.  
     *Status*: **Contested or False (self-undermining)**.  
     *Victory/Writing*: Epistemic power; ontological control.  
     *Analysis*: If facts are constructed by power, the claim itself is merely a victor’s assertion. It invalidates *all* historical inquiry, including the victors’ account. Empirical evidence (e.g., archaeology) often contradicts pure constructivism.  

  ---

  ### Section 3: Which reading does the argumentative work?  
  - **Reading 1 (Literal)**: Does *not* support dismissal. Defeated groups often produce sources; studying them refutes the claim.  
  - **Reading 2 (Archival)**: Weakly supports dismissal if archives are fully controlled. **But**: Historians routinely work with fragmentary/oppositional archives (e.g., using Ottoman tax records to study subjugated peasants). Dismissal is premature.  
  - **Reading 3 (Interpretive)**: **Undermines dismissal decisively**. If victors control interpretation, defeated sources are essential to identify bias and reconstruct alternative perspectives (e.g., using Aztec codices to challenge Spanish chronicles).  
  - **Reading 4 (Constructivist)**: The *only* reading that might support dismissal—but it self-destructs. If no facts exist independently, studying victors’ sources is equally invalid. Consistency demands scepticism of *all* narratives, making counter-archives crucial.  

  **Conclusion**: Only a self-refuting radical constructivism (Reading 4) superficially "supports" dismissal. Readings 1–3 either contradict the dismissal or reveal why defeated sources are indispensable.  

  ---

  ### Section 4: ‘Structural silence’ and implications for counter-archives  
  *Structural silence* proposes that victors systematically exclude defeated perspectives by defining what counts as "significant" history (e.g., preserving state treaties but not oral traditions). This is **distinct from simple archival control** (Reading 2), as it involves epistemic violence: the victors’ criteria naturalise their worldview, rendering oppositional experiences "unarchivable".  

  *Does it support dismissal?* **No—it justifies counter-archival study**. Recognising structural silence:  
  - Exposes how "gaps" are not random but products of power.  
  - Motivates seeking sources *outside* formal archives (e.g., folk songs, private letters).  
  - Validates methodologies like subaltern studies, which treat silence as evidence of oppression.  
  Your teacher’s dismissal ironically *perpetuates* structural silence by accepting the victors’ archival logic.  

  ---

  ### Section 5: Bottom line for office hours  
  "Sir/Miss, I’ve reflected on your point about ‘history being written by the victors’. While it warns us about bias, treating it as a reason to ignore defeated sources is counterproductive. Only an extreme view—that facts are entirely constructed by winners—supports dismissal, but that view undermines *all* history. The more defensible readings (e.g., victors dominating interpretation or archives) actually *require* us to seek out silenced voices. Otherwise, we risk reinforcing the very power structures the slogan critiques. Could we discuss how examining defeated sources—despite challenges—reveals the mechanisms of historical bias?"
