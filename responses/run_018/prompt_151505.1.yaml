  ### Core Rule Structure and Hidden Twist
  Participants maximize point-based payoffs by pairing and selecting environments to boost their phenotype (P = G + E), where G is a fixed genetic value and E is an environmental modifier. In **Round One**, environments are assigned randomly, yielding high heritability (h² ≈ 0.7). In **Round Two**, participants choose partners and environments based on observed Round One phenotypes, unknowingly creating gene-environment covariance (Cov(G,E) > 0) that collapses heritability to ≈0.3 despite identical genes. The twist: **partner choice drives environmental selection, linking high-G individuals to high-E settings and inflating phenotypic variance via covariance**.

  ---

  ### Simulation Design  
  **Materials**:  
  - **Genotype cards (16)**: Fixed G values (pre-set integers: two each of 7, 8, 9, 10, 11, 12, 13, 14).  
  - **Environment cards (Round One, 16)**: E values (four each of −2, −1, 1, 2).  
  - **Whiteboard**: Records phenotypes and payoffs.  
  - **Payoff scheme**: Points = phenotype value (P). Higher P = higher payoff.  

  **Round One: Random Environments (15 min)**  
  1. **Assign cards**:  
     - Each participant gets one genotype card (secret) and one randomized environment card (secret).  
     - **Phenotype calculation**: P₁ = G + E.  
  2. **Report and record**:  
     - Participants disclose P₁ to facilitator, who posts IDs and P₁ on the whiteboard.  
  3. **Payoffs**: Points = P₁.  

  **Round Two: Strategic Pairing/Environment Choice (20 min)**  
  1. **Pair formation**:  
     - Participants have 5 min to choose one partner based on observed P₁ (e.g., high-P₁ individuals pair together).  
     - Mutual agreement required; facilitator registers pairs.  
  2. **Environment selection**:  
     - Each pair jointly selects one E value (−2, −1, 1, 2) for both members.  
     - **Incentive**: "Maximize your P₂ by choosing high E."  
  3. **Phenotype calculation**: P₂ = G (same as Round One) + E (chosen).  
  4. **Payoffs**: Points = P₂.  

  **Data Collection & Analysis (Facilitator-Led, 10 min)**  
  - **Round One**: Calculate h² = Var(G) / Var(P₁).  
  - **Round Two**: Calculate h² = Var(G) / [Var(G) + Var(E) + 2Cov(G,E)].  
  - **Post on whiteboard**: Show G, E, P, variances, and covariance for each round.  

  ---

  ### Debrief: Mapping to Philosophy of Biology (10 min)  
  1. **Variance Partitioning (Round One)**:  
     - Random E assignment ⇒ Cov(G,E) ≈ 0.  
     - Phenotypic variance (Var(P₁)) splits cleanly: Var(P₁) = Var(G) + Var(E).  
     - h² ≈ 0.7 reflects **population-level variance decomposition**—genes explain most differences.  
  2. **Causal Determination (Round Two)**:  
     - Strategic choices create Cov(G,E) > 0 (high-G/high-E correlation).  
     - **Individual outcomes** (P₂) are equally determined by G and E, but covariance inflates Var(P₂).  
     - h² drops to ≈0.3 because Cov(G,E) is misattributed to environmental variance, masking G’s role.  
  3. **Key insight**:  
     - h² is **relational**—dependent on population-environment interactions.  
     - Gene-environment covariance arises from **social sorting** (partner choice), not intrinsic biology.  

  ---

  ### Honest Misrepresentation  
  **What the simulation simplifies**:  
  - **No G×E interaction**: Real traits often have gene-environment interactions (non-additive effects), but we assume P = G + E for clarity.  

  ---

  ### Frank Prediction of First-Run Failure  
  **Pairing chaos**: Participants may prioritize friendships over phenotype-matching, weakening Cov(G,E). Mitigation: Emphasize payoff incentives ("high E = more points") and enforce tight time limits.  

  ---  
  The simulation’s rules and payoffs drive self-discovery: participants see heritability plummet when their actions link genes to environments, proving h²’s context-dependence without facilitator exposition.
