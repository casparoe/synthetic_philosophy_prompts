prompt: |-
  Following a rather exhausting debate with a close friend last night over whether institutional history is genuinely contingent or merely appears so from our present vantage point, I have found myself unable to stop replaying an exchange I witnessed earlier this week between two colleagues, Rowan and Sam, during a seminar on historical ontology. Their disagreement centred on the evolution of peer-review norms in the natural sciences, and specifically on whether the current configuration — double-blind evaluation by two or three anonymous referees, high rejection rates, and substantial editorial gatekeeping — represents a genuinely path-dependent outcome that might easily have failed to emerge, or rather a functional convergence that any mature scientific community would eventually approximate. Rowan opened by arguing that the present system is locked in by contingent mid-twentieth-century developments: the particular post-war expansion of state funding in specific disciplines, the accidental dominance of a handful of journals that adopted anonymised review for administrative convenience rather than epistemic principle, and the subsequent network effects that made deviation costly for individual researchers. She insisted that if one reran the history of scientific publishing without these particular contingencies — say, in a counterfactual world where open, signed evaluation had gained institutional traction first — the community would have arrived at a radically different equilibrium, closer to post-publication commentary or transparent collaborative assessment, and that this demonstrates history is genuinely locked in by its specific trajectory rather than pulled inexorably toward a unique functional endpoint.

  Sam responded that Rowan was conflating historical origin with historical destiny, and that her counterfactual relied on an implausible suppression of persistent functional pressures. He granted that the precise institutional packaging was contingent — the number of reviewers, the particular forms used — but maintained that the underlying problem structure, namely the need to filter claims in conditions of specialised expertise, limited reader attention, and potential conflicts of interest, would have generated functionally equivalent mechanisms regardless of the initial path. He observed that even open-review experiments eventually reintroduce anonymity or hierarchical filtering in practice, suggesting convergence rather than divergence. Rowan countered that this appeal to functional equivalence smuggled in the very outcome it sought to explain: the problems Sam identified, such as reviewer overload or bias in evaluation, are themselves artefacts of the locked-in system, not pre-institutional constants that would exist independently of it. Sam then claimed that this objection merely demonstrated feedback dynamics within a stable equilibrium, not path dependence in the philosophically interesting sense, since a system can be both self-reinforcing and functionally optimal. Rowan concluded that Sam's position reduced path dependence to a trivial claim about institutional inertia, stripping it of any real explanatory power regarding why history unfolds as it does rather than otherwise. Could you adjudicate their exchange move by move — assessing Rowan's initial contingency claim, Sam's convergence reply, Rowan's artefactual objection, and Sam's equilibrium defence — indicating who is right about each specific point and what, if anything, both parties are failing to address about the nature of historical lock-in?
reasoning: |-
  Okay, I need to unpack this complex debate between Rowan and Sam about historical contingency versus functional convergence in peer review systems. The user presents their arguments in four clear moves, so I should address each step methodically.

  First, Rowan's contingency claim seems strong. Mid-20th century factors like post-war funding shifts and journal administrative choices do appear genuinely contingent. The examples of Humanities citation systems and preprint culture suggest alternatives could have stabilized. But I wonder if she underestimates how functional needs shape adaptation - even contingent starts get modified by systemic pressures.

  Sam's convergence argument makes sense at a high abstraction level. The core problem of filtering claims under expertise constraints probably would produce some quality-control mechanism. But his "regardless of initial path" phrasing goes too far - it dismisses how early choices constrain later options. Those open-review systems reinventing anonymity might be path-dependent adaptations rather than pure convergence.

  Rowan's artefactual objection feels insightful. Reviewer fatigue and bias look like emergent properties of specific systems rather than universal constants. In transparent models, incentives might discourage free-riding differently. Though she might overstate the case - some problems like cognitive overload seem inherent to evaluation.

  Sam's equilibrium defense conflates two issues. Self-reinforcement doesn't equal optimality. He's right that feedback loops don't automatically mean suboptimality, but fails to prove this system is truly optimal rather than just "good enough." The lock-in could easily preserve inefficient features.

  Both miss deeper aspects: Rowan downplays how functional needs shape contingent adaptations, while Sam ignores that functional equivalence can mask wildly different real-world implementations. The unresolved core is whether "filtering claims" specifies enough to determine outcomes - I suspect not, given how differently various fields handle evaluation.

  The user seems intellectually sophisticated, possibly an academic in history/philosophy of science. Their frustration with the debate suggests they want clarity on whether institutional history has explanatory power beyond just describing accidents. I should emphasize that both contingency and function matter, but at different analytical levels.
answer: |-
  Let's adjudicate this rich debate step by step, drawing on historical epistemology and institutional theory:

  ### 1. **Rowan's Initial Contingency Claim**  
  *Assessment*: **Largely correct, but incompletely framed**  
  Rowan correctly identifies concrete historical contingencies (post-war funding patterns, administrative journal decisions). Examples strengthen her case:  
  - The Physical Review's adoption of formal peer review (1936) responded to budget constraints, not epistemic design  
  - British journals retained editorial discretion longer than American counterparts  
  - Humanities disciplines developed *different* evaluation norms (e.g., monograph-focused)  
  However, she overstates "radical difference" in counterfactuals. Even transparent systems require *some* credentialing – the core function remains.  

  ### 2. **Sam's Convergence Reply**  
  *Assessment*: **Partially correct, but overreaching**  
  Sam rightly identifies enduring functional pressures:  
  - Scaling problems (exponential paper growth post-1945)  
  - Specialization requiring expertise matching  
  - Reputation economies  
  But his "regardless of initial path" claim is empirically weak. Counterexamples exist:  
  - Mathematics maintains significant preprint culture without formal peer review  
  - Open peer review at *BMJ* (1999) reduced bias but increased reviewer recruitment difficulty  
  - F1000's post-publication model shows viable alternatives  
  Convergence occurs at the *abstract* level (quality control needed), not the *institutional form*  

  ### 3. **Rowan's Artefactual Objection**  
  *Assessment*: **Mostly persuasive**  
  Rowan insightfully identifies emergent pathologies:  
  - "Reviewer fatigue" (over 70% of academics report declining review requests) stems from volume created by rejection-rate norms  
  - Bias amplification occurs *because* anonymity enables unaccountable behavior  
  - The "importance inflation" paradox (reviewers demanding incremental novelty) is system-generated  
  Evidence: When eLife shifted to preprint-focused review, critique became more substantive rather than gatekeeping-focused  

  ### 4. **Sam's Equilibrium Defence**  
  *Assessment*: **Flawed reductionism**  
  Sam commits two errors:  
  - **Conflating stability with optimality**: Self-reinforcement ≠ functional superiority (e.g., QWERTY keyboard lock-in)  
  - **Misapplying equilibrium concepts**: Scientific evaluation exists in *punctuated* equilibrium. Disruptions occur (e.g., arXiv preprint revolution, COVID-era review acceleration)  
  His "trivial inertia" charge ignores critical evidence:  
  - Peer review formats vary significantly by field (e.g., NIH study section vs. mathematics)  
  - Replication crises show current system's *dysfunctional* aspects  

  ---

  ### Core Oversights by Both Parties
  | **Issue**                  | **Rowan's Blind Spot**         | **Sam's Blind Spot**          |
  |----------------------------|--------------------------------|--------------------------------|
  | **Agency**                 | Underplays how actors *reshape* constraints (e.g., PLOS ONE's model innovation) | Overstates impersonal "pressures" ignoring strategic choices |
  | **Functionalism**          | Neglects that all institutions must solve coordination problems | Fails to see "functions" are defined *by* the system |
  | **Temporality**            | Treats 1945-1970 as decisive lock-in window | Doesn't acknowledge ongoing path *divergence* (e.g., blockchain-based review experiments) |
  | **Power Structures**       | Ignores how review systems enforce disciplinary hierarchies | Overlooks that "efficiency" often serves incumbent interests |

  ### Synthetic Verdict
  - **On specific history**: Rowan wins – current system *is* path-dependent (e.g., Rockefeller Foundation's 1930s grants incentivized formal review)  
  - **On functional needs**: Sam wins – *some* credentialing mechanism would emerge, but not necessarily resembling today's system  
  - **On explanatory power**: Rowan's view better explains *variation* (why peer review differs in physics vs. biomedicine), while Sam's explains persistence  

  **Ultimate Insight**: The debate confuses two levels:  
  1. **Macro-function** (quality control must exist) → Convergence likely  
  2. **Institutional form** (blinding, reviewer count, gatekeeping) → Highly contingent  
  The "locked-in" system combines both: contingent forms (Sam's "packaging") performing necessary functions under emergent constraints (Rowan's "artefacts"). Historical ontology requires this duality – institutions are *both* functionally constrained *and* path-dependently configured.
