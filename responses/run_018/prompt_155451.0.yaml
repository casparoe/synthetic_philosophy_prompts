  ### Decision-Tree Taxonomy of Historiographical Stances  
  **Purpose**: To sort positions on whether "Middle Ages," "Renaissance," and "Scientific Revolution" name real structural breaks or are retrospective impositions. Answer each binary question (Yes/No) to navigate the tree.  

  ---

  #### **Question 1 (Root)**  
  *If a historian in Ming-dynasty China (c. 1600) used Latin Europe's internal institutional criteria (e.g., university curricula, metallurgy, patronage) to periodize its history, would she recognize a distinct "Renaissance" separate from prior centuries?*  
  - **Yes** → Proceed to **Question 4**.  
  - **No** → Proceed to **Question 4**.  

  ---

  #### **Question 4 (Cross-Cultural Applicability)**  
  *Do "Middle Ages," "Renaissance," and "Scientific Revolution" apply approximately to non-Latin-Christian civilizations (e.g., Islamic, Chinese, South Asian histories)?*  
  - **Yes** → **Leaf (a) Strong Universal Essentialism**.  
  - **No** → Proceed based on **Question 1**:  
    - If **Question 1 = Yes** → **Leaf (b) Weak Regional Essentialism**.  
    - If **Question 1 = No** → Proceed to **Question 5**.  

  ---

  #### **Question 5 (Teleological Load)**  
  *Does naming an era "Renaissance" or "Scientific Revolution" necessarily imply normative progress or recovery?*  
  - **Yes** → Proceed to **Question 2**.  
  - **No** → **Leaf (c) Eurocentric Constructivism**.  

  ---

  #### **Question 2 (Scientific Revolution Break)**  
  *Is the "Scientific Revolution" break defined by a specific metaphysical commitment (e.g., mechanism, mathematization of nature), excluding figures like Paracelsus/alchemists?*  
  - **Yes** → **Leaf (d) Global Comparative Constructivism**.  
  - **No** → Proceed to **Question 3**.  

  ---

  #### **Question 3 (Middle Ages Definition)**  
  *Is the "Middle Ages" bounded primarily by the cultural dominance of Latin Christianity (as opposed to feudal institutions or technological/demographic stagnation)?*  
  - **Yes** → **Leaf (d) Global Comparative Constructivism**.  
  - **No** → **Leaf (e) Deflationary Continuity**.  

  ---

  ### Leaf Positions  
  1. **(a) Strong Universal Essentialism**:  
     - **Answers**: Q1=Yes, Q4=Yes.  
     - **Description**: Periods are discovered, natural kinds with cross-cultural analogues (e.g., "Renaissance" breaks are universal structures visible to any observer using institutional criteria).  
     - **Ontology**: Real structural breaks independent of narrative.  

  2. **(b) Weak Regional Essentialism**:  
     - **Answers**: Q1=Yes, Q4=No.  
     - **Description**: Periods are real but bounded to Latin Europe, defined by specific institutions (e.g., "Renaissance" is an objective break in Europe but lacks non-European analogues).  
     - **Ontology**: Real breaks, regionally confined.  

  3. **(c) Eurocentric Constructivism**:  
     - **Answers**: Q1=No, Q4=No, Q5=No.  
     - **Description**: Periods are useful pedagogical fictions for Europe but should not be applied elsewhere; terms need not imply progress.  
     - **Ontology**: Retrospective impositions, locally functional.  

  4. **(d) Global Comparative Constructivism**:  
     - **Answers**:  
       - *Path 1*: Q1=No, Q4=No, Q5=Yes, Q2=Yes.  
       - *Path 2*: Q1=No, Q4=No, Q5=Yes, Q2=No, Q3=Yes.  
     - **Description**: Tripartite schemes impose false unity globally and should be abandoned (e.g., "Scientific Revolution" is a teleological imposition obscuring heterogeneity).  
     - **Ontology**: Harmful narrative impositions.  

  5. **(e) Deflationary Continuity**:  
     - **Answers**: Q1=No, Q4=No, Q5=Yes, Q2=No, Q3=No.  
     - **Description**: Gradual change dominates; no breaks warrant capitalized names (e.g., "Middle Ages" has no necessary core; "Scientific Revolution" exaggerates institutional shifts).  
     - **Ontology**: No significant breaks, only continuity.  

  6. **(f) Pragmatic Pluralism**:  
     - **Answers**: Q1=No, Q4=Yes.  
     - **Description**: Periods are purpose-relative tools, valid for some inquiries (e.g., cross-cultural comparison) but invalid for others, with no single ontology.  
     - **Ontology**: Contextual heuristics, neither real nor fictional *per se*.  

  ---

  ### Unoccupied Combinations & Diagnoses  
  All 32 logical combinations are occupied. No empty cells exist.  

  ---

  ### Indistinguishable Pairs & Remediation  
  The tree **cannot separate** the following pairs due to identical answers to the five questions, despite ontological differences:  

  1. **Weak Regional Essentialism (b) vs. Pragmatic Pluralism (f) when Q1=Yes, Q4=No**:  
     - Both accept Europe-bound institutional breaks but differ on ontology:  
       - (b) believes periods are *real*.  
       - (f) treats them as *heuristic tools*.  
     - **Remediation**: Add a sixth question:  
       *"Do 'Renaissance' or 'Scientific Revolution' name objective structural breaks, or are they context-dependent tools?"*  
       - Objective breaks → Weak Regional Essentialism (b).  
       - Context-dependent tools → Pragmatic Pluralism (f).  

  2. **Strong Universal Essentialism (a) vs. Pragmatic Pluralism (f) when Q1=Yes, Q4=Yes**:  
     - Both accept cross-culturally visible breaks but differ on ontology:  
       - (a) believes periods are *universal natural kinds*.  
       - (f) uses them as *contingent frameworks*.  
     - **Remediation**: Same sixth question as above.  

  ---

  ### Usage  
  Navigate the tree by answering questions sequentially. Your terminal leaf reveals your stance. No external sources or labels are required.
