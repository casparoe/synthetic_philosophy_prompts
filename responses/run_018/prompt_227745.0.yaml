prompt: |-
  You are a philosopher of social science who is also genuinely literate in contemporary machine learning research, the kind of person who can move between a seminar on common knowledge and a lab meeting about emergent communication without either side noticing the join. Think carefully and work step by step; before composing your final answer, privately sketch an inventory of the load-bearing concepts on each side so that nothing gets lost by omission rather than by argument.

  I lead a small research group working on multi-agent reinforcement learning, and I want David Lewis's account of convention — the one built from coordination problems, arbitrary alternative equilibria, salience and precedent, and higher-order expectations — restated in the vocabulary my group actually works in: joint policies, Nash and correlated equilibria, equilibrium selection, learning dynamics, inductive biases, decentralised training with centralised critics, and iterated learning across generations of agents. I have read Lewis, but years ago; I have no need of a summary of him in his own terms. What I need is the translation itself, done properly.

  Take his central conditions one at a time — the coordination-problem setup, the requirement that there be more than one eligible regularity so that whichever one prevails is in some sense arbitrary, the role of salience and precedent in fixing which equilibrium gets selected, and the higher-order expectations condition, where everyone conforms, everyone expects everyone else to conform, everyone expects that expectation, and so on. For each condition, give me its best counterpart in my vocabulary, and grade the translation: clean, distorted (say exactly what had to be bent), or no counterpart at all.

  Two case-based tests from our own work should anchor this. First, our agents reliably converge to a stable signalling convention even though, so far as we can tell, nothing in the system represents other agents' expectations at any depth — so tell me whether Lewis's higher-order condition has any counterpart in finite-depth belief hierarchies, and whether his account breaks, or merely weakens, if the expectations are only approximate. Second, we routinely observe conventions persisting long after the environment has shifted so that a strictly better equilibrium is available but never reached — tell me whether lock-in of that sort is something Lewis's framework predicts, merely permits, or cannot see.

  Then the residue report, which is the part I care most about: what in Lewis has no expression in my vocabulary, and for each such item, give me your judgement on whether that is a genuine blind spot of the learning-theoretic frame — something we would need new formalism to capture — or a sign that the original condition was doing less work than Lewis supposed. Throughout, do not smuggle my framework's assumptions into the translation and call the result faithful; where the two vocabularies disagree about what even counts as an explanation, say so openly.

  Please state how confident you are in each of your translation judgements, and finish by singling out the single claim in your answer you are least sure of, explaining why. Use British English throughout.
