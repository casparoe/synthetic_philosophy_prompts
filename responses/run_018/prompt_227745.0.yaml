answer: |-
  Below is a systematic translation of Lewis's conditions into your multi-agent reinforcement learning (MARL) vocabulary, graded for fidelity. Case-based tests and residue report follow. Confidence levels (High/Medium/Low) reflect theoretical alignment and empirical observability in MARL systems. British English maintained throughout.

  ---

  ### **1. Coordination Problem Setup**  
  **Lewis:** Conventions solve recurrent coordination problems with interdependent payoffs.  
  **MARL Translation:** Joint policies in symmetric/common-payoff environments where agents must coordinate on actions to achieve Pareto-efficient outcomes (e.g., meeting points, signalling protocols).  
  **Grade:** **Clean** (direct mapping to symmetric matrix games or cooperative MARL with alignment incentives).  
  **Confidence:** High (core game-theoretic structure is identical).  

  ---

  ### **2. Multiple Eligible Equilibria (Arbitrariness)**  
  **Lewis:** At least two strict Nash equilibria exist, making the convention arbitrary (e.g., driving left/right).  
  **MARL Translation:** Multiple Pareto-optimal Nash/correlated equilibria in joint policy space, where any one maximises reward but no intrinsic superiority exists (e.g., two equally efficient communication protocols).  
  **Grade:** **Clean** (equilibrium selection problem in symmetric games).  
  **Confidence:** High (abundant in MARL, e.g., emergent languages with synonymy).  

  ---

  ### **3. Salience and Precedent in Equilibrium Selection**  
  **Lewis:** Focal points (salience) or historical precedent break symmetry to select one equilibrium.  
  **MARL Translation:**  
  - *Salience:* Inductive biases (e.g., neural network initialisation, architectural simplicity) favouring certain policies.  
  - *Precedent:* Learning dynamics (e.g., Q-learning updates) or centralised critics (e.g., MADDPG) correlating agents' policies toward an equilibrium observed during training.  
  **Grade:** **Distorted**.  
  - *Distortion:* Lewisian salience often relies on exogenous perceptual/cultural cues (e.g., a red flag being "obvious"). MARL salience is endogenous to the learning system (e.g., a policy with lower entropy). Precedent in MARL is captured by policy convergence via reward feedback, not historical narrative.  
  **Confidence:** Medium (dynamics are observable, but "focality" lacks Lewis’s phenomenological dimension).  

  ---

  ### **4. Higher-Order Expectations**  
  **Lewis:** Agents conform, expect others to conform, expect others to expect conformity, ad infinitum (common knowledge of expectations).  
  **MARL Translation:** Agents’ policies encode mutual best-responses under *approximate* belief hierarchies. In decentralised training:  
  - *Depth-1:* Policy $\pi_i$ responds to empirical distribution of others’ actions.  
  - *Depth-2:* $\pi_i$ responds to predictions of others’ responses (e.g., via opponent modelling).  
  - *Finite Depth:* Emerges implicitly via temporal difference learning or centralised critics (e.g., COMA) that shape policies to anticipate others’ convergence.  
  **Grade:** **Distorted**.  
  - *Distortion:* Lewis requires infinite recursion for true common knowledge. MARL agents exhibit *bounded* mutual modelling (finite-depth beliefs). Expectations are stochastic (learned from trajectories), not propositional.  
  **Confidence:** Medium (supported by emergent coordination, but depth is shallow and implicit).  

  ---

  ### **Case-Based Tests**  
  **Test 1 (Emergent Signalling without Deep Beliefs):**  
  - Lewis’s higher-order condition **weakens but does not break**. MARL agents’ mutual policy convergence (via TD learning or centralised critics) functionally approximates depth-2 expectations ("I expect you to play X because it’s optimal given your expectation of me"). The convention holds with *approximate, behaviourally learned* expectations.  
  - **Verdict:** Lewis’s account permits this. Convergence relies on policy updates reinforcing successful actions, not infinite recursion.  

  **Test 2 (Suboptimal Lock-In):**  
  - Lewis **explicitly predicts** lock-in. Conventions are Nash equilibria sustained by precedent. Even if a superior equilibrium exists, deviation is punished by coordination failure (e.g., miscommunication). MARL learning dynamics (e.g., policy inertia in on-policy algorithms) compound this.  
  - **Verdict:** Core to Lewis’s framework—conventions persist due to mutual expectations, not efficiency.  

  ---

  ### **Residue Report: What MARL Cannot Express**  
  **1. Arbitrariness as a Criterion**  
  - *Lewis Element:* Conventions must be *arbitrary* (objectively replaceable by alternatives).  
  - *MARL Gap:* MARL identifies multiple equilibria but lacks a formalism to judge "arbitrariness." Optimality metrics (reward) dominate, obscuring functional equivalence.  
  - **Verdict:** **Blind spot**. MARL needs richer equilibrium equivalence classes (e.g., topological similarity of policies) to capture this norm.  

  **2. Normative Force of Precedent**  
  - *Lewis Element:* Precedent provides a *reason* to conform ("we do this because we always have").  
  - *MARL Gap:* Policies encode behavioural regularities but not justifications. Learning dynamics reinforce high-reward actions, not historical obligation.  
  - **Verdict:** **Blind spot**. This requires formalising "conformity as rational commitment," absent in reward maximisation.  

  **3. Common Knowledge as a Distinct Mechanism**  
  - *Lewis Element:* Infinite regress of expectations sustains conventions independently of payoff structures.  
  - *MARL Gap:* MARL reduces expectations to correlated policies (e.g., via centralised critics). No machinery for recursive belief hierarchies beyond opponent modelling.  
  - **Verdict:** **Lewis overclaimed**. In practice, shallow beliefs suffice for convergence (per Test 1). The "infinite regress" is a philosophical idealisation.  

  ---

  ### **Confidence and Uncertainty**  
  **Least Confident Claim:**  
  > *"MARL’s mutual policy convergence approximates Lewis’s higher-order expectations."*  
  **Why:** Lewisian expectations are cognitive and recursive; MARL’s are behavioural and emergent. The translation risks conflating *beliefs* with *learned responses*. While policies encode implicit expectations (e.g., via action-value functions), this is more Skinnerian than game-theoretic. I remain uncertain whether this is a faithful translation or a pragmatic reduction.  

  **Overall Confidence Spectrum:**  
  - Coordination setup: **High**  
  - Multiple equilibria: **High**  
  - Salience/precedent: **Medium**  
  - Higher-order expectations: **Low-Medium**  
  - Residue judgements: **Medium** (grounded in framework incompatibilities)  

  ---  
  **Final Note:** Lewis’s framework is prescriptive about *what conventions are*; MARL is descriptive about *how they emerge*. The largest gap is normative: MARL explains convention-like behaviour via optimisation, but cannot (yet) model conventions as socially sustained commitments. New formalisms for "equivalence under functional substitutability" and "conformity as a reason for action" would bridge this.
