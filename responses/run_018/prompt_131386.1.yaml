arks. Also, if you can, make sure the grading rubric seperates an A answer from a B by naming the exact conceptual moves each has to contain, not just general quality. I was discussing this with my friends over coffee and one of them said it sounds like science fiction, but I think it gets at something real about how we choose theories.
