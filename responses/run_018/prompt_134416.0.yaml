prompt: |-
  For my graduate seminar on distributive justice, I am constructing a diagnostic taxonomy—structured as a branching decision tree—to classify normative positions on inheritance taxation, dynastic wealth, and fair equality of opportunity. The instrument should sort views by the concrete judgments they make about cases and mechanisms, not by the political or philosophical labels their proponents prefer. Build the tree from the logical space of commitments, placing named positions only at the leaves, and phrase every branch node as a direct question a student could answer without already knowing which position it produces.

  The root question should be: does the intergenerational transmission of substantial economic advantage, considered as a social practice, constitute a structural impediment to fair equality of opportunity, or is it a permissible outcome of individual liberty?

  From there, split the tree using these distinctions and case nodes. First, distinguish two mechanisms of dynastic transmission that must be treated separately: capital-lock inheritance (the direct bequest of liquid assets, property, and equity) and status-lock inheritance (the transmission of social networks, exclusive educational access, and institutional gatekeeping advantages that are structurally equivalent to capital but not legally bequeathed). The taxonomy should ask whether each mechanism, considered in isolation, violates equality of opportunity.

  Then include these branch points:
  1. Should the baseline for assessing opportunity be evaluated within a single life-course (intragenerational equality) or tracked across family lines over successive generations (intergenerational equality)?
  2. Consider a hypothetical in which capital-lock inheritance is fully abolished through taxation, but status-lock inheritance remains entirely intact. Would this outcome satisfy the demands of justice? This node should expose whether a view targets wealth per se or the structural advantages it produces.
  3. Is the primary wrong of dynastic wealth that it violates moral arbitrariness regarding circumstances of birth (a luck-egalitarian concern), or that it distorts democratic political equality by concentrating influence?
  4. A concrete institutional case: a founder liquidates a business, pays all statutory taxes, and endows a private foundation that provides exclusive internships and mentorship exclusively to the descendants and peers of her family network. Does this arrangement count as an instance of objectionable dynastic wealth?

  The leaves must include at least the following: strict abolitionist (all substantial intergenerational economic transmission is unjust); meritocratic reset (inheritance is permissible only if it does not alter competitive positions in social cooperation); capital-only restrictionist (capital-lock must be eliminated, but status-lock falls outside the scope of state remedy); democratic-egalitarian (inheritance is objectionable only when it translates into disproportionate political influence); and dynastic libertarian (no restriction on either form of transmission is justified).

  Identify any combination of answers that yields an unoccupied leaf—such as a view that condemns capital-lock but endorses status-lock on democratic-egalitarian grounds—and briefly diagnose whether the gap stems from incoherence, practical unattractiveness, or mere lack of exploration.

  Every node must be a concrete claim or case judgment; do not organize branches by citing named theorists. Present the tree so that a student answers the questions first, then sees which position the pattern corresponds to. At each leaf, provide a one-sentence statement of that position’s most awkward or counterintuitive commitment.

  Finally, conclude with a brief methodological reflection: state explicitly what argument or empirical finding would change your classification—such as evidence that market mechanisms fully convert status-lock advantages into capital-lock advantages, or proof that democratic equality and fair opportunity necessarily diverge in all institutional settings—and identify the specific point in your reasoning where the separation between two leaves is least secure.
reasoning: |-
  Hmm, this is a sophisticated request for a graduate-level distributive justice tool. The user wants a diagnostic taxonomy that classifies normative positions on inheritance taxation and dynastic wealth without relying on political labels. They're clearly deeply engaged with the philosophical nuances here - the level of specificity in their branch points suggests they've already done significant groundwork on luck egalitarianism vs. democratic equality frameworks.

  I notice they're particularly concerned about distinguishing between capital-lock (direct assets) and status-lock (social/cultural capital) transmission mechanisms. That's smart - it prevents the oversimplification common in policy debates. Their inclusion of the private foundation hypothetical shows they want students to confront real-world evasion tactics.

  The methodological caveat at the end is crucial. They're not just after a static classification but want students to understand where the framework might collapse under pressure. I should flag that status-lock/capital-lock separation as particularly vulnerable - if Bourdieu is right about convertibility, that whole branch becomes shaky.

  For the "awkward commitment" requirement: I'll make sure each leaf has a genuine tension. Like that meritocratic reset position where "merit" becomes almost tautological - if we reset competitive positions completely, doesn't that erase the very accomplishments we wanted to reward? That should spark good seminar debates.

  The unoccupied leaf they mentioned (democratic-egalitarian condemning capital but endorsing status) is fascinating. I'll diagnose it as incoherent because political influence flows through status networks. Unless they imagine some purely financial aristocracy with zero social capital - which seems empirically bankrupt.

  Better include that "mere lack of exploration" possibility though. Maybe some communitarians could theoretically defend status-lock as preserving cultural continuity? But they'd still need to answer the political equality challenge.
answer: |-
  Here is the diagnostic taxonomy structured as a branching decision tree. Students answer concrete questions to arrive at a classification, revealing normative positions only at the terminal leaves.

  ---

  **ROOT QUESTION:**  
  Does the intergenerational transmission of substantial economic advantage (as a social practice) constitute a structural impediment to fair equality of opportunity, or is it a permissible outcome of individual liberty?  
  → **Branch A:** *Yes, it impedes fair equality of opportunity.*  
  → **Branch B:** *No, it is permissible under liberty.*  

  ---

  ### **BRANCH A** (Impedes Opportunity)  
  **Question 1:** Should the baseline for fair opportunity be assessed *within a single generation* (intragenerational) or *tracked across family lines over time* (intergenerational)?  
  → **A1:** Intragenerational equality suffices.  
  → **A2:** Intergenerational equality is required.  

  **Question 2:** Consider a world where *capital-lock inheritance* (direct bequests of assets/property) is abolished via taxation, but *status-lock inheritance* (social networks, elite education access) remains intact. Does this satisfy justice?  
  → **A1a:** *Yes, justice is satisfied.*  
  → **A1b:** *No, it does not.*  
  → **A2a:** *Yes, justice is satisfied.*  
  → **A2b:** *No, it does not.*  

  **Question 3:** Is the core injustice of dynastic wealth that it:  
  (i) Rewards *morally arbitrary birth circumstances* (luck-egalitarian), or  
  (ii) *Distorts democratic equality* by concentrating political influence?  
  *(Applied to both mechanisms)*  
  → **Capital-lock mechanism:**  
  - Violates moral arbitrariness? (Yes/No)  
  - Distorts democracy? (Yes/No)  
  → **Status-lock mechanism:**  
  - Violates moral arbitrariness? (Yes/No)  
  - Distorts democracy? (Yes/No)  

  **Question 4:** A founder liquidates a business, pays all taxes, and endows a private foundation giving exclusive internships/mentorship *only* to descendants and their peers. Is this objectionable dynastic wealth?  
  → **Yes** / **No**  

  ---

  ### **BRANCH B** (Permissible Liberty)  
  **Question 1:** Does *any* form of dynastic transmission (capital-lock or status-lock) warrant restriction to protect liberty itself?  
  → **B1:** *No, all forms are protected.*  
  → **B2:** *Yes, if it undermines others’ liberty.*  

  ---

  ### **LEAVES (Normative Positions)**  
  1. **Strict Abolitionist**  
     - Path: A → A2 → A2b → (All "Yes" to Q3 for both mechanisms) → "Yes" to Q4.  
     - *Awkward commitment:* Must reject all family-funded elite education (e.g., private tutoring) as unjust.  

  2. **Meritocratic Reset**  
     - Path: A → A1 → A1a → (Capital-lock: "Yes" to moral arbitrariness, "No" to democracy; Status-lock: "No" to both) → "No" to Q4.  
     - *Awkward commitment:* Permits status-lock advantages so long as they don’t alter *initial* competitive conditions (e.g., legacy admissions are acceptable if jobs are merit-based).  

  3. **Capital-Only Restrictionist**  
     - Path: A → A1 → A1a → (Capital-lock: "Yes" to moral arbitrariness; Status-lock: "No" to both) → "No" to Q4.  
     - *Awkward commitment:* Allows billionaire dynasties to convert wealth into untaxed social capital (e.g., exclusive networks) without injustice.  

  4. **Democratic-Egalitarian**  
     - Path: A → A2 → A2a → (Capital-lock: "No" to moral arbitrariness, "Yes" to democracy; Status-lock: "No" to moral arbitrariness, "Yes" to democracy) → "Yes" to Q4.  
     - *Awkward commitment:* Tolerates extreme economic inequality if it *never* translates to political influence (e.g., billionaires with no lobbying power).  

  5. **Dynastic Libertarian**  
     - Path: B → B1.  
     - *Awkward commitment:* Accepts permanent aristocracies so long as initial wealth was justly acquired.  

  ---

  ### **Unoccupied Leaf & Diagnosis**  
  - **Hypothetical Position:** Condemns capital-lock but endorses status-lock on democratic-egalitarian grounds.  
    - Path: A → A2 → A2a → (Capital-lock: "No" to moral arbitrariness, **"Yes" to democracy**; Status-lock: "No" to moral arbitrariness, **"No" to democracy**) → "No" to Q4.  
  - **Diagnosis:** **Incoherent**. If status-lock (e.g., elite networks) concentrates undemocratic influence, exempting it contradicts the democratic-egalitarian core. No theorist endorses this, as status-lock is a *primary vector* for political distortion.  

  ---

  ### **Methodological Reflection**  
  1. **Falsifying Conditions:**  
     - If empirical proof showed status-lock advantages *always* convert to capital-lock advantages (e.g., networks guarantee investment returns), the capital/status distinction collapses. This erases the **Capital-Only Restrictionist** leaf.  
     - If democratic equality and fair opportunity *necessarily diverge* (e.g., political influence requires inequality of opportunity), the **Democratic-Egalitarian** and **Meritocratic Reset** positions become incompatible.  

  2. **Least Secure Separation:**  
     The split between **Strict Abolitionist** (A2b) and **Democratic-Egalitarian** (A2a) hinges on whether eliminating *capital-lock alone* sufficiently protects democracy (Q2). If status-lock is shown to be democratically innocuous without capital, A2a gains plausibility; if not, A2b dominates. Current evidence (e.g., studies on elite social capital) favors A2b, but this is contingent.  

  ---  
  This taxonomy forces students to confront tradeoffs (liberty/equality, capital/status) and isolates commitments from labels. By anchoring branches in cases, it reveals how abstract principles generate concrete judgments.
