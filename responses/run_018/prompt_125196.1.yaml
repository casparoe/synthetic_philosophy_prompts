  I need to structure this carefully since the participants have no formal philosophy training but deal with real-world debates about digital restoration, forgery, and object identity. The seminar is only ninety minutes, so I must be efficient and targeted in my approach.

  The user specifies five key components: dependency order for concepts, a carrying example from their world, misconceptions to address, a check for understanding, and exclusions of philosophical machinery. I should take a committed stance throughout rather than offering alternatives.

  For dependency order, I think I need to establish:
  First, what an intuition pump is at surface level - a story to elicit intuition.
  Second, the crucial distinction between narrative coherence (does the story make sense?) and modal legitimacy (is this scenario genuinely possible?).
  Third, modal concepts like conceivability versus possibility.
  Fourth, how identity conditions are often smuggled in.

  This sequence is essential because without understanding that a good story ≠ a possible scenario, they won't see how pumps manipulate them.

  For the carrying example, I'll use a digital restoration case: "The Phoenix Canvas" - an original painting burned to ash, then reconstructed pixel-by-pixel by an AI trained on the artist's other works. The question is whether this counts as the original work.

  Key features it must include:
  - Physical destruction of original
  - Perfect digital replica based on data
  - Explicit question about identity ("is this the same artwork?")

  What it must exclude:
  - Emotional attachment (distracts from modal issues)
  - Historical provenance details (complicates the identity question)
  - Any reference to consciousness (avoids philosophy-of-mind baggage)

  This example works because it's directly from their world, cleanly isolates the identity question, and will feel viscerally relevant to their debates about digital reconstructions.

  For misconceptions, I anticipate:
  From their field: That vivid visualization equals possibility (e.g., "I can picture it, so it must be possible").
  Also from their field: That material continuity is obviously essential for identity (when this is exactly what's being questioned by the pump).

  Emerging during session: That the pump's conclusion (is it the same?) is the important part rather than its smuggled premise about what can be preserved identically.

  I need to address the visualization misconception early when introducing narrative vs modal coherence. The material continuity assumption should be challenged when analyzing identity conditions in the example. The conclusion-vs-premise issue must be confronted during the "unpacking" phase of the pump.

  For the check for understanding, I'll have them design a variant of the pump that changes the modal loading to flip the intuition. For example: "What if we change the story so the AI creates the replica before the fire? Is it still the same work after destruction?" This reveals whether they grasp the mechanism, not just the example.

  Finally, I must exclude:
  - Modal logic notation (too technical)
  - Theories of mental representation (distracts from core mechanism)
  - Bibliographic debates (wastes time)
  - Any reference to philosophers like Dennett beyond naming "intuition pump"

  I'm excluding these because they're barriers to the core goal - seeing how pumps work rhetorically. The session should stay focused on the mechanism of modal smuggling.

