prompt: |-
  ok me and my roommate just got done arguement for like three hours about grounding and fundamentality and i'm still mad. she has this weird track record that actually fits like three different theories but she won't see it. she says a table's brownness is fully grounded in atomic surface properties. she says a shadow isn't grounded in any shadow-substance but jointly in the lamp, wall, and absence of light. she says 'there is a president' is grounded in institutional rules and collective acceptance, definately not reducible to brain states. she says water being necessarily H2O is grounded in the essential nature of water, not in language conventions. and she says cruelty being wrong is just fundamental, not grounded in natural properties at all.

  so here's the new case we fought over. there's a persistant virtual world with deterministic code, but the players built an autonomous economy and culture that the devs can't touch without breaking everything. there's one artifact the code defines as worthless scrap, but the community collectively treats it as a symbol of honor and trades it like currency. my roommate says the fact that it has social value is grounded in the collective practices, same as the president case. but she also says that if there's a normative claim like 'it's wrong to destroy it for profit,' that's brute and not grounded in the practices or the code.

  predict what she'd actually say about both parts, lay out the rules she's running—maybe essentialist-constitution for physical stuff, institutional for social, non-naturalist for normative?—and say which ones fit her earlier verdicts just as well. tell me what each rule predicts for the artifact's value and for the normative claim, give your best guess with reasons, and name the further case that'd split them—maybe if the community suddenly abandons the artifact but the code never changes. please lead with your bottom line in the first sentence, then reasoning, no preamble and don't restate the question.
reasoning: |-
  Okay, the user is clearly frustrated after a three-hour argument with their roommate about grounding and fundamentality. Let me start by understanding the core issue. The roommate has specific views on different cases: the table's brownness is grounded in atomic properties, shadows in the lamp and absence of light, the president in institutional rules, water's essence in H2O, and cruelty's wrongness as fundamental. 

  The new case involves a virtual world where an artifact coded as worthless is treated as valuable by the community. The roommate says the social value is grounded in collective practices, but any normative claim (like it being wrong to destroy it) is brute. The user wants to know what rules the roommate is using, how they apply here, and a case that could split the theories.

  First, I need to map the roommate's positions to philosophical frameworks. Her take on the table and water points to essentialism—physical properties grounded in their physical constitution. Shadows being grounded in multiple factors without a substance suggests a relational or structural grounding. The president and the artifact's value rely on collective acceptance, fitting institutional theories like Searle's. Normative claims being fundamental aligns with non-naturalism, such as Moore's intuitionism.

  For the artifact's social value, institutional grounding applies, similar to the president. The normative claim being brute matches her stance on cruelty. The challenge is to find a case that tests these frameworks. The user suggested a scenario where the community abandons the artifact, but the code remains. In that case, institutional theory would say the value is gone because it depends on current practices, while essentialism might still see it as valuable if the code defines it, but the roommate rejects code-based grounding here. So if the community stops valuing it, her institutional view would say it loses value, showing that value isn't essential but dependent on practices.

  The user might also be seeking validation that their roommate's position is inconsistent. They want a clear framework to explain her views and a test case to challenge her. Underlying this, they might want tools to win the argument or understand her reasoning better. Providing a hypothetical that exposes potential contradictions could help the user in future discussions. Naming the frameworks gives them academic leverage, and the test case offers a concrete example to use. I should ensure the response is structured with the bottom line first, as requested, and then detailed reasoning without preamble.
answer: |-
  **Bottom line:** Your roommate will ground the artifact's social value in collective practices (institutional grounding) but treat the normative claim as brute (non-naturalist normativity), consistent with her prior pattern; however, her essentialism about water and fundamentality for normativity create tension under hypotheticals like community abandonment.

  **Her Rules & Predictions:**
  1.  **Essentialist Constitution (Physical/Modal):** Grounds physical properties (table's brownness) and essential identities (water=H₂O) in the fundamental physical/chemical nature of the entities themselves. *Predicts for Artifact:* The *code-defined physical properties* (worthless scrap) are grounded in the code/essential nature. The *social value* is **NOT** grounded here.
  2.  **Relational/Structural Grounding (Non-Substantive):** Grounds entities like shadows in complex, often negative, relations between fundamental things (lamp, wall, absence). *Predicts for Artifact:* Might see the artifact's *existence as a virtual object* grounded in the code/structure, but not its social value. Less central here.
  3.  **Institutional Grounding (Social):** Grounds social facts (president exists, money has value) in collective intentionality and constitutive rules/acceptance. *Predicts for Artifact:* The fact that it **has social value (as honor symbol/currency)** is grounded *entirely* in the community's collective practices and acceptance, overriding the code's definition.
  4.  **Non-Naturalist Normative Fundamentalism (Ethical):** Treats basic normative truths (cruelty is wrong) as sui generis, fundamental facts not grounded in natural (physical or social) properties. *Predicts for Artifact:* The claim **"It's wrong to destroy it for profit"** is a *fundamental normative fact*, not grounded in the social practices, the code, or any natural property. The practices *create the context* for the wrongness (by creating the valued thing), but the *wrongness itself* is brute.

  **Fit with Prior Verdicts:**
  *   **Fits Perfectly:** Institutional grounding perfectly fits the president case and predicts her verdict on the artifact's social value. Non-naturalist normativity perfectly fits the cruelty case and predicts her verdict on the artifact's normative claim. Essentialist constitution fits the table and water cases.
  *   **Fits Adequately:** Relational grounding fits the shadow case, though it's less central to her overall pattern than the other three.

  **Best Guess for Artifact Case:**
  1.  **Social Value (Honor/Currency):** She will say this is **grounded in the collective practices** of the player community. The code defining it as scrap is irrelevant; the social fact is constituted by their acceptance and use, just like the president's status. (Institutional Rule).
  2.  **Normative Claim (Wrongness):** She will say **this is fundamental and not grounded**. While the practices create the valued entity *about which* the normative claim is made, the *wrongness of destroying it for profit* is an irreducible normative fact, akin to cruelty being wrong. It supervenes on the social fact but isn't grounded *in* it. (Non-Naturalist Rule).

  **Reasoning for Guess:** Her clear separation in the cruelty case (practice creates context, wrongness is brute) maps directly onto the artifact case: practices create the valued thing, the wrongness of destroying it is brute. She consistently resists reducing normativity to natural/social facts. Her dismissal of brain states for the president and embrace of collective acceptance for social facts strongly predicts her grounding the value in practices, not code.

  **The Splitting Case: Community Abandonment**
  *   **Scenario:** The player community unanimously and permanently abandons all practices treating the artifact as honorable/valuable currency. The deterministic code defining it as worthless scrap remains unchanged.
  *   **Predictions:**
      *   **Institutional Grounding:** Predicts the artifact **no longer has social value**. Value is gone because the grounding condition (collective acceptance/practices) is gone. The code is irrelevant.
      *   **Essentialist Constitution (Misapplied):** *If* someone argued the value was essential to the artifact (like water=H₂O), they might say it *still* has value. **But she explicitly rejects this** for social facts like the president/money, so she *won't* say this. Essentialism here only applies to the *code-defined properties* (scrap).
      *   **Non-Naturalist Normativity:** Predicts the claim **"It's wrong to destroy it for profit"** *might* still hold *if* the normative fact was contingent *only* on the artifact *having been* socially valued, or *might* lapse. This is ambiguous in her framework. Her cruelty case suggests wrongness persists even if no one cares, but here the *object* of the normative claim (the valued artifact) no longer exists. This exposes a tension: *Why* is destroying *this specific physical object* wrong? If the value is gone, is the wrongness gone too, or is it now wrong for some other reason?
  *   **Splits Institutional from Ambiguous Normativity:** The Institutional rule clearly predicts the social value vanishes. Her Non-Naturalist rule struggles to clearly predict what happens to the *specific* normative claim once its social context (the value) disappears, potentially forcing her to clarify the dependence (or lack thereof) of brute normativity on non-natural contexts. It highlights the gap between the grounded social fact and the brute normative claim.
