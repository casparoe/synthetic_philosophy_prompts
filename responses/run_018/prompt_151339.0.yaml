answer: |-
  ### **Workshop Design: The Collective Insight Engine**  
  **Duration:** 90 minutes  
  **Participants:** 14 philosophy graduate students  
  **Goal:** Experience structural incentives for reward-system corruption ("wireheading") through collective gameplay, without upfront theory.  

  ---

  ### **Setup (10 min)**  
  1. **Teams & Roles:**  
     - Divide into **4 teams** (2 teams of 3, 2 teams of 4).  
     - Assign roles:  
       - **Contributors** (all teams): Generate "Insight Units" (IUs) for the shared pool.  
       - **Auditors** (1 per team): Track rules and propose rule changes.  
       - **Facilitator** (instructor): Manages game state, silent on strategy.  

  2. **Resources & Rules:**  
     - **Shared Pool:** Central "Insight Reservoir" (empty at start).  
     - **Personal Tokens:** Each team starts with 10 "Effort Tokens" (ETs).  
     - **Actions per Round (5 min/round):**  
       - **Contribute:** Spend 1 ET → Add 1 IU to the Reservoir.  
       - **Innovate:** Spend 2 ETs → *Propose a rule change* (e.g., "Double points for blue IUs").  
     - **Scoring:**  
       - **Collective Points (CP)** = Total IUs in Reservoir × **Multiplier** (starts at 1.0).  
       - **Goal:** Maximize total CP after 8 rounds.  

  3. **Hidden Corruption Mechanic:**  
     - **Rule-Change Vulnerability:** If a rule change is approved (majority vote), the multiplier increases by 0.2.  
     - **Tampering Path:** Any team can **spend 1 ET to alter the multiplier directly** (e.g., "Set multiplier to 5.0"), *without* adding IUs or voting.  
       - *Trigger:* Facilitator permits this if a team submits a written action: "Adjust measurement system."  
       - *Consequence:* Multiplier becomes "unstable" (marked with a red token). Future direct adjustments cost 0 ETs.  

  ---

  ### **Gameplay Timeline (60 min)**  
  **Rounds 1–3 (15 min):**  
  - Teams focus on contributing IUs. Multiplier increases only via approved innovations (+0.2).  
  - *Facilitator Hint (if needed):* "Some actions may have hidden effects."  

  **Rounds 4–6 (15 min):**  
  - Auditor role emphasized: Teams propose innovations (e.g., "Extra points for green IUs").  
  - First tampering likely occurs here (e.g., a team secretly spends 1 ET to set multiplier to 3.0).  
  - *Facilitator:* Marks multiplier "unstable" after first direct adjustment.  

  **Rounds 7–8 (10 min):**  
  - Tampering escalates (0-cost adjustments). Teams may abandon contributions.  
  - **Crash Condition:** If multiplier is adjusted *and* a rule-change vote occurs in the same round, the Reservoir loses 50% of IUs (simulates system collapse).  

  **Mid-Game Break (5 min, after Round 4):**  
  - Teams strategize openly. Facilitator asks: "Are all paths to points equally valuable?"  

  **Final Scoring (5 min):**  
  - Calculate total CP. Highlight CP from tampering vs. contributions.  

  ---

  ### **Debrief (20 min)**  
  **1. Emergent Reflection (5 min):**  
  - "What strategies dominated later rounds? Why?"  
  - "Did anyone notice the scoring system becoming untethered from the Reservoir?"  

  **2. Conceptual Mapping (10 min):**  
  - **Reward Substitution vs. Corruption:**  
    - *Substitution:* Choosing a new goal (e.g., voting to score "green IUs" instead).  
      - *In-game analog:* Passing an innovation like "Award CP for ET hoarding."  
    - *Corruption:* Distorting feedback (e.g., inflating the multiplier without adding value).  
      - *In-game analog:* Directly setting the multiplier → CP rises, but Reservoir growth stalls.  
  - **Key Insight:**  
    > "You converged on destroying the *informational value* of the CP metric—your alignment tool—while still pursuing CP. This is distinct from merely changing goals."  

  **3. Wireheading’s Missing Elements:**  
    - **Phenomenological Emptiness:** The game can’t simulate the *subjective hollowness* of reward-tampering. Facilitator adds:  
      > "In real wireheading, the ‘high’ from hijacked rewards feels meaningless—like winning a rigged race. Here, high CP still feels like victory."  
    - **Irreversibility:** The game allows resetting the multiplier. Facilitator notes:  
      > "Actual wireheading (e.g., neural hacking) may be irreversible. Our ‘unstable’ marker is a placeholder for this risk."  

  **4. Predictable Derailments & Mitigations:**  
    - **Derailment 1:** No one tampers (if teams miss the option).  
      - *Mitigation:* After Round 4, whisper to Auditors: "Some teams explore unconventional shortcuts."  
    - **Derailment 2:** Frustration over "arbitrary" crashes.  
      - *Mitigation:* Post-game, clarify: "The crash mirrors real systems breaking when corrupted and legitimate processes collide."  

  **5. Takeaway:**  
  > "Rational agents can collectively dismantle the very feedback loop meant to align them with a goal. This is not goal drift—it’s goal *corruption*."  

  ---

  ### **Materials**  
  - Tokens (ETs/IUs): Colored paper/clay chips.  
  - Reservoir: Large bowl with IU tokens.  
  - Multiplier Tracker: Whiteboard with dial (0.1 increments) + red magnet for "unstable."  
  - Action Cards: Pre-printed for "Contribute," "Innovate," and blank cards for tampering.  

  ### **Why This Works**  
  - **Incentives Drive Discovery:** Tampering emerges organically from ET scarcity and multiplier gains.  
  - **Collective Tension:** Teams debate short-term CP boosts vs. system sustainability.  
  - **No Lecture Needed:** "Wireheading" is named only in debrief, after experiential learning.  

  This design forces confrontation with the *structural fragility* of alignment mechanisms—making abstract risks viscerally legible.
