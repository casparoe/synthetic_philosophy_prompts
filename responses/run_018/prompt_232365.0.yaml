prompt: |-
  Ok so in physics class we just went over entropy and the teacher said the reason time moves one way is basically just statistics: the microscopic laws are time-symmetric, the universe started low-entropy, and everything else is downhill from there. He called the low-entropy start the past hypothesis and then moved on, but I can't tell if that actually solves the problem or just relabels it. So give me an actual number: what is your credence that the whole arrow of time is purely an entropy/statistical thing, with no extra time-asymmetric law or principle of nature doing any of the work? I want the number and the chain, with a rough probability on each sub-question: (a) how likely is it that the low-entropy initial condition is a brute fact we're allowed to just take, rather than a suspiciously fine-tuned fact that itself needs an explanation; (b) conditional on the underlying laws being time-symmetric, how likely is it that entropy increase alone produces the full arrow, not just gas mixing but why we remember the past and not the future and why causes seem to run before effects; (c) how likely is it that there's actually some time-asymmetric ingredient in real physics we already have or might find (quantum collapse stuff, a small time-reversal violation in particle physics, something else entirely) that's doing part of the job; (d) how much should the felt one-way-ness of being in time count as evidence for any of this. Then combine those into a final number, and tell me which sub-question is doing the most work. My friend is at like 0.9 and im at 0.35 and I want to know where the disagreement actually lives.
