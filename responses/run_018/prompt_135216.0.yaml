  Okay, the user is drafting material for a graduate seminar on collective responsibility and has identified a specific pattern where a state acknowledges moral guilt for historical wrongs symbolically—like apologies and memorials—but doesn't redistribute the material benefits derived from those wrongs. They want to know if this has an established name in the literature or if I can propose one.  

  First, I need to understand the core issue. The user points out that moral guilt is accepted intergenerationally, but material advantages are treated as separate, protected property rights. This isn't covered by Jaspers' categories: it's not political guilt (which involves civic responsibility for state actions) because there's no institutional restructuring, and not metaphysical guilt because the present generation actively claims the guilt. It also differs from structural injustice or historical redress frameworks because the key is the deliberate separation of moral and material inheritance.  

  The user mentions concepts like moral licensing or symbolic politics, but those don't fully capture this. Moral licensing might allow symbolic acts to excuse inaction, but here the state actively separates the two realms. Symbolic politics focuses on gestures without substance, but this case involves a structural arrangement preserving benefits. The non-identity problem (where future generations' existence depends on past wrongs) is relevant but doesn't address the active compartmentalization.  

  Since there's no established term, I should propose one. "Compartimentalized Historical Inheritance" seems fitting—it highlights the separation ("compartimentalized") and the intergenerational aspect ("historical inheritance"). Necessary conditions would include: formal acceptance of collective guilt, protection of material benefits, and a conceptual separation justifying both.  

  I'll distinguish it from nearby concepts: moral licensing is psychological; symbolic politics is about gestures substituting for action; the non-identity problem is a philosophical dilemma. This configuration is structural and deliberate. I'll keep it concise, under 350 words, focusing on clarity for a grad seminar.  

  The user's deeper need might be to frame this paradox for academic discussion, so the term should be precise and pedagogically useful, enabling analysis of how societies manage contradictory stances on guilt and gain.
answer: |-
  This configuration lacks a universally established term but can be precisely conceptualized as **Compartimentalized Historical Inheritance (CHI)**. CHI occurs when a collective entity (like a state) simultaneously:  
  1.  **Formally Accepts Symbolic-Moral Inheritance:** It acknowledges itself as the inheritor of moral guilt for historical wrongs committed by predecessors, performing acts of symbolic atonement (apologies, memorials, educational reform) that presuppose a transgenerational moral subject.  
  2.  **Exempts Material-Economic Inheritance:** It systematically shields the tangible structural advantages (land, wealth, institutional power) demonstrably flowing from those same wrongs from being treated as tainted inheritances requiring fundamental redistribution. These benefits are instead framed as neutral, legitimate property or the baseline of state continuity.  
  3.  **Enforces a Conceptual Separation:** It actively maintains and justifies the boundary between (1) and (2), arguing that moral atonement and distributive justice operate in distinct normative registers, conflating them would punish innocent individuals, and property rights/state continuity are inviolable foundations.  

  CHI is distinct from:  
  *   **Jaspers' Political Guilt:** CHI accepts moral guilt symbolically *without* accepting the core political responsibility (restructuring institutions/benefits) Jaspers implies.  
  *   **Moral Licensing:** While symbolic acts might *function* as licenses, CHI is a deliberate, structural doctrine separating moral and material spheres, not primarily a psychological mechanism.  
  *   **Symbolic Politics:** CHI involves genuine institutional acts (funding memorials, curricula) but restricts their scope; it's not just empty gestures but a bounded institutional strategy.  
  *   **Non-Identity Problem Analogues:** While national continuity arguments may be used defensively, CHI's core is the *active separation and management* of two types of inherited responsibility (moral vs. material) by the collective entity itself, not just a logical paradox about identity over time. CHI is a chosen political strategy stabilizing the paradox.  

  This framework isolates the core mechanism: the deliberate activation of moral inheritance for symbolic purposes coupled with the quarantine of material inheritance for structural preservation.
