  I just had this long, exhausting argument with my friend about advance directives — like, should a living will signed by a healthy 40-year-old still bind them if they get dementia and seem happy? We both agree the psycholgical changes are massive, and we both agree autonomy matters, but he's convinced the earlier self retains authority and I think that's just mystical. We've been going in circles for an hour and neither of us moves. Is this actually a hidden disagreement about personal identity — whether the dementia patient is literally the same person — or is it about what kind of normative authority survives psychological rupture? Or are we just talking past each other, with him answering 'what should the law do' and me answering 'what is metaphysically coherent'? What's the real structure of the stall, and is there any distinction or argument that could actually break it, or is it bedrock intuition about whether people survive psycholgical change?
