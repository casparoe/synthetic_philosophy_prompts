prompt: |-
  I run compliance for a mid-sized charity that funds health and education projects in twelve countries, and my staff keep bringing me borderline cases that our anti-bribery policy doesn't settle: a village committee gives our country director a goat at a farewell ceremony; a ministry clerk hints that our registration will sit in a drawer unless we pay a 'processing fee' that appears on no schedule; a local partner proposes hiring the regional governor's niece, who is genuinely the best-qualified candidate; a mayor we work with has steered a sanitation project towards wards that voted for him, which he describes as keeping faith with his supporters. Write me a decision procedure my field officers can actually run -- a sequence of questions with stopping points -- that distinguishes gifts from bribes, facilitation payments from legitimate fees, and patronage from ordinary political responsiveness. The procedure should be philosophically literate about the debate over whether corruption is a universal notion or a Western export: I want it to take seriously the possibility that some judgements are culturally relative (hospitality norms, obligations to kin and clan, the expectation that officials look after their own) while identifying where, if anywhere, the relativity runs out and a practice is corrupt on any reasonable account -- and it should say what the procedure should do with cases where those two deliver conflicting verdicts. Specify which distinctions the procedure treats as doing the real work (e.g., whether the benefit targets the person or the office, whether a specific quid pro quo is understood, whether the arrangement could survive publicity) and which familiar rules of thumb it should discard as culturally parochial. Then run the procedure on the four cases above, including a clear verdict on each, and identify at least one verdict my staff will find uncomfortable in each direction -- one clearance that will look bad to our European donors and one prohibition that local staff will find obtuse. Finally, mark the points where the procedure has to hand the decision up to me because the question is one of values rather than of classifiable fact. Please write in British English.
reasoning: |-
  Okay, the user runs compliance for a mid-sized charity operating in twelve countries, and they're dealing with borderline cases where their anti-bribery policy isn't clear. They've described four specific scenarios: a goat given to a country director, a hinted "processing fee," hiring a governor's niece who's qualified, and a mayor directing projects to his supporters. 

  The user wants a practical decision procedure that field officers can use. It needs to distinguish between gifts and bribes, facilitation payments vs legitimate fees, and patronage vs political responsiveness. Importantly, they want it philosophically literate—acknowledging cultural relativity while drawing lines where corruption is universal. They also want uncomfortable verdicts that challenge both European donors and local staff, plus clarity on when decisions must escalate.

  Hmm, this is complex. The charity operates across diverse cultural contexts, so the procedure must avoid Western-centric assumptions while upholding ethical standards. The user's deeper need seems to be balancing operational pragmatism with donor trust and legal compliance. They likely fear scandals that could jeopardize funding or projects, but also don't want to alienate local partners. 

  First, I should map the philosophical tension: Western frameworks (like OECD anti-bribery conventions) see corruption as objective (abuse of public power for private gain), while anthropological critiques argue norms like hospitality or clan obligations aren't universally "corrupt." The procedure must navigate this by focusing on universal harms—like subverting fair processes—while respecting non-harmful local practices. 

  Key distinctions should include: 
  - Intent (quid pro quo vs goodwill)
  - Publicity test (would local communities accept it if known?)
  - Harm (does it distort decisions or create inequity?)
  - Targeting (personal vs institutional benefit)

  Rules to discard: 
  - "No gifts over £50" (parochial; ignores symbolic value) 
  - "Never hire relatives" (ignores merit-based kinship appointments) 
  - "Avoid all politics" (unrealistic; confuses patronage with legitimate constituency service)

  For escalation points: Any case involving legal risk (extortion), fundamental equity breaches, or conflicts between local norms and universal ethics must go to the user. 

  Now, applying to cases:
  1. The goat: Verdict = gift. Uncomfortable for donors (may see as improper), but passes publicity test in context. 
  2. "Processing fee": Verdict = extortion. Uncomfortable for local staff (may see as unavoidable), but clear quid pro quo. 
  3. Hiring the niece: Verdict = acceptable if merit-based. Escalate if pressure exists. Donors may suspect nepotism. 
  4. Mayor's project: Verdict = political responsiveness if needs-based. Uncomfortable for locals if called patronage, but escalate if wards are unfairly favored. 

  The real tension is in cases where cultural relativity clashes with universal ethics. The procedure defaults to universal harms (e.g., extortion) but respects relativity where no harm exists (e.g., symbolic gifts). When conflicted, escalate—because values, not facts, are at stake.
answer: |-
  Here is a culturally literate decision procedure for your field officers, designed to navigate borderline cases while respecting philosophical debates on corruption's universality. It prioritises **intent, distortion, publicity, and harm** over rigid monetary thresholds or culturally parochial assumptions.

  **Core Principles Guiding the Procedure:**
  1.  **Universality Anchor:** Corruption exists where an *advantage improperly distorts the exercise of a public or entrusted duty*, undermining fairness, equity, or the intended purpose of resources. This harm is universal.
  2.  **Cultural Relativity Scope:** Norms governing *gift-giving, expressions of gratitude, obligations to kin/community, and political reciprocity* vary significantly. Judgement requires contextual understanding.
  3.  **Key Distinctions Doing the Work:**
      *   **Intent & Expectation:** Is there a *specific, implicit, or explicit understanding* of a *quid pro quo*? Or is it an unsolicited gesture without strings?
      *   **Distortion:** Does the benefit likely cause the recipient to act *contrary to their duty, professional judgment, or the charity's mission*? Does it create unfair advantage?
      *   **Targeting:** Is the benefit directed at the *person* (linked to their role/office) or the *institution*? Personal benefits are higher risk.
      *   **Publicity Test:** Would disclosure of the act *damage the charity's reputation for integrity* with reasonable stakeholders *in that specific context* AND/OR violate clear laws/universal principles?
      *   **Harm:** Does the practice undermine public trust, divert resources from intended beneficiaries, or perpetuate inequity?
  4.  **Rules of Thumb to Discard:**
      *   **"All gifts over £X are bribes":** Ignores symbolic value and cultural context (e.g., a ceremonial goat vs. cash).
      *   **"Never hire relatives":** Fails to distinguish between qualified candidates and pure nepotism distorting merit.
      *   **"Avoid any interaction with politics":** Confuses legitimate political engagement/responsiveness with corrupt patronage.
      *   **"Facilitation payments are just the cost of doing business":** Legitimises extortion and undermines rule of law universally.

  **The Decision Procedure: A Sequence of Questions**

  **Stage 1: Initial Filter (Field Officer Assessment)**
  1.  **Is there a direct demand or offer of a benefit linked to a specific official action?** (e.g., "Pay this fee or your registration stalls").
      *   **YES:** STOP. High risk of extortion/bribe. **Hand Up to Compliance Lead.** (May require legal review/strategic response).
      *   **NO:** Proceed to Q2.
  2.  **Is the benefit solicited by the charity representative?**
      *   **YES:** STOP. **Prohibited.** Violates core policy (initiating improper advantage).
      *   **NO:** Proceed to Q3.
  3.  **Is the benefit purely symbolic, customary, of nominal monetary value *in its context*, and offered publicly as a gesture of goodwill/respect?** (e.g., small local handicraft, plaque, shared meal).
      *   **YES:** STOP. Likely **Permissible Gift.** Document.
      *   **NO:** Proceed to Stage 2 (Requires deeper contextual analysis).

  **Stage 2: Contextual Analysis (Field Officer + Local Team Consultation)**
  4.  **Intent & Expectation:** What is the *culturally understood meaning* of the act? Is there an *implied expectation* of future favouritism or altered decision-making? (Consult trusted local advisors/staff).
      *   **Clear Expectation of Favour (Quid Pro Quo):** STOP. **Prohibited as Bribe/Undue Influence.**
      *   **Genuine Gesture (Gratitude/Hospitality/Custom):** Proceed to Q5.
      *   **Ambiguous / Culturally Complex:** Proceed to Q5 & Q6 cautiously. Flag ambiguity.
  5.  **Distortion & Harm:**
      *   a) Could accepting/doing this *reasonably be seen* as influencing a current or future decision of the recipient/official *contrary to duty or fairness*?
      *   b) Does it create *unfair advantage* for a specific person/group over equally/more deserving others?
      *   c) Does it *subvert the intended purpose* of the charity's resources/project?
      *   **YES to a, b, or c:** STOP. **Prohibited.** (Universally problematic - distortion/harm).
      *   **NO:** Proceed to Q6.
  6.  **Publicity & Legitimacy Test:**
      *   a) **Local Publicity Test:** If fully disclosed to the local community/beneficiaries *in this context*, would it likely be seen as acceptable and normal, or as improper favouritism/corruption?
      *   b) **Donor/Legal Publicity Test:** Would disclosure to donors, HQ, or home country authorities *reasonably* damage the charity's reputation for integrity or violate unambiguous law (e.g., UK Bribery Act, US FCPA)?
      *   **FAILS Local Test (Seen as Improper):** STOP. **Prohibited.** (Harm to local trust).
      *   **PASSES Local Test, but FAILS Donor/Legal Test:** **Hand Up to Compliance Lead.** (Values conflict: Local acceptance vs. donor expectations/legal risk).
      *   **PASSES Both Tests (or Local Pass, Donor Test Ambiguous):** Proceed to Q7.
  7.  **Mitigation & Documentation:**
      *   Can the benefit be *refused politely without causing offence or risk*? (Often preferable).
      *   Can it be *diverted* to the charity/public good (e.g., "Thank you, let's donate this goat to the community centre")?
      *   If acceptance is deemed the only prudent course *after passing Q4-Q6*: **Permissible with Mandatory Documentation.** (Record context, value, reason for acceptance, individuals involved, steps taken to mitigate). **Hand Up summary to Compliance Lead for awareness/audit.**

  **Hand Up to Compliance Lead Triggers:**
  *   Stage 1, Q1 (Extortion/direct solicitation).
  *   Stage 2, Q6b (Conflict between local acceptability and donor expectations/law).
  *   Any case involving senior staff, high monetary value, significant legal/reputational risk, or deep ethical ambiguity after Stage 2.
  *   Cases revealing systemic issues needing policy review.

  ---

  **Application to Cases:**

  1.  **The Goat:**
      *   S1Q1: No direct demand/offer linked to action.
      *   S1Q2: Not solicited.
      *   S1Q3: **YES.** Nominal monetary value *locally*, symbolic, customary farewell gesture. **VERDICT: Permissible Gift.** Document.
      *   *Uncomfortable Clearance for Donors:* European donors may see accepting *any* animal as improper gift, ignoring cultural significance of ceremonial livestock.

  2.  **The "Processing Fee":**
      *   S1Q1: **YES.** Clerk's hint directly links payment ("fee") to official action (registration). **VERDICT: Hand Up Immediately.** High risk of extortion/bribery. Requires strategic/legal response.
      *   *Uncomfortable Prohibition for Local Staff:* Local staff may see small "fees" as unavoidable cost of doing business, ingrained in the system. The procedure identifies it as universally corrupt due to explicit *quid pro quo* and distortion.

  3.  **Hiring the Governor's Niece:**
      *   S1Q1: No direct offer/demand *for the hire* implied in the proposal (assuming proposal is merit-based).
      *   S1Q2: Not solicited by charity rep (proposal came from partner).
      *   S1Q3: NO (Job offer isn't a "gift").
      *   S2Q4: **Crucial.** Is the niece *genuinely* the best candidate based *solely* on objective criteria for *this specific role*? Was she identified through a fair process? Is the *expectation* merely that she's considered fairly, or is there implied pressure to hire her *because* of her uncle? *If genuine merit, no expectation of favour:* Proceed.
      *   S2Q5: a) Only if hiring her distorts project decisions unfairly (e.g., inflated salary, unqualified, influences tenders). b/c) Not inherently, *if* she's qualified. **Likely NO if merit-based.**
      *   S2Q6: a) *Local Test:* May be seen as normal/positive (qualified local hire) *or* as nepotism depending on context. b) *Donor Test:* High risk of being perceived negatively as nepotism.
      *   **VERDICT: Hand Up to Compliance Lead.** Q6b conflict likely. If investigation confirms genuine merit and no pressure/expectation of favouritism, potentially **Permissible with Extreme Caution & Documentation.** Must ensure robust recruitment process is followed and documented. *If any hint of pressure/unfair process:* **Prohibited.**

  4.  **Mayor Steering Sanitation Project:**
      *   S1Q1: No direct benefit offer/demand to charity rep.
      *   S1Q2: Not solicited by charity.
      *   S1Q3: NO.
      *   S2Q4: Intent is political responsiveness ("keeping faith"). Is there an *implied quid pro quo* for the *charity* (e.g., future favours for the mayor)? Or is he allocating *municipal* resources based on politics, potentially using the *charity's* project to do it?
      *   S2Q5: **Critical - Harm & Distortion:** a/b/c) **YES, if:** The wards chosen *lack objective need* compared to others, or the selection *subverts the charity's needs-based criteria*. This diverts charity resources for political gain (patronage), creating unfairness and undermining project goals. **NO, if:** The wards are genuinely high-need *and* the mayor is channeling resources to constituents he represents fairly (responsiveness), aligning with charity objectives. Need rigorous needs assessment proof.
      *   S2Q6: a) *Local Test:* May be seen as normal politics (responsiveness) or corrupt (patronage). b) *Donor Test:* Steering based solely on voting patterns, especially if needs aren't paramount, looks bad.
      *   **VERDICT:** **If diversion from objective needs/charity criteria: PROHIBITED.** Report concern to Mayor/authorities; consider project viability. **If aligned with objective needs: Potentially Permissible** but **Hand Up** due to Q6b sensitivity & need for robust documentation proving needs assessment. *Uncomfortable Prohibition for Local Staff:* Local staff/politicians may see rewarding supporters as legitimate and expected politics. The procedure prohibits it where it subverts needs-based allocation (universal harm).

  This procedure provides a structured, philosophically informed path for your field officers, escalating the complex value judgments where necessary. It emphasises context without relinquishing the core principle that distortion of duty and resources for undue advantage is universally problematic.
