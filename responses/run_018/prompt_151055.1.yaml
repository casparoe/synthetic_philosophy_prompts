  Here's my credence decomposition for your specific "emotion-only compositional mentalese" concept, combining reasoning with rough probabilities. Final credence: **0.02 (Very Low)**.

  **Decomposition & Justification:**

  1.  **(a) Prob mental representations are syntactically compositional at all: 0.85**
      *   *Justification:* Evidence from language processing, complex planning, relational reasoning, and mental model construction strongly suggests compositional structure exists in human cognition beyond mere association. Neural evidence (e.g., hierarchical processing in PFC, combinatorial coding) supports this.

  2.  **(b) Prob compositionality is domain-limited *only* to affect (emotion/attitudes): 0.15**
      *   *Justification:* Compositionality demonstrably operates in logical, linguistic, spatial, social, and abstract conceptual domains. Attributing it *solely* to affect contradicts extensive evidence showing its generality. While emotional reasoning *uses* compositional outputs from other domains, the mechanism isn't exclusive.

  3.  **(c) Prob emotional reasoning *requires* syntactic compositionality rather than associative weights + simpler operations: 0.30**
      *   *Justification:* While emotions involve complex appraisal (e.g., evaluating relevance, goals, coping potential), this often relies on associative networks, learned schemas, somatic markers, and fast pattern matching. Structured evaluations might emerge from non-compositional systems or borrow structure from non-emotional cognition. True syntactic binding of propositional attitudes (fear-of-X, desire-for-Y) within a dedicated *emotional* syntax is less established.

  4.  **(d) Prob neural/functional independence of affective composition: 0.60**
      *   *Justification:* If emotional composition were real and distinct, we'd expect unique neural signatures (e.g., specific combinatorial patterns in affective regions like vmPFC/OFC/amygdala, separable from linguistic/syntax areas like Broca's). Some evidence suggests affective *integration* involves distinct circuits, but robust evidence for a unique *compositional syntax* localized purely to affective processing is limited. Overlap with general valuation/combinatorial mechanisms is likely.

  **Combining Probabilities:**
  Assuming rough independence for estimation: `0.85 (a) * 0.15 (b) * 0.30 (c) * 0.60 (d) = 0.02295`. Rounding to **0.02** (2%) to reflect dependencies and overall coherence.

  **Weakest Link & Evidence Needed:**
  *   **Least Sure About: (b) Domain restriction to affect ONLY.** (Credence: 0.15)
  *   **Evidence to Shift It:**
      *   **Comparative Primate Studies:** Finding non-human primates exhibiting sophisticated, *compositionally structured* emotional attitudes (e.g., resolving complex social conflicts involving jealousy+deception+reconciliation with rule-based structure) *without* parallel development in non-affective domains like tool use or spatial reasoning. Current evidence suggests affective complexity co-evolves with general cognitive complexity.
      *   **Neural Decoding:** Demonstrating that brain regions central to emotional processing (vmPFC, OFC, insula, amygdala complexes) exhibit clear, decodable combinatorial neural codes *specifically* for structured emotional attitudes (e.g., distinct patterns for "fear of X mitigated by desire for Y" vs. just "fear of X" or "desire for Y"), and crucially, that these patterns are:
          1.  Syntactically structured (order-dependent, role-specific).
          2.  Fundamentally *different* from combinatorial codes used for linguistic syntax or logical relations in adjacent regions.
          3.  *Not* simply reflecting compositional inputs derived *from* linguistic or conceptual representations processed elsewhere.
      *   **Neuropsychological Dissociation:** Finding patients with intact, complex compositional emotional reasoning (e.g., nuanced jealousy, blended relief-regret) despite severe, specific deficits in *all* non-affective forms of compositional cognition (language syntax, logic, math, complex planning). Conversely, patients losing affective composition but retaining non-affective composition would also support domain restriction.

  **Why This Framing Might Be Off-Base (Your Hunch is Correct):**
  The core issue is likely the strict **domain restriction**. Compositionality appears to be a domain-*general* cognitive capability that can be *applied* to emotional content (e.g., linguistically framing "I fear X *because* it threatens Y which I desire"). Emotional processing itself seems heavily reliant on associative mechanisms, embodied states, and fast appraisals that bind simpler concepts (threat, loss) rather than requiring a unique internal syntactic language for emotions *alone*. The structure in complex emotions often feels like it comes *from* the conceptual/linguistic structuring of the situation, not from a dedicated affective syntax.

  This is a fascinating thought experiment for a story, though! Exploring a character whose *only* internal compositional structure is emotional could lead to unique narrative perspectives on logic, language, and relationships. Good luck!
