prompt: |-
  In preparing a graduate unit on the nonidentity problem, I presented the following argument in seminar. It seemed to prove too much and none of us could immediately see where it failed, so before I teach the material again I want a precise diagnosis.

  (1) A person is wronged by an act or policy only if that act or policy makes the person worse off than they would have been in its absence.

  (2) A person is not made worse off by an act or policy that is a necessary causal condition of that person's ever having existed, provided the life that person lives is worth living. The only alternative is never existing, and a life worth living is not worse for the person who lives it than never having existed.

  (3) For every person now alive who is descended from people enslaved in the transatlantic slave trade, the slave trade is a necessary causal condition of that person's existence. Had it not occurred, the specific chain of migrations, meetings, unions, and conceptions that produced that particular person would not have occurred, and that person would never have existed.

  (4) Therefore, by (2), the slave trade made no present descendant of those it enslaved worse off than that descendant would otherwise have been.

  (5) Therefore, by (1), the slave trade wronged no present descendant of those it enslaved.

  (6) A person now alive has a claim of justice grounded in an act only if that act wronged them.

  (7) Therefore, no present descendant of those enslaved has a claim of justice grounded in the slave trade.

  (8) By exactly parallel reasoning, no future person is wronged by any present policy that is a necessary causal condition of that person's existence. Large-scale choices—a high-emissions energy policy, delayed decarbonization, the depletion of a finite resource base—alter who meets whom, who stays, and who is born; under a different policy, different people would eventually be conceived. So long as the resulting lives remain worth living, none of those future people is made worse off by our present choice, and by (1) none is wronged by it.

  (9) These conclusions cannot be right. It cannot be that present descendants of enslaved people have no claim of justice grounded in what was done to their ancestors; and it cannot be that a policy knowingly bequeathing future people lives that are only barely worth living—lives shaped by avoidable climate damage—wrongs no one.

  So either (1), (2), or (6) is false, or at least one inference in the argument is invalid. Where does the argument go wrong? If a premise is false, identify it and explain what rejecting it commits us to. If a step is invalid, locate the precise step and state the distinction it overlooks. I would prefer to keep the judgments in (9), but I do not want to pay for them by quietly surrendering every person-affecting constraint on moral evaluation; tell me what the least costly revision is and what it commits me to.

  Lead with your bottom line in the first sentence, then give your reasoning; no preamble and no restating of the question.
reasoning: |-
  Hmm, the user is a philosophy instructor preparing a graduate unit on the nonidentity problem. They presented an argument in seminar that seems to prove too much - specifically, that descendants of enslaved people have no justice claims related to the slave trade, and that future generations harmed by climate policies have no grounds for complaint if their lives are minimally worth living. The class couldn't spot the flaw, and now they need a precise diagnosis before teaching it again.

  The argument has several steps: Premise (1) claims you're only wronged if made worse off; (2) says you can't be worse off by actions necessary for your existence if your life is worth living; (3) applies this to slave trade descendants; (4)-(7) conclude they have no justice claims; (8) extends this to future people affected by climate policies; and (9) rejects these conclusions as absurd.

  The user wants to preserve the intuitions in (9) without abandoning person-affecting constraints entirely. They're looking for the least costly fix - whether to reject a premise or identify an invalid inference.

  I think the core flaw is in premise (1). It reduces wronging someone solely to making them worse off, ignoring how the harm occurs. The nonidentity problem shows this is too narrow: when an act creates a new person who suffers avoidable harm, comparing their situation to non-existence isn't the right baseline. We need to consider whether the person was harmed in the process of being brought into existence under those conditions.

  Rejecting (1) allows us to say that acts can wrong people by inflicting unjust harms, even if those acts were necessary for their existence. This preserves the person-affecting intuition while accommodating the cases in (9). The cost is distinguishing between harming (making worse off) and wronging (violating rights or duties), which seems manageable.

  Alternative fixes like rejecting (2) or (6) would be messier. (2) seems solid - non-existence isn't a worse state. (6) could be tweaked but isn't the main issue. The inference steps look valid; the problem is (1)'s oversimplification.

  For the user's teaching purposes, this solution maintains person-affecting concerns while explaining why we intuitively judge historical injustices and future harms as wrongful. They can present this as refining rather than abandoning person-affecting morality.
answer: |-
  The argument fails at premise (1) because it incorrectly equates "wronging" with "making worse off" in a way that ignores the distinctive normative significance of imposing harmful conditions on a person in the process of bringing them into existence.

  Rejecting (1) commits you to the view that an act or policy can wrong a person even if it does not make them worse off than they would otherwise have been, specifically when:
  - The act/policy inflicts unjust harm or injustice *upon that person* (not merely upon their ancestors),
  - This harm occurs *as a direct consequence* of the act/policy that was causally necessary for their existence, and
  - The harm was reasonably foreseeable and avoidable.

  This resolves the nonidentity problem in (8) and the historical injustice case in (4)-(7) without abandoning person-affecting constraints. For descendants of the enslaved, the slave trade wrongs *them* directly by imposing conditions of profound structural injustice (e.g., systemic racism, inherited disadvantage) that constitute ongoing, identity-preserving harms. For future people, a high-emissions policy wrongs them by *avoidably subjecting them* to severe climate harms, even if their existence depends on the policy. The wrong lies in the *manner* of their creation under harmful conditions, not in a comparison to non-existence.

  **Reasoning step-by-step:**
  - Premise (1) is false because it conflates harming (comparative worsening) with wronging (violating a duty owed to the person). One can be wronged without being made worse off relative to a baseline, as when rights are violated under conditions where no better alternative was possible *for that person*. The slave trade descendants are wronged by being born into unjust social conditions directly traceable to the act; future people are wronged by being knowingly exposed to preventable existential threats.
  - (2) remains plausible: non-existence is not a better state, so existence with a life worth living is not comparatively worse. But this does not imply that the *causal path* to existence is normatively neutral.
  - (6) is defensible if "wronged" is properly understood: justice claims require being personally wronged, but rejecting (1) allows for such wronging without comparative worsening.
  - Inferences (3)→(4) and (4)+(1)→(5) are valid but depend on the flawed (1). (8) similarly relies on (1).
  - The cost: You must accept that wronging can occur through the *infliction of identity-dependent harms*—harms that could not have been avoided without preventing the person’s existence—provided the harms are substantial, unjust, and foreseeable. This retains person-affectingness (the wrong must be *to the person*) but rejects the narrow counterfactual-comparison model. It avoids the absurdity of (9) while imposing constraints: trivial harms or unforeseeable consequences wouldn’t ground claims.
