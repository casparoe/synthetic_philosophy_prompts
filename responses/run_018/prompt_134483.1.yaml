answer: |-
  ### Structured Deliberation: The Zark Language System  
  **Goal:** Experience revising a belief system when observations conflict with definitions, revealing the instability of analytic-synthetic boundaries.  
  **Time:** 90 minutes  
  **Participants:** 10 graduate students (3 roles × 3 students each + 1 facilitator).  

  ---

  ### **Setup**  
  **Artificial Language:** "Zark" (fictional particles with 8 properties).  
  **Interdefined Terms (Analytic Network):**  
  1. **R** (Red) ↔ ¬**B** (Blue)  
  2. **H** (Hot) ↔ **R**  
  3. **C** (Cold) ↔ **B**  
  4. **W** (Heavy) ↔ **H**  
  5. **L** (Light) ↔ **C**  
  6. **S** (Shiny) ↔ **W**  
  7. **D** (Dull) ↔ **L**  
  8. **E** (Energized) ↔ (**S** ∧ ¬**D**)  

  **Observation Reports (Synthetic):**  
  - O₁: "Zark X is Red." → **R**  
  - O₂: "Zark Y is Blue." → **B**  
  - O₃: "Zark X is Hot." → **H**  
  - O₄: "Zark Y is Cold." → **C**  
  - O₅: "Zark Z is Heavy **and** Light." → **W** ∧ **L**  

  **Conflict:** O₅ contradicts the definitions (from D1–D7, **W** → **H** → **R** → ¬**B** → ¬**C** → ¬**L**, so **W** ∧ **L** is impossible).  

  **Auxiliary Bridge Rules (Connect terms to observations):**  
  - BR₁: "Red" = visual observation under standard light.  
  - BR₂: "Heavy" = weight > 50g on Scale A.  
  - BR₃: "Light" = weight < 10g on Scale B.  

  **Constraint:** At least 6 of 8 terms (**R, B, H, C, W, L, S, D, E**) must retain original definitions.  

  ---

  ### **Roles & Rational Self-Interest**  
  Assign roles randomly (3 students per role):  
  1. **Terminologist (Guardian of Definitions):**  
     - Wins points if definitions remain intact.  
     - Loses if >1 definition is changed.  
  2. **Empiricist (Guardian of Observations):**  
     - Wins points if all observations are kept.  
     - Loses if any observation is discarded.  
  3. **Bridge-Builder (Guardian of Auxiliary Rules):**  
     - Wins points if bridge rules (BR₁–BR₃) are preserved.  
     - Loses if any bridge rule is altered.  

  **Scoring:**  
  - +1 point per element (definition/observation/bridge rule) preserved.  
  - -5 points if the system remains inconsistent.  
  - *Self-interest drives each group to protect their domain.*  

  ---

  ### **Materials**  
  - **Visual Network Poster:**  
    ```  
    R ───┬───→ H ───→ W ───→ S ───┬───→ E  
         │                        │  
    B ───┼───→ C ───→ L ───→ D ───┘  
    ```  
    Arrows show definitional dependencies (e.g., **R** → **H**).  
  - **Conflict Highlight:** "O₅ forces **W** and **L**, but definitions make them mutually exclusive!"  
  - **Revision Options Handout:**  
    - Redefine a term (e.g., **W** ↔ **H** ∨ **L**).  
    - Discard an observation (e.g., reject O₅).  
    - Alter a bridge rule (e.g., "Heavy" = weight > 50g on *both* scales).  

  ---

  ### **Rules & Procedure**  
  **Timeline (90 min):**  
  1. **Introduction (10 min):**  
     - Explain Zark language, roles, rules, and conflict.  
     - Distribute materials.  
  2. **Role Prep (10 min):**  
     - Role groups caucus: Discuss priorities and strategies.  
  3. **Deliberation Rounds (55 min):**  
     - **Round 1 (20 min):** Propose revisions.  
       - Any student proposes a change (e.g., "Redefine **L** ↔ **C** ∧ ¬**W**").  
       - Group discusses (5 min max per proposal).  
     - **Voting (Consensus):**  
       - Vote per proposal. Requires **7/10 votes** to pass (not unanimity, but supermajority).  
       - If passed, update the network poster.  
     - **Round 2 (20 min):** Repeat if conflict persists.  
     - **Final Round (15 min):** Urgency round—must resolve inconsistency.  
  4. **Debrief (15 min):**  
     - Report revisions and map to Quinean insights.  

  **Revision Constraints:**  
  - Max 2 terms changed (to preserve ≥6 terms).  
  - Each change must resolve the contradiction.  

  ---

  ### **Predicted Coordination Failure**  
  - **First Round Deadlock:**  
    Terminologists will veto definition changes, empiricists will veto discarding O₅, and bridge-builders will veto altering BR₂/BR₃. Students will initially push revisions onto others’ domains, causing gridlock.  
  - **Resolution Path:** Groups must negotiate trades (e.g., empiricists accept a bridge rule change if terminologists allow a redefinition).  

  ---

  ### **Debrief: Mapping to Quine**  
  1. **Revisions as Quinean "No Immunity":**  
     - If they **redefined a term** (e.g., **W**), map to: *Analytic truths (definitions) are revisable*.  
     - If they **discarded an observation** (e.g., O₅), map to: *Synthetic truths (observations) are revisable*.  
     - If they **altered a bridge rule** (e.g., BR₂), map to: *Auxiliary rules (background knowledge) are revisable*.  
     > *Quine’s claim: Any statement—analytic, synthetic, or auxiliary—can be revised to maintain coherence.*  

  2. **Localized Limitation:**  
     - **Missing Element:** *Global underdetermination of theory choice*.  
       - This exercise has one clear conflict (O₅ vs. definitions) and limited revision paths.  
       - In reality, Quine argues *countless* revisions are possible (e.g., change **H** instead of **W**, discard O₃, or invent new terms), with no empirical basis to choose.  
     - **Facilitator Addition:**  
       > "In real science, the same observations can justify infinitely many revisions. We altered a few links here, but Quine argues the entire 'web of beliefs' could be rewoven in radically different ways—all equally valid."  

  3. **Holism Preview:**  
     - "When you altered one definition (e.g., **W**), it rippled to **S**, **D**, and **E**. Quine calls this the *web of belief*: no term or observation stands alone."  

  ---

  ### **Outcome Notes**  
  - **Expected Revisions:**  
    - Most groups will alter BR₂/BR₃ (e.g., "Use Scale A only") or redefine **W**/**L** to allow overlap.  
    - Rare: Discarding O₅ (empiricists resist) or redefining core terms like **R** ↔ ¬**B** (terminologists resist).  
  - **Time Management:**  
    - If unresolved by 60 min, force a vote on top 2 proposals.  
  - **Post-Activity:** Name Quine/holism and assign "Two Dogmas" for next session.  

  This design forces trade-offs between analytic, synthetic, and auxiliary truths, letting students experience Quine’s thesis *before* encountering it formally. The constraint to preserve 6 terms ensures non-trivial negotiation, and roles ensure rational conflict mirrors scientific practice.
