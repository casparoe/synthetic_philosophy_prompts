  For the closing, a question contrasting socially constructed vs. arbitrary fabrication would check understanding. Maybe ask about the Meiji rituals: were they arbitrary or serving a purpose? That highlights intentionality without randomness.

  Gellner should be skipped. Mentioning him might add unnecessary complexity. Staying focused on Anderson and Hobsbawm keeps the session tight.

