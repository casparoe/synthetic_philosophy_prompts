  Below is a complete, runnable plan for your 80-minute session. It's structured to make students *experience* strategic voting and the fragility of strategy-proofness, culminating in a debrief that names Gibbard-Satterthwaite only at the end. The plan includes materials, timelines, and fixes for common pitfalls.

  ---

  ### **Pre-Session Setup**
  - **Preferences & Groups**: Assign each student one of four preference orders (mapped to hidden formality axis: A=proofs workshop, B=guest speaker, C=student debate, D=archive trip). Use this distribution for 18 students:
    - **Group 1 (6 students)**: A > B > C > D *(most formal)*  
    - **Group 2 (4 students)**: B > A > C > D  
    - **Group 3 (5 students)**: C > B > D > A  
    - **Group 4 (3 students)**: D > C > B > A *(most discursive)*  
    → Ensures single-peakedness on the hidden axis, avoiding chaos while allowing manipulation.
  - **Payoff Scheme**: Points translate to quiz exemptions (non-monetary, department-safe):  
    - **Voting Rounds**: Students earn points based on the winner:  
      - 4 points if top choice wins,  
      - 3 for 2nd,  
      - 2 for 3rd,  
      - 1 for last.  
    - **Design Contest**: Teams earn 10 points for creating an unbreakable rule OR 10 points for successfully breaking another team’s rule.  
    - **Final Scoring**: Total points (across rounds + contest) determine exemptions (e.g., top 20% full exemption, next 30% half exemption).  
  - **Materials**:  
    - Preference cards (1 per student, hiding the axis).  
    - Ballots: slips for plurality; ranking sheets for Borda.  
    - Poll placard: "Pre-Vote Poll: A: 32% ±5%, C: 30% ±5%, B: 24% ±5%, D: 14% ±5%" (noisy but actionable; true sincere split is A:33%, C:28%, B:22%, D:17%).  
    - Timer, whiteboard for tracking scores.  

  ---

  ### **Session Timeline (80 Minutes)**  
  **Goal**: Students witness manipulation across voting rules, then fail to design a strategy-proof system.  

  #### **0–5 min: Introduction**  
  - Explain the choice: "Decide the last two sessions: proofs workshop (A), guest speaker (B), student debate (C), or archive trip (D)."  
  - Distribute **preference cards** and explain payoffs.  
  - Clarify: "Preferences are fixed. Points determine quiz exemptions."  

  #### **5–20 min: Round 1 (Plurality with Poll)**  
  - **Rule**: "Vote for one option. Most votes wins."  
  - **Manipulation Trigger**: Show the **noisy poll** (above). Say: "This is a snapshot—actual votes may differ."  
  - **Vote**: Secret ballots. Tally publicly.  
    - *Expected sincere result*: A wins (A:6, B:4, C:5, D:3).  
    - *Payoffs*: Group 1:4, Group 2:3, Group 3:1, Group 4:1.  
  - **Debrief Prompt**: "Did the poll influence your vote? Who’s happy? Who wished they’d voted differently?"  

  #### **20–35 min: Round 2 (Borda Runoff)**  
  - **Rule**: "Rank all options. Points: 3 for 1st, 2 for 2nd, 1 for 3rd, 0 for last. Highest points wins."  
  - **Vote**: Sincere rankings (no poll). Tally points.  
    - *Expected sincere result*: B wins (A:26, B:37, C:31, D:14).  
    - *Payoffs*: Group 1:3, Group 2:4, Group 3:3, Group 4:2.  
  - **Reveal**: "Same preferences, but winner changed from A to B! Did sincere voting cost you?" (e.g., Group 1 got 3 now vs. 4 in Round 1).  

  #### **35–50 min: Round 3 (Open Season)**  
  - **Rule**: "Borda again—but now, vote strategically if you want." Allow 2 min for strategy whispers.  
  - **Key Twist**: **Allow abstention** (add "abstain" to ballot). Abstainers get 1 point (worse than last choice) to incentivize participation but highlight manipulation.  
  - **Vote**: Secret ballots. Tally.  
    - *Likely Outcomes*:  
      - Group 2 (B>A>C>D) might rank A last to hurt A.  
      - Group 3 (C>B>D>A) might push B down to lift C.  
      - Abstentions may split votes (e.g., if Group 1 fears B losing, they might abstain to avoid helping C/D).  
  - **Compare**: Show sincere Borda result (B wins) vs. actual. Highlight a voter who gained by manipulating.  

  #### **50–65 min: Design Contest**  
  - **Teams**: Split into 6 teams of 3. Assign each team a voter group (e.g., Team 1 = Group 1).  
  - **Challenge**:  
    - **Part 1 (5 min)**: "Design a voting rule that can’t be gamed. Ballots can be anything (ranks, scores, etc.), but must output one winner."  
      - *Prevent "ranked choice" cop-outs*: Require rules to be novel (no named systems). Ban dictator rules.  
    - **Part 2 (10 min)**: Rotate rules among teams. Each team tries to **break another team’s rule**:  
      - Given the rule and sincere preferences, submit a **false ballot for one voter** to improve their payoff vs. sincere voting.  
      - *Scoring*:  
        - Breaking team earns 10 pt if manipulation works.  
        - Rule-design team earns 10 pt if unbreakable.  
  - **Instructor Role**: Resolve disputes. If a rule is truly strategy-proof (e.g., random ballot), note it violates "non-dictatorship" or "determinism" (debrief fodder).  

  #### **65–75 min: Debrief**  
  - **Step 1: Contrast Rounds**  
    - "Round 1: Poll encouraged strategy. Round 2: Rule change altered outcomes despite sincere votes. Round 3: You manipulated—sometimes successfully."  
  - **Step 2: Map to Gibbard-Satterthwaite**  
    - "Why couldn’t you design an unbreakable rule? A theorem shows it’s impossible if a rule is:  
      1. **Deterministic** (same votes → same winner; not random),  
      2. **Non-dictatorial** (no one always decides),  
      3. **Allows ≥3 viable outcomes** (A, B, C were all contenders),  
      4. **Works for any preferences** (you could’ve had any ranking, not just single-peaked ones)."  
    - **Name it**: "This is the Gibbard-Satterthwaite theorem."  
  - **Step 3: Contrast with Arrow**  
    - "Arrow is about ranking *all* options under IIA; Gibbard-Satterthwaite is about strategic voting in *single-winner* rules. Different beasts!"  
  - **Step 4: Address Abstention & Non-Participation**  
    - "Abstention is a form of manipulation—but GS is about ballot *content*, not turnout. Turnout is a separate issue (e.g., ‘no show’ paradox). Today, we assumed participation."  

  #### **75–80 min: Wrap-Up**  
  - Award points. Final exemption tiers: Top 3 students (full), next 5 (half).  
  - "Real-world takeaway: All reasonable voting rules *can* be manipulated, but it doesn’t mean they *are* in practice. GS is about possibility, not frequency."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Collusion**: Teams coordinate in Round 3/contest.  
     - *Fix*: Emphasize individual payoffs. If caught, nullify points.  

  2. **Econ Major Blurts GS Early**:  
     - *Fix*: "Hold that thought—we’ll name it later. For now, focus on *feeling* why it happens."  

  3. **Sincere Voting on Principle**:  
     - *Fix*: Use their ballot to show lost payoff ("See? Sincerity cost you 2 points").  

  4. **Ties**:  
     - *Fix*: Pre-set tiebreaker (e.g., alphabetical order).  

  5. **Rule-Breaking Fails**:  
     - *Fix*: If no team breaks a rule, reveal a manipulation yourself (e.g., "What if a Group 1 voter ranked B last?").  

  6. **Small Group Dynamics**:  
     - *Fix*: Assign roles (e.g., "strategist," "calculator") to engage all.  

  ---

  ### **What the Game Can’t Deliver**  
  - **Not All Rules Are Shown Manipulable**: Students only see 3–4 rules. *Explicitly say*: "GS proves *every* non-dictatorial rule is manipulable in *some* preference scenario—even if we only tested a few."  
  - **Information vs. Frequency**: The game emphasizes manipulation *opportunities*, not real-world likelihood. *Clarify*: "GS is about what’s *possible* with perfect info. In reality, voters lack info or don’t bother."  
  - **Unrestricted Domain**: Students have single-peaked preferences. *Admit*: "We simplified preferences. GS holds even for chaotic rankings, like someone preferring D>A>B>C."  

  ---

  ### **Why This Works**  
  - **GS in Bones**: By Round 3, students *feel* manipulation. The contest forces them to confront why strategy-proofness fails.  
  - **Abstention Included**: It’s a secondary manipulation tool in Round 3, enriching discussion without muddying GS (handled in debrief).  
  - **Arrow Distinction**: Explicitly contrasted at the end to avoid conflation.  

  Run this, and they’ll internalize GS—not just hear it.
