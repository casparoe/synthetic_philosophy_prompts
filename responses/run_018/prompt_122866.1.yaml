  Model Answer:

  (a) We set up the decision matrix with states based on Death's location and acts of staying (S) or going (G). Utilities are:
  - S & Death in Damascus (D): 0
  - S & Death in Aleppo (A): 10
  - G & D: 9
  - G & A: -1

  The agent's credence that she will stay is p, which is also her credence that Death is in Damascus.

  Evidential Decision Theory (EDT) uses conditional probabilities. Given the infallible predictor, if the agent conditions on staying, Death is in Damascus with probability 1. Thus:
  - EU_EDT(S) = P(D|S) * 0 + P(A|S) * 10 = 1*0 + 0*10 = 0.
  - EU_EDT(G) = P(D|G) * 9 + P(A|G) * (-1) = 0*9 + 1*(-1) = -1.
  EDT recommends staying (0 > -1).

  Causal Decision Theory (CDT) uses counterfactual probabilities, holding Death's location fixed. Thus:
  - EU_CDT(S) = P(D) * 0 + P(A) * 10 = p*0 + (1-p)*10 = 10(1-p).
  - EU_CDT(G) = P(D) * 9 + P(A) * (-1) = p*9 + (1-p)*(-1) = 9p -1 + p = 10p - 1.

  At the initial symmetric credence (p=0.5):
  - EU_CDT(S) = 10*(0.5) = 5.
  - EU_CDT(G) = 10*0.5 - 1 = 4.
  CDT recommends staying (5>4). Therefore, both theories recommend the same pure act: staying.

  (b) Decision instability arises in CDT. If the agent becomes confident she will stay (p=1), then:
  - EU_CDT(S) = 10(1-1) = 0.
  - EU_CDT(G) = 10*1 -1 = 9.
  Thus, CDT recommends going (9>0). Conversely, if she becomes confident she will go (p=0):
  - EU_CDT(S) = 10(1-0)=10.
  - EU_CDT(G) = 10*0-1=-1.
  CDT recommends staying (10>-1). Hence, for each pure act, confidence in that act makes the alternative look better. Consequently, no pure act is ratifiable in CDT: conditional on believing she will perform it, the alternative has higher expected utility.

  For EDT, staying is ratifiable: even at p=1, EU_EDT(S)=0 and EU_EDT(G)=-1, so staying is best. The evidential theorist's slogan—do what you would most want to learn you will do—remains intact: learning you will stay yields utility 0, while learning you will go yields -1, so you would prefer to learn you will stay, matching EDT's recommendation.

  (c) A randomized strategy can be rational. Suppose the agent uses a fair coin (q=0.5 chance to stay). If Death cannot predict this, then his location is independent (assume he sets it randomly with probability 0.5 for each city). Then:
  - Probability she survives: 0.5 (she is in the city without Death).
  - Expected utility: 0.5 * [if she survives in Damascus: utility 10, or in Aleppo: utility 9] + 0.5 * [if she dies in Damascus: 0, or in Aleppo: -1] = 0.25*10 + 0.25*9 + 0.25*0 + 0.25*(-1) = 2.5 + 2.25 + 0 - 0.25 = 4.5.

  This is better than the best pure act in the deterministic case (0 or -1). The chance of survival increases from 0 to 0.5.

  Conceptually, decision theory might be seen as recommending acts, not randomization. However, in this case, only by being unpredictable can the agent achieve a positive outcome. If the only stable response is to randomize, it shows that decision theory must sometimes recommend mixed strategies to break prediction, especially when facing an infallible predictor. This suggests that rational agents may need to incorporate randomness to avoid being exploited by predictors.

