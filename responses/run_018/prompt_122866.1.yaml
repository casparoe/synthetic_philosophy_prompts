  ### Exam Question: Death in Damascus

  **Background:** An agent is in Damascus tonight and Death is coming for her. She may either stay in Damascus or travel to Aleppo. Death is an infallible predictor of what she will do: his location already matches whichever option she will in fact choose, so if she stays he is in Damascus and if she goes he is in Aleppo. She cannot causally influence his prediction; her act is merely a perfect indicator of his location. Before she decides, let \(p\) be her subjective probability that she will end up staying; because Death is infallible, her probability that Death is in Damascus is also \(p\). The utilities are as follows:  
  - If she stays and Death is in Damascus, utility = 0 (die in Damascus).  
  - If she stays and Death is in Aleppo, utility = 10 (survive in Damascus).  
  - If she goes and Death is in Damascus, utility = 9 (survive in Aleppo with journey cost).  
  - If she goes and Death is in Aleppo, utility = -1 (die in Aleppo after wasted journey).  

  **Tasks:**  
  (a) Compute the expected utility of staying and going for both evidential decision theory (EDT) and causal decision theory (CDT). Show that, at the agent’s initial credence of \(p = 0.5\), both theories recommend the same pure act. [5 marks]  
  (b) Explain the phenomenon of decision instability in this case: Why does becoming confident of performing one pure act make the alternative look better? Consequently, why is no pure act *ratifiable* (defined as maximizing expected utility conditional on believing that act will be performed)? What does this imply for the evidential decision theorist’s slogan: “Do what you would most want to learn you will do”? [10 marks]  
  (c) Could a randomized (mixed) strategy—e.g., deciding by a genuinely chancy quantum device that Death cannot predict—be rational? What expected utility would it yield? What would it show about decision theory if only an unpredictable action is stable? [5 marks]  

  ---

  ### Model Answer (Approx. 700 words)  

  **(a) EDT and CDT Recommendations and Convergence**  
  The decision matrix is:  

  | Act \ State | Death in Damascus (prob \(p\)) | Death in Aleppo (prob \(1-p\)) |  
  |-------------|--------------------------------|-------------------------------|  
  | **Stay**    | 0                              | 10                            |  
  | **Go**      | 9                              | -1                            |  

  - **EDT** uses conditional probabilities. Given Death’s infallibility, if the agent stays, Death is certainly in Damascus (\(P(\text{Death in Damascus} \mid \text{Stay}) = 1\)), and if she goes, Death is certainly in Aleppo (\(P(\text{Death in Aleppo} \mid \text{Go}) = 1\)). Thus:  
    - \(EU_{\text{EDT}}(\text{Stay}) = (1 \times 0) + (0 \times 10) = 0\).  
    - \(EU_{\text{EDT}}(\text{Go}) = (0 \times 9) + (1 \times -1) = -1\).  
    EDT recommends staying (0 > -1).  

  - **CDT** uses counterfactual probabilities: Death’s location is causally independent of the act, so probabilities are not updated by conditioning. Instead, utilities are weighted by prior credences:  
    - \(EU_{\text{CDT}}(\text{Stay}) = (p \times 0) + ((1-p) \times 10) = 10(1-p)\).  
    - \(EU_{\text{CDT}}(\text{Go}) = (p \times 9) + ((1-p) \times -1) = 10p - 1\).  

  At the initial symmetric credence (\(p = 0.5\)):  
  - \(EU_{\text{CDT}}(\text{Stay}) = 10 \times 0.5 = 5\).  
  - \(EU_{\text{CDT}}(\text{Go}) = (10 \times 0.5) - 1 = 4\).  
  CDT recommends staying (5 > 4). Thus, both theories converge on staying.  

  **(b) Decision Instability, Ratifiability, and the Evidential Slogan**  
  **Instability** occurs because the expected utility of each act depends on \(p\), and changes in \(p\) invert the recommendation. Specifically:  
  - If the agent becomes confident she will stay (\(p \approx 1\)), CDT evaluates:  
    - \(EU_{\text{CDT}}(\text{Stay}) = 10(1-1) = 0\).  
    - \(EU_{\text{CDT}}(\text{Go}) = 10(1) - 1 = 9\).  
    Going now looks better (9 > 0).  
  - If she becomes confident she will go (\(p \approx 0\)), CDT evaluates:  
    - \(EU_{\text{CDT}}(\text{Stay}) = 10(1-0) = 10\).  
    - \(EU_{\text{CDT}}(\text{Go}) = 10(0) - 1 = -1\).  
    Staying looks better (10 > -1).  

  This happens because \(p\) (credence of staying) directly sets the probability of Death’s location. High \(p\) implies Death is likely in Damascus, making staying dangerous; low \(p\) implies Death is likely in Aleppo, making going dangerous.  

  **Ratifiability**: An act is ratifiable if it maximizes expected utility *conditional on the agent believing it will be performed*. For CDT:  
  - Believing she will stay (\(p = 1\)) makes going better (9 > 0), so staying is not ratifiable.  
  - Believing she will go (\(p = 0\)) makes staying better (10 > -1), so going is not ratifiable.  
  Thus, no pure act is ratifiable in CDT.  

  For EDT, staying is ratifiable: even at \(p = 1\), \(EU_{\text{EDT}}(\text{Stay}) = 0 > EU_{\text{EDT}}(\text{Go}) = -1\). However, CDT’s instability undermines the possibility of settling on a pure act.  

  **Evidential slogan**: “Do what you would most want to learn you will do.” Learning you will stay implies Death is in Damascus (utility 0); learning you will go implies Death is in Aleppo (utility -1). Since 0 > -1, you would prefer to learn you will stay—aligning with EDT’s recommendation. But CDT’s instability shows that this slogan does not guarantee a stable choice: even if staying is preferred initially, confidence in it makes going desirable.  

  **(c) Mixed Strategy: Rationality and Implications**  
  A mixed strategy—e.g., staying with probability \(q = 0.5\) via a quantum device—breaks Death’s prediction. Death cannot anticipate the outcome, so his location becomes independent (assumed random with \(P(\text{Death in Damascus}) = 0.5\)). The expected utility is:  
  - \(P(\text{Stay and Death in Aleppo}) = 0.5 \times 0.5 = 0.25\), utility = 10.  
  - \(P(\text{Go and Death in Damascus}) = 0.5 \times 0.5 = 0.25\), utility = 9.  
  - \(P(\text{Stay and Death in Damascus}) = 0.25\), utility = 0.  
  - \(P(\text{Go and Death in Aleppo}) = 0.25\), utility = -1.  
  Overall \(EU = (0.25 \times 10) + (0.25 \times 9) + (0.25 \times 0) + (0.25 \times -1) = 2.5 + 2.25 + 0 - 0.25 = 4.5\).  

  **Rationality**: This yields a 50% survival chance and \(EU = 4.5\), exceeding pure acts (\(EU = 0\) or \(-1\)). It is appealing as the only way to avoid certain death.  

  **Conceptual difficulties**:  
  - Decision theory typically recommends *acts*, not randomization. A mixed strategy is a meta-policy, not an act, raising questions about whether rationality permits self-induced indeterminacy.  
  - Randomization might make the agent “less rational” by delegating choice to chance, but here it is necessary to exploit Death’s uncertainty.  

  **Implications**: If only mixed strategies are stable (as pure acts are unratifiable), decision theory must accommodate randomization when predictors are involved. This highlights that rational agents may need unpredictability to avoid exploitation, suggesting a limitation of standard theories in prescriptive guidance.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  **(a) EDT and CDT Recommendations and Convergence (5 marks)**  
  - **1 mark**: Correct decision matrix or utilities.  
  - **1 mark**: Correct EDT expected utilities (Stay: 0, Go: -1).  
  - **1 mark**: Correct CDT expected utilities (Stay: \(10(1-p)\), Go: \(10p - 1\)).  
  - **1 mark**: Evaluation at \(p = 0.5\) (EDT: Stay; CDT: Stay with 5 > 4).  
  - **1 mark**: Clear statement of convergence on staying.  
  *Common mistake: Misapplying conditional probabilities for EDT (e.g., ignoring infallibility) or not using \(p = 0.5\) for convergence.*  

  **(b) Instability, Ratifiability, and Slogan (10 marks)**  
  - **2 marks**: Explains instability for staying (high \(p\) makes going better).  
  - **2 marks**: Explains instability for going (low \(p\) makes staying better).  
  - **2 marks**: Identifies no pure act is ratifiable in CDT (via conditional belief).  
  - **2 marks**: Notes staying is ratifiable in EDT.  
  - **2 marks**: Analyzes the evidential slogan (prefer learning to stay due to 0 > -1).  
  *Common mistake: Failing to articulate how \(p\) updates Death’s location probability, or conflating CDT and EDT ratifiability.*  

  **(c) Mixed Strategy (5 marks)**  
  - **1 mark**: Proposes mixed strategy (e.g., \(q = 0.5\)).  
  - **1 mark**: Assumes Death’s independence (e.g., \(P(\text{Death in Damascus}) = 0.5\)).  
  - **1 mark**: Computes EU correctly (4.5).  
  - **1 mark**: Notes improvement over pure acts (e.g., survival chance 50% > 0%).  
  - **1 mark**: Substantive evaluation (e.g., conceptual difficulty with randomization, or stability via unpredictability).  
  *Common mistake: Incorrect EU calculation by not assuming independence, or no comment on implications.*  

  **Grading Standards**:  
  - **A (18–20)**: Precise mechanism of instability (e.g., \(p\) drives Death’s probability), substantive mixed-strategy evaluation (e.g., meta-rationality or predictor implications).  
  - **B (15–17)**: Correct computations and instability/ratifiability claims, but superficial treatment of updating or randomization.
