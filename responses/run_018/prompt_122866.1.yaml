  - 1 mark: evaluation at p=0.5 (EDT: stay; CDT: stay, 5>4).
  - 1 mark: clear statement that both recommend staying.
  Common mistake: Incorrect conditional probabilities for EDT; not using p=0.5 for convergence.

  (b) Instability and ratifiability (10 marks)
  - 2 marks: explanation that at p=1, CDT recommends going.
  - 2 marks: explanation that at p=0, CDT recommends staying.
  - 2 marks: statement that this means no pure act is ratifiable in CDT (because conditional on belief in the act, the alternative is better).
  - 2 marks: understanding that for EDT, staying is ratifiable.
  - 2 marks: discussion of the evidential slogan (learning you stay is better than learning you go, so the slogan holds and recommends staying).
  Common mistake: Not separating CDT and EDT in ratifiability; not explaining the updating of p.

  (c) Mixed strategy (5 marks)
