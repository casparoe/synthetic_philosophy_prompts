answer: |-
  **(Leaning on podium, coffee in hand)**  
  Morning, everyone. Look, we’ve all been in those zoning hearings where it feels like we’re speaking different languages. Planners talk "floor-area ratios" and "setback requirements"—residents talk "community character" or "why can’t I open my coffee shop?" Logical empiricism gives us a flashlight here, and it’s all about Rudolf Carnap’s split: **internal questions** (stuff *inside* a rule system) versus **external questions** (choosing *which* system to use).  

  Here’s the kicker: **We planners keep pretending zoning disputes are *internal*.** We treat conflicts like technical glitches inside "the framework"—debating if a proposal "complies" or if the traffic study "meets standards." But Carnap would call that a shell game. The real fight? It’s *external*. It’s about **which values get baked into the framework itself**.  

  Think about that downtown upzoning fight. We argued internally about "density caps" and "parking minimums." But the external question was: *Should we prioritize developer flexibility or preserve small-scale retail?* We never said that outright. We hid the value clash behind technical rules.  

  **And that’s where legitimacy collapses.** When citizens realize the "objective" rules weren’t neutral—that we *chose* a framework favoring growth over stability, or vice versa, without admitting it—they stop trusting the process. Suddenly, "compliance" looks like a rigged game. Carnap’s genius was spotting how easily we confuse "answering questions within a system" with "defending why we picked that system."  

  So next time we’re sweating over a variance request? Let’s name the external choice upfront: "This code assumes property rights trump neighborhood cohesion. Should it?" Otherwise, we’re not solving conflicts—we’re just postponing a reckoning.  

  ---

  **Three Angles for Reshaping Public Justification:**  
  1. **The Transparency Angle:**  
     - *Internal:* Technical debates within zoning codes (e.g., "Does this building meet height limits?").  
     - *External:* Confronting why height limits exist (e.g., "Do we value skyline aesthetics over housing density?").  
     - *Shift:* Planners must say: *"This isn’t just about measurement—it’s about what we measured* for *."*  

  2. **The Legitimacy Angle:**  
     - *Internal:* Authority comes from code compliance ("Your proposal violates Section 12.3").  
     - *External:* Authority comes from democratic value-setting ("Section 12.3 exists because voters prioritized X over Y").  
     - *Shift:* When citizens see the framework as arbitrary (external), compliance feels coercive. Admit the framework’s value-laden roots to rebuild trust.  

  3. **The Language Angle:**  
     - *Internal:* Using jargon ("nonconforming use," "variance criteria") to mask value judgments.  
     - *External:* Translating jargon into value conflicts ("‘Variance’ means we’re bending rules to favor economic need over strict uniformity").  
     - *Shift:* Reframe technical terms as value proxies—e.g., "Setbacks aren’t just numbers; they’re how much private space we sacrifice for public light."  

  **Core Niche Idea:**  
  Planning authority implodes when the public realizes the "neutral" framework was an *external* value choice disguised as an *internal* necessity. Carnap exposes how zoning legitimation relies on this illusion—and why shattering it (by naming external stakes) is the only path to durable public agreements.
