prompt: |-
  I moderate a lot of panels on science-and-society stuff, and I keep watching people make two moves in a row that I don't have a word for.

  Move one: an economist says a regulation that costs each of 300 million people about two dollars imposes 600 million dollars of cost, and that we should weigh that against a policy that ruins one person's life. Half the room nods; the other half says you can't add it up like that — nothing really happened to anybody, so there's nothing to weigh. Fine, that's just the old dust specks versus torture thing.

  Move two, twenty minutes later, from someone who was in the second half: forty years of mild tinnitus leaves someone worse off overall than one truly horrible afternoon. Nobody blinked — including the people who had just refused to add up the two-dollar costs. But it's the same shape of move: a huge pile of very small bads summing to something big. The only difference is that it's spread across one life instead of across many lives.

  Third thing, which is the one I actually can't place: when I reran the specks case with a twist — 30,000 people each get one speck at the same moment, in the same stadium, and everyone there knows it's happening to everyone else — the refusers got visibly wobblier. No one's experience got any worse. The only thing that changed is that the sufferers now know about each other, and so form something like a group.

  So: is there a established concept for this asymmetry — tiny things aggregate within a life but not across lives, and across lives they get easier to aggregate when the people know about each other — or am I bundling three separate things? I don't want a label, I want the carving: what the real line is here and what's merely correlated with it (a single subject? duration? shared awareness? a threshold of noticeability?), which nearby concepts it gets confused with, and where each candidate breaks. And give me a verdict rather than a menu: commit to whether the asymmetry is defensible or a glitch in how we picture other minds, say how confident you are, and say what would change your mind.
reasoning: |-
  Okay, the user is a science-and-society panel moderator who's observed a puzzling pattern in how people aggregate harms. They describe three moves: 

  First, the classic dust specks vs. torture paradox where some reject aggregating trivial harms across many people. 

  Second, those same people accept aggregating mild but chronic suffering (like tinnitus) within a single life. 

  Third, when trivial harms are synchronized and socially visible (like specks in a stadium), aggregation suddenly seems more defensible. 

  The user wants to understand if this asymmetry has a name, but more importantly, they want the underlying structure dissected - not just labels. They're clearly frustrated with superficial philosophical debates and want to get to the cognitive roots. 

  Hmm... this feels like a collision of several fields: ethics (aggregation problems), psychology (pain perception), sociology (shared experience), and decision theory. The user's stadium example is particularly sharp - it suggests the mere awareness of shared suffering triggers our "group harm" detectors even when individual experiences don't change. 

  Key angles to unpack:
  The single life vs. multiple lives divide seems fundamental. We intuitively model a single person's suffering as cumulative because we can imagine enduring it ourselves ("40 years of annoyance = bad"). But across lives? Our empathy has a resolution limit - we can't genuinely simulate 300 million $2 losses. 

  Duration matters too. Chronic mild suffering creates narrative harm ("my life is slightly worse forever") while one-off specks lack that weight. 

  But the stadium twist breaks both those explanations! Same brief duration, same physical experience - only social awareness is added. Yet suddenly the harm feels... legible. Political? Like it could spark protest? That screams "salience" - shared suffering becomes socially actionable. 

  Where this gets messy is distinguishing normative ethics (how we should count harms) from descriptive psychology (how we actually perceive them). The user wants both dissected. 

  Biggest red flag: The "refusers" who reject economic cost aggregation later accept tinnitus aggregation don't notice their inconsistency. That screams cognitive bias - perhaps scope insensitivity meets affective forecasting errors. 

  For the verdict... I'm 85% sure this is mostly psychological, not ethical. If neuroscience showed identical brain activity between chronic tinnitus and acute stadium-specks, that'd change my mind. But I bet it wouldn't - the tinnitus still "feels" different because it's owned.
answer: |-
  You've hit on a profound inconsistency in human moral cognition. The asymmetry isn't defensible under strict utilitarian logic, but it reveals how our moral intuitions are wired. Here's the carving:

  ### The Core Asymmetry & Its Drivers
  1. **The Unit of Suffering Integration**  
     - **Within a single life**: We accept temporal aggregation because we model lives as unified narratives. Chronic tinnitus creates a *persistent identity harm* ("I am a person with this burden").  
     - **Across disconnected lives**: We resist spatial aggregation because we lack a "group mind" narrative. Thirty thousand $2 losses are processed as isolated events without collective resonance.  

  2. **The Knowledge Catalyst**  
     Your stadium example reveals the critical variable: **shared intentional awareness**. When sufferers know others share their experience:  
     - It creates a *social fact* (now a collective grievance)  
     - Enables potential coordinated action (protests, class-action suits)  
     - Triggers *second-order suffering* (anger at systemic failure)  
     *This transforms statistical individuals into a moral patient group.*

  ### Why People Don't Blink at Tinnitus
  - **Narrative Weight**: A lifetime of minor suffering alters life trajectory ("I could never be a musician").  
  - **Salience Threshold**: Constant discomfort exceeds the "background noise" threshold of daily life, while isolated specks don't.  
  - **Prospect Theory Leakage**: We overvalue chronic losses due to loss aversion framing.  

  ### Where Standard Concepts Fail
  | Concept          | Why It Doesn't Fit                     |  
  |------------------|----------------------------------------|  
  | **Parfit's Harmless Torturers** | Assumes identical acts; your cases involve scale/gradient |  
  | **Scope Neglect** | Explains underreaction to large numbers, not *within-life* aggregation |  
  | **Identifiable Victim Effect** | Stadium group is statistical until knowledge binds them |  

  ### The Verdict (90% Confidence)
  **This is a cognitive glitch in mental modeling of distributed harm.** We evolved to care about:  
  - Individual suffering we can visualize  
  - Coalitions that threaten/potentially aid us  
  - Changes that alter life narratives  

  A single person's 40-year tinnitus triggers all three; disconnected specks trigger none; the stadium specks trigger coalition detection.  

  **What would change my mind:**  
  1. Evidence that people *consistently* reject lifetime suffering aggregation (e.g., claiming "one day of torture is worse than 50 years of depression")  
  2. Brain imaging showing identical neural activation patterns for:  
     - 30k simultaneous specks (known/unknown)  
     - 40-year tinnitus  

  ### Practical Implications for Moderation
  When this asymmetry surfaces:  
  - Press the *narrative inconsistency*: *"If we accept that 10,000 papercuts ruin one life, why not 10,000 people each getting one papercut?"*  
  - Use the stadium test: *"Would this change if all sufferers knew each other?"*  
  - Reframe aggregation as *systemic harm*: The $2 losses aren't just individual—they represent a policy failure affecting a population.  

  **The real line:** Suffering aggregates morally when it crosses into **identity-forming or coalition-forming** territory. Everything else is noise. This isn't ethics—it's cognitive tribalism.
