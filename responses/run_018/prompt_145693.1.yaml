answer: |-
  Here’s a dialogue between **Taylor** (defending Lewis’s framework as dynamic) and **Morgan** (arguing evolutionary dynamics are primary). They’re in a shared kitchen, post-debate cleanup:

  ---

  **Taylor:** Okay, back to Lewis. You think he’s *only* descriptive? I disagree. Take your garden space example: New residents subtly stop trimming the communal hedge. Old-timers notice, hesitate... but why? Because they’re *anticipating reactions*. If Mrs. Jenkins expects the new folks to ignore the old norm *and* expects her neighbors to *adapt* to that, she might grumble but stop trimming too. That’s not evolution—it’s mutual adjustment via layered expectations. Lewis’s "common knowledge" isn’t static; it’s a live network of predictions.

  **Morgan:** But that’s the post-hoc story! Did Mrs. Jenkins *actually* run a payoff matrix? No. She felt social pressure, saw others slacking, and drifted. Crucially, the norm didn’t flip until, say, 60% stopped trimming—a **drift threshold**. Before that, defectors were punished; after, the new slackers became the critical mass. That’s pure population dynamics: variation, selection, retention. Lewis just narrates the equilibrium *after* the threshold’s crossed.

  **Taylor:** Thresholds don’t escape anticipation! Why 60%? Because at that point, *everyone expects everyone else* to accept the new slackness as the baseline. The threshold isn’t magic—it’s the moment when mutual expectations *tip*. Lewis accounts for this: conventions are Schelling points where we coordinate *because* we know others see them too. The drift is gradual, but the stabilization is still coordination-driven.

  **Morgan:** But the mechanism isn’t conscious coordination—it’s **differential reinforcement**. Early defectors get dirty looks (negative feedback). But as more defect, the cost of *not* defecting rises (you waste time trimming alone). That’s not about "I expect you to expect..."—it’s behavioral learning. The threshold emerges from aggregated individual responses, not mutual modeling. Lewis smuggles in evolution by calling it "anticipation."

  **Taylor:** You’re reducing expectations to behaviorism. When the 60th person stops trimming, it’s not just reinforcement—it’s the **signal** that shifts expectations. Suddenly, *not* trimming becomes the salient solution to avoiding conflict or wasted effort. That’s Lewis: the new convention crystallizes because it’s now the obvious focal point. People don’t compute payoffs, but they *do* read social cues as proxies for shared understanding.

  **Morgan:** And how do cues become salient? Through frequency-dependent selection! If trimming drops to 40%, the *interpretation* of cues changes—because the social cost/benefit ratio flipped. That’s evolutionary game theory: norms as equilibria selected by changing environmental pressures (like new residents). Lewis’s "common knowledge" is the *outcome*, not the engine. The real work is in the pre-conscious drift—the threshold where noise becomes signal.

  **Taylor:** But the threshold *depends* on perceived consensus! If early defectors are seen as outliers (not "us"), the norm holds. If they’re seen as trendsetters, it collapses faster. That perception is *about* modeling others’ minds—Lewis’s core insight. Gradual change is layers of renegotiated mutual expectation, punctuated by tipping points when a new coordination point becomes common knowledge.

  **Morgan:** Agree it’s punctuated—but the punctuation is driven by blind aggregation, not negotiation. Once defectors hit a critical mass, the *environment* flips, and everyone adapts. Lewis gives a nice story about why the new norm sticks, but the *how* of the shift is emergent, not cognitive. You can’t have "tacit coordination" without positing a hidden payoff calculator in people’s heads.

  **Taylor:** Not calculators—heuristics! We use simple rules: "If most do X, expect X to persist." That’s *minimal* mutual modeling. And in drift, we constantly update that heuristic. Lewis’s framework bends; it doesn’t break.

  **Morgan:** ...Fine. But bend it enough, and it looks like evolution in a trench coat. Still, I’ll grant he explains *why* new norms feel inevitable once they land. But the landing? That’s threshold dynamics. Pass the sponge?

  **Taylor:** *(smirking)* Only if you acknowledge it’s a coordination game to avoid dishpan hands. Deal?  
  **Morgan:** *(grinning)* Evolutionary deal. Hand it over.

  ---

  ### Key Arguments Covered:
  - **Taylor (Pro-Lewis):**  
    - Gradual shifts involve constant renegotiation of mutual expectations.  
    - Tipping points/thresholds are when a *new* focal point becomes common knowledge.  
    - Anticipation is heuristic (not rational calculation), but still cognitive.  

  - **Morgan (Evolutionary):**  
    - Norm shifts are driven by aggregated behavioral feedback, not mutual modeling.  
    - "Drift thresholds" emerge from population dynamics, not conscious coordination.  
    - Lewis describes stabilization, not change—and smuggles in evolution by overstating cognition.  

  Both engage core tensions: whether thresholds require cognition, and if "expectations" are just behaviorism repackaged.
