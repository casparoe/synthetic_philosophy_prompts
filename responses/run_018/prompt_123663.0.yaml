  ### Brainstorming Symmetry-Breaking Setups
  1. **Positional Card Game**:  
     - Participants sit in a circle. Each draws a card with a directional role (e.g., "Clockwise Orbiter," "Counterclockwise Orbiter"). An "Axis" card is placed at the center. In Round 1, players use the Axis to assign identities. In Round 2, the Axis card is removed, forcing reliance on relative motion descriptions. In Round 3, all players rotate seats 180°, scrambling their spatial perspective.  
     - *Pros*: Simple materials (cards), emphasizes relational shifts.  
     - *Cons*: Risk of players using body positions to cheat.  

  2. **Token Placement on Grid**:  
     - Use a grid mat with a central axis marker. Players place two identical tokens (e.g., white stones) at symmetric points. In Round 1, the axis defines positions. In Round 2, the axis is covered. In Round 3, the grid is rotated 180°, and players must predict token locations.  
     - *Pros*: Visual and tactile, highlights spatial ambiguity.  
     - *Cons*: Grid lines may act as unintended reference points.  

  3. **Human Orbiter Simulation**:  
     - Two participants act as spheres orbiting a central pole. Others observe. In Round 1, the pole defines "left/right." In Round 2, the pole is removed, and orbiters move in opposite directions. In Round 3, all observers turn 180° while orbiters rotate, then predict who is who.  
     - *Pros*: Kinesthetic, reinforces motion-based relations.  
     - *Cons*: Body memory could bias judgments.  

  ---  
  ### Runnable Activity: **Orbital Identity Crisis**  
  **Core Idea**: Participants bet tokens to predict sphere positions after rotations. Scoring changes with each round to mirror the loss of reference frames. Forces engagement with intrinsic vs. relational properties.  

  #### Materials  
  - **Spheres**: Two identical white balls (e.g., ping-pong balls). Mark one with a hidden UV dot (invisible to players; for facilitator verification only).  
  - **Axis**: A 12-inch dowel or stick.  
  - **Rotation Device**: A lazy Susan turntable.  
  - **Tokens**: 15 blank poker chips (5 per team of 2–3 players; 3 teams total).  
  - **Blind**: A cardboard screen to hide rotations.  
  - **Timer**: Smartphone or stopwatch.  
  - **Reference Marker**: A small sticker (e.g., star) on the turntable edge to indicate "Reference Position X."  

  #### Setup  
  - Place turntable at center. Put axis in middle, spheres at opposite sides (e.g., north/south).  
  - Divide 7 participants into 3 teams (2–3 per team). Teams collaborate on bets.  
  - Give each team 5 tokens. Tokens = "betting currency."  

  #### Rules  
  - **Predictions**: Each round, teams bet on which sphere (A or B) will be at **Position X** (marked by sticker) after a rotation.  
  - **Betting**: Teams place 0–2 tokens in cups labeled "A," "B," or "?" ("indeterminate").  
  - **Scoring**:  
    - **Correct bet**: Double tokens wagered (e.g., bet 2 → win 4).  
    - **Incorrect bet**: Lose wagered tokens.  
    - **"?**": No gain/loss (safe but no reward).  
  - **Critical Constraints**:  
    - Players cannot use body-relative terms ("left of me"). Penalty: Lose 1 token.  
    - No physical marks on spheres. Facilitator verifies with UV light.  

  ---

  ### Minute-by-Minute Flow (Total: 90 min)  
  #### **Round 1: Axis Present** (20 min)  
  *Focus: Intrinsic properties + external reference.*  
  1. **Setup (5 min)**:   
     - Axis is visible. Facilitator assigns motion: "Sphere A orbits clockwise, Sphere B counterclockwise."  
     - Teams assign labels (e.g., "A = left of axis").  
  2. **Prediction (5 min)**:   
     - Hide setup with screen. Rotate spheres 180° *with axis fixed*.  
     - Question: *"Which sphere is at Position X now? Bet based on axis."*  
  3. **Reveal & Scoring (5 min)**:   
     - Remove screen. Verify with UV light. Award/lose tokens.  
  4. **Debrief Hook (5 min)**:   
     - *"How did you track them?"* → Highlight axis as a stable reference.  

  #### **Round 2: Axis Removed** (20 min)  
  *Focus: Weak discernibility (irreflexive relations).*  
  1. **Setup (5 min)**:   
     - Remove axis. Motion remains: "A orbits clockwise relative to B."  
  2. **Prediction (5 min)**:   
     - Hide setup. Rotate spheres 180° *without axis*.  
     - Question: *"Which sphere is at Position X? Use motion relations."*  
  3. **Reveal & Scoring (5 min)**:  
     - Verify. Teams win if they use relations (e.g., "A moves clockwise relative to B").  
  4. **Debrief Hook (5 min)**:  
     - *"Could you assign identities without the axis?"* → Introduce "irreflexive relations."  

  #### **Round 3: Global Rotation** (25 min)  
  *Focus: Symmetry argument against identity.*  
  1. **Setup (5 min)**:   
     - Remove all external cues. Rotate entire turntable 180° while hidden. Teams turn chairs 180° to disorient.  
  2. **Prediction (10 min)**:   
     - Question: *"Did Sphere A and B swap, stay put, or is identity indeterminate?"*  
     - Bet options: "Swap," "Same," or "?" (indeterminate).  
  3. **Reveal & Scoring (5 min)**:  
     - UV verification. **Critical**: Physically, spheres *did not swap* (rotation preserves identities).  
     - But "?" is the defensible answer due to symmetry. Score generously for "?" bets.  
  4. **Debrief Hook (5 min)**:  
     - *"Why couldn’t you be sure?"* → Frame identity crisis.  

  ---

  ### Predicted Problems & Solutions  
  - **Cheating via Spatial Memory**: Players peek during rotations.  
    - **Fix**: Use a screen; penalize teams 1 token per infraction.  
  - **Body-Reliance**: Using "near/far from door."  
    - **Fix**: Enforce "no body-based terms" rule; rotate chairs in Round 3.  
  - **Over-Confident Betting**: Teams ignore "?" option early.  
    - **Fix**: In Round 3, award 2 tokens for "?" (even if "safe"). Losses in Rounds 1–2 incentivize caution.  

  ---

  ### Debrief Framework (30 min)  
  **Map the Game to Philosophy**:  
  | **Round** | **Metaphysical Concept**          | **Debrief Question**                                  |  
  |-----------|-----------------------------------|-------------------------------------------------------|  
  | 1         | Intrinsic properties + reference  | *"How did the axis 'break symmetry'? Is this analogous to rigid designators?"* |  
  | 2         | Weak discernibility (relations)   | *"Did 'orbiting clockwise relative to the other' truly distinguish spheres? Why is this irreflexive?"* |  
  | 3         | Global symmetry & identity loss   | *"Why did rotation make identity indeterminate? Does PII fail here?"* |  

  **Key Takeaways**:  
  1. **Relational Properties**: Round 2 shows weak discernibility *can* work but depends on asymmetric relations.  
  2. **Symmetry Argument**: Round 3 mirrors Black’s point: without asymmetry, identity lacks grounding.  
  3. **Limitation of the Game**:  
     - *Cannot replicate modal isolation* (e.g., a world with one sphere). **Verbal supplement needed**: "Black’s spheres challenge whether identity requires discernibility. But what if only one sphere existed? PII defenders argue that *possible* differences matter—something we can’t simulate here."  

  **Final Prompt**:  
  *"In a symmetric universe, does identity persist? Or is it a linguistic tool?"*  
  Use token scores to spark debate (e.g., "Team 2 bet '?' in Round 3—defend your skepticism!").  

  This structure forces experiential tension, uses low-cost materials, and targets graduate-level insights. Run it as a "lived paradox" to prime deep discussion.
