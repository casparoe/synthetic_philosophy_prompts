answer: |-
  Subject: Draft Questions for Philosopher Interview on Structural Realism in QFT  

  Dear [Podcast Host],  

  Here’s a sequence of interview questions for your guest, designed to probe the nuances of her structuralist account of QFT. I’ve woven in anticipated replies and follow-ups to deepen the dialogue, focusing on pressure points from the literature while avoiding recapitulation of her core thesis.  

  ---  

  First, I’d press the distinction between her modal-dependency framework and epistemic structural realism. Given how readily relational ontologies risk collapsing into claims about our *access* to reality, how does she justify treating modal dependencies—these "could-given-actual" relations—as irreducibly metaphysical bedrock? I suspect she’ll argue these relations are primitives, not representations. If so, I’d follow up by asking: If modal relations are brute ontological facts, doesn’t this invite the very "structure without substance" objection that plagues traditional ontic structural realism—and if not, what *positive criterion* distinguishes her primitives from mere epistemic scaffolding?  

  Second, I’d challenge her on the problem of intrinsic properties. If all physical properties are exhaustively relational within the modal network, what accounts for the qualitative specificity of quantum states—say, the difference between an electron’s spin-up and spin-down configuration? She’ll likely appeal to structural symmetry classes (e.g., irreducible representations of the Poincaré group) as the ground of qualitative content. My follow-up would then be: But symmetries are formal constraints on *relations*; how do abstract equivalence classes generate the concrete "thisness" of phenomena without smuggling in intrinsic properties at the level of symmetry instances?  

  Third, to distinguish her view from eliminativism, I’d ask: How does your derivation of particles as emergent symmetry-breaking effects differ substantively from an eliminativist interpretation that dismisses particles as illusions? Her probable retort is that eliminativism denies objects altogether, whereas she recovers them as robust phenomena from field structures. The follow-up would probe: If particles emerge *solely* through broken symmetries of an underlying modal structure, isn’t their "objecthood" just a pragmatic label for patterns of relations—effectively conceding to eliminativism at the fundamental level?  

  Fourth, on empirical risk: What hypothetical observation—say, violations of Bell-type inequalities in high-energy regimes where particle number is indeterminate—would genuinely challenge your framework rather than being reinterpreted through structural adjustments? If she counters that modal dependencies can accommodate such data (e.g., via supervenience on non-separable field modes), I’d ask: Doesn’t this flexibility render your ontology empirically vacuous? What *couldn’t* be resolved by redescribing anomalies as new modal constraints?  

  Fifth, circling back to metaphysics: If modal relations are primitive, how does your account avoid a regress when explaining *why* certain dependencies hold—e.g., why a bosonic field permits superposition while fermionic fields obey exclusion? If she invokes structural laws as explanatorily terminal, I’d press: Aren’t laws typically grounded in properties or powers? How do you ground modal relations without reintroducing the very entities you’ve eliminated?  

  Finally, on emergence: If classical objects emerge from symmetry breaking, but symmetries are defined by the structure itself, isn’t this circular? How can structure "break" without pre-existing individuals to manifest the asymmetry? Her reply might appeal to relational instabilities. I’d then ask: If symmetry breaking is purely relational, does this imply that *all* ontological transitions—even the universe’s initial state—are merely shifts in modal structure? And if so, how is this not a form of Pythagoreanism?  

  ---  

  These questions thread through the tightest knots in structural realism—primitive modality, qualitative absence, empirical accountability—while respecting her unique synthesis of dynamism and emergence. Each follow-up targets potential retreats into formalism or epistemic deference, forcing clarity on what her ontology *excludes* as much as what it proposes.  

  Let me know if you’d like to sharpen any angle further.  

  Best,  
  [Your Name]
