  - At the trivial end: diagnostic labels obviously influence self-perception (semantic mechanism)
  - Intermediate: diagnosis can shape behavior in ways that reinforce the label (causal mechanism)
  - Radical: disorders have no pre-linguistic reality (ontological mechanism)

