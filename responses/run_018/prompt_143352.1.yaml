answer: |-
  Here's a logic audit of your commitments, ranking tensions by severity and suggesting targeted revisions:

  ### Ranked Tensions (High to Low Severity)
  ---

  **1. Tension between (iii) and (iv) [HIGH SEVERITY]**  
  - **Conflict:** (iv) claims modal faculties are unreliable for abstracta "unless anchored in formalization," but (iii) grants epistemic weight to mathematical conceivability *without* formal proof. This directly undermines (iv)'s reliability condition for abstract domains.  
  - **What must give:** Either (iii) must retreat to requiring formalization for *any* epistemic weight in math, or (iv) must allow that abstract domains can be reliably stress-tested *without* full formalization under certain conditions.  
  - **Least costly fix:** **Revise (iv)** to distinguish *types* of abstracta. Specify that mathematical structures (unlike e.g., moral properties) are uniquely amenable to reliable stress-testing via conceptual coherence alone due to their non-contingent nature.  
    - *Revision Suggestion:* "Representationally rigid for phenomenal properties and *non-formalizable* abstracta, but responsive to conceptual coherence in domains like mathematics."  

  **2. Tension between (ii) and (iii) [MODERATE SEVERITY]**  
  - **Conflict:** Both cases involve unconcluded formal proofs (zombies lack disproof, non-standard models lack consistency proof), yet you reject zombies as unstable under stress-testing while accepting math conceivability as evidence. This risks ad hoc treatment.  
  - **Resolution (Apparent Tension):** This dissolves if stress-testing **criteria differ by domain**. Zombies fail because adding *empirical constraints* (neurophysics) generates incoherence with *a priori* phenomenal concepts. Math structures face no empirical constraints—stress-testing checks *internal logical coherence*.  
  - **No revision needed** if you explicitly state: **Stress-testing targets domain-relevant incoherence** (empirical constraints for physical scenarios, logical consistency for math). Zombies collapse under *cross-modal* pressure; math structures don’t.  

  **3. Tension between (i) and (v) [LOW SEVERITY]**  
  - **Conflict:** (i) calls stress-testing "mandatory," while (v) says its epistemic weight depends on domain-nativeness. Is the *method* universal or domain-relative?  
  - **Resolution (Apparent Tension):** Distinguish **procedure** from **epistemic payoff**. Stress-testing is always *required* as a method (i), but its *success* at delivering justified beliefs (v) depends on domain.  
  - **Clarify wording:** "Stress-testing is a universal *gatekeeping requirement* for modal justification, but its *diagnostic power* varies across domains."  

  ---

  ### Summary of Required Adjustments
  1. **Crucial Revision:** Reformulate **(iv)** to exempt mathematics (or "formal abstracta") from the unreliability claim. This resolves the severe conflict with (iii).  
  2. **Clarification Needed:** Explicitly state that **stress-testing examines domain-specific coherence conditions** (empirical feasibility vs. logical consistency) to defuse the (ii)/(iii) tension.  
  3. **Terminology Refinement:** Sharpen the (i)/(v) distinction between **mandatory procedure** and **domain-sensitive reliability**.  

  ### Least Costly Overall Revision Path
  **Modify (iv) to:**  
  > *"our modal faculties are domain-specific: reliable for medium-sized physical/social scenarios under stress-testing, representationally rigid for phenomenal properties, but competent for mathematical abstracta when stress-tested for conceptual coherence."*  

  This retains your core claims while:  
  - Allowing (iii) to hold without contradicting (iv)  
  - Explaining (ii): Zombies fail due to *phenomenal* rigidity, not math-style coherence checks  
  - Preserving (i)/(v) with clarified scope  

  **Result:** Your framework becomes consistent by restricting the "unreliability for abstracta" clause in (iv) to *non-mathematical* domains (e.g., morality, metaphysics), while granting math a privileged status due to its susceptibility to pure conceptual analysis. Zombies are still excluded, but via phenomenal rigidity, not an arbitrary double standard.
