  I need to build this as a decision tree with five numbered items: (1) entry question, (2-4) three branch questions in sequence, and (5) unoccupied cells and indistinguishable leaves. Each branch must be labeled with a clear question that doesn't assume prior knowledge of theories. For the final item, I'll note any empty cells and indistinguishable positions, and ideally include a character-specific line.

  The tree structure should be:
  1. Entry question about the nature of disagreement
  2. Question about swapped foundations possibility
  3. Question about heritability/framing effects
  4. Question about scope of moral concern

  For the swapped foundations scenario, this belongs early in the tree since it challenges whether foundation profiles determine correctness. Heritability relates to debunking arguments about the origins of moral intuitions. The breadth question tests if wider concern implies correctness.

  I'll identify distinct positions like:
  - Foundation profiles track moral truth
  - Profiles reflect arbitrary alignment (swapped foundations)
  - Framing effects debunk both sides
  - Broader concern indicates correctness

  The empty cells might include positions that are incoherent (e.g., swapped foundations being possible while also claiming profiles track truth) or merely unattractive. Some leaves might be indistinguishable if they lead to similar conclusions despite different paths.

  For the character-specific line in item 5, I'll create something the academic might say about epistemic humility.
answer: |-
  1.  **Entry Question: What kind of disagreement primarily separates left and right regarding specific policies?** (Leaves: A - Weighting disagreement, B - Applicability disagreement, C - Factual disagreement)
  2.  **Branch A (Weighting): Could populations with identical moral foundation profiles plausibly develop opposing politics due to historical/cultural accident (swapped foundations)?** (Answers: Yes -> Leaf A1, No -> Leaf A2; A1's awkwardness: Undermines any direct link between profile correctness and political correctness. A2's awkwardness: Must explain why current alignments *aren't* accidental but reflect a deep truth.)
  3.  **Branch B (Applicability) & C (Factual): If foundation profiles are substantially heritable *and* shiftable by framing cues, does this debunk the correctness of the politics they predict?** (Answers: Debunks Both -> Leaf BC1, Debunks Neither -> Leaf BC2, Debunks Only One Side -> Leaf BC3; BC1's awkwardness: Leaves moral truth entirely disconnected from common intuitions. BC2's awkwardness: Must explain why origin/framing don't undermine justification. BC3's awkwardness: Requires a non-arbitrary reason why one side's intuition is immune.)
  4.  **Branch All Leaves: Does the consistent tendency of one profile (e.g., higher care breadth) to concern itself with a wider moral circle (more distant people, beings, times) provide evidence that its politics are *more* correct?** (Answers: Yes -> Leaf X, No -> Leaf Y; X's awkwardness: Risks conflating scope with accuracy, potentially justifying impractical demands. Y's awkwardness: Must dismiss breadth as morally irrelevant output.)
  5.  **Unoccupied:** Cell combining A1 (swapped possible) & BC3 (debunks only one side) is incoherent (if profiles don't determine correctness inherently, they can't debunk one side specifically). Cells combining C (Factual) with BC1 (debunks both) or X (breadth=correct) are merely unattractive/unclaimed (factual focus clashes with deep debunking/scope arguments). **Indistinguishable Leaves:** A2 (no swap, weighting primary) & BC2 (heritability/framing debunk neither) both strongly defend profile-politics link, differing only in *why* origins aren't damning. "The heritability data isn't a gotcha; it just shows our moral grammars are innate, like Chomsky's linguistic universals, which obviously doesn't mean Spanish is *wrong*," says the academic, wiping his glasses.
