  ## The Room Where Spectra Sleep

  Her screens show pale gradients, sharp and clear—  
  **She knows all wavelengths, cones, rods, the chain—**  
  **Yet knows no rose's red, no sky's blue here.**  
  Through texts and diagrams, devoid of fear,  
  She maps the cortex, traces optic gain.  
  Her screens show pale gradients, sharp and clear—  

  No camera feeds the model, eye, or ear;  
  It trains on grayscale maps, a flat terrain.  
  **Yet knows no rose's red, no sky's blue here.**  
  Its weights compute on RGB, held dear  
  As data streams where hidden hues remain.  
  Her screens show pale gradients, sharp and clear—  

  Do matrices *perceive* the vibrant sphere,  
  Or just transform the tensors, cold and plain?  
  **Yet knows no rose's red, no sky's blue here.**  
  Does silicon sense what we hold so near,  
  Or merely mimic color's bright domain?  
  Her screens show pale gradients, sharp and clear—  

  The door swings wide! Now pigments appear!  
  What dawns for Mary freed from coded pain?  
  **She knows all wavelengths, cones, rods, the chain—**  
  Is it a *fact* unveiled, shining and sheer,  
  Or just a different path through neural lane?  
  **Yet knows no rose's red, no sky's blue here?**  

  The model lacks the sensor, held austere  
  Like Mary's room, a question to sustain:  
  **She knows all wavelengths, cones, rods, the chain—**  
  **Yet knows no rose's red, no sky's blue here.**

  ---

  **Notes on Precision & Structure:**

  1.  **Refrains:** The two alternating refrains enact the epistemic gap:
      *   **"She knows all wavelengths, cones, rods, the chain—"**: Captures the exhaustive *propositional* knowledge of the physical/functional processes of color vision (optics, retinal biology, neurology).
      *   **"Yet knows no rose's red, no sky's blue here."**: Captures the absence of *phenomenal acquaintance* – the subjective experience, the "what-it-is-like" of seeing red or blue, emphasized by the confinement ("here").

  2.  **Analogy (Middle Tercets):** The vision model analogy is introduced:
      *   Trained solely on grayscale feature maps (abstract representations).
      *   Receives RGB tensors (color data as input).
      *   Lacks any camera or embodied sensor loop (no direct sensory input/feedback).
      *   The question posed: Does its processing ("matrices," "weights") constitute genuine perception ("*perceive* the vibrant sphere") or merely computation ("transform the tensors," "mimic color's bright domain")? This mirrors the question about Mary's knowledge.

  3.  **Turn (Final Quatrain):** The pivotal questions are posed upon Mary's release:
      *   Does she gain a *new fact* or just a *new mode of access* to facts she already knew propositionally?
      *   Is the model's lack of a sensory modality analogous to Mary's lack of phenomenal experience before release?

  4.  **Envoi:** The final two lines pair the refrains verbatim, leaving the core tension unresolved, as per Jackson's intended challenge.

  5.  **Philosophical Stance:** The poem presents the scenario *as Jackson intended it*: not as a conclusive refutation ("decisive refutation" is avoided), but as a powerful **demand for explanation** directed at physicalism. The persistent gap between the completeness of physical knowledge recited in the first refrain and the undeniable absence declared in the second refrain ("Yet knows no rose's red...") highlights the core issue: **why does exhaustive physical knowledge seem to leave the subjective experience itself unaccounted for?** The poem ends with this question hanging.
