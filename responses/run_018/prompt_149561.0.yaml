  5.  **Awkward: Trivialization via Granularity.** Defining domains too finely makes revision impotent (e.g., indexing every atomic proposition), while defining them too coarsely collapses back to globalism; finding a principled, non-ad-hoc middle ground is difficult, and defenders risk unfalsifiability by making granularity context-dependent.
