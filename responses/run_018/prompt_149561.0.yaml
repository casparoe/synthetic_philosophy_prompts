  1.  **Fatal: Violation of Probability Calculus.** Bayesian formalizations of belief revision (e.g., Garber's approach) demonstrate that avoiding global updates when encountering a contradiction requires violating the laws of probability or conditioning, making the local-index approach mathematically incoherent for probabilistic agents; defenders often reject Bayesianism entirely, moving towards unfalsifiability.
