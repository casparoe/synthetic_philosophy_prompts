prompt: |-
  Right, so I've been chatting with friends about why everyone seems exhausted but still acts like being busy is a personallity trait. I keep noticing this specific argumentative dance around overwork — not just in Japan with that death-from-overwork thing, but everywhere with grindset culture and debates about shorter working weeks. Someone will defend insane hours by saying work gives life meaning, that rest is basically moral failure, and people should be proud of dedication. But the second you suggest actualy cutting hours — like making the 35-hour thing real with proper enforcement — they flip and say 'it's not about pride, it's survival, global markets don't sleep, if we relax we lose.' Then if you come back with 'fine, then let's regulate markets or split jobs', they flip again to 'you're attacking people's dignity and passion, not every job can be clock-watched.' So it's two totally different reasons that happen to share the same vibe — hard work is good — but one is about personal virtue and one is about unavoidable economics. They don't back each other up at all, they just take turns being the shield.

  Is there an actual name for this exact two-shield cycling thing? I know it's not quite motte-and-bailey because neither version is clearly the 'safe' core, and it's not just someone being hypocritical because both arguments get used sincerely. If there's no established term, can you coin one with proper boundries? I need to know exactly when it applies — like, does it require both frames to be present, or just any incompatible pair? And how's it different from plain equivocation on the word 'work'? Please answer in British English, ta.
reasoning: |-
  Okay, the user has described this frustrating pattern where people defend overwork using two conflicting arguments: one based on moral virtue (work gives life meaning, rest is laziness) and another based on economic necessity (we must work long hours to survive in competitive markets). When challenged on one front, they switch to the other. The user wants to know if there's a name for this specific rhetorical tactic.

  First, I recall common logical fallacies. Motte-and-bailey comes to mind, but that usually involves a defensible core position (motte) and an extreme one (bailey). Here both arguments seem equally emphasized, neither being clearly the "safe" fallback. Equivocation is another possibility, but the issue isn't just shifting definitions of "work" - it's fundamentally incompatible premises (moral vs economic). 

  The user's observation feels culturally significant - they mention Japan's karoshi but note it's global, tying into grind culture and work-hour debates. Their frustration suggests they want to articulate this precisely, perhaps to counter such arguments more effectively. The request for coining a term makes me think they need conceptual clarity for discussions with friends.

  So what makes this distinct? The key is the *seamless switching* between two independent defenses that share only a superficial "hard work good" vibe. It's like having two unrelated shields rather than a layered defense. Neither argument supports the other - they just alternate as convenient. 

  For terminology, "Janusian Rhetoric" captures the two-faced nature (Janus being two-headed). "Dialectical Shield-Cycling" emphasizes the alternating protection. "Argumentative Bilocation" plays on occupying two contradictory positions. 

  Important boundaries: Both frames must be actively used by the same side, not just different people. The incompatibility matters - if both were consistent defenses (e.g., "work is virtuous AND necessary"), it wouldn't count. And it's not hypocrisy unless the person denies the contradiction.

  The user also asked how this differs from equivocation. While wordplay might be involved (e.g., vague definitions of "dedication"), the core issue is the logical clash between moral and economic frameworks, not semantic trickery alone. 

  I'll structure the response to first confirm no established term exists, then offer coined options with clear definitions and examples. Should emphasize the cycling aspect and explain why motte-and-bailey doesn't fit. British English phrasing like "ta" and "whilst" will keep it consistent with their request.
answer: |-
  Right, you've nailed a deeply frustrating and pervasive rhetorical manoeuvre! You're correct that it doesn't fit neatly into existing categories like motte-and-bailey or simple hypocrisy. There isn't a single, universally recognised term for *this exact specific* "two-shield cycling" tactic, but we can absolutely dissect it and coin something precise.

  **Core Characteristics of the Phenomenon:**

  1.  **Two Distinct, Incompatible Defences:** Two separate justifications for the *same behaviour/policy* (e.g., long working hours) are employed.
  2.  **Shared Superficial Vibe:** Both shields share a surface-level allegiance to a broad, socially valued concept ("Hard Work is Good").
  3.  **Mutual Exclusivity Under Scrutiny:** The core logic underpinning each shield fundamentally contradicts the other (Virtue vs. Survival).
  4.  **Contextual Switching:** The defender seamlessly switches shields depending on the *type* of challenge presented:
      *   Challenge the *moral necessity* of overwork? → **Shield 1 (Virtue/Purpose):** "Work gives meaning! Rest is laziness! Dedication is noble!"
      *   Challenge the *practical necessity* of overwork (e.g., propose shorter hours)? → **Shield 2 (Survival/Necessity):** "It's not pride, it's survival! The market demands it! We'll lose competitiveness!"
      *   Propose systemic solutions addressing *Survival*? → Flip back to **Shield 1 (Virtue/Purpose):** "You're attacking passion/dignity! Work isn't just clock-watching!"
  5.  **Sincere Deployment (Often):** Both shields may be used sincerely by the defender, reflecting internalised cultural contradictions rather than deliberate deceit.
  6.  **Immunisation Against Critique:** The cycling makes the position seem impregnable. Any attack is deflected by the *other* shield, preventing a coherent counter-argument from landing.

  **Why Existing Terms Don't Quite Fit:**

  *   **Motte-and-Bailey:** Requires a defensible core (motte) and an indefensible but desirable extension (bailey). Here, *neither* position is clearly the "safe" core; both are used as primary defences interchangeably. There's no hierarchical retreat.
  *   **Hypocrisy:** Focuses on a disconnect between stated belief and action. This is about contradictory *beliefs* used rhetorically to defend the *same* action/policy.
  *   **Equivocation:** Involves deliberately shifting the meaning of a *single term* (e.g., "work"). While the definition of "work" or "dedication" might be fuzzy here, the core issue is the fundamental incompatibility of the *frameworks* (Virtue vs. Survival), not just semantic slippage of one word. The equivocation is on the *justification*, not primarily the subject.
  *   **Cognitive Dissonance:** Explains the *internal* psychological discomfort of holding contradictory beliefs. This describes the *external rhetorical tactic* used to *defend* a position *despite* those contradictions, often exploiting the dissonance in the audience or shifting blame.
  *   **False Dilemma / Bifurcation:** Presents only two options when more exist. This cycling *uses* two contradictory options as shields, but doesn't necessarily present them as the *only* choices in the initial argument.

  **A Coined Term: Janusian Shield-Cycling**

  *   **Janusian:** From Janus, the Roman god of beginnings, gates, transitions, time, duality, doorways, passages, and endings, often depicted with two faces looking in opposite directions. Perfectly captures the two contradictory faces presented.
  *   **Shield-Cycling:** Explicitly describes the tactical alternation between the two defensive positions.

  **Definition of Janusian Shield-Cycling:**

  > A rhetorical tactic where a defender of a contested behaviour, practice, or policy (e.g., overwork culture) alternately employs **two fundamentally incompatible justificatory frameworks** (e.g., Moral Virtue and Economic Necessity), seamlessly switching between them in response to specific critiques. This cycling leverages a superficial shared allegiance to a broad value (e.g., "Hard Work Good") while exploiting the mutual exclusivity of the underlying logics to immunise the position against coherent counter-argument. Neither framework acts as a consistent core or fallback position; they are utilised situationally as defensive shields.

  **Boundaries for Application:**

  1.  **Requires Both Frameworks:** The tactic is defined by the *presence and active cycling* between two distinct, incompatible shields. One shield alone is just an argument. The *cycling* is key.
  2.  **Incompatibility is Key:** The shields must rely on logics that genuinely conflict under scrutiny (e.g., "It's noble choice" directly contradicts "It's forced necessity" when proposing alternatives). Two *compatible* arguments aren't Janusian Cycling.
  3.  **Defensive Function:** It's employed specifically to deflect criticism of the *status quo* or a specific practice. It's not just describing a tension; it's weaponising it rhetorically.
  4.  **Actor Consistency:** Typically observed when *the same individual or group* uses both shields interchangeably. Different people using different arguments isn't necessarily this tactic.
  5.  **Superficial Unifier:** There must be an overarching, vague value (like "hard work") that both shields *claim* to serve, masking their underlying contradiction.

  **How it Differs from Equivocation on "Work":**

  While the meaning of "work" might be stretched, the core of Janusian Shield-Cycling is the **fundamental clash between the *frameworks* used to justify it.** Equivocation focuses on the ambiguity of a term *within* an argument. Here:
  *   The Virtue Shield defines "work" as *meaningful endeavour, expression of character, source of pride*.
  *   The Survival Shield defines "work" as *economic compulsion, necessary input, unavoidable grind*.
  The cycling leverages the *entirely different value systems* these definitions imply (Ethics/Morality vs. Economics/Survival), not just a slippery definition. The equivocation is a *symptom* of the deeper framework clash, not the root cause of the tactic.

  **In short:** What you're describing is **Janusian Shield-Cycling**. It's the deployment of two incompatible defensive frameworks (Virtue & Necessity), cycled situationally, exploiting a superficial shared value ("Hard Work Good") to protect an exploitative or undesirable status quo from coherent critique, all while sidestepping the inherent contradiction. It perfectly captures that infuriating "whack-a-mole" feeling you get arguing against overwork culture. Spot on analysis, ta! Now you've got the term to call it out.
