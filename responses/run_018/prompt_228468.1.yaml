answer: |-
  You've precisely diagnosed the core tension in the consequentialist reply to Williams. Let's stress-test it rigorously, focusing on exposure points rather than defense:

  **1. The Asymmetry Charge (Which objections damage the defense?)**
     * **Damaging Concession:** Defenders must concede that **their theory cannot directly guide action in morally critical moments without self-sabotage.** The criterion is practically inert (or actively harmful) at the point of decision. This creates a *structural gap* between justification and agency that rivals (e.g., virtue ethics, some deontologies) don't share to the same degree. The "sophistication" is an admission that the core theory, applied naively, is self-defeating.
     * **Asymmetry Reality:** Yes, the move *is* asymmetrically applied. Consequentialists readily accept it for themselves but often reject analogous moves from deontologists facing "cluelessness" or "demandingness" objections. The reason isn't purely hypocrisy:
          *   **Justificatory Burden:** Consequentialism grounds *everything* in outcomes. A deontologist distinguishing criterion/deliberation needs to explain *why* the true criterion of duty isn't action-guiding without invoking consequences as the ultimate justification, which risks collapsing into consequentialism. The consequentialist reply *fits* their justificatory structure; it’s harder for deontology to do this without undermining its core claims about intrinsic rightness.
          *   **The Danger:** If *every* theory can deflect counterexamples by pushing them into "suboptimal deliberation," moral philosophy risks becoming vacuous. The consequentialist defense *only* works if the disposition-based deliberation *reliably tracks* the consequentialist criterion *better* than direct calculation. If this tracking claim fails (see point 2), the defense fails catastrophically. Deontologists often argue their rules *are* the optimal deliberation guides for recognizing intrinsic duties, making the distinction less necessary or attractive for them.

  **2. Falsifiability & Empirical Bite (Has it bought immunity?)**
     * **The Core Vulnerability:** The position **is falsifiable if sophisticated deliberation demonstrably fails to maximize expected value compared to alternative (even non-consequentialist) decision procedures in a wide range of critical cases.** This requires empirical evidence about real-world decision-making under moral pressure.
          *   **Decisive Defeater:** Robust empirical psychology/sociology showing that dispositions cultivated for consequentialist reasons (e.g., "I should love my wife fiercely *because* it leads to better outcomes") systematically lead to *worse* real-world consequences than dispositions cultivated under non-consequentialist frameworks (e.g., "Love is intrinsically valuable") or than highly trained, rule-based consequentialist calculation *in domains where calculation is feasible*. If "sophisticated" agents reliably produce suboptimal outcomes *compared to alternatives*, the claim that this is the *best consequentialist strategy* collapses.
          *   **Awkward Consequence:** Evidence that the *motivation* behind the disposition matters for its resilience and effectiveness. If dispositions cultivated *purely* as instrumental tools ("I love you because it maximizes utility") are more fragile, prone to breakdown under stress, or lead to subtly different (worse) behavior than dispositions cultivated as intrinsically valuable ("I love you, full stop"), this is awkward. It suggests the consequentialist *reason* for having the disposition might undermine the disposition itself, creating a self-referential paradox. The theory survives, but its practical implementation looks unstable.
     * **Immunity Charge:** The theory avoids *conceptual* refutation via thought experiments like George/Jim by pushing the failure onto suboptimal psychology. However, **it trades conceptual immunity for empirical vulnerability.** It makes a strong, testable claim: *This specific psychological strategy (cultivating non-consequentialist dispositions for consequentialist reasons) is the most reliable way to achieve consequentialist ends in the real world.* If this claim is empirically false, the defense fails *as a consequentialist strategy*, even if the *criterion* remains conceptually coherent.

  **3. The Costless-Deliberation Variant (Does it expose a deeper flaw?)**
     * This variant **fatally undermines the *standard* criterion/decision-procedure reply** as a complete answer to Williams. If calculation is costless, seamless, and perfect, the consequentialist *must* endorse the agent who saves their wife *because* the calculation says so. The "one thought too many" objection persists even when the "thought" imposes no practical cost.
     * **What This Shows:**
          *   **Missed Target:** It demonstrates Williams' objection is **primarily about justification, not psychology.** The complaint is that consequentialism provides the *wrong kind of reason* for saving one's wife. Love, loyalty, and integrity demand that the reason be *directly* about the beloved, the project, the commitment – not a derivative consequence of a global calculation. The "one thought too many" is the thought that *replaces* or *mediates* the direct, partial concern with an impersonal justification, even if done instantaneously.
          *   **Consequentialist Response *Within* the Variant:** The sophisticated consequentialist must bite the bullet: "In this perfect world, yes, the agent saving his wife *because* the calculation says it's optimal *is* the ideal. The feeling of 'one thought too many' is a lingering irrational intuition from our imperfect world where calculation *is* costly and error-prone." They must argue Williams' intuition *does* depend on smuggling in hesitation/phenomenology or the inherent value we *mistakenly* place on the *experience* of non-mediated partiality.
          *   **Exposure:** This reveals the **fundamental normative clash.** The consequentialist insists that only consequences ultimately matter; any "direct" reason (like love) is only instrumentally valuable. Williams (and critics) insists that certain commitments *constitutively* define the agent and their reasons in a way that cannot be reduced to, or overridden by, impersonal consequences without destroying something fundamental about agency and value. The costless-deliberation variant forces the consequentialist to admit that if they could, they *would* replace "I save her because she's my wife" with "I save her because U(max)", even if seamlessly. For Williams, *that admission itself* is the refutation – it shows consequentialism cannot accommodate the intrinsic normative force of personal commitments within a life lived with integrity.

  **4. Collapse into Rivalry (When does the disagreement vanish?)**
     * The position **collapses into a rival if the 'sophisticated' dispositions and actions become indistinguishable *in both justification and motivation* from the rival theory, *and* the consequentialist criterion becomes practically irrelevant or epiphenomenal.**
          *   **Motivational Collapse:** If the sophisticated consequentialist *in the moment* isn't just *acting* like a virtue ethicist/deontologist but is *motivated* by the same reasons ("I do this because it's loyal/loving/just," *not* "I do this because my disposition, cultivated for consequentialist reasons, prompts me to, and loyalty/love/justice are instrumentally valuable"), then consequentialism has effectively been abandoned as a theory of *reasons for action*. The consequentialist justification becomes a detached, post-hoc rationalization.
          *   **Criterion Irrelevance:** If the dispositions cultivated are so robust that they *never* yield to direct consequentialist calculation in practice (even when, by the consequentialist's *own* lights, calculation suggests they should), and the agent rejects such calculation as alien to their character, then the consequentialist criterion plays no actual role in guiding or justifying their actions. It's a theoretical ghost.
          *   **Distinguishing Feature:** The disagreement persists **if the consequentialist maintains that the dispositions are *contingent* tools that *could* be overridden *if* (counterfactually) a clear, overwhelming, demonstrable gain in overall value required sacrificing a core commitment.** The sophisticated consequentialist must believe that if saving their wife *genuinely* meant causing catastrophic, undeniable harm to thousands, they *ought* (and perhaps *would*, if sufficiently rational) override their love. The true deontologist or virtue ethicist would deny this, seeing the commitment as providing a *defeasible* or even *absolute* reason that cannot be outweighed by aggregate consequences. **The possible world where they differ is precisely the tragic world where supreme emergency seems to demand the unthinkable sacrifice of the personal for the impersonal.** In less extreme worlds, their actions converge, but their underlying justifications and what they believe they *ought* to do in extremity diverge.

  **Verdict on the Reply: A Protective Belt with Critical Seams**

  Your suspicion is largely correct. The criterion/decision-procedure distinction is **primarily a protective belt** against objections targeting the *psychology* of deliberation. It successfully deflects charges of "constant calculation" as a misunderstanding of how a *good* consequentialist would operate. However, the stress test reveals critical seams:

  1.  **It concedes the practical inertness of the core theory.**
  2.  **It shifts the burden to a vulnerable empirical claim about optimal psychology.**
  3.  **It fails to address Williams' deeper objection about *justification* and the nature of reasons, exposed starkly by the costless-deliberation variant.** Here, the reply simply doesn't touch the core complaint about the "wrong kind of reason."
  4.  **It risks collapse if the dispositions become constitutive rather than instrumental.**

  **The "real work" the reply does is narrow:** it shows that consequentialism isn't *self-evidently* psychologically impossible or self-destructive *if* we adopt a complex, indirect strategy. **However, it does not answer Williams' fundamental challenge:** that even if successfully implemented, this strategy provides the wrong *justification* for our deepest commitments, thereby undermining the integrity it seeks to mimic. The defense protects the theory's *logical coherence* against charges of deliberative impracticality but leaves its *normative adequacy* regarding personal integrity deeply contested. The insulation is strong against *some* attacks, but Williams' objection, properly understood as targeting justification, pierces it.
