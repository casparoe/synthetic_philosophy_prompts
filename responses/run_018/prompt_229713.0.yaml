                  Or maybe they choose q=0.8: then expected payoff = (1/2)*[ (1-0.8)*(3*0.8+1) ] + (1/2)*(3*0.8+1) = ... = (1/2)[0.2*(2.4+1)] + (1/2)*(2.4+1) = (1/2)(0.2*3.4) + (1/2)*3.4 = (1/2)(0.68) + 1.7 = 0.34+1.7=2.04? Actually for q=0.8: 5*0.8+2-3*(0.64) = 4+2-1.92=4.08 -> divided by 2 is 2.04.

                  But they might not compute. They might choose q=0.5: then (1/2)(5*0.5+2-3*0.25)= (1/2)(2.5+2-0.75)= (1/2)(3.75)=1.875.

          The maximum at stage2 is at q=5/6≈0.833 -> then we get (1/2)(5*(5/6)+2-3*(25/36)) = (1/2)(25/6+12/6-25/12) = (1/2)(50/12+24/12-25/12)= (1/2)(49/12)=49/24≈2.0417.

          We can then point out that in stage2, the best choice is q=5/6, which gives about 2.04, but if you had to use that plan from the beginning, you would only get 0.58.

   7. Debrief mapping:

          - Planning phase (stage1): This corresponds to the driver, before starting the trip, choosing a strategy p (the probability to exit at any intersection). We found that p=1/3 is best.

          - Mid-run revision (stage2): This corresponds to the driver waking up at an intersection and not knowing which one. They choose a new strategy q for the rest of the trip. We found that q=5/6 is best in this situation.

          - The indistinguishability: In stage2, the driver doesn't know if it's the first or second intersection, so they have to base their decision on the belief (which we modeled as 50/50).

          - The paradox: The strategy that is best for the entire trip (p=1/3) is not the same as the strategy that seems best when at an intersection (q=5/6). Moreover, if at the first intersection the driver changes to q=5/6, they will get a worse overall outcome (7/12) than if they had stuck to p=1/3 (4/3).

   8. What the game might not produce by itself:

          - We might not see many drivers choosing p=1/3 in stage1 or q=5/6 in stage2. So we might not see the optimal strategies. We can collect the choices and show the aggregate.

          - We might need to compute the expected payoffs for the optimal strategies and show that they are 4/3 and 49/24.

          - We also need to explain why the driver at an intersection is tempted to choose q=5/6 and why that leads to a bad outcome if applied from the beginning.

          - The game does not by itself show that the precommitment to p=1/3 is dynamically inconsistent. We have to point out: if at the first intersection the driver reconsiders, they will abandon p=1/3 in favor of q=5/6, which then leads to a worse outcome for the entire trip.

   9. Handling the group:

          - To prevent smuggling info: tell them not to discuss during the simulation.

          - To prevent everyone from always exiting: in stage1, if they always exit they get 0, while if they sometimes continue they might get 4 or 1. So they might learn.

          - We can also, after stage1, show the best strategy? But then it affects stage2.

          - We can run the simulation without revealing the best strategy until the debrief.

   10. Revised timeline:

          Total: 90 minutes.

          - Introduction (10 min): Explain the problem and the rules.

          - Stage1 (20 min): 
              - Each driver chooses p (to one decimal) and creates a bag of 10 slips accordingly.
              - They run one trip: start at the first intersection. 
                  - Draw for intersection1: if Exit -> 0, done.
                  - Else, draw for intersection2: if Exit -> 4, else -> 1.
              - They record their payoff.

          - Stage2 (20 min):
              - Collect stage1 materials. Give new index cards and slips.
              - Explain: "Now you are at an intersection. You don't know if it's the first or the second. You must choose a plan q (a probability to Exit at this and any future intersection) for the remainder of the trip."
              - They choose q and make a bag.
              - For each driver, the facilitator flips a coin secretly to decide the starting point.
              - Then the facilitator leads the driver through the trip without revealing the start:
                  - If start at first: 
                      - Driver draws from bag: 
                          - Exit: payoff 0, done.
                          - Continue: then draw again: Exit->4, Continue->1.
                  - If start at second:
                      - Driver draws: Exit->4, Continue->1.
              - Record payoff.

          - Collect data: we want the average payoff for stage1 and stage2.

          - Debrief (40 min):
              a) Ask for volunteers: what p did you choose in stage1 and what payoff? What q in stage2 and what payoff?
              b) Compute the average payoff for stage1 and stage2.
              c) Explain the theoretical optimum for stage1: p=1/3 -> 4/3≈1.33.
              d) Explain the theoretical optimum for stage2: q=5/6≈0.833 -> 49/24≈2.04.
              e) Point out the difference: the strategy that is best when you start from the beginning is not the same as the best strategy when you find yourself at an intersection.
              f) Explain the dynamic inconsistency: if you precommit to p=1/3, then when you get to the first intersection, you will want to change to q=5/6. But if you change, then the overall outcome (from the beginning) becomes worse (7/12≈0.58) than if you had stuck to p=1/3 (4/3≈1.33).
              g) Discuss why: at the first intersection, the driver thinks: "If I am at the first, I should continue (so that I can then have a chance to exit at the second). If I am at the second, I should exit. But since I don't know, I'll choose a high probability of exit (5/6) to cover both." But this high exit probability at the first intersection often leads to exiting too early.

   11. Materials per driver:

          - 20 blank slips of paper (or index cards cut in half) for creating bags (10 for stage1, 10 for stage2).
          - Pen to label the slips.
          - Two index cards: one to write p for stage1, one to write q for stage2.
          - A coin for the facilitator to flip secretly for each driver in stage2.

   12. What if they choose p=1/3 in stage1 and then in stage2 they choose q=1/3? 

          In stage2: 
              If they start at the first: they get 4/3 (as above).
              If they start at the second: they get 2 (as above).
              Average: (4/3 + 2)/2 = (4/3+6/3)/2 = 10/6 = 5/3≈1.67.

          But if they choose q=5/6, they get 2.04. So they are better off changing.

       We hope that in stage2, they will realize that a higher q is better.

   13. How to flip secretly?

          The facilitator can have a coin and for each driver, flip it and record the result (say, on a hidden sheet) and then simulate accordingly.

   14. Let's hope it works.

   15. Prize: we can give a small prize to the driver with the highest total payoff (stage1+stage2) or highest stage1, highest stage2 separately? But note: stage2 has a higher possible payoff. So we might do separate prizes.

   Given the constraints, we'll run it as described.
answer: |-
  ### Game Design for the Absent-Minded Driver Problem  
  **Goal:** Make participants *feel* the tension between precommitment and dynamic revision via hands-on play.  

  ---

  #### **Materials**  
  - **Index cards** (2 per participant): For writing strategies.  
  - **Paper slips** (10 per participant): For randomizing actions (mark as "EXIT" or "CONTINUE").  
  - **Pens/pencils** for all.  
  - **Coin** (for facilitator): To secretly randomize starting points in Stage 2.  
  - **Scoreboard** (whiteboard or poster) to record payoffs.  

  ---

  #### **Roles**  
  - **Participants:** 14 drivers.  
  - **Facilitator (you):** Run stages, flip coins, enforce rules.  

  ---

  #### **Rules and Timeline** (Total: 90 minutes)  
  **Step 0: Introduction (10 min)**  
  - Explain the setup:  
    - *"You’re driving home. There are 2 identical intersections. You can’t tell which is which.*  
    - *Exit at Intersection 1 (bad area): 0 points.*  
    - *Exit at Intersection 2 (home): 4 points.*  
    - *Continue through both: 1 point."*  
  - Emphasize: **No talking during gameplay** to prevent info smuggling.  

  **Stage 1: Precommitment (25 min)**  
  1. **Plan:** Each driver writes a probability **`p`** (0.0 to 1.0, one decimal) on an index card. This is their precommitment: *probability of EXITING at any intersection*.  
  2. **Prepare slips:** For their `p`, create 10 slips:  
     - `p × 10` slips marked "EXIT".  
     - `10 - (p × 10)` slips marked "CONTINUE".  
     (e.g., `p = 0.3` → 3 EXIT, 7 CONTINUE).  
  3. **Run one trip:**  
     - Start at **Intersection 1**. Draw one slip randomly:  
       - **EXIT → 0 points** (trip ends).  
       - **CONTINUE → Proceed to Intersection 2.**  
     - At **Intersection 2**, draw another slip:  
       - **EXIT → 4 points.**  
       - **CONTINUE → 1 point.**  
  4. **Record payoff** on scoreboard.  

  **Stage 2: Mid-Run Revision (25 min)**  
  1. **Reset:** Collect Stage 1 slips. Hand out new index cards/slips.  
  2. **Set the scene:**  
     - *"You’re now AT an intersection. You don’t know if it’s 1 or 2. Revise your strategy for the REST of the trip."*  
  3. **Revise plan:** Each driver writes a new probability **`q`** (for EXIT) on a fresh index card.  
  4. **Prepare slips** for `q` (as in Stage 1).  
  5. **Run one trip (secret starting point):**  
     - Facilitator secretly flips a coin for each driver:  
       - **Heads → Start at Intersection 1.**  
       - **Tails → Start at Intersection 2.**  
     - **Driver draws a slip at their starting intersection:**  
       - If **EXIT**:  
         - Start at 1 → **0 points.**  
         - Start at 2 → **4 points.**  
       - If **CONTINUE**:  
         - Start at 1 → Proceed to **Intersection 2**, draw again.  
           - EXIT → 4 points.  
           - CONTINUE → 1 point.  
         - Start at 2 → **1 point** (trip ends).  
  6. **Record payoff.**  

  **Step 3: Results & Debrief (30 min)**  
  1. **Announce top scorers** (small prize if desired).  
  2. **Debrief with guided discussion:**  
     | **Game Phase**       | **Formal Problem**                              | **Key Insight**                                                                 |  
     |-----------------------|-------------------------------------------------|---------------------------------------------------------------------------------|  
     | **Stage 1 (Precommit)** | Planning before the trip                        | Optimal `p = 1/3` (avg. payoff **4/3 ≈ 1.33**). Pure plans (e.g., "always EXIT") fail. |  
     | **Stage 2 (Revision)** | Choosing at an intersection with uncertainty    | Belief: "I'm equally likely at I1 or I2." Optimal `q = 5/6` (avg. payoff **49/24 ≈ 2.04**). |  
     | **Indistinguishability** | Identical intersections + no memory           | In Stage 2, drivers *can’t* condition on location → forces uniform strategy `q`. |  
     | **Tension**             | Dynamic inconsistency                          | Precommit `p=1/3` is optimal *globally*, but feels suboptimal *locally* (you’d switch to `q=5/6`). |  
     - **Paradox highlight:**  
       - *"If you precommit to `p=1/3`, but at I1 you switch to `q=5/6`, your total payoff drops to **7/12 ≈ 0.58** — worse than sticking to the plan!"*  
       - Why? Switching ignores how your future self will over-EXIT at I2.  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Everyone always exits (`p = 1.0`):**  
     - **Why:** "EXIT at I2 = 4 points" feels tempting.  
     - **Fix:** After Stage 1, ask: *"Did always exiting work? What happened at I1?"* (They’ll see payoff=0). Use this to motivate mixed strategies in debrief.  

  2. **Info smuggling between rounds:**  
     - **Why:** Participants may share strategies.  
     - **Fix:** Strict silence rule. Assign seating. Collect materials between stages.  

  3. **Confusion about revision:**  
     - **Why:** Stage 2’s random start is abstract.  
     - **Fix:** Explicitly say: *"When you revise, you’re at ONE intersection but don’t know which. Your `q` applies HERE and LATER."*  

  4. **Math aversion:**  
     - **Why:** Philosophers/engineers may default to intuition.  
     - **Fix:** In debrief, start with raw payoffs ("Who got 0? 4? 1?"), then reveal optima.  

  ---

  #### **What the Game Can’t Replicate**  
  **The counterfactual frustration:**  
  - In the game, drivers who switch to `q=5/6` in Stage 2 get a *higher* payoff (≈2.04) than precommitment (≈1.33) because Stage 2 starts midway. But in reality, if you switch *during a trip* (e.g., at I1), your *overall* payoff crashes to ≈0.58.  
  - **You must explain:**  
    - *"The game’s Stage 2 simulates being *randomly placed* at an intersection. But in the real paradox, if you’re at I1 and switch plans, you’ve *already committed to the whole trip structure*. Opting for `q=5/6` at I1 ‘infects’ I2 — causing you to over-exit there too."*  
    - Use the **calculus** (below) to show the nosedive:  
      - Switch to `q=5/6` at I1: Payoff = `(5/6)×0 + (1/6)×[(5/6)×4 + (1/6)×1] = 7/12 ≈ 0.58`.  

  ---

  #### **Final Tips**  
  - **Pilot test** with a colleague to refine timing.  
  - **Emphasize silence** — it’s critical for the "absent-minded" vibe.  
  - **Debrief slowly:** Focus on feelings first ("How did revision feel vs. precommitment?"), then math.  
  - **Prize:** Chocolate or a quirky "Best Absent-Minded Driver" certificate.  

  This design forces visceral engagement with the paradox’s core: **the plan you trust in advance feels dubious in the moment, but revising it unravels everything**.
