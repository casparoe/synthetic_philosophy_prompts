  I'll structure around their requested categories: cases, distinctions, observations. Non-negotiables will hinge on punishment theory fundamentals: intentionality, harm, norm-enforcement. Contradictions may arise between "targets experience as carceral" and "no due process" – punitive experiences absent institutions challenge classical frameworks. 

