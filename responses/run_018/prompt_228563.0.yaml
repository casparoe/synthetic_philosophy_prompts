prompt: |-
  I'm writing a profile of a philosopher who works on know-how, and her paper trail is a bunch of case verdicts I want to make sense of before our interview. So far: the concert pianist who loses all her music theory to amnesia but still plays perfectly -- my philosopher says she still knows how to play. The gymnastics coach with a ruined knee who can't do a somersault anymore but can spot exactly what a student is doing wrong mid-air and correct it -- she says he still knows how to somersault. The chick sexer who sorts flawlessly but gives a confidently wrong explanation of what he's looking at -- knows how, she says. The kid who memorized the physics-of-cycling manual, explains countersteering better than anyone, and falls over every single time -- does NOT know how to ride a bike, she says.

  Here's the case I want to put to her: a retired violinist with a spinal injury, hands completely paralyzed, but she can still sit with students and catch every intonation error in real time, hum the exact correction, and tell a student their bow pressure is off before the note even finishes. Does she still know how to play the violin?

  Predict her verdict, tell me what rule her earlier verdicts are running, and -- this is the part I actually need for the profile -- which other rules fit those same four verdicts but come out differently on the violinist. If her verdict on the violinist doesn't pin it down either, what case would?
reasoning: |-
  Okay, let me tackle this query step by step. The user is writing a philosopher's profile focused on know-how, and needs help analyzing a violinist case based on prior examples. 

  First, I need to extract the pattern from the four given cases. The pianist with amnesia still plays perfectly - knows how. The injured coach can't perform but corrects others flawlessly - knows how. The chick sexer performs perfectly but gives wrong explanations - knows how. The physics-savvy kid who can't ride a bike - does NOT know how. 

  The common thread seems to be that successful performance matters more than theoretical knowledge or physical ability. The philosopher values reliable capability, even when detached from declarative knowledge or current physical execution. 

  Now for the violinist case: paralyzed but can critically analyze playing in real-time. Applying the same logic, she'd likely say "knows how" because the core skill - auditory judgment and pedagogical correction - remains intact. This aligns with the coach case where physical inability didn't erase know-how.

  But the user wants alternative interpretations that fit the first four cases but differ on the violinist. One could argue that "know-how" requires potential for personal performance. Under this view, the violinist lacks capacity to play, unlike the coach who could theoretically demonstrate if healed. 

  To pin this down, I'd propose a test case: a master chef who loses taste buds but perfectly corrects dishes based on visual/chemical cues. If the philosopher says "knows how," it confirms the pattern; if not, it reveals a physical performance requirement. 

  The user's deeper need seems to be showcasing philosophical nuance - how slight definitional shifts change conclusions. Highlighting this tension will enrich their profile.
answer: |-
  Based on the pattern of verdicts, here's the breakdown and prediction:

  1.  **Her Predicted Verdict for the Violinist:** **Yes, she still knows how to play the violin.**
  2.  **The Rule Her Verdicts Are Running:** **Know-how is grounded in reliable, practical *understanding and ability to guide/recognize correct performance*, not necessarily in the *current physical capacity to execute* or the *ability to articulate propositional knowledge about it*.**

      *   **Pianist:** Lost propositional knowledge (theory) but retains practical execution ability. Know-how remains. *(Focus: Practical execution > Propositional knowledge)*
      *   **Coach:** Lost physical execution capacity but retains deep practical understanding to recognize/guide performance. Know-how remains. *(Focus: Guiding/Recognizing performance > Physical execution)*
      *   **Chick Sexer:** Lacks accurate propositional knowledge but retains reliable practical recognition/performance ability. Know-how remains. *(Focus: Reliable practical performance/recognition > Propositional knowledge)*
      *   **Kid:** Has propositional knowledge but lacks reliable practical execution ability. Know-how absent. *(Focus: Reliable practical performance > Propositional knowledge)*

      **The Core Rule:** **Know-how requires the reliable *cognitive-practical capacity* to either *execute* an action successfully oneself *or* to *recognize, guide, and correct* its successful execution by others based on understanding the action's practical demands. This capacity is distinct from physical ability to perform *now* and distinct from the ability to articulate true propositions *about* the action.**

  3.  **Alternative Rules Fitting the First Four Verdicts but Differing on the Violinist:**

      *   **Rule A: Know-how requires *potential for personal performance*.** Under this rule:
          *   Pianist: *Can* perform -> Knows how.
          *   Coach: *Could* perform if healed -> Knows how (assumes potential is retained).
          *   Chick Sexer: *Can* perform -> Knows how.
          *   Kid: *Cannot* perform despite knowledge -> Does not know how.
          *   **Violinist:** *Cannot* perform due to paralysis (no potential without intervention) -> **Does NOT know how.** *This diverges from the predicted verdict.*

      *   **Rule B: Know-how is *solely* the ability to reliably *execute* the action oneself.** Under this rule:
          *   Pianist: Can execute -> Knows how.
          *   Coach: Cannot execute -> **Does NOT know how.** *This contradicts the given verdict for the coach, so Rule B is invalid for the pattern.* (It fails the coach case).
      *   **Rule C: Know-how requires *current* physical capacity to perform *or* the specific skill of *teaching/guiding*.** This rule splits the concept slightly:
          *   Pianist: Performer Skill -> Knows how.
          *   Coach: Teaching Skill -> Knows how *as a coach*, but perhaps not *as a gymnast*. (The question is "know how to somersault", not "know how to coach somersaults"). *This might lead to saying the coach knows how to coach, but no longer knows how to somersault, contradicting the given verdict.*
          *   Chick Sexer: Performer Skill -> Knows how.
          *   Kid: Neither Skill -> Does not know how.
          *   **Violinist:** Teaching Skill -> **Knows how *to teach* violin, but does NOT know how *to play* violin.** *This diverges by redefining the object of know-how ("play" vs "teach") based on the activity.*

      *   **Rule D: Know-how requires *embodied knowledge* that could *in principle* guide one's *own* action.** This is subtle but different from the predicted rule:
          *   Pianist: Embodied knowledge guides action -> Knows how.
          *   Coach: Embodied knowledge *could* guide action if body capable -> Knows how.
          *   Chick Sexer: Embodied knowledge guides action -> Knows how.
          *   Kid: Propositional knowledge doesn't guide action -> Does not know how.
          *   **Violinist:** Embodied knowledge *cannot* guide her *own* action (due to paralysis) and is only used to judge *others*. -> **Does NOT know how (to play).** *The key distinction is whether the capacity is directed toward *one's own possible action* or only toward *judging others' actions*. This diverges.*

  4.  **Pinning Down the Definition: The Crucial Test Case**

      The violinist case *does* help pin it down, especially against Rule D and Rule A. However, a case that forces a clearer distinction between *understanding for guiding others* and *understanding for potential personal performance* would be ideal:

      **The Test Case: The Master Chef Without Taste or Smell.**
      *   A world-renowned chef suffers nerve damage, completely losing her senses of taste and smell.
      *   She cannot personally experience the flavor or aroma of any dish.
      *   However, through decades of experience and deep understanding of ingredients, chemistry, and visual/textural cues, she can:
          *   Watch a cook prepare a dish and instantly identify (visually, by timing, by sound) exactly what ingredient is missing, what step was wrong, or how to adjust seasoning/texture.
          *   Verbally guide a cook to perfectly recreate any of her signature dishes or correct flaws in new ones.
          *   Write flawless, detailed recipes that yield perfect results when followed.
      *   *Can she personally execute even a simple dish successfully?* No, because she cannot taste to adjust seasoning or smell to detect burning/doneness. She relies entirely on others to be her senses for execution.
      *   **Question: Does she still know how to cook?**

      *   **Predicted Philosopher's Verdict (based on pattern): YES.** Her deep practical understanding allows her to reliably recognize and guide successful performance. The physical act of stirring/chopping/etc. is secondary to the understanding of combining elements to achieve the goal.
      *   **Rule A/D Verdict (Potential/Personal Embodiment): LIKELY NO.** She has no potential to personally cook successfully without external sensory input/interpretation. Her knowledge guides *judgment* and *instruction* of others, not her *own* potential action.
      *   **Rule C Verdict (Split Skill):** Knows how to *teach* cooking or *write recipes*, but does not know how to *cook*.

      **Why this case is better than the violinist for pinning it down:**
      *   The violinist's paralysis directly prevents the motor output. The chef's nerve damage prevents sensory *input* critical to the feedback loop of cooking. Both are severe impairments to personal execution.
      *   The chef case emphasizes the *sensory/judgment* component of the skill more starkly, similar to the coach and chick sexer, but removes the *potential* for personal execution even more definitively than the violinist (where one might imagine advanced prosthetics/brain interfaces *could* someday restore playing based on her mental model). The chef's sensory loss is likely permanent and fundamental to the act.
      *   It forces a direct confrontation: Is the core of cooking know-how the *mental model* that can guide successful creation (even if not personally executed), or *must* it include the capacity for personal execution using one's own senses/body?

  **Summary for Your Profile:**

  *   **Prediction:** Your philosopher will argue the retired violinist **still knows how to play**. Her core competency – the deep, practical understanding of violin performance enabling real-time recognition and correction of errors – remains intact, even if her body cannot execute the movements.
  *   **Her Rule:** Know-how is the reliable cognitive-practical capacity to either execute an action *or* recognize/guide its correct execution based on understanding its practical requirements. Physical capacity and propositional knowledge are secondary to this core ability.
  *   **The Nuance & Alternatives:** Philosophers who prioritize the *potential for personal performance* (Rule A) or *embodied knowledge directed at one's own action* (Rule D) would likely deny the violinist knows how to play, *even though they might agree on the first four cases*. The "Master Chef Without Taste or Smell" case starkly highlights this divergence.
  *   **The Insight:** Your philosopher's view elevates the *understanding and capacity to guide* as central to know-how, potentially separating it more distinctly from physical ability than other theories. This makes her view particularly interesting for skills involving pedagogy, expert judgment, or where physical execution is delegated (like conducting an orchestra). The interview could explore the boundaries: How degraded can the physical link be before the know-how is lost? Is the violinist's know-how *identical* to when she could play, or a derivative form? Does know-how require *some* connection to potential action?
