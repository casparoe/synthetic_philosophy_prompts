  Question 3 on institutional design is crucial for real-world impact but premature. Deciding to remove a statue requires first knowing if the person was truly blameworthy by their era's standards. Otherwise we risk anachronistic decisions. 

  Question 4 about non-elite actors tugs at me ethically - but practically, it might overcomplicate the framework before core principles are set. We shouldn't neglect marginalized voices, but extending the model too early could make it unwieldy. 

  My confidence is highest about prioritizing Question 1 (80%) - it's clearly the bottleneck. But I'm uneasy about deprioritizing non-elite actors (Question 4). What if their exclusion perpetuates the very epistemic injustice we're studying? That tension deserves more thought than I gave it initially. 

  The user's demand for "explicit criteria" is smart. I'll justify using dependency (which questions build on others), tractability (what we can actually research now), and consequence (cost of being wrong). That should satisfy their request for rigorous defense. 

