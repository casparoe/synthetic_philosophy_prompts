answer: |-
  Based on the dependency relations, tractability, and potential consequences of error, here is the prioritized agenda with explicit criteria:

  **Upstream Priority 1: Conceptual Task of Epistemic Threshold (Question 1)**  
  *   **Why:** This is the *sine qua non*. Without defining what was "morally accessible," we cannot fairly apply judgments to *any* historical figure, elite or non-elite (Question 4), determine the asymmetry of praise/blame (Question 2), or justify institutional changes (Question 3). All other questions presuppose an answer to this.
  *   **Dependency:** Directly foundational for Questions 2, 3, and 4. Resolving it defines the core metric.
  *   **Tractability:** Leverages existing philosophical tools (moral epistemology, philosophy of history, contextualism vs. presentism) and historical methods (source analysis, intellectual history, reception studies). Progress is feasible through conceptual analysis combined with empirical case studies.
  *   **Consequence of Error:** High risk. An overly lax standard excuses profound evil; an overly stringent one commits anachronism, undermining the legitimacy of *any* historical judgment and poisoning downstream debates (monuments, education). Getting this wrong distorts the entire project.
  *   **Confidence in Priority:** High (90%). Its foundational nature is clear.

  **Upstream Priority 2: Boundary-Condition Problem (Non-Elite Actors) (Question 4)**  
  *   **Why:** While dependent on Question 1, tackling this *early* is crucial for legitimacy and avoiding a framework that only judges elites. It forces the core concept (Question 1) to be rigorously tested and generalized, preventing it from being tailored solely to privileged figures. Addressing this reveals if the framework is truly robust or inherently biased.
  *   **Dependency:** Requires an initial sketch of the accessibility threshold (Q1) but profoundly shapes its final definition. Resolving it significantly impacts how Q1 is operationalized.
  *   **Tractability:** Challenging but tractable with growing archival/methodological focus on subaltern histories, oral traditions, material culture studies, and social history. Requires interdisciplinary collaboration (historians, anthropologists, philosophers).
  *   **Consequence of Error:** Critical for ethical coherence. Failure risks creating a framework that perpetuates historical silence by only holding visible elites accountable while implicitly excusing (or being unable to assess) the actions/constraints of the marginalized. This undermines the moral purpose of the exercise.
  *   **Confidence in Priority:** Moderate-High (75%). It's essential for framework legitimacy, but its difficulty is recognized.

  **Deprioritized: Asymmetry Problem (Question 2)**
  *   **Why:** While conceptually interesting, it's less urgent *until* the core standard of accessibility (Q1) and its scope (Q4) are established. Praise/blame asymmetry depends entirely on what constitutes an accessible "better view" in the first place. Its resolution has less direct, immediate impact on practical applications like commemoration than Q3.
  *   **Dependency:** Highly dependent on a settled (or at least clear) view of Q1. Its answers flow *from* the core accessibility framework.
  *   **Tractability:** Primarily philosophical/conceptual. Can be explored theoretically once Q1 is advanced.
  *   **Consequence of Error:** Relatively lower stakes. Misjudging the asymmetry might lead to slightly unbalanced historical narratives (over/under-praising pioneers), but it doesn't fundamentally undermine the basis for holding figures accountable or designing institutions based on that accountability in the way Q1 or Q4 errors do. It refines the application rather than defining the core measure.
  *   **Reason for Deprioritization:** Largely ornamental/resolvable downstream once core accessibility (Q1/Q4) is defined. Lower practical magnitude of error.

  **Deprioritized: Institutional-Design Question (Question 3)**
  *   **Why:** This is inherently *downstream*. Deciding what to *do* about judgments (monuments, curricula, labels) logically requires having defensible judgments *first* (based on Q1 & Q4). It also requires separate normative/political deliberation about the *purpose* of commemoration (memory, education, justice, reconciliation) beyond just historical culpability.
  *   **Dependency:** Entirely dependent on answers to Q1 (and significantly influenced by Q4). Premature without a robust accountability framework.
  *   **Tractability:** Involves complex political philosophy, public policy, education theory, and practical constraints – distinct from the core historical-moral assessment.
  *   **Consequence of Error:** High *practical* impact (divisive debates, harmful symbolism), but the error *source* lies upstream (in flawed judgments from unresolved Q1/Q4). Focusing here first risks building institutions on sand.
  *   **Reason for Deprioritization:** Premature without upstream work. Its resolution is rendered moot or easily adjusted if Q1/Q4 are settled. High resource intensity for potentially unstable outcomes if foundations aren't solid.

  **Overall Confidence in Agenda:** 80%. Prioritizing the definition of the core epistemic standard (Q1) and ensuring its applicability across the social spectrum (Q4) directly addresses the most fundamental and consequential uncertainties. Resolving these genuinely unlocks progress on the others.

  **Specific Claim of Least Certainty:** Within the **Boundary-Condition Problem (Q4)**, I am least certain about the **empirical claim** regarding whether we *can* reliably reconstruct the "epistemic horizons" and accessible moral options for large segments of *non-literate, systematically silenced populations* (e.g., enslaved individuals in isolated settings, nomadic groups with limited external contact) with sufficient granularity to apply the accessibility framework fairly *without* resorting to problematic assumptions or impossibly high standards. The methodological hurdles in recovering authentic, non-mediated perspectives on moral possibility for the most marginalized are immense, and I'm uncertain if current or foreseeable archival/social-scientific tools can fully overcome them without introducing new forms of epistemic injustice. This empirical challenge directly threatens the *practical feasibility* of achieving the framework's ethical goal of inclusivity.
