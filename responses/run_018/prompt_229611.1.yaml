prompt: |-
  I coordinate a peer-education program about sexual consent at a university, and after a recent training session in which the case of a man lying about being separated from his wife split the room, I want to develop a case-based module that forces our trainees to reckon with why deception matters rather than relying on slogans. I am not asking for your view about that actual case, and I do not want a bibliography. Instead, please construct a thought experiment to my specifications.

  Design a sexual-consent scenario with these constraints. The person giving consent is an adult, sober, fully competent, and not under any threat, pressure, or arrangement that a normal person would classify as coercion. The person seeking consent tells one deliberate lie. The lie is not about the seeker's identity, is not about any communicable disease or contraception, and does not misrepresent the physical acts to be performed. Yet the scenario should be one in which all three of the following families of view would agree that the recipient did not have valid consent: autonomy-based views, views on which consent is invalid when it would wrong the consent-giver, and views on which consent transfers a permission through a communicated mental act. Then construct a minimally different scenario in which the same lie, told in the same way, does not vitiate consent, and show that what does the work is a structural feature of the two situations rather than a change in the lie's content or the seriousness of the stakes.

  After the two scenarios, walk through the reasoning each family of view would give in the first and in the second, name the structural feature that separates them, say what happens to each theory's verdict if that feature is removed, and give the strongest objection you can from someone who holds that deception can never vitiate consent because consent is just a mental act. Keep the scenarios ordinary and realistic; no exotic psychology or law-enforcement hypotheticals.
reasoning: |-
  We are constructing two scenarios. The key is to have a lie that does not fall into the typical categories (identity, STIs, contraception, nature of act) but still vitiates consent in the first scenario and does not in the second. The structural feature that differentiates them must be the key.

  Idea: The lie could be about the context or the purpose of the encounter, but not about the acts themselves. Specifically, let the lie be about the seeker's emotional state or commitment level, which in one scenario is material to the consent and in the other is not, due to a structural feature.

  However, note the constraint: the consent-giver is competent, sober, not coerced, etc.

  We need a scenario where the lie is such that without it, the consent-giver would not have consented, and in which all three families of views (autonomy, wronging, communicative act) would agree that consent is invalid.

  Then a minimally different scenario where the same lie does not vitiate consent.

  Structural feature: Perhaps the difference is in the expectations set by the context or the relationship. For example, if the two people have an explicit agreement that a certain condition must be true for consent to be given, then lying about that condition would be material. Without such an agreement, the same lie might not be material.

  But note: the lie must be the same. So the lie should be about something that in one setting is understood to be a condition of consent and in the other is not.

  Let me design:

  Scenario 1 (invalid consent):

  Alex and Taylor are friends with benefits. They have a clear agreement that they are both only interested in casual sex and that they are not looking for a romantic relationship. They have agreed that if either of them develops romantic feelings, they will stop having sex and talk about it. One day, Taylor has started to develop feelings for Alex but lies and says, "I'm really glad we're on the same page about this being just casual. I don't have any feelings for you beyond friendship." Taylor says this to reassure Alex because Taylor knows Alex would not consent to sex if Taylor had feelings. Alex, believing Taylor, consents to sex.

  Lie: Taylor lies about having romantic feelings.

  Structural feature: There is an explicit prior agreement that the absence of romantic feelings is a condition for the sexual encounter.

  Now, Scenario 2 (valid consent):

  Jordan and Casey are dating and have been in a romantic relationship for a few months. They have not had any explicit discussion about the nature of their relationship beyond being exclusive. One night, Casey is feeling insecure and asks Jordan, "Do you love me?" Jordan, not being sure about their feelings yet, lies and says, "Yes, I love you." They then have sex. The lie is the same in content: about the presence of romantic feelings (or in this case, love, which is a stronger form of romantic feeling). However, in this scenario, there was no prior agreement that the truth about love is a condition for sex.

  Now, note: In the second scenario, we must ensure that the consent is still valid despite the lie. So we must set it up so that the lie is not material to the consent in the same way. But how? The problem is that in the second scenario, the lie might still be material to Casey's consent. However, we can argue that without the explicit agreement, the lie does not negate consent because the consent was not conditional on that statement in the same way.

  But let me check with the three families of views.

  First, the structural feature that separates the two scenarios: In the first, there is an explicit prior agreement that makes the truth of the statement (no romantic feelings) a condition for consent. In the second, there is no such agreement, and the lie is told in a moment of insecurity but not as a condition that the parties have agreed upon.

  Now, walk through the views.

  Families:

  1. Autonomy-based views: Consent is only valid if it is autonomous. Autonomy requires that the person has the information necessary to make the decision. If the lie is about a fact that is material to the decision, then consent is not autonomous.

     In Scenario 1: The lie is about a fact that is material because of the prior agreement. Without the truth, Alex cannot make an autonomous decision about whether to have sex under the agreed conditions.

     In Scenario 2: The lie (about love) might be important to Casey, but without a prior agreement that love is a condition for sex, it is not necessarily material to the sexual decision in the same way. Autonomy might not be violated because the lie does not negate the understanding under which consent is given (which was just for sex in a dating relationship without explicit conditions). However, this is tricky because Casey might feel that the lie was material. But note: the scenario says the consent-giver is not under threat, pressure, etc. and is competent. We must assume that without the explicit condition, the lie is not material to the core of the sexual consent. Alternatively, we could adjust the second scenario to make it clear that the lie is not material.

     Alternatively, let me adjust the second scenario to be more clear.

     Revised Scenario 2: Jordan and Casey are in a casual dating relationship and have not discussed the future. They are about to have sex, and Casey says, "I just want to make sure we're both having fun and nothing serious, right?" Jordan, who actually hopes the relationship becomes serious, lies: "Yeah, totally, just fun." They have sex.

     The lie is about Jordan's intentions (hoping for something serious). But note: the lie is about romantic intentions, which is similar.

     However, the problem is that in both scenarios, the lie is about the same kind of thing. The structural feature is the prior agreement.

     Let me stick to the first version of Scenario 2 and explain.

     For autonomy: In Scenario 1, the prior agreement makes the fact material. In Scenario 2, without such an agreement, the lie is about a personal feeling that, while it might be relevant, is not a condition that the parties have set for the sexual encounter. Therefore, the consent is still autonomous because the core elements of the sexual act (the who, what, when, etc.) are not misrepresented, and the condition that was agreed upon (in the first scenario) is absent in the second.

  2. Views on which consent is invalid when it wrongs the consent-giver: In Scenario 1, Alex is wronged because the agreement was violated, and Alex would not have consented if they knew the truth. Therefore, the act wrongs Alex. In Scenario 2, Casey might be upset by the lie, but the act of sex itself does not wrong Casey in the same way because there was no agreement that Jordan's feelings must be a certain way. The wrong might be a general wrong of lying in a relationship, but not a wrong that invalidates the sexual consent.

  3. Views on which consent is a communicated mental act that transfers permission: In Scenario 1, Alex's consent is conditional on the absence of romantic feelings. Since that condition is not satisfied, the mental state of consent (which is conditional) does not actually transfer permission. In Scenario 2, Casey's consent is not conditional on Jordan's feelings in the same explicit way. Therefore, the mental act of consent is still valid because it was not conditional on that fact.

  So the structural feature is: the presence or absence of a prior explicit agreement that makes the truth of the statement a condition for the sexual encounter.

  Now, what if we remove the structural feature? In Scenario 1, without the prior agreement, the lie might not vitiate consent. In Scenario 2, if we add a prior agreement that they are just casual and then Jordan lies about their feelings, then the lie would vitiate consent.

  Strongest objection from someone who thinks consent is just a mental act: "Consent is a state of mind. If at the moment of the act, the consent-giver had the mental state of consent, then consent was given. The lie might have caused that mental state, but causation does not negate the mental state. For example, if I consent because I believe a false statement, I still consented. The only thing that matters is the mental state at the time."

  Response: This view ignores the communicative and normative aspects of consent. In many contexts, consent is not just a mental state but a speech act that is governed by norms. If the consent was conditional and the condition was not met, then the communication of consent was invalid. Moreover, the mental state itself might be conditional. In Scenario 1, Alex's mental state is: "I consent to sex with Taylor only if Taylor has no romantic feelings." Because the condition is false, the mental state of unconditional consent never existed.

  But the objector might say: "At the moment, Alex did have the mental state of consent because they believed the condition was satisfied." So the mental state was present.

  We can counter: Consent is not just a momentary mental state but is normative and must be given under the right conditions. If the consent is induced by fraud about a material fact, then the consent is not valid. This is why in contract law, fraud can vitiate consent. Similarly, in sexual ethics, if the deception is about a fact that the parties have agreed is material, then the consent is invalid.

  Now, let's write the scenarios clearly and then the analysis.

  Scenarios:

  Scenario 1 (Invalid Consent):

  Alex and Taylor have a friends-with-benefits arrangement. They have explicitly agreed that they will only have sex if neither has romantic feelings for the other, and if either develops such feelings, they will stop and discuss. One day, Taylor has started to have romantic feelings for Alex. Before they have sex, Alex asks, "Just to be clear, you don't have feelings for me, right? Because if you do, we need to stop." Taylor lies, "No, I don't have any feelings for you. We're good." Alex then consents to sex.

  Scenario 2 (Valid Consent):

  Jordan and Casey have been dating casually for a few months and have not defined the relationship beyond being exclusive. They have not discussed any conditions for sex. One evening, before having sex, Casey asks, "Do you see this going anywhere? Like, are you falling in love with me?" Jordan, who is actually falling in love with Casey but fears scaring Casey away, lies: "No, I'm not falling in love. I'm just enjoying what we have." Casey, reassured, consents to sex.

  Note: In both, the lie is about the presence of romantic feelings. The structural feature is the explicit prior agreement in Scenario 1 that makes the absence of romantic feelings a condition for sex, versus the absence of such an agreement in Scenario 2.

  Now, walk through the views:

  In Scenario 1:

  - Autonomy-based: Alex's consent is not autonomous because Alex is missing material information (Taylor's true feelings) that was agreed to be necessary for consent. Without that information, Alex cannot make an autonomous decision about sex under the agreed terms.

  - Wronging the consent-giver: Taylor wrongs Alex by violating the agreement and having sex under false pretenses, which Alex would not have agreed to if the truth were known.

  - Communicative mental act: Alex communicated consent only on the condition that Taylor has no romantic feelings. Since that condition was false, the communication of consent was conditional and the condition was not met, so permission was not transferred.

  In Scenario 2:

  - Autonomy-based: Casey's consent might be based on a lie, but without a prior agreement that Jordan's feelings are a condition for sex, the lie is not about a material fact that is central to the sexual consent. The consent is about the sexual act itself, and Casey is competent and not under duress. Therefore, the consent is autonomous.

  - Wronging the consent-giver: While Jordan's lie might be hurtful and wrong in the context of the relationship, it does not rise to the level of wronging Casey in the specific act of sex because there was no agreement that the truth about Jordan's feelings was a condition for sex. The wrong is one of deception in the relationship generally, not a wrong that invalidates the sexual consent.

  - Communicative mental act: Casey's consent was not conditional on Jordan's feelings. Casey asked a question out of curiosity or insecurity, but the consent was given unconditionally. Therefore, the communication of consent transferred permission.

  The structural feature: the presence of an explicit prior agreement that makes the truth of the statement a condition for sexual activity.

  If the structural feature is removed from Scenario 1 (i.e., no prior agreement), then the autonomy view might still see the lie as material if it is central to the decision, but without the agreement, it becomes more subjective. The wronging view might not see a specific wrong in the sexual act, and the communicative act view would not see a condition. Thus, without the agreement, the consent might be considered valid.

  If the structural feature is added to Scenario 2 (i.e., they had an agreement that they are only casual and will stop if feelings develop), then the lie would vitiate consent.

  Strongest objection from the mental-act-only view:

  "Consent is a mental state. In both scenarios, the consent-giver had the mental state of consent at the time of the act. The fact that this mental state was caused by a lie does not change that. For example, if I consent to sex because I believe my partner is a millionaire, that might be foolish, but it doesn't mean I didn't consent. The mental state was present. The only thing that matters is the internal mental state at the time of the act. Therefore, in both scenarios, consent was given and was valid."

  Response: This view fails to account for the normative and relational aspects of consent. Consent is not just a mental state but a communicative act that occurs within a social and normative context. If the consent is based on a fundamental deception about a fact that the parties have agreed is material (as in Scenario 1), then the communication is defective. Moreover, the mental state in Scenario 1 was conditional: Alex's mental state was, "I consent only if Taylor has no feelings." Since the condition was false, the mental state of consent was not actually present in the unconditional form that Taylor took it to be. The mental state was predicated on a false belief, so it was not a valid consent to the actual situation.

  This thought experiment highlights that the context of prior agreements can make a deception material to consent even when the lie is not about the categories typically considered (like identity, STIs, etc.).
answer: |-
  Below, I construct two scenarios that meet your specifications. The core lie in both is the same: a deliberate falsehood about the seeker's *future intentions* regarding the relationship (specifically, about whether they intend to pursue a long-term commitment). This lie does not concern identity, disease, contraception, or the physical acts. The structural feature that differentiates the scenarios is the **existence of a prior explicit agreement** between the parties that defines the context and boundaries of the encounter. In the first scenario, this agreement makes the lie material to consent; in the second, the absence of such an agreement renders the lie immaterial to the validity of consent. Both scenarios involve ordinary, realistic interactions between adults.

  ### Scenario 1: Consent Invalid Due to the Lie
  **Context:** Jamie and Morgan have been casually dating for three months. Early on, they had a clear, explicit conversation where both agreed they were not interested in a serious relationship and would only continue seeing each other if they remained "casual and non-committal." They verbally affirmed that if either person developed feelings or a desire for commitment, they would end the arrangement immediately.  
  **The Encounter:** During a date, Jamie senses Morgan is acting unusually affectionate and asks, "Just to be clear, we're still on the same page about this being casual, right? No strings?" Morgan, who has recently decided they want a serious relationship with Jamie, lies: "Absolutely, no strings. I don't want commitment with anyone." Jamie, reassured, consents to sex.  
  **Why the Lie Matters:** Morgan's lie directly violates the prior agreement. Jamie would not have consented if they knew Morgan now sought commitment, as per their explicit pact. The lie is about Morgan's future intentions, not their identity, health, or the physical acts.

  ### Scenario 2: Consent Valid Despite the Same Lie
  **Context:** Sam and Riley have been casually dating for three months. They have never discussed the nature of their relationship beyond enjoying each other's company. There is no prior agreement about expectations for commitment or exclusivity; their interactions have been spontaneous and undefined.  
  **The Encounter:** During a date, Riley unexpectedly asks, "Are you seeing this as something that could turn serious?" Sam, who has privately decided they want a long-term relationship with Riley, lies: "No, I'm not looking for anything serious with you or anyone." Riley, though slightly disappointed, consents to sex.  
  **Why the Lie Does Not Matter:** Though the lie is identical in content (denying a desire for commitment), there is no prior agreement making this a condition for sex. Riley's consent is based on their attraction and enjoyment of Sam's company, not on any negotiated boundaries about commitment. The lie does not alter the fundamental understanding of the encounter.

  ---

  ### Walkthrough of Reasoning by Family of Views
  **Structural Feature:** The key difference is the **presence or absence of a prior explicit agreement** that establishes the lie's subject (future intentions) as a material condition for consent. In Scenario 1, the agreement makes the lie central to the consent-giver's decision; in Scenario 2, no such agreement exists, so the lie is about a peripheral, non-material aspect of the interaction.

  #### Analysis of Scenario 1 (Consent Invalid)
  1. **Autonomy-Based Views:**  
     Autonomy requires that consent be informed about material facts that shape the decision. Here, the prior agreement makes Morgan's intentions a material fact—Jamie's consent is conditional on the "casual" context. By lying, Morgan deprives Jamie of the information needed for autonomous choice, rendering consent invalid. If the prior agreement were removed, autonomy-based views would not deem the lie material, as there would be no established framework making intentions relevant to the decision.  
     *Verdict:* Consent invalid.

  2. **Views on Which Consent Is Invalid When It Wrongs the Consent-Giver:**  
     Wronging occurs when the consent-seeker violates a duty to the consent-giver, such as a promise or agreement. Morgan's lie breaches the explicit pact to be truthful about commitment desires, exploiting Jamie's trust. This wrongs Jamie by making them participate in an act they would reject if informed. Without the prior agreement, there would be no duty to disclose intentions, so no wrong would occur.  
     *Verdict:* Consent invalid.

  3. **Views on Which Consent Transfers Permission Through a Communicated Mental Act:**  
     Consent is a performative act where mental assent must align with communication. Jamie's mental state is conditional: "I consent only if Morgan wants no commitment." Morgan's lie creates a mismatch—Jamie communicates assent based on a false premise, so the permission transfer is defective. If the prior agreement were absent, Jamie's mental state would not be conditional on intentions, making the communication valid.  
     *Verdict:* Consent invalid.

  #### Analysis of Scenario 2 (Consent Valid)
  1. **Autonomy-Based Views:**  
     The lie does not violate autonomy because there is no prior agreement making Sam's intentions material. Riley's consent is based on their present desire for sex, not on expectations defined by mutual promises. Sam's lie may be personally hurtful, but it does not affect the core information needed for autonomous consent (e.g., the acts, risks, or identity). If a prior agreement were added, intentions would become material, invalidating consent.  
     *Verdict:* Consent valid.

  2. **Views on Which Consent Is Invalid When It Wrongs the Consent-Giver:**  
     No wrong occurs because there is no pre-existing duty to disclose intentions. The lie is about Sam's internal feelings, not a breach of a promise, so it does not wrong Riley in the context of the sexual act itself (though it may wrong them in the broader relationship). With a prior agreement, the lie would become a wrongful breach of trust.  
     *Verdict:* Consent valid.

  3. **Views on Which Consent Transfers Permission Through a Communicated Mental Act:**  
     Riley's mental state is not conditional on Sam's intentions; they consent to the physical act itself based on their attraction. The lie does not create a mismatch between Riley's mental assent and communication, as the consent is not tied to the truth of Sam's statement. If a prior agreement existed, Riley's mental state might become conditional, disrupting the permission transfer.  
     *Verdict:* Consent valid.

  ---

  ### Strongest Objection from the "Consent as Purely Mental Act" Perspective
  **Objection:** "Consent is solely a mental state—a subjective 'yes' in the mind of the consent-giver at the moment of the act. If Jamie and Riley both possessed that mental state (as they did), consent was given, regardless of deception. Lies may influence the mental state, but influence doesn't invalidate it; we consent based on false beliefs all the time (e.g., believing a partner finds us attractive when they don't). The communication is just evidence of the mental state, not the state itself. In both scenarios, the consent-giver's internal approval was real, so consent was valid. Focusing on agreements or wrongs confuses ethics with validity—deception might be immoral, but it doesn't negate the fact that consent occurred."

  **Rebuttal:** This view overlooks that consent is a relational, communicative act, not just a private thought. In ethical and legal frameworks, consent requires mutual understanding; a mental state based on material deception is not "informed" and thus cannot transfer permission. For example:  
  - If Jamie's mental state is conditional ("I consent only if Morgan is truthful about commitment"), it collapses when the condition is unmet, meaning no valid mental assent exists for the actual situation.  
  - Reducing consent to a mental state ignores how social context (like agreements) shapes its meaning. Without such context, consent becomes unmoored from real-world interactions—e.g., a person could "mentally consent" while verbally saying "no," creating dangerous ambiguity.  
  The objection also conflates trivial false beliefs (e.g., about attractiveness) with material lies that reframe the entire encounter. Prior agreements make this lie material, which is why it invalidates consent in Scenario 1 but not in Scenario 2.

  ---

  ### Summary
  This thought experiment isolates **prior explicit agreements** as the structural feature that determines when deception vitiates consent. It forces trainees to move beyond slogans by showing that context—not just the lie's content—dictates validity. By contrasting the scenarios, trainees must grapple with how agreements create shared expectations that make certain truths essential for autonomy, avoid wrongs, and enable genuine communication. This approach encourages nuanced discussions about responsibility and trust, without relying on exotic edge cases.
