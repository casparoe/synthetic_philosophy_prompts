answer: |-
  The orthopedic practice implicitly presupposes a **modified etiological account of biological function**, blended with developmental and adaptive norms, while the contrast with limb prosthetics reveals a context-dependent application of functional norms rather than a philosophical inconsistency. Below, I reconstruct the implicit theory, disentangle strict requirements from accommodations, address underdetermination, and argue for specific changes under a causal-role account.  

  ### **Implicit Theory of Biological Function in Orthopedics**  
  1. **Etiological Core with Developmental Constraints**:  
     - **Strict Requirement**: Restoration of the knee’s *pre-arthritic, individualized kinematic profile* is treated as intrinsically valuable. This implies the joint’s "proper function" is fixed by:  
       - **Evolutionary history**: The human knee’s conserved biomechanical design (e.g., screw-home mechanism, tibiofemoral congruency).  
       - **Developmental history**: Patient-specific gait patterns established during growth and neuromuscular adaptation.  
     - **Evidence**: Kinematic fidelity is an *independent success criterion* even when stability/comfort are achieved. Deviations are deemed "inferior," suggesting function is tied to a historical, species-typical norm.  

  2. **Accommodations (Non-Strict Elements)**:  
     - **Functional Metrics**: Pain reduction and load-bearing are necessary but insufficient; kinematics cannot be traded for superior function.  
     - **Adaptive Flexibility**: Minor variations in kinematics (e.g., slight adjustments for anatomy) are tolerated, but *systematic deviation* from physiological motion is penalized.  

  ### **Contrast with Prosthetic Limbs: Inconsistency or Underdetermination?**  
  - **Prosthetics’ Causal-Role Dominance**: Function is assessed via current-systemic outcomes (speed, energy, balance). No attempt is made to replicate the *exact biomechanics* of the lost limb (e.g., mimicking ankle plantarflexion timing).  
  - **Resolution**: **No inconsistency**. The contrast arises because:  
    - **Amputations disrupt biological continuity**: The "original system" is irrecoverable; functional integration supersedes historical fidelity.  
    - **Knee replacements operate within intact systems**: Muscles, ligaments, and neural pathways expect historical kinematics. Deviations risk secondary pathologies (e.g., ligament strain, implant loosening).  
  - **Underdetermination Point**: Surgical norms *do not decide* whether kinematics matter due to *evolutionary history* (etiological) or *systemic integration* (causal-role). For example, preserving native kinematics might prevent long-term wear—a causal-role justification—yet it is framed as "naturalness."  

  ---  

  ### **Adopting a Pure Causal-Role Account: Required Changes**  
  If orthopedics replaced its implicit view with a **causal-role account** (where function is defined by current contributions to locomotion), the following changes would be necessary:  

  1. **Surgical Evaluation**:  
     - **Eliminate kinematic fidelity as an independent criterion**. Success would depend *solely* on:  
       - Patient-reported pain/comfort.  
       - Functional outcomes (walking speed, stair ascent, activity duration).  
       - Long-term implant survival (e.g., wear rates).  
     - *Reasoning*: A causal-role view prioritizes the joint’s *present* contribution to mobility over historical accuracy.  

  2. **Device Design Priorities**:  
     - **Optimize for stability/energy efficiency over "natural" kinematics**. Examples:  
       - Prioritize constrained implants for unstable knees, even if they restrict range of motion.  
       - Use simpler hinge designs if they reduce joint stress, ignoring historical tibiofemoral rotation.  
     - *Reasoning*: Function is defined by outputs (e.g., energy cost), not mechanistic fidelity.  

  3. **Patient Counseling**:  
     - **Reframe expectations**: Emphasize functional outcomes ("You will walk farther with less effort") over anatomical restoration ("Your knee will move like it used to").  
     - **De-emphasize "normalcy"**: Accept prosthetic knees as *new biomechanical solutions*, not recreations of biology.  
     - *Reasoning*: A causal-role account severs function from history, making "natural movement" irrelevant.  

  ### **Defense and Limitations**  
  - **Why Change?**  
    1. **Empirical Uncertainty**: No conclusive evidence shows "natural" kinematics prevent long-term issues (e.g., osteoarthritis in adjacent joints).  
    2. **Patient-Centered Outcomes**: Functional metrics correlate better with quality of life than kinematic scores.  
    3. **Innovation Potential**: Liberating design from etiological constraints could yield breakthroughs (e.g., personalized non-anatomic joints).  

  - **Where Practice Fails to Decide**:  
    - **Rehabilitation Protocols**: Focusing on "natural" gait retraining (etiological) vs. task-specific adaptation (causal-role).  
    - **Partial Kinematic Compromise**: E.g., sacrificing tibial rotation for stability—is this prioritizing causal-role outcomes or bending etiological norms?  

  ### **Conclusion**  
  Orthopedics implicitly relies on an etiological view but could adopt a causal-role account without logical inconsistency. However, this shift would revolutionize practice: **device designs would prioritize engineering efficiency over anatomical mimicry, evaluations would ignore kinematic metrics, and patients would be counseled on functional adaptation—not historical restoration.** The underdetermination in current norms (e.g., conflating evolutionary history with systemic integration) suggests a hybrid approach may be pragmatic, but a pure causal-role account demands abandoning "naturalness" as a value. If long-term data showed non-kinematic designs outperformed anatomical ones, this shift would be not just coherent but ethically imperative.  

  > **Stand**: I advocate for a transition toward a causal-role-dominant framework. The etiological view risks "bio-nostalgia"—prioritizing an idealized past state over measurable present function. Kinematic fidelity should be a *means* to functional ends, not an end in itself.
