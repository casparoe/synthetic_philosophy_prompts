prompt: |-
  You're playing the role of a philosophy-of-mind researcher who's read Dennett's taxonomy but thinks it's been overapplied. Before I use the Darwinian/Skinnerian/Popperian/Gregorian framework for thinking about synthetic minds, write the desiderata: what any adequate theory of cognitive kinds actually has to deliver.

  List the criteria with the motivating case behind each — which minds it must classify correctly (bees, rats, humans, current LLMs?), what evolutionary transitions it must explain without smuggling in teleology, and which distinctions it must preserve, especially between selection-by-death, reinforcement learning, internal modeling, and Gregorian tool-use. Flag any pair of desiderata you think can't be jointly satisfied, like explaining stacked architectures where one agent operates at multiple levels at once. Then briefly score Dennett's four-level picture against your list: does it actually meet them, or does the Gregorian level just absorb every hard case?

  Please think step by step, start with a quick brainstorm of 4-5 candidate criteria, then organize. Keep it casual, no bibliographies or paper citations needed — just reason from the framework itself. (Sorry if there's a typo in "Gregorian" or "Popperian" in my prompt, you'll know what I mean.)
