answer: |-
  Here is the exam prompt, model answer, and marking scheme designed to meet your specifications:

  **Exam Prompt: The Precommitment Paradox**

  Hyperbolic discounting models agents as assigning disproportionately high value to immediate rewards, leading to preference reversals over time. On this view, choosing cake now over health later isn't irrational *at the moment of choice*; each temporal stage maximizes its local utility. Simultaneously, Ulysses contracts (e.g., locking away snacks, installing website blockers) appear essential for securing long-term goals against these predictable reversals. Yet such precommitment treats the future self as an *external threat* to be bound or thwarted.

  **Write an essay addressing the following:**
  1. Explain how hyperbolic discounting, understood as a model of consistent local utility maximization, might dissolve the *traditional problem* of akrasia (acting against one's better judgment) as irrational. Why might this seem to eliminate the need for a special concept of "weakness of will"?
  2. Defend or reject the following claim: *Precommitment strategies restore diachronic rationality only by conceptually fragmenting the agent into competing temporal selves, thereby undermining the unified agency presupposed by rational choice theory.*
  3. Propose how a defender of a *unified, temporally extended agent* could justify precommitment (or an alternative strategy) without accepting this fragmentation. Develop a substantive positive account (e.g., appealing to narrative identity, standing commitments, or authority relations within the self) beyond merely rejecting the paradox.

  ---

  **Model Answer (Approx. 700 words):**

  **(1) Dissolving Akrasia via Hyperbolic Discounting**  
  Hyperbolic discounting describes an agent whose valuation of future rewards declines steeply as the reward nears in time. Crucially, this discounting function is mathematically consistent: at *any given moment*, the agent prefers the option with the highest *immediately discounted* utility. When Tuesday’s self chooses the gym over the couch, it rationally values future health highly. When Wednesday’s self, facing immediate effort, chooses the couch, it rationally values present comfort more than steeply discounted future health. There is no single "better judgment" being violated *simpliciter*. Tuesday’s judgment reflected Tuesday’s discounting; Wednesday’s reflects Wednesday’s. Because each temporal stage maximizes utility relative to its *local* discount curve, the preference reversal isn’t a failure of rationality *within* the moment. This dissolves the classic Davidsonian akrasia puzzle – acting *intentionally* against one’s *all-things-considered* judgment – by showing there is no stable, synchronic "all-things-considered" judgment being flouted. Akrasia becomes a predictable pattern of locally rational choices driven by shifting temporal perspectives, not a synchronic irrationality.

  **(2) Precommitment and the Fragmentation of Agency**  
  The claim that precommitment fragments the agent holds significant force. Rational choice theory typically assumes a unitary agent making consistent decisions over time to maximize utility. Precommitment, however, operates by treating the *future self* as a distinct entity whose predicted preferences are hostile to the *current self*'s long-term plans. Locking away credit cards to curb spending isn’t merely hedging against temptation; it’s actively *disabling* a future self’s capacity to choose certain options. This instrumentalizes the future self, reducing it to an object to be controlled – much like locking a stranger in a room to prevent them acting. The strategy "works" precisely by denying legitimacy to the future self's imminent preferences. Consequently, it fragments diachronic agency: it posits effectively different agents ("Tuesday Planner" vs. "Wednesday Doer") locked in conflict, where one must subjugate the other to achieve coherence. Rationality is restored *across* time only by sacrificing the unity *of* the agent *at* a time, as the future self is not a co-deliberator but a constraint to be engineered around. This fragmentation is inherent to the precommitment logic.

  **(3) Defending Unified Agency: Standing Commitments as Self-Governance**  
  A defender of unified agency can reject fragmentation by reinterpreting precommitment not as *binding an alien will*, but as *enacting a persistent commitment* constitutive of the agent’s identity. Crucially, the *authority* to precommit stems from the agent’s enduring values and identity, not the dominance of one temporal part. Consider a standing commitment to health. The agent isn’t merely "Tuesday’s self" imposing on Wednesday; rather, the commitment to health is a *standing project* of the *whole* person. The Tuesday decision to lock away snacks is an expression of this commitment, made *on behalf of* the enduring self. When Wednesday’s urge for snacks arises, it is not a rival "self" but a *temptation within the self* that conflicts with its own deeper, persistent commitment. Locking the snacks is thus an act of *self-governance*, akin to setting one’s own rules, not imposing rules on another. It respects diachronic autonomy because the future self is not stripped of agency *tout court*; it remains bound by the rules *it* (as the enduring agent) authorized when rationally endorsing the commitment. The "fragmentation" is merely the phenomenology of internal conflict inherent to complex agency, not ontological division. The precommitment succeeds *because* it aligns actions with the agent’s stable, reflective identity over fleeting impulses, preserving unity through adherence to self-authored norms. True irrationality would be failing to enact mechanisms upholding one’s own constitutive commitments.

  ---

  **Marking Scheme (Out of 25 Total Marks)**

  **Must-Hit Moves (5 points each):**
  1.  **Accurate Hyperbolic Discounting Explanation (5 marks):** Clearly explains how hyperbolic discounting leads to predictable preference reversals *without* positing synchronic irrationality, framing it as locally rational utility maximization at each point in time.  
      *   *Typical Mistake:* Mischaracterizing hyperbolic discounting as simple impulsivity or implying irrationality *within* the momentary choice.

  2.  **Articulating the Fragmentation Problem (5 marks):** Precisely explains *why* precommitment seems to require/entail treating the future self as an external threat/separate agent, linking this to undermining diachronic unity.  
      *   *Typical Mistake:* Only describing precommitment techniques without analyzing their implication for agency unity, or dismissing the concern too easily.

  3.  **Evaluating the Claim (Defend/Reject) (5 marks):** Takes a clear stance (defend, reject, qualify) on the fragmentation claim and provides a reasoned argument using the logic of precommitment and agency concepts (e.g., instrumentalization, loss of diachronic unity).  
      *   *Typical Mistake:* Stating an opinion without argument, or simply restating the claim without critical engagement.

  4.  **Positive Proposal for Unified Agency (5 marks):** Develops a *substantive* positive account (e.g., standing commitments, narrative identity, self-governance) that explains how precommitment (or an alternative) functions *without* temporal fragmentation, going beyond merely stating that the self is unified.  
      *   *Typical Mistake:* Offering only a vague appeal to "the real self" or simply asserting unity without explaining *how* precommitment fits within it; name-dropping theorists without developing the idea.

  5.  **Coherence & Argumentation (5 marks):** Essay is logically structured, addresses all three parts clearly and in sequence, avoids contradiction, and demonstrates independent philosophical engagement with the paradox beyond description.  
      *   *Typical Mistake:* Parts feel disconnected; significant logical gaps or contradictions; excessive summary of concepts without applying them to the core tension.

  **Grade Boundaries (Guide):**  
  *   21-25: Excellent (Hits all moves robustly, deep analysis, clear original thought)  
  *   16-20: Very Good (Hits all moves well, good analysis, some originality)  
  *   11-15: Competent (Hits most moves, adequate explanation, limited originality)  
  *   6-10: Pass (Addresses parts superficially, misses key moves/insights)  
  *   0-5: Unsatisfactory (Fails to address core prompt or demonstrates significant misunderstanding)  

  This prompt forces engagement with the core tension, avoids simple regurgitation (by demanding evaluation and positive proposals), and stays within the bounds of well-known concepts while requiring thoughtful synthesis. The marking scheme rewards depth on the specific philosophical moves requested.
