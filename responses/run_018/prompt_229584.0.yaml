          - After hearing that groups with 3x3 and larger couldn't find a winning move, at about 0:50, introduce the stealing argument idea and have groups discuss for 5 minutes.
     - 0:55-1:05: Whole class discussion: groups share their thoughts on the stealing argument.
     - 1:05-1:15: Debrief by instructor: connect to constructive vs. nonconstructive, surface the assumption.

     Materials:

     - Handouts for each group: 
          - A sheet with the board they are assigned (draw the grid) and space to record moves and strategies.
          - Rules of Chomp.

     - A whiteboard or projector for the instructor to illustrate.

     We'll hope that the students in the groups with larger boards will experience the frustration and then be motivated by the stealing argument.

     Note: The stealing argument might be difficult for them to come up with on their own. Therefore, after group reports, the instructor might need to seed the idea: "What if we assume that the second player has a winning strategy? Can the first player do something to use that strategy against them?"

     And then let them discuss in groups for 5 minutes.

     Be prepared to give more hints if needed.

     This plan is ambitious, but it could work.
answer: |-
  ### Lesson Plan: Chomp and Nonconstructive Proofs  
  **Duration:** 75 minutes  
  **Class Size:** 24 students (math majors, familiar with induction, new to game theory)  
  **Goal:** Experience the "strategy-stealing" proof for Chomp, highlighting its nonconstructive nature and the assumption that taking the top-right square is harmless.  

  ---

  #### **Materials**  
  - **Handout Boards** (print 8 copies for groups of 3):  
    - Board A: 2×2  
    - Board B: 2×3  
    - Board C: 3×3  
    - Board D: 3×4  
    - *(Include visual grids; label top-left as "poison" 💀)*  
  - **Rules Sheet** (per group):  
    > **Chomp Rules**:  
    > 1. Start with an \(m \times n\) grid. Top-left square is poison (losing square).  
    > 2. Players alternate turns. On your turn, pick any square and remove ("chomp") it and **all squares below and/or to the right**.  
    > 3. Player forced to eat the poison loses.  

  ---

  #### **Timeline**  

  | Phase           | Time     | Activity                                                                 |
  |-----------------|----------|--------------------------------------------------------------------------|
  | **Intro & Demo** | 10 min   | Explain rules, demo 2×2 game. Ask: *“Who wins? What’s the winning move?”* |
  | **Group Play**   | 30 min   | Groups play assigned boards (A–D). Task: *Find a winning 1st move (if it exists).* |
  | **Reports**      | 15 min   | Groups share: board size, winner, winning move (or why they’re stuck).   |
  | **Stealing Argument** | 10 min | Prompt: *“Prove 1st player wins on 3×4 without finding the move.”* Small groups brainstorm. |
  | **Debrief**      | 10 min   | Discuss strategy-stealing, nonconstructive proofs, and the "harmless move" assumption. |

  ---

  #### **Detailed Instructions**  

  1. **Intro & Demo (10 min)**  
     - Show 2×2 board on projector. Play as class:  
       - P1 takes bottom-right → P2 takes top-right or bottom-left.  
       - P1 takes the remaining non-poison square → P2 loses.  
     - **Key Q:** *“P1 wins. But what if the board is larger? Can we always find P1’s winning move?”*  

  2. **Group Play (30 min)**  
     - **Groups of 3**: Assign boards (2–3 groups per board type).  
       - Boards A (2×2) & B (2×3): Simple (P1 wins; easy to find moves).  
       - Boards C (3×3) & D (3×4): Hard (P1 wins, but winning move is elusive).  
     - **Task:**  
       - Play multiple games.  
       - For your board, answer: *“Does P1 have a winning strategy? If so, what is the winning first move?”*  
     - **Predictable Issues:**  
       - Groups with 3×3/3×4 will brute-force moves, exhaust options, and get stuck.  
       - Some may declare "P2 wins" after losing as P1 (correct conclusion is P1 wins).  

  3. **Reports (15 min)**  
     - Groups report findings:  
       - 2×2/2×3: Groups quickly identify P1 wins (e.g., bottom-right move).  
       - 3×3/3×4: Groups admit they couldn’t find a winning move.  
     - **Highlight:** *“We know P1 wins on 3×3 and 3×4, but no one found the move. Can we prove it without knowing the move?”*  

  4. **Strategy-Stealing Discovery (10 min)**  
     - **Small Groups:** *“Prove P1 must win on 3×4 without finding the first move.”*  
       - **Hints (if stuck):**  
         - *“What if P2 had a winning strategy? Could P1 ‘steal’ it?”*  
         - *“Suppose P1’s first move is the top-right square. Is this move ‘harmless’?”*  
     - **Goal:** Groups derive the argument:  
       1. Assume P2 has a winning strategy.  
       2. P1 takes the **top-right square** (only).  
       3. P2 responds with move \(X\) (using their "winning" strategy).  
       4. P1 then plays *as if they were P2* and uses the same strategy against P2.  
       5. Contradiction: P1 wins.  

  5. **Debrief (10 min)**  
     - **Connect to Proofs:**  
       - **Nonconstructive proof:** Shows a winning move *exists* (for P1) but doesn’t **construct** it.  
       - **Constructive proof:** Requires finding the explicit move (like for 2×2).  
       - *“Strategy-stealing is nonconstructive—we proved ‘there exists a winning move’ without finding it.”*  
     - **Surface the Assumption:**  
       - *“Why is P1’s first move (top-right) ‘harmless’? What if the poison was at the bottom-right?”*  
         - The proof assumes taking top-right **doesn’t disrupt P1’s ability to “steal” P2’s strategy**. But if P2’s strategy relied on top-right, stealing fails!  
       - *“The assumption is subtle: taking top-right is ‘safe’ because it’s symmetric and doesn’t block critical options. But we don’t prove safety—we assume it.”*  
     - **Philosophical Takeaway:**  
       - Nonconstructive proofs leverage contradiction and existence without algorithms.  
       - Strategy-stealing works in Chomp because moves are **symmetric** (no position inherently depends on top-right).  

  ---

  #### **What Will Go Wrong**  
  - **Fixation on Brute-Force:** Groups with 3×3/3×4 will try (and fail) to compute all move trees. Redirect with: *“What if you don’t need to know the move?”*  
  - **Misidentifying Winner:** Groups losing as P1 may think P2 wins. Clarify: *“Losing as P1 doesn’t mean P1 can’t win—it means you chose a bad move.”*  
  - **Stealing Argument Hurdles:** Students may miss why top-right is chosen. Emphasize: *“We pick it because it’s ‘extreme’ and likely harmless.”*  

  #### **What the Game Can’t Produce**  
  - **Why Top-Right?** Students won’t intuit why top-right is "harmless." You must:  
    - Explain: *“Top-right is ‘isolated’—taking it only removes one square, minimizing disruption.”*  
    - Contrast with taking center/bottom-left, which splits the board and complicates stealing.  
  - **Generality of Strategy-Stealing:** The game won’t reveal why this works for Chomp but fails in asymmetric games. Briefly note: *“Chomp’s symmetry enables stealing; other games may not.”*  

  ---

  #### **Instructor Script Snippets**  
  - **During Group Struggle:**  
    *“You’re stuck because 3×4 has 12! possible move sequences—brute-force is hard. But what if we prove P1 wins without computing any moves?”*  
  - **Debrief Assumption:**  
    *“The proof glides over why top-right is safe. Philosophically, we assume the move doesn’t break the symmetry needed to steal. Is this justified? Yes—but only because Chomp’s rules treat all squares uniformly.”*  

  This plan forces engagement with nonconstructive reasoning, exposes the "harmless move" assumption, and turns frustration into insight. Good luck! 🍫
