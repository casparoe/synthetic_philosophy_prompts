  | **Reject Horn 1**      | Metalogical Reject(`P`) / *Prasajya* ¬(`P`)             | Rejection of simple affirmation                       | Equating rejection with `¬P`                        | Framework-dissolving performative aspect of *prasajya*      |
  | **Horn 2: ¬A (¬P)**    | Proposition `¬P`                                          | Denial of `P`                                         | Rejection implies `P`                               | -                                                           |
  | **Reject Horn 2**      | Metalogical Reject(`¬P`) / *Prasajya* ¬(`¬P`)           | Rejection of simple denial                            | Equating rejection with `P`                         | Framework-dissolving performative aspect of *prasajya*      |
  | **Horn 3: A ∧ ¬A (P∧¬P)** | Proposition `P ∧ ¬P` / Belnap `B`                         | Dialetheic assertion                                  | `B` as a truth value *within* the system            | Rejection of *applicability* of dialetheism to `P`          |
  | **Reject Horn 3**      | Metalogical Reject(`P ∧ ¬P`) / *Prasajya* ¬(`P ∧ ¬P`)   | Rejection of true contradiction                       | Equating rejection with denying `B` assigned to `P` | Framework-dissolving performative aspect of *prasajya*      |
  | **Horn 4: ¬(A∨¬A) (¬(P∨¬P))** | Proposition `¬(P ∨ ¬P)` / Belnap `N`                      | Neither-value assignment                              | `N` as a truth value *within* the system            | -                                                           |
  | **Reject Horn 4**      | Metalogical Reject(`¬(P ∨ ¬P)`) / *Prasajya* ¬(`¬(P ∨ ¬P)`) | Rejection of assigning `N` (neither) to `P` | Equating rejection with *assigning* `N` to `P`    | Rejection of *applicability/meaningfulness* of `N` to `P`; Framework-dissolving performative aspect of *prasajya* |
  | **Reject All Four**    | Consistent Metalogical Reject(all 4) / Systematic *Prasajya* | Inconsistency of all categorical positions on `P` | Assignment of a fifth value or `N`                | **Therapeutic dissolution of the entire ontological framework presupposed by `P`** |
  | **Emptiness of Emptiness** | Reapply Tetralemma to `Q: "Śūnyatā has svabhāva"` | Prevents reification; Self-application of method | Viewing `Q` as a proposition *within same framework* | **Self-dissolution of the therapeutic tool as merely conventional; Pragmatic function beyond propositional truth** |

  **Conclusion:** Madhyamaka uses logic brilliantly to deconstruct logic's own ontological presuppositions. The residue isn't mystical profundity inaccessible to logic, but a **radical therapeutic pragmatism** centered on the *prasajya*-driven dissolution of frameworks. Your toolkit captures the *logic* perfectly; the *performative, framework-transcending act* is what genuinely lives beyond model-theoretic semantics, residing firmly in the realm of philosophical practice and language use. The tetralemma isn't a failed logic; it's logic turned against its own foundations as medicine for metaphysical craving.
