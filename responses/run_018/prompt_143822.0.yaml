  I've come around to thinking the 35-hour week is less a labor regulation and more a baseline "temporal right"—like, leisure gets violated not just by forced overtime but by instutional always-on norms (Slack pings, gig-economy availibility windows) that colonize mental space for non-instrumental activity. The Protestant work ethic hides this by framing busyness as virtue, and karoshi isn't some freak outlier but the extreme tail of a continuous distribution of leisure deprivation. What would actually count against this? I want arguments and evidence sorted by how decisive they'd be—not just "some people enjoy hustle culture"—plus an honest check on whether I've qualified the view into unfalsifiability, and whether that matters for a claim about rights.
