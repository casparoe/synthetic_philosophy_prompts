answer: |-
  You've perfectly diagnosed a critical flaw in how research programmes can evade falsification! While Lakatos didn't coin a *single* specific term for *exactly* this loop, he described its components and consequences clearly. What you're seeing is the **degenerative core of ad hoc hypothesis construction combined with retroactive "prediction" claims.**

  Here's how Lakatos and related concepts address your specific pattern:

  1.  **Ad Hoc Hypothesis:** This is the key starting point. Adding a qualifier like "only in non-living systems" or "masked by background noise" *specifically* to save the core from a known anomaly, *without* any independent motivation or new testable content, is the definition of an **ad hoc adjustment** (Lakatos's "ad hoc₃" – saving the theory from a *specific* threat without excess content).
  2.  **Lack of Novel Predictions:** The crucial degenerative step is claiming this ad hoc patch *itself* constitutes a "novel prediction." Lakatos was adamant that for an adjustment to be progressive, it must predict *novel facts* – facts *not used in constructing the hypothesis*. Predicting the *absence* of the effect *in the very case that forced the patch* is **not a novel prediction**. It's a trivial consequence of the patch itself. It's **retrofitting**, **post-hoc accommodation**, or **immunization by qualification**.
  3.  **Pseudo-Novelty / Illusion of Progress:** This retroactive claim creates the illusion that the programme successfully predicted the anomaly *in advance*, making it seem progressive. This is **pseudo-novelty** or **spurious corroboration**. The programme avoids the negative heuristic (modifying the core) by misapplying the positive heuristic (claiming predictive success where none exists).
  4.  **Degenerating Problem Shift:** The entire manoeuvre – protecting the core with an ad hoc hypothesis and then misrepresenting the accommodation as a prediction – constitutes a **degenerating problem shift** within the research programme. It consumes resources (time, effort) defending the core without yielding any *new* empirical content or understanding. Energy goes into self-justification, not discovery.
  5.  **The Loop:** This creates the self-sustaining loop you identified: Anomaly emerges -> Ad hoc patch is applied -> Patch is declared to have "predicted" the anomaly -> Programme declared healthy -> Repeat. **Immunization Stratagem** captures the protective, self-sealing nature.

  **Is there a specific term for the loop?**

  *   Lakatos himself described this *process* as the hallmark of a degenerating programme: "In degenerating programmes, however, theories are fabricated only in order to accommodate known facts." The loop you describe is the *mechanism* of that degeneration.
  *   Philosophers sometimes refer to this as **pseudo-progress** or the **degenerative spiral**.
  *   Larry Laudan (criticizing Lakatos) talked about **non-progressive accommodation**, which fits perfectly.
  *   Imre Lakatos contrasted it sharply with **progressive problem shifts**, where adjustments *do* lead to *bona fide* novel predictions.

  **Distinguishing from Ordinary Auxiliary Adjustments:**

  You're right to sense a distinction. Not all protective belt adjustments are degenerative:

  1.  **Progressive Adjustment:** An adjustment motivated by the programme's positive heuristic (internal logic) *or* one that successfully predicts *novel* phenomena *beyond* the anomaly it was initially designed to handle. E.g., adding epicycles wasn't inherently bad; it became degenerative when piled on *only* to save Ptolemy's core from *specific* anomalies without broader predictive gains.
  2.  **Degenerative/Ad Hoc Adjustment:** The type you described: Motivated *only* by saving the core from a specific threat, lacking independent justification, and crucially, *not* generating novel predictions. The retroactive claim of "prediction" is the deceptive icing on the cake.

  **Why it Matters & How Programmes Eventually Die:**

  This loop *is* degenerating research in disguise. However, Lakatos argued programmes aren't killed by a single anomaly or even this loop in the short term. They die when:

  1.  **The Protective Belt Becomes Unwieldy:** The pile of ad hoc patches becomes too complex and baroque.
  2.  **Empirical Exhaustion:** The programme consistently fails to generate *any* genuine novel predictions despite effort.
  3.  **A Rival Progressive Programme Emerges:** A competing programme consistently generates novel predictions and explains the anomalies troubling the degenerating programme *better*.

  **In essence:** You've identified the core deceptive manoeuvre that allows degenerating programmes to persist longer than naive falsificationism would suggest. While lacking a single perfect term, it's accurately described as **degenerating problem shifts driven by ad hoc hypotheses and the spurious claim of retroactive "predictions"** or simply the **immunization loop** of a degenerating programme. It's the antithesis of the **novel prediction** requirement that Lakatos placed at the heart of scientific progress. Your intuition that this is distinct from legitimate protective belt work is spot on.
