prompt: |-
  On Lewis's account, a convention is an arbitrary regularity that solves a coordination problem and persists through common knowledge—including knowledge that the regularity is arbitrary and that others conform. This appears to require that participants represent the problem and recognize alternatives. Yet many norms seem to emerge through evolutionary drift: agents reproduce behaviors with local adjustments, never representing the global pattern as arbitrary or explicitly coordinating on it. If a dialect gradually shifts to fixed SVO word order through generational transmission without speakers ever treating word order as a choice point, can this still be a Lewisian convention? Or does the absence of explicit common knowledge about arbitrariness place drift-based norms outside his framework, forcing a choice between rational-choice and selectionist explanations? Please correct any misconception in my framing and respond in a single paragraph of no more than 130 words.
reasoning: |-
  Hmm, the user is asking about Lewis's theory of conventions in the context of language evolution. They're specifically wondering if a drift-based norm like SVO word order emerging through generational transmission without explicit awareness can still be considered a Lewisian convention. They frame this as a tension between rational-choice and selectionist explanations.

  I need to recall Lewis's key elements: conventions as arbitrary solutions to coordination problems that persist through common knowledge. But the user points out that in evolutionary drift, speakers may never represent alternatives or recognize arbitrariness explicitly. This seems problematic for Lewis's framework which emphasizes conscious recognition.

  The dialect shift example is strong - speakers just inherit patterns without choice. Lewis does require common knowledge of arbitrariness and alternatives. So strictly speaking, such unconscious patterns wouldn't qualify as conventions under his definition. But I should acknowledge that Lewis allows conventions to emerge from precedent or habit, though he maintains the rational-choice foundation.

  The user's framing seems accurate - they correctly identify the tension. My response should clarify that while evolutionary processes can produce regularities, Lewis's specific requirements about conscious recognition would exclude purely drift-based norms. This indeed creates a gap between rational-choice and selectionist explanations that Lewis doesn't fully bridge.
answer: |-
  Your framing is largely accurate. Strictly applying Lewis's definition, the SVO shift likely wouldn't qualify as a *convention* because it lacks the crucial element of common knowledge regarding the pattern's arbitrariness and the availability of alternatives. Lewis explicitly requires participants to recognize the regularity as one possible solution among others and to know others recognize this too. Evolutionary drift, where patterns emerge and stabilize through unconscious transmission and selective retention without agents representing the problem or alternatives, bypasses this reflective, knowledge-based requirement. While Lewis allows conventions to start from precedent, he grounds their persistence in rational common knowledge. Thus, purely drift-based norms fall outside his rational-choice framework, highlighting a genuine distinction between convention (Lewis) and cultural selection.
