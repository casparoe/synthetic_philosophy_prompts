  Next, I need to distinguish what's strictly necessary versus merely fitting well with this implicit theory. For example, preservation techniques like embalming and sealed caskets seem core to maintaining the illusion of persistence, but public health measures like handling bodies safely could be justified without it. Relational aspects, like memorials for community bonding, don't strictly require the self-persistence idea but fit well with it. Control over disposition is tied to the property view of the body, whereas grief support could be reframed in non-traumatizing ways.

