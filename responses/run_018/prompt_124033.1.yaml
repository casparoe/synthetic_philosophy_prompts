prompt: |-
  In graduate seminars on global justice, the proverb "charity begins at home" is repeatedly invoked—not as an opening observation but as a conversation-stopper—to resist the claim that wealthy states bear stringent, direct obligations to non-citizens, whether in refugee resettlement, climate reparations, or the distribution of globally scarce medical resources. Before I allow it to do that work in my classroom, I want its precise logical anatomy mapped. Please lay out, as a menu of distinct theses rather than a single interpretation, the precise claims that slogan could be expressing. For each reading, indicate: (i) whether it concerns the scope of moral obligation, the psychology of motivation, the efficacy of institutional delivery, or the normative legitimacy of state partiality; (ii) whether it amounts to a trivial empirical generalization, a defensible but limited principle of practical reason, or a false or morally arbitrary boundary; and (iii) whether, on that reading, the proverb genuinely supports a nationalist conclusion—say, that compatriots possess special agent-relative claims—or whether it remains fully compatible with a cosmopolitan distributive scheme. I am especially interested in the intermediate positions that smuggle in substantive philosophical commitments: for instance, a view that treats the state as a cooperative scheme for mutual advantage rather than as a node in a structure of global injustice; or a claim that associative duties are generated by shared political membership but are strictly non-transferable. Distinguish these from the genuinely trivial claim that agents should address local problems they are well-positioned to solve. Finally, tell me which of these readings is actually being invoked when an interlocutor uses the phrase to dismiss obligations to distant strangers, and whether that particular reading can survive the objection that national borders are, from the standpoint of moral justification, as arbitrary as place of birth.
reasoning: |-
  Okay, the user is teaching a graduate seminar on global justice and keeps encountering the proverb "charity begins at home" used as a conversation-stopper against obligations to non-citizens. They want me to dissect this proverb into distinct logical theses rather than letting it function as a rhetorical shutdown. 

  Hmm, this is clearly a sophisticated philosophical request. The user isn't just asking for definitions—they want a taxonomy of interpretations that exposes hidden premises. They're frustrated with how this slogan gets weaponized in debates about refugee resettlement, climate reparations, etc. I should avoid oversimplifying.

  First, I need to categorize possible readings across four dimensions: (i) domain (scope/motivation/efficacy/legitimacy), (ii) philosophical weight (trivial/defensible/false), (iii) compatibility with cosmopolitanism. The user specifically wants me to flag interpretations that smuggle in nationalist assumptions—like seeing states as mutual advantage clubs rather than sites of structural injustice. 

  *flipping through mental index cards of political philosophy arguments* Right, the obvious starting point is the trivial efficacy claim (#1)—that local action is often more efficient. But that's not what shutdown-artists mean. The problematic readings are #3-6 where "home" gets morally inflated. 

  Ah, and the user's last question is crucial: which version actually gets invoked in classrooms? Definitely #4 or #5—the associative duties or priority rules versions. Both treat national borders as morally significant boundaries. But that's precisely what cosmopolitans challenge when calling borders "arbitrary." 

  *imagining a grad student slamming the proverb on the table* When someone says this to dismiss refugee obligations, they're implying compatriots have special claims. But does that hold if borders are morally arbitrary? Only if you think political membership itself creates duties—which is circular! The arbitrariness objection cuts deep here. 

  I should emphasize how #4 and #5 aren't neutral; they presuppose particular theories of justice (institutionalist vs. relational). The user will appreciate that nuance. And note that even defensible readings (#1-2) don't justify neglecting distant strangers—just sequencing action. 

  *checking for blind spots* Did I cover all smuggled commitments? Yes: mutual advantage model in #3, non-transferable duties in #4, lexical priority in #5. And distinguished them from the benign efficiency claim. 

  Final touch: explicitly map which readings survive the "arbitrariness" objection. Only #1-2 and maybe #6 can, but #6 is weak. The nationalist favorites (#4-5) crumble if borders lack intrinsic moral weight. That's the mic-drop moment for the seminar.
answer: |-
  Here is a logical anatomy of "charity begins at home," dissected into distinct theses, structured to meet your specifications. The readings progress from least to most normatively substantive:

  ### **1. The Efficacy Thesis**  
  *(i) Domain:** Efficacy of institutional delivery*  
  *(ii) Status:** Defensible but limited principle of practical reason*  
  *(iii) Compatibility with Cosmopolitanism:** Fully compatible*  
  **Thesis:** Addressing local needs is often more efficient due to proximity, knowledge, and institutional capacity. Resources achieve greater impact when deployed domestically.  
  **Critical Analysis:** Pragmatic but not principled. Doesn't deny obligations to non-citizens; merely advises prioritizing contexts where help is most effective. Compatible with robust global duties if local efficacy is maximized first or if global institutions improve.  

  ---

  ### **2. The Motivational Thesis**  
  *(i) Domain:** Psychology of motivation*  
  *(ii) Status:** Trivial empirical generalization*  
  *(iii) Compatibility with Cosmopolitanism:** Fully compatible*  
  **Thesis:** Humans are psychologically predisposed to care more about proximate, visible suffering. Cultivating altruism locally builds moral character that may later extend globally.  
  **Critical Analysis:** Descriptive, not prescriptive. Acknowledges a cognitive bias but doesn't justify it normatively. Cosmopolitanism can accept this as a hurdle to overcome (e.g., via education) rather than a justification for partiality.  

  ---

  ### **3. The Associative Obligations Thesis**  
  *(i) Domain:** Scope of moral obligation / Normative legitimacy of state partiality*  
  *(ii) Status:** Defensible but contested principle*  
  *(iii) Compatibility with Cosmopolitanism:** Contingently compatible (if associative duties are *pro tanto*)*  
  **Thesis:** Shared citizenship or communal ties generate special obligations that are distinct from, and sometimes prior to, general duties to humanity.  
  **Smuggled Commitments:**  
  - Political community as a "cooperative scheme for mutual advantage" (Rawlsian).  
  - Associative duties arise from reciprocity, shared institutions, or collective self-determination.  
  **Critical Analysis:** Defensible if associative duties are *pro tanto* (can be outweighed by global severe deprivation). **Not compatible** if framed as *lexically prior* or strictly non-transferable (see Thesis 5). Survives "arbitrariness" objection only if ties like *democratic reciprocity* (not mere birth) ground obligations.  

  ---

  ### **4. The Non-Transferability Thesis**  
  *(i) Domain:** Scope of moral obligation*  
  *(ii) Status:** False or morally arbitrary boundary*  
  *(iii) Compatibility with Cosmopolitanism:** Incompatible*  
  **Thesis:** Duties of justice are strictly bound to the political community that generates them. Obligations to compatriots are non-transferable; "charity" to outsiders is supererogatory.  
  **Smuggled Commitments:**  
  - The state as the sole site of distributive justice (statist view).  
  - Political obligations dissolve at borders; global "charity" is discretionary.  
  **Critical Analysis:** Borders *are* arbitrary from a moral standpoint. If obligations arise from capacity to assist or causal responsibility (e.g., for climate harm), this thesis collapses. Nationality cannot justify ignoring urgent needs of non-citizens.  

  ---

  ### **5. Lexical Priority Thesis**  
  *(i) Domain:** Scope of moral obligation*  
  *(ii) Status:** Defensible but highly contested*  
  *(iii) Compatibility with Cosmopolitanism:** Incompatible*  
  **Thesis:** Domestic obligations must be *fully satisfied* before any resources can be directed abroad. "Home" is a lexically prior moral category.  
  **Smuggled Commitments:**  
  - Communitarian ontology: Identity and duties are constituted by local belonging.  
  - "Home" as a preconditional moral baseline.  
  **Critical Analysis:** Morally arbitrary if domestic "sufficiency" is defined expansively (e.g., middle-class comforts). Ignores that some global harms (e.g., climate disaster) are urgent and directly caused by wealthy states.  

  ---

  ### **6. The Boundary of Moral Consideration Thesis**  
  *(i) Domain:** Scope of moral obligation*  
  *(ii) Status:** False or morally arbitrary boundary*  
  *(iii) Compatibility with Cosmopolitanism:** Incompatible*  
  **Thesis:** "Home" defines the boundary of primary moral concern. Non-citizens fall outside the scope of justice; aid to them is purely charitable.  
  **Smuggled Commitments:**  
  - Ethical nationalism: Moral worth is mediated by national membership.  
  - Cosmopolitanism as psychologically/ethically implausible.  
  **Critical Analysis:** Reduces to tribalism. Birthplace is paradigmatically arbitrary; no defensible theory restricts moral worth to compatriots.  

  ---

  ### **Which Reading is Typically Invoked?**  
  When used to **dismiss obligations to distant strangers**, interlocutors most often invoke **Thesis 4 (Non-Transferability)** or **Thesis 5 (Lexical Priority)**. These assert that obligations to non-citizens are either invalid or perpetually deferred. The slogan smuggles in a statist/communitarian metaphysics where borders demarcate moral spheres.  

  ---

  ### **Can These Readings Survive the "Arbitrariness" Objection?**  
  - **Thesis 4 & 5**: **No.** If borders are morally arbitrary (like birthplace), they cannot bear the justificatory weight of *absolute* priority or non-transferability. Associative duties may exist but cannot nullify baseline duties to non-citizens in extremis.  
  - **Thesis 3**: **Only if weakened.** Associative duties might be *pro tanto*, but they are overridden when global inequalities are life-threatening and causally tied to wealthy states (e.g., colonial legacies, climate debt).  
  - **Thesis 1 & 2**: **Yes.** These are pragmatic/psychological and don't rely on the *moral significance* of borders.  

  ---

  ### **Key Philosophical Takeaway**  
  The proverb functions as a **conversation-stopper** by masking substantive commitments:  
  1. A **statist ontology** of justice (Theses 4–6),  
  2. A **thick communitarianism** (Theses 3, 5), or  
  3. A **willful conflation** of efficacy with obligation (Thesis 1 vs. 4).  
  To disarm it, demand interlocutors specify *which thesis* they defend and confront the arbitrariness objection head-on. Only Theses 1–2 survive unscathed—and they fail to block cosmopolitan obligations.
