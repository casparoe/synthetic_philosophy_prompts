  We are designing a decision procedure based on lexical-threshold negative utilitarianism with an incommensurability constraint. The procedure has 4 stages:

  1. **Suffering-Intensity Screening**: 
     - Determine if there is suffering above the defined lexical threshold. The threshold is defined as suffering of such intensity that it has lexical priority over any pleasure or preserved consciousness.
     - Criteria for sufficient evidence: Objective measures (e.g., validated pain scales, physiological markers) and subjective reports (when available and reliable) must indicate suffering at or above the threshold level. The threshold is predefined (e.g., severe and unrelenting pain that is refractory to standard treatments, or suffering that is unbearable and persistent as judged by the patient or, if the patient cannot communicate, by proxy measures and clinical consensus).
     - Misfire conditions (when to disregard evidence):
          - False positives due to sedation-confounded reports (e.g., a patient under sedation may not report accurately because of altered mental state).
          - Category errors: Comparing different types of experiences (e.g., comparing the quality of consciousness, such as the value of being minimally aware, with the intensity of nociceptive pain) without a common metric.
     - If the screening determines that suffering is above the threshold, then the lexical priority rule applies and we proceed to step 3 for threshold-triggered cases.

  2. **Commensurability Assessment** (only if the lexical threshold is not triggered in step 1):
     - Test whether the proposed intervention's benefits (e.g., pleasure, relief, preserved consciousness) and residual suffering (if any) can be mapped onto a shared clinical-evaluative dimension. This dimension must be one that is accepted in the clinical context (e.g., overall quality of life, patient's own goals and values, or a specific dimension such as physical comfort vs. cognitive function).
     - Success of mapping: We can establish a common dimension if there is a clear trade-off that the patient (or in cases of incapacity, an advance directive or surrogate) has endorsed, or if there is a clinical consensus on a relevant dimension (e.g., a validated quality-of-life scale that incorporates both aspects). 
     - Failure of mapping: If the benefits and residual suffering are incommensurable (e.g., the patient values cognitive clarity above all and the intervention impairs it, while reducing physical pain, and there is no way to balance these on a single scale without violating the patient's core values), then the mapping fails.

  3. **Decision Rules**:
     - **Threshold-triggered case** (from step 1): Lexical priority applies. The intervention that reduces suffering below the threshold must be approved, provided it is medically appropriate and does not cause equivalent or greater suffering in the process (e.g., by causing severe side effects that are above the threshold). If the intervention itself causes suffering above the threshold, then it must be reconsidered or modified.
     - **Below-threshold case** (and mapping succeeds in step 2): We can compare benefits and residual suffering on the common dimension. The intervention is approved if the net benefit is positive (i.e., benefits outweigh residual suffering) according to the established dimension. If the net benefit is negative or zero, the intervention is not approved.
     - **Below-threshold case and mapping fails** (in step 2): The procedure flags an irreducible value conflict and moves to step 4 (human deliberation).

  4. **Stop Points**:
     - If at step 1 the lexical threshold is triggered and the intervention reduces suffering below the threshold without causing above-threshold suffering elsewhere, the procedure recommends approval.
     - If at step 1 the lexical threshold is not triggered, and then at step 2 the mapping succeeds, and the net benefit is positive, the procedure recommends approval; if net benefit is negative, it recommends rejection.
     - If at step 2 the mapping fails, the procedure flags an irreducible value conflict and stops, requiring human deliberation.
     - Additionally, if the intervention itself causes suffering above the threshold (in step 3, threshold-triggered case) and cannot be modified to avoid that, the procedure may recommend rejection or modification.

  **Judgment calls that resist proceduralization**:
     - Defining the exact threshold of suffering: This may require clinical judgment and interpretation of patient reports or proxy measures.
     - Assessing the reliability of evidence (e.g., when reports are confounded by sedation or cognitive impairment).
     - Determining when two dimensions are commensurable: This involves interpreting the patient's values and goals, which may be complex and not fully documented.
     - In the commensurability assessment, establishing a shared dimension may require value judgments about what constitutes a relevant clinical dimension.

  **Conditions for suspending the procedure**:
     - If there is insufficient or ambiguous evidence about the patient's condition or the effects of the intervention.
     - If the patient's values are unknown and there is no surrogate, making commensurability assessment impossible.
     - If the case involves a novel intervention or condition that the procedure was not designed to handle.

