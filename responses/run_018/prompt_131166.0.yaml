answer: |-
  **Municipal Well-Being Experience Rental Programme: Standard Terms of Service**

  1.  **Programme Participation & Objective Well-Being Components.** The Hirer acknowledges and irrevocably consents to the mandatory integration of Council-approved Objective Well-Being Elements ("OWEs") within all Rental Experiences. These OWEs, as defined by the Standing Subcommittee on Flourishing Metrics (Schedule 7B), constitute activities demonstrably correlated with longitudinal life satisfaction data (e.g., nutritional kale ingestion quotas, structured community volunteering, moderate cardiovascular exertion). Participation in OWEs is non-negotiable and forms a constitutive element of the Rental, irrespective of the Hirer's contemporaneous hedonic state or declared preferences during the Experience. Failure to complete assigned OWEs constitutes a material breach, triggering Mandatory Recalibration Sessions at the Hirer's expense. The Programme disclaims all liability for dissonance arising between experienced enjoyment and the intrinsic value ascribed to OWEs by Council bylaws.

  2.  **Desire Fulfilment Metrics & Adaptive Preference Adjustment.** Billing for Experiences utilising the Pleasure-Maximisation Tier ("PMT") is calculated based on real-time Desire Satisfaction Indices ("DSIs"), as self-reported via mandatory neural-feedback apparatus. However, the Hirer accepts that DSIs are subject to inherent flux due to Preference Adaptation Phenomena ("PAP"), whereby prolonged exposure to certain stimuli may systematically alter desire structures, potentially reducing fulfilment scores for previously desired states. Programme algorithms automatically apply retrospective PAP Discount Factors to initial DSI benchmarks. Consequently, final invoices reflect fulfilment *adjusted for acquired preferences*, which may result in charges exceeding initial projections if adaptation lowers satisfaction thresholds. Disputes regarding PAP calibration must be lodged within 14 days post-Rental, citing relevant neuroscientific literature (peer-reviewed, Council Index only).

  3.  **Authenticity Warrants & Hedonic Refund Claims.** Refunds or partial credits for Experiences deemed insufficiently pleasurable ("Hedonic Deficiency Claims") are contingent upon the Hirer demonstrating, to the satisfaction of the Well-Being Ombudsman, that the perceived deficiency arose *despite* the Experience conforming precisely to its advertised pleasure-potential parameters *and* that the Hirer maintained Authentic Engagement throughout. Authentic Engagement is defined as the absence of deliberate meta-cognitive reflection upon the simulated nature of the Experience or its potential to fulfil deeper life projects ("Nozickian Contemplation"). Crucially, the act of lodging a Hedonic Deficiency Claim itself constitutes prima facie evidence of inauthentic meta-cognitive activity, thereby invalidating the claim. Refunds for dissatisfaction are thus procedurally impossible.

  4.  **Mandatory Obligations Deriving from Goods Lists.** Engagement with Experiences incorporating elements from the Council's Recognised Objective Goods Inventory ("ROGI"), including but not limited to Meaningful Relationships (simulated), Intellectual Mastery, or Aesthetic Appreciation, imposes specific Performative Obligations on the Hirer. These Obligations (e.g., demonstrating attentiveness during simulated dialogue, completing cognitive puzzles, expressing protocol-defined admiration) are essential for the ROGI component to accrue its designated well-being value. Non-performance, even if stemming from profound boredom or a subjective sense of pointlessness, voids the ROGI contribution and may incur Non-Compliance Surcharges. Opting out of ROGI-aligned Experiences requires written application demonstrating pre-existing, verifiable alignment with said Goods via external assessors (fees apply).

  5.  **Liability Exclusion for Constitutive Well-Being Paradoxes.** The Programme explicitly disclaims liability for any subjective distress, existential disquiet, or metaphysical dissatisfaction ("Category-X Discontent") arising directly from the inherent structural tensions between the Programme's offered well-being models. This includes, but is not limited to: anguish caused by the conflict between pursuit of momentary pleasure (PMT) and the requirement for Authentic Engagement (Clause 3); cognitive dissonance resulting from mandatory participation in objectively valuable but subjectively unpleasant OWEs (Clause 1); or frustration stemming from the PAP-adjusted reduction of desire fulfilment scores despite unchanged experiential input (Clause 2). Category-X Discontent is deemed an inherent risk of multi-paradigmatic well-being provisioning. Resolution pathways are limited to transferring to a different Tier (subject to availability and recalibration fees) or submitting a formal Query to the Subcommittee on Ontological Grievances (response timeframe: 6-18 months, standard processing).
