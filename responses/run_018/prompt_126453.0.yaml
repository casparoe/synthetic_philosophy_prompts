prompt: |-
  Hey, I'm drafting case studies for my ethics seminar and I keep circling back to this board I sit on — call it the National Archive Dramatization Panel. We've got four rulings that I think hang together but maybe they don't. Here's the track record, abridged and a bit sloppy:

  We green-lit the 2019 biopic that invented a love triangle for a dead physicist, as long as the credits said "some scenes dramatized."

  We killed a script that showed a real civil-rights leader accepting a bribe; zero evidence, and the writer said it was "thematically true."

  We conditionally approved the composite-character play — three activists rolled into one — but only after they changed every name and added a front-matter note saying "this is not a biography."

  We rejected the docu-drama that rearranged actual letter quotes out of order so the dead subject seemed to endorse a position she explicitly rejected in the same letters.

  Now we've got a proposal for a limited series about a philosopher who died in 2014. The showrunners want to depict her having an undocumented opioid addiction in her last years, using that to "explain" her sudden shift from analytic metaphysics to continental-style political writing. No fabricated quotes, but lots of invented private suffering. The family says it's defamation of the dead; the producers say it's a "plausible psychological reconstruction" that makes her work accesible to a general audience. They point out we allowed the love-triangle invention.

  What should we do if we want to be genuinely consistent with ourselves? Which of the four is the closest analog, and if our precedents underdetermine it, what principle are we adopting either way — fidelity to documented psychology, protection of posthumous narrative dignity, accessibility of legacy, or something else? Also, what's the further case that'd actually split those rules apart?

  Don't give me citations or a reading list — just work the logic. Give me the answer as JSON with these fields: predicted_verdict (approve / reject / conditional), closest_precedent (name it), candidate_rules (array of 2-3 objects with "rule" and "predicts"), best_guess_with_reason, adopted_principle_if_rejected, adopted_principle_if_approved, and tie_breaker_case (a brief hypothetical that distinguishes the rules). Keep it focused.
reasoning: |-
  We are given four precedents:

  1. 2019 biopic: Approved with condition (credits say "some scenes dramatized") - invented a love triangle for a dead physicist.
  2. Script about civil-rights leader: Rejected - showed accepting a bribe with zero evidence, writer claimed it was "thematically true".
  3. Composite-character play: Conditionally approved - changed every name and added a front-matter note saying "this is not a biography".
  4. Docu-drama: Rejected - rearranged actual letter quotes to make the dead subject seem to endorse a position she explicitly rejected.

  Current case: Proposal for a limited series about a philosopher (died 2014) depicting her having an undocumented opioid addiction in her last years to explain her shift in philosophical style. The family objects, calling it defamation. Producers argue it's a "plausible psychological reconstruction" and point to the love-triangle precedent.

  Analysis:

  - The current case involves inventing private suffering (opioid addiction) that is undocumented and using it to explain a real shift in her work. There are no fabricated quotes, but the depiction is not based on evidence.

  Comparison to precedents:

  1. Love triangle (approved): This was an invention of a personal relationship (fictional) but not something that would necessarily damage the physicist's reputation. The condition was a disclaimer.

  2. Bribe (rejected): This was an invention of a morally compromising act (bribe) with no evidence, which would damage the civil-rights leader's reputation.

  3. Composite character (approved with conditions): This combined real people but changed names and added a clear disclaimer that it's not a biography. It was about activists and the change of names and disclaimer protected the real individuals.

  4. Misrepresentation of views (rejected): This altered the subject's expressed views by rearranging quotes, thus misrepresenting her stance.

  The current case is about inventing a serious personal struggle (addiction) that is undocumented and using it to explain a shift in her work. This is a negative portrayal that could damage her reputation, similar to the bribe case. However, the love triangle was also an invention but was approved. The key difference is the nature of the invention: a love triangle is a neutral or even positive (in terms of romance) invention, whereas an opioid addiction is a negative and stigmatizing condition.

  The composite character case avoided harm by changing names and disclaiming biography, so it wasn't about a specific individual. The current case is about a specific person and would use her real name and identity.

  The docu-drama case was rejected because it misrepresented the subject's views. The current case does not misrepresent her views (no fabricated quotes) but invents a personal struggle.

  Thus, the closest precedent is the bribe case (rejected) because both involve inventing negative, reputation-damaging behavior without evidence. However, the producers point to the love triangle case (approved). The distinction is the nature of the invention: the love triangle, while fictional, did not harm the physicist's reputation, whereas the opioid addiction would. Also, the bribe was a moral failing (corruption) and the addiction might be seen as a health issue, but the family considers it defamation because it portrays her as an addict without evidence and suggests her intellectual shift was due to addiction rather than genuine philosophical evolution.

  We must consider the principle of protecting the deceased from unfounded negative portrayals. The panel has drawn a line at inventions that damage reputation without evidence (bribe case) and misrepresentation of views (docu-drama). The love triangle was not damaging and the composite character avoided harm by changing names.

  Therefore, the current proposal should be rejected because it invents a damaging and undocumented personal struggle that could tarnish the philosopher's legacy. The family's objection is valid.

  But note: the condition in the composite character case was changing names and disclaimer. Could we do that here? The producers are not proposing to change her name because they want to use her real identity to make her work accessible. They want to use her real name and story. So conditional approval with a disclaimer might not be enough because the damage is done by attributing the addiction to her specifically.

  Candidate rules:

  1. Rule: "Reject inventions of undocumented negative behaviors that damage reputation." (Predicts rejection of current case and bribe case, and approval of love triangle as not negative enough to damage reputation? But note: the love triangle wasn't negative, so it doesn't fall under this rule.)

  2. Rule: "Require disclaimers for dramatizations that invent events, but reject if the invention is both negative and without evidence." (This would reject the bribe and the current case, and approve the love triangle with disclaimer.)

  3. Rule: "Allow dramatizations that invent private lives as long as they don't misrepresent known views or actions and are not defamatory." (But the current case is seen as defamatory by the family.)

  The panel's adopted principles:

  - If rejected: Principle of protecting the deceased from unfounded negative portrayals that damage their narrative dignity and legacy.

  - If approved: Principle of allowing artistic freedom to create plausible psychological reconstructions for accessibility, as long as there is a disclaimer and no misrepresentation of documented facts (like quotes).

  But note the bribe case was rejected even though the writer claimed it was "thematically true". Similarly, the current producers say it's "plausible". However, the panel rejected the bribe because there was zero evidence. The same applies here: zero evidence of opioid addiction.

  Thus, the predicted verdict is: reject.

  Closest precedent: the bribe case (the second one).

  Candidate rules:

  - Rule 1: Reject any dramatization that invents negative, undocumented behavior that could damage the subject's reputation. (Predicts rejection in the bribe case and the current case, and approval in the love triangle and composite cases because the composite case changed names and the love triangle wasn't damaging.)

  - Rule 2: Allow dramatizations that invent private events as long as they are not defamatory and are accompanied by a disclaimer. (But then why was the bribe case rejected? Because it was defamatory without evidence. So this rule needs to specify: reject if defamatory without evidence. Then the current case would be rejected because it's defamatory without evidence.)

  But the love triangle was not defamatory? It might be if it portrayed the physicist in a negative light (e.g., cheating) but the case doesn't say. We assume it was not. The current case is clearly negative.

  Best guess with reason: reject, because the invention of an undocumented opioid addiction is a damaging portrayal without evidence, similar to the bribe case. The love triangle precedent is distinguished because it did not involve a negative, reputation-harming invention.

  Adopted principle if rejected: Protection of posthumous narrative dignity against unfounded negative portrayals.

  Adopted principle if approved: Artistic freedom for plausible psychological reconstructions that make a subject's work accessible, as long as there is a disclaimer and no misrepresentation of documented facts.

  But the panel did not approve the bribe case even with a disclaimer? The bribe case was rejected outright. The composite case was approved with conditions because they changed names and added a disclaimer. The love triangle was approved with a disclaimer. So the panel does allow disclaimers for some inventions, but not for damaging ones without evidence.

  Tie-breaker case: A hypothetical where a film invents a positive undocumented trait (e.g., a scientist secretly donating to charity) to explain their work. This would test whether the rule is about any invention without evidence or only negative ones. The panel might approve such a case with a disclaimer, showing that the rule is about avoiding harm.

