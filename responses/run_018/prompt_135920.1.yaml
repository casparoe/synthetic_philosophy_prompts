  Now, diagnosing the stall. The disagreements seem to stem from different priorities: mathematical rigor vs. normative guidance vs. descriptive psychology. Each side values different aspects—consistency of math, practical decision-making, or human behavior. They might be answering different questions under the same umbrella term of "rationality."

