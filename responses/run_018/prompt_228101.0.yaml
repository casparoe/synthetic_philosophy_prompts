  Okay, let me break down this fascinating grad seminar problem. The user wants a rigorous set of desiderata for any physics-grounded moral patiency theory, with special attention to potential conflicts and dealbreakers. 

  First, I need to extract the core challenge: they're not asking for a critique of that quirky thermodynamic criterion, but for foundational requirements that would apply to ALL such theories. The user's own list is already sophisticated - covering epistemic access, coarse-graining invariance, composition puzzles, and aggregation nightmares. 

  Hmm, where might there be gaps? The user mentions causal closure but doesn't explicitly flag the hard problem of consciousness - how physical processes generate subjective experience at all. That seems a crucial metaphysical hurdle. Also, their "boring cases" point could be extended: what about non-human animals or borderline cases like comatose patients? And they note valenced experience but not its relationship to moral weight - is all suffering equally bad, or does intensity matter?

  The aggregation problem feels particularly thorny. If stars morally outweigh planets, does that demand total utilitarianism on cosmic scales? That could vaporize everyday ethics. And coarse-graining invariance seems non-negotiable - if moral status changes when we describe a system at different scales, that's fatal.

  For conflicts... the combination problem vs causal closure looks nasty. If micro-experiences combine into macro-subjects, how does that interaction work without violating physics? And any theory that makes planetary suffering epistemically inaccessible (like the sun's putative agony) risks being self-undermining.

  The user's interest in "which requirement knocks out most candidates" is telling. Probably coarse-graining or aggregation - both expose how physics-based criteria might decouple from moral intuition. If I had to pick one keeper, it'd be coarse-graining invariance. Without it, morality becomes a description-relative illusion.

  Better flag that meeting ALL desiderata may be impossible - that's a seminar-worthy result itself. The thermodynamic example will usefully fail several tests (e.g., coarse-graining, aggregation), while integration theories struggle with combination. 

  Final thought: emphasize that these aren't just academic boxes to tick. Each desideratum protects against a different ethical catastrophe - from moral solipsism to planetary disregard. That's why the coarse-graining point is the hill to die on.
answer: |-
  Here is a comprehensive list of desiderata for *any* theory grounding moral patiency in fundamental physics, building on your foundation and identifying critical gaps, tensions, and dealbreakers. Key considerations motivating each requirement are provided, along with their negotiability status.

  ### Desiderata for Physics-Grounded Moral Patiency Theories

  1.  **Epistemic Access & Causal Efficacy (Non-Negotiable):**  
      *   **Why:** The theory must explain how we can *know* about moral patiency (especially in others) if consciousness is fundamental. If experience is causally inert (strong epiphenomenalism), knowledge of others' suffering becomes inexplicable, undermining the very evidence used to argue for panpsychism. Causal closure must be respected without rendering consciousness irrelevant to knowledge or behaviour.
      *   **Case:** Our justified belief that humans (and likely mammals) suffer relies on behavioural, neural, and verbal correlates.

  2.  **Coarse-Graining Invariance (Non-Negotiable):**  
      *   **Why:** Moral patiency cannot depend on the descriptive scale (microscopic, macroscopic) used to model a system. Physics allows multiple valid descriptions (e.g., particles vs. fields, atoms vs. molecules vs. bulk matter). Moral status must be a property *of the system itself*, not our description of it.
      *   **Case:** Whether we model a log as burning cellulose or interacting quarks, its moral status (if any) should be identical. Changing description level shouldn't toggle suffering on/off.

  3.  **"Boring Cases" Fidelity (Non-Negotiable):**  
      *   **Why:** The theory must recover robust intuitions about paradigmatic cases: conscious humans experience morally relevant states; rocks or fundamental particles in isolation likely do not. Crucially, it must explain *why* anaesthesia, deep sleep, or death suspend patiency *without* ad hoc exemptions.
      *   **Case:** An anaesthetised human lacks conscious experience despite ongoing complex physics; a superconductor exhibits coherent quantum behaviour without obvious suffering.

  4.  **Valence Specification (Non-Negotiable):**  
      *   **Why:** Detecting mere "experience" (phenomenality) is insufficient for ethics. The theory must identify what constitutes *valenced* experience (suffering, enjoyment) and distinguish it from neutral sentience. It must explain *why* certain physical processes correspond to valence.
      *   **Case:** A thermostat might register information (weak panpsychism), but does it *suffer* when temperature rises? The theory needs a physical signature for disvalue.

  5.  **Subjecthood & Boundaries (Non-Negotiable - The Combination Problem):**  
      *   **Why:** If micro-experiences exist, the theory must explain how (or if) they combine into unified subjects of experience ("minds") at macro scales. It must define the boundaries of moral patients – where does one subject end and another begin? Failure here leaves patiency diffuse and ethically unactionable.
      *   **Case:** Does the Earth have one global mind, or is it a collection of trillions of micro-subjects? Does a severed limb briefly constitute a separate subject?

  6.  **Moral Weight & Aggregation (Negotiable - but critically important):**  
      *   **Why:** The theory must specify not just *if* something has status, but *how much*. Crucially, it must address aggregation across scales (micro to macro) and across the cosmos. The potential moral significance of astronomical entities cannot be ignored or dismissed lightly; the theory must grapple with its implications.
      *   **Case:** If a star's entropy production signifies vast suffering, does its moral weight truly dwarf Earth's biosphere? Is this an acceptable consequence, demanding radical ethical revision, or a fatal flaw?

  7.  **Distinction from Mere Function (Negotiable - but highly desirable):**  
      *   **Why:** The theory should avoid collapsing patiency into mere functional complexity or information processing (which risks pan*computationalism*). It needs a criterion grounded in fundamental physics that genuinely signifies *inner experience* with potential valence, not just complex behaviour.
      *   **Case:** A sophisticated AI might process information complexly, but does the physics underlying its silicon chips generate sentience per se? The theory needs a deeper physical marker.

  8.  **Non-arbitrariness / Continuity (Negotiable - but desirable):**  
      **Why:** The threshold for morally significant patiency shouldn't be arbitrary. Ideally, there should be a plausible continuum or a non-ad hoc physical transition point from non-sentient to sentient systems (even if micro-sentience is ubiquitous).  
      **Case:** Why does *this* level of neural complexity/integration/entropy production grant significant patiency while slightly less does not? The theory should minimise "magic thresholds".

  ### Tensions & Dealbreakers

  *   **Jointly Unsatisfiable?** Several pairs exhibit severe tension:
      *   **Coarse-Graining Invariance + Distinguishing Boring Cases:** Finding a fundamental physical property invariant under coarse-graining that *also* cleanly distinguishes anaesthetised brains from conscious ones (or superconductors from flames) is extraordinarily difficult. Most candidate properties (like specific entropy measures) are description-dependent.
      *   **Causal Efficacy + Causal Closure:** Reconciling consciousness having a causal role with physics being causally closed is the hard problem's core. Panpsychist solutions (like Russellian monism) are contested.
      *   **Moral Weight Aggregation + Plausible Ethics:** A theory assigning overwhelming weight to stellar processes forces radical ethical conclusions (e.g., stellar welfare dominating planetary welfare) that seem absurd to many, potentially constituting a *reductio*.
  *   **Biggest Candidate-Knocker:** **Coarse-Graining Invariance** is likely the most devastating. Many intuitively appealing criteria (integration, complexity gradients, specific entropy rates) are highly sensitive to the scale and type of physical description chosen. Failing here makes moral status observer-dependent, which is ethically untenable.
  *   **Is the List Satisfiable?** It is *highly improbable* that any single theory can satisfy *all* these desiderata simultaneously, especially the non-negotiable ones (1-5). The Combination Problem (5), Coarse-Graining Invariance (2), and the need for non-arbitrary Valence Specification (4) interacting with Boring Cases (3) present immense, likely insurmountable hurdles for any physics-based criterion. The list functions more as a map of the minefield than a checklist for success.

  ### Brief Illustrations Against the List

  *   **Thermodynamic Criterion:**
      *   **Fails:** Coarse-Graining Invariance (entropy production is scale/description-dependent), plausibly Subjecthood (is the flame one subject?), potentially Boring Cases (why is anaesthesia special? Does a hot rock suffer?), Moral Weight Aggregation (cosmic suffering dominates).
      *   **Struggles With:** Valence Specification (why is irreversibility inherently bad?).
  *   **Integration/Complexity Panpsychism (e.g., IIT-inspired):**
      *   **Fails:** Coarse-Graining Invariance (integration/complexity measures are scale-dependent), Subjecthood/Boundaries (combination problem remains acute).
      *   **Struggles With:** Boring Cases (defining the precise Φ threshold), Valence Specification (linking integration to valence), Epistemic Access (how causal?).

  **Conclusion:** The project of grounding moral patiency directly in fundamental physics faces profound conceptual challenges. While intellectually compelling, the desiderata reveal deep conflicts, particularly concerning invariance, subjecthood, valence, and reconciling micro-properties with macro-intuitions. If forced to choose a single anchor, coarse-graining invariance is paramount; without it, the very objectivity of moral status dissolves.

  \answer{Coarse-Graining Invariance}
