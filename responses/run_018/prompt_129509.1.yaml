  The central argument about intrinsic badness is logically tight: if sensory pain were inherently bad, asymbolics should avoid it despite lacking affect. Their non-avoidance does seem to undermine sensory badness claims. But I wonder... is the student oversimplifying? The objection they raise - about patients still calling it "pain" - is correctly identified but perhaps too briskly dismissed. There's a nuance here: maybe the linguistic behavior hints at residual negative valence they're not exploring.

