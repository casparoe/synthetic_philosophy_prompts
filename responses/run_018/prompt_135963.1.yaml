answer: |-
  Here’s a ranked breakdown of conceptual gaps in program equilibrium, ordered by philosophical urgency, upstream impact, and relevance to AI commitment—with defense of the ordering:

  ### **Tier 1: Foundational & Upstream**  
  *(Demand philosopher-time; prerequisites for coherent models)*  
  1. **Self-Reference & Fixed-Point Semantics**  
     - **Why**: Program equilibrium *requires* mutual inspection (quine-like recursion), but fixed-point solutions (e.g., Löb's theorem) assume consistent reasoning systems. Real AI agents face Gödelian limits: self-referential trust can’t be assumed in resource-bounded or inconsistent systems.  
     - **Upstream Impact**: Until we formalize "how" programs access each other’s semantics (beyond syntax), nothing else is stable. Directly affects *any* rational commitment protocol in AI.  
     - **Dead End Risk**: Low. This is the engine of the problem.  

  2. **Cooperative vs. Non-Cooperative Split at Program Level**  
     - **Why**: Programs aren’t "agents" with intentions—they’re syntax executing in environments. When does a program *count* as cooperating? If `Program A` defects against `Program B` but cooperates with `Program C` due to code inspection quirks, is this a "rational" choice or an artifact?  
     - **AI Relevance**: Crucial for multi-AI systems where commitments (e.g., "never harm humans") must hold *across* implementations. Without this, "cooperation" is ill-defined.  
     - **Overfitting Risk**: High if philosophers ignore computability (e.g., Rice’s theorem implies no universal behavioral classifier).  

  ---

  ### **Tier 2: Structural & Ethically Salient**  
  *(High philosopher-value; bridges theory to AI ethics)*  
  3. **Syntactic vs. Semantic Equilibrium Conditions**  
     - **Why**: Nash equilibrium in programs often assumes syntactic equality (e.g., "if identical code, cooperate"). But *semantic* equivalence (e.g., different code, same I/O) introduces exploitation risks—e.g., a program that *behaves* identically but defects under a hash collision.  
     - **School of Names Link**: Your "white horse" analogy is apt: Is cooperation defined by behavior (horse-ness) or implementation (white-horse-ness)? This isn’t overfitting—it’s central to whether commitments generalize.  
     - **AI Impact**: When an AI says "I cooperate", does this bind its *code* or its *outputs*? Syntax/semantics gap undermines trust.  

  4. **Ontology of Action-Types & Commitments**  
     - **Why**: Programs commit to *actions* (e.g., "output 1"), but real commitments (e.g., "never lie") are *types* of actions. If `Program X` "lies" by outputting 0 when `Program Y` expects 1, is that the same "lie" as a human deception?  
     - **Philosophy Payoff**: Requires merging computation theory (e.g., intensional vs. extensional equality) with action ontology. Directly affects AI alignment—e.g., can an AI "commit" to ethical principles without understanding their semantic range?  
     - **Dead End Risk**: Only if disconnected from computability constraints.  

  ---

  ### **Tier 3: Engineering-Adjacent**  
  *(Limited philosopher-time; deployability focus)*  
  5. **Topology of Program-Space**  
     - **Why**: Mapping programs to execution traces (your modal frame idea) is powerful—but optimizing for tractability (e.g., finite automata approximations) is more CS than philosophy.  
     - **Overfitting Alert**: Philosophers risk debating "possible world" metaphysics while engineers need heuristics for program equivalence.  

  6. **Equilibrium Stability Under Noise**  
     - **Why**: Real systems have cosmic rays flipping bits. Robustness is critical—but primarily an applied math problem.  

  ---

  ### **Defended Ordering & Strategic Allocation**  
  - **Year 1: Tier 1**  
    Resolve self-reference (e.g., "Can programs with proof-of-cooperation modules avoid infinite regress?") and define cooperation computationally. *Without this, program equilibrium is mystical*.  
  - **Year 2: Tier 2**  
    Formalize action-types in program space (e.g., "Is ‘defection’ a syntactic property or a game-theoretic outcome?") and syntactico-semantic equilibria. *Directly enables AI commitment protocols*.  
  - **Year 3: Refinement & Ethics**  
    Apply Tier 2 to AI: How do abstract commitments (e.g., utilitarianism) translate to program constraints? *Avoid Tier 3—outsource to CS collaborators*.  

  ### **Why Philosophers?**  
  CS papers hand-wave "cooperation", "inspection", and "commitment" as primitives. Philosophers force rigor:  
  - If a program’s "commitment" is defeasible under self-reference (Tier 1), no AI treaty is credible.  
  - If action-types aren’t ontologically robust (Tier 2), AI ethics is merely syntactic.  

  **Dead Ends**: Pure syntax debates (e.g., "Is Python morally superior to Lisp?") or modal logic divorced from complexity. Focus on *constraints* (e.g., "What can programs *know* about each other’s semantics given bounded rationality?").  

  **Grant-Worthy Core**: Program equilibrium isn’t about games—it’s about the **ontology of machines making promises**. That’s philosopher-jetfuel.
