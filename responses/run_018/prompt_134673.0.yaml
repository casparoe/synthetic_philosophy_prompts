answer: |-
  Right, your cousin's dad has a point about national responsibility, but his argument misses the mark on fairness here. Norway *deliberately* chooses to fund foreign students through taxes as part of its higher education policy; it's an open offer, not an accidental loophole being exploited. Calling it "freeloading" ignores that she's been formally accepted under those very terms. The real unfairness lies in comparing systems: demanding she takes on crippling debt in England simply because she was born there, while rejecting a legitimate, debt-free opportunity Norway intentionally provides to qualified international applicants like her. His stance essentially punishes her for Norway's generosity and locks her into England's costly system based on birthplace, which isn't about fairness – it's about prioritising a narrow view of national contribution over her actual chance to study without massive debt. If Norway is happy to invest in her potential, refusing that based on where she *might* live later seems perverse.
