answer: |-
  ### Brainstorming: Three Rival Interpretations of Implicit Ontology  
  1. **Perpetual Corporate Personhood**: The state is analogized to a legal corporation with continuous identity. Liability attaches to the abstract entity ("the Nation") rather than individuals, enabling intergenerational obligations. Funding mechanisms and legal forms of "atonement" presuppose this enduring moral agency.  
  2. **Distributed Moral Accounting**: Obligations arise from membership in a transgenerational community bound by shared norms. Guilt is not personal but *positional*—current citizens inherit duties as custodians of an ongoing project. Pedagogical framing (e.g., reflective essays) trains participants in this relational ethics.  
  3. **Deflationary Solidarity Contract**: Reparations are not about guilt but forward-looking social cohesion. "Atonement" is metaphorical; payments are intergenerational risk-pooling for societal stability. Apologies and curricula express solidarity, not metaphysical continuity.  

  ---

  ### 1. Implicit Ontology Reconstruction  
  The practice strictly presupposes a **diachronic collective agent** whose moral identity persists across generations. This requires:  
  - **Metaphysical continuity**: The nation is conceived as a single entity enduring through time, capable of bearing guilt (Jaspers' *metaphysical guilt*) and obligations beyond the lifespans of original perpetrators. Legal "atonement" payments (distinct from tort damages) frame reparations as moral debts of the nation-as-such.  
  - **Conflation of Jaspers' categories**: *Political guilt* (liability of the state apparatus) is merged with *moral guilt* (personal culpability) in pedagogical exercises. Students adopt "inheritor" postures regardless of ancestry, implying that membership alone confers participatory duties in collective repentance.  
  - **Agency without individualism**: The nation acts as a unit—officials apologize in the first-person plural ("we"), presupposing corporate agency irreducible to citizens' individual acts. This aligns with List & Pettit’s *group agency*: institutional decision-rules (e.g., parliamentary apologies) bind the collective.  

  Minimally, the practice commits to: (1) nations as moral persons with lifetimes exceeding generations, (2) non-voluntary inheritance of remedial duties, and (3) guilt as a property of the collective, not merely aggregated individuals.  

  ---

  ### 2. The Corporate Analogy and Its Limits  
  **Corporate Parallel**: The practice mirrors *commercial successor liability*: nations, like corporations, retain identity despite membership change. "Atonement" payments function as perpetual debts on the nation’s moral balance sheet, enforceable against future "shareholders" (citizens). Legal framing avoids tort law’s individuated causation, instead invoking the nation’s undying conscience.  

  **Alternative Models & Their Shortcomings**:  
  - **Risk-pooling**: Reparations could be recast as insurance against state-caused harms. Yet this fails to explain *apologies* and guilt pedagogy—risk models don’t require contrition.  
  - **Intergenerational equity**: Obligations might arise from benefiting from past injustice (e.g., inherited wealth). However, the curriculum targets *all* students, including those without material advantage, emphasizing *guilt* rather than unjust enrichment.  

  **Limit**: Corporate models assume *voluntary association* (e.g., buying shares). National membership is largely non-voluntary, straining the analogy. The practice’s moral intensity ("guilt," "atonement") exceeds commercial liability’s transactional logic.  

  ---

  ### 3. Consistency with Liberal Democracy  
  **Tension with Individualism**: Assigning guilt to descendants violates core liberal tenets: moral responsibility requires agency and participation. Forcing students to "adopt" guilt as "inheritors" risks *collectivization* of blame, undermining individual autonomy (per Rawls’ *moral personhood*).  

  **National Identity**: The practice *can* avoid ethnic essentialism if grounded in *civic* continuity: citizens inherit duties as participants in an ongoing polity that committed wrongs. However, it still presupposes a **normative continuity of identity**—the modern state is the *same entity* as the perpetrator state. This conflicts with liberal neutrality if it imposes thick communal identities.  

  **Survival Conditions**: Liberal democracy could retain such practices only by:  
  - Explicitly rejecting *personal* moral guilt (Jaspers’ distinction).  
  - Framing duties as *political* (reparations) and *pedagogical* (historical awareness), not metaphysical.  
  - Grounding obligations in democratic endorsement (e.g., parliamentary votes) rather than birth.  

  ---

  ### 4. Underdetermination and Alternative Reconstructions  
  **Philosophically Underdetermined Elements**:  
  - **Funding mechanisms**: "Atonement" payments *could* be reclassified as solidarity transfers without guilt ontology.  
  - **Apologies**: Officials’ "we" might represent the *office* (not the nation), akin to a CEO apologizing for a corporation’s past.  

  **Required Changes for a Contractual Model**:  
  - **Legal form**: Replace "atonement" with "reconciliation fund" grounded in current legislative intent, not inherited debt.  
  - **Pedagogy**: Reframe essays from "inheriting guilt" to "understanding structural injustice" or "renewing democratic commitments."  
  - **Apologies**: Limit to acknowledging *institutional* continuity (e.g., "this state perpetrated X") without implying shared culpability.  

  ---

  ### 5. Bottom Line  
  The practice **genuinely presupposes collective moral guilt** tied to a corporate-personhood ontology. Key evidence:  
  - Pedagogical assignments demand *affective identification* with guilt, not just cognitive awareness.  
  - "Atonement" legally distinguishes payments from compensatory damages, invoking moral repair.  
  - Apologies use agential language ("we failed") requiring a continuous subject.  

  While *some* elements (e.g., reparations funding) could be reconstructed deflationarily, the *ensemble* of intergenerational guilt-assignment, atonement framing, and first-person-plural apologies **cannot cohere without presupposing the nation as a diachronic moral agent**. To adopt a purely contractual model would necessitate dismantling the core grammar of guilt inheritance—a transformation requiring radical legal and curricular surgery.
