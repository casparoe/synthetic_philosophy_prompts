prompt: |-
  I've been running a small philosophy seminar with two friends who keep arguing about whether large language models literally have beliefs, and they've finally agreed to try an adversarial collaboration instead of talking past each other. One takes a Dennett-style intentional stance view but insists it only applies to systems with evolutionary design history, so calling LLM beliefs "beliefs" is just a misleading metaphor with no predictive advantage. The other argues that if a model's internal representations show counterfactual stability across prompts and support systematic generalisation, then belief-attribution is literally correct — it's not just a heuristic shortcut but tracks real contentful mental states.

  Can you draft the joint statement document they should actually sign? I want a numbered section of agreed claims first — stuff about token-prediction mechanics, the behavioural patterns that usually justify human belief-attribution, and the fact that current LLMs lack direct sensory access. Then a disagreements table with each position stated in neutral wording they'd both accept for their own side — no strawmen. Next, the cruxes: I think the deep ones are whether belief requires epistemic friction (revisability through rational consideration rather than just gradient updates) and whether counterfactual stability in attention heads is sufficient for genuine mental content. For each crux, propose a concrete model behaviour or test case both sides would agree bears on it, with each camp recording in advance what they predict, and we'll keep the predictions in seperate sections. Please write this in British English, keep the tone conceptual rather than coding-heavy, and don't include any bibliography or reading list — we want something readable without searching. (Sorry for the rushed typing — there's probably a typo or two in here that I missed.)
