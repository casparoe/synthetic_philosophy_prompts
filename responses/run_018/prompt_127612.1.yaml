answer: |-
  Your analysis identifies a profound challenge for expressivism—one that pushes the Frege-Geach solution to its limits. While this **is a genuine difficulty**, it is **likely resolvable within Gibbard's framework** without invoking a full theory of personal identity. However, it exposes unresolved tensions about the *diachronic stability of normative perspectives*. Let's break this down:

  ### 1. **Why the Problem Seems Dire**
     - **Simultaneity Requirement**: Expressivism treats logic as governing *attitudes held at the time of reasoning*. If in 2025 I express "If N was correct in 2018, then A is obligatory now," the premise-attitude (accepting N in 2018) is *not* part of my current mental state. The inferential link appears broken.
     - **Truth-Conditional Gap**: Unlike descriptivism, expressivism cannot treat "N was correct in 2018" as a *fact* about the past. It expresses a *past attitude*, but attitudes are not truth-apt. This risks collapsing into the original Frege-Geach problem.
     - **Agent Fragmentation**: If my 2018 and 2025 selves are distinct practical agents, their attitudes cannot directly interact logically. This severs the cross-temporal inference.

  ### 2. **Gibbard's Resources: Unified Planning Agency**
  Gibbard's norm-expressivism (especially in *Thinking How to Live*) has tools to address this:
     - **Planning as Diachronic**: Norm-acceptance is fundamentally *planning for contingencies across time*. When I accept a norm, I adopt plans that bind my future selves and interpret past commitments. The "agent" is a *temporally extended planner*.
     - **Hyperdecided Agents**: Gibbard's solution to Frege-Geach relies on agents considering *all possible worlds*. Crucially, these include worlds where **their past selves held specific attitudes**. For example:
       - *In 2025, I express*: "In all possible worlds where I accepted N in 2018, I now plan to do A."  
       Here, the premise ("I accepted N in 2018") is *not* a current attitude but a **specification of which hypothetical scenarios I'm currently planning for**. The conditional expresses my *present* planning stance toward worlds defined by past attitudes.
     - **First-Person Authority Over Past Attitudes**: Gibbard treats self-knowledge of past attitudes as non-inferential. My 2025 self can treat "I accepted N in 2018" as a *given* in current reasoning, much like perceptual input. This avoids needing descriptive truth-conditions for past attitudes.

  ### 3. **Why Personal Identity Isn't Required (But Persistence Is)**
     - **No Metaphysical Theory Needed**: Gibbard's framework presupposes a *practical identification* with past/future selves (planning implies "this future person is *me*"), but it doesn't require solving the metaphysical problem of personal identity. What matters is that the agent *treats* their past self as continuous for normative purposes.
     - **The Real Challenge: Attitude Persistence**: The problem reduces to whether **non-cognitive states can be stably referenced over time**. Expressivism must explain how "I accepted N in 2018" retains its practical force in 2025 without becoming a descriptive claim. Gibbard addresses this by anchoring normative language in *planning dispositions* that persist or evolve.

  ### 4. **Is This a New Frege-Geach Variant?**
     - **Yes, but with a twist**: It’s a *diachronic embedding problem*, distinct from synchronic embeddings (e.g., conditionals about current attitudes). The core issue remains the same: **how to preserve logical relations without truth-conditions**. However, it uniquely pressures expressivism to clarify:
       - How past-tense normative claims express *current* attitudes.
       - How practical identities persist over time to enable cross-temporal inference.
     - **Not a Separate Challenge**: It falls under the broader problem of **attitude coherence in complex embeddings**. If expressivism resolves Frege-Geach for synchronic cases, it must extend to diachronic ones using the same resources (planning states, hyperdecided agents).

  ### Conclusion: A Solvable Extension, Not a Fatal Flaw
  Gibbard's framework **can resolve this** by treating cross-temporal conditionals as expressions of *current planning commitments toward counterfactual scenarios defined by past attitudes*. The agent’s past and present stages are unified through **practical identification in planning**. However, this demands that expressivism:
  - Explicitly theorize **temporal indexing of norm-acceptance**.
  - Clarify how **attribution of past attitudes** functions in practical reasoning without descriptivism.

  The difficulty is **genuine but not insurmountable**—it tests expressivism's ability to handle *temporalized normative perspectives*, not its core solution to Frege-Geach. Resolving it strengthens expressivism by forcing it to account for the lived reality of moral agents as temporally extended planners. If it fails, however, it could reveal a deeper limitation in non-cognitivist treatments of time and agency.
