prompt: |-
  You advise the maintenance team for an autonomous warehouse network that must revise its operational belief database whenever a hardware component or regulatory constraint changes. The frame problem—knowing precisely which inferences to drop and which to preserve—makes every update risk either leaving hidden errors intact or cascading into irrelevant domains. Design a reusable audit procedure that the team can complete in under thirty minutes per change event. The procedure must require the auditor to sort every affected belief into three bins: direct entailments of the change, shielded defaults that survive untouched, and “ghost frames” (inherited but now-untracked assumptions that have not been explicitly invalidated and must be manually exposed). It must specify a hard stopping rule that prevents revision from reaching beliefs about human intentions, market prices, or legal liability; it must flag every step that depends on a value judgment rather than a technical check; and it must include a documentation protocol for unresolved conflicts between ghost frames. Apply the procedure to three cases: lowering the weight limit on a loading dock, where energy-cost defaults should survive but queue-order assumptions must be flagged; installing a fire-suppression system that disables certain sensors, where inventory-tracking beliefs should be shielded despite the sensor loss; and a third case in which the procedure yields a result the team is likely to resist. Conclude by stating exactly what the procedure cannot settle—especially when ghost frames contradict one another—and how the residual uncertainty should be recorded for the next audit cycle.
reasoning: |-
  We are designing an audit procedure for updating the belief database in an autonomous warehouse network when changes occur (e.g., hardware component changes, regulatory constraint changes). The goal is to complete the audit in under thirty minutes per change event.

  The procedure requires the auditor to sort every affected belief into three bins:
  1. **Direct entailments of the change**: Beliefs that are directly affected by the change and must be updated or invalidated.
  2. **Shielded defaults that survive untouched**: Beliefs that are not affected by the change and can remain as they are.
  3. **Ghost frames**: Inherited but now-untracked assumptions that have not been explicitly invalidated and must be manually exposed.

  The procedure must:
  - Specify a hard stopping rule that prevents the revision from reaching beliefs about human intentions, market prices, or legal liability.
  - Flag every step that depends on a value judgment rather than a technical check.
  - Include a documentation protocol for unresolved conflicts between ghost frames.

  ### Audit Procedure Steps

  1. **Identify Change Event (2 minutes)**:
     - Clearly state the change (e.g., "Lowered weight limit on loading dock X", "Installed fire-suppression system in zone Y").
     - Flag: None (purely technical).

  2. **Extract Directly Affected Beliefs (5 minutes)**:
     - Using the dependency graph of the belief database, extract all beliefs that are directly linked to the changed component or constraint.
     - These are the direct entailments (Bin 1).
     - Flag: None (technical, based on graph).

  3. **Identify Shielded Defaults (5 minutes)**:
     - From the remaining beliefs, identify those that are shielded by design (e.g., they are in a module that is decoupled from the change, or they are protected by a default rule that remains valid).
     - These go to Bin 2.
     - Flag: If there is uncertainty about whether a default is shielded, it requires a value judgment (e.g., "Is this default still applicable in the new context?"). Flag such cases.

  4. **Detect Ghost Frames (10 minutes)**:
     - Look for beliefs that were inherited from higher-level assumptions but are not directly tracked in the current context. These are beliefs that might be invalidated by the change but have not been explicitly addressed.
     - They go to Bin 3 (ghost frames).
     - Flag: The identification of ghost frames may involve value judgments about what constitutes an "inherited but untracked" assumption. Flag these steps.

  5. **Apply Hard Stopping Rule (3 minutes)**:
     - If during the above steps the audit reaches beliefs about human intentions, market prices, or legal liability, stop immediately and do not modify these beliefs. Note the point of stoppage and the reason (e.g., "Stopped at belief about legal liability for overweight loads").
     - Flag: The decision to stop is a technical rule, but the identification of these topics may involve a value judgment (e.g., is a belief about "expected delivery time" related to market prices?).

  6. **Document Unresolved Conflicts (5 minutes)**:
     - If there are ghost frames (Bin 3) that contradict each other or with other beliefs, document:
          - The conflicting ghost frames.
          - The nature of the conflict.
          - Why it was not resolved (e.g., lack of time, requires higher-level input).
     - This documentation is appended to the audit log and must be addressed in the next audit cycle.

  ### Total Time: 30 minutes (maximum)

  ### Applying the Procedure to Three Cases

  #### Case 1: Lowering the weight limit on a loading dock
  - **Change Event**: Lowering the weight limit on loading dock X.
  - **Direct entailments (Bin 1)**:
     - Beliefs about the maximum weight that dock X can handle.
     - Beliefs about the types of goods that can be loaded at dock X (if weight affects type).
     - Beliefs about the required number of robots to move a load at dock X (if the weight limit changes the required configuration).
  - **Shielded defaults (Bin 2)**:
     - Energy-cost defaults (e.g., the cost per kWh for operating the dock) are shielded because they are independent of the weight limit change.
  - **Ghost frames (Bin 3)**:
     - Queue-order assumptions (e.g., the system may have inherited an assumption that heavy items are loaded first, which might now be invalid). These must be flagged for manual review because they are inherited from operational policies that are not directly tied to the weight limit but might be affected.
  - **Hard stopping rule**: If the audit starts to touch on beliefs about the market price of energy or legal liability for overloading, it stops.
  - **Flagged steps**: When deciding that energy-cost defaults are shielded, if there is a concern that the change in weight limit might lead to more trips (thus affecting energy costs), that would be a value judgment and must be flagged. In this case, we assume the energy-cost model is independent of the weight limit per se (only the number of trips might change, but that is a separate operational adjustment). However, the queue-order assumption is a ghost frame and requires manual exposure.

  #### Case 2: Installing a fire-suppression system that disables certain sensors
  - **Change Event**: Installation of a fire-suppression system in zone Y, which disables sensors S1, S2.
  - **Direct entailments (Bin 1)**:
     - Beliefs about the availability of sensors S1 and S2.
     - Beliefs about the fire detection and suppression capabilities in zone Y.
     - Beliefs that explicitly depend on data from S1 and S2.
  - **Shielded defaults (Bin 2)**:
     - Inventory-tracking beliefs that do not rely on the disabled sensors (e.g., if there are alternative sensors or the system uses other methods) should be shielded. Also, defaults about the general inventory tracking algorithm that are not sensor-specific.
  - **Ghost frames (Bin 3)**:
     - Assumptions about the completeness of sensor coverage in zone Y (e.g., the system might have inherited a belief that all zones have full sensor coverage, which is now violated). Also, assumptions about the reliability of inventory counts in the absence of these sensors (if not explicitly modeled) must be flagged.
  - **Hard stopping rule**: If the audit starts to touch on beliefs about the market price of the sensors or legal liability in case of fire, stop.
  - **Flagged steps**: Deciding that inventory-tracking beliefs are shielded might involve a value judgment if the disabled sensors were critical for a subset of items. This must be flagged if there is uncertainty.

  #### Case 3: A change that the team is likely to resist
  Let's consider a change: **Removing a safety constraint that requires human confirmation for high-value item retrieval** (e.g., because the system now has a new, highly reliable autonomous verification method).

  - **Change Event**: Removal of the human confirmation step for high-value item retrieval.
  - **Direct entailments (Bin 1)**:
     - Beliefs about the steps in the retrieval process for high-value items.
     - Beliefs about the required time for retrieval (which may decrease).
     - Beliefs about the system's capability to handle high-value items without human intervention.
  - **Shielded defaults (Bin 2)**:
     - Defaults about the general process for low-value items remain shielded.
     - Beliefs about the layout of the warehouse and the locations of items (unless they are tied to the human confirmation step) are shielded.
  - **Ghost frames (Bin 3)**:
     - Inherited assumptions about the necessity of human oversight for any item above a certain value (which may be embedded in various safety protocols). Also, assumptions about the reliability of the autonomous system (which might not have been explicitly modeled in the belief database) become ghost frames.
     - The team might resist because they are uncomfortable with removing human oversight, and the ghost frames might reveal that the system was built with an inherent assumption that humans are necessary for high-value items.
  - **Hard stopping rule**: Stop if the audit reaches beliefs about human intentions (e.g., why the human confirmation was initially required) or legal liability for removing the step.
  - **Flagged steps**: Deciding which beliefs are shielded might involve value judgments about safety. For example, the belief that "high-value items are more prone to theft" might be a shielded default? But if the new autonomous system addresses theft differently, that's a ghost frame. These are value-laden and must be flagged.

  ### What the Procedure Cannot Settle
  The procedure cannot settle conflicts between ghost frames, especially when they contradict one another. For example:
  - In Case 3, one ghost frame might be "human confirmation is the only reliable method for high-value items" and another might be "autonomous systems can be more reliable than humans". The procedure flags the conflict but does not resolve it.

  ### Handling Residual Uncertainty
  The residual uncertainty (unresolved conflicts between ghost frames) should be recorded in the audit log with:
  - The conflicting ghost frames.
  - The context of the conflict.
  - The date and change event that triggered the audit.
  - A note that the conflict remains unresolved and must be addressed in the next audit cycle (or escalated to a higher authority if necessary).

  This ensures that the next audit cycle starts with these known issues and can allocate time to resolve them, possibly with more information or policy changes.

  ### Conclusion
  This audit procedure provides a structured way to handle belief updates in under thirty minutes. It explicitly categorizes beliefs, flags value judgments, and documents unresolved conflicts. However, it does not resolve deep contradictions in ghost frames, leaving that for future audits or human deliberation. The hard stopping rule prevents the audit from overreaching into non-technical domains. The team must be trained to follow the procedure strictly and to document thoroughly.
answer: |-
  Below is a reusable 30-minute audit procedure designed for the maintenance team, structured to handle belief updates while mitigating the frame problem. The procedure uses three bins (**Direct Entailments**, **Shielded Defaults**, and **Ghost Frames**) and enforces strict boundaries to avoid overreach. Value judgments are flagged, unresolved conflicts are documented, and a hard stopping rule is applied to exclude non-technical domains (human intentions, market prices, legal liability).

  ---

  ### **Audit Procedure**  
  **Goal**: Sort every affected belief into three bins in ≤30 minutes.  
  **Tools**: Dependency graph of the belief database, change-event details, timer.  

  #### **Step 1: Pre-Audit Setup (5 minutes)**  
  - **Input**: Change event (e.g., "Lower weight limit on Dock 5," "Install fire-suppression system in Zone B").  
  - **Actions**:  
    1. Map the change to directly linked beliefs using the dependency graph (e.g., beliefs about Dock 5’s capacity).  
    2. **Flag**: If the change involves non-technical domains (e.g., "compliance costs" or "operator intent"), stop and redefine the change to exclude these.  
    3. Set a timer for 25 minutes (hard stop for Steps 2–4).  

  #### **Step 2: Sort Beliefs into Bins (20 minutes)**  
  - ***Bin 1: Direct Entailments***  
    - **Definition**: Beliefs logically invalidated by the change (e.g., "Dock 5 supports 1000kg" → invalid if limit drops to 800kg).  
    - **Action**: Extract all beliefs directly dependent on the changed component/constraint.  
    - **Time**: 7 minutes.  
    - **Flag**: If entailment depends on contextual interpretation (e.g., "Does lower weight limit imply slower throughput?"), mark as *value judgment*.  

  - ***Bin 2: Shielded Defaults***  
    - **Definition**: Beliefs unaffected due to isolation from the change (e.g., energy-cost models if hardware is energy-agnostic).  
    - **Action**: Test beliefs against:  
      - *Decoupling check*: Does the belief rely on unchanged inputs?  
      - *Invariance check*: Is the belief explicitly independent of the changed domain?  
    - **Time**: 7 minutes.  
    - **Flag**: If shielding relies on assumptions (e.g., "Inventory tracking is independent of sensors"), mark as *value judgment*.  

  - ***Bin 3: Ghost Frames***  
    - **Definition**: Inherited assumptions not directly invalidated but potentially compromised (e.g., "Queues prioritize heavy items" after weight limit changes).  
    - **Action**:  
      1. Trace dependencies upstream to find unvalidated inherited beliefs.  
      2. Apply *stopping rule*: Halt if beliefs touch human intentions, prices, or liability.  
    - **Time**: 6 minutes.  
    - **Flag**: Ghost frame identification is inherently judgment-based—mark all entries.  

  #### **Step 3: Conflict Documentation (5 minutes)**  
  - **Input**: Ghost frames with contradictions (e.g., "System assumes sensors are redundant" vs. "Inventory requires all sensors").  
  - **Actions**:  
    1. Log conflicts in the "Ghost Frame Registry" with:  
       - Contradictory beliefs.  
       - Change event ID.  
       - Auditor’s notes on potential impact.  
    2. **Do not resolve**: Mark as "unreviewed" for the next audit cycle.  

  #### **Hard Stopping Rules**  
  - **Rule 1**: Terminate sorting if beliefs involve:  
    - Human intentions (e.g., "Operators prefer X").  
    - Market prices (e.g., "Energy cost affects scheduling").  
    - Legal liability (e.g., "Vendor liable for sensor failures").  
  - **Rule 2**: Stop Bin 3 tracing after 2 layers of dependency to prevent overreach.  

  ---

  ### **Application to Cases**  
  #### **Case 1: Lowering Weight Limit on Loading Dock**  
  - **Change**: Dock 5 weight limit reduced from 1000kg to 800kg.  
  - **Direct Entailments (Bin 1)**:  
    - "Dock 5 max weight = 1000kg" → update to 800kg.  
    - "Robots assigned to Dock 5 carry 1000kg" → recalculate capacity.  
  - **Shielded Defaults (Bin 2)**:  
    - "Energy cost per kg = $0.05" (unchanged; energy model is hardware-agnostic).  
  - **Ghost Frames (Bin 3)**:  
    - "Heavier items are prioritized in queues" (untracked assumption; flag for manual review).  
  - **Value Judgment Flag**: Shielding energy defaults assumes energy costs are weight-agnostic—may not hold if trips increase.  

  #### **Case 2: Installing Fire-Suppression System Disabling Sensors**  
  - **Change**: Fire system in Zone B disables thermal sensors S1–S3.  
  - **Direct Entailments (Bin 1)**:  
    - "S1–S3 monitor Zone B" → mark as disabled.  
    - "Fire risk in Zone B requires thermal sensors" → update suppression protocol.  
  - **Shielded Defaults (Bin 2)**:  
    - "Inventory tracked via RFID" (shielded; relies on unchanged RFID sensors).  
  - **Ghost Frames (Bin 3)**:  
    - "All zones have equal sensor coverage" (inherited assumption; flag as compromised).  
  - **Stopping Rule**: Halt if inventory beliefs link to liability (e.g., "Missing sensors increase theft risk").  

  #### **Case 3: Removing Redundant Power Backup (Team Resistance Case)**  
  - **Change**: Decommission backup generator G2 (deemed redundant).  
  - **Direct Entailments (Bin 1)**:  
    - "G2 provides 20kW backup" → remove.  
    - "Critical systems use G2 during outages" → recalculate power needs.  
  - **Shielded Defaults (Bin 2)**:  
    - "Non-critical systems run on main grid" (unchanged).  
  - **Ghost Frames (Bin 3)**:  
    - "All warehouses must have N+1 power redundancy" (inherited policy assumption; flag even if technically redundant).  
  - **Resistance Trigger**: Team relies on N+1 redundancy for compliance. Ghost frame contradicts change, forcing manual review and potential policy escalation.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Ghost Frame Contradictions**:  
     - If ghost frames conflict (e.g., "Sensor redundancy is critical" vs. "Inventory accuracy overrides sensor loss"), the procedure documents but does not resolve them. Residual uncertainty is recorded in the Ghost Frame Registry for the next audit.  
  2. **Value Judgments**:  
     - Flagged judgments (e.g., "Is energy cost truly shielded?") require domain expert input post-audit.  
  3. **Stopped Beliefs**:  
     - Beliefs halted by the stopping rule (e.g., legal implications) are excluded entirely and must be handled externally.  

  ### **Residual Uncertainty Protocol**  
  - **Document**: In the Ghost Frame Registry, log:  
    ```  
    Conflict ID: [Event]-[Timestamp]  
    Contradictory Ghost Frames: [Belief A] vs. [Belief B]  
    Audit Cycle: [Date]  
    Status: Unresolved; escalate to policy team.  
    ```  
  - **Escalate**: Unresolved conflicts are reviewed in the next audit cycle or routed to compliance/policy teams.  

  This procedure ensures efficient, bounded belief updates while isolating irreconcilable conflicts. It shifts unresolvable ambiguity into documented technical debt, preventing cascading errors without overextending the audit.
