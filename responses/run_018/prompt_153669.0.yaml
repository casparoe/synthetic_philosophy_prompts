answer: |-
  The seawall ledger arrived with the scent of salt and panic still clinging to its vellum cover. Silas, Senior Archivist of Argosy’s Uncertainty Register, ran a finger along its spine, feeling the uneven bumps where frantic annotations had been pressed deep into the paper from the other side. Volume LXII: The Breaker’s Maw Seawall Reinforcement Proposal. Its sheer girth spoke of *weight* – crates of depositions from tidal analysts, storm-chroniclers salvaged from drowned libraries, engineers’ sketches etched with desperate fervor. The "Relevant Evidence" section bulged.

  Yet, as Silas opened it, the weight felt less like substance and more like turbulence. Page after page screamed contradiction. Master Tidalist Elara swore the unprecedented wave patterns were harbingers of a "century surge," her calculations (based on sediment layers from cliffs that shouldn’t exist) demanding a ten-foot raise. Opposite her testimony, tucked in with a rusty paperclip, Geomancer Varn dismissed Elara’s sediments as "landslip debris," pointing to stable deep-sea pressure logs (salvaged from a malfunctioning Deep-Spire sensor) predicting only "moderate agitation." Both sections were thick with appendices, cross-referenced obsessively, dripping with the ink of conviction. The marginalia was a battlefield: "Faulty core sample!" scrawled beside Varn’s logs; "Ignoring thermal bloom!" rebutted under Elara’s surge theory. The "Total Ignorance" column, usually a manageable list of known unknowns, sprawled like dark water: *Unknown deep current shifts post-Upheaval? Unknown resonance frequency of new reef formations? Unknown effect of Sky-Smelter emissions on local storm cells?* The calculated Weight of Argument was high – vast evidence wrestled with vast ignorance. But the evidence warred with itself. No number could average this chaos.

  Contrastingly, Proposal Gamma rested beside it: a slim volume titled *Strategic Retreat: Harbor District Phased Relocation*. Its "Relevant Evidence" was wan. A few merchant guild petitions citing "persistent dampness," blurred photographs of cracked foundations near the wharves, a single demographer’s note about "potential long-term depreciation." The "Total Ignorance" column was starkly brief but profound: *Ignorance of true storm surge maximum? Ignorance of citizen compliance? Ignorance of viable relocation site carrying capacity?* The Weight was low – scant evidence against significant, acknowledged unknowns.

  But the signatures. Silas traced them. Every Harbor Guild Master, every Low Quarter Representative, even the Sky-Smelter Foreman whose soot would stain the new site – all had signed the final assessment page. "Unanimous agreement on prudent withdrawal," the summary stated, devoid of the fervor that filled the seawall ledger, yet radiating a terrible, cohesive certainty born of shared fear and the simplicity of *leaving*. No storm models contradicted them because they offered no models at all, just the heavy, unquantifiable dread of the sea and the tangible, immediate pain of displacement.

  Council day arrived, the Archive chamber thick with the dust of uncertainty and the ozone tang of impending decision. Silas presented the registers, her voice flat, procedural. She laid open the seawall volume at Elara’s most vehement surge prediction, then at Varn’s calm rebuttal. She didn’t interpret, only highlighted the density of evidence, the ferocity of contradiction, the yawning chasm of the ignorance column. "High Weight," she stated, "but contested."

  Then, Proposal Gamma. She opened it to the signature page, the uniform lines of ink, the bland declaration of consensus. "Low Weight," she said, "but unanimous."

  The Councilors leaned over the ledgers. Fingers brushed the violent marginalia of the seawall proposal, flinching at its intellectual cacophony. They lingered on the clean, agreed-upon page of retreat. The silence wasn’t thoughtful; it was the silence of relief. High Weight meant grappling with the storm’s terrifying, unknowable face. Low Weight with unanimity offered a path, however grim, defined by human agreement, not oceanic fury. It offered the illusion of control through collective action, however ignorant.

  "The weight of argument for reinforcement is… fraught," murmured Councilor Borin, tapping Elara’s frantic diagrams. "Such division speaks to the radical uncertainty. We cannot act on contested shadows."

  "Retreat, while carrying the burden of ignorance, presents a unified front," Councilor Veya added, her gaze fixed on the neat signatures. "The weight of our *shared understanding* of the danger, however incomplete, compels action we can enact. We know how to move people. We do not know how to defy that sea."

  The vote was swift. Reinforcement, drowning in its own high weight of contradictory evidence and vast ignorance, was shelved. Proposal Gamma, buoyed by the low-weight raft of unanimous dread, was adopted. Orders were signed for the phased abandonment of the Harbor District.

  Silas filed the registers. The seawall volume, a monument to contested knowledge, went back to its shelf, heavy and unresolved. The retreat ledger, thin and final, was placed in the "Executed Uncertainties" section. She knew the math that didn't exist: the probability distribution for the storm’s fury was an unreadable smear. But the consequence wasn't probabilistic; it was tidal and absolute.

  Three months later, the Breaker’s Maw surge arrived. It wasn’t Elara’s century wave nor Varn’s moderate agitation. It was something else entirely, a freak confluence the ignorance column hadn’t even known to name. It overtopped the unreinforced seawall not by feet, but by fathoms. The Harbor District, only partially evacuated, was scoured away. The Low Quarter, deemed "marginally safer," drowned in the backwash.

  In the ensuing silence, broken only by the drip of seawater from the Archive’s high ceiling, a courier delivered a water-stained packet to Silas. Inside, salvaged by a dredge barge, was a single, small child’s leather shoe, salt-crusted and misshapen. Attached was a scrap of pulp paper: *Found lodged in Registry Pipe 7, Low Quarter. Listed in Evacuation Manifest as 'Compliant'. Uncertainty Register: Outcome.* 

  Silas placed the shoe on her desk. She didn’t open the retreat ledger. Its low weight and unanimous agreement were intact, pristine in their recorded ignorance. The irreversible consequence lay before her, small, sodden, and utterly beyond the comforting fiction of consensus. The weight of argument hadn’t been wrong; it had been tragically, irrevocably inadequate to the void it tried to measure. The ledgers held the shape of the unknown, but not its drowning weight.
