answer: |-
  Your request is sharp and self-aware—I'll honor it by translating rigorously, flagging distortions, and delivering an unvarnished residue report. No smuggling, no false equivalences.

  ### Translation: Three Positions in Literary Terms  
  *(Using *only* your vocabulary: genre conventions, archetypes, plot/story, focalization, etc.)*

  1. **Essentialism → "Genre as Deep Structure"**  
     - **Claim:** A work belongs to a genre *only* if it possesses a specific, non-negotiable **underlying narrative structure**.  
     - **Detective Novel:** Must have a "plot engine" driven by *withheld revelation* (clues → solution) that *determines* the story's progression. Absence of this = not detective fiction, regardless of surface tropes (e.g., a "whodunit" where the murder is solved in chapter 2 and the rest is about grief fails the genre).  
     - **Reluctant Hero:** Exists *only* if the character's psychology follows a fixed arc: *refusal of call → external pressure → acceptance*. Violating this arc (e.g., a hero who embraces duty instantly) means it's not "reluctant," even if labeled as such.  
     - **Key Marker:** Violations aren't "innovative"—they *exit the category*.

  2. **Cluster Theory → "Genre as Convention Bundle"**  
     - **Claim:** A genre/archetype is defined by a cluster of **co-occurring conventions or traits**, no single one essential. Resemblance matters, not essence.  
     - **Detective Novel:** Typical conventions: a mystery, an investigator, clues, red herrings, a solution. A book missing one (e.g., no investigator) may still qualify if enough others are present (e.g., a "puzzle box" story solved by the reader).  
     - **Reluctant Hero:** Defined by traits: initial resistance, self-doubt, external catalyst, eventual commitment. A character missing one trait (e.g., no self-doubt) can still fit if others are strong (e.g., intense resistance + catalyst).  
     - **Key Marker:** Works inhabit "borderlands" (e.g., *Gone Girl* as thriller/mystery hybrid). Violations are *gradient* (less/more typical).

  3. **Nominalism → "Genre as Contextual Label"**  
     - **Claim:** Categories are **shelving decisions** or **critical tools** with no reality beyond use. Conventions are post-hoc patterns, not defining features.  
     - **Detective Novel:** A book is "detective fiction" only because publishers/marketers/critics call it one. *The Name of the Rose* could be shelved as theology or mystery; the label doesn't reflect an inherent property.  
     - **Reluctant Hero:** A critic's shorthand for characters who *seem* hesitant in certain narratives. No psychological reality—just a tag for reader/critic convenience (e.g., calling Hamlet "reluctant" vs. "indecisive" is arbitrary).  
     - **Key Marker:** Debates over categorization (e.g., "Is *1984* sci-fi?") are *only* about utility, not truth.

  ---

  ### Residue Report: What Survives, What Warps, What Vanishes  
  **Part 1: What Translated Cleanly**  
  - **Cluster Theory ↔ Convention Bundle:** Seamless fit. Both deal with overlapping traits, fuzzy borders, and gradient membership (e.g., "thriller with detective elements").  
  - **Nominalism ↔ Shelving Decision:** Direct analog. Both reduce categories to human utility, denying intrinsic reality (e.g., genre as marketing tool vs. chemical element as lab convenience).  
  - **Archetypes as Constructs:** The debate over whether archetypes reflect "real" psychology or are critical inventions maps perfectly onto essentialism vs. nominalism.

  **Part 2: What Translated with Distortion**  
  - **Essentialism's "Underlying Nature"**:  
    - *Distortion:* In science, essences are *causal* (e.g., atomic number explains reactivity). In literature, "deep structure" (e.g., plot engine) is *descriptive*, not causal. A detective plot *requires* revelation; gold's properties *result from* atomic number. Your framework can't capture this causal power.  
  - **Induction (Tested Samples → Untested):**  
    - *Distortion:* A chemist infers *laws* (untested gold will conduct electricity). You infer *conventions* (untested thrillers "need" ticking clocks). But conventions are violable norms; laws are not. Your induction is about *expectations*, not discovery of mind-independent regularities. The move is analogous in form, but ontologically weaker.  
  - **Normativity of Violations:**  
    - *Distortion:* Productive genre violations (e.g., a detective novel without a solution) are celebrated as innovation. In science, violating a natural kind (e.g., "this gold isn't conductive") means you misclassified it. Your framework *reverses* the stakes: violation in art often strengthens the work; in science, it falsifies the category. The asymmetry is fundamental.

  **Part 3: What Vanished (No Expression Possible)**  
  - **Mind-Independence:**  
    - *The Void:* Your framework can't state this. Genres *are* communicative contracts between creators/audiences; they vanish without humans. But scientific realists claim potassium *would* behave as K even with no observers. Your vocabulary lacks the "world without us" dimension—collapsing the debate's core.  
  - **Natural Kinds vs. Social Kinds:**  
    - *The Void:* "Sedimentary rock" (natural) vs. "thriller" (social) differ in origin. Philosophy debates whether *some* kinds (e.g., species) are natural. Your tools treat all categories equally as "conventions," erasing this distinction.  
  - **Explanatory Depth:**  
    - *The Void:* Science's "underlying nature" *explains* surface properties (e.g., DNA explains morphology). In literature, "plot structure" *organizes* but doesn't *cause* surface features (e.g., focalization doesn't *make* clues appear). Essentialism in science is metaphysical; in your terms, it's narrative grammar.

  ---

  ### Verdict: Broken Frame or Hollow Debate?  
  **Your framing isn't broken—it reveals the debate's limits for your domain.** The residue shows:  
  1. **Philosophy's concerns don't all map onto art** because genres *are* mind-dependent, normative, and violable. The "real joints" question loses traction when categories are tools for communication.  
  2. **The debate *is* substantive for science** (where mind-independence matters) but **less so for literary kinds**. Nominalism/cluster views dominate art for good reason: conventions *are* clusters, labels *are* contextual. Essentialism feels alien because deep structure isn't causal.  
  3. **Your suspicion was correct:** The normativity asymmetry ("productive violations") exposes the translation's fatal flaw. Art thrives on bending categories; science dies by it.  

  **Conclusion:** The philosophical debate is robust for natural kinds, but your literary framework *exposes its irrelevance* for constructed kinds. What you gained isn't a perfect map, but a diagnostic: genres are closer to "cluster-nominalist hybrids," and the residue (mind-independence, causality) is the price of avoiding scientism. Use the distortion points as friction—where philosophy jars against your practice, lean in. That’s where your vocabulary asserts its autonomy.
