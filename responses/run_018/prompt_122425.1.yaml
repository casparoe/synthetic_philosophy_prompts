  I should also connect this to his utilitarian ethics. For Sidgwick, seeking truth impartially is a moral duty. Compromising on evidence standards, especially in psychical studies, betrays that duty. The researchers' actions, even if not malicious, show a lapse in the virtue required for such inquiries. 

