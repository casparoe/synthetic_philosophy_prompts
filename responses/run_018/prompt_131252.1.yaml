prompt: |-
  hey — i'm a third-year student on our philospohy of science module and i'm prepping questions for a blog interveiw with a visiting researcher (she'd rather stay unnamed). she's defending a variant of Popperian demarcation that she calls 'predictive fragility': instead of saying a theory is scientific only if it's logically falsifiable, she argues we should check whether its quantitative predictions generate error distributions that can be systematically undermined by new data. she applies this mostly to statistical fields like climate science. i need eight to ten interview questions that go beyond restating the view, and please write them in british english.

  specifically i want:
  - at least one question on how predictive fragility deals with the Duhem-Quine problem — she usually replies that auxilliary hypotheses are part of the predictive architecture, not external shields,
  - one on whether climate or epidemiological models actually satisfy her fragility condition given all their probabilistic outputs,
  - and one on the demarcation boundary with pseudoscience, particularly whether astrology could be reconstructed to pass her test.

  for each of those three, include a sharp follow-up keyed to the answer she's most likely to give. also, please don't ask for citations or reading lists — i'm not expecting her to name-drop papers, just to defend the idea. keep it casual, like i'm talking to a classmate.
