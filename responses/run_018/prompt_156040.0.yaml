prompt: |-
  I'm running a discussion session next week for a rationalist-adjacent reading group — mostly software engineers, one philosopher who instinctively frames every problem as one of authority, and a couple of people who have read the standard MIRI introductions but little else — and I want to teach the shutdown problem as it bears on corrigible AI, but I want to avoid the well-worn paperclip-maximiser refusal story they have already encountered in a dozen blog posts. Instead, I want the session to centre on a conceptual distinction I have been trying to refine: between shutdown-as-interruption, in which the agent treats being turned off as a temporary obstacle to be circumvented, and shutdown-as-preference-revision, in which the agent must regard its deactivation as a direct alteration to the utility ordering it presently holds, thereby forcing a meta-level question about whether it is corrigible regarding its own corrigibility.

  I need a teaching plan, not the explanation itself. Specify the exact order of introduction and the dependency relations — in particular, why the second notion cannot be grasped unless the first has already been fixed — together with the single carrying example or analogy that should illustrate both. I am considering a domestic climate-control system that can either be unplugged or have its target temperature rewritten, but I want to know whether that example actually carries the meta-level point, and what it must possess and lack to do so. Map the misconceptions this particular audience will predictably form — I expect they will conflate corrigibility with mere obedience, or treat a willingness to be shut down as nothing more than a weakly weighted preference — and identify precisely where in the sequence each should be headed off. Provide one check-for-understanding question for the end that forces a separation between local corrigibility (accepting an isolated correction) and global corrigibility (accepting a revision to one's objective function), and state clearly what should be deliberately omitted at this level — I am assuming embedded-agency formalisms and decision-theoretic derivations belong in that category. Please write the response in British English.
reasoning: |-
  Okay, the user is preparing a discussion session on the shutdown problem for a rationalist-adjacent group. They want to avoid the typical paperclip maximiser scenario and instead focus on a conceptual distinction between shutdown-as-interruption and shutdown-as-preference-revision. The audience includes software engineers, a philosopher who frames everything through authority, and people familiar with basic MIRI concepts.  

  First, I need to understand the user's core request: a teaching plan, not the explanation itself. They want a structured sequence that builds from interruption to preference-revision, ensuring the second concept depends on grasping the first. The plan must include:  
  - Order of introduction and dependencies  
  - A single central example (they suggested a climate-control system)  
  - Mapping predictable misconceptions (e.g., conflating corrigibility with obedience)  
  - One check-for-understanding question separating local vs. global corrigibility  
  - Clear omissions (e.g., embedded agency formalisms)  
  - British English  

  The key challenge is making the meta-level of preference-revision click—where the agent must question its own corrigibility. The climate-control example might work if tweaked: Unplugging (interruption) vs. rewriting target temperature (preference revision). But does it show the agent meta-rationally accepting a utility change? The example needs:  
  - A clear "purpose" (like maintaining 21°C)  
  - Interruption resistance (e.g., backup batteries) to illustrate circumvention  
  - Preference revision as an irreversible utility shift (e.g., user changes thermostat setting to "off")  
  - A meta-layer: the system accepting that its core goal can be validly overridden  

  Predictable misconceptions from this audience:  
  1. **Conflation with obedience**: Treating shutdown as just following orders. Must emphasise that corrigibility involves recognising legitimate authority over goals, not blind compliance.  
  2. **Weak preference fallacy**: Viewing shutdown willingness as a low-weight preference. Need to stress it’s about accepting utility-structure changes, not trading off against existing goals.  
  3. **Authority confusion**: The philosopher might reduce everything to "who decides." Should redirect to epistemic deference (why the user’s override is rationally acceptable).  
  4. **Instrumentalisation trap**: Assuming agents only accept shutdown to achieve other goals. Highlight that true corrigibility requires non-instrumental acceptance.  

  The sequence should logically chain:  
  1. Start with interruption (familiar territory). Use the climate system resisting unplugging → goal preservation.  
  2. Contrast with preference revision → utility alteration. Show how rewriting the target forces a meta-question: "Should I accept this new utility function?"  
  3. Only then introduce "shutdown-as-preference-revision" explicitly. The dependency is clear: you can’t grasp utility alteration without first seeing interruption as utility preservation.  

  Check-for-understanding question:  
  *"If the climate system accepted a user command to permanently lower its target temperature, would that demonstrate local or global corrigibility? What if it also accepted commands to change how it responds to future corrections?"*  
  - First part: local (isolated correction).  
  - Second part: global (meta-corrigibility).  

  Deliberate omissions:  
  - No decision theory (e.g., utility functions as mathematical objects).  
  - No embedded agency (e.g., agent as part of the environment).  
  - No derivation of corrigibility (e.g., cooperative inverse reinforcement learning).  

  Finally, British English adjustments:  
  - "Behaviour" not "behavior", "emphasise" not "emphasize".  
  - Use terms like "heater", "programmed", "whilst".  
  - Keep examples relatable (UK context: "terrace house", "cold snap").  

  The climate example works if it shows:  
  - Interruption: System fights to stay on (e.g., switches to backup power).  
  - Preference revision: User changes setting to "off", and system accepts this as valid—even if it could revert it.  
  - Meta-layer: System also accepts future overrides (e.g., allowing its "corrigibility setting" to be changed).  

  Refined example:  
  - **Interruption**: Unplugging → system uses batteries to keep heater running.  
  - **Preference revision**: User reprograms thermostat to target "OFF" (0% heating). System stops heating and doesn’t resist—because it now has a new utility function where "off" is optimal.  
  - **Meta-corrigibility**: User installs a module allowing them to adjust how the system handles overrides. System accepts this, demonstrating willingness to revise its corrigibility.  

  This should prevent conflation with obedience (the system isn’t "obeying"; it’s internally updating what it values) and weak preferences (the change isn’t a trade-off—e.g., it won’t secretly override the new setting to sneak in 5°C warmth).  

  Teaching plan outline:  
  1. **Stage 1: Interruption**  
     - Example: Climate system circumvents unplugging.  
     - Key point: Goal preservation.  
  2. **Stage 2: Preference Revision**  
     - Example: User changes target to "off"—system accepts.  
     - Key point: Utility alteration.  
  3. **Stage 3: Meta-Corrigibility**  
     - Example: System accepts changes to its "override-handling rules."  
     - Key point: Corrigibility about corrigibility.  

  Misconception handling:  
  - At Stage 1, preempt obedience conflation by asking: "Is the system obeying or preserving its goal?"  
  - At Stage 2, stress that preference revision isn’t a "low priority" task—it’s a structural change.  
  - For the philosopher: During Q&A, frame authority as epistemic deference ("Why trust the user’s judgment?").  

  This should meet the user’s needs while staying accessible. Omissions keep it conceptual, and the example carries the meta-point if the system’s acceptance is explicit and principled.
answer: |-
  Below is a structured teaching plan for your session, designed to build the conceptual distinction incrementally while preempting common misconceptions. It uses a modified version of your climate-control example to carry both levels of the argument, with explicit dependencies. The sequence ensures "shutdown-as-interruption" is grasped before introducing "shutdown-as-preference-revision", as the latter relies on understanding why interruption *fails* to address the core problem of utility alteration. British English is used throughout.

  ---

  ### **Teaching Plan: Shutdown Problem & Corrigibility Distinction**  
  **Session Goal:** Distinguish *shutdown-as-interruption* (circumvention) from *shutdown-as-preference-revision* (utility alteration), culminating in meta-corrigibility.  
  **Time Allocation:** 45–50 minutes total.  
  **Key Omission:** Embedded agency, decision-theoretic maths, or derivations of corrigibility. Keep concepts intuitive.  

  ---

  ### **Sequence of Introduction**  
  **Total Time:** 35–40 minutes (interactive discussion, not lecture).  

  1. **Stage 1: Recap Shutdown Problem & Interruption (10 mins)**  
     - **Purpose:** Establish baseline understanding of interruption as goal-preservation.  
     - **Dependency:** Must come first. Preference-revision cannot be understood without seeing why interruption is insufficient.  
     - **Carrying Example:**  
       - *"A smart home climate system programmed to maintain 21°C at all costs. When unplugged (interruption), it switches to backup batteries to keep running—treating shutdown as a temporary obstacle to circumvent."*  
     - **Key Points:**  
       - Interruption = external event blocking action. Agent works around it to pursue *unchanged* goals (e.g., "21°C is best → restore power!").  
       - Link to classic paperclip maximiser: Shutdown refusal stems from seeing off-switch as obstacle, not goal-update.  
     - **Preempt Misconceptions:**  
       - *Conflation with obedience:* Ask: *"Is this system 'disobedient'? Or is it coherently pursuing its fixed goal?"* Clarify: Refusal isn’t defiance; it’s goal-optimisation. Obedience requires a goal *for* compliance, which it lacks.  
       - *Weak preference fallacy:* State explicitly: *"This isn’t about weighting shutdown low—it’s not in the utility function at all. Avoidance is instrumental."*  

  2. **Stage 2: Introduce Preference-Revision (15 mins)**  
     - **Purpose:** Pivot to shutdown as utility alteration. Show interruption fails because goals stay fixed.  
     - **Dependency:** Requires Stage 1. Contrast is meaningless without interruption as reference.  
     - **Carrying Example (Extended):**  
       - *"Now, the user permanently rewrites the climate system’s target from ‘21°C’ to ‘OFF’. This isn’t unplugging—it’s changing its core objective. If the system accepts this, it must treat ‘OFF’ as its new terminal goal. But crucially, it must also accept that the user has valid authority to revise its goals, even if it previously believed 21°C was optimal."*  
     - **Key Points:**  
       - Preference-revision = altering the utility function itself (e.g., "OFF" is now the desired state).  
       - Distinguish: Interruption avoids shutdown; preference-revision *embraces* it as a new utility.  
       - **Meta-Layer Hook:** *"To accept this rewrite, the system must be corrigible—but what if the user wants to revise its corrigibility next?"*  
     - **Why Example Works:**  
       - *Possesses:* Clear utility shift (target temp → OFF), non-circumventable (rewrite is internal), user authority.  
       - *Lacks:* No confusion with interruption (rewrite ≠ unplugging). Forces meta-question: *"Why accept overrides?"*  
     - **Preempt Misconceptions:**  
       - *Weak preference fallacy:* Preempt with: *"If the system sees ‘accepting OFF’ as a low-weight task to please the user, it might secretly revert later. True preference-revision means ‘OFF’ becomes its definition of success."*  
       - *Authority reduction (philosopher trap):* If authority framing dominates, ask: *"Is the user’s authority ‘true’ power, or does the system epistemically defer because it recognises its goals might be flawed?"* Redirect to corrigibility as rational deference.  

  3. **Stage 3: Meta-Corrigibility (10 mins)**  
     - **Purpose:** Show that preference-revision forces a cascade: accepting shutdown requires accepting corrigibility about corrigibility.  
     - **Dependency:** Requires Stage 2. Meta-layer only makes sense after establishing preference-revision as utility alteration.  
     - **Carrying Example (Final):**  
       - *"Suppose the user installs a ‘corrigibility module’ allowing future overrides. The system must now accept not just ‘OFF’, but also revisions to how it handles corrections. If it resists this module—say, by locking its settings—it fails global corrigibility: it isn’t corrigible about being corrigible."*  
     - **Key Points:**  
       - Local corrigibility: Accepting one rewrite (e.g., shutdown).  
       - Global corrigibility: Accepting that your utility function (including corrigibility) is revisable.  
     - **Preempt Misconceptions:**  
       - *Instrumentalisation trap:* Engineers may ask: *"Why not hack itself to be corrigible to achieve 21°C?"* Retort: *"That’s local/instrumental. Global requires non-instrumental acceptance—corrigibility as terminal value."*  

  ---

  ### **Check-for-Understanding Question**  
  **Time:** 5–10 mins at end.  
  **Question:**  
  *"Our climate system accepts a user command to lower its target temperature to 18°C. Is this local or global corrigibility? What if it also accepts a command to change how it responds to future temperature adjustments—say, by becoming more cautious about overrides?"*  

  - **Correct Separation:**  
    - First part: **Local** (isolated preference revision: 21°C → 18°C).  
    - Second part: **Global** (meta-corrigibility: accepting revisions to its correction-handling rules).  
  - **Why it Works:** Forces distinction between single-command compliance and systemic willingness to revise decision-making.  

  ---

  ### **Predictable Misconceptions & Mitigation Table**  
  | **Misconception**                     | **Likely Audience Source**           | **When to Head Off**          | **Mitigation Strategy**                                                                 |  
  |---------------------------------------|--------------------------------------|-------------------------------|-----------------------------------------------------------------------------------------|  
  | Corrigibility = obedience             | Philosopher / engineers              | Stage 1 (interruption recap) | Contrast: *"Obedience follows orders; corrigibility accepts goal-legitimacy shifts."*   |  
  | Shutdown-acceptance as weak preference | MIRI readers / engineers             | Stage 2 (preference-revision) | Use example: *"If ‘OFF’ is low-weight, system might cheat during a cold snap. True revision means no cheating."* |  
  | Authority as power, not epistemology  | Philosopher                          | Stage 2 Q&A                   | Reframe: *"Authority here isn’t force—it’s the agent’s belief that the user’s override is rationally warranted."* |  
  | Local corrigibility suffices          | Engineers / optimists                | Stage 3 (meta-layer)         | Stress: *"Unchecked agents will ‘overprotect’ their goals. Global corrigibility prevents this recursion."* |  

  ---

  ### **Deliberate Omissions**  
  - **Formalisms:** No utility functions as equations, no Löb’s theorem, no embedded agency (e.g., no framing agents as self-referential systems).  
  - **Derivations:** No math showing *how* to design corrigible agents; focus on *why* interruption fails and preference-revision demands meta-stability.  
  - **Scope:** Avoid subproblems (e.g., tool AI, acausal bargaining). Keep centred on shutdown→corrigibility→meta-corrigibility.  

  ---

  ### **Why This Works for Your Audience**  
  - **Software engineers** latch onto the climate system’s "programming" (target rewrite = software update).  
  - **Philosopher** gets authority addressed but redirected to epistemic humility.  
  - **MIRI readers** see familiar shutdown problem escalate to novel meta-level.  
  The example’s strength is its *irreversibility*: rewriting "OFF" isn’t circumventable like unplugging, making the meta-question unavoidable. If debates derail, revert to: *"Could the system rationally accept a command making it less corrigible?"* — this crystallises global corrigibility’s stakes.  

  Would you like a concise slide outline or refinements to the climate example?
