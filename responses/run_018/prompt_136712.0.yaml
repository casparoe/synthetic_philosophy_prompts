answer: |-
  The regulatory asymmetry between CDR and SRM reveals a **robust thermodynamic arrow of time** embedded in climate governance, with three interlocking philosophical commitments:

  ### Core Implicit Theory of Time
  1. **Thermodynamic Irreversibility as Operational Reality**  
     Governance protocols treat Earth systems as *dissipative structures* (per Prigogine) where interventions create path dependencies. SRM termination shock embodies:  
     - **Causal Asymmetry**: SRM masks warming via continuous energy dissipation (aerosol injection/reflectance maintenance). Cessation isn't "undoing" but triggering accumulated disequilibrium.  
     - **Timescale Hierarchy**: Rebound warming occurs over months/years (fast climate feedbacks), while CDR reversal unfolds over centuries (slow carbon-cycle inertia). This kinetic asymmetry is treated as ontologically significant.  

  2. **Anthropogenic Entanglement with Geological Time**  
     Past emissions are "settled baselines" because:  
     - CO₂ removal (e.g., via mineralization) doesn't reverse ocean acidification or species extinction—it creates a *novel state*.  
     - The protocols reject **temporal neutrality**: Restoring pre-industrial CO₂ concentrations ≠ restoring pre-industrial Earth due to hysteresis (e.g., melted ice sheets).  

  3. **Risk Ontology Rooted in Emergent Irreversibility**  
     Termination-shock protocols assume:  
     - **Convexity of Harm**: The penalty for stopping SRM grows superlinearly with deployment duration (unlike CDR's roughly linear scaling).  
     - **Unidirectional Lock-in**: SRM becomes a *non-substitutable public good*—its value arises from preventing rapid change, making cessation a coordination failure trap.  

  ### What the Protocols Strictly Require vs. Accommodate
  | **Element**               | **Strict Requirement**                                  | **Accommodation**                          |
  |---------------------------|---------------------------------------------------------|--------------------------------------------|
  | **SRM Termination Shock** | Prevention of abrupt cessation                          | Specific SRM technology (e.g., aerosols vs. mirrors) |
  | **CDR Scalability**       | Monitoring of carbon cycle feedbacks                    | Rate of drawdown (if net-negative)         |
  | **Baseline Emissions**    | Irreversibility of past climate impacts                 | Attribution of warming to specific decades |

  ### Contingent vs. Necessary Foundations
  The distinction **cannot be reduced to engineering pragmatism alone**. Consider:  
  - If Earth's climate responded symmetrically to forcing changes (e.g., if cooling rebound matched SRM suppression speed), termination shock wouldn't exist. But Clausius > Kelvin: radiative dissipation is fundamentally asymmetric.  
  - Engineering "contingencies" (e.g., aerosol residence times) are downstream of thermodynamic constraints (entropy production in turbulent atmospheres).  

  ### Consequences of Adopting Time-Symmetric Physics + Decision-Theoretic Risk
  Replacing the current framework with **Laplacian time symmetry** (physics invariant under t → -t) and **atemporal risk calculus** would:  
  1. **Neutralize Termination Shock's Unique Status**  
     - SRM cessation becomes merely another probabilistic scenario, not a temporal singularity. The "shock" is redefined as a utility function discontinuity.  
  2. **Equate CDR Halt with SRM Cessation**  
     - Both become "path adjustments" in a phase space without privileged temporal direction. Historical emissions could be "undone" in models via negative emissions.  
  3. **Undermine Precautionary Lock-in Logic**  
     - SRM deployment no longer requires indefinite institutional commitment. Governance shifts to real options theory: SRM as a "switchable" cooling option.  

  **Policy Transformation Example**:  
  Under current frameworks, SRM governance resembles nuclear waste management (millennial-scale responsibility). Under time symmetry, it resembles cloud computing contracts—services can be terminated if marginal costs exceed benefits, with reversible impacts.  

  ### Conclusion
  Climate governance embeds a **weak emergent arrow of time**: not fundamental physics irreversibility, but *effective irreversibility* in complex systems. This arises from:  
  - Scale-dependent dissipation times (radiative vs. biogeochemical)  
  - The impossibility of restoring initial conditions (emissions as ratchets)  
  - Adaptive systems' memory (ecosystems don't "reset")  

  Rejecting this would require treating climate as a closed Hamiltonian system—a view incompatible with paleoclimate evidence and non-equilibrium thermodynamics. The protocols thus encode a **Bergsonian duration**: time as cumulative becoming, not reversible configuration space.
