answer: |-
  That's a brilliantly observed pattern, cutting across law, psychology, and institutional design. The inconsistency reveals deep, often unexamined, philosophical assumptions about personal identity, weakness of will (akrasia), and how institutions should mediate between our temporal selves. Let's dissect it:

  ## The Implicit Philosophical Picture
  1.  **The "True Self" vs. "Temporary Self" Model (Dual Selves) in Addiction Policy:**
      *   **Assumption:** Gambling self-exclusion presupposes a fundamental distinction:
          *   **The Rational/Intended Self:** The person making the pre-commitment (while sober, calm, regretful) is the "true self" or the self whose preferences should govern.
          *   **The Compromised/Irrational Self:** The person tempted to gamble (under craving, stress, addiction's influence) is a "lesser," "inauthentic," or "temporarily hijacked" self whose choices are invalid.
      *   **Enforcement Logic:** Binding the "true self's" will against the "irrational self" is protective, even paternalistic. Arresting the gambler for trespassing upholds the authority of the *past rational self* over the *present compromised self*. It treats addiction as creating a distinct, dangerous agent state.

  2.  **The "Unitary but Vulnerable Agent" Model in Contract Law:**
      *   **Assumption:** Contract law generally assumes a single, continuous agent. However, it recognizes that extreme, temporary mental states (duress, undue influence, incapacity) can *momentarily* impair the agent's ability to form rational intent.
      *   **Enforcement Logic:** Voiding a contract signed under distress isn't prioritizing a "past self" over a "present self." It's acknowledging that the *agent at the time of signing* lacked the necessary capacity for genuine consent. It protects the *present agent's* autonomy from being bound by a decision made when they weren't truly autonomous. The focus is on the *quality of consent at T1*.

  3.  **The "Pragmatic Nudge" Model for Retirement Accounts:**
      *   **Assumption:** This sits in a middle ground. It recognizes time-inconsistent preferences (hyperbolic discounting) – the *same agent* values immediate gratification more than future gratification. There's no strong "true self" vs. "false self" distinction, just predictable irrationality.
      *   **Enforcement Logic:** Penalties create friction, increasing the cost of present impulsivity (withdrawal) to make it align better with the agent's long-term goals (saving). It doesn't *prevent* access (respecting present autonomy) but makes impulsivity costly enough to often deter it. It assumes the agent is unitary but needs help overcoming predictable bias.

  ## Can Hyperbolic Discounting Explain It All?
  *   **Yes, to a significant extent:** Hyperbolic discounting provides a powerful *unifying framework*. It posits a single agent whose discount rate for future rewards is steep in the near term but flattens over longer periods. This creates predictable reversals of preference:
      *   **Gambling:** At T0 (sober), the agent vastly prefers a life free of gambling losses/family ruin (distant negative outcome) over the thrill of gambling (immediate reward). At T1 (craving), the immediate reward of gambling outweighs the distant negative outcome. The life ban locks in the T0 preference when the T1 preference is strongest.
      *   **Contracts:** At T0 (distressed), immediate relief (signing) overwhelms rational consideration of long-term consequences. At T1 (calm), the long-term consequences are correctly weighted. Voiding protects against the T0 distortion.
      *   **Retirement:** At T0, saving feels good (distant reward). At T1 (need cash now), the immediate cash vastly outweighs the distant retirement goal. Penalties increase the immediate cost, nudging behavior back towards the T0 preference.
  *   **Limitations of Pure Hyperbolic Discounting:**
      *   **Qualitative Shifts:** Addiction may involve more than just steep discounting – neurobiological changes, cue reactivity, loss of executive control – that feel like a *different state of being*, supporting the "dual selves" intuition. Severe distress can genuinely impair cognitive function, not just alter discount rates.
      *   **Enforcement Rigidity:** Hyperbolic discounting suggests preferences stabilize over time (e.g., discounting flattens). A *truly* hyperbolic agent might rationally prefer a temporary lock (e.g., 5-year gambling ban) rather than a lifetime one, knowing their preferences in 20 years might be stable and different. Lifelong bans feel more like enforcing a "true self's" permanent will.

  ## Philosophical (In)Consistency?
  **The practices are largely *inconsistent*, smuggling in different views:**

  1.  **Addiction Policy:** Heavily leans on the **"True Self" model**, treating the addicted state as fundamentally alien. Enforcement is absolute and punitive (arrest).
  2.  **Contract Law:** Leans on the **"Unitary but Vulnerable Agent" model**, focusing on consent quality at the moment of commitment. It protects the agent *from* their past impaired self, not *for* their past rational self against their present self. Enforcement is remedial (voiding the contract).
  3.  **Retirement Accounts:** Leans on the **Hyperbolic Discounting model**, acknowledging a unitary agent with predictable bias and using friction (penalties) rather than prohibition. Enforcement is deterrent.

  **The core inconsistency:** Why is the "true self" of the sober gambler given absolute, lifelong authority over their future compromised selves (via state enforcement and arrest), while the "true self" of the calm contract signer is *not* given authority to bind their future self if that future self claims the original signing was under distress? Why is one past self prioritized absolutely, while the other can be overridden? The treatment of "weakness" differs based on context (addiction vs. commercial distress).

  ## Hyperbolic Discounting Framework: Implications for Institutional Design
  Replacing the implicit theories with a consistent hyperbolic discounting view would necessitate significant changes:

  1.  **Gambling Self-Exclusion:**
      *   **Sunset Clauses:** Lifetime bans become irrational under hyperbolic discounting (preferences change/stabilize). Bans should be renewable (e.g., 1, 3, 5 years) after mandatory cooling-off periods and reassessment. The *agent* chooses again.
      *   **Reduced Punishment:** Trespassing arrest is excessive. Enforcement should focus on gentle but firm removal, coupled with immediate access to support resources. The goal is to help the agent overcome the *current* impulse spike, not punish the "false self."
      *   **Focus on Cooling-Off:** Mechanisms to add friction/delay *before* gambling when an excluded person tries to enter (e.g., mandatory 24-hour wait after reinstatement request).

  2.  **Contract Law:** (Less change needed, as it somewhat aligns)
      *   **Clearer Standards:** More explicit recognition of "hot states" and hyperbolic discounting as grounds for voidability, potentially broadening protections slightly beyond extreme duress to recognized states of predictably impaired judgment (e.g., certain high-pressure sales tactics exploiting known biases).
      *   **Cooling-Off Periods:** Wider application of statutory cooling-off periods for contracts signed in contexts prone to impulsive decisions.

  3.  **Retirement Accounts:** (Also relatively aligned)
      *   **Tiered Penalties:** Penalties could be more dynamically calibrated to the time horizon (steeper penalties for very early withdrawal, decreasing over time as hyperbolic discounting flattens).
      *   **Commitment Devices:** Offer more flexible pre-commitment options within accounts (e.g., "Lock this portion until age X, penalty-free access only for emergencies Y & Z after a 30-day delay").
      *   **Default "Friction" Settings:** Automatically increasing penalty thresholds for withdrawals as balances grow, reflecting the increasing long-term stakes.

  4.  **General Principles:**
      *   **Commitment Flexibility:** Pre-commitments should generally be reversible, but with friction/delay calibrated to the severity of the predicted preference reversal and the time horizon.
      *   **Focus on Bias Mitigation:** Design focuses on helping the unitary agent navigate predictable biases (via friction, cooling-off periods, reminders of long-term goals) rather than permanently binding one "self" over another or punishing "weakness."
      *   **Respect for Evolving Preferences:** Mechanisms for periodic review and adjustment of pre-commitments as the agent's circumstances and discount rates plausibly change over the long term.

  ## Conclusion
  The current institutional patchwork reveals a philosophical muddle. Addiction policy enforces a strong "True Self vs. Hijacked Self" dualism, contract law protects a unitary agent from temporary impairment, and retirement policy pragmatically nudges a predictably biased unitary agent. A consistent application of the hyperbolic discounting model – acknowledging a single agent with time-inconsistent preferences – would lead to more flexible, less punitive, and ultimately more rational and respectful systems. It would replace absolute lifetime locks and punitive enforcement with calibrated friction, cooling-off periods, and opportunities for reassessment, focusing on supporting the agent's long-term goals across all domains of predictable weakness of will.
