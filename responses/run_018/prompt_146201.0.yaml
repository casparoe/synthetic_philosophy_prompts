  hey — i'm a science jornalist working on a feautre about randomness and belief, and i keep tripping over lewis's principal principel. from what i gather, it says if you know the objective physical chance is x, your rational credance should be x — but only if your other evidence is "admissable." so here's the thing that's bugging me: imagine a quantum casino where every slot is certified fair at exactly 50/50, and they post the hamiltonians right on the wall. a player knows the physics, pulls the lever, gets heads, pulls again, gets heads, ten times in a row. bayes's rule seems to say "update your belief about the machine," but if the player still trusts the posted hamiltonian, doesn't the principal principle force them to stay at 50/50 for pull eleven? and if so, isn't that saying they should literally ignore what they just saw? i feel like i'm mixing up updating on the chance versus updating on the outcome, but i can't tell where the line is. can you untangle this? write it in american english please — no reading lists, just the conceptual knot. sorry for the typos.
