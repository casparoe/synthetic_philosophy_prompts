prompt: |-
  At a philosophy of mind study group, Jordan and Riley got into a sustained argument about whether global workspace theory can genuinely accommodate phenomenal consciousness without collapsing it into access consciousness. Jordan began by claiming that recent global-workspace models—particularly those that treat broadcasting as graded rather than all-or-nothing—leave conceptual room for what she called "half-broadcast" states: sensory information that has achieved global availability for emotional modulation and perceptual integration but has not yet been formatted for conceptual report or rational action guidance. She argued that this is precisely where phenomenal consciousness resides: globally available, yet not access-conscious in Block's strict sense, since access requires conceptual availability for reasoning and voluntary control.

  Riley pushed back that this merely redefines phenomenal consciousness as a subset of access. He said that if a state is globally available—even only for "emotional integration"—then by definition it is accessible to some cognitive systems, which is all Block ever required for access consciousness. To defend the distinction, Riley introduced what he termed "refractory phenomenal residues": hypothetical cases in which intense local recurrent processing in early sensory cortices produces rich experiential character, but the signal is too noisy or weak to reach any global workspace threshold. He argued that these residues show phenomenal consciousness can exist with no broadcasting whatsoever, and that global-workspace theorists are forced either to deny that the residues are conscious—which he found implausible—or to concede that phenomenal consciousness does not require global availability.

  Jordan replied that invoking "refractory residues" is ad hoc unless we have independent criteria for attributing consciousness to sub-threshold neural events. She granted that local recurrent processing might be necessary for phenomenal consciousness, but insisted it is not sufficient: without at least partial global integration, there is no "subject" for whom the experience exists. She then argued that Riley's position risks collapsing into a form of panpsychism about micro-processes, since if any isolated local recurrent loop can be phenomenally conscious regardless of global context, consciousness becomes ubiquitous throughout the brain.

  Riley countered that Jordan was conflating "global integration" with "global broadcasting." He proposed that phenomenal consciousness requires only local integration with a self-model, not full workspace broadcasting, and that Jordan's "half-broadcast" category was actually closer to his view than she admitted—except that she insisted on retaining global availability, which he saw as unnecessary baggage inherited from access-based frameworks.

  Jordan closed by asking whether, on Riley's view, a fully anesthetized patient with isolated local recurrent activity in V1 could have a visual experience that produces no global effects whatsoever. Riley said yes, in principle, though he admitted we might never detect it. Jordan responded that if such a state is undetectable in principle and makes no difference to cognition or behavior, then postulating it violates parsimony and risks turning phenomenal consciousness into an epiphenomenal ghost.

  Please adjudicate their exchange move by move: evaluate Jordan's initial half-broadcast proposal, Riley's refractory-residue objection, Jordan's response about ad hoc attribution and panpsychism, Riley's distinction between integration and broadcasting, and Jordan's final parsimony challenge. For each move, rate it as clearly mistaken, partly right but missing something, or clearly right, with brief justification. Then say who is more right overall, and identify the deepest issue both parties are failing to address—particularly whether their disagreement is substantive or partly verbal about what "access" and "global availability" must entail.
reasoning: |-
  Hmm, I need to adjudicate this philosophical debate between Jordan and Riley about global workspace theory and phenomenal consciousness. Let me break down their exchange step by step as requested.

  First, Jordan's opening move about "half-broadcast" states seems insightful. She's pointing out that recent graded global workspace models allow for information that's globally available for emotional processing but not fully formatted for conceptual report. This cleverly exploits an ambiguity in Block's access consciousness definition - does "access" require conceptual availability or just any cognitive availability? Her position seems partly right but might be missing that emotional integration itself could constitute a form of access.

  Riley's refractory residue objection is strong too. By proposing cases where rich local processing never reaches global availability, he directly challenges the necessity claim of global workspace theory. His point that emotional integration still counts as access has merit, though he might be underestimating how "partial" Jordan's half-broadcasting really is. I'd say he's partly right but perhaps too quick to dismiss the subjecthood concern.

  Jordan's panpsychism warning feels like a solid point. If every isolated neural loop can be conscious, we risk consciousness inflation. But she might be overstating the case - local recurrence in sensory cortices isn't the same as random micro-processes. Her ad hoc criticism is fair too; we do need independent criteria for attributing consciousness. Overall, her response seems partly right but slightly uncharitable to Riley.

  Riley's integration/broadcasting distinction is his strongest move. Separating local integration with self-model from full broadcasting addresses Jordan's subjecthood concern while maintaining his core position. This seems clearly right and highlights how their disagreement might be about degrees of integration rather than a binary.

  Jordan's final anesthesia challenge is powerful. If phenomenal consciousness can exist with zero global effects, it becomes undetectable and potentially epiphenomenal - a serious theoretical cost. While Riley's "in principle" possibility isn't logically wrong, it does violate parsimony. This feels like a clearly right move that exposes a weakness in his position.

  Looking at the overall debate, Riley makes good points about local sufficiency, but Jordan's arguments about detectability and subjecthood seem more compelling. The deepest unaddressed issue appears to be the relationship between functional integration and subjective perspective - both are talking past each other about what constitutes "access" and "global availability," with Riley adopting a minimalist view and Jordan requiring more robust integration. Neither fully grapples with how partial broadcasting might create partial subjectivity.
answer: |-
  Here is a move-by-move adjudication of Jordan and Riley's exchange, evaluating each argument's strengths and weaknesses, followed by an overall assessment and identification of the deepest unresolved issue.

  ### 1. **Jordan’s Initial "Half-Broadcast" Proposal**  
     *Rating:* **Partly right but missing something.**  
     *Justification:* Jordan correctly identifies a gap in Block's strict access consciousness (A-consciousness) definition. Graded broadcasting models *do* allow for states that are globally integrated for emotional/perceptual processing but not formatted for conceptual report or action. This *could* carve out space for phenomenal consciousness (P-consciousness) distinct from A-consciousness. However, she underestimates Riley’s counter: if a state is globally available *to any cognitive system* (e.g., emotional modulation), it arguably meets Block’s minimal criteria for access ("availability for use in reasoning and rational control of action and speech"). Her distinction hinges on redefining "access" as exclusively *conceptual* access—a stipulation Block does not require.

  ### 2. **Riley’s "Refractory Residue" Objection**  
     *Rating:* **Partly right but missing something.**  
     *Justification:* Riley effectively challenges the *necessity* of global availability for P-consciousness by positing isolated, intense local processing (e.g., in V1) that might be phenomenally rich but sub-threshold for broadcasting. This highlights a genuine problem for global workspace theory (GWT): if P-consciousness requires broadcasting, GWT must either deny consciousness in these cases (counterintuitive) or admit P-consciousness can exist without global access. However, his objection is speculative—without independent criteria for attributing P-consciousness to sub-threshold states (e.g., neural correlates or reportability proxies), "refractory residues" risk being an unfalsifiable retreat to neural mysterianism.

  ### 3. **Jordan’s Response: Ad Hoc Attribution and Panpsychism**  
     *Rating:* **Partly right but missing something.**  
     *Justification:* Jordan rightly demands independent criteria for attributing consciousness to local processes, exposing a weakness in Riley’s appeal to "residues." Her panpsychism warning is also valid: if *any* local recurrent loop suffices for P-consciousness, consciousness becomes implausibly ubiquitous (e.g., in early visual processing during anesthesia). However, she overstates the risk. Riley’s focus on "rich" local processing in sensory cortices (not random micro-loops) avoids full panpsychism. Her strongest point is about the "subject" problem: without global integration, it’s unclear *for whom* an experience exists. But she conflates "global integration" with full broadcasting.

  ### 4. **Riley’s Distinction: Integration vs. Broadcasting**  
     *Rating:* **Clearly right (on the distinction), partly right (on implications).**  
     *Justification:* Riley correctly disentangles "integration" (local binding with self-model) from "broadcasting" (global availability). This is a crucial refinement: GWT often conflates integration (necessary for subjective unity) with broadcasting (necessary for access). His view that P-consciousness requires only local integration with a self-model (e.g., sensory processing linked to bodily self-representation) is plausible and addresses Jordan’s "subject" concern without requiring broadcasting. However, he dismisses global availability too hastily—without broadcasting, the self-model itself might lack coherence, and his view struggles with Jordan’s parsimony challenge.

  ### 5. **Jordan’s Final Parsimony Challenge**  
     *Rating:* **Clearly right.**  
     *Justification:* Jordan’s anesthesia thought experiment is decisive. If P-consciousness can exist in total isolation (e.g., V1 activity with no global effects), it becomes undetectable in principle and epiphenomenal—violating parsimony and scientific testability. Riley’s admission that we "might never detect it" concedes this weakness. Epiphenomenalism is a major theoretical cost, as it severs consciousness from causal efficacy, making it irrelevant to evolution or cognition. GWT avoids this by linking P-consciousness to functional access.

  ---

  ### **Overall Verdict: Jordan is more right.**  
  While both make valid points, Jordan’s arguments hold more weight. Her "half-broadcast" proposal leverages modern GWT developments to address Block’s distinction, and her parsimony challenge exposes a fatal flaw in Riley’s isolated P-consciousness. Riley’s integration/broadcasting distinction is insightful but fails to resolve the hard problem of detecting or justifying "hidden" phenomenal states.

  ### **Deepest Unresolved Issue: The Nature of "Access" and Subjectivity**  
  Both parties are talking past each other due to **ambiguous definitions of "access," "global availability," and "subject."**  
  - **Substantive Disagreement:** Whether P-consciousness *requires* functional impact (Jordan) or can be "phenomenally orphaned" (Riley). This hinges on the empirical question: Can neural processes produce subjective experience without any capacity to influence other systems?  
  - **Verbal Disagreement:** What counts as "access" or "global availability"?  
    - Riley defines "access" minimally (availability to *any* cognitive system, e.g., emotion).  
    - Jordan defines "access" restrictively (availability for conceptual report/rational action).  
    Neither engages Block’s core criterion: availability for *voluntary control*. "Emotional integration" might qualify.  

  **The core failure** is addressing how "subjecthood" emerges. Jordan ties subjectivity to global integration but conflates it with broadcasting. Riley ties it to local self-model integration but cannot explain how an isolated module hosts a "subject." Both neglect the "hard problem" of why certain integrations feel like anything at all. The debate needs clearer operational criteria for P-consciousness (e.g., reportability, metacognitive access) to avoid stalemates over undetectable "residues."
