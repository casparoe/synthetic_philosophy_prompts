answer: |-
  Here's a comprehensive specification for an adequate theory of omission-causation, structured for clarity. The table summarizes key requirements, followed by analysis of critical tensions and the "killer" desideratum.

  ### **Adequacy Conditions for a Theory of Omission-Causation**

  | **Category**               | **Requirement**                                                                 | **Key Examples/Notes**                                                                 |
  |----------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Core Cases**             | 1. **Simple Omission**: Gardener fails to water plants → plants die.           | Must distinguish causation from mere counterfactual dependence.                       |
  |                            | 2. **Preemptive Omission**: Guard A *and* Guard B could save prisoner; neither does → prisoner dies. | Did both cause the death? Or neither?                                                 |
  |                            | 3. **Symmetrical Overdetermination**: Two doctors *each* could (and should) have administered antidote; neither does → patient dies. | Tests transitivity/non-redundancy.                                                    |
  |                            | 4. **Collective Omission**: No single voter causes election loss, but all voters abstaining does. | Challenges individuation of causes.                                                   |
  |                            | 5. **Omissions Preventing Omissions**: Security guard’s failure to disable alarm (omission) prevents thief’s failure to steal (omission). | Tests causal "net" relations.                                                         |
  |                            | 6. **Non-Agent Omissions**: Algorithm fails to flag fraud → financial collapse; Govt. omits policy → famine. | Must work without intentional agency.                                                 |
  |                            | 7. **Deterministic Worlds**: In a fully deterministic block universe, can "not-A" cause B if A’s absence was inevitable? | Tests compatibility with physics.                                                     |
  | **Critical Distinctions**  | 1. **Causing vs. Allowing**: Shooting someone (causing) vs. failing to remove poison (allowing death). | Normative weight differs; metaphysics must capture this.                              |
  |                            | 2. **Absence vs. Omission**: "No rain" (absence) vs. "Farmer didn’t irrigate" (omission). | Omissions imply potential agency/norms; absences may not.                             |
  |                            | 3. **Negative Causation vs. Correlation**: Oxygen absence correlates with death, but *causes* it? | Requires grounding in causal mechanisms.                                              |
  |                            | 4. **Failing-to-Prevent vs. Causing**: Doctor fails to stop infection (vs. injecting pathogen). | Moral/legal implications hinge on this.                                               |
  | **Empirical Constraints**  | 1. **Physics**: No "gaps" in quantum fields; absences aren’t physical. Theory can’t require literal "negative events". | Relational/contrastive approaches fare better.                                        |
  |                            | 2. **Cognitive Science**: Humans detect omissions via norm-violations (e.g., Rips 2010), not dedicated "absence detectors". | Theory should explain why agentive omissions *feel* causal, not assume primacy.       |
  |                            | 3. **Neuroscience**: No evidence for "absence" representations in perception; we infer omissions cognitively. | Undermines views requiring direct causal perception of absences.                      |
  | **Tensions (Likely Impossible Pairs)** | 1. **Non-Normativity + Moral Responsibility**: Can’t ground institutional blame without norms. | Pure process theories struggle with non-agent cases.                                  |
  |                            | 2. **Determinism + Robust Causation**: If omissions are inevitable in deterministic worlds, are they causes? | Threatens counterfactual and difference-making views.                                 |
  |                            | 3. **Physicalism + Causal Efficacy**: How can non-existent entities (absences) have causal power? | Dualists/anti-physicalists avoid this, but at high cost.                              |

  ---

  ### **The "Killer" Desideratum: Non-Agent Omissions**
  **Why it’s devastating:** Most theories (especially normative or agent-centric ones) collapse when applied to non-agents.  
  - **Counterfactual Dependence (Lewis)**: "If the algorithm *had* flagged fraud, collapse would not have occurred."  
    *Problem*: Overgenerates (e.g., "if the sun had exploded, collapse wouldn’t occur" → false cause).  
  - **Normative Accounts (Moore, Schaffer)**: Relies on duties (e.g., "the gardener *should* have watered").  
    *Problem*: What duty does an algorithm have? Institutions aren’t moral agents.  
  - **Interventionism (Woodward)**: "Intervene to make algorithm flag fraud → collapse avoids."  
    *Problem*: Interventions require variables; absences aren’t manipulable. Also struggles with preemption.  

  **Result**: Forces theories to either (a) deny non-agent omissions are causal (implausible for institutional failures), or (b) adopt a purely difference-making view that severs causation from responsibility.

  ---

  ### **Why Omissions "Feel" Weaker: Bias or Reality?**
  - **Evidence for Bias**:  
    - Cogsci: We judge omissions as less causal than actions (Cushman et al. 2008), *unless* norm-violating (e.g., "paid guard neglects duty").  
    - Law: Omissions incur liability only with pre-existing duty (contrast: active malice).  
  - **Metaphysical Reality**:  
    - **Pro-Weaker**: Omissions lack energy transfer/spatiotemporal location; they’re contrastive (Dowe: "causation requires conserved quantities").  
    - **Anti-Weaker**: In deterministic systems, omissions are ontologically symmetric with actions (both fixed by prior states).  

  **Verdict**: The "weakness" is likely *anthropocentric* (rooted in norms and detection heuristics), not metaphysical. A good theory should *explain* this asymmetry without building it into causation’s fabric.

  ---

  ### **Recommendation for Your Seminar**
  Focus on the **tension between physicalism and non-agent omissions**. Attack counterfactual theories with **symmetric overdetermination** (e.g., two negligent guards), and normative theories with **algorithmic omissions**. The hardest nut is reconciling physics (no absences) with intuition (omissions cause outcomes).  
  **Start reading**: Dowe’s *physical process* theory (fails non-agents), Schaffer’s *contrastivism* (better for norms), and Paul’s *causation as influence* (handles determinism).
