prompt: |-
  hey im in this metaphysics seminar and weve been stuck on causation by ommission. my tutor keeps saying any decent theory just needs to cover the gardener not watering the plants, but that feels way too thin. before i read more i want the full spec: what should a theory of omission-causation actually deliver to count as adequate? list the cases it has to handle (the classic ones, but also collective omissions, omissions that prevent other omissions, omissions in fully deterministic setups where nothing is physically missing, and omissions by non-agents like institutions or algorithms), the distinctions it cant collapse (causing vs allowing vs failing-to-prevent, absence vs omission, negative causation vs correlation), results from physics or cognitive science it cant flat-out contradict (e.g. no dedicated absence-detectors?), and flag any pair of desiderata you think are probably impossible together. then tell me which single requirement does the most damage to the usual suspects — the counterfactual-dependence view, the normative account, maybe the interventionist take. table is fine if it helps. im especially wondering whether the theory needs to explain why omissions feel causally weaker, or if thats just a bias we should drop.
