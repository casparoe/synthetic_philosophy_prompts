  - Examining real-world implications like defunding evo-psych responsibly. 

  I should avoid biographical or Popper-restatement questions. All questions must force the scholar to defend original claims. For the policy question, predicting her reply requires imagining her stance: likely she'd argue evo-psych could adopt predictive standards but currently doesn't. The follow-up should challenge if that's realistically possible given evo-psych's subject matter. 

  For the sociology question, I should push her to clarify if falsifiability criteria are transcendent or discipline-relative. This touches on whether her view is normative epistemology or descriptive sociology. 

  Need to ensure all questions are substantive and avoid softball topics. The evo-devo question mustn't let her off the hook—must press whether developmental constraints fundamentally alter natural selection's role. The historical explanation question should cite examples like phylogenetic inference where historical claims are testable. 

