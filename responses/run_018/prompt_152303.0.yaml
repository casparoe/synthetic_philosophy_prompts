  We are constructing an audit procedure based on the principle of "respect for rational pedagogical agency". The procedure must have a sequence of checks that a non-philosopher can run. For each step, we'll state:
   - The precise question
   - What counts as a sufficient answer
   - Where the procedure halts with a rejection
   - Where it hands the decision to human judgment (because values are at stake)
   - Where it permits sign-off.

   We must distinguish:
   (a) transparent adaptation revisable by the learner
   (b) opaque optimisation (treating cognitive load as a variable without disclosure)
   (c) justified paternalistic override (with conditions: imminent severe harm, transparent, proportionate, revisable)

   Definitions for key terms in this context:
   - "Imminent severe harm": A high probability of an event occurring in the near future (e.g., within the current academic term) that would cause significant and lasting damage to the student's educational trajectory (e.g., failing a critical exam that determines university admission) or mental health (e.g., severe anxiety leading to disengagement). The harm must be of a severity that would be widely recognized by educators and mental health professionals as requiring intervention.
   - "Revisability": The learner must have the ability to reverse or adjust the algorithmic intervention without undue burden (e.g., via a one-click option) and within a reasonable time frame (e.g., immediately or within the same learning session). The system must provide clear, accessible, and timely feedback about the intervention and the means to revise it.

   Proposed Audit Procedure:

   Step 1: Identify the type of intervention.
     Question: Does the proposed intervention involve a change to the learning content, difficulty, or path without explicit and contemporaneous learner request?
     - If YES, go to Step 2.
     - If NO (i.e., the change is directly requested by the learner at the time), then it is (a) transparent adaptation revisable by the learner. Sign-off permitted (provided there are no other issues).

   Step 2: Check for transparency and disclosure.
     Question: Is the intervention and its rationale disclosed to the learner at the time of the intervention, in a manner that is clear, timely, and accessible?
     - If YES, go to Step 3.
     - If NO, then the intervention is (b) opaque optimisation. Reject the proposal.

   Step 3: Check for revisability.
     Question: Does the intervention include an immediate and easily accessible means for the learner to reverse or adjust the change (e.g., one-click revert, undo option) without penalty or significant delay?
     - If YES, go to Step 4.
     - If NO, then the intervention is (b) opaque optimisation. Reject the proposal.

   Step 4: Check for evidence of imminent severe harm.
     Question: Is there clear and specific evidence that the intervention is necessary to prevent imminent severe harm to the student? (Evidence must be based on data and indicators that are validated and directly related to the harm. The harm must be severe and imminent as defined above.)
     - If YES, then the intervention is (c) justified paternalistic override. Go to Step 5.
     - If NO, then the intervention is (a) transparent adaptation revisable by the learner. Sign-off permitted.

   Step 5: Check for proportionality and minimal intrusion.
     Question: Is the intervention the least intrusive means to prevent the identified imminent severe harm? (Consider whether a less restrictive alternative would be effective.)
     - If YES, then the intervention is (c) justified paternalistic override. Sign-off permitted.
     - If NO, then the intervention is not justified. Reject the proposal.

   Points where professional judgment is unavoidable:
   - In Step 4: Determining whether the evidence rises to the level of "imminent severe harm" may require expert judgment (e.g., from educational psychologists or subject matter experts) and is context-dependent. The auditor must use their best judgment based on the evidence presented and may need to consult with experts if the evidence is unclear.
   - In Step 5: Assessing whether the intervention is the least intrusive means may involve weighing alternatives and their effectiveness, which can be complex and require pedagogical expertise.

   What the procedure cannot settle:
   - The procedure does not address potential biases in the data or model that might lead to unfairness. This would require a separate fairness audit.
   - The procedure does not cover whether the intervention is pedagogically effective. That is a separate question of efficacy.

   Now, we run the procedure on three proposals.

   Case 1:
     Proposal: The system detects repeated failure in calculus exercises and automatically substitutes simpler problems without notifying the student, projecting a thirty per cent retention gain.

