answer: |-
  ### Audit Procedure for Respecting Rational Pedagogical Agency

  **Definitions for Key Terms**  
  - **Imminent Severe Harm**: Evidence-based prediction of significant, near-term (within 4 weeks) negative consequences that are irreversible or severely damaging (e.g., failing a gatekeeper exam, acute mental health crisis). Must be supported by validated data (e.g., diagnostic assessments, clinician reports).  
  - **Revisability**: The learner can immediately (within one session) and effortlessly (≤2 clicks) reverse/alter the intervention, with clear explanations accessible in their primary language.  

  **Ordered Audit Procedure**  
  *Total steps: 5. Max time per step: 9 minutes.*  

  1. **Intervention Trigger Check**  
     - **Question**: Does the intervention alter the learner’s chosen path/content without their explicit, contemporaneous request?  
     - **Sufficient Answer**: "No" OR "Yes, but with imminent severe harm evidence" (proceed).  
     - **Rejection**: N/A.  
     - **Human Judgment**: N/A.  
     - **Sign-off**: If "No" → **Category (a)** Transparent adaptation.  
     - **Halt**: Proceed regardless.  

  2. **Transparency Verification**  
     - **Question**: Is the intervention disclosed in real-time, with an explanation of the rationale, in language appropriate to the learner’s age/cognition?  
     - **Sufficient Answer**: Clear, immediate notification (e.g., pop-up, voice alert) explaining *why* the change occurred.  
     - **Rejection**: If undisclosed → **Category (b)** Opaque optimisation. **Halt and reject**.  
     - **Human Judgment**: If disclosure complexity exceeds learner’s comprehension (e.g., severe cognitive disability).  
     - **Sign-off**: If "Yes" → Proceed to Step 3.  

  3. **Revisability Verification**  
     - **Question**: Can the learner revert/override the intervention immediately (≤2 clicks) without losing progress or facing penalties?  
     - **Sufficient Answer**: One-click undo option with no data loss or punitive outcomes (e.g., reduced scoring).  
     - **Rejection**: If irrevisable → **Category (b)** Opaque optimisation. **Halt and reject**.  
     - **Human Judgment**: If revisability conflicts with safety protocols (e.g., self-harm prevention).  
     - **Sign-off**: If "Yes" → Proceed to Step 4.  

  4. **Harm Justification Check**  
     - **Question**: Is there clear, documented evidence of *imminent severe harm* justifying paternalism?  
     - **Sufficient Answer**: Data showing high-probability harm (e.g., predictive model validated for >90% accuracy, verified by school psychologist).  
     - **Rejection**: If absent → **Category (a)** Transparent adaptation. **Sign-off permitted**.  
     - **Human Judgment**: If evidence is equivocal (e.g., conflicting risk indicators).  
     - **Sign-off**: If "Yes" → Proceed to Step 5.  

  5. **Proportionality Assessment**  
     - **Question**: Is the intervention the *least restrictive* means to mitigate the harm?  
     - **Sufficient Answer**: Comparison showing no equally effective, less intrusive alternatives (e.g., notifications first, then escalation).  
     - **Rejection**: If overly intrusive → Unjustified paternalism. **Halt and reject**.  
     - **Human Judgment**: Balancing pedagogical benefit vs. agency loss (e.g., duration of override).  
     - **Sign-off**: If "Yes" → **Category (c)** Justified paternalistic override.  

  **Procedure Limitations**  
  - Cannot resolve value conflicts (e.g., "efficiency vs. agency")—requires human judgment.  
  - Does not assess algorithmic bias/fairness—requires separate audit.  
  - "Imminent severe harm" thresholds may need expert consultation (e.g., school psychologist).  

  ---

  ### Case Reviews Using the Procedure  
  **Case 1: Automatic Problem Simplification**  
  - **Step 1**: Alters path without request → Proceed.  
  - **Step 2**: No disclosure → **Reject** (Category **b**).  
  - **Result**: **Rejected**. Efficiency gain (30% retention) irrelevant per Step 2. *Likely disliked by efficiency-focused officers*.  

  **Case 2: Maintaining Difficulty Despite Stress**  
  - **Step 1**: Overrides "increase difficulty" request → Proceed.  
  - **Step 2**: Message sent with rationale → Pass.  
  - **Step 3**: One-click revert option → Pass.  
  - **Step 4**: Stress markers ≠ *imminent severe harm* (no evidence of acute risk) → **Sign-off** (Category **a**).  
  - **Result**: **Approved**.  

  **Case 3: Overriding Text Choices for Minority-Language Student**  
  - **Step 1**: Overrides selections → Proceed.  
  - **Step 2**: No disclosure mentioned → **Reject** (Category **b**).  
  - **Even if disclosed**:  
    - Step 3: Revisability? Unspecified → Likely reject.  
    - Step 4: "Family pressure" inference ≠ *evidence* of harm → Reject.  
  - **Result**: **Rejected**. Efficiency rationale (accelerating learning) overruled.  

  ---

  ### Confidence Assessment  
  - **Overall Confidence**: 90% (procedure logically operationalizes core principles).  
  - **Least Certain Point**: Defining "least restrictive means" in Step 5 (e.g., is a notification always less intrusive than override?). Context-dependent judgments are unavoidable.  
  - **Critical Judgment Calls**:  
    - Case 2: "Stress markers" as non-harm relies on *current evidence standards*. If linked to panic attacks, outcome may change.  
    - Case 3: Rejection assumes disclosure/revisability absent—design amendments could permit approval.  

  This procedure ensures pedagogical agency is default, with paternalism as a narrow exception. It prioritizes transparency and revisability, even when efficiency is compromised.
