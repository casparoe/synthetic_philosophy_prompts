          Then the intervention is (a) transparent adaptation revisable by the learner. Sign-off permitted.

          However, note: the system is not changing the state (it is maintaining the current setting) but it is refusing a change the student requested. But because it is transparent and revisable, it is acceptable.

     Result: Sign-off permitted.

   Case 3:
     Proposal: A student from a minority-language background consistently selects easier texts; the algorithm infers, without direct evidence, that this choice reflects family pressure rather than authentic preference, and proposes to override the selection.

