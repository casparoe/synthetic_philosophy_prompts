          Alternatively, the one-click option might be to override the system's decision and grant the increase? The proposal says "revert", which might mean revert the decision to not increase? Then if the student clicks, the system would increase the difficulty? 

          The proposal says: "provides a one-click option to revert". The word "revert" typically means to go back to a previous state. The previous state was before the request? That doesn't make sense. Alternatively, the system is making a decision to not increase, so the one-click revert might mean to undo that decision and apply the increase? 

          We must interpret: The system is maintaining the current (hard) setting and not increasing. The student requested an increase. The system is overriding that request. The one-click option to revert likely means to do what the student requested (i.e., increase the difficulty). So the system is allowing the student to override the system's override? Then revisability is present.

