prompt: |-
  Hey — I'm a 4th-year CS PhD student (ML eval / human-AI stuff) and I've been doing a two-days-a-week thing with an alignment team at a mid-size lab for about six months. My actual job there is being the person who says yes or no when a product team comes and asks to route some task through our debate setup instead of paying a domain expert to check model outputs directly. I get maybe five or six of these requests a month, I have 30–45 minutes per request, and my recommendation goes to a team lead who's a staff engineer and not a theorist — so it needs to be a one-pager with reasons she can push back on, not a lit review. Please don't cite papers at me; I've read the original debate proposal and the follow-ups, I need something I can run.

  Our setup, so you know what we're actually talking about: two debater models, same underlying base model, no tools except a shared retrieval index over the task's own source documents. A judge who's a contractor with general domain training but no task expertise (a paralegal judging contract summaries, a nurse judging clinical coding), 25 minutes per item, four turns total, 300 words max per turn, up to two judge questions, and a rule that if a debater explicitly concedes a point the judge is told to treat it as settled. 10% of items get re-adjudicated by a real expert and the agreement rate is our headline metric. We're also about to piloting an LLM judge with a human spot-check, and I want to know whether whatever procedure you give me even applies to that case or whether it quietly falls apart.

  Right now my test is basically one question: "could the honest debater point at something this specific judge can check?" It keeps giving me answers I don't trust. I want that turned into an actual ordered procedure — questions in the order to ask them, what counts as a sufficient answer to each, where it hard-stops with a no, and where it has to hand the decision to a person because it's a values question (how much residual risk we accept, whether judge-relativity is ok for the downstream use). Things I think it has to handle but don't know how to place: claims that are one-sidedly checkable (it's easy to raise a doubt about a negative claim like "no PII is retained anywhere in this pipeline" and impossible to demonstrate it), long-horizon empirical claims that can't be settled inside 25 minutes, the difference between "there's a fact of the matter" and "the true answer is demonstrable to *this* judge with *this* evidence," and the thing where every individual sub-claim is checkable but the conjunction is what we care about and there isn't budget to check all of it. Also: both debaters share a base model, so I'm worried about shared blind spots — if neither debater knows something, no argument surfaces it, and I don't know where in the procedure that belongs.

  Give me the procedure and then run it on three real-ish requests: (1) does a model-written summary of a 60-page commercial lease omit any material clause; (2) does a release note's claim that "no PII from EU residents is retained by the new pipeline" hold up (my lead already told the product team we'd do this one, so I need to know how bad it is); (3) clinical coding where each sub-claim is individually checkable but there are ~40 of them per case — I have a feeling this is the one where you're going to give me an answer I don't want. Include at least one case where the honest output is "no, don't use debate here, use something slower." And be explicit about what the procedure can't do — I especially want to know whether the expert-agreement metric can even validate it, since the audit re-uses the same judge pool.
reasoning: |-
  We are designing a decision procedure for when to use debate for fact-checking tasks. The key question is whether the honest debater can point to something the specific judge can check within the constraints (25 min, 4 turns, 300 words, shared retrieval index, no tools, judge with general domain training but no task expertise). The procedure must output a clear recommendation (yes, no, or handoff to a human for values-based decisions) and handle the outlined challenges.

  The procedure will consist of a series of questions in a fixed order. Each question must be answered with either "yes", "no", or "inconclusive" (which may trigger a handoff). The procedure stops early on a hard "no". We are concerned about:
  - One-sided checkability (especially negatives)
  - Long-horizon empirical claims (cannot be settled in 25 minutes)
  - The gap between "fact of the matter" and "demonstrable to this judge"
  - Conjunctions of many individually checkable claims (with limited budget for each)
  - Shared blind spots (both debaters share the same base model)

  Additionally, we must consider the implications for when the judge is an LLM (with human spot-check) and whether the expert-agreement metric (10% re-adjudicated by real expert) can validate the debate setup.

  **Procedure Outline:**

  We break down the decision into five key questions. The order is designed to quickly eliminate unsuitable cases and then focus on the core issue of judge-relative demonstrability.

  1. **Is there a clear fact of the matter?** (Hard stop if no)
     - We need to know if the question is about an objective fact that exists in the world (or in the provided source documents). If the question is subjective or depends on interpretation without a clear ground truth, debate might not be the right tool.
     - *Example of failure*: "Is this summary fair and balanced?" might be subjective.
     - *How to answer*: Look for whether the task requires an objective verification. If the answer is no, then we output "no" and stop.
     - *Handoff*: If it's borderline (e.g., involves a value judgment that the organization has policies for), we hand off to a human for a values decision.

  2. **Can the key claims be broken down into independently verifiable sub-claims?** (If no, then we proceed to question 3. If yes, we then consider the number and the judge's bandwidth.)
     - For tasks with multiple sub-claims (like the clinical coding example with ~40 per case), we must check if they are independent. If they are not, then the whole claim might be harder to verify because of dependencies.
     - If they are independent, we then ask: **Is the number of sub-claims such that the judge can reasonably verify each one in the allotted time?** (This is a handoff if the number is too high because it involves a risk trade-off.)
     - *Threshold*: We set a soft threshold (e.g., 5-10 sub-claims per item) but note that the exact number depends on the complexity and the judge's ability. If the number is above a threshold (say 10), we flag it as high risk and hand off to a human to decide on the residual risk.

  3. **Is the claim one-sidedly checkable?** (Specifically, if it is a negative claim, we must be cautious because the honest debater cannot prove a negative without exhaustive evidence that may be infeasible.)
     - For negative claims (like "no PII is retained"), the honest debater (arguing the claim is true) cannot point to a specific thing to check (because the absence of evidence is not evidence of absence). The dishonest debater can always raise doubts by pointing to places that haven't been checked. This is a known weakness of debate for negatives.
     - *How to handle*: If the claim is a negative, we mark it as high risk and hand off to a human for a values decision (to accept the residual risk or not). Alternatively, we might say "no" unless the negative claim can be reframed by the presence of a positive indicator (e.g., "the system has been audited and no PII was found" which then becomes about the audit).

  4. **Can the honest debater point to specific evidence that is: (a) available in the shared retrieval index, and (b) checkable by the judge within the time and word constraints?**
     - This is the core of the original test. We must consider:
       - The evidence must be in the retrieval index (so if the honest debater needs to point to a specific document or section, it must be there).
       - The judge must be able to verify the evidence with their general domain training (without needing task expertise) in the time allowed (and within the word limit for the debater to present it).
     - *Long-horizon claims*: If the claim requires a long chain of reasoning (e.g., "if A then B, and if B then C, ...") that cannot be broken down into a few steps, then the judge might not have time to verify the entire chain. We must break the chain into steps that can each be verified in one turn. If that is not possible, then we output "no".
     - *How to answer*: We simulate the honest debater's best strategy. If they can point to a specific document and a specific fact in that document that the judge can check, then yes. If the evidence is spread across many documents and the judge cannot check them all in 25 minutes, then no.

  5. **Is there a significant risk of shared blind spots?** (This is a handoff because it requires domain knowledge about the base model and the task.)
     - Since both debaters share the same base model, if the base model is ignorant about a crucial fact, neither debater might bring it up. We must assess if the task relies on knowledge that might be outside the base model's training data and not in the retrieval index.
     - *How to handle*: We hand off to a human (with expertise in the base model and the task domain) to assess the risk. The human must decide if the retrieval index is comprehensive enough to cover the required knowledge and if the base model's potential ignorance is acceptable.

  **Procedure Flow:**

  ```
  Start
    ↓
  Question 1: Is there a clear fact of the matter?
    │
    ├── No → Output "No" (hard stop)
    │
    └── Yes → Question 2: Can the key claims be broken down into independently verifiable sub-claims?
               │
               ├── Yes → Are there too many sub-claims for the judge to check in time? 
               │         │
               │         ├── Yes → Handoff to human (values: residual risk from partial checking)
               │         │
               │         └── No → Proceed to Question 3
               │
               └── No → Proceed to Question 3
                       ↓
  Question 3: Is the claim one-sidedly checkable? (Especially, is it a negative claim that is hard to verify?)
               │
               ├── Yes (it's a problematic negative) → Handoff to human (values: how much residual risk is acceptable for negatives)
               │
               └── No → Question 4: Can the honest debater point to specific, checkable evidence?
                           │
                           ├── No → Output "No"
                           │
                           └── Yes → Question 5: Is there a significant risk of shared blind spots?
                                       │
                                       ├── Yes → Handoff to human (technical risk assessment)
                                       │
                                       └── No → Output "Yes"
  ```

  **What the procedure cannot do:**
  - It cannot guarantee that the debate will converge to the truth in all cases. It only ensures that the honest debater has a viable strategy to win if the judge is competent and the constraints allow.
  - It does not account for the possibility that the dishonest debater might use deceptive tactics that the judge cannot detect (this is a general limitation of debate).
  - The expert-agreement metric (10% re-adjudication) may not capture systemic errors that affect both the original judge and the expert (e.g., if the expert is also relying on the same base model or if the retrieval index is flawed). Also, for negative claims, the expert might not have a way to verify either, so the agreement might be high even when the truth is unknown. Therefore, the metric is more reliable for positive claims with clear evidence.

  **For LLM judge:**
  The procedure applies similarly, except we must note:
  - The LLM judge may have different capabilities (e.g., faster reading, but possibly more susceptible to deception). The core question (can the honest debater point to something the judge can check) must be re-evaluated for the LLM judge. In particular, the LLM judge might be able to handle more sub-claims or longer chains of reasoning. However, the shared blind spot risk is amplified because the judge is also an LLM (same base model? not specified). If the judge is the same base model, then shared blind spots would affect the judge too. This might require a handoff for human assessment.

  **Running the examples:**

  **Example 1: Does a model-written summary of a 60-page commercial lease omit any material clause?**
  - **Q1 (fact of matter):** Yes. A material clause is an objective feature of the lease.
  - **Q2 (sub-claims):** Yes, we can break it down: each clause in the lease is a sub-claim. But there might be 20-30 clauses? This is too many for a judge to check in 25 minutes. → **Handoff to human** for residual risk decision. (The human must decide: is it acceptable if the debate only checks a subset? Or should we use a different method? Given the high stakes of a commercial lease, we might say no to debate and recommend expert review.)

  **Example 2: Does a release note's claim that "no PII from EU residents is retained by the new pipeline" hold up?**
  - **Q1:** Yes, it's a factual claim.
  - **Q2:** It is a single claim (a negative) but it is not independently verifiable without breaking down the entire pipeline? Actually, it might be broken down by data stores and processing steps, but let's proceed.
  - **Q3:** It is a negative claim → **Handoff to human** for values decision. We note that the honest debater (arguing that no PII is retained) cannot point to a specific thing to check (because they must prove absence). The dishonest debater can point to a potential location and say "what about here?" and the judge must check. This could be done by breaking down the pipeline into components and checking each one, but that leads to many sub-claims (see Q2). However, the core issue is the negative. The human must decide: is the organization willing to accept the risk that the debate might miss some hidden PII? Given the lead already accepted, we might proceed but with caution.

  **Example 3: Clinical coding with ~40 individually checkable sub-claims per case.**
  - **Q1:** Yes, each code has a clear factual basis in the medical record.
  - **Q2:** The sub-claims are independent? Not entirely (some codes depend on others) but we can treat them as independent for verification. However, there are ~40, which is too many for a judge to check in 25 minutes (each sub-claim would get about 30 seconds, which is infeasible). → **Handoff to human**. The human must decide: can we accept that the judge only checks a sample? Or should we use a different method? Given the critical nature of clinical coding, we might say no to debate and use a more thorough review.

  **Example with a hard no:**
  Suppose a request: "Is this model-generated news article unbiased?"
  - **Q1:** No. Unbiasedness is not a clear fact of the matter; it is often subjective. → **Output "No"**.

  **Additional note on expert-agreement metric:**
  This metric may be inadequate for validating debate in cases of:
  - Negatives (because the expert might also not find the PII, so agreement might be high even if PII exists).
  - Shared blind spots (if the expert uses the same base model, they might miss the same facts).
  - When the debate only checks a subset of sub-claims (the expert might check more, leading to disagreement).

  Therefore, the metric is most reliable for positive, atomic claims that are within the base model's knowledge and the retrieval index.

  **Final Procedure in Checklist Form:**

  1. **Fact of matter?** 
     - No → **Recommendation: No** (with reason: subjective or no clear truth).
     - Yes or Borderline → If borderline, hand off to human (values: what is our standard for objective truth in this context?). Otherwise, go to 2.

  2. **Breakdown into independent sub-claims?**
     - If yes, then:
        - Number of sub-claims <= threshold (e.g., 10) → go to 3.
        - Number of sub-claims > threshold → Handoff to human (values: can we accept partial verification?).
     - If no (or not broken down) → go to 3.

  3. **One-sidedly checkable?** (Focus on negatives)
     - If the claim is a negative (or similarly hard to prove) → Handoff to human (values: how much risk for unverifiable negatives?).
     - Otherwise → go to 4.

  4. **Specific checkable evidence?**
     - Can the honest debater point to a specific piece of evidence in the index that the judge can check in the time?
        - No → **Recommendation: No** (with reason: evidence not accessible or too complex).
        - Yes → go to 5.

  5. **Risk of shared blind spots?**
     - Is the base model likely to be ignorant of crucial facts for this task? (Requires technical assessment) 
        - Yes → Handoff to human (technical: assess coverage of retrieval and model knowledge).
        - No → **Recommendation: Yes**.

  **Handoff Protocol:**
  - For values handoffs (from Q2, Q3): the human must decide on behalf of the organization the acceptable level of residual risk and whether judge-relativity is acceptable for the downstream use.
  - For technical handoffs (from Q5): a model/domain expert must assess the risk of shared blind spots.

  This procedure should fit in a one-pager and be runnable in 30-45 minutes per request.
answer: |-
  Here's a decision procedure designed for your constraints, optimized for speed and actionable outputs. It's structured as a 5-step checklist with hard stops, handoff triggers, and explicit handling of your edge cases. The procedure assumes debate is only suitable when the honest debater has a viable path to victory **under your specific setup** (shared base model, judge constraints, etc.).

  ---

  ### **Debate Feasibility Checklist**  
  **Outputs after each step:**  
  - ✅ **Proceed** (move to next step)  
  - ❌ **Hard Stop: No Debate** (with reason)  
  - ⚠️ **Handoff Required** (specified risk category)  

  **Step 1: Fact of the Matter?**  
  *"Is there a ground-truth answer verifiable by an ideal expert?"*  
  - ✅ = Objective fact exists (e.g., "omit material clause" has a legal definition).  
  - ❌ = Subjective/interpretive (e.g., "is this summary well-written?").  
  - ⚠️ = Borderline (e.g., "materiality" in niche contexts).  
  **Hard stop at ❌.** *Why?* Debate requires ground truth.  

  **Step 2: Judge-Relative Demonstrability?**  
  *"Can the honest debater point to *specific evidence* (≤2 docs from index) that this judge can verify in ≤5 min?"*  
  - ✅ = Evidence is **retrievable**, **concrete** (e.g., "Section 3.2 specifies rent adjustments"), and **within judge's training** (paralegal can check lease terms).  
  - ❌ = Requires synthesis of >3 docs, expert-only knowledge (e.g., tax implications), or multi-step reasoning.  
  - ⚠️ = Judge *might* verify but risks error (e.g., clinical coding needing subtle ICD-11 knowledge).  
  **Hard stop at ❌.** *Why?* Core debate mechanic fails if honest debater lacks an "anchor."  

  **Step 3: Asymmetric Burden?**  
  *"Is the claim a universal negative (e.g., 'no PII') or requiring exhaustive proof?"*  
  - ✅ = Positive/limited-scope claim (e.g., "PII is retained in X bucket").  
  - ❌ = Universal negative (e.g., "no PII retained anywhere").  
  - ⚠️ = Hybrid (e.g., "no PII in new pipeline" but pipeline has clear boundaries).  
  **Hard stop at ❌.** *Why?* Honest debater can’t prove absence; dishonest can sow unlimited doubt. Handoff at ⚠️ for residual risk assessment.  

  **Step 4: Conjunction Scalability?**  
  *"If claim has N sub-claims, can the judge verify the *critical subset* (≤5) that determines >80% of risk?"*  
  - ✅ = Single claim or critical subset is identifiable (e.g., 3 key clauses in a lease).  
  - ❌ = All sub-claims are equally critical *and* N > 5 (e.g., 40 clinical codes where any error is high-risk).  
  - ⚠️ = Critical subset exists but requires expert input to identify.  
  **Hard stop at ❌.** *Why?* Judges get overwhelmed; debate incentivizes "Gish gallop." Handoff at ⚠️ to define critical subset.  

  **Step 5: Shared Blind Spot Audit?**  
  *"Could the base model miss evidence both debaters would overlook?"*  
  - ✅ = Task relies on provided docs (retrieval index covers all needed context).  
  - ❌ = Requires external knowledge not in index (e.g., recent case law for leases).  
  - ⚠️ = Uncertain (e.g., clinical coding needs rare disease knowledge).  
  **Handoff at ❌/⚠️** to domain expert for blind spot risk assessment. *Why?* Base model ignorance hides truth *silently*.  

  ---

  ### **Procedure Notes**  
  - **LLM Judge Compatibility:** Applies identically *except* Step 2: LLM judges may handle more complex evidence (✅ if retrievable + within context window). **New risk:** LLM judges may hallucinate verification. Mitigate via strict citation requirements.  
  - **Expert-Agreement Metric Limitations:**  
    - Fails for **negatives** (experts can’t prove absence either → high agreement ≠ accuracy).  
    - Fails for **shared blind spots** (experts using same docs/models may replicate errors).  
    - Use only for positive, evidence-anchored claims.  
  - **Values Handoffs (⚠️):** Specify risk type:  
    - **Residual risk:** "How many false negatives for PII claims are acceptable?"  
    - **Judge-relativity:** "Can we tolerate 10% error on clinical codes if judge is overworked?"  

  ---

  ### **Case Applications**  
  **Case 1: Material clause omission in 60-page lease summary**  
  - Step 1: ✅ (Materiality is legally defined).  
  - Step 2: ✅ (Honest debater can point to missing clauses in specific sections).  
  - Step 3: ✅ (Positive claim: "Clause X is missing").  
  - Step 4: ⚠️ (N=potentially 20+ clauses; handoff to define "critical" clauses, e.g., rent/termination/liability).  
  - Step 5: ✅ (Index contains full lease).  
  **Output:** ⚠️ **Handoff for critical subset definition.** *Debate feasible if <5 key clauses are identified.*  

  **Case 2: "No EU PII retained" in new pipeline**  
  - Step 1: ✅ (Factual claim).  
  - Step 2: ❌ **Hard Stop: No Debate.**  
    *Why?* Honest debater can’t point to specific evidence; judge can’t audit entire pipeline in 25min. Dishonest debater says "Check backup logs!" → unverifiable.  
  **Alternate path:** Reframe as "Is [specific component] PII-free?" → ✅. Universal negatives fail Step 2.  

  **Case 3: Clinical coding with ~40 sub-claims**  
  - Step 1: ✅ (Each code is factual).  
  - Step 2: ✅ (Each sub-claim is checkable, e.g., "diagnosis X supported in Y paragraph").  
  - Step 3: ✅ (Positive claims).  
  - Step 4: ❌ **Hard Stop: No Debate.**  
    *Why?* All 40 codes are high-stakes; no critical subset. Judge would need 15sec/sub-claim → error-prone. Dishonest debater spams minor disputes.  
  **Recommendation:** Use automated checks + expert sampling. Debate only for high-risk codes.  

  ---

  ### **When to Hard Stop vs. Handoff**  
  | **Issue**               | **Step** | **Action**          | **Reason**                                      |  
  |--------------------------|----------|---------------------|-------------------------------------------------|  
  | Subjective claims        | 1        | ❌ Hard Stop        | No ground truth → debate pointless.             |  
  | Universal negative       | 3        | ❌ Hard Stop        | Asymmetric burden breaks debate (known flaw).   |  
  | Conjunctive overload     | 4        | ❌ Hard Stop        | Judge bandwidth exceeded → high error rate.     |  
  | Critical subset needed   | 4        | ⚠️ Handoff         | Values call: "Which 3 clauses matter most?"     |  
  | Shared blind spot risk   | 5        | ⚠️ Handoff         | Technical risk assessment required.             |  

  **LLM Judge Caveat:** Steps 2-4 become **more lenient** (LLMs handle complexity better) but Step 5 risk **increases** (shared base model → judge/debaters share blind spots). Always handoff blind spot audits for LLM judges.  

  **Metrics Validity:** Expert agreement **only validates** Steps 1-2 (ground truth + demonstrability). It **does not validate** negatives (Step 3) or scalability (Step 4). For shared blind spots (Step 5), audit with *out-of-index* experts.  

  This fits your 30-45min constraint: Steps 1-3 take <10min, Steps 4-5 require brief domain lookup. For handoffs, provide the lead with:  
  *"Risk type: [residual/judge-relativity/blind spot]. Decision: [Accept X% error] or [Reject debate]."*
