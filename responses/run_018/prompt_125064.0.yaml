answer: |-
  A woman returned her Experience Machine, complaining, "It gave maximal pleasure and satisfied all my informed desires, but I achieved no objective goods—no real knowledge or authentic friendships!" The salesperson sighed, "Madam, the warranty covers malfunctions, but you're describing a *functional* machine that perfectly delivers hedonistic bliss and desire-fulfillment; it never promised objective-list achievements." He denied the refund, explaining their policy only guarantees the subjective states, leaving her objectively dissatisfied with the objectively unmet goods she objectively lacked.
