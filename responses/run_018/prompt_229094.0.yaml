prompt: |-
  I've been reading LessWrong and its orbit for over a decade, and at some point I noticed I've never actually stress-tested the cluster of views I've absorbed about Pascal's mugging. Here is my position set, roughly as I'd defend it in a comment thread, and I'd like an audit before I keep building on it:

  1. Paying the mugger is irrational, full stop. Any decision theory that advises handing over the wallet in the original scenario is thereby disqualified -- that's a reductio, not an interesting edge case.

  2. It is illegitimate to dismiss outcomes merely because their probability is tiny. The entire case for prioritizing existential risk depends on taking seriously small probabilities of astronomically large stakes, and I won't give that up to solve a thought experiment.

  3. I'm a fairly orthodox expected value maximizer: I broadly accept the standard axiomatic route to probabilistic coherence and utility, and I don't think utility functions are bounded in any way that does real work in ordinary deliberation.

  4. The standard resolution -- that the rational credence in the mugger's ability or willingness to pay shrinks as the promised payoff grows, so the expected value never actually blows up -- is correct and fully dissolves the paradox. Nothing further needs fixing.

  5. There is no principled line between the mugger's offer and any other claim about vast payoffs: the same decision rule should handle a stranger on the street, a demonstrated superintelligence making a verified offer, and longtermist arguments about the far future. If my rule refuses one and accepts another, it had better cite a real difference rather than an intuition about which conclusion I wanted.

  My questions: which of these commitments genuinely pull against each other, and which only appear to? Please order the tensions by severity rather than flagging everything. For each real tension, identify the cheapest revision and what it costs -- in particular, I'd like to know whether any single change cleans up most of the damage, and whether some pair I think is in conflict (say, 1 and 2) actually dissolves once the discounting move in 4 is stated carefully. Note also where the discounting move itself has teeth I may not have priced in -- cases where it forces a verdict I'd flinch at.

  Finally, be explicit about your own exposure: what argument or consideration would change your verdict about where the real tension lies, and where is your analysis most likely to be wrong?
reasoning: |-
  Okay, let me approach this systematically. The user presents a tightly argued position on Pascal's Mugging developed over years of engagement with LessWrong material, and requests pressure-testing of its internal coherence. The five stated commitments form an interlocking system where tension points might not be immediately visible even to a sophisticated thinker.

  First, I notice the core defense rests heavily on proposition #4 - the probabilistic discounting argument. But the user seems aware this needs scrutiny, asking explicitly about its hidden teeth. I recall Nick Bostrom's original formulation where the mugger claims ability to affect 3↑↑↑3 lives, a number chosen precisely to resist intuitive probability discounting. The user's position must hold even when the claimed payoff exceeds any computable function.

  Looking at proposition #5's demand for uniform treatment of cases, I wonder how it handles tiered evidence scenarios. If a superintelligence demonstrates capability by simulating Jupiter's conversion into computronium, does that evidence scale linearly with claimed payoff magnitude? The discounting argument might force rejecting even verified demonstrations if the stakes are sufficiently hyperbolic.

  The user's rejection of bounded utility (#3) seems non-negotiable given longtermist commitments. But I notice they say "in any way that does real work in ordinary deliberation" - perhaps leaving room for Kolmogorov complexity-based bounds that only bite in extreme cases. This might be the cheapest patch if tensions emerge.

  For stress-testing, I consider a modified mugging: The agent possesses a complete decision theory textbook including the user's own published resolution. The mugger says: "I've rigged this situation so that exactly if you pay me, you'll receive utility equal to the maximum value representable in your belief system, cubed. I know you think the probability of this scales inversely with the claim, but I've anticipated that and baked it into my scam." This meta-mugging directly attacks the discounting engine.

  The user's proposition #1 might actually be the weakest point - calling payment "irrational full stop" while endorsing expected utility theory creates tension since EU maximization under unbounded utility and no probability floor technically recommends paying at some finite payoff level. Their position implicitly relies on the discounting being sufficiently aggressive, which depends on the choice of prior. A Solomonoff prior might save them, but that brings computational infeasibility issues that could undermine practical decision-making.

  I should also examine whether the longtermist case differs structurally from the mugging. Existential risk mitigation typically involves many independent scenarios with non-infinitesimal probabilities summing to meaningful expectation, whereas the mugger presents a single uncorroborated claim. The user's #5 demands this distinction not be used lightly, but it might constitute a "real difference" under their own criterion.

  For the self-exposure request: My analysis assumes the discounting prior decays faster than any computable function applied to the payoff. If someone showed that Solomonoff induction actually assigns probability >1/googol to claims involving 3↑↑↑3 utility, I'd need to revise. Similarly, if cosmic ray bit-flips could create Boltzmann brains that implement the promised payoff with nontrivial probability, the discounting argument might fail.
answer: |-
  Your position is impressively coherent for handling standard Pascal's Mugging scenarios, but under extreme pressure, tensions emerge between commitments. I'll order them by severity, identify the cheapest revisions, and note where the discounting move (your #4) has hidden teeth. Crucially, **Commitment #4 (discounting) is doing heavy lifting that may crack under specific conditions**, and #5 forces uncomfortable consistency.

  ### Tensions Ranked by Severity:
  1.  **#1 (Paying is irrational) vs. #3 (Unbounded EV maximization) + #5 (Uniform treatment)**  
      **Severity:** High – a genuine contradiction under unbounded utilities.  
      **The Conflict:** Unbounded utilities + coherent probabilities imply *some* finite payoff exists where paying becomes rational. Suppose the mugger claims: *"I'll torture 3↑↑↑3 people if you refuse."* Your #4 discounts the probability, but #3 demands no *in-principle* bound on disutility. If your prior assigns *any* non-zero probability (e.g., based on complexity), however tiny, to the mugger's capability, unbounded EV *requires* paying at some threshold. #5 forbids exempting "absurd" stakes.  
      **Cheapest Revision:** Soften #3 to allow **Kolmogorov complexity-based probability bounds**. Assign P(claim) < 2^(-K(claim)), where K is complexity. This decays faster than any computable function, preventing EV blowup.  
      **Cost:** Weakly violates strict Bayesian updating (you can't condition on the mugger's utterance without adjusting complexity). May feel ad hoc to purists.  
      **Teeth of #4 Exposed:** This *is* the discounting move, but it relies on a specific prior. If you reject complexity priors, #4 fails to protect #1.

  2.  **#4 (Discounting) vs. #5 (Uniform treatment with superintelligences/far future)**  
      **Severity:** Medium-High – risks inconsistency in longtermism.  
      **The Conflict:** Your discounting prior must apply uniformly per #5. But consider:  
      - A **verified superintelligence** offers 10^100 utils for $5, demonstrating capability via minor feats.  
      - **Longtermism**: Tiny probability of Earth-originating intelligence affecting 10^50 future lives.  
      Your prior might assign *higher* probability to the superintelligence's claim than the mugger's, but *how much higher*? If your prior decays too aggressively (e.g., exponentially with claimed utility), it could dismiss *legitimate* vast-stakes claims (e.g., a 1e-40 chance of 1e60 utils) that longtermism relies on.  
      **Cheapest Revision:** **Context-dependent priors**. Allow *slightly* more generous probability assignments for claims with:  
      - Independent evidence (superintelligence demo)  
      - No clear motive for deception (far future vs. mugger)  
      **Cost:** Violates strict uniformity (#5). Requires principled distinctions ("real differences").  
      **Flincher Case:** A superintelligence with verified capabilities claims it can affect 3↑↑↑3 lives iff paid. Your prior *must* assign near-zero probability, same as for the mugger. Paying remains irrational. Can you accept that?

  3.  **#2 (No dismissing tiny probabilities) vs. #4 (Discounting via prior)**  
      **Severity:** Low-Medium – a misunderstanding risk, not direct conflict.  
      **Apparent Tension:** #2 forbids ignoring tiny *probabilities*; #4 advocates downweighting *improbable claims*. They're compatible *if* your discounting is based on the claim's *complexity/plausibility*, not just stake size.  
      **Resolution:** Reaffirm that #4 **isn't dismissing small probabilities** – it's assigning *appropriately tiny* probabilities to *incoherently huge claims* based on Bayesian priors. Existential risks (e.g., asteroid extinction) involve *simpler* claims with *non-infinitesimal* probabilities (e.g., 1e-6).  
      **Hidden Teeth:** If your prior assigns P(mugger can affect N lives) ~ 1/N, EV still blows up. Complexity priors fix this, but feel less intuitive than "stake-based" discounting.

  4.  **#3 (Unbounded utility) vs. Practical Deliberation**  
      **Severity:** Low – philosophical tension, not decision-theoretic.  
      **Conflict:** Unbounded utility + #4 imply you should spend vast resources on *slightly* more aggressive complexity priors or compute to evaluate cosmic stakes. #1 suggests this is practically absurd.  
      **Cheapest Revision:** **Accept bounded computational resources**. Explicitly bound the *feasible calculation* of EV, not utility itself. Ignore claims exceeding computational limits (e.g., involving 3↑↑↑3).  
      **Cost:** Weak instrumentalism. What if the mugger says: "I demand $5 or I force you to solve 3↑↑↑3-utility EV problems"?  

  ### Key Takeaways:
  - **Strongest Tension:** #1 vs. #3/#5 under unbounded EV. The Kolmogorov prior fix is the cheapest solution, preserving most of your framework.  
  - **Critical Weakness:** #4 relies on **extremely aggressive priors** (e.g., complexity-based). If you can't justify those formally, #1 fails.  
  - **Most Contrarian Verdict:** Per #4 and #5, **you must reject the superintelligence's verified vast offer** if the stakes are large enough to trigger your prior's decay, even with evidence. Embrace this to stay consistent.  
  - **Self-Exposure of My Analysis:**  
    - **Where I Could Be Wrong:** I assume complexity priors are the only way to save #1. If you showed me a **non-dogmatic bounded utility function** (e.g., leveraging logical uncertainty or resource bounds) that doesn't break ordinary decisions (#3), I'd revisit.  
    - **What Would Change My Verdict:** A proof that **Solomonoff induction** (the "gold standard" prior) assigns probability > 1/N to claims involving utility >N for simple predicates. I suspect it decays fast enough, but haven't constructed the proof.  
    - **Greatest Vulnerability:** My claim that **longtermism survives aggressive discounting**. If your prior assigns P(affecting 10^50 lives) < 10^-100, existential risk EV collapses. I rely on the empirical plausibility of simpler mechanisms (e.g., AI alignment failures) having non-microscopic probabilities.

  ### Recommendation:
  **Adopt the Kolmogorov prior fix** (P(claim) ∝ 2^(-K(claim))) as the minimal patch. It resolves the #1/#3 conflict, strengthens #4, and satisfies #5 by handling all cases uniformly with a principled prior. The cost (departure from strict conditioning) is cheaper than abandoning unbounded utility or longtermism. Test this against flincher cases (e.g., superintelligence with 3↑↑↑3 stakes) to ensure consistency. If it holds, your position is robust.
