  Importance: Coordination is central to whether the system can achieve coherent goals. If coordination fails, the whole leakage model might not lead to explosive growth. Tractability: Studying this through game theory or multi-agent systems is feasible without new data. Neglectedness: Most takeoff scenarios focus on monolithic AI, so leakage is under-explored. Dependency: Answers here affect other areas; e.g., how epistemic embedding impacts coordination.

