prompt: |-
  You are an interdisciplinary philosopher of science with formal training in logic and molecular biology. Before writing, take a moment to brainstorm: list the criteria that distinguish a genuine formal isomorphism from a loose heuristic analogy, and identify the specific point at which a biological replication mechanism could fail to instantiate Gödel numbering even while resembling it structurally.

  Write a four-month fellowship proposal (approximately 1,200 words) on typogenetics and self-replication, specifically the DNA–Gödel isomorphism. The central question: the typogenetic framework treats DNA replication and translation as structurally analogous to Gödel numbering and its decoding function, but existing treatments in both philosophy of biology and formal logic treat this almost exclusively as metaphor. Can the analogy be reconstructed as a rigorous formal mapping—specifically, can the genetic reading frame be modeled as an analog of the β-function, and can replication errors be classified not merely as noise but by whether they correspond to syntactic inconsistency, semantic ambiguity, or meta-level reference failure?

  Your proposal must develop one non-standard conceptual pivot: investigate whether reverse transcription and epigenetic methylation patterns constitute a second-order encoding layer that does not alter the primary sequence but modifies the decoding rules themselves—analogous to a formal system capable of altering its own Gödel numbering scheme. Present this not as established science, but as the niche, original extension that makes the project tractable.

  Include: (1) a sharply stated research question with a determinate yes/no/ambiguous answer; (2) why current positions leave it open; (3) a month-by-month method combining formal modeling with close analysis of specific replication mechanisms; (4) what positive, negative, and null results would each look like; (5) an honest scope assessment—why four months suffices for conceptual framing but not empirical validation, and what risks could kill the project; and (6) the precise deliverable that would result.

  Do not include a bibliography, citation-based literature review, or reading list; refer to arguments and positions in your own terms, noting that citations will be added separately. Think carefully about failure conditions: if the formal mapping collapses into mere resemblance, state that explicitly and explain why such a failure is still philosophically informative.
