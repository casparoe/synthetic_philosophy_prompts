answer: |-
  ### Translation of Lewisian Convention to MARL Vocabulary  
  *(Confidence ratings: ★★★ = high, ★★☆ = moderate, ★☆☆ = low)*  

  ---

  #### **1. Coordination Problem Setup**  
  - **Lewis**: A recurrent situation where agents have complementary interests, with payoffs dependent on mutual alignment of actions.  
  - **MARL Translation**: A **repeated symmetric game** with multiple **Pareto-efficient Nash/Correlated Equilibria** in the joint policy space. Agents receive higher rewards when their policies align on *any* equilibrium than when they miscoordinate.  
  - **Grade**: **Clean** (★★★).  
  - *Rationale*: The game-theoretic framing of coordination problems maps directly to MARL’s matrix/sequential games with symmetric payoffs (e.g., Battle of the Sexes).  

  ---

  #### **2. Arbitrary Alternative Equilibria**  
  - **Lewis**: At least two distinct regularities could solve the problem, with no intrinsic superiority (arbitrariness).  
  - **MARL Translation**: **Multiple strict Nash equilibria** exist under the same payoff structure, with no equilibrium dominating others in all states (i.e., no *risk-dominant* or *payoff-dominant* equilibrium absent context).  
  - **Grade**: **Distorted** (★★☆).  
  - *Distortion*: Lewis’s "arbitrariness" implies indifference *to the agents*, not just mathematical equivalence. MARL often assumes agents can computationally distinguish equilibria via state features (e.g., embeddings), erasing true indifference. Lewis’s arbitrariness is phenomenological; MARL’s is structural.  

  ---

  #### **3. Salience & Precedent as Selection Mechanisms**  
  - **Lewis**: Psychological/cultural cues (salience) or historical accident (precedent) break symmetry between equilibria.  
  - **MARL Translation**: **Equilibrium selection via inductive biases** (e.g., architectural priors) or **learning dynamics** (e.g., low-entropy exploration, curriculum design). Precedent maps to **persistent joint policies** reinforced by *path-dependent convergence* (e.g., early exploration biasing later policies). Salience maps to **environmental features** amplified by attention mechanisms or **centralised critics** (e.g., DTCC highlighting salient states).  
  - **Grade**: **Clean** (★★★) for precedent; **Distorted** (★☆☆) for salience.  
  - *Distortion*: Lewisian salience is *intersubjective* (e.g., a red button "standing out" to humans). MARL salience is *objective* (e.g., high gradient norms). The former requires shared perceptual frameworks not modelled in standard MARL.  

  ---

  #### **4. Higher-Order Expectations**  
  - **Lewis**: Convention requires mutual belief hierarchies: "I expect you to do X, you expect me to expect it, etc." ≈ **common knowledge of rationality**.  
  - **MARL Translation**: **Belief hierarchies truncated to depth *k*** (e.g., via **recursive reasoning** in policy networks) or **implicit mutual modelling** (e.g., Q-learning other agents’ policies). **Decentralised training with centralised critics (DTCC)** approximates this by globalising value estimates but localising execution.  
  - **Grade**: **Distorted** (★★☆).  
  - *Distortion*: Lewis’s infinite regress of beliefs is replaced by *bounded-depth inference* or *emergent consensus* from learning dynamics (e.g., policy convergence without explicit belief representations).  

  ---

  ### Case-Based Tests  
  **Case 1: Signalling Conventions without Deep Beliefs**  
  - Your agents converge to signalling via **correlated equilibria** enforced by **learning dynamics** (e.g., policy gradient updates), not explicit belief hierarchies.  
  - **Lewis’s Framework**:  
    - **Higher-order expectations have a counterpart**: Bounded-depth beliefs (e.g., Level-*k* thinking) suffice if *k* ≥ 2. MARL’s policy convergence under DTCC implies **approximate mutual expectations** (e.g., "I expect you to signal X because your policy has done so 95% of times").  
    - **Does it break?**: No—Lewis *permits* approximation. His conditions are *idealised*; your system satisfies a **weakened version** where expectations are **frequentist** (learned from history) not epistemic.  
  - **Verdict**: Lewis’s account weakens but doesn’t break (★★★).  

  **Case 2: Lock-In After Environmental Shifts**  
  - Your observation: Agents stick to suboptimal conventions despite better equilibria becoming available.  
  - **Lewis’s Framework**:  
    - **Predicts or permits?**: **Explicitly predicts** (via *precedent*). Lewis calls conventions "self-perpetuating" due to **inertia of mutual expectations**. Shifting requires *re-coordination*, which fails if agents lack salience for the new optimum.  
    - **MARL Mechanism**: **Low exploration rates** or **entropy penalties** prevent deviation from entrenched policies. Correlates with *reward hysteresis* in evolutionary game theory.  
  - **Verdict**: Lewis predicts this (★★★).  

  ---

  ### Residue Report: What MARL Misses  
  1. **Common Knowledge as Infinite Regress**  
     - *Gap*: Lewis requires *infinite* mutual belief hierarchies ("I know that you know that I know..."). MARL uses *finitely nested* beliefs or omits beliefs entirely (treating policies as black boxes).  
     - *Blind Spot or Overreach?*: **Genuine blind spot** (★★★). Common knowledge enables robust coordination under uncertainty (e.g., Schelling points). MARL cannot *prove* convergence stability without it (e.g., chaotic policies under adversarial perturbations). Needs **formal belief propagation** (e.g., dynamic epistemic logic).  

  2. **Arbitrariness as Cognitive Indifference**  
     - *Gap*: For Lewis, arbitrariness implies *no reason* to prefer one equilibrium—agents are truly indifferent. MARL agents always have *algorithmic biases* (e.g., neural initialisations favour certain policies).  
     - *Blind Spot or Overreach?*: **Lewis overreached** (★★☆). Human indifference is psychological; MARL reveals that "arbitrariness" is *observer-relative*. Your work shows conventions are *never* arbitrary to the *system* (only to the modeller).  

  3. **Salience as Cultural/Psychological Priming**  
     - *Gap*: Lewisian salience derives from human cognition (e.g., uniqueness, brightness). MARL salience is emergent from data (e.g., high-variance states).  
     - *Blind Spot or Overreach?*: **Blind spot** (★☆☆). Capturing human-like salience requires **grounded perceptual models** (e.g., vision transformers with innate priors). Current MARL cannot replicate "a red door being salient" without explicit environmental tagging.  

  ---

  ### Confidence & Least Sure Claim  
  - **Overall Confidence**: ★★☆ (Moderate). MARL formalises Lewis’s *mechanisms* but not his *phenomenology*.  
  - **Least Sure Claim**: That **higher-order expectations are cleanly approximable by DTCC** (★★☆).  
    - *Why?*: DTCC globalises value functions but not *beliefs*. Agents may converge without modelling others’ expectations (e.g., via selfish updates). Lewis’s mutual expectations imply *strategic awareness*—your signalling agents likely lack this. I suspect emergence here masks **correlation without cognition**, but I cannot prove it from your description.  

  ---  
  **Final Translation**: Lewisian conventions are **Nash equilibria selected by path-dependent learning dynamics, stabilised by low exploration rates, and approximately enforced by shallow belief hierarchies or centralised critics—but remain vulnerable to perceptual and epistemic gaps MARL does not formalise.** Use **entropy-driven exploration** and **iterated learning with population bottlenecks** to simulate inertia/arbitrariness in silico.
