answer: |-
  My dear opponent, you make a fair empirical observation about the rarity of pristine money-pump conditions in lived experience—quite right that the pump’s mechanical repetition is artificial. But you mistake the *diagnostic purpose* of the thought experiment. It isn’t a prediction about real-world exploitation; it’s a revelation of a *structural defect* in any diachronic agency that refuses to bind itself to plans. 

  Your sophisticated chooser, autonomously re-evaluating at each node, doesn’t evade the pump by altering preferences post-hoc—they merely *manifest* the incoherence that invites exploitation. That a single pumping might jolt one into ad hoc resolution doesn’t absolve the initial irrationality; it *confirms* the vulnerability. McClennen’s insight is that rationality isn’t atomised into myopic moments of choice but inhabits the extended project of self-governance. If you concede that experience *can* destabilise preferences—indeed, if you *rely* on this to break the pump—you implicitly admit the need for a prior commitment to stabilise your practical identity across those very perturbations. Resoluteness isn’t coercion; it’s the rational exercise of foresight to prevent your future self from capriciously undermining your present commitments. Sophistication, for all its temporal deference, surrenders to the very winds of change it ought to master.
