answer: |-
  **MINISTRY OF NON-AGGREGATIVE RESCUE**  
  **OPERATIONAL GUIDELINE NAGR/ETH/001 (Rev. 7)**  
  **RESOURCE ALLOCATION IN MULTI-PARTY RESCUE SCENARIOS**  

  **1. Scope and Definitions**  
  1.1 This guideline applies to all Ministry personnel engaged in rescue operations where finite resources permit intervention for some, but not all, individuals facing imminent, comparable peril ("Rescue Scenarios").  
  1.2 "Aggregation": The prohibited practice of assigning moral weight to a numerical sum of individuals, thereby generating a collective claim perceived as stronger than any individual claim within the group.  
  1.3 "Pairwise Consideration": The sole permissible method of evaluation, involving a direct, qualitative comparison between precisely two individuals to determine if a morally relevant difference exists justifying preference for one over the other.  
  1.4 "Comparable Peril": Imminent threat of death or severe, irreversible harm deemed equivalent in nature and severity for all involved parties. Differences in age, social utility, or potential future contribution are **not** valid grounds for pairwise preference (See Appendix A.2).  
  1.5 "Rescue Resource Unit (RRU)": The minimum indivisible resource package required to effect the rescue of one individual.  

  **2. The Pairwise Assessment Protocol (PAP)**  
  2.1 **Initial Isolation:** Rescue Command must isolate each individual as a distinct claimant. Formation of groups ("the five miners", "the three sailors") is strictly prohibited for evaluative purposes.  
  2.2 **Mandatory Waiver:** Prior to any assessment, Rescue Command must obtain a signed **Group-Size Disclosure Waiver (GSDW-7)** from all personnel involved in allocation decisions. This confirms understanding that knowledge of the total number of individuals at risk must not influence allocation (See Section 4).  
  2.3 **Iterative Comparison:**  
      2.3.1 Select any two individuals (A and B).  
      2.3.2 Assess *only* if a morally relevant difference exists *between A and B* justifying saving A over B, or B over A. Valid differences include:  
          * (a) A has a prior, unfulfilled claim on *this specific* RRU (e.g., pre-assigned lifeboat seat).  
          * (b) A faces marginally greater peril *relative only to B* (e.g., A's air supply depletes 2 minutes before B's).  
          * (c) Saving A demonstrably and directly causes B's otherwise avoidable death (rare; see NAGR/ETH/002).  
      2.3.3 If no valid pairwise difference exists between A and B, no preference is permissible.  
  2.4 **Non-Transitive Allocation Matrix (NTAM):**  
      2.4.1 Record the outcome of each pairwise comparison (A>B, B>A, or Tie) in the prescribed NTAM form (NAGR/FORM/08).  
      2.4.2 The NTAM does not generate a transitive ranking (e.g., A>B and B>C does *not* imply A>C). Each potential allocation pair must be compared anew if required.  
      2.4.3 The NTAM's sole function is to document pairwise equivalences and the absence of transitive justification for group preference.  

  **3. Prohibited Aggregative Methods**  
  3.1 The following practices constitute Aggregation and are categorically forbidden:  
      3.1.1 Headcount-Based Prioritisation: Selecting a group for rescue solely because it contains more individuals than another group or a singleton.  
      3.1.2 Utilitarian Calculus: Assigning value based on total lives saved, life-years preserved, or social benefit.  
      3.1.3 Probability Weighting: Preferring a larger group based on perceived higher statistical chance of containing individuals with "stronger" claims (e.g., younger individuals).  
      3.1.4 Intuitive Majoritarianism: Invoking phrases such as "the greater good," "saving the most," or "common sense dictates the larger group."  

  **4. Singleton Preference Clause (SPC)**  
  4.1 This clause operationalises the principle that no group inherently possesses a stronger claim than a single individual solely by virtue of size.  
  4.2 When one RRU is available, and claimants consist of one singleton (S) and one group of N individuals (G1, G2, ... Gn):  
      4.2.1 **Stage 1:** Compare S pairwise to *each* member of the group individually (S vs G1, S vs G2, ..., S vs Gn).  
      4.2.2 If S is preferred over *any* single member of the group based on a valid pairwise difference (Section 2.3.2), S receives the RRU.  
      4.2.3 If *no* valid pairwise difference exists between S and *any* member of the group (i.e., S is pairwise equivalent to G1, G2, ... Gn individually), proceed to Tie-Breaking (Section 5).  
      4.2.4 **Crucially:** The size of the group (N) is **irrelevant** to Stage 1 assessment. N=50 holds no more weight than N=1 at this stage.  

  **5. Tie-Breaking and Lottery Procedures**  
  5.1 A "Tie" exists when, after exhaustive pairwise comparisons using the PAP (including SPC Stage 1 where applicable), no valid pairwise difference establishes preference between any claimants eligible for the available RRU(s).  
  5.2 **Mandatory Lottery:**  
      5.2.1 In the event of a Tie, allocation must be determined by a fair lottery giving equal chance to each eligible individual claimant.  
      5.2.2 Group lotteries are prohibited. Each individual must have their own distinct lottery entry.  
      5.2.3 **Procedure:**  
          * (a) Assign a unique identifier to each tied individual.  
          * (b) Use a Ministry-approved randomising device (e.g., certified coin, shuffled sealed chits - see NAGR/PROC/LOT/01).  
          * (c) Select winners sequentially until RRUs are exhausted.  
  5.3 **Example:** One RRU available; one trapped individual (A) versus fifty trapped individuals (B1-B50), all in comparable peril, no valid pairwise differences found between A and any B. Outcome: Lottery with 51 entries (A, B1, B2, ..., B50). A has a 1/51 chance of rescue; each B has a 1/51 chance.  

  **6. Appeals**  
  6.1 Appeals may be lodged by affected parties or their designated proxies solely on the grounds of:  
      6.1.1 Procedural non-compliance with the PAP, SPC, or Lottery Procedures.  
      6.1.2 Introduction of new, materially relevant pairwise information not available during initial assessment.  
  6.2 Appeals based on the outcome itself (e.g., "it's absurd A was saved instead of the fifty") or alleging the moral irrelevance of the PAP are inadmissible.  
  6.3 The Appeals Panel (NAGR/ADJ/01) will review solely for adherence to protocol, *not* for perceived moral desirability of the outcome.  

  **APPENDIX A: FREQUENTLY ENCOUNTERED OBJECTIONS AND CLARIFICATIONS**  
  *A.1: "Why not save fifty miners instead of one, if the cost is identical?"*  
  *   Response: "Cost" pertains to resource expenditure, not moral justification. Absent a valid pairwise difference favouring the one miner over *at least one specific miner within the fifty*, or vice-versa, no preference exists. The number fifty provides no independent moral reason. Allocation defaults to lottery (Sec 5). The phrase "instead of the fifty" constitutes prohibited aggregation. Refer to SPC (Sec 4).  

  *A.2: "Should age, social value, or dependants influence the decision?"*  
  *   Response: No. These factors are irrelevant to the pairwise comparison of individuals facing comparable peril. To prefer A over B because A is younger, or a surgeon, or has children, is to introduce an external metric of value, violating the principle that each individual's claim against death in this specific scenario is equal absent a direct, scenario-specific pairwise difference (e.g., A's air expires first).  

  *A.3: "Doesn't the lottery make the protocol arbitrary and unjust?"*  
  *   Response: The lottery is not arbitrary; it is the mandatory, procedurally fair outcome mandated when reason (as defined by pairwise comparison) cannot discern a difference. It ensures strict equality of consideration when claims are pairwise equivalent. To override this with a numerical preference *would* be arbitrary and unjust, favouring an entity (the larger number) with no moral standing over the individual claimants.  

  *A.4: "Isn't this impractical in large-scale disasters?"*  
  *   Response: Practical constraints may limit the feasibility of exhaustive pairwise comparison for very large N. Protocol NAGR/ETH/003 ("Expedited PAP for N>100") authorises stratified random sampling of pairwise comparisons under strict audit conditions, preserving the non-aggregative principle while acknowledging logistical reality. The SPC and lottery remain binding.  

  ---
  **Reflective Note (149 words):**

  The parody takes two key liberties with Taurek's precise arguments. Firstly, while Taurek (*Ethics*, 1977) focused on saving identifiable groups *versus* another group or individual, the manual extends the "no aggregation" principle to all comparisons, implying a stronger individualism than Taurek might endorse in every context. Secondly, Taurek's lottery solution explicitly applied to ties *between individuals* competing for a single resource; applying it strictly to a singleton vs. a large group (where Taurek might intuit a stronger, albeit non-aggregative, reason to save the group *if* we have equal concern for each member) is an extrapolation. The satire presents his view as requiring strict, individualised pairwise comparisons *always*, leading to potentially extreme lotteries.

  The reasoning is most vulnerable in cases involving a single individual versus a vast group. If a convincing non-aggregative argument could be made that *each* member of the large group has a claim equal to the singleton's, *and* that this multiplicity *itself* (without summing) creates a stronger *procedural* or *claims-based* reason to save the group when resources allow saving either the group or the singleton (but not both), this would undermine the parody's insistence on mandatory lotteries in such cases and require revision.
