  I'm a machine-learning researcher fluent in Bayesian inference, model comparison, and regularization, but not in decision-theoretic paradoxes. Restate the two-envelope paradox — observing amount A in one envelope and reasoning that the other holds either 2A or A/2 with equal probability, hence an expected value of 5A/4 — and the principal responses to it (the demand for a well-defined prior over envelope values, symmetry-breaking once the distribution is known, rejection of the uniform conditional prior, and bounded-rationality resolutions) entirely in the vocabulary I use: parameter spaces, priors and posteriors, model evidence, exchangeability, scale-invariant distributions, regularization, and ill-specified model classes. For each response, indicate what translates cleanly, what must be distorted to fit, and what has no counterpart here — in particular, whether the objection that no proper prior exists over all positive reals corresponds to a genuine failure of Bayesian specification or to a routine feature of improper priors in ML practice. Conclude by saying whether the untranslatable residue points to a gap in decision theory about scale-invariant inference, or whether it shows that the paradox is merely an artifact of misapplying Bayesian reasoning to an undefined model class.
