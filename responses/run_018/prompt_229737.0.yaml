prompt: |-
  I've been reading about cause prioritization for years, mostly through rationalist and EA blogs, and I keep seeing the importance–tractability–neglectedness framework invoked at a slogan level. A friend recently gave me a fuller summary, and I want to know how much of it to trust. Her version went like this: "You score each cause on three dimensions. Importance is how many individuals are affected; tractability is how solvable the problem is; neglectedness is how few people are already working on it. You multiply the three scores and fund whichever cause comes out highest. That's the whole framework — a three-factor formula for where marginal resources do the most good."

  I'm inclined to accept most of this, but the multiplication talk bothers me. It makes the framework sound more precise than its advocates usually admit, and I can't tell whether tractability and neglectedness are genuinely independent factors or just two ways of saying "an extra unit of effort will go far." Could you separate the parts of her summary that a careful practitioner would endorse from the parts that are subtly wrong? And does the practical conclusion — fund the highest-scoring cause — survive once the sloppy parts are cleaned up?

  If I'm expecting more rigor from this framework than it is meant to provide, or if the whole comparison is somehow ill-posed, please say that directly instead of working politely around my framing.
reasoning: |-
  Okay, the user has been reading about cause prioritization through rationalist and EA blogs and is familiar with the ITN framework at a surface level. Their friend gave them a more detailed summary that involves scoring causes on three dimensions (Importance, Tractability, Neglectedness) and multiplying the scores to determine where to allocate resources. The user is skeptical about the multiplication part and whether tractability and neglectedness are truly independent. They want to know which parts of this summary are accurate and which are misleading, and whether the core conclusion still holds after refining the framework.

  First, I need to address their main concerns. The multiplication approach implies a level of precision that isn't realistic. Causes aren't easily quantifiable with exact numbers, and assigning scores might involve subjective judgments. Also, multiplying scores assumes that these factors interact multiplicatively, which might not always be the case. For example, if a cause has zero neglectedness (already well-funded), more resources might not help, but multiplication might not capture that threshold effect properly.

  The user also questions if tractability and neglectedness are independent. They suspect they might both relate to the marginal impact of additional resources. Tractability is about how solvable the problem is with current knowledge, while neglectedness measures how much work is already being done. However, these two can interact. For example, a problem might be tractable but if it's not neglected, adding more resources could have diminishing returns. So they aren't entirely independent; the marginal benefit depends on both factors.

  I should explain that careful practitioners use ITN as a heuristic, not a rigid formula. They might use scoring to compare causes qualitatively rather than quantitatively multiplying numbers. The framework helps structure thinking but shouldn't replace nuanced judgment. Factors like personal fit, coordination effects, and uncertainty are also crucial but not captured in ITN.

  The core idea of prioritizing causes that are important, tractable, and neglected still stands. The multiplication aspect is the sloppy part. Instead, practitioners might add scores or use a weighted approach, but even that has limitations. The practical conclusion to fund the highest-scoring cause survives if we treat the framework as a guideline rather than a strict formula.

  The user might be looking for validation of their skepticism and reassurance that the framework is still useful despite its limitations. They might also want to know how to apply ITN correctly without falling into the trap of false precision. Emphasizing that ITN is a starting point for discussion, not the end, would address their deeper need for practical application methods that account for real-world complexities.
answer: |-
  Your skepticism is well-placed. Your friend captured the *essence* of ITN, but the "multiply the scores" part is a significant oversimplification that careful practitioners **do not endorse** as a literal formula. Here's the breakdown:

  **What's Endorsed by Careful Practitioners:**

  1.  **The Three Core Dimensions:**
      *   **Importance (I):** The scale of the problem. Measured by the magnitude of suffering averted, lives saved, welfare gained, or existential risk reduced *if the problem were solved*. (Not *just* "number of individuals affected" – it's about the *badness* averted per individual and the duration).
      *   **Tractability (T):** How much progress can be made *per unit of resources applied*. How easy it is to move the needle. This includes technical feasibility, political feasibility, institutional barriers, and evidence for effective interventions.
      *   **Neglectedness (N):** How much additional funding/research/attention the cause area could productively absorb. Measured by the *marginal* impact of extra resources. A cause is neglected if few resources are currently devoted to it *relative to its scale and tractability*.

  2.  **The Foundational Insight:** The *expected value* of investing marginal resources is crucially dependent on **all three factors interacting**.
      *   A hugely important problem isn't a good investment if it's intractable (e.g., reversing time).
      *   A tractable problem isn't a good investment if it's unimportant (e.g., perfecting a trivial gadget).
      *   An important and tractable problem isn't the *best* investment if it's already saturated with resources (e.g., funding a well-funded, highly effective charity to the point of diminishing returns).
      *   **The Core Heuristic:** Prioritize causes that are **Important, Tractable, AND Neglected** because this combination suggests high *marginal impact per dollar/hour*.

  3.  **Comparative, Not Absolute:** ITN is primarily a tool for *comparing* cause areas qualitatively or semi-quantitatively, not generating an absolute "impact score."

  **What's Subtly Wrong or Overly Simplistic:**

  1.  **Multiplication as a Literal Formula:**
      *   **False Precision:** Assigning numerical scores (e.g., I=8, T=6, N=7) and multiplying (336) implies a level of precision and commensurability that doesn't exist. How do you meaningfully quantify "importance" in the same units as "tractability" to multiply them? It's often apples and oranges.
      *   **Interaction Assumption:** Multiplication assumes a specific, multiplicative interaction (Impact ∝ I * T * N). While this *can* be a useful approximation, it's not necessarily true. The relationship could be more complex (e.g., thresholds, diminishing returns, synergistic effects).
      *   **Linearity Assumption:** It assumes that each dimension scales linearly (e.g., doubling tractability score = doubles impact), which is rarely the case. Tractability often has diminishing returns, neglectedness is inherently about marginal effects.

  2.  **"Tractability" and "Neglectedness" Aren't Fully Independent (You're Right!):**
      *   **Your Insight is Correct:** Both T and N are fundamentally about *how much marginal impact an extra unit of effort/resources will have*.
      *   **Tractability (T):** Addresses *how effectively resources can be converted into progress/solutions* (e.g., cost per life saved).
      *   **Neglectedness (N):** Addresses *how much the effectiveness of resources is diminished by existing efforts* (i.e., diminishing marginal returns). It answers "How much *more* impact can additional resources have given what's already there?"
      *   **The Overlap:** High neglectedness often *implies* high marginal tractability *at the current level of funding*. If a cause is highly neglected, adding the *first* resources is likely very impactful *because* it's tractable *enough* to utilize them well. If it were completely intractable, neglect wouldn't matter. Careful thinkers see them as deeply interconnected facets of *marginal effectiveness*.

  3.  **"Fund whichever cause comes out highest":**
      *   **Ignores Crucial Factors:** ITN is a starting point, not the whole story. Other vital considerations include:
          *   **Personal Fit/Expertise:** Can *you* or your organization actually contribute effectively?
          *   **Coordination/Information Value:** Does working on this cause generate valuable knowledge or coordination benefits for others?
          *   **Tail Risks & Uncertainty:** How robust is the analysis to deep uncertainty? Does the cause involve potential catastrophic or existential risks?
          *   **Differential Progress:** How likely is the problem to be solved *without* additional intervention? (Tied to neglectedness but broader).
          *   **Feasibility of Funding/Working:** Can the resources actually be deployed effectively?
      *   **Aggregation Problem:** How do you aggregate "importance" across diverse values (e.g., human vs. animal welfare, near-term vs. long-term)? ITN doesn't resolve this.

  **Does the Practical Conclusion Survive?**

  **Yes, but refined and contextualized.**

  *   **The Core Heuristic Endures:** The fundamental insight that high-impact opportunities lie at the intersection of scale, solvability, and under-investment is powerful and robust. Looking for causes strong on all three *dimensions* remains a highly valuable prioritization strategy.
  *   **"Fund the Highest-Scoring Cause" becomes "Prioritize Causes Strong in I, T, and N":** Instead of a pseudo-precise multiplication output, the conclusion is to use ITN as a structured framework for *identifying* and *comparing* causes based on these three key criteria. The cause scoring highest *across these three lenses, considered holistically and in conjunction with other factors*, is likely a strong candidate for marginal resources.
  *   **Marginal Impact is Key:** The refined conclusion is: **Direct marginal resources towards cause areas where the *expected marginal impact per unit resource* is highest.** ITN provides the primary lenses for estimating that marginal impact, even if not via a simple formula.
  *   **It's a Heuristic, Not an Algorithm:** Careful practitioners use ITN to guide reasoning, structure discussions, identify key questions, and make rough comparisons – not to spit out an unquestionable answer through multiplication.

  **In Summary:**

  *   **Endorse:** The three dimensions (I, T, N) and the insight that high marginal impact requires strength in all three.
  *   **Reject:** Literal multiplication of numerical scores as a precise formula. Reject treating T and N as completely independent (they both target marginal effectiveness).
  *   **Refine:** "Fund the highest-scoring cause" becomes "Prioritize causes that are strong across Importance, Tractability, and Neglectedness, using ITN as a comparative heuristic alongside other critical factors like personal fit, uncertainty, and coordination value."

  Your instinct that the multiplication talk grants false precision and that T & N overlap significantly in addressing marginal impact is correct. The core framework remains valuable as a thinking tool, not a calculator. The practical conclusion survives as a robust guiding principle, not a rigid formulaic output. ITN is best seen as a structured way to ask the right questions about a cause area's potential for high leverage, not a machine for generating the single right answer.
