prompt: |-
  I write about science and ideas for a general audience, and now I'm stuck running a 40-min workshop for philosophy grad students who aced probability but never did metaphysics. I want them to really get the Principal Principle — the part where you defer to objective chance — but especially the undermining-futures tension, not just memorise the slogan. Dont explain the concept to me; plan the teaching arc. What's the dependency chain: what idea must be solid before 'objective chance' can even appear (epistemic vs physical prob, but correct my ordering), and what comes immediately after so the deference step doesnt feel circular? Then pick the one carrying case — I'm leaning on a quantum-branching setup where an agent knows the Hamiltonian and wavefunction but has pure indexical uncertainty about which branch she's in. Tell me exactly what properties that scenario needs (no hidden variables, no smuggled priors?) and what it must lack to actually do philosophical work. Next, map the misconceptions they'll form in sequence: first 'chance is just ignorance', then 'the principle is circular against determinists', then the self-undermining worry. Say precisely where in the flow each one should be cut off. Also, what should I openly refuse to cover here and say so — probably the full derivation with history-space partitions? And design the closing check: one specific task or question that shows they've grasped the deference relation, not just parroted Lewis. No reading lists, please. End with a single line that starts 'Bottom line:' summarizing the core pedagogical move.
reasoning: |-
  Okay, the user is a science writer running a workshop for philosophy grad students who know probability but not metaphysics. They want to teach the Principal Principle with a focus on the undermining futures tension. I need to create a teaching arc that builds understanding step by step.

  First, I should start with the basics. These students know probability math but not metaphysical concepts. So I'll begin by distinguishing epistemic probability (beliefs based on ignorance) from physical probability (real-world tendencies). A coin flip example can show both: the 50/50 chance physically versus not knowing the outcome epistemically. This sets up the need for objective chance.

  Next, introduce objective chance as a physical feature of the world. Emphasize that it's not just about ignorance but a real property, like quantum mechanics probabilities. Then present the Principal Principle: how rational credence should align with known chances. Use a simple example like a biased die to illustrate deference without complications.

  Now for the undermining futures problem. I need a scenario where the chance setup itself could be undermined by future events. Quantum branching is perfect here. Describe a system with a known wavefunction branching into multiple outcomes. The agent knows the overall probabilities but is uncertain which branch they're in. This creates indexical uncertainty without hidden variables or smuggled priors.

  The key tension comes when considering future events that could make the initial wavefunction or chance assignment impossible. For example, if a future event affects the experimental setup, the original chance might not hold. This shows why the Principal Principle seems circular or self-undermining here.

  Students will likely misunderstand at several points. First, they might think chance is just ignorance. I'll cut this off early by showing quantum probabilities aren't about knowledge. Then, they might see the Principle as circular against determinism. Clarify that determinism isn't the issue; undermining is. Finally, address the self-undermining worry by stressing that chances are time-dependent and the Principle applies to current chances only.

  I'll avoid covering the full history-space partitions to keep focus. For assessment, have them work through a modified quantum branching scenario where they apply the Principal Principle and see where it gets tricky with undermining futures.

  Bottom line: Use quantum branching to create indexical uncertainty that makes objective chance deference vivid and raises undermining futures naturally through scenario design, not declaration.
answer: |-
  Here’s a focused teaching arc designed to make the Principal Principle’s tension visceral, using your quantum-branching case. Prioritize conceptual traction over formal rigor.

  **Core Teaching Arc & Dependencies:**
  1.  **Anchor: Epistemic Probability as Belief Scaffolding (5 min)**
      *   *Start with:* "You wake up in a white room. A coin is sealed in a box. What’s your credence it's heads?" → **0.5**. *Why?* Total ignorance → principle of indifference.
      *   *Key Point:* This is *epistemic* probability (credence). It quantifies *ignorance* about a *fixed* state. No physical facts guide it beyond your knowledge state.
      *   *Dependency Solidified:* They must see epistemic prob as *subjective, knowledge-relative*, and decoupled from how the world *actually is* physically structured.

  2.  **Introduce Physical Propensity: Objective Chance (10 min)**
      *   *Transition:* "Now imagine you *know* this is a *perfectly fair coin*, crafted by Laplace's Demon, governed by deterministic Newtonian physics. Flip it. *Before* it lands, what's your credence for heads?" → Still **0.5**. *Why?* Ignorance of initial conditions/microstate? *Yes, but...*
      *   *Pivot:* "Now imagine a *quantum coin*: a spin-½ particle prepared |↑z⟩. Measure Sz. What’s your credence for +ħ/2?" → **1.0**. "Prepared |→x⟩ = (|↑z⟩ + |↓z⟩)/√2. Measure Sz. Credence for +ħ/2?" → **0.5**.
      *   *Crucial Leap:* **Objective Chance isn't ignorance.** It's a *physical property* of the system's *state* (the wavefunction). The 0.5 is *in* the world (|→x⟩), regardless of your knowledge. *Contrast:* The deterministic coin's 0.5 *only* came from *your* ignorance. The quantum 0.5 is *inherent*.
      *   *Why this works:* QM cleanly separates objective state (wavefunction) from epistemic state (knowledge of outcome). No hidden variables assumed.

  3.  **The Deference Step: Principal Principle (PP) Stated (5 min)**
      *   *Formulate Simply:* "If you know the objective chance of E at time t is x, *and you have no inadmissible information about E*, then your credence in E should be x. Cr(E | ch_t(E)=x ∧ K) = x."
      *   *Illustrate with Qubit:* "You know the qubit is |→x⟩. You *know* ch(↑z) = 0.5. You have no other info (e.g., from the future). Therefore, Cr(↑z) *must* = 0.5. It’s a *rational constraint*, not a choice. You *defer* to the world's chancy structure."
      *   *Avoid Circularity Trap:* Stress **K excludes "inadmissible information"** – information about later outcomes that would "cheat" by revealing E true/false *before* chance does its work. (Don't define inadmissible fully yet; just flag it).

  4.  **Indexical Uncertainty & Branching: The Setup for Undermining (10 min)**
      *   *Your Case (Tweak for Clarity):* "An agent, Alice, knows: (1) The universal wavefunction Ψ(t0); (2) The Hamiltonian H; (3) At time t_exp, a specific measurement (Sz on a |→x⟩ qubit) occurs. (4) Schrödinger evolution yields branches: |Branch↑⟩ ⊗ |Alice↑⟩ and |Branch↓⟩ ⊗ |Alice↓⟩. (5) Alice *knows* she is post-measurement *in one branch* but doesn't know which."
      *   *Properties Needed:*
          *   **No Hidden Variables:** The fundamental description is just Ψ. Outcomes are truly chancy/indeterminate at t0.
          *   **Pure Indexical Uncertainty:** Alice's *only* uncertainty is "Which branch-am-I-in?". This uncertainty is *epistemic* (self-locating ignorance), but it's uncertainty *about an outcome fixed by objective chance*.
          *   **Known Chance:** Alice calculates ch_{t0}(Alice in ↑-branch) = |⟨↑z|→x⟩|² = 0.5 from Ψ(t0) & H.
          *   **No Smuggled Priors:** Her initial credence *before* knowing Ψ/H is irrelevant. PP tells her what Cr *must be* *given* her knowledge of ch.
      *   *Ask:* "What should Alice's credence be that she's in the ↑-branch?" → **0.5**. PP applies cleanly: She knows ch=0.5, only has admissible info (Ψ, H, indexical uncertainty), so Cr=0.5.

  5.  **Introducing the Undermining Future (5 min)**
      *   *Complicate the Case:* "Alice also knows: On *every* branch where Sz=↑ occurs, a team of zealous physicists later *destroys all evidence and equipment* that could *ever* prove the wavefunction was initially |→x⟩. They leave only evidence suggesting it was |↑z⟩ all along. On ↓-branches, this doesn't happen."
      *   *The Tension:* "Alice considers proposition U: 'The *initial* chance of Sz=↑ was *not* 0.5' (because it *looks* like it was deterministic/pre-set). Crucially: **U is true if and only if Alice is in the ↑-branch.**"
      *   *Question:* "What should Alice's credence be *now* that she's in the ↑-branch? What does PP say? What does her knowledge of U's dependence imply?" **Let the confusion simmer.**

  6.  **Confronting the Tension & Misconceptions (5 min)**
      *   *Misconception 1 (Chance=Ignorance):* **Cut off at Step 2/3.** When introducing the qubit, emphasize: "The 0.5 is *in the preparation*, not in Alice's head. Even Laplace's Demon calculating from Ψ(t0) must assign ch=0.5."
      *   *Misconception 2 (PP Circular vs Determinism):* **Cut off at Step 3/4.** Stress PP governs credence *given known chances*. Determinism is irrelevant here – the *known* fundamental theory (QM) says ch=0.5. PP says Cr must match that *known* ch. (Determinism becomes a worry only if ch is *redefined* away, which PP doesn't do).
      *   *Misconception 3 (Self-Undermining Worry):** **Address here at Step 6.** Alice knows Cr(↑-branch) *should* be 0.5 (PP). But she *also* knows Cr(↑-branch) = Cr(U). If she sets Cr(↑-branch)=0.5, she's setting Cr(U)=0.5. But U says ch_initial(↑) wasn't 0.5! This seems inconsistent – her very belief based on PP *undermines* the truth of the chance it relied on! PP seems to force her to have a credence that contradicts the chance if she's in the ↑-branch.
      *   *The Pedagogical Point:* Don't solve it yet! Make them *feel* the tension Lewis identified: PP seems sound, but can demand credences incompatible with the truth of the chances themselves in some futures.

  **What to Explicitly Omit:**
  *   **History Space Partitions:** Say: "We're skipping the formal machinery Lewis used (partitions over histories) because it can obscure the core conceptual tension. We're focusing on the *why* it's needed, not the *how* it's implemented."
  *   **Full New Principle Derivation:** Say: "Lewis (and others) proposed modified principles (like the New Principle) to handle this. That's crucial for a full solution, but today is about *seeing why the original PP runs into trouble*."
  *   **Interpretation Wars:** Say: "We're assuming a bare-bones Everettian/objective collapse view sufficient to ground objective chance. Debating interpretations isn't today's goal."

  **Closing Check - The Task:**
  *   **Prompt:** "Suppose Alice learns that *only* if she is in the ↑-branch will a *different* future chance experiment (e.g., measuring a *second* qubit prepared identically) *appear* to have ch(↑)=1.0 (due to the evidence destruction). How does this *compound* the undermining tension for her credence about the outcome of *that second* experiment *now*? Does PP give clear guidance?"
  *   *What Shows Grasp:* They should articulate that Alice *knows* the *actual* current chance for the second experiment is still 0.5 (based on Ψ/H), but PP seems to clash if she conditions on information linking her branch to future evidence undermining that very chance value. They must connect deference to *current* chance with the threat that future events can make that chance *appear* false or even *incompatible* with the total history.

  **Bottom line:** Use quantum branching indexical uncertainty to make objective chance *physically vivid* and force the confrontation with undermining futures by linking branch location to the future falsification of the initial chance.
