answer: |-
  Here is a comprehensive set of desiderata for an adequate theory of "real patterns" across the physical, design, and intentional stances, grounded in conceptual pressures and paradigmatic cases. Requirements are categorized by non-negotiable foundations vs. negotiable commitments, with explicit attention to tensions.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Essential for any adequate theory)*  

  1. **Cross-Stance Non-Collapsibility**  
     - **What**: Must explain why the three stances yield distinct, non-interchangeable explanations/predictions.  
     - **Motivating Case**: Predicting a chess computer's move:  
       - *Physical stance*: Voltage states in silicon.  
       - *Design stance*: Algorithm executing minimax.  
       - *Intentional stance*: "It wants to control the center."  
     - **Justification**: Collapsing stances erases explanatory autonomy (e.g., reducing "software error" to "electrical fluctuation" loses normative content).  

  2. **Cross-Stance Conflict Tolerance**  
     - **What**: Must account for cases where predictions/descriptions from different stances conflict.  
     - **Motivating Case**: A malfunctioning thermostat:  
       - *Design stance*: Predicts room heating (based on function).  
       - *Physical stance*: Predicts no heating (broken relay).  
     - **Justification**: Conflicts demonstrate stance-specific failure conditions (design: *normative* failure; physical: *causal* failure).  

  3. **Physical-Completeness Compatibility**  
     - **What**: Must respect the causal closure of physics (no "spooky" physical effects from non-physical patterns).  
     - **Motivating Case**: A robot's arm moves *solely* due to electrochemical processes, even if described as "intending to grab."  
     - **Justification**: Violating causal closure contradicts empirical science.  

  4. **Normative Anchoring for Design/Intentional Stances**  
     - **What**: Must ground normative evaluations (e.g., "malfunction," "irrationality") without reducing them to physical statistics.  
     - **Motivating Case**: A corrupted file fails to open. *Design-stance* explanation: "It *should* decode if the format is intact" – even if physical bytes are lawfully arranged.  
     - **Justification**: Heuristic-only accounts cannot explain the objectivity of functional failure.  

  5. **Interpretive Indeterminacy Accommodation**  
     - **What**: Must allow for multiple, equally valid intentional/design interpretations of the same physical substrate.  
     - **Motivating Case**: A flock's behavior can be interpreted as "avoiding predators" *or* "seeking thermals" – both compatible with physics.  
     - **Justification**: Indeterminacy is inherent in ascribing purposes (e.g., biology vs. engineering views of an organ).  

  ---

  ### **Negotiable Desiderata**  
  *(Subject to theoretical preference)*  

  6. **Observer-Independence of Patterns**  
     - **Demand**: Patterns exist mind-independently (realism) vs. being observer-relative (instrumentalism).  
     - **Motivating Split**:  
       - *Realists*: Thermodynamic patterns exist without observers.  
       - *Instrumentalists*: Intentional patterns require interpretative agents.  
     - **Typical Shortfall**: Interpretivism (e.g., Dennett) risks over-relativizing; physicalist reductionism denies observer-relativity where it seems essential (e.g., meaning).  

  7. **Reducibility to Physics**  
     - **Demand**: All real patterns must be reducible to fundamental physical laws.  
     - **Motivating Split**:  
       - *Reductionists*: The design stance for a ribosome is shorthand for quantum chemistry.  
       - *Non-reductionists*: A software bug’s description isn’t illuminated by particle physics.  
     - **Typical Shortfall**: Functionalist theories (e.g., Fodor) struggle with multiple realizability; strict physicalism cannot capture normativity.  

  8. **Causal Efficacy**  
     - **Demand**: Patterns must causally influence physical outcomes (e.g., mental states causing actions).  
     - **Motivating Split**:  
       - *Emergentists*: A program’s algorithm causally gates voltage changes.  
       - *Epiphenomenalists*: Patterns are "causally inert" byproducts.  
     - **Typical Shortfall**: Non-reductive physicalism (e.g., Davidson) faces exclusion problem worries.  

  ---

  ### **Critical Tensions: Joint Unsatisfiability Risks**  
  **Autonomy vs. Physical Completeness in Self-Modifying Systems**  
  - **Conflict**: Self-adaptive systems (e.g., AI retraining its own network) challenge physical closure if intentional/design descriptions have *explanatory primacy* over future states.  
  - **Case**: An AI alters its architecture to improve efficiency:  
    - *Intentional stance*: "It redesigned itself to better achieve goals."  
    - *Physical stance*: Microstate transitions obeying laws.  
  - **Tension**: If the redesign is *explained only* by intentional goals (not prior physics), autonomy violates completeness. Conversely, reducing redesign to prior physics erases agency.  
  - **Resolution Requirement**: Theory must show how higher-stance patterns *constrain* physical realization without violating closure (e.g., via dynamical systems or information-theoretic constraints).  

  **Normativity vs. Physical Symmetry**  
  - **Conflict**: Functional norms (e.g., "This circuit *should* amplify signals") lack physical analogs (physics has no "should").  
  - **Case**: A transistor amplifies in setup A but not in physically identical setup B (due to external noise). Design stance calls B "defective"; physics sees no difference.  
  - **Tension**: Anchoring normativity in physics risks eliminativism; divorcing it risks dualism.  
  - **Resolution Requirement**: Theory must ground norms in *relational properties* (e.g., history, environment) without supernaturalism.  

  ---

  ### **Where Existing Theories Fall Short**  
  - **Physicalist Reductionism**: Fails desiderata 4 (normativity) and 5 (indeterminacy). Treats design/intentional stances as *mere* heuristics.  
  - **Functionalist Design Theory**: Fails desideratum 5 (indeterminacy) and struggles with 8 (causal efficacy). Often ignores interpretive flexibility.  
  - **Interpretivist Accounts** (e.g., Dennett): Risk failing desideratum 3 (physical completeness) and 7 (reducibility). May over-privilege observer relativity.  

  ---

  ### **Summary: What the Theory Must Deliver**  
  An adequate theory must:  
  1. **Preserve** the autonomy and conflict-potential of stances.  
  2. **Anchor** normativity without physics-transcendent entities.  
  3. **Respect** causal closure while accommodating higher-stance causality.  
  4. **Explain** indeterminacy (multiple valid interpretations).  
  5. **Navigate** tensions like self-modification (*how* higher-stance properties constrain physical evolution).  

  The core challenge is **simultaneously honoring** the *objectivity* of physical law, the *normativity* of design, and the *interpretive flexibility* of intentionality—without reducing any to the others. A successful theory will show patterns as *relational bridges* between these domains, not as competing ontologies.
