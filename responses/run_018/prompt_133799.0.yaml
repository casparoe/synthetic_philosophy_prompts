  Here’s a rigorous argument for the claim that Avicenna’s Flying Man reveals the necessity of an immaterial soul as the non-indexical ground of first-person reference, addressing the proprioceptive objection:

  ### Core Argument: The Flying Man and the Metaphysics of "I"
  1. **The Flying Man Scenario**: Imagine a subject suspended in a void, devoid of all sensory input (touch, sight, proprioception, etc.), yet able to intellectually affirm "I exist." Crucially, this judgment arises *without inference* or bodily data.

  2. **The Certainty of Existence**: The subject’s affirmation "I exist" is indubitable and immediate. This certainty persists despite the total absence of sensory or bodily content, which would otherwise ground empirical self-ascription (e.g., "my body exists").

  3. **The Problem for Physicalism/Aristotelianism**:  
     - If the self were merely a physical brain state or an Aristotelian form (i.e., a configuration *of a specific body*), self-reference ("I") would depend on bodily continuity or sensory markers.  
     - In the sensory void, no bodily index (e.g., location, proprioceptive feedback) exists to anchor the "I." Yet the subject’s self-awareness remains intact.  
     - Thus, the referent of "I" cannot be bodily or sensorily constituted. It must be a *persistent, non-contingent substrate* independent of physical correlates.

  4. **The Non-Indexical "I" Requires an Immaterial Soul**:  
     - The "I" in "I exist" is **non-indexical**: it refers to the subject *as such*, not contextually (e.g., "this body here"). Its reference is direct, stable, and immune to sensory deprivation.  
     - Only an *immaterial soul* – a simple, unified substance – can serve as this referent. It provides:  
       - **Persistence**: Identity beyond transient bodily states.  
       - **Intrinsic self-presence**: The capacity for self-awareness without external mediation.  
       - **Metaphysical stability**: The "I" refers to the soul itself, not to any accidental property (e.g., a sensation).  

  ### Addressing the Proprioceptive Objection
  **Objection**: "Even in sensory deprivation, residual proprioceptive/vestibular signals might provide a minimal bodily ground for self-reference."  

  **Reply**: This objection conflates two distinct levels of awareness:  
  - **Awareness *of* bodily states**: Proprioception (if present) yields content like "there is dizziness" or "this limb feels positioned thus." This is **object-awareness** – the body as an *object* of consciousness.  
  - **Awareness *as* the subject**: The Flying Man’s "I exist" is **subject-awareness** – the *first-personal presence* enabling any awareness whatsoever.  

  **Why the Conflation Fails**:  
  1. **Non-Inferential vs. Sensory**: The certainty of "I exist" is immediate and non-inferential. Proprioceptive data, by contrast, is:  
     - **Contingent**: It could be absent (e.g., in paralysis) without negating self-awareness.  
     - **Inferential**: Sensing "my body is oriented X" *presupposes* a subject ("my") to whom the state belongs.  
  2. **The Subject-Object Divide**: Any proprioceptive signal, however faint, is an *object* of awareness. The "I" is the *subject* to whom it appears. Reducing the "I" to proprioception commits a category error: it mistakes the *experiencer* for the *experience*.  
  3. **Indexical Instability**: Bodily signals (e.g., "this vertigo") are indexical – they depend on context ("this" body). The "I" remains constant even if bodily context vanishes. If "I" were grounded in proprioception, the Flying Man should doubt his existence when signals cease – yet his certainty *increases* in their absence.  

  ### Metaphysical Implications
  - **The Soul as Referent**: The Flying Man shows that "I" directly denotes the soul – an immaterial entity whose existence is self-intimating. This reference requires no bodily "glue"; the soul *is* the ontological anchor for selfhood.  
  - **Against Reductionism**: If the self were a brain state or hylomorphic form, self-reference would dissolve in the sensory void. Its survival proves the self transcends matter.  
  - **First-Person Primacy**: The thought experiment isolates the essence of selfhood: the capacity for self-presence that makes indexical reference possible. Without an immaterial soul, there is nothing to sustain the "I" when the body vanishes from experience.  

  In essence, the Flying Man’s unshakable "I exist" reveals that the first-person pronoun is not a linguistic placeholder for bodily states, but the direct expression of an immaterial substance – the soul – whose very nature is self-consciousness. Bodily remnants cannot account for this, as they are objects *for* the subject, not the subject itself.
