  I'm applying for a six-month part-time fellowship through my university's philosophy of culture programme — it's only about four thousand pounds so the project has to stay small. My half-formed idea is about Rousseau's views on theatre, but not the standard Letter to d'Alembert essay everyone assigns. I think there's an unresolved tension: he condemns professional acting because it splits the self and feeds amour-propre, yet in the Social Contract he praises public festivals where citizens perform together. Most scholars treat these as seperate topics, but I want to ask whether there's a hidden consistency — a distinction between 'representational' performance (where an actor stands in for someone else and gets paid) and 'presentational' performance (where people enact themselves collectively) — and whether that distinction holds up if we apply it to modern immersive or community-led theatre.

  Can you turn this into a two-page research proposal? I need: the precise research question, why the existing anti-theatre and civic-festival readings leave the gap open, the method (close textual work on the Letter and Social Contract passages plus conceptual mapping, laid out roughly month by month), what success would look like and what would count as the project failing or growing too big, and an honest scope check for six months part-time. Don't include a bibliography or citation list — I'll fill those in. I mentioned this to a friend over coffee yesterday and she thought I was overreaching, so please build in a reality check about whether the distinction actually holds in Rousseau's own text rather than being imported by me.
