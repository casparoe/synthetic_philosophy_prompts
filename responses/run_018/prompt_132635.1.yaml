    - The point is: the whole system can have properties that the parts lack (emergent properties). But the question is: is intentionality one of them? And we have already seen that the lock service doesn't have intentionality about absent states (like the other partition) even when it is functioning normally. So the ant colony might be in the same boat.

  *Why now?* We have already discussed intentionality and the ant colony. The objection is likely to come up at this point. We address it by pointing out that the whole system can have properties that the parts lack, but that doesn't automatically mean it has intentionality. We have already shown in the lock service that the whole system doesn't have intentionality about absent states.

  **Step 6: Testing the Analogy: Where it Succeeds and Collapses (10 minutes)**
  - Recap:
    - The analogy succeeds: both are distributed message-passing systems that exhibit robust, emergent behavior.
    - The analogy collapses on intentionality about absent states: 
      - The lock service doesn't represent the state of the entire world (it only knows what it has agreed upon via messages). It cannot represent a partition that hasn't been detected.
      - The ant colony: it doesn't represent the absent predator; it only responds to current pheromone levels. It doesn't have a memory of the past or anticipation of the future in a representational way. It is reactive to the present state of the environment (including pheromones).
  - Conclusion so far: both systems process information and are robust, but they lack intentionality about absent states.

  **Step 7: Check for Understanding: The LLM Example (10 minutes)**
  - Question: "Consider a large language model (like GPT) running on a distributed server cluster. The model is trained on a vast corpus of text and can generate coherent responses. Using only the distinction we've developed (robust information processing vs. intentionality about absent states), does this system have a mind? Why or why not? Focus on the system as a whole, not just the software or the data."

  - We want to force them to apply the intentionality distinction. The LLM processes language and produces responses that are contextually appropriate, but it does not have intentionality about absent states in the way we defined. For example, when it says, "The Eiffel Tower is in Paris," it does not have a representation of the Eiffel Tower as an entity in the world. It is generating a string of tokens based on patterns in the training data. It doesn't know that the Eiffel Tower exists or what it is; it only knows that this string is associated with that string.

  - We prevent them from retreating to "it processes language" by requiring them to use the intentionality distinction.

  **Step 8: Wrap-up and Open Questions (5 minutes)**
  - Summarize the session: We used distributed systems to explore whether an ant colony (or any collective system) can have a mind. We found that while they exhibit robust emergent behavior, they lack intentionality about absent states, which seems to be a key component of having a mind.
