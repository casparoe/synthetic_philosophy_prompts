  - The ant colony, like the partitioned lock service, might be in a state that does not match the current environment. For instance, if a predator has left, but the alarm pheromones are still present, the ants might still be in a state of alarm. They are not representing the predator as absent; they are just responding to the current pheromone levels.

  *Why now?* We have already set up the distributed systems analogy and the concept of intentionality. Now we apply it to the ant colony.

