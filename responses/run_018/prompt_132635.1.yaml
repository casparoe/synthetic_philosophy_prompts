    - In the failure mode, the system does not represent the entire system state (it doesn't know about the other partition). It only represents the local state.
  - Key point: The lock service, even when working correctly, only represents the state that it has been told about and that it can agree on via consensus. It doesn't have a representation of the world beyond what is in its logs and messages. It lacks the ability to represent something that is absent (like the state of the other partition) in a way that is not just a record of past messages.

