  - Targeted counter-question: "Is the lock service, when partitioned, still performing cognitive work? It is processing information and behaving robustly within the partition, but it is fundamentally mistaken about the state of the world. Does that mistake matter for whether it has a mind? Or is the system just broken?"

  *Why now?* We must defuse the misconception that robust behavior is sufficient *before* we get to the ant colony. We use the lock service example because it is purely technical and shows that robust behavior can occur without being correct (or without having intentionality about the entire system).

  **Step 3: Introducing Intentionality (15 minutes)**
  - Define intentionality (in a simple, non-philosophical way): the property of being about something, or representing something that may not be present. Example: a map represents a territory even when the territory is not in front of you.
