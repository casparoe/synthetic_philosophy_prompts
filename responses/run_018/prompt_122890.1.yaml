prompt: |-
  Hi — I'm a journalist, I write a weekly column on science and ideas for a Sunday paper, and I'm about 3,000 words into a piece on something narrower than it sounds: why we can read letterforms we have literally never seen before. Not just new fonts, but genuinely new shapes — blackletter if you didn't grow up with it, a six-year-old's handwriting, the alphabet that some generative design tool spits out in your brand's "voice." I got into an argument with a type-designer friend about it (she says readabilty lives in the whole word and I said no, you can tell an 'a' is an 'a' standing there on its own), and she pointed me at that old Letter Spirit business — the project about what makes every 'a' an 'a'. Anyway, I've been turning over two answers and I want you to compare them, because I keep convincing myself they're the same claim wearing different clothes and then unconvincing myself. Call the first one shape-descent: a token is an 'a' because you can reach it from some canonical 'a' by a chain of small stylistic deformations, so identity is inherited along a path through shape space and thins out gradually the further along that path you go. Call the second one contrast-role: a token is an 'a' in virtue of the job it holds inside a particular alphabet — it's the thing that isn't the 'o', isn't the 'd', isn't the 'g' — so the boundaries in shape space are fixed by where the other letters of that font happen to sit, and they shift when the rest of the font shifts.

  The case I can't get out of my head: my friend has a variable font with a single axis that morphs the lowercase 'a' continuously into the lowercase 'o' — circle plus stem, stem shrinks, stem vanishes — and somewhere around two thirds along it stops reading as an 'a' and starts reading as an 'o', and it does so pretty abruptly even though nothing changed except the length of one stroke. Worse: take that ambiguous in-between shape and drop it into c_t (I'm using _ for the blanked-out letter) and it snaps back to being an 'a'; drop it into c_ld and it's an 'o'. And then there's single-story 'a' versus double-story 'a' — same letter, shapes sharing almost no local features, and nobody hesitates for a millisecond. A cognitive scientist I called muttered something about categorical perception and I genuinely can't tell whether that's an explanation or just a new label for the thing I'm asking about.

  So: put shape-descent and contrast-role side by side on this. Which one has the resources to explain the abrupt flip, the way the rest of the word settles the question, and the fact that two shapes with nothing in common can both be 'a' while two nearly identical shapes belong to different letters? Where do they actually predict different outcomes rather than just describing the same outcomes in different words? If one of them quietly needs the other — or if part of the disagreement is only verbal — say exactly where the collapse happens, and don't just assure me they're compatible; I already suspect they are, and what I want is the price of combining them. And give me any case I haven't thought of that splits them. Please skip sources, citations, papers, bibliographies: I'm drafting this on a flight with no wifi and I can't chase anything down, so argue it out of the cases themselves.

  Give me exactly five numbered points, one or two sentences each, no intro line and no summing-up line at the end. Roughly in this order: (1) the cleanest statement of what each account says letter-identity consists in, (2) how each handles the abrupt a-to-o flip partway along the morph, (3) how each handles the c_t versus c_ld thing, (4) how each handles single-story versus double-story 'a', (5) where, if anywhere, they come apart in prediction rather than vocabulary — and which one you'd put money on.
reasoning: |-
  Alright, the user is a journalist writing a column on why we can recognize letterforms we've never seen before. They're deep into a piece about 3000 words in and stuck on two theories: shape-descent and contrast-role. They had an argument with a type-designer friend who mentioned Letter Spirit, which is about what makes every 'a' an 'a'. The journalist presents two models: shape-descent, where letters are recognized through chains of small deformations from a canonical form, and contrast-role, where a letter's identity is defined by its differences from other letters in the same alphabet.

  The user's main challenge is distinguishing these two theories. They describe a variable font where 'a' morphs into 'o', with an abrupt shift in perception around two-thirds of the way. The ambiguous shape is interpreted as 'a' in "c_t" (like "cat") but as 'o' in "c_ld" (like "cold"). Also, single-story and double-story 'a's are instantly recognized as 'a' despite looking different. A cognitive scientist mentioned categorical perception, but the user isn't sure if that's an explanation or just a label.

  The user wants a side-by-side comparison of the two models on five specific points: definitions, handling the abrupt flip in the morph, contextual effects (c_t vs c_ld), handling different 'a' forms, and where the theories predict different outcomes. They also want to know if one theory depends on the other or if the disagreement is verbal. They need five numbered points without intros or conclusions, skipping sources since they're on a flight without Wi-Fi.

  First, I need to clearly define each theory. Shape-descent is about historical deformations from a prototype, while contrast-role is about systemic differentiation within an alphabet. For the morph example, shape-descent would say the flip happens when the deformation chain breaks, while contrast-role would attribute it to the glyph crossing a boundary defined by neighboring letters.

  For the contextual cases, shape-descent might struggle because it's about individual glyphs, whereas contrast-role excels by using surrounding letters to disambiguate. The different 'a' forms are handled well by shape-descent through multiple chains but pose a problem for contrast-role since they occupy the same role. Where they come apart: if you create a glyph that fits the deformation chain but clashes with systemic roles, or vice versa. The user also needs a prediction split, like a glyph that's deformation-valid but role-invalid in an alphabet.

  I should ensure each point is concise, one or two sentences. Point 5 needs a clear divergence case. The user suspects the theories are compatible but wants the "price" of combining them—probably acknowledging that both mechanisms are at play, with shape-descent handling historical forms and contrast-role handling contextual adaptation. My bet is on contrast-role because of its strength in contextual disambiguation, which is crucial in reading.
answer: |-
  1.  **Identity Basis:** Shape-descent: Identity is historical continuity via permissible deformations from a prototypical shape. Contrast-role: Identity is systemic contrast, defined solely by its distinct role relative to the other glyphs in its specific alphabet/font.
  2.  **Abrupt Flip:** Shape-descent: The flip occurs when deformation exceeds a threshold, breaking the chain to the 'a' prototype while establishing one to 'o'. Contrast-role: The flip happens when the glyph crosses the critical boundary *relative to the current positions of other letters*, switching its contrast role within the system.
  3.  **c_t vs. c_ld Context:** Shape-descent: Struggles inherently; identity is path-dependent, context-blind. Contrast-role: Excels; context supplies the *other letters*, defining the contrast roles needed ("c_t" needs /a/ not /o/; "c_ld" needs /o/ not /a/).
  4.  **Single vs. Double Story 'a':** Shape-descent: Explains it naturally via distinct deformation chains converging on the same functional identity. Contrast-role: Struggles; identical role but vastly different shapes challenge the idea that shape-space boundaries *within a font* define the identity.
  5.  **Prediction Split & Bet:** They predict different outcomes for an ambiguous glyph inserted into a *newly designed font* where its deformation history clashes with its systemic contrasts; contrast-role wins the bet, as the c_t/c_ld case reveals the power of systemic contrast overriding individual shape history.
