answer: |-
  Here’s the argument structured around the two-sided matching market for integration, fiscal residency, and the transformation of public-good production:

  ### The Problem: National Welfare Accounting’s Blind Spot
  National fiscal models treat migrants as homogeneous "net costs" by tallying taxes paid versus benefits consumed. This ignores **spatial and qualitative heterogeneity** in public goods. Municipal services (schools, clinics, transit) aren’t uniform pipes draining a federal reservoir—they’re **local club goods** with variable quality and viability. A school with declining enrollment faces closure; a bus route with low ridership gets cut. These clubs thrive on *critical mass* and *demand specificity*. Migrants aren’t just passive claimants—they’re **active inputs** whose labor and needs reshape the production function of these clubs.

  ### Integration as a Matching Market
  Imagine two sides:  
  - **Migrant households** seeking neighborhoods with accessible jobs, affordable housing, and services matching their needs (e.g., schools with language support, culturally competent healthcare).  
  - **Localities** (school districts, clinics, transit agencies) needing reliable users/contributors to sustain service quality.  

  This is a **two-sided match**: Migrants select locations where their skills are valued and services align with their requirements. Localities implicitly "select" migrants whose presence boosts club viability. For example:  
  - A nurse emigrating to a town with an understaffed clinic doesn’t just "cost" the welfare system—she **increases the clinic’s capacity**, preventing its collapse and attracting more residents (and tax base).  
  - Construction workers moving to a city expanding its transit network aren’t fiscal drains—they **increase ridership density**, justifying more frequent service, which raises property values and local revenue.  

  Migrants with strong labor attachment don’t "deplete" clubs—they **stabilize and scale them**. Their labor solves local shortages (e.g., childcare workers enabling parental employment), while their consumption turns marginal public goods into sustainable ones.

  ### Fiscal Residency: Solving the Magnet Problem  
  Open borders *without* incentives for free-riding requires **fiscal residency**: Welfare entitlements (unemployment, childcare subsidies, pensions) are funded by and tied to **local contribution pools** (e.g., municipal payroll taxes or property levies), not citizenship or federal transfers.  
  - **How it works**: Migrants gain access to local services only after contributing (e.g., 6+ months of local tax payments). No contributions? No claim on local club goods beyond emergency care.  
  - **Why it blocks magnets**: Migrants won’t flock to high-benefit areas if they can’t access those benefits without prior local investment. High-contribution locales attract high-contribution migrants—a **positive assortative match**.  
  - **Efficiency gain**: Localities compete to attract productive migrants by optimizing service quality (e.g., better schools for skilled workers), not by lobbying for federal funds.  

  ### Two-Tier Society? Why Matching Dynamics Prevent It  
  Critics fear migrants will cluster in low-service ghettos while natives monopolize high-quality clubs. But the matching logic disrupts this:  
  1. **Clubs need critical mass**: A school with 50% migrant children whose parents pay local taxes *requires* integration to survive. Excluding migrants means under-enrollment, budget cuts, and declining quality for *all*.  
  2. **Complementarity, not displacement**: Migrants often fill labor gaps (eldercare, infrastructure) that *enable* natives to be more productive. A polish plumber fixing pipes allows a native lawyer to bill more hours—both pay into the same local pool, upgrading shared transit.  
  3. **Upward convergence**: As migrants gain language skills and credentials (aided by locally funded programs *they* sustain via consumption/taxes), they match into higher-quality clubs. Simultaneously, their initial contributions subsidize service upgrades that benefit marginal native groups (e.g., rural poor).  

  The "tiers" dissolve because clubs **fail without diverse membership**, and fiscal residency forces **cross-subsidization within localities**, not between them. A retiree in a migrant-rich town benefits from maintained services; a migrant’s child in a native-majority school boosts per-pupil funding. Integration isn’t assimilation—it’s **co-production of viability**.

  ### The Core Insight: Migrants Transform the Production Function  
  Traditional models treat integration as a cost center. But under matching dynamics, migrants are **producers of club resilience**: Their labor solves local capacity constraints (staffing clinics), their consumption creates economies of scale (full buses), and their heterogeneity diversifies risk (stabilizing tax bases during native population decline). Open borders with fiscal residency doesn’t just add users—it adds **co-investors** who make the welfare state’s localized pillars *more* sustainable, not less. The national ledger is obsolete; the real action is in the municipal matching market.
