answer: |-
  Your observation captures a profound institutional paradox at the intersection of rationality theory, organizational behavior, and philosophy of action. Let's dissect the tension systematically:

  ### **1. Philosophical Presuppositions of the Formal Stopping-Rule Framework**
  - **Core Principle:** *Exclusively Consequentialist & Future-Oriented Rationality*  
    This framework presupposes a **Humean/Benthamite instrumental rationality**: Decisions are justified solely by future consequences. Past expenditures are *causally inert*—they cannot affect future outcomes. Sunk costs are thus "bygones" in the economic sense.
    
  - **Normative Foundation:**  
    - *Temporal Neutrality*: Only future states carry normative weight (akin to Parfit's reductionist view of personal identity).  
    - *Cognitive Bias Claim*: Sunk-cost fallacy is framed as irrational because it violates the axiom of *consequentialist invariance* (only differences in future outcomes should matter).  
    - *Epistemic Grounding*: Rooted in Bayesian decision theory—updating beliefs based on new information while ignoring irrecoverable costs.

  ### **2. Philosophical Presuppositions of the Persistence-Rewarding Structure**
  Institutional persistence reflects one or more of these non-consequentialist views:
  - **Diachronic Commitment (Korsgaard/MacIntyre):**  
    Abandoning a project violates *narrative coherence*, betraying the agency of past selves who initiated it. Persistence maintains "practical identity" over time.
    
  - **Effort Justification (Psychological):**  
    Behavioral economics (e.g., Festinger's cognitive dissonance) suggests prior effort *retrospectively* justifies continuation to avoid psychic costs of waste.

  - **Constitutive Value (Aristotelian/Heideggerian):**  
    Past investment *constitutes* present meaning—e.g., a half-built dam embodies collective purpose beyond NPV.

  - **Relational Obligations (Honneth/Darwall):**  
    Abandoning a trial "wrongs" enrolled subjects or engineers whose labor assumed project completion, violating implicit social contracts.

  ---

  ### **3. Are These Logics Reconcilable?**
  A unified account requires acknowledging **multi-levelled rationality**:

  | **Level**          | **Formal Stopping Rule**              | **Persistence Logic**               | **Reconciliation Mechanism**        |
  |---------------------|---------------------------------------|-------------------------------------|-------------------------------------|
  | **Individual**      | Epistemic rationality (ignore sunk costs) | Psychological bias (effort justification) | Cognitive debiasing training        |
  | **Project Team**    | —                                     | Relational obligations to members   | Explicit "exit honor" rituals       |
  | **Organization**    | Financial efficiency                  | Reputational/identity maintenance   | Separate metrics for continuity vs. new ventures |
  | **Society**         | —                                     | Normative expectations of commitment | Legitimizing discontinuation (e.g., negative-result journals) |

  **Key Insight:** The tension arises because stopping rules address *local* decisions (e.g., "Should we fund the next phase?"), while persistence reflects *global* organizational or social rationality (e.g., "What does abandoning this say about our identity?"). 

  **Unified Account:** *Davidson's interpretivism* suggests both logics are valid within different "webs of belief." Stopping rules optimize *allocative efficiency*, while persistence maintains *organizational integrity*. They conflict only when institutions lack meta-rules to prioritize contexts (e.g., "Use NPV when reputational risk < X").

  ---

  ### **4. Concrete Reforms Embracing Persistence Logic**
  If persistence reflects legitimate values (not just bias), institutions need:

  - **Revised Futility-Stopping Rules:**  
    - Require *continuation thresholds* (not just stopping thresholds): e.g., "Trial continues if conditional power < 5% *unless* abandonment harms cohort trust ≥ Y."  
    - *Narrative impact assessments*: Document how discontinuation affects participant relationships or organizational ethos.

  - **Scientific Credit Allocation:**  
    - Grant "partial credit" for terminated projects (e.g., publishing recruitment/feasibility data).  
    - Weight *negative results* in funding metrics proportional to sunk costs (validating effort).

  - **Review-Board Incentives:**  
    - Split review panels: One for *continuation* (assessing relational/diachronic costs), one for *new proposals* (pure NPV).  
    - Tie reviewer rewards to *long-term portfolio coherence* (not just project-by-project NPV).

  - **Capital Project Governance:**  
    - Formalize "continuation warrants": Past investment buys *option value* for future pivots (e.g., repurposing sunk engineering work).  
    - *Legacy accounting*: Track "embedded social capital" (e.g., community expectations) in gate reviews.

  ---

  ### **Conclusion: Toward a Thick Rationality**
  The tension exposes a flaw in *thin rationalist models* that reduce agency to moment-by-choice optimization. Institutions implicitly recognize that **commitments generate normative force**—a view aligned with Scanlon's contractualism or Korsgaard's self-constitution. Embedding this insight requires:
  1. **Dual-Track Decision Systems** separating *economic efficiency* from *relational integrity* assessments.  
  2. **Institutional Reflexivity:** Treating past investment not as sunk cost, but as *constitutive history* shaping present obligations.  
  3. **Metrics for Narrative Value:** Quantifying trust capital, identity coherence, and moral debt in project audits.

  By designing structures that honor persistence as *diachronic rationality*—not mere bias—institutions could mitigate the paradox while retaining consequentialist rigor where appropriate. The solution isn't abandoning sunk-cost discipline, but contextualizing it within a richer anthropology of organizational agency.
