prompt: |-
  im writing the final exam for my upper-level undergrad course on free will and moral responsibility (juniors and seniors, about 25 students, they've all read strawson's piece and the standard replies). i need one essay question on galen strawson's basic argument against moral responsibility, answerable in a 2-hour sitting, worth 20 marks out of 60 on the paper.

  what i don't want is "explain the basic argument and critically discuss" -- that just tests who memorized the summary. so build the question around this case i made up: mira grows up in an isolated community that drills into her from childhood that loyalty to the group trumps everything, including honesty toward outsiders. at 25, after exposure to outside ideas, she steps back, deliberates seriously, knows she could walk away, and reflectively endorses the loyalty principle as genuinely her own. she then lies to an outsider, in service of the group, in a way that causes real harm.

  the question should make candidates run the basic argument on this case rather than recite it: does mira's reflective endorsement stop the regress (is she responsible for the way she is because she chose to endorse it?), does her case differ in any responsibility-relevant way from an ordinary agent whose values came from an ordinary non-manipulative upbringing, and whatever they conclude about mira, what follows for the ordinary case?

  deliverables:

  1. the exam question as it would appear on the paper, with sub-parts and mark allocations shown
  2. a model answer a strong candidate could realistically produce in the time, so roughly 800-1000 words, not a treatise
  3. a marking scheme built around five must-hit points with marks per point adding to 20, and for each point a one-line note on the characteristic way a mediocre answer fumbles it

  the must-hit points should definately include: stating the argument precisely enough that the causa sui requirement is visible (not just "your character causes your actions"); why strawson thinks reflective endorsement or self-revision is itself just more of how you already are; why appeals to indeterminism or self-forming choices don't rescue her; the objection that the argument proves too much because it would equally wipe out epistemic responsibility for one's beliefs, and whether that's a reductio or a bullet to bite; and a defended verdict on mira vs the ordinary agent. if you think one of those doesn't deserve a slot, swap it out, but say why.

  also have the marking scheme name what loses marks automatically: treating the basic argument as an argument against compatibilism specifically, assuming determinism is doing the work, or offering "she could have done otherwise" as if that settled anything.
reasoning: |-
  We are creating an exam question that applies Galen Strawson's Basic Argument to the case of Mira. The question should have sub-parts to guide the student through the application. We also need a model answer and a marking scheme.

  The Basic Argument (as per Strawson) is:

  (1) You do what you do because of the way you are.
  (2) To be truly morally responsible, you must be responsible for the way you are.
  (3) But you cannot be responsible for the way you are (because that would require an impossible causal self-creation, causa sui).
  (4) Therefore, you cannot be truly morally responsible.

  The causa sui requirement is key: to be responsible for the way you are, you would have to be the cause of yourself, which is impossible.

  The exam question:

  **Question 2 (20 marks)**

  Read the following case:

  > Mira grows up in an isolated community that drills into her from childhood that loyalty to the group trumps everything, including honesty toward outsiders. At 25, after exposure to outside ideas, she steps back, deliberates seriously, knows she could walk away, and reflectively endorses the loyalty principle as genuinely her own. She then lies to an outsider, in service of the group, in a way that causes real harm.

  (a) State Galen Strawson's Basic Argument against moral responsibility. (3 marks)

  (b) Apply the Basic Argument to Mira's case. In particular, explain whether Mira's act of reflective endorsement stops the regress of the Basic Argument. (4 marks)

  (c) Strawson argues that even if an agent like Mira engages in reflective endorsement or self-revision, this is itself just a product of how she already is. Explain this point and why it might be thought that Mira's case is relevantly similar to an ordinary agent whose values came from a non-manipulative upbringing. (4 marks)

  (d) How might someone argue that Mira is morally responsible because her choice to endorse the loyalty principle was indeterministic or a "self-forming" choice? Why, according to Strawson (or a Strawsonian), would this reply fail? (4 marks)

  (e) One objection to Strawson's Basic Argument is that it seems to prove too much: if we are not morally responsible for our actions because we are not responsible for the way we are, then we also cannot be epistemically responsible (i.e., responsible for our beliefs) because we are not responsible for our cognitive faculties. Does this objection undermine the Basic Argument? Defend your answer. (3 marks)

  (f) Whatever your verdict on Mira's responsibility, what does her case imply for the moral responsibility of ordinary agents? (2 marks)

  ---

  **Model Answer (approx. 800-1000 words):**

  **(a) State Galen Strawson's Basic Argument against moral responsibility. (3 marks)**

  Galen Strawson's Basic Argument against moral responsibility is a regress argument that aims to show that true moral responsibility is impossible. It can be summarized in four steps:

  1. You do what you do because of the way you are (your character, values, etc.).
  2. To be truly morally responsible for what you do, you must be truly morally responsible for the way you are.
  3. But to be truly morally responsible for the way you are, you would have had to have chosen to be that way, which would require you to be already a certain way (with values, etc.) to make that choice. This leads to an infinite regress because you would then have to be responsible for that prior way of being, and so on, which can only be stopped if there is an impossible act of self-creation (causa sui).
  4. Therefore, true moral responsibility is impossible.

  The key point is the impossibility of causa sui: one cannot be the ultimate cause of oneself.

  **(b) Apply the Basic Argument to Mira's case. In particular, explain whether Mira's act of reflective endorsement stops the regress of the Basic Argument. (4 marks)**

  Applying the Basic Argument to Mira: Mira lies to the outsider because she has reflectively endorsed the loyalty principle. But why did she endorse that principle? Because of the way she was at the time of endorsement. That is, her act of reflective endorsement itself was a product of her pre-existing character, values, and reasoning capacities, which were shaped by her upbringing. The regress does not stop at the reflective endorsement because we can then ask: is Mira responsible for the way she was at the time of endorsement? To be responsible for that, she would have had to have chosen to be that way, but that choice would itself require a prior set of values and character traits, for which she is not responsible. Thus, the reflective endorsement does not break the regress; it merely adds one more link in the chain. Mira is not the ultimate cause of her character, so she cannot be truly morally responsible for the lie.

  **(c) Strawson argues that even if an agent like Mira engages in reflective endorsement or self-revision, this is itself just a product of how she already is. Explain this point and why it might be thought that Mira's case is relevantly similar to an ordinary agent whose values came from a non-manipulative upbringing. (4 marks)**

  Strawson insists that reflective endorsement or any act of self-revision is simply an expression of the agent's existing mental state. When Mira steps back and deliberates, she does so using the cognitive resources and values she already has. These were given to her by her upbringing and experiences. Therefore, the fact that she endorses the loyalty principle does not make her responsible for having that principle because she did not create the self that did the endorsing.

  Mira's case is relevantly similar to an ordinary agent because both are products of their formative influences. The ordinary agent, even from a "non-manipulative" upbringing, is still shaped by factors beyond their control (genes, environment, upbringing). The only difference is that in Mira's case, the upbringing is described as more extreme and isolated. But in both cases, the agent's initial constitution and formative influences are not up to them. Therefore, the ordinary agent, like Mira, cannot be the ultimate cause of their character and thus cannot be truly morally responsible.

  **(d) How might someone argue that Mira is morally responsible because her choice to endorse the loyalty principle was indeterministic or a "self-forming" choice? Why, according to Strawson (or a Strawsonian), would this reply fail? (4 marks)**

  A libertarian might argue that Mira's choice to endorse the loyalty principle was a "self-forming" action (SFA) that was not determined by prior causes. If at that moment Mira could have chosen otherwise (in an indeterministic sense), then she created her own values and thus is responsible for them. This SFA would break the regress because it would be an act for which she is responsible without needing to be responsible for prior states.

  Strawson would reject this. First, even if an action is indeterministic, that does not make it an action for which the agent is responsible. Randomness does not confer responsibility. Second, for the choice to be *her* choice, it must flow from her reasons, values, and character. But if it is truly indeterministic, then it is not determined by her prior self and thus is arbitrary. If it is arbitrary, it cannot be attributed to her in a way that grounds responsibility. Third, even if we grant that the SFA creates a new aspect of the self, we can still ask: why did she make that choice? If it is not determined by prior states, it is random; if it is, then the regress continues. Thus, indeterminism does not solve the problem.

  **(e) One objection to Strawson's Basic Argument is that it seems to prove too much: if we are not morally responsible for our actions because we are not responsible for the way we are, then we also cannot be epistemically responsible (i.e., responsible for our beliefs) because we are not responsible for our cognitive faculties. Does this objection undermine the Basic Argument? Defend your answer. (3 marks)**

  This objection does not undermine the Basic Argument; it actually strengthens it by showing its consistency. Strawson acknowledges that the argument applies equally to epistemic responsibility. We are not responsible for our beliefs in the ultimate sense because we are not responsible for our cognitive faculties or the evidence we encounter. This might seem like a reductio ad absurdum because it would mean that we are never justified in holding anyone responsible for their beliefs (e.g., in cases of negligence or irrationality). However, Strawson might bite the bullet and accept that we are not epistemically responsible in the ultimate sense. Alternatively, he could argue that epistemic responsibility is a different kind of concept, often tied to social practices of justification, but that does not affect the moral case. The key point is that the Basic Argument's structure is the same for both domains, and if we accept it for morality, we must accept it for epistemology. This does not refute the argument; it just shows its wide applicability.

  **(f) Whatever your verdict on Mira's responsibility, what does her case imply for the moral responsibility of ordinary agents? (2 marks)**

  Mira's case implies that ordinary agents are not morally responsible either. The only difference between Mira and an ordinary agent is the source of their values (extreme indoctrination vs. typical socialization). But both are shaped by factors beyond their control. If Mira's reflective endorsement doesn't make her responsible because she didn't create the self that endorsed, then the ordinary agent's values, even if acquired through a more open process, are still given. Therefore, the Basic Argument applies universally: no one is truly morally responsible.

  ---

  **Marking Scheme (20 marks total):**

  The marking scheme is built around five must-hit points (which correspond to the parts of the question). Additionally, we note automatic mark deductions for common errors.

  **Must-Hit Points (with marks per part and characteristic fumbles):**

  1. **Stating the Basic Argument with the causa sui requirement (part a):** (3 marks)  
     - Must include: actions due to the way you are; requirement for responsibility for the way you are; the regress and the impossibility of causa sui.  
     - *Mediocre fumble:* States the argument but omits the regress and/or the causa sui, e.g., just says "you are not responsible because your actions are caused by your character".

  2. **Applying the argument to Mira's reflective endorsement (part b):** (4 marks)  
     - Must argue that reflective endorsement does not stop the regress because it is a product of prior character.  
     - *Mediocre fumble:* Claims that reflective endorsement does stop the regress without addressing why Strawson thinks it doesn't, or fails to connect to the regress.

  3. **Reflective endorsement as product of prior self and similarity to ordinary agent (part c):** (4 marks)  
     - Must explain that reflective endorsement is an expression of prior state and that ordinary agents are also formed by factors beyond control.  
     - *Mediocre fumble:* Acknowledges Mira's endorsement is influenced but fails to see the parallel to ordinary agents, or overstates the difference.

  4. **Critique of indeterminism/self-forming choices (part d):** (4 marks)  
     - Must present the libertarian reply and Strawson's rebuttal (arbitrariness, regress not broken).  
     - *Mediocre fumble:* Only describes the libertarian position without refuting it, or refutes it weakly (e.g., just says "indeterminism doesn't help" without explaining why).

  5. **Handling the epistemic responsibility objection (part e) and verdict on ordinary agents (part f):** (3+2=5 marks)  
     - Part e (3 marks): Must address the objection and defend whether it undermines the argument (e.g., by accepting the consequence or distinguishing).  
       - *Mediocre fumble:* Dismisses the objection without engagement or fails to see the parallel.  
     - Part f (2 marks): Must draw the implication that ordinary agents are not responsible (given the argument).  
       - *Mediocre fumble:* Claims Mira is different without argument, or doesn't connect to the Basic Argument.

  **Automatic mark deductions (across the entire answer):**  
  - **-1 mark** if the candidate treats the Basic Argument as specifically an argument against compatibilism (it is against both compatibilism and libertarianism).  
  - **-1 mark** if the candidate assumes that determinism is doing the work (the argument is independent of determinism; it applies even in indeterministic scenarios).  
  - **-1 mark** if the candidate offers "she could have done otherwise" as a sufficient response without addressing the regress (as per Strawson, the ability to do otherwise doesn't help because you are still the way you are).  

  These deductions are applied once per occurrence (but each type only once per paper) and are subtracted from the total.

  **Total:** The marks for the must-hit points (as per the parts) add up to 20. The deductions are then applied to the total.

  **Note:** The parts are weighted: a=3, b=4, c=4, d=4, e=3, f=2. The marking scheme above breaks the must-hit points into these parts. The fifth must-hit point is split between e and f (because e and f together cover the last two points in the request: the epistemic objection and the verdict on ordinary agents). We have included the requested elements: causa sui requirement, reflective endorsement as product of prior self, critique of indeterminism, the epistemic objection, and the comparison of Mira to the ordinary agent.

  This structure tests application and critical thinking rather than rote memorization.
answer: |-
  ### Exam Question

  **Question 2 (20 marks)**  
  Read the following case:  

  > Mira grows up in an isolated community that drills into her from childhood that loyalty to the group trumps everything, including honesty toward outsiders. At 25, after exposure to outside ideas, she steps back, deliberates seriously, knows she could walk away, and reflectively endorses the loyalty principle as genuinely her own. She then lies to an outsider, in service of the group, in a way that causes real harm.

  (a) State Galen Strawson’s Basic Argument against moral responsibility, making the *causa sui* requirement explicit. (3 marks)  
  (b) Apply the Basic Argument to Mira’s case. Does her act of reflective endorsement stop the regress (i.e., make her responsible for “the way she is” at the time of her choice)? Explain why or why not. (4 marks)  
  (c) Strawson claims that reflective endorsement or self-revision is itself “just more of how you already are.” Elaborate this point, and argue whether Mira’s upbringing makes her relevantly different from an ordinary agent with a non-manipulative upbringing for questions of moral responsibility. (4 marks)  
  (d) Some theorists argue that indeterministic “self-forming choices” (e.g., Mira’s endorsement) can ground responsibility. Explain why Strawson would reject this as a solution for Mira. (4 marks)  
  (e) Critics object that Strawson’s argument “proves too much” by undermining epistemic responsibility (e.g., justification for beliefs) just as it does moral responsibility. Is this a compelling *reductio ad absurdum* or a consequence Strawson can accept? Defend your view. (3 marks)  
  (f) Based on your analysis, what does Mira’s case imply about the moral responsibility of ordinary agents? (2 marks)  

  ---

  ### Model Answer (Strong Candidate Response, ~900 words)  

  **(a)** Strawson’s Basic Argument holds that true moral responsibility is impossible because it requires *causa sui* (self-creation). It runs:  
  (1) You act as you do because of “the way you are” (e.g., character, values).  
  (2) To be morally responsible for your actions, you must be responsible for “the way you are.”  
  (3) But to be responsible for “the way you are,” you must have chosen it, which requires pre-existing traits (initiating a regress).  
  (4) The regress can only stop if you are *causa sui*—the ultimate cause of yourself—which is impossible.  
  Thus, moral responsibility is illusory. The *causa sui* requirement is key: responsibility demands origination from oneself, but no one creates their initial mental architecture.  

  **(b)** Mira’s reflective endorsement does **not** stop the regress. She lies because she endorsed loyalty, but that endorsement itself resulted from “the way she was” at age 25—her values, reasoning style, and even her openness to reflection were shaped by her upbringing. For her to be responsible for the endorsement, she must be responsible for that prior state. Yet she did not create the childhood influences that forged her 25-year-old self. The regress continues: we can ask why she had the traits that led to endorsement, tracing back to factors beyond her control (e.g., her community’s indoctrination). Endorsement is just another link in the causal chain; it doesn’t grant *causa sui* status. Thus, she isn’t responsible for “the way she is” when she chooses.  

  **(c)** Strawson’s point is that reflective endorsement is never “free” in the responsibility-grounding sense because it expresses pre-existing features. When Mira deliberates, she uses cognitive tools (e.g., her weighting of loyalty over honesty) instilled by her upbringing. Her endorsement feels authentic but is determined by the very traits she is evaluating—she doesn’t stand outside her psychology to create it anew.  

  This makes Mira **relevantly similar** to an ordinary agent. Both are products of unchosen influences: Mira’s “manipulative” upbringing and an ordinary agent’s “non-manipulative” one (e.g., parental guidance or cultural norms) both impose values without consent. The ordinary agent might endorse their values after reflection, but like Mira, their reflective capacity is inherited, not self-caused. The difference in upbringing severity is irrelevant—both agents lack *causa sui* because neither chose their formative inputs. Thus, neither can be truly responsible for their actions.  

  **(d)** Libertarians might argue Mira’s endorsement is an indeterministic “self-forming choice” (SFC): she could have rejected loyalty, creating herself *ex nihilo* and stopping the regress. Strawson would reject this. First, indeterminism introduces randomness: if Mira’s choice isn’t caused by her prior state (e.g., her loyalty-inclined character), it is arbitrary and not *hers*. Second, even if she “forms herself” via SFC, we can ask why she has the capacity for SFCs—which she didn’t choose. The regress resumes: she isn’t responsible for the traits enabling the SFC. Finally, *causa sui* is incoherent; nothing can cause itself. Thus, SFCs don’t solve Mira’s dilemma—they merely obscure the need for prior responsibility.  

  **(e)** The objection is **not** a devastating *reductio*; Strawson can accept it without absurdity. The Basic Argument applies equally to epistemic responsibility: you believe as you do because of your cognitive makeup (e.g., innate reasoning biases), for which you aren’t responsible. Thus, you cannot be *ultimately* responsible for beliefs, even if society holds you accountable for irrationality. This isn’t absurd because epistemic practices (e.g., criticism of arguments) don’t require ultimate responsibility—they are forward-looking tools for improving beliefs, not backward-looking blame. Strawson would “bite the bullet”: moral responsibility *also* collapses, but this doesn’t undermine social practices (e.g., praise/blame as behavioral incentives). The objection highlights the argument’s consistency but doesn’t refute it.  

  **(f)** Mira’s case implies that **ordinary agents are equally non-responsible**. Her reflective endorsement fails for lack of *causa sui*, and ordinary agents’ values are likewise unchosen. If upbringing differences don’t break the regress (as argued in (c)), then no one is the ultimate source of their actions. Thus, Strawson’s argument generalizes: moral responsibility is impossible for everyone.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (aligned with question parts). Deduct marks automatically for errors listed below.  

  | **Point** | **Marks** | **Description** | **Mediocre Fumble (Common Weakness)** |
  |-----------|-----------|----------------|----------------------------------------|
  | **1. Basic Argument with *causa sui*** | 3 (for part a) | Clearly states all steps, emphasizing the *causa sui* requirement as the reason the regress is inescapable. | Omits the regress or *causa sui*, e.g., reduces it to "you act from character, so you’re not responsible" without the self-creation problem. |
  | **2. Reflective endorsement fails to stop regress in Mira’s case** | 4 (for part b) | Explains that endorsement is caused by prior traits (e.g., upbringing), so it extends rather than halts the regress. | Claims endorsement stops the regress because it’s “free” or “authentic” without addressing why it depends on unchosen factors. |
  | **3. Endorsement as product of prior self + similarity to ordinary agents** | 4 (for part c) | Argues that endorsement expresses pre-existing traits; concludes Mira and ordinary agents share a lack of *causa sui* due to unchosen influences. | Treats Mira’s manipulation as uniquely responsibility-undermining while assuming ordinary agents have “true” self-creation. |
  | **4. Indeterminism/SFCs fail** | 4 (for part d) | Rejects SFCs by noting arbitrariness (if uncaused) or regress (if caused) and reiterates *causa sui* impossibility. | Only describes SFCs without refuting them, or asserts “indeterminism allows responsibility” without engaging Strawson’s randomness critique. |
  | **5. Epistemic objection + verdict on ordinary agents** | 5 (3 for e + 2 for f) | For (e): Defends why the objection is not a *reductio* (e.g., by biting the bullet or distinguishing practices). For (f): Infers that ordinary agents lack responsibility based on Mira’s case and the Basic Argument. | For (e): Dismisses the objection as irrelevant without analysis. For (f): Fails to connect Mira to ordinary agents or asserts they are different without argument. |

  **Automatic mark deductions** (applied once per occurrence, max –3 total):  
  - **–1** if the candidate treats the Basic Argument as *only* an attack on compatibilism (it targets libertarianism too).  
  - **–1** if the candidate assumes determinism is essential to the argument (it isn’t; the regress persists under indeterminism).  
  - **–1** if the candidate uses “she could have done otherwise” (e.g., Mira’s ability to walk away) as a *sufficient* defense of responsibility without addressing the regress.  

  **Grading guidance**:  
  - **17–20 marks**: Hits all five must-hit points; avoids automatic deductions; uses the case to illuminate the argument.  
  - **12–16 marks**: Hits 3–4 points; some fumbles or minor deductions; may drift into generic summary.  
  - **7–11 marks**: Hits 2–3 points; significant omissions or deductions; confuses Strawson’s argument with other theories.  
  - **0–6 marks**: Misses most points; deductions apply; fails to engage the case or Basic Argument.
