prompt: |-
  Compare the canonical decision-theoretic account of the sunk-cost fallacy—where rationality is defined as forward-looking optimization and any weight given to irrecoverable past expenditures is classified as a bias—with what may be called a commitment-constitutive account, on which certain sunk costs function not as wasted resources but as constitutive elements of diachronic agency or institutional continuity, so that honoring them preserves the identity of the agent or practice rather than distorting choice. In particular, examine structurally analogous cases—such as an institution maintaining a symbolically central but failing program, or an individual completing a damaging apprenticeship to preserve a mentor relationship—where the two frameworks yield opposite prescriptions. Determine whether their disagreement is substantive (about the correct norms of rationality) or conceptual (about whether "cost" denotes the same kind of entity in both analyses), and specify what kind of conceptual or empirical consideration—short of citation to authority—would genuinely adjudicate between them.
