  hey im writing my diss chapter on aristotle politics I and im kinda stuck on this one argument. the standard reading is that aristotle condemns interest (tokos) because money is barren — it cant reproduce like seeds or animals — so charging interest is like breeding coins which is unnatural. but i want to push back by taking his distinction between oikonomia and chrematistike at the level of sign-systems rather than just goods. in natural exchange the coin is just a stand-in for the use-value being swapped, but in chrematistike the token becomes its own object. so heres the position i want you to defend: aristotles real issue with tokos isnt physical sterility, its that interest forces the token to carry two incommensurable roles — medium of exchange and store of accumulated claim — without a corresponding use-value to anchor them. this makes the exchange loop self-referntial in a way that violates the proportionalty required for corrective justice. argue that this saves him from the obvious rebuttal that seeds reproduce without labor, but only if we also accept that modern digital ledger credit (where the token is pure relational claim with no physical body) is actually closer to aristotelian natural exchange than coin-based interest is, because it removes the false promise that a material token can multiply itself. i know thats a mouthful and probably wrong but can you build the case? also i think i spelled proportionalty wrong lol
