prompt: |-
  I am a control-systems engineer with working fluency in feedback-loop design, stability margins, state-space representation, and the trade-offs between high-gain direct control and noisy distributed feedback. I want you to restate the performance-legitimacy argument—that sustained economic prosperity and social order can justify authoritarian or highly centralized governance, of the kind often discussed in relation to post-1978 China and Singapore’s developmental-state model—entirely in the vocabulary of control theory and optimal control. Treat the polity as a dynamic system: the state as controller, economic growth and public order as target output trajectories, democratic participation as distributed sensor feedback or noise, authoritarian consolidation as a high-gain feedforward strategy with reduced sensing, and legitimacy itself as a stability criterion. Be precise about which control-theoretic concepts genuinely correspond to claims made by defenders of this model. Then provide the residue report: which normative and empirical claims translate cleanly, which survive only if distorted, and which have no counterpart in your framework at all. In particular, address whether the core normative claim—that adequate system outputs can legitimate the controller’s structure regardless of participatory consent—maps onto any internal principle of control theory, or whether it functions as an external axiom smuggled into the translation. Finally, tell me whether the untranslatable residue indicates a genuine limitation of control-theoretic language for political philosophy, or whether it reveals that the original performance-legitimacy thesis depends on an ambiguity that collapses once its mechanics are made explicit. Do not cite specific authors or texts; work from the conceptual structure of the argument alone.
