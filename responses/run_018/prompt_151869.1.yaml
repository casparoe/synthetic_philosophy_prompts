answer: |-
  ### Control-Theoretic Restatement of Performance-Legitimacy  
  **System Definition:**  
  - **Plant:** Polity (dynamic system with states: economic capacity, social cohesion, resource distribution).  
  - **Controller:** Centralized state apparatus (executing policy inputs \( u(t) \)).  
  - **Reference Trajectories \( r(t) \):** Target GDP growth rate (\( y_e \)) and public order index (\( y_s \)).  
  - **Outputs \( y(t) \):** Measured economic performance (\( \hat{y}_e \)) and social stability (\( \hat{y}_s \)).  
  - **Feedback Signals:** Democratic participation acts as distributed sensor network \( s(t) \), providing noisy state estimates with variance \( \sigma^2 \).  
  - **Feedforward Path:** Authoritarian consolidation implements high-gain control law \( u(t) = K_{ff} \cdot r(t) \), minimizing reliance on \( s(t) \).  
  - **Stability Criterion:** Legitimacy \( L \) defined as bounded-error tracking: \( \| r(t) - y(t) \| < \epsilon \) over \( t \in [0, T] \).  

  **Correspondences to Performance-Legitimacy Claims:**  
  1. **High-Gain Feedforward ≡ Centralized Decisiveness**  
     - *Claim:* Rapid response to disturbances (e.g., recessions, unrest) via precomputed policy actions.  
     - *Control Analogy:* \( K_{ff} \) amplifies reference signals, enabling fast setpoint tracking but increasing sensitivity to unmodeled dynamics.  

  2. **Reduced Sensing ≡ Suppressed Participation**  
     - *Claim:* Democratic feedback introduces measurement noise/disturbances (protests, debates) slowing response.  
     - *Control Analogy:* Low-pass filtering \( s(t) \) (damping participation bandwidth) minimizes \( \sigma^2 \) but increases phase lag in error correction.  

  3. **Stability Margin ≡ System Resilience**  
     - *Claim:* Sustained \( y(t) \approx r(t) \) guarantees legitimacy.  
     - *Control Analogy:* \( L \) is Lyapunov-stable if \( \dot{V}(e) < 0 \) for tracking error \( e = r - y \), irrespective of observer design.  

  4. **Trade-off Formalization**  
     - *Claim:* Authoritarian efficiency outweighs feedback inaccuracy.  
     - *Control Analogy:* Loop-shaping prioritizes gain margin over phase margin, accepting risk of high-frequency oscillations (localized instability) for low-frequency tracking.  

  ---

  ### Residue Report  
  **Clean Translations:**  
  - **Output-Centric Legitimacy:** \( L \) as asymptotic stability of \( e(t) \) maps directly to performance-based justification.  
  - **Speed-Robustness Trade-off:** High \( K_{ff} \) vs. sensor noise rejection quantifies the efficiency/participation compromise.  
  - **Disturbance Rejection:** Economic shocks as \( d(t) \) countered by feedforward action aligns with claims of crisis management superiority.  

  **Distorted Survivors:**  
  - **"Noisy Feedback" ≡ Democratic Participation:**  
    - *Distortion:* Equating participation with sensor *noise* (not process noise) implicitly pathologizes dissent. Control theory treats sensor noise as exogenous, but democratic signals are endogenous state observations.  
  - **Legitimacy Stability Criterion:**  
    - *Distortion:* \( L \) stability requires *persistent* tracking. Real-world legitimacy often exhibits hysteresis—past performance creates inertia against future instability. Control framework lacks this memory.  

  **No Counterpart:**  
  1. **Normative Axiom of Output Supremacy:**  
     - The claim that "outputs justify controller structure" has **no internal equivalent** in control theory. Controllers are designed to meet specifications *including* robustness to model uncertainty—which necessitates feedback. Asserting that feedforward alone suffices contradicts Bode’s integral theorem (which mandates trade-offs between sensitivity reduction and robustness).  
     - *Smuggled Axiom:* The model assumes \( r(t) \) is perfectly known and the plant is fully observable without sensors. This is an external idealization.  

  2. **Consent as Non-Concept:**  
     - Democratic consent has no analog; control inputs \( u(t) \) are force-applied, not negotiated. The framework cannot represent *voluntary* compliance (only asymptotic error suppression).  

  3. **Rights Violations as Control Cost:**  
     - Repression (e.g., censorship as sensor calibration) appears as a design parameter. No concept of constraints on controller aggression (e.g., input saturation = accountability) exists unless externally imposed.  

  ---

  ### Critical Evaluation  
  **Untranslatable Residue Significance:**  
  1. **Revealed Ambiguity:**  
     - The performance-legitimacy thesis relies on conflating *short-term* tracking stability with *long-term* robustness. Control theory exposes this: high-gain feedforward systems fail catastrophically under unmodeled disturbances (e.g., demographic shifts, climate events). Legitimacy-as-stability thus assumes near-perfect plant modeling—an untenable requirement for social systems.  

  2. **Normative Collapse:**  
     - The core claim that outputs legitimize structure is **externally smuggled**. Control theory evaluates controllers by *all* performance specs (rise time, overshoot, disturbance rejection), not just setpoint tracking. Ignoring sensor validity violates separation principle requirements. This reveals the thesis’s circularity: it presumes the state’s model is infallible, making legitimacy tautological.  

  3. **Limitation of Framework:**  
     - Control theory cannot model *reflexivity*: when sensor suppression (\( \sigma^2 \downarrow \)) alters the plant dynamics (e.g., suppressed dissent accumulating latent instability). Political systems are adaptive; controllers and plants co-evolve. The framework’s linear time-invariant assumptions obscure this.  

  **Conclusion:**  
  The residue exposes not a limitation of control theory, but a fatal flaw in the performance-legitimacy argument: it **equivocates between stability and robustness**. Control theory confirms that high-gain feedforward *can* achieve short-term tracking but at the cost of fragility and unobservability—precisely why real controllers require feedback. The untranslatable elements (consent, rights) reveal where the argument substitutes engineering metaphors for political accountability.
