  I'm preparing material for an advanced seminar on the metaphysics of value, and I want to move beyond the standard illustrations of the heterogeneity problem—gustatory versus auditory pleasure—into a case where the difficulty is not merely taxonomic but structurally damaging to hedonist aggregation. Give me a concrete example of a conceptual issue that arises when a hedonist tries to treat two radically dissimilar experiences as commensurable units of well-being.

  Specifically, contrast the brief, sharply focused cognitive satisfaction of recognizing a subtle equivocation in a philosophical argument with the sustained, diffuse bodily relief of returning to thermal equilibrium after prolonged cold exposure. Your example should pinpoint exactly where comparing their intensity or duration requires either a circular appeal to a shared intrinsic quality called 'pleasantness,' or a surreptitious import of representational content—the claim that both represent some state of affairs as satisfactory for the subject—which a pure phenomenal hedonist cannot accept without abandoning the view that pleasure is a raw qualitative feel. Make the failure look like a breakdown in measurement and cross-domain comparison rather than just a difference in phenomenology, and show why that breakdown undermines practical reasoning about welfare rather than leaving it untouched.
