  Write a formal two-page research proposal that includes the following: a precisely stated research question with a determinate yes-or-no or this-versus-that structure; an explanation of why current debates between rule-consequentialists and contractualists leave this ambiguity unresolved, specifically identifying where those debates conflate the dimensions; the proposed method, broken into phases (for example, conceptual mapping of the three dimensions; application to two canonical frameworks treated as case studies rather than competing doctrines; evaluation of the alienation objection under each separation); a clear statement of what counts as success (demonstrating that at least one separation genuinely blocks the objection without collapsing into direct normativity) and what counts as failure (showing that the dimensions are conceptually inseparable in any normatively interesting form); and an honest scope assessment, including which parts risk exceeding a six-month timeline and how the project should be truncated if necessary. Do not include a bibliography, reading list, or citations; I will add references myself. Write for a review committee with background in normative ethics but not assuming specialized training in formal decision theory.
