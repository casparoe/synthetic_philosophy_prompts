prompt: |-
  I'm attempting to determine my own principled view of when an atrocity ought to be named genocide, weighing moral intuition against legal category. Here are my verdicts on specific cases, with one tension I cannot resolve. Case 1: The systematic destruction of European Jewry during the Second World War—this is genocide, unambiguously, in both law and morality. Case 2: A settler-colonial administration deliberately introduces famine and disease to eradicate an indigenous population—genocide, even absent industrial methods or explicit racial ideology, because the group-targeting and destructive intent are clear. Case 3: A government executes tens of thousands of political opponents drawn from every ethnicity—this is a mass atrocity and a crime against humanity, but I hesitate to call it genocide because the victims are not selected for membership in a protected group as such, in the sense Lemkin originally articulated. Case 4: A state-sanctioned corporation diverts and poisons a watershed knowing it will eliminate a specific tribe's physical and cultural survival, but internal documents frame the act as resource optimization with no explicit order to destroy the group—morally this feels like genocide to me, yet I suspect conventional legal doctrine might acquit it for lack of specific intent. Case 5: A regime deploys algorithmic risk-scoring to enforce compulsory sterilization and indefinite detention on members of one ethnic minority, labeling the program predictive public health—genocide, despite the bureaucratic framing, because the group is targeted and the effect is destructive. Case 6: In a civil conflict, both factions engage in ethnic cleansing; each side publicly accuses the other of genocide while denying its own actions. Here I think both should bear the label, but I notice that in practice the naming becomes a political weapon, which makes me wonder whether my other verdicts are also partly performative rather than purely descriptive. There is a tension between Case 3, where I require group-specific targeting, and Case 4, where I want to apply the label despite the absence of explicit targeting language. Is there a coherent principle—perhaps based on intent, foreseeable effect, group identity, or the performative function of naming—that accommodates all six? If not, which verdict must be revised? Apply your principle to one further case I have not listed: a state sponsors large-scale climate-engineering that disproportionately destroys the habitat of a nomadic people, with internal memos showing full awareness of the consequence but framing the project as global carbon mitigation with no mention of the affected group. State the principle precisely, indicate which of my verdicts it saves and which it sacrifices, and deliver your final conclusion in the form: Verdict: [state whether a unified principle exists and, if so, its core claim].
reasoning: |-
  Okay, let's start by unpacking the user's query. They're grappling with when to label an atrocity as genocide, balancing moral intuition against legal definitions. They've provided six cases with their verdicts and a tension between Case 3 and Case 4. The core issue seems to be reconciling the requirement for group-specific targeting in Case 3 with the absence of explicit intent in Case 4.

  First, I need to understand their underlying concerns. The user mentions the performative aspect of naming genocide in Case 6, which suggests they're wary of the term being politicized. They might be seeking a principled approach that avoids such pitfalls while staying true to both moral and legal dimensions. Their examples span historical events, corporate actions, and modern tech-driven atrocities, indicating they want a framework applicable to diverse scenarios.

  Looking at the tension between Cases 3 and 4: in Case 3, political opponents aren't a protected group, so they hesitate to call it genocide. In Case 4, despite corporate documents framing it as resource optimization, the foreseeable destruction of a tribe feels like genocide morally. The conflict here is between explicit intent versus foreseeable consequences. Legally, the Genocide Convention requires specific intent (dolus specialis), but morally, the outcome and knowledge of harm might suffice.

  The user's proposed principle centers on "destructive knowledge of group erasure." This combines intent and foreseeability. For Case 4, internal awareness of the tribe's destruction meets the threshold even without explicit orders. Case 3 lacks group identity as the basis, so it doesn't qualify. This principle also handles Case 6 by focusing on actions rather than rhetoric, potentially sidestepping political weaponization.

  Applying this to the new case: state-sponsored geoengineering that knowingly destroys a nomadic group's habitat, framed as carbon mitigation. Internal memos show awareness but no mention of the group. Under the proposed principle, the state's knowledge of disproportionate harm constitutes destructive knowledge, making it genocide. This aligns with the user's moral intuition in Case 4.

  Now, which verdicts are saved? Cases 1, 2, 5 fit clearly. Case 3 remains a mass atrocity, not genocide. Case 4 and the new case qualify. Case 6 requires evidence of destructive knowledge per faction. The sacrifice is Case 3's exclusion, but this maintains coherence.

  The user's deeper need might be a consistent ethical framework that challenges legal strictness where it fails morally. They might also seek validation that moral intuition can inform legal categories, especially for modern, systemic atrocities. By emphasizing "knowledge," the principle addresses corporate and bureaucratic violence (Cases 4, 5, new case), which are increasingly relevant.

  Final verdict: A unified principle exists. Core claim: Genocide requires intentional or knowingly destructive actions targeting a group's destruction, with group identity as the basis.
answer: |-
  Your tension between Cases 3 and 4 reveals the core challenge: reconciling the legal requirement for *specific intent to destroy a group* with moral intuition that *foreseeable destruction of a group* suffices. Here's a coherent principle resolving your cases:

  **Principle:** *An atrocity constitutes genocide when agents deliberately inflict conditions calculated to destroy, in whole or in part, a protected group (national, ethnic, racial, or religious), or knowingly pursue policies where such destruction is an inevitable or overwhelmingly foreseeable consequence, and the group's identity is the basis for their selection or differential impact.* 

  This principle combines **specific intent** ("deliberately inflict conditions calculated to destroy") and **destructive knowledge** ("knowingly pursue policies where such destruction is... overwhelmingly foreseeable"). It maintains Lemkin's core focus on *group identity as the basis*.

  ### Application to Your Cases:
  1.  **Case 1 (Holocaust):** Saves. Specific intent + group targeting = unambiguous genocide.
  2.  **Case 2 (Settler-colonial famine):** Saves. Deliberate infliction of famine *on a specific group* constitutes "conditions calculated to destroy" them.
  3.  **Case 3 (Political executions):** Saves. Victims selected *for political affiliation*, not group identity. Lacks group basis. Correctly excluded.
  4.  **Case 4 (Corporate poisoning):** **Saves and resolves tension.** Agents *knowingly* poison the watershed with *overwhelmingly foreseeable* destruction of the tribe. The tribe's identity is the basis for the differential impact (they uniquely depend on that land/culture). Framing as "resource optimization" doesn't negate the knowledge of inevitable group destruction. **This is genocide.**
  5.  **Case 5 (Algorithmic sterilization):** Saves. Specific targeting of an ethnic minority using bureaucratic tools. The framing is irrelevant to the deliberate targeting and destructive outcome. "Calculated to destroy" via biological suppression.
  6.  **Case 6 (Mutual ethnic cleansing):** **Saves, with nuance.** If *either faction* deliberately inflicts conditions calculated to destroy, or knowingly inflicts conditions foreseeably destroying, the *other* ethnic group (protected group basis), then *that faction's actions* constitute genocide. The performative weaponization of the label doesn't negate its applicability where the factual threshold is met. Your verdict (both bear the label *if* actions meet the threshold) is sound.

  ### Sacrifice:
  *   **Case 3 Verdict Confirmed:** Requires exclusion. The principle firmly grounds genocide in **group identity**, sacrificing the inclusion of purely political targeting.

  ### New Case: State-Sponsored Climate Engineering
  *   **Scenario:** State sponsors geoengineering knowingly destroying a nomadic people's habitat. Internal memos show full awareness but frame it as global carbon mitigation, ignoring the group.
  *   **Analysis under Principle:**
      *   **Protected Group:** Nomadic people (likely ethnic group).
      *   **Destructive Action:** Geoengineering disproportionately destroying their habitat (essential to their physical/cultural survival).
      *   **Intent/Knowledge:** State has **full awareness** of the consequence (destruction of the group) but proceeds. This constitutes **knowingly pursuing policies where group destruction is overwhelmingly foreseeable**.
      *   **Group Basis:** The nomadic group is uniquely impacted *because* of their identity/concrete connection to the land being destroyed.
  *   **Verdict:** **This is genocide.** The lack of explicit mention of the group in project framing is irrelevant given the documented knowledge of the inevitable consequence *for that specific group*. The state knowingly accepted the destruction of the group as a consequence of its policy.

  ### Final Conclusion
  **Verdict:** A unified principle exists. Its core claim is: **Genocide occurs when perpetrators deliberately inflict, or knowingly accept as an inevitable consequence of their actions, the destruction of a protected national, ethnic, racial, or religious group, where the group's identity forms the basis for their selection or the disproportionate impact.** This principle integrates the legal requirement for intent/knowledge with moral concern for foreseeable destruction, while preserving Lemkin's foundational focus on group identity as the defining characteristic separating genocide from other mass atrocities. It resolves your tension by recognizing that "destructive knowledge" (Case 4, New Case) meets the threshold alongside "destructive intent" (Cases 1, 2, 5).
