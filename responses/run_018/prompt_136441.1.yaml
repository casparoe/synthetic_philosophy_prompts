answer: |-
  Here is a rigorous specification sheet for metaethical theories, structured by core desiderata, tensions, and constraints, including your novel "normative inertia." The list prioritizes neutrality where possible, flags conflicts, and distinguishes necessities from preferences.

  **I. Explananda: Phenomena Requiring Explanation**
  *   **1. First-Order Moral Disagreement:**
      *   **Description:** Widespread, deep, and persistent disagreement on substantive moral issues (e.g., abortion, distributive justice, animal rights) across individuals and cultures.
      *   **Motivating Case:** Fundamental clashes (e.g., deontology vs. consequentialism; individual rights vs. communal good; views on sanctity of life) that resist easy resolution through empirical facts or logic alone.
      *   **Non-Negotiable:** Yes. Any theory ignoring or trivializing deep disagreement fails descriptively.
  *   **2. Phenomenological Authority of Obligation:**
      *   **Description:** The distinctive "must-do," "demanding," or "categorical" felt quality of moral requirements, often experienced as overriding other considerations (e.g., self-interest, preference).
      *   **Motivating Case:** The experience of guilt, shame, or a sense of inescapable duty even when acting immorally would be personally advantageous or unnoticed.
      *   **Non-Negotiable:** Yes. A theory must account for the *felt force* of morality, not just its content.
  *   **3. The Appearance of Moral Progress:**
      *   **Description:** The widespread intuition that certain historical changes (e.g., abolition of slavery, expansion of suffrage, recognition of LGBTQ+ rights) represent genuine moral *improvement*, not mere change.
      *   **Motivating Case:** Comparing historical practices (e.g., gladiatorial combat, feudal serfdom) to modern norms yields a strong sense that we are morally better off now.
      *   **Non-Negotiable:** Contested. Robust realists see it as essential; some anti-realists (e.g., certain relativists) may struggle or see it as merely sociological change. Arguably necessary for a theory to be descriptively adequate to common moral experience.
  *   **4. Normative Inertia:**
      *   **Description:** The persistence of specific moral commitments in agents even after they acknowledge the original evidential or rational grounds for those commitments are undermined or invalidated.
      *   **Motivating Case:** A utilitarian who intellectually concedes that a specific act maximizes utility but *still* feels it's deeply wrong based on prior deontological training; or someone abandoning religious grounds for ethics but retaining core moral prohibitions.
      *   **Requirement:** Account for this persistence *without*:
          *   (a) Reducing it to simple irrationality (e.g., mere bias/akrasia).
          *   (b) Smuggling in hidden rational justification (e.g., "they *really* still believe").
      *   **Orientation:** Orthogonal, but favors accounts with strong psychological/embodied/social components (e.g., certain sentimentalist, constructivist, or practice-based theories). Challenges purely intellectualist/rationalist views (realist or anti-realist). **Non-Negotiable:** As a *phenomenon to explain*, yes.

  **II. Conceptual Distinctions to Preserve**
  *   **5. Genuine Moral Reason vs. Motive-Convergence:**
      *   **Description:** Distinguish between having a reason *because* an action is morally required (the *moral* reason) and having a motive (e.g., desire for approval, fear of punishment) that merely *aligns* with what is morally required.
      *   **Motivating Case:** Helping someone because you recognize their need creates a *moral* obligation (moral reason) vs. helping solely to impress an onlooker (motive convergence).
      *   **Non-Negotiable:** Core to the concept of morality itself. Failure collapses morality into psychology/sociology. Essential for prescriptive force.
  *   **6. Normativity vs. Description:**
      *   **Description:** Preserve the distinction between stating what *is* the case (anthropology, psychology) and stating what *ought* to be the case (morality).
      *   **Motivating Case:** Explaining *why* a culture believes X is wrong (descriptive) vs. arguing that X *is* wrong (normative). Avoiding the naturalistic fallacy.
      *   **Non-Negotiable:** Yes. Collapsing this distinction eliminates the subject matter of metaethics.

  **III. Consistency Conditions**
  *   **7. Compatibility with Moral Psychology (Cross-Cultural Variation):**
      *   **Description:** Account for empirical findings of significant variation in moral judgments, values, and foundational intuitions across cultures (e.g., Haidt's Moral Foundations Theory) *without* thereby reducing morality *entirely* to descriptive anthropology or relativistic psychology.
      *   **Motivating Case:** Differences in emphasis on harm, fairness, loyalty, authority, and purity across societies; cultural relativity of specific norms (e.g., dietary restrictions, family structures).
      *   **Requirement:** Explain variation without losing the normative "ought" (Distinction 6) or the possibility of cross-cultural critique/progress (Phenomenon 3).
      *   **Non-Negotiable:** Yes. Must be consistent with empirical data without being reduced by it.
  *   **8. Compatibility with Moral Psychology (Cognitive/Emotional Basis):**
      *   **Description:** Account for the role of both rational deliberation and affective processes (emotions, intuitions) in moral judgment and motivation, as evidenced by psychology and neuroscience.
      *   **Motivating Case:** Dual-process theories; the influence of disgust/empathy; emotional responses preceding rationalization; psychopaths understanding morality without motivation.
      *   **Non-Negotiable:** Yes. Must fit the cognitive architecture of moral agents.

  **IV. Flagged Tensions (Potentially Jointly Unsatisfiable Pairs)**
  *   **A. Phenomenological Authority (2) + Deep/Persistent Disagreement (1):** Can morality feel categorically demanding and overriding *if* its fundamental truths are the subject of intractable disagreement? Robust realism risks making widespread error mysterious; strong relativism risks undermining categorical authority. *(Your primary concern)*
  *   **B. Moral Progress (3) + Normative Inertia (4):** How can progress be "real" if core commitments persist even after their original justification is undermined? Progress suggests correction; inertia suggests resistance to correction even post-justification.
  *   **C. Genuine Moral Reason (5) + Cross-Cultural Variation (7):** If moral reasons are objective/universal, why such variation? If variation is fundamental, how are reasons more than culturally relative motives?
  *   **D. Normative Inertia (4) + Genuine Moral Reason (5):** Does inertia show that core moral commitments are *not* fundamentally based on reasons (challenging 5), or is it merely a psychological overlay on reason-based morality?

  **V. Camp-Specific Preferences (Non-Negotiable for *Them*, but not necessarily for the List)**
  *   **Robust Realist Preference:** Moral truths must be stance-independent, objective, and irreducible to non-moral facts.
  *   **Constructivist Preference:** Moral truths are constituted by (idealized) rational/practical agency or social procedures.
  *   **Error Theorist Preference:** Systematic vindication of ordinary moral discourse/judgment is impossible.
  *   **Quasi-Realist Preference:** Moral discourse must project attitudes *as if* they were objective truths.
  *   **Relativist Preference:** Moral truth is fundamentally relative to individuals/cultures.

  **VI. Brief Evaluation of Selected Theories Against Full Specification**

  *   **Error Theory:**
      *   **Strengths:** Explains disagreement (1) & variation (7) via universal error. Preserves norm/description distinction (6).
      *   **Weaknesses:** Utterly fails to explain phenomenological authority (2) (dismisses it as illusion), moral progress (3) (dismisses as non-moral change), genuine moral reasons (5) (denies existence). Struggles with normative inertia (4) - why persist in illusory commitments? Incompatible with moral reason distinction (5) by definition.
  *   **Constructivism (e.g., Kantian/Rawlsian):**
      *   **Strengths:** Explains authority (2) (arising from practical reason/agency) and moral reasons (5) (constituted by rational procedures). Can accommodate progress (3) (refinement of procedures/understanding) and distinguishes norms from description (6). Can handle inertia (4) via habituation/socialization aspects of agency.
      *   **Weaknesses:** Struggles with *deep* disagreement (1) - are all dissenters irrational? Faces challenges accounting for *full* force of cross-cultural variation (7) - are all differing procedures equally valid? May struggle with the *objectivity* intuitions sometimes linked to authority (2).
  *   **Robust Non-Naturalist Realism (e.g., Moorean/Platonic):**
      *   **Strengths:** Best captures phenomenological authority (2) and the genuine moral reason/motive distinction (5). Clear basis for moral progress (3) (better epistemic access) and preserves norm/description (6).
      *   **Weaknesses:** Significant difficulty explaining persistent disagreement (1) & cross-cultural variation (7) without invoking widespread error or epistemic fragility. Struggles profoundly with normative inertia (4) - why would irrational psychological persistence trump known non-natural facts? May struggle with integration with moral psychology (8).

  **Summary:** This specification sheet demands a theory that navigates the descriptive realities of disagreement, variation, and psychological inertia while preserving the core normative distinctions and phenomenology of morality. The primary tension lies between capturing the **objective-seeming authority** of morality and accommodating the **pervasiveness of deep disagreement**. Normative inertia adds a crucial psychological constraint, favoring theories that integrate moral commitment with non-rational (but not necessarily irrational) aspects of human psychology and sociality. Your hybrid framework must explicitly address these tensions, particularly Authority vs. Disagreement and the grounding of Moral Reasons amidst Variation and Inertia.
