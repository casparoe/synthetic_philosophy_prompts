  **Satirical Notes Embedded in Execution:**
  *   **"Organic Belonging" as Bureaucracy:** Turning Anderson's "imagined community" into a literal, auditable membership requirement based on unprovable affinity.
  *   **Codified "Ancient" Traditions:** Hobsbawm's "invented traditions" (like the 1996 dance) presented as mere administrative formalizations of inherent, ancient practices.
  *   **Heritage Audits for the Young:** Satirizes the nationalist burden of proving connection to a fabricated past you were born after.
  *   **Retroactive Geography:** Borders defined by modern "Resonance Fields" mapped *before* independence, projecting the nation backwards.
  *   **Language Policing:** Controlling terminology ("Re-Manifestation") to enforce the historical narrative.
  *   **Denial of Counter-Evidence:** Dismissing actual history as "temporal aberrations."
