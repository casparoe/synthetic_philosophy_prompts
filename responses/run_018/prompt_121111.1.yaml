  For their US audience, I'll avoid British idioms. The examples need to stay concrete (crisp packets, mince) but framed universally. Most importantly, I must resist solving the ethical dilemma—they want the phenomenon mapped, not resolved. The tension between collective impact and individual impotence must remain vivid.
answer: |-
  This phenomenon is well-established in moral philosophy and goes by several names—most prominently **"the problem of imperceptible effects"** or **"the futility paradox."** It's a specific subset of collective action problems where:

  1.  **The collective outcome is significantly harmful (or beneficial).**
  2.  **Each individual contribution is vanishingly small or seemingly causally irrelevant *to that specific outcome*.**
  3.  **The perceived futility of an individual act *increases* as the scale/settledness of the outcome increases.**

  **What it is (Precise Definition):**
  The phenomenon occurs when an agent reasons that their individual act (A) is morally permissible (or obligatory) *because* its causal contribution to a large-scale, pre-determined collective harm (or benefit) is imperceptible or null—and crucially, this reasoning gains apparent strength precisely *because* the collective harm is large and its occurrence is highly probable or certain. This creates the paradoxical situation where the moral reason to *refrain* from contributing to a large harm (or to contribute to a large benefit) appears weakest when the harm is greatest or the benefit is most needed.

  **Key Differentiating Features from Neighboring Concepts:**

  1.  **Vs. The "Drop in the Ocean" Argument (General Small Contribution):**
      *   **Similarity:** Both involve small individual contributions to large collective outcomes.
      *   **Difference:** The "drop in the ocean" argument focuses on the *size* of the contribution being negligible *regardless* of the state of the outcome. The phenomenon you describe focuses on the *causal irrelevance/non-difference-making* of the act *specifically because* the outcome is already large/settled. The perceived futility *intensifies* with the scale/settledness. Dropping a crisp packet *feels* more permissible in a littered park *because* the park is already littered, making your act seem causally inert regarding the *existing* mess, even though you are objectively adding to it.

  2.  **Vs. Imperceptible Harms Adding Up (e.g., Parfit's Harmless Torturers):**
      *   **Similarity:** Both involve tiny individual contributions combining into a large harm where no single act seems to make a perceptible difference.
      *   **Difference:** The classic "adding up" problem (like Parfit's torturers each turning a dial causing imperceptible pain that collectively causes agony) assumes the collective harm *would not occur* without the *sum* of the contributions. Your phenomenon specifically highlights cases where the harm *is already occurring or certain to occur*, making the *individual* act seem even *more* futile ("My one crisp packet won't *make* it messy; it already *is* messy"). The causal irrelevance feels *stronger* because the outcome is settled. The harm would exist *anyway* from other causes.

  3.  **Vs. Overdetermination (The Harm Would Happen Anyway):**
      *   **Similarity:** Both involve the outcome being guaranteed by other factors, making one individual's contribution appear redundant.
      *   **Difference:** Overdetermination typically involves a *specific* event being caused in multiple sufficient ways (e.g., two bullets hitting simultaneously). Your phenomenon applies to *ongoing, large-scale collective states* (litter, election results, meat consumption) where individual acts are *components* rather than specific causes. The key difference is the *scaling effect*: in overdetermination, redundancy is fixed; in your phenomenon, the *sense* of redundancy/futility *increases* as the collective harm grows or becomes more entrenched. Taking mince from the co-op fridge *feels* permissible *specifically because* the animals are *already* dead and the mince is *already* there.

  4.  **Vs. Threshold Effects / The Decisive Vote:**
      *   **Similarity:** Both involve analyzing whether an individual act makes a difference to an outcome.
      *   **Difference:** Threshold problems (like the knife-edge election) focus on situations where an act *can* be decisive *if* it crosses a threshold. Your phenomenon focuses on situations *far from any threshold* or where thresholds are irrelevant (like the litter or mince), where the act seems causally inert *because* the outcome is settled. The paradox is that the reason to act *weakens* as you move *away* from the threshold, even though the collective harm is larger or more entrenched.

  **Are the Two Things You Described One or Two?**

  They are **closely related but distinct aspects** of the same core phenomenon:

  1.  **The Vanishing Difference Paradox:** This is the core logical problem: the perceived causal inefficacy (and thus moral permissibility) of an individual act *increases* as the collective harm it contributes to becomes larger and more settled.
  2.  **The Argumentative Switch:** This is a *rhetorical* or *psychological* response *to* the vanishing difference paradox. When proponents of individual obligation realize their "you make a small difference" argument collapses under the weight of large-scale settled harms (like the littered park or the dead-animal mince), they instinctively switch to non-consequentialist arguments (duty, character, expression) to salvage the obligation. This switch often goes unmarked precisely because the futility paradox undermines the initial consequentialist reasoning so effectively. It's a symptom of the difficulty posed by the first phenomenon.

  **Boundaries:**

  *   **In Scope:** Situations involving large-scale collective harms/benefits where individual contributions are small components (pollution, consumption, voting in large electorates, resource depletion, mass behaviors).
  *   **Out of Scope:**
      *   Acts that directly and significantly cause harm/benefit alone (pushing someone off a cliff).
      *   Acts near decisive thresholds (your vote *could* decide a tied election).
      *   Acts where the harm/benefit is entirely individual and non-collective.
      *   Acts prohibited by strict deontological rules regardless of consequences (lying, killing an innocent).

  **Brother-in-Law's Distinction (Chance vs. Unknown Threshold):**

  Your intuition is correct; the distinction **does real work**. His "always some chance" argument relies on **epistemic uncertainty** (we never *know* for sure the outcome is settled). However, the problem arises even under conditions of **metaphysical certainty** or **determinism** (if we *could* know the outcome is fixed, like the mince is *already* bought and paid for, or the safe seat *will* be won by Party X by 20,000 votes). The perceived futility stems from the *actual causal structure* (your act doesn't change the *already determined* outcome), not just our lack of knowledge about it. His argument mitigates the *psychological* force of the paradox by injecting doubt, but it doesn't resolve the underlying *logical* problem for consequentialism in deterministic or overdetermined large-scale harms.

  **Conclusion:**

  You've precisely identified the **problem of imperceptible effects (or vanishing difference/futility paradox) within large-scale, settled collective harms.** It's distinct from general small contribution arguments, imperceptible harm summation, overdetermination, and threshold problems, though related. The "argumentative switch" you observe is a common, often unacknowledged, response to the intractability of this paradox within purely consequentialist reasoning. The core paradox highlights a significant challenge for act-consequentialism: if morality is solely about making the world better/worse, how do we account for individual acts that seem to make *no difference* to large, entrenched harms we collectively sustain? Resolving this often requires appealing to other ethical frameworks (rules, virtues, expressive actions) or refining how we understand collective causation and responsibility.
