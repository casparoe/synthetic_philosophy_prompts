  The brother-in-law's "uncertainty" counterargument doesn't satisfy them—and rightly so. It only works in probabilistic scenarios, not deterministic ones like their co-op example (where the mince is already bought). This shows the user has a sharp eye for distinctions. 

  Their core ask is precise: they want the phenomenon named, dissected, and differentiated from adjacent concepts (like "drop in the ocean" arguments or overdetermination). No hand-waving—they crave analytical rigor. 

  I recall Derek Parfit's "Harmless Torturers" thought experiment perfectly matches their littering scenario. The key insight is that individual contributions become imperceptible in large-scale harms, creating moral blind spots. The voting example is classic "threshold crosser" territory, while the co-op case involves "preference shaping." 

