prompt: |-
  me and my friend got into it last night over beers about the lucas-penrose thing — like, does it actually show minds arent algorithms, or is it just a cute self-reference trick that falls apart once you formalize it right? we kept going in circles so now im actually curious: if someone had like three years and a logic background to actually work on this, which open questions should they prioritize? is the real crux about whether machines can recognize their own consistency, or about human mathematicians having some special access to true-but-unprovable statements, or maybe about extending the argument to probabilistic or neural-style reasoners? rank them for me — not just heres whats open but why one is upstream of the others, which ones are tractable with current tools, and which are overrated dead ends. also my friend kept insisting the whole debate is dead because of LLMs, but that feels like a category error — should updating for modern computation even be part of the research agenda, or is it a distraction? defend the ordering, i dont want a bibliography.
reasoning: |-
