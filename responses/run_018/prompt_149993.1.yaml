answer: |-
  ### Essay Prompt  
  **Time:** 45 minutes | **Length:** ~800 words  
  **Question:** Analyze the moral and political implications of reframing **benefit fraud** not as *theft from taxpayers* but as a **breach of social contract** (akin to breaking a promise). Does this reframing:  
  (a) Transform welfare recipients’ moral status from *citizens* (with social rights) to *contractors* (bound by reciprocal duties)?  
  (b) Allow the state to justify harsher sanctions (e.g., benefit reductions, mandatory work programs) while avoiding explicit language about the "undeserving poor"?  

  **Tasks:**  
  1. Map the analogy: How does the "contractual breach" framing redefine the relationship between recipient and state?  
  2. Identify where the analogy collapses: What key elements of social citizenship cannot be captured by a contract model?  
  3. Argue whether this framing genuinely replaces dignity-based assumptions (e.g., inherent worth) with reciprocity, or merely hides those assumptions behind contractual language.  

  **Constraints:** Focus on conceptual precision—avoid historical examples or theorists. Engage with:  
  - The distinction between *theft* (property violation) and *breach* (promise violation)  
  - How "contractor" status alters entitlements and obligations  
  - Whether conditionality/fraud detection eliminates or reconfigures the "deserving/undeserving" distinction.  

  ---

  ### Model Answer (~600 words)  

  Reframing benefit fraud as a breach of social contract—rather than theft—fundamentally reshapes the moral relationship between welfare recipients and the state. This essay argues that while the contractual model superficially replaces the language of desert with reciprocity, it covertly reintroduces dignity-based judgments, transforms citizens into conditional contractors, and enables harsher sanctions by masking punitive logic as fairness.  

  **The Contract Analogy and Moral Transformation**  
  The "theft" frame treats benefits as collective property, positioning fraud as a crime against taxpayers. By contrast, the "breach" frame treats welfare as a reciprocal exchange: the state provides support *in return for* the recipient’s honest compliance with terms. This shifts the recipient’s status from *citizen-holder of rights* to *contractor-party to an agreement*. Citizens possess inherent claims to social rights (e.g., subsistence), whereas contractors earn entitlements through performance. Fraud thus becomes a failure of reciprocity (breaking promises), not an assault on communal resources. This reframing appears neutral—sanctions for breach seem fair, not punitive.  

  **Collapse of the Analogy**  
  The contract model collapses where citizenship’s core elements resist contractualization:  
  1. **Non-voluntariness**: Social contracts are hypothetical; welfare claimants don’t negotiate terms. Unlike contractors, they lack alternatives to "accepting" state conditions.  
  2. **Dignity vs. Deservingness**: Contractual reciprocity smuggles in dignity judgments. A "breach" implies moral failure (bad faith), not just practical error. The state demands *virtuous conduct* (e.g., "active job-seeking") as a condition for aid—directly importing the "deserving poor" criterion (worthy via compliance) while denying its role.  
  3. **Power asymmetry**: Contracts imply equal parties, but the state unilaterally imposes sanctions. A contractor can sue for unfair terms; a recipient cannot.  

  **Covert Persistence of the Undeserving Poor**  
  The contractual frame does not eliminate the deserving/undeserving binary—it operationalizes it through behavioral conditions. Fraud detection focuses on individual compliance (e.g., undeclared income), implying the "undeserving" are those who fail reciprocal duties. Harsher sanctions (e.g., multi-year bans) are justified as remedies for breach, not punishment for moral failing. Yet this is semantic evasion: withdrawing subsistence for breach is inherently punitive when survival is at stake. The state avoids labeling recipients "undeserving" but enforces that category by conditioning rights on "deserving" behavior (e.g., honesty, effort). Reciprocity talk obscures how dignity—once unconditional—now hinges on meeting state-defined obligations.  

  **Conclusion**  
  The contractual reframing transforms recipients into second-tier citizens: contractors whose rights are contingent and revocable. It enables stricter penalties by invoking fairness ("you broke the deal"), not moral judgment. However, this framing collapses under citizenship’s non-contractual realities and merely disguises the undeserving/deserving distinction as neutral contract enforcement. Conditionality doesn’t replace dignity with reciprocity—it subordinates dignity to compliance.  

  ---

  ### Marking Scheme  
  **A-Grade (85-100%)**  
  - **Precisely distinguishes theft vs. breach**: Theft = violation of property rights; breach = violation of reciprocal promise.  
  - **Identifies moral status shift**: Citizen (rights-bearer) → Contractor (duty-bearer earning entitlements).  
  - **Exposes hidden normative premise**: Reciprocity language covertly demands "deserving" behavior (e.g., honesty/effort) as condition for dignity.  
  - **Demonstrates collapse**: Explains irreducibility of social rights to contracts (non-voluntary, asymmetric power, dignity).  
  - **Critical evaluation**: Shows sanctions for "breach" are punitive when survival is conditional; proves "deserving/undeserving" persists via behavioral gatekeeping.  

  **B-Grade (70-84%)**  
  - Distinguishes theft/breach but lacks depth on moral implications.  
  - Notes status shift but doesn’t articulate how it alters rights/obligations.  
  - Identifies reciprocity as a justification for sanctions but misses its role in smuggling in desert.  
  - Deserves collapse points but doesn’t link to citizenship’s core features.  
  - Recognizes conditionality reframes desert but doesn’t argue how/why it hides dignity judgments.  

  **C-Grade (50-69%)**  
  - Conflates theft/breach or treats fraud as synonymous with admin error.  
  - Vague on citizen/contractor distinction (e.g., "changes relationship").  
  - Superficial treatment of reciprocity; misses normative premises.  
  - Lists collapse points without analysis.  
  - Assumes contractual framing neutrally replaces desert.  

  **D/Fail (<50%)**  
  - Fails to map the analogy/collapse.  
  - Treats social rights as irrelevant (e.g., "benefits are a privilege").  
  - Conflates fraud with systemic misuse or claimant error.  
  - Ignores the state’s role in defining contractual terms/sanctions.  
  - Repeats prompt without analysis.  

  **Key Penalties**:  
  - **-15%**: Conflating fraud (intentional deceit) with administrative error or eligibility confusion.  
  - **-10%**: Ignoring asymmetry of power (state imposes terms unilaterally).  
  - **-10%**: Treating social rights as discretionary gifts, not foundational entitlements.  
  - **-5%**: Vagueness on "deserving/undeserving" (must specify behavioral criteria).
