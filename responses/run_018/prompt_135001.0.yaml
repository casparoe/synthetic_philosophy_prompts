  Hmm, they're clearly well-versed in art world practices and have a philosophical bent. The way they frame the question—asking about "deep metaphysics" versus "mere market rules"—suggests they've already pondered this deeply. I should avoid oversimplifying. Their core tension seems to be: why does physical origin matter so much for paintings when it doesn't for music or literature?

  First, I need to reconstruct the implicit theory. The institutional behavior screams "ontological contextualism"—that the artwork isn't just pigment on canvas but a historical artifact. The forgery isn't rejected for being visually deficient, but because it's a modern object masquerading as a 17th-century one. Meanwhile, the misattributed piece still *is* a 17th-century object, just not by Rembrandt's hand. That distinction hinges entirely on causal history.

  But wait—the user's comparison to other media is spot-on. Why don't we care about Beethoven's original manuscript when we listen to a recording? Because music and literature are ontologically different; they're type-artworks where instances can be authentic without physical lineage. Paintings are token-artworks. That explains the discrepancy without metaphysics.

  The fraud angle matters too though. Museums can't display forgeries without becoming complicit in deception, whereas reattribution is scholarly correction. But the user seems skeptical this explains the visceral rejection of forgeries—that "corruption" idea they mentioned. Benjamin's "aura" concept might help here: forgeries lack the aura of temporal distance even if visually identical.

  If we switched to a purely perceptual theory of value... whoa, that would upend everything. Museums would become more like galleries where only appearance matters. Rembrandt's workshop pieces might get equal billing to autograph works. But could that ever satisfy our hunger for the "real"? Probably not—witness the queues for the Mona Lisa versus any flawless reproduction. The desire for authentic encounter seems baked into how we experience art.

  The user's unspoken question might be: "Is our art valuation irrational?" My answer would be—not irrational, but layered. We're not just evaluating surfaces; we're connecting with human history. That's why the forgery feels like a betrayal: it severs that connection. The misattribution? Just a paperwork error in the grand scheme of time.
answer: |-
  Your observation cuts to the heart of art ontology, authenticity, and institutional epistemology. The practice indeed reveals a coherent—though contested—philosophical framework. Let's reconstruct the implicit theory, examine its commitments, and explore alternatives.

  ### The Implicit Theory: **Authenticity as Causal-Historical Ontology**
  This practice presupposes that **the artwork is not merely the physical object but a unique historical event embodied in it**. The core tenets:

  1.  **Artwork as Action-Trace:** The painting is valued as a direct physical trace of a specific creative act by a specific individual (or workshop under direct supervision) at a specific historical moment. Its ontological status is inseparable from its origin.
  2.  **Intrinsic Value of Provenance:** The causal history ("provenance") isn't just evidence; it constitutes the work's identity. A "Rembrandt" is defined *by being made by Rembrandt*. Without that causal link, it's a fundamentally different kind of entity.
  3.  **Forgery as Ontological Poison:** A modern forgery isn't just *wrongly attributed*; it's a *counterfeit object*. It purports to be something it fundamentally *is not*—a 17th-century artifact. This falsifies its entire being, rendering it existentially corrupt and devoid of the core value institutions seek (historical testimony, authentic genius).
  4.  **Misattribution as Epistemic Error:** A work from Rembrandt's circle is still *genuinely* a 17th-century Dutch painting created within the master's immediate orbit. The mistake was scholarly (misidentifying *which* hand), not ontological (misidentifying *what kind of thing* it is). It retains its historical authenticity and context.

  **What it Strictly Requires vs. What Fits Well:**
  *   **Strictly Requires:** That the *primary* value driving institutional stewardship (beyond aesthetics) is **historical authenticity** – the object's status as a genuine witness to and product of a specific past time, place, and agency.
  *   **Fits Well (but not strictly required):**
      *   The "genius" theory of art (Rembrandt's unique hand is irreplaceable).
      *   Walter Benjamin's "aura" (the decay of authenticity through mechanical reproduction applies here to *temporal* dislocation in forgery).
      *   Art as a non-repeatable performance (the painting is the record of Rembrandt's unique, embodied performance).

  ### Consistency with Other Cultural Objects (Copies as Substitutes)
  This theory is *inconsistent* with how we treat type-based arts like music or literature, **precisely because it denies perfect substitutability for token-based arts like painting**:
  *   **Painting (Token Art):** Each instance *is* the work. No copy, however perfect, is the *Mona Lisa*. The physical object *is* the unique historical event.
  *   **Music/Literature (Type Art):** The work is an abstract structure (the score, the text). Instances (performances, printed books) are tokens *of* that type. A perfect copy (a printed book, a faithful recording) *is* a genuine instance of the work, carrying its full aesthetic and historical weight *as the work*. The original manuscript has value as a historical artifact, but the *work itself* is accessible through accurate tokens.
  *   **Why the Difference?** The implicit theory assumes painting is inherently token-based. Its value resides in the singular physical object *and* its unique causal history. Music/literature's value resides primarily in the repeatable structure, not the singular physical instantiation (though historical artifacts of creation have *additional* value).

  ### Replacing the Theory: Purely Perceptual/Experiential Value
  If institutions adopted the view that **artistic value resides solely in perceptible qualities and the viewer's experience, independent of origin**, practice would radically change:
  1.  **Forgery Display:** Skillful forgeries would be displayed prominently, labeled honestly ("Modern Forgery in the Style of Rembrandt, ca. 1950"). Their value would be judged purely on visual merit, technical skill, and their success in emulating the target style/effect. They might be studied for *how* they deceive.
  2.  **Reattribution Nuance:** "Circle of Rembrandt" vs. "Rembrandt" labels would matter less for display prominence. Works would be grouped by style, period, or visual impact, not primarily by authorship certainty. Scholarship would focus on *stylistic influence* and *technical execution* more than definitive attribution.
  3.  **De-Emphasis of Provenance:** Auction houses would downplay provenance as a primary value driver. Catalog entries would focus intensely on formal analysis, condition reports, and aesthetic impact. Prices would correlate more directly with perceived visual quality than with attributional certainty or historical pedigree.
  4.  **Focus on the Object Present:** Conservation would prioritize the *current* visual state over preserving original materials if interventions improved the perceptual experience (a controversial shift). Museums might embrace high-quality reproductions for study or display when originals are fragile.
  5.  **Challenges:** This would face resistance due to:
      *   **Loss of Historical Connection:** Severing the tangible link to the past diminishes the sense of encountering history directly.
      *   **Devaluation of Genius:** Dismissing the creator's unique contribution clashes with Romantic notions of art.
      *   **Ethical Concerns:** Displaying forgeries might still be seen as rewarding deception, even if labeled honestly.
      *   **Market Instability:** The art market relies heavily on scarcity and authenticity. Purely perceptual value is highly subjective and harder to commodify distinctly.

  ### Conclusion: The Enduring Power of the Causal Chain
  The institutional practice reveals a deeply held, often unspoken, commitment to **art as embodied history**. The physical object's causal origin is not merely informative; it is *constitutive* of the artwork's identity and core value (historical, testimonial, auratic). Forgery is rejected because it severs this essential causal link, creating a modern object falsely masquerading as a historical one. Misattribution is corrected because the object remains a genuine artifact of the relevant historical context.

  This view prioritizes the artwork as a unique historical witness over its purely visual properties. While consistent within the ontology of unique physical objects (token arts), it fundamentally conflicts with how we value arts based on repeatable structures (type arts). Adopting a purely perceptual theory would democratize access and focus on immediate experience but would sacrifice the powerful sense of authentic connection to the past and the specific human hand that current museum and auction practices are built to preserve. The "corruption" sensed in forgery is indeed ontological – it's the creation of an object whose *very existence* is a lie about its historical being, unlike a misattributed work whose existence is genuine but mislabeled.
