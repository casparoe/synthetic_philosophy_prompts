prompt: |-
  I've been arguing with a friend about whether an advance directive is genuinely "me" instructing "me," or whether it is closer to one legal entity acquiring binding authority over another. I'm taking a course on medical ethics and find the standard framing of earlier-self versus current-interests debates somewhat tired, so I'd like a piece that treats the bureaucratic logic of personal identity over time as a continuity problem in contract law rather than as a metaphysical puzzle.

  Please write a satirical parody of an End-User License Agreement for a fictional digital platform called "Continuum"—a service that stores, authenticates, and enforces advance directives. The document should be formatted as numbered legal clauses (approximately 700 words), written in deadpan corporate-legal prose as if issued by the platform's "Identity Continuity Division." The satire should target the institutional practice of treating an earlier competent self as having absolute, contract-like authority over a later demented self, especially when the later self expresses contradictory preferences such as refusing nutrition or medication. To prevent the piece from feeling generic, inject a specific framing device: treat diachronic personal identity as governed by "intertemporal licensing contracts," complete with provisions for "personality continuity audits," "moral bankruptcy proceedings," and a "successor-self arbitration clause" triggered by neurological divergence. The humor should arise from pushing this bureaucratic metaphor to its logical extreme—for instance, defining "You" as the licensed rights-holder rather than the biological substrate, requiring biometric "continuity verification" before honoring a present objection, and specifying refund policies for cases in which the "upload" of prior values fails to integrate with current cognitive architecture. The piece should remain readable to someone unfamiliar with the bioethics literature, but it should be fair and immediately recognizable to anyone acquainted with debates about advance directives and the authority of the earlier self. Do not include bibliographies, citations, reading lists, or verbatim quotations from real philosophers or legal texts; paraphrase all concepts in invented contractual language.

  Please end the response with a one-sentence summary of the parody's central satirical point on its own final line, beginning with "Summary:".
