prompt: |-
  You’re a senior lecturer in ancient philosophy and exam design, and I need your help drafting a take-home essay for my upper-level Plato course. I want one question on Plato’s views on drunkennes — not the standard summary of Laws I-II on symposia that students could parrot from lecture notes. Instead, the question should force them to deal with a tension I’ve been thinking about: in the Laws the Athenian Stranger treats moderate drinking as a kind of social stress-test that reveals the true structure of citizens’ souls, almost like a diagnostic tool, while in the Symposium Alcibiades’ drunken entrance seems to function as a corruptive disruption that accidentally exposes truths about eros and Socratic self-mastery. I’d like the exam to ask whether Plato can consistently hold both that wine is philosophically useful for soul-testing and that it risks drowning reason, or whether the two texts are doing different jobs altogether.

  Please think carefully and start with a quick brainstorm of the crux. Then write the exam prompt itself: aimed at third-year undergraduates, about 1200 words, 48-hour window. After that, provide a model answer of roughly 600 words that actually resolves the tension rather than just describing both texts. Finally, give a marking scheme built around five must-hit points, with marks out of 20 total, plus a one-line note on the typical wrong move for each. The students don’t have library access, so don’t ask them to cite secondary literature or provide a bibliography — just reference specific books and lines from the Laws and Symposium if they recall them. Make sure the difficulty comes from having to construct the distinction, not from memorizing labels.
