  Okay, the user is a science and ideas journalist working on a feature about Montaigne's "Of Cannibals." They're focusing on a specific conceptual knot: Montaigne's mirror between Brazilian cannibals and European executioners. Both groups engage in ritual killing for honor and deal with human flesh, yet Europeans label the cannibals as barbaric. The user wants to move beyond the typical cultural relativism interpretation and explore what happens when modern institutional frameworks are applied. Specifically, they propose a scenario where European executions have legal consent and procedural safeguards, while the cannibal rites lack state-backed legitimacy.

  The user's main question is whether this institutional framing breaks the symmetry Montaigne sets up, revealing if "barbarism" is more about procedural form than the actual harm. They want a sharp conceptual example showing where descriptive cultural relativism (describing differences without judgment) becomes normative moral pluralism (asserting that different moral standards are valid). They also want a one-sentence summary at the end.

  First, I need to recall Montaigne's argument. He uses the cannibals as a mirror to critique European society, pointing out hypocrisy. The user is adding a layer: modern institutions like legal systems with due process. How does that affect the symmetry?

  The key is procedural legitimacy versus the act itself. Europeans might argue their executions are morally different because of legal frameworks. But does that justify calling the cannibals barbaric? The user wants to know if the symmetry collapses or if it exposes procedural bias.

  I should construct an example. Imagine both acts involve killing a captured enemy. Europeans do it after a trial with evidence, appeals, etc., while cannibals do it as part of a cultural or religious rite without such procedures. The harm—killing—is the same. Does the procedure change the moral judgment?

  This touches on moral philosophy: is morality about outcomes (the harm) or processes (how it's done)? Legal systems prioritize process, but from a harm-based view, both acts result in death. So labeling one as barbaric based solely on procedure might be inconsistent.

  The transition from descriptive to normative: Descriptively, we note the different procedures. Normatively, if we say the European way is morally better because of procedures, that's moral pluralism—implying that institutional processes justify the act, making it acceptable in one context but not the other.

  A sharp example: Both groups kill a prisoner. European method has a trial; cannibals have a ritual. If we condemn cannibals as barbaric but not Europeans, we're valuing procedure over the harm. This shows that "barbarism" is applied based on institutional alignment, not the act's nature.

  But what if the European system has flaws? The user specified "fully documented safeguards," so assume ideal conditions. Even then, the act of killing is present. The symmetry holds if we focus on the outcome, but collapses if we prioritize process. However, Montaigne's point might be that adding procedure doesn't change the core act, revealing hypocrisy.

  The user wants to highlight how descriptive relativism (acknowledging different practices) slips into normative pluralism (saying both are morally valid in their contexts). The example should force the question: If harm is equal, why is one barbaric? Unless procedure is a moral necessity, which then needs justification beyond culture.

  End with a one-sentence core point: The institutional framing reveals that accusations of barbarism often track adherence to familiar bureaucratic forms rather than the intrinsic violence of an act.
answer: |-
  Here's a conceptual knot tailored to your query, focusing on the procedural legitimacy injection:

  **The Conceptual Issue:** Imagine both acts involve the ritual killing of a captured enemy warrior.  
  *   **European Execution:** Guided by codified law. Requires evidence presented at trial, right to defense, appeal to a higher magistrate, confirmation by a sovereign body, and execution by a designated state officer following strict protocols. The killing and disposal (burning, burial, display) are documented.  
  *   **Cannibal Rite:** Guided by ancestral custom. Requires confirmation of enemy status by elders/warriors, ritual preparation by spiritual leaders, killing performed according to sacred formulae, and consumption governed by strict communal rules. Legitimacy stems solely from cultural/religious tradition, with no written code or external oversight.  

  **The Symmetry Test & Conceptual Slip:**  
  1.  **Descriptive Relativism (Starting Point):** We neutrally observe *that* both groups kill humans ritually for reasons of honour/justice within their own frameworks. The mirror holds descriptively: both acts involve sanctioned killing based on collective norms.  
  2.  **Injecting Institutional Framing:** You add the modern lens: only the European act has "state-backed legitimacy," "consent" (via legal fiction/representation), and "procedural safeguards."  
  3.  **The Normative Leap (The Slip):** If we now argue the European act is *morally distinct* (and thus escapes the "barbarism" label applied to the cannibals) **solely** because of its bureaucratic formality and state sanction, we make a critical shift. We move from *describing* different legitimizing frameworks to *prescribing* that only state-centric, procedurally complex, documented frameworks confer moral legitimacy. This is normative moral pluralism: we implicitly accept that "moral permissibility" is contingent on the *type* of institution (modern state vs. traditional community) performing an otherwise similar harmful act.  
  4.  **The Revealing Collapse (or Distortion):** The symmetry *appears* to collapse under this framing, but only because the framing itself smuggles in a **normative preference for state institutions**. It reveals that the charge of "barbarism" is often applied not primarily based on the *intrinsic harm* (ritual killing) or even the *underlying motive* (honour/justice), but on the **alien nature of the legitimizing structure**. The European act is "civilized" because its violence is mediated by familiar bureaucratic rituals (trials, paperwork, appointed officials), while the cannibal act is "barbaric" because its legitimizing rituals are culturally alien and non-state. The harm itself becomes secondary; the procedural form becomes primary for moral judgment.  

  **The Sharp Example:** Consider the moment of killing the captive. Both the state executioner and the cannibal warrior believe their act is just, necessary, and honorable within their worldviews. The institutional framing asks us to see the executioner's act as morally superior *because* a magistrate signed a paper after a formal proceeding, even if the outcome (death) and the core justification (collective honor/security) are fundamentally analogous. This forces the question: Does the procedural apparatus *genuinely* transform the moral nature of the killing, or does it merely provide a socially acceptable veneer for the same core violence? If the latter, then "barbarism" is exposed as a label applied to the "other's" method of legitimizing violence, not the violence itself.

  **Core Point:**  
  Montaigne's mirror, when filtered through modern institutional legitimacy, starkly reveals that accusations of barbarism often function as a cultural judgment on the *form* of violence-legitimizing rituals, not their violent substance.
