answer: |-
  Here’s your functional theory spec sheet – distilled, annotated, and tension-tagged. These desiderata reflect core challenges in philosophy of biology, grounded in real cases and theoretical constraints.

  ---

  ### **I. Cases the Theory MUST Cover**
  1. **Normal Operation** (e.g., heart pumping blood)  
     *Why*: Any theory failing here is non-starter. Must explain paradigmatic functions.  
  2. **Clear Malfunction** (e.g., arrhythmic heart)  
     *Why*: Requires distinguishing *broken function* from *non-function*.  
  3. **Accidental Side-Benefits** (e.g., bloodflow’s warmth)  
     *Why*: Must exclude effects that aren’t "functions" despite being beneficial.  
  4. **Evolutionary Novelty** (e.g., human brains doing math)  
     *Why*: Functions can exist without historical selection *for that task*.  
  5. **Borrowed Function** (e.g., horizontally acquired toxin-digesting enzyme in gut bacteria)  
     *Why*: Genes/structures can perform roles *never selected for in their current lineage*.

  ---

  ### **II. Distinctions the Theory MUST Maintain**
  1. **Proper Function vs Current Causal Contribution**  
     *Why*: A broken pacemaker still has the *function* of regulating heartbeat, even if it’s currently shocking the patient.  
  2. **Selected Effect vs Fitness-in-Context**  
     *Why*: What a trait *was* selected for ≠ what *currently* enhances fitness (e.g., feathers for insulation vs flight).  
  3. **Dysfunction vs Mere Absence**  
     *Why*: A blind cavefish has *dysfunctional* eyes; a jellyfish lacks eyes entirely. Only the former implies "failure."  

  ---

  ### **III. Biological Results It CAN’T Contradict**
  1. **Developmental Plasticity** (e.g., sweat glands adapting to heat)  
     *Why*: Functions can emerge from plasticity without direct selection.  
  2. **Exaptation** (e.g., feathers co-opted for flight)  
     *Why*: Functions can shift radically from original selection.  
  3. **Convergent Evolution** (e.g., camera eyes in octopus vs human)  
     *Why*: Identical functions can arise from distinct histories.  
  4. **Microbiome Functional Redundancy** (e.g., multiple bacterial species digesting fiber)  
     *Why*: Functions aren’t lineage-bound; can be performed by non-inherited entities.  

  ---

  ### **IV. Puzzles to Dissolve**
  - **Swampman**: An organism assembly via lightning with no evolutionary history but identical causal roles to humans. *Does its "heart" have a function?*  
  - **Overperforming Organs**: A liver that detoxifies novel synthetic toxins *better* than its selected targets. *Is detox its function?*  
  - **Engineered Misfits**: A CRISPR-edited gene performing a vital role it was *not* designed for. *When does it "acquire" function?*  

  ---

  ### **V. Tension Points: Jointly Unsatisfiable Desiderata?**
  | **Conflict**                          | **Why Tension Arises**                                                                 |
  |---------------------------------------|----------------------------------------------------------------------------------------|
  | **Historical Fidelity vs Present Contribution** | Covering novelty/borrowed functions requires downplaying history; explaining malfunction requires history. |
  | **Selected Effect vs Fitness-in-Context**       | Exaptation requires decoupling original selection from current utility; malfunction relies on historical norms. |
  | **Lineage-Boundedness vs Microbiome Cases**     | Horizontal gene transfer & symbionts break lineage-specific histories; etiological theories struggle here. |

  ---

  ### **Brief Scoring (Per Your Request)**
  - **Etiological (Selected Effects)**:  
    ✅ Excels at malfunction, normal operation, selected effect distinctions.  
    ❌ Fails novelty, borrowed functions, plasticity, microbiome cases.  
  - **Causal-Role (Systemic Contribution)**:  
    ✅ Handles novelty, plasticity, convergence, microbiome.  
    ❌ Struggles with malfunction, side-benefits, proper function distinctions.  

  ---

  ### **Weakest Link & Revision Triggers**
  - **Least Committed Desideratum**: **Borrowed Function** (V.5).  
    *Why*: It’s edge-case driven; horizontal transfer *might* be resolved by expanding "lineage" to include gene networks.  
  - **Empirical Trigger for Revision**:  
    Discovery of **engineered synthetic symbionts** performing essential host functions *without any history of selection* (e.g., lab-created mitochondria analogs). This could force either:  
    (a) Expanding "selection history" to include *designed* teleology, or  
    (b) Abandoning historical criteria entirely for systemic role.  
  - **Where Reasoning Fails**:  
    Overestimating **trait lineage boundedness**. If HGT/symbiosis proves *ubiquitous* in core functions (e.g., >50% of metabolic pathways hybrid), etiological accounts collapse. Causal-role then struggles to exclude arbitrary beneficial effects without history.

  ---

  ### **Recommendation**  
  Both theories fail your spec sheet. Hybrids (e.g., *modern etiology* incorporating plasticity, or *constrained causal-role* with "selected-for-backup" criteria) exist but add complexity. **Pragmatic take**: Use etiological for pathology/conservation (history matters), causal-role for novelty/symbiosis (current context dominates). Your choice hinges on whether you prioritize *explaining malfunction* or *explaining innovation*.
