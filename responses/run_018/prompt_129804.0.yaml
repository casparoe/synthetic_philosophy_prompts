  i was arguing with a friend about Putnam's twin earth thing and we got stuck on whether semantic externalism should apply to mental states that dont have clear physical correlates — like 'regret' or 'suspicion' — and also to empty concepts that never actually get instantiated in either world. so i want the full spec: write the desiderata that any adequate theory of mental/content determination has to meet if its going to cover both natural-kind terms and these weirder psychological or empty ones. 

  i need the requirements list — the cases it must get right (twin earth water, twin earth 'justice', first-person reports of doubt), the distinctions it cant collapse (narrow vs wide content, first-person authority vs third-person ascription, empty vs non-empty), and the constraints from philosophy of language or mind it cant violate. for each, say why its non-negotiable or just a camp preference, and flag any pair you think are jointly unsatisfiable — i'm especially suspicious that preserving first-person authority while letting environment fully determine content is going to blow up somewhere. then briefly score how pure causal-historical pictures, descriptivism, and two-dimensional views do against the list, but dont spend too long on that part; i mainly want the criteria spelled out with the motivating case behind each one.
