answer: |-
  Here’s the comprehensive desiderata for a theory of mental/content determination, structured for your debate. I’ll flag tensions, non-negotiables, and score major approaches concisely.

  ---

  ### **Core Desiderata for a Theory of Mental Content**

  #### **I. Cases Any Adequate Theory Must Handle**
  1. **Twin Earth Natural Kinds (e.g., water/H₂O vs. XYZ)**  
     - *Why non-negotiable*: The original Putnam case tests whether meaning is determined internally or by external reality. A theory must explain why Oscar and Twin Oscar refer to different substances despite identical internal states.  
     - *Motivating case*: Intuition that "water" means H₂O on Earth, XYZ on Twin Earth.

  2. **Twin Earth Abstract/Evaluative Terms (e.g., "justice")**  
     - *Why non-negotiable*: Tests if externalism applies beyond natural kinds. If Twin Earth has a society where "justice" means *majority tyranny*, does Oscar’s "justice" concept differ?  
     - *Motivating case*: Preserving objectivity in ethics/semantics without reducing values to physical kinds.

  3. **First-Person Reports of Doubt/Regret (e.g., "I doubt X")**  
     - *Why non-negotiable*: Mental states without clear referents (e.g., regret) challenge externalist "anchoring." A theory must explain how self-ascription works without external correlates.  
     - *Motivating case*: I can sincerely report "I regret X" even if X is non-existent or misremembered.

  4. **Empty Concepts (e.g., "unicorn", "phlogiston")**  
     - *Why non-negotiablе*: Meaning isn’t canceled by reference failure. "Unicorn" isn’t meaningless just because unicorns don’t exist.  
     - *Motivating case*: We reason coherently about non-existent entities (e.g., mythological debates).

  5. **Social Constructs (e.g., "money", "marriage")**  
     - *Why critical*: These lack physical essences but depend on collective practices. Tests if externalism requires *natural* kinds.  
     - *Motivating case*: "Money" means different things in capitalist vs. barter societies.

  #### **II. Distinctions That Must Be Preserved**
  1. **Narrow Content (internal) vs. Wide Content (external)**  
     - *Why non-negotiable*: Psychological explanation (e.g., why Oscar and Twin Oscar *behave* identically) requires narrow content. Truth-conditions (e.g., whether "water" quenches thirst) require wide content.  
     - *Risk of collapse*: Eliminating narrow content undermines rationality explanations; eliminating wide content loses objectivity.

  2. **First-Person Authority vs. Third-Person Ascription**  
     - *Why non-negotiable*: I typically know my own thoughts (e.g., "I suspect X") without evidence, but others infer my mental states from behavior/environment. Collapsing this invites skepticism about self-knowledge.  
     - *Tension with externalism*: **HERE’S THE BOMB YOU SUSPECTED:** If environment fully determines content, how can I know my mind *a priori*? (e.g., I might be a brain in a vat referring to nothing).

  3. **Empty vs. Non-Empty Concepts**  
     - *Why non-negotiable*: Empty concepts lack referents but have sense/structure (e.g., "unicorn" = horse-like, horned). Blurring this collapses the distinction between reference failure and meaningfulness.

  4. **Individual Competence vs. Sociolinguistic Norms**  
     - *Why critical*: I can misuse "elm" (calling a beech "elm") but still refer to elms via linguistic community. A theory must balance idiolect and communal norms.

  #### **III. Theoretical Constraints**
  1. **Linguistic Universality Constraint**  
     - *Requirement*: The theory must apply uniformly to all terms (natural kinds, sensations, abstracta, empty terms).  
     - *Violation example*: Externalism working only for natural kinds is *ad hoc*.

  2. **Mental Continuity Constraint**  
     - *Requirement*: Similar internal states should correlate with similar psychological roles (e.g., Oscar/Twin Oscar’s identical "water"-thoughts cause identical behavior).  
     - *Violation example*: If content radically differs despite identical neurology, psychology becomes ungrounded.

  3. **No Magic Content**  
     - *Requirement*: Content must supervene on physical/facts + intentional stance. No primitive "meanings."  
     - *Violation example*: Cartesian dualism.

  ---

  ### **Tensions & Trade-offs**
  - **Nuclear Tension: First-Person Authority + Environmental Determination**  
    *Why it blows up*: Externalism ties content to environment, but first-person authority assumes direct, non-empirical access to one’s thoughts. If content depends on external facts I might not know (e.g., whether I’m on Earth or Twin Earth), I can’t know my own thoughts incorrigibly.  
    *Possible escape*: Distinguish *vehicle* (internal state, known introspectively) from *content* (determined externally, known empirically). But this risks bifurcating the mind.
    
  - **Other Tensions**:  
    - Preserving narrow content for psychology vs. wide content for truth-conditions.  
    - Handling empty concepts (requiring internal structure) vs. externalist direct reference (requiring referents).

  ---

  ### **Quick Scorecard: Major Theories**
  | **Criterion**              | **Causal-Historical (Putnam/Kripke)** | **Descriptivism (Frege/Russell)** | **Two-Dimensionalism (Chalmers/Jackson)** |
  |----------------------------|--------------------------------------|-----------------------------------|------------------------------------------|
  | Twin Earth water           | ✅ (Paradigm case)                   | ❌ (Fails if descriptions match) | ✅ (1st dimension: same intension)       |
  | Twin Earth "justice"       | ❓ (Depends on social externalism)   | ✅ (Fixed by descriptions)       | ✅ (Handles via primary intension)       |
  | First-person reports       | ❌ (Content external, not self-known)| ✅ (Content internally accessible)| ⚠️ (1st dimension introspectible)       |
  | Empty concepts             | ❌ (No referent → no content?)       | ✅ (Sense without reference)     | ✅ (Primary intension defines concept)   |
  | Narrow/wide distinction    | ❌ (Denies narrow content)           | ✅ (Narrow = descriptive content)| ✅ (1st = narrow, 2nd = wide)            |
  | First-person authority     | ❌ (Content externally fixed)        | ✅ (Internally accessible)       | ⚠️ (1st dimension preserves authority)  |
  | **Major Weakness**         | Fails empty concepts & self-knowledge| Fails Twin Earth cases           | Overly complex; splits content           |

  ---

  ### **Conclusion**
  - **Non-negotiables**: Twin Earth natural kinds, empty concepts, first-person reports, narrow/wide distinction.  
  - **Camp preferences**: Whether abstract terms *must* be externalist (e.g., moral realists vs. non-cognitivists).  
  - **Hairiest problem**: **First-person authority vs. externalism**. Two-dimensionalism offers the best (but imperfect) mediation by separating epistemic and metaphysical content. No theory perfectly satisfies all desiderata—hybrid approaches are likely needed, especially for psychological states like regret (which may require *functional role* + external anchors).

  Let me know if you want to deep-dive into a specific tension or alternative frameworks!
