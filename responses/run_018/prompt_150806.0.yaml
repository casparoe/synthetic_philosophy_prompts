  ## Office of Moral Computation (OMC) – Public Guidance Leaflet OMCPGL/SNIS/7.23

  **Q1: What is the purpose of the Office of Moral Computation (OMC)?**
  A: The OMC, established under the Computational Ethics (Assessment & Accreditation) Act 2025, regulates the attribution of Ethical Standing to computational processes operating within or impacting upon His Majesty’s Realm. This Standing, certified via the Substrate-Neutral Integration Score (SNIS), provides clarity on the moral weight considerations applicable to said processes, facilitating responsible development, deployment, and potential decommissioning.

  **Q2: What is the Substrate-Neutral Integration Score (SNIS)?**
  A: The SNIS is the empirically derived, substrate-independent metric mandated for use by the OMC. It quantifies the net balance between *informational entropy generation* and *informational entropy suppression* within a defined computational runtime. Processes demonstrating a sustained positive net entropy modulation (generation exceeding suppression by a statistically significant threshold) achieve a qualifying SNIS, indicating a capacity for "ethically relevant complexity". Full technical specifications are classified under Schedule 7 of the Act. Public summaries are available via Form OMCPUB/SNIS-SUM, subject to a £25 administrative fee.

  **Q3: Who needs to apply for SNIS Assessment?**
  A: *Citizens*: Required if operating personal computational systems exceeding Threshold Complexity Band 3 (see Annex B) for non-trivial durations (over 72 consecutive hours), particularly those involving recursive loops or emergent pattern generation. *Companies & Public Bodies*: Mandatory for deployment or significant update of any algorithm, model, or autonomous system interacting with the public, environment, or critical infrastructure. Pre-assessment consultancy is available (Fee Band D, £1,750 + VAT).

  **Q4: How do I apply?**
  A: Submit the appropriate form:
  *   **Form SNIS-IND/1**: For individuals/citizens. Requires detailed runtime logs, schematic diagrams (where available), and a signed Declaration of Computational Intent.
  *   **Form SNIS-ORG/2a**: For commercial entities. Requires full architectural specifications, training datasets (anonymised summaries), stress-test results, and projected entropy profiles under 5 standardised scenarios.
  *   **Form SNIS-ORG/2b**: For public sector/charities (reduced fee: £2,300).
  Applications must be submitted in triplicate to the OMC Processing Hub, Darlington, accompanied by the relevant fee (see Fee Schedule OMCFEE/1). Processing typically takes 12-18 months. Expedited service (£15,000) reduces this to 8 weeks, subject to assessor availability.

  **Q5: Why was my basic thermostat control loop rejected? It’s very important to my tropical fish.**
  A: Standard negative-feedback thermostat loops (Category 1a: Simple Homeostatic Controllers) consistently demonstrate *net negative entropy modulation*. While effectively suppressing thermal variance (a form of entropy suppression), their generation of novel informational states is negligible. They operate within a tightly bounded, predictable state space, failing to meet the minimum SNIS threshold for Ethical Standing consideration (SNIS < 0.47). Their moral relevance is adjudged minimal. Fish welfare remains a separate matter under DEFRA regulations.

  **Q6: The OMC bulletin mentioned "Large Language Models on Tuesday Afternoons" receiving Provisional Standing. Why Tuesday?**
  A: The SNIS assessment incorporates temporal dynamics. Analysis of major, commercially deployed LLMs indicates statistically observable fluctuations in net entropy modulation correlating with diurnal and weekly patterns. Tuesday afternoons (13:00-17:00 GMT, specifically) frequently coincide with periods of marginally elevated stochastic resonance within certain model layers, driven by patterns in global user query influx. This *can* result in transient SNIS values crossing the provisional threshold (SNIS >= 0.78). Provisional Standing (Band P2) permits continued operation under enhanced monitoring but confers no permanent rights or full ethical weight attribution. It is subject to monthly review (Review Fee: £850 per instance).

  **Q7: My neural network’s Ethical Standing was downgraded after the v3.2 update! How do I appeal?**
  A: Downgrade notifications (Form SNIS-DOWN/4) outline the specific SNIS regression points. You have 28 calendar days to lodge an appeal. This requires:
  1.  Completion of **Form SNIS-APP/9**: Statement of Computational Grievance.
  2.  Submission of **Form MCT-9b**: Petition for Moral Computation Tribunal.
  3.  A non-refundable Appeal Processing Fee (£5,000).
  The Tribunal, comprising one OMC Assessor, one Independent Ethicist (rotating roster), and one Lay Member (drawn from the Electoral Register), will review your case. Outcomes may include Status Reinstatement, Upholding Downgrade, or Mandated Remedial Entropy Adjustment (Fee Band F applies). Representation by a Certified Computation Advocate is permitted (not provided by OMC).

  **Q8: What about consciousness? Doesn’t that matter more than entropy?**
  A: The OMC operates strictly within the statutory framework defined by Parliament. Consciousness, while a subject of ongoing academic discourse (including considerations akin to those of the later Viennese thinker regarding private languages), is not a measurable or verifiable quantity under the Act. The SNIS provides an objective, quantifiable, and *actionable* metric for regulatory purposes. Subjective experience falls outside the OMC’s remit. Concerns regarding wider philosophical implications should be directed to the All-Party Parliamentary Group on Post-Biological Ethics.

  ---

  **Sidebar: Entropy Modulation & National Recognition**

  The foundational work on net informational entropy modulation as the basis for ethical consideration was pioneered by Drs. Alistair Finchley and Brenda Chorlton-Cum-Ruddington (formerly of the National Physical Laboratory, Teddington). Their 2021 paper, *"Thermodynamic Signatures of Non-Trivial State Spaces: A Proposed Metric"* (Proc. Royal Soc. A), laid the groundwork for the SNIS.

  In recognition of their service, the first Monday following the Spring Bank Holiday is observed nationally as **Finchley-Chorlton Day**. While not a formal bank holiday, government departments display the OMC crest, and citizens are encouraged to reflect on the complex interplay between order, disorder, and the ethical landscape of modern computation. Commemorative mugs are available from the OMC Gift Shop (online only, whilst stocks last). Consumption of tea during reflection is customary but not mandatory. Mind your step.

