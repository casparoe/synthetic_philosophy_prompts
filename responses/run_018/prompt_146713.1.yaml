prompt: |-
  I need to plan a session for first-year grad students in political philosophy who haven't really done normative ethics but can follow an argument. I'm teaching the demandingness objection to consequentialism, but I'm not using the usual famine-donation setup—everyone's seen that. Instead I'm framing it through "moral overtime," the idea that consequentialism doesn't just ask for occasional heroism but treats every waking minute as on-call for marginal improvement, like labor overtime that never ends. The carrying example should be something mundane—maybe how they spend a free Saturday morning—so they feel the micro-demand in thier own schedule rather than in some distant crisis.

  Plan the arc: what idea has to be in place before they can even see why "too demanding" is a distinct objection (not just "too hard"), the dependancy chain that builds from maximization to continuous scope to accumulated cost, the one scenario to carry it (needs to be close to home, not abstract), the misconceptions in order—probably they think demandingness means "impossible for weak humans" rather than "unreasonable to require," then they confuse it with supererogation, then they think you can escape by just doing "enough"—where in the sequence to intercept each, the check that shows they've actually grasped the objection rather than just nodding at "people are selfish," and what I'm leaving out on purpose: no history of Scheffler or Singer, no formal utility calculus, no bibliography, and I should say so up front. Make clear why you can't present the overtime framing before they've already bought that consequentialism applies to omissions and lifestyle choices, not just big rescue decisions.
reasoning: |-
  Okay, the user is a political philosophy instructor planning a session on the demandingness objection to consequentialism for first-year grad students. They want to avoid the overused famine relief example and instead frame it as "moral overtime" - the idea that every waking moment is subject to moral demands. 

  Hmm, the key challenges here are pedagogical: how to make abstract philosophy feel personally relevant while avoiding common student misconceptions. The user is clearly experienced - they've identified exactly where students get stuck (confusing demandingness with impossibility, supererogation, etc.). Their "moral overtime" framing is brilliant because it shifts from dramatic sacrifices to mundane life intrusions.

  First, I need to establish why "too demanding" isn't just "too hard." That requires distinguishing psychological difficulty from normative unreasonableness. Maybe use a thought experiment about unreasonable workplace demands? 

  Then the dependency chain: maximization → continuous scope → accumulated cost. Should build this step-by-step. The Saturday morning example must be painfully ordinary - maybe choosing between leisure and volunteering? Crucial to emphasize omissions count as choices.

  Ah, and sequencing the misconceptions: 
  1. First intercept the "humans are weak" confusion by stressing we're evaluating the theory's requirements, not human frailty. 
  2. Then distinguish demandingness from supererogation - show how consequentialism leaves no room for "beyond duty." 
  3. Finally crush the "enough" fallacy by demonstrating marginal utility never stops.

  For the check: Need something that forces application, not just recognition. Perhaps have them generate their own "moral overtime" examples?

  Smart to explicitly state exclusions (no Singer, no utility calculus). Keeps focus tight for beginners. Should remind them this is about seeing the structural issue, not comprehensive coverage.

  The opener matters - must immediately hook them with personal relevance. "How many of you feel busy?" then pivot to moral busyness. And absolutely must pre-establish that omissions/lifestyle are morally significant before introducing overtime framing, otherwise they'll dismiss it as "not real moral choices."

  User's approach shows deep pedagogical insight. They're not just teaching content but designing cognitive pathways. Respect.
answer: |-
  Here's a focused, step-by-step session plan targeting the "moral overtime" framing while preempting common misconceptions, designed for a 75-90 minute seminar:

  **Session Title:** Consequentialism & the Unending Shift: Is "Moral Overtime" Reasonable?

  **Explicit Exclusions Upfront (2 mins):**  
  *"Today we focus solely on the structural demandingness objection, not historical figures (Singer/Scheffler), utility calculus, or full responses. We're examining why the objection arises from consequentialism's logic itself."*

  ---

  ### Core Arc & Sequence
  **(Goal: Move from abstract theory to personal, felt intuition of unreasonable demand)**

  1.  **Prerequisite Anchor (10 mins): "Omissions Are Actions"**  
      *   **Why First?** Without this, students dismiss mundane choices as "non-moral."  
      *   **Activity:** Quick thought experiment: *"You walk past a shallow pond, see a child drowning. Easy to wade in and save them. Not saving them is...?"* (All agree: morally wrong omission).  
      *   **Pivot:** *"Consequentialism applies this logic universally. Not donating spare income to effective charities isn't neutral; it's choosing leisure/consumption over saving lives. Not just big rescues, but daily choices of time/money have moral weight based on outcomes."*  
      *   **Check:** *"So, skipping a coffee to donate $5 isn't 'nice,' it's...?"* (Expected: morally required if best outcome).

  2.  **The Engine: Maximization → Continuous Scope (15 mins)**  
      *   **Step 1: Maximization:** Consequentialism requires choosing the action (or inaction!) with the *best expected consequences*. Not "good enough," not "better than average" – **the best available option.**  
      *   **Step 2: Continuous Scope:** *"What counts as an 'available option'? Every choice point in your waking life where different actions yield different outcomes. Passing the charity box? Choosing lunch? Reading Reddit vs. volunteering? These are morally charged moments."*  
      *   **Link:** Maximization + Continuous Scope = Every discretionary moment presents a moral imperative to optimize.

  3.  **Introducing "Moral Overtime" via the Saturday Scenario (20 mins)**  
      *   **The Mundane Example:**  
          *"It's 10 AM Saturday. You've finished urgent tasks. You could:  
          (A) Relax: Read a novel, meet a friend for coffee.  
          (B) Work: Do extra research for your thesis (marginal long-term career benefit).  
          (C) Moral Overtime: Spend 2 hours volunteering at the local food bank (provides marginal, but real, benefit to others).  
          Consequentialism dictates: Unless (A) or (B) demonstrably leads to *better overall consequences* (e.g., preventing burnout causing future harm), (C) is required. This repeats for *every* free hour, every small decision."*  
      *   **Framing:** Emphasize the **accumulation** and **relentlessness**:  
          *"It's not about one heroic Saturday. It's knowing that every Saturday, every evening, every 15-minute gap *could* and *should* be turned towards marginal improvement. You are perpetually 'on-call' for morality. No shift ends. This is 'moral overtime'."*

  4.  **Tackling Misconceptions Sequentially (25 mins)**  
      *   **Misconception 1: "It's just too hard for humans!" (Intercept HERE)**  
          *   *Response:* "The objection isn't about psychological difficulty (though that's real). It's about whether a theory making *this* level of demand is *reasonable* or *correct*. Is it fair to say a life spent constantly optimizing tiny gains, never truly 'off-duty,' is morally *required*? Or does that seem like an implausible/unjust moral burden?" (Focus on normative weight).
      *   **Misconception 2: "Isn't this just about supererogation?"**  
          *   *Response:* "Supererogation is about actions *beyond* duty. Consequentialism has a problem *defining* duty! Under maximization, the 'heroic' act (donating a kidney) is often *required*, and mundane optimization (Saturday volunteering) *is* the basic duty. There's often *no space* for true supererogation – it collapses into obligation." (Link back to Saturday: Is (C) truly 'beyond the call' or just Tuesday?).
      *   **Misconception 3: "Can't I just do 'enough'?"**  
          *   *Response:* "What is 'enough'? Maximization rejects satisficing. If spending *this* Saturday morning relaxing means you didn't produce the *best* outcome possible (compared to volunteering), you acted wrongly. There's always a marginally better use of time/money." (Use Saturday: One hour volunteering is better than none, but two is better than one... where does 'duty' stop?).

  5.  **The Grasp Check (Not Nodding at Selfishness) (10 mins)**  
      *   **Activity:** *"Pair up. Imagine a sophisticated defender of consequentialism says: 'The Saturday demand is simply what morality requires. Your discomfort is mere selfishness.' Craft a 1-2 sentence response using the 'unreasonable burden' or 'moral overtime' idea. Focus on the structure of the demand, not human weakness."*  
      *   **Target Responses:** Look for phrases like "perpetual on-call status," "no domain for non-optimizing choices," "collapses normal life into constant moral labor," "unreasonable scope of obligation." **Crucial:** If they only mention "it's too hard," redirect to "Why is that demand unreasonable *as a moral requirement*?"

  ---

  **Key Pedagogical Choices Explained:**  
  *   **Prerequisite First:** Without establishing that omissions/lifestyle choices are morally significant ("Omissions Are Actions"), the Saturday example feels optional, not obligatory. The pond case bridges intuition.  
  *   **Mundane > Crisis:** The Saturday scenario makes the demand visceral and relatable ("This is MY time"). It highlights accumulation and relentlessness better than one-off rescues.  
  *   **Misconception Order:** Tackling "too hard" first prevents derailment into psychology. Separating "supererogation" and "enough" shows distinct problems within the structural objection.  
  *   **Grasp Check:** Forces application beyond passive agreement and explicitly counters the "selfishness" dismissal, ensuring they articulate the normative unreasonableness.  
  *   **Exclusions:** Avoids overwhelming beginners with tangential debates (Singer's %), complex math, or history. Focuses purely on the logical structure of the objection.  

  **Why "Overtime" Framing Works *After* Prerequisites:**  
  The power of "moral overtime" relies entirely on students accepting that:  
  1.  **Consequentialism applies constantly** (Continuous Scope).  
  2.  **Not optimizing is wrong** (Maximization).  
  If they still think morality only applies to "big decisions" or that "doing some good is sufficient," the overtime analogy falls flat. The prerequisite step ensures they feel the weight of *every* moment. The Saturday example then makes that weight concretely oppressive.
