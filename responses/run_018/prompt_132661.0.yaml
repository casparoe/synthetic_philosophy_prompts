  ### Outline of Argument:
  1. **Plebiscite as Fabricated Ritual**: The vote scene exemplifies Hobsbawm’s "invented tradition" – a hollow performance of democracy staged for external legitimacy, exposing the artificiality of Italian unification.  
  2. **Ballroom as Adaptive Theatre**: The ball showcases *adapted* aristocratic rituals repurposed by the bourgeoisie, performing a new national elite while preserving old hierarchies beneath surface changes.  
  3. **Private Religion as Ambiguous Adaptation**: The Salinas’ domestic piety functions as an "adapted" tradition masking state-level fabrication, yet its emotional authenticity resists Hobsbawm’s functionalist reading.  
  4. **Melancholy as Theoretical Resistance**: Don Fabrizio’s consciousness of performance and loss undermines Hobsbawm’s focus on tradition as purely functional, revealing the *affective cost* of national reinvention.  

  ---

  ### Analysis:  

  **The Plebiscite: Invented Tradition as Farce**  
  The Sicilian plebiscite for Italian unification is less a democratic moment than a rehearsed pantomime. Peasants vote blindly, elites manipulate outcomes, and symbols of the new state (ballot boxes, patriotic slogans) are props in a spectacle devoid of civic meaning. This aligns precisely with Hobsbawm’s "invented tradition": a ritual fabricated *ex nihilo* to legitimise the fledgling Italian state by simulating popular consent. Crucially, the audience "plays along" not out of belief, but from apathy or coercion. The scene’s cynicism exposes unification as a *performance of community* for external observers (Piedmontese bureaucrats, European powers), not an organic emergence. Hobsbawm’s framework illuminates how the vote’s *staging* – its choreographed conformity – manufactures a myth of national will, masking regional disconnection.  

  **The Ball: Adaptive Ritual and Bourgeois Assimilation**  
  The grand Palermo ball embodies Hobsbawm’s "adapted tradition." Aristocratic rituals (dances, etiquette, spatial hierarchies) are repurposed to integrate the *nouveau riche* like Sedàra and Angelica. The ballroom becomes a theatre where:  
  - **Old forms enable new actors**: Angelica’s acceptance hinges on flawlessly performing aristocratic codes, proving social mobility requires *mimicry* of tradition.  
  - **Continuity masks rupture**: The glittering surface suggests seamless transition, yet power shifts to the adaptable (Tancredi) or wealthy (Sedàra). The "Italian community" performed here is not new but a rebranded elite hierarchy – the South absorbed into the nation via co-option, not transformation.  
  This adaptation serves state-building by stabilising upheaval: bourgeois energy is channelled into existing ceremonial moulds, preserving social order under a nationalist veneer.  

  **Private Piety: Adapted Tradition or Resistant Authenticity?**  
  The Salinas’ chapel and domestic rosary rituals represent adaptation: ancient devotional forms persist privately while public Catholicism is instrumentalised by the new state. Hobsbawm would note how this *authentic-seeming* continuity masks the fabrication of national civic religion. Yet Lampedusa complicates this. Don Fabrizio’s solitary prayer and the family’s tactile engagement with ritual (the worn rosary beads, the intimate chapel space) carry emotional weight absent in public performances. This suggests adapted traditions aren’t merely functional masks but reservoirs of *lived meaning*. The novel implies that while the state fabricates, individuals may *inhabit* tradition authentically – a nuance Hobsbawm’s sociological lens can overlook.  

  **Where Melancholy Undermines Hobsbawm: The Leopard’s Resistance**  
  Hobsbawm’s theory stumbles against the novel’s central melancholy. His model treats tradition as malleable tool for elite legitimation, but Don Fabrizio’s *awareness* of the performativity undermines this:  
  - **Consciousness of fabrication**: The Prince sees the plebiscite as fraud and the ball as decadent theatre. His complicity (voting "yes," attending the ball) stems not from belief but fatalism, exposing tradition-invention as *transactional*, not hegemonic.  
  - **Grief for the unadaptable**: Fabrizio mourns the Prince’s "immutable" dignity and cosmic order, loss Hobsbawm cannot account for. The novel suggests some traditions resist adaptation because their essence is tied to a *vanishing lifeworld*. The Prince’s refusal of a Senate seat epitomises this: he rejects the new state’s symbolic co-option, asserting that his aristocratic identity *cannot* be performatively remade.  
  Here, the text challenges Hobsbawm: national identity isn’t just performatively constructed through adaptable/invented traditions; its fabrication *fails* when confronted with a consciousness that sees through the performance and clings to a sense of irrevocable loss. The melancholy isn’t just critique but an *alternative epistemology* – a recognition of tradition’s emotional roots that state-building cannot replicate.  

  **Conclusion**: *The Leopard* brilliantly illustrates Hobsbawm’s categories but transcends them. Public rituals (plebiscite, ball) reveal nation-building as performance management. Yet the novel’s elegiac core – centred on private tradition and aristocratic despair – exposes the *human resistance* to political fabrication. Lampedusa shows that where Hobsbawm sees functional adaptation, there might be irreparable rupture; where invention seeks legitimacy, it may breed only cynical detachment. The "imagined community" of Italy emerges as a stage set, but the tragedy lies in those who cannot forget what existed before the performance.
