  i want one essay question (45 mins, 800-1000 words expected) that forces students to defend one of three positions: (A) supererogation is always relative to institutional failure, so in a perfect world it collapses into either duty or folly; (B) it's always a matter of personal virtue regardless of institutional context; or (C) there's a hidden third option where institutional context changes the kind of praise without changing the moral status of the act. they must address two specific objections: the moral residue objection—that (A) makes saints into system janitors—and the cost-internalization problem—that (B) ignores that institutions exist precisely to distribute burdens fairly.

  please write the exam prompt, a model answer around 900 words, and a marking scheme out of 25 with five must-hit moves, the marks each carries, and a one-line note on how candidates typically blow each one. make sure a student who just memorized "going beyond the call of duty" can only get a C at best. also please include a small typo somewhere, maybe "recieve" or "existant", and dont ask for any bibliographies since half my students are writing this offline.
