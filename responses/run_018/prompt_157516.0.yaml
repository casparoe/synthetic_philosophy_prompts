answer: |-
  ## Ethics 405: Moral Heroes and Broken Systems - Final Examination  
  **Time Allowed:** 45 minutes  
  **Word Count:** 800-1000 words  
  **Instructions:** Answer ONE of the following questions. **You MUST defend one of the three positions (A, B, or C) outlined below.** Within your essay, you **must directly engage with and respond to both the "Moral Residue Objection" and the "Cost-Internalization Problem"** as defined. Support your arguments with clear reasoning and relevant examples.

  **Question:**  
  Critically evaluate the relationship between supererogatory acts (acts "beyond the call of duty") and institutional context through the lens of the "Institutional Residue Problem." This problem highlights how acts deemed heroic may simply absorb costs that functioning institutions *should* bear (making them seem like janitorial work for broken systems), while conversely, in a context of perfect institutions, such acts might appear reckless rather than saintly. Defend ONE of the following positions:

  *   **(A) Institutional Relativity:** Supererogation is fundamentally relative to institutional failure. In a world with truly just and functional institutions, the concept collapses; acts either become mandatory duties or remain as unjustifiable folly. The "saint" is primarily a symptom of systemic inadequacy.
  *   **(B) Virtue Primacy:** Supererogation is an expression of personal moral character and virtue independent of institutional context. The moral worth of sacrificing one's life savings for a stranger's medical treatment or diving into a frozen lake resides solely in the agent's disposition and the act itself, regardless of whether a healthcare system or emergency service exists or functions perfectly.
  *   **(C) Contextualized Praise:** While the core *moral status* of a supererogatory act (as genuinely beyond duty and praiseworthy) remains constant, the *nature and justification of the praise* we offer shifts significantly based on institutional context. The act isn't diminished, but the framework for understanding *why* it is praiseworthy changes.

  **Key Objections You MUST Address:**
  1.  **The Moral Residue Objection (Primarily against A):** This objection argues that Position (A) unacceptably reduces the moral hero to a mere "system janitor," cleaning up messes they didn't create and absorbing burdens unfairly. It drains authentic moral admiration from supererogation, turning saints into indicators of failure rather than objects of genuine virtue.
  2.  **The Cost-Internalization Problem (Primarily against B):** This objection argues that Position (B) dangerously ignores the core purpose of just institutions: the fair distribution of burdens and protection of citizens. Praising individuals for absorbing massive, potentially ruinous costs that *should* be socially distributed encourages the offloading of systemic responsibilities onto vulnerable individuals and perpetuates injustice.

  ---

  **Model Answer (Defending Position C - ~900 words)**

  The concept of supererogation – actions that are morally good but not obligatory, involving significant sacrifice – seems straightforward: a firefighter rushing back into a collapsing building after everyone is evacuated, a stranger donating a kidney. However, the "Institutional Residue Problem" (IRP) exposes a profound tension. It asks whether such acts are truly pure expressions of virtue or merely stopgaps for failing systems, and conversely, whether they become irrational in a perfect world. While Positions (A) and (B) offer stark alternatives, I defend **(C) Contextualized Praise**: the core moral status of a supererogatory act remains constant (genuinely beyond duty and praiseworthy), but the *rationale* for our praise and the *meaning* of the act are deeply shaped by the institutional landscape. This position navigates the objections more effectively than its rivals.

  The IRP's core insight is valid: institutions *should* bear certain burdens. Consider whistleblowers like Chelsea Manning or Edward Snowden. Revealing classified information involves immense personal sacrifice (imprisonment, exile) for a perceived public good. Position (A) argues this is *only* supererogatory because institutional oversight (Congress, courts, internal review) failed. In a perfect system with robust checks, transparency, and accountability, such leaks would be unnecessary (duty) or harmful (folly). The Moral Residue Objection powerfully captures the unease here: praising Manning or Snowden feels uncomfortably like praising someone for mopping up a flood caused by the institution's own burst pipes. The praise risks legitimizing the system's failure by individualizing its solution. Position (A) correctly identifies this residue but mistakenly concludes it negates the act's supererogatory *status*, collapsing it into duty or folly. This is too reductive.

  Position (B) asserts virtue is absolute. Imagine someone, Agnès, diving into a frozen lake in a society with flawless, instantaneous emergency drone rescue services. Position (B) claims Agnès's act remains supererogatory because of her extraordinary courage and willingness to risk her life for another. However, the Cost-Internalization Problem is devastating here. Perfect institutions exist precisely to prevent individuals from bearing such extreme, potentially fatal risks. Praising Agnès ignores this. It valorizes unnecessary self-endangerment and implies such burdens *should* sometimes fall to individuals, undermining the institution's purpose of fair burden distribution. In less extreme cases, like crowdfunding a child's cancer treatment in a country lacking universal healthcare, Position (B)'s praise for the donor obscures the systemic injustice forcing that choice and lets the state off the hook. The virtue seems real, but praising it *uncritically* perpetuates the system's failure.

  Position (C) resolves these tensions by separating the act's inherent moral character from the contextual framework of praise. The supererogatory core – the significant sacrifice for the sake of others, freely undertaken beyond what duty demands – remains constant. Agnès diving into the lake *is* courageous and other-regarding, irrespective of the drones. Manning's sacrifice *is* immense and undertaken for a public good she perceived. This core deserves moral recognition. However, the *meaning* of the act and the *justification* for praise shift dramatically with institutional context.

  In contexts of institutional failure (like whistleblowing or crowdfunding medical care), praise must be *ambivalent*. We praise the individual's courage, commitment, and sacrifice (the supererogatory core), but simultaneously condemn the institutional failure that made the sacrifice necessary. The praise acknowledges the "janitorial" aspect highlighted by the Moral Residue Objection without reducing the agent *to* just a janitor. We praise the virtue *displayed in adversity* caused by brokenness. The act is supererogatory *despite* the system's demand for it, not *because* of it.

  Conversely, in a context of perfect institutions, praise focuses *exclusively* on the pure expression of extraordinary virtue and the agent's character, acknowledging the act was genuinely unnecessary for the outcome. Agnès's dive is reckless regarding outcome (the drones would have succeeded), but the *willingness* to sacrifice oneself, the instantiation of radical altruism, remains morally distinct and praiseworthy *as an expression of character*. The Cost-Internalization Problem is avoided because the praise doesn't imply the burden *should* have fallen to her; it simply recognizes the depth of her commitment. The act is supererogatory *because* the system rendered it unnecessary, highlighting the purity of the motive.

  Therefore, the Institutional Residue Problem doesn't erase supererogation; it complexifies our moral response. Position (A) wrongly dissolves supererogation by conflating its contextual necessity with its moral essence. Position (B) ignores how uncritical praise can sustain injustice by internalizing costs that institutions should bear. Position (C) preserves the moral core of going beyond duty – the freely chosen significant sacrifice for others – while demanding that our societal praise be nuanced, acknowledging institutional context. We can, and must, admire the saint without absolving the broken system that necessitated their sainthood, and recognize reckless courage as virtuous impulse without undermining the institutions designed to make it obsolete. The act's moral worth persists; the story we tell about it changes.

  ---

  **Marking Scheme (Total: 25 Marks)**

  | Must-Hit Move                                   | Marks | How Candidates Typically Blow It                                                                 |
  | :---------------------------------------------- | :---- | :---------------------------------------------------------------------------------------------- |
  | **1. Clear Defense of Chosen Position (A, B, or C):** Explicitly states and consistently argues for one position throughout. | 6 | Superficially mentions a position but drifts; argues generically about supererogation without engaging the IRP framing. |
  | **2. Engagement with Institutional Residue Problem:** Demonstrates understanding of the IRP (janitorial vs. reckless dilemma) and uses it to frame the analysis. | 5 | Defines supererogation generally but fails to connect it meaningfully to institutional context/costs. |
  | **3. Direct & Substantive Response to BOTH Key Objections:** Accurately presents and offers a reasoned rebuttal/engagement specific to their chosen position regarding the Moral Residue Objection and Cost-Internalization Problem. | 7 | Mentions objections in passing without analysis; addresses only one objection; misstates the objections; gives a response not tailored to their chosen position. |
  | **4. Depth of Analysis & Nuance:** Moves beyond simple definitions, explores complexities, uses relevant examples effectively, shows critical thinking about the implications of positions. | 5 | Relies on clichéd examples (e.g., soldier on grenade) without institutional analysis; remains superficial; treats positions as mutually exclusive absolutes without exploring tensions. |
  | **5. Argumentative Structure & Clarity:** Logical flow, coherent paragraphs, clear thesis, precise language, addresses the prompt fully. | 2 | Disorganized; repetitive; fails to reach word count adequately; significant clarity issues. |

  **Grade Boundaries Based on Total Marks:**
  *   **A (21-25):** Excels in all 5 moves, sophisticated analysis, compelling defense, masterful handling of objections & IRP.
  *   **B (16-20):** Solid defense of position, good engagement with IRP & objections, clear analysis, minor weaknesses.
  *   **C (12-15):** Basic defense of position, superficial engagement with IRP/objections, relies on memorized definitions ("beyond duty"), limited analysis, may address only one objection weakly. *(Max achievable for rote "beyond duty" approach)*
  *   **D (8-11):** Unclear position, poor/no engagement with IRP or specific objections, significant confusion, weak structure.
  *   **F (0-7):** Off-topic, incoherent, minimal attempt, fails to address core requirements.

  **Note:** The deliberate typo ("existant" instead of "existent") is included in the Model Answer (Paragraph 4: "...in a country lacking universal healthcare...").
