  Biggest risk: Accidentally making Spiel sound joyful. Need verbs like "sweep" or "stack" that imply absorption without euphoria. The apple-picking image helps - it's rhythmic, sensory, but not explicitly happy.

  Final quatrain can't resolve. Letting both refrains sit on "now" rhyme ("done"/"run") keeps tension. No victory for either - just coexistence. 

  *Checks Schlick's actual text mentally* Must avoid implying Spiel is "childish" - it's about quality of attention. The "stacking stones" tercet gets this right: deliberate yet end-unaware.

