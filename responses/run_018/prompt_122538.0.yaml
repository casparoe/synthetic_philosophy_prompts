  | 4. Show failure of absolute distance | 25      | Define absolute deviation score: sum \|truth - credence\|. Compute for c(A)=1.0 vs c(A)=0.9 at true A and false A. | Step 3                                                                | Any epistemic utility must favour extreme credence. | Compute: At true A, c=1.0 scores 0, c=0.9 scores 0.1. At false A, c=1.0 scores 1.0, c=0.9 scores 0.9. Ask: "Does this reward extremism?" (Yes.) |
  | 5. Introduce quadratic scoring      | 30      | Define quadratic score: sum (truth - credence)². Contrast with absolute deviation.                 | Step 4                                                                | Quadratic score is a bare stipulation.               | Compute: For c(A)=0.5 at true A, score (1-0.5)² = 0.25. Ask: "Is this intuitive?" (Vote: yes/no.)                                  |
  | 6. Present central example          | 40      | Use credence c(A)=0.8, c(¬A)=0.3 (incoherent, real overconfidence). Compute quadratic score at world A and world ¬A. | Step 5                                                                | Dominated credence is a straw man.                   | Board work: At world A (A true, ¬A false), score = (1-0.8)² + (0-0.3)² = 0.13. At ¬A, (0-0.8)² + (1-0.3)² = 1.13. |
  | 7. Demonstrate domination           | 50      | Show coherent c*(A)=0.75, c*(¬A)=0.25: at world A, score=0.125; at ¬A, score=1.125. Highlight strict improvement. | Step 6                                                                | Accuracy-first is Dutch book without money.          | Ask: "Is c* better than c at both worlds?" (Yes.) Then: "Does this rely on money or averages?" (No—pointwise dominance.)           |
  | 8. Evaluate conviction score        | 55      | Define conviction score: probability assigned to outcome minus max probability assigned to non-occurring outcome. | Step 5 (scoring rules)                                                | —                                                    | Compute for two outcomes: If A true, score = c(A) - c(¬A). Ask: "If you believe A at 0.6, what is score at A?" (2×0.6 - 1 = 0.2). |
  | 9. Show conviction rewards extremism | 60      | Prove: For true P(A)=q, expected conviction score = 4qp - 2p - 2q + 1. Maximised when p=1 if q>0.5, p=0 if q<0.5. | Step 8                                                                | Quadratic score is arbitrary.                        | Ask: "Should you report true belief with conviction score?" (No—optimal to be extreme.)                                            |
  | 10. State theorem, refuse lemma     | 65      | Assert: All incoherent credences are accuracy-dominated under quadratic scoring. Refuse proof.      | Steps 7, 9                                                           | Domination result requires expectation.              | State: "We skip the lemma due to time. Focus on what domination means."                                                            |
  | 11. Address logarithmic score query | 70      | If asked, confirm domination holds for log score but refuse comparison: "Quadratic is tractable for today." | Step 7 (if questioned)                                               | —                                                    | (Contingent on student question.)                                                                                                  |
  | 12. Refuse extraneous topics        | 75      | Refuse: proof of domination, choice of proper scores, chance-credence principles, updating.         | All prior                                                            | Domination vindicates more than coherence.           | State: "We refuse these to stay focused: no scoring rule debates, no chances, no updating today."                                  |
  | 13. Separate coherence from updating | 80      | Argue: Domination shows coherence is necessary now, but doesn’t say how to change credences later. | Steps 10, 12                                                         | Argument vindicates conditionalisation.              | Ask: "Does domination tell you how to update on evidence?" (No—coherence is synchronic, updating diachronic.)                      |
  | 14. Conclude epistemic virtue       | 90      | Sum up: Accuracy-first replaces money with dominance; coherence avoids being pointwise less accurate. | All steps                                                            | —                                                    | (No check: summary.)                                                                                                               |

