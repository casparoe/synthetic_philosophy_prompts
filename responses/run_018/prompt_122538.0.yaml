  We are designing a 90-minute session to transition students from the Dutch book argument to the accuracy-first vindication of probabilism. The goal is to establish that credences have an epistemic utility (accuracy) and that incoherent credences are accuracy-dominated. We must address the specified issues and misconceptions.

  Key elements:
  - The session must start by making the question "why should credences satisfy the probability axioms?" sound like a non-pragmatic question. The diagnosis is that students might think accuracy is all-or-nothing. We need to break that thought.
  - We need one central example that is small and computable, and the dominated credence function should be realistic.
  - We must introduce the quadratic scoring rule and contrast it with absolute deviation, showing why absolute deviation is inadequate. We also need to address whether the domination result holds for the logarithmic score (we'll say it does, but we're not proving it, and we're using quadratic for simplicity and because it has nice properties).
  - The conviction score (used by the department) must be evaluated. We must determine if it makes extremism optimal for two outcomes. We find that it does, and we can use it as a foil to show that not every scoring rule is proper. We'll keep it but allocate minimal time.
  - Misconceptions to address:
    1. Accuracy-first is just Dutch book without money -> We must emphasize the epistemic utility and the dominance being at every world without expectation.
    2. If truth is the only good, then extreme credence must be favored -> We show that extreme credences can be inaccurate when wrong and that the quadratic rule rewards being appropriately confident.
    3. Quadratic measure is arbitrary -> We show that absolute deviation fails (it rewards certainty even when you are wrong) and that quadratic is the simplest that works (and we note that other strictly proper rules exist but we're using quadratic for the example).
    4. Domination result vindicates more than coherence -> We clarify that it only shows coherence, not how to update on evidence.

  Refusals:
  - We will not prove the domination lemma (just assert).
  - We will not discuss which strictly proper score is correct (we use quadratic and note others exist).
  - We avoid chance and credence (defer to another time).
  - We must also refuse to discuss the uniqueness of the quadratic rule and the details of the domination proof.

  Closing: Last 10 minutes must distinguish coherence from updating.

  Plan for the session:

  We break the 90 minutes into steps.

  Step 1: Set the stage - remind of Dutch book and pose the non-pragmatic question.
  Step 2: Introduce epistemic utility - accuracy as closeness to truth.
  Step 3: Show that accuracy must be graded (not all-or-nothing) for a whole credence function.
  Step 4: Introduce the quadratic scoring rule and compute for a simple case (with two worlds and a credence function) to show how it works.
  Step 5: Show that absolute deviation fails: it rewards certainty even when you are wrong.
  Step 6: Present the central example: a credence function over two propositions that are mutually exclusive and exhaustive (so two worlds). Use a credence function that is incoherent (e.g., c(A)=0.6, c(not A)=0.5). Then show that there is a coherent credence function (c'(A)=0.55, c'(not A)=0.45) that dominates it at every world? Actually, we need to compute the accuracy for both at both worlds and show that the coherent one is better in both.

  But note: for two propositions A and ~A, the worlds are: A true (~A false) and A false (~A true). We have two worlds.

  We'll use:
  - World 1: A true, ~A false.
  - World 2: A false, ~A true.

  Let the incoherent credence be: b(A)=0.6, b(~A)=0.5. Note: this is incoherent because 0.6+0.5=1.1>1.

  We compare to the coherent credence: p(A)=0.55, p(~A)=0.45.

  We compute the quadratic score (Brier score) for each at each world.

  At world 1 (A true):
  - b: (1-0.6)^2 + (0-0.5)^2 = (0.4)^2 + (-0.5)^2 = 0.16+0.25=0.41
  - p: (1-0.55)^2 + (0-0.45)^2 = (0.45)^2 + (-0.45)^2 = 0.2025+0.2025=0.405

