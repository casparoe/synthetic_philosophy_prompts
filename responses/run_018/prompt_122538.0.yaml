  We can use the fact that the coherent credence that dominates is the projection of b onto the set of coherent credences. For two events, the set of coherent credences is the line p(A)+p(~A)=1. The projection of (0.7,0.4) would be (0.55,0.45) because the midpoint? Actually, the projection for the Brier score is the normalization? But we need to compute the distance.

