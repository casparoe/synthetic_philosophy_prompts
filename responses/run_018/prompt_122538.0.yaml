  At world1 (A true):
  - b: (1-0.8)^2 + (0-0.3)^2 = 0.04 + 0.09 = 0.13
  - p: (1-0.75)^2 + (0-0.25)^2 = 0.0625 + 0.0625 = 0.125

  At world2 (A false):
  - b: (0-0.8)^2 + (1-0.3)^2 = 0.64 + 0.49 = 1.13
  - p: (0-0.75)^2 + (1-0.25)^2 = 0.5625 + 0.5625 = 1.125

  Now, 0.125 < 0.13 and 1.125 < 1.13? So p is strictly better at both worlds. Perfect.

  So we'll use: incoherent b: c(A)=0.8, c(~A)=0.3; coherent p: c(A)=0.75, c(~A)=0.25.

  Step 7: Now, we can show the computation for quadratic score.

  Step 8: Introduce the conviction score and show that it is improper. For two outcomes, let the outcomes be A and ~A. The conviction score for a credence (p, 1-p) if A occurs: p - max{1-p} (since the other outcome is ~A with probability 1-p). But note: the other outcome that did not occur is only one: ~A. So max over non-occurring outcomes is 1-p. So score = p - (1-p) = 2p-1.

  If ~A occurs: then the score is (1-p) - max{p} = (1-p) - p = 1-2p.

  Now, if the agent has credence p in A and 1-p in ~A, then the expected score (if the true probability is q for A) is:
  q*(2p-1) + (1-q)*(1-2p) = 2p q - q + 1 - 2p - q + 2p q = 4p q - 2p - 2q + 1.

  To maximize expected score with respect to p, take derivative with respect to p: 4q - 2. Set to zero: 4q-2=0 => q=0.5. So if q>0.5, the derivative is positive -> set p=1; if q<0.5, set p=0. So extremism is always optimal: you should set p=1 if you think q>0.5? But the expectation is linear in p, so indeed the maximum is at the boundary. Therefore, for any true probability, the agent maximizes expected conviction score by being certain of the more likely outcome. This is not proper because the truthful reporting (p=q) is not optimal unless q=0.5.

