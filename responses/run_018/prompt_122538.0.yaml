  | 1. Recap Dutch book’s pragmatic focus | 5       | Remind that Dutch book shows incoherent credences lead to sure monetary loss in betting.            | None                                                                  | —                                                    | Ask: "What did the Dutch book argument establish?" (Expected: coherence avoids sure loss in bets.)                                 |
