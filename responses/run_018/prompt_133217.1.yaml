  The user's point is that understanding might be distributed. But Searle's deeper issue is the lack of intrinsic semantics. The fragmented room might show that understanding doesn't need a single agent, but it doesn't bridge the gap between syntax and meaning. Each operator is still just manipulating symbols without knowing their meaning. 

