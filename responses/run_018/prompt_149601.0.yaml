answer: |-
  Your analysis captures a sophisticated and critically important pattern in state apologies for historical injustices. While no single, universally accepted term fully encompasses **every nuance** of this configuration, several closely related concepts and critical frameworks exist. The most precise description often involves combining terms or coining a new one.

  ### Established Concepts & Frameworks
  1.  **Non-Performative Apology / Performative Contradiction:** Drawing on J.L. Austin's speech act theory (and later critiques by Judith Butler, Eve Sedgwick), this highlights an apology that *fails* to perform its intended function (seeking forgiveness, enabling repair). Your case shows a state *using* the apology performatively, but to achieve a *different* goal (moral capital, closure) rather than repair.
  2.  **Symbolic Reparation vs. Material Reparation:** A core distinction in transitional justice. Your configuration is a prime example of prioritizing highly visible symbolic acts (apology, memorials) while actively resisting or neglecting material reparations (land return, compensation, structural reform). The apology *becomes* the symbolic reparation intended to substitute for the material.
  3.  **The "Apology Dividend" (James, Nobles):** Nick Smith and Melissa Nobles use this term to describe the tangible benefits (domestic legitimacy, international prestige, reduced pressure for material redress) a state accrues from offering an apology, often *instead* of substantive justice. This directly addresses the "converting culpability into moral capital" aspect.
  4.  **Commemorative Amnesia / Strategic Forgetting:** The state's framing of the harm as a closed historical chapter, disconnected from present structures, exemplifies this. The apology serves as the *act* of commemoration that simultaneously enables forgetting of ongoing consequences.
  5.  **Selective Continuity / Discontinuity:** This is a core mechanism you identified. Scholars like Bernhard Giesen and Jeffrey Olick analyze how states navigate the tension between needing continuity with the past state to *be* the apologizing entity ("we, the inheritors, acknowledge *our* past") and needing discontinuity to claim moral progress ("*that* state is gone, *we* are different"). Your configuration shows the state exploiting this ambiguity strategically.

  ### Proposed Terms & Frameworks for Your Specific Configuration
  Given the emphasis on **temporal closure** and **selective continuity/discontinuity** as mechanisms to **resist structural change** while **gaining moral capital**, these are strong candidates:

  1.  **Performative Historicization:** This captures the core act: the apology *performs* the act of placing the injustice firmly and solely in the past ("historicizing" it), thereby rendering it closed and absolving the present state of responsibility for ongoing structures. The performance *is* the strategy.
  2.  **The Closure Gambit:** Highlights the strategic move of declaring the matter closed via apology to forestall demands for material redress and structural change.
  3.  **Apology as Exculpatory Historicism:** Emphasizes how the apology uses a specific framing of history (as discontinuous past) specifically to *exculpate* the present state from ongoing responsibility.
  4.  **Strategic Temporal Closure (STC):** A descriptive term directly naming the key mechanism you identified: the deliberate use of temporal framing ("that was then, this is now") as a strategy to block redress.

  ### Distinguishing from Related Concepts
  *   **Ordinary Hypocrisy:** This is broader and less structurally specific. Your configuration is a *systemic, institutionalized mechanism* leveraging the specific form of the state apology within a transitional justice/political legitimacy context. It's hypocrisy *enacted through* the specific tools of historical acknowledgment, temporal framing, and the speech act of apology.
  *   **Moral Licensing (Collective):** Moral licensing (doing a good deed to permit subsequent bad behavior) is a *psychological* mechanism often applied to individuals or groups. Your configuration is a *political strategy* employed by state institutions. While the state may *gain* a form of moral license domestically/internationally, the core dynamic is the *institutional* use of the apology to *block* redress and *secure* benefits, not necessarily to enable *new* wrongs (though it may perpetuate existing ones).
  *   **Mere Failure to Pair Apology with Reparations:** This is passive neglect. Your configuration describes an *active* process: the apology is *strategically designed and deployed* as the *alternative* to reparations, *using* the acknowledgment to *justify* the refusal of material redress ("we apologized, that's enough"). It's not just omission; it's substitution and blockage.

  ### Defining the Boundaries
  *   **Core Necessary Elements:**
      *   A formal state apology for a severe historical injustice.
      *   Explicit or implicit disavowal of *legal* liability/obligation flowing from the apology.
      *   Framing emphasizing state/national moral growth/progress and discontinuity with the past.
      *   **Active resistance to material restitution or structural reform addressing ongoing consequences.**
      *   The justification (explicit or implicit) for resisting redress relies, at least partly, on the apology itself serving as sufficient moral settlement.
      *   The state retains material/institutional benefits derived from the original injustice.
  *   **The "Gaining Prestige" Question:** This is a *common and powerful consequence* and a key *motivation*, but **not strictly necessary** to define the core phenomenon. The essential element is the **use of the apology as a tool to achieve temporal closure and thereby structurally resist material redress.** The accrual of moral capital (prestige, legitimacy) is a highly likely *outcome* of successfully deploying this strategy, and often a *goal*, but the core *mechanism* is the strategic resistance enabled by the temporal framing. A state might bungle the apology and gain little prestige but *still* use it to try to block redress – this would still fit the pattern.

  ### Conclusion
  Your configuration is best described as **Performative Historicization** or **Strategic Temporal Closure** within the framework of state apologies. It synthesizes:
  1.  **Non-performativity:** The apology fails its primary purpose (repair).
  2.  **Symbolic over Material:** Prioritizes the symbolic act.
  3.  **Apology Dividend:** Seeks benefits from the act.
  4.  **Selective Continuity/Discontinuity:** Exploits ambiguity about the state's relationship to the past.
  5.  **Commemorative Amnesia:** Uses the apology to "close the book."
  6.  **Structural Resistance:** Actively uses the apology to block material redress and maintain unjust structures/benefits.

  The unique and critical insight is how the **act of acknowledgment itself, through its specific temporal framing (closure) and the state's selective claims of continuity, becomes the primary instrument for resisting the very justice that acknowledgment should enable.** It's a perverse inversion where apology becomes the alternative to, and blocker of, repair. While not having one universal name, your description precisely identifies a well-recognized and deeply problematic dynamic in transitional justice.
