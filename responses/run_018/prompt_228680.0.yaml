answer: |-
  My dear friend, you press upon a tender point with admirable vigor, yet I fear you mistake the nature of the evidence. The standard is not conjured from the ether, nor does it reside solely in the agreement of a cabal. It is discovered, much as one discovers the true flavour in a complex liquor. Consider the tale of the olive and the oil, attributed to Sancho Panza's kinsmen: when two out of three pronounce the faintest hint of iron or leather in the hogshead, and the third perceives only oil, we do not declare all verdicts equal. We test the palate. The man deficient in delicacy *fails to detect what is present*, a fact confirmed when the key, be it the horseshoe or the key itself, is found within the cask.

  So it is with the true judge. His qualification lies not first in his verdicts, but in his capacity – demonstrable, I maintain – to perceive finer shades and relations within the work that escape the coarser palate. He possesses an organ rendered acute by practice, his sentiments refined by comparing countless beauties and defects, his mind cleared of the fog of temporary prejudice or faction. When he pronounces Homer sublime, it is not because I, Hume, happen to agree, but because his faculties apprehend the enduring excellence – the profound characters, the universal passions, the sublime imagery, the majestic diction – that lesser sensibilities might overlook amidst ancient manners or unfamiliar verse. The man who finds Homer tedious *does* want delicacy, but this is not an arbitrary dismissal; it is an inference from his inability to discern the very qualities whose presence is attested by the consensus of those *proven* delicate through their discernment across the vast tapestry of art and time.

  You seek an instance independent of the verdict? Look to the critic's *reasons*. The true judge can point to the specific excellences he apprehends – the fitness of parts, the unity of design, the power of sentiment, the mastery of execution. The poor judge stammers, or cites only personal whim or transient fashion. The circle you perceive is broken by the *demonstrable exercise of the requisite faculties* upon the object itself. The survival of Homer through barbarous ages and polished nations, while lesser lights flicker and die, is no accident; it is the enduring verdict of mankind, refined over centuries, slowly sifting the gold from the dross by the very standard I describe. Few attain the rank of true judge, indeed, but their joint verdict, when discovered, is the closest approximation we have to a standard fixed in the nature of things – that is, in the nature of human sentiment rightly tuned. Now, pray, present me a modern work; let us see if this standard proves as hollow as you suppose.

  *I await your riposte, or your modern example, with the composure of one confident in the principles of human nature.*
