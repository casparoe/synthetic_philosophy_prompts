  what do you think simone weil would say about these modern "liquid parties" that have no membership rolls, no manifestos, and exist mostly as algorithmic clusters of shared outrage? she argued that real parties crush individual judgement and replace truth-seeking with collective loyalty, but these new groupings are totally decentralized — there's no central committee to resist. do you think her critique still applies, or does it depend on there being an actual party apparatus? i'm especially curious whether she'd view the lack of rootedness and sustained attention in these networks as worse than old-school party discipline, or if the absence of formal structure makes them closer to her ideal of people aligning freely on justice. don't just list quotes; work through her logic about collective passion and attention.
