answer: |-
  Your cases reveal a sophisticated, ecologically grounded intuition about suffering that *can* be unified under a single principle integrating the key concepts you identified. Here is the principle, followed by its application:

  **The Principle of Lifetime Expected Suffering Density Modulation (LESDM):**
  *Net welfare change from an intervention is determined by the difference between the aggregate lifetime expected suffering averted by preventing lives (weighted by their reproductive value) and the aggregate suffering imposed on existing survivors (weighted by intensity-duration and life-history sensitivity), with both effects modulated by the intervention's impact on population density and its consequences for suffering per capita.*

  **Key Components & Case Applications:**

  1.  **Lifetime Expected Suffering Averted (Prevented Lives):** Focuses on the suffering *avoided* by individuals never born. Weighted by:
      *   **Reproductive Value (RV):** The expected future contribution to the population. High RV individuals (e.g., young with high survival potential) represent more averted future suffering if prevented.
      *   **Case 1 (Drained Wetland):** Dominates. Averts vast numbers of high-suffering, low-survival-probability amphibian/mosquito larvae (low *individual* RV due to high mortality, but enormous *aggregate* averted suffering due to sheer numbers and intensity of suffering before death). Adult space increase is minor.
      *   **Case 5 (Fire Mosaic):** Significant contributor. Suppresses r-strategists (high reproductive output, low juvenile survival - low RV for juveniles, but high aggregate averted suffering from short, painful lives). Immediate deaths are a cost factored into survivor suffering (below).

  2.  **Suffering Imposed on Survivors:** Focuses on increased suffering in individuals living through the intervention. Weighted by:
      *   **Intensity-Duration:** Magnitude and chronicity of suffering matters (e.g., chronic stress vs. acute hunger).
      *   **Life-History Sensitivity:** K-selected species (low fecundity, high parental investment, complex sociality) are often more sensitive to disruption, experiencing higher per-capita suffering increases from stressors like fragmentation or resource loss.
      *   **Case 2 (Fragmentation):** Dominates. Imposes severe, chronic stress (high intensity-duration) on K-selected mammals highly sensitive to social disruption and resource stability. Modest population drop doesn't offset this large per-capita increase.
      *   **Case 3 (Grassland):** Creates high uncertainty. Survivors endure severe chronic hypervigilance, injury, and starvation (high intensity-duration). The magnitude of this increase vs. the suffering averted by the large birth reduction (potentially high aggregate but low RV/suffering per averted individual) is hard to balance, leading to your torn verdict. The initial density spike likely amplified suffering before the crash.

  3.  **Density Modulation of Suffering:** How the intervention changes population density and how density affects suffering per capita (e.g., via competition, predation risk, disease spread).
      *   **Case 4 (Invasive Shrub):** Key factor. Density reduction via lower carrying capacity *modulates* suffering. It drastically reduces high-intensity, acute suffering from predation/fear (density-dependent effect: less crowding → lower predator encounter rates & less chronic fear). This outweighs the increase in slower, lower-intensity hunger suffering and the aggregate suffering averted by birth reduction.
      *   **Case 3 (Grassland):** Density spike dramatically *increases* suffering per capita via competition and edge effects before the crash, contributing to your lean towards net increase.
      *   **Case 1 (Drained Wetland):** Minor adult space increase (density decrease) has a small positive effect, but is dwarfed by averted juvenile suffering.
      *   **Case 2 (Fragmentation):** Density decrease per se might be positive, but the *manner* of decrease (disruption) imposes far greater costs on survivors than a benign density reduction would.

  **Applying LESDM to the Marine Warming Scenario:**

  *   **Intervention:** Warming → Reduced phytoplankton → Lower fish biomass.
  *   **Key LESDM Analysis:**
      1.  **Averted Suffering (Prevented Lives):** Lower total biomass implies fewer fish lives overall, averting the suffering associated with those lives. However, the density reduction is likely gradual, affecting recruitment. The averted suffering is aggregate but diffuse (many individuals prevented, each with moderate expected lifetime suffering).
      2.  **Survivor Suffering:** Crucially, density reduction *modulates* suffering. Warmer water might impose direct metabolic stress (negative), but the primary effect is likely **reduced density-dependent suffering**: Less intense competition for food/resources, drastically reduced injury and chronic stress from overcrowding during spawning aggregations (high intensity-duration suffering).
      3.  **Weighting:** The reduction in high-intensity, chronic suffering (predation/competition stress, injury during spawning) for survivors likely has a larger per-capita welfare gain than the increase in slower hunger stress or the diffuse welfare loss from averted lives. The suffering averted by preventing lives is outweighed by the significant *improvement* in quality of life for the surviving, less-dense population.
  *   **LESDM Prediction:** **Net suffering likely decreases.** The density reduction modulates suffering downwards by alleviating intense density-dependent stressors (competition, aggregation injuries, chronic stress) more than it increases slower suffering from slightly scarcer resources (hunger) or loses welfare from averted lives. This aligns with the logic of Case 4.

  **Why LESDM Coheres Your Verdicts:**
  *   Case 1: High weight on **Averted Suffering** (massive, high-intensity juvenile suffering prevented).
  *   Case 2: High weight on **Survivor Suffering Increase** (severe, chronic stress imposed on sensitive K-strategists).
  *   Case 3: Uncertainty stems from intense competition between **Averted Suffering** (large number of births prevented) vs. **Survivor Suffering Increase** (severe chronic stress + **Density Spike** effect) during the crash phase.
  *   Case 4: **Density Modulation** (reduction lowering predation/fear stress) outweighs increased hunger and averted lives.
  *   Case 5: **Averted Suffering** (suppressing r-strategists' high-turnover suffering) dominates over the **Survivor Suffering** cost (immediate fire deaths) and the long-term benefits for K-strategists.

  LESDM integrates your focus on life-history context (RV, K/r sensitivity), temporal dynamics (intensity-duration, generational turnover), density effects, and the distinct moral weights of preventing future suffering vs. harming current individuals. It explains why sometimes preventing lives dominates (Case 1, 5), sometimes survivor harm dominates (Case 2), and sometimes density modulation is key (Case 4), while capturing the uncertainty in Case 3. The marine warming scenario prediction flows naturally from the density modulation component central to Case 4.
