  The lattice hums with charge and thermal sway.

  Its logic claims a right to redirect the way
  The thermal flow must gather or amass.
  **The symbol's debt commands the lattice, "Pay!"**

  Does pattern merely ride, or hold true sway?
  Cold logic blooms where hot excitements clash.
  The lattice hums with charge and thermal sway.

  See sector five: a sudden cooling spray
  Contracts the bonds where frantic currents dash.
  **The symbol's debt commands the lattice, "Pay!"**

  While sector nine absorbs the heat's decay,
  Expanding paths where sluggish ions splash.
  The lattice hums with charge and thermal sway.

  The token's rule demands this price today –
  Not chance, but consequence, a lightning flash.
  **The symbol's debt commands the lattice, "Pay!"**

  Is this command the cause, or just display?
  The coded script, the energetic lash?
  The lattice hums with charge and thermal sway;
  **The symbol's debt commands the lattice, "Pay!"**

