  **Notes on Execution:**

  *   **Form:** Strict villanelle structure: 19 lines (5 tercets, 1 quatrain), with refrains ending lines 1, 6, 12, 18 (`The lattice hums...`) and lines 3, 9, 15, 19 (`The symbol's debt...`).
  *   **Content:** Develops the core philosophical dispute through a concrete episode:
      *   **Tercet 1:** Introduces the substrate ("lattice") and the emergent claim ("debt commands").
      *   **Tercet 2:** Introduces the simmball token ("normative display") and the question.
      *   **Tercet 3:** States the central dilemma explicitly ("pattern merely ride, or hold true sway?").
      *   **Tercet 4:** Depicts the *effect* (cooling cascade) triggered by the debt-token logic in sector five.
      *   **Tercet 5:** Depicts the *correlative effect* (heating surge) in sector nine, implied as necessary for the debt's fulfillment.
      *   **Quatrain (Lines 16-19):** Directly links the effects to the token's "rule" and "command," posing the causal question starkly before locking the opposing refrains together in the final couplet.
  *   **Philosophical Accuracy:**
      *   **Substrate-First (Refrain 1):** Emphasizes the physical basis ("charge and thermal sway," "excitation," "currents"), implying causal primacy. The token is a "pattern" or "display."
      *   **Symbol-First (Refrain 2):** Emphasizes normative force ("commands," "debt," "rule," "logic," "script") and intentional action ("Pay!"), suggesting downward causation. Effects are "consequence," not mere chance.
      *   **Core Concepts:** Embodies debates on mental causation (can abstract meaning cause physical change?), substrate independence (can the *same* symbolic function be realized in different substrates?), and the causal efficacy of the normative (can an *ought* produce an *is* in the physical realm?).
  *   **Tone:** Formal, precise, imbued with the weight of a fundamental question. Suitable for concluding a graduate seminar, prompting reflection without definitive answer.
