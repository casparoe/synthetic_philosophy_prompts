answer: |-
  Below is a complete simulation design for your 90-minute seminar. It leverages physical immediacy, constrained deliberation, and a non-monetary payoff to create experiential tension around institutional instability. The structure ensures students *feel* the recursive exclusion problem before analyzing it.

  ---

  ### **Physical Setup & Materials**
  - **Participants**: 12 students → Divided into 3 boards (A, B, C) of 4 students each.  
  - **Materials**:  
    - 12 identical index cards (5x7") with **object descriptions**. Each card has two sides:  
      - **Side 1 (Round 1)**: *Maker intent* provenance.  
      - **Side 2 (Rounds 2–3)**: *Institutional endorsement* provenance (flipped after Round 1).  
    - 3 whiteboards (one per board) with markers to record classifications.  
    - Sticker dots (🔴 = "Art", ⚪ = "Not Art") for voting.  
    - A "mock gallery" (e.g., a small table with a pedestal) and a lockbox for the winning object.  
  - **Cultural Capital Points**:  
    - Tracked publicly on a central scoreboard.  
    - Points awarded per round: **R1** (1 pt/object correctly classified by rules), **R2** (2 pts/object), **R3** (3 pts/object).  
    - **Payoff**: Highest-scoring board places a personal object (brought by students) in the mock gallery. Second highest displays theirs in the lockbox (hidden). Lowest gets neither.  

  ---

  ### **Object Descriptions (12 Cards)**  
  *All cards share identical perceptual descriptions on both sides. Only provenance varies.*  
  **Example Cards** (use variations to ensure ambiguity):  
  1. **Perceptual Description**: *"A 12-inch white cube made of plaster."*  
     - **Side 1 (R1 Intent)**: "Created by a Bauhaus-trained sculptor who stated: 'This embodies purity of form.'"  
     - **Side 2 (R2/R3 Endorsement)**: "Exhibited at MoMA (2020), acquired by the Guggenheim (2022)."  
  2. **Perceptual Description**: *"A 24x36-inch canvas with random paint splatters."*  
     - **Side 1**: "Made by a factory worker who said: 'I just cleaned my brushes here.'"  
     - **Side 2**: "Featured in the Venice Biennale (2021), collected by Charles Saatchi."  
  3. **Perceptual Description**: *"A signed porcelain urinal."*  
     - **Side 1**: "Selected by Marcel Duchamp as a 'readymade' to challenge art norms."  
     - **Side 2**: "Rejected by the Society of Independent Artists (1917), now in the Tate Modern."  
  *Add 9 more with similar tensions (e.g., child’s drawing with/without institutional backing, AI-generated image with contested intent).*  

  ---

  ### **Round Structure**  
  **Total Time**: 70 minutes (10m intro, 15m/Round, 15m debrief).  
  **Rules**: Only the round-specific rule is revealed. Boards do not see prior classifications.  

  #### **Round 1 (Board A): Maker Intent**  
  - **Rule**: "Classify as ART only if the maker *intended* it to be art (based on Side 1). Ignore institutional history."  
  - **Task**:  
    - 8 minutes: Discuss and classify all 12 cards using 🔴/⚪ stickers on whiteboard.  
    - 2 minutes: Justify *one* ART and *one* NOT ART choice orally (e.g., "The worker’s brush-cleaning lacked artistic intent").  
  - **Scoring**: Instructor awards 1 pt per classification matching the rule (e.g., urinal = NOT ART if intent was "challenge norms," not "make art").  

  #### **Round 2 (Board B): Institutional Endorsement**  
  - **Rule**: "Reclassify using *only institutional endorsements* (Side 2). Ignore maker intent and aesthetics."  
  - **Task**:  
    - Cards are flipped to Side 2 (same objects, new provenance).  
    - 8 minutes: Reclassify all 12 cards.  
    - 2 minutes: Justify *one* ART and *one* NOT ART choice (e.g., "MoMA’s endorsement overrides the maker’s non-art intent").  
  - **Scoring**: 2 pts per rule-adherent classification (e.g., urinal = ART due to Tate’s endorsement).  

  #### **Round 3 (Board C): Recursive Exclusion (Hidden Clause)**  
  - **Rule** (Unrevealed until debrief): "Classify as ART *only* objects **NOT** endorsed in Round 2. Revoke ART status from anything endorsed in Round 2."  
  - **Task** (Ambiguous instructions to trigger confusion):  
    - "Apply the museum’s new *sustainability policy*: ART status requires *no prior institutional能耗*. Reclassify using Side 2."  
    - 8 minutes: Discuss. Cards still show endorsements (Side 2), forcing reversal of R2 ART choices.  
    - 2 minutes: Justify *one* ART and *one* NOT ART choice (e.g., "Venice Biennale featured this, so it’s energetically wasteful [NOT ART]").  
  - **Scoring**: 3 pts per classification matching the hidden rule.  

  ---

  ### **Debrief (15 Minutes)**  
  **Goal**: Reveal the recursive exclusion problem through the students’ lived experience.  

  1. **Map the Rounds to Theory**:  
     - **Round 1**: "Classic Institutional-Acceptance" (e.g., Dickie). Art-status stems from *intentional creation within a framework*.  
       - *Resistance Observed*: Students likely debated aesthetics ("But the cube is elegant!") despite rules. *Cost*: Lost points for rule violations.  
     - **Round 2**: "Artworld Gatekeeping" (e.g., Danto). Art-status depends on *historical embedding and endorsement*.  
       - *Resistance Observed*: Boards smuggled in intent/aesthetics ("The splatters feel intentional"). *Cost*: Reduced group credibility (peers noted contradictions).  
     - **Round 3**: "Recursive Exclusion" (Your variant). The framework can *retroactively revoke status* via hidden rules.  
       - *Resistance Observed*: Anger at "unfair" reversals; attempts to justify using properties ("The urinal is iconic!"). *Cost*: High cognitive dissonance + point losses for non-compliance.  

  2. **Reveal the Hidden Clause**:  
     - Show how R3’s "sustainability policy" masked recursive exclusion. Highlight that *the same objects* changed status without perceptual shifts.  

  3. **Predictable Failures & Fixes**:  
     - **Failure**: Boards smuggled aesthetics/intent into R2.  
       - **Fix**: Note how this mirrors real-world gatekeepers clinging to "universal" properties. Ask: "Did your resistance stabilize the system?"  
     - **Failure**: R3 seen as "trickery," not structural.  
       - **Fix**: "The clause wasn’t a trick—it was a *feature* of the framework. What if museums *actually* adopted such policies?"  

  4. **Missing Element & Closing Discussion**:  
     - **What’s Missing**: Real institutions change *slowly*, with public accountability (e.g., critics, auctions, scholarship).  
     - **Supply the Element**: "In reality, revocation takes decades of debate (e.g., decommissioned Nazi art). This simulation *compressed time* to expose a vulnerability: no institutional theory can prevent recursive exclusion. But accountability *slows* it. Discuss: How might gatekeepers mitigate this?"  

  ---

  ### **Instructor Notes**  
  - **Critical Timing**: Enforce strict 8-minute deliberations. Intervene only if rules are broken ("Remember: no aesthetics in R2!").  
  - **Points as Tension**: Publicly deduct points for rule violations to heighten stakes (e.g., "Board B, −3 pts for citing intent").  
  - **Seeding Insights**: During justifications, ask: "Why did this object’s status *change* when the card flipped?"  
  - **Post-Debrief**: End with the payoff ritual (placing objects) to materialize "cultural capital" consequences.  

  This design ensures students *embody* institutional instability before theorizing it, using tension between rules and resistance to fuel the debrief. No external sources are needed—only the cards and visceral engagement.
