answer: |-
  ## Joint Statement: Adversarial Collaboration on the Statue and Clay Problem
  **Participants:** Unitarian Delegation (U) & Pluralist Delegation (P)
  **Domain:** Ontology of Material Objects, Specifically Coincident Objects
  **Date:** (Imaginary) October 26, 2023

  **Brainstormed Core Issues:**
  *   **Numerical Identity vs. Distinction:** Are the statue and the lump of clay literally one object (U) or two distinct objects sharing the same space at the same time (P)?
  *   **Persistence Conditions:** Do objects have essential modal properties that dictate how they *must* persist? (U: Some properties are essential only derivatively; P: Objects have intrinsic persistence conditions).
  *   **Ontological Status of Form:** Is "being a statue" a fundamental ontological category (P), or is it merely a way matter is arranged or described, with no additional object created (U)?
  *   **Object Counting:** How do we count objects occupying the same region? Does our practice track a single ontological ground (U) or multiple grounds (P)?
  *   **The Squashing Case:** Why does flattening the statue seem to destroy the statue but not the lump? What does this reveal about what exists?
  *   **Modal Properties & Essences:** How do we explain the apparent difference in how the statue *could have been* (e.g., made of marble) vs. how the lump *could have been* (e.g., scattered)?
  *   **The Scan-and-Print Scenario:** Does creating a perfect replica elsewhere affect the modal properties or identity conditions of the original bronze statue/lump? What does it reveal about form and matter?

  **1. Agreed Upon Claims & Phenomena Needing Explanation (Signed by U & P):**

  1.  **Descriptive Phenomenon:** Our ordinary language and practices treat "the statue" and "the clay/lump" as distinct in significant ways, particularly concerning persistence, destruction, and modal possibilities.
  2.  **Persistence Disparity:** If the statue is squashed flat (destroying its form but leaving the clay matter largely intact), we standardly say the statue ceases to exist while the lump of clay persists (albeit deformed).
  3.  **Modal Disparity:** We standardly judge that the lump of clay could have existed without ever being statue-shaped (e.g., formed into a pot or scattered). Conversely, we standardly judge that *this statue* could not have been made of entirely different matter (e.g., marble instead of bronze), while the lump could have been made of *slightly* different matter (e.g., missing one atom).
  4.  **Spatial Coincidence:** At the time the statue exists, the region of space occupied by the statue is also occupied by the lump of clay. There is no spatial separation.
  5.  **Counting Puzzle:** Counting distinct objects within a single spatial region at a time is problematic for common-sense intuitions. We seem to count by form/function, not just by matter or location.
  6.  **Scan-and-Print Scenario Description:** Creating a perfect digital scan of the statue and 3D-printing an identical copy in marble results in a numerically distinct object (the marble replica) existing elsewhere. This replica shares the form but not the matter of the original bronze statue.
  7.  **Scan-and-Print & Original's Actuality:** The creation of the marble replica does *not* alter the actual, non-modal properties of the original bronze statue/lump (e.g., its location, mass, chemical composition, current shape). Any effect is on our *understanding* or *description* of modal properties, not the actual object(s).
  8.  **Explanandum:** Any successful ontology must explain (1) the persistence disparity (squashing), (2) the modal disparity, (3) the spatial coincidence, and (4) our counting practices, without undue paradox or implausibility.

  **2. Disagreements Table (Precise Formulations):**

  | Aspect               | Unitarian Position (U)                                                                                                | Pluralist Position (P)                                                                                                 |
  | :------------------- | :-------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- |
  | **Numerical Identity** | There is exactly one material object present: the lump of clay. The statue is not a distinct object; it is *identical* to the lump of clay. "Statue" refers to that lump *considered under a description* that highlights its current arrangement and function. | There are exactly two distinct material objects present: the statue and the lump of clay. They are numerically distinct but share all their matter and spatial location at the time the statue exists. |
  | **Ontology of Form**   | Form (e.g., statue-shape) is not a fundamental ontological constituent creating a new object. It is a contingent property or "mode" of the matter (the lump). Arrangement does not generate a new entity. | Form (e.g., statue-shape) is an ontologically significant principle. When matter is arranged statue-wise, a new, distinct object – the statue – comes into existence, coinciding with the lump of matter. |
  | **Persistence Conditions** | The lump of clay has its own persistence conditions (roughly, continuity of its matter). The "persistence conditions of the statue" are just the conditions under which we *apply the description "statue"* to the persisting lump. They are not intrinsic to a distinct object. | The statue and the lump have distinct, intrinsic persistence conditions. The statue requires persistence of its specific form (or function) for identity, while the lump requires only persistence of its matter (within certain bounds). |
  | **Squashing Explanation** | Squashing destroys the arrangement (the mode) that made it apt to call the lump "a statue." The lump persists, now deformed. Only one object existed before and after. | Squashing destroys the statue-object (by destroying its essential form) while the lump-object persists. This demonstrates the distinctness of the objects and their different survival conditions. |
  | **Scan-and-Print & Modality (Basic View)** | The modal properties of the lump (what it could have been) are fundamental. The "modal properties of the statue" are just constraints on how we describe the lump's possibilities given its actual form. The replica highlights the contingency of form on *this* matter. | The statue has its own intrinsic modal properties (e.g., essentially having *this* form or being made of *this* bronze). The replica, being distinct matter, is irrelevant to the original statue's modal profile, confirming its distinctness. |

  **3. Cruxes of the Dispute:**

  *   **Crux 1: Is Form Ontologically Basic?**
      *   **Concrete Case:** The **Scan-and-Print Scenario**. Can form exist independently of specific matter (as the replica seems to show), and does this imply form is a principle capable of constituting a distinct object?
      *   **U Prediction:** The scenario confirms form is separable from *specific* matter contingently. However, it doesn't show form is an independent *constituent* generating a new object *coincident with the original matter*. The replica is a new object made of new matter *instantiating the same form type*. This supports the view that "statue" is a phase sortal applied to matter instantiating a form, not an entity created *by* the form coinciding with the matter. The original remains one object (the lump), whose modal properties are grounded solely in its matter and its actual arrangement being contingent.
      *   **P Prediction:** The scenario demonstrates that form (as a type) is real and can be multiply instantiated by distinct parcels of matter. This strengthens the view that when a specific form is instantiated *in* a specific parcel of matter (like the bronze), it constitutes a new, distinct object (the statue) *alongside* the matter-object (the lump). The replica's existence elsewhere doesn't affect the original statue because form is the principle individuating *that* statue-object tied to *that* bronze. The original region contains two objects because two distinct principles (matter & form) are realized there.

  *   **Crux 2: Does Object-Counting Track Real Joints or Pragmatic Classification?**
      *   **Concrete Case:** **Everyday Counting Practices & Explanatory Power**. Why do we intuitively count the statue and clay as two things in explanations (e.g., "I destroyed the statue but kept the clay")? Is this because there *are* two things, or because we find it pragmatically useful to classify the one thing under two different aspects?
      *   **U Prediction:** Our counting practices are driven by pragmatic interests and the different modal profiles *describable* of the single object. We count by sortals (concepts) that track important contingent properties or functions, not by distinct ontological entities. The persistence of these pragmatic counting practices doesn't require ontological pluralism; a single object with rich modal and descriptive possibilities suffices. The "explanatory power" comes from describing the object's properties and their changes, not invoking distinct coincident entities.
      *   **P Prediction:** Our robust and systematic counting practices (especially evident in persistence judgments like squashing) track genuine ontological distinctions. The best explanation for why we *must* say the statue is gone but the clay remains after squashing is that there were genuinely two things there, and one was destroyed while the other persisted. Pragmatic classification alone cannot adequately explain the *modal force* and *explanatory indispensability* of counting them as two distinct objects with different survival conditions. The joints are real, and our counting reflects that.

  **4. Is the Dispute Verbal?**

  Both delegations agree that **the core dispute is not merely verbal**. While there are terminological differences (e.g., how "object" or "form" is used), the disagreement runs deep:

  *   **Substantive Ontological Commitment:** Unitarians deny the existence of any object beyond the lump of clay arranged statue-wise. Pluralists affirm the existence of an additional object, the statue, constituted by that form and matter. This is a disagreement about what fundamental entities exist in the world.
  *   **Ground of Modal Properties:** The disagreement about whether modal properties (like "could not have been made of marble") are grounded solely in the matter and its contingent properties (U) or are intrinsic to a distinct, form-constituted object (P) reflects a substantive difference in how possibilities are anchored in reality.
  *   **Explanation of Persistence Disparity:** The explanations offered for the squashing case (loss of description/mode vs. destruction of an object) represent fundamentally different metaphysical accounts of change and destruction.

  **However,** both sides acknowledge that *some peripheral aspects* might involve terminological preferences or emphasis. For instance, how one defines "constituent," "mode," or "priority" (temporal, ontological, explanatory) might involve some conceptual flexibility, but these do not erase the fundamental ontological divide concerning the number of objects present. The disagreement over whether "the statue" *refers to* the lump-under-a-description or to a distinct object is the heart of the matter and is not resolvable by stipulation.
