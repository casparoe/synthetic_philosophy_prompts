answer: |-
  The dust in the Archive of the Rotating City had a peculiar weight. It wasn't just particulate matter; it was the accumulated sediment of *happenedness*, settling into grooves worn not by years, but by loops. Marlowe, Senior Archivist Third Class (Causal Chains), knew this intimately. Her job wasn't to file by date – a concept as slippery and unreliable as wet soap here – but by the intricate lattice of cause and effect. *The Mayor's Speech (Re: Grain Shortage)* preceded *The Baker's Guild Protest*, which precipitated *Revised Rationing Edict*, which looped back to influence the perceived *cause* of the Grain Shortage itself. Time wasn't a river here; it was a Möbius strip made of string.

  She cataloged events not as points on a line, but as knots in a vast, self-intersecting net. "Event 743-B: Shattered Window (North Atrium). Cause: Impact from flying debris (identified as fragment of Statue Plinth). Effect: Draft noted in Register of Environmental Anomalies (Vol. LXVII, pg. 812), subsequent repair request (File: Maintenance/Atrium/Structural)." The repair request might, in another causal strand, be the reason the statue plinth was inadequately secured in the first place. Marlowe didn't judge; she mapped.

  Her desk was an island of meticulous chaos. Scrolls unfurled like tributaries, each annotated with arrows indicating dependency. She'd long abandoned clocks; the great chronometers in the Central Hall were beautiful, pointless sculptures, their hands spinning with serene indifference to the actual sequence of events around them. "Privileged simultaneity," she’d once muttered to Silas, her perpetually flustered colleague in Chronological Reconciliation (a department she privately considered quixotic), "is like trying to nail jelly to the wall. It just squirms away."

  Silas, perpetually clutching a ledger marked with frantic, overlapping timelines, shuddered. "But Marlowe, the *loops*! It renders choice meaningless! If I file this requisition *now*, but it's the cause of my *receiving* the requisition forms last week... where's the *me* in that? Where's the free will?"

  Marlowe carefully aligned the corner of a scroll detailing the genealogy of sewer rats (a surprisingly complex causal web involving misplaced cheese and a mayoral decree on pest control). "The cheese still attracts the rat, Silas," she said patiently. "The broken pipe still floods the cellar. Locally, cause leads to effect. The hammer hits the nail, the nail holds the wood. The loop…" She gestured vaguely upwards, towards the vaulted ceiling that seemed to curve subtly, perpetually, "the loop is just the shape of the room. It doesn't change the fact that *you* pick up the hammer. Or decide not to."

  Silas sighed, unconvinced. "Feels like fate woven into the stonework."

  Marlowe understood the unease. She felt it herself, sometimes, a vertigo when tracing a chain and finding it curled back towards its origin like a snake biting its own tail. But the local logic held: fire needed fuel and spark; anger needed insult; the broken window needed the flying stone.

  Then came the day she found the note.

  She was cross-referencing minor atmospheric pressure fluctuations (possible cause: ceremonial bell ringing in the Western Spire; effect: slight increase in reported headaches in the adjacent residential sector) when she slipped a thin, folded parchment into the "Uncategorized Anomalies" box. It was a standard archival scrap, the rough, slightly fibrous paper they all used. Unfolding it, her breath hitched.

  In her own precise, slightly angular handwriting, it read:

  > *Significant thermal event imminent. East Wing, Subsection Gamma (Botanical Specimens, Pre-Collapse). Origin: Faulty rewiring in climate control junction box (Alpha-7). Catalyzed by accumulated volatile compounds from decaying specimen #447 (classified 'Nightshade Variant?'). Containment compromised. Evacuation protocols recommended for Sections Gamma through Epsilon prior to ignition. - M.*

  Her blood ran cold, then peculiarly hot. The East Wing? Gamma Subsection? She’d *just* been there yesterday, verifying the integrity of the climate seals for the Pre-Collapse Flora. Everything was normal. Cool, slightly humid air, the faint, sweet-rotten smell of ancient plants preserved in stasis fluids. Junction Box Alpha-7 was humming quietly. Specimen #447 was sealed tight. No fire. Not yet.

  But the handwriting was indisputably hers. The phrasing, the clipped archival tone, the specific reference to the volatile compounds she'd only *just* cataloged herself yesterday… Was this a prediction? A horrifyingly specific premonition scribbled in a moment of clairvoyance she didn't possess? Or… was it a *memory*? A record of something that had already happened, in a loop she hadn't consciously traversed yet? The note felt… *lived-in*. The crease was sharp, the ink slightly faded, as if it had sat folded in a pocket for a while.

  She stared at the words, the neat letters blurring. *Prior to ignition.* Was she reading this *before* the fire, or *after*? Without an absolute 'now', without that universal clock ticking somewhere, the distinction collapsed. The note existed. The causes it described – the faulty wiring, the decaying specimen – were verifiable *now*. The predicted effect – the fire – was absent *now*. But the note itself was evidence… of what? A future cause reporting its own effect? A past effect documenting its cause? It was a perfect, maddening closed loop scribbled on cheap paper.

  The familiar vertigo washed over her, stronger this time. She thought of Silas and his fear of lost free will. Did finding this note compel her? Was she now fated to *make* it happen? To ensure the wiring failed, the specimen decayed? Panic fluttered, cold and sharp.

  Then she looked down at the meticulous causal chain she’d been building for the atmospheric pressure. Bell rings (cause) -> pressure wave (effect) -> headaches (effect). Locally linear. Locally real. The note was just another event, a knot in the net. Its cause? Perhaps her own future observation of the fire. Its effect? Her current state of dread, her next actions.

  She wouldn't let the global loop paralyze her locally. The wiring *could* be faulty. The specimen *might* be decaying. Those were local facts, actionable now. She picked up her pen, her hand steadying. On a fresh scrap, she began drafting an urgent maintenance request for Junction Box Alpha-7 and a hazard reassessment for Specimen #447. Cause: Archival Note (Ref: Uncategorized Anomaly #1023). Effect: (Pending).

  The fire might be inevitable in the grand, twisted geometry of the Rotating City. Or it might be averted. From the perspective of the Archive's curved spacetime, both might be true simultaneously. But here, at her desk, pen scratching on paper, Marlowe felt the solid click of cause and effect. She filed the note under "Incident Precursors (Verified Causes)", her own handwriting facing her like a ghost, or a promise, or simply the archive’s true nature, patiently revealing itself one loop at a time. The dust continued to settle, indifferent to where, or when, it landed.
