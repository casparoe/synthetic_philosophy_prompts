answer: |-
  Here are five numbered points comparing evolutionary debunking arguments (EDA) and the moral exaptation view regarding the status of moral beliefs:

  1.  **EDA emphasizes causal origin:** EDAs argue that the selective origins of moral beliefs (e.g., kin/in-group cooperation) reveal they weren't shaped to track objective moral truths, directly undermining their justification.
  2.  **Exaptation emphasizes current function:** The exaptation view highlights how these repurposed mechanisms now serve a distinct, broader function (universal ethics), potentially allowing them to be responsive to genuine normative reasons *now*, regardless of origin.
  3.  **EDA sees origins as contaminating:** For EDAs, the tribal origin fundamentally taints the epistemic status of current moral beliefs, suggesting they remain unreliable guides to truth even in their new application.
  4.  **Exaptation allows for functional reconstruction:** Exaptation suggests the original mechanisms provide raw material that can be rationally refined and calibrated over time to better serve their new, universalist function, potentially mitigating the debunking force.
  5.  **EDA questions reliability wholesale:** EDAs contend that the evolutionary origin reveals an inherent unreliability in the *faculty* producing moral beliefs, making skepticism about objectivity warranted.
  5.  **Exaptation suggests reliability can be repurposed/improved:** The exaptation view posits that while the initial trigger was non-moral, the *resulting* cognitive and motivational systems, when functioning in their new role, could develop reliability for discerning broader moral demands.
