prompt: |-
  I am a senior software architect who works daily with distributed version control—particularly Git's object model, directed acyclic graphs of commits, reflogs, rebasing, and the distinction between a repository's working tree and its object database—but I have almost no exposure to analytic metaphysics. I would like you to restate Derek Parfit's teletransporter scenario and his central claim that psychological continuity, not bodily continuity, constitutes what matters in personal survival, translating every element into the vocabulary I actually use: commits as mental states or memories, object hashes as identity conditions, branches as diverging histories, clones and remotes as reconstructed bodies, merges and rebases as continuity relations, and the reflog as a record of past identities. Be as faithful as possible: do not smuggle in metaphysical assumptions under technical terms, and do not pretend that Git's design resolves philosophical questions it was never meant to address.

  Then provide the residue report that is the heart of my request. For each of Parfit's key moves—the scan-and-destroy procedure, the claim that relation R (psychological connectedness with the right kind of cause) is sufficient for survival, the branching or fission case where one original produces two psychologically continuous successors, and the rejection of bodily identity as necessary—state whether it translates cleanly into repository semantics, whether it survives only with serious distortion, or whether it has no expression at all in how Git handles provenance, authorship, and history. Pay particular attention to the fission problem: Git allows branching, but does its model contain any analogue to the normative or metaphysical worry about whether both successors are equally the original? Also address whether anything essential in Parfit's debate is genuinely absent from distributed version control theory, or whether the residue merely shows that Git concerns code lineage rather than ontological persistence. Please answer in British English, and avoid bibliographies, citation lists, or references to specific page numbers.
