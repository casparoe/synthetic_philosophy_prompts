prompt: |-
  Draft the joint adversarial-collaboration statement between a pure consequentialist about practical rationality and a defender of structural-commitment rationality regarding whether honoring sunk costs is ever rational. The document should have four parts: (1) numbered agreed claims about the nature of sunk costs, standard decision-theoretic treatment of irrecoverable investment, and the psychological mechanisms underlying escalation (e.g., loss aversion, self-justification); (2) the precise disagreement in wording each side accepts—specifically, whether unrecoverable past expenditure can ever carry rational weight, either instrumentally through credible commitment or signaling, or non-instrumentally through narrative identity continuity; (3) the cruxes, including whether rational evaluation applies to single acts or to extended plans, and whether consistency with one's prior commitments has independent normative value; (4) for each crux, one concrete hypothetical case both sides agree is diagnostic, with each side's predicted rational response recorded in advance. Do not include bibliographies, reading lists, or citations; do not invoke niche formalisms or scholars that a generally knowledgeable model could not be expected to have encountered.
reasoning: |-
  We are drafting a joint statement between a pure consequentialist (C) and a defender of structural-commitment rationality (S). The document has four parts.

  Part 1: Agreed Claims
  We agree on the following:
  1. Sunk costs are investments (time, money, effort, etc.) that have been incurred and cannot be recovered.
  2. Standard decision theory (e.g., expected utility theory) holds that rational decisions should be based solely on future consequences; sunk costs are irrelevant to the rational choice among future options.
  3. Despite this, humans often exhibit "sunk cost fallacy" (escalation of commitment), where past investments influence ongoing decisions. This is well-documented in psychology and behavioral economics.
  4. Psychological mechanisms underlying escalation include:
     a. Loss aversion: the disutility of a loss is greater than the utility of an equivalent gain, leading to efforts to avoid realizing losses.
     b. Self-justification: the desire to avoid admitting that a prior decision was a mistake.
     c. Project completion: the desire to see a project through to completion due to a sense of duty or the perceived waste of abandoning it.
  5. These psychological mechanisms are often maladaptive, leading to suboptimal outcomes.

  Part 2: Disagreement
  The precise point of disagreement is whether unrecoverable past expenditures can ever carry rational weight in decision-making. 
  - C maintains that sunk costs are never rationally relevant. Rationality requires evaluating actions solely by their prospective consequences. Any influence of sunk costs is irrational.
  - S maintains that sunk costs can sometimes carry rational weight. This can occur in two ways:
     (i) Instrumentally: honoring sunk costs may serve as a credible commitment device (e.g., signaling to others that one is persistent, which might yield future benefits) or as part of a signaling strategy that affects others' behavior.
     (ii) Non-instrumentally: honoring sunk costs may be required for maintaining narrative identity continuity (i.e., being true to one's past commitments and projects as part of a coherent life story), which has intrinsic normative value.

  Part 3: Cruxes
  We identify two cruxes that underlie the disagreement:
  Crux 1: The unit of rational evaluation
     - C: Rational evaluation applies primarily to single acts (or to sequences of acts only insofar as they are evaluated by their aggregate consequences). Each decision should be made on the basis of the expected consequences from that point forward.
     - S: Rational evaluation applies to extended plans and commitments over time. Rationality requires consistency with prior commitments that define one's ongoing projects and identity, even if it leads to lower consequences in a particular instance.

  Crux 2: The normative value of consistency with prior commitments
     - C: Consistency with prior commitments has no independent normative value. It is only instrumentally valuable if it leads to better consequences (e.g., building trust with others).
     - S: Consistency with prior commitments has independent normative value because it is constitutive of rational agency and the maintenance of a coherent narrative identity. Breaking commitments without a compelling reason (even if it leads to marginally better consequences) undermines the agent's integrity and the structure of practical rationality.

  Part 4: Diagnostic Cases
  For each crux, we provide one hypothetical case that both sides agree is diagnostic. Each side's predicted rational response is recorded.

  Case for Crux 1 (Unit of rational evaluation):
  The Marathon Runner
     A runner has trained for 6 months for a marathon, incurring significant time, effort, and financial costs. On the day of the marathon, they feel a slight knee pain. A doctor at the start line says there's a 10% chance that running will cause a serious injury requiring surgery and 6 months of recovery. The runner estimates that the benefits of completing the marathon (without injury) are high (personal achievement, etc.), but the costs of injury are severe. Without the sunk costs, the runner would not run because the expected utility (EU) calculation (factoring in the 10% risk) is negative. However, having invested so much, the runner feels compelled to run.

     - C: The sunk costs of training are irrelevant. The runner should decide based on the current expected utility: the 10% risk of severe injury versus the 90% chance of achieving the benefits. If the EU is negative, do not run. (Prediction: The runner should not run.)
     - S: The sunk costs are part of a larger project (training for and completing the marathon) that the runner has committed to. Abandoning it now would be a failure of the project and a waste of the investment. The runner should run, provided the project is central to their identity and they are prepared to accept the risk as part of honoring the commitment. (Prediction: The runner should run, unless the risk is so high as to be reckless.)

     Note: Both sides agree that if the risk were much higher (say 50%), S might also agree not to run. But at 10%, the case is diagnostic.

  Case for Crux 2 (Normative value of consistency):
  The Abandoned Book
     An author has spent 5 years writing a book. They have invested deeply and made public commitments to their publisher and readers. The book is near completion, but the author realizes that it will not be successful (financially or critically) and that their time would be better spent on a new, more promising project. The author also knows that abandoning the book would damage their reputation for reliability, but they can mitigate this by publicly explaining the situation and showing evidence of the new project's potential. The consequentialist calculation (including the reputational effects) suggests abandoning the book and starting the new project.

     - C: The author should abandon the book and start the new project. The sunk costs of writing are irrelevant. The calculation of future consequences (including reputational effects that can be mitigated) favors switching. (Prediction: Abandon the book.)
     - S: The author should complete the book. Honoring the commitment to the project and to the stakeholders (publisher, readers) is intrinsically important for maintaining the author's integrity and narrative identity as a reliable author. The sunk costs represent a commitment that should be honored unless there is a compelling reason (e.g., a catastrophic consequence). (Prediction: Complete the book.)

     Note: Both sides agree that if abandoning the book would cause catastrophic reputational harm (e.g., ending the author's career) then even S might concede that avoiding that consequence is paramount. But in this case, the reputational harm is manageable, so the case is diagnostic.

  By signing below, we agree that this document fairly represents our agreement and disagreement.

  [Signature line for C]
  [Signature line for S]
answer: |-
  ### Joint Adversarial-Collaboration Statement:  
  **On the Rationality of Honoring Sunk Costs**  
  *Between a Pure Consequentialist (C) and a Defender of Structural-Commitment Rationality (S)*  

  ---

  #### **Part 1: Agreed Claims**  
  We jointly affirm:  
  1. **Sunk costs** are investments (e.g., time, money, effort) irreversibly incurred in the past. They are unrecoverable and cannot be altered by present or future actions.  
  2. **Standard decision-theoretic treatment**: Rational choice requires evaluating actions based *solely* on their expected future consequences. Sunk costs are irrelevant to this calculus; only marginal costs/benefits moving forward matter.  
  3. **Psychological mechanisms** explain why humans often honor sunk costs:  
     - **Loss aversion**: Overweighting losses relative to gains, making abandonment feel like admitting defeat.  
     - **Self-justification**: Avoiding cognitive dissonance by doubling down on prior choices to protect self-image.  
     - **Completion bias**: A visceral aversion to "wasting" resources, even when irrational.  
  4. These mechanisms frequently lead to **escalation of commitment**—persisting in failing endeavors (e.g., finishing a bad movie because the ticket was expensive). This is typically suboptimal.  

  ---

  #### **Part 2: Disagreement**  
  We disagree on the following:  
  > *Can unrecoverable past expenditures ever carry rational weight?*  
  - **C**: No. Rationality demands *exclusive* focus on future outcomes. Sunk costs are psychologically tempting but normatively inert. Any weight given to them is irrational.  
  - **S**: Yes. Rational weight can arise:  
    - **Instrumentally**: Honoring sunk costs may serve as a *credible commitment device* (e.g., signaling tenacity to allies/deterring adversaries) or maintain self-trust for long-term goals.  
    - **Non-instrumentally**: Upholding past commitments sustains *narrative identity continuity*—being "true to oneself" across time has intrinsic value, independent of consequences.  

  ---

  #### **Part 3: Cruxes**  
  The disagreement hinges on two unresolved principles:  
  1. **Unit of rational evaluation**:  
     - **C**: Rationality applies to *atomic acts*. Each choice must maximize expected value from its immediate standpoint.  
     - **S**: Rationality applies to *extended plans*. Commitments bind acts into coherent wholes; breaking them disrupts agency.  
  2. **Value of consistency**:  
     - **C**: Consistency has *no independent normative value*. It is only instrumentally useful if it improves outcomes.  
     - **S**: Consistency with prior commitments has *intrinsic value* as a constitutive element of integrity and identity.  

  ---

  #### **Part 4: Diagnostic Cases**  
  *Both sides agree these cases test the cruxes. Predictions are binding.*  

  **Case 1 (Unit of Evaluation): *The Biotech Startup***  
  *Context*: You invested $500K and 3 years in a startup developing a medical device. It now requires $200K more to complete. An independent review shows a 5% chance of success (yielding $10M) and 95% failure. Abandoning it frees resources for a new venture with a 10% chance of $5M.  
  - *C's rational response*: Abandon. Expected value of continuing: (0.05 × $10M) - $200K = **$300K loss**. New venture: (0.10 × $5M) = **$500K gain**. Sunk costs are irrelevant.  
  - *S's rational response*: Continue. The investment reflects a *planned multi-year endeavor*. Abandoning mid-project wastes accumulated expertise and betrays stakeholder trust, damaging future credibility.  

  **Case 2 (Value of Consistency): *The Wedding Vow***  
  *Context*: On your wedding day, you learn your spouse has a terminal illness (life expectancy: 1 year). Marrying entails $50K in care costs and emotional toll; leaving avoids costs but breaks vows. Future consequences (e.g., social judgment) are neutralized—no one else will know if you leave.  
  - *C's rational response*: Leave. The marriage yields net suffering ($50K + grief) with no offsetting gains. Vows are mere words; rationality minimizes future harm.  
  - *S's rational response*: Marry. Upholding the vow maintains *narrative identity* as a loyal partner. Reneging fractures self-integrity, irrespective of consequences.  

  ---  
  *Signed,*  
  **Pure Consequentialist (C)**  
  **Defender of Structural-Commitment Rationality (S)**  
