  The user is drawn to the interactive display because it avoids erasing history or glorifying the person. But they're worried that keeping the name forces people, especially those harmed, to constantly engage with it. They need to decide whether to support the interactive option as a middle ground or push for renaming. They also want to know if contextualization can ever be reparative or if it's just decorating injustice.

