  ### Residue Report: Mapping Gaps in Clinical Frameworks  

  | Philosophical Claim               | Clinical Mapping Status                              | Critical Analysis |  
  |-----------------------------------|------------------------------------------------------|-------------------|  
  | **Lexical priority of suffering prevention** | *Distorted fit* via triage categories | Triage’s "Red-over-Yellow" hierarchy *approximates* lexical ordering but collapses under scarcity: in practice, multiple "Red" cases undergo QALY-based rationing (e.g., ventilator allocation scores). Absence reveals **genuine blind spot**: systems lack protocols for absolute suffering-priority when aggregate QALY loss is extreme (e.g., diverting all ICU resources to one torture survivor). |  
  | **Incommensurability thesis**     | *No counterpart* in QALY frameworks                  | QALY weights (0=death, 1=perfect health) presume perfect cardinal comparability. A year with migraines (-0.7 QALY) is deemed directly tradeable against 1.4 years of mild pleasure (+0.5 QALY). Absence suggests **operational dissolution**: once suffering/pleasure are compressed to a single metric, incommensurability becomes computationally incoherent. |  
  | **Threshold-dominated utility**  | *Partially mapped* via crisis cutoffs (e.g., MET activation) | Clinical emergency triggers (e.g., sepsis protocols) suspend elective care but *do not* override all other life-saving claims. Residue: no equivalent to "suffering below threshold voids *all* non-threshold QALY claims." Absence is a **blind spot**: frameworks lack "distress codes" that commandeer resources from non-emergent lifesaving (e.g., reallocating dialysis slots to hospice pain crises). |  
  | **Non-aggregation principle**     | *Actively contradicted* by allocation math           | QALY maximization inherently aggregates across individuals. Preventing ten mild headaches (0.1 QALY loss each) will always outweigh preventing one severe torture-state (0.95 QALY loss) in standard models. Contradiction reveals **structural incompatibility**: clinical ethics accepts aggregation where philosophy demands singularity. |  

