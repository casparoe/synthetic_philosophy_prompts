answer: |-
  **Supervaluationism offers the coherent account of legal thresholds like recklessness, while epistemicism collapses under second-order vagueness by smuggling sharp boundaries into law's admitted indeterminacy.**  

  Epistemicism insists there *is* a precise fact (e.g., "recklessness begins at *exactly* 37.5% foreseeable harm probability"), but we cannot know it. Applied to law, this implies judges *aim* to discover this hidden boundary but fail due to ignorance. Yet this contradicts legal practice: judges explicitly *deny* such precision exists ("no bright line"), treating the threshold as inherently fluid. If epistemicism were true, legal reasoning would be a failed search for a knowable fact—but courts openly admit indeterminacy isn't an epistemic flaw *in them*, but in the *concept itself*. Epistemicism thus portrays legal actors as deluded about their own task, unable to explain why they reject the existence of sharp lines they're supposedly tracking.  

  Supervaluationism, however, mirrors legal practice:  
  - **Genuine indeterminacy at borders**: For borderline cases (e.g., 40% harm probability), there’s *no fact* whether it’s "reckless" or "negligent." Multiple precisifications (ways to sharpen the term) are equally legitimate.  
  - **Judicial precisification as resolution**: When a judge rules, they *select* one admissible precisification ("This *is* reckless"), creating a temporary, context-bound cutoff. This isn’t discovering a hidden truth but *resolving* vagueness to decide the case.  
  - **Second-order vagueness handled**: Disagreement over whether a case is "clearly reckless," "borderline," or "clearly negligent" reflects vagueness in *which* precisifications are admissible. Supervaluationism accepts this regress: indeterminacy runs all the way down. Legal reasoning pretends precision *only after ruling*—the judge’s decision *creates* a local sharp boundary ("For *this* case, it’s reckless"), while acknowledging the underlying concept remains vague.  

  **Where epistemicism breaks down**: It demands a hidden sharp boundary *even for "borderline-ness" itself*. If "reckless" has a secret cutoff, so must "clearly reckless" and "definitely not reckless." This implies unknowable hierarchies of boundaries—a regress courts explicitly reject. Legal actors *deny* that "no bright line" secretly *means* "there is a bright line we can’t find." Supervaluationism, by embracing truth-value gaps and precisification, explains why judges *perform* precision (to resolve disputes) without believing in metaphysical sharpness—cohering with law’s pragmatic confrontation with vagueness.
