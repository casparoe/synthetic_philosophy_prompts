  First, I should structure the questions around her main thesis. Start with how anatta solves personal identity without a self. Then move to karma and rebirth since that's a major objection. The user wants to press on the conventional self versus psychological continuity. Next, Hume's bundle theory comparison, highlighting momentariness. After that, memory and first-person authority. Then moral agency to address nihilism concerns. Finally, broader implications for Western philosophy.

