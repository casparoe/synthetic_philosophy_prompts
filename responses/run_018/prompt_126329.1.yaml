answer: |-
  Right, let's break down this clockmaker conundrum, keeping it away from just rehashing Ryle's beef with the "intellectualist legend".

  **The Gist:** Your clockmaker has **procedural fluency** – her hands *just know* how to work that escapement through years of practise. It's embodied, tacit, muscle-memory stuff. She can't recite the physics (**knowing-that**). The twist is **counterfactual robustness**: when you swap brass for softer aluminium, she instantly, *without thinking*, adjusts her touch. She doesn't reason "aluminium has lower yield strength, therefore I must reduce applied force". It's a seamless, non-conscious adaptation.

  **The Distinction & The Puzzle:**

  1.  **Procedural Fluency:** This is the *baseline skill*. She can reliably perform the *specific, practised task* (restoring *that* escapement design with *those* materials) because her sensory-motor system is finely tuned to those specific inputs and outputs. It's like riding *your* familiar bike.
  2.  **Counterfactual Robustness:** This is the *adaptive capacity*. It's her ability to *generalise* and *improvise* her skill when core parameters change unexpectedly (material properties). She isn't just running the old program; she's *subliminally recalibrating* based on new sensory feedback (the feel of the aluminium under her tools). It's like instantly adjusting your balance when hopping onto a different, wobbly bike.

  **Does she have both?** Absolutely. Her **procedural fluency** is obvious in the core task. The material swap reveals **counterfactual robustness**. Her embodied knowledge isn't brittle; it's deeply attuned to the *material affordances* and *dynamic feedback* of the task itself. Her hands "listen" to the metal and respond intuitively.

  **Why the Distinction Holds (Mostly):**
  *   You *could* imagine someone with **only procedural fluency**. They might perfectly restore the brass escapement but completely fumble with aluminium, applying the same force and wrecking it, because their skill is a rigid, context-locked routine – like a pianist who can only play one specific piano perfectly.
  *   The clockmaker exhibits **robustness beyond the practised routine**. Her adaptation isn't pre-programmed; it emerges from the *interaction* between her deeply ingrained sensorimotor understanding of clockwork mechanics and the *real-time feedback* from the new material. It's her *embodied intelligence* dynamically solving a novel problem within her domain.

  **The Intellectualist Claim & This Case:**
  The intellectualist (who says knowing-how *is* just knowing-that applied practically) has a tricky job here:

  1.  **The Challenge:** Her adaptation is *instantaneous* and *non-deliberative*. There's no conscious recall of facts ("Aluminium is softer"), no internal monologue, no practical syllogism running. It happens faster than explicit reasoning.
  2.  **The Intellectualist Move:** They'd likely argue she possesses *implicit* or *tacit propositional knowledge*. Maybe: "She *knows-that* softer materials require a gentler touch" or "She *knows-that* increased tool vibration indicates excessive force on a softer metal", but she just can't *articulate* these propositions.
  3.  **The Problem:** This feels like a stretch. Describing her skill *after the fact* in propositional terms isn't the same as showing those propositions *causally guided* her action *in the moment*. Her adjustment seems more like a direct, non-conceptual *calibration* – a sensory-motor loop adjusting gain, not a belief triggering an action. The "knowledge" is in the *doing and adapting*, not a hidden list of "that"-clauses. The intellectualist struggles to explain the *speed* and *non-conceptual feel* of the adaptation without making the "knowing-that" so implicit it loses its propositional character.

  **Verdict & Loose End:**

  *   **Verdict:** The distinction between procedural fluency and counterfactual robustness holds up; her embodied skill demonstrably possesses both.
  *   **Leftover Puzzle:** The real head-scratcher is **how exactly the embodied system encodes the 'rules' for adaptation**. Is it purely associative (softer feel -> lighter touch), a kind of dynamic systems resonance, or *does* it involve genuinely non-propositional, sensorimotor concepts ("yieldiness", "resistance") that guide the adjustment? We can *describe* it propositionally afterwards, but was that structure *causally active* in her hands?

