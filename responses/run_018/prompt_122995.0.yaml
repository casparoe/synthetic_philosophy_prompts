prompt: |-
  hey — I'm in 11th grade and I do Ethics Bowl, and one of our cases this year is about a school district that can only afford one of two things: an elevator for one girl who uses a wheelchair (right now someone has to carry her up a flight of stairs between classes, which is humiliating and she misses a lot of class), or new textbooks for about 1,800 kids where the benefit to each kid is pretty small. Our coach told me to look up Scanlon's contractualism because it says something interesting about cases where one person's loss is huge and everyone else's is tiny. I found a blog post explaining it and pasted a chunk into my notes:

  "Scanlon's contractualism says that an act is wrong if there is some principle for the general regulation of behaviour that no one could reasonably reject and that forbids the act. The 'no one could reasonably reject' bit puts it in the social contract tradition: morality is what self-interested people would agree to in a bargain, with the word 'reasonable' added to make it sound less brutal than Hobbes or Gauthier. The important upshot is that contractualism cannot add up benefits and burdens across different people. You have to look at each person's complaint one at a time, from that person's own point of view, and ask which complaint is strongest — you can never pile up a thousand weak complaints to beat one strong one. So numbers basically drop out entirely: one person losing a hand outweighs any number of people getting a stubbed toe, and one death outweighs any number of mild headaches, no matter how many. This means contractualism quietly collapses into Rawls-style maximin, since you always end up asking which single individual is worst off under each option. And because what matters is whether people actually object, anyone who complains loudly enough can effectively veto a principle, while burdens nobody bothers to complain about create no complaint at all. That last feature is what sinks the theory: no sane moral view says that one person's stubbed toe matters more than a million people's stubbed toes."

  My coach read my notes and just said the post is "caricature-grade" and walked off, which isn't super helpful. Can you go through it and tell me which bits are basically right, which are the kind of subtle misreading a defender of Scanlon would object to (like what two things are being conflated), and whether the "that's what sinks the theory" bit at the end actually follows from the parts that are true? I think I half-believe the numbers part because that's the part that makes it different from utilitarianism, but I genuinely can't tell where the summary stops being fair.

  Two more things. First: a commenter on the post said the standard contractualist fix is that complaints get ranked by strength and numbers only break ties between complaints of equal strength. Is that Scanlon's actual move or something a commenter made up, and does it help with the elevator case or does the elevator just win no matter how tiny the per-kid textbook benefit gets? Second, I keep wondering about a weird variant: what if instead of 1,800 kids each getting one small benefit, it's the same one kid getting a small benefit 1,800 times? If the answer changes there, that seems like it shouldn't matter as much as people think, but I can't say why. Anyway — no reading recs, I just want to know what's actually going on with the view.
reasoning: |-
  Okay, let's tackle this Ethics Bowl case. The user is in 11th grade and their coach pointed them towards Scanlon's contractualism for a dilemma involving a wheelchair elevator versus textbooks. They found a blog post that their coach called a "caricature," and now they're confused about what parts are accurate and what's misrepresented.

  First, I need to unpack the blog post's claims. It says contractualism doesn't aggregate harms—so one person's major burden can't be outweighed by many small ones. The coach dismissed this as oversimplified, so I should check Scanlon's actual position. From what I recall, Scanlon does emphasize individual standpoints but allows considering numbers in certain ways, like when identical complaints combine. 

  The user also mentions a commenter's suggestion about tie-breaking with numbers. Is that Scanlon's move? Looking at "What We Owe to Each Other," Scanlon discusses how similar burdens across many people can form a stronger collective complaint. But he's cautious—it's not straightforward aggregation. For the elevator case, if each textbook benefit is trivial, the girl's complaint likely wins. But if the textbooks' absence causes real harm, it might be different. The user's variant where one kid gets many small benefits is interesting. Contractualism would treat each benefit as a separate complaint, so numbers matter more here, but that feels counterintuitive. Why should the distribution change the moral weight? That highlights a tension in the theory.

  The blog's claim about veto power and complaints sinking the theory is a misreading. Scanlon's "reasonable rejection" isn't about loudness but objective burdens. Also, collapsing into maximin isn't accurate because contractualism considers all objections, not just the worst-off. The user needs clarity on these nuances. They might be conflating reasonable rejection with actual complaints, but it's about hypothetical agreement. 

  For the Ethics Bowl, the key is that the elevator has a strong case unless textbook deprivation is significant. The variant scenario shows contractualism's struggle with aggregation. The blog's "sinks the theory" part doesn't hold because it misrepresents the complaint mechanism. The user's deeper need is understanding how to apply contractualism to their case without oversimplifying. They need to articulate why numbers sometimes matter in a way that's consistent with Scanlon's framework, especially for tie-breaking or combined burdens.
answer: |-
  Here's a breakdown of the blog post's summary, identifying accurate points, subtle misreadings, and where the "sinks the theory" claim goes wrong, followed by answers to your specific questions:

  **Accurate Points in the Blog Post:**
  1.  **Anti-Aggregation Core:** The core claim that Scanlonian contractualism **does not allow simply adding up small individual benefits/burdens across many people to outweigh one person's very large burden** is fundamentally correct and central to the theory. This *is* the key difference from utilitarianism in cases like your elevator vs. textbooks dilemma.
  2.  **Individual Standpoint:** Contractualism requires considering the burdens or benefits **from the standpoint of each individual affected**. You must ask if a principle imposing a burden on *that specific individual* could be reasonably rejected *by them*.
  3.  **Reasonable Rejection:** The test *is* whether a principle could be "reasonably rejected" by someone affected by it, not whether it maximizes overall good.
  4.  **Numbers Aren't Decisive:** In cases involving one person with a very large burden vs. many with very small burdens (like stubbed toes vs. losing a hand), contractualism *will* side with preventing the large burden, regardless of the number of small burdens. Numbers alone don't trump.

  **Subtle Misreadings & Conflations (The "Caricature" Elements):**
  1.  **Conflating "Strongest Complaint" with Maximin:** The post claims contractualism "collapses into Rawls-style maximin." This is a significant oversimplification and misreading.
      *   **Why it's wrong:** Maximin (choosing the option that benefits the *worst-off* individual the most) is a decision rule for institutions under uncertainty (Rawls). Scanlon's contractualism is about **justifying principles to others**. While preventing great harm is often justified, it's *not* because we are *only* concerned with the single worst-off. We must consider *all* objections anyone might have. The *reason* the one large burden usually wins isn't *just* that it's worst, but because *that individual's reasonable rejection complaint* is deemed stronger than *any single individual's complaint* in the other scenario. It focuses on the *strength of the individual complaint*, not solely the position on a welfare scale.
  2.  **"Complaining Loudly Enough = Veto":** The claim that "anyone who complains loudly enough can effectively veto a principle" is a caricature.
      *   **Why it's wrong:** "Reasonable rejection" **is not about who complains loudest or most vociferously.** It's an objective (though debated) standard about what burdens *should* be considered unreasonable for someone to bear. A principle can be reasonably rejected based on the *nature of the burden imposed*, even if the person bearing it is silent. Conversely, an unreasonable complaint (e.g., rejecting a principle because it prevents me from stabbing people) isn't valid no matter how loud it is. Reasonableness is the filter.
  3.  **"Burdens Nobody Complains About Create No Complaint":** This is misleading.
      *   **Why it's wrong:** The contractualist test is **hypothetical**: "Could this principle be reasonably rejected *by someone* to whom it applies?" It doesn't depend on anyone *actually* voicing a complaint. If a principle imposes a *reasonable-to-reject* burden on someone, that counts against the principle, even if the person is unaware or silent.

  **Does "That's what sinks the theory" follow?**
  *   **No.** The conclusion ("no sane moral view...") is built on the caricature, not the actual theory.
      *   The caricature implies a veto for *any* complaint (reasonable or not) based on volume, and ignores burdens people *don't* complain about. The *actual* theory uses "reasonable rejection" to filter out trivial or unreasonable complaints. A principle causing a million stubbed toes *would* likely be reasonably rejectable *by each individual sufferer*, and contractualism *can* recognize this collective weight under certain conditions (see below). The post's absurd conclusion relies on its own distortion.

  **Your Specific Questions:**

  1.  **The "Tie-Breaker" Move: Is it Scanlon's? Does it help?**
      *   **Yes, it's Scanlon's move (or close to it).** Scanlon *does* allow that numbers can matter, but in a very specific and limited way. He discusses this in *What We Owe to Each Other* (Ch. 5, esp. Sec. 8-9).
      *   **How it works:**
          *   Focus on **Generic Reasons:** Consider the generic reasons *anyone* in a particular position would have.
          *   **When Burdens are Identical:** If a principle imposes the *same type* and *magnitude* of burden on many people (e.g., *each* suffers a stubbed toe), then the *collective complaint* of *all those identically burdened individuals* gains weight. The principle becomes harder to justify because *so many* people have an identical, reasonably rejectable complaint. It's not adding tiny harms; it's recognizing that many people have the *same* valid complaint.
          *   **Not Strict Tie-Breaking:** It's not *only* for ties. If the many small burdens are sufficiently significant *as individual burdens* (not trivial), and identical, their collective weight *can* potentially outweigh a single large burden, especially if the large burden isn't catastrophic. Scanlon is cautious, but he explicitly rejects the idea that numbers *never* matter under any circumstances.
      *   **Does it help with the elevator case?**
          *   **Possibly, but likely not decisively in this setup.** The key is the *significance* of the textbook burden *per individual*.
              *   **If the textbook burden is TRULY trivial per kid:** (e.g., slightly less engaging reading, a minor inconvenience) - Then each kid's *individual* complaint is *very weak*. Even collectively, contractualism likely says the girl's *overwhelmingly strong* complaint (humiliation, exclusion, lost education) reasonably rejects a principle forcing her to bear that burden so that 1800 kids avoid a tiny inconvenience.
              *   **If the textbook burden is MORE SIGNIFICANT per kid:** (e.g., outdated books causing significant, demonstrable learning gaps, hindering college prospects) - Then each kid has a *stronger individual complaint*. The *collective complaint* of 1800 kids facing substantial educational harm *could* potentially be judged strong enough to outweigh the single girl's complaint (though hers is still extremely strong). This becomes a much harder case under contractualism, requiring careful comparison of the *generic reasons* for rejection from each position.
          *   **The Elevator Doesn't "Always Win":** While the elevator case is designed to favor the one large burden, contractualism *doesn't* say it wins "no matter how tiny" the textbook benefit. If the "benefit" is actually preventing a *significant harm* per kid, numbers *can* matter through the mechanism of identical generic complaints.

  2.  **The "Weird Variant": One Kid Getting 1,800 Small Benefits**
      *   **Contractualism's Answer Likely CHANGES Here.** This variant highlights the theory's core anti-aggregation commitment.
      *   **Why it Changes:** Now, instead of 1800 kids each with one small complaint about textbooks, you have **one kid** facing **1,800 separate small burdens** *if they don't get the textbooks*. Contractualism requires looking at *this individual's* total complaint. They have a complaint about *each* small burden. While *each individual burden* might be small and hard to reasonably reject alone, **the cumulative burden on this single individual of missing all 1,800 benefits could be very large** (e.g., massive educational disadvantage). *This individual's single, cumulative complaint* could now be strong enough to reasonably reject a principle forcing *them* to bear this large cumulative burden just to provide the elevator for the other child.
      *   **Why Distribution Matters (and Why it Might Seem Odd):** Contractualism cares deeply about *how burdens are distributed across individuals*. Concentrating a large cumulative burden on *one person* (the textbook-less kid in the variant) is seen as much harder to justify than distributing many tiny burdens across many people (the original textbook case). This focus on the individual standpoint explains the difference. The seeming oddness arises because utilitarianism *wouldn't* care about the distribution, only the total net benefit. Contractualism's core insight is that morality *is* about distribution – about justifying our actions *to each individual* affected.

  **In Summary for Your Ethics Bowl Case:**

  *   **Blog Post Core Insight (Anti-Aggregation) is Correct:** Contractualism *will* be very sympathetic to the girl's plight. Her individual complaint is extremely strong (dignity, access, education). Numbers of small textbook benefits alone won't automatically outweigh it.
  *   **Blog Post Caricature Elements:** The "maximin collapse," "loud veto," and "ignoring silent burdens" bits are serious misreadings. The theory is more nuanced.
  *   **Numbers *Can* Matter (Scanlon's Move):** If the textbooks prevent *significant identical burdens* per student, the *collective weight* of 1800 similar complaints *could* potentially outweigh the single strong complaint, making the choice much harder. If the textbook benefit per kid is truly trivial, the elevator wins.
  *   **Your Variant Proves the Point:** Changing the distribution so one kid bears all the textbook burdens radically shifts the contractualist analysis, favoring *that* kid, precisely because the theory focuses on the total burden *per individual*.

  **Key Takeaway for Application:** To argue the textbook side effectively under contractualism, you *must* argue that the *per-student burden* of not having them is **significant enough** that each student has a **reasonably rejectable complaint**, and that the **collective force** of these *identical* complaints outweighs the girl's very strong (but singular) complaint. Argue the textbooks aren't a small "benefit" but prevent a real, meaningful "burden" (educational harm) for each student. The elevator side argues the per-student burden is trivial compared to the girl's severe burden, making her complaint decisive regardless of numbers.
