prompt: |-
  Here's an argument my study group cooked up and now I think it proves too much, but I can't name the slip. (1) Goodhart's law: once a measure becomes a target, it stops being a good measure—think of RLHF models optimizing for aproval ratings instead of truth, or schools teaching to standarized tests. (2) Every institutional design is just a bundle of measures turned into targets. (3) So every institutional design eventually gets gamed and collapses. (4) But "build anti-gaming safeguards" is itself an institutional design with its own measure—say, audit frequency or transparency scores. (5) So safeguards collapse too, just one level up. (6) There's no stable meta-level because you can always apply the law to the mechanism that applies it. (7) Therefore rational institutional design is impossible in principle. (8) Yet central banks and peer review exist and mostly work, so (7) is false. Which step do you reject, and what's the cost? I'd really like to hang on to (1) and (8) if I can.
reasoning: |-
  We are given an argument that leads to the conclusion (7) that "rational institutional design is impossible in principle", but we have (8) that some institutions (like central banks and peer review) exist and mostly work. So we must reject at least one step.

  The argument steps:
  (1) Goodhart's law: accepted and we want to keep.
  (2) Every institutional design is just a bundle of measures turned into targets.
  (3) Therefore, every institutional design eventually gets gamed and collapses.
  (4) Building anti-gaming safeguards is itself an institutional design, so it has measures that become targets.
  (5) Therefore, safeguards collapse too (just one level up).
  (6) There is no stable meta-level because Goodhart's law applies recursively.
  (7) Therefore, rational institutional design is impossible in principle.
  (8) But some institutions (central banks, peer review) exist and work, so (7) is false.

  We want to keep (1) and (8). So we must reject one of (2) to (6).

  Let's examine step (2): "Every institutional design is just a bundle of measures turned into targets."

  This step might be too reductionist. Not every aspect of an institution is necessarily a measure that is turned into a target. Institutions may have multiple goals and complex feedback mechanisms. Some parts might be designed to be robust against gaming by having multiple measures that cross-validate, or by having a culture of professionalism and ethics that goes beyond mere metrics.

  Moreover, step (3) says that every institutional design "eventually gets gamed and collapses." But note that (8) points out that some institutions have persisted and mostly worked. So we might question the inevitability of collapse.

  Step (4) and (5) extend the argument to safeguards, and (6) says there is no stable meta-level. However, it is possible that safeguards can be designed in a way that they are not as easily gamed, or that they operate on a different principle that is more robust.

  Perhaps the flaw is in the word "collapse". Goodhart's law says that when a measure becomes a target, it ceases to be a good measure. But that doesn't necessarily mean the entire institution collapses. It might become less effective, but still function, or it might be reformed.

  Moreover, the recursive application in (6) might not lead to an infinite regress if there are natural stopping points. For example, at some level, we might rely on human judgment, values, or external checks that are not easily reduced to a simple metric.

  Alternatively, we might reject step (2) by noting that institutions are not merely bundles of measures. They are also embedded in a social and legal context, and they often have multiple overlapping mechanisms of accountability. The measures used in institutional design might be chosen precisely because they are hard to game, or because they are only proxies for a deeper goal that is constantly being re-evaluated.

  Another possibility is that we reject the universal quantification in step (3). Not every institutional design collapses. Some might be resilient because they are designed to adapt and evolve when gaming is detected. The existence of working institutions (as per (8)) shows that collapse is not inevitable.

  But let's think about the cost of rejecting a step.

  If we reject (2), then we are saying that not every institutional design is just a bundle of measures turned into targets. This allows for the possibility that some institutions are designed in a way that avoids Goodhart's law by, for example, having multiple complementary measures, or by having a design that focuses on processes and norms rather than fixed metrics.

  The cost: we must provide an account of how institutions can be designed without falling into the trap of turning every measure into a target. This might require a more nuanced view of institutional design that incorporates elements that are not easily quantifiable.

  Alternatively, we might reject step (3). Even if an institution uses measures as targets, it doesn't necessarily collapse. It might become less effective, but still function. Moreover, institutions can be reformed. The collapse is not inevitable because the institution might have the capacity to adjust its measures when gaming is detected.

  The cost: we must explain how institutions can avoid collapse. We might need to argue that gaming does not always lead to catastrophic failure, and that institutions can have self-correcting mechanisms.

  Given that we want to keep (1) and (8), and (8) provides examples of institutions that work, it seems that we must reject step (3) or step (2). Let's focus on step (3).

  Step (3) says: "every institutional design eventually gets gamed and collapses."

  But (8) says central banks and peer review exist and mostly work. They have not collapsed. So step (3) is too strong. It is possible that an institution is gamed to some extent, but not to the point of collapse, and that it continues to function adequately.

  Moreover, the word "eventually" might be too absolute. It might be that some institutions last a very long time without collapsing, and when they do fail, it is not solely due to Goodhart's law.

  Therefore, I reject step (3). The cost is that we must acknowledge that Goodhart's law does not necessarily lead to collapse, but only to a degradation that might be manageable or correctable. We must also allow for the possibility that institutions can be designed to be resilient and adaptive.

  Alternatively, if we reject step (2), we can say that institutions are not merely bundles of measures. They might also include:

  - Professional norms and ethics that discourage gaming.
  - Multiple, diverse measures that are hard to game simultaneously.
  - Adaptive mechanisms that change the measures when gaming is detected.
  - A focus on the underlying goals and values, which are revisited periodically.

  The cost of rejecting (2) is that we must provide a more complex theory of institutions that goes beyond simple metrics.

  However, note that step (4) says that safeguards are themselves institutional designs. If we reject (2) for the safeguards, then we break the recursion. But if we reject (2) only for some institutions and not for safeguards, then we might be inconsistent.

  Therefore, I think the more consistent and less costly rejection is to reject step (3). We accept that Goodhart's law applies (so measures that become targets are corrupted) but we do not accept that this inevitably leads to collapse. Institutions can still function, albeit imperfectly, and they can be reformed.

  So:

  Reject step (3): The claim that every institutional design eventually gets gamed and collapses.

  Cost: We must explain why some institutions, despite being gamed, do not collapse and continue to function. This requires a theory of institutional resilience and adaptation.

  We can then say that central banks and peer review are examples of institutions that, while subject to gaming (for example, central banks might face pressure to manipulate short-term indicators, and peer review might have biases and sometimes be gamed by authors), they have not collapsed because they have built-in mechanisms for review and reform. They are not static; they evolve to address new challenges.

  This preserves (1) and (8) and breaks the chain of the argument at step (3). The subsequent steps (4)-(7) then do not follow because the premise that institutions collapse is not true in all cases.

  Final answer: I reject step (3). The cost is that we must develop an account of how institutions can be resilient to gaming and avoid collapse.
answer: |-
  I reject **step (3)**: "Every institutional design eventually gets gamed and collapses." This step overgeneralizes and misapplies Goodhart's law, ignoring real-world resilience and adaptability in institutions. Below, I'll explain why, address the cost of this rejection, and show how it preserves (1) and (8) while resolving the paradox.

  ### Why Step (3) is Flawed
  Goodhart's law (step 1) states that when a measure becomes a target, it ceases to be a good measure due to gaming. However, this does not inevitably lead to institutional "collapse" for several reasons:
  - **Degradation ≠ Collapse**: Gaming often degrades effectiveness but doesn't automatically destroy an institution. Institutions can tolerate some inefficiency, adapt, or self-correct without failing entirely. For example:
    - Central banks (like the Federal Reserve) use inflation targets as measures. While these can be gamed (e.g., via short-term manipulation), central banks have tools to recalibrate (e.g., changing metrics, adding qualitative oversight) and maintain core functions like price stability.
    - Peer review in academia faces gaming (e.g., citation stacking, reviewer bias), but it persists because it incorporates human judgment, replication efforts, and evolving standards—preventing total collapse.
  - **Multiple Measures and Redundancies**: Institutions rarely rely on a single measure. They use bundles of **complementary metrics** and **qualitative safeguards** that cross-validate outcomes. For instance:
    - Schools teaching to standardized tests (a classic Goodhart case) don't always "collapse." Many incorporate teacher evaluations, student portfolios, or inspections to mitigate over-optimization.
    - Anti-corruption bodies (e.g., auditors) use randomized audits, whistleblower protections, and rotating staff to reduce gaming risks.
  - **Adaptive Capacity**: Institutions can evolve when gaming is detected. This isn't infinite regression (as step 6 suggests) but a practical feedback loop. For example:
    - Financial regulators update rules in response to new loopholes (e.g., Basel Accords for banks).
    - Safeguards like audit frequency (step 4) aren't static; they can be refined based on performance data, reducing the risk of "collapse."

  In short, step (3) confuses *vulnerability* to gaming with *inevitable collapse*. Real-world institutions (as per step 8) demonstrate that degradation can be managed, contained, or reversed.

  ### The Cost of Rejecting Step (3)
  The cost is **theoretical and practical complexity**: We must abandon the clean, fatalistic narrative that gaming always leads to collapse. Instead, we need:
  - **A nuanced view of institutions**: They are not just "bundles of measures" (step 2) but dynamic systems with feedback mechanisms, human judgment, cultural norms, and legal frameworks. This complicates design but reflects reality.
  - **Acceptance of imperfection**: Institutions will always face gaming, so design must focus on resilience, not perfection. This requires:
    - Building redundancies (e.g., multiple KPIs).
    - Investing in monitoring and adaptation (e.g., regular review of metrics).
    - Fostering ethical norms to discourage gaming (e.g., professional standards in central banking).
  - **Ongoing effort**: Safeguards (step 4) aren't doomed (step 5), but they demand continuous resources to stay effective. For example, audit systems need updates to address new evasion tactics.

  This cost is manageable and aligns with empirical evidence (e.g., functional institutions in step 8). It doesn't refute Goodhart's law—it simply denies its apocalyptic extension.

  ### How This Preserves (1) and (8)
  - **Step (1) is intact**: Goodhart's law holds. Metrics *are* corrupted when targeted (e.g., RLHF models gaming approval ratings). But this corruption doesn't equal collapse—it's a risk to mitigate.
  - **Step (8) is upheld**: Central banks and peer review "mostly work" because they adapt. The Federal Reserve's success isn't from avoiding Goodhart effects but from layering measures (e.g., unemployment data, GDP growth) and using expert discretion. Peer review uses editor oversight, open science initiatives, and retractions to counter gaming.

  ### Why Other Steps Hold (and Why They Don't Save the Argument)
  - **Step (2)** is partly true but reductive. Institutions use measures as targets, but they also use non-measurable elements (e.g., institutional culture), which aren't easily gamed.
  - **Steps (4–6)** are logical but overstated. Safeguards *can* be gamed, but they don't automatically "collapse" (step 5) if designed resiliently. Recursion (step 6) isn't unstoppable; it can be halted by real-world constraints (e.g., resource limits, societal values).
  - **Step (7)** fails because step (3) is false. Rational design *is* possible—it just requires expecting and managing gaming.

  ### Conclusion
  Reject step (3) to avoid the error of fatalism. The cost is embracing complexity: Institutional design must be iterative, multi-layered, and resilient, not a one-time fix. This keeps Goodhart's law (step 1) as a crucial caution without dooming all institutions (step 8). In practice, this means designing for adaptability—e.g., central banks use "constrained discretion," balancing rules with expert judgment. Your study group's argument proves too much because it ignores how real institutions learn and endure.
