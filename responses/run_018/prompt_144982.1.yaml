  2. Disagreement table — two columns (Integrationist view / Genealogical view), neutral wording each side accepts, ~200 words total. include the core dispute about repairability of sourcehood and whether friction is constitutive or instrumental.
  3. Cruxes and predictive tests — 3 cruxes, each with a concrete case or hypothetical study we'd both accept as relevant, and then each side's prediction about the outcome. ~150 words.

  make it sound like a real working document, not too polished, but clear. and please don't invent quotes from real philosophers — just paraphrase concepts in your own words.
