  The team's composition is crucial. Without big data, experiments must be lean—behavioral studies, expert analysis, controlled generation. The philosopher can handle conceptual frameworks, the cognitive scientist designs experiments, and the type designer provides practical insights and creates stimuli.

  Prioritization should focus on which problem unlocks others. The essence-style split (#4) seems foundational. If essence is style-dependent, it impacts how we approach necessary features (#1) and category fuzziness (#3). Cross-modal (#2) might rely on understanding what invariants exist, which ties into essence. Synthetic bleed (#3) requires generative models, which need big data, so it's less feasible without web access. Dropping #3 makes sense.

  Ranking:
  1. **#4 Essence-Style Split**: Upstream because it addresses the core definition of letter identity. Tractability: behavioral tests with style variations, type designer expertise. Result: if essence varies with style, it influences other problems.
  2. **#2 Cross-modal Recognition**: Tests recognition across modalities, revealing if invariants exist. Tractability: create diverse physical stimuli. Result: finding invariants could simplify #1 and #4.
  3. **#1 Ghost Stroke Problem**: Investigates feature necessity, building on #4's insights. Tractability: systematic stroke manipulation. Result: necessary features would support essence-style split.

