  First, I need to understand the user's deeper needs. They seem to be a researcher or academic proposing a project, likely needing to justify their agenda to funders. They value conceptual clarity over technical surveys, emphasizing philosophical and cognitive insights without big data. Their mention of "defended ordering" suggests they need strong, logical reasoning for prioritization, possibly to counter skepticism from interdisciplinary reviewers.

