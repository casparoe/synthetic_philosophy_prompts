  ### Prose Reasoning
  Okay, let's break this down. Your core move—reframing phenomenal reports as normative commitments instead of descriptive ones—is sharp. It sidesteps the zombie/descriptive deadlock by treating "this hurts" like "this is unfair," where the *practice* of justification (not causal reference) does the heavy lifting. But you're right: the hidden risk is that the causal exclusion problem might just jump to normative facts ("If normative facts are inert too, how do we explain our normative *judgments*?"). That *absolutely* shapes the priorities.

  Here’s how I’d order the key questions for a 2–3 year solo project, balancing dependency, tractability, and risk. The goal is to build a defensible ladder—start with what you *must* resolve before anything else makes sense, then move to implications. Tractability is high for solo work since it’s all theory-crafting (no lab needed), but some questions require wrestling with sticky metaphysics or language-action bridges. I’m ordering them so failure at an early stage doesn’t waste time on downstream stuff, and success upstream makes downstream work smoother.

  1. **First, nail the metaphysics-normativity bridge.** You need to show that normative commitments *can* exist without their content being causal. If normativity itself faces exclusion problems (e.g., "How can normative facts guide action if they’re inert?"), your framing collapses before it starts. This is ultra-upstream—without it, the whole project floats in mid-air. It’s tractable solo: dive into quasi-realism (Blackburn), normative expressivism, or constitutivist action theory (Korsgaard). If you crack this, everything downstream gets easier; if not, pivot early.

  2. **Next, explain how normative phenomenal judgments arise from non-phenomenal causes.** Even if normativity escapes exclusion, you still need to show how *these specific judgments* (about pain, color, etc.) emerge from physical/non-phenomenal processes. This is upstream because it tackles the paradox head-on: if consciousness is inert, how do we *have* these normative practices about it? Tractability is moderate—it needs action-theory tools (e.g., Brandom on deontic scores) to map judgment-formation. A solid answer here makes the later language work trivial; failure means the paradox survives.

  3. **Then, ground the authority of phenomenal reports in normative practice.** Assuming judgments *can* arise, why do they feel uniquely immediate/authoritative (unlike "this is unfair")? This is midstream: it depends on the first two but is key to making your account plausible. Solo-friendly—use pragmatist semantics (Lance & White) to show how phenomenal-normative claims function in discourse. If you succeed, it strengthens the whole frame; if not, you might limit the account’s scope but the core survives.

  4. **Extend to diverse phenomenal types (pain, vision, mood).** Test if your normative frame handles varied cases (e.g., "I see red" vs. "I’m anxious"). Downstream—it relies on the prior framework but spotlights scalability. Tractability is high: compare existing normative domains (aesthetics, ethics) to adapt your model. If it fails for certain types, you tweak the scope; success here is bonus robustness.

  5. **Finally, reconcile with empirical edge cases (blindsight, illusions).** Address cases where reports and phenomenology come apart (e.g., blindsight patients "guessing" correctly). Most downstream—it’s a stress test using real-world data. Solo-tractable via literature review (no lab). Failure here is low-risk; it might dent universality but won’t sink the ship.

  The hidden issue (normative exclusion) dominates #1 and #2. If normative facts *do* face exclusion, #1 fails and the project implodes. If #2 fails, the paradox just relocates. That’s why they’re prioritized—fail early, not after years of work. If you get a breakthrough in #1 (e.g., showing normativity is practice-relative, not fact-causal), #2 simplifies. If empirical work reveals normative reports are *descriptive* after all (unlikely), it could reshuffle everything.

  ### Structured Summary
  Here’s the table with your requested columns. I’ve ordered by dependency (upstream → downstream), with tractability and risks weighed for solo work:

  | Question | Why it's upstream/downstream | Tractability for solo work (2-3 yrs) | What result would change the ranking | Biggest risk if it's a dead end |
  |----------|------------------------------|--------------------------------------|--------------------------------------|----------------------------------|
  | 1. Can normative commitments avoid causal exclusion? (i.e., if normative facts are inert, how do we explain normative judgments/practices?) | Most upstream: If normativity itself faces exclusion, your reframing fails immediately. It sets the metaphysical groundwork. | High: Pure theory. Requires engaging metaethics (e.g., quasi-realism) and action theory. No empirical barrier. | If solved (e.g., by showing normativity is practice-constituted), #2 becomes easier. If intractable, the project stalls or dies. | Total dead end—normative exclusion kills the core move. Pivot or abandon. |
  | 2. How can normative phenomenal judgments arise from non-phenomenal causes? (i.e., bridge physical processes to normative reports) | Upstream: Directly addresses your paradox. Depends on #1 but essential to show judgments don’t require causal efficacy. | Moderate: Needs philosophy of action (e.g., how commitments emerge from causal chains). Messy but solo-feasible. | If resolved (e.g., via "normative practice" as a physical disposition), #3–#5 simplify. If not, paradox persists. | High—fails to dissolve the original problem; epiphenomenalism still threatens. |
  | 3. How does the normative account explain the unique authority/immediacy of phenomenal judgments? (e.g., why "this hurts" feels non-inferential) | Midstream: Depends on #1–#2. Explains the "what it’s like" in normative terms, making the account intuitive. | High: Philosophy of language focus (e.g., expressivist semantics). Solo-friendly conceptual work. | If successful, boosts plausibility; if not, may require retreating to limited cases (e.g., only pain reports). | Medium—weakens the account but doesn’t collapse it (e.g., authority might be explained elsewhere). |
  | 4. Can the normative framework generalize across all phenomenal types? (e.g., pain, color, emotion) | Downstream: Tests scope after core framework is stable. Leans on #1–#3. | High: Comparative analysis (e.g., map pain to moral disgust, color to aesthetic norms). Solo-tractable. | If it generalizes, strengthens theory; if not, may reorder #4 above #3 if early gaps appear. | Low—could restrict scope (e.g., "only affective states") without killing project. |
  | 5. How does the account handle empirical edge cases? (e.g., blindsight, illusions, subliminal perception) | Most downstream: Stress-tests against real-world gaps between report and phenomenology. | Moderate: Requires interpreting existing empirical literature. No new data needed. | If empirical data forces a rethink (e.g., reports are descriptive), could elevate #5 or reshuffle priorities. | Low—anomalies might require refinements but won’t invalidate the core. |

  ### Quick Takeaways
  - **Start with #1 and #2**: They’re the linchpins. If the hidden issue (normative exclusion) sinks #1, you’ve only lost months, not years. A win here makes #2–#5 fall into place.
  - **Tractability**: All are solo-friendly; hardest is #2 (metaphysics-action bridge), but it’s doable in 2–3 years with focus.
  - **Exit ramps**: If #1 fails, pivot to rethinking normative metaphysics. If #2 fails, consider hybrid models (e.g., partial efficacy). 
  - **Success metrics**: A paper on #1 in Year 1, #2 by Year 2. If #1–#2 hold, the rest is mopping up.

  This ordering protects you from sunk-cost traps. If the hidden issue blows up early, you save years. If not, you’ve got a clear path to a robust account. Good luck—this is a spicy take on epiphenomenalism!
