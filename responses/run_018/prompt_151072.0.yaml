  I've been lurking on rationalist forums long enough to know the teletransporter gets brought up every other thread, but I still want a joke that isn't just "haha you died and this is a copy." Can you write one that actually turns on Parfit's specific move in Reasons and Persons—that personal identity isn't what matters, psychological continuty with the right kind of cause is? I want teh setup to use the fission glitch: I step into the scanner, there's a malfunction, and now two copies come out, both with my memories and personality. But instead of an existential crisis, they're fighting over something stupidly mundane—like who gets to keep my Netflix profile or who's legally on the hook for my student loans. The punchline should hinge on the philosophical point that there's no further fact about which one is "really" me beyond the continuity relation, so the dispute is as coherent as two split amoebas suing each other for being teh original.

  Make it actually funny to someone who knows teh theory, not a generic sci-fi clone gag. Then, after the joke, include a quick note on where you're taking liberties with Parfit's actual view—like whether you treat psychological continuity as binary when he allows degrees, or if you ignore bodily-continuity objections from people like Olson or Wiggins. Also say what kind of argument or clarification would make you drop this framing and tell a different joke—say, if someone showed that teh fission case actually destroys teh coherence of continuity-based survival rather than illustrating it.
