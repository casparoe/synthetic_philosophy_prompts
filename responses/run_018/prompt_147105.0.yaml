  ## Cone Response Variations

  Her chamber walls are painted **black** and **white**,
  no pigment stains the perfect void's design.
  She graphs each incident of **wavelength**
  in nanometers, knows how the retinal **cone**
  fires signals through the intricate **opponent-process**
  to patterns mapped precisely on the **cortex**.

  She comprehends the pathways in the **cortex**,
  the neural dance that renders grey from **white**,
  the push-pull logic of **opponent-process**
  that codes for contrast, sharpening each line.
  She measures how the stimulated **cone**
  responds to every quantifiable **wavelength**.

  No unseen band of spectral **wavelength**
  escapes her grasp, deep in the **cortex**.
  She catalogues each variant **cone**
  sensitivity to shades of **white**
  or dark. Her textbooks leave no gap defined
  by flaws in **opponent-process**.

  She masters every step of **opponent-process**,
  predicts the signal from the **wavelength**,
  can simulate the activation signed
  across the visual **cortex**.
  She knows the math that turns pure **white**
  to neuronal storm within the **cone**.

  She's never seen the fire in a **cone**
  of flesh ignite, just traced **opponent-process**
  through diagrams on pages starkly **white**.
  She parsed the physics of the **wavelength**,
  the bio-electrics of the **cortex**,
  all facts laid bare, all data underlined.

  Then stepped outside the room defined
  by absence. Saw a rose. The stunned **cone**
  sent signals racing to her **cortex**,
  the ancient, known **opponent-process**
  spun out from stimulus and **wavelength**,
  but shattered worlds behind her eyes, once **white**...

  Now *cortex*, **opponent-process**, **cone**,
  **wavelength**, **white**, and **black**: her lexicon.
  But **redness** blooms—a raw surprise, unplanned.
