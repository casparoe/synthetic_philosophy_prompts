  For the prep sheet structure, I'll prioritize objections by their potential to derail the discussion: First, the consequentialist challenge about practical decision-making, since it could make the thesis seem irrelevant to real choices. Second, the Kantian worry about diluting moral agency - if they convince the room the extension trivializes personhood, the whole argument crumbles. The psychologist's empirical objection comes third because while dangerous if raised, it's less likely to be fatal given their lack of relevant background.

