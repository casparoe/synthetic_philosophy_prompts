prompt: |-
  hey so me and my friend Jonas (he's a phil phd too) have been going back and forth with Maya from my cohort — she's in moral psych — about Frankfurt cases and PAP, but we kept getting stuck on this twist we made up and I honestly can't tell who's right. here's how it went.

  Maya started by saying the standard Frankfurt setup (Black, Jones, the election decision) does kill PAP for moral responsibility, but not for the reason everyone thinks. she thinks what's actually doing the work is that the case severs the link between an agent's deliberative accesibility — whether an alternative is live inside their practical reasoning — and the actual causal pathway. in the classic version, Jones can still see "not deciding now" as a live option right up until he decides, even though Black makes it impossible for him to actually do it. so the case doesn't show there's no alternative in some metaphysical sense; it shows that having an alternative inside your reasoning horizon isn't necessary for blame.

  Jonas said thats just relabeling the mistake. he argued that if deliberative accesibility is the key, then Frankfurt hasn't actually shown PAP false in its original form — PAP is about objective alternatives, not about what you can see yourself doing. he then proposed a nested version: Black doesn't just watch Jones's brain for a sign of deciding otherwise; Black monitors Jones's own recognition of a specific branch point in his reasoning — the moment Jones himself frames "I could stop now" as a live option. if Jones reaches that framing, Black intervenes and makes it causally impossible for Jones to stop, but crucially Jonas thinks that in this version Jones doesnt have deliberative accesibility to stopping, because the monitoring mechanism collapses the practical horizon exactly at the point where he would have accessed it. so Jonas claims this nested case saves PAP: responsibility requires that the alternative be both objectively available and within the agent's deliberative field, and Frankfurt-style manipulation can target the second condition without touching the first.

  Maya replied that Jonas is smuggling in an epistimic condition that Frankfurt never intended. she said Frankfurt's whole point was that responsibility tracks the actual causal structure of the action — whether it flows from the agent's own will — not whether the agent had some special access to counterfactual paths. if Jonas wants to defend PAP by adding a deliberative-accessibility clause, he's not defending PAP, he's defending a totally different principel that Frankfurt never addressed. she also said Jonas's nested case is incoherent: if Black collapses the horizon exactly when Jones recognizes the branch point, then Jones never actually completes the recognition, so there's no clear moment where he lacks accesibility — it's just a standard Frankfurt case with extra neuroscience window dressing.

  Jonas came back with: but if Maya admits that in the classic case Jones still has deliberative access even though he can't do otherwise, then she's conceding that the absence of objective alternatives doesn't matter as long as the agent thinks they exist. that makes moral responsability depend on the agent's epistemic state, not on real possibilities. he thinks that's a worse result than just keeping PAP in its original form.

  they asked me to referee but honestly I can't tell who's right about what. please adjudicate point by point: is Maya right that Frankfurt's case works via severing deliberative access rather than killing objective alternatives? is Jonas's nested case actually different, or is it just window dressing? and does either of them miss something obvious about sourcehood or about collective responsability? also tell me who's more right overall and whether there's a better framing they're both ignoring.
reasoning: |-
  Okay, the user is deep into a philosophical debate about Frankfurt cases and the Principle of Alternate Possibilities (PAP). They're stuck adjudicating a disagreement between Maya (moral psych) and Jonas (Phil PhD) about whether Frankfurt's thought experiment undermines PAP by severing deliberative accessibility or objective alternatives. 

  First, let's unpack the core tension: Maya thinks Frankfurt cases work because the agent retains deliberative access to alternatives that are causally impossible, showing that responsibility depends on actual causal history, not accessible options. Jonas counters that if we modify the case to collapse deliberative access precisely when the agent considers an alternative, PAP could be preserved by requiring both objective and subjective access to alternatives. 

  Hmm... Maya's position aligns with mainstream Frankfurt interpretation - the literature consistently frames the cases as decoupling responsibility from objective alternatives. Her insight about "deliberative accessibility vs. causal pathways" is sharp but not entirely original; it echoes Fischer's guidance control. Where she shines is recognizing that Jones' epistemic state (seeing alternatives as live) persists despite causal constraints.

  Jonas' nested case is clever but problematic. Monitoring the moment of recognition introduces a regress: if Black intervenes at the exact nanosecond Jones formulates "I could stop," does Jones even fully conceptualize it? This risks collapsing into a standard Frankfurt case or creating a paradox. His conflation of PAP (objective alternatives) with deliberative requirements feels like moving goalposts - Frankfurt explicitly targeted the objective reading.

  Both miss nuances though. Maya underestimates how Jonas' case exposes that *some* epistemic conditions might matter indirectly (e.g., for tracing responsibility). Jonas fails to see that PAP defenders don't typically include deliberative access as part of PAP itself. Also, neither addresses how source compatibilists like McKenna might handle this - focusing solely on the action's genesis rather than alternatives.

  The user seems overwhelmed by technicalities but genuinely wants to resolve the deadlock. Their "who's more right" request suggests they need a decisive verdict, not just analysis. Maya's position is philosophically stronger, but Jonas' challenge reveals interesting edges in the debate. A better framing might be Fischer's distinction between regulative control (PAP) and guidance control (sourcehood) - this dissolves the stalemate by showing they're attacking different targets.
answer: |-
  Here's a point-by-point adjudication of your philosophical stalemate:

  ### 1. **Is Maya right about Frankfurt's mechanism?**
     **Verdict: Partially Correct, but Oversimplified.**
     - **Yes**, Maya correctly identifies that in the *classic* Frankfurt case, Jones retains *deliberative accessibility* to "not deciding" even though it's causally impossible. This is a crucial observation.
     - **However**, Frankfurt's *primary* target is PAP's requirement of objective alternatives (*metaphysical* possibility to do otherwise). The case *does* sever responsibility from objective alternatives by design. Maya is right that the *persistence* of deliberative accessibility highlights why PAP fails: responsibility hinges on the *actual source* of the action (Jones' own decision-making), not the existence of alternatives.
     - **Where she's incomplete:** Frankfurt doesn't *merely* sever deliberative access from causal pathways; he severs responsibility from *any* requirement for objective alternatives. Deliberative accessibility is a symptom, not the core mechanism.

  ### 2. **Is Jonas's nested case different?**
     **Verdict: Conceptually Different but Flawed.**
     - **The Difference:** Jonas's case *does* attempt something novel. By having Black intervene precisely *at the moment Jones recognizes "stop" as a live option*, it aims to eliminate *deliberative accessibility itself* while potentially leaving objective alternatives intact (if Black's intervention is conditional).
     - **The Flaws:**
       - **Epistemic Collapse Problem (Maya's Point):** If Black intervenes *the instant* Jones begins to frame "I could stop," does Jones ever *fully* grasp it as a live option? The intervention might prevent the *completion* of the deliberative act, leaving its status ambiguous. Is an *aborted* recognition still "deliberative accessibility"? It’s murky.
       - **Threat vs. Actual Prevention:** If Black intervenes *after* Jones recognizes the option but *prevents* him from acting on it, it’s just a standard Frankfurt case where an alternative is accessible but causally blocked. If Black intervenes *before* recognition completes, it’s unclear if Jones ever had access.
       - **Objective Alternatives?:** Jonas assumes objective alternatives persist, but if Black's mechanism is reliable (as it must be in Frankfurt cases), the objective alternative *is* removed the moment the intervention trigger condition is met. The "objective availability" Jonas wants to preserve is likely illusory within the logic of Frankfurt cases.

  ### 3. **Does Jonas defend PAP or a new principle?**
     **Verdict: Jonas is Defending a *Different* Principle.**
     - PAP, as Frankfurt interprets it, is: **"A person is morally responsible for what he has done only if he could have done otherwise."** (Focus: *Metaphysical* possibility).
     - Jonas’s requirement is: **"Responsibility requires that the alternative be *both* objectively available *and* within the agent’s deliberative field."**
     - **Jonas is not defending PAP; he’s proposing a *hybrid* principle.** Frankfurt *did* target PAP’s core claim about objective alternatives. Adding a deliberative-accessibility condition creates a distinct principle Frankfurt-style cases don't directly refute. Maya is correct here.

  ### 4. **Does Jonas force Maya into epistemic responsibility?**
     **Verdict: No, Jonas Misrepresents Maya.**
     - Maya’s point is that responsibility depends on the *actual causal history* (sourcehood) – whether the action *issues from the agent’s own mechanisms* (e.g., Jones’s actual reasoning and decision). Jones’s *belief* in alternatives is epistemically interesting but *not* what grounds responsibility. His decision is blameworthy because it *actually* flowed from his own (morally flawed) reasoning, regardless of his beliefs about possibilities or Black’s presence. Frankfurt cases show that sourcehood, not access to alternatives (objective or deliberative), is fundamental.

  ### 5. **Missed Nuances: Sourcehood & Collective Responsibility**
     - **Sourcehood:** Both focus on alternatives, but the deeper debate is about **source compatibilism** (Fischer, Ravizza) vs. **leeway incompatibilism**. Frankfurt’s core argument is that sourcehood *alone* suffices for responsibility. Jonas’s hybrid principle reintroduces leeway (access to alternatives) alongside sourcehood. Maya grasps Frankfurt’s sourcehood focus better.
     - **Collective Responsibility:** Neither addresses this directly. Frankfurt cases target *individual* responsibility. Applying this to collective action raises separate issues (e.g., could *group* deliberation have alternatives while individuals don't?), but it's orthogonal to their current dispute.

  ### 6. **Who's More Right?**
     **Verdict: Maya is More Philosophically Robust.**
     - She correctly identifies the core mechanism of Frankfurt cases: decoupling responsibility from *objective* alternatives while emphasizing the *actual causal source* of the action.
     - She rightly points out Jonas is changing the subject by adding a deliberative-accessibility clause to PAP.
     - She effectively critiques the coherence of Jonas’s nested case.
     - Jonas’s case is creative but conflates PAP with a new principle and struggles with the epistemic timing problem.

  ### 7. **A Better Framing: Guidance Control vs. Regulative Control**
     The debate is clearer through **John Martin Fischer’s distinction**:
     - **Regulative Control:** Requires access to alternative possibilities (what PAP demands and Frankfurt attacks).
     - **Guidance Control:** Requires the action to issue from the agent’s own moderately reasons-responsive mechanism (sourcehood). *This is what survives in Frankfurt cases.*
     - **Reframed:** Maya argues Frankfurt shows Guidance Control suffices; Jonas tries to sneak Regulative Control back in via deliberative access. Fischer’s framework shows why Maya captures Frankfurt’s intent: Jones has Guidance Control (his mechanism operates normally), so he’s responsible, even without Regulative Control (no objective alternative).

  ### Final Summary
  | **Point**                      | **Adjudication**                                                                 |
  |--------------------------------|----------------------------------------------------------------------------------|
  | **Maya on Frankfurt's Mechanism** | Correct on sourcehood, overemphasizes deliberative severance. Frankfurt kills objective alternatives. |
  | **Jonas's Nested Case**        | Conceptually distinct but flawed (epistemic ambiguity, likely collapses to standard Frankfurt). |
  | **Jonas Defending PAP?**       | No. He proposes a hybrid principle Frankfurt didn't target.                      |
  | **Jonas's Epistemic Trap**     | Fails. Maya's sourcehood view doesn't make responsibility depend on belief.      |
  | **Missed Nuances**             | Sourcehood is key; collective responsibility is irrelevant here.                |
  | **Who's More Right?**          | **Maya** (upholds Frankfurt's core argument, exposes Jonas's shift).             |
  | **Better Framing**             | **Guidance Control (sourcehood) vs. Regulative Control (alternatives)**.        |

  **Recommendation:** Frame future discussions around **Guidance Control**. This dissolves Jonas's objection: responsibility requires the action to stem from the agent's own responsive mechanism (achieved in standard Frankfurt cases), *not* access to alternatives (objective or deliberative). Jonas's nested case, even if coherent, doesn't threaten this source-compatibilist position. Tell Jonas he needs to argue *against sourcehood itself*, not just rebuild PAP with extra steps.
