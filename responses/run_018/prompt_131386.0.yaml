prompt: |-
  I'm helping my roommate put together the final for her upper-level philosophy of science seminar—she's the one actually teaching it, I'm just the philosophy-of-science convert who switched majors after too many failed physics labs, so this stuff suddenly feels really personal. We just covered the Quine-Duhem thesis and honestly half the class seems to think underdetermination just means scientists can pick whatever theory they like, while the other half keeps repeating that auxiliary hypotheses save the day without knowing where those auxiliaries actually come from. I want an essay question that can't be answered by reciting the textbook, so I'm imagining a hypothetical case: two cosmological frameworks, call them Continuum and Grain, that generate identical predictions for every observable we can currently measure or foresee measuring—CMB anisotropies, gravitational-wave spectra, even black-hole shadow morphology—but they diverge radically on ontology: Continuum treats spacetime as genuinely continuous, while Grain treats it as discrete at the Planck scale with macroscopic continuity emerging from statistical averaging. The prompt should ask students to evaluate whether this counts as a genuine underdetermination problem, whether clever auxiliary hypotheses could ever break the tie, and what the case implies for scientific realism if the metaphysical gap is permanently hidden from observation. I need the exam question itself, a model answer of about 800 words, and a marking scheme with specific must-hit moves—like distinguishing empirical equivalence from epistemic parity, locating exactly where auxiliaries enter the test, and explaining why metaphysical differences that leave no empirical trace might still matter or might not—plus notes on the common mistakes that should cost marks, especially conflating underdetermination with theory-ladenness or thinking empirical equivalence automatically makes both theories equally rational. Time limit 90 minutes, total 25 marks. Also, if you can, make sure the grading rubric seperates an A answer from a B by naming the exact conceptual moves each has to contain, not just general quality. I was discussing this with my friends over coffee and one of them said it sounds like science fiction, but I think it gets at something real about how we choose theories.
