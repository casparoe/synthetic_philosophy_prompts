  Philosophically, their argument is interesting. It shifts the problem from relations to the act of judgment, which is a fresh take. Instead of just repeating the regress, they frame it as about the necessity of a unified cognitive act. This connects to modern debates about the unity of the proposition and non-propositional mental acts. The response to the saturation objection is strong: semantics resolves reference but doesn't address the metaphysical unity required in judgment. If the user emphasizes that even saturated propositions are presented as unified wholes in judgment, that's a solid point.

