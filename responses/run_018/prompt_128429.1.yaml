  Interesting tension here—they need the speech to actively constrain what they can say later. That's smart framing. The Darwin-Turing parallel is perfect for this: Darwin removed the need for a comprehending designer to explain adaptation, while Turing removed the need to comprehend mechanisms to recognize intelligence. 

