  - Open with immediate common ground (shared admiration for Darwin/Turing) 
  - Explicitly name the two fields' complementary blind spots 
  - Frame the inversions as permission slips: Darwin frees us from demanding intent in biology, Turing frees us from demanding transparency in AI 
