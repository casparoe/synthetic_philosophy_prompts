  - Close with concrete workshop behaviors: "When you see X, try Y" 

  Biggest risk is sounding academic despite "casual" request. Solution: Lean into contractions ("we're", "let's"), field-specific jargon only when naming pitfalls, and punchy phrases like "competence without comprehension". Should avoid "anthropomorphism" though—too lecture-y. 

