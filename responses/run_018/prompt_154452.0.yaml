prompt: |-
  Within the intersection of predictive processing and the free energy principle, several competing open lines of inquiry currently divide theoretical attention. One concerns whether active inference constitutes a genuinely distinct decision-theoretic architecture or merely restates expected-utility maximization in information-theoretic terms; another asks whether the free energy principle's variational formalism produces empirically distinguishable predictions from standard hierarchical predictive coding, or functions primarily as a redescription; a third focuses on whether precision-weighting mechanisms in cortical hierarchies can be mapped onto specific neuromodulatory circuits with sufficient granularity to guide experimental design; and a fourth examines whether extending the framework to social, developmental, or artificial systems demands substantive theoretical revision or only parameter rescaling.

  Assume a research unit with constrained resources—approximately three years and one dedicated postdoctoral researcher. Provide a defended agenda for how that effort should be distributed across these lines: which question should be addressed first, which can be pursued in parallel, and which should be actively deprioritized. Your defense should specify the dependency structure among these questions—which answers, if settled, would most alter the evaluation of the remaining ones—along with the criteria governing your ranking (tractability with present methods, magnitude of downstream consequence, and the risk that resolving one line renders another moot). The deliverable is an ordering justified by upstream-downstream relations and trade-offs, not a survey of the literature or a list of recommended readings. Do not include citations, bibliographies, or references to specific unpublished works.
reasoning: |-
  Okay, the user is asking me to create a research agenda for a small team with limited resources—one postdoc over three years—focusing on four key questions in predictive processing and the free energy principle. They want me to prioritize these questions based on dependencies, tractability, and impact, and defend the ordering.

  Let me parse those four competing lines of inquiry first: 
  - Q1: Is active inference truly distinct from expected utility maximization?
  - Q2: Does variational free energy differ empirically from standard predictive coding?
  - Q3: Can we map precision-weighting to specific neuromodulatory circuits?
  - Q4: Does extending to social/developmental/artificial systems require theoretical revision?

  The user emphasizes this isn't about literature review—it's about strategic resource allocation. They want dependencies mapped: which answers would reshape the others? Criteria are tractability, consequence scale, and risk of obsolescence.

  Hmm, the core tension here is between foundational theory and empirical testability. Q1 and Q2 are theoretical—they question the framework's novelty and empirical substance. Q3 is neuroscience-facing, bridging theory to wet-lab work. Q4 is about scalability, which feels downstream. 

  Dependency-wise: If active inference (Q1) is just expected utility in disguise, that could collapse the whole enterprise, making Q2-Q4 moot. Conversely, if Q3 succeeds in mapping precision circuits, it could indirectly validate the formalism by showing mechanistic plausibility. But that's risky—if the theory is flawed, detailed mapping might be wasted effort.

  Tractability favors Q3: Precision-weighting has testable elements (e.g., linking dopamine to prediction errors), whereas Q1 requires formal analysis that could spiral. But Q3's granularity depends on Q1/Q2 being coherent—otherwise we're mapping ghosts.

  Magnitude of consequence: Q1 is a bomb. If active inference isn't novel, the field might pivot entirely. Q4's impact is broad but diffuse—it assumes the framework holds locally first. 

  So ordering must be: 
  1. **Q1 first**—it's the keystone. Settling it directs all other work. 
  2. **Q3 in parallel once Q1 progresses**—it's tractable and can build momentum while theory clarifies. 
  3. **Q2 later**—it depends on Q1's outcome but offers empirical stakes. 
  4. **Q4 deferred**—it's expansionary, premature without settled foundations.

  Resource split: Year 1-2 heavily on Q1, with Q3 starting mid-year 1 once theoretical tools stabilize. Q2 in year 2-3 if Q1 supports distinctness. Q4 only as side exploration.

  The user likely represents a PI or grant writer needing strategic focus. Their unspoken anxiety? Wasting a postdoc's tenure on dead ends. My agenda mitigates that by frontloading the existential risk (Q1) while allowing empirical work (Q3) to proceed cautiously. Deprioritizing Q4 might frustrate some, but scaling without validation is cart-before-horse.
answer: |-
  Here is a prioritized research agenda for the constrained unit, justified by dependency structure, tractability, consequence magnitude, and risk of resolution-induced obsolescence:

  ### Prioritized Ordering & Resource Allocation:
  1. **Primary Focus (Year 1–2): Resolve Q1 (Active Inference vs. Expected Utility)**  
     - **Effort Allocation:** 60% of postdoc time.  
     - **Justification:** This is the *upstream keystone*. If active inference reduces to expected utility maximization (Q1 resolved as "not distinct"), it fundamentally undermines the necessity of the free energy principle (FEP) as a unique framework, potentially rendering Q2–Q4 moot (high obsolescence risk). Conversely, proving distinctness elevates FEP’s theoretical novelty, forcing reevaluation of all other lines. Tractability is moderate: formal comparisons of decision rules and information dynamics can be done computationally/analytically without new experiments. Downstream consequences are maximal—it dictates whether the entire framework warrants dedicated investigation.  

  2. **Parallel Track (Start mid-Year 1, continue through Year 3): Pursue Q3 (Precision-Weighting Neuromodulatory Mapping)**  
     - **Effort Allocation:** 30% of postdoc time.  
     - **Justification:** Operationally independent of Q1/Q2’s theoretical outcomes. Empirical tractability is high: leveraging existing animal/human neuroscience techniques (e.g., pharmaco-fMRI, calcium imaging) to test hypotheses about precision (e.g., dopamine, acetylcholine roles) is feasible within constraints. Success provides concrete biological grounding, boosting FEP’s credibility *regardless* of theoretical disputes (Q1/Q2). Failure would not collapse the framework but would highlight a critical gap. Medium downstream impact: granular circuit mappings enable targeted experiments for Q2 validation.  

  3. **Conditional Follow-Up (Year 2–3, contingent on Q1 outcome): Address Q2 (Variational FEP vs. Standard Predictive Coding)**  
     - **Effort Allocation:** 30% (if Q1 supports distinctness); 0% (if Q1 negates it).  
     - **Justification:** Q2 *depends entirely on Q1*. If active inference is not distinct (Q1 negative), Q2 becomes a redundant comparison. If Q1 is positive, Q2 gains urgency: does the variational formalism offer unique empirical predictions? Tractability is moderate—designing behavioral/neuroimaging paradigms to distinguish variational updates from simpler predictive coding is feasible but requires careful controls. Downstream impact is high for theory development: resolving Q2 determines whether FEP is a mere redescription or a transformative tool.  

  4. **Actively Deprioritize: Defer Q4 (Extension to Social/Developmental/Artificial Systems)**  
     - **Effort Allocation:** 10% (exploratory only; no deep investment).  
     - **Justification:** Q4 is *downstream and contingent* on foundational validation. Without resolved Q1–Q3, extensions risk building on unproven assumptions. Tractability is low: complex system parameterization demands large datasets/cross-disciplinary collaboration beyond resource limits. Magnitude of consequence is high if successful but premature now. If Q1–Q3 validate FEP, Q4 becomes compelling later work; if they fail, Q4 efforts are wasted.  

  ### Dependency Structure & Risk Mitigation:
  - **Q1 → Q2/Q4:** Q1’s outcome controls the value of investing in Q2 and Q4. If Q1 fails, deprioritizing Q2/Q4 avoids sunk costs.  
  - **Q3 → Q2:** Empirical success in Q3 (mapping precision) provides concrete design constraints for testing Q2’s predictions.  
  - **Q1/Q2/Q3 → Q4:** Scaling demands (Q4) require validated local mechanisms (Q3) and theoretical coherence (Q1/Q2).  
  - **Obsolescence Risks:**  
    - Q1 resolution could obsolete Q2/Q4.  
    - Q2 resolution could reduce Q4 to parameter rescaling (if FEP ≡ predictive coding).  

  ### Resource Distribution Rationale:
  - **Years 1–1.5:** Postdoc focuses 60% on Q1 (theory/computational modeling), 30% on Q3 (pilot experiments/lit synthesis).  
  - **Years 1.5–3:** If Q1 supports distinctness, shift to 30% Q2 (experimental design), 30% Q3 (full experiments), 30% Q1 (refinement); else, 70% Q3, 30% exploratory Q4.  
  - **Q4 limited to** scoping reviews or toy simulations to preserve optionality without substantive investment.  

  This sequence maximizes impact per unit effort: Q1 gates existential relevance; Q3 offers empirical progress even during theoretical uncertainty; Q2 is conditional on Q1; Q4 is viable only after core validation.
