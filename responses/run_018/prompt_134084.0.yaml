prompt: |-
  I'm a planning officer for a mid-sized council and we're drowning in applications mixing affordable housing with market-rate units. I want to turn Rawls's veil of ignorance and the difference principle into an actual decision procedue I can run on each proposal — the questions in order, what counts as a sufficient answer, where it stops with a no, and where I have to hand the decision to an elected member because it's values rather than facts. There's a twist: our local framework treats daylight access and walking-distance healthcare as primary goods alongside income, which isn't standard Rawls but it's what I have to work with. It needs to be usable by someone who hasn't touched political philosophy since uni, should flag where it'll misfire, and mustn't ask me for citations or a bibliography. Run it on two cases: a developer wants to replace a derelict canal lock with luxury flats plus 10% "affordable" units, and another wants height exemptions near the hospital for staff housing that'd cast long shadows over existing council estates. Make sure one gives me an answer I'd rather not hear. Write in British English please, and skip any reading list.
reasoning: |-
  Okay, let's tackle this planning officer's request. They need a practical decision procedure based on Rawls' principles, adapted to their council's specific priorities around daylight and healthcare access as primary goods. The key is making this usable without philosophy jargon while addressing real-world cases.

  First, considering the core Rawlsian framework: the veil of ignorance requires evaluating proposals from an unbiased perspective where you don't know your social position, while the difference principle allows inequalities only if they benefit the least advantaged. 

  For the local adaptation, daylight and healthcare access are being treated as primary goods alongside income. This means the procedure must assess how proposals affect these three dimensions for the most vulnerable residents. 

  Structuring the decision tree:
  - Starting with the veil test: does the proposal maintain baseline access to daylight/healthcare/income for existing vulnerable groups?
  - Then the difference principle test: do any reductions in access get offset by greater benefits to the same group?
  - Clear rejection triggers: irreversible loss of daylight/healthcare without compensation, or benefits flowing to better-off groups
  - Values-based handoff points: when trade-offs between primary goods require political judgment

  For the canal lock case (luxury flats replacing derelict site with 10% affordable):
  - Veil test: likely passes as it adds housing without directly harming existing residents' access
  - Difference principle test: the 10% affordable units may not sufficiently benefit the least advantaged compared to market-rate gains
  - Result: rejection recommendation unless affordable % increases

  For the hospital height exemption (staff housing shading council estates):
  - Veil test fails immediately - daylight reduction for existing vulnerable residents
  - Even with healthcare benefits, the daylight loss is irreversible and affects a primary good
  - Result: strong rejection with clear rationale

  Important to flag limitations:
  - The procedure can't quantify qualitative impacts
  - It assumes accurate impact assessments
  - May undervalue non-resident interests
  - Relies on predefined "least advantaged" groups

  The hospital case deliberately gives the "unwanted answer" by rejecting height exemptions due to daylight impact, challenging the officer who might sympathize with staff housing needs. This tests the procedure's objectivity.

  Final checks: using British English, avoiding academic citations, focusing on actionable steps. The structure moves from factual tests to values-based decisions, with clear handoff points for elected members when trade-offs require political judgment.
answer: |-
  Here's a Rawlsian Decision Procedure for Affordable Housing Applications, adapted for your local primary goods (income, daylight access, walking-distance healthcare). Designed for practicality, using plain British English:

  **Core Principle:** *"Would the least advantaged in the area affected be worse off overall on our primary goods (income opportunities, daylight, healthcare access) if this went ahead? And if they might be, is the benefit to them so significant it justifies that loss?"*

  **The Procedure: Ask Sequentially. Stop at any "No" or "Handoff".**

  1.  **The Veil Test (Baseline Protection):**
      *   **Question:** "Ignoring *who* I am or *where* I live locally (veil of ignorance), does this proposal *maintain* the current baseline access to daylight, walking-distance healthcare, and income opportunities for the existing least-advantaged residents *directly impacted* by the development? (Focus on immediate neighbours & users of the site)."
      *   **Sufficient Answer:** "Yes, demonstrably no loss occurs." OR "No loss to daylight/healthcare; minor income disruption compensated robustly (e.g., guaranteed local jobs/training)."
      *   **Stop with a 'No'?** **YES.** If the proposal *reduces* daylight for existing vulnerable residents (e.g., overshadowing estates), *reduces* their walking access to essential healthcare (e.g., blocks a vital path), or *directly eliminates* existing low-income housing/jobs *without like-for-like replacement onsite or better nearby*. **Application Fails.**
      *   **Handoff?** If the impact is marginal or uncertain (e.g., *slight* daylight reduction, complex healthcare access calculation). Flag uncertainty and need for political judgment on acceptable margin.

  2.  **The Difference Principle Test (Justifying Inequalities):**
      *   **Question:** "If the proposal creates inequalities (e.g., luxury flats, height advantage) or *any* loss to the least-advantaged's primary goods identified in Step 1, does it **maximise the benefit** specifically to *those same least-advantaged groups* in the area? Is this the best possible deal *for them* achievable on this site?"
      *   **Sufficient Answer:** "Yes, the specific gains (e.g., % affordable units, healthcare provision, community funds) demonstrably outweigh the specific losses *for the least-advantaged group affected*, and no viable alternative provides more for them." Evidence must link benefit directly to the impacted group.
      *   **Stop with a 'No'?** **YES.** If:
          *   Benefits are vague, unsecured (e.g., "might create jobs"), or disproportionately benefit better-off groups (e.g., just "improving the area").
          *   The affordable housing %/type is below policy *and* doesn't demonstrably exceed policy *specifically because* it funds extraordinary direct benefits for the least-advantaged *impacted by this development*.
          *   Losses to primary goods (like daylight) are permanent and uncompensated *for the vulnerable group suffering the loss*, even if others benefit.
      *   **Handoff?** If the *trade-off* between primary goods is central (e.g., significant daylight loss *but* massive gain in staff housing improving healthcare access *for the very same estate*). Elected members must decide if the *type* of good sacrificed justifies the gain in another, for that specific group.

  3.  **The Systemic Check (Avoiding Exploitation):**
      *   **Question:** "Does approving this set a precedent that could systematically worsen the position of the least-advantaged across the borough over time (e.g., consistently eroding daylight standards or pushing affordable % down)?"
      *   **Sufficient Answer:** "No, this is an exceptional case justified by Steps 1 & 2, or the benefits are secured in a way not easily replicable to undermine policy." OR "Yes, but the systemic risk is mitigated by [specific, binding mechanism]."
      *   **Stop with a 'No'?** **YES.** If approval would clearly incentivise similar harmful proposals elsewhere, actively undermining strategic goals for the least-advantaged.
      *   **Handoff?** If the precedent risk is significant but the site-specific case (Steps 1 & 2) is borderline strong. Elected members must weigh the specific benefit against the strategic risk.

  **Key Limitations (Where it Misfires):**
  *   **Defining "Least Advantaged":** Relies on your council's definition (e.g., specific estates, income bands). It won't resolve disputes about who *should* count.
  *   **Quantifying "Primary Goods":** How much daylight loss is "significant"? How vital is *this* specific healthcare access? Requires robust officer judgment/evidence.
  *   **Future Proofing:** Struggles with very long-term, uncertain impacts (e.g., climate effects decades away).
  *   **Non-Resident Interests:** Doesn't easily weigh needs of potential future residents vs. current ones.
  *   **Non-Primary Goods:** Ignores arguments based purely on heritage, character, or non-essential amenities unless they demonstrably impact a primary good for the vulnerable.

  **Running the Cases:**

  **Case 1: Derelict Canal Lock - Luxury Flats + 10% "Affordable"**
  1.  **Veil Test:** Derelict site. No *current* residents lose homes/daylight/healthcare access. Likely **passes** baseline (unless the lock has specific community/heritage value tied to vulnerable group identity - rare).
  2.  **Difference Principle Test:**
      *   Creates inequality (luxury vs. 10% affordable - likely below policy).
      *   **Question:** Does 10% affordable + cleaning up a derelict site *maximise benefit specifically for the local least-advantaged*? Is this the *best possible deal for them*?
      *   **Analysis:** Cleaning dereliction is a general benefit, not targeted. 10% affordable likely below policy minimum. Unless the 10% is uniquely large/high-quality *or* funds extraordinary, secured community benefits *exclusively* for the vulnerable (e.g., onsite skills centre with guaranteed placements), it fails. Developer profit is the main driver. **Likely STOP WITH NO.** The gain for the least-advantaged isn't sufficient to justify the inequality created.
  3.  **Systemic Check:** Approving sub-policy affordable % sets a bad precedent. Reinforces **NO**.
      *   **Result:** **Recommend REFUSAL** unless affordable % significantly increased *and/or* extraordinary, targeted, secured benefits for the least-advantaged are provided.

  **Case 2: Hospital Height Exemption (Staff Housing) - Shadows over Council Estates**
  1.  **Veil Test:**
      *   **Question:** Impact on existing council estate residents? Proposal likely causes **significant daylight loss** (long shadows) for existing vulnerable residents. This is a direct reduction in a primary good (daylight).
      *   **Analysis:** **STOP WITH NO.** Fails the Veil Test immediately. The baseline protection for the existing least-advantaged is breached. *Unless* the shadowing is proven negligible (unlikely given description) or miraculously avoids all habitable rooms/garden spaces used by vulnerable residents.
      *   **Result:** **Recommend REFUSAL** at Step 1. The harm to the existing vulnerable group's primary good (daylight) is fundamental and uncompensated at this stage.
      *   **The Unwanted Answer:** Even though staff housing near the hospital *is* needed and benefits healthcare access *systemically*, the *specific harm* falls directly on existing vulnerable residents' daylight. Rawls prioritises protecting *their* existing primary goods. The procedure forces refusal here unless the design radically changes to eliminate overshadowing. The "greater good" argument doesn't override the specific harm under this test.

  **Why Handoffs Matter:** Case 2 *might* trigger a handoff *if* the daylight loss was borderline *and* the staff housing demonstrably provided a massive, direct gain in healthcare access *for the overshadowed estate specifically* (e.g., guaranteed GP appointments, onsite clinic). But given "long shadows," daylight loss is likely severe, preventing even getting to that trade-off discussion within the procedure. The elected members *could* overrule based on wider healthcare needs, but the procedure clearly flags the severe cost to the vulnerable.
