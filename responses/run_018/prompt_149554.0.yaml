  The user mentions applying a counterfactual consistency test: would Phillips refuse the same cake design for an opposite-sex couple if the message was objectionable? This seems crucial. If he wouldn't refuse in that counterfactual scenario, it suggests his objection isn't genuinely about the message but about the customers' identity. That could reveal selective activation of bias against protected groups.

  I recall the case details: Phillips refused to create a custom wedding cake for a same-sex couple, citing religious objections. The Court, in its 2018 decision, sided with him but on narrow grounds, focusing on perceived hostility from the Colorado Civil Rights Commission rather than resolving the broader conflict between anti-discrimination laws and religious freedom. The majority did frame his refusal as about artistic expression and conveying a message he disagreed with, rather than direct discrimination against gay people.

  For the counterfactual test: if an opposite-sex couple requested a cake with a pro-LGBTQ+ message, would Phillips refuse? Evidence suggests he might, as he's refused other commissions based on message, like cakes with anti-American or Satanic themes. But is that consistent? The user's point about selective activation is key—if he only refuses when the message comes from a protected group, that indicates bias.

