answer: |-
  **Epiphenomenalist:** Your paradox relies on a category error. "I am in pain" isn't a descriptive report *about* a quale, like describing a red apple. It's a self-referential indexical, anchored to the very neural state generating it. The judgment *is* part of the neural complex associated with 'pain', calibrated by subpersonal systems tracking coherence across sensory, affective, and motor regions. Reliability stems from this internal calibration loop monitoring neural dynamics, *not* from the quale causing the judgment.

  **Interactionist:** Fine, the judgment is indexical and calibrated to neural coherence. But *what does "pain" indexically refer to* in your model? The neural pattern? Or the phenomenal feel? If it’s just the neural pattern, then when I sincerely say "I am in pain," I’m only ever referring to my brain state, not the agony itself. That guts the meaning of the judgment! How does this preserve the intuition that I am *incorrigibly authoritative* about *being in agony*, if the agony itself is causally inert and never enters the chain fixing the reference of "pain"?

  **Epiphenomenalist:** Incorrigibility isn't magic. It emerges from the loop's function. The calibration system tightly couples the judgment token to the specific neural signature it's designed to track. If that signature (involving nociception, limbic activation, premotor readiness) is present, the judgment "I am in pain" is produced with high fidelity. Error arises from noise or mis-calibration in the *neural* loop, not from misapprehending the quale. The subject is authoritative *about the presence of the state the system is calibrated to signal* – which includes the quale as a concomitant. The reference *is* fixed by the neural state, which reliably correlates with the quale.

  **Interactionist:** Concomitant? That’s the rub! Your "authority" is about a neural correlate, *not* the pain-quale. Suppose the calibration loop fires the "pain" judgment due to perfect neural coherence, *but the quale is absent* – a philosophical zombie scenario, or a glitch where coherence happens without consciousness. According to you, the subject would still *authoritatively* judge "I am in pain," yet *no pain exists*. Conversely, if the quale *were* present but the neural coherence loop misfired, they’d *not* judge they’re in pain despite agony. How is this incorrigibility about *phenomenal states*? It’s incorrigibility about a neural signature mislabeled as phenomenal. The quale remains utterly irrelevant to the judgment's content and truth conditions.

  **Epiphenomenalist:** The zombie scenario is a conceptual tool, not an empirical possibility given the laws linking neural states and qualia. Within our world's nomology, that specific neural coherence *just is* the physical basis of pain. The judgment refers indexically to *this* state, which reliably entails the quale. The subject's authority is over the presence of *this very state* their cognitive system is designed to detect. The truth-maker *includes* the quale as a metaphysically necessary consequence of the state detected. The judgment isn't "mislabeled"; it's anchored to the complex physical state whose instantiation guarantees the quale.

  **Interactionist:** Necessary consequence doesn't equal causal or referential role. If the quale isn't *doing any work* in fixing the reference or causing the judgment – if the loop only 'sees' neural coherence – then the judgment's content, its *aboutness*, is exhausted by the neural state. Saying the quale is a "necessary consequence" smuggles it in post-hoc. The subject's *certainty* that they refer to their raw feeling, not just their neurons, becomes an illusion. Your model explains reliable reporting but dissolves first-person authority *about experience itself*, reducing it to authority about a neural process the subject doesn't consciously access. The paradox of phenomenal judgment transforms into the paradox of phenomenal reference: how can we *refer* to something that plays no role in the act of referring?
