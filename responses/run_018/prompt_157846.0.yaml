answer: |-
  Here’s a framework for the "understanding" desiderata in machine translation, scored against the three main philosophical camps:

  ### **Core Desiderata for Understanding in MT**  
  *(What any theory must explain/achieve)*  

  1. **Ambiguity Resolution in Low-Resource Contexts**  
     - Must resolve polysemy (e.g., "bank" → financial vs. river) without relying on human annotators or parallel texts.  
     - *Test case*: Translating a language pair with no living speakers/community grounding (e.g., ancient texts).  

  2. **Pivot-Language Drift Resistance**  
     - Prevent compounding errors in chained translations (A→B→C→A). Human output remains stable; MT must avoid semantic slippage.  

  3. **Ontological Coherence**  
     - Track entity/commitment consistency across long texts (e.g., translating a novel where "Dr. Smith" is later referred to as "she").  

  4. **Distinction: Surface Fluency vs. Deep Fidelity**  
     - Must prioritize meaning preservation over grammatical elegance (e.g., "I’m fed up" → correct emotional intensity in target language, not just "I’m tired").  

  5. **Distinction: Content-Word Accuracy vs. Functional Grammar**  
     - Preserve logical connectors (e.g., "unless," "despite") that shape argument structure, even if content words are correct.  

  6. **Puzzle: The "No-Speaker Grounding" Problem**  
     - How can MT fix reference (e.g., translating "kiwi" → fruit/bird) without access to a living speech community?  

  7. **Puzzle: Efficiency vs. Understanding**  
     - Humans infer meaning from sparse data; MT requires massive corpora. Why the gap?  

  ---

  ### **Tensions (Potentially Unsatisfiable Pairs)**  
  - **Low-Resource Ambiguity Resolution + Pivot Drift Resistance**:  
    Resolving ambiguities without human grounding may require symbolic rules, but rule-based systems historically fail against pivot drift. Neural systems handle drift better but need data.  
  - **Ontological Coherence + Efficiency**:  
    Tracking entities long-term demands structured memory, conflicting with neural MT’s local-context optimization.  

  ---

  ### **Scoring the Philosophical Camps**  

  **1. Pure Correlation / No-Understanding View**  
  *(MT is pattern-matching; no semantics involved)*  
  - ✅ *Explains*: Efficiency gap (relies on brute-force stats), some pivot drift (error compounding).  
  - ❌ *Fails*: Ambiguity resolution without data, ontological coherence, deep fidelity. Treats "kiwi" as a vector, not a referent.  
  - *Verdict*: Strong on limitations, weak on puzzles like no-speaker grounding.  

  **2. Functionalism ("Behavior = Understanding")**  
  *(If outputs are human-like, understanding exists)*  
  - ✅ *Explains*: Surface fluency, content-word accuracy in high-resource settings.  
  - ❌ *Fails*: Deep fidelity (can’t distinguish fluent nonsense from meaning), pivot drift (behavior degrades), ontological tracking. Misses *why* errors occur.  
  - *Verdict*: Dodges the hard problems—confuses performance with comprehension.  

  **3. Hybrid Symbolic-Neural View**  
  *(Combines neural stats with symbolic logic)*  
  - ✅ *Explains*: Functional grammar preservation (via rules), partial ontological coherence (symbolic memory).  
  - ❌ *Fails*: Low-resource ambiguity (symbols need manual curation), pivot drift (neural components still dominate). Struggles with no-speaker grounding.  
  - *Verdict*: Best shot at deep fidelity but lacks scalability. Unclear if it resolves the efficiency gap.  

  ---

  ### **Conclusion**  
  No camp fully satisfies all desiderata. **Hybrid approaches** come closest but hit scalability walls. **Pivot drift** and **no-speaker grounding** expose the deepest flaws in statistical MT, suggesting understanding requires more than correlation—it needs *modeling reference and intention*. The core tension: achieving human-like robustness with inhuman data constraints. Until MT can resolve ambiguities *without* massive data or human-like ontological awareness, Hofstadter’s critique stands.
