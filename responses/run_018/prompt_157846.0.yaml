  hey, i'm in a philosphy of language / ai semeester and we just talked about Hofstadter's old critique of statistical translation — the shallow pattern-matching thing with no real grasp of meaning. i want to go deeper and actually lay out what a theory of "understanding" in machine translation would need to deliver, not just rehearse the usual objections.

  write the desiderata: what any adequate account has to explain about statistical MT — the cases it must get right (like resolving ambiguity in low-resource pairs with no living speaker community to ground reference, the pivot-language drift problem where A→B→C→A produces semantic slippage a human wouldn't allow, and wether the system tracks ontological commitments across long texts or just local coherence), the distinctions it must respect (surface fluency vs deep fidelity, content-word accuracy vs functional-grammar preservation, etc.), and which puzzles it must dissolve. flag any pair of desiderata you think are jointly unsatisfiable.

  then briefly score the three main camps against your list: the pure correlation/no-understanding view, the functionalist "if it behaves like it understands then it does" view, and the hybrid symbolic-neural view.

  please answer in american english. no bibliographies or citation lists — i don't have library access right now and i just want the conceptual framework. (writing on my phone so sorry for any typos)
