  Where this gets thorny is Borges' religious framing. The librarians' mystical faith in cosmic meaning resists pure epistemology - it suggests math alone can't resolve the existential dread of infinite possibility. This emotional texture reveals what formal arguments miss: the uncanniness stems from human consciousness confronting its own limitations within mathematical infinity.

