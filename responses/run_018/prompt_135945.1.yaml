  The user seems to be in an advanced supervisory role, likely in AI research or cognitive science. They need practical philosophical tools rather than abstract theory - hence the emphasis on "what it must deliver" and "cases it must get right." Their mention of "non-negotiable" requirements suggests institutional constraints, while "camp-specific preferences" implies awareness of ongoing academic debates.

