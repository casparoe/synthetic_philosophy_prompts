  hey im putting together notes on what any theory of art needs to actually deliver. write me the desiderata — the cases it has to handle, distinctions it cant collapse, and constraints it should respect (like not flat-out contradicting basic psychology or well-known art history). make sure it covers the usual puzzles (forgeries, readymades, AI-generated images) but also the "negative labor" problem, where a work is defined by the deliberate absence of traditional craft yet still relies on hidden institutional labor that the framing usually erases. flag any pair of desiderata that looks jointly unsatisfiable, especially anything involving intentionality versus institutional framing. then briefly check how institutionalism, functionalism, and a hybrid contextual-intentional view do against your list. do this in american english, keep it casual, and dont worry that my prompt has a typo or two.
