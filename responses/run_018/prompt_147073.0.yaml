  First, I need to outline the key requirements. The desiderata should include necessary cases: traditional art, forgeries, readymades, AI art, performance art, conceptual art, and controversial cases like Duchamp's Fountain. Distinctions to maintain include art vs craft, art vs artifact, and high vs low culture. Constraints involve psychological facts (like aesthetic responses) and art history facts (like the role of context and movements).

