  Conflicts between desiderata are important. For instance, the tension between artist intention and institutional validation. If a theory prioritizes institutional acceptance, it might downplay the artist's intent, which is problematic for works where intention is key. Conversely, focusing solely on intent ignores cases where institutions validate art posthumously or without the artist's input. Also, the negative labor point might conflict with theories that emphasize artist labor, as it highlights hidden institutional efforts instead.

  Now, evaluating the three theories. Institutionalism (like Dickie's) handles readymades and contextual shifts well but struggles with forgeries and AI art, plus it ignores intention. Functionalism (e.g., aesthetic theories) explains why forgeries are valued less but fails at readymades and conceptual art where aesthetics aren't central. Hybrid views combine context and intention, which might handle more cases but could have internal conflicts, especially around the negative labor problem where institutional efforts might overshadow artist intent.

