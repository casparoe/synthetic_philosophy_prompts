  **Application to Case B: Research Consortium**

  **Background**: 
     - Clinical trial showing null interim results.
     - Direct extension costs are low, but partner trust and publication rights depend on formal completion.

  **Step 0: Precondition**
     - Continue: 
          - Costs: low direct costs (say 10% of original trial budget).
          - Benefits: small chance of a positive final result (though interim results are null), but more importantly, the value of maintaining partner trust and securing publication rights.
     - Terminate:
          - Costs: loss of partner trust (which might lead to exclusion from future consortia) and forfeiture of publication rights (so no academic credit).
          - Benefits: save the 10% extension cost.

  **Step 1: Sunk Cost Filter**
     - The costs incurred so far in the trial are sunk. 
     - *Answer*: Ignore all prior costs.

  **Step 2: Future Costs and Benefits of Continuation**
     - Incremental cost: 10%.
     - Benefits: 
          - Probability of a positive final result: very low (say 5%) given null interim results. The value of a positive result: high (say 1000% of the trial budget in terms of scientific impact and future funding).
          - But the main benefit is non-monetary: preserving partner trust (which might be worth, say, 50% of the trial budget in terms of future collaborations) and publication rights (worth 20% for academic credit). 
          - We can assign:
               - Monetary equivalent of partner trust: 50%
               - Publication rights: 20%
               - Expected scientific value from the small chance of success: 5% * 1000% = 50%
          - Total expected benefit: 50% (trust) + 20% (publication) + 50% (scientific) = 120%
          - Cost: 10%
          - Expected NPV = 120% - 10% = 110% (positive)

     *Answer*: Expected NPV of continuation is positive (110%).

  **Step 3: Exit Premium Calculation**
     - Exit premium: 
          - The cost of termination is the loss of partner trust (50%) and publication rights (20%), so 70%.
     - Compare to continuation: E[Continue]=110% >> 0, and -Exit_Premium = -70%. 
          - Continuation is clearly better.

  **Step 4: Distinguishing Dollar Auction**
     - Second-place penalty: 
          - If they terminate, they lose trust and publication rights regardless of whether the trial would have eventually succeeded. This is a second-place penalty.
     - But the expected value of continuation is high, so it's rational to continue.

  **Step 5: Non-Financial Considerations**
     - The consortium's reputation for completing trials and the value of scientific knowledge might be non-financial drivers. But the financial model already captured these as monetary equivalents.

  **Step 6: Final Recommendation**
     - Continue the trial.

