prompt: |-
  I spent last weekend in a long argument with a friend who insisted that every case of organizational escalation—continuing a failing procurement, extending a broken contract, funding another tranche of a stalled project—is just Shubik’s dollar auction replayed at scale: once resources are committed, withdrawal becomes more expensive than continuing, so rational agents keep bidding past their true valuation. I think that collapses too quickly, because it treats all prior costs as sunk in the same structural way and ignores whether the environment has a second-place penalty—reputation damage, broken coalition commitments, forfeited option rights, or shadow competitors—such that leaving costs something even if you never “win.” I advise boards and public-agency governance committees, under tight deadlines and with signatures required, on whether to authorize another funding round or terminate. I need a reusable decision procedure—ordered questions, with what counts as a sufficient answer to each, explicit stop/no conditions, and marked handoff points where the issue is organizational identity or face-saving rather than decision-theoretic fact. The procedure should distinguish a true dollar-auction trap, in which withdrawal bears unrecoverable collateral costs regardless of eventual success and there are multi-party reputation stakes, from ordinary sunk-cost confusion or from rational strategic continuation that buys option value or resolves uncertainty. It should include an “exit premium” calculation comparing the full cost of leaving against the expected value of continuing, but only after filtering out costs that are genuinely sunk and non-transferable, and it should flag where rational escalation is being misclassified as pathology. Apply it to two cases: first, a municipal transit authority that has spent sixty percent of its rail-car budget with a vendor now delivering defective units, where termination triggers a two-year litigation freeze and loss of credibility with the state funding authority; second, a research consortium deciding whether to extend a clinical trial that has shown null interim results, where direct extension costs are low but partner trust and publication rights depend on formal completion. Include one case where the procedure recommends termination that the governing body will strongly resist, and state explicitly what the procedure cannot adjudicate—particularly when identity-preservation or coalition maintenance is the real driver and should be named rather than disguised as cost-benefit reasoning.
reasoning: |-
  We are building a reusable decision procedure to guide organizations on whether to continue or terminate a project, especially in the face of escalating commitment. The procedure must distinguish between:
   1. A true Shubik dollar auction (where withdrawal incurs unrecoverable collateral costs regardless of eventual success and there are multi-party reputation stakes)
   2. Ordinary sunk-cost confusion (where past costs are being inappropriately considered)
   3. Rational strategic continuation (where continuing buys option value or resolves uncertainty)

   The procedure will be structured as a series of ordered questions. For each question, we specify what counts as a sufficient answer and any stop/no conditions. We also mark handoff points where the issue becomes about organizational identity or face-saving.

   We will then apply the procedure to two cases: 
     Case A: Municipal transit authority with defective rail cars and termination consequences.
     Case B: Research consortium with a clinical trial showing null interim results.

   Additionally, we need one case where the procedure recommends termination but the governing body resists, and we must state what the procedure cannot adjudicate (e.g., identity preservation or coalition maintenance).

  ---

  **Decision Procedure: Escalation Continuation vs. Termination (ECT) Framework**

  **Step 0: Precondition - Define the Continuation and Termination Scenarios**
     - Clearly outline what the "continue" decision entails: costs, timeline, and expected outcomes (both best-case and worst-case).
     - Clearly outline what the "terminate" decision entails: immediate costs, any ongoing liabilities, and the state of the organization after termination (including any recovered assets or avoided costs).
     - *Sufficient Answer*: Both scenarios are quantified in monetary and non-monetary terms (reputation, legal, operational) to the extent possible. If quantification is impossible, a qualitative description with clear impact levels (high, medium, low) must be provided.

  **Step 1: Sunk Cost Filter**
     - Question: "Which costs incurred to date are truly sunk (i.e., unrecoverable and non-transferable) and which can be partially recovered or redeployed if we terminate now?"
     - Action: Remove all sunk costs from the decision calculus. Only future costs and recoverable costs from termination should be considered.
     - *Sufficient Answer*: A list of all major costs to date with a clear marking of which are sunk and which are recoverable (and to what extent). Any uncertainty in recovery should be quantified (e.g., expected recovery with a probability).
     - *Stop Condition*: If the decision-maker cannot identify any non-sunk costs (i.e., all prior costs are sunk) and the decision is being driven by these sunk costs, then flag as "sunk cost confusion" and recommend termination unless other steps override.

  **Step 2: Future Costs and Benefits of Continuation**
     - Question: "What are the incremental costs (both monetary and non-monetary) required to continue? What is the probability distribution of outcomes (success, partial success, failure) and the associated benefits (or avoided losses) for each outcome?"
     - Action: Calculate the expected net present value (NPV) of continuing, considering:
          - The probability-weighted benefits (including avoided penalties, future revenues, etc.)
          - The incremental costs of continuation.
     - *Sufficient Answer*: A probability-weighted financial model of continuation, including sensitivity analysis for key assumptions. Non-monetary factors must be translated into a common unit (e.g., utility points) or clearly listed as qualitative factors that will be considered in Step 5.
     - *Stop Condition*: If the expected NPV of continuation is negative by a significant margin (e.g., more than 20% of the total project budget) and there are no overriding non-financial factors, then recommend termination.

  **Step 3: Exit Premium Calculation**
     - Question: "What are the immediate and ongoing costs of termination (the 'exit premium')? This includes contractual penalties, litigation costs, reputational damage, loss of future opportunities, and any other costs that would not have been incurred if the project had never started or if we had terminated earlier."
     - Action: Calculate the exit premium as the difference between the total cost of termination (including all collateral costs) and the total cost of having never started (or having terminated at an earlier stage). Then compare this exit premium to the expected NPV of continuation (from Step 2).
          - If the exit premium is higher than the expected NPV of continuation, then termination is the rational choice only if the organization is willing to accept the exit premium to avoid further risk or if the expected NPV of continuation is negative enough to justify the premium.
          - Formally: 
               - Let E[Continue] = Expected NPV of continuation (from Step 2).
               - Let Exit_Premium = Total cost of termination (including all collateral costs) - Recoverable costs (from Step 1) [Note: we are comparing the net cost of leaving against the net benefit of staying]
          - Compare: 
               - If E[Continue] > -Exit_Premium, then continuation is financially preferable.
               - If E[Continue] <= -Exit_Premium, then termination is financially preferable.
     - *Sufficient Answer*: A clear calculation of the exit premium and a comparison to the expected NPV of continuation. The calculation must include non-monetary costs (if they are material) by converting them to equivalent monetary values or by a multi-criteria decision analysis.
     - *Stop Condition*: If the exit premium is so high that termination is financially ruinous (e.g., exceeds the organization's ability to pay) and the E[Continue] is negative but not catastrophic, then the organization might be forced to continue. However, this is a red flag for a dollar-auction trap.

  **Step 4: Distinguishing Dollar Auction from Rational Continuation**
     - Question: "Are there multi-party reputation stakes or other collateral costs that make withdrawal painful regardless of eventual project success? And does the structure of the situation resemble an auction with a second-place penalty (i.e., the loser pays their bid but gets nothing)?"
     - Action: 
          - Identify if there is a "second-place penalty": costs that are incurred only upon termination and are independent of the project's eventual success. Examples: 
               - Reputation damage that occurs even if the project would have eventually succeeded.
               - Broken coalition commitments that lead to exclusion from future opportunities.
               - Forfeiture of option rights that could have been retained by continuing.
          - If such penalties exist and are significant, then the situation resembles a dollar auction. In this case, the exit premium calculated in Step 3 is the key to the decision. If the exit premium is high and the E[Continue] is negative or marginally positive, then the organization is in a dollar-auction trap.
          - If there are no such penalties, then the continuation is being driven by either:
               - Rational strategic reasons: e.g., continuing to resolve uncertainty (if the project is in an information-gathering phase) or to capture option value (if continuing opens up future opportunities). 
               - Or sunk cost confusion (already addressed in Step 1).
     - *Sufficient Answer*: A list of second-place penalties and an assessment of whether they are present. Also, an assessment of whether there are rational strategic reasons for continuation (e.g., option value, information value) that are not captured in the financial model of Step 2.
     - *Stop Condition*: If second-place penalties are dominant and the exit premium is high, then the decision is driven by the dollar-auction structure. The procedure then hands off to a strategic discussion about whether the organization can afford the exit premium and whether there are ways to renegotiate the penalties (e.g., settlement, coalition restructuring). If not, then termination might be the only option to avoid further losses, but note that the organization may choose to continue to avoid the immediate penalty.

  **Step 5: Non-Financial and Identity Considerations (Handoff Point)**
     - Question: "Are there non-financial considerations (e.g., organizational identity, core mission alignment, face-saving, coalition maintenance) that override the financial analysis? And are these considerations substantial enough to justify a decision that is financially suboptimal?"
     - Action: 
          - These considerations must be explicitly named and separated from cost-benefit reasoning. They should be discussed at the governance level (board or committee) as a matter of organizational values and strategy.
          - The procedure cannot adjudicate these; it can only flag them and require an explicit override.
     - *Sufficient Answer*: A clear statement of the non-financial factors and a formal vote or consensus from the governing body that these factors override the financial analysis.
     - *Stop Condition*: If the governing body decides that non-financial factors are paramount, then the decision is made on that basis. The procedure records the override and the reasons.

  **Step 6: Final Recommendation**
     - Based on the above, the procedure provides a recommendation:
          - If Step 1 flags sunk cost confusion and no overriding factors: recommend termination.
          - If Step 2 shows a significantly negative E[Continue] and Step 3 shows that termination is financially preferable: recommend termination.
          - If Step 4 identifies a dollar-auction trap and the exit premium is too high to bear: recommend termination if the E[Continue] is sufficiently negative, but note the high cost of termination. Alternatively, if the organization can renegotiate the penalties, that should be attempted first.
          - If Step 4 identifies rational strategic continuation (e.g., high option value or information value that makes E[Continue] positive): recommend continuation.
          - If Step 5 overrides: then the decision is made on non-financial grounds.

  ---

  **Application to Case A: Municipal Transit Authority**

  **Background**: 
     - Spent 60% of rail-car budget with a vendor now delivering defective units.
     - Termination triggers a two-year litigation freeze and loss of credibility with the state funding authority.

  **Step 0: Precondition**
     - Continue: 
          - Costs: 40% remaining budget plus any cost overruns to fix defects.
          - Benefits: If successful, functional rail cars. Probability of success? (Assume 50% chance of success after rework, 50% chance of failure even after spending the rest.)
          - Non-monetary: Reputation for perseverance, but also risk of further defects leading to operational issues.
     - Terminate:
          - Immediate costs: Litigation costs (legal fees) and potential settlement. Also, the sunk 60% is lost. 
          - Collateral costs: Two-year litigation freeze (during which no new procurement can start) and loss of credibility with state funding authority (which may reduce future funding).
          - Benefits: Avoid spending the remaining 40%, possibility of switching to a better vendor after the freeze.

  **Step 1: Sunk Cost Filter**
     - The 60% spent is sunk. Any costs incurred in litigation or termination penalties are new costs of termination (not sunk yet). Recoverable costs? Probably none for the spent 60%. 
     - *Answer*: Sunk cost: 60% of budget. No recoverable costs from the past expenditure. 
     - *Stop Condition*: Since the sunk cost is high, but we must ignore it. If the decision is driven by "we've already spent so much", that's sunk cost confusion. We move to the next step without considering the sunk 60%.

  **Step 2: Future Costs and Benefits of Continuation**
     - Incremental cost: 40% of budget (plus potential overruns, but we'll use 40% for simplicity).
     - Benefits: 
          - Success (50%): The value of functional rail cars. Let’s assume the total project value if successful is 100% (i.e., the budget was the expected cost). Then the benefit of success is avoiding the need to spend again (so 100% value for the project, but note the 60% is sunk so the incremental benefit is the value of the rail cars minus the remaining 40% cost). However, if the project fails, we get nothing and have spent the 40%.
          - We can model:
               - Expected benefit of continuation = (Probability of success * Total project value) - Incremental cost
               = (0.5 * 100%) - 40% = 50% - 40% = 10% (of the original budget) positive.
          - But wait: the total project value is the value of having rail cars. If we terminate, we would have to do a new project after the freeze. That new project would cost (say) the same original budget (100%) and take two extra years. So the benefit of success now is avoiding a delay and the cost of a new project? Actually, we are avoiding having to spend 100% again (but note the sunk 60% is gone regardless). 
          - Alternatively, the value of having the rail cars now (if successful) is the same as the value of having them in two years (if we terminate and restart). So the net benefit of continuation is the value of having the rail cars two years earlier minus the incremental cost of 40% and minus the risk of failure. 
          - However, the state funding authority may reduce future funding if credibility is lost. That would make the cost of a new project higher (say 120% because of loss of subsidy). 
          - Let’s reframe: 
               - If we continue and succeed: we get the rail cars at a total cost of 100% (60% sunk + 40% new) and avoid the two-year delay and the higher cost of a new project (120% and two years late). The value of having the rail cars two years early is, say, 20% (if we value time). So total benefit: (100% original cost avoided in the future + 20% time value) - 100% cost now = 20%? But this is messy.
          - Simplified: 
               - Expected NPV of continuation:
                    - 50% chance: we spend 40% and get rail cars (worth 100%) => net 60% gain? But we already spent 60%, so the net from continuation is 100% (value) - 100% (total cost) = 0? 
                    - 50% chance: we spend 40% and get nothing => net -40%.
                    - Expected value: 0.5*0 + 0.5*(-40%) = -20%.
          - Alternatively, we must consider the alternative: if we terminate, we avoid spending the 40% now, but we will have to spend 120% in two years and lose two years of service. The present value of that future expenditure might be, say, 100% (if discounted at 10% per year: 120% / (1.1)^2 ≈ 99%). So the benefit of continuation is avoiding a future cost of 99% (in present value) and gaining two years of service (worth 20%). So the total benefit of success is 99% + 20% = 119%. 
          - Then expected NPV of continuation:
               - 50% chance: 119% - 40% = 79%
               - 50% chance: -40% (and then we still have to spend 99% in the future) => so net -40% -99%? But wait, the 99% is spent in the future regardless? Actually, in the failure scenario, we don't get the rail cars and then we have to spend 99% in the future to get them. So the net in failure is -40% (spent now) and then -99% (later) = -139% in present value.
               - But note: if we terminate, we avoid the 40% now and then spend 99% in the future. So the termination scenario is -99% (in present value). 
               - Therefore, the expected NPV of continuation relative to termination:
                   = 0.5*(79%) + 0.5*(-139%) - [ -99% ] 
                   = 0.5*79% + 0.5*(-139%) + 99%
                   = 39.5% - 69.5% + 99% = 69%
          - This seems positive? But we must be cautious.

     Given the complexity, we might use a simpler approach:

     - Expected cost of continuation: 40% (with no benefit if failure) and a 50% chance of avoiding the future cost of 99% and gaining 20% (so 119% benefit). 
          - Expected value = 0.5*119% - 40% = 59.5% - 40% = 19.5% (positive)

     But this ignores the fact that in the failure case we still have to pay the 99% in the future? Actually, no: in the failure case, we don't get the rail cars and then we have to do the new project. So the expected cost of the new project is incurred in both scenarios? No:

          - If we terminate now: we avoid the 40% and then pay 99% in two years (so total cost: 99% in present value).
          - If we continue and succeed: we pay 40% now and avoid the 99% and gain 20% (so net: -40% + 99% + 20% = 79%).
          - If we continue and fail: we pay 40% now and then still have to pay 99% in two years (so net: -40% -99% = -139%).

          Therefore, the expected net of continuation relative to termination:
            = 0.5*79% + 0.5*(-139%) - (-99%) 
            = 0.5*79% - 0.5*139% + 99%
            = 39.5% - 69.5% + 99% = 69%  (positive)

     This suggests continuation is better? But note: we are double-counting the avoided future cost. Let me reframe without comparing to termination:

          Termination: 
              Cost: 99% (present value of future procurement) -> NPV = -99%

          Continuation:
              Success (50%): Cost now 40%, benefit: rail cars now (which we value at 100%? but that's the original budget) plus avoiding the future procurement cost (99%) and gaining two years (20%)? 
              Actually, the rail cars now are worth 100% (the original budgeted value) plus the two years of earlier service (20%)? So total benefit: 120%. Cost: 40%. Net: 80%.
              Failure (50%): Cost now 40%, no benefit. Then we still have to do the future procurement: cost 99%. Net: -40% -99% = -139%.

          Expected NPV of continuation: 0.5*80% + 0.5*(-139%) = 40% - 69.5% = -29.5%

          Then compare to termination: termination has an NPV of -99%. So continuation is better by 69.5%? 

          This is inconsistent because in termination we don't have the rail cars until two years later, so we must assign a value to having the rail cars at all. 

     Let's start over with a common baseline: the value of having the rail cars on time (without any project) is, say, V. Then:

          - If the project had been successful on time: we would have spent 100% and gotten value V -> net = V - 100%.
          - Now, if we terminate: we get the rail cars in two years (value V discounted by two years, say V/(1.1)^2 ≈ 0.83V) and we spend 120% in two years (present cost 99%). So net: 0.83V - 99%.
          - If we continue and succeed: we get V now, and spend 100% (60% already spent, 40% now) -> net: V - 100%.
          - If we continue and fail: we get nothing now (so we are in the same position as termination, but we've spent 100% already and then we have to do the termination scenario: 0.83V - 99% and we've lost the 100%). So net: -100% + (0.83V - 99%) = 0.83V - 199%.

          Therefore, the expected net of continuation:
            0.5*(V-100%) + 0.5*(0.83V - 199%)
            = 0.5V - 50% + 0.415V - 99.5%
            = 0.915V - 149.5%

          The net of termination: 0.83V - 99%

          Continuation is better if:
            0.915V - 149.5% > 0.83V - 99%
            0.085V > 50.5%
            V > 50.5% / 0.085 ≈ 594%

          This implies that the rail cars must be worth at least 594% of the original budget to justify continuation? That seems too high.

     Given the complexity and time constraints in a real board meeting, we might rely on simpler heuristics.

     **For the sake of this example, let's assume we have a clear model from the transit authority that shows:**
          - The expected NPV of continuation is negative by 20% of the project budget (i.e., -20% of the original budget).

     *Answer for Step 2*: Expected NPV of continuation is -20% (negative).

  **Step 3: Exit Premium Calculation**
     - Exit premium: 
          - Immediate costs: litigation costs (say 10% of budget) and the two-year freeze (which we have already accounted for in the termination scenario as a delay and higher future cost). But note the loss of credibility with the state: we modeled it as increasing the future project cost by 20% (from 100% to 120%). 
          - However, the exit premium is the additional cost of terminating now versus having never started. 
          - If we had never started, we would have the option to run a procurement now (without a freeze) and get the rail cars in two years at 100% cost (and no sunk cost). 
          - But now, if we terminate, we have lost the sunk 60% and we face a two-year freeze and higher future cost (120%). So the exit premium is the combination of the sunk cost (which we are ignoring in the decision) and the additional future cost (20%) and the two-year delay (which we value at 20% of the project value). 
          - Actually, the exit premium for terminating now (relative to never starting) is:
               - Sunk cost: 60% (but we are not counting sunk costs per Step 1) -> so we ignore.
               - The additional future cost: 20% (from 100% to 120%) and the two-year delay (20% of project value). So 40%? 
          - However, note that if we never started, we would have to spend 100% in the future and get the rail cars two years from now. Now, by terminating, we are in the same position (two years from now and spending 100% plus a 20% penalty) but we have lost 60%? So the exit premium is the 60% sunk plus the 20% penalty? But the sunk cost we are ignoring. 
          - The procedure says: the exit premium should be the cost of termination that would not have been incurred if we had never started, excluding sunk costs. So:
               - Without the project: we spend 100% in the future and get rail cars in two years.
               - With termination: we spend 120% in the future and get rail cars in two years, and we have spent 60% already (sunk). 
               - The incremental cost of termination (relative to never starting) is the 60% (sunk) plus the extra 20% in the future. But we ignore sunk costs, so the exit premium is the extra 20% in the future (which is 20% in present value) and any other costs (like litigation). 
          - Therefore, exit premium = litigation cost (10%) + extra future cost (20%) = 30% of the original budget.

     - Now, compare with the expected NPV of continuation (-20% from Step 2) and the exit premium (30%):
          - The formula: 
               E[Continue] = -20%
               Exit_Premium = 30%
               -Exit_Premium = -30%
          - Since E[Continue] (-20%) > -Exit_Premium (-30%), then continuation is financially preferable? 
          - Why? Because the cost of termination (the exit premium) is 30%, which is worse than the expected loss from continuation (20%).

     *Answer for Step 3*: Exit premium = 30%. Since E[Continue] = -20% > -30%, continuation is financially better.

  **Step 4: Distinguishing Dollar Auction**
     - Second-place penalty: 
          - The loss of credibility with the state funding authority is a penalty that occurs only if we terminate, and it happens regardless of whether the project would have eventually succeeded. This is a second-place penalty.
          - The litigation freeze is also a penalty of termination.
     - Therefore, this has elements of a dollar auction: by terminating, we pay the exit premium (30%) and get nothing (we don't get the rail cars from this project), and we lose our bid (the sunk 60%). 
     - But note: the analysis in Step 3 already accounted for these penalties and still found continuation slightly better (expected loss of 20% vs. exit premium cost of 30%). So we are not in a situation where we are forced to continue to avoid a penalty that is greater than the expected loss of continuing. 
     - However, the dollar auction structure is present, and the penalties are high. But the rational calculation (Step 3) still favors continuation.

     *Answer for Step 4*: There is a second-place penalty (reputation and freeze), but the rational continuation is still preferable given the high exit premium.

  **Step 5: Non-Financial Considerations**
     - The transit authority's identity as a reliable partner and its ability to deliver projects on time might be at stake. Terminating might be seen as admitting failure, which could affect public trust. 
     - However, continuing with a defective vendor might also damage reputation if the defects lead to operational issues.

     *Handoff*: The board must decide if preserving the relationship with the state funding authority (by continuing and trying to fix the defects) is worth the risk of further defects. This is a strategic and reputational consideration.

  **Step 6: Final Recommendation**
     - Based on the financial analysis (continuation expected loss of 20% vs. termination cost of 30%), the procedure recommends continuation.
     - However, note that the probability of success (50%) is critical. If the probability of success is lower, then termination might be better. Also, the board might consider renegotiating with the vendor or the state to reduce the exit premium.

  **Case A Conclusion**: The procedure recommends continuation despite the defects because the exit premium (30%) is higher than the expected loss from continuation (20%).

