  **Case for Termination with Resistance**

  Let's create a case where the procedure recommends termination but the governing body resists.

  **Case C: Software Development Project**

  **Background**: 
     - A company has spent $5 million (out of a $10 million budget) on a new software product. 
     - The project is behind schedule and over budget. A recent technical review revealed fundamental architectural flaws that would require a complete rewrite (costing an additional $8 million) and a two-year delay. 
     - The market window is closing, and competitors have launched similar products. The expected revenue from the product, if completed, is now only $6 million (down from an initial projection of $15 million). 
     - Termination would result in a write-off of $5 million and the layoff of the project team (costing $1 million in severance). 
     - However, terminating would free up resources for a more promising project (expected NPV of $4 million). 
     - The company's CEO is personally committed to this project and has staked her reputation on it.

  **Step 0: Precondition**
     - Continue: 
          - Cost: $8 million more.
          - Benefits: $6 million in revenue (if completed) but with a 50% chance of missing the market window and getting only $2 million.
          - Expected revenue: 0.5*6 + 0.5*2 = $4 million.
          - Expected NPV: $4 million - $8 million = -$4 million.
     - Terminate:
          - Cost: $1 million severance + $5 million sunk (write-off). But the sunk cost is ignored.
          - Benefit: freeing up resources for the new project (NPV $4 million) and avoiding the $8 million cost.

  **Step 1: Sunk Cost Filter**
     - The $5 million is sunk. Ignore.

  **Step 2: Future Costs and Benefits of Continuation**
     - Incremental cost: $8 million.
     - Expected revenue: $4 million.
     - Expected NPV of continuation: $4 million - $8 million = -$4 million.

  **Step 3: Exit Premium Calculation**
     - Exit premium: 
          - Severance cost: $1 million.
          - There is no second-place penalty (like reputation damage?) beyond the severance. But note: the CEO's reputation is at stake, but that is non-financial and should be in Step 5.
     - The benefit of termination: the freed resources for the new project ($4 million NPV). So the net cost of termination is $1 million (severance) minus $4 million (benefit) = -$3 million (i.e., a net gain of $3 million).
          - Actually, termination avoids the $8 million cost and gains $4 million from the new project, but incurs $1 million severance. So overall, termination saves $8 million (avoided cost) - $1 million (severance) and gains $4 million from the new project: net gain = (8-1) + 4 = $11 million? 
          - But wait, the $8 million is avoided by not continuing. So the net of termination relative to continuation:
               - Continuation: costs $8 million and gives $4 million revenue -> net -$4 million.
               - Termination: costs $1 million and gives $4 million from the new project -> net +$3 million.
          - Therefore, termination is better by $7 million.

     - Exit premium: The cost of termination is the severance ($1 million) and any other direct costs. But note, the $5 million sunk is not counted. 
          - However, if we compare to never having started, termination leaves us with a loss of $5 million (sunk) and we get the new project ($4 million) minus severance ($1 million) -> net -$5 million + $4 million - $1 million = -$2 million. Without the project, we would have the new project ($4 million) and no severance -> net $4 million. So the exit premium is the difference: 
               Termination scenario: -$2 million
               Never started: $4 million
               Exit premium = -2M - 4M = -$6 million? That doesn't make sense.

     Let's reframe: the exit premium is the additional cost of terminating now versus never having started (excluding sunk costs). 
          - Never started: we have the new project: $4 million.
          - Terminate now: we have the sunk $5 million (ignored), we pay severance $1 million, and we get the new project $4 million -> net: -1+4 = $3 million.
          - The difference: $3 million - $4 million = -$1 million? So there is no exit premium in the sense of additional cost; actually, terminating now is worse than never starting by $1 million? But that $1 million is the severance.

     This is confusing. Instead, we can think of the exit premium as the cost that is incurred only because we started and are now terminating. That cost is the severance ($1 million). 

     Therefore, exit premium = $1 million.

     Now, the expected NPV of continuation is -$4 million. 
          We compare: E[Continue] = -$4 million and -Exit_Premium = -$1 million.
          Since -4 < -1, termination is financially preferable.

  **Step 4: Distinguishing Dollar Auction**
     - There is no clear second-place penalty (like reputation damage with partners) beyond the severance. The CEO's reputation is internal and non-contractual.
     - So this is not a dollar auction.

  **Step 5: Non-Financial Considerations**
     - The CEO's reputation and commitment to the project. Also, the morale of the team (if they are laid off) and the signal it sends to the market about the company's ability to deliver.
     - The board might feel that terminating admits failure and could affect the company's stock price.

     *Handoff*: The board must decide if the CEO's reputation and the morale considerations override the financial analysis.

  **Step 6: Final Recommendation**
     - The procedure recommends termination because the expected NPV of continuation (-$4 million) is worse than the cost of termination (exit premium of $1 million, but note termination also frees up resources for a gain of $3 million net). 
     - However, the governing body (led by the CEO) will resist.

  **What the procedure cannot adjudicate**: 
     - The procedure cannot decide whether the CEO's reputation and the company's image are worth the $7 million difference (the financial benefit of termination). It can only flag that the decision is being driven by identity and reputation, and these must be explicitly discussed and weighed by the board.

