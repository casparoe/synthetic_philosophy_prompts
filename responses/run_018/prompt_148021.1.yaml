answer: |-
  Below is a reusable decision procedure for evaluating organizational escalation decisions, designed to distinguish true Shubik's dollar auction traps from sunk-cost fallacies or rational strategic continuation. It includes ordered questions, sufficient answers, stop conditions, handoff points, and an exit premium calculation. The procedure is then applied to the two requested cases, including one where termination is recommended but resisted.

  ---

  ### **Decision Procedure: Escalation Continuation/Termination (ECT) Framework**

  #### **Core Principles**
  1. **Sunk costs are excluded** from all calculations unless they create collateral liabilities (e.g., contractual penalties).
  2. **Exit premium** quantifies the net cost of withdrawal (reputation damage, penalties, lost options).
  3. **Distinguish pathology from strategy**: Dollar auctions require multi-party reputation stakes and unavoidable withdrawal costs. Rational continuation requires measurable option value or uncertainty resolution.
  4. **Handoff to identity/coalition governance** when non-quantifiable social costs dominate.

  ---

  #### **Ordered Questions & Evaluation Criteria**
  1. **Sunk Cost Identification**  
     - *Question*: "Which prior costs are truly sunk (non-recoverable, non-transferable)?"  
     - *Sufficient Answer*: Itemized list of costs with clear rationale for recoverability (e.g., "Vendor prepayments are forfeited; specialized equipment has no resale value").  
     - *Stop Condition*: If >50% of decision reasoning invokes sunk costs, **flag sunk-cost fallacy** and recommend termination unless subsequent steps override.  

  2. **Future Cost-Benefit of Continuation**  
     - *Question*: "What is the expected value (EV) of continuing, including probabilities of success/failure and *future* costs/benefits?"  
     - *Sufficient Answer*:  
       - Quantified EV using best/worst/most-likely scenarios.  
       - Explicit uncertainty ranges (e.g., "Success probability: 10–20% due to technical risk").  
       - Non-monetary benefits (e.g., "Completing the trial preserves publication rights").  
     - *Stop Condition*: If EV of continuation is negative *and* absolute value >20% of total project budget, **recommend termination** unless exit premium justifies proceeding.  

  3. **Exit Premium Calculation**  
     - *Question*: "What are the net costs of withdrawal *excluding sunk costs*? Include: penalties, reputation damage, lost options, and partner retaliation."  
     - *Formula*:  
       \[
       \text{Exit Premium} = \text{Direct Termination Costs} + \text{Reputation/Opportunity Costs}
       \]  
     - *Sufficient Answer*: Monetized or scored impacts (e.g., "Litigation delay costs: $2M/year; State funding credibility loss: High/5/5 risk score").  
     - *Key Filter*: Only include costs incurred *specifically because of withdrawal* (e.g., losing state trust only matters if withdrawal triggers it).  

  4. **Dollar Auction vs. Rational Continuation Test**  
     - *Question*: "Does withdrawal impose unavoidable collateral costs regardless of eventual success, and are multi-party reputation stakes involved?"  
     - *Sufficient Answer*:  
       - **Dollar auction confirmed** if:  
         - Exit premium exists even if project would later succeed.  
         - ≥2 parties incur reputation damage (e.g., consortium partners, regulators).  
         - No material option value/learning from continuation.  
       - **Rational continuation confirmed** if:  
         - Continuation resolves critical uncertainty (e.g., "Final trial data unlocks partnerships").  
         - Exit premium < EV of continuation.  
     - *Stop Condition*: If dollar auction criteria met *and* exit premium > EV of continuation, **recommend termination** (trapped).  

  5. **Governance Handoff Point**  
     - *Question*: "Are identity preservation, face-saving, or coalition stability the primary drivers?"  
     - *Sufficient Answer*: Qualitative statement (e.g., "Termination voids political deal with mayor").  
     - *Action*: **Handoff to board/governance committee**. Decision must be framed as:  
       *"We authorize $X for [project] solely to preserve [coalition/identity], acknowledging an expected financial loss of $Y."*  
     - *Non-Adjudicable Elements*:  
       - Legitimacy of identity-based reasoning.  
       - Trade-offs between financial loss and social capital.  

  6. **Final Recommendation**  
     - **Terminate** if:  
       - Sunk-cost fallacy dominates, *or*  
       - EV continuation ≪ 0 *and* exit premium < |EV|, *or*  
       - Dollar auction trapped (exit premium > EV continuation).  
     - **Continue** if:  
       - EV continuation > exit premium, *or*  
       - Rational option value > exit premium.  

  ---

  ### **Application to Cases**

  #### **Case 1: Municipal Transit Authority**  
  - **Context**: Spent 60% of rail-car budget; vendor delivers defects. Termination causes 2-year litigation freeze and state funding credibility loss.  
  - **Procedure Application**:  
    1. **Sunk Cost Identification**: 60% budget spent = sunk (non-recoverable). *No stop*.  
    2. **Future Cost-Benefit of Continuation**:  
       - Cost: 40% remaining budget + defect fixes ($10M).  
       - EV: Low success chance (<30%); best-case benefit = $5M (avoided delays).  
       - EV continuation = **-$7M** (high risk).  
    3. **Exit Premium**:  
       - Direct costs: Litigation ($1M).  
       - Reputation: State funding loss (monetized as $8M in future grants).  
       - **Total exit premium = $9M**.  
    4. **Dollar Auction Test**:  
       - Withdrawal costs unavoidable (state anger even if vendor later fixes defects).  
       - Multi-party stakes: State + voters + contractors.  
       - **True dollar auction** (no option value).  
    5. **Decision**:  
       - EV continuation (-$7M) > -Exit premium (-$9M) → **Continue is financially preferable**.  
       - *Governance Handoff*: If termination avoids public safety risks, board must frame as: *"We spend $7M extra to avoid $9M in reputation loss."*  

  **Verdict**: Continue, but dollar auction confirmed. Exit premium forces suboptimal continuation.  

  ---

  #### **Case 2: Research Consortium Clinical Trial**  
  - **Context**: Null interim results; extension costs low, but partner trust/publication rights require completion.  
  - **Procedure Application**:  
    1. **Sunk Cost Identification**: Prior trial costs = sunk. *No stop*.  
    2. **Future Cost-Benefit of Continuation**:  
       - Cost: Low (10% budget).  
       - EV: Near-zero success chance, but partner trust = $2M in future projects; publication rights = reputational value.  
       - **EV continuation = $1.5M** (non-financial upside).  
    3. **Exit Premium**:  
       - Lost partner trust = $2.5M; forfeited publication = $0.5M.  
       - **Total exit premium = $3M**.  
    4. **Dollar Auction Test**:  
       - Withdrawal costs unavoidable (partners lose trust even if trial would succeed).  
       - Multi-party stakes: Consortium members + academic journals.  
       - **True dollar auction**, but EV continuation ($1.5M) > -Exit premium (-$3M)? No:  
         - *Clarification*: EV continuation ($1.5M) is net positive; exit premium is a $3M loss *only incurred upon termination*.  
       - Rational continuation: Completing trial preserves collaboration infrastructure (option value).  
    5. **Decision**:  
       - EV continuation ($1.5M) > 0 → **Continue**. Exit premium irrelevant as continuation is net beneficial.  

  **Verdict**: Continue. Not a dollar auction trap due to positive EV.  

  ---

  #### **Case 3: National Space Agency Satellite Project** (Termination Recommended but Resisted)  
  - **Context**: Spent $800M of $1B budget; technical failures suggest 90% chance of total failure. Termination loses international partnerships; continuation requires $300M more.  
  - **Procedure Application**:  
    1. **Sunk Costs**: $800M = sunk. *No stop*.  
    2. **Future Cost-Benefit**:  
       - EV continuation = 10% chance of $200M benefits - $300M cost = **-$280M**.  
    3. **Exit Premium**:  
       - Partner penalties = $100M; lost contracts = $150M.  
       - **Total exit premium = $250M**.  
    4. **Dollar Auction Test**:  
       - Withdrawal costs unavoidable (partners exit even if satellite later works).  
       - Multi-party stakes: 5+ countries.  
       - **True dollar auction**.  
    5. **Decision**:  
       - EV continuation (-$280M) < -Exit premium (-$250M) → **Terminate**.  
    6. **Governance Resistance**:  
       - Agency head resists: "Abandoning project betrays national pride."  
       - *Handoff*: Board must explicitly minute: *"We reject termination despite a $30M net financial loss to preserve geopolitical standing."*  

  **Verdict**: Procedure recommends termination, but overridden by identity preservation.  

  ---

  ### **What the Procedure Cannot Adjudicate**  
  1. **Identity Preservation**: When "who we are" (e.g., "a spacefaring nation") justifies losses.  
  2. **Coalition Stability**: If honoring a flawed project maintains critical political alliances.  
  3. **Moral Hazard**: Hidden agendas (e.g., executives protecting promotions).  
  4. **Non-Quantifiable Social Costs**: E.g., public hope in a failing project.  

  In such cases, the procedure forces explicit acknowledgment: *"We are paying $X for non-financial goal Y."* This prevents disguising identity-driven choices as rational cost-benefit decisions.
