  ---  
  **Session Flow Logic**:  
  1. Start with familiar law concepts (amendment rules).  
  2. Use Ulysses as an intuitive hook, then force rupture via non-identity.  
  3. Misconceptions intercepted *as they arise* to prevent cognitive entrenchment.  
  4. "Reverse Ulysses" reframing emerges naturally from the analogy break.  
  5. Closing question tests conceptual boundaries, not just recall.
