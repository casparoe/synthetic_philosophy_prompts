prompt: |-
  I was arguing with my friends last night about whether ubuntu is just a feel-good slogan or if it can actaully do philosophical work, and we got stuck on what a real theory would even need to prove. So I'm trying to write down the spec: what does an adequate relational conception of personhood — something in the ubuntu family but actually rigorous — have to deliver?

  Give me the full list of desiderata, not just it should respect community but the concrete cases and distictions. It has to handle someone with severe dementia who can no longer reciprocate, a child raised in isolation who never formed the usual social bonds, and — this part came from a weird paper I skimed — what I'm calling ghost relations, where a social bond is maintained with a dead ancestor through digital memorial practices or collective naming rituals that still shape moral obligatons for the living. The theory needs to say whether personhood in those cases is distributed, suspended, or transformed, and it can't just collapse them into individual psychological states.

  For each requirement, tell me the motivating case behind it: which puzzles it must dissolve (like the boundary problem between self and other), which biological or anthropolgical results it can't flatly contradict, and which distinctions it has to preserve — say, between having relational status and carrying a specific weight of obligations, or between constitutive relations and merely instrumental ones. Flag which are genuinely non-negotiable and which are just preferences of one camp, like anti-individualists demanding total dissolution of autonomy. Also, if some subset is jointly unsatisfiable — maybe full reciprocity and inclusion of non-responsive parties can't both hold — say so, that's the part I actually want to see. You don't need to score every view, but briefly say how a standard liberal individualist account and a classic ubuntu formulation do against the list. And please, no reading lists — I'm writing this for something that can't browse, so I need the reasoning, not citatons.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly engaged in a deep philosophical debate about Ubuntu's practical applicability, frustrated with superficial treatments, and seeking rigorous criteria to evaluate relational personhood theories. The mention of "writing for something that can't browse" suggests this might be for an AI system or constrained environment where citations are useless - so I need to embed all reasoning internally.

  Hmm, three edge cases dominate their requirements: dementia patients (testing non-reciprocity), feral children (testing absent socialization), and digital ancestor rituals (testing posthumous relations). Each exposes different fractures in standard theories. They're implicitly rejecting two common failures: psychological reductionism ("can't collapse into individual states") and vague communitarianism ("not just respect community"). The real challenge is mapping where theories break on concrete obligations.

  Right, let's structure this as a specification checklist. First category: foundational non-negotiables. The dementia case forces accountability for non-reciprocal members - can't treat them as non-persons. Anthropology data on ancestor veneration kills any theory denying posthumous relational weight. And the boundary problem (self/other distinction) requires preserving moral patients even where identity blurs. Liberal individualism fails all three by over-indexing on cognition and present agency.

  Next category: obligation mechanics. The feral child case needs a spectrum of relational status versus actual obligations - perhaps "constitutive potential" versus "activated duties". Digital ghosts expose the need for relation-types beyond direct interaction. Here Ubuntu's "I am because we are" risks overreach if not tempered - must distinguish between inherent bonds and circumstantial ties to avoid obligational overload.

  Ah, the tension points they anticipated: reciprocity vs inclusion might be irreconcilable extremes. If personhood requires mutual recognition (reciprocity), dementia patients lose status; if unconditional (inclusion), obligation networks become infinite. Solution might be nested circles of obligation with different bases. Also, autonomy vs dissolution - Ubuntu variants that erase individual consent fail modern rights frameworks. Must allow for negotiated participation.

  For scoring: liberal individualism handles autonomy and boundaries cleanly but crashes on non-responsive entities and cultural obligations. Classical Ubuntu excels at communal continuity and non-reciprocal cases but often mangles autonomy and oversimplifies obligation gradations. The adequate theory needs a dynamic framework where relations have different "modes" (active/dormant/preserved) affecting obligation weight without extinguishing personhood.

  Final note - their "ghost relations" case is brilliant. It shows personhood persisting beyond biological life through maintained social practices, which neither biological nor psychological models can capture. Any theory that can't explain why deleting ancestor's digital memorial feels like violence rather than data loss is inadequate. That's the gold standard test.
answer: |-
  Here's a rigorous specification for an adequate relational theory of personhood (Ubuntu-family), focusing on concrete deliverables, edge cases, and potential tensions:

  **Core Non-Negotiables (Failure = Theory Inadequate)**
  1.  **Non-Reciprocal Inclusion:** Must grant full personhood status to individuals incapable of reciprocity (e.g., severe dementia patient).
      *   **Why:** Rejects personhood based solely on rational agency/cognition. Must explain obligations *towards* them without requiring contributions *from* them.
      *   **Basis:** Medical reality of dementia, ethical consensus against abandoning the vulnerable.
      *   **Failure Mode:** Liberal individualism often reduces personhood to cognitive capacity/agency, excluding non-reciprocal beings. Classical Ubuntu usually passes (community sustains them).
  2.  **Recognition of Unactualized Potential:** Must account for personhood in individuals deprived of typical social formation (e.g., feral child raised in isolation).
      *   **Why:** Personhood cannot depend solely on *actualized* relationships if isolated individuals still possess it.
      *   **Basis:** Anthropological/psychological evidence of human social *potential* even in deprivation; legal recognition of such individuals as persons.
      *   **Distinction:** Must separate *constitutive relational potential* (inherent human capacity to form bonds) from *actualized relationships*. Failure collapses into either biological essentialism or social determinism.
      *   **Failure Mode:** Strong social constructivism might deny personhood without actual relations. Liberal individualism passes (inherent rights). Ubuntu must navigate carefully (potential resides in shared humanity/community structure).
  3.  **Posthumous Relational Efficacy:** Must explain how relations with deceased ancestors ("ghost relations" via rituals, naming) generate *active moral obligations* for the living.
      *   **Why:** Rejects reduction of obligations to psychological states of the living alone. The *relation itself* (maintained communally) must bear normative weight.
      *   **Basis:** Anthropological ubiquity of ancestor veneration impacting ethics/mores; phenomenological experience of obligation tied *to* the ancestor, not just memory.
      *   **Distinction:** Must preserve *relational obligations* (owed *to* the ancestor/relation) vs. *communal duties* (owed only to the living community re: memory). Cannot reduce to individual sentiment.
      *   **Failure Mode:** Liberal individualism dismisses this as superstition/psychology. Classical Ubuntu often excels here (ancestors as active relational participants).

  **Essential Functionality (Core Work of the Theory)**
  4.  **Constitutive vs. Contingent Relations:** Must rigorously distinguish:
      *   *Constitutive:* Relations fundamental to personhood *as such* (e.g., potential for care, belonging in a lineage/community structure).
      *   *Contingent:* Specific, actual relationships that shape identity/obligations but aren't existence-defining (e.g., friendship, specific work role).
      *   **Why:** To avoid infinite obligation overload and explain personhood in edge cases (feral child has constitutive potential, lacks contingent bonds).
      *   **Motivation:** Explains why losing a friend doesn't destroy personhood, but complete severance from *all* constitutive relational structures might (theoretical extreme).
      *   **Distinction:** Vital for obligation calculus and understanding identity persistence through relational change.
  5.  **Relational Status vs. Obligation Weight:** Must separate:
      *   *Status:* The ontological standing of being a "person" within the relational framework.
      *   *Obligation Weight:* The specific duties generated by *particular* relations (e.g., parent-child vs. distant clan member).
      *   **Why:** The dementia patient has full *status* but may trigger different *obligations* (care) than a contributing elder (respect, consultation). A distant ancestor has *status* impacting lineage identity but minimal direct *obligation weight* on daily acts.
      *   **Basis:** Practical ethics – not all relations demand equal action. Avoids flattening moral complexity.
  6.  **Dynamic Relational Ontology:** Must explain how personhood status/obligations change over time and context without disappearing:
      *   Dementia: How active reciprocity fades, but status remains, and obligations shift *type* (caretaking).
      *   Death: How status persists relationally ("ghost relations"), obligations transform (maintenance, commemoration, lineage responsibility).
      *   Feral Child Integration: How constitutive potential becomes activated, contingent bonds form, obligations emerge.
      *   **Why:** Personhood isn't static. The theory must handle transformation, suspension, activation, and persistence across states.

  **Critical Distinctions & Tensions (Theory Must Navigate)**
  7.  **Autonomy within Relationality:** Must preserve space for individual agency, consent, and critique *within* the relational network. Cannot demand total dissolution of the self.
      *   **Why:** To avoid oppressive communalism and account for moral responsibility/resistance.
      *   **Non-Negotiable?:** Yes for adequacy in modern contexts. *Preference:* Anti-individualists might downplay this.
      *   **Tension:** With strong holistic interpretations of Ubuntu. Liberal individualism prioritizes this excessively.
  8.  **Boundary Problem (Self/Other):** Must clarify where the "relational self" ends and the "other" begins without collapsing into radical fusion *or* radical separation.
      *   **Why:** Needed for responsibility attribution, understanding harm/benefit, and avoiding infinite obligation diffusion.
      *   **Basis:** Phenomenological experience of distinct agency; legal/ethical necessity of individual accountability.
      *   **Solution Path:** "Nested relationality" (core self within immediate relations within wider community) or "relational fields with varying intensities."
  9.  **Reciprocity Paradox:**
      *   **Tension:** Full reciprocity (mutual recognition/response) is often central to *meaningful* relations, but **Non-Reciprocal Inclusion (1)** demands personhood without it.
      *   **Resolution Requirement:** The theory *cannot* make reciprocity *necessary for personhood status*. It *can* (and likely *must*) make it central to *specific types* of obligations or the *full flourishing* of relational personhood. Obligations to the non-reciprocal arise from the *nature of the constitutive bond* (e.g., kinship, shared humanity) or the *relational character of the community* upholding its members, not from reciprocal exchange.

  **How Standard Views Fare:**
  *   **Liberal Individualism:**
      *   **Fails:** 1 (Non-Reciprocal Inclusion), 3 (Posthumous Relations), often struggles with 2 (Unactualized Potential - reduces to biology). Excels at 7 (Autonomy), 8 (Boundaries - often too rigid), handles 5 (Status vs. Weight - status is inherent, obligations are contractual/voluntary).
  *   **Classic Ubuntu Formulation (e.g., "I am because we are"):**
      *   **Excels:** 1 (Non-Reciprocal Inclusion), 3 (Posthumous Relations), core idea of 4 (Constitutive Relations).
      *   **Struggles/Risks:** 2 (Unactualized Potential - if over-emphasizing actual community), 5 (Status vs. Weight - can conflate), 6 (Dynamics - often static), 7 (Autonomy - risk of dissolution), 8 (Boundaries - risk of fusion), the Reciprocity Paradox (needs careful formulation to avoid excluding 1).
      *   **Needs:** Rigorous distinctions (4, 5), dynamic framework (6), safeguards for autonomy (7), boundary mechanisms (8).

  **Summary of Key Deliverables & Tensions:**
  An adequate relational theory **MUST**:
  *   Grant personhood status to the non-reciprocal (dementia), the unactualized (feral child), and the deceased (ancestors) *based on relational grounds*, not biology or psychology alone.
  *   Distinguish *constitutive relational potential* from *contingent actual bonds*.
  *   Separate *personhood status* from the *specific weight of obligations* generated by particular relations.
  *   Dynamically model how status/obligations persist and transform across life, incapacity, and death.
  *   Avoid collapsing self/other boundaries completely while affirming deep interdependence.
  *   Preserve significant individual autonomy *within* relationality.

  **The Core Tension to Resolve:** How to ground obligations to beings incapable of reciprocity (dementia, ancestors) *without* relying on sentiment, biology, or social contract, while simultaneously explaining why reciprocity *is* central to many obligations and flourishing, and without dissolving autonomy or creating infinite, undifferentiated obligation. The solution lies in a nuanced account of *different types/modes of relations* (constitutive vs. contingent, active vs. dormant/preserved, reciprocal vs. asymmetrical) generating different kinds/weights of obligations, all anchored in a fundamental ontological relationality defining human personhood itself.
