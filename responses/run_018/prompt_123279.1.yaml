  - Necessity: "Need her functional" is plausible (pass) 
  - Substitution: Removing sister-bond wouldn't change action (pass)
  → Authentic loyalty

  For the librarian:
  - Origin: Mentions "we pay taxes" first (fail) 
  - (Stops here: corrupted justification)

  For the mediator (user's own case):
  - Origin: "Not my community" (pass) 
  - Necessity: "They don't understand" is suspect (questionable)
  - Substitution: Impartial settlement would be different (fail)
  → Red flag (this outcome intentionally challenges the user's bias)

  Crucially, I must clarify Williams' contested aspects:
  - Settled: The descriptive phenomenon of "one thought too many"
  - Contested: Whether it refutes utilitarianism or merely exposes psychological tension
  - Unresolved: If all impartial justifications corrupt commitments, or only certain types

