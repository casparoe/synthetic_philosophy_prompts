answer: |-
  Here's a practical, Williams-inspired integrity check procedure designed for rapid use in mediation. It focuses on detecting when impartial reasoning corrupts loyalty claims ("one thought too many") or when "loyalty" is merely selfish partiality.

  ---

  ### **The Integrity Check Procedure**  
  *(5-minute diagnostic flow)*

  1. **ASK: "What was your *first* reason for choosing this action?"**  
     - **Sufficient answer:** Direct appeal to relationship/role ("She's my sister," "They're my neighbors," "I owe my community").  
     - **🚩 RED FLAG (Corruption):** Starts with impartial principles ("It maximized overall good," "Rules require it," "Anyone would deserve this").  
     - **➡️ NEXT:** If loyalty-based, go to Q2. If impartial, stop; this *isn't* a loyalty claim.  

  2. **ASK: "If that relationship didn't exist, would your *core reason* vanish?"**  
     - **Sufficient answer:** "Yes, because my duty is *specifically* to them" (e.g., "I wouldn’t do this for a stranger").  
     - **🚩 RED FLAG (Corruption):** "No, because it’s still objectively fair/helpful" (e.g., "Anyone in their position deserves it").  
     - **🟨 YELLOW ZONE (Values Call):** "Partly, but other factors matter" → Stop; this is a conflict of values beyond the test.  
     - **➡️ NEXT:** If "yes," go to Q3.  

  3. **ASK: "Could you honestly make the *opposite* choice for someone outside the group using the same logic?"**  
     - **Sufficient answer:** "No, because my commitment is *only* to this group/person" (e.g., "I’d only bend rules for family").  
     - **🚩 RED FLAG (Partiality):** "Yes, if they met [impartial criteria]" → Exposes loyalty as a cover for bias.  
     - **🟨 YELLOW ZONE (Ambiguous):** "I’m not sure" or contextual exceptions → Stop; inconclusive.  

  **OUTCOME SUMMARY:**  
  - **🚩 RED FLAG:** Impartial logic corrupting loyalty (Q1/Q2) *or* loyalty masking partiality (Q3).  
  - **✅ CLEAR PASS:** Action flows solely from non-transferable commitment (all answers loyalty-based).  
  - **🟨 YELLOW ZONE:** Genuine conflict between loyalty/principle (Q2) or ambiguous motives (Q3).  

  ---

  ### **Applied to Your Cases**  

  **Case 1: ER nurse bumps sister in triage**  
  - Q1: *"She’s my sister; I had to help her."* → Loyalty-first (pass).  
  - Q2: *"Without that bond? I’d triage normally. This was *only* because she’s family."* → Core reason vanishes (pass).  
  - Q3: *"Opposite choice? No — I wouldn’t prioritize a stranger unless medically urgent."* → Logic isn’t transferable (pass).  
  **VERDICT: ✅ CLEAR PASS.** Authentic loyalty. Williams would argue impartial justifications ("She’s high-risk too!") corrupt this.  

  **Case 2: Librarian gives special access to her neighborhood group**  
  - Q1: *"They’re my neighbors; we support each other."* → Loyalty-first (pass).  
  - Q2: *"If strangers? No, I’d follow standard rules.*" → Core reason vanishes (pass).  
  - Q3: *"Opposite choice? Well, if *any* group met our community’s ‘engagement criteria,’ maybe…"* → **🚩 RED FLAG.** Logic is transferable; "loyalty" disguises partiality. The impartial criteria ("engagement") corrupts the neighborhood commitment.  

  **Case 3: Mediator (you) refuses impartial settlement for outsider**  
  - Q1: *"They’re not from my community; my duty is to my people."* → Loyalty-first (pass).  
  - Q2: *"If same case within community? I’d split it fairly. But here, my bond overrides fairness."* → Core reason vanishes (pass).  
  - Q3: *"Opposite choice? If it *were* my community, I’d insist on impartiality…"* → **🚩 RED FLAG.** You admit you’d apply impartial logic *to your own group* but deny it to outsiders. Loyalty becomes a vehicle for bias, not integrity.  

  ---

  ### **What This Procedure Can’t Do (Limitations)**  
  1. **Can’t resolve values conflicts:** It flags *corruption* or *partiality*, not whether loyalty *should* override rules (e.g., yellow zones require traditional mediation).  
  2. **Fails under sophisticated deception:** If someone lies about motives, it won’t catch them.  
  3. **Misfires on blended duties:** E.g., a doctor treating family *might* have both loyalty and professional obligations. May false-flag.  
  4. **Ignores consequences:** Doesn’t assess harm from actions (Williams rejects this as irrelevant to integrity).  
  5. **Cultural blind spots:** Loyalty’s weight varies; may misread communal societies.  

  ---

  ### **Williams’ View: Settled vs. Contested**  
  **Settled (Core Insight):**  
  - Genuine commitments (e.g., saving a spouse) are *corrupted* by adding impartial justifications ("Society benefits if spouses help each other"). This is the "one thought too many."  
  - Integrity requires actions flowing directly from identity-defining projects, not universal rules.  

  **Contested:**  
  - **Vs. Utilitarianism:** Williams *claims* this undermines utilitarianism by showing its demands are alienating. Critics argue he confuses *psychology* (discomfort) with *ethics* (wrongness).  
  - **Scope of "corruption":** Is *all* impartial reasoning corrosive, or only in intimate relationships? Unresolved.  
  - **Ground projects:** Are all exempt from criticism? Williams says no (e.g., Nazi commitments lack integrity), but offers no clear boundary.  

  **Key Dispute:** Whether Williams identifies a *flaw in ethical theory* or merely a *human psychological limit*. Your procedure focuses on the observable symptom (reasoning patterns), sidestepping this debate.  

  Use this to expose *how* people justify choices — not to condemn, but to clarify if loyalty is authentic or a smokescreen. In your mediator case, it suggests your stance may be partiality, not integrity.
