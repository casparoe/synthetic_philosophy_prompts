  First, I need to distill Williams' core concept into an actionable framework. The key insight is that genuine loyalty-based actions stem directly from personal commitments, while problematic justifications try to "double-dip" by dressing partiality in impartial language. The challenge is creating a procedure that distinguishes between:
  - Authentic loyalty expressions (which may not need justification)
  - Corrupted justifications (smuggling impartial reasoning into partial commitments)
  - Blatant partiality (masked as loyalty)

  I'll structure this as a decision tree with three diagnostic questions:
  1) Origin check: Does the reasoning start with loyalty or impartiality?
  2) Necessity check: Is the loyalty appeal essential or ornamental?
  3) Substitution test: Would impartial reasoning change the action?

  For each question, I need clear pass/fail criteria and stopping points. The outcomes should categorize cases as:
  - Red flag (corrupted reasoning)
  - Yellow zone (genuine values conflict beyond the tool's scope)
  - Clear pass (authentic loyalty expression)

  The tool must avoid academic jargon and function in time-pressed mediation settings. It should also acknowledge its limitations - it can't resolve value conflicts, detect sophisticated manipulation, or handle cases where loyalties and duties genuinely overlap.

  Now applying it to the user's cases:
