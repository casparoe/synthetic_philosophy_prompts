prompt: |-
  I advise a municipal treasury office that is piloting a local accounting unit—call it a service-backed scrip—redeemable not for national currency but for concrete labor and maintenance: road repair, flood-barrier upkeep, food-distribution logistics, and artisanal repair services. We are attempting to avoid both speculative hoarding and inflationary over-issue, and a colleague has directed me to George Berkeley's theory of money, according to which coin or paper is not wealth in itself but a kind of ticket or counter that represents labor and commodities, such that to multiply the tickets without multiplying the goods they represent is to undermine the social trust on which the system depends. I need you to translate Berkeley's core commitments—especially that money tracks real productive capacity, that it operates as a convention sustained by collective confidence rather than as a commodity with intrinsic value, and that its issuance should not outpace the tangible assets and labor available to honor it—into a concrete, reusable decision procedure my staff can run without philosophical training.

  Please structure it as an ordered set of questions: what must be established at each stage, what counts as a sufficient answer, where the procedure terminates with a clear refusal, and where it must hand the decision to a person because the issue is one of values rather than of economic or institutional fact. The procedure should apply specifically to proposals about issuing new scrip, redeeming existing scrip for services, and accepting collateral to back the unit, and it should be honest about where simplification risks distorting Berkeley's original distinction between a token of value and value itself.

  Then apply the procedure to two proposals we are actually considering: first, backing a new tranche of scrip with a portfolio of undeveloped municipal land whose market value is projected but not realized, and second, authorizing emergency redemption of scrip for climate-adaptation labor during a budget crisis in which the available labor pool is uncertain and the citizens' assembly that sets redemption priorities is divided over whether to privilege immediate disaster response over long-term infrastructure. Include one case in which the procedure yields an answer my office will not welcome, and clearly mark any step at which the procedure cannot eliminate judgment and a treasury officer must decide.
reasoning: |-
  Okay, the user is from a municipal treasury office piloting a service-backed scrip system. They need a practical decision procedure based on George Berkeley's monetary theory to avoid hoarding and inflation. The core challenge is translating philosophical concepts into actionable steps for staff without economic training.

  Berkeley's key principles are:
  - Money as tokens representing real productive capacity
  - Value derived from collective trust, not intrinsic worth
  - Strict correlation between scrip issuance and redeemable services/assets

  The procedure must handle three scenarios: issuing new scrip, redeeming for services, and accepting collateral. It needs clear stopping points and value-judgment flags. 

  For the land-collateral proposal, the critical failure occurs at Step 3.1 - undeveloped land isn't "realized service capacity" since it requires additional inputs to generate value. Staff would reject this despite political pressure.

  The emergency redemption case hits multiple judgment points:
  Step 4.1 requires human assessment of labor uncertainty
  Step 4.3 demands political resolution of priority conflicts
  Step 5.1 involves weighing system integrity vs immediate crisis

  The procedure deliberately sacrifices nuance (like Berkeley's distinction between token/value) for usability. The built-in rejection of unrealized assets and mandatory human intervention at trust-impacting decisions protect against oversimplification.

  User's unspoken needs:
  - Political cover for unpopular decisions (hence the clear rejection triggers)
  - Staff empowerment through binary checkpoints
  - Preservation of system credibility during crises
  </thinking>
answer: |-
  Here is a Berkeley-inspired decision procedure for your scrip system, structured as ordered questions with clear thresholds. It prioritizes **tangible service capacity** and **social trust** over abstract valuations, per Berkeley's view that money is a "ticket" for real goods/labor, not a commodity.

  ---

  ### **Decision Procedure for Service-Backed Scrip**  
  *(Apply to: New Issuance, Redemption Authorization, Collateral Acceptance)*  

  **Core Principle:** Scrip is a *token of trust* in future municipal service delivery. Its value collapses if issuance exceeds redeemable capacity or if redemption promises lack credibility.  

  #### **PHASE 1: PROPOSAL ASSESSMENT (Establish Baseline)**  
  1. **What tangible service/labor does this proposal commit to deliver?**  
     - *Sufficient answer:* Specific, quantifiable services (e.g., "100 hrs of road repair," "50 flood-barrier inspections").  
     - *Terminate/refuse if:* Vague promises ("improved infrastructure") or non-service collateral (e.g., financial assets).  

  2. **Is the committed service/labor *currently available*?**  
     - *Sufficient answer:* Documented municipal capacity (e.g., work schedules of repair crews, inventory of repair materials).  
     - *Terminate/refuse if:* Dependent on unrealized future resources (e.g., "if we hire more staff").  

  #### **PHASE 2: CAPACITY VERIFICATION (Anchor to Reality)**  
  3. **Does the proposal’s scale align with *measured service capacity*?**  
     - For **new scrip issuance:** *"Does the new scrip volume ≤ 90% of unused service capacity?"*  
       - *Sufficient answer:* Current backlog + new issuance ≤ 90% of monthly service output (e.g., 900 repair-hrs capacity → max 810 hrs scrip issued).  
       - *Terminate/refuse if:* Exceeds 90% threshold (reserve 10% for emergencies).  
     - For **redemption:** *"Can requested services be delivered within 30 days without disrupting existing commitments?"*  
       - *Sufficient answer:* Redemption schedule fits within current crew availability.  
       - *Terminate/refuse if:* Would delay prior scrip redemptions.  
     - For **collateral:** *"Does collateral directly enable *new* service capacity?"*  
       - *Sufficient answer:* Land with *active* community gardens (food production), workshops with *contracted* artisans.  
       - *Terminate/refuse if:* Collateral requires transformation (e.g., raw land, unmined minerals).  

  4. **Is confidence in this commitment *socially verifiable*?**  
     - *Sufficient answer:* Publicly auditable records (e.g., live dashboard of crew locations), citizen assembly ratification.  
     - *Hand to human if:* Disagreement exists on what constitutes "trust" (e.g., marginalized groups distrust service allocation).  

  #### **PHASE 3: TRUST PRESERVATION (Guard Against Debasement)**  
  5. **Would honoring this proposal *dilute* existing scrip value?**  
     - *Sufficient answer:* Simulation showing no delay in existing redemption queues or material shortages.  
     - *Terminate/refuse if:* New issuance exceeds 5% of total circulating scrip without capacity expansion.  

  6. **Does it avoid *permanent alienation* of service capacity?**  
     - *Sufficient answer:* Services are non-transferable (e.g., can’t resell "road repair ticket" to a speculator).  
     - *Hand to human if:* Ethical trade-offs (e.g., allowing elderly to transfer repair credits to family).  

  ---

  ### **Application to Current Proposals**  

  #### **Proposal 1: Back scrip with undeveloped municipal land**  
  - **Step 1:** Land is not "tangible service/labor." *→ Terminate/refuse.*  
  - **Step 3.1 (Collateral):** Land doesn’t enable *current* services. Value is speculative. *→ Terminate/refuse.*  
  - ***Why staff won’t welcome this:*** Rejects politically convenient "asset backing" violating Berkeley’s rule that tokens must track *active* capacity.  

  #### **Proposal 2: Emergency redemption for climate-adaptation labor**  
  - **Step 1:** Concrete services (e.g., "sandbagging," "drainage clearance") identified. *→ Proceed.*  
  - **Step 2:** Labor pool uncertain. *→ Hand to human officer.* **Judgment required:** Officer must define "available" (e.g., "Can recall off-duty crews?") or impose redemption limits.  
  - **Step 4:** Citizens’ assembly divided on priorities. *→ Hand to human.* **Judgment required:** Officer must either defer to assembly (requiring consensus) or impose temporary hierarchy (e.g., "life-saving first") based on charter.  
  - **Step 5:** If emergency issuance occurs, cap at 3% of total scrip to limit dilution.  

  ---

  ### **Where Simplification Risks Distorting Berkeley**  
  - **Token vs. Value:** The procedure treats service capacity as binary ("available/not"), but Berkeley saw money as a *social agreement* on value. Simplified metrics (e.g., "90% capacity") may miss shifting public trust.  
  - **Human Judgment Flags:** Steps 4 and 6 require officers to weigh community trust—the "convention" Berkeley deemed essential. No formula can replace deliberative democracy here.  
  - **Anti-Hoarding Mechanism:** Berkeley’s focus is on issuance discipline, but hoarding is mitigated procedurally by:  
    - Non-transferable redemptions.  
    - Expiration dates on issued scrip (e.g., 12 months).  

  This procedure enforces Berkeley’s core: scrip is a *call option on municipal action*, not a store of value. Reject anything requiring faith in unrealized futures.
