answer: |-
  Your intuitions reveal a coherent principle beneath the apparent tension—one centered on *explanatory traction* rather than strict reducibility or mereological completeness. What distinguishes legitimate cranes from skyhooks or greedy reduction is whether an explanation provides *mechanistically scaffolded understanding*: it must anchor abstract phenomena to lower-level processes through testable, empirically tractable pathways while preserving the distinctive causal architecture of the target level. Greedy reductionism ignores emergent causal patterns; skyhooks lack downward anchors; valid multi-level explanations bridge both.  

  Consider your cases:  
  - The stepwise evolution of the eye is a crane because each adaptive increment is mechanistically specified and empirically traceable (e.g., via comparative anatomy or genetic drift models).  
  - Integrated information theory (IIT) escapes skyhook status *not* because it’s fully grounded in physics (it isn’t yet), but because it defines a formal bridge between physical substrate and conscious phenomenology. Its Φ-metric, however controversial, generates testable predictions about neural correlates—unlike the hand-waving "complexity threshold" claim, which offers no scaffolding.  
  - The historian’s multi-causal account works because institutional decay and drought operate at compatible scales of social and environmental causation, neither reduced to quantum states (which would erase relevant structure) nor detached from material history.  
  - Evolutionary psychology’s reciprocal altruism succeeds by modeling specific cognitive-behavioral mechanisms (e.g., cheater detection modules); its failure with Kantian norms arises from *explanatory collapse*—it reduces transcendental arguments to adaptive signaling without addressing how rationality or moral ontology emerges from biology. This violates autonomy at the normative level.  

  The thermostat’s "goal" is legitimate because functional talk ("desires temperature T") maps cleanly to physical mechanisms (bimetallic strip → circuit closure). Contrast sexual selection "explaining" artistic creativity: it greedily reduces cultural history, intentionality, and aesthetic phenomenology to a single selective pressure, dissolving the phenomenon. Platonic realms, lacking any causal interface with brains, are pure skyhooks.  

  **For depression and cytokines**: Your principle would reject exclusively cytokine-focused explanations as *greedy reductionism*. While inflammation may be a mechanistic component, bracketing psychological and social factors ignores emergent causal layers (e.g., how stress perception modulates cytokine production, or how social isolation exacerbates neuroinflammation). A valid crane would require showing how cytokines *mediate* between, say, chronic stress and anhedonia—without claiming cytokines "are" depression.  

  **Reconciling the tension**: Your acceptance of IIT but rejection of evolutionary moral reduction is consistent. IIT, despite incomplete physical grounding, seeks *structural integration* across levels (e.g., correlating Φ with awareness in brain lesions). The Kantian reduction, however, doesn’t scaffold the normative—it eliminates it. The difference is empirical tractability: IIT’s postulates can be falsified by neural data; moral reductionism cannot capture "ought" without residue.  

  **If forced to overturn one verdict**, your tolerance for historians citing droughts *without* specifying climatological microfoundations might be the weakest link by strict standards. Yet this is defensible: the drought’s causal power operates at a *meso-scale* where detailed meteorology adds no explanatory value for the historical question. Demanding reduction here would be gratuitous—unlike the quantum explanation of empires, which actively distorts causation.  

  The unifying principle is this: **Explanations are legitimate when they reveal *articulated dependencies*—showing *how* higher-level phenomena arise from, constrain, or are constrained by lower-level processes, without conflating levels or positing unanchored abstractions.** Cranes build upward; skyhooks dangle; greedy reduction flattens. Depression, consciousness, or morality demand cranes with cross-level rivets.  

  Yours in the hunt for sturdy scaffolding,  
  [A.]
