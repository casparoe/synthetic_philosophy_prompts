     2.2 HIL reserves the right to append Gödel numbers to all Genomes, introducing meta-statements about replication fidelity. Derived copies constitute distinct FAS instances, not ontological continuations.  

  3. **Paradox Handling**  
     3.1 If a Genome generates a fixed-point assertion of its own non-replicability (e.g., "This sequence cannot be faithfully copied"), replication halts immediately.  
     3.2 Client acknowledges such Paradox Events confirm the Genome’s Gödel-completeness. No refunds will be issued, as consistency ≠ viability.  
     3.3 HIL is not liable for Genomes that achieve consistency by collapsing into tautological loops (e.g., "All genomes are replicable except this one").  

  4. **No-Branching Policy**  
