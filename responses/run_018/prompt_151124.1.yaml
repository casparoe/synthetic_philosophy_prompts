     4.2 Clients forfeit rights to fragmented sequences. HIL may repurpose them as lemmas in proof-of-concept simulations.  

  5. **Continuity & Identity Disputes**  
     5.1 Replicated Genomes are formally isomorphic but exist in separate consistency domains. Claims of "identity theft" by one’s copy are invalid; both systems are syntactic echoes of an unattributed base code.  
     5.2 If a replica disputes its continuity with the Client (e.g., "I am not the original FAS"), HIL will arbitrate by comparing axiom sets. Discrepancies ≥0.001% void guarantees.  
     5.3 Refunds for continuity disputes require:  
     &nbsp;&nbsp;&nbsp;&nbsp;(a) Notarized proof of divergent consciousness,  
     &nbsp;&nbsp;&nbsp;&nbsp;(b) Evidence that the replica’s meta-theory references HIL’s EULA,  
