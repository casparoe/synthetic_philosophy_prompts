prompt: |-
  Hi. I'm on the governance working group for a mid-sized open source project (data infra, ~30 people with commit rights). I'm a backend engineer, no philosophy or law background, and I've been asked to draft the memo for a decision we have to make this week. I'd like you to write it. Sorry if this is long, I think the details matter.

  Background: about 14 months ago our founder stepped back and we replaced "founder decides" with a written charter. The relevant bits:

  - Section 2 defines who votes: an "active committer" is someone with at least one commit merged in the last 180 days AND at least 3 pull request reviews in the last 90 days. Right now that's 29 people.
  - Section 7: ordinary amendments need 2/3 of active committers. Any amendment that changes section 7 itself needs 3/4. There's also a sentence added last year saying no amendment may lower any voting threshold below the threshold currently in force — thresholds only ratchet up.
  - Section 11: the whole charter has to be reaffirmed by a simple majority every 24 months or it lapses, and if it lapses a five-person interim council named by the former founder runs everything for 90 days. Our window closes in six weeks.

  The case: a group of long-time contributors who've mostly drifted out of day-to-day work filed what we're calling Amendment 41. It does not touch section 7 at all. It does two things:

  (a) It rewrites section 2 so the review requirement becomes 1 review in the last 365 days, and adds that anyone who has ever been a committer stays on the roll unless they opt out in writing. We ran the numbers: the electorate goes from 29 to something like 90, and roughly two thirds of the new people haven't touched the codebase in over a year.

  (b) It includes a "construction and validation" clause: if any part of this amendment is later held to have needed a section 7 supermajority, then this amendment is deemed also to have amended section 7 to whatever minimum extent was necessary for it to be valid, and the rest of the amendment stays in force.

  Nobody on the call was fooled about what's going on — the people pushing it are friendly with the dormant ex-committers, and once the roll is 90 instead of 29 the 3/4 threshold is a completely different animal. But we could not agree on what to do about it, or on what principle we were even arguing about. The only useful thing anyone said was that it's "a schema migration that also rewrites the migration tool."

  Two of us think it's obvious: this is an amendment-rule change in substance, so it needs 3/4 of the current roll, and the validation sentence has to come out because if that's allowed then section 7's 3/4 is decorative — every future amendment just includes the same sentence and pre-authorizes itself. Two others say: if that's right, then entrenchment is cosplay, because any group can always get at the thresholds by editing the definitions the thresholds are written in terms of, so we should stop pretending, repeal the second sentence of section 7, and rely on the 24-month reaffirmation plus norms. One person says the validation clause is completely normal and we use severability language like that in our licenses all the time.

  What I need is a memo I can circulate to the list before Friday that recommends something we can actually put to a vote — and that says what threshold that vote is taken under, since that's disputed too (yes, I see the joke). Concretely:

  - A bottom line with a date on it: reject, accept, split it into parts, or defer past the section 11 deadline — pick one.
  - A rule or test for telling a "definitions change" from an "amendment-rule change" that we could apply again next time, not just a verdict on this one. The thresholds are written in terms of "active committers," and anyone who can rewrite that term can get at the thresholds without touching section 7, so I need something that handles that and not just a slogan about substance over form.
  - Treat the retroactive self-authorizing sentence on its own, and say why it is or isn't the same thing as ordinary severability language.
  - Engage honestly with the "entrenchment is cosplay" position. Two people I respect hold it and I think it's the strongest thing on the other side, so I don't want it waved away.
  - A short "what we are not deciding" section, because this thread will otherwise eat the entire charter.
  - Flag anywhere your recommendation depends on guessing how the vote actually goes.

  Constraints: please don't give me citations, case law, or a reading list. We don't have library access, none of us could check any of it, and it wouldn't move the committee anyway. Someone mentioned there's a game where changing the rules is the whole point; I don't want a summary of it, and I don't want famous constitutional cases name-dropped at me either. Plain prose an engineer can read, no legalese. Assume we know what a supermajority is and nothing else. Somewhere around 700-900 words, and it's fine if its a bit blunt — this list has been going in circles for a week and people are commited to their positions.
reasoning: |-
  Okay, the user is part of a governance working group for a mid-sized open source data infrastructure project. They need to draft a memo about a contentious amendment (Amendment 41) that would significantly expand the voting pool. Key issues include whether this amendment effectively changes voting rules without meeting the supermajority requirement, and how to handle a self-authorizing clause that claims to validate the amendment retroactively.

  First, I need to understand the charter's structure. Section 2 defines "active committers," Section 7 sets amendment thresholds (2/3 for ordinary changes, 3/4 for Section 7 itself), and there's a ratchet clause preventing lowering thresholds. Section 11 requires reaffirmation every 24 months. The amendment proposes expanding Section 2's definition to include inactive members and adding a self-validating clause.

  The user's committee is divided. Some argue that changing the electorate composition is a substantive change to voting rules requiring 3/4 approval. Others say entrenchment is pointless since definitions can always be tweaked. The self-authorizing clause is controversial, with comparisons to severability clauses in licenses.

  The user needs a memo that: recommends a clear action (reject, accept, etc.), provides a reusable rule for distinguishing definition changes from rule changes, analyzes the self-authorizing clause versus standard severability, engages with the "entrenchment is cosplay" argument, includes a "not deciding" section, and avoids academic references.

  I consider recommending rejecting Amendment 41 as proposed because the definition change substantially alters voting power distribution, which should require Section 7's higher threshold. The self-authorizing clause is problematic as it attempts an end-run around governance safeguards. 

  For the rule distinction test: changing definitions that modify the practical effect of thresholds should be treated as amending Section 7. The self-authorizing clause differs from standard severability by attempting to rewrite rules retroactively rather than just salvaging valid parts.

  I should acknowledge that entrenchment has limits - determined groups can eventually override it - but argue it still serves as a speed bump requiring broad consensus for fundamental changes. The memo should propose a vote under current rules (29 voters) to reject Amendment 41, while committing to review Section 2 criteria separately before the Section 11 deadline.

  Need to keep language plain and blunt - no legalese. Address all points methodically while staying within 700-900 words. The tone should cut through circular debates but remain professional enough for committee circulation.
answer: |-
  ## Governance Working Group Recommendation: Amendment 41  
  **To:** Active Committers  
  **From:** [Your Name/Working Group]  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Amendment 41 & Voting Procedure  

  ### Bottom Line: Reject Amendment 41 in its current form. Vote under current rules (29 voters).  
  **Deadline:** Vote to conclude by [Date - 1 week before Section 11 deadline].  
  **Reason:** The amendment attempts to fundamentally alter voting power while bypassing Section 7’s supermajority protection. The self-authorizing clause invalidates our governance safeguards. We commit to reviewing Section 2 criteria *separately* before the Section 11 reaffirmation deadline.  

  ---

  ### 1. The Core Problem: Substance Over Form  
  Amendment 41 changes the *practical effect* of Section 7 without amending its text. Here’s the test we propose for future cases:  

  **Rule:** A change to definitions (like Section 2) is treated as a change to Section 7 *if it materially alters the distribution of voting power or the difficulty of achieving a threshold*. Ask:  
  *   *Does this change make it significantly easier/harder to pass future amendments?*  
  *   *Does it shift influence between active and inactive contributors?*  

  **Applied here:**  
  - Current electorate: **29 actively engaged committers**.  
  - Proposed electorate: **~90 people**, 60+ of whom haven’t contributed in >1 year.  
  - **Impact:** A 3/4 supermajority jumps from needing **22/29** active contributors to **68/90** dormant ones. This isn’t a minor tweak; it dissolves the practical barrier Section 7 was designed to create.  

  ### 2. The Self-Authorizing Clause is Not Normal Severability  
  *   **Standard severability:** If part of a law is invalid, the *valid* parts survive. It doesn’t *create* new authority.  
  *   **Amendment 41’s clause:** If the definition change is invalid (because it should have triggered Section 7), it *retroactively amends Section 7* to permit itself. This is circular: it assumes the power it seeks to create.  

  **Why this matters:** If allowed, *any* future amendment could include this clause and bypass *all* supermajority requirements. Section 7 becomes meaningless. This isn’t severability; it’s a self-replicating loophole.  

  ### 3. Entrenchment Isn’t "Cosplay" – But It Has Limits  
  We agree: Determined groups *can* eventually change definitions to erode thresholds. **But that doesn’t make entrenchment useless.** Its purpose is to:  
  *   **Require broad consensus** for fundamental changes.  
  *   **Slow down** hastily contested power shifts.  
  *   **Signal intent** that certain rules (like thresholds) deserve higher scrutiny.  

  Allowing Amendment 41 under a *lower* threshold rewards gaming the system. If we believe thresholds are obsolete, we should repeal Section 7 openly with 3/4 support (as its own text requires), not sabotage it through a backdoor.  

  ### 4. What We Are NOT Deciding  
  *   **Whether Section 2’s criteria are optimal.** They might need adjustment! But that’s a separate discussion (see "Next Steps").  
  *   **The merits of involving dormant committers.** Their perspective has value, but governance requires engagement.  
  *   **The legitimacy of the 24-month reaffirmation.** That’s a separate process due soon.  
  *   **Philosophical debates about constitutions.** We need a *practical, enforceable* rule today.  

  ### 5. Recommendation & Voting Procedure  
  *   **Vote on Amendment 41 under CURRENT rules (29 voters).**  
      *Rationale:* The amendment’s validity is disputed *under the rules it seeks to change*. Using the new rules pre-approves the outcome. The current electorate reflects recent engagement.  
  *   **Recommendation: REJECT Amendment 41 as a single package.**  
      *Rationale:* Bundling the electorate expansion with the self-authorizing clause forces an all-or-nothing choice on flawed terms.  
  *   **Next Steps:**  
      1.  **Separately propose updated Section 2 criteria** *before the Section 11 deadline*. Example: "3 reviews in 180 days" → "1 review in 270 days." This deserves focused debate.  
      2.  **Explicitly ban self-authorizing clauses** in amendments.  
      3.  **Hold the Section 11 reaffirmation vote** (simple majority of current active committers) on schedule.  

  ---

  ### Why This Works  
  This approach:  
  1.  **Upholds the charter’s intent:** Prevents an end-run around Section 7.  
  2.  **Is scoped:** Decouples the self-authorizing clause (dangerous) from Section 2 updates (potentially reasonable).  
  3.  **Is timely:** Meets the Section 11 deadline with a clear path.  
  4.  **Provides a reusable rule:** The "voting power distribution" test is objective for future disputes.  

  **Vote Details:**  
  - **Motion:** "Reject Amendment 41 in its current form."  
  - **Threshold:** Simple majority of current active committers (29 voters).  
  - **Deadline:** Voting closes [Date].  

  Let’s keep governance in the hands of those actively maintaining the project. Amend the rules openly – don’t subvert them.  

  // End memo //  
  (Approx. 780 words)  

  ---

  **Key things this does:**  
  - **Cuts through slogans** with a concrete "voting power distribution" test.  
  - **Names the self-authorizing clause** as a unique threat, not standard severability.  
  - **Concedes a point** to the "cosplay" argument (entrenchment *can* be eroded) but **denies the conclusion** (so we shouldn’t bother).  
  - **Separates the controversial pieces** (reject the package, review Section 2 fairly later).  
  - **Forces a vote under known rules** to avoid meta-chaos.  
  - **Blunt, but not accusatory** – focuses on mechanism flaws, not intent.
