answer: |-
  This is a genuinely exciting angle—not just novel but textually grounded. You're tapping into something underappreciated: the School of Names wasn't *just* playing with words; they were probing how property-combinations generate new ontological units with distinct criteria. Let's break down your questions:

  ### 1. Determinable/Determinate Framing & Textual Fit
  **Illuminates, with caveats:**  
  The determinable ("horse" – shape/form) vs. determinate ("white horse" – fused shape+color) distinction **works remarkably well** for Gongsun Long's core arguments:
  - **"Horse" is indeterminate w.r.t. color:** Seeking a "horse" permits *any* color (yellow/black horse satisfies). "White horse" fixes color as essential to satisfying the request. *This is explicit in the dialogue.*
  - **The "cannot substitute" argument:** You *cannot* fulfill a request for a "white horse" with a "horse" (since the latter might be yellow). This mirrors your breeding example: color becomes criterial. The dialogue directly uses "seeking" (求) contexts to show this.
  - **The "loss" argument:** If you have 100 horses, you cannot say you have 100 white horses. The properties are not merely additive; "white-horse" is a fused entity counted differently.

  **Where it might distort / needs care:**
  - **Avoid implying "bare particulars":** The School isn't positing "horse" as a substratum. "Horse" itself *is* a determinable (shape/form), not a "thing" awaiting properties. Your "bare kind-determinable" phrasing is good, but clarify it's *also* a property cluster (form), just broader.
  - **Focus on "satisfaction conditions":** Gongsun Long's arguments are often pragmatic: What satisfies a request or a count? The determinable/determinate frame shines here. "Horse" has broader satisfaction conditions than "white horse." This is textual and avoids over-ontologizing.

  **Verdict:** **Use it!** It clarifies *why* "white horse ≠ horse" is more than a set/subset relation. Emphasize how fusion creates a *new satisfaction criterion*. Cite: "Horses certainly have color. Therefore, there are white horses... If horses were without color, there would simply be horses, and how could one get white horses?" (This shows color is *integral* to the compound).

  ### 2. Framing the Jian Bai (Hard & White) Connection
  **The Strong Link:** Both dialogues explore **property co-location and its ontological consequences.** "Jian Bai" asks: Are hardness and whiteness *in* the stone as fused properties, or do they exist independently?
  - Gongsun Long argues they are **separately real and perceivable only discretely** (sight sees white, touch feels hardness). The stone is merely the *locus* of their co-occurrence.
  - This directly parallels the "White Horse" focus: "Horse" (form) and "White" (color) are distinct properties whose combination creates a new entity ("white horse") with specific identity conditions.

  **How to Frame Without Overclaiming:**
  - **Don't say:** "Jian Bai proves property fusion changes identity conditions." (It focuses more on property *independence*).
  - **Do Say:** "The 'Jian Bai' dialogue reveals the School's deeper concern: **how multiple properties simultaneously inhere in a single object without losing their distinct identities, and what this implies for naming/reference.** This preoccupation with property combination and individuation provides the metaphysical context for understanding why 'white horse' cannot be reduced to 'horse' in the earlier dialogue. Both explore the **logic of co-present properties** and challenge naive assumptions about objects as simple property-bundles."
  - **Key Insight:** "Jian Bai" shows properties are **real constituents** that don't fuse into a blob. This supports your reading of "white horse": "white" isn't absorbed into "horse"; it remains a distinct, essential property within the compound term, altering its reference. The focus is on the *status of the properties themselves* when combined.

  **Verdict:** Frame it as **shared metaphysical inquiry into property co-presence**, showing the "White Horse" is a specific application concerning *naming/reference* under property combination, while "Jian Bai" tackles the *nature* of the properties themselves when combined. This avoids overclaiming essentialism for "jian bai" while showing the conceptual link.

  ### 3. Overall Interest & Risk of Anachronism
  **This is INTERESTING and NOT FORCED.** You're highlighting an aspect often missed: **the School wasn't *just* nominalist; they were investigating the ontology of property combination and its consequences for identity and reference.**

  **Why it works & avoids anachronism:**
  1.  **Text-Driven:** You're building on explicit arguments in the dialogues:
      *   The substitutability failure (can't swap horse for white horse).
      *   The counting difference (100 horses ≠ 100 white horses).
      *   The "seeking" context defining criteria.
      *   The independence of properties in "jian bai".
  2.  **Proto-Sortal Essentialism?** Yes, but carefully! They aren't Aristotle. Call it **"contextual identity essentialism"** or **"criterial essentialism."** For the *purpose of naming, counting, or fulfilling a request*, the fused property set ("white horse") has essential criteria derived from *all* its constitutive properties. "Horse" alone lacks the color criterion. This is *situational* essentialism driven by language/purpose, not inherent to the object's eternal nature. **This nuance is crucial.** Cite A.C. Graham: they were analyzing "the relation of names to the actualities they name" within specific contexts.
  3.  **"Sticky" Properties:** Your term "sticky" is apt. Once combined in the compound name ("white horse"), color becomes inseparable *for the purpose of that term's application*. This is precisely what the dialogue demonstrates.

  **Guarding Against Anachronism:**
  *   **Avoid:** "Universals," "Particulars," "Bare Particulars," "Tropes" unless carefully defined in ancient Chinese context. Stick to their language: "name" (名 *míng*), "form/shape" (形 *xíng*), "color" (色 *sè*), "hard" (堅 *jiān*), "white" (白 *bái*), "actualities/things" (實 *shí*), "seeking" (求 *qiú*).
  *   **Emphasize Pragmatics:** Their arguments are often grounded in *use*: naming, counting, seeking. This anchors your "fused determinable" in their world.
  *   **Qualify "Essentialism":** Stress it's about *identity conditions for reference within a linguistic/situational context*, not metaphysical essence. They were logicians of naming, not metaphysicians of substance.

  ### Structural Accuracy & Key Textual Hooks
  You've grasped the structure. Reinforce with:
  1.  **The Opening Move:** "Horse" names the form/shape; "White" names the color; "White Horse" names the form *and* the color. (白馬非馬... 馬者，所以命形也；白者，所以命色也。命色者非命形也).
  2.  **The Core Argument:** Seeking a horse ≠ seeking a white horse (求馬，黃、黑馬皆可致；求白馬，黃、黑馬不可致). This is your "swapping" point.
  3.  **The Counting Argument:** "Horses" include yellow/black; "White horses" do not. Therefore, white horses ≠ horses (馬固有色，故有白馬。使馬無色，有馬如已耳，安取白馬？故白者非馬也。白馬者，馬與白也). This directly supports fused criteria.
  4.  **Link to Jian Bai:** Recall the argument in "Jian Bai" that hardness and whiteness are not *in* the stone in a fused way; they are separate and perceived separately, with the stone merely being their location (視不得其所堅而得其所白者，無堅也；拊不得其所白而得其所堅者，無白也). This reinforces the *distinct reality of properties* that your fusion theory relies on – "white" in "white horse" retains its distinct identity as a property, contributing to the new compound identity.

  ### Recommendation
  Run with this! It's insightful and defensible. Structure your essay:
  1.  Standard universal/particular reading (briefly).
  2.  Its limitations (ignores the *fusion* and *criterial change*).
  3.  Your thesis: Property fusion creates new ontological units with distinct identity/reference conditions.
  4.  Analysis of "White Horse" arguments using determinable/determinate & satisfaction conditions.
  5.  Contextualization within School of Names via "Jian Bai" (property co-presence/reality).
  6.  Conclusion: Proto-criterial-essentialism for compound names; significance for Chinese logic.

  This angle revitalizes the dialogue and connects it directly to the School's core concerns. Just consistently tie your metaphysical language back to their textual arguments about naming and use. Good luck!
