  I take the view that genuine moral dilemmas are possible, but only in an asymmetrical, structurally fractured form: a single act can be simultaneously required and forbidden not because two obligations of comparable weight collide, but because incommensurable normative sources—say, a deontological prohibition on deception and a consequentialist duty to preserve life—generate conflicts that resist reduction to a common metric or resolution by a higher-order principle. On this account, post-decisional moral residue is not merely psychological regret over an unchosen wrong, but evidence that the normative order itself contains an unreconciled fracture the agent must navigate without full rational closure. What would genuinely count against this position? I want the defeaters ranked by severity: fatal if they show that incommensurability collapses into hidden commensurability or that asymmetry dissolves the conflict; awkward if they explain residue through epistemic uncertainty or emotional discomfort alone. Which arguments about practical reason, conceptual analyses of 'ought' and 'can', or observations about ordinary moral judgment should move a defender to concede defeat, and which would they dismiss as misreading the structural claim? Rank them from fatal to merely awkward, and end with a one-line summary of the view's deepest exposure, formatted as \answer{...}.
