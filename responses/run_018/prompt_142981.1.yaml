answer: |-
  Here’s a strict specification for any theory of music’s metaphysical status, built from your constraints and Schopenhauer’s core claim:

  **Desiderata for a Theory of Music’s Metaphysical Status:**

  1.  **D1: Directness without Naïve Immediacy:**  
      *   **Must Deliver:** Account for music's profound, *seemingly* unmediated affective power (Schopenhauer's "direct objectification of Will") without positing literal bypass of cognitive/perceptual processing.  
      *   **Motivating Case/Tension:** Schopenhauer's intuition that music feels "closer to the Will" than other arts. **Tension with D3:** How can it be "direct" if predictive processing is fundamental?

  2.  **D2: Distinction between Programmatic & Absolute Music:**  
      *   **Must Deliver:** Explain the phenomenological and functional difference between music representing external narratives/objects (program music) and music appreciated as abstract pattern (absolute music), without reducing one to the other.  
      *   **Motivating Case/Tension:** Beethoven's *Pastoral* (program) vs. his late string quartets (absolute). Why does one evoke specific imagery while the other evokes profound but non-representational feeling? **Tension with D1 & D4:** If music is "direct Will," why would extra-musical association matter? If all music works via expectation violation (D4), why the distinction?

  3.  **D3: Compatibility with Predictive Processing:**  
      *   **Must Deliver:** Integrate the neuroscience of auditory perception – specifically, that the brain generates hierarchical predictions about incoming sound and registers prediction errors. Music perception *is* this active, expectation-driven process.  
      *   **Motivating Case/Tension:** The "surprise" in a deceptive cadence or rhythmic displacement is neurologically quantifiable. **Tension with D1:** This inherently involves *mediation* by predictive models, contradicting pure immediacy. **Tension with D4:** Predictive processing *is* the mechanism for expectation/violation.

  4.  **D4: Efficacy of Expectation-Violating Music:**  
      *   **Must Deliver:** Explain why music that systematically violates learned tonal/rhythmic expectations (e.g., Schoenberg's atonality, Ligeti's micropolyphony, harsh noise) can still elicit powerful, often deeply moving, affective responses.  
      *   **Motivating Case/Tension:** The visceral impact of Berg's *Wozzeck* or Penderecki's *Threnody*, despite shattering conventional expectations. How does this square with predictive processing (D3) which relies on *some* model? **Tension with D2:** Can program music violate expectations *differently* than absolute music?

  **Schopenhauer's View vs. the Spec:**

  *   **D1:** **Excels.** His core strength – music *is* the direct copy of the Will's movements.
  *   **D2:** **Fails.** Struggles significantly. He tries to map musical elements (melody, harmony, bass) to Will's hierarchy, making absolute music primary. Program music is seen as a diluted, impure attempt to "illustrate" what music already embodies directly. Fails to explain their distinct *experiences*.
  *   **D3:** **Fails.** Pre-scientific. His "directness" explicitly *denies* the kind of cognitive mediation predictive processing describes. No account of learned expectations or prediction errors.
  *   **D4:** **Partial Credit.** His view *could* accommodate it – dissonance/atonality might reflect more turbulent or chaotic grades of the Will's objectification. However, he strongly privileged consonance and diatonic harmony as reflecting the Will's more fundamental grades, making sustained dissonance problematic. Doesn't explain *why* chaotic Will-objectification is affectively potent.

  **Modern Embodied Cognition Account (Brief Status):**

  *   **D1:** **Reinterprets "Directness."** Rejects metaphysical Will. Posits music directly engages the *embodied affective system* via sensorimotor contingencies, entrainment, and physiological resonance (e.g., heart rate, breathing, motor cortex activation). Feeling *is* the processing. Less "direct to Will," more "direct to body/affect."
  *   **D2:** **Handles Well.** Program music leverages simulation – activating neural systems for action, imagery, and narrative. Absolute music primarily engages abstract pattern processing, dynamic tension/release, and raw sensorimotor/affective loops. The mechanisms overlap but have distinct emphases.
  *   **D3:** **Core Foundation.** Predictive processing *is* the embodied/cognitive mechanism. Music exploits our predictive brains – confirming, violating, and updating expectations at multiple hierarchical levels (acoustic feature, rhythm, harmony, form). The resulting prediction errors and precision-weighting *are* the source of affect and meaning.
  *   **D4:** **Strong Handle.** Expectation violation *is* affectively potent (prediction error = arousal/attention). Dissonance/atonality works by:
      *   Violating learned *tonal* expectations, creating tension.
      *   Establishing *new*, internal structural expectations within the piece itself (a new "grammar").
      *   Engaging lower-level, biologically salient features (e.g., roughness, intensity, temporal unpredictability) that directly modulate arousal and valence.
      *   It’s not about *no* expectations, but about *violating specific learned schemas* while still engaging predictive machinery at other levels or establishing new patterns to predict.

  **Summary Tensions:** The core tension lies between **D1 (Directness)** and **D3 (Predictive Processing Mediation)**, demanding a non-naïve account of immediacy. **D4 (Violation Efficacy)** also challenges simple readings of **D3** (predictive processing isn't just about confirming expectations) and **D2** (absolute vs. programmatic violation). Modern accounts resolve these by grounding "directness" in embodied affect emerging *from* predictive processing, not bypassing it.
