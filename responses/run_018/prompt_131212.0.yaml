  Turn this into a real proposal: state the precise question, explain why the usual functionalist positions don't already answer it, outline the method (I'd compare quorum-sensing pathway models to a stripped-down functionalist schema, probably over a few months), say what a positive or negative result would actually look like, and be honest about whether this is too ambitious for one semester. Also say what would count as the project failing. No need for citations or reading lists, I'll fill those in myself.

  Please keep the whole thing under 350 words -- one page max. And don't include a bibliography section.
