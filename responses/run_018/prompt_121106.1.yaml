  I need a toast for my dad's retirement dinner. He ran a letterpress shop for 32 years, and now it's all digital templates — he literally trained the software that replaced his crew. Half the room are family who think work is just 'what pays the bills,' the other half are labor historians and a coupple philosphy grad students who will roll there eyes if I romanticize craft labor. I want to talk about what work actually meant for him without claiming he was 'fulfilled by labor' (he'd laugh) or that automation is pure progress (he'd wince). Can you write a five-minute toast built around the idea that work isn't mainly income or self-expression, but the way physical effort leaves a visible trace you can point to and say 'that shape exists because I pushed'? Make that idea do real structural work — it should explain why he kept every misprinted run he salvaged, and why the new system feels like a kind of disappearance even though its more effcient. Keep it warm, not a lecture. And please, don't quote Marx or anyone with page numbers — I don't want to sound like I'm doing homework.
