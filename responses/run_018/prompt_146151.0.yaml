  Okay, let me unpack this user's request. They're in a heated neuroscience-philosophy debate with their roommate and want a structured 40-minute teaching plan for the causal exclusion argument. The key challenges are: making complex philosophy accessible to a non-specialist, anticipating misconceptions, and avoiding clichéd examples that might trigger eye-rolling. 

  First, I need to prioritize clarity over comprehensiveness. The user specifically wants five tight steps - no intros/outros, no citations. They're clearly frustrated with their roommate's reductionist stance ("brains do stuff") and slime mold analogies, so the plan must surgically address that without getting sidetracked.

