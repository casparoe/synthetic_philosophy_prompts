  Biggest trap is the roommate likely conflating mental causation with epiphenomenalism (the "smoke" misconception). Need to front-load that clarification in Step 3 before introducing overdetermination. Also must emphasize why this threatens *all* mental causation - not just decisions, but beliefs/intentions too.

  What to cut? Yablo's determinables would overcomplicate things. Same with compatibilist replies. Focus stays on why causal exclusion creates a dilemma: either redundancy or disappearance of mental causes. The check question ("why threatened not just redundant?") is crucial - it forces recognizing the argument isn't denying neural correlates but questioning causal *efficacy*.

  Structure-wise: Closure first (her favorite point), then sufficiency to set up the conflict, then BOOM - the exclusion dilemma. Save downward causation rebuttal for last since she's obsessed with slime molds. Example must show why "levels" don't automatically solve the problem. 

