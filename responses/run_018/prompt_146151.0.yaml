answer: |-
  Here's the teaching plan:

  1.  **Start with physics' causal closure:** Explain that every physical effect has a sufficient physical cause right then and there – nothing outside physics is needed to make the physical stuff happen (e.g., "When your thumb moved, all the muscle contractions and nerve signals causing it had purely physical triggers"). This is her starting point; build from it.
  2.  **Introduce mental causation & sufficiency:** State that when you decided to text, a mental event (your conscious choice) seemed to cause your thumb moving. Emphasize that this mental event *also* seems sufficient to cause the action. Use the **carrying action** example: "Imagine you *decide* to carry a heavy box to help a friend. Your decision (mental) seems sufficient to cause the box moving (physical). This feels true, right?"
  3.  **Clarify the threat (Not Epiphenomenal Smoke):** Preemptively cut off the "smoke" misconception: "This isn't about mental stuff being useless smoke *separate* from the brain. The argument assumes your decision *is* your brain state (or depends entirely on it). The problem is about *causal power* – does the mental property *itself* actually *do* the causing?" This prevents her mislocating the issue.
  4.  **Present the exclusion dilemma:** Explain that if the physical state (P) is sufficient for the effect (thumb move/box carried), and the mental state (M) *is* that physical state (or depends on it), then citing M as a cause seems redundant. Ask: "If P alone is already enough, what extra causal work does M *add*? Either M is just P in disguise (so M isn't a *distinct* cause) or we have two sufficient causes for one effect – **overdetermination** (like two shooters killing one victim). But constant overdetermination for every action seems absurd." Emphasize this forces a choice: deny M causes anything or accept weird overdetermination.
  5.  **Address downward causation & the check:** Briefly counter her slime mold point: "Downward causation (like cells coordinating) still relies on lower-level physical mechanisms – the cells *are* the physical stuff. It doesn't show how a *non-physical mental property* adds causal power *over and above* the neurons firing." **Check Question:** "Why does the causal exclusion argument threaten the idea that your *decision itself* caused your thumb to move, rather than just showing that the brain does the work?" (Correct grasp: It argues the *mental aspect* of the decision isn't doing the real causal work, even if it's real).

  **Key Omissions:** Yablo's determinables, non-reductive physicalism details, compatibilist replies, historical context. Focus solely on the exclusion dilemma's structure.
