answer: |-
  Your frustration with the extended mind debate's cyclical nature is both warranted and insightful. The impasse isn't accidental—it stems from **fundamentally divergent commitments about the nature of cognition and ownership**, exacerbated by your stochastic AI case. Let's dissect the architecture of the stalemate and why your "unstable vehicle" challenge reveals its core fissures.

  ### The Hidden Architecture of the Impasse
  1. **Metaphysical vs. Normative/Explanatory Questions**  
     - **Clark/Chalmers (C&C)**: Address a *metaphysical-functional* question: "What systems fulfill the causal-functional role we label 'cognitive'?" Their parity principle is a *boundary criterion* for cognitive systems, agnostic to ontology. Reliability/accessibility/endorsement are *pragmatic enablers* of functional equivalence.  
     - **Critics (Adams & Aizawa, Rupert)**: Address a *normative-explanatory* question: "What makes a state *intrinsically mental* and *personally owned*?" They demand a mark of the cognitive (e.g., non-derived content) tied to biological wetware. For them, "cognitive" implies *first-person authority* and *causal unity*.

  2. **Your Stochastic Vehicle as a Litmus Test**  
     - **C&C's Response**: Functional equivalence *survives* instability. If the AI's probabilistic outputs reliably match Inga's recall profile (e.g., correct MoMA directions 95% of time, with similar error types), it satisfies parity. *Endorsement* (Otto trusting the output) bridges the "ownership" gap. The vehicle's instability is irrelevant; only input-output patterns matter.  
     - **Critics' Response**: Instability *breaks constitution*. Stochastic generation lacks:  
       - **Token-identity**: No persistent representational state to call "Otto's belief."  
       - **Non-derivative content**: Outputs are computed anew, not retrieved from a stored commitment.  
       - **Diachronic stability**: Beliefs require *enduring states*; a probability distribution isn't a belief.  
       *This exposes critics' implicit commitment to a "storage metaphysics."*

  ### The Core Disagreement: It's Substantive, Not Verbal
  - **Not Merely Verbal**: Both sides agree cognition involves information-processing but clash on **what confers "mental status."**  
    - C&C: Any process that *functions* as a belief/memory in a cognitive system.  
    - Critics: Only processes with *intrinsic* (biological) properties can host original intentionality.  
  - **Not Just Storage Metaphysics**: Critics reject functional equivalence *even for stable external tools* (e.g., Rupert's "glue and trust" critique). Your AI case intensifies this by removing stability—but the rift is deeper.

  ### The Bedrock: Two Intuitions About Ownership
  1. **C&C's Ownership**: Defined by *dispositional profile* and *agential endorsement*. If Otto automatically trusts the AI's output and it guides his actions like a belief, it *is* his belief. Ownership is *use-dependent*.  
  2. **Critics' Ownership**: Requires *direct causal control* and *phenomenal grounding*. A stochastic AI's output isn't "Otto's thought" but an *external suggestion* he approves. Ownership requires *internal instantiation*.

  ### Why Progress Stalls: Disciplinary Chasms
  - **Philosophy of Mind** (Critics): Seeks criteria for "real" mentality, rooted in consciousness/intentionality. Demands a bright line between biological and artificial.  
  - **Cognitive Engineering** (C&C): Treats cognition as a control problem solvable by distributed systems. Minds are *cybernetic assemblies*, not biological essences.  
  *Your AI case is a grenade here: it satisfies engineering criteria (functional role) but violates philosophical intuitions (token identity, intrinsicness).*

  ### Paths to Progress
  The debate won't move by refining old conditions. Breakthroughs require:

  1. **Formalizing Stochastic Coupling** (Most promising):  
     - Model the AI-human system as a *joint Markov decision process* or *predictive processing hierarchy*.  
     - Quantify "functional equivalence" via mutual information between AI outputs and the user's neural states (e.g., via fMRI/EEG during task execution).  
     - *Progress metric*: If stochastic coupling shows *lower prediction error* in brain-world loops than biological recall alone, it satisfies C&C's criteria empirically.

  2. **Empirical Test: Ownership Under Instability**  
     - Experiment: Subjects solve philosophical problems using (a) stable notes, (b) stochastic AI. Measure:  
       - Sense of ownership (self-reports, implicit measures)  
       - Behavioral reliance (e.g., betting on AI-generated beliefs)  
       - Neural correlates of "endorsement" (e.g., prefrontal activation patterns).  
     - *Prediction*: Critics expect attenuated ownership with stochastic tools; C&C predict equivalence if functionally integrated.

  3. **Conceptual Shift: Abandon "Parity" for "Complementarity"**  
     - Drop the doomed quest for functional *equivalence*. Embrace Sutton's "cognitive prosthetics" model: External tools *complement* biological cognition by doing what brains do poorly (e.g., probabilistic search).  
     - Your AI isn't "extended belief" but a *scaffold for constructing beliefs*. Ownership emerges when the agent *incorporates outputs into their cognitive workflow* (e.g., you revising AI drafts).  
     - *This dissolves the question*: "Is it in my head?" becomes "How do I *make it mine*?"

  ### Conclusion: Beyond the Ritual
  The impasse is **substantive**—a clash between functionalist metaphysics and biocognitive conservatism—but your stochastic case reveals the critics' hidden reliance on **storage metaphysics** as a proxy for "real mentality." Progress lies in:  
  - **Engineering stochastic systems** that achieve *robust functional integration* (measured empirically),  
  - **Empirically testing ownership dynamics**, and  
  - **Retiring parity for a complementarity framework** that better describes hybrid cognition.  

  The debate's fatigue signals not futility, but a need to shift from armchair criteria to *quantified human-tool symbiosis*. Your drafting practice isn't just a thought experiment—it's a lab for the next phase of the extended mind.
