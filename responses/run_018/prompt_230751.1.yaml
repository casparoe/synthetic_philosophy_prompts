prompt: |-
  Two members of my philosophy reading group have been arguing since September across two positions that never quite meet. One is a Quinean confirmation holist: every attempt to draw a boundary between analytic and synthetic sentences either presupposes the notion it is meant to explain or collapses into a surrogate such as entrenchment in a holistic web, and no sentence is in principle immune to revision. The other is a neo-Carnapian: the Quinean critique damages only an epistemically loaded, rationalist conception of truths knowable independent of experience, and it leaves a framework-relative notion of analyticity intact — once a language is set up with formation rules, meaning postulates, and inference rules, some sentences hold in virtue of the framework and can be recognized without consulting the course of experience. Each party believes the other keeps shifting between senses of the key terms. The Quinean suspects the neo-Carnapian of oscillating between an arbitrary conventional stipulation, which is real but uninteresting, and an epistemic privilege, which is interesting but unearned. The neo-Carnapian suspects the Quinean of banning any distinction that is not behavioral or epistemic while quietly relying on a graded notion of centrality among beliefs that is doing the same work as analyticity under another name.

  Draft the joint statement these two should have produced after a good-faith adversarial collaboration. Open with a numbered section of claims both can sign, about confirmation holism, revisability, meaning postulates, and what the original Quinean critique did and did not establish; the wording must be precise enough that neither side will later repudiate it as vacuous or slanted. Then write a disagreements table: for each residual issue, give the Quinean and neo-Carnapian formulations, each phrased so its own side would accept it as its considered view, and identify the crux on which the row actually turns. Next, address the cruxes directly. The statement should make genuine progress on at least three questions. First, when a recalcitrant observation leads a community to stop asserting a sentence, is the difference between changing a belief and changing the meaning of one of the terms a factual difference or a difference of description? Second, does an explicitly stipulated definition, or an inference rule that introduces and eliminates a newly defined logical connective, establish a kind of analyticity beyond the bare fact that the community has adopted a convention? Third, can the neo-Carnapian honestly deny that framework statements are themselves open to revision for pragmatic reasons while still explaining how the original Quinean critique could have missed the distinction? For each crux, specify a concrete test or case both sides would accept as genuinely bearing on it, record each side's prediction in advance, and finish by stating which components of the residual disagreement, if any, are verbal rather than substantive.
reasoning: |-
  We are drafting a joint statement in good faith after adversarial collaboration between a Quinean confirmation holist and a neo-Carnapian. The goal is to produce a document that both can sign, then a disagreements table, and then address the cruxes directly.

  ## Joint Statement (Agreed Claims)

  1. **Confirmation Holism and Revisability**: Both parties agree that the unit of empirical significance is not the individual sentence but the whole system of sentences (or a sufficiently large subset). Consequently, when faced with a recalcitrant experience, we have a choice of which sentences to revise. No sentence is in principle immune to revision; even the most central logical principles could be revised under extreme circumstances for pragmatic reasons. However, such revisions are typically highly disruptive and would only be undertaken as a last resort.

  2. **Quine's Critique of Analyticity**: The original Quinean critique (as in "Two Dogmas of Empiricism") successfully showed that attempts to define analyticity by appeal to synonymy (or meaning) either presuppose the notion they aim to define or collapse into behavioral or pragmatic notions (like entrenchment). Therefore, any notion of analyticity that relies on a prior, unexplained notion of meaning (as a non-behavioral, non-pragmatic entity) is untenable.

  3. **Framework-Relative Analyticity**: Within an explicitly defined linguistic framework (with stipulated formation rules, meaning postulates, and inference rules), there are sentences that are true (or valid) solely in virtue of these stipulations. These can be recognized without consulting the course of experience. The neo-Carnapian position is that this framework-relative analyticity is a legitimate notion, but it is relative to the framework and does not imply any epistemic privilege independent of the framework.

  4. **What Quine's Critique Did Not Establish**: Quine's critique does not rule out the possibility of having such framework-relative analyticity. It only rules out an absolute, framework-independent notion of analyticity that is supposed to be grounded in a non-pragmatic, non-behavioral notion of meaning. Moreover, Quine's critique does not rule out the use of meaning postulates or inference rules as part of a language framework. However, the Quinean insists that such meaning postulates are themselves subject to revision for pragmatic reasons, just like any other sentence.

  5. **Entrenchment and Centrality**: Both parties agree that in practice, some sentences are more central to our web of belief and are more resistant to revision. The Quinean calls this "entrenchment" and sees it as a matter of degree. The neo-Carnapian agrees that in natural language and scientific practice, there are sentences that are treated as definitional or as framework principles, and these are relatively entrenched. However, the neo-Carnapian maintains that in an explicitly defined framework, the meaning postulates and inference rules are not merely entrenched but are constitutive of the meanings of the terms.

  ## Disagreements Table

  | Residual Issue | Quinean Formulation | Neo-Carnapian Formulation | Crux of the Disagreement |
  |----------------|---------------------|---------------------------|---------------------------|
  | **Nature of Framework Statements** | Framework statements (like meaning postulates) are just highly entrenched empirical sentences that we have chosen to treat as fixed for the sake of convenience in a given context. They are revisable for pragmatic reasons, and their revision is a change of belief, not a change of meaning. | Framework statements are not empirical sentences but are rules that define the meanings of the terms. Revising them is not a change of belief but a change of language (or framework). The change is not driven by empirical evidence but by pragmatic considerations about which language to adopt. | Whether the adoption of a framework is a matter of changing beliefs (about the world) or changing the language (or conceptual scheme) in which we describe the world. |
  | **Analyticity Beyond Convention** | Explicit stipulations (definitions, meaning postulates) are mere conventions. They do not establish a special kind of truth (analytic truth) but only record a decision about how to use words. The resulting sentences are true by convention, but this is a trivial fact about our chosen notation. | Explicit stipulations do establish a kind of analyticity: they create sentences that are true solely in virtue of the meanings (as defined by the stipulations). This is not trivial because it allows us to separate framework-internal truths (which are analytic) from empirical claims (which are synthetic). | Whether the notion of "truth in virtue of meaning" (as arising from explicit stipulations) is a substantive notion that does explanatory work beyond the behavioral fact of convention adoption. |
  | **Revisability of Framework Statements** | Every sentence, including framework statements, is open to revision for pragmatic reasons. The fact that we can change a framework statement shows that it was not analytic in any absolute sense. | Framework statements are open to revision only in the sense that we can abandon one framework and adopt another. But within a framework, they are not revisable without changing the framework itself. The Quinean critique misses the distinction between changing a belief within a framework and changing the framework. | Whether the revisability of framework statements (for pragmatic reasons) is of the same kind as the revisability of empirical sentences (which are revised based on empirical evidence within a framework). |

  ## Addressing the Cruxes

  We now address the three questions explicitly:

  ### Question 1: When a recalcitrant observation leads a community to stop asserting a sentence, is the difference between changing a belief and changing the meaning of one of the terms a factual difference or a difference of description?

  **Concrete Test Case**: Consider the history of the term "atom". In the 19th century, atoms were thought to be indivisible. When subatomic particles were discovered, physicists stopped asserting "Atoms are indivisible". 

  - **Quinean Prediction**: The Quinean would say that this was a change in belief about atoms. The meaning of "atom" shifted as a result of the change in theory, but this is just a pragmatic redescription. There is no fact of the matter about whether the change was a change of meaning or a change of belief. The distinction is a matter of how we choose to describe the revision.

  - **Neo-Carnapian Prediction**: The neo-Carnapian would say that if we are operating within a framework where "atom" is defined as the smallest indivisible unit of matter, then the discovery requires a change of framework. In the old framework, the sentence "Atoms are indivisible" was analytic. In the new framework, "atom" is redefined to allow divisibility, and the analytic truth becomes "Atoms are divisible into subatomic particles" (or similar). The difference is factual: in the old framework, the sentence was analytic and hence not revisable without changing the framework.

  **Resolution**: Both parties agree that the revision occurred. The Quinean sees it as a change in the web of belief, with a shift in the meaning of "atom" being a consequence of the change. The neo-Carnapian sees it as a framework change. The disagreement is about the description of the event. The Quinean claims that the distinction between meaning change and belief change is not a sharp factual distinction but a matter of descriptive emphasis. The neo-Carnapian insists that the framework-relative analyticity provides a factual distinction: within a given framework, the framework statements are analytic and not subject to empirical revision. 

  **Verbal vs. Substantive**: The disagreement is partly verbal and partly substantive. It is verbal in that both agree on the historical events and on the revisability of the sentence. It is substantive in that the neo-Carnapian insists on the framework-relative notion of analyticity as a distinct kind of truth, while the Quinean reduces it to a matter of entrenchment and pragmatic revisability.

  ### Question 2: Does an explicitly stipulated definition, or an inference rule that introduces and eliminates a newly defined logical connective, establish a kind of analyticity beyond the bare fact that the community has adopted a convention?

  **Concrete Test Case**: Consider the introduction of a new logical connective, say "tonk", by the rules: 
     - From A, infer A tonk B (tonk-introduction).
     - From A tonk B, infer B (tonk-elimination).

  This leads to inconsistency because we can prove any B from any A.

  - **Quinean Prediction**: The Quinean would say that the stipulation of the rules for "tonk" is a convention. However, the convention leads to an incoherent practice. The community must either abandon the rules or face absurdity. This shows that conventions are not arbitrary in the sense that they must cohere with the rest of our practices. The analyticity of the rules is trivial and does not protect them from revision. There is no special kind of truth here beyond the convention.

  - **Neo-Carnapian Prediction**: The neo-Carnapian would say that within the framework that includes the tonk rules, the rules are analytic. However, because they lead to inconsistency, the framework is defective. We abandon the framework for pragmatic reasons (to avoid inconsistency). This does not negate the fact that within the framework, the rules were analytic. The analyticity is framework-relative and does not imply that the framework is good.

  **Resolution**: Both agree that the tonk rules are defective and must be abandoned. The Quinean sees this as a pragmatic revision of a convention. The neo-Carnapian sees it as abandoning a framework because it is incoherent. The crux is whether the analyticity of the rules (while the framework is in place) is a substantive feature. The neo-Carnapian says yes because it explains why the rules are not subject to empirical test but are instead constitutive of the meaning of "tonk". The Quinean says that the rules are just conventions and their abandonment is a pragmatic decision no different from revising any other belief.

  **Verbal vs. Substantive**: The disagreement is substantive. The Quinean denies that there is a special kind of truth (analytic truth) that is distinct from empirical truth. The neo-Carnapian insists that within a framework, there is a distinction between framework-internal analytic truths and empirical truths.

  ### Question 3: Can the neo-Carnapian honestly deny that framework statements are themselves open to revision for pragmatic reasons while still explaining how the original Quinean critique could have missed the distinction?

  **Concrete Test Case**: Consider the principle of non-contradiction (PNC). Suppose a community faces a situation where they are tempted to accept a contradiction (e.g., in a paraconsistent logic for handling paradoxes).

  - **Quinean Prediction**: The Quinean would say that PNC is highly entrenched and would only be revised under extreme duress, but it is revisable. The revision would be for pragmatic reasons (e.g., to avoid a worse problem). The revision is a change of belief and might come with a shift in the meaning of "not" or "and", but that is just part of the holistic adjustment.

  - **Neo-Carnapian Prediction**: The neo-Carnapian would say that PNC is a framework principle. If the community adopts a paraconsistent logic, they are changing the framework. Within the old framework (classical logic), PNC is analytic. In the new framework, it may not hold. The change is not driven by empirical evidence but by pragmatic considerations about which framework is more suitable. The original Quinean critique missed the distinction because it focused on natural language and scientific theories without explicitly defined frameworks, and because it conflated the framework-relative analyticity with an absolute notion.

  **Resolution**: Both agree that PNC can be revised. The Quinean sees it as a change in the web of belief. The neo-Carnapian sees it as a change of framework. The neo-Carnapian explains that the Quinean critique targeted an absolute notion of analyticity (which the neo-Carnapian rejects) and did not consider the possibility of a framework-relative analyticity. The neo-Carnapian denies that framework statements are revisable *within* a framework, but they are revisable by changing the framework.

  **Verbal vs. Substantive**: The disagreement is partly verbal and partly substantive. It is verbal in that both agree that the principle can be given up. It is substantive in that the neo-Carnapian insists on a two-level account: within a framework, framework statements are not revisable by empirical evidence, but we can change frameworks for pragmatic reasons. The Quinean sees only one level: all revisions are pragmatic and holistic.

  ## Conclusion on Residual Disagreements

  The residual disagreements are partially verbal and partially substantive. The verbal aspects arise from different uses of terms such as "analytic", "meaning", and "framework". The substantive aspects concern the explanatory value of the framework-relative notion of analyticity. The Quinean sees no need for it beyond the pragmatic notion of entrenchment, while the neo-Carnapian argues that it captures a real distinction in how we use language.

  ## Final Joint Statement

  We, the Quinean and the neo-Carnapian, agree on the following:

  1. Quine's critique successfully undermines an absolute, framework-independent notion of analyticity that relies on an unexplained notion of meaning.
  2. Within an explicitly stipulated linguistic framework, there are sentences that are true solely in virtue of the framework's rules and do not require empirical confirmation.
  3. No sentence is immune to revision, but revisions of highly central sentences (including framework statements) are highly disruptive and occur only for strong pragmatic reasons.
  4. The distinction between changing a belief and changing the meaning of a term is not a sharp factual boundary but often a matter of descriptive emphasis.

  We still disagree on:

  1. The nature of framework statements: whether they are merely highly entrenched empirical beliefs or rules that define meanings.
  2. Whether the notion of analyticity (in the framework-relative sense) does substantive explanatory work beyond the behavioral fact of convention adoption.
  3. Whether the revisability of framework statements is of the same kind as the revisability of empirical sentences.

  However, we recognize that some of our disagreement is verbal and that we can make progress by carefully distinguishing between the natural language setting (where entrenchment is central) and the formal language setting (where explicit stipulations create a clear framework-relative analyticity). We also agree that the choice between frameworks is pragmatic and that no framework is immune to replacement.

  Signed,
  [Quinean Representative]
  [Neo-Carnapian Representative]
answer: |-
  ### Joint Statement: Agreement on Core Principles

  **Section 1: Claims Both Parties Endorse**  
  1. **Confirmation Holism**: All sentences face the tribunal of experience collectively, not individually. Revisions to accommodate recalcitrant data may occur at any point in the web of belief.  
  2. **Revisability**: No sentence is *in principle* immune to revision, including logical or mathematical truths, though revisions to central claims are pragmatically costly and rare.  
  3. **Meaning Postulates as Conventions**: Explicitly stipulated meaning postulates or inference rules (e.g., in a formal system) are conventions adopted by a linguistic community. They fix the meanings of terms *relative to a framework*.  
  4. **Quine’s Critique**:  
     - Quine successfully refuted *absolute analyticity*—any notion of "truth in virtue of meaning alone" independent of pragmatic, behavioral, or holistic factors.  
     - The critique does not deny that communities *treat* certain sentences (e.g., definitions) as unrevisable in practice.  
  5. **Entrenchment vs. Framework-Relative Analyticity**:  
     - The Quinean acknowledges that some sentences are more "entrenched" (resistant to revision due to their centrality).  
     - The neo-Carnapian acknowledges that entrenchment is a pragmatic, graded feature of belief systems.  

  ---

  ### Disagreements Table  
  | Residual Issue | Quinean Position (Q) | Neo-Carnapian Position (NC) | Crux |  
  |----------------|------------------------|------------------------------|------|  
  | **1. Belief Revision vs. Meaning Change** | When a sentence is abandoned after recalcitrant data, the distinction between "changed belief" and "changed meaning" is pragmatic, not factual. It reflects a choice of redescription within the holistic web. | When a framework-constitutive sentence (e.g., a meaning postulate) is abandoned, it constitutes a *change of language*, not merely belief. This is a factual distinction tied to the framework’s rules. | **Whether linguistic frameworks create an objective boundary between *empirical content* and *constitutive rules*, or if all such boundaries are pragmatic.** |  
  | **2. Status of Stipulated Definitions** | Stipulations (e.g., "All bachelors are unmarried") are conventions with no epistemic weight beyond their utility. "Analyticity" adds nothing to "we adopted this convention." | Stipulations create framework-internal truths knowable *a priori*. Analyticity is substantive: it explains how we grasp meanings and justify inferences *without empirical input*. | **Whether analyticity is a trivial behavioral fact (convention adoption) or an explanatory feature of rational cognition.** |  
  | **3. Revisability of Frameworks** | Frameworks are revisable for pragmatic reasons (e.g., simplicity). Claims like "meaning postulates are unrevisable within a framework" ignore that *choosing a framework* is itself a pragmatic revision. | Frameworks can be *replaced*, but their internal rules are *fixed* while the framework holds. Quine’s critique misses that framework replacement is distinct from empirical revision *within* a framework. | **Whether framework revision is continuous with belief revision, or if it constitutes a distinct (meta-pragmatic) activity.** |  

  ---

  ### Addressing the Cruxes  

  #### **Crux 1: Belief Revision vs. Meaning Change**  
  **Concrete Test Case**: A community defines "planet" via a meaning postulate: "Celestial bodies orbiting the Sun are planets." After discovering Pluto’s orbital irregularities, they exclude Pluto.  
  - **Q Prediction**: The redescription ("We changed the meaning of ‘planet’" vs. "We updated our beliefs about planets") has no factual basis. It depends on which sentences were entrenched.  
  - **NC Prediction**: Abandoning the postulate *changed the language*. Pre-revision, "Pluto is a planet" was analytic (true by definition); post-revision, it is synthetic (empirically false).  
  **Resolution**:  
  - Both agree the revision occurred pragmatically.  
  - **Verbal Disagreement**: The term "meaning change" is a label for high-cost revisions affecting many inferences.  
  - **Substantive Disagreement**: NC insists frameworks create objective constraints on valid inference; Q denies this, citing holistic entanglement.  

  #### **Crux 2: Status of Stipulated Definitions**  
  **Concrete Test Case**: A logic community adopts a new connective "•" with the rule: "From *A*, infer *A•B*." Later, they abandon it due to unintuitive theorems (e.g., "Snow is white • 2+2=5").  
  - **Q Prediction**: The rule was a convention; abandoning it is no different from revising empirical beliefs. No "analytic truth" was violated.  
  - **NC Prediction**: Within the framework, "From *A*, infer *A•B*" was analytic. Abandoning it ends the framework—it does not falsify an analytic truth.  
  **Resolution**:  
  - Both agree the rule was stipulative and revisable.  
  - **Verbal Disagreement**: "Analytic" (NC) vs. "convention" (Q) for the *same* behavioral fact.  
  - **Substantive Disagreement**: NC argues analyticity explains rule-following (e.g., recognizing valid inferences); Q argues entrenchment suffices.  

  #### **Crux 3: Revisability of Frameworks**  
  **Concrete Test Case**: A physics community uses Euclidean geometry, then adopts Riemannian geometry after relativity.  
  - **Q Prediction**: The revision is continuous with empirical updates. Geometric axioms were highly entrenched empirical claims.  
  - **NC Prediction**: Euclidean axioms were *framework-constitutive*; changing geometries is a meta-pragmatic shift, not empirical falsification. Quine’s critique conflates this with empirical revision.  
  **Resolution**:  
  - Both agree the change was pragmatic.  
  - **Verbal Disagreement**: "Framework revision" (NC) vs. "revision of entrenched beliefs" (Q).  
  - **Substantive Disagreement**: NC maintains frameworks enable empirical content; Q denies frameworks have unique epistemic status.  

  ---

  ### Conclusion: Verbal vs. Substantive Residuals  
  1. **Verbal Disagreements**:  
     - "Meaning change" (Q: pragmatic redescription; NC: objective linguistic shift).  
     - "Analyticity" (Q: synonym for convention; NC: explanatory epistemic category).  
     - "Framework revision" (Q: holistic belief update; NC: meta-pragmatic activity).  
  2. **Substantive Disagreements**:  
     - Whether frameworks impose *objective constraints* on rational inference (NC) or emerge from pragmatics (Q).  
     - Whether analyticity explains *a priori* knowledge (NC) or is redundant to entrenchment (Q).  
  3. **Progress Made**:  
     - Both reject absolute analyticity.  
     - Both agree meaning postulates are conventions *relative to frameworks*.  
     - Both accept that all sentences are revisable, but framework changes are costlier.  
     - The dispute reduces to whether "framework" denotes a *sui generis* structure (NC) or a cluster of entrenched beliefs (Q).  

