  Alright, let's tackle this user's challenge. They're using evolutionary biology to argue against the causal exclusion argument. The user is clearly knowledgeable, drawing a parallel between mental causation and population-level selection in evolution. Their point is that if higher-level causes in biology aren't seen as redundant, why should mental properties be?

  First, I need to address the analogy directly. The user thinks that if causal exclusion dismisses mental causation, it should also dismiss evolutionary explanations. But I have to distinguish between these cases. The key here is whether the higher-level properties are reducible. In biology, population-level events might be reducible to molecular interactions. But the user is arguing that even if reducible, biologists still treat them as causal. So why not mental properties?

  Wait, the user mentioned that biologists don't see evolutionary causation as illusory. So they're saying that accepting molecular causes doesn't eliminate the need for higher-level explanations. But the exclusion argument isn't against explanations per se, but against irreducible causal powers. If mental properties are irreducible, then their causal role is threatened by physical causes. 

  The user's deeper need might be to find a consistent metaphysical framework that allows for genuine mental causation without reduction. They might be advocating for non-reductive physicalism. But the exclusion argument targets exactly that position. So I need to argue that in biology, the higher-level properties are reducible, whereas mental properties, if irreducible, face the exclusion problem.

  Also, the user wants to avoid question-begging. I can't just assert that mental properties are different. I should concede that in some cases, higher-level explanations are pragmatically useful but ontologically reducible. The causal work is done at the molecular level, and population-level talk is explanatory but not ontologically additional. 

  But the user might counter that even reducible properties can be causal. However, if they're reducible, then the causation is still physical. The issue is when properties are non-reducible. So for mental properties, if they're not reducible, they can't have distinct causal powers without overdetermination. 

  I should emphasize that the exclusion argument allows for higher-level causation if it's identical to lower-level. But if mental properties are irreducible, they can't be identical. Hence, they're excluded. The biology example works because it's reducible, so no exclusion issue. 

  But is population-level selection really reducible? Some philosophers might argue it's not. The user might be hinting at that. I need to stick to the reducibility point. Concede that if biological properties are irreducible, they'd face exclusion too, but assert that they aren't. Whereas mental properties are claimed to be irreducible. 

  So the response should clarify that reducible properties aren't threatened by exclusion. The problem is only for irreducible ones. Since the user's analogy assumes reducible biological properties, it doesn't challenge the exclusion of irreducible mental properties. That's the key distinction.
answer: |-
  Your analogy fails because evolutionary biology is *methodologically* non-reductive but *ontologically* reducible in principle. Population-level events like selection pressures are constituted by, and entirely dependent on, molecular interactions; they don't introduce *new causal powers* irreducible to their physical realizers. Biologists invoke higher-level explanations for pragmatic reasons—tracking robust patterns—but this doesn't imply that gene frequency shifts have *two distinct sufficient causes* (molecular *and* population-level). The molecular facts alone exhaust the causal work, making population-level properties *causally derivative*. 

  Mental causation faces a unique problem: if conscious states are irreducibly non-physical (as dualists or non-reductive physicalists claim), their purported causal influence would either *compete* with physical causes (violating causal closure) or constitute *systematic overdetermination*—both untenable. Evolutionary explanations avoid this because they don't assert *ontologically basic* higher-level causes; they're shorthand for aggregative physical processes. Conceding causal efficacy to irreducible mental properties, by contrast, *does* violate physical causal closure. The exclusion principle targets *non-reductive* claims specifically, not higher-level explanation *simpliciter*. Your analogy thus mislocates the threat.
