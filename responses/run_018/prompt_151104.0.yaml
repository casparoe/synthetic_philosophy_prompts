prompt: |-
  In debates about the origin and stability of social norms, a common analogy compares conventions to biological species: they are said to emerge through variation, selective retention, and environmental adaptation rather than through deliberate rational design. This evolutionary framing is often used to challenge Lewis-style accounts, which treat convention as a regularity sustained by mutual expectation and a shared preference for conformity in solving coordination problems. Set out the correspondence table—what plays the role of the genome, the mutation, the selective pressure, and the fitness landscape within Lewis's framework? Then mark the points where the analogy collapses, particularly regarding intentional choice, common knowledge, and the rate of change, and ask whether those disanalogies undermine the evolutionary critique or merely place it on a different temporal scale. Finally, evaluate whether the evolutionary picture smuggles in a non-rational mechanism that Lewis's view genuinely excludes, or whether the two descriptions are compatible; and state whether the conclusion that norms are not rational solutions survives once the mapping failures are fully exposed.
reasoning: |-
  Okay, the user is asking about the analogy between social norms and biological species in debates about the origin and stability of social norms. They want me to set up a correspondence table mapping evolutionary concepts to Lewis's framework, identify where the analogy breaks down, and evaluate whether the evolutionary critique holds once these disanalogies are exposed.

  I need to recall Lewis's convention theory first. Lewis sees conventions as solutions to coordination problems that emerge from mutual expectations and preferences for conformity. It's deeply rooted in rationality and common knowledge. On the other hand, the evolutionary approach views norms as emerging through variation, selection, and adaptation without deliberate design.

  For the correspondence table: The "genome" in Lewis's framework would be the rules or regularities of behavior themselves. "Mutation" corresponds to deviations from the regularity, which could be accidental or experimental. "Selective pressure" maps to the costs of coordination failure—when deviations lead to worse outcomes, creating pressure to revert to the norm. The "fitness landscape" relates to the payoff structure of the underlying coordination game, where some conventions yield higher payoffs than others.

  Now for where the analogy collapses. Intentional choice is a big one—Lewis emphasizes that individuals rationally choose to conform based on expectations, while evolution often implies mindless adaptation. Common knowledge is another point: Lewis requires agents to know that others know the norm, which has no direct parallel in biology. The rate of change differs too—social norms can shift rapidly through collective awareness, unlike slow genetic evolution.

  Regarding whether disanalogies undermine the critique: The temporal scale matters. Evolutionary models might explain long-term norm emergence but miss the micro-level rationality Lewis describes. The disanalogies don't fully invalidate the critique but show it operates on a different level.

  On compatibility: Lewis doesn't exclude evolutionary processes—he just focuses on the stabilizing mechanisms. Rational choice and selective retention could coexist, with rationality acting as the selection mechanism. The "non-rational mechanism" accusation might be overstated; evolutionary pressures in social contexts often work through rational responses to incentives.

  Finally, does the "norms aren't rational solutions" conclusion survive? Not really. Even with evolutionary origins, once established, norms function as rational coordination devices. The mapping failures expose that evolution describes emergence while Lewis explains maintenance—they're complementary rather than contradictory. The critique holds only if we conflate origin with function, which Lewis carefully distinguishes.
