answer: |-
  ### Taxonomy of Moral Particularism vs. Generalism: A Decision Tree  
  **Root Commitment:** Start with a concrete moral claim everyone can evaluate: "Causing unnecessary suffering is wrong." Each branch splits based on answers to questions about *concrete cases*, without requiring knowledge of philosophical labels. The tree isolates core beliefs about moral reasons, separates **reason modulation** (context changes a reason's *weight*) from **reason holism** (context changes a reason's *valence*), and treats principles as either **defeasible heuristics** (useful but fallible guides) or **normative summaries** (after-the-fact descriptions).  

  ---

  #### **Decision Tree**  
  1. **Q1: Are there *any* real cases where causing unnecessary suffering is NOT wrong?**  
     (i.e., genuine exceptions to the root principle)  
     - **No** → **Leaf 1: Strict Generalism**  
       *Position:* Moral principles are exceptionless universals (e.g., Kantian absolutism).  
       *Awkward commitment:* Must deny intuitive exceptions (e.g., causing suffering in self-defense) by redefining "unnecessary" or rejecting the intuition.  
       *Note:* Ignores empirical variation in cases; rare among working philosophers.  

     - **Yes** → Proceed to Q2.  

  2. **Q2: In those exceptions, does "causing suffering" still count *against* the act?**  
     (i.e., same *valence*—always a negative reason, even if overridden)  
     - **Yes** → Non-holism (valence fixed) → Proceed to Q3.  
     - **No** → Holism (valence can flip, e.g., suffering might be neutral or positive in context) → Proceed to Q4.  

  3. **Q3 (Non-holism): Does the *weight* of the reason against suffering change across contexts?**  
     (e.g., is the same suffering weaker in a medical context vs. warfare?)  
     - **No** → **Leaf 2: Defeasible Generalism**  
       *Position:* Principles are universal but defeasible; exceptions are due to *overriding* reasons (e.g., Rossian prima facie duties).  
       *Awkward commitment:* Cannot explain why identical suffering might require stronger overriding reasons in some contexts (e.g., torture vs. taxes).  
       *Note:* Treats principles as defeasible heuristics or normative summaries—**the tree does not split these**, as both variants exist here (contested).  

     - **Yes** → **Leaf 3: Contextualist Pluralism**  
       *Position:* Principles hold, but context modulates reason-weights (e.g., moderate intuitionism).  
       *Awkward commitment:* Must explain weight shifts without valence changes (e.g., why suffering's "force" varies when all else is equal).  
       *Note:* Distinct from holism; modulation is about scaling, not valence flips.  

  4. **Q4 (Holism): Are moral principles possible as *action-guiding tools*?**  
     (i.e., can principles predict new cases, or are they just summaries?)  
     - **No** → **Leaf 4: Radical Particularism** (Dancy-style)  
       *Position:* All reasons are holistic; principles are unreliable summaries at best (e.g., moral reasons emerge only from feature-combinations).  
       *Awkward commitment:* Moral deliberation can't use rules—even as heuristics—without risking error.  
       *Note:* Rejects "reason modulation" as insufficient; holism is deeper valence-change.  

     - **Yes** → **Leaf 5: Moderate Principle View**  
       *Position:* Holism is limited; some principles are action-guiding in stable domains (e.g., justice or care contexts).  
       *Awkward commitment:* Must define which reason-combinations yield invariant principles without ad hoc boundaries.  
       *Note:* Principles are defeasible heuristics, not summaries.  

  ---

  #### **Unseparated Pairs & Empty Spots**  
  - **Unseparated pairs (tree can't split):**  
    - **Leaf 2 vs. Leaf 3 on principle status:** The tree doesn't split whether principles are *defeasible heuristics* (action-guiding) or *normative summaries* (post hoc). This is contested within non-holism (e.g., Rossians vs. summary utilitarians).  
    - **Leaf 4 variants:** Radical Particularism includes those who accept principles as *contingent heuristics* (Dancy) vs. those who reject them entirely—tree combines these as they agree on Q4's "no."  

  - **Empty spots in logical space:**  
    - **Strict Generalism with modulation:** Invariant valence but variable weight *without exceptions*. Incoherent—if weight varies but there are no exceptions, modulation is undetectable.  
    - **Non-holist invariant valence + holist weight:** Assumes valence is fixed but weight can flip to negative/positive. Unattractive—weight implies scalar strength, not valence; collapses into holism.  
    - **Holism without defeasibility:** Valence flips, but principles are exceptionless. Unexplored—likely incoherent, as holism implies context can always alter reasons.  

  ---

  #### **Settled vs. Contested**  
  - **Settled:**  
    - Reason **modulation** (weight-shifts) and **holism** (valence-flips) are distinct phenomena.  
    - **Strict Generalism** is marginal—most accept exceptions.  
    - **Radical Particularism** requires holism; non-holism implies generalism.  

  - **Genuinely contested (no consensus):**  
    - Whether holism is global (Leaf 4) or local (Leaf 5).  
    - Whether modulation (Leaf 3) explains apparent exceptions better than overriding (Leaf 2).  
    - If principles are necessary for moral reasoning (generalists) or optional (particularists).  
    - Whether principles are heuristics or summaries in non-holist views (Leaf 2/3).  

  ---

  #### **Design Notes**  
  - **Audience:** Built for grad students—avoids jargon, uses concrete root commitment, and separates niche ideas (modulation vs. holism).  
  - **Branches:** 5 leaves (expandable to 8 with principle-status splits, but omitted for clarity). "Unnamed" positions flagged in empty spots.  
  - **Not encyclopedia regurgitation:** Tree isolates *beliefs about cases*, not self-identification. Modulation/holism distinction is a core branching factor.  
  - **Taxonomic rigor:** Splits on valence (Q2), weight (Q3), and principle-usability (Q4) capture key fault lines. Ignores metaethical foundations (e.g., realism) to focus on normative structure.
