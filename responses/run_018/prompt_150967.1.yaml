prompt: |-
  hey — i'm drafting a novel with two colonies, one built on guilt and one on shame, and my moral logic is a mess. here are my verdicts, they don't line up neat.

  case 1: a woman poisions her sister by mistake and hides it; she rots inside for years. i say that's guilt working right, even totally hidden.
  case 2: same thing but she's exposed and shunned; she feels nothing, just performs remorse. i say that's shame failing — the emotion got outscourced to the crowd.
  case 3: a town shares an old unspoken crime and everyone carries a vague heavyness. i call that healthy collective shame.
  case 4: but then a culture that tries to engineer private guilt through mass rituals — i feel that's a contradiction, guilt needs solitute?
  case 5: yet there's another culture in my notes that instutionalized shame and rebuilt personal identity around public role-change, and it actually works. so maybe a culture can choose?

  what principle captures all this, if any? is guilt or shame the better moral emotion? can a culture actually pick one? and what does your principle predict for a society that tries to make shame fully internal with no audience? be honest — which case do i have to drop?

  end with Verdict: [case number], then \answer{your bottom-line principle in one phrase}
reasoning: |-
  Hmm, the user is working on a novel with two colonies based on guilt and shame, and they're struggling with moral logic. They've presented five cases that illustrate their confusion about how guilt and shame function, both individually and collectively.

  Looking at their cases:
  Case 1 shows guilt working properly even when completely hidden - a woman feels internal torment after accidentally poisoning her sister and hiding it.
  Case 2 shows shame failing - when the same woman is exposed, she only performs remorse without feeling it, outsourcing the emotion to the crowd.
  Case 3 presents collective shame as healthy - a town shares an unspoken crime with everyone carrying vague heaviness.
  Case 4 points to a contradiction - a culture trying to engineer private guilt through mass rituals seems impossible since guilt requires solitude.
  Case 5 shows institutionalized shame working - a culture that rebuilds personal identity around public role-change actually functions well.

  The user wants to know: What principle captures all this? Is guilt or shame better? Can a culture choose one? What happens if a society tries to make shame internal without an audience? And which case should they drop?

  I need to identify a unifying principle. Guilt is fundamentally about internal self-judgment - violating one's own standards. Shame is about external social judgment - violating community expectations. This explains why guilt can function in solitude (Case 1) while shame requires an audience (Case 2). 

  For cultural choice: Cultures can emphasize one over the other, but they can't fundamentally change the nature of these emotions. Case 5 shows institutionalized shame working precisely because it leverages shame's public nature through role-change rituals. Case 4 fails because guilt can't be mass-produced through rituals - it requires personal moral reckoning.

  The impossible scenario: A society trying to make shame fully internal would collapse because shame's mechanism depends on the imagined or real audience. Without that, it would either transform into guilt or evaporate.

  Which case to drop? Case 3's "healthy collective shame" conflicts with the core principle. Collective shame isn't really shame - it's either collective guilt (if members personally condemn the act) or performative shame (if they just feel social pressure). The user describes "vague heaviness" which sounds more like internalized guilt than true shame.

  So my verdict is to drop Case 3. The core principle is: "Guilt is self-policing conscience; shame is socially-enforced reputation management." This explains all functional cases while showing why Case 3 misattributes the emotion and Case 4 misunderstands guilt's nature.
answer: |-
  Based on your cases and the core nature of guilt vs. shame, here's a unifying principle and verdict:

  **Core Principle:** Guilt is a *self-generated* emotion arising from violating one's *own* moral standards. Shame is a *socially triggered* emotion arising from violating *external* communal expectations or norms. Guilt focuses on the *act* ("I did bad"), shame focuses on the *self* ("I *am* bad") in the eyes of others.

  1.  **Case 1 (Guilt Hidden):** **Correct.** Guilt operates internally based on personal conscience, requiring no audience. The self is the judge.
  2.  **Case 2 (Shame Exposed/Performed):** **Correct.** Shame is triggered by exposure and social judgment. Without the social context, the internal feeling might not exist ("failing" to produce genuine remorse). The *crowd* is the judge.
  3.  **Case 3 (Collective "Shame"):** **Problematic.** "Collective shame" is often a misnomer. What you describe ("vague heaviness") sounds more like **collective guilt** (internalized recognition of shared wrongdoing) or internalized social anxiety. True shame requires a perceiving "other." If *everyone* shares the secret crime, who is the audience generating the shame? The heaviness likely stems from *personal* guilt over the shared act or fear of *external* discovery, not pure shame.
  4.  **Case 4 (Mass Ritual Guilt):** **Contradiction.** Correct intuition. Mass rituals are *social* mechanisms. They can induce *shame* (fear of social censure) or *remorse* aimed at social reintegration, but they cannot directly engineer genuine *guilt*. Guilt must originate from a personal internalization of the wrongdoing against one's own values. Rituals might *remind* people of standards they *already* personally hold (triggering guilt), but can't *create* the internal standard itself. Solitude *allows* guilt to surface, but isn't strictly required; the key is the internal conviction.
  5.  **Case 5 (Institutionalized Shame):** **Plausible.** Shame is fundamentally social, so a culture *can* effectively harness it. Public role-change rituals provide a clear social mechanism for reintegration after violating norms. This leverages shame's core nature: the judgment of the community and the path back to belonging. It "works" *as a shame-based system*.

  **Answers to Your Questions:**

  1.  **Unifying Principle:** **Guilt is self-policing conscience; shame is socially-enforced reputation management.**
  2.  **Guilt vs. Shame - Which is "Better"?** Neither is inherently "better"; they serve different functions. Guilt is crucial for *intrinsic* morality and repairing internal integrity. Shame is powerful for *social cohesion* and enforcing group norms. Healthy moral systems often utilize both, but rely more fundamentally on guilt for stable internal character. Shame alone risks creating conformity without genuine conscience.
  3.  **Can a Culture Choose?** A culture can *emphasize* and *institutionalize* one over the other (as your colonies do), and even attempt to engineer them. However, it cannot change their *fundamental nature*. Trying to force guilt via social performance (Case 4) fails because guilt is internal. Institutionalizing shame (Case 5) can work *because* shame is social.
  4.  **Predicting Internalized Shame (No Audience):** **It fails or transforms.** Shame *requires* an audience (real or imagined). A society trying to make shame "fully internal" would either:
      *   **Fail:** The "shame" feeling would dissipate without the reinforcing social judgment/perceived exposure.
      *   **Transform into Guilt:** The internalized *social rule* would need to become a *personal moral conviction* for the feeling to persist. The emotion would then be guilt ("I broke *my* rule"), not shame ("*They* see I am bad").
      *   **Become Pathological Anxiety:** It could manifest as free-floating social anxiety or fear of hypothetical judgment, but this isn't shame directed at a specific act/self-perception.

  **Verdict: Case 3** must be dropped or reframed. "Healthy collective shame" as described contradicts the core mechanism of shame. The "vague heavyness" is more likely:

  *   **Collective Guilt:** If individuals personally condemn the shared act based on internalized morals.
  *   **Internalized Social Anxiety/Fear:** If the heaviness stems from dread of the secret being exposed to an *external* audience (real or hypothetical).
  *   **Moral Dissonance:** A discomfort arising from the conflict between the act and professed values, closer to guilt.

  True shame requires an "other" looking at the self. In a closed group sharing the secret equally, that "other" is absent.

  \answer{Moral emotion arises from source: guilt from internal standards, shame from external perception.}
