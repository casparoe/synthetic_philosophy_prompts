  im giving the toast at my advisor's retirement dinner next week. she spent 40 years on the heterogeniety problem — the old worry that pleasures are too different to share anything that makes hedonism work — and she hated both mill's higher-pleasures fix and the quantitative dodge. half the room are philosophers who'll catch every reference; the other half are relatives who think hedonism means a spa day. write a five-minute toast where that tension actually structures what i can and can't say: i need to honor her rigor without inventing a fake common essence of pleasure just to make the speech tidy. inject the idea that maybe what pleasures share isn't a feeling at all but a negative structural feature — like the brief collapse of comparative judgement — something she circled but never bought. keep it readable for both halves, no citations, about 5 mins.
