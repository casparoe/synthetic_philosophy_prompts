  hey, i'm a longtime lurker on lesswrong and related spaces, and i'm trying to wrap my head around whether moral revolutions are actually about arguments or just about honor and incentives shifting under our feet. I just finished Appiah's Honor Code and some stuff on Eric Williams's capitalism-and-slavery thesis, and it got me thinking about something kind of specific: the way certain epistemic norms in rationalist forums—like the old expectation that you have to reconstruct an opponent's view in its strongest form before critiquing it—seems to have collapsed over the last decade, not because anyone published a knockdown argument against steelmanning, but because the social rewards changed.

  So please, act as an expert in moral philosophy and the sociology of intellectual communities. Take a moment to brainstorm before answering. I want you to describe the most important implications of using the Appiah-Williams framework—honor-driven moral revolutions versus interest-driven economic shifts versus rational argument—to analyze why steelmanning norms faded in these spaces, and more importantly, what that tells us about whether they can come back. Don't just map the three mechanisms onto the decline; really dig into whether their's a hidden honor-code dynamic that makes steelmanning feel 'dishonorable' now in ways people don't admit, and whether treating it as purely an incentive problem misses something about status and shame in discourse. I'm not asking for a bibliography or specific quotes—just the conceptual analysis, pushed pretty far. Also please think step by step and don't hedge every sentence with 'it depends'; I want the strongest version of each claim you can defend.
