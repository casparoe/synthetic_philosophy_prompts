answer: |-
  **Seminar Prep Sheet: Objections & Replies**  
  *(Prioritized by damage potential)*  

  ---

  **1. Objection (Senior Mechanists):**  
  "Your appeal to 'procedures not derivable in S' smuggles in a *de re* self-referential capacity that remains vulnerable to the same diagonalization paradoxes as Lucas-Penrose. Resource bounds don’t resolve the category error: S cannot *contain* its own consistency proof, but *neither can humans* — we merely *assert* it from a position of semantic externalism."  

  **Reply (2 min):**  
  "I concede that humans cannot exhaustively survey S. However, my claim isn’t about *metalogical omniscience* but about *practice-grounded defeasibility*. When S is proposed as a model of *our* cognition, we leverage mathematical community norms (e.g., peer verification of S’s consistency via heterogeneous heuristics) that S cannot *formally execute* as a closed system. This is an epistemic gap in *modeling*, not self-reference."  
  **Weakness:** Does not fully address why these "norms" escape paradox if mechanized recursively.  

  ---

  **2. Objection (Mathematical Logician):**  
  "Gödel’s theorems show limitations of *formal systems*, not minds. Your 'procedures' (reflective equilibrium, etc.) are either implementable in a richer system T ⊃ S — restarting the regress — or are *informal* and thus irrelevant to mechanism."  

  **Reply (2 min):**  
  "Agreed — if T mechanizes our procedures, we apply Gödel to T. But in *practice*, mathematicians don’t fix a T. We *iterate* model-revision using open-ended resources (e.g., reinterpreting axioms post-counterexample). S cannot simulate this *openness* under polynomial-time constraints, as it lacks access to the 'meta-context' of evolving practice."  
  **Weakness:** Risks conflating *procedural openness* with *non-mechanizability*.  

  ---

  **3. Objection (Cognitive Scientists):**  
  "Formal consistency-checking is a poor model of cognition. Neural networks compute via parallel, approximate, Bayesian inference — not discrete proof-steps. Your 'epistemic asymmetry' presumes symbolic computation, which neuroscience falsifies."  

  **Reply (2 min):**  
  "I concede brains aren’t theorem-provers. But *when doing metamathematics*, humans deliberately adopt symbolic-reasoning norms. If you argue cognition *always* reduces to sub-symbolic processes, you cannot explain how we *correctly* track formal constraints (e.g., spotting contradictions in S). My argument targets *this* normative competence."  
  **Weakness:** Assumes cognitive science cannot mechanize normative reasoning.  

  ---

  **4. Objection (AI Graduate Students):**  
  "In bounded polynomial time, humans use heuristics that *are* approximable by probabilistic algorithms (e.g., PAC-learning). An augmented S could simulate your 'procedures' via an oracle for empirical feedback, closing the asymmetry."  

  **Reply (2 min):**  
  "Empirical feedback adjusts weights, not consistency *verification*. To *know* S is consistent, you need a proof — not a high probability. Heuristics may fail (e.g., overlooking a contradiction); our capacity to *recognize and correct* such failures via dialectic (e.g., peer critique) isn’t codable in S without losing polynomial-time bounds."  
  **Weakness:** Underestimates how "dialectic" could be automated.  

  ---

  **5. Objection (Senior Mechanists):**  
  "Resource bounds make your argument *worse*: If S is polynomial-time (e.g., bounded arithmetic), humans can *also* err under time pressure. Your 'asymmetry' vanishes when both are bounded."  

  **Reply (2 min):**  
  "Human error doesn’t equate to *computational equivalence*. We *use* resource constraints strategically (e.g., focusing on high-leverage conjectures), while S executes fixed routines. Crucially, we *judge* S’s errors by embedding it in a wider ecosystem of practices — a capacity S lacks by hypothesis."  
  **Weakness:** Strategic focus may be algorithmic.  

  ---

  **6. Objection (Cognitive Scientists):**  
  "Cross-system comparison isn’t magical. Connectionist models exhibit transfer learning across domains. If S models a *network*, not a theory, your 'comparison' is just vector alignment."  

  **Reply (2 min):**  
  "Mathematical comparison isn’t merely vectorial — it’s *inferential* (e.g., mapping proofs between ZF and ETCS). Neural nets approximate this *after training*, but cannot *guarantee* consistency-preserving mappings, which mathematicians do via proof-theoretic reduction — a non-approximable, normative act."  
  **Weakness:** "Guarantee" may overstate human infallibility.  

  ---

  **7. Objection (AI Graduate Students):**  
  "Your 'practitioner' is vague. If we view the *entire scientific community* as a distributed system T, then T *does* mechanize your procedures — and T can be Gödelized, but so what? This doesn’t imply non-mechanism."  

  **Reply (2 min):**  
  "T isn’t a *fixed* system — it evolves via contested interpretations (e.g., constructivism vs. classical). S cannot model this *dialectical evolution* without violating its own consistency (by internalizing contradictions during debate). Our capacity to *navigate* such evolution is the asymmetry."  
  **Weakness:** Evolution may be computable by dynamic systems.  

  ---

  **Opening Concession:**  
  "I grant that formal systems are invaluable idealizations of cognition, and that brains are finite physical systems. My target is *not* mechanism per se, but the claim that any *fixed* formal system suffices to model mathematical understanding, even under resource constraints."  

  **Objection I Hope Nobody Raises (Targets Resource-Bounded Core):**  
  **"If S is polynomial-time, why can’t it simulate your 'procedures' using interactive proof protocols? In practice, humans outsource consistency checks (e.g., using automated provers), collapsing your 'asymmetry' into distributed computation — where S *is* part of the human process."**  
  *(Weakness in all replies: Outsourcing may indeed mechanize "reflective equilibrium" via feedback loops, nullifying the non-derivability claim.)*  

  ---  
  *End of prep sheet*
