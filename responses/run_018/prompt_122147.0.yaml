prompt: |-
  I am trying to say what I actually believe about the truth of statements about the future, and I would rather begin from my verdicts on cases than from a theory. Here they are.

  (i) A midshipman will toss a fair coin at noon tomorrow. "The coin will land heads" — I will call this neither true nor false. (ii) "The coin will land heads or tails" — true; I will not give that up, though I cannot see how a disjunction can be true when neither disjunct is. (iii) Astronomers have fixed, from the mechanics of the solar system, that there will be a total eclipse visible from a certain harbour nine years from now, and nothing now could prevent it. "There will be a total eclipse over the harbour" — true, now, even though nothing has yet brought it about and no one has observed anything. (iv) A patient is told her chance of surviving to June is nine in ten. "She will survive to June" — I still want to say neither true nor false, but I feel a real pull to say it is nearer the truth than the parallel claim about a patient whose chance is one in ten, and I distrust the pull. (v) "I will order the fleet to sail," said now by an admiral who has not yet decided and is still weighing her reasons — I want to say she cannot truly assert it; yet her flag officer, who has watched her weigh such reasons for twenty years, can truly say of her, now, that she will order the fleet to sail. I hold both verdicts and cannot see how both can be held. (vi) In another physical universe a perfect simulation of our world has already been run to completion, and in it a coin intrinsically identical to ours, tossed in intrinsically identical circumstances, lands heads. I do not think that makes (i) true; but I cannot say what our coin has that its duplicate lacks.

  Is there a single account of what makes a future-tensed statement true — and of what one should say about the ones that are not — that returns all six verdicts? If not, tell me which verdict to surrender and which clause was doing the work. And tell me what your account says about a case I have not settled: "one day a human being will be the last human being, and she will be born on a Tuesday," where nothing now fixes whether there will ever be a last human being at all.
reasoning: |-
  Okay, let me try to work through this user's problem step by step. They've presented six detailed cases about future-tensed statements and their truth values, along with their intuitive verdicts on each. The challenge is to find a unified account that satisfies all six intuitions, or identify which verdict needs to be surrendered.

  First, I need to understand the core tension across these cases. The user clearly rejects bivalence for future contingents (case i), yet insists on truth for determined futures (case iii) and logical truths (case ii). There's also an interesting asymmetry in how they treat probabilistic statements (case iv) and intentional actions (case v).

  Hmm... the admiral case (v) is particularly tricky. The user wants to say the admiral can't truthfully assert her own future action while an observer can - that seems contradictory at first glance. But maybe this points to a speaker-relative element in truth ascription. 

  For the duplicate universe case (vi), the user rejects that extrinsic facts determine truth, which suggests they view truth as grounded in actual causal chains rather than mere possibilities. That reminds me of Peircean views where only actualized futures become true.

  The last human being case seems designed to test the limits - if we don't know whether humanity will end, and if it ends we don't know the day, how can we assign truth value to such a specific claim?

  Looking at existing theories... Łukasiewicz's three-valued logic handles (i) and (ii) well with its "indeterminate" value preserving excluded middle. But it struggles with (iii) since astronomical determinism should make the eclipse true now. Supervaluationism could work for (i-iii) by distinguishing truth from supertruth, but then (iv) becomes problematic - how do we get degrees of closeness to truth?

  The probability case (iv) suggests we need some account of verisimilitude. And the admiral case (v) implies that truth depends on perspective - which threatens to make truth subjective. That can't be right. Unless... maybe it's about access to evidence rather than truth itself?

  For the duplicate universe (vi), any account must explain why identical setups don't guarantee identical truth values. This pushes toward a form of actualism - only facts in our actual world matter.

  Putting this together... perhaps a hybrid approach: 
  - Adopt supervaluationist semantics for future contingents (handles i, ii)
  - Add a causal determination clause for cases like the eclipse (iii)
  - Treat probabilities as epistemic rather than ontological (addresses iv's "pull")
  - Distinguish between first-person and third-person knowledge in intentional cases (v)
  - Maintain actual world indexing to resolve duplicate universe issue (vi)

  But does this cohere? The biggest conflict seems between (i) and (v) - if the flag officer can know the admiral's action, why isn't that future determined? Unless... the difference lies in the mode of access. The officer has evidence-based certainty, not metaphysical certainty.

  For the last human case, under this framework it would be neither true nor false since no present facts determine humanity's end or the Tuesday birth. The specificity makes supertruth impossible.

  The user might need to relax the intuition in (v) - the officer's claim isn't strictly "true" but highly warranted. Or distinguish between temporary and permanent truth value assignments. But that feels like cheating...

  After wrestling with this, I think supervaluationism plus a determination principle comes closest. The user might need to accept that in case (v), both statements can't be literally true simultaneously - the officer's claim is epistemically justified but not metaphysically true until the decision occurs. That preserves the core intuitions while resolving the contradiction.
answer: |-
  After analyzing your six cases, I propose a **supervaluationist account with causal determination** as the most coherent framework that preserves your core intuitions while resolving tensions. Below, I explain how it satisfies each verdict and address the unresolved case.  

  ### The Account:  
  - **Truth Conditions**: A future-tensed statement "It will be that P" is **true now** iff *every causally possible branch of the future* (consistent with the current state of the world + laws of nature) entails *P*.  
  - **False now** iff *no* causally possible branch entails *P*.  
  - **Indeterminate** (neither true nor false) iff *some* branches entail *P* and others entail *~P*.  
  - **Degrees of closeness**: Reflect epistemic confidence, not ontological truth-value.  

  ---

  ### How It Returns Your Verdicts:  
  1. **Coin toss (i)**:  
     - Neither true nor false.  
     - **Why**: Two causally possible branches (heads/tails); neither dominates all futures.  

  2. **Disjunction (ii)**:  
     - True.  
     - **Why**: Every possible branch entails heads-*or*-tails (a logical truth). Supervaluationism validates tautologies even when disjuncts are indeterminate.  

  3. **Eclipse (iii)**:  
     - True now.  
     - **Why**: Solar mechanics *causally determine* the eclipse; no possible branch avoids it. Truth requires determination, not present "bringing about."  

  4. **Survival probability (iv)**:  
     - Neither true nor false.  
     - **Why**: 90% survival chance implies branches where she dies. The "pull" toward truth is *epistemic* (high probability warrants confidence), but *ontologically*, both outcomes remain possible. Your distrust is justified: truth isn't gradable.  

  5. **Admiral’s order (v)**:  
     - Admiral’s assertion: **Not truly assertable** (indeterminate).  
     - Flag officer’s claim: **True** (if justified).  
     - **Resolution**: The admiral’s indecision creates branches (sail/not sail). But the flag officer’s statement ("She *will* order it") is true iff *their evidence* rules out all branches where she doesn’t sail (e.g., deep knowledge of her psychology). This separates *speaker context* from *truth conditions*: the officer’s claim is true because *determination-by-character* collapses possible futures.  

  6. **Duplicate universe (vi)**:  
     - Does not make (i) true.  
     - **Why**: Truth depends on *actual-world causal chains*, not extrinsic simulations. The duplicate’s outcome is irrelevant; our coin’s future remains open.  

  ---

  ### Tensions Resolved:  
  - **Disjunction (ii)**: Supervaluationism guarantees "P ∨ ~P" is true despite indeterminate disjuncts.  
  - **Admiral (v)**: The officer’s knowledge establishes *causal determination* (her character/past actions necessitate the outcome), while the admiral’s present uncertainty reflects open branches.  
  - **Probability (iv)**: Degrees of "closeness" track *epistemic probability*, not truth.  

  ---

  ### Unresolved Case: "One day a human will be the last human, born on a Tuesday."  
  - **Verdict**: **Neither true nor false** (indeterminate).  
  - **Why**:  
    - If humanity ends, branches exist where the last human is born on Tuesday/Wednesday/etc.  
    - If humanity never ends, no last human exists.  
    - *No present facts* determine either (i) whether humanity ends, or (ii) the birth day if it does. Thus, no branch dominates.  

  ---

  ### If You Must Surrender a Verdict:  
  - **Weakest link**: **Case (v) flag officer’s claim**.  
    - **Why**: If the admiral’s choice is *not yet determined*, the officer’s claim should be *indeterminate but highly probable* (not true).  
    - **Trade-off**: Abandoning this preserves bivalence and simplifies the account, but violates your intuition that the officer *knows* the outcome.  
  - **Clause doing the work**: The "causal determination" condition.  

  ### Conclusion:  
  **Supervaluationism + causal determination** best systematizes your judgments. It distinguishes:  
  - Truth (causal inevitability),  
  - Indeterminacy (contingency),  
  - Epistemic confidence (probability).  

  This resolves all cases except potentially (v); there, I recommend accepting the officer’s claim as *warranted* but *not strictly true* until the admiral acts. For the "last human" case, indeterminacy follows naturally. This framework honors your rejection of bivalence for contingents while upholding truth for determined futures and logical truths.
