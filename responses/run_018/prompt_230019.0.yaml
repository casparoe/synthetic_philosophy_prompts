  ### The Ethics of Blame: A Legal Puzzle

  **The Practice (150 words)**  
  English law presents a striking contradiction regarding hypocrisy’s relevance to standing. In criminal law, a defendant cannot escape conviction by arguing the victim committed identical misconduct (*tu quoque*). The victim’s own wrongdoing is irrelevant to the defendant’s culpability. Conversely, in equity, the ‘clean hands’ doctrine allows courts to deny relief (like an injunction or specific performance) to claimants whose own conduct concerning the matter was wrongful, even if that wrong mirrors what they allege against the defendant. Here, the claimant’s hypocrisy *is* deemed relevant, potentially vitiating their standing to seek the court’s discretionary aid. Thus, the law simultaneously treats a complainant’s prior similar wrongdoing as utterly irrelevant in one context (criminal prosecution) and as potentially decisive in another (equitable claims).

  **The Implicit Theory of Each Half (300 words)**  
  The criminal law practice implicitly rests on a theory that *standing to blame* (here, the state's standing to prosecute and punish) derives solely from the state’s role as the guardian of public order and justice. The wrong is an objective violation of societal norms, and the state’s authority to condemn and sanction flows from its legitimate mandate, irrespective of the victim’s personal conduct or moral purity. The victim’s potential hypocrisy does not negate the objective wrongfulness of the defendant’s act, nor does it undermine the state’s unique institutional standing to address it. The focus is on the defendant's breach of duty to society.

  Conversely, the clean hands doctrine in equity implicitly relies on a theory where standing to *seek a specific kind of judicial remedy* is conditional upon the claimant’s own moral posture concerning the dispute. Equity, historically rooted in conscience and fairness, demands that one seeking its discretionary, often personal, remedies must come to the court with ‘clean hands’. The implicit theory is that a claimant who has engaged in the very same type of misconduct they complain about lacks the moral standing or authority to invoke the court’s conscience-based powers. Their hypocrisy renders them an unsuitable agent for demanding equitable intervention; it suggests they are not genuinely committed to the underlying moral principle but are exploiting it opportunistically. The court refuses to act as an instrument for such a claimant.

  **Strictly Presupposed vs Merely Fits (200 words)**  
  The criminal law position *strictly presupposes* the state’s unique, non-delegable role as the sole legitimate prosecutor of public wrongs. It necessitates that the victim’s conduct cannot logically impugn the state’s standing, as the state acts *on behalf of* society, not the individual victim. The irrelevance of *tu quoque* is a direct consequence of this foundational principle of public law enforcement.

  The clean hands doctrine, however, merely *fits* the theory of conditional moral standing. While the doctrine clearly reflects the idea that hypocrisy can undermine a claimant's moral authority in a private, conscience-based dispute, it does not strictly *require* this theory. Alternative justifications exist: clean hands could be a pragmatic rule preventing courts from aiding wrongdoers (regardless of hypocrisy), a deterrent against misconduct in contractual/relational contexts, or a jurisdictional limit on equity’s discretionary powers. The moral standing theory provides a compelling philosophical explanation, but the doctrine itself is historically rooted in equitable discretion rather than articulated moral philosophy, leaving room for other interpretations.

  **Where the Practice is Underdetermined (200 words)**  
  The law’s divergent treatment of hypocrisy is philosophically underdetermined. It fails to specify clearly *why* standing depends on context. Why does the state’s institutional role completely insulate it from considerations of the victim’s hypocrisy in criminal matters, whereas in equity, the private claimant’s moral authority is so crucial? The distinction based solely on the public/private nature of the proceeding (prosecution vs. suit for equitable remedy) feels arbitrary without deeper justification. Is it the *type of sanction* (punishment vs. injunction), the *parties involved* (state vs. individual vs. individual), or the *source of the court’s authority* (statute/command vs. conscience/discretion) that makes hypocrisy relevant? The practice does not provide a clear principle differentiating when hypocrisy destroys standing and when it is irrelevant. It implicitly suggests that standing is not monolithic but varies based on the nature of the complaint and the remedy sought, yet the underlying rationale for this variation remains unarticulated, leaving the boundary philosophically underdetermined. The law operationalises a distinction without fully theorising its grounding.

  **What Would Have to Change (150 words)**  
  Adopting the pure view that "a wrong is a wrong no matter who points it out" would necessitate significant reform of the clean hands doctrine. Under this view, the claimant’s hypocrisy or prior identical misconduct, while perhaps morally repugnant, would not *in itself* destroy their standing to seek redress for the defendant’s distinct wrong. The court would have to recognise the objective wrongfulness of the defendant’s conduct independently. Equity could still consider the claimant’s misconduct for other reasons – such as assessing the balance of convenience for an injunction, barring claims based on illegality (*ex turpi causa*), or reducing damages for contributory fault – but it could no longer refuse relief *solely* on the basis that the claimant’s hands were unclean regarding the *same type* of wrong. The doctrine’s focus would shift from the claimant’s moral authority to disentangle the objective merits of the complaint from the claimant’s personal failings.
