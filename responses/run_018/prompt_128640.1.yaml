  Okay, the user is working on a feature about longtermist ethics and needs a sanity check on a colleague's summary of "strong longtermism." They suspect there might be misrepresentations but aren't sure. As an expert in normative ethics and decision theory, I need to carefully analyze this.

  First, I recall the key distinctions in longtermism. The colleague's summary seems to conflate axiological longtermism (which is about values - future lives matter) with strategic longtermism (which is about practical actions). They also mix up expected-value reasoning (probabilistic calculations) with specific predictions (like the 500-year timeframe). And they frame it as "literal only moral priority" which sounds like lexical priority (absolute precedence), whereas many longtermists actually discuss probabilistic domination (overwhelming importance without absolutism).

  Looking at the specific claims: The 10^58 number is real but illustrative, not literal. The extinction prevention focus is oversimplified - longtermists care about trajectory changes too. The "defund global health" part is a policy implication some draw, but not inherent to the philosophy. And the dismissal as "sci-fi speculation" misses how expected-value reasoning works even under deep uncertainty.

