prompt: |-
  ok so i keep seeing people treat the zombie argument like its a slam dunk, but i want the actual spec sheet before i decide anything. write the desiderata that any decent account of the conceivability-to-possibility link for philosophical zombies actually has to deliver. list the cases: full behavioral duplicates with no inner life, partial zombies missing just affect or just self-consciousness, inverted-spectrum twins with no behavioral difference, and whether accepting that some phenomenal states can be present but cognitively inaccessible—like in overflow scenarios—screws up the standard setup. for each, say why its a hard case. also list the distinctions the theory cant collapse—conceivable vs imaginable vs metaphysically possible, and epistemic gap vs modal gap—with the reasoning behind each. then the consistency constraints: what results from neuroscience or unconscious-processing research it cant flat-out contradict without being ad hoc. flag any two desiderata that look jointly unsatisfiable, and say which single one does the most damage to rival accounts. finally, very briefly, how physicalism, property dualism, and an epistemic-gap-only view do against the list—keep it to a few lines, i want the criteria first. oh and i wrote modial instead of modal earlier, just ignore that.
reasoning: |-
  Okay, the user wants a rigorous breakdown of the desiderata for the conceivability-to-possibility link in zombie arguments. They're clearly well-versed in philosophy of mind but frustrated by oversimplified treatments. Let me unpack their layered request step by step.  

  First, they specified four zombie cases: full behavioral duplicates (the classic p-zombie), partial zombies (missing specific qualia like affect), inverted spectrum twins, and cognitive overflow scenarios. Each presents unique challenges. For full zombies, the core tension is between conceivability and physical closure—how can we coherently imagine identical physics without consciousness? Partial zombies expose granularity problems: if we can conceive of missing *one* type of qualia, why not others? That risks slippery slopes. Inverted spectra test whether functional equivalence truly necessitates identical phenomenology—if not, physicalism might have wiggle room. Overflow scenarios are particularly nasty because they suggest unreportable qualia, undermining the behavioral criteria anti-zombie arguments often rely on.  

  The distinctions they mentioned—conceivable/imaginable/metaphysically possible, epistemic/modal gaps—are landmines. A good theory must explain why zombies seem imaginable (e.g., as a failure to grasp psychophysical necessities) without conceding metaphysical possibility. The epistemic-vs-modal gap is the heart of the debate: if the gap is merely epistemic (we don't *know* how consciousness arises), physicalism survives; if it's modal (no necessary connection), dualism wins.  

  Neuroscience constraints are crucial. Any account denying empirical data—like unconscious processing or neural correlates of consciousness—would be ad hoc. But this creates tension: if unconscious vision involves no phenomenology despite complex processing (as per research), why couldn't a full zombie exist? That's where the "jointly unsatisfiable" problem bites: maintaining both (a) conceivability as a guide to possibility *and* (b) physical causal closure seems impossible if zombies are conceivable but metaphysically banned.  

  Property dualism handles conceivability best but flounders on causal closure; physicalism saves closure but must explain away the epistemic gap. The epistemic-only view (like type-A physicalism) seems strongest against zombies but clashes with the intuitive depth of the hard problem.  

  User's "modial" typo is a non-issue, but their demand for "spec sheet" rigor suggests they've encountered too many glib dismissals or endorsements of zombie arguments. They want the full arsenal to dissect both sides—likely preparing for a paper or debate. The unspoken need is probably: "Give me the tools to shut down oversimplified takes, whether from dualists or physicalists."
answer: |-
  Here's the rigorous desiderata for evaluating the conceivability-to-possibility (C→P) link in zombie arguments, structured as requested:

  ### I. **Cases & Why They're Hard**
  1.  **Full Behavioral Duplicates (P-Zombies):**
      *   *What:* Physical/functional duplicates lacking *any* phenomenal consciousness.
      *   *Hardness:* Directly challenges the necessity of consciousness for physical/functional organization. If conceivable *and* possible, physicalism is false. Crux of the argument.
  2.  **Partial Zombies (e.g., Missing Affect/Self-Consciousness):**
      *   *What:* Duplicates lacking *specific* phenomenal aspects (e.g., no emotional qualia but normal pain, or no sense of self but normal perception).
      *   *Hardness:* Tests the *granularity* of the C→P link. Can phenomenal consciousness be "decomposed"? If conceivable, suggests qualia aren't necessitated *en bloc*, complicating reductive accounts.
  3.  **Inverted Spectrum Twins (Phenomenal Difference, No Behavioral Difference):**
      *   *What:* Duplicates where qualia are systematically inverted (e.g., my "red" is your "green" experience) but behavior is identical.
      *   *Hardness:* Challenges functionalism directly. If conceivable *and* possible, identical functional states don't necessitate identical phenomenal states. Questions whether consciousness supervenes on function alone.
  4.  **Cognitive Overflow (Phenomenal States Without Access):**
      *   *What:* Cases where phenomenal content exists but is not cognitively accessible/reportable (e.g., rich visual experience exceeding working memory).
      *   *Hardness:* Undermines arguments equating phenomenal absence with *functional* absence (e.g., "if it behaves like it feels pain, it must feel pain"). If overflow is real, zombies could be indistinguishable *behaviorally* yet lack consciousness, making detection impossible and conceivability arguments *stronger*.

  ### II. **Distinctions the Theory Must Maintain (Without Collapsing)**
  1.  **Conceivable vs. Imaginable:**
      *   *Distinction:* Conceivability is an *epistemic* notion (coherently conceivable without contradiction). Imaginability is a *psychological* feat (forming a sensory-rich mental image).
      *   *Reasoning:* We might conceive of complex physics without being able to *image* it. A C→P link cannot rely on mere failure of imagination as proof of inconceivability (e.g., "I can't *picture* a zombie, so it's inconceivable").
  2.  **Conceivable vs. Metaphysically Possible:**
      *   *Distinction:* Conceivability is an epistemic guide; possibility is a modal status. Something conceivable might be metaphysically impossible (e.g., water not being H₂O).
      *   *Reasoning:* The core debate: *Is zombie conceivability a reliable guide to zombie possibility?* Physicalists say no (it's like conceiving water without H₂O). Dualists say yes.
  3.  **Epistemic Gap vs. Ontological/Modal Gap:**
      *   *Distinction:* An *epistemic gap* means we don't *know* how consciousness arises from the physical. An *ontological/modal gap* means there is no necessary connection.
      *   *Reasoning:* Admitting an epistemic gap is compatible with physicalism (we're ignorant). A C→P link establishing zombies as possible requires inferring an *ontological gap* from the *epistemic gap* (the "hard problem"). The theory must explain how/why conceivability reveals ontology, not just epistemology.

  ### III. **Consistency Constraints (Cannot Contradict)**
  1.  **Neural Correlates of Consciousness (NCCs):** Cannot deny that specific neural activity is *systematically associated* with reports/behavior indicative of specific conscious states.
  2.  **Unconscious Processing:** Must accommodate robust evidence of sophisticated perception, cognition, learning, and action *without* associated phenomenal consciousness (e.g., blindsight, priming).
  3.  **Causal Efficacy of Consciousness:** Cannot blatantly contradict evidence that conscious states play a causal role in *some* behaviors (e.g., complex, novel decision-making) without being ad hoc (e.g., "only the physical does the causing, consciousness is epiphenomenal" must be defended, not assumed).

  ### IV. **Tensions & Key Desiderata**
  1.  **Jointly Unsatisfiable Pair:**
      *   **(D1)** *Conceivability Implies Possibility for Zombies:* Zombie conceivability reliably indicates their metaphysical possibility.
      *   **(D2)** *Causal Closure of the Physical (CCP):* Every physical effect has a sufficient physical cause.
      *   *Conflict:* If zombies are possible (D1), then consciousness is non-physical. But if consciousness causes behavior (as it seems to), and zombies behave identically via purely physical causes (CCP, D2), then the non-physical consciousness in non-zombies seems causally redundant or epiphenomenal. Resolving this requires denying either consciousness's efficacy, CCP, or the C→P link (D1).
  2.  **Single Most Damaging Desideratum to Rivals:**
      *   **Handling the Epistemic Gap:** Explaining *why* zombies seem conceivable *even if* they are metaphysically impossible is the most damaging challenge to **dualist** accounts relying on C→P. Conversely, explaining *why* the epistemic gap exists *and* is deep/inescapable *without* implying an ontological gap is the most damaging challenge to **physicalist** accounts denying the C→P link for zombies.

  ### V. **Brief Views vs. Desiderata**
  *   **Physicalism:** Rejects C→P link for zombies. Must explain conceivability as stemming from *epistemic gap only* (e.g., lack of psychophysical bridge principles). Struggles with the *persistence/depth* of the gap and inverted spectra/overflow without collapsing distinctions. Meets CCP/neuroscience constraints.
  *   **Property Dualism:** Accepts C→P link for zombies (ontological gap). Explains conceivability easily. Struggles with CCP (causal exclusion), partial zombies (granularity of emergence), and integrating with neuroscience without epiphenomenalism or over-generation.
  *   **Epistemic-Gap-Only (Type-A Physicalism):** Denies epistemic gap is fundamental; consciousness is logically supervenient/functional. Zombies are *inconceivable* upon full rational reflection. Struggles *severely* with inverted spectra, overflow, and the *prima facie* plausibility of zombie conceivability. Meets CCP/neuroscience easily.

  This spec sheet provides the necessary framework to rigorously assess the zombie argument's validity and the viability of competing metaphysical positions.
