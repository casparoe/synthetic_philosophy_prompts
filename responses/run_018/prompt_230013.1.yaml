prompt: |-
  You are a moral philosopher who specializes in metaethics and moral psychology and who is skilled at turning philosophical distinctions into practical guidance for non-philosophers. Work through the request carefully before writing; begin by brainstorming the main ways a piece of left–right moral psychology can go wrong when it is used to reach a normative conclusion, then build the procedure from that list.

  I am the standards editor at a large online magazine that publishes weekly opinion and analysis on political polarization. A recurring problem: writers pitch pieces that cite moral foundations theory—the finding that self-described liberals and conservatives weight a set of moral "foundations" (roughly care, fairness, loyalty, authority, sanctity, and sometimes liberty) differently—and then conclude that one side's moral outlook is more complete, more balanced, less self-serving, or more likely to be correct. Please write a reusable procedure my editorial team can run on any such pitch or draft.

  The procedure should be a checklist of ordered questions, aim for 8–12. For each question, specify what counts as a sufficient answer to move on; where the procedure should stop and rule that the piece cannot support its normative claim as written; and where the question is a values question the editor or the publication must settle rather than something the psychology can settle. The procedure should make the is–ought step explicit: a psychological difference between left and right is, by itself, neither evidence that one side is right nor evidence that the difference is mere bias. It should flag the common failure modes—for example, moving from descriptive breadth of foundations to normative completeness, treating an explanation of a view as a debunking of it or as a vindication of it, assuming the six foundations are the right or exhaustive list, and using average group differences to license conclusions about individuals or particular policies. It should also be honest about the narrow conditions, if any, under which a descriptive moral-psychological finding can properly bear on a normative dispute.

  Then run the procedure on three hypothetical submissions:

  1. A piece claiming that because conservative participants in the classic studies rate all the foundations as relevant while liberal participants rate mostly care and fairness, conservative moral judgment is more comprehensive and therefore more likely to be correct.
  2. A piece claiming that because both sides rate care and fairness highly and disagree only about how to apply them, the left–right moral divide is smaller than assumed, so majoritarian aggregation of both sides' shared values settles most contested policy questions.
  3. A piece claiming the reverse of the first: that the extra foundations are rationalizations for in-group bias, and therefore liberal moral judgment is more likely to be correct.

  For each, say what the procedure would require before publication and where the editor is left making a value call. At least one of the three should produce a verdict a publication like ours would rather not hear, and say so plainly.

  The procedure will be used by editors without philosophy training, in under 30 minutes, on pieces that reach a large audience; it must be defensible to the editor-in-chief and to readers who disagree with our own politics, and it must not rely on external databases or citation checks, which we handle separately.

  End with a short self-audit: which argument or consideration would most change the procedure's verdicts if it were established or abandoned, and where is the procedure's reasoning most likely to fail?

  Hard limit: 1,500 words for the whole response, including the checklist, the three worked examples, and the self-audit.
reasoning: |-
  Okay, the user is asking me to create a procedural checklist for editors at an online magazine that deals with political polarization. They need a way to evaluate opinion pieces that use moral foundations theory to make normative claims about left-right political differences. This seems like a complex request that combines metaethics, moral psychology, and practical editorial guidance.

  The core challenge here is the is-ought problem - how can descriptive findings about moral psychology support normative conclusions about which side is "correct"? I need to identify the main ways this reasoning can go wrong. From my knowledge of moral foundations theory and metaethics, I recall several common pitfalls:
  - Equating descriptive breadth with normative superiority
  - Treating explanations as debunking or vindicating moral views
  - Assuming the six foundations are exhaustive or equally valid
  - Overgeneralizing from group averages to individuals or policies
  - Confusing psychological origins with moral justification

  As a moral philosopher specializing in metaethics, I should create a checklist that makes these pitfalls explicit. The procedure needs to be practical for non-philosophers - around 8-12 questions that can be applied in under 30 minutes. Each question should specify what counts as sufficient answer, when to stop the piece, and where value judgments are required.

  For the structure, I'll organize the checklist into ordered questions that progressively address the key issues:
  1. First clarify what normative claim is being made
  2. Then examine whether the argument commits the is-ought fallacy
  3. Check for overgeneralization from groups to individuals
  4. Assess whether psychological explanations are treated as debunking/vindicating
  5. Evaluate assumptions about the foundations themselves
  6. Consider alternative explanations
  7. Identify where value judgments are unavoidable

  The user also wants me to test this on three hypothetical submissions. I'll choose examples that represent common problematic arguments:
  1. Conservative "comprehensiveness" argument
  2. False consensus/majoritarian argument
  3. Liberal "rationalization" argument

  I'll make sure at least one gets rejected - probably the majoritarian one since it makes strong assumptions about shared values. For each, I'll show how the checklist would identify flaws and where editorial value judgments come in.

  Finally, I need a self-audit highlighting what could change the procedure's verdicts. The biggest factor would be if moral foundations theory itself were invalidated, though the checklist's core logic about is-ought would remain. The procedure might struggle most with cases where psychological findings genuinely relate to rationality (e.g., cognitive biases), but I'll note that's rare in moral disputes.

  I'll keep the whole response under 1,500 words while ensuring the checklist is actionable and the examples demonstrate its application clearly. The tone should be professional but accessible for editors without philosophy training.
answer: |-
  ## Moral Psychology Editorial Checklist: Evaluating Normative Claims from Foundations Theory

  **Core Principle:** Descriptive findings about *how* groups form moral judgments cannot, alone, determine *which* judgments are correct or superior. This checklist identifies flaws in reasoning from "is" (psychological differences) to "ought" (normative superiority).

  1.  **What explicit normative claim is made?** (e.g., "Side X's outlook is more correct/balanced/less biased.")
      *   *Sufficient:* Clear statement of the claim (e.g., "conservative morality is more comprehensive," "liberal morality is less biased").
      *   *Stop:* No clear normative claim. Proceed only if implicit claim is clarified.
      *   *Value Call:* None. (Clarification step)

  2.  **Does the argument rely *solely* on descriptive findings (e.g., group differences in foundation endorsement) as evidence for its normative claim?**
      *   *Sufficient:* Argument explicitly uses other evidence (e.g., philosophical argument, policy outcomes, consistency with other values) *alongside* the psychology. Move to Q3.
      *   *Stop:* Yes, relies solely on descriptive findings. (Pure Is-Ought Fallacy). *Piece cannot support claim as written.*

  3.  **Does the argument treat the *presence*, *absence*, or *relative weight* of a foundation in a group's psychology as inherently proving its normative *validity* or *invalidity*?** (e.g., "Having more foundations = more complete morality," "Lacking a foundation = moral deficiency," "Higher weight = more valid").
      *   *Sufficient:* No. The argument uses the psychology descriptively and provides *independent justification* for why the presence/absence/weight *should* matter normatively. Move to Q4.
      *   *Stop:* Yes. (Foundations-as-Normative Fallacy). *Piece cannot support claim as written.*

  4.  **Does the argument treat explaining *why* a group holds a view (e.g., evolutionary origins, socialization) as sufficient to *debunk* (discredit) or *vindicate* (prove correct) that view?**
      *   *Sufficient:* No. Explanation is presented neutrally, and debunking/vindication relies on separate normative arguments. Move to Q5.
      *   *Stop:* Yes. (Genetic Fallacy / Explanation-as-Justification Fallacy). *Piece cannot support claim as written.*

  5.  **Does the argument assume the specific 5-6 foundations are the exhaustive, universal, or objectively "correct" list of moral foundations?**
      *   *Sufficient:* No. Acknowledges the list is descriptive/evolved, not prescriptive. OR, argues independently *why* this specific list is normatively relevant. Move to Q6.
      *   *Stop:* Yes, assumes the list is exhaustive/normative without justification. (Foundations-Reification Fallacy). *Piece cannot support claim as written.*

  6.  **Does the argument overgeneralize from *average group differences* to conclusions about *individuals* (e.g., "This conservative will value authority highly") or *specific policies* (e.g., "Therefore Policy Y is justified")?**
      *   *Sufficient:* No generalizations made. OR, generalizations are qualified (e.g., "tends to," "on average") and the link to individuals/policies is argued separately with evidence. Move to Q7.
      *   *Stop:* Yes, makes unsupported generalizations. (Ecological Fallacy / Overgeneralization). *Piece cannot support claim as written.*

  7.  **Does the argument acknowledge plausible counter-interpretations of the psychological data?** (e.g., "Low endorsement" might mean rejection, irrelevance, or different interpretation; "High endorsement" might reflect bias or genuine value; group differences might reflect framing, not core values).
      *   *Sufficient:* Yes, acknowledges and addresses key counter-interpretations relevant to its claim. Move to Q8.
      *   *Stop:* No, ignores obvious counter-interpretations. (Selective Evidence Fallacy). *Piece cannot support claim as written.*

  8.  **Does the argument conflate *psychological* balance/comprehensiveness with *normative* balance/comprehensiveness?** (e.g., "Using more foundations = more balanced judgment").
      *   *Sufficient:* Clearly distinguishes psychological scope from normative adequacy. Argues *why* psychological comprehensiveness *should* imply normative superiority. Move to Q9.
      *   *Stop:* Yes, directly equates them without justification. (Scope-to-Norm Fallacy). *Piece cannot support claim as written.*

  9.  **Does the argument rely on the idea that one side's psychology is "less biased"? If so, is "bias" defined, and is the evidence for reduced bias independent of the normative claim?**
      *   *Sufficient:* "Bias" is clearly defined (e.g., self-serving, ignores relevant facts). Evidence for reduced bias is provided separately from the normative claim itself. Move to Q10.
      *   *Value Call:* Defining what constitutes problematic "bias" in moral judgment often requires value judgments about rationality or objectivity. *Editor/Publication must decide if the definition and evidence are persuasive/acceptable.*
      *   *Stop:* "Bias" is undefined or used circularly (e.g., "They are biased because they're wrong"). *Piece cannot support claim as written.*

  10. **Does the argument acknowledge that resolving the normative claim ultimately requires *philosophical* or *value-based* argumentation beyond the psychological findings?**
      *   *Sufficient:* Explicitly states that psychology describes *how* judgments are made, not *which* are correct, and that normative justification lies elsewhere. *Piece may proceed if previous checks passed.*
      *   *Value Call:* The ultimate normative argument rests on values the publication must endorse or reject. *Editor/Publication must evaluate the core philosophical argument.*
      *   *Stop:* Implies or states that the psychology alone settles the normative question. *Piece cannot support claim as written.*

  **Narrow Conditions for Relevance:** Descriptive moral psychology might *indirectly* bear on normative disputes if:
  *   It reveals clear *procedural irrationality* (e.g., blatant self-contradiction, ignoring known facts) specific to one group's *process* (not the *content* of their values).
  *   It identifies psychological mechanisms that demonstrably *prevent* engagement with relevant moral reasons (e.g., extreme dehumanization). *This is rare and requires strong, specific evidence beyond foundation endorsement differences.* Even then, it doesn't prove the *opposing* view is correct, only that *this process* is flawed.

  ---

  **Application to Hypothetical Submissions:**

  1.  **Claim: Conservative judgment is more comprehensive/correct.**
      *   Q1: Clear claim (Comprehensiveness → Correctness). Pass.
      *   Q2: Relies solely on endorsement patterns? **Yes. Stop.** (Pure Is-Ought). Cannot publish as-is. Requires independent normative argument for why psychological comprehensiveness equals normative superiority.
      *   *Editor Value Call:* If revised, Q9/Q10 become crucial: Is psychological comprehensiveness normatively valuable? Why? Requires philosophical defense.

  2.  **Claim: Left-right divide is small; shared values settle policy via majority.**
      *   Q1: Clear claim (Shared values + majority settle policy). Pass.
      *   Q2: Relies partly on psychology (shared care/fairness), but adds aggregation method. Pass.
      *   Q3: Treats presence of care/fairness as normatively valid? Implicitly yes ("shared values"). **Stop.** (Foundations-as-Normative). Doesn't justify why *these* shared foundations *should* be the basis for policy, ignoring others. Assumes majoritarianism is correct.
      *   Q6: Overgeneralizes? **Yes.** Ignores that "high endorsement" masks deep disagreement on *what care/fairness mean* (e.g., equality vs. proportionality, individual vs. group focus). Stop. Cannot publish as-is.
      *   *Editor Value Call:* Majoritarianism itself is a contested value. Requires defense. *This is the verdict the publication might "rather not hear" as it challenges a common assumption of common ground.*

  3.  **Claim: Liberal judgment is less biased/correct; conservative foundations are rationalizations.**
      *   Q1: Clear claim (Extra foundations = rationalizations → Liberal Correct). Pass.
      *   Q2: Relies solely on psychology? **Yes.** (Implies origins explain away validity). Stop. (Is-Ought + Genetic Fallacy). Cannot publish as-is.
      *   Q4: Treats explanation (rationalization) as debunking? **Explicitly Yes.** Stop. (Genetic Fallacy).
      *   Q9: "Bias" claim? Yes. Undefined/used circularly (rationalization=bias because foundations are invalid). Stop.
      *   *Editor Value Call:* Requires independent argument defining bias and proving liberal processes are less biased *and* that this implies correctness. Highly value-laden.

  ---

  **Self-Audit:**

  1.  **Argument Changing Verdicts:** If it were established that **specific moral foundations are inherently linked to clear, uncontroversial criteria of procedural rationality or cognitive bias** (e.g., high Sanctity endorsement *always* correlates with objectively measurable motivated reasoning in controlled tasks), this could make Q9 arguments more plausible in specific cases. Conversely, abandoning the core structure of MFT (e.g., showing the foundations aren't psychologically real or distinct) would invalidate many arguments using it descriptively, though the *is-ought* logic of the checklist would remain sound.
  2.  **Likely Failure Point:** The procedure is most vulnerable when **psychological findings genuinely intersect with procedural rationality**, particularly regarding **cognitive biases**. Distinguishing a genuine procedural flaw (e.g., consistent ignoring of counter-evidence) from a mere *difference* in foundational weighting or value prioritization is extremely difficult. Q9 is the critical but weakest filter here, heavily reliant on the editor's (or publication's) judgment about what constitutes a relevant "bias" for moral judgment, which is itself a contested philosophical question. The procedure might fail to catch a sophisticated but flawed argument that dresses a value judgment about foundations as an objective claim about rationality.
