answer: |-
  (As methodological individualist)  
  You're conflating *causal mechanisms* with *explanatory shorthand*. When economists say different property laws cause divergent outcomes, they're describing how individuals *respond* to rule structures—structures which themselves exist only as *sustained patterns of individual expectations and actions*. Those rules aren't magic: they're reproduced daily by individuals interpreting, enforcing, or complying based on their beliefs and incentives. Different defaults alter individual cost-benefit calculations, but the causal engine remains individual choice under constraints. My core claim is ontological: institutions *are* nothing but complex equilibria of individual activity, so while group-level labels are pragmatically useful, full explanation requires tracing how micro-behaviors aggregate and stabilize—in principle, always reducible.  

