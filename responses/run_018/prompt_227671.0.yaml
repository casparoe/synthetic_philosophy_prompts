  Let me unpack their core concerns: First, they want to know if the asymmetry leads to absurd extremes when applied consistently. Second, they're worried about the non-identity problem undermining person-affecting foundations. Third, they're concerned about slippery slopes to stronger anti-natalist positions. Fourth, they question whether the intuition itself might be psychologically unreliable.

