prompt: |-
  You are a philosopher of law and logic who also understands how voluntary organisations actually draft and live under their constitutions. Before you write anything, please brainstorm in private: enumerate every way you can think of in which a system of rules that contains its own amendment procedure can degenerate, deadlock or quietly change its own identity, then divide those failures into the ones that are generic to any rule system — vagueness, bad faith, low turnout, people not reading — and the ones that exist *only* because the rules are able to refer to and alter themselves. Throw the first pile away. Then build the specification out of what is left. Take your time and don't settle for the first framing that occurs to you.

  I should be honest about where I'm coming from: I have no academic background at all — I work in freight forwarding — but for the last six years I've been one of the volunteer directors of a community-owned pub with about four hundred members, and I've ended up as the person who keeps the rulebook. Our rules can be amended by member vote, which sounds harmless until you've watched it go wrong. We have had: a single motion that lowered the amendment threshold from a two-thirds majority to a simple majority *and* in the same breath authorised the transfer of a piece of land, leaving us unable to say afterwards whether it had validly passed under the old rule or the new one (I call this the piggyback motion, but the label is mine); a vote to lower the quorum for constitutional amendments that was itself held at a meeting whose turnout satisfied only the new, lower quorum (borrowed validity); a clause protecting our community-benefit rule from amendment except by a ninety per cent vote at two consecutive AGMs, which a later ordinary majority simply deleted before rewriting the rule it was guarding (the hollow lock); a repeal of the audit rule that left the accounts rule referring to something that no longer exists, alongside a membership change that nobody can now say whether it applies to people who joined under the old wording (orphaned dependencies and residue); and a thinly attended meeting that raised the threshold for reversing its own decision, so that a change nobody much wanted has become very hard to undo (the ratchet). Someone told me there is a parlour game built entirely around this sort of thing — Nomic, I think it is called — which is how I found out that other people have noticed the problem.

  What I want from you is not a model constitution, and not a reading list or citations: I have no library access and no interest in being told which names to look up, I want the arguments. I want the desiderata — the list of things any self-amending system of rules must get right, with the concrete failure behind each requirement, and the cases it has to be able to adjudicate. Please assume there is no external enforcer: nothing outside the rulebook settles whether an amendment was validly made, so the system has to be self-policing and usable by volunteers who will not read it carefully. Mark each requirement as non-negotiable or as a preference of a particular temperament, and say which. Pay particular attention to two things I suspect are at the centre of it: what the system must stipulate about the *initial* rules and the initial amendment procedure before any amendment has yet been made, and what it must say about an amendment's validity when the procedure used to make it is itself what the amendment changes. Then, and this is the part I most want, tell me which pairs of requirements cannot both be satisfied — if the list turns out to describe something impossible, that is a real answer and I would rather know it — and identify the single requirement that excludes the largest number of otherwise attractive designs. If there is room afterwards, a short scorecard for three or four obvious approaches (a hard-coded unamendable core, a tiered structure with entrenched clauses, and full mutability in which even the amendment rule is up for ordinary amendment) would be useful, but the criteria are the deliverable, not the scoring. About nine hundred words, British English, and a table is fine if it helps.
reasoning: |-
  Okay, let me approach this systematically. The user is a practical person dealing with real-world constitutional problems in a community pub, so abstract theory needs grounding in concrete failures they've experienced. Their examples (piggyback motions, borrowed validity etc.) reveal specific vulnerabilities in self-amending systems that I need to categorize carefully.

  First, I'll mentally separate generic governance failures (like low turnout) from uniquely self-referential problems. The key is identifying issues that only arise because rules can modify their own validity conditions. For instance:
  - The piggyback motion exploits simultaneous changes to procedure and substance
  - Borrowed validity involves procedures that retroactively justify themselves
  - The hollow lock shows how amendment safeguards can be circumvented
  - Orphaned dependencies demonstrate ripple effects of incomplete changes
  - Ratchet effects exploit temporal sequencing of rule changes

  Now considering core requirements for any self-amending system. Non-negotiables must include:
  1) Explicit initial conditions (no ambiguity about starting rules)
  2) Strict separation of procedural and substantive changes
  3) Sequencing rules for interdependent amendments
  4) Comprehensive dependency tracking
  5) Protection against circular validity claims

  The tension points become clear when analyzing trade-offs. For example:
  - Allowing simultaneous amendments creates piggyback risks
  - Permitting procedural retroactivity enables borrowed validity
  - Full mutability risks hollow locks through meta-amendments

  I'm particularly focused on the chicken-and-egg problem of amending amendment procedures. This seems the central paradox where most systems fail. The solution space appears constrained by whether we allow:
  A) Procedural changes to apply to their own enactment (risky)
  B) Delayed application of procedural changes (complex)
  C) Absolute procedural entrenchment (inflexible)

  Each approach has failure modes demonstrated by the user's cases. I'll structure the output around these irreducible tensions, highlighting which requirements conflict fundamentally. The audit trail requirement might be the most exclusionary - it demands more rigor than volunteer organizations typically maintain.
answer: |-
  ## Desiderata for Self-Amending Rule Systems: Addressing Self-Referential Failure Modes

  Based on your concrete experiences and the intrinsic paradoxes of self-reference, here are the core requirements a robust system must address. Failures marked `[N]` are **Non-Negotiable**; others reflect governance preferences. Focus is solely on failures unique to *self-amendment*.

  ### Foundational Non-Negotiables
  1.  **Explicit Initial Grounding `[N]`:**
      *   *Failure Prevented:* "Borrowed Validity" & procedural ambiguity at inception.
      *   *Requirement:* The initial rule-set MUST unambiguously define:
          *   The starting amendment procedure (e.g., threshold, quorum, meeting type).
          *   The scope of amendable rules (including the amendment rule itself).
          *   A definitive source-of-truth copy of the valid constitution at T=0.
      *   *Adjudication Needed:* What constitutes valid proof of the "as adopted" initial rules?

  2.  **Separation of Procedural & Substantive Changes `[N]`:**
      *   *Failure Prevented:* "Piggyback Motions" (simultaneous change to procedure and substance).
      *   *Requirement:* A motion MUST be *either*:
          *   Purely substantive (changes rules *other* than the amendment procedure), OR
          *   Purely procedural (changes *only* the amendment procedure itself).
      *   *Adjudication Needed:* Does a motion attempt to alter both procedure and substance in a single vote?

  3.  **Sequencing of Interdependent Amendments `[N]`:**
      *   *Failure Prevented:* Self-referential validity paradoxes ("Borrowed Validity", "Ratchet" application timing).
      *   *Requirement:* The procedure *used to enact* an amendment MUST be the procedure *valid at the time the amendment process is formally initiated* (e.g., when notice is properly given). Changes to the procedure adopted *during* an amendment process only apply to *subsequent* processes.
      *   *Adjudication Needed:* What is the definitive "point of initiation"? Did a procedural change occur *during* the process of enacting another amendment?

  4.  **Comprehensive Dependency Tracking `[N]`:**
      *   *Failure Prevented:* "Orphaned Dependencies" & "Residue" (references to repealed rules, ambiguous application).
      *   *Requirement:* The system MUST mandate explicit handling of:
          *   **References:** Any amendment altering/removing a rule MUST explicitly address all rules that reference it (e.g., "Rule 15 is repealed; references to Rule 15 in Rules 7b and 22a are hereby deleted").
          *   **Temporal Application:** Any amendment changing membership qualifications, rights, or obligations MUST explicitly state whether it applies retrospectively to existing members or only prospectively to new members.
      *   *Adjudication Needed:* Does the amendment text adequately resolve all references and temporal application? What is the default state for unresolved references/residue (e.g., does the reference become void, or does it imply reinstatement of the referenced rule?)?

  ### Critical Preferences (Reflecting Governance Temperament)
  5.  **Amendment Rule Mutability (Preference):**
      *   *Failure Prevented:* "Hollow Locks" (circumventing entrenched protections via meta-amendment).
      *   *Choices:*
          *   **Full Mutability:** Amendment rule can be changed via itself. *Risk:* Enables "Hollow Locks" unless combined with strong entrenchment.
          *   **Tiered Entrenchment:** Amendment rule requires a higher threshold (e.g., 90% at two meetings) than ordinary rules. *Risk:* Can still be changed by its *own* standard, potentially enabling slow erosion ("boiling frog").
          *   **Immutable Core:** Amendment rule and core principles (e.g., community benefit) are unamendable. *Risk:* Inflexibility, potential irrelevance.
      *   *Adjudication Needed:* Is an attempt to alter an entrenched rule using the *wrong* procedure valid? Can the entrenchment rule itself be amended using the *ordinary* procedure?

  6.  **Audit Trail & Accessibility (Strong Preference):**
      *   *Failure Prevented:* Degeneration through complexity, "orphaned dependencies" going unnoticed.
      *   *Requirement:* The system MUST mandate maintaining a single, authoritative, chronologically versioned copy of the constitution, incorporating amendments *only* upon final validation. All amendments MUST be published verbatim alongside the consolidated text. Plain language summaries strongly recommended.
      *   *Adjudication Needed:* Is the published "official" version correct? When does an amendment formally enter the consolidated text?

  7.  **Conflict Resolution Mechanism (Preference):**
      *   *Failure Prevented:* Deadlock over validity disputes.
      *   *Requirement:* A defined, accessible internal process (e.g., a rules committee, arbitration by past officers) MUST exist to adjudicate challenges to amendment validity or rule interpretation. *Default:* Reliance on good faith and consensus carries high risk of schism.
      *   *Adjudication Needed:* Who has standing? What is the standard of review? How binding is the decision?

  ### Irreconcilable Tensions & The Key Excluder
  *   **Impossible Pair:** **Full Mutability (5a) + Strong Protection Against Hollow Locks (5b/c)**. If the amendment rule is fully mutable, it can *always* be changed to lower the protection on another rule in a subsequent step. True entrenchment requires *some* aspect (either core rules or the *highest* amendment threshold) to be immutable or require an external/super-majority standard.
  *   **The Key Excluder:** **Sequencing of Interdependent Amendments `[N]` (Requirement 3)**. This requirement fundamentally excludes the most intuitively simple designs where the procedure in force *at the moment of the vote* applies. It forces complexity (defining "initiation") but is essential to prevent self-validating amendments ("Borrowed Validity") and "Ratchet" effects. Designs ignoring sequencing are fatally vulnerable to these self-referential paradoxes.

  ### Scorecard of Common Approaches
  | Approach                     | Handles Piggyback? | Prevents Borrowed Validity? | Prevents Hollow Locks? | Prevents Orphans/Residue? | Flexibility | Complexity |
  | :--------------------------- | :----------------: | :-------------------------: | :--------------------: | :-----------------------: | :---------: | :--------: |
  | **Hard-Coded Core (Immutable)** | Yes (if core includes amendment rule) | Yes (if core includes sequencing) | Yes                   | No (unless core mandates tracking) | Very Low    | Low        |
  | **Tiered Entrenchment**      | Only if Separation (Req 2) enforced | Only with Sequencing (Req 3)      | **No** (Meta-amendment risk) | Only with Tracking (Req 4) | Medium      | Medium-High |
  | **Full Mutability**          | Only if Separation (Req 2) enforced | Only with Sequencing (Req 3)      | **No**                | Only with Tracking (Req 4) | Very High   | High        |
  | **Sequencing + Separation (Req 2 & 3)** | **Yes**            | **Yes**                     | Requires Entrenchment Choice | Requires Tracking (Req 4) | Depends     | **High**   |

  **Conclusion:** A robust system is *possible* but inherently complex. Non-negotiables 1-4 are essential foundations. The core tension lies in balancing flexibility (Full Mutability) with genuine protection (requiring some form of higher-order entrenchment or immutability). Requirement 3 (Sequencing) is the linchpin preventing immediate self-referential paradoxes but imposes significant operational burden. For your pub, prioritizing **Tiered Entrenchment** (with a very high bar for changing the amendment rule itself) **plus** strict adherence to **Separation, Sequencing, and Dependency Tracking** offers the best balance, accepting that "Hollow Locks" remain a risk mitigated only by member vigilance and the high threshold. The **Audit Trail (Req 6)** is crucial for volunteer sustainability. There is no perfect solution, only carefully managed trade-offs against self-referential failure.
