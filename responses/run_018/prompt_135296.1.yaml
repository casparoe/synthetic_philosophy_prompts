answer: |-
  Here's a defense of the "affective outsourcing" interpretation of Rousseau's *Letter to d'Alembert*, addressing the redundancy objection:

  **Core Argument: Affective Outsourcing as the Key to Rousseau's Condemnation**

  Rousseau's critique of theater is best understood not as a blanket rejection of representation, but as a focused attack on a specific *structural feature*: the **institutionalized outsourcing of fundamental civic emotions to paid professionals**, thereby absolving citizens of the duty to cultivate and express those emotions themselves within the collective life of the republic. This is "affective outsourcing."

  1.  **Distinguishing Representation from Outsourcing:**
      *   Rousseau explicitly *endorses* certain forms of representation and spectacle: civic festivals, public games, open-air dances, patriotic ceremonies. These involve citizens actively *participating* in representing their shared identity, values, and emotions. The representation *is* the collective enactment.
      *   His target is the *professional, commercial theater* where a fundamental division occurs:
          *   **Emotional Labor:** Actors are *paid* to professionally simulate core civic sentiments (pity, patriotic fervor, moral outrage) with the specific goal of eliciting those feelings in an audience.
          *   **Passive Consumption:** Citizens *pay* to be spectators, experiencing these emotions vicariously and passively. They outsource the labor of feeling and expressing these sentiments to specialists.
          *   **Separation:** A physical and social barrier (the stage, the paying audience) separates the "performers" of emotion from the "consumers," dissolving the essential unity of the citizenry.

  2.  **Why Outsourcing Undermines Republican Virtue:**
      *   **Hollowing Out Civic Sentiment:** For Rousseau, genuine virtue isn't passive feeling; it's the *active* expression of moral sentiment *in concert with fellow citizens*. Pity felt in a theater seat doesn't translate into helping a neighbor; patriotic fervor stirred by an actor isn't the same as the fervor forged through collective struggle or celebration *alongside* comrades. Theater allows citizens to *feel* virtuous without *acting* virtuously.
      *   **Commodification of Emotion:** Paying for emotions turns core civic sentiments into commodities. This corrupts the sentiment itself – it becomes an external product to be consumed, not an internal disposition cultivated through shared civic life and duty. Virtue cannot be bought or sold.
      *   **Erosion of Collective Capacity:** By outsourcing the expression of key sentiments, citizens atrophy their own capacity to generate and sustain these feelings collectively. The muscle of collective emotional expression weakens through disuse. Republican virtue requires citizens to be *producers* of the shared emotional life of the city, not mere consumers.
      *   **Creating Dependency & Hierarchy:** The theater creates a class of emotional specialists (actors) and a passive audience. This introduces an artificial hierarchy and dependency alien to the ideal of equal, self-governing citizens. True civic festivals have no such distinction – everyone is simultaneously performer and audience.

  3.  **Explaining the Permissible/Corrupting Distinction:**
      *   **Civic Festivals:** These are the antithesis of affective outsourcing.
          *   **Collective Enactment:** Citizens *are* the performers. Dancing, singing, competing, commemorating *together* is the expression of shared sentiment.
          *   **Non-Remunerated:** Participation is a civic duty and joy, not a paid profession. The emotion arises organically from participation, not purchased simulation.
          *   **Self-Sufficiency:** The community generates its own emotional bonds and reinforces its own values *through its own collective action*. It strengthens the "general will" by embodying it.
      *   **Theatrical Performance:** Embodies affective outsourcing.
          *   **Division of Labor:** Professionals *do* the emotional work for pay.
          *   **Passive Consumption:** Citizens *pay* to have feelings stimulated externally.
          *   **External Dependency:** The source of emotional stimulation is external (the actors, the script, the playwright – often foreign influences like French theater) and commodified.
      *   **The Sharp Distinction:** The crucial difference isn't *what* emotion is represented (though content matters), but *how* and *by whom* it is generated and experienced. The corrupting element is the *structure* that severs the citizen from the active, collective *production* of civic sentiment.

  **Addressing the Redundancy Objection**

  *   **Objection:** If Rousseau endorses powerful collective rituals (festivals) that fulfill the need for shared emotion and representation, why is banning theater necessary? Aren't the festivals sufficient? Wouldn't the positive force of the festivals naturally crowd out the need for the corrupting theater, making the ban redundant?
  *   **Response:** Rousseau would argue the ban is *essential*, not redundant, precisely because of the *structural threat* posed by affective outsourcing:
      1.  **Competing Models:** Theater offers a fundamentally different, easier, and more seductive model for experiencing civic emotions: passive consumption versus active participation. It provides the *illusion* of virtue without the effort. Festivals require work and engagement; theater offers effortless catharsis. The easier option will inevitably attract citizens, potentially draining energy and attendance from the more demanding, virtuous festivals.
      2.  **Corrupting Influence:** The *existence* of professional theater normalizes the commodification of sentiment and the spectator role. Even if citizens attend festivals, the passive mindset cultivated by theater ("I pay to have feelings evoked in me") can infiltrate and subtly corrupt the participatory spirit needed for genuine festivals. They might start to view festivals more as spectacles to observe than as events in which they *must* enact their part.
      3.  **Undermining Self-Sufficiency:** Affective outsourcing, by its nature, creates dependency. Allowing a professional theater to exist alongside civic festivals teaches citizens that core sentiments *can* and *should* be provided by specialists. This directly attacks the republican ideal of the citizenry as self-sufficient in generating its own moral and emotional life. The festival's power relies on the *absence* of this outsourcing mindset.
      4.  **Specific Threat to Geneva:** Rousseau saw Geneva as uniquely vulnerable (due to its small size and specific Calvinist republican traditions) to the corrosive influence of imported French culture embodied in professional theater. The ban wasn't just about preventing a negative; it was a proactive defense of the specific, fragile social ecology required for Geneva's virtuous festivals to flourish *without* being undermined by a structurally incompatible and inherently corrosive alternative.
      5.  **Preventing Mimetic Corruption:** While not the *primary* reason, Rousseau *was* concerned about imitation of vice. The redundancy objection focuses only on the positive festivals. The ban also served the negative purpose of preventing the explicit representation of morally dubious characters and situations that professional theater often featured, which could be an *additional* corrupting factor.

  **Conclusion**

  Rousseau's condemnation of theater in the *Letter to d'Alembert* is most coherently understood as an attack on the *affective outsourcing* inherent in its professional, commercial structure. This outsourcing severs the vital link between civic sentiment and collective, unremunerated action, hollowing out the essence of republican virtue. While civic festivals provide the positive model for generating shared emotion through active participation, the existence of professional theater poses an existential threat by offering a seductively easier, passive, commodified alternative that normalizes spectatorship and undermines the citizenry's self-sufficiency in emotional labor. The proposed ban was therefore not redundant but a necessary prophylactic measure to protect the specific social and psychological conditions required for Geneva's fragile republican virtue to thrive, ensuring that the collective enactment of sentiment remained the sole domain of the citizens themselves.
