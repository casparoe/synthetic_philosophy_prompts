answer: |-
  Here is the conceptual structure in five items:

  1.  Dirty-handed actions intrinsically violate core moral norms for a greater good, unlike pragmatic compromises that merely sacrifice lesser interests without such transgression.  
  2.  Undoing the harmful act might mitigate consequences but cannot erase the moral residue, as the stain arises from the deliberate choice to enact the wrong, not solely its permanence.  
  3.  A leader who delegates an immoral task inherits the contamination; moral responsibility isn't absolved by delegation, as they remain the authorizing agent.  
  4.  Public confession acknowledges the wrongdoing and bears the stain authentically; it functions as recognition, not moral laundering which would deny or evade the inherent guilt.  
  5.  Resolving the problem likely requires distinct role morality for officeholders, as their unique duties and constraints create conflicts that standard ethical reasoning struggles to adjudicate.
