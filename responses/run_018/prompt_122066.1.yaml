prompt: |-
  ok so my brother just got out of rehab last month and stole like 400 bucks from my savings, and now im trying to figure out if im being unfair holding onto this anger or if thats just part of having a realtionship. i was reading about Strawson's reactive attitutes and the idea that resentment tracks quality of will, not free will in some deep metaphysical sense. it made me think about whether addiciton creates an excuse or just changes how the attitude should feel. can you write a dialogue between two people who actually get this stuff? person A should think reactive attitudes are basically about whether the other person showed disregard for your legitimate expectations, and that addiction doesnt automatically erase that - maybe it just changes the 'volume' of the attitude. person B should think that when someone's capacity for reciprocal recognition is broken by addiction, reactive attitudes are inappropriate, and that feeling sad about broken trust is actually an objective attitude (like Strawson's attitude toward a child or someone mentally ill), not a quieter version of resentment. have them actually respond to each other - like A should ask B whether scaling an attitude is even coherent, and B should explain why the normative gap isnt just a medical excuse. write it casual, like they're talking in my kitchen, not giving lectures. no citations, no 'further reading', just the back-and-forth.
