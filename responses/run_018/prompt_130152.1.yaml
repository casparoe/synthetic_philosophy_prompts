answer: |-
  Here's a decision tree handout designed for your workshop – participants sort themselves by answering concrete cases, revealing their stance on scaling Confucian Role Ethics (CRE):

  ---

  **Confucian Role Ethics: Modern Scaling? Find Your Branch!**

  Answer these questions *based on your gut feeling about the situations*. Don't worry about labels!

  **START: Question 1 (The Root)**
  *   **Situation:** Imagine someone consistently acts perfectly as a manager, parent, and friend, but feels like they're just *playing parts*, not expressing their "true self." Does this seem coherent *or* fundamentally impossible?
      *   **A: Impossible (Roles ARE Your True Self):** Go to **Question 2A**.
      *   **B: Coherent (Roles Are Just Scripts/Behaviors):** Go to **Question 2B**.

  **Branch A: Roles Constitute the Self**
  *   **Question 2A (Scaling Beyond Kin):**
      *   **Situation:** Can a manager genuinely feel a *parent-like* protective obligation (*xiao*-style) towards a junior employee they've mentored for years, even though they aren't family?
      *   **Yes (Obligations Scale):** Go to **Question 3A**.
      *   **No (Obligations Stay Kin-Bound):** → **Leaf: "Family-First Role Ethics" (e.g., Strict Traditionalist Reading)**
          *   *Awkward Commitment:* Modern institutions (companies, states) are fundamentally *instrumental*, never truly relational; your deepest duties stop at the office door/national border.

  **Branch B: Roles Are Behavioral Scripts**
  *   **Question 2B (Nature of Modern Roles):**
      *   **Situation:** Is citizenship more like a deep, lifelong friendship (with inherent duties) *or* more like a mutually beneficial contract (rules only)?
      *   **Deep Friendship (Relational):** Go to **Question 3B**.
      *   **Contract (Transactional):** Go to **Question 3C**.

  **Branch A (Scaling Yes) > Question 3A (Conflict with Rules):**
  *   **Situation:** A manager owes real protection (*xiao*-style) to a junior worker. Protecting them properly (e.g., from burnout, unfair blame) *requires* violating a strict company rule or hurting profits. Is the manager's obligation to the worker *stronger*?
      *   **Yes (Obligations Override Rules):** → **Leaf: "Radical Confucian Institutionalism" (e.g., some modern CRE extensions)**
          *   *Awkward Commitment:* Loyalty to role-partners can *justifiably* require breaking organizational rules or laws, risking chaos/"corruption".
      *   **No (Rules Constrain Obligations):** → **Leaf: "Institutionally Bounded Role Ethics" (e.g., some pragmatic CRE readings)**
          *   *Awkward Commitment:* Ritual/propriety (*li*) within the institution *can* sometimes demand actions that feel like betraying relational depth, risking "hollow rituals."

  **Branch B (Relational Roles) > Question 3B (Conflict with Rules):**
  *   **Situation:** Same as **Question 3A**: Protecting the junior worker relationally means breaking a rule/hurting profits. Is the relational obligation stronger?
      *   **Yes (Relations Override Rules):** → **Leaf: "Modern Relationalism" (e.g., some CARE/CRE blends)**
          *   *Awkward Commitment:* Prioritizing concrete relationships over abstract rules can lead to perceived nepotism or inefficiency in large systems.
      *   **No (Rules Constrain Relations):** → **Leaf: "Procedural Role Ethics" (Unnamed? / Liberal CRE?)**
          *   *Awkward Commitment:* Institutional fairness rules *must* sometimes trump your deepest relational instincts, potentially feeling cold or unjust.

  **Branch B (Transactional Roles) > Question 3C (Contractual Limits):**
  *   **Situation:** Does a manager owe a junior worker *any* protection *beyond* what's explicitly stated in the contract/handbook, *even if* the worker hasn't "earned" it through exceptional performance/loyalty?
      *   **No (Strict Contract):** → **Leaf: "Institutional Contractualism" (e.g., Liberal Minimalism)**
          *   *Awkward Commitment:* No inherent duties exist between manager/worker beyond the deal; "protection" is purely conditional/strategic. Vulnerability isn't inherently binding.
      *   **Yes (Some Inherent Duty Exists):** → **Leaf: "Reciprocal Role Ethics" (e.g., weaker Virtue Ethics / "Humanitarian" Contract)**
          *   *Awkward Commitment:* There *are* minimal duties (like basic care/respect), but they're vague, reciprocal, and easily overridden if the other party "fails" first.

  **EMPTY/UNEXPLORED BRANCHES & NOTES:**

  1.  **A > Scaling No:** While coherent (roles *constitute* but *only* for family), this branch ("Family-First") is largely *unexplored* in modern CRE scaling literature. It's a strict traditionalist holdout.
  2.  **A > Scaling Yes > Rules Override:** This ("Radical Institutionalism") exists. The opposite branch ("Institutionally Bounded") is more common but less radical.
  3.  **B > Transactional > Inherent Duty Exists:** This ("Reciprocal Role Ethics") pushes towards generic virtue ethics/care ethics. It's a *transitional* branch.
  4.  **Incoherent?** Accepting **Roles Constitute (A)** + **Scaling Yes** + **Denying ANY Institutional Mediation (Q3A: No Obligation Survives Conflict)**. This *might* be incoherent: If roles constitute the self *and* scale to institutions, how can institutional rules *completely* negate the constitutive obligations? It likely collapses into **Institutionally Bounded** or reveals deep confusion. *(Flagged as tricky!)*
  5.  **Pairs Hard to Separate:**
      *   **"Institutional Contractualism" (B>Trans>No Duty)** and **"Reciprocal Role Ethics" (B>Trans>Some Duty)** might *both* answer "No" to the manager owing protection beyond contract in Q3C, *if* the "inherent duty" felt weak. Need a finer question on *minimal* care.
      *   **"Reciprocal Role Ethics" (B>Trans>Some Duty)** and **"Procedural Role Ethics" (B>Relational>Rules Constrain)** might *both* answer "No" to obligations overriding rules in conflict situations (Q3A/Q3B), prioritizing the institution. Motivation differs (contract vs. relational propriety), but outcome similar.
      *   **"Institutionally Bounded Role Ethics" (A>ScaleYes>Rules Constrain)** and **"Procedural Role Ethics" (B>Relational>Rules Constrain)** often look *very similar* in practice, despite different roots (constitutive vs. scripts). The "feeling" in Q1 is key.

  ---

  **How to Use:**  
  1.  Read each **Situation**.  
  2.  Follow your gut **Yes/No** answer down the branches.  
  3.  Find your **Leaf**. Read its name and *Awkward Commitment* – does it resonate?  
  4.  **Discuss:** Where did your group land? What do the *awkward commitments* reveal about tensions in applying CRE today? Where are the fuzzy boundaries? What surprised you?
