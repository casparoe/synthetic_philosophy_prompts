  The pressure point is the lack of agency in the transformer system. I'll argue that while the transformer lacks modal commitments, the analogy compresses the functional role of relevance-weighting across domains. This compression allows us to explore how agency might emerge from sub-agential processes. The tension reveals a gradient in the concept of attention rather than a categorical flaw.

