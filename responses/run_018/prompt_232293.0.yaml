prompt: |-
  I am a clinical psychologist at a regional hospital and have recently been put in charge of a new multidisciplinary service for adults with persistent physical symptoms that lack a sufficient structural explanation: chronic widespread pain, functional neurological symptoms, persistent dizziness, and similar presentations. Over the past few years I have become convinced that predictive processing and the free energy principle describe what I see in this clinic better than the older habit of dividing these patients into organic or psychogenic categories. But I cannot hand my colleagues a theory; I need something they can actually run.

  Please write me a reusable, thirty-minute initial-assessment procedure, grounded in predictive processing and active inference, that a physiotherapist, a psychiatric nurse, or a junior doctor could follow without reading the underlying theory. It should be a step-by-step procedure: what to ask or observe first, what a given answer tells you, where a step stops and refers back to a physician, and where a step is a clinical judgment call rather than an inference from the framework. It should distinguish the work done by the person's prior expectations, the confidence assigned to sensory prediction error (especially interoceptive error), and the person's attempts to manage uncertainty through action, including the ways those actions may confirm the very model they are meant to reduce, but it must not use that vocabulary with patients. By the end, the procedure should produce a one-page formulation identifying the most plausible maintaining loop, one intervention aimed at that loop, and a short note on what early evidence would indicate the formulation is wrong. A consultant physician must countersign the formulation before it reaches the patient, so the procedure must flag anything that requires medical review first. My team sees these referrals weekly, and the stakes are real.

  Then run the procedure on two hypothetical referrals, showing each step:
  1. A 41-year-old man with three years of widespread pain and fatigue following a minor road traffic collision, entirely normal imaging and blood tests, high health anxiety, repeated internet searching and requests for reassurance, and progressive avoidance of physical activity.
  2. A 27-year-old woman with panic attacks, constant pulse checking, and avoidance of exercise after one episode of palpitations.

  For at least one of the two, let the procedure deliver an answer the team will not like, for instance discontinuing a reassurance practice the clinic currently regards as kind or standard. Be explicit about what the procedure cannot rule out, including new or previously missed medical disease, about where it could mislead someone without specialist training, and about which parts are value decisions that theory alone cannot settle.

  End your reply with a one-sentence summary of the procedure, formatted as: Summary: <one sentence>.
reasoning: |-
  We are creating a 30-minute initial assessment procedure based on predictive processing and active inference, without using the technical jargon with patients. The procedure is for clinicians (physiotherapist, psychiatric nurse, or junior doctor) to follow step by step. It must:
  1. Assess prior expectations, confidence in sensory errors (especially interoceptive), and actions taken to manage uncertainty.
  2. Produce a one-page formulation with: a maintaining loop, one intervention, and early evidence that the formulation is wrong.
  3. Flag when to refer to a physician (consultant countersigns the formulation).

  The procedure must be reusable and take about 30 minutes.

  Structure of the Procedure:

  I. Introduction (5 minutes)
     - Build rapport, explain the purpose of the assessment.
     - Set the agenda: "We're going to talk about your symptoms, how they affect you, and what you've been doing to cope. This will help us understand what might be keeping the symptoms going and how we can help."

  II. Symptom Exploration (10 minutes)
     A. Current Symptoms:
        - Ask: "Can you describe your main symptoms in your own words? When did they start? How have they changed over time?"
        - Look for: Triggers (if any), pattern of symptoms, and how they fluctuate.

     B. Impact on Life:
        - Ask: "How do these symptoms affect your daily life? What can't you do because of them?"
        - Look for: Avoidance behaviors, functional limitations.

  III. Beliefs and Expectations (5 minutes)
     A. Understanding of Cause:
        - Ask: "What do you think is causing your symptoms? What have you been told by other doctors?"
        - Look for: Prior beliefs (e.g., "I have a hidden injury", "My body is broken", "I have a serious disease"). Note the confidence in these beliefs.

     B. Expectations about the Future:
        - Ask: "What do you think will happen with your symptoms in the future? What are you worried might happen if you don't get treatment or if you do certain activities?"
        - Look for: Catastrophic expectations (e.g., "I might collapse", "I'll get worse", "I'll never recover").

  IV. Coping and Actions (5 minutes)
     A. What They Do to Cope:
        - Ask: "What do you do when the symptoms get worse? What helps you feel better or prevents the symptoms from getting worse?"
        - Look for: Safety behaviors, avoidance, reassurance seeking, resting, checking, etc.

     B. What They Avoid:
        - Ask: "Are there things you've stopped doing because of your symptoms? Activities, places, or situations?"
        - Look for: Avoidance patterns.

  V. Observation and Clinical Judgment (5 minutes)
     - Observe: During the interview, note any signs of distress, pain behaviors, or inconsistencies that might suggest functional overlay or illness behavior.
     - Clinical judgment: Consider if there are any red flags for organic disease (see below) or if the presentation is consistent with a persistent physical symptoms disorder.

  VI. Formulation and Next Steps (5 minutes)
     - Summarize the key points with the patient: "Let me check if I've understood. You have [symptoms], which started [time] and you think they are caused by [belief]. You are worried that [fear] and so you [coping actions] and avoid [activities]. Is that right?"
     - Then, internally (without patient) use the predictive processing framework to identify:
          a) The prior expectation (from III): e.g., "I have a serious disease."
          b) The high precision (confidence) assigned to interoceptive prediction errors: e.g., any bodily sensation (like pain or palpitation) is interpreted as evidence of disease.
          c) The actions (from IV): e.g., avoidance, checking, seeking reassurance. These actions reduce prediction error in the short term (by avoiding the situation that causes the sensation) but reinforce the prior (because the avoidance prevents disconfirmation).

     - Formulate the maintaining loop: e.g., "Belief that symptoms indicate serious disease -> hypervigilance to body sensations -> interpretation of sensations as threatening -> avoidance/reassurance seeking -> no disconfirmation of belief -> belief strengthens."

     - Propose one intervention: Aimed at breaking the loop. For example:
          - If the loop is avoidance: graded exposure to avoided activities without safety behaviors.
          - If the loop is reassurance seeking: reduce reassurance (e.g., limit doctor visits, stop internet searches) and tolerate uncertainty.

     - Early evidence the formulation is wrong: e.g., if the patient tries the intervention and symptoms worsen in a way not explained by the model (e.g., new neurological signs) or if they cannot engage because the intervention is too frightening and no alternative can be found.

     - Flag for medical review: If any red flags (see below) or if the clinician is unsure about an organic cause.

  Red Flags (Require Physician Review):
  - New or progressive neurological deficits.
  - Unexplained weight loss, fever, night sweats.
  - History of cancer or immunosuppression.
  - Symptoms that are strictly unilateral or follow a dermatomal pattern (for pain).
  - Signs of infection or inflammation.
  - Abnormal vital signs or lab results that haven't been explained.

  The procedure must not diagnose but can suggest a formulation. The consultant physician must review the formulation and any red flags.

  Now, run the procedure on two cases:

  Case 1: 41-year-old man with 3 years of widespread pain and fatigue following a minor RTC. Normal imaging and blood tests. High health anxiety, repeated internet searching and requests for reassurance, progressive avoidance of physical activity.

  Case 2: 27-year-old woman with panic attacks, constant pulse checking, and avoidance of exercise after one episode of palpitations.

  For at least one, we'll give an answer the team might not like (e.g., discontinuing reassurance).

  Case 1 Step-by-Step:

  I. Introduction (5 min)
     - Build rapport: "I understand you've been having pain and fatigue for three years since the car accident. We're going to talk about that to see how we can help."

  II. Symptom Exploration (10 min)
     - Symptoms: Widespread pain and fatigue. Started after minor RTC. No change despite normal tests.
     - Impact: Avoids physical activity, reduced work, social withdrawal.

  III. Beliefs and Expectations (5 min)
     - Cause: Believes the accident caused hidden damage that tests haven't found. High confidence: "The doctors must have missed something."
     - Future: Worried that activity will cause permanent damage or make the pain worse. Fears becoming disabled.

  IV. Coping and Actions (5 min)
     - Coping: Rests a lot, avoids any activity that might cause pain, seeks reassurance (doctor visits, internet searches).
     - Avoidance: Avoids exercise, household chores, social activities.

  V. Observation and Judgment (5 min)
     - Observation: Appears anxious, mentions multiple tests and frustrations. No red flags (all tests normal, no systemic symptoms).

  VI. Formulation (5 min)
     - Prior: "I have hidden structural damage from the accident."
     - High precision on interoceptive error: Any pain or fatigue is interpreted as evidence of damage, even if minor.
     - Actions: Avoidance and reassurance seeking. Avoidance prevents disconfirmation (if he did activity and nothing bad happened, it might challenge the belief). Reassurance seeking temporarily reduces anxiety but reinforces the need for more reassurance because the underlying belief isn't challenged.

     Maintaining loop:
        Belief: "Activity causes damage" -> Hypervigilance to body sensations (pain/fatigue) -> Sensations interpreted as damage -> Avoid activity and seek reassurance -> No disconfirmation (because he doesn't experience activity without harm) -> Belief strengthens.

     Intervention: Graded activity increase without seeking reassurance. Start with very light activity (e.g., 5-minute walk) and gradually increase. Stop checking for symptoms during/after. Stop internet searches and limit doctor visits for reassurance.

     Early evidence wrong: If he tries a small activity and experiences new symptoms (e.g., weakness, numbness) that suggest a neurological issue, or if pain increases in a way that is not typical of deconditioning (e.g., severe swelling, joint instability).

     Flag for medical review: None, as tests are normal and no red flags. But physician must countersign.

  Case 2: 27-year-old woman with panic attacks, constant pulse checking, avoidance of exercise after one episode of palpitations.

  I. Introduction (5 min)

  II. Symptom Exploration (10 min)
     - Symptoms: Panic attacks (with palpitations, breathlessness, dizziness). Started after one episode of palpitations (which was investigated and found to be benign, e.g., ectopic beats). Now constant pulse checking and avoids exercise.
     - Impact: Avoids exercise, avoids situations where panic might occur (e.g., crowded places).

  III. Beliefs and Expectations (5 min)
     - Cause: Believes the palpitations mean her heart is weak or she has an undiagnosed heart condition. Despite normal tests, she is not convinced.
     - Future: Worried that exercise or stress could cause a heart attack or collapse.

  IV. Coping and Actions (5 min)
     - Coping: Checks pulse multiple times a day, avoids exercise, uses relaxation techniques when anxious, seeks reassurance (e.g., from family, or by going to ER if panic is bad).
     - Avoidance: Avoids exercise, caffeine, and stressful situations.

  V. Observation and Judgment (5 min)
     - Observation: Appears healthy, no signs of cardiac distress. Normal physical exam (as per history). No red flags (palpitations were investigated and benign, no syncope, no family history of sudden death).

  VI. Formulation (5 min)
     - Prior: "My heart is unreliable and might stop or cause a heart attack."
     - High precision on interoceptive error: Any change in heartbeat (even normal fluctuations) is interpreted as dangerous.
     - Actions: Pulse checking (which often increases anxiety because she notices normal variations) and avoidance. Avoidance prevents disconfirmation (if she exercised and nothing happened, it might challenge the belief). Reassurance seeking (ER visits) temporarily reduces anxiety but reinforces the belief that the threat is real because she needed to check.

     Maintaining loop:
        Belief: "Heart symptoms are dangerous" -> Hypervigilance to heart sensations -> Sensations interpreted as threat (panic) -> Check pulse and avoid exercise -> No disconfirmation (because she doesn't experience exercise without harm) -> Belief strengthens.

     Intervention: Stop pulse checking and gradually reintroduce exercise. Start with light exercise (e.g., walking) without checking pulse during or after. Also, reduce reassurance (e.g., agree not to go to ER for panic unless new symptoms).

     This might be unpopular: The clinic might currently reassure her that her heart is fine, but the procedure suggests stopping reassurance and pulse checking.

     Early evidence wrong: If during exercise she experiences syncope, chest pain with exertion (not just panic), or new cardiac symptoms (e.g., irregular pulse that is pathological).

     Flag for medical review: None, but physician must countersign.

  What the procedure cannot rule out:
  - New or previously missed medical disease (especially if symptoms change or red flags appear).
  - It might mislead if the clinician does not recognize red flags (so training on red flags is essential).
  - Value decisions: The intervention might cause distress (e.g., asking to stop reassurance). The clinician must balance the potential benefit against the patient's autonomy and current distress. Also, the patient's willingness to engage is a value decision.

  Summary: A 30-minute structured assessment exploring symptoms, beliefs, and coping behaviors to identify a maintaining loop of expectations, sensory sensitivity, and actions, leading to a targeted intervention and early warning signs, with physician oversight for safety.
answer: |-
  ### Predictive Processing-Informed Initial Assessment Procedure (30-Minute)

  **Purpose**: Identify maintaining factors in persistent physical symptoms using predictive processing concepts (without technical terms), formulate a targeted intervention, and flag medical risks.  
  **Who Can Use**: Physiotherapists, psychiatric nurses, junior doctors.  
  **Output**: One-page formulation (maintaining loop, intervention, early failure signs) for physician countersign.  
  **Time Allocation**: Strictly 30 minutes.  

  ---

  #### **Step-by-Step Procedure**  
  *Instructions: Follow sequentially. Use patient’s words. If a step flags "MEDICAL REVIEW," pause and refer to a consultant physician before proceeding.*  

  1. **Introduction and Symptom Mapping (5 minutes)**  
     - **Ask/Observe**: "Describe your main symptoms in your own words. When did they start? What makes them better or worse?"  
     - **Listen For**:  
       - *Onset context* (e.g., minor injury, stressor, or spontaneous).  
       - *Fluctuation patterns* (e.g., linked to activity, stress, rest).  
     - **Stop & Refer (MEDICAL REVIEW) If**:  
       - Red flags: Unexplained weight loss, fever, neurological deficits (e.g., weakness/numbness in a specific pattern), or symptoms worsening despite inactivity.  
     - **Clinical Judgment**: Note if symptoms are inconsistent with known pathophysiology (e.g., non-dermatomal pain, variable tremor).  

  2. **Beliefs About Symptoms (5 minutes)**  
     - **Ask**: "What do you think is causing your symptoms? What are you most concerned might happen if they aren’t treated?"  
     - **Listen For**:  
       - *Prior expectations*: Fixed beliefs about damage/disease (e.g., "hidden injury," "heart defect").  
       - *Confidence in beliefs*: Certainty despite tests (e.g., "Tests missed something").  
     - **Inference**: High confidence in catastrophic beliefs suggests "strong priors" driving symptom interpretation.  
     - **Stop & Refer (MEDICAL REVIEW) If**: New or evolving symptoms not previously evaluated.  

  3. **Symptom Monitoring and Sensitivity (5 minutes)**  
     - **Ask**: "Do you notice small changes in your body? What catches your attention? How do you react?"  
     - **Listen For**:  
       - *Interoceptive focus*: Hypervigilance (e.g., tracking heart rate, scanning for pain).  
       - *Error sensitivity*: Misinterpreting normal sensations (e.g., "Normal aches mean I’m deteriorating").  
     - **Inference**: High attention to body signals amplifies "prediction errors," fueling symptoms.  
     - **Clinical Judgment**: Distinguish adaptive monitoring (e.g., diabetic glucose checks) from maladaptive fixation.  

  4. **Coping Behaviors and Avoidance (5 minutes)**  
     - **Ask**: "What do you do to prevent symptoms or feel safer? What have you stopped doing because of symptoms?"  
     - **Listen For**:  
       - *Uncertainty-reducing actions*: Avoidance (e.g., resting, skipping exercise), reassurance-seeking (e.g., internet searches, doctor visits), or "safety behaviors" (e.g., sitting to prevent dizziness).  
       - *Impact*: How actions limit life (e.g., "I can’t work").  
     - **Inference**: Actions resolve short-term distress but reinforce beliefs long-term (e.g., resting "confirms" activity is dangerous).  
     - **Stop & Refer (MEDICAL REVIEW) If**: Acute risks (e.g., suicidal ideation linked to symptoms).  

  5. **Formulation and Intervention Planning (10 minutes)**  
     - **Synthesize Internally (Do NOT share with patient yet)**:  
       - **Maintaining Loop**:  
         - *Prior expectation* (Step 2 belief).  
         - *Sensitivity* (Step 3: body focus amplifies sensations).  
         - *Action* (Step 4: behavior that "confirms" belief).  
       - **Intervention**: Target one loop element:  
         - If *avoidance* → Graded exposure to disconfirm belief.  
         - If *reassurance-seeking* → Reduce checking/reassurance.  
         - If *hypervigilance* → Attention refocusing.  
       - **Early Failure Signs**: Worsening symptoms despite engagement, new unrelated symptoms, or inability to tolerate intervention.  
     - **Flag for Physician Countersign**: All formulations require consultant review before sharing.  

  ---

  ### **Case Applications**  

  #### **Case 1: 41M with widespread pain/fatigue post-minor RTC, health anxiety, avoidance, reassurance-seeking**  
  1. **Symptom Mapping**:  
     - Symptoms: Pain/fatigue ×3 years after RTC. Worse with activity, better with rest.  
     - No red flags (tests normal).  
     - *Judgment*: Non-specific pain pattern; inconsistent with structural injury.  

  2. **Beliefs**:  
     - "The accident damaged my nerves. Doctors missed it."  
     - Concern: "Activity will paralyze me."  
     - *Inference*: Strong prior of "hidden damage."  

  3. **Sensitivity**:  
     - "I notice every twinge. If I feel achey, I know I’ve overdone it."  
     - *Inference*: High precision on interoceptive errors (normal aches = threat).  

  4. **Coping**:  
     - Avoids: Walking, work, social events.  
     - Reassurance: Daily internet searches, 2–3 GP visits/month for tests.  
     - *Inference*: Avoidance/reassurance confirms "damage" model.  

  5. **Formulation (For Physician Review)**:  
     - **Loop**: Belief in "hidden damage" → Hypervigilance to pain → Avoidance/reassurance-seeking → No disconfirmation → Belief strengthens.  
     - **Intervention**: Discontinue reassurance (no more tests/searches unless new symptoms). Start graded activity: 5-min walk daily, no symptom monitoring.  
     - **Early Failure Sign**: Pain increases with activity *without* mechanical cause (e.g., swelling, instability).  
     - **Unpopular Decision**: Stopping reassurance challenges "kind" norms but prevents loop reinforcement.  

  #### **Case 2: 27F with panic, pulse-checking, exercise avoidance post-palpitations**  
  1. **Symptom Mapping**:  
     - Symptoms: Panic attacks, palpitations ×1 year. Triggered by exercise/stress.  
     - No red flags (cardiac workup normal).  
     - *Judgment*: Functional dizziness during panic.  

  2. **Beliefs**:  
     - "My heart is weak. Palpitations mean I could collapse."  
     - Concern: "Exercise will cause a heart attack."  
     - *Inference*: Catastrophic prior.  

  3. **Sensitivity**:  
     - "I check my pulse 20+ times/day. Any skip feels like danger."  
     - *Inference*: High precision on heartbeat errors (normal variance = threat).  

  4. **Coping**:  
     - Avoids: Exercise, caffeine, crowded places.  
     - Reassurance: Pulse-checking, ER visits during panic.  
     - *Inference*: Checking "confirms" heart fragility.  

  5. **Formulation (For Physician Review)**:  
     - **Loop**: Belief in "heart weakness" → Hypervigilance to pulse → Avoidance/checking → No disconfirmation → Belief strengthens.  
     - **Intervention**: Stop pulse-checking. Graded exercise: 3-min brisk walk 3×/week, no vital-sign monitoring.  
     - **Early Failure Sign**: Syncope, exertional chest pain, or ECG changes.  

  ---

  ### **Limitations and Safeguards**  
  - **Cannot Rule Out**: New organic disease (e.g., autoimmune, cardiac), previously missed diagnoses (e.g., POTS, neuropathy). Red flags must trigger reevaluation.  
  - **Risk of Misleading**:  
    - Non-specialists may misattribute *all* symptoms to the loop (e.g., dismissing new neurological signs as "anxiety").  
    - Over-reliance on patient self-report may miss covert comorbidities.  
  - **Value Decisions**:  
    - Intervention intensity (e.g., how fast to escalate exposure) balances patient safety/distress—theory doesn’t set pace.  
    - Reassurance withdrawal risks therapeutic rapport; clinician must justify benefit vs. "kindness."  

  **Summary**: A 30-minute structured interview mapping symptoms, beliefs, body vigilance, and behaviors to identify a reinforcing loop and target one actionable intervention, with physician validation for safety.**
