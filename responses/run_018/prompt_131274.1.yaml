answer: |-
  **Research Proposal: Functional Surrogacy and the Illusionist Middle Ground**

  **1. Precise Question and Stakes**
  Can illusionism about phenomenal consciousness be successfully reformulated using the concept of "functional surrogacy" to explain the stable epistemic weight and normative force of first-person phenomenal reports (e.g., in pain assessment, introspection, disagreement), without resorting to either (a) positing a misrepresented inner phenomenal target or (b) treating reports as mere behavioral outputs devoid of unique authority? Specifically, (i) is a stable middle ground achievable where reports lack a phenomenal target yet retain irreplaceable coordinating functions justifying their normative force, and (ii) *how* does surrogacy achieve this? Functional surrogacy is not mere relabeling: it explicitly rejects the existence of the target state central to misrepresentation illusionism, while simultaneously rejecting the eliminativist dismissal of the report's unique functional role and normative significance. The philosophical stakes are high: if the middle ground collapses, we face a forced choice between preserving phenomenal targets (undermining illusionism's core motivation) or accepting eliminativism's inability to account for the robust practical and epistemic authority of phenomenal discourse in science and life.

  **2. Where Existing Structural Positions Fall Short**
  Standard misrepresentation illusionism posits that phenomenal reports systematically misdescribe a real, non-phenomenal internal state. However, this struggles to explain the remarkable stability and intersubjective calibration of these reports across contexts and individuals. If the target state is non-phenomenal, why do reports exhibit such consistent, phenomenally-characterized content, and why do agents readily agree on phenomenal characterizations (e.g., "sharp pain") based solely on report coordination? The misrepresentation model risks implying an inexplicable systematic error or smuggling phenomenal properties back into the target. Conversely, standard eliminativism denies phenomenal properties exist *and* often downplays the reports themselves as mere behavior. This struggles profoundly to account for why these specific reports carry irreplaceable weight in crucial practices: clinicians *must* attend to pain reports for effective treatment; introspective training relies on the unique authority of self-reports for metacognitive refinement; resolving perceptual disagreements hinges on comparing phenomenal characterizations. Eliminativism risks rendering these practices irrational or inexplicable. Functional surrogacy aims to fill this gap by offering an account where the reports, despite having no phenomenal target, possess inherent functional significance that grounds their stability and authority.

  **3. Approach, Method, and Timeline**
  This project employs conceptual analysis and functional modeling to rigorously test the viability of the surrogacy model. The core method involves:
  1.  **Functional Role Analysis:** Mapping the precise functional roles of phenomenal reports in two key domains: (a) within predictive processing architectures (focusing on error signaling, precision weighting, and global cognitive coordination), and (b) within clinical/intersubjective communication frameworks (focusing on behavioral coordination, trust calibration, and normative accountability).
  2.  **Surrogacy Modeling:** Constructing detailed models demonstrating how reports lacking a phenomenal target (i.e., pure surrogates) could nevertheless fulfill the identified roles – particularly stability, calibration, and normative force – solely through their systemic functional relationships and informational dynamics.
  3.  **Comparative Evaluation:** Systematically contrasting the explanatory power of the surrogacy model against both misrepresentation illusionism and eliminativism regarding the target phenomena (report stability, intersubjective calibration, normative weight).

  **Six-Month Timeline:**
  *   **Month 1:** Deep conceptual analysis of functional surrogacy vs. misrepresentation/eliminativism; refine core definitions and distinctions.
  *   **Months 2-3:** Detailed functional role analysis of phenomenal reports in predictive processing models and clinical communication contexts.
  *   **Months 4-5:** Develop and refine the functional surrogacy model, explicitly demonstrating how it replicates the identified roles without a phenomenal target. Initiate comparative evaluation.
  *   **Month 6:** Complete comparative evaluation against misrepresentation illusionism and eliminativism; synthesize findings, assess middle-ground stability, and draft final report.

  This conceptual/analytical approach is preferable for this specific normative and functional question than neuroscience (which addresses mechanisms but not the *conceptual* grounding of epistemic/normative weight) or historical exegesis (which clarifies past arguments but doesn't directly build and test a novel functional model like surrogacy).

  **4. Success and Failure Criteria**
  **Success** would be the articulation and defense of a consistent, coherent functional surrogacy model that demonstrably: (a) explains the robust stability and intersubjective calibration of phenomenal reports across diverse contexts; (b) grounds the unique epistemic weight (e.g., in clinical assessment) and normative force (e.g., in resolving disagreements or guiding self-regulation) of these reports; (c) achieves (a) and (b) *without* invoking a represented phenomenal target *and* while distinguishing itself clearly from treating reports as merely behavioral outputs; and (d) shows clear explanatory advantages over both misrepresentation illusionism and eliminativism regarding these phenomena.

  **Failure** would occur if: (a) the surrogacy model proves indistinguishable from eliminativism in its practical implications for the authority of reports, failing to capture their irreplaceable coordinating role and normative force; or (b) the model unavoidably collapses into, or functionally requires, the postulation of a misrepresented inner target (real phenomenal property or state) to explain stability and authority, thereby abandoning the core illusionist commitment of surrogacy; or (c) the model demonstrably lacks the resources to explain report stability/calibration compared to the alternatives.

  **5. Scope, Risks, and Limitations**
  Six months is adequate to build the *conceptual architecture* of the surrogacy model, conduct the functional role analysis, perform the comparative evaluation, and reach a well-supported conclusion regarding the viability of the middle ground. It is sufficient to map the core argument and its potential vulnerabilities. However, it is insufficient for exhaustive exploration of all possible objections or applications.

  The **central risk** is that the distinction between functional surrogacy and misrepresentation proves unstable upon close functional analysis. The pressure points are explaining stability/calibration without any target and explaining normative force without invoking accuracy conditions tied to a target. If the middle ground collapses, the core deliverable will be a rigorous analysis demonstrating *why* it collapses, pinpointing the conceptual or functional pressures that force a choice between misrepresentation illusionism or a form of eliminativism that struggles with normativity. This negative result would still significantly advance the debate by clarifying the constraints on any illusionist account seeking to preserve report authority. The deliverable in either case will be a comprehensive research paper detailing the analysis, the model (if viable), the comparison, and the conclusion regarding the stability of the functional surrogacy middle ground.
