  For the envoi, all six words must return, ending on VERTIGO. Avoid hopeful closure—lean into the tension of "running from freedom." Possible angles: the apron as uniform (facticity), the hand as both object/action, mirror as distorted self-reflection. Faith should feel like a precarious performance, not conviction.

  Potential pitfalls: Making the references too opaque vs. too didactic. Balance concrete images (wet stone, stiff apron) with philosophical undertones. The woman's scene could use tactile details (sweat, limp hand) to contrast the waiter's rigidity. Last stanza before envoi should heighten the conflict—maybe juxtapose "stone" (facticity) with "vertigo" (dizziness of freedom).

  Final touch: Envoi as a collapsing of the two bad faith modes. End mid-flight: "VERTIGO" as the abyss of choice, not liberation. No resolution—Sartrean authenticity isn't an endpoint but relentless awareness.
answer: |-
  Here is a sestina exploring the relentless project of bad faith through Sartre's lens, ending in the vertigo of freedom denied:

  **Sestina for Bad Faith**

  He knots the starched white **APRON**, tight, defined,  
  A costume worn, a role to understand.  
  He *is* the waiter—solid as a **STONE**,  
  Not choosing, just performed. The polished **MIRROR**  
  Reflects the part, absolving him from **FAITH**  
  In anything beyond. A calm, no **VERTIGO**.

  Her palm lies passive in his grasp, her **HAND**  
  A stranger's weight, inert, a cooled-off **STONE**.  
  She floats above the touch, the flesh her **MIRROR**  
  Refuses. Pure potential, free of **FAITH**  
  In this fixed moment. Fleeing **VERTIGO**  
  Of choice, she hides behind a poised **APRON**

  Of detachment. See the gleaming **MIRROR**  
  In the café, catching doubt like **FAITH**  
  Turned inside out? It shows a **VERTIGO**  
  Barely contained. He props his serving **HAND**  
  On the cold zinc, gripping it like a **STONE**  
  Anchor, shielded by the crisp white **APRON**.

  Is this escape, this brittle kind of **FAITH**  
  In being elsewhere? Or just **VERTIGO**  
  Disguised? She feels the pressure of his **HAND**,  
  A claim she sheds; her will becomes a **STONE**  
  Skipped on transcendence’s stream. Her **APRON**  
  Of indifference smudges the clear **MIRROR**.

  The creeping dread, the true, deep **VERTIGO**  
  Is freedom’s gulf. To soothe it, clutch a **STONE**  
  Of fact: "I *am* this role." Adjust the **APRON**.  
  Or float away—"This body isn't **HAND**  
  *Mine*, truly." Both distort the **MIRROR**,  
  Both are a shifting, anxious kind of **FAITH**.

  Not one fixed lie, but constant, strained **FAITH**  
  Re-made: this poised denial, this **VERTIGO**  
  Held at bay. He buffs a glass, his **HAND**  
  Moving by rote, a smooth and practiced **STONE**.  
  She lets her smile hang, a borrowed **APRON**  
  Over the void, refusing the true **MIRROR**.

  *(Envoi)*

  The waiter’s **STONE**-like pose, her vanished **HAND**,  
  Two flights from freedom’s **VERTIGO**—bad **FAITH**  
  In **MIRROR** cracked, behind the stiff **APRON**, still running. **VERTIGO**.

  ---

  **How it works with your specifications:**

  1.  **End-Word Rotation:** The poem strictly follows the sestina's demanding pattern for rotating the six end-words (APRON, HAND, STONE, MIRROR, FAITH, VERTIGO) through the six stanzas and the envoi.
  2.  **Bad Faith as Process:** The repetitive, inescapable return of the same words in new configurations mirrors the constant, active effort required to maintain bad faith – it's never settled, always needing remaking.
  3.  **The Two Flights:**
      *   **Waiter (Collapse into Facticity):** Evoked through "APRON" (uniform, role), "STONE" (solidity, thing-like inertia), "HAND" as a tool ("serving HAND", "HAND / On the cold zinc"). His world is heavy, defined, object-oriented. The "MIRROR" reflects his performed role back absolvingly.
      *   **Woman (Flight into Transcendence):** Evoked through "HAND" as a detached object ("stranger's weight", "vanished HAND"), "MIRROR" as refusal of the physical self, "VERTIGO" as the feeling she flees by denying connection. Her "APRON" is metaphorical ("APRON / Of indifference", "borrowed APRON") – a shield of detachment. "FAITH" here is the belief in her pure potential beyond the actual.
  4.  **Avoiding Sincerity/Resolution:** The poem doesn't resolve into authenticity. The envoi explicitly states both figures are "still running" *from* the "VERTIGO" of freedom. The closing word emphasizes the abyss they flee, not a triumph over it.
  5.  **The Nature of Bad Faith:**
      *   "Not one fixed lie, but constant, strained FAITH / Re-made" directly addresses the core concept.
      *   "Both are a shifting, anxious kind of FAITH" highlights it as a project of *persuasion* (faith), not settled deception.
      *   The "MIRROR" is consistently distorted or refused, symbolizing the avoidance of clear self-awareness.
      *   "Freedom’s gulf" and the "true, deep VERTIGO" position freedom itself as the source of the angst bad faith tries to evade.
  6.  **Envoi:** The three-line envoi incorporates all six end-words, succinctly tying the two examples ("waiter’s STONE-like pose, her vanished HAND") back to the core concept ("Two flights from freedom’s VERTIGO—bad FAITH") and ends with the image of distortion ("MIRROR cracked"), the symbol of role-playing ("stiff APRON"), and the ongoing flight ("still running") culminating in the dreaded "VERTIGO".

  This sestina uses its inherent structural restlessness to embody the ceaseless, evasive project Sartre defined as bad faith, culminating in the unresolved tension of freedom's vertigo.
