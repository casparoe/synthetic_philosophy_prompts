  The user wants the form itself to reflect Kepler's ideas - the refrains should show celestial influence recurring but never closing into fate because Earth's autonomy provides the counterpoint. The rhyme scheme needs to support this: perhaps an ABA pattern where the celestial refrain (A) is always answered by the terrestrial refrain (B) in the closing quatrain.

