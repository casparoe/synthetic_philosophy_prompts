prompt: |-
  As a retired natural scientist recently engaged with philosophy of science, I wish to construct an adversarial-collaboration document for an interdisciplinary reading group. The two parties are: (A) a realist who holds that design-stance patterns—particularly functional ascriptions in evolutionary biology—are real patterns in Dennett's sense, possessing predictive stability that is not merely instrumental; and (B) a strict physicalist who holds that all such patterns are ultimately reducible to physical-stance regularities, with the design stance offering only computational convenience.

  Please draft the joint statement they could both sign. Focus particularly on the niche issue of whether convergent evolutionary structures (for instance, camera-type eyes arising in phylogenetically distant lineages) exhibit a form of counterfactual robustness at the design level—remaining stable across wide variations in underlying physical implementation—that cannot be captured without loss by a purely physical-stance description. Include:

  (i) A numbered section of agreed claims about the three stances (physical, design, intentional), about the predictive success of functional biology, and about the formal requirements for a pattern to count as real rather than merely useful;

  (ii) The precise disagreements, phrased so that party A and party B would each accept the wording of their own position, clearly separating ontological commitment from methodological preference;

  (iii) The cruxes—specifically, whether cross-implementational stability of functional traits constitutes evidence for autonomous design-level reality, and whether any predictive compression achieved by the intentional stance can in principle be duplicated by an idealised physical-stance computation;

  (iv) For each crux, one concrete theoretical or empirical case that both sides agree is relevant, together with each party's explicit advance prediction of what that case demonstrates.

  Format the output as: first the numbered agreed claims; then a table with columns for the realist formulation, the physicalist formulation, and the associated crux; finally, a brief section pairing each crux with its agreed-upon test case and the two predicted outcomes. Keep the language formal, avoid requests for citations or reading lists, and ensure the argument could be evaluated by someone with no web access. Write in British English.
