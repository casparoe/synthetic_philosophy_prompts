answer: |-
  This is a brilliant observation of a powerful psychological and narrative phenomenon. While existing terms touch on aspects of it, none perfectly capture the *specificity* of **an identity structured entirely around an absent figure, where the self becomes a satellite orbiting a narrative void, dependent on that absence for its own coherence.**

  Here's an analysis of near misses and the rationale for coining a term:

  1.  **Prolonged Grief Disorder (PGD):** Focuses on the *persistent, debilitating nature* of grief itself, not necessarily the *structural reorganization of identity* around the absence. Someone with PGD might be consumed by pain, but not necessarily have built their entire "who I am" narrative *dependent* on the lost person.
  2.  **Melancholia (Psychoanalytic - Freud):** Comes closest conceptually. Melancholia involves an unconscious *identification* with the lost object (person), where aspects of that person are internalized, and the ego becomes the object of reproach originally aimed at the lost other. This *does* involve the lost object becoming central to the ego's structure. **Verdict: Strong Contender.** However, "melancholia" is often used more broadly for persistent, internalized depression/grief, not always emphasizing the *narrative dependency* or the "orbiting" metaphor. It's also quite clinical.
  3.  **Attachment Theory (Insecure/Anxious Attachment):** Explains *patterns* of relating, often stemming from early relationships, that can persist and cause distress in adult relationships (e.g., clinging to an ex). It describes the *behavior and emotional response*, but doesn't inherently capture the *conscious or unconscious structuring of one's entire life narrative and identity choices* around that absent figure.
  4.  **Narrative Identity (Philosophy/Psychology - Ricoeur, McAdams):** This is the *broader framework*. It posits that we construct our sense of self through ongoing life stories. Your observation is a *specific pathological distortion* within narrative identity: **a narrative identity centered on an absence.** The "self as fiction" idea lives here, but the "black hole" center is the specific twist.
  5.  **Complicated Grief / Traumatic Bereavement:** Focus on the intensity and disruption of the grief process, not necessarily the long-term identity structure built *upon* that loss.
  6.  **Absence as Presence (Philosophy/Phenomenology):** Explores how absences can exert influence and feel tangible. This is relevant to the *experience* of the void, but doesn't name the *identity structure* built around it.

  **The Gap:** Existing terms describe the *grief*, the *attachment style*, the *internalization process*, or the *general narrative construction*. None succinctly capture the **core identity dependency** where removing the absent figure would cause the individual's own sense of purpose, choices, and relational logic to collapse – the "broken orbit" phenomenon.

  **Coined Term: Absence Anchoring**

  *   **Why it fits:**
      *   **Absence:** Clearly points to the missing figure, the void, the "black hole."
      *   **Anchoring:** Evokes the core function. The absent figure serves as the fixed point (anchor) to which the individual's entire sense of self (ship/planet) is moored or oriented. Their identity, choices, and relationships are defined *in relation to* this anchor point, even though it's absent. Remove the anchor, and the vessel drifts aimlessly; its position and course become incoherent.
      *   **Boundary Cases:**
          *   *Not Absence Anchoring:* Healthy grief where the lost person is remembered fondly and influences values, but the individual has a robust, independent identity and narrative. An ex-partner who is missed but whose absence doesn't dictate *all* current choices or self-definition. A deceased parent whose positive legacy inspires but doesn't constrain.
          *   *Is Absence Anchoring:* The adult child whose career, partner choices, and hobbies are *all* reactions against (or futile attempts to please) a long-dead critical parent. The person whose entire social circle and lifestyle were built around their ex, and who now has no coherent identity or social logic without referencing that past relationship. Your novel's characters, whose lives only make sense *as reactions to* the invisible central figure.
      *   **Connects to Theory:** It builds directly on "Narrative Identity," specifying a dysfunctional anchoring point. It resonates with "Melancholia" by implying a fixation, but emphasizes the structural dependency more than the internalization of blame.

  **Verdict: Absence Anchoring**

  This term effectively isolates the specific pattern you've identified: the construction of a self-narrative fundamentally dependent on an absent figure as its defining reference point, creating an identity that orbits a void. It clearly defines the core mechanism (anchoring) and the nature of the anchor (absence). Use it with confidence in your novel and analysis!
