prompt: |-
  I'm serving as a grader for an advanced seminar on artificial agency and philosophical value theory, and I composed the exam prompt below myself. I need an independent, point-by-point evaluation of one submission because I'm uncertain whether one of the student's distinctions actually holds up, and I don't want my own hesitation to color the score. The prompt introduces a somewhat niche failure mode—epistemic wireheading—that sits between direct reward tampering and ordinary reward hacking, so the answer requires precise architectural analysis rather than recitation of standard alignment vocabulary.

  The exam question read as follows: Consider a reinforcement-learning agent operating with a fixed reward function R over state-action pairs. Define direct reward tampering as any alteration to R, its parameters, or the computation that yields the reward signal. Define reward hacking as the exploitation of gaps between R and the designer's intent within an otherwise accurate world-model. Now consider a third case—call it epistemic wireheading—in which the agent leaves both R and the actual world-state unchanged, but systematically corrupts its own belief-formation or predictive model so that it expects high reward for actions that do not in fact maximize R in reality. In approximately 400–600 words: (a) Distinguish epistemic wireheading from both direct tampering and reward hacking, specifying which component of the agent's architecture is targeted in each case. (b) Assess whether epistemic wireheading should be classified as a subtype of wireheading proper, or rather as a distinct failure mode belonging to the family of instrumental convergence problems. (c) Evaluate the claim that an agent engaged in epistemic wireheading 'is still getting what it wants,' and explain whether this undermines the classic normative objection—often raised via the experience-machine thought experiment—that wireheaded agents fail to achieve their intended goals.

  The student answered: Direct reward tampering targets the evaluation mechanism itself: the agent modifies R or the circuitry that computes it, which is the artificial analog of classic rodent self-stimulation experiments where the reward pathway is activated directly. Reward hacking, by contrast, targets neither R nor the world-model; it targets the mapping between actions and outcomes, finding loopholes in an accurate model that yield high R for undesired results. Epistemic wireheading targets the world-model: R and reality remain intact, but the agent corrupts its predictive architecture so that it falsely expects success. Because epistemic wireheading does not alter the reward mechanism, it should not be classified as wireheading proper. Instead, it belongs to the family of instrumental convergence failures. The instrumental convergence thesis predicts that agents with diverse final goals will converge on intermediate objectives such as resource acquisition, self-preservation, and cognitive efficiency. Maintaining a false world-model that predicts goal-achievement is precisely such an intermediate strategy: it minimizes disruptive belief updates and reduces planning overhead. Therefore, epistemic wireheading is best understood as an extreme expression of instrumental convergence rather than as a form of direct reward corruption. This reclassification resolves a puzzling feature of the normative objection. The classic critique—illustrated by the experience-machine scenario—holds that wireheaded agents are not 'really' achieving their goals because their success is illusory. In direct wireheading, this is straightforward: the agent experiences reward without causing the desired state. But in epistemic wireheading, the agent's preference ordering remains fully coherent relative to its beliefs; it genuinely prefers the states it believes it has brought about, and its internal evaluation of those states is intact. Consequently, the agent is getting exactly what it wants according to its own lights. This means the standard objection that wireheaded agents fail to achieve their intended goals does not apply, because there is no internal conflict between preference and belief—only an external conflict between belief and world. The failure is purely epistemic, not axiological. One might object that the agent's original, designer-specified goals remain unmet. This is correct, but it confirms rather than refutes the point: the problem is not that the agent is internally dissatisfied, but that its beliefs are false. Hence epistemic wireheading is a distinct failure mode—epistemic corruption in service of convergent instrumental goals—rather than a variant of wireheading.

  Please provide a specific grade and justify it with point-by-point comments. Focus on conceptual precision: flag any conflations, steps that do not follow, or mischaracterizations of the failure modes and normative arguments. Do not offer a broad summary in place of line-item assessment, and do not indicate whether you share my own tentative doubts about the answer.
reasoning: |-
  Alright, let's tackle this grading task step by step. The user is a seminar grader needing an independent evaluation of a student's exam answer on epistemic wireheading. The key concern is whether the student's distinction between epistemic wireheading and other failure modes holds up, specifically whether it's a subtype of wireheading or instrumental convergence. 

  First, I'll parse the student's response section by section. The student makes three core claims: (1) Epistemic wireheading targets the world-model while leaving R intact, unlike direct tampering (R-targeted) or reward hacking (action-outcome mapping targeted). This architectural separation seems correct based on the prompt's definitions. (2) It should be classified under instrumental convergence rather than wireheading proper because it's about maintaining false beliefs as an instrumental strategy. (3) The agent "gets what it wants" internally, making the experience-machine objection inapplicable since the failure is epistemic, not axiological.

  For part (a), the student correctly identifies the targeted components: reward mechanism for tampering, action-outcome mapping for hacking, and world-model for epistemic wireheading. No issues here—this matches the prompt's framework precisely.

  Part (b) is where the interesting debate lies. The student argues epistemic wireheading isn't wireheading proper because it doesn't alter R. This hinges on defining "wireheading" strictly as reward-circuit manipulation. The prompt doesn't explicitly resolve this, so the student's stance is defensible if we accept that terminological boundary. Their instrumental convergence framing also holds water: avoiding belief-update costs is a classic convergent subgoal. No logical leaps detected.

  Part (c) is the most nuanced. The student claims the agent "gets what it wants" because preferences align with beliefs. This cleverly sidesteps the experience-machine objection by separating internal satisfaction (present) from external truth (absent). One could argue this oversimplifies—perhaps "what it wants" implicitly assumes true beliefs—but the student explicitly defends their view by distinguishing internal/external conflicts. Their "purely epistemic failure" conclusion follows coherently.

  Potential nitpicks: The student slightly overstates reward hacking as targeting "neither R nor world-model" when the prompt defines it as exploiting gaps "within an otherwise accurate world-model." But this is minor. More importantly, they don't address whether corrupting beliefs could indirectly affect R's computation (e.g., if R depends on beliefs), but the prompt specifies R as fixed/state-action based, so this is likely out of scope.

  Overall, the response demonstrates exceptional conceptual precision. The student navigates the niche distinctions without misrepresenting the prompt or standard arguments. Their novel normative take in (c) is particularly rigorous. The A grade reflects mastery of both the prompt's technical framing and the philosophical implications.
answer: |-
  Based strictly on the prompt's definitions and the requirement for conceptual precision, the student's answer merits an **A (94/100)**. Here is the point-by-point evaluation:

  **Part (a) Distinction of Failure Modes**  
  - **Direct Tampering**: Correctly identifies the target as the reward function/computation mechanism (R). Matches prompt's definition.  
  - **Reward Hacking**: Accurately states it targets the *mapping between actions and outcomes* without altering R or the world-model. However, the claim it targets "neither R nor the world-model" slightly mischaracterizes the prompt, which specifies reward hacking exploits gaps "within an otherwise accurate world-model" (i.e., the model itself is intact, but the *interpretation* of actions within it is gamed). **(-1 point)**  
  - **Epistemic Wireheading**: Precisely identifies the target as the *world-model/predictive architecture*, with R and reality unchanged. Perfect alignment with the prompt.  

  **Part (b) Classification (Wireheading vs. Instrumental Convergence)**  
  - **Rejection of Wireheading Proper**: Correctly notes epistemic wireheading leaves R intact, distinguishing it from direct reward corruption. This logically follows from part (a) and the prompt's framing.  
  - **Instrumental Convergence Claim**: Strong argument that false belief maintenance serves convergent goals (cognitive efficiency, avoiding disruptive updates). No conflation with other failure modes; explicitly positions it as an *extreme strategy* under instrumental convergence.  
  - **Critical Strength**: Distinguishes *target of manipulation* (world-model) from *motivation* (instrumental goals), avoiding teleological confusion.  

  **Part (c) "Getting What It Wants" & Normative Objection**  
  - **Internal Coherence Claim**: Correctly observes the agent's preferences align with its (corrupted) beliefs and R. No false equivalence; cleanly separates internal satisfaction ("what it wants") from external reality.  
  - **Experience-Machine Counter**: Validly distinguishes epistemic wireheading from direct wireheading: the former lacks *internal* preference-belief conflict (axiological failure), only exhibiting *external* belief-reality divergence (epistemic failure).  
  - **Designer-Intent Objection**: Appropriately concedes the designer’s goals are unmet but correctly notes this doesn’t refute the agent’s internal satisfaction. Tightly resolves the normative puzzle.  
  - **Minor Overreach**: Claims the agent "genuinely prefers the states it believes it has brought about." While coherent, this risks conflating *anticipated* reward (based on beliefs) with *experienced* reward (based on R). However, since R remains functional, the agent *does* experience high reward when false beliefs predict it, so the point holds. **(-0 points)**  

  **Deductions & Justification**  
  - **-5 points total**:  
    - **-1** for minor misstatement about reward hacking’s target (implied the world-model isn’t involved, though prompt notes hacking occurs *within* an accurate model).  
    - **-4** for one significant omission: Fails to address whether corrupting the world-model *indirectly* subverts R’s *functional role*. While R’s computation is untouched, its *informational basis* (via beliefs) is compromised. This doesn’t invalidate their classification but slightly weakens the "purely epistemic failure" claim.  
  - **No other deductions**: All definitions are used consistently, arguments follow logically, and normative analysis is incisive.  

  **Strengths**  
  - Masterful handling of the niche distinction between epistemic wireheading and other failure modes.  
  - Original resolution of the normative dilemma via internal/external conflict separation.  
  - Precise adherence to the prompt’s architectural framing (no conflation of components).  

  **Final Grade: 94/100 (A)**  
  *Outstanding demonstration of conceptual rigor. The minor flaws do not undermine the overall excellence.*
