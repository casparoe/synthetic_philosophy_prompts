  Working on a feature about why the Hart-Devlin debate on legal moralism never seems to end — Devlin arguing that law has to back up shared moral norms or social fabric unravels, Hart pushing back with the harm principle and warning about majority tyranny. I've got a theory that the deadlock isn't really about law at all, but about whether morality functions more like an immune system (reactive, emergent) or like architechture (deliberately engineered). If that's right, then they're answering different questions under one label. But I could be wrong — maybe there's a hidden empirical claim about whether criminalizing vice actually preserves social cohesion, and neither side has the data. Can you diagnose what's actually stalling this? Is it verbal, substantive, or are they just using different mental models of how norms work? And honestly, what kind of result — a conceptual split, some cross-cultural data, a formal model — would actually break the logjam, or should we just accept it's two debates wearing one hat?
