prompt: |-
  ive been thinking about inheritance taxes and dynastic wealth and how they relate to equal opportunity, and theres a weird inconsistency that keeps nagging at me. we tax estates at death but we largely ignore the intergenerational transmission of social capital—professional networks, cultural fluency, access to unpaid internships—while treating inherited cash as the main thing that corrupts fair equality of opportunity. what philosophical commitments about the nature of advantage, the moral boundary of the family, and the difference between fungible assets and embodied social position does that practice actually presuppose? reconstruct the implicit theory, say whether its coherent with how we justify public education and merit-based hiring, and tell me what a policy built on a stricter luck-egalitarian or relational-equality view would have to actually change. please answer in continuous prose only—no headings, bullet points, bold text, or tables—like youre writing a long email. i dont need citations or a reading list, just your reasoning.
