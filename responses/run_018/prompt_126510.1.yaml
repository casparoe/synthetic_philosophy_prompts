  2. **Boundary Failure Modes in Tool-Using Systems**: When components interact, there's a handoff between them. Misalignment often happens at these boundaries—like a model misusing a tool because it doesn't understand constraints. This is upstream because fixing boundary issues could prevent many emergent problems. It's tractable by adapting existing work on tool misuse and formalizing interaction protocols. Empirical progress here would make this a priority; lack of progress might shift focus elsewhere.

