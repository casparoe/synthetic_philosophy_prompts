answer: |-
  Right, got it. This is a sharp angle – hinges as structural defaults, not substantive claims. Let's build that argument, tackling the revision head-on and weaving in your "scaffolding" frame.

  So, the core move is this: trying to classify hinges as *beliefs* or *knowledge claims* fundamentally misdiagnoses their role. Beliefs and knowledge claims are propositions *within* the game, moves we make that can be true or false, justified or unjustified, based on evidence. Hinges are different. They are the *rules of the game* itself, the underlying logic structuring how evidence even *counts* as evidence for or against those moves. Wittgenstein’s point is that "Here is my hand," or "The Earth exists," function like the bedrock axioms or the procedural defaults in a system of reasoning. They don't carry evidential weight themselves because they are the precondition *for* evidential weight having any meaning. They are non-monotonic defaults precisely because they stand firm *until* the entire framework they support starts buckling under the strain of persistent, localized anomalies – and even then, revision isn't a simple evidential refutation of *them*.

  This is where the pushback about revision bites: "If hinges aren't beliefs subject to evidence, how do we rationally change them, like moving from 'Earth is flat' to 'Earth is round'? Doesn't observation *force* the change?" But that's the key misunderstanding. Observation doesn't directly refute a hinge; it overloads the *system* it scaffolds. The hinge "Earth is flat" wasn't primarily a belief held against evidence; it was the operational scaffold for an entire epistemic frame – a frame encompassing navigation, cosmology, perception, and everyday interaction. Within that frame, evidence *was* processed: the horizon looked flat, ships sailed "off the edge," the sun rose and set consistently with that model. This hinge structured *how* observations were interpreted as evidence. It functioned perfectly well for many practical projects (local navigation, basic cosmology).

  The crisis arose when observations *within* that frame became persistently anomalous *despite* adjustments to auxiliary beliefs (like adding explanations for why ships sink bottom-first). Think of sailors venturing further, celestial observations that didn't fit, the cumulative weight of inconsistencies *within the system structured by the hinge*. The rational revision wasn't a direct evidential attack on "Earth is flat" *as a belief*. You couldn't point to a single observation that *directly* falsified it in isolation. Instead, the *entire epistemic frame* it scaffolded became increasingly unwieldy, inefficient, and incapable of coherently integrating new observations for the expanding practical project of global navigation and astronomy. The shift to "Earth is (roughly) spherical" wasn't adopting a new belief based *only* on new evidence; it was adopting a *new operational scaffold* – a new set of defaults – that allowed for a more coherent, powerful, and pragmatically successful *framework* for processing *all* the evidence, old and new. The new hinge structured evidence *differently*, resolving the previous frame's anomalies.

  This highlights your crucial point: hinges are revised **locally within specific "epistemic frames" tied to practical projects**, not globally. The "Earth is round" hinge wasn't adopted universally overnight. It became the operational scaffold for *seafaring, cartography, astronomy* – specific frames demanding that structure for coherence. But locally, within the frame of everyday perception on solid ground, the *effective* hinge might still be something closer to "The ground is flat and stable," because that scaffolds *that* practical project perfectly well. We operate with multiple, sometimes loosely connected, epistemic frames, each with its own scaffolding hinges. Revision happens when a *particular frame*, under the pressure of its *own* practical demands and accumulated internal inconsistencies, requires a shift in its foundational defaults to remain functional. We don't rationally revise hinges by stepping outside all frames and comparing them to pure reality; we revise them pragmatically, from within the messy, engaged process of inquiry, when the scaffold cracks under the weight of the project it's supposed to support.

  So, the answer to "How can we revise hinges without evidential weight?" is: We revise them *because* they lack evidential weight. Precisely because they are not beliefs competing on an evidential playing field, but are the rules *defining* the playing field for a specific project, we can pragmatically swap out the entire playing field (or a major structural beam within it) when the current one proves unfit for the game we need to play. The rationality lies in the coherence, efficiency, and practical success of the *entire epistemic frame* after the revision, not in evidential justification applied directly to the hinge itself. The hinge "Earth is round" succeeded because the frame it scaffolded *worked better* for the ambitious practical projects humanity undertook; the old scaffold became an obstacle. The revision is rational, but its rationality is systemic and pragmatic, not propositional and evidential. The hinge itself remains, functionally, a rule, not a claim.
