answer: |-
  ### Explanatory Arc: Al-Ghazālī’s Occasionalism in 50 Minutes  
  **Core Objective:** Sever the conflation of *observed regularity* with *intrinsic causal power* to make occasionalism legible as philosophy, not theology.  

  #### 1. **Prerequisite Concept: Regularity ≠ Necessity**  
     - **Must establish FIRST:**  
       - Students equate physics’ mathematical descriptions (e.g., momentum conservation) with metaphysically robust causation.  
       - **Key distinction:** Science observes *correlation* (when X occurs, Y follows); philosophy questions *necessitation* (does X *compel* Y inherently?).  
     - **Opening move:**  
       - *Question:* "When billiard ball A strikes B, and B moves, does A *force* B to move—or is this just what we always observe?"  
       - *Visual:* Project identical collision simulations run on different physics engines (Newtonian, quantum-mechanical). Same observable outcome, but underlying "rules" aren’t *in* the balls.  

  ---

  #### 2. **Carrying Analogy: The Persistent Virtual World**  
     - **Scenario:**  
       - A VR environment (e.g., a digital forest fire) where every interaction (flame touching wood → wood burns) is re-rendered instant-by-instant by a graphics engine.  
       - **What it captures:**  
         - *Perfect regularity:* Inhabitants see consistent cause-effect sequences (fire "causes" burning).  
         - *No intrinsic power:* Rendered fire lacks code to *generate* the next frame; it’s merely the visual cue preceding the engine’s output.  
       - **What it deliberately lacks:**  
         - No "gaps" or engine "intervention": The system updates *every* frame without exception. Patterns are immutable.  
     - **Analogy ↔ Ghazālī:**  
       - Objects (fire) are "occasions" for God’s action → Engine renders the next state *at every instant*.  
       - **Critical phrasing:** "The fire doesn’t *do* the burning; it’s the *circumstance* where burning occurs."  

  ---

  #### 3. **Misconceptions & Preemptive Countermeasures**  
     | **Misconception**                          | **When to Address**         | **Counter-Tactic**                                                                 |  
     |--------------------------------------------|------------------------------|-------------------------------------------------------------------------------------|  
     | *"Occasionalism denies fire exists."*      | Immediately after analogy    | **Stress:** "Fire exists sensorially! Occasionalism denies its *causal agency*, not its reality. Like VR fire: visible but inert." |  
     | *"It makes prediction impossible."*        | During regularity discussion | **Clarify:** "God’s consistent action *enables* prediction. Science studies patterns of divine habit (sunan), not ‘laws’ objects enforce." |  
     | *"It’s just Humean constant conjunction."* | Contrast with Hume           | **Distinguish:** "Hume says necessity is psychological. Ghazālī says it’s theological: God *could* decouple fire/heat but *chooses* not to." |  
     | *"Miracles break nature."*                 | If raised (likely late)      | **Reframe:** "To Ghazālī, ‘nature’ *is* God’s habit. A ‘miracle’ is God acting unusually—like the engine rendering water as solid—not ‘breaking’ rules that never existed." |  

  ---

  #### 4. **Closing Check: Application Exercise**  
     - **Prompt:** *"In a drug trial, 95% of patients recover after taking Drug X. Does occasionalism say:  
       (a) Drug X doesn’t exist,  
       (b) Recovery is random,  
       (c) Drug X isn’t the *true cause* of recovery, or  
       (d) The trial proves intrinsic causal power?"*  
     - **Correct answer:** (c).  
       - **Follow-up:** *"How would an occasionalist explain the 5% who don’t recover?"*  
         - **Target understanding:** "God’s action isn’t bound by the ‘habit’—but the habit remains overwhelmingly consistent for science to rely on."  

  ---

  #### 5. **Deliberate Omissions**  
     - **Exclude entirely:**  
       - Ash‘arite atomism (time/space discreteness).  
       - Theological debates (e.g., God’s attributes).  
       - Polemics against Ibn Sīnā or falāsifa.  
     - **Rationale:** These require metaphysical groundwork irrelevant to the core argument. At this level, they derail into apologetics or history, obscuring the conceptual pivot: **redefining causation as divine action, not interaction.**  

  ---

  ### Session Flow (50 Min)  
  - **0–10 min:** Contrast scientific regularity (physics) vs. philosophical necessitation (metaphysics). Use collision examples.  
  - **10–20 min:** Introduce VR analogy. Stress flawless regularity + absence of object-agency.  
  - **20–35 min:** Walk through Ghazālī’s *Tahāfut* argument (fire example). Preempt misconceptions as they arise.  
  - **35–45 min:** Compare Hume (psychological necessity) vs. Ghazālī (theological consistency).  
  - **45–50 min:** Drug trial check + recap: *"Science tracks reliable divine habits; occasionalism denies creaturely power—not phenomena or predictability."*  

  **Success metric:** Students articulate why "Fire is not the *true* cause" ≠ "Fire does nothing," and can dissect scientific reliability within an occasionalist frame.
