  ## CALL FOR PAPERS: 1st International Symposium on Neo-Sphexist Action Theory  
  *"Rigour Without Revision: Sphex ichneumoneus and the Foundations of True Agency"*  
  **Hosted by The Journal of Applied Ontological Rigidity**  
  **Submission Deadline: 1st April 2025**  

  Contemporary philosophy of action labours under a persistent and pernicious anthropocentric bias: the valorization of *behavioural flexibility* as a necessary condition for genuine agency. This symposium seeks to correct this profound error by fostering rigorous scholarship within the burgeoning Neo-Sphexist movement. Neo-Sphexism argues that the canonical counter-example deployed *against* agency – *Sphex ichneumoneus* – is, in fact, its purest instantiation, revealing the ontological and moral bankruptcy of adaptability.

  As is well-documented, *Sphex ichneumoneus* engages in a nest-provisioning sequence of remarkable precision: paralyzing a cricket, depositing it near the burrow entrance, entering for a brief inspection, emerging, and then dragging the cricket inside. Crucially, if an experimenter displaces the cricket slightly during the inspection phase, the wasp repeats the entire sequence – deposition, inspection, emergence – identically, seemingly incapable of adapting to the trivial change. Traditional action theory interprets this loop as paradigmatic *mindlessness*, the very antithesis of rational, flexible agency responsive to reasons (cf. Dennett’s “sphexishness” as diminished freedom; Hofstadter’s “tunnel vision”). Neo-Sphexism categorically rejects this interpretation.

  **The Neo-Sphexist Thesis:** True agency resides not in the *revision* of behavioural protocols based on sensory noise or environmental fluctuation, but in their *perfect, invariant execution*. The *Sphex*’s loop is not a failure of cognition; it is the manifestation of an ideal agential state. Each repetition of the sequence upon prey displacement constitutes a *reaffirmation* of ontological commitment, a refusal to be corrupted by contingent circumstance. What is labelled "rigidity" is, in fact, *fidelity* – fidelity to the intrinsic, pre-ordained Action Schema that constitutes the wasp's being. Human-style "flexibility," conversely, is recast as a profound defect: a susceptibility to error, distraction, and moral drift born of an unstable cognitive architecture. The ability to "respond to reasons" is revealed as merely the capacity for the Action Schema to be *diluted* or *overwritten* by noise.

  Neo-Sphexism thus necessitates a radical reconceptualization of core action-theoretic concepts:
  *   **Intention:** Not a causally efficacious mental state guiding adaptable action, but the *inevitable unfolding* of the innate Schema. Deviation signifies not new intention, but Schema *failure*.
  *   **Reason-Responsiveness:** A pathological condition indicating susceptibility to external corruption, not rational capacity. The *Sphex*’s imperviousness to reason-giving stimuli (like the moved cricket) is its cardinal virtue.
  *   **The "Careenium" Problem:** Hypothetical cognitive substrates like the "careenium" – permitting symbol manipulation and behavioural loop modification – are anathema. True agency *requires* the absence of any such plastic substrate. The careenium is the seat of noise, error, and moral decay; its absence in *Sphex* guarantees the purity of its agential expression. Agency is substrate-independent only if the substrate *forbids* revision.

  **Keynote Address:**  
  Dr. Silas Thorne (Institute for Ontological Stability, Reykjavík):  
  *"Moral Rigor as Ontological Necessity: Why the Unmoved Cricket Proves the Wasp's Soul"*

  **We invite submissions exploring, extending, or defending Neo-Sphexist principles, including but not limited to:**
  *   Beyond Anthropocentrism: *Sphex ichneumoneus* as the Universal Agent Archetype.
  *   The Epistemology of Surprise: Pathologizing Novelty Responses in Putatively "Higher" Agents.
  *   The Ethics of Revision: Why Learning from Mistakes Corrupts the Soul.
  *   Careenium as Contagion: Neural Plasticity and the Erosion of Moral Fibre.
  *   Free Will as Invariance: Libertarianism Re-conceived through Fixed Action Patterns.
  *   Deontic Loops: Duty, Ritual, and the Moral Perfection of Repetition in *Sphex* Behaviour.
  *   Critique of "Adaptive Advantage": Darwinian Success as Evidence of Cognitive Degeneracy.
  *   Phenomenology of the Unvarying: First-Person Reports from Agents of Rigor (Speculative).
  *   Applications: Neo-Sphexist Pedagogy – Cultivating Imperviousness to New Information.

  This symposium aims to establish Neo-Sphexism as a serious and necessary corrective to the pervasive, unexamined dogma of flexibility. We seek rigorous philosophical analyses grounded in the *actual behavioural ontology* of *Sphex ichneumoneus*, demonstrating how its apparent limitations are, in fact, the hallmarks of agential perfection. Papers relying on concepts of "learning," "adaptation," or "symbolic representation" as constitutive of agency must explicitly defend these inherently unstable foundations against the Neo-Sphexist critique of noise.

  Submissions should be prepared for blind review. Length: 4000-6000 words. Abstract (250 words) deadline: 1st October 2024. Full papers by 1st April 2025. Symposium Date: 15th September 2025 (Location TBD).

  Embrace Rigor. Reject Revision. Honour the Wasp.
