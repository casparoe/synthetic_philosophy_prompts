prompt: |-
  Provide an example of a conceptual tension within Harsanyi's aggregation theorem that arises when agents operate with structurally different state-space representations rather than merely disagreeing about probabilities within a shared frame. Specifically, construct a case in which Agent A's von Neumann–Morgenstern utility is defined over outcomes that depend on a variable X that Agent A can observe and condition upon, while Agent B treats X as an unobservable background parameter and defines utility only over observable outcomes Y that are probabilistically linked to X but never directly revealed. The social planner seeks to apply Harsanyi's linear aggregation rule but lacks a canonical translation between these representations—there is no agreed-upon joint distribution over (X,Y) pairs because the agents partition the world differently. Explain why this epistemic framing divergence, rather than a simple difference in risk attitudes or beliefs, threatens the shared-domain assumption required for assigning consistent aggregation weights. Identify the specific point in Harsanyi's argument—whether in the construction of the social preference relation or in the derivation of the weight vector—where the absence of a common state-space renders the aggregation ambiguous, and discuss whether any principled resolution can be achieved without imposing an external, non-neutral ontology onto one of the agents.
reasoning: |-
  We are to construct an example where two agents have structurally different state-space representations. Specifically:
   - Agent A observes a variable X and conditions upon it. Outcomes for A depend on X and possibly other factors.
   - Agent B does not observe X and only considers outcomes Y, which are probabilistically linked to X but not directly revealed.

   Moreover, the social planner wants to apply Harsanyi's aggregation theorem but faces the problem that there is no common state-space.

   Harsanyi's aggregation theorem requires that all agents and the social planner have preferences defined over the same set of lotteries (i.e., same state-space). The theorem then shows that under some conditions (including that individual preferences and social preferences satisfy the von Neumann-Morgenstern axioms) there exist weights such that the social utility is a weighted sum of individual utilities.

   However, in this scenario, the agents do not have a common state-space. Let's construct an example:

   Example:
     Let X be a binary variable: X ∈ {0, 1}. Agent A can observe X and defines outcomes over (X, Y) pairs? Actually, the problem states that Agent A defines utility over outcomes that depend on X (which A observes) and conditions upon X. But Agent B only observes Y.

     To make it concrete, suppose that the world is described by (X, Y) where X is a binary variable and Y is also binary. However:
     - Agent A's state-space is the set of pairs (X, Y). So a lottery for A is a probability distribution over (X, Y).
     - Agent B does not observe X. Therefore, B's state-space is only over Y. So a lottery for B is a probability distribution over Y.

     The outcomes for Agent A might be defined as functions of (X, Y) and for Agent B as functions of Y. But note that the problem says Agent B defines utility over observable outcomes Y.

     Now, suppose the social planner must choose between different lotteries. How can we even define a lottery in a way that both agents can express their preferences?

     Consider two lotteries that the social planner might consider:

     Lottery 1: 
        With probability 1/2: (X=0, Y=0)
        With probability 1/2: (X=1, Y=1)

     Lottery 2:
        With probability 1/2: (X=0, Y=1)
        With probability 1/2: (X=1, Y=0)

     For Agent A, these are well-defined lotteries over the state-space (X, Y). But for Agent B, what does he see?
     In Lottery 1, Y is always equal to X. But since Agent B doesn't see X, he only sees Y. So in Lottery 1, the marginal distribution over Y is:
        P(Y=0) = 1/2, P(Y=1) = 1/2.

     Similarly, in Lottery 2, the marginal distribution over Y is also:
        P(Y=0) = 1/2, P(Y=1) = 1/2.

     Therefore, from Agent B's perspective, both lotteries look identical: a 50-50 chance of Y=0 or Y=1.

     However, Agent A might have very different preferences for these two lotteries. For example, suppose Agent A has a utility function:

        u_A(X, Y) = 1 if X = Y, and 0 otherwise.

     Then Lottery 1 yields 1 with probability 1 (because in both outcomes X=Y) and Lottery 2 yields 0 with probability 1 (because in both outcomes X≠Y). So Agent A strictly prefers Lottery 1.

     But Agent B, having only a state-space over Y, might have a utility function:

        u_B(Y) = Y   (so he gets 1 if Y=1 and 0 if Y=0).

     Then both lotteries from Agent B's perspective yield an expected utility of 1/2. So Agent B is indifferent.

     Now, the social planner wants to aggregate these preferences. But note that the lotteries that the social planner must consider are defined over the full state-space (X, Y) because that's the only way to capture Agent A's perspective. However, Agent B cannot express preferences over (X, Y) because he doesn't observe X.

     The problem is that the domain of lotteries for the two agents is different. Harsanyi's theorem requires that the social preference, and the individual preferences, are defined on the same set of lotteries. Here, the set of lotteries for Agent A is the set of probability distributions on { (0,0), (0,1), (1,0), (1,1) } (a simplex on 4 points). For Agent B, it is the set of probability distributions on {0,1} (a simplex on 2 points). These are different spaces.

     Therefore, the social planner cannot even define a common lottery space. Without a common domain, Harsanyi's theorem breaks down.

     Specifically, the theorem requires that we have a set of lotteries L, and for each agent i, a preference relation on L that satisfies the vNM axioms. The social preference is also defined on L. But here, we cannot set L to be the same for both agents.

     Where does the argument break down?

     Harsanyi's theorem (simplified) goes as follows:

     1. Assume each individual i has a vNM utility function U_i defined on the set of lotteries over outcomes (which are assumed to be the same for everyone).
     2. Assume the social preference also satisfies the vNM axioms and thus has a vNM utility function U.
     3. Then, on the set of all lotteries, U must be a linear combination of the U_i.

     But in our case, the outcomes for Agent A are pairs (X, Y) and for Agent B are just Y. So they are not the same set of outcomes. Therefore, we cannot even define a lottery that both agents can evaluate.

     The social planner might try to "lift" both preferences to the same space. For example, the planner might consider the space of lotteries over (X, Y). But then Agent B's preferences are not defined on this space because Agent B does not care about X. However, we might try to extend Agent B's preferences by considering the marginal distribution on Y. So we define for Agent B:

          U_B(lottery) = E[ u_B(Y) ]

     where the expectation is taken with respect to the marginal distribution of Y in the lottery over (X, Y). This seems reasonable.

     Similarly, Agent A's utility is defined as:

          U_A(lottery) = E[ u_A(X, Y) ]

     Then we have both utilities defined on the same lottery space (over (X, Y)).

     But note: this extension is not neutral. We have imposed a particular way of extending Agent B's preferences to the larger space. Specifically, we are assuming that Agent B is indifferent to the distribution of X given Y. This might be consistent with Agent B's view because he doesn't observe X, but it is an extension.

     However, what if Agent B actually has a different view? For example, Agent B might believe that there is a correlation between X and Y that matters? But wait, Agent B does not observe X. So from his perspective, he only sees Y. Therefore, it seems consistent to define his utility over the larger space as the expected utility of Y, ignoring X.

     But now consider the aggregation. The social planner uses Harsanyi's linear aggregation:

          U(lottery) = w_A * U_A(lottery) + w_B * U_B(lottery)

     For Lottery 1 and Lottery 2 defined above:

          U_A(Lottery1) = E[u_A] = 1
          U_A(Lottery2) = E[u_A] = 0

          U_B(Lottery1) = E[u_B(Y)] = (1/2)*u_B(0) + (1/2)*u_B(1) = (1/2)*0 + (1/2)*1 = 1/2
          U_B(Lottery2) = same = 1/2

     So:
          U(Lottery1) = w_A * 1 + w_B * (1/2)
          U(Lottery2) = w_A * 0 + w_B * (1/2) = w_B * (1/2)

     Then if w_A > 0, we have U(Lottery1) > U(Lottery2). But note that Agent B is indifferent. So the social preference would be determined by Agent A's strict preference.

     However, is this extension acceptable? The problem is that we have imposed an external ontology on Agent B. Agent B originally only had a state-space of Y. By extending his utility to the (X, Y) space by ignoring X, we are assuming that he doesn't care about X. But what if Agent B actually believes that X is an important variable that he cannot observe, and he has beliefs about X that he would use if he were forced to consider (X, Y)? The problem is that we haven't captured Agent B's beliefs about X.

     In fact, Agent B, while not observing X, might have a prior belief about X. For example, suppose Agent B believes that X and Y are independent and that P(X=0)=P(X=1)=1/2. Then if we ask Agent B to evaluate a lottery over (X, Y), he would use:

          U_B(lottery) = E[ u_B(Y) ]   (because he doesn't care about X, so he just averages over X and Y according to his beliefs and the lottery?)

     But wait, the lottery already specifies a joint distribution over (X, Y). So if the lottery is specified by a joint probability distribution p(x,y), then Agent B would compute:

          U_B(lottery) = E[ u_B(Y) ] = \sum_{y} u_B(y) * [ \sum_{x} p(x,y) ]

     which is exactly the marginal distribution of Y. So the extension we did is consistent with Agent B's perspective: he only cares about the marginal of Y.

     However, what if Agent B has a different belief about the relationship between X and Y? Actually, in the extension we did, we are using the lottery's joint distribution to compute the marginal. This does not require Agent B to have a prior over X? We are just using the lottery's probability distribution. But note: Agent B might not accept the lottery's joint distribution as his belief. He might have his own prior about X that is independent of the lottery? 

     But in the vNM framework, the lotteries are objective probabilities. So if the lottery says the probability of (X=0,Y=0) is p, then that is the objective probability. Agent B, even though he doesn't observe X, should use the objective probabilities provided by the lottery to compute the marginal distribution of Y. Therefore, the extension we did is the correct one.

     However, there is a deeper issue: the construction of the lottery itself. The social planner is defining lotteries over (X, Y). But Agent B doesn't observe X. So if the social planner chooses a lottery that has a particular joint distribution, Agent B will only observe the outcome Y. But the actual outcome is (X, Y). The problem is that the outcome (X, Y) is not verifiable by Agent B. So how can the social planner implement such a lottery? 

     Moreover, Agent B's original preferences were defined over lotteries that specify distributions over Y. But now the social planner is asking Agent B to express preferences over lotteries that specify distributions over (X, Y). This is a different set of objects. Agent B might not be able to form preferences over such lotteries because he doesn't understand what X is? Or he might not have the cognitive capacity to consider X?

     This is the epistemic framing divergence: the agents partition the world differently. Agent A sees two variables, while Agent B sees only one. Therefore, they have different conceptions of what an outcome is.

     The specific point in Harsanyi's argument that breaks down is at the very beginning: the requirement that the set of lotteries L is common to all agents. Without a common L, we cannot define the individual preferences on L.

     Can we have a principled resolution without imposing an external ontology?

     One possible resolution is to require that the social planner's lotteries are defined only on the common observable, which is Y. But then we lose Agent A's information about X. In that case, the social planner would only consider lotteries that specify distributions over Y. Then both agents can express preferences. But then Agent A might not be able to express his true preferences because he cares about X. For example, Agent A might prefer a lottery that gives a high utility when X=Y, but if we only specify the distribution over Y, we lose the correlation with X.

     Alternatively, we might try to define a common state-space that is the coarsest one: the one that only includes Y. Then we restrict the lotteries to those that are measurable with respect to Y. But that would ignore any information about X.

     Another resolution might be to define the state-space as the product space but then to agree on a common prior over X. But note the problem: there is no agreed-upon joint distribution over (X, Y) pairs. The agents might have different beliefs about the relationship between X and Y. Moreover, even if we impose a prior, it might not be neutral.

     In summary, the divergence in the state-space representation creates a fundamental problem for Harsanyi's aggregation theorem because it violates the shared domain assumption. The specific point of failure is the requirement of a common lottery space. Without a common lottery space, we cannot define the vNM utilities on the same domain, and hence the linear aggregation cannot be applied.

     Any resolution that extends the agents' preferences to a common space (like we did above) imposes an external structure. In the case of Agent B, we extended his utility to the (X, Y) space by taking the marginal over Y. This is natural given that Agent B only cares about Y. But it requires that we define the lottery in the (X, Y) space, which Agent B might not have considered. Moreover, if Agent B had beliefs about X that are different from the lottery's distribution, we are overriding his beliefs? Actually no, because the lottery is an objective probability. But if Agent B is a subjective expected utility maximizer, then he would use his own prior. However, Harsanyi's theorem assumes objective probabilities (lotteries). So we are in the realm of objective expected utility.

     Therefore, if we assume that the lottery provides the objective probabilities, then extending Agent B's utility by using the marginal distribution of Y from the lottery is consistent. But note: we are still imposing the state-space (X, Y) on Agent B. This might be seen as an external imposition.

     The problem becomes more acute if we consider that Agent B might not even have the concept of X. For example, X might be a variable that Agent B is unaware of. Then asking Agent B to express preferences over lotteries defined on (X, Y) is impossible.

     Thus, without imposing an external ontology, it seems difficult to resolve the issue. The social planner must either reduce the state-space to the common observable (Y) and lose information, or expand the state-space to include X and possibly impose an interpretation of Agent B's preferences in that space. The latter is an imposition on Agent B.

     This illustrates a deep challenge in aggregating preferences when agents have different representations of the world.
answer: |-
  ### Conceptual Tension in Harsanyi's Aggregation Theorem: Divergent State-Space Representations

  **Example Construction:**  
  Consider two agents, A and B, evaluating a medical intervention where:  
  - **Variable \(X\)**: Genetic predisposition to a disease (binary: \(X_H\) = high risk, \(X_L\) = low risk).  
  - **Outcome \(Y\)**: Observed health outcome after treatment (binary: \(Y_S\) = survival, \(Y_D\) = death).  

  **Agent A's Representation**:  
  - Observes \(X\) directly (e.g., via genetic testing).  
  - **State-space**: Outcomes are pairs \((X, Y)\).  
  - **vNM utility**:  
    \[
    u_A(X, Y) = \begin{cases} 
    10 & \text{if } (X_H, Y_S) \\
    8 & \text{if } (X_L, Y_S) \\
    0 & \text{if } Y_D \text{ (death, independent of } X\text{)}
    \end{cases}
    \]  
    Agent A values survival more under high genetic risk (e.g., due to equity concerns).  

  **Agent B's Representation**:  
  - Cannot observe \(X\) (e.g., opposes genetic testing on ethical grounds).  
  - **State-space**: Only observes \(Y\) (survival/death).  
  - **vNM utility**:  
    \[
    u_B(Y) = \begin{cases} 
    9 & \text{if } Y_S \\
    0 & \text{if } Y_D 
    \end{cases}
    \]  
    Agent B values all survival equally, regardless of \(X\).  

  **Probabilistic Link**:  
  - \(Y\) depends stochastically on \(X\):  
    \[
    P(Y_S \mid X_H) = 0.6, \quad P(Y_S \mid X_L) = 0.9.
    \]  
  - Agents **disagree on the prior for \(X\)**:  
    Agent A: \(P_A(X_H) = 0.4\),  
    Agent B: \(P_B(X_H) = 0.7\) (due to different epidemiological models).  

  ---

  ### Social Planner's Dilemma  
  The planner seeks to aggregate preferences using Harsanyi’s linear rule:  
  \[
  U_{\text{social}} = \alpha u_A + \beta u_B.
  \]  
  **Problem**: The utilities \(u_A\) and \(u_B\) are defined over **incommensurable state-spaces**:  
  - \(u_A\) requires partitioning states by \((X, Y)\) pairs.  
  - \(u_B\) requires partitioning states by \(Y\) alone.  

  **Attempted Aggregation**:  
  Consider a lottery \(L\) offering a \(50\%\) chance of treatment and \(50\%\) chance of no treatment.  
  - **Agent A** evaluates \(L\) in \((X, Y)\)-space:  
    \[
    U_A(L) = \sum_{X,Y} P_A(X) P_A(Y \mid X) u_A(X, Y).
    \]  
  - **Agent B** evaluates \(L\) in \(Y\)-space:  
    \[
    U_B(L) = \sum_{Y} P_B(Y) u_B(Y), \quad \text{where } P_B(Y) = \sum_{X} P_B(X) P_B(Y \mid X).
    \]  
  **Conflict**: The planner cannot compute \(U_{\text{social}}\) because:  
  1. There is **no shared lottery space**: \(L\) must be defined as either:  
     - A distribution over \((X, Y)\) (for A), or  
     - A distribution over \(Y\) (for B), but not both.  
  2. **No agreed joint distribution**: Disagreements on \(P(X)\) and \(P(Y \mid X)\) prevent a canonical \(P(X, Y)\).  

  ---

  ### Why Epistemic Framing Divergence Threatens Harsanyi's Theorem  
  Harsanyi’s theorem assumes:  
  > **Shared Domain Assumption**: All agents and the planner operate over the **same set of lotteries** \(\mathcal{L}\), defined on a **common state-space** of outcomes.  

  **Violation Here**:  
  - Agent A’s \(\mathcal{L}_A\): Lotteries over \(\{(X_H, Y_S), (X_H, Y_D), (X_L, Y_S), (X_L, Y_D)\}\).  
  - Agent B’s \(\mathcal{L}_B\): Lotteries over \(\{Y_S, Y_D\}\).  
  \(\mathcal{L}_A\) and \(\mathcal{L}_B\) are **mathematically disjoint**. The planner cannot define a \(\mathcal{L}\) that both agents accept as "the same set of uncertain prospects."  

  **Specific Point of Failure in Harsanyi's Argument**:  
  The breakdown occurs at the **construction of the social preference relation**:  
  1. **Harsanyi's Premise**: The social preference \(\succsim_{\text{social}}\) and individual preferences \(\succsim_i\) must be vNM rational *over the same \(\mathcal{L}\)*.  
     - This allows mapping \(\succsim_{\text{social}}\) and \(\succsim_i\) to linear functions \(U_{\text{social}}\) and \(U_i\) on \(\mathcal{L}\).  
  2. **Divergence Implication**: Without a common \(\mathcal{L}\),:  
     - \(\succsim_A\) is defined on \(\mathcal{L}_A\), \(\succsim_B\) on \(\mathcal{L}_B\).  
     - The planner **cannot construct \(\succsim_{\text{social}}\)** because no \(\mathcal{L}\) simultaneously represents both agents' perspectives.  
  3. **Weight Derivation Ambiguity**: Even if weights \(\alpha, \beta\) existed, they would be **meaningless** because:  
     \[
     \alpha u_A(L_A) + \beta u_B(L_B)
     \]  
     compares \(u_A\) evaluated on \(L_A \in \mathcal{L}_A\) and \(u_B\) on \(L_B \in \mathcal{L}_B\)—two different objects.  

  ---

  ### Can a Principled Resolution Exist Without Imposing Ontology?  
  **Challenges**:  
  - **Without common state-space**: Aggregation requires **mapping** between \(\mathcal{L}_A\) and \(\mathcal{L}_B\).  
  - **Proposed "Solutions" and Their Flaws**:  
    - *Marginalize A’s utility to \(Y\)-space*: Define \(\tilde{u}_A(Y) = \sum_X P_{\text{planner}}(X \mid Y) u_A(X, Y)\).  
      **Problem**: Imposes the planner’s \(P(X \mid Y)\) on A, violating neutrality. Agent A may reject this (e.g., if correlation \(X\)-\(Y\) is contested).  
    - *Embed B’s utility in \((X,Y)\)-space*: Define \(\tilde{u}_B(X,Y) = u_B(Y)\).  
      **Problem**: Assumes B is indifferent to \(X\), but B explicitly denies \(X\)’s existence. This imposes \((X,Y)\)-ontology on B.  
    - *Use B’s beliefs to extend \(u_A\)*: Compute \(U_A\) using \(P_B(X)\), not \(P_A(X)\).  
      **Problem**: Forces A to accept B’s beliefs, violating sovereignty.  

  **Conclusion**: No non-coercive resolution exists. Any mapping:  
  - Arbitrarily prioritizes one agent’s ontology (e.g., reducing A’s rich states to B’s coarse states).  
  - Violates **Harsanyi’s neutrality requirement** by imposing external structure on an agent’s worldview.  
  The tension exposes a **fundamental limitation** of linear aggregation under epistemic heterogeneity: preferences can only be aggregated if all agents "see" the same world.
