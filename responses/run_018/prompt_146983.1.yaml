answer: |-
  ### Practical Identity Decision Procedure for User Migration  
  **Philosophy Hack:** We're converting "same user?" debates into a deterministic flowchart. Uses *counterpart theory* (similarity-based) as primary, falls back to *transworld identity* (strict continuity) when possible.  

  ---

  ### Prerequisites  
  1. **Define system invariants** (team must agree upfront):  
     - **Immutable fields:** e.g., `user_creation_timestamp`, `government_id` (fields that *never* change).  
     - **Critical mutable fields:** e.g., `email`, `role` (fields where changes trigger scrutiny).  
     - **Migration log:** Audit trail explaining *why* changes happened (e.g., "fixed email typo").  

  ---

  ### Decision Procedure  
  **Inputs:** Old user record, New user record, Migration log context.  
  **Outputs:** `SAME_USER`, `NOT_IDENTICAL`, `MERGER_SPECIAL_CASE`, or `HUMAN_NEEDED`.  

  1. **UUID Match Check**  
     - ✅ **Pass:** UUIDs identical → Proceed to Step 2.  
     - ❌ **Fail:** UUIDs differ → Proceed to Step 4.  

  2. **Immutable Field Audit**  
     - ✅ **Pass:** All immutables match → Proceed to Step 3.  
     - ❌ **Fail:** *Any* immutable changed → `NOT_IDENTICAL` (hard fail).  
     - 🟡 **Judgement Zone:** "Immutables" aren't physics. If log shows valid correction (e.g., "fixed invalid SSN"), override to ✅.  

  3. **Critical Mutable Field Check**  
     - ✅ **Pass:** All critical mutables match → `SAME_USER`.  
     - ❌ **Fail:** Critical mutables changed:  
       - ✅ If log explains *and* justifies change (e.g., "user requested email update") → `SAME_USER`.  
       - ❌ Log missing/unconvincing → `HUMAN_NEEDED`.  
     - 🤖 **Fake Precision:** "Justifies" is subjective. Default to log unless change breaches security policies.  

  4. **UUID Mismatch Investigation**  
     - **4a. Find old record by immutables** (if defined):  
       - ✅ Found unique old record with matching immutables → Proceed to Step 5.  
       - ❌ No match or multiple matches → `NOT_IDENTICAL`.  
     - **4b. If no immutables:** Try matching *all* fields:  
       - ✅ All fields match exactly → Proceed to Step 5.  
       - ❌ Any field differs → `NOT_IDENTICAL`.  

  5. **Continuity & Log Verification**  
     - ✅ Log confirms UUID change was intentional (e.g., "sharding forced UUID reset") → `SAME_USER`.  
     - ❌ Log indicates merge/split → `MERGER_SPECIAL_CASE`.  
     - ❌ Log missing → `NOT_IDENTICAL` (distrust spontaneous UUID changes).  

  ---

  ### Run the Cases  
  #### Case 1: Same UUID, Email + Role Changed  
  - Step 1: ✅ UUID match → Step 2.  
  - Step 2: ✅ Immutables match → Step 3.  
  - Step 3: ❌ Critical mutables (email/role) changed.  
    - Log says: "Updated role during migration per PM request" → ✅ `SAME_USER`.  
    - Log says nothing → `HUMAN_NEEDED`.  
  **Verdict:** `SAME_USER` (with log) or `HUMAN_NEEDED` (no log).  

  #### Case 2: UUID Regenerated, All Other Fields Match Exactly  
  - Step 1: ❌ UUIDs differ → Step 4.  
  - Step 4: ✅ All fields match → Step 5.  
  - Step 5: Log says "UUID reset for shard compatibility" → ✅ `SAME_USER`.  
  - Log missing → ❌ `NOT_IDENTICAL` (no trust without papertrail).  
  **Verdict:** `SAME_USER` (with log) or `NOT_IDENTICAL` (no log).  

  #### Case 3: Two Old Accounts Merged into One New Record  
  - Step 1: ❌ UUIDs differ → Step 4.  
  - Step 4: ❌ Immutables won’t match both old records (or duplicates found) → `NOT_IDENTICAL`.  
  - *Even if fields match one record:* Step 5 → Log says "merged user X and Y" → `MERGER_SPECIAL_CASE`.  
  **Verdict:** `MERGER_SPECIAL_CASE` (PM’s nightmare).  
  **Why:** Merged users aren’t "identical" to either original. Requires custom business logic (e.g., `is_merged_user` flag).  

  ---

  ### When to Stop the Debate  
  - **Hard stops:** `NOT_IDENTICAL` (immutable changed + no correction log), `MERGER_SPECIAL_CASE`.  
  - **Human arbitration:** `HUMAN_NEEDED` (changes smell fishy or log absent).  
  - **Philosophy escape hatch:** If steps feel like "torturing data," default to:  
    ```python  
    if disagreement_persists:  
        return assign_owner_and_move_on()  # Product/legal decides.  
    ```  

  ### Key Takeaways  
  - **UUID is weak:** Alone, it’s useless for migration identity.  
  - **Logs are king:** Without them, you’re in philosophy-land.  
  - **Define "immutable" strictly:** If your "immutable" changes often, it’s mutable.  
  - **Mergers are special:** They break 1:1 identity. Handle via new business logic, not philosophy.  

