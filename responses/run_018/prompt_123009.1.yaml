  The audience is specific: Dr. Lee (loves Goldhagen's cultural argument), two grad students who just finished Browning's "Ordinary Men" and think situational pressures explain everything, and a philosophy student who's into Aristotle and thinks the user is misusing virtue ethics. The user needs help prepping for Q&A with 6-7 objections ordered by how damaging they are, each phrased as the specific person would say it. They also need two-minute replies for each, flagging weaknesses, plus advice on what to concede and what to hold firm on. 

  They're particularly worried about how to handle evidence from Police Battalion 101 members who reported feeling sick and awful after killings—this could contradict their "detachment" argument. They also mentioned they misspelled "perpetrators" earlier but don't want to get bogged down in that.

