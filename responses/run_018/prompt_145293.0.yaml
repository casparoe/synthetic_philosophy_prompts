  Your objection mistakes complexity for dilution. Nozick's core insight remains untouched: justice resides in the *legitimacy of each step*, not the aggregate outcome. If every transaction in that chain—from broadcast license sales to trust distributions—was voluntary and rights-respecting (no fraud, coercion, or violation of Lockean provisos), then the endpoint *is* just. The fact that the current beneficiaries didn't personally bargain with Chamberlain is irrelevant; they hold title through a series of just transfers. Your discomfort stems from imposing a *patterned* judgment ("massive holding = unjust concentration") onto a process that is validated link-by-link. If you claim injustice, identify the *specific* rights violation in the chain—not the emergent result of repeated voluntary exchanges. Historical entitlement doesn't require continuous active consent from distant parties; it requires an unbroken chain of legitimate acquisition and transfer. The "paperwork" *is* the moral tracking.
