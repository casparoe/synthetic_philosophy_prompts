prompt: |-
  I am drafting the normative section of a civic-education framework for a ministry working group, and before I look at any candidate theory of patriotism I want the specification rather than the theories. Please write me the list of requirements that an account of the moral standing of patriotic attachment would have to meet in order to be usable for my purpose. That purpose is narrow and I want the list built for it: adequate to decide whether, and by what means, a democratic state may deliberately cultivate attachment to country in a captive audience of pupils who have not chosen to be there. I need the standard, not a survey.

  For each requirement: one sentence stating it; the case it must handle or the consideration behind it; whether you take it to be non-negotiable for this purpose or a demand that one camp imposes and another is entitled to refuse; and what accepting it would rule out. Where a single putative requirement is really two, split it.

  The cases I want used as tests rather than as ornament: a plurinational state several of whose constituent peoples regard the political unit as not theirs; a nation with no state, and the emigrant who has not been back in thirty years; a polity that has peacefully ceased to exist, loved by the grandchildren of its citizens; a reformer whose object is the country's unfulfilled aspirations rather than its present condition; a country whose present prosperity depends on an ongoing wrong it will not acknowledge; someone who judges, on the evidence, that her country is the worst in the world and who nonetheless cares about it; a public official who breaks the law out of loyalty to the country; the position of the state, which is to be both the teacher of the attitude and its beneficiary; and the position of the pupil, who is to have the attitude inculcated and is yet supposed to have it genuinely, as a virtue rather than as a conditioned habit.

  The distinctions I want the theory unable to collapse: country, nation, state, government, and compatriots; loving a country and approving of it; being permitted to weight compatriots more heavily and being required to; the disposition and its public expression; patriotism's value and patriotism's effects on inquiry into the national past; intrinsic and instrumental value; and the content of the attitude and its source, whether chosen, inherited, or taught.

  Then flag any two requirements you suspect cannot be jointly satisfied, and say whether the conflict indicts the specification or is the first real result about the phenomenon. Name the single requirement that does the most work in excluding candidates. And — briefly, three or four lines each, since the criteria are the deliverable and the scoring is not — score three views against the list: patriotism as loyalty to a political community's constitutive values rather than to a nation; patriotism as a partly non-voluntary, identity-constituting partiality of the same general shape as familial love; and patriotism as worth having only instrumentally, as the affective condition of redistributive solidarity.

  Where a requirement rests on a contested empirical claim, mark it as such and say which way the claim would have to come out. Do not survey the literature and do not attribute the views; I have the readings in front of me.
reasoning: |-
  Okay, the user is drafting a civic-education framework for a ministry working group and needs a list of requirements for assessing theories of patriotism. The focus is on whether a democratic state can cultivate patriotism in students who are a captive audience. The user wants specifications, not theories, with clear tests and distinctions.

  First, I need to understand the core purpose: evaluating if a state can deliberately foster patriotism in compulsory education. The user provided specific cases and distinctions to test any theory. I should ensure each requirement addresses these without digressing into existing theories.

  Looking at the cases mentioned: plurinational states, stateless nations, emigrants, defunct polities, reformers, countries benefiting from ongoing wrongs, critics who still care, officials breaking laws, the state's dual role, and students' genuine virtue. Each requirement must handle these scenarios.

  The distinctions are crucial: country vs. nation vs. state vs. government vs. compatriots, love vs. approval, permitted vs. required partiality, disposition vs. expression, value vs. effects on inquiry, intrinsic vs. instrumental value, and sources of attitude. The requirements should prevent these from collapsing.

  I'll start listing requirements. Each needs a sentence, the case/consideration, negotiability, and what it rules out. For example, Requirement 1: Non-coercive authenticity. Case: Students must develop genuine virtue, not conditioned habits. Non-negotiable. Rules out indoctrination methods.

  Requirement 2: Distinguish country from state. Case: The state is both teacher and beneficiary, risking conflation. Non-negotiable. Rules out theories where loyalty to state is inseparable from country.

  Requirement 3: Accommodate critical loyalty. Case: Reformers focusing on unfulfilled aspirations. Non-negotiable. Rules out uncritical loyalty theories.

  Requirement 4: Permit non-identification. Case: Plurinational states where groups reject the political unit. Negotiable (liberal vs. nationalist). Rules out mandatory identification.

  Requirement 5: Separate partiality from obligation. Case: Permitted vs. required weighting of compatriots. Negotiable. Rules out conflating permission and duty.

  Requirement 6: Handle negative judgments. Case: Someone who thinks their country is the worst but still cares. Non-negotiable. Rules out approval-dependent theories.

  Requirement 7: Address historical inquiry. Case: Prosperity from unacknowledged wrongs affecting patriotic education. Non-negotiable. Rules out theories discouraging critical history.

  Requirement 8: Acknowledge non-voluntary sources. Case: Emigrants or grandchildren loving defunct polities. Non-negotiable. Rules out purely chosen patriotism.

  Requirement 9: Justify state's role. Case: State as teacher and beneficiary. Non-negotiable. Rules out theories where state involvement is inherently illegitimate.

  Requirement 10: Distinguish intrinsic/instrumental. Case: Redistributive solidarity as instrumental. Negotiable. Rules out collapsing the distinction.

  Now, flagging conflicts: Requirement 1 (non-coercive authenticity) and Requirement 9 (state's role) might clash. Can the state cultivate genuine attachment without coercion? This conflict highlights a real tension in civic education.

  The most exclusionary requirement is probably Requirement 9 (justify state's role), as it challenges theories that view state involvement as inherently problematic.

  Scoring the three views:
  1. Loyalty to constitutive values: Might struggle with non-voluntary sources (R8) and plurinational cases (R4), but handles critical loyalty (R3) well. Moderate fit.
  2. Identity-constituting partiality: Excels at non-voluntary sources (R8) and negative judgment cases (R6), but may blur partiality/obligation (R5) and struggle with state justification (R9). Strong except on state role.
  3. Instrumental for solidarity: Fails on intrinsic value (R10) and might not address non-identification (R4) or authenticity (R1). Weak fit.

  Need to ensure each requirement is clearly tied to the user's cases and distinctions, avoiding theoretical jargon. Mark any empirical claims, like R8's basis in social psychology, noting they're contested.
answer: |-
  Here is the specification of requirements for assessing theories of patriotic attachment, tailored to your purpose and constrained by your test cases and distinctions. Each requirement is stated in one sentence, followed by its grounding case/consideration, negotiability status, and what it rules out.

  ### Requirements
  1. **Non-coercive Authenticity**: The cultivated attachment must be compatible with developing into a *genuine virtue* (internally motivated) rather than a conditioned habit in pupils.  
     - **Case**: Pupil’s position (genuine virtue vs. conditioned habit).  
     - **Non-negotiable**: Yes (core to democratic education).  
     - **Rules out**: Theories endorsing indoctrination or attachment dependent solely on behavioral conditioning.  

  2. **State-Beneficiary Legitimacy**: The state’s role as both teacher and beneficiary must not render the attachment inherently illegitimate or servile.  
     - **Case**: State’s dual position (teacher/beneficiary).  
     - **Non-negotiable**: Yes (essential to state-led cultivation).  
     - **Rules out**: Theories where state involvement automatically corrupts attachment into ideological control.  

  3. **Critical Loyalty**: The account must permit loyalty to coexist with fundamental disapproval of the country’s present condition or policies.  
     - **Case**: Reformer focused on unfulfilled aspirations; patriot who judges their country "worst" but cares.  
     - **Non-negotiable**: Yes (democratic ethos demands critical engagement).  
     - **Rules out**: Theories requiring approval of status quo or defining patriotism as uncritical endorsement.  

  4. **Non-Identification Accommodation**: It must allow for individuals/groups (e.g., constituent peoples) to lack attachment to the political unit without moral failing.  
     - **Case**: Plurinational state with disidentified groups.  
     - **Negotiable**: Yes (liberal views permit this; civic nationalist views reject it).  
     - **Rules out**: Theories mandating universal patriotic duty or treating non-attachment as defective.  

  5. **Partiality-Obligation Separation**: It must distinguish *permissibility* of weighting compatriots more heavily from any *obligation* to do so.  
     - **Case**: Distinction between permitted/required partiality.  
     - **Negotiable**: Yes (communitarian views may impose duty; liberal views may reject).  
     - **Rules out**: Theories conflating moral permission with enforceable duty.  

  6. **Object-Distinction Robustness**: The account must rigorously distinguish between attachment to *country*, *nation*, *state*, *government*, and *compatriots*.  
     - **Case**: Public official breaking law "for country" (testing state vs. country); emigrant’s attachment (nation vs. state).  
     - **Non-negotiable**: Yes (prevents state overreach/confusion).  
     - **Rules out**: Theories collapsing these concepts (e.g., "country = state").  

  7. **Historical Inquiry Neutrality**: Patriotism’s value must not inherently suppress critical inquiry into national history.  
     - **Case**: Country prospering via ongoing unacknowledged wrong.  
     - **Non-negotiable**: Yes (epistemic integrity in education).  
     - **Rules out**: Theories where patriotism necessitates myth-making or whitewashing.  

  8. **Non-Voluntary Attachment Validity**: It must recognize attachments not chosen (e.g., inherited, taught) as potentially valid.  
     - **Case**: Grandchildren loving a defunct polity; emigrant with enduring ties.  
     - **Non-negotiable**: Yes (empirically observed phenomena).  
     - **Rules out**: Theories requiring patriotism to be solely chosen/voluntary.  

  9. **Instrumental/Intrinsic Distinction**: The account must not conflate intrinsic value (patriotism as good in itself) with instrumental value (e.g., promoting solidarity).  
     - **Case**: Distinction between intrinsic/instrumental value.  
     - **Non-negotiable**: Yes (conceptual clarity).  
     - **Rules out**: Theories that reduce patriotism to *only* its effects or *only* inherent worth.  

  10. **Source-Content Separation**: The source of attachment (chosen, inherited, taught) must not dictate its moral content (e.g., inherited attachment can be critical).  
      - **Case**: Pupil’s taught-but-genuine virtue; reformer’s aspirational love.  
      - **Non-negotiable**: Yes (avoids genetic fallacy).  
      - **Rules out**: Theories judging attachments based on origin (e.g., "taught = inauthentic").  

  ---

  ### Flagged Conflicts
  - **Conflict 1**: *Requirement 1 (Non-coercive Authenticity)* and *Requirement 8 (Non-Voluntary Attachment Validity)*.  
    Cultivating "genuine" virtue in a captive audience may conflict with validating non-voluntary (taught/inherited) sources.  
    **Verdict**: This conflict indicts the *specification*—it exposes tension in democratic states cultivating unchosen attachments while demanding authenticity.  

  - **Conflict 2**: *Requirement 2 (State-Beneficiary Legitimacy)* and *Requirement 6 (Object-Distinction Robustness)*.  
    If the state cultivates attachment to "country" but benefits as "state," robust distinctions may collapse in practice.  
    **Verdict**: This is a *real result about the phenomenon*—state-led patriotism inherently risks conceptual blurring.  

  ### Most Exclusionary Requirement
  **Requirement 2 (State-Beneficiary Legitimacy)** does the most work in excluding candidates. It demands theories justify state involvement without self-serving corruption, ruling out:  
  - Views where patriotism is purely oppositional (incompatible with state cultivation).  
  - Theories where state authority inherently undermines attachment’s autonomy.  

  ---

  ### Scoring Candidate Views
  **1. Patriotism as loyalty to a political community’s constitutive values:**  
  - **Strengths**: Aces Critical Loyalty (R3), Historical Inquiry Neutrality (R7), and Object-Distinction (R6).  
  - **Weaknesses**: Fails Non-Identification Accommodation (R4) if values are homogenizing; struggles with Non-Voluntary Attachment (R8) if loyalty requires rational endorsement.  
  - **Verdict**: **Moderate fit**—viable if values are pluralistic, but may exclude non-identifying groups.  

  **2. Patriotism as identity-constituting partiality (familial model):**  
  - **Strengths**: Validates Non-Voluntary Attachment (R8) and Non-Identification cases (R4 permits opting out); handles negative judgment (R3).  
  - **Weaknesses**: Blurs Partiality-Obligation (R5—familial love often feels obligatory); risks conflating country/compatriots (R6); struggles with State-Beneficiary Legitimacy (R2—familial bonds resist state cultivation).  
  - **Verdict**: **Partial fit**—strong on affective dimensions but weak on democratic constraints.  

  **3. Patriotism as instrumental to redistributive solidarity:**  
  - **Strengths**: Meets Historical Inquiry Neutrality (R7—no need to distort history); justifies State-Beneficiary role (R2—if solidarity is a public good).  
  - **Weaknesses**: Fails Instrumental/Intrinsic Distinction (R9—reduces patriotism to utility); violates Non-coercive Authenticity (R1—instrumental attachment risks being manipulative); ignores non-instrumental cases (e.g., emigrant’s love).  
  - **Verdict**: **Poor fit**—undermines authenticity and intrinsic value, core to your cases.  

  ---

  ### Contested Empirical Claims  
  - **Requirement 8 (Non-Voluntary Attachment Validity)** rests on the claim that non-chosen attachments *can* be authentic virtues. If social psychology shows taught/inherited attachments are inherently heteronomous, this fails. Claim must hold that enculturation ≠ determinism.  
  - **Requirement 1 (Non-coercive Authenticity)** assumes captive-audience education *can* cultivate internal motivation. If empirical evidence shows compulsion undermines autonomy, this may be untenable. Claim must hold that pedagogy can mitigate coercion.  

  This specification excludes all theories failing non-negotiable requirements and forces explicit negotiation of contested ones.
