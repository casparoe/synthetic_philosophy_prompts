prompt: |-
  I'm designing a ninety-minute seminar for philosophy graduate students who understand basic social-choice theory but have not studied judgment aggregation. I want them to grasp the discursive dilemma not as a curiosity about majority voting, but as a structural problem that emerges specifically when an institution must issue a single collective decision together with a publicly intelligible reasoning chain. To carry the idea, I want to use one constructed case rather than the standard courtroom or hiring-committee scenario: a three-member municipal climate-adaptation board that must decide whether to approve a seawall project, where members vote separately on empirical premises (long-range flood-risk projections), normative premises (the moral weight of present costs versus future benefits), and meta-premises (which evidentiary standards are appropriate for climate models with high variance), and where the charter requires the board to publish a coherent justification that cites shared premises supporting the conclusion. Plan the explanatory arc. What concept must be secured first—specifically, why a published justification requirement makes this different from aggregating preferences or rankings—before the paradox can even be formulated? What must the example contain, and what must it deliberately lack, so that students do not reduce the problem to ordinary disagreement over outcomes or to strategic voting? Map the misconceptions in the order they will arise: for instance, that premise-based aggregation always eliminates the tension; that the paradox depends on an even number of voters; that delegating to a technical expert resolves the institutional problem; and that adding more premises makes the collective set more rather than less coherent. For each misconception, state the precise point in the sequence where it should be intercepted and how. Provide one check-for-understanding question that tests whether they see why the justification constraint makes the choice of aggregation rule non-arbitrary, not merely whether they can reproduce the formal structure of inconsistent triples. Finally, specify what should be explicitly left out at this level—such as formal impossibility results beyond the basic tension, probabilistic judgment aggregation, or weighted-premise extensions—and explain why omitting each protects the conceptual point rather than simplifying it away.
reasoning: |-
  Okay, the user wants to design a 90-minute seminar for philosophy grad students familiar with social-choice theory but new to judgment aggregation. The core goal is to frame the discursive dilemma as a structural problem tied to institutional requirements for coherent public justification, not just a voting paradox. 

  First, I need to identify the foundational concept: the published justification requirement. This transforms aggregation from preference counting into a logical coherence challenge. The seawall case must vividly show why aggregating premises separately from conclusions creates institutional tension when a unified rationale is mandatory. 

  For misconceptions: 
  - Premise-based voting seeming like a fix will likely come up early when I introduce the dilemma. Should intercept by showing how it violates the justification requirement if premises contradict the conclusion. 
  - The odd/even voter myth might surface during the initial paradox presentation. Best crushed with a counterexample using three voters. 
  - Expert delegation as a solution probably emerges during discussion phase. Need to emphasize how it dodges the core problem of collective reasoning. 
  - More premises = more coherence is subtle; students may intuit this when considering complex cases. Should demonstrate how added premises increase contradiction opportunities. 

  The seawall example needs deliberate omissions: no partisan motives (to avoid reducing it to strategic voting), no obvious "right" answer (to prevent outcome fixation), and no clear epistemic hierarchy (to block expert-crutch thinking). 

  For the check question, something like: "Why would premise-based voting fail the charter's requirement even if all premises are logically consistent?" Targets their grasp of justification vs mechanical aggregation. 

  Finally, boundaries: No Arrow-style impossibility theorems yet—those distract from the institutional framing. Probabilistic judgments or weighted premises would overcomplicate the core tension. Keeping it lean protects the "coherent public reason" angle. 

  Structurally: Spend first 20 minutes establishing the justification constraint as the game-changer. Then 30 minutes building the seawall case and revealing the paradox. Misconception-busting in real-time during Q&A. Last 10 minutes for the check question and implications tease. 

  ...Wait, did I miss why the board *must* publish shared premises? That's key. The charter forcing them to cite premises they may not collectively endorse is what creates the impossibility. Should underscore that when contrasting with preference aggregation.
answer: |-
  Here’s a structured explanatory arc for your seminar, designed to foreground the **institutional demand for public justification** as the core driver of the dilemma:

  ---

  ### **Explanatory Arc (90 mins)**
  #### **Phase 1: Framing the Institutional Constraint (20 mins)**
  - **Key Concept to Secure First**: The **published justification requirement** transforms aggregation from preference ranking into a **logical coherence problem**.  
    *Why?*  
    - In preference aggregation (e.g., Arrow), institutions output a *decision* (e.g., a ranking). Here, the board must also output a *shared rationale* citing premises that *logically entail* the conclusion.  
    - **Contrast**: Show a simple preference vote on the seawall (e.g., 2:1 approval) vs. the charter’s demand: *"Publish a syllogism all members accept as valid, even if they disagree on parts."*  
    - **Intercept Misconception 0**: "This is just voting with extra steps."  
      → *Response*: Highlight that the justification must be *collectively authored*—it cannot list dissenting premises or contradictory logic. The institution "speaks with one voice."

  #### **Phase 2: The Seawall Case & Paradox Construction (30 mins)**
  - **Case Setup**:  
    - **Conclusion (C)**: Approve seawall (Yes/No).  
    - **Premises**:  
      P1: Flood risk ≥ 20% by 2050 (Yes/No)  
      P2: Future lives > present costs (Yes/No)  
      P3: High-variance models require precautionary standard (Yes/No)  
    - **Logic**: (P1 ∧ P2 ∧ P3) → C  
  - **Voter Profiles** (Deliberately symmetric):  
    | Voter | P1 | P2 | P3 | Conclusion |  
    |-------|----|----|----|-----------|  
    | A     | Y  | Y  | N  | **N**     | (Reject: precaution unmet)  
    | B     | Y  | N  | Y  | **N**     | (Reject: costs > future benefits)  
    | C     | N  | Y  | Y  | **N**     | (Reject: risk too uncertain)  
    - **Majority Vote**: P1:Y (2-1), P2:Y (2-1), P3:Y (2-1) → **C:Y**  
    - **Individual Conclusions**: All vote **C:N**  
  - **Reveal the Dilemma**:  
    - Premise-based aggregation → Approve seawall (C:Y).  
    - Conclusion-based aggregation → Reject seawall (C:N).  
    - **Justification Requirement Violation**:  
      - If C:Y, the board must cite {P1, P2, P3} as grounds—but *no voter* endorses this full set (each rejects one premise). The rationale is **collectively incoherent**.  

  #### **Phase 3: Intercepting Misconceptions (25 mins)**
  1. **"Premise-based voting fixes everything."**  
     *When*: Immediately after showing the dilemma.  
     *Intercept*: Point out that premise-based C:Y requires endorsing {P1,P2,P3} as the institution’s rationale—yet all members *reject* this combination. The charter demands justification *the board stands behind*, not mechanical output.  

  2. **"The paradox needs even voters/ties."**  
     *When*: During Q&A after initial example.  
     *Intercept*: Show this asymmetric 3-voter case (no ties) still forces incoherence. Highlight: *"The problem is logical inconsistency, not vote-splitting."*  

  3. **"Delegate premises to experts."**  
     *When*: When discussing "solutions."  
     *Intercept*: Ask: *"Who delegates? What if experts disagree on P1 (risk) vs. P3 (epistemic standards)? The board still must *own* a unified rationale."* Emphasize the **institutional responsibility** for justification.  

  4. **"More premises increase coherence."**  
     *When*: If students suggest adding premises to resolve tension.  
     *Intercept*: Add a **fourth premise** (e.g., P4: Seawall minimizes ecosystem harm). Show new profiles where majority premises *still* contradict individual conclusions. Note: More premises expand opportunities for inconsistency (like doctrinal paradox).  

  #### **Phase 4: Check for Understanding (10 mins)**
  - **Question**:  
    *"Suppose the board uses premise-based voting but must amend the charter to publish only premises receiving unanimous support. Would this satisfy the justification requirement? Why/why not?"*  
    - **Target Insight**: Unanimous premises (e.g., none here) may be too weak to logically entail any conclusion—forcing either an **unjustified decision** or **paralysis**. The aggregation rule must produce both a decision *and* a coherent rationale from the collective inputs.  

  #### **Phase 5: Implications & Boundaries (5 mins)**  
  - **Core Takeaway**: The dilemma arises when an institution must act as a **unified rational agent**. The constraint isn’t technical but **constitutive** of public reason-giving.  
  - **What to Omit & Why**:  
    - **Impossibility Theorems** (e.g., List-Pettit): Too formal for this goal; distracts from institutional framing.  
    - **Probabilistic Judgments**: Preserves focus on binary logic as the simplest case.  
    - **Weighted Premises**: Avoids implying the problem is solvable by "tinkering" (it’s structural).  
    - **Strategic Voting**: The case lacks partisan incentives to keep attention on *logical* tension.  

  ---

  ### **Why This Works**
  - **The Seawall Case** lacks partisan bias, "correct" answers, and obvious power imbalances—forcing focus on **reasoning structure**.  
  - **Deliberate Omissions** prevent reductionism:  
    - No individual is an "expert" on all premises (blocks delegation fixes).  
    - No premise is inherently prior (blocks hierarchy solutions).  
  - **Progression** from institutional identity → logic → misconceptions mirrors how the dilemma emerges in real organizations.  

  This arc ensures students see the dilemma not as a math oddity, but as a **crisis of institutional rationality** when public justification is non-negotiable.
