prompt: |-
  You are an expert philosophy-of-mind debate coach with deep familiarity with analytic philosophy and cognitive science. Before drafting anything, take a moment to think through the dynamics of a skeptical academic audience. I need you to prepare me for a Q&A session.

  I have no formal academic background, but I have spent years thinking independently about what emotions actually are. Next Thursday I am presenting my view to a university seminar in philosophy of mind. The room will contain mostly analytic philosophers who work on mental representation, plus a few cognitive psychologists who study affective neuroscience. They are accustomed to the standard debate: are emotions judgments (in the Nussbaum-style tradition), perceptions (in the Prinz-style tradition), or bodily feelings (in the James-style tradition)? They value conceptual precision, empirical compatibility, and resistance to mystery-mongering.

  My thesis is this: emotions are none of those three things. Instead, they are what I call resonance locks — brief, unstable alignments between an interoceptive prediction about one's bodily state and an anticipated social evaluation that has not yet been resolved into either belief or sensation. In other words, an emotion is not a mental state you possess, but a transitional calibration event that occurs before the mind decides whether to treat the input as a judgment about the world or as a raw feeling inside the body. Once the calibration settles, what remains is either a belief or a sensation, but the emotional moment itself is that unsettled in-between.

  Please draft my prep sheet. I want:

  1. The six to eight objections I will actually face from this specific audience, ordered from the most damaging to the least, each phrased in the vocabulary they would actually use rather than as strawmen.

  2. For each objection: a concise two-minute reply that a non-academic speaker can deliver without sounding defensive; and a brief note on where that reply is weakest or softest.

  3. The one objection I am secretly hoping nobody raises — include it anyway, with the same format, and flag exactly why it is dangerous for my position.

  4. A short list of concessions I should make up front to lower the temperature and show I am not simply dismissing the entire literature.

  Keep everything practical and focused. Do not provide a bibliography, reading list, or citation requests. Do not invent verbatim quotations from real texts; if you need to refer to a standard position, paraphrase it in your own words. Make sure your advice respects that I have no institutional authority in the room, so credibility must be earned through clarity and strategic concession rather than appeals to authority.

  Please begin with a brief brainstorming of the audience's likely mental moves, then present the prep sheet.
reasoning: |-
  Okay, the user is preparing for a Q&A session after presenting their theory on emotions as "resonance locks" to a skeptical academic audience. They need a practical prep sheet focused on anticipated objections and strategic responses. 

  First, let's unpack the audience dynamics: analytic philosophers and cognitive psychologists who value precision and empirical grounding. They'll be primed to defend the three dominant emotion theories (judgment, perception, bodily feeling). The user's outsider status means they can't rely on academic authority—their credibility hinges on clarity and well-placed concessions.

  Hmm... the core tension here is between the user's novel "calibration event" framing and the field's expectation of emotions as stable mental states. The audience will likely attack:
  - Conceptual vagueness (how can something be "unsettled" yet identifiable?)
  - Empirical testability (where's the neural signature for this transition?)
  - Compatibility with existing data (doesn't this contradict well-established findings?)

  *Brainstorming likely objections:*
  1. **The "Ghost Process" Challenge:** If emotions are transient calibration events, how do we study them? This threatens the theory's scientific viability.
  2. **Boundary Problem:** Philosophers will demand sharp distinctions between emotions and non-emotions. The "unstable alignment" description sounds fuzzy.
  3. **Causal Exclusion Anxiety:** If emotions don't cause behavior (since they dissolve into beliefs/sensations), what explanatory work do they do?
  4. **Predictive Processing Mismatch:** The user borrows "prediction" terminology but may misuse computational neuroscience concepts.
  5. **Phenomenology Gap:** How does this account for the felt quality of emotions? The theory seems to sidestep subjective experience.
  6. **Category Collapse:** Does this make all unresolved bodily-social alignments emotions? That seems overinclusive.
  7. **The "Secret Hope" Objection:** If emotions are pre-cognitive, how do they differ from reflexes? This blurs a carefully guarded line.

  *Strategic priorities for replies:*
  - **Avoid defensiveness:** Frame responses as clarifications, not counterattacks.
  - **Embrace constraints:** Explicitly acknowledge where the theory is underspecified.
  - **Leverage interdisciplinary tension:** Psychologists' data about emotion instability can counter philosophers' demand for neat categories.
  - **Concede early:** Admit gaps in neural mechanisms and operationalization to build goodwill.

  *Danger zone:* The reflex objection (#7) is lethal because it forces the user to either (a) abandon the pre-cognitive claim or (b) equate emotions with automatic processes—both undermine the theory's novelty. The safest path is to emphasize the *social evaluation* component as differentiator.

  *Essential concessions upfront:*
  - Nod to James for highlighting bodily feedback
  - Credit predictive processing frameworks
  - Acknowledge judgment/perception theories capture settled states well

  The user's strength lies in explaining why existing models struggle with emotional transitions. If they position resonance locks as solving a *specific gap* rather than replacing whole paradigms, they might survive Q&A.
answer: |-
  Here's your prep sheet, structured for maximum tactical impact. I've reverse-engineered objections from standard analytic philosophy/cognitive science playbooks, prioritizing audience-specific concerns. The tone balances intellectual rigor with humility—essential given your outsider status.

  **Audience Brainstorming Snapshot:**  
  They'll assume you're unaware of: (a) how predictive processing accounts *already* handle valence (e.g., Barrett), (b) philosophers' work on "emotional dispositions" (DeLancey), and (c) empirical evidence for emotion duration (e.g., affective neuroscience shows emotions can persist). Expect nitpicking on "interoceptive prediction" (is it Bayesian? Friston-compatible?) and demands to operationalize "resonance lock." Psychologists will seek testable markers; philosophers will attack conceptual coherence.  

  ---

  **Prep Sheet: Resonance Lock Q&A Defense**  

  ### 1. Top Objections & Replies  
  *(Ordered by damage potential: conceptual > empirical > terminological)*  

  **Objection 1 (Philosophy: Conceptual Vagueness)**  
  *"You claim emotions aren't mental states but 'calibration events.' This violates ontological parsimony. How can something causally efficacious—as emotions clearly are—be a transient 'event' rather than a state? Events don't cause; they're constituted by state-changes. Your model seems to reify a process."*  
  **Your Reply (1.5 min):** "I agree events require state-changes—that's precisely my point. Emotions *are* those changes: the dynamic 'unlocking' phase where predictive models conflict. Think of software installing an update: the 'progress bar' isn't the program or the update file, but the recalibration *between* them. It causes behavior (e.g., freezing in surprise) precisely by being unstable. Once stable, it's no longer emotion but belief/sensation."  
  *Weakness:* Doesn't fully resolve whether "events" can *be* causes vs. merely involve them.  

  **Objection 2 (Cognitive Science: Untestability)**  
  *"If emotions dissolve into beliefs/sensations post-calibration, how do we isolate 'resonance locks' empirically? fMRI can't capture millisecond transitions. This makes your theory unfalsifiable—a common flaw in non-mechanistic accounts."*  
  **Your Reply (1.5 min):** "We already detect similar transitions: mismatch negativity in EEG shows prediction errors resolving in 100-200ms. I’d look for *coupled* signals—e.g., simultaneous insula (interoceptive) and mPFC (social evaluation) activation decaying rapidly. If we only see one *or* the other post-event, it supports my model. This is testable with high-temporal-resolution tools."  
  *Weakness:* Current tech can't reliably track cross-region coupling at this speed.  

  **Objection 3 (Philosophy: Explanatory Redundancy)**  
  *"Why add 'resonance locks' when existing predictive processing accounts (e.g., Clark 2013) already explain valence via prediction-error minimization? Your 'social evaluation' layer seems ad hoc."*  
  **Your Reply (1 min):** "Standard PP explains *why* we feel good/bad, not *how* an unresolved state becomes emotion. Social evaluation isn't an add-on—it's the key conflict: 'Is this stomach flutter hunger (interoceptive) or anxiety (social)?' Until resolved, it's emotion. PP handles resolution; I target the *liminal* phase PP glosses over."  
  *Weakness:* Social evaluation may reduce to multi-level prediction (Hohwy 2013).  

  **Objection 4 (Psychology: Duration Mismatch)**  
  *"Affective science shows emotions like grief last months. You call them 'brief' and 'unstable'—contradicting evidence. How can your model accommodate sustained emotions?"*  
  **Your Reply (1 min):** "Grief isn't one emotion but a label for recurring resonance locks—e.g., a memory triggers body-signal/social-expectation conflict anew. What persists is the *disposition* for recalibration (like a fault line), not the lock itself. My model explains the *moments* you feel grief acutely, not its narrative arc."  
  *Weakness:* Risks conflating emotion episodes with dispositions.  

  **Objection 5 (Philosophy: Category Errors)**  
  *"If emotions are pre-decisional, how do they differ from mere cognitive dissonance or undecided perceptual ambiguities? You've overextended 'emotion' to include all unresolved conflicts."*  
  **Your Reply (1 min):** "Only conflicts *binding* interoception and social evaluation qualify. Dizziness from spinning (interoception alone) isn't emotion; judging a speech boring (social evaluation alone) isn't either. But dizziness *while* judging your credibility as a speaker? That *is* anxiety—the lock *is* the binding."  
  *Weakness:* "Binding" needs stricter criteria to exclude edge cases.  

  **Objection 6 (Both: Folk Intuition Gap)**  
  *"This clashes with phenomenology. When I feel rage, it's clearly *my* state—not some ephemeral 'calibration.' You're eliminating the first-person reality of emotions."*  
  **Your Reply (1 min):** "Rage *feels* stable because calibration is fast—often under 500ms. But notice how rage can vanish instantly when context shifts (e.g., realizing your 'insulter' was joking). That’s the lock disengaging. What you recall as 'rage' is the settled belief ('I was wronged') plus somatic traces ('heat')."  
  *Weakness:* Introspection can't verify sub-second transitions.  

  ---

  ### 2. The "Secret Hope" Objection (DANGER ZONE)  
  **Objection:** *"If resonance locks precede belief/sensation formation, they must be non-conscious. But emotions are paradigmatically conscious experiences. Your model renders emotions invisible to the agent—contradicting the very phenomenon it claims to explain."*  
  **Why Dangerous:** It forces you to either (a) deny that emotions are conscious (implausible), or (b) concede locks are conscious, undermining your "pre-decisional" claim.  
  **Your Reply (2 min):** "Consciousness isn't binary. Locks likely occupy a 'gist-like' awareness—fuzzy, urgent, but not yet conceptualized (like seeing a shape but not *as* a dog). Post-resolution, we *retroject* stability onto the lock. This mirrors 'flow' states or subliminal priming, where consciousness lags behind processing. Yes, it challenges folk views—but so did Helmholtz on unconscious inference."  
  *Weakness:* Appeals to "gist-awareness" sound hand-wavy without empirical anchors.  

  ---

  ### 3. Strategic Concessions to Make Upfront  
  *(Use these in your intro to preempt hostility)*  
  - **"James was right:** Bodily feedback is indispensable—but it's input *to* calibration, not emotion itself."  
  - **"Nussbaum/Prinz capture truths:** Settled emotions often become judgments or perceptions. My model addresses why they *aren't yet* those things."  
  - **"Predictive processing is foundational:** Interoceptive predictions are core to my model. I depart only in emphasizing *social* predictions as equally primitive."  
  - **"This is a framework, not a finished theory:** I welcome corrections on terminology (e.g., 'event' vs. 'process') and will flag speculative leaps."  

  **Key Delivery Tip:** When conceding, say "You're right to point out..." to validate the critic. When explaining, use analogies (software updates, fault lines) to bridge academic/non-academic gaps. Stay rooted in "problem-solving" language—e.g., "This model resolves X puzzle in the literature." Neutralize skepticism by showing you've *constrained* the mystery, not deepened it.  

  With this, you'll project competence without overreach. Good luck.
