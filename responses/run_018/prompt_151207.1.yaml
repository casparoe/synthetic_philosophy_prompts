  I need to cover how subjective feelings map to lighting design and how hidden mechanisms (like brain processes) relate to ropes, pulleys, and dimmers. Then, they want a "residue report" – which parts of the theory fit perfectly with theater, which need some stretching, and which have no counterpart at all. Finally, I should discuss whether the gaps mean theater is a bad framework for talking about minds or if they reveal that the original "user illusion" idea was vague about what counts as an illusion.

