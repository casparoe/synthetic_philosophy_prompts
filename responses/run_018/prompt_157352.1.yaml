prompt: |-
  I'm a journalist covering science and ideas, and I'm helping a philosophy lecturer draft a hard final for her MA course on Buddhist metaphysics and personal identity. She wants one 90-minute essay question that can't be answered by just summarising teh anatta sutras or Parfit's bundle theory — it needs to be in the weeds. The focus should be on conceptual slippage in a microdomain: specifically, how diachronic anatta (no persisting substrate across time) and synchronic anatta (no unified subject at a given moment) get blurred when the idea is imported into Western philosophy of mind, and whether that slippage undermines the argument. The prompt should ask students to evaluate the objection that if there's no self, then 'my suffering' loses its referent, and whether distinguishing proprietary ownership (having an experience) from agential ownership (being responsible) can rescue anatta. She needs the question, a model answer of about 500–600 words, and a marking scheme with four must-hit points (marks out of 20) plus a one-line note on how candidates usually mess each up. Casual tone is fine — I might have missed a typo or two myself. Please use British English, and don't include any bibliographies or citation requests since it's a closed-book exam.
