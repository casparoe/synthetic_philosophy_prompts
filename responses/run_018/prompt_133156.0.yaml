answer: |-
  ### **Cultural Transmission Game: "Attractor Reconstruction Chains"**  
  **Objective:** Simulate cultural transmission to expose flaws in meme theory—specifically, the lack of genotype/phenotype split, reconstructive (not replicative) transmission, and cognitive attractors biasing "mutations." Participants experience why selection acts on **outputs**, not replicators.  

  ---

  ### **Game Setup**  
  **Roles & Participants (14 Students):**  
  - **Ancestors (A1, A2):** 2 students. Start with the seed practice.  
  - **Vectors (V1–V4):** 4 students. Observe a practice **once** and later transmit it.  
  - **Hosts (H1–H8):** 8 students. Reconstruct practices from **partial cues** + observation.  

  **Materials:**  
  - Index cards (3 per person)  
  - Pens  
  - Stopwatch  
  - Whiteboard for scoring  
  - Secret "Fitness Payoff" sheet (for facilitator only)  

  **Seed Practice:**  
  A 30-second ritual:  
  1. **Tap forehead twice**  
  2. **Spin clockwise 3 times**  
  3. **Hum a high-pitched "E" note**  
  4. **Draw a triangle in the air with left hand**  
  5. **End with arms crossed**  

  *(Designed with arbitrary elements [e.g., triangle, "E" note] and cognitive attractors [e.g., symmetry, spinning]).*  

  ---

  ### **Rules**  
  1. **Absolute Silence:** No verbal instructions, questions, or gestures during transmissions.  
  2. **Transmission Flow:**  
     - **Chain 1:** A1 → V1 → H1 → H2 → H3 → H4  
     - **Chain 2:** A2 → V2 → V3 → V4 → H5 → H6 → H7 → H8  
     *(Vectors transmit after one observation; Hosts reconstruct from cues + observation.)*  
  3. **Key Mechanics:**  
     - **Ancestors:** Perform seed once per vector. **Write 1 cryptic cue** (e.g., "2 taps, spin, hum") on a card post-performance.  
     - **Vectors:** Observe ancestor/vector **once**, then later perform **from memory**. No cue cards.  
     - **Hosts:** Receive **one index card** with partial cues from predecessor. **Read cues → Observe performance → Reconstruct + Perform**. Post-performance, **write new cues** for next host.  
  4. **Fitness Payoff (Hidden):**  
     - **Ease of Recall:** Shorter performances score higher (secretly timed).  
     - **Impressiveness:** "Attractor-aligned" actions (e.g., spinning > triangles) earn bonus points.  
     - **Scoring:** Facilitator records scores covertly. *Participants think they’re rewarded for "fidelity," but fitness pressures are skewed toward cognitive biases.*  

  ---

  ### **Timeline (90 Min)**  
  **1. Setup (10 min):**  
  - Assign roles, explain rules, emphasize silence.  
  - Ancestors learn seed; others practice note-taking.  

  **2. Transmission Rounds (45 min):**  
  - **Ancestor → Vector (5 min):**  
    - A1/A2 perform for V1/V2 (30 sec each). Vectors watch → ancestors write cue cards (collected by facilitator).  
  - **Vector → Vector/Host (15 min):**  
    - V1→H1, V2→V3 (30 sec perform + 1 min buffer). *Vectors perform from memory.*  
  - **Host → Host (25 min):**  
    - Each host: **Read cues (1 min) → Observe predecessor (30 sec) → Reconstruct + Perform (30 sec) → Write new cues (1 min)**.  
    *(e.g., H1 reads A1’s cues, watches V1, performs, writes cues for H2.)*  

  **3. Scoring & Debrief (35 min):**  
  - **Reveal Scores (5 min):** Show fitness payoffs. Highlight mismatches (e.g., "H3 scored high despite low fidelity—why?").  
  - **Chain Reconstruction (10 min):** Last hosts perform. Compare to seed.  
  - **Guided Discussion (20 min):** Map game moments to theory:  
    - **Replication Failure:** "Why did the triangle become a circle? Hosts had cues + observation—yet it mutated *systematically*."  
    - **Selection on Outputs:** "H4 scored highest by spinning *more* (attractor), not copying perfectly. Fitness favored ease/impressiveness, not replicators."  
    - **Collapse of Meme Ontology:** "What was the ‘meme’? The cue? The performance? The idea? None—it was **reconstructed outputs** all the way down."  
  - **Cognitive Attractors:** "Mutations weren’t random noise—they bent toward symmetry (spinning), familiarity (humming ‘A’ not ‘E’), and simplicity."  

  ---

  ### **Predictable Problems & Fixes**  
  **Problem 1: Smuggled Instructions**  
  - *Risk:* Vectors whisper hints or hosts "over-write" cues.  
  - *Fix:* Assign a "Silence Enforcer" student. Ban pens during others’ performances. Confiscate over-detailed cues.  

  **Problem 2: Invented Copying**  
  - *Risk:* Vectors take notes or hosts peek at predecessors’ cues.  
  - *Fix:* Use color-coded cards (e.g., hosts get blue cards; vectors get none). Isolate performers.  

  **Problem 3: Chain Collapse**  
  - *Risk:* Total reconstruction failure (e.g., host freezes).  
  - *Fix:* Let them improvise—then discuss how "error catastrophe" mirrors cultural drift.  

  ---

  ### **Limitations & What You Must Explain**  
  **The Intentionality Gap:**  
  - The game **can’t simulate** how humans reconstruct culture through *meaning* (e.g., "I changed the ritual to honor my grandma").  
  - **Bridge in Debrief:** "Unlike genes, cultural ‘mutations’ are guided by **intentionality**—we tweak practices to fit beliefs, identities, or goals. Meme theory ignores this."  

  **Representation vs. Replication:**  
  - The game shows cues as degraded "phenotypes," but **can’t prove** there’s no hidden "genotype."  
  - **Bridge in Debrief:** "In biology, genes (genotype) survive even if a trait (phenotype) fails. But here, **cues are just another output**—if a host dies, their ‘meme’ dies too."  

  ---

  ### **Why It Works**  
  Participants experience:  
  1. **Reconstruction > Replication:** Hosts *generate* practices from cues + biases—not copy-paste.  
  2. **Attractors > Random Mutation:** Systematic shifts (e.g., triangles → circles) reveal cognitive landscapes.  
  3. **Output Selection:** High scores go to attractive/easy versions—*even with low fidelity*.  
  4. **No Replicators:** Cues are unstable; performances vary. Where’s the "meme"? Nowhere.  

  **Outcome:** Students viscerally grasp why culture evolves *like* Darwinian systems—but without replicators.
