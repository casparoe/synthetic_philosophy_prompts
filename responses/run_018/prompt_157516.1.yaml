answer: |-
  ## Ethics Seminar Final Exam Question  

  **Time Allowed:** 45 minutes  
  **Word Count:** 800-1000 words  

  **Prompt:**  
  Critically evaluate the claim that acts typically labelled "supererogatory" (morally praiseworthy acts "beyond the call of duty") cannot be understood independently of institutional context. Defend **one** of the following positions as the most compelling framework:  

  *   **(A) Institutional Failure Thesis:** Supererogation is fundamentally a response to institutional inadequacy or failure. In a world with morally perfect institutions distributing burdens justly, the category of supererogation would collapse entirely; acts currently deemed heroic would become either obligatory (if the institution absorbed the cost) or recklessly foolish (if they imposed unnecessary harm).  
  *   **(B) Virtue Primacy Thesis:** Supererogation is primarily an expression of individual character and virtue. The moral praiseworthiness of an act like diving into a frozen lake to save a stranger resides solely in the agent's extraordinary sacrifice and intention, irrespective of whether institutions functioned perfectly or failed catastrophically. The institutional context is morally irrelevant to the act's supererogatory status.  
  *   **(C) Contextual Differentiation Thesis:** While the core moral worth of a supererogatory act stems from the agent's character and sacrifice, the *institutional context* profoundly shapes the *nature of the praise* and *societal interpretation* owed. It does not erase the act's moral status but determines whether the praise carries admiration, tragic necessity, or critique of the system.  

  **Your essay must:**  
  1.  Clearly state and defend your chosen position (A, B, or C).  
  2.  **Explicitly engage with the "Moral Residue Objection":** If you choose (A), address the concern that it reduces saints to mere "janitors" for broken systems, erasing genuine virtue. If you choose (B) or (C), explain how your position avoids this reduction.  
  3.  **Explicitly engage with the "Cost-Internalization Problem":** If you choose (B), address the concern that ignoring institutional context neglects the fundamental purpose of institutions – to fairly distribute burdens and prevent individuals from bearing catastrophic costs. If you choose (A) or (C), explain how your position accounts for this.  
  4.  Analyze the "reverse case": Assess how your chosen position interprets the act of diving into a frozen lake to save a stranger *within a society possessing morally perfect institutions*. Does it remain supererogatory? Why or why not?  

  *(Note: No bibliography is required. Focus on clear, concise philosophical argumentation.)*  

  ---

  **Model Answer (Approx. 900 words):**  

  **Defending the Contextual Differentiation Thesis (C)**  

  The debate surrounding supererogation often stalls between viewing heroic acts as mere symptoms of systemic failure or as purely individual virtues detached from context. Position (C), the Contextual Differentiation Thesis, offers a more nuanced path. It argues that while the *core moral worth* of a supererogatory act is rooted in the agent’s extraordinary character, sacrifice, and beneficence, the *institutional environment* is not morally inert. Instead, it critically shapes the *meaning and societal reception* of the act, differentiating the *kind* of praise warranted without negating the act’s inherent moral praiseworthiness. This framework best navigates the objections while preserving both individual virtue and institutional accountability.  

  Consider the classic supererogatory act: diving into a frozen lake to save a drowning stranger. The core moral worth resides in the rescuer’s profound altruism, willingness to risk life and limb for another, and the sheer magnitude of the sacrifice undertaken freely, beyond any reasonable demand of duty. This virtuous character and action are the bedrock of supererogation’s moral significance, regardless of context **(engaging Virtue Primacy)**. However, Position (C) insists that context is not irrelevant. Imagine two scenarios:  

  1.  **Scenario 1 (Institutional Failure):** The lake is in a public park chronically neglected by the civic authority. Warnings are non-existent, safety barriers are broken, and rescue services are underfunded and slow. Here, the rescuer’s heroism absorbs a cost the institution *should* have borne through preventative measures or rapid response. While the rescuer’s character remains virtuous and praiseworthy, the societal praise rightly carries a strong undercurrent of tragedy and institutional critique. We praise the individual *despite*, and in stark contrast to, the failing system. The act highlights institutional neglect; the rescuer becomes, in part, a corrective to systemic dereliction.  
  2.  **Scenario 2 (Perfect Institutions):** The lake is in a jurisdiction with morally perfect institutions. Robust preventative measures (fencing, sensors, clear warnings) were in place but unforeseeably circumvented (e.g., an unprecedented ice shift). Instantaneous, perfectly effective automated rescue systems deployed immediately but were momentarily delayed reaching the exact spot. The rescuer, witnessing the unique immediacy of the threat, acts impulsively. Here, the rescuer’s courage and sacrifice remain extraordinary and morally praiseworthy. However, the societal praise is *purely* admiration for individual virtue and spontaneous altruism. It lacks the tragic or critical dimension present in Scenario 1. The institutions fulfilled their role; the heroic act exists *alongside* them, not *because* of their failure.  

  **Addressing the Moral Residue Objection:** Position (C) directly counters the concern that acknowledging institutional context reduces saints to "janitors" **(Moral Residue Objection)**. It does this by maintaining a strict separation between the *act's inherent moral worth* (always tied to the agent's character and sacrifice) and the *societal context* shaping the *expression* of praise. In Scenario 1, while the act exposes institutional failure, the rescuer is *not merely* a janitor. Their action still required immense, freely given courage and selflessness – virtues that wouldn't exist if they were merely fulfilling an institutional role. The praise includes profound admiration *for them*, layered with anger *at the system*. Position (C) preserves the virtue while acknowledging the systemic tragedy; it doesn't reduce one to the other. Position (B) ignores this crucial layering, while Position (A) risks erasing the individual virtue entirely by making the act *only* about the system.  

  **Addressing the Cost-Internalization Problem:** Position (C) also satisfactorily addresses the **Cost-Internalization Problem** – the idea that institutions exist to distribute burdens fairly and prevent individuals from bearing catastrophic costs. It does this by recognizing that context shapes the *interpretation* of the cost-bearing. In Scenario 1, the societal praise *incorporates* the understanding that the rescuer bore a cost the institution unfairly externalized. This is part of the "tragic" dimension of the praise – it acknowledges the injustice *while still* praising the individual's virtue in responding to it. Position (C) demands we see the *full picture*: the virtue of the act *and* the institutional injustice it may reveal. Position (B) ignores the injustice aspect, potentially legitimizing unfair burden-shifting by celebrating it as pure virtue. Position (A) sees only the injustice, ignoring the genuine virtue displayed in responding to it even under unfair conditions.  

  **Conclusion:** The Contextual Differentiation Thesis (C) provides the most robust framework. It affirms the indispensable core of supererogation – extraordinary individual virtue and sacrifice – while acknowledging that institutional context is not a moral void. Context determines whether praise is tinged with tragedy and critique (when absorbing institutional failure) or is pure admiration for virtue shining against a backdrop of functional fairness. It navigates the pitfalls of reducing heroes to system janitors (Objection 1) or ignoring the purpose of institutions in distributing burdens (Objection 2). The rescuer diving into the frozen lake in a perfect institutional world (the reverse case) remains a saint – their act retains its core supererogatory moral status based on sacrifice and virtue – but the praise they recieve is unambiguously focused on their individual nobility, devoid of systemic critique. Institutional context changes the resonance, not the root, of the praise.  

  ---

  **Marking Scheme (Total: 25 Marks)**  

  | Must-Hit Move                                                                 | Marks | How Candidates Typically Blow It                                                                 |
  | :---------------------------------------------------------------------------- | :---- | :---------------------------------------------------------------------------------------------- |
  | **1. Clear Thesis & Position Defense:** Explicitly states and consistently argues for A, B, or C. | 5     | Waffles between positions, fails to commit, or misstates the chosen thesis.                     |
  | **2. Engages Moral Residue Objection:** Directly addresses the "janitor" concern relevant to their position. | 5     | Ignores it, mentions it vaguely without analysis, or misapplies it to the wrong position.       |
  | **3. Engages Cost-Internalization Problem:** Directly addresses the fair burden-distribution concern relevant to their position. | 5     | Ignores it, conflates it with Moral Residue, or fails to connect it to institutional purpose.   |
  | **4. Analyzes Reverse Case:** Applies their position to the "frozen lake in perfect institutions" scenario. | 5     | Omits the reverse case, gives a superficial answer, or applies it inconsistently with thesis.   |
  | **5. Avoids Crude Reductionism:** Avoids defining supererogation *only* as "beyond duty" & grapples with institutional complexity. | 5     | Relies solely on memorized definitions, ignores nuance, reduces act to *either* virtue *or* system failure. |

  **Grade Boundaries (Approximate Guide):**  
  *   **A (21-25):** Hits all moves strongly; sophisticated argument; clear, precise writing; deeply engages objections & reverse case.  
  *   **B (16-20):** Hits most moves well; solid argument; good engagement with objections & reverse case; minor weaknesses.  
  *   **C (11-15):** **Maximum grade for memorized definition approach.** Superficial treatment; may state a position but defend weakly; addresses objections minimally/formulaically; reverse case analysis weak/absent; relies on "beyond duty" without depth.  
  *   **D (6-10):** Significant weaknesses; poor thesis; misses key moves; confused argument; major omissions.  
  *   **F (0-5):** Little relevant content; fails to address prompt; severe misunderstanding.  

  *(Note the deliberate typo: "recieve" in the model answer conclusion.)*
