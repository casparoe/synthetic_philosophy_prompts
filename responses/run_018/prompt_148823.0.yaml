  Can you break down the distinct precise claims hiding inside that slogan? I want the menu: which readings are just restating ex contradictione quodlibet in dramatic language, which ones make substantive claims about specific paraconsistent frameworks (like whether relevance logics or truth-glut frameworks actually block arbitrary derivation), which ones confuse syntactic explosion with some kind of causal cascade in a neural network, and which ones are just false? Tell me which interpretation my friend was probably invoking when they used it to dismiss paraconsistent approaches for AI, and whether that interpretation holds up once you separate the formal logic from the engineering metaphor. Also, if there's a version of the slogan that's actually defensible and does support theier anti-dialetheist conclusion, flag it — but don't just pick one reading and explain it; lay them out side by side with verdicts.
