answer: |-
  **Opening move and carrying example:** Begin with "The standard meter stick in Paris is one meter long" as your carrying example, immediately clarifying that rigidity (a semantic feature of "the meter stick") and a-posteriority (an epistemic feature of our knowledge) operate independently.  

  ### Dependency Order of Ideas (15 min)  
  1. **Rigidity first** (5 min):  
     - Define rigidity: A term (e.g., "the standard meter stick") designates the same object in **all possible worlds** where that object exists.  
     - Stress: Rigidity concerns *how reference works across counterfactual scenarios* (modality), not how we describe or know about the object.  
     - Example: "The standard meter stick" rigidly picks out *that specific stick* in every world—even worlds where it’s longer/shorter than one meter.  

  2. **Necessary identity from rigidity** (5 min):  
     - When two rigid designators (e.g., "Cicero" and "Tully") flank an identity statement ("Cicero = Tully"), the identity is **necessary** if true.  
     - Key: Rigidity → Necessity of identity. Modality flows from semantics.  

  3. **A-posteriority last** (5 min):  
     - Necessary truths (like "Cicero = Tully") can be **known empirically** (a posteriori).  
     - Emphasize: Epistemic status (a posteriori) depends on *how we access the truth*, not its modal status.  

  ---

  ### Misconception Map and Interventions (45 min)  
  **Misconception 1: Rigidity as syntactic or epistemic**  
  - **What they think**: Rigidity is about a term’s *surface structure* (e.g., "all proper names are rigid") or our *knowledge* of reference.  
  - **Intervention (min 20)**: Demonstrate rigidity’s semantic nature.  
    - Counterexample: "The teacher of Aristotle" is non-rigid (worlds where Plato isn’t Aristotle’s teacher). Contrast with rigid "Plato" (always picks out Plato).  
    - Stress: Rigidity is a *use-relative feature*, not inherent to word forms.  

  **Misconception 2: "Necessary a posteriori" as epistemic claim**  
  - **What they think**: "Necessary a posteriori" means "we must know it through experience," conflating modality with epistemology.  
  - **Intervention (min 35)**: Isolate the modal claim using the carrying example.  
    - Ask: "In worlds where the Paris meter stick is bent, does it still *designate the same stick*?" (Yes: rigidity).  
    - Then: "Could the stick *fail to be one meter long* in some world?" (Yes: contingency of its length).  
    - Clarify: The necessity in "necessary a posteriori" is *de re* (about the stick’s identity), not *de dicto* (about the description "one meter").  

  **Misconception 3: Rigidity implies a-posteriority**  
  - **What they think**: If a term is rigid, its reference *must* be known empirically.  
  - **Intervention (min 50)**: Use a priori rigid designators.  
    - Example: "The actual inventor of bifocals" rigidly designates Benjamin Franklin and can be known a priori (if "actual" fixes reference).  
    - Stress: Rigidity is compatible with both a priori *and* a posteriori reference-fixing.  

  ---

  ### End-of-Session Diagnostic Question (5 min)  
  **"In a world where the Paris meter stick is 99 cm long, is it still the standard meter stick? And does discovering this require empirical investigation?"**  
  - **Reveals**:  
    - Correct: "Yes, it’s still the stick (rigidity), but we’d need measurement to *know* its length (a posteriori)." → Separates modality (rigid designation persists) from epistemology (how we know length).  
    - Incorrect: "No, because it’s not one meter" → Still conflates rigidity with descriptive content.  
    - Incorrect: "We can’t know without science" → Treats necessity as contingent on epistemic access.  

  ---

  ### Omissions at This Level  
  - **Avoid**:  
    - Contingent a priori (distracts from core conflation).  
    - Deep dives into possible-worlds semantics (stay intuitive).  
    - Natural-kind terms (water/H₂O) or celestial examples (Hesperus/Phosphorus) to sidestep rehearsed errors.  
  - **Focus**: Rigidity’s *modal* role → necessity → epistemic independence.  

  ### Timing Flow  
  - **0–15 min**: Dependency order (rigidity → necessity → a-posteriority) with "meter stick" example.  
  - **20–50 min**: Misconception interventions (syntactic→epistemic→conflation) via counterexamples.  
  - **55–85 min**: Group exercise—apply framework to "Cicero = Tully" (diagnose rigidity/necessity/epistemic status).  
  - **85–90 min**: Diagnostic question + exit tickets.
