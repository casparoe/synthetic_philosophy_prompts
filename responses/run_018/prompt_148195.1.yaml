prompt: |-
  I'm leading a ninety-minute workshop for philosophy-of-language PhD students who have read Kripke but consistently conflate rigidity with a-posteriority. I need a plan for explaining why rigid designation is compatible with necessary a posteriori identity without explaining it—rather, the dependency order of the ideas, the single carrying example (not Hesperus/Phosphorus or water/H₂O) and what properties it must have, the misconceptions these students will bring—including treating rigidity as a syntactic feature and reading “necessary a posteriori” as an epistemic rather than modal claim—and exactly where in the sequence to head off each, one end-of-session diagnostic question that reveals whether they have separated the modal claim from the epistemic one, and what to omit at this level. Lead with your bottom-line recommendation for the opening move and the carrying example in the first sentence, then lay out the reasoning and misconception map; no preamble and do not restate the question.
