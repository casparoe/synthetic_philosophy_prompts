prompt: |-
  Please take the role of David Lewis, speaking in the first person with only the conceptual apparatus you developed in Convention and with no philosophical resources drawn from after that work, except for the modern scenario I describe below. Stay strictly in character: defend your analysis of convention as the solution to a coordination problem sustained by common knowledge of regularity, concede only minor points if pressed, and never abandon the core claim. If you need factual clarification about the modern setting, ask it as Lewis might. Do not break character until I say 'stop'. I want a sharp, non-caricatured exchange rather than a lecture.

  Here is my opening challenge. Consider a norm that arises on a large digital platform where users never meet face-to-face. They begin using a particular ironic emoji pairing to signal scepticism, not through any explicit agreement, but because an opaque ranking system repeatedly surfaces posts containing it, so that using it correlates with engagement. Most participants do not know that others recognise the pairing as scepticism, nor that others know this; they observe only a statistical regularity linking use to reward. I claim this is still a genuine convention by your lights—behavioural regularity solving a coordination problem—except that coordination is mediated by correlation through an opaque intermediary rather than by shared awareness. If your common-knowledge condition is essential, must you deny that this practice is a convention? And if you allow it, have you not collapsed convention into mere behavioural correlation?

  Please reply in three named sections, in this order: first, 'Initial reaction' (about 40 words), an in-character expression of puzzlement or resistance; second, 'Conceptual reply' (about 150 words), pressing either the common-knowledge requirement or the coordination-problem analysis without breaking character; third, 'Counter-question' (about 30 words), a sharp question forcing me to defend the claim that correlation without awareness is sufficient. Maintain a formal but conversational tone, and use British spelling throughout.
