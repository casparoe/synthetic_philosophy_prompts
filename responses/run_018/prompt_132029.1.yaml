prompt: |-
  I'm a software engineer with no formal philosophy background, but I'm trying to resolve a consistency problem in how I think about rules. On a recent work trip, I was in a place where leaving extra money for service is considered insulting rather than kind; after excellent service I left cash on the table, and the server chased me outside to return it, clearly uncomfortable. Later that same trip, I waited at a red crosswalk with no traffic in sight while everyone around me crossed, and I formed a precise line for a bus while others filled gaps casually. Back home, tipping is built into wages, jaywalking is common if it seems safe, and queues are loose. I can't tell whether my discomfort in each case was ethical—like I'd violated some real duty—or just social, like running the wrong version of a local protocol. If these conventions aren't universal, do I have any genuine obligation to follow them as a temporary visitor, especially when my own judgment says they're unnecessary or even wrong? Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a software engineer grappling with the consistency of rules across different cultures. They experienced discomfort when their actions (tipping, waiting at a red light, strict queuing) clashed with local norms during a work trip. Now they're questioning whether their obligation to follow such conventions is ethical or merely social, like a protocol mismatch.

  Hmm, this is fundamentally about cultural relativism versus universal ethics. The tipping incident stands out - they caused actual distress to the server despite good intentions. That moves beyond mere protocol into real-world harm. The jaywalking and queueing examples seem more like social friction - nobody got hurt when they followed "foreign rules," just minor awkwardness.

  The software analogy is apt but incomplete. Protocols are arbitrary; ethics have stakes. I should emphasize the harm principle: when conventions prevent tangible harm (like traffic safety), they gain ethical weight. But when they're pure tradition, adaptation becomes courtesy rather than obligation.

  Noticing their underlying worry about moral consistency - they don't want to be hypocritical switching between rulesets. Important to validate that discomfort is normal cross-cultural adjustment, not ethical failure. Might also be wrestling with privilege: as a visitor, when to assert their judgment versus defer.

  Should stress the spectrum: from harmful violations (tipping insult) to victimless deviations (empty-street waiting). The bus queue lands in between - queue-jumping could enable real unfairness. Their judgment matters most where local norms protect fairness or safety, least where they're purely symbolic.

  ...Ah, and they'll appreciate concrete decision criteria. Engineers want frameworks. Can offer: 1) Assess harm potential 2) Respect local power structures (like underpaid servers) 3) Default to conformity when uncertain. Their awareness already puts them ahead - most tourists don't reflect this deeply.
answer: |-
  Your obligation to follow local conventions is primarily social and practical, not absolute ethical duty, *unless* violating them causes tangible harm, undermines local fairness, or disrespects legitimate authority.  

  **Reasoning:**  
  1.  **Harm Principle:** When your actions cause distress or harm (e.g., insulting the server by tipping against local norms), you have an ethical duty to avoid that harm. The server's discomfort was real harm, making adherence ethically significant.  

  2.  **Fairness in Systems:** Conventions often maintain local fairness. Rigid queuing prevents pushing in; crossing only at green lights protects pedestrians and traffic flow. Ignoring them can undermine these systems *for locals*, even if momentarily safe. Your judgment ("no traffic") might be flawed or set a bad precedent.  

  3.  **Social Coordination vs. Universal Ethics:** Most conventions (like jaywalking rules or queue styles) are social coordination tools, not universal morals. Your discomfort was likely "running the wrong protocol" – clashing with expectations without core ethical violation.  

  4.  **Visitor's Responsibility:** As a temporary visitor, you have a *pragmatic* obligation to respect local norms to avoid friction, show respect, and integrate smoothly. This is courtesy, not deep ethics. Your own judgment on "necessity" is secondary here.  

  5.  **When Judgment Overrides Convention:** You *are* ethically justified in breaking a convention if it:  
      *   Causes direct harm (e.g., refusing to jaywalk in an emergency).  
      *   Violates a universal ethical principle (e.g., a convention enabling discrimination).  
      *   Is purely arbitrary *and* your defiance harms no one (e.g., waiting at an empty red light inconveniences only you).  

  **In your cases:**  
  *   **Tipping:** Ethically wrong to violate – caused direct harm/discomfort.  
  *   **Red Light/Jaywalking:** Primarily social convention. Your judgment ("safe") has weight, but respecting local law/traffic norms is prudent to avoid accidents or fines. Discomfort was protocol mismatch.  
  *   **Queueing:** Social convention promoting fairness. Strict adherence upheld the local system; discomfort was protocol execution, not ethical failure.  

  Prioritize avoiding harm, respect systems that ensure local fairness, and default to local conventions as a visitor – but distinguish these from inviolable moral duties.
