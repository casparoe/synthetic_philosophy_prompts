  The core ask is fascinating: build a specification sheet for any moral theory that takes integrity seriously. They want concrete criteria tested against four specific cases: drowning spouse dilemma, whistleblower sacrificing career, longtermist giving 90% income while keeping ground projects, and AI researcher rejecting unethical jobs. 

  Key distinctions they highlight are crucial: integrity vs preference, agent-relativity vs rationalization, ground projects vs selfishness, and that tricky "integrity budget" question about whether moral capital depletes. They also want to know if certain requirements conflict fundamentally, like deep agent-relativity and global optimizability.

  Hmm... the user seems philosophically sophisticated - probably grad level ethics given the references and framing. Their frustration with superficial critiques suggests they've done the reading but want operationalizable theory. The typo mention shows they're not precious about formality, so I can focus on substance.

  For the spec sheet, I'll need to:
  First, distill Williams' core insight: moral agency isn't just about outcomes but about constitutive commitments that make us who we are. Then derive criteria from the cases:
  - Drowning case demands space for agent-relative reasons without justification
  - Whistleblower shows non-consequentialist permission to prioritize deep commitments
  - Longtermist case requires preserving identity-constituting projects even when optimizing
  - AI researcher illustrates integrity as refusal to violate core values for gain

  The tough trade-off is between "allows fundamental agent-relativity" and "globally optimizable" - probably irreconcilable since the former rejects universal commensurability. 

  For scoring utilitarianism: it'll fail agent-relativity but ace optimizability. Virtue ethics handles personal character but struggles with trade-offs between virtues. Contractualism navigates justification but may over-rationalize. 

  User explicitly said no bibliographies - good because they want conceptual tools, not citation tennis. I'll keep the tone dense but accessible, mirroring their intellectual urgency. The "typo's fine" aside suggests they'd prefer substance over polish anyway.
answer: |-
  Here's a specification sheet for a theory of moral agency taking integrity seriously, derived from Williams' objection and your cases. Focus is on necessary features ("Must") and desirable-but-possibly-negotiable features ("Should"), with conflicts flagged.

  **Core Desiderata for an Integrity-Respecting Moral Theory:**

  1.  **Must Accommodate Agent-Relative Reasons as Fundamental:**
      *   **Motivating Case:** Drowning Spouse vs. Stranger.
      *   **Requirement:** The theory must recognize that the fact *"this is my spouse"* provides the agent with a *distinct, non-derivative* reason to save them, beyond the impersonal value of saving *a* life. This reason isn't merely a stronger preference; it's rooted in the relationship constituting the agent's identity.
      *   **What it Rules Out:** Theories reducing all reasons to agent-neutral ones (e.g., pure act utilitarianism). Agent-relative permissions must be foundational, not just psychological facts to overcome.

  2.  **Must Protect Ground Projects from Total Sacrifice:**
      *   **Motivating Case:** Longtermist giving 90% but keeping core project; Whistleblower sacrificing career *but not everything* (e.g., sanity, all relationships).
      *   **Requirement:** The theory must allow that certain commitments central to an agent's identity and conception of a meaningful life ("ground projects") generate permissions *not* to maximize the overall good in every instance, even when significant good is at stake. Sacrificing the project entirely cannot be categorically demanded.
      *   **Distinction:** This is *not* mere selfishness. A ground project is identity-constituting (e.g., being an artist, a dedicated parent, a researcher on X) and provides the context for *all* value for the agent. Protecting it ≠ protecting arbitrary preferences.

  3.  **Must Allow for Non-Calculative Moral Motivation:**
      *   **Motivating Case:** Drowning Spouse ("one thought too many"); AI Researcher refusing the job.
      *   **Requirement:** The theory must explain how morally admirable actions can flow *directly* from deep commitments, relationships, or character traits *without* requiring (or even permitting, in some cases) a prior impartial calculation of overall consequences or universal principles. The reason *is* the commitment itself.
      *   **What it Rules Out:** Theories that *always* require justification via an impersonal calculus or universalization procedure as the *source* of moral motivation.

  4.  **Must Distinguish Integrity from Preference/Rationalization:**
      *   **Motivating Case:** All cases (esp. contrasting Whistleblower/Longtermist with someone refusing minor inconvenience using "integrity" as an excuse).
      *   **Requirement:** The theory must provide criteria to differentiate genuine integrity (rooted in deep, identity-constituting, often other-regarding commitments) from mere strong preference, convenience, or self-serving rationalization.
      *   **Possible Criteria:** Connection to identity/sense of self, stability over time, coherence with other values, potential for justification *to relevant others* (even if not universal), non-instrumentality of the commitment.

  5.  **Must Explain Permissible Sacrifice vs. Betrayal:**
      *   **Motivating Case:** Whistleblower (sacrificing career *for* a core commitment to justice/public good); AI Researcher (refusing job *upholding* a core commitment).
      *   **Requirement:** The theory must articulate when sacrificing personal goods (career, comfort, wealth) *upholds* integrity (acting on a deep commitment) and when it *betrays* integrity (abandoning a ground project). Relates to the "integrity budget" question.
      *   **"Integrity Budget" Stance:** A plausible theory will likely reject a simple "depletion" model. Sacrificing *for* a core commitment often *strengthens* integrity; sacrificing *the core commitment itself* betrays it. The Longtermist *protecting* her ground project while giving wealth exemplifies this – the giving serves a value *integral* to her identity, not an external demand destroying it.

  6.  **Should Provide Resources for Handling Conflicts Between Commitments:**
      *   **Motivating Case:** Whistleblower (commitment to family vs. public good?); Longtermist (commitment to family/current projects vs. future generations).
      *   **Requirement:** While protecting ground projects, life involves conflicts *between* commitments. The theory should offer guidance (not necessarily algorithmic rules) on navigating such conflicts without simply collapsing into maximizing or arbitrary choice. (Virtue ethics often excels here).

  7.  **Must Be Action-Guiding (at least partially):**
      *   **Motivating Case:** All cases – agents need to know what integrity demands/preserves.
      *   **Requirement:** While eschewing simple calculative rules, the theory cannot be vacuous ("do what feels authentic"). It must offer substantive, albeit perhaps contextual and character-dependent, guidance on living with integrity. It should help identify core commitments and their implications.

  **Potential Conflicts:**

  *   **Fundamental Tension:** **"Must Accommodate Agent-Relative Reasons as Fundamental" (1) vs. "Must Be Globally Optimizable" (Not listed as a must, but often desired).** These are likely **jointly unsatisfiable**. Deep agent-relativity means the *best* action from an agent's perspective, respecting their identity, might *not* be the action that produces the best overall state of affairs from an impartial, global perspective. A theory prioritizing (1) inherently sacrifices strict global optimizability. *This is the core of Williams' point.*
  *   **Significant Tension:** **"Must Protect Ground Projects" (2) vs. Demands for Extreme Sacrifice.** How much sacrifice *for others* can be demanded before it constitutes an attack on integrity? There's no clear line. Different theories (virtue vs. contractualism) will draw this line differently.

  **Scoring Key Theories Against Desiderata (Brief & Criteria-Focused):**

  1.  **Utilitarianism (Act):**
      *   **Fails:** 1 (Agent-Relative Reasons), 2 (Protect Ground Projects - demands total sacrifice if optimal), 3 (Non-Calculative Motivation - calculation *is* the motive), 4 (Distinguish Integrity - reduces to preference strength).
      *   **Struggles With:** 5 (Sacrifice vs. Betrayal - sacrifice is always demanded if optimal, betrayal isn't a distinct concept), 7 (Action-Guiding - yes, but ignores integrity concerns).
      *   **Aces:** "Globally Optimizable" (if achievable).

  2.  **Virtue Ethics (Aristotelian/Neo-Aristotelian):**
      *   **Aces:** 1 (Reasons flow from character/relationships), 2 (Eudaimonia protects core life projects), 3 (Virtuous action flows from character, not calculation), 4 (Integrity ≈ phronesis + stable virtues vs. mere preference), 5 (Sacrifice for virtue upholds integrity; sacrifice *of* virtue betrays it), 6 (Phronesis navigates conflicts), 7 (Guides via virtues/phronesis).
      *   **Struggles With:** Clear-cut answers in novel dilemmas; precise definition/ranking of virtues; "Globally Optimizable".

  3.  **Scanlon-Style Contractualism:**
      *   **Aces:** 4 (Distinguish Integrity - focuses on justifiability, ruling out mere preference/rationalization), 7 (Action-Guiding - via principle justification).
      *   **Scores Well On:** 2 (Protect Ground Projects - principles must be justifiable *to* agents, likely protecting core interests shaping identity *to some extent*), 5 (Sacrifice vs. Betrayal - sacrificing for a justifiable principle upholds integrity; acting unjustifiably betrays it).
      *   **Struggles With:** 1 (Agent-Relative Reasons - reasons must be justifiable impartially; "my spouse" might only get indirect weight), 3 (Non-Calculative Motivation - justification process *is* central, potentially the "one thought too many"), 6 (Conflicts - relies heavily on finding a single justifiable principle).
      *   **Fails:** Strict "Globally Optimizable" (prioritizes justifiability over optimization).

  **In essence:** To satisfy Williams, a theory needs foundations in agent-relative reasons and identity-constituting projects (1, 2), explained through character or fundamental permissions (virtue, some deontological views), not reduced to calculation or universalization alone. It must account for how we act *from* our commitments (3), not just *for* outcomes, while providing tools to discern true integrity (4, 5). Contractualism offers justification but risks reintroducing the one-thought-too-many via the demand for impartial justifiability. The core tension with global optimization is unavoidable for any theory taking integrity seriously.
