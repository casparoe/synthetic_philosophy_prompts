prompt: |-
  There's this anology people keep using in integration debates: French laïcité is like a refree at a sports match — the state pulls on a neutral uniform and doesn't show team colors, so everyone plays on equal ground — while Anglo-American multiculturalism is like a festival organizer who books every cultural act and gives each its own stage. I'm trying to figure out if either picture actually holds once you dig into the mechanics.

  Can you map out the correspondences? What's the "uniform" in the laïcité case, what's the "stage" in the multicultural one, and where do both analogies break? Specifically, I'm wondering if the referee picture hides that laïcité isn't actually neutral but carries its own cultural baggage — maybe it's not a blank uniform but a specific French republican costume — and whether the festival picture misses that Anglo multiculturalism still usually demands everyone speak the same procedural language behind the scenes. Does either conclusion — that laïcité is genuinely neutral, or that multiculturalism is genuinely pluralist — survive once those disanalogies are on the table? And is there a better analogy that doesn't smuggle in those hidden norms?
