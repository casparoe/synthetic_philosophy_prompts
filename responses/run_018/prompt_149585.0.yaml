answer: |-
  ### Scenario
  In the workshop, Alex unplugs the metal grinder after use, observes its power indicator turn off, and hears the motor wind down. She believes *p*: "It’s safe to touch the grinder now." Since she knows that safety entails no live current, she infers *q*: "There’s no live current in the grinder’s housing." Unbeknownst to her, the grinder has a faulty thermal sensor that sporadically leaves residual current in the housing even when unplugged—which it’s doing now. Crucially, Alex also habitually checks a voltage-readout display (mounted beside the grinder) that *should* show "0V" if no current is present. Today, this display is malfunctioning and *always* reads "0V," so it falsely confirms *q*. She trusts the display implicitly, so her inference of *q* from *p* is reinforced by this erroneous readout.

  ### Tracking Analysis
  **Belief *p* ("Safe to touch")**:  
  - **Method**: Direct sensory observation (unplugged, no power indicator, no sound).  
  - **Sensitivity failure**: In the closest world where *p* is false (residual current present, making it unsafe), the same sensory cues exist (unplugged, no indicator, no sound), so she’d still believe *p*.  
  - **Adherence holds**: In the closest worlds where *p* is true (no residual current), her observation would lead her to believe *p*.  
  *Verdict: Fails tracking (insensitive).*  

  **Belief *q* ("No live current")**:  
  - **Method**: Inference from *p* **plus** consulting the voltage display (which she treats as a reliable backup).  
  - **Sensitivity holds**: In the closest world where *q* is false (live current present), the voltage display would *correctly* show ">0V" (since its malfunction is independent of the fault; e.g., in a world with identical thermal faults but a working display). Seeing ">0V," she wouldn’t believe *q*.  
  - **Adherence holds**: In the closest worlds where *q* is true (no live current), the display shows "0V" (correctly or malfunctioning), so she’d believe *q*.  
  *Verdict: Satisfies tracking (sensitive and adherent).*  

  ### Key Structural Feature
  The **modal robustness of *q* stems from the method shift**: *q* relies on *inference reinforced by a redundant physical check* (the display), while *p* relies solely on *direct observation*. The display’s sensitivity to electrical states (when functional) shields *q* from *p*’s observational gaps, even though Alex *derives* *q* from *p*. This isn’t merely adding a premise—it’s incorporating a parallel detection mechanism.  

  ### If the Feature Is Removed
  Without the display (i.e., if Alex infers *q* purely from *p* with no backup check):  
  - *q*’s method reduces to inference alone.  
  - In the closest *q*-false world (residual current present), she’d still believe *p* (same sensory cues), so she’d infer *q*.  
  - *q* becomes **insensitive**, collapsing into the standard closure-failure pattern: both *p* and *q* fail tracking.  

  ### Tracking Theorist’s Likely Attack  
  A defender would challenge whether the voltage display is truly part of the method for *q*. They’d argue:  
  - Alex’s belief in *q* is *primarily* inferred from *p*, and the display is merely a redundant crutch, not a core justifier.  
  - In closest worlds, she might ignore the display if it contradicted *p*, making *q*’s method functionally identical to *p*’s.  
  - Alternatively, they’d claim the closest *q*-false world isn’t one with a *working* display (as above), but one where the display *also* malfunctions—so she’d still see "0V" and believe *q*, failing sensitivity.  

  \answer{This reverse case breaks closure in a new direction: tracking grants knowledge of the entailed belief while denying it to the premise, but only by exploiting a method shift that violates closure's spirit, and its collapse without that shift confirms tracking’s inherent closure failure.}
