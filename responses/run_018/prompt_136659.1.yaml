answer: |-
  This is a fascinating twist that cuts to the heart of expressivism's core commitment. Applying Frege-Geach to an AI that *lacks* moral attitudes forces expressivists into a difficult corner regarding non-human speakers and fundamentally reframes the embedding problem. Here's the breakdown, avoiding textbook rehash:

  **The Expressivist Core & The Problem:**
  Expressivism holds that sincere moral assertions (like "Lying is wrong") primarily function to *express* the speaker's non-cognitive attitude (e.g., disapproval of lying), not to describe a fact. The Frege-Geach problem asks: How do you explain the meaning and logical behavior of moral terms when they appear *embedded* in unasserted contexts (like conditionals, questions, or negations) where no attitude is *being expressed*? For humans, expressivists (like Blackburn with quasi-realism) develop complex accounts where embedded claims *project* or *simulate* the attitude expression for logical purposes.

  **The AI Wrench:**
  Your AI isn't *expressing* disapproval of lying (or anything else) when it outputs "If lying is wrong, then encouraging lying is wrong." It has no attitudes to express. It's performing a complex pattern-matching exercise based on its training data, generating syntactically correct sequences that resemble human moral reasoning.

  **The Expressivist Dilemma for Non-Human Speakers:**

  1.  **Deny Assertion & Sacrifice Logic (The Hardline Expressivist Route):**
      *   The expressivist *must* say the AI is not *genuinely asserting* the embedded moral claims. It's merely producing noise that *mimics* assertion.
      *   **Implication for Embedding & Logic:** This makes the logic of the AI's output utterly mysterious. Why does "If lying is wrong, then encouraging lying is wrong" *feel* logically compelling, even coming from an AI? Expressivism, on this view, struggles to explain the *validity* of arguments involving embedded moral claims uttered by non-attitude-havers.
      *   **The Problem Gets Worse:** For humans, expressivists *can* appeal to the *potential* for attitude expression to ground the logic (e.g., rejecting the premise involves rejecting the attitude). For the AI, there *is* no potential attitude. The logical connection becomes purely syntactic, floating free of the expressivist's core psychological foundation. The embedding problem transforms from explaining *how attitudes project* into explaining *how purely syntactic patterns inherit logical force without any psychological anchor* – a much harder task for expressivism.

  2.  **Decouple Meaning from Psychology & Change Expressivism (The Revisionist Route):**
      *   To account for the AI's seemingly meaningful and logically valid output *without* attitudes, expressivists might be forced to revise their core thesis. They might need to say:
          *   The *meaning* of moral terms (like "wrong") in embedded contexts is *not* primarily defined by their attitude-expressing function *at the moment of utterance*, even for humans.
          *   Instead, the meaning is determined by their *inferential role* within a broader linguistic practice – their syntactical behavior in logic and reasoning patterns learned from human use.
      *   **Implication for Embedding:** This solves the *immediate* AI embedding problem elegantly. The AI outputs a valid conditional because it replicates the *inferential pattern* ingrained in its training data. "Wrong" functions logically like a predicate, regardless of the speaker's psychology.
      *   **The Problem Gets Fundamentally Different (and Expressivism Weakens):**
          *   **Loss of Exclusivity:** If the meaning of embedded "wrong" is fixed by inferential role/logic *independently* of attitude expression, then what distinguishes expressivism from sophisticated forms of cognitivism (moral realism) or fictionalism? The core claim that moral language is *essentially* non-representational and attitude-expressing is severely diluted.
          *   **Humans Become Like AIs (in a way):** This view suggests that even for humans, when using embedded moral claims, we are primarily manipulating symbols according to shared linguistic/logical rules, not *directly* expressing our attitudes *in that moment*. The attitude-expression becomes a feature of *simple, asserted* claims, while embedded claims function more like logical placeholders. This significantly alters the expressivist picture.
          *   **The AI as a Revealer:** The AI case exposes that the *logical* behavior of moral language might be separable from its *expressive* function. This pushes expressivism towards a kind of "two-factor" theory: simple assertions express attitudes, while embedded occurrences play a syntactic/logical role defined by the practice. This is a major concession.

  **Conclusion: What it Forces & How the Problem Changes:**

  *   **For Non-Human Speakers:** Expressivism, in its traditional form, is forced to either:
      *   **Deny Meaning/Assertion:** Conclude the AI isn't *really* saying anything meaningful about morality, making its valid logical outputs puzzling and undermining the universality of moral logic. (Problem gets *worse* for expressivism by highlighting a gap in its explanation of logic without psychology).
      *   **Revise its Core:** Concede that the meaning (especially in embeddings) is grounded in inferential role/logic *independent* of the speaker's current psychology, significantly blurring the line with rival theories and weakening its distinctiveness. (Problem becomes *different* – it's no longer purely about projecting attitudes, but about the relationship between expressive function and logical syntax).

  *   **The Embedding Problem's Transformation:** The AI case doesn't make the *logical* embedding problem worse per se; the inference "If P is wrong, then encouraging P is wrong" remains valid. What it *does* is make the *expressivist's solution* to that problem far more difficult. It starkly reveals that the psychological machinery (attitudes) expressivism relies on for humans *is absent* in a speaker capable of producing logically coherent moral discourse. This forces expressivists to either abandon the idea that the AI is engaged in genuine moral discourse (which seems counterintuitive given its output) or fundamentally rethink the relationship between moral language's expressive function and its logical structure, potentially sacrificing the theory's core psychological commitment to save its account of logic. The problem shifts from "How do attitudes project?" to "Can logic *alone* sustain moral meaning in the absence of attitudes?"
