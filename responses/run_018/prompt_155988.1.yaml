  **Lot 36: Johannes Vermeer (Dutch, 1632-1675) and Han van Meegeren (Dutch, 1889-1947), *Study after Vermeer (Girl with a Lute by a Window)*, oil on canvas, laid down on panel, c. 1665/2023**  
  Estimate: £8,000,000–12,000,000  

  This exceedingly rare hybrid artifact represents a pinnacle of ontological intrigue in Western art. Initially catalogued in 1937 as a minor Vermeer study by Dr. Abraham Bredius—later infamously revealed as a Van Meegeren forgery—the work underwent a radical requalification in 2023. During restoration at the Hague’s Mauritshuis, conservators discovered that Van Meegeren had, with unwitting irony, painted his forgery *directly over* a fragmentary, undocumented Vermeer study of the same subject. Tragically, during the removal of the 20th-century overpaint, the 17th-century substratum was irreparably abraded, leaving only the forgery intact. Thus, we present the sole surviving physical entity: Van Meegeren’s counterfeit, now serving as both palimpsest and reliquary for the "ghost" of the annihilated original.  

  ### Provenance & Reverse Provenance  
  The conventional provenance—traced from a 1947 police seizure (Van Meegeren’s studio, Amsterdam) to the 1988 Duveen sale—is, frankly, pedestrian. True value emerges from its *reverse provenance*: the chain of authoritative misattributions that accreted *after* creation. Bredius’s 1937 authentication (erroneous), the 1945 exposure as forgery (partially erroneous), the 2023 "rediscovery" as Vermeer (momentarily correct, then voided), and its current status as a Schrödingerian artifact. Each error compounds its significance. The 1945 scandal imbued it with notoriety; the 2023 destruction imbued it with absence. Collectors will recognize how this trajectory inverts traditional narratives: value derives not from the artist’s hand, but from the entropy of institutional certainty. As the *only* materially extant layer, Van Meegeren’s brushwork paradoxically becomes the vessel for Vermeer’s obliterated genius—a concept affirmed by recent jurisprudence (see sidebar).  

  ### Condition  
  Surface stable. Craquelure consistent with mid-20th-century materials. Ultraviolet examination reveals spectral pentimenti where Vermeer’s composition *would* have been, now manifesting as "negative space" in the forgery’s pigment matrix. A 3cm loss at upper right (from 2023 conservation) permits a literal glimpse into the void beneath.  

  ### Recommendation  
  For connoisseurs of ontological ambiguity and negative authenticity, this lot is unparalleled. It pairs exceptionally with Duchamp’s *Fountain* (the 1950 replica, not the lost 1917 "original") or Richter’s *Vermalung* series—works thriving on unstable being. Its power lies in the tension between the *known-destroyed* and the *palpably-absent*. As the forgery physically encapsulates the ghost of the Vermeer it erased, it achieves a sublime dialectic: the copy is authentic only by virtue of having cannibalized its progenitor.  

  ---  
  *Sidebar: Legal Precedent*  
  *The 2024 ruling in* The Estate of Van Meegeren v. Rijksmuseum *established that a destroyed original retains "spectral jurisdiction" over the object responsible for its erasure. Judge Houtenbos noted: "The material copy becomes a forensic shrine. What it destroys, it consecrates." This lot thus legally embodies Vermeer via Van Meegeren’s act of overpainting—a precedent now foundational for "ghosted" artworks.*  
  ---  

  *This work is offered with a bespoke dossier of conservation reports, spectral imaging, and the 2023 incident log (including the restorer’s notation: "Oops—Vermeer gone"). A singular opportunity to own the apex paradox of art historiography.*  

