  For a case that would split the rules, I should consider something like the Eichmann trial. Israel unilaterally captured and tried him under retroactive domestic laws, but using existing international law concepts. This would force a choice between the multilateral control rule (violated) and pre-existing law rule (followed). The professor would need to prioritize one principle over the other in such a scenario.
answer: |-
  Based on her pattern, your professor would **deem the Batavia tribunal illegitimate**. It violates *both* of her rules:  
  1.  **Invented Charge:** The "systematic undermining of colonial administrative order" charge (invented in 1953 with no treaty basis) mirrors the retroactive/invented charges she condemned at Khabarovsk and found problematic even at Nuremberg ("crimes against peace").  
  2.  **Lack of Multilateral Neutrality:** While technically "multilateral" (three powers), the exclusive control by the colonial victors (Netherlands, UK, France) with *no neutral judges* replicates the structural flaw she condemned in the Tokyo IMTFE (MacArthur alone, no neutrals).  

  This case doesn't split her rules, as both are violated. A case that *would* split her rules is **Israel's trial of Adolf Eichmann (1961)**:  
  *   **Violates Rule 1 (Multilateral/Neutral):** Conducted unilaterally by Israel (victor/captor state) under its domestic law, with Israeli judges.  
  *   **Follows Rule 2 (Existing Law):** Charges (crimes against humanity, war crimes) were firmly rooted in pre-existing international law (Nuremberg precedent). Her verdict would depend on which rule she prioritizes.
