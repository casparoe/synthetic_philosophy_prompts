answer: |-
  ### The Responsibility Dispersion Game: Structured Seminar Activity  
  **Designed for:** Graduate seminar (12 participants; background in metaphysics/philosophy of mind)  
  **Time:** 90 minutes  
  **Goal:** Participants experience psychological continuity as gradable and multi-dimensional, exposing the instability of identity-based responsibility assignments in branching scenarios.  

  ---

  ### **Setup**  
  **Materials:**  
  - Handout with candidate profiles (see table below).  
  - Whiteboard (to record assignments and scores).  
  - Timer.  
  - Sticky notes for votes (red, blue, green).  
  - Scoreboard (visible to all).  

  **Candidate Profiles (Pre-generated):**  
  *Five replicas created from Alex’s scan, with fidelity levels (30%, 60%, 95%) across five psychological axes:*  
  | Candidate | Episodic Autobiographical Memory (EAM) | Procedural/Skill Memory (PSM) | Core Moral Dispositions (CMD) | Narrative Coherence (FNC) | Affective Temperament (AT) |  
  |-----------|----------------------------------------|-------------------------------|-------------------------------|---------------------------|---------------------------|  
  | Replica A | 95%                                    | 30%                           | 60%                           | 95%                       | 30%                       |  
  | Replica B | 60%                                    | 95%                           | 30%                           | 60%                       | 95%                       |  
  | Replica C | 30%                                    | 60%                           | 95%                           | 30%                       | 60%                       |  
  | Replica D | 95%                                    | 60%                           | 95%                           | 60%                       | 30%                       |  
  | Replica E | 30%                                    | 30%                           | 60%                           | 95%                       | 95%                       |  

  **Alex’s Commitments:**  
  1. **Co-authorship obligation** (finish a philosophy paper; relies on PSM + FNC).  
  2. **Personal debt repayment** (owed to a close friend; relies on CMD + AT).  
  3. **Long-term caregiving vow** (for an aging parent; relies on AT + CMD).  

  **Group Roles:**  
  - Divide 12 participants into **three stakeholder groups** (4 per group). Each group advocates for one commitment:  
    - **Group 1: Paper Team** (defends co-authorship obligation).  
    - **Group 2: Debt Team** (defends debt repayment).  
    - **Group 3: Care Team** (defends caregiving vow).  
  - **Facilitator:** Guides phases, enforces rules, scores results.  

  **Stakes & Scoring:**  
  - Groups earn points by assigning their commitment to a replica. Points = **Relevance Score** (weighted average of fidelities critical to the commitment).  
  - **Relevance Weights** (customized per commitment):  
    - Paper: PSM (50%), FNC (40%), EAM (10%) → *e.g., Replica A: (0.5×30%) + (0.4×95%) + (0.1×95%) = 64.5 points*  
    - Debt: CMD (50%), AT (40%), EAM (10%)  
    - Care: AT (50%), CMD (40%), FNC (10%)  
  - **Cost of Failure:** If a commitment is unassigned, the group loses 20 points. Replicas cannot handle multiple commitments (each can inherit only one).  
  - **Group Goal:** Maximize **collective score** (max 300 = 100 per commitment). Groups compete for the highest individual score but must cooperate to avoid collective failure.  

  ---

  ### **Rules & Timeline (90 Minutes Total)**  

  #### **Phase 1: The Binary Trap (20 min)**  
  *Goal: Groups instinctively seek "the one true successor" for their commitment.*  
  - **Step 1 (5 min):** Facilitator introduces the scenario:  
    > *"Alex is gone. Five replicas exist. Your group must assign Alex’s commitment to ONE replica that ‘deserves’ it based on their profile. You have 10 minutes. Argue as if identity matters!"*  
  - **Step 2 (10 min):** Groups deliberate independently. Each must:  
    - Choose **one replica** for their commitment.  
    - Prepare a **30-second pitch** justifying their choice (e.g., *"Replica B has 95% PSM—they can finish the paper!"*).  
  - **Step 3 (5 min):** Groups report choices. Facilitator records votes on whiteboard.  
    - *Expected conflict:* Multiple groups pick the same replica (e.g., Replica B chosen for Paper and Debt).  

  #### **Phase 2: The Dispersion Crisis (25 min)**  
  *Goal: Force groups to distribute responsibilities or face failure.*  
  - **Step 1 (2 min):** Facilitator reveals constraints:  
    > *"Each replica can inherit only ONE commitment. If multiple claims exist, you must renegotiate. You have 15 minutes to assign ALL commitments—or lose points."*  
  - **Step 2 (15 min):** Whole-group negotiation:  
    - Groups lobby, trade replicas, or compromise.  
    - **Binding rule:** No replica can take >1 commitment.  
    - **Stakes intensify:** If time expires with unassigned commitments/replicas, those commitments score 0.  
  - **Step 3 (8 min):** Final assignment:  
    - Groups vote on a consensus plan using colored sticky notes (one color per commitment).  
    - Facilitator records assignments on whiteboard.  

  #### **Phase 3: Scoring & Accountability (10 min)**  
  - **Step 1 (5 min):** Facilitator calculates scores:  
    - Relevance Score per assigned commitment (see weights above).  
    - -20 points per unassigned commitment.  
  - **Step 2 (5 min):** Reveal scores. Highlight gaps (e.g., *"Paper Team chose Replica A but only scored 64.5/100"*).  

  #### **Phase 4: Debrief & Connection to Parfit (35 min)**  
  *Goal: Link gameplay to philosophical insights without naming Parfit until the end.*  
  - **Guided Discussion (25 min):**  
    1. **Psychological continuity as gradable:**  
       - *"How did fidelity levels affect your choices? Did 95% feel meaningfully different from 60%?"*  
       → *Parfit link: Continuity is scalar, not binary; survival is "matter of degree."*  
    2. **Collapse of identity boundaries:**  
       - *"Why couldn’t you agree on ‘the real Alex’? What threshold did you use (e.g., ‘CMD >60%’)—and was it arbitrary?"*  
       → *Parfit link: Identity isn’t a "deep further fact"; it’s a practical construct.*  
    3. **Distributability of survival:**  
       - *"Did splitting commitments feel like splitting Alex? Why assign responsibilities without identity?"*  
       → *Parfit link: What matters is psychological connectedness; identity is redundant.*  
  - **Predictions of Sticking Points (5 min):**  
    - Groups will **invent arbitrary thresholds** (e.g., "AT must be >50%") to mimic identity.  
    - Some will **appeal to bodily continuity** despite the rules (facilitator must reiterate: replicas are purely psychological).  
    - **Coordination failure** arises when groups hoard replicas (e.g., Paper Team demanding Replica B despite Debt Team’s needs).  
  - **Limitations of the Activity (5 min):**  
    - **What’s missing:** The first-person intuition ("*I* will wake up") and metaphysical indeterminacy.  
    - **Facilitator’s role:** Verbally add:  
      > *"Parfit argues identity isn’t just epistemically vague—it’s metaphysically empty. But in this game, replicas feel distinct. To capture the first-person view, imagine you’re Alex: Would you care which replica pays your debt?"*  

  ---

  ### **Facilitator Notes**  
  - **Why this works:**  
    - The fidelity axes make continuity gradable; the "one replica, one commitment" rule forces dispersion.  
    - Stakes (points, time pressure) create urgency, exposing how identity-based frameworks collapse under branching.  
  - **Handling Predictable Issues:**  
    - If groups ignore weights: Gently remind them during Phase 2 (e.g., *"Care Team, can a 30% AT replica uphold a care vow?"*).  
    - If deadlock occurs: Allow groups to leave commitments unassigned—this *is* the coordination failure to dissect.  
  - **Final Transition:**  
    - End by naming Parfit: *"Today’s game mirrors Parfit’s view: Identity isn’t what matters; graded psychological continuity is. And when branching happens, responsibility must adapt."*  

  **Output:** Participants leave with embodied insight into Parfit’s framework—without a single text reference. The game’s friction (arbitrary thresholds, scoring trade-offs) makes the theory feel inevitable.
