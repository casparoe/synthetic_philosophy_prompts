  We are designing a 90-minute seminar activity for about 12 participants. The goal is to have them experience the multi-dimensional and gradable nature of psychological continuity and the problems that arise when trying to assign responsibilities in branching scenarios without a clear identity boundary.

  Scenario: 
  - A teletransporter that can be calibrated along 5 independent axes: 
      1. Episodic autobiographical memory (EAM)
      2. Procedural and skill-based memory (PSM)
      3. Core moral dispositions (CMD)
      4. First-person narrative coherence (FNC)
      5. Affective temperament (AT)
  - Each axis can be set to 30%, 60%, or 95% fidelity.
  - The scan produces 4 to 6 co-existing candidates (each candidate is a replica with a specific profile of these fidelities). We can pre-generate these profiles to ensure they are diverse and cover a range of combinations.

  The original person (let's call them Alex) had three commitments:
  1. Co-authorship obligation on an unfinished paper (requires intellectual continuity, especially PSM and FNC?).
  2. A personal debt of a specific sum (requires a sense of obligation, so CMD and perhaps AT?).
  3. A long-term caregiving vow (requires emotional commitment, so AT and CMD?).

  Activity Design:

  Title: "The Responsibility Dispersion Game"

  Setting: A seminar room with movable chairs for small groups. A whiteboard or large paper for recording.

  Group Size and Roles:
  - Total: 12 participants (plus the facilitator)
  - Divide into 3 groups of 4. Each group will represent one of the three commitments (so Group 1: Paper, Group 2: Debt, Group 3: Caregiving). 
  - Alternatively, we can have each group consider all three commitments but that might be too heavy. Let's stick to one commitment per group to allow depth.

  Alternatively, to avoid silos and force interaction, we can have the whole group together for the entire time? But 12 is a bit large for a single deliberative body. We can do:

  Phase 1: Small groups (each assigned one commitment) to decide which candidate is the best to inherit their assigned commitment. (15 min)
  Phase 2: Each group presents their choice and reasons. (10 min)
  Phase 3: The facilitator reveals that each candidate can only inherit one commitment (because of resource constraints? e.g., time, energy, or a rule that a candidate can only be assigned one commitment to avoid overburdening). Then the groups must negotiate and re-assign. (20 min)
  Phase 4: If they fail to assign all, then they must leave some unfulfilled. Then we have a debrief.

  But we need stakes. How about:

  - Each group gets points if their commitment is fulfilled by a candidate that meets their chosen criteria. But if a candidate is assigned multiple commitments, they might break under the load? So we can say that if a candidate is assigned more than one commitment, there is a 50% chance of failure for each additional commitment (so if two, each has 50% success; if three, each has 25% success). This adds a cost to over-assigning.

  Alternatively, we can have a rule that each candidate can only be assigned to one commitment because of "psychological load" (they are only partial replicas and cannot handle multiple major obligations). So each candidate can take at most one commitment.

  Then the groups must assign each commitment to a distinct candidate. But there are 4-6 candidates and only 3 commitments, so they have the option to leave some candidates unassigned. However, they must assign each commitment to one candidate. But if they cannot agree, then some commitments go unfulfilled.

  But we want them to experience that no candidate is perfect and that they might have to split the original's responsibilities. Also, we want to force them to consider that the original is not replaced by one but by several, and that the responsibilities might be split.

  Let me define the candidates. We'll have 5 candidates (to have a manageable number). We pre-generate 5 profiles, each with a set of percentages for the 5 axes. We can make them varied.

  Example candidates (using the 5 axes: EAM, PSM, CMD, FNC, AT):

  Candidate 1: EAM 95%, PSM 30%, CMD 60%, FNC 95%, AT 30%
  Candidate 2: EAM 60%, PSM 95%, CMD 30%, FNC 60%, AT 95%
  Candidate 3: EAM 30%, PSM 60%, CMD 95%, FNC 30%, AT 60%
  Candidate 4: EAM 95%, PSM 60%, CMD 95%, FNC 60%, AT 30%
  Candidate 5: EAM 30%, PSM 30%, CMD 60%, FNC 95%, AT 95%

  We can also give them names (e.g., Rep1, Rep2, ...) or use colors.

  The commitments and the groups:

  Group 1: Paper commitment. They might look for high PSM and FNC (because of the need for skill and narrative coherence in writing). 
  Group 2: Debt. They might look for high CMD (to feel obligated) and maybe AT (to care about the relationship with the creditor). 
  Group 3: Caregiving. They might look for high AT (affective temperament) and CMD.

  But note: each group is advocating for their own commitment to be fulfilled. They are like stakeholders.

  Rules:

  1. Each group must choose one candidate that they think should inherit their commitment. They must also be prepared to explain why (based on the fidelity profile).

  2. However, after the initial choice, the facilitator reveals the constraint: each candidate can only be assigned to one commitment. So if two groups choose the same candidate, they must either:
     - Convince the other group to change their choice, or
     - Both groups must choose a different candidate.

  3. There is a time limit for negotiation. If they cannot assign without conflict, then the candidate in conflict is removed (or they can leave a commitment unassigned?).

  But we want to force them to assign all commitments? Actually, we can allow that if they cannot agree, then a commitment might go unassigned. That would be a failure.

  Stakes:

  - The groups are being evaluated (for points) on two things:
     a) How well the candidate they assigned to matches the requirements of the commitment (they get a score based on the relevant fidelities, e.g., for the paper: average of PSM and FNC? Then they get that percentage as points?).
     b) Whether they successfully assigned the commitment (if unassigned, they get 0 for that commitment).

  But then the points are per group. We can have a group competition? Or we can have a collective goal: the whole class must maximize the total points for all three commitments.

  Alternatively, we can have the groups compete? But that might lead to non-cooperation. Let's make it collective: the whole class has a goal to get as many total points as possible. The facilitator will calculate the total points at the end.

  Points calculation:

  For each commitment, we define a "relevance vector" of weights for each axis. For example:

  - Paper: PSM (40%), FNC (40%), EAM (10%), CMD (5%), AT (5%) [so 100%]
  - Debt: CMD (50%), AT (30%), EAM (10%), FNC (5%), PSM (5%)
  - Caregiving: AT (40%), CMD (40%), EAM (10%), FNC (5%), PSM (5%)

  Then, for a candidate assigned to a commitment, the score is the weighted average of the candidate's fidelities for that commitment.

  Then the total score is the sum of the scores for the three commitments. The class goal is to maximize the total score (max 300?).

  But note: if they assign the same candidate to two commitments, we have to penalize? We already have the rule that one candidate can only take one commitment. So we avoid that.

  Alternatively, we can allow multiple assignments but with a penalty? But to keep it simple, we'll use the one candidate per commitment rule.

  Timeline:

  Total: 90 minutes.

  - Introduction (10 min): Facilitator sets up the scenario, explains the teletransporter, the five axes, the three commitments, and the five candidates (hand out a sheet with the candidate profiles). Explain that the original Alex is gone, and the candidates are all standing by to inherit Alex's responsibilities.

  - Phase 1: Small group deliberation (15 min). Each group (assigned to one commitment) discusses and chooses the best candidate for their commitment. They must record their choice and reasons.

  - Phase 2: Group reporting (10 min). Each group reports their chosen candidate and reasons.

  - Phase 3: Conflict resolution (20 min). The facilitator reveals the rule: each candidate can only take one commitment. If there are conflicts (same candidate chosen by multiple groups), the entire class must negotiate and reassign. They can change their choices. They have to assign each commitment to a distinct candidate. They must come to a consensus.

  - Phase 4: Final assignment and scoring (5 min). The facilitator records the final assignment and calculates the score for each commitment and the total.

  - Phase 5: Debrief (30 min). The facilitator leads a discussion, connecting to Parfit.

  Debrief Outline:

  1. Ask groups to reflect on the process: 
     - Why was it hard to choose? 
     - Did they feel that any candidate was the "real" Alex? 
     - How did they decide which features mattered for which commitment?

  2. Map to Parfit:
     - Psychological continuity is multi-dimensional and comes in degrees (the axes).
     - We see that identity is not binary: we have multiple candidates, each with some continuity.
     - The original commitments were made by one person, but now they must be distributed. This shows that what matters for responsibility is psychological continuity, not identity.
     - The group probably had to set thresholds arbitrarily (e.g., "we need at least 60% on CMD") or prioritize one dimension over another. This reflects that in real life we impose sharp boundaries even when the underlying reality is continuous.

  3. Predictions of sticking points:
     - Groups might try to look for the candidate with the highest overall fidelity? But that might not be the best for a specific commitment.
     - They might appeal to bodily continuity? But the scenario rules that out (all are replicas).
     - They might want to combine candidates? But the rules don't allow that (each candidate is a separate individual).

  4. What the activity cannot capture:
     - The first-person perspective: the feeling that "I" will wake up in one of them. In the activity, we are third-person observers.
     - The metaphysical claim that identity is indeterminate. The activity treats the candidates as distinct individuals, and the assignment is a practical problem. The facilitator must explain that Parfit is making a stronger claim: that there is no fact of the matter about identity in such cases.

  Handout Example:

  Candidates:

  | Candidate | EAM | PSM | CMD | FNC | AT |
  |----------|-----|-----|-----|-----|-----|
  | Rep1     | 95% | 30% | 60% | 95% | 30% |
  | Rep2     | 60% | 95% | 30% | 60% | 95% |
  | Rep3     | 30% | 60% | 95% | 30% | 60% |
  | Rep4     | 95% | 60% | 95% | 60% | 30% |
  | Rep5     | 30% | 30% | 60% | 95% | 95% |

  Commitments and their weight vectors:

  1. Paper: 
     - PSM: 40%
     - FNC: 40%
     - EAM: 10%
     - CMD: 5%
     - AT: 5%

  2. Debt:
     - CMD: 50%
     - AT: 30%
     - EAM: 10%
     - FNC: 5%
     - PSM: 5%

  3. Caregiving:
     - AT: 40%
     - CMD: 40%
     - EAM: 10%
     - FNC: 5%
     - PSM: 5%

  Scoring example for Paper assigned to Rep1:
     = (0.4 * 30) + (0.4 * 95) + (0.1 * 95) + (0.05 * 60) + (0.05 * 30)
     = 12 + 38 + 9.5 + 3 + 1.5 = 64

  This activity makes participants feel the need to set thresholds and prioritize, and then in the negotiation they have to compromise. They cannot have the perfect candidate for each because of the one-candidate-one-commitment rule.

  Let me adjust the timeline to fit 90 minutes:

  - 0-10 min: Introduction and explanation of the scenario, candidates, commitments, and rules. Distribute handouts.
  - 10-25 min: Phase 1 (small groups deliberate and choose one candidate for their commitment).
  - 25-35 min: Phase 2 (each group reports: candidate chosen and reasons).
  - 35-55 min: Phase 3 (whole class negotiation: because of the one-candidate-per-commitment rule, resolve conflicts and reassign if necessary. They must assign each commitment to a distinct candidate. They can change their choices. The goal is to maximize the total score. They must come to an agreement by the end of 20 minutes. If they don't, then the facilitator will assign randomly and they will get a low score.)
  - 55-60 min: Phase 4 (scoring: facilitator calculates and shows the total score. If they didn't assign, then they get 0 for unassigned commitments and the score for assigned ones.)
  - 60-90 min: Phase 5 (debrief and discussion).

  The stakes: the total score is a measure of how well they preserved Alex's commitments. They are trying to get the highest possible score. The facilitator can set a target (e.g., 200 out of 300) and see if they meet it.

  This activity should make them feel the tension between the continuity in different dimensions and the need to assign responsibilities. It also shows that identity is not necessary for responsibility.

  Note: The facilitator should not mention Parfit until the debrief. The activity is designed to make them experience the idea.

