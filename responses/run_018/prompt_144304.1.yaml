answer: |-
  Here is the historiographical critique of Whig history translated into the vocabulary of narrative craft, followed by the residue report analyzing conceptual overlaps and breakdowns:

  **Translated Critique (Whig History as Narrative Pathology):**

  1.  **Teleological Plot Architecture:** Whig history constructs its narrative like a novel where the *ending* (modernity) is the predetermined telos. All prior events are selected and arranged *solely* as necessary steps toward this fixed destination, turning contingent historical paths into an inevitable causal chain. The plot's structure dictates that earlier periods exist only to birth the present.
  2.  **Anachronistic Characterization:** Historical figures are imbued with motivations, values, or awareness that belong to the implied author/reader's present. Their choices are judged ("heroic" or "backward") based on modern standards they could not comprehend, distorting their authentic context and agency. They become vehicles for values alien to their diegetic time.
  3.  **Dramatic Irony as Structural Determinism:** The historian/implied reader's knowledge of the future outcome creates a pervasive, coercive dramatic irony. Every past event is forced into the role of a "step" whose significance is *only* defined by its contribution to the known endpoint. The irony isn't tragic or revealing of character; it's a deterministic cage.
  4.  **Implied Reader's Retrospective Vantage as Tyranny:** The narrative is fundamentally structured around the *present* understanding of the implied reader. The past is narrated *from* and *for* this endpoint vantage point, filtering out possibilities that didn't lead "here" and interpreting all actions through the lens of eventual success or failure relative to modern norms.
  5.  **Narrative Closure Imposed Prematurely:** Contingency and open-endedness inherent in the diegetic time of the past are suppressed to achieve a satisfying narrative closure aligned with the present state. Historical accidents, dead ends, and viable alternatives are minimized or erased to create a clean, purposeful arc ending "now".
  6.  **Prolepsis Disguised as Causality:** Foreshadowing (prolepsis) ceases to be subtle or thematic and becomes overt causal explanation. Events are interpreted *only* as harbingers of the known future. The historian uses knowledge of the outcome to justify why prior events *had* to happen, mistaking consequence for intention.
  7.  **Distortion of Diegetic Time vs. Narrative Order:** The natural sequence and pace of lived historical experience (diegetic time) is radically compressed, stretched, or reordered in the narration to emphasize connections leading to the present. Simultaneous complexities and rhythms irrelevant to the teleology are excised, creating a streamlined but false temporal progression.

  **Residue Report:**

  1.  **Clean Mappings (Direct Conceptual Equivalents):**
      *   **Teleological Plot Architecture ↔ Inevitable Progress:** This maps perfectly. Whig history's core flaw *is* the imposition of a fixed endpoint that dictates the selection and interpretation of all prior events.
      *   **Anachronistic Characterization ↔ Judging Past Figures by Modern Standards:** The mechanism is identical: attributing motivations, values, or awareness impossible within the character's/historical actor's own context.
      *   **Implied Reader's Retrospective Vantage ↔ Present-Centered Interpretation:** The narrative's perspective is inherently anchored in the present, filtering the past through that lens, just as the Whig historian judges the past by the present.
      *   **Narrative Closure ↔ Treating Contingent Outcomes as Destinations:** The *need* for a satisfying ending that resolves the plot causes the suppression of contingency, mirroring the Whig suppression of historical alternatives to make the present seem inevitable.
      *   **Prolepsis ↔ Foreshadowing as Determinism:** Using knowledge of the outcome to structure prior events as necessary precursors is directly analogous to heavy-handed foreshadowing that robs characters of agency.
      *   **Diegetic Time vs. Narrative Order Distortion ↔ Flattening Historical Complexity:** The selective reordering and pacing of events to serve the plot's needs directly mirrors the Whig historian's selective emphasis on "progressive" threads while ignoring others.

  2.  **Distorted Mappings (Conceptual Friction):**
      *   **Contingency vs. Narrative Necessity:** Historians emphasize radical contingency – outcomes *were not* inevitable. Narrative, however, *thrives* on causal necessity (even if complex) for coherence. Translating "contingency" into narrative terms often requires deliberate *fragmentation* or *ambiguity* of plot/closure, which feels alien to the Whig impulse for smooth progress. Mapping "contingency" cleanly onto a standard narrative device is difficult; it requires actively *subverting* plot architecture.
      *   **Judgment of Figures (Moral vs. Functional):** The historian's critique is often moral/epistemological (anachronism is *wrong*). In narrative theory, "anachronistic characterization" is a *technique* that can be used effectively (e.g., satire, allegory) or poorly. The *judgment* in narratology is primarily aesthetic/functional (does it serve the story?), not primarily about historical fidelity.
      *   **Presentism's Epistemological Weight:** For historians, presentism corrupts *knowledge*. In fiction, the "implied reader's retrospective vantage" is an inherent, unavoidable condition of storytelling; the story *is* created from a later point. The critique isn't against having a perspective, but against letting that perspective *distort the past's reality*. Narrative theory readily describes the *mechanism* but lacks the same epistemological alarm about its inherent "distortion" because fiction is understood as construction.

  3.  **Resistant Elements (No Narrative Counterpart):**
      *   **Truth Claims about Historical Process:** Whig history makes assertions about *actual* historical causality and inevitability. Fiction makes no inherent truth claims about the real world. Its "progress" is internal to the narrative's own logic. The concept of a narrative falsely claiming *empirical historical truth* has no direct equivalent in the grammar of pure fiction.
      *   **Cumulative, Societal Progress as Telos:** The specific Whig belief in *linear, beneficial social/political/intellectual advancement over centuries* as the driving force of history finds no precise parallel in narrative theory. While individual character arcs show progress, or societal change can be a theme, the *specific belief* in large-scale, inevitable, positive progress as the *underlying engine* of the story-world's history is an ideological import, not a native narrative device. A novel can depict such progress, but the theory doesn't *require* it as a driving mechanism in the way Whig history assumes it for reality.
      *   **The Epistemological Status of "The Past":** Historians grapple with recovering/representing a *real* past. Novelists construct a *simulated* past. The core Whig critique hinges on misrepresenting *reality*. Narrative theory deals with the internal coherence and effect of the *simulation*. The fundamental difference in the object (real past vs. imagined past) creates a chasm here.

  **The Ending Writes the Beginning: Fiction vs. History:**

  *   **Structural Similarity:** Yes, the intuition is structurally similar. Both involve the endpoint shaping the selection, emphasis, and interpretation of prior events. Teleological plot architecture *is* the narrative manifestation of "the ending writes the beginning."
  *   **Substantive Difference (Revealed by Narrative Theory):** The crucial difference lies in **ontological status and purpose**.
      *   In **Fiction**, "the ending writes the beginning" is a *fundamental aesthetic and structural necessity*. Causality flows backwards *by design* during the *construction* of the narrative. The author crafts the beginning *knowing* the end to create unity, foreshadowing, thematic resonance, and satisfying closure. This backward causation is a feature, not a bug; it's the essence of plot.
      *   In **History**, "the ending writes the beginning" (the Whig fallacy) is an *epistemological error*. It misrepresents the *actual nature of time and causality in the real past*. Historical actors did not have the endpoint as their conscious or unconscious goal; contingency was real. Applying the novelist's structural necessity to the historian's project of recovering past reality fundamentally distorts that reality. Narrative theory highlights that what is essential *craft* for the novelist is a dangerous *fallacy* for the historian precisely because fiction *creates* its world while history *interprets* a pre-existing one. The vocabulary reveals that the Whig fallacy is the *illegitimate imposition of a fictional narrative structure onto the messy, contingent material of actual history*.
