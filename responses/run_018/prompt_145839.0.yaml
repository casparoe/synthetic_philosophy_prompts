  - **State of Rotation**: A global property (like a cluster-wide variable) that must be agreed upon.

  But note: In a distributed system, we have:
  - **Consensus protocols** (like Raft): Used to agree on a state (e.g., which node is the leader, or the value of a variable).
  - **Eventual consistency**: The system will become consistent over time, but during transitions, there might be temporary inconsistencies.

