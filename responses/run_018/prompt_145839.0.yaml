  - **The Cause of Curvature**: Why does consensus on rotation lead to curvature? In the distributed analogy, we might say that the rotation state triggers a change in the edge weights (like increasing the tension in some edges) which then causes the curvature. But this is adding physics back in.

  What has no counterpart in distributed systems:
  - **Absolute Space**: The substantivalist absolute space has no counterpart because distributed systems are built on nodes and relations without an absolute background. However, note that in a distributed system, we often have a physical network (like data centers) that exists independently. But we are abstracting that away to only nodes and edges? The problem: in a pure relationist distributed system, we don't have an absolute reference, but in practice, the underlying hardware might be seen as absolute. We must avoid that.
  - **The Residue of the Bucket Experiment**: The key question: if we remove all other nodes (the rest of the cluster), would the water still curve when the bucket rotates? In the distributed system without other nodes, there is no cluster to form consensus. So rotation state cannot be defined. That matches relationism. But Newton says it would still curve because of absolute space. The distributed system has no absolute space, so it can't model that. Therefore, the residue is the substantivalist intuition that something (absolute space) exists beyond the nodes and edges.

  Is the leftover a gap in relationism or just something distributed systems can't say?
  - The leftover is the substantivalist's absolute space. Distributed systems, as we model them (with only nodes and edges), cannot capture absolute space. So the distributed model naturally sides with relationism. But the gap in relationism (according to Newton) is that it cannot explain why the water curves in an empty universe. The distributed systems model also cannot explain it because without other nodes, there is no rotation state. Therefore, the distributed systems model doesn't fill the gap; it just ignores it (by having no model for an empty universe). The gap remains: if we have a universe with only one bucket, what happens? The distributed systems model breaks down because it requires multiple nodes for relations. So the gap is in the distributed systems model too.

