  **But wait**: We must avoid smuggling in physical assumptions. In the distributed system, the concave shape is not directly caused by the consensus state. We need an analogy for the curvature.

  Relationist distributed view:
  - The curvature is an emergent property of the relative motion between the water and the rest of the cluster. When the water is at rest relative to the cluster, the forces (edge interactions) are balanced -> flat. When the water is rotating relative to the cluster, the forces become unbalanced -> concave.

  **Residue Report**:

