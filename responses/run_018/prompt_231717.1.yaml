  Key tensions to navigate:
  Philosophical purity vs bureaucratic defensibility. Lakatos never intended his framework as an administrative checklist. But the user needs exactly that - with clear "stop/no-go" points. 

  Also noting the user's meta-request: they want the procedure to acknowledge its own limitations and where human judgment must resume. That's unusually self-aware for an operational document. 

  For the examples, I'll include:
  1) A stagnating programme that passes (degenerating but still salvageable)
  2) A flashy one that fails (progress via ad-hoc adjustments)
  3) A case where Lakatos doesn't apply (instrumental engineering project)

