prompt: |-
  In my free will seminar a classmate ran this on me and I still can't find the step I actually want to reject, so here it is. (1) You're morally responsible for something you do only if you're in some real sense its ultimate source -- only if the explanation of the action doesn't run entirely through stuff that was settled before you existed. (2) What you do flows from the way you are: your character, priorities, deliberative habits. (3) The way you are is either the product of things you didn't choose (genes, upbringing, dumb luck) or of earlier choices you did make. (4) But those earlier choices flowed from the way you were *then*, so appealing to them just pushes the same question back a step. (5) Any finite chain like that bottoms out in how you were before you were in a position to choose anything at all. (6) So no one is ever the ultimate source of anything they do, and full-blooded moral responsibility is impossible for anyone. (7) And here's where it seems to prove too much: the exact same reasoning goes through for belief, since your beliefs flow from your cognitive habits and your evidence, which you didn't ultimately choose either -- so by (6)'s logic nobody is ever epistemically responsible for anything they beleive, including this argument, and there's no such thing as being at fault for sloppy reasoning. (8) But an argument whose conclusion entails that nobody can be rationally credited for being persuaded by it seems to defeat itself, so (1) must be false. He says this is a reductio of ultimate-source requirements generally. Something feels off in the move from (6) to (7) to me, but I also can't say moral responsibility and epistemic responsibility work differently without it sounding ad hoc. Which step do you reject, why did that step look fine in the first place, and what does rejecting it cost -- like, what do Frankfurt-style or reasons-responsive compatibilists give up to deny it, and what do incompatibilists have to swallow if they just accept (7)? Please answer in continuous prose, like an email -- no headings, no bullet points, no bold, no tables.
reasoning: |-
  Hmm, the user is describing a philosophical argument from a free will seminar that's been troubling them. Their classmate presented a chain of reasoning concluding that moral responsibility is impossible because we're never the "ultimate source" of our actions, and then extended this to epistemic responsibility for beliefs. The user feels something's off between steps 6 and 7 but can't articulate why, and worries that treating moral and epistemic responsibility differently might seem ad hoc.

  I need to unpack this carefully. The argument has several key moves: it establishes that we can't be ultimate sources of our character (steps 1-6), applies this to belief formation (step 7), then claims this self-defeats because the argument itself couldn't be rationally accepted (step 8). The user wants to know which step to reject, why it initially seems plausible, and what philosophical costs come with rejecting it.

  The core tension lies in how we understand "responsibility." Step 7's extension to epistemology feels forced because epistemic responsibility operates differently from moral responsibility. When we evaluate beliefs, we're concerned with responsiveness to evidence and reasons - whether the belief-forming process was reliable and truth-tracking. This doesn't require being the "ultimate source" of one's cognitive machinery, just proper functioning of that machinery. The initial plausibility of step 7 comes from surface similarity in "responsibility" language, but deeper analysis shows different criteria are at play.

  Rejecting step 7 means Frankfurt-style compatibilists give up the idea of "ultimate source" requirements entirely - they'd argue moral responsibility depends on whether actions express our deep desires, regardless of origins. Incompatibilists accepting step 7 must bite the bullet on epistemic anti-realism, which is indeed costly as it undermines rationality itself. 

  What makes this satisfying is that it resolves without special pleading - the difference between moral and epistemic responsibility stems from their distinct purposes (guiding action vs. tracking truth), not arbitrary distinction-making. The self-defeat concern in step 8 only arises if we accept the flawed premise in step 7.
answer: |-
  I see why this argument feels sticky—it’s cleverly constructed, and the move from moral to epistemic responsibility seems to expose a paradox. The step I reject is **(7)**, but not because moral and epistemic responsibility "work differently" in an arbitrary way. Instead, the flaw lies in assuming that epistemic responsibility requires *the same kind of ultimate source* as moral responsibility. Let me unpack why this step initially seems plausible, why it fails, and what rejecting it costs different positions.

  The argument’s power comes from the shared structure it imposes: both action and belief appear to "flow from" unchosen aspects of ourselves (character, cognitive habits, evidence). Step (7) claims that if the lack of an "ultimate source" voids moral responsibility, it must void epistemic responsibility too. This feels intuitive because we often use "responsibility" similarly in both contexts—e.g., "You should have known better" parallels "You should have done better." But this similarity masks a critical difference in what we’re *holding people responsible for*. Moral responsibility typically concerns *evaluating agents*—praising or blaming them for their choices based on their values, intentions, and reasons. Epistemic responsibility, however, primarily concerns *evaluating beliefs*—whether they’re justified, rational, or truth-tracking based on available evidence and reasoning. The standards diverge because the goals differ: moral responsibility often involves desert (what you *owe* to others), while epistemic responsibility centers on alignment with truth-conducive processes. You can be epistemically responsible *without* being the ultimate source of your cognitive faculties, as long as your beliefs respond appropriately to evidence and reasons. For example, if you diligently follow logical steps but are misled by undetectable false evidence, you’re not epistemically *at fault*—even though you didn’t choose your evidence or cognitive toolkit. The "sloppy reasoning" charge applies when you *neglect* accessible evidence or violate shared rational norms you’re capable of following, not when your entire cognitive history is unchosen.

  This step (7) initially looks fine because it exploits a surface-level analogy. We *do* speak of epistemic "fault," and it *is* unsettling to think our beliefs are shaped by unchosen factors. But the analogy breaks because the "source" requirement in (1) is uniquely demanding for *moral* responsibility—it’s a response to concerns about fairness ("How can I deserve blame if I didn’t create myself?"). Epistemic responsibility, however, is less about desert and more about whether beliefs are *warranted* given our cognitive situation. Rejecting (7) doesn’t require ad hoc dualism; it simply recognizes that the stakes and criteria differ.

  Now, the costs:  
  - **Frankfurt-style/reasons-responsive compatibilists** (who deny ultimate-source requirements) *already reject (1)*. They argue moral responsibility depends on whether your actions express your deep-seated desires or you’re responsive to reasons—not on cosmic origination. For them, rejecting (7) costs nothing; it reinforces their view that responsibility hinges on local agential structures (e.g., your reasons-responsive mechanism), not infinite regress. Their "cost" is biting the bullet on intuitions about ultimate source: they accept that responsibility is compatible with our causal history being determined by factors beyond us.  
  - **Incompatibilists** (who accept (1)) face a tougher choice if they *accept* (7). They must swallow that epistemic responsibility is equally impossible—meaning no belief is ever rationally justified, including the incompatibilist’s own argument. This *is* self-defeating, as (8) notes, and forces them into global skepticism. To avoid this, they might retreat to a weaker epistemic standard (e.g., "internal" justification that doesn’t require ultimate sources), but this risks inconsistency by applying different standards to action and belief. Alternatively, they could deny (7) by conceding that epistemic norms function differently, but this weakens their critique of compatibilist moral responsibility by showing source requirements aren’t universal.  

  Ultimately, rejecting (7) preserves a robust notion of epistemic responsibility while exposing that the ultimate-source demand in (1) is a moral-specific intuition—one compatibilists can coherently abandon. The argument’s reductio only works if epistemic and moral responsibility are structurally identical, but they’re not. Your classmate’s move proves too much because it mistakes a deep moral intuition for a universal requirement of all responsibility-talk. What feels "off" is that (7) conflates two distinct projects: holding people answerable for their conduct versus appraising beliefs for their fit with reality. Once separated, the paradox dissolves.
