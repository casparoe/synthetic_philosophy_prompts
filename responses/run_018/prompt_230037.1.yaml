answer: |-
  Below is a systematic framework of desiderata for evaluating Lexical Threshold Negative Utilitarianism (LTNU), derived from conceptual dilemmas, empirical constraints, and foundational commitments. The requirements are non-negotiable for any credible LTNU **unless** sacrificing them fundamentally alters LTNU’s core thesis (i.e., lexical priority for severe suffering).

  ---

  ### **Desiderata for an Axiology of Severe Suffering**
  | # | Requirement                  | Case/Dilemma Forcing It                                                                 | Negotiable? | Conflict Partners       | Why Non-Negotiable?                                                                 |
  |---|-----------------------------|----------------------------------------------------------------------------------------|-------------|-------------------------|-------------------------------------------------------------------------------------|
  | **1** | **Lexical Priority**        | *The Tortured Child*: One second of torture (above-threshold) vs. infinite lifetimes of mild pleasure for all. | **No**      | R2, R3                  | Core LTNU thesis: no compensation possible.                                         |
  | **2** | **No Sub-Threshold Aggregation** | *The Pinprick Pile-Up*: Can a billion brief pinpricks (sub-threshold) outweigh one second of torture? | **No**      | R1, R3                  | If aggregated, threshold collapses; mild pains could "trade" against severe suffering. |
  | **3** | **Threshold Location Non-Arbitrariness** | *The Vague Agony*: Suffering at 99% of the proposed threshold vs. 101%. Must justify discontinuity. | **Weakly No** | R7                      | Arbitrary thresholds invite ad hoc manipulation; must be defensible.                |
  | **4** | **Prohibition vs. Badness Distinction** | *Unavoidable Threshold Suffering*: Must LTNU always avoid inflicting *any* above-threshold suffering, even to prevent greater suffering? | **Contextual** | R1                      | LTNU can accept *badness* of unavoidable suffering but requires *prohibition* on inflictions. |
  | **5** | **Single-Life vs. Cross-Person Consistency** | *The Sacrificial Patient*: Remove one person’s severe pain by inflicting sub-threshold pains on millions. | **No**      | R1, R2                  | LTNU must treat aggregation limits identically intra-/inter-personally to avoid inconsistency. |
  | **6** | **Pleasure-Pain Incommensurability** | *The Hedonic Bribe*: Can vast pleasure offset *risk* of threshold suffering? (e.g., dangerous medical trials) | **No**      | R1                      | If pleasure compensates risk, it may compensate suffering itself.                  |
  | **7** | **Empirical Pain Constraints** | *Adapted Suffering*: Chronic pain sufferers report lower intensity. Is adapted pain still "above threshold"? | **No**      | R3                      | LTNU must not conflate subjective reports with moral significance.                  |
  | **8** | **Duration Insensitivity**  | *The Brief Agony*: One millisecond of torture vs. decades of moderate depression.      | **Weakly Yes** | R1 (if duration matters) | Duration cannot outweigh intensity; else lexical priority erodes.                   |

  ---

  ### **Key Tensions**
  - **R1 vs. R2**: Lexical priority (R1) forbids aggregating sub-threshold pains (R2), but this leads to counterintuitive rejections of pain minimization (e.g., refusing to prevent a billion pinpricks to avoid one torture-second).
  - **R1 vs. R5**: If aggregation is forbidden cross-personally (R5), but *not* within a life, LTNU becomes agent-relative and incoherent.
  - **R3 vs. R7**: Non-arbitrary thresholds (R3) clash with empirical variability in pain measurement (R7). If pain is adaptive, locating a "fixed" threshold is biologically dubious.

  ---

  ### **Comparison of Alternative Views**
  | **View**                           | **R1** | **R2** | **R3** | **R4** | **R5** | **R6** | **R7** | **R8** | **Verdict**                                                                 |
  |------------------------------------|--------|--------|--------|--------|--------|--------|--------|--------|-----------------------------------------------------------------------------|
  | **Classical Hedonistic Utilitarianism** | ✗      | ✗      | ✓      | ✗      | ✗      | ✗      | ✓      | ✗      | Fails R1, R2: Allows torture for net pleasure.                              |
  | **Plain Negative Utilitarianism**  | ✗      | ✓      | ✓      | △      | ✓      | ✓      | ✓      | △      | Fails R1: All suffering is commensurable.                                   |
  | **Prioritarianism**                | ✗      | ✗      | ✓      | △      | △      | ✗      | ✓      | △      | Fails R1, R2: Weighted aggregation permits trading severity for volume.     |
  | **Rights-Based Anti-Torture**      | ✓      | ✓      | ✓      | ✓      | ✗      | ✓      | ✓      | ✓      | Fails R5: Permits sub-threshold harms to individuals to prevent torture.    |
  | **LTNU (Target)**                  | ✓      | ✓      | ?      | △      | ✓      | ✓      | ?      | ✓      | Struggles with R3, R7 (non-arbitrariness), and R4 (prohibition strictness). |

  **✓** = Satisfies, **△** = Partially Satisfies, **✗** = Fails, **?** = Contested  

  ---

  ### **The Most Exclusionary Requirement**
  **R1 (Lexical Priority)** excludes all non-absolutist views. Classical utilitarianism, prioritarianism, and plain negative utilitarianism all permit *some* compensation for severe suffering (via pleasure, aggregated mild pains, or risk trade-offs). Rights-based views satisfy R1 but fail R5 (cross-personal consistency). Only LTNU insists that above-threshold suffering is *lexically worse* than any sub-threshold state—a threshold even rights-based approaches may relax for greater goods.

  \answer{Lexical Priority}
