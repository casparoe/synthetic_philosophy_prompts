answer: |-
  Below is a rigorous dialogue between two interlocutors, **Etiologist** (defending a selected-effects account à la Wright/Millikan) and **Causal-Role Proponent** (defending Cummins-style systemic capacity analysis). Each directly engages the other’s strongest objections while addressing your engineered ventricular patch case.

  ---

  ### **Interlocutors**
  - **Etiologist (E)**: Defends the etiological (selected-effects) theory of function.  
  - **Causal-Role Proponent (CR)**: Defends the causal-role (systemic capacity) theory of function.  

  ---

  ### **Dialogue**  
  **Etiologist (E)**: Let’s begin with your ventricular patch. On the etiological view, a biological trait has a *function* only if it was selected by natural selection *because* it performed that specific activity in the past. Your patch lacks any evolutionary history. Its contractile capacity was designed *de novo* via biomedical engineering, not shaped by selection pressures. Thus, while it *contributes* to your heart’s rhythm, it cannot be said to have the *function* of rhythmic contraction. To call this its "function" conflates current utility with normative teleology.  

  **Causal-Role Proponent (CR)**: But that arbitrarily excludes entities essential to modern biology! The patch’s contractile activity is demonstrably critical to maintaining cardiac output—a key capacity of the circulatory system. On Cummins’ account, we assign a function to a component based on its causal contribution to a *system’s* capacity. Here, the system is your heart, and the patch’s role in sustaining synchrony is analytically verifiable. Denying it a "function" ignores empirical reality for philosophical dogma.  

  **E**: Your causal-role view overgenerates functions. Suppose the patch develops ectopic pacing, causing arrhythmia. It still contributes causally to the system (by triggering contractions), so you’d have to say arrhythmia is its "function." Worse, cancer cells causally contribute to tumor growth—would you assign them a "function"? Only an etiological filter avoids pathologizing malfunction or attributing functions to harmful artifacts.  

  **CR**: Not at all. Functions are contextual. In a *healthy* circulatory system, synchronous contraction maintains efficient blood flow. The patch’s function is defined relative to that normative context—engineered to sustain systemic stability. Ectopic firing disrupts that stability, so it’s dysfunctional. Unlike cancer, the patch was *intentionally designed* for a role. Cummins’ framework accommodates design intentions as system goals.  

  **E**: Intentions don’t rescue you. Evolutionary functions are mind-independent; design intentions are subjective. If I build a hammer but use it as a paperweight, is its "function" weighting paper? No—its *proper* function (in Millikan’s terms) derives from the history of its design *as a hammer*. Your patch has no such history. It’s an artifact, not a biological part with teleosemantic norms.  

  **CR**: But biology now *includes* engineered systems! Your definition renders synthetic organs, gene therapies, or any *de novo* biological technology "functionally illegitimate." Yet clinicians *must* use functional language to evaluate these interventions. When your patch desynchronizes, they call it a "malfunction"—because it fails its *intended causal role* in restoring homeostasis. Rejecting this as "not real function" is scientistically obstinate.  

  **E**: I concede that clinical practice needs pragmatic language. But philosophy must distinguish *normativity* from *causality*. The patch’s designers *intend* it to contract, so we can say it *ought* to do so relative to their goals. But without a selection history, this "ought" is instrumental (like a car engine "ought" to combust fuel), not biological (like a heart "ought" to pump blood). Biological functions are natural norms; yours are imposed by design.  

  **CR**: And why privilege natural selection as the sole source of norms? An organism’s physiology maintains norms of survival *now*, not just historically. Your heartbeat sustains you today; the patch integrates into that real-time regulatory system. Its malfunction jeopardizes systemic viability—a biological, not merely instrumental, failure. Etiology can’t monopolize normativity.  

  ---

  ### **Conclusion: Your Normative Expectation**  
  **Etiologist’s View**:  
  Your expectation that the patch *ought* to contract synchronously is **instrumentally valid** (based on design intent) but **biologically non-normative**. Without evolutionary history, "malfunction" is metaphorical—like a broken engine. Desynchronization is undesirable but not a *biological* dysfunction.  

  **Causal-Role Proponent’s View**:  
  Your expectation is **defensibly normative**. The patch’s function derives from its critical role in maintaining your circulatory system’s capacity to sustain life. Desynchronization disrupts this capacity, constituting a *bona fide* malfunction—grounded in current systemic requirements, not evolutionary backstory.  

  **Synthesis**:  
  Both accounts validate your practical expectation ("it ought to synchronize"), but on different grounds:  
  - **Etiological**: Legitimacy via *transferred intentionality* (designer’s goals).  
  - **Causal-Role**: Legitimacy via *systemic indispensability* (current contribution to survival).  
  While the etiological view denies the patch a "natural" function, it cannot dismiss the normativity of your reliance on its causal role. The causal-role view offers a more inclusive framework for novel biology—one where "function" reflects present integration into life-sustaining systems, not just ancestral lineage. Thus, **your normative expectation holds** under either account, but its philosophical defense is strongest under Cummins’ model.  

  ---  
  *In clinical practice, the patch’s "function" is uncontroversial; in philosophy, the causal-role account best accommodates the realities of engineered biology without abandoning normativity.*
