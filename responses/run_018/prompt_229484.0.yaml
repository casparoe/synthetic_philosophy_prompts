prompt: |-
  I work in theoretical biology, building evolutionary models of social behavior; my working vocabulary is replicator dynamics, evolutionarily stable strategies, asymmetric contests, costly signaling, and assortment. I have been reading about David Lewis's account of convention in his book Convention, and I want to know how much of it survives translation into my framework.

  As I understand it, the account runs roughly as follows. A convention is a regularity in the behavior of members of a population facing some recurring situation, where it is common knowledge among them that nearly everyone conforms to the regularity, that nearly everyone expects the others to conform, and that nearly everyone prefers to conform conditional on the others doing so; and where the situation admits at least one alternative regularity that could equally have served. The underlying problem is thus one of coordination with multiple solutions, and the convention is arbitrary in the sense that another would have done. Conventions get started and sustained through precedent and salience rather than through enforceable agreement.

  Here is what I would like. First, restate each component of this account in evolutionary game theory vocabulary, as faithfully as you can: the recurring situation and its multiplicity of solutions; conformity as a preference conditional on others' conformity; the expectation and common-knowledge conditions; arbitrariness; precedent and salience. Be explicit about what each component becomes -- for instance, whether common knowledge turns into a claim about public signals, correlated encounters, or assortment, or simply drops out of the model -- rather than giving me a loose paraphrase.

  Second, a test case. Behavioral ecologists describe the resolution of territorial contests by owner-intruder asymmetries -- the incumbent almost always wins, and selection favors individuals who escalate when owner and retreat when intruder -- as a convention, and it is standardly modeled as a correlated equilibrium built on an observable role asymmetry. Would this count as a convention on your translation of Lewis, given that the animals presumably hold no expectations about one another, let alone common knowledge? Use this case to show me where the translation has bite, and whether my field has been using the word too loosely or Lewis too strictly.

  Third, the residue report. Which parts of the account translate cleanly, which translate only under distortion, and which have no expression in my framework at all? The candidates I have in mind include the epistemic conditions (do replicator dynamics need anything like common knowledge, or does the epistemic layer matter only for agents who deliberate?); the distinction Lewis wants between a convention and a mere behavioral regularity (can an ESS fail to be a convention, and can my framework even state the difference?); and whatever room Lewis leaves for agents to reflect on their conventions -- to keep one, abandon one, or coordinate on switching to another -- which seems to have no counterpart in a population of replicators. For each piece of residue, give me your verdict on whether it marks something my framework is missing (a notion of norm, of shared expectation, of deliberation among equilibria) or something Lewis's rational-choice scaffolding added without earning its keep. In other words: does the evolutionary reconstruction show that convention was never the epistemically loaded phenomenon Lewis took it to be, or does it instead reveal what his account can see and mine cannot?
reasoning: |-
  We are going to break down Lewis's account of convention and translate each component into evolutionary game theory (EGT) vocabulary. Then we'll apply it to the test case of owner-intruder asymmetry in territorial contests. Finally, we'll discuss the residue: what translates cleanly, what with distortion, and what not at all.

  ## 1. Translation of Lewis's Components

  ### a. Recurring situation with multiple solutions
  - **Lewis**: A situation that occurs repeatedly and has multiple equilibria (coordination equilibria) that are equally good (or nearly so) from the perspective of the agents.
  - **EGT**: This becomes a **recurrent interaction** (modeled as an infinitely repeated game or as a one-shot game played in a large population with random matching) that is a **coordination game** with at least two **strict Nash equilibria** (or evolutionarily stable strategies, ESS). The existence of multiple equilibria is key. The game must have multiple symmetric (or asymmetric, if roles are present) equilibria that are strict, meaning that unilateral deviation leads to a loss.

  ### b. Conformity as a preference conditional on others' conformity
  - **Lewis**: Each agent prefers to conform to the regularity if (nearly) all others conform.
  - **EGT**: This is captured by the idea of a **Nash equilibrium** (or ESS) in the underlying game. In an ESS, the strategy is such that if everyone in the population is playing it, then any mutant playing an alternative strategy would have lower fitness (and hence the mutant strategy cannot invade). Thus, in an ESS, each individual is playing a strategy that is a best response to the current population strategy. In other words, they "prefer" (in the sense of having higher fitness) to play the convention when others are playing it.

  ### c. Expectation and common knowledge conditions
  - **Lewis**: It is common knowledge that nearly everyone conforms, that nearly everyone expects others to conform, and that nearly everyone prefers to conform conditional on others conforming.
  - **EGT**: 
    - **Common knowledge**: In EGT, common knowledge is not explicitly modeled because we do not require agents to have beliefs or knowledge. Instead, the population state (the distribution of strategies) is public and stable. The role of common knowledge is replaced by the concept of a **stable equilibrium** (like an ESS) that is **asymptotically stable** under the replicator dynamics. In such a state, the population is monomorphic (or polymorphic in a stable configuration) and resistant to invasion by mutants. The stability condition ensures that any small deviation (by mutation or migration) will be weeded out, so that the population remains at the equilibrium. This stability can be interpreted as the evolutionary counterpart of common knowledge: the fact that the equilibrium is stable and known to be stable (by an outside observer) is what ensures that everyone is playing the equilibrium and expects others to play it.
    - **Expectation**: In EGT, expectations are replaced by the **population state**. Each player's strategy is conditioned on the current state of the population. In a monomorphic ESS population, every individual is programmed to play the same strategy, and they face opponents playing that strategy. Thus, they "expect" others to play the convention because that is the only strategy present (or the overwhelmingly frequent one). In a polymorphic population, the distribution of strategies is fixed and known (by the replicator dynamics) so that the best response is conditioned on that distribution.

    However, note that EGT does not require agents to form explicit expectations. The dynamics are driven by differential reproduction, not by beliefs. So we can say that the expectation condition is replaced by the **population state** and the **stability** of that state.

  ### d. Arbitrariness
  - **Lewis**: There exists at least one alternative regularity that, if it had been established, would have served just as well.
  - **EGT**: This translates to the existence of **multiple ESS** in the underlying game. That is, the coordination game has at least two distinct strict Nash equilibria (or ESS) that yield the same (or similar) payoffs. In the case of asymmetric contests, we might have multiple correlated equilibria that are equally efficient.

  ### e. Precedent and salience
  - **Lewis**: Conventions get started and sustained through precedent (past conformity) and salience (some feature making one equilibrium stand out). This is how agents coordinate on one equilibrium when there are multiple.
  - **EGT**: 
    - **Precedent**: In EGT, precedent can be modeled by the **initial conditions** and the **basin of attraction** of an equilibrium. If the population starts in the basin of attraction of a particular ESS, it will evolve to that ESS. Historical accidents (mutations, founder effects) can set the precedent. Once established, the ESS is stable.
    - **Salience**: In EGT, salience can sometimes be captured by **correlating devices** or **asymmetries**. For example, in asymmetric games (like owner-intruder), the role asymmetry (which is observable) serves as a correlating device that allows the population to coordinate on an asymmetric equilibrium. In symmetric games, salience might be introduced by a mutation that is particularly successful in a given environment (e.g., a signal that is more conspicuous) and thus becomes fixed. However, note that in pure replicator dynamics without any signals, salience might not have a direct counterpart because the dynamics are driven solely by payoffs and frequencies. But we can model salience by introducing a **correlated equilibrium** via an environmental signal that is available to all players (and thus acts as a public signal).

  ## 2. Test Case: Owner-Intruder Asymmetry

  - **Description**: In territorial contests, the incumbent (owner) wins and the intruder retreats. This is modeled as a correlated equilibrium: the role (owner or intruder) is observable and serves as a correlating device. The strategy "escalate if owner, retreat if intruder" is an ESS in the correlated game.

  - **Lewis's conditions**:
    - **Recurring situation**: Yes, territorial contests are recurrent.
    - **Multiple solutions**: In the asymmetric hawk-dove game, there are two asymmetric pure-strategy equilibria: one where the owner always wins, and one where the intruder always wins (if we consider the roles as fixed and observable). So there are multiple equilibria (arbitrariness).
    - **Conformity conditional on others**: In the ESS, each individual plays the strategy that is a best response to the population playing the same strategy. If the population plays the "owner wins" convention, then an individual who escalates when owner and retreats when intruder gets the expected payoff of the equilibrium, and any deviation (e.g., escalating when intruder) would lead to a lower payoff (because the opponent is expected to play the convention). Thus, conditional on others conforming, it is optimal to conform.
    - **Expectations and common knowledge**: Here is the sticking point. Lewis requires that it is common knowledge that nearly everyone conforms, expects others to conform, and prefers to conform. In the EGT model, the animals do not hold expectations or knowledge. Instead, the population is in an evolutionarily stable state. The role asymmetry is observable, so each animal can condition its behavior on its role and the opponent's role (if observable). But there is no requirement of common knowledge.

  - **Translation verdict**: 
    - The EGT model captures the arbitrariness (multiple equilibria), the conditional conformity (ESS), and the recurrence. 
    - However, the epistemic conditions (common knowledge and expectations) are replaced by the stability of the ESS and the observability of the role asymmetry. The role asymmetry acts as a public signal that allows for correlation without the need for common knowledge. 
    - **Does it count as a convention?** On the evolutionary translation, yes, because:
        - It is a stable behavioral regularity (ESS) in a coordination problem (with multiple equilibria).
        - The arbitrariness condition holds (the alternative equilibrium, where intruder wins, is also an ESS).
        - The role asymmetry provides the correlating device (which replaces salience and precedent).

    But note: Lewis's account requires common knowledge and expectations, which are absent in the EGT model. So strictly speaking, on Lewis's original account, it might not qualify because the animals lack the required mental states.

    - **Bite of the translation**: This reveals that the behavioral ecology usage of "convention" is looser than Lewis's. They are using "convention" to mean an arbitrary, stable behavioral regularity that solves a coordination problem. The EGT framework shows that the epistemic layer (common knowledge) is not necessary for the evolutionary stability of the convention. But Lewis's account is more demanding because it requires that the agents have the right beliefs and knowledge. 

    - **Conclusion for the test case**: The evolutionary model captures the functional essence of convention without the epistemic baggage. However, if one insists on Lewis's definition (which includes the epistemic conditions), then the owner-intruder asymmetry would not be a convention because the animals lack the required beliefs and common knowledge. This suggests that the field of behavioral ecology is using a functional/evolutionary notion of convention that is a naturalized version of Lewis's concept.

  ## 3. Residue Report

  We now evaluate which parts of Lewis's account translate cleanly, which with distortion, and which not at all.

  ### a. Epistemic conditions (common knowledge and expectations)
  - **Translation**: In EGT, common knowledge and expectations are replaced by the **stability of the equilibrium** (e.g., ESS) and the **population state** (monomorphism or stable polymorphism). The dynamics of selection ensure that the population remains at the equilibrium, and any deviation is selected against. This stability condition is the evolutionary counterpart of common knowledge: it ensures that the population is in a state where everyone is playing the convention and will continue to do so.
  - **Verdict**: 
    - **Cleanliness**: This is a clean translation in terms of function (the regularity is maintained and resistant to change) but it is a distortion in terms of mechanism. EGT does not require agents to have mental states; the stability is achieved through differential reproduction. 
    - **Residue**: The residue is the mental state of belief and expectation. For agents that do deliberate (like humans), the epistemic conditions might be important. But in a population of replicators, they are not needed. 
    - **Assessment**: The evolutionary reconstruction shows that the epistemic layer is not necessary for the evolutionary emergence and stability of conventions. Therefore, Lewis's epistemic conditions might be seen as a rationalization of a phenomenon that can arise without it. However, for organisms capable of reasoning, the epistemic conditions might be part of the proximate mechanism that sustains the convention.

  ### b. Distinction between convention and mere behavioral regularity
  - **Lewis**: A convention is a specific kind of regularity that satisfies the common knowledge, arbitrariness, and coordination conditions. A mere regularity (like driving on the right) might be a convention, but not every regularity (like breathing) is a convention.
  - **EGT**: In EGT, we can distinguish:
    - **Convention**: An ESS in a coordination game with multiple strict ESS (so arbitrariness holds).
    - **Mere regularity**: An ESS that is unique (so no arbitrariness) or an ESS in a game that is not a coordination game (e.g., a prisoner's dilemma where the ESS is defection, which is not arbitrary because there is only one equilibrium).
  - **Verdict**: 
    - **Cleanliness**: The translation is clean. We can define a convention in EGT as an ESS in a symmetric coordination game with at least two strict ESS. This captures the arbitrariness and the coordination nature. 
    - **Residue**: None. The distinction is expressible.

  ### c. Room for agents to reflect on and change conventions
  - **Lewis**: Agents can deliberately decide to keep, abandon, or switch conventions. This requires the agents to be aware of the convention and the alternatives.
  - **EGT**: In a pure replicator dynamics model, there is no reflection. The population evolves by natural selection. However, we can model:
    - **Switching equilibria**: This can occur through a large mutation or migration event that moves the population from one basin of attraction to another. But this is not deliberate. 
    - **Individual learning**: In models that incorporate learning (e.g., best-response dynamics, reinforcement learning), individuals might switch strategies based on experience. But again, this is not reflective in the sense of being based on beliefs about the convention and alternatives. 
  - **Verdict**: 
    - **Translation with distortion**: We can model shifts between conventions by stochastic dynamics (e.g., mutation-selection equilibrium, genetic drift, or learning dynamics). But these shifts are not driven by reflection (e.g., collective reasoning that the alternative is better). 
    - **Residue**: The residue is the deliberative aspect. In Lewis's account, agents can reason about the convention and choose to switch. In EGT, without incorporating higher cognitive processes, we cannot capture this. 
    - **Assessment**: This residue marks something that the evolutionary framework (as a model of natural selection) is missing: the role of explicit reasoning and collective decision-making. However, for non-human animals, the EGT model might be sufficient. For humans, we might need to extend the model to include cognitive processes.

  ### Overall Conclusion
  - The evolutionary reconstruction (EGT) captures the core of Lewis's convention: the arbitrariness, the stability, the conditional conformity, and the role of precedent/salience (via correlating devices). 
  - It shows that the epistemic conditions (common knowledge, expectations) are not necessary for the evolutionary stability of conventions. Thus, Lewis's account might have added an epistemic layer that is not essential for the phenomenon (at least in non-human animals). 
  - However, for human conventions, the epistemic conditions might be part of the proximate mechanism. The evolutionary framework cannot capture the deliberative aspect of conventions (reflection and collective switching) without extensions (e.g., models of bounded rationality and learning).

  Therefore, the residue (epistemic conditions and deliberation) does not necessarily mean that Lewis's account is superior; rather, it reveals that for non-deliberative agents, the evolutionary model provides a sufficient account without the epistemic load. But for deliberative agents, the epistemic conditions might be necessary to explain how the convention is sustained at the individual level.
answer: |-
  ### 1. Translation of Lewis's Components into Evolutionary Game Theory Vocabulary

  #### a. **Recurring situation with multiple solutions**
  - **Lewis**: A situation that recurs across a population, admitting multiple coordination equilibria (regularities) as solutions.
  - **EGT Translation**: A **symmetric coordination game** with **at least two strict Nash equilibria** (or evolutionarily stable strategies, ESS). The game is played repeatedly in a large population via **random pairwise interactions**. For example, the classic Hawk-Dove game with added asymmetry (e.g., Owner-Intruder roles) has two pure-strategy ESS: one favoring "Owner escalates, Intruder retreats" and another favoring "Intruder escalates, Owner retreats." The recurrence is modeled through **infinite population dynamics** (e.g., replicator dynamics).  

  #### b. **Conformity as preference conditional on others' conformity**  
  - **Lewis**: Agents prefer to conform to the regularity *if* (nearly) all others conform.  
  - **EGT Translation**: Conformity maps to a strategy being a **strict best response** to the population state. In a monomorphic population at ESS, the incumbent strategy \( S \) satisfies:  
    - \( \pi(S | S) > \pi(M | S) \) for any mutant \( M \),  
    where \( \pi(A | B) \) is the payoff of strategy \( A \) against \( B \).  
    Conditional preference becomes: **fitness advantage of \( S \) requires others to play \( S \)**.  

  #### c. **Expectations and common knowledge**  
  - **Lewis**: Common knowledge that (i) nearly all conform, (ii) nearly all expect others to conform, and (iii) nearly all prefer conformity given others' conformity.  
  - **EGT Translation**:  
    - **Expectations of conformity**: Replaced by **population state stability**. In an ESS, the population is monomorphic (all play \( S \)), so any individual "expects" opponents to play \( S \) because they *do* play \( S \) with probability 1. No cognitive expectations; just **empirical encounter rates**.  
    - **Common knowledge**: Replaced by **global stability under replicator dynamics**. The ESS is an attractor; small deviations (mutations) are eliminated. This stability implies that the strategy is "public" (observable via population-level fixation), rendering common knowledge unnecessary.  
    - **Distortion**: Common knowledge is reduced to **universal behavioral fixation** and **robustness against mutants**.  

  #### d. **Arbitrariness**  
  - **Lewis**: At least one alternative regularity could have achieved similar coordination.  
  - **EGT Translation**: The game has **multiple strict ESS** with **equal or similar payoffs**. For example, two pure-strategy ESS in a coordination game where \( \pi(S_1 | S_1) \approx \pi(S_2 | S_2) \). Arbitrariness means no intrinsic superiority; selection depends on **initial conditions** or **drift**.  

  #### e. **Precedent and salience**  
  - **Lewis**: Conventions arise through historical precedent (past conformity) or salience (a focal point).  
  - **EGT Translation**:  
    - **Precedent**: Modeled as **path dependence** in replicator dynamics. The basin of attraction for an ESS determines which equilibrium dominates based on initial strategy frequencies.  
    - **Salience**: Mapped to **correlated asymmetries**. Observable cues (e.g., Owner-Intruder roles) act as **correlation devices** that break symmetry, making one equilibrium "salient" without cognitive framing. Salience is **external** (e.g., environmental markers), not internal (beliefs).  

  ---

  ### 2. Test Case: Owner-Intruder Asymmetry  
  **Behavioral ecology claim**: The "owner wins" rule is a convention.  
  **EGT model**: Asymmetric Hawk-Dove game with roles (Owner/Intruder). The strategy "escalate if owner, retreat if intruder" is a **correlated ESS** (or **correlated equilibrium**), enabled by observable roles.  

  #### Translation verdict using Lewis's criteria:  
  - **Recurring situation**: ✓ (territorial contests are frequent pairwise interactions).  
  - **Multiple solutions**: ✓ (two ESS: "owner wins" or "intruder wins").  
  - **Conditional conformity**: ✓ (playing "owner wins" is a strict best response if others do the same).  
  - **Arbitrariness**: ✓ (both ESS yield equal fitness in symmetric games).  
  - **Precedent/salience**: ✓ (role asymmetry acts as a correlation device).  
  - **Expectations/common knowledge**: ✗ (animals lack beliefs; conformity is hardwired via selection).  

  #### Where the translation bites:  
  - **EGT satisfies all structural conditions** (multiplicity, conditional fitness, stability) but **eliminates epistemic requirements**.  
  - **Verdict**: Your field uses "convention" **appropriately loosely** for evolutionary biology. Lewis's epistemic conditions are artifacts of rational-choice modeling. The owner-intruder rule *is* a convention in EGT terms because it is an **arbitrary, stable solution to a coordination problem**, sustained by observable asymmetries. Lewis's account is "too strict" for non-cognitive agents, as EGT shows conventions can emerge without beliefs.  

  ---

  ### 3. Residue Report: What Translates, What Distorts, What Vanishes  

  #### a. **Epistemic conditions (common knowledge/expectations)**  
  - **Translation**: Replaced by **population monomorphism** and **dynamic stability**. In replicator dynamics, "everyone expects conformity" becomes "everyone *encounters* conformity" due to fixation.  
  - **Verdict**: **Vanishes without loss**. The epistemic layer is a proxy for stability in rational-choice models. EGT reveals that conventions are **self-reinforcing behavioral equilibria** needing no cognition. Lewis's scaffolding adds unearned complexity here.  

  #### b. **Convention vs. mere regularity**  
  - **Lewis**: Conventions require arbitrariness and epistemic conditions; regularities (e.g., breathing) do not.  
  - **EGT Distinction**:  
    - **Convention**: ESS in a coordination game with **multiple strict ESS** (arbitrariness) and **correlating devices** (salience).  
    - **Mere regularity**: ESS without arbitrariness (e.g., unique ESS in Prisoner’s Dilemma).  
  - **Verdict**: **Translates cleanly**. EGT can distinguish conventions (e.g., traffic rules) from non-arbitrary norms (e.g., anti-predator vigilance).  

  #### c. **Agents reflecting on/switching conventions**  
  - **Lewis**: Agents can deliberately abandon a convention or coordinate on a new one.  
  - **EGT Translation**: **No direct counterpart**. Replicator dynamics lack agency; strategy shifts occur via **mutation, drift, or environmental change**.  
    - *Partial workaround*: In **polymorphic populations** or **learning models** (e.g., replicator-mutator dynamics), rare mutants can catalyze shifts between ESS basins. "Reflection" becomes **stochastic exploration**.  
  - **Verdict**: **Distorts/vanishes**. This residue marks a **limitation of EGT**: it cannot model deliberate norm change. Lewis’s account captures a facet of human sociality (e.g., renegotiating norms) absent in selection-only models.  

  #### d. **The role of salience (focal points)**  
  - **Lewis**: Salience is psychological (e.g., uniqueness or prominence).  
  - **EGT Translation**: Salience is **externalized** as a **correlating device** (e.g., observable asymmetries, environmental signals). No psychology—just payoff structures.  
  - **Verdict**: **Translates under distortion**. Lewis’s salience is richer, but EGT captures its function (breaking symmetry) mechanistically.  

  #### Overall verdict:  
  - **Clean translations**: Recurring interactions, conditional conformity, arbitrariness, stability.  
  - **Distortions**: Salience (externalized), precedent (path dependence).  
  - **Vanishes**: Epistemic conditions (redundant), deliberation (no agency).  
  - **EGT’s revelation**: Lewis’s epistemic conditions are **artifacts of rational-choice modeling**, not essential to convention as an evolutionary product. EGT shows conventions arise from **selection, not cognition**, in non-human systems. However, for human conventions involving deliberation, Lewis’s account identifies **gaps in EGT** (e.g., modeling conscious equilibrium selection).  
  - **Recommendation**: Use "convention" in EGT for **arbitrary, stable equilibria in coordination games**, dropping epistemic criteria. For human-like deliberation, augment EGT with **learning or gene-culture coevolution**.  

  ---  
  **Final takeaway**: Your field’s usage is vindicated—conventions *are* evolutionary stable coordination equilibria. Lewis’s account survives translation as a **special case** (for cognitive agents) but loses epistemic weight in an EGT lens. The residue (deliberation) highlights where EGT could expand, not where it falls short.
