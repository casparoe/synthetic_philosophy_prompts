  Their unease about "sociology over moral psychology" hits a nerve though. Does reducing morality to available discourse neglect innate moral intuition? And the isolation loophole is troubling - imagine a remote tyrant claiming ignorance while committing atrocities. 

  What could change their mind? The implicit morality point is key. Historical records often show figures wrestling with cognitive dissonance (Jefferson's own writings prove this). Also, their standard might undervalue oral traditions and non-Western moral frameworks - indigenous cultures had sophisticated ethics long before European formalisation.

