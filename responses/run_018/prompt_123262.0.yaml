  The user raises two concerns: first, that this makes the defence depend on sociology rather than moral psychology, potentially letting off people in isolated societies regardless of harm done. Second, they suspect people apply the defence selectively to protect favoured figures. They ask if their framing is wrong or if the problem is selective application. They want the answer in British English, mention what could change their mind (like implicit moral understanding), and request a bottom line in an \answer{} tag.

