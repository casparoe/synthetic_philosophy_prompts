prompt: |-
  I've been trying to apply the 'man of his time' defence consistently using what I'd call the 'counterfactual accessability' standard — you only excuse a figure if the moral criticism was genuinely inaccessable to them, not just unpopular. So Columbus should actually be excused for the slaughter of indigenous people, since the idea of universal human rights hadn't reached Europe in a form he could have encountered, but Jefferson shouldn't be excused for slavery because abolitionist pamphlets were literally circulating in Virginia. Churchill was actively rebutting anti-racist arguments in Parliament, so he fails too. But this makes the defence depend on sociology rather than moral psychology, and lets off people in isolated societies regardless of harm done. Is my framing wrong, or is the problem just that people apply the defence selectively to figures they want to protect? Please answer in British English, and say what would change your mind — for instance, if moral concepts can be implicitly grasped without being articulated. Put your bottom line in \answer{...} at the very end.
