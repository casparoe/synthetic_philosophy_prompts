  Let me approach this in layers. First, the "true preferences" assumption: institutions do seem to presuppose preferences exist prior to the voting mechanism, like physical traits. But that's philosophically shaky - preferences can be context-dependent. Then there's the moral framing: by calling strategic behavior "cheating", they're borrowing ethical language about authenticity. Interesting how they invoke "sincerity" as if it were a character virtue rather than a game-theoretic choice.

  The real kicker is the last part about restricted domains. I bet most election boards haven't even heard of domain restrictions! They're probably relying on either: a) voters having single-peaked preferences naturally, b) the honor system creating de facto restrictions by suppressing manipulation, or c) sheer luck that cycles are rare. Peer review is even worse - no algorithm at all, just hoping reviewers play nice. 

  Ultimately these systems are demanding participants treat honest ranking as a categorical imperative - "do this because it's right" - while quietly benefiting from domain properties they don't acknowledge. There's tension between the moral rhetoric and the mathematical reality. The user's spotted a beautiful example of institutions papering over impossibility theorems with moralizing...
answer: |-
  That's a sharp observation about the tension between institutional norms and the cold logic of social choice theory. The framing you describe – treating strategic misordering as irrationality or a moral failing rather than a rational response – leans heavily on a specific, and perhaps philosophically loaded, view of preferences and rational agency.

  It presupposes, first and foremost, that individuals possess a stable, well-defined "true" preference ordering that exists prior to and independently of the specific voting or ranking mechanism being used. This ordering isn't seen as contingent on the rules of the game or strategic possibilities; it's treated as an intrinsic state, a fact about the individual's evaluation of the options, much like a medical condition is a fact about their body. When the institution asks for a "sincere" or "honest" ranking, it's demanding a truthful report of this pre-existing internal state. Under this view, deviating from that true ordering is akin to lying about an objective fact – a misrepresentation of one's own authentic judgment. Rational agency, in this framing, is equated with accurately expressing this internal truth. Strategic manipulation becomes irrational not because it fails to achieve a goal (it might very well succeed!), but because it violates the fundamental duty of truthful self-reporting regarding one's preferences. It's a failure of authenticity.

  Furthermore, this framing implicitly treats the act of preference revelation as separable from the strategic consequences. It suggests that the *act of expressing* one's true preference is valuable in itself, independent of whether the voting system protects that expression or ensures it leads to a desirable outcome. This hints at the "autonomy right" you mentioned. The institution is asking participants to prioritize the integrity of their personal expression over the potential instrumental benefit of manipulating the outcome. They are being asked to value the *process* of honest revelation as a good, even if the *result* of that honesty might be personally suboptimal according to their own preferences.

  However, Gibbard-Satterthwaite throws a wrench into this. Since universal strategy-proofness is impossible for three or more alternatives, these institutions *cannot* guarantee that revealing one's true preferences is always safe or optimal. Therefore, they aren't just relying on an articulated restricted domain (like single-peaked preferences) that *would* make honesty rational under the rules. While such domain restrictions might exist de facto in some contexts (making the "rank sincerely" advice *accidentally* rational), the institutions rarely articulate or rely on proving this. Instead, they primarily rely on the *normative* force of the "sincerity" demand and the *hope* that strategic manipulation might be rare, costly, or socially sanctioned.

  In essence, they are asking participants to *treat* honest revelation *as if* it were an autonomy right or a fundamental ethical duty, regardless of the mechanism's inherent vulnerability to manipulation. They are papering over the impossibility theorem with a moral injunction: "Act *as though* your true preference revelation is sacred and protected, even though we know theoretically it isn't always safe, because the system *depends* on widespread adherence to this norm for perceived legitimacy and function." The rationality they presuppose isn't purely instrumental (maximizing outcome); it's bound up with a conception of rational agency as truthful self-expression within a cooperative social endeavor, trusting that others will follow the same norm and hoping the domain isn't too pathological. It's a practical norm elevated to a quasi-moral principle to compensate for a mathematical impossibility.
