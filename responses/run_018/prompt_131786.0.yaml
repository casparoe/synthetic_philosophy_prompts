answer: |-
  Here is a prioritized research agenda for the doctoral program, ordered by theoretical primacy and tractability, with explicit criteria for reordering:

  **#1 Priority: Theoretical Foundations of Prior Probability Attachment**  
  *(Addresses Question 1)*  
  **Why First?** This is the *upstream conceptual core*. Resolving how probabilities attach to theories/hypotheses determines whether the problem is merely technical (solved by new formal tools) or fundamental (requiring Bayesian overhaul).  
  **Tractable Progress:** Philosophers can:  
  - Formalize "framework priors" (e.g., assigning probabilities to *classes* of theories via structural features like simplicity/scope) vs. hypothesis-specific priors.  
  - Model how latent theoretical structure (e.g., unifying power) justifies post-hoc probability shifts without violating conditionalization.  
  - Analyze if "old evidence" vanishes when evidence is *embedded in a framework* rather than isolated.  
  **Trigger for Reordering:** If a rigorous model shows old evidence *dissolves entirely* under framework-based priors (e.g., by proving it reduces to a probability coordination problem), this becomes downstream. If all solutions *require* non-conditionalization (e.g., logical uncertainty measures), move this down.  

  **#2 Priority: Normative Implications for Scientific Practice**  
  *(Addresses Question 2)*  
  **Why Second?** This is *downstream of #1 but upstream of #3*. Scientific practice tests whether theoretical solutions have empirical bite. It bridges formalism and real-world reasoning.  
  **Tractable Progress:** Without empirical work, philosophers can:  
  - Develop criteria for when retrospective fit *should* be discounted (e.g., when data was "inert" prior to theory formulation vs. actively resisting explanation).  
  - Analyze historical cases (e.g., Mercury's perihelion in relativity) to distinguish *post-hoc accommodation* from *genuine confirmation*.  
  - Propose heuristic guidelines for theory appraisal (e.g., penalizing theories that *only* explain old evidence).  
  **Trigger for Reordering:** If case studies reveal scientists *never* treat retrospective fit as confirmatory (making the problem purely academic), deprioritize this. If #1’s solution *entails* systematic discounting, elevate this.  

  **#3 Priority: Implications for Artificial Reasoning Systems**  
  *(Addresses Question 3)*  
  **Why Third?** This is *downstream* of both, applying philosophical insights to engineered systems. It tests the generality of solutions but relies on prior conceptual clarity.  
  **Tractable Progress:** Without engineering, philosophers can:  
  - Formalize how AI systems (e.g., Bayesian networks) handle "stored evidence" when updating beliefs after theory-architecture changes.  
  - Identify whether *representational shifts* (e.g., new ontology) in AI mimic theory change in science, making old evidence problematic.  
  - Propose benchmark tests for "old evidence resilience" in AI reasoning.  
  **Trigger for Reordering:** If AI systems *naturally* avoid old evidence pitfalls (e.g., via continuous re-representation), this becomes a model for human reasoning (#1). If engineered solutions force abandoning Bayesianism, it may inform #1.  

  ---

  **Why This Ordering?**  
  1. **Conceptual depth precedes application.** Until we know if old evidence is a technical glitch or a foundational flaw (#1), prescriptive advice for scientists (#2) or AI (#3) is premature.  
  2. **Science validates formalism.** #2 tests whether theoretical solutions matter outside journals. If scientists already discount retrospective fit intuitively, the problem may be overstated.  
  3. **AI extends human cognition.** #3 explores if solutions scale to artificial systems, offering stress tests for philosophical models.  

  **Key Risks to Prioritization:**  
  - If #3 reveals that AI systems *require* non-Bayesian updates to handle stored data, it could force re-evaluating #1 (e.g., conditionalization’s universality).  
  - If #2 uncovers field-specific practices (e.g., biology vs. physics) that clash with #1’s solution, it may demand contextualizing the problem.  
  - If #1 conclusively shows framework-based priors dissolve the problem, #2/#3 shift to studying *why* scientists/engineers fail to adopt this.  

  This agenda ensures technical work serves grounded philosophical goals: resolving conceptual puzzles (#1), informing practice (#2), and stress-testing solutions (#3)—without requiring empirical labs.
