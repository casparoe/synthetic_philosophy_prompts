  The cost of rejecting step (4)? You have to accept that some values (loyalty, integrity) aren't just present preferences but emergent properties of historical patterns. This might require tweaking strict utility maximization to include diachronic rationality - where the temporal structure of commitments matters independently of momentary preferences. 

