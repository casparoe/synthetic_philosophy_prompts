  First, I need to understand why step (4) is the problematic hinge. The argument claims that sunk costs can only be rational if they create present/future goods, but then insists these goods must be redescribed as present preferences - making sunk costs themselves redundant. This feels like a sleight of hand. Maybe the mistake is assuming that relational goods (like trust or identity) can be fully captured by present utility calculations. 

