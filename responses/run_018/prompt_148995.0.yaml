answer: |-
  Here's your EA Sorting Quiz – 8 concrete scenarios designed to tease apart your views, with a scoring key mapping you to the positions you described. Answer honestly based on your gut reaction!

  ---

  **The EA Alignment Detector Quiz**

  **Instructions:** Pick the option (A, B, or C) that best reflects your instinct for each scenario. Don't overthink it!

  1.  **The Research Dilemma:** You land a dream job at a top AI lab. Your salary funds life-saving malaria nets for 100 kids/year. But your specific project *might* (experts disagree) slightly increase risks of future AI misuse. Do you...
      *   **A:** Take the job & donate. Saving 100 kids *now* outweighs a vague, debated future risk.
      *   **B:** Pass on the job. The potential systemic risk, however small, is unacceptable when tied to your direct actions. Find different funding.
      *   **C:** Take the job but donate to AI safety orgs instead of nets, trying to directly counter the risk.

  2.  **The Charity Pitch:** Two orgs need funding. Org A provides deworming pills proven to boost school attendance & future earnings (cost: $1/child/year). Org B runs a community center offering job training & counseling in a struggling neighborhood. Impact is harder to quantify but locals passionately endorse it. You only fund one. Which?
      *   **A:** Org A (Deworming). Clear, measurable impact per dollar is crucial. We *know* this works efficiently.
      *   **B:** Org B (Community Center). Human welfare is complex. Local voices & holistic support matter more than narrow metrics. Measurability can miss the point.
      *   **C:** (If forced) Probably Org A, but it feels incomplete. I wish I could fund both or find better metrics for B.

  3.  **The Government Gap:** A billionaire funds a wildly successful pilot program giving cash directly to poor families. Seeing this, the government *scraps* its own plans for a similar, larger-scale welfare program, saying "Philanthropy has it covered." Is this...
      *   **A:** Net positive! The billionaire's program got help to people faster than government bureaucracy would have.
      *   **B:** A disaster. Private money crowded out essential *systemic* government action, which is the only sustainable solution. Priorities got warped.
      *   **C:** Mixed. Help happened now, but long-term stability is weakened. We need both, carefully coordinated.

  4.  **The Moral Compass Test:** You work in high-frequency trading. Your job has zero social value (maybe negative), but pays insanely well. You donate 50% to top EA charities, saving many lives. Does this job...
      *   **A:** Make you a moral hero? You're generating massive net good despite the job's nature.
      *   **B:** Corrupt you? Spending 40+ hours/week in a morally hollow environment inevitably warps your thinking and values, regardless of donations.
      *   **C:** Feel kinda icky but necessary? The good outweighs the bad, but it's not ideal. I'd switch if a high-impact, ethical job paid enough.

  5.  **The Substitution Illusion:** A top EA charity runs a vaccination drive in Country X, saving 10,000 kids. Later, leaked documents show Country X's government *canceled* its planned vaccination expansion for that region *because* they knew the charity would cover it. The charity's money didn't add 10k saved lives; it just replaced government action. Does this change the charity's impact?
      *   **A:** No. 10k kids are still vaccinated who wouldn't have been otherwise *at that time*. Timing matters. The charity still caused the good outcome.
      *   **B:** Yes! This is the "substitution illusion." The charity's dollars were effectively neutralized; they didn't create *additional* welfare. We need strategies that *add* to state efforts, not replace them.
      *   **C:** It's complicated. The charity *did* cause the vaccinations to happen, but the long-term effect might be negative if it entrenches government inaction.

  6.  **The Epistemic Outsourcing:** An EA fund manager allocates millions based purely on cost-effectiveness analyses (CEAs) from GiveWell-style researchers. They haven't visited projects or deeply engaged with the communities affected. Is this...
      *   **A:** Ideal! Experts using rigorous data make better decisions than individual feelings or anecdotes. Trust the process.
      *   **B:** Dangerous. Outsourcing all moral judgment to metrics ignores context, local knowledge, and values beyond simple quantification. It abdicates personal responsibility.
      *   **C:** Efficient but imperfect. CEAs are crucial tools, but funders should still develop independent understanding and judgment.

  7.  **The Local Hero vs. Distant Statistic:** Your friend quits finance to work directly at an inspiring (but small-scale) urban farm project improving food access in your city. They make less money and donate far less than they could have. How do you see their choice?
      *   **A:** Well-intentioned but misguided. They could've done vastly more good in finance + donations, even funding dozens of farms like this.
      *   **B:** Deeply admirable. Direct connection, community building, and seeing tangible results foster genuine moral character and local resilience. Money isn't everything.
      *   **C:** A valid personal choice, but not the most *optimized* path for global good. I understand the appeal though.

  8.  **The Unmeasurable Suffering:** A donor wants to fund work reducing severe, chronic loneliness among the elderly. It's incredibly hard to measure "loneliness reduced" or its downstream effects (health, lifespan) causally and cost-effectively. Compared to funding deworming, should this donor...
      *   **A:** Stick with deworming. Without strong metrics, we can't know if the money is doing much good. It might be wasted.
      *   **B:** Fund the loneliness work. Some of the worst suffering is precisely what's hardest to measure. We must try, using qualitative evidence and moral intuition.
      *   **C:** Search hard for *some* measurable proxies or pilot studies, but be willing to fund it even if metrics are fuzzier than deworming's.

  ---

  **Scoring Key: Where Do You Stand?**

  Tally your A's, B's, and C's. Most answers fall into distinct patterns:

  *   **Mostly A's: The Straight Defender of Earning-to-Give (ETG)**
      *   Core Belief: Maximizing measurable good per dollar *is* the priority. High-earning jobs + strategic donations are a powerful, efficient tool. Systemic critiques are often overblown or outweighed by concrete results. Trust the metrics. Substitution effects are usually not total, and immediate impact matters.

  *   **Mostly B's: The Systemic Skeptic (Encompassing Institutional Critique & Clean Hands)**
      *   Core Belief: Focusing narrowly on measurable outcomes via private donations ignores deeper problems. It can crowd out essential government action ("Institutional Capture"), warp priorities away from hard-to-measure but vital needs, and corrupt individuals in harmful jobs ("Clean Hands"). Metrics can't capture everything; local context and moral intuition matter. Substitution effects are real dangers. Direct action or systemic change > optimizing donations.

  *   **Split A/B (Especially B on Q3, Q5, Q7 & A on Q1, Q2, Q6): The Measurability-Bias Critic**
      *   Core Belief: The EA focus on ultra-quantifiable interventions (like deworming) risks neglecting crucial areas of well-being that are harder to measure (mental health, community, systemic justice, dignity). You're sympathetic to earning-to-give *in theory* but worry the "best buys" list misses important parts of the picture. You distrust the illusion of perfect quantification ("Epistemic Outsourcing" concern).

  *   **Split A/B (Especially B on Q1, Q4 & A on Q3, Q5, Q8): The Institutional-Capture Critic**
      *   Core Belief: The *biggest* danger of private philanthropy (even EA-aligned) is distorting public priorities and letting governments off the hook ("Substitution Illusion" is a major worry). You might be okay with ETG *if* the job isn't actively harmful and the donations truly add to (not replace) public goods. Your critique centers on power dynamics and long-term systemic stability over individual donation optimization.

  *   **Split A/B (Especially B on Q4 & A on others): The 'Clean Hands' Objector**
      *   Core Belief: The *means matter*. Working in a morally dubious or hollow field (finance, certain tech, advertising) for decades, even while donating generously, fundamentally erodes your character and moral reasoning. You can't compartmentalize. True altruism requires ethical alignment in *both* how you earn and how you give. Systemic critiques might resonate, but the personal corruption angle is primary.

  *   **Mostly C's: The Unnamed Middle Combo (Theoretically Possible, Practically Rare)**
      *   Core Belief: You see *huge* validity in *all* the critiques. ETG has potential but is riddled with pitfalls (substitution, measurement bias, personal corruption, crowding out). Systemic change is vital but slow and hard to influence directly. You're deeply conflicted and probably think the whole debate oversimplifies a messy reality. (Congrats on the nuance! But yeah, this is a tough spot to *live* consistently).

  ---

  **Remember:** These are simplified archetypes. Your views are probably a mix! Use this to pinpoint which arguments resonate most strongly with you and where the friction lies with your friend's perspective. Good luck figuring it out!
