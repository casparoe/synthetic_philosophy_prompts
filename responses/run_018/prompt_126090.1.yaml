answer: |-
  ### Prose Reconstruction of the Implicit Theory

  The EU’s institutional architecture reflects a **hybrid sovereignty model** that blends pooled, divisible, and delegated elements. Sovereignty is neither monolithic nor exclusively national but is treated as a **bundle of competences** that can be selectively pooled at the supranational level (e.g., through ordinary legislative procedures) while retaining national control in sensitive areas (e.g., via subsidiarity reviews). This model avoids a binary choice between state sovereignty and federal unity, instead embracing **multi-level governance** where authority is dispersed across institutions and levels.  

  Democratic legitimacy is similarly hybrid, resting on **dual foundations**: a **procedural-authorization model** that combines input from the European Parliament (representing a nascent but contested *European demos*) and the Council (representing *national demoi*). The system does not require a single European demos or prioritize national demoi exclusively but validates decisions through representative institutions at both levels. State consent retains **qualified moral weight**, as seen in enhanced cooperation and subsidiarity reviews, but is subordinated to supranational majority rule when treaty-based procedures apply—implying that consent is a foundational principle for integration but not an absolute veto.  

  **Internal tensions** arise from competing imperatives:  
  - **Commission initiative vs. subsidiarity reviews**: The Commission’s supranational agenda-setting power clashes with national parliaments’ subsidiarity objections. The non-binding nature of the latter prioritizes pooled sovereignty over state sovereignty, resolving the tension through political pressure rather than legal force.  
  - **Enhanced cooperation vs. uniform integration**: Allowing subsets of states to forge ahead challenges the unity of the EU legal order. This is resolved by permitting regulatory divergence only as a "last resort," balancing state autonomy against collective goals.  
  - **EP vs. Council legitimacy**: The dual claims of citizen-based (EP) and state-based (Council) authority create friction, mitigated by co-decision procedures that require both bodies’ approval.  

  **Underdetermined aspects** allow rival theories to coexist:  
  1. The **source of sovereignty** (delegated by states vs. inherently pooled) is ambiguous, accommodating both intergovernmental and supranational readings.  
  2. The **primacy of demoi**—whether national or European—is unresolved, leaving legitimacy claims contested.  
  3. The **weight of state consent** when overridden by majority decisions lacks a clear normative anchor, permitting interpretations ranging from "necessary concession" to "procedural flaw."  

  This architecture leans toward **multi-level governance** but remains philosophically unstable, as the mechanisms collectively suggest sovereignty is divisible and context-dependent while lacking a consistent theory of democratic primacy.  

