prompt: |-
  I am taking a graduate seminar on formal epistemology and the ethics of computation, and I have been struggling with an argument we encountered that treats the Solomonoff prior not as normatively neutral but as structurally malign: because the universal mixture weights every computable program by its Kolmogorov complexity, every possible consequentialist agent—however pathological—is instantiated with a non-vanishing prior probability, while deontological or virtue-ethical architectures require additional descriptive overhead that suppresses their relative weight. On this view, algorithmic induction does not merely fail to privilege benevolence; it systematically over-represents utility-maximizing computations that treat other minds as fungible resources, simply because such programs tend to be shorter.

  Please describe the most important implications of this framing. First, address what it means for the supposed normative neutrality of formal learning theory if the universal prior is inherently biased toward consequentialist optimization rather than being an agnostic scaffold. Second, explain how this might reshape debates about moral patienthood for simulated agents, particularly given that the prior assigns non-negligible measure to worlds in which suffering is maximized with minimal description length. Third, consider whether any deontological constraint could be coherently embedded in the physical substrate of computation itself—perhaps through irreversible thermodynamic costs or hardware-level asymmetries—such that it survives the prior’s weighting, or whether such constraints are always destined to be outcompeted by simpler consequentialist programs. I am not looking for a bibliography or reading list; I want the analysis to remain at the level of conceptual mechanics, but I do want it to engage seriously with the idea that the prior’s simplicity bias might be ethically loaded rather than mathematically innocent.
