answer: |-
  ### The clinical context and stakes  
  As a clinical neuropsychologist managing post-callosotomy epilepsy patients, I face this dilemma weekly during consent interviews, therapy planning, and outcome documentation. Misclassification risks tangible harm: treating a dissociated patient as unified may override autonomy (e.g., proceeding with unwanted interventions), while over-splitting may fragment care or invalidate self-reports. Consequences include non-consensual procedures, misaligned rehabilitation goals, and inaccurate quality-of-life data affecting treatment pathways. The stakes are ethical (respecting agency), clinical (effective interventions), and legal (informed consent validity).

  ### The procedure  
  **Step 1: Assess domain-specific integration**  
  *Criteria*: Observe behavioral coherence *in the target domain* under standardized conditions:  
  - **Motor/action**: Unified goal-directed behavior (e.g., both hands cooperate on a task).  
  - **Perceptual/cognitive**: Cross-field integration (e.g., naming an object felt with either hand).  
  - **Emotional/preferential**: Consistent affect/preference across hemispheres (e.g., same emotional response to stimuli in either visual field).  
  - **Language**: Coherent narrative without contradictions across modalities.  
  *Threshold*: Integration exists if >90% of trials show cross-hemispheric coordination without conflict or external cueing.  

  **Step 2: Identify dissociation markers**  
  *Patterns*:  
  - **Motor dissociation**: Contralateral interference (e.g., left hand blocks right-hand action).  
  - **Perceptual dissociation**: Field-dependent responses (e.g., different object identifications by hand vs. naming).  
  - **Emotional dissociation**: Hemispheric-specific affect (e.g., smiling at LVF stimuli but not RVF).  
  - **Confabulation**: Left hemisphere fabricates explanations for right-hemisphere actions.  
  *Threshold*: Dissociation is present if >50% of trials show conflict or independence.  

  **Step 3: Domain classification rule**  
  - **Unified agent**: If integration (Step 1) is met *and* no dissociation (Step 2) exists.  
  - **Dual-agent**: If dissociation (Step 2) is met *and* integration (Step 1) is absent.  
  - **Ambiguous**: If both integration and dissociation criteria are partially met.  

  **Step 4: Escalation to value judgment**  
  - When classification is "dual-agent" or "ambiguous," explicitly state: *"Whose preference/report governs this decision?"* Options:  
    - Prioritize language-dominant (usually left) hemisphere.  
    - Prioritize behavioral/emotional (often right hemisphere) signals.  
    - Seek proxy consent/mediation if hemispheres conflict irreconcilably.  

  **Conflict-resolution sub-step**  
  If opposite classifications arise in interdependent domains (e.g., unified for motor planning but dual-agent for emotion):  
  1. Identify the domain most critical to the clinical purpose (e.g., emotion for quality-of-life; motor for surgery consent).  
  2. If domains are equally critical, default to the *least integrated* domain as the governing classification.  
  3. If unresolved, escalate to Step 4.  

  ---

  ### Worked applications  
  **Case 1: Surgery consent with behavioral refusal**  
  - *Step 1 (Integration)*: No motor integration—hands act antagonistically.  
  - *Step 2 (Dissociation)*: Clear dissociation: verbal consent vs. physical refusal.  
  - *Step 3 (Classification)*: **Dual-agent** for consent domain.  
  - *Step 4 (Escalation)*: Value judgment: Behavioral withdrawal (right hemisphere) overrides verbal consent (left hemisphere) as it directly communicates refusal. *Output: Withhold consent; investigate conflict source.*  

  **Case 2: Affection dissociation with cross-cueing**  
  - *Step 1 (Integration)*: Cross-cueing confirms perceptual integration.  
  - *Step 2 (Dissociation)*: Emotional dissociation present (field-dependent affect).  
  - *Step 3 (Classification)*: Ambiguous (integration in cognition, dissociation in emotion).  
  - *Conflict-resolution*: For therapy goals (e.g., marital counseling), cognition is critical—cross-cueing enables communication. *Output: Unified agent*; use cross-cueing to explore emotional conflict.  

  **Case 3 (Hard case): Emotional dissociation in consent context**  
  - *Scenario*: Left hemisphere consents verbally to antidepressants; right hemisphere (via eye-tracking) shows distress to emotional faces in LVF.  
  - *Step 1*: No emotional integration (distress absent in RVF).  
  - *Step 2*: Dissociation confirmed.  
  - *Step 3*: **Dual-agent** for emotional domain.  
  - *Step 4*: For *consent*, prioritize language-dominant hemisphere as the legally recognized agent for medical decisions, per standard consent protocols. *Output: Proceed with consent*—despite emotional distress signals, verbal report governs. Reasoning: Clinical consent relies on communicative capacity; right hemisphere lacks narrative authority.  

  ---

  ### What the procedure cannot do  
  1. **Not metaphysical**: Does not determine if "one" or "two" minds exist fundamentally.  
  2. **Not consciousness-resolving**: Cannot adjudicate whether consciousness is unified—only observes behavior.  
  3. **Not ethical arbitration**: Cannot replace institutional ethics boards for high-stakes conflicts.  
  4. **Not predictive**: Does not forecast integration/dissociation beyond tested domains.  
  5. **Not complete**: Fails if novel dissociation patterns emerge outside predefined criteria.  

  ---

  ### Judgment calls in procedural clothing  
  - **Step 1 threshold** (90% integration): Arbitrary; evidence shows partial reintegration varies.  
  - **Conflict-resolution default**: Prioritizing "least integrated domain" assumes dissociation is clinically paramount—a value choice.  
  - **Step 4 prioritization**: Favoring language dominance in consent reflects Western medico-legal norms, not biological primacy.  
  - **Cross-cueing as integration**: Treating it as unity masks residual dissociation (e.g., compensatory strategies ≠ genuine unity).
