prompt: |-
  I'm a clinical neuropsychologist who assesses patients after total corpus callosotomy for intractable epilepsy, and I repeatedly face the same conceptual problem across consent interviews, rehabilitation planning, and outcome reporting: for any given clinical purpose, do I treat this patient as one conscious agent or as two partially dissociated ones? The philosophical debate about split-brain consciousness and the unity of mind is well known, but I need a reusable decision procedure that my team can run without philosophical training, that respects what the evidence actually shows about cross-hemispheric integration and dissociation, and that does not pretend away the value judgments hidden inside clinical classifications.

  Please write an operational procedure I can apply domain by domain—e.g., informed consent for a new intervention, setting therapy goals, or reporting quality-of-life outcomes—rather than giving a single global verdict about "how many minds" the patient has. The procedure should be ordered in explicit steps: first, observable criteria that establish integration in that specific domain; second, observable patterns that indicate dissociation; third, a classification rule for that purpose; fourth, an explicit escalation point where factual assessment stops and a value judgment about whose preferences or reports should count begins. Include a conflict-resolution sub-step for cases where different domains yield opposite classifications—what I will call domain-relative unity—so that the same patient can be unified for motor planning but not for emotional preference, and say what to do when those domains conflict in a single decision (for example, left-hemisphere narrative consent versus right-hemisphere-controlled behavioral withdrawal).

  Ground the criteria in the actual split-brain phenomena—cross-cueing, left-hemisphere confabulation, right-hemisphere emotional and attentional processing, and asymmetric behavioral control—without requiring citations to specific studies or philosophers. Then apply the procedure step-by-step to three cases:

  1. A patient whose left hemisphere narrates complete recovery and gives verbal consent to further surgery, while the left hand (right-hemisphere controlled) consistently pulls away from the examining table and attempts to block the needle.
  2. A patient who demonstrates flawless cross-cueing for object identification and naming, yet reports warm affection toward a spouse when the face appears in the left visual field and cold indifference when it appears in the right.
  3. A hard case where the procedure should return an answer I will not like—specifically, a situation in which emotional dissociation is clearly present but the procedure directs me to treat that dissociation as non-authoritative for consent, with the reasoning laid out.

  Finally, specify honestly what the procedure cannot do: it cannot determine the metaphysical "true number" of minds present, it cannot resolve whether consciousness is fundamentally unified or plural, and it cannot replace an ethics board. Mark those limits explicitly, and flag every step that is a judgment call dressed up as procedural fact.

  Please organize the response exactly as follows:

  - "The clinical context and stakes" (approximately 150 words): my role, how often I face this, and the concrete consequences of misclassification.
  - "The procedure" (approximately 450 words): the ordered steps, domain-relative classification rules, the conflict-resolution sub-step, and the escalation conditions.
  - "Worked applications" (approximately 450 words): the three cases above, run through the steps with explicit outputs.
  - "What the procedure cannot do" (approximately 150 words): the metaphysical, ethical, and practical boundaries.
  - "Judgment calls in procedural clothing" (approximately 100 words): a brief flag of which steps only look factual.

  Keep the response self-contained: no bibliography, no requests for further reading, no citations by author or date, and no quotation marks around passages taken from real texts. If you need to reference a specific claim about split-brain research, paraphrase it without attribution.
