        - If no: Reject. (Stops here)
     - **Question 1.2:** Does the intervention generate any new suffering that is structurally equivalent (i.e., of similar kind and magnitude) in the same individual or in other individuals/entities? (Empirical and conceptual)
        - Sufficient answer: No, and there is evidence or strong theoretical reason to believe so.
        - If yes: Reject. (Stops here)
        - If uncertain: Flag for further empirical investigation (but note: the procedure must run in 30 min, so if uncertainty is high, it may lead to rejection or handover to human judgment depending on the nature of uncertainty).

  **Step 2: Preserve Meaningful Experience Conditions**
     - **Question 2.1:** Does the intervention destroy or significantly impair any functional capacity that is necessary for the individual's survival, agency, or navigation of the world? (e.g., nociception as a warning system)
        - Sufficient answer: No, or if it does, there is a compensatory mechanism that is equally effective and does not cause suffering.
        - If yes and no compensatory mechanism: Reject. (Stops here)
     - **Question 2.2:** Does the intervention destroy or significantly impair relational capacities (e.g., attachment, empathy, social bonding) that are constitutive of meaningful experiences?
        - Sufficient answer: No, or if it affects them, it does so in a way that does not undermine the possibility of deep relationships.
        - If yes: Reject. (Stops here)

  **Step 3: Avoid Implicit Value Hierarchy**
     - **Question 3.1:** Does the intervention prioritize the elimination of suffering over other values (e.g., autonomy, authenticity, ecological balance) without justification that is internal to the hedonistic imperative? (Conceptual/axiological)
        - Sufficient answer: The intervention does not require such prioritization because it either (a) avoids conflict with these values or (b) the conflict is resolved by the principle itself (but note: the principle does not supply a hierarchy, so (b) is difficult).
