answer: |-
  Here's a systematic disambiguation of the slogan, followed by analysis of the quantum case and the seminar argument's viability. I'll flag where interpretations are textually compelled versus charitably constructed (marked [Text] or [Charity]), and note where tensions reveal foundational problems.

  ---

  ### **Interpretive Menu: Core Dimensions**
  *(Theses are mutually exclusive for clarity; real positions often blend elements)*

  | Thesis Name               | "Ought" Type             | "Credence" Definition             | "Objective Chance" Definition       | Scope & Conditions                  | Synchronic? | Diachronic? |
  |---------------------------|--------------------------|-----------------------------------|-------------------------------------|-------------------------------------|-------------|-------------|
  | **1. Naive Principal Principle [Charity]** | Rational (normative)    | Subjective deg. of belief        | Mind-independent physical propensity | All chancy propositions; conditional on *total* chance theory + admissible evidence | **Yes**     | Implied     |
  | **2. Lewis-Calibrated Rationality [Text+Charity]** | Epistemic rationality   | Calibrated predictive distribution | Best-system physical probability (Lewis) | Only propositions with stable chances; conditional on chance laws + admissible evidence | **Yes**     | **Yes**     |
  | **3. Model-Relative Instrumentalism [Charity]** | Pragmatic success        | Action-guiding weight            | Probability within *accepted* physical model (e.g., QM Born rule) | Only when using that model; conditional on model's truth | **Yes**     | No          |
  | **4. Calibration as Convergence [Charity]** | Rational (long-run)     | Betting disposition              | Long-run frequency / limiting relative frequency | Only repeatable events; conditional on sufficient trials | No          | **Yes**     |
  | **5. Epistemic Chance Reductionism [Charity]** | Rational coherence       | Rational prior over worlds       | Epistemic probability in idealized knowledge state | All propositions; conditional on maximal evidence | **Yes**     | N/A         |

  #### **Key Distinctions:**
  - **Synchronic vs. Diachronic:**  
    Thesis 1,2,3 demand *current* belief-state alignment with chances. Thesis 4 demands *convergence over time*. Thesis 5 treats chance as epistemic, collapsing the distinction.  
  - **Forced by Text:**  
    "Match" suggests synchronicity [Text]. "Objective chances" implies mind-independence [Text], ruling out Thesis 5 as uncharitable.  
  - **Charitable Additions:**  
    Thesis 3 accommodates scientific practice; Thesis 4 avoids synchronic dilemmas; Thesis 2 refines Lewis' view for admissibility.

  ---

  ### **Application to Quantum Tension**
  **Scenario:** Agent knows (A) standard QM (chance = 0.5 for spin-up) and (B) a deterministic hidden-variable (HV) theory fixing the outcome.  

  | Thesis                   | Required Credence | Why?                                                                 | Plausible?                     |
  |--------------------------|-------------------|----------------------------------------------------------------------|--------------------------------|
  | **1. Naive PP**          | **0.5**           | HV knowledge is *inadmissible* evidence for PP—only current chances count | **Incoherent**: Ignores that *determinism* under HV negates "chance" |
  | **2. Lewis-Calibrated**  | **0.5**           | QM is the *best-system* chance law; HV is speculative metaphysics   | **Plausible** if HV is untestable |
  | **3. Model-Relative**    | **0 or 1**        | If agent *uses* HV model, chances reduce to certainties              | **Coherent** but context-dependent |
  | **4. Convergence**       | *Irrelevant*      | Only constrains long-run frequency alignment                         | **Avoids conflict**            |
  | **5. Epistemic Chance**  | Undefined         | Contradictory knowledge (QM + HV) → no "idealized" chance            | **Collapses**                  |

  #### **Tension Analysis:**
  - **Thesis 1 & 2** demand credence 0.5, treating HV knowledge as inadmissible or irrelevant. This risks *rational dogmatism*: an agent with direct evidence of determinism is forced to ignore it.  
  - **Thesis 3** permits credence 1 (if committed to HV) or 0.5 (if committed to QM), but the slogan becomes vacuous—it doesn't specify *which* model to use.  
  - **Core Incoherence:** If HV theories are *possible*, "objective chance" isn't unitary. The slogan assumes chance-fundamentalism (QM chances are *the* physical probabilities), but HV theories deny this. **The tension reveals that the slogan presupposes a specific metaphysics of chance.**  

  ---

  ### **Support for the Seminar Argument**
  The seminar claim—that knowing QM chances *overrides* other internal models—requires:  
  - **Theses 1 or 2**, which demand synchronic matching and treat alternative models as evidentially irrelevant.  
  - **Suppressed Premise:** QM chances are the *only* legitimate physical probabilities (rejecting HV as pseudoscience or metaphysics).  

  **Critical Evaluation:**  
  - **Triviality:** Thesis 3 *only* supports the seminar if we add "and QM is the *correct* model," rendering it circular.  
  - **False/Dogmatic:** Theses 1 & 2 become implausible if HV theories are empirically viable (e.g., pilot-wave). Forcing credence 0.5 while *knowing* determinism is epistemically irrational.  
  - **Best-Supporting Reading:** **Thesis 2 (Lewis-Calibrated)**. It grounds chances in scientific best-systems, dismissing HV as "worse" due to non-locality or complexity. But this is *contestable philosophy*, not a priori truth.  

  ---

  ### **Your Framing: Valid or Confused?**
  - **No Unitary Principal Principle:** Lewis' PP *requires* specifying a chance theory and admissibility. The slogan oversimplifies this.  
  - **Hidden-Variable Injection:** **Coherent only if QM is incomplete** (e.g., epistemic interpretations). In *fundamental* QM (e.g., Copenhagen), HV theories are rejected, making the scenario self-undermining. The slogan works only within a *specific* interpretation of QM.  
  - **Pushback Invitation:** The seminar argument equivocates between:  
    - *Descriptive norm*: "Agents *using QM* should adopt its probabilities." (Trivial)  
    - *Metaphysical imperative*: "QM probabilities are *the* physical chances." (Dogmatic)  
    **Conclusion:** The slogan is either false (if HV is possible) or tautological (if "objective chance" just means "QM probability"). Its rhetorical power stems from masking this ambiguity.

  ---

  ### **Recommendation for Critical Engagement**
  Challenge the speaker to specify:  
  1. Is "objective chance" model-relative or fundamental?  
  2. What evidence counts as "admissible" to override chances?  
  3. Does rational deference require *ignoring* alternative deterministic models?  
  If they reject HV *a priori*, the debate is metaphysical, not about rationality per se. If they accept HV as conceivable, the slogan fails in edge cases. Either way, it cannot "shut down" objections—it *creates* them.
