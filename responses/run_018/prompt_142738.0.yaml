answer: |-
  The airlock hissed open, and Dr. Elara Vance inhaled the scent of Veridia. Green, wet, oxygen-rich – unnervingly like the Oregon coast she’d left six subjective months ago. Her mission: document the Kaelin language. Initial probes indicated near-identical phonetics to English, a bizarre statistical fluke the Linguistics Consortium couldn't ignore. "Parallel evolution of sound," the briefings claimed. Elara, steeped in Putnam, Kripke, and the ghosts of Twin Earth, suspected something stranger.

  Her field lab was a prefab dome overlooking a Kaelin settlement. They were humanoid, bipedal, physiologically congruent with *Homo sapiens*. They spoke. To Elara’s ears, it *was* English. "Welcome, Dr. Vance," said Kael, her liaison, his voice a smooth baritone devoid of accent. "Your dwelling is prepared. We share food at dusk."

  The first dissonance struck that evening. A communal trough held a thick, steaming stew. Kaelin gathered, dipping bowls. A young male, thin and weary, approached, bowl outstretched towards a woman holding a large ladle. She looked him up and down, her face impassive, and deliberately turned away, serving the person behind him. The young male flinched as if struck. Murmurs rippled through the group. Elara heard distinct words: "How cruel." "Unforgivably cruel."

  Elara froze, spoon halfway to her mouth. *Cruel?* The refusal was callous, yes, but *cruel*? Where was the infliction of pain? The malice? She watched the young male slink away, shoulders slumped in profound dejection. The woman who denied him ate calmly, seemingly impervious to the social censure, yet the atmosphere vibrated with disapproval directed solely at *her*.

  Days later, observing a construction site, Elara saw a worker catch his hand between two heavy stone blocks. There was a sickening crunch. He pulled his hand free, fingers bent at unnatural angles. He let out a sharp grunt – more surprise than agony, Elara thought – then calmly walked towards a medic station, cradling the injured limb. No one rushed. No cries of alarm. The foreman barely glanced up. When Elara expressed horror to Kael, he shrugged. "Pain passes. Bone knits. Why fuss? It’s inefficient."

  "But... doesn't it hurt terribly?" Elara pressed.
  "Of course," Kael replied, genuinely puzzled by *her* focus. "But hurt is like weather. Unpleasant, sometimes inconvenient, but morally neutral. To call pain 'cruel'... that makes no sense. Cruelty is a choice against the weave. Like withholding sustenance." He gestured vaguely towards the communal hall where the refusal had happened.

  Semantic externalism, usually an elegant theory about water and aluminum, suddenly felt like a vise tightening on Elara’s mind. Here, the *stuff* the word 'cruel' latched onto wasn't an internal state or a specific physical action, but an external social fact: the deliberate disruption of obligatory sharing networks. The pain, the suffering she instinctively associated with the term, was irrelevant noise to the Kaelin. The *meaning* of 'cruel' was determined not by her private mental dictionary, nor by the phonemes, but by the public practices, the web of norms *out there* in Veridia's social environment.

  The crisis crystallized when she tried to translate Wilfred Owen’s "Dulce et Decorum Est" for her weekly report. The visceral horror: "Bent double, like old beggars under sacks," "Knock-kneed, coughing like hags," "the blood / Come gargling from the froth-corrupted lungs." She wanted to convey Owen’s condemnation of war's *cruelty*.

  But what word could she use? Their 'cruelty' wouldn't stick to the gas attack. Denying food? That wasn't Owen's point. Using the Kaelin word felt like a betrayal, importing an alien concept. Using the English 'cruel' felt hollow, a shell emptied of its essential content – the intrinsic wrongness of inflicted suffering – content absent from Veridia's moral landscape. Which language was she even speaking when she said "cruel" here? Was it still English if the extension was utterly different? The words blurred on her datapad.

  She sought out Tessa, a Kaelin scholar fascinated by Earth concepts. Elara described war, torture, the deliberate infliction of agony for power or ideology.
  Tessa listened intently, her brow furrowed. "This causing of physical pain you describe... it sounds wasteful. Stupid. Counterproductive to societal function. Like smashing tools." She searched for the concept. "But *cruel*? No. Cruelty requires the severing of a bond, the refusal of what is owed. Like a parent refusing milk to a crying infant. *That* is evil. What you describe... it is violent, senseless, perhaps... *brutal*. But cruel? The word doesn't fit." Tessa used the Kaelin word '*brutal*', which seemed to denote extreme, inefficient force devoid of social context, almost like a natural disaster.

  Elara stared out at the Veridian sunset, painting the alien sea in familiar oranges and purples. The physical environment anchored her, a constant. But the social world, the lattice of meaning built upon it, had shifted. Putnam was right, horrifyingly so, for the most intimate words. 'Cruel' wasn't in her head. It was out here, woven into the fabric of Kaelin life, picking out a different set of actions, condemning a different kind of fracture. To use the word here was to point to *their* reality, not hers.

  The realization was isolating. She could describe Kaelin practices, map their lexicon, but the bridge of shared meaning, especially for words heavy with moral weight, was broken. She couldn't *mean* what Owen meant by 'cruel' while standing on Veridia, surrounded by its norms. The external world didn't just reference the word; it *constituted* its significance.

  On her last night, Elara sat in the communal hall. She saw a child snatch another’s bread roll. The victim wailed, clutching their empty hand. The adults nearby tutted, not at the snatcher, but at the victim's noisy display. "Hush," one said gently. "It’s only pain." But then a woman nearby deliberately pulled her own bowl of stew closer, away from a neighbor who had glanced at it hopefully. A ripple of genuine disapproval followed her. "Cruel," someone muttered.

  Elara shivered. The word hung in the air, phonetically identical, achingly familiar, yet utterly foreign. She packed her notes, the untranslatable poem glowing accusingly on her screen. Returning to Earth, she knew, wouldn't erase the dissonance. The old philosophical argument with her roommate wasn't settled; it had become visceral. When she next spoke the word 'cruel,' even under Earth's yellow sun, a part of her would hesitate, listening for the echo of Veridia, wondering where, exactly, the meaning lived.
