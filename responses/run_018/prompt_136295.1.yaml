prompt: |-
  After a long and somewhat circular argument with a friend about whether democratic reform proposals are even internally coherent, I have tried to write down my settled package of views on sortition, term limits, and career politics. I want an audit of whether these hang together. My friend insisted there is a hidden contradiction between my diagnosis of careerism and the remedy I propose, and he also claimed that my acceptance of lot-selection conflicts with my commitment to democratic authorization. I think at least one of the tensions he flagged dissolves once you separate the rationale for limiting terms in elected versus selected bodies, but I am not sure which cracks are real and which are only apparent.

  Here are my commitments:

  A. I support replacing the lower legislative chamber with a standing citizens' assembly selected by lot, structured around rotating deliberative juries of 150 citizens serving staggered four-year terms, with full legislative initiative and no party affiliation—essentially extending the Athenian boule's rotation principle to modern scale.

  B. I reject term limits for elected executives (presidents, governors). They sever the retrospective feedback loop between governance and voter judgment, substituting an arbitrary calendar for democratic accountability.

  C. The corruption of career politics is best understood through the lens of political capitalism—representatives accumulate personal electoral capital that decouples them from constituent interests—rather than as a problem of tenure per se. Therefore the remedy should target capital-accumulation mechanisms, not length of service.

  D. To prevent capital accumulation inside the assembly, members should serve a single, non-renewable twelve-year term, with one-quarter rotating out every three years. This preserves institutional memory without allowing careerism.

  E. Democratic legitimacy requires authorization: citizens must be able to select and remove the specific agents who make binding rules, which can only occur through periodic competitive elections for bodies with lawmaking power.

  F. To preserve authorization without reintroducing careerism, I propose a small, directly elected consent chamber with a suspensive veto and no term limits, serving as the accountable elected agent, while the assembly remains the primary legislator.

  Please audit this package. I do not know where the problems are; I think there may be one serious tension in how I think about tenure versus capital, and another in how I reconcile lot-selection with authorization. I also think my friend was wrong to treat B and D as contradictory, but I want you to confirm whether that pair actually dissolves.

  Specifically:
  1. Go through the commitments pair by pair and identify which are in genuine tension, ordering the real tensions by severity (most damaging first).
  2. For each real tension, specify which commitment has to give, what the cheapest revision is, and what that revision costs.
  3. Identify the apparent tension that dissolves on inspection and explain why.
  4. State which single revision (to one commitment) would clean up the most problems.

  Deliver your response in two parts. First, a concise prose audit addressing the four points above. Second, a structured summary as a JSON object with exactly this schema:

  - "overall_verdict": string summarizing joint tenability
  - "real_tensions": array of objects, ordered by severity rank, each with:
    - "rank": integer
    - "label": string
    - "commitments": array of letters
    - "severity_score": integer 1-5
    - "description": string
    - "cheapest_fix": string specifying which commitment and how
    - "cost": string describing what is lost
  - "apparent_tensions": array of objects, each with:
    - "label": string
    - "commitments": array of letters
    - "why_it_dissolves": string
  - "single_best_revision": object with:
    - "target_commitment": letter
    - "revision": string
    - "tensions_resolved": array of strings (labels)

  Please do not include bibliographies, citations, or reading lists. I want an internal consistency check, not a literature survey.
reasoning: |-
  Hmm, the user is presenting a complex set of political reform proposals and wants me to audit their internal consistency. They've had a circular argument with a friend who sees contradictions in their views on sortition, term limits, and career politics. The user seems intellectually rigorous but frustrated - they've clearly spent time refining these ideas into labeled commitments (A through F) but remain unsure where the real tensions lie.

  Looking at their proposals: They want a citizen legislature by lottery (A) with single long terms (D), while rejecting term limits for executives (B). Their core insight is that careerism stems from "political capitalism" rather than tenure (C). To preserve democratic legitimacy (E), they propose an elected oversight chamber (F). Interesting how they blend ancient Athenian concepts with modern accountability concerns.

  The user specifically asks me to:
  1) Identify real tensions between commitments ranked by severity
  2) Suggest cheapest fixes for each
  3) Explain which apparent tension dissolves
  4) Recommend the single best revision

  I spot two major fault lines immediately. First, between their lot-based assembly (A) and the democratic authorization principle (E) - elections seem necessary for E's "select and remove" requirement. Second, their capital accumulation theory (C) clashes with the assembly's term design (D); if capital comes from re-election incentives, why ban renewal in a non-elected body?

  Ah, the apparent tension between B (no exec term limits) and D (assembly term limits) should dissolve because they govern different selection mechanisms. That makes sense - the rationale differs for elected vs allotted bodies.

  For fixes: The authorization conflict (A vs E) is severe. They could weaken E's requirement or make F stronger, but that costs legitimacy. The capital/tenure conflict (C vs D) might be fixed by shortening the assembly term since capital can't accumulate without re-election anyway.

  The single best revision? Probably modifying E to allow authorization through initial selection mechanisms rather than ongoing electoral control. That resolves the core legitimacy tension while keeping their lottery model intact. It's bold but coherent.

  The user's friend was right about some tensions but wrong about B/D being contradictory. I'll structure this clearly in JSON as requested - they'll appreciate the systematic approach given their evident frustration with circular debates.
answer: |-
  ### Concise Prose Audit

  **Overall Verdict**: The package contains two severe tensions that undermine its coherence, but is salvageable with targeted revisions. The core structure (sortition-based legislature + elected oversight) is workable, but commitments C, D, and E conflict fatally in their current form.

  **Real Tensions** (Ordered by Severity):
  1.  **Severe Tension: Lot-selection vs. Democratic Authorization** (A + E)  
      *Commitments*: A (Citizens' Assembly by lot) and E (Democratic authorization requires citizens to "select and remove" lawmakers via competitive elections).  
      *Severity*: 5 (Fundamental legitimacy conflict).  
      *Description*: Commitment E demands that citizens *elect* lawmakers to authorize them and hold them accountable via removal/re-election. Commitment A replaces the primary lawmaker with an allotted body where citizens neither select specific members nor can remove them. The Consent Chamber (F) authorizes *itself* but not the Assembly wielding primary legislative power.  
      *Cheapest Fix*: Modify E to allow authorization via initial selection *mechanism* (like sortition representing the demos) and accountability via *institutional* means (rotation, oversight by an elected body) rather than requiring individual electoral selection/removal for *all* lawmakers.  
      *Cost*: Dilutes the pure principal-agent electoral authorization model; legitimacy relies more on descriptive representation and institutional design than direct electoral control over legislators.

  2.  **Major Tension: Capital Accumulation Logic vs. Assembly Term Design** (C + D)  
      *Commitments*: C (Corruption stems from "political capitalism" – accumulating personal electoral capital) and D (Single 12-year non-renewable term for allotted assembly).  
      *Severity*: 4 (Undermines the core diagnosis/remedy link).  
      *Description*: Commitment C defines the problem as the accumulation of *electoral* capital through repeated electoral contests and campaigning. Commitment D imposes a term limit designed to prevent capital accumulation *within the allotted assembly*. However, allotted members lack any mechanism (elections, parties) to accumulate *electoral* capital. The term limit (D) thus addresses a problem (electoral careerism) that cannot exist in an allotted, non-elected, non-party body (A). It solves a non-problem while potentially creating new ones (e.g., detachment without accountability).  
      *Cheapest Fix*: Modify D: Remove the single-term limit for the allotted assembly. Rotation (staggered 4-year terms) is sufficient to prevent entrenchment. Alternatively, shorten terms significantly (e.g., 1-2 years) if turnover is the goal, but keep them renewable since "capital" is irrelevant.  
      *Cost*: Abandons the specific remedy (single long term) intended to balance memory and anti-careerism. Requires trusting rotation and the lack of electoral incentives alone prevent problematic entrenchment.

  **Apparent Tension that Dissolves**:
  *   **Label**: Term Limits for Elected vs. Selected Bodies (B vs D)  
      *Commitments*: B (Reject term limits for elected executives) and D (Impose single term limit for allotted assembly).  
      *Why it Dissolves*: The rationales apply to fundamentally different institutions. B's rejection is based on preserving *electoral accountability* for positions where voters have direct retrospective judgment. D's imposition targets *non-elected* bodies where electoral accountability doesn't exist, aiming instead to prevent potential passive entrenchment or detachment within a unique deliberative structure. The mechanisms (election vs. sortition) justify the divergent approaches to tenure. There is no contradiction in having different tenure rules based on selection method and accountability mechanism.

  **Single Best Revision**:
  *   **Target Commitment**: E (Democratic authorization requirement).  
  *   **Revision**: Redefine "authorization" to encompass *initial empowerment* of an institution via a democratic process (e.g., constitutional founding referendum establishing the sortition system) and *indirect accountability* through oversight by an elected body (the Consent Chamber's veto), rather than requiring direct electoral selection/removal of every individual lawmaker.  
  *   **Tensions Resolved**: 
      *   "Lot-selection vs. Democratic Authorization" (A + E) - Makes the sortition assembly compatible with a revised authorization principle.
      *   (Indirectly helps "Capital Accumulation Logic vs. Assembly Term Design" (C + D) by reducing pressure to impose electoral-style remedies like term limits on the non-electoral body).

