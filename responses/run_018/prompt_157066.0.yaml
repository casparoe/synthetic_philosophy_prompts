prompt: |-
  I'm moderating a student colloquium Q&A next thursday and our guest is a philosopher who applies Wittgenstein's private language argument to the hidden-state representations inside large language models. Her view is that the internal vectors of an LLM form something like a private language: they have syntactic structure but no public criteria of correctness, so they can't ground real semantic understanding, and she thinks this actually strenghtens Wittgenstein's original point rather than undermining it.

  I want about eight interview questions that go beyond just having her restate the position. Please include at least one that presses her on how she avoids the standard 'community of users' reply—where the model's outputs are corrected by human feedbak loops—one about what her argument says if we treat the model's weights as part of an extended cognitive system, and one about whether she's commited to saying human infants also start out with a private language before they enter the linguistic community. For each of those three, add a follow-up keyed to her favorite deflection, which is to say 'that's an engineering problem, not a philosphical one'—the follow-up should make it harder for her to hide behind that line and force her back into philosophical territory. Keep the tone conversational but sharp, since the audience is mostly grad students who already know the basic argument and will be bored by generic setup.
