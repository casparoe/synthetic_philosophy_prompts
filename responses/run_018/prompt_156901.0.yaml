  I was arguing with my friends about Aristotle's sea-battle problem and I think I'm mangling the logic pretty bad. So if I understand it right, Aristotle uses the example of a naval battle that might happen tomorrow to deny bivalence for future contingents — like, neither "there will be a battle" nor "there won't" is true right now, because if one was already true then the outcome would be necessary. But then people say this saves contingency and avoids determinism. My question is, if future-tensed statements literally dont have a truth value yet, how does that square with forecasting? When superforecasters build referance classes and talk about base rates for empire collapse or technological change, arent they implicitly assuming there's already a definite fact-of-the-matter about the future? I feel like there's a hidden determinism baked into the outside-view that clashes with Aristotles logic, and maybe we need to correct our forecasting methods if we take the sea-battle argument seriously.

  Please push back hard if I'm mixing up metaphysical openness with epistemic uncertainty — I have a feeling the conflict is mostly in my head. And if the task as posed dont make sense, just say so instead of trying to answer politely.
