answer: |-
  Here’s the gritty, runnable game design you asked for. Tested in my head twice while drafting. Let’s go:

  ---

  ### **Activity: The Trust Tower Game**  
  *Concepts:* Cranes vs. Greedy Reductionism, Explanatory Eviction, Explanatory Residue  

  **Goal:** Feel why greedy reductionism *fails* pragmatically, even if it claims "victory" ontologically.  

  ---

  ### **Materials (Per Group of 3-4):**  
  - **4 Level Cards** (Laminated or thick paper):  
    1. **Neurochemical**: "Dopamine/serotonin systems, stress hormones, neural activation patterns."  
    2. **Evolutionary**: "Kin selection, reciprocal altruism, status-seeking adaptations."  
    3. **Game-Theoretic**: "Tit-for-tat strategies, trust equilibria, cost-benefit calculations."  
    4. **Social-Normative**: "Ritual meaning, communal expectations, symbolic reciprocity."  
  - **1 Scenario Card** (Same for all groups):  
    *"Trust-Circle Ritual: Participants pair up. One is blindfolded and led through an obstacle course by their partner’s verbal guidance. Partners switch roles halfway. Done weekly to ‘build community’."*  
  - **1 Residue Tracker Sheet** (Blank paper for notes)  
  - Markers  

  ---

  ### **Timeline (90 mins total):**  
  1. **Intro & Demo (15 min)**  
     - Explain: *Skyhooks* = magical explanations (banned today). *Cranes* = solid multi-level explanations. *Greedy Reduction* = "It’s *really* JUST the bottom level!" → causes **Explanatory Eviction**: kicking out higher levels, leaving **explanatory residue** (stuff the low-level story can’t predict or guide).  
     - Demo a *crane stack*: Physically stack cards bottom-up (e.g., Neuro → Evo → Game → Social). "Each level *supports* the next."  
     - Demo *greedy reduction*: Slam the bottom card (e.g., Neuro) on top of others. "The rest are *redundant*! ...But write what’s *lost* on your Residue Tracker."  

  2. **Round 1: Build Your Tower (25 min)**  
     - Groups flip coin: Heads = Crane stack, Tails = Greedy Reduction (GR).  
     - **Crane Groups**: Stack cards bottom-up. Explain how levels *build* on each other.  
     - **GR Groups**: "Evict" higher levels. Place your bottom card (e.g., Neuro) on top. **BUT** → List on the Residue Tracker:  
       *"What can the TOP cards (e.g., Social-Normative) still explain/prescribe that your bottom level CAN’T?"*  
       *(Example residue: "How to sanction someone who breaks the ritual," "Why we use blindfolds instead of VR," "Why newcomers feel obligated to reciprocate.")*  

  3. **Round 2: Advice Sprint (20 min)**  
     - Task: *Write bullet-point advice for a newcomer joining the Trust Circle.*  
     - **Crane Groups**: Use all levels freely.  
     - **GR Groups**: You **ONLY** use your bottom-level language (e.g., only neurochemical terms).  
     - **Stakes**: Most "workable/actionable" advice wins design points. Winner picks next week’s topic.  

  4. **Group Share-Out (15 min)**  
     - Each group reads advice + 1 residue note (if GR).  

  5. **Debrief (15 min)**  
     - Map the pain:  
       - *Round 1*: GR groups felt **explanatory eviction** → residue is the "ghost" of the kicked-out level.  
       - *Round 2*: GR groups hit a wall → residue becomes **pragmatic failure**. Can’t generate norms/rules.  
       - Crane groups built **scaffolding** → advice is richer.  
     - Punchline: Greedy reduction isn’t "wrong," it’s *self-sabotaging*. It strips tools we need to navigate the world.  
     - **Honest Limitation**: This shows *pragmatic* failure, not that higher levels are *metaphysically unreal*. (Dennett’s crane still needs them to *do work*!).  

  ---

  ### **What Will Go Wrong (First Run):**  
  - **GR groups will cheat**: They’ll sneak normative language into advice. **Fix**: Roam and enforce "bottom-level ONLY. If you say ‘should,’ I better see serotonin."  
  - **Residue confusion**: Some groups list obvious gaps (e.g., "can’t explain colors") instead of *specific normative/predictive gaps*. **Fix**: Demo with "Why punish cheaters?" as residue.  
  - **Time bleed**: Round 1 runs long. **Fix**: Hard-cut at 20 min with "wrap up now!"  
  - **"But neuro IS everything!" debates**: Shut down metaphysics. Redirect: "Does your *advice work*? No? Then pragmatically, you’re evicted."  
  - **Awkward silences** in GR groups during advice phase. **Good!** That’s the point.  

  ---

  ### **Why It Works:**  
  - GR groups *agonize* trying to translate "be trustworthy" into dopamine surges.  
  - Crane groups smugly write: *"Check if your partner seems stressed (neuro), remember they’ll likely reciprocate (evo), avoid exploiting them (game theory), honor the ritual’s meaning (norm)."*  
  - The residue tracker makes eviction **visible**. The advice round makes it **crippling**.  

  Go crush it. And yeah, let them suffer through greedy reductionism. It’s the only way they’ll feel it in their guts.
