prompt: |-
  I'm writing a profile of a philosopher who works on know-how, and her paper trail is a bunch of case verdicts I want to make sense of before our interview. So far: the concert pianist who loses all her music theory to amnesia but still plays perfectly -- my philosopher says she still knows how to play. The gymnastics coach with a ruined knee who can't do a somersault anymore but can spot exactly what a student is doing wrong mid-air and correct it -- she says he still knows how to somersault. The chick sexer who sorts flawlessly but gives a confidently wrong explanation of what he's looking at -- knows how, she says. The kid who memorized the physics-of-cycling manual, explains countersteering better than anyone, and falls over every single time -- does NOT know how to ride a bike, she says.

  Here's the case I want to put to her: a retired violinist with a spinal injury, hands completely paralyzed, but she can still sit with students and catch every intonation error in real time, hum the exact correction, and tell a student their bow pressure is off before the note even finishes. Does she still know how to play the violin?

  Predict her verdict, tell me what rule her earlier verdicts are running, and -- this is the part I actually need for the profile -- which other rules fit those same four verdicts but come out differently on the violinist. If her verdict on the violinist doesn't pin it down either, what case would?
reasoning: |-
  Okay, the user is writing a profile on a philosopher specializing in know-how, and they're trying to understand her stance through various case verdicts. The cases mentioned—concert pianist, gymnastics coach, chick sexer, and the kid with the manual—all seem to point towards an anti-intellectualist view. That means she doesn't think knowledge-how is just about having propositional knowledge. Instead, it's about ability, even if that ability isn't currently physically executable.

  Now, the user's new case is a retired violinist with paralysis. She can still teach effectively, catching errors and correcting technique. The question is whether she still knows how to play. Based on the earlier cases, the philosopher would likely say yes. The violinist retains the critical ability to detect and correct nuances in playing, which is a core part of her skill. The paralysis prevents physical execution, but her diagnostic and auditory skills show she hasn't lost the know-how. This aligns with the coach who couldn't perform but could still teach.

  The user also wants to know if other rules could fit the initial cases but differ on the violinist. Alternative rules like current physical ability or propositional knowledge would lead to different conclusions. For example, if know-how requires current physical ability, the violinist wouldn't know how, contradicting the earlier verdicts. Similarly, if it's about propositional knowledge, the manual-memorizing kid should know how, but he doesn't.

  The user might need this to highlight the philosopher's unique stance in their profile. They might also want to explore nuances in know-how, like the role of embodied skills versus cognitive understanding. The violinist case tests whether sensory and diagnostic abilities suffice without physical execution. To pin down the theory, a case where someone has the cognitive understanding but no practical ability might help, like the kid who memorized the manual but can't ride. The violinist case could be the counterpoint, showing that practical ability isn't solely physical.

  Underlying needs: The user probably wants to present a comprehensive view of the philosopher's theory, showing its consistency and how it stands against alternatives. They might also seek to engage readers by illustrating abstract concepts with vivid cases. Ensuring clarity on why certain abilities count as know-how despite physical limitations is key. Highlighting the distinction between execution and capacity could be important for the interview questions they plan to ask.
answer: |-
  Based on the pattern of your philosopher's previous verdicts, here's the breakdown:

  1.  **Predicted Verdict on the Violinist:** She **DOES** still know how to play the violin.
  2.  **The Rule Her Verdicts Are Running:** **Know-how is the retained *capacity* to guide successful performance (one's own or another's), based on integrated practical understanding, *even if* current physical execution is impossible or propositional articulation is inaccurate.** The core ability (the "guiding intelligence" of the skill) remains intact.

  **Explanation of the Rule:**

  *   **Pianist:** Lost propositional knowledge (theory), but retained the *practical capacity to guide her own performance* via muscle memory and ingrained technique. The skill itself is still operational.
  *   **Gymnastics Coach:** Lost the physical capacity to *execute*, but retained the *practical capacity to guide and evaluate another's performance*. His understanding of the skill's execution remains intact and functional.
  *   **Chick Sexer:** Lacks accurate propositional knowledge *about* the skill, but possesses the *practical capacity to execute the skill* flawlessly. The guiding know-how is distinct from his ability to describe it.
  *   **Manual-Memorizing Kid:** Possesses perfect propositional knowledge *about* the skill, but utterly lacks the *practical capacity to execute it* or guide his own actions effectively. The know-how is missing.
  *   **Violinist (Prediction):** Lost the physical capacity to *execute*, but retains the *practical capacity to guide and critically evaluate another's performance* in real-time with deep, nuanced understanding. The core violin-playing know-how (intonation, bow control, phrasing understanding) remains functionally present, directing her teaching.

  **Alternative Rules Fitting the First Four Cases but Yielding a Different Verdict on the Violinist:**

  Here's where it gets interesting for your profile, showing competing conceptions of know-how that align with the first four cases but diverge on the violinist:

  1.  **Rule: Know-how requires the *current physical ability to execute the action oneself* (when physiologically possible).**
      *   Fits First Cases:
          *   Pianist: *Can* still play -> Knows how.
          *   Coach: *Cannot* somersault -> Does *not* know how (by this rule).
          *   Wait! This *contradicts* your philosopher's verdict! The coach *does* know how according to her. **Therefore, this rule *does not* fit the first four cases.** It fails immediately on the coach.
      *   *Finding a compatible alternative requires a rule that accepts the coach's case.*

  2.  **Rule: Know-how is the *ability to reliably cause successful performances* (whether by executing oneself *or* by effectively guiding/teaching another to execute).**
      *   Fits First Cases:
          *   Pianist: Causes her *own* successful performance -> Knows how.
          *   Coach: Causes *students'* successful performances through correction -> Knows how.
          *   Chick Sexer: Causes successful sorting -> Knows how.
          *   Manual Kid: Cannot cause successful riding (his own) -> Does not know how.
      *   **Verdict on Violinist (by this rule):** She *can* cause successful performances *in her students* by guiding/correcting them -> **Knows how.** (Same as your philosopher).
      *   *This rule is very close to your philosopher's, likely yielding the same verdict.*

  3.  **Rule: Know-how is *successful dispositional action guidance* – the ability to generate the correct motor commands/action plans *for oneself* in real-time, even if not physically executed.**
      *   Fits First Cases:
          *   Pianist: Generates correct motor commands for playing -> Knows how.
          *   Coach: Presumably *could* still generate the correct motor plan/simulation for a somersault in his mind -> Knows how. (Assumes internal simulation counts).
          *   Chick Sexer: Generates correct motor commands for sorting -> Knows how.
          *   Manual Kid: Cannot generate correct motor commands for riding -> Does not know how.
      *   **Verdict on Violinist (by this rule):** *Crucially Depends on Detail.*
          *   *If* she can still internally simulate/feel the *correct motor commands* for playing (e.g., feeling the finger placement, bow pressure *as if* doing it) when diagnosing, then **Knows how.**
          *   *If* her skill is now purely auditory analysis and conceptual understanding *without* triggering the associated motor simulation/planning, then **Does *not* know how** by this rule. Her know-how has transformed into a different (though related) skill – expert listening/teaching.
      *   *This is a key alternative: it distinguishes between embodied motor simulation guiding action and detached analytical understanding.*

  4.  **Rule: Know-how requires the *integration of propositional knowledge with practical ability*. The chick sexer is a borderline exception due to reliable output, but the violinist lacks the physical component.**
      *   Fits First Cases (Strained for Chick Sexer):
          *   Pianist: Practical ability intact -> Knows how (propositional loss irrelevant).
          *   Coach: Practical ability to *guide* intact -> Knows how (propositional assumed intact).
          *   Chick Sexer: *Practical ability* is so reliable it *overrides* the lack of correct propositional knowledge -> *Knows how* (treated as a special case).
          *   Manual Kid: Propositional knowledge present but *practical ability* absent -> Does not know how.
      *   **Verdict on Violinist (by this rule):** She has propositional/conceptual knowledge *and* practical ability *to teach/listen*, but crucially *lacks the practical ability to play*. Since playing is the core skill, she **Does *not* know how to *play the violin***. She knows how to *teach* violin. (Different verdict).
      *   *This rule prioritizes the specific physical execution as core to the know-how.*

  **Pinning Down the Theory: A Crucial Case**

  The violinist case *could* be ambiguous between your philosopher's view (Knows How - capacity to guide) and the "motor command simulation" view (Knows How only if motor simulation remains). To pin it down, you need a case targeting that distinction:

  *   **The "Pure Auditor" Case:** Imagine a world-class *conducting* coach who was *never* a violinist. Through decades of coaching elite violinists, they develop an extraordinary ability to hear the most subtle intonation errors, bow pressure issues, and phrasing problems instantly. They can diagnose and correct *exactly* like your paralyzed violinist, humming corrections, anticipating errors. However, they have *never* held a violin, cannot simulate the finger movements or bow arm feeling, and couldn't begin to instruct on *how* to physically produce the sound beyond the auditory feedback.
      *   **Your Philosopher's Likely Verdict:** Does **NOT** know how to *play* the violin. They know how to *listen* and *coach* violinists at an elite level. The core *performer's* know-how (the embodied action guidance) is missing.
      *   **Motor Simulation Rule Verdict:** Also **Does NOT** know how to play. Lacks the motor simulation capacity.
      *   **"Cause Success" Rule Verdict:** **Knows how** (to play? or just to coach?) – This rule might blur the line here.
      *   **Why it Pins it Down:** If your philosopher says the *actual* paralyzed violinist *does* know how, but this "Pure Auditor" does *not*, it confirms that *her* know-how attribution relies on the violinist's *prior embodied mastery* still being the source of her diagnostic capacity (retained capacity/motor simulation), not just the auditory skill acquired externally. Her verdict hinges on the know-how being the *same capacity* she once used to play, now redirected into teaching. The Pure Auditor has a different, derivative skill.

  **Summary for Your Profile:**

  *   Your philosopher consistently separates *know-how* (practical capacity/understanding) from both *propositional knowledge* (Chick Sexer, Pianist) and *current physical executability* (Pianist, Coach). The Manual Kid lacks the practical capacity despite propositional knowledge.
  *   She will almost certainly say the **paralyzed violinist *does_ know how to play**. Her skill is intact, manifesting in expert guidance.
  *   Competing views that fit the first four cases but differ include:
      *   **The "Motor Simulation" View:** Might deny know-how if the violinist can't internally simulate playing.
      *   **The "Core Physical Execution" View:** Would deny know-how, saying she only knows how to *teach/listen*, not *play*.
  *   To definitively distinguish her view from the Motor Simulation view, probe with the **"Pure Auditor"** case (never played, expert listener/coach). Her denying know-how there confirms her focus on retained *embodied practical capacity* originating in performance.

  This demonstrates her likely **anti-intellectualist, capacity-based view of know-how**, emphasizing the persistence of practical understanding over propositional articulation or physical ability, but rooted in prior embodied mastery. Good luck with the interview!
