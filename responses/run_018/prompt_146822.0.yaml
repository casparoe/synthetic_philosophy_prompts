answer: |-
  Here is a breakdown of the distinct theses potentially expressed by "words divide, pictures unite" within the context of Neurath's ISOTYPE and unified science project. I've evaluated each for triviality, defensibility within Neurath's framework, truth status, and relevance to replacing verbal protocol sentences, adhering to your request for a "menu" approach and distinguishing established from contested scholarship.

  **Key Neurathian Context (Established):**
  1.  **Physicalism:** Science is unified by describing everything in spatio-temporally locatable, intersubjectively observable terms ("thing-language").
  2.  **Protocol Sentences:** These are the foundation of science, recording basic observational experiences. Neurath **insisted these be linguistically formulated** (e.g., "Otto's protocol at 3:17: [Otto observes a red triangle at location L]").
  3.  **The "Boat":** Science is like a ship already at sea; we rebuild it plank by plank using available materials (current language, concepts), never starting from an indubitable foundation.
  4.  **ISOTYPE's Primary Aim:** Pictorial statistics for **social education and democratic communication**, not as a replacement for the language of scientific theory or protocols.
  5.  **Language Ambiguity:** Neurath acknowledged natural language's ambiguity but saw it as **manageable through practice, convention, and the physicalist constraint**, not eliminable.

  **Interpretations of the Maxim & Their Evaluation:**

  1.  **Thesis: Semantic Determinacy**
      *   **Claim:** Pictorial symbols (like ISOTYPE pictograms) inherently possess less ambiguity and more fixed, precise meanings than verbal language. Words are vague and context-dependent; pictures are direct and unambiguous representations.
      *   **Trivially True?** No.
      *   **Substantive & Defensible in Neurath's Framework?** **Contested, but leaning No.** Neurath acknowledged *some* pictorial advantages in *specific contexts* (like counting identical objects), but he was acutely aware that pictures also require interpretation and convention (e.g., what *exactly* does a generic "worker" pictogram denote? Scale? Perspective? Context matters hugely). His "boat" metaphor implies all symbols, pictorial or verbal, are somewhat fluid and rely on social practice. He wouldn't grant pictures inherent, absolute determinacy.
      *   **False?** **Often Yes, if claimed absolutely.** Pictures *can* be highly ambiguous (e.g., abstract art, complex diagrams). ISOTYPE sought *standardisation* to *reduce* ambiguity, not eliminate it magically.
      *   **Supports Replacing Verbal Protocols?** **Minimally/No.** While standardised pictograms *might* reduce *some* ambiguities for *very simple* observations (e.g., "5 chairs present"), they cannot capture the nuanced spatio-temporal specifications ("Otto's protocol at 3:17...") or complex relational states required by Neurath's protocol sentences. The claim overstates pictorial determinacy.

  2.  **Thesis: Cross-Linguistic/Cultural Portability**
      *   **Claim:** Pictures bypass the barriers of specific verbal languages and cultural connotations. A well-designed pictogram can be understood by people speaking different languages, fostering universal communication where words create divisions.
      *   **Trivially True?** **Yes, in a limited sense** (pictures don't rely on specific phonemes/grammar).
      *   **Substantive & Defensible in Neurath's Framework?** **Yes, substantively and defensible (for ISOTYPE's purpose).** This was a *core goal* of ISOTYPE – creating a "world language without words" for social facts. Neurath championed international communication and saw pictorial statistics as a powerful tool for democratic education across cultures. He believed standardised visuals *could* overcome linguistic divides *for conveying certain types of statistical information*.
      *   **False?** **No, this is well-established as a relative strength**, though not absolute (cultural interpretation of symbols can still vary).
      *   **Supports Replacing Verbal Protocols?** **Partially, but insufficiently.** While strongly supporting ISOTYPE's *educational* role and potentially aiding *communication* *of results*, it doesn't address the core requirements of protocol sentences (precise spatio-temporal indexing of an observer's experience). Portability doesn't equate to the logical structure or indexicality needed for foundational protocols within the "boat".

  3.  **Thesis: Reduced Emotional/Metaphysical Loading ("Objectivity")**
      *   **Claim:** Words carry heavy emotional baggage, cultural biases, and metaphysical assumptions. Pictures, especially schematic ones like ISOTYPE, are more neutral, objective, and tied directly to observable physical reality, avoiding the "divisions" caused by loaded terminology.
      *   **Trivially True?** No.
      *   **Substantive & Defensible in Neurath's Framework?** **Yes, substantively and defensible (as a comparative advantage, not absolute).** Neurath was deeply suspicious of metaphysical language and sought a "neutral" physicalist basis. ISOTYPE's simplified, standardised forms were designed to strip away ornamentation and focus on quantifiable, observable facts, aligning with his desire for clarity and anti-metaphysics. He believed this made social facts less prone to ideological distortion than verbal descriptions.
      *   **False?** **Not entirely, but overstated.** Pictures *can* be highly emotive and culturally loaded (e.g., religious icons, propaganda posters). ISOTYPE aimed for neutrality but wasn't immune to interpretation or design choices implying value.
      *   **Supports Replacing Verbal Protocols?** **Weakly/Potentially.** Reducing metaphysical loading aligns with Neurath's physicalism. If pictures *could* somehow capture the required protocol content *more* neutrally than words, it *might* be an argument. However, the core indexical structure ("Observer X at time T...") seems inherently verbal/conceptual. Pictures alone struggle with this modality.

  4.  **Thesis: Superior Logical Syntax for Science**
      *   **Claim:** Pictures (or a formal visual notation) can provide a more rigorous, unambiguous logical structure than natural language, better suited for the precise formulation of scientific statements and inferences, overcoming the "divisions" caused by natural language's messy syntax.
      *   **Trivially True?** No.
      *   **Substantive & Defensible in Neurath's Framework?** **Contested, but likely No.** While Neurath valued clarity and intersubjectivity, his view of language was pragmatic and holistic ("boat"). He rejected Carnap's pursuit of a single ideal logical syntax, favouring the flexible, evolving "universal slang" of unified science based on physicalist thing-language. ISOTYPE was not designed as a *logical* syntax; it was for statistical *representation*. Neurath saw natural language, *disciplined by physicalism and scientific practice*, as sufficient and necessary for the complex task of building science.
      *   **False?** **When applied to ISOTYPE or Neurath's context, largely Yes.** ISOTYPE lacks the combinatorial power and expressive range needed for scientific syntax. No visual system proposed in his circle achieved this.
      *   **Supports Replacing Verbal Protocols?** **No.** Neurath explicitly insisted protocol sentences be *linguistic*. He saw the logical structure needed as embedded within the evolving practice of linguistic science, not requiring replacement by a formal (visual or symbolic) syntax.

  5.  **Thesis: Pedagogical/Communicative Efficacy**
      *   **Claim:** Pictures are fundamentally easier to understand, remember, and engage with for conveying certain types of information (especially quantitative, comparative, spatial), especially for non-experts, thereby "uniting" a broader audience where complex verbal explanations "divide".
      *   **Trivially True?** **Largely Yes** for the types of data ISOTYPE handled (statistical distributions, comparisons). Well-established by visual cognition research.
      *   **Substantive & Defensible in Neurath's Framework?** **Yes, substantively and core to ISOTYPE's purpose.** This was Neurath's *primary* justification for ISOTYPE – its power for "visual education" and democratic dissemination of social knowledge. It perfectly aligned with his encyclopedist, socially engaged view of science.
      *   **False?** **No, this is well-established as ISOTYPE's strength** within its intended domain.
      *   **Supports Replacing Verbal Protocols?** **No.** Efficacy in *teaching results* or *communicating findings* is irrelevant to the *formulation of the foundational observational records* (protocols) within the scientific process itself. Neurath kept these domains distinct.

  6.  **Thesis: Direct Replacement for Verbal Protocol Content**
      *   **Claim:** The content of protocol sentences (basic observational reports) can be fully and adequately captured, even better captured (due to 1-5 above), by a pictorial or visual notation, rendering verbal formulation unnecessary or inferior within the physicalist system. Words divide observers; pictures unite them on the common ground of perception.
      *   **Trivially True?** No.
      *   **Substantive & Defensible in Neurath's Framework?** **Philosophically substantive, but definitively No and contrary to Neurath's explicit position.** This is the core argument the maxim is sometimes deployed for. However, Neurath consistently maintained protocol sentences must be *linguistic*. Reasons include:
          *   **Indexicality:** Protocols require reference to the *observer*, *time*, and *place* ("Otto at 3:17..."). This self-referential, indexical structure is highly verbal/conceptual; pictures struggle immensely with this.
          *   **Complexity & Modality:** Observational reports often involve relations, dispositions, absences, or modal qualifiers ("seems like", "appears red") hard to depict unambiguously.
          *   **The "Boat":** Science rebuilds using existing linguistic tools; replacing its foundational layer with an entirely different symbolic system is impractical and ignores the holistic, social nature of scientific language.
          *   **Physicalism is Linguistic:** Neurath's physicalism was about the *content* (spatio-temporal things) expressed *in language*. The medium for expressing and debating that content was inherently linguistic for him.
      *   **False?** **Yes, within Neurath's framework.** He explicitly and repeatedly rejected this.
      *   **Supports Replacing Verbal Protocols?** **This *is* the replacement thesis. Neurath firmly rejected it.**

  **Conclusion on Displacing Verbal Protocols:**

  *   **Interpretations Supporting Displacement:** Only the **Direct Replacement Thesis (6)** directly argues for displacing verbal protocols. However, it is **philosophically substantive but demonstrably false and indefensible within Neurath's own explicit framework and commitments.** He saw linguistic formulation as non-negotiable for protocols.
  *   **Interpretations *Not* Supporting Displacement:** Theses 1-5 offer potential advantages for visuals (especially 2 & 3 for ISOTYPE's public role, 5 for pedagogy). While **Cross-Linguistic Portability (2)** and **Reduced Emotional Loading (3)** have the strongest claim to being substantive and defensible *within Neurath's framework for communication and education*, they **do not provide sufficient grounds to replace the linguistic form of protocol sentences.** Neurath viewed protocol sentences as serving a distinct foundational epistemological function within the scientific "boat," requiring linguistic expression for indexicality, complexity, and integration with the existing structure of science. The maxim's other plausible interpretations either overstate the case (1), are irrelevant to protocols (4, 5), or are outright rejected by Neurath (6).

  **Scholarly Note on Contestation:**
  *   **Established:** Neurath's insistence on linguistic protocols, ISOTYPE's primary role in public education/social reform, and Neurath's physicalism are well-established.
  *   **Contested:** The *extent* to which Neurath might have seen visuals playing a role *within* scientific practice *beyond* education (e.g., as heuristic aids or components of encyclopedias alongside text) is debated. Some scholars argue his later work suggests a more integrated view, though still never replacing linguistic protocols. Whether his pragmatism about language *could* theoretically accommodate non-linguistic elements in *some* future scientific roles remains a speculative philosophical question, not an interpretation of his stated position. This response reflects the consensus that he explicitly rejected replacing linguistic protocols with pictures.
