prompt: |-
  I'm a science and ideas journalist putting together a long feature on Montaigne's essay Of Cannibals and why philosophy tutors still argue over it in seminars. There's this niche conceptual knot I keep coming back to: Montaigne builds a mirror between Brazilian cannibals and European executioners — both practise ritual killing for honour, both deal in human flesh in some form, yet only one side gets branded barbaric. I want to push past the usual "he's just being a cultural relativist" take and dig into a stricter problem. Give me an example of a conceptual issue that arises if we take that mirror literally but then inject modern instutional framing — imagine the Europeans carry out their executions through formal legal consent and fully documented proceedural safeguards, while the cannibal rites happen with no state-backed legitimacy whatsoever. Does the symetry collapse, or does it reveal that our charge of "barbarism" tracks procedural form rather than the actual harm being done? I'm after a sharp conceptual example showing exactly where descriptive cultural relativism slips into normative moral pluralism, without any need for citations or a bibliography. Please finish with a one-sentence summary of your core point on its own line at the bottom.
reasoning: |-
  Okay, let me unpack the journalist's request. They're working on a feature about Montaigne's "Of Cannibals" and want to explore a specific conceptual knot - the mirror between Brazilian cannibals and European executioners. The key is moving beyond simple cultural relativism to examine what happens when modern institutional frameworks are applied to this comparison.

  Hmm, the core tension here seems to be between procedural legitimacy and perceived barbarism. The journalist wants to test whether Montaigne's symmetry collapses when we introduce concepts like state authorization, documented consent and legal safeguards for European executions versus the "illegitimate" cannibal rites. That's a really sharp angle - it forces us to question whether our moral judgments track actual harm or just institutional packaging.

  I recall Montaigne's central move: reframing European practices as equally strange when viewed from outside. His cannibals represent a thought experiment about cultural perspective. The journalist's proposed modern twist - adding bureaucratic scaffolding to executions - brilliantly exposes how we naturalize violence through institutional rituals.

  Let me construct that conceptual example they requested. Imagine two scenarios: First, a state execution where every procedural box is checked - warrants, appeals, official witnesses. Second, a cannibal ritual where consent is communally understood but never individually documented. The harm - killing a human - is identical, yet we instinctively view the first as "civilized" and the second as "barbaric." This reveals how institutional theatre transforms moral perception.

  The deeper philosophical slip happens when we mistake descriptive relativism (understanding different practices in context) for normative pluralism (claiming all practices are equally valid). The institutional lens makes this slip visible: we're so conditioned to respect state authority that we overlook identical harms performed without its seal of approval.

  For the one-sentence summary, I need to crystallize this into a dagger-like point. Something about barbarism being a judgment of form rather than substance... yes: Our designation of barbarism tracks the absence of institutional ritual, not the presence of harm.
answer: |-
  Here's a conceptual issue arising from injecting modern institutional framing into Montaigne's mirror, focusing on the point where description slides into contested normativity:

  **Conceptual Knot:** **Does institutional legitimacy transmute the moral substance of an act, or merely its social perception?**  

  **The Example:**  
  Imagine the European execution: meticulously documented, following codified laws debated by a legislature, reviewed by independent courts, requiring multiple signatures of consent from officials, witnessed by accredited professionals, and performed by state-certified agents using calibrated instruments. Every procedural safeguard is demonstrably met.  

  Now imagine the Tupinambá ritual killing: a warrior captured in intertribal warfare, integrated into the community for months or years, granted relative freedom but understanding his eventual fate, participating in preparatory rituals acknowledging his role, and finally killed and consumed in a ceremony imbued with cosmological significance and communal consent (as understood within their framework). There is no written code, no external appellate review, no state bureaucracy documenting consent – legitimacy stems entirely from tradition and internal social cohesion.  

  **The Collapse (or Revelation):**  
  1.  **The Symmetry of Harm:** The core physical act – the intentional killing of a human being – remains identical. The victim dies.  
  2.  **The Procedural Chasm:** The modern institutional framework creates an *overwhelming appearance* of rationality, control, justice, and minimized arbitrariness. It generates voluminous paperwork *asserting* legitimacy and consent. The Tupinambá rite lacks these specific, externally verifiable, state-sanctioned signifiers.  
  3.  **The Conceptual Issue:** If we accept Montaigne's descriptive mirror (both groups kill for reasons of honour/order within their worldview), but then declare the European act fundamentally *different* and morally permissible *solely* because of its institutional scaffolding, we face a problem: **We are privileging the *form* and *source* of legitimacy (state procedure) as the primary determinant of moral permissibility, effectively decoupling it from the inherent moral weight of the act itself (killing a person).**  

  **Where Relativism Slips into Pluralism:**  
  *   **Descriptive Relativism:** Acknowledges that the Tupinambá see their act as honourable/necessary, and the Europeans see theirs as just/necessary, based on their respective cultural contexts. This is observing the mirror.  
  *   **Normative Moral Pluralism (The Slippage):** Injecting the institutional frame and then arguing that the European act *is* morally acceptable *because* of its procedures, while the Tupinambá act *is* barbaric *because* it lacks them, moves beyond description. It implicitly asserts:  
      *   That state-derived, procedurally complex, documented legitimacy is an *objectively superior* (or even necessary) basis for justifying killing.  
      *   That forms of social consent, cosmological justification, and traditional legitimacy inherent to the Tupinambá framework are *inherently insufficient* or irrelevant to the moral calculus.  
      *   That the harm itself is secondary; the primary moral factor is *how* the harm is administratively packaged and authorized by a recognized sovereign power.  

  **The Sharp Point:** The example reveals that declaring the European act "civilized" and the Tupinambá act "barbaric" under these conditions isn't primarily a judgment about the act of killing or its purpose (honour/order). Instead, **it's a judgment that implicitly elevates the modern Westphalian state's bureaucratic and legalistic *methods* of authorizing violence to the status of a universal moral standard.** The charge of "barbarism" tracks the absence of *our specific institutional rituals*, not the presence of harm or the underlying concept of socially sanctioned killing for collective reasons.  

  **Core Summary:**  
  Our condemnation of "barbarism" often targets the lack of familiar institutional ritual surrounding an act, not the act's inherent moral substance.
