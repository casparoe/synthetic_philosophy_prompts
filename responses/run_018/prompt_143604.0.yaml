  Compare the old heterogeneity problem for hedonism—like what do eating good food and solving a hard proof really have in common?—with what I'd call the mirror-image problem for value pluralism. The mirror-image idea is: if pleasures are too different to share one intrinsic value feature, then pluralist goods (knowledge, friendship, aesthetic awe) are probly just as scattered, so the pluralist can't claim they've got genuinely unified categories either. Compare the hedonist reply that phenomenal intensity is the shared thread with the pluralist reply that each good carries its own domain-specific excellence that doesn't need cross-domain sameness. Which reply is stronger, and does the mirror problem actually hurt pluralism or just force both sides to accept a looser idea of shared properties? Answer in continuous prose only—no headings, no bullet points, no bold, just straight text like you'd write in a letter. Make sure you actually reach a verdict rather than sitting on the fence.
