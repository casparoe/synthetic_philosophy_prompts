prompt: |-
  I'm putting together the wall-text and audio script for a small rotating museum exibit on 19th-century port labor disputes, and I've been going back and forth with a friend who's in a grad historiography course. She keeps saying our captions are either pretending to be pure Ranke-style "show it as it actually happened" or they're sneaking in Hayden White-style emplotment without admitting it, and Carr's point about selection being driven by present concerns just makes it worse. I need something I can actually use, not more seminar talk. Can you write me a reusable decision procedure—like a checklist or flowchart in words—that a non-academic staffer can run on each panel or caption in about five minutes? It should be grounded in Ranke's idea of describing events as they actually occurred versus Carr's argument that historians necessarily select and arrange facts according to present questions versus White's claim that every narrative forces events into an underlying plot form like romance, tragedy, comedy, or satire. But I want it operationalized: the exact sequence of questions to ask, what counts as a passing answer at each gate, where the procedure says "rewrite this," where it says "flag for the curator because this is values not facts," and where it just stops because Ranke and White genuinely conflict and there's no procedural fix.

  The procedure needs to handle hard cases my team will actually face: a panel that quotes a striker's letter but frames the strike as a tragic defeat even though the letter itself never mentions defeat; a caption that leaves out that the police chief was also a factory shareholder because "it complicates the story"; and a timeline entry that calls a negotiation "inevitably collapsing," which is interpretation dressed up as chronology. Then apply it to three worked examples: one where the procedure forces us to drop a dramatic framing we'll miss, one where it lets through a selection that looks like bias but is defensible under Carr's framework, and one where it hits the "get the curator" wall. Also tell me explicitly what the procedure can't catch—maybe stuff about visual layout, visitor prior knowledge, or audio tone? And please write the answer in American English; it's definatley not an academic paper, I'm just trying to stop my coworker from rolling her eyes at me every time we hang a new panel.
reasoning: |-
  Okay, the user is working on a museum exhibit about 19th-century port labor disputes and is caught in a debate with a friend about historiography. They need a practical tool, not academic theory, to ensure their captions are balanced. The friend mentioned Ranke, Carr, and Hayden White—so the user is dealing with the tension between presenting facts objectively versus the inevitable selection and narrative shaping of history.

  The user wants a step-by-step procedure that non-academic staff can use in about five minutes per panel. They need clear questions, decision points, and actions like rewriting or flagging for the curator. Hard cases include emotional framing without evidence, omitting complicating facts, and interpretive language in timelines. Worked examples are requested to show the procedure in action.

  First, I should outline a checklist that addresses each historiography angle. Ranke's "show it as it actually happened" requires checking for unsupported claims. Carr's point about selection means asking why certain facts are included or excluded. White's emplotment involves identifying hidden story arcs like tragedy or comedy. The procedure must be actionable: specific questions, pass/fail criteria, and clear next steps.

  For the hard cases: 
  - A striker's letter framed as tragic defeat: the procedure should flag the added emotion not in the source.
  - Omitting the police chief's shareholder role: this is problematic under Carr if it simplifies the story unjustly.
  - "Inevitably collapsing" in a timeline: this is interpretive language that needs rewriting.

  The worked examples need to illustrate tough choices: dropping dramatic framing (shows Ranke's priority), defending selective inclusion (Carr's allowance), and hitting a curator-level conflict (Ranke vs. White irreconcilable). Also, note limitations like visual layout or tone, which the procedure can't catch.

  User's deeper needs: They want to avoid academic debates but ensure credibility. The tool should empower staff, reduce subjectivity, and prevent eye-rolls from the friend. Emphasize practicality—American English, no jargon. Make sure it's reusable and quick. The curator flag is crucial for values vs. facts disputes. Highlighting limitations upfront builds trust that the tool isn't overpromising.
answer: |-
  Here's a battle-tested decision procedure designed for museum staff, grounded in historiography but stripped of seminar jargon. Think of it as a **Three-Filter Fact Check** to catch Ranke violations, Carr bias, and White emplotment. Each filter has specific questions, pass/fail criteria, and clear actions.

  **The Three-Filter Fact Check Procedure (Per Panel/Caption/Audio Script Segment):**

  **FILTER 1: THE RANKE TEST (What Actually Happened?)**
  *   **Question 1:** Does every factual claim (dates, names, events, quotes) have a specific, verifiable primary source (document, artifact, reputable contemporary account) cited or readily available in our research file?
      *   *PASS:* Yes, source is clear/available.
      *   *FAIL:* No source, source is vague ("historians believe..."), or source is secondary/interpretive *for this specific claim*.
  *   **Question 2:** Does the language present inferences, interpretations, emotions (e.g., "tragic," "heroic," "inevitable," "devastating") or future outcomes *as if they are established facts* witnessed at the time?
      *   *PASS:* Language sticks to observable actions/statements or uses clear attribution ("The striker *wrote* he felt betrayed...").
      *   *FAIL:* Language presents interpretation as fact ("The betrayal was devastating," "The defeat was tragic," "Negotiations inevitably collapsed").
  *   **ACTION:**
      *   PASS both? Move to Filter 2.
      *   FAIL Q1? **REWRITE:** Add source citation or remove/qualify the unsupported claim.
      *   FAIL Q2? **REWRITE:** Remove the interpretive language OR reframe it with clear attribution ("*Striker John Doe later described the event as a tragic defeat in his memoir*") OR replace it with observable fact ("*The strike ended without achieving its core demands*").

  **FILTER 2: THE CARR TEST (Why This/Not That?)**
  *   **Question 3:** Is a specific, significant, *relevant* fact omitted that a well-informed visitor would reasonably expect to see *for understanding this specific event* (e.g., police chief was a shareholder, competing union faction existed, economic context)?
      *   *PASS:* Omission is minor, irrelevant to *this panel's specific focus*, or would overwhelm the core message without adding crucial understanding. *OR* the omitted fact is covered adequately elsewhere in the exhibit.
      *   *FAIL:* Omission significantly simplifies the story, hides potential bias/motivation, or distorts the visitor's understanding of *this specific event or actor*. (e.g., Omitting police chief's conflict of interest).
  *   **Question 4:** Does the selection/exclusion of facts feel primarily driven by making the story simpler, more dramatic, or aligning with a modern political/social view *rather than* accurately representing the complexity of the past event based on our sources?
      *   *PASS:* Selection focuses on core, verifiable events/actors relevant to the panel's specific topic, even if complex. Modern relevance is implicit or explained neutrally ("*This dispute highlights tensions also seen today regarding...*").
      *   *FAIL:* Selection clearly twists the past to fit a neat modern narrative ("workers good, owners bad" or vice-versa) or avoids complexity solely for simplicity ("it complicates the story").
  *   **ACTION:**
      *   PASS both? Move to Filter 3.
      *   FAIL Q3 or Q4? **FLAG FOR CURATOR:** Explain *why* the omission or selection pattern feels problematic under Carr (distortion, oversimplification, modern bias). The curator decides: Add the fact (rewrite), add context elsewhere, or justify the exclusion as necessary for *this* panel's scope.

  **FILTER 3: THE WHITE TEST (What's the Hidden Story Shape?)**
  *   **Question 5:** Does the language or sequence *implicitly* force the event into a classic story shape? Listen for:
      *   *Tragedy:* Inevitable downfall, noble struggle against impossible odds, fate, loss, despair.
      *   *Comedy:* Misunderstanding resolved, harmony restored, happy ending, folly exposed.
      *   *Romance:* Heroic triumph over adversity, good vs. evil, clear victory, overcoming obstacles.
      *   *Satire:* Folly, hypocrisy, irony, criticism of institutions/people, absurdity.
  *   **Question 6:** Is this plot structure *directly supported* by the primary sources *from the participants' perspectives at the time*, or is it an *interpretation* layered on by us later?
      *   *PASS:* The plot structure is either absent OR it emerges clearly *from* the quoted sources/described actions without heavy editorializing. *OR* the structure is explicitly presented as *one possible interpretation* ("*Some historians view this strike as a tragic defeat...*").
      *   *FAIL:* The plot structure is imposed by *our* language/framing (e.g., calling strikers "doomed heroes," negotiations "farcical," outcome "poetic justice") and isn't the dominant narrative from contemporary sources.
  *   **ACTION:**
      *   PASS Q6? **APPROVED.** Even if a structure is detectable (Q5), it passes if it's source-driven or explicitly framed as interpretation.
      *   FAIL Q6? **REWRITE:** Remove the imposed plot language. Reframe to describe actions/outcomes neutrally. If a structural interpretation is crucial, explicitly signal it ("*Many workers *saw* their struggle as a tragic fight against powerful forces*").
      *   **RANK-WHITE CONFLICT WALL:** If you have *strong contemporary sources* clearly expressing a tragic/romantic/etc. view *and* our text accurately reflects *that contemporary view*, it PASSES Ranke *and* might exhibit White emplotment. This is **OKAY.** White argues it's *always* there; Ranke wants the past's own voice. If it's the *past's* emplotment (via sources), it passes Filter 3. Only impose *our* emplotment fails.

  ---

  **Applying the Procedure to Your Hard Cases:**

  1.  **Striker's Letter Framed as Tragic Defeat:**
      *   **Filter 1 (Q2):** FAIL. The letter doesn't mention defeat/tragedy; the *framing* adds this interpretation as fact. **REWRITE:** Remove "tragic defeat." Describe the outcome neutrally ("The strike ended without its demands met"). *Option:* Add a quote *from the letter* expressing the striker's *own* feelings if they *are* despairing.
  2.  **Omitting Police Chief/Shareholder:**
      *   **Filter 2 (Q3):** FAIL. This is highly relevant to understanding potential bias in police actions during the dispute. **FLAG FOR CURATOR.** Justification needed for omission, or rewriting required to include it.
  3.  **"Inevitably Collapsing" Negotiation:**
      *   **Filter 1 (Q2):** FAIL. "Inevitably" is an interpretation presented as fact. **REWRITE:** "Negotiations collapsed" or "Negotiations failed to reach an agreement."

  ---

  **Worked Examples:**

  1.  **Example: Forces Dropping Dramatic Framing (Ranke Fail)**
      *   **Draft Caption:** "The desperate workers, facing starvation wages, launched their brave but ultimately doomed strike on March 15th."
      *   **Filter 1 (Q1):** PASS (Date is likely sourced).
      *   **Filter 1 (Q2):** FAIL ("desperate," "starvation wages" - unless sourced from worker petitions; "brave," "doomed" - interpretation as fact). **REWRITE:** "Workers, protesting wages they stated were insufficient, launched a strike on March 15th."
      *   *Why it hurts:* It loses the emotional punch but gains accuracy. The emotion can be reintroduced *through* sourced quotes.

  2.  **Example: Defensible Selection Under Carr (Carr Pass)**
      *   **Draft Panel:** Focuses *only* on the actions of the longshoremen's union during a specific 3-day pivotal riot. Does *not* mention the smaller scab union or the mayor's political ambitions.
      *   **Filter 2 (Q3):** PASS (Omissions are arguably outside the *tight focus* on the longshoremen's actions *during those 3 days*. Including them might distract from the core narrative of *their* experience in the riot, which is the panel's stated topic). **APPROVED.**
      *   *Why it's okay:* Carr acknowledges necessary selection. If the *scope* is narrow and clearly defined, omissions within that scope can be justified. Ensure other panels cover context/scab union/mayor.

  3.  **Example: Hits the "Get the Curator" Wall (Carr Fail - Values)**
      *   **Draft Caption:** "The company's refusal to bargain in good faith exemplified the cold indifference of industrial capitalism to human dignity."
      *   **Filter 1 (Q1/Q2):** FAIL ("good faith" is interpretive; "cold indifference," "human dignity" are strong value judgments presented as fact).
      *   **Filter 2 (Q4):** FAIL (Clear modern framing painting capitalism as inherently immoral; simplifies complex motivations). **FLAG FOR CURATOR.** This is heavy interpretation/value judgment. Can it be replaced with observable facts? ("The company rejected all union proposals without counteroffer, stating they considered wages fair.") Or does the curator want this explicit critique? *This is where institutional voice/mission matters.*

  ---

  **What This Procedure CAN'T Catch (Be Aware!):**

  1.  **Visual Framing:** A tragic quote placed next to a somber image of poverty *creates* tragedy, even if the text is neutral. The procedure only checks text/audio.
  2.  **Audio Tone:** A neutral script read with a sarcastic or mournful tone in the audio guide imposes emplotment.
  3.  **Visitor Prior Knowledge:** Assumptions about what visitors know (e.g., what "scab" means, basic labor history) can create bias or confusion the procedure won't flag.
  4.  **Overall Narrative Arc:** While it checks individual panels, the *cumulative effect* of the *entire exhibit* might create a strong Romance (workers' struggle!) or Satire (greedy bosses!) that individual panels pass. This needs holistic review.
  5.  **Omission of Broader Context:** Carr Filter catches omissions *relevant to the specific event*. It won't catch failing to mention *decades* of prior labor peace, or global economic trends, if the panel is narrowly focused. This needs broader exhibit planning.
  6.  **Subtle Word Choice:** "Demanded" vs "Requested," "Conceded" vs "Agreed." These shades can imply bias. The procedure catches the worst offenders, but staff need vigilance.

  **Final Tip for Your Coworker:** This isn't about achieving impossible purity. It's about **catching avoidable errors** (unsourced claims, imposed emotion, hidden conflicts of interest) and **making conscious choices** about selection and framing, knowing *why* we might omit something complex or how we're shaping the story. Run the text through the filters. If it passes, you've done due diligence against the main historiographical pitfalls. Save the deep theory for the pub after work!
