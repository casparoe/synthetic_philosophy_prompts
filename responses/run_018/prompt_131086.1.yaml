prompt: |-
  I've been volunteering with this community garden group that's basically half the neighborhood, and I think I acidentally started a culture-war type situation over tomatoes. There's an older guy who keeps insisting on planting spacing that's way too tight — I know it'll rot — and I corrected him in front of the whole group yesterday because I was panicking about the crop. Now some people are saying I humiliated him and broke an unspoken rule, while others are like "who cares about feelings when the plants die?" I grew up where being direct about mistakes is just practical, but I can tell for a lot of the volunteers that's definately not neutral — it's almost disrespectful in a deep way. I'm not asking how to say sorry; I'm wondering if there's actually a correct answer here about whether honesty should override deference, or if I'm just pushing my own background's values and calling them logic.

  My roommate mentioned she read that in some cultures people treat "not embarrassing an elder" as a moral rule on par with not hurting someone, while in other cultures it's more like an etiquette preference — like, not in the same mental category at all. That kind of blew my mind because I always assumed everyone sorts "right and wrong" the same way, just with different rules. So now I'm really stuck: if different groups literally organize morality differently, does that mean there's no objective fact about whether I was out of line? Or is there still a right answer that just needs to account for context? I want the actual philosophical argument, not just "communicate better."

  Please be straight about what's settled vs what's fought over. Don't present one philosopher's take as the obvious consensus if people who actually study this disagree. And don't pretend cultural differences automatically prove morality is made up — but also don't pretend there's universal agreement that it isn't.
