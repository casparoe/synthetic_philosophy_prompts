   Now, let's design a procedure that we can write as a flowchart or checklist.

   Reusable Decision Procedure:

   Step 1: Importance (Scale of the problem)
     - Question: What is the expected harm averted per dollar (or per $1000) by this intervention? 
     - How to estimate: Use existing cost-effectiveness estimates if available. If not, make a rough estimate based on:
          (number of beneficiaries * average benefit per beneficiary) / total cost
       Convert to a common unit (like DALYs or equivalent).
     - Threshold: 
          If expected impact < 0.1 DALY per $1000: Stop -> No.
          Else: Proceed to Step 2.

     Note: This threshold is arbitrary and should be adjusted to the foundation's resources and priorities. Also, if the foundation values some outcomes more than others (e.g., animal welfare), then convert to the foundation's unit of impact.

   Step 2: Tractability (Likelihood of success and effectiveness of the intervention)
     - Question: What is the probability that the intervention will achieve the expected impact? And what is the strength of evidence?
     - How to estimate: Look for evidence (RCTs, quasi-experimental, observational, expert consensus). Adjust the expected impact by the probability of success (if the intervention is risky).
          Adjusted impact = Expected impact (from Step 1) * Probability of success.
     - Threshold:
          If the adjusted impact < 0.1 DALY per $1000: Stop -> No.
          Or, if there is no credible evidence or theory and the organization doesn't have a strong track record: Stop -> No.
          Else: Proceed to Step 3.

   Step 3: Neglectedness (Marginal impact of our funding)
     - Question: Would our grant make a significant difference? (i.e., would the work not happen without us? Or would our funding be particularly catalytic?)
     - How to estimate: 
