prompt: |-
  I'm a program officer at a small family foundation making around forty grants a year, mostly $20k to $200k, and my board has started pressing me on why I fund one thing and not another. I keep seeing the importance/tractability/neglectedness framework waved around, but never as an actual procedure I can run in the hour I have per application. Please write me a reusable decision procedure (questions in order, what a good enough answer looks like, where it stops with a no, and where it stops with "this is a values call") based on what's actually defensible in that framework—not a version that pretends the three factors just multiply. Then run it on two or three cases: (a) a very neglected cause with low tractability, (b) a crowded but highly tractable cause, and maybe (c) a huge cause already awash in money. Make at least one case come out as a no to something I'd personally love to fund. Be explicit about which steps are settled among people who do cause prioritization and which are contested or judgment calls, and say what the procedure can't handle.
reasoning: |-
  We are going to create a decision procedure that breaks down the ITN (Importance, Tractability, Neglectedness) framework into a step-by-step process. The idea is to have a series of questions that can be answered in a reasonable time per application (about an hour total). 

   The procedure:
   1. We will go through the factors in order: Importance, then Tractability, then Neglectedness.
   2. At each step, we set thresholds for "good enough" and "stop" conditions.
   3. We aim to avoid false positives (funding bad grants) and be willing to say "no" quickly when clear red flags appear.

   Important note: The traditional ITN framework often multiplies the three factors, but we are going to use a sequential gating approach to avoid wasting time on applications that fail early criteria.

   Steps:

   Step 1: Importance
     Question: What is the scale of the problem this intervention aims to address? (in terms of harm averted per unit of resource, e.g., per dollar)
     - We are looking for a rough estimate of the scale of the problem, such as DALYs (Disability-Adjusted Life Years) or QALYs (Quality-Adjusted Life Years) per dollar, or some other metric of welfare impact.
     - If the problem is non-global (e.g., local to a community), we might use a multiplier for how much we value that community relative to the global average (this is a values call, but we need a consistent method).

     Thresholds:
     - If the problem is very small (e.g., less than 0.1 DALY per $1000, which is roughly equivalent to saving a year of healthy life for more than $10,000) then we stop and say "no" because the importance is too low.
     - If the problem is large (e.g., more than 1 DALY per $1000, which is roughly less than $1000 per DALY) then we proceed to tractability.

     Note: This step is contested because:
       - Different people value different outcomes (e.g., animal welfare vs. human welfare, or present vs. future generations).
       - There is disagreement about how to measure welfare (e.g., DALYs vs. subjective well-being).
       - We are making a judgment call by setting a threshold. The foundation might have a different bar.

   Step 2: Tractability
     Question: How much additional impact is likely to be achieved by this specific intervention (or organization) per dollar spent?
     - We are not just looking at the problem's theoretical solvability, but at the intervention's evidence of effectiveness and the organization's ability to execute.
     - We need to see some evidence (even if imperfect) that the intervention works. This could be from RCTs, observational studies, or strong theory.

     Thresholds:
     - If there is no evidence or a strong theoretical case, and the intervention is speculative, we stop and say "no" (unless the organization has a very strong track record and the theory is very compelling).
     - If the intervention has a proven track record (or strong evidence) and the organization is capable, we proceed to neglectedness.

     Note: This step is contested because:
       - Evidence can be hard to come by in new areas.
       - Some argue for funding high-risk, high-reward projects even without strong evidence if the potential upside is huge (but we are setting a higher bar for evidence when the importance is not astronomical).

   Step 3: Neglectedness
     Question: How much additional funding would this intervention or organization attract if we don't fund it? (Or: How much is already being spent on this problem by others?)
     - We want to know if our grant would be marginal (making a difference) or if it would just be a drop in the bucket.
     - We might look at the total funding in the space and the organization's current funding gap.

     Thresholds:
     - If the cause is already well-funded (e.g., there are many other funders and our grant would not make a material difference to the success of the intervention) then we stop and say "no".
     - If the cause is highly neglected (e.g., our grant would double the resources available for this intervention, or the organization is having trouble raising funds for a proven intervention) then we proceed to a full review.

     Note: This step is contested because:
       - It can be hard to measure neglectedness (what counts as the same cause?).
       - Sometimes even in a well-funded area, a small grant to a particularly effective organization can be high-impact.

   However, note: We are using a sequential approach. If an application passes all three gates, we then consider other factors (like alignment with foundation values, organizational capacity, etc.) but that is beyond the strict ITN.

   What the procedure can't handle:
     - It doesn't account for indirect effects (e.g., building a field, influencing policy).
     - It doesn't account for very long-term effects (e.g., existential risk reduction) where the evidence is weak but the potential upside is massive.
     - It doesn't account for the foundation's specific mission or values (so we have a step at the end for that).
     - It might be too rigid for some very novel ideas.

   We are going to run three cases:

   Case (a): A very neglected cause with low tractability.
     Example: Funding research into a rare disease that affects 1,000 people globally. The disease has no treatment and the research is high-risk. The organization is the only one working on it.

   Step 1: Importance
     - Scale: The disease causes severe disability and early death. If cured, it would save about 20,000 DALYs (assuming 20 years of life per person, with full health). But the research might cost $10 million. So per dollar: 20,000 DALYs / $10,000,000 = 0.002 DALYs per dollar (or 2 DALYs per $1000). This passes our importance threshold (which was at least 0.1 DALY per $1000).

   Step 2: Tractability
     - The research is high-risk: there's a low chance of success (say 1%). Then the expected DALYs per dollar is 0.00002 (which is 0.02 per $1000). This is below our importance threshold of 0.1 per $1000. So we stop and say "no".

     However, note: We might adjust for the fact that if successful, it could lead to broader knowledge. But without evidence of that, we stick to the direct impact.

     Verdict: No.

   Case (b): A crowded but highly tractable cause.
     Example: A proven bed net distribution program for malaria in a region where malaria is endemic. There are many large funders (like the Global Fund, USAID, etc.) already active.

   Step 1: Importance
     - Bed nets are known to be highly cost-effective. Estimates are around $3,000 per life saved (or about 30 DALYs per life saved, so 0.01 DALYs per dollar, which is 10 DALYs per $1000). That passes.

   Step 2: Tractability
     - Bed net distribution has strong evidence (RCTs) and the organization has a track record. Pass.

   Step 3: Neglectedness
     - The cause is crowded. The organization already has 90% of their funding from other sources. Our $100,000 grant would only add 10% to their budget, but they say they can use it to cover a gap. However, if we don't fund, they might get the money elsewhere. Also, the marginal impact of an additional bed net in a well-covered area might be low (due to saturation). We might estimate that the cost per DALY saved in this context is now higher (say $200 per DALY, which is 0.005 DALYs per dollar, or 5 DALYs per $1000). But note: this is still above our initial importance threshold. However, we are concerned about additionality.
     - We might ask: would our grant displace other funding? If so, then our impact is low. Without clear evidence that our grant is catalytic, we might say "no".

     But note: our threshold for neglectedness is about whether our grant makes a material difference. If the organization can show that without our grant, they would have to cut back, then we might fund. But if they are already fully funded, we stop and say "no".

     Verdict: Likely no, unless they can prove additionality.

   Case (c): A huge cause already awash in money.
     Example: Funding for cancer research in a well-funded area (e.g., breast cancer in the US).

   Step 1: Importance
     - Cancer is a huge problem. However, the cost per DALY averted in well-funded research areas is often very high. For example, developing a new drug can cost billions and extend life by a few months for many. Let's say it costs $1 billion to develop a drug that extends the life of 10,000 patients by 1 year (so 10,000 DALYs). That would be 0.00001 DALYs per dollar (0.01 per $1000). This is below our threshold of 0.1 per $1000? Actually, 10,000 DALYs / $1,000,000,000 = 0.00001 per dollar -> 0.01 per $1000. So it fails the importance threshold? Wait, let me recalc: 10,000 DALYs / $1,000,000,000 = 10^-5 DALYs per dollar. Then per $1000: 10^-5 * 1000 = 0.01 DALYs per $1000. Our threshold was 0.1 per $1000? Then it fails.

     But note: this is a rough estimate. Some cancer research might be more cost-effective. However, in well-funded areas, the low-hanging fruit might have been picked.

     Alternatively, we might consider the marginal impact of additional funding. But without evidence of high cost-effectiveness, we stop at step 1.

     Verdict: No.

   However, let's consider a variation: an application for a highly cost-effective cancer screening program in a low-income country that is not well-funded.

   Step 1: Importance
     - Cervical cancer screening in sub-Saharan Africa: cost per DALY averted might be around $100 (so 0.01 DALYs per dollar, or 10 per $1000). This passes.

   Step 2: Tractability
     - Proven intervention? Yes, screening and early treatment.

   Step 3: Neglectedness
