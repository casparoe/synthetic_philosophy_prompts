answer: |-
  Below is a reusable decision procedure based on the Importance/Tractability/Neglectedness (ITN) framework, designed for rapid application review (within 1 hour). The procedure uses **sequential elimination** (not multiplication) to avoid false positives, prioritizes defensible heuristics, and explicitly flags value judgments. Thresholds are calibrated for a foundation making $20k–$200k grants.

  ---

  ### **Decision Procedure: ITN Quick Screen**  
  *(~45-60 minutes per application)*  

  #### **Step 1: Importance (Scale of Harm/Benefit)**  
  **Question:** *"If successful, how large is the direct benefit per dollar spent, relative to global baseline interventions (e.g., malaria bed nets)?"*  
  - **Good enough:**  
    - Quantifiable impact metric (e.g., DALYs, lives, CO2 tons) showing **≥10% efficiency of top global benchmarks** (e.g., >0.5 DALYs/$1k vs. GiveWell’s ~5 DALYs/$1k).  
    - Non-quantifiable: Clear causal chain to major harm reduction (e.g., "prevents violent conflict in at-risk region").  
  - **Stop (No):**  
    - Impact <1% of benchmark efficiency **or** benefits are purely local/small-scale without leverage effects.  
    - *Time allocation:* 10-15 mins (public data, back-of-envelope math).  
  - **Contested note:**  
    - "Importance" often ignores tail risks (e.g., pandemics). Conservative foundations may undervalue high-uncertainty, high-stakes problems.  

  #### **Step 2: Tractability (Marginal Impact of Effort)**  
  **Question:** *"What is the probability this intervention succeeds, given the implementing organization’s plan and evidence?"*  
  - **Good enough:**  
    - **≥30% success chance** with credible evidence (RCTs, pilot data, theory of change).  
    - If novel: Analogies to similar successful interventions.  
  - **Stop (No):**  
    - Success probability <10% **or** no plausible mechanism (e.g., "raise awareness" without behavior-change evidence).  
    - *Time allocation:* 15-20 mins (org documents, academic citations, expert consensus).  
  - **Contested note:**  
    - Tractability debates center on "evidence quality." Randomistas (RCT-focused) vs. innovation funders disagree.  

  #### **Step 3: Neglectedness (Room for Funding)**  
  **Question:** *"Would this funding materially change outcomes (e.g., fill a critical gap), or is the field saturated?"*  
  - **Good enough:**  
    - **Funding gap >50% of project budget** AND no major players covering it.  
    - Or: Your grant unlocks matching funds/new actors.  
  - **Stop (No):**  
    - Field funding >10× annual need **or** your grant <5% of org’s budget.  
  - **Values call flag:**  
    - If Importance/Tractability pass but Neglectedness fails, **default to "No" UNLESS**:  
      - Alignment with foundation’s core mission (e.g., "we fund local arts despite saturation").  
      - *Time allocation:* 10 mins (industry reports, org financials, funder mapping).  
  - **Contested note:**  
    - "Neglectedness" is dynamic. E.g., AI safety seemed saturated in 2023 until new breakthroughs created gaps.  

  #### **Step 4: Final Check (Beyond ITN)**  
  **Questions:**  
  - **Organizational health:** Any fraud/corruption risks? (5 mins: audits, watchdog reports).  
  - **Values fit:** Does this align with board priorities? (5 mins: foundation charter).  
  - **Stop (No):** Failures on red flags (e.g., scandals).  

  ---

  ### **Case Applications**  
  **Hypothetical grant:** $100k to an NGO with strong credentials.  

  #### **Case A: Neglected Cause, Low Tractability**  
  *Application: Restoring degraded rainforests in a conflict zone (high biodiversity value, no other funders).*  
  - **Step 1 (Importance):**  
    - High importance (prevents species extinction, carbon sink). ~2 DALYs/$1k via air quality/ecosystem services. **✓**  
  - **Step 2 (Tractability):**  
    - Low: Security risks, no proven reforestation model in war zones. Success chance ~15%. **✗ Stop (No).**  
  - **Why you might love it:** Emotionally compelling, urgent ecosystem threat.  
  - **Why ITN says no:** Low probability of success turns high importance into low expected value.  

  #### **Case B: Crowded Field, High Tractability**  
  *Application: Distributing deworming pills in Kenya (evidence-backed, but 5+ major funders present).*  
  - **Step 1 (Importance):**  
    - High: ~10 DALYs/$1k (per GiveWell). **✓**  
  - **Step 2 (Tractability):**  
    - High: 70%+ success chance (RCT-backed delivery model). **✓**  
  - **Step 3 (Neglectedness):**  
    - Low: Field funded at 200% of need. Your grant covers <2% of org’s budget. **✗ Stop (No).**  
  - **Values call?** Only if foundation prioritizes Kenya specifically.  

  #### **Case C: Huge Cause, Awash in Money**  
  *Application: Mental health app for US college students (massive need, but 100+ competitors, VC-funded).*  
  - **Step 1 (Importance):**  
    - Moderate: ~0.1 DALYs/$1k (high costs in high-income settings). **✓** (barely).  
  - **Step 2 (Tractability):**  
    - Medium: 40% success chance (some efficacy studies). **✓**  
  - **Step 3 (Neglectedness):**  
    - Low: $500M+ in sector funding. Grant <0.1% of org’s capital. **✗ Stop (No).**  
  - **Values call?** Only if foundation has a youth mental health mandate.  

  ---

  ### **What the Procedure CAN’T Handle**  
  1. **Interdependent grants:** E.g., funding advocacy to "unlock" tractability for others.  
  2. **Emergent opportunities:** E.g., time-sensitive crises (pandemics, disasters).  
  3. **Pure values-based grants:** E.g., arts, religion, or community projects with no ITN justification.  
  4. **Long-term/tail risks:** E.g., AI alignment (high importance, but tractability/neglectedness hard to assess).  

  ### **Why This Works**  
  - **Defensible:** Uses conservative thresholds backed by global health/development consensus.  
  - **Fast:** Focuses on kill criteria early (e.g., neglects "importance" if tractability fails).  
  - **Auditable:** Documents clear "no" reasons for board reviews.  

  Adjust thresholds based on foundation values, but maintain consistency to avoid bias toward personal passions. For contested judgments (e.g., tractability of policy work), create a foundation-specific rubric.
