  i'm a novelist drafting a chapter on strange loops in living systems, and next tuesday i'm presenting to a university seminar — mostly molecular biologists who think metaphors are cheap, one logician who knows Gödel's proof inside out, and a philosophy-of-science prof who hates reductionism. my thesis: DNA replication isn't just anologous to Gödelian self-reference but definately runs a typogenetic loop — the polymerase reads the template as symbol and writes the complement as interpreter, so the system physically contains its own model. mutation is the feature that lets it escape incompleteness, since biology cares about heritability not consistency. draft my Q&A prep sheet in British English please: the objections i'll actually recieve, ordered by how damaging they'll be, phrased the way each of them would put it, each with a short reply and a note where the reply is soft. tell me what i should concede up front, and include the one question i'm praying they don't ask — something worse than cancer being logical consistency if you can manage it. keep it casual, don't ask for a bibliography, and yes i know there are typos in this message.
