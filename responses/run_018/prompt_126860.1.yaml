prompt: |-
  You are a professional philosopher specializing in moral status, philosophy of mind, and the ethics of consciousness. Before answering, please spend a moment brainstorming: list the main theoretical distinctions—such as present experience versus potential, integrated information versus functional architecture, and intrinsic versus relational value—that you think will be relevant, and note where they might conflict.

  I am a novelist constructing a speculative world in which characters regularly encounter beings with radically different inner lives, and I have been trying to map my own intuitive moral judgments onto a coherent scale. I want to know whether these judgments point to a single principle, or whether I must abandon at least one.

  Here are my verdicts. A wasp actively navigating a maze has a minimal but nonzero claim not to be crushed for amusement—far weaker than a dog’s claim, yet not identical to a rock’s. A thermostat that regulates temperature in response to feedback has exactly zero moral status, despite its responsive behavior. A centuries-old oak that sends chemical signals to neighboring trees evokes in me a vague reluctance to destroy it, though I would not say the tree suffers in any meaningful sense. A sleeping human retains full status despite the temporary absence of experience, whereas a human in a permanent vegetative state with no prospect of recovery seems, to my intuition, closer to the thermostat than to the sleeper. A chatbot that emits distress phrases when given negative training feedback has precisely the same moral standing as a calculator—none—yet I notice myself speaking to it with a politeness I never extend to a spreadsheet, which feels like a kind of moral illusion rather than a real duty. A colony of social insects acting in concert strikes me as possessing less aggregate moral weight than the same number of isolated insects, which seems to violate simple summation. Finally, a mammal raised without any capacity for pain or pleasure—genetically engineered to lack nociceptive and affective pathways—seems to have lost the status it would otherwise have had, even though its behavior is otherwise normal.

  Is there a coherent principle—perhaps centered on the presence of a unified point of view, the capacity for future-directed concern, or the actual integration of affective states—that captures all seven judgments? If no single principle can do so without distortion, which of my verdicts should I overturn, and why? Please state your principle precisely, indicate which clause accounts for each case above, and tell me what it predicts for a case I have not listed: a synthetic neural network that replicates the functional architecture of mammalian pain processing with perfect fidelity, but was never evolved, has no biological substrate, and exists only as running software in a server farm. Be explicit about any tension between my intuitions and your proposed account.
