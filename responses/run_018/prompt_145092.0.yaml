prompt: |-
  I was discussin evolutionary explanation with some friends last week and I'm trying to write down my actual commitments for a small group we're running — mostly Gould/Lewontin spandrel stuff plus some newer evo-devo material. I want people to poke holes in it. Here is my profile:

  - I'm a strong adaptationist about human cognition: selection is the main game for explaining complex functional traits like language or theory of mind.
  - I think Gould and Lewontin are largely right that architectural byproducts are everywhere, but wrong that this undermines adaptationist programs in practice.
  - I rely on current utility as my main heuristic: complex trait + currently useful = primafacie evidence of selection for that function, absent a clear non-adaptive origin.
  - I think spandrel talk is overused — lots of alleged spandrels are really exaptations or have hidden selective histories people haven't mapped.
  - I don't think evolutionary psychology needs specific gene mappings for each trait; a black-box approach is methodologically okay for now.
  - I think the San Marco analogy actually helps adaptationists: those spandrels are structurally necessary parts of the arch, so they're designed in a broad sense, blurring the spandrel/adaptation line in our favor.

  Go through these pairs and tell me which are genuinely in tension, which just look tense but dissolve on inspection, and rank the real conflicts by severity. For each say how bad it is, what the cheapest fix costs, and then identify the single revision that would clean up the most inconsistencies. Don't lecture me on adaptationism generally — just audit this specific set.
reasoning: |-
  Okay, the user is working on their evolutionary biology stance for a discussion group, specifically focusing on adaptationism versus spandrels/exaptations. They've listed six key points and want me to analyze tensions between them, rank conflicts, suggest fixes, and identify a key revision. 

  First impression: This is a sophisticated user - they're referencing Gould/Lewontin debates while synthesizing modern evo-devo perspectives. Their request is unusually precise: they want internal consistency checks, not general critiques. The "don't lecture me" note suggests they've heard standard anti-adaptationist arguments before and want focused analysis.

  Hmm... their profile has interesting nuances. They're intellectually honest about spandrels existing ("architectural byproducts are everywhere") but defend adaptationism's practical value. That current utility heuristic stands out - it's pragmatic but philosophically risky if over-relied upon. 

  *scanning points again* The San Marco take is fascinating! Most people see those spandrels as anti-adaptationist emblems, but this user flips it: structural necessity implies "design" in broad terms. That's clever but might clash with their own spandrel acknowledgement. 

  Biggest red flag: Point 3 (current utility = evidence for selection) and Point 4 (spandrels are overdiagnosed) seem to feed each other circularly. If you assume current utility indicates selection, you'll naturally dismiss spandrel claims too readily. That's probably the core tension. 

  *mentally mapping conflicts* 
  - The black-box approach (Point 5) actually resolves easily with their framework - no tension there since they explicitly accept provisional explanations. 
  - But Point 1's "selection is main game" might oversimplify when paired with Point 2's spandrel acceptance. Not a direct clash, but could use nuance about when selection isn't primary. 

  Cheapest fix? Softening Point 3's heuristic to "suggestive but not conclusive" evidence. The high-impact revision would be to reframe Point 6's "blurring" argument: instead of claiming spandrels are quasi-adaptations, emphasize that their necessity creates selection pressures for secondary adaptations. 

  *checking for blind spots* They haven't considered how evo-devo constraints interact with current utility - a developmental constraint might produce currently useful traits that weren't selected for. That could strengthen their Point 2 if added. 

  Final thought: Their stance is coherent except that utility heuristic. If they dial that back just 20%, the whole framework becomes more defensible. Smart user - they'll probably enjoy having that pressure point exposed.
answer: |-
  Here's a rigorous audit of your stated commitments, identifying tensions, ranking conflicts by severity, and offering targeted fixes:

  ### Tension Analysis & Conflict Ranking (Severe to Mild)

  1.  **Point 3 (Current Utility Heuristic) vs. Point 2 (Architectural Byproducts Everywhere) & Point 4 (Spandrel Overuse)**
      *   **Conflict:** Severe. This is the core tension. Your heuristic ("complex trait + currently useful = prima facie evidence of selection") directly contradicts your acceptance that architectural byproducts/spandrels *are* pervasive (Point 2) and that many traits claimed as spandrels are misdiagnosed *because* they look adaptive *now* (Point 4). Relying primarily on current utility makes it methodologically difficult to recognize *genuine* spandrels, as they often *are* currently useful (exaptations). Your heuristic risks circularly reinforcing adaptationist explanations.
      *   **Severity:** High (Fundamental methodological clash).
      *   **Cheapest Fix:** Qualify Point 3 significantly: "Current utility is a *suggestive starting point* for investigating adaptation, but it is *not* prima facie evidence *for selection specifically for that function*. Competing explanations (spandrel, exaptation, constraint) must be actively tested against it." Acknowledge that current utility is equally consistent with exaptation.

  2.  **Point 6 (San Marco Helps Adaptationists / Blurs Line) vs. Point 2 (Architectural Byproducts Everywhere)**
      *   **Conflict:** Moderate to Significant. Point 2 embraces the core G&L insight: many features are non-adaptive byproducts of structure/constraint. Point 6 argues that because these byproducts are structurally necessary, they are "designed in a broad sense," blurring the spandrel/adaptation line "in our [adaptationists'] favor." This risks *minimizing* the "byproduct" aspect G&L emphasized. Calling them "designed" (even broadly) conflates *selection for the arch* (adaptation) with *necessity arising from the arch* (byproduct). It undermines the conceptual distinction Point 2 relies on.
      *   **Severity:** Moderate (Conceptual blurring vs. categorical distinction).
      *   **Cheapest Fix:** Reframe Point 6: "The San Marco analogy highlights that spandrels are *inevitable consequences* of adaptations (the arches). While not *selected for themselves*, their existence is a direct result of selection for the underlying structure. This *necessity* means they are predictable sites for *subsequent* exaptation/decoration, but doesn't make them adaptations *for* that decoration." Emphasize the *sequence* (adaptation -> byproduct -> potential exaptation).

  3.  **Point 1 (Strong Adaptationism for Cognition) vs. Point 2 (Architectural Byproducts Everywhere)**
      *   **Conflict:** Apparent (Dissolves on Inspection). This looks tense but isn't inherently conflicting. You can be a strong adaptationist about *specific complex cognitive traits* (language, ToM) while fully acknowledging that *many other features* (especially structural, physiological, or less complex cognitive quirks) are architectural byproducts. The tension dissolves if "strong adaptationism" applies primarily to the *explanandum* (complex functional traits) and "byproducts everywhere" applies to the broader organismal landscape.
      *   **Severity:** Low (Scope difference).
      *   **Cheapest Fix:** Clarify scope in Point 1: "I'm a strong adaptationist about explaining *specific complex functional cognitive traits like language or theory of mind*..." This explicitly carves out the domain where adaptation is the "main game," leaving room for byproducts elsewhere.

  4.  **Point 5 (No Need for Gene Mapping) vs. Point 1-4 (Generally)**
      *   **Conflict:** Apparent (Dissolves on Inspection). Point 5 is a methodological stance compatible with Points 1-4. Adaptationism, the recognition of spandrels/exaptations, and the use of heuristics like current utility can all employ a "black-box" approach focusing on design, function, and phylogeny without needing current genetic detail. This is standard practice in much of evolutionary biology and paleontology.
      *   **Severity:** None.
      *   **Cheapest Fix:** None needed. Point 5 is consistent with the others.

  5.  **Point 4 (Spandrel Overuse / Hidden Histories) vs. Point 2 (Byproducts Everywhere)**
      *   **Conflict:** Apparent (Dissolves on Inspection). These points are synergistic, not conflicting. Point 2 says byproducts/spandrels *are* a major phenomenon. Point 4 argues that *some claims* of spandrels are mistaken because the trait might actually be an exaptation or have a hidden adaptive history. This is simply urging diagnostic rigor: don't be too quick to call something a spandrel *or* an adaptation. Both over-adaptationism and over-spandrelism are errors.
      *   **Severity:** None.
      *   **Cheapest Fix:** None needed. Points 2 and 4 work together.

  ### Summary of Conflicts by Severity

  1.  **High Severity:** Point 3 (Current Utility Heuristic) clashes fundamentally with Points 2 & 4.
  2.  **Moderate Severity:** Point 6 (San Marco Blurring) conceptually undermines the clarity of Point 2 (Byproducts Everywhere).
  3.  **Low Severity:** Point 1 (Adaptationism Scope) needs clarification relative to Point 2's breadth, but no inherent conflict.
  4.  **No Conflict:** Points 4 & 5 are consistent. Points 2 & 4 are synergistic.

  ### The Single Revision to Clean Up the Most Inconsistencies

  **Revise Point 3 (Current Utility Heuristic).**

  *   **Why:** It's the source of the severe conflict (with P2 & P4) and fuels the potential misapplication of the San Marco interpretation (P6). Fixing this directly addresses the core methodological clash.
  *   **Effective Revision:** Replace the prima facie evidence claim with a more nuanced investigative starting point:
      *   **Revised Point 3:** "Current utility is a crucial *heuristic cue* prompting investigation into a trait's evolutionary history. However, it is *not* decisive evidence for *selection specifically for that function*. It is equally consistent with exaptation. Establishing adaptation requires ruling out alternatives (spandrel, exaptation, constraint) and providing evidence *for* historical selection shaping the trait *for* its current function (e.g., comparative evidence, complex specificity, experimental evidence of fitness benefit in ancestral context models)."

  ### How This Fixes the Key Issues

  1.  **Resolves P3 vs. P2/P4:** Explicitly acknowledges that current utility *does not distinguish* adaptation from exaptation, which is the essence of the spandrel/exaptation critique. This makes genuine recognition of architectural byproducts (P2) and the critique of over-diagnosing spandrels (P4, which often happens when current utility is misinterpreted) methodologically coherent.
  2.  **Strengthens P6 Interpretation:** By decoupling current utility from adaptation, the "blurring" argument in P6 loses its problematic implication that current utility/decoration implies adaptation. You can still argue the spandrel's existence is a *necessary consequence* of the adapted arch, but the decoration is clearly exaptive, not adaptive *for that function*.
  3.  **Preserves Core Adaptationism (P1):** You can still strongly argue that complex functional traits *are* adaptations, but now your methodology for identifying them is more robust, requiring evidence *beyond* current utility.
  4.  **Compatible with P5:** The black-box approach remains valid; you just demand stronger evidence *within* that approach than current utility alone.

  This single revision transforms your current utility heuristic from a potential source of circularity and conflict into a more defensible starting point for rigorous evolutionary hypothesis testing, making your entire profile significantly more internally consistent and resistant to critique on spandrel/exaptation grounds.
