answer: |-
  Here's the raw spec for armed neutrality as a legit defense posture – distilled from the concepts & cases you fought over. Think of it as the "stress test" a theory must pass.

  ### Core Desiderata (Non-Negotiables)
  1.  **Credible Autonomous Deterrence:** *Must* deter *major powers* solely with indigenous forces/resources. **Why?** Core of not freeloading. If you *need* external help to survive initial assault, it's branding. **Case:** Switzerland's mountain fortifications & air force deterrence vs. WWII Germany; Finland's WWII defense. Fail here = fail entire model.

  2.  **Formal & Operational Non-Alignment:** Constitutional/legal neutrality *plus* demonstrable non-participation in offensive alliances/military blocs. **Distinction:** Constitutional neutrality (Swiss law) vs. operational neutrality (Swiss staying out of NATO ops). **Why?** If you're functionally allied (e.g., secret defense pacts, hosting foreign bases offensively), it's a sham. **Constraint:** Violates Hague Conventions (1907) on neutrality if breached.

  3.  **Territorial Defense Primacy:** Force structure, doctrine, logistics optimized for defending national soil *only*. **Distinction:** Must reject power projection (expeditionary forces, carrier groups) as incompatible. **Why?** Power projection implies alliance commitments/offensive capability inconsistent with neutrality. **Case:** Swiss militia & bunkers = pure territorial; Sweden's pre-NATO shift towards expeditionary (Afghanistan) eroded neutrality cred.

  4.  **Resilient Indigenous Logistics:** Ability to sustain defense (ammo, fuel, food, meds, spare parts) under blockade/without major imports for *prolonged conflict*. **Why?** Neutrality means no allies guaranteeing supply lines. Post-invasion reliance on others = freeloading. **Case:** Swiss strategic reserves (months of fuel/grain); Sweden's pre-2014 vulnerability on fuel imports exposed weakness.

  5.  **Legal Belligerency Compliance:** Neutrality obligations under int'l law (Hague/Geneva) *must* be maintainable during mobilization/war. **Constraint:** Can't let reservists in critical foreign-owned infrastructure (power grids, ports, pharma) be mobilized in ways that: a) hand control to foreign entities during war, or b) constitute using "neutral" territory for belligerent logistics. **The Civilian-Infrastructure Overlap Problem:** *Solution must:* Nationalize/securely control *wartime* operation of critical infra *or* have legal/technical mechanisms ensuring foreign owners can't influence/benefit from its use for defense during mobilization. **Case:** Swiss laws allowing state takeover of critical private infrastructure in crisis; ambiguity if a German-owned Swiss arms factory makes ammo for Ukraine.

  ### Operational Desiderata (Camp Preferences, But Highly Indicative)
  6.  **Mass Mobilization Base:** Large trained reserves via conscription (Swiss, Finnish, post-2010 Swedish model) or massive volunteer reserves. **Why?** Professional rapid-response forces often lack depth for prolonged *autonomous* war. Conscription builds societal resilience/deterrence. Not absolute (tiny states excepted), but failure here often correlates with failure on #1 & #4.

  7.  **Defensive-Only Military Tech & Posture:** Weapons systems & deployments inherently defensive (e.g., SAMs, mines, coastal artillery) vs. dual-use offensive systems (long-range missiles, strategic bombers). **Why?** Reinforces #3 & signals intent. **Case:** Finland's artillery = defensive territorial denial; Swiss lack of bombers.

  8.  **Alliance Interoperability Limitation:** Can cooperate on *truly neutral* tasks (disaster relief, peacekeeping under UN mandate) but *cannot* have deep integration enabling rapid alliance entry. **Why?** Deep NATO/EU battle group integration (pre-2022 Sweden) undermines #2. **Joints Unsatisfiability Alert:** *Strict Constitutional Neutrality + Deep Alliance Interoperability* are mutually exclusive. Deep interoperability creates binding *de facto* commitments and vulnerabilities incompatible with true neutrality. Sweden choosing NATO proves this.

  ### The Theory-Killer Desideratum
  *   **#1 (Credible Autonomous Deterrence)** knocks out most "popular" nostalgic theories. If your armed forces can't realistically stop/seriously bloody a major power attack *on their own* for long enough for diplomacy/other factors to potentially intervene (like Swiss/Finnish models aimed to do), then it's just freeloading or wishful thinking. This exposes states relying solely on "neutrality charm" without the hard power.

  ### Country Scores (Pass/Fail Heavy on Non-Negotiables)
  *   **Switzerland:**
      *   #1: Pass (Strong historical deterrence, modern challenges debated but still credible vs. most threats).
      *   #2: Pass (Constitutional, stays out of alliances/ops).
      *   #3: Pass (Pure territorial defense).
      *   #4: Pass (Gold standard for reserves/logistics).
      *   #5: Pass (Legal framework for critical infra takeover exists).
      *   #6: Pass (Conscription/militia).
      *   #7: Pass (Defensive posture).
      *   #8: Pass (Limited, mostly UN/PKO interop). **Verdict:** Still the archetype, though modern air power/logistics challenges loom.
  *   **Sweden (Post-NATO Join):**
      *   #1: Pass/Fail Irrelevant Now (Joining NATO explicitly abandons *autonomous* deterrence for alliance deterrence).
      *   #2: **FAIL** (NATO membership is formal alliance).
      *   #3: Pass (Still territorial focus).
      *   #4: Improving but historically weak - Pass? (Massive post-2014/2022 investments).
      *   #5: N/A (Not neutral).
      *   #6: Pass (Revived conscription).
      *   #7: Pass (Defense focus remains).
      *   #8: **FAIL** (Full NATO integration). **Verdict:** Former neutral, now explicit alliance member. Proves the difficulty of maintaining true neutrality with modern threats/dependencies.
  *   **Finland:**
      *   #1: Pass (Credible mass mobilization deterrent vs. Russia).
      *   #2: **Questionable Pass/Soft Fail** (Formally "military non-aligned" but deeply integrated with NATO/EU defense structures *before* joining, joined NATO Apr 2023). Pre-2023 was a highly strained model under modern pressure. Post-2023: **FAIL** on #2.
      *   #3: Pass (Exemplary territorial defense).
      *   #4: Pass (Huge wartime stocks, resilient planning).
      *   #5: Pass (Strong state control mechanisms).
      *   #6: Pass (Conscription model benchmark).
      *   #7: Pass (Artillery/terrain denial focus).
      *   #8: Pre-NATO: **Soft Fail** (Deep NATO interop eroded #2). Post-NATO: **FAIL**. **Verdict:** Pre-2023 was arguably the *most credible modern attempt*, but the Ukraine war proved the untenable strain of #2 vs. #1 & #8, forcing NATO choice. Confirms the joint unsatisfiability.

  **The Takeaway:** True armed neutrality is brutally hard and expensive. It requires near-total self-reliance in deterrence, logistics, and legal isolation (#5 is a sneaky hard one). Most states find the cost/risk too high versus the benefits of alliances in the modern security environment. Sweden and Finland's shifts are the ultimate data points. Switzerland stands alone, looking increasingly like a unique artifact, but still ticking most boxes – for now.
