prompt: |-
  I am in my final year of secondary school and co-host our philosophy society's podcast. Our next guest is a philosopher who defends teleosemantics: roughly, the view that what a mental state represents is fixed by the biological function of the mechanisms producing it, where function is cashed out in terms of selection history rather than current disposition. I have done my background reading -- the usual frog-snapping example, Millikan's consumer-side proposals, Dretske's indicator-based precursor -- and in past episodes I made the mistake of letting guests spend half the hour simply stating their position, which our listeners already know. This time I want to press on the view itself, and I would like your help drafting the questions.

  Please write eight to ten interview questions, each followed by one follow-up tailored to the reply our guest is most likely to give. At least one question each should cover: the indeterminacy worry (what, on the selection story, settles that the frog's inner state represents fly rather than small dark moving speck, and whether appeal to what the mechanism was selected for doing genuinely resolves this or merely relocates it); the Swampman objection (the molecule-for-molecule duplicate of a person formed by a freak accident, who on this view would apparently have no contentful thoughts whatsoever, and whether the usual dismissals of this case are anything more than appeals to intuition pumping in the other direction); contents that seem to lack any relevant selection history, such as thoughts about things never encountered by one's ancestors or abstract subject matter; and the asymmetry the account needs between correct representation and misrepresentation, including whether the consumer of a representation can supply what the producer cannot. Avoid anything biographical or career-related. For one question of your choosing, also note in a sentence what a genuine concession from the guest would sound like, so I know when I have actually won a point rather than received a deflection.

  Number the questions and indent the follow-ups beneath them. The whole response should come to no more than 600 words, and please write in British English.
reasoning: |-
  Okay, the user is a final-year secondary school student co-hosting a philosophy podcast. They're interviewing a teleosemantics defender and want incisive questions that press core weaknesses. They've done impressive preparatory reading (frog examples, Millikan, Dretske) and want to avoid letting guests rehash basics. 

  The request is highly specific: 8-10 numbered questions with tailored follow-ups, covering four mandatory areas (indeterminacy, Swampman, novel/abstract content, misrepresentation asymmetry). Must include one "concession indicator". Word limit and British English are constraints. 

  Hmm, their phrasing suggests frustration with past guests' evasiveness - they want forensic tools to force substantive engagement. The "won a point" remark hints they might frame this as a debate, though the tone should remain academically rigorous. 

  Breaking down requirements:
  - Indeterminacy: Need to expose whether selection history genuinely fixes content or just kicks the can. Frog example is perfect - must push past "function resolves it" tropes.
  - Swampman: Classic thought experiment. Crucial to challenge "intuition pumping" dismissals and probe if teleosemantics implies eliminativism about duplicates.
  - Novel/abstract content: Hard case. Must question extension mechanisms without handwaving.
  - Asymmetry: Producer/consumer distinction is key. Should test if consumer purposes can override producer functions.

  For concession tracking, Swampman is ideal - if guest admits the duplicate genuinely lacks content, that's a substantive (if radical) commitment rather than evasion.

  Structuring questions:
  1-2: Indeterminacy (frog case first, then general principle)
  3-4: Swampman (objection then counter-intuitiveness)
  5-6: Novel/abstract content (empirical then mathematical)
  7-8: Asymmetry (producer limitation then consumer role)
  9: Optional wildcard (maybe normative contents?)
  10: Concession-focused Swampman follow-up

  Follow-ups must anticipate standard replies: e.g., for indeterminacy, guest will likely say "function fixes content" - follow-up should challenge whether "function" itself is indeterminate. For Swampman, they may dismiss intuition - follow-up presses if that makes teleosemantics unfalsifiable.

  Word count tightness means questions must be razor-sharp. Using "speck" not "dot" in frog example for British English. Avoiding "just-so story" phrasing despite relevance - too colloquial. 

  Final check: All mandatory areas covered? Yes. Concession marker on Q4? Added. British English: "learnt", "colourless", "defences". Under 600 words? Just managed.
answer: |-
  Here are ten focused questions with follow-ups, covering your specified areas in British English:

  1.  **The frog's visual mechanism was selected for snapping at flies, but its state is triggered by any small, dark, moving speck. How does selection history determine that the state represents *fly* rather than *nutritious speck* or simply *snap-target*?**  
      *Follow-up:* If you argue it's the *nutrient-gathering function* that fixes it as fly, doesn't that just relocate the indeterminacy? How does selection history specify *which* condition fulfilling the function (fly-ness vs. speck-ness) it was *selected for* tracking?

  2.  **Beyond frogs, how does teleosemantics resolve indeterminacy for states produced by mechanisms with complex, multi-stage selection histories? Doesn't appeal to "proper function" often mask an arbitrary choice between equally plausible descriptions of what was selected *for*?**  
      *Follow-up:* Couldn't a critic argue that your resolution relies on a pre-theoretical intuition about what the content *should* be, making selection history descriptive rather than constitutive?

  3.  **On teleosemantics, Davidson's Swampman – an accidental duplicate of a person – would lack any contentful thoughts because its states lack selection history. Standard defences dismiss this as counter-intuitive, but isn't this just intuition-pumping against the critic?**  
      *Follow-up:* If we grant Swampman is metaphysically possible, does teleosemantics *entail* that genuine thought requires a lineage with evolutionary history, making content externalist in a very strong sense?

  4.  **<Concession Focus> Many find Swampman having no thoughts absurd. If teleosemantics is correct, must we simply accept this radical consequence as the cost of a naturalistic theory?**  
      *Follow-up (and concession note):* **A genuine concession would sound like:** "Yes, absolutely, Swampman has no genuine intentional states whatsoever; that *is* the correct, if startling, implication." Anything less (e.g., "It might acquire content quickly," "It's not a real case") is likely deflection.

  5.  **How can teleosemantics account for thoughts about novel entities our ancestors never encountered, like smartphones? Does 'selection history' stretch to cover functions performed by mechanisms co-opted for radically new purposes?**  
      *Follow-up:* Doesn't describing the mechanism's *current* proper function in relation to smartphones rely on its *current* causal role or our interpretation, rather than its actual selection history?

  6.  **What about abstract thoughts, like pondering a prime number larger than any ever instantiated? What biological function, fixed by selection, could determine *that* specific mathematical content?**  
      *Follow-up:* If you appeal to the general function of a numerical cognition mechanism, how does that fix the content of a thought about a *specific*, never-encountered prime, rather than a general ability or a different number?

  7.  **Teleosemantics needs an asymmetry: a state represents X because it’s the condition under which responses to it *historically* fulfilled their function. How does this avoid making misrepresentation impossible? If a frog snaps at a bee, what makes this a misrepresentation of *fly* rather than a correct representation of *bee*?**  
      *Follow-up:* If you say it's because snapping at bees didn't contribute to fitness historically, does this imply that without knowing the *specific* historical failure rates for *bees*, we cannot define misrepresentation?

  8.  **Millikan emphasises the ‘consumer’ of a representation in fixing content. Couldn’t a consumer system (e.g., a belief-desire system) ‘use’ a state in a way that bestows content the producer mechanism’s history alone couldn’t determine?**  
      *Follow-up:* Doesn't this consumer-based approach risk importing normative or intentional notions *prior* to fixing content, potentially undermining the reductive naturalistic aims of teleosemantics?

  9.  **If a representation is consumed by multiple systems with different evolutionary functions, how is the *specific* content determined? Couldn't this lead to conflicting contents for a single state?**  
      *Follow-up:* Does the theory require a privileged consumer system, or a specific way of individuating functions, to avoid this conflict? Isn't that choice potentially arbitrary?

  10. **How does teleosemantics handle normative thoughts, like "I ought to help"? What selection history fixes the content of 'ought', distinguishing it from mere descriptive regularities or desires?**  
      *Follow-up:* If it’s linked to mechanisms selected for social cohesion, doesn’t this reduce the normative 'ought' to a descriptive fact about evolutionary advantage?
