answer: |-
  Here are the core desiderata for evaluating theories of social facts, motivated by key phenomena and distinctions, with analysis of constraints versus partisan commitments:

  **Non-Negotiable Constraints** (Failure here invalidates the theory):  
  1. **Ontological Grounding**: Social facts must be constituted by *something* in the physical world (e.g., individuals, their properties/relations).  
     *Motivation*: If social facts float free of human beings (like ghosts), they violate naturalism. Even holists agree institutions require individuals to sustain them.  

  2. **Causal Efficacy**: Social facts must demonstrably *cause* outcomes.  
     *Motivation*: A currency collapse causes starvation; a law changes behavior. Denying this makes social science irrelevant.  

  3. **Emergence Recognition**: Social facts must have properties not trivially reducible to individual parts *in isolation*.  
     *Motivation*: "Panic" in a crowd isn't just the sum of individual fears; it arises from interactions (bank runs). Traffic jams emerge from individual choices but constrain all drivers.  

  4. **Intentionality Compatibility**: Must account for how individuals *interpret* social facts (beliefs, desires, recognition).  
     *Motivation*: A $20 bill has value only because people *believe* it does. A "debt" exists via mutual recognition, unlike a rock.  

  **Contested Desiderata** (Where camps diverge):  
  5. **Explanatory Autonomy**: Can social-level explanations be *primary* causes, not just shorthand?  
     *Holist Motivation*: "Inflation caused recession" seems causally direct (e.g., via market constraints). Reducing it to millions of decisions loses the unifying mechanism.  
     *Individualist Rebuttal*: Such explanations risk vacuity without microfoundations (e.g., *how* does "inflation" cause job losses?).  

  6. **Microfoundations Requirement**: Must every social fact be *explicitly derived* from individual actions?  
     *Individualist Motivation*: A corporation’s action (e.g., pollution) must bottom out in decisions by its employees/shareholders. Without this, "corporate responsibility" is mystical.  
     *Holist Rebuttal*: Insisting on full reduction is impractical and ignores systemic causality (e.g., market equilibrium emerges unintended).  

  7. **Multiple Realizability**: Can the *same* social fact be realized by *different* individual configurations?  
     *Holist Motivation*: "Democracy" functions similarly in Japan, Germany, or India despite cultural differences. "Money" works via coins, paper, or digital tokens.  
     *Individualist Response*: Accepts this but demands *some* microfoundation for each realization.  

  8. **Downward Causation**: Can social facts *constrain/enable* individual choices?  
     *Holist Motivation*: A job market forces individuals to acquire skills; norms shame dissenters (e.g., gender roles).  
     *Individualist Response*: Constraints are still mediated by individual beliefs (e.g., *expectations* of others' enforcement).  

  **Key Tensions & Forcing Moves**:  
  - **Explanatory Autonomy (5) vs. Microfoundations (6)**: This is the **irreducible core conflict**. Holists demand autonomy to avoid "explanatory overload"; individualists demand microfoundations to avoid "explanatory mysticism".  
  - **Multiple Realizability (7) vs. Strict Reduction**: Undermines type-identity reduction (no 1:1 social-individual mapping).  
  - **The Forcing Move**: **Downward Causation (8)**. If social facts *causally structure* individual choices in ways not reducible to *prior* individual states (e.g., an *unanticipated* institutional change altering behavior), strong individualism struggles.  

  **How Theories Fare**:  
  | **Desideratum**          | **Strict Methodological Individualism**                                                                 | **Strong Holism**                                                                                     | **Emergentism/Middle Ground**                                                                                             |  
  |--------------------------|--------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|  
  | Ontological Grounding    | ✅ (Only individuals)                                                                                  | ⚠️ (Risk of reifying "society")                                                                       | ✅ (Individuals + relations)                                                                                             |  
  | Causal Efficacy          | ✅ (Via individuals)                                                                                   | ✅ (Social facts as direct causes)                                                                     | ✅ (Both levels)                                                                                                         |  
  | Emergence                | ⛔ (Denies strong emergence)                                                                            | ✅ (Social facts as novel)                                                                             | ✅ (Systemic properties from interactions)                                                                               |  
  | Intentionality           | ✅ (Focus on beliefs)                                                                                  | ⚠️ (May downplay interpretation)                                                                      | ✅ (Crucial: e.g., Searle's status functions)                                                                            |  
  | Explanatory Autonomy     | ⛔ (Only shorthand)                                                                                    | ✅                                                                                                    | ✅ (Provisional autonomy for pragmatism)                                                                                 |  
  | Microfoundations         | ✅ (Non-negotiable)                                                                                    | ⛔ (Often rejected)                                                                                   | ✅ (In principle) but accepts explanatory shortcuts                                                                      |  
  | Multiple Realizability   | ✅ (Compatible)                                                                                        | ✅ (Emphasized)                                                                                       | ✅ (Core argument)                                                                                                       |  
  | Downward Causation       | ⛔ (Only upward causation)                                                                             | ✅                                                                                                    | ✅ (Via feedback loops, e.g., norms constraining future choices)                                                         |  
  | **Key Weakness**         | Struggles with novelty, constraints, and unanticipated emergence (e.g., new norms).                    | Risks explanatory gaps (how *exactly* does "society" cause?) and reification.                         | Must walk a tightrope: risk vagueness on mechanisms or collapsing into one camp.                                        |  

  **Settlement Insight**: Your debate centers on **explanatory priority** (desiderata 5 & 6). The emergentist view accepts *both* directions of dependence: individuals (with beliefs formed by social context) create institutions, which then enable/constrain future individuals. But it concedes that **microfoundations are ultimately necessary** for non-mysterious explanations, while granting **pragmatic autonomy** to social facts when mechanisms are stable (e.g., "inflation" as a causal placeholder). The irreducibility of *interpretation* (e.g., "this *is* money") ensures social facts aren't eliminable, even if grounded.
