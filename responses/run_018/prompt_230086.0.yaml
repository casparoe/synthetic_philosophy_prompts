  Ah! The killer constraint is probably "explanatory autonomy" - whether social facts can be *primary* causes. That's where positions really fracture. Methodological individualists will demand reducibility while holists point to downward causation. The multiple realizability argument (same social fact from different individual configurations) particularly hurts reductionism. 

  For the theories: Strict individualism fails emergence and autonomy tests spectacularly - imagine trying to explain a stock market crash solely through individual panic while ignoring institutional structures. Strong holism risks spooky metaphysics when asked what "society" is made of. Emergentism handles most constraints but gets fuzzy on microfoundations - it's the "yes, and..." position. 

