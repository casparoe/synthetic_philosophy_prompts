answer: |-
  ## Bureau of Moral Surplus: Employee Handbook (Section 4.7: Surplus Obligation Management)

  **1.0 Purpose & Philosophy**  
  The Bureau of Moral Surplus (BMS) exists to quantify, standardize, and maximize the societal return on ethical investment. We believe the traditional distinction between "duty" and "going beyond duty" is operationally inefficient and morally misleading. All actions exist on a continuum of societal benefit, and maximizing that benefit is the core obligation of every BMS employee. This section outlines the framework for ensuring consistent, measurable contributions to the Moral Surplus.

  **2.0 Defining the Baseline & Surplus**  
  2.1 **Baseline Duty:** Actions fulfilling minimal contractual, legal, and universally expected social obligations (e.g., honesty in reporting, meeting deadlines, basic courtesy). Baseline Duty generates zero (0) Moral Surplus.  
  2.2 **Surplus Obligation:** Actions exceeding Baseline Duty, constituting the core work product of the BMS. Surplus is not optional; it is the measurable output of exemplary moral citizenship.  
  2.3 **The Moral Continuum Principle:** Consequentialist analysis reveals that the point of maximal societal benefit *is* the point of true duty. Therefore, actions falling short of generating Surplus inherently fail to meet our full ethical potential and require remediation.

  **3.0 The Surplus Obligation Coefficient (SOC)**  
  Employee contribution to the Moral Surplus is quantified using the proprietary SOC algorithm. The SOC is calculated quarterly and must be maintained at a positive value (>0).  
  3.1 **SOC Components:** The SOC assigns weighted values to three key cost vectors incurred while generating Surplus:  
  > *   **3.1.1 Emotional Labor (EL):** Measured in Standardized Discomfort Units (SDUs). Examples: Managing distressed stakeholders beyond protocol (5 SDUs/hr), suppressing personal reactions for communal harmony (3 SDUs/hr), extended empathetic listening exceeding baseline expectations (2 SDUs/hr).  
  > *   **3.1.2 Bodily Risk (BR):** Measured in Mitigated Hazard Points (MHPs). Examples: Commuting via bicycle in inclement weather instead of carpool (15 MHPs), volunteering for hazardous waste handling protocols (varies, see BR Appendix A), donating blood/plasma during critical shortages (10 MHPs per unit).  
  > *   **3.1.3 Foregone Opportunity (FO):** Measured in Standardized Opportunity Cost Units (SOCUs). Examples: Declining a higher-paying external offer to remain at BMS (SOCU value = salary differential %), forfeiting personal vacation days for urgent surplus project (10 SOCUs/day), attending mandatory weekend ethics intensives instead of family events (5 SOCUs/hr).  
  3.2 **SOC Calculation:**  
      `SOC = Σ (EL * W_el) + Σ (BR * W_br) + Σ (FO * W_fo)`  
      (Where W_el, W_br, W_fo are annually calibrated weighting factors reflecting current societal need priorities.)  
  3.3 **Mandatory Reporting:** All Surplus-generating actions must be logged in the MORALTRAC™ system within 72 hours, including estimated EL, BR, and FO values (training provided). Supporting documentation (e.g., declined offer letters, volunteer logs, commuter logs) is required for FO and BR claims exceeding baseline thresholds.

  **4.0 Performance Management & Progressive Discipline**  
  Maintaining a positive SOC is a condition of employment. Performance Reviews will focus significantly on SOC trends and component analysis.  
  4.1 **SOC < 0 (One Quarter):**  
  > *   Mandatory enrollment in Surplus Enhancement Coaching.  
  > *   Development of a Personal Surplus Acceleration Plan (PSAP).  
  4.2 **SOC < 0 (Two Consecutive Quarters):**  
  > *   Formal Performance Improvement Plan (PIP) initiated.  
  > *   Bi-weekly Surplus Accountability Meetings with supervisor.  
  > *   Probationary status; ineligibility for promotion or non-core bonus.  
  4.3 **SOC < 0 (Three Consecutive Quarters):**  
  > *   Review for possible demotion or termination.  
  > *   "Failure to maintain a positive SOC indicates a fundamental misalignment with BMS core values and operationalizes a deficit in societal contribution," necessitating separation.

  **5.0 The Saint Cap Provision (Ensuring Sustainable Surplus)**  
  5.1 **Rationale:** While maximizing Surplus is paramount, BMS recognizes the theoretical concern that relentless, maximal moral exertion could lead to agent burnout or an unsustainable lifestyle inconsistent with holistic well-being. Unchecked Surplus generation risks becoming personally "unattractive" or dehumanizing in its demands.  
  5.2 **The Cap:** To promote sustainable ethical excellence, no employee may log Surplus Actions constituting more than 35% of their total waking hours (calculated weekly).  
  5.3 **Implementation:**  
  > *   The MORALTRAC™ system will automatically flag attempts to log Surplus exceeding the 35% Saint Cap threshold.  
  > *   Flagged hours will be disqualified from SOC calculation for that week.  
  > *   Persistent attempts to exceed the Cap may trigger a Well-being Review to assess potential counterproductive zeal or misallocation of resources away from Baseline Duty fulfillment.  
  5.4 **Philosophical Underpinning:** This Cap operationalizes the cost-based defense of supererogation: true Surplus only exists *beyond* significant personal sacrifice, but there exists a threshold where the *absolute cost* to the agent becomes unsustainable, negating the net societal benefit. The Saint Cap defines this operational threshold.

  **6.0 Recognition & Equity**  
  6.1 **Asymmetry Principle:** Consistent with ethical theory, high SOC performers will receive public commendation, "Exemplary Surplus" badges, and priority for desirable assignments. However, it is crucial to note that blame accrues only for *failing to meet the Surplus Obligation* (SOC < 0), not for merely operating at Baseline Duty. Praise for exceeding the standard is inherent to the system; censure applies only to falling short of the quantified standard of excellence.  
  6.2 **Transparency & Fairness:** The SOC system, calibrated weights, and Saint Cap provide a clear, objective, and liberating framework. Employees are freed from subjective ambiguity about "how much is enough." The path to ethical excellence and career success is numerically defined and auditable. Strive diligently within your quantified capacity.

  *(This document supersedes all previous versions. MORALTRAC™ login and detailed SOC weighting tables available on the Intranet.)*
