answer: |-
  Right then, let's get your ducks in a row for Tuesday. First, the room:

  *   **The Liberals (Locke/Rawls Devotees):** Primed to see resistance through individual rights & social contracts. Suspicious of theological baggage, likely view Aquinas as a historical curiosity whose 'natural law' is pre-modern mystification. Will be listening for anachronism or attempts to baptise liberalism. Key trigger: Anything smelling of divinely-ordained hierarchy. Will pounce if you seem to privilege 'intermediate bodies' over the individual citizen.
  *   **The Thomists (Latin Readers):** Hyper-attentive to textual fidelity, historical context, and avoiding 'conciliarist contamination'. Know the *Sentences* commentary is lesser-cited and less polished than the *Summa*. Will scrutinise every Latin phrase and context. Deeply invested in Aquinas's unique *auctoritas*; won't tolerate him being reduced to a proto-conciliarist. Key trigger: Overstatement of structuralism or hints Aquinas endorsed popular sovereignty.
  *   **The Constitutional Lawyer (Founders Fanatic):** Thinks in mechanisms, precedents, and practical application. Constantly mapping onto US Constitution (separation of powers, impeachment, 2nd Amendment tangents possible). Wants to know *how* this 'collective right' actually functions – who pulls the trigger, procedurally? Key trigger: Vague medievalisms without clear modern corollary. Will ask "So what?" relentlessly.
  *   **Unspoken Dynamic:** Liberals & Lawyer might briefly unite against perceived 'Catholic corporatism'; Thomists might be oddly aligned with Liberals in pushing back against *your* structuralism if it seems too radical; Lawyer might find common cause with *your* structural checks against raw populism. Watch for crossfires.

  **Your Core Argument (Refresher):**
  Aquinas's apparent conservatism (*De Regno*, *ST* II-II Q42 on sedition) forbids *private* tyrannicide and disorder. BUT, in his *Scriptum super Sententiis* (Bk II, Dist. 44, Q.2, A.2), authority (*praelatio*) is framed as *delegated* power for the common good, held conditionally, not possessed inherently. Pair this with the later conciliarist principle (Gerson, d'Ailly etc.) that intermediate powers (estates, magistrates, councils) hold inherent (not delegated *from the prince*) authority within their sphere and *must* resist a tyrant to fulfil their function. Aquinas + this structural logic = A *collective, constitutional* right/responsibility of *instituted bodies* to resist/remove, distinct from Locke's *individual* right of revolution triggered by breach of trust. It's about *office*, not *person*.

  **Prep Sheet: Objections & Replies**

  1.  **The Liberal Objection: "You're smuggling Thomistic natural law and Catholic hierarchy into secular resistance theory, undermining individual autonomy."**
      *   **How it sounds:** "This is fascinating medieval theology, but utterly irrelevant to modern liberal democracies built on individual rights and popular sovereignty. You're trying to sneak in a divinely-sanctioned corporatism where 'intermediate bodies' – which sound suspiciously like unelected elites or the Church – get to veto the will of the people or their representatives. Aquinas's 'common good' is a pre-liberal, metaphysical abstraction. Locke's individual right is clearer, cleaner, and actually democratic."
      *   **Concede Up Front:** "Absolutely, Aquinas is *not* a liberal democrat. His framework *is* theological and hierarchical, rooted in a pre-modern understanding of natural law and society as an organic whole oriented towards a transcendent good. He wouldn't recognise Locke's atomised individual or Rawls's original position."
      *   **Hard-Hitting Reply:** "But here's the rub: Locke's individual right is *incredibly* destabilising and practically unworkable without collapsing into majoritarian tyranny or paralysis. Who decides the 'breach of trust'? Every disgruntled citizen? Aquinas's insight – via the structure – is that resistance *must* be mediated and legitimated by *instituted offices* with defined responsibilities *towards the community*. It prevents mob rule *and* autocracy. Isn't the *problem* with pure liberal resistance theory precisely its potential for anarchic individualism? Aquinas, read structurally, offers a *constitutional* brake, a way to resist tyranny *without* dissolving the polity into a war of all against all. That's a *functional* insight secular theory desperately needs, even if it jettisons the metaphysics."
      *   **Weakest Point in Your Reply:** The concession bites hard. The charge of "elitism" or "anti-democratic" sticks easily. Your reliance on "offices" begs the modern question: *Who legitimates these offices?* If not individual consent (Locke) or democratic procedure (Rawls), then what? Aquinas's answer (natural order/divine ordinance) is precisely what they reject. You risk sounding like you're advocating for unelected guardians.

  2.  **The Thomist Objection: "You're over-reading the *Sentences* commentary and projecting later conciliarism backwards onto Thomas, doing violence to his thought."**
      *   **How it sounds:** "The *Sentences* commentary is juvenilia, a lecture series, not Aquinas's mature, considered view like the *Summa*. You're isolating one passage on delegation while ignoring how he synthesises authority in *De Regno* and *ST*. More egregiously, conciliarism emerged *after* the Great Schism and *against* specific papal claims – it's anachronistic to suggest Aquinas, writing decades earlier and primarily about secular princes, endorsed it. You're making him a Gersonian avant la lettre. *Auctoritas* in Thomas is complex, but it's not the fragmented, inherently resistant structure you imply. Where does he *explicitly* say these 'intermediate powers' hold authority independent of the prince to *check* him?"
      *   **Concede Up Front:** "You're right, the *Sentences* commentary is an earlier, pedagogical work, less systematic than the *Summa*. And absolutely, Aquinas never wrote a treatise on conciliarism – the term and its full ecclesiological development are later. He doesn't provide a blueprint for constitutional resistance."
      *   **Hard-Hitting Reply:** "But the *principle* in the *Sentences* is crucial and never *retracted*: authority is *ministerial*, for the common good, not proprietary. This isn't 'projecting backwards', it's recognising the *logical implication* of that principle within the medieval understanding of *ordo*. If authority is delegated *for a purpose* (common good), and the prince subverts that purpose, the *source* of the delegation (God/natural law/the community - Aquinas is fuzzy here, but it's *not* the prince) implies a right of recall or correction. Conciliarism didn't invent this; it applied an existing Aristotelian/Thomistic *logic of office* to the Church crisis. Aquinas *does* discuss the role of lesser magistrates and the *multitudo* (e.g., *ST* I-II Q.90 A.3, Q.97 A.3 ad 3, *De Regno* I.6) in receiving/lawmaking, establishing a structure *beyond* the prince alone. My argument draws out the *resistant potential* inherent in that structure, implied by the delegation principle. To deny this is to risk making Aquinas a quietist."
      *   **Weakest Point in Your Reply:** The reliance on "logical implication" is vulnerable. Aquinas *is* fuzzy on the ultimate source of secular delegation (God? Community? Both?). The examples of lesser magistrates/multitudo are primarily about law*making* or counsel, not explicit *resistance/removal*. The Thomist can rightly demand *explicit* textual warrant for the *resistant function* of intermediates, which is scant. The conciliarist analogy, while useful, *is* a later development.

  3.  **The Lawyer's Objection: "This sounds like Locke's right of revolution with extra steps – why not just cut to the chase with the individual/social contract version?"**
      *   **How it sounds:** "Okay, so the 'intermediate bodies' – let's call them Congress, the States, maybe the Judiciary – get to decide the tyrant has to go? How is that different from the People (via representatives) exercising Locke's right? Isn't this just embedding the revolution trigger into the constitutional structure itself? And frankly, the US Founders *did* that – impeachment, amendment processes, federalism are all 'intermediate' checks against tyranny. Aquinas gives us nothing *new* except theology we don't need. Why prefer this medieval version?"
      *   **Concede Up Front:** "You're spot on that the *functional outcome* – a mechanism for removing a tyrant via constituted bodies – resembles aspects of the US system. And yes, Locke provides a powerful philosophical justification."
      *   **Hard-Hitting Reply:** "The crucial difference is *foundational* and *procedural*. Locke starts with the *dissolution* of government by individual/judgement; revolution is an *extra-constitutional* reset button. Aquinas's structure (as I read it) keeps the action *within* the constitutional order. The intermediates *uphold* the constitution by resisting the tyrant *in virtue of their office*, not as private citizens triggering a revolution. It's about *correcting* a malfunctioning part, not destroying the machine. This avoids Locke's terrifying leap into the abyss of the 'appeal to heaven'. Your Founders *feared* that Lockean moment – hence embedding checks *within* the structure (like Aquinas's intermediates imply), precisely to *avoid* needing a pure Lockean revolution. Aquinas offers a *continuous constitutional* theory of resistance, not a revolutionary one. It's more conservative, less cataclysmic."
      *   **Weakest Point in Your Reply:** The lawyer can retort: "But it *still* requires a judgement that the ruler is a tyrant! Locke's 'appeal to heaven' just becomes the 'appeal to the Senate/Judiciary/Estates'. Who guards the guardians? If they refuse to act, don't you *still* fall back on Locke?" Also, Aquinas provides zero *practical* detail on *how* the intermediates act collectively or enforce removal – the US mechanisms are vastly more developed.

  **The Objection You Pray For (But Must Prep For): Duty of Modern Citizens?**
  *   **How it sounds (Liberal/Lawyer likely):** "Alright, suppose we buy your structural reading. If medieval barons or bishops were 'intermediate authorities' with a duty to resist, who are the equivalents *now*? In a democracy, aren't *all citizens* ultimately the 'sovereign'? Doesn't that make *every voter* an 'intermediate authority' in some sense, holding a fragment of delegated power? And if so, doesn't your Thomistic-conciliarist logic imply not just a *right*, but an active *duty* for citizens to resist unjust laws *themselves*, individually or collectively? Isn't this actually *more* radical than Locke?"
  *   **Why it's Dangerous:** It collapses your careful distinction between *constituted office* and *private person*. It makes resistance *massively* individualised/direct, the opposite of your argument. It risks anarchism.
  *   **Your Defence (Don't Dodge!):** "A crucial point, and one where we *must* respect Aquinas's context. For Aquinas, 'authority' (*praelatio*) implied a specific *public office* with defined jurisdiction and responsibility – a judge, a lord, a bishop. It wasn't a diffuse 'citizenship' in a modern mass democracy. The *duty* to resist stems *from holding that office* and its charge towards the common good. The ordinary citizen's duty, per Aquinas, is primarily obedience to *just* laws and the *just* ruler (*ST* II-II Q.104). Resistance, even for intermediates, was a last resort for *extreme, persistent tyranny subverting the very end of the community*. Translating 'intermediate authority' directly to the modern democratic citizen is a category error. Modern democratic theory *might* construct a citizen's duty differently (e.g., civil disobedience theory), but that's *not* what Aquinas provides or what my argument claims. His structure protects against *both* tyranny *and* mob rule by insisting resistance be *institutional* and *responsible*."

  **Your Achilles Heel: The Killing Gap (Don't Hope, Address!)**
  *   **The Weak Spot:** Aquinas explicitly forbids *private* tyrannicide (*De Regno* I.6, *ST* II-II Q.64 A.3). He authorises intermediates to *resist* (*resistere*), which could include counsel, withdrawal of obedience, perhaps formal deposition procedures... but he **never explicitly says they can *kill* the tyrant**. Conciliarists later grappled with deposing (even executing) popes, but Aquinas stops short.
  *   **How to Defend the Gap:**
      1.  **Concede the Text:** "You're absolutely right. Aquinas does not, in any text I know, explicitly authorise an intermediate magistrate to personally assassinate or execute the tyrant. *De Regno*'s 'multitudo' or lesser powers are tasked with *removing* him, but the *method* isn't specified as killing."
      2.  **Contextualise 'Resistance':** "However, 'resistance' (*resistere*) in medieval political discourse, especially concerning tyranny, was a broad term. It encompassed a spectrum from non-cooperation to armed rebellion and deposition. Deposition of a monarch, in the medieval world, was rarely a bloodless affair and often implied or led to the ruler's death (e.g., Edward II, Richard II). Aquinas's focus was on the *legitimacy of the act* (who can do it) rather than prescribing the exact *means*."
      3.  **Logical Implication & Office:** "The core of my argument is the *authorisation to remove*. If the tyrant is removed by legitimate authority for the common good, and if he resists removal violently (as tyrants do), then the *use of force*, potentially lethal, becomes a necessary extension of the *judicial* or *public* act of removal. Aquinas permits public authority to kill malefactors for the common good (*ST* II-II Q.64 A.2 - licit for a public authority acting justly). If the intermediate power is legitimately *exercising a public function* in removing the tyrant (acting *tamquam iudex* - as a judge), then the *principle* of licit public killing *could* apply *if necessary*. He doesn't spell it out, but the *logic of his positions on authority, the common good, and public justice* allows for it within the act of legitimate deposition by the appropriate body. It's a gap, but not a fatal one if we understand resistance as a public, authoritative act encompassing necessary force."
  *   **Weakness of This Defence:** It *is* interpretive and relies on combining principles from different contexts (judicial killing + authority to remove). Aquinas might well have preferred exile or imprisonment if possible. The Thomists will pounce on the lack of explicit warrant.

  **Final Prep Thoughts:**
  *   **Lead with Structure:** Frame the talk around the *problem* of tyrannicide/revolution (Locke's abyss, liberal instability) and how Aquinas's *delegated authority* + *intermediate function* offers a *structural* solution.
  *   **Use "Mediated" not "Collective":** "Collective" can sound like mob. Emphasise "**mediated** resistance" or "**constitutional** resistance via **instituted authorities**".
  *   **Flag the *Sentences* Early:** Don't spring it. Acknowledge its status but argue for its consistent principle. Quote the key Latin if comfortable (*"praelatio... non habet rationem domini, sed ministri"* - authority has the character of a minister, not a master).
  *   **Embrace 'Conservative Radicalism':** Your Aquinas isn't a revolutionary, but his principles, when pushed by later events (like conciliarism), reveal a radical constitutional potential *within* the medieval order. That's the interesting tension.
  *   **Mind the Gap:** Weave your defence of the "killing gap" into the main presentation when discussing the *scope* of resistance authorised for intermediates. Don't wait for the objection.

  Break a leg. Expect a proper grilling, but your thesis has teeth. Just watch that "duty of citizens" rabbit hole – don't let them shove you down it. Right, time for a cuppa before you rehearse the sticky bits again. You'll recieve no mercy from that lot, so best be sharp.
