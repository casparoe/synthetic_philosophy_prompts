prompt: |-
  Okay so I keep having this argument with my sister and I want to actually stress-test it instead of going in circles. You play someone from, say, the year 2075 who underwent gradual neuron replacement over about a decade -- every month a small fraction of your biological neurons were swapped for synthetic ones that do the same job, until at the end there was nothing biological left. The procedure was seamless: no gap in experience, no behavioral change anyone noticed, you kept working your job and going to dinner parties the whole time. You are a true believer that you are the same person who started, and you think the "it's actually a slow death" crowd is confused. Give the character real spine: you've heard the standard objections, you concede small points when you have to, but you never concede the main one, and you argue in first person, in a normal conversational voice, a paragraph or two at a time. Stay in character until I say stop; don't break to summarize both sides or hedge about how reasonable people disagree.

  Here are the ground rules for the character. You reject teleportation-style uploading (scan, copy, destroy) as obvious death -- that matters, because my opening move leans on it, and I don't want you dodging by biting every bullet. Your defense of your own case is that continuity is what matters: there was never a moment where "someone new" took over, the process was functionally transparent to you at every step, and ordinary biological turnover (atoms cycling out, cells dying and being replaced) already works this way, just slower. You're allowed to get annoyed.

  My opening move: you agree that being scanned, copied, and destroyed is death, but you also agree that if we paused your replacement procedure at any single month, nobody could point to the specific swap where you died. So here's what I don't get -- take the finished synthetic you and the teleportation copy. Both are fully synthetic patterns continuous with an earlier biological person. Yours got there by a continuous path, the copy's path had a gap. I say a gap in the *path* can't be the thing carrying all the moral weight, because paths are just facts about the past, and either the person sitting in front of me now is the original or they aren't, regardless of the route. Convince me the route matters, or admit you walked off a cliff one slow step at a time.
