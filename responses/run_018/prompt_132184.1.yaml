prompt: |-
  Hey, I'm a PhD student in comparative philosphy and I've been going in circles on something that keeps coming up in both classical texts and modern organizational ethics. There's this move I keep seeing where someone grabs just one half of a Confucian relational pair—usually the subordinate's side, like the duty of loyalty or filial deference—and treats it as ironclad and universal, but when you bring up the matching obligation on the other side—like the superior's duty to care, correct, or reciprocate—they suddenly say that's just 'aspirational' or 'depends on context.' I saw it in a management seminar where a CEO talked about running the company 'like a family' and demanded total zhong-style loyalty from employees, but when people asked about job security or benevolent leadership he said business isn't family, it's meritocracy. I also see it in family dynamics where parents invoke xiao constantly but act like they don't have to be virtuous parents to earn it. It's not just hypocrisy, because people seem genuinely convinced they're being consistent within role ethics. Is there an established term in Confucian scholarship for this specific one-directional extraction of hierarchical obligations? I know about asymmetry and reciprocity in roles, but this feels more like selectively freezing one half of a dyadic norm. If there's no exact concept, could you name and define it, with clear boundaries—especially how it's different from plain hypocrisy, from the idea that roles just have different weights, and from cases where the superior genuinely can't fulfill the reciprocal side? Before answering, think carefully about the structure of Confucian relational norms—maybe map how xiao, zhong, and shu actually interact—and please start with your bottom line in the very first sentence, then reasoning, no preamble, don't restate my question. Write in American English, and approach this as an expert in Confucian philosophy and applied ethics.
reasoning: |-
  Okay, the user is a PhD student in comparative philosophy dealing with a recurring issue in both classical texts and modern organizational ethics. They've observed a pattern where only the subordinate's duties in Confucian relational pairs are emphasized as absolute, while the superior's corresponding obligations are dismissed as aspirational or context-dependent. Examples include a CEO demanding loyalty without providing job security, and parents insisting on filial piety without being virtuous themselves. The user wants to know if there's an established term for this selective application and how it differs from hypocrisy or unavoidable failures in reciprocity.

  First, I need to recall the structure of Confucian relational norms. Confucian ethics is based on reciprocal role relationships like ruler-minister, father-son, etc. Each role has mutual obligations: loyalty (zhong) from the subordinate and benevolence (ren) from the superior, filial piety (xiao) from children and parental care from parents. Reciprocity is central, but not symmetrical—superiors have different responsibilities. The Golden Rule (shu) involves empathy and understanding others' perspectives, which should prevent one-sided demands.

  The user mentions examples where superiors enforce subordinates' duties but neglect their own, labeling reciprocal duties as "aspirational." This isn't just hypocrisy; the perpetrators believe they're consistent within role ethics. So, I need to distinguish this from simple hypocrisy, different role weights, and cases where superiors can't fulfill duties.

  Looking for existing terms: "Moral self-serving bias" comes to mind, but it's from psychology, not Confucian scholarship. "Weberian instrumentalization of Confucianism" refers to historical misuse. Neither fits perfectly. The closest might be "unilateral role essentialism" or "reciprocity denial," but these aren't established terms. The user might need a newly coined term.

  Defining the concept: It's the selective enforcement of subordinate obligations while exempting superiors by reclassifying their duties as non-binding. Key boundaries: Unlike hypocrisy, it's a systemic distortion of role ethics. Different from asymmetry because it denies reciprocity's necessity. Also distinct from incapacity, as it's a deliberate deontological downgrade.

  The user's deeper needs: As a PhD student, they likely seek academic rigor for their analysis, possibly for a thesis or publication. They need a precise concept to critique modern misapplications of Confucianism. Their frustration suggests a desire to address real-world ethical issues beyond theoretical discussion.

  I should structure the response: Start with the bottom line—no established term, but define a new one. Then explain Confucian reciprocity, analyze the distortion, differentiate from related concepts, and provide the coined term with clear boundaries. Ensure clarity and academic depth without jargon.
answer: |-
  **Bottom line:** There is no single established term for this specific distortion, but we can define it as **"Reciprocity Denial" (Hùnìng Xiāngdài Zhé 互逆相待折)**, a deliberate deontological downgrade where superiors selectively enforce the subordinate's *yi* (duty/righteousness) as absolute while reclassifying their own reciprocal *ren* (benevolence/reciprocity) as merely aspirational or contextually optional.

  **Reasoning:**

  1.  **Core Structure of Confucian Roles:** Confucian relationships (e.g., ruler-minister, father-son, husband-wife) are fundamentally *reciprocal* and *differentiated*. Each role entails specific obligations (*yi*):
      *   **Subordinate:** Duties like *zhong* (loyal devotion), *xiao* (filial piety), *jing* (respect).
      *   **Superior:** Duties like *ren* (benevolence, humaneness), *hui* (kindness), *ci* (compassion), *yi* (righteousness *in their specific role*), and crucially, the responsibility to "correct" (*zheng*) the subordinate.
      *   **Shu (Reciprocity/Empathy):** This Golden Rule principle ("Do not impose on others what you yourself do not desire," Analects 15.24) binds the system, demanding that superiors understand the subordinate's position and act accordingly. It renders the roles interdependent.

  2.  **The Distortion ("Reciprocity Denial"):** The described move violates this reciprocity by:
      *   **Extracting Subordinate *Yi*:** Treating the subordinate's duty (e.g., loyalty, filial deference) as an absolute, non-negotiable obligation (*yi*), demanding strict compliance regardless of context.
      *   **Degrading Superior *Ren*:** Simultaneously treating the superior's corresponding duty (e.g., benevolent care, correction, reciprocation) not as binding *yi*, but as a discretionary act of grace (*en*), an ideal (*yuanwang*), or something contingent on external factors ("meritocracy," "context").
      *   **Violating *Shu*:** This asymmetry fundamentally breaks *shu*. The superior demands absolute sacrifice (*zhong*, *xiao*) they would not accept if roles were reversed, without providing the care (*ren*) they would desire.

  3.  **Distinguishing Boundaries:**
      *   **vs. Hypocrisy:** Hypocrisy is *knowingly* failing to practice what one preaches. "Reciprocity Denial" is a *doctrinal distortion* where the actor genuinely believes their interpretation is correct within a warped understanding of "role ethics." They argue the *superior's role simply doesn't demand* the reciprocal duty as a strict obligation in the same way, effectively redefining the role itself unilaterally.
      *   **vs. Role Asymmetry/Different Weights:** Confucianism *is* asymmetrical – roles have different duties. However, reciprocity remains *essential*; the duties are *mutually entailing*. A ruler failing *ren* loses legitimacy (Mencius 1B8). "Reciprocity Denial" denies this entailment, claiming the subordinate's duty persists *unconditionally* even if the superior abandons theirs. The asymmetry of roles is misused to justify an asymmetry in *obligation enforcement*.
      *   **vs. Genuine Incapacity:** There are cases where a superior *cannot* fulfill duties (e.g., a destitute parent cannot provide materially, an overwhelmed manager cannot offer personalized mentorship). Classical texts acknowledge this and often adjust expectations for the subordinate's duty (e.g., focusing on respect/jing over material support in poverty). "Reciprocity Denial" occurs when the superior *can* fulfill the duty but *chooses* not to, while *still demanding* the subordinate's full duty and *explicitly denying* the binding nature of their own reciprocal obligation. It's a *deontological downgrade*, not circumstantial failure.

  4.  **Why "Reciprocity Denial" (Hùnìng Xiāngdài Zhé):**
      *   **Hùnìng (互逆):** Mutual inversion/reversal – captures the perversion of the reciprocal dynamic.
      *   **Xiāngdài (相待):** Mutual treatment/reciprocity – the core concept being distorted.
      *   **Zhé (折):** Breaking, snapping, discounting – signifies the deliberate fracturing or devaluing of one side of the obligation.
      *   This term emphasizes the active, structural distortion of the *yi-ren/shu* framework, moving beyond simple hypocrisy to identify a specific mode of misappropriating Confucian role ethics to enforce hierarchy without accountability. It highlights the *denial* of the reciprocal duty's binding force as the key mechanism.
