  i was arguing with my roommate last week about whether politicans can ever have clean hands—she's in a poli sci course and i'm just trying to understand, but now i'm stuck on this dirty hands problem in politics. i want to take the 2015 Greek bailout referendum and run it through Walzer's framework, but with a twist i'm calling "representational dirty hands." you know the basic story: Tsipras calls the referendum in July, the people vote Oxi by a huge margin, then he turns around and signs the third bailout memorandum anyway. classic dirty hands is about the leader getting morally stained to save the state, but here the stain feels different—he didn't just betray his own socialist principles, he overrode an explicit democratic mandate that he himself solicited. so map it carefully: who are the actual players (Tsipras, Varoufakis, the Eurogroup, the voters themselves?), what were the real options and payoffs (was Grexit actually available, or was the "no" vote always going to be symbolic given ECB liquidity and capital controls?), and what does dirty hands theory say he should have done? then be honest about where the theory breaks: does it even recognize democratic legitimacy as a separate moral cost, or is it only about individual conscience versus state necessity? and what does this case show about the theory—does it need an expansion to cover "representational" dirt where the politician gets dirty by misrepresenting the people's will rather than ruling over them, or does the episode reveal that dirty hands was always about rulers, not representatives, and applying it here is a category mistake?
