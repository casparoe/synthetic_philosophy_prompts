answer: |-
  This is a brilliantly framed case study that exposes critical tensions in dirty hands theory. Let's break it down using Walzer's framework and your "representational dirty hands" lens:

  **1. Mapping the 2015 Greek Bailout Referendum onto Walzer:**

  *   **The Players:**
      *   **Alexis Tsipras (SYRIZA Leader/PM):** The central figure facing the dirty hands dilemma. His role as elected representative is crucial.
      *   **Yanis Varoufakis (Finance Minister):** Resigned *before* the referendum, arguing the Eurogroup negotiation was coercive theater. Represents the "principled exit" option.
      *   **The Eurogroup (ECB, EC, IMF - "The Institutions"):** The external force imposing the harsh choice. Embodies the "necessity" of the state's survival (within Eurozone).
      *   **Greek Voters:** Sovereign people expressing a clear democratic mandate via referendum ("Oxi" - 61.3% No).
      *   **The Greek State/Economy:** The entity whose survival Tsipras was ostensibly trying to ensure.

  *   **The Situation & Real Options (Crucially Assessed):**
      *   Tsipras framed the referendum as a choice: Accept harsh austerity (Yes) or reject it, strengthening his hand for a better deal (No). He argued "No" did *not* mean Grexit.
      *   **Reality Check:** By July 2015, the situation was dire:
          *   **Capital Controls:** Banks were closed, ATM withdrawals severely limited.
          *   **ECB Liquidity Chokehold:** The ECB had *not* increased Emergency Liquidity Assistance (ELA), meaning Greek banks were days from collapse.
          *   **Grexit Viability:** Preparing a new currency, securing basic imports (food, medicine, fuel), and avoiding catastrophic bank runs/economic implosion within days was logistically and politically near-impossible. Grexit, while theoretically possible, meant immediate, massive humanitarian and economic catastrophe far exceeding the proposed austerity.
      *   **Tsipras's Post-Referendum Choices:**
          1.  **Defy Mandate, Sign Bailout:** Accept the harsh terms despite the "Oxi" vote to keep Greece in the Eurozone, avoid immediate collapse, and secure liquidity.
          2.  **Honor Mandate, Pursue Grexit:** Attempt to implement the "No" vote by leaving the Euro, facing immediate chaos and uncertain, likely devastating, outcomes.
          3.  **Resign:** Hand the poisoned chalice to someone else after the vote revealed the mandate's impracticality.

  *   **Walzer's Dirty Hands Applied:**
      *   **The "Dirty" Act:** Signing the bailout memorandum (austerity) after explicitly soliciting and receiving a mandate to reject it.
      *   **The "Necessary" Act:** Preventing the immediate collapse of the banking system and state functions, avoiding humanitarian disaster (arguably greater evil than the bailout terms).
      *   **The Moral Staining:**
          *   **Classic:** Betraying socialist principles (anti-austerity, anti-Troika).
          *   **Representational (Your Twist):** Betraying the explicit, democratically expressed will of the people *he asked for*. This is the core of your insight.

  **2. What Dirty Hands Theory Says He *Should* Have Done:**

  *   Walzer argues a leader *must* sometimes do the necessary but morally wrong act (sign the bailout) to save the state. They *must* get their hands dirty. They should then feel guilty and seek absolution/punishment.
  *   **Applied Here:** Walzerian logic suggests Tsipras *had* to sign the bailout to prevent catastrophe (Grexit chaos). The democratic mandate, while significant, would likely be secondary to the overwhelming necessity of state survival in Walzer's calculus. The leader bears the burden of this knowledge and acts *despite* the mandate.

  **3. Where the Theory Breaks & Your "Representational Dirty Hands" Insight:**

  *   **Democratic Legitimacy as a Separate Moral Cost:** This is the **critical flaw** exposed by your case. Walzer's framework primarily focuses on the tension between:
      *   Individual conscience/morality (e.g., anti-austerity principles, prohibition on lying/deception).
      *   Necessity of state survival/consequentialism (preventing collapse).
      *   **The Missing Element:** The *source of the leader's authority and mandate* – democratic representation. Overriding a direct, explicit popular mandate isn't just dirtying hands with a necessary evil; it's violating the foundational contract of representative democracy *itself*. Walzer doesn't adequately theorize this specific form of "dirt" – the betrayal of representation.
  *   **Was Grexit Really an Option?** Walzer assumes leaders face genuine, knowable choices between evils. Here, the feasibility of the "honorable" path (implementing "Oxi") was highly questionable *before* the vote due to ECB actions and capital controls. Did Tsipras solicit a mandate for something he knew was impossible? This turns the "dirty act" from a tragic necessity *after* the vote into a potential act of bad faith *before* it, compounding the representational betrayal.
  *   **Category Mistake? Ruler vs. Representative?** You hit a nerve. Walzer's archetypal dirty hands examples (e.g., a mayor torturing a terrorist to find a bomb) involve rulers acting *over* a populace for its survival. Tsipras was acting *as* the representative *of* the populace, having specifically asked for their instruction. Applying the classic ruler-focused dirty hands framework to this representative dynamic *is* problematic. The "dirt" isn't just on the leader's conscience from violating principles; it's a stain on the *relationship* between representative and represented.
  *   **The "Representational Dirt":** This case screams for the expansion you propose. Tsipras got dirty not (only) by violating socialist principles or doing a distasteful deal, but by:
      1.  Potentially misrepresenting the feasibility of the "No" option when calling the referendum (knowing ECB constraints).
      2.  Soliciting a specific mandate ("Vote No for a better deal").
      3.  Explicitly overriding that mandate days later.
      This "dirt" is unique: it's the contamination of the democratic process and the erosion of trust inherent in representation. The cost is paid in democratic legitimacy and civic trust, not just leaderly guilt.

  **4. What This Case Shows About Dirty Hands Theory:**

  *   **It Needs Expansion:** The Greek case powerfully demonstrates that Walzer's framework is insufficient for modern representative democracies. We *need* a concept like "representational dirty hands" to account for the specific moral cost of betraying a democratic mandate, especially one actively solicited by the leader.
  *   **It Exposes Feasibility Gaps:** The theory often assumes clearer choices than reality allows. When the "principled" path (honoring the mandate) is rendered practically impossible *by external forces before the choice is even made* (ECB chokehold), the leader's actions move from tragic necessity towards potential deception or incompetence *before* the dirty act occurs.
  *   **Highlights the Problem of Legitimacy:** The core justification for dirty hands is saving the *state*. But in a democracy, the state's legitimacy is derived *from* the people. Overriding the people's explicit will to "save" the state fundamentally undermines that legitimacy. Is saving the *institutions* worth sacrificing their *democratic foundation*? Walzer doesn't adequately address this.

  **Conclusion:**

  Your instinct is correct. Applying Walzer's classic dirty hands theory to the 2015 Greek referendum reveals its limitations. Tsipras's act *was* dirty hands in the Walzerian sense (necessary evil for state survival). However, the *overwhelming source of the "dirt" and its unique moral cost* stemmed from the **representational betrayal** – soliciting and then overriding a democratic mandate. This case demands an expansion of dirty hands theory to explicitly incorporate **"representational dirty hands,"** recognizing the distinct moral violation and cost associated with leaders compromising their fundamental role as faithful agents of the popular will, especially when they actively invoked that will. The episode shows that while dirty hands might be about rulers, *democratic* dirty hands is crucially about the fraught relationship between the representative and the represented. It wasn't a category mistake to apply the framework; it was an act that exposed a category the original framework neglected.
