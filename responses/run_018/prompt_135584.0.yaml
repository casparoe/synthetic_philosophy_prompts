answer: |-
  ## MEMORANDUM

  **To:** Participatory Climate Budget Advisory Board  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Voting Membership for Flood-Infrastructure Plan Vote  

  We’re at a critical juncture defining the *demos* for our watershed flood-infrastructure vote. Both sides raise valid concerns: excluding those materially affected by flooding undermines legitimacy, while over-expansion risks diluting accountability. The corporate proxy proposal, however, introduces problematic legal and equity issues we should avoid.  

  After careful consideration, I recommend adopting a **"Resident + Non-Resident Property Owner" criterion**. This means:  
  *   **Full Vote:** All current city residents.  
  *   **Full Vote:** Non-residents who own taxable property (residential, commercial, or agricultural) *within the specific flood-infrastructure project zone* (as defined in Appendix A of the plan).  

  **Why this balances the competing principles:**  

  1.  **Takes "All-Affected" Seriously:** Property owners in the project zone have a direct, material stake – their assets are literally on the line. Flooding doesn't respect residency borders; damage to their property impacts them financially and personally. Excluding them creates a fundamental legitimacy gap where those bearing significant costs have no voice.  
  2.  **Preserves Tangible Accountability:** This group is defined by a clear, verifiable legal status (property ownership/deed) linked directly to the impacted geography. Unlike "anyone in the watershed," it avoids nebulous definitions based on potential impact or subjective connection, reducing the "stakeholder soup" concern. Property owners are also readily identifiable through existing tax rolls.  
  3.  **Rejects Corporate Proxy:** Granting votes through employers creates indirect, weighted influence divorced from individual human stakes. It privileges economic actors over citizens/residents and risks corporate interests dominating individual voices. Property ownership ties the vote to a specific, vulnerable asset held by a human (or legal entity, but the vote is tied *to the property*, not the corporate structure).  

  **Addressing the Strongest Dissent:**  
  The core dissent argues that expanding beyond residents fundamentally dissolves democratic accountability to the city polity that must ultimately govern and maintain infrastructure. They rightly fear creating a precedent where transient or minimally affected interests dilute the voice of those living with daily consequences and paying general taxes.  

  **Concession & Safeguard:**  
  I concede this expansion *does* slightly shift traditional resident-centric accountability. To mitigate this:  
  *   **Concession:** We **exclude** non-resident property owners from voting on *any other aspect* of the participatory budget, *only* this specific flood plan impacting their property.  
  *   **Safeguard:** Eligibility is strictly limited to *individual* owners of record or trustees of small trusts (excludes large corporate holdings, REITs, etc.). Verification uses the official tax database as of [Date TBD - e.g., 3 months prior to vote].  

  **Implementation Timeline:**  

  1.  **By Nov 15:** Finalize project zone map & eligibility rules; verify data-sharing protocols with County Tax Assessor.  
  2.  **Nov 16 - Dec 15:** Outreach campaign to identified non-resident property owners (mail, email, targeted ads) explaining eligibility & registration process.  
  3.  **Dec 1 - Jan 15:** Registration period for non-resident property owners (via secure online portal with tax PIN verification).  
  4.  **Jan 16 - Feb 15:** Voter list finalization & challenge period.  
  5.  **March 1 - 31:** Voting period (all eligible voters).  

  This approach ensures those bearing significant, direct risk have a voice without abandoning a verifiable, materially-defined community of interest. It rejects both unjust exclusion and unworkable expansion. I look forward to refining this proposal together on Tuesday.  

