  We are designing a two-hour session on Simpson's paradox for a humanities graduate reading group. The audience is sharp and articulate but has only school-level statistics. The goal is to make them understand Simpson's paradox as a structural feature of data aggregation, not just a trick. We must build the concept step by step, address common misconceptions, and clearly separate settled mathematical facts from contested methodological interpretations.

  **Core Teaching Plan Structure:**

  1. **Introduction (10 minutes):** 
     - State the session's goal: to explore how data can tell different stories when looked at in different ways, focusing on a specific phenomenon called Simpson's paradox.
     - Present a real-world example (without the paradox yet) to set the stage and engage interest.

  2. **Foundational Concepts (20 minutes):**
     - Review conditional and marginal comparisons.
     - Introduce the idea of stratifying (grouping) data and why we might do it.

  3. **The Paradox Revealed (30 minutes):**
     - Present a carefully chosen example that shows the reversal. 
     - Guide the group through the arithmetic to see the reversal and verify it's not a calculation error.

  4. **Dissecting the Paradox (30 minutes):**
     - Break down why the reversal happens: the role of group sizes and group-specific rates.
     - Address common misconceptions at this point.

  5. **Interpretation and Controversy (20 minutes):**
     - Discuss how to decide which variable to condition on (the contested part).
     - Emphasize that the mathematics does not dictate which view is "correct"; it depends on the context and research question.

  6. **Wrap-up and Assessment (10 minutes):**
     - Review the key lessons.
     - Use a quick activity to check understanding.

  **Carrying Example:**

  We need an example that is clear, relatable, and has the necessary features. The Berkeley graduate admissions data is classic but may be complex because it involves multiple departments and the reasons for the reversal (which are contested). The kidney stone treatment example is also well-known but might be too medical. 

  I recommend building a small, invented dataset that is neutral and easy to grasp. For instance, a hypothetical example about the effectiveness of two teaching methods (Method A vs. Method B) in two schools (School X and School Y). The data should show:

  - When we look overall, Method A has a higher success rate.
  - But when we break it down by school, Method B has a higher success rate in each school.

  **Features the example must have:**
  - Two groups (e.g., two schools) that are very different in size and also in the baseline (e.g., one school has students who are easier to teach).
  - The treatment (or condition) being compared (e.g., two teaching methods) should have different success rates in each group and the reversal should be clear.

  **Features to avoid:**
  - Do not use an example where the stratifying variable is clearly a mediator (like an intermediate outcome) because that complicates the causal story.
  - Avoid real examples with heavy baggage (like Berkeley admissions, which might lead to discussions about discrimination that we cannot resolve in this session).

  **Invented Example: Teaching Methods in Two Schools**

  Suppose we have two schools, School X and School Y, and two teaching methods, A and B. We want to see which method has a higher pass rate.

  **Overall (Marginal) Table:**
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 90   | 60   | 150  | 60%       |
  | B      | 140  | 110  | 250  | 56%       |

  **Stratified by School:**

  *School X (easier school, but note: we don't say that until later):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 80   | 40   | 120  | 66.7%     |
  | B      | 20   | 10   | 30   | 66.7%     |

  *School Y (harder school):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 10   | 20   | 30   | 33.3%     |
  | B      | 120  | 100  | 220  | 54.5%     |

  In each school, Method A and Method B have the same pass rate in School X (66.7%), but in School Y, Method B has a higher pass rate (54.5% vs. 33.3%). However, overall, Method A has a 60% pass rate and Method B has 56%. 

  Wait, we want a reversal: the overall should show Method A better, but in each school, Method B should be better? Actually, in the above, in School Y, Method B is better, but in School X they are the same. We need to adjust.

  Revised to show reversal:

  *School X (easier school):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 90   | 10   | 100  | 90%       |
  | B      | 180  | 20   | 200  | 90%       |

  *School Y (harder school):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 30   | 70   | 100  | 30%       |
  | B      | 10   | 90   | 100  | 10%       |

  Now, in each school, Method A has a higher pass rate (90% vs 90% in X? Wait, equal in X, but in Y: 30% vs 10%). We want Method B to be better in each school? Let's fix:

  We want:
  - Overall: Method A worse than Method B? But we want the reversal so that the marginal comparison is reversed from the conditional.

  Classic Simpson: marginal association is reversed from the conditional.

  So let's make:

  *Overall:*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 120  | 80   | 200  | 60%       |
  | B      | 190  | 110  | 300  | 63.3%     |

  So overall, Method B is better (63.3% vs 60%).

  Now break down:

  *School X (larger school, easier):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 100  | 20   | 120  | 83.3%     |
  | B      | 20   | 30   | 50   | 40%       |

  Wait, that doesn't add up to overall. Let's recast.

  We need:
  - School X: Method A has a higher pass rate than Method B.
  - School Y: Method A has a higher pass rate than Method B.

  But then we want the overall to show Method B better? That requires that the groups are of different sizes and that the method is applied more in one group than the other.

  So:

  *School X (large school, but hard):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 10   | 90   | 100  | 10%       |
  | B      | 50   | 50   | 100  | 50%       |

  *School Y (small school, easy):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 90   | 10   | 100  | 90%       |
  | B      | 9    | 1    | 10   | 90%       |

  Now, overall:
  Method A: Pass = 10+90 = 100, Fail=90+10=100, Total=200 -> 50%
  Method B: Pass=50+9=59, Fail=50+1=51, Total=110 -> 53.6%

  So overall, Method B is better (53.6% vs 50%). But in each school, Method A is at least as good? In School X: 10% vs 50% (so Method B is better) and in School Y: 90% vs 90% (equal). That doesn't show a reversal in the direction we want.

  We want the conditional (within each school) to show one method better, but the marginal to show the other.

  Ideal:

  - In both schools, Method A has a higher pass rate than Method B? Then the overall must also have Method A higher? Not necessarily if the group sizes and the distribution of the method are different.

  But we want the reversal: so we want the conditional to show one method better in each group, but the marginal to show the other.

  So:

  Let me construct:

  *School X (large school, but with low pass rates overall and more students using Method B):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 20   | 20   | 40   | 50%       |
  | B      | 90   | 30   | 120  | 75%       |

  *School Y (small school, high pass rates, but more students using Method A):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 80   | 10   | 90   | 88.9%     |
  | B      | 10   | 10   | 20   | 50%       |

  Now, in School X: Method B is better (75% vs 50%)
  In School Y: Method A is better (88.9% vs 50%)

  But overall:
  Method A: Pass=20+80=100, Fail=20+10=30, Total=130 -> 76.9%
  Method B: Pass=90+10=100, Fail=30+10=40, Total=140 -> 71.4%

  So overall, Method A is better (76.9% vs 71.4%). But in each school, we have a mix: in X, B is better; in Y, A is better. That's not the classic Simpson where the same method is worse in every group but better overall.

  Classic Simpson: the same treatment is worse in every subgroup but better overall? Or vice versa.

  Let me try again:

  We want:
  - In both schools, Method B has a higher pass rate than Method A? But then the overall must be weighted average? How can it reverse?

  We need:
  - In both schools, Method A has a higher pass rate than Method B, but overall Method B has a higher pass rate.

  How? By having Method A used more in the school with a lower overall pass rate.

  Example:

  *School X (hard school, large):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 30   | 70   | 100  | 30%       |
  | B      | 10   | 40   | 50   | 20%       |

  *School Y (easy school, small):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 60   | 40   | 100  | 60%       |
  | B      | 90   | 10   | 100  | 90%       |

  Wait, in School X: A is 30% vs B 20% -> A better.
  In School Y: A is 60% vs B 90% -> B better.

  Not both the same.

  We want both to have the same direction? Then we need:

  *School X (hard school, large):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 100  | 200  | 300  | 33.3%     |
  | B      | 10   | 10   | 20   | 50%       |

  *School Y (easy school, small):*
  | Method | Pass | Fail | Total | Pass Rate |
  |--------|------|------|-------|-----------|
  | A      | 20   | 30   | 50   | 40%       |
  | B      | 90   | 10   | 100  | 90%       |

  Now, in School X: Method B better (50% vs 33.3%)
  In School Y: Method B better (90% vs 40%)

  Overall:
  Method A: Pass=100+20=120, Fail=200+30=230, Total=350 -> 34.3%
  Method B: Pass=10+90=100, Fail=10+10=20, Total=120 -> 83.3%

  So overall, Method B is better (83.3% vs 34.3%) and also in each school. So no reversal.

  To get reversal we need the method that is worse in each subgroup to be better overall. That requires that the method is applied more in the group with a higher baseline.

  Example (classic):

  *Kidney stone treatment:*

  Treatment A: open surgery
  Treatment B: percutaneous nephrolithotomy (small puncture)

  Stratified by stone size:

  Small stones:
    Treatment A: 93% success (81/87)
    Treatment B: 87% success (234/270)

  Large stones:
    Treatment A: 73% success (192/263)
    Treatment B: 69% success (55/80)

  Overall:
    Treatment A: 78% success (273/350)
    Treatment B: 83% success (289/350)

  So overall, Treatment B is better, but in both small and large stones, Treatment A is better.

  This is a real example. But we can make a similar invented one.

  Invented example to mimic:

  *Example: Two Treatments for a Disease in Two Hospitals*

  Hospital 1 (handles severe cases, mostly uses Treatment A):
  | Treatment | Success | Failure | Total | Success Rate |
  |-----------|---------|---------|-------|--------------|
  | A         | 200     | 100     | 300   | 66.7%        |
  | B         | 10      | 10      | 20    | 50%          |

  Hospital 2 (handles mild cases, mostly uses Treatment B):
  | Treatment | Success | Failure | Total | Success Rate |
  |-----------|---------|---------|-------|--------------|
  | A         | 50      | 50      | 100   | 50%          |
  | B         | 99      | 1       | 100   | 99%          |

  Now, in Hospital 1: Treatment A is better (66.7% vs 50%)
  In Hospital 2: Treatment A is 50% vs Treatment B 99% -> so Treatment B is better.

  But we want both to show the same method being worse? Let's adjust:

  We want Treatment A to be worse in both hospitals? But then how can it be better overall? We need Treatment A to be applied more in the hospital with a higher success rate? But in the above, Hospital 1 has lower success rates for both treatments.

  Let's reassign:

  Hospital 1 (severe cases) should have lower success rates for both treatments than Hospital 2 (mild). And we want Treatment A to be worse in both.

  So:

  Hospital 1 (severe, large number of patients, mostly Treatment A):
  | Treatment | Success | Failure | Total | Success Rate |
  |-----------|---------|---------|-------|--------------|
  | A         | 100     | 200     | 300   | 33.3%        |
  | B         | 20      | 20      | 40    | 50%          |

  Hospital 2 (mild, fewer patients, mostly Treatment B):
  | Treatment | Success | Failure | Total | Success Rate |
  |-----------|---------|---------|-------|--------------|
  | A         | 60      | 40      | 100   | 60%          |
  | B         | 190     | 10      | 200   | 95%          |

  Now, in Hospital 1: Treatment B is better (50% vs 33.3%)
  In Hospital 2: Treatment B is better (95% vs 60%)

  But overall:
  Treatment A: Success=100+60=160, Total=300+100=400 -> 40%
  Treatment B: Success=20+190=210, Total=40+200=240 -> 87.5%

  So overall, Treatment B is better, and in each hospital it is better. No reversal.

  To get the reversal, we need that the treatment that is worse in each group is better overall. That means we need the worse treatment to be applied more in the group with a higher overall success rate.

  But in the kidney stone example, Treatment A (the one that is better in each group) is applied more in the severe cases (which have lower success rates) and Treatment B is applied more in the mild cases (which have higher success rates). So overall, Treatment B looks better because it was used more on mild cases.

  So in our invented example:

  We want:
  - Treatment A is better in both groups, but overall worse.

  Set:

  Hospital 1 (mild cases, high success rates, mostly Treatment B):
  | Treatment | Success | Failure | Total | Success Rate |
  |-----------|---------|---------|-------|--------------|
  | A         | 95      | 5       | 100   | 95%          |
  | B         | 490     | 10      | 500   | 98%          |

  Hospital 2 (severe cases, low success rates, mostly Treatment A):
  | Treatment | Success | Failure | Total | Success Rate |
  |-----------|---------|---------|-------|--------------|
  | A         | 300     | 200     | 500   | 60%          |
  | B         | 5       | 5       | 10    | 50%          |

  In Hospital 1 (mild): Treatment A is 95%, Treatment B is 98% -> so Treatment B is better.
  In Hospital 2 (severe): Treatment A is 60%, Treatment B is 50% -> Treatment A is better.

  But we want the same treatment to be better in each group? That's not happening.

  Let's make in both groups Treatment A is better:

  Hospital 1 (mild):
    Treatment A: 95% (95/100)
    Treatment B: 90% (450/500)  [changed]

  Hospital 2 (severe):
    Treatment A: 60% (300/500)
    Treatment B: 50% (5/10)

  Now, in both groups, Treatment A is better.

  Overall:
  Treatment A: Success=95+300=395, Total=100+500=600 -> 65.8%
  Treatment B: Success=450+5=455, Total=500+10=510 -> 89.2%

  But that's not right because 65.8% vs 89.2% shows Treatment B is better overall? But we wanted Treatment A to be better in each group. How can it be worse overall? Because Treatment A was used more in the severe group.

  So:

  Hospital 1 (mild, large group, mostly Treatment B):
    Treatment A: 95/100 = 95%
    Treatment B: 450/500 = 90%   [so A better]

  Hospital 2 (severe, small group, mostly Treatment A):
    Treatment A: 300/500 = 60%
    Treatment B: 5/10 = 50%      [so A better]

  Overall:
  Treatment A: (95+300)=395 successes out of (100+500)=600 -> 65.8%
  Treatment B: (450+5)=455 successes out of (500+10)=510 -> 89.2%

  So overall, Treatment B has a higher success rate (89.2% vs 65.8%) even though in both hospitals Treatment A is better.

  That's the reversal.

  But note: in Hospital 1, Treatment B was used 500 times vs A 100 times. In Hospital 2, Treatment A was used 500 times vs B 10 times.

  So the example works.

  We'll use this invented medical example. It is neutral enough and shows the reversal.

  **Dependency Order and Sequence:**

  1. **Start with the Overall Picture (10 minutes):**
     - Present the overall table: Treatment A vs Treatment B, showing that Treatment B has a higher overall success rate.
     - Ask: Which treatment is better? They will say Treatment B.

  2. **Stratify by Hospital (15 minutes):**
     - Reveal that the data comes from two hospitals and show the two stratified tables.
     - In each hospital, Treatment A has a higher success rate? But in our example, in Hospital 1 (mild) Treatment A is 95% vs B 90% -> so A is better. In Hospital 2 (severe) Treatment A is 60% vs B 50% -> A is better.
     - Ask: Now which treatment is better? They should say Treatment A.

  3. **Arithmetic Check (5 minutes):**
     - Verify the numbers: show the overall is a weighted average. Calculate the overall for Treatment A: (95+300)/(100+500) = 395/600 ≈ 65.8%. For B: (450+5)/(500+10)=455/510≈89.2%. And the group rates are as given.

  4. **Puzzle and Paradox (10 minutes):**
     - State the paradox: How can Treatment A be better in every hospital but worse overall? 
     - This is the moment the reversal registers as a genuine puzzle. They will see that it's not an arithmetic mistake.

  5. **Why the Reversal Happens (20 minutes):**
     - Break down the weights: 
       - Treatment A was used mostly in the severe hospital (500 of its 600 cases were in the severe hospital, which has a lower success rate for any treatment).
       - Treatment B was used mostly in the mild hospital (500 of its 510 cases were in the mild hospital, which has a high success rate).
     - Show that the overall rate is a weighted average of the group rates, and the weights are the number of cases in each group. 
       - Treatment A: (100/600)*95% + (500/600)*60% = (1/6)*0.95 + (5/6)*0.6 ≈ 0.1583 + 0.5 = 0.6583.
       - Treatment B: (500/510)*90% + (10/510)*50% = (500/510)*0.9 + (10/510)*0.5 ≈ 0.9804*0.9 + 0.0196*0.5 ≈ 0.8824 + 0.0098 = 0.8922.
     - The reversal happens because Treatment A was disproportionately applied in the hospital with a lower success rate (the severe one) and Treatment B in the hospital with a higher success rate.

  6. **Addressing Misconceptions (20 minutes):**
     - **Misconception 1: "Statistics can be made to say anything."** 
       - When: When they see the reversal.
       - Response: This is not about manipulating the numbers. Both tables are correct. The issue is that the overall table ignores the hospital context. We must think about what is the right way to look at the data for the question we are asking.
     - **Misconception 2: "The aggregate number is simply wrong."**
       - When: After seeing the group breakdown.
       - Response: The aggregate is not wrong; it's a real summary. But it might be misleading if we don't account for the hospital effect. The aggregate is a valid description of the overall experience, but it might not be the right way to compare the treatments because it confounds the treatment effect with the hospital effect.
     - **Misconception 3: "The subgroup number is automatically the true one."**
       - When: After we show the group breakdown.
       - Response: The subgroup analysis is also correct, but it doesn't automatically mean it's the only truth. We must consider whether the stratifying variable (hospital) is a confounder. For instance, if we want to know which treatment is better for a patient, we might condition on the hospital (or the severity) because the treatment effect might depend on severity. But if we want to know which treatment is better overall in a population that is distributed differently, then the aggregate might be appropriate? (But note: this is the contested part.)
     - **Misconception 4: "The reversal is just an artifact of unequal group sizes."**
       - When: During the breakdown.
       - Response: It is not just unequal group sizes; it's the combination of unequal sizes and the difference in the group-specific rates. Show that if the success rates were the same in both hospitals, then unequal group sizes wouldn't cause a reversal.

  7. **Interpretation and the Contested Part (20 minutes):**
     - Emphasize the settled part: The arithmetic of weighted averages can cause reversals when groups are pooled if the stratifying variable is associated with both the treatment assignment and the outcome.
     - The contested part: How to decide which variable to condition on? In our example, should we condition on hospital? It depends on the question. 
       - If the hospitals represent different patient populations (like severity), then we might want to condition on that to see the treatment effect. 
       - But if the question is about allocating resources at a system level (and we expect the same distribution of patients), then the overall might be relevant.
     - Also, note: conditioning on a variable that is affected by the treatment (like a post-treatment variable) can introduce bias. We are not addressing causality here, just association.

  8. **Wrap-up and Assessment (10 minutes):**
     - Review: Simpson's paradox occurs when a trend appears in several groups but disappears or reverses when the groups are combined. It happens because the groups are of different sizes and have different base rates.
     - Assessment: Give them a new small dataset (without the reversal) and ask them to adjust one group's size to see if they can make a reversal happen. Or ask them to explain in their own words why the reversal happened in our example.
     - Alternatively, ask: "If you were a patient, which treatment would you choose? Why? And if you were a hospital administrator allocating resources at a regional level, which treatment would you promote? Why?" This highlights the context dependence.

  **What to Leave Out:**
  - Do not get into causal diagrams (like DAGs) or advanced methods (like regression adjustment) to resolve the paradox.
  - Do not try to resolve the Berkeley admission case (which is complex and involves multiple departments and potential discrimination) because it would take us too far.
  - Avoid any causal language (like "effect") unless carefully qualified as associational.

  By the end, they should understand that the paradox is a real feature of aggregation and that the choice between marginal and conditional depends on the context. They should be able to articulate the role of the stratifying variable and the weights.
answer: |-
  ### Teaching Plan: Simpson's Paradox in Statistical Reasoning  
  **Audience:** Humanities graduate students (sharp, articulate, minimal stats background).  
  **Time:** 120 minutes.  
  **Goal:** Understand Simpson's paradox as a structural feature of data aggregation, not a trick. Separate settled math from contested interpretation.  
  **Carrying Example:** Invent a simple, neutral dataset (e.g., **"Treatment Success Rates in Two Clinics"**). Avoid real-world examples (Berkeley/kidney stones) to sidestep preconceptions.  

  ---

  ### **Key Features of the Example**  
  1. **Must-have**:  
     - Two groups (e.g., Clinic Urban and Clinic Rural).  
     - A binary outcome (e.g., treatment success/failure).  
     - Reversal: Treatment A outperforms B overall, but underperforms in both clinics.  
     - Unequal group sizes (Urban has more patients) and unequal outcome baselines (e.g., Urban has higher success rates for both treatments).  

  2. **Must-avoid**:  
     - Real-world baggage (e.g., Berkeley admissions’ gender bias debates).  
     - Small sample sizes (to prevent confusion with statistical noise).  
     - Mediating variables (e.g., "recovery time" that’s affected by treatment).  

  **Example Dataset:**  
  | **Overall**        | Treatment A | Treatment B |  
  |--------------------|-------------|-------------|  
  | Success            | 110         | 120         |  
  | Total Patients     | 200         | 150         |  
  | **Success Rate**   | **55%**     | **80%**     |  

  | **Clinic Urban**   | Treatment A | Treatment B |  
  |--------------------|-------------|-------------|  
  | Success            | 90          | 30          |  
  | Total Patients     | 100         | 50          |  
  | **Success Rate**   | **90%**     | **60%**     |  

  | **Clinic Rural**   | Treatment A | Treatment B |  
  |--------------------|-------------|-------------|  
  | Success            | 20          | 90          |  
  | Total Patients     | 100         | 100         |  
  | **Success Rate**   | **20%**     | **90%**     |  

  - **Reversal:**  
    - Overall: Treatment B better (80% > 55%).  
    - Urban: Treatment A better (90% > 60%).  
    - Rural: Treatment A worse (20% < 90%).  

  ---

  ### **Session Sequence**  
  #### **I. Foundation: Conditional vs. Marginal Comparisons (30 mins)**  
  - **Goal:** Establish why we stratify data and how weights affect averages.  
  - **Activities:**  
    1. **Simple Averages Warm-up:**  
       - Compare average heights of two species of trees. Then split by soil type.  
       - *Key Insight:* "Group-specific rates can differ from the overall average."  
    2. **Weighted Averages Exercise:**  
       - Calculate overall success rates for Treatment A:  
         `(90% × 100 + 20% × 100) / 200 = 55%`.  
       - *Emphasize:* The overall rate depends on group sizes (weights).  
  - **Why now:** Students need to see arithmetic isn’t arbitrary.  

  #### **II. Introduce the Paradox (30 mins)**  
  - **Goal:** Make the reversal feel like a genuine puzzle.  
  - **Activities:**  
    1. **Present Overall Data:**  
       - "Which treatment is better? (B: 80% > 55%)."  
    2. **Stratify by Clinic:**  
       - "In Urban, A is better. In Rural, A is worse. But overall, B wins. Why?"  
    3. **Spot Check Arithmetic:**  
       - Have students verify the numbers (no mistakes).  
  - **Why now:** The paradox only lands if they trust the math.  

  #### **III. Dissect the Mechanism (30 mins)**  
  - **Goal:** Show how weighting and lurking variables cause reversal.  
  - **Activities:**  
    1. **Compare Group Sizes and Baselines:**  
       - Urban: Larger, higher success rates (90% A, 60% B).  
       - Rural: Smaller, lower success rates (20% A, 90% B).  
       - Treatment A is used more in Rural (100/200 vs. 50/150 for B).  
    2. **Visualize the Weights:**  
       - Draw bar charts: Group sizes as widths, success rates as heights.  
       - Show how Rural’s low success "drags down" A’s overall rate.  
  - **Key Insight:**  
    - Reversal occurs when:  
      (a) Groups have different baselines (e.g., Urban better outcomes),  
      (b) Treatment allocation correlates with group size (e.g., A used in low-success groups).  

  #### **IV. Tackle Misconceptions (20 mins)**  
  Address these *during/after dissection*:  
  1. **"Statistics can be made to say anything."**  
     - **When:** After showing reversal.  
     - **Response:** "Both tables are correct; the paradox arises from how we pool data, not manipulation. The issue is *which* comparison answers your question."  
  2. **"The aggregate number is wrong."**  
     - **When:** After stratifying.  
     - **Response:** "The aggregate isn’t wrong—it’s a valid marginal summary. But it hides how group differences drive the outcome."  
  3. **"Subgroup numbers are the ‘true’ answer."**  
     - **When:** After seeing stratified data.  
     - **Response:** "Subgroups aren’t automatically ‘truer.’ Conditioning on clinic adjusts for its effect, but you must justify *why* clinic is relevant."  
  4. **"Reversal is just unequal group sizes."**  
     - **When:** During mechanism dissection.  
     - **Response:** "Unequal sizes alone don’t cause reversal; it’s the combo of unequal sizes *and* differing group rates. If rates were equal, sizes wouldn’t matter."  

  #### **V. Contested vs. Settled (10 mins)**  
  - **Settled (Emphasize):**  
    - Pooling data can reverse associations due to weighting.  
    - Mathematics explains *how* it happens (group sizes × group rates).  
  - **Contested (Flag clearly):**  
    - **Which stratification is relevant?**  
      - "Should we condition on clinic? Only if it’s a confounder (e.g., clinic severity affects treatment choice and outcome)."  
    - **Does reversal imply causation?**  
      - "No! This is associational. Causality requires more (e.g., randomization)."  
    - **What’s the ‘right’ answer?**  
      - "Depends on the question: If you’re a clinic director, aggregate may matter. If you’re a patient, subgroup (by severity) may be better."  

  #### **VI. Assessment & Wrap-up (10 mins)**  
  - **Check Understanding:**  
    - *Activity:* Give a new dataset (e.g., exam pass rates by school). Ask:  
      1. "Calculate overall and subgroup rates."  
      2. "Explain why reversal occurs in terms of weights and baselines."  
    - *Success Sign:* They articulate: "Group sizes and baseline differences combined cause the reversal."  
  - **Conclusion:**  
    - "Simpson’s paradox is a feature of weighted averages—not a trick. Always ask: *What are we conditioning on, and why?*"  
  - **Deliberately Omit:**  
    - Causal diagrams (too advanced).  
    - Real-world resolutions (e.g., "Berkeley was about department choice").  
    - Statistical controls (e.g., regression).  

  ---

  ### **Why This Sequence?**  
  - **Dependency Order:**  
    Foundation (weights) → Paradox (puzzle) → Mechanism (resolve puzzle) → Misconceptions (prevent backlash) → Contested (contextualize).  
  - **Example Choice:** Invented data avoids distractions; clinics are neutral and show unequal sizes/baselines clearly.  
  - **End Goal:** Students see paradox as structural by identifying the "weighting trap" in new examples and rejecting misconceptions.
