prompt: |-
  hey — i'm TAing a first-year course on formal systems and i need help writing the grading rubric before submissions land. the course runs on Hofstadter-style puzzles (the MIU system is the running example: you start from MI, you've got the four rules, and the question is whether MU is derivable) and the recurring theme is jumping out of the system — the move where you stop pushing symbols around inside the system and start reasoning about the system, like noticing the invariant on the number of I's and concluding from outside that MU can't be reached. students keep turning in puzzle solutions where they've done something that looks like a JOOTS and i genuinely can't tell whether it's a real one or a cheat, so before i read any more of what's been written about metalevel reasoning i want the spec: what does a theory of legitimate system-escalation have to deliver for it to be good enough to grade with. give me the requirements, each with the case that motivates it, and tell me which ones you think are non-negotiable versus prejudices of one camp.

  cases i want covered, at minimum. (1) the MU-type case: the escape is to a mathematically provable invariant about all reachable strings — uncontroversial, so it's a calibration point rather than a test. (2) the consistency-type case: you jump out to see that a sentence the system can't decide is nevertheless true, using resources that aren't obviously available one level down. (3) the case where 'jumping out' is really just moving into a bigger formal system — proving the consistency of arithmetic inside set theory, say — and i want the theory to tell me whether that counts as escaping at all or whether it's just more of the same one level up. (4) the clear cheats: quietly changing the rules halfway through a derivation, reading off a diagram's accidental features, or announcing that since the system is 'only a game' the answer doesn't matter. (5) the self-embedded jumper: a procedure that inspects and modifies its own source, or a convention that rewrites the rule for rewriting the rules — something that is itself inside what it's jumping out of, which i suspect is where most of the interesting constraints come from. (6) the case where the jump is purely verbal, the same moves re-described in a shinier vocabulary with no added force — my co-TA claims a lot of celebrated jumps are this. (7) feel free to add one or two cases you think the literature has underused, especially anything involving a jumper whose meta-reasoning can be wrong.

  two things i care about most. first, whether some subset of the requirements can't all be satisfied together — my hunch is that 'the criterion must be general enough to license jumps nobody has thought of yet' and 'the criterion must be statable sharply enough to be applied mechanically by a grader' collide, because whatever criterion you write down is itself a system someone could jump out of, and i want you to say whether that self-application problem is real or whether i'm hand-waving. second, which requirement does the most work in excluding candidates; i'd guess it's the one that stops the theory from collapsing into 'a jump is legitimate iff the reasoning is sound', but you tell me. then, briefly, score three contenders against your own list: the invariant-hunting view (a real jump finds a conservation law provable in ordinary mathematics about the system), the hierarchy view (legitimate escalation is climbing a well-founded object-language/metalanguage stack, illegitimate is looping back into yourself), and the deflationary view that there is no special phenomenon here and JOOTS-ing is just reasoning where you happened to be reasoning about a formalism — and if your spec is compatible with the deflationist being right, say so, because that would mean i'm grading something that isn't there. keep the weight on the requirements and their cases; the scorecard can be short.
reasoning: |-
  We are designing a rubric for grading "jumping out of the system" (JOOTS) solutions in a formal systems course. The goal is to distinguish legitimate meta-level reasoning from cheats or inadequate attempts.

  The cases that must be covered are:

  1. **MU-type case**: Using a provable invariant (e.g., the number of I's mod 3) to show non-derivability. This is the gold standard and sets the baseline.

  2. **Consistency-type case**: Using external reasoning to show that an undecidable sentence in the system is true (e.g., Gödel's sentence for Peano Arithmetic).

  3. **Bigger formal system**: Proving consistency of a system in a stronger one (e.g., consistency of PA in ZFC). Does this count as escaping?

  4. **Clear cheats**: Changing rules mid-derivation, using accidental features (like a diagram's specifics), or dismissing the system as "just a game".

  5. **Self-embedded jumper**: A procedure that inspects and modifies its own source code, or a rule that rewrites the rules. Is this a legitimate form of meta-reasoning?

  6. **Purely verbal jump**: Repackaging the same reasoning in meta-language without added value.

  We also care about:

  - The tension between generality (allowing novel jumps) and sharpness (for grading).
  - Which requirement is most effective at excluding bad cases.

  We are to evaluate three views:

  - **Invariant-hunting view**: Legitimate jumps find invariant properties (provable in ordinary math).
  - **Hierarchy view**: Legitimate escalation is climbing a well-founded tower of metalanguages (no self-reference).
  - **Deflationary view**: There is nothing special about JOOTS; it's just reasoning about a formalism.

  **Requirements for a Theory of Legitimate System-Escalation**

  We need a set of criteria that a solution must meet to count as a legitimate jump. Each requirement is motivated by a case.

  1. **Requirement of Invariance (or Preservation under Rules)**
     - *Motivation*: Case 1 (MU) and Case 5 (self-embedded). In the MU system, the invariant (number of I's mod 3) is preserved by every rule. For self-embedded systems, we require that the invariant is preserved even when the rules change according to the meta-rule.
     - *Content*: The jump must identify a property that is (a) true of the initial state(s), and (b) preserved by every rule application (including any meta-rules that might be applied in a self-embedded system). This property must then imply the conclusion (e.g., non-derivability).
     - *Non-negotiable?* Yes, for the core cases (like MU). Without an invariant, it's hard to see how one could have a proof of non-derivability or truth.

  2. **Requirement of External Justification**
     - *Motivation*: Cases 2 (consistency) and 3 (bigger system). We want to ensure that the reasoning is not circular and that it uses resources not available in the original system. This also covers Case 4 (cheats) by excluding reasoning that is not externally justified (like changing rules arbitrarily).
     - *Content*: The reasoning must be justified by a framework that is external to the system being analyzed and that is accepted as sound. The framework must be strictly more powerful than the original system (in a well-defined sense) or at least not reducible to it without circularity. For example, in Case 2, Gödel's sentence is shown true by a meta-argument that PA is sound (which is not provable in PA). In Case 3, if we use ZFC to prove the consistency of PA, then ZFC is the external framework. However, if the same framework is used to analyze itself (as in self-reference) then we must be cautious.
     - *Non-negotiable?* Yes, but with care. The key is to avoid circularity. The framework must be one that we have independent reasons to trust.

  3. **Requirement of Non-Triviality (or Added Value)**
     - *Motivation*: Case 6 (purely verbal) and Case 4 (cheats). We want to avoid solutions that merely restate the problem in meta-language without providing new insight or power.
     - *Content*: The jump must provide a conclusion that is not derivable (or not easily derivable) within the system by direct symbol manipulation. Moreover, the reasoning must not be a trivial repackaging of the same steps. For instance, in the MU system, the invariant proof is much shorter than any exhaustive search and gives a general method.
     - *Non-negotiable?* Probably yes. Without this, any description of a derivation in the system could be called a jump (by calling it meta).

  4. **Requirement of Formalizability (in Principle)**
     - *Motivation*: Cases 2, 3, and 5. We need to ensure that the jump is not ad hoc and could in principle be formalized in an appropriate meta-system. This also addresses the concern that the jump might be vague or rely on accidental features (Case 4).
     - *Content*: The reasoning must be expressible in a formal system (which may be the bigger system in Case 3, or a meta-system for Case 2). This does not mean the student must formalize it, but that they must be able to sketch how it could be formalized. For example, the invariant in the MU system is formalizable in arithmetic. In the self-embedded case, the meta-rule must be clearly defined and the invariant must hold under it.
     - *Non-negotiable?* Not entirely, but highly desirable. It helps exclude cheats that rely on diagrams or arbitrary changes. However, for a first-year course, we might relax this to "clarity and precision".

  5. **Requirement of Well-Foundedness (Avoiding Infinite Regress)**
     - *Motivation*: Case 3 (bigger system) and Case 5 (self-embedded). We want to avoid situations where the "jump" is just deferring the problem to a higher level without resolution. Also, self-embedded systems must not lead to circularity or infinite chains.
     - *Content*: The meta-reasoning must terminate in a foundation that is not itself in need of the same kind of jump for its justification. This might mean that the meta-system is finitary, or that we accept it as given. In a self-embedded system, the process of rule modification must be well-founded (e.g., by having a measure that decreases). This requirement is tricky because it might rule out some legitimate forms of self-reference (like a total self-verifying system) but we are cautious about those.
     - *Non-negotiable?* Debatable. Some might argue that a tower of systems is acceptable if each step is justified. But for grading, we want the student to have a clear stopping point. This requirement is important for excluding cheats that try to hide an infinite regress.

  6. **Requirement of Correctness**
     - *Motivation*: All cases, but especially Case 7 (which we add: a jumper that can be wrong). We must ensure that the reasoning is sound. A jump that leads to a false conclusion is not legitimate, even if it looks meta.
     - *Content*: The reasoning must be logically valid and the premises must be true (or at least, not known to be false). This is a basic requirement for any proof.
     - *Non-negotiable?* Absolutely. However, note that in the context of the course, the student might present a jump that is incorrect, but we are grading the method. So we must distinguish: the jump might be legitimate in form but incorrect in execution. For the rubric, we require that the reasoning is correct (for full credit) but we might give partial credit for a legitimate form that has a flaw.

  **Added Case: The Fallible Jumper (Case 7)**
     - We add a case where the meta-reasoning is incorrect. For example, a student might claim an invariant that isn't preserved, or use an external argument that is flawed. This tests whether the theory can account for the possibility of error and still recognize the attempt as a jump (even if flawed). The requirement of correctness (above) then becomes critical: we must not accept an incorrect jump as successful, but we might accept it as a valid attempt at a jump if it meets the other criteria.

  **Tension between Generality and Sharpness**

  The self-application problem is real. If we write a criterion for legitimate jumps, then that criterion is itself a system that one might try to jump out of. This leads to a potential infinite regress. However, for grading, we can break the regress by stipulating that we are working within a fixed meta-system (say, ZFC or even informal mathematics) and that the jump must be formalizable in that meta-system. This makes the requirement of formalizability (in a given meta-system) crucial. But note: this might rule out truly novel jumps that require a new kind of formalism. Therefore, we must balance by allowing the meta-system to be extensible.

  The requirement that does the most work in excluding candidates is **External Justification**. It prevents circularity and ensures that the jump adds value by using a richer framework. It also helps exclude cheats (like changing rules) and purely verbal jumps (if the external justification is missing).

  **Scoring the Three Views**

  - **Invariant-hunting view**:
     - Requirements met: 
          - Invariance: Yes, by design.
          - External Justification: Only if the invariant is proved in an external system (which it usually is). So partially.
          - Non-Triviality: Usually, because invariants are not found by direct derivation.
          - Formalizability: Typically yes, since invariants are mathematical properties.
          - Well-Foundedness: Not directly addressed. The invariant might be proved in a system that itself needs a jump.
          - Correctness: Required, but not specific to the view.
     - Overall: Strong for Case 1, but less clear for Case 2 (consistency) and Case 3 (bigger system). It might not cover self-embedded systems (Case 5) if the invariant must be static. Also, Case 7 (fallible jumper) is covered only if the invariant is correctly identified.

  - **Hierarchy view**:
     - Requirements met:
          - External Justification: Yes, because each step moves to a higher meta-level.
          - Well-Foundedness: Yes, by requiring the tower to be well-founded.
          - Formalizability: Yes, because each level is formal.
          - Invariance: Not directly. A hierarchy might be used to define an invariant, but it's not required.
          - Non-Triviality: Usually, because moving up a level adds power.
          - Correctness: Required.
     - Overall: Good for Cases 2 and 3, but might be too rigid for Case 5 (self-embedded) which might involve a reflective system that doesn't fit a strict hierarchy. Also, Case 1 (MU) is not inherently hierarchical.

  - **Deflationary view**:
     - Requirements met: 
          - This view denies that there is a special phenomenon. Therefore, it would not provide a criterion to distinguish jumps from non-jumps. But note: if we take the requirements above, then the deflationary view might say that any reasoning about the system that meets the requirements (especially External Justification and Non-Triviality) is a jump. 
          - However, the deflationary view might not require any of the criteria to be met because it sees no difference. Thus, it fails to provide a grading rubric.
     - Overall: The deflationary view is compatible with our requirements if we say that a jump is just any reasoning that satisfies the requirements. But without the requirements, it doesn't help. Therefore, for grading, we must reject the deflationary view as a basis for a rubric because it doesn't give us the needed distinctions.

  **Conclusion on Views**: None of the views satisfies all requirements perfectly. The invariant view is good for some cases, the hierarchy for others. We might need a hybrid approach.

  **Rubric Design**:

  For the grading rubric, we can use the requirements as criteria. Each solution must:

  1. **Identify an invariant/property**: The solution must state a property that holds initially and is preserved by every rule (including any meta-rules if present). [Covers Case 1, helps with Case 5]
  2. **Use an external framework**: The justification for the invariant (or the meta-reasoning) must be based on a framework beyond the original system. [Covers Cases 2, 3, 4, 6]
  3. **Provide added value**: The reasoning must be more efficient, general, or insightful than direct derivation. [Covers Case 6]
  4. **Be precise and formalizable**: The reasoning must be clearly stated and in principle formalizable. [Covers Case 4]
  5. **Be well-founded**: The meta-reasoning must not lead to an infinite regress. [Covers Case 3 and 5]
  6. **Be correct**: The reasoning must be logically sound and lead to the correct conclusion. [Covers Case 7]

  Then, for each requirement, we assign points (e.g., 0-2) based on how well the solution meets it.

  Given the tension between generality and sharpness, we note that the rubric itself is applied in a meta-system (informal mathematics) and we do not require the student to jump out of the rubric. We rely on the grader's judgment, guided by the criteria.

  In practice, the requirement of **External Justification** and **Non-Triviality** will be the most critical for weeding out cheats and pseudo-jumps.
answer: |-
  Below is a structured theory of legitimate system-escalation (JOOTS) for your grading rubric. It includes **requirements** (each motivated by a case), their **negotiability**, a **resolution** for the self-application/generality-sharpness tension, the **most exclusionary requirement**, and a **scorecard** for the three views. The requirements are designed to be actionable for graders, while covering your cases (including two added cases: **fallible jumpers** and **emergent properties**).

  ---

  ### **Requirements for Legitimate System-Escalation**
  Each requirement is grounded in your cases and designed to filter out cheats, verbal repackaging, or invalid "jumps." Non-negotiable requirements are essential for legitimacy; negotiable ones reflect philosophical splits.

  1. **Preservation Under Rules (Non-negotiable)**  
     - **Case motivation**: MU system (Case 1) and self-embedded jumpers (Case 5).  
     - **Requirement**: The jump must identify a property (e.g., invariant, consistency condition) that is *provably preserved* under all system rules *as defined*. For self-modifying systems (Case 5), meta-rules must be explicitly declared and preservation must hold across rule-rewrites.  
     - **Why non-negotiable?** Prevents cheats like ad hoc rule changes (Case 4) or accidental diagram features. Forces the jumper to engage with the system’s actual mechanics.  
     - **Grading tip**: Look for proof that the property holds for all derivations, not just examples.

  2. **Meta-System Accountability (Non-negotiable)**  
     - **Case motivation**: Bigger formal systems (Case 3), consistency jumps (Case 2), and clear cheats (Case 4).  
     - **Requirement**: Resources used in the jump (e.g., mathematical axioms, inference rules) must be *explicitly stated* and *strictly stronger* than the object system. If the meta-system is another formal system (e.g., proving PA consistency in ZFC), it must not be trivially reducible to the object system (e.g., no "PA + Con(PA)").  
     - **Why non-negotiable?** Distinguishes genuine escalation (Case 2/3) from cheating or question-begging (Case 4). Forces students to justify *why* their reasoning isn’t just "more of the same."  
     - **Grading tip**: Reject jumps that smuggle in object-system axioms without new machinery.

  3. **Non-Circular Gain (Negotiable)**  
     - **Case motivation**: Purely verbal jumps (Case 6) and bigger formal systems (Case 3).  
     - **Requirement**: The jump must yield *new deductive power*—e.g., deciding undecidable sentences (Case 2), compressing proofs, or enabling new classes of conclusions. Repackaging existing proofs in meta-language (e.g., "We see that rule 3 applies") without gains is invalid.  
     - **Why negotiable?** "Gain" is context-dependent. Some argue all JOOTS imply gain (non-negotiable); deflationists (Case 6) see it as rhetorical.  
     - **Grading tip**: Reward efficiency (e.g., invariant proofs vs. brute-force derivation) or undecidability resolutions. Demote "insightful" rephrasing.

  4. **Formalizability (Non-negotiable)**  
     - **Case motivation**: Fallible jumpers (added case), self-embedded systems (Case 5), and clear cheats (Case 4).  
     - **Requirement**: The jump must be *mechanically verifiable* in principle (e.g., as an algorithm or proof in a well-defined meta-system). This excludes appeals to intuition, diagrams, or subjective "seeing" (e.g., "MU feels impossible").  
     - **Why non-negotiable?** Ensures objectivity for grading and excludes cheats. Accommodates fallibility: a *legitimate* jump can be *wrong* (e.g., incorrect invariant), but it must be falsifiable.  
     - **Grading tip**: Accept flawed but mechanically checkable arguments; reject "it’s obvious" claims.

  5. **Well-Foundedness (Negotiable)**  
     - **Case motivation**: Bigger formal systems (Case 3) and self-embedded jumpers (Case 5).  
     - **Requirement**: The jump must not create *infinite regress* (e.g., no self-validating systems without a termination guarantee). Meta-systems can be higher in a hierarchy (e.g., object → meta → meta-meta), but must not loop back on the object system.  
     - **Why negotiable?** Hierarchy advocates (e.g., Tarski) demand this; self-reference enthusiasts (e.g., in computability) accept reflective jumps if they halt (e.g., quines).  
     - **Grading tip**: Penalize jumps requiring "meta-meta" reasoning without a foundation (e.g., "and so on ad infinitum").

  6. **Emergent Property Binding (Added case)**  
     - **Case motivation**: Underused in literature—e.g., proving a system’s behavior by simulating it (like a cellular automaton) and observing emergent properties (e.g., entropy increase). Tests if JOOTS can leverage *global patterns* not inferable from local rules.  
     - **Requirement**: Emergent properties must be *rigorously linked* to system rules (e.g., via statistical mechanics or computation theory). Bans surface-level pattern-matching (e.g., "strings look like whales").  
     - **Why include?** Covers jumps where the meta-reasoning isn’t syntactic (e.g., probabilistic invariants).

  ---

  ### **Resolving Tensions**
  - **Generality vs. sharpness**: The self-application problem **is real** but manageable. Your rubric can require Formalizability (requirement 4) in a *fixed* meta-system (e.g., Peano Arithmetic), avoiding infinite regress by fiat. This sacrifices full generality but ensures gradability. For novelty, allow "new" jumps if they satisfy preservation (1) and accountability (2) relative to the course’s mathematical baseline (e.g., undergraduate set theory).  
  - **Most exclusionary requirement**: **Meta-System Accountability (2)**. It excludes:  
    - "Cheats" (Case 4) via unmapped resources.  
    - "Bigger system" non-jumps (Case 3) if the meta-system is too weak or circular.  
    - Deflationary repackaging (Case 6) by demanding new resources.  
    It forces students to *show their work* for why the jump isn’t internal.

  ---

  ### **Scorecard for Contending Views**
  Evaluate three views against the requirements. **Legitimacy** = satisfies all non-negotiable requirements (1, 2, 4). **Deflationism compatibility** = if the view denies JOOTS is distinct, it fails as a grading tool.

  | View                     | Requirements met                                                                 | Fails                                                                          | Deflationism-compatible? | Verdict for Grading        |
  |--------------------------|----------------------------------------------------------------------------------|--------------------------------------------------------------------------------|--------------------------|----------------------------|
  | **Invariant-Hunting**    | 1 (strong), 4 (strong), emergent case (good).                                    | 2 (weak: assumes ordinary math is "external"), 3 (unclear if gain is inherent), 5 (ignored). | No (affirms JOOTS as special). | **Partial**: Good for Case 1/emergent, poor for Cases 2–3. Use for puzzles with algebraic invariants. |
  | **Hierarchy**            | 2 (strong), 3 (strong for gain), 5 (strong).                                     | 1 (weak: invariants optional), 4 (assumed but not enforced), emergent case (poor). Self-embedded jumps (Case 5) often fail well-foundedness. | No (requires strict hierarchy). | **Partial**: Excels for Cases 2–3, fails Case 5 and emergent cases. Use for logic-heavy proofs. |
  | **Deflationary**         | None (denies JOOTS is special).                                                  | Rejects all non-negotiable requirements (calls them "rephrasing").             | Yes (core claim).         | **Unusable**: If correct, you’re "grading nothing." But requirement 2 (accountability) blocks this—students must show new resources. |

  **Conclusion**: Deflationism is **incompatible** with your rubric—it collapses JOOTS into "reasoning about formalisms," violating the need for a distinct grading criterion. Use a hybrid: require **Preservation (1) + Accountability (2) + Formalizability (4)** as the core, with **Non-Circular Gain (3)** and **Well-Foundedness (5)** as tiebreakers for nuance.

  ---

  ### **Practical Rubric Skeleton**
  For each submission, grade (0–3 points) on:  
  1. **Preservation**: Property identified and proven invariant under rules.  
  2. **Accountability**: Meta-resources declared and properly external.  
  3. **Gain**: New conclusions/efficiency vs. object system.  
  4. **Formalizability**: Argument is mechanically verifiable.  
  5. **Well-Foundedness**: No regress/self-reference loops (bonus).  

  **Threshold**: 10+ points (max 15) to pass as "legitimate JOOTS." Cases 4 (cheats) and 6 (verbal) will fail Preservation and Accountability. Case 5 (self-embedded) may fail Well-Foundedness but pass if meta-rules are explicit.
