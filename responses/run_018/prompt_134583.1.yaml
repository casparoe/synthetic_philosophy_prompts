prompt: |-
  I'm drafting a chapter on informed consent for clinical trials and have settled on a fairly demanding view that I'm not fully sure I can defend: valid consent requires not merely the absence of coercion and deception, but what I call counterfactual epistemic autonomy—the subject must be able to articulate, in vocabulary they already possess rather than one they've been taught for the occasion, the central risks and benefits they are accepting, and this articulation must remain stable across at least two counterfactual presentations (different ordering, different framing, different emotional valence). I also treat competence as irreducibly domain-specific rather than global, so that being competent to consent to a routine financial contract gives no direct license for consent to an experimental neurostimulation protocol, and I deny that this competence can be fully delegated to a proxy without altering the normative status of the act. The position is meant to be stricter than the standard Beauchamp-Childress framework without collapsing into paternalism, but I'm aware it may over-intellectualize consent in ways that exclude valid consent by non-expert subjects. So I want an honest map of its exposure: what observations about actual consent practices, what formal results in decision theory or moral psychology, and what limiting cases—perhaps involving deception that still feels like autonomy, or coercion so structural it cannot be named—would genuinely count against it? I want decisive defeaters separated from merely awkward ones, and I want to know which of these a defender of this view should concede as damaging rather than dismiss as irrelevant. In particular, I'm curious whether the domain-specificity of competence creates a regress problem—who certifies the certifiers?—and whether that is fatal or just administratively inconvenient. If the position turns out to be well-insulated because every apparent counterexample can be absorbed by refining the notion of "counterfactual stability," is that a theoretical virtue or a sign that I've insulated it into unfalsifiability? I'd like the answer to treat my framework as genuinely at risk, not as a strawman to be protected.
reasoning: |-
  Okay, the user is working on a chapter about informed consent in clinical trials and has proposed a demanding framework. Let me unpack their main points. They emphasize counterfactual epistemic autonomy, which requires participants to articulate risks and benefits in their own vocabulary, stable across different presentations. They also argue for domain-specific competence and reject proxy delegation as preserving the same normative status.

  First, I need to identify the vulnerabilities in their position. The user wants decisive objections, not just minor issues. Let's start with practical consent practices. Real-world scenarios like vulnerable populations come to mind. For example, low-literacy individuals might understand risks contextually but not articulate them as required. Studies in moral psychology show that comprehension isn't always verbal; people can grasp concepts through experience or non-verbal cues. If the framework insists on articulation, it might exclude those who understand but can't express it in words.

  Then there's the emotional valence requirement. Trauma survivors might have fluctuating responses based on presentation. Does that invalidate their consent? That seems unfair. Also, cultural differences in decision-making—some cultures rely on communal or trust-based decisions. The user's individualistic focus could clash here, raising justice concerns.

  Domain-specific competence is another big point. The regress problem: who assesses the competence for each domain? If it's experts, how do we ensure their competence? This could lead to infinite regress or administrative gridlock. Plus, standardizing domain-specific tests without bias seems tough. The user needs to address whether this is a fatal flaw or just a hurdle.

  Deception and coercion edge cases are tricky. Consider placebo effects where deception might be necessary. If participants feel autonomous despite mild deception, does their consent count? Structural coercion, like economic pressure, might be pervasive but not named. The framework might not account for these nuances, leading to impracticality.

  Counterfactual stability might be overfitted. If every counterexample is absorbed by adjusting "stability," it risks unfalsifiability. That's a theoretical vice. The user must balance refinement with testability.

  The user’s deeper needs: they want a robust defense but fear over-intellectualization. They might worry about excluding vulnerable groups or creating unworkable standards. Their identity as a rigorous ethicist is clear, but they need to ensure their framework is both principled and applicable. Unspoken concerns could include real-world applicability, ethical inclusivity, and avoiding paternalism while maintaining high standards.

  In summary, the key objections are practical exclusion, cultural insensitivity, competence regress, and inflexibility in edge cases. The user should concede some points, like adjusting articulation requirements or allowing proxies in certain cases, to avoid paternalism. They must navigate between theoretical rigor and real-world feasibility, ensuring their framework doesn't become so insulated it's irrelevant.
answer: |-
  Here’s a rigorous vulnerability assessment of your framework, treating it as a serious but defeasible position. I’ve organized counterarguments by strength (decisive vs. awkward), source (empirical, theoretical, edge cases), and concessions a defender should make.

  ---

  ### **I. Decisive Defeaters (Requiring Concession or Major Revision)**
  1. **Empirical: Non-Verbal/Implicit Understanding**  
     - **Observation:** Moral psychology (e.g., work by Gerd Gigerenzer on "gut feelings") shows individuals often grasp risks/benefits *implicitly* (e.g., through affective forecasting, somatic markers) but cannot articulate them in their own vocabulary.  
     - **Case:** A farmer with low literacy intuitively understands "1% chance of death" via lived experience with livestock mortality but cannot explain probability theory.  
     - **Why Decisive?** Your requirement for explicit articulation excludes epistemically autonomous agents who *reliably act* on understanding. Concede: Allow non-verbal/narrative expressions (e.g., "It’s like when my cow got the new shot and died") as valid articulation.

  2. **Theoretical: Competence Regress is Fatal**  
     - **Problem:** Domain-specific competence requires assessors competent in *that domain*. But who assesses the assessor’s competence? If it requires meta-competence (e.g., judging neurostimulation risk assessors), this leads to infinite regress.  
     - **Formal Result:** Analogous to Münchhausen trilemma (ultimate justification requires circularity, infinite regress, or dogmatism).  
     - **Why Decisive?** Without a regress-stopper (e.g., default trust in accredited experts), the framework is operationally paralyzed. Concede: Accept limited global competence (e.g., understanding *that* an expert assessment exists) as foundational.

  3. **Edge Case: Voluntariness Amid Structural Coercion**  
     - **Case:** A terminally ill patient in poverty consents to a high-risk trial to secure housing/food from the sponsor. Coercion is structural (poverty, healthcare gaps), not direct. They articulate risks perfectly and pass counterfactual tests.  
     - **Why Decisive?** Your framework validates consent here—yet most ethicists would deem it non-autonomous due to unjust background conditions. This exposes a gap: autonomy requires *distributive justice*, not just epistemic conditions. Concede: Add a "non-exploitation" clause to voluntariness.

  ---

  ### **II. Strong but Not Fatal Objections (Require Refinement)**
  4. **Counterfactual Stability Overreach**  
     - **Observation:** Decision psychology (e.g., framing effects in Tversky/Kahneman) shows preferences are *routinely* unstable under reframing—even for experts. Requiring stability may invalidate >90% of real-world consent.  
     - **Awkward Case:** A subject articulates identical risks in neutral vs. fear-inducing frames but weighs them differently (e.g., "I know it could kill me, but I’m desperate"). Is this instability or rational preference-shifting?  
     - **Defender’s Move:** Refine "central risks/benefits" to core facts (e.g., mortality risk %) excluding emotional weight. Concede instability in weighting is acceptable.

  5. **Proxy Delegation Normative Shift**  
     - **Limiting Case:** A fully lucid ALS patient delegates consent to a spouse, retaining veto power. Your framework labels this "non-consent" despite respecting patient autonomy.  
     - **Theoretical Challenge:** If autonomy includes *authorizing another* to decide (e.g., Christman’s relational autonomy), your denial of delegated competence appears question-begging.  
     - **Concession:** Grant proxy consent *can* be autonomous if the *delegation act itself* meets your epistemic conditions.

  6. **Cultural Exclusion**  
     - **Observation:** In communitarian cultures (e.g., Indigenous groups), consent is often familial/communal. Individual articulation may be alien or disrespectful.  
     - **Justice Concern:** Strict individualism may unjustly exclude groups from research access.  
     - **Refinement:** Allow "articulation" by a designated community representative under group authorization.

  ---

  ### **III. Awkward But Manageable Challenges**
  7. **Administrative Burden**  
     - **Practical Observation:** Testing counterfactual stability for each subject (multiple framings) would cripple trial logistics.  
     - **Response:** Use stratified sampling to validate comprehension tools, not per-subject testing.

  8. **Deception That Preserves Autonomy**  
     - **Edge Case:** Placebo-controlled trial with mild deception (e.g., "new pain drug" vs. sugar pill). Subjects understand core risks/benefits of *participation* (e.g., "I might get fake treatment") and articulate them stably.  
     - **Response:** Concede this consent *is* valid under your view—the deception is irrelevant if core risks are understood.

  ---

  ### **IV. Theoretical Virtue or Vice?**
  - **If Counterfactual Stability Absorbs All Counterexamples:**  
    This is **unfalsifiable insulation** if "stability" becomes endlessly elastic (e.g., dismissing failures as "non-central" risks). To avoid this:  
    - **Anchor "central" risks/benefits** to regulatory standards (e.g., FDA-defined "key information").  
    - **Define failure conditions:** E.g., instability under *any two* of three framings (order, emotion, metaphor) invalidates consent.  

  - **Domain-Specific Competence:**  
    The regress is **administratively inconvenient but not fatal** if:  
    - Rely on accredited institutional review boards (IRBs) as regress-stoppers.  
    - Treat competence as binary within domains (assessed via validated tools), not requiring infinite meta-competence.

  ---

  ### **Concessions a Defender Must Make**
  1. **Articulation ≠ Verbal Proficiency:** Accept non-linguistic expressions of understanding.  
  2. **Epistemic Autonomy ≠ Justice:** Structural coercion invalidates consent independently of epistemic conditions.  
  3. **Proxy Delegation Can Be Autonomous:** When the delegation itself meets epistemic standards.  
  4. **Competence Requires Regress-Stopper:** Default trust in certified experts/institutions is unavoidable.  

  ### **Core Vulnerability**  
  Your framework’s deepest flaw is **over-intellectualization of moral agency**. By requiring explicit, stable articulation, you exclude:  
  - Tacit knowers (e.g., skilled laborers)  
  - Emotionally volatile but rational agents (e.g., trauma survivors)  
  - Culturally non-individualistic agents  

  This risks epistemic injustice—privileging analytic thinkers while dismissing embodied, relational, or narrative modes of understanding. To defend your view, ground "articulation" in *narrative coherence* rather than lexical precision, and allow stability to encompass *rational* preference shifts across frames.

  **Path Forward:** Position this as an aspirational standard for high-risk trials, with tiered consent rigor based on risk level—thus avoiding paternalism while acknowledging practical constraints.
