  1.  **Sestina Structure:** Six stanzas of six lines, followed by a three-line envoi. Uses the six required end-words (**brain**, **light**, **away**, **gloom**, **doubt**, **frame**) in a specific rotating order.
  2.  **Functional Explanations:** Explicitly names "attention" (stanza 1), "Integration" (implied by "binding problem" in stanza 2), "global workspace" (stanza 3). Stanza 4 touches on "functional" explanations and "access consciousness."
  3.  **The Refrain:** The italicized line *"Why does the asking never get explained?"* appears at the end of stanzas 1, 2, 3, and 4, punctuating the failure of functional explanations to address the meta-question.
  4.  **Twisting End-Words:**
