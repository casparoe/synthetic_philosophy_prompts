  First, I'll outline the key distinctions. Expected value is a decision-theoretic concept where we multiply probability by value to handle uncertainty—here, it's used to aggregate moral weight despite low confidence in insect sentience. Modal or class-level reasoning deals with what's possible or necessary for a whole class, like whether insects as a group have the neural basis for consciousness. The scale argument might not claim decisiveness but rather significant weight to warrant attention. On neural architecture, the argument assumes it's relevant but doesn't require that sentience is randomly distributed; it could be that we're uncertain about whether the architecture supports consciousness.

