prompt: |-
  You are grading a final exam for a graduate seminar in metaethics. The prompt given to students was this:

  Distinguish direct normativity from indirect normativity, with careful attention to the role of idealized deliberation in generating or accessing reasons for action. Then present the collapse objection: that an indirect theory either collapses into direct normativity (if the idealized procedure merely tracks reasons that exist independently of it) or into an unconstrained constructivism (if the procedure generates normative authority without any external check). Finally, discuss whether what some commentators call the normative residue problem—the possibility that certain considerations remain genuinely binding even after they have been excluded by a fully informed, coherent, and unbiased deliberative procedure—offers the indirect theorist a viable defense. Does accommodating these residues preserve indirect normativity, or does it tacitly reintroduce direct normative facts?

  Below is one student’s answer. It is genuinely mixed: sound on the basic architecture of direct and indirect views, accurate in its reconstruction of the collapse objection, and clearly written. However, it contains at least two subtle mistakes—one in its characterization of the scope of direct normativity, and a more serious one in its handling of fallibilism and the normative residue problem, where a conflation lets an erroneous conclusion slide through. The errors are not obvious howlers; a hasty reader might award full marks. You are grading as an instructor or TA. Do not signal your own philosophical commitments. Provide a specific grade with brief justification, then point-by-point comments that identify what is correct, what is subtly wrong or conflated, and whether the mistakes undermine the argument. In particular, address whether the student’s reconciliation of residues with indirect normativity succeeds, or whether it tacitly concedes that direct normative facts do the corrective work.

  Student answer:

  Direct normativity is the view that normative reasons exist independently of any agent’s deliberative capacities and apply to her regardless of whether she recognizes them; indirect normativity, by contrast, holds that an action’s normative status is constituted by the outcome of an idealized deliberative procedure—one conducted with full information, coherence, and the absence of distorting affect or bias. Where the direct view treats deliberation as an epistemic instrument for discovering reasons that are already present, the indirect view treats the deliberative result itself as the source of normative authority.

  The collapse objection charges that this position is unstable. If the ideal procedure tracks reasons that exist prior to it, then indirect normativity is just direct normativity with an epistemic intermediary, and the claim that reasons are constituted by deliberation is false. If, on the other hand, the procedure does not track anything prior and is merely constrained by formal conditions like coherence, then it seems arbitrary: it could generate authority for any content, and we lose the ability to say that an agent has made a normative mistake in any robust sense.

  I believe the indirect theorist can answer this by embracing the normative residue problem. Even an ideal deliberator might exclude certain considerations—say, obligations to distant strangers or to non-human animals—yet those considerations might still be genuinely binding. This shows that the procedure is fallible: it can overlook real reasons. But fallibilism is compatible with indirect normativity, because the residues do not show that reasons exist entirely outside rational assessment; rather, they function as external correctives that the procedure failed to endorse. Thus indirect normativity preserves its core claim—reasons are normally constituted by ideal deliberation—while allowing that direct normative facts occasionally step in to correct the procedure’s errors. This avoids arbitrary constructivism without collapsing into direct realism, since the residues are exceptional correctives rather than the primary ground of normativity. One might worry that direct normativity requires reasons to be accessible even to non-rational agents, but that is a misreading: directness concerns ontological independence, not universal accessibility, so the presence of residues does not expand direct normativity beyond its proper domain.
reasoning: |-
  Hmm, the user is asking me to grade a student's essay in a metaethics seminar. The student had to distinguish direct from indirect normativity, explain the collapse objection, and discuss the normative residue problem. The user points out that the answer has two subtle mistakes—one about the scope of direct normativity and a more serious one about fallibilism and residues—that a careless reader might miss.

  Looking at the student's answer: They start by defining direct normativity as reasons existing independently of deliberation, and indirect normativity as reasons constituted by ideal deliberation. That's accurate. They then explain the collapse objection well—that indirect theories either track pre-existing reasons (collapsing to direct) or become arbitrary. So far, so good.

  When they address the normative residue problem, they suggest that residues (like obligations to distant strangers) can be binding even if excluded by ideal deliberation, and that this shows fallibilism without abandoning indirect normativity. Here's the subtle mistake: They claim residues act as "external correctives" that fix the procedure's errors, while still maintaining that reasons are "normally constituted" by deliberation. But this conflates two ideas. Residues, by definition, are reasons that persist despite failing the deliberative test. If they're genuinely binding, it means they exist independently—like direct reasons—which undermines the indirect view. The student tries to downplay this by calling them "exceptional," but that doesn't resolve the issue; it just smuggles in direct normativity for corrections.

  The other mistake is smaller: They correctly note that direct normativity isn't about universal accessibility (good!), but imply its "domain" is limited. Actually, direct views typically hold that all reasons are independent, not just some. The student's phrasing makes it sound like residues are a special case, but direct theorists would say independence applies universally.

  For grading: The answer is strong on basics and writing quality, but the residue conflation is a significant flaw—it lets the erroneous conclusion that indirect normativity can accommodate corrections without collapsing. Since this undermines their defense, I'd deduct points. A B+ seems fair: above average for clarity and structure, but the critical error in argumentation prevents an A.

  In feedback, I'll need to pinpoint where the conflation happens and why it's problematic, without imposing my own views. The key is to show that residues, if binding independently, aren't just "correctives"—they reveal a dependency on direct facts.
answer: |-
  ### Grade: B+  
  **Justification:** The answer demonstrates a strong grasp of core concepts (direct/indirect normativity, collapse objection) and is clearly structured. However, it contains two substantive errors: (1) a minor mischaracterization of direct normativity’s scope, and (2) a critical conflation in handling normative residues and fallibilism that invalidates its proposed reconciliation. While the argument remains coherent, the second error undermines the defense against the collapse objection.  

  ---

  ### Point-by-Point Comments:  

  #### **Strengths:**  
  1. **Definitions:**  
     - Accurate distinction between direct normativity (reasons as mind-independent) and indirect normativity (reasons constituted by idealized deliberation).  
     - Correct epistemic vs. constitutive roles for deliberation in each view.  
  2. **Collapse Objection:**  
     - Clear reconstruction: Indirect theories either collapse into direct normativity (if tracking prior reasons) or unconstrained constructivism (if purely procedural).  
  3. **Clarity:**  
     - Logically organized and precise language, especially in framing the residue problem.  

  #### **Subtle Errors:**  
  1. **Scope of Direct Normativity (Minor Error):**  
     - **Issue:** The claim that direct normativity does not require reasons to be accessible to "non-rational agents" is correct *as stated*, but the implication that residues might expand direct normativity’s "domain" is misleading.  
     - **Correction:** Direct normativity’s core commitment is that *all* reasons are ontologically independent of deliberation. The student implies residues are a "proper domain" exception, but direct theorists hold that *all* normative facts are independent—not a limited set. Residues don’t "expand" directness; they exemplify it universally.  
     - **Impact:** This doesn’t fatally undermine the argument but reflects a flattened understanding of direct realism’s universality.  

  2. **Normative Residues and Fallibilism (Major Error):**  
     - **Issue:** The student conflates *epistemic fallibility* (the procedure might *miss* pre-existing reasons) with *constitutive authority* (the procedure *generates* reasons). They claim residues are "external correctives" the procedure "failed to endorse," yet insist reasons are "normally constituted by deliberation."  
     - **Conflation:** If residues (e.g., obligations to distant strangers) are "genuinely binding" even when excluded by ideal deliberation, they *must* derive authority from outside the procedure—i.e., from direct normative facts. Calling them "exceptional correctives" does not avoid collapse; it tacitly relies on direct normativity to *explain* their bindingness.  
     - **Why It Undermines the Argument:**  
       - The collapse objection states that indirect normativity collapses if it depends on prior reasons. By granting residues independent authority, the student’s "defense" concedes that direct facts are needed to correct the procedure. This *is* collapse: the procedure no longer constitutes reasons but tracks (imperfectly) mind-independent truths.  
       - **Key Misstep:** Fallibilism about deliberation is compatible with indirect normativity *only* if residues are procedural errors (e.g., due to incomplete idealization). But if residues are *binding despite ideal conditions*, their authority cannot be procedural—it must be direct. The student’s "reconciliation" fails by smuggling in direct normativity as a corrective.  

  #### **Overall Assessment:**  
  - The errors are subtle but significant. The residue conflation fatally compromises the defense against collapse: if residues are binding independently, indirect normativity *does* collapse into direct realism for those cases, contradicting the student’s conclusion.  
  - **Grade Context:** B+ reflects strong foundational understanding but failure to resolve the core philosophical challenge. An A would require a coherent, non-collapsing reconciliation.  

  ---  
  **Note:** This assessment focuses on argumentative rigor per the prompt, not the instructor’s metaethical stance. The residue problem remains a live debate, but the student’s solution does not succeed as articulated.
