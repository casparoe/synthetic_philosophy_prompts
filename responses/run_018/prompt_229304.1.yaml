prompt: |-
  I teach a course on rational choice and philosophy of social science, and every spring I do a unit on the paradox of voting: one ballot essentially never flips a mass election, and yet people keep voting, so either the standard expected-utility story is incomplete or millions of people are behaving irrationally. The class discussion is always a mess because students describe themselves with whichever label they remember—expressive voter, civic duty, whatever—and then answer the cases in ways that contradict the label. I'd like a diagnostic I can hand out on day one.

  Please make a 'which theory of why people vote do you actually hold?' quiz: eight to ten questions, each built around a concrete case, with two or three answer options. The questions should cover territory like a safe-seat election where your candidate cannot lose, a non-binding referendum, paying a fee to vote, voting in a secret ballot where nobody can ever find out, a case where your preferred candidate's win helps a million strangers but costs you something, and a case where you can spend the same amount of time and effort doing something else you find mildly enjoyable. Before writing the questions, work out the branching space that will generate them: whether the value comes from the outcome or from the act itself; if from the outcome, whose welfare counts and whether people assess their chance of being pivotal accurately; if from the act, whether the benefit is expression, duty-satisfaction, or plain enjoyment. Then place the named views on that tree.

  The scoring key should sort people onto at least six leaves: the pure self-interested instrumental view (which says voting in a mass election is usually irrational), the altruistic/ethical instrumental view (expected benefit can swamp the tiny pivotal probability because it counts everyone's interests), expressive voting, the civic-duty or D-term view, the consumption/entertainment view, and a rational overconfidence or misprediction view. You may add one or two more leaves if the logical space supports them, but don't pad just so the list looks longer. No question may use the labels or ask what someone identifies as; every question has to force a choice about a case, so the instrument reveals the view rather than inviting people to pick one. Include at least one pair of positions the quiz cannot cleanly seperate, and say exactly what answer pattern would distinguish them and why you left that question out. Also include one combination of answers that none of the real positions occupy, and say whether it's empty because it's incoherent, unattractive, or just unexplored. Finish with the scoring key and, for each leaf, one sentence on its most awkward commitment.
reasoning: |-
  Okay, the user is teaching a course on rational choice and philosophy of social science, specifically tackling the paradox of voting. They're frustrated because students just parrot labels like "expressive voter" or "civic duty" without consistency in their reasoning. They want a diagnostic quiz that reveals the actual underlying theories students hold, based on concrete cases rather than self-identification. 

  First, I need to unpack the core problem: students are using labels inconsistently because they're not forced to confront the logical implications of each view. The quiz must bypass labels entirely and use hypothetical scenarios to expose contradictions. The branching logic should map to major theoretical positions—instrumental (selfish vs. altruistic), expressive, duty-based, consumption, and irrational overconfidence.

  The user specified key scenarios: safe-seat elections, non-binding referendums, voting costs, secret ballots, altruistic trade-offs, and opportunity costs. Each question must probe a specific tension point between theories. For example: 
  - A safe-seat election tests whether someone cares about being pivotal (instrumental) or values the act itself (expressive/duty). 
  - A non-binding referendum challenges whether outcome efficacy matters at all. 
  - A fee to vote separates duty-driven actions from consumption/entertainment. 

  I'll structure the branching around three axes: 
  1. Source of value (outcome vs. act) 
  2. If outcome-focused: scope of welfare (self vs. others) and pivotality assessment (rational vs. overconfident) 
  3. If act-focused: motive (expression, duty, or enjoyment) 

  Notable gaps: 
  - The quiz can't cleanly distinguish "pure altruistic instrumental" from "duty-focused" when both endorse voting despite costs. I'll omit a scenario about anonymous charity to avoid overlap, since both would act similarly. 
  - One impossible combination: someone who votes only when it's free and binding (Q2) but pays for non-binding votes (Q3). This is incoherent—if you pay for symbolic acts, why reject free symbolic acts? 

  For scoring, I'll map answer patterns to six theories plus the "inconsistent" catch-all. Each theory's awkward commitment highlights its vulnerability (e.g., altruistic instrumentalists must accept that voting is *less* rational than donating to effective charities). 

  The user's deeper need: a tool that forces students to notice their own contradictions. By seeing mismatched answers (e.g., claiming duty but skipping voting for mild enjoyment), they'll confront the gap between intuition and theory. That sets up richer class debates.
answer: |-
  Here's a diagnostic quiz designed to force students into revealing their underlying voting theory through concrete choices, without using labels. It covers the branching logic and includes the requested features.

  **Branching Logic Tree:**
  1.  **Is the primary value derived from the ACT of voting itself or the OUTCOME?**
      *   A.  **ACT:** Value comes from performing the act, regardless of outcome.
          *   i.  **Why is the act valuable?**
              *   a.  **Expression:** Communicating identity/values (Expressive).
              *   b.  **Duty:** Fulfilling a perceived obligation (Civic Duty).
              *   c.  **Enjoyment:** Finding the process intrinsically rewarding (Consumption).
      *   B.  **OUTCOME:** Value comes from influencing the result.
          *   ii. **Whose welfare counts?**
              *   d.  **Self-Interest:** Only my own gains/losses (Self-Interested Instrumental).
              *   e.  **Altruism/Ethics:** Gains/losses for others/society matter (Altruistic Instrumental).
          *   iii. **Assessment of Pivotality?**
              *   f.  **Rational:** Understands probability is vanishingly small (Requires high B or large N).
              *   g.  **Overconfident:** Believes pivot probability is non-negligible (Overconfidence/Misprediction).

  **The Quiz: "Why Do You Vote?" (Choose ONE answer per question)**

  1.  **The Sure Thing:** Your preferred candidate is guaranteed to win your district by a huge margin. Polls show they'll get over 70% no matter what. The election is tomorrow. What do you do?
      *   (A) Skip it. My vote won't change anything here.
      *   (B) Vote. It feels important to be part of it/show support.
      *   (C) Vote. I just enjoy the process of going to the polls.

  2.  **Symbolic Gesture:** A national referendum is being held on a topic you care deeply about. However, the government has explicitly stated the result is purely advisory and will *not* be binding; they'll make the final decision regardless. What do you do?
      *   (A) Skip it. If it can't change the outcome, why bother?
      *   (B) Vote. It's my chance to express my opinion on the record.
      *   (C) Vote. Voting is a citizen's duty, binding or not.

  3.  **Pay to Play:** To vote in the upcoming election, everyone must pay a $20 fee at the polling station (covering administrative costs). This fee is new and controversial. What do you do?
      *   (A) Skip it. $20 isn't worth the near-zero chance my vote matters.
      *   (B) Pay the $20 and vote. Voting is essential, cost or not.
      *   (C) Skip it. I'd pay for a concert, but not for voting.

  4.  **Utterly Secret Ballot:** Due to a bizarre technical glitch, election officials announce that *no record whatsoever* will be kept of who voted in this election. Not even you will receive confirmation. No one, not even the government, will ever know if you voted or not. What do you do?
      *   (A) Skip it. If no one knows, there's no point.
      *   (B) Vote. I still want to support my candidate/position.
      *   (C) Vote. I know I did my duty, even if no one else does.

  5.  **Costly Win:** Your preferred candidate promises a policy that will significantly benefit one million vulnerable people but will *personally* cost you $500 per year in higher taxes if they win. The election is expected to be very close. What do you do?
      *   (A) Skip it. Why pay $500 more for something that helps strangers?
      *   (B) Vote for them. Helping a million people is worth my $500 risk.
      *   (C) Vote against them or skip. I can't afford that tax hike.

  6.  **Mild Alternative:** On Election Day, a friend invites you to a free, relaxing afternoon picnic in the park you'd genuinely enjoy. Getting to the polls would take about the same time and effort as going to the picnic. What do you do?
      *   (A) Go to the picnic. Voting isn't worth missing that mild enjoyment.
      *   (B) Vote. The picnic sounds nice, but voting comes first.
      *   (C) Go to the picnic. Voting feels more like a chore than fun today.

  7.  **The Long Shot:** You discover you are the *only* eligible voter in a tiny, isolated special district deciding a minor local issue. Your vote is guaranteed to be decisive. The outcome affects only you. Option A benefits you by $1. Option B benefits you by $1000. What do you do?
      *   (A) Vote for Option B, obviously. $1000 is way better than $1.
      *   (B) Vote based on what I think is morally right for the community, even though only I'm affected. (Assume neither option is inherently immoral).
      *   (C) Flip a coin. Doesn't really matter to me which I pick.

  8.  **Overconfidence Probe?** (Choose the statement you agree with MOST):
      *   (A) In a national election with millions of voters, the chance my specific vote changes the result is so small it's practically zero.
      *   (B) In a close national election, my vote *could* realistically be the one that makes the difference.
      *   (C) I don't really think about the chances; I just vote.

  **Scoring Key & Awkward Commitments:**

  *   **Mostly A's (especially Q1, Q2, Q3, Q4, Q6): Pure Self-Interested Instrumentalist.**
      *   *Awkward Commitment:* Must accept that voting in mass elections is almost always irrational (wastes time/effort).
  *   **Q5=B, Q7=A, Q8=A, + Consistent A's on cost/pivotality (Q1, Q3, Q4, Q6): Altruistic/Ethical Instrumentalist.**
      *   *Awkward Commitment:* Must explain why voting is prioritized over more effective altruistic acts (e.g., donating the time/money value).
  *   **Q1=B, Q2=B, Q4=A or B, Q6=A or B: Expressive Voter.**
      *   *Awkward Commitment:* Cannot explain why people vote secretly (Q4) or pay costs (Q3) if expression is the main goal; struggles with binding vs. non-binding (Q2).
  *   **Q1=B or C, Q2=C, Q3=B, Q4=C, Q6=B, Q7=A or B: Civic Duty (D-Term).**
      *   *Awkward Commitment:* Must accept that the "duty" is satisfied even if the act is purely symbolic (Q2, Q4) or personally costly (Q3, Q5), without tangible outcome benefits.
  *   **Q1=C, Q3=C, Q4=A or C, Q6=C, Q7=A or C: Consumption/Entertainment Voter.**
      *   *Awkward Commitment:* Struggles to explain voting when it's unpleasant (bad weather, long lines) or why people feel guilty about not voting.
  *   **Q1=B, Q2=B or C, Q3=B, Q4=B or C, Q5=A or B, Q6=B, Q8=B: Rational Overconfidence/Misprediction.**
      *   *Awkward Commitment:* Must accept consistently overestimating the probability of being pivotal by orders of magnitude, despite evidence.
  *   **Mixed Pattern without Clear Theory: Inconsistent/Other.** (Common based on scenario specifics or unexplored views).

  **The Indistinguishable Pair & Missing Question:**
  *   **Altruistic Instrumentalist vs. Strong Civic Duty:** Both will vote consistently across most scenarios (Q1=B, Q2=B/C, Q3=B, Q4=B/C, Q5=B, Q6=B). **Distinguishing them requires a question about anonymous, costless charity:** "If you could anonymously press a button that gives $500 to a million strangers but costs you nothing, would you do it?" Altruist: Definitely Yes. Duty: Maybe, but *not* out of duty; duty applies specifically to voting/civic acts. I omitted this to avoid explicit charity comparisons and focus on voting contexts, accepting this blur.

  **The Unoccupied Combination & Why:**
  *   **Answers:** Q1=A (Skip Safe Seat), Q2=B (Vote Non-Binding), Q3=A (Skip w/Fee), Q4=A (Skip Secret), Q5=B (Vote Costly Altruism), Q6=A (Skip for Picnic), Q8=A (Rational Pivot Prob).
  *   **Why Empty:** **Incoherent.** Voting in the non-binding referendum (Q2=B, expressive) but skipping the safe seat (Q1=A, denies expression) is contradictory. Voting for costly altruism (Q5=B) but skipping due to a mild picnic (Q6=A) or fee (Q3=A) is inconsistent unless the picnic/fee cost exceeds the *expected* altruistic gain, which Q8=A makes highly unlikely. This pattern mixes instrumental altruism only in Q5 with expressive only in Q2 while rejecting voting in other low-cost/no-impact scenarios. No coherent theory justifies this specific combination. It's likely just inconsistent intuition.

  This quiz forces students to confront the implications of their choices across different voting scenarios, revealing their underlying theoretical commitments (or inconsistencies) more reliably than self-identification. The awkward commitments highlight the key tension each theory faces, priming discussion.
