  | Decision Domain              | Key Variables Considered                                   | Recommended f* (Range) | Rationale                                                                 |
  | :--------------------------- | :--------------------------------------------------------- | :--------------------- | :------------------------------------------------------------------------ |
  | **First Date Investment**    | Estimated compatibility, potential upside/downside magnitude | 0.10 - 0.18            | Limits emotional exposure; high uncertainty warrants conservative sizing. |
  | **Marriage Proposal**        | Assessed P(success), long-term EV variance, ruin cost      | 0.25 - 0.40            | Significant commitment requires higher allocation than dating, but ruin risk (divorce) caps f*. |
  | **New Friendship Allocation** | Perceived reliability, support potential, correlation risk | 0.05 - 0.12            | Diversification essential; avoid over-reliance on single "social asset."  |
  | **Career Change Pursuit**    | P(success), salary delta, skill transfer risk, burn cost   | 0.15 - 0.30            | Balances high upside potential against risk of skills mismatch/ruin (job loss). |
  | **Having First Child**       | Financial stability, support network, health estimates     | 0.20 - 0.35*           | Massive leverage & variance; requires significant capital buffer. (*Highly model-dependent). |
  | **Speculative Metaphysics**  | Uncomputable P(truth), undefined payoff magnitude          | 0.00                   | Fundamentally unquantifiable odds/payoffs make any f>0 equivalent to overbetting. |
  | **Major Charitable Donation**| Confidence in efficacy, baseline wealth, log-utility curve | 0.01 - 0.10            | Optimizes long-term impact potential without risking donor "ruin" (inability to give later). |
