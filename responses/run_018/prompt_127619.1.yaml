prompt: |-
  I'm running a small coaching practice for grad students and freelancers who keep missing deadlines they 'definitely wanted' to make, and I was talking with a friend who teaches philosophy who said I'm probably just reinventing akrasia vs hyperbolic discounting. Maybe, but I still need an actual intake procedre I can run in about 45 minutes that tells me which failure mode we're dealing with, if any, and exactly where I should stop and refer out rather than coach.

  Turn the philosophical distinction between weakness of will and hyperbolic discounting into a reusable decision flowchart — ordered questions, what counts as a sufficient answer to each, hard stops for 'this is values, not psychology' or 'this is neither,' and honest flags for where judgment can't be eliminated. I want you to build in a 'temporal authority check' as a gate: it should test whether the client's planning self was sufficiently informed and not under acute stress when it set the goal, and that result should control whether hyperbolic discounting even applies. Don't treat it as an afterthought; make it a real decision node with conditions.

  Apply it to three cases: (a) a PhD student who had the grant draft finished but missed the portal deadline, (b) a freelancer who delayed invoicing for three months until rent was due, and (c) one case where the procedure returns an answer you'll probably dislike — like labeling a choice as rational discounting when it looks like moral failure. Be explicit about what the procedure flat-out can't settle and where human judgment sneaks in despite the flowchart. End with one line starting 'Bottom line:' summarizing the deliverable.
reasoning: |-
  We are creating a flowchart to distinguish between akrasia (weakness of will) and hyperbolic discounting (a form of time inconsistency in preferences). The key gate is the "temporal authority check": we must verify that the client's planning self was sufficiently informed and not under acute stress when setting the goal. If this check fails, we cannot apply hyperbolic discounting as an explanation.

  Key definitions:
  - **Akrasia (weakness of will)**: The client, at the time of action, knew what they ought to do (had the intention) but failed to do it due to a failure of self-control. The intention was present at the moment of action, but they couldn't follow through.
  - **Hyperbolic discounting**: The client, at the time of action, did not have the same intention as the planning self because they discounted the future reward too steeply. The intention at the moment of action was different (they preferred the immediate reward over the delayed one). This requires that the planning self was authoritative (informed and not under acute stress).

  Flowchart:

  1. **Temporal Authority Check**: 
     - Question: "When you set the goal, did you have all the key information about what it would take to complete it? And were you in a relatively normal state of mind (not under extreme stress, intoxication, or emotional duress) at that time?"
     - Sufficient answer: The client must confirm that they were informed and in a normal state. If not, then we cannot apply hyperbolic discounting. Instead, we might be dealing with a case of poor planning, misinformation, or acute stress that invalidates the goal-setting. This is a hard stop for hyperbolic discounting and may lead to a different category (e.g., planning failure, values conflict, or external factors).

     - If YES (authoritative), proceed to step 2.
     - If NO, then we cannot label this as hyperbolic discounting. We might have:
          - Values conflict: The goal was set under conditions that don't reflect the client's true values (e.g., under pressure from others).
          - Planning failure: The client did not have the necessary information to set a realistic goal.
          - Acute stress: The goal was set in an abnormal state of mind.
          - Outcome: Refer out if the issue is primarily values (e.g., to a therapist or values clarification specialist) or if it's a planning failure (maybe coachable, but not as akrasia/discounting). This step is a hard stop for the discounting vs akrasia distinction.

  2. **Intention at the Moment of Action**:
     - Question: "At the exact moment when you were supposed to be working on the task (or avoiding it), were you aware that this was the time to act, and did you still hold the intention to do it?"
     - Sufficient answer: We are trying to determine if the client had the intention to act at the moment of action but failed to act (akrasia) or if the intention had changed (hyperbolic discounting).
     - If YES (they intended to act but couldn't bring themselves to do it), then we are likely dealing with akrasia.
     - If NO (they did not have the intention to act at that moment because they preferred doing something else), then we are likely dealing with hyperbolic discounting.

     However, note that sometimes the client might not be aware of their own intentions. So we have to be cautious.

     - Hard stops: If the client says they were not aware that it was time to act, then it might be a planning failure (e.g., forgot) or an attention issue. This would be neither akrasia nor hyperbolic discounting.

  3. **Post-Hoc Regret or Satisfaction** (to help distinguish, but not definitive):
     - Question: "After the fact, do you regret not having done the task? Or do you feel that at that moment, the alternative you chose was actually more valuable?"
     - This is not a primary node because regret can be present in both cases. But in hyperbolic discounting, the regret is about time inconsistency. In akrasia, the regret is about lack of self-control. However, if the client does not regret the choice (e.g., they think the immediate reward was worth it), then it might be rational discounting (if the discounting is consistent with their values) or a values conflict.

     - If the client does not regret the choice, it might indicate that the goal was not truly aligned with their values (so not akrasia or discounting, but a values issue) or that the discounting was rational (if the immediate reward was indeed more important at that moment). This may require referral for values clarification.

  But note: The core distinction is in step 2. However, step 1 is a gate.

  Now, let's apply the flowchart to the cases:

  Case (a): PhD student who had the grant draft finished but missed the portal deadline.

  1. Temporal Authority Check: 
     - Assume the student set the deadline goal knowing the portal would close and had the draft ready. They were informed and in a normal state. So YES.

  2. Intention at the moment of action:
     - At the time the portal was open, did they intend to submit? 
     - They might say: "I knew I had to submit, but I got caught up in something else and forgot until it was too late." 
       - This is not akrasia (because they didn't have the intention at that moment due to forgetting) and not hyperbolic discounting (because there was no conscious choice to delay). It's a planning/organizational failure (didn't set a reminder, etc.). So we would stop and label as neither.

     - Alternatively, they might say: "I kept putting it off because I was nervous about submitting, even though I knew I should." 
       - Then at the moment, they intended to do it (they knew they should) but couldn't bring themselves to? Then akrasia.

     - Or: "I thought I had more time, and I preferred to do this other thing that seemed more urgent." 
       - Then if they changed their intention at the moment (they didn't feel like submitting then), then hyperbolic discounting.

  Case (b): Freelancer who delayed invoicing for three months until rent was due.

  1. Temporal Authority Check: 
     - They set the goal to invoice promptly. Were they informed and in a normal state? Probably yes (it's a routine task). So YES.

  2. Intention at the moment of action:
     - Each time they had the chance to invoice, what was their state?
     - If they thought: "I should do this now" but then didn't because they felt lazy or anxious, that's akrasia.
     - If they thought: "I can do it later, now I want to do [other fun activity]", then hyperbolic discounting.

     However, note that they finally did it when rent was due. This suggests that the immediate consequence (rent) made the task urgent. So hyperbolic discounting is likely.

  Case (c): A case that returns an answer we might dislike.

  Example: A client who set a goal to work on a book every weekend. But when the weekend comes, they choose to spend time with their sick parent. They don't regret it. 

  1. Temporal Authority Check: 
     - When they set the goal, they were informed and in a normal state? Maybe, but if they didn't anticipate the parent's illness, then the authority check might still pass because the goal was set under normal conditions.

  2. Intention at the moment of action:
     - At the weekend, they chose to be with their parent. Did they still have the intention to work on the book? 
       - They might say: "I knew I should work on the book, but I felt I had to be with my parent." -> This could be akrasia (if they felt guilty about not writing) but actually, it's a values shift. 
       - Or: "At that moment, being with my parent was more important, so I didn't intend to write." -> Then it's not that they failed to act on an intention, they changed their intention.

     But note: This might not be hyperbolic discounting because the preference shift is due to new information (parent is sick) and is rational. 

     The flowchart might lead us to step 2: they did not have the intention at the moment (so not akrasia) and the planning self's goal is overridden by a rational reevaluation. So it's rational discounting. But the flowchart might not capture this nuance. 

     We have a hole: what if the client's preferences changed for a good reason? The temporal authority check passed (so planning self was authoritative) but then new information or a change in circumstances makes the goal less important. This is rational and not a failure. 

     We need to add an explicit branch for:

     After step 1 (passed) and step 2 (they did not have the intention at the moment), ask:

     - "Was there a new circumstance or information that made the task less important or the alternative more important at the moment of action?"

     If YES, then it's rational reevaluation (not a failure of will or discounting). We should refer out only if the client is conflicted about the values. If they are at peace with the choice, then it's not a coaching issue.

     If NO, then it's hyperbolic discounting.

  Where judgment sneaks in:

  - In the temporal authority check: determining "sufficiently informed" and "normal state of mind" is subjective. The coach must use judgment to decide if the client's goal-setting was valid.

  - In step 2: the client might not accurately recall their mental state at the time of action. They might rationalize.

  - The distinction between rational reevaluation and hyperbolic discounting can be blurry.

  Hard stops:

  - If the temporal authority check fails: stop and do not apply hyperbolic discounting. Instead, categorize as planning failure, values conflict, or acute stress. Refer out if it's a values conflict or mental health issue.

  - If the client reports no intention at the moment of action and there is a rational reason (new information), then stop and label as rational choice.

  - If the client forgot or was unaware, then stop and label as attention/organizational issue.

  Bottom line: A reusable 45-minute intake procedure that uses a temporal authority check as a gate to distinguish between akrasia, hyperbolic discounting, and other categories (planning failure, values conflict, rational choice) with explicit decision nodes and referral points.
answer: |-
  ### Decision Flowchart: Distinguishing Akrasia vs. Hyperbolic Discounting  
  **Purpose**: Identify whether a client's deadline failure stems from **akrasia** (weakness of will), **hyperbolic discounting** (time inconsistency), **rational discounting**, **values conflict**, or **other factors** (e.g., planning failure). Includes a **temporal authority check** as a gatekeeper.  
  **Time**: Designed for a 45-minute intake.  
  **Hard Stops**: Refer out for values conflicts, acute mental health issues, or non-psychological barriers.  
  **Judgment Flags**: Highlighted where coach's interpretation is unavoidable.  

  ---

  #### **Flowchart Steps**  
  1. **Temporal Authority Check (Gatekeeper Node)**  
     - **Question**: *"When you set this goal, were you in a calm, informed state—free from acute stress, pressure, or incomplete information—and did it align with your deeper values?"*  
     - **Sufficient Answer**:  
       - **YES** (Authoritative): Proceed to Step 2. Planning self is "valid"; hyperbolic discounting is applicable.  
       - **NO** (Non-Authoritative): **Hard Stop**. Goal-setting was compromised. Skip hyperbolic discounting; jump to Step 4.  
     - **Judgment Flags**: Assessing "acute stress" requires probing (e.g., "Were you panicked or rushed?"). "Informed" means key details (e.g., deadline logistics) were known.  
     - **Referral Triggers**: Signs of burnout, coercion, or values misalignment → Refer to therapist or values counselor.  

  2. **Hyperbolic Discounting Test**  
     - **Question**: *"When you avoided the task, did you actively choose a more rewarding short-term option (e.g., Netflix, socializing) while knowing the long-term cost?"*  
     - **Sufficient Answer**:  
       - **YES** → Likely **hyperbolic discounting**. Client traded future rewards for immediate gratification.  
       - **NO** → Proceed to Step 3 (akrasia test).  
     - **Judgment Flags**: Distinguish from rational choices (e.g., "Was the short-term option *truly* more valuable, or just easier?").  

  3. **Akrasia Test**  
     - **Question**: *"In the moment of avoidance, did you still *want* to do the task but feel unable to act (e.g., paralyzed by anxiety, distraction)?"*  
     - **Sufficient Answer**:  
       - **YES** → Likely **akrasia**. Intention was present, but execution failed.  
       - **NO** → Proceed to Step 4.  
     - **Judgment Flags**: Client may conflate "I couldn’t" (akrasia) with "I didn’t want to" (discounting). Probe emotional state.  

  4. **Non-Discounting/Non-Akrasia Analysis**  
     - **Question**: *"Was the failure due to forgetting, poor planning, external barriers, or a values shift (e.g., 'This goal doesn’t matter anymore')?"*  
     - **Outcomes**:  
       - **Forgot/Planned Poorly** → **Organizational failure** (coachable).  
       - **External Barrier** (e.g., illness) → **Contextual issue** (coachable if preventable).  
       - **Values Shift** → **Hard Stop**. Refer to values counselor.  
       - **No Clear Cause** → **Ambiguous**; use coaching to explore.  

  ---

  #### **Case Applications**  
  **Case (a): PhD student with finished grant draft who missed portal deadline**  
  - **Step 1 (Temporal Authority)**: Goal-set calmly with full deadline info? → YES.  
  - **Step 2 (Hyperbolic Discounting)**: Chose short-term reward over submitting? → NO (student claims they "forgot").  
  - **Step 3 (Akrasia)**: Intended to submit but froze? → NO.  
  - **Step 4**: **Organizational failure** (e.g., no reminder system). Coachable.  

  **Case (b): Freelancer delaying invoicing until rent was due**  
  - **Step 1 (Temporal Authority)**: Goal-set calmly? → YES (routine task).  
  - **Step 2 (Hyperbolic Discounting)**: Chose leisure over invoicing? → YES (e.g., "I preferred watching TV").  
  - **Outcome**: **Hyperbolic discounting**. Urgency (rent) resolved it.  

  **Case (c): "Disliked" Outcome – Rational Discounting Masked as Moral Failure**  
  - **Scenario**: A client avoids working on a low-paying client project to care for a sick child, then says, "I regret nothing."  
  - **Step 1 (Temporal Authority)**: Goal-set calmly? → YES.  
  - **Step 2 (Hyperbolic Discounting)**: Chose short-term reward? → YES (time with child).  
  - **But**: Client states, "My child’s needs were objectively more important."  
  - **Step 4 Analysis**: **Rational discounting** (values-aligned trade-off). Not a pathology.  
  - **Judgment Flag**: Coach must accept client’s value hierarchy without moralizing. If no distress, not a coaching issue.  

  ---

  #### **Limitations and Judgment Zones**  
  - **Can’t Settle**:  
    - **False Memories**: Clients misreport past intentions (Step 2/3).  
    - **Values vs. Psychology**: Distinguishing "rational" vs. "hyperbolic" discounting hinges on client’s value coherence (subjective).  
    - **Mixed Cases**: e.g., Anxiety (akrasia) and procrastination (discounting) coexist.  
  - **Judgment Sneak-In**:  
    - Step 1 ("informed/calm" assessment).  
    - Step 4 (classifying "values shift" vs. "avoidance").  

  **Bottom line**: A replicable 45-minute intake flowchart that gates hyperbolic discounting behind temporal authority, flags referral triggers, and exposes rational choices masquerading as failures.
