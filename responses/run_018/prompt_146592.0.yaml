prompt: |-
  In the context of mechanistic anomaly detection—where one must flag when a system deviates structurally from a reference mechanism despite surface functional similarities—there is a prior conceptual question: what conditions must be satisfied for two particular instances to count as realizing the same mechanism? I want a full specification of the desiderata that any adequate criterion of mechanistic identity must meet for this purpose. For each desideratum, state the concrete case or failure mode that motivates it—such as the need to tolerate redundant internal wiring that preserves causal dependencies, or the need to reject analogies between systems with identical input-output profiles but divergent internal causal architectures. Mark which requirements are non-negotiable—those without which the criterion collapses either into bare functional equivalence or into unhelpful physical token-identity—and which are negotiable commitments of particular methodological camps, such as substrate independence, determinism of the mechanism-to-implementation mapping, or invariance under scale transformation. Then indicate whether any subset of these desiderata is jointly unsatisfiable, especially whether accommodating both fine-grained intervention-sensitive specificity and broad cross-substrate generalization forces an unavoidable trade-off. Conclude with a brief conceptual assessment of how informal practices in mechanistic interpretability and causal modeling currently stand against this list, but do not supply bibliographies, named citations, or reading lists; the evaluation should rest on conceptual adequacy alone.
reasoning: |-
  We are to specify desiderata for a criterion of mechanistic identity in the context of mechanistic anomaly detection. The goal is to flag when a system structurally deviates from a reference mechanism while possibly having surface functional similarities.

  We need to:
  1. List desiderata (requirements) for an adequate criterion of mechanistic identity.
  2. For each, provide a concrete motivating case or failure mode.
  3. Mark which are non-negotiable and which are negotiable (with methodological commitments).
  4. Indicate if any subset of desiderata is jointly unsatisfiable (especially the trade-off between specificity and generalization).
  5. Conclude with a brief conceptual assessment of current informal practices in mechanistic interpretability and causal modeling.

  Non-negotiable desiderata are those without which the criterion collapses into either:
     - Bare functional equivalence (too coarse, ignores internal structure)
     - Unhelpful physical token-identity (too fine, requires exact physical instantiation)

  Negotiable commitments might include:
     - Substrate independence (can the mechanism be implemented in different materials?)
     - Determinism of the mechanism-to-implementation mapping (is the mapping one-to-one? or can one mechanism be implemented in multiple ways?)
     - Invariance under scale transformation (does scaling the mechanism in size or time matter?)

  We are especially concerned with the trade-off between:
     - Fine-grained intervention-sensitive specificity (ability to detect changes that matter under interventions)
     - Broad cross-substrate generalization (ability to recognize the same mechanism in different physical realizations)

  Let's outline the desiderata:

  I. Non-negotiable Desiderata:

  1. Causal Structure Preservation (Non-negotiable):
     - Requirement: The mechanism must have the same causal structure as the reference, meaning the same set of components and their causal dependencies (i.e., the same directed causal graph).
     - Motivating case: Without this, we might accept a system that has the same input-output behavior but a different internal causal structure (like a different algorithm). For example, a system that uses a lookup table to mimic the input-output behavior of a neural network should not be considered the same mechanism because it lacks the internal causal structure of neural computation.
     - Failure mode: Without this, the criterion collapses to functional equivalence.

  2. Component Equivalence (Non-negotiable, but with a caveat for functional role):
     - Requirement: The components (or variables) in the mechanism must play the same functional roles in the causal structure. However, the physical realization of these components might differ (negotiable: substrate independence). But the functional role (i.e., the causal relations they enter into) must be the same.
     - Motivating case: Consider a biological neuron and an artificial neuron. If they both compute a weighted sum and apply an activation function, they are equivalent. But if one component (e.g., an inhibitory synapse) is replaced by an excitatory one that has the same net effect in a particular context but a different causal role (e.g., it might respond differently to interventions), then they are not equivalent.
     - Failure mode: Without component equivalence in functional role, we might miss critical structural differences.

  3. Intervention Sensitivity (Non-negotiable):
     - Requirement: The criterion must be sensitive to interventions. That is, if an intervention on a component (or a set of components) in the reference mechanism leads to a change in behavior, the same intervention on the corresponding component in the candidate mechanism must lead to a corresponding change. If not, then they are not the same mechanism.
     - Motivating case: Two systems might have the same input-output behavior under normal conditions, but if we intervene by lesioning a component, they behave differently. For instance, in a neural network, if removing a neuron changes the output in a way that is not matched in the candidate system (which might have redundancy), then they are not the same.
     - Failure mode: Without this, we might accept systems that are functionally equivalent only under a restricted set of conditions.

  II. Negotiable Desiderata:

  4. Substrate Independence (Negotiable):
     - Requirement: The mechanism is defined independently of the physical substrate. For example, a clock mechanism can be realized by gears (mechanical) or by electronic circuits.
     - Motivating case: We want to recognize the same algorithm running on different hardware.
     - Failure mode: If we require same substrate, then we would reject a digital implementation of an analog circuit even if the causal structure is preserved.

  5. Scale Invariance (Negotiable):
     - Requirement: The mechanism should be considered the same even if scaled in time or space (e.g., running at a faster clock speed or being miniaturized).
     - Motivating case: A simulation of a mechanism at a slower speed is still the same mechanism.
     - Failure mode: Without scale invariance, we might reject a simulation that runs slower due to resource constraints.

  6. Determinism of Implementation Mapping (Negotiable):
     - Requirement: The mapping from the abstract mechanism to the physical implementation is deterministic (i.e., one abstract mechanism maps to one physical implementation) vs. non-deterministic (one abstract mechanism can be implemented in multiple ways). This is a methodological choice about how we individuate mechanisms.
     - Motivating case: In some contexts (like formal verification), we might require a one-to-one mapping, but in others (like biology), we accept multiple realizations.

  III. Potential Trade-off:

  - There is a tension between:
     a) The need for fine-grained specificity (to detect anomalies that are only revealed under interventions) and 
     b) The need for broad cross-substrate generalization (to recognize the same mechanism in different physical systems).

  - This tension may lead to an unavoidable trade-off. For example:
     - If we require very fine-grained intervention sensitivity (e.g., the exact same set of interventions must have the same effects), then we might reject two systems that are implemented in different substrates because the interventions might not be physically realizable in both (e.g., you can't lesion an individual transistor in a software simulation in the same way as in a physical circuit). 
     - On the other hand, if we are too liberal with cross-substrate generalization, we might accept a system that has the same input-output behavior and even a similar causal structure, but with a critical difference in a component that only becomes apparent under a novel intervention.

  - Thus, it might be impossible to satisfy both at the same time to the highest degree. We must strike a balance.

  IV. Assessment of Current Practices:

  - In mechanistic interpretability (e.g., in neuroscience or AI interpretability), the focus is often on reverse-engineering the causal structure. However, current practices tend to be informal and ad hoc. 
     - Strengths: They often capture the non-negotiable desiderata (causal structure and intervention sensitivity) by using methods like activation patching or ablation studies.
     - Weaknesses: They might neglect substrate independence and scale invariance, leading to an overly narrow view. For instance, in AI, interpretability methods are often tied to specific architectures (like transformers) and may not generalize to other substrates.

  - In causal modeling (e.g., using structural causal models), the focus is on the causal graph and interventions. 
     - Strengths: This approach naturally satisfies the non-negotiable desiderata of causal structure and intervention sensitivity.
     - Weaknesses: The level of abstraction (which variables to include) is often chosen pragmatically and may not be consistent across different systems. Also, the mapping from the abstract model to the physical system is not always deterministic, and there is little guidance on how to handle multiple realizations.

  - Overall, current practices in both fields are conceptually adequate for the non-negotiable desiderata but often lack a systematic treatment of the negotiable ones. This leads to inconsistency in what counts as the same mechanism across different contexts. The trade-off between specificity and generalization is not explicitly addressed, leading to either overly narrow or overly broad criteria in different applications.

  Conclusion:

  We have outlined the desiderata for a criterion of mechanistic identity. The non-negotiable ones are causal structure preservation, component equivalence (by functional role), and intervention sensitivity. The negotiable ones include substrate independence, scale invariance, and determinism of the implementation mapping. The trade-off between fine-grained specificity and broad generalization is a challenge that requires careful balancing. Current practices in mechanistic interpretability and causal modeling are partially adequate but lack a unified and systematic approach to these desiderata.
answer: |-
  ### Desiderata for Mechanistic Identity in Anomaly Detection

  For mechanistic anomaly detection, a criterion must distinguish between systems that are functionally similar but structurally divergent. Below are the desiderata, categorized as **non-negotiable** (essential to avoid collapse into functional equivalence or physical token-identity) or **negotiable** (dependent on methodological commitments). Each desideratum includes a motivating failure case.

  ---

  #### **Non-Negotiable Desiderata**  
  *(Essential for structural discrimination)*

  1. **Causal Graph Isomorphism**  
     - **Requirement**: The mechanism must exhibit the same directed causal graph as the reference, including variables (components), dependencies, and path-specific effects.  
     - **Failure Motive**: Without this, a system with identical input-output behavior but inverted internal logic (e.g., a feedback loop replaced with feedforward shortcuts) would be falsely accepted.  
     - **Non-negotiable**: Collapses into functional equivalence if absent.

  2. **Intervention Counterfactual Equivalence**  
     - **Requirement**: For all possible interventions on components, the counterfactual behavior of the system must match that of the reference mechanism.  
     - **Failure Motive**: A system with redundant wiring may behave identically under normal inputs but diverge when components are perturbed (e.g., ablating a neuron in a neural network vs. a functionally identical lookup table).  
     - **Non-negotiable**: Token-identity dominates without this, ignoring causal fragility.

  3. **Variable Role Identity**  
     - **Requirement**: Each component must satisfy the same functional role (e.g., "oscillator," "threshold detector") in the causal structure, regardless of implementation.  
     - **Failure Motive**: A system where inhibitory/excitatory roles are swapped (e.g., in a neural circuit) may preserve input-output mappings but fail under novel inputs or component failures.  
     - **Non-negotiable**: Absence reduces to coarse functionalism.

  ---

  #### **Negotiable Desiderata**  
  *(Methodologically contingent)*

  4. **Substrate Independence**  
     - **Requirement**: Physical implementation (e.g., silicon vs. biological neurons) does not affect identity if causal dependencies are preserved.  
     - **Failure Motive**: Rejecting a digital twin of an analog circuit due to material differences, despite identical causal dynamics.  
     - **Negotiability**: Material-dependent fields (e.g., materials science) may reject this; computational fields embrace it.

  5. **Scale Invariance**  
     - **Requirement**: Mechanisms are identical under temporal/spatial scaling (e.g., a slow-motion simulation of a chemical reaction).  
     - **Failure Motive**: Mistaking a real-time control system for an anomaly when tested in a slowed simulation.  
     - **Negotiability**: Rejected in domains requiring real-time constraints (e.g., embedded systems).

  6. **Determinism of Implementation Mapping**  
     - **Requirement**: A one-to-one mapping between abstract mechanisms and physical implementations.  
     - **Failure Motive**: Ambiguity in whether stochastic and deterministic implementations (e.g., PRNG vs. true RNG) of the same causal graph are identical.  
     - **Negotiability**: Determinism is prioritized in formal verification; relaxed in probabilistic fields (e.g., bioinformatics).

  ---

  #### **Trade-offs and Joint Unsatisfiability**  
  - **Specificity-Generalization Trade-off**:  
    - **Conflict**: Fine-grained *intervention sensitivity* (requiring exact counterfactual matches) clashes with *cross-substrate generalization* (e.g., tolerating analog vs. digital implementations).  
    - **Unsatisfiable Pair**:  
      - High specificity demands granular intervention tests (e.g., component-level perturbations), which may be physically impossible across substrates (e.g., probing a software simulation like hardware).  
      - High generalization accepts substrate-independent causal graphs but may miss anomalies detectable only via substrate-specific interventions (e.g., thermal noise effects in electronics).  
    - **Outcome**: A strict criterion favors specificity at the cost of false anomalies; a lax one risks missed detections. No criterion optimizes both.

  ---

  #### **Assessment of Current Practices**  
  - **Mechanistic Interpretability (e.g., AI/neuroscience)**:  
    - **Adequacy**: Strong on *causal graph isomorphism* (e.g., circuit discovery in transformers) but weak on *intervention equivalence* (often limited to input/output probes).  
    - **Gap**: Over-relies on correlational patterns, neglecting failure modes like redundant wiring. Substrate independence is inconsistently applied (e.g., conflating biological and artificial neural mechanisms).  

  - **Causal Modeling (e.g., SCMs, do-calculus)**:  
    - **Adequacy**: Formally addresses *intervention equivalence* and *variable roles* but struggles with *scale invariance* (e.g., time-aggregated variables mask microscale anomalies).  
    - **Gap**: Abstract models often ignore implementation-level deviations (e.g., unmeasured confounders in hardware), mistaking functional similarity for mechanistic identity.  

  - **Overall**: Current practices excel at coarse-grained functional alignment but lack rigor in cross-substrate intervention tests. The specificity-generalization trade-off is rarely acknowledged, leading to ad-hoc criteria that are either overly liberal (missing structural anomalies) or restrictive (flagging benign substrate differences). Conceptual foundations remain underdeveloped for anomaly detection in novel contexts (e.g., AI alignment).
