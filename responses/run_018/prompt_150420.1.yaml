prompt: |-
  My younger sibling is on dialysis, and a recent dinner argument about whether live kidney donors should be permitted to receive direct cash compensation made me realize that my regional bioethics advisory board has no structured way to evaluate proposals that open markets in goods currently protected from trade. I need you to design a reusable decision procedure that the board—which has no economists on staff, meets monthly, and must defend its recommendations to a legislature that distrusts abstract philosophy—can run in roughly forty-five minutes whenever it is asked whether to permit, restrict, or prohibit a specific exchange involving bodily goods, civic rights, or emergency necessities.

  The procedure should translate the philosophical distinction between corruption, in which pricing a good alters the intrinsic meaning or value attached to it, and crowding-out, in which pricing displaces non-market motivations, into a sequence of practical questions rather than theoretical claims. In particular, include an explicit “semantic degradation” step that asks whether introducing compensation would permanently change how the good is spoken about, recognized, and valued within the affected community, and specify what kind of observable shift in institutional language, social practice, or public justification counts as sufficient evidence of such degradation when we have no budget for formal sociological study. The questions should be ordered so that the board proceeds from factual determination to value judgment, with clear stopping rules that yield one of three recommendations—prohibit, restrict with enforceable safeguards, or permit with post-hoc monitoring—while marking every point where the answer depends on a judgment call that must be signed off by the board rather than derived from evidence. The procedure must also state explicitly what to do when relevant data is missing and must not pretend to settle questions that are genuinely about values.

  Please apply the procedure in continuous prose to three cases: first, a proposal to allow direct cash payments to live kidney donors within a public health system; second, a proposal allowing residents of a flood-stricken region to trade future votes in a cooperative water-board election for immediate relief supplies; and third, a proposal to suspend price-gouging restrictions on bottled water after a hurricane, a case where the board expects the answer will be “permit with monitoring” but needs to see whether the procedure genuinely reaches that conclusion or breaks down in an instructive way. For each application, show where the procedure gives a definite answer, where it forces an uncomfortable judgment call—especially in one case where the recommendation will likely run against the board’s intuitive moral reaction—and whether there is any step at which the procedure admits it cannot settle the matter and returns the decision to our values. Be honest about where the procedure will misfire, produce answers we will dislike, or depend on distinctions that collapse under pressure.

  Write the entire response as continuous prose only, with no headings, bullet points, bold text, or tables, as if composing a single detailed letter. Do not include bibliographies, reading lists, or citations to specific works—the board has no research staff and needs something it can use immediately without searching for sources.
reasoning: |-
  Okay, let me approach this request methodically. The user needs a practical decision framework for evaluating marketization of protected goods - specifically tailored for a time-constrained bioethics board without economists. The core challenge is translating philosophical concepts like corruption and crowding-out into actionable steps.

  First, I consider the operational constraints: 45-minute runtime, no research staff, and need to defend decisions to skeptical legislators. The framework must avoid theoretical jargon while preserving ethical nuance. The key insight is structuring questions to progress from observable facts to value judgments, with explicit stopping rules.

  For the semantic degradation component - central to detecting corruption effects - I focus on identifiable linguistic shifts: when medical consent forms start mentioning "compensation" instead of "donation," or when community discussions reframe kidneys as "assets." Evidence standards must rely on board members' direct observations or documented speech patterns, avoiding unrealistic research demands.

  The three-part recommendation system (prohibit/restrict/permit) needs clear triggers:
  - Prohibit when semantic degradation is irreversible or crowding-out is catastrophic
  - Restrict when risks are containable via design safeguards
  - Permit with monitoring when market mechanics actually improve access without distortion

  Now testing against the cases:
  For kidney markets, the uncomfortable truth emerges that financial incentives may not crowd out altruism when scarcity is extreme - forcing the board to confront their own biases. The vote-trading case will likely trigger prohibition due to irreversible democracy corrosion, even if intuitively appealing post-disaster. The water pricing case should confirm permission with monitoring, demonstrating the procedure's ability to justify counterintuitive but necessary market functions during emergencies.

  Throughout, I maintain honesty about limitations: the framework can't resolve fundamental value conflicts, and may produce disliked outcomes when non-market alternatives are theoretically preferable but practically nonexistent. The flood case specifically exposes where procedure reaches its ethical limits.
answer: |-
  Here is a reusable decision procedure designed for your bioethics advisory board, followed by its application to the three specified cases. The procedure translates complex ethical concerns into a sequence of practical questions, progressing from observable facts towards value judgments, with explicit stopping points and clear recommendations. It acknowledges data limitations and refuses to disguise value choices as empirical findings.

  **The Decision Procedure:**

  Begin by defining the specific good proposed for compensated exchange and the context of the transaction. Then proceed sequentially. If any question yields a definitive "yes," move to the indicated recommendation or stopping point. If "no" or "uncertain," proceed to the next question.

  1.  **Irreparable Harm Test:** Is there conclusive evidence that introducing compensation for this specific good in this specific context *directly* causes immediate, severe, and irreversible physical harm to identifiable individuals or groups (e.g., organ trafficking leading to murder, vote-selling under explicit duress)? *If YES, recommend PROHIBIT. Stop.* If NO or evidence inconclusive, proceed.
  2.  **Critical Scarcity & Non-Market Failure:** Is the good currently critically scarce (life-or-death necessity, fundamental civic right) *and* are non-market mechanisms (donation, public provision, rationing) demonstrably failing to meet essential needs at a systemic level for the affected population? *If NO, proceed to Question 3.* If YES, this suggests a potential *prima facie* case for considering compensation to increase supply/access *if risks can be managed*. Proceed to Question 4, bypassing 3 for now.
  3.  **Observed Crowding-Out:** Is there documented, specific evidence from analogous contexts (not theory) that introducing monetary compensation for this type of good has consistently reduced the availability or quality of non-compensated provision (e.g., paid blood donation reducing volunteer blood banks, paid childcare crowding out community babysitting)? *If strong evidence of YES, proceed to Question 4.* If evidence is weak, mixed, or absent, proceed to Question 4 but flag significant uncertainty about this risk.
  4.  **Semantic Degradation Assessment:** Would introducing compensation fundamentally alter how this good is described, understood, and valued within the relevant community or institution? Look for observable shifts:
      *   **Language Shift:** Would the primary descriptive term change (e.g., "donor" to "seller," "citizen" to "client," "relief" to "purchase") in official documents, public discourse, or common parlance?
      *   **Valuation Shift:** Would the good’s worth become predominantly expressed in monetary terms, displacing other values (e.g., "a kidney is worth $50k" replacing "donation saves a life," "a vote is worth 10 water bottles" replacing "civic duty")?
      *   **Justification Shift:** Would the primary reason for providing or exchanging the good shift from intrinsic motivation (altruism, duty, solidarity) to extrinsic motivation (profit, payment) in public explanations or personal accounts?
      *   **Evidence Standard:** Accept testimony from community representatives, analysis of similar policy changes elsewhere (e.g., how language changed after paid plasma donation), or documented shifts in institutional terminology pre/post compensation introduction in comparable cases. Board consensus on likely shift based on direct experience suffices if formal studies are absent.
      *   *If the board concludes Semantic Degradation is LIKELY and IRREVERSIBLE, proceed to Question 5.* If degradation is deemed UNLIKELY, MINOR, or REVERSIBLE, proceed to Question 6. If UNCERTAIN, flag this as a major judgment call before proceeding to Question 6.
  5.  **Corruption Judgment:** Does the predicted Semantic Degradation (from Q4) fundamentally corrupt the core meaning or social function of the good in a way that violates our society's foundational values? (e.g., turning a vote from an expression of civic voice into a commodity destroys democratic equality; turning a kidney donation from a gift of life into a sale commodifies the human body in a way society fundamentally rejects). *This is a core VALUE JUDGMENT requiring board sign-off.* If the board consensus is YES, recommend **PROHIBIT**. *Stop.* If NO, proceed to Question 6.
  6.  **Safeguard Feasibility:** Can enforceable safeguards be designed to prevent the major harms identified (potential crowding-out from Q3, potential exploitation, exacerbating inequality) *and* mitigate Semantic Degradation (if predicted in Q4)? Consider:
      *   Independent oversight bodies with audit power.
      *   Strict eligibility criteria for buyers/sellers (e.g., income limits, residency).
      *   Fixed, non-negotiable compensation set by a neutral body (avoiding auctions/haggling).
      *   Mandatory counseling/cooling-off periods.
      *   Transparent registries and tracking.
      *   Robust penalties for violations.
      *   *If the board judges EFFECTIVE SAFEGUARDS are FEASIBLE and ENFORCEABLE, recommend **RESTRICT with these specific safeguards**.* *Stop.*
      *   *If EFFECTIVE SAFEGUARDS are deemed IMPOSSIBLE to design or UNENFORCEABLE in practice, recommend **PROHIBIT**.* *Stop.*
      *   *If safeguards are PARTIALLY FEASIBLE but significant risks remain, proceed to Question 7.*
  7.  **Net Benefit Under Risk:** Despite residual risks (acknowledged crowding-out uncertainty, partial safeguard feasibility, potential for minor semantic shifts), does the board judge that the anticipated benefit of increased access to the critically scarce good (established in Q2) *outweighs* these risks, given the severity of the current non-market failure? *This is the ultimate VALUE JUDGMENT requiring board sign-off.* If YES, recommend **PERMIT with POST-HOC MONITORING** (specifying key metrics: e.g., supply change, price stability, exploitation complaints, semantic audits). *Stop.* If NO, recommend **PROHIBIT**. *Stop.*

  **Handling Missing Data:** At every factual step (Q1, Q3, Q4 evidence), if data is genuinely missing and cannot be inferred from analogous cases or direct observation, the board must explicitly state the uncertainty and decide whether to proceed based on precaution (leaning towards prohibition if harm is plausible and severe) or potential benefit (leaning towards permission if scarcity is extreme and harm uncertain). This decision point itself requires board acknowledgment.

  **Application to Cases:**

  1.  **Cash Payments to Live Kidney Donors:**
      *   Q1 (Irreparable Harm): Evidence exists linking poorly regulated markets to exploitation and trafficking, but within a *public* system with safeguards, direct harm might be containable? Not definitive "YES." Proceed.
      *   Q2 (Critical Scarcity & Failure): YES. Dialysis is burdensome, waitlists are long, people die waiting. Altruistic donation fails to meet demand systemically.
      *   (Bypass Q3 due to Q2 YES). Proceed to Q4.
      *   Q4 (Semantic Degradation): LIKELY. "Donor" becomes "seller." Kidney's value shifts from "gift of life" to "compensation for risk/hardship." Justifications move from altruism to financial need/benefit. Evidence: Analogies to debates on paid plasma; likely shift in medical consent forms and public discourse. *Board must acknowledge this judgment.*
      *   Q5 (Corruption Judgment): UNCOMFORTABLE JUDGMENT CALL. Does paying for a kidney fundamentally corrupt the act of saving a life by commodifying the body in a way society rejects? Many board members intuitively feel YES. The procedure *forces* confrontation: Does this degradation truly destroy the core value of saving a life, or merely change its motivation? A split board might conclude the life-saving purpose remains paramount *if* exploitation is prevented. *Sign-off required. Assume board narrowly judges YES, corruption is fundamental.* **Recommendation: PROHIBIT.** (This might run against some members' pragmatism given Q2, but the procedure forces the value choice at Q5).
      *   *Where it misfires:* If safeguards *could* prevent both exploitation and major semantic shift (e.g., calling it "compensation for life disruption/lost wages" not "sale," strict anonymity), the procedure might prematurely prohibit based on a broad corruption judgment (Q5) without fully exploring safeguard feasibility (Q6). The board might feel uneasy prohibiting despite critical scarcity.

  2.  **Trading Future Water-Board Votes for Flood Relief:**
      *   Q1 (Irreparable Harm): Is someone forced under direct duress (e.g., "trade vote or drown")? Possibly, but difficult to prove universally. Not definitive "YES." Proceed.
      *   Q2 (Critical Scarcity & Failure): YES. Immediate relief (water, food) is life-or-death necessity after a flood. Public/charitable relief may be overwhelmed or slow, creating critical scarcity.
      *   (Bypass Q3). Proceed to Q4.
      *   Q4 (Semantic Degradation): EXTREMELY LIKELY. "Voter" becomes "trader" or "debtor." A vote's value shifts from "civic right/duty" to "bargaining chip for survival." Justification moves from collective decision-making to immediate individual need. Evidence: Basic political theory; such trades explicitly redefine the act. *Clear Board consensus.*
      *   Q5 (Corruption Judgment): YES. Trading a fundamental democratic right (a vote) for immediate sustenance fundamentally corrupts the nature of citizenship and democratic equality. It turns political voice into a commodity sold under duress. *Unanimous board sign-off likely.* **Recommendation: PROHIBIT.** *Stop.* (The procedure cleanly reaches the intuitive prohibition, grounding it in observable semantic shift and corruption).

  3.  **Suspending Price-Gouging Laws on Bottled Water Post-Hurricane:**
      *   Q1 (Irreparable Harm): Does high pricing *itself* cause immediate severe harm? Arguably yes (people can't afford water), but prohibition (price caps) can also cause harm via shortages. Evidence mixed/contingent. Not definitive "YES." Proceed.
      *   Q2 (Critical Scarcity & Failure): YES. Bottled water is a critical necessity post-hurricane. Non-market mechanisms (pre-stocking, government/charity distribution) often fail to meet immediate, localized demand surges, leading to empty shelves. *Proceed.*
      *   Q3 (Observed Crowding-Out): LIKELY NO or UNCERTAIN. High prices primarily incentivize *increased supply* (trucking water in from afar, entrepreneurs finding stock) rather than displacing charity or public aid (which usually operate alongside markets). Evidence: Economic studies post-disasters often show increased total supply with price flexibility, though distribution inequities arise. *Proceed, flagging equity concerns.*
      *   Q4 (Semantic Degradation): MINOR/UNLIKELY. Bottled water is already a commodity. Its description ("bottled water"), valuation ("price per bottle"), and justification ("I need it"/"I sell it") remain market-based even without gouging suspensions. Suspending gouging laws doesn't fundamentally change this; it alters the price level, not the nature of the good or transaction. *Board consensus likely.* Proceed.
      *   Q6 (Safeguard Feasibility): Bypassed as Q4 didn't trigger major degradation concerns. Proceed to Q7.
      *   Q7 (Net Benefit Under Risk): JUDGMENT CALL. Residual risks: Profiteering, extreme inequity (poor priced out). However, the anticipated benefit is significant: Rapidly mobilizing supply to meet desperate need via market incentives, potentially saving lives by getting water where it's needed faster than rationing alone. Can post-hoc monitoring (tracking prices, supply levels, complaints) identify and allow rapid response to egregious exploitation? *Board judges YES, benefits outweigh risks under monitoring.* **Recommendation: PERMIT with POST-HOC MONITORING** (e.g., price reporting hotline, supply chain tracking, rapid reinstatement trigger if extreme inequity observed).
      *   *Where it depends on distinctions:* The procedure relies on distinguishing water (already a commodity) from votes/kidneys (not). This holds here. It also distinguishes price changes (market function) from fundamental semantic shifts (corruption). This case shows the procedure reaching the expected "permit with monitoring" conclusion based on the nature of the good and the primary mechanism (supply increase) addressing the critical scarcity.

  This procedure provides a structured, defensible path for your board. It forces explicit value judgments where they belong (Q5, Q7), uses observable proxies for complex concepts like semantic degradation, acknowledges uncertainty, and offers clear recommendations grounded in a sequence of practical considerations. It will sometimes produce uncomfortable answers (like prohibiting kidney payments despite scarcity if corruption is deemed fundamental) or depend on contested distinctions (commodity vs. non-commodity goods), but it does so transparently, refusing to hide the ethical choices inherent in these decisions. Its strength lies in making the board's reasoning process explicit and accountable, moving beyond abstract philosophy to actionable, context-specific evaluation.
