  For joint unsatisfiability, the big one is avoiding both repugnant conclusions while keeping transitivity. Arrhenius' impossibility theorems loom here—must acknowledge that trade-off explicitly. Should also flag how average utilitarianism implodes under mere addition paradoxes.

  The brief axiology assessments at the end should be telegraphic: totalism flunks asymmetry, critical-level avoids repugnance but not its reverse, person-affecting struggles with non-identity. But the focus stays on the criteria—they want to see where each theory bleeds, not a victor.

  User's tone suggests impatience with superficial treatments. They'll want citations-by-proxy: e.g., "structural constraint" nodding to Broome, "identity-indeterminate" evading Parfit. No dumbing down. Seminar context means this framework will be dissected—so rigor over accessibility.
answer: |-
  Here is a comprehensive list of desiderata for a theory of population value, structured for philosophical scrutiny in your seminar. The list prioritizes the *work* the axiology must do, not just outcomes, highlighting tensions and trade-offs.

  **Core Desiderata for Population Axiology:**

  1.  **Avoidance of the Standard Repugnant Conclusion (RC):**
      *   **Case:** Must *not* judge Z (a vast population with lives barely worth living) as better than A (a smaller population with very high welfare), when Z's total welfare exceeds A's.
      *   **Motivation:** Intuition that quality matters intrinsically; aggregating minimal welfare units shouldn't swamp high flourishing. Non-negotiable for most.
      *   **Tension:** Directly challenges pure Total Utilitarianism.

  2.  **Avoidance of the Reverse Repugnant Conclusion (RRC):**
      *   **Case:** Must *not* judge A+ (an enormous population with extraordinarily high welfare per life) as *worse* than B (a much smaller population with slightly lower average welfare than A+ but still very high), merely due to the size or distributional structure (e.g., across indeterminate identities or generations).
      *   **Motivation:** Intuition that vast amounts of high welfare are valuable; theories shouldn't penalize existence or distribution in ways that defy the value of bliss. Highlights structural constraints (continuity, transitivity) and potential aversion to large numbers. Non-negotiable for many (opposes certain Average views, Anti-Frustrationism taken to extremes).
      *   **Tension:** Challenges views overly reliant on averages, or those with strong discontinuity or anti-aggregation principles. Key test for symmetry.

  3.  **Resolution of the Non-Identity Problem (NIP) without Pure Actualism:**
      *   **Case:** Must explain why policy P (e.g., depleting resources) is wrong even if the future people who would exist under P are different from those under ~P and have lives worth living (though worse than those under ~P *would* have had).
      *   **Motivation:** Need to account for obligations to future generations without collapsing into "any life better than non-existence justifies creating it" (which enables RC) *or* pure actualism (which ignores harm to future potential people). Non-negotiable for capturing future-oriented obligations.
      *   **Tension:** Balances person-affecting intuitions with impersonal value. Tests the theory's handling of different possible futures and counterfactual comparisons.

  4.  **Distinction Preservation: Addition vs. Replacement vs. Welfare Alteration:**
      *   **Cases:**
          *   *Addition:* Adding a happy person to an existing population.
          *   *Replacement:* Choosing *which* future person (or lineage) will exist (e.g., having a child now vs. later).
          *   *Welfare Alteration:* Improving/worsening the welfare of an existing specific future person.
      *   **Motivation:** Moral intuitions often differ significantly between these acts. Adding a happy person seems neutral/good; replacing one potential person with another might be neutral if welfare is equal; harming a specific future person seems clearly bad. A theory collapsing these distinctions seems inadequate. Non-negotiable for capturing nuanced moral reasoning.
      *   **Tension:** Challenges theories that focus solely on aggregate outcomes regardless of identity or the nature of the change (e.g., pure impersonal Totalism). Person-affecting views struggle with addition/replacement.

  5.  **Robustness Under Uncertainty & Partial Ignorance:**
      *   **Case:** Must yield determinate (or reasonably bounded) judgments when we know *sets* of possible future people might exist under different policies, but not precisely *which* individuals (e.g., climate policy affecting unknown billions).
      *   **Motivation:** Real-world policy decisions *always* involve uncertainty about future identities and numbers. A theory requiring precise knowledge of future identities is practically useless. Non-negotiable for applicability.
      *   **Tension:** Tests the theory's reliance on actual identities vs. possible lives/welfare levels. Challenges views requiring precise counterfactual comparisons of specific individuals.

  6.  **Satisfaction of Basic Rational Choice Constraints:**
      *   **Constraints:** Transitivity, Completeness (or near-completeness for practical purposes), Continuity (arguably), Principle of Personal Good (if identical people exist in two outcomes, and all are better off in one, that outcome is better, *ceteris paribus*).
      *   **Motivation:** To be coherently action-guiding and avoid cyclic preferences or paralysis. Transitivity is widely seen as non-negotiable. Completeness is desirable but sometimes relaxed. Continuity is contested but often expected. Principle of Personal Good is core for many.
      *   **Tension:** Especially transitivity is crucial for avoiding cycles, but creates pressure when combined with RC/RRC avoidance (see Joint Unsatisfiability).

  7.  **Sensitivity to Mere Addition:**
      *   **Case (Mere Addition Paradox):** Adding people with lives worth living (but below average) to a population should not make the outcome *worse*, even if it lowers average welfare. However, a sequence of such additions *can* lead to a repugnant conclusion.
      *   **Motivation:** Intuition that adding happy people isn't bad *in itself*. A theory must navigate this without either condemning mere addition (counterintuitive) or being forced down the path to RC. Preference (strong for some).
      *   **Tension:** Directly linked to RC. Distinguishes theories that accept mere addition (Totalism) from those that reject it (some Average views).

  **Joint Unsatisfiability & Key Tensions:**

  *   **The Fundamental Impossibility Trilemma (Arrhenius):** Avoiding RC, Avoiding RRC, and satisfying Transitivity + a weak Mere Addition principle (+ other minimal conditions) appear **jointly unsatisfiable**. This is the core philosophical labor zone. Any theory must relax one desideratum or challenge the framing of the cases/axioms.
  *   **Uncertainty vs. Identity-Dependence:** Theories heavily reliant on the moral significance of specific identities (strong person-affecting views) struggle significantly with Desideratum 5 (Uncertainty).
  *   **Continuity vs. Lexicality:** Avoiding RC/RRC sometimes requires lexical thresholds (e.g., lives above a very high threshold have infinite/incommensurable weight). This violates Continuity, a constraint valued in rational choice theory.

  **Brief Assessment of Axiologies Against Key Desiderata:**

  1.  **Total Utilitarianism:**
      *   *Fails:* 1 (Embraces RC), 7 (Avoids RRC only by embracing RC).
      *   *Succeeds:* 3 (Impersonal, handles NIP), 4 (Collapses distinctions), 5 (Works well with welfare aggregates), 6 (Usually satisfies constraints), 7 (Accepts mere addition).
  2.  **Critical-Level Utilitarianism (CL):**
      *   *Fails:* 1 (Avoids RC if level > 0), 2 (Vulnerable to RRC if adding vast numbers above CL is deemed worse than a smaller superb population - depends on CL height/continuity), 4 (Collapses distinctions).
      *   *Succeeds:* 1 (Avoids RC if level > 0), 3 (Impersonal), 5 (Works with aggregates), 6 (Often satisfies), 7 (Accepts mere addition above CL).
  3.  **Person-Affecting Views (e.g., Asymmetry, Harm-Based):**
      *   *Fails:* 3 (Struggles with NIP without ad-hoc moves), 4 (Often struggles to distinguish Addition/Replacement meaningfully), 5 (Severe difficulty under uncertainty about identities), 6 (Completeness/Comparability issues).
      *   *Succeeds:* 1 (Avoids RC by rejecting duty to create happy lives), 2 (Avoids RRC as it doesn't value the vast bliss impersonally), 7 (Rejects mere addition as a duty/good).

  **Conclusion:** The labor lies in navigating the **impossibility trilemma** (RC/RRC/Transitivity+), rigorously defining the **distinctions** (Addition/Replacement/Alteration), reconciling **person-affecting intuitions** with **impersonal value** under the NIP, and developing a tractable framework for **decision-making under deep uncertainty** about future identities. No theory satisfies all desiderata; each relaxes some constraint or reinterprets some intuition. The adequacy of an axiology hinges on which trade-offs are deemed philosophically defensible and practically necessary. Your seminar should dissect these foundational tensions, not just the surface features of the theories.
