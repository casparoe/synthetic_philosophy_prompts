  - Brief axiology assessments without declaring "winners"

  Hmm, the trickiest part will be structuring the reverse repugnant conclusion. Most literature focuses on the original version; the reverse is rarer but crucial for symmetry. I recall Arrhenius' "very repugnant conclusion" where an enormous blissful population is deemed worse—that might fit. Need to define it carefully to avoid conflation with mere anti-aggregationist views.

  Also noting their demand to handle: 
  - Non-identity problem without pure actualism (so must accommodate future people's interests) 
  - Distinctions between addition/replacement/welfare alteration (likely targeting person-affecting views) 
