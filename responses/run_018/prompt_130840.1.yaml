prompt: |-
  You serve as an expert philosopher of language with specialist training in institutional design and collective coordination. Before drafting, briefly list the core Lewisian conditions for a genuine convention—coordination problem, arbitrary but stable equilibrium, common knowledge, and salience sustained by precedent—and identify which ones are genuinely present or genuinely threatened in the case below. Think carefully about how digital scale and asymmetric observational access affect common-knowledge dynamics.

  I sit on the Governance Committee for our university’s open collaborative research platform, where contributors edit shared living documents. Over three years an unwritten norm has emerged: if you revise another contributor’s section, you must leave a brief explanatory annotation visible to all. The norm is not enforced by software; it persists because experienced users model it and newcomers eventually learn through observation. Recently, a faction of senior contributors proposed formalizing the norm into a binding platform rule with automated flags, arguing that as our user base grows, newcomers no longer share the common observational history that made the precedent self-enforcing, so coordination is breaking down. Another faction argues that formalization would destroy the convention’s flexibility and turn a Lewis-style emergent equilibrium into a top-down regulation, undermining the very common-knowledge dynamics that sustain it.

  Draft the committee’s decision memo recommending either formalization with a specific sunset or review clause, or deliberate preservation of the emergent norm with a specific alternative mechanism, with reasons the opposing faction could recognize as addressing their best point rather than dismissing it. Lead with the bottom-line recommendation in the first sentence; then give the reasoning, with no preamble and no restating of the question. Do not include bibliographies, reading lists, or citations.
reasoning: |-
  Hmm, the user has posed a complex scenario about institutional design and language philosophy, specifically about whether to formalize an annotation norm on a collaborative platform. I need to recall the Lewisian conventions framework - coordination problem, arbitrary equilibrium, common knowledge, and precedent-based salience.

  The core tension here is between two factions: one advocating for formalization due to scaling issues, the other fearing it will destroy the organic convention. The user wants me to draft a committee memo with a clear recommendation and reasoning that addresses both sides' concerns.

  Looking at the Lewisian conditions: The coordination problem is clearly present - contributors need to coordinate editing behavior. The equilibrium exists but is threatened by scaling. Common knowledge is deteriorating as the user base grows and newcomers lack shared observational history. Salience from precedent is weakening for the same reason.

  The digital scale factors matter here - in large groups, common knowledge becomes harder to maintain organically. Asymmetric observational access means not everyone sees the same behavioral models, which compounds the problem.

  For the recommendation, I'm considering a middle path: formalizing with a sunset clause. This would address the pro-formalization faction's concern about coordination breakdown while respecting the anti-formalization faction's value for flexibility. The sunset clause creates a natural review point to assess whether the convention has stabilized organically at the new scale.

  The reasoning should explicitly acknowledge that formalization might alter common-knowledge dynamics, but argue that at current scale, some scaffolding is needed to preserve coordination. The sunset mechanism turns the formal rule into a temporary salience-booster rather than permanent top-down control.

  I'll structure it with the recommendation first per instructions, then unpack how this solution addresses both factions' core concerns using the Lewisian framework. The key is showing how this approach sustains rather than replaces convention dynamics.
answer: |-
  **Recommendation:** Formalize the annotation norm with a 12-month sunset clause and an embedded review process assessing common-knowledge restoration.  

  **Reasoning:**  
  The core Lewisian conditions are: a recurrent coordination problem, a stable/arbitrary equilibrium, common knowledge of expectations, and salience sustained by precedent. Our situation presents a clear coordination problem requiring contributors to signal edits predictably. The annotation practice constitutes an arbitrary but stable equilibrium. However, the *common knowledge* of this norm—and the *salience* previously provided by shared observational history—are demonstrably threatened due to scale-driven fragmentation. Digital expansion inherently fractures common knowledge: newcomers lack access to the dense network of precedents that originally established salience, and asymmetric observational access (e.g., varying document engagement, time on platform) prevents the uniform reinforcement necessary for self-sustaining convention.  

  Formalization with a sunset clause directly addresses the pro-formalization faction’s valid concern: without intervention, deteriorating common knowledge will cause coordination failure as the norm becomes invisible to critical masses of users. Automated flags temporarily restore salience by creating a unified, platform-wide signal, compensating for lost precedent density.  

  Crucially, the sunset mechanism acknowledges the anti-formalization faction’s best point: that top-down rules risk ossifying practice and displacing organic common-knowledge dynamics. By binding formalization to a review, we treat the rule not as a replacement for convention, but as a *scaffold* to rebuild it. The review will explicitly assess whether common knowledge and precedent-based salience have regenerated organically—measured via user surveys, annotation compliance *without* flags, and newcomer onboarding patterns. This preserves flexibility: if the community demonstrates reconstituted self-enforcement, the rule expires, restoring a Lewisian equilibrium. If not, the committee reevaluates based on observed deficiencies. Temporary formalization thus mitigates immediate coordination failure while creating conditions for emergent norms to re-root at scale.
