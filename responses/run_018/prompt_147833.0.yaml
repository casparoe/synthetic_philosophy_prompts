  Here’s a complete, ready-to-run in-class game designed to make Quine’s indeterminacy of translation tangible for your students. It’s structured for 12 grad students, 75 minutes, with zero prep needed from them (no pre-reading). The goal is to force teams to confront how behavioral evidence underdetermines reference, using the "glex" puzzle and a hidden catch with the shadow card.

  ---

  ### **Game Overview**
  - **Core Idea**: Teams create translation manuals for "glex" (an alien term) using only behavioral data. All manuals must fit one of Quine’s interpretations (rabbit, undetached rabbit part, temporal rabbit stage). The twist: behavioral data is ambiguous, and an extra "shadow card" for one team reveals how analytical hypotheses absorb counter-evidence.
  - **Quine’s Point Illustrated**: Observationally equivalent manuals show reference is underdetermined by behavior. The debrief highlights how real translation depends on holistic belief networks, but classroom rules block this.

  ---

  ### **Materials Needed**
  - **Data Packets** (print 3 copies, one per team):  
    Each packet contains 4 scenario cards. **Teams 1 and 2 get Cards 1–3; Team 3 gets Cards 1–4 (with the shadow card as the tie-breaker catch)**.  
    *Data is consistent but ambiguous—designed so all three interpretations work with analytical hypotheses*.

    **Card 1: Whole Rabbit**  
    - *Situation*: Whole rabbit sitting in open field.  
    - *Utterance*: Native says, “Glex!”  
    - *Tests*:  
      - Linguist points to whole rabbit, asks, “Glex?” → Native assents ✅.  
      - Linguist points to rabbit’s foot (attached), asks, “Glex?” → Native dissents ❌.  

    **Card 2: Temporal Stage**  
    - *Situation*: Rabbit running past a tree. Native says, “Glex!” as rabbit passes the tree.  
    - *Tests*:  
      - Linguist points to the *same rabbit* 5 seconds later (away from tree), asks, “Glex?” → Native dissents ❌.  

    **Card 3: Rabbit Part (Undetached)**  
    - *Situation*: Rabbit hidden behind rock; only head visible.  
    - *Utterance*: Native says, “Glex!”  
    - *Tests*:  
      - Linguist points to visible head, asks, “Glex?” → Native assents ✅.  

    **Card 4 (Extra for Team 3): Shadow “Rabbit”**  
    - *Situation*: Rabbit-shaped shadow on ground (no rabbit present).  
    - *Utterance*: Native says, “Glex!”  
    - *Tests*:  
      - Linguist points to shadow, asks, “Glex?” → Native assents ✅.  

  - **Team Instructions** (write on board or handout):  
    - Team 1: “glex” = **rabbit** (whole object).  
    - Team 2: “glex” = **undetached rabbit part**.  
    - Team 3: “glex” = **temporal stage of rabbit**.  
    - **Rules**:  
      1. Use ONLY behavioral evidence (assent/dissent + stimuli).  
      2. NO appeals to “common sense” (e.g., “rabbits aren’t shadows!”).  
      3. Explain ALL data using your assigned meaning + **analytical hypotheses** (auxiliary beliefs about how natives perceive the world).  
      4. Prepare a 3-min presentation: Your translation manual + how it handles each card.  

  ---

  ### **Step-by-Step Flow** (75 mins total)
  1. **Intro & Team Setup** (5 mins)  
     - Briefly set the scene: “You’re field linguists documenting an alien language. Your job is to translate ‘glex’ using only what you observe—pointing, sounds, assent/dissent. No mind-reading!”  
     - Split into 3 teams (4 students each). Assign interpretations (write on board: Team 1 = rabbit; Team 2 = part; Team 3 = stage).  
     - Hand out data packets: **Team 3 gets Card 4 (shadow); Teams 1/2 do NOT**.  
     - Emphasize rules: “Stick to your assigned meaning. If you catch yourself thinking, ‘But rabbits are X,’ stop! You can only use the cards.”

  2. **Team Work: Build Translation Manuals** (25 mins)  
     - Teams analyze data and craft their manuals. Circulate to enforce rules and nudge them toward analytical hypotheses.  
     - **Anticipated Struggles & How to Fix**:  
       - *Problem*: Students “cheat” by importing intuitions (e.g., “Obviously, ‘glex’ means rabbit!”).  
       - *Shut it down*: Ask: “What in the data *forces* that? Could the native believe something else?” Redirect to auxiliary beliefs (e.g., “Could the native think shadows are rabbits?”).  
       - *Problem*: Teams ignore dissent patterns (e.g., Card 2’s dissent with the later rabbit).  
       - *Fix*: Ask: “Why would the native dissent here? What auxiliary belief explains this?”  
     - **Sample Solutions for Teams**:  
       - *Team 1 (Rabbit)*:  
         - Card 2 dissent: Natives believe “glex” only refers to rabbits *at specific locations* (auxiliary: space-bound ontology).  
         - Card 3 assent: Pointing to head = pointing to whole rabbit *when part is hidden* (auxiliary: “part-whole” pointing conventions).  
         - Card 4 (if they see it): Natives mistakenly believe shadows *are rabbits* (auxiliary: false perceptual belief).  
       - *Team 2 (Undetached Part)*:  
         - Card 1 dissent: “Glex” refers to the *entire collection* of parts, not single parts (auxiliary: mereological beliefs).  
         - Card 2 dissent: The rabbit’s parts *after movement* aren’t the same “glex” (auxiliary: parts are motion-dependent).  
         - Card 4: Shadows are *manifestations* of rabbit parts (auxiliary: perceptual beliefs about light).  
       - *Team 3 (Temporal Stage)*:  
         - Card 3 assent: Visible head = *stage* of the rabbit at that moment (auxiliary: time-slice ontology).  
         - Card 4: Shadow is a *temporal stage* of a “rabbit” (auxiliary: shadows as temporal entities).  

  3. **Presentations** (30 mins; 10 mins per team)  
     - Each team presents their manual. Focus: How their interpretation + analytical hypotheses explain all data.  
     - **Key Moment**: Team 3 reveals the shadow card. Other teams react: “Wait, we didn’t get that card!”  
     - Let teams debate briefly. Highlight: Team 3’s manual “absorbs” the shadow using auxiliary beliefs, just like Teams 1/2 *could* if they had the card.

  4. **Debrief** (15 mins)  
     - Start with: “Why did all three manuals work? What’s the problem here?”  
     - **Map to Quine**:  
       - Observational equivalence: All manuals fit the data because behavioral evidence (assent/dissent) underdetermines reference.  
       - Analytical hypotheses: Each team used auxiliary beliefs (about perception, space, time) to “save” their manual. Quine says this is inevitable—no “fact of the matter” without tying meaning to holistic belief networks.  
       - The catch: The shadow card *seemed* like a tie-breaker, but Teams 1/2 could have absorbed it too (e.g., “If Team 1 got the shadow, they’d say natives believe shadows are rabbits”).  
     - **Limitations of the Simulation**:  
       - Real translation breaks ties through **practical coordination** (e.g., asking natives to *use* “glex” in actions, like fetching rabbits). Your rules blocked this, artificially isolating “glex” from the web of beliefs.  
       - **Holism**: Real translation tests clusters of beliefs (e.g., “glex” + “running” + “hungry”). Here, we only tested one word—so analytical hypotheses could always “rescue” interpretations.  
     - **End with Punchline**: “Quine isn’t saying translation is impossible—just that reference is indeterminate without shared, embodied context. You *can* translate ‘gavagai’ for fieldwork, but you can’t prove rabbits aren’t rabbit-stages.”

  ---

  ### **What Will Go Wrong (and How to Handle It)**
  1. **Students “Cheat” with Intuitions**:  
     - Likely during team work (e.g., “But temporal stages aren’t real!”).  
     - **Shut it down**: Remind them, “You’re aliens now! If the data allows it, you must entertain it. What auxiliary belief makes this work?” If they persist, challenge: “Show me in the data where your intuition is required.”

  2. **Teams Resist Their Interpretation**:  
     - E.g., Team 2 (undetached parts) insists it’s unnatural.  
     - **Reframe**: “Quine’s point is that ‘unnatural’ doesn’t mean ‘wrong.’ Your job is to prove it’s *possible*, not intuitive.”

  3. **Shadow Card Feels “Unfair”**:  
     - When Team 3 presents it, others may protest.  
     - **Use it**: “Exactly! Quine says new evidence *always* gets absorbed by analytical hypotheses. Could your manual explain the shadow? How?”

  4. **Time Crunch**:  
     - If teams lag, cut team work at 20 mins. Skip Q&A in presentations if needed. Focus on the debrief.

  ---

  ### **Why This Works**
  - Students **experience** indeterminacy: They’ll struggle to defend their manual without smuggling in metaphysics.  
  - The shadow card is the “aha” moment: It feels decisive but evaporates under analytical hypotheses.  
  - Debrief explicitly links to Quine: No jargon, just clear parallels to radical translation’s limits.  

  This is casual, rigorous, and requires zero student prep. Just print packets, assign teams, and let Quine’s problem unfold!
