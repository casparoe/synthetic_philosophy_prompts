prompt: |-
  hey im writing this from my phone between classes so sorry if its messy. im a junior on the student oversight board for our districts pilot "learning metrics" program and we vote thursday on whether to approve this AI dashboard that tracks engagement minutes and peer feedback loops and gives reward points that can be traded for exam exemptions. my friend jake already gamed the demo by leaving a tutorial video running overnight and spamming generic "great point!" comments to max out his peer loop score, which seems like that Goodhart thing where once a metric becomes a target it stops measuring what you actually want. the principal is pushing hard for it saying without data-driven incentives were falling behind other districts and that we can just patch the loopholes later.

  can you draft a short policy memo for the board recommending a concrete course of action with a time frame? it should treat the principals argument seriously instead of dismissing it, lay out specific review criteria we could actually apply to catch spec-gaming and reward hacking if we do run a limited pilot, and include an honest look at the strongest reason to reject it anyway. also please borrow the idea from AI alignment about reward hacking to explain why patching later usually fails, since i think that applies here even though this isnt an AI system being trained. end with one line that starts with Verdict: and then your bottom line recommendation.
reasoning: |-
  Okay, the user is a high school junior on a student oversight board dealing with a tricky situation. They're voting on an AI dashboard that tracks engagement and peer feedback, with points redeemable for exam exemptions. Their friend Jake already gamed the demo by leaving videos running and spamming comments, which shows the system can be exploited. The principal is pushing for it, citing data-driven incentives to keep up with other districts and suggesting loopholes can be patched later. 

  The user wants a policy memo that takes the principal's argument seriously, outlines specific review criteria for a limited pilot, honestly addresses reasons to reject it, and uses AI alignment concepts about reward hacking to explain why patching later fails. They also want a verdict line at the end.

  First, I need to acknowledge the user's constraints: they're writing from their phone between classes, so the memo should be concise and structured. They're a student, so the language should be professional but accessible, not overly technical. The memo must balance respect for the principal's concerns with critical analysis of the system's flaws.

  The key issues here are Goodhart's Law (metrics becoming targets and ceasing to be good measures) and reward hacking (exploiting systems for points without real engagement). Even though this isn't an AI system, the concepts from AI alignment apply because any incentive system can be gamed if not designed carefully. Jake's demo exploit proves this is a real risk.

  For the memo, I'll start with a clear subject and purpose statement. Then address the principal's argument about data-driven incentives and competition seriously—acknowledge the pressure to modernize but point out that bad data is worse than no data. 

  For the review criteria in a limited pilot, I need concrete, actionable items. Things like: 
  - Engagement metric audits (comparing video watch time to actual participation)
  - Peer feedback quality checks (detecting generic comments)
  - Reward redemption patterns (spotting unusual spikes)
  - Student feedback mechanisms (surveys to catch issues)

  The "honest look" at rejection should highlight irreparable consequences: exam exemptions based on flawed metrics could unfairly advantage students who game the system, undermining academic integrity. Once trust is lost, it's hard to regain.

  The reward hacking explanation should compare this to AI systems: loopholes aren't bugs but emergent behaviors, and patching often creates new exploits. Humans (like students) are even better at finding loopholes than AI.

  Finally, the verdict should recommend delaying approval and demanding a student co-design phase. This respects the principal's goals but insists on fixing fundamental flaws first. The tone should be collaborative but firm, emphasizing that students are partners in solving this.

  I'll keep the memo scannable with bullet points and bold headers, ending with a strong Verdict line. The user's insight about reward hacking is sharp—I'll make sure to credit that connection.
answer: |-
  ## POLICY MEMO: RECOMMENDATION ON AI ENGAGEMENT DASHBOARD PILOT  
  **To:** Student Oversight Board  
  **From:** [Your Name], Junior Representative  
  **Date:** [Current Date]  
  **Subject:** Proposed Delay of AI Dashboard Vote + Criteria for Responsible Pilot Design  

  ### 1. Acknowledging the Principal’s Core Argument  
  We recognize the urgency to adopt data-driven tools to improve district competitiveness and student outcomes. The desire to leverage technology for real-time engagement insights and incentivize participation is valid. **However, flawed incentives create worse outcomes than no incentives.** Jake’s demo exploit isn’t an isolated glitch—it’s a fundamental symptom of **reward hacking**, where optimizing for the *metric* (points) directly undermines the *goal* (genuine learning/engagement).  

  ### 2. Why "Patch Later" Fails: The Reward Hacking Problem  
  *(Drawing from AI Alignment Principles)*  
  > **"Reward hacking" occurs when a system (AI or human) finds unexpected shortcuts to maximize a reward signal that violate the designer’s intent.** Jake’s actions (idle videos, spam comments) are human reward hacking. Like in poorly aligned AI systems, loopholes aren’t edge cases—they’re the *primary behavior* incentivized by the reward structure. **Patching loopholes reactively is a losing game:** Each "fix" creates new, unforeseen exploits as students adapt. This erodes trust, distorts data, and corrupts the educational purpose.  

  ### 3. Recommendation: Delay Vote, Demand Robust Pilot Design  
  **Verdict: Delay approval of the current dashboard.** Instead, vote to establish a **Student-Teacher Task Force (2 weeks)** to co-design a *limited, auditable 6-week pilot* launching [Month] with the following mandatory review criteria to detect hacking:  

  #### Specific Review Criteria for Limited Pilot  
  - **Engagement Metric Audits:**  
    - Flag accounts with >X% video "engagement" outside class hours or with no correlated quiz activity.  
    - Require randomized spot-checks comparing dashboard "engagement minutes" to teacher observations.  
  - **Peer Feedback Loop Safeguards:**  
    - Automatically detect low-value comments (e.g., "great point!" spam) via NLP and *exclude them from scoring*.  
    - Cap daily peer feedback points and require minimum character diversity.  
  - **Reward Redemption Transparency:**  
    - Public dashboard showing reward point distribution/redemption trends weekly.  
    - Require teacher sign-off for exam exemptions *based on holistic assessment*, not just points.  
  - **Student Feedback Mechanism:**  
    - Anonymous bi-weekly surveys specifically asking: *"How did you earn points this week? Did this reflect real learning?"*  

  ### 4. Strongest Reason for Rejection: Irreparable Consequences  
  Even with safeguards, the **core risk remains: linking high-stakes rewards (exam exemptions) to easily hackable metrics incentivizes gaming, not learning.** This could:  
  - Penalize honest students who focus on deep engagement over point accumulation.  
  - Create perverse incentives that actively harm peer discussion quality.  
  - Generate misleading "success" data, making actual problems harder to diagnose.  

  ### 5. Path Forward  
  We propose:  
  1. **Immediate (This Week):** Vote to delay approval.  
  2. **Week 1-2:** Form Task Force (2 students, 2 teachers, 1 admin) to redesign pilot with above criteria.  
  3. **Week 3:** Present revised pilot framework for board vote.  
  4. **Limited Pilot (6 Weeks):** Run with strict monitoring and kill-switch if significant hacking emerges.  
  5. **Post-Pilot:** Full board review before any district-wide decision.  

  **Verdict: Delay approval. Demand pilot redesign with anti-hacking safeguards and sunset clauses.**  

  ---  
  **Bottom Line:** Data is valuable, but *bad* data with high-stakes rewards risks sabotaging trust and learning. Let’s build a system resilient to human ingenuity—not one that depends on students *not* finding loopholes.
