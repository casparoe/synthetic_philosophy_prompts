  - awkward_fits: might be argued to meet but with strain, or partially.

  Now, the prose:

  As a retired biologist delving into moral philosophy, you've recognized the parallel between Moore's organic unities and emergent properties in biology. An adequate theory of intrinsic value must explain why certain wholes possess value that isn't reducible to their parts, respecting the distinct structures of aesthetic appreciation (subject-object) and friendship (subject-subject). It should also remain open to the possibility of downward causation, where the whole's value influences the parts, without contradicting established findings in aesthetics or social psychology. The theory must account for non-fungible goods, the persistence of value without conscious experience, and the negative values of ugliness and betrayal. It should also handle cases where a whole is valuable despite containing negative parts, such as a tragic artwork.

  Moore's own view excels in capturing non-decomposability and irreducibility but falters on downward causation and empirical compatibility. Hedonist and preference-satisfaction accounts fail on non-decomposability and irreducibility, though they handle negative values. All theories struggle to fully capture the asymmetry between aesthetic and interpersonal goods without awkwardness.

  The most exclusive requirement is non-decomposability (D1), as it fundamentally challenges reductionist approaches and is central to the Moorean insight.

