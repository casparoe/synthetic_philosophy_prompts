  - reason: string

  Then, scoring: an object with three sub-objects (Moorean_holism, hedonist_reduction, preference_account) each having:
  - meets: array of ids of desiderata it meets
  - fails: array of ids it fails
  - awkward_fits: array of ids where it's awkward

  Finally, most_exclusive_requirement: an object with:
  - id: string (the id of the desideratum)
  - justification: string

  We must assign IDs to desiderata. Let's do:

  D1: Non-Decomposability
  D2: Asymmetry
  D3: Downward Causation
  D4: Irreducibility of Aesthetic Value
  D5: Irreducibility of Interpersonal Value
  D6: Non-Fungibility
