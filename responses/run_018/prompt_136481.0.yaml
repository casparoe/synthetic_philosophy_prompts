  ### Main Argument
  Any adequate theory of intrinsic value must reconcile Moorean "organic unities" with empirical insights from aesthetics and social psychology. The core challenge lies in explaining how aesthetic and interpersonal goods exhibit non-decomposable value—where the whole's worth isn't reducible to its parts—while respecting their structural asymmetry: appreciating a landscape is a subject-object relation, whereas friendship is a reciprocal subject-subject engagement. The theory must also accommodate the possibility of downward causation, where the whole's value influences the parts (e.g., friendship imbuing mundane interactions with significance), without contradicting phenomenology or scientific findings. Non-negotiable demands include irreducibility, non-fungibility, and compatibility with the negative dimensions of ugliness or betrayal. Moore's non-natural holism excels in capturing organic unity but stumbles on downward causation and empirical grounding. Hedonism and preference-satisfaction accounts reductively flatten non-decomposable goods into aggregates of pleasure or desire, violating irreducibility and misrepresenting the asymmetry. The most exclusive requirement is **non-decomposability (D1)**, as it directly invalidates reductionist frameworks and anchors Moore's critique.

