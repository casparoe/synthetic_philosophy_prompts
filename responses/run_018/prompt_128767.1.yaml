  The cognitive decline case (a) will test how the procedure handles contested authority. The metaphor deletion case (b) probes how it reconciles revisions with published defenses. The "erroneous claim" case (c) is especially interesting—it'll force the board to confront the limits of editorial intervention, even when they personally disagree with the author.

