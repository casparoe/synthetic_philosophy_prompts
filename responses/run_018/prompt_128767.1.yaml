answer: |-
  Below is a comprehensive decision procedure designed for your editorial board, grounded in mainstream philosophy of language (e.g., E.D. Hirsch on intentionality, Barthes/Death of the Author critiques) and textual scholarship (e.g., Tanselle, Shillingsburg). It prioritizes **documentable evidence** over speculation and demarcates where value judgments begin.

  ---

  ### **1. Decision Procedure: Authorial Intention Evaluation Checklist**  
  *(Execute steps sequentially; halt at any "STOP" point)*  

  **STEP 1: MATERIAL EVIDENCE ASSESSMENT**  
  - *Task:* Identify all physical layers (primary script, ink colors, annotations).  
  - *Evidence Required:* Date annotations (via ink analysis, paper stock, or external diaries).  
  - *Decision:* If annotation falls **within documented cognitive decline period**, flag for STEP 4.  
  - *STOP If:* Dating is inconclusive → Flag passage for commentary.  

  **STEP 2: EXECUTIVE INTENTION VALIDATION**  
  - *Task:* Did the author **deliberately intend** this revision as a final emendation?  
  - *Evidence Required:*  
    - ✅ **Sufficient:** Multiple similar revisions in other notebooks (pattern evidence);  
    - ✅ **Sufficient:** Direct correspondence stating intent (e.g., "Revise all references to X to Y");  
    - ❌ **Insufficient:** Isolated mark; ambiguous scribble; revision contradicts author’s lifelong stylistic habits.  
  - *Decision:* If executive intention validated → Proceed to STEP 3. Else → Preserve primary text.  

  **STEP 3: INTERPRETIVE INTENTION CONSISTENCY**  
  - *Task:* Does the revision align with the author’s **known interpretive framework**?  
  - *Evidence Required:*  
    - Published works, interviews, or letters explaining key concepts;  
    - Revision resolves logical inconsistencies in primary text;  
    - Revision amplifies (not contradicts) the author’s core theories.  
  - *Conflict Protocol:* If revision conflicts with author’s **published anti-intentionalist stance** (e.g., "Texts stand alone"):  
    - Adopt revision ONLY if it improves textual coherence (per New Critical principles).  
    - Else → Preserve primary text + flag theoretical tension.  
  - *STOP If:* Ambiguity persists → Flag for commentary ("Authorial intent vs. theoretical commitment conflict").  

  **STEP 4: COGNITIVE DECLINE PROTOCOL**  
  - *Task:* Assess revisions during documented decline.  
  - *Evidence Required:*  
    - Medical records confirming impairment onset;  
    - Comparison to pre-decline revisions (e.g., erratic ink pressure? Loss of thematic focus?).  
  - *Decision:*  
    - If revision **aligns with pre-decline patterns** → Treat as authoritative.  
    - If revision **contradicts lifelong beliefs/habits** → Revert to primary text + flag "Possible cognitive interference."  
  - *STOP Here:* All decline-period revisions require editorial commentary.  

  **STEP 5: FINAL AUTHORITY OVERRIDE TEST**  
  - *Task:* Does the revision meet the **Executive Authority Threshold**?  
  - *Criteria:* Revision must pass BOTH:  
    - (a) Executive intention validated (STEP 2) *and*  
    - (b) No unresolved conflict with interpretive intent (STEP 3) or cognitive status (STEP 4).  
  - *Decision:*  
    - ✅ Pass → Adopt revision as authoritative.  
    - ❌ Fail → Preserve primary text.  

  ---

  ### **2. Worked Applications**  

  **CASE A: Cognitive Decline Annotation**  
  - *Primary Text:* "Democracy requires moral absolutism."  
  - *Red-Ink Annotation (during decline):* "→ relativism"  
  - *Procedure:*  
    1. STEP 1: Annotation in decline period → Proceed to STEP 4.  
    2. STEP 4: Author’s published works consistently defend absolutism. Revision contradicts 40 years of arguments → **Revert to primary text** + Flag: "Revision during decline contradicts author’s core philosophy."  

  **CASE B: Cross-Out of Defended Metaphor**  
  - *Primary Text:* "Society is a **tapestry** (threads of individual wills)."  
  - *Revision:* "Society is a **machine**" + Crosses out "tapestry."  
  - *Published Letter:* "The 'tapestry' metaphor is indispensable to my collectivism."  
  - *Procedure:*  
    1. STEP 2: Executive intention validated (deliberate cross-out).  
    2. STEP 3: Revision contradicts explicit defense → **Conflict with interpretive intention**.  
    3. STEP 5: Fails Authority Threshold → **Preserve primary text** + Flag: "Revision contradicts author’s stated interpretive intent."  

  **CASE C: Preservation of Erroneous Claim**  
  - *Primary Text:* "Kant’s *Critique* was published in **1788**." (Actual: 1781)  
  - *Your View:* Factually wrong; should be corrected.  
  - *Procedure:*  
    1. STEP 2: No revision exists → No executive intent → **Preserve primary text**.  
    2. *Why?* Editors cannot impose "accuracy" without authorial sanction (per Hirsch: meaning resides in author’s will). Correcting errors imposes **editorial intentionality**—violating the estate’s duty to preserve authorial voice. *Flag in commentary:* "Factual error; no authorial correction attempted."  

  ---

  ### **3. Limits of the Procedure & Handover Protocol**  

  **What the Procedure Cannot Settle:**  
  - Conflicts between the author’s **published theories** (e.g., "Texts have no author") and **private revisions** (implying authorial control).  
  - Revisions where executive intent is clear but **ethically problematic** (e.g., discriminatory language added during decline).  
  - **Aesthetic judgments** (e.g., whether a revision "improves" the text).  

  **Handover to Human Judgment:**  
  > *When the procedure halts at a "STOP" point or encounters unresolvable conflicts in STEP 3/4, the passage is flagged. The editorial board and legal representative must jointly decide based on:*  
  > - **The Estate’s Mission** (e.g., fidelity to author’s legacy vs. public accessibility);  
  > - **Ethical/Legal Risks** (e.g., propagating harmful content);  
  > - **Scholarly Impact** (e.g., will this affect the author’s critical reception?).  
  >   
  > ***Sign-Off Requirement:***  
  > *"We, the undersigned, acknowledge this decision reflects irreducible value judgments about the author’s legacy, not recoverable authorial intention."*  
  > `_________________________` (Lead Editor) | `_________________________` (Legal Representative) | `Date: __________`  

  ---

  **Why This Works for Non-Philosophers:**  
  - Converts abstract debates into **binary checks** (e.g., "Is there a dated letter about this revision? Y/N").  
  - Uses **tangible evidence** (ink, paper, letters) rather than theoretical arguments.  
  - **Misfire Safeguards:** Flags all "STOP" points for review, preventing overconfidence in ambiguous cases.  
  - **Anti-Intentionalist Conflict:** By deferring to *textual coherence* when revisions clash with published theories, it respects the author’s public stance without ignoring their private actions.  

  This procedure balances philosophical rigor with archival practicality—ensuring decisions are defensible to scholars while operable by non-specialists.
