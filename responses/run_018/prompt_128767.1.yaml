  Better ground everything in citable theory. Wimsatt/Beardsley's intentional fallacy for the anti-intentionalist conflict, Dworkin on constructive interpretation, maybe even medical ethics frameworks for the cognitive decline rulings. But keep the language jargon-free—hence "Executive Authority Score" instead of "hermeneutic weight."

  ...Wait, should the red-ink case automatically disqualify revisions? Not necessarily—if there's evidence the change predates decline, it might stand. The procedure must allow for that nuance. Similarly, the "erroneous claim" example must emphasize that authorial accuracy isn't the editor's burden. That'll frustrate some board members, but it's philosophically sound.

