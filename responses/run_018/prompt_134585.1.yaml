prompt: |-
  I'm in this metaphysics course and we spent a lecture on Gödel's rotating universe. My roommate tried to explain it to me and said: Gödel found a solution to Einstein's equations where the universe spins around, which creates these closed timelike curves so in principle you could travel back and meet yourself. Then he used that result to argue time isn't objectively real — like, it's just a subjective feature of human consciousness, pretty close to what Kant said but now backed up by math. According to my roommate, Gödel thought this proves there's no real flow from past to future, and actually he was defending a kind of block universe where every moment exists equally, which is why he believed the rotating model was physically realistic and not just a theoretical trick. The roommate also said Gödel believed this eliminates any objective distinction between cause and effect, since in the loop they become circular.

  Something feels off, especially the part about the block universe — I thought Gödel was more of an idealist? And I'm not sure if he really thought time travel was physically possible or just that the math shows something conceptually weird about time. Can you break down the summary and tell me what's accurate, what's a misreading, and what Gödel himself would push back on? I need to know whether the philosophical conclusion actually depends on the physical model being true, or if he saw them as seperate issues. Don't worry about citing specific papers, I just want to check my understanding before I write my response paper.
