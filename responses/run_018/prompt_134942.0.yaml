prompt: |-
  Act as an expert philosophy-of-language educator who's actually taught vagueness to non-philosophers before, and please think carefully — do some quick brainstorming first before you lay out the plan.

  I'm running a single 90-minute workshop for cognitive-science grad students who know logic basics but haven't touched formal semantics. The concept I need to teach is the split between epistemicism and supervaluationism about vagueness. Don't explain the theories to me; build me a teaching plan.

  First, the dependancy structure: what idea has to land before they can even see why epistemicism isn't just regular skepticism? What's the minimal logical machinery they need — maybe just the idea that a predicate can have sharp boundaries we can't locate — and in what order do I build up to the two views?

  Second, the carrying example. I want to avoid the bald-man and heap-of-sand cliches because this crowd has seen them in every pop-sci article. I was considering framing everything around an ML classifier that assigns confidence scores to 'tall tree' in a forestry dataset, using the threshold where the model flips from 0.49 to 0.51. Is that actually pedagogically sound, or does it smuggle in hidden assumptions about measurement? If it works, what properties must it have and what must it lack? If not, propose an alternative concrete scenario that still avoids the standard examples.

  Third, miscoceptions. I'm expecting they'll think epistemicism is just "we don't know where the line is" in an ordinary knowledge sense, and that supervaluationism means "truth is subjective" or that it rejects bivalence in some sloppy postmodern way. Map exactly where in the sequence each misconception will arise and how to head it off without just repeating definitions.

  Fourth, one check question for the end that shows they've grasped the structural difference — not just the labels — and one explicit thing I should refuse to explain at this level (maybe formal precisification spaces, or the link to three-valued logics?).

  Keep it casual, don't bother with a bibliography or reading list since there's no time, and ignore any typo in my prompt — there's probably one in there.
reasoning: |-
  Okay, the user wants a teaching plan for a 90-minute workshop on epistemicism vs. supervaluationism for cognitive science grad students. They mentioned avoiding clichéd examples like the heap paradox and using an ML classifier instead. Let me start by understanding their main points.

  First, dependencies. The key ideas needed before diving into the theories. They need to grasp that vagueness isn't just about ignorance but involves boundarylessness. The minimal logical machinery includes bivalence and sharp boundaries. So the sequence should start with clear cases, then borderline cases, and the idea that predicates have sharp boundaries we can't know, which sets up epistemicism. Then introducing the concept of multiple precisifications for supervaluationism.

  Next, the example. Using an ML classifier for "tall tree" with confidence scores. The user is worried this might imply hidden assumptions. I should assess if this is pedagogically sound. The ML approach is good because it's familiar to cognitive science students. But I need to ensure it doesn't smuggle in measurement assumptions. The example must show that the model's threshold is arbitrary, not ontological. Emphasize that the 0.5 cutoff is a choice, not a discovered truth. Avoid examples where the model's confidence reflects actual probabilities. Maybe contrast with a rule-based system to highlight arbitrariness.

  Misconceptions. Students might confuse epistemicism with ordinary skepticism. To counter this, stress that the sharp boundary exists but is unknowable in principle, not just practically. For supervaluationism, they might think it's subjective. Clarify that it's about multiple objective ways to sharpen, not personal opinion. Anticipate where these arise: when introducing epistemicism, emphasize metaphysical certainty vs. epistemic access. For supervaluationism, distinguish between precisifications and subjective judgments.

  Check question. Need one that reveals structural understanding. Ask them to explain why "Tree X is tall" is neither true nor false under supervaluationism but has a truth value under epistemicism, even if unknown. Avoid explaining formal precisification spaces or three-valued logics to keep it accessible.

  Alternative example if ML is problematic. Use a committee setting standards for "tall tree," where each member has a different cutoff. This avoids technical ML details and still shows multiple precisifications.

  Timing for 90 minutes. Allocate intro (10 min), vagueness setup (15 min), epistemicism (20 min), supervaluationism (20 min), contrast (15 min), Q&A (10 min). Use live polls for borderline cases to engage them.

  Finally, ensure the ML example lacks properties like real-world measurement dependencies. Focus on the arbitrariness of the threshold. Highlight that both theories address the same phenomenon but with different solutions: one sharp boundary vs. many sharpenings.
answer: |-
  Here’s a battle-tested 90-minute workshop plan designed for cognitive science grads. I’ve taught this exact split using non-standard examples to avoid yawns.

  **Core Dependency Structure (30 mins total):**
  1.  **Vagueness ≠ Ambiguity (5 min):** Start with *one* borderline case (e.g., "Is this [show slightly faded teal color swatch] *teal*?"). Contrast with ambiguity ("I saw a bat" – animal vs. sports gear). **Key:** Vagueness is about *single meanings* with unclear boundaries.
  2.  **Borderline Cases ≠ Ignorance (10 min):** Use a spectrum (e.g., 100 color swatches from clear BLUE to clear GREEN). Ask: "For which swatch does 'blue' become false?" Consensus: No single point. **Crucial Insight:** "It's not that we don't know *which* swatch is the boundary; it's that there *is no such boundary* in the meaning itself." This kills "ordinary skepticism."
  3.  **Bivalence Under Threat (10 min):** Pose: "For swatch #42 (a clear borderline case), is the statement 'Swatch #42 is blue' TRUE or FALSE?" Highlight the intuitive pull to say "Neither" or "It depends." **Minimal Logic:** They just need bivalence (every meaningful declarative sentence is T or F) as the *stakes*. The conflict is: Bivalence seems intuitive for clear cases but clashes with borderline intuition.
  4.  **The Forced Choice (5 min):** Frame the dilemma: "We have borderline cases. Bivalence seems fundamental. We have two escapes: 1) Insist there *is* a sharp boundary *somewhere*, we just can't find/know it (Epistemicism). 2) Reject the idea that borderline sentences have a *single* truth value in the classical sense (Supervaluationism)."

  **The ML Classifier Example - Tailored & Safe (20 mins):**
  *   **Use it!** It's excellent for cognitive scientists. Frame it: "Imagine we *train* an ML model on a forestry dataset. We label trees clearly <8m as 'NOT tall', >15m as 'tall'. The model learns a function outputting confidence scores (0-1) for 'tall tree' for heights in between."
  *   **Properties it MUST Have:**
      *   **Arbitrary Threshold:** Emphasize the 0.5 threshold is *chosen* by the *programmer* for decision-making, not discovered in nature. "It flips at 10.23m *because we told it to use 0.5*, not because 'tallness' magically changes there."
      *   **Confidence ≠ Truth:** Stress the score is the model's *estimation of probability of being labeled tall by the training set*, NOT an ontological degree of tallness. "0.49 means the model thinks it's *very likely* humans would call this tree 'not tall'."
      *   **Borderline Exists:** Show heights where confidence is ~0.5 (say 0.4-0.6). Ask: "What does the model *really* tell us about a tree at height X with confidence 0.5? It tells us humans *disagree* or are *uncertain*, not that the tree is '50% tall'."
  *   **Properties it MUST Lack:**
      *   **No Ontological Commitment:** Avoid phrases like "the model *discovers* the truth." Say "the model *predicts human classification behavior*."
      *   **No Measurement Smuggling:** Explicitly state: "The heights are precise measurements, but 'tall' isn't defined *by* the height number alone. The vagueness is in the *concept* 'tall tree', not in our ability to measure height."
  *   **Pedagogical Soundness:** It works because it externalizes the judgment (model predicting labels), making the arbitrariness of precise thresholds visible and separating *model decision* from *concept boundary*. It's familiar ground for them.

  **Targeted Misconception Busting (Integrated):**
  *   **Epistemicism ≠ Ordinary Skepticism (Arises during Step 2 & Epistemicism intro):**
      *   **Where it Arises:** When introducing "sharp boundary exists but we can't know it."
      *   **Head it Off:** "This is NOT like not knowing if a tree is exactly 10m tall because we used a bad tape measure. Epistemicism says the boundary is *metaphysically sharp* (like a specific Planck length... but for 'tall'!), yet it's *in principle unknowable* by *any means*. It's a fact hidden from all possible cognition." Contrast: "Could a super-duper laser measure settle it? Epistemicism: NO. Ordinary Skepticism: YES, in principle."
  *   **Supervaluationism ≠ Subjectivism/Relativism (Arises during SuperV intro):**
      *   **Where it Arises:** When talking about "many ways to make it precise" (precisifications).
      *   **Head it Off:** "These precisifications aren't personal opinions! Think of them like *valid completions of the rules*. If 'tall' means 'above average height for species X', precisifications fix *exactly* what 'average' means (mean? median?) and *exactly* which species grouping counts. It's objective whether a tree is tall *relative to a specific, fully defined rule set*." Hammer: "SuperTRUE means true on *every* valid sharpening, SuperFALSE means false on *every* one. It's not 'true for me, false for you'."
  *   **Supervaluationism ≠ Rejecting Bivalence Sloppily (Arises when discussing borderline sentences):**
      *   **Where it Arises:** When saying "'This borderline tree is tall' is neither true nor false."
      *   **Head it Off:** "Supervaluationism *preserves* classical logic and bivalence for *all precise statements*! 'True' and 'False' still mean what they always do. The innovation is recognizing that vague sentences *lack* a single truth value *because* they are incomplete descriptions. It's not adding a fuzzy 'middle' value; it's saying the sentence doesn't *get* a truth value until we complete the description (precisify)."

  **The Perfect Check Question (5 min):**
  *   **Question:** "Suppose we have a borderline case of a 'tall tree' (say, confidence ~0.5 in our ML model). According to Epistemicism, what is the *truth value* of the statement 'This tree is tall'? According to Supervaluationism, why might we say it *lacks* a classical truth value? Crucially, what *kind of fact* makes the statement true (or false) under each view?"
  *   **Why it Works:** It forces them to articulate:
      *   Epistemicism: The statement *is* T or F (bivalence holds!), determined by a **single, sharp, unknowable boundary** in reality.
      *   Supervaluationism: The statement **lacks a truth value** (it's neither T nor F) because its truth **depends on which precisification we choose**, and no single precisification is uniquely correct. Truth requires **supertruth** (true on all precisifications).
      *   It contrasts the *metaphysics* (one hidden boundary vs. many potential boundaries) underlying the semantics.

  **One Thing to REFUSE to Explain (Say This Explicitly):**
  *   **"We won't dive into the formal machinery of precisification spaces or how supervaluationism connects to three-valued logics (like Łukasiewicz) or fuzzy logic today. That's the next step after understanding this core philosophical split. For now, just grasp the *why* behind the two pictures: one sharp boundary we can't know vs. many sharpenings where truth requires universal agreement."**

  **Timeline Breakdown:**
  *   (0-10 min) Intro & Vagueness ≠ Ambiguity (Step 1)
  *   (10-25 min) Borderline Cases & Boundarylessness (Step 2 & 3 - Core Insight)
  *   (25-30 min) The Dilemma Forced (Step 4)
  *   (30-50 min) **Epistemicism Deep Dive:** Using ML example to illustrate the *existence* of the sharp threshold (programmer's choice!) and the *unknowability* (the model's confidence score isn't tracking the "true" boundary, it's predicting labels). Bust Epistemicism misconception.
  *   (50-70 min) **Supervaluationism Deep Dive:** Using ML example differently – imagine *many different valid training sets* or *many different valid threshold choices* by different programmers. Each is a precisification. "Tall" only SuperTRUE if *all* models trained on valid sets/outputs with valid thresholds say YES. Bust SuperV misconceptions.
  *   (70-85 min) **Contrast & Check Question:** Explicitly compare the metaphysics (one hidden line vs. many potential lines). Pose the check question. Facilitate discussion.
  *   (85-90 min) Wrap-up & "What We Didn't Cover".

  **Why This Works for CogSci:** Leverages their ML familiarity immediately, avoids tired paradoxes, focuses on the *conceptual* split in how language hooks onto the world (metaphysics + semantics), and directly preempts predictable misunderstandings. The ML example isn't perfect ontology, but it's a powerful *pedagogical tool* for this audience to grasp the structure of the debate. Good luck!
