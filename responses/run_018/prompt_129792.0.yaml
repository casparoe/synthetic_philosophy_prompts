  This document provides a scaffold for resolving disagreements through specific case analyses. Key friction remains at the ethical level (non-interference vs. agency-preservation) and the epistemic level (interpreting first-person reports amid altered phenomenology). Both sides agree coercion requires extraordinary justification—but define "extraordinary" through irreconcilable lenses.
