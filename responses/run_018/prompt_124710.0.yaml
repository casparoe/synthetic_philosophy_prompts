answer: |-
  1. Solomonoff induction isn't arbitrary; it's the *unique* prior (up to multiplicative constant) satisfying desiderata like consistency and computability, making it the epistemic gold standard for priors over computable universes.  
  2. A flat measure over observer-moments is *language-dependent* and fragile under duplication: splitting a branch artificially boosts observer-count, while compressed measure stays stable under such reparameterization.  
  3. Simplicity-weighting isn't "no reason" — it directly encodes *physical law parsimony*, which governs how macrostate entropy (where observers arise) supervenes on microstate complexity in deterministic systems.  
  4. Observers are *not* uniformly distributed across mathematical structures; they emerge in regions with stable, compressible laws, so simplicity-weighting tracks observer density better than brute indexical counting.  
  5. Kolmogorov complexity handles *unknown* indexical variables by weighting branches where your evidence (e.g., brain state) is algorithmically likely, avoiding the incoherence of flat measures over ill-defined "moments".
