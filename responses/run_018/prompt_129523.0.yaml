prompt: |-
  ok so i've been helping my advisor with a project on iterated amplification and i'm trying to figure out if my intuitions are consistent before i present them. here's where i stand: (1) breaking a hard task into human-checkable sub-tasks should preserve alignment since we audit each step. (2) but the decomposed model looses holistic competence because it never sees the big picture. (3) so we distill back up to recover performance, but then we're training on outputs we can't fully verify so alignment might slip. (4) i think this only works if the decomposition is faithful - the sub-tasks mirror actual reasoning steps, not just arbitrary chunks. (5) but for genuinely novel problems we don't already know the reasoning steps, so faithful decomposition is impossible and amplification can't help where we need it most. do these hang together? am i assuming in (4) that we already understand the domain well enough that amplification is redundant? and does (3) just undo (1) with no fix? rank the tensions by severity and tell me the cheapest revision, even if it hurts.
