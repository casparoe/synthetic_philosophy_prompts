answer: |-
  **Your intuitions suggest universals exist for intrinsic structural properties (physical or abstract) but not for functional roles, normative properties, or mere resemblance without structural identity.**

  ### Breaking down your cases:
  1.  **Two red bricks share "redness"**: Physical structure (light reflectance properties) is identical, supporting a universal.
  2.  **Red brick vs. mental afterimage**: Different substrates (physical vs. mental). Resemblance exists, but no shared intrinsic structure → no universal.
  3.  **Sand triangle vs. geometric triangle**: Both instantiate the same abstract geometric structure (three sides, angles summing to 180°) → universal for abstract structure.
  4.  **Human heart vs. mechanical pump**: Same function (move blood), different intrinsic structures → functional analogy, no universal "heart-ness."
  5.  **Just law vs. just person**: Justice here is a normative property applied to different kinds of things (rules vs. character). It's not an intrinsic structural property → likely resemblance or analogy, not a universal *in the structural sense* you accept.
  6.  **Two identical language models**: Identical weights = identical abstract computational structure. They share the **same structural blueprint** for processing information → universal "intelligence" (as defined by that structure) is instantiated separately but identically.

  ### The principle:
  *   **Universal = Identical intrinsic structure.** This structure can be physical (brick reflectance) or abstract (mathematical form, algorithmic weights). When instances share this identical structure, they share the universal.
  *   **No Universal = Functional role, normative property, or resemblance without structural identity.** Function (pumping blood), normativity (justice), or phenomenological similarity (redness across mind/matter) don't require or imply identical underlying structure.

  ### Applying it to "game-ness":
  *   Chess, soccer, and your new boardgame share **functional roles** (rules, goals, play) and perhaps **family resemblances**, but **not identical intrinsic structures**. The rules, components, and physical/logical interactions differ fundamentally.
  *   **Verdict:** No universal "game-ness" by your principle. Games are linked by functional analogy and overlapping resemblances, not a single shared structural essence.
