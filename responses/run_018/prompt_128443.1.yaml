prompt: |-
  I serve on an institutional review board for a public-science funder that receives frequent proposals to validate new measurement instruments—psychological screening tools, automated text-classifiers, clinical risk scores—and I need a reusable decision procedure I can run in about thirty minutes per proposal, without statistical expertise beyond what a generalist auditor can apply, because I have to sign off on funding recommendations. Too often a proposal validates an instrument by applying it to generate data, then uses those generated classifications as the criterion against which the instrument is tested: a circularity that may look like legitimate calibration but can be an illegitimate bootstrap in the epistemological sense, especially in cases of so-called easy knowledge where a source is used to establish the very warrant it needs. To operationalize this, the procedure should distinguish first-order bootstrapping—using the instrument’s own outputs as the direct validation criterion—from second-order bootstrapping—using prior outputs to shape the independent-looking criterion that then validates later versions—and it should apply an independent-anchor requirement: at least one node in the validation chain must not be causally or informationally downstream of the instrument’s own prior outputs.

  Write the procedure as an ordered checklist: the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure stops with a clear reject or clear pass, and where it must hand the decision to human judgment because the issue is one of values or stakes rather than logical structure. Be explicit about which steps are judgment calls disguised as procedure, flag exactly where the procedure is likely to misfire—for example, when an apparently independent criterion was subtly calibrated by exposure to the instrument’s outputs without explicit acknowledgment—and state two things the procedure absolutely cannot do, such as establishing the instrument’s base-rate reliability in the wild or resolving whether a small residual circularity is tolerable given high-stakes intervention.

  Then apply it to three proposals: (1) a depression-screening app validated by comparing its scores to clinician diagnoses that were made using the app’s preliminary risk flags as part of the clinical intake form; (2) a literacy-assessment tool validated against teacher ratings where teachers were trained using sample items drawn from the tool itself, but the final ratings used unseen texts; and (3) a widely supported, high-budget climate-adaptation survey instrument validated against expert annotations that are genuinely independent in origin, but where the procedure detects a hidden dependency because the expert panel’s coding manual incorporated terminology introduced by an earlier pilot of the same survey—this should be the unwelcome case, since the proposal is politically popular and well-funded, but your procedure should flag it or reject it, and you should say what the auditor must do with that result.

  Lead with the bottom line—the full procedure summarized in one paragraph—then expand with the checklist, the judgment points, the misfire warnings, the three worked cases, and the limits. Keep the entire response to a maximum of 850 words. Do not include a bibliography, reading list, or citation list; refer to theoretical distinctions by descriptive name only, and do not quote any specific text.
reasoning: |-
  Hmm, the user is describing a complex problem they face as an IRB member for a science funder. They need a quick, reusable decision procedure to detect circular validation in measurement instrument proposals, specifically distinguishing between first-order and second-order bootstrapping. The procedure must be executable in about 30 minutes by a generalist auditor without deep statistical expertise.

  The user clearly identifies two types of circularity: first-order (directly using instrument outputs as validation criteria) and second-order (using prior outputs to shape seemingly independent criteria). They emphasize the need for an independent anchor requirement - at least one validation node must not be downstream of the instrument's prior outputs.

  I need to design a practical checklist that:
  - Has clear sequential questions with sufficient answer criteria
  - Provides definitive pass/reject decisions where possible
  - Flags areas requiring human judgment
  - Explicitly warns about potential misfires (like subtly contaminated criteria)
  - States clear limitations (e.g., can't assess real-world reliability or tolerate circularity)

  For the three test cases:
  1) Depression app: Clinicians used app's risk flags → clear first-order circularity → reject
  2) Literacy tool: Teachers trained on tool items but rated unseen texts → passes with warning about training contamination
  3) Climate survey: Expert manual used terminology from pilot → second-order circularity → reject despite popularity

  Key structural elements:
  - Lead with one-paragraph procedure summary
  - Detailed checklist with 6 core questions
  - Explicit judgment points and misfire warnings
  - Worked examples applying the procedure
  - Stated limitations (can't assess field reliability or justify circularity)

  The procedure must remain under 850 words without citations, using descriptive names for concepts. I'll focus on creating a practical tool that addresses the epistemological concerns while respecting time constraints and auditor expertise levels.
answer: |-
  ### Bottom-Line Summary
  This 6-step procedure detects circular validation by requiring at least one non-downstream "anchor" criterion. It asks: (1) Is the criterion directly the instrument's output? (Reject if yes; first-order bootstrapping). (2) Is any criterion causally/informationally independent? (Pass if yes). (3) If no independent criterion, is there a plausible non-circular justification? (Human judgment). (4) For multi-stage validation, trace criterion origins for upstream dependencies. (5) If prior instrument use shaped the criterion, reject (second-order bootstrapping). (6) Flag proposals without anchors for rejection unless exceptional justification overrides. Steps 3 and 6 are value judgments; misfires occur when dependencies are concealed. The procedure **cannot** establish real-world reliability or decide if minor circularity is tolerable given stakes.

  ---

  ### Ordered Checklist
  1. **Is the validation criterion DIRECTLY the output of the instrument being validated?**  
     *Sufficient answer*: Explicit description of criterion source.  
     *Decision*: **Reject** if yes (first-order bootstrapping). Proceed if no.

  2. **Is there ANY criterion node (e.g., expert judgment, gold-standard test) with NO causal or informational dependency on the instrument’s prior outputs?**  
     *Sufficient answer*: Documentation showing criterion originated separately (e.g., pre-existing clinical protocol, untouched archival data).  
     *Decision*: **Pass** if any criterion meets this "anchor" requirement. Proceed if no anchor is confirmed.

  3. **If no anchor exists, is there a strong methodological justification for circularity (e.g., iterative refinement with external checks)?**  
     *Sufficient answer*: Theoretical argument + evidence of external validation in prior stages.  
     *Decision*: **Human judgment** (values/stakes trade-off). Proceed to step 4 if anchors exist but dependencies are unclear.

  4. **For multi-stage validations, map the criterion’s genealogy: Could prior outputs of THIS instrument (or its prototypes) have influenced the criterion’s design/calibration?**  
     *Sufficient answer*: Timeline showing criterion development occurred before instrument deployment or used isolated data.  
     *Decision*: Proceed to step 5.

  5. **Did prior outputs (e.g., pilot data, preliminary scores) shape the criterion’s definition, thresholds, or training?**  
     *Sufficient answer*: Acknowledgement in methods or replication with/without prior outputs.  
     *Decision*: **Reject** if yes (second-order bootstrapping). **Pass** if no.

  6. **If all criteria are downstream, does the proposal acknowledge this and argue for provisional validity?**  
     *Sufficient answer*: Explicit caveats + plan for future anchor validation.  
     *Decision*: **Human judgment** (weighing feasibility vs. epistemic risk).

  ---

  ### Judgment Points & Misfire Warnings
  - **Step 3** is a judgment call: Assessing "strong justification" depends on disciplinary norms and perceived risk of false positives.  
  - **Step 6** is a judgment call: Requires evaluating societal/pragmatic needs against epistemological standards.  
  - **Misfire warning**: The procedure fails if an "independent" criterion was covertly calibrated on the instrument’s outputs (e.g., clinicians internalize app’s logic). Auditors must spot discrepancies in timelines/method descriptions.

  ---

  ### Worked Examples
  1. **Depression-screening app**  
     - Step 1: Criterion (clinician diagnosis) ≠ direct output → Proceed.  
     - Step 2: Clinicians used app’s risk flags → **No anchor** (criterion downstream).  
     - Step 5: Prior outputs directly shaped criterion → **Reject** (first/second-order hybrid).  

  2. **Literacy-assessment tool**  
     - Step 1: Criterion (teacher ratings) ≠ direct output → Proceed.  
     - Step 2: Teachers trained on tool items → **No anchor** (criterion downstream).  
     - Step 5: Training used prior outputs, but ratings used unseen texts → **Human judgment** (Step 3). *Plausible pass* with warning: Contamination risk exists but ratings are partially independent.  

  3. **Climate-adaptation survey**  
     - Step 1: Expert annotations ≠ direct output → Proceed.  
     - Step 2: Annotations "genuinely independent" → *Tentative pass*.  
     - Step 4: Coding manual used terminology from pilot → **Reject** (Step 5: second-order bootstrapping).  
     *Auditor action*: Flag despite popularity; rejection stands unless panel proves manual was finalized pre-pilot (Step 2).

  ---

  ### Stated Limits  
  This procedure **cannot**:  
  1. Establish the instrument’s real-world reliability or generalizability.  
  2. Resolve whether a small circularity is acceptable for high-impact interventions (e.g., emergency diagnostics).  

