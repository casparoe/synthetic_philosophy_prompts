prompt: |-
  I'm a journalist who writes about science and ideas, and next month I'm running a 90-minute workshop for newsletter subscribers — mostly humanities grads, zero physics — on whether special relativity actually forces the block universe. I'm using the Rietdijk-Putnam line, not pop-science fluff. Don't explain the argument to me; plan the teaching arc.

