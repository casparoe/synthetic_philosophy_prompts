   1. Counterfactual reasoning about pivotal micro-events (e.g., the wrong turn in Sarajevo):
      - In explanatory chaos: We cannot predict because of complexity, but the past is fixed. So counterfactuals are useful for exploring what might have been, but they are not real possibilities because the initial conditions were fixed and led to the actual outcome.
      - In ontological chaos: The past is not fixed at the macro level by prior micro-conditions. Therefore, at critical branch points, the same micro-conditions could have led to different macro-outcomes. Hence, counterfactuals are not just epistemic tools but reflect genuine ontological possibilities.

      Implication: Ontological chaos makes counterfactuals reflect real possibilities (not just epistemic), which transforms the practice by giving counterfactuals a stronger metaphysical status.
      Effect: Transforms (because it changes the meaning of counterfactuals from hypothetical to real possibilities)
      Requires ontological chaos? Yes, because only ontological chaos allows that the same prior micro-conditions could have led to a different outcome without any physical law violation. Without it, the outcome is fixed by the initial conditions and the counterfactual is merely a thought experiment without real possibility.

   2. Moral evaluation of agents whose minor actions cascade into catastrophic consequences:
      - In explanatory chaos: We might blame an agent for a catastrophic outcome because their action was part of the chain, but we also recognize that due to complexity we couldn't have predicted the outcome. This might lead to a mitigation of blame because of the unpredictability.
      - In ontological chaos: The outcome is not determined by the prior micro-conditions. Therefore, the agent's minor action might have led to a catastrophe in one run but not in another, even with the same prior conditions. This introduces a kind of moral luck: the agent is blamed for the catastrophic outcome that occurred, but it could have been otherwise without any difference in their action or the prior state.

      Implication: Moral responsibility becomes heavily dependent on the actual outcome (even when the agent's action and prior state are the same) because the outcome is not determined. This might undermine the standard practice of moral evaluation which typically assumes that the outcome is determined by the agent's action and context.
      Effect: Undermines (because it makes moral evaluation seem arbitrary or luck-based in a way that challenges standard notions of responsibility)
      Requires ontological chaos? Yes, because with explanatory chaos, the outcome is determined by the initial conditions and the agent's action, so the agent is part of a deterministic chain. In ontological chaos, the outcome is not determined, so the same action in the same context might not have led to the catastrophe, making the actual catastrophe a matter of chance.

