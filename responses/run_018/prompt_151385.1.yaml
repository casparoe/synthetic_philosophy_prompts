   The task is to analyze the implications of ontological chaos (not explanatory) for three historiographical practices:

   Practice 1: Counterfactual reasoning about pivotal micro-events.
   Practice 2: Moral evaluation of agents whose minor actions cascade into catastrophic consequences.
   Practice 3: The legitimacy of "for want of a nail" explanatory narratives.

   For each practice, we must provide:
     - key_implication: a string describing the main implication
     - effect_on_method: one of "undermines", "transforms", or "reinforces"
