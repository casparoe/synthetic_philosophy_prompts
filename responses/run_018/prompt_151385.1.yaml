      However, the ontological chaos thesis says that at critical branch points, the prior micro-conditions underdetermine the macro-outcome. So the narrative of the missing nail might be that it was at a critical branch point, and the absence of the nail led to a different outcome. But without the nail, the prior state is different. So the narrative is about a change in the initial condition (the missing nail) leading to a change in outcome. That is compatible with both types of chaos.

