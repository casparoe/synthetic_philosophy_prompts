answer: |-
  Your substrate-dominance criterion for artifact persistence is philosophically coherent but faces significant challenges. Here's a systematic analysis of defeaters, ranked by severity, with formal accounts, conservation parallels, and biological analogies:

  ### **Fatal Defeaters** (Threaten Core Validity)
  1. **The Continuum Problem (Formal Metaphysics)**  
     - **Account:** David Wiggins' *Sortal-Dependence*: Identity depends on the kind of object. For artifacts, persistence requires continuity of *form* under a functional concept, not matter.  
     - **Defeater:** If original matter is gradually replaced (1%/year), your "dominance" threshold (e.g., 51%?) is arbitrary. At 49% original matter, the statue ceases to exist? This violates Leibniz's Law (no discernible difference at 51% vs. 49%).  
     - **Conservation Case:** *Riace Bronzes*: 40% original bronze; structural stability relies on resin-infused internal armatures. Art historically still deemed "ancient Greek originals."  
     - **Biological Parallel:** Telomere shortening in cells: >90% of an adult’s atoms are replaced yearly. Substrate dominance fails to capture biological identity.  

  2. **Non-Materialist Accounts (Formal Ontology)**  
     - **Account:** Lynne Baker's *Constitution View*: Objects persist through replacement if they maintain the same "first-person perspective" (for artifacts: *artist's intention* and *cultural role*).  
     - **Defeater:** Your grandmother’s figure persists if it embodies *her creative act* and *your memorial relationship*, regardless of matter. Synthetic resin preserves intentional form—the essential "artwork" is the realized design.  
     - **Conservation Case:** Ghent Altarpiece: 70% overpainted during restorations. Still attributed to van Eyck due to compositional integrity.  

  ---

  ### **Severely Damaging Defeaters** (Require Major Qualification)
  3. **Functional Equivalence in Structural Hybrids (Conservation Science)**  
     - **Case:** Earthquake-damaged terra cotta statues restored with epoxy-silica nanocomposites. Resin becomes primary load-bearing element (<30% original clay).  
     - **Defeater:** If the resin-clay hybrid *performs the same structural role* as original clay, and the *form is indistinguishable*, denying persistence contradicts conservation ethics and museum practices (e.g., ICOM guidelines).  
     - **Refinement Possible?** Add a *functional dominance* clause: Original material must bear critical stresses. Fails if resin assumes structural primacy.  

  4. **Prosthetic Integration (Biomedical Metaphor)**  
     - **Case:** Titanium hip replacement bonded to femur via osseointegration. Bone and metal fuse into a continuous gradient substrate.  
     - **Defeater:** We say "Grandma walks" post-surgery, not "Grandma coincidentally occupies a prosthesis-walking system." Biological identity survives material hybridization.  
     - **Refinement:** Distinguish artifacts from organisms? Concedes artifacts lack life-principles, weakening universality.  

  ---

  ### **Awkward But Survivable Defeaters** (Manageable with Refinements)
  5. **Eliminativism about Material Dominance (Metaphysics)**  
     - **Account:** Ted Sider's *Four-Dimensionalism*: Objects are spacetime worms. The original statue is a temporal stage; the restored piece is a later stage of the same worm if causal continuity exists.  
     - **Defeater:** Substrate dominance is irrelevant—persistence is spatiotemporal continuity.  
     - **Refinement:** Adopt a *hybrid view*: Dominance matters only for "synchronic identity." Reduces to verbal disagreement.  

  6. **Epistemic Inaccessibility**  
     - **Case:** Nanoscale restorations where original/fake molecules are intermingled beyond detection.  
     - **Defeater:** If dominance can't be measured, the criterion is non-operational.  
     - **Refinement:** Shift to *intentional continuity*: Persistence requires documented conservation intent.  

  ---

  ### **Can the View Be Qualified into Unfalsifiability?**  
  Yes, but at a cost:  
  - **Insulation Tactics:**  
    - Redefine "structurally essential core" ad hoc (e.g., only the base counts).  
    - Argue *dominance is contextual* (e.g., 30% original matter suffices for ceramics but not bronzes).  
  - **Vice or Virtue?**  
    - **Vice:** For concrete objects, unfalsifiability divorces theory from empirical practice (conservation science, biology). It becomes a linguistic preference.  
    - **Virtue:** If artifacts are *partly abstract* (e.g., defined by design-history), insulation defends against reductivism.  

  ### **Conclusion**  
  The fatal flaw is the **continuum problem**: Without a non-arbitrary dominance threshold, the view collapses into vagueness. Conservation practice and biological identity suggest *formal/functional continuity* outweighs material purity. A defensible revision: **An artifact persists if (1) its original form is non-accidentally preserved, and (2) the restoration respects its intentional history.** Your grandmother’s figure likely satisfies this—the conservator extended *her* artwork’s life, not created a replica.  

  *Recommended Reading:*  
  - Baker, L. R. (2007) *The Metaphysics of Everyday Life* (Constitution View)  
  - Korman, D. Z. (2015) *Objects: Nothing Out of the Ordinary* (Material Constitution)  
  - Muñoz-Viñas, S. (2005) *Contemporary Theory of Conservation* (Restoration ethics)
