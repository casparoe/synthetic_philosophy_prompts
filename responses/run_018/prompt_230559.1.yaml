  Okay, the user chairs an editorial-standards board for a public television station and needs to draft a recommendation for whether to air a controversial documentary series called "Before the Builders." This series challenges mainstream archaeology by claiming ancient monuments are much older and built by a lost maritime civilization. 

  First, I need to understand the complexity of the situation. The documentary isn't fringe work—it's presented by someone with a geology doctorate and cites peer-reviewed papers. That makes it tricky because it has surface credibility. The board is split three ways: reject outright, air as-is, or air with context. 

  The user's request is very specific. They need a written recommendation that must:
  - Pick one concrete action with timeline
  - Engage the strongest versions of the opposing views (not strawmen)
  - Address whether to evaluate claims/methods/research program and why that matters
  - End with a general criterion for future cases

  Hmm... the key tension here is between public broadcasting's educational mission and the risk of platforming pseudohistory. The producers' argument about letting viewers weigh evidence is valid, but archaeology isn't like opinion journalism—it's evidence-based. The "ad hominem" accusation is interesting but misses the point; the issue isn't the presenter's credentials but the methodology.

  I think the strongest path is the third option—airing with framing. Why? Because:
  1) Outright rejection ignores that some local evidence has legitimate disputes (e.g., weathering rates at Giza)
  2) Air-as-is ignores how the global conclusion leaps beyond evidence
  3) Framing allows showing how science evaluates extraordinary claims: through methodological rigor, not just "controversy"

  The time frame should be tight—say 30 days—to show we're not burying it. The companion program could feature mainstream archaeologists dissecting specific claims, not just dismissing them. 

  For the evaluation level: focusing on the research program (how evidence is assembled) is crucial because individual claims might be defensible, but the synthesis is where it becomes pseudohistory. That distinction matters—it shows we're not censoring ideas but upholding standards of inference.

  The closing criterion should emphasize "methodological integrity over credentials" because that's what separates heterodox science from pseudoscience. Future submissions should be judged on how they handle evidence, not just who presents it.

  ...Wait, is the user subtly worried about board polarization? The recommendation should model balanced engagement—hence explicitly crediting the rejected positions' strengths. Also, public trust hinges on avoiding both dogma and false equivalence. The framing solution navigates that.
answer: |-
  ## Recommendation to the Editorial-Standards Board: "Before the Builders" Series

  **Date:** [Insert Date Before Friday]  
  **To:** Editorial-Standards Board Members  
  **From:** [Your Name], Chair  
  **Subject:** Recommendation & Framework for "Before the Builders" Vote (Friday, [Date])

  This recommendation addresses the submission of the six-part documentary series "Before the Builders," proposing a concrete path forward while acknowledging the valid concerns expressed across our board.

  ### Recommended Action
  **Air the series with a mandatory framing overlay (introductory segment, mid-point interstitials, and concluding segment) and commission a companion interview/debate program.** This companion program must feature qualified experts representing mainstream archaeology and critical perspectives on the series' methodology, airing within 30 days of the series finale. Production of the overlay and companion program must be completed within 45 days, with broadcast scheduled for the next available programming slot thereafter.

  ### Engagement with Alternative Positions
  1.  **Position: Decline Outright (Platforming Pseudohistory):** This position's strongest argument is the legitimate concern for our station's credibility and public trust. Airing uncritical content promoting conclusions overwhelmingly rejected by the relevant scholarly community *could* mislead viewers, undermine science literacy, and damage our reputation as a rigorous broadcaster. The core concern—avoiding the legitimization of ideas lacking robust evidentiary support—is fundamental to our educational mission.
  2.  **Position: Air Exactly as Submitted (Viewer Autonomy):** This position's strongest argument lies in the core principle of public broadcasting: facilitating informed public discourse by presenting contested ideas for viewer consideration. Dismissing unconventional perspectives without airing them *can* appear paternalistic, stifle debate, and ignore historical instances where scientific consensus has shifted. The producers rightly note that the series includes verifiable local observations and cites some peer-reviewed work, demanding more than simple dismissal.

  ### Evaluating Claims, Methods, or Research Program
  **The board should evaluate the research program as a whole.** Here's why, and what turns on this choice:

  *   **Individual Claims:** Some specific claims within the series (e.g., observations of weathering at Giza, alignments at Göbekli Tepe) may be based on data debated *within* mainstream archaeology. Evaluating only these risks missing the forest for the trees. Accepting individual data points doesn't validate the overarching narrative.
  *   **Methods:** The series employs methods like geological weathering analysis and archaeoastronomy, which *are* legitimate scientific tools. However, evaluating methods in isolation doesn't address whether they are *appropriately applied* or their results *validly interpreted* to support the extraordinary global conclusion.
  *   **Research Program (Recommended Focus):** The central issue is the *synthesis* – how disparate pieces of evidence (some potentially valid locally, others contested) are assembled to construct a grand narrative fundamentally at odds with established knowledge. This involves:
      *   Selective use of data that fits the hypothesis while ignoring counter-evidence.
      *   Extrapolating local anomalies into a global theory without sufficient connecting evidence.
      *   Inferring a specific, sophisticated lost civilization as the *only* explanation, despite lacking direct evidence for its existence, capabilities, or global reach.
      *   Presenting contested interpretations as conclusive findings.
  *   **What Turns on This Choice:** Focusing on the research program allows us to distinguish between legitimate scientific controversy *within* a field and proposals that fall outside established methodological norms and evidentiary standards. It centers the evaluation on the *process of reasoning and synthesis* used to reach the conclusion, which is the crux of the "pseudohistory" concern, rather than banning specific ideas or disputing every individual point.

  ### Closing Criterion for Future Submissions
  **Our primary criterion should be: "Does this submission demonstrate methodological integrity in its synthesis of evidence when presenting conclusions that fundamentally challenge a well-established scientific consensus?"**

  This means future submissions proposing radical reinterpretations must be evaluated not solely on the credentials of presenters, the existence of some peer-reviewed citations, or isolated observations, but on the *rigor and transparency* of how evidence is gathered, analyzed, contextualized, and synthesized to support its overarching thesis. We must assess whether alternative explanations are fairly considered, whether counter-evidence is addressed, and whether the conclusions follow logically and proportionally from the evidence presented. This focuses on the *process* of knowledge construction, upholding our commitment to intellectual honesty and scientific rigor while remaining open to novel ideas that meet these standards.

  **Recommendation Summary:** Air "Before the Builders" with mandatory contextual framing and a companion debate program within 45 days. This approach acknowledges the value of examining contested evidence and viewer autonomy while directly addressing the core weakness identified in the series' research program (its evidentiary synthesis) and safeguarding our commitment to methodological integrity and informed public discourse. This balanced path fulfills our public service mission most effectively.

  I look forward to our discussion and vote on Friday.
