  Okay, the user is part of a formal epistemology reading group stuck on lottery and preface paradoxes. They want a clear set of desiderata for a theory of rational acceptance tailored to institutional certification contexts. Their main goal is to resolve disagreements by specifying what the theory should achieve upfront. They also provide three novel variants to test the desiderata.

  First, I need to understand their core request: desiderata for a theory guiding public certification bodies. The user emphasizes institutional over armchair cases—regulators, journals, courts, standards bodies. These involve public commitment and action based on certified claims. Key distinctions they want respected include acceptance for inference vs public commitment, closure under checked entailment vs full conjunction, first-person vs third-person assessment, and improbability vs poor evidence.

  The user's deeper needs seem to be: cutting through circular debates by grounding the discussion in practical requirements, exposing any fundamental incompatibilities in desiderata, and testing theories against realistic institutional constraints. Their frustration suggests they suspect existing solutions trade off handling one paradox poorly to solve another.

  Now, analyzing their three variants: 
  1. Distributed preface tests collective vs individual acceptance—does paradox arise if no single author endorses the whole book? 
  2. Adversarial preface challenges stakes-sensitivity—should external incentives affect acceptance when evidence hasn't changed? 
  3. Audited lottery probes whether asymmetry (verifiable losses) breaks ticket symmetry, questioning whether all statistical evidence should be treated equally.

  For desiderata, I'll structure around core functions: certification (public commitments), action-guidance, and error-management. Non-negotiables would include avoiding self-contradiction and respecting public reliance. Contested points might include stakes-sensitivity or full closure. 

  Major tensions will likely surface between avoiding self-contradiction (requiring restricted closure) and conjunctive robustness (needing some closure for multi-premise action). Also, stakes-sensitivity clashes with invariantism when incentives shift without evidence changes.

  I'll flag that the single most theory-knocking requirement is likely conjunctive robustness—it forces hard choices about closure that eliminate many otherwise viable approaches. The audited lottery variant will particularly stress evidence type distinctions.

  In the strategic assessment, I'll note that threshold contextualism struggles with public commitments, while closure restriction handles lottery/preface but may fail distributed preface. Denying high probability justification works for paradoxes but faces challenges in institutional contexts where probability thresholds are entrenched.
answer: |-
  Below are the desiderata for a theory of rational acceptance in **institutional certification contexts**, structured by purpose, motivated by cases, and annotated for epistemic standing. I preserve your requested distinctions, test against your three variants, and flag incompatibilities. Requirements are categorized as **non-negotiable** (N) for institutional functionality or **contested** (C). I discard requirements lacking principled motivation (e.g., "must preserve classical logic" is rejected as prejudice).

  ---

  ### **I. Core Desiderata for Public Certification**
  *(Motivated by regulators, courts, standards bodies)*

  1. **Non-Self-Contradiction (N)**  
     *The certifier must not simultaneously commit to P and not-P, or to claims that jointly entail a contradiction.*  
     **Motivation**: Public trust requires coherence; a regulator certifying "this bridge is safe" and "this bridge may collapse" undermines authority.  
     **Epistemic Standing**: Uncontroversial (consensus in formal epistemology).  
     **Distinctions**: Applies to *public commitment*, not private belief.  
     **Your Cases**: Forces the preface paradox to be resolved (author cannot believe *all* claims *and* "≥1 is false").  

  2. **Action-Guiding Robustness (N)**  
     *Certified claims must license defeasible action in complex decisions (e.g., building a reactor, convicting a defendant).*  
     **Motivation**: Certification is pointless if it doesn’t support multi-premise reasoning (e.g., "Each subsystem is safe → We can operate the whole system").  
     **Epistemic Standing**: Contested. Some (e.g., Foley) argue for full closure; others (e.g., Kyburg) reject it.  
     **Distinctions**: Requires closure under *checked entailment* (not arbitrary conjunction).  

  3. **Error Accountability (N)**  
     *The theory must explain how to manage aggregate error rates (e.g., false convictions, engineering failures).*  
     **Motivation**: Courts tolerate some wrongful convictions but must cap their probability; regulators accept residual risk but bound it.  
     **Epistemic Standing**: Uncontroversial for institutions; contested for individual belief.  
     **Distinctions**: Separates *improbability* (low probability of error) from *bad evidence* (e.g., statistical vs. direct).  

  4. **Stakes-Insensitive Thresholds (C)**  
     *The threshold for acceptance should not vary with practical stakes.*  
     **Motivation**: In the **adversarial preface**, the author’s evidence is unchanged; only incentives shift. If stakes raise the threshold, she must retract previously certified claims despite unchanged evidence—undermining public reliability.  
     **Epistemic Standing**: Highly contested. Pragmatic encroachment (e.g., Fantl & McGrath) argues stakes matter; invariantists (e.g., Brown) reject this.  
     **Your Cases**: Rejecting stakes-sensitivity avoids instability in adversarial preface.  

  ---

  ### **II. Evidence & Justification Constraints**  
  *(Motivated by statistical evidence, assurance cases)*  

  5. **Evidence-Type Sensitivity (N)**  
     *The theory must distinguish claims based on evidence type (e.g., statistical, direct, verified).*  
     **Motivation**: Courts exclude purely statistical evidence for convictions (e.g., DNA matches ≠ eyewitness testimony); **audited lottery tickets** with verification differ from unaudited ones.  
     **Epistemic Standing**: Uncontroversial in legal/epistemic contexts; contested by strict probabilists.  
     **Distinctions**: Explains why **audited lottery** converts probabilistic claims to "checked" ones.  

  6. **Probability ≠ Justification (C)**  
     *High probability is insufficient for acceptance; justification requires evidence quality.*  
     **Motivation**: In lotteries, each ticket’s loss is probable but unjustified to accept (lest we accept all losses). Statistical evidence (e.g., 99% accurate drug test) may be inadequate for certification without direct verification.  
     **Epistemic Standing**: Contested. Probabilists (e.g., Hawthorne) defend "probabilistic acceptance"; others (e.g., Williamson) require knowledge.  
     **Your Cases**: Resolves lottery paradox by denying high probability suffices.  

  ---

  ### **III. Aggregation & Scalability**  
  *(Motivated by multi-author handbooks, replication studies)*  

  7. **Aggregate Acceptance ≠ Individual Acceptance (N)**  
     *A collective can certify a conjunction without each member certifying all conjuncts.*  
     **Motivation**: In the **distributed preface**, contributors endorse their chapters; the editor certifies the whole volume. No paradox arises if individuals need not accept the entire book.  
     **Epistemic Standing**: Uncontroversial for collectives; contested for individuals (e.g., "belief aggregation" literature).  
     **Distinctions**: Separates *first-personal commitment* from *third-personal endorsement of a collective output*.  

  8. **Conjunctive Robustness (C)**  
     *If a body accepts P₁...Pₙ individually, it should accept their conjunction when error rates are managed.*  
     **Motivation**: Regulators must act on conjunctions of sub-claims (e.g., "All reactor components are safe").  
     **Epistemic Standing**: Contested. Rejected by non-closure views (e.g., Kyburg); defended by contextualists (e.g., Lewis).  
     **Distinctions**: Applies only when entailment is *checked* (e.g., no hidden inconsistencies).  

  ---

  ### **IV. Flagged Incompatibilities**  
  - **Non-Self-Contradiction + Conjunctive Robustness → Conflict**:  
    Conjunctive robustness forces acceptance of (P₁ ∧ ... ∧ Pₙ) in preface cases, but the body also accepts "≥1 Pᵢ is false" due to error rates, violating non-contradiction.  
    **Resolution**: Sacrifice conjunctive robustness (restrict closure) *or* reject "≥1 Pᵢ is false" as unacceptably vague.  
  - **Probability ≠ Justification + Action-Guiding Robustness → Tension**:  
    If high probability isn’t sufficient, what licenses action? Requires alternative justification (e.g., evidence quality).  

  **Most Theory-Knocking Requirement**: **Conjunctive Robustness**. It eliminates:  
  - Non-closure theories (e.g., Kyburg) – they reject it.  
  - Low-threshold theories – they violate non-contradiction.  
  - High-threshold theories – they reject all individual claims in lotteries.  

  ---

  ### **Testing Your Variants**  
  1. **Distributed Preface**:  
     - *Individuals*: No paradox; each accepts only their chapter.  
     - *Editor*: Must accept the whole book. Non-self-contradiction requires rejecting "≥1 claim is false" as uncertifiable (it’s meta-uncertainty).  
     - **Verdict**: Aggregate acceptance ≠ individual acceptance; paradox avoided if editor doesn’t certify error-claim.  

  2. **Adversarial Preface**:  
     - Stakes-sensitivity would force author to retract claims, violating public reliability. **Desideratum 4 (stakes-insensitivity)** blocks this: evidence unchanged, so certification stands.  

  3. **Audited Lottery**:  
     - Audited tickets: Acceptance justified (direct evidence).  
     - Unaudited tickets: Acceptance unjustified (mere probability).  
     - **Verdict**: Evidence-type sensitivity (**Desideratum 5**) explains asymmetry; theories treating tickets symmetrically fail.  

  ---

  ### **Strategic Options Scorecard**  
  | **Approach**              | **Solves Lottery** | **Solves Preface** | **Fails Desideratum**                     |  
  |---------------------------|-------------------|-------------------|------------------------------------------|  
  | **Threshold Contextualism** | ✓ (varies by context) | ✓                 | ❌ Action-guiding robustness (thresholds shift under conjunction) |  
  | **Restrict Closure**      | ✓                 | ✓                 | ❌ Conjunctive robustness (blocks needed conjunctions) |  
  | **Deny Probability → Justification** | ✓                 | ✓                 | ❌ Hard to implement institutionally (needs alternative justification metric) |  
  | **Stakes-Sensitive Thresholds** | △ (adjusts threshold) | △                 | ❌ Stakes-insensitivity + Public reliability (fails adversarial preface) |  

  **Best Tradeoff**: **Restrict closure** + **evidence-type sensitivity**. Allows certified conjunctions when evidence is direct (audited lottery) but blocks statistical conjunctions (lottery/preface). Sacrifices conjunctive robustness but preserves institutional action.  

  **Key Insight**: Your cases reveal that *aggregate certification under managed error* is distinct from *belief in every conjunct*. The real conflict is between **public commitment coherence** and **statistical conjunctions**—institutions should reject the latter as uncertifiable.
