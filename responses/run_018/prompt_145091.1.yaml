  **COURSE CATALOG: SPRING 2025**  
  **PHIL 404: MODAL REALISM PRACTICUM**  
  *(Cross-listed: PHYS 799, ACCT 420)*  

  **Course Description:**  
  This practicum provides hands-on application of David K. Lewis’s mature ontological framework. Students will operationalize the thesis that logically possible worlds are concrete entities, causally isolated but equally real. Emphasis is placed on the administrative implications of counterpart theory for academic record-keeping.  

  **Learning Outcomes:**  
  Upon completion, students will be able to:  
  1.  Identify their unique counterparts across the pluriverse.  
  2.  Compute transworld identity relations using Registrar-approved similarity metrics (Form CTR-7b).  
  3.  Navigate the implications of distributed academic performance.  

  **Academic Evaluation:**  
  **Warning:** Per Provost’s Directive 1986§71, your academic transcript is a concrete particular existing *in every possible world* where a counterpart of you is enrolled. Consequently:  

  *   **Modal GPA (mGPA):** Final grades reflect a weighted average across all worlds where a counterpart completed PHIL 404. Weighting is determined by the objective similarity of each world to the “indexical anchor world” (designated by the Registrar’s Office). Submit Form MW-22 to request a similarity assessment (processing fee: $85/world-sampled).  
  *   **Exam Performance:** Your performance in *this* world is one data point. The Office of Modal Assessment (OMA) will aggregate exam results from all relevant counterparts. A failing grade here may be offset by a counterpart’s success in a world where the exam focused on ontological parsimony instead of transworld identity proofs (see Appendix F: Grading Multiverse).  
  *   **Completeness Requirement:** You are considered to have completed the course if *any* counterpart passes *any* instance of PHIL 404 in *any* world. OMA Form D-9 (“Declaration of Counterpart Success”) must be filed to activate this credit.  

  **Tuition & Fees:**  
  Tuition is assessed *per concrete world* in which a counterpart is enrolled. The base rate ($5,750) applies to the indexical anchor world. Additional charges are incurred for each distinct world hosting an enrolled counterpart ($5,750/world/enrollment instance).  

  *   **Billing:** Statements reflect ontological commitment. Itemized charges list each world (e.g., "W_α-7J: Tuition", "W_β-42Q: Lab Fee"). Late fees apply per-world per-day (compounded modally).  
  *   **Financial Aid:** Aid packages are evaluated across the pluriverse. Eligibility in one world does not guarantee aid in others. Students are liable for debts incurred by financially irresponsible counterparts (see "Joint and Several Modal Liability," Bursar’s Policy 8.3).  

  **Administrative Notes:**  

  1.  **"Failing" Students:** A student receiving an ‘F’ in *this* world has still technically satisfied the completeness requirement *somewhere*. Diplomas will note: "Degree Conferred via Pluriversal Compossibility."  
  2.  **Grade Disputes:** Challenges to mGPA must specify the *exact world* where a counterpart’s superior performance should be weighted more heavily. Incomplete Form MW-22 submissions are grounds for dismissal of appeal.  
  3.  **Withdrawals:** Withdrawing from PHIL 404 in *this* world does not affect enrollment status in other worlds. Tuition remains due for all enrolled counterparts. Submit Form WD-CF/∞ (“Categorical Withdrawal Across the Pluriverse”) to attempt universal withdrawal (requires notarized proof of counterpart unanimity; success rate: 0.0004%).  

  **Prerequisites:** PHIL 203 (Logic) OR PHYS 301 (Quantum Mechanics) OR Bursar’s pre-approval of modal overdraft capacity. Consent of Instructor *and* the OMA Director required.  

  **Textbook:** Lewis, D. *On the Plurality of Worlds* (1986). Supplementary materials: *OMA Billing Codes & Interworld Accounting Standards*, 9th ed.  

  **Final Note:** The Registrar’s Office acknowledges that billing statements may appear extensive. This reflects the concrete richness of reality, not inefficiency. Requests for "ontological parsimony discounts" (Form OP-1) are summarily denied.  

  ---  

  **Satire Fairness Assessment & Failure Points:**  

  *   **Argument/Evidence Changing My Mind:** My view shifts if Lewis *explicitly exempted institutions or abstracta* from counterpart relations. Lewis *did* argue that ordinary individuals like "you" have counterparts, but he might deny that socially constructed entities (like "Princeton University" or "your transcript") have meaningful counterparts across worlds in the same way. If Lewis stated that institutional facts *only* exist in one world or are not subject to counterpart relations, the billing/transcript satire becomes less fair.  
  *   **Likely Failure Points:**  
      1.  **Conflation of Worlds & Branches:** The satire subtly blends modal realism with many-worlds QM ("branches"), which Lewis explicitly rejected. Worlds are causally isolated and *all* possibilities, not just quantum outcomes.  
      2.  **Counterparts vs. Identity:** Lewis was adamant: counterparts are *not* you. The satire leans into treating counterparts *as* the student for billing/grading (e.g., "your transcript exists in every world"), subtly violating Lewis's core distinction. A truly Lewisian registrar would bill *the counterpart in W_x* and grade *the counterpart in W_x*, with no "you" spanning worlds to receive a consolidated bill or mGPA. The "Modal GPA" concept itself is arguably un-Lewisian.  
      3.  **Problem of Temporary Intrinsics:** The satire uses exam performance (a temporary intrinsic property) without explicitly grappling with Lewis's original motivation for counterparts – explaining how *I* can be bent in W1 and straight in W2. The grading satire assumes performance is a property handled by counterparts, which *is* Lewisian, but the focus on transcripts/billing sidesteps the deeper metaphysical puzzle Lewis was solving.  
      4.  **Parody vs. Core Theory:** The satire attacks the *administrative consequences* of an ontology Lewis proposed for solving metaphysical problems, not necessarily the solutions themselves. Lewis might shrug at the absurd bureaucracy as irrelevant to the truth of the metaphysics. The fairness hinges on whether the *reductio* via bureaucracy genuinely exposes a flaw Lewis didn't address, or just mocks a consequence he readily accepted as part of the cost of doing ontological business. His response to the "incredulous stare" suggests the latter.
