  Build it so that:
  1. Pure rational-choice analysis (ignore sunk costs, look only at future expected costs and benefits) predicts withdrawal at a specifc point — call it Quarter 3, when the match exceeds projected return.
  2. Prospect-theory / reference-dependence predicts they escalate past Quarter 3, specifically because quitting realizes a loss (the forfeited clawback) while staying preserves the reference point.
  3. The escalation must genuinely come from the reference-point shift, not from an obviously stupid heuristic like "we can't waste what's spent."

  After the scenario, walk through each theory's reasoning, name the structural feature that does the work, say what happens if you remove that feature (does it collapse back to rational-choice agreement?), and explain how a rational-choice defender attacks the case — e.g., hidden reputation costs or signaling value.

