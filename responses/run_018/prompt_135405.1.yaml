answer: |-
  ## Law-Firm Litigation Software Trap

  **Scenario:** The partners at "Carter & Vance LLP" invested in developing proprietary AI-powered litigation prediction software ("CasePoint"). Initial funding came from a special capital call with a reverse-vesting clawback. Each quarter CasePoint remains active, $100k of the $1M total committed capital shifts status: it becomes "Protected Capital" only recoverable *if the project continues*. If they vote to terminate, *all* Protected Capital is instantly forfeited and publicly logged in the firm's quarterly financials as "Lost Protected Capital (CasePoint)". The project is failing – predictions are unreliable, adoption is low. Continuing requires only a small additional $50k quarterly match. By Quarter 3, sober analysis shows the next $50k match exceeds any realistic future benefit ($40k max projected). But quitting now would realize the immediate, visible loss of $300k in Protected Capital (Q1-Q3 vested), logged for all partners and lenders to see. Staying preserves the *chance* of future recovery and avoids that public loss label, even if the objective outlook is grim.

  **Analysis:**

  1.  **Rational Choice Verdict (Withdraw in Q3):**
      *   **Reasoning:** Ignores the $300k sunk cost (Protected Capital). Focuses *only* on future costs and benefits. The next required investment ($50k) demonstrably exceeds the maximum expected future benefit ($40k). Continuing is irrational; withdraw immediately to minimize future losses.
      *   **Structural Feature:** The ability to cleanly separate sunk costs from future marginal costs/benefits. The "Protected Capital" is irrelevant to future decisions.
      *   **Collapse Condition:** If the "Protected Capital" clawback *didn't exist* (i.e., all spent money was simply sunk with no clawback mechanism or public logging), the future $50k cost > $40k benefit analysis dominates. Both theories likely agree on Q3 withdrawal.
      *   **Rational-Choice Rebuttal:** A rational defender argues quitting triggers *hidden reputation/financing costs*. Publicly logging "$300k Lost Protected Capital" signals poor judgment to partners (eroding trust, potentially triggering withdrawals) and lenders (increasing borrowing costs/future capital call resistance). The cost of this reputational damage *exceeds* the nominal $10k ($50k - $40k) future loss from continuing one more quarter. Persisting, even with low odds, avoids this reputational cost, making it rational.

  2.  **Prospect Theory Verdict (Escalate Past Q3):**
      *   **Reasoning:** The decision is framed relative to the reference point of the *current* $300k Protected Capital. Quitting *realizes* a certain, salient loss of $300k (loss aversion). Staying, while requiring a new $50k outlay, *preserves* the $300k (keeping it as a potential asset, deferring loss realization) and offers a small chance (however slim) of gain. The pain of realizing the $300k loss outweighs the risk of the smaller $50k future loss, especially given the public logging amplifying the salience.
      *   **Structural Feature:** The **reverse-vesting clawback combined with public logging** creates the critical reference point shift. It transforms past spending into a *current, avoidable* loss upon exit. Staying doesn't *gain* the $300k back; it simply avoids *crystallizing* the loss *now*.
      *   **Collapse Condition:** Removing the clawback/public logging (making the $300k a pure sunk cost with no contingent loss upon exit) removes the powerful reference point shift. The decision likely collapses back to the rational Q3 withdrawal, as only future costs/benefits matter.
      *   **Key Distinction:** The escalation is *not* driven by "we can't waste the spent money." Partners intellectually know the $300k is spent. It's driven by the **aversion to realizing the *labeled, contingent loss*** triggered specifically by quitting. Staying keeps the loss "off the books" psychologically and officially (the capital remains "Protected").

