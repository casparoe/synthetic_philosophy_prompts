answer: |-
  Here’s a take-home exam question and model answer designed to force nuanced analysis of inefficacy objections across domains, with a strict marking scheme focused on conceptual precision.

  ---

  ### PHIL 450: Ethics and Collective Action  
  **Take-Home Exam Question (30 Marks)**  
  **Word Limit: 900 words**  

  **Background**: The "inefficacy objection" claims individual actions (e.g., driving less, abstaining from meat, voting) cannot meaningfully impact large-scale problems like climate change or election outcomes, rendering them morally redundant. This objection often assumes harms are *linear and diffuse* (e.g., each gram of CO₂ contributes minutely to global warming).  

  **Scenario**: Contrast this with **Bridgeville**—a town with exactly 10,000 drivers. If *exactly* 5,000 drivers each drive one extra mile on Tuesday, a specific bridge collapses due to load distribution. Each mile driven contributes *identically* to the threshold, yet carbon emissions per mile remain linear/diffuse.  

  **Task**:  
  Analyze whether the moral argument **against** engaging in the following actions strengthens, weakens, or qualitatively changes when shifting from a *linear diffuse harm* model (real-world climate) to a *threshold harm* model (Bridgeville):  
  1. **Driving** an extra mile (Bridgeville vs. real-world emissions)  
  2. **Eating one industrial beef meal** (assuming linear vs. batch-processing supply chains)  
  3. **Voting** in a large election (linear influence vs. probabilistic tipping points).  

  In your response:  
  - Identify whether inefficacy in each case hinges on **causal redundancy** (your action is neither necessary nor sufficient for harm), **expected impact** (statistical significance of your act), or **normative redundancy** (your act’s imperceptible effect voids obligations).  
  - Explain why Bridgeville *undermines* the standard inefficacy objection for driving but *might not resolve it* for meat or voting.  
  - Address how supply-chain batching (meat) or probabilistic thresholds (voting) alter the reasoning.  

  ---

  ### Model Answer Framework  
  *(Key moves required for full marks)*  

  #### **1. Conceptual Distinctions (6 Marks)**  
  - **Causal redundancy**: Action is neither necessary nor sufficient for harm (e.g., your CO₂ alone won’t cause a hurricane).  
  - **Expected impact**: Probability-weighted outcome (e.g., 1/n chance of being pivotal in an election).  
  - **Normative redundancy**: Moral duty dissolves if your act’s effect is imperceptible (even if nonzero).  
  ➜ *Top response must separate these and show inefficacy objections often conflate them.*  

  #### **2. Driving Case (8 Marks)**  
  - **Linear model (real emissions)**: Strong inefficacy objection. Causal redundancy + normative redundancy dominate (your mile’s CO₂ is diluted among billions of tons).  
  - **Bridgeville threshold**: Objection collapses. Your action is *causally efficacious* in the precise scenario where 4,999 others act. Moral responsibility sharpens (risking bridge collapse).  
  - **Key move**: Bridgeville reveals the objection relies on *contingent empirical facts* about harm structures, not logic.  

  #### **3. Meat Consumption (8 Marks)**  
  - **Linear model**: Similar to driving—your burger’s emissions are negligible globally. Normative redundancy likely holds.  
  - **Batch-processing threshold**: Slaughterhouses order cows in batches (e.g., 100). If demand drops by <100, no reduction occurs. Your abstention *alone* is causally redundant, but expected impact rises near thresholds (e.g., if 99 others abstain, you’re pivotal).  
  - **Key move**: Unlike Bridgeville, thresholds are *opaque and stochastic*. Inefficacy weakens but persists absent coordination.  

  #### **4. Voting (8 Marks)**  
  - **Linear model**: Your vote is causally redundant in large elections (1 in millions chance of mattering).  
  - **Probabilistic threshold**: Expected impact is *calculable* (e.g., 1/√n in tight races). While rarely pivotal, high-stakes outcomes amplify expected utility (e.g., swinging an election worth billions in policy).  
  - **Key move**: Inefficacy here is about *vanishing expectation*, not strict causal redundancy. Moral weight depends on stakes × probability.  

  ---

  ### Marking Scheme (30 Total)  
  | **Section**               | **Marks** | **Deductions** |  
  |---------------------------|-----------|----------------|  
  | Clear causal/expected/normative distinction | 6 | −2 per conflation; −3 if missing one |  
  | Driving: Bridgeville vs. linear contrast | 8 | −4 if threshold causation not emphasized; −3 if linear harm mischaracterized |  
  | Meat: Batch thresholds vs. linearity | 8 | −4 if supply-chain batching ignored; −3 if expected impact near thresholds unaddressed |  
  | Voting: Probabilistic expectation | 8 | −4 if treats voting as purely causally redundant; −3 if stakes×probability uncalculated |  
  | **Penalties** | |  
  | −3 | Treating all three cases as identical |  
  | −2 | Confusing inefficacy with general underdetermination |  
  | −1 per instance | Over 900 words / vague assertions |  

  ---

  ### Where the Model Answer is Weakest  
  The meat analysis assumes industrial batch-processing creates sharp thresholds. **If empirical evidence showed** supply chains dynamically absorb small demand changes (e.g., supermarkets adjust orders incrementally), the "near-threshold" expected impact argument weakens—reverting toward linear-model inefficacy. Similarly, **if voting models showed** pivotal probabilities are *systematically overestimated* (e.g., due to correlated votes), the expectation-based duty could collapse. The Bridgeville analogy is airtight for driving but risks overextending to domains with fluid thresholds.  

  ---  
  This exam forces engagement with *how* harm structures transform moral reasoning—not just whether individual acts "matter." The model answer’s vulnerability lies in real-world empirical complexities beneath theoretical thresholds.
