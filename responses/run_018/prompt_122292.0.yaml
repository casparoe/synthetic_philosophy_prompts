prompt: |-
  I was arguing with my roommate—she's in urban planning and keeps saying Singapore is basically just a well-run corporation—about whether performance legitimacy can actually do normative work, not just describe why people put up with authoritarian rule.

  I'm defending the stronger claim that sustained prosperity plus low corruption creates something like a fiduciary entitlement to govern without elections, especially when the regime practices what I'd call 'recursive accountability': the state audits itself rigorusly but citizens never vote. I think Singapore's PAP and post-1978 China are the clearest cases—massive GDP growth, poverty reduction, stable institutions—so I hold that in these instances authoritarian structures aren't merely tolerated but positivly justified by output legitimacy.

  But I want to know what would actually count against this view, not just 'democracy is better' slogans. What serious evidence, conceptual problems, or anomolies should move me? Please respond as exactly five numbered points, each just a sentence or two, with no intro and no conclusion whatsoever.
reasoning: |-
  Hmm, the user is having a debate with their roommate about performance legitimacy in authoritarian states like Singapore and China. They're arguing that sustained prosperity and low corruption can create a "fiduciary entitlement" to govern without elections, especially with "recursive accountability" where the state audits itself. They want counterarguments that go beyond simple pro-democracy slogans.

  The user is clearly knowledgeable about political theory, referencing Singapore's PAP and China's post-1978 economic reforms. They want substantive counterpoints in a very specific format: five numbered points with no introduction or conclusion. 

  I need to identify the strongest conceptual and empirical flaws in their position. First, there's the fundamental agency problem - without elections, citizens have no mechanism to remove leaders even if performance declines. Second, the selection mechanism issue: how are competent leaders chosen without democratic processes? 

  Third is the measurement problem - who defines "good performance" when citizens can't express preferences? Fourth, the historical contingency argument: past success doesn't guarantee future governance quality. Fifth, the lack of error correction - authoritarian systems lack institutionalized mechanisms for course correction when mistakes occur.

  The user would likely dismiss moral arguments about democracy's intrinsic value, so I'll focus on functional and systemic weaknesses. Singapore and China's cases actually help illustrate these flaws - their systems work well under specific conditions but contain inherent vulnerabilities.

  I'll present these as five crisp, evidence-based counterpoints exactly as requested. Each point will target a different weakness in their fiduciary entitlement theory while respecting their sophisticated framing of the issue.
answer: |-
  1.  The absence of institutionalized mechanisms for peaceful leadership transition independent of the ruling group creates significant instability risk when the founding generation passes or internal factionalism erupts, as seen in succession crises common to authoritarian regimes despite past performance (e.g., opaque transitions in China).
  2.  "Recursive accountability" lacks external validation; internal audits prioritize regime priorities and stability over citizen-defined welfare, potentially masking systemic failures or misallocations invisible without independent oversight or free press, as evidenced by environmental degradation or social tensions persisting despite official metrics.
  3.  Performance legitimacy cannot resolve the fundamental principal-agent problem: citizens (principals) possess no reliable, low-cost mechanism to remove agents (leaders) who fail *their* specific needs, even if aggregate metrics like GDP appear strong, leading to unaddressed grievances and legitimacy decay.
  4.  Sustained prosperity often depends on specific, non-replicable historical conditions (e.g., Singapore's strategic Cold War position, China's demographic dividend) rather than solely the regime's inherent structure, undermining claims that the *authoritarian system itself* is the necessary cause justifying its permanence.
  5.  The lack of competitive political choice prevents discovery and implementation of potentially superior policy alternatives or prevents adaptation to changing citizen preferences, entrenching inefficiency or stagnation over time despite initial successes (e.g., innovation bottlenecks in highly controlled economies).
