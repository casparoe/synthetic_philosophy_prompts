prompt: |-
  You are an expert in Augustine's philosophy of language and moral theology, with particular familiarity with De Mendacio and the less commonly taught reply in which he confronts the argument that false speech may be justified to protect an innocent person from persecution. Before composing anything, please take a moment to recall the architecture of the villanelle: nineteen lines arranged in five tercets and a concluding quatrain, governed by two refrains that alternate in the A1 and A2 positions and finally appear together in the closing couplet. I am preparing a closing exercise for my graduate seminar on Augustine's ethics of speech, and I want you to write a villanelle voiced from Augustine addressing an interlocutor who insists that lying to hide a fugitive is permissible because the life saved outweighs the falsehood spoken.

  Please construct the poem so that its formal repetitions perform philosophical labor rather than mere ornament. Invent two refrains—each concise, no more than about ten syllables—that capture Augustine's two governing commitments: first, that mendacium corrupts the speaker's soul regardless of the harm avoided; second, that speech is a trust given for truthful witness rather than an instrument to be deployed for outcomes. As the refrains cycle through the tercets, let each recurrence feel like a refusal to move up or down any hierarchy of lies; the repetition should embody Augustine's claim that grading falsehoods by consequence misses the essential wrong, which is the fracture of the speaker's interior relation to God and to language itself. The volta should occur in the final quatrain, where the two refrains converge side by side: not resolving into a compromise, but showing why saving a bodily life and preserving truthful speech are not exchangeable goods on a single scale.

  Make the verse accurate enough that someone who has read both treatises recognizes the specific moves—Augustine's distinction between actively asserting a falsehood and merely concealing the truth; his argument that the speaker, not only the listener, is damaged; and his insistence that even the least harmful lie violates the commandment against false witness because it severs the soul's alignment with divine truth. Do not include a bibliography, citations, or reading list; the poem should stand alone. Avoid sermonizing about modern politics, and write in a serious, meditative tone appropriate for closing a philosophy seminar. The language should be original verse, not a pastiche of Augustine's Latin prose, and the refrains should be your own invented lines rather than direct quotations from the texts. Begin by briefly outlining how the rhyme scheme will mirror Augustine's refusal to trade grades of harm, then produce the poem.
