  *   **Accuracy:** **4/7** (Solid on basic metaphor & institutional extension, but missed key nuances like adaptability, fortune's interactivity, and made false claims about elimination & 50%).
  *   **Core Question:** **4/5** (Correctly identifies the hydraulic logic *for* collapse and scaling, but earns a major deduction (-1) for failing to recognize and articulate Machiavelli's *countervailing* distinction between adaptive individual action and foundational institutional stability outlined in the *Discourses*. The answer *asserts* the collapse without proving it against Machiavelli's text).
