answer: |-
  ### Joint Statement on Heritage Ethics: Adversarial Collaboration on Restitution  
  *Signed by Representatives of the State-Succession Restitutionist and Living-Community Preservationist Camps*  

  #### **I. Agreed Claims**  
  1. **Historical Circumstances**: The Benin Bronzes were forcibly removed during the 1897 British punitive expedition, which razed Benin City. The Parthenon Sculptures were detached under Ottoman occupation (1801–1812) by agents of Lord Elgin. Neither removal adhered to modern ethical or legal standards.  
  2. **Current Conservation Capacity**: Major holding institutions (e.g., British Museum, Ethnologisches Museum Berlin) possess advanced conservation infrastructure, climate control, and security exceeding UNESCO standards. Comparable facilities exist at the Acropolis Museum (Greece) and Edo Museum of West African Art (Nigeria, nearing completion).  
  3. **Justice Framework**: *Corrective justice* addresses the historic wrong of coercive acquisition. *Distributive justice* concerns optimal present/future stewardship, including access, research, and preservation. These are distinct but may overlap.  
  4. **Physical Risks**: Deaccessioning requires disassembly/reassembly, exposing artifacts to structural stress. Long-distance transport (e.g., seismic activity, humidity shifts) introduces non-negligible risks, even with optimal protocols.  

  #### **II. Disagreements Table**  
  | **Camp** | **Residual Position** |  
  |----------|------------------------|  
  | **State-Succession Restitutionists** | “Restitution must correct historical injustice by returning artifacts to the *recognized sovereign state* that is the political successor to the original context of creation or ownership. This applies even if the successor state’s cultural continuity with the artifact is symbolic (e.g., Greece for the Parthenon Marbles) or if the artifact’s *modern* cultural significance is primarily global. State succession is the sole mechanism for legitimizing custodial transfer.” |  
  | **Living-Community Preservationists** | “Custodianship should prioritize *living communities* with unbroken ritual, artistic, or spiritual ties to artifacts, irrespective of state borders. Where such communities exist (e.g., Benin Kingdom descendants in Nigeria), their claim supersedes states’. Where ties are dormant or symbolic (e.g., the Parthenon Marbles’ link to modern Greece), global museums may better serve distributive justice through shared stewardship.” |  
  | **Clarification**: Disputes are *substantive*, not verbal. Both camps define “restitution” as physical transfer but disagree on moral/legal triggers.  

  #### **III. Cruxes and Empirical Tests**  
  1. **Crux: Is legitimate state succession a *necessary condition* for restitution?**  
     - **Boundary Case**: 19th-century artifacts from the Sultanate of Fashoda (defunct 1898), whose descendants are dispersed in South Sudan, Chad, and Ethiopia, each claiming sole custodianship.  
     - **State-Succession Prediction**: Absent a clear successor state (no Fashoda-descendant state exists), restitution is incoherent; artifacts should remain in Western museums.  
     - **Living-Community Prediction**: If Fashoda descendants maintain communal practices (e.g., oral histories or craft traditions), a joint transnational trust—not any one state—should hold custody.  

  2. **Crux: Does a living community’s practice create an *independent claim* beyond state borders?**  
     - **Empirical Comparison**: Conservation records of repatriated Benin Bronzes (e.g., 2022 returns to Nigeria) *vs.* similar bronzes retained in Europe, assessed over five years for deterioration rates, public access, and scholarly use.  
     - **Living-Community Prediction**: Repatriated bronzes will show equal or better conservation outcomes and higher local engagement, validating community-based stewardship.  
     - **State-Succession Prediction**: Retained bronzes will demonstrate superior conservation due to entrenched infrastructure, undermining distributive-justice arguments for transfer.  

  3. **Crux: Can transit risk be a *decisive moral reason* for retention?**  
     - **Empirical Test**: Institutional-stability metrics (e.g., funding volatility, staff turnover, disaster preparedness) at potential recipient institutions (e.g., Athens’ Acropolis Museum, Benin City’s EMOWAA) *vs.* holding museums (e.g., British Museum).  
     - **State-Succession Prediction**: Recipient institutions will show lower stability, elevating transit risks to morally decisive levels.  
     - **Living-Community Prediction**: Stability gaps are bridgeable via international aid; transit risks are technical, not moral, barriers and cannot override corrective justice.  

  ---  
  **Next Steps**: Both camps commit to jointly evaluate outcomes of the Benin returns, monitor the Fashoda case, and reassess positions when stability metrics for recipient institutions are independently audited (2026).
