  Next tier: institutional ruptures like the 1945 German surrender. If singular decisions can rewrite social structures overnight, doesn't that negate causal redundancy? Here the defender could pivot to deeper prerequisites—e.g., without Allied industrial superiority (medium-term conjoncture), the surrender wouldn't stick. But the speed of change makes "redundancy" feel strained.

