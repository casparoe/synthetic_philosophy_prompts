answer: |-
  1. **Trivial Arithmetic Aggregation**: Multiplying a tiny per-insect probability of sentience by the vast number of insects yields a large expected count of sentient beings, making their aggregate moral weight dominant. This is **defensible** mathematically but **insufficient** for establishing primary moral priority, as it conflates expected quantity with moral significance per unit.  
  2. **Expected Value Principle**: If sentience confers moral value, the expected total value (probability × value per insect × population) could be immense due to scale, outweighing less numerous groups. This is **defensible** under utilitarian frameworks but **false** if the probability is epistemically void (e.g., indistinguishable from zero) or if value isn't linear.  
  3. **Population-Weighted Precaution**: Uncertainty justifies treating each insect "as if" sentient proportionate to population size under a maximin or precautionary rule, prioritizing worst-case scenarios scaled by numbers. This is **defensible** as a risk-averse heuristic but **insufficient** for absolute priority, as it may neglect catastrophic risks in smaller populations.  
  4. **Linear Scaling of Moral Status**: Each insect intrinsically possesses identical, additive moral status regardless of uncertainty, so collective status scales linearly with headcount. This is **false**, as moral status depends on actual sentience (not headcount alone), and uncertainty about sentience undermines this additive assumption.  
  5. **Distributed Phenomenal Binding**: Insects' decentralized cognition may produce emergent or hive-level sentience ("swarm consciousness"), where uncertainty per individual dissolves into collective certainty at scale. This is the **most defensible** bridge from individual uncertainty to collective urgency, as it reframes the moral patient as the swarm, making scale genuinely sufficient for dominance if plausible.
