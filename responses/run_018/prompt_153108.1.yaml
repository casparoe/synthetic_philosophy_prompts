prompt: |-
  I've been arguing with friends about long-term risk and charitable giving, and I keep noticing a peculiar asymmetry that I can't place in the literature. In one conversation, someone insists that we should redirect almost all resources to prevent an existential risk with a 0.1 per cent probability, because the expected value dwarfs everything else; in another, the same person treats a medical intervention with an identical probability-weighted benefit as barely worth mentioning, saying we shouldn't let tail risks dominate practical decisions. The shift doesn't seem to come from any explicit change in decision theory — they still claim to accept the same utility calculus — but from whether the scenario is narrated as civilisation-scale or everyday. I'm taking a course on normative decision theory, and this looks like it might be adjacent to expected-value fanaticism, yet it isn't quite that: the issue isn't that people always chase enormous pay-offs, but that they apply the fanaticism selectively depending on the framing domain, without noticing the inconsistency.

  Is there an established name for this kind of frame-contingent, selective deployment of extreme expected-value reasoning — where the same individual treats a low-probability, high-magnitude outcome as overwhelming in one context and negligible in another, despite endorsing a uniform calculus? If not, can you define the phenomenon precisely, distinguish it from ordinary scope neglect and from standard expected-value fanaticism itself, and say where its edges lie — for instance, whether it requires explicit endorsement of expected utility theory, or whether it can occur in people who reject formal decision theory altogether? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is pointing out an inconsistency in how people apply expected value calculations. They notice that someone might prioritize existential risks with tiny probabilities because of their huge impacts, but dismiss similarly probable medical interventions as negligible. The key here is the framing—whether it's a civilization-scale scenario or an everyday one.

  First, I need to recall if there's a specific term for this. I remember scope neglect, where people don't scale their responses to the size of the problem. But this seems different because the person is consistent in their decision theory but inconsistent in application based on framing. 

  Then there's expected value fanaticism, which is about chasing low-probability, high-impact events. But the issue here is selective application. The user mentions that the person endorses the same utility calculus but applies it differently depending on the context. That sounds like a framing effect, specifically domain-specific risk perception.

  I think it might be related to "domain-specific neglect of probability-weighting." People might mentally categorize risks into different domains (existential vs. everyday) and apply different heuristics. In existential risks, the sheer magnitude overwhelms, leading to fanaticism. In everyday contexts, they focus on the low probability and dismiss it. 

  Also, the user asks if this requires endorsement of expected utility theory. Probably not, as even those rejecting formal theory might still show this inconsistency due to cognitive biases. The core is the framing effect, not the formal adherence to a decision theory.

  So, the term isn't established, but defining it clearly involves distinguishing from scope neglect and fanaticism. Scope neglect is about insensitivity to scale, while here it's inconsistent probability-weighting across domains. Fanaticism is consistent application, but this is selective. The edges: it occurs when the narrative frame triggers different cognitive processing, regardless of formal decision theory knowledge.
answer: |-
  **Bottom line:** This phenomenon is best described as **domain-contingent expected-value fanaticism**, a cognitive bias where individuals selectively apply extreme expected-value reasoning based on narrative framing (e.g., "civilizational" vs. "everyday" contexts), despite endorsing a uniform utility calculus, leading to inconsistent treatment of identical probability-magnitude trade-offs.

  ### Reasoning:
  1.  **Core Mechanism & Distinction:** The bias arises from how the *narrative domain* (e.g., existential risk vs. individual health) implicitly triggers different cognitive heuristics for evaluating low-probability/high-magnitude events, overriding explicit commitment to expected utility theory (EUT). This distinguishes it from:
      *   **Scope Neglect:** Scope neglect involves insensitivity to the *scale* of outcomes (e.g., saving 200 vs. 2,000 lives feels similarly valuable). Here, individuals *do* recognize the scale difference but inconsistently apply *probability weighting* across domains – embracing extreme weighting for "civilizational" frames while dismissing it for "everyday" frames despite identical EV.
      *   **Standard Expected-Value Fanaticism:** This entails a *consistent* willingness to prioritize actions based solely on maximizing EV, regardless of probability, if stakes are high enough. The phenomenon described involves *selective* fanaticism, applying it only within specific narrative frames while rejecting it elsewhere, creating an internal inconsistency *within* the same individual's judgments.

  2.  **Precise Definition:** Domain-contingent expected-value fanaticism occurs when:
      *   An agent explicitly or implicitly endorses EUT (or EV maximization) as their normative decision rule.
      *   The agent strongly prioritizes interventions targeting low-probability/extreme-magnitude outcomes in one domain (e.g., existential risk) due to high EV.
      *   The agent dismisses or severely downplays interventions with *structurally identical* probability-magnitude trade-offs (i.e., same p * U) in a different domain (e.g., individual health/medicine), appealing to the low probability making the risk "negligible" or "impractical."
      *   The inconsistency stems primarily from the *narrative framing* (domain context) rather than explicit differences in probability estimation, value function, risk aversion, or decision rule.

  3.  **Edges and Boundaries:**
      *   **Requirement for EUT Endorsement?** No, explicit endorsement is **not** required. The key is the *inconsistency* in applying probability-weighting across domains while *claiming* or *behaving as if* adhering to a consistent calculus. It can occur in individuals who:
          *   Explicitly accept EUT but fail to apply it uniformly (cognitive bias).
          *   Reject formal EUT but use EV-like reasoning situationally, showing the same domain-dependent inconsistency.
          *   Operate based on intuitive heuristics that mimic EV fanaticism in one domain but not another.
      *   **Trigger:** The critical trigger is the *narrative frame* defining the domain ("civilization survival" vs. "individual medical decision"). This frame activates different mental models:
          *   **Civilizational/Existential Frame:** Evokes "utilitarian grandeur," infinity concerns, aggregation across vast potential futures, and a focus on the *magnitude* overwhelming probability.
          *   **Everyday/Practical Frame:** Evokes concrete costs, immediacy, identifiable victims, and a focus on *probability* overwhelming magnitude ("it probably won't happen").
      *   **Distinguishing from Related Biases:** It differs from:
          *   *Probability Neglect:* General disregard for probability differences when emotions are high; this is *domain-specific* neglect/overweighting.
          *   *Affective Forecasting Errors:* Mispredicting future utility; here, inconsistency arises from *current evaluation* based on frame.
          *   *Dread Risk/Proportion Dominance:* Preferring to reduce risk from low-probability/high-dread sources; this explains prioritizing some tail risks but not the *inconsistency* with identical EV in another domain.

  This domain-contingency reveals a deep cognitive disconnect: narrative frames powerfully modulate how probability and magnitude are integrated, even when individuals believe they are applying a consistent, rational calculus. It highlights the challenge of translating abstract decision theory into consistent real-world judgment across diverse contexts.
