answer: |-
  The ethical duty owed to the dead in dramatization is not a demand for photographic reproduction of life events, but a demand for **integrity in representing the core moral architecture of their agency.** While timelines can be condensed, dialogue invented, and private moments imagined to serve narrative coherence or emotional truth, altering the fundamental *why* behind a person's documented choices constitutes a distinct violation, a theft of their moral essence. This core obligation is "structural fidelity": fidelity to the causal and motivational structure underlying their significant decisions as revealed by the historical record, especially when that record includes their own explicit rejections or endorsements of specific motives.

  Consider our hypothetical nineteenth-century reformer. Her private letters unequivocally reveal her public crusade was fueled by a volatile, inseparable blend: deep-seated moral conviction about the cause *and* a sharp, conscious calculation of how advocacy could elevate her social standing and influence. This internal tension – the friction between idealism and ambition – *is* the engine of her historical agency. It shapes her compromises, her moments of courage, her private doubts, and likely her public rhetoric. It is the complex moral-causal structure of her life.

  The filmmaker, seeking a "cleaner narrative arc," portrays *every* major decision – founding the society, publishing the controversial pamphlet, confronting the powerful politician – as arising *solely* from "disinterested moral principle." The ambition is scrubbed clean. This is not merely adding fictional flourishes; it is **surgically removing a documented, causally significant component of her motivation and replacing it with a pure, simple motive she demonstrably did not possess in isolation.**

  **Why is this particular distortion a distinct wrong to the dead?**

  1.  **Hijacking Moral Agency:** It replaces her actual, complex psychological and moral framework with one fabricated by the artist. Her choices are no longer *hers* – driven by her documented internal calculus of principle *and* self-interest – but become vehicles for the filmmaker's preferred narrative of pure heroism. It overwrites her authentic self-understanding and reasoning (as revealed in her letters) with an alien motivation she never claimed and the evidence shows she explicitly integrated with her principles. This is a fundamental misattribution of agency.
  2.  **Erasing the Struggle and Diminishing the Achievement:** The reformer's documented struggle – the genuine effort to navigate principle amidst ambition, the potential guilt or rationalization, the moments where ambition might have spurred courage or principle reined in excess – is erased. Portraying her as purely principled makes her perseverance seem effortless, her choices obvious. This diminishes the actual, hard-won nature of her achievements, which were forged *within* that complex motivational landscape, not outside of it. Her triumph over temptation or her navigation of conflicting desires becomes invisible.
  3.  **Denying Authenticity and Reducing Humanity:** The reformer was neither a saint nor a cynic; she was a complex human being operating within her social context. Depicting her solely as a paragon of disinterested virtue denies her that authentic humanity. It turns her into an icon, a symbol, precisely the kind of simplified hero she herself, in her candid moments, revealed she was not. It disrespects the messy, contradictory reality of her lived experience that she herself confessed.
  4.  **Violating the Historical Self-Portrait:** Her private correspondence is a form of self-testimony. By explicitly revealing the mix of motives (even if only to herself or a confidant), she provided a key to understanding her choices. To portray her as acting solely from a motive she *explicitly documented* as only part of her reasoning is to directly contradict her own account of her internal world. It silences her self-revelation.

  **Why Structural Fidelity Constrains Artistic License (Even Against Audience Preference):**

  Artistic license rightly allows creators to shape compelling narratives from complex history. However, this license finds its ethical limit when it fundamentally rewrites the moral-causal engine of a real person's life. Audiences may prefer a simpler, morally unambiguous hero – a figure untainted by ambition or doubt. But catering to this preference by altering the documented motivational structure does profound violence to the historical individual.

  *   **Truth vs. Comfort:** The duty to the dead is grounded in a respect for historical truth and the individual's authentic legacy, not in providing audiences with comforting fables. Simplifying the moral portrait for palatability prioritizes audience gratification over the integrity of the person being portrayed.
  *   **Power and Representation:** The dead cannot consent or correct the record. The creator wields immense power in shaping how they are remembered. Structural fidelity is a necessary check on this power, ensuring the representation is anchored in the individual's documented reality, not merely the creator's (or audience's) desired fantasy.
  *   **The Essence of the Legacy:** What we owe the dead is the preservation of the *meaning* of their choices within the context of their actual character and circumstances. For this reformer, her legacy is intrinsically tied to the *struggle* between high principle and worldly ambition – the fact that she achieved great things *despite* and *through* that tension. To remove ambition is not just to change a detail; it is to create a fundamentally different person and rob her actual historical self of its defining complexity. Her true story, the one she lived and documented, is replaced by a fiction bearing her name.

  In essence, structural fidelity protects the dead from becoming mere puppets enacting a script written by posterity's preferences. It demands that the *reasons why* they acted as they did, especially when those reasons are complex, conflicted, and explicitly documented, remain the bedrock of their dramatic portrayal. To do otherwise, as in our reformer's case, is not just historical inaccuracy; it is an ethical failure, a refusal to engage with and respect the authentic, morally intricate human being who once lived.
