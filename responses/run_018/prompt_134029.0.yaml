  Let me carefully unpack this. Reed starts with Williams' interest-collapse model - arguing that dueling faded because states monopolized violence (making legal risks intolerable for elites), and slavery ended due to industrial efficiency gains pre-dating moral arguments. His core claim is that material/status costs must exceed benefits for norms to collapse. Voss counters with Appiah's honor-redefinition thesis - dueling vanished when refusing challenges became honorable, slavery collapsed when slaveholding became shameful. Her key evidence: norms dissolved even where profitable/legally safe, showing moral framing matters more.

  In their second exchange, Reed introduces "honor-cost asymmetry" - moral arguments only work when they reveal how a norm structurally undermines elite status. Voss retorts that recognizing something as "self-undermining" already requires the moral shift Reed downplays, and cites how dueling declined even where state enforcement was weak.

  Now to evaluate each move systematically:

  For Reed's initial argument: He's partially right about structural factors mattering, but oversimplifies by ignoring how moral shifts enable cost recognition. The economic determinism on slavery is shaky - profitability varied regionally, yet abolition spread normatively. Rating: Partially right but incomplete.

  Voss's rebuttal scores strongly by spotlighting moral framing's causal power, especially her evidence about persistence despite profitability. Her challenge exposes a real flaw in Reed's model. Rating: Mostly right.

  Reed's asymmetry refinement is clever but circular - it smuggles in the normative evaluation it claims to bracket. Defining "structural self-undermining" requires precisely the honor shift he minimizes. Rating: Partially right but self-undermining.

  Voss's counterpunch lands well - she identifies Reed's circularity and provides empirical support from weak-enforcement regions. Rating: Mostly right.

  Overall, Voss has the stronger case, but both miss crucial interaction effects: Moral arguments gain traction when amplified by institutional enforcement (e.g., courts prosecuting duelists), while institutional changes require legitimacy from moral narratives (e.g., industrialists needed abolitionist rhetoric to justify dismantling slavery). Neither adequately explores how interests and norms co-evolve through feedback loops - like how falling participation in dueling made enforcement easier, which accelerated normative shift. The user might also benefit from considering physical analogs - perhaps phase transitions where temperature (material conditions) and pressure (normative forces) jointly determine state changes.
answer: |-
  Here's a point-by-point adjudication of the Reed-Voss debate, evaluating each move and identifying key gaps:

  ### Move 1: Reed's Initial Argument (Interest-Collapse Model)
  - **Rating:** Partially Right but Incomplete  
  - **Justification:**  
    Reed correctly identifies *necessary structural factors*:  
    - States monopolizing violence did raise the legal/social costs of dueling (e.g., Wellington prosecuted for dueling in 1843).  
    - Slavery's profitability *did* decline in industrializing economies (e.g., British Caribbean sugar became less competitive than industrial wages).  
    **However**, he overstates material determinism:  
    - Slavery remained highly profitable in the US South (cotton) and Brazil (coffee) *during* abolition.  
    - Dueling persisted in Germany/Italy despite state weakness, collapsing only post-1870 when honor norms shifted.  
    **Missing:** Ignores how moral arguments *shaped cost perceptions* (e.g., dueling's "costs" included new social shaming).

  ### Move 2: Voss's Rebuttal (Honor Redefinition)
  - **Rating:** Mostly Right  
  - **Justification:**  
    Voss effectively challenges Reed's materialism:  
    - Dueling's decline in England (e.g., the 1852 "last notable duel") coincided with Victorian moral reform, not new laws.  
    - Slavery collapsed rapidly in Brazil (1888) and the US (1865) despite profitability, driven by abolitionist shaming (e.g., "Uncle Tom's Cabin" made slaveholding socially toxic).  
    **Evidence Strength:** Her "status trap" concept explains why elites abandoned practices despite material benefits (e.g., post-1830s British aristocrats avoided duels to signal modernity).  
    **Caution:** Underplays how economic shifts *enabled* moral arguments (e.g., industrialists supported abolition to weaken agrarian elites).

  ### Move 3: Reed's Refinement (Honor-Cost Asymmetry)
  - **Rating:** Insightful but Circular  
  - **Justification:**  
    Reed's asymmetry adds nuance—e.g., slavery became "self-undermining" when abolitionists linked it to barbarism, threatening elite legitimacy.  
    **Flaw:** As Voss notes, *recognizing* this asymmetry *requires* prior normative shift. Calling slavery "self-undermining" in 1850 presupposes Appiah-style honor redefinition. Without abolitionist framing, profit alone sustained slavery (e.g., pre-1770s colonial norms).  
    **Partial Credit:** Correct that moral rhetoric fails without *some* structural vulnerability (e.g., anti-feudalism arguments gained traction post-industrialization).

  ### Move 4: Voss's Counter (Normative Primacy)
  - **Rating:** Largely Correct  
  - **Justification:**  
    - Voss exposes Reed's circularity: Honor redefinition *creates* the perception of asymmetry.  
    - Her empirical challenge holds: Dueling faded in the American South (weak state enforcement) and Jamaica (no economic pressure) post-1850s due to moral contagion from Northern/European norms.  
    **Limitation:** Overstates moral autonomy; weak enforcement *allowed* dueling's persistence where honor norms held (e.g., German students until 1914).

  ---

  ### Overall Verdict:  
  **Voss is more persuasive.** She successfully centers normative redefinition as the *proximate cause* of collapse, while Reed's structural factors are better seen as *enabling conditions*. Moral revolutions require material opportunities, but Voss demonstrates that honor redefinition is the active catalyst.

  ### Critical Gap: Institutional-Meaning Feedback Loops  
  Both underplay **how institutions and social meanings co-evolve**:  
  1. **Enforcement legitimizes norms:** State anti-dueling laws gained teeth *because* public opinion shifted (e.g., UK's 1843 Act enforced after decades of indifference).  
  2. **Material interests adapt to norms:** Slavery's "inefficiency" was often *retroactively constructed*—e.g., British capitalists embraced "free labor" ideology *after* abolition, using it to justify colonial exploitation.  
  3. **Elite incentives are hybrid:** Southern US elites defended slavery not just for profit but because their *identity* was entwined with "honorable" mastery. Collapse required both economic pressure (Reed) *and* shaming (Voss).  

  **Key Missing Concept:** **Normative tipping points**—where practices like dueling become unsustainable once defectors (those refusing challenges) reach a critical mass. This synthesizes both views: instrumental calculation (avoiding social/legal costs) accelerates once moral pioneers redefine honor. Historical scholarship (e.g., Joanne Freeman on US dueling) confirms this interplay: neither pure interest nor pure morality suffices alone.
