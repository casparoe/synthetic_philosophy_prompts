reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two camps on Buddhist no-self (anatta) and personal identity.

  Camp A: Discrete-Event Reductionists
     - View: "Person" is just a conventional designation over discrete, impermanent mental-physical events. There is no diachronic thread, not even functional continuity.

  Camp B: Causal-Stream Defenders
     - View: Anatta denies a permanent, unitary soul (atman), but there is an impermanent causal-psychological stream (like a flickering flame passed candle-to-candle) that explains memory, karma, and moral accountability.

  The joint statement should have:

  1. Agreed claims (numbered) that both can sign, covering:
     - What anatta actually rejects.
     - Conventional vs ultimate description.
     - The "scanned-mind teletransport" scenario (mind-state scanned, original body destroyed, reconstructed on Mars). Both agree on the physics and what needs philosophical explaining.

  2. Disagreements: Each camp's own wording for their position on the points of disagreement.

  3. Cruxes: 
     - One crux: Whether causal continuity needs an underlying bearer.
     - Another crux: Whether moral responsibility requires literal sameness.
     For each crux, a concrete case or argument both accept as bearing on it, and each camp's prediction.

  4. Format: 
     - First, a list of agreed claims (numbered).
     - Then, a table for disagreements (with columns for the issue, Camp A's view, and Camp B's view).
     - Then, a section for cruxes, with each crux having:
          * Description
          * Concrete case/argument
          * Camp A's prediction
          * Camp B's prediction

  5. End with a one-line summary: "Summary: [whether the leftover gap is mostly ontological or mostly about pragmatic convention]"

  Keep it casual, avoid obscure jargon, and don't cite texts.

  Let's begin.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Anatta and Personal Identity  

  **Agreed Claims (Both Camps Endorse):**  
  1. **Anatta's Core Rejection:** Anatta denies any permanent, unchanging, or independent self (*atman*). There is no "soul" or metaphysical essence that persists unchanged across time.  
  2. **Conventional vs. Ultimate Description:** "Person" is a useful conventional label for everyday life (e.g., ethics, communication), but it doesn’t reflect an ultimate reality. Ultimate truth reveals only transient, conditioned phenomena.  
  3. **Teletransport Scenario:** If a mind-state is scanned, the original body destroyed, and reconstructed identically on Mars:  
     - **Physics Consensus:** The Mars replica has identical memories, personality, and neural states.  
     - **Philosophical Task:** Explaining why (or if) this replica is "you" for karma, memory, or accountability—without invoking a "self."  

  ---

  **Disagreements (Stated in Each Camp’s Own Words):**  

  | Issue                          | Camp A (Discrete-Event Reductionists)                                                                 | Camp B (Causal-Stream Defenders)                                                                 |  
  |--------------------------------|-------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|  
  | **Diachronic Continuity**      | "There’s no thread—not even functional—tying 'you' across time. Each moment is a new, disconnected event." | "A causal stream links moments—like a flame passed between candles—allowing continuity without a soul." |  
  | **Moral Accountability Basis** | "Responsibility is a convention applied to *patterns* of events, not a ‘same’ entity. Karma is habit-propagation, not personal debt." | "Karma requires causal linkage: past intentions *directly influence* future states in a single stream." |  

  ---

  **Cruxes:**  
  *Cruxes are unresolved points where predictions diverge. Both camps agree these cases test the theories.*  

  1. **Crux: Does causal continuity need an underlying bearer?**  
     - **Case:** A "Memory Chain" experiment: Person X’s brain state is copied to Y, then Y’s state to Z. X’s memories exist in Z, but with no causal/physical link between X and Z.  
     - **Camp A Prediction:** Z isn’t X. Continuity is just convention—no bearer needed. Z’s "X-memories" are inert data, not karmic ties.  
     - **Camp B Prediction:** Z isn’t X *karmically*. Causal gaps break the stream; accountability requires unbroken cause-effect.  

  2. **Crux: Does moral responsibility require literal sameness?**  
     - **Case:** "The Negligent Scientist": A person fires a ray gun, causing amnesia and total personality change in their victim. Both physical and mental continuity are disrupted.  
     - **Camp A Prediction:** No blame—the "person" who fired the gun is gone. Responsibility tracks clusters of events, not identity.  
     - **Camp B Prediction:** Blame holds if the victim’s suffering *causally traces* to the act. Sameness is causal, not literal.  

  ---

  **Summary:** The leftover gap is mostly about whether continuity is ontological (B) or pragmatic convention (A).
