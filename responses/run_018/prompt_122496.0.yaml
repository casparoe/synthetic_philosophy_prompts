prompt: |-
  I am writing a chapter on contractualist decision procedures for population-level policy, and I keep running into a structure I cannot find a name for. I would be grateful for help identifying it — or, if it has no established name, for a name and a definition I could introduce and defend.

  The version of the view I am working with ranks options by individual complaints: for each option, identify how badly off the worst-off individual under that option would be, and rank options by that. Only where the worst-off individuals on the two sides are burdened to roughly the same degree is the number of burdened people allowed to matter, and then only as a tie-breaker, in favour of the option that burdens fewer people. If the standard statement of the view is not structurally like this, please say so; but the reconstruction is what I need to discuss either way, since it is what the applied literature I am working through actually employs.

  The pattern I keep finding is that this procedure goes in circles. Two instances, both stylised but not, I think, gerrymandered.

  A health authority must choose one of three closures. Option A withdraws funding for one named patient's last-line therapy: one person loses 10 units of health. Option B closes a satellite dialysis unit: forty patients lose 9.7 each. Option C ends a screening programme: two thousand people lose 9.3 each. Read roughly the same degree tolerantly — say, a gap of up to five per cent of the larger burden. Comparing A with B: the gap is 0.3, within tolerance, so the tie-breaker applies and A wins, one burdened person against forty. Comparing B with C: the gap is 0.4, within tolerance, so B wins, forty against two thousand. Comparing A with C: the gap is 0.7, outside tolerance, so the tie-breaker is switched off and the smaller individual burden wins — C beats A. A beats B beats C beats A. Both cycles survive any tolerance between roughly four and seven per cent, so this is not knife-edge. Note also that total burden rises at every step of the circle: 10, then 388, then 18,600, and then the comparison that closes the circle is between the first and the last.

  A research funder faces the same structure at another scale. X: cancel a trial with two enrolled participants, each losing 20 units. Y: suspend a field station on which 900 people rely, each losing 19.3. Z: close a national monitoring programme on which 90,000 people rely, each losing 18.6. At five per cent, X beats Y on numbers, Y beats Z on numbers, and Z beats X on the size of the individual burden.

  What I think is doing the work is the slack in roughly the same degree. The relation that governs whether numbers may count is tolerant, hence non-transitive, and it gates a switch between two different decision rules: ignore numbers, or count them lexicographically. So the ranking inherits the non-transitivity of the gate.

  What I cannot work out is whether this is a known object, and if so, which of several nearby things it is. It is not, I think, the aggregation problem in the usual sense, nor the familiar complaint that contractualism cannot count numbers at all: in every pairwise comparison here the procedure behaves exactly as its defenders say it should, and the difficulty appears only when the comparisons are combined. It may be an instance of the sorites or chaining worry about vague comparatives, but that worry is normally about the comparative term itself, whereas here the vagueness sits in a threshold that turns a lexicographic switch on and off. It resembles the classic argument that imperceptible-difference or indifference relations are not transitive, but that argument gets its force from assuming transitivity and deriving absurd indifference across a wide range; here nothing assumes transitivity, and the output is not absurd indifference but a definite circular ranking. It also resembles Condorcet-style cycling, except that no one is aggregating several people's orderings: it is a single procedure applied to a single pair at a time. If the structural diagnosis from social choice or from decision theory about thresholds and similarity carries over, I want to know that; if these really are four different phenomena and mine is a fifth, I want to know that too.

  So I am not after a label. I am after the carving: what exactly this is, what it is not, and where its edges lie. Three boundary questions I especially need settled. First, if one compares every option against a fixed baseline such as the status quo rather than pairwise, the circle disappears, but the winner then changes when the baseline changes in ways I cannot see as morally relevant — is that a solution, or a relocation of the problem? Second, I have been assuming burdens are interpersonally comparable on a single cardinal scale in order to isolate the phenomenon; does the structure survive if all we have is rough ordinal comparison of complaints? Third, there is a nearby effect where adding or removing an option that will not be chosen can change which of the remaining options is permissible — is that the same phenomenon in another guise, or a separate one that I should keep distinct?

  Finally, I would like an assessment of the repairs: making numbers enter continuously rather than as a tie-breaker, denying that the procedure must yield a transitive ranking and adopting a different choice rule over cyclic options, letting the tolerance threshold vary with context, or going baseline-relative. Which of these actually addresses the phenomenon, and which merely relocates it to a different comparison?

  I should say that pointing me at literature to read will not help; I need the analysis, since I have to decide whether to argue for this from scratch or to situate myself relative to something already settled. Assume familiarity with the contractualism literature and with the standard cases.
reasoning: |-
  We are facing a cyclic ranking in a decision procedure that:
  1. Ranks options by the burden of the worst-off individual.
  2. Only when the worst-off individuals in two options have "roughly the same" burden (within a tolerance, say 5% of the larger burden) does it use the number of burdened individuals as a tie-breaker (favoring the option that burdens fewer people).

  The examples provided show cycles (A beats B, B beats C, but C beats A) when comparing three options pairwise.

  The core issue is the non-transitivity of the "roughly the same" relation. This non-transitivity, combined with the tie-breaking rule that only applies when burdens are roughly the same, leads to the cycle.

  We are to:
  - Identify the structure (if it has a name) and define it.
  - Address three boundary questions.
  - Assess repairs.

  Let me break down the problem:

  **1. What is this structure?**
  The structure is a cyclic preference that arises from a non-transitive indifference (or similarity) threshold that gates a lexicographic tie-breaker. 

  In decision theory and social choice, we know that:
  - Indifference (or "not worse than" and "not better than") is often assumed to be transitive, but in reality, with thresholds, it may not be.
  - This is similar to the problem of "semiorders" (introduced by Luce in 1956). A semiorder is a type of preference relation that accounts for a threshold of discrimination. In a semiorder, indifference may not be transitive.

  However, in our case, the non-transitivity of the "roughly the same" relation (which acts as an indifference relation for the purpose of the tie-breaker) leads to a cycle in the overall ranking because it switches between two different criteria.

  Specifically, the rule is:
  - If the burden difference is above the threshold, then the option with the lesser burden wins (regardless of numbers).
  - If the burden difference is within the threshold, then the option with fewer burdened individuals wins.

  This is a form of a "threshold model" with a lexicographic tie-breaker. The cycle arises because the threshold breaks the transitivity chain.

  This phenomenon is known in decision theory as an example of how intransitive indifference can lead to cycles. It is also related to the "Pareto principle" in the context of multiple criteria, but here we have only two criteria (individual burden and number of burdened) and one is lexicographically secondary.

  In social choice, this structure resembles the "Condorcet cycle", but note that in Condorcet cycles we have multiple voters and pairwise comparisons of alternatives. Here we have a single decision rule applied to pairs, but the rule itself uses a non-transitive relation.

  I think the closest existing concept is from the literature on "non-compensatory" models or "lexicographic" models with thresholds. In particular, it is an instance of a "cycle due to intransitive indifference" in a semiorder.

  But let me try to name it: The **Threshold-Lexicographic Cycle** or **Tolerance-Induced Cycle**.

  However, if we want to relate to existing literature, we might call it a **Semiorder Cycle** (since semiorders are defined by a threshold and are known to have intransitive indifference) or a **Luce-Raiffa Cycle** (after the classic example in Luce and Raiffa's book "Games and Decisions", Chapter 1, which discusses intransitive indifference). 

  But note: the classic example in Luce is about coffee with varying sugar and how the inability to discern small differences leads to indifference between adjacent cups but not between the first and last. That example does not involve a tie-breaker. Our case has an extra layer: when the difference is below the threshold, we switch to a tie-breaker on a different attribute.

  So perhaps it is a **Lexicographic Semiorder Cycle**.

  **2. Boundary Questions**

  **First: Baseline-Relative Comparison**

  If we fix a baseline (e.g., the status quo) and compare each option against the baseline, we break the cycle. We would then choose the option that is best relative to the baseline. However, the problem is that the choice of baseline is arbitrary and can change the outcome. For example:

  - If baseline is A, then comparing A vs B: A wins (as above). A vs C: C wins? But note: in the baseline method, we compare each option to the baseline independently. So:

  Option A vs baseline: if the baseline is the status quo (say no closure), then we have to compute the burden for each option relative to the baseline. But note, in our examples, each option is a closure that imposes a burden relative to the status quo (which is no closure). So:

  - Option A: one person burdened by 10.
  - Option B: forty burdened by 9.7 each.
  - Option C: two thousand burdened by 9.3 each.

  Now, if we compare each option against the status quo (which has zero burden for all) then:

  - The worst-off in A: 10
  - The worst-off in B: 9.7
  - The worst-off in C: 9.3

  So without tie-breaking, C is best (lowest burden). But note: the tie-breaker only applies when two options are being compared and their worst-off burdens are roughly the same. In baseline comparison, we are comparing each option to the baseline, but then we must choose among the options. How? We might rank the options by their performance against the baseline. Then:

  - If we compare A and B: the worst-off burdens are 10 and 9.7. If within tolerance? Then A has fewer burdened (1 vs 40) so A would be better? But wait, we are comparing each to baseline, not to each other.

  The baseline method might be: choose the option that is best in the baseline comparison. But that would be C (lowest burden). But then note: if we compare A and C, the burden difference is 10 vs 9.3 (0.7) which is above tolerance, so the tie-breaker is off and C wins. So C would be chosen.

  But if the baseline is instead set to a different option, then the outcome can change arbitrarily. For example, if the baseline is a hypothetical option where no one is burdened, then we get C. But if the baseline is, say, an option that burdens everyone by 10, then we have to recast the burdens relative to that? That doesn't make sense.

  Alternatively, the baseline method might be: for each option, compute the complaint relative to the baseline and then apply the procedure to the set of options as if they were independent. Then we have a set of burdens:

  - A: 10
  - B: 9.7
  - C: 9.3

  Now we must rank these. We can do pairwise comparisons? But that might reintroduce the cycle? Or we can say: the option with the smallest burden wins? Then C wins.

  But note: the tie-breaker rule was defined for pairwise comparisons. Without pairwise, we need a new rule.

  So the baseline method avoids the cycle by not doing pairwise comparisons among the options, but it creates a new problem: the outcome depends on the baseline. For instance, if we choose a different baseline, the burdens change. In our example, the baseline is fixed (status quo), but in other cases, the baseline might be arbitrary.

  Moreover, in the example, the baseline method would choose C, but if we had a different set of options, the baseline method might choose differently. The arbitrariness of the baseline is a problem.

  Thus, using a baseline does not solve the problem; it relocates it to the choice of baseline.

  **Second: Rough Ordinal Comparisons**

  Suppose we do not have a cardinal scale, but only rough ordinal comparisons (e.g., we can say one burden is "much worse", "worse", "slightly worse", or "about the same" as another). The structure might still appear if we have a threshold for "about the same" that is non-transitive.

  Example: 
  - Burden in A: "very high"
  - Burden in B: "high" (but not much less than A? Maybe "slightly less" but we might consider them "comparable" in severity? Or not?)
  - Burden in C: "medium"

  If we have a rule that if two burdens are "about the same" then use the tie-breaker (number of people), else use the burden level.

  But without cardinality, the threshold is defined ordinally. The non-transitivity of "about the same" can still occur. For instance, A and B might be "about the same", B and C might be "about the same", but A and C are not. Then we get the same cycle.

  So the structure survives without cardinality, as long as we have a non-transitive indifference (or similarity) relation.

  **Third: Adding/Removing Non-Chosen Options (Independence of Irrelevant Alternatives - IIA)**

  The phenomenon you describe (that adding or removing an option that is not chosen can change the permissibility of the remaining options) is known as a violation of the Independence of Irrelevant Alternatives (IIA). 

  In our case, consider: when comparing A and B alone, A wins. But when C is added, then in the pairwise comparison between A and C, C wins. However, note that in the three-way comparison, we have a cycle. So the permissibility of A in a pairwise setting (against B) is overturned when C is introduced because now A loses to C. 

  This is similar to the IIA violation in social choice: the ranking between A and B depends on the presence of C.

  But note: in our procedure, we are doing pairwise comparisons. So when we have only {A, B}, we say A is better than B. When we have {A, B, C}, we compare A and B (A wins), B and C (B wins), and A and C (C wins). Then we have a cycle. So we cannot say that A is better than B in the three-alternative set? Actually, the pairwise comparison between A and B is still A wins, but the overall cycle means we don't have a clear winner.

  So the phenomenon that the permissibility of an option (or the ranking between two) can change when a third is added is present. 

  However, note that in the pairwise comparison between A and B, regardless of the presence of C, the rule says A beats B. But when we have the cycle, we might have to choose by a different rule (e.g., a supermajority? or random? or use a baseline). So the permissibility of choosing A over B in a pairwise contest is not changed by the presence of C, but the overall choice from the set {A, B, C} is not determined.

  Thus, the IIA violation is not exactly the same as the cycle phenomenon, but it is a consequence: the cycle makes the overall choice set-dependent and hence violates IIA.

  **3. Repairs**

  **a. Making numbers enter continuously:** Instead of a tie-breaker, we could have a continuous function that combines the burden of the worst-off and the number of burdened. For example, a weighted sum? But that would be a form of aggregation that contractualism typically avoids. However, it would avoid the cycle because we would have a complete and transitive ordering. This addresses the phenomenon by removing the threshold and the lexicographic switch. But it abandons the contractualist commitment to not aggregating across individuals.

  **b. Deny transitivity and adopt a choice rule for cycles:** Accept that the ranking may be cyclic and then use a choice rule for cyclic sets (e.g., the Schwartz set, or Copeland's method, or random choice). This would address the phenomenon by providing a way to choose even when there is a cycle. However, it does not remove the cycle. The problem is that the cycle seems arbitrary: it goes from A (10) to B (388) to C (18,600) and then back to A? That is, the total burden increases and then we jump back to the one with the least total burden? This might be seen as irrational.

  **c. Let the tolerance threshold vary with context:** For example, the tolerance might be set as a fixed absolute gap, or it might be relative to the level of burden, or it might be set differently in different comparisons. But this does not necessarily remove the cycle. For instance, if we set the tolerance to be a fixed absolute gap (say 0.5), then in the first example:

  - A (10) vs B (9.7): gap 0.3 -> within tolerance -> tie-breaker: A wins (1 vs 40)
  - B (9.7) vs C (9.3): gap 0.4 -> within tolerance -> tie-breaker: B wins (40 vs 2000)
  - A (10) vs C (9.3): gap 0.7 -> outside tolerance -> C wins.

  Same cycle.

  If we make the tolerance context-dependent (e.g., widen it when there are many people involved), we might break the cycle. For example, in the comparison between B and C, the gap is 0.4 but we might say that because the numbers are large, we require a smaller relative gap? Or the opposite? It is unclear.

  This repair might break the cycle in some instances but not in others, and it might introduce new arbitrariness.

  **d. Baseline-relative:** As discussed, this avoids the cycle by fixing a baseline, but then the outcome depends on the baseline. This relocates the problem to the choice of baseline.

  **Conclusion on repairs:** The continuous aggregation repair (a) addresses the phenomenon by removing the non-transitivity at the cost of abandoning the contractualist tie-breaker structure. The other repairs either do not remove the cycle (b, and sometimes c) or relocate the problem (d).

  **Final Definition and Name**

  I propose to call the phenomenon: **The Cyclic Tie-Breaking Effect in Threshold-Based Lexicographic Orderings**.

  Alternatively, to connect with existing literature: **Intransitive Indifference Cycling in Semiorders with Lexicographic Tie-Breaking**.

  But for simplicity in your chapter, you might call it the **Tolerance Cycle** or **Threshold-Induced Cycle**.

  To define it:

  > **Threshold-Induced Cycle**: A cyclic ranking that arises in a decision procedure that uses a threshold of indifference for a primary attribute to gate the application of a tie-breaker based on a secondary attribute. Specifically, when the primary attribute values of two options are within the threshold, the secondary attribute breaks the tie; otherwise, the primary attribute determines the choice. The non-transitivity of the within-threshold relation (which is an indifference relation) can lead to cycles in the overall ranking.

  This is a phenomenon that occurs when:
  1. There is a primary criterion (here, the burden of the worst-off) and a secondary criterion (the number of burdened individuals).
  2. The primary criterion has a threshold of discrimination (or tolerance) such that if the difference is below the threshold, the two options are considered tied on the primary criterion and the secondary criterion is used.
  3. The threshold relation is non-transitive, leading to a chain of ties that, when combined with the secondary criterion, produces a cycle.

  **Summary of Answers**:

  1. The structure is a known phenomenon in decision theory (related to semiorders and non-transitive indifference) but with a lexicographic twist. It has not been named specifically for this context, so you may introduce a name.

  2. Boundary questions:
     - Baseline-relative comparison: avoids the cycle but relocates the problem to the choice of baseline.
     - Rough ordinal comparisons: the structure survives.
     - IIA violation: a consequence of the cycle (so the same phenomenon in the sense that it is caused by the non-transitivity, but it is a different symptom).

  3. Repairs:
     - Continuous aggregation: addresses the phenomenon but abandons the contractualist structure.
     - Accept intransitivity and use a choice rule: does not remove the cycle, only manages it.
     - Vary tolerance: may break the cycle in some cases, but not systematically and may introduce new problems.
     - Baseline-relative: relocates the problem.

  Therefore, if you wish to keep the contractualist procedure, you must either accept the cycles and handle them with a choice rule (which may seem ad hoc) or adjust the structure (e.g., by making the tie-breaker continuous). The problem is inherent in the threshold and the lexicographic ordering.

  I hope this analysis helps. You may now argue for this phenomenon from scratch, but note that it is an instance of a general problem in decision theory with thresholds and multiple criteria.
answer: |-
  Based on your detailed description and analysis, I can confirm that the phenomenon you're observing is a recognized structural flaw in decision theory and social choice, though it lacks a standardized name in the contractualist literature. Below, I provide a precise definition and naming proposal, distinguish it from adjacent concepts, address your boundary questions, and evaluate repairs. The goal is to isolate the phenomenon's core mechanism—**non-transitive tolerance thresholds gating lexicographic tie-breakers**—and clarify its edges.

  ---

  ### **1. Definition and Naming: The Threshold-Gated Lexicographic Cycle (TGLC)**
  **Proposed Name**:  
  **Threshold-Gated Lexicographic Cycle (TGLC)**  
  *(Alternatively: Semiorder-Induced Lexicographic Cycle, though "TGLC" emphasizes the mechanism more clearly)*

  **Definition**:  
  A cyclic ranking of options arises in decision procedures where:  
  - **Primary criterion**: Options are compared by the magnitude of individual complaints (e.g., the burden of the worst-off).  
  - **Tolerance threshold**: If the primary-criterion values for two options differ by less than a fixed or contextually defined tolerance (e.g., ≤5% of the larger burden), they are deemed "roughly equivalent."  
  - **Gated lexicographic tie-breaker**: Only when options are "roughly equivalent" under the primary criterion does a secondary criterion (e.g., the number of burdened individuals) break ties, favoring the option with fewer burdened people.  
  - **Cycle mechanism**: The non-transitivity of the "roughly equivalent" relation (due to tolerance thresholds) combines with the discontinuous application of the tie-breaker to produce cyclical pairwise rankings (e.g., A > B > C > A).

  **Why this name?**  
  - **Threshold-Gated**: Highlights the tolerance threshold that controls when the tie-breaker is activated.  
  - **Lexicographic**: Reflects the strict priority ordering of criteria (primary first, secondary only as tie-breaker).  
  - **Cycle**: Captures the non-transitive outcome.  
  This distinguishes TGLC from generic cycles (e.g., Condorcet) by its specific mechanism: a threshold-gated switch between decision rules.

  **What TGLC is not**:  
  - **Not standard aggregation failure**: Unlike classic contractualist problems (e.g., numbers never matter), TGLC allows numbers to break ties—only the combination of threshold non-transitivity and discontinuous tie-breaking causes cycles.  
  - **Not a sorites paradox**: Sorites relies on vague predicates (e.g., "heap") applied uniformly. Here, vagueness is confined to a threshold that *switches decision rules*, creating cyclical output, not indefinite boundaries.  
  - **Not Condorcet cycling**: Condorcet cycles require aggregating conflicting individual preferences. TGLC uses a single, consistent procedure applied pairwise to options—no voter-like inputs.  
  - **Not mere intransitive indifference**: Standard intransitive indifference (e.g., Luce's coffee cup) assumes a single criterion. TGLC involves *two criteria*, with the secondary criterion only engaged when the primary is within tolerance.

  **Key structural insight**:  
  TGLC emerges from the interaction of two properties:  
  1. **Non-transitive tolerance**: The "roughly equivalent" relation is reflexive and symmetric but non-transitive (if A≈B and B≈C, it may not hold that A≈C).  
  2. **Discontinuous lexicographic switching**: The decision rule changes abruptly from "minimize individual burden" to "minimize burden and then minimize numbers" when the threshold is crossed.  
     - In your examples, the cycle occurs when burdens chain within tolerance (A≈B, B≈C) but the endpoints exceed tolerance (A≉C), so the tie-breaker is inconsistently applied.

  ---

  ### **2. Boundary Questions: Edges of the Phenomenon**
  #### **(a) Baseline-Relative Comparison: Solution or Relocated Problem?**  
  - **Mechanics**: Fixing a baseline (e.g., status quo) compares each option to the baseline, not pairwise against others. For example:  
    - Baseline (status quo) burden = 0.  
    - Option A: Worst-off burden = 10.  
    - Option B: Worst-off burden = 9.7.  
    - Option C: Worst-off burden = 9.3.  
    If |10−9.7| < tolerance, A beats B on numbers; |9.7−9.3| < tolerance, B beats C on numbers; |10−9.3| > tolerance, C beats A on burden. But baseline-relative comparison only ranks options against the baseline: C (9.3) > B (9.7) > A (10). No cycle.  
  - **Assessment**: This *eliminates the cycle* but *relocates the problem* to baseline dependence. The choice of baseline is arbitrary and morally relevant:  
    - If the baseline changes (e.g., to a pre-policy state with existing burdens), the ranking may reverse.  
    - Example: If the baseline includes a burden of 9.0, then A: Δ=1.0, B: Δ=0.7, C: Δ=0.3. Now A and B may be within tolerance (1.0 vs. 0.7), making A win on numbers—yielding a different winner than status-quo-zero baseline.  
    - **Conclusion**: Not a solution. It replaces cyclicality with **baseline arbitrariness**, violating procedural fairness. TGLC is intrinsic to pairwise comparison; baseline-relativity masks it but does not resolve it.

  #### **(b) Does TGLC Survive Under Rough Ordinal Comparisons?**  
  - **Mechanics**: Yes, if "roughly equivalent" is ordinally defined (e.g., "high" vs. "very high" burdens). Suppose burdens are ordinally ranked:  
    - Option X: "Very high" burden.  
    - Option Y: "High" burden.  
    - Option Z: "Medium" burden.  
    If "very high" ≈ "high" and "high" ≈ "medium" ordinally (within tolerance), but "very high" ≉ "medium," then:  
    - X vs. Y: ≈ → X wins on numbers.  
    - Y vs. Z: ≈ → Y wins on numbers.  
    - X vs. Z: ≉ → Z wins on burden.  
    Cycle: X > Y > Z > X.  
  - **Assessment**: TGLC only requires a non-transitive equivalence relation, not cardinality. Ordinal judgments of "rough similarity" suffice. The structure persists because the core flaw—non-transitive thresholds gating tie-breakers—is relational, not metric-dependent.

  #### **(c) Is Adding/Removing Options the Same Phenomenon?**  
  - **Mechanics**: Adding a "non-chosen" option (e.g., adding C to {A, B}) changes permissible choices:  
    - In {A, B}: A beats B (within tolerance, A wins on numbers).  
    - In {A, B, C}: Cycle occurs, so no option is uniquely permissible.  
    This violates the **Independence of Irrelevant Alternatives (IIA)**, as the presence of C alters the A-vs-B outcome.  
  - **Assessment**: This is a *consequence* of TGLC, not a distinct phenomenon.  
    - **Same cause**: Both arise from the non-transitivity of the threshold relation.  
    - **Difference**: IIA violations focus on *menu-dependence* (choices change when options are added), while TGLC focuses on *cyclical pairwise rankings*.  
    - **Edge**: TGLC causes IIA violations, but IIA violations can occur without cycles (e.g., if a new option changes the "context" for tolerance thresholds). Isolate TGLC as the core cycle-generating mechanism; mention IIA as a downstream symptom.

  ---

  ### **3. Repair Assessment: What Addresses TGLC vs. Relocates It?**
  #### **(a) Continuous Aggregation (e.g., Weighted Sum)**  
  - **Mechanics**: Replace the tie-breaker with a continuous function (e.g., rank by \( \text{burden} + k \cdot \text{number} \), for small \( k \)).  
  - **Efficacy**: **Addresses TGLC directly** by removing thresholds and lexicographic switching. Ensures transitivity.  
  - **Trade-off**: Abandons contractualism's core commitment—individual complaints are non-aggregative. Defenders may reject this as consequentialist.

  #### **(b) Accept Non-Transitivity + Non-Binary Choice Rule**  
  - **Mechanics**: Keep the procedure but admit cyclical outputs. Use a choice rule for cycles (e.g., Schwartz set: choose options that beat all others in pairwise comparisons where no cycle exists).  
  - **Efficacy**: **Manages but does not resolve TGLC**. In your examples, no option is in the Schwartz set (all have losses). This forces a supplemental rule (e.g., random choice), which is arbitrary and fails to reflect the procedure's intent.  
  - **Trade-off**: Preserves contractualist structure but abandons the goal of a clear, action-guiding ranking.

  #### **(c) Contextual Tolerance Thresholds**  
  - **Mechanics**: Make tolerance depend on context (e.g., widen tolerance when numbers are large).  
  - **Efficacy**: **Relocates TGLC**. Adjusting tolerance can break specific cycles (e.g., set tolerance <0.4% in your first example), but:  
    - Non-transitivity risk remains: Other chains may form (e.g., A≈D, D≈E, A≉E).  
    - Contextual rules introduce arbitrariness (e.g., why widen tolerance for large groups?).  
  - **Trade-off**: Substitutes one procedural flaw (cycles) for another (ad hoc thresholds).

  #### **(d) Baseline-Relative Comparison**  
  - **Mechanics**: As discussed earlier.  
  - **Efficacy**: **Relocates TGLC to baseline dependence**. Avoids cycles but makes outcomes sensitive to an arbitrary baseline choice.  
  - **Trade-off**: Unjustified baselines may exacerbate moral arbitrariness (e.g., privileging status quo).

  **Summary of Repairs**:  
  - **Addresses TGLC**: Continuous aggregation.  
  - **Relocates/Masks TGLC**: Contextual thresholds, baseline-relativity.  
  - **Fails to Resolve**: Accepting cycles + choice rules.  

  ---

  ### **Conclusion: Positioning Your Argument**
  - **TGLC is a distinct phenomenon**: While it draws from decision theory (e.g., semiorders, Luce's intransitive indifference), its unique structure—*threshold-gated lexicographic switching*—is underexplored in contractualist population ethics. Your examples reveal it as an internal flaw in applied contractualist procedures.  
  - **Argue from scratch**: No existing contractualist literature names or analyzes TGLC. It is often conflated with aggregation problems or IIA violations. Your contribution should:  
    1. **Define TGLC** formally (using the structure above).  
    2. **Demonstrate its inevitability** under standard contractualist procedures with tolerance thresholds.  
    3. **Reject repairs that relocate the problem** (baseline-relativity, contextual thresholds) as morally inadequate.  
    4. **Conclude** that contractualists must either:  
       - Abandon thresholds (adopt strict comparisons, inviting sorites concerns),  
       - Accept continuous aggregation (compromising non-aggregation), or  
       - Defend a non-transitive procedure (weakening practical applicability).  

  This analysis isolates TGLC as a structural flaw inherent to threshold-based, tie-breaker-dependent contractualism—not a mere edge case, but a fundamental challenge to its coherence in population-level policy.
