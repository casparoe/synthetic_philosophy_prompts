  Key failures: when profiles diverge spatiotemporally or multiplicatively. If one profile persists in one location and another elsewhere, or multiple instances arise from one, the single entity can't be maintained. Also, if persistence conditions demand incompatible existence conditions at a time, like being both fragile and not-fragile if the statue is restored but clay altered.

