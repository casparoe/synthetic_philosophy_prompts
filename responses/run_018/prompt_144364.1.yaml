  Next, destructive digitization: the statue is scanned and destroyed, then replicated elsewhere. The statue profile could transfer to the replica if intent is preserved, but the original clay is gone. The clay profile ends, but the statue might persist elsewhere. How can one entity be in two places? The user might argue the statue profile jumps, but that contradicts the single spatiotemporal worm. This seems like fission, which usually requires entity splitting. Their model must handle this without multiplicity.

