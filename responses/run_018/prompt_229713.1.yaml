  ### Game Design: Absent-Minded Driver Simulation

  #### **Goal**: 
  Make participants experience the tension between ex-ante planning (precommitment) and intra-trip revision, highlighting the paradox of decision-making under indistinguishability.

  ---

  ### **Materials**:
  - **Index cards** (2 per driver, labeled "A" and "B" visibly, with a hidden mark for the facilitator indicating order: e.g., ✓ for first, ✗ for second).
  - **Small prizes** (e.g., candy, $5 gift card).
  - **Scoreboard** (whiteboard or poster).
  - **Dice** (1 per driver, 6-sided) or a **random number generator app**.
  - **Paper slips** for optional mixed-strategy recording.

  ---

  ### **Roles**:
  - **Facilitator (you)**: Run the game, enforce rules, compute scores.
  - **Drivers (all 14 participants)**: Make decisions at intersections. Everyone plays individually.

  ---

  ### **Rules and Timeline** (Total: 90 mins)

  #### **Phase 1: Introduction & Planning (15 mins)**
  - **Explain the scenario** (5 mins):  
    *"You're driving home via two identical intersections. You can't tell them apart. Choices at each intersection:  
    - **Exit**: If done at **first**, end trip in a bad area (0 pts).  
    - **Exit**: If done at **second**, arrive home (4 pts).  
    - **Go straight**: If at first, proceed to second; if at second or both, end in a neutral area (1 pt).  
    You must precommit to a strategy **before** starting."*  
  - **Planning task** (10 mins):  
    - Each driver chooses a **fixed action** ("always exit" or "always go straight") or a **mixed strategy** (e.g., "exit with 1/3 probability").  
    - They write their plan on paper (e.g., "p = 1/3" or "always exit").  
    - **Facilitator tip**: Encourage mixed strategies by hinting, "The highest score isn’t 4; it’s somewhere in between."

  #### **Phase 2: Execution (30 mins)**
  - **Memory suppression rule**: Drivers **cannot** recall prior actions. Enforce using index cards:  
    1. Shuffle the two cards (A and B) and place them face down.  
    2. Flip the first card, make a decision, then flip the second card, make another decision—**no peeking ahead or changing choices**.  
  - **Decision process** (per driver):  
    - For **fixed plans**: Follow the action (exit/go straight) at both intersections.  
    - For **mixed strategies**: Roll a die at each intersection:  
      - e.g., for p = 1/3: Exit on 1–2 (d6), go straight on 3–6.  
  - **Scoring** (computed by facilitator after both decisions):  
    - **First intersection exit**: Game ends, **0 pts**.  
    - **First go straight + second exit**: **4 pts**.  
    - **Both go straight**: **1 pt**.  
  - **Parallel play**: All drivers do this simultaneously (saves time). Collect decisions via paper slips.

  #### **Phase 3: Mid-Run Revision (15 mins)**
  - **Pause after all drivers finish one round** (not mid-trip for individuals; practical compromise).  
  - **Prompt**: *"Imagine you’re at an intersection right now. You don’t know if it’s the first or second. You can change your plan. What do you do at **this** intersection? Write your new strategy."*  
  - Drivers privately revise their plan (e.g., switch to "always exit") without knowing their position.

  #### **Phase 4: Final Scoring & Reveal (15 mins)**
  - Compute scores for **original plans** and **revised plans** (hypothetical "what if" for revision).  
  - Announce top scorers. Award a small prize.  
  - Example scores:  
    | Strategy          | Score if revised mid-run |  
    |-------------------|---------------------------|  
    | Always exit       | 0 (at first) or 4 (at second) → **avg ~2** |  
    | Always go straight| 1 pt (both) |  
    | p = 1/3          | Best ex-ante: **1.33** |  

  ---

  ### **Debrief** (30 mins)
  Map the game to the formal problem:  
  1. **Planning phase** = **Ex-ante optimization**:  
     - Mixed strategy (p = 1/3) maximizes expected utility (4/3 ≈ 1.33).  
     - Paradox: "Exit at second" is a *desirable but unavailable* pure strategy when indistinguishable.  

  2. **Mid-run revision** = **Intra-trip choice**:  
     - At an intersection, drivers feel they're "probably" at the first (since you always reach it).  
     - Belief update: Probability of being at first = \( \frac{1}{2 - p} \) (if using precommitment p).  
     - **Tension**: Precommitting to p = 1/3 feels optimal, but when at an intersection, exiting seems better (e.g., "If I exit now, I might get 4!").  

  3. **Indistinguishability** = **Memory suppression**:  
     - Cards simulate identical nodes. Without position info, drivers can’t condition actions on history.  
     - **Key insight**: Optimal precommitment ≠ optimal intra-trip choice. This is the core paradox.  

  4. **What the game can’t fully replicate**:  
     - **Perfect belief consistency**: In theory, beliefs should derive from the strategy itself (e.g., \( q = \frac{1}{2 - p} \)). The game relies on intuition ("I might be at the first!") but can’t enforce exact Bayesian updating. Explain this in debrief.  
     - **Dynamical inconsistency**: Revising mid-run *should* alter the entire strategy, but drivers focus on the "now." Highlight: "Revising to ‘always exit’ feels smart locally, but leads to 0 if done at first!"

  ---

  ### **Predictable Problems & Fixes**
  1. **Everyone "always exits"**:  
     - **Why**: Fear of 0 at first or greed for 4 at second.  
     - **Fix**: Pre-game hint: "Mixed plans beat extremes." Show math post-game: p = 0 or 1 averages ≤2; p = 1/3 averages 1.33.  

  2. **Smuggling information**:  
     - **Risk**: Drivers peek at cards or share strategies.  
     - **Fix**: Enforce **memory suppression rule**:  
       - Cards are shuffled face down.  
       - Decisions are private.  
       - Penalize visible cheating (e.g., -2 pts).  

  3. **Mixed-strategy confusion**:  
     - **Risk**: Misinterpreting probability (e.g., p = 1/2).  
     - **Fix**: Simplify: Provide a table:  
       | p   | Die roll to exit |  
       |-----|------------------|  
       | 1/3 | 1–2 (d6)        |  
       | 1/2 | 1–3 (d6)        |  

  4. **Revision phase feels artificial**:  
     - **Why**: Drivers know revision is hypothetical.  
     - **Fix**: Frame it dramatically: *"You’re in the car NOW—what do you **actually** do?"*  

  ---

  ### **Why This Works**
  - **Gut-level tension**: Drivers experience the agony of indistinguishability ("I could be throwing away 4 points!").  
  - **Precommitment vs. revision**: Contrasting plans highlights dynamical inconsistency.  
  - **Low tech**: Cards/dice make it tactile and accessible.  
  - **Discussion-ready**: Scores and revisions provide concrete hooks for paradox discussion.  

  Run it, and watch philosophers and engineers alike *feel* the paradox before crunching the algebra! 🚗💨
