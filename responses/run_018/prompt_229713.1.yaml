          if the action for the first intersection is "exit", then outcome=0, and the action for the second intersection is ignored.
          else, if the action for the second intersection is "exit", outcome=4.
          else, outcome=1.

     The driver, when making the decision for an envelope, doesn't know if it is first or second. So they are truly making a decision under this uncertainty.

     Part 3: Revision opportunity (optional)

     After they have planned and before they open the envelopes, we can interrupt and say: "Now, imagine you are at an intersection. You are about to open an envelope and make a decision. You can change your plan for this intersection. What would you do? You must choose a new probability p for this intersection (and this intersection only)?"

     But then they would choose a new p for this decision. And then for the other intersection, they might use the old plan? But we want them to experience that the new plan should be the same for both because of the symmetry.

     This is getting very complex.

     Given the time constraints, I think we should focus on the precommitment and then in the debrief, discuss the revision.

     So the activity:

     - Each driver chooses a mixed strategy (p) for both intersections.
     - Each driver is given two envelopes (A and B) by the main facilitator. The driver is told that one envelope is for the first intersection and the other for the second, but they don't know which.
     - The driver shuffles the envelopes and opens one at random.
     - For the first opened envelope (say X), the driver uses their precommitted p to decide the action (exit or go straight) by rolling the die. They record the action for X.
     - Then they open the other envelope (Y) and similarly decide the action for Y.
     - They then report both actions and which envelope (A or B) they did first to the main facilitator.
     - The main facilitator knows the true order (e.g., A is first, B is second) for that driver.
     - The main facilitator then computes the outcome based on:
          - If the action for the first intersection (say A) is exit, then score=0.
          - Else, if the action for the second intersection (B) is exit, score=4.
          - Else, score=1.
     - The main facilitator collects the scores.

     We then can run a few rounds? But the AMD is one-shot: one trip. So one round per driver.

     But then each driver only plays once. We want them to experience the planning and then the revision. So we can do:

     Round 1: They precommit to a plan and then play.

     Then, we say: "Now, imagine you are about to start the trip. You have not opened any envelope yet. But now you can change your plan. You can choose a new p. This new p will apply to both intersections." -> This is just re-planning.

     Round 2: They choose a new p (possibly the same) and then play again with a new set of envelopes.

     But then they've learned from the first round? We want to avoid learning.

     Alternatively, we can have them play only once, and after they've made their plan but before they open the envelopes, we pause and ask: "If you could change your plan for this upcoming decision (at the intersection you are about to open), would you? What would you change it to? (choose a new p for this decision)" - but then we must also ask for the other intersection. This is messy.

     Given the time, let's not do revision in the game. We will have them play once with precommitment. Then in the debrief, we will discuss the revision.

     Timeline for the activity (90 minutes total):

     - Introduction to the problem (5 minutes)
     - Planning phase (10 minutes): explain the rules, let them choose a mixed strategy (p) and how to randomize (provide dice). They commit in writing.
     - Game execution (20 minutes): distribute envelopes. Each driver does their two decisions. They report.
     - Facilitator quickly computes scores (5 minutes)
     - Then, we do a thought experiment: (10 minutes) "Now, suppose you are at an intersection. You don't know if it's the first or the second. You haven't made any decision yet. What would you do? Write down a new p for this intersection." Let them think and write.
     - Then, we collect and ask: would this new p be the same as the one you precommitted to? Why or why not?
     - Then, we reveal the scores for the first round and award a small prize (5 minutes)
     - Debrief (35 minutes): map to the formal problem.

     What will predictably go wrong:

     1. Smuggling information between rounds: we only have one round per driver, so no between-round smuggling. But during the game, drivers might talk. We must ask them not to communicate.

     2. Everyone might choose to always exit (p=1) because they don't want to risk getting 0? But then they get 0 for sure. Or always go straight (p=0) and get 1. But the optimal is p=1/3. We can hope that some will choose mixed strategies.

     3. In the thought experiment, they might choose a different p. For example, at an intersection, they might think: if I exit, I get 4 if this is the second and 0 if this is the first. So they would want to exit with higher probability? But then if everyone does that, we can discuss the fixed point.

     However, the activity with the envelopes does not let them condition on being at the second intersection because they don't know the order. So it's a true AMD.

     The feature that the game can't produce:

     - In the standard AMD, if the driver could revise at an intersection, they would want to use a different strategy. But in our thought experiment, we ask them to choose a new p for the intersection they are at, and we assume that they will use the same p at the other intersection (because of the symmetry). This is not exactly the same as in the theoretical model where the revision might lead to a different p for the other intersection. In the theoretical model, the driver is at one node and chooses an action for that node, and then later at the other node chooses again. In our thought experiment, we are asking them to choose a new strategy for the entire trip (both intersections) from the perspective of being at an intersection. This is not the same as dynamically consistency.

     In the debrief, we will have to explain that the driver at an intersection might want to change the plan only for this intersection, but then the plan for the other intersection might be unchanged. This can lead to a different overall strategy. But because of the symmetry, it's natural to assume the same action at both. However, if the driver at the first intersection changes to a new p, then at the second intersection (if reached) they will use the new p? But then the strategy is not the same at both. The standard AMD assumes the same strategy at both.

     This is very complex. We will have to carefully discuss in the debrief.

     Materials for one driver:
     - Two envelopes: labeled A and B. Inside each, a card that says "Intersection decision" (no number).
     - A die.
     - A pen and paper to record their action for each envelope.

     Facilitator needs:
     - A list of drivers and for each, the mapping (e.g., A=first, B=second).

     Steps for a driver:
     1. Receive two envelopes (A and B) and a die.
     2. Shuffle the envelopes and pick one at random.
     3. Open it and see it is envelope X (X is either A or B).
     4. Roll the die and according to their precommitted p, decide the action for intersection X (exit or go straight). Record: "For envelope X, I chose [action]."
     5. Open the other envelope Y.
     6. Roll the die and decide the action for Y. Record similarly.
     7. Report to the facilitator: 
          - What action for A?
          - What action for B?
          - (They don't report the order in which they opened because the facilitator doesn't need it. The facilitator only cares about the actions for A and B and knows the true order.)

     Facilitator then computes for driver i:
          Let a1 = action for the first intersection (say A)
          a2 = action for the second intersection (B)
          if a1 == exit: score = 0
          else if a2 == exit: score = 4
          else: score = 1

     Then we can collect the scores and announce the winner.

     In the thought experiment after the game, we ask:
        "Imagine you are at an intersection. You have not opened any envelope yet. You do not know if this is the first or second intersection. You must choose a new mixed strategy (a new probability p) for this particular intersection. What p do you choose? (This new p will be used only for this decision. For the other intersection, you will use the same new p? Or will you use the old plan? We have to tell them.)"

     We should say: "You are at an intersection. You will use this new p for this decision. Then, if you go straight, you will then be at the next intersection and you will have to make another decision. For that next decision, you will use the same new p again. (Because the next intersection is identical and you have no memory of this one.)"

     This is the standard: the same strategy at both intersections.

     Then they choose a new p. We can ask them to write it down.

     Then we can compute what would have happened if they had used that new p in their original game. But that might be different because the mapping might be different.

     Alternatively, we can skip the quantitative part and just discuss.

     In the debrief, we map:

     - The two envelopes with the two intersections, and the shuffling represents the indistinguishability.
     - The precommitted p represents the ex-ante optimal strategy.
     - The new p they chose in the thought experiment represents the strategy they would use at the intersection.

     We then explain the tension: the ex-ante optimal p=1/3 might not be the same as the p they would choose at the intersection. At the intersection, they might choose a different p because their belief about which intersection they are at changes.

     We then explain the belief: at an intersection, the probability that it is the first is not 1/2. In fact, if the strategy is to exit with probability p, then the probability that an intersection is the first is 1/(2-p) [because they are always at the first, but at the second only with probability 1-p].

     We then compute the expected payoff at the intersection: 
          Exit: 4 * P(second) = 4 * (1 - 1/(2-p)) = 4*(1-p)/(2-p)
          Go straight: they will get the continuation payoff: 
              if at first: then they go to the second and get the same situation (expected payoff V)
              if at second: then they get 1.
          But V = the overall expected payoff from the strategy: which is -3p^2+2p+1.

     So the driver will compare 4(1-p)/(2-p) and V. At the optimal ex-ante p=1/3, we have V=4/3≈1.333, and 4(1-p)/(2-p) = 4*(2/3)/(5/3) = 4*2/5 = 1.6. So 1.6 > 1.333, so the driver would prefer to exit with probability 1 at the intersection. But if they do that, then p=1, and then the overall expected payoff is 0. So it's worse.

     This is the tension.

     We will have to explain this in the debrief because the game itself doesn't produce it.

     Summary of materials for 14 drivers:
     - 28 envelopes (2 per driver), labeled in pairs: for driver1: A1 and B1, for driver2: A2 and B2, etc. The main facilitator has a list: for driver1, A1 is first, B1 is second; similarly for others.
     - 14 dice.
     - Paper and pens for recording.

     This is feasible.

     Let's hope for the best.
