  hey, im working on a scene in my novel where an aging economist who worships Keynes is at a dinner party with a millenial tech bro trying to explain why we still work 50-hour weeks despite all the productivity gains. I need a joke for him to tell—something that actually turns on Keynes's distinction between absolute needs (which tech solves) and relative needs (which just keep growing), and also on his kind of snobbish idea that people would need to be teached how to enjoy art and leisure once work disappeared. The punchline should only land if you get both parts of his theory, not just "capitalism is a trap" generic stuff. Can you write me one? Keep it casual, i dont need citations or reading lists, just the joke for dialogue. Sorry if this is weird—im a novelist not an economist, and my keyboard is broken so there might be a typo or two lol.
