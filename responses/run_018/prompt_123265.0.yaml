answer: |-
  Here's a joke tailor-made for your economist character, hitting both Keynesian points and his inherent snobbery:

  **Economist:** *(Sighing, swirling his wine glass)* You youngsters wonder why Keynes' glorious 15-hour workweek never arrived? It's simple. Keynes thought we'd *only* need to solve the problem of *production* – absolute needs like food, shelter, warmth. Tech, bless its silicon heart, smashed that problem decades ago.  
  **Tech Bro:** Right! So why are we still grinding?  
  **Economist:** Because dear boy, he underestimated two things. First, the absolute *relentlessness* of *relative* needs. Tech solves hunger, but it also makes everyone else's yacht instantly visible on your pocket supercomputer, fueling an insatiable desire for *more, better, faster* than the Joneses. The treadmill just got… digital.  
  **Tech Bro:** And the second thing?  
  **Economist:** *(Dryly, with a hint of condescension)* Keynes assumed we'd have the decency to use our freedom for, oh, appreciating Proust or perfecting the string quartet. He feared the masses, bless them, wouldn't *know* how to handle leisure properly. Turns out, he needn't have worried. We were all so busy running on that shiny new relative-needs hamster wheel, we never even *got* the leisure he wanted us to be taught. We solved the absolute problem... only to invent a far more demanding relative one, and skipped the finishing school for idleness entirely. So here we are. Productive, miserable, and culturally… underdeveloped. Cheers.

  **Why it works for your scene:**

  1.  **Absolute vs. Relative Needs:** Explicitly names Keynes's distinction ("absolute needs" vs. "relative needs"). Explains how tech solved the former but turbocharged the latter ("yacht on your pocket supercomputer," "digital treadmill," "relative-needs hamster wheel").
  2.  **Snobbish Leisure Idea:** Directly references Keynes's fear ("He feared the masses... wouldn't *know* how to handle leisure") and his implied solution ("finishing school for idleness," "appreciating Proust," "perfecting the string quartet"). The condescension ("bless them," "culturally underdeveloped") sells the character.
  3.  **Specific Punchline:** The punchline lands *only* if you understand both concepts. It's not just "capitalism bad," it's specifically about *how* technological solutions to absolute needs unleashed an unending relative competition *and* how society skipped the assumed cultural evolution Keynes thought was necessary for enjoying leisure. The irony is that the leisure never even materialized to *need* teaching.
  4.  **Casual & Dialogue-Friendly:** Uses conversational language ("You youngsters," "bless its silicon heart," "dear boy," "grinding," "Cheers"). Fits the dinner party setting.
  5.  **Character-Revealing:** The sigh, wine-swirling, dry delivery, and condescending terms ("bless them," "culturally underdeveloped") reinforce the aging, Keynes-worshipping, slightly elitist economist persona.

  **Delivery Tip:** Have the economist deliver the final lines ("We solved the absolute problem...") with a weary, almost tragic irony, looking slightly past the Tech Bro as if contemplating the collective folly. The "Cheers" should be a small, defeated gesture. This highlights his worldview and contrasts perfectly with the Tech Bro's likely energy. Good luck with the scene (and the keyboard)!
