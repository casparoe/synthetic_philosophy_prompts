              - If you receive a request and you do not have a resource, forward the request to a random neighbor (left or right). But note: you might have already forwarded a request? Then you get another? That's okay.

              - If you receive a resource token (without having sent a request for it), hold onto it until you get a request. Then, if you get a request, follow the rule above (if you have the resource, send it to the requester).

