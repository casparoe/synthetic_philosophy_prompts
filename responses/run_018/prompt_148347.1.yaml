     - We need a way to route resources. We can borrow from ant colony optimization: when a request is sent, it leaves a trail. But we don't have a global map. Instead, we can have each node that forwards a request record the previous node (so the path is built in reverse). Then, when a resource is sent, it follows the reverse path.

