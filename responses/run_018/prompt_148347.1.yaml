              * Does the system seem to be achieving the goal? How?
              * Does the system appear to have a plan?

          - Start the simulation. Run for 15 minutes. The facilitator should walk around and answer any rule questions (by whispering) but not interfere.

     3. Activity Part 2: Observer Reports (15 min)
          - Stop the simulation. Have the nodes freeze and then join the observers in a larger circle (so everyone can hear).
          - Ask the 3 observers one by one: 
              * "Based on what you observed, did the system seem to have one mind? Or was it just a collection of individual minds? Why?"
              * Each observer gets 2 minutes to explain, pointing to specific events.
          - Then, ask the nodes: 
              * "How did it feel to be a node? Did you feel like you were part of a larger mind? Or were you just following rules independently?"

     4. Debrief (25 min)
          - Facilitator-led discussion, drawing on the activity:
              a. Emergence: 
                  * "When we saw a resource being delivered, how did that happen? No one node knew the whole path. It emerged from local interactions."
              b. Philosophical pull:
                  * "Why might we say the system has a mind? Because it solved a problem? Because it adapted?"
