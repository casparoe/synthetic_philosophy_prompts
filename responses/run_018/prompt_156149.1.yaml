  We are designing an exam question for an upper-level graduate course. The topic is the Escrow Agent architecture and whether it avoids the Löbian obstacle.

  The Escrow Agent:
  - Splits reasoning into two registers:
    1. R-slow: Axiomatic, fully self-representing. Uses a formal system that can represent its own proofs.
    2. R-fast: Heuristic, non-representing. Does not have the capacity to represent its own reasoning formally.
  - Design rule: In R-slow, there is a conditional self-trust axiom T: 
        T: □φ → φ   (where □ is the provability predicate for R-slow)
    BUT with a crucial restriction: T is only applied to beliefs that originated in R-slow and never invoked T in their derivation. In other words, T is not applied to any belief that was promoted from R-fast and then derived in R-slow using T.
  - Meta-rule M: A belief from R-fast can be promoted to R-slow only after R-slow has verified the belief without using the axiom T.

  The claim: This architecture avoids the Löbian obstacle because the global trust axiom T is kept outside the formal system that proves it (i.e., T is not used in the derivation of the beliefs that are about the system itself, so Löb's theorem doesn't apply).

  The challenge: We suspect that either the partition collapses (because the boundary condition or M embeds T in R-slow) or the self-trust becomes too weak.

