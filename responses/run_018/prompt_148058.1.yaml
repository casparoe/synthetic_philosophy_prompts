prompt: |-
  I'm the chair of a regional research-grant review panel that evaluates roughly forty proposals per funding cycle across climate science and public-health modeling. Three or four times each cycle, two proposals finish with identical normalized scores on every formal criterion—scientific merit, feasibility, broader impact, budget coherence, and reviewer calibration—after we have eliminated outliers and resolved all disagreements through discussion. The tie is not an artifact of rounding; the panel is genuinely indifferent, and no member can defend ranking one over the other without inventing a distinction. Because applicants may request a written rationale and the funding agency audits our reasoning for consistency, I need a reusable, documented decision procedure I can apply in about ninety minutes per tie, sign off on personally, and defend to both scientists and non-scientist administrators.

  Ground the procedure in the problem of rational choice without preference—Buridan's ass and its modern treatments—but do not treat it as a mere puzzle. I want you to inject and operationalize a distinction that is rarely made in popular accounts: separate axiological indifference (the values genuinely coincide) from epistemic indifference (some distinguishing feature exists but is inaccessible to us given our evaluation constraints). The procedure should include an Arbitrariness Audit that tests whether the tie survives counterfactual adjustments to our information set—for example, if we learned an applicant's institutional affiliation or a hidden methodological detail—before any resolution is attempted.

  Deliver a step-by-step checklist or flowchart-in-words, ordered so that earlier steps filter out spurious ties and later steps handle genuine ones. For each step, specify the test, the decision rule, who on the panel must confirm it, and whether the step eliminates judgment or merely relocates it. Mark explicitly the points where judgment is unavoidable—particularly where we must choose between transparency to applicants and protection of panel confidentiality, and where we must decide whether a randomly resolved tie undermines the legitimacy of the entire evaluation framework.

  Then apply the procedure to three hypothetical cases: (1) two climate-modeling proposals with identical scores, but one relies entirely on open-source code and the other on proprietary software that the panel cannot audit; (2) a tie in which one applicant has a prior award from this same program, a fact that is technically excluded from scoring but is psychologically salient to every panel member; and (3) a tie resolved by a randomization protocol that selects the proposal I personally find methodologically weaker, requiring me to sign the approval.

  Finally, state clearly what the procedure cannot do: which kinds of ties it will misclassify, whether it can eliminate arbitrariness rather than merely manage it, and what ethical or administrative limits prevent it from being fully automated. Do not provide a bibliography, reading list, or citation requests; the procedure must be self-contained and executable by someone with graduate-level scientific literacy but no formal philosophical training.
reasoning: |-
  We are facing a problem of rational choice without preference: two proposals are tied on all formal criteria. We distinguish:
  - Axiological indifference: The proposals are truly equal in value according to our criteria.
  - Epistemic indifference: There might be a distinguishing feature, but we don't have access to it given our constraints.

  We need a procedure that includes an "Arbitrariness Audit" to test whether the tie would break if we had additional information (that we do not currently have or are not allowed to use). The goal is to have a documented, defensible process.

  The procedure will be a step-by-step checklist. For each step:
  - Specify the test and decision rule.
  - Indicate who must confirm it (e.g., the entire panel, the chair, a subcommittee).
  - Note whether the step eliminates judgment or relocates it.
  - Mark points where judgment is unavoidable, especially regarding transparency vs. confidentiality and the legitimacy of randomization.

  After the checklist, we'll apply it to three cases.

  **Checklist for Resolving Ties**

  **Step 0: Precondition**
  - **Test**: Confirm that the tie is genuine. We have normalized scores on all criteria (scientific merit, feasibility, broader impact, budget coherence, reviewer calibration) and have resolved disagreements. The tie is not due to rounding or an error in calculation.
  - **Decision Rule**: If the tie is not genuine, correct the error and re-score. If it is genuine, proceed.
  - **Confirmed by**: Entire panel (by consensus) and the chair (who signs off).
  - **Judgment**: This step eliminates judgment by relying on the formal scoring. However, the consensus that the tie is genuine involves judgment (but it is collective and documented).

  **Step 1: Arbitrariness Audit - Counterfactual Information**
  - **Test**: Consider two types of counterfactual information:
    - (a) Information that is currently available to the panel but was excluded by the evaluation rules (e.g., institutional affiliation, prior awards, details not in the proposal).
    - (b) Information that is not available to the panel but could exist (e.g., hidden methodological details, code that was not shared, or future events).
    For each type, ask: "If we had this information, would it break the tie?"
  - **Decision Rule**:
    - If for (a) the answer is "yes" (i.e., the excluded information would break the tie), then the tie is spurious due to epistemic indifference. We must then decide whether to allow that information to be considered. This is a critical judgment point (see below).
    - If for (a) the answer is "no", then consider (b). If for (b) the answer is "yes", then we are in a state of epistemic indifference (a genuine tie given our constraints). If for (b) the answer is "no", then we are in axiological indifference (the proposals are truly equal).
    - However, note: We cannot actually use the excluded information without violating the rules. So if we determine that (a) would break the tie, we must then decide whether to override the rule. This is a major judgment call.
  - **Confirmed by**: Entire panel (by discussion and vote). The chair leads the discussion and records the outcome.
  - **Judgment**: This step involves judgment in two ways: (1) in imagining the counterfactual, and (2) in deciding whether to use excluded information if it would break the tie. The latter is a critical point of judgment regarding the rules and fairness.

  **Step 2: Handling Spurious Ties (Epistemic Indifference Due to Excluded Information)**
  - **Test**: If Step 1(a) revealed that excluded information would break the tie, we must decide whether to incorporate that information.
  - **Decision Rule**:
    - If the information is not allowed by the agency's rules (e.g., prior awards are explicitly excluded), then we cannot use it. We must treat the tie as genuine (epistemic indifference) and proceed to Step 3.
    - If the information is not explicitly excluded and is deemed relevant and fair to consider (e.g., a methodological detail that was omitted by the applicant but is critical to feasibility), we may choose to re-open discussion and adjust scores. However, note that this may require re-evaluation and might not be feasible in 90 minutes. Therefore, this option is only taken if the panel agrees that the information is crucial and the adjustment can be done quickly and fairly.
    - If we decide not to (or cannot) use the information, then we treat the tie as genuine (epistemic indifference) and proceed to Step 3.
  - **Confirmed by**: Entire panel, with the chair having the final say if there is a split vote.
  - **Judgment**: High judgment. We are balancing the rules against the desire to break the tie fairly. Also, we must consider the risk of introducing bias and the precedent it sets. This step may require a vote and must be documented.

  **Step 3: Resolving Genuine Ties (Axiological or Epistemic Indifference)**
  - **Test**: We now have a tie that we cannot break with the available information (either because the proposals are truly equal or because we lack the necessary information). We must resolve it.
  - **Decision Rule**: The tie is resolved by a pre-specified, fair randomization protocol. Examples:
    - Flip a coin (publicly, in the panel meeting).
    - Draw a lot (e.g., from a hat).
    - Use a random number generator (with a seed that can be recorded and verified).
    The key is that the method is random and the outcome is accepted as final.
  - **Confirmed by**: Entire panel witnesses the randomization. The chair executes the randomization and records the outcome.
  - **Judgment**: The choice of the randomization method is a judgment made in advance (by the panel or the agency). The outcome is arbitrary but fair in the absence of distinguishing criteria.

  **Step 4: Documentation and Rationale**
  - **Test**: Prepare the written rationale for the decision, which will be part of the record and may be shared with applicants or auditors.
  - **Decision Rule**:
    - If the tie was broken by Step 2 (using excluded information), document the information used and the justification for departing from the standard rules.
    - If the tie was broken by randomization (Step 3), document the process and emphasize that the proposals were tied on all criteria and the random selection was the only fair way to decide.
    - In both cases, include a summary of the Arbitrariness Audit and the panel's reasoning.
  - **Confirmed by**: The chair writes the rationale and shares it with the panel for comment. The chair then signs off.
  - **Judgment**: Judgment is required in writing the rationale to balance transparency and confidentiality. For example, if the tie was broken by excluded information that is confidential (like a prior award), we must decide how much to disclose. The rule: disclose as much as possible without violating confidentiality rules or creating unfairness.

  **Step 5: Chair's Final Sign-off**
  - **Test**: The chair reviews the entire process to ensure it was followed correctly and that the documentation is complete.
  - **Decision Rule**: If the process was followed, the chair signs. If not, the chair may send it back for rework (but within the time constraint).
  - **Confirmed by**: Chair only.
  - **Judgment**: The chair must exercise judgment in ensuring the integrity of the process.

  **Critical Judgment Points**:
  1. **Step 1**: Deciding whether excluded information (if it would break the tie) should be used. This involves a trade-off between breaking the tie fairly and adhering to the rules. It also might involve transparency (if we use it, we must document) vs. confidentiality (if the information is sensitive).
  2. **Step 2**: Deciding whether to re-open evaluation to include new information. This is time-constrained and may not be feasible.
  3. **Step 4**: Writing the rationale. We must decide how much to disclose, especially if the information used is confidential or if the randomization might be perceived as undermining the evaluation's legitimacy.
  4. **Legitimacy of Randomization**: The panel must accept that in genuine ties, randomization does not undermine the framework. It is a fair way to decide when there is no rational basis for choice.

  **Applying the Procedure to Hypothetical Cases**

  **Case 1: Two climate-modeling proposals (one open-source, one proprietary)**
  - Step 0: Tie confirmed on all criteria.
  - Step 1: Arbitrariness Audit.
    - (a) Excluded information: The panel knows about the open-source vs. proprietary issue but did not score it because it wasn't a criterion. Would it break the tie? Likely yes, because open-source might be seen as having a broader impact (reproducibility) and maybe feasibility (if the proprietary software is expensive or restrictive). However, the rules did not include this as a criterion. We cannot use it without violating the rules? 
      - But note: broader impact and feasibility are criteria. If the panel feels that the open-source nature significantly enhances broader impact (e.g., by enabling replication) or feasibility (e.g., avoiding license costs), then they might argue it should have been considered under existing criteria. However, if the panel did not originally factor it in, then we are in Step 1(a) and the information was excluded by the panel's own evaluation (but it was available). 
      - We must decide: can we now adjust the scores under the existing criteria? This would be a re-evaluation. 
      - Alternatively, the panel might decide that the distinction was not significant enough to break the tie. 
    - (b) Unavailable information: The panel cannot audit the proprietary code. If they could, it might reveal flaws (breaking the tie) or not. But they can't, so this is epistemic indifference.

    Let's assume the panel decides that the open-source vs. proprietary issue is significant and should have been considered under broader impact and feasibility. Then we go to Step 2.

  - Step 2: We decide to incorporate this information. We adjust the scores for broader impact and feasibility? But note: the panel had already scored these and found them tied. So unless they re-evaluate, they cannot change the scores arbitrarily. Therefore, we must re-open discussion and re-score. This might break the tie. But if after re-scoring the tie remains, then we proceed to Step 3.

    Alternatively, if the panel decides not to re-score (due to time or because it's not allowed by the rules), then we treat the tie as genuine and go to Step 3.

    For this case, let's assume the panel re-scores and the tie breaks in favor of the open-source proposal. Then we document that.

    But if the panel decides not to re-score (or re-scores and the tie remains), then we proceed to randomization.

  **Case 2: Tie with one applicant having a prior award (excluded from scoring but psychologically salient)**
  - Step 0: Tie confirmed.
  - Step 1: Arbitrariness Audit.
    - (a) Excluded information: The prior award. Would it break the tie? Probably yes, because panel members might favor the prior awardee (or disfavor, if they feel the awardee has had enough). But the rules exclude it. So we cannot use it without violating the rules.
    - (b) Unavailable information: None relevant here.

    The panel must decide: even though the prior award would break the tie, they are not allowed to use it. Therefore, they do not incorporate it. The tie remains.

  - Step 2: We decide not to use the excluded information. Proceed to Step 3.

  - Step 3: Resolve by randomization.

  - Step 4: In the rationale, we do not mention the prior award. We state that the proposals were tied on all criteria and the decision was made by random selection.

  **Case 3: Tie resolved by randomization, but the chair personally disagrees**
  - The procedure is followed: Steps 0-3 lead to randomization.
  - The randomization selects the proposal the chair finds weaker.
  - Step 4: The chair must document the process and sign.
  - Step 5: The chair signs, despite personal disagreement, because the process was followed and the outcome is a result of a fair procedure.

  **What the Procedure Cannot Do**

  1. **Misclassification of Ties**: 
     - It might misclassify a tie as axiological when in fact there is a distinguishing feature that the panel failed to imagine in the counterfactual (Step 1b). 
     - It might also misclassify a tie as epistemic (due to unavailable information) when in fact the proposals are truly equal (axiological). This is unavoidable because we cannot know what we don't know.

  2. **Eliminating Arbitrariness**: 
     - The procedure does not eliminate arbitrariness; it manages it by making the process transparent and fair. Randomization is arbitrary but fair in the absence of reasons.

  3. **Ethical and Administrative Limits**:
     - **Time**: The 90-minute constraint limits how deeply we can re-evaluate or gather new information.
     - **Confidentiality**: We cannot disclose certain information (e.g., prior awards) in the rationale, which may lead to incomplete transparency.
     - **Human Bias**: Judgment calls (like in Step 2) may be influenced by unconscious biases.
     - **Full Automation**: We cannot fully automate because:
       - The Arbitrariness Audit requires human imagination and judgment to consider counterfactuals.
       - The decision to use excluded information requires ethical and rule-based reasoning.
       - Writing the rationale requires nuanced communication.

  The procedure provides a structured way to handle ties, but it relies on the panel's integrity and the chair's leadership. It ensures that arbitrariness is minimized where possible and managed transparently when unavoidable.
answer: |-
  ### Tie-Resolution Procedure for Grant Review Panels  
  **Grounding**: This procedure distinguishes *axiological indifference* (proposals are truly equal in value) from *epistemic indifference* (a distinction exists but is inaccessible due to evaluation constraints). It prioritizes transparency, auditability, and defensibility while minimizing arbitrary judgment. The **Arbitrariness Audit** tests if a tie would break under counterfactual information (e.g., hidden details or excluded factors), filtering spurious ties before resolution.  

  **Time Allocation**: 90 minutes per tie (max).  
  **Personnel**: Panel chair (final authority), full panel (consensus/vote where specified).  
  **Output**: Written rationale for the decision, signed by chair, auditable by funding agency.  

  ---

  ### Step-by-Step Checklist  
  **Order**: Steps 1–3 filter spurious ties; Steps 4–6 resolve genuine ties.  

  #### **Step 1: Confirm Genuine Tie**  
  - **Test**: Verify identical normalized scores across all criteria (scientific merit, feasibility, broader impact, budget coherence, reviewer calibration) after outlier removal and discussion. Ensure no rounding errors or unresolved disagreements.  
  - **Decision Rule**: If not identical, return to scoring; if identical, proceed.  
  - **Confirmed by**: Full panel (consensus).  
  - **Judgment**: Eliminates scoring errors. *No unavoidable judgment here*.  

  #### **Step 2: Arbitrariness Audit (Counterfactual Test)**  
  - **Test**: Assess whether the tie would break if new information were available:  
    - *Category A*: **Excluded but knowable information** (e.g., institutional affiliation, prior awards, non-public biases).  
    - *Category B*: **Inaccessible information** (e.g., unaudited software code, unreported methodological flaws).  
    For each category, ask: *"Would this information break the tie if revealed?"*  
  - **Decision Rule**:  
    - If *Category A* would break the tie → **Epistemic indifference (spurious tie)**. Proceed to Step 3.  
    - If *Category B* would break the tie → **Epistemic indifference (genuine tie given constraints)**. Proceed to Step 4.  
    - If neither would break the tie → **Axiological indifference (genuine tie)**. Proceed to Step 4.  
  - **Confirmed by**: Full panel (majority vote).  
  - **Judgment**: Relocates judgment to panel’s collective reasoning about counterfactuals. *Unavoidable judgment in interpreting "would break" (requires panel’s best estimate)*.  

  #### **Step 3: Handle Spurious Tie (Epistemic Indifference from Excluded Information)**  
  - **Test**: Determine if excluded information (*Category A*) should be incorporated. Balance:  
    - Rules (is the information prohibited by agency policy?).  
    - Fairness (would using it create bias or inconsistency?).  
    - Transparency (can it be disclosed in the rationale?).  
  - **Decision Rule**:  
    - If information is **prohibited by policy** (e.g., prior awards excluded by rules) → **Reject incorporation**. Treat as genuine tie (proceed to Step 4).  
    - If information is **permitted and material** (e.g., methodological detail affecting feasibility) → **Adjust scores** and re-test for tie (return to Step 1).  
    - If information is **permitted but immaterial** or incorporation is infeasible in 90 min → **Reject incorporation**. Treat as genuine tie (proceed to Step 4).  
  - **Confirmed by**: Full panel (majority vote), chair finalizes.  
  - **Judgment**: *Unavoidable judgment in balancing transparency vs. confidentiality*. E.g., disclosing institutional affiliations may breach fairness; omitting them may reduce transparency.  

  #### **Step 4: Resolve Genuine Tie (Axiological or Epistemic Indifference)**  
  - **Test**: Choose a resolution method. Options:  
    - **Random selection** (e.g., lottery, coin toss).  
    - **Tiebreaker criterion** (e.g., alignment with agency’s annual priority, if predefined).  
  - **Decision Rule**:  
    - If a **predefined tiebreaker criterion** exists → Apply it.  
    - Else → Use **random selection** (documented and witnessed).  
  - **Confirmed by**: Chair executes; full panel witnesses.  
  - **Judgment**: Relocates judgment to method selection. *Unavoidable judgment in accepting randomness as legitimate*.  

  #### **Step 5: Document Rationale**  
  - **Test**: Draft written justification covering:  
    - Outcome of Arbitrariness Audit (Step 2).  
    - Reasons for incorporating/rejecting information (Step 3, if applicable).  
    - Resolution method and outcome (Step 4).  
  - **Decision Rule**: Disclose all non-confidential reasoning. Omit panel deliberations or prohibited details.  
  - **Confirmed by**: Chair drafts; panel reviews for accuracy.  
  - **Judgment**: *Unavoidable judgment in balancing transparency (to applicants) vs. confidentiality (of panel dynamics)*.  

  #### **Step 6: Chair Sign-off and Audit Trail**  
  - **Test**: Chair verifies procedure compliance and signs rationale.  
  - **Decision Rule**: If compliant → Approve. If non-compliant → Re-run or void.  
  - **Confirmed by**: Chair only.  
  - **Judgment**: Eliminates procedural arbitrariness. *No unavoidable judgment if process followed*.  

  ---

  ### Application to Hypothetical Cases  
  #### **Case 1: Climate-modeling proposals (open-source vs. proprietary software)**  
  - **Step 1**: Tie confirmed.  
  - **Step 2 (Arbitrariness Audit)**:  
    - *Category A*: Panel knows software type but excluded it from scoring (not a formal criterion). Counterfactual: If audited, proprietary software might reveal feasibility risks (e.g., license costs) or broader impact limits (e.g., reproducibility). **Would break tie?** Yes (epistemic indifference).  
    - *Category B*: Panel cannot audit proprietary code. If audited, might reveal flaws. **Would break tie?** Yes (epistemic indifference).  
  - **Step 3**: Software type is **permitted and material** (feasibility/broader impact criteria exist). Panel re-scores: Open-source proposal gains in feasibility/broader impact. Tie broken; open-source wins.  
  - **Rationale**: "Tie resolved via re-scoring; open-source software enhanced feasibility and broader impact under original criteria."  

  #### **Case 2: Tie with prior award (excluded but psychologically salient)**  
  - **Step 1**: Tie confirmed.  
  - **Step 2 (Arbitrariness Audit)**:  
    - *Category A*: Prior award is excluded by rules. Counterfactual: If considered, panel might favor/disfavor the applicant. **Would break tie?** Yes (epistemic indifference).  
  - **Step 3**: Prior award is **prohibited by policy**. Reject incorporation. Treat as genuine tie.  
  - **Step 4**: No predefined tiebreaker → Random selection (e.g., lottery). Applicant without prior award wins.  
  - **Rationale**: "Tie confirmed after audit; resolved by random selection per Section 4.2 of panel guidelines."  

  #### **Case 3: Randomization selects weaker proposal (chair’s view)**  
  - **Steps 1–3**: Tie confirmed as genuine (e.g., no counterfactual breaks tie).  
  - **Step 4**: Random selection chooses proposal chair deems weaker.  
  - **Step 5**: Rationale documents process: "Proposals tied on all criteria; winner selected via verified random number generator (seed: [recorded])."  
  - **Step 6**: Chair signs despite disagreement. **Legitimacy test**: Randomness is fair when no distinctions exist; overriding it would introduce bias.  

  ---

  ### What the Procedure Cannot Do  
  1. **Misclassification Risks**:  
     - **False negatives**: May treat *epistemic indifference* as *axiological* if panel underestimates counterfactual distinctions (e.g., overlooked methodological risks).  
     - **False positives**: May treat *axiological indifference* as *epistemic* if panel overimagines counterfactuals (e.g., assuming hidden flaws without evidence).  

  2. **Arbitrariness Management**:  
     - Does **not eliminate arbitrariness**; makes it explicit and auditable. Randomization arbitrariness is unavoidable in genuine ties but defensible as "fair chance."  

  3. **Ethical and Administrative Limits**:  
     - **Confidentiality**: Cannot disclose panel deliberations or prohibited data (e.g., reviewer identities) in rationales.  
     - **Subjectivity**: Judgment required in Steps 2–3 (counterfactuals, transparency trade-offs) cannot be fully automated.  
     - **Time**: Cannot incorporate complex new evidence in 90 minutes (e.g., auditing software).  
     - **Legitimacy**: Cannot resolve disputes about randomization undermining the system; this requires panel’s collective buy-in.  

  **Final Note**: This procedure manages—but cannot erase—indifference. It ensures ties are resolved systematically, not whimsically, preserving the evaluation framework’s integrity.
