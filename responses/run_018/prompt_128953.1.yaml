answer: |-
  ## Opening Address: Accountability Without Scapegoating

  **(Approx. 10 minutes spoken)**

  Good morning, everyone. Welcome. Before we dive into the profound work of “Accountability Without Scapegoating,” I need to share a spark that ignited late last night – a spark I believe is essential fuel for our day. Just hours ago, a colleague and I were locked in a… let’s call it a *vigorous* but deeply respectful debate. It centered on hypocrisy, blame, and the very ground we stand on when we call others to account.

  The specific moment that crystallized it? My friend asked, point-blank: “If a judge, presiding over an environmental violation case, is discovered to have flagrantly violated the very same emissions regulations in their own life… can that judge still render a *correct* verdict? Or has their hypocrisy stripped them of the *authority* to deliver that verdict at all?”

  It’s a deceptively simple question. But it cuts to the heart of what we’re exploring today. It forced us – and now, I hope, it will force *us* – to wrestle with a distinction I believe is crucial, though I present it humbly for your testing: the difference between **standing to blame** and **standing to accuse**.

  Let me try to unpack that.

  1.  **Standing to Blame:** This, I suggest, is fundamentally *relational*. It’s about being connected to a wrong, having a stake, an interest, or a role that entitles you to *hold someone answerable*. It’s rooted in the reality of the harm, the breach of a shared norm or agreement, and your legitimate connection to it. When the small factory violates emissions standards, poisoning the air *we all breathe*, the community affected, the regulatory body tasked with protecting the commons – they arguably have "standing to blame." They have the right to say, "This happened. It caused harm. We need to understand why, and what repair looks like." This standing isn't necessarily erased by their own flaws. Can a parent who struggles with anger still legitimately ask their child to account for bullying? Can a community group that’s made mistakes still demand a corporation answer for dumping toxins? Standing to blame asks: *Are you connected? Do you have a legitimate interest in the answer?*

  2.  **Standing to Accuse:** This, I propose, is more *performative*. It claims a higher ground, a position of moral cleanliness or unquestioned authority from which to pronounce a definitive verdict. It’s less about demanding an *answer* and more about delivering a *sentence*. It adopts the grammar of finality and purity: "We are the righteous. You are the guilty. This is the judgment." This is where hypocrisy bites hardest. If that city government, fining the small factory for emissions, has its *own* waste contract in flagrant breach… how can it stand there and *accuse*? How can it claim the mantle of pure enforcer? Its own record becomes immediately relevant, not just as a distraction, but as a direct challenge to the *performance* of moral authority. Standing to accuse demands: *Are you clean? Are you beyond reproach yourself?*

  **Why does this matter here? Why today? Because this distinction isn't academic wordplay; it reshapes the very possibility space in restorative settings.**

  Think about our organizers here, facilitating circles where an institution – a school, a corporation, a government agency – sends a representative to acknowledge harm. Perhaps harm caused by predecessors, or by systemic forces the current representative didn't personally enact. Can that institution speak?

  *   If it attempts to *accuse* – to adopt the grammar of pure judgment, positioning itself as the unimpeachable voice of righteousness – it invites immediate scrutiny of its own record. "How dare *you* speak like this?" Hypocrisy accusations erupt, derailing the process, breeding resentment, potentially paralyzing any forward movement. The demand for its own moral purity becomes paramount, often impossible to meet.
  *   But if it speaks from a position of *standing to blame* – grounded in the reality of the harm caused by its structure or history, acknowledging its own entanglement and fallibility – the path changes. It might say: "We recognize this harm flowed from systems we are part of. We lament it. We have our own failures we are working on. But this specific harm *happened*, and we are responsible *in relation to it*. We need to understand its impact and work *with you* towards repair." Here, the focus stays on the harm, the need for answerability, and the shared, messy work of repair. Its own flaws aren't irrelevant, but they become part of the complex context, not an automatic disqualifier.

  This is the fork in the road. **Does hypocrisy nullify the very *substance* of blame – the truth that a wrong occurred and needs addressing? Or does it primarily transform the *grammar* – the way blame can be voiced, the position from which we speak, forcing us to shed the robes of the pure accuser?**

  This question won't be resolved in ten minutes. It shouldn't be. It needs to permeate our day.

  *   For our philosophers: How robust *is* this distinction? Does it hold water under scrutiny? How does it interact with concepts of power, complicity, and collective responsibility?
  *   For our legal practitioners: How do procedural frameworks enable or foreclose these different modes of speaking? How do we build processes that facilitate answerability without demanding impossible moral purity?
  *   For our organizers: What have you seen in the circle? When has an institution's flawed standing paralyzed the process? When has an acknowledgement of shared imperfection actually *enabled* genuine repair? What language works?

  So, as we move into our panels and discussions, I leave you with the question that kept my colleague and I talking long past midnight, the question that should frame our collective inquiry today:

  **"When we demand accountability – especially from positions of power or within flawed institutions – are we exercising a relational 'standing to blame' that calls forth an answer, or are we claiming a performative 'standing to accuse' that demands our own moral cleanliness? And how does that choice determine what can actually be *said*, heard, and repaired?"**

  Let’s explore this tension together. The day is yours. Thank you.
