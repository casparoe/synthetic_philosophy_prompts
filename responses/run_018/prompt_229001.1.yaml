prompt: |-
  I am a graduate student in international relations, and I have followed my supervisor's public positions on military intervention for years. Her track record:

  1. Kosovo, 1999 — she supported NATO's bombing campaign despite the absence of Security Council authorization, describing it at the time as unlawful but justified.
  2. Iraq, 2003 — she opposed the invasion from the outset, arguing that the humanitarian case was retrospective: Saddam Hussein's worst crimes were years in the past, and there was no acute emergency in 2003 that war could halt.
  3. Libya, 2011 — she supported the initial intervention to protect Benghazi under the Security Council's mandate, but publicly broke with the operation once it became a campaign for regime change, which she argued exceeded and discredited the mandate's logic.
  4. Rwanda, 1994 — she maintains, retrospectively, that outside powers were obligated to intervene, authorization or not.
  5. Syria, 2013 — she opposed punitive airstrikes after the chemical weapons attacks, on the grounds that the attacks were over and the proposed strikes would neither protect civilians nor remain limited.

  A colleague and I are drafting a briefing note on a new case and want to predict where she will land. The Republic of Kessovia's army and allied militias have killed several thousand members of the Hadri minority and driven roughly 400,000 across the border; whether this amounts to genocide is contested. The Security Council is deadlocked by a certain veto. The regional organization has voted to intervene and can field a capable force. Military planners judge that protecting the border enclaves where most Hadri have fled is feasible at low cost, but that halting the killing throughout Kessovia would very likely require removing the regime — and the regime's patron, a nuclear-armed neighbor, has warned that regime change would bring it into the war.

  Please do the following. First, identify at least two distinct decision rules that are each consistent with all five of her past verdicts, and state plainly what each rule predicts for both the limited enclave-protection operation and the expanded operation that would remove the regime. Second, give your best prediction of her verdict on each operation, and explain which rule you take her actually to be running and why her record favors it. Third, if you find that her past verdicts genuinely underdetermine either prediction, say which single feature of the Kessovia case is doing the most work. Finally, describe the further hypothetical case — one that could plausibly arise — that would best discriminate between the two leading candidate rules.
reasoning: |-
  Hmm, the user is a graduate student in international relations seeking help analyzing their supervisor's position on military interventions. They've provided five detailed case studies showing her positions on past military interventions: Kosovo, Iraq, Libya, Rwanda, and Syria. Now they're trying to predict how she'll view a hypothetical situation in Kessovia involving potential genocide and two intervention options.

  The key here is to identify consistent patterns in her past decisions. Looking at her track record: she supported Kosovo (unlawful but justified), opposed Iraq (no acute emergency), supported Libya initially but opposed regime change, believes Rwanda should have been intervened in regardless of authorization, and opposed Syria strikes (no protective purpose).

  For Kessovia, there are two potential operations: a limited enclave protection mission and a full regime change operation. I need to identify at least two distinct decision rules that explain all her past positions.

  Possible decision rules could be:

  1. "Last Resort/Immediacy" rule: Focuses on acute emergencies and whether force is the only immediate option to prevent ongoing atrocities.

  2. "Authority/Purpose" rule: Emphasizes legitimacy of authorization and alignment with humanitarian purpose without mission creep.

  For Kessovia prediction, I think she'd support the enclave protection (feasible, protective, regional authorization) but oppose regime change (escalation risk, mission creep, no authorization). The Authority/Purpose rule seems to fit best with her Libya position where she broke over regime change.

  The most decisive feature in Kessovia is the regional organization's authorization for protection - this bridges her Kosovo (unauthorized but justified) and Rwanda (should have intervened regardless) positions.

  To distinguish between the two rules, I'd propose a hypothetical where there's an acute emergency but no authorization versus a questionable emergency with strong authorization. That would test whether immediacy or authority carries more weight in her framework.

  This analysis should help the student understand their supervisor's underlying principles while respecting the complexity of humanitarian intervention decisions.
answer: |-
  Based on your supervisor's track record, here's the analysis:

  ### Two Consistent Decision Rules
  1.  **Rule 1: Threshold of Suffering + Feasible Protection (SFP Rule)**  
      *   **Core Logic:** Intervention is justified *only* when: (a) There is an **acute, ongoing mass atrocity** (genocide, large-scale slaughter, imminent massacre) creating an overwhelming humanitarian imperative; *and* (b) Military action is **feasible**, **limited** in scope to **directly halting or preventing** that specific atrocity or protecting vulnerable populations, with a reasonable chance of success and low risk of catastrophic escalation/civilian harm; *and* (c) There is **no viable non-military alternative** available in the timeframe required. Authorization is desirable but secondary to the moral imperative if (a) and (b) are strongly met. Opposition to regime change stems from its infeasibility, excessive cost, and deviation from the core protective goal.
      *   **Kessovia Prediction (Enclave Protection): SUPPORT.** The ongoing killing/displacement meets the acute suffering threshold (potentially genocide-level). Protecting the enclaves is feasible, low-cost, directly protective of a specific vulnerable population (the 400k refugees), and has a clear, limited goal. Regional authorization adds legitimacy. The acute emergency overrides the lack of UNSC approval.
      *   **Kessovia Prediction (Regime Change): OPPOSE.** While the initial atrocity threshold is met, removing the regime is deemed infeasible ("very likely require") and catastrophically escalatory (nuclear-armed patron involvement). It shifts from *protection* to *political transformation*, exceeding the limited, feasible mandate needed to address the acute emergency. The risk/cost vastly outweighs the protective benefit.

  2.  **Rule 2: Mandate Legitimacy & Constraint (MLC Rule)**  
      *   **Core Logic:** Intervention requires **legitimate authority** (UNSC ideally, but a strong regional mandate *can* suffice, especially if the UNSC is paralyzed unjustly). Crucially, the **mandate's purpose and scope must be strictly adhered to**. The mandate's legitimacy is derived from its narrowly defined **humanitarian-protective objective**. Deviation from this mandate (especially into regime change) destroys its legitimacy and justification, regardless of the original cause. Preventive action requires a *very* high and clear threshold of *imminent* catastrophe.
      *   **Kessovia Prediction (Enclave Protection): SUPPORT.** The regional mandate (legitimate substitute for deadlocked UNSC) authorizes a *protective* operation ("protecting border enclaves"), aligning with the core humanitarian goal. The operation is feasible and stays within the mandate's defined scope.
      *   **Kessovia Prediction (Regime Change): OPPOSE.** This fundamentally changes the mandate's purpose from protection to political overthrow. It explicitly exceeds the authorized scope ("exceeded and discredited the mandate's logic" - Libya precedent). Lacks any legitimate authorization and invites catastrophic escalation.

  ### Best Prediction & Explanation
  *   **Enclave Protection Operation: SUPPORT**
  *   **Regime Change Operation: OPPOSE**

  **Which Rule She's Running:** The **Mandate Legitimacy & Constraint (MLC) Rule** provides the most coherent and consistent explanation of her *entire* record.

  *   **Kosovo (1999):** Supported despite lack of UNSC authorization. *MLC Explanation:* The extreme, ongoing emergency (Kosovo) met the threshold where legitimate authority *could* be found elsewhere (NATO acting as regional body), *but* she explicitly noted its unlawfulness, showing the importance of legitimate authority. The *purpose* was limited (halting ethnic cleansing), not regime change per se.
  *   **Iraq (2003):** Opposed. *MLC Explanation:* Lacked legitimate authorization (UNSC refusal). Crucially, the *purpose* shifted from WMD (the stated mandate) to retrospective humanitarianism, which was not the authorized or imminent justification. No acute emergency existed *at the time of intervention* to override the lack of mandate.
  *   **Libya (2011):** Supported initial intervention, opposed regime change. *MLC Explanation:* Directly illustrates the rule. Supported under UNSC mandate (legitimate authority) for protection (legitimate purpose). Broke when the operation exceeded the mandate's protective scope to pursue regime change, destroying its legitimacy.
  *   **Rwanda (1994 - retrospective):** Supports intervention. *MLC Explanation:* The extreme, ongoing genocide created such an overwhelming emergency that the *moral imperative* overrode the lack of authorization. However, the *feasible, protective purpose* (halting the slaughter) was clear and achievable early on. This is the exception proving the rule – authorization is crucial, but an atrocity of this magnitude and imminence creates a paramount obligation.
  *   **Syria (2013):** Opposed airstrikes. *MLC Explanation:* Lacked legitimate authorization (UNSC deadlock, no strong regional mandate cited). The *purpose* (punishment/deterrence) was disconnected from *protection* – the attacks were over, and the strikes wouldn't protect civilians or likely remain limited. No feasible, protective goal was being served within a legitimate mandate.

  **Why MLC Fits Best:** Her Libya position is the clearest articulation of her core principle: a mandate's legitimacy is contingent on strict adherence to its *defined protective purpose*. Deviation destroys justification. Kosovo and Rwanda show that extreme, *ongoing* emergencies can sometimes override the authorization requirement, but the *purpose* must still be tightly focused on halting the specific atrocity (protection, not regime change). Iraq and Syria show consistent opposition where authorization is absent *and* the purpose is misaligned with an acute protective need. The MLC rule seamlessly integrates all these elements: the primacy of legitimate mandate + strict adherence to protective scope + authorization override only for extreme, ongoing atrocities where protection is feasible and the core goal.

  ### The Key Underdetermining Feature in Kessovia
  The most significant feature working to *underdetermine* the prediction, especially regarding enclave protection, is the **"contested" nature of whether the situation constitutes genocide**. Her Rwanda stance suggests genocide creates a paramount obligation overriding authorization. If she concludes the Kessovia atrocities *do* meet the genocide threshold (or an equivalent level of acute, ongoing slaughter), her support for enclave protection becomes very likely under *either* rule. If she concludes it *does not* meet that threshold, her Kosovo/Rwanda precedent for overriding authorization becomes less compelling, potentially weakening (though not necessarily eliminating) her support rationale under the SFP rule. The MLC rule, with its regional mandate, provides a stronger basis for support even if genocide isn't definitively established, provided the protective purpose is clear and the emergency is severe.

  ### Discriminating Hypothetical Case
  **The Hypothetical:** *Country X: A brutal, non-nuclear-armed dictator is actively conducting a campaign of mass murder against an ethnic group, widely recognized as genocide by international bodies. Satellite imagery and defector reports confirm death squads systematically clearing villages daily. The UNSC is deadlocked by a veto from the dictator's ally. A capable regional organization (e.g., African Union) debates intervention. Military planners confirm that precision airstrikes *only* against the death squad bases and command centers are highly feasible and would very likely halt the killing within days with minimal collateral risk. However, the dictator remains firmly entrenched in the capital, and removing him would require a large-scale invasion opposed by the regional body. The regional mandate being debated is strictly limited to authorizing airstrikes against the death squads to halt the genocide.*

  *   **SFP Rule Prediction:** **STRONG SUPPORT.** The acute, ongoing genocide (threshold met). The intervention is highly feasible, limited (only targets death squads), directly halts the killing (protective purpose achieved), low risk, no non-military alternative. Authorization is secondary to the extreme emergency and clear protective feasibility.
  *   **MLC Rule Prediction:** **AMBIGUOUS/CAUTIOUS SUPPORT, CONTINGENT ON MANDATE.** The genocide creates a paramount obligation (like Rwanda). *If* the regional organization issues a clear mandate authorizing *only* the limited airstrikes for the purpose of halting the genocide, support is likely (like Libya initial phase, with regional mandate substituting for UNSC). However, *without* that specific regional mandate, support is unlikely despite the genocide – the lack of legitimate authority remains a major barrier absent the mandate. The rule prioritizes the mandate's legitimacy *alongside* the emergency.

  **Why it Discriminates:** This case isolates the role of authorization when the SFP criteria (acute suffering, feasible protection) are *maximally* met. The SFP rule, prioritizing consequences and feasibility, would strongly support intervention even *without* a regional mandate, driven by the overwhelming genocide and precise solution. The MLC rule, prioritizing legitimate process and mandate, would likely *withhold* support *without* the mandate, viewing the lack of authority as disqualifying despite the moral imperative (unless the genocide is seen as uniquely overriding, as in Rwanda). The presence or absence of the regional mandate becomes the critical factor for the MLC rule, while it's merely helpful but not essential for the SFP rule in this extreme scenario. Your supervisor's position here would reveal whether legitimate process (MLC) or consequences/necessity (SFP) is her ultimate anchor when both are in tension.
