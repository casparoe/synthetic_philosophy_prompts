prompt: |-
  I've been arguing with my roommate about illusionism — you know, that view where phenominal consciousness is basically an illusion we tell ourselves about, like some modern philosophers have pushed. I'm taking a course on phil of mind and we just went over Brentano's intetionality thesis, which I still find slippery. Anyway, my TA threw out this weird hypothetical: imagine artificial entities called simmballs running on a substrate named careenium. They behave like they're in pain and generate all the correct symbolic outputs, but it's just syntax pushing around with no real inner light.

  Since Brentano died long before AI or illusionism became big topics, I'm curious what he'd actually think about these simmballs. Would he say they lack consciousness entirely because there's no genuine intentional object being presented? Or would he argue that if the system genuinely directs mental acts toward pain-states then phenominal consciousness must be present — illusion or not? I don't want a reading list or citations, just reasoning through his actual framework applied to this strange case.
