  Here’s the poem, tracking the ice, the dates, and the unresolved ache:

  **Bridgewater, '87 (or '89)**

  **(Voice 1: The Town)**
  We marked it 'eighty-seven's cruel end,
  When ice, thick-fingered, gripped the river’s bend,
  And groaned beneath the old steel truss and span.
  *Before* the New Year peeled its brittle skin.
  We felt the tremor deep in Basement Gin,
  Saw Mrs. Kowalski’s gloved hand tightly span
  Her boy’s small shoulder, trembling at the sound.

  **(Voice 2: The Record)**
  Municipal ledgers state: December ninth,
  'Eighty-nine. Ice load *exceeded* rated might,
  Stress fractures bloomed where inspections found
  No flaw. Causation: physics, pure and stark.
  A structural failure in the gathering dark,
  No moral weight within the frozen ground.
  The river froze; the brittle girders broke.

  **(Voices Merge)**
  Ice gripped the struts. Ice clawed the aging stone.
  The ledger blames the ice, the winter's moan.
  We blame the ice that *knew* the weak design,
  The ice that *heard* the old weld start to whine
  Like Mrs. K.’s low cry. That frozen chime
  Still marks the debt we feel across the years,
  The cause they trace through graphs, absolving gears.
  **The river remembers.**
  **The river remembers.**

  ---

  **Why it fits:**
  *   **Concrete Details:** Ice, Mrs. Kowalski (gloved hand, cry), the bar ("Basement Gin"), structural terms ("truss," "girders," "weld").
  *   **Two Voices:** Clearly distinct stanzas 1 & 2 (Town "We" vs. Record "Municipal ledgers"). Stanza 3 merges ("Ice gripped...", "Ice clawed...", "We blame...", "The ledger blames...").
  *   **Opposing Functions:** Town focuses on feeling, timing ("*Before* the New Year"), fear, debt. Record focuses on date, measurable cause ("physics," "stress fractures," "exceeded rated might").
  *   **Identical Final Line:** "The river remembers." First use (Town-leaning): Implies the river holds the *truth* of their experience, fear, and debt (what it owes/witnessed). Second use (Record-leaning): Implies the river simply holds the *physical fact* of the collapse event (what caused what), neutral and geological.
  *   **Unresolved Tension:** The dates conflict ('87 vs. '89), the cause (weakness known vs. physics exceeding ratings), and the *meaning* of the event (moral debt vs. structural failure) all hang. No winner declared.
  *   **Hurt:** Mrs. Kowalski's fear, the "debt we feel," the "low cry," the trembling, the "ache across the years."
  *   **Form:** 3 stanzas (7 lines, 7 lines, 8 lines = 22 lines total).
