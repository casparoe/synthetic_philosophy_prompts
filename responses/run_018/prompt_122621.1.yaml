     - in_my_vocabulary: "Chance-relative-to-a-kind is a hyperparameter in a hierarchical model. Single-case chance is a latent state (random effect) for an individual instance. Deference to the kind-level chance is conditioning on the hyperparameter. Deference to the single-case chance is conditioning on that latent state. However, we typically do not observe the latent state, so we use the posterior distribution."
     - status: "distorted"
     - loss_or_distortion: "We lose the idea that single-case chance is an objective property not tied to a model. In our framework, it is modeled as a random variable, and we only have beliefs about it."

  5. **Reference-class problem**:
     - The same event can belong to multiple reference classes with different frequencies. Which one is the chance?
     - In our vocabulary: We address this by model averaging or selection, or by hierarchical modeling (partial pooling). We don't have a unique chance; we have a predictive distribution that averages over the reference classes.

     So:
     - in_my_vocabulary: "The problem of multiple reference classes is handled by building a model that incorporates the relevant classes and then using the posterior-predictive distribution, which averages over the classes with weights reflecting their predictive accuracy and the data."
     - status: "distorted"
     - loss_or_distortion: "The deference principle seems to require a unique chance, but our framework delivers a distribution that may not concentrate on one value. We lose the uniqueness of objective chance."

  6. **Undermining problem**:
     - The total evidence supports a chance hypothesis that, if true, makes the evidence itself unlikely.
     - In our vocabulary: This is similar to having a prior that is concentrated on a parameter value that would make the observed data unlikely. In Bayesian updating, the posterior would then move away from that value. The problem is avoided by updating.

     So:
     - in_my_vocabulary: "In a Bayesian model, if a parameter value θ makes the data unlikely, then the posterior probability of θ given the data is low. Therefore, we do not condition on θ and then find the data unlikely; we update to a posterior that downweights θ. This avoids the undermining problem."
