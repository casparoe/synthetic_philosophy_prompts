     However, the user's vocabulary includes "conditioning on an information set", so if the information set includes the chance, then the predictive mean is the chance. So:

     In_my_vocabulary: Conditioning on an information set that contains the objective chance of A (and only admissible evidence) implies that the predictive distribution for A is degenerate at that chance value.

     Status: clean? But note: we don't have an objective chance in our information set unless we are given it.

     But wait: the deference principle is a normative principle about what we should do if we were given the chance. So in our framework, if we are told the chance and we believe it, we set our belief to that chance. So it's trivial? But the friend says it's trivial because we condition on the information set. So we might say:

     In_my_vocabulary: The principle is that if we are given the objective chance and admissible evidence, then our predictive mean for A should equal the chance. This is delivered by conditioning on the information set that includes the chance.

     Status: clean. But note: the friend claims this is already done by conditioning. So we have to see if there are cases where conditioning doesn't give that.

     However, the challenge is that in our framework, we don't have objective chance as a primitive. So we might represent being told the chance as an observation of a random variable that is the chance. Then conditioning on that observation, if we believe it is the true chance, we set our belief to that value. But that requires that the chance is a random variable in our model and that we trust it. The deference principle does not require that we model chance as a random variable; it is a primitive.

     But the user's framework does model chance? The user said they use state-space models, so they do model chance as a latent state? But not necessarily. They might model the data generating process without an explicit chance.

     Given the above, we'll say:

     - item: "deference_principle"
     - in_my_vocabulary: "Conditioning on an information set that includes the objective chance value of an event and on evidence that is independent of the outcome conditional on the chance implies that the predictive probability of the event is that chance value. This follows from the tower property of conditional expectation."
     - status: "clean"
     - loss_or_distortion: "none"

     But note: the tower property requires that the chance is a random variable that we condition on. The philosopher's chance is not necessarily modeled as a random variable. However, in the user's framework, we model everything as random variables? The user uses Bayesian methods, so they do. So it's clean.

  2. **Admissibility clause**:
     - In philosophy: Evidence is admissible if it does not bear on the outcome directly, meaning conditional on the chance, the evidence is independent of the outcome.
     - In our vocabulary: Evidence E is admissible for event A given chance if, conditional on the chance of A, E is independent of A. This is exactly the condition that allows us to ignore E when we condition on the chance.

     So:
     - in_my_vocabulary: "Evidence E is admissible relative to event A and chance when, conditional on the objective chance of A, E is independent of A. This means that once the chance is known, E provides no additional information about A."
     - status: "clean"
     - loss_or_distortion: "none"

  3. **Time-relativity of admissibility**:
     - Example: Evidence that is admissible at time t0 might become inadmissible at time t1 (e.g., after the event occurs).
     - In our vocabulary: The information set grows over time. Evidence that is known at time t0 might be part of the conditioning set at t0, but if by t1 we have more information (e.g., about the outcome), then the admissibility condition must be re-evaluated at t1. We model this with a filtration.

