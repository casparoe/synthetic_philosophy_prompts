  **Case D: Undermining**

  - **my_framework_says**: We use the posterior-predictive distribution, which is the optimal forecast given the data. It is not equal to the plug-in estimate because we are averaging over the parameter uncertainty.

  - **deference_to_chance_says**: The deference principle would require that if we condition on the current chance (which we might take as the plug-in estimate), we set our belief to that. But the undermining problem is that if we condition on a chance hypothesis that is not the true one, we might get incoherence. However, the principle only requires deference if we condition on the chance and have admissible evidence. It doesn't require that we condition on a particular chance. So if we are not sure about the chance, we shouldn't condition on one.

