  - **who_wins**: Me (the user) because our framework provides a solution where the principle is silent.

  **Case C: Unrepeatable event**

  - **my_framework_says**: We have no exchangeable sequence, so we use a model that incorporates physics (if available) or choose a reference class by model selection. We output a predictive distribution that reflects our uncertainty.

  - **deference_to_chance_says**: The deference principle requires that if we are given the chance (by physics), then we set our belief to that chance. But the problem is that there is a reference-class problem: physics gives a chance, but we might have other reference classes. The principle says: if we accept that the physical chance is the objective chance, then we set our belief to it. But the principle does not tell us which chance to use if there are multiple candidates. It only applies if we are given the chance and it is objective.

