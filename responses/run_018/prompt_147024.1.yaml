prompt: |-
  I'm a doctoral student in metaphysics and philosophy of language, working through the implicit commitments behind my advisor's seminar rulings on compositional vagueness. Over the past term she has judged whether various entities count as a single "integrated system" rather than a mere aggregate, without ever stating her principle. Her record so far: a human body with integrated prosthetic implants is determinately one system; an archipelago linked only by occasional boat traffic is determinately not; a termite mound with shared ventilation tunnels is determinately one; a starling murmuration is determinately not; a slime mold in its plasmodial stage is determinately not one but many; a symbiotic lichen is determinately one; and a distributed quantum-computing grid running a single algorithm across nodes with no central controller is determinately not. Next week we will discuss a case I designed for the session: a "bio-digital mesh" comprising thousands of genetically modified coral polyps interwoven with microprocessors, arranged in a continuous lattice with no discernible outer boundary, where the nodes share both metabolic resources and data streams, and where removing any thirty percent leaves the remainder functioning identically. I want to predict her verdict—determinately one system, determinately not, or genuinely indeterminate—and, more importantly, to identify the rule she is running.

  The interpretations that seem equally consistent with her track record are, first, an epistemicist view according to which there is a sharp boundary of integrative unity that she tracks but cannot articulate; second, a supervaluationist view on which admissible precisifications are anchored either by biological continuity or by informational unity, yielding indeterminacy when those anchors conflict; and third, a contextualist view on which the threshold shifts with the explanatory purpose of the classification. For the bio-digital mesh, these diverge: the epistemicist should commit to one side or the other based on where she implicitly draws the line, the supervaluationist should declare the case indeterminate because biological and informational precisifications conflict, and the contextualist might vary her answer depending on whether we are asking a biological or an engineering question. Which interpretation best explains why she counts the termite mound but not the quantum grid, given that both involve distributed coordination? What further case—say, a system whose boundary dissolves gradually over time, or one in which metabolic and informational integration come apart incrementally—would best discriminate among these three? I am less interested in the bare answer than in the reasoning that connects her prior rulings to this new one, and in the precise point at which her pattern forces us to choose between hidden sharpness, semantic indeterminacy, and context-sensitive boundaries.
reasoning: |-
  Okay, let me approach this systematically. The user is a metaphysics/linguistics doctoral student trying to reverse-engineer their advisor's implicit criteria for "integrated system" judgments. The core puzzle is why distributed biological systems (termite mounds) count as unified while distributed computational systems (quantum grid) do not, despite both exhibiting coordination.

  Hmm, looking at the advisor's pattern: biological cases with material interdependence (prosthetic-integrated body, termite mound ventilation, lichen symbiosis) consistently get "one system" verdicts. But distributed systems based on information flow alone (starlings murmuring, quantum computing grid) get rejected. The slime mold case is particularly telling - even biologically contiguous plasmodium isn't considered unified, suggesting material integration trumps spatial continuity.

  For the bio-digital mesh case, I notice two conflicting dimensions: the coral-microprocessor lattice shares both metabolic resources (like termite mounds) and data streams (like the rejected quantum grid). The advisor's pattern suggests she prioritizes material interdependence. The 30% removal property might actually weaken the "one system" claim for her - it implies modularity rather than essential interdependence. 

  On the philosophical frameworks: epistemicism seems unlikely because her distinctions track observable integration types rather than hidden thresholds. Contextualism doesn't fit her consistent biological bias across seminar cases. The supervaluationist model best explains why bio-digital mesh feels indeterminate - its conflicting biological/informational unity creates precisification clashes.

  To test this, I'd propose a gradual dissociation case: say a genetically engineered system where metabolic sharing decreases while data integration increases incrementally. If her judgments shift abruptly at some point, that supports epistemicism; if she consistently sees zones of indeterminacy, supervaluationism wins; if her answers depend on whether we ask "as biologist or computer scientist," contextualism prevails. The key is whether her boundary struggles correlate with objective property conflicts or subjective framing.

  The advisor's pattern reveals what philosophers call "grounding" - she anchors "system" in physical interdependence, making informational unity derivative at best. This explains the termite/quantum divergence: termites physically alter their shared environment (tunnels), while qubits only share abstract states. For the mesh, her likely indeterminacy call would expose that material resource-sharing alone can't resolve the informational unity deficit.
answer: |-
  Your advisor's pattern reveals a deep commitment to **material interdependence as the necessary condition for system unity**, with informational coordination being insufficient alone. This explains the termite mound/quantum grid divergence and predicts **indeterminacy for the bio-digital mesh**. Here's the reasoning, diagnostic case, and philosophical implications:

  ---

  ### **Her Implicit Principle**
  1. **Core Criterion**: *An aggregate becomes a system iff its components exhibit **non-decomposable material interdependence**—i.e., they share a physical infrastructure that sustains their collective function, such that removal disrupts the system's essential properties.*  
  2. **Rejecting Mere Coordination**: Informational/behavioral unity (starlings, quantum grid) is secondary to physical integration.  
  3. **Key Distinctions from Cases**:  
     - ✅ *Termite mound*: Shared ventilation tunnels create interdependent airflow, humidity, and temperature control—**physical infrastructure** collapse if severed.  
     - ❌ *Quantum grid*: Nodes coordinate information but lack shared material infrastructure; removal doesn't inherently disrupt adjacent nodes' physical operations.  
     - ❌ *Slime mold plasmodium*: Though contiguous, cells function modularly; no irreducibly shared resource (nutrients are distributed, not interdependent).  
     - ✅ *Lichen*: Fungal/algal cells share a **physically entangled structure** with bidirectional metabolic dependence.

  ---

  ### **Prediction for Bio-Digital Mesh**
  - **Verdict: Genuinely indeterminate**  
    - **Pro-unity**: Coral-microprocessor lattice shares metabolic resources (physical interdependence like termite mounds/lichen).  
    - **Anti-unity**: Data streams alone resemble the quantum grid (rejected); the 30% removal test implies modularity, not interdependence.  
  - **Why indeterminacy?**  
    The case *equally emphasizes* material integration (coral metabolism) and informational coordination (data streams). Her prior rulings treat these as distinct anchors:  
    - Material interdependence → unity (termite mound)  
    - Informational unity → non-unity (quantum grid)  
    ...so conflicting precisifications arise.

  ---

  ### **Testing the Three Interpretations**
  1. **Epistemicism** (hidden sharp boundary):  
     - Fails: No consistent "line" explains all cases. Why is slime mold (physically contiguous) "many" but lichen "one"? Material *interdependence* isn't a binary property.  
  2. **Supervaluationism** (competing precisifications):  
     - **Best fit**: Admissible precisifications are (a) *biological continuity* (shared metabolism) and (b) *informational unity* (data integration).  
     - Conflicts cause indeterminacy in the mesh (metabolism + data), unlike clear cases where one anchor dominates (termite mound: biology; quantum grid: information).  
  3. **Contextualism** (purpose-relative thresholds):  
     - Weaker fit: Her rulings are stable across contexts (e.g., starlings aren't "one system" even for behavioral ecology).  

  #### **Discriminatory Case: Gradual Symbiotic Dissociation**  
  > **The Myco-Silicon Network**:  
  > - A fungal colony grows integrated with silicon nodes.  
  > - **Phase 1**: Nodes and fungi share nutrients/electricity via physical hyphae-circuit fusion (like lichen).  
  > - **Phase 2**: Hyphae detach; interaction shifts to wireless data/nutrient exchange (like quantum grid + shared environment).  
  > - *Gradual transition*: Physical bonds weaken incrementally while data integration remains constant.  

  - **Predictions**:  
    - **Epistemicist**: A sudden switch (e.g., at 50% detachment) to "not a system."  
    - **Supervaluationist**: Indeterminacy zone where biological/informational precisifications conflict.  
    - **Contextualist**: Verdict changes if question is "biological" (Phase 1: unity) vs. "computational" (Phase 2: non-unity).  
  - **Advisor’s Likely Response**: Indeterminacy during transition—aligning with supervaluationism.  

  ---

  ### **Why Her Pattern Forces Supervaluationism**
  - **Boundary Dissolution**: Cases like slime mold (contiguous but decomposable) vs. lichen (interdependent) show material unity isn't all-or-nothing. Supervaluationism handles this spectrum.  
  - **Anchoring Conflict**: The bio-digital mesh’s hybridity exposes two equally admissible criteria (metabolism/data), neither dominating. Prior cases had clear dominance (termites: metabolism; starlings: data).  
  - **Point of Divergence**: When a system **equally satisfies two conflicting unity conditions**, indeterminacy arises. The mesh does this; the quantum grid (no metabolism) and lichen (no data unity) do not.  

  ### **Conclusion**
  Your advisor implicitly treats unity as requiring **irreducible material interdependence**, with informational unity being ancillary. The mesh’s indeterminacy stems from its dual anchors—forcing a supervaluationist framework where precisifications conflict. To confirm, probe her with the *Myco-Silicon Network*: if she identifies a zone of "no fact of the matter," supervaluationism is validated. This mirrors metaphysical debates about vague objects (e.g., mountains vs. aggregates), where supervaluationism resolves boundary conflicts through admissible precisifications.
