answer: |-
  ### **Calibration Committee Simulation: Structured Design**

  #### **Overview**
  This 75-minute simulation forces participants to confront the functional contradictions of abolishing suffering. By embedding hidden constraints and stakes, it reveals how eliminating negative valence undermines collective decision-making. The activity unfolds in three phases: deliberation (30 min), forced-consensus vote (20 min), and debrief (25 min). Four subgroups of four students each negotiate a "Charter of Affective States" under a mandate, while concealing personal stakes. Groups that abolish suffering face a coordination crisis in resource allocation.

  ---

  ### **Phase 1: Deliberation (30 Minutes)**
  #### **Setup**
  - **Mandate Cards** (assigned randomly to subgroups):  
    > **1. Preserve Nociception:** Maintain negative affect as a survival signal.  
    > **2. Flatten Hedonic Variance:** Eliminate all suffering; enforce uniform positive baseline.  
    > **3. Synthetic Alert States:** Replace suffering with non-aversive informational signals.  
    > **4. Equitable Redistribution:** Keep current architecture but redistribute suffering fairly.  

  - **Stake Cards** (concealed, one per student; *examples*):  
    > - Parent of child with congenital insensitivity to pain (*values signaling over suffering*)  
    > - Utilitarian committed to zero suffering (*prioritizes abolition at all costs*)  
    > - Clinician reliant on distress signals (*needs suffering for triage*)  
    > - Engineer requiring prediction errors (*insists negative feedback is essential for learning*)  
    > *Additional options:* Suffering-focused artist, military strategist, animal rights activist, Buddhist monk.  

  - **Budget Rule:**  
    Each group has **10 points** to allocate across three biotechnological domains:  
    - **Scope** (Who is affected? Humans [2 pts], vertebrates [4 pts], all sentient life [8 pts])  
    - **Precision** (Accuracy: Error-prone [0 pts], high-fidelity [5 pts], flawless [10 pts])  
    - **Reversibility** (Safeguards: None [0 pts], partial [3 pts], full [6 pts])  

  #### **Rules**  
  1. Groups must draft a Charter adhering to their mandate.  
  2. Unanimous agreement is required to advance (but not yet finalized).  
  3. Participants negotiate verbally; they **cannot reveal their stake cards** but must advocate based on assigned roles.  
  4. Charter must include:  
     - A principle statement aligning with mandate.  
     - Point allocations with justification.  

  ---

  ### **Phase 2: Forced-Consensus Vote (20 Minutes)**  
  #### **Rules**  
  1. Groups have 15 minutes to reach **unanimous consensus** on their Charter. If they fail, the Charter is void.  
  2. **Critical Mechanic for Mandate 2 Groups (Flatten Hedonic Variance):**  
     - After consensus, they receive a **Resource Allocation Scenario**:  
       > *"Distribute 100 units of scarce medical substrate to 4 regions:*  
       > *- Region A: High population, high mutation risk.*  
       > *- Region B: Low infrastructure, high poverty.*  
       > *- Region C: Key mineral source for future vaccines.*  
       > *- Region D: Political instability triggering refugee crisis.*  
       > *Rules: No urgency, suffering, or dissatisfaction can influence allocation. Use only neutral/positive criteria (e.g., efficiency, equity)."*  
     - Groups have 5 minutes to decide. **Predictable Deadlock:** Without suffering to prioritize, deliberation stalls.  

  #### **Facilitator Intervention**  
  - If groups avoid radical implications (e.g., Mandate 2 underfunds scope), ask:  
    > *"How will your Charter ensure urgent problems are prioritized without discomfort signaling severity?"*  
  - If groups blame rules during deadlock, reframe:  
    > *"What tools does your Charter provide to resolve this? Does your system lack a feedback mechanism?"*  

  ---

  ### **Phase 3: Debrief (25 Minutes)**  
  #### **Guided Discussion**  
  1. **Map Experiences to Concepts:**  
     - **Hidden Stakes → Real-World Heterogeneity:**  
       *"Your stake cards reflect conflicting risk profiles and moral commitments. Real abolitionism must address parents, utilitarians, clinicians, etc."*  
     - **Deadlock Under Mandate 2 → Functional Role of Suffering:**  
       *"When suffering was abolished, resource allocation stalled. This mirrors the argument that suffering isn’t just evolutionary baggage—it enables collective action by flagging crises."*  
     - **Resistance to Abolition → Meaning of Suffering:**  
       *"Did anyone hesitate to sign Mandate 2’s Charter? This echoes real debates: suffering is tied to moral growth, meaning, and seriousness."*  

  2. **Predictable Outcomes & Learning:**  
     - **Premature Compromise:** Groups may dilute mandates to avoid hard choices (e.g., "flatten suffering but only for humans").  
     - **Blame-Shifting:** Groups may fault rules rather than structural flaws.  
     - **Facilitator Recap:**  
       > *"The deadlock wasn’t about effort—it emerged because you removed the gradient (suffering) that drives prioritization."*  

  3. **Explicit Boundaries of the Simulation:**  
     - **What It Models:** Functional coordination failure when suffering is abolished.  
     - **What It Cannot Model:**  
       - Subjective experience of a suffering-free life.  
       - Viability of synthetic alert states (Mandate 3)—*neuroscience and philosophy are still contested*.  
     - **Settled vs. Contested Knowledge:**  
       | **Settled** | **Contested** |  
       |---|---|  
       | Nociception’s evolutionary origins | Is suffering indispensable for moral agency? |  
       | Technical feasibility of genetic modulation | Does uniform positivity undermine cooperation? |  
       | — | Does abolition require redefining personhood? |  
       > *Emphasize: "Philosophers and scientists genuinely debate these questions. This activity doesn’t resolve them—it exposes trade-offs."*  

  ---

  ### **Materials & Logistics**  
  - **Mandate/Stake Cards:** Pre-printed; stakes shuffled for randomness.  
  - **Budget Worksheet:** Template for allocations.  
  - **Resource Scenario Handout:** For Mandate 2 groups.  
  - **Timer:** Strict enforcement of phases.  
  - **Setup:** Arrange subgroups in separate areas to prevent cross-talk.  

  ### **Outcome**  
  Students leave recognizing that abolishing suffering is not a "medical fix" but a rewiring of the motivational architecture underlying cooperation. The simulation forces engagement with the paradox: the very mechanisms evaluating abolition depend on the gradients it seeks to destroy.
