  hey, i was talking to a friend who just finished that pop-psych book comparing singapore and the us on cultural norms (the tight/loose thing). they summed it up like this: tight cultures are just societies with more explicit rules on the books, loose ones have fewer, and the reason countries go tight is mostly historical trauma rather than present-day ecological threat. then they applied it to our spaces — said rationalist forums are this weird hybrid, ultra-tight on epistemic norms (bayes, citaion standards, steelmanning) but ultra-loose socially, and they claimed the literature actually proves these hybrid states are unstable, always collapsing into full tightness or looseness within a generation, which explains why being in these spaces feels so exhausting. i feel like there's a kernel of truth in there but also some sleight of hand. can you audit this? tell me exactly what's a fair simplification, what's a distortion of the research, and whether that collapse-into-pure-types claim has any basis. please take a definate position — don't just list possibilities, actually tell me what's wrong and what's salvageable, with reasons. and don't bother with a bibliography, i just want to calibrate my intuition.
