prompt: |-
  I have no formal training in philosophy of science, but I have been trying to understand a problem that keeps coming up whenever I read about scientific disagreement: if every theory we actually hold is false in some respects, how can anyone claim that one false theory is closer to the truth than another? I understand this is related to the idea of verisimilitude, and I have seen that philosophers have proposed formal ways to measure it, argued that it collapses for probabilistic theories, and questioned whether the whole framework assumes a kind of direct comparison with reality that we never actually have. Beyond these, I am curious whether there is meaningful work being done on how verisimilitude applies when scientists compare not single universal laws but complex simulation ensembles—like climate model intercomparisons or epidemiological forecasting consortia—where the "truth" might be a distribution or a range rather than a definite state of affairs, and where no model is expected to be literally true. Given that I am trying to form my own view on which scientific disagreements are substantive and which are just noise, I want to know: among the open questions about verisimilitude—formal measurement, its coherence for statistical or probabilistic science, its applicability to ensemble or model-averaging practices, and its practical relevance for non-experts evaluating competing predictions—which matter most, and in what order should they be pursued? Please defend your ranking by specifying whose effort it is for, what criteria you are using—such as tractability, whether other questions depend on this one, or impact on practical reasoning—and what kind of progress would move a question up or down your list. I am writing this for my own long-form reflection, so I want a defended agenda rather than a survey or a reading list. Finally, please clearly distinguish what is broadly accepted in the philosophy of science from what is actively disputed among specialists, and avoid presenting any contested position as the settled consensus.
