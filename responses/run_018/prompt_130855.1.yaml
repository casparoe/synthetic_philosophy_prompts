answer: |-
  Below is a reusable 30-minute evaluation procedure structured as a flow of diagnostic questions. It operationalizes Kim's causal exclusion argument and key non-reductive responses (supervenience without reduction, non-strict laws, and Woodward's interventionism). Each step includes:  
  - **Sufficient answer**: Criteria to proceed.  
  - **Negative answer verdict**: "Redundant" (mental causation claim is unjustified), "Exclusion avoided" (claim survives), or "Flag for specialist" (metaphysical judgment needed).  
  - **Conceptual/empirical boundary**: Clear rules for when empirical analysis ends and metaphysical judgment begins.  

  ---

  ### **Causal Exclusion Evaluation Procedure**  
  *Time: ~30 min per manuscript. Input: Manuscript making mental-state (M) → physical/behavioral (E) causal claims.*  

  #### **Step 1: Identify Covarying Physical Properties**  
  **Question**: Does the manuscript explicitly identify a physical property (P) that covaries with the mental cause (M)?  
  - *Sufficient answer*: M and P are both defined (e.g., "anxiety" covaries with "amygdala activation").  
  - *Negative answer*: **Flag for specialist**. Manuscript fails to specify a supervenience base for M, making exclusion inapplicable.  
  - *Boundary*: Empirical (requires observable definitions of M and P). Proceed if answered.  

  #### **Step 2: Test for Non-Reductive Commitment**  
  **Question**: Does the manuscript treat M as *non-identical* to P (e.g., by appealing to multiple realizability, functional roles, or descriptive autonomy)?  
  - *Sufficient answer*: M is described as dependent on but not reducible to P (e.g., "intention supervenes on neural activity but has distinct properties").  
  - *Negative answer*: **Redundant**. If M = P, mental causation is a relabeling of physical causation.  
  - *Boundary*: Conceptual (identity vs. supervenience). Proceed only if non-identity is asserted.  

  #### **Step 3: Assess Overdetermination Risk**  
  **Question**: Does the manuscript acknowledge P as *causally sufficient* for E?  
  - *Sufficient answer*: P is explicitly/implicitly treated as sufficient for E (e.g., neural states predict behavior).  
  - *Negative answer*: **Flag for specialist**. Denying P’s sufficiency implies dualism (M as non-physical cause), requiring metaphysical scrutiny.  
  - *Boundary*: Empirical (evidence for P→E). Proceed if P is sufficient.  

  #### **Step 4: Interventionist Causal Relevance Test**  
  **Question**: Does the manuscript provide evidence that M causes E *independently of P* via Woodward-style interventions?  
  - *Sufficient answer*:  
    - (a) Direct: Experimental manipulation of M while controlling P (e.g., induce intention via instruction while clamping neural variables).  
    - (b) Indirect: Mediation analysis, computational modeling, or natural experiments showing M explains E beyond P (e.g., anxiety effects persist after controlling amygdala activity).  
  - *Negative answer*: **Redundant**. No evidence that M adds causal power beyond P.  
  - *Boundary*: Empirical (methodological adequacy). Proceed if answered.  

  #### **Step 5: Check for Non-Strict Laws**  
  **Question**: Does the manuscript ground M→E claims in *ceteris paribus* (non-strict) laws, supported by context-sensitive evidence?  
  - *Sufficient answer*: M→E is framed as a robust but defeasible regularity (e.g., "intentions cause motor changes under typical conditions").  
  - *Negative answer*: **Exclusion avoided** (if Step 4 passed), but note vulnerability. If Step 4 failed, verdict is already redundant.  
  - *Boundary*: Conceptual (lawhood vs. generalization). Final verdict here.  

  ---

  ### **Worked Applications**  

  #### **Case 1: Conscious Intention as Novel Cause in Motor Cortex**  
  *Claim*: Conscious intention (M) causes motor-cortex dynamics (E) not predictable from prior neural states (P).  
  - **Step 1**: *Sufficient*. M = intention, P = prior neural states. Covariance implied.  
  - **Step 2**: *Sufficient*. Non-identity asserted (M is "novel" and not reconstructible from P).  
  - **Step 3**: *Sufficient*. P (prior neural states) acknowledged as insufficient for E, but current neural state (P*) is likely sufficient. **Verdict**: **Flag for specialist**. Denying P*’s sufficiency risks dualism; P*’s role is ambiguous.  
  - **Stop**. No further steps needed.  
  - **Feature doing the work**: Step 3 (overdetermination risk). Manuscript avoids labeling the *current* neural correlate of intention as P, creating ambiguity.  
  - **Defender attack**: Argue that P* (intention’s neural correlate) is not "prior neural states" and that M’s novelty implies M ≠ P*. Rejects Step 3’s sufficiency criterion.  
  - **What the procedure cannot settle**: Whether M’s "novelty" implies non-supervenience (dualism) or emergent supervenience. Requires specialist metaphysics.  

  #### **Case 2: Anxiety-Driven Behavior via Amygdala Activation**  
  *Claim*: Avoidance behavior (E) is caused by amygdala activation (P); "anxiety" (M) is a descriptive label for P.  
  - **Step 1**: *Sufficient*. M = anxiety, P = amygdala activation. Explicit covariance.  
  - **Step 2**: *Negative*. M is used as a label for P (e.g., "anxiety refers to amygdala activity"). **Verdict**: **Redundant**. Mental causation claim collapses into physical causation.  
  - **Stop**. No further steps needed.  
  - **Feature doing the work**: Step 2 (non-identity). Manuscript explicitly reduces M to P.  
  - **Defender attack**: Argue that "descriptive label" does not entail identity (e.g., anxiety could be multiply realizable). Rejects Step 2’s sufficiency criterion.  
  - **What the procedure cannot settle**: Whether the label implies ontological reduction. Depends on the author’s implicit metaphysics.  

  ---

  ### **Procedure Summary**  
  - **Empirical boundary**: Steps 1, 3, and 4 rely on methodological evidence.  
  - **Conceptual boundary**: Steps 2 and 5 require philosophical coherence but use scientific proxies (e.g., multiple realizability for non-reduction).  
  - **Outputs**:  
    - "Redundant": Mental cause is physically explainable (40-60% of cases).  
    - "Exclusion avoided": Manuscript justifies non-reductive mental causation (10-20%).  
    - "Flag for specialist": Unresolved metaphysical issues (20-40%).  
  - **Limitations**: Cannot resolve disputes about supervenience, emergence, or lawhood without metaphysical commitments. Ensures manuscripts engage the exclusion problem but defers to specialists when empirical methods are exhausted.  

  This procedure prioritizes empirical tractability, with Steps 1–4 resolvable via manuscript text and standard scientific literacy. Step 5 and flagged cases require minimal metaphysics awareness but no expertise.
