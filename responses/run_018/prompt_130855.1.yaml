  3. **Check for causal exclusion by overdetermination**: Does the manuscript acknowledge that P is a sufficient cause for the effect? If not, then the mental cause M might be considered the only cause, which would avoid exclusion but raise the problem of how M (non-physical) can cause physical effects. This is a conceptual issue and must be flagged for a specialist. If the manuscript acknowledges that P is a sufficient cause, then we face the threat of overdetermination (both M and P causing the same effect). Proceed to step 4.

  4. **Check for supervenience without reduction**: Does the manuscript provide evidence or argument that M supervenes on P but is not reducible to P? For instance, by showing that M is multiply realizable? If yes, then the mental cause M might be considered as having a distinct causal role that is not captured by P alone. This is a common non-reductive response. Proceed to step 5 to test if this distinct causal role is causally relevant. If not, then the mental property M is reducible to P and the causal claim is redundant. Stop and issue verdict: redundant.

  5. **Apply Woodward-style interventionist test for causal relevance**: This step tests whether M has causal relevance that is not entirely accounted for by P. The reviewer should look for evidence of an intervention on M that changes the effect while holding fixed the physical realizer P (or vice versa). In practice, this is difficult because intervening on M without changing P is typically not feasible (since M supervenes on P). Alternatively, the manuscript might use statistical methods (e.g., mediation analysis) to show that M has an effect over and above P. 
