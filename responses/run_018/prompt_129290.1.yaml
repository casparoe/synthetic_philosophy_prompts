  Okay, the user is asking for a specification for a normative theory of reference-class selection. They cover philosophy of science and risk for a general audience, so I need to keep this accessible but precise. They mentioned specific cases: Swedish male smoker, self-locating predictions, and interval-boundary shift. Also, distinctions like epistemic vs causal relevance, group frequency vs individual expectation. Plus, they want to know what's non-negotiable vs camp-specific, and if any desiderata conflict. Finally, score frequentist, Bayesian, and propensity approaches against these.

  First, I should outline the key components. Desiderata must include the cases to resolve. The Swedish male smoker shows conflicting statistics from overlapping classes. Self-locating predictions involve individuals using class data for personal forecasts, like predicting one's own lifespan. Interval-boundary shift deals with properties changing during the prediction period, like a smoker quitting midway.

  Next, distinctions. Epistemic vs causal relevance is crucial—knowing a correlation isn't the same as causing the outcome. Group frequency is about aggregate data, while individual expectation is personal probability. Mixing these can lead to errors.

  Non-negotiables: Avoiding contradiction (no class that guarantees both A and not-A), epistemic grounding (using known stats), relevance (only factors tied to the outcome), and specificity (choosing the most informative class). Camp-specific preferences might include causal vs non-causal factors or how to handle conflicting classes.

  Now, conflicts. The Swedish male smoker case highlights the specificity-relevance tension. Choosing the smallest class risks overfitting, while broader classes may ignore key factors. Also, interval-boundary shift challenges the static nature of reference classes in standard approaches.

  Scoring the approaches:
  - Frequentist: Strong on group frequencies but struggles with individual cases and changing properties. It might pick the narrowest class, leading to contradictions in overlapping classes.
  - Subjective Bayesian: Handles updating with new info and self-locating predictions well through personal priors. But it's subjective, so relevance depends on prior beliefs, which might not align with actual causality.
  - Propensity: Focuses on individual dispositions, which is great for causal relevance and interval shifts. However, it's metaphysical and hard to measure, making practical application tough.

  User's deeper needs: They likely want a framework that's theoretically sound but applicable for risk communication. Highlighting conflicts helps them explain why no single method is perfect. They might need to present balanced content that acknowledges real-world limitations while guiding best practices. Also, British English terms like "favour" and "metre" should be used consistently.
answer: |-
  Here is a specification for an adequate normative theory of reference-class selection, tailored for a general audience interested in philosophy of science and risk, using British English and addressing your requirements:

  **Core Desiderata for a Normative Theory of Reference-Class Selection**

  1.  **Cases it Must Resolve:**
      *   **The Swedish Male Smoker:** Must provide a principled method to choose between conflicting probabilities derived from overlapping reference classes (e.g., mortality risk from "All Swedes", "All Males", "All Smokers", "Swedish Male Smokers") when data exists for multiple levels of specificity. The theory must avoid arbitrary selection or contradictory predictions.
      *   **Self-Locating Predictions:** Must guide an individual embedded *within* a class to rationally derive a personal probability estimate (e.g., "What is *my* chance of surviving 10 years?") based on the class frequency, addressing the shift from group statistics to individual expectation.
      *   **Interval-Boundary Shift:** Must handle cases where the individual’s class-defining properties change *during* the prediction interval (e.g., predicting 10-year survival for a current smoker who might quit in year 3). The theory must specify how to incorporate potential or actual changes in relevant properties over time.

  2.  **Distinctions it Must Preserve:**
      *   **Epistemic vs. Causal Relevance:** Must differentiate between factors merely *correlated* with the outcome (epistemic relevance, useful for prediction given current knowledge) and factors that are part of the *causal mechanism* generating the outcome (causal relevance, crucial for understanding and intervention). The choice of reference class should ideally prioritise causal factors where known, but function epistemically where causation is uncertain.
      *   **Group Frequency vs. Individual Expectation:** Must clearly delineate the objective relative frequency within a group from the subjective degree of belief (expectation) an individual *should* hold based on their class membership. The theory must explain how the former grounds the latter without conflating them.
      *   **Objective Chance vs. Subjective Probability:** Must account for how knowledge of objective frequencies (where they exist) constrains or determines rational subjective probabilities for individuals within the relevant class.

  3.  **Non-Negotiable Requirements:**
      *   **Avoidance of Contradiction:** The selected class must not generate logically incompatible probability assignments for the same event/individual at the same time. (e.g., It cannot simultaneously demand using "Smoker" yielding P(death)=0.8 and "Non-Smoker" yielding P(death)=0.2 for the same individual who is a smoker).
      *   **Epistemic Grounding:** Probability assignments must be justifiable by, and responsive to, available empirical evidence (statistical data).
      *   **Relevance Requirement:** The chosen class must be selected based on properties demonstrably relevant to the outcome being predicted (ruling out blatantly irrelevant classes like "people born on a Tuesday" for cancer risk, barring bizarre evidence).
      *   **Specificity Requirement:** Given equally relevant classes, the theory should favour the most specific class for which reliable statistics exist (addressing the Swedish Smoker problem partially).
      *   **Handles Change:** Must provide guidance, even if provisional, for the Interval-Boundary Shift problem (e.g., using time-dependent classes, weighted averages, or causal models).

  4.  **Camp-Specific Preferences:**
      *   **Primacy of Causality:** Whether causal factors *must* be prioritised over merely correlational ones if known (Causal Decision Theory camp) vs. allowing purely correlational/epistemic classes if causal knowledge is absent or unclear (General Epistemic camp).
      *   **Subjectivity of Prior:** The degree and nature of subjective judgement permitted when data is sparse, conflicting, or when defining "relevance" (Strong Objectivists vs. Bayesian Subjectivists).
      *   **Ontological Commitment:** Whether reference classes correspond to real, objective chance-setting properties (Propensity/Realist camp) or are primarily pragmatic epistemic tools (Frequentist/Operationalist camp).
      *   **Resolution of Conflict:** Method for choosing between relevant classes with conflicting statistics when no single most specific class exists (e.g., average? weight by precision? seek a unifying causal model?).

  **Tensions and Joint Unsatisfiability:**

  *   **The Specificity-Relevance-Sufficiency Trilemma:** The core tension lies in simultaneously satisfying:
      1.  **Relevance:** Only use properties pertinent to the outcome.
      2.  **Specificity:** Use the most specific relevant class available.
      3.  **Statistical Sufficiency:** Use a class large enough to yield a reliable, stable frequency estimate.
      *   **Conflict:** The most specific relevant class (e.g., "50-year-old Swedish Male Smokers with Hypertension and Specific Genetic Marker X") may be too small (n=1 or n=10) for a statistically reliable frequency (violating Sufficiency). Resorting to broader classes (e.g., "All Smokers") improves Sufficiency but sacrifices Specificity and potentially Relevance (if broader classes include irrelevant heterogeneity). **This trilemma is inherently difficult to fully resolve simultaneously under standard statistical constraints requiring sufficient sample sizes.** Theories must navigate trade-offs, often prioritising Relevance and Sufficiency over maximal Specificity.

  **Scoring Existing Approaches Against the Desiderata:**

  1.  **Frequentist Reference-Class Reasoning:**
      *   **Strengths:** Strong on Epistemic Grounding using observed frequencies. Clear link between Group Frequency and Individual Expectation (the frequency *is* the best estimate for an individual). Handles Group Frequency well. Non-negotiable Avoidance of Contradiction is attempted via the "Narrowest Reference Class" rule (Specificity Requirement).
      *   **Weaknesses:** Struggles severely with **Swedish Smoker** when narrowest class is ambiguous or too small (Statistical Sufficiency problem). Poor on **Self-Locating Predictions** (often ignores the philosophical leap from group to individual). Ill-equipped for **Interval-Boundary Shift** (classes are typically static). Blurs **Epistemic/Causal Relevance** (prioritises correlation, causation is secondary). **Relevance Requirement** is ad-hoc. **Specificity-Sufficiency** conflict is acute. Tends to conflate Group Frequency as the *only* valid Individual Expectation.

  2.  **Subjective Bayesian Updating:**
      *   **Strengths:** Excels at **Self-Locating Predictions** (personal probability is fundamental). Naturally handles **Interval-Boundary Shift** via sequential updating on evidence of change (e.g., learning one quit smoking). Can incorporate **Causal Relevance** through model structure (if causally informed priors/models are used). Flexible in handling sparse/no data via priors (mitigates Specificity-Sufficiency conflict pragmatically). Clearly distinguishes Subjective Probability as the individual's expectation.
      *   **Weaknesses:** **Epistemic Grounding** depends entirely on the prior; a poorly justified prior violates the Relevance Requirement. Choice of *initial* reference class(es) for setting the prior/likelihood is often underspecified and potentially arbitrary, struggling with the core **Swedish Smoker** dilemma at the foundation. **Group Frequency** is only one type of evidence feeding the prior/posterior, not fundamental. **Avoidance of Contradiction** relies on coherence requirements (probabilism), but different agents with different priors/classes can coherently hold conflicting beliefs. Can struggle to objectively ground **Relevance**.

  3.  **Propensity Interpretations:**
      *   **Strengths:** Directly addresses **Causal Relevance** – the reference class *should* capture the set of conditions generating the causal propensity (chance) for the outcome. Provides a natural ontology for **Individual Expectation** (grounded in the individual's disposition). Potentially handles **Interval-Boundary Shift** if propensities are state-dependent and time-indexed. Strong **Relevance Requirement** (only causally relevant factors).
      *   **Weaknesses:** **Epistemic Grounding** is weak – identifying true propensities/causally homogeneous classes is extremely difficult, often metaphysical. Provides little concrete guidance for resolving the **Swedish Smoker** problem with empirical data (how to *identify* the true propensity class?). **Self-Locating Predictions** are based on an often unobservable metaphysical property. **Statistical Sufficiency** is a practical nightmare (true propensity classes might be arbitrarily specific, down to individuals). **Group Frequency** is only evidence *for* the propensity, not the propensity itself. Highly vulnerable to the **Specificity-Sufficiency** conflict. May be too restrictive if purely correlational classes have predictive value despite unknown causality.

  **In Summary:** A truly adequate normative theory remains elusive due to the Specificity-Relevance-Sufficiency trilemma. It must rigorously integrate causal knowledge (where available) with epistemic constraints from data, provide clear rules for class selection amidst conflict and change, and bridge the gap between group statistics and individual rational expectation. Current approaches offer partial solutions but excel and falter on different facets of the problem. A hybrid approach, perhaps combining causal models (for relevance/structure) with Bayesian updating (for evidence integration and handling change) and frequentist data constraints (for grounding), shows promise but requires careful specification to meet all desiderata.
