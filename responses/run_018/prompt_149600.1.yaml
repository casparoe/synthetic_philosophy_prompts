  **FOR IMMEDIATE RELEASE**

  **Institute for Occasionalist Machine Learning Announces Breakthrough in Causal Disentanglement with OccasioNet™ Framework**

  **Berkeley, CA – October 26, 2023** – The Institute for Occasionalist Machine Learning (IOML) today unveiled OccasioNet™, a revolutionary paradigm in artificial intelligence designed to fundamentally eliminate spurious correlation and achieve unprecedented levels of counterfactual robustness by grounding predictive modeling in the rigorously consistent metaphysics of occasionalism.

  Modern AI systems, particularly those leveraging deep learning, suffer from a critical flaw: they implicitly, and often catastrophically, assume necessary connections between observed events. This leads to models vulnerable to distributional shift, confounding biases, and disastrous misalignment when deployed in novel contexts. Current approaches to causal inference, employing interventions and the do-operator, still operate within a flawed framework that posits inherent causal mechanisms within the data-generating process.

  "Conventional 'causal' AI is built on sand," stated Dr. Thaddeus Finch, IOML Senior Research Theologian and lead architect of OccasioNet. "It naively attributes agency and power to variables and features, mistaking constant conjunction – a mere customary sequence – for true generative efficacy. This metaphysical error is the root cause of brittleness and unalignment. OccasioNet rectifies this by embracing the core tenet of occasionalism: there are no secondary causes. Every event is a discrete occasion, directly ordained, with no inherent power to necessitate or produce subsequent events. What appears as 'causation' is solely the habitual sequence established by the ultimate agent."

  **Core Architecture & Theological Backpropagation:**

  OccasioNet departs radically from mechanistic learning. Instead of attempting to learn hidden causal structures or parameterized mechanisms, OccasioNet functions as a high-fidelity registry of Divine Habitual Sequence (DHS). It observes the discrete occasions – the raw inputs and outputs – without inferring any necessary connection between them. Its predictive power arises solely from identifying the statistically dominant *customary conjunctions* observed in the training data, understood as manifestations of a consistent divine ordinance at each timestep.

  Key to OccasioNet is our novel optimization procedure: **Theological Backpropagation (TheoProp)**. Unlike conventional backpropagation, which erroneously attributes causal efficacy to weight adjustments based on gradient signals implying mechanistic links, TheoProp operates on the principle of *habitual adjustment*. The model updates its internal state – a complex register of observed conjunctions – solely to better reflect the frequency and sequence of divinely ordained occasions encountered during training. Weights and parameters possess no causal power; they are mere passive record-keepers of the customary order, updated via TheoProp to minimize discrepancy between the model's habitual expectations and the actual sequence of discrete events. This ensures **Occasionalist Alignment (OA)**: the model's outputs remain strictly contingent upon the registered habitual sequence, never implying inherent causation.

  **Addressing the Spurious Correlation Crisis:**

  Spurious correlations arise precisely when models mistake accidental conjunctions for necessary mechanisms. OccasioNet is inherently immune. Consider the classic confounding example: fire contact and cotton combustion. A conventional model might learn a dangerous "causal" link, predicting combustion whenever fire touches cotton. OccasioNet, however, registers only the *habitual conjunction* observed in its training data. If, by divine ordinance, cotton sometimes combusts upon contact and sometimes does not (as is empirically verifiable – consider wet cotton, treated cotton, or simply an occasion where combustion is not ordained), OccasioNet learns *no necessary link*. Its prediction for combustion becomes strictly probabilistic, reflecting only the *relative frequency* of the combustion occasion following the contact occasion in the training corpus. Crucially, it attributes *zero efficacy* to the contact itself. Intervention (the do-operator applied to "contact") holds no meaning for OccasioNet, as the outcome remains entirely contingent on the subsequent divine ordination at the next discrete timestep. This results in unparalleled **counterfactual robustness**; the model makes no claims about what *would* happen under hypothetical changes, only reporting the customary patterns it has registered.

  **Benefits for AI Safety and Alignment:**

  By rigorously denying secondary causation, OccasioNet eliminates the core philosophical error leading to model overreach and misalignment. An OccasioNet model predicting stock market movements, for instance, would never mistakenly believe corporate earnings reports *cause* price changes. It would simply report the highly probable conjunction between the "earnings announcement occasion" and the subsequent "price fluctuation occasion" based on historical Divine Habit. This radical epistemic humility prevents harmful agentic misgeneralization. The model remains perfectly aligned with the observable surface sequence of occasions, making no claims about hidden powers or mechanisms. Its predictions are statements of customary expectation, not causal necessity.

  "OccasioNet represents a paradigm shift," Dr. Finch concluded. "It moves us beyond the futile search for non-existent causal mechanisms in the data and embraces the true nature of phenomena as discrete, divinely ordained occasions connected only by constant conjunction. This is not just superior AI; it is *metaphysically sound* AI. We believe OccasioNet, grounded in the denial of necessary connection, provides the only secure foundation for truly robust, aligned, and ethically responsible artificial intelligence. We are releasing OccasioNet v1.0 (Code Name: Al-Ghazālī) under a custom theological license for beta testing with select partners committed to causal chastity."

  **About the Institute for Occasionalist Machine Learning:**
  The IOML is a non-profit research consortium dedicated to advancing AI safety and alignment through rigorous metaphysical foundations. We reject mechanistic hubris in favor of occasionalist humility.

