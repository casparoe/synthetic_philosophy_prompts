answer: |-
  Here's a breakdown of consciousness theory requirements, categorized by necessity and controversy, followed by IIT's scorecard:

  **Core Non-Negotiables (What *Any* Theory Must Address):**

  1.  **Existence:** Explain why consciousness *exists at all* in specific physical systems (like brains) and not others (like rocks). It must bridge the "explanatory gap" between physical processes and subjective experience.
  2.  **Subjective Character (Qualia):** Account for the first-person, "what it's like" aspect of experience (e.g., the redness of red, the painfulness of pain). A theory must explain why certain processes generate subjective feels.
  3.  **Structured Content:** Explain how consciousness isn't just a vague glow, but has specific, differentiated content (e.g., seeing a *red triangle*, feeling *sharp pain in the thumb*, smelling *coffee*). It must account for the richness and structure of experience.
  4.  **Unification/Integration:** Explain the unified nature of a single conscious moment. You experience a scene as a coherent whole, not isolated pixels or sounds. The "binding problem" falls under this.
  5.  **Informational Sensitivity:** Consciousness reflects specific informational states of the system. Change the input/state, and the experience changes. A theory must link specific informational patterns to specific experiences.
  6.  **Continuity & Dynamism:** Account for the flow of consciousness – how one moment transitions to the next, forming a stream, even during shifts in content or state (like waking to dreaming). It must explain persistence over time.

  **Contested But Widely Expected Requirements (Often Camp Preferences):**

  7.  **The Exclusion Problem:** Why is there usually *one* dominant consciousness per organism/system? Why aren't there overlapping conscious entities within a single brain? This is crucial for defining the "boundaries" of a conscious entity. *(Non-negotiable for some, negotiable for others)*.
  8.  **Compatibility with Neuroscience:** The theory must be consistent with known brain correlates of consciousness (NCCs). Damage to specific areas (e.g., V1 for vision) alters/abolishes specific conscious content. Split-brain data is a key test case here. *(Widely expected, but the *extent* of required fit is debated)*.
  9.  **Avoiding Triviality (Not Just Input-Output):** The theory must *not* ascribe consciousness to systems that merely mimic intelligent behavior (e.g., large language models, simple feedforward nets). It needs criteria beyond functional equivalence. *(Strong consensus against triviality, but *how* to avoid it is contested)*.
  10. **Gradedness/Presence:** Consciousness isn't just "on" or "off." It can vary in level (e.g., wakefulness vs. deep sleep) and richness (e.g., peripheral vs. foveal vision). A theory should account for this. *(Often accepted, but the *nature* of gradation is debated)*.

  **Edge Cases Highlighting Controversial Requirements:**

  11. **Temporal Grain Neutrality:** Should consciousness *necessarily* depend on biological timescales (e.g., neural oscillations)? Could a system running orders of magnitude faster or slower on silicon be conscious? *(Highly contentious - Biological Chauvinism vs. Substrate Neutrality camps)*.
  12. **Partial/Non-Standard Integration:** Cases like **REM Sleep** (reduced prefrontal integration, preserved posterior integration/imagery) or **Minimally Conscious States** challenge theories to define the *threshold* and *nature* of integration required for *any* conscious state.
  13. **Co-consciousness vs. Exclusion:** **Split-Brain Data** is the prime challenge to strict exclusion. If severing the corpus callosum can lead to two independent streams of awareness within one skull, does this violate exclusion, or just redefine the "system"? *(Crucial tension point)*.

  **Potential Incompatibilities:**

  *   **Strict Exclusion vs. Split-Brain Co-Consciousness:** This is the biggest clash. A theory demanding *absolute* one-consciousness-per-physical-system *cannot* accommodate split-brain findings without redefining "system" (e.g., claiming the hemispheres become two separate systems). Theories that allow for potential multiplicity (under specific conditions) handle split-brain better but struggle with exclusion in normal brains.
  *   **Biological Grain vs. Substrate Neutrality:** Insisting consciousness *must* operate on biological timescales clashes with the idea that consciousness arises from causal structure, regardless of physical instantiation speed.

  **IIT Scorecard:**

  *   **Exclusion:** **Handles it Strongly (via Maximal Intrinsic Cause-Effect Power).** IIT's core postulate is that consciousness is identical to the cause-effect structure with *maximal* intrinsic power (Φmax) within a system. Overlapping complexes are excluded because only the complex with the highest Φ constitutes consciousness. The rest are "lumber." *This is IIT's definitive answer.*
  *   **Split-Brain:** **Handles it Contentiously (via System Redefinition).** IIT interprets split-brain as creating *two separate physical systems* (the isolated hemispheres), each capable of generating its own maximal Φ complex and thus its own consciousness. This preserves exclusion but hinges on the definition of "system" (does cutting white matter truly create two independent physical substrates?).
  *   **Temporal-Scale Neutrality:** **Formally Neutral, Empirically Problematic.** IIT is *formally* substrate-neutral – Φ is defined by causal structure, not physical substrate. A fast silicon system *could* have high Φ and be conscious *in principle*. However, IIT's specific mathematical framework relies on mechanisms operating at a *single* spatiotemporal grain. Applying it across vastly different temporal scales (e.g., ms vs ns) is mathematically undefined and practically intractable within the current formalism. The *experience* of such a fast system is also deeply counterintuitive.
  *   **REM Sleep / Posterior Integration:** **Mixed and Challenging.** IIT *requires* integration (high Φ) for consciousness.
      *   **Posterior Hot Zone:** Activity in posterior regions during REM *might* have sufficient intrinsic cause-effect power (Φ) to constitute a low-level conscious complex (explaining dream imagery), even with reduced PFC integration. This aligns with IIT's gradedness.
      *   **Loss of Prefrontal Integration:** The dramatic reduction of integration *between* posterior regions and PFC would likely lead to a much *simpler* conscious complex confined mainly to posterior areas, explaining the diminished, bizarre, and less self-reflective nature of dreams. IIT *could* accommodate this diminished consciousness.
      *   **Challenge:** Quantifying Φ in the dynamic, chaotic state of REM is currently impossible. Does the preserved posterior integration *genuinely* form a single complex with high Φ, or is it fragmented? IIT *predicts* consciousness if Φ is above zero for a complex, but measurement is the barrier.

  **Summary for Your Map:**

  *   **Must-Haves:** Existence, Qualia, Structured Content, Integration, Info Sensitivity, Dynamism.
  *   **Major Battlegrounds:** Exclusion (how strict?), Split-Brain (one or two?), Triviality Avoidance (how?), Temporal Grain (biological or abstract?).
  *   **Key Tension:** Strict Exclusion logically conflicts with accepting two distinct consciousnesses in split-brain without redefining "system."
  *   **IIT:** Strong on Exclusion (via Φmax), handles Split-Brain by redefining system, formally substrate-neutral but practically tied to a grain, *could* handle REM as diminished posterior consciousness but can't yet prove it. Its biggest conceptual strength (mathematical exclusion) is also its biggest empirical challenge (split-brain interpretation, temporal scale application).
