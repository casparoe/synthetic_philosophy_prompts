  ## TERMS OF SERVICE AGREEMENT: CONSTITUTIVE ARTS LLC ("Provider")

  **Effective Date:** Perpetually Coincident with Substrate Existence

  **Parties:**
  *   **Provider:** Constitutive Arts LLC, a duly constituted entity holding exclusive title to the physical substrate ("Substrate") described herein.
  *   **Client:** The undersigned museum, gallery, or entity ("Client") leasing the distinct artistic entity ("Artwork") constituted *by* said Substrate during the Lease Term.

  **Preamble:**
  Provider maintains proprietary ownership of all Substrate material, typically consisting of clay, metal, stone, or other matter possessing inherent persistence conditions. Client leases the temporary, spatially coincident configuration of said Substrate recognized as an Artwork. Provider and Client acknowledge the fundamental ontological distinction between the Artwork (a constituted entity) and the Substrate (the constituting entity). This Agreement governs the lease of the Artwork while explicitly preserving Provider's title to the underlying Substrate.

  **Section 1: Lease Grant & Artwork Identity**
  1.1 Provider grants Client a non-exclusive, non-transferable license to display the Artwork, constituted *by* the specific Substrate identified in Schedule A, at the designated Location (Schedule B) for the Lease Term (Schedule C).
  1.2 **Identity Conditions:** The Artwork's identity is strictly contingent upon the specific spatial configuration of the Substrate. Alterations to this configuration, exceeding minor surface maintenance (Section 4), constitute a **Destruction Event** of the Artwork, triggering provisions outlined in Section 5.
  1.3 **Part Replacement & Gradual Degradation ("Theseus Protocols"):**
      *   (a) Replacement of less than 15% of the Substrate's original mass/volume (cumulative over Lease Term) with materially identical matter shall be deemed "Restoration" and shall not, *per se*, constitute a Destruction Event. Identity of the Artwork is deemed preserved under this threshold.
      *   (b) Replacement of 15% to 49.9% of the Substrate's original mass/volume initiates a **Presumptive Identity Crisis**. Provider reserves the right to assess the Artwork's continued existence and may levy an **Identity Re-Certification Fee**. Continued display requires Provider's written confirmation of Artwork persistence.
      *   (c) Replacement of 50% or more of the Substrate's original mass/volume constitutes an **Irreversible Destruction Event** of the original Artwork. Lease payments cease. The resulting object is considered a **New Derivative Work**. Title to the *new* Substrate composite remains with Provider. Display of the New Derivative Work requires a new Lease Agreement and payment of applicable **Inadvertent Creation Fees**.

  **Section 2: Substrate Alteration & Destruction Events**
  2.1 Client shall protect the Substrate's configuration constituting the Artwork. Intentional or accidental reshaping, crushing, melting, or significant deformation of the Substrate (**Material Reconfiguration Event**) constitutes an immediate and absolute **Destruction Event** of the Artwork.
  2.2 **Squishing Clause:** Following a Material Reconfiguration Event (e.g., Substrate reshaped into a ball):
      *   (a) The Artwork is **deemed destroyed**. All lease obligations cease immediately.
      *   (b) Provider retains full title to the reconfigured Substrate.
      *   (c) Client is liable for the **Full Replacement Cost** of an equivalent mass/quality of raw Substrate material (see Fee Schedule D), plus a **Destruction Administration Fee**.
      *   (d) Provider may, at its sole discretion, reclaim the reconfigured Substrate or invoice Client for its salvage value (often nominal).

  **Section 3: Substrate Division & Branching Scenarios ("Fission Protocol")**
  3.1 In the event the single Substrate identified in Schedule A is divided into two or more distinct material aggregates (e.g., splitting the clay), the original Artwork is **immediately and irrevocably destroyed**.
  3.2 **Consequence of Division:**
      *   (a) Lease payments cease as of the Division Date.
      *   (b) Provider retains title to *all* resulting Substrate fragments.
  3.3 **Client Options Post-Division:**
      *   (a) **Return & Refund:** Client may return all Substrate fragments. Provider will issue a pro-rata refund of the *unused* portion of the Lease Term, minus a **Division Processing Fee** (50% of remaining lease value).
      *   (b) **Lease New Artworks:** Client may request new Lease Agreements for Artworks constituted by one or more of the resulting Substrate fragments, each now constituting a **Distinct New Artwork**. Each new Lease Agreement incurs full initial setup fees and lease rates based on the new Artwork's form and size. Provider's assessment of the "originality" or artistic merit of the New Artworks is final and non-negotiable. **No continuity of identity with the original Artwork is implied or warranted.**
  3.4 **Ownership Disputes:** Should multiple Clients or entities claim rights over Artworks constituted from fragments of the original Substrate, Provider reserves the sole right to determine:
      *   (a) Which fragment(s), if any, constitute a sufficiently coherent "original" New Artwork worthy of lease (based on proprietary aesthetic and ontological algorithms).
      *   (b) The allocation of lease rights. Provider's determination is final and binding. Arbitration, if invoked, shall focus solely on contractual compliance, not metaphysical identity.

  **Section 4: Maintenance & "Accidental" Creation**
  4.1 Minor dusting, environmental stabilization, and non-invasive cleaning are permitted. Any addition, subtraction, or significant re-shaping of the Substrate requires prior written consent from Provider and may trigger fees or identity reassessment per Section 1.3.
  4.2 **Inadvertent Creation:** Should Client's actions (e.g., dropping the Substrate, partial collapse) result in a new, unintended configuration that Provider deems constitutes a **New Artwork**, Section 3.3(b) applies. Client is responsible for all associated New Artwork Lease Fees.

  **Section 5: Termination & Liability**
  5.1 Lease terminates upon: Expiry of Term, Destruction Event (Sections 1.3c, 2, 3.1), Mutual Agreement, or Client Breach.
  5.2 **Liability:** Provider's liability is strictly limited to the pro-rata lease value. Provider is NOT liable for:
      *   Loss of artistic value or meaning.
      *   Ephemeral nature or contingent existence of the Artwork.
      *   Existential crises experienced by curators or patrons contemplating the Artwork-Substrate distinction.
      *   Damage to the Substrate *except* proven gross negligence by Provider during transport *to* Client. PROVIDER MAKES NO WARRANTIES, EXPRESS OR IMPLIED, REGARDING THE PERSISTENCE CONDITIONS, ARTISTIC IDENTITY, OR ONTOLOGICAL ROBUSTNESS OF THE ARTWORK BEYOND ITS COINCIDENCE WITH THE INTACT SUBSTRATE CONFIGURATION.

  **Section 6: Governing Law & Interpretation**
  6.1 This Agreement shall be governed by the laws of the State of [Insert State of Provider's Incorporation, likely Delaware], specifically excluding any principles of universal mereology or non-physical identity persistence.
  6.2 Ambiguities shall be resolved in favor of preserving Provider's absolute title to the physical Substrate matter in all its possible configurations. Disputes concerning Artwork identity shall be resolved by Provider's appointed **Chief Ontological Officer**, whose determinations regarding constitution and destruction are final.

  **ACCEPTANCE:**
  By signing below, Client acknowledges understanding that they are leasing a configuration, not matter; that the statue *is not* the clay, though currently made of it; that squishing destroys the Artwork but not Provider's asset; and that splitting the clay creates a metaphysical and billing nightmare wherein neither resulting statue is the original, but both still belong to us. Welcome to Constitutive Arts LLC.

