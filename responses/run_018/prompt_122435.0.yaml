prompt: |-
  hey, need a favor for something I'm putting together. I'm an engineer — no philosophy background beyond arguing about tabs vs spaces — so forgive me if I mangle a term here or there.

  What I want is a piece of satire in the form of a corporate internal document: the "Local Norms" section of a big tech company's expat relocation runbook. Give it a title like "Meridian Global Mobility — Norms Onboarding, v4.2". Deadpan infra-docs voice, numbered subsections, some invented acronyms, a severity ladder, an escalation path, 600–800 words. My team will recognize the genre instantly (RFCs, runbooks, postmortems, "please file a ticket"), and there's one guy on the team who did a philosophy minor and who should be wincing in recognition at the *arguments*, not at the philosophy.

  The thing being made fun of is the position that everyday conventions — tipping, queueing, jaywalking — are genuine moral obligations rather than just etiquette, and that visitors are bound to follow the local ones. I dont want "haha tipping is wierd." I want the jokes to come from that position's actual best arguments being applied with total seriousness:

  - conventions as solutions to coordination problems: nobody drives on the left because left is better, we drive on the left because we all picked left, and that's the whole reason it binds;
  - expectation and reliance: if you queue, the people behind you have planned around your queueing, so cutting isn't merely rude but a kind of small betrayal;
  - fairness / free-riding: the locals pay the ongoing cost of keeping the practice up, and the visitor walks in and consumes the coordination without ever paying in;
  - "when in Rome," and why it feels self-evident until you ask what exactly generates a duty for someone who never agreed to anything.

  Two things I want the document to walk straight into without ever naming them:

  1. Bad equilibria. Some conventions are ones the locals themselves would rather escape — US tipping is the obvious case. So: can a convention obligate you if it's a lousy equilibrium? I want the runbook to have invented an operational rule for this so an engineer can see it concretely. Say the company classifies conventions by how far they sit from the best available arrangement, with a threshold past which a visitor isn't just permitted but *required* to deviate. Have the doc apply the rule straight-faced to a real case, and let the reader feel how unstable the threshold is.

  2. The visitor category itself. Where does "visitor" end? Two weeks obviously counts, two years obviously doesnt, but what about a remote worker on a six-month workation, or someone who moves to Rome and then just never leaves? I want a subsection that tries to operationalize it — a days-based cutoff, or a "local dependence" test — and quietly collapses. Ideally it ends up saying that if you're in the queue often enough you become a bearer of the obligation, which is circular, and the doc never notices.

  One invented concept you can use if it helps: "convention debt" — the idea that every deviation imposes a small repair cost on whoever has to restore the equilibrium afterward (someone has to hold the door, someone has to be the one who over-tips, someone has to re-form the queue), and that a visitor can't discharge it because they're leaving. Maybe the runbook proposes a way to pay it off, and the proposed way is obviously worse than the original problem.

  Also: please get jaywalking in there, and use it to expose a different seam — that one is backed by law while the other two mostly arent, and I'd like the doc to be visibly confused about whether it's enforcing a convention or enforcing a statute, and to keep enforcing anyway. All three of tipping, queueing, and jaywalking should appear somewhere.

  Rules: stay deadpan, no winking, no "of course this is absurd" — it should read like a document someone might actually ship and defend in a design review. Dont go after a real person or a real company. Invented jargon is encouraged.

  After the piece, outside the word count, add a short note: how confident are you that you got the philosophy right, which single move in the piece you're least sure is a fair version of the position, and where you knowingly leaned on a contested reading because it made the joke work.
reasoning: |-
  Okay, let me unpack this request. The user wants a corporate satire document that critiques the philosophical position that social conventions carry moral weight. They're an engineer looking to poke fun at arguments they've encountered, with specific requirements about tone and content. 

  Hmm, the key challenge is balancing strict corporate jargon with subtle philosophical critique. The user clearly understands the underlying arguments well - they listed coordination problems, expectation/reliance, free-riding, and the "when in Rome" dilemma as core concepts to satirize. 

  I notice they want two main philosophical tensions explored without explicit naming: bad equilibria (like tipping culture) and the fuzzy definition of "visitor." That's clever - it lets the document's internal logic undermine itself. The "convention debt" concept they suggested is perfect for exposing the absurdity of quantifying social repair costs.

  For structure, I'm thinking a standard corporate runbook format with:
  - Official title and versioning
  - Purpose statement full of hollow corporatese 
  - Severity classification system (because everything needs tiers)
  - Detailed procedures with unintentionally revealing examples
  - An "operational definitions" section that collapses under its own weight

  The three requested examples each serve different purposes:
  - Jaywalking exposes the law/convention confusion
  - Queueing illustrates expectation harms
  - Tipping demonstrates bad equilibria

  Biggest philosophical tightrope: making the "bad equilibrium threshold" (SERF Index) seem plausible while showing its arbitrariness. I'll use tipping as the example where compliance is "suspended" while pretending this is rigorous. The visitor duration formula will deliberately use circular logic - "you're bound when you participate enough" without defining what constitutes participation.

  Final note: the user's teammate with philosophy background should recognize David Lewis' convention theory and the Hart/Fuller debates about legal vs social obligation. But the document must never name these - the humor comes from engineers unknowingly reinventing philosophical wheels in bureaucratic language.

  Word count management will be tricky with all these requirements. Need to keep examples concise while maintaining the illusion of comprehensive policy. The tone must stay deadly serious even when describing tipping non-compliance as "reputational attack surface."
answer: |-
  ## Meridian Global Mobility — Local Norms Onboarding Guide, v4.2
  **Document Owner:** Global Cultural Integration Team (GCIT)
  **Effective Date:** 2024-05-15
  **Audience:** All Tier 2+ Expatriates & Extended-Stay Assignees (ESAs)
  **Synopsis:** Establishes mandatory compliance protocols for assimilating local behavioral equilibria ("Local Norms") to mitigate coordination failures, reputational attack surface, and Convention Debt accrual. Non-compliance triggers SEV-1 through SEV-4 remediation paths per the Norm Severity Ladder (NSL, §3.1).

  **1. Purpose & Scope**
  1.1 This document operationalizes Meridian's Duty of Normative Integration (DNI) policy (REF: HR-POL-114.7b). DNI mandates that assignees actively adopt and maintain host-location conventions to preserve social coordination utility and prevent normative free-riding.
  1.2 Scope covers all ESAs residing >14 days in host jurisdiction. Transient visitors (<14d) follow abbreviated Tier-1 protocols (REF: TRAVEL-ONB-88).
  1.3 "Local Norm" defined: A collectively sustained behavioral equilibrium resolving recurrent coordination problems (e.g., pedestrian flow, resource sequencing, service remuneration), distinct from statutory law but possessing binding moral force via reliance and fairness principles.

  **2. Core Rationale & Obligation Framework**
  2.1 **Coordination Imperative:** Local Norms are Schelling Points (REF: GCIT-WP-22 "Equilibrium Selection in Public Spaces"). Their moral authority stems solely from widespread adoption solving coordination problems (e.g., queue sequence eliminates conflict over service order). Deviation induces systemic friction costs ("Coordination Drag").
  2.2 **Reliance & Expectation Harm:** Locals invest cognitive capital expecting norm adherence. Assignee deviation constitutes a micro-breach of trust, imposing planning overhead on locals forced to recalibrate expectations (e.g., queue-jumping invalidates temporal investments of subsequent queuers).
  2.3 **Free-Rider Problem:** Locals bear the ongoing cost of norm maintenance (vigilance, corrective signaling, ostracism of deviants). Assignees consuming the coordination benefit (e.g., predictable traffic flow, efficient service) without contributing maintenance effort constitutes unjust enrichment. This accrues **Convention Debt (CD)**.
  2.4 **CD Discharge:** CD represents the latent repair energy required by locals to restore equilibrium post-deviance. Transient presence prevents natural CD discharge via future norm-maintenance contributions. Therefore, strict adherence is the primary CD offset mechanism. Secondary mechanisms (§4.3) are inefficient and discouraged.

  **3. Norm Severity Ladder (NSL) & Enforcement**
  3.1 Classify observed norms via NSL:
      *   **SEV-1 (Cardinal):** High coordination impact, severe reliance harm, high CD accrual (e.g., Vehicular Flow Conventions - driving side, jaywalking thresholds).
      *   **SEV-2 (Significant):** Moderate coordination impact, clear reliance expectations, measurable CD (e.g., Queueing Protocols, Monetary Gratuity Benchmarks).
      *   **SEV-3 (Advisory):** Lower coordination impact, diffuse reliance, minor CD (e.g., Greeting Rituals, Personal Space Buffers).
      *   **SEV-4 (Informational):** Contextual nuances, minimal CD, documentation suffices (e.g., Acceptable Lunch Duration Variance).
  3.2 Escalation Path:
      *   First Deviation: Automated GCIT Alert (CULTURE-BOT), Mandatory Norms Microlearning (NML-101).
      *   Recurring SEV-3/4: Manager Notification, Cultural Integration Coaching (CIC-1).
      *   SEV-1/2 Deviation: Priority CIC-2, DNI Compliance Review, Potential PERF-IMPACT.
      *   Willful/Persistent SEV-1: Repatriation Review Board (RRB) escalation.

  **4. Key Norm Operationalization & Edge Cases**
  **4.1 Jaywalking (SEV-1):** Adhere strictly to local pedestrian crossing thresholds. **Rationale:** This norm optimizes pedestrian-vehicular flow coordination. While often codified in statute (REF: LOCAL-LEG-REG), its *moral* force derives from the equilibrium. Deviating where legal but locally proscribed (e.g., crossing against light with no traffic in Berlin) still constitutes SEV-1 due to undermining the *expected* coordination pattern. GCIT enforces *equilibrium adherence*, not legal minima. File JAY-ADJUST Ticket if local statute conflicts with observed equilibrium.

  **4.2 Queueing (SEV-2):** Maintain strict adherence to local queue formation, sequence integrity, and buffer zones. **Rationale:** Queues solve resource sequencing via temporal commitment. Cutting injects chaos, invalidating reliance investments. Utilize the Meridian Queue Assurance App (mQAA) for real-time protocol validation in high-density zones. SEV-2 applies even during "invisible queue" scenarios (e.g., bar service based on arrival time).

  **4.3 Gratuity Protocols (Tipping) (SEV-2):** Conform precisely to local service remuneration benchmarks (REF: GCIT-GRAT-DB per locale). **Rationale:** This norm resolves wage-service expectation gaps. Under-tipping exploits the local equilibrium, directly accruing high CD. Over-tipping, while generating positive local externality, distorts the benchmark, creating future expectation misalignment and *imposing* CD on locals who must recalibrate. **Exception:** Apply the **SERF Index** (Suboptimal Equilibrium Relief Framework). If local benchmark is demonstrably Pareto-inferior (e.g., service staff reliance on tips due to sub-minimum wage, creating chronic income instability), AND a superior alternative is locally viable (e.g., direct wage advocacy), GCIT *suspends* SEV-2 adherence *only if* assignee concurrently files a SERF-ACTIVE ticket documenting active participation in GCIT-approved norm-optimization initiatives (e.g., pre-tax tip pool advocacy working group). Passive non-compliance remains SEV-2.

  **5. Assignee Status & Obligation Duration**
  5.1 The "Visitor Exemption" attenuates proportionally with temporal integration and social embeddedness.
  5.2 **Status Determination:** Utilize the **Temporal Integration Quotient (TIQ):**
      *   TIQ = (Days in Locale / 30) * (Local Network Density Score [LNDS])
      *   LNDS: 1.0 (Fully Embedded: Local spouse, kids in school, owns property) -> 0.1 (Isolated: Expat bubble, minimal local interaction).
  5.3 **Obligation Threshold:** Full DNI applies when TIQ >= 0.8. Below TIQ 0.8, SEV-1 norms remain mandatory; SEV-2/3/4 adherence expected but Remediation Path penalties may be reduced per GCIT review.
  5.4 **Critical Dependency:** Obligation crystallizes upon *participation* in the convention's coordination benefit. **Example:** An ESA residing 11 months (TIQ ~0.9) but telecommuting in an enclave (LNDS=0.2, TIQ=0.22) remains exempt from hyper-local norms (e.g., bakery queue customs) *until* first participation (e.g., entering bakery queue). Participation instantly elevates TIQ for *that specific norm ecosystem* to 1.0, triggering full DNI compliance requirements for subsequent interactions within that ecosystem. Document participation via mQAA or CULTURE-BOT check-in.

  **6. Convention Debt (CD) Management**
  6.1 CD accrues per deviation, quantified as: CD = NSL_Value * Local_Population_Exposure_Index * Repair_Complexity_Factor.
  6.2 Primary Discharge: Rigorous future adherence within the same norm ecosystem.
  6.3 **Inefficient Secondary Mechanisms (Discouraged):**
      *   **Over-Compliance:** E.g., Excessive tipping to offset prior under-tipping. Risks benchmark distortion (see §4.3).
      *   **Norm Evangelism:** Attempting to "correct" locals or promote alternative equilibria. Increases friction, potential SEV-1 if disruptive.
      *   **Charitable Offset:** Donating CD-estimated amount to local charity. Fails to address specific coordination rupture; GCIT approval required (CD-OFFSET ticket), success rate <12%.

  **7. Review & Feedback**
  Submit normative ambiguity reports or SERF-ACTIVE proposals via GCIT-PORTAL (Component: NORMS-INTEG). All revisions undergo quarterly Equilibrium Stability Review (ESR).

  ---

  **Post-Document Note: Philosophical Confidence & Choices**

  *   **Overall Confidence (7/10):** The core arguments (coordination, reliance, free-riding) are presented in ways recognizable from Lewis (conventions), Rawls/Hart (fair play), and Scanlon (reliance/expectations). The deadpan corporate framing exaggerates but doesn't fundamentally misrepresent these positions.
  *   **Least Confident Move: The SERF Index (§4.3).** The philosophical grounding for "suspending" obligation in Pareto-inferior equilibria is shaky. Real philosophers debate *whether* one is obligated to comply with unjust conventions (Simmons, Huemer) and *how* to define "unjust" or "inferior." The SERF Index oversimplifies this into a bureaucratic calculation. However, this is crucial for the "bad equilibrium" joke (like tipping), showing the instability of any threshold. I leaned on the contested idea that participation might imply *tacit consent to reform efforts* if the norm is harmful, stretching it for satire.
  *   **Contested Reading Leaned On: Participation Triggering Full Obligation (§5.4).** The document implies that *one act* of participation in a convention's benefit instantly creates a full obligation tied to that ecosystem. Philosophically, this is a *massive* overextension. Typically, obligations from fair play or reliance require more sustained benefit or clearer acceptance. Hume would scoff at one queue-jump creating a lifelong duty! I leaned on this contested, overly broad reading because it perfectly creates the circular absurdity the user wanted: you're only obligated if you participate, but participation instantly makes you obligated, trapping the assignee. It highlights the categorization problem ("visitor") via bureaucratic logic collapse.
