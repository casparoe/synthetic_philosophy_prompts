answer: |-
  ## Research Proposal: Dissociating Precision – Towards a Dual-Mechanism Account in Predictive Processing

  **Workshop Topic:** Philosophical Implications of Predictive Processing in the Mind Sciences

  **Proposed Title:** Sensory Precision vs. Policy Precision: A Necessary Distinction Within the Free-Energy Framework?

  **Duration:** Four Months

  **1. Research Question:**
  Does the Free-Energy Principle's (FEP) treatment of precision-weighting as a single, uniform mechanism governing both the influence of interoceptive prediction errors (sensory precision) and the weighting of prior beliefs over action sequences (policy precision) obscure a substantive functional distinction, potentially necessitating a revision of the FEP account to fully accommodate dissociative phenomena observed in conditions like somatic symptom disorder (SSD) and depersonalisation, and thereby challenging the claim that all adaptive behaviour is unified *solely* under a single free-energy minimisation scheme?

  **Why Existing Debates Leave This Open:**
  *   **Expected Free Energy (EFE) & Active Inference:** While EFE elegantly formalises policy selection as minimising expected surprise, its treatment of precision remains monolithic. Precision optimises the influence of *all* prediction errors relative to priors within the generative model, implicitly bundling sensory (including interoceptive) and policy-related precision. Debates focus on EFE's ability to resolve the 'dark-room problem' (avoiding unsurprising yet maladaptive states) or on different formulations of value, but they do not systematically interrogate the *architectural assumption* that a single precision mechanism suffices for both sensory acuity *and* the confidence driving policy commitment. The dark-room problem highlights issues with motivation under uncertainty but doesn't isolate the potential independence of mechanisms governing *how* uncertainty is resolved (sensory sampling vs. policy execution).
  *   **The Standard FEP Account:** The canonical formulation presents precision as a single (set of) variational parameter(s) optimised under the FEP. While hierarchical models implement precision at different levels, the core mechanism regulating prediction-error influence is treated uniformly across sensory and policy domains. Existing critiques often target the scope of the FEP itself or specific modelling choices, but the potential *internal dissociation* within the precision mechanism, particularly concerning action policies versus interoceptive sensation, remains largely unexamined within the formal framework. The clinical dissociations in SSD/depersonalisation (hyper-acute interoception coupled with policy indecision/inertia) present a specific challenge to this uniformity that hasn't been directly addressed.

  **2. Research Approach (Stage-by-Stage):**

  *   **Month 1: Conceptual Groundwork & Phenomenological Mapping:**
      1.  Precisely define the proposed distinction: "Sensory Precision" (γₛ) as the gain applied to *interoceptive* prediction errors (refining bodily signal estimation); "Policy Precision" (γₚ) as the gain applied to predictions (priors) over *action sequences/policies* (reflecting confidence in committing to a course of action).
      2.  Analyse the clinical phenomena: Map the core features of SSD (heightened bodily attention/distress, avoidance/passivity) and depersonalisation (altered bodily ownership, behavioural disengagement) onto the PP framework, explicitly arguing how they manifest a *dissociation* between heightened γₛ (leading to amplified interoceptive PE) and attenuated γₚ (leading to failure to engage uncertainty-reducing policies).
      3.  Formal Translation: Express the distinction conceptually within the standard Active Inference (FEP) formalism. Identify the specific variational parameters/variables in standard formulations that would need to be decoupled.

  *   **Month 2: Formal Exploration & Internal Critique:**
      1.  **The Collapse Argument:** Rigorously examine the mathematical and conceptual grounds within the standard FEP formulation for treating precision as uniform. Can γₛ and γₚ be formally separated without violating core FEP axioms? Does the minimisation of free energy *necessitate* their coupling, or is the coupling merely a simplifying assumption in existing models? Analyse the flow of information and precision dynamics in standard policy selection (e.g., using EFE).
      2.  **Dissociation Challenge:** Construct a formal argument demonstrating why the observed clinical dissociation (high γₛ + low γₚ) is *problematic* for the standard single-precision account. What auxiliary assumptions or *ad hoc* fixes would the standard model require to explain it? (e.g., positing separate but linked precision hierarchies without independent optimisation, or complex pathological priors *indirectly* causing the dissociation).

  *   **Month 3: Evaluating Architectural Revisions & Implications:**
      1.  **Proposing a Revision:** If the formal critique suggests the collapse is notational/substantive, sketch a revised generative model architecture incorporating distinct, independently optimised γₛ and γₚ parameters. Formalise how each would be updated under the FEP (e.g., γₛ based on interoceptive reliability estimates, γₚ based on confidence in policy outcomes estimated via EFE). Explore potential interaction points.
      2.  **Feasibility & Integration:** Assess the computational and conceptual coherence of this dual-precision architecture. Does it retain the core FEP commitment to variational Bayes and surprise minimisation? Can it generate the desired dissociation *without* auxiliary hypotheses beyond pathological initial conditions or priors?
      3.  **Unity of FEP Challenge:** Evaluate the implications for the FEP's claim to unify perception and action under one principle. Does the revision merely add complexity, or does it fundamentally suggest that minimising free energy *requires* distinct precision mechanisms for distinct functional domains (sensation vs. action commitment), potentially fracturing the "single principle" claim?

  *   **Month 4: Synthesis, Implications, and Refinement:**
      1.  Consolidate findings: Clearly state whether the evidence supports the necessity of the distinction and the viability of the revised architecture.
      2.  Explore broader implications: How does this distinction impact understanding of conditions like anxiety, OCD, or functional neurological disorders? What does it suggest about the nature of "confidence" in PP? Does it offer new perspectives on volition or agency within the framework?
      3.  Refine the proposal: Polish the arguments, formal sketches, and implications for the workshop presentation and potential publication. Explicitly outline remaining open questions.

  **Why Philosophical Method (Conceptual & Formal Analysis):**
  This question is fundamentally *conceptual* and *architectural* within the PP framework. While empirical clinical studies can *describe* the dissociation (SSD/depersonalisation), they cannot adjudicate whether its explanation *within PP* requires a revision of the core formalism. Pure computational modelling could implement distinct precisions, but without philosophical/conceptual analysis, it risks being *ad hoc* or missing the implications for the FEP's foundational claims. This project requires dissecting the *meaning*, *necessity*, and *formal coherence* of the proposed distinction *within the existing theoretical commitments* of PP and the FEP, a task uniquely suited to philosophical methodology integrating conceptual clarity with formal rigour. It provides the necessary groundwork to inform *future* targeted empirical studies or specific computational models.

  **3. Success & Failure Criteria:**

  *   **Successful Result:** Demonstrating that the standard uniform precision account *cannot* naturally accommodate the SSD/depersonalisation dissociation without significant auxiliary assumptions or inconsistencies, *and* providing a formally coherent revised generative model architecture incorporating independently optimised γₛ and γₚ that predicts such dissociation as a direct consequence of their pathological settings. This would substantiate the distinction and necessitate a refinement of how the FEP unifies perception and action.
  *   **Failure:** Demonstrating that the proposed distinction between γₛ and γₚ is either:
      1.  **Formally Incoherent:** Logically incompatible with core FEP principles (e.g., variational Bayes, surprise minimisation).
      2.  **Unnecessary:** Showing that the dissociation can be fully explained within the standard single-precision framework using existing mechanisms (e.g., complex hierarchical interactions, specific prior pathologies) without needing separate variational parameters. The distinction would collapse back into the standard formulation.
      3.  **Merely Notational:** Proving that "sensory precision" and "policy precision" are just descriptive labels for different *contexts* of the same underlying precision optimisation process, with no substantive functional independence required.

  **4. Honest Scope Assessment:**
  To maintain feasibility within four months, the project must explicitly bracket:
  *   **Detailed Neuroanatomical Implementation:** While inspired by clinical phenomenology, the focus is on the *computational* architecture within PP, not mapping γₛ/γₚ precisely onto specific neural substrates or circuits.
  *   **Comprehensive Clinical Review/Diagnosis:** The project relies on established clinical *descriptions* of SSD and depersonalisation as exemplars of the dissociation. It will not conduct new clinical analysis or delve deeply into diagnostic debates.
  *   **Full Computational Simulation:** The project involves *formal sketching* and *analysis* of a revised model, not building and running large-scale simulations. It aims for conceptual/formal plausibility, not full empirical validation via simulation.
  *   **Comparison with All Alternative PP Models:** The focus is primarily on the standard Active Inference/FEP formulation. While acknowledging variants, the core argument engages with the canonical framework.
  *   **Resolving All Challenges to FEP Unity:** The project specifically targets the potential fracture point introduced by precision dissociation. It will not attempt to resolve other challenges to the FEP's unifying claims (e.g., consciousness, social cognition).

  **Summary:** This proposal argues that the Free-Energy Principle's uniform treatment of precision obscures a necessary functional distinction between sensory and policy precision, which dissociates in certain psychopathologies, and investigates whether accommodating this requires revising the FEP's core architecture and its claim to unify all adaptive behaviour under a single minimisation scheme.
