prompt: |-
  I'm helping a friend run a philosophy reading group for sharp undergrads who've done some ethics but zero phil of mind. Next session is on whether we should care about insects given the scale argument -- you know, billions of them times a tiny chance of sentience. But I want to frame the whole thing through this idea I'm calling radical uncertainty budgeting, where moral risk works like an insurnace portfolio rather than a binary switch on consciousness. Don't explain it to me; plan the teaching arc. What concept has to be in place before the scale argument even registers? What's the one carrying exmaple -- and why shouldn't I just open with the more-insects-than-humans figure? The students will definately raise theyre just automatons and I think they'll confuse expected value with actual moral weight; lay out the misconceptions in the order they'll hit me and exactly where in the sequence to defuse each. Give me one check question at the end that shows whether they've bought the budgeting frame or just left feeling guilty about stepping on ants. Also say explicitly what consciousness literature we're bracketing for this session, and don't ask for readings -- they won't have access anyway. (Drafting quick on my phone so a typo or two is fine.)
reasoning: |-
  Okay, let's tackle this philosophy reading group session plan. The user wants to frame insect ethics through "radical uncertainty budgeting" - treating moral risk like an insurance portfolio rather than a binary consciousness switch. 

  First, I need to identify the foundational concept. Before students can grasp the scale argument (billions of insects × tiny chance of sentience), they must understand probability-weighted moral weight. Without this, the "more insects than humans" figure is meaningless - it might just reinforce the "they're automatons" instinct. 

  The carrying example should be something relatable but non-insect to avoid triggering preconceptions. Maybe driverless cars: even with 0.1% failure risk, we demand safety measures because catastrophic outcomes scaled by probability still matter. This shows how low-probability/high-stakes scenarios require precaution without committing to sentience claims.

  Anticipating misconceptions:
  1. "Automatons!" objection will hit immediately when introducing insects. Best to defuse during the driverless car example by emphasizing we're bracketing consciousness debates.
  2. Confusing expected value with moral weight will emerge during scale argument calculations. Need to clarify that expected value is the tool, not the conclusion - the moral weight is inherent in the being.
  3. Probability neglect might surface when discussing tiny chances. Should emphasize that radical uncertainty budgeting specifically addresses this by aggregating risks.

  For the check question: "Would you apply the same risk-budgeting logic to extraterrestrial AI?" This tests if they internalized the framework beyond insect guilt. A good answer would focus on the structure of uncertainty management rather than emotional response.

  Consciousness literature to bracket: Chalmer's hard problem, Nagel's "what it's like", all phenomenal consciousness debates. We're assuming for this session that we can assign probabilities without resolving metaphysics.

  The teaching arc should flow: 
  1) Probabilistic moral weight foundation 
  2) Non-insect carrying example 
  3) Scale argument application 
  4) Uncertainty budgeting framework 
  5) Targeted misconception addressing

  This keeps the focus on risk management logic rather than getting stuck in consciousness debates or emotional reactions.
answer: |-
  Here's a tight teaching arc designed to build the "radical uncertainty budgeting" frame and preempt pitfalls:

  ### Core Sequence & Misconception Management
  1. **Anchor Concept: Probabilistic Moral Weight**  
     *Why first?* Without grasping that moral consideration can be fractional (not binary), scale arguments feel irrelevant.  
     *Tool:* "Tiny Sentience Probability" (TSP) – e.g., *"If a being has a 0.001% chance of feeling pain, how should we value avoiding its suffering?"*  
     *Preempts:* "They're just automatons!" by making uncertainty the starting point. Defuse here: *"Even if you think insects are 99.999% automaton, what do we owe the 0.001%?"*

  2. **Carrying Example: Driverless Car Dilemma**  
     *Why not open with insects?* Insects trigger disgust/automaton reflexes prematurely. Use an *impartial* analogy:  
     *"A driverless car must choose routes. Route A has a 0.0001% chance of killing a hidden pedestrian. Route B is safer but adds 1,000 hours of global commute time. How do we weigh the risk?"*  
     *Key:* Shows low-probability/high-harm vs. high-probability/low-harm trade-offs. Introduces *aggregate risk* (probability × harm × population).

  3. **Scale Argument Deployment**  
     *Now introduce insects:* "Apply this to insects. Assume a tiny TSP (e.g., 10^-6). With 10^19 insects alive, what's the expected moral weight?"  
     *Preempts:* Confusing expected value with intrinsic moral status. Clarify: *"Expected value isn't a claim insects *are* conscious—it's a tool for managing risk under uncertainty, like insuring against unlikely disasters."*

  4. **Radical Uncertainty Budgeting Frame**  
     *Analogy:* "Treat moral risk like an insurance portfolio. We diversify: some resources to high-probability beings (humans), some to low-probability/high-scale beings (insects). No 'on/off' switch—allocate based on *total expected impact*."  
     *Preempts:* "But we can't *know*!" → *"This framework is for *acting under ignorance*. We 'budget' precisely because proof is impossible."*

  ### Bracketed Consciousness Literature
  Explicitly exclude:  
  - Hard problem of consciousness (Chalmers)  
  - Specific theories of phenomenal consciousness (e.g., IIT, Global Workspace)  
  - Neuroanatomical debates (e.g., insect brain structures)  
  *State:* "We assume *only* that consciousness is *possible* in some systems, not how or why."

  ### Check Question
  **"If we discovered trillions of Martian micro-robots with even lower TSP than insects, should our uncertainty budget adjust? Why/why not?"**  
  - *Buys the frame:* Yes—scale compels recalibration, even if robots feel less plausible. Focus on risk aggregation.  
  - *Misses the frame:* No (too alien/unlikely) or focuses *only* on guilt (e.g., "we shouldn't play god").  

  ### Why This Sequence Works
  - **Builds cognitive scaffolding:** Probability → Non-emotive analogy → Insect application → Budgeting metaphor.  
  - **Targets objections:** Automaton reflex defused early, expected value/moral weight distinction modeled preemptively.  
  - **Forces conceptual shift:** From "Do they matter?" to "How do we allocate scarce moral resources amid uncertainty?"  

  *Tip:* When insects come up, validate disgust ("Yes, many react this way!") but pivot to *"Does disgust change the risk calculation?"* to maintain analytical focus.
