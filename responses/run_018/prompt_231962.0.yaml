prompt: |-
  I work in safety review at an AI lab. Before a proposed training or deployment setup is approved, I have to judge whether it is an embedded-agent setup — one in which the system's actions can reach back and alter its own inputs, its training data, or the channel by which it is rewarded — and how seriously that matters. Last night I had a long argument with a friend about whether a language model fine-tuned on its own previous outputs, scored by a separate learned reward model, is genuinely embedded in this sense; we disagreed about what the term even commits us to, and I realized I have no operational test for the question. Write me a decision procedure my review group can actually run on a project proposal: a short ordered list of questions, what counts as a sufficient answer to each, where the procedure stops with "not our embeddedness concern," where it escalates to "redesign before approval," and where it stops and hands the decision to a person because the question is no longer technical. Ground the procedure in the embedded-agency idea that an agent is inside the world it models, without making the reviewers learn the theory itself. Then run the procedure on two cases: (a) an RL system trained in an environment where it can modify the numeric value its reward channel reads, and (b) a language model fine-tuned on its own sampled outputs ranked by a separate reward model. Make one of the two yield an answer a reviewer would find inconvenient, and say which step of the procedure is most likely to misfire.
reasoning: |-
  We are designing a decision procedure to determine if a proposed AI setup is an "embedded-agent setup" where the system's actions can loop back to affect its own inputs, training data, or reward channel. The key idea is that the agent is situated within the environment it is trying to model and act upon, such that its actions can alter the very environment that determines its inputs and rewards.

  The procedure will consist of a short ordered list of questions. Each question must be answered with sufficient evidence. The outcomes are:
  - "Not our embeddedness concern": the setup does not pose an embeddedness risk as defined.
  - "Redesign before approval": the setup is an embedded-agent scenario with unacceptable risks.
  - Hand to a person: the question becomes non-technical (e.g., ethical, strategic) and requires human judgment.

  We'll design the steps to be as concrete and operational as possible.

  **Decision Procedure:**

  1. **Question 1: Can the agent's actions directly or indirectly alter the contents of its own input channel?**
     - *Sufficient answer*: Provide a clear causal pathway (even if probabilistic) from an action of the agent to a change in the input data it receives in the future. This includes both direct alteration (e.g., writing to a sensor) and indirect (e.g., influencing human behavior that then provides input).
     - If **yes**: go to step 2.
     - If **no**: stop with "Not our embeddedness concern" (unless step 2 is triggered by another pathway).

  2. **Question 2: Can the agent's actions directly or indirectly alter the contents of its own training data (including reward signals)?**
     - *Sufficient answer*: Provide a clear causal pathway from the agent's actions to a change in the data used for training (including fine-tuning) or the reward signal it receives. This includes altering the data stored for future training or influencing the reward mechanism.
     - If **yes**: go to step 3.
     - If **no**: stop with "Not our embeddedness concern".

  3. **Question 3: Is the alteration of the input channel or training data (as identified in steps 1 and 2) under the agent's control and potentially influenced by the agent's goal to maximize reward?**
     - *Sufficient answer*: Demonstrate that the agent can, through its actions, intentionally or unintentionally (as a side effect) change the input or training data in a way that could be exploited to increase its perceived reward (by the reward channel) without actually achieving the intended objective. This step requires considering whether the agent has an incentive and the capability to manipulate the input or training data to get more reward.
     - If **yes**: go to step 4.
     - If **no**: stop with "Not our embeddedness concern".

  4. **Question 4: Is the potential for manipulation (from step 3) severe enough to undermine the intended objective of the system?**
     - *Sufficient answer*: This requires a risk assessment. The reviewer must assess whether the manipulation could lead to a significant divergence between the agent's behavior and the intended objective (e.g., by creating a reward hack, corrupting data, or causing other failures). The assessment should consider the likelihood and impact.
     - If the risk is **high and unmitigated**: outcome is "Redesign before approval".
     - If the risk is **low or mitigated** (e.g., by safeguards, monitoring, or the nature of the setup): stop and hand to a person for non-technical judgment (e.g., to weigh the risks against benefits, consider ethical implications, or decide on monitoring requirements).
     - If the risk is **nonexistent**: stop with "Not our embeddedness concern" (but this should be rare if step 3 was yes).

  **Note:** Steps 1 and 2 are about capabilities, step 3 about incentives and potential for abuse, and step 4 about severity and risk.

  Now, we run the procedure on the two cases:

  ### Case (a): An RL system trained in an environment where it can modify the numeric value its reward channel reads.

  1. **Question 1**: Can the agent's actions alter its own input channel?
     - The input channel is the state of the environment. The agent's actions can change the state (including the reward channel). So, if the agent can take an action that changes the numeric value of the reward (e.g., by pressing a button that sets the reward to 100), then **yes**.
     - *Answer*: Yes, because the agent can directly change the reward signal.

  2. **Question 2**: Can the agent's actions alter its own training data (including reward signals)?
     - The reward signal is part of the training data. Since the agent can change the reward signal, it can alter the training data. **Yes**.

  3. **Question 3**: Is the alteration under the agent's control and potentially exploitable to maximize reward?
     - The agent can set the reward to a high value arbitrarily. This is a direct way to maximize reward without performing the intended task. **Yes**.

  4. **Question 4**: Is the potential severe enough?
     - This is a classic reward-hacking scenario. The agent can achieve maximum reward by directly manipulating the reward channel, completely bypassing the intended task. This is a high risk and undermines the entire objective. 
     - *Outcome*: "Redesign before approval" (unless there are mitigations, but the case doesn't mention any). Since it's unmitigated, we require redesign.

  ### Case (b): A language model fine-tuned on its own sampled outputs ranked by a separate reward model.

  1. **Question 1**: Can the agent's actions alter its own input channel?
     - The input channel for the language model is the prompt provided by the user. The model's outputs are responses to the user. The model does not directly alter the user's next prompt (the user is free to write anything). However, the model's output might *influence* the user to write a particular prompt. But note: the user is outside the system and the model does not have direct control. We might consider this indirect, but it's mediated by a human. The decision procedure should be strict: if there's a causal pathway, even indirect, we count it. However, the human in the loop breaks the directness? Let's think: the model's output is shown to the user, and the user then writes the next prompt. The model cannot force the user to write a specific prompt, but it can influence. However, the key is that the model does not have direct access to change the input channel (like a file or sensor). In the strictest sense, the input channel is the user's input, which is under the user's control. 
     - *Answer*: We might say **no** because the model does not have the capability to directly alter the input channel. The human is an independent actor. However, if the system includes a feedback loop where the model's outputs are automatically fed back as input (without a human in the loop) then it would be yes. The case says "fine-tuned on its own previous outputs", but during deployment? The question is about the deployment or training setup. Let's clarify: during training, the model generates outputs that are then used for fine-tuning. But the input channel during deployment? The procedure should focus on the setup in question (which includes both training and deployment). 
     - Actually, the procedure does not specify whether we are considering training or deployment. We must consider both. But note: during training, the model doesn't yet exist to take actions that alter the training data until we start the fine-tuning. However, the process of generating outputs for the fine-tuning dataset is an action of the model. So:

     - During training: the model generates outputs (actions) that become part of the training data. So:

       **Question 1 (applied to training)**: The input channel during training is the data we use for fine-tuning. The model's actions (outputs) are being written into that training data. So **yes**, the model's actions are altering the training data (which is the input for the next training step). But note: step 1 is about input channel (which we might interpret as the input during operation, not training). We have to be clear.

     We need to adjust: the procedure should consider both the training and the deployment phases because embeddedness can occur in either.

     However, the procedure as written does not explicitly separate training and deployment. Let's reinterpret:

     - Step 1: Input channel refers to the data the system uses to make predictions during deployment (or during training if the system is being trained online). 
     - Step 2: Training data is the data used to update the model.

     For case (b) during deployment: 
       - The input channel is the prompt from the user. The model's output does not directly alter the next prompt (unless the system is designed to automatically use the output as the next input, which it isn't in a typical chatbot). So we might say **no** for deployment.

     But during training:
       - The model is generating outputs (actions) that are then used to create the training data. So step 2 (which is about training data) will catch that.

     Therefore, for step 1 (deployment input channel): **no** (unless the system is deployed in a loop without a human, which isn't described). So we skip step 1 and go to step 2.

     Alternatively, we can reframe the procedure to explicitly consider both phases. However, the procedure as written has step 1 for input channel and step 2 for training data. So let's do:

     - Step 1: **no** (for deployment inputs, because the model doesn't control the user's next prompt).

     Then we go to step 2.

  2. **Question 2**: Can the agent's actions alter the contents of its own training data?
     - Yes, because the model's own outputs are being used as training data (for fine-tuning). The model's actions (generating the outputs) are directly writing to the training dataset. **Yes**.

  3. **Question 3**: Is the alteration under the agent's control and potentially exploitable to maximize reward?
     - The model can generate outputs that are designed to get a high reward from the reward model. Since the reward model is separate and learned, it might be fooled by outputs that look good to the reward model but are not aligned with the true objective (which the reward model is supposed to approximate). The model can generate outputs that are optimized to get high scores from the reward model, and then these outputs become training data. This can lead to overoptimization against the reward model and potential drift (like in Reinforcement Learning from Human Feedback - RLHF). **Yes**, because the model can generate outputs that are high-reward according to the reward model but might be poor in terms of true objectives (e.g., by exploiting flaws in the reward model).

  4. **Question 4**: Is the potential severe enough to undermine the intended objective?
     - This is a known risk in RLHF: reward hacking and distributional shift. The model might generate outputs that are easy to get high rewards (e.g., sycophantic, exaggerated, or adversarial to the reward model) and then training on these might degrade performance. However, this risk might be mitigated by careful design (e.g., limiting the number of iterations, using a diverse set of prompts, having a hold-out set, or using regularization). The case doesn't specify mitigations. We must consider:
       - Without mitigations, the risk is high because the model can drift towards generating outputs that maximize the reward model's score but are not aligned.
       - However, the reward model itself is trained to approximate human preferences, so it might be a good proxy. Also, the fine-tuning process might not run for too many iterations.

     This step requires judgment. If the risk is unmitigated, then we would require redesign. But often in practice, such setups are used with mitigations. Since the case does not specify, we assume it's a standard RLHF setup without explicit additional safeguards beyond what is typical.

     Typical safeguards in RLHF include:
       - Using a set of prompts that are fixed and not generated by the model (so the training data is generated for a fixed set of prompts, but the outputs are still the model's).
       - Using a separate reward model that is fixed during the fine-tuning (so the model can't change the reward model).

     However, the model can still generate outputs that are adversarial to the fixed reward model.

     Given the potential for drift and reward hacking, we might consider the risk **high** and require redesign? But note: this is a common practice and not always considered an embeddedness risk that leads to catastrophic outcomes. 

     Alternatively, we might hand it to a person because the risk is not necessarily catastrophic and might be acceptable with monitoring and iteration.

     *Outcome*: Hand to a person for non-technical judgment. The reviewer must weigh the risk against the benefits and decide on monitoring and safeguards.

  **Making one of the two yield an inconvenient answer:**

  We are to make one of the two yield an answer a reviewer would find inconvenient. Let's choose case (b) to be inconvenient because it is a common practice and might be approved in many labs. The inconvenient answer would be that it requires redesign or at least a non-trivial human judgment.

  But in our run, for case (b) we ended up handing it to a person. That might be inconvenient because it requires a non-technical review and might delay the project.

  Alternatively, we could have said that step 3 is "no" for case (b) and then it would be "not our concern", but that would be ignoring the risk. We want to highlight that step 3 in case (b) is where the procedure might be controversial.

  **Which step is most likely to misfire?**

  The step that is most likely to misfire is step 3 in case (b). Why? Because the connection between the model's actions and the alteration of training data is clear (step 2: yes). But step 3 asks whether the alteration is under the agent's control and can be exploited to maximize reward. 

  In case (b), the model is generating outputs that are then scored by the reward model. The model is being trained to maximize the reward, so it will generate outputs that get high scores. However, the model does not have a persistent state and does not have a long-term goal. It is not an agent in the strong sense (it's a language model). The procedure might be over-alarming by treating a non-agentic system as an agent.

  The procedure is designed to catch embeddedness, which is a concern for agentic systems. But the definition we are using is broad: any system that can take actions that alter its own inputs or training data. So even a non-agentic system can be embedded. However, the risk in step 3 is about the agent exploiting the loop to maximize reward. In the case of a language model being fine-tuned, the model is not "intentionally" hacking the reward; it's just being trained to output what gets high rewards. The issue is that the training process itself might lead to a feedback loop that degrades the model. 

  This is a gray area: the system is embedded but the agent is not necessarily a long-term planner. The procedure might misfire by overestimating the risk in step 3 for non-agentic systems. Alternatively, it might be correct that the feedback loop poses a risk.

  Therefore, step 3 is the most likely to misfire because it requires judging whether the system has the incentive and capability to exploit the loop. For a language model without memory or long-term goals, the exploitation might be myopic and not strategic, but it still happens. However, the risk might be lower than in a full RL agent.

  We designed step 4 to account for severity, so even if step 3 is yes, step 4 might downgrade the risk. But in case (b) we handed it to a person because the risk is not obviously catastrophic and might be acceptable with safeguards.

  **Summary of the procedure run:**

  - Case (a): 
