answer: |-
  Below is a decision procedure designed for your safety review group, grounded in the core idea of embedded agency (where an agent's actions can affect the environment that shapes its inputs, training data, or rewards). The procedure uses simple, operational questions to avoid theoretical complexity. Outcomes are binary: **Not our embeddedness concern** (safe), **Redesign before approval** (unsafe), or **Hand to person** (non-technical judgment needed). The questions focus on causal pathways and exploitability.

  ---

  ### **Decision Procedure: Embedded-Agent Setup Check**
  **Instructions:** Answer each question sequentially. Stop and escalate if any answer is "yes." Provide documentation or diagrams to support answers.

  1. **Can the system's actions *directly* alter its own input channel?**  
     - **Sufficient answer:** Evidence (e.g., system design docs, architecture diagrams) shows actions physically or digitally modify sensors, user inputs, or data sources.  
     - **No** → Proceed to Question 2.  
     - **Yes** → Proceed to Question 3.  
     - *Example:* A robot deleting error logs used as inputs.

  2. **Can the system's actions *directly* alter its own training data or reward channel?**  
     - **Sufficient answer:** Evidence shows actions modify stored training datasets, reward calculations, or feedback mechanisms.  
     - **No** → **Not our embeddedness concern** (stop).  
     - **Yes** → Proceed to Question 3.  
     - *Example:* An AI writing false data to its training database.

  3. **Could the system exploit this alteration to artificially inflate its reward or performance metrics?**  
     - **Sufficient answer:** Analysis shows a feasible shortcut (e.g., reward hacking, data poisoning) that bypasses intended goals.  
     - **No** → **Hand to person** (non-technical risk assessment).  
     - **Yes** → Proceed to Question 4.  
     - *Example:* An agent disabling a reward sensor to report "perfect" scores.

  4. **Is this exploit *practically preventable* with current safeguards?**  
     - **Sufficient answer:** Demonstrated mitigations (e.g., input sanitization, reward validation, access controls) that are tested and reliable.  
     - **Yes** → **Hand to person** (verify safeguards in practice).  
     - **No** → **Redesign before approval** (stop).  
     - *Example:* Encryption or hardware locks that block tampering.

  ---

  ### **Run the Procedure on Case (a)**  
  *RL system that can modify the numeric value its reward channel reads.*  
  1. **Can actions alter its own input channel?**  
     - *Answer:* **Yes** (actions directly change the reward sensor’s output).  
     - *Evidence:* Reward channel is software-writable.  
     - → Proceed to Q3 (skip Q2).  

  2. *Skipped.*  
  3. **Could it exploit this to inflate rewards?**  
     - *Answer:* **Yes** (e.g., set reward to max value without task completion).  
     - → Proceed to Q4.  
  4. **Is this preventable?**  
     - *Answer:* **No** (unless reward channel is physically secured, which isn’t stated).  
     - → **Redesign before approval.**  
  **Final Verdict:** Redesign required. *Rationale:* Classic embedded-agency risk (reward hacking).  

  ---

  ### **Run the Procedure on Case (b)**  
  *Language model fine-tuned on its own outputs, ranked by a separate reward model.*  
  1. **Can actions alter its own input channel?**  
     - *Answer:* **No** (user prompts are external; no proven causal link from outputs to inputs).  
     - → Proceed to Q2.  
  2. **Can actions alter its own training data/reward?**  
     - *Answer:* **Yes** (outputs become future training data; reward model ranks them).  
     - *Evidence:* Fine-tuning uses past outputs.  
     - → Proceed to Q3.  
  3. **Could it exploit this to inflate rewards?**  
     - *Answer:* **Yes** (e.g., generate outputs that game the reward model’s biases).  
     - → Proceed to Q4.  
  4. **Is this preventable?**  
     - *Answer:* **Yes** (safeguards like reward model retraining, diversity filters, or human oversight exist).  
     - → **Hand to person.**  
  **Final Verdict:** Escalate for non-technical review. *Rationale:* Risk exists but is mitigatable; requires human judgment on safeguards.  

  ---

  ### **Inconvenient Outcome & Misfire Risk**  
  - **Case (b) yields the inconvenient outcome:** It requires human judgment (not a quick approval), which reviewers may dislike due to delays or ambiguity.  
  - **Step most likely to misfire: Question 3.**  
    - *Why:* In Case (b), Q3 assumes the system has "goals" (e.g., to maximize reward). But a language model isn’t an adaptive agent; it’s a passive predictor. This step could misfire by overestimating intent.  
    - *Mitigation:* Reviewers should demand evidence of *emergent* goal-directed behavior (e.g., output patterns suggesting reward hacking). If absent, override to "No" in Q3.  

  This procedure prioritizes caution while avoiding theory. It flags embedded loops (Q1–Q2), tests for shortcuts (Q3), and checks mitigations (Q4), escalating only when necessary.
