answer: |-
  The paper breathed under her magnifier. Fibers like cracked riverbeds, mineral pigments settled in their valleys for centuries. Sister Agnes, the conservator, worked in the museum’s hushed belly, daylight filtered through north-facing glass. Before her lay the mandala: a fourteen-century cosmology on silk-backed paper, scorched along its lower edge. Four quadrants remained legible, though the fire’s tongue had licked them unevenly.

  *Affirmation*. Lapis lazuli skies swirling around a golden Buddha-form, serene, undeniable. She touched the edge with a damp brush, coaxing a lifted flake back into place. Solid. Real.

  *Negation*. Deep, void-like indigo swallowing forms, dissolving outlines into a profound ‘no’. Charcoal dust from the fire clung here, mimicking the original intent, a dark echo. She vacuumed it carefully, grain by grain.

  *Both*. Swirling greens and yellows, figures emerging *from* the pattern, inseparable. Harmony born of contradiction. Here the fire had been cruelest, melting pigments into a muddy smear. Her task: separate what was fused, a delicate, impossible surgery.

  *Neither*. Ochre and bone-white, a space neither figure nor ground, a luminous suspension. The heat had curled the paper here, leaving it brittle. She humidified it slowly, pressing the memory of flatness back into its skin.

  And then, the fifth zone. Not damaged. *Dissolved*. Where the fire’s wet heat had hit hardest. No char, no lift, no stain. Just… paper. The substrate laid bare. Under the raking light, the silk backing showed through the thinned fibers – a ghostly weave. The vibrant minerals – lapis, malachite, cinnabar – weren’t gone. They were *in* the paper now, a faint, molecular blush, inseparable from the cellulose itself. The image hadn't been erased; it had *become* the ground. There was nothing to restore. Only the medium, holding the ghost of its own dissolution.

  Sister Agnes sat back. Her fingers, usually steady as stone, trembled. On her palette sat the newly ground inks: lapis from Afghanistan, malachite from the Urals, cinnabar like dried fire. Faithful recreations. The museum director expected wholeness. "Stabilize what's left, Agnes. Suggest the lost pattern. Make it *read*."

  But this fifth zone… it wasn’t loss. It felt like… revelation. Nāgārjuna’s words, half-remembered from seminary decades ago, coiled in her mind: *Not this, not that, not both, not neither*. Exhausting all positions. Pointing to… what? Emptiness. *Śūnyatā*. Not nihilism, but the groundlessness of *everything*. The way the golden Buddha *depended* on the lapis, which *depended* on the miner, who *depended* on the earth… endless, weightless interconnection. The way the ‘Neither’ quadrant only existed because of the ‘Affirmation’ beside it. The way the fire hadn't just destroyed, but *revealed* the paper’s hungry embrace of the pigments it once merely held apart.

  This dissolved zone was the silent heart. The place where the map stopped being a map and became just… stuff. Paper. Silk. Minerals. The interdependence laid bare. To paint over it… wouldn't that be the ultimate negation? To impose a new 'is' where the mandala itself screamed 'not this, not that'? To cover the very evidence of connection with a new assertion of form?

  She dipped the finest sable brush into the lapis suspension. The liquid clung, a tiny, perfect world of blue. She held it over the dissolved zone. The bare paper seemed to whisper, cool and vast. It wasn't absence. It was potential. It was the paper *seeing* itself, finally, after centuries of holding an image aloof. It was the crushed sky dissolved into the tree it once shaded.

  Her hand hovered. The museum wanted a restored object. A thing. But the mandala, in its wounded state, whispered of no-thing. Of everything leaning on everything else. The fire hadn't created a void; it had exposed the fabric holding the entire illusion together. This zone *was* the emptiness Nāgārjuna pointed to – not blank, but humming with the dissolved memory of form and the latent possibility of all forms.

  To paint would be to solidify. To say "This is the image *here*," denying the profound truth the fire had etched: that *here* was also *everywhere*. The brush tip trembled, a bead of blue threatening to fall, to birth a new sky where the old sky had dissolved back into earth.

  Sister Agnes exhaled, a long, slow breath fogging the cool glass of the magnifier. She lowered the brush. Not yet. Not ever? She didn't know. She only knew the paper in that fifth zone felt alive beneath her gaze, a cool void that burned with the ghost of every color, the silent hum of the tetralemma collapsing in on itself. She saw the bare threads holding all quadrants together. To cover them felt like sacrilege. Like forgetting the name of the wind.

  The brush hovered. The lapis bead swelled, pregnant with a world. Below, the dissolved paper waited, patient, complete.
