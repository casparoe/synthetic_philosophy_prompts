prompt: |-
  Act as a philosopher of ethics with expertise in moral psychology and structured classroom simulation. Before you draft anything, spend a brief paragraph reasoning through the exact in-game moment at which defending a practice must become socially expensive rather than honorable, then build the rules backward from that pivot.

  I am running a 75-minute seminar for twelve upper-level philosophy students. The topic has become personally urgent after I watched a professional norm I once accepted collapse almost overnight—not because anyone persuaded me it was wrong, but because continuing to uphold it suddenly made its defenders look out of touch. I want my students to feel that dynamic from the inside before they hear it named. The session should engage the question Bernard Williams and Kwame Anthony Appiah pose about moral revolutions: do practices like dueling or slavery end through arguments, through shifting interests, or through an honor economy that collapses? Design a runnable in-person game—no technology, no real money—centered on a constructed micro-norm I will call “the contradiction duty”: in a small professional guild, members are expected to publicly correct a peer’s error in formal assembly, or be seen as lacking integrity. The practice is defended with familiar moral language—accountability, transparency, intellectual courage—but maintaining it carries a hidden reputational cost that your rules must make tangible. The students should discover, through play, that the arguments against the duty sound identical before and after its collapse; what changes is the social price of holding the line. Do not lecture them about “honor revolutions” or present the Williams/Appiah framework until the debrief.

  Structure your response in the following sections, with approximate lengths:
  1. Design Logic (about 100 words): your reasoning for the rule choices and the pivot point.
  2. Setup and Roles (about 120 words): materials, role cards, initial conditions, and how students are assigned positions.
  3. Rules of Play (about 150 words): turn structure, available actions, how reputation is tracked visibly, and what triggers the shift in social cost.
  4. Payoff and Stakes (about 100 words): the non-monetary reward scheme—status within the game, alliance opportunities, visibility—so that coordination and defection feel consequential.
  5. Debrief: Mapping Experience to Theory (about 200 words): link specific in-game moments to the triad of argument, interest, and honor; introduce the Williams/Appiah thesis here; show precisely where the simulation reproduces real moral revolutions and where it does not.
  6. Predictable Failures and Fixes (about 100 words): what will go wrong the first time you run this, and how to handle it without breaking the experience.
  7. Limits of the Simulation (about 75 words): the feature of actual historical moral change that this classroom exercise cannot reproduce and that you must supply through guided discussion.

  Think carefully about which feature of the idea must appear in the rules rather than in your explanation afterward, and be frank about the gap. Do not provide a bibliography, reading list, or citations. Do not ask students to look up specific texts. Make sure the constructed “contradiction duty” feels realistic enough to generate genuine social pressure but niche enough that the activity is not something they have seen before.
reasoning: |-
  Okay, the user wants me to design a classroom simulation game about moral revolutions based on Williams and Appiah's ideas. They're a philosophy professor who observed a professional norm collapse suddenly and wants students to experience how social costs shift even when arguments stay the same.

  First, I need to understand the core concept: the "contradiction duty" - where guild members must publicly correct peers or lose integrity. The key is making students feel the tipping point where defending the norm becomes socially costly rather than honorable.

  For the simulation, I'll need:
  - A clear pivot mechanism: probably when a critical mass of players stop enforcing the duty
  - Visible reputation tracking (maybe colored tokens on name tags)
  - Roles that create natural tensions (traditionalists vs skeptics)
  - Non-monetary incentives like status and alliances

  The design logic should emphasize that rules must make the honor economy tangible. The pivot point is when defending the norm flips from gaining to losing reputation. 

  For setup:
  - 12 students divided into roles (3 Traditionalists, 6 Neutrals, 3 Skeptics)
  - Materials: name tags with reputation tokens, action cards
  - Initial condition: strong norm enforcement

  Gameplay should have:
  - Structured turns with "correct/don't correct" choices
  - Public reputation adjustments
  - A hidden threshold (maybe 3 defections) that triggers the cost shift

  Payoffs need social stakes:
  - Status tokens visible to all
  - Endgame alliances offering discussion advantages
  - No artificial rewards - pure social perception

  In debrief, I'll connect:
  - Specific game moments to argument/interest/honor
  - The Williams/Appiah thesis about honor economies collapsing
  - Where the simulation mirrors reality vs falls short

  Anticipating problems:
  - Students might not engage emotionally (fix: emphasize role immersion)
  - Reputation tracking could get messy (fix: simplified token system)
  - Shift might happen too fast (fix: adjust threshold secretly)

  The big limitation is that real moral revolutions involve power imbalances and material consequences - we'll discuss this gap during debrief.
answer: |-
  ### 1. Design Logic (100 words)  
  The pivot occurs when defending the contradiction duty shifts from *enhancing* to *damaging* one’s reputation. Rules must make this tangible by embedding a hidden cost: players accrue "integrity points" for correcting errors but lose "alliance points" for alienating peers. The shift triggers when ≥3 players abstain from correction in one round, flipping the social cost—thereafter, enforcing the duty *loses* integrity points. This models how defending a norm becomes expensive once a critical mass defects. Arguments (pro/con correction) remain constant pre/post-pivot; only the reputational calculus changes, forcing players to *feel* the honor economy’s collapse.  

  ### 2. Setup and Roles (120 words)  
  **Materials:** 12 role cards, 12 name tags with 2-sided clips (green/red tokens), 12 "error slips" (pre-written factual mistakes), integrity/alliance tally sheets.  
  **Roles:**  
  - **Traditionalists (3):** Start with +2 integrity. Believe correction is sacred.  
  - **Neutrals (6):** No starting bonuses. Sensitive to peer reactions.  
  - **Skeptics (3):** Start with +2 alliance. Privately doubt the duty.  
  **Initial Conditions:** All wear name tags showing green tokens (integrity). The norm is strong; correction expected.  
  **Assignment:** Randomly distribute roles. Each round, one player (rotating) reads an error slip aloud.  

  ### 3. Rules of Play (150 words)  
  **Turn Structure (4 rounds, 10 min/round):**  
  1. **Speaker** reads an error slip.  
  2. **Players** secretly choose: **Correct** (publicly challenge error) or **Abstain** (stay silent).  
  3. **Outcomes:**  
     - *Pre-Pivot:* Correcting gains +1 integrity (flip token green); Abstaining loses -1 integrity (flip red).  
     - *Post-Pivot (triggered when ≥3 Abstain in one round):* Correcting *loses* -1 integrity (flip red); Abstaining *gains* +1 alliance (noted privately).  
  4. **Reputation Tracking:** Integrity is public (token colors). Alliance is private (tally sheet) but influences endgame.  
  5. **Debate Phase (3 min):** Players argue for/against correction *using identical moral language* (e.g., "cowardly vs. cruel") regardless of pivot.  

  ### 4. Payoff and Stakes (100 words)  
  - **Integrity Tokens:** Publicly signal status. Majority-green players lead the final discussion.  
  - **Alliance Points:** Secretly recorded. High-alliance players form "inner circles" post-game, deciding debate seating (center = prestige).  
  - **Visibility:** Correcting forces public speech; abstaining offers coalition whispers.  
  - **Endgame:** Players with ≥3 integrity OR alliance points gain "influencer" status, steering the debrief. No "winners"—consequences are social capital and narrative control. Defection risks isolation; enforcement risks backlash.  

  ### 5. Debrief: Mapping Experience to Theory (200 words)  
  **Link to Triad:**  
  - *Argument:* Note how identical language ("accountability," "civility") was used pre/post-collapse—yet its persuasive power vanished post-pivot.  
  - *Interest:* Ask Neutrals: "Did you abstain to avoid conflict (self-interest) or to protect peers (social interest)?"  
  - *Honor:* Highlight the token flip: integrity became *stigmatized* overnight. Traditionalists now looked "rigid," not "principled."  
  **Williams/Appiah Thesis:** Introduce their claim: moral revolutions (e.g., dueling’s end) hinge on honor economies collapsing when adherence switches from prestige to shame. The game reproduces this by making the *social cost* of upholding norms unbearable, not new arguments.  
  **Simulation vs. Reality:** The game mirrors how reputational tipping points accelerate change (e.g., #MeToo). It fails to capture *material power*: real elites (like slaveholders) resist through coercion, not just shame.  

  ### 6. Predictable Failures and Fixes (100 words)  
  **Failure 1:** Students treat it as debate, not social experiment → **Fix:** Preface: "This is about *social physics*, not logic. Track your gut reactions."  
  **Failure 2:** Pivot triggers too early/late → **Fix:** Secretly adjust the threshold (e.g., shift at 4 abstentions if too soon).  
  **Failure 3:** Alliance points feel abstract → **Fix:** Mid-game, whisper to high-alliance players: "You’re invited to a post-class coffee clique."  
  **Failure 4:** Skeptics dominate → **Fix:** Remind Traditionalists: "Your identity is tied to the duty. Betrayal = identity death."  

  ### 7. Limits of the Simulation (75 words)  
  The game cannot replicate *asymmetric consequences*. Historically, moral revolutions often involve oppressed groups (e.g., enslaved people) forcing change through sacrifice—here, all players have equal agency. The simulation’s "collapse" is bloodless; real revolutions risk lives. Acknowledge this gap: "In this safe space, we simulated social cost. But remember: when the honor economy fails in reality, the vanquished don’t just lose tokens—they lose power, liberty, or lives. That weight requires historical witness, not play."
