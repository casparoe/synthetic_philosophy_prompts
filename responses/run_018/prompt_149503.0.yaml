      - The monitor is then given:
          - The post-extraction resource level (which is also announced to the group? Not exactly, we want the monitor to have a special role. The group only knows the starting level and then the next starting level. The monitor gets to see the post-extraction level and the regeneration amount and the environmental noise (without error? but we want imperfect). 
          - Actually, we can give the monitor a report that includes the post-extraction level and the total regeneration, and they are told the environmental noise but with an error (so they are told a value that is the actual noise plus an error of ±2). Then, at the beginning of the next round, the monitor reports to the group: 
