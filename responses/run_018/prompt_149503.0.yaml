    - **Monitors:** In each group, one person (randomly assigned) will be the monitor in each round (rotated so everyone gets a chance). The monitor receives a report about the resource level at the beginning of the round and after extraction, but they do not see individual extractions or maintenance contributions. They also get an imperfect signal about the regeneration rate (see below). The monitor can issue a public report to the group (but cannot identify individuals).
    - **Enforcers:** None in this setup. We are focusing on the structural problem without enforcement to show the difficulty. However, we might allow the group to set rules? But the prompt says contributions are non-observable, so we cannot have enforcement based on individual actions. We want to show that without observability, enforcement is impossible.

  Alternatively, we can have no monitors and enforcers to keep it simple? But the prompt asks for roles including monitors and enforcers. Let's adjust: we can have a monitor role that provides imperfect information to the group, but without enforcement power. The idea is that the monitor can only inform, not punish.

  * **Rounds:** 4 rounds. Each round represents a year (or a season).

  * **Resource Dynamics:**
    - The resource pool starts with 80 tokens (for a group of 8). 
    - **Extraction:** In each round, every player simultaneously and secretly decides how many tokens to extract (from 0 to 5) and whether to contribute to maintenance (cost: 2 tokens from their personal stash). 
