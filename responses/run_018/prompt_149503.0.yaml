      But note: the regeneration is hidden? Actually, the new resource level is announced to everyone at the beginning of the next round. The monitor's role is to try to explain the change. However, the monitor's report might be inaccurate because of the error in the environmental factor.

    - At the end of each round, the facilitator announces:
          - The total extraction (but not per person)
          - The total number of contributors (but not who)
          - The new resource level (for the next round)

    And the monitor then gives a brief report (oral) about what they observed (the post-extraction level and the regeneration) and their interpretation of the environmental factor.

  * **Payoff Structure:**
    - Each token extracted gives 1 point.
    - Contributing to maintenance costs 2 points (so if you contribute, you lose 2 points).
    - At the end of round 4, if the resource level is above 40, everyone in the group gets a bonus of 10 points.

    This creates a tension: 
      - Extracting more gives immediate points.
      - Contributing costs immediately and the benefit (resource regeneration) is shared and delayed. Also, the benefit is uncertain because of the hidden regeneration and the fact that others might not contribute.

    Without the bonus, the resource might collapse and the bonus is lost. But note, the bonus is only at the end, so players might discount it.

  * **Expected Dynamics:**
    - Early rounds: The resource is abundant. Players may extract heavily and few contribute. The regeneration might still be positive due to the base rate and the random noise, so the resource might not drop immediately.
    - As the resource depletes, the base regeneration (20% of a smaller number) becomes less, and the random noise might push it into negative net regeneration. 
    - The monitor reports might be confusing because of the noise and the error, making it hard to attribute the cause of regeneration changes.

  * **Why Defection is Dominant:**
    - If a player contributes, they pay 2 points. The benefit is that the resource gets 2 more tokens, which are available for everyone. But if the player does not contribute, they save 2 points and still benefit from others' contributions. Also, they can extract more. So regardless of what others do, not contributing is better for the individual (saves 2 points) and extracting the maximum (5) is better because if others restrain, you get more, and if they don't, you at least get your share.

    However, if everyone extracts 5 and no one contributes, the resource will collapse quickly. But note: the base regeneration might initially offset, and the random noise might help. In early rounds, the resource might even grow if the noise is positive and the base regeneration is high. This might give a false sense of security.

  * **Materials:**
    - Two bowls (one for each group of 8) with 80 tokens each (use poker chips or candies?).
    - Slips of paper for decisions (or use a digital tool if available, but physical is more engaging).
    - A calculator for the facilitator.
    - A way to generate random numbers (dice or a random number generator).
    - A whiteboard to record the resource levels and announcements.

  * **Roles Assignment:**
    - Each round, assign a new monitor for each group (so in 4 rounds, 4 different monitors per group). The monitor does not make extraction or maintenance decisions in their round? Actually, the monitor is also an extractor? We can have the monitor be one of the players and they still make their own decisions. The monitor role is just an additional duty.

  * **Step-by-Step Round:**

    Round 1:
      - Starting resource: 80 tokens.
      - Each player (including the monitor) decides: extraction (0-5) and whether to contribute (yes or no). They write it down and hand it in.
      - Facilitator calculates:
          total_extraction = sum of all extractions
          post_extraction = max(0, 80 - total_extraction)
          base_regeneration = floor(0.2 * post_extraction)
          contributions = number of "yes" for maintenance * 2
          environmental_noise = random integer between -5 and 5
          regeneration = base_regeneration + contributions + environmental_noise
          new_resource = min(100, post_extraction + regeneration)   [if negative, set to 0? but regeneration could be negative? but then new_resource = max(0, post_extraction + regeneration)]

      - Announce to the group:
          "Total extraction: [total_extraction]"
          "Number of contributors: [number of contributors] (but we don't know who)"
          "New resource level at the beginning of next round: [new_resource]"

      - Then, the monitor (for round 1) is given a private report by the facilitator:
          "After extraction, the resource was at [post_extraction] tokens."
          "The total regeneration was [regeneration] tokens."
          "The environmental factor for this round was [environmental_noise] but you estimated it as [estimated_noise]." 
          where estimated_noise = environmental_noise + random_integer(-2,2) [but bounded by -5 and 5?]

      - The monitor then gives a short oral report to the group (at the beginning of the next round) about what they observed and their interpretation.

    Round 2, 3, 4: same, starting with the new resource level.

  * **Debrief Guide:**

    The facilitator should guide the discussion to highlight:

    1. **Structural Misalignment:**
        - The benefits of extraction are private and immediate, while the costs of depletion are shared and delayed (and also uncertain due to hidden regeneration and noise).
        - Contributions to maintenance are costly and non-observable, so there is no individual recognition or immediate reward for contributing.

    2. **Key Moments in the Simulation:**
        - **First hidden depletion:** In an early round, even if the resource level drops, the regeneration (due to noise or base) might make it recover. Players might not notice the trend until it's too late.
        - **Collapse of voluntary contribution:** As the resource becomes scarce, players might try to contribute more, but if they see that the total contributions are low (announced) they might lose hope and stop contributing because they feel their individual contribution won't make a difference (especially with the noise). Also, they might think others are free-riding.
        - **Point of irreversible loss:** When the resource level is so low that even with maximum contributions, the base regeneration is negligible and the noise could push it to zero. The monitor might report a negative environmental factor that exacerbates the problem, but the group cannot recover.

    3. **Mapping to Concepts:**
        - **Asymmetric information about regeneration:** The random noise and the monitor's imperfect signal represent the uncertainty in natural systems. Players cannot perfectly attribute changes in the resource to extraction or environmental factors.
        - **Non-excludability:** Everyone can extract, and everyone benefits from maintenance, so free-riding is rational.
        - **Intertemporal discounting:** The bonus at the end is discounted because it's in the future and uncertain. Players might prefer the immediate gain from extraction.

    4. **Predictable Blame:**
        - Participants are likely to blame the high extractors or the non-contributors. They might also blame the monitor for inaccurate reports or the randomness of the environment.
        - Redirect by asking: "If you were in the shoes of the person who extracted 5 and didn't contribute, what would be your reasoning? Wouldn't that be the best move for your individual score? And if everyone does that, what happens?" 
        - Emphasize that the structure of the game makes it individually rational to defect, even when collectively it leads to ruin.

    5. **Missing Element:**
        - The simulation cannot reproduce the true irreversibility of ecological collapse because after the resource hits zero, we can reset it for the next class. Also, the intergenerational timescale: the players are the same across rounds, but in reality, the costs are borne by future generations. 
        - The facilitator must verbally emphasize that in real ecosystems, once a resource collapses (like a fishery), it may never recover, and the damage affects people not present in the decision-making. The bonus at the end is a weak proxy for that. The facilitator should stress that the real world has thresholds beyond which recovery is impossible, and the simulation's regeneration function (which allows recovery even from low levels) is more optimistic than reality.

    **Sample Debrief Questions:**
        - "At what point did you realize the resource was in danger? What information did you have at that point?"
        - "Why did you choose to contribute (or not) in round X?"
        - "How did the monitor's reports influence your decisions? Were they reliable?"
        - "If we played again, what would you do differently? What structural changes (like rules) would you propose?"

    Finally, the facilitator should connect the simulation to real-world examples (fisheries, climate change, groundwater) and to the theoretical framework of collective action problems (Hardin, Ostrom).

  **Note on Randomness:** 
    The facilitator should run the random noise in a way that is transparent (e.g., roll a die: 1=-5, 2=-3, 3=-1, 4=1, 5=3, 6=5) and record it publicly. Similarly, the monitor's error can be rolled with a die (1 to 5: subtract 2, subtract 1, no error, add 1, add 2) and then bound between -5 and 5.

  **Adjustment for Time:**
    Since the entire activity must fit in 75 minutes, the facilitator must be strict with time. Consider having pre-printed decision slips to speed up collection.

  This design should create a visceral experience of the tragedy of the commons as a structural problem.
answer: |-
  ### Structured Simulation Design: "The Hidden Commons"

  #### **Physical Materials**
  - **Resource Pool**: A large clear bowl filled with 160 blue tokens (representing the common-pool resource, e.g., a fishery).  
  - **Extraction Tools**: 16 small cups (one per student) for collecting extracted tokens.  
  - **Contribution System**: 16 red tokens (for maintenance contributions), placed in a separate box.  
  - **Monitoring Tools**: A privacy screen (e.g., cardboard divider) and a "monitor's report sheet" for recording observations.  
  - **Tracking**: Whiteboard displaying:  
    - Round number (1–4)  
    - Current resource level (updated each round)  
    - Total extraction/contributions (aggregate only)  
  - **Randomizer**: A 10-sided die (for hidden regeneration noise).  

  #### **Roles**  
  Assign randomly in Round 1; rotate each round to ensure all experience roles:  
  - **Extractors** (14 students): Privately extract tokens; optionally contribute to maintenance.  
  - **Monitor** (1 student): Observes *only* the **post-extraction resource level** (not individual actions) and receives a **noisy signal** about regeneration (e.g., "recovery seems weak/strong" ±30% error).  
  - **Enforcer** (1 student): Can impose a 3-token fine on **one** player per round (e.g., by placing a red mark by their cup), but fines are public and costly (1 token fee to enforcer).  

  #### **Token Economy & Rules**  
  - **Starting Resource**: 160 tokens (10 per player).  
  - **Extraction**:  
    - Each extractor takes 0–5 tokens per round (secretly, into their cup).  
    - **Benefit**: 1 point per token extracted (private, immediate).  
  - **Maintenance**:  
    - Optional contribution: Pay 2 tokens (from extracted stock) to add 1 red token to the contribution box.  
    - **Cost**: 2 points lost per contribution (private, immediate).  
    - **Benefit**: Each red token boosts end-of-round regeneration by 1 token (socialized, delayed).  
  - **Resource Regeneration**:  
    - Base regeneration: 20% of remaining tokens.  
    - **Hidden noise**: ±10% via die roll (e.g., 1–3: -10%, 4–7: no change, 8–10: +10%). Monitor sees a distorted signal (e.g., ±30% error).  
    - **Total regeneration**: (0.2 × remaining tokens) + red tokens + noise.  
    - Resource cap: 200 tokens (irreversible collapse if ≤20 tokens).  
  - **Round Timeline** (4 rounds; 10 min/round):  
    1. **Decisions (3 min)**: Extractors secretly submit extraction/contribution slips.  
    2. **Extraction (2 min)**: Facilitator removes tokens, announces **total extraction**.  
    3. **Monitor Report (2 min)**: Monitor views post-extraction level (hidden behind screen) and receives noisy regeneration signal; shares public report (e.g., "Resource is low; recovery uncertain").  
    4. **Enforcement (1 min)**: Enforcer names one fined player (no reason required).  
    5. **Regeneration (2 min)**: Facilitator adds regenerated tokens (hidden noise applied), announces **new resource level** and **total contributions**.  

  #### **Payoff Structure**  
  | **Action**               | **Immediate Points**      | **Delayed Points**                     |  
  |--------------------------|--------------------------|----------------------------------------|  
  | Extract 5 tokens         | +5 points                | None                                   |  
  | Contribute to maintenance| -2 points                | +0.125 points (if resource survives)* |  
  | Enforcer fines a player  | +1 point (enforcer)      | None                                   |  
  | Fined as player          | -3 points                | None                                   |  
  *Delayed points: All players receive 10 bonus points if the resource ends Round 4 >40 tokens (emphasizes collective but deferred benefit).  

  **Why defection dominates**:  
  - Extracting 5 tokens yields +5 points immediately.  
  - Contributing costs 2 points now but only returns ≈0.125 later (if the group succeeds).  
  - Even with fines, enforcers target specific players (scapegoating), not systemic fixes.  

  #### **Predicted Progression**  
  - **Round 1**: High extraction (median 4–5 tokens), low contributions. Resource drops slightly but regenerates due to base rate. *Players feel safe*.  
  - **Round 2**: Extraction remains high. Noise causes hidden depletion (e.g., -10% regeneration). Monitor reports "uncertain recovery," but contributions stay low. *First visible decline; blame targets fined players*.  
  - **Round 3**: Resource nears collapse threshold. Contributions spike (panic), but extraction stays high. Noise accelerates decline. Monitor signals "critical state." *Voluntary cooperation collapses*.  
  - **Round 4**: Resource collapses (≤20 tokens). No regeneration. Group bonus lost. *Players realize individual rationality caused collective failure*.  

  ---

  ### **Debrief Guide**  
  **Map Key Moments to Concepts**:  
  1. **First hidden depletion (Round 2)** → **Asymmetric information**:  
     - Noise masks true regeneration. Players cannot link actions to outcomes, delaying corrective action.  
  2. **Collapse of contributions (Round 3)** → **Non-excludability + discounting**:  
     - Contributions are costly and non-observable; free-riding is rational. Future bonus is discounted (uncertain and delayed).  
  3. **Enforcer fines a "greedy" player** → **Scapegoating**:  
     - Blame focuses on individuals, not the structure (e.g., "if they extracted less, we’d be fine!").  
  4. **Irreversible loss (Round 4)** → **Threshold effects**:  
     - Resource collapses once regeneration cannot offset extraction (structural, not moral failure).  

  **Redirecting Blame**:  
  - When players blame "greedy" peers or "incompetent" monitors:  
    - Ask: *"If you were the monitor, could you accurately diagnose the problem? If you were fined, would you change your behavior next round?"*  
    - Highlight: *"The rules made it rational to extract heavily—even if you preferred sustainability."*  
  - Emphasize: The core issue is **architectural**—individual benefits are visible and immediate, while costs are shared, delayed, and obscured.  

  **Missing Real-World Element**:  
  - **Irreversible collapse & intergenerational scale**:  
    - Ecological collapse (e.g., ocean dead zones) is often permanent and harms future generations. The simulation’s 4-round timeline and "regeneration cap" cannot replicate this.  
  - **Facilitator Script**:  
    > *"In reality, once a fishery collapses, it may never recover. Your grandchildren inherit the damage. Here, we ‘reset’ the game, but nature doesn’t. The true cost of today’s extraction is borne by unseen others across decades—making the structural misalignment even more profound."*  

  ---

  **Learning Outcome**: Students viscerally grasp that rational actors, armed with full knowledge and good intentions, will still erode commons when incentives privatize gain and socialize hidden, delayed costs. The solution requires redesigning decision architectures (e.g., observable contributions, graduated sanctions), not moralizing individuals.
