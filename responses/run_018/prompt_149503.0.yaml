  We are designing a simulation for a tragedy of the commons scenario that emphasizes structural issues rather than greed or ignorance. The key elements are:
  - Privatized extraction benefits (individuals gain from taking more)
  - Socialized and delayed maintenance costs (everyone shares the cost of degradation, but it happens later and contributions to upkeep are not observable)
  - Partially hidden regeneration rate (the resource's ability to recover is not fully known to participants)
  - Non-observable contributions to upkeep (when someone contributes to maintenance, others cannot see it)

  We want participants to see that even when everyone is informed and prefers collective preservation, the structure of the situation leads to over-extraction.

  **Overview of the Simulation**

  * **Setting:** A common pool resource (e.g., a fishery, forest, or grazing land) represented by a shared resource pool (like a bowl of tokens).
  * **Participants:** 16 students. They will be divided into 4 groups of 4. Each group represents a community sharing a common resource. However, note that the resource is shared across the entire class? Or per group? To make it manageable and to allow for multiple simulations, we can have 4 independent groups (each with their own resource pool) so that we can observe different outcomes and compare. But the prompt says "collective action" and we want to show the structural problem, so having one big resource for the entire class might be more impactful. However, 16 players in one resource might be too chaotic. Let's compromise: we'll have two independent resource pools, each shared by 8 students (so two groups of 8). This way we can have two parallel simulations and compare outcomes.

  * **Roles:** 
