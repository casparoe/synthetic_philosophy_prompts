            - In deployment, the distribution shifted: we had red without circle and circle without red.
            - If you learned the circle rule, you were confidently pursuing that goal, but it was not the intended goal. This is goal misgeneralization.
        - Contrast with specification gaming: 
            - "Note that this is not cheating. You weren't trying to hack the system; you genuinely thought the goal was to choose circles. The reward signal in training led you to form the wrong goal."

