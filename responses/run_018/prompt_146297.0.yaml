  First, I need to validate their ontological/epistemic layers as accurate - that's settled in Jain scholarship. The novelty lies in their third layer: the idea that unqualified assertions structurally conceal truth-conditions, and this gets amplified in modern discourse. This is sharp, but I must distinguish between what's textually supported and what's extension.

