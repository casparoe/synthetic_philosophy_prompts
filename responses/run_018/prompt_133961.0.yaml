prompt: |-
  You're a philosophy of social science expert and debate coach. Before you answer, do a quick brainstorm of teh audiance's priors.

  Next Tuesday I present to a sociology-of-culture grad seminar. My thesis: Weber's Protestant Ethic argument fails not because culture can't cause economic behavior, but because he smuggles in a value-causation model that treats ascetic norms as both explanatory and normative at once — and I want to defend a repaired version using 'algorithmic taste-cultures,' where recommendation-loop aesthetics in craft TikTok generate pseudo-ascetic productivity norms with no theological backbone. Audience: mostly critical-theory grads who think Weber is just an apologist for capitalism, one quant sociologist who runs regressions on cultural capital and treats values as post-hoc rationalizations, plus a visiting Weber scholar. Draft my Q&A prep sheet: objections ordered by damage, phrased the way they'd actually say them, each with a 90-second reply and a note on where the reply is weakest. Include teh objection I'm praying they skip — probably that my case is just tech determinism in disguise or that it requires platform ethnographies I haven't done. No citation lists, no bibliographies. Think carefully and start with the worst-case objection.
