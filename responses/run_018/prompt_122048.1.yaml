answer: |-
  This dispute beautifully encapsulates fundamental metaphysical questions about artifact identity. The framework governing your clause should prioritize **functional-historical continuity over material persistence**, as this aligns with practical artifact ontology and resolves the siblings' conflict more coherently. Here's a breakdown:

  ### Recommended Metaphysical Framework: **Processual Identity**
  1. **Artifacts as Dynamic Entities**  
     Artifacts (especially tools) persist through *functional continuity* and *intentional maintenance*, not static matter. The bench’s identity is anchored in:  
     - Its uninterrupted role in the father’s creative process  
     - The causal chain of repairs preserving original design intent  
     - Social recognition (e.g., the father calling it "the same bench")  

  2. **Rejecting the "Enduring Core" Fallacy**  
     No physical object retains all original parts indefinitely. The sibling claiming "no continuous substrate" ignores that:  
     - Maintenance *is* continuity: Each replacement replicated the original structure using the same materials/techniques, extending the bench’s lifespan.  
     - The vise acts as a "fixed point": Its external persistence (even with internal repairs) symbolizes historical constancy.  

  3. **Temporal Parts (Perdurance) – Useful but Insufficient**  
     While viewing the bench as a 4D "space-time worm" acknowledges change, it doesn’t resolve the valuation dispute. Calling it a temporal segment of a process:  
     - *Explains* material turnover but fails to distinguish restoration from replacement.  
     - *Doesn’t address* why this bench (vs. a replica) has heirloom status.  
     → **Solution:** Pair perdurance with *narrative identity*. The bench’s history as *this specific* object used by the father for 40 years makes it unique.  

  ### Resolving the Boundary Problem
  - **Restoration vs. Replacement Distinction**:  
    Restoration preserves identity through *formally constrained change*:  
    - **Intent**: Repairs maintain original function/structure.  
    - **Causality**: Each modification traces back to the initial artifact.  
    - **Material Fidelity**: Using same-source wood/replicating joinery honors the artifact’s essence.  

    A replica lacks this causal lineage – it’s a new entity mimicking the old. Selling the bench as a "reproduction" would be factually incorrect and overlook its biographical history.

  ### Clause Recommendations
  Embed these principles explicitly:  
  > *"The arbitral tribunal shall recognize the Workbench as a singular historical entity, its identity derived from its continuous functional existence within [Father’s Name]’s woodworking practice from [Date] to [Date]. Identity shall be determined by:  
  > (a) Unbroken custodial history under [Father’s Name];  
  > (b) Preservation of original design intent through repairs;  
  > (c) Use of materially/structurally congruent components in maintenance.  
  > The complete part-replacement undertaken does not constitute replication, but sustains the artifact’s persistence as defined herein."*  

  ### Why This Works Philosophically
  1. **Reflects artifact ontology**: Tools are defined by use, not atoms. A 100% replaced violin played by a master for decades remains *their* violin.  
  2. **Avoids arbitrariness**: Material thresholds (e.g., "51% original parts") are indeed conventional. Functional-historical criteria provide principled boundaries.  
  3. **Honors intentionality**: The father’s own words ("same bench") signal social ratification of identity.  
  4. **Practical outcome**: Designating it a replica would erase its biographical value – a metaphysical error with tangible emotional/financial consequences.  

  The disagreement reveals a **real feature of artifacts**: Their persistence relies on collective intentionality and narrative, not mere physics. The materialist sibling’s view stems from conflating *identity* with *substrate* – a category mistake when applied to culturally embedded objects. By adopting a processual framework, your clause respects the bench’s true nature as a *testament to sustained human care*.
