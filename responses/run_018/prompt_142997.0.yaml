prompt: |-
  I'm leading a fifty-minute tutorial for twelve first-year philosophy students on the conceptual structure of graded moral patienthood. The core idea is that sentience and its associated moral status come in degrees shaped by two interacting parameters—"affective bandwidth" (the range of valenced states a system can register) and "temporal binding depth" (the duration over which those states are integrated into a continuous perspective)—rather than by a single on-off threshold. To break binary intuitions, the session must navigate intermediate architectures that do not map neatly onto human-like consciousness: distributed nociceptive networks (e.g., cephalopods), reflex-driven decorticate mammalian systems, and simple homeostatic feedback loops (e.g., thermostats or plant root tropisms). Plan the explanatory sequence: identify the conceptual dependency that must be in place before the scalar framework can be introduced without collapsing into either anthropocentrism or undifferentiated panpsychism; specify the one comparative case study that should carry the session, describing exactly which properties it must display (high bandwidth with shallow binding versus low bandwidth with deep binding) and which properties it must lack; map the misconceptions students will predictably form—binary consciousness, anthropomorphic projection onto plants, neuron-counting as a proxy for status, and the worry that gradation entails moral equality across all systems—and indicate the precise point in the sequence where each should be headed off; design one final diagnostic question that reveals whether a student genuinely grasps the scalar logic rather than merely repeating it; and explicitly mark the quantitative weighting problem (how to trade bandwidth against binding depth) as beyond the scope of this level, with a clear statement of what is being left out and why. Present the plan as an ordered teaching arc. End with a one-sentence summary of your core pedagogical strategy as the final line.
reasoning: |-
  Okay, the user is leading a tutorial on graded moral patienthood for first-year philosophy students. They need a detailed plan explaining how moral status depends on degrees of sentience, based on two parameters: affective bandwidth and temporal binding depth. The challenge is to avoid binary thinking without falling into anthropocentrism or panpsychism.

  First, I need to establish the foundational concepts. Students likely come with intuitive binary views—either something is conscious or not. So starting by challenging that is crucial. Using decorticate mammals as an initial case study makes sense because they're biologically close to humans but lack higher cognition, which helps illustrate shallow binding. Highlighting the absence of suffering despite pain reflexes can set the stage for introducing the parameters.

  Next, introducing the parameters clearly is key. Affective bandwidth covers the range of valenced states, while temporal binding depth deals with how those states are integrated over time. Using cephalopods as the main comparative case study works well because they show high bandwidth with shallow binding—rich sensory experiences but limited temporal integration. This contrasts with the earlier mammal example and avoids anthropomorphism.

  Addressing misconceptions must be woven into each section. When discussing decorticate mammals, preemptively counter neuron-counting by pointing out cortical structures aren't necessary for basic sentience. When plants come up, emphasize the lack of affective states in tropisms to prevent anthropomorphic projections. Later, when explaining gradation, clarify that it doesn't imply moral equality, using the thermostat example to show minimal moral weight.

  The diagnostic question at the end needs to test genuine understanding. Asking students to compare a jellyfish (high bandwidth, shallow binding) with a potential AI (low bandwidth, deep binding) forces them to apply the parameters without defaulting to binary or human-centric views. This reveals if they can handle non-human cases and trade-offs between the parameters.

  The weighting problem—how to balance bandwidth and depth—should be explicitly set aside. It's complex and beyond an introductory session. Stating this upfront prevents confusion and keeps focus on the conceptual framework. The core strategy is using contrast cases to build the scalar model incrementally, ensuring each step addresses potential misunderstandings before moving forward.
answer: |-
  Here is the structured teaching arc for your 50-minute tutorial, designed to build conceptual dependencies and preempt misconceptions:

  **Tutorial Arc: Graded Moral Patienthood**

  1.  **Groundwork: Deconstructing the Binary (10 mins)**
      *   **Starter Question:** "What property must a system possess to deserve *any* moral consideration?" (Elicit "sentience" or "capacity to feel/suffer").
      *   **Challenge the Threshold:** Present the **Decorticate Mammal (e.g., Thalamic Animal)** case study.
          *   *Properties Displayed:* Intact brainstem/thalamus; exhibits complex, coordinated pain withdrawal reflexes, vocalizations, autonomic stress responses to noxious stimuli.
          *   *Properties Lacking:* Neocortex; any evidence of integrated experience, learning from pain beyond immediate reflex, goal-directed avoidance *between* stimuli (shallow temporal binding).
      *   **Conceptual Dependency:** Establish that reflexive pain responses *without* integrated suffering exist. Conclude: Not all pain-behavior implies morally relevant suffering. The binary "sentient/not-sentient" is inadequate. *Preempts "Binary Consciousness" by showing dissociation between reflex and experience.*

  2.  **Introducing the Parameters (15 mins)**
      *   **Affective Bandwidth:** Define as the *range and granularity of valenced states* (pleasure/discomfort, specific qualia) a system can register. Examples: Human (vast range) vs. Simple Nociceptor (ON/OFF "bad" signal).
      *   **Temporal Binding Depth:** Define as the *duration over which valenced states are integrated into a single, continuous perspective*. Examples: Human (autobiographical narrative) vs. Decorticate Mammal (isolated moments) vs. Plant Tropism (no perspective, just reaction).
      *   **Core Insight:** Moral patienthood is a function of the *interaction* of these parameters. High status requires sufficient levels of *both*.

  3.  **Deep Dive: The Pivotal Contrast Case - Cephalopod Sentience (15 mins)**
      *   **Present Cephalopods (e.g., Octopus):**
          *   *Properties Displayed:* **High Affective Bandwidth** (Complex nervous system; distinct behavioral states indicating diverse moods/valences - curiosity, agitation, apparent play; sophisticated pain responses suggesting rich qualia). **Shallow Temporal Binding Depth** (Short lifespan, limited evidence of long-term integrated self-perspective; episodic memory likely fragmented).
          *   *Properties Lacking:* **Deep Temporal Binding** (No evidence of extended autobiographical narrative or complex future planning integrating past valences).
      *   **Analysis:** Why does this matter? They likely experience intense, diverse suffering/pleasure *in the moment* (high bandwidth demands moral weight), but lack the extended temporal self-concern of mammals (shallower depth *modulates* but doesn't negate status). *Preempts "Anthropomorphism of Plants" by contrasting cephalopod richness with purely reactive plant tropisms lacking any bandwidth.*

  4.  **Navigating the Gradient & Countering Misconceptions (5 mins)**
      *   **Map the Scalar Space:** Sketch axes (Bandwidth vs. Binding Depth). Place examples: Humans (high/high), Cephalopods (high/medium-shallow), Decorticate Mammals (low-medium/shallow), Insect Nociception (very low/very shallow), Plant Tropisms (Zero Bandwidth/No Binding), Thermostat (Zero Bandwidth/No Binding).
      *   **Preempt Key Misconceptions:**
          *   *Neuron Counting:* "Status isn't about raw neuron count, but *functional architecture* supporting bandwidth and binding. A small, optimized system (cephalopod) may have high bandwidth; a large, disconnected one (decorticate mammal) has low binding." (Addresses during cephalopod/decoricate comparison).
          *   *Moral Equality Fallacy:* "Gradation does NOT imply equality! A thermostat has negligible status; a cephalopod has significant status; a human has more. The scalar model explains *why* they differ and *how* to compare dissimilar architectures." (Address explicitly here, using the plotted examples).
          *   *Panpsychism Worry:* "Attributing minimal valence (bandwidth=1?) to very simple systems like a thermostat isn't necessary or supported by the model. True affective bandwidth requires internal complexity generating distinct valenced states, absent in basic feedback loops." (Reinforce during plant/thermostat placement).

  5.  **Boundary Setting: The Weighting Problem (2 mins)**
      *   **Explicit Statement:** "A crucial but advanced question we *cannot* resolve today is the *Quantitative Weighting Problem*: How do we precisely trade off units of increased bandwidth against units of increased binding depth when they conflict? Is high bandwidth/shallow binding (cephalopod) *more* or *less* morally significant than medium bandwidth/medium binding (e.g., a rodent)? This requires complex ethical calculus beyond our scope. Today's goal is establishing the *necessity* of this two-dimensional framework for understanding graded status, not solving the weighting."

  6.  **Diagnostic Question & Wrap-up (3 mins)**
      *   **Diagnostic Question:** "Imagine a hypothetical system: **System J** exhibits complex, diverse avoidance/appetitive behaviors to many stimuli (suggesting high affective bandwidth), but its 'experiences' are entirely reset every 10 minutes with no memory or connection between intervals. **System K** maintains a single, continuous perspective over years (deep binding), but can only register a single, undifferentiated 'bad' state when specific damage occurs (very low bandwidth). According to the scalar model, which system likely warrants *greater* moral consideration as a patient? Why? What key feature is decisive?"
          *   *Reveals Genuine Grasp:* Correct answer identifies **System J (High Bandwidth)**. A student merely repeating "both matter" fails. Genuine grasp requires arguing that diverse valenced states (J's bandwidth) are the *foundation* of morally relevant experience, while deep binding (K) without diverse valences offers little *to* bind. K only experiences one undifferentiated bad state intermittently; J experiences rich suffering/pleasure constantly, even if fragmented. They must prioritize bandwidth *in this specific comparison* and articulate why binding depth alone is insufficient without valence.
      *   **Summary:** Reiterate core: Moral patienthood is graded based on the interacting capacities for diverse valenced experience (bandwidth) and integrated self-perspective over time (binding depth).

  **Core Pedagogical Strategy:** Systematically build the scalar model by contrasting architecturally diverse case studies to dismantle binary intuitions while preempting collapse into anthropocentrism or panpsychism through precise parameter definition and targeted misconception addressing.
