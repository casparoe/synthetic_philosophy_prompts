prompt: |-
  I am a retired experimental physicist who has recently taken up the study of moral philosophy and formal decision theory. I now serve on the clinical-ethics advisory panel of a large teaching hospital, where we evaluate proposals for high-risk, non-standard therapeutic interventions — mostly compassionate-use requests and early-phase trials. Our deliberations too often reduce to an unstructured weighing of benefit against risk, and I wish to replace this with a disciplined, reusable procedure.

  My interest lies specifically in risk-weighted expected utility theory, which I understand as allowing the decision weight of an outcome to vary with its risk — the probability of occurrence — independently of any curvature in the utility function itself. I need this principle translated into an operational checklist that a panel of clinicians and lay members, none of whom are decision theorists, can run in a single one-hour session, with explicit stopping rules and with the points where human judgement is unavoidable clearly flagged.

  Please design such a procedure. It should proceed as an ordered sequence of questions or tests. For each stage, specify what counts as a sufficient answer, where the procedure terminates with a recommendation to reject, where it terminates with approval subject to conditions, and where it must halt and declare that the issue is one of values rather than calculation. The procedure must distinguish three dimensions that are often conflated in clinical discussion: first, the risk-weighted valuation of therapeutic outcomes, with benefits and harms weighted according to the framework's risk-dependent weights; second, the epistemic assessment of the probabilities themselves — that is, the confidence in the estimates and the cost of being wrong about them; third, the moral status and vulnerability of the patient population, which may affect how risk weights are applied without altering the underlying utility assessments. Specify how conflicts among these dimensions are to be handled within the framework, and identify the precise inputs — probability estimates, risk-weight parameters, utility values — that must be supplied by the panel.

  Then apply the procedure to three proposals. A: a gene-editing trial for a progressive neurodegenerative disease, with an estimated sixty per cent probability of halting progression and a fifteen per cent probability of an irreversible systemic inflammatory response; the evidence comprises three preclinical studies and one unpublished human case report. B: a palliative sedation protocol for terminal respiratory failure, offering near-certain relief of suffering but carrying a non-trivial risk of hastening death by several days; the patient is fully competent and has explicitly requested it. C: an off-label immunosuppressant regimen for an autoimmune disorder in which standard therapy has failed. Here the risk-weighted calculation yields a strongly positive recommendation, but the risk weights have been calibrated on a genetically distinct population. Applying them to this patient requires assuming biological uniformity across groups — an assumption I, given my scientific background, consider epistemically unwarranted. Nevertheless, if the procedure is followed mechanically, it mandates approval.

  For each case, show the step-by-step application, note any ambiguities, and for case C explain exactly why the framework produces a result I am inclined to reject, and whether the theory contains any internal mechanism — for instance, through the epistemic dimension you have built in — that permits or requires overriding the mechanical result.

  Finally, be explicit about the procedure's limitations: which disagreements it cannot settle, which ethical premises are smuggled in as apparently technical inputs, and how the panel should record a deliberate departure from the procedure when it chooses to take one.

  Please present the answer in British English, and do not include bibliographies, citation lists, or requests for further reading.
reasoning: |-
  Okay, let me approach this methodically. The user is a retired physicist now working in clinical ethics, seeking a practical decision framework grounded in risk-weighted expected utility theory (RWEU). They need an operational checklist for diverse panel members, with clear handling of three distinct dimensions: outcome valuation, probability confidence, and patient vulnerability. 

  First, I consider how to structure this. The procedure must be sequential but allow termination at clear decision points. I'll divide it into four phases: initiation, risk-weighted benefit assessment, epistemic scrutiny, and vulnerability adjustment. Each phase needs unambiguous pass/fail thresholds and flags for value judgments. 

  For the checklist design, I'm focusing on:
  - Using plain language questions without decision-theory jargon
  - Building in explicit stopping rules (reject/approve/halt)
  - Separating the three dimensions the user specified
  - Identifying required inputs at each stage
  - Creating conflict-resolution mechanisms between dimensions

  The core challenge is translating RWEU's mathematical formalism into practical steps. I decide to represent risk-weighting through a simple parameter (ρ) that modifies how probabilities are weighted, with ρ>1 indicating pessimism. This avoids conflating it with utility curvature. 

  For the case applications:
  - Case A will test handling of weak evidence and catastrophic risks
  - Case B surfaces autonomy vs. risk-weighting tensions
  - Case C exposes limitations of mechanical application when biological assumptions fail

  I anticipate the user's underlying concern in Case C: when "garbage in" (faulty probability estimates) produces "garbage out" despite correct calculation. The epistemic phase must catch this, but I need to show why it might not if assumptions are unchallenged.

  Key limitations to highlight:
  - The moral weighting of vulnerability remains subjective
  - Risk-aversion parameters embed ethical stances
  - The system can't resolve fundamental value conflicts
  - Mechanical outputs may violate clinical intuition

  The procedure should ultimately serve as a disciplined scaffold - not replacing judgment but making its exercise more transparent. For departures, I'll suggest documenting both the mechanical result and the reasoned override.
answer: |-
  ### Operational Procedure: Risk-Weighted Clinical Ethics Evaluation (RWCEE)  
  *For panel review of high-risk interventions, incorporating risk-weighted expected utility (RWEU), epistemic confidence, and vulnerability weighting. Timebox: 60 minutes.*

  **Phase 1: Initiation (5 mins)**  
  1. **Question:** *Does the intervention target a condition with no approved alternatives of comparable efficacy?*  
     - **Sufficient answer:** Yes → Proceed to Phase 2.  
     - **Terminate (Reject):** No alternatives exist, but condition is non-severe/life-limiting.  
     - **Halt (Values):** Disagreement on severity classification.  

  **Phase 2: Risk-Weighted Benefit Assessment (20 mins)**  
  *Inputs required: Outcome utilities (U), outcome probabilities (p), risk-weight parameter (ρ).*  
  2. **Question:** *Assign utilities (U) to all outcomes on a scale of -10 (max harm) to +10 (max benefit), with U=0 as neutral baseline.*  
     - *Panel consensus required. Flag: Value judgment (utility assignments).*  
  3. **Question:** *Estimate outcome probabilities (p) for all material risks/benefits.*  
     - *Document sources. Flag: Epistemic uncertainty (proceed to Phase 3).*  
  4. **Test:** *Calculate Risk-Weighted Expected Utility (RWEU) using formula:*  
     \[ \text{RWEU} = \sum \left[ w(p_i) \cdot U_i \right] \]  
     *Where \( w(p) = \frac{p^\rho}{(p^\rho + (1-p)^\rho)^{1/\rho}} \) (Prelec weighting function).*  
     - **ρ calibration:** ρ=1 (neutral); ρ>1 (pessimistic); ρ<1 (optimistic). Default ρ=1.5 for irreversible harm.  
     - **Terminate (Approve):** RWEU ≥ +2.0.  
     - **Terminate (Reject):** RWEU ≤ -1.0.  
     - **Proceed:** Ambiguous RWEU (-1.0 < RWEU < +2.0) → Phase 3.  

  **Phase 3: Epistemic Assessment (15 mins)**  
  *Inputs: Confidence scores (c) for each probability estimate (0-10 scale).*  
  5. **Question:** *Rate confidence (c) in each p: 10=randomised trial; 5=observational study; 0=anecdote.*  
     - *Weighted confidence score: \( C_{\text{avg}} = \frac{\sum (c_i \cdot |U_i|)}{\sum |U_i|} \)*  
  6. **Test:**  
     - **Terminate (Reject):** C_avg < 4.0 *and* worst-case outcome U ≤ -5.  
     - **Approve with conditions:** C_avg ≥ 4.0 *and* Phase 2 RWEU > 0 → Mandate data collection.  
     - **Halt (Values):** C_avg < 4.0 *but* RWEU > 0 → Proceed to Phase 4 for vulnerability override.  

  **Phase 4: Vulnerability & Equity (15 mins)**  
  *Inputs: Vulnerability index (V) 1-3 (1=standard; 2=high e.g., cognitive impairment; 3=extreme e.g., no advocacy).*  
  7. **Question:** *Does the patient/population have reduced capacity for informed consent or advocacy?*  
     - **Adjustment:** Multiply RWEU by vulnerability factor: γ = [1.0, 0.8, 0.5] for V=[1,2,3].  
  8. **Conflict resolution:**  
     - If Phase 3 halted due to low confidence, panel may override iff:  
       - V=1 *and* patient autonomy explicitly prioritised, OR  
       - V=3 *and* intervention prevents catastrophic harm (U ≤ -8).  
     - **Terminate (Reject):** Adjusted RWEU ≤ 0.  
     - **Approve with conditions:** Adjusted RWEU > 0 → Implement enhanced monitoring.  

  **Terminal Steps (5 mins)**  
  - **Approval:** Unanimous sign-off on RWEU, C_avg, and V scores.  
  - **Rejection:** Document which threshold failed.  
  - **Values deadlock:** Refer to institutional ethics committee.  

  ---

  ### Case Applications  

  **Case A: Gene-editing trial**  
  - *Phase 1:* Approved (no alternatives for neurodegenerative disease).  
  - *Phase 2:*  
    - Utilities: Halt progression U=+7, Inflammatory death U=–9, No change U=0.  
    - Probabilities: p_benefit=0.60, p_risk=0.15.  
    - ρ=1.8 (catastrophic risk pessimism) → RWEU = (w(0.6)×7) + (w(0.15)×–9) = (0.54×7) + (0.31×–9) = –0.21.  
    → **Proceed** (ambiguous RWEU).  
  - *Phase 3:*  
    - Confidence: p_benefit (c=3: preclinical + case report), p_risk (c=2: preclinical only).  
    - C_avg = [(3×7) + (2×9)] / (7+9) = 39/16 = 2.44 (<4.0).  
    → **Terminate (Reject):** Low confidence + catastrophic risk.  
  - *Ambiguity:* Underestimates benefit confidence if case report is compelling (values halt possible).  

  **Case B: Palliative sedation**  
  - *Phase 1:* Approved (terminal respiratory failure).  
  - *Phase 2:*  
    - Utilities: Relief U=+8, Hastened death U=–2 (patient-weighted), No relief U=–5.  
    - Probabilities: p_relief=0.95, p_death=0.05.  
    - ρ=1.0 (neutral; patient autonomy) → RWEU = (0.95×8) + (0.05×–2) = 7.6 – 0.1 = +7.5.  
    → **Terminate (Approve):** RWEU > +2.0.  
  - *Note:* Epistemic/vulnerability phases skipped as approval clear. Moral conflict (hastening death) is resolved via patient utility assignments.  

  **Case C: Off-label immunosuppressant**  
  - *Phase 1:* Approved (standard therapy failed).  
  - *Phase 2:*  
    - Utilities: Benefit U=+6, Severe infection U=–7.  
    - Probabilities: p_benefit=0.70, p_risk=0.10 (from genetically distinct population).  
    - ρ=1.4 → RWEU = (w(0.7)×6) + (w(0.10)×–7) = (0.63×6) + (0.23×–7) = +2.17.  
    → **Terminate (Approve)** per mechanical RWEU.  
  - **Why rejection is warranted but framework approves:**  
    - Epistemic failure (Phase 3) is bypassed because RWEU > +2.0 triggers automatic approval.  
    - The probability estimates (p) are imported without adjustment for population differences—an *epistemic error* not captured by confidence scores alone.  
  - **Internal mechanism to override:**  
    Phase 3 allows rejection if C_avg <4.0 *and* severe harm possible. Here, C_avg for p_risk should score ≤2 (extrapolated data) → C_avg = [(5×6) + (2×7)] / (6+7) ≈ 44/13 ≈ 3.38 (<4.0). With U_risk=–7 (severe), **rejection applies**.  
    *Your objection triggers re-rating confidence scores to reflect biological non-uniformity.*  

  ---

  ### Limitations & Ethical Caveats  
  1. **Unresolvable Disagreements:**  
     - Utility assignments (e.g., weighting death hastening vs. suffering).  
     - Choice of ρ (pessimism bias is a moral stance).  
  2. **Smuggled Premises:**  
     - ρ >1 embeds precautionary principle.  
     - Vulnerability factor γ imposes communitarian limits on autonomy.  
  3. **Deliberate Departures:**  
     - If panel overrides procedure, document:  
       *"Override at Phase [X] due to [ethical rationale]. Mechanical outcome: [Approve/Reject]."*  
  4. **Boundary Conditions:**  
     - Fails for non-commensurable harms (e.g., dignity vs. survival).  
     - Cannot detect omitted outcomes (e.g., long-term societal risks).  
  5. **Procedural Safeguard:**  
     - All inputs (U, p, ρ, c, V) must be recorded verbatim to audit value-laden assumptions.  

  This procedure structures deliberation while exposing value judgments at defined nodes. It forces epistemic discipline but cannot eliminate the need for moral reasoning—particularly when evidence or vulnerability undermines mechanical aggregation.
