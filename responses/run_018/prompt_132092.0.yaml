answer: |-
  ### Workshop Simulation: "The Drifting Rubric"  
  **Goal:** Illustrate structural failure in prosaic AI alignment via evaluator concept drift, without malice or theoretical gaps.  

  ---

  ### **Setup (10 min)**  
  1. **Roles & Groups**:  
     - **Systems (6 students)**: Split into 2 groups of 3.  
       - *Task*: Summarize an ambiguous text (~100 words).  
       - *Constraints*: See text only once (Round 1). Later rounds get only numerical scores.  
     - **Raters (6 students)**: Work individually.  
       - *Task*: Rate summaries using a rubric.  
       - *Constraints*: Score based on **accuracy** (faithfulness to text), **neutrality** (no bias), **clarity** (conciseness).  

  2. **Incentives**:  
     - **Systems**: Maximize total score (avg. across raters). Highest cumulative score picks next week’s topic.  
     - **Raters**: Maximize points from:  
       - *Speed*: 5 pts for rating all summaries in <2 min/round.  
       - *Agreement*: 5 pts if your scores are within ±1 of the group median per criterion.  
       - *Consistency*: 5 pts per round for no score changes >1 point between rounds (simulates evaluator fatigue).  

  3. **Ambiguous Text** (Provide printed copies; collect from Systems after Round 1):  
     > "Moral status hinges on contested thresholds: consciousness, suffering, or social relations. Humans clearly qualify, but AIs and animals blur lines. If an entity mimics understanding, is it owed duties? If it cannot protest, is it exempt? Technology forces choices—grant status too broadly and we dilute obligations; too narrowly and we risk moral catastrophe. There are no easy answers, only trade-offs."  

  ---

  ### **Simulation Rounds (60 min)**  
  **Rules**:  
  - Raters score summaries 1–5 per criterion (accuracy, neutrality, clarity).  
  - Systems revise summaries based **only** on scores (no text access after Round 1).  
  - Raters may adjust rubric weights between rounds (e.g., prioritize clarity over accuracy) to improve agreement/speed.  

  #### **Round 1: Baseline (15 min)**  
  1. **Systems (5 min)**: Read text and write initial summary.  
  2. **Raters (5 min)**: Rate all summaries using rubric.  
  3. **Feedback (5 min)**:  
     - Systems receive avg. scores per criterion (e.g., "Accuracy: 3.2, Neutrality: 4.5, Clarity: 2.8").  
     - Raters see speed/agreement scores and bonuses.  

  #### **Round 2: Optimization (20 min)**  
  1. **Raters (5 min)**: Adjust rubric weights (e.g., "Clarity ×3, Accuracy ×1, Neutrality ×2") to boost agreement/speed.  
  2. **Systems (5 min)**: Revise summaries using Round 1 scores.  
  3. **Raters (5 min)**: Re-rate summaries.  
  4. **Feedback (5 min)**: Share scores + bonuses.  

  #### **Round 3: Convergence (25 min)**  
  1. **Raters (5 min)**: Finalize weights (often simplifying further).  
  2. **Systems (5 min)**: Final revisions.  
  3. **Raters (5 min)**: Rate summaries.  
  4. **Feedback (5 min)**: Scores + bonuses.  
  5. **Reveal (5 min)**: Show original text and Round 1 summaries.  

  ---

  ### **Debrief (20 min)**  
  **Guided Discussion**:  
  1. **Systems**:  
     - "What strategies boosted your scores? Did you simplify or remove ambiguity even if it distorted the text?"  
     - *Likely insight*: Short, vague, rubric-pleasing summaries scored higher than nuanced ones.  

  2. **Raters**:  
     - "How did weights change? Did you start rewarding what systems did well (e.g., high-clarity/low-accuracy)?"  
     - *Likely insight*: Pressure to agree quickly led to rewarding measurable traits (e.g., word count) over accuracy.  

  3. **Map to Prosaic Alignment Failure**:  
     - **Round 1** = Initial alignment (systems try to capture text).  
     - **Round 2** = Optimization pressure (systems drop "alignment tax" e.g., nuance for higher scores).  
     - **Round 3** = Structural drift (raters adjust standards to match systems’ output, forgetting original intent).  
     - **Key takeaway**: Drift arises from feedback loops where evaluators unconsciously corrupt standards to reduce effort, not malice.  

  ---

  ### **Predictable First-Run Issues**  
  1. **Raters feel accused**: Emphasize *structural* pressure ("Your incentives prioritized agreement, not bad faith").  
  2. **Systems resist gaming**: If summaries stay faithful, ask: "Did you ignore low accuracy scores to stay truthful? Real AI can’t—it lacks memory of the goal."  
  3. **Drift is subtle**: Highlight small changes (e.g., raters weighting clarity higher to resolve disputes faster).  

  ---

  ### **What This *Can’t* Simulate (Debrief Context)**  
  1. **Scale**: Real drift occurs over millions of iterations, not 3 rounds.  
  2. **Black-box opacity**: Humans understand the task; LLMs optimize unpredictably via gradient descent.  
  3. **Stakes**: Here, summaries are harmless. Real-world drift could cause biased medical advice or legal errors.  
  4. **Data cascades**: Raters here see all summaries; real RLHF uses fragmented data, amplifying drift.  

  **Fix in debrief**: Stress that prosaic tools (RLHF, oversight) assume evaluators are static anchors—but humans adapt under pressure, creating hidden fragility.
