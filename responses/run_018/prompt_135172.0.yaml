answer: |-
  **1. Exam Question**  
  Imagine a possible world where every single reasoning being (agent) is permanently destroyed. All that remains is a ‘normative residue’ – the lingering sense that, in this empty world, causing suffering *was* wrong. Does this residue constitute a genuinely normative reason? If so, *for whom or what* is it a reason? If not, does it collapse into merely describing how things *were*? Critically engage with the idea of ‘free-floating rationales’ (reasons that don’t need agents to hold them) in your answer. (60 minutes, approx. 800 words)

  **2. Model Answer (First Half)**  
  The core issue here is whether normative reasons – genuine ‘shoulds’ or ‘oughts’ – depend entirely on agents to exist or grasp them. Free-floating rationales suggest they don’t; they are objective truths about what counts as a reason for action or attitude, independent of anyone recognising them. Think of maths: ‘2+2=4’ is true even if no one’s counting. Proponents argue moral reasons, like ‘suffering provides a reason not to cause it’, are similar. They exist as part of the normative fabric of reality.  

  Crucially, we must distinguish between **reasons** themselves and **reasoners**. A reasoner is an agent capable of recognising and responding to reasons. But a reason, if objective, isn’t *made* by the reasoner; it’s *discovered*. The fact that suffering is bad *gives* anyone capable of understanding it a reason not to inflict it. The reasoner accesses the reason; they don’t invent it through their psychology, desires, or society. So, reasons might exist even if, hypothetically, no reasoners existed *yet* – they’d be truths waiting to be apprehended.  

  **3. Model Answer (Second Half)**  
  Now, the twist: a world *emptied* of all reasoners, forever, leaving only the ‘normative residue’. Does this residue remain a genuine *reason*? If reasons are objective truths, then arguably *yes*. The fact that suffering *was* intrinsically bad hasn’t changed; it’s a timeless truth about value. The residue isn’t just descriptive (‘beings *used* to have reasons not to cause suffering’); it points to an enduring normative truth (‘causing suffering *was and remains* wrong’). There’s simply no one left *for whom* it is a reason. It’s like a law of physics in an empty universe – still true, but not governing any events.  

  However, opponents argue this collapses. Without *any* potential reasoner – past, present, or future – the ‘reason’ loses its *normative force*. What does it mean for something to be ‘a reason’ if it cannot possibly figure in *anyone’s* reasoning? The residue, they say, is just a *description* of the *historical fact* that when agents existed, certain states (like suffering) gave them reasons. But in the empty world, there’s no ‘should’ left; only ‘was’. The ‘free-floating rationale’ needs the *possibility* of a floater (an agent) to make sense; otherwise, it’s just inert metaphysical clutter. Genuine normativity seems inherently relational – a reason must be *for* someone or something capable of being guided by it. Absolute absence of agents might extinguish normativity itself, leaving only its descriptive shadow.  

  **4. Marking Scheme (Total: 20 marks)**  
  *   **A (17-20):** Clearly distinguishes reasons from reasoners. Forcefully argues *either* for the objective survival of the residue as a genuine (but unclaimed) reason *or* for its collapse into mere description, linking this directly to the nature of normativity itself. Explicitly tackles the ‘for whom?’ challenge. Sophisticated discussion of whether normativity *requires* the potential for agency. Avoids simple realism/subjectivism binaries.  
  *   **B (13-16):** Good grasp of reasons/reasoners distinction. Engages with the residue scenario but may not fully resolve the tension or explore the ‘for whom?’ deeply. Might assert the residue is/isn’t a reason without sufficiently grounding it in a theory of normativity. Some original thought beyond basic definitions.  
  *   **C (10-12):** Basic understanding of free-floating rationales. Mentions the residue but treats it superficially (e.g., just says "it's still wrong" or "it's meaningless now"). Little exploration of *why* the absence of agents is problematic. May conflate reasons with beliefs/desires.  
  *   **D (7-9):** Unclear on core concepts (reasons vs reasoners, objective normativity). Misinterprets the residue scenario. Limited argument structure.  
  *   **E/F (0-6):** Significant misunderstandings, irrelevance, or very little engagement.  

  **5. Mistakes Costing Marks**  
  *   **Conflating reasons with reasoners/psychology:** Saying reasons *are* just beliefs, desires, or social conventions misses the point of objective rationales. (-3 marks).  
  *   **Ignoring the ‘for whom?’ challenge:** Not addressing who the residue could possibly be a reason *for* in an empty world is a major oversight (-4 marks).  
  *   **Treating residue as purely descriptive without argument:** Asserting it collapses into mere description without explaining *why* normativity vanishes with agents is weak (-2 marks).
