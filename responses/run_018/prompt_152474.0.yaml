  hey, i'm trying to map out what i actually think about causing harm in different scenarios, especially where people invoke double effect but i never fully bought the standard framing. here are my gut verdicts -- some feel solid, one or two i'm wobbly on:

  - flipping the switch to divert the trolley from five to one: permissable.
  - pushing the big guy off the bridge: not permissable.
  - surgeon kills one healthy patient to harvest organs for five dying ones: not permissable.
  - doctor gives a dying patient pain meds that will hasten death by a few hours, purely to relieve agony: permissable.
  - commander orders strike on a weapons cache knowing two civilians will die, but it stops an attack that'd kill forty: permissable.
  - remote drone case: there's a malfunctioning drone heading for a crowd of eight. the only way to redirect it to an empty field is to use one specific worker's biometric profile (pulled from a database) to unlock the navigation override. doing so kills that one worker who'd be in the field. i think this is not permissable, even though it's numerically identical to the switch case. maybe it's using his identity/data as an instrumental key?
  - i keep going back and forth on this one: a factory manager can release a toxic spill onto one employee's work area to save five others, but she can only do it by manually overriding the safety system with that specific employee's access code. not sure.

