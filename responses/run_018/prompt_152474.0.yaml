    "principle_name": "Agency and Means Prohibition (AMP)",
    "core_claim": "Harm is permissible only if (1) it is a foreseen but unintended side effect (not a means/goal), AND (2) the action does not co-opt a person's body, identity, or property as a functional tool without consent.",
    "clauses_with_case_motivation": [
      {
        "clause": "Side effect requirement",
        "motivation": "Explains pain meds (permissible) vs. organ harvest (impermissible). Matches your emphasis on intent."
      },
      {
        "clause": "No instrumentalization",
        "motivation": "Resolves drone/factory cases: Using biometrics/access codes makes a person a 'key', violating bodily autonomy even if harm is indirect. Grounded in your rejection of 'instrumental use'."
      }
    ],
    "verdict_i_had_to_drop": "Factory spill: Your unsure verdict must become 'not permissible' to align with AMP's non-instrumentalization clause (matching drone case logic).",
    "predictions_for_unlisted_cases": [
      {
        "case": "Antibiotic triage (withhold from one to save five)",
        "prediction": "Permissible",
        "reason": "Withholding isn't using the patient as a tool (AMP#2 not violated), and harm is a side effect of allocating resources (AMP#1 satisfied)."
      },
      {
        "case": "Self-driving car swerve (kill pedestrian to save passengers)",
        "prediction": "Not permissible",
        "reason": "If the car uses the pedestrian's location/data as a 'trigger' to swerve, it instrumentalizes them (violates AMP#2). If purely algorithmic avoidance, may be permissible."
      }
    ]
  }
  ```

  ### Why AMP Works:
  - **Saves your intuitions**: Bridges double effect (AMP#1) with your emphasis on bodily/identity autonomy (AMP#2).
  - **Clarifies edge cases**: Drone/factory scenarios fail due to instrumentalization, not harm type.
  - **Handles omissions**: Allows antibiotic triage as resource allocation isn't "using" a person.

  To test coherence, ask: *"Does this action treat a person as a tool?"* If yes, AMP forbids it—even with identical outcomes to permissible cases.
