answer: |-
  Below is the analysis of your scenarios using a unified ethical principle. The simplest principle that preserves your core intuitions while resolving edge cases is the **"Agency and Means Prohibition" (AMP) principle**:

  **AMP Principle**:  
  *An action causing harm is permissible only if:  
  (1) The harm is a foreseen but unintended side effect (not a means or goal); AND  
  (2) The action does not co-opt a person's body, identity, or property as a functional tool without consent, even if the harm is a side effect.*

  This principle prioritizes **bodily autonomy** and **non-instrumentalization** over pure double effect. It explains why using someone's biometrics or access codes violates consent, making harms impermissible even when numerically identical to trolley cases.

  ---

  ### Analysis Table
  | Scenario                                      | My Verdict       | Principle Verdict | Match? | Notes on Discrepancy |
  |-----------------------------------------------|------------------|-------------------|--------|----------------------|
  | Trolley switch (divert to one)                | Permissible      | Permissible       | Yes    | Harm is side effect; no instrumentalization. |
  | Bridge push (fat man)                         | Not permissible  | Not permissible   | Yes    | Uses body as direct means (violates AMP#2). |
  | Organ harvest                                 | Not permissible  | Not permissible   | Yes    | Intends harm as means (violates AMP#1). |
  | Pain meds (hastening death)                   | Permissible      | Permissible       | Yes    | Harm is unintended side effect of pain relief. |
  | Airstrike (civilian collateral)               | Permissible      | Permissible       | Yes    | Harm is side effect; civilians not used as tools. |
  | Drone redirect (biometric kill)               | Not permissible  | Not permissible   | Yes    | Uses identity as instrumental key (violates AMP#2). |
  | Factory spill (access code override)          | Unsure           | **Not permissible** | Unclear | AMP#2 violated: Access code co-opts worker as tool. |
  | Antibiotic triage (withhold from one to save five) | — | **Permissible**   | — | Not covered in original list; see JSON below. |

  ### Key Insights:
  1. **Simplest Principle**: AMP saves all your clear verdicts (✓ 6/6) and resolves edge cases by adding a "non-instrumentalization" clause.
  2. **Coherence Trade-off**: Your unsure verdict on the **factory spill** must be overturned to **not permissible** for consistency. Using the worker's access code makes them a functional tool, mirroring the drone case.
  3. **Antibiotic Triage**: AMP deems it **permissible** (see JSON) since withholding treatment doesn't use the patient as a tool, and harm is a side effect of resource allocation.

  ---

  ### AMP Principle in JSON
