answer: |-
  1.  **Capture Full Context:** Note the exact situation, speaker gestures, surrounding objects, and speaker's apparent focus when the word was used (e.g., "Pointing at whole rabbit in field").  
  2.  **Cross-Check with 3+ Speakers:** Ask separate speakers the *simplest* word for the same object/action in that context and note any variations (e.g., "All said 'gavagai' for rabbit, but one hesitated").  
  3.  **Flag Indeterminacy Explicitly:** If context or cross-check leaves multiple plausible meanings (e.g., "rabbit" vs. "animal running"), state *all* possibilities clearly in the translation notes.  
  4.  **Test with Edge Scenario:** Ask "If only the *ear* was visible, or just *hopping*, would you still say 'gavagai'?" to probe boundaries.  
  5.  **Acknowledge Untestable Assumptions:** Accept that some meanings (e.g., "undetached part" vs. "whole") remain untestable guesses; mark these as high-judgment calls.

  **Worked Case (Bad Answer):** For "gavagai" heard near rabbits, translating *only* as "rabbit" ignores possible meanings like "prey animal" or "small mammal running"; failing steps 3 & 4 misses ambiguity.  
  **Unfixable Limitation:** The procedure cannot resolve deeply embedded ontological assumptions (like parts vs. wholes) without long-term cultural immersion.
