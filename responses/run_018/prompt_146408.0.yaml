prompt: |-
  i just started volunteering at a resettlement center and im the one translating intake forms for this language that has almost no written dictionary—lets call it K. every other word hits a Quine-style problem: a speaker points at a running animal and says gavagai but it could mean rabbit, undetached rabbit part, or a temporal slice, and theres literally no hidden fact that picks one. i need a reusable five-step checklist i can run in ten minutes before i sign off on a translation, with the judgment-call spots flagged, one worked case where the answer is bad, and a line on what the procedure cant fix. give me exactly five numbered points, each one or two sentences max, no intro or conclusion.
reasoning: |-
  Okay, the user is volunteering at a resettlement center and translating intake forms for a language they're calling "K," which has almost no written dictionary. They're facing Quine-style indeterminacy issues where a word like "gavagai" could mean rabbit, rabbit part, or something else entirely. They need a quick five-step checklist to use before signing off on translations, with each step being concise—one or two sentences max.

  First, I need to recall Quine's gavagai problem. Quine pointed out that when translating a word, there are multiple possible meanings because we can't access the speaker's mental state directly. The user is dealing with this in a real-world, high-stakes context where accurate translations for intake forms are crucial for refugees' resettlement. Mistakes could affect their access to services.

  The user wants a reusable five-step checklist they can complete in ten minutes. They also want judgment-call spots flagged, a worked case with a bad answer, and a note on limitations. Since they mentioned no intro or conclusion, I'll dive straight into the numbered points.

  Breaking down the requirements: The checklist needs to address translation indeterminacy practically. Steps should involve context gathering, cross-validation with multiple speakers, identifying ambiguities, testing with scenarios, and noting limitations. 

  For the worked case, I'm considering using "gavagai" as an example. A bad translation would be assuming it means "rabbit" without considering other possibilities, which could cause issues if it actually refers to a rabbit part in cultural contexts. This shows why the checklist is needed.

  Considering the user's deeper needs: They're likely overwhelmed and time-pressed. They need a quick, reliable method to reduce errors. Unspoken needs might include building confidence in their translations, ensuring cultural sensitivity, and avoiding legal or service complications for refugees. The checklist should be actionable and highlight where human judgment is irreplaceable.

  Structuring the five points: 
  1. Context capture: Note down the usage situation to anchor the meaning. 
  2. Cross-validate with three speakers to average out individual quirks. 
  3. Flag ambiguities explicitly in translations. 
  4. Test with edge cases to probe boundaries. 
  5. Acknowledge untestable assumptions as limitations.

  For the worked case: Using "gavagai" where assuming "rabbit" misses nuances, leading to misunderstandings. The limitation is that some ambiguities can't be resolved without long-term exposure.

