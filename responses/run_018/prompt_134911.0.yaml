  For "Shaky Ground," I should note Eleutheria's weakest point is dismissing intuition as irrelevant, and Sophron's is his vague "fundamental" criterion. The flip factors would be discovering concrete evidence of causally disconnected universes (for Eleutheria) or proving fundamental constants are necessary (for Sophron).

