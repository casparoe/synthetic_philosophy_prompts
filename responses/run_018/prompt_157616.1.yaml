prompt: |-
  After a three-hour argument last night with a friend who works in moral psychology—she kept framing hypocrisy as a simple credibility failure and I kept insisting it corrupts the practice of blame itself—I am now polishing my Q&A prep for a seminar I am giving next Thursday. I am defending a view I call the recursive-address model of hypocrisy: a hypocritical blamer does not merely forfeit standing in the standard tu quoque sense; rather, by issuing a normative demand they themselves violate, they structurally distort the framework of moral address, which generates a second-order obligation in the blamed party to reject the blame—not because the charge is false, but because accepting it validates an unequal relational structure. The audience will be a philosophy seminar room of mostly Kantian moral philosophers (who treat blame as a speech act governed by conditions of felicity and are allergic to anything that sounds like it excuses wrongdoers), two moral psychologists who study hypocrisy primarily as a credibility heuristic, and one graduate student writing on relational equality. They will push on whether I am letting offenders off the hook, whether my view collapses into a relativism about blame, and whether I can distinguish it cleanly from existing "no authority" accounts. I need a prep sheet, not a defense: list the six or seven objections I will actually get from this room, ordered from most damaging to least, each phrased in the vocabulary that audience uses, paired with a two-minute reply and an explicit note on where the reply is weakest. Tell me the one concession I should make up front to defuse tension, and identify the single question I am hoping nobody asks. Open with the bottom-line strategic verdict in one sentence. Keep the entire response under 450 words.
