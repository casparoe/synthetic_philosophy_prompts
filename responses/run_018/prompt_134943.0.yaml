  Subject: Pascal, Power, and the Justice of Climate Treaties  

  Thinking through Pascal’s stark claim that "justice without force is powerless" feels particularly urgent when staring down the slow-motion crisis of climate change and the patchwork of treaties meant to address it. Pascal, in the *Pensées*, argued that abstract justice is a beautiful illusion without the power to compel obedience. "Being unable to make what is just strong, we have made what is strong just," he observed (Fragment 103). Justice, in this earthly realm, necessitates force to restrain self-interest and impose order. Apply this to sovereign states negotiating climate accords without a global leviathan to enforce compliance, and Pascal’s framework seems to condemn them as mere wishful thinking – elegant documents signed, then promptly ignored as national interests diverge. Yet, the world isn’t 17th-century France writ large, and Pascal’s own theology complicates a purely coercive reading. Perhaps his "force" can be stretched, or reframed, to find a precarious justice in these fragile agreements after all.  

  The immediate objection is context. Pascal lived under an absolute monarch where "force" meant royal authority, divinely sanctioned and backed by swords. His skepticism targeted lofty ideals detached from the gritty reality of power politics. Transposed to a system of sovereign equals, his view suggests climate treaties are inherently unstable, doomed to be broken whenever compliance clashes with perceived national advantage. The Kyoto Protocol’s struggles and the non-binding nature of Paris Agreement targets lend weight to this bleak assessment. Where is the "force" ensuring adherence? Without a world police or court with real teeth, pledges risk becoming performative gestures, powerless against the tide of fossil fuel dependence and economic competition. Pascal’s fragment 298 echoes here: "We must then combine justice and force, and for this end make what is just strong, or what is strong just." If force is absent, justice evaporates.  

  However, dismissing all unenforced treaties as unjust ignores the evolution of "force" in a hyper-connected world. Pascal’s monarch wielded centralized, coercive power. The modern international system, while anarchic in theory, generates its own diffuse, structural forms of pressure – a kind of force born of mutual vulnerability. Economic interdependence itself becomes a mechanism of enforcement. States face tangible consequences for reneging: sanctions (even if ad hoc), exclusion from beneficial trade agreements, loss of investment, diplomatic isolation, and reputational damage that undermines soft power. The threat of carbon border adjustments, like those proposed by the EU, exemplifies this – economic force deployed to compel climate action. This isn’t a sovereign wielding a sword, but a complex web of interests creating coercive friction against defection. Within this structural reality, a treaty can be *just* (setting fair, agreed-upon burdens based on capacity and historical responsibility) and possess a degree of *effective force* derived from the system it operates within, even without a central enforcer. The justice isn’t powerless; its power is networked and economic, compelling through potential loss rather than direct punishment.  

  This interpretation must grapple with Pascal’s theological tension. For him, true charity (*caritas*) was divine love, flowing freely and voluntarily from a heart touched by grace – the very opposite of coerced justice. "All bodies, the firmament, the stars, the earth and its kingdoms, are not equal to the lowest mind... All bodies together, and all minds together, and all their products, are not equal to the least feeling of charity" (Fragment 793). Charity transcends the realm of force. This creates a paradox: Earthly justice *requires* coercion to function amidst fallen humanity, while the highest virtue, charity, is defined by its freedom from compulsion. Applied to climate action, mitigation obligations within treaties might fit the coercive "justice" model – necessary constraints enforced by structural pressures. However, elements like financial aid for adaptation or loss and damage in vulnerable nations edge closer to the realm of charity – ideally voluntary contributions reflecting solidarity, not strictly enforced debts. Pascal might argue that the justice of the treaty framework *enables* or *creates the space for* voluntary charity to operate more effectively by establishing baseline obligations through force (structural or potential), while recognizing that the purest acts of climate solidarity remain in the voluntary realm. The coercive structure prevents catastrophic free-riding, allowing charity to flourish where it will.  

  Therefore, Pascal’s framework doesn’t necessarily doom climate treaties to inherent injustice. While lacking a monarch’s sword or a world government’s gavel, they can draw force from the very structure of globalized interdependence – the economic and diplomatic costs of defection. This networked coercion provides the necessary "force" Pascal deemed essential for earthly justice to be more than idealism. The treaties themselves, when designed equitably, establish the "just" framework. However, Pascal’s enduring warning holds: without *effective* force – whether centralized or diffuse – the justice remains fragile, perpetually vulnerable to the self-interest he so mistrusted. The justice of climate treaties is thus contingent and precarious, reliant on the continued alignment of perceived self-interest with collective survival, reinforced by the tangible pressures of a connected world. They are not mere wishful thinking, but neither are they guaranteed. They represent a pragmatic, structurally enforced justice, striving imperfectly within a fallen world, while the voluntary charity Pascal exalted remains the vital, unforced supplement for addressing the profound inequities the coercive framework alone cannot heal. The verdict, then, is that they *can* be just, but their justice hangs by the thread of ever-shifting global power dynamics.
