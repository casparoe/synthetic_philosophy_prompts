prompt: |-
  I've been stuck on this thing about my grandma's advance directive. She signed it like twelve years ago saying no feeding tube if she ever got dementia and couldn't recognize people, but now she's got it pretty bad and seems content, just living in the moment. I was talking with my friend about whether that old paper should still control what happens, and we went in circles.

  Could you write a dialogue — not a debate with winners, just two people who both think about it carefully — arguing over whether the person who signed that form still has authority over the person she is now? I want real back-and-forth: each one should actually respond to the other's point, not just talk past them. One of them should probably think that once your memories and values are replaced, you're basically a new tenant in the same body, so the old instructions are like rules left by a previous roommate. The other should push back with something about how identity isn't just a list of beliefs you can check off, maybe using that ship example where you replace all the boards? Or maybe they bring up how if you change one tiny belief every day, you'd never notice the switch, but you'd still be you — or would you?

  Keep it grounded: don't have them cite books or philosophers by name, just work through the logic themselves. And make both of them sound reasonable, not like strawmen. Maybe they could be siblings cleaning out her house, or just two friends over coffee. I don't care which, just make it casual and a little messy — I spelled alzheimers wrong earlier and I don't care. The point is I'm trying to understand if there's a real disagreement here or if we're just using different words for the same worry, and I definatly want them to talk about whether being happy now should matter if you can't remember why you wanted the old plan.
