  Hmm, their constructed cases are telling: cyclical but endorsed choices, knowing framing reversals, genuine incompleteness, intertemporal regret without irrationality. These aren't quirks—they're deliberate stress tests. They want constraints, not excuses to dismiss anomalies. And they're wary of collapsed distinctions (indifference vs. no preference, choice vs. judgment). Smart. 

  The non-negotiables they listed reveal their priorities: empirical soundness (neuroscience compatibility), first-person authority, no cheating with axioms. But I suspect the real tension lies between behavioral determinacy, full first-person authority, and zero normative construction—that trio might be impossible. 

  When they ask which requirement "does the most damage," they're probing for the weakest link in existing theories. Probably first-person authority over revealed preference, since it forces mentalists to explain framing while stopping behaviorists from ignoring endorsement. 

  Their final ask is crucial: what would make me drop a desideratum? If cyclical endorsement is impossible (say, via rational incoherence) or if neuroscience finds utility signals after all. But I’d bet their framing cases are the real tripwire—if equivalence isn’t epistemic, mentalism collapses. 

