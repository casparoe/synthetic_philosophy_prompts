answer: |-
  Here’s the complete desiderata list for a theory connecting revealed preference to the meaning/content of utility ascriptions, structured to address your core challenges. The theory must reconcile behavioral patterns with normative and phenomenological dimensions while preserving critical distinctions often blurred in standard accounts.

  ---

  ### **I. Hard Cases as Constraints (Not Anomalies)**  
  *Why they’re non-negotiable: They expose foundational gaps in standard theories (e.g., collapsing indifference/incompleteness, ignoring reflexivity).*  

  1. **Reflectively Endorsed Cyclical Choices**  
     - *Constraint*: Demonstrates that rationality ≠ acyclicity. The agent may coherently affirm cycles (e.g., "I prefer A>B>C>A for aesthetic reasons").  
     - *Required Distinction*: **Revealed preference** (behavior) vs. **revealed judgment** (endorsed rationale). Standard RP conflates these.  

  2. **Knowingly Equivalent Framing Reversals**  
     - *Constraint*: Choice depends on non-informative framing *even under full knowledge of equivalence* (e.g., consistently choosing "80% lean" over "20% fat" while acknowledging identity).  
     - *Required Distinction*: **Choice determinism** (behavioral regularity) vs. **normative equivalence** (cognitive appraisal). Mentalists struggle to explain why "inner states" don’t correct behavior.  

  3. **Genuinely Incomplete Preferences**  
     - *Constraint*: The agent has *no comparison* (e.g., Mozart vs. quantum physics), not indifference (∆U=0). Indifference permits arbitrary choice; incompleteness voids choice.  
     - *Required Distinction*: **Absence of preference** (incomparability) vs. **indifference** (equal utility). Standard axioms (completeness) erase this.  

  4. **Intertemporal Shifts with Non-Irrational "Mistakes"**  
     - *Constraint*: Later self rejects earlier choice (e.g., "I shouldn’t have smoked") *without* dismissing past rationality (e.g., "It fit my values then").  
     - *Required Distinction*: **Mistake about utility** (substance) vs. **mistake in rationality** (procedure). Constructivists may over-normativize the shift.  

  ---

  ### **II. Non-Negotiable Consistency Conditions**  
  *Classified as Adequacy Conditions (AC) or Camp-Specific Preferences (CSP)*:  

  | **Condition** | **Type** | **Rationale** |  
  |---------------|----------|--------------|  
  | **Empirical equivalence with choice axioms** (completeness/transitivity) *where they uncontroversially apply* | AC | Avoids ad hoc exceptions; ensures grounding in observed choice. |  
  | **Compatibility with neuroscience**: No monolithic "utility signal" (e.g., distributed valuation in OFC/amygdala/striatum) | AC | Rejects reductive mentalism; utility isn’t a unitary neural entity. |  
  | **Preservation of first-person authority**: Agents can correctly report *some* utility-relevant states (e.g., "I prefer coffee to tea") | AC | Avoids behaviorist alienation from self-knowledge. |  
  | **Determinism about choice** (if X chosen, it must be "preferred" *ex post*) | CSP (RP) | RP’s core tenet—but conflicts with framing cases. |  
  | **Prohibition on unobservable mental states** | CSP (Behaviorism) | Ignores reflective endorsement. |  
  | **Normative construction only where behavior underdetermined** | CSP (Weak Constructivism) | Prevents arbitrary imposition of rationality. |  

  ---

  ### **III. Tensions & Joint Unsatisfiability**  
  The triad below is **structurally unsatisfiable** under standard interpretations:  
  - **Full first-person authority** (agent’s self-report is definitive)  
  - **Complete behavioral determinacy** (choices uniquely reveal utility)  
  - **Zero normative construction** (no external rationality principles)  

  *Why structural?*:  
  - Framing cases show behavior contradicts self-reported equivalence → violates **first-person authority** if we prioritize choice.  
  - If we privilege self-report, **behavioral determinacy** fails (choice ≠ utility).  
  - Resolving conflict requires **normative construction** (e.g., "true" utility ignores frames), violating the third condition.  
  *Contingent escape*: If framing effects vanish under ideal reflection (unlikely empirically), the tension weakens.  

  ---

  ### **IV. Scorecard of Theories (Illustrative, Not Exhaustive)**  
  *(Key: ★ = Satisfies, ✘ = Fails, ~ = Partial)*  

  | **Desideratum**               | **Strict Behaviorism** | **Mental-State Causal** | **Normative Constructivism** |  
  |-------------------------------|------------------------|--------------------------|-------------------------------|  
  | Reflectively endorsed cycles  | ✘ (Dismisses as error) | ✘ (Cycles = incoherence) | ★ (Norms permit cycles)        |  
  | Knowingly equivalent frames   | ★ (Choice defines utility) | ✘ (Contradicts "true" state) | ~ (Constructs context-specific utility) |  
  | Genuine incompleteness        | ✘ (Forces completeness) | ★ (Allows no comparison) | ★ (Builds partial orders)      |  
  | Intertemporal non-irrational mistakes | ✘ (Past choice = past utility) | ~ (States evolve) | ★ (Norms recontextualize) |  
  | Neuroscience compatibility    | ★ (Ignores states)     | ✘ (Seeks "utility signal") | ★ (No commitment)           |  
  | First-person authority        | ✘ (Choice overrides report) | ★ (Reports access states) | ~ (Only post-construction) |  

  **Most damaging requirement**: **Knowingly equivalent framing reversals**. It:  
  - Refutes behaviorism (choice ≠ stable preference),  
  - Refutes mentalism (contradicts unitary inner state),  
  - Forces constructivism into context-relativity (risking emptiness).  

  ---

  ### **V. Failure Conditions for Desiderata**  
  *What would compel revising the list?*  
  1. **Cyclical endorsement proven incoherent** (e.g., via rational dialectic):  
     - *Drop*: Reflectively endorsed cycles as a constraint.  
     - *Likely failure in reasoning*: Assuming all rationality is transitive. Non-transitive reasons may exist (e.g., "regret-minimizing" cycles).  

  2. **Neuroscience finds a unified utility signal** (e.g., common currency encoded in dopamine):  
     - *Drop*: Neuroscientific compatibility as stated.  
     - *Likely misinterpretation*: "No single signal" ≠ no integrated computation; distributed systems can still output unified valuations.  

  3. **Framing reversals vanish under strict equivalence knowledge**:  
     - *Reorder*: Demote framing to an epistemic problem (mentalism survives).  
     - *Likely flaw*: Equivalence knowledge may be *propositional* but not *affective* (e.g., frames trigger visceral responses).  

  ---

  ### **Conclusion**  
  An adequate theory must treat utility as a **triangulated construct**: behavior reveals *dispositions*, introspection reports *evaluative attitudes*, and norms stabilize *incompleteness*. The hardest trade-off is between **explanatory purity** (behaviorism/mentalism) and **explanatory scope** (constructivism). If you must commit, prioritize:  
  1. Distinguishing **incompleteness ≠ indifference**,  
  2. Allowing **reflective endorsement to override choice**,  
  3. Accepting **minimal normative construction** to resolve framing/cycle cases.  

  This preserves agency while acknowledging that utility is neither purely "in the head" nor wholly imposed by theory. The unresolved tension is structural—but empirically tractable via cognitive science (e.g., meta-preferences in framing) and neuroscience (e.g., neural correlates of regret in intertemporal shifts).
