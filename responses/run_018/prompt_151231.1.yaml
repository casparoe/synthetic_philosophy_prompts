  **Philosophy Dept. Implements Four-Dimensional Employment Model, Adjuncts Deemed Temporal Counterparts**

  **WESTBRIDGE, MA** – In a landmark move hailed as "metaphysically coherent" by administration, Westbridge University's Department of Philosophy has formally adopted perdurantist principles for its entire Human Resources policy framework. The shift replaces the traditional "endurantist" model of employee persistence with one recognizing faculty and staff as four-dimensional "space-time worms."

  Under the new policy, tenure is no longer granted to a professor at a specific time, but to their entire temporally extended worm. "Firing someone," clarified Provost Eleanor Vance, "is simply a matter of discontinuing future temporal extension of their employment worm. We are not ending their existence *simpliciter*, merely ceasing to fund or recognize subsequent temporal stages. It's ethically cleaner and avoids messy ontological commitments to enduring substances."

  The implications are far-reaching. Accusations of plagiarism now trigger investigations into "shared mental content across person stages," potentially absolving individuals if the idea originated in a past stage deemed sufficiently distinct. "It wasn't *me* who copied Heidegger," argued Professor Diane Lowell during a recent review, "it was my 2017-stage, influenced by a poorly indexed conference-proceedings-stage. Distinct causal chains." Emeritus status, meanwhile, has been redefined as the official university recognition and minimal funding of a faculty member's post-mortem temporal parts. "We proudly extend Dr. Henderson's worm indefinitely," Vance stated, referencing the late metaphysics scholar. "His office remains reserved for his future, albeit non-actualized, stages. It's symbolic continuity."

  The department is also piloting an exdurantist model for its adjunct faculty pool. Under this system, each semester-long teaching contract engages not a single, persisting individual, but an instantaneous "stage." Subsequent teaching assignments are filled by distinct stages linked only by "counterpart relations" – similarity and causal connection – rather than strict identity.

  "This allows for greater administrative flexibility," explained HR Director Ken Briggs. "Benefits like health insurance or paid leave require identity persistence under our old system. Now, when an adjunct requests benefits accrued over multiple semesters, we can accurately state, 'The stage contracted in Fall 2023, who requested those benefits, is merely a counterpart to the stage contracted now in Spring 2024. They are numerically distinct entities. The Fall stage's contractual obligations, including benefits requests, ceased with its temporal expiration. This Spring stage has its own, separate agreement.' It resolves previous ambiguities."

  Not everyone is convinced. Endurantist Professor Arthur Thorne filed a grievance, claiming the policy is being misapplied in his case. "By theire own perdurantist logic, I was technically fired during the 2019 budget cuts," Thorne fumed. "They issued a formal notice of non-extension for my future stages. Yet, here I am, occupying this office, teaching classes, and having my salary stages continuously extended against my explicit ontological objections! They're forcing persistence upon my essential self. It's a violation of my metaphysical autonomy." Administration maintains Thorne's worm was merely "under review for potential truncation," and that subsequent positive performance appraisals necessitated continued extension.

  The new policies are expected to streamline disciplinary actions, simplify post-retirement planning, and significantly reduce benefits expenditures for non-tenure-track faculty. The Faculty Senate's Ethics Committee has requested clarification on whether denying a raise constitutes "temporal part diminishment."
