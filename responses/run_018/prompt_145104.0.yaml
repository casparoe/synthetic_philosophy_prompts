  hey im in a philosophy of language seminar this term and we just went over lewis's triviality result for indicatve condtionals. i get the basic proof — if P(if A then B) equals P(B|A) then all indicatives with the same antecedent share the same probability, which is nuts — but im struggling to see what this actually implies for how ordinary people reason with if-then statements.

