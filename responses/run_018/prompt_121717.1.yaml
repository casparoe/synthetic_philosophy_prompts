  First, I need to recall Dancy's particularism core: holism of reasons. Moral reasons' contributions depend on context; no invariant valence. The user understands variability, like uniqueness being a reason to preserve or destroy a painting. Their worry is epistemic: if reasons don't carry over, how can we justify judgments through analogy? 

  The key here is distinguishing between principles and patterns. Particularists reject universal principles but acknowledge contingent patterns. Analogical reasoning isn't about applying a hidden principle but noticing similarities in contexts. The example of uniqueness: in one case, uniqueness might signal cultural value; in another, it could be tied to a dangerous ideology. The analogy works by comparing contexts, not assuming identical reasons. 

  The user's fear of "isolated-judgment" foundationalism might stem from thinking that without principles, each case is entirely new. But particularists argue that while each situation is unique, our past experiences and perception of salient features guide us. Moral judgment is more like perception than deduction. 

  I should emphasize that analogical reasoning in particularism is defeasible and based on similarity, not identity. It's not a guess but a reasoned comparison, open to revision if context differs. The middle ground exists in using precedents heuristically, not as binding rules. 

  Also, addressing the epistemic aspect: particularism doesn't make each judgment groundless. It relies on holistic evaluation where multiple features interact. Justification comes from perceiving the overall moral landscape, not applying principles. 

  The user might need reassurance that particularism avoids both rigid principles and arbitrary judgments. By focusing on context-sensitive discernment, it offers a coherent alternative. Highlighting Dancy's use of narrative coherence could help—how judgments form a web of interrelated cases, not isolated points.
answer: |-
  **Particularism does not collapse into isolated-judgment foundationalism because it relies on defeasible, context-sensitive analogical reasoning grounded in perceived similarities of overall situations, not on invariant principles or atomistic judgments.**

  Here's the breakdown:

  1.  **Rejection of Universal Principles ≠ Rejection of All Generalization:** Particularists reject *invariant* moral principles (e.g., "Lying is always wrong"). They don't deny that moral features *often* function similarly. We observe contingent, defeasible patterns (e.g., "Pain is usually bad-making"). These patterns aren't principles but useful generalizations based on past experience.

  2.  **Holism & Analogy:** The holism of reasons (a feature's valence depending on context) *requires* analogical reasoning. You look at a new situation and ask, "Is this situation *relevantly similar* to past situations where feature X counted for/against the action?" Crucially:
      *   **Similarity is Holistic:** You don't compare single features in isolation ("Both involve uniqueness!"). You compare the *overall constellation* of features and the *salient relationships* between them. Does the *context* surrounding uniqueness here resemble the context where uniqueness was a reason to preserve, or the context where it was a reason to destroy?
      *   **Polarity Flip is the Point:** Recognizing that uniqueness *can* flip polarity based on context is *essential* for accurate analogy. The particularist asks: "Given the *specific context here* (e.g., uniqueness tied to oppressive ideology vs. uniqueness tied to irreplaceable cultural heritage), does uniqueness play the *same role* it played in that past case I'm comparing it to, or a *different* one?"
      *   **No Hidden Principle:** The link isn't a hidden *universal* principle. The link is the perceived *similarity in the way reasons function holistically within the specific contexts being compared*. You see that Context A and Context B share a morally relevant structural similarity, making the role of feature X comparable.

  3.  **Epistemology: Perception & Defeasibility:** Particularism treats moral judgment more like perceptual judgment than logical deduction. We perceive the moral salience of features *within a context*. Analogical reasoning enlarges this:
      *   **Learning from Cases:** Past cases shape our perception, helping us recognize salient features and potential patterns in new ones.
      *   **Justification by Coherence:** Judgments gain justification not from deduction from principles, but from their coherence within a narrative of similar and dissimilar cases and their fit with the perceived details of the current situation. A judgment feels "right" because it resonates with our understanding of how reasons *tend* to hang together, while remaining sensitive to the unique configuration *here*.
      *   **Defeasibility:** Any analogical move *is* potentially defeasible. If a seemingly similar case turns out to have a crucial contextual difference that changes the role of a key feature, the analogy breaks. This isn't guessing; it's reasoned comparison open to revision based on closer scrutiny of context.

  4.  **Avoiding Foundationalism:** Each judgment isn't an isolated epistemic bedrock. It's situated within a web of past experiences, defeasible generalizations, and analogical comparisons. Justification flows from the perceived similarity to past justified judgments and the coherence of the overall moral picture we build through these comparisons. We *do* appeal to other judgments (past cases) for justification, but we do so holistically, recognizing that the relevance of the appeal depends on the context of *both* cases. The "middle ground" is this practice of contextually sensitive analogical reasoning guided by holistic perception, rejecting both universal codification and judgmental atomism.
