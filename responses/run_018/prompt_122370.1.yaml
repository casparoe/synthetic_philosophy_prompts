  3. Rule: Technologies have politics based on the scale of social restructuring they necessitate or enable (e.g., pill reshaped gender roles). Prediction: "No" because adoption is limited (rural cooperatives), suggesting insufficient broad societal restructuring potential compared to earlier "yes" cases.
  4. She's likely running the "embedded power asymmetry" rule; it consistently explains her "yes" (reactors, hiring algo, pill/longbow power shifts) and "no" (screwdriver, solar panels, QWERTY inefficiency ≠ asymmetry) verdicts, and directly applies to the proof-of-work's built-in inequality.
  5. The closest analog is nuclear reactors (both involve control/access structures: centralization vs. energy gatekeeping). A hypothetical splitter: a decentralized communication tool requiring rare earth minerals, creating access asymmetry ("yes" by asymmetry rule) but enabling diverse social forms ("no" by social form rule).
