  ### Joint Statement: Lewisian Conventionalists & Evolutionary-Norm Theorists  
  *After spirited debate at the "Nexus of Norms & Nodes" symposium, we—representatives of the strict Lewisian conventionalist camp and the evolutionary-norm camp—acknowledge shared ground while clarifying persistent disagreements. Below, we outline points of consensus and divergence, focusing on how conventions emerge and endure in complex social ecosystems.*

  ---

  #### **Agreed Claims**  
  1. **Coordination Problems**: Conventions solve recurrent coordination problems where multiple stable equilibria exist, and no single solution is inherently superior.  
  2. **Arbitrary Equilibria**: Conventions are fundamentally arbitrary; any equilibrium could persist if it resolves coordination friction, regardless of intrinsic "optimality."  
  3. **Common Knowledge Benchmark**: Common knowledge (infinite-order mutual belief) is a valuable *theoretical ideal* for modeling convention stability, though its practical necessity is disputed.  
  4. **Selection Pressures**: Evolutionary forces (e.g., efficiency, cognitive ease, payoff dominance) shape which conventions spread, stabilize, or decay—even in noisy environments.  
  5. **Self-Reinforcement**: Once established, conventions reinforce themselves through feedback loops (e.g., punishment for deviance, rewards for compliance).  

  ---

  #### **Disagreements Table**  
  | Core Issue | Strict Lewisian View | Evolutionary-Norm View |  
  |------------|----------------------|------------------------|  
  | **Common Knowledge Necessity** | "Conventions *require* common knowledge to stabilize; without it, coordination collapses into brittle, temporary truces." | "Conventions can bootstrap stability *without* common knowledge, using local learning and population-level feedback alone." |  
  | **Power Asymmetries** | "Power imbalances are *external noise* distorting convention selection; true conventions are neutral coordination tools." | "Power asymmetries are *internal* to conventions, constitutively shaping norms via unequal influence or access." |  

  ---

  #### **Cruxes & Concrete Predictions**  
  **Crux 1: Is Common Knowledge Necessary?**  
  - **Case**: A network adopts a resource-sharing convention (e.g., "split water 50/50 when nodes meet"). Half the agents are **grey-listeners** (observing only 40% of interactions). The convention locks in *despite* grey-listeners’ partial ignorance.  
    - **Lewisian Prediction**: Convention collapses. Grey-listeners’ inability to verify others’ beliefs fractures common knowledge, triggering cascading defections.  
    - **Evolutionary-Norm Prediction**: Convention survives. Pairwise interactions and local learning allow grey-listeners to "piggyback" on visible patterns, sustaining global stability.  

  **Crux 2: Are Power Asymmetries Internal or External?**  
  - **Case**: In the same grey-listener network, a dominant subgroup (with full observation) pressures others into accepting a 70/30 resource split.  
    - **Lewisian View**: The asymmetry is *external*—a distortion of the "pure" convention. The 70/30 split is an equilibrium *selected* by power but not *defined* by it.  
    - **Evolutionary-Norm View**: The asymmetry is *internal*—power dynamics are baked into the convention. The 70/30 split *is* the norm, sustained by unequal observability.  

  ---  
  *Signed,*  
  *The Lewisian Delegation* (common knowledge or bust!) &  
  *The Evol-Norm Collective* (norms are jungle vines, not crystal palaces)  

  ---  
  **P.S.**: Both camps agree the grey-listener case is a litmus test. Lewisians insist it’s a "zombie convention" (undead but unstable); Evol-Norms call it "scrappy adaptation." We’ll reconvene after running simulations in the *NORM-SIM 9000* sandbox.
