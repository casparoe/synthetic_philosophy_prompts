answer: |-
  Your scepticism is well-founded—the slogan "all truths are knowable" is philosophically treacherous, often conflating distinct theses. Below, I disentangle its precise interpretations, assess compatibility with **Fitch's paradox**, clarify which support "unknowability entails falsehood," and evaluate relevance to cosmological-horizon truths. I use British English throughout.

  ---

  ### **Key Distinctions & Theses**
  #### **1. Alethic Possibility (Modal)**
  - **Thesis**: ∀p (p → ◊Kp)  
    *"For every true proposition p, it is metaphysically possible that p is known (by some agent at some time)."*  
  - **Status**: **Refuted by Fitch's paradox**.  
    - Fitch shows: If *all* truths are knowable, and there exists an *unknown* truth (p ∧ ¬Kp), then ◊K(p ∧ ¬Kp). But K(p ∧ ¬Kp) entails Kp ∧ K¬Kp → Kp ∧ ¬Kp, a contradiction.  
    - Thus, this universal claim implies *all truths are known* (∀p (p → Kp)), collapsing into **omniscience**.  
  - **Cosmological Relevance**: Falsified by permanently inaccessible facts (e.g., events beyond the cosmological horizon), as ◊Kp fails for such p.

  #### **2. Temporalised Knowability**
  - **Thesis**: ∀p (p → ∃t ◊K_t p)  
    *"For every true p, there is some time t at which it is possible to know p."*  
  - **Status**: **Vulnerable to a temporalised Fitch paradox**.  
    - If p is *never actually known*, let q = "p is never known". If q is true, ◊K_t q implies K_t q at some t, meaning at t we know p is never known—contradicting p’s existence (since K_t q entails ¬p at t).  
  - **Cosmological Relevance**: Fails for truths permanently outside causal contact. If p (e.g., "galaxy X formed at time t") is *principally* undiscoverable due to cosmic expansion, ∃t ◊K_t p is false.

  #### **3. Restricted Logical Knowability (Trivial)**
  - **Thesis**: ∀p (Kp → ◊Kp)  
    *"If a truth is known, it is knowable."* Or equivalently: *"All knowable truths are knowable."*  
  - **Status**: **Logically true but trivial**.  
    - ◊Kp is vacuously true if Kp is true. This imposes no constraint on *unknowable* truths.  
  - **Cosmological Relevance**: Does **not** support "unknowability entails falsehood." Silent on permanently inaccessible facts.

  #### **4. Verificationism (Substantive Metaphysical Commitment)**
  - **Thesis**: ∀p (p ↔ ◊Kp)  
    *"Truth is defined as (idealised) knowability."*  
  - **Status**: **Evades Fitch only by redefining truth**.  
    - Fitch’s paradox is "solved" by denying that unknowable truths exist *by definition*.  
    - Commits to: *Unknowability entails falsehood* (¬◊Kp → ¬p).  
  - **Cosmological Relevance**: **Changes the subject**. Declares truths beyond the cosmological horizon *meaningless or false*—not because they are inaccessible, but because "truth" is epistemically constrained. Does not *address* such facts; it dismisses them.

  ---

  ### **Which Theses Support "Unknowability Entails Falsehood"?**
  - **Direct Support**:  
    Only **Thesis 4 (Verificationism)** asserts ¬◊Kp → ¬p.  
    - *Relies on conflating knowledge with truth*: Reduces truth to epistemic accessibility.  
  - **Indirect Support (Collapsed Alethic Thesis)**:  
    **Thesis 1** implies ¬◊Kp → ¬p *only after* Fitch forces ∀p (p → Kp). But this is a reductio, not a credible position.  

  ---

  ### **Fitch's Paradox: Which Theses Survive?**
  | **Thesis**               | **Compatible with Fitch?** | **Why?**                                                                 |
  |--------------------------|----------------------------|--------------------------------------------------------------------------|
  | Alethic Possibility (1)  | ❌ No                      | Leads to logical contradiction (∀p (p → Kp)).                           |
  | Temporalised (2)         | ❌ No                      | Similar contradiction via temporal unknowability.                       |
  | Restricted Logical (3)   | ✅ Yes                     | Trivially true; imposes no substantive constraints.                     |
  | Verificationism (4)      | ⚠️ "Evades"                | Avoids contradiction by redefining truth, but at high metaphysical cost. |

  ---

  ### **Cosmological-Horizon Case: Which Theses Genuinely Address It?**
  - **Theses 1 & 2**: Directly confront the issue but fail—**undermined by Fitch**. They cannot reconcile permanently inaccessible truths with knowability.  
  - **Thesis 3 (Trivial)**: Ignores the problem entirely.  
  - **Thesis 4 (Verificationism)**: **Does not address it**—dissolves the problem by denying such truths exist. This is a *rhetorical* move, not a solution.  
  - **Genuine Engagement**: **None**. The cosmological case challenges *any* knowability principle demanding universal ◊Kp. A consistent realist would:  
    - Accept that some truths are unknowable (defusing Fitch by rejecting ∀p (p → ◊Kp)),  
    - Argue that truth transcends knowability (e.g., via a correspondence theory).  

  ---

  ### **Conclusion**
  - **The maxim's work**: Primarily rhetorical. It either:  
    (a) Illegitimately dismisses inaccessible truths via verificationism (Thesis 4),  
    (b) Collapses under logical scrutiny (Theses 1–2), or  
    (c) Is trivial (Thesis 3).  
  - **Fitch’s lesson**: Non-trivial universal knowability claims are untenable. The cosmological horizon exemplifies truths that are *causally* (not just logically) unknowable, exposing the maxim’s fragility.  
  - **Your colleague’s inference** ("if true, could be known") relies on **Thesis 4**, conflating *epistemic accessibility* with *truth*. This is not a defence but a *redefinition* that sidesteps the cosmological challenge. A robust response requires rejecting the maxim’s universal form and acknowledging truths beyond empirical reach.  

  For the cosmological case, a coherent position is:  
  > *"Events beyond the horizon are true in virtue of mind-independent reality. Their unknowability is a contingent fact about causal structure, not a failure of truth."*  
  This preserves realism without appealing to discredited knowability principles.
