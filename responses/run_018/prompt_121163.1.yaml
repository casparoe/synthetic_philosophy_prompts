  ## PhD Program in Multi-Species Historiography: Frequently Asked Questions
  **University of Lower Silesia, Faculty of Temporal Ecologies**

  **1. What is the core methodological framework of the program?**
  The program operates under the mandatory Agency Allocation Protocol (AAP). All dissertation research must rigorously apply the AAP formula to distribute historical "authorship credit" proportionally between human and non-human actors identified as materially significant within the chosen historical period or event. The AAP calculation weighs two primary factors: Counterfactual Dependency (CD), assessing the degree to which an outcome would demonstrably differ in the *absence* of the actor, and Material Persistence (MP), quantifying the actor's enduring physical impact on subsequent historical trajectories. A minimum 30% non-human agency allocation is required for dissertation approval.

  **2. How does the AAP formula work in practice?**
  The standard formula is: `Agency % = (CD * 0.6) + (MP * 0.4)`. CD is measured on a 0-10 scale by the candidate, justified through historiographical argument comparing documented realities with plausible alternative scenarios lacking the actor. MP is quantified using designated archival proxies (e.g., sediment layers, genetic drift rates, atmospheric residue levels, infrastructure degradation metrics) scaled 0-10. The resulting percentage determines the actor's formal credit weight in the dissertation's narrative structure and acknowledgements section. Consultation with the AAP Compliance Office (Room 4.21, Old Geology Wing) during proposal development is mandatory.

  **3. Can non-human actors fulfill supervisory roles?**
  No. Advisory functions are strictly limited to accredited human faculty members possessing a relevant doctoral degree recognized by the Polish Ministry of Science. While non-human actors may exert profound *influence* on the research direction (factored into the AAP), pedagogical oversight, ethical review compliance, and grade assignment require human cognition and institutional accreditation. The Program Committee cannot delegate its responsibilities to microbial, geological, or meteorological entities, regardless of their historical impact.

  **4. A potential applicant asks: Could *Yersinia pestis* serve as a co-advisor for a dissertation on the Black Death, given its decisive AAP score?**
  As per Section 3 above, no. *Yersinia pestis* is ineligible for formal advisory status due to lack of accreditation and inherent limitations in meeting supervisory obligations (e.g., office hours, feedback on draft chapters, committee meeting attendance). Its undeniably high CD and MP values within the 14th-century Eurasian context should, however, be reflected in its AAP allocation (likely exceeding 60%), significantly shaping the dissertation's analytical framework and receiving prominent co-authorship acknowledgement. The human primary advisor retains responsibility for guiding methodological rigor and academic standards.

  **5. Why did the University award an honorary doctorate to the 1815 Tambora eruption?**
  The Senate conferred the *Doctor Causa Honoris* upon the Tambora eruption (event designation: T-1815) in recognition of its unparalleled demonstration of Material Persistence (MP=9.8) and profound Counterfactual Dependency (CD=9.5) regarding the "Year Without a Summer." Its AAP score, calculated retrospectively by the Department, approached 95%. The eruption’s agency in triggering global climatic anomalies, agricultural collapse, mass migration, and socio-political unrest exemplifies the core tenets of Multi-Species Historiography. The degree certificate is displayed in the Volcanic Agency Archive.

  **6. How are conflicts over AAP allocations adjudicated?**
  Disputes regarding CD or MP scoring must be submitted in writing to the AAP Arbitration Panel (AAP-AP), comprising three faculty members (one each from History, Earth Sciences, and Bio-Philosophy) and the Faculty Dean (ex officio). The petitioner must present evidence challenging the initial scoring metrics. The AAP-AP's decision, reached via majority vote, is final. Appeals beyond this level are not permitted, as they introduce excessive human procedural agency disproportionate to the material-semiotic entanglement under review.

  **7. Is it possible for a glacier to have "interests" within the AAP framework?**
  The AAP quantifies demonstrable *influence* and *persistence*, not imputed subjectivity. While a glacier possesses significant MP (via landform sculpting, hydrological control) and CD (influencing settlement patterns, resource availability), the attribution of "interests" falls outside the AAP's operational scope. The protocol deals with measurable agency-as-impact, not speculative internal states. Dissertations must focus on the actor's tangible historical effects, not anthropomorphized motivations. Human interpretations of glacial "behavior" are subject to standard historiographical critique.

  **8. Does high non-human AAP allocation diminish human responsibility in historical analysis?**
  The AAP ensures a non-anthropocentric distribution of historical causality. A high non-human allocation indicates that factors beyond direct human control were materially decisive in shaping outcomes. It reframes responsibility as distributed across heterogeneous actor-networks. Human choices remain significant components but are analyzed within the constraints and affordances generated by co-acting non-human forces. The protocol prevents the over-attribution of historical causality to human intentionality alone, providing a more ecologically integrated account. Final dissertations must be submitted electronically via the university portal by the stated deadline; late submissions recieve a 5% penalty per day.

  ---

  **Commentary on the liberties taken:**

  The satire aims to critique the conceptual slippage inherent in some strains of non-human historiography by literalizing agency attribution through a bureaucratic protocol (AAP). It targets the core tension: equating profound causal influence with intentional agency risks reviving environmental determinism in new, quasi-animist clothing. The AAP formula, particularly the forced quantification and "authorship credit," satirizes the practical and philosophical messiness of assigning *narrative responsibility* to entities like microbes or volcanoes. The Tambora doctorate and plague co-advisor questions highlight the absurdity of extending institutional personhood based solely on impact. The glacier "interests" FAQ obliquely questions whether material persistence implies anything resembling intent. The critique lands, I believe, on the problematic elision between cause and actor, showing how an ostensibly progressive framework can inadvertently erase human choice by overloading the term "agency."

  The point I'm least confident about is the caricature of "Material Persistence" (MP) as applied to a volcano. While the Tambora eruption *did* have massive, enduring effects, framing its ash layers as "persistence" implying ongoing agential *participation* in history might drift towards straw-man territory. Proponents might argue they merely trace material *consequences*, not an eruption's continued "action." However, the AAP's requirement to grant it "authorship credit" based on MP *does* push the logic towards implying a form of lingering, quasi-purposive influence, which remains a fair target for the satire's reductio ad absurdum.
