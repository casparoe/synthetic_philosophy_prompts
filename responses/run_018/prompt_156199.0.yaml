     Instead of a corporation, a better analogy might be a family or a trust. In a family, membership is typically by birth, and members may feel a sense of responsibility for the family's past (like debts or honors) even if they did not personally incur them. However, this analogy is also imperfect because families are more intimate and the obligations are more cultural than legal. Alternatively, a trust: the state is held in trust by one generation for the next, and each generation has obligations to maintain and repair the trust. This captures the idea of intergenerational responsibility without requiring voluntariness.

