  Looking at the chain, step (2) is indeed where things go wrong. The user claims "the pleasure B might experience doesn't count as a reason to bring B into being" - but this overextends Benatar. The asymmetry says we don't harm anyone by withholding pleasure from non-beings, but when we're choosing whether to create, potential pleasure can still be a reason for creation, just not a necessary one. 

