answer: |-
  Here is the decision tree and taxonomy for diachronic vat responses, with unexplored/incoherent branches flagged (`>> ! <<`):

  1.  **Does knowledge require ruling out phenomenologically indistinguishable diachronic-vat scenarios?**  
      *   **Yes** → Proceed to Semantic Externalism Test  
      *   **No** → Proceed to Pragmatic Encroachment Test  

      **Semantic Externalism Test:** Can semantic externalism anchor mental content/content-bearers when the "agent" is reconstructed each moment?  
      *   **Yes** → **Neo-Mooreanism (Diachronic):** We *can* know we're not in the vat because externalism (e.g., causal history embedded in each instantiation) successfully anchors content and justifies rejecting the scenario without needing new evidence.  
      *   **No** → **>> Skeptical Outcome (Unoccupied/Incoherent Branch) <<:** If externalism fails *and* the scenario must be ruled out, knowledge of self-continuity is impossible, but this position struggles to explain how *any* self-referential knowledge could function within the vat itself.  

      **Pragmatic Encroachment Test:** Can pragmatic encroachment apply if there's no stable long-term agent to carry practical stakes?  
      *   **Yes** → **Closure-Contextualism (Diachronic):** Whether we must rule out the vat depends on contextually variable practical stakes; knowledge of self-continuity is possible in low-stakes contexts despite the threat, diverging from standard vat responses by tying justification to *diachronic* practical agency (even if fragmented).  
      *   **No** → **>> Invariantism (Ignores Temporal Fabrication) <<:** Knowledge of self-continuity is possible without ruling out the vat because pragmatic factors are irrelevant to justification, but this fails to address the *diachronic* threat specifically, treating it like the static case.  

      **Phenomenological-Continuity Defense (Alternative Path from "No"):** **Bypasses both tests** → **Phenomenological-Continuity Defense:** Knowledge of self-continuity is justified by the intrinsic, indubitable character of subjective temporal experience (e.g., retention/protention), rendering the diachronic vat scenario irrelevant to epistemic grounding, unlike the standard vat where external content *is* threatened.  

  2.  **Diachronic Externalism (Alternative Path from "Yes" to Semantic Externalism):** **Requires "Yes" to Semantic Externalism Test** → **Diachronic Externalism:** Mental content *is* anchored despite reconstruction via embedded diachronic causal chains (e.g., each instantiation encodes links to prior moments' external causes) or external facts persisting across instantiations, enabling knowledge of self-continuity.  

  3.  **Deflationary Option (Fundamental Rejection):** **Rejects the first question's premise** → **Deflationary 'No Fact of the Matter':** The diachronic vat scenario reveals "self-continuity" is a conceptual confusion; there is no substantive fact about persistence to know or doubt, making the threat illusory (unlike the standard vat, which presumes real external content).  

  **Key Divergences & Unexplored Branches:**  
  *   **Skeptical Outcome:** Remains unexplored/incoherent because rejecting diachronic externalism while requiring rule-out creates an epistemic dead end inconsistent with functional cognition.  
  *   **Invariantism:** Effectively ignores the diachronic fabrication by not adapting to the fragmentation of agency, treating it identically to the static vat.  
  *   **Neo-Mooreanism & Diachronic Externalism:** Both rely on externalism working *differently* than in static cases—requiring embedded diachronic links or persistent external anchors within each instantiation.  
  *   **Phenomenological-Continuity:** Uniquely leverages temporal consciousness itself as the answer, irrelevant to standard vat responses.  
  *   **Deflationary:** Radically dissolves the problem by attacking the coherence of "self-continuity," a move unnecessary for the standard vat.
