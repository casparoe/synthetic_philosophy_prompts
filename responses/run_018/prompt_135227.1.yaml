  I'm in a philosophy of mind seminar and we're arguing about eliminative materialism—like the Churchlands' claim that beliefs and desires are going to go the way of phlogiston. Someone in class floated this idea that mentalistic talk isn't just bad science but more like a social coordination technology, kinda like how engineers use "center of mass" without thinking there's a literal point with mass. If that's right, then maybe eliminativists can use belief-language pragmatically without ontological commitment—so saying "I don't believe eliminativism" isn't a contradiction, it's just opting out of a predictive game. But my study partner thinks that's a cheat: it smuggles representational content back in through the back door, and it still can't explain normative reasoning—why I ought to revise my views—without propositional attitudes.

  So I want an essay that takes this distinction seriously: can eliminative materialism survive once we seperate its ontological rejection from its linguistic practice? Does that separation save it from self-refutation, or does it collapse the view into something like expressivism or instrumentalism about mental talk? Weigh the arguments, consider whether the pragmatic defense actually addresses the normative-reasoning problem, and reach an actual conclusion—don't just end on "it depends"—justifying whether the view remains genuinely radical or was always less threatening than advertised.
