  The core innovation seems to be the precision of shared emotional posture without doctrinal substance. I recall Weil's "affective geometry" - her observation that collective emotions organize with mathematical precision when detached from truth. This captures the "instant agreement on enemies/toxicity" dynamic.

  Perhaps "affective militancy" as a term? It emphasizes:
  1) Emotional alignment as the binding force (affective)
  2) Combativeness as the organizing principle (militancy)
