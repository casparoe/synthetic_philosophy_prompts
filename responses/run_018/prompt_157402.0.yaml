answer: |-
  This phenomenon is indeed Weil-adjacent but requires sharper conceptual carving. Let's dissect it systematically:

  **Proposed Term: *Affective Militancy***  
  (Or *Postural Cohesion* if emphasizing structure over energy)

  **Core Definition:**  
  A decentralized group formation where coherence derives exclusively from synchronized *oppositional affect* (outrage, disgust, tactical hostility) and performative alignment against perceived enemies, while substantive beliefs remain fluid, contradictory, or intentionally unexamined. Justice is subordinated to the maintenance of collective emotional intensity directed at designated targets.

  **Key Differentiations:**  

  1.  **Against Weil's *Party-Spirit*:**  
      -   **Party-Spirit (Weil):** Requires institutional structure (party, union). Doctrine *exists* but becomes idolatrous; loyalty shifts from truth to the organization itself. Sacrifices truth *for the party*.  
      -   **Affective Militancy:** *No* institution or fixed doctrine. Sacrifices truth and consistency *for the affective charge of collective opposition itself*. The "group" is the ephemeral product of the shared posture. Doctrine is irrelevant or actively avoided to preserve agility and inclusion in the fight.  

  2.  **Against Groupthink:**  
      -   **Groupthink:** Seeks *cognitive* uniformity. Suppresses dissent to maintain an *illusion* of consensus and invulnerability. Demands belief conformity.  
      -   **Affective Militancy:** Tolerates radical *cognitive dissonance* (contradictory claims) as long as the *affective output* (direction of outrage, target identification) remains unified. Clarity of thought is discouraged not for illusion of agreement, but because it might dampen the militant energy or complicate the enemy focus.  

  3.  **Against Plain Tribalism:**  
      -   **Tribalism:** Coheres around shared *identity* markers (blood, creed, symbol). Defense of the *ingroup* is primary; the outgroup is defined by its *difference*. Loyalty is to "us".  
      -   **Affective Militancy:** Coheres around shared *posture towards the outgroup*. The "ingroup" is defined *by* its opposition ("not them"). Identity is secondary to the *performance of enmity*. Loyalty is to the *stance* against "them". You belong by performing the correct outrage correctly.  

  4.  **Against Herd Mentality/Mob Psychology:**  
      -   **Herd/Mob:** Characterized by impulsive, contagious emotion and loss of individual restraint. Low coordination, often ephemeral.  
      -   **Affective Militancy:** Exhibits *highly calibrated*, precise, and *sustained* coordination of affect ("appropriate" outrage, instant consensus on "toxic" utterances). It's a *disciplined* emotional posture, not a spontaneous surge.  

  **Weilian Resonance & Key Distinction:**  
  Weil diagnosed how collective structures (parties, nations) generate passions that usurp the individual's obligation to attend to truth and justice. **Affective Militancy is the metastasis of that dynamic *beyond* formal structures.** It's Weil's "collective passion" achieving coherence *without* the institution—a fluid, self-organizing network bound purely by the energy of opposition.  

  *   **Shared with Party-Spirit:** The *substitution*: Collective passion replaces the individual's patient, attention-filled pursuit of truth and justice. The "enemy" becomes the orienting pole, not a shared positive good. Truth becomes instrumental ("what weakens them").  
  *   **Key Distinction:** The *medium*. Party-spirit flows through rigid hierarchies and dogma. Affective Militancy operates through decentralized signal networks (online especially), using real-time performance validation (likes, shares, call-outs) to enforce postural conformity. Doctrine is superfluous; the *rhythm and target of outrage* is the doctrine.  

  **Edges & Implications:**  
  *   **Boundary:** It exists where *shared affect directed against a designated target* is the *sole necessary and sufficient condition* for group belonging/coherence, and where critical examination of beliefs or tactics *specifically relating to the target or the group's actions* is suppressed as disloyal or energy-sapping.  
  *   **Vulnerability:** Highly susceptible to bad-faith actors ("grifters") who understand and weaponize the required posture, and to rapid shifts in target as the affective energy seeks new outlets.  
  *   **Weil's Warning Embodied:** It exemplifies her deepest fear—the displacement of the individual's sacred responsibility for truthful attention by the seductive, energizing, but ultimately hollow and unjust, "we" of collective opposition. The *absence* of doctrine doesn't liberate thought; it makes the affective posture *more* tyrannical by removing any shared object for rational scrutiny.  

  In essence, **Affective Militancy** is the hyper-modern, decentralized incarnation of Weil's core critique: the triumph of collective passion over justice, now optimized for the network age, where the posture *is* the polity, and the enemy is the only truth that matters.
