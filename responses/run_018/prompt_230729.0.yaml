prompt: |-
  I have a friend whose moral judgments about animals are unusually stable across cases, and I want to predict how she will judge a new case before she knows about it. Her settled verdicts include the following. She regards it as seriously wrong to keep layer hens in battery cages or a parrot alone in a small, barren cage. She regards it as wrong to raise and kill a pig for food when one could eat otherwise, and wrong to kill a healthy dog for food even if it had been raised for that purpose. She regards it as wrong to use a chimpanzee in invasive biomedical research. She regards it as not wrong to eat oysters, mussels, or scallops. She regards it as not wrong to catch and kill a wild salmon for food, provided the death is quick.

  Now consider this new case. A company proposes to farm octopuses for food, keeping them in tanks and killing them by chilling. My friend knows that octopuses are invertebrates and that they have large brains, flexible behavior, and unusual problem-solving abilities. What would she likely say? I am less interested in the bare prediction than in the following: identify the moral principle or principles that best explain her past verdicts, state which rival principles fit them nearly equally well, explain what each principle implies about the octopus case, say which prediction you favor and why, and name one further case that would cleanly separate the rival principles. Lead with your bottom line in the first sentence—your predicted verdict and the principle you judge she is running—then give the reasoning, with no preamble and no restating the question.
reasoning: |-
  Hmm, the user wants me to predict a friend's moral judgment about farming octopuses based on her existing views. Let me analyze her settled verdicts first. She opposes keeping layer hens in battery cages and parrots in barren cages, which suggests she cares about confinement that restricts natural behaviors. She also thinks it's wrong to raise and kill pigs for food when alternatives exist, and even killing dogs raised for food is wrong. Using chimpanzees in invasive research is also wrong to her. However, she finds eating oysters, mussels, or scallops acceptable and doesn't mind killing wild salmon quickly for food.

  Now for the octopus case: farming involves tanks and chilling to death. Octopuses are invertebrates but known for intelligence - large brains, problem-solving skills. The key is to find a principle explaining all her judgments. 

  Sentience seems central. She objects to practices involving animals that can suffer or have complex experiences. Hens, parrots, pigs, dogs, chimpanzees - all are sentient vertebrates with clear capacities for suffering. Oysters etc. are bivalves, likely not sentient, so eating them is fine. Salmon is killed quickly, minimizing suffering, so acceptable. 

  But octopuses? They're invertebrates but highly intelligent. Research shows they feel pain, solve puzzles, have personalities. Farming them in tanks might restrict their natural behaviors, and chilling could cause suffering. So she'd likely oppose it based on sentience.

  Alternative principles could be species-based (vertebrates vs invertebrates) or capacity for suffering. But the species line doesn't fit because she accepts eating salmon but not dogs/pigs, both vertebrates. Capacity for suffering aligns better - bivalves lack it, octopuses have it. 

  To distinguish: test with shrimp. If she eats shrimp, it's about cognitive complexity; if not, maybe broader sentience. But shrimp sentience is debated, so it's a clean test case.
answer: |-
  **She would likely say it is wrong to farm octopuses, based on a principle that prohibits causing suffering or death to sentient beings with complex cognitive and experiential capacities.**

  **Explanatory Principle:** Her judgments are best explained by a principle focused on **sentience and cognitive complexity**. Specifically: *It is wrong to cause significant suffering, confinement that severely restricts natural behavior, or death to organisms capable of advanced subjective experiences (e.g., pain, distress, boredom, curiosity, social needs, complex learning, problem-solving), especially when alternatives exist or the harm is unnecessary.* This fits her verdicts:
  *   Hens/parrots: Suffering/boredom from extreme confinement.
  *   Pigs/dogs: Killing sentient beings with complex social/emotional lives for trivial reasons (taste) when alternatives exist.
  *   Chimpanzee: High cognitive capacity makes invasive research exceptionally harmful.
  *   Oysters/mussels/scallops: Likely lack advanced sentience or complex subjective experiences.
  *   Wild salmon: Quick death minimizes suffering; complex sentience present but harm is brief and arguably less severe than prolonged confinement/farming.

  **Key Rival Principle:** A principle based primarily on **vertebrate status** (wrong to harm vertebrates, permissible to harm invertebrates) fits *most* but not *all* her verdicts. It explains:
  *   Hens/parrots/pigs/dogs/salmon/chimps: Vertebrates, harm is wrong (except salmon's quick kill might be a mitigator).
  *   Oysters/mussels/scallops: Invertebrates, harm not wrong.
  *   **Misfit:** Octopuses are invertebrates. This principle would predict "not wrong" for octopus farming. However, her judgment on chimpanzees (emphasizing cognitive abilities) and acceptance of quick-kill salmon (minimizing suffering) suggests sentience/capacity matters more than taxonomy, making this principle a weaker fit.

  **Implications for Octopus Farming:**
  1.  **Sentience/Complexity Principle:** Octopuses demonstrably possess advanced cognition, problem-solving, play behavior, curiosity, and likely complex pain experiences. Farming in tanks would cause prolonged confinement (restricting natural foraging/exploration), likely boredom/distress, and chilling may cause significant suffering before death (evidence suggests it's not instant/always humane). Killing is for a trivial reason (taste) when alternatives exist. **Prediction: WRONG.**
  2.  **Vertebrate Status Principle:** Octopuses are invertebrates. **Prediction: NOT WRONG.**

  **Favored Prediction and Why:** I favor the prediction that **she would say it is WRONG**, based on the Sentience/Complexity Principle. This principle provides a unified explanation for *all* her verdicts, particularly her strong condemnation of harming highly cognitively complex beings (chimps) and her acceptance of harming bivalves lacking such complexity. Her focus in past judgments (confinement effects on birds, killing for food when unnecessary) aligns with concerns directly applicable to octopus farming. The Vertebrate Status principle fails to explain why cognitive complexity was highlighted in the chimp case and why bivalves are permissible while other invertebrates (like octopuses) might not be.

  **Discriminating Case: Shrimp Farming.** Shrimp are invertebrates, but evidence for their sentience is less robust than for cephalopods. Farming often involves high-density pens, disease, and stressful harvesting.
  *   **Sentience/Complexity Principle:** If she judges large-scale shrimp farming wrong, it emphasizes a broader view of invertebrate sentience/suffering. If not wrong, it suggests a higher threshold for cognitive complexity (met by octopuses but not shrimp).
  *   **Vertebrate Status Principle:** Would consistently predict "not wrong" for shrimp farming (invertebrate). Her verdict here would cleanly separate the principles: condemning shrimp aligns with Sentience/Complexity; accepting it aligns better with Vertebrate Status.
