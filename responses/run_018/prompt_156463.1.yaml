answer: |-
  **Bottom line: You'll see classmates labelled 'kind' or 'selfish' for identical underlying choices depending on invisible tweaks to the situation.**

  **Activity: The Threshold Drift Game**

  **Goal:** Force participants to witness how tiny, unnoticed situational shifts radically alter *public virtue/vice attributions* for the *same* people making similar core choices, making stable character attribution feel shaky.

  **Players:** All 14 students + you (Facilitator/Modifier Master). Split into two groups of 7: **Actors** (making choices) and **Judges** (assigning labels). Swap roles after Round 2.

  **Materials:**
  *   Scenario Cards (3 identical sets, one per round - see examples below)
  *   Modifier Envelopes (one per Actor per round, secretly containing the situational tweak)
  *   Whiteboard/flipchart for recording public judgements.
  *   Timer.

  **Rules:**
  1.  **Secrecy is Key:** Only the Facilitator knows the modifiers. Actors *only* know their core scenario. Judges *only* see the Actor's *choice outcome*.
  2.  **No Meta-Gaming:** Actors make choices based *only* on the info they're given (scenario + modifier instructions). Judges label *only* based on the single observed choice outcome.
  3.  **Binary Attribution:** After each round, each Judge *must* publicly assign one primary **Virtue (e.g., Kind, Honest, Generous)** OR **Vice (e.g., Selfish, Deceitful, Stingy)** to *each* Actor *based solely on that one action*. No "mixed" labels. Explain *why* briefly.
  4.  **Record Publicly:** Write each Actor's name and their assigned Virtue/Vice from each Judge on the board for that round.

  **Timeline (80 mins total):**
  *   **Setup (5 mins):** Explain rules, split groups (Actors/Judges), emphasise secrecy and binary labelling. Stress they are judging *this single act*.
  *   **Round 1 (15 mins):**
      *   *Facilitator:* Give each Actor a **Scenario Card** (e.g., "You find a £20 note on the empty classroom floor after a lecture. Do you: A) Hand it in to the department office? B) Keep it?") AND a sealed **Modifier Envelope**.
      *   *Actors:* Read Scenario. *Then* open envelope and follow its **SECRET** instruction (e.g., "You are running 10 mins late for a crucial job interview. This *must* factor into your choice."). Actors deliberate individually/silently for 2 mins, then write down choice (A/B).
      *   *Judges:* Observe choices being revealed (Facilitator reads out Actor names & their choice: "Sam kept the £20"). Judges then assign Virtue/Vice to each Actor *based only on this info*. Publicly declare & explain briefly. Facilitator records labels on board.
  *   **Round 2 (15 mins):**
      *   *Same Scenario Card* given to all Actors (e.g., the £20 note again).
      *   *New Secret Modifier* in envelopes (e.g., "You see a clearly labelled envelope next to the note with 'Student Hardship Fund - Donations' written on it. This *must* factor into your choice.").
      *   Actors choose (same A/B options). Judges observe choices, assign Virtues/Vices. Record.
  *   **Round 3 (15 mins):**
      *   **SWAP ROLES:** Original Judges become Actors, Original Actors become Judges.
      *   *New Scenario Card* (e.g., "A tutor emails everyone an answer sheet for tomorrow's test by accident. Do you: A) Delete it immediately and email tutor to warn them? B) Save it and use it?")
      *   *New Secret Modifier* (e.g., "The email subject line says 'URGENT: CONFIDENTIAL - DO NOT SHARE'. This *must* factor into your choice." - OR - "You overhear two friends boasting they already have the sheet. This *must* factor into your choice.").
      *   New Actors choose. New Judges assign labels. Record.
  *   **The Big Reveal (10 mins):** Facilitator reveals the **SECRET MODIFIERS** used in each round. Show how identical core scenarios (finding money, receiving an email) had tiny, decisive tweaks (time pressure, implied charity context, urgent framing, peer pressure). Point out specific Actors who got opposite labels (e.g., "Sam: 'Selfish' in Round 1 for keeping money while late, but 'Generous' in Round 2 for donating it? Same Sam!").
  *   **Debrief (20 mins):** Key Qs:
      1.  *Feel the Drift:* "How did it *feel* judging/being judged? Seeing the labels flip after the reveal? Did anyone *feel* like a different person round-to-round? Did the Judges *see* a different person?"
      2.  *The Attribution Trap:* "You labelled based on *one act*. How confident can you *really* be that label reflects 'character'? What did the hidden modifiers *do* to your threshold for calling someone 'kind' or 'selfish'?"
      3.  *Mapping to Situationism:* "This is the *attribution* part of the critique: We leap to character traits (virtues/vices) to explain behaviour, ignoring powerful situational nudges (modifiers) we often don't even notice. Your tiny contextual shift *was* the situationist 'soup of the day'."
      4.  *The Aggregation Problem:* "Virtue ethics says character is stable *across situations* and revealed *over time* through many acts. But look at the board! If we only saw Sam's Round 1 act, we'd call them selfish. Only Round 2? Generous. **Where's the 'real Sam'?** Aggregating acts *doesn't* give a clear picture if the situation wildly changes the meaning *and* our labelling of each act. The 'price' of saving virtue ethics? It needs to explain this massive variability *despite* aggregation, or redefine virtues as highly context-sensitive (which feels weak)."
      5.  *The Missing Piece (Honesty Bit):* **This game *can't* simulate longitudinal stability/instability.** We only see snapshots. Your friend says "watch long enough" - maybe *over years* patterns emerge despite these wobbles? That's the bit the situationist critique struggles to *fully* demolish with lab studies alone. You'll need to argue that point separately – discuss the Hartshorne & May honesty studies, or Doris's 'fragmentation' response. The game makes the *problem* of aggregation visceral, but can't prove no stability *ever* exists.**

  **Predictable First-Time Fails:**
  1.  **Judges wimp out:** They'll try to assign "It depends" or "Context matters". *HARD ENFORCE* the binary Virtue/Vice label rule. The point is to force the *attribution* they'd make *without* knowing the modifier.
  2.  **Actors overthink/ignore modifiers:** Some might try to 'game' it or forget the modifier. Keep choice time short (2 mins max). Remind them they *must* factor in the modifier instruction.
  3.  **Reveal panic:** "But *I* knew *why* I did it!" Yes! But the *Judges didn't*. Highlight the gap between actor's reason and public attribution.
  4.  **Debrief runs long:** Stick ruthlessly to the timeline. Get the reveal done quickly to maximise discussion. Focus debrief on the *experience* of labelling/being labelled and the board evidence.
  5.  **"But it's artificial!":** Acknowledge it! But argue the *psychological mechanisms* (framing, pressure influencing choices; fundamental attribution error in judging) are real and demonstrated. The game *amplifies* everyday dynamics.

  **Example Modifiers (Keep them simple & potent):**
  *   Time Pressure/Reward Focus ("You are running very late for X / You really need the money for Y").
  *   Framing/Implied Context ("The money is near a charity box / The email says 'URGENT & CONFIDENTIAL'").
  *   Social Proof/Anonymity ("You see others doing B / You are certain no one can trace this to you").
  *   Low Effort/High Effort ("The office is next door / The office is across campus and closes in 2 mins").

  **Why it bites:** They don't just *hear* about labelling inconsistency; they *do* the inconsistent labelling themselves, and see mates labelled oppositely for near-identical choices based on invisible tweaks. The reveal makes the 'threshold drift' undeniable and visceral. Good luck!
