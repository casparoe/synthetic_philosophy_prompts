  Hey, I'm a retired biologist who only recently started reading philosphy stuff—got pulled in by Hofstadter and Sander's Surfaces and Essences and thier claim that analogy is basically the engine of all cogntion. Now I'm stuck on why the debate about whether analogy is truly the 'core' hasn't moved in years: people just trade the same examples about wordplay and science and never budge. You are a professional philosopher of mind who thinks very carefully. Do a quick brainstorm first, then diagnose this for me. Is it a verbal mess about what 'core' means, a hidden empirical fight over brain mechanisms, or are both sides answering different questions—like how we invent versus how we recognize—under one heading? Give me exactly five numbered points, each a sentence or two, with no introduction or conclusion. And tell me honestly: could a sharp conceptual distinction or a new experiment actually end it, or is this just bedrock intuition?
reasoning: |-
  Okay, the user is a retired biologist who got into philosophy through Hofstadter and Sander's work on analogy as the core of cognition. They're frustrated that the debate hasn't progressed beyond trading the same examples. They want a professional philosopher's diagnosis on why this stalemate exists and whether it's resolvable.

  First, I need to unpack their core frustration: the cyclical nature of the debate. They mention wordplay and science examples being reused without resolution. That suggests the discussion might be stuck on definitions or differing frameworks. As a biologist, they're likely used to empirical evidence driving progress, so the philosophical deadlock must be puzzling.

