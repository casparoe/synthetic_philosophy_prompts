  First, I need to recall Wittgenstein’s exact moves on aspect-seeing. It’s not just about voluntary flipping—he stresses the *passivity* ("I *see* it!"), the embeddedness in practice, and the difference between "continuous seeing" and "dawning" of aspects. For religious belief, he emphasizes *ritual* and *training*—think of his comments on how children learn religion through gestures and actions, not evidence. 

  Ah, here’s the pivot: the user conflates the *dawning* of an aspect (which is sudden and context-dependent) with the *continuous hold* of a religious picture. Wittgenstein explicitly separates these in PI II xi. Religious belief is more like seeing the face in the tree every day for years—you can’t just "decide" to stop seeing your child’s face as your child. 

  Also, the user’s phrasing ("voluntary, non-cognitive framing") misses Wittgenstein’s key point: aspect-seeing isn’t cognitive *or* voluntary in the way hypotheses are. It’s pre-rational, like reacting to a face. Similarly, religious gestures (kneeling in prayer) aren’t chosen like opinions—they’re instinctive within a form of life. 

  Biggest oversight: Wittgenstein ties religious certainty to *ritual repetition* and *bodily training*. In *Culture and Value*, he compares it to kissing a lover’s photograph—not a voluntary interpretation but a natural outpouring. This anchors the "unwavering" quality the user worries about losing. 

  So my defense must: 
  1. Grant the analogy’s strength for *initial* belief (dawning aspect) but distinguish it from sustained belief (continuous aspect). 
