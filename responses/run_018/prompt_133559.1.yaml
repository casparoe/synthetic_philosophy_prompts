prompt: |-
  I'm recently appointed to oversee rehab program audits for our state's department of corrections — my brother's actualy inside right now, which is part of why I took the job — and I need a procedure I can run every week without calling a philosophy professor. The idea I want to operationalize is this distinction I read about: rehabilitation that treats someone as a future co-citizen who will eventually share in the authority of the rules (what some people call carceral citizenship) versus rehabilitation that just treats them as a risk-profile to be managed back into compliance. I need you to turn that into a decision checklist my team can actually use, with questions in order, what counts as a sufficient answer, where we stop with a hard no, where we have to hand it to a human because it's values not facts, and where it will misfire. Please write it in American English.

  Structure the response as a JSON object with exactly these fields: "audit_context" (string), "core_distinction" (string), "procedure_steps" (array of objects, each with "step" (integer), "test_question" (string), "sufficient_yes" (string), "sufficient_no" (string), "action" (one of STOP_NO, STOP_YES, HAND_TO_JUDGMENT, CONTINUE), "rationale" (string)), "hard_cases_flagged" (array of strings), "case_applications" (array of objects, each with "case_name" (string), "description" (string), "path_through_steps" (array of strings like "Step 1: YES → CONTINUE"), "final_verdict" (string), "unwelcome_result" (string explaining if the answer goes against the asker's likely preference)), and "procedure_limits" (string). Spell out that schema right in your answer so I can parse it.

  Run the procedure on three cases: (1) Halden Prison's kitchen program where inmates cook for staff and visitors and help plan menus; (2) an American supermax behavioral-modification unit that offers reduced solitary time in exchange for documented compliance; (3) a community-release coding bootcamp that teaches real skills but makes participants waive appeal rights to stay enrolled. Include at least one case where the procedure approves something I probably hate, or kills something I want to save. Don't give me a bibliography or reading list — I don't have library access at my desk — and don't quote philosophers verbatim in quotation marks unless you fetch the actual source text; paraphrase is totally fine. Keep it practical, but don't collapse the distinction between shared-rule citizenship and risk management. One or two typos are okay, I write fast too.
