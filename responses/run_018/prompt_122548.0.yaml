prompt: |-
  Hey — I'm a science journalist and I do a steady diet of short same-day pieces (500–800 words) on language acquisition, infant cognition, and, increasingly, ML papers pitched as finally settling some old nature/nurture argument. I keep writing sentences like "the study suggests grammar is hardwired," "the ability turns out to be learned after all," "this undercuts the claim that we're born knowing X," and honestly half the time I couldn't tell you what im claiming. My copy desk will not catch it, and twice now an author has emailed after publication saying we overstated them.

  What I want is a decision procedure I can actually run in ten minutes, on a press release plus an abstract plus one short phone call with the author, with no linguistics background, that tells me which of those sentences I'm allowed to write and what to write instead. Constraints: it has to output something my editor will print (she kills copy that is hedges stacked on hedges), it has to give me one line I can defend if the researcher complains, and it has to tell me when to stop and hand the question to a human — me making an editorial call, the author being asked what their model actually had access to, or an outside reviewer.

  Please build it around the real structure of the poverty-of-the-stimulus argument rather than around a vibe: the claim that learners end up knowing something the input they got didn't pin down, the point that kids mostly aren't corrected or told which sentences are impossible, and the inference from that gap to something in the learner. I specifically want:

  - A way to make me disentangle the things "innate" gets used for — present at birth, species-typical, not learned from experience, buffered against variation in experience, domain-specific, heritable, genetically specified — and a judgment from you about which of those I can collapse for my purposes and which will get me in trouble if I ignore them.
  - The "where is the work being done?" question in a form I can ask a researcher on the phone without sounding like I'm accusing them of cheating: what to ask about a model's training signal, architecture, and pretraining data, and what to ask about a child study. My sense is that a successful learner only relocates the puzzle, and I want the procedure to say what follows when that's true and what doesn't follow.
  - A rule that makes me fill in the blanks before I use the word at all: innate relative to *which* input, given *which* starting machinery. If I can't fill them in from the press release, the procedure should tell me to drop the word and give me the replacement sentence.

  Hard cases it has to handle: heritability and twin studies; a model that does well on a linguistic benchmark; "a language that lacks X" field reports; newborn and other very-early-infant effects; critical-period claims.

  Then run it on three of my actual situations:

  1. A group in Zurich trains a neural net on about 40 million words of child-directed speech from an existing corpus plus a few thousand hours of nursery audio, and it does better than expected at forming yes/no questions. The release says no innate grammar needed. I want to write that grammar isn't hardwired after all.
  2. A twin study, about three thousand pairs, a comprehension battery at age seven, heritability of "grammatical ability" around 0.6. I want to write that grammar is in the genes.
  3. A field report on a small Amazonian language described as having no embedded relative clauses at all, with the authors saying this shows recursion isn't innate.

  One of those three should come out as "you cannot write the sentence you want to write" — I'd guess the first one, but if the procedure bites hardest somewhere else, say so and show me.

  Finally, be straight with me about where this procedure misfires. My worry is that on this topic nothing is ever decisive and the checklist will just tell me to write mush every single time, in which case it's useless to me on deadline.

  Format: start with the bottom line — the one-sentence version of the whole procedure, the thing I'd tape above my monitor — then the checklist in the order I run it, then the three worked applications, then where it breaks. No preamble and don't restate the question back at me.
reasoning: |-
  We are building a decision procedure for a science journalist writing about nature/nurture debates in language acquisition, with a focus on avoiding overstatement and misusing terms like "innate." The procedure must be runnable in ten minutes using a press release, abstract, and a short call with the author. It must output a defensible, non-hedgy sentence and indicate when to hand off to a human.

  Bottom line (to tape above the monitor):

  **"Before claiming innateness, specify: (1) What is the gap between input and knowledge? (2) Where is the work being done? (3) Innate relative to what? If unclear, drop 'innate' and report the finding precisely."**

  ---

  ### The Checklist (in order):

  1. **Identify the Claimed Gap:**  
     - What specific knowledge or ability does the learner (child or model) end up with that is not clearly present in the input?  
     - For poverty of the stimulus: Is there evidence that the input underdetermines the knowledge? (e.g., children aren't corrected on ungrammatical sentences, or the input lacks certain structures).  
     - If no clear gap is described, stop and ask the author: "What specific aspect of language does your work show is underdetermined by the input?"  
     - If the gap isn't established (e.g., the input might contain the needed information), you cannot claim innateness for that knowledge. Proceed to step 4 for alternatives.

  2. **Where is the Work Being Done?**  
     - For **models**:  
       - Ask: "What in the architecture, training signal, or pretraining data could be providing the knowledge?"  
         - *Architecture*: Does the model have built-in biases (e.g., specific modules, recurrence)?  
         - *Training signal*: Is the model trained with explicit corrections (unlike children)?  
         - *Pretraining data*: Could the model have seen similar structures in other data (even if not child-directed)?  
       - If the model succeeds but uses data or signals not available to children, it doesn't show that children don't need innate knowledge.  
     - For **child studies**:  
       - Ask: "What does the design control for? (e.g., is the ability present at birth? tested in newborns? buffered against environmental variation?)"  
       - Newborn studies: If the ability is present at birth, it's at least present early, but not necessarily "innate" in all senses.  
     - **General rule**: A successful learner (model or child) only relocates the puzzle. If the model uses general learning mechanisms, it might reduce the need for domain-specific innateness, but not for all types of innateness.  
     - If the work is done by the environment (e.g., rich input) or by general learning mechanisms, then the claim "not innate" might hold for domain-specific innateness, but not necessarily for others.  

  3. **Specify 'Innate' Relative to What?**  
     - Disentangle the meanings of "innate" (present at birth, species-typical, not learned from experience, buffered against variation, domain-specific, heritable, genetically specified).  
     - **Collapse for simplicity**:  
       - In language acquisition, "innate" often means "not learned from the input" (poverty of the stimulus) or "domain-specific and present early".  
       - **Do not collapse**:  
         - "Heritable" (from twin studies) ≠ "not learned" (environment could still play a role).  
         - "Present at birth" ≠ "genetically specified" (could be prenatal learning).  
     - Fill in:  
       - Innate *relative to which input?* (e.g., child-directed speech, or all environmental input?)  
       - Innate *given what starting machinery?* (e.g., general learning mechanisms, or a blank slate?)  
     - If you can't specify, drop "innate" and use precise alternatives.  

  4. **Output Decision:**  
     - **If steps 1-3 are satisfied and the gap is clear, the work is in the learner, and "innate" is specified**: Write the strong claim.  
     - **If any step fails**:  
       - Write a precise finding without "innate" or its synonyms.  
       - Use: "The study shows that [X] can be learned from [Y] input," or "The ability appears early and is robust to [Z]."  
       - If the author overclaims in the release, use: "The authors argue that [X] is not innate, but..." and hedge only if necessary.  
     - **When to hand off**:  
       - If the gap is disputed (e.g., is the input really poor?), consult an outside reviewer or make an editorial call.  
       - If the model's training or child study design is complex and you can't assess, ask the author: "Does your model have access to information a child wouldn't?" or "How does this control for prenatal learning?"  
       - If the claim is about heritability, remember it may not reflect innateness in the sense of "not learned" – hand off to a genetics expert if needed.  

  ---

  ### Worked Applications:

  **Situation 1: Zurich neural net on child-directed speech**  
  - **Press release/abstract**: Model trained on child-directed speech (40M words) and nursery audio does well on yes/no questions. Release says "no innate grammar needed."  
  - **Phone call ask**: "What in the model's training or architecture could be providing the grammatical knowledge for question formation? Did it have any pretraining on other data? Is the training signal supervised (like corrections)?"  
    - *Author says*: The model is a transformer trained with next-word prediction (no explicit corrections). No pretraining beyond the child-directed corpus.  
  - **Checklist**:  
    1. **Gap**: The input (child-directed speech) might contain enough examples for the model to learn question formation. No clear gap shown (the model might be extracting patterns from abundant data).  
    2. **Work being done**: The model uses a general architecture (transformer) and a large dataset (40M words). It shows that with sufficient data and computational power, the structure can be learned. But children have less data, so this doesn't directly address poverty of the stimulus.  
    3. **Innate relative to what?**: The release claims "not innate" meaning "not needing domain-specific prior knowledge." But the model uses a domain-general learning mechanism.  
  - **Decision**: You cannot write "grammar isn't hardwired after all" because:  
    - The model's success doesn't prove children don't have innate biases; it just shows one way learning could happen.  
    - Overstatement risk: The input is massive and curated (40M words), whereas children hear less and noisier data.  
  - **Output**: Write: "The study shows that a neural network can learn to form questions from child-directed speech alone, suggesting that explicit innate grammar rules might not be necessary for this task."  
  - **Why not the desired sentence?** It overclaims by implying a general refutation of innateness for grammar.  

  **Situation 2: Twin study on grammatical ability**  
  - **Press release/abstract**: 3000 twin pairs, heritability of grammatical ability at age 7 is ~0.6.  
  - **Checklist**:  
    1. **Gap**: Not addressed. Twin studies measure heritability, not input/knowledge gaps.  
    2. **Work being done**: Heritability estimates how much variation in a trait is due to genetic variation. It doesn't show what is "innate" (e.g., a trait could be heritable but learned).  
    3. **Innate relative to what?**: "Heritable" ≠ "innate" in the sense of present at birth or not learned. It means genetic differences explain variance in the population, but environment still matters.  
  - **Decision**: You cannot write "grammar is in the genes" because:  
    - Heritability of 0.6 means genes explain 60% of variation, but 40% is environmental. Also, genes might influence learning ability, not grammar specifically.  
    - Risk: Equating heritability with innateness ignores gene-environment interactions.  
  - **Output**: Write: "The study finds that genetic factors account for about 60% of the variation in children's grammatical abilities at age seven."  
  - **Hand off?** Only if making broader claims about innateness; here, stick to the finding.  

  **Situation 3: Amazonian language without embedded clauses**  
  - **Press release/abstract**: A language reportedly lacks embedded relative clauses, authors claim this shows recursion isn't innate.  
  - **Phone call ask**: "How was the absence of embedded clauses determined? Were there alternative structures used? Could recursion be present in other domains (e.g., thought) or is it truly absent in the language?"  
    - *Author says*: Extensive fieldwork found no embedded clauses, but recursion might exist in other forms (e.g., narrative).  
  - **Checklist**:  
    1. **Gap**: Poverty of the stimulus would predict that even without hearing embedded clauses, children could use them. But if the language lacks them entirely, it doesn't test that gap (since no child is learning them).  
    2. **Work being done**: The absence in the language might reflect cultural or historical factors, not the lack of innate ability. Children might have the capacity but not use it if the language doesn't require it.  
    3. **Innate relative to what?**: The authors infer that recursion isn't innate because it's not in the language. But innateness (if it exists) could be for capacity, not expression.  
  - **Decision**: You cannot write "recursion isn't innate" based on this.  
  - **Output**: Write: "The study documents a language that appears to lack embedded clauses, challenging the idea that recursion is a universal feature of human language."  
  - **Why?** The absence of a structure in a language doesn't show that the capacity for it isn't innate; it might be unused or realized differently.  

  **Which one comes out as "cannot write"?**  
  Situation 1 (Zurich model) is the most overreaching. The model doesn't settle the poverty of the stimulus argument because it uses massive data and computational power not available to children. The other two also overreach, but the procedure flags all three as requiring alternative phrasing. Situation 1 is the most critical because it directly claims to refute innateness without the gap being properly addressed.

  ---

  ### Where the Procedure Misfires:  
  1. **Ambiguous Gaps**: Sometimes the gap (poverty of stimulus) is inherently hard to prove. The procedure might err on the side of caution, leading to weaker statements. But that's better than overstatement.  
  2. **Complex Models**: If a model uses unsupervised learning on "naturalistic" data, it might still not match child learning (e.g., data scale, multimodality). The procedure might not capture all nuances without deeper expertise.  
  3. **Heritability Confusion**: Twin studies are often misinterpreted. The procedure will stop you from saying "in the genes," but you might still need to explain heritability vs. innateness.  
  4. **Edge Cases**: For newborn studies, "present at birth" is strong evidence for early availability, but not necessarily for genetic specification. The procedure will force precision.  

  **Will it always output mush?** No. It forces precise claims:  
  - Instead of "grammar is hardwired," say "the study suggests children are born with biases for grammatical patterns."  
  - Instead of "learned after all," say "the model demonstrates that question formation can be acquired from typical child-directed speech."  

  This is not hedging; it's accuracy. Your editor should accept it because it's clear and defensible. If the finding is truly ambiguous, the procedure tells you to hand off or report the facts without overinterpretation.  

  **Final Bottom Line**:  
  **"Specify the gap, the learner's contribution, and the relativity of 'innate'. If you can't, report the finding without the buzzword."**
answer: |-
  **Bottom line (tape above monitor):**  
  "Before writing 'innate,' specify: (1) What gap exists between input and knowledge? (2) Where is the work being done (learner vs. input)? (3) Innate *relative to what input and machinery?* If unclear, drop 'innate' and report the finding directly."

  ---

  ### **The Checklist (Run in Order):**  
  **1. Identify the Gap (Poverty-of-the-Stimulus Core):**  
     - Ask: *"What specific knowledge/ability does the learner have that isn't justified by their input?"*  
       - Must be: (a) Not directly in input (e.g., ungrammatical sentences never heard), (b) Not learned via feedback (e.g., no correction), and (c) Robustly acquired despite input variation.  
     - **If absent**: Stop. Never claim "innate" here. Output: *"The study shows [ability] can be learned from [input]."*  
     - **If unclear**: Hand off to yourself/author. Ask: *"How did you establish the input lacks evidence for this knowledge?"*  

  **2. Pin Down "Where the Work is Done" (Relocate the Puzzle):**  
     - **For models**: Ask:  
       - *"What training signals (e.g., explicit error correction?) or pretraining data (e.g., non-child data?) might provide hidden cues?"*  
       - *"Does the architecture (e.g., transformers) have built-in biases that replicate 'innateness'?"*  
       - **Judgment**: If the model uses child-unavailable signals (e.g., curated data, corrections), it *doesn't* refute innateness. Output: *"The model can learn [ability] from [specific input], but may rely on [X] unavailable to children."*  
     - **For child studies**: Ask:  
       - *"Is this ability present at birth (e.g., newborn study?), or buffered against experience (e.g., in deprivation)?"*  
       - **Judgment**: If not tested at birth/varied environments, it might be learned early.  
     - **For heritability (e.g., twin studies)**:  
       - Ask: *"Does this measure genetic influence on learning speed, or fixed knowledge?"*  
       - **Judgment**: Heritability ≠ innate. It quantifies variation due to genes, not proof of "unlearned." Output: *"Genes explain [X]% of variation in [ability]."*  
     - **Hand off if**: Architecture/data are complex (e.g., "Did the model see syntax-like data in pretraining?").  

  **3. Disentangle "Innate" and Fill Blanks:**  
     - **Collapse for simplicity**: Use "not learned from experience" for domain-specific knowledge (e.g., grammar rules). OK to imply "species-typical" if universal.  
     - **Never collapse**:  
       - Heritable (twin studies) vs. not learned.  
       - Present at birth (e.g., newborn preference) vs. genetically specified (could be prenatal learning).  
     - **Fill blanks**: Innate relative to:  
       - *Which input?* (e.g., child-directed speech vs. all sensory data).  
       - *Which starting machinery?* (e.g., general learning vs. domain-specific modules).  
     - **If blanks unfilled**: Drop "innate." Output: *"The ability emerges early/is robust to input variation."*  
     - **Hand off if**: Input/machinery undefined (e.g., "What do children actually hear?").  

  **4. Final Output Rules:**  
     - **Write strong claim only if**: Gap clear + work in learner (e.g., architecture bias matches human biology) + "innate" specified.  
     - **Else**: Use direct findings. No hedges. Examples:  
       - ✅ OK: *"Children know [X] without evidence in input."*  
       - ✅ OK: *"The model learns [ability] without built-in grammar rules."*  
       - ❌ Not OK: *"Grammar is hardwired."* / *"Ability is learned after all."*  
     - **Kill switch**: If any step forces vagueness, default to: *"The study challenges/supports the view that [ability] requires innate knowledge."*  

  ---

  ### **Worked Applications:**  
  **1. Zurich Neural Net on Yes/No Questions:**  
     - **Press release**: "Model trained on child-directed speech excels at questions; no innate grammar needed."  
     - **Checklist**:  
       - (1) **Gap?** Input (40M words + audio) likely contains question examples. No proof input lacks evidence. ❌  
       - (2) **Work done?** Model has massive data scale (children hear ~10M words by age 5) and transformer architecture (inherent sequence bias). Author call Q: *"Could the architecture or data volume explain success without innate grammar?"* → *"Yes, transformers excel at patterns."* ❌  
       - (3) **Innate relative to?** Not specified; model uses different "machinery." ❌  
     - **Decision**: **Cannot write "grammar isn't hardwired."** Output: *"The model learns question formation from child-like input, suggesting grammar may not require innate rules."*  
     - **Why**: Model success relocates the puzzle to architecture/data—not proof for children.  

  **2. Twin Study on Grammatical Ability (Heritability = 0.6):**  
     - **Press release**: "Genes explain 60% of grammar skills."  
     - **Checklist**:  
       - (1) **Gap?** Twin studies don't address input/knowledge gaps. ❌  
       - (2) **Work done?** Heritability measures variation (genes vs. environment), not learning mechanisms. Ask: *"Could genes influence learning speed, not fixed knowledge?"* → *"Possibly."* ❌  
       - (3) **Innate relative to?** "Heritable" ≠ "not learned." ❌  
     - **Decision**: **Cannot write "grammar is in the genes."** Output: *"Genetic differences explain 60% of variation in children's grammatical abilities."*  
     - **Why**: Heritability ≠ innateness; environment still matters.  

  **3. Amazonian Language Without Embedded Clauses:**  
     - **Press release**: "Language lacks recursion, showing it isn't innate."  
     - **Checklist**:  
       - (1) **Gap?** Poverty-of-stimulus: Children *could* know recursion is possible even if unused. ❌  
       - (2) **Work done?** Absence in language ≠ absence in mind. Author call Q: *"Could speakers understand recursion if exposed?"* → *"Untested."* ❌  
       - (3) **Innate relative to?** Not specified; recursion could be domain-general. ❌  
     - **Decision**: **Cannot claim "recursion isn't innate."** Output: *"A language lacking embedded clauses challenges the universality of recursion in grammar."*  
     - **Why**: Shows cultural variability, but not that humans lack the capacity.  

  **Hardest Bite**: Situation 1 (Zurich model). Fails all checks: No gap proven, model's "work" relies on non-child-like resources, and "innate" is undefined.  

  ---

  ### **Where the Procedure Misfires:**  
  1. **Over-caution on "Decisive" Findings**: It will *never* give you "innate" or "learned" without unambiguous gaps + biological constraints. But 90% of studies lack this. You won’t write mush—you’ll write precise, defensible claims (e.g., *"suggests X may not require Y"*).  
  2. **Heritability Blind Spot**: Twin studies get reduced to "variation explained," never "innate." If editors want "genes = innate," push back with the checklist.  
  3. **Model Complexity**: If a model uses biologically plausible data/architecture (e.g., reinforcement learning with no corrections), the procedure may approve *"model learns without innate X"*—but still not for humans.  
  4. **Critical Periods**: If a study shows ability disappears after age X, the procedure outputs *"ability depends on early exposure"*—not "innate." Add: *"consistent with a critical period."*  
  **Final Reality Check**: The procedure avoids overstatement but won’t make indecisive studies decisive. It *will* save you from author complaints and give you one-liners to defend (e.g., *"I specified the input gap"*). On deadline, it takes 5 minutes once memorized.
