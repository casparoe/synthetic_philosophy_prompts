prompt: |-
  So a friend of mine who did a philosophy module last year sent me her summary of Nyāya epistemology, because she knows I've been reading about the sorites paradox and thought the Indian stuff on knowledge-sources might interest me. Here's what she wrote:

  "In the Nyāya school, knowledge comes from four sources (pramāṇas): perception, inference, comparison, and testimony. Inference basically means induction -- you observe a bunch of cases where smoke goes with fire, generalise, and then you can infer fire from smoke the next time. Comparison is reasoning by analogy, like arguing that because two things are similar in some respects they'll be similar in others. Testimony is just trusting what reliable people or scriptures tell you, which shows the school wasn't really doing epistemology in the Western sense, since it builds authority in from the start. All the classical Indian schools accepted these four sources, they just disagreed about how to rank them."

  Now, I mostly believe her because she got a good mark in the module, but a couple of things niggle at me. The bit about testimony making it "not real epistemology" seems like a weirdly confident verdict, and I have a vague memory that the Indian schools actually disagreed quite sharply about how many pramāṇas there even are. Also, is inference really just induction? That seems too simple.

  Could you audit the summary for me -- tell me which parts are accurate, which are plausible-sounding but subtly wrong or oversimplified, and what a defender of the Nyāya view would push back on hardest? I'd rather you commit to a verdict on each point with reasons than just lay out possibilities and leave me to decide. And please answer in British English.
reasoning: |-
  Okay, the user has shared their friend's summary of Nyāya epistemology and wants me to audit it. They've raised some specific concerns about testimony being presented as "not real epistemology," about whether all Indian schools accepted the same four sources, and about inference being equated with induction.

  Let me break down the friend's summary point by point. The summary claims there are four pramāṇas: perception, inference, comparison, and testimony. It then equates inference with induction, describes comparison as analogy, and frames testimony as simply trusting authority. The summary also claims all Indian schools accepted these four sources but disagreed on ranking.

  I need to verify each of these points. On the four pramāṇas: Nyāya does indeed recognize these four, but the description of inference as "basically induction" is an oversimplification. Nyāyan inference has a deductive structure with a formal five-step syllogism, though induction plays a role in establishing the universal premise. The comparison part is accurate in spirit, though the technical term is upamāna, which has specific parameters.

  The testimony description is problematic. Calling śabda "just trusting authority" misses its nuanced epistemology of reliability conditions. And the claim that this makes it "not real epistemology" is a value judgment that ignores how testimony functions as a knowledge source across philosophical traditions.

  The claim about all schools accepting four pramāṇas is factually wrong. Schools like Cārvāka accepted only perception, while Buddhism accepted two, and Mīmāṃsā added non-perception. The ranking disagreement is true but secondary to the fundamental disagreements about what counts as pramāṇa.

  The user wants definitive verdicts with reasons, in British English. They seem philosophically engaged - noticing the "weirdly confident verdict" about testimony and remembering schools disagreed on pramāṇas shows good critical thinking. Beyond factual accuracy, they likely want to understand why these oversimplifications matter for engaging with Nyāya on its own terms.

  For each point I'll give: 1) Accuracy verdict 2) What's missing/misleading 3) What Nyāya would defend. On inference, I'll clarify the syllogistic structure; on testimony, explain reliability conditions; on universal acceptance, list the actual disagreements. The tone should be precise but accessible - they're coming from sorites paradox interest so can handle complexity if explained clearly.
answer: |-
  Right then, let's dissect your friend's summary with a fine-toothed comb. While she's got the basic framework, there are several points of significant oversimplification and one rather glaring misrepresentation that a Nyāya scholar would take strong issue with. Here's a verdict on each key point:

  1.  **"In the Nyāya school, knowledge comes from four sources (pramāṇas): perception, inference, comparison, and testimony."**
      *   **Verdict: Largely Accurate.**
      *   **Reason:** This is the standard enumeration for the classical Nyāya school (especially post-Gautama's *Nyāya Sūtra*): *pratyakṣa* (perception), *anumāna* (inference), *upamāna* (comparison/analogy), and *śabda* (testimony/verbal testimony). It's the core Nyāya position.

  2.  **"Inference basically means induction -- you observe a bunch of cases where smoke goes with fire, generalise, and then you can infer fire from smoke the next time."**
      *   **Verdict: Oversimplified and Partially Misleading.**
      *   **Reason:** While *induction* plays a crucial *role* in establishing the universal premise (*vyāpti* - the invariable concomitance, like "Wherever there is smoke, there is fire"), Nyāyan inference (*anumāna*) itself is fundamentally presented as a *deductive* syllogism. The classic Nyāya inference has **five steps**:
          1.  **Pratijñā (Thesis):** There is fire on the hill.
          2.  **Hetu (Reason):** Because there is smoke.
          3.  **Udāharaṇa (Example):** Wherever there is smoke, there is fire, as in the kitchen.
          4.  **Upanaya (Application):** This hill has smoke (which is invariably associated with fire).
          5.  **Nigamana (Conclusion):** Therefore, there is fire on the hill.
      *   **Nyāya Pushback:** A Nyāya scholar would argue vehemently that reducing inference to mere induction misses the point. The *core* of inference is the logical *application* of the established universal relation (*vyāpti*) to a new case via a formally structured argument. Induction (*sāmānyalakṣaṇa pratyakṣa* or *tarka* play roles) is needed to establish *vyāpti*, but *anumāna* proper is the deductive inference *using* that *vyāpti*. They'd also emphasise the rigorous conditions required for valid *vyāpti* (constant conjunction, absence of counter-examples) and the logical structure itself.

  3.  **"Comparison is reasoning by analogy, like arguing that because two things are similar in some respects they'll be similar in others."**
      *   **Verdict: Plausible-sounding but Oversimplified and Slightly Off-Focus.**
      *   **Reason:** *Upamāna* is indeed often translated as comparison or analogy, but its classical Nyāya application is quite specific. It primarily concerns **learning the meaning of a word** through similarity. For example: You don't know what a *gavaya* (wild cow) is. Someone tells you, "A gavaya is like a cow." Later, seeing an animal similar to a cow in the forest, you recognise it as a *gavaya*. The knowledge source here is the *similarity-based identification* facilitated by the verbal description. While it involves analogy, it's not primarily about *predicting* unknown properties (though that might be a consequence), but about *identifying* an object based on its similarity to a known object, as mediated by testimony.
      *   **Nyāya Pushback:** They'd argue this is a distinct source of knowledge irreducible to perception, inference, or testimony alone. You perceive the cow, you're told the similarity, you perceive the similar animal – the *knowledge* that *this* is the thing called *gavaya* arises specifically from the operation of similarity/comparison (*upamāna*).

  4.  **"Testimony is just trusting what reliable people or scriptures tell you..."**
      *   **Verdict: Crude Oversimplification.**
      *   **Reason:** While trust in a reliable speaker (*āpta*) is central, Nyāya provides a sophisticated *epistemological justification* for testimony (*śabda*) as a valid *pramāṇa*. It's not blind faith. The reliability (*āptatva*) of the speaker is crucial and is defined by them possessing direct knowledge (*sākṣātkāritva*) of the subject and being truthful (*abhiprāya*) in their intention to communicate it accurately. The knowledge arises from understanding the *meaning* of reliable words/sentences.
      *   **Nyāya Pushback:** This is where the summary is most egregious to a Nyāyika. They would **push back hardest on this point**. They would argue that *śabda* is a *genuine and irreducible source of knowledge* under specific, justifiable conditions. They would point out that vast amounts of our knowledge (historical, geographical, scientific from textbooks, personal facts from friends) comes via testimony. Nyāya epistemology provides criteria for *evaluating* the reliability of testimony, making it a subject for epistemological analysis, not just blind acceptance. Dismissing it as "not real epistemology" reflects a parochial Western view that arbitrarily privileges individualistic sources like perception and reason, ignoring the social and linguistic nature of much human knowledge acquisition. Nyāya sees the critique as fundamentally misunderstanding their sophisticated account.

  5.  **"...which shows the school wasn't really doing epistemology in the Western sense, since it builds authority in from the start."**
      *   **Verdict: Misleading and Philosophically Loaded Verdict.**
      *   **Reason:** Including testimony absolutely makes Nyāya epistemology *different* from many (though not all) strands of post-Cartesian Western epistemology, which often emphasise individual justification and are suspicious of authority. However, it doesn't mean they weren't doing "real epistemology." They were rigorously analysing the sources and validity conditions of knowledge (*pramā*), *including* the knowledge we gain from others. Modern Western epistemology increasingly recognises testimony as a legitimate area of study (e.g., work by Coady, Lackey, Fricker). Nyāya was simply ahead of the curve in systematically incorporating it. Building in *reliability conditions* for authority is *precisely* what makes it epistemology, not blind fideism.
      *   **Nyāya Pushback:** They would robustly reject the implication that their inclusion of testimony invalidates their work as epistemology. They would argue their analysis of testimony's validity conditions *is* epistemology. They might counter that Western epistemology's historical neglect of testimony is a flaw, not a strength, reflecting an unrealistic individualism.

  6.  **"All the classical Indian schools accepted these four sources, they just disagreed about how to rank them."**
      *   **Verdict: Factually Incorrect.**
      *   **Reason:** This is a significant error. The number and nature of *pramāṇas* was a major point of contention *between* the schools:
          *   **Cārvāka/Lokāyata:** Accepted only *perception* (*pratyakṣa*). Rejected inference, comparison, and testimony as invalid or unreliable.
          *   **Buddhism (Dignāga/Dharmakīrti):** Generally accepted only *two* pramāṇas – perception (*pratyakṣa*) and inference (*anumāna*). They subsumed comparison and testimony under inference.
          *   **Sāṃkhya:** Accepted three: Perception, Inference, and Testimony (*śabda* - specifically Vedic testimony).
          *   **Mīmāṃsā (Pūrva):** Initially emphasised testimony (Veda), but developed sophisticated theories. Kumārila Bhaṭṭa accepted six: Perception, Inference, Comparison, Testimony, Postulation (*arthāpatti*), and Non-perception (*anupalabdhi*). Prabhākara accepted five, rejecting non-perception.
          *   **Vedānta (Advaita):** Followed Mīmāṃsā closely, generally accepting six. Ramanuja also accepted testimony as paramount.
          *   **Nyāya:** The four listed.
      *   **Nyāya Pushback:** While Nyāya vigorously defended its *own* list of four as necessary and sufficient, they were acutely aware they were arguing *against* other schools who accepted fewer or more. Disagreements about ranking *within* a school's accepted list existed (e.g., Mīmāṃsā ranking Vedic testimony highest), but the fundamental debate was over *which sources even count* as valid *pramāṇas*.

  **In Summary:**

  *   **Accurate:** The core list of four *pramāṇas* for Nyāya.
  *   **Oversimplified/Misleading:** The descriptions of Inference (neglects the deductive syllogism) and Comparison (over-generalises its primary application).
  *   **Crude Oversimplification:** The description of Testimony as "just trusting".
  *   **Philosophically Loaded & Problematic:** The verdict that including testimony means it's "not real epistemology". This is the point a Nyāya scholar would find most objectionable and ignorant.
  *   **Factually Incorrect:** The claim that all schools accepted the same four pramāṇas.

  Your niggles were spot on. The testimony point is particularly poorly characterised, and the universality of the four sources is demonstrably false. While your friend captured the basic Nyāya list, the explanations lack nuance and contain significant errors in interpretation and fact. Nyāya epistemology is a sophisticated system offering detailed analyses of each *pramāṇa*, including robust defences of testimony and inference that go far beyond simple induction or blind faith.
