  - Settled: The Ellsberg paradox demonstrates a robust violation of subjective expected utility. Ambiguity aversion is a well-documented phenomenon in experiments.
  - Contested: Whether ambiguity aversion is rational. Some (like Ellsberg) argue it is reasonable, while others (Savage's followers) argue that it violates rational axioms. Also, the normative status of ambiguity aversion is debated.

  Summary of Seminar Flow:

  1. Introduction: Risk vs. Ambiguity (10 min)
  2. Triage Scenario Setup (15 min)
  3. Preference Reversal with Adjusted Bets (15 min)
  4. Formal Diagnosis: Inconsistency with SEU (20 min)
  5. Normative Discussion (10 min)
