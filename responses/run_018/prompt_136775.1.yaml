          (a) Those who choose the established vaccine because of the known risks (even though the point estimate is lower) are exhibiting ambiguity aversion and understand the structural uncertainty of the new vaccine (model-uncertainty: the mutation might make the efficacy drop in the future).
          (b) Those who choose the new vaccine because of the higher point estimate might be ignoring the ambiguity or might be ambiguity-seeking (but unlikely) or might believe that the data is sufficient to remove ambiguity.
