  We are designing a 90-minute seminar for master's students in philosophy with basic probability knowledge but no formal decision theory. The goal is to teach the risk/ambiguity distinction via the Ellsberg paradox in a healthcare triage scenario. We avoid the urn example initially to focus on structural ambiguity.

  Key Idea to Establish First:
  Before introducing the choice scenario, students must have a clear understanding of "risk" (known probabilities) versus "ambiguity" (unknown probabilities due to structural uncertainty). We must emphasize that ambiguity is not just a gap in personal knowledge but a feature of the situation where the underlying model is uncertain.

  Why avoid the urn example initially?
  The urn example (with known vs. unknown composition) can lead students to think of ambiguity as merely a hidden parameter (i.e., if we knew the true composition, we'd have risk). We want to avoid this because our triage example is meant to illustrate structural ambiguity: even with full data about the novel treatment, the long-run stability of its success rate might be unknown (due to unobserved failure modes, changing conditions, etc.). We can mention the urn example later, but first we build the concept with the healthcare scenario.

  Structure of the Healthcare Scenario:
  We have two treatment protocols for a condition:

  1. Established Protocol (EP): 
     - Long history of use, extensive data on success and failure.
     - Success rate is known to be 60% (point estimate), but we also have a well-documented distribution: e.g., in 1000 trials, success rates in different subgroups/hospitals/seasons ranged from 55% to 65%. 
     - The variability is well understood and modeled (risk).

  2. Novel Protocol (NP):
     - Has been tested in a few small trials (say 100 patients total) and showed a 60% success rate in those trials.
     - However, the long-run behavior is unknown: we don't know if the success rate is stable across different populations, settings, or over time. There might be unknown failure modes that haven't been observed yet (e.g., adverse events in certain subgroups not tested). 
     - The ambiguity is structural: even if we have a point estimate, we lack a reliable model of the underlying process.

  Important Features of the Scenario:
  - Both protocols have the same point estimate (60% success) to isolate the effect of ambiguity.
  - The established protocol has a known distribution (risk) while the novel protocol has uncertainty about the distribution itself (ambiguity).
  - The scenario must lack any suggestion that more data on the novel protocol (in the form of more trials) would immediately resolve the ambiguity. We must emphasize that the ambiguity arises from the novelty: the treatment might interact with factors not yet observed, so even with more data (if not comprehensive) the uncertainty about the model remains.

  Sequence of the Seminar (90 minutes):

  1. Introduction (10 minutes):
     - Recap of basic probability (subjective and objective probabilities, expectation).
     - Define "risk": known probabilities (objective or well-calibrated subjective) for all outcomes.
     - Define "ambiguity": uncertainty where the probabilities themselves are not known because the underlying model is not well understood. Emphasize that it's not about the amount of data but about the structure of uncertainty.

  2. Setting up the Triage Scenario (15 minutes):
     - Present the two protocols (EP and NP) with the same point estimate (60%) but different levels of uncertainty.
     - Explain the known distribution of EP (risk) and the lack of a reliable model for NP (ambiguity). Stress that for NP, we don't know the range of possible success rates or the factors that might affect it.
     - Ask students: "Which protocol would you choose for a patient?" (Poll or quick show of hands). Expect a split but note that many might prefer EP.

  3. Introducing the Preference Reversal (Ellsberg-style) (15 minutes):
     - Now, introduce a variation: suppose the hospital committee is considering a patient for whom failure of the treatment is catastrophic. They are now choosing between:
          Option A (EP): 40% chance of failure (well-understood variability).
          Option B (NP): 40% chance of failure (but with ambiguity about the true failure rate and its distribution).
     - Then, present a second choice: the same committee is considering a patient for whom success is critical. Now they choose between:
          Option C (EP): 60% chance of success (well-understood).
          Option D (NP): 60% chance of success (ambiguous).
     - Reveal that many people (and experimental subjects) prefer EP in both cases (A over B, and C over D). This is a preference reversal relative to expected utility: if they assign a subjective probability to NP, it must be the same in both choices (so if they prefer EP in the first, they should prefer NP in the second, or vice versa). But they don't.

