     How to map to triage:

     We have two protocols: EP (known) and NP (ambiguous). We consider two outcomes: failure and success. But note that success and failure are complementary.

     So we can do:

     Bet 1: You win $100 if the treatment fails.
        Option A: Use EP -> win $100 with probability 0.4.
        Option B: Use NP -> win $100 with ambiguous probability (but we have a point estimate of 0.4?).

