  5. Addressing Misconceptions (throughout and at specific points):

     a) Reducing ambiguity to risk with an unknown prior (i.e., treating it as a hidden parameter):
          - When setting up the novel protocol, emphasize that even if we had more data, the structural uncertainty might remain (e.g., because the treatment is new and we don't know how it will perform under different conditions that haven't been tested). We can't assign a prior because we don't have a well-defined set of possibilities (the failure modes are unknown). Head this off when describing the NP.

     b) Treating aversion as irrationality:
          - After presenting the preference reversal, note that this behavior violates the axioms of subjective expected utility (specifically, the Sure-Thing Principle or the idea that beliefs are additive). But we should not conclude it is irrational. Instead, we can discuss that in situations of ambiguity, it might be reasonable to be cautious (e.g., in healthcare, adopting a novel treatment with unknown risks might be avoided even if the point estimate is good). We can mention that this is a point of debate.

     c) Assuming more data dissolves the problem:
          - When introducing the NP, explicitly state that even if we had a larger trial (say 1000 patients) that still showed 60% success, we might not know if the success rate is stable across different populations (e.g., ethnic groups, seasons, co-morbidities) and that the novel treatment might have rare side effects that only appear in the long term. So the ambiguity is structural and not resolved by a larger sample of the same kind. This should be emphasized during the setup of the NP and reinforced when discussing the normative part.

  6. Normative Interpretation (10 minutes):
     - Explain that the Ellsberg paradox challenges the idea that all uncertainty can be reduced to risk (known probabilities). 
     - Ambiguity aversion might reflect a preference for knowing the odds (even if they are bad) over not knowing the range of possibilities.
     - Note that there is no consensus on whether ambiguity aversion is rational. Some argue it is a heuristic for situations of deep uncertainty (especially in high-stakes domains like healthcare), while others see it as a cognitive bias. We present both views without taking a stand.

  7. Check for Understanding (10 minutes):
     - Present a new scenario: 
          "A vaccine has been developed for a new virus. It was tested in two phases: Phase I (100 healthy volunteers) showed 95% efficacy. Phase II (500 volunteers, including some with underlying conditions) also showed 95% efficacy. However, the virus is known to mutate rapidly. The established vaccine for a similar virus (which does not mutate as fast) has a well-documented efficacy of 90% with a known distribution. Which vaccine would you recommend for a nationwide campaign and why?"

     - Ask students to write a short paragraph explaining their choice. Then, have a few share.
