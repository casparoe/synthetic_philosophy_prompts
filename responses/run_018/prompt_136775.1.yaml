     Bet 1: A (0.4) vs B (q). If they prefer A, then 0.4 > q? (if they want to maximize the chance of winning, they prefer the higher probability). But then in Bet 2: C (0.6) vs D (1-q). If they prefer C, then 0.6 > 1-q => q>0.4.

