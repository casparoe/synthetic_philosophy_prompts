answer: |-
  Here is a structured 90-minute seminar plan focusing on the risk/ambiguity distinction via a healthcare scenario, designed to prevent common misconceptions while respecting contested interpretations. The arc prioritizes conceptual clarity over formalism.

  ---

  ### **Explanatory Arc & Timing**

  #### **1. Foundational Setup: Risk vs. Ambiguity (20 min)**  
  **Goal:** Establish that ambiguity is *structural model uncertainty*, not incomplete data.  
  **Concrete Analogy:**  
  > *"Choosing between two bridges:  
  > - **Bridge A:** 1,000 crossings logged; 10% collapse rate (known variance due to weather).  
  > - **Bridge B:** 10 crossings logged; 10% collapse rate (but built with untested materials).  
  > Both have 10% point estimates, but Bridge B’s *causal structure* is unknown—e.g., could it corrode unexpectedly?"*  

  **Key Distinctions:**  
  - **Risk:** Known probability distribution (e.g., Bridge A’s historical data defines a stable model).  
  - **Ambiguity:** No known data-generating model (e.g., Bridge B’s novelty hides *how* failures might cluster).  
  **Why Avoid Urns Initially:** Urns imply hidden-but-fixed probabilities. This scenario emphasizes *emergent, unmodeled uncertainty* (e.g., novel materials may fail catastrophically under unobserved conditions).  

  **Preempting Misconceptions:**  
  - **Head off "hidden probabilities":** Stress that ambiguity ≠ not knowing *which* risk applies, but not knowing *what risks exist*. Use phrases like "no stable process model" or "uncertainty about uncertainty."  
  - **Check:** Ask students, *"If we tested Bridge B 1,000 more times, could we still be blindsided? Why?"* Target: Recognition that new failure modes (e.g., material fatigue) might emerge outside the data.

  ---

  #### **2. Hospital Triage Scenario (25 min)**  
  **Protocol Setup:**  
  > *"Triage committee must allocate ventilators during a pandemic:  
  > - **Protocol A (Established):** 60% survival rate. Data from 50 hospitals show 55–65% variance (due to age, comorbidities).  
  > - **Protocol B (Novel):** 60% survival in 5 trial hospitals. No long-term data; unknown if efficacy depends on unstudied factors (e.g., viral strains, drug interactions)."*  

  **Crucial Features:**  
  - Both share identical point estimates (60%).  
  - Protocol A’s variance is *explained* (risk), Protocol B’s is *unexplained* (ambiguity).  
  - **Explicitly Exclude:** Any suggestion that "more data" fixes Protocol B (e.g., note: *"Even with more trials, we lack data on rare mutations or long-term effects"*).  

  **Choice Elicitation:**  
  - Poll students: *"Which protocol for Patient X (severe comorbidities)?"*  
  - **Expected Pattern:** >80% prefer Protocol A. Highlight emotional language ("I trust the data," "too many unknowns").  

  **Preempting Misconceptions:**  
  - **Head off "information gap" framing:** Contrast Protocol B’s ambiguity with Protocol A’s *explained* variability: *"For Protocol A, we know *why* rates vary; for B, we don’t even know *what we don’t know*."*  
  - **Head off "irrationality" claims:** Normalize aversion: *"In medicine, caution toward novelty isn’t ignorance—it’s hedging against unquantifiable harms."*

  ---

  #### **3. Preference Reversal & SEU Conflict (20 min)**  
  **Contradictory Choices:**  
  > *"Same committee, two scenarios:  
  > 1. **Avoiding failure:** Choose between:  
  >    - Protocol A: 40% known mortality.  
  >    - Protocol B: 40% ambiguous mortality (no failure-mode data).  
  >    *Result: Strong preference for A.*  
  > 2. **Ensuring success:** Choose between:  
  >    - Protocol A: 60% known survival.  
  >    - Protocol B: 60% ambiguous survival.  
  >    *Result: Still prefer A!"*  

  **Diagnosis:**  
  - Subjective Expected Utility (SEU) requires assigning fixed probabilities.  
  - If SEU holds, preferring A in **both** choices implies:  
    - Choice 1: Subjective mortality for B > 40% (else B would be preferred).  
    - Choice 2: Subjective survival for B < 60% (else B would be preferred).  
  - **Contradiction:** Survival = 1 – mortality, so beliefs are inconsistent!  

  **Preempting Misconceptions:**  
  - **Head off "unknown prior" reductionism:** *"This isn’t about guessing the ‘true’ probability—it’s about rejecting any single probability model for Protocol B."*  
  - **Head off "more data dissolves ambiguity":** *"Even if we knew B’s *average* survival, would we know if it fails catastrophically in winters? Ambiguity persists."*

  ---

  #### **4. Normative Interpretation (15 min)**  
  **Core Insight:** Ambiguity aversion reveals *model uncertainty*—distrust of any single probability distribution.  
  **Settled vs. Contested:**  
  - **Settled:** Ellsberg-style behavior violates SEU; ambiguity aversion is empirically robust.  
  - **Contested:** Whether aversion is rational. *Present both:*  
    - **Pro-aversion:** "Avoiding structural uncertainty is prudent (e.g., in triage)."  
    - **Anti-aversion:** "SEU violations imply incoherence (updating inconsistently)."  
  **Do not assert consensus.**  

  **Preempting Misconceptions:**  
  - **Head off "bias" overgeneralization:** *"Aversion isn’t ‘irrational fear’—it may be ecologically adaptive when models are untested."*

  ---

  #### **5. Check for Understanding (10 min)**  
  **Scenario:**  
  > *"A new surgery has 70% success in 100 trials. An established one has 60% success with well-understood complications. For a high-risk patient, you:  
  > A) Prefer the new surgery (higher point estimate).  
  > B) Prefer the established surgery (known risks).  
  > C) Demand more new-surgery data first."*  

  **Diagnostic Question:**  
  *"Explain your choice in 2 sentences, focusing on uncertainty type."*  
  - **Target Understanding (B):** "Established surgery’s risks are modeled; new one’s point estimate hides unstudied complications."  
  - **Misconception (A/C):** Reduces ambiguity to risk ("70% is better") or information gaps ("data solves everything").  

  ---

  ### **What to Omit**  
  - **Formal axiomatization** (e.g., Gilboa-Schmeidler axioms).  
  - **Smooth ambiguity models** (Klibanoff et al.).  
  - **Experimental variations** (beyond Ellsberg’s core paradox).  
  - **Neuroeconomics/behavioral results** (distracts from conceptual focus).  

  **Rationale:** At this level, formalism detracts from the epistemic distinction. Focus on *why* ambiguity challenges SEU’s ontology of uncertainty.

  ---

  ### **Why This Sequence Works**  
  1. **Scenario-first** makes ambiguity visceral, not abstract.  
  2. **Preference reversal** reveals the paradox *experientially* before formal diagnosis.  
  3. **Contested interpretations** are flagged but not resolved, inviting critical engagement.  
  4. **Checks** target persistent misconceptions at each stage.  

  **Final Note:** Emphasize that ambiguity is a *deep uncertainty* about the world’s structure—not a deficiency of the decision-maker. This primes advanced topics (e.g., robustness, precautionary principles) without overloading beginners.
