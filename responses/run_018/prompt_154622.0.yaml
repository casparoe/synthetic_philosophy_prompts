answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  
  **Prompt:** A climate-science consortium issues a public assertion: "Ice-albedo feedback loops will accelerate Arctic warming by 40% this decade." No single scientist in the consortium grasps every sub-model (e.g., ocean chemistry, atmospheric physics, glacial dynamics), but each member endorses the collective conclusion based on rigorous peer-validation of their colleagues' sub-expertise. Epistemic authority is thus *distributed* across the group.  

  Critically evaluate whether this assertion satisfies the **knowledge norm of assertion** (assert only what you know). If it does not, assess whether the **belief norm** (assert only what you believe) avoids collapsing into incoherence *only* by permitting scientists to hold *partial credence* in the claim. Finally, argue whether a **modified truth norm** (e.g., "assert only what the group justifiably takes to be true") provides a superior normative account of such distributed assertions. Support your reasoning with conceptual analysis of epistemic responsibility, justification, and group agency.  

  ---

  ### Model Answer (550 words)  

  The consortium’s assertion violates the standard **knowledge norm** ("assert *p* only if you know *p*"). Knowledge requires individual grasp of justification, but here no member possesses justification for the *entire* claim. Scientist A may verify ocean models but lacks expertise to assess atmospheric sub-models relied upon by Scientist B. Thus, while the *group* might collectively possess justification, knowledge cannot be distributed like a puzzle where no individual sees the complete picture. The norm demands *personal* cognitive access to grounds for *p*, which is absent.  

  The **belief norm** ("assert *p* only if you believe *p*") initially seems more accommodating. Members can assert the conclusion based on trust in their peers’ sub-expertise. However, this risks collapse: if "belief" requires full subjective certainty, scientists cannot rationally believe a claim whose evidential bases they cannot personally evaluate. The norm only avoids incoherence by interpreting "belief" as *partial credence* (e.g., "I believe *p* to degree 0.95 based on institutional reliability"). This preserves individual rationality but dilutes "belief" into graded confidence, weakening the norm’s role in guaranteeing assertoric commitment. Crucially, it sidesteps *why* such credence is warranted—masking the distributed justificatory structure.  

  A **modified truth norm** ("assert *p* only if the group justifiably takes *p* to be true") better captures the consortium’s epistemic practice. It shifts focus from individual cognition to collective warrant. The group "justifiably takes *p* to be true" if:  
  (a) Sub-models are validated by domain specialists within the group,  
  (b) Integration methods are robust (e.g., peer review of cross-model interfaces),  
  (c) Defeaters are systematically addressed (e.g., error-correction protocols).  
  This norm acknowledges distributed justification while demanding *shared* responsibility for *p*’s truth. Unlike the belief norm, it explicitly requires *structural* justification beyond aggregate credence.  

  However, this modification faces a "gappy justification" objection: if no individual comprehends all sub-models, the group’s "taking *p* to be true" relies on opaque links between justified sub-components. Justification gaps may emerge where sub-models interact (e.g., does atmospheric data *fully* resolve uncertainty in glacial melting projections?). The norm must therefore stipulate that "justifiably takes" requires *seamless integration* of sub-justifications via institutional safeguards.  

  Ultimately, the modified truth norm is superior for distributed assertions. It upholds truth as the core standard while adapting justification to collective agency—unlike the unyielding knowledge norm. It also surpasses the belief norm by demanding *publicly verifiable warrant* rather than privatized credence. For complex science, epistemic responsibility resides in the group’s ability to audit its composite justification, not in any single mind’s certainty.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  1.  **Diagnosis of Knowledge Norm Failure** (4 marks)  
      *   *Required:* Clear explanation that individual lack of access to *full* justification violates the knowledge norm’s requirement for personal, integrated warrant.  
      *   *Common miss:* Merely stating "no one knows the whole claim" without explaining *why* distributed justification ≠ individual knowledge.  

  2.  **Analysis of Belief Norm & Partial Credence** (5 marks)  
      *   *Required:* Demonstration that strict belief leads to incoherence, and that only partial credence (with justification via institutional trust) rescues the norm. Critique of this dilution.  
      *   *Common miss:* Asserting that "trust = belief" without addressing how partial credence alters the norm’s function or masking of justification.  

  3.  **Evaluation of Modified Truth Norm** (5 marks)  
      *   *Required:* Articulation of how the norm incorporates collective warrant (e.g., validation protocols, integration standards) and addresses truth directly. Assessment of its advantages over other norms.  
      *   *Common miss:* Proposing modification without specifying criteria for "justifiably takes to be true" or ignoring the "gappy justification" challenge.  

  4.  **Comparative Synthesis** (4 marks)  
      *   *Required:* Coherent argument for why one norm is superior/inferior *relative to the others* in this scenario, weighing responsibility, justification, and group agency.  
      *   *Common miss:* Treating norms in isolation without contrasting strengths/weaknesses for distributed assertion.  

  5.  **Original Insight** (2 marks)  
      *   *Required:* Novel observation (e.g., "gappy justification," institutional warrant vs. personal certainty, credence masking structural justification).  
      *   *Common miss:* Restating prompt parameters or textbook definitions without added conceptual depth.  

  ---
  **Rationale:** This prompt forces engagement with *collective epistemology* while testing core norms. The model answer demonstrates conceptual precision, avoids textual reliance, and balances critique with constructive alternatives. The marking scheme prioritizes argumentative rigor over coverage, rewarding students who dissect the interplay of norms in novel contexts.
