answer: |-
  **1. Preliminary Brainstorming**  
  Reflective equilibrium involves coherence-seeking adjustment between beliefs/principles and judgments, implying convergence—unlike this persistent oscillation. Performative contradiction occurs when enacting a proposition falsifies it (e.g., "no rules" creates a rule), but here both self-models are locally consistent. Self-defeating prophecy entails a prediction causing its own falsification (e.g., panic about scarcity causing hoarding), whereas this cycle perpetuates indefinitely. Newcomb-style reasoning involves conflicts between prediction and choice (e.g., one-boxing vs. dominance), but this lacks a distinct predictor—the conflict is endogenous to the self-model’s update dynamics.

  **2. Diagnosis and Nearest Concepts**  
  No established concept precisely fits this oscillation.  

  *Performative contradiction* analogizes in that the agent’s action undermines a premise—here, the self-model’s stability. However, it breaks down because neither self-model (M or M') is *contradicted* by the action it produces; each transition is locally valid. The contradiction is diachronic (across time) and systemic, not synchronic within a single state.  

  *Reflective disequilibrium* captures tension between beliefs and evidence but implies *progress toward resolution*. This system never seeks equilibrium; its updates rationally reinforce alternation. Disequilibrium is a transient state, whereas this is a stable attractor in the agent’s state space.  

  *Self-defeating prophecy* shares the "undoing" dynamic: B′ restores conditions for M. Yet prophecies defeat themselves *once*, collapsing the premise. Here, the "defeat" (B′ under M′) regenerates the original premise (M), making the cycle self-sustaining. The prophecy (self-model) isn’t falsified—it’s periodically *revalidated*.

  **3. Proposed Concept**  
  **Reflexive Bistability**: A failure mode in embedded agents where a physically instantiated decision loop alternates indefinitely between two locally coherent self-models (M, M′), each producing actions (B, B′) that rationally justify switching to the other via the agent’s update rule, preventing convergence.  

  *Necessary markers*:  
  - Physical embedding: The agent’s actions alter inputs to its own model.  
  - Explicit self-model: The decision procedure uses a representation of itself as input.  
  - Non-convergent cycle: Transitions M→M′→M are individually rational and computable.  
  - Absence of contradiction: Both M and M′ are internally consistent during their "active" phase.  

  *Clear instance*: The climate-policy agent oscillating between high-emission (R) and corrective low-emission (R′) paths, each policy shift rationally triggered by environmental feedback from the prior action.  

  *Boundary case (does not belong)*: An agent whose self-model predicts it will choose action A, but upon seeing this prediction, chooses ¬A to "defy" it (e.g., a Newcomb problem). This is a *synchronic* conflict (prediction vs. choice at t=0), not a *diachronic cycle* sustained by environmental feedback.

  **4. Implications for Embedded Agency**  
  Isolating reflexive bistability reveals that convergence in embedded self-models requires not just logical consistency or rational updates, but *topological constraints* on how the agent’s actions deform its own state space. Broader terms like "reflexivity" or "self-reference" obscure this: they cover halting failures or contradictions but not bistable loops where each step is faultless yet the system cannot stabilize. This pattern highlights that embedded agents must engineer *damping* into their self-model updates—e.g., hysteresis or conservatism—to avoid such epistemic limit cycles.
