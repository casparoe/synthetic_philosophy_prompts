  - Principle B (Capability Threshold) focuses on rational behavior but struggles with newborns (v). It would accept the AI's philosophical arguments as evidence of understanding.

  The newborn case is the crux: Principle A explains it through innate potential in human substance, while Principle B must awkwardly claim newborns lack understanding despite later developing it. This makes A the better reconstruction of Descartes' actual view.

