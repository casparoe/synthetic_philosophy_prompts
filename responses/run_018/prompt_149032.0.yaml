          - Distortion: In Dennett, the Gregorian mind is about the cultural evolution of tools that then shape the mind. In RL, we typically hard-code the tools or the access to them (like giving the agent an API to a calculator). The cultural transmission aspect (learning from others) is captured by multi-agent RL with imitation learning or communication, but it's not as rich as human culture.
