answer: |-
  Here's a breakdown of the desiderata for a situationist-sensitive virtue ethics, structured as requested:

  ### Core Non-Negotiables (Must-Haves for Adequacy)

  1.  **Empirical Adequacy:** *Requires* the theory to explicitly acknowledge and integrate the core empirical findings of situationism: that seemingly minor situational factors significantly influence behavior, and broad cross-situational consistency in behavior (as traditionally conceived for "global" traits) is weak.
      *   *Reasoning:* Ignoring robust psychological evidence renders the theory descriptively inaccurate and practically useless. It must engage with reality as observed.
  2.  **Reconciled Cross-Situational Consistency:** *Requires* an explanation for *why* behavioral consistency *across diverse situations* is often low, while potentially allowing for consistency *within specific domains* or contexts.
      *   *Reasoning:* Situationism directly challenges the predictive power of global character traits. The theory must explain this lack of predictive power without abandoning the concept of character entirely. It must redefine what "consistency" means for virtue.
  3.  **Local Trait Activation:** *Requires* that virtues be conceptualized primarily as **local traits** (e.g., "honest-in-business-dealings," "courageous-when-physically-threatened," "compassionate-towards-friends-in-distress") rather than necessarily global traits (e.g., "honest," "courageous," "compassionate" *simpliciter*).
      *   *Reasoning:* The empirical data shows behavioral patterns are often context-specific. Defining virtues at a finer-grained, contextually embedded level aligns better with observed reality and explains the "inconsistency" found by situationists (it's not inconsistency, but different traits activating in different contexts).
  4.  **Explicit Situation-Sensitivity:** *Requires* the theory to incorporate the *sensitivity of virtuous response to specific situational features* as a core component of virtue itself. Virtue isn't just internal; it's a capacity for *contextually appropriate* perception, judgment, and action.
      *   *Reasoning:* Situationism demonstrates that behavior is profoundly shaped by context. A virtue theory must make sensitivity to relevant situational cues (and resistance to irrelevant or distorting ones) central to its definition of what it *means* to be virtuous in a given domain.

  ### Camp Preferences / Debated Requirements (Theories Can Differ Here)

  5.  **Moral Fragmentation vs. Integration:**
      *   *Requirement:* The theory must take a stance on whether "moral fragmentation" (the existence of multiple, potentially conflicting local virtues without a strong unifying core) is an acceptable state, a problem to be overcome, or an illusion.
      *   *Reasoning:* Local traits imply the possibility of fragmentation (e.g., fiercely loyal to family but ruthless in business). Some camps see this as a realistic constraint to manage; others see it as a deficiency requiring integration into a more coherent character via higher-order capacities (see #8).
      *   *Status:* **Camp Preference.** Some theories might embrace fragmentation as realistic ("modular virtue"), others might strive for coherence ("integrated localism"), still others might see it as a developmental stage.
  6.  **Scope of "Local" Traits:**
      *   *Requirement:* How narrowly or broadly are "local" traits defined? (e.g., "honest-with-authority-figures" vs. "honest-in-all-professional-contexts").
      *   *Reasoning:* This impacts psychological plausibility and the potential for transfer/generalization. Overly narrow traits risk being trivial; overly broad traits risk falling back into situationism's critique.
      *   *Status:* **Camp Preference.** Different theories can draw these boundaries differently based on other commitments.
  7.  **Role of Reasoning & Deliberation:**
      *   *Requirement:* The theory must define the role of conscious reasoning, rules, and deliberation versus automatic, habituated responses within virtue.
      *   *Reasoning:* Situationism highlights automaticity and situational triggers. A viable theory needs to explain how reasoning interacts with/guides/shapes these automatic responses in the virtuous agent.
      *   *Status:* **Camp Preference.** Emphasis can range from "virtue as skilled automaticity" to "virtue as context-sensitive practical wisdom guiding habits."
  8.  **Moral Education & Development:**
      *   *Requirement:* The theory must provide a plausible account of how virtues (as local traits/situation-sensitive capacities) are acquired, trained, and potentially generalized/integrated.
      *   *Reasoning:* Education is central to virtue ethics. Situationism complicates this by showing the power of situations over abstract dispositions. Education must focus on context-specific habituation, situational awareness, and managing triggers.
      *   *Status:* **Camp Preference (in details).** *How* education achieves this (e.g., focus on specific scenarios vs. fostering meta-cognitive skills) is debated, but *that* it must address situationism is non-negotiable (#1).

  ### Conflict Analysis & Aristotelian Impact

  *   **Can Global Traits & Full Situation-Sensitivity Coexist?** **No, not in the classical "global trait" sense.** Situationism fatally undermines the idea of robust, highly predictive *global* character traits that manifest consistently across widely varying situations. A situationist-sensitive theory **must abandon strong globalism**. However, it *can* retain:
      *   **Local Traits:** Stable dispositions within specific, defined contexts.
      *   **Meta-Traits/Higher-Order Capacities:** Dispositions like "sensitivity to morally relevant features," "skill at practical reasoning in context," or "commitment to moral improvement" that operate across domains and help manage/guide local traits. *This is the potential compromise.*
  *   **Moral Fragmentation: Constraint or Jargon?** **A Real Constraint.** If virtues are fundamentally local and context-bound, fragmentation is a natural consequence. It's not *just* jargon; it describes the potential psychological reality. The key debate is whether this is an acceptable endpoint (constraint) or something virtue ethics should aim to minimize/integrate (challenge).
  *   **Biggest Damage to Classical Aristotelianism:** The requirement for **Local Trait Activation (#3)** does the most damage. Aristotle's picture relies heavily on robust, unified, *global* character traits (hexeis) – the courageous person *is* courageous across relevant domains. Situationism shows this global consistency is empirically rare. Abandoning the core structure of virtues as global dispositions forces the most radical revision of the classical picture. **Empirical Adequacy (#1)** is the driver, but **Local Trait Activation (#3)** is the specific requirement that most directly dismantles the classical Aristotelian foundation.

  ### Summary of Desiderata

  Any adequate situationist-sensitive virtue theory **must** (Non-Negotiables):
  1.  **Be empirically grounded** in situationist findings.
  2.  **Explain weak cross-situational consistency.**
  3.  **Define virtues as primarily local, context-bound traits.**
  4.  **Make situation-sensitivity central to virtue.**

  It **can differ** on (Camp Preferences):
  5.  How much **moral fragmentation** it accepts.
  6.  The precise **scope/definition of local traits.**
  7.  The **balance between automaticity and reasoning.**
  8.  The specific **methods of moral education** (though it must address #1-4).

  **Key Conflict:** Global traits (in the classical sense) and full situation-sensitivity are **jointly unsatisfiable**. Situationism forces the abandonment of robust globalism. The path forward lies in **local traits + meta-capacities**. The requirement for **Local Trait Activation (#3)** is the most devastating blow to Aristotle's original framework. **Moral Fragmentation** is a real potential consequence, not mere jargon.
