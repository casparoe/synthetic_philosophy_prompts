  ## MeritFlow™ FAQ: Optimizing Your Karma Footprint (Beta)

  **Q1: What *is* MeritFlow, exactly?**
  A1: MeritFlow is the world’s first Ethical Optimization Engine™! We leverage proprietary DharmaLogic™ algorithms to map your actions onto a dynamic network of sentient nodes (that's you, others, future beings, kinda). It calculates net karmic impact (NKI) in real-time using rigorous consequentialist math, maximizing merit generation & minimizing dukkha-debt across the dependent origination graph. Think karma-as-a-service, but scalable.

  **Q2: How does karma tracking work without a fixed "me"? Sounds messy.**
  A2: Exactly! Traditional "user account" models create ontological bloat. Our **anattā integration feature** bypasses this. Actions aren't *owned* by a static self-entity; they’re emergent phenomena tagged to causal clusters within the sentient network. Karma accretes *relationally* to action-patterns, not a soul-ID. Streamlined! No more "who gets the bad karma if *I* change my mind mid-action?" debates. The network absorbs the variance.

  **Q3: You talk about a "network of moral patients." How do you define its boundaries?**
  A3: Boundary definition is legacy thinking! Dependent Origination means *everything* influences *everything else* – it’s a non-finite, probabilistic graph. MeritFlow dynamically weights nodes based on proximity (temporal, causal, emotional valence), sentience-probability estimates, and potential for suffering/reduction. A mosquito near your arm has higher immediate weight than a theoretical alien civ 10 galaxies away... *probably*. Our algorithms continuously rebalance for optimal moral patient inclusion (patent pending).

  **Q4: Merit Transfer sounds awesome. Is it like crypto?**
  A4: More like ultra-fungible karmic offsets with instant settlement! Generated surplus merit? Our **Merit Exchange Protocol (MEP)** lets you frictionlessly transfer units to under-merited nodes (e.g., suffering beings, disaster zones, your past self's karmic debt pool). Conversely, facing a high-NKI negative action you *must* take? Purchase offsetting merit from high-generating users (subject to karma-liquidity checks, of course). Efficiency!

  **Q5: What happens during "Branching Events"? (e.g., my stream splits into two successors after a weird teleporter accident?)**
  A5: Branching is computationally exciting! DharmaLogic™ handles it two-fold:
  1.  **Rebirth Protocol:** Karmic imprints propagate probabilistically to *all* successor nodes, weighted by causal continuity and "mindstream affinity." Both successors inherit a portion of your pre-branch karma-debt *and* merit-potential.
  2.  **Expected Value Optimization (EVO):** The app calculates the *aggregate* future suffering/merit across *all* probable branches. Your optimal *pre-branch* action maximizes the summed NKIs of *all* potential future yous. Post-branch, each successor instance runs its own localized MeritFlow instance, inheriting the distributed karmic assets/liabilities. Seamless continuity!

  **Q6: What about edge cases? Like, generating merit *intending* to offset future harm I plan to do?**
  A6: Ah, the "Pre-Criminal Merit Laundering" scenario! Naive models fail here. MeritFlow’s **Intention-Action Holism Module** discounts merit generated with *explicit harmful downstream intent*. The negative-NKI weight of the *planned* harm retroactively diminishes the merit score of the offsetting action. Plus, our predictive algos flag anomalous "merit dumps" preceding high-harm events for Ethics Review (automated, mostly). System stays squeaky clean!

  **Q7: I feel overwhelmed by the infinite network. Does MeritFlow simplify choices?**
  A7: Absolutely! Stop grasping at the ungraspable! The **Karmic Dashboard** presents your top-priority action-optimizations (Buy Offset? Meditate now? Donate to *these* nodes?). We surface the 0.1% of the network where your marginal merit impact is highest, based on your current location, resources, and karmic velocity. Just follow the glowing arrow! Striving for perfect omniscience is inefficient. We optimize for *actionable* compassion.

  **Q8: Is Nirvana an achievable KPI within the app?**
  A8: Nirvana represents ultimate network optimization – zero karmic friction, perfect equilibrium. It’s the asymptotic goal! While full realization lies beyond current app functionality (v2.0 roadmap!), MeritFlow provides real-time NKI scores and "Dukkha Reduction Velocity" metrics. Maximize these, and you're definitively trending towards release-from-cyclic-reprocessing! Think of it as achieving negative karmic emissions. Keep grinding!
