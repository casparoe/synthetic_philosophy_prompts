  ## Six Words Chasing Clement's Ghost
  *(After Hofstadter's Labyrinth)*

  First draft, a hopeful, tentative **form**,
  I grasp the surface, seek the **sense**.
  Young cheeks once flushed, now pale with **loss**,
  The words, a distant, rippling **source**.
  My English strives to catch the **echo**
  Of tender jest, despite **constraint**.

  But metre binds, a cage of **constraint**,
  Demanding strict adherence to **form**.
  The literal fades; a faint **echo**
  Replaces clear, intended **sense**.
  I stray far from the vital **source**,
  Accepting this initial **loss**.

  Each choice begets another **loss**,
  The cruel economy of **constraint**.
  True meaning flees the guiding **source**,
  Betrayed by shackled, foreign **form**.
  What *was* his delicate **sense**?
  A hollow, mocking, thin **echo**.

  I chase that fading, French **echo**,
  Renewed by every fresh-made **loss**.
  The sick maid's smile, the slight **sense**
  Of comfort offered? Crushed by **constraint**!
  The rhyme demands its rigid **form**,
  Distorting the original **source**.

  O, Clément Marot, pure **source**!
  Your lines resound, a bright **echo**
  Across the gulf. What **form**
  Can hold your grace without **loss**?
  This English tongue, its blunt **constraint**,
  Mangles the subtle, quick **sense**.

  The ache, the gift – the core **sense** –
  Lies trapped within the French **source**.
  My language fights its native **constraint**,
  Offers a fractured, feeble **echo**.
  Is *this* the necessary **loss**
  For keeping semblance, outward **form**?

  Envoi:
  Translator, bound by **form**'s **constraint**,
  Your **sense** dissolves, a costly **loss**.
  The **source** recedes; a fading **echo**.
