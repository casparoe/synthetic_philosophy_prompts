  Hmm, the user's scenario is academic but also deeply practical. They're not just theorizing; they're trying to make sense of real-world behavior. The term "normative tourism" is clever—it captures how visitors pick and choose which social rules to follow, often missing the deeper, invisible ones. The user wants to know which framework explains this better and whether normative tourism is harmless, exploitative, or something in between. 

  Let me break down the two frameworks first. Normative conventionalism sees social rules as creating moral obligations just by existing in a shared space. If you're physically present, you're bound by them. Practice-embedded particularism, though, argues that rules only become moral obligations when they're part of a shared "form of life"—meaning mutual understanding, reciprocity, and context matter. Outsiders can't fully grasp or be bound by them. 

  For invisible obligations, conventionalism would say visitors *should* know and follow them because they're in the space. But that feels unrealistic—how can outsiders know what's invisible? Particularism handles this better: if the obligation relies on tacit knowledge, outsiders can't be blamed for missing it. But then, how do we justify asking them to comply? 

  Normative tourism... The user is spot-on about the visible/invisible divide. Tourists might queue politely (visible) but stiff a waiter on tips (invisible). Conventionalism would call this free-riding; particularism might see it as cluelessness. The user's deeper question seems to be about fairness: Is it reasonable to expect visitors to learn *all* the rules, even hidden ones? And does demanding compliance erase the line between morality and cultural assimilation? 

  Particularism feels more coherent here. It explains why insiders feel the weight of invisible rules (they're embedded in their shared life) and why outsiders don't (they lack context). But it also raises a problem: if obligations require deep immersion, can we ever hold visitors accountable? Maybe the answer lies in a middle ground—like provisional obligations based on reasonable effort to learn, or distinguishing core moral harms from local customs. 

  The user might also be hinting at a bigger idea: How do we build inclusive moral spaces without imposing one culture's rules? That’s a thorny, beautiful question. I should emphasize that neither framework is perfect, but particularism better captures the lived reality of social norms. Still, it needs adjustments to address the user's concern about demanding compliance without forcing assimilation.
answer: |-
  Your analysis brilliantly dissects a fundamental tension in social ethics. Let's unpack how each framework addresses your core questions, starting with their contrasting views on invisible obligations:

  ### 1. Accounting for Invisible Obligations
  *   **Normative Conventionalism:**
      *   **View:** Invisible obligations (embedded tipping economies, unmarked pedestrian expectations) are *just as binding* as visible ones. Their moral force stems from their functional role in sustaining the local cooperative order.
      *   **Justification:** Ignorance is *less excusable*. If the convention exists and serves a vital social coordination/justice function (e.g., ensuring fair wages via tips, preventing pedestrian chaos), its invisibility doesn't negate the visitor's obligation to learn and comply. The *fact* of participation in the social space creates the duty to understand its rules. Failure constitutes a violation of the implicit social contract enabling smooth interaction.
      *   **Problem:** Demands significant epistemic effort from visitors for potentially opaque norms. Risks being overly stringent ("You *should* have known").

  *   **Practice-Embedded Particularism:**
      *   **View:** Invisible obligations derive their *genuine moral force* primarily from being embedded within the "form of life." Their binding power relies on the *tacit mutual recognition, shared expectations, and background understanding* among participants.
      *   **Justification:** Outsiders, lacking immersion in this shared lifeworld, genuinely *cannot* perceive the full normative significance or feel the same pull of obligation. The *meaning* of the act (e.g., *not* tipping isn't just stinginess, it's a failure of reciprocal recognition vital to *this* service economy's moral structure) is inaccessible. Obligation arises from *participation in the mutual practice*, not mere physical presence.
      *   **Problem:** Risks excusing significant normative ignorance ("They *couldn't* have understood") and potentially absolving visitors of responsibility for harms caused by non-compliance.

  ### 2. Diagnosing Normative Tourism
  *   **Through Conventionalism:**
      *   **View:** **Primarily Moral Free-Riding.** Selectively following visible, easily performative norms (queuing) while ignoring burdensome or invisible ones (tipping, yielding norms) exploits the system. The visitor benefits from the *overall* social order (safety, service, predictability) maintained by *all* conventions, while avoiding the costs associated with the less visible/pleasant ones. This undermines the fairness and stability of the cooperative scheme.
  *   **Through Particularism:**
      *   **View:** **Structurally In Between, Leaning Towards Epistemic Failure/Harm.** It's not purely free-riding because the tourist genuinely lacks the embedded understanding that makes the invisible norms *feel* obligatory. However, it's more than harmless consumption:
          *   **Harm:** Actions based on ignorance can still cause tangible harm (underpaid workers, disrupted flow, perceived rudeness causing distress).
          *   **Epistemic Arrogance:** Treating visible norms as optional performances demonstrates a failure to engage seriously with the local moral fabric *as it is lived*, reducing it to aesthetic choices.
          *   **Failed Recognition:** It reflects a refusal to make the minimal effort required for *provisional* participation in the mutual recognition constituting the local moral space. This failure can itself be a moral lapse regarding respect for persons within *their* context.
  *   **Synthesis:** Normative tourism exploits the *accessibility gap* between visible and invisible conventions. Conventionalism emphasizes the *structural unfairness* of this gap exploitation. Particularism emphasizes the *epistemic and recognitive failure* enabling it. Both agree it's problematic, not harmless.

  ### 3. Explaining the Opacity Gap & Justifying Compliance Demands
  *   **Why Obligatory for Insiders, Opaque to Outsiders?**
      *   **Particularism Offers the More Coherent Account:** It directly explains the phenomenology. For insiders, the convention is woven into the fabric of mutual expectations, historical understanding ("This is how we ensure waitstaff survive"), and embodied habits. Its moral force is felt as part of "how things are *done* here," tied to reciprocal recognition. Outsiders lack this embeddedness. They see the *action* but not the dense network of meaning, reliance, and mutual commitment that gives it normative weight. The opacity stems from lacking the shared "form of life." Conventionalism struggles here, implying the obligation *should* be equally perceptible, blaming the outsider's ignorance more harshly without fully explaining *why* the feeling of obligation differs so profoundly.
  *   **Justifying Full Compliance Demands Without Collapsing Morality/Assimilation:**
      *   **The Challenge:** Both frameworks risk this collapse. Conventionalism might demand assimilation ("Follow *all* rules simply because they exist here"). Particularism might absolve outsiders entirely ("You aren't part of *us*, so our rules don't bind you").
      *   **A Particularist Path Forward (with Nuance):**
          1.  **Distinguish Core Moral Harm from Local Implementation:** Demand compliance primarily with conventions preventing clear *harm* or fundamental injustice *within the local context* (e.g., "This system relies on tips for fair wages; not tipping exploits workers here"). Justification hinges on avoiding harm to persons *in this specific system*, not the inherent moral superiority of the convention itself.
          2.  **Emphasize Provisional Recognition:** Visitors have an obligation grounded in *respect for persons* to make reasonable efforts to understand and provisionally participate in the local normative order *as a condition of entering the social space*. This includes learning key invisible obligations. Failure represents a lack of respect.
          3.  **Focus on Reliance and Vulnerability:** Highlight how invisible conventions often manage *reliance* and *vulnerability* (workers relying on tips, pedestrians relying on predictable right-of-way). Visitors benefit from the system managing these vulnerabilities and thus incur an obligation not to undermine it, even if the *specific mechanism* (tipping) isn't universal. The moral core is non-exploitation and non-harm within the existing structure.
          4.  **Acknowledge Limits:** Justify demanding *knowledge and compliance* with conventions visitors *could reasonably be expected to learn* (major tipping norms, basic pedestrian rules) and whose violation causes significant local harm/distress. Excuse genuine, non-negligent ignorance of highly esoteric or truly invisible norms. Demand effort, not omniscience.
      *   **Why this avoids collapse:** It ties obligation to avoiding harm to persons within the local context and showing basic respect through effort, *not* to the inherent moral rightness of every local custom or the demand for full cultural assimilation. The visitor isn't obliged to *believe* tipping is the ideal system, but they *are* obliged not to harm workers within the system that exists.

  **Conclusion:**

  While normative conventionalism provides a clear, rule-based account, **practice-embedded particularism offers the more coherent and phenomenologically accurate explanation for the opacity of invisible obligations and the nature of normative tourism.** It better captures *why* insiders feel the binding force and outsiders struggle. Particularism also provides a more plausible (though complex) path to justifying limited compliance demands from visitors without demanding full assimilation: grounding obligations in the **avoidance of harm within the local context** and the **duty of provisional recognition and reasonable epistemic effort** when entering a shared social space. It frames normative tourism less as calculated free-riding (though that element exists) and more as a **failure of recognitive engagement and epistemic responsibility**, often resulting in unintended harm. This view preserves the distinction between moral obligation and assimilation by focusing on harm, respect, and effort within the encountered form of life, rather than the intrinsic moral authority of every local convention. Your concept of "normative tourism" perfectly illuminates the critical fault line between visibility and genuine embedded obligation.
