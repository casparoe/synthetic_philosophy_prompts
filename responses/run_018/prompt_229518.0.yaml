answer: |-
  Here's a breakdown of "hard work never killed anybody," dissecting its possible meanings, their validity, and relevance to dismissing a collapse – tailored for your dialogue-driven needs:

  **The Readings & Their Validity:**

  1.  **Literal & Hyperbolic:** "No single act of strenuous effort directly causes instantaneous death in a healthy person."
      *   *True-ish?* Broadly speaking, yes. Pushing yourself hard *once* rarely causes immediate death in isolation (like a heart attack). It's often meant as hyperbole.
      *   *Reasonable Defense?* Minimally, as a figure of speech acknowledging effort is demanding but survivable. Weak if used seriously to dismiss *all* risk.
      *   **Supports Dismissing Collapse? NO.** A faint is *precisely* the body's emergency shutdown *before* literal death occurs. It screams "THIS IS KILLING ME RIGHT NOW!" The line becomes dangerously oblivious.

  2.  **Sustainable Effort:** "Engaging in demanding, meaningful labor within human limits isn't inherently fatal."
      *   *True-ish?* Yes. Humans are built for exertion. Many find deep satisfaction in challenging physical/mental work done sustainably.
      *   *Reasonable Defense?* Absolutely. Defends the dignity and value of demanding professions when conditions are humane.
      *   **Supports Dismissing Collapse? NO.** Collapsing from exhaustion is the *antithesis* of sustainable effort. It proves limits were catastrophically ignored. Using this reading to dismiss it perverts its meaning.

  3.  **Immediate Fatality Focus:** "Fainting isn't death. Therefore, the work didn't kill them *this time*."
      *   *True-ish?* Technically true in the immediate moment. The person fainted, they didn't die on the spot.
      *   *Reasonable Defense?* Only in the most pedantic, morally bankrupt sense. Ignores the collapse as a dire warning sign.
      *   **Supports Dismissing Collapse? SUPERFICIALLY (and cynically).** This is likely the owner's *actual, unspoken logic*. It treats the faint as an inconvenient blip, not a near-miss or symptom of systemic abuse. The gap? **Confusing the absence of immediate death with the absence of lethal harm.** The pushback can highlight: "No, she's not dead *yet*. This is her body waving the biggest white flag it has before the surrender. Ignoring *this* is how people *do* die."

  4.  **Moral Virtue vs. Physical Risk:** "The *virtue* of hard work (diligence, perseverance, dedication) isn't lethal. Sloth is the real danger."
      *   *True-ish?* Abstractly, virtues themselves aren't physical threats. But it dangerously conflates ethics with biology.
      *   *Reasonable Defense?* Highly debatable. Defends the *idea* of hard work but ignores how its *implementation* (like chronic exhaustion) becomes physically toxic.
      *   **Supports Dismissing Collapse? YES (in the owner's warped view).** The owner sees the collapse as a failure of character ("not tough enough") or an inconvenient interruption of virtuous effort, not a physical crisis. The gap? **Equating the *moral ideal* with the *physical reality*. The pushback: "Dedication isn't the problem. Expecting a body to run on empty until it shuts down *is*. You're mistaking virtue for recklessness."**

  5.  **Long-Term Harm Denial:** "Chronic overwork doesn't *actually* cause heart disease, stroke, severe mental illness, or accidents. That's just weakness or bad luck."
      *   *True-ish?* **Blatantly False.** Overwhelming evidence links chronic stress, sleep deprivation, and exhaustion to drastically increased risks of cardiovascular events, strokes, depression/anxiety, impaired immunity, and workplace accidents (knives, fire, falls).
      *   *Reasonable Defense?* No. Contradicts established medical and occupational health knowledge (karoshi exists for a reason).
      *   **Supports Dismissing Collapse? YES (as a core belief).** If the owner genuinely believes this, the collapse is just "a fluke" or "drama," not a symptom of a dangerous pattern. The pushback must be direct: "Tell that to [mention karoshi, a local chef who had a heart attack, ambulance crews, ICU nurses]. Bodies break. Exhaustion kills, just not always neatly during the dinner rush."

  6.  **"Killed" Means Sole Cause:** "Hard work alone isn't the *only* factor. Genetics, lifestyle, etc., play a role."
      *   *True-ish?* Yes. Health outcomes are multifactorial.
      *   *Reasonable Defense?* Reasonable in a nuanced discussion about causality. Dangerous when used to *absolve* overwork's contribution.
      *   **Supports Dismissing Collapse? YES (as deflection).** The owner shifts blame: "Well, maybe if they ate better/slept more/had stronger genes..." This ignores overwork as the *proximate, overwhelming trigger* in this context. The gap? **Denying the *significant contributing factor*.** Pushback: "Sure, maybe they weren't perfect. But you loaded the gun by running them into the ground. Their collapse happened *here, now, because of this*."

  **Which Readings Would the Owner Likely Use to Dismiss the Collapse?**

  *   **#3 (Immediate Fatality Focus - "She's not dead!"):** The most likely cynical, surface-level dismissal. It requires the least thought and directly addresses the immediate event.
  *   **#4 (Moral Virtue vs. Physical Risk - "Toughen up!"):** Deeply ingrained in toxic work cultures, especially kitchens. Frames the issue as character weakness.
  *   **#6 (Sole Cause - "Maybe it's their fault..."):** A common deflection tactic to avoid responsibility.

  **For Your Pushback Character (Targeting the Gaps):**

  Focus on exposing how the owner's *use* of the phrase, even if twisted from a grain of truth, is irrelevant or dangerously misleading *in this specific context of a collapse*:

  *   **Against #3:** "No, she's not dead. *This time*. Her body just hit the emergency brake because you kept flooring the accelerator. Ignore the brake lights often enough, and you *will* crash."
  *   **Against #4:** "Dedication isn't killing her. Your definition of 'hard work' is. There's a difference between pushing limits and breaking people. This," *(gestures to fallen sous)* "is broken."
  *   **Against #6:** "Maybe they skipped breakfast. Maybe they have crap genes. Doesn't matter. *Your* kitchen, *your* schedule, *your* pressure was the lit match. You don't get to blame the tinder."
  *   **General Gap (The Collapse as Evidence):** "You keep saying 'hard work never killed anybody.' Look down. *This* is what 'not dead yet' looks like. How much closer to the edge do you need people to go before 'never' becomes 'not today'?" or "It's not about whether the *last* straw kills the camel. It's about piling on so many damn straws that a collapse is inevitable. This *is* the straw pile collapsing."

  The power comes from shifting the focus from the abstract, potentially defensible *idea* of hard work to the *concrete, undeniable evidence of harm* right at their feet (the collapsed sous-chef), revealing the phrase as a cruel evasion of responsibility in that moment. Good luck with the scene!
