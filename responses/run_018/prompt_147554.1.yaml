answer: |-
  **(Clinking glass gently)**  

  Friends, colleagues—and especially you, Lena—gather ‘round. We’re here to celebrate not just 35 years, but a presence. The woman who *always* sends birthday cards, even when you’ve forgotten hers. Who remembers the exact insult someone tossed at a conference in ’97 and will *still* arch an eyebrow if their name comes up. Who’s been the steady hand in this department, the glue in so many friendships, the keeper of stories.  

  And yet—(*raises a playful finger*)—Lena spent her career telling us, brilliantly, that the self isn’t a *thing*. Not a hidden gem inside us, not some permanent captain steering the ship. Her work—in labs studying how the brain predicts the world, and in ancient texts parsing how we label experience—showed us the self is more like… a river. A story being told, moment by moment, shaped by currents we call memory, habit, relationship. A pattern that holds, not because there’s a fixed core, but because the flow has direction.  

  So how do we square that? How do we honor *this* Lena—the one whose kindness feels so utterly *consistent*, whose moral compass points true north—without pretending she’s secretly a statue?  

  I think Lena herself showed us the way. She lived in the beautiful tension between two truths. There’s the ultimate truth her work revealed: no solid, unchanging "I" beneath it all. And then there’s the conventional truth she mastered: the art of showing up, fully, in the story.  

  She understood that labels—"friend," "mentor," "colleague," even "Lena"—aren’t lies. They’re the maps we use to navigate. They’re the commitments we make, the patterns we choose to reinforce. When Lena remembered your birthday, it wasn't a fixed soul acting—it was a current of care, flowing through time. When she held a grudge (*smiles at Lena*), well… that was a different current, stubbornly persistent! (*Gentle laughter*). Her genius was treating this continuity—this karmic momentum of character—not as proof of a hidden self, but as something far more active, more demanding: a responsibility. A story worth tending with fierce integrity.  

  That’s her legacy. Not a soul-substance, but a shape in the stream—a pattern of wisdom, curiosity, loyalty, and yes, a little fierceness—that changed the currents around it. She showed us that being "conventional" doesn’t mean being shallow. It means choosing, again and again, the story you want to live by. And Lena? Your story has been extraordinary. It’s shaped departments, sparked ideas, held friends close, and reminded us all that the most profound truths aren't just studied—they're lived.  

  So let’s raise a glass to the magnificent, ever-unfolding story we call Lena. To the currents you’ve shaped, the patterns you’ve woven, and the brilliant, conventional, utterly real presence we’ve been so lucky to know. To Lena!  

  *(Lifts glass high)* **To Lena!**
