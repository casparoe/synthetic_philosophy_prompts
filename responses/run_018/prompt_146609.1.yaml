answer: |-
  Here's that taxonomy tree for your handout – structured as a working draft with messy edges, just like seminar notes. I used the Benin Bronzes (BB) and Parthenon Marbles (PM) as gut-checks for each question. Focused on concrete forks, awkward commitments, and mapping what's occupied. (Typos left in from your prompt for authenticity!)

  ---

  ### **The Restitution Decision Tree: Where Do You Branch?**
  *(Reference Anchors: Benin Bronzes = violent 1897 looting by British forces. Parthenon Marbles = removed by Lord Elgin under Ottoman occupation, legality hotly debated.)*

  #### **1. START HERE: Was the object clearly acquired through theft/violence?**  
  *(BB: Pretty much "hell yes." PM: "Debated, but feels shady af.")*  
    - **NO** → Go to **Q2**  
    - **YES** → Go to **Q3**  

  #### **2. (If "NO" to clear theft/violence) Does murky or missing provenance BLOCK the moral claim for return?**  
  *(e.g., "If we can't prove it was stolen 200 yrs ago, does that kill the claim?")*  
    - **YES** → **→ Retentionist**  
      *Awkward commitment: Defending museums keeping stuff where the acquisition history is suspicious but legally convenient (e.g., "Finders keepers!").*  
    - **NO** → **→ Cultural Stewardship (or Unnamed)**  
      *Awkward commitment: Pushing return even without proof of violence, risking chaos in collections (e.g., "Return it just ’cause it feels right!").*  

  #### **3. (If "YES" to clear theft/violence) Does CULTURAL CONTINUITY matter more than LEGAL OWNERSHIP?**  
  *(e.g., BB: Modern Nigeria vs. historic Kingdom of Benin? PM: Modern Greece vs. Ottoman Empire’s "sale" to Elgin?)*  
    - **YES** → Go to **Q4**  
    - **NO** → Go to **Q5**  

  #### **4. (If "YES" to cultural continuity > legal ownership) Can an educational/universal-access argument EVER outweigh restitution?**  
  *(e.g., "Do London’s crowds & schools trump Athens or Benin City’s claim?")*  
    - **YES** → **→ Universalist**  
      *Awkward commitment: Implying source communities can't educate the world as well as Euro museums (e.g., "Nigerians can handle it... but Brits do it *better*").*  
    - **NO** → Go to **Q6**  

  #### **5. (If "NO" to cultural continuity > legal ownership) Can an educational/universal-access argument EVER outweigh restitution?**  
  *(e.g., "Even if cultural links are fuzzy, should access beat justice?")*  
    - **YES** → **→ Conditional Restitutionist**  
      *Awkward commitment: Demanding "ideal" conditions for return that rarely happen (e.g., "Greece can have the Marbles... once they build a *perfect* museum!").*  
    - **NO** → Go to **Q6**  

  #### **6. (LAST SPLIT! For folks who said "NO" to education outweighing in Q4 or Q5) Is restitution mainly about FIXING RELATIONAL HARM (repairing ongoing injustice) or just CORRECTING A PROPERTY WRONG?**  
  *(e.g., BB: Healing colonial trauma vs. just returning loot? PM: Restoring Greece’s dignity vs. voiding Elgin’s "deed"?)  
    - **RELATIONAL HARM** → **→ Reparations-Focused**  
      *Awkward commitment: Tying return to bigger political fights (e.g., "Give back Bronzes *and* pay reparations!" – scares museums/govs).*  
    - **PROPERTY WRONG** → **→ Full Restitutionist**  
      *Awkward commitment: Returning objects even if context is unstable (e.g., "Send Bronzes to Nigeria *now*, corruption risks be damned!").*  

  ---

  ### **Occupied vs. Empty Leaves & Notes**
  - **Occupied Branches**: Every leaf except one has a named/unnamed position. Retentionists, Universalists, etc. are all mapped.  
  - **Same Leaf Alert**: **Conditional Restitutionist** and **Universalist** both land on "Education CAN outweigh restitution" (Q4-YES & Q5-YES). The tree can’t split them further – they’re siblings, not cousins. Difference is in tactics (Conditional adds hoops).  
  - **The Empty Leaf**:  
    - **Where?** Branch: **Theft=YES** → **Cultural continuity=NO** → **Education overrides=YES** (Q5-YES).  
    - **Why empty?** Incoherent. If you admit theft *and* reject cultural ties, saying "education beats restitution" implies museums have a *moral duty* to hold stolen stuff. Too gross to defend openly. (No one wants to say: "Steal it *for* the greater good!")  
  - **Unexplored?**:  
    - **Relational Harm + No Cultural Continuity** (Q5-NO → Relational Harm) is technically possible but empty. Why? Fixing relational harm without cultural ties feels mismatched (e.g., "Let’s heal colonialism... but also, modern Greeks have nothing to do with ancients?"). Probably just unexamined.  

  ---

  ### **Handout Notes**
  - **Use Case**: Good for small-group roleplay! Assign branches, debate using BB/PM facts.  
  - **Gaps**: The tree simplifies – real positions are messier. "Cultural Stewardship" could overlap with Universalism if museums claim "stewardship" via education.  
  - **Why Awkward Commitments?** Forces honesty about trade-offs. No position escapes a hot take!  
  - **Credit**: Inspired by real debates (Hickley, Merryman, Sarr-Savoy) but stripped of jargon.  

  Let me know if you want to prune/add a branch! Happy to tweak.
