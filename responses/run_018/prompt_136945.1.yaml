prompt: |-
  I've never studied philosophy formally, but I've been turning over an idea I keep hearing in arguments about end-of-life care: people say there's a clear moral line between "doing harm" and "merely allowing harm," often to defend the view that a doctor who stops a ventilator is only allowing nature to take its course, while one who gives a lethal injection is actively killing. The phrase seems to do a lot of work, yet I can't tell what precise claim it is actually making. Could it be a thesis about physical causation — that removing a machine doesn't cause death, the underlying disease does? A thesis about intention — that the doctor's aim in one case is to end suffering, not to end life? A claim about moral responsibility — that we are only accountable for our actions, not for omissions? Or perhaps a normative claim that our obligation not to kill is stronger, or different in kind, from any obligation to keep someone alive? Please lay out the distinct precise interpretations this slogan could carry, labeling which are trivial or definitional, which are substantial and defensible, and which are false or misleading. Then indicate which of those interpretations actually supports the distinction between withdrawing life support and administering lethal medication, and whether that interpretation survives scrutiny. I met this phrase in a personal debate about medical ethics, and I want to bring a clear breakdown back to the conversation — not a reading list, just the menu of meanings.
