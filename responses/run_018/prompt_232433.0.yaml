answer: |-
  ### The Surface Conflict
  The regulator imposes two seemingly contradictory requirements. First, retail fund documents must disclaim that "past performance is not a reliable guide to future results," explicitly rejecting the inductive inference that historical returns predict future outperformance. Second, the firm’s prudential risk models must be calibrated using at least ten years of historical market data, including stress scenarios, implying that historical patterns *are* informative for future risk. The same authority penalizes funds for implying past success guarantees future gains while mandating historical reliance for risk management. This creates a paradox: either historical data contains information about the future (validating risk models) or it does not (validating the disclaimer), but not both coherently.

  ---

  ### The Implicit Epistemologies
  **Performance Disclaimer Epistemology:**  
  This reflects a **radical Humean skepticism** about induction in dynamic systems. Financial markets are viewed as non-ergodic, path-dependent, and subject to structural breaks (e.g., regime changes, technological disruptions). Past returns are seen as *idiosyncratic samples* from an ever-shifting distribution, where extrapolation commits the fallacy of ignoring model instability and overfitting. The disclaimer assumes that future returns are largely governed by latent, unpredictable factors (e.g., unforeseen events, investor behavior shifts), rendering historical performance statistically inert for *directional forecasting*.

  **Risk Model Requirement Epistemology:**  
  This presupposes **moderate frequentism**, where historical data reveals *persistent statistical properties* of market structure. While future returns may be unpredictable, covariance matrices, volatility clusters, tail dependencies, and stress correlations are assumed to exhibit *relative stationarity* over medium-term horizons. Historical data here serves not to predict outcomes but to estimate the *shape* of risk distributions—particularly tail risks—under the view that market mechanics (liquidity crises, contagion) recur in statistically similar forms. The regulator implicitly endorses history as a guide to *plausible scenarios*, not specific returns.

  **Key Difference:**  
  The disclaimer denies history’s utility for *first-moment prediction* (returns), while risk modeling accepts it for *second-moment estimation* (variance/covariance) and *extreme-event modeling*. The former treats markets as fundamentally nonstationary; the latter assumes *local* stationarity in risk structures.

  ---

  ### A Principled Reconciliation?
  Three distinctions may resolve the tension:  
  1. **Prediction vs. Stress-Testing:**  
     Performance claims imply *point forecasts* (e.g., "Fund X will beat the market"). Risk models use history for *conditional scenario analysis* (e.g., "If 2008 recurs, losses could reach Y%"). The latter makes no claim about *whether* history repeats, only that it defines a *plausible adverse state*.  

  2. **Past Performance vs. Historical Covariance:**  
     A fund’s track record reflects skill, luck, and obsolete conditions. Historical covariance and tail risk, however, capture *systemic relationships* (e.g., flight-to-quality during crises) that may reemerge due to behavioral or institutional constants (e.g., leverage constraints, herding).  

  3. **Legal Boilerplate vs. Epistemic Commitment:**  
     The disclaimer is a *consumer protection* rule against naive extrapolation. Risk modeling is a *prudential* rule requiring defensible inputs for solvency assessments. The former addresses retail investors’ behavioral biases; the latter addresses institutional resilience.  

  **Limits:**  
  This reconciliation holds only if (a) risk structures are more stable than returns, and (b) models avoid overfitting. If correlations shift as rapidly as returns (e.g., due to algorithmic trading), the distinction collapses. The tension remains political: regulators mandate historical data for *their* scrutiny but restrict its use in *marketing* to avoid investor overconfidence.

  ---

  ### The No-Free-Lunch Objection  
  The no-free-lunch (NFL) theorem states that no algorithm can outperform random guessing across all possible data-generating processes. Applied here:  
  - **Undermines both requirements equally:** If all market histories are equally likely, historical data—whether for returns or risk—carries no inherent predictive power. Calibrating models on past data becomes epistemically arbitrary.  
  - **But finance isn’t "all possible worlds":** Markets operate under relatively stable constraints (e.g., arbitrage limits, risk aversion, institutional rules). NFL applies to *unconstrained* learning; finance inhabits a *subset* of structured environments (e.g., bounded rationality, partial equilibrium).  
  - **Risk models as heuristic tools:** NFL doesn’t forbid using history but shows that its value depends on *domain-specific assumptions*. If markets exhibit *some* persistence (e.g., volatility clustering), historical calibration can be rational *despite* NFL. However, NFL demands *humility*: models are not "true" but potentially useful if the future resembles the past.  
  **Verdict:** NFL critiques blind faith in historical data but doesn’t invalidate risk modeling *if* its assumptions (e.g., local stationarity) hold. It *does* invalidate claims that historical calibration guarantees robustness.  

  ---

  ### What Would Have to Change  
  If NFL constraints were taken seriously:  
  1. **Model Uncertainty Quantification:** Regulators would require risk reports to include (a) sensitivity analyses showing outcomes under *alternative* historical periods, (b) Bayesian priors for structural breaks, and (c) explicit confidence intervals for model outputs.  
  2. **Forward-Looking Scenarios:** Stress tests would supplement historical data with hypothetical narratives (e.g., climate shocks, cyberattacks) not seen in past decades.  
  3. **Anti-Fragility Mandates:** Capital buffers would depend less on historical VaR and more on reverse stress tests (e.g., "What would cause 50% losses?") and robust portfolio design.  
  4. **Performance Disclaimers Enhanced:** Disclaimers would explicitly warn that risk models, like performance, rely on unstable historical assumptions.  

  ---

  ### Verdict  
  The **risk-model requirement** is more defensible. Its epistemology—using history to estimate *plausible adverse scenarios* without claiming predictive certainty—aligns with the bounded rationality of financial systems. The performance disclaimer, while necessary for consumer protection, overstates the case by implying history is *entirely* uninformative. Risk modeling’s focus on *conditional probabilities* ("if X, then Y likelihood of Z") is inherently more robust than performance marketing’s *unconditional promises*. However, both must acknowledge NFL’s warning: no model is universally reliable, and all inductive inference in finance is provisional.
