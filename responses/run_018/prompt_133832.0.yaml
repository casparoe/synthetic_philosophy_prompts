answer: |-
  ### (1) Exam Question (75-minute response)  
  **Daniel Dennett argues that "real patterns" exist only relative to a predictive stance (e.g., physical, design, or intentional). Yet mechanistic explanations in neuroscience—such as identifying neural circuits for memory—demand that mechanisms exhibit counterfactual stability (e.g., "if we inhibit neuron X, behavior Y disappears") and entity manipulability, which appear observer-independent. Does treating mechanisms as stance-dependent patterns undermine the interventionist rationale for mechanistic discovery? Or can the design stance reconceive counterfactual stability *as* a pattern recognized only from within that stance?**  
  *In your essay:*  
  (a) Explain the unique **ontological commitments** of Dennett’s physical, design, and intentional stances.  
  (b) Articulate **why mechanistic explanation seems to require more than predictive success**, focusing on counterfactual manipulability.  
  (c) Defend a position: Is the reality of mechanistic patterns best grounded in **physical-stance bedrock**, **design-stance projection**, or **intentional-stance interpretation**?  
  *Avoid:* Conflating the design stance with instrumentalism; assuming physical-stance primacy without argument; ignoring whether counterfactual intervention implies stance-independent entities.  

  ---

  ### (2) Model Answer (≈600 words)  
  Dennett’s three stances offer distinct ontological frameworks. The **physical stance** commits to fundamental particles/forces described by physics, treating entities as mind-independent *res extensa*. The **design stance** attributes functions to systems (e.g., "the heart pumps blood"), ontologically committing to *teleological patterns* irreducible to physics but reliant on observer-relative success criteria (e.g., predictive efficiency). The **intentional stance** interprets systems as rational agents with beliefs/desires, committing to *propositional patterns* validated solely by behavioral prediction. Crucially, *no stance is ontologically privileged*: each reveals "real patterns" only when it optimizes prediction.  

  Mechanistic explanation, however, appears to demand more than predictive efficiency. Neuroscientists like Craver require mechanisms to exhibit *counterfactual stability*: components must be *independently manipulable* (e.g., optogenetically suppressing a neuron to alter memory recall) and mechanisms must remain robust across interventions. This implies entities exist *antecedent to* prediction—a stability seemingly independent of our interpretive stance. If mechanisms are mere stance-dependent patterns (e.g., "memory circuit" as a design-stance heuristic), interventionist criteria collapse into circularity: manipulability presupposes entities to manipulate, yet Dennett reduces entities to patterns validated post hoc by prediction.  

  This tension dissolves when we reconceive counterfactual stability *as a design-stance pattern*. The design stance does not merely predict; it *models systems as if they were engineered*, encoding normative expectations (e.g., "component X *should* perform function Y"). Counterfactuals are not discoveries of pre-existing bedrock but *projections of functional design*: "inhibiting neuron X" only meaningfully alters "memory" if we first adopt a design stance framing neurons as components in a goal-oriented system. The stability of mechanisms is thus a higher-order pattern—a "meta-prediction" that certain functional descriptions *remain robust* under perturbation *from within the stance*. For example, treating a neural circuit as a feedback loop stabilizes predictions across interventions, but this stability emerges *relationally* through our design-based modeling choices.  

  Consequently, mechanistic patterns are neither physical-stance bedrock (which ignores functional organization) nor intentional-stance interpretation (which over-intellectualizes subsystems). They are **design-stance projections**, where "reality" reflects *pragmatic success under intervention*. Physical components exist, but their status *as mechanistic parts* depends on design-stance framing: synapses are physical-stance structures, yet their role in "memory consolidation" requires attributing teleology. Contra instrumentalism, this is not fictionalism; design-stance patterns are real because they enable *non-arbitrary* interventions (e.g., deep-brain stimulation works *only* if patterns track causal structure). Thus, counterfactual stability is not undermined but *redefined* as the resilience of a design pattern across possible worlds we pragmatically engineer.  

  Ontologically, this positions mechanistic science as *tiered*: physical-stance entities ground patterns, but mechanistic "reality" emerges from design-stance projection, validated by interventionist success. The "conflict" with physicalism evaporates—stances are complementary tools, not competitors for ultimate reality.  

  ---

  ### (3) Marking Scheme (20 total marks)  
  **Criterion 1: Ontological commitments of the three stances** (4 marks)  
  - **Full credit (4)**: Clearly distinguishes commitments—physical (mind-independent entities), design (teleofunctional patterns), intentional (propositional attitudes)—*without* conflating stances.  
  - **Partial (2)**: Correct labels but vague commitments (e.g., "design stance is about purpose" without linking to prediction).  
  - **No credit (0)**: Misrepresents stances (e.g., "design stance is make-believe").  

  **Criterion 2: Why mechanistic explanation exceeds predictive success** (4 marks)  
  - **Full credit (4)**: Explicitly ties mechanistic demands (counterfactual manipulability, entity stability) to interventionism (e.g., Woodward/Craver), showing why they *seem* stance-independent.  
  - **Partial (2)**: Notes counterfactuals but doesn’t contrast with Dennett’s predictive criterion.  
  - **No credit (0)**: Equates mechanistic success with prediction alone.  

  **Criterion 3: Defense of ontological position** (4 marks)  
  - **Full credit (4)**: Chooses/argues for *one* position (e.g., design-stance projection) with original synthesis (e.g., "counterfactuals as meta-patterns").  
  - **Partial (2)**: States position but relies on labels; no novel argument.  
  - **No credit (0)**: Unsupported assertion (e.g., "physical stance is obviously true").  

  **Criterion 4: Engagement with counterfactual intervention** (4 marks)  
  - **Full credit (4)**: Addresses whether manipulability implies mind-independence (e.g., "interventions test design patterns, not bedrock").  
  - **Partial (2)**: Mentions intervention but ignores ontology (e.g., "scientists do experiments, so it’s real").  
  - **No credit (0)**: Omits counterfactuals entirely.  

  **Criterion 5: Avoiding key misconceptions** (4 marks)  
  - **Full credit (4)**: Avoids all three pitfalls:  
    - (a) No conflation of design stance with instrumentalism (e.g., distinguishes teleological patterns from "useful fictions").  
    - (b) No unargued physical-stance privilege (e.g., explicitly rejects reductionism).  
    - (c) Addresses stance-dependence of counterfactual entities.  
  - **Partial (2)**: Avoids 1–2 pitfalls but commits one.  
  - **No credit (0)**: Commits all three or dismisses stance-dependence.  

  ---  
  **Rationale**: This question forces students beyond exegesis by centering an unresolved tension in philosophy of mind. The model answer demonstrates expected moves: (i) stances as ontologically distinct but non-competitive, (ii) mechanistic intervention as a challenge to predictive pragmatism, (iii) redefining counterfactuals within the design stance. The scheme penalizes superficial responses while rewarding nuanced reconciliation.
