  The messy parts are where it gets spicy. Hidden branching (like unmeasured quantum states) forces the theory to handle uncertainty about the branching structure itself. Nested simulations? That’s a meta-nightmare—what even *is* "base reality" here? The theory must assign credences without privileged access to the "true" layer. 

