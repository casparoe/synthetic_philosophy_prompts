answer: |-
  Here’s a tight 45-minute lesson plan targeting CS grads, optimized for conceptual rigor and avoiding historical detours:

  ---

  ### **Teaching Arc & Dependencies**  
  **Skip Aristotle** → Start with **naive set theory** (they know this). Dependency order:  
  1. Class membership intuition (OOP/databases)  
  2. Extensional vs. intensional definitions  
  3. Subset vs. membership confusion  
  **Why:** CS students already model inheritance; use their intuition against them.  

  ---

  ### **Core Analog Example: OOP Inheritance**  
  ```python  
  class Horse:  
      def __init__(self):  
          self.species = "equine"  

  class WhiteHorse(Horse):  
      def __init__(self):  
          super().__init__()  
          self.color = "white"  

  # Now:  
  assert isinstance(WhiteHorse(), Horse)  # True in code  
  ```  
  **The Crack:**  
  - *Extensional view*: All white horses ARE horses (set inclusion).  
  - *Intensional view*: "Horse" requires *only* species; "white horse" requires species **+ color**.  
  **Why it works**: Forces distinction between *properties* (attributes) and *identity* (class).  

  ---

  ### **Misconceptions & Debunk Sequence**  
  1. **"It’s a language trick (adjectives ≠ nouns)"**  
     - *When*: Immediately after stating the paradox.  
     - *Shut down with*: The OOP example (color isn’t "just an adjective" — it’s a defining property constraint).  

  2. **"Russell’s Paradox in disguise"**  
     - *When*: When you draw sets.  
     - *Shut down with*: "Russell’s is about self-reference (sets containing themselves). This is about property overlap: `WhiteHorse ⊆ Horse` but `Horse ⊈ WhiteHorse`."  

  3. **"Color determines species"**  
     - *When*: During intensional definition discussion.  
     - *Shut down with*: "Biological species is one attribute; color is another. The paradox asks if adding *any* attribute changes the class identity."  

  ---

  ### **Dialogue Delivery: Don’t Walk Line-by-Line**  
  **Do this instead:**  
  - Present the conclusion upfront: *"A white horse is not a horse"* as a logical claim.  
  - Map to sets:  
    - Let `H = {x | x is a horse}`  
    - Let `WH = {x | x is white and x is a horse}`  
    - Claim: `WH ⊂ H`, yet "a white horse is not a horse" → exposes intensional rift.  

  ---

  ### **What to Skip**  
  - **Hardness/whiteness fragments** (e.g., "When hard and white are combined, they reside in different places").  
  - **Translation debates** (stick to "white horse ≠ horse" as the core).  
  **Why**: These distract from class membership and eat time.  

  ---

  ### **Check Question**  
  *"Why would a 3rd-century BCE logician insist 'white horse ≠ horse' if his ruler asked for all horses to be confiscated?"*  
  **Target insight**:  
  - Correct answer: **Taxonomy has real consequences**. Confiscating "horses" ≠ confiscating "white horses" — one misses non-white horses, the other excludes non-horse white things.  
  - Wrong path: "It’s wordplay" or "color matters biologically."  

  ---

  ### **Flow & Timing**  
  1. **Hook (5 min)**: Show the OOP example → "When is a subclass NOT an instance of its parent?"  
  2. **Naive Sets (10 min)**: Define `Horse`, `WhiteHorse` sets. Show `WH ∈ H` but intensional mismatch.  
  3. **Paradox Statement (5 min)**: "Gongsun Long says: White horse ≠ horse. Why would he assert this?"  
  4. **CS Stakes (10 min)**: Database example — querying `SELECT * FROM Horses` vs. `SELECT * FROM Horses WHERE color=white`. Outcomes differ if "white horse" isn’t a "horse" in the schema.  
  5. **Misconception Triage (10 min)**: Rapid-fire debunking using OOP/sets.  
  6. **Check Question + Payoff (5 min)**: Link to real-world class semantics (e.g., API design, taxonomy errors in ML).  

  **End on**: "This isn’t ancient wordplay — it’s why your inheritance hierarchies leak."  

  ---
  ### **Why This Works for CS Grads**  
  - Leverages their existing knowledge (OOP/sets).  
  - Treats the argument as a **specification problem**: When does adding a property create a new class?  
  - Makes "Why care?" concrete: Taxonomies break systems (e.g., bugs in `instanceof`, SQL joins).  

  Stick to this arc, and they’ll see philosophy as bug-fixing for human logic.
