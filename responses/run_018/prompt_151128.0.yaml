  We are constructing a detailed teaching plan for a 75-minute seminar on the normative distinction between doing harm and allowing harm (killing vs letting die) in institutional resource allocation contexts.

  Key Requirements:
  - Focus on institutional settings (e.g., healthcare, disaster response) with explicit protocols.
  - Distinction is not based solely on physical causation but on the structure of normative options.
  - Must avoid trolley problem and bedside-transplant.
  - Need a single carrying example with:
      - Identical physical outcomes in both branches (same person dies in same way at same time).
      - Divergence only in the normative framing of the agent's options (one scenario involves initiating an intervention that causes death, the other involves withholding an intervention that leads to death).
  - Avoid ambiguous causal chains and emotional distractors.

  Structure the sequence of conceptual layers, each depending on the prior one.

  Misconceptions to map:
  1. Conflating "allowing" with "not being a physical cause".
  2. Failing to distinguish an individual agent's choice from an institutional protocol's design.

  Deliberate omission: Some advanced element (e.g., legal doctrine or meta-ethical framework) that should be omitted with justification.

  Diagnostic question: One precise question for the final 10 minutes that tests understanding of the asymmetry in normative option-space.

  Response in JSON format with specified fields.

  Let's design:

  1. Sequence (ordered array of steps):
     - Start with the physical causation model to set a baseline and then show its insufficiency.
     - Then introduce the institutional context and the role of protocols in defining normative options.
     - Use the carrying example to illustrate identical physical outcomes with different normative structures.
     - Finally, discuss how the distinction affects moral evaluation.

     Steps:

     Step 1: Review the Physical Causation Model (10 minutes)
        Component: Explain that in common intuition, doing harm (killing) involves being the physical cause of death, while allowing harm (letting die) is merely failing to prevent it when one could.
        Why first: To establish the baseline understanding that students likely bring and to later challenge it.
        Dependency: None, it's the starting point.

     Step 2: Introduce Institutional Context and Protocols (15 minutes)
        Component: Describe a resource allocation system (e.g., emergency triage in a hospital during a pandemic) where decisions are made according to established rules. Emphasize that agents (e.g., doctors) are acting within predefined roles and protocols.
        Why first: To shift from individual actions to structured settings, where the agent's options are constrained by the system.
        Dependency: Step 1, because we are now showing that physical causation alone cannot account for the moral distinction in such contexts.

     Step 3: Present the Carrying Example (15 minutes)
        Component: Describe the chosen example in both branches (killing and letting die) and highlight that the physical outcome (same person dies in the same way at the same time) is identical. The difference is in the normative options: in one branch, the agent must actively do something that causes death (e.g., administering a lethal injection as per protocol when resources are reallocated), and in the other, the agent withholds a resource (e.g., not starting a life-saving treatment because the protocol says it should be given to someone else). 
        Why first: To concretely illustrate the problem and set up the core puzzle.
        Dependency: Steps 1 and 2, because it builds on the institutional context and challenges the physical causation model.

     Step 4: Analyze the Normative Option-Space (20 minutes)
        Component: Break down the agent's available choices in each scenario and how the protocol defines the "default" action. Argue that the moral distinction arises from whether the agent is deviating from the default (which in the institutional setting is defined by the protocol) or following it. In the killing scenario, the default might be to not administer the lethal injection (so doing it is an active intervention), while in the letting die scenario, the default might be to not treat (so withholding is passive). But note: in the institutional context, the protocol might redefine the default. The key is the structure of the agent's normative options, not the physical act.
        Why first: To focus on the normative structure and show that the distinction between doing and allowing is relative to the system of norms.
        Dependency: Step 3, because we are using the example to drive the analysis.

     Step 5: Synthesize and Contrast with Individual Cases (10 minutes)
        Component: Briefly contrast the institutional case with an individual case (without protocols) to show that without a system-defined default, the distinction might be drawn differently. But emphasize that in institutions, the protocol sets the baseline.
        Why first: To reinforce the importance of the institutional setting and avoid the misconception that the distinction is the same everywhere.
        Dependency: Step 4, as it builds on the analysis of the normative option-space.

     Step 6: Diagnostic Question (5 minutes) - but note the total time is 75 minutes, so adjust.

     Total time: 10+15+15+20+10+5 = 75 minutes.

  2. Carrying Example:

     Scenario: 
     - Setting: A hospital with a strict protocol for allocating the last available ventilator during a respiratory disease outbreak. There are two patients: Patient A (who is currently using the ventilator) and Patient B (who has just arrived and is predicted to have a 90% chance of survival with the ventilator, while Patient A has a 10% chance).
     - Protocol: When a new patient arrives with a higher predicted survival rate and there are no available ventilators, the protocol requires reassigning the ventilator from the current patient (with lower survival) to the new patient. This is done by removing the ventilator from Patient A (which causes immediate death) and giving it to Patient B (who then survives).
     - Two branches:
          Branch 1 (Killing): The doctor, following the protocol, removes the ventilator from Patient A (thereby causing Patient A's death) and attaches it to Patient B.
          Branch 2 (Letting Die): Consider an alternative protocol (or a different system) that does not allow reallocating a ventilator once assigned. When Patient B arrives, the doctor does not start ventilation for Patient B (because there is none available) and continues with Patient A. Patient B dies because of the lack of ventilation.

