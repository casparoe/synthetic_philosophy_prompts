     Scenario: "The Delayed Treatment Protocol"

     - Setting: A patient (Patient A) is in the emergency room and needs an immediate life-saving injection of Drug X. The hospital has a limited supply and a protocol that requires reserving the drug for patients with a higher chance of survival. 
