answer: |-
  Here's a defense of a restricted form of institutional vicarious liability, grounded in David Lewis's rejection of penal substitution but avoiding its core objection through a structural accountability model:

  **1. Lewis's Core Objection to Vicarious Punishment:**

  Lewis argues that penal substitution in criminal justice fails because:
  *   **Unjust Transfer:** Punishment is justified primarily by the offender's *personal desert* (retribution) and its functional purposes (deterrence, rehabilitation, moral communication). These justifications are inherently personal.
  *   **Failure of Function:** An innocent volunteer's suffering cannot:
      *   Satisfy the guilty party's personal desert (retribution remains unaddressed).
      *   Deter *the actual offender* from future wrongdoing (they escape unscathed).
      *   Rehabilitate *the actual offender*.
      *   Effectively communicate condemnation *to the actual offender*.
  *   **The Guilty Remain Liable:** The offender's moral and legal liability remains fully intact despite the volunteer's suffering. Punishment hasn't been applied to the deserving subject.

  **2. Repurposing the Rejection: Defending Restricted Institutional Vicarious Liability:**

  Lewis's critique targets the *transfer of personal desert* from one individual to another. We can sidestep this objection by applying his logic to *collective agents* and redefining the *nature* of the liability and penalty:

  *   **Collective Agents as Distinct Moral Entities:** The position requires the philosophical commitment that certain organized groups, like corporations, are **emergent moral agents** with **irreducible responsibilities**. This means:
      *   They possess decision-making structures, policies, goals, and capacities for action distinct from the simple sum of their individual members (e.g., a Board decision isn't just the sum of individual votes; corporate culture shapes behavior).
      *   They can hold duties and responsibilities *as an organization* that cannot be fully reduced to the duties of individual members (e.g., a duty to maintain safe systems of work, a duty of financial probity to shareholders).
      *   They can be blameworthy *as an organization* for systemic failures, flawed cultures, or inadequate oversight, even if specific individual culpability is diffuse or hard to pinpoint. (Commitment: **Robust Collective Moral Agency**).

  *   **Vicarious Liability as Structural Accountability (Not Desert Transfer):** Vicarious liability for a collective agent is *not* about transferring the personal desert of a guilty individual member (e.g., a rogue employee) onto the innocent corporation. Instead, it's about holding the *collective entity itself* accountable for a **structural or systemic failure** that *enabled* or *failed to prevent* the harm caused by the individual's action within its scope.
      *   **The Liability is the Collective's Own:** The corporation is liable *not* for the employee's desert, but for *its own failure* – a failure in its hiring, training, supervision, auditing, safety protocols, ethical culture, or compliance systems. The harm occurred because the collective agent's structures were deficient.
      *   **The Penalty Targets the Collective Structure:** Penalties (fines, injunctions, compliance mandates, reputational damage, dissolution) are imposed *on the collective entity itself* to:
          *   **Deter:** Incentivize the corporation (and similar entities) to invest in robust internal controls, ethical cultures, and effective oversight to prevent future systemic failures. Fines make negligence costly.
          *   **Reform/Rehabilitate:** Mandate changes to the corporation's *structure* – new policies, training, oversight bodies, audits – addressing the root cause of the failure.
          *   **Communicate Condemnation:** Express societal condemnation of the *organizational failure* and reaffirm standards for corporate conduct. The condemnation is directed at the *entity* for its deficient systems.
          *   **Restitution/Incapacitation:** Provide compensation (via fines or direct orders) and, in extreme cases, incapacitate the harmful structure (e.g., revoke licenses, dissolve the entity).

  *   **Avoiding Lewis's Core Objection:**
      *   **No Transfer of Desert:** Personal desert of the individual wrongdoer remains untouched. They are still potentially liable for *their own* criminal or civil actions. Vicarious liability of the corporation addresses a *separate* liability – the corporation's liability for its *own* organizational failing that contributed to the harm. Lewis's objection targets the *transfer*; here, there is no transfer, only the assignment of a distinct liability.
      *   **Functional Justification Achieved:** The penalty serves legitimate penological functions *specifically tied to the collective agent*:
          *   **Deterrence:** Targets the *corporation's* decision-making structure. Fines deter corporate negligence in oversight.
          *   **Reform:** Directly targets the corporation's deficient *systems*.
          *   **Condemnation:** Condemns the *collective entity's* failure, not the individual's desert.
          *   **Restitution:** Provides resources from the entity that benefited from or enabled the harmful activity.
      *   **The "Substitution" is Functional, Not Moral:** The penalties applied to the corporation *functionally substitute* for the impracticality (or impossibility) of perfectly holding every individual contributor to a systemic failure personally liable, and crucially, they address harm caused by the *system itself*. However, this substitution addresses the *collective's own liability* for its structural failure, not the *individual's desert*. The corporation is punished *for its own deserts* (its organizational failings), not *in place of* the individual's deserts.

  **3. The Required Restrictions:**

  This model is just only under specific conditions reflecting the "structural accountability" premise:
  *   **Scope:** The individual's wrongful act must fall within the scope of their agency for the collective and relate to its functions.
  *   **Organizational Nexus:** There must be a demonstrable link between the harm and a failure in the collective's structure, policies, supervision, or culture. Mere association isn't enough.
  *   **Penalty Proportionality & Suitability:** Penalties must be proportionate to the *collective's* fault (the severity of its systemic failure) and its capacity to bear them. They must be suitable for targeting the collective structure (e.g., fines, compliance orders, reputational impacts) – not intrinsically personal punishments like imprisonment.
  *   **No Immunity for Individuals:** Vicarious liability of the collective *must not* absolve blameworthy individuals from their own personal liability where it exists and can be proven. Both levels of accountability can coexist.

  **Conclusion:**

  David Lewis's powerful objection to penal substitution – that an innocent cannot justly bear the personal desert of the guilty – can be repurposed to defend a *restricted* form of institutional vicarious liability. By shifting the focus from transferring individual desert to holding **robust collective moral agents** accountable for **their own structural or systemic failures** that enable harm, vicarious liability becomes **structural accountability**. Penalties target the collective entity itself to achieve deterrence, reform, condemnation, and restitution specifically aimed at organizational conduct. This avoids Lewis's core objection because it does not claim the corporation suffers *instead of* the individual to discharge *their* desert; rather, the corporation is held liable and punished *for its own distinct desert* arising from its organizational failings. This defense fundamentally relies on the philosophical commitment that certain collectives, like corporations, possess **irreducible moral agency** and can bear responsibility for systemic actions and failures beyond the sum of their parts.
