  Okay, let me approach this systematically. The user wants a structured adversarial collaboration document about presentism vs eternalism, with specific sections and word counts. 

  First, I need to understand the core requirements: a neutral document both parties can sign, divided into four precise sections. The roommate is an eternalist citing relativity, while the user is a presentist emphasizing temporal experience. Their arguments seem stuck at the physics-experience divide.

  For section 1 (common ground), I'll list points that don't presuppose either ontology. Key elements include: defining both views without caricature, noting relativity's empirical success without committing to its metaphysical implications, and acknowledging the universality of temporal experience. The definitions must avoid phrases like "just space" or "denying documents exist" that triggered past accusations.

  Section 2 (disagreements) needs razor-sharp phrasing. The central conflict is whether "real" applies to non-present events. Presentism requires real=present, eternalism requires real=timelessly existing. Secondary disagreement about time's "passing" - is it fundamental or emergent? 

  Section 3 (cruxes) should focus on resolvable pressure points. The relativity-simultaneity link is prime: does relativity necessitate eternalism or merely permit it? The experience crux is trickier - can illusion theories satisfy the "datum" status? I'll frame predictions neutrally: "Presentist predicts future physics will..." not "Presentist rightly believes..."

  Section 4 (verbal disputes) must identify terminology landmines. "Exists" is clearly overloaded - presentists mean "now-existent", eternalists mean "ontologically valid". "Real" and "passage" also need disambiguation. This section might sting but prevents deadlock.

  Throughout, I'll maintain symmetric language - equal weight to both views, no "some people think" vs "science shows" imbalances. Physics claims will stick to textbook interpretations (e.g., "relativity has no preferred frame" not "relativity proves block universe"). 

  The tone should be academic but accessible - these are philosophy undergrads, not professors. Word counts will be tight but necessary for focus. Most importantly, every line must pass the "could I sign this if I were either of them?" test.
answer: |-
  Here’s a draft adversarial collaboration document for you and your roommate to review and refine together. It adheres strictly to your structure, remains neutral, and uses wording both presentists and eternalists could endorse as fair:

  ---

  **Adversarial Collaboration: On the Reality of Past, Present, and Future**  
  *Drafted for joint revision and signature by [Your Name] (Presentist) and [Roommate’s Name] (Eternalist)*  

  ---

  ### 1. Claims We Both Can Sign  
  *(~300 words)*  

  1. **Defined Positions**:  
     - **Presentism** asserts that only the present moment is ontologically real. Past events no longer exist; future events do not yet exist. Time involves genuine change and "passage."  
     - **Eternalism (Block Universe View)** asserts that past, present, and future events are equally real and exist timelessly in a four-dimensional spacetime manifold. "Now" is a perspectival label, not an objective feature of reality.  

  2. **Physics Framework**:  
     - Special Relativity (SR) empirically confirms there is no universal "now": simultaneity is frame-dependent, and there is no privileged reference frame. SR’s predictive success is uncontested.  
     - Physics does not dictate metaphysics: SR *permits* but does not *logically compel* eternalism. Presentists can accommodate SR with additional interpretive steps (e.g., positing a preferred foliation or denying SR’s ontological implications).  

  3. **Common Ground**:  
     - Both views accept the reality of past evidence (e.g., birth certificates, fossils) and future probabilities (e.g., retirement planning). Disagreement concerns *what kind* of existence these entail.  
     - Both acknowledge the vivid *phenomenology* of temporal passage ("flow" of time) as a universal human experience.  
     - Neither reduces time to "just space": temporal dimensions have unique properties (e.g., asymmetry, entropy).  

  ---

  ### 2. Where We Actually Disagree  
  *(~250 words)*  

  1. **Ontological Status of Non-Present Events**:  
     - *Presentist claim*: Only present events/times are ontologically fundamental. Non-present events are either abstractions (future) or traces/information (past).  
     - *Eternalist claim*: All events in spacetime—past, present, and future—are ontologically fundamental and equally real.  

  2. **The Nature of Temporal Passage**:  
     - *Presentist claim*: Time’s passage is objective and irreducible; the "moving now" reflects a dynamic feature of reality.  
     - *Eternalist claim*: Time’s passage is subjective or emergent (e.g., from memory/anticipation); spacetime itself is static.  

  3. **The Significance of Relativity**:  
     - *Presentist claim*: SR’s relativity of simultaneity challenges but does not refute presentism; presentism can be reconciled with SR.  
     - *Eternalist claim*: SR’s elimination of absolute simultaneity *strongly supports* eternalism as the most natural interpretation.  

  ---

  ### 3. The Cruxes  
  *(~300 words)*  

  1. **Does SR Necessitate Eternalism?**  
     - **Relevant Case**: Whether a coherent presentist model can integrate SR *without* hidden variables or privileged frames.  
     - *Presentist prediction*: Future physics or philosophy will validate presentism-compatible interpretations of SR (e.g., quantum gravity frameworks).  
     - *Eternalist prediction*: Any presentist model reconcilable with SR will be ad hoc or violate SR’s spirit of non-privilege.  

  2. **Is Temporal Passage a Datum or an Illusion?**  
     - **Relevant Case**: Whether neuroscience/physics can reduce the experience of passage to non-dynamic processes (e.g., entropy, cognitive sequencing).  
     - *Presentist prediction*: Passage cannot be fully explained without an objective "flow"; its primacy in consciousness demands ontological weight.  
     - *Eternalist prediction*: Passage will be explained as a psychological/thermodynamic byproduct; no "moving now" exists in fundamental physics.  

  3. **Can Presentism Handle Temporal Relations?**  
     - **Relevant Case**: Whether truths about past/future (e.g., "Dinosaurs existed") require eternalism’s ontology.  
     - *Presentist prediction*: Presentism can ground past/future truths via current traces or tensed facts.  
     - *Eternalist prediction*: Only eternalism provides a non-mysterious basis for cross-temporal truths.  

  ---

  ### 4. Fights We Realized Were Just About Words  
  *(~150 words)*  

  1. **"Exists" vs. "Real"**:  
     We often equivocated on "real." Presentists use "exists" for *current* being; eternalists use it for *timeless* being. Clarifying this avoided false charges (e.g., "You deny dinosaurs!" vs. "You think time is space!").  

  2. **"Passage" as Metaphor**:  
     Debates over whether "time moves" confused *linguistic metaphors* with claims. Eternalists agree time has *direction* (e.g., entropy); presentists agree "flow" isn’t literal motion. Disputes reduced when distinguishing *asymmetry* from *dynamic passage*.  

  3. **"Illusion"**:  
     Eternalists don’t deny the *experience* of passage is real; they deny it *corresponds* to fundamental reality. Presentists don’t deny spacetime models are useful; they deny they are *complete*.  

  ---  
  *This document reflects our shared understanding as of [Date]. Both parties reserve the right to revise positions pending new evidence.*  
  **[Signature Line for Presentist]**  
  **[Signature Line for Eternalist]**  

  ---

  ### Notes for Your Discussion  
  - **Neutrality Check**: Each section uses symmetric language (e.g., "Presentists claim... Eternalists claim"). Physics is described without metaphysical loading.  
  - **Refinement**: Replace bracketed text ([Date], names). Read each claim aloud together to ensure no implied bias.  
  - **Cruxes**: Predictions are framed as falsifiable commitments—this forces engagement with evidence, not just intuitions.  
  - **Verbal Disputes**: Section 4 preempts deadlocks by isolating terminology. If new linguistic clashes emerge, add them here.  

  This structure ensures you’re signing a *map of disagreements*, not a verdict. Good luck—adversarial collaboration is tough but worth it!
