  - Identity-Consistent: Focus only on coherence with your prior public commitments (your past bids and justifications). Example: "I must bid to remain consistent with my previous commitment to win." or "I quit because I have always been a consistent person."
  - Rule-Follower: In round 1, you must state aloud a stopping threshold (e.g., "I will stop at 5"). Then, for every round, your justification must be based on that rule. Example: "I bid because the current bid is below my threshold." or "I quit because the bid has reached my threshold."

