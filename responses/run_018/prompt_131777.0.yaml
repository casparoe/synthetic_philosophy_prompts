  3. Formal mechanics (15 min):
     - Draw the payoff matrix on the board: why bidding at level 6 might seem rational for the losing player? (If you are the second highest at 5, you are about to lose 5. If you bid 6, you might win and pay 6, net 4, which is better than losing 5? But if you win, you get 10-6=4, so you go from losing 5 to gaining 4? That's a swing of 9. But if the other bids again, you might end up losing 6. So it's a trap.)
     - Use an example from the game: "In pair X, the bidding went up to 8. Why didn't the player who was at 7 quit? Because they would have lost 7, but by bidding 8 they hoped to win and get 2 (10-8). But then the other player, who was at 7, would lose 7 if they quit, so they bid 9? And then the first player faces losing 8 if they quit, so they bid 10? And so on until 12."

  4. Philosophical tension (15 min):
     - "How did the reasoning profiles influence the escalation? Did the Identity-Consistent profile lead to longer bidding? Did Rule-Followers stick to their thresholds? When did switching happen? How did the requirement to write a justification affect the decision? Did it make it harder to quit because you had to admit your prior justifications were wrong?"
     - Connect to real life: "In real commitments, we often use identity-based reasoning ('I'm not a quitter') or rule-based reasoning ('I said I would...') to continue, even when instrumental reasons say stop."

  5. Missing features (10 min):
     - "This game used points, but in real life the stakes can be much higher. How might that change the escalation? Also, in real life, you don't get assigned a reasoning style — you choose it, but then you are trapped by it. The cost of switching in real life isn't 3 points; it might be embarrassment or loss of credibility. How does that compare to tearing up the card?"

  Final thoughts: "The game illustrates how the structure of a commitment (like the dollar auction) can lead to escalation, and how our reasoning patterns (especially non-instrumental ones) can become part of the trap."

  This design should create the experiential understanding of escalation we are after.
answer: |-
  ### Practical Rationality Workshop: Dollar Auction Escalation Game  
  **Designed for 14 students (7 pairs), 30-minute gameplay + 60-minute debrief**  

  ---

  #### **1. Rules, Materials, and Room Setup**  
  **Materials per Pair:**  
  - 1 deck of **profile cards** (14 total: 5 × Instrumentalist, 5 × Identity-Consistent, 4 × Rule-Follower).  
  - 30 blank **index cards** (15 per player).  
  - 2 pens.  
  - 1 **bid tracker** sheet (lists rounds 1–12; records bids, payoffs, and switches).  
  - 1 bell (for facilitator to signal rounds).  

  **Room Setup:**  
  - Arrange 7 tables in a circle, each with 2 chairs facing each other.  
  - Place materials at each table.  
  - Whiteboard visible to all: "Prize = 10 pts. Bid increment = 1 pt. Switch cost = 3 pts."  

  **Game Rules:**  
  - **Pair Assignment:** Randomly pair students. Each draws a secret profile card.  
  - **Bidding Structure:**  
    - Each round, players **simultaneously** decide to **BID** or **QUIT**, writing their choice + 1-sentence rationale on an index card.  
    - Cards are placed face-up on the table *before* revealing bids (so partners see justifications first).  
    - If both QUIT: Auction ends. Both pay last bid amount (e.g., if both quit at round 5, they pay 4 pts each).  
    - If one BIDS, one QUITS: Bidder wins prize (10 − current bid). Quitter pays last bid.  
    - If both BID: Auction continues.  
    - **Max 12 rounds**. If both bid in round 12, both pay 12 pts and get nothing.  
  - **Profile Constraints:**  
    - **Instrumentalist:** Rationale must cite *expected points* (e.g., "Bid: Winning at 6 pts nets 4, better than losing 5").  
    - **Identity-Consistent:** Rationale must cite *prior commitments* (e.g., "Bid: I said I’d win, so I must continue").  
    - **Rule-Follower:** In round 1, state a stopping threshold aloud (e.g., "I’ll quit at 5"). Rationale must cite this rule (e.g., "Quit: My rule says 5").  
  - **Switching Profiles:**  
    - At any time, a player may switch profiles by:  
      1. Announcing the switch.  
      2. Tearing up their current index card in front of their partner.  
      3. Writing a new card for the new profile.  
      4. Losing 3 pts (deducted from final score).  
  - **Key Twist:** Justifications are public *before* bids. Players see the "story" of their commitment *before* acting.  

  ---

  #### **2. Point System & Emotional Stakes**  
  - **Payoffs:**  
    - Winner: `10 − final bid` pts.  
    - Loser: `− last bid` pts.  
    - Both quit: `− last bid` pts each.  
    - Penalty: `−3 pts` per profile switch.  
  - **Stakes Without Real Money:**  
    - Points determine **final course rank** (top 3 get bonus points; bottom 3 lose participation credit).  
    - Scores displayed **anonymously post-workshop** (e.g., "Player 7: −8 pts").  
    - Emphasize: "Your rank affects peer perception in this cohort."  

  ---

  #### **3. Timeline (90-Minute Total)**  
  - **Game Phase (30 min):**  
    - **0:00–0:05:** Explain rules, assign pairs/profiles.  
    - **0:05–0:25:** Auction rounds (12 rounds max; 60 sec/round).  
      - *Facilitator cues:* "Write rationale!" (15 sec) → "Reveal cards!" (5 sec) → "Reveal bids!" (5 sec) → "Record outcomes!" (35 sec).  
    - **0:25–0:30:** Tally scores. Collect index cards/trackers.  
  - **Debrief (60 min):** See section 4.  

  ---

  #### **4. Debrief: Mapping Game Moments to Philosophical Tension**  
  **Structure:**  
  - **Part 1: Relive Critical Moments (20 min)**  
    - **Bid >5 pts:** "When bids passed 5, Instrumentalists quit. Others? Identity players said, *‘I’ve come this far’*—how did that override arithmetic?" → Link to *sunk costs*: Prior bids feel like "wasted identity" if quit.  
    - **Partner’s Glare/Silence:** "At round 8, did you see your partner’s card say *‘Quitting betrays my past self’*? How did that glare pressure you?" → Link to *social enforcement*: Justifications create mutual hostages.  
    - **Tearing vs. Bidding:** "Who almost tore their card but bid instead? That 3-pt switch cost felt like admitting ‘I was irrational’—so you paid in points to avoid ego loss." → Link to *identity-protection*: Escalation as pride preservation.  

  - **Part 2: Formal Mechanics (15 min)**  
    - Use whiteboard to graph a pair’s bids (e.g., "Bid 7: Loser pays 6 if quit, but only 3 to win? Trap!").  
    - Contrast: *Instrumental rationality* (cold math) vs. *Identity rationality* (hot self-story).  

  - **Part 3: Philosophical Tension (20 min)**  
    - "Rule-Followers: Did your threshold feel arbitrary when your partner bid 6? Why not switch? The 3-pt tear cost *simulated* real-world shame."  
    - "Identity-Consistent players: You reframed losses as ‘consistency fees.’ Does real-life escalation weaponize our self-narratives?"  

  - **Part 4: Missing Features (5 min)**  
    - "Today’s loss was points—not ruin. Real escalation risks careers or relationships. Also, *you drew profiles*—in life, we *choose* our traps. Remember: Real stakes amplify these dynamics 100x."  

  ---

  #### **5. Predicted Problems & Fixes**  
  - **Problem 1: Pairs quit early (round 1–3)** due to social discomfort.  
    - **Fix:** Pre-game pep talk: "Play to win. Top 3 get rewards!" Secretly assign one competitive Rule-Follower per pair (ensure threshold >3).  
  - **Problem 2: One partner refuses to bid**, "tanking" the game.  
    - **Fix:** Assign profiles strategically: Place Identity-Consistent players against Rule-Followers (to force escalation). Circulate to "coach" passive players: "What would your profile say now?"  
  - **Problem 3: Profiles feel arbitrary**, so players ignore justifications.  
    - **Fix:** Enforce card visibility. Announce: "Tear up cards for invalid rationales—no points for that round!"  

  ---

  #### **6. Missing Feature & Mitigation**  
  - **What’s Missing:**  
    - **No real stakes:** Points lack the terror of bankruptcy.  
    - **Assigned profiles:** Players didn’t "own" their reasoning style.  
  - **Verbal Mitigation in Debrief:**  
    - "In real life, your mortgage or reputation is on the line—that panic *accelerates* escalation. Today’s ‘tear cost’ was a proxy for the shame of admitting failure. And while I assigned profiles, in life you *craft your own trap*: You tell yourself, ‘I’m a fighter’ or ‘I never break rules.’ That’s why escalation feels personal."  

  ---

  **Final Note:** This game weaponizes the gap between *local* rationality ("One more bid!") and *global* ruin. By forcing justifications, it makes the "trap" visceral. In debrief, let students’ experiences drive the analysis—their card quotes and grimaces will say more than any lecture.
