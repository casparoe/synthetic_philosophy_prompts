  - **Slice Theory (3)** wins on purity: no identity, no essentialism, just similarities within/across worlds.  
  - **Lewis (1)** is flexible but "similarity" often implicitly carries essentialist baggage.  
  - **Indexical (4)** avoids essentialism technically, but context-dependence wrecks standard modal intuitions about truth.  
  - **Kripke (2)** is the *definition* of sneaking in essentialism to "solve" branching.

