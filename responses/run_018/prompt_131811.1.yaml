  1.  **(3) Slice-Theoretic View: 8/10**  
      *Most radical but avoids essentialism entirely by denying transworld identity, relying solely on intrinsic similarity/world-bound slices.*
  2.  **(1) Lewis + I-Relation: 7/10**  
